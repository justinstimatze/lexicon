id: lex-8njgk
name: the-impulse-arose-and-was-actively-quenched-distinguished-from-never-feeling-it-at-all
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'An agent praised for equanimity can correct the record by insisting the provoking feeling genuinely arose and was then deliberately suppressed, refusing the more flattering but false claim of never having felt it, because the distinction between absent feeling and regulated feeling actually matters. In the Jataka''s tale of Culla-Bodhi, the ascetic is explicit that the anger genuinely arose and was afterward managed; he never claims it stayed away on its own: "thus anger brings much wretchedness, and much ruin; it just began within me, but by cherishing kindly feelings I quenched it."'
related: []
evokes: [jataka, dasanipata, culla-bodhi-jataka, regulation-vs-absence-of-feeling, honest-report-of-an-arisen-impulse]
lineage:
  - source: primary
    text: jataka-chalmers1895-culla-bodhi-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 443, Culla-Bodhi-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "thus anger brings much wretchedness, and much ruin; it just began within me, but by cherishing kindly feelings I quenched it"
canonical-instances:
  - "Praised for never losing her temper in a crisis meeting, a project lead corrects her colleagues afterward: she was furious the moment the numbers came in, and simply chose not to act on it — a claim she insists is different from having felt nothing."
critical-questions:
  - "Does insisting on the distinction between suppressed feeling and absent feeling serve any purpose beyond honesty, or does it also change how much credit the agent deserves for the outward composure?"
