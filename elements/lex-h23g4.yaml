lineage:
  - source: primary
    text: hyde-dirt-rituals-stabilize-until-crisis-turns-them-catalytic
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Democratic Carnival.\"' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Where change is not in order, then, ritual dirt-work offers the virtue of non-violent stability. But where change is in order, dirt-work also has a role to play, for it simply isn’t true that these rituals are always conservative. Dirt rituals may stabilize things for years on end, but when the order is in fundamental crisis these rituals can become the focal points for change, catalytic moments for dirt’s revaluation and true structural shifts. Every so often Fat Tuesday does leak over into Lean Wednesday, and into the rest of the year as well. Regular dirt rituals are like nodes on a shoot of bamboo, repeating year after year to strengthen the growing stalk, but then, when conditions demand it, splitting open to produce new growth."
canonical-instances:
  - "A company's annual roast of senior leadership at the holiday party has, for a decade, been a harmless pressure-release that everyone forgets by January; the year the company is quietly failing and morale has collapsed, the same roast turns unexpectedly savage, and the jokes that used to dissolve into laughter instead become the first place anyone said the failing thing out loud."
  - "A nation's carnival tradition of a single day when the poor mock the rich in the streets has run for generations without incident; in a year of genuine economic collapse, the same licensed street mockery doesn't end when the holiday does, and continues into an organized protest movement that the authorities can no longer treat as contained festivity."
critical-questions:
  - "Is there any way to tell, from inside the ritual itself, whether the background order is stable or in crisis, or is this only visible in hindsight -- once a Fat Tuesday has 'leaked into Lean Wednesday' -- which would make the diagnostic move offered here unusable in the moment it would matter most?"
  - "Does this framing risk overstating rituals' causal role in structural change that was already happening for independent reasons (economic collapse, war, technological shift), making the carnival a visible marker of crisis rather than an actual catalyst of it?"
  - "If authorities can sometimes sense this shift and respond by tightening or canceling the ritual before it 'leaks,' does that count as evidence for the mechanism (they're right to fear it) or does the intervention make the mechanism unfalsifiable (any carnival that stayed contained might have been heading toward catalysis had it not been suppressed)?"
