id: lex-nx7u7
name: base-rate-neglect-inflates-posterior-by-ignoring-prior-frequency
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When estimating the probability that a case belongs to category X given diagnostic evidence, FIRST state the base-rate (how common is X in the population before this evidence?) as a number, THEN update from the description. Diagnostic descriptions feel more determinative than they are — when the description fits the stereotype, intuition swamps the prior. The corrective is procedural, not introspective: write down the base rate before reading the description."
related: [lex-37nsd, lex-3ep98, lex-4697f, lex-643m7, lex-7tvr6, lex-9eprx, lex-asu3y, lex-bun8e, lex-hrnuj, lex-jafkg, lex-k6d7u, lex-kgphf, lex-nn3u9, lex-pp5wq, lex-q77ce, lex-rktsy, lex-ry4x3, lex-s7jjg, lex-t9fs7, lex-tfpzb, lex-tmy67, lex-xu94g, lex-yejp2, lex-yf8ar, lex-yh672, lex-ythes, lex-zpfv9]
evokes: [ignore-the-prior, the-stereotype-overrides-the-base-rate, when-the-description-fits-the-prior-disappears, the-Bayesian-correction-no-one-makes, representativeness-eats-prior-probability, engineers-or-lawyers, .7-over-.3-squared-equals-5.44]
lineage:
  - source: primary
    text: tversky-kahneman-1974-judgment-under-uncertainty
    citation: "Amos Tversky & Daniel Kahneman, 'Judgment under uncertainty: Heuristics and biases,' *Science* 185(4157):1124-1131 (27 September 1974). The canonical demonstration of base-rate-neglect appears on pp.1124-1125 under the section 'Insensitivity to prior probability of outcomes.' The lawyer-engineer experiment: subjects shown a brief personality description allegedly sampled at random from a group of 100 professionals. In condition A subjects told the group had 70 engineers and 30 lawyers; in condition B told 30 engineers and 70 lawyers. Bayesian normative answer requires the ratio of posterior odds to differ by (.7/.3)² = 5.44 across conditions. Empirical finding: subjects in the two conditions produced essentially the same probability judgments. Base-rate completely ignored when a description was available, EVEN when the description was deliberately uninformative (the 'Dick' case: subjects judged P(Dick is engineer) = .5 regardless of the .7 vs .3 prior)."
    quote: "[Tversky-Kahneman 1974 p.1124-1125:] 'Insensitivity to prior probability of outcomes. One of the factors that have no effect on representativeness but should have a major effect on probability is the prior probability, or base-rate frequency, of the outcomes. ... Considerations of base-rate frequency, however, do not affect the similarity of Steve to the stereotypes of librarians and farmers. If people evaluate probability by representativeness, therefore, prior probabilities will be neglected. This hypothesis was tested in an experiment where prior probabilities were manipulated. Subjects were shown brief personality descriptions of several individuals, allegedly sampled at random from a group of 100 professionals — engineers and lawyers. The subjects were asked to assess, for each description, the probability that it belonged to an engineer rather than to a lawyer. In one experimental condition, subjects were told that the group from which the descriptions had been drawn consisted of 70 engineers and 30 lawyers. In another condition, subjects were told that the group consisted of 30 engineers and 70 lawyers. ... In a sharp violation of Bayes' rule, the subjects in the two conditions produced essentially the same probability judgments. Apparently, subjects evaluated the likelihood that a particular description belonged to an engineer rather than to a lawyer by the degree to which this description was representative of the two stereotypes, with little or no regard for the prior probabilities of the categories.' [p.1125 — the Dick case: 'This description was intended to convey no information relevant to the question of whether Dick is an engineer or a lawyer. Consequently, the probability that Dick is an engineer should equal the proportion of engineers in the group, as if no description had been given. The subjects, however, judged the probability of Dick being an engineer to be .5 regardless of whether the stated proportion of engineers in the group was .7 or .3. Evidently, people respond differently when given no evidence and when given worthless evidence. When no specific evidence is given, prior probabilities are properly utilized; when worthless evidence is given, prior probabilities are ignored.'] [The structural claim: representativeness — the perceived match between description and stereotype — operates AS IF it were probability, and crowds out base-rate information that should be combined with it via Bayes' rule. The bias is robust enough that even DEMONSTRABLY worthless evidence triggers it.]"
  - source: practitioner
    text: kahneman-2011-thinking-fast-and-slow
    citation: "Daniel Kahneman, *Thinking, Fast and Slow* (Farrar Straus and Giroux, 2011). Chapter 14 'Tom W's Specialty' and Chapter 16 'Causes Trump Statistics' re-frame the 1974 result through the System 1 / System 2 lens that organizes Kahneman's later work: representativeness is a System-1 substitution heuristic — when asked for a probability (a hard question), the mind silently substitutes 'how representative is this case of the category?' (an easier question) and answers that one instead. Base-rate-neglect is the diagnostic signature of this substitution. Kahneman also distinguishes 'statistical' vs 'causal' base rates: causal base rates (rates that have an intuitive narrative) are used; statistical base rates (just-a-number frequencies) are ignored. This distinction matters for interventions: presenting the base rate as a causal story (95% of cab accidents involve Green cabs because Green cabs serve high-traffic routes) shifts behavior, whereas presenting it as a pure frequency does not."
    quote: "[Tier-2 deepening — Kahneman 2011 chs 14, 16: representativeness substitutes for probability; the System-1 heuristic answers 'how similar?' when the question is 'how likely?' Statistical base rates (just numbers) are reliably ignored; causal base rates (numbers embedded in a narrative explaining WHY the rate is what it is) get more uptake. The 1974 result is robust over 50 years; the mechanism is now better understood as a substitution heuristic, not just a passive failure to integrate prior + likelihood.]"
  - source: practitioner
    text: bar-hillel-1980-base-rate-fallacy
    citation: "Maya Bar-Hillel, 'The base-rate fallacy in probability judgments,' *Acta Psychologica* 44(3):211-233 (1980). Bar-Hillel coined the term 'base-rate fallacy' and provided the first systematic taxonomy of conditions under which base rates ARE vs ARE NOT integrated: relevance, causal connectedness, and specificity of the diagnostic information all moderate the effect."
    quote: "[Bar-Hillel 1980 names the fallacy and maps when it does/doesn't fire — relevance, causal connectedness, and specificity of the diagnostic information moderate whether base rates get integrated.]"
canonical-instances:
  - "Tversky & Kahneman 1974 lawyer-engineer experiment (the canonical demonstration): subjects given brief personality descriptions sampled from a group described as either 70 engineers + 30 lawyers OR 30 engineers + 70 lawyers. Bayesian update requires the posterior odds to differ by (.7/.3)² = 5.44 across conditions. Subjects produced essentially identical probability judgments in both conditions: the description's perceived match to the engineer/lawyer stereotype dominated, the .7 vs .3 base rate was ignored. The 'Dick' control case — uninformative description — showed subjects gave .5 regardless of prior, when they should have given the prior itself"
  - "medical-screening false-positive paradox: disease with 1% prevalence, test with 90% sensitivity and 9% false-positive rate. A positive result has posterior P(disease|positive) ≈ 9% (Bayes: 0.01×0.90 / [0.01×0.90 + 0.99×0.09] ≈ 0.092). Intuition (representativeness): the test is 'good' so a positive means 'probably sick.' Operational consequence: mass screening for rare conditions generates floods of false positives that swamp the true-positive signal. Casscells, Schoenberger & Grayboys 1978 *NEJM* showed even physicians fail this calculation — most gave answers near 90% instead of near 9%"
  - "xkcd 1132 'Frequentists vs Bayesians' (2012-11-09): neutrino detector with p=1/36 false-positive rate reports 'yes, the sun has gone nova.' Frequentist statistician accepts the result (p<0.05) and bets on it. Bayesian statistician applies the prior — P(sun has gone nova during the experiment) is astronomically small — and concludes the detector is far more likely lying than the sun exploding. The comic IS the transferable case: failing to apply the prior turns a 1/36 false-positive into a confident wrong conclusion. Canonical-instance because the comic explicitly names the missing operation"
  - "drug-testing rare substances: workplace drug test with 99% sensitivity and 99% specificity, used on a population with 1% true usage rate. P(actually using | positive test) = 0.01×0.99 / [0.01×0.99 + 0.99×0.01] = 0.50. Half of positives are false. Policy intuition (representativeness): 'the test is 99% accurate, so a positive means 99% guilty.' The base rate eats the conclusion. Same structure as medical-screening — applies whenever you test for a rare condition with an imperfect test"
  - "diagnostic 'when you hear hoofbeats, think horses not zebras' (the medical-school mnemonic): the rule literally tells clinicians to weight the prior probability of common diagnoses over rare ones, against the pull of rare diagnoses that 'fit' an unusual symptom pattern. The mnemonic is a folk-name for the corrective discipline. Failure mode: 'zebra' diagnoses are over-pursued when residents see a striking symptom that matches a memorable rare-disease vignette — representativeness over base rate. Transferable to ANY diagnostic field where common conditions outnumber dramatic-but-rare ones"
  - "anti-money-laundering false-positive avalanche: bank transaction-monitoring systems use rules that flag 'suspicious' patterns. P(actually laundering | flagged) is extremely low because base rate of money-laundering is tiny (<0.1% of transactions) and the rules have non-trivial false-positive rates. Compliance teams drown in flags; real cases are needles in a manufactured haystack. Industry-wide failure to set thresholds that account for base rate produces a known systemic inefficiency"
  - "AI-classifier for rare events (fraud, malicious traffic, manufacturing defects): a classifier with 99% accuracy on a population with 0.1% positive class produces 90% false positives by raw count. Operational implication: precision-recall curves matter more than accuracy, AUC matters less than calibrated posterior. Teams that report 'our model is 99% accurate' without specifying base rate are reporting a number that means almost nothing. The base-rate-neglect-failure-mode is structural in ML deployments for rare-class detection"
  - "operationally distinct from lex-7tvr6 outside-view-anchor-forecasts: outside-view is the FORECASTING discipline (estimate completion time / success rate of a future project by looking up the base-rate of comparable past projects, before adjusting for inside-view specifics). lex-nx7u7 is the DIAGNOSTIC-INFERENCE failure (estimating P(category | description) without weighting prior P(category)). Same substrate-claim — priors matter — applied in different temporal directions. They are sister atoms covering the same underlying Bayesian discipline in forward vs backward inference"
  - "operationally distinct from lex-tfpzb survivorship-bias-omits-the-eliminated-from-the-sample: survivorship is non-random sampling (the eliminated cases are absent from your data); base-rate-neglect uses a representative sample but fails to weight prior P(category) against the diagnostic evidence. Both can co-occur — biased sampling that ALSO ignores base rate — but the corrective is different (rebuild the sample vs add the prior)"
  - "operationally distinct from lex-hrnuj anchoring-bias: anchoring is pull toward an arbitrary reference number in NUMERICAL estimation; base-rate-neglect is failure to integrate prior frequency in CATEGORY-MEMBERSHIP estimation. Same paper (T-K 1974), different mechanism, different corrective. Anchoring's corrective is procedural (estimate before exposure); base-rate-neglect's corrective is also procedural (write down the prior before reading the description). Co-fire in some cases (e.g., the prior IS the anchor)"
  - "the transferable methodological consequence: any probability claim of form 'P(X|evidence) ≈ Y' requires explicit accounting of P(X) before the evidence. The discipline is procedural: write down the base rate first as a number; only then introduce the diagnostic evidence. Failure-mode signature: 'the description is so [characteristic / detailed / fitting] that the prior doesn't matter' — this intuition is exactly the bias. Tversky-Kahneman's Dick-case is the existence proof: even when the evidence has zero diagnostic value, intuition overrides the prior"
  - "xkcd 1132 'Frequentists vs Bayesians' (2012-11-09): see canonical-instance above — the comic literally enacts the transferable failure mode and its corrective. The Bayesian's response — 'Bet you $50 it hasn't' — is the operationalization of weighting the prior; the frequentist's response is the failure"
critical-questions:
  - "is base-rate-neglect a separate bias from representativeness, or is it the diagnostic signature of representativeness? Tversky-Kahneman 1974 treats them as connected: representativeness is the heuristic, base-rate-neglect is one of its consequences (alongside insensitivity to sample size, misconceptions of chance, illusion of validity, misconceptions of regression). The transferable use treats base-rate-neglect as a self-contained primitive because the failure mode is recognizable WITHOUT invoking the heuristic mechanism. A practitioner can apply the corrective (write down the prior) without theoretical commitment to representativeness as cause"
  - "when do people DO use base rates? Kahneman 2011 distinguishes statistical vs causal base rates: statistical (just-a-number frequencies) are ignored; causal (rates embedded in narrative explaining WHY) are integrated. Operational implication: presenting a base rate as 'P=0.1' is weaker than presenting it as 'rare because…' Discriminator: in interventions, frame base rates as causal stories where possible"
  - "is base-rate-neglect a uniform failure or does expertise mitigate it? Casscells, Schoenberger & Grayboys 1978 (NEJM) found Harvard Medical School staff and students gave the median answer of 95% to a problem with correct answer ~2%. Expertise within the relevant domain does NOT reliably correct it. Procedural training (forcing tree-diagrams or Bayes-table construction) does. Discriminator: training EXPLICIT in Bayesian arithmetic is the reliable mitigation; intuitive domain expertise is not"
  - "does the bias apply when the prior is INTUITIVELY clear (e.g., medical screening where everyone knows the disease is rare)? Yes — the laypersons and even physicians who 'know' the prevalence is 1% still produce posterior estimates near the test sensitivity. Knowing the prior does not entail using it. The corrective is procedural: requiring the prior to be WRITTEN DOWN BEFORE the diagnostic evidence is integrated"
  - "are there cases where the representativeness intuition is RIGHT to dominate? When P(category) is approximately uniform across categories (no informative prior), representativeness yields approximately the Bayesian answer. The failure mode is loud when priors are SKEWED — rare conditions, unusual professions, low-prevalence positive class. Transferable rule: pay extra attention to base rates when one category is much rarer than another. In approximately-uniform cases, the bias is approximately harmless"
