id: lex-xjsgd
name: a-coercive-election-threat-hardens-resistance-and-backfires
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A threat meant to intimidate voters away from a candidate or choice can instead harden resistance and increase support for exactly that choice, because being threatened into compliance reads as an insult demanding defiance rather than a reason to comply. Southern leaders, before the 1860 election, announced in advance that they would secede if Lincoln won and would submit to his rule under no circumstances. Douglass names the effect directly: 'this southern threat lost many votes, but it gained more than would cover the lost. It frightened the timid, but stimulated the brave; and the result was -- the triumphant election of Abraham Lincoln.' He identifies the specific insult in the threat's form: 'It was not only unfair, but insolent, and more like an address to cowardly slaves than to independent freemen; it had in it the meanness of the horse-jockey, who, on entering a race, proposes, if beaten, to run off with the stakes.' The mechanism splits the audience into two groups with opposite reactions -- 'it frightened the timid, but stimulated the brave' -- and the outcome depends on which group is larger or more politically decisive; the threat is not simply ineffective, it actively converts some fraction of an otherwise-persuadable audience into partisans of the threatened choice, purely because a demand for submission was made where none was owed."
related: [lex-bjqgm]
evokes: [it-frightened-the-timid-but-stimulated-the-brave, rule-or-ruin-intimidation, the-meanness-of-the-horse-jockey, an-insult-and-a-challenge-in-one]
