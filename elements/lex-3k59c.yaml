id: lex-3k59c
name: manufacturing-supernatural-ambiguity-as-protective-armor
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person can deliberately disguise themselves to look like a possibly-sacred or supernatural being specifically so that an armed, hostile crowd hesitates to attack them, exploiting shared fear of harming something sacred rather than relying on concealment or not being seen at all. After a first attempt to steal the girl ends in her scream and a chase, Red Deer paints High Horse 'solid white all over,' then black stripes over the white, with black rings around his eyes, until the effect 'scared even him a little.' The costume is built for the moment High Horse IS seen, caught in the act with nowhere left to hide. When the whole village turns out with guns and bows, some braves want to shoot, but 'the others said he might be some sacred being and it would bring bad trouble to kill him,' and the ambiguity itself, not distance or darkness, is what lets him run free."
related: []
evokes: [black-elk-speaks, high-horses-courting, black-rings-around-his-eyes, some-sacred-being, disguise-built-to-be-seen-not-hidden]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch6-high-horses-courting
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 6, 'High Horse's Courting.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Then he painted High Horse solid white all over, and after that he painted black stripes all over the white and put black rings around High Horse's eyes. High Horse looked terrible. [...] 'Now,' Red Deer said, 'if you get caught again, everybody will be so scared they will think you are a bad spirit and will be afraid to chase you.' [...] Some braves wanted to shoot at him, but the others said he might be some sacred being and it would bring bad trouble to kill him."
canonical-instances:
  - "A prisoner facing an armed camp guard smears themselves with blood and adopts a fixed, unblinking stare, hoping to be mistaken for something too disturbing or unclean to touch rather than trying to hide from view."
  - "A protester wears a mask evoking a locally feared folk figure during a confrontation with security forces, betting that the ambiguity about who or what they represent buys hesitation that a plainly identifiable human opponent would not."
  - "A struggling business rebrands its erratic, unpredictable behavior as deliberate 'disruption' or 'visionary chaos,' hoping onlookers hesitate to move against something that might be more significant than it appears rather than simply incompetent."
critical-questions:
  - "Does the disguise actually work because the crowd genuinely believes in the possibility of a sacred being, or would any sufficiently alarming, unclassifiable appearance produce the same hesitation regardless of the specific supernatural framing?"
  - "Red Deer says the costume scared even him -- does the disguise-maker's own fear response function as a kind of test run, confirming the design will work on strangers, or is it irrelevant to whether it actually will?"
  - "This tactic depends entirely on the crowd sharing a belief system in which killing a sacred being carries real consequences -- what happens to the strategy the moment even one person in the crowd doesn't share that belief and is willing to shoot regardless?"
status: active
