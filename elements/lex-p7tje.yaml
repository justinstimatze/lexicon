name: the-same-skill-at-controlling-openings-both-escapes-and-traps
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "The cunning that lets you find a gap to slip through and steal or escape by is the identical skill, pointed the other direction, that lets you seal every gap to confine and capture something else -- it isn't two separate abilities, one defensive and one offensive, but one capacity for reading and controlling passages. Hyde names this directly: \"we have a first mark of trickster's cunning: it closes off a passage to capture its prey, or it finds a hole to elude its foe. It can seize an opportunity or block an opportunity.\" The humpback whale demonstrates the blocking half concretely: it \"dives deep and then swims in a slow circle, exhaling all the while, so that a cone of bubbles rises through the water. The herring in the school misperceive this 'bubble net' as a barrier through which they cannot swim. Having confined the school, the whale then rises through the center of the bubble net, its mouth open and filling with fish.\" The barrier is fake -- an illusion of solidity where there is only rising air -- but it functions exactly like a real wall because the herring's own perceptual limits complete the trap. The same reasoning that finds or fabricates an opening to slip through, applied in reverse, fabricates a closure that looks impassable. Diagnostic move: when assessing someone's ability to find gaps in a system -- to escape, steal, or exploit an opening -- credit them with the mirror-image ability too, closing gaps to trap or confine, since both draw on the same underlying skill of reading where passages are and controlling whether they're open or closed."
