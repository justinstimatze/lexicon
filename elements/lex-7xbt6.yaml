id: lex-7xbt6
name: a-systems-structure-mirrors-its-builders-communication-structure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a software architecture surprises by mirroring org-chart boundaries, surface Conway's law — system structure mirrors the communication structure of its builders; designs that fight this need explicit cross-team coordination, or they regress."
related: [lex-spk4s, lex-5d8hm, lex-fxtuq, lex-zjyr8, lex-4snxu]
evokes: [conways-law, how-do-committees-invent, melvin-conway-1968, the-org-chart-ships, four-teams-four-compiler-passes, inverse-conway-maneuver]
lineage:
  - source: primary
    text: conway-1968-how-do-committees-invent
    citation: "Melvin E. Conway, 'How Do Committees Invent?', Datamation 14(4):28-31 (April 1968; the paper was rejected by Harvard Business Review in 1967). Author-hosted full text at melconway.com. The substrate-claim: any organisation that designs a system is constrained to produce a design whose structure copies the organisation's own communication structure — because the parts can be made to fit together only where the people building them communicate, so the technical seams fall on the social seams. Conway frames the correspondence formally as a HOMOMORPHISM from the system graph to the design-organisation graph; he asserts a correspondence, not a fixed direction of cause, and aims it broadly ('defined more broadly here than just information systems') though it is cited mostly in software architecture."
    quote: "[Conway 1968, the Conclusion's verbatim thesis:] 'organizations which design systems (in the broad sense used here) are constrained to produce designs which are copies of the communication structures of these organizations.' [Conway's own informal version up front:] 'Any organization that designs a system (defined more broadly here than just information systems) will inevitably produce a design whose structure is a copy of the organization's communication structure.' [The mechanism, as inflexibility:] 'To the extent that an organization is not completely flexible in its communication structure, that organization will stamp out an image of itself in every design it produces. The larger an organization is, the less flexibility it has and the more pronounced is the phenomenon.' [The formal shape:] 'there is a homomorphism from the linear graph of a system to the linear graph of its design organization.'"
canonical-instances:
  - "the four-team compiler: the oft-cited illustration — if four groups are assigned to write a compiler, you get a four-pass compiler. The number and boundaries of the modules track the number and boundaries of the teams, because cross-module interfaces require cross-team negotiation and teams minimise that"
  - "microservices and the 'inverse Conway manoeuvre': because system structure mirrors team structure, organisations deliberately RESHAPE TEAMS to get the architecture they want (small, loosely-coupled, independently-deployable teams to get small, loosely-coupled services). The law is run backwards as a design lever — change the comms graph to change the artifact"
  - "tangled integrations across organisational boundaries: the integration points hardest to get right are exactly the ones spanning different firms, departments, or time zones, where communication is most expensive — so defects and impedance-mismatches cluster on the social seams rather than on the technically-hardest parts"
  - "Conway directed the law beyond software: any designed artifact built by a group (a report with chapters per author, a building by sub-contracted trades, a curriculum by departments) carries the fingerprint of who-talked-to-whom. The homomorphism is general; software just makes the module/team correspondence unusually legible"
  - "operationally adjacent to lex-spk4s isolate-component-for-separate-treatment: modular decomposition assumes you can cut a system at clean interfaces and treat parts separately — Conway warns the cuts you can ACTUALLY make and maintain are those aligned with communication boundaries; a decomposition that fights the org chart is eroded by the cost of cross-boundary coordination. And lex-5d8hm denied-structure-becomes-unaccountable-informal-hierarchy: the real communication structure (often informal, not the published org chart) is what the system mirrors, so an unacknowledged comms structure still stamps itself on the design"
critical-questions:
  - "what does your current communication structure predict the system will look like — and is that the architecture you want? If the desired architecture and the team topology disagree, the team topology usually wins. Decide whether to change the architecture target or (inverse-Conway) change the team structure"
  - "where are the system's seams falling — on the technical boundaries you intended, or on the social boundaries of who talks to whom? Misplaced seams (a module split across two teams, or two modules owned by one over-loaded team) signal a comms/architecture mismatch that will generate friction and defects"
  - "is the communication structure you're mirroring the FORMAL org chart or the INFORMAL real one? Conway's law tracks actual information flow; if informal back-channels carry the real coordination, the system mirrors those, not the published hierarchy — so map the real comms graph before predicting"
  - "are you fighting the law or using it? The productive move is rarely to deny the correspondence; it is to engineer the communication structure (team boundaries, ownership, interfaces, who-sits-with-whom) so the architecture you want is the one the org will naturally produce"
status: active
