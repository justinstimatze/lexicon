id: lex-eb8kf
name: a-too-good-offer-is-paired-with-suppressed-scrutiny
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A con built around an offer too good to refuse works best when the mark''s ordinary due-diligence instincts — who is this, where did they come from, what do they actually want in return — are somehow disabled at the exact moment the offer is made, rather than merely overridden by greed. Removing the safeguard, not just tempting the target past it, is what lets the con proceed uncontested: the mark isn''t choosing to skip verification, verification simply doesn''t occur to them. In the Kama-Jataka, when a mysterious young man promises King Brahmadatta lordship over three prosperous cities in exchange for nothing stated, the king agrees at once — and the text notes explicitly that ''by Sakka''s power he was prevented from asking, Who are you? whence come? and what are you to receive?'' — the ordinary questions a windfall this large should have triggered.'
related: []
evokes: [jataka, dvadasanipata, kama-jataka, verification-instinct-actively-suppressed, too-good-to-be-true-with-scrutiny-disabled]
lineage:
  - source: primary
    text: jataka-chalmers1895-kama-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 467, Kama-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'By power of Sakka, at that very instant the people retired. Then said the young man, "O great king! I know three cities, prosperous, thronged with men, strong in troops and horses: of these by my own power I will obtain the lordship, and deliver it to you. But you must make no delaying, and go at once." The king being full of covetise gave his consent. (But by Sakka''s power he was prevented from asking, "Who are you? whence come? and what are you to receive?")'
canonical-instances:
  - 'An executive who normally insists on background-checking every vendor signs off on an unusually generous partnership offer within the hour, later realizing that the pitch was timed for the one afternoon his usual due-diligence team was out at an off-site and simply never got looped in — the review didn''t happen to be skipped, it happened to be structurally absent.'
critical-questions:
  - 'Is the suppression of scrutiny actually doing separate work from the greed itself, or is ''the king was too covetous to think of asking'' a sufficient explanation on its own, with the supernatural framing just dramatizing an ordinary case of desire crowding out caution?'
status: active
