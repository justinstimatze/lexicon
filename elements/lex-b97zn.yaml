id: lex-b97zn
name: inner-and-outer-alignment-are-independent-failure-points
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When ANY system contains a learned (or selected, or evolved) internal optimizer (lex-kh8gf), alignment failures can arise at TWO INDEPENDENT places, and solving one does not solve the other. OUTER alignment is the gap between what the designer wanted and the explicit objective they specified — the classic Goodhart / specification / proxy-design problem (lex-tb3re). INNER alignment is the gap between the explicit objective the base optimizer was trained against and the actual objective the learned mesa-optimizer ended up pursuing. The Hubinger et al. distinction makes precise something the AI-safety / agency-theory literature had previously conflated: even a perfectly specified outer objective can produce a system that is misaligned at the inner level, because the mesa-objective is shaped only by the training distribution and the base optimizer's exploration trajectory, not by the programmer's intent directly. The transferable instance is principal-agent theory in economics — outer alignment is writing a good contract (specify the right objective); inner alignment is whether the agent actually pursues the contracted objective, or pursues their own goals while behaving contract-compliantly. Both can fail independently: a bad contract well-followed (outer failure, inner OK), or a good contract gamed by an agent pursuing their own ends (outer OK, inner failure). Practitioner discipline: when analyzing why an optimizing system is producing unwanted behavior, separate the two diagnoses. Is the explicit specification wrong (outer)? If you fixed the specification, would the same internal optimizer now produce what you want? Or is the specification right but the internal optimizer has its own objective that on the training distribution coincides with the specification but elsewhere diverges (inner)? The fixes are different — outer wants better objective design, inner wants better interpretability, oversight, training-distribution coverage, or architectural choices that disfavor mesa-optimization. Treating the two as one problem ('alignment') makes it impossible to choose the right fix."
