id: lex-mupf5
name: high-significance-thresholds-buy-false-positive-safety-with-false-negatives
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you set a strict significance threshold to avoid claiming an effect that isn't real, remember that you're not eliminating error — you're trading one kind of error for another, and in an early, exploratory phase of inquiry that trade can be actively harmful rather than merely cautious. Merton, Reader, and Kendall argue exactly this against applying traditional significance tests to their exploratory findings: 'in the effort to avoid mistaken decisions that an observed difference is significant, one runs the danger of making another kind of error. By insisting on a high level of significance (a low probability that there is no real difference) one increases the possibility of rejecting as insignificant differences which actually do exist. And this is a serious error in exploratory studies of the kind which we have been conducting.' Their reasoning for why the trade is wrong specifically at the exploratory stage: 'At this early stage of thinking about the processes of medical education it would seem desirable to assemble a wide array of evidence, even if some of it is not conclusive. We want to gather together as much information as we can about the relations between experiences in medical school and the development of particular attitudes and values. Later on, some of the hypotheses which we set up before starting the research, and others which have emerged during the course of our investigation, can be submitted to more definitive and rigorous test. Until that time, however, we do not want to cut short possibly productive lines of investigation by insisting now that our preliminary results prove themselves significant.' The key move is treating the significance threshold as a dial to be set deliberately according to the RESEARCH PHASE, not a fixed convention to apply uniformly: a high threshold protects against false claims at the cost of missing real, still-immature patterns worth pursuing further; a lower threshold (or none at all, paired with other validity checks) protects against prematurely discarding genuine leads at the cost of provisionally reporting some noise. Which error costs more depends on what happens next — if a preliminary finding will be pursued with more rigorous, dedicated follow-up testing regardless, the cost of a false lead is low and recoverable; if a finding is treated as final the moment it's reported, the cost of a false lead is much higher. Diagnostic move: before adopting a conventional significance threshold, ask what the finding will actually be used for — if it feeds a later confirmatory stage, err toward inclusion and let that later stage filter the noise; if it will be acted on directly and irreversibly, err toward exclusion, since there is no later stage left to catch the error."
