lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Prediction and Prophecy in the Social Sciences' (address delivered to the Plenary Session of the 10th International Congress of Philosophy, Amsterdam, 1948), Ch. 16 of Conjectures and Refutations (Routledge Classics, 2002), pp.462-463, Section X."
    quote: "'This becomes clear when we realize that a revolution always destroys the institutional and traditional framework of society. It must thereby endanger the very set of values for the realization of which it has been undertaken. Indeed, a set of values can have social significance only in so far as there exists a social tradition which upholds them. This is true of the aims of a revolution as much as of any other values. But if you begin to revolutionize society and to eradicate its traditions, you cannot stop this process if and when you please. In a revolution, everything is questioned, including the aims of the well-meaning revolutionaries; aims which grow from, and which were necessarily a part of, the society which the revolution destroys.'"
canonical-instances:
  - "A new leadership team, hired specifically to fix a toxic culture, decides the fastest path is to fire the entire management layer and rebuild reporting structures from scratch, believing this finally clears room for the collaborative values they were brought in to install. Those very values -- trust, psychological safety, willingness to speak up -- were things the previous team had been slowly building through specific relationships and habits; wiping the slate erases the only channels those values were traveling through, and nothing guarantees the new structure grows anything resembling them."
  - "A newly appointed editor, hired to fix a newsroom's stale conventions, fires the senior staff and scraps the existing style and sourcing standards overnight, planning to replace them with better ones once the old guard is gone. The paper's actual credibility with readers was carried by those senior relationships and inherited standards, not by an abstract commitment to 'quality journalism' floating free of any of it -- and the promised better standards, invented from scratch under deadline pressure, have no track record and nothing forcing them to be better than what they replaced."
critical-questions:
  - "Doesn't this argument function as a blanket defense of the status quo against any deep reform -- does everything have to change slowly or not at all? Popper's own preference, developed elsewhere in his work, is for piecemeal reform that targets specific, concrete harms rather than wholesale demolition -- this atom takes aim at one specific move: destroying the entire carrying framework at once and trusting good intentions alone to reconstruct the values afterward. Change that keeps enough of the existing structure operating to carry the intended values through the transition is a different proposal than the one being critiqued here."
  - "Some revolutions do seem to preserve or even strengthen certain values afterward -- doesn't that count as a counterexample? Popper's claim describes a risk built into the mechanism, and a risk can fail to materialize in a given case without the mechanism going away -- a revolution can preserve some values when enough of the surrounding tradition survives, whether by luck or by the revolutionaries' own restraint. What the atom flags is that the revolutionary method itself does nothing to protect this outcome, and the values that do survive typically do so because some carrying structure was, in practice, left standing rather than genuinely destroyed."
