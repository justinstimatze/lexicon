id: lex-efaef
name: a-conveniently-unclaimed-gift-is-itself-the-red-flag
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When something valuable or appealing turns up conveniently unclaimed at exactly the spot where you've been doing something you shouldn't, don't treat the absence of an owner as good luck -- treat it as the first and clearest piece of evidence that something is wrong. In Cushing's telling, a priest's daughter who has been improperly using a sacred spring finds a beautiful, abandoned child playing in its waters and takes it home, moved by sympathy for what looks like parental cruelty. Her father, hearing only the barest report, immediately rejects the sentimental explanation everyone else accepts: 'Do you suppose any mother would leave her own child in the waters of this or any other spring? There is something more of meaning than seems in all this.' His reasoning is precise -- he separates what's actually impossible (a mother genuinely abandoning her child) from what's merely foolish (someone choosing to pick up an unclaimed thing found in a place where they'd already been doing wrong): 'It was impossible... that a woman should be so foolish as to leave her child... But it is not impossible... that one should be so foolish as to take into her arms a child found as this one was.' The child turns out to be the offended Serpent of the Sea in disguise, sent as exactly the mechanism of punishment the sympathetic framing was designed to obscure. Diagnostic move: when something desirable appears with no traceable owner, right where you've been cutting a corner or breaking a rule, don't accept whatever sympathetic story makes taking it feel natural -- ask what's actually impossible about the situation as presented versus what's merely a flattering story you'd like to believe, and treat the gap between those two as the signal worth investigating before you act."
