name: forecasting-on-a-causal-driver-relocates-uncertainty-not-removes-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "The GBD population-forecasting team explicitly names a trade-off most forecasters leave implicit. You can build a model that predicts an outcome from time alone -- easy, because time is trivial to project forward, but it silently assumes that whatever correlation held between time and the real causal determinants in the past will keep holding in the future, with no mechanism forcing that to be true. Or you can build a model on EXPLICIT causal drivers (educational attainment and contraceptive access, in their fertility model), which lets you ask policy-relevant what-if questions -- what happens if a specific driver changes -- something a time-alone model has no way to answer. Building on explicit drivers does not shrink the forecasting problem, though; each driver itself now has to be forecast decades into the future, and the paper is candid that this is a straight trade-off between the benefit of an interpretable, intervenable model and the compounding cost of forecasting the drivers rather than the outcome. Transferable move: before adopting a driver-based or mechanistic model over a naive time-trend extrapolation because it 'explains' the outcome, name what happens to the uncertainty -- it doesn't vanish, it moves from the outcome variable to the driver variables, and if the drivers are themselves hard to forecast (or their future relationship to the outcome could shift, same as time's could), the model has bought interpretability and intervenability at the price of a new, harder-to-see forecasting problem stacked underneath the first one. The right question isn't 'is a causal model better than a trend line' in the abstract -- it's whether the drivers are actually easier to forecast, and more stably related to the outcome, than time itself was."
