id: lex-yefqs
name: general-categories-are-keyed-to-personal-salience-not-shared-essence
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When two people are locked in an unresolved argument over what a general category truly means (good code, real journalism, professionalism, art), and each is certain their definition captures the thing's actual nature, consider Spinoza's account of where general/abstract notions come from and what it implies about such disputes. His mechanism: the human body can only form a limited number of distinct images at once; when many similar particular things are experienced, that capacity is exceeded, the mind 'loses count of small differences between individuals... and their definite number,' and distinctly imagines only whatever POINT the individuals had most in common in their effect on that specific body. Crucially, WHICH point that is varies per person, tracking whichever trait most often or most vividly struck them: 'those who have most often regarded with admiration the stature of man, will by the name of man understand an animal of erect stature; those who have been accustomed to regard some other attribute, will form a different general image of man, for instance, that man is a laughing animal, a two-footed animal without feathers, a rational animal... everyone will form general images of things according to the habit of his body.' Because the abstract category is generated by whatever happened to dominate one particular observer's exposure history -- not by any property genuinely common to and constitutive of every instance -- it functions as a record of that observer's history, not as a report on the object's essence (Spinoza elsewhere argues, II. Prop. xxxvii, that what is equally present in every part and the whole never constitutes any particular thing's essence). The diagnostic reframe: a circular dispute over an abstract category's 'true meaning' is often not a contest between one correct and one mistaken definition, but a collision between two different salience-histories, each definitionally sincere and each equally non-authoritative about the category's actual nature. Portable beyond Spinoza's zoological example: two engineers arguing over what 'good code' really means -- one insisting on clean naming, another on raw performance -- may each be generalizing from whichever failure mode most damaged them earliest in their career, not from a privileged view of code's essential nature; a debate over what 'real journalism' is that keeps looping without resolution may reflect each side generalizing from the specific outlets or reporters that most shaped their trust or distrust, not a disagreement resolvable by better arguing. Scope: this does not make all general categories arbitrary or equally useless -- Spinoza separately holds that some notions really are common to all bodies and adequately conceived (see lex-6mwqy's second kind of knowledge); this atom applies specifically to categories formed by imaginative overload of particular instances, not to properly derived common notions. Nor is it a claim that no definition is ever better than another -- only that certainty about a category's 'true meaning,' by itself, is not evidence the definer has actually reached the object's essence rather than their own history."
related: [lex-acmmk, lex-94nsz, lex-2vpet]
scaffolds-from: [lex-2vpet]
evokes: [animal-of-erect-stature, laughing-animal-two-footed-without-feathers, according-to-the-habit-of-his-body, powers-of-imagination-break-down]
lineage:
  - source: primary
    text: spinoza-1677-ethics-part-ii-general-notions-from-imaginative-overload
    citation: "Baruch Spinoza, Ethica (1677 posthumous), Part II 'On the Nature and Origin of the Mind,' Prop. XL, Note I. Elwes translation (Project Gutenberg)."
    quote: "From similar causes arise those notions, which we call general, such as man, horse, dog, &c. They arise, to wit, from the fact that so many images, for instance, of men, are formed simultaneously in the human mind, that the powers of imagination break down, not indeed utterly, but to the extent of the mind losing count of small differences between individuals (e.g. colour, size, &c.) and their definite number, and only distinctly imagining that, in which all the individuals, in so far as the body is affected by them, agree... We must, however, bear in mind, that these general notions are not formed by all men in the same way, but vary in each individual according as the point varies, whereby the body has been most often affected and which the mind most easily imagines or remembers. For instance, those who have most often regarded with admiration the stature of man, will by the name of man understand an animal of erect stature; those who have been accustomed to regard some other attribute, will form a different general image of man, for instance, that man is a laughing animal, a two-footed animal without feathers, a rational animal, and thus, in other cases, everyone will form general images of things according to the habit of his body."
canonical-instances:
  - "The direct textual anchor: different observers define 'man' as 'an animal of erect stature,' 'a laughing animal,' 'a two-footed animal without feathers,' or 'a rational animal' depending purely on which trait most often struck their own body -- not on any privileged access to man's actual essence."
  - "Two engineers arguing over what 'good code' really means -- one insisting on clean naming, another on raw performance -- may each be generalizing from whichever failure mode most damaged them earliest in their career, not from a shared essence either has uniquely grasped."
  - "A debate over what 'real journalism' is that loops without resolution may reflect each side generalizing from the specific outlets or reporters that most shaped their own trust or distrust, rather than a disagreement resolvable by better arguing."
critical-questions:
  - "does this mean general categories are meaningless or purely subjective? No -- Spinoza separately holds that some notions genuinely are common to all bodies and adequately conceived (II. Props. xxxviii-xxxix). This atom applies specifically to categories formed by imaginative overload of particular instances (kind-one knowledge, see lex-6mwqy), not to properly derived common notions."
  - "isn't this just 'everyone has biases'? No -- it names a specific mechanism (imaging capacity exceeded by many similar particulars, collapsing to whichever shared trait most affected this body) with a specific prediction (which trait becomes definitional tracks which trait most often or vividly struck the person), not a generic disclaimer about bias."
  - "how is this different from lex-acmmk (Kant's synthetic a priori)? Kant's claim is about universal cognitive structure -- categories that organize experience the same way for every mind. This atom is the opposite kind of claim: idiosyncratic, person-specific variation in which trait becomes definitional, driven by each individual's particular exposure history."
  - "does this mean no definition of a contested category is ever better than another? No -- the atom's claim is narrower: feeling certain that your definition captures the thing's true essence is not, by itself, evidence that it does, since the same certainty is equally available to someone whose definition tracks a different trait entirely."
  - "isn't this the same as lex-2vpet (family-resemblance categories held together without a shared essence)? No -- lex-2vpet is a STRUCTURAL claim about how a category can cohere legitimately (overlapping similarities, no single defining property) without that being a defect. This atom is a PSYCHOLOGICAL claim about why two people confidently produce DIFFERENT single-trait definitions of what feels to each like the category's defining essence -- explaining the origin of definitional disputes, not the logical structure of the category itself. A family-resemblance category (lex-2vpet) could still generate exactly this kind of dispute if two observers each mistook one salient fibre in the network for the whole thread."
