id: lex-t6mm9
name: satire-affirms-a-mocked-practices-real-power-even-while-ridiculing-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A satire can mock the way a sacred ritual is actually performed almost to the point of full blasphemy, and then pull back at the last moment by having the very figure used to stage the mockery affirm that the ritual's underlying power is still real, protecting the institution's legitimacy even while its performance has just been thoroughly humiliated. In the Wakdjunkaga cycle's parody of puberty fasting, a woman is fooled into striking open Wakdjunkaga's elk-skull-trapped head as though performing a genuine blessing ritual, and the scene builds toward outright sacrilege. But Radin notes the creators pull back before crossing that line: 'the implied blasphemy in the whole proceeding was more than the creators of the scene wished to take upon themselves, and Wakdjunkaga says, 'Inasmuch as you have made these offerings to me they will not be lost. For whatsoever be the purpose for which you use this head, that purpose will be accomplished.' So the people made themselves various medicinal instruments and afterwards found that they were efficacious.' The absurd, fraudulent circumstances of the blessing are fully exposed and mocked, but the myth still insists the resulting medicine objects actually worked. The comic exposure and the institution's real authority are allowed to coexist. Diagnostic move: when constructing or reading a satire of a serious practice, notice whether the satire eventually validates that the practice still delivers on its real function despite the ridiculous way it was obtained -- that validation is often a deliberate limit the satirists placed on their own critique, not an inconsistency, and it marks how far they were willing to let the mockery actually threaten the institution's legitimacy."
