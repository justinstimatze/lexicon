id: lex-kykwm
name: apparent-variety-of-products-conceals-single-standardized-producer-formula
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when consumers experience a market or media environment as offering MANY DIVERSE CHOICES while the underlying production-apparatus is actually a SINGLE STANDARDIZED FORMULA producing surface variation. Horkheimer + Adorno's `culture industry` canonical case: mass culture (film, radio, popular music, popular fiction) in mid-20th-c U.S. presents as a wide variety of works, but the production-apparatus runs a small set of standardized formulas (genre conventions, three-act structure, dramatic-denouement timing, star-system casting, advertising-driven content placement) producing pseudo-individuality. The variation between products is real but cosmetic; the formula is invariant. The consumer's experience of `choosing between` is itself a producer-side construct because the apparatus also produces the consumer's tastes via the same channels (advertising, criticism-as-marketing, distribution-control). The transferable consequence: when an environment looks like a market with many options, ask whether the underlying production-apparatus is concentrated such that the surface variety is variation on a single formula. Distinct from lex-vw8c3 producer-supplies-both-need-and-satisfaction (Marcuse): lex-vw8c3 names the need-satisfaction pairing; lex-kykwm names the structure of the OPTIONS supplied (variation on a single template). They compose — lex-vw8c3 explains why consumers return; lex-kykwm explains why the `choice` is illusory. Transferable applications: TV genre formulas (90s sitcom structure invariant across networks); popular music verse-chorus formula across genres; movie-franchise standardized plotlines; social-media feed-engineering uniform across platforms despite different UIs (engagement-optimization formula is shared); LLM output convergence across providers from shared RLHF + constitutional-AI training assumptions; restaurant chains with different `cuisines` running same operations playbook; news outlets with different brands sharing wire-feeds + opinion-format standards; college curricula across institutions standardized by accreditation + ranking pressure; consumer-electronics formulas (smartphone form-factor + feature-set converged); SaaS-product feature-bundles. The atom does NOT claim that all apparent-variety is illusory; it claims that when the production-apparatus is concentrated + standardized, the variety is structurally cosmetic. Use when (i) a defense of a status quo invokes consumer-choice as legitimating, (ii) a critique of `market efficiency` fails to notice that the market's options share a single producer-formula, (iii) you're designing a product or platform and need to anticipate whether your `variety` is structurally cosmetic. Counter-move: identify the production-formula across the apparent-options; ask what the variation conceals; ask whether the consumer-taste reflected in the choice was itself produced by the same apparatus."
