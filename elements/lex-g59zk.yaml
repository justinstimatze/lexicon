id: lex-g59zk
name: humors-target-not-its-form-determines-reactionary-or-subversive-valence
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when evaluating whether a joke, comedy routine, satire, or comic frame is progressive/critical or regressive/reinforcing — and the instinct is to judge this from the joke's MECHANISM (incongruity, punchline, reversal, absurdity). Critchley's claim: the formal structure of humor is politically neutral: 'a joke is a play upon form that affords an opportunity for realising that an accepted pattern has no necessity' (Mary Douglas) is true of ALL jokes regardless of target. What determines whether a given joke REINFORCES existing hierarchy or SUBVERTS it is not its form but its TARGET — who or what gets laughed at. Two identical joke-mechanisms produce opposite political effects: (1) 'comedy of recognition' — most humor, including most ethnic/sexist/outsider-mocking humor — targets a scapegoated or lower-status group ('the powerful laughing at the powerless'), which is Hobbesian superiority laughter dressed as harmless play; it 'simply seeks to reinforce consensus and in no way seeks to criticize the established order.' (2) 'true' or subversive humor targets power itself, exposing that an arrangement presented as natural or necessary is in fact contingent and could be otherwise — 'by laughing at power, we expose its contingency... it will be a laugh that buries you' (directed at the powerful). The practitioner move: before asking 'is this joke incongruous/clever/funny,' ask 'who is this joke's butt, and what does laughing at them cost or protect?' A joke can be formally identical in structure (surprise, reversal, absurdist juxtaposition) whether it punches up or down; the comic technique gives you no information about political valence. Most humor, by volume, is the reinforcing kind — subversive humor that actually exposes contingency of power is comparatively rare, which is itself diagnostic: reach for target-analysis, not technique-analysis, when assessing a joke's function."
related: [lex-2gtzb, lex-879gh, lex-k5hgu, lex-zag6n, lex-zcdmw]
scaffolds-from: [lex-2gtzb]
evokes: [comedy-of-recognition-reinforces-consensus, laughing-at-power-exposes-its-contingency, punching-up-versus-punching-down, jokes-as-anti-rites, hobbesian-superiority-laughter, target-not-mechanism-carries-political-valence, most-humor-is-reactionary-by-default]
lineage:
  - source: primary
    text: critchley-2002-on-humour
    citation: "Simon Critchley, *On Humour* (Routledge, Thinking in Action series, 2002), Introduction, 'Reactionary Humour' section."
    quote: "[On reactionary humour as the default:] 'But before we get carried away, it is important to recognize that not all humour is of this type, and most of the best jokes are fairly reactionary or, at best, simply serve to reinforce social consensus... Most humour, in particular the comedy of recognition — and most humour is comedy of recognition — simply seeks to reinforce consensus and in no way seeks to criticize the established order or change the situation in which we find ourselves. Such humour does not seek to change the situation, but simply toys with existing social hierarchies in a charming but quite benign fashion... More egregiously, much humour seeks to confirm the status quo either by denigrating a certain sector of society, as in sexist humour, or by laughing at the alleged stupidity of a social outsider... Such comic scapegoating corresponds to what Hobbes means in suggesting that laughter is a feeling of sudden glory where I find another person ridiculous and laugh at their expense. Such humour is not laughter at power, but the powerful laughing at the powerless.' [On subversive humour as the exception:] 'Humour brings about a change of situation, a surrealization of the real... This idea of a change of situation can be caught in Mary Douglas's claim that, \"A joke is a play upon form that affords an opportunity for realising that an accepted pattern has no necessity.\" Thus, jokes are a play upon form, where what is played with are the accepted practices of a given society. The incongruities of humour both speak out of a massive congruence between joke structure and social structure, and speak against those structures by showing that they have no necessity. The anti-rite of the joke shows the sheer contingency or arbitrariness of the social rites in which we engage. By producing a consciousness of contingency, humour can change the situation in which we find ourselves, and can even have a critical function with respect to society. Hence the great importance that humour has played in social movements that have set out to criticize the established order... As the Italian Situationist street slogan has it, \"Una risata vi seppellira\", it will be a laugh that buries you, where the \"you\" refers to those in power. By laughing at power, we expose its contingency, we realize that what appeared to be fixed and oppressive is in fact the emperor's new clothes, and just the sort of thing that should be mocked and ridiculed.' (Simon Critchley, *On Humour*, Introduction)"
  - source: discovery-loop
    text: critchley-mining-pass-
    citation: "Lex-0560 (dominant-discourse-constructs-the-other) is the closest thematic neighbor — dominant power constructing a rulable Other — but concerns discourse-construction generally, not the shared-mechanism, opposite-valence structure of joke-form specifically; no atom previously named this claim. Lex-1015 (Freud's Der Humor, self-directed humor as protective superego reframing), minted from the same source, is operationally distinct: this atom concerns humor's social and political target-dependent valence, while lex-879gh concerns humor's intrapsychic mechanism when self-directed. The two compose — self-directed humor, per lex-879gh, is one way to avoid the reactionary, other-targeting mode this atom names — without being the same claim."
canonical-instances:
  - "Ethnic-joke chains cited by Critchley: 'the British laugh at the Irish, the Canadians laugh at the Newfies, the Americans laugh at the Poles, the Swedes laugh at the Finns...' — structurally identical joke-mechanism (outsider stupidity) deployed by whichever group holds local majority-status against whichever group is locally marginal. The mechanism travels; only the target changes, and the target tracks existing power, not comic necessity."
  - "A stand-up set that mocks a marginalized group's accent, food, or customs uses the same incongruity/reversal/timing toolkit as a set that mocks a sitting president's hypocrisy. Critique of the comedian cannot rest on 'was it a good joke, technically' — the same craft serves opposite political functions depending purely on who the butt is."
  - "'Una risata vi seppellira' (Italian Situationist slogan, 'it will be a laugh that buries you') — humor explicitly weaponized against power, naming the subversive pole directly: laughing at those who hold power exposes that their position is a contingent, defeasible arrangement rather than a fixed fact of nature, which is precisely the 'no necessity' move Mary Douglas names."
  - "Corporate 'structured fun' (inside-out day, silly hat day) as an instance of humor deployed FOR the established order rather than against it — Critchley's own workplace example: management-sanctioned play that produces 'backslapping bonhomie' functions as comedy of recognition reinforcing hierarchy, even though employees privately mock the same management via 'backchat and salacious gossip' — informal humor targeting the powerful, running counter to the sanctioned kind targeting nothing in particular."
critical-questions:
  - "Isn't ALL humor at least a little subversive, since it always involves 'breaking' some expectation? No — Critchley is explicit that formal incongruity/expectation-violation is present in both reactionary and subversive humor equally; the incongruity is necessary but not sufficient for a critical function. What determines the political valence is the social position of the target relative to the joke-teller and audience, not the presence of a broken expectation."
  - "Does 'punching up' automatically make a joke good, or 'punching down' automatically make it bad, independent of whether it's actually funny or true? No — this atom names a DESCRIPTIVE claim about what determines a joke's political function (reinforcing vs. exposing-contingency), not a NORMATIVE formula for joke quality. A joke can accurately target power and still be unfunny, cruel in tone, or false in its premises; the target-analysis is one diagnostic axis, not the only one."
  - "Is 'most humor is reactionary' itself falsifiable, or just cynical throat-clearing? Critchley's operational claim is checkable: for any given joke or comic genre, ask who or what is being laughed at, and whether that target is more or less powerful than the laugher/audience in the relevant social context. The claim predicts that surveying humor at scale (sitcom tropes, national ethnic-joke traditions, workplace humor) will show a majority-reinforcing distribution — which is an empirical, not merely rhetorical, prediction."
  - "How does this relate to the Bergson mechanical-encrustment theory (lex-zqf8z) or benign-violation theory (lex-2gtzb) of what makes something funny at all? Those atoms describe the COGNITIVE MECHANISM that produces the experience of funniness (a felt incongruity, a violation perceived as benign). This atom is orthogonal to that mechanism — it operates one level up, on the SOCIAL FUNCTION of a joke once it is already funny by whatever cognitive account. A joke can satisfy Bergson's or the benign-violation account fully and still be either reinforcing or subversive; the mechanism-theories don't predict the valence."
