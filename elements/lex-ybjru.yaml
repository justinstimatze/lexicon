name: human-social-organization-is-experimental-not-linearly-progressive
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating claims about how human societies 'naturally' organize or 'inevitably' develop, recognize Graeber & Wengrow's 2021 structural reframing: archaeological and ethnographic evidence shows human social organization is EXPERIMENTAL across deep time, not linearly progressive. Humans have spent the last 40,000+ years moving back and forth between hierarchical and non-hierarchical forms, including complex non-hierarchical societies AT SCALE long before agriculture (Çatalhöyük, the Mississippian Cahokia, Ukraine's Tripilye 'mega-sites,' the post-Cahokia abandonment, the Wendat-style consensus polities Europeans encountered in North America). The stage-theory story ('hunter-gatherer → agriculture → cities → state → modernity') is empirically wrong as a one-way ratchet. Graeber-Wengrow surface evidence that many groups CONSCIOUSLY REJECTED hierarchical forms they could see in neighbors (the 'schismogenesis' dynamic — defining one's society against the perceived flaws of the other). They posit three primordial freedoms that appear to have been the default ground for most of human history: (1) freedom to move (knowing one would be welcomed elsewhere), (2) freedom to shift social structures (seasonal sovereignty — bands consolidating into kings-for-a-season then redispersing), (3) freedom to disobey authorities without consequence. Transferable claim: the interesting question is not 'how did inequality originate?' but 'how did we get stuck in this particular form?' Operational consequence for political imagination: present-day institutional arrangements are not natural endpoints; their persistence is itself a historical phenomenon needing explanation. Caveats: (a) Graeber-Wengrow are advocacy-leaning at points; specific case-readings are contested by archaeologists; (b) the book is in the user's caveat-authors register if Graeber's Bullshit Jobs / Debt arguments are weighted; the empirical archaeology survives critique even where the political-philosophy framing is challenged."
