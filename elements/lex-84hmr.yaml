id: lex-84hmr
name: moral-alchemy-relabels-identical-behavior-by-actors-group
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two people or groups do the exact same thing and get opposite evaluative labels, check whether a norm actually differs between them or whether the SAME observed behavior is simply being renamed through a different vocabulary depending on who did it. Merton names this 'moral alchemy' with a declension: 'the same behavior must be differently evaluated according to the person who exhibits it. For example, the proficient alchemist will at once know that the word \"firm\" is properly declined as follows: I am firm, Thou art obstinate, He is pigheaded.' He then runs the mechanism at length across an in-group/out-group pair built from the same traits: 'Did Lincoln work far into the night? This testifies that he was industrious, resolute, perservant, and eager to realize his capacities to the full. Do the out-group Jews or Japanese keep these same hours? This only bears witness to their sweatshop mentality, their ruthless undercutting of American standards, their unfair competitive practices... Is the in-group hero frugal, thrifty, and sparing? Then the out-group villain is stingy, miserly and penny-pinching... all honor is due the in-group Abe for his having been smart, shrewd, and intelligent and, by the same token, all contempt is owing the out-group Abes for their being sharp, cunning, crafty, and too clever by far.' The diagnostic move: hold the described BEHAVIOR fixed and swap only the actor's group membership in your head — if the label changes even though nothing about the behavior did, the disagreement isn't really about the behavior, it's a relabeling operation running on group identity."
related: [lex-mkjba]
evokes: [merton-1957, moral-alchemy, i-am-firm-thou-art-obstinate-he-is-pigheaded, in-group-abe-out-group-abe, sumner, differential-labeling]
lineage:
  - source: primary
    text: merton-1957-moral-alchemy-formula
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XI 'The Self-Fulfilling Prophecy,' p.428. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'we must examine the moral alchemy through which the in-group readily transmutes virtue into vice and vice into virtue, as the occasion may demand. Our studies will proceed by the case-method. We begin with the engagingly simple formula of moral alchemy: the same behavior must be differently evaluated according to the person who exhibits it. For example, the proficient alchemist will at once know that the word \"firm\" is properly declined as follows: I am firm, Thou art obstinate, He is pigheaded. There are some, unversed in the skills of this science, who will tell you that one and the same term should be applied to all three instances of identical behavior. Such unalchemical nonsense should simply be ignored.'"
  - source: primary
    text: merton-1957-lincoln-abe-cohen-declension
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.428-429, the extended in-group/out-group declension."
    quote: "'we are prepared to observe how the very same behavior undergoes a complete change of evaluation in its transition from the in-group Abe Lincoln to the out-group Abe Cohen or Abe Kurokawa. We proceed systematically. Did Lincoln work far into the night? This testifies that he was industrious, resolute, perseverant, and eager to realize his capacities to the full. Do the out-group Jews or Japanese keep these same hours? This only bears witness to their sweatshop mentality, their ruthless undercutting of American standards, their unfair competitive practices. Is the in-group hero frugal, thrifty, and sparing? Then the out-group villain is stingy, miserly and penny-pinching. All honor is due the in-group Abe for his having been smart, shrewd, and intelligent and, by the same token, all contempt is owing the out-group Abes for their being sharp, cunning, crafty, and too clever by far.'"
canonical-instances:
  - "A hiring manager describes a confident male candidate as 'decisive' and an equally confident female candidate doing the identical thing — interrupting to state a firm position — as 'abrasive'; the behavior observed is the same, only the label changed with the actor."
  - "Distinct from lex-4ydm6 (in-group/out-group ethical dualism as a human universal): that atom says groups apply different NORMS to insiders and outsiders as a baseline fact about human ethics. This atom is narrower and mechanistic — it names the specific move of applying the SAME observed behavior to two different vocabularies, which is how the dualism gets rhetorically executed rather than what it is."
critical-questions:
  - "How would you distinguish moral alchemy from a case where the behaviors genuinely differ in some relevant respect the labeler is tracking (e.g. context, scale, intent) rather than being truly identical? The hold-behavior-fixed test requires knowing the behaviors really are the same, which is often exactly what's contested."
  - "Is moral alchemy always conscious rhetorical strategy, or can it operate as a genuine perceptual bias where the labeler isn't aware they're applying different vocabularies — and if it's the latter, does confronting someone with the parallel language actually change their evaluation, or does it just make them defend the different labels as substantively justified?"
status: active
