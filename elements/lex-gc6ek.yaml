id: lex-gc6ek
name: dissonance-routes-to-hypervigilance
type-in: state
type-out: posture
_tier: reaction
agent-instruction: "When cognitive dissonance can't resolve to identity-defense, it may route to hypervigilance: scanning for threats to the destabilized worldview. The hypervigilance produces false positives and self-reinforces. Address the dissonance source, not the hypervigilance symptoms."
related: [lex-znaau, lex-we98d, lex-t9fs7, lex-rcj6y, lex-2rsad, lex-jw34x, lex-rn9ht, lex-tt38w, lex-uanys]
scaffolds-from: [lex-we98d, lex-tt38w, lex-rn9ht]
evokes: [the-alternative-route-to-identity-defense, dissonance-resolved-by-scanning-not-defending, the-vigilant-resolution-pathway, after-betrayal-the-attention-binds, beck-meets-festinger]
reactants:
  - lex-we98d # cognitive-dissonance: discomfort of inconsistent cognitions demanding resolution
conditions:
  - "identity-stakes MODERATE (not high enough to lock in identity-defense) AND further information is gatherable AND no time-pressure (vigilance is unbounded, so a deadline disfavours this route)"
mechanism: "Festinger lists multiple resolution-paths (belief-change, behavior-change, adding-consonant-cognitions, importance-reduction); lex-jw34x takes the identity-defense path; this reaction takes a DIFFERENT path — the dissonance is resolved by recruiting lex-rn9ht hypervigilance, scanning the dissonance-relevant domain for further confirming/disconfirming evidence rather than committing to a cognition. Because resolution now requires continued EXTERNAL information-gathering rather than internal cognition-rearrangement, the discomfort does not disappear — it becomes chronic"
catalysts:
  - lex-tt38w # significance-loss as the dissonance source recruits the same hypervigilance substrate (co-firing)
products:
  - "chronic hypervigilant-dissonance state: an open-question held under sustained scanning — rumination, sleep-disturbance, reduced task-attention (Beck 1979 cost-pattern); metabolically expensive. Post-betrayal hypervigilance, post-prediction-failure obsessive-monitoring, post-error chronic-doubt all share this signature"
inhibitors:
  - "time-pressure / decision-deadlines (force closure, disfavouring unbounded vigilance); high identity-stakes (route to lex-jw34x lock-in instead); structural bounding of the scanning (specific questions, time-limits) that lets belief-revision terminate it"
reversibility: "unbounded by design (waits for the next data-point) → can persist months or years; metastable — eventually resolves either to belief-revision (when the scanning is structurally bounded) or to lex-jw34x identity-defense lock-in (after exhaustion), each of which terminates the chronic state"
critical-questions:
  - "when does dissonance route to hypervigilance vs to identity-defense (lex-jw34x) vs to motivated-reasoning (lex-rcj6y + lex-t9fs7)? Path-selection depends on (a) whether the inconsistency touches identity (→ favors lex-jw34x), (b) whether the agent has access to further information (→ favors lex-gc6ek when info-gathering is feasible), (c) whether the agent has time-pressure (→ disfavors lex-gc6ek because vigilance is unbounded). The molecule fires when identity-stakes are MODERATE (not high enough to lock in defense) AND further information is gatherable"
  - "is the chronic state stable or self-resolving? lex-gc6ek's resolution is unbounded by design (waiting for the next data-point); empirically subjects can stay in the hypervigilant-dissonance state for months or years. The state is metabolically expensive; some subjects eventually shift to one of the identity-defense or belief-change paths after exhaustion. Mid-state behavioral signature: rumination, sleep-disturbance, reduced task-attention (Beck 1979 cost-pattern)"
  - "operationally distinct from lex-jw34x dissonance-driven-identity-defense: lex-jw34x routes dissonance through identity-defense (defending the threatened identity-aligned belief against the disconfirming evidence); lex-gc6ek routes through scanning-for-more-evidence (deferring resolution while gathering). The two are alternative pathways with different stability profiles — lex-jw34x produces fast lock-in; lex-gc6ek produces chronic open-question"
  - "operationally distinct from lex-rn9ht solo: solo hypervigilance can be triggered by anxiety, post-trauma activation, or current-environmental-danger; lex-gc6ek names the specific case where INTERNAL dissonance triggers the attention-allocation pattern. The trigger-distinction is empirically separable — solo hypervigilance scans for external-threat-cues, lex-gc6ek scans for internal-question-resolution-cues"
  - "what's the relationship to lex-tt38w significance-quest-recruits-hypervigilance (this pass)? lex-tt38w's trigger is significance-stakes (identity / mattering); lex-gc6ek's trigger is felt-inconsistency in cognitions. They can co-fire when significance-loss is itself the source of the dissonance (the loss produces both stakes-recruitment and inconsistency-recruitment of the same hypervigilance substrate)"
lineage:
  - source: primary
    text: festinger-1957-theory-of-cognitive-dissonance
    citation: "Leon Festinger, A Theory of Cognitive Dissonance (Stanford UP 1957) — Festinger explicitly enumerates four resolution paths (change behavior / change cognition / add consonant cognitions / reduce importance); identity-defense (lex-jw34x) is the dominant cognition-change pathway under identity-stakes; hypervigilant-scanning is implicitly available as a deferral strategy under Festinger's framework (continued attention-binding on the contested cognition, neither accepting nor rejecting) but is not named as a distinct path. This molecule promotes it. Tier-5 procurement"
    quote: "[deepening source — 1957 ATCD book is; the 1956 field-study verbatim below carries the practitioner-lineage authority. The 1957 four-paths framework names what this molecule promotes: hypervigilant-scanning is the deferral pathway latent in Festinger's enumeration but not named as distinct]"
  - source: practitioner
    text: beck-1979-cognitive-therapy-and-emotional-disorders
    citation: "Aaron T. Beck, Cognitive Therapy and the Emotional Disorders (Meridian / International Universities Press 1976; Plume reprint 1979) — Ch.6 'The Alarm Is Worse Than the Fire: Anxiety Neurosis' supplies the cognitive-substrate the dissonance recruits. Beck names hypervigilance as an attention-allocation problem (not perceptual-acuity); the molecule names the specific case where the trigger is internal cognition-conflict rather than external danger. Already in lex-rn9ht lineage; verbatim from 2026-05-04"
    quote: "We find that most of the patient's attention is stuck, as it were, on the concept of danger and the perception of 'danger signals.' This attention-binding is manifested by his involuntary preoccupation with danger, overvigilance for stimuli relevant to danger, and overscanning of his subjective feeling. The amount of attention remaining for focusing on specific tasks, recall, or self-reflection is greatly restricted. [Ch.6 — the cognitive-allocation operationalization. This molecule names the case where the 'danger signals' the attention binds to are signals relevant to the contested cognition rather than external threats: the post-betrayal scanner looks for further evidence of the betrayer's untrustworthiness, the post-prediction-failure forecaster scans the forecast-domain for further error-signals. The attention-binding mechanism is identical to Beck's; the threat-axis is dissonance-relevant cognition rather than environmental danger.]"
  - source: practitioner
    text: festinger-riecken-schachter-1956-when-prophecy-fails
    citation: "Festinger, Riecken & Schachter, When Prophecy Fails (U Minnesota Press 1956) — the canonical empirical case is canonically read as identity-defense routing (lex-jw34x); the lex-gc6ek pathway is the LESS-OFTEN-DISCUSSED outcome the authors explicitly carve out in Ch.1 §1.5: members who 'simply maintained the same conviction after disconfirmation as they had before and neither fell away from the movement nor increased their proselyting.' This molecule names the cognitive substrate of that pathway — sustained hypervigilance for further confirmatory signals as the deferral strategy."
    quote: "A man with a conviction is a hard man to change. Tell him you disagree and he turns away. Show him facts or figures and he questions your sources. Appeal to logic and he fails to see your point. [Ch.1 p.3 opening — the canonical Festinger framing of dissonance-driven belief-preservation. The book emphasizes two visible pathways (proselyting / abandonment); this molecule names the third, less-visible pathway: continued scanning.] There is a type of occurrence that would indeed disprove our explanation — namely, a movement whose members simply maintained the same conviction after disconfirmation as they had before and neither fell away from the movement nor increased their proselyting. But it is precisely such an occurrence that might very well go unnoticed by its contemporaries or by historians and never find its way into their annals. [Ch.1 pp.28-29 — the authors' explicit acknowledgment of the alternative pathway. The empirical signature of 'maintained the same conviction' is what this molecule names: attention binds to the contested-cognition-domain (the prediction-relevant signals) as the dissonance-deferral strategy. The cult-member who continues to wait for the next prophetic sign rather than either evangelizing or apostatizing exhibits the chronic-scanning posture this molecule promotes to a distinct fourth resolution-path.]"
  - source: practitioner
    text: score-drivermap-mining-pass-1
    citation: "The co-occurrence pass identifies cognitive_dissonance × hypervigilance at 20.3% strength. molecules-pass-3 (lex-jw34x) named the identity-defense pathway as substrate-anchored; lex-gc6ek now names the alternative hypervigilance pathway, completing the dissonance-resolution-route partition for the strongest co-occurrence pairs"
canonical-instances:
  - "post-betrayal interpersonal hypervigilance: a partner discovers infidelity but doesn't immediately decide to leave-or-stay. The dissonance (the partner I trusted is someone capable of this) routes to hypervigilance — every text, every late-night phone-call, every business-trip parsed for further evidence. The state persists for months until either confirming-evidence accumulates (path closes via lex-2rsad / lex-rcj6y) or disconfirming-evidence stabilizes (path closes via belief-revision toward 'this was an isolated event')"
  - "scientist whose result was retracted: the dissonance (I am a careful-researcher / my work is flawed) routes to hypervigilance about further-mistakes. Every subsequent experiment is parsed extra-carefully for errors; ambient lab activity is scanned for early-warning signs of more retractions. The state is high-cognitive-cost; productive research-output drops; some scientists eventually self-correct via belief-revision, others lock in via lex-jw34x ('the retraction was political, not scientific')"
  - "investor whose major position cratered: the dissonance (I am a good-judge-of-companies / this company collapsed) routes to hypervigilance about other holdings. Every quarterly-report is parsed for the same warning-signs they missed before. Cognitive cost is high; portfolio-attention is captured. The state often resolves only when a different external event (next market move, exhaustion, advisor intervention) breaks the binding"
  - "parent whose child has been hurt under another caregiver: the dissonance (I am protective / I missed the harm) routes to hypervigilance about future caregiving situations. Each new caregiver encounter is scanned for warning-signs; ambient interactions get over-interpreted as potential threats. The state can be protective (in genuinely-dangerous environments) or pathological (over-applied to safe contexts)"
  - "post-prediction-failure forecaster: a public analyst who made a confidently-wrong prediction enters hypervigilant-scanning for ANY signal relevant to the same forecast-domain. Their subsequent commentary is hedge-laden and event-reactive in a way pre-failure commentary wasn't. The dissonance is between 'I am a competent forecaster' and 'this prediction was very wrong'; the resolution path is open-ended-vigilance rather than identity-defense"
  - "operationally distinct from lex-jw34x dissonance-driven-identity-defense: same trigger (dissonance), different downstream pathway. lex-jw34x produces fast belief-rebalancing toward identity-aligned position; lex-gc6ek produces sustained scanning. Subjects can shift between pathways (an early-stage lex-gc6ek may eventually exhaust into lex-jw34x lock-in); the substrate captures both options"
  - "operationally distinct from lex-2rsad identity-protective-belief-maintenance: lex-2rsad starts from incoming-threatening-claim and produces defense-of-existing-belief; lex-gc6ek starts from internal-dissonance and produces scanning. Different entry-conditions, different output behaviors; both share components of the threat-response substrate but compose them differently"
  - "operationally compositional with lex-znaau premature-closure: hypervigilant-scanning is in tension with premature-closure (premature-closure shuts inquiry; hypervigilance reopens it indefinitely). When both are operative the dynamic is unstable — subjects oscillate between confident-conclusions and renewed-scanning. Some clinical anxiety presentations match this oscillation pattern"
  - "operationally adjacent to lex-t9fs7 confirmation-bias: hypervigilant-scanning is in PRINCIPLE open to both confirming and disconfirming evidence, but in practice confirmation-bias warps the search asymmetrically — the scanner notices confirming-cues more readily than disconfirming-cues, prolonging the dissonance-resolution toward eventual lex-jw34x lock-in. The two molecules can chain"
  - "foundational critical question: when is the hypervigilant-dissonance state productive vs maladaptive? Productive: when further information IS gatherable AND the inconsistency is genuinely informative (the betrayal-question is real, the prediction-error was real, the retraction was warranted). Maladaptive: when further information is not actually gatherable (the question is intrinsically open) or when the attention-cost exceeds the informational-value. Clinical interventions target the latter case"
  - "decisive critical question: how does intervention disrupt the molecule? Two pathways: (a) help the subject reach belief-revision by structurally bounding the scanning (specific-questions, time-limits, decision-deadlines); (b) help the subject reach identity-defense (lex-jw34x lock-in) which at least terminates the metabolic-cost of the chronic state. Therapeutic traditions differ — CBT favors (a) via cognitive-restructuring; some pragmatic-acceptance approaches favor (b) via narrative-closure even if epistemically imperfect"
severity-tier: info
status: active
