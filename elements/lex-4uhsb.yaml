id: lex-4uhsb
name: choice-of-reference-class-decides-if-rigidity-reads-as-pathology
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Before calling a person's rule-following, caution, or rigidity 'excessive,' ask: excessive relative to WHAT baseline? Merton points out that the whole vocabulary of 'intolerance of ambiguity' — 'undue preference for symmetry, familiarity, definiteness, and regularity; tendency toward black-white solutions, over-simplified dichotomizing, unqualified either-or solutions, premature closure' — is defined entirely by the word 'excess,' and excess presupposes a norm you're measuring against. His point: 'the norms in terms of which these are judged to be \"excessive\" ... need not be confined to the statistical norms observed in an aggregate of personalities under observation ... The norms can also be derived from the standardized normative expectations which obtain in various groups so that behavior which, by the first set of standards, may be regarded as \"psychological over-rigidity\" can, on occasion, be regarded by the second set of standards, as adaptive social conformity.' The same rule-clinging that looks like an individual personality defect against a population-wide baseline can be exactly the behavior a specific institution (the military, a surgical team, an air traffic control tower) actually requires and rewards. Use this before pathologizing rigidity, caution, or rule-adherence: name the reference class the judgment is implicitly using, and ask whether the institution-specific baseline would call the same behavior adaptive instead."
related: [lex-5ggxk]
scaffolds-from: [lex-5ggxk]
evokes: [merton-1957, intolerance-of-ambiguity, frenkel-brunswik-1949, excess-presupposes-a-norm, psychological-over-rigidity-vs-adaptive-social-conformity, reference-class-relativity-of-pathology]
lineage:
  - source: primary
    text: merton-1957-intolerance-of-ambiguity-components
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. V 'Continuities in the Theory of Social Structure and Anomie,' pp.186-187, summarizing Else Frenkel-Brunswik's inventory of the components of intolerance of ambiguity. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'As set forth in a recent rapid inventory, the components of intolerance of ambiguity include: \"undue preference for symmetry, familiarity, definiteness, and regularity; tendency toward black-white solutions, over-simplified dichotomizing, unqualified either-or solutions, premature closure, perseveration and stereotypy; a tendency toward excessively \"good\" form (that is, excessive Prägnanz of Gestalt organization), achieved either by diffuse globality or by over-emphasis on concrete detail; compartmentalization, stimulus-boundness; avoidance of uncertainty as accomplished by the narrowing of meanings, by inaccessibility to experience, by mechanical repetition of sets, or by a segmentary randomness and an absolutizing of those aspects of reality which have been preserved.\"'"
  - source: primary
    text: merton-1957-norms-of-excess-are-not-fixed
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.187, immediately following, Merton's own generalization."
    quote: "'the concept of intolerance of ambiguity refers to \"an excess\" of designated kinds of perception, attitudes and behavior ... The norms in terms of which these are judged to be \"excessive,\" however, need not be confined to the statistical norms observed in an aggregate of personalities under observation or to norms of \"functional appropriateness\" established by considering individuals seriatim in abstraction from their social environments. The norms can also be derived from the standardized normative expectations which obtain in various groups so that behavior which, by the first set of standards, may be regarded as \"psychological over-rigidity\" can, on occasion, be regarded by the second set of standards, as adaptive social conformity. This is only to say that although there is probably a linkage between the concept of overly-rigid personalities and the concept of socially induced ritualistic behavior, the two are far from being identical.'"
canonical-instances:
  - "A new employee's insistence on following the checklist to the letter reads as 'rigid' and 'lacking initiative' against the population-wide norm of workplace flexibility, and reads as exactly correct against the specific norm of a hospital medication-administration protocol, where the checklist exists precisely because deviation kills people."
  - "Hypervigilance and threat-scanning read as an anxiety disorder against a peacetime civilian reference class, and as a well-calibrated survival skill against the reference class of a combat deployment or an abusive household — the behavior is identical; the diagnosis flips with the baseline."
  - "distinct from lex-5ggxk abandoning-ambition-while-over-complying-with-procedure-buys-safety: that atom is about the MOTIVE behind ritualist over-compliance (status-anxiety after abandoning ambition, buying safety through rule-following). This atom is about the separate, prior question of which BASELINE an observer uses to decide whether given rule-following counts as excessive at all — the two compose: something can be correctly diagnosed as ritualism by the institutional-norm baseline and still look like ordinary conscientiousness by the population baseline."
critical-questions:
  - "If the reference class itself can be chosen to justify almost any behavior as 'adaptive' (there's always some group, somewhere, for whom extreme rigidity is the correct policy), what stops this frame from being used to launder genuinely maladaptive behavior as 'contextually appropriate'? Merton doesn't supply a rule for which reference class is the RIGHT one to apply in a given case."
  - "Blau's separate finding (also in this chapter) is that ritualistic over-compliance in bureaucrats tracks relational insecurity, not habituation to the institution's actual demands — does that mean the 'adaptive by institutional-norm standards' reading and the 'anxiety-driven' reading can both be true of the same behavior at once, or does establishing one tend to rule out the other in a given case?"
status: active
