id: lex-653ng
name: when-power-decides-which-reasons-count-evidence-quality-stops-binding
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When the disagreement is over which reasons count, evidence-quality is not the binding constraint — power is. Surface who controls which reasons count before relitigating the evidence. The fight over admissibility precedes the fight over weight."
