id: lex-4zjv9
name: diving-repeatedly-for-a-reflection-instead-of-the-real-thing
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you see something desirable and dive straight for it, check whether you're looking at the thing itself or its reflection -- repeated failed attempts to grab it are a strong signal you're chasing an image, and the real object may be sitting in plain sight in the opposite direction from where you're looking. In Radin's Winnebago Trickster cycle, Trickster looks into a stream and sees plums: 'much to his surprise he saw many plums there.' He dives for them, and dives again, hard enough to knock himself unconscious against a rock at the bottom, before he finally understands what happened: 'as he opened his eyes, there on the top of the bank he saw many plums. What he had seen in the water was only the reflection.' The actual plums were on the bank the entire time, visible if he had simply looked up instead of down. His own verdict is blunt: 'Oh, my, what a stupid fellow I must be! I should have recognized this. Here I have caused myself a great deal of pain.' The failure wasn't a lack of effort -- he dove twice, the second time at real physical cost -- it was directing all of that effort at an image instead of checking where the image was coming from. Diagnostic move: when repeated direct attempts to obtain something keep failing in the same way, stop and ask whether what you're pursuing is the source or a reflection of it -- the real thing is often oriented oppositely from where its image appears."
