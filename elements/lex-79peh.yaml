id: lex-79peh
name: interrelated-hypotheses-break-significance-tests-independence-assumption
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before applying a standard significance test to a batch of findings from an exploratory study, check whether your hypotheses are actually independent of each other — because if they aren't, the test's core assumption is violated and there's no simple fix available. Merton, Reader, and Kendall (with Coleman and Selvin credited in an editors' note) name this as their first reason for deliberately not reporting traditional significance tests in the Student-Physician research program: 'traditional tests of significance have been developed to study the probable correctness or incorrectness of single, isolated statements, for example, that Drug A is more likely than Drug B to cause nausea. But it is an essential feature of these exploratory studies in medical education, and of many other empirical investigations in the social sciences, that there is no single hypothesis which can be viewed independently of other hypotheses. Instead, there is a series of loosely interrelated hypotheses which must be looked at in combination.' Their worked example shows why this isn't a minor technicality: 'we may hypothesize that medical students will respond more favorably to some features of an educational innovation than they do to others. But a corollary hypothesis, which must be borne in mind when this first one is stated, is that those aspects of the innovation which are reacted to negatively may have as much — or more — impact on student attitudes and self-images as those which are better liked. In other words, it can be misleading to focus attention on one hypothesis without taking into consideration other related hypotheses.' They then rule out the obvious patch: 'it does not help to apply significance tests as standard procedure, for this assumes that each result is isolated from and independent of every other. Perhaps the solution is to consider the probability of the joint occurrence of the several results; but this has the shortcoming of assuming that we know, quite explicitly, which of the hypotheses are related, and in what manner.' The joint-probability fix requires exactly the knowledge an exploratory study doesn't yet have — a precise map of which hypotheses relate to which, and how — so it substitutes one unmet assumption for another rather than resolving the problem. Diagnostic move: before running significance tests across a set of findings, ask whether the hypotheses being tested were derived from a single underlying theoretical picture (in which case they likely interact) or genuinely independently generated — a batch of findings about a coherent phenomenon almost always fails the independence assumption, and no amount of correcting for multiple comparisons repairs a test built on an assumption the data doesn't satisfy in the first place."
