id: lex-5mtne
name: hidden-meaning-reading-lets-an-authoritative-text-survive-changed-commitments
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Dilthey traces where allegorical interpretation enters the history of hermeneutics: Crates of Mallus introduced the Stoic principle of reading Homer's poems as secretly meaning something other than their literal sense, and the appeal of the method came specifically from what it could resolve -- 'the contradictions between inherited religious texts and more abstract and purely philosophical world-views.' The same move recurs in early Christian exegesis: against readers who took the text at its plain, and increasingly untenable, word, the Alexandrian school read the Old Testament as concealing a deeper, Christologically-compatible sense, transferring the doctrine of the logos back into scripture without having to reject scripture. The mechanism is specific: when a text's literal claims fall out of step with what its readers now hold true, three responses are available -- reject the text's authority, reject the new commitments, or reinterpret the text so its authority and the new commitments both survive. The third path relocates the friction. The text no longer has to be literally right; it only has to have a hidden sense that is. Recognize the same move outside religious exegesis: a legal doctrine of constitutional interpretation reads old text as encoding principles flexible enough to cover cases its framers never anticipated, rather than treating superseded clauses as simply wrong; a company keeps a decades-old mission statement and reinterprets what it 'really always meant' each time the business model changes, rather than replacing it; a political movement keeps citing a founding document while contesting what it 'truly' requires, rather than discarding it when the document's literal terms stop fitting present commitments. In every case, the reinterpretation is not neutral -- someone has to choose which new, compatible meaning the text is now read to secretly carry, and that choice does real work the text's own words never did."
related: [lex-m2cwp, lex-kebjb]
evokes: [dilthey-1900-rise-of-hermeneutics, crates-of-mallus, pergamene-philology, alexandria-vs-antioch, allegorical-interpretation, symptomatic-reading, transferring-the-logos-back-into-scripture]
lineage:
  - source: primary
    text: dilthey-1900-rise-of-hermeneutics
    citation: "Wilhelm Dilthey, 'The Rise of Hermeneutics' (1900), in Selected Works, Volume IV: Hermeneutics and the Study of History, ed. Rudolf A. Makkreel and Frithjof Rodi, trans. Fredric R. Jameson and Rudolf A. Makkreel (Princeton University Press, 1996), Part I section 1, on the history of interpretation in Greece."
    quote: "'Crates of Mallus introduced the Stoic principle of allegorical interpretation into Pergamene philology. The lasting influence of this interpretive method came first and foremost from its ability to resolve the contradictions between inherited religious texts and more abstract and purely [philosophical] world-views. Hence the need for the allegorical approach by the interpreters of the Vedas, Homer, the Bible, and the Koran -- an art as indispensable as it was futile.' [A footnote-marker glyph fused to 'Mallus' with no separating space, and a stray character inserted before 'resolve', are excluded here as marginal artifacts, not part of the sentence.]"
  - source: primary
    text: dilthey-1900-rise-of-hermeneutics
    citation: "Wilhelm Dilthey, 'The Rise of Hermeneutics' (1900), in Selected Works, Volume IV: Hermeneutics and the Study of History, ed. Rudolf A. Makkreel and Frithjof Rodi, trans. Fredric R. Jameson and Rudolf A. Makkreel (Princeton University Press, 1996), Part I section 2, on the Alexandria/Antioch schism in early Christian exegesis."
    quote: "'A common principle of both was naturally that an inner link of prophecy and fulfillment relates the Old to the New Testament... Against the Jews the Church used allegorical interpretation to transfer the doctrine of the logos back into the Old Testament; but, on the other hand, it had to defend itself against a too thoroughgoing application of the allegorical method by the Gnostics.'"
canonical-instances:
  - "A school of constitutional interpretation reads old clauses as encoding flexible underlying principles rather than fixed literal rules, so the document keeps its founding authority even as the cases it must decide have changed beyond what its authors could have foreseen -- the alternative readings (treat the clause as simply wrong, or refuse to decide the new case) are both rejected in favor of a reading that lets the text and the new commitment coexist."
  - "A long-running company keeps its original mission statement through several complete changes in what the business actually does, reinterpreting each time what the founders 'really meant' rather than writing a new one -- the statement's authority survives because its meaning is treated as recoverable rather than fixed."
  - "A political or religious movement keeps citing its founding document while different factions contest what it 'truly' requires on a live question the document's authors never addressed -- the document is not defended as literally settling the question; it is read as secretly already containing the answer each faction wants."
  - "Operationally distinct from lex-m2cwp pivot-from-dualist-cue-to-multifactorial-frame: that atom is a general move for replacing an oversimplified two-bucket framing with a richer one, applicable to almost any binary. This atom is specifically about what happens to a text's AUTHORITY when its literal claims and its readers' commitments diverge -- the reinterpretation's whole point is to preserve the text as an authoritative source, not merely to enrich a framing."
  - "Operationally distinct from lex-kebjb reading-accident-as-revelation-of-hidden-truth-outlasts-its-theology: that atom tracks one specific claim (accidents secretly reveal a hidden agent's truth) surviving intact across totally different worldviews, from gods to the unconscious. This atom is about a text's own literal content being deliberately reread to relocate friction with new commitments -- the vocabulary explaining the hidden meaning can change (theological, philosophical, ideological) but the object being reinterpreted, and the reason for reinterpreting it, is a specific authoritative text under specific new pressure, not a recurring general claim about accidents."
critical-questions:
  - "Does infinite reinterpretability protect a text's authority at the cost of it ever being allowed to simply be wrong? A text that can always be read to secretly mean something compatible with whatever readers now believe has stopped making any falsifiable claim at all -- its authority survives by becoming untestable."
  - "Who gets to pick the new, compatible meaning, and what does that choice cost the people who preferred a different compatible reading? The reinterpretation is never neutral: choosing which secretly-true sense a contested text carries is itself an exercise of interpretive authority, not a discovery."
  - "When is rejecting the text outright the more honest move than reinterpreting it? Reinterpretation has a real alternative -- admit the text was simply wrong on this point, or that its authority doesn't extend here -- and reaching for the hidden-meaning reading by default, rather than as one option among several, can be a way of avoiding that harder admission."
