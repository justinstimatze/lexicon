id: lex-zx4xk
name: excluded-matter-and-order-are-mutually-constitutive-not-a-one-way-byproduct
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "The relationship between an ordered system and the excluded material that violates it isn't one-directional -- it's not merely that creating order incidentally produces some leftover mess as a side effect, because the excluded category can just as easily be the active tool that produces a new order, meaning causality runs both ways and whichever direction gets assumed shapes what interventions look sensible. Hyde works this out from Mary Douglas's account of ritual purity: 'dirt is always a by-product of creating order. Where there is dirt, there is always a system of some kind, and rules about dirt are meant to preserve it.' But tracing the Legba myth, in which the trickster deliberately smears his mother with dishwater to force her retreat from earth and thereby found a new cosmic division between heaven and earth, Hyde reverses the direction: 'Douglas has it that \"dirt is the by-product of ... systematic ordering,\" but it's more that dirt and order are mutually dependent, for in this case the conceit can be as easily reversed: for Legba, the creation of order is a by-product of dirt. Dirt is one of the tools available to trickster as he makes this world.' Both directions are true at once, depending on where you stand in the sequence: an already-existing order produces its own excluded remainder as a byproduct, and a deliberately introduced excluded remainder can produce a new order as its effect. Diagnostic move: when analyzing a mess, a scandal, a taboo violation, or any excluded, out-of-place material, don't assume by default that it's a passive leftover of some pre-existing system -- check whether it's instead being actively deployed, by someone, as a tool to force a reorganization, since a byproduct calls for cleanup while a tool calls for asking what new order it's being used to build."
