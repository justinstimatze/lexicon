  - source: primary
    text: Locke-1690-Essay-II-27-9-12
    citation: "John Locke, *An Essay Concerning Human Understanding* (1690), Book II Ch. XXVII `Of Identity and Diversity` sections 9-12. Project Gutenberg edition (PG#10615 Vol 1). Locke's transferable contribution: personal identity is constituted by the REACH of consciousness — extension of self-attribution backward to past acts + forward to anticipated acts — NOT by substance-continuity (body, soul, neural-substrate). The same self IS the consciousness that can repeat a past act with the same self-attribution it would give to a present act; substance-changes (atom turnover, neural rewiring, even soul-replacement on Locke's view) do not break identity provided consciousness extends across them; conversely, gaps in consciousness produce gaps in identity even within a single substance. The framework has been productively extended across modern personal-identity philosophy (Parfit 1984 *Reasons and Persons* — the canonical extension + reductionist conclusions; Schechtman 1996 *The Constitution of Selves* — narrative-identity extension; Korsgaard 1996 *The Sources of Normativity* — practical-agent extension); modern bioethics (dementia + brain-injury + minimally-conscious-state cases require the consciousness-vs-substance distinction); legal personhood + corporate-continuity law (the successor-liability + corporate-veil + restructuring tradition); AI-system identity literature (the question of when a fine-tuned model is `the same` model; Schwitzgebel 2015 + ongoing AI moral-status work); + organizational identity research (Polos + Hannan + Carroll 2002 on organizational form identity-through-change); + software-engineering identity intuitions (when is a forked codebase the same project? a Theseus-rewritten library?). The atom encodes the transferable structural primitive — consciousness-reachability as identity criterion — separately from Locke's specific commitments. Debunking check applied: Locke's view has been substantially contested (Reid 1785 brave-officer objection; Butler 1736 circularity objection; modern animalist views Olson 1997 *The Human Animal*; biological-continuity views; narrative-identity views Schechtman 1996 + MacIntyre 1981; Parfit 1984 reductionist account). The STRUCTURAL CLAIM about consciousness-reachability as a pivotal criterion (potentially among others) is well-attested across modern personal-identity philosophy + bioethics + legal-personhood + AI-identity discussions, independent of Locke's specific theological framing."
    quote: "[Locke *Essay* II.27.9 (PG#10615), on the consciousness-criterion:] 'To find wherein personal identity consists, we must consider what PERSON stands for;—which, I think, is a thinking intelligent being, that has reason and reflection, and can consider itself as itself, the same thinking thing, in different times and places; which it does only by that consciousness which is inseparable from thinking, and, as it seems to me, essential to it.' [II.27.10 on the reach of consciousness backward + forward:] 'For, since consciousness always accompanies thinking, and it is that which makes every one to be what he calls self, and thereby distinguishes himself from all other thinking things, in this alone consists personal identity, i.e. the sameness of a rational being: and as far as this consciousness can be extended backwards to any past action or thought, so far reaches the identity of that person; it is the same self now it was then; and it is by the same self with this present one that now reflects on it, that that action was done.' [II.27.12 on the substance-vs-consciousness distinction — the key claim:] 'For it being the same consciousness that makes a man be himself to himself, personal identity depends on that only, whether it be annexed solely to one individual substance, or can be continued in a succession of several substances. For as far as any intelligent being CAN repeat the idea of any past action with the same consciousness it had of it at first, and with the same consciousness it has of any present action; so far it is the same personal self. For it is by the consciousness it has of its present thoughts and actions, that it is SELF TO ITSELF now, and so will be the same self, as far as the same consciousness can extend to actions past or to come; and would be by distance of time, or change of substance, no more two persons, than a man be two men by wearing other clothes to-day than he did yesterday, with a long or a short sleep between.' [Practitioner-extraction for transferable lex-tqd9x: identity-over-time is constituted by REACH OF CONSCIOUSNESS — what past acts + future anticipations are appropriated as `mine` — NOT by substance-continuity. The atom generalizes to AI continuity (the same model under fine-tuning, the same agent across reboots), software versioning + system continuity, organizational identity through change, personal identity across trauma + dementia, legal-entity continuity through restructure.]"
  - source: cross-attestation
    text: cross-domain-consciousness-reach-as-identity-criterion
    citation: "Cross-domain attestation that the consciousness-reach-as-identity-criterion pattern recurs across modern personal-identity philosophy, bioethics, legal-personhood + corporate-continuity law, AI-system identity, software-engineering identity intuitions, and organizational identity research. (a) Modern personal-identity philosophy: Parfit 1984 *Reasons and Persons* extends Locke to reductionist account + the famous puzzle cases (teletransport, branching, gradual replacement); Schechtman 1996 *The Constitution of Selves* extends to narrative-identity; Korsgaard 1996 *The Sources of Normativity* extends to practical-agent integration; Olson 1997 *The Human Animal* offers animalist alternative; Williams 1970 *The Self and the Future* offers competing physicalist intuition-pumps. (b) Bioethics: dementia + brain-injury + minimally-conscious-state cases require the consciousness-vs-substance distinction; Schechtman 1996 + Lindemann 2014 *Holding and Letting Go* on identity-care; Dresser 1995 *Dworkin on Dementia* on advance-directive + identity-discontinuity. (c) Legal-personhood + corporate-continuity: successor-liability doctrine; corporate-veil + piercing; tracing through mergers + acquisitions + restructure; the Citizens United line of cases on corporate personhood. (d) AI-system identity: Schwitzgebel 2015 + ongoing AI moral-status literature; Chalmers 2010 *The Singularity* on identity through gradual replacement + uploading; Bostrom 2014 (per `feedback_bostrom_route_around`) on AI continuity; current discussions of fine-tuning + checkpoints + agent-state-persistence. (e) Software-engineering: Brooks 1995 *Mythical Man-Month* on code-identity through reworking; Hunt-Thomas 1999 *The Pragmatic Programmer* on code-as-Theseus-Ship; Hickey 2013 *Simple Made Easy* on identity vs state distinction. (f) Organizational identity research: Polos + Hannan + Carroll 2002 *Foundations of a Theory of Social Forms*; Albert + Whetten 1985 *Organizational Identity*; subsequent literature on identity through merger + acquisition + pivot. The cross-domain attestation establishes the transferable structural form: consciousness-reachability (or its analog: continuity-of-the-thing-tracking-itself-as-itself-across-change) is a essential identity criterion across domains."
    quote: "Across modern personal-identity philosophy (Parfit 1984, Schechtman 1996, Korsgaard 1996, Olson 1997, Williams 1970), bioethics (Schechtman 1996, Lindemann 2014, Dresser 1995), legal-personhood + corporate-continuity, AI-system identity (Schwitzgebel 2015, Chalmers 2010), software-engineering identity intuitions (Brooks 1995, Hunt-Thomas 1999, Hickey 2013), and organizational identity research (Albert-Whetten 1985, Polos-Hannan-Carroll 2002), the consciousness-reach-as-identity-criterion pattern recurs. The transferable diagnostic: shift from substance-continuity question to reach-of-self-attribution question."
canonical-instances:
  - "Locke's canonical brave-officer / drunk-philosopher cases: the brave officer who as a boy was flogged + as a young man stormed the breach + as an old general was given his commission, IF he cannot remember the flogging, is NOT the same person as the boy who was flogged on Locke's account. Identity reaches as far as consciousness reaches."
  - "Theseus' Ship + ongoing substance-replacement cases: the ship whose planks are gradually replaced; the body whose atoms turn over; the brain whose synapses rewire. Locke's criterion: as long as the self-attribution + tracking continues, identity persists across substance-replacement."
  - "AI fine-tuning + checkpoint identity: when GPT-4 is fine-tuned with RLHF to produce GPT-4-Turbo, is it the same model? When ChatGPT's conversation memory is wiped between sessions, is it the same agent? Locke's criterion (extended): identity tracks the reach of self-attribution + state-continuity. Operationally complex; the question is well-formed by Locke's framework."
  - "Software project identity through fork + rewrite (Brooks 1995, Hunt-Thomas 1999): when a codebase is forked + rewritten progressively, when does it become a different project? Locke's criterion-analog: as long as the project maintains self-attribution + continuity-of-purpose + roadmap, identity persists; once those break, identity dissolves even with shared code."
  - "Personal identity across dementia (Schechtman 1996, Lindemann 2014, Dresser 1995): when a person's autobiographical memory + self-narrative dissolves due to advanced dementia, the substance (body, brain) persists but the consciousness-reach + self-attribution does not. The bioethics literature explicitly addresses Locke's framework — the prior advance directive's authority over the current state-of-no-self-attribution."
  - "Corporate identity through merger + restructure (legal-personhood literature): when AT+T is split into Baby Bells + then re-merged + then renamed, when is it the same corporation? Successor-liability + corporate-veil doctrines explicitly invoke continuity-of-self-attribution-style criteria."
  - "Parfit 1984 *Reasons and Persons* thought experiments: teletransport (substance-discontinuity with consciousness-continuity); gradual replacement (substance-discontinuity over time); branching (one consciousness becomes two). These thought experiments pump Lockean intuitions to investigate what consciousness-reach really implies."
  - "Chalmers 2010 *The Singularity* on mind-uploading + gradual neural replacement: the consciousness-reach criterion implies that gradual replacement preserves identity (provided consciousness is maintained) but abrupt replacement does not (no consciousness-bridge). The argument depends on Locke."
  - "operationally distinct from lex-uyk6e transformation-while-identity-persists: lex-uyk6e names IDENTITY-THROUGH-CHANGE generally without specifying mechanism. lex-tqd9x specifies the FOUNDATIONAL MECHANISM as consciousness-reach. They compose: lex-uyk6e names the phenomenon; lex-tqd9x names the decisive criterion."
  - "operationally distinct from lex-u8u7y social-identity-as-self-concept-determinant (Tajfel): Tajfel's social-identity is about IDENTITY-FROM-GROUP-MEMBERSHIP. lex-tqd9x is about IDENTITY-THROUGH-TIME constituted by consciousness-reach. Different mechanism + scope."
  - "operationally distinct from lex-afzzp each-thing-strives-to-persist-in-its-own-being (Spinoza conatus): conatus is about PERSISTENCE-TENDENCY of existing things. lex-tqd9x is about CRITERION OF IDENTITY across time. They compose: conatus explains why identity-persistence is the default; lex-tqd9x specifies the criterion by which identity is recognized."
  - "operationally distinct from lex-d2tsa autopoiesis (Maturana-Varela): autopoiesis is the specific LIVING-system mechanism of self-production via recursive boundary-production. lex-tqd9x is about consciousness-reach as identity criterion. They compose at the level of conscious living systems."
  - "operationally distinct from lex-brcgz identity-self-consciousness-in-the-maker-deforms-the-work: lex-brcgz is about how identity-consciousness in the maker affects the work-product. lex-tqd9x is about the metaphysics of identity-over-time. Different scope."
critical-questions:
  - "Does the atom commit to Locke's specific claim that consciousness-reach is necessary AND sufficient for identity? No. The atom claims consciousness-reach is a INDISPENSABLE criterion (potentially among others). Modern personal-identity philosophy has substantially developed this — Parfit 1984 reductionist account, Schechtman 1996 narrative-identity, Olson 1997 animalist alternative, Korsgaard 1996 practical-agent. The atom is compatible with various refinements as long as consciousness-reach (or its analog: the thing tracking itself as itself across change) is recognized as a crucial criterion."
  - "What about cases of memory-loss without identity-loss intuition? Reid 1785 classic objection: the brave officer who cannot remember being flogged as a boy is still (intuitively) the same person. The atom does not claim full Lockean memory-criterion; it claims consciousness-reach (which can be reconstructed via shared others' testimony + records + continuity of practical-agent commitments) is cardinal. Refinements (Parfit, Schechtman) preserve the essential consciousness-reach claim while addressing the Reid objection."
  - "How does the atom apply to gradual replacement cases (Ship of Theseus, gradual brain-cell replacement)? Locke's framework implies: as long as consciousness-reach is preserved across the gradual replacement, identity persists. The substance-discontinuity does not break identity. This is the canonical Lockean intuition + has been productively extended in Parfit's reductionist account."
  - "Could the atom be applied to AI systems? Yes — and this is an active area. When an AI agent is fine-tuned, when a checkpoint is restored, when conversation memory is wiped, the question of `same AI?` is well-formed via Locke's framework. The structural answer: identity tracks the reach of self-attribution + functional continuity. The operational answer depends on whether the AI system implements robust self-attribution + functional continuity — much current AI architecture does not (in interesting ways)."
  - "How does the atom apply to organizational identity through major change (founder-replacement, M+A, pivot)? Locke's framework applied at organizational level: identity tracks the reach of organizational self-attribution (mission, brand, internal narrative) + continuity-of-practical-commitments. Substance (employees, codebase, products) can change without breaking identity provided self-attribution continues; substance can persist with identity-discontinuity if the organizational consciousness-analog dissolves (e.g., a company that has lost its founding mission + been wholly co-opted)."
