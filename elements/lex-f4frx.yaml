id: lex-f4frx
name: shared-costly-initiation-is-the-trust-token-not-its-content
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a group requires new members to pass through a demanding, costly initiation, don't assume the value lies in whatever the initiation teaches or tests for -- the initiation's content can be almost beside the point, because the trust it creates comes from the shared, common-knowledge fact of having endured it, not from anything specific it verified. Jeff Hull, founder of the San Francisco secret society The Latitude, on why the group requires every member to pass through the same disorienting entry sequence, message-board vetting, and initial experience before joining any smaller gathering: 'It makes it unifying' ... 'It's the one thing you know, that everyone else has been initiated. I've been very good at not compromising that.' The journalist's own framing makes the mechanism explicit: this 'curated community' is not a bonus side effect of the design, but something baked into its DNA. What lets a stranger at an intimate gathering trust the others in the room isn't any particular skill, belief, or fact the initiation confirmed about them -- it's simply that everyone present already paid the identical cost to be there, which becomes the shared reference point regardless of what that cost specifically consisted of. Diagnostic move: when designing an initiation, vetting process, or hazing ritual meant to build trust among strangers, don't over-invest in perfecting what the ritual specifically screens for or teaches -- the requirement that everyone pass through the SAME costly gate, uniformly and without exception, may be doing more of the trust-building work than the gate's actual content."
related: [lex-p26va, lex-k7m6e]
evokes: [latitude-society, jeff-hull, shared-initiation, costly-signal-of-belonging, uniform-gauntlet-builds-trust]
