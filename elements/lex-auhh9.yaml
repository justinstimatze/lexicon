id: lex-auhh9
name: eternal-debt-requires-a-fund-that-never-stops-growing
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a debt or obligation gets framed as literally infinite -- karmic debt spanning countless past lives, an unpayable debt to one's mother for her milk -- watch for it to get institutionally answered not with a one-time payment but with a fund that can never be depleted and must instead grow forever. Medieval Chinese Buddhism's 'Inexhaustible Treasuries' worked exactly this way: a donor's contribution became permanent principal, loaned out at interest, with only the interest ever spent -- the principal untouched so the fund could keep answering an obligation that never actually ends. The theological premise (this debt has no end) becomes the fund's own operating rule (this principal must never be spent), and once wealth is organized that way, growth stops being optional -- Gernet's point is that this is why these treasuries became the world's first genuine concentrations of finance capital, functioning like modern endowments centuries before anything recognizable as capitalism existed. Whenever an institution points to an unlimited mission or debt to justify its own never-ending expansion, check whether that requirement was written into its founding terms from day one."
related: [lex-tm2zd]
evokes: [david-graeber, debt-the-first-5000-years, inexhaustible-treasuries, jacques-gernet, karmic-debt, perpetual-endowment]
lineage:
  - source: primary
    text: graeber-2011-debt-treasuries-first-finance-capital
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.10 'The Middle Ages,' section 'China: Buddhism and the Economy of Infinite Debt,' citing Jacques Gernet."
    quote: "“At the same time, the Treasuries themselves became—as Gernet was perhaps the first to point out—the world's first genuine forms of concentrated finance capital.”"
  - source: primary
    text: graeber-2011-debt-treasuries-had-to-expand
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.10 'The Middle Ages,' section 'China: Buddhism and the Economy of Infinite Debt.'"
    quote: "“They even shared the quintessential capitalist imperative of continual growth; the Treasuries had to expand, since according to Mahayana doctrine, genuine liberation would not be possible until the whole world embraced the Dharma.”"
canonical-instances:
  - "The direct textual anchor, on how a single fifth-century donation was inscribed to last forever: the endowment was “created with a document in stone to last as long as the moon and the sun”: since the principal would never be touched, the contribution would last forever."
  - "Hypothetical: a university names an endowed chair after a donor's late spouse, with the terms specifying that only investment returns fund the position, never the principal, so the chair exists 'in perpetuity.' Two centuries on, the university's investment office is managing a portfolio worth many times the original gift, aggressively chasing returns to keep pace with the position's growing costs -- not because anyone decided to build an investment operation, but because the original 'never touch the principal' clause quietly requires one."
critical-questions:
  - "Is the growth imperative really built into the infinite-debt logic itself, or could a religious institution just as easily have declared the debt infinite while treating the fund as a fixed, non-growing perpetual annuity? What specifically about Mahayana doctrine's 'genuine liberation requires the whole world' clause makes GROWTH rather than mere PRESERVATION of the fund the operative requirement?"
  - "Modern endowments (university, foundation, sovereign wealth funds) operate on the same never-touch-the-principal logic without any theological debt behind them at all. Does that mean the mechanism generalizes to any institution that adopts perpetual-endowment structure, with the infinite-debt framing being one historically important trigger but not a necessary one -- or does removing the debt-logic change what the fund is actually for in some way that matters?"
status: active
