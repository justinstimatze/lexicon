id: lex-vtytt
name: crisis-recognition-and-orientation
type-in: state
type-out: posture
_tier: molecule
agent-instruction: "When a situation flips from familiar to unfamiliar, your first task is RECOGNITION (what just changed?) then ORIENTATION (what are the new constraints?). Acting before recognizing or orienting is just executing yesterday's plan in today's situation."
related: [lex-uz7g4, lex-tf6br, lex-zgmyw, lex-k6d7u, lex-5yufs, lex-2x8qw, lex-2rsad, lex-ewafs, lex-uyk6e, lex-75vrt, lex-5b9gv, lex-xrbzz, lex-cpgyd, lex-aufzn, lex-vk65z, lex-nfdyv, lex-w97xs, lex-3d2he, lex-rjf7d, lex-fr9gf, lex-rref3, lex-nr3kg, lex-qfwuf]
scaffolds-from: [lex-tf6br, lex-zgmyw, lex-2x8qw, lex-vk65z, lex-uyk6e]
evokes: [kuhn-paradigm-shift-pipeline, the-tower-falls-and-you-rebuild, anagnorisis-into-research, the-cracks-are-the-content, breakdown-as-curriculum]
decomposes-into:
  - lex-tf6br
  - lex-zgmyw
  - lex-2x8qw
assembly: "sequential(lex-tf6br, lex-zgmyw, lex-2x8qw)"
premises:
  - existing frame F is breaking down under observation stream O (anomaly accumulation)
  - catastrophic-clarification (lex-tf6br) collapses F at threshold-crossing event, exposing previously-hidden internal structure
  - stress-reveals-latent-structure (lex-zgmyw) makes the previously-invisible substrate of F visible (what was always there but masked under non-stress conditions)
  - crisis-as-research-opportunity (lex-2x8qw) reframes the breakdown as productive substrate rather than failure-evidence
  - therefore the participant adopts posture P = engage-the-crisis-as-research rather than P = defend-or-flee
critical-questions:
  - is the anomaly real or a measurement error? (premature crisis-orientation produces wasted effort)
  - is F actually broken or just stretched? (the molecule fires too early on stretched-frame conditions)
  - is the participant's identity load-bearingly tied to F? if yes, lex-2rsad (identity-protective-belief-maintenance) fires INSTEAD of this molecule, defending F rather than engaging the crisis
  - is there enough resource (time, attention, social support) to actually do the research-orientation work? (the molecule REQUIRES capacity to engage; under starvation the orientation collapses to flight)
  - what's the reversibility? (some crises require destruction of old structure as the engagement; the posture-shift may be lossy)
  - is the crisis localized (a single anomaly) or systemic (frame-pervasive)? localized crises engage with fewer resources; systemic crises require Kuhn-style paradigm-rebuilding
lineage:
  - source: primary
    text: kuhn-1962-structure-of-scientific-revolutions
    citation: "Thomas S. Kuhn, The Structure of Scientific Revolutions (U Chicago Press 1962; 2nd ed 1970 with postscript) — the canonical articulation of crisis as productive precursor to paradigm-shift. Kuhn's framework explicitly describes the molecule's three-stage pipeline: paradigm-tools failing (→ catastrophic-clarification lex-tf6br) → blurring of old rules exposing previously-implicit structure (→ stress-reveals-latent-structure lex-zgmyw) → crisis as research-orientation (→ crisis-as-research-opportunity lex-2x8qw). Ch.7 'Crisis and the Emergence of Scientific Theories' p.76 + Ch.8 'The Response to Crisis' pp.84,88 supply the full sequence. (already in lex-2x8qw lineage; here re-staked with assembly-level framing)"
    quote: "So long as the tools a paradigm supplies continue to prove capable of solving the problems it defines, science moves fastest and penetrates most deeply through confident employment of those tools. The reason is clear. As in manufacture so in science—retooling is an extravagance to be reserved for the occasion that demands it. The significance of crises is the indication they provide that an occasion for retooling has arrived. [Ch.7 p.76 — the trigger for the molecule's first stage: paradigm-tools failing is what licenses retooling. The catastrophic-clarification (lex-tf6br) is the structural-shape of the retooling-occasion.] All crises begin with the blurring of a paradigm and the consequent loosening of the rules for normal research. In this respect research during crisis very much resembles research during the pre-paradigm period, except that in the former the locus of difference is both smaller and more clearly defined. [Ch.8 p.84 — the molecule's second stage: blurring exposes implicit structure that the rigid paradigm-rules had concealed; this is stress-reveals-latent-structure (lex-zgmyw) at field-scale.] By concentrating scientific attention upon a narrow area of trouble and by preparing the scientific mind to recognize experimental anomalies for what they are, crisis often proliferates new discoveries. [Ch.8 p.88 — the molecule's third stage: crisis-as-research-opportunity (lex-2x8qw), where the attention-concentration produces extraordinary research-output. The three Kuhn passages together name the full pipeline the molecule promotes from cross-decomposition to substrate.]"
  - source: practitioner
    text: aristotle-poetics-1452a-kassel
    citation: "Aristotle, Poetics ch.11 1452a30-32 (Kassel 1965 Oxford Classical Texts; Lucas 1968 commentary). Anagnorisis (recognition / discovery) as the structural pivot of tragedy — the change from ignorance to knowledge that defines the second stage of the molecule's pipeline. The dramatic anagnorisis IS the moment when latent structure becomes visible under maximum-stress conditions; the Kuhn-paradigm-shift case (Ch.8 'blurring') maps onto the same shape at field-scale. Already in lex-zgmyw lineage; here ported with assembly-level framing"
    quote: "'ἀναγνώρισις δέ, ὥσπερ καὶ τοὔνομα σημαίνει, ἐξ ἀγνοίας εἰς γνῶσιν μεταβολή, ἢ εἰς φιλίαν ἢ εἰς ἔχθραν, τῶν πρὸς εὐτυχίαν ἢ δυστυχίαν ὡρισμένων.' [Verified 2026-08-19: the cited Kassel critical edition's Greek text is not itself in this project's source corpus, so the Greek cannot be byte-checked directly. Corroborated instead against Butcher's independent 1895 translation, which is on disk: 'Recognition, as the name indicates, is a change from ignorance to knowledge, producing love or hate between the persons destined by the poet for good or bad fortune' -- the same well-known Poetics 1452a30-32 definition, confirming the content is accurate even though this specific Greek rendering is unverifiable against what's on disk.] [Aristotle, Poetics 1452a30-32 — 'Recognition, as the name itself signifies, is a change from ignorance to knowledge, leading to either friendship or enmity, of those marked out for fortune or misfortune.' This molecule names the same shape: under crisis-stress, the participant moves from ignorance-of-latent-structure to knowledge-of-it. The dramatic anagnorisis is the prototypical event; the Kuhn paradigm-shift case is the same event at scientific-community scale.]"
  - source: practitioner
    text: tarot-the-tower-card
    citation: "Tarot Major Arcana XVI: The Tower (Rider-Waite-Smith 1909 illustration by Pamela Colman Smith; standard imagery): a tower struck by lightning with crown dislodged and occupants falling; sky lit by the strike. The card visually depicts the molecule's first stage — catastrophic-clarification (lex-tf6br): the framework's collapse IS the revelation. Already in lex-tf6br lineage; here ported as the iconic-image source for the molecule's first stage. The Tarot Tower is the precise pictorial-precursor to Kuhn's paradigm-collapse"
    quote: "[archetypal-iconography source — the Rider-Waite-Smith Tower card (1909) supplies the canonical visual: tower struck by lightning, crown dislodged, occupants falling, sky lit by the strike. The molecule's first stage (catastrophic-clarification, lex-tf6br) IS this image: the framework's collapse is the moment the previously-hidden ground becomes visible. The card has no canonical verbatim text in primary sources (it's a visual archetype); the lex-tf6br lineage carries the conceptual cross-attestation to Schumpeter creative-destruction (verified verbatim) and Eldredge-Gould punctuated-equilibrium. The Tarot reference is the iconographic anchor, not the verbatim authority]"
  - source: discovery-loop
    text: periodic-table-distillation-pass-
    citation: "Substrate edge 3-clique 0100 ↔ 0109 ↔ 0127 (all three pairs present in active substrate). The clique was identified as a candidate molecule because the three atoms reciprocally cross-reference and form a structural pipeline that none of the three alone names. M3 candidate"
canonical-instances:
  - "Kuhn paradigm-shift episodes: phlogiston → oxygen (anomalies in mass-conservation accumulate; Lavoisier 1789 reframes); classical → quantum (blackbody radiation, photoelectric effect; Planck 1900 + Einstein 1905); geocentric → heliocentric (Mars retrograde anomalies; Copernicus 1543, Kepler 1609). Each follows the molecule's three-step sequence"
  - "2008 financial crisis as catalyst for behavioral-finance gaining mainstream legitimacy: efficient-market hypothesis frame catastrophically broke (lex-tf6br); revealed always-present-but-invisible market dysfunction (lex-zgmyw); accepted as research opportunity by major economics departments (lex-2x8qw). The molecule fired at field-scale"
  - "personal life crises (death, divorce, illness, layoff) prompting major value reorientation: the prior life-frame collapses (lex-tf6br); the participant sees what was always there but unattended (lex-zgmyw); reorients toward the crisis as occasion for re-evaluation (lex-2x8qw, attested in Smith TED talk per pilot-J pass-3)"
  - "Smith TED talk (pilot-J pass-3) personal-meaning attestation: pandemic transitions described as crisis-becoming-opportunity; explicit articulation of the molecule's pipeline at individual-meaning-making scale. Cross-domain attestation that the assembly is real outside Kuhn's scientific-paradigm domain"
  - "Lakatos's research-programmes framework (lex-p6p82 attestation context): degenerative programmes EXHIBIT crisis-symptoms; participants choose to engage (research-orient) or defend (apply lex-2rsad). Lakatos's auxiliary distinction (progressive vs degenerative) is roughly the diagnostic for whether this molecule should fire vs lex-2rsad should fire"
  - "operationally distinct from lex-2rsad identity-protective-belief-maintenance: lex-2rsad fires when identity-investment in F is high (defend); lex-vtytt fires when identity-investment in F is low or when meta-identity values research-orientation (engage). The two are mutually-exclusive responses to the same anomaly stimulus; which fires depends on identity-load on F"
  - "operationally compositional with lex-5yufs form-persists-when-content-dissolves: this molecule REVERSES form-persistence — the catastrophic-clarification step (0100) explicitly destroys the old form so that new content can be sought. Where 0124 describes hollowing-while-form-persists, lex-vtytt describes form-collapse as the precondition for new substance"
  - "decisive critical question: can the molecule fire deliberately or only spontaneously? Empirically: most paradigm-shift instances are crisis-precipitated (involuntary). But there are deliberate cases — ascetic traditions induce crisis (vipassana retreats, dark-night-of-the-soul practices), some pedagogical traditions (devil's-advocate teaching, Socratic interrogation) deliberately create the framework-collapse. The molecule's deliberate-firing version is more skill-intensive than the involuntary version"
status: active
