lineage:
  - source: primary
    text: radin-the-elk-skull-satire-pulls-back-from-blasphemy-by-affirming-the-medicine-works
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Wakdjunkaga Cycle as a Satire.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "What is interesting in this incident is that, at the end when the elk skull has been split open and Wakdjunkaga revealed laughing at everybody's discomfiture, the implied blasphemy in the whole proceeding was more than the creators of the scene wished to take upon themselves, and Wakdjunkaga says, '\"Inasmuch as you have made these offerings to me they will not be lost. For whatsoever be the purpose for which you use this head, that purpose will be accomplished.\" So the people made themselves various medicinal instruments and afterwards found that they were efficacious."
canonical-instances:
  - "A workplace comedy relentlessly mocks the absurd, box-checking way a company's mandatory safety training gets delivered, but ends with a character's life genuinely being saved by something they retained from the ridiculous session, letting the audience laugh at the delivery while still trusting that the underlying safety content matters."
  - "A satirical novel about a fraudulent faith healer has one supposedly fake cure turn out to be real and lasting, which lets the book skewer the healer's showmanship and exploitation without fully denying that the community's underlying belief in healing itself has any basis."
critical-questions:
  - "Does this pulled punch reflect genuine belief among the myth's creators that the underlying ritual power is real, or is it a strategic concession made purely to avoid the social consequences of a satire that goes all the way to denying the institution's legitimacy?"
  - "Is there a meaningful difference between a satire that validates a mocked practice's efficacy despite its absurd performance, and one that simply never addresses whether the practice works at all, leaving the question open rather than affirmatively resolving it?"
  - "Would this same pulling-back happen if the satirized institution had less social and religious authority to defend, or does the degree of restraint in a satire track how much power the target still holds over the satirists themselves?"
