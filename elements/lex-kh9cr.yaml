id: lex-kh9cr
name: argument-from-analogy-as-defeasible-similarity-based-property-transfer-between-cases
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When reasoning by analogy, identify which features of the source case transfer to the target and which don't. Analogies argue from shared relevant features; the relevance is the central claim, not the surface similarity."
related: [lex-38ygs, lex-7t3wr, lex-8y3ch, lex-9n7bg, lex-9uac6, lex-af9ax, lex-aut4h, lex-chtk9, lex-hesjt, lex-hhx7u, lex-r5fy3, lex-rnwph, lex-th68b, lex-tpv83, lex-uetgd, lex-utn22, lex-xhwqt, lex-xqamc, lex-y7p3z, lex-yexax, lex-zd7vh]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt]
evokes: [reasoning-by-similarity, case-to-case-transfer, analogue-and-primary-subject, paradeigma, legal-case-comparison, design-pattern-application, analogy-warranting-rule, relevant-disanalogy]
premises:
  - "case C1 (the analogue) has features {a, b, c, ...} and property F"
  - "case C2 (the primary subject) shares features {a, b, c, ...} with C1 in respects relevant to F"
  - "therefore presumptively C2 also has property F"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(identify-analogue, establish-relevant-similarity, transfer-property) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "are C1 and C2 actually similar in the features that ground property F? Walton's central CQ. Surface similarity is the canonical fallacy mode — two cases share features but the shared features are NOT the ones that warrant the property. Diagnostic: state the analogy-warranting rule explicitly (the implicit principle linking features to property); test whether the shared features actually satisfy that rule"
  - "are there relevant DISANALOGIES — features C2 has that C1 lacks (or vice-versa) that DEFEAT the transfer? The strongest defeater. A relevant disanalogy is a feature of C2 that would prevent property F from holding in C2 even given the shared features. Drug-sniffing-dog example: dogs share 'detection without opening' with plain-view-perception but disanalogize on 'specifically-trained-search-instrument' which legally matters"
  - "is the source-case property F actually established in C1? If C1's property F is itself contested or defeated, the analogy transfers nothing. Common failure mode: appealing to a case whose own warrant is shaky as if it were settled"
  - "is the relation between features and property in C1 itself defeasible? Walton's deductive-or-inductive question. If F obtains in C1 only contingently (not as a matter of definition or law), the C1→C2 transfer inherits all the contingency-defeaters of C1's own warrant. Stronger analogies transfer when F holds in C1 by a stable principle, weaker when F holds in C1 by case-specific accident"
  - "is this argument-from-analogy or argument-from-classification? Walton notes they're 'closely related' but distinct: classification establishes that a case falls under a category with definitional property; analogy establishes that two cases share features warranting the same conclusion without requiring categorical commitment. Conflating them obscures cases where the analogy is weak because the underlying classification doesn't actually hold for C2. (No standalone classification-scheme atom in substrate yet — candidate spinoff)"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.2 §2-6 'Schemes for Argument from Analogy, Classification, and Precedent' (pp.48-75). Walton-Reed-Macagno treat argument-from-analogy as a defeasible scheme (Ch.2 §3 'Is Argument from Analogy Deductive or Inductive?' explicitly rejects deductive treatment in favor of defeasible-presumptive). Multiple sub-forms: analogy-based-on-classification (pp.69-70), practical-argument-from-analogy positive/negative schemes (pp.74-75 citing Walton 1989 p.257), drug-sniffing-dog legal-case as canonical extended example (Ch.2 §9 pp.75-80). Walton notes 'argument from analogy is especially important in law' (p.60) and provides extensive legal-domain analysis. Local copy."
    quote: "Argument from Analogy Based on Classification. The analogue has features a, b, and c. The primary subject has features a, b, and c. It is by virtue of features a, b, and c that the analogue is properly classified as W. So, the primary subject ought to be classified as W. This scheme shows how argument from analogy is based on classification and, in many typical instances of the kind we have examined, is combined with argument from classification. [...] Positive Scheme for Practical Argument from Analogy: The right thing to do in S1 was to carry out A. S2 is similar to S1. Therefore, the right thing to do in S2 is carry out A. [...] [Walton's analogy is] best seen as not being deductively valid in the kinds of cases that will be studied here. [...] They are often weak arguments taken by themselves, but can be pivotal, on a balance of considerations, in a larger mass of evidence of which they are a part."
  - source: primary
    tradition: aristotle
    text: aristotle-rhetoric-ii-20-paradeigma-rhys-roberts
    citation: "Aristotle, *Rhetoric* Book II Chapter 20 (Bekker 1393a-1394a), W. Rhys Roberts translation in *The Works of Aristotle* Vol. XI (Oxford University Press 1924). The originating treatment of *paradeigma* (Example/argument-by-analogy) as one of the two common forms of rhetorical argument alongside the *enthymeme*. Aristotle calls paradeigma 'the nature of induction, which is the foundation of reasoning' — establishing analogical-induction as foundational defeasible reasoning. Two sub-types specified: actual-past-facts (historical-parallel, e.g. Darius/Xerxes Egypt-then-Greece pattern argued forward to current Persian king) and invented-by-speaker (which further divides into illustrative-parallel as in Socrates' lot-vs-skill-for-steersmen, and fable as in Stesichorus' horse-bridled-by-man tale warning the Himerans against bodyguard for Phalaris, or Aesop's fox-and-fleas tale defending Samian client). PD (Rhys Roberts d. 1929; Aristotle 384-322 BC). Methodologically-distinct from Walton: Walton gives a formal-pragmatic scheme-catalog with CQ-checklists derived from contemporary argumentation theory; Aristotle gives the RHETORICAL-INDUCTIVE FOUNDATIONS framing — analogy as foundational reasoning-form not as defeasible-presumption-scheme. Local copy in the lexicon corpus."
    quote: "[II.20, 1393a23-1393b8]: The special forms of oratorical argument having now been discussed, we have next to treat of those which are common to all kinds of oratory. These are of two main kinds, 'Example' and 'Enthymeme' [...] We will first treat of argument by Example, for it has the nature of induction, which is the foundation of reasoning. This form of argument has two varieties; one consisting in the mention of actual past facts, the other in the invention of facts by the speaker. Of the latter, again, there are two varieties, the illustrative parallel and the fable (e.g. the fables of Aesop, or those from Libya). As an instance of the mention of actual facts, take the following. [...] For Darius of old did not cross the Aegean until he had seized Egypt; but once he had seized it, he did cross. And Xerxes, again, did not attack us until he had seized Egypt; but once he had seized it, he did cross. If therefore the present king seizes Egypt, he also will cross, and therefore we must not let him."
canonical-instances:
  - "common-law jurisprudence: ruling that case C2 should be decided like prior case C1 because both share the relevant features (subject to distinguishing-by-relevant-disanalogy)"
  - "drug-sniffing-dog Fourth Amendment case (Walton's canonical extended example): dog-detection compared to plain-view-perception; analogy warrants OR fails depending on whether 'specifically-trained-search-instrument' is a relevant disanalogy"
  - "scientific hypothesis-by-analogy: solar system used as analogue to atom; warrants atomic-orbital-shells model until disanalogy (quantum-discreteness) becomes critical"
  - "design-pattern application: Gang-of-Four observer pattern works in C1 (event-dispatch system); should work in C2 (UI-state-binding) if shared features (multi-listener notification, decoupled producers/consumers) carry the relevant load"
  - "ethics-by-cases: trolley-problem variants — fat-man-on-bridge vs trolley-switch — analogical warrant from 'directly-vs-indirectly causing death' carries some load but disanalogies (using-as-means vs side-effect) defeat or distinguish"
  - "medical drug-class extrapolation: drug D has effect E in animal-model M1; predict similar effect in human population given shared pharmacological pathway features; disanalogies (species-specific metabolism, dose-scaling) act as defeaters"
severity-tier: info
status: active
