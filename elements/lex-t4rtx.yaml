id: lex-t4rtx
name: announce-a-routine-errand-as-cover-for-a-decided-permanent-exit
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Having secretly already decided to abandon a shared responsibility, a person can announce an ordinary, brief errand as cover, then not return — avoiding the need to negotiate or confront the other party about the decision. In the Jataka''s tale of Kumbhakara, the Bodhisatta''s wife does exactly this to leave her family for the religious life: "Husband, I am going to the water-tank, do you look after the children," and taking a pot as if she had been going there, she went away and coming to the ascetics outside the town she was ordained by them.'
related: []
evokes: [jataka, sattanipata, kumbhakara-jataka, cover-story-for-a-decided-exit, avoid-confrontation-by-not-returning]
lineage:
  - source: primary
    text: jataka-chalmers1895-kumbhakara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 408, Kumbhakara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Husband, I am going to the water-tank, do you look after the children,\" and taking a pot as if she had been going there, she went away and coming to the ascetics outside the town she was ordained by them."
canonical-instances:
  - "A partner who has quietly decided to leave the business tells the other 'I'm just stepping out to meet a supplier,' and doesn't come back, having already moved their share of the assets the week before."
critical-questions:
  - "Does avoiding confrontation this way spare the other party real distress, or does it just replace one kind of pain with the different, longer-lasting pain of being deceived about the nature of the parting?"
  - "What does the person leaving actually gain from the cover story that an honest, direct departure wouldn't have given them?"
status: active
