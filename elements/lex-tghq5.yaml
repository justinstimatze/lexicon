id: lex-tghq5
name: problem-difficulty-is-typed-by-how-much-of-the-system-must-change
type-in: situation
type-out: typology
_tier: atomic
agent-instruction: "When judging how hard a problem actually is, don't measure difficulty by how many attempts a solution took — measure it by how much of the existing object or system has to change to produce that solution. Altshuller sorts inventive problems into five levels on exactly this axis, from a design tweak using means already built for the purpose, up through a solution that requires changing the entire technical system the object belongs to: 'One can divide problems according to their degree of difficulty into five levels or classes. The very easiest problems, (the first level) are characterized by the use of means (devices, methods, substances) intended precisely for the given goal... In problems of the first level the object (device or method) does not change... At the second level the object is changed but not substantially... At the third level the object is changed essentially and at the fourth it is totally changed; in the fifth the entire technical system is changed in which the object fits.' The worked examples make the axis concrete: level 1 is thickening existing heat insulation around a pipe; level 2 is adding a focusing mirror to a welder's shield (the object gains a new part but keeps its identity); level 3 is a nut-and-bolt pair redesigned with an electromagnetic field replacing mechanical threading (the object is essentially rebuilt); level 4 replaces a wear-inspection method entirely with a different physical principle (luminescent tracers instead of oil-particle counts); level 5 requires discovering a new class of material (a shape-memory alloy) before the engineering problem can even be attempted. Altshuller ties trial-count to level only as a downstream consequence, not the definition: 'Solution of a problem of the first sort requires choosing between a few obvious variants... on the fifth level, the number of trials and errors grows to hundreds of thousands and millions' — the trial-count explosion happens BECAUSE higher levels require reaching further outside the object's own established design space, not the reverse. Diagnostic move: before estimating how hard a problem will be to solve, ask how much of the existing thing would have to change for any given candidate solution to work — a fix that leaves the object's identity and immediate parts intact is a different KIND of problem than one requiring the object's core mechanism, or the larger system it belongs to, to change, and the trial-and-error cost follows from that kind, not the other way around."
