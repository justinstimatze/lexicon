id: lex-xfd3g
name: treating-an-institution-as-the-prize-concedes-its-legitimacy-in-advance
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a contest involves a powerful institution, check whether you're treating that institution as an external power factor to be weighed and worked around, or as the prize both sides are competing to capture. The second framing concedes the fight before it starts, because treating something as worth winning already accepts its authority to grant what's being fought over. Lukács draws this distinction between revolutionary and reformist stances toward the state: 'the great distinction between revolutionary Marxists and pseudo-Marxist opportunists consists in the fact that for the former the capitalist state counts merely as a power factor against which the power of the organised proletariat is to be mobilised. Whilst the latter regard the state as an institution standing above the classes and the proletariat and the bourgeoisie conduct their war in order to gain control of it.' His diagnosis of the cost: 'by viewing the state as the object of the struggle rather than as the enemy they have mentally gone over to bourgeois territory and thereby lost half the battle even before taking up arms.' The reformist stance correctly reads the institution's power; where it goes wrong is in what fighting to control that institution implicitly grants it."
