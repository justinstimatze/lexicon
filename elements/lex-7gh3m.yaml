id: lex-7gh3m
name: escalating-a-controlled-transgression-tests-the-real-basis-of-favor
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Someone uncertain whether their favored treatment rests on merit or on unearned status can find out by deliberately escalating a controlled transgression and observing exactly when the favor breaks, rather than by asking directly or simply assuming. In the Jataka's tale of the royally-favored brahmin, a man enjoying a king's high esteem can't tell whether it's due to his own goodness or merely his birth and pedigree. He resolves the question experimentally: he steals a small sum from the treasury, then a larger one, escalating the theft in stages, and reads the king's response at each threshold as evidence of what the favor was actually built on."
related: []
evokes: [jataka, ekanipata, silavimamsana-jataka, escalating-transgression-tests-the-real-basis-of-favor, controlled-experiment-on-ones-own-standing]
lineage:
  - source: primary
    text: jataka-chalmers1895-silavimamsana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 86, Silavimamsana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"But is his favour due to my goodness or only to my birth, lineage, family, country and accomplishments? I must clear this up without delay.\""
canonical-instances:
  - "An employee unsure whether a manager's leniency reflects genuine trust in their judgment or just inattention starts submitting slightly late deliverables, then progressively later ones, tracking exactly which threshold finally draws a real consequence."
critical-questions:
  - "Does running this test carry a real risk of destroying the very favor being investigated, even if the answer turns out to be reassuring, simply because the transgression itself leaves a record that can't be erased once discovered?"
  - "Is there a less costly way to answer the same question — through direct observation of how the favor-granter treats other people in similar circumstances — that doesn't require personally committing an escalating transgression to find out?"
status: active
