  - "operationally distinct from lex-zfxbw panopticism (Foucault): panopticism names the structural mechanism by which observed subjects self-monitor; bad faith names the self-relational structure by which an agent evades the burden of self-authorization. They compose: under panoptic regimes, bad-faith-toward-facticity (`I am just performing the role the structure compels`) is the standard self-relation."
  - "operationally distinct from lex-qjsgk institutional-order-outlives-its-animating-spirit-and-then-compels (Weber): Weber's primitive is institutional-structural; Sartre's is self-relational. They compose: the iron-cage inhabitant who flees into `I am just doing what the structure requires` (facticity-flight) IS the bad-faith posture of the cage-without-the-spirit."
critical-questions:
  - "Which pole is being collapsed? Practitioner-discipline: before naming the evasion, identify whether the agent is fleeing toward facticity (`I AM X, no choice involved`) or toward transcendence (`I am not really X, the situation does not bind me`). Bad faith comes in two structurally-distinct flavors; the diagnostic is to name which."
  - "Good faith is not the alternative: Sartre treats good-faith-as-full-self-coincidence as equally impossible — the ideal of being-what-one-is is an ideal of being-in-itself, which a consciousness cannot achieve. Practitioner-discipline: do not propose that the agent should simply BE what they ARE; propose authenticity-as-holding-both-poles-in-tension as the structurally-different third term."
  - "Authenticity is not a fixed posture: Sartre explicitly notes that the description of authenticity does not belong to the bad-faith analysis; treating authenticity as a steady state one can occupy is itself a bad-faith move. Practitioner-discipline: authenticity is a moment-by-moment practice of owning choice-under-unchosen-conditions, not an identity-claim."
  - "Self-deception is structurally possible because belief is unstable: bad faith requires the agent to know-and-not-know simultaneously; the standard objection (`how can one deceive oneself?`) is dissolved by Sartre's analysis of belief's constitutive instability (`to believe is not to believe`). Practitioner-discipline: do not treat bad faith as a cynical lie or as a cognitive failure; it is a structural self-relation made possible by what belief is."
  - "Composition with iron-cage + panopticism: under iron-cage + panoptic conditions (lex-qjsgk + lex-zfxbw), bad-faith-toward-facticity becomes the standard institutional posture (`the structure compels, the role determines, no choice was available`). Practitioner-discipline: when analyzing institutional behavior, name the bad-faith-toward-facticity that the structure enables; reform that targets only the structure without engaging the self-relation will leave the posture intact."
  - "AI agent application: when an AI system evades responsibility for output, identify which bad-faith pole it is occupying. Facticity-flight: `I am just a language model.` Transcendence-flight: `that role was not really me.` Practitioner-discipline in alignment work: design training + evaluation that surfaces both postures and requires the system to own conduct-under-training-conditions-it-did-not-choose — the structural analog of Sartre's authenticity."
