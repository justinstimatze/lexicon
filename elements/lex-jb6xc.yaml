id: lex-jb6xc
name: seeing-where-a-craving-originates-can-end-the-craving-itself
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Having just confronted his own desire for something, a person can conclude that the desire''s true origin is nothing external but his own will, and this cognitive insight — not further resistance — is what ends the craving altogether. This separates insight-based extinction of a drive from mere behavioral suppression of it. In the Jataka''s tale of Gangamala, Half-penny states the insight directly after nearly acting on his desire for sole power: "I have seen thy roots, Desire: in a man''s own will they lie. / I will no more wish for thee, and thou, Desire, shalt die."'
related: []
evokes: [jataka, atthanipata, gangamala-jataka, insight-dissolves-craving, cognitive-defusion]
lineage:
  - source: primary
    text: jataka-chalmers1895-gangamala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 421, Gangamala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "I have seen thy roots, Desire: in a man's own will they lie. / I will no more wish for thee, and thou, Desire, shalt die."
canonical-instances:
  - "Someone who spends years white-knuckling their way past the urge to check an ex's social media finally stops wanting to the moment they recognize the urge was never really about the ex, but about needing reassurance they'd been the one who mattered more."
critical-questions:
  - "Is naming the true origin of a craving actually sufficient to end it, or does the insight only work here because it arrives at a moment of unusually high stakes?"
  - "How would this insight-based extinction be told apart from a craving that simply faded on its own for unrelated reasons, with the insight only coinciding with the fade?"
status: active
