id: lex-xtfe3
name: passion-relabels-flaws-as-virtues-via-matched-euphemism
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when evaluating whether someone's positive assessment of a person, product, or cause reflects genuine absence of flaws or a systematic re-description of flaws already noticed. Lucretius's De Rerum Natura (c. 55 BCE), Book IV, catalogues the specific mechanism by which infatuation distorts perception: not by making the lover fail to notice defects, but by supplying a matched flattering euphemism for each specific defect noticed. 'Eyeless with passion,' lovers 'assign to them / Graces not theirs in fact' — and Lucretius gives the actual substitution table: 'The black-skinned girl is \"tawny like the honey\"; / The filthy and the fetid's \"negligee\"; / The cat-eyed she's \"a little Pallas\"... / The sinewy and wizened's \"a gazelle\"; / The pudgy and the pigmy is \"piquant\"... / The stuttering and tongue-tied \"sweetly lisps\"; / The mute girl's \"modest\"; and the garrulous, / The spiteful spit-fire, is \"a sparkling wit\"... / The blubber-lipped is \"all one luscious kiss\".' The mechanism is diagnostic of genuine, specific relabeling rather than generic overlooking: each entry pairs ONE concrete, nameable defect with ONE concrete, positively-valenced redescription of that SAME defect — not a different, unrelated virtue offered as compensation. A stutter becomes 'sweetly lisping' (matched to speech), not 'has beautiful eyes' (an unmatched substitution that would just be a different cognitive move, selective emphasis). The defect is not ignored, hidden, or forgotten — it is renamed. Lucretius supplies his own diagnostic test for whether this mechanism is operating: check whether the same trait, described by a disinterested observer, would receive a neutral-to-negative label — 'let her face possess what charm ye will... forsooth she does the same things — and we know she does — / All, as the ugly creature' — the underlying fact is unchanged; only the label attached to it has moved. Portable beyond romantic infatuation: recognizable whenever an evaluator under strong motivational pull (financial stake, tribal loyalty, sunk cost, admiration) produces a suspiciously complete run of positively-valenced redescriptions for what would, from outside the relationship, read as a neutral list of defects — a run of 'quirky not broken,' 'scrappy not underfunded,' 'passionate not volatile' is running the identical cipher Lucretius catalogued for lovers twenty-one centuries earlier."
related: [lex-we98d, lex-rcj6y, lex-96xn9, lex-2qekt]
evokes: [lucretius, de-rerum-natura, book-iv, eyeless-with-passion, tawny-like-the-honey, defect-to-euphemism-cipher, matched-substitution, graces-not-theirs-in-fact, disinterested-observer-test]
lineage:
  - source: primary
    text: lucretius-c55bce-de-rerum-natura-book-iv-euphemistic-idealization
    citation: "Titus Lucretius Carus, De Rerum Natura [On the Nature of Things], Book IV, trans. William Ellery Leonard (c. 55 BCE). In his account of the ills of erotic obsession, Lucretius catalogues how a lover 'eyeless with passion' assigns a beloved 'graces not theirs in fact,' giving a matched list of specific physical/behavioral defects each paired with a specific flattering euphemism, and states directly that a disinterested observer would apply the neutral or negative label to the same underlying trait. PD globally (Lucretius d. c. 55 BCE; Leonard translation itself PD, Leonard d. 1944, first published 1916)."
    quote: "[The setup — passion assigns unearned graces:] 'For so men do, / Eyeless with passion, and assign to them / Graces not theirs in fact.' [The matched-euphemism catalogue:] 'The black-skinned girl is \"tawny like the honey\"; / The filthy and the fetid's \"negligee\"; / The cat-eyed she's \"a little Pallas,\" she; / The sinewy and wizened's \"a gazelle\"; / The pudgy and the pigmy is \"piquant, / One of the Graces sure\"; the big and bulky / O she's \"an Admiration, imposante\"; / The stuttering and tongue-tied \"sweetly lisps\"; / The mute girl's \"modest\"; and the garrulous, / The spiteful spit-fire, is \"a sparkling wit\"; / And she who scarcely lives for scrawniness / Becomes \"a slender darling\"; \"delicate\" / Is she who's nearly dead of coughing-fit; / The pursy female with protuberant breasts / She is \"like Ceres when the goddess gave / Young Bacchus suck\"; the pug-nosed lady-love / \"A Satyress, a feminine Silenus\"; / The blubber-lipped is \"all one luscious kiss\"— / A weary while it were to tell the whole.' [The disinterested-observer test:] 'But let her face possess what charm ye will, / Let Venus' glory rise from all her limbs,— / Forsooth there still are others; and forsooth / We lived before without her; and forsooth / She does the same things — and we know she does — / All, as the ugly creature, and she scents, / Yes she, her wretched self with vile perfumes; / Whom even her handmaids flee and giggle at / Behind her back.'"
canonical-instances:
  - "The direct pattern-application template: a suspiciously complete run of matched flattering redescriptions for what an outside observer would list as neutral-to-negative traits is evidence the euphemism-cipher is operating, not evidence the traits are genuinely positive."
  - "The catalogue itself as a diagnostic checklist device: each specific defect (dark skin, foul odor, thinness, a lisp, silence, chattiness, coughing, heaviness, a snub nose, thick lips) paired with its specific matched euphemism, demonstrating the substitution is defect-by-defect rather than a vague general glow."
  - "Startup-pitch or political-loyalty euphemism as the identical cipher applied outside romance: 'pre-revenue' for 'no customers,' 'iterating' for 'failing repeatedly,' 'disruptive' for 'noncompliant,' 'plain-spoken' for 'undiplomatic' — each pairs one specific concrete shortfall with one specific flattering matched relabeling, run by evaluators with a financial or tribal stake rather than a romantic one."
  - "Lucretius's own built-in test — would a disinterested observer apply a different label to the same underlying fact? — as a portable diagnostic question usable on any evaluation suspected of running this cipher, romantic or otherwise."
critical-questions:
  - "is this the same claim as lex-rcj6y (motivated-reasoning)? No — motivated reasoning is about EVIDENCE EVALUATION: applying a lower evidentiary bar to conclusions you favor. This atom is about LABEL SUBSTITUTION for a fact already conceded: the flaw is not evidentially minimized, disputed, or explained away — it is openly present and simply renamed with a positively-valenced term matched to its specific shape. They compose: motivated reasoning can explain why the relabeling doesn't register as dishonest to the person performing it, but the two are distinct operations (evidence-weighting vs. term-substitution)."
  - "is this the same claim as lex-96xn9 (envy-and-impotence-route-to-value-inversion, Aesop's fox-and-sour-grapes via Scheler)? No — lex-96xn9's mechanism DENIES the positive value of something UNATTAINABLE, resolving the tension of wanting-but-failing-to-get by declaring the good undesirable. This atom's mechanism AFFIRMS positive value for a flaw in something ALREADY ATTAINED or possessed, and requires no unattainability or felt impotence at all. The direction of distortion is opposite — devalue the unattained good (lex-96xn9) versus revalue the attained defect (this atom) — even though both are dissonance-driven relabeling operations."
  - "is this the same claim as lex-2qekt (image-based desire cannot be sated)? No, though both come from the same Book IV love-critique sequence and describe companion symptoms of the same underlying infatuated state. lex-2qekt concerns why the CRAVING itself cannot be resolved by proximity — a claim about desire's object and the physics of perception. This atom concerns how PERCEPTION OF THE BELOVED gets distorted once infatuation is present — a claim about evaluative language and defect-relabeling. Use lex-2qekt for the escalating-craving symptom; use this atom for the distorted-evaluation symptom. Lucretius presents them as two separate ills of one condition, not a single claim."
  - "does noticing this pattern in oneself or another prove the underlying relationship, investment, or cause is actually bad? No — Lucretius's point is diagnostic of a PERCEPTION DISTORTION, not a verdict on the object's actual worth; a genuinely fine trait can also be accurately described in flattering terms without running the cipher. The diagnostic signal is specifically a suspiciously complete, defect-matched run of euphemisms covering what would otherwise read as a list of real shortfalls, checked against the disinterested-observer test Lucretius himself supplies — not the mere presence of any positive language."
