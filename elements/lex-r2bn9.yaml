id: lex-r2bn9
name: undetectable-difference-is-still-a-difference
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone argues that two things must be identical, or that a distinction is meaningless, because no observation currently available can tell them apart, don't accept the inference. Popper's reply to the positivist doctrine that empirically indistinguishable objects are identical: two clocks may look and behave exactly alike even though one runs mechanically and the other electrically, and their difference can usually be found by looking closer. But push the case: 'if we find two pound notes which are physically indistinguishable (even as to the number) we may have good reason to believe that one of them at least is forged; and a forged note does not become genuine because the forgery is perfect or because all historical traces of the act of forgery have disappeared.' Indistinguishability describes your instruments and your evidence, no more. What produced a thing, what's running inside it, or what it fundamentally is can stay real and settled while sitting permanently past the reach of every method currently on hand. Diagnostic move: when 'we can't tell them apart, so there's no real difference' is offered as a conclusion, separate the epistemic claim (our current tests don't distinguish them) from the metaphysical one (therefore they don't differ) -- the first never licenses the second. This does not mean every unfalsifiable posited difference should be believed; per [[lex-shjsa]], an unlocated claim of difference can't be tested either. It means the absence of a currently available test is not itself evidence of sameness."
related: [lex-shjsa]
scaffolds-from: [lex-shjsa]
evokes: [popper-1953-language-and-the-body-mind-problem, forged-pound-note, two-clocks-mechanical-and-electrical, positivist-doctrine-of-identity-of-indiscernibles, empirically-indistinguishable-is-not-the-same-as-identical]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Language and the Body-Mind Problem' (paper delivered to the 11th International Congress of Philosophy, Brussels, 1953; first published in its Proceedings, vol. 7), Ch. 12 of Conjectures and Refutations (Routledge Classics, 2002), p.400, Section 4.3."
    quote: "'Objections to this view, and to the view 3.3, are usually based on the positivistic doctrine of the identity of empirically indistinguishable objects. Two clocks, the argument goes, may look alike, although the one works mechanically and the other electrically, but their difference can be discovered by observation. If no difference can be so discovered, then there simply is none. Reply: if we find two pound notes which are physically indistinguishable (even as to the number) we may have good reason to believe that one of them at least is forged; and a forged note does not become genuine because the forgery is perfect or because all historical traces of the act of forgery have disappeared.'"
canonical-instances:
  - "A generated image is pixel-for-pixel indistinguishable from an unedited photograph, and no current detector can tell them apart. The image is still, in fact, generated rather than photographed -- the difference is real and simply outran the available tests, not erased by outrunning them."
  - "Two wines taste identical in a blind panel, one from the labeled vineyard and one a substitute bottled under its name. The panel's inability to tell them apart is evidence about the panel's palate and the two wines' flavor profile, not evidence that the substitute is the genuine article."
critical-questions:
  - "Doesn't this open the door to believing in undetectable differences whenever convenient -- ghosts in the machine, hidden essences no test could ever reach? No -- the atom only blocks the inference FROM indistinguishability TO identity; it doesn't license asserting a specific undetectable difference exists. Per [[lex-shjsa]], a claimed difference still needs to be pinned to some check that could in principle find it -- a different test than the one that just came up empty is fine, but naming none at all reduces the claim to an unlocated existence claim."
  - "In practice, if a difference can never be detected by any method, what does insisting it's 'real' actually buy you? Sometimes very little for present purposes -- but the practical stakes show up the moment detection methods improve, provenance later surfaces, or the difference matters for a reason unrelated to detection at all (the forged note is still a crime and still worthless to a bank that later authenticates it), which is exactly when 'we couldn't tell them apart' would otherwise have been mistaken for 'so it didn't matter.'"
status: active
