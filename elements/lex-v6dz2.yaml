id: lex-v6dz2
name: equality-rests-on-equal-weighing-of-interests-not-equal-capacities
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a principle of equality is being grounded or attacked by appeal to some factual claim about capacities (intelligence, rationality, 'moral personality'), notice that any such factual basis is doomed — no natural characteristic is possessed equally by all members of the class the principle is meant to cover, and any characteristic sophisticated enough to try (IQ, reasoning ability) can in principle be measured and would then license exactly the hierarchical ranking the equality principle was meant to forbid. Singer's fix: ground equality not in a factual claim about what beings ARE but in a moral principle about how their INTERESTS are weighed — the principle of equal consideration of interests, which holds that we give equal weight, in our moral deliberations, to the LIKE interests of all those affected by an action, regardless of whose interests they are. This is deliberately a MINIMAL principle, not a demand for equal treatment or equal outcomes: it can produce starkly unequal treatment (give both morphine doses to the more severely injured earthquake victim, not one to each) and can even, in special cases, widen rather than narrow a welfare gap between two people (when treating the less-injured victim saves a leg but treating the more-injured victim only saves a toe, the principle directs resources to the less-injured victim). What the principle rules out is not unequal treatment but treating an interest as counting for less, or not at all, because of an irrelevant fact about whose interest it is — race, sex, IQ score, species. The diagnostic payoff: when someone defends a hierarchy by pointing to real, measured differences in capacity between the ranked groups, the question is not whether the measurement is accurate but whether the characteristic being measured was ever the true ground of equal moral status to begin with — since it was never a factual-sameness claim, no amount of factual difference can undo it."
related: [lex-9wbd3, lex-7mdpd, lex-gzgn3, lex-vx867, lex-q6z64, lex-pdpen]
scaffolds-from: [lex-9wbd3, lex-gzgn3, lex-vx867]
evokes: [equal-consideration-of-interests, minimal-principle-of-equality, interests-as-the-unit-of-moral-weighing, declining-marginal-utility, hierarchy-of-intelligence-thought-experiment, factual-basis-vs-moral-principle]
lineage:
  - source: primary
    text: singer-2011-practical-ethics-ch2
    citation: "Peter Singer, Practical Ethics, 3rd edition (Cambridge University Press, 2011), Chapter 2 'Equality and Its Implications.' Singer builds the argument against Rawlsian 'range property'/'moral personality' accounts of equal human worth (John Rawls, A Theory of Justice, 1971) and traces the equal-consideration-of-interests formulation through Bentham's felicific calculus and R.M. Hare's universal prescriptivism, citing it as the most defensible ground offered in the philosophical literature for the belief that all humans are entitled to equal moral consideration despite manifest differences between individuals."
    quote: "'There is no logically compelling reason for assuming that a difference in ability between two people justifies any difference in the amount of consideration we give to their interests. Equality is a basic ethical principle, not an assertion of fact... The essence of the principle of equal consideration of interests is that we give equal weight in our moral deliberations to the like interests of all those affected by our actions... What the principle really amounts to is: an interest is an interest, whoever's interest it may be.' [On the principle being minimal, not egalitarian:] 'Equal consideration of interests is a minimal principle of equality in the sense that it does not dictate equal treatment... Thus, equal consideration of interests can, in special cases, widen rather than narrow the gap between two people at different levels of welfare. It is for this reason that the principle is a minimal principle of equality, rather than a thorough-going egalitarian principle.'"
canonical-instances:
  - "the hierarchy-of-intelligence thought experiment: a society that gives intelligence tests and assigns slave/citizen/slave-owner status by score band is exactly as abhorrent as one sorted by race or sex, even though (unlike race/sex) IQ score genuinely does track a real difference between individuals — proving the wrongness cannot rest on 'the sorting characteristic doesn't track a real difference,' since here it does."
  - "the two-victims-one-dose-of-morphine case: equal consideration of interests directs both shots to the more severely injured earthquake victim rather than one to each, an unequal-treatment outcome that nonetheless follows directly, not despite, the equality principle."
  - "the leg-vs-toe triage case: when treating the less-injured victim saves a leg but treating the more-injured victim only saves a toe, equal consideration of interests directs the scarce treatment to the LESS injured party — a case where the principle widens rather than narrows the gap in outcomes between the two, showing the principle is not a disguised egalitarianism-of-outcome."
critical-questions:
  - "is the disputed hierarchy actually being defended on factual-sameness grounds, or does the defender already concede the factual difference and argue it's morally relevant? Singer's argument specifically dissolves defenses of the first kind; a defender who instead argues that greater capacity licenses greater WEIGHT for a given being's like interests (not that lesser capacity licenses discounting an interest already established as like) is making a different, not automatically dissolved, claim."
  - "when does 'equal consideration' produce equal treatment versus unequal treatment? Only when the underlying interests are in fact identical in kind and degree — the moment interests differ (more severe pain, more urgent need), equal consideration requires WEIGHTING toward the greater interest, which is unequal treatment. Mistaking this atom for a demand for equal treatment is the most common misapplication."
  - "how does this differ from lex-q6z64 (distance-and-diffuse-responsibility-do-not-modulate-the-moral-demand)? lex-q6z64, from the same author's earlier famine essay, addresses a narrower question: whether geographic or numerical distance from a victim reduces an already-established obligation to help. This atom addresses a prior, more foundational question: what grounds the claim that two beings' interests deserve EQUAL WEIGHT in the first place, independent of any question about distance or numbers of other potential helpers."
