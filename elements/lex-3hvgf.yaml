evokes: [a-detailed-warning-is-also-a-detailed-plan, cushing-how-the-summer-birds-came, sit-right-down-here-said-the-old-people, knowing-beforehand-he-was-prepared-and-protected]
lineage:
  - source: primary
    text: cushing-summer-birds-mothers-warning-becomes-the-boys-blueprint
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Summer Birds Came.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'they have a way of throwing from their mouths or breath a sort of fluid which, whenever it strikes a person, burns him... Whenever a man arrives at their den they are very polite... they say: Come in; sit down right here in the middle of the floor before the fire. But as soon as the person is seated in their house they gather round the walls and throw this venom on him, and he dies almost immediately.' ... The boy sat down... they began to throw their venom at him, and continued until he was all covered with it; but, knowing beforehand, and being the child of the gods, he was prepared and protected, and it did him no harm. 'Thank you, thank you,' said the boy. 'I will do the same thing.'"
canonical-instances:
  - "A new employee is warned in detail by a colleague exactly how a manipulative senior manager isolates and pressures people in one-on-one meetings, and rather than simply avoiding those meetings, uses the detailed warning to recognize each tactic as it happens in real time, staying immune to pressure the manager assumes will work exactly as it always has."
  - "A cybersecurity trainee receives a detailed briefing on precisely how a known phishing campaign operates, down to its specific pretexts and follow-up sequence, and uses that same detailed knowledge not only to recognize and resist the attack when it arrives, but to build a decoy response that wastes the attacker's own follow-up sequence against them."
critical-questions:
  - "does this pattern depend entirely on the warned party being unusually well-protected or resourced, the boy is explicitly 'the child of the gods' -- would extracting a warning's operational detail as a blueprint actually help an ordinary person survive contact with the danger it describes, or only someone with some other advantage already in hand?"
  - "is there a meaningful difference between using a warning's detail to survive a danger you chose to face anyway, versus using it to actively seek out and destroy that danger -- does turning defensive information into an offensive plan change the ethics of having sought the warning in the first place?"
  - "how would the mother's warning have functioned differently if she had suspected her son might use it this way -- does a warning-giver need to withhold operational detail specifically to prevent it being repurposed, and what does that cost in terms of how well protected the listener actually is if they go anyway?"
