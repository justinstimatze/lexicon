id: lex-6vh6y
name: need-omnipresence-explains-nothing-until-culturally-activated
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When someone invokes \"necessity\" or \"need\" to explain why a specific invention, discovery, or line of interest arose, check first whether the need being cited is actually constant and omnipresent across time, place, and population -- if it is, it has zero power to explain why THIS variation happened at THIS moment, because a fixed background condition cannot explain a variable outcome (the same logical gap Mill's methods of agreement and difference formalize: a candidate cause that never varies cannot be discriminated as the cause of anything that does vary). Merton's target is the folk-cliche \"necessity is the mother of invention\": in the technical sphere needs are so pervasive that they \"explain little,\" and he backs this with the historical null result directly -- countless human needs have gone unsatisfied throughout the ages despite being constantly present. A need only becomes causally operative -- capable of actually directing effort into a specific channel -- once it clears two further, non-trivial conditions: (1) it must be a genuine, locatable part of the culture in question, not a modern observer's retrospective assignment of what people 'should' have needed, and (2) it must be consciously experienced as a need by some actual members of that society. Merton's own closing formula makes the conditionality explicit rather than incidental: he lists three separate prerequisites (an established habit of solving needs by technological invention, a prior accumulated stock of technical/scientific knowledge, and an expanding economy) before allowing that necessity is the '(foster) mother of invention' -- the qualifier 'foster' signals that necessity alone never does the begetting. Diagnostic move: before crediting need or necessity for an outcome, ask what actually varied between the cases where the outcome occurred and the cases where it didn't -- if the need was constant but the outcome wasn't, the explanatory work is being done by whatever else varied (a technique newly available, an institution newly interested, a group that newly registered the old need as ITS problem), not by the need itself."
