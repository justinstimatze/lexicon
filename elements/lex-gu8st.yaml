lineage:
  - source: primary
    tradition: axelrod-hamilton-cooperation
    text: axelrod-hamilton-1981-1984-evolution-of-cooperation
    citation: "Robert Axelrod, The Evolution of Cooperation (Basic Books, 1984), Page 2-3 (The Computer Tournament — four properties)."
    quote: "The analysis of the data from these tournaments reveals four properties which tend to make a strategy successful: avoidance of unnecessary conflict by cooperating as long as the other player does, provocability in the face of an uncalled-for defection by the other, forgiveness after responding to a provocation, and clarity of behavior so that the other player can recognize and adapt to your pattern of action."
  - source: primary
    tradition: axelrod-hamilton-cooperation
    text: axelrod-hamilton-1981-1984-evolution-of-cooperation
    citation: "Robert Axelrod, The Evolution of Cooperation (Basic Books, 1984), Page 5 (The Value of Provocability)."
    quote: "Cooperation theory has implications for individual choice as well as for the design of institutions. Speaking personally, one of my biggest surprises in working on this project has been the value of provocability and that it is important to respond sooner, rather than later. I came to this project believing one should be slow to anger. The results of the computer tournament for the Prisoner's Dilemma demonstrate that it is actually better to respond quickly to a provocation. It turns out that if one waits to respond to uncalled-for defections, there is a risk of sending the wrong signal."
  - source: primary
    tradition: axelrod-hamilton-cooperation
    text: axelrod-hamilton-1981-1984-evolution-of-cooperation
    citation: "Robert Axelrod, The Evolution of Cooperation (Basic Books, 1984), Page 4 (Live-and-Let-Live system in trench warfare)."
    quote: "The soldiers of these opposing small units actually violated orders from their own high commands in order to achieve tacit cooperation with each other… cooperation based upon reciprocity can develop even between antagonists."
canonical-instances:
  - The Christmas Truce of 1914 + the broader WWI trench-warfare live-and-let-live system — Axelrod's primary historical example. Soldiers in opposing trenches reciprocally restrained fire even against high-command orders, because they faced the same opponent day after day (long shadow of future) and could detect violations immediately.
  - Diamond markets — Axelrod cites these as norm-enforced cooperation among repeated traders; reputation-loss from defection is severe enough that traditional handshake deals enforce contracts across millions of dollars.
  - Open-source contribution norms — reciprocity ratchets contribution into projects; defectors (vendors who take without giving back) get socially-sanctioned, hesitatingly.
  - Neighborhood-level reciprocity in driveway snow-clearing, package-receipt-for-absent-neighbor, etc. — works because of repeated interaction and clear detection.
  - International arms control agreements — only stable when violations can be detected quickly enough that provocability still functions; this is why monitoring regimes are decisive, not auxiliary.
  - Tit-for-tat in cell-biology / immune-microbiome dynamics — bacteria producing public-good metabolites only when their kin neighbors also do (kin-recognition-driven reciprocity).
