id: lex-vf5ff
name: rule-out-the-cheap-cause-before-paying-for-the-expensive-fix
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a malfunction has several candidate causes of very different repair cost, test the cheap, common cause first -- before authorizing or assuming the expensive one -- especially when the party doing the diagnosis stands to profit more from the expensive answer. Sclar tells the story against herself: her first car made a strange noise after she shut off the engine, and she paid for 'some unnecessary (and unsuccessful) repairs' before it occurred to her to ask the shop to test the ten-dollar pressure cap, which turned out to be the whole problem. She then names someone who paid for a full radiator rebuild and a new water pump before discovering the same ten-dollar cap was the actual cause. Her stated lesson generalizes past cooling systems: 'Professionals sometimes try the more profitable solutions first. Do-it-yourselfers try the cheapest solution first.' The mechanism has two parts, and both matter. First, ordering diagnostic tests by cost before certainty is efficient on its own -- ruling out a ten-dollar part before a thousand-dollar rebuild saves money even when the expensive cause turns out to be real, because you've only paid for the cheap test. Second, when the diagnosing party is also the one selling the fix, their incentive doesn't point toward this ordering by default -- profit correlates with the size of the repair, not with the truth of the diagnosis, so a diagnosis that starts big is not automatically evidence the problem is big. The discipline is to ask, or check yourself, whether the cheapest plausible cause has actually been tested and excluded before spending on the next one up the cost ladder -- not to distrust every diagnosis, but to notice when the proposed starting point is expensive and ask why it wasn't the last resort instead of the first."
related: [lex-28s3q, lex-c2bwy, lex-sgd2s, lex-us7nk]
