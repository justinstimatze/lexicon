id: lex-xj64p
name: staging-a-cover-story-in-advance-to-conceal-planned-violence
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'Someone planning a violent act that will need to be explained afterward can script the entire false cover narrative in advance — a pretext for leaving, a story to tell witnesses beforehand, and a plan for self-inflicted wounds and a fabricated robbery afterward — so the explanation is ready before the act itself occurs. In the Jataka''s tale of Takkala, the wife scripts the son''s entire cover story for murdering his own father in advance: "at break of day, go to the place where your father sleeps; tell him very loud, that all may hear, that a debtor of his is in a certain village... When you get there, bury him in a pit, make a noise as if you had been robbed, wound and wash your head, and return."'
related: [lex-jtngt]
evokes: [jataka, dasanipata, takkala-jataka, premeditated-cover-story, staged-alibi-for-violence]
lineage:
  - source: primary
    text: jataka-chalmers1895-takkala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 446, Takkala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "at break of day, go to the place where your father sleeps; tell him very loud, that all may hear, that a debtor of his is in a certain village... When you get there, bury him in a pit, make a noise as if you had been robbed, wound and wash your head, and return."
canonical-instances:
  - "Before staging a break-in to cover an insurance fraud, a man rehearses a specific story to tell a neighbor beforehand, scratches his own arm to fake a struggle, and pre-plans exactly what he will say to police, all before actually damaging the property he plans to claim was stolen from."
critical-questions:
  - "Does the elaborateness of the advance staging make the underlying act any more or less morally serious than an identical act committed impulsively with no cover story prepared?"
status: active
