canonical-instances:
  - "A recent ex-smoker who has quit for three weeks lectures strangers about secondhand smoke with more heat than a lifelong non-smoker ever would — the intensity tracks unresolved craving and identity work, not settled conviction, and it is expected to cool as the old attachment fades rather than to hold steady."
  - "An employee who just left a company for a direct competitor badmouths the old employer more sharply than colleagues who left years earlier and have moved on emotionally — operationally distinct from lex-pnh7q's renegade-or-convert framing, which explains why the LABEL differs by standpoint; this atom explains why the INTENSITY itself runs hot in the first place, as a function of how recently and incompletely the old attachment was severed."
critical-questions:
  - "Merton frames this as psychologically general (ambivalence outlasts formal departure), but does the doubly-reinforced pattern require the departure to have been at least partly voluntary or morally freighted — would someone pushed out involuntarily and without any residual identification (Parsons's true indifference case) simply skip the extremity phase entirely?"
  - "If the extremity is diagnostic of unresolved ambivalence rather than a stable trait, what would falsify that prediction — is there evidence of converts or ex-members whose zeal or hostility does NOT cool over time, and if so, does that mean the ambivalence never resolved, or that some other mechanism (status-seeking within the new group, for instance) has taken over and is sustaining the intensity instead?"
