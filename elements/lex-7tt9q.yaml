id: lex-7tt9q
name: absorb-a-contested-resource-pool-yourself-then-release-it-once-safe
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a rival is trying to recruit or acquire a pool of people or resources you don't currently need, don't limit your response to blocking them directly -- consider taking the resource yourself first, purely to keep it out of their hands, and letting it go again once the danger has passed. Kautilya gives the king two distinct moves against an enemy's mobilization effort, and the second is the less obvious one: 'When the enemy tries to mobilise his own troops, the king shall obstruct the mobilisation, divert the potential recruits elsewhere or render the mobilisation ineffective. Or, the king may recruit troops first [to protect them joining the enemy] and, when the time is ripe, disband them.' The first move -- obstruct, divert, sabotage -- treats the enemy's recruitment as a process to interfere with directly. The second move bypasses that fight entirely: instead of contesting who gets to recruit the pool, you simply become its employer first, which makes the contest moot without a confrontation, and you carry the resource only as long as the risk of your rival getting it exists. The word 'disband' matters -- this isn't a commitment to permanently maintain a larger force than you need, it's a temporary denial measure, and the cost of holding people or resources you don't actually want is treated as smaller than the cost of letting a rival have them. Diagnostic move: when a rival is competing for a pool of talent, supply, or capacity you don't currently have a use for, don't only ask whether you need it -- ask what it costs your rival to be denied it, and whether absorbing it yourself, even temporarily and at some carrying cost, is cheaper than letting them get it uncontested; if so, take it now and release it later, once the moment that made it dangerous in their hands has passed."
