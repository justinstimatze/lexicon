id: lex-875gz
name: nonlinear-or-discontinuous-metric-choice-induces-apparent-emergence-in-smoothly-improving-capability
common-name: "What looks like a jump may be the measure"
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When a capability appears to 'emerge' suddenly past a scale threshold — to be absent at one size and abruptly present at the next — first ask: what does the measurement function actually do? If it's an exact-match grade, multiple-choice accuracy, or any nonlinear/discontinuous transformation of the underlying per-token (or per-step) error rate, the apparent discontinuity may be the SHAPE OF THE METRIC, not the shape of the underlying capability. Linear or continuous metrics on the SAME outputs may show a smooth, predictable improvement. Practitioner-discipline: before reading a discontinuity as evidence of a new mechanism, regrade with a linear metric (per-token loss, continuous distance, partial credit) and see if the discontinuity survives. Transferable beyond LLMs: anywhere you measure capability with a thresholded metric, you can manufacture or eliminate apparent emergence by switching the metric."
related: [lex-4yhqs, lex-chp44, lex-ds73b, lex-axa6h, lex-stppu, lex-6pd48, lex-tmy67, lex-yejp2, lex-4697f, lex-hr5h5]
evokes: [the-mirage-of-emergence, metric-shape-not-system-shape, exact-match-grades-create-cliffs, regrade-with-continuous-metric, what-the-thresholding-does, scale-curves-vs-metric-curves]
lineage:
  - source: primary
    text: wei-et-al-2022-emergent-abilities-of-llms
    citation: "Jason Wei, Yi Tay, Rishi Bommasani, Colin Raffel, Barret Zoph, Sebastian Borgeaud, Dani Yogatama, Maarten Bosma, Denny Zhou, Donald Metzler, Ed H. Chi, Tatsunori Hashimoto, Oriol Vinyals, Percy Liang, Jeff Dean, William Fedus, 'Emergent Abilities of Large Language Models,' Transactions on Machine Learning Research (August 2022; arXiv:2206.07682). The paper that catalyzed the 'emergent abilities' discourse in AI safety. Defines emergence operationally for LLMs: 'abilities that are not present in smaller-scale models but are present in large-scale models; thus they cannot be predicted by simply extrapolating the performance improvements on smaller-scale models.' Surveys instances across few-shot prompting and augmented prompting strategies; positions the question as a major one for AI safety because if dangerous capabilities can emerge unpredictably, scaling becomes a potential safety hazard. The atom takes Wei et al. as the original framing; Schaeffer et al. 2023 as the metric-artifact critique. The transferable claim is the META-pattern (metric choice deforms apparent capability scaling), not the AI-specific question of whether LLMs have qualitatively new abilities at scale."
    quote: "[Wei et al. 2022 Abstract:] 'Scaling up language models has been shown to predictably improve performance and sample efficiency on a wide range of downstream tasks. This paper instead discusses an unpredictable phenomenon that we refer to as emergent abilities of large language models. We consider an ability to be emergent if it is not present in smaller models but is present in larger models. Thus, emergent abilities cannot be predicted simply by extrapolating the performance of smaller models. The existence of such emergence raises the question of whether additional scaling could potentially further expand the range of capabilities of language models.' [The Anderson 'More is Different' framing they adopt, §1:] 'Emergence is when quantitative changes in a system result in qualitative changes in behavior.' [The AI-safety implication, §1:] 'performance for certain downstream tasks counterintuitively does not appear to continuously improve as a function of scale, and such tasks cannot be predicted ahead of time.'"
  - source: primary
    text: schaeffer-miranda-koyejo-2023-emergent-abilities-mirage
    citation: "Rylan Schaeffer, Brando Miranda, Sanmi Koyejo, 'Are Emergent Abilities of Large Language Models a Mirage?' NeurIPS 2023 (arXiv:2304.15004). The metric-artifact critique. Argues that emergence in LLMs appears mainly under nonlinear or discontinuous metrics (Multiple-Choice Grade, Exact-String-Match) that deform smoothly-scaling per-token error rates into apparent discontinuities. Demonstrates via three convergent analyses: (1) test on InstructGPT/GPT-3 family — switching to linear metrics eliminates the apparent emergence; (2) meta-analysis of BIG-Bench finds >92% of emergent abilities appear under one of two nonlinear metrics; (3) constructs novel apparent-emergence cases in vision tasks by metric choice alone. The transferable atom is Schaeffer's mechanistic claim about metric-deformation, generalized: any nonlinear threshold on a smoothly-improving quantity can manufacture apparent discontinuity. This applies to capability evaluation broadly (educational test cutoffs, regulatory thresholds, performance benchmarks)."
    quote: "[Schaeffer et al. 2023 Abstract:] 'Here, we present an alternative explanation for emergent abilities: that for a particular task and model family, when analyzing fixed model outputs, emergent abilities appear due [to] the researcher's choice of metric rather than due to fundamental changes in model behavior with scale. Specifically, nonlinear or discontinuous metrics produce apparent emergent abilities, whereas linear or continuous metrics produce smooth, continuous, predictable changes in model performance.' [The structural argument, §1:] 'sharp and unpredictable changes might be induced by the researcher's choice of measurement, even though the model family's per-token error rate changes smoothly, continuously and predictably with increasing scale. Specifically, our alternative posits that emergent abilities are a mirage caused primarily by the researcher choosing a metric that nonlinearly or discontinuously deforms per-token error rates.' [The BIG-Bench finding, §1:] '> 92% of emergent abilities on BIG-Bench tasks [...] appear under either of these two metrics: Multiple Choice Grade [...] Exact String Match.'"
canonical-instances:
  - "Schaeffer et al.'s GPT-3 family demonstration (2023 §3): a task graded by exact-string-match shows an apparent emergence threshold around 10^22 FLOPs; the SAME outputs graded by edit-distance show smooth scaling from 10^18 FLOPs onward. The model behavior is identical at all scales; the apparent emergence is in the grading function. The transferable point: 'the threshold' lives in the metric, not the system"
  - "educational test cutoffs: a student who improves their answer continuously from 65% to 75% partial credit accuracy may show 'sudden mastery' on a pass/fail metric set at 70%. The capability scaled smoothly; the binary metric produced apparent emergence. Same shape: nonlinear threshold on smooth substrate"
  - "regulatory compliance: a chemical plant's emission level decreases smoothly with retrofit upgrades; a regulator with a hard threshold sees 'compliance achieved' as a step function. The actual emission curve is smooth; the compliance metric is discontinuous. Transferable application to policy: the appearance of step-change is metric-side, not system-side"
  - "exam grading curves: a 0.5% improvement in raw score can move a student across a letter-grade boundary, producing apparent emergence of a new category (B → A). The raw competency moves smoothly; the categorical metric produces the cliff. Famously distorts narratives about student capability"
  - "vision-task threshold emergence (Schaeffer §4): they construct never-before-seen 'emergent' capability in vision models purely by choice of metric on the same underlying outputs. This demonstrates that the manufacturing-emergence-by-metric pattern is not domain-specific; it's a structural property of nonlinear measurement of smoothly-scaling capability"
  - "operationally distinct from lex-axa6h order-of-magnitude-approximation: order-of-magnitude is the EPISTEMIC discipline of carrying powers-of-10 only; this atom is the diagnostic for when DISCONTINUITY in a measured curve reflects measurement-shape not system-shape. They co-fire when an order-of-magnitude estimate of a true underlying improvement looks discrete because of nonlinear measurement"
  - "operationally distinct from lex-4yhqs coarse-graining: coarse-graining is the lossy compression that ENABLES the apparent discontinuity; this atom is about distinguishing measurement-induced discontinuity from system-induced discontinuity in the chosen compression. Related but distinct moves"
  - "operationally distinct from lex-stppu phase-transition (if substrate has it; this atom is for cases where the system genuinely has a smooth scaling and only the metric introduces the cliff. A real phase transition would show discontinuity under ANY reasonable metric; the Schaeffer signature is that the discontinuity vanishes under linear metrics)"
critical-questions:
  - "does the apparent discontinuity survive a linear/continuous regrading? The Schaeffer diagnostic: take the same model outputs and grade them with a metric that's linear in the per-step error rate (token-level loss, edit distance, partial credit) instead of an exact-match or threshold metric. If the discontinuity vanishes, you have metric-induced apparent emergence; if it persists, you have something else (perhaps real phase-transition, perhaps insufficient sample size at small scales). Practitioner-discipline: don't accept emergence claims without trying the linear-regrade test"
  - "is the sample size at small scales adequate? Schaeffer's secondary mechanism (2023 §1): with too few test samples, small models appear 'wholly unable' to perform a task because they happen to score 0/N on a small N, even when their per-token error rate is just smoothly worse than larger models'. The diagnostic: estimate small-model performance from per-token error rates rather than per-sample success rates; check whether small-model performance is just 'low but nonzero' rather than 'absent'"
  - "does the emergence claim affect AI-safety policy or scaling decisions? The Wei et al. framing has been essential in some AI-safety arguments about scaling risks. If the apparent emergence is metric-driven, the safety argument changes shape — the danger isn't 'capability appearing without warning' but 'capability scaling smoothly while we measure with thresholds that hide the scaling.' Practitioner-question: what specifically does the emergence claim do for downstream reasoning? If it's foundational for a safety case, the linear-regrade test is mandatory before propagating the claim"
  - "is this distinct from genuine phase-transition (lex-stppu or related)? Yes — real phase transitions in physics (water freezing, magnetization onset) show discontinuity under reasonable measurements; you don't manufacture phase transitions by metric choice. Schaeffer's signature is that the discontinuity is fragile to metric switching. Practitioner-discipline: 'phase transition' is the correct framing only when the discontinuity is robust to measurement choice"
  - "what's the relationship to lex-chp44 meta-pointer? Strong — Schaeffer's argument is itself a meta-pointer move: it surfaces what the original analyses (Wei et al.) didn't make explicit — that the apparent discontinuity depends on the unstated metric choice. The lex-chp44 discipline (mark what's omitted) IS the corrective Schaeffer applies. Practitioner-test: when reading a capability scaling claim, ask 'what metric is producing this curve?' — that's the meta-pointer move"
status: active
