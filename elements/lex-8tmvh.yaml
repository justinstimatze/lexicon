    quote: "True it is that because of him men die, that because of him men steal, that because of him men abuse women, that they lie and are lazy and unreliable. Yes, he is responsible for all this. Yet one thing he never did: he never went on the warpath, he never waged war. ... The reference to his not having gone on the warpath is very illuminating It indicates that, for this particular individual, Wakdjunkaga's failure to help mankind by destroying those who were plaguing it was not a reprehensible thing because it would have meant violence, meant waging war."
canonical-instances:
  - "A company's founder is criticized for never pursuing an aggressive lawsuit against a competitor who was clearly infringing their patents, and a former colleague defends the founder by pointing out that winning would have required bankrupting a smaller company employing hundreds of people, reframing the inaction as restraint rather than weakness."
  - "A retired general is remembered for never ordering a preemptive strike against a hostile neighboring force during a tense standoff, and military historians later credit that restraint, not as a failure to protect the border, but as the single decision that kept a regional conflict from becoming a full war."
critical-questions:
  - "Does this defense actually establish that no non-violent form of help was available, or does it simply assume the only alternative to inaction was war, potentially overlooking other interventions that might have existed?"
  - "Is there a point at which repeated failure to act, even for principled reasons, becomes indistinguishable in its consequences from active harm, and does the defender's framing here risk excusing real, ongoing suffering because the alternative sounds worse in the abstract?"
  - "Would this same defense be offered as readily if the person doing the judging were the one suffering from the ongoing harms Wakdjunkaga's inaction allowed, rather than an outside observer evaluating his character in the abstract?"
