canonical-instances:
  - "In a company, the engineer who personally has to manually re-run a broken deploy script every week is far more likely to be the one who eventually automates it than an engineer on another team who has heard about the problem but never had to live with it — not because the second engineer cares less about the company, but because only the first has the accumulated friction that generates a concrete fix."
  - "A professor who personally grades 200 essays a semester is the one who proposes a new rubric that cuts grading time, while colleagues teaching smaller sections, who could adopt the same rubric with equal benefit to their students, never think to propose it — the proposal tracks whose own workload it would relieve, not whose students it would help most."
critical-questions:
  - "Does this mechanism predict which problems get FIXED as opposed to merely which get NOTICED — could there be a large class of problems that harm the organization broadly but personally inconvenience no one enough to motivate a fix, meaning this pathway systematically under-fixes diffuse costs relative to concentrated personal frictions?"
  - "Goss frames personal stake and organizational benefit as aligned in her example. What differentiates cases where they align (as here) from cases where a personally-motivated fix actually shifts cost onto others or degrades the organization overall — and would staff be equally quick to voice a personally-beneficial suggestion in the latter case, or does the alignment itself depend on the two rarely coming apart in a well-designed program like this one?"
