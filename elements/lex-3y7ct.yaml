id: lex-3y7ct
name: psychiatric-symptom-is-dysregulated-fabrication-not-a-different-module
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when someone treats a psychiatric symptom (hallucination, delusion, paranoid ideation, catastrophizing rumination) as evidence of a categorically broken or defective mind, distinct in kind from ordinary cognition — or conversely, when someone treats creativity, religious belief, or imagined future scenarios as obviously 'just healthy' with no structural kinship to pathology. Mattson's claim: the same brain capability that generates adaptive fabrication — creativity, invention, language, magical thinking/religious belief, mentally rehearsing future scenarios — is the SAME system that, when its regulation fails, generates the symptoms of psychiatric disorder. Psychiatric disorders 'result from an abnormal skewing of [pattern processing] in ways that dissolve the neural circuit-based boundaries between reality and imagination, between the realms of possibilities and probabilities' — schizophrenic hallucination/paranoia is 'a pathological dysregulation of the imagination and mental time travel' capacities, not a different broken part. Depression's catastrophic rumination, anxiety's exaggerated threat-response, and schizophrenia's hallucinations are symptomatically different but structurally the same move: 'the SPP capabilities of imagination and envisioning future scenarios are dysregulated.' The practitioner move: don't reach first for 'this person's cognition is broken in a way mine isn't' — reach for 'this is the same fabrication capacity everyone has, running without its normal boundary-check between self-generated and externally-real.' This reframes the relationship between pathology and normal cognition as one of DEGREE/REGULATION, not KIND — the same system that lets you imagine a future, believe an untestable story, or invent something novel is the one whose miscalibration produces the symptom. It also runs in the adaptive direction: some fabrication that looks 'irrational' from outside (belief in a punishing/watching God, low-grade everyday paranoia about a dark parking lot) is the SAME machinery operating within useful bounds — 'there is a balance between trust and paranoia, based upon a rational appraisal of the situation,' not an absence of the fabrication capacity. Don't confuse this with generic 'everyone has some of that trait' pop-psychology — the specific, checkable claim is a shared underlying MECHANISM (a boundary-regulation function between internally-generated and externally-perceived pattern) whose calibration, not whose presence or absence, separates adaptive fabrication from pathological symptom."
related: [lex-x66pv, lex-yx8qx, lex-93fb4, lex-scxn9]
evokes: [superior-pattern-processing, SPP-dysregulation, boundary-between-reality-and-imagination, schizophrenia-as-dysregulated-imagination, magical-thinking-and-delusion-share-a-mechanism, trust-paranoia-balance, fabrication-capacity-is-not-itself-the-pathology]
lineage:
  - source: primary
    text: mattson-2014-superior-pattern-processing
    citation: "Mark P. Mattson, 'Superior pattern processing is the essence of the evolved human brain,' Frontiers in Neuroscience, Vol. 8, Article 265, August 2014 (Review Article, National Institute on Aging / Johns Hopkins)."
    quote: "[Aberrant Pattern Processing section:] 'In general, psychiatric disorders result from an abnormal skewing of SPP in ways that dissolve the neural circuit-based boundaries between reality and imagination, between the realms of possibilities and probabilities.' [On schizophrenia specifically:] 'A key feature of schizophrenia is a blurring of the lines between external reality and internal imagination, between patterns that are real and those that are mentally fabricated... The hallucinations and paranoia that occur [in] schizophrenia patients could be considered a pathological dysregulation of the imagination and mental time travel categories of SPP.' [On the shared-mechanism claim across disorders:] 'It can be argued that although their symptoms are different, human psychiatric disorders all involve distortions of reality (hallucinations in schizophrenia; unrealistic view of threats to well-being in anxiety and obsessive-compulsive disorders; and a distorted image of one's current and future life situations in depression). In essence, the SPP capabilities of imagination and envisioning future scenarios are dysregulated.' [On the adaptive/pathological continuum, and everyday calibrated paranoia:] 'Interestingly, as described in the next section, there is [a] fine line between the magical thinking of religious beliefs that have provided adaptive value for many civilizations and societies, and the delusions of psychoses that can place individuals and those they associate with in harm's way.'... 'For most high-functioning individuals in modern society there is a balance between trust and paranoia, based upon a rational[e] appraisal of the situation based upon experience and understanding... It has been proposed that religion and schizophrenia have similar evolutionary underpinnings (Dein and Littlewood, 2011). In this view, both theory of mind and attributing life events to an external agency are hyper-extended and intrude thought processes and actions excessively.'"
  - source: discovery-loop
    text: mattson-mining-pass-
    citation: "Lex-0595 (the-patterning-instinct-imposes-meaning-on-all-experience-as-cognitive-default) and lex-e8wv6 (apophenia-induction) are the closest thematic neighbors, both addressing pattern-imposition as a cognitive default and the insight-versus-apophenia (true-pattern-versus-false-pattern-in-noise) distinction. This atom is operationally distinct: it is not about whether a perceived pattern is real or noise misread as signal, but about a boundary-regulation failure — the same fabrication capacity that produces adaptive output (creativity, religion, imagined futures) losing its tag distinguishing self-generated from externally real, which is what Mattson identifies as the mechanism of psychiatric symptom production specifically. The paper's closing 'Predictions of the SPP theory' section cites Rushton & Jensen 2008 to argue population-level SPP differences explain disparities in prosperity between countries — a hereditarian claim adjacent to discredited race-IQ research. This atom does not draw on that section."
canonical-instances:
  - "A person having their first psychotic episode believes their thoughts are being broadcast and that strangers on the street are surveilling them — read through this atom, the underlying capacity being used (constructing a coherent narrative about hidden agency and intent) is the same one used in ordinary social cognition and storytelling; what's dysregulated is the boundary tagging that narrative as self-generated rather than externally confirmed."
  - "A founder pitching investors describes a product that doesn't exist yet in vivid, confident detail (invention/imagination) — the same SPP capability, correctly bounded (both founder and investor know it's a projection, not a report of an existing fact), that in an unbounded form produces delusion."
  - "A person walking to their car alone at night feels a surge of suspicion about a stranger nearby and crosses the street — this is described in the source as adaptive, rationally-calibrated paranoia, the same trust/threat-appraisal machinery that in schizophrenia becomes persecutory delusion when the calibration is lost."
  - "A patient with depression ruminates for hours on a minor work reprimand, mentally constructing a detailed 'I will be fired and unable to support my family' scenario — this is described as the same imagination/future-scenario-construction capability used for ordinary planning, dysregulated toward catastrophic rather than realistic projection."
critical-questions:
  - "Isn't this just 'everyone has a little bit of crazy in them,' a pop-psychology cliché? No — the specific, falsifiable claim is narrower and mechanistic: a particular capability (pattern fabrication with a boundary-tag distinguishing internally-generated from externally-real) is shared, and it is the CALIBRATION of that boundary-tag, not the presence of some generic trait, that the source identifies as what separates adaptive output (creativity, belief, planning) from symptom (hallucination, delusion, catastrophizing). The claim is about a specific regulatory function, not a vague spectrum of 'craziness.'"
  - "How is this different from just saying pattern-recognition is imperfect and sometimes finds patterns that aren't there (apophenia)? Apophenia (see lex-e8wv6, lex-a5jhg) is about whether a PERCEIVED PATTERN corresponds to real structure in the world versus noise. This atom is about something upstream of that: whether the brain correctly TAGS its own output as fabricated/imagined versus externally verified. A schizophrenic hallucination isn't a wrong inference from ambiguous sensory data — the source frames it as a boundary failure between 'patterns that are real and those that are mentally fabricated,' a different kind of error than misreading noise as signal."
  - "Does this mean psychiatric disorders are 'not real' or 'just a difference of degree, no big deal'? No — the source is explicit that dysregulation, not the underlying capacity itself, is the pathology, and that the resulting symptoms (hallucination, persecutory delusion, catastrophic rumination) are genuinely disabling. The claim reframes WHAT KIND of failure is occurring (a regulation failure in a shared system) — it does not minimize the severity or reality of the resulting disorder."
  - "Is 'religion is like schizophrenia' the actual claim here? No, and this is a citation-attribution point worth being careful about: Mattson reports that 'it has been proposed' (citing Dein & Littlewood 2011) that religion and schizophrenia share evolutionary underpinnings via hyper-extended agency-attribution — he does not claim religious belief IS pathological. The atom's claim is the narrower, better-supported one: the fabrication mechanism is shared and its output ranges from adaptive to pathological depending on regulation, not that any specific belief system is itself a symptom."
