id: lex-hj2ds
name: mentally-scale-a-system-up-to-reveal-an-interaction-invisible-at-its-real-size
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a system's components are too small, fast, or cheap for their interaction to feel intuitively real, mentally blow them up to a scale where the same physics is obvious, work out what happens at that exaggerated scale, then scale the insight back down — the interaction was there all along, just imperceptible at the object's actual size. Altshuller calls this part of the DTC (Dimensions-Time-Cost) operator and shows it catching a real design error before it was built. Engineers designing an ion-mobility measurement assumed oppositely-charged ions could be timed simultaneously without interfering with each other, simply because ions are so small the idea of them 'colliding' or repelling felt negligible. Applying the scale-up operator broke that assumption: 'Mentally we increase the size of the ions: coming to meet each other are oppositely charged tennis balls. We increase their dimensions even more: on collision course move oppositely charged planets. Huge charges unavoidably call up mutual interaction of the planets. But surely such interaction must arise even when oppositely charged ions approach each other!' The scaled-up picture (planets) makes an interaction obvious that the scaled-down picture (ions) had let everyone silently ignore, because the electrostatic force is the same physics at every scale — only the intuitive judgment of 'does this matter' changes with size. Altshuller is explicit about the payoff: 'The DTC operator has forced us to pay attention to a circumstance that went unnoticed when the problem was presented. One has to abandon the principle of simultaneous measurement of the mobility of ions of opposing polarities' — the mental scale-up directly overturned a plan that looked sound at the object's real size and forced a redesign (measuring the two ion polarities consecutively instead of simultaneously) before any equipment was built. Diagnostic move: when you're confident two small, fast, or cheap components of a system won't meaningfully interact, don't rely on that intuition directly — imagine the same components magnified to a size and speed where a human could watch the interaction happen with the naked eye (tennis balls, planets, cars, buildings), work out what the enlarged version would obviously do, and check whether the same physical or logical relationship, scaled back down, applies to your real system after all."
related: [lex-6w927, lex-mubyx, lex-vwgpx]
evokes: [DTC-operator, dimensions-time-cost, ion-mobility-tennis-balls-planets, mental-scale-up-reveals-interference, dimensional-thought-experiment]
lineage:
  - source: primary
    text: altshuller-1984-dtc-scale-up-ions-to-planets
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.4 'Talented Thought: What is it?', section 'Two Interesting Examples.'"
    quote: "'It is clearly more advantageous to carry out the measurement simultaneously. This is indeed how the problem was phrased. But working according to the DTC operator, carried out prior to the analysis, forced one to return to the principle of consecutive measurement. Mentally we increase the size of the ions: coming to meet each other are oppositely charged tennis balls. We increase their dimensions even more: on collision course move oppositely charged planets. Huge charges unavoidably call up mutual interaction of the planets. But surely such interaction must arise even when oppositely charged ions approach each other! The DTC operator has forced us to pay attention to a circumstance that went unnoticed when the problem was presented. One has to abandon the principle of simultaneous measurement of the mobility of ions of opposing polarities.'"
canonical-instances:
  - "A backend team assumes two independent database writes happening microseconds apart 'obviously' can't meaningfully race each other; mentally scaling the operations up to two trucks trying to back into the same loading dock a fraction of a second apart makes the collision obvious, prompting a redesign (a lock or a queue) before the race condition ever surfaces in production."
  - "A city planner dismisses the idea that pedestrians and a slow-moving autonomous delivery robot could meaningfully interfere with each other on a wide sidewalk; imagining the robot scaled up to the size of a delivery truck moving through a crowd at the same relative speed makes the interference obvious, prompting a redesigned path or speed limit that the small-scale intuition had missed."
  - "operationally distinct from lex-6w927 system-operator-nine-windows-scale-and-time: that atom shifts the viewpoint across REAL structural levels (subsystem/system/supersystem) that already exist at their own true scale; this atom scales the SAME single component up to an artificial, exaggerated size purely to make an intuitively-invisible interaction visible, then scales the resulting insight back down to the original size."
critical-questions:
  - "does the physics or logic actually hold at both scales, or does something about the interaction genuinely change with scale (e.g. quantum effects, statistical averaging over huge numbers of small particles) such that the enlarged-scale intuition misleads rather than reveals — how would someone check this before trusting the scaled-up picture's conclusion?"
  - "how does someone choose WHICH property to scale up (size, speed, cost, duration) when a system has many candidate dimensions, and multiple choices might reveal different, possibly conflicting, hidden interactions?"
  - "can this technique also produce false positives — inventing an apparent interaction at the exaggerated scale that doesn't actually correspond to anything real at the object's true size, and if so, what would distinguish a genuine scale-invariant relationship from a scaling artifact?"
status: active
