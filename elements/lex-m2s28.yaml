lineage:
  - source: primary
    text: cushing-coyote-siuiuki-demon-goaded-into-self-destruction
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Coyote Who Killed the Demon Síuiuki: or Why Coyotes Run Their Noses Into Deadfalls.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Certainly,' replied the Coyote. 'But it will hurt you.' 'Ho! who cares for a little hurt?' said the Demon. 'Oh! but it hurts terribly,' said the Coyote, 'and I am afraid you won't have the pluck to go through with it.' 'Do you think I am a baby?' said the old Demon, getting up,--'or a woman, that I should be afraid to pound my legs and arms?' 'Well, I only thought I'd tell you how much it hurts,' said the Coyote; 'but if you want to try it yourself, why, go ahead.'"
canonical-instances:
  - "A veteran employee wanting a new hire to take on an unreasonable, unpaid workload doesn't ask directly, but mentions offhand that the last person in the role 'couldn't really hack the pace' and seems to have quit because of it, prompting the new hire to volunteer for the same unsustainable schedule specifically to prove they're not like the person being subtly disparaged."
  - "A fraternity hazing tradition doesn't order pledges to perform a dangerous stunt, but has senior members perform a milder, faked version of it while questioning aloud whether the pledges have 'what it takes' to do the real thing, reliably getting pledges to demand the chance to prove their toughness rather than needing to be coerced."
critical-questions:
  - "does this tactic only work on targets whose sense of identity is already heavily invested in appearing tough, brave, or capable -- would it fail entirely against someone secure enough to simply agree that, yes, they'd rather not endure unnecessary pain?"
  - "how would a target recognize, in the moment, that a stated doubt about their toughness is a deliberate lever rather than a genuine, well-meaning warning -- what actually distinguishes manipulative reverse psychology from an honest caution that happens to provoke defensiveness?"
  - "is there a meaningful difference between this tactic used against someone whose destruction benefits the manipulator directly, as with the Coyote and the demon, versus a coach or mentor using the same lever to push someone toward a genuinely worthwhile but difficult challenge -- does the tactic's ethical status depend entirely on whether the goal is actually good for the target?"
