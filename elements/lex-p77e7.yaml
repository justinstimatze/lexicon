lineage:
  - source: primary
    text: abelson-sussman-1985-1996-sicp-ch3-2-environment-model-of-evaluation
    citation: "Harold Abelson and Gerald Jay Sussman with Julie Sussman, *Structure and Interpretation of Computer Programs* (MIT Press 1985 1st ed.; 1996 2nd ed., ISBN 9780262011532). Chapter 3.2 'The Environment Model of Evaluation' (pp. 320-338). SICP introduces the environment model as the successor to Chapter 1's substitution model, motivated by the introduction of assignment in Chapter 3 (which makes the substitution model inadequate because a variable becomes a `place` holding a value rather than a literal name). The transferable structural claim is the FRAME-CHAIN binding-resolution mechanism: an environment is a sequence of frames; each frame is a table of name → value bindings plus a pointer to an enclosing environment; name lookup returns the binding in the innermost frame that contains it; a procedure is a (code, captured-environment) pair, and applying a procedure creates a new frame whose enclosing pointer is the captured environment — NOT the caller's. The atom captures this mechanism separately from Scheme's specific syntax. SICP also makes the philosophical claim explicit: 'expressions in a programming language do not, in themselves, have any meaning. Rather, an expression acquires a meaning only with respect to some environment in which it is evaluated.' SICP is licensed under Creative Commons Attribution-ShareAlike 4.0 International (MIT's 2016 release of the 2nd edition source). The book is the most widely-cited primary source for the lexical-scope / closure / environment-model cluster in computer-science pedagogy, used as the introductory text at MIT (1980-2007) and adopted at hundreds of other universities. The 1985 first edition introduced the canonical articulation; the 1996 second edition refined the exposition without changing the structural claims of Ch.3.2. Cross-domain attestation: the same frame-chain-walking mechanism appears in (a) Steele 1990 *Common Lisp the Language* 2nd ed. on lexical-scoping in Common Lisp; (b) Pierce 2002 *Types and Programming Languages* on the typed-lambda-calculus formalization of environments; (c) the CSS Specification Working Group's cascade-and-inheritance algorithm (W3C 1996+); (d) the Python data model on MRO (Guido van Rossum 1995+; C3 linearization adopted in Python 2.3); (e) the git config hierarchy (Hamano + Torvalds 2005+); (f) Plotkin 1981 *A Structural Approach to Operational Semantics* on the formal definition of evaluation environments. The structural claim is foundational across compiled languages, configuration systems, and any nested-context resolution scheme."
    quote: "[SICP Ch.3.2 the canonical statement of the environment model:] 'An environment is a sequence of frames. Each frame is a table (possibly empty) of bindings, which associate variable names with their corresponding values. (A single frame may contain at most one binding for any variable.) Each frame also has a pointer to its enclosing environment, unless, for the purposes of discussion, the frame is considered to be global. The value of a variable with respect to an environment is the value given by the binding of the variable in the first frame in the environment that contains a binding for that variable. If no frame in the sequence specifies a binding for the variable, then the variable is said to be unbound in the environment.' [Same chapter, the crucial philosophical claim:] 'The environment is crucial to the evaluation process, because it determines the context in which an expression should be evaluated. Indeed, one could say that expressions in a programming language do not, in themselves, have any meaning. Rather, an expression acquires a meaning only with respect to some environment in which it is evaluated. Even the interpretation of an expression as straightforward as (+ 1 1) depends on an understanding that one is operating in a context in which + is the symbol for addition.' [Same chapter, the capture-at-definition rule and the make-withdraw closure example:] 'In the environment model of evaluation, a procedure is always a pair consisting of some code and a pointer to an environment. Procedures are created in one way only: by evaluating a λ-expression. This produces a procedure whose code is obtained from the text of the λ-expression and whose environment is the environment in which the λ-expression was evaluated to produce the procedure... The environment model specifies: To apply a procedure to arguments, create a new environment containing a frame that binds the parameters to the values of the arguments. The enclosing environment of this frame is the environment specified by the procedure.' [On the closure-as-state-vehicle, from the make-withdraw example:] 'We see that E1 serves as the place that holds the local state variable for the procedure object W1... W1 and W2 have the same code: the code specified by the λ-expression in the body of make-withdraw. We see here why W1 and W2 behave as independent objects. Calls to W1 reference the state variable balance stored in E1, whereas calls to W2 reference the balance stored in E2. Thus, changes to the local state of one object do not affect the other object.' [On shadowing, from the multi-frame Figure 3.1 example:] 'With respect to environment A, the binding of x to 7 in frame II is said to shadow the binding of x to 3 in frame I.'"
  - source: cross-attestation
    text: cross-domain-frame-chain-resolution
    citation: "Cross-domain attestation that the frame-chain identifier-resolution mechanism recurs across (a) every modern compiled language with lexical scope, (b) configuration cascade systems, (c) CSS, (d) class-method resolution orders, and (e) unix shell path resolution. SOURCES: Guy L. Steele Jr. 1990 *Common Lisp the Language* 2nd ed. on lexical-scoping; Benjamin C. Pierce 2002 *Types and Programming Languages* (MIT Press) on the typed-lambda-calculus formalization; Daniel P. Friedman + Mitchell Wand 2008 *Essentials of Programming Languages* 3rd ed. on the environment-data-structure as the foundation of interpreter design; W3C CSS Specifications (1996+) on the cascade-and-inheritance algorithm where specificity walks outward from the element through ancestors; Python Data Model (van Rossum 1995+; Simionato 2002 C3-linearization for Python 2.3 multiple-inheritance MRO); git config(1) man page on system→global→local→worktree hierarchy; POSIX shell specification on `$PATH` colon-separated first-match resolution; Gordon D. Plotkin 1981 *A Structural Approach to Operational Semantics* on the formal evaluation-environment definition. The same structural form recurs: ordered chain of named-binding scopes + innermost-match wins + outer-shadowed-by-inner. The transferable diagnostic: when a name appears cardinal, ask which chain resolves it and what could shadow it."
    quote: "Across SICP's environment-model (Abelson-Sussman 1996), Common-Lisp lexical-scoping (Steele 1990), typed lambda-calculus (Pierce 2002), interpreter-design pedagogy (Friedman-Wand 2008), CSS cascade-and-inheritance (W3C 1996+), Python MRO C3-linearization (Simionato 2002), git config hierarchy (Hamano-Torvalds 2005+), and unix `$PATH` (POSIX), the same structural primitive recurs: ordered chain of frames + innermost binding wins + outer is shadowed. The transferable use is the diagnostic — a name without its frame chain is half-resolved; identify the chain and what could shadow."
canonical-instances:
  - "SICP's canonical Figure 3.1 example (Ch.3.2): two environments A and B share an outer frame I (with bindings x:3, y:5); environment A adds frame II (with z:6, x:7) and environment B adds frame III (with m:1, y:2). Looking up x in environment A returns 7 (frame II shadows frame I); looking up x in environment B returns 3 (frame III has no x, walks to frame I)."
  - "SICP's `make-withdraw` closure example (Ch.3.2): each call to `make-withdraw initial-balance` creates a fresh frame E_n binding balance to initial-balance; the returned procedure captures E_n as its environment. Multiple withdrawals via the returned W1 mutate E_n's balance; calling make-withdraw again to get W2 creates a fresh E_m; W1 and W2 reference distinct balance bindings even though their code is identical."
  - "CSS cascade: a `color: blue` rule on `.parent` is shadowed by `color: red` on `.parent .child` because the latter is more specific; the cascade walks from element-specific rules outward through `:root` defaults; each scope can override outer defaults without mutating them."
  - "git config hierarchy: `git config --get user.email` walks `system → global → local → worktree`, returning the innermost binding; setting `user.email` at the local level shadows the global default for that repo only."
  - "Python class MRO via C3 linearization: when calling `obj.method()`, Python walks the linearized class chain (the C3 algorithm produces a consistent total order from the class graph) and dispatches to the first class that defines the method; subclass methods shadow parent methods."
  - "Unix shell `$PATH`: a colon-separated chain of directories; `which foo` returns the first directory in the chain containing an executable named `foo`; a local `~/bin/foo` shadows `/usr/bin/foo` if `~/bin` is earlier in PATH."
  - "Configuration cascades (dotenv, k8s ConfigMaps with overrides, npm workspaces): environment-specific config files shadow repository-default config files; per-run command-line flags shadow file-based config; the shadow direction is always outer-default → inner-specific."
  - "ML hyperparameter scoping: an experiment-level config sets defaults; trial-level configs override specific hyperparameters; per-run command-line flags override trial defaults. The same frame-chain mechanism — innermost wins, outers shadowed."
  - "Database transaction isolation: within a transaction, your view of a row shadows the committed value until you commit; other transactions see the original until then; the transaction-frame is shadowed-by no-one until commit, then merges back into the global frame."
  - "operationally distinct from lex-e2tnt cognitive-environment-as-scope (Sperber-Wilson Relevance Theory): lex-e2tnt names the MUTUAL social-cognitive context between speaker and hearer that determines utterance interpretation. lex-p77e7 names the FORMAL binding-resolution mechanism in compositional languages where the chain is explicit and walkable. They are analogues — both about meaning-relative-to-context — but distinct mechanisms: lex-e2tnt is a coordination problem between minds; lex-p77e7 is a deterministic resolution algorithm in a structure."
  - "operationally distinct from lex-bg3ad forgetting-particulars-is-the-mechanism-of-abstraction (Borges Funes + Locke + Nietzsche + Bergson + ML regularization): lex-bg3ad is about abstraction-as-lossy-compression of particulars into categories. lex-p77e7 is about contextual-resolution of NAMES against a frame chain. They compose: lex-bg3ad's abstractions BECOME the bindings that lex-p77e7's chains resolve, but the mechanisms are distinct."
  - "operationally distinct from lex-da3g3 iteration: lex-da3g3 names the process-shape distinction (iterative vs recursive process generated by a procedure). lex-p77e7 names how NAMES inside any process resolve. They compose: iterative processes can have lexically-scoped state captured in closures (the make-withdraw example IS an iterative-state-via-closure pattern)."
  - "Failure mode — dynamic-scope leakage: if a language uses dynamic scope (the caller's chain is consulted instead of the captured chain), abstraction breaks because callers can silently rebind names the callee depended on. Bash's variable scoping is dynamic by default; this is the source of many bash-function-as-library bugs where the caller's `IFS` or `PATH` changes what the function does. The fix: explicit `local` declarations, or move to lexically-scoped tools."
  - "Failure mode — shadow-by-accident: a local variable silently shadows a critical outer binding; the bug is hard to find because the OUTER binding is what looked relevant. Python's UnboundLocalError on `x = x + 1` inside a function that didn't `nonlocal x` is the canonical example; the fix is explicit scope declarations."
critical-questions:
  - "Does the atom commit to lexical-scope being correct and dynamic-scope being wrong? No. The atom names a STRUCTURAL CLAIM about frame-chain resolution; lexical vs dynamic is a choice about WHICH chain is captured. Dynamic scope is correct for some use cases (e.g., Common Lisp's `*special*` variables for thread-local configuration; the same shell-`IFS` pattern when the use case actually wants caller-context-dependence). The atom claims the structural form recurs; the lexical-vs-dynamic choice is downstream."
  - "Does the atom apply to systems without explicit frames (e.g., flat key-value stores)? Carefully. A flat key-value store with no chaining is the DEGENERATE case (one frame, no shadowing). The atom's transferable use kicks in when there is MORE THAN ONE level of scope and the levels can override each other. A truly flat store doesn't need the atom; a hierarchical config system does."
  - "How does this compose with lex-bg3ad (abstraction-as-lossy-compression)? They compose: lex-bg3ad's abstractions become the bindings that lex-p77e7's chains resolve. The process: lex-bg3ad (categorization-as-discarding-particulars) produces a NAME for a class of things; lex-p77e7 (frame-chain-resolution) is how that name acquires meaning when used in a specific context. The two atoms work at different levels: lex-bg3ad is about how names get formed; lex-p77e7 is about how names get resolved."
  - "Does the atom apply to natural-language pronoun resolution? Partially. Pronoun resolution does walk a discourse-context chain (Centering Theory, salience hierarchies); but natural-language resolution is probabilistic and ambiguous in ways formal frame-chains aren't. The atom most cleanly applies to FORMAL systems with deterministic chains; natural-language resolution is the analogue, not the canonical case."
  - "What's the practical diagnostic when a configuration cascade behaves unexpectedly? Walk the chain. Identify each layer (system → global → local → worktree, or :root → .parent → .child); ask what each layer binds; identify the innermost binding that resolved. The same algorithm SICP gives for environments applies to every cascade-and-override system in production code."
severity-tier: info
