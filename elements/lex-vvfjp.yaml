id: lex-vvfjp
name: unanimous-agreement-doesnt-make-a-value-judgment-disappear
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before calling a criterion 'objective' or 'value-free' because nobody disputes it, check whether the real reason is that it involves no interpersonal conflict rather than no values at all. Sen traces this exact slip through decades of welfare economics: “The implicit assumption seems to be that if everyone agrees on a value judgment, then it is not a value judgment at all, but is perfectly 'objective'. ... Unanimous value judgments may provide the basis of a great deal of welfare economics, but this is so not because these are not value judgments, but because these value judgments are acceptable to all.” Agreement and evaluative content are independent properties -- a judgment can be a value judgment and be unanimous, just as it can be a value judgment and be contested. Universal acceptance only changes how much friction a value judgment generates on its way to being acted on. Diagnostic move: when a rule or criterion gets defended as neutral or fact-based on the grounds that 'everyone agrees on this,' ask what would happen to that label if agreement broke down. If the criterion was never anything but a value judgment that happened to be uncontested, losing consensus should reveal exactly that -- which means calling it 'objective' while consensus lasted was a mislabeling all along, however solid the criterion felt at the time."
