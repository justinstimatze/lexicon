id: lex-726ub
name: shared-exclusion-of-a-third-party-can-manufacture-civility-between-rivals
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two rival factions, parties, or camps have achieved a period of surprising civility after a history of mutual hostility, don't assume the civility itself is the achievement to preserve or export — check who was left out of the deal that produced it. Levitsky and Ziblatt name this as a troubling caveat about American democracy's own most celebrated era of bipartisan comity: 'We must conclude with a troubling caveat, however. The norms sustaining our political system rested, to a considerable degree, on racial exclusion. The stability of the period between the end of Reconstruction and the 1980s was rooted in an original sin: the Compromise of 1877 and its aftermath, which permitted the de-democratization of the South and the consolidation of Jim Crow. Racial exclusion contributed directly to the partisan civility and cooperation that came to characterize twentieth-century American politics. [...] America's democratic norms, then, were born in a context of exclusion. As long as the political community was restricted largely to whites, Democrats and Republicans had much in common. Neither party was likely to view the other as an existential threat. The process of racial inclusion that began after World War II and culminated in the 1964 Civil Rights Act and 1965 Voting Rights Act would, at long last, fully democratize the United States. But it would also polarize it, posing the greatest challenge to established forms of mutual toleration and forbearance since Reconstruction.' The peace wasn't a mature political achievement standing on its own; the exclusion is what made it affordable, by removing the one stake that had actually driven the hostility. Once the excluded party returned to the table, the disagreement resurfaced — not as new conflict, but as the same one, merely shelved."
