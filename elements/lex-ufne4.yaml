  - source: primary
    text: graeber-2011-debt-merchants-never-paragons
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.10 'The Middle Ages,' section 'The Far West: Christendom.'"
    quote: "“in dramatic contrast to Islam, where a figure like Sindbad—the successful merchant adventurer—could serve as a fictional exemplar of the perfect life, merchants, unlike warriors, were never seen as paragons of much of anything.”"
canonical-instances:
  - "The direct textual anchor, on where the myth's actual author was standing when he wrote it: “It's likely no coincidence that Chretien was living in Troyes, at the very heartland of the Champagne fairs that had become, in turn, the commercial hub of Western Europe.”"
  - "Hypothetical: a tech industry that has quietly become the dominant economic and political force in a country produces no popular fiction starring an ordinary software engineer or product manager as a culture hero. Instead, the era's most celebrated archetype is the lone startup-founder-as-outlaw-genius, dropping out of school, defying rules, riding a garage-built idea to world-changing triumph -- a figure almost no actual engineer resembles, occupying the heroic role that the industry's real, much larger and more bureaucratic center of power never gets cast in at all."
critical-questions:
  - "Is the merchant-power-displaced-onto-a-fictional-hero reading actually necessary, or could chivalric romance have emerged just as easily from purely internal literary or aristocratic-nostalgia motives (elite audiences wanting to see their own class idealized, independent of any merchant class rising nearby)? What would distinguish those two explanations empirically, given that both predict a fictional, historically inaccurate warrior-hero appearing at roughly the same time?"
  - "If merchants really held the underlying power Graeber describes, why would they have any interest in a myth that celebrates knights rather than themselves -- wouldn't the party actually benefiting from the displacement need to be the old warrior aristocracy losing status, not the merchants gaining it? Whose interest does the myth actually serve, and does that change which class should be credited with inventing or sustaining it?"
