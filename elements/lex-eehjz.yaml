id: lex-eehjz
name: assuming-the-opposite-leads-to-contradiction-establishes-the-claim
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "When direct proof stalls, surface the option to assume the opposite and derive a contradiction — reductio is a distinct proof shape, not a fallback."
related: [lex-ftke9, lex-xcaqj, lex-w7fxz, lex-tt5tv, lex-sgd2s, lex-4ww6k, lex-qbuw5]
