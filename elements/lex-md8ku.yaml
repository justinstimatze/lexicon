evokes: [two-sided-market, price-structure-vs-price-level, cross-group-network-externality, loss-leader-side, chicken-and-egg-problem, rochet-tirole-2003, interchange-fee, getting-both-sides-on-board]
lineage:
  - source: primary
    text: rochet-tirole-2003-platform-competition-in-two-sided-markets
    citation: "Jean-Charles Rochet and Jean Tirole, 'Platform Competition in Two-Sided Markets,' Journal of the European Economic Association 1(4):990-1029 (June 2003). has a real text layer). Rochet and Tirole formalize the two-sided-market pricing problem: a platform mediates transactions between two distinct groups of end-users (buyers/sellers, cardholders/merchants, console-owners/game-developers, readers/advertisers) whose demand for the platform depends on how many of the OTHER group is present — a cross-group network externality that neither side internalizes on its own. The paper's central result, derived for a profit-maximizing monopolist, competing for-profit platforms, and a welfare-maximizing Ramsey planner under budget balance alike, is that the platform must choose a PRICE STRUCTURE — how the total per-transaction price divides between the two sides — and not merely a price LEVEL, and that the optimal structure is set by each side's price elasticity and by the average surplus each side's participation confers on the other, not by either side's own cost-to-serve. The paper's Table 1 and Section 7 'mini case studies' catalogue the resulting real-world pattern: platforms routinely treat one side as a loss leader (game consoles, ad-supported media) priced at or below cost, recovering the shortfall and the platform's margin from the other side (game-developer royalties and dev-kit fees, advertiser rates, merchant interchange fees)."
    quote: "[on the general phenomenon, Introduction:] 'Buyers of video game consoles want games to play on; game developers pick platforms that are or will be popular among gamers. Cardholders value credit or debit cards only to the extent that these are accepted by the merchants they patronize; affiliated merchants benefit from a widespread diffusion of cards among consumers. More generally, many if not most markets with network externalities are characterized by the presence of two distinct sides whose ultimate benefit stems from interacting through a common platform.' [on the paper's central claim, that price STRUCTURE is a distinct design variable from price LEVEL:] 'The recognition that many markets are multisided leads to new and interesting positive and normative questions. Under multisidedness, platforms must choose a price structure and not only a price level for their service.' [on the resulting business-model pattern, Introduction, describing Table 1 — quoted here as one continuous sentence with the page-break header/footer/e-mail-address artifacts elided, all words verbatim and in original order:] 'For example, video game platforms such as Sony, Sega and Nintendo make money on game developers through per-unit royalties on games and fixed fees for development kits and treat the gamers side as a loss leader.' [the formal characterization of the price structure, Proposition 1(ii):] '(ii) The price structure is given by the ratio of elasticities (and not inverse elasticities):' [the canonical below-cost instance, Section 7.4 on video game consoles, footnote 27:] 'Sony sold its console below cost and made the money back on game royalties.' [on credit-card interchange fees as the cross-subsidization instrument, Section 7.1:] 'The associations' choice of interchange fees have typically favored cardholders over merchants who kept accepting the card despite the high level of the merchant discounts.' [on why this is not reducible to a one-sided-market intuition, Section 8:] 'Yet thinking of the markets discussed in this paper as one-sided markets just runs counter to evidence. First, the platform owners in all these industries devote much attention to their price-allocation business model: Is it more important to woo one side or the other?'"
  - source: discovery-loop
    text: lexicon-coverage-cli-uncovered-scan
    citation: "Lex-0516 (Oi 1971, the two-part tariff) names a one-sided pricing-structure problem: a single producer facing one customer population, choosing between an access fee and a per-unit marginal price to recover its own fixed cost, with both knobs applying to the same customer type. This atom names a two-sided problem: a platform sets a price for side A and a different price for side B, where the correct split is set by each side's elasticity and by the cross-group externality each side confers on the other, not by recovering any one side's own cost — the mechanism and the 'who pays' logic differ in kind, not degree. Lex-0517 (Doctorow's enshittification) is a descriptive, critical account of a platform's decay trajectory over time — extracting value first from users, then business customers, then shareholders, once lock-in accrues — rather than a claim about how a healthy two-sided platform should split price in the first place. Rochet-Tirole's theory is normatively neutral about which side is subsidized (a below-cost price to one side can be the efficient Ramsey allocation, not merely a symptom of extraction), where Doctorow's account describes a directional decline in what a platform delivers to each side once lock-in permits extraction."
canonical-instances:
  - "credit and debit card networks: Visa/MasterCard interchange fees (paid by merchants' acquiring banks to cardholders' issuing banks) have historically favored cardholders with lower fees and richer rewards while merchants absorb the higher merchant discount despite objecting to it — the paper's canonical illustration of implications 3 through 6 of its formal model"
  - "ad-supported media and portals: nonpay TV, newspapers, and Internet portals have used viewers/readers as a loss leader (cheap or free access and content) to build an audience, with advertising revenue as the profit-making segment — the same structure the paper's Table 1 catalogues across software, portals, media, and payment systems"
  - "video game consoles: Sony, Sega, Nintendo, and Microsoft have all sold consoles at or below cost (Sony's PlayStation and Microsoft's Xbox explicitly) and recovered the shortfall through per-unit royalties and fixed development-kit fees charged to game developers, treating the gamer side as the loss leader and the developer side as the profit center"
  - "app-store platforms (contemporary instantiation, not itself a case study in the 2003 paper): Apple's App Store and Google Play fund a marketplace and discovery layer offered free to consumers by charging developers a commission on transactions — the same cross-group-externality logic the paper formalizes for consoles and cards, applied to a platform type that postdates the paper"
  - "operationally distinct from lex-994yb fixed-cost-recovery-channel-determines-whether-marginal-pricing-races-to-the-bottom (Oi 1971 two-part tariff): lex-994yb is a ONE-SIDED problem — a single producer choosing an access fee and a marginal price to recover its OWN fixed cost from ONE customer population. This atom is a TWO-SIDED problem — a platform sets a DIFFERENT price for each of two distinct customer groups, and the correct split depends on the cross-group externality each side confers on the other, not on any one side's cost-recovery need. Oi's producer has one customer type and two knobs (access fee, marginal price); Rochet-Tirole's platform has two customer types and one price each, set jointly by elasticity and cross-side value"
  - "operationally distinct from lex-ukgke enshittification-as-the-platform-degradation-path-from-user-value-to-extraction (Doctorow): lex-ukgke is a DESCRIPTIVE, critical account of a platform's DECAY TRAJECTORY over time — a sequence in which surplus is extracted first from users, then business customers, then shareholders, as lock-in accrues. This atom is the underlying NEUTRAL PRICE THEORY for how a healthy, non-decaying two-sided platform should split its price in the first place, grounded in elasticity and cross-side externality rather than in lock-in exploitation. A platform can run a Rochet-Tirole-efficient lopsided price structure indefinitely without ever entering the lex-ukgke decay trajectory; the two atoms compose when a platform's initial efficient subsidy (lex-md8ku) curdles into extraction once lock-in makes exit costly (lex-ukgke)"
critical-questions:
  - "is the platform's price split actually being chosen by cross-side-externality logic, or is one side's price being set at its own cost-to-serve as though this were a one-sided market? Treating a two-sided market as one-sided systematically misprices both sides"
  - "which side, if grown by some increment, raises the OTHER side's willingness to pay more? That is the side to subsidize — the pricing asymmetry follows from the answer, not from auditing each side's own cost"
  - "is the below-cost or free side genuinely receiving a cross-subsidy funded by the platform's profit on the other side, or is its low price actually masking a cost externalized onto a third, undefended party rather than recovered from the other side of the two-sided market (see lex-z2fkk)?"
  - "would 'neutrality' hold here — could the two sides simply re-negotiate around the price split so that only the total price level matters, not its allocation (per the paper's own Section 8 discussion of when one-sided-market treatment is actually correct)? If neutrality holds, the price-structure question is moot"
  - "is a lopsided split being read as evidence that the higher-priced side is being exploited, when it may instead be the efficient (Ramsey) allocation given that side's lower elasticity or smaller contribution to the other side's surplus?"
status: active
