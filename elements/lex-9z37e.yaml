id: lex-9z37e
name: exploitation-transfers-power-via-a-relation-not-a-one-time-deficit
type-in: claim
type-out: structure
_tier: atomic
agent-instruction: "Recognize this pattern when an unequal outcome is being treated as fixable by a one-time transfer of goods, and check whether the outcome is actually generated by an ongoing RELATION — a wage relation, a division of labor, an institutionalized transfer of energies and capacities from one group to another that augments the receiving group's power. Young's mechanism, reconstructing Marx via Macpherson: 'the injustice of capitalist society consists in the fact that some people exercise their capacities under the control, according to the purposes, and for the benefit of other people.' The diagnostic test: if the relation itself stays untouched, a redistributed sum simply gets re-extracted — 'the process of transfer will re-create an unequal distribution of benefits.' Fixing exploitation requires 'reorganization of institutions and practices of decisionmaking, alteration of the division of labor,' not a bigger check."
related: [lex-s2uyr]
evokes: [exploitation, marx-via-macpherson, transfer-of-energies, wage-relation, division-of-labor, five-faces-of-oppression, iris-marion-young-1990]
lineage:
  - source: primary
    text: young-1990-justice-and-the-politics-of-difference
    citation: "Iris Marion Young, *Justice and the Politics of Difference* (Princeton, NJ: Princeton University Press, 1990), Chapter 2, 'Five Faces of Oppression,' the exploitation section (pp. 49-53). One face of a five-part typology (see lex-s2uyr for the full typology and how the five faces relate)."
    quote: "'The injustice of exploitation consists in social processes that bring about a transfer of energies from one group to another to produce unequal distributions, and in the way in which social institutions enable a few to accumulate while they constrain many more. The injustices of exploitation cannot be eliminated by redistribution of goods, for as long as institutionalized practices and structural relations remain unaltered, the process of transfer will re-create an unequal distribution of benefits. Bringing about justice where there is exploitation requires reorganization of institutions and practices of decisionmaking, alteration of the division of labor, and similar measures of institutional, structural, and cultural change.' [Reconstructing Marx via Macpherson, on the mechanism itself:] 'the injustice of capitalist society consists in the fact that some people exercise their capacities under the control, according to the purposes, and for the benefit of other people.'"
  - source: discovery-loop
    text: split-from-lex-s2uyr-young-five-faces-of-oppression
    citation: "Split out of lex-s2uyr, which originally carried all five of Young's faces plus her social-group-ontology argument in one _tier: atomic entry -- six atoms' worth of content compressed into one, flagged by an Anki-lint length pass and split into a molecule (lex-s2uyr) with six children (this atom and lex-sxc7c, lex-295yy, lex-qrfr5, lex-wcpsk, lex-4kfah). The quote above is excerpted from lex-s2uyr's own already-verified lineage, not independently re-acquired."
canonical-instances:
  - "Exploitation's non-distributive remedy: 'The injustices of exploitation cannot be eliminated by redistribution of goods, for as long as institutionalized practices and structural relations remain unaltered, the process of transfer will re-create an unequal distribution of benefits.' A one-time wealth transfer to an exploited group, absent a change in the transfer-generating institutional relation (the wage relation, the division of labor), simply gets re-extracted."
critical-questions:
  - "Would the injustice actually dissolve if the current distribution were corrected — or would the transfer-generating relation (the wage relation, the division of labor, the institutionalized practice) simply re-produce the same deficit once the redistributed goods were spent?"
  - "Has the underlying institutional relation actually changed, or has only a payout been made? A real fix reorganizes decisionmaking practices and the division of labor; a payout that leaves the extraction mechanism intact will regenerate the same gap."
status: active
