id: lex-jh74q
name: an-ally-network-protects-you-without-being-asked
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you build a network of allies for one specific purpose, don't assume their usefulness to you ends once that original purpose is achieved -- an ally network that owes you loyalty tends to keep working on your behalf indefinitely, watching and reporting things you never asked them to watch for. In Cushing's telling, the youth recruited the town's dogs for a single military campaign, and the campaign is long over by the time his jealous rivals gather secretly to plot his murder. Nobody asks the dogs to keep listening; the rivals simply forget the dogs exist as a factor at all: 'the fools didn't think of the Dogs lying around outside, who heard what they said.' The dogs act on their own initiative, with no fresh instruction needed: 'the Dogs scrambled off immediately and informed their friend and brother what was going on.' The loyalty built during the original campaign didn't expire when that campaign ended -- it became a standing, self-directed asset that kept protecting him from threats he didn't know to watch for himself. Diagnostic move: when you've earned genuine loyalty from a network of people or allies through some specific past effort, don't treat that relationship as closed once the original task is done -- a loyal network, once built, tends to keep noticing and reporting things on your behalf without being asked, and your enemies are far more likely to forget that network exists than you are to remember to rely on it."
