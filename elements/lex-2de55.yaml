id: lex-2de55
name: a-guarantor-adds-no-security-when-their-risk-correlates-with-the-debtors
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating a proposed guarantor or co-signer, check whether their own risk profile is genuinely independent of the principal debtor's, since a guarantor whose risk moves together with the debtor's adds nothing to the arrangement's real security. Aesop's 'The Sheep, the Wolf, and the Stag' has a stag ask a sheep to lend a wolf some corn, offering to stand as guarantor; the sheep declines, naming exactly why the guarantee is worthless: 'The Wolf is in the habit of seizing what he wants and running off with it without paying, and you, too, can run much faster than I. So how shall I be able to come up with either of you when the debt falls due?' Both the wolf and the stag share the same underlying unreliability — speed and unaccountability — so stacking a second unreliable party does nothing to cure the first one's risk."
