canonical-instances:
  - "A hospital board dismisses a nurse whistleblower as 'clearly unstable and vindictive' rather than engaging with the specific documented failures she reported, and the label itself, not any actual investigation, is what stops other staff from taking her claims seriously or asking their own questions."
  - "A community describes an outspoken elder who challenges local customs as 'senile' or 'losing it,' a diagnosis that conveniently spares anyone the discomfort of actually weighing whether the customs being challenged deserve challenging."
critical-questions:
  - "How would someone actually distinguish a genuine, warranted clinical or moral judgment (some boundary-crossers really are dangerous or exploitative) from a defensive pathologizing label applied purely to avoid engagement, given that both can use identical vocabulary?"
  - "Does this framework risk becoming a universal defense for any transgressive figure -- could 'they're just calling me a psychopath to avoid engaging with my real function' be used to deflect legitimate criticism of someone who actually is causing harm?"
  - "Is Hyde's own psychological speculation ('I have often wondered') actually evidenced, or is this an appealing but unfalsifiable explanation for why the trickster/psychopath comparison exists, when a simpler explanation (some tricksters really do resemble psychopaths in relevant ways) might suffice?"
