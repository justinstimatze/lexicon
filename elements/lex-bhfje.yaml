id: lex-bhfje
name: total-shielding-from-a-stimulus-removes-the-capacity-for-graduated-regulation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Completely preventing someone from ever encountering a stimulus, in order to keep them from forming an attachment to it, doesn't leave them neutral when the shielding eventually fails. It leaves them without any of the graduated experience that would normally let a person regulate their own reaction, so the first real exposure produces an extreme response rather than a moderate one. In the Jataka's tale of the sheltered prince, a young man is never once permitted to see a woman throughout his entire upbringing. The moment the isolation is finally breached, his reaction has no proportion built into it at all: 'he went the way of the world, and knew the joy of love. \"I will not let another have this woman,\" he resolved; and taking his sword, he ran amuck through the street, chasing the people.' The strategy meant to prevent attachment produced, on first contact, the most extreme and least regulated attachment imaginable."
related: []
evokes: [jataka, tikanipata, culla-palobhana-jataka, complete-shielding-removes-the-capacity-for-graduated-self-regulation, first-exposure-after-total-isolation-produces-a-disproportionate-reaction]
