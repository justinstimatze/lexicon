id: lex-xda7f
name: reserving-the-second-say-beats-conceding-the-first
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "In a negotiation where one party insists on going first with every proposal, agreeing to that condition costs nothing if you secure the right to respond to each specific proposal afterward, because the party who answers last effectively controls the actual outcome regardless of who spoke first. In the Blackfoot trickster myth Radin quotes, Old Man and Old Woman divide up how the world will work: ''Well,' said Old Man, 'I am to have the first say in everything,' To this Old Woman agreed, provided she had the second say.' What follows is a string of proposals where Old Man's 'first say' never once survives Old Woman's 'second say' unmodified: 'Then Old Man began, 'The women are to tan the hides... But all this they are to do very quickly, for it will not be very hard work.' 'No, I will not agree to this,' said Old Woman. 'They must tan the hide in the way you say; but it must be made very hard work, and take a long time.'' The pattern repeats for every proposal that follows -- Old Man speaks first, and Old Woman's amendment is what actually takes effect. Old Man never loses the formal privilege he negotiated for; he simply never gets an outcome that matches what he proposed. Diagnostic move: when someone insists on the right to propose first, check who holds the right to respond last before treating the arrangement as a concession to them -- proposing first only controls outcomes when nobody downstream has the standing to modify or reject the proposal, and if that standing exists, it's worth more than going first."
