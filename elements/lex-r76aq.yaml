lineage:
  - source: primary
    text: zitkala-sa-iktomi-and-turtle-flattery-then-delayed-stake
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'Iktomi and the Turtle.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Yes, my friend, you are a skillful fellow. Now let us have a little contest. Let us see who can jump over the deer without touching a hair on his hide,' suggested Iktomi. ... Just before the run and leap Iktomi put in: 'Let the winner have the deer to eat!' It was too late now to say no. Patkasa was more afraid of being called a coward than of losing the deer."
canonical-instances:
  - "A car salesperson tells a customer 'you clearly know exactly what you want' before walking them through a test drive and paperwork, only mentioning the full financing terms and add-on fees once the customer has already spent an hour driving the car and telling friends they're getting it, making backing out feel like admitting the earlier confidence was misplaced."
  - "A recruiter praises a candidate's rare qualifications before inviting them to 'just come in for a friendly chat,' and only reveals during that meeting that accepting the informal offer requires giving notice at their current job within 48 hours, timing the real commitment to land after the candidate has already told colleagues about the exciting new opportunity."
critical-questions:
  - "how does someone distinguish genuine, well-intentioned encouragement that happens to precede a real opportunity from calculated flattery designed to manufacture an irreversible commitment -- is there a reliable difference in the moment, or only in hindsight once the stakes are revealed?"
  - "does insisting on knowing all stakes before any commitment risk killing off genuinely valuable spontaneous opportunities that only work because enthusiasm builds before the full picture is available, making this caution costly in situations that aren't actually manipulative?"
  - "why does the fear of being called a coward outweigh the actual, tangible cost of losing the deer -- does this reveal something more specific about social face-loss being a more powerful lever on decision-making than direct material loss, worth naming as its own separate claim?"
