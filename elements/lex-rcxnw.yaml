id: lex-rcxnw
name: a-conventionalized-icon-stops-updating-from-new-evidence
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When you present accurate, damaging facts about a group everyone already treats as a model citizen or hero, don't expect the facts alone to shift the group's status. Lakoff's case: Robert Reich, as Secretary of Labor, tried to flip conservatives' own demonization tactic back on their model citizens. He documented that large corporations and the ultrarich receive enormous unearned government largesse -- cheap grazing and mineral rights, infrastructure subsidies, agricultural price supports -- an amount 'far exceeding the cost of social programs.' He labeled it 'corporate welfare' -- placing successful corporations in the same demonized category as welfare recipients. The attempt failed instantly and completely, and not because the facts were wrong. Once a category's status has been used often enough that it becomes conventionalized -- an icon, a fixed stereotype anchor rather than a running conclusion drawn fresh from current evidence -- new information doesn't get weighed against it, because the status isn't being actively evaluated against evidence anymore. The successful businessman is simply what a model citizen looks like in this system, prior to and independent of any particular fact about a particular corporation. Diagnostic move: before trying to recategorize an entrenched hero or entrenched villain with new facts, check whether that status is still a live inference open to updating or has already calcified into an icon that facts no longer reach."
related: []
evokes: [george-lakoff, moral-politics-1996, robert-reich, corporate-welfare, model-citizen]
lineage:
  - source: primary
    text: lakoff-1996-reich-corporate-welfare-attempt
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 9 'Moral Categories in Politics,' section 'Model Citizens and Demons.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Secretary of Labor Robert Reich found this out shortly after the 1994 elections, when he sought to recategorize the best model citizens of all—large successful corporations and the people who run them. Reich attempted to use the conservative demonization of welfare recipients against the conservative conception of model citizens. He attacked big corporations and the ultrarich for being recipients of ‘corporate welfare.’”"
  - source: primary
    text: lakoff-1996-reich-failure-explained
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 9 'Moral Categories in Politics,' section 'Model Citizens and Demons.'"
    quote: "“Reich’s attempt to turn the conservatives’ model citizens into conservative demons was doomed to failure, and it fell flat immediately. The reason is clear. The status of successful corporations and the ultrarich as model citizens has become conventionalized—fixed in the conservative mind. They are icons, standard examples to conservatives of what model citizens are.”"
canonical-instances:
  - "The direct textual anchor, on the closing diagnosis: 'Reich's attempt to call attention to the enormous unearned largesse bestowed by the government on big corporations failed because he did not really understand the conservative worldview and the cognitive structure underlying American politics... You don't change that with a single speech.'"
  - "Hypothetical: a nonprofit publishes a rigorous investigative report showing that a beloved local hospital system quietly overbills uninsured patients at several times the rate it charges insurers. The story runs on the front page and cites internal billing documents. A year later, community surveys show no measurable change in how residents rate the hospital's trustworthiness -- the hospital's status as a pillar of the community had stopped being a running tally of its behavior long before the report ran, and one accurate story, however damning, was never going to be weighed against a total that had already been fixed."
critical-questions:
  - "If conventionalized icon status genuinely stops updating from evidence, what ever causes an icon to fall -- do icons only collapse under some threshold of accumulated scandal, a single event severe enough to force active re-evaluation, or a slow generational turnover as the people who fixed the icon in the first place are replaced by people who never fixed it at all? Lakoff's account explains the icon's resistance but not its eventual failure modes."
  - "Reich picked an existing demonized category (welfare recipient) and tried to move an existing icon (successful corporation) into it in one move. Would a slower approach -- introducing a new, unnamed category for 'entities that receive large unearned government transfers,' without invoking the already-loaded 'welfare' label -- have had a better chance, or does any attempt to recategorize a conventionalized icon fail regardless of framing, because the resistance is to the recategorization itself rather than to the specific vocabulary used?"
status: active
