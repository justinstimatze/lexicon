id: lex-e3hn5
name: an-identity-invoking-appeal-collapses-entrenched-fear-instantly
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An appeal that invokes someone's own identity — naming what kind of being they are supposed to be — can dissolve an entrenched fear or craving in a single moment that reasoning about consequences or rewards had failed to touch. In the Jataka's tale of the war elephant frozen at a besieged gate, no threat or incentive moves him; his trainer instead reminds him what he is: 'O Elephant, a hero thou, whose home is in the field: There stands the gate before thee now: why dost thou turn and yield? Make haste! break through the iron bar, and beat the pillars down! Crash through the gates, made fast for war, and enter in the town!' The elephant charges immediately. Nothing about the danger changed — what changed was that fear had briefly overridden his own self-conception, and the appeal simply handed it back to him."
