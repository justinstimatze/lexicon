lineage:
  - source: primary
    text: altshuller-1984-crick-perfect-biological-principle
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.8 'The Science of Invention,' section 'There on the Horizon.'"
    quote: "'Francis Crick, a future Nobel Prizewinner heard over beer about an astronomist who had talked something about the 'perfect cosmological principle.' Crick paid little attention to exactly what he meant by this but he was set to wondering whether an argument could be made for the 'perfect biological principle', i.e. could one formulate the IFR for the problem under consideration? Crick was interested in the problem of the replication of DNA and therefore in this instance the 'perfect biological principle' was 'the self-replication of DNA.' That is how the first step toward one of the most important discoveries of the 20th century was taken.'"
  - source: primary
    text: altshuller-1984-golovchenko-ideal-plant
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.8, 'There on the Horizon.'"
    quote: "'An accidental phrase heard in a university pub... But what if one had consciously employed the IFR for the 'making of a discovery' if only in biology itself? Take Engineer (not a biologist!) G.G.Golovchenko, a TSIP lecturer from Sverdlovsk, who applies the IFR concept to... the evolution of plants. His course of thinking was approximately as follows: plants of today in comparison with those of yesterday are an approximation to the IFR, to some ideal plant which has absorbed to the full substances and energy from its habitat, and let us look at what contradictions could arise in this process and how the plant overcome them, in drawing closer to the IFR. The research undertaken by Golovchenko led to the discovery of the wind energy power of plants — the ability of plants to directly utilise the energy of the wind.'"
canonical-instances:
  - "A materials scientist studying spider silk deliberately asks what an 'ideal' fiber for the spider's ecological niche would need to do (catch prey, resist weather, cost minimal protein) and finds that the gap between real silk and that ideal points to an undocumented self-healing property in the silk's molecular structure — the same kind of question a biologist studying silk purely as 'what is here' might never think to pose."
  - "An engineer studying termite mounds asks what an 'ideal' mound would achieve (perfect temperature regulation with zero energy expenditure) and, hunting for the gap between the real mound's performance and that ideal, discovers a previously undocumented passive-airflow channel system — a finding driven by asking the ideality question of a natural system, not by biological fieldwork alone."
  - "operationally distinct from lex-mubyx anchor-on-the-ideal-final-result-and-retreat-minimally: that atom uses the IFR to ORIENT and PRUNE candidate engineering solutions to a known problem; this atom applies the same IFR question to an ALREADY-EXISTING NATURAL SYSTEM purely as a discovery-generating question ('what would this system's ideal form do that it apparently doesn't') — no engineering solution is being designed, the goal is locating an unknown fact about something that already exists."
critical-questions:
  - "how would someone know their guess at what 'ideal' means for a given natural system is the right one — Golovchenko's framing (absorbing substances and energy to the full) happened to point toward a real discovery, but a wrongly-chosen notion of 'ideal' for a system could send a researcher looking for a capability that doesn't actually exist and was never evolutionarily favored in the first place?"
  - "does this method work equally well for systems shaped by evolutionary trade-offs (where 'more efficient at absorbing everything' may not actually be what natural selection optimized for) as it does for engineered systems (where getting closer to an ideal usually is straightforwardly better)? Might applying an engineering ideality frame to biology systematically bias the search toward capabilities that look impressive but aren't actually there?"
  - "Crick's accidental route and Golovchenko's deliberate route reached structurally similar insights — does the deliberate version reliably produce discoveries as significant as the lucky accidental one, or does relying on a systematic question generate mostly false leads that happen to occasionally, coincidentally, land on something real?"
