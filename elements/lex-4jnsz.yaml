canonical-instances:
  - "A founder's child joins the family company in the exact same role their parent built the company around, rather than a different department or a related but distinct venture — colleagues read the hesitation before formally taking the title as reluctance or lack of ambition, when it may instead be the extra time needed to feel the role is theirs and not simply inherited."
  - "A graduate student whose advisor is a leading figure in a subfield takes noticeably longer to commit to that exact subfield than to an adjacent one their advisor doesn't work in, despite equal talent and interest in both — the delay tracks how exactly the path overlaps with the mentor's own, not how attractive the subfield is."
critical-questions:
  - "How would you distinguish this identity-autonomy conflict from ordinary adolescent friction with a parent, which could independently slow any decision a parent is pushing regardless of whether the son's own interest runs the same direction — Rogoff's data shows a correlation with delay but not a way to rule out generic parent-child friction as the operative cause?"
  - "Does the effect require the parent to be visibly active in the field at the time of the decision, or would a deceased, retired, or estranged parent in the identical occupation produce the same delay — and if presence matters, is the mechanism really about identity-autonomy at all, or closer to a more ordinary form of everyday parental influence that simply happens to run stronger for a living, present parent?"
status: active
