id: lex-n365w
name: things-are-what-they-are-reported-to-be
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "When an actor is embedded in an administrative or bureaucratic system, surface Gall's F.L.A.W.: the system's reality is whatever is reported to it — what isn't in the records doesn't exist for the system; the deeper one operates inside it, the more the outside world pales and disappears. The fix is rarely 'try harder to see' — it's redesigning the sensory channel."
related: [lex-68abd, lex-5yufs, lex-xxmeh, lex-p34bd, lex-tb3re, lex-fxtuq, lex-3656j, lex-hsnup, lex-urwym, lex-mx4q5]
scaffolds-from: [lex-68abd, lex-3656j]
evokes: [gall-1975-systemantics, fundamental-law-of-administrative-workings, the-chart-is-not-the-patient, the-dossier-is-not-the-person, if-it-isnt-official-it-didnt-happen, korzybski-semantic-anomaly, coefficient-of-fiction, sensory-deprivation-of-systems]
lineage:
  - source: primary
    text: gall-1975-systemantics-flaw
    citation: "John Gall, *Systemantics: How Systems Work and Especially How They Fail* (originally *General Systemantics*, self-published 1975; Quadrangle/The New York Times Book Co., 1977), Ch. VI 'Inside Systems' and Appendix I Axiom #9 ('Fundamental Law of Administrative Workings,' F.L.A.W.). The structural-claim has three coupled parts: (1) within an administrative system, the operative reality IS the system's reports — `Things are what they are reported to be` — so unreported reality is functionally absent. (2) The system's epistemic capacity is bounded by its sensory channels: `a system is no better than its sensory organs`; whatever the channel filters, blurs, or excludes is invisible. (3) The longer an actor operates inside the system, the more the outside world pales — Gall coins `Coefficient of Fiction` (C.F. = reality-failing-to-reach-the-system / total-reality) and notes regimes where C.F. exceeds 0.99 (evangelistic movements, authoritarian governments, executive suites). The corollary `the bigger the system, the narrower and more specialized the interface with individuals` names the per-person residue: large systems do not interact with people at all but with their `paper phantom` (SSN, driver's license, dossier). Gall acknowledges Korzybski's `semantic anomaly` (map-not-territory in administrative form) as the precursor and offers his anti-McLuhan formulation: `the message is the medium by which the system knows the world.` Transferable: the law is about institutional epistemology of any record-driven actor (bureaucracy, audit, KPI dashboard, RLHF data pipeline, embedded ML model whose `world` is its training distribution), not just classical bureaucracies. It is distinct from lex-tb3re Goodhart (which is about a measure becoming a target via gaming) — F.L.A.W. operates by default, with no gaming required. It is distinct from lex-68abd map-not-territory (a perceptual/semantic primitive applicable to any agent) by specifying the institutional-record substrate: the operative map IS the institution's records, not just a representation diverging from territory."
    quote: "[Gall 1975, Ch. VI 'Inside Systems' / Appendix I Axiom #9, paged 39-43 and 90 in the 1977 Quadrangle ed.:] 'Things Are What They Are Reported To Be. This Axiom has been stated in various ways, all to the same effect. Standard formulations include the following: The Real World Is What Is Reported To The System. If It Isn't Official, It Hasn't Happened. This proposition, which is fundamental to communication theory as well as to epistemology, may have been foreshadowed by Marshall McLuhan, although he seems to have gotten it backwards: correctly stated, The Message is the Medium by which the System knows the World. ... The net effect of this Law is to ensure that people in systems are never dealing with the real world that the rest of us have to live in but with a filtered, distorted, and censored version which is all that can get past the sensory organs of the system itself. Corollary No. 1: A System Is No Better Than Its Sensory Organs. ... Corollary No. 2: To Those Within A System, The Outside Reality Tends To Pale And Disappear.' [On the Coefficient of Fiction, verified 2026-08-19 against the real PDF -- exact match; the checker cannot confirm it because the source is a numerator/denominator table layout that OCR flattens into a scrambled linear read:] 'R_f / R_t where R_f equals the amount of reality which fails to reach the relevant administrative officer and R_t equals the total amount of reality presented to the system. The fraction varies from zero (full awareness of outside reality) to unity (no reality getting through). It is known, of course, as the COEFFICIENT OF FICTION. Positive Feedback obviously competes with Reality for input into the System. The higher the P.F., the larger the quantity of Reality which fails to gain entrance to the System (R_f) and the higher the C.F. In systems employing P.F., values of C.F. in excess of 0.99 have been recorded. Examples include evangelistic religious movements, certain authoritarian governmental systems, and the executive suites of most large corporations. Corollary No. 3: The Bigger The System, The Narrower And More Specialized The Interface With Individuals. In very large systems, the relationship is not with the individual at all but with his social security number, his driver's license, or some other paper phantom.' [And from the nurses'-station-sign passage, verified 2026-08-19, exact match:] 'The Chart Is Not The Patient. Unfortunately this slogan, with its humanistic implications, turned out to be misleading. The nurses were neither attending the patient nor making notations on the charts. They were in the hospital auditorium taking a course in Interdisciplinary Function. Nowhere on the wall of any [government agency] has the author seen a notation to the effect that The Dossier Is Not The Person — nor does he expect ever to see such a notation.' [The structural shape: F.L.A.W. names the substitution `reports = world` as the system's default epistemic operation; the Coefficient of Fiction quantifies the gap; the `paper phantom` corollary names the per-person residue; and Gall explicitly grounds it in Korzybski (the semantic anomaly) while noting that McLuhan got it backwards — the medium is not the message but the medium by which the system knows the world.]"
canonical-instances:
  - "the agency for which the unrecorded incident did not happen: an unreported assault, an off-the-books expense, an unlogged equipment failure — the administrative system continues as though the event never occurred, not because of cover-up but because F.L.A.W. operates by default; the system's reality is its records. The fix is to widen the sensory channel (mandatory reporting, independent observers, instrumented capture), not to exhort officials to `consider the unrecorded`"
  - "the dashboard-as-world for executives: senior leadership of a large org operates on summary KPIs and exception reports; the territory those reports filter (workforce morale, customer rage, vendor distress) pales and disappears, producing the executive-suite C.F. near 1.0 Gall flags. Compositional with lex-p34bd streetlight-effect (you look where the data is) — F.L.A.W. is the structural why behind the streetlight reflex"
  - "the embedded ML system whose `world` is its training distribution: a deployed classifier treats anything outside its training distribution as if it did not exist (silent failures, never-seen classes routed to a default bucket, distribution shift invisible to the model). F.L.A.W. ports cleanly: the model's reality is the labelled set; what wasn't labelled didn't happen. The cure is the same shape — widen the sensory channel (active learning, OOD detection, human-in-the-loop on low-confidence) rather than train harder on the same set"
  - "the dossier IS the person, at scale: an automated background-check, credit-scoring, or visa-screening system interacts with paper phantoms; the actual person on the other side has no channel to correct the record except through the system's own dispute pipeline, which is itself another record-driven layer. F.L.A.W. predicts both the Kafkaesque experience and the systemic difficulty of repair — the territory has no preferred channel to override the map"
  - "operationally distinct from lex-68abd map-not-territory: lex-68abd is the perceptual/semantic primitive (any representation diverges from what it represents). lex-n365w specifies the institutional-record substrate and adds the operative mechanism — the system actively SUBSTITUTES its records for the world, and the deeper one operates inside, the more outside reality pales (Corollary No. 2). lex-68abd says don't confuse map and territory; lex-n365w says the system is structurally committed to that confusion as its default mode of operation"
  - "operationally distinct from lex-tb3re Goodhart's law: Goodhart describes a measure ceasing to be a good measure when it becomes a target (the gaming mechanism). F.L.A.W. operates without any gaming — the records are not necessarily targets, and no actor need be optimising; the system simply substitutes its reports for the world by default. A bureaucracy with no gaming is still subject to F.L.A.W.; Goodhart adds the further effect when the records become targets"
  - "operationally distinct from lex-3656j (Berger-Luckmann 1966): lex-3656j names the dialectical construction of shared institutional reality (habituation + typification produce an objectivated order). F.L.A.W. names a downstream consequence of that order — once the institution exists, ITS reality (its records, its reports) becomes the operative one for those embedded in it. lex-3656j is the genesis; lex-n365w is the operating-mode consequence"
critical-questions:
  - "what is being reported and what is leaking through the sensory channel unreported? The unreported is precisely what's invisible to the system; if your fix is `pay closer attention to the data we have,` F.L.A.W. predicts the same blindness. Locate the channel itself and ask what it cannot register at all"
  - "what is the Coefficient of Fiction for the decisions being made — what fraction of relevant reality reaches the decision-maker? Gall's quantification matters: a senior executive reading summary reports and exception flags is structurally near 1.0 C.F. on the experience of frontline workers; a model reading curated training data is structurally near 1.0 C.F. on the long tail it never saw. Naming the rough C.F. directs attention to the right intervention"
  - "is the person being interacted with, or the paper phantom (the dossier, the record, the score)? In large systems the answer is the latter; complaints about `dehumanising bureaucracy` are usually a complaint about Corollary No. 3 (narrow interface with individuals at scale). The fix is engineering — a wider, lower-latency, error-correcting interface — not exhortation"
  - "is positive feedback competing with reality for the input channel (Gall's P.F.-vs-R input-competition note)? Praise, loyalty signals, and aligned-team upward-reporting crowd out adverse reality information; the C.F. rises mechanically. The cure is structural: lower the cost of upward bad-news transmission (independent ombuds, anonymous channels, randomised audits) rather than asking officials to `welcome dissent`"
  - "is the proposed fix asking actors INSIDE the system to see what the system cannot register, or is it widening the system's sensory channel? F.L.A.W. predicts the first will fail (Corollary No. 2 — the inside actor's reality IS the records; the outside has paled). Real fixes alter the channel — instrument the unreported, lower the cost of correction, add adversarial inputs the records cannot suppress"
  - "what would falsify the claim that F.L.A.W. is operating here vs. ordinary inattention or incompetence? Gall's specific signature is system-level: the same blindness occurs across actors regardless of competence, the actors themselves cannot perceive what the system filters, and the blindness narrows with depth-of-embedding. A failure attributable to one careless person is not F.L.A.W.; a failure that replicates across replacement of personnel is"
status: active
