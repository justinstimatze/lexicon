lineage:
  - source: primary
    text: pascoe-2018-dark-emu-aboriginal-australia-and-the-birth-of-agriculture
    citation: "Beryl Cruse, Liddy Stewart, and Sue Norman, *Mutton Fish* (Aboriginal Studies Press, Canberra, 2005), p. 17, recording ethnographer R.H. Mathews's account of the Yuin orca-hunting partnership -- quoted in Bruce Pascoe, *Dark Emu: Aboriginal Australia and the Birth of Agriculture* (Scribe Publications, 2018), Ch. 6."
    quote: "'When the natives see a whale being chased by killer whales one of the old men pretends to be lame and frail and lights some fires a little distance apart on the shore and walks between them pretending to be lame and helpless to excite the compassion of the killer whales and the man calls on the killers to bring the whale ashore. When the injured whale drifts in to shore the other men come out of hiding to kill the whale and call on neighbouring tribes to join the feast. ... This relationship had been in operation long before Europeans arrived, and continued, modified by the demands for profit, for many years afterward until a disgruntled European whaler shot the lead killer whale. That was the last time the cetaceans co-operated with men. The age-old relationship of reciprocity had been destroyed.'"
canonical-instances:
  - "A supplier relationship runs clean for fifteen years on informal trust -- no penalty clauses, because neither side has ever needed one. A new procurement hire, evaluated only on this quarter's unit cost and with no career stake in the relationship's tenth year, quietly breaks a verbal commitment to hit a number. The supplier doesn't escalate or negotiate; they simply stop extending the flexibility that made the arrangement work, and fifteen years of goodwill converts to a strictly-contractual relationship in one purchase cycle."
  - "An open-source maintainer has spent a decade merging community patches on good faith, no CLA, no formal review gate. One contributor, active for a single month and with no reputation staked on the project's future, slips in a deliberately obfuscated backdoor. The maintainer doesn't just revert the commit -- every future PR now gets adversarial review, because the thing that made the fast-trust model work (everyone involved had skin in the project's future) turned out not to be true of everyone with commit access."
  - "A city has run an honor-system public library return box for forty years. One person, passing through for an afternoon and never coming back, empties it. The city doesn't treat this as an isolated loss -- it installs a lock, because the forty years of honest returns never actually protected the system; they just meant no one with the power to defect had exercised it yet."
critical-questions:
  - "Isn't this just survivorship bias about trust -- most long relationships DO have some protective inertia, don't they? Some of that inertia is real (established norms raise the social cost of defection for anyone who stays inside the relationship), but it only restrains people who plan to keep dealing with the other party. The mechanism here specifically targets the case where the violator doesn't: a one-time actor, an outsider, someone at the end of their tenure. For them, the relationship's age carries no weight either way -- it never enters their calculation."
  - "Doesn't this counsel permanent paranoia -- distrust every long-running arrangement because someone might eventually defect? No: the diagnostic isn't 'expect betrayal,' it's 'locate who could end this unilaterally and check their incentive alignment specifically,' which is a narrower and more answerable question than generalized distrust. Most cooperative systems are fine because the people with unilateral power to break them also depend on them continuing. The Twofold Bay case is instructive exactly because that alignment quietly stopped holding -- a whaling operation with rotating labor, where a given worker's personal stake in the relationship's next decade was much thinner than a Yuin family's."
