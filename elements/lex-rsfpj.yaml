id: lex-rsfpj
name: degrading-maintenance-dependent-gear-forces-stops-without-a-fight
type-in: process
type-out: process
_tier: atomic
agent-instruction: "You don't have to disable a pursuer directly if you can degrade a piece of their equipment that needs periodic maintenance to function -- forcing them to keep stopping and fixing it does the slowing for you, over and over, without you ever having to win a confrontation. In Cushing's telling, two boys fleeing a much larger armed party carry a water-shield loaded with medicine that does nothing to the pursuers' bodies at all; it targets their bowstrings instead: 'Áhaiyúta threw water like thick rain from his shield strapped over his back, so that the enemies' bow-strings loosened, and they had to stop to tighten them again and again.' A wet sinew bowstring doesn't break or disappear, it just stretches out of tension, and every pursuer who wants to keep shooting has to interrupt the chase to re-tighten it: 'whenever the Hawikuhkwe pressed them too closely, the water-shield sprinkled them so thoroughly that when they nocked an arrow the sinew bow-string stretched like gum, and all they could do was to stop and tighten their bow-strings again.' The pursuers remain just as willing and just as numerous the whole time; what's been taken from them is the ability to use their weapons continuously. Diagnostic move: when you can't outrun or overpower a pursuer, look for a piece of their capability that depends on ongoing upkeep rather than a one-time setup, and target that upkeep -- forcing repeated maintenance stops buys you the same distance a direct fight would, without ever requiring you to win one."
