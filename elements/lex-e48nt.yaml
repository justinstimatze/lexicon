lineage:
  - source: primary
    text: bacon-1625-essays-of-simulation-and-dissimulation
    citation: "Francis Bacon, Essays or Counsels, Civil and Moral (1625 final edition; first published 1597, expanded 1612, definitive 1625; filename Bacon-1625-EssaysCounselsCivilMoral.epub). Essay VI 'Of Simulation and Dissimulation' supplies both the mechanism (habitual openness renders occasional strategic concealment invisible) and a graded three-degree taxonomy of concealment (secrecy / dissimulation / simulation) with an explicit tactical ledger of three advantages and three disadvantages. PD globally (Bacon d. 1626)."
    quote: "'Certainly the ablest men that ever were, have had all an openness, and frankness, of dealing; and a name of certainty and veracity; but then they were like horses well managed; for they could tell passing well, when to stop or turn; and at such times, when they thought the case indeed required dissimulation, if then they used it, it came to pass that the former opinion, spread abroad, of their good faith and clearness of dealing, made them almost invisible. There be three degrees of this hiding and veiling of a man's self. The first, closeness, reservation, and secrecy; when a man leaveth himself without observation, or without hold to be taken, what he is. The second, dissimulation, in the negative; when a man lets fall signs and arguments, that he is not, that he is. And the third, simulation, in the affirmative; when a man industriously and expressly feigns and pretends to be, that he is not. [...] So that no man can be secret, except he give himself a little scope of dissimulation; which is, as it were, but the skirts or train of secrecy. [...] The great advantages of simulation and dissimulation are three. First, to lay asleep opposition, and to surprise. [...] The second is, to reserve to a man's self a fair retreat. [...] The third is, the better to discover the mind of another. [...] And therefore it is a good shrewd proverb of the Spaniard, Tell a lie and find a troth. [...] The best composition and temperature, is to have openness in fame and opinion; secrecy in habit; dissimulation in seasonable use; and a power to feign, if there be no remedy.'"
canonical-instances:
  - "The direct pattern-application template: cultivate and maintain a costly, widely-observed reputation for candor across the great majority of your dealings; reserve strategic concealment for the rare moment of genuine leverage, and expect it to go unscrutinized precisely because observers have already concluded you don't do that."
  - "Bacon's own graded-taxonomy template as a decision ladder: default to secrecy (simply don't disclose) when possible; escalate to dissimulation (let a false negative impression form passively) only when secrecy alone is unsustainable under direct questioning; reserve simulation (actively construct a false positive impression) for rare, high-stakes matters, since it is the most detectable and the most corrosive to the underlying reputational shield if discovered."
  - "The undercover-investigator / trusted-insider pattern: an investigator, auditor, or double agent whose long-standing reputation for transparency with a target organization is the operational asset that makes a single well-timed omission or misdirection undetectable — the same mechanism generalizes to any negotiator, diplomat, or public figure whose historical track record of candor is the resource being spent."
critical-questions:
  - "is this the same claim as lex-9pubz (concealment-of-intentions removes counterparty's window for counter-prediction)? Adjacent but distinct axis. lex-9pubz explains WHY concealment works on the counterparty's predictive model (it denies them information needed to anticipate your move). lex-e48nt explains WHY the concealment itself goes UNDETECTED in the first place — the counterparty isn't even scanning for it, because your track record has already told them not to bother looking. lex-9pubz is about the payoff of concealment once achieved; lex-e48nt is about the precondition (reputational cover) that makes achieving it possible without triggering suspicion. They compose: lex-e48nt is what buys you the opportunity to deploy lex-9pubz."
  - "is this the same claim as lex-e3yhv (self-deception improves other-deception by removing leakage tells)? No — lex-e3yhv's mechanism is internal and cognitive (the deceiver believes their own false story, which removes autonomic tells). lex-e48nt's mechanism is external and reputational (the deceiver's PAST behavior, accurately observed and accurately remembered by others, is what removes scrutiny). A perfectly self-aware, non-self-deceived actor can still use lex-e48nt by simply having a genuine track record of honesty to spend; lex-e3yhv requires a specific internal cognitive move that lex-e48nt does not."
  - "does the three-degree taxonomy (secrecy/dissimulation/simulation) matter operationally, or is it just flavor? It matters because the degrees carry different detection-risk and different reputational cost, and Bacon's claim is that near-total secrecy is nearly always achievable without spending any reputational capital ('no man can be secret, except he give himself a little scope of dissimulation' — so even dissimulation is framed as secrecy's unavoidable minor cost), whereas simulation is a qualitatively larger, riskier spend. Practitioners should default down the ladder (secrecy first) rather than reach for simulation as a first resort."
  - "what's the failure mode? If the reputation for openness is itself insincere or over-claimed (performed rather than earned through a genuine track record), the mechanism collapses on first detection — an observer who catches ONE instance of fabricated openness retroactively re-scans the entire history for prior instances of concealment, and the reputational shield inverts into a magnifier. The mechanism therefore requires the openness to be mostly real, with concealment genuinely rare and reserved, not a performance of openness layered over habitual concealment (which would instead be lex-hfjhy signal-mimicry of a trustworthy signal)."
