canonical-instances:
  - "A person who impulsively sends an angry message describes it afterward as 'my temper got away from me,' treating the temper as an external force that briefly took control, rather than saying they chose to send it while angry."
  - "An employee who repeatedly shows up late blames 'my body clock' or 'my mornings' as though these were separate agents working against their intentions, rather than describing the lateness as a choice about when to go to bed or set an alarm."
critical-questions:
  - "Is there a meaningful difference between genuinely disowning responsibility through this framing and simply using a common, low-stakes figure of speech that doesn't reflect any real belief about agency, and how would an observer distinguish the two in practice?"
  - "Does Radin's developmental reading depend on treating Wakdjunkaga's undifferentiated body as symbolically equivalent to psychological immaturity in a modern person, and is that equivalence something the text supports or something Radin's own theoretical framework imports?"
  - "If externalizing blame onto a body part or impulse is a sign of undeveloped selfhood, what would full acceptance of responsibility look like concretely, and does the Wakdjunkaga cycle ever show him reaching that later, more integrated stage?"
