id: lex-rn9ht
name: hypervigilance
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When threat-perception persists past the threat, the cognitive system is in hypervigilance. Every ambiguous stimulus reads as threat-relevant; the false-positive rate spikes. Don't trust threat-assessments produced in this state without a recalibration."
related: [lex-znaau, lex-k6d7u, lex-we98d, lex-t9fs7, lex-jw34x, lex-u68ue, lex-quu4s, lex-e5des, lex-etdx7, lex-tt38w, lex-gc6ek, lex-uanys, lex-mmq8x, lex-y6xy9]
scaffolds-from: [lex-t9fs7, lex-y6xy9]
evokes: [beck-1979-overvigilance-for-danger, the-alarm-is-worse-than-the-fire, attention-bound-to-danger-signals, ptsd-hyperarousal-symptom, perpetual-environmental-scanning, false-positive-amplification]
lineage:
  - source: primary
    text: beck-1979-cognitive-therapy-and-emotional-disorders
    citation: "Aaron T. Beck, Cognitive Therapy and the Emotional Disorders (Meridian / International Universities Press 1976; Plume reprint 1979) — chapter 6 'The Alarm Is Worse Than the Fire: Anxiety Neurosis' supplies the canonical cognitive-therapy operationalization. Beck uses 'overvigilance' / 'overscanning' rather than the later DSM-adopted term 'hypervigilance' but the cognitive-substrate description is identical: attention-fixation on danger-stimuli at the cost of attention available for everything else"
    quote: "We find that most of the patient's attention is stuck, as it were, on the concept of danger and the perception of 'danger signals.' This attention-binding is manifested by his involuntary preoccupation with danger, overvigilance for stimuli relevant to danger, and overscanning of his subjective feeling. The amount of attention remaining for focusing on specific tasks, recall, or self-reflection is greatly restricted. In other words, because of the fixation of most of his attention on concepts or stimuli relevant to danger, the patient loses most of his ability to shift his voluntary awareness to other internal processes. [Ch.6 — the canonical cognitive operationalization: hypervigilance is an attention-allocation problem, not a perceptual-acuity advantage.]"
  - source: practitioner
    text: wikipedia-hypervigilance
    citation: "Wikipedia 'Hypervigilance' article (en-wp; retrieved via local ZIM dump 2025-12 → local Wikipedia archive, 2026-05-04). Establishes the modern clinical term + operational distinction from related constructs. Hypervigilance differentiated from dysphoric hyperarousal (which involves loss of reality-contact, e.g. PTSD flashbacks); hypervigilance preserves cognitive coherence while maintaining persistent threat-scanning"
    quote: "Hypervigilance is a condition in which the nervous system is inaccurately and rapidly filtering sensory information and the individual is in an enhanced state of sensory sensitivity. ... In hypervigilance, there is a perpetual scanning of the environment to search for sights, sounds, people, behaviors, smells, or anything else that is reminiscent of activity, threat or trauma. The individual is placed on high alert in order to be certain danger is not near. [Wikipedia operational definition — the modern term Beck's 'overvigilance' became.] Hypervigilance is differentiated from dysphoric hyperarousal in that the person remains cogent and aware of their surroundings. In dysphoric hyperarousal, a person with PTSD may lose contact with reality and re-experience the traumatic event verbatim. [Wikipedia — operational distinction from PTSD flashback states.]"
canonical-instances:
  - "the moment after a near-miss when EVERY shadow becomes a threat: just-evaded-car-accident leaves the next 30 minutes of driving with sustained scanning for danger-cues; near-layoff leaves the next month of emails parsed for signs of the next round; near-betrayal leaves the next conversation parsed for inconsistencies. Beck's framing: the attention-binding to danger-stimuli is the primary mechanism, not the threat-detection-acuity itself"
  - "Beck 1979 cognitive operationalization: patient's attention is stuck on the danger-concept; overvigilance for danger-relevant stimuli + overscanning of subjective feeling. The cost is attention NOT available for tasks, recall, or self-reflection — the false-positive cascade comes from attention being so narrowly focused that ambient-cues get over-interpreted as threat-signals"
  - "PTSD hyperarousal symptom (DSM): the canonical clinical case. Combat veteran in civilian setting parsing every loud noise as a potential gunshot; sexual-assault survivor parsing every approaching stranger for predatory intent. The threat-history is real; the over-application to ambient stimuli is the disorder"
  - "after-job-loss vigilance for next round of cuts: hypervigilance scaled to the workplace. Every meeting agenda is scanned for hints of who's next; every Slack message from leadership is parsed for layoff-signals. Cognitive load is high; productive attention is low. The state is maintained even when the danger-period has objectively ended (months past last layoff round)"
  - "obsessive partner / suspicious manager / paranoid administrator: hypervigilance scaled to interpersonal threat-detection. Every text-reply latency is parsed for relationship-status signals; every direct-report's project-update is parsed for hidden agendas. The over-interpretation produces false-positive accusations that themselves erode the relationship and confirm the paranoid prior"
  - "operationally distinct from lex-znaau premature-closure: premature-closure collapses inquiry to one hypothesis prematurely; hypervigilance MAINTAINS one hypothesis (threat-is-imminent) against contrary evidence. Premature-closure is a single-event move; hypervigilance is a sustained posture. They can compose: hypervigilance often manifests as premature-closure on threat-interpretations of ambient cues"
  - "operationally distinct from lex-k6d7u credence-as-graded-belief: credence is graded probability assignment; hypervigilance is binary alarm-state activation that suppresses gradient evaluation. The asymmetry is crucial — hypervigilant subjects don't experience '60% likely danger', they experience 'DANGER' or 'safe', with the threshold for the former dramatically lowered"
  - "operationally adjacent to lex-we98d cognitive-dissonance: 20.3% co-occurrence in score reflects this pattern — when the world contradicts a hypervigilant subject's threat-prior, dissonance fires. The dissonance-resolution typically reinforces hypervigilance ('the absence of evidence is evidence the threat is hidden') rather than relaxing it. Dissonance + hypervigilance compose into a self-stabilizing threat-confirmation loop"
  - "operationally adjacent to lex-t9fs7 confirmation-bias: hypervigilance is confirmation-bias amplified by an alarm-state — search-asymmetry favors threat-confirmation evidence; disconfirming-evidence is interpreted as evidence the threat is hiding. The mechanism produces accumulating false-positives that themselves stabilize the hypervigilant state"
  - "operationally adjacent to lex-jw34x dissonance-driven-identity-defense: when hypervigilance is identity-anchored ('I am the kind of person who sees what others miss'), the threat-predictions become identity-protective. Dropping hypervigilance would require admitting many past threat-detections were false-positives, which threatens the identity. The combination is much harder to budge than either alone"
  - "operationally adjacent to lex-u68ue significance-quest: 23.6% co-occurrence in score reflects the pattern where a felt-significance-loss (humiliation, exclusion, status-threat) is accompanied by hypervigilance for further significance-threats. Significance-quest supplies the motivational substrate; hypervigilance supplies the perceptual-detection apparatus that feeds the quest"
critical-questions:
  - "the protective-vs-pathological discrimination: when does hypervigilance shade from situationally-appropriate to over-applied? In genuinely-dangerous environments (war zones, abusive relationships, operating-room surgery) the same threat-scanning is functional; the disorder is the persistence of the state into post-danger contexts. Practitioner-question: is the threat real and current, recently real but past, or never real? Hypervigilance for past-threats can be lex-fmgeg compensation-outlives-its-cause"
  - "the anxiety-vs-attention-allocation distinction: is hypervigilance reducible to elevated baseline-anxiety, or is it a distinct attention-allocation pattern that anxiety amplifies? Beck 1979 treats them as related but distinguishable — the attention-binding to danger is the cognitive substrate; anxiety is the affective register. Different therapeutic interventions target different layers (attention-training vs anxiety-reduction). Practitioner-discipline: diagnose which is the cardinal layer before deploying intervention"
  - "the cost-of-vigilance accounting: hypervigilance has a measurable cognitive cost — attention bound to threat-detection is attention NOT available for tasks, recall, or relationships. Practitioner-question: what is the hypervigilant subject losing access to, and is the threat-detection benefit larger than that loss? If the threats are infrequent or low-stakes, the vigilance is net-negative even if technically protective"
  - "the self-stabilizing loop check: is hypervigilance self-stabilizing in this case? The pattern often locks in via dissonance-resolution (lex-we98d) + confirmation-bias (lex-t9fs7) + identity-anchoring (lex-jw34x): absence of threat is interpreted as 'the threat is hiding' rather than 'no threat exists,' which confirms hypervigilance was justified. Practitioner-discipline: when assessing whether hypervigilance has become self-sustaining, look for the locking-mechanisms (dissonance-reduction, search-asymmetry, identity-stakes)"
status: active
