  - source: primary
    text: kautilya-arthashastra-ideal-army-never-fully-merged
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Military Organization,' 'The Ideal Army,' editorial summary preceding {8.5.2-20}."
    quote: "'In war, it should never be abandoned, left leaderless or totally merged into someone else's army.'"
canonical-instances:
  - "A small nonprofit joining a large coalition campaign keeps its own donor list, staff reporting lines, and a named subset of its programming entirely under its own control, rather than folding its entire operation into the coalition's shared structure -- so that when the coalition's priorities shift or the campaign ends, the nonprofit still exists as a distinct, functioning organization."
  - "An engineering team seconded to a cross-company joint project insists on keeping its own manager and reporting chain intact rather than being fully reassigned into the partner company's org chart, so that when the joint project concludes, the team returns to its home organization as a coherent unit rather than having quietly become permanent employees of the partner by default."
critical-questions:
  - "does insisting on a separable identity within a joint effort undermine the trust and full commitment that make the collaboration actually work -- do partners who sense you've kept an exit route become less willing to invest fully in the shared work themselves?"
  - "is full merger sometimes genuinely the better choice, when the joint effort's success depends on eliminating exactly the kind of divided loyalty or split command that keeping a separate identity preserves -- does this advice systematically undervalue situations where committing fully is what wins?"
  - "how does a party actually judge, in real time, when ordinary close cooperation has crossed into the kind of full merger this warns against, given that the transition is usually gradual and each individual step of deepening integration looks reasonable on its own?"
