evokes: [americas-test-kitchen, guy-crosby, soaking-vs-rinsing-rice, blown-out-rice, pre-loading-defeats-metering, covered-pot-measured-water]
lineage:
  - source: primary
    text: americas-test-kitchen-crosby-2012-science-of-good-cooking-soaking-rice-takeaway
    citation: "The Editors at America's Test Kitchen and Guy Crosby, The Science of Good Cooking (America's Test Kitchen, 2012), Concept 30, 'Rinsing (Not Soaking) Makes Rice Fluffy,' p. 1083."
    quote: "“To be frank, soaking was a waste of time. Even with brown rice, which, with its bran, germ, and aleurone layers intact, can take two to three times longer to cook than white rice, the results were overly tender and unpleasant. Soaking caused the rice to absorb too much water, which in turn caused the starch granules to swell as soon as the heat was applied.”"
canonical-instances:
  - "The direct textual anchor: the failure wasn't confined to one rice variety -- 'Every single variety of rice that had been soaked was overcooked and bloated, with grains that tended to blow out,' tested across brown rice, long-grain white rice, and basmati, so the mechanism tracks the shared resource (water) rather than any single grain's particular starch profile."
  - "Hypothetical: an onboarding manager, meaning to help a new hire 'start strong,' hands over the answer key to their first skills test ahead of time. The whole point of that test was measuring how much training the person still needed. Handing over the answers first breaks the measurement: the calibration now reports full readiness the person doesn't have, and they get assigned work they can't yet do."
critical-questions:
  - "Does this require the pre-loaded quantity to be literally identical to what the downstream process meters (water added by soaking, water absorbed by cooking), or does a merely comparable substitute for the metered resource produce the same overshoot?"
  - "Rinsing, the text's endorsed alternative for long-grain rice, works on surface starch instead of water volume. Testing found it harmless for brown rice, whose intact bran leaves no surface starch behind to rinse away. Does that mean any pre-step leaving the metered resource untouched is safe by default, or could a pre-step interact with the controlled process through some other channel this case doesn't surface?"
