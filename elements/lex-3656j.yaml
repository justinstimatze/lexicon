lineage:
  - source: primary
    text: BergerLuckmann-1966-1991-SocialConstructionOfReality
    citation: "Peter L. Berger + Thomas Luckmann, *The Social Construction of Reality: A Treatise in the Sociology of Knowledge* (Doubleday 1966; reissued Penguin 1991). The foundational text articulating the institution-production cycle: habitualization → reciprocal typification → objectivation → legitimation → internalization. Berger + Luckmann integrate three theoretical streams: (i) Durkheim's claim that social facts are objective realities sui generis; (ii) Weber's claim that subjective meanings constitute social reality; (iii) Mead + symbolic interactionism on the social production of self. The book's transferable contribution is the specific articulation of the institution-production cycle + the critical claim that the primary social-control of institutions is through their TAKEN-FOR-GRANTEDNESS rather than external sanctions. The framework has been productively extended across organizational studies (Meyer + Rowan 1977 *Institutionalized Organizations*; DiMaggio + Powell 1983 *Iron Cage Revisited*; Scott 1995 *Institutions and Organizations*); science studies (Latour + Woolgar 1979 *Laboratory Life*; Hacking 1999 *Social Construction of What?*); gender studies (West + Zimmerman 1987 *Doing Gender* extends Berger-Luckmann to gender; Butler 1990 *Gender Trouble* further specializes to performativity); ethnomethodology + conversation analysis (Sacks-Schegloff-Jefferson 1974 + extensive subsequent literature); race studies (Omi + Winant 1986 *Racial Formation in the United States*); + AI-system + algorithm studies (Bowker + Star 1999 *Sorting Things Out*; Crawford 2021 *Atlas of AI*). The atom encodes the structural primitive — institutional reality is produced through habituation + reciprocal typification, then objectivated + taken-for-granted — separately from Berger-Luckmann's specific 1960s framing. Debunking check applied: the strong version of social-constructionism has been substantially debated in philosophy (Hacking 1999 *Social Construction of What?* offers a nuanced taxonomy of weaker + stronger claims; Searle 1995 *The Construction of Social Reality* offers a different formal-ontology approach). The STRUCTURAL CLAIM about institutional reality being produced through habituation + reciprocal typification is well-attested across organizational studies + ethnomethodology + science studies; even critics of strong-constructionism accept the structural-process claim separately from metaphysical questions. The atom encodes the process, not the metaphysics."
    quote: "[Berger-Luckmann 1966 Ch.II.1 `Institutionalization`, the pivotal habitualization-to-institution passage:] 'All human activity is subject to habitualization. Any action that is repeated frequently becomes cast into a pattern, which can then be reproduced with an economy of effort and which, ipso facto, is apprehended by its performer as that pattern.' [On reciprocal typification as the institution-producing step:] 'Institutionalization occurs whenever there is a reciprocal typification of habitualized actions by types of actors. Put differently, any such typification is an institution. What must be stressed is the reciprocity of institutional typifications and the typicality of not only the actions but also the actors in institutions. The typifications of habitualized actions that constitute institutions are always shared ones. They are available to all members of the particular social group in question, and the institution itself typifies individual actors as well as individual actions. The institution posits that actions of type X will be performed by actors of type X.' [On the key claim that institutions exercise PRIMARY social-control through taken-for-grantedness, not through sanctions:] 'Institutions also, by the very fact of their existence, control human conduct by setting up predefined patterns of conduct, which channel it in one direction as against the many other directions that would theoretically be possible. It is important to stress that this controlling character is inherent in institutionalization as such, prior to or apart from any mechanisms of sanctions specifically set up to support an institution. These mechanisms... do, of course, exist in many institutions and in all the agglomerations of institutions that we call societies. Their controlling efficacy, however, is of a secondary or supplementary kind. As we shall see again later, the primary social control is given in the existence of an institution as such. To say that a segment of human activity has been institutionalized is already to say that this segment of human activity has been subsumed under social control. Additional control mechanisms are required only in so far as the processes of institutionalization are less than completely successful.' [On the historicity of institutions:] 'Institutions further imply historicity and control. Reciprocal typifications of actions are built up in the course of a shared history. They cannot be created instantaneously. Institutions always have a history, of which they are the products. It is impossible to understand an institution adequately without an understanding of the historical process in which it was produced.' [Practitioner-extraction for transferable lex-3656j: institutional reality is PRODUCED through the cycle habitualization → reciprocal typification → historical accretion → objectivation → legitimation → internalization. The PRIMARY social-control mechanism is taken-for-grantedness, not external sanctions. The framework generalizes to workplace roles, professional norms, family structures, regulatory regimes, conversational conventions, and AI-system categories.]"
  - source: cross-attestation
    text: cross-domain-institutional-production-via-typification
    citation: "Cross-domain attestation that institutional reality production via habituation + reciprocal typification recurs across organizational studies, science studies, gender studies, race studies, ethnomethodology + conversation analysis, and AI-system + algorithm studies. (a) Organizational studies: Meyer + Rowan 1977 *Institutionalized Organizations: Formal Structure as Myth and Ceremony* + DiMaggio + Powell 1983 *The Iron Cage Revisited: Institutional Isomorphism* + Scott 1995 *Institutions and Organizations* document the institutional-production cycle for formal organizations + show how isomorphism produces field-wide taken-for-granted templates. (b) Science studies: Latour + Woolgar 1979 *Laboratory Life: The Social Construction of Scientific Facts* documents the production of scientific facts through laboratory typifications + literary practices; Hacking 1999 *The Social Construction of What?* offers a nuanced taxonomy distinguishing weak + strong constructionist claims. (c) Gender studies: West + Zimmerman 1987 *Doing Gender* explicitly extends Berger-Luckmann to gender (the doing-vs-being distinction); Butler 1990 *Gender Trouble* (lex-y2tbg substrate-grounded) specializes to performativity. (d) Race studies: Omi + Winant 1986 *Racial Formation in the United States* documents racial categories as institutional products of historical political-economic processes, not pre-existing biological categories. (e) Ethnomethodology + conversation analysis: Sacks-Schegloff-Jefferson 1974 *A Simplest Systematics for the Organization of Turn-Taking* + extensive subsequent literature documents conversational norms as institutional products produced through reciprocal typification. (f) AI-system + algorithm studies: Bowker + Star 1999 *Sorting Things Out: Classification and Its Consequences* documents how classification systems (medical, demographic, scientific) are institutional products that come to appear as natural; Crawford 2021 *Atlas of AI* documents how AI-system categories (training data labels, model evaluation benchmarks, capability definitions) are institutional products of specific historical practices. (g) Software engineering: agile + scrum + DevOps practices are explicit instances of institutional production through habituation + reciprocal typification (sprints + retros + standups become typified + then taken-for-granted as `how software gets built`). The cross-domain attestation establishes the transferable structural form: shared institutional reality is produced through habituation + reciprocal typification, then objectivated + taken-for-granted; the production process is the foundation of social control."
    quote: "Across organizational studies (Meyer-Rowan 1977, DiMaggio-Powell 1983, Scott 1995), science studies (Latour-Woolgar 1979, Hacking 1999), gender studies (West-Zimmerman 1987, Butler 1990), race studies (Omi-Winant 1986), ethnomethodology (Sacks-Schegloff-Jefferson 1974), AI-system + algorithm studies (Bowker-Star 1999, Crawford 2021), and software engineering practice (agile + scrum), the same structural form recurs — shared institutional reality is produced through habituation + reciprocal typification, then objectivated + taken-for-granted. The transferable diagnostic: name the habitualization-typification-internalization process; ask whose actions reciprocally typified the institution into existence + when; recognize that what seems objective is the product of specific historical practice."
canonical-instances:
  - "Berger-Luckmann's canonical thought-experiment (Ch.II.1): two individuals A + B from different social worlds begin to interact + observe each other; typifications form quickly (`Aha, there he goes again`); reciprocal typification produces incipient institutionalization even with only two actors. The institution becomes fully objective when transmitted to new members through socialization."
  - "Berger-Luckmann's incest-taboo example: the controlling power of the incest taboo is NOT primarily through the threat of beheading; it is through the taboo's existence-as-taken-for-granted in the institutionalized sexual practice of the society. Beheading is backup when institutionalization is less than completely successful."
  - "Workplace role institutions in tech (engineering manager, product manager, designer, SRE): the role categories appear objective + given to participants but are historically-specific institutional products of the post-2000 tech-industry institutional production cycle. The distinctions vary substantially across companies + were quite different in the 1990s."
  - "Software-development methodology institutions (agile, scrum, kanban, DevOps): each is an institutional product of specific historical practices. Sprints + retros + standups + sprint reviews become typified + reciprocally-enforced + then taken-for-granted as `how software development works`. The taken-for-grantedness is the primary mechanism by which the methodology shapes work."
  - "Scientific peer review + citation practices: these conversational + textual conventions are institutional products of specific historical practices in the 17th-c emerging scientific community. They appear to working researchers as objective features of `how science works`; they are historically-specific institutional products."
  - "Family + kinship structures: nuclear family, extended kin networks, chosen family in queer communities, fictive kin in caregiving relationships — all institutional products that appear objective within their contexts. Composes with lex-d73nj (Beauvoir immanence-transcendence partition under gender hierarchy)."
  - "AI-system institutions: model cards, safety evaluations, capability benchmarks, alignment taxonomies are recent institutional products being typified + objectivated through the practice of AI safety teams + AI ethics literature post-2018. Within a decade they will likely appear as objective features of `how AI gets built` to participants who entered the field after the institutionalization."
  - "Conversational + interactional norms (Sacks-Schegloff-Jefferson 1974 + subsequent CA literature): turn-taking, repair sequences, openings + closings of conversations are institutional products of specific cultural-historical practices. They appear to speakers as natural features of conversation; they are institutional products produced through reciprocal typification."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition-not-its-cause (Butler 1990): Butler's claim is specifically about gender + the performative-doing-constitutes-being mechanism. lex-3656j is the broader institutional-production process of which lex-y2tbg is a specialization. Compose: lex-3656j names the general institution-production primitive; lex-y2tbg specializes to gender + adds the performative-doing-constitutes-being claim."
  - "operationally distinct from lex-jd7fe enduring-power-reproduces-through-cultural-consent-with-coercion-in-reserve (Gramsci): Gramsci's claim is specifically about the cultural-reproduction of POWER RELATIONS. lex-3656j is the broader institutional-production process that operates at all institutions (including non-hegemonic ones — e.g., conversational turn-taking + scientific peer review have no obvious power-asymmetry). Compose: lex-3656j names the general primitive; lex-jd7fe specializes to power-reproduction."
  - "operationally distinct from lex-kj6tj democratic-consent-sustains-rather-than-constrains-soft-administrative-tutelage (Tocqueville): lex-kj6tj is a specific failure mode of democratic-administrative institutions. lex-3656j is the general institution-production primitive. Compose: democratic-administrative institutions are produced via the lex-3656j cycle + can develop the lex-kj6tj failure mode."
  - "operationally distinct from lex-d73nj othering-pairs-subordinate-immanence-with-dominant-transcendence (Beauvoir): lex-d73nj is the asymmetric immanence/transcendence partition under hierarchy. lex-3656j is the institutional-production process by which the partition becomes objectivated + taken-for-granted. They compose."
  - "operationally distinct from lex-x9sda category-boundary-position-generates-contradiction-tolerance-and-third-element-synthesis (Anzaldua): lex-x9sda is about the cognitive mode of boundary-occupants. lex-3656j is about the production-process of the categories themselves. They compose: boundary-occupants are positioned relative to institutionally-produced categories."
critical-questions:
  - "Does the atom commit to strong social constructionism (everything is socially constructed; nothing is real outside of human practice)? No. The atom names a STRUCTURAL PROCESS by which institutional reality is produced — workplace roles, regulatory categories, conversational norms — that is well-attested independently of metaphysical claims. Hacking 1999 *Social Construction of What?* offers nuanced distinction between weaker + stronger claims; the atom is compatible with weaker forms. Some things in the world are mind-independent (physical regularities, biological constraints); the atom claims that INSTITUTIONS — patterned social action + the categories that constitute them — are produced through the habitualization-typification cycle, not pre-given."
  - "Could the atom be misused to argue that institutions can be changed simply by ceasing to enact them? No — and this is a common misuse pattern. The discipline against this: institutions are stabilized by HISTORICAL ACCRETION + RECIPROCITY + INTERNALIZATION of new members through primary socialization. Once an institution is established + transmitted, individual non-participation has limited effect; coordinated collective change in habitualized practice is what shifts institutions. Material conditions + power asymmetries also matter (see Gramsci lex-jd7fe)."
  - "How does the atom apply when participants in an institution are unaware of its constructed character? The atom claims this is the NORMAL CONDITION — institutions are MORE EFFECTIVE when participants take them as objective + given. Awareness of constructed character is rare + often produced by boundary-occupancy (lex-x9sda), by historical change (the institution that was taken-for-granted in 1950 was visibly absent in 1850), or by deliberate denaturalization (the move ethnomethodology + CA make for analytical purposes)."
  - "Does the atom apply to natural-kind categories (electron, gene, mountain)? Carefully. Natural-kind categories have a MIXED character: they refer to mind-independent regularities + are also instituted through scientific practice (Hacking 1999 distinguishes `indifferent kinds` like electron from `interactive kinds` like child-abuser where the category interacts with classified individuals). The atom most cleanly applies to interactive kinds — institutional categories that constitute their referents. Natural-kind categories like electron are partially produced through scientific practice (the term + measurement-procedures + theoretical embedding) while referring to mind-independent regularities."
  - "How does the atom apply to AI-system categorization (model size, capability benchmark, training-data taxonomy)? The structural form applies. AI-system categories are recent institutional products being typified + objectivated through current practice. Within a decade they will likely appear as objective features of `how AI gets built` to participants who entered the field after the institutionalization. The atom names the production mechanism; future research can examine which AI-system categories track mind-independent regularities (e.g., parameter count, training compute) vs which are institutional artifacts (e.g., capability benchmark categories, alignment taxonomies)."
