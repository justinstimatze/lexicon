id: lex-vqx8x
name: cargoism-faith-in-rescue-without-the-mechanism
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Apply this when a system facing a resource shortfall, capability gap, or looming constraint responds with confident faith that a future breakthrough will resolve it, rather than with an account of the causal mechanism that would actually produce the resolution. Catton names the pattern CARGOISM after Melanesian cargo cults: islanders who watched Europeans receive abundant manufactured goods (via ships) had no visibility into the production process (factories, labor, trade) that generated those goods. Lacking that causal model, the plausible-seeming inference was that the cargo arrived through some ritual or entitlement the Europeans possessed, not through a reproducible chain of production — so cargo cults built wharves and warehouses to receive an expected shipment, and performed the rituals they associated with the Europeans' arrival, rather than reproducing the actual production chain (which they had never seen and could not see). Catton's diagnostic move is to show the SAME STRUCTURE recurring in advanced industrial societies confronting resource depletion: 'the modern Cargoist who expects to be bailed out of this year's ecological predicament by next year's technological breakthrough holds similar beliefs because of his inadequate knowledge of ecology and of technology's role in it. Both Cargoist faiths rest upon the quicksand of fundamental ignorance lubricated by superficial knowledge.' The specific failure is not generic optimism or generic technology-worship; it is a MISREADING OF THE PAST MECHANISM: past abundance (fossil-fuel-financed industrial growth, in Catton's case — see lex-t42fr) is remembered as evidence of an ongoing, repeatable process called 'progress,' when the actual mechanism was a one-time, non-repeatable draw against a finite stock. Cargoism takes naive statistical extrapolation — treating past breakthroughs as a representative sample of an inherently unending series — as a substitute for asking what specifically produced the last breakthrough and whether that specific producing-condition can recur. The tell is behavioral, not just attitudinal: like the islanders' wharves and warehouses, modern Cargoism shows up as REAL INSTITUTIONAL INVESTMENT staged in expectation of a rescue whose causal path has not been specified — infrastructure, policy, and funding built to receive a solution before anyone can say what would have to be true for that solution to actually arrive. Practitioner diagnostic: when a plan for resolving a resource, capacity, or capability shortfall rests on 'something will come through' (a technological breakthrough, a market correction, a policy fix, a research advance), ask two separable questions rather than folding them into one optimism-vs-pessimism debate: (1) is there a NAMED, SPECIFIC causal mechanism that would produce the rescue, distinguishable from vague appeal to the historical trend-line, and (2) does the mechanism that produced past instances of this kind of rescue still have the SAME PRECONDITIONS available now, or was the past instance itself a one-time draw (like discovering a new continent, or a finite deposit) that cannot simply recur on schedule? A plan that fails question (1) is faith; a plan that fails question (2) is cargoism specifically — faith dressed in the language of extrapolated technological confidence rather than religious language, but structurally the same expectation of unearned rescue."
