id: lex-kpvn6
name: two-parties-swap-which-domain-each-must-compete-in
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "In a relationship built on unequal access to two different domains -- one relational, one material -- each party's route to security in their own domain can get rerouted through the other domain instead. One party starts competing for material security using relational currency: charm, devotion, presence. The other starts competing for a relational outcome using material currency: gifts, provision, purchasing power. Neither behavior is what their own domain rewards, and both domains end up distorted by carrying a competition that doesn't belong to them. Gilman names the swap directly: 'She gets her living by getting a husband. He gets his wife by getting a living. It is to her individual economic advantage to secure a mate. It is to his individual sex-advantage to secure economic gain. The sex-functions to her have become economic functions. Economic functions to him have become sex-functions.'"
related: []
evokes: [women-and-economics, chapter-vi, she-gets-her-living-by-getting-a-husband, the-sex-functions-to-her-have-become-economic-functions, domains-trade-what-each-must-compete-for]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-vi
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter VI. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "On the woman's side we are steadily maintaining the force of primitive individual competition in the world as against the tendency of social progress to develope co-operation in its place, and this tendency of course is inherited by their sons. On the man's side the same effect is produced through another feature of the relation. The tendency to individualism with sex-advantage is developed in man by an opposite process to that operating on the woman. She gets her living by getting a husband. He gets his wife by getting a living. It is to her individual economic advantage to secure a mate. It is to his individual sex-advantage to secure economic gain. The sex-functions to her have become economic functions. Economic functions to him have become sex-functions. This has confounded our natural economic competition, inevitably growing into economic co-operation, with the element of sex-competition,--an entirely different force."
canonical-instances:
  - "In an unequal partnership between a wealthy patron and a struggling artist, the artist ends up competing socially -- charm, flattery, availability -- to secure funding, while the patron ends up competing financially -- gifts, generosity -- to secure the artist's continued personal attention. Neither is competing on the merits their own domain would otherwise reward."
  - "In a company where junior staff depend entirely on one senior sponsor for advancement, junior staff compete relationally -- loyalty, deference, personal rapport -- to get promoted, while the sponsor competes materially -- perks, favors, protection -- to keep favored juniors loyal, so promotion decisions stop tracking either work quality or genuine mentorship value."
  - "In a caregiving arrangement where one adult child is financially dependent on an aging parent, the child competes relationally against siblings -- visits, attentiveness, expressed devotion -- to stay in the parent's favor and secure continued support, while the parent uses material control -- the inheritance, the allowance -- to secure the attention and companionship they actually want."
critical-questions:
  - "Is this swap a fixed structural consequence of the underlying dependency, or could the same dependency exist without either party's competitive behavior migrating into the other's domain -- what specifically forces the crossover rather than each party simply competing openly within their own domain?"
  - "Gilman treats the swap as symmetric and mutually distorting, but are the costs actually symmetric -- does one party's domain typically suffer more distortion than the other's, given that the two domains don't carry equal weight in the relationship to begin with?"
  - "If the material dependency that drives the swap were removed, would the relational domain automatically revert to its own proper criteria, or has the crossover itself become self-sustaining, continuing to shape how each party competes even after the original asymmetry that caused it is gone?"
status: active
