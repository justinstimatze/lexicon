    text: stoll-1989-cuckoos-egg-correlation-analysis-phone-bills
    citation: "Clifford Stoll, The Cuckoo's Egg (Doubleday, 1989). Nonfiction memoir; in-copyright, quoted here under fair use in short, attributed excerpt for critical/analytical commentary. Stoll analyzing six months of a Mitre Corporation facility's long-distance phone bills — records kept purely for billing purposes, unrelated to the investigation — to reconstruct the hacker's full footprint across systems his own compromised host never logged."
    quote: "In physics, this is correlation analysis. If you see a solar flare today and tonight there's a bright aurora, chances are that these are correlated. [...] Well, here were six months of phone bills. Dates, times, phone numbers, and cities."
canonical-instances:
  - "Stoll's use of Mitre's phone bills in The Cuckoo's Egg: the compromised computers kept no record of the hacker's other calls, but correlating call timestamps against a known anchor event (a confirmed call to the Anniston Army base) reconstructs a footprint across a dozen systems none of them individually recorded."
  - "digital-forensics 'parallel construction': credit-card transaction records, toll-booth or license-plate-reader logs, and cell-tower pings — none kept for investigative purposes — become the reconstructive backbone of a timeline when the primary system under investigation was never designed to log the activity itself."
  - "historical reconstruction from incidental records: ration-book issuance logs or utility-meter readings, kept for entirely bureaucratic reasons, become the only surviving evidence of population movements or activity levels in periods where direct records were suppressed or never made."
critical-questions:
  - "how does this differ from lex-cpjma (triangulation-of-independent-methods)? lex-cpjma is about cross-checking a finding using multiple independent analytic METHODS that don't share failure modes (a randomized trial vs an observational study). This atom is about a specific DATA-SOURCE move: recruiting a record that was never designed as evidence at all, kept by an uninvolved third party for an unrelated administrative purpose. The two can compose — the phone-bill correlation is itself one 'method' that could later be triangulated against another — but this atom's distinguishing claim is about where the record comes from and why it exists, not about method-independence for confirming a result."
  - "how does this differ from lex-w97xs (spatial-mapping-reveals-causation-invisible-to-aggregate-statistics, Snow's cholera map)? lex-w97xs is a specific representational move: plotting existing case data spatially to reveal a pattern aggregate statistics hide. This atom is about sourcing a dataset the investigator doesn't yet have, from a party with zero investigative interest in the case, whose records are trustworthy precisely because they were never curated with the investigation in mind. Snow's move transforms data already in hand; this atom's move is locating data held by someone with no reason to have altered it."
  - "doesn't this require getting lucky that a third party happens to keep the right record? Partly — but the atom's operational content is the search heuristic it implies: when the primary system has no record of an actor's actions, ask what OTHER system, kept by an uninvolved party for a completely different purpose, would have incidentally logged a side-effect of the same actions (a phone call placed, a badge swipe, a toll paid). The record's forensic value comes from its administrative disinterest, not from any design intent to be useful as evidence."
