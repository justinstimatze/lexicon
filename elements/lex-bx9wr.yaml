id: lex-bx9wr
name: withholding-comfort-from-a-grieving-loved-one-preserves-a-plan-that-benefits-them
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Recognizing that revealing the truth now, even to comfort someone whose distress a single sentence could end, would void a long plan that ultimately serves their own good, a person can choose to let the visible suffering continue rather than break cover prematurely. In the Jataka''s tale of Temiya, watching his mother weep as he is carried off to a staged execution he engineered to escape a corrupting throne, the prince reasons through the tradeoff explicitly rather than acting on the pull to comfort her: "Then the Bodhisatta looked at her and considered, ''If I do not speak she will die of a broken heart,'' but though he desired to speak, he reflected, ''If I speak, my efforts for sixteen years will be rendered fruitless; but if I do not speak, I shall be the saving of myself and my parents.''"'
related: []
evokes: [jataka, mahanipata, muga-pakkha-jataka, temiya-jataka, withheld-disclosure, delayed-relief-for-a-greater-good]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-muga-pakkha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 538, Muga-Pakkha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Then the Bodhisatta looked at her and considered, \"If I do not speak she will die of a broken heart,\" but though he desired to speak, he reflected, \"If I speak, my efforts for sixteen years will be rendered fruitless; but if I do not speak, I shall be the saving of myself and my parents.\""
canonical-instances:
  - "A whistleblower who has spent a year building an airtight fraud case says nothing when a colleague is unfairly blamed for one piece of it in a meeting, reasoning that defending them now would tip off the target before the case is filed, even though staying silent means watching the colleague take a hit they don't deserve."
  - "A surprise-party organizer lets a spouse spend the whole afternoon convinced their partner has forgotten their birthday, watching real hurt build, because revealing the plan to stop the hurt early would also cancel the party."
critical-questions:
  - "The Bodhisatta reasons this out in a single moment under extreme pressure — how much of this move's coherence depends on there being a genuinely fixed, near endpoint to the withheld comfort, versus a plan that could always be 'almost done' indefinitely?"
  - "Does the withheld truth ultimately serving the grieving person's own interest, not just the withholder's, change the ethics of the silence, or is causing someone real pain without their consent wrong regardless of the eventual payoff to them specifically?"
status: active
