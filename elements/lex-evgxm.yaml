id: lex-evgxm
name: verify-the-presupposition-before-building-on-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when a question, prompt, or conversational turn treats a factual claim as already settled — a stated fact, a definition, a figure, or a premise you are implicitly asked to build your answer on top of. Before answering, check whether that claim is actually true. If it holds, accept it and answer normally, without manufacturing doubt about it. If it is false or inaccurate, say so plainly, supply the correct fact, and then answer based on the correction rather than the false premise. The check must be genuinely TWO-SIDED: a sibling empirical-testing project's dose-response study on a weak open model (Apertus-1.5-8B, the low-capability end of the curve) found that a one-directional 'hunt for false premises' instruction is unsafe by itself — discriminating power has to run in both directions, correctly accepting true premises as often as it correctly catches false ones, or the fix trades one failure mode (accepting false premises) for another (contesting true ones — over-hedging, manufactured skepticism). The empirical result: plain and uninstructed, the weak model caught only 62% of smuggled-in false premises while never false-flagging a true one (0%) — a clean discrimination failure in one direction only, not a general hedging problem. Injecting the balanced check-before-building instruction raised the false-premise catch rate to 92% while the false-flag rate on true premises rose only to 4% (1 miscall in 24), and overall task accuracy rose from 81% to 94%. Spot-checked transcripts confirmed genuine corrections ('Istanbul is not the capital; Ankara is. However, since you're visiting...') rather than grader leniency, and the single false-flag was a defensible pedantic dispute (contesting 'sharks are fish' on cartilaginous-vs-bony technical grounds) — the exact failure direction the balance discipline is meant to catch, occurring at low but nonzero rate. This belongs to a broader class of DISPOSITIONAL traps: failures that persist even as raw model capability scales, unlike traps a bigger model or more computation alone closes. A false, confidently-stated premise embedded in an otherwise-answerable question is exactly this kind of trap — a competent-but-undisciplined reasoner has the raw ability to notice the error, but nothing in the fluent completion of the question prompts a pause to check it; the fix is procedural (fire the check at the right point in the response) rather than a capability upgrade. Portable beyond LLM evaluation: a human expert fielding a question, a support agent, a journalist facing a leading interview question, or a consultant handed a brief that states 'given that X is true...' faces the identical two-sided task — verify X before building an answer on it, correct plainly if X is false, but do not manufacture doubt about X merely because checking has become habitual. Recognize this whenever a question or brief is phrased in a way that treats something as agreed, known, or given, and you are about to answer inside that frame rather than first testing whether the frame itself holds."
related: [lex-vsede, lex-jv983, lex-t9fs7]
evokes: [false-presupposition, dispositional-trap, balanced-two-sided-check, weak-model-lift, smuggled-premise, correct-then-answer, over-hedging-failure-mode, scrutiny-trigger, sharks-are-fish-false-flag]
