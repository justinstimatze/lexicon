evokes: [progressive-solemnization-of-prognostic-accounts, dying-will-have-been-seen-as-having-gone-on-beforehand, always-to-the-physicians-advantage, we-have-done-all-we-can]
lineage:
  - source: primary
    text: sudnow-1967-passing-on-progressive-solemnization
    citation: "David Sudnow, Passing On: The Social Organization of Dying (Prentice-Hall, 1967), Chapter 4 'Death and Dying as Social States of Affairs,' on physicians' gradual, temporally-staged escalation of prognostic language at County Hospital and its outcome-independent payoff structure."
    quote: "The progressive solemnization of prognostic accounts as the patient's condition deteriorates goes as follows: on early days of admission of the patient who is considered as a possible eventual death, he is talked of as \"in serious condition\"; as his death becomes considered more immediately imminent, references to its being \"a matter of time\" are made. References to \"dying\" are cautiously made— and only when the final moments are considered at hand. The use of such phrases as \"only time will tell,\" \"we've done all we can,\" \"it's just a matter of waiting to let nature take its course,\" \"there's no telling now,\" etc., provide that should the patient die, \"dying\" will have been seen as having gone on beforehand. At the same time, should the patient live through the admission, the doctor's competence is not thrown into question, but perhaps enhanced. It is always to the physician's advantage to portray the situation as slightly more serious than he feels it is, so long as its seriousness is not taken or proposed as a warrant for treating \"palliatively.\""
canonical-instances:
  - "a County physician who moves a patient's description from 'in serious condition' to 'a matter of time' to guarded silence over successive days without ever naming a date or a firm prognosis — vindicated if the patient dies (foreseen), unquestioned if the patient lives (prudent caution, not error)."
  - "a project status report that escalates from 'on track' to 'monitoring closely' to 'elevated risk' across sprints without ever committing to a specific slip date, so that either a late ship or an on-time ship reads as consistent with the reporting."
  - "market-outlook commentary that darkens in tone ahead of a possible downturn without ever issuing a dated, falsifiable call, positioning the commentator to claim foresight if the downturn happens and prudence if it doesn't."
critical-questions:
  - "isn't genuine uncertainty a legitimate reason to hedge language as new evidence arrives, rather than commit early to a claim that might be wrong? Yes — legitimate hedging updates language IN STEP WITH new evidence and remains falsifiable at each step (a real prediction interval, a real confidence level). This atom names the narrower case where the escalation ladder is calibrated to protect the forecaster's credibility under EITHER outcome rather than to communicate a falsifiable estimate — the tell is that no single statement in the sequence, checked against either final outcome, would count as having been wrong."
  - "how does this differ from lex-vkhp7 outcome-knowledge-retroactively-inflates-the-perceived-prior-probability-of-the-known-outcome (hindsight bias)? lex-vkhp7 is a JUDGE's cognitive distortion after the fact — an observer's own memory of their prior credence gets contaminated by later outcome-knowledge. This atom is a FORECASTER's deliberate or habitual language STRATEGY chosen in advance, built to be validated by either branch — it doesn't require anyone's memory to be distorted; the language itself is engineered for outcome-independent vindication. They can compose: the escalating hedge makes hindsight bias easier for observers to fall into, since the language genuinely did track the outcome loosely."
  - "how does this differ from lex-9ty22 strategic-ambiguity? lex-9ty22 lets a SINGLE vague statement be heard differently by different audiences at the SAME TIME (a CEO's message read one way by engineering, another by finance). This atom is about a SEQUENCE of statements escalating over TIME to a SINGLE audience, engineered so that whichever of two future outcomes occurs, the sequence reads as having anticipated it. Ambiguity splits an audience; progressive solemnization splits a timeline."
