# plausible-deniability

A cognitive move that produces a *posture* in which a claim has been
asserted (or an action has been taken) but the asserter retains the
ability to *retrospectively* disclaim authorship, intent, or
knowledge if the claim is challenged.

The atom's roadening (canonical-instances 4-6) extends the
pattern to cover sincere-performance disavowal — the asserter
genuinely believes the not-doing performance, not maintaining it as
a retreat option. The Schelling-style engineered/retrospective cases
(1-3) and the Friday/Nietzsche/CSR sincere-performance cases (4-6)
share the same operational structure (a gap between what is done
and what is acknowledged, maintained through ritual framing) but
differ in whether the actor is aware of the gap.

## Distinct from neighbors

- **strategic-ambiguity** (mining target, see signaling-deception-
  mining-pass-1.md) is *prospective non-commitment*: the asserter
  refuses to disambiguate so multiple audiences each take the
  favorable reading. Deniability is *retrospective disclaimability*:
  the asserter has committed *enough* to be heard, but engineered
  the commitment to be retractable later. Different operational
  shapes; different defeaters.
- **lex-chp44 meta-pointer** is a structural primitive about
  pointing-to-the-pointing (state → frame). Plausible-deniability
  *uses* meta-pointing as one of its vehicles ("I'm just relaying
  what others said") but is not reducible to it; many deniability
  moves don't go meta.
- **lex-q9asc source-attribution** (claim → frame) is the
  metadata-attaching primitive. Deniability often piggybacks on
  source-attribution ("I'm just citing X") but the attribution can
  be honest while the deniability move is operating; orthogonal axes.
- **lex-k2kdc constitutive-defense-when-the-defense-generates-the-threat**
  is the system-topological frame within which sincere-performance
  disavowal is one of the self-sustaining mechanisms. lex-xrg6e
  captures the cognitive-tier mechanism (both engineered and
  sincere-performance variants); lex-k2kdc names the system-tier
  consequence (the feedback loop the disavowal protects from
  recognition).

## Critical questions (atomic-tier; rough — no Walton scheme yet)

- Was the asserter's later disavowal pre-engineered, or is it an
  honest reassessment? (deniability collapses if the disavowal was
  unprepared at the time of assertion)
- Did the assertion carry enough commitment-weight to count as
  asserted, or was it pre-deflated to the point of not being a claim?
  (deniability requires asymmetry: heard as commitment, defended as
  non-commitment)
- Is the asymmetry between asserter-side and audience-side framing
  indispensable? If the asserter would be content to either get the
  claim taken seriously or have it dismissed, the move is
  strategic-ambiguity, not plausible-deniability.
- Engineered-retrospective or sincere-performance? Schelling-style
  cases (1-3) involve deliberate setup-for-disclaim; Friday/Nietzsche/
  CSR cases (4-6) involve actors who genuinely believe the not-doing
  performance. Diagnostic asymmetry: engineered cases collapse when
  the deliberate setup is named; sincere-performance cases collapse
  when the actor recognizes the gap themselves, but may reconstitute
  at a meta-level ("I'm being honest about my disavowal, which counts
  as honesty") rather than dissolving entirely.
- The legibility-trap risk: naming the disavowal can destroy social
  relationships that depended on it functioning. In asymmetric power
  contexts, naming can be dangerous for the person who names. Weil-
  check: does naming serve the dignity of those harmed by the
  disavowal, or does it serve the pleasure of the person doing the
  naming?
- The meta-disavowal trap: "I know I'm disavowing, and that self-
  awareness counts as honesty" is a higher-order reconstitution of
  the same mechanism. Self-awareness of the disavowal does not
  automatically dissolve it; it can become the new disavowal layer
  ("I am so honest about my disavowals" — performance of meta-honesty
  while still operating the underlying gap).

