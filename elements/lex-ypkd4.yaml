id: lex-ypkd4
name: co-locating-a-specialist-converts-referral-into-consultation
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When you want a generalist to keep a case rather than hand it off to a specialist, don't rely on policy encouraging consultation over referral — physically place a specialist inside the generalist's own workspace, part-time if necessary, and the handoff mode shifts on its own, driven by proximity rather than instruction. Olencki quantifies the effect starkly by comparing specialties that did and didn't have a consultant embedded in the General Medical Clinic: 'consultations were most likely to result when aid was sought from departments which had consultants working within the General Medical Clinic... in 157 surgical cases not handled alone by the student and his instructor, 80 per cent were dealt with in the General Medical Clinic by the consultant in surgery, and only 20 per cent were referred to another clinic.' The contrast case, a specialty with no embedded presence, shows nearly the opposite ratio: 'This might be contrasted with cases requiring assistance from the Ear, Nose, and Throat Department, which had neither a consultant in the General Medical Clinic nor any particular arrangements for consultation. In 182 ear, nose, and throat cases not handled by the student alone, only 1 per cent ever had a consultation; the other 99 per cent were referred to the Ear, Nose, and Throat Clinic.' The pattern held across every specialty she checked, not just this one contrast: departments with a part-time consultant present in the generalist's own clinic (Surgery, Obstetrics-Gynecology, Psychiatry) converted the large majority of their cases to consultations; departments without one converted almost none. The mechanism isn't persuasion or better training — it's that a referral requires the patient to physically travel and the case to formally transfer, while a consultation with someone already in the room requires neither; proximity removes the activation cost that a referral otherwise imposes by default. Diagnostic move: if you want two roles or functions to coordinate on shared cases rather than hand off and fragment responsibility, check whether they occupy the same physical or virtual space during the moment the coordination decision gets made — policy encouraging 'more consultation' will underperform structural co-location every time, because the decision to consult versus refer is made in the instant a need arises, and whichever option requires less immediate effort wins by default regardless of what the policy says should happen."
