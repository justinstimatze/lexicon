id: lex-dw2jd
name: a-brief-intense-pleasure-can-mobilize-a-major-expedition-to-repeat-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A single, brief sensory experience of unusual intensity can become so preoccupying that a person mobilizes major resources purely to locate and repeat its source. In the Jataka''s tale of Mahakapi, a single taste of mango does this to the king: "The flavour of the ripe mango remained pervading the king''s whole body. Possessed by desire of the flavour, he asked the foresters where that tree stood, and hearing that it was on a river bank in the Himalaya quarter, he had many rafts joined together and sailed upstream by the route shewn by the foresters."'
related: []
evokes: [jataka, sattanipata, mahakapi-jataka, brief-pleasure-drives-major-expedition, disproportionate-pursuit-of-a-sensation]
lineage:
  - source: primary
    text: jataka-chalmers1895-mahakapi-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 407, Mahakapi-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The flavour of the ripe mango remained pervading the king's whole body. Possessed by desire of the flavour, he asked the foresters where that tree stood, and hearing that it was on a river bank in the ... Himalaya quarter, he had many rafts joined together and sailed upstream by the route shewn by the foresters."
canonical-instances:
  - "After one extraordinary meal at a remote restaurant, an executive reroutes a business trip and pulls two colleagues off other work just to get back to that specific kitchen, out of proportion to anything the meal itself cost or was worth."
critical-questions:
  - "Is the resource commitment here actually about the sensation itself, or about the status and story of having pursued something few others would bother chasing?"
  - "At what point does treating a fleeting pleasure as worth a major expedition stop being enthusiasm and start being a warning sign about what else in a person's life isn't providing enough reward?"
status: active
