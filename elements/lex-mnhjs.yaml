lineage:
  - source: primary
    text: cushing-trial-of-lovers-kiss-before-home-undoes-the-rescue
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Trial of Lovers: or the Maiden of Mátsaki and the Red Feather.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "not until ye reach the home of thy fathers shalt thou approach her or kiss her; for if thou doest this, all will be as nothing again... Then she lay down and seemed to sleep. She smiled and looked so beautiful to the longing lover that he softly rose and crept close to her. Then, alas! he laid his hand upon her and kissed her. Quickly the beautiful maiden started... 'Ah, thou shameless fool! I now know! Thou lovest me not!'"
canonical-instances:
  - "A recovering patient is told not to resume full physical activity until a specific follow-up clearance, and reinjures themselves not from disbelief in the doctor's warning but from simple eagerness and improved mood right as they near the finish line of recovery, undoing months of careful rehabilitation in one afternoon."
  - "A project team is told not to announce a partnership publicly until contracts are fully signed, and a well-meaning executive, thrilled and confident the deal is essentially done, mentions it informally to a reporter the day before signing -- not out of doubt about the rule but from simple excitement at being so close -- and the other party pulls out."
critical-questions:
  - "is there a meaningful practical difference between a violation caused by doubt or curiosity and one caused by affection or relief, if the consequence in both cases is total and identical -- does distinguishing the two motives actually change what someone should do differently?"
  - "does this pattern place an unreasonable burden on someone at the exact moment they are most exhausted and emotionally invested, demanding peak discipline precisely when peak discipline is hardest to sustain -- is there a design failure in any system that relies on willpower at its most depleted moment?"
  - "the Owl explicitly withheld its full instructions until the young man proved he wasn't 'too eager' -- did that screening actually work, since eagerness, not doubt, is exactly what caused the failure days later; does this suggest the Owl's own precaution targeted the wrong risk?"
