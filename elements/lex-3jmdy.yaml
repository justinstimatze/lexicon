evokes: [merton-1957, quakers-pacifist-abolitionism, celibacy-and-fertility-segregated-by-status, abstract-cultural-synthesis-false-inference, wertbeziehung, mannheim-critique]
lineage:
  - source: primary
    text: merton-1957-abstract-value-conflict-indeterminate
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIII 'Karl Mannheim and the Sociology of Knowledge,' pp.501-502. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). The word 'determine' is hyphenated as 'deter-' at the foot of p.501, with footnotes 17-18 and a page break intervening before 'mine' resumes on p.502; the quote below begins after that break rather than reproducing the footnote-interrupted split."
    quote: "'...mine whether cultural values are consistent or inconsistent, in advance of the actual social situations in which these values are implicated. Thus, if the question is raised, in abstraction from concrete cases of behavior, whether \"pacifism\" and \"abolitionism\" are compatible or incompatible, the answer must be indeterminate. One can equally well conclude, on the abstract cultural plane of belief, that these two value-systems are random (mutually irrelevant), consistent or inconsistent. In the case of the Quakers, adherence to both these values involved integrated action for the abolition of slavery without resort to violence whereas Garrison and his disciples, initially advocates of non-resistance, retracted their pacifist views in order to get on with the war to abolish slavery. It should be noted that prior to the occurrence of this situation, there was little basis for assuming any conflict between the values of abolitionism and pacifism.'"
  - source: primary
    text: merton-1957-values-segregated-by-status
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.501, continuing the argument."
    quote: "'Abstractly inconsistent values are often rendered compatible by their distribution among various statuses in the social structure so that they do not result in conflicting demands upon the same persons at the same time. Potential conflict of values may be obviated by their segregation in different universes of discourse and their incorporation in different social roles. Failure to recognize that the organization of values among social roles may render abstractly conflicting values compatible would lead, for example, to the thesis that the Catholic Church maintains incompatible values of celibacy and fertility. In this case, conflict and malintegration is largely avoided, of course, by attaching these values to different statuses within the church organization: celibacy to the status of priest and unrestricted fertility to the married laity.'"
canonical-instances:
  - "A company's stated values of 'radical candor' and 'psychological safety' look like they might conflict in the abstract -- until a concrete performance review forces the question of whether blunt criticism or a soft landing wins, and different managers resolve it differently depending on which value they actually treat as senior."
  - "A hospital's commitments to 'patient autonomy' and 'do no harm' appear potentially at odds in the abstract, but the apparent conflict mostly dissolves in practice because the two values are institutionally segregated across roles: the ethics committee and the attending physician handle autonomy disputes, while the treating team handles harm-avoidance in routine care, so the same person rarely has to adjudicate both at once."
critical-questions:
  - "If the values ARE eventually assigned to the same person in the same moment (a priest who is also, unusually, a parent; a manager forced to be both candid and reassuring in one conversation), does the role-segregation explanation simply run out, or does it predict a specific kind of visible strain at exactly that boundary?"
  - "Does treating abstract value-compatibility as strictly indeterminate go too far -- are there value pairs (e.g., a stated commitment to honesty and a stated commitment to secrecy) where the abstract case for tension is strong enough that waiting for a concrete test is itself a way of avoiding an uncomfortable conclusion?"
status: active
