canonical-instances:
  - "A junior lawyer is praised in moot court for saying 'I'm not certain this precedent controls' and then, on their first day in front of an actual client, is coached by a partner to drop that phrasing entirely — not because the underlying legal uncertainty has changed, but because a paying client reads visible lawyerly doubt as a reason to fire the firm, where a professor read it as intellectual honesty."
  - "A resident pilot instructor tells trainees to voice every doubt about a maneuver during simulator training, then tells the same trainees, on their first flight with paying passengers boarding, to project calm confidence regardless of felt uncertainty — the training doesn't reverse itself, it adds a second audience (passengers) whose read of visible hesitation differs from the first audience's (the instructor)."
critical-questions:
  - "Does the earlier norm (openly voicing doubt) actually get suppressed, or does it move to a different channel — private consultation with colleagues, documentation, second opinions — so that the underlying epistemic honesty is preserved while only the PATIENT-FACING display changes? Fox's material doesn't fully resolve whether the third-year student's private doubt-tracking survives the switch or genuinely erodes."
  - "What happens to a person who never successfully makes this flip — who keeps voicing doubt to patients the way they were trained to voice it to classmates — is the cost purely reputational (patients lose confidence), or does visible physician uncertainty ever have a measurable clinical cost of its own, distinct from the physician's actual competence?"
status: active
