    citation: "Two prior substrate hits cite Tronto: lex-7xz6k (Bhagavad Gita, act-for-action-quality-not-for-outcome-attachment) and lex-d73nj (Beauvoir, othering-pairs-subordinate-immanence-with-dominant-transcendence). Both cite 'Tronto 1993, Moral Boundaries' only inside a parenthetical list of care-ethics authors — 'Tronto 1993, Kittay 1999, Held 2006' in lex-7xz6k's cross-attestation lineage entry, and 'care-ethics tradition (Tronto 1993, Held 2006, Kittay 1999)' in lex-d73nj's — with Tronto one name among several supporting a different atom's own headline claim: nishkama-karma's cross-domain reach into parenting and caregiving for lex-7xz6k, the asymmetric immanence/transcendence partition for lex-d73nj. Neither develops Tronto's four-phase analytic decomposition (caring about, taking care of, care-giving, care-receiving) or her specific argument that the public/private boundary is a political construction; neither quotes her directly or engages her book's actual argument — a citation-list mention rather than primary grounding, and a genuine gap. No existing atom from a different source grounds the public/private-boundary-is-itself-political claim. Lex-0629 (Federici, paid-labor-requires-unpriced-reproductive-substrate-shifted-onto-least-refusable-class) is a candidate near-neighbor: Federici's claim is a political-economy mechanism, that the wage relation requires unpriced reproductive labor extracted from a class that cannot refuse, while Tronto's is the broader political-theory claim that the public/private category boundary itself is what keeps any such extraction off the justice and distribution agenda, plus the four-phase internal anatomy of care. Genuinely distinct but tightly composable; included in `related`. Lex-0552 (Hochschild, emotional-labor-extracts-affect-as-paid-resource) is a second candidate: Hochschild's claim is specific to commodified affect as a condition of paid employment, narrower than Tronto's four-phase frame, which covers unpaid care, and orthogonal to the public/private-boundary claim — a genuine but looser neighbor, included in `related` given the direct thematic overlap in the undervalued-care-work cluster the agent-instruction's cross-domain applications section draws on. No thematic overlap was found with the substrate's Rappaport ritual atom (lex-sjyty); the two ground unrelated claims — ritual's function versus care's political-boundary status — with no shared mechanism. The gap is confirmed on both counts, the four-phase decomposition and the public/private-boundary-as-political-choice argument; lex-7xz6k and lex-d73nj are reciprocated as an upgrade from loose name-drop to full cross-reference."
canonical-instances:
  - "The AIDS-care service agencies Tronto cites (Gay Men's Health Crisis, Project Open Hand, the Shanti Project): recognizing that people with AIDS face mobility and nutrition needs is caring about; founding and organizing the agency, raising funds, and coordinating volunteers is taking care of; delivering culturally appropriate meals and administering medication is care-giving; whether the person actually eats, and eats what they need, is care-receiving — the case Tronto herself uses to show the four phases are distinct tasks, often performed by entirely different people."
  - "Tronto's hospital example: a physician `takes care of` the patient (assumes responsibility, sets the treatment plan) while nurses, orderlies, and lab technicians perform the actual `care-giving`; a nurse may `care about` the patient's condition more acutely than the attending physician but has no institutional standing to override the physician's judgment — the canonical instance of the phases being distributed unevenly by institutional power, and of the resulting conflict when the person `taking care of` is furthest from the actual `care-giving` and `care-receiving.`"
  - "The absence of a U.S. national day-care policy: Tronto's paradigm case that a public/private line is a political choice, not a natural fact — child care during working hours is treated as a private family responsibility to be solved individually (or subsidized only indirectly through tax relief) rather than as a social-infrastructure question, even though the need is universal and non-optional."
  - "The demographic composition of paid caring occupations Tronto cites from census data (domestic servants, cleaners, non-household child-care workers overwhelmingly female and disproportionately Black and Hispanic): the empirical distribution underneath her structural claim that `caring about` and `taking care of` are `the duties of the powerful` while `care-giving and care-receiving are left to the less powerful.`"
  - "Operationally distinct from lex-7xz6k (Bhagavad Gita, act-for-action-quality-not-for-outcome-attachment): lex-7xz6k cites Tronto only as one of several care-ethics sources supporting a claim about MOTIVATIONAL ORIENTATION (act for the relationship, not the gratitude or outcome). lex-24vtm grounds Tronto's own ANALYTIC STRUCTURE (four phases of caring) and POLITICAL-BOUNDARY argument (the public/private line is constructed, not natural) directly from her text."
  - "Operationally distinct from lex-d73nj (Beauvoir, othering-pairs-subordinate-immanence-with-dominant-transcendence): lex-d73nj cites Tronto only as one of several sources cross-attesting that care work gets assigned as `immanence-side labor` under a Beauvoirian partition. lex-24vtm is the primary grounding of Tronto's own four-phase decomposition and her specific claim that the public/private boundary is itself a political, not a natural, construction — a related but independently essential claim."
  - "Operationally distinct from lex-4uuxy (Federici, paid-labor-requires-unpriced-reproductive-substrate-shifted-onto-least-refusable-class): Federici's claim is the political-ECONOMY mechanism (capitalism's wage equation balances only because reproductive labor is extracted unpaid). Tronto's claim is the broader political-THEORY diagnosis of why that extraction is invisible to justice-discourse in the first place — the public/private boundary itself — plus the internal four-phase anatomy of what `care` names. They compose tightly rather than duplicate."
critical-questions:
  - "Which of the four phases is being collapsed or silently dropped in this account of `care` — is care-receiving (the feedback on whether the need was actually met) being ignored, hiding whether the caring was adequate at all?"
  - "Who is assigned `caring about` and `taking care of` (recognition and responsibility, historically the more public, prestigious, and powerful roles) versus who is assigned `care-giving` and `care-receiving` (the hands-on work and its reception, historically gendered, racialized, and lower-status)?"
  - "Is the boundary between `public` (political, distributive, subject to justice claims) and `private` (domestic, natural, pre-political) being treated as a neutral given here, or is it being examined as itself a historically constructed, politically consequential choice?"
  - "If this caring need were reframed as a question of political distribution rather than private virtue or natural role, what would visibly change — funding, measurement, compensation, who gets to make policy about it?"
  - "Is `caring about` being reduced to individual sentiment or personal virtue in a way that obscures a COLLECTIVE, political fact — that a society's disposition toward whom it deems worth caring about (the homeless, the disabled, the elderly, distant strangers) is itself a political choice, not merely an aggregate of private feelings?"
