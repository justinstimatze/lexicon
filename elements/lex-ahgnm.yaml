    quote: "'Introspection training generalized to improving the models' accuracy about the attribute weights that they natively used in other choice contexts (i.e., attribute weights that had not been learned from fine-tuning). ... When making decisions on behalf of agents that did not appear in any of fine-tuning examples (and, therefore, using only their native choice processes), the introspection training from Experiment 2 made both models more accurate in reporting how heavily they weighted different attributes. We observed an increase from r = .46 to r = .71 for 4o, and an increase from r = .40 to r = .70 for 4o-mini.' (Plunkett, Morris, Reddy, Morales, Self-Interpretability, 2025, Figure 3 caption / Section 4.2)"
  - source: discovery-loop
    text: chua-evans-2025-cot-faithfulness-mining-pass-
    citation: " mining pass (2026-07-14), second source of the same pass — see lex-nx898's discovery-loop entry for the full source-cluster selection rationale (recent AI-interpretability arXiv cluster, coverage-tool false-positive triage for Berger/Butler, and the declined second Chua-Evans candidate). Surveyed via pdftotext -layout on the official arXiv PDF (arXiv:2505.17120). This candidate (transfer of introspective accuracy to untrained domains) is structurally distinct from lex-nx898 (which concerns whether an EXTERNAL OBSERVER can trust a channel as monitoring evidence) — lex-ahgnm concerns the SYSTEM'S OWN capacity to accurately self-report, and whether training that capacity generalizes. It is also distinct from lex-yh672 (left-brain-interpreter constructs causal narrative without access to actual cause) and the broader confabulation cluster: lex-yh672's claim is that introspective reports are BY DEFAULT constructed narratives disconnected from the actual cause; this atom's claim is the complementary positive finding that introspective ACCURACY CAN BE DELIBERATELY TRAINED and, more specifically, that such training TRANSFERS beyond its own training examples — a claim about the trainability and generalization structure of a skill, not about the default reliability of untrained self-report. A distinctness check against the catalog returned only loose score-0.7 matches (lex-wtkuz descriptive-vs-operational-metacognition, lex-xcaqj generalization-then-instantiation, lex-qhrpv comparative-substrate-bootstrapping, lex-4d53x optimal-strategy-depends-on-measurement-horizon, lex-vgfgh Pearl's causal hierarchy) — none states this atom's specific claim. lex-wtkuz is the closest thematic neighbor (both concern metacognition) but operates on a different axis entirely: lex-wtkuz distinguishes DESCRIBING an internal state from OPERATIONALIZING it into a binding rule; this atom concerns whether ACCURACY AT DESCRIBING generalizes across untrained content, a question lex-wtkuz doesn't address. A manual grep supplement (introspection accuracy, self-report training transfer, metacognitive accuracy generalizes) found no existing atom. Minted alongside lex-nx898 (companion atom, same pass, adjacent AI-interpretability source cluster); left `related` empty rather than force a cross-link to lex-nx898, since the two atoms address different questions (external-observer trust in a channel vs. a system's own trainable self-report accuracy) that don't directly compose the way prior same-pass sibling pairs have (e.g. lex-y9ecj/lex-pzv9p's shared-source register-transposition and glamour atoms, which shared a single underlying mechanism)."
canonical-instances:
  - "Experiment 2 (within-training-distribution improvement): fine-tuning GPT-4o and GPT-4o-mini specifically on the task of reporting their own fine-tuned attribute weights raised held-out (but still fine-tuned-preference) reporting accuracy from r=.50-.54 to r=.74-.75."
  - "Experiment 3 (out-of-distribution transfer, the atom's core evidence): the same introspection-training, applied to entirely new agents and decision types the models were never fine-tuned to have preferences about, raised accuracy in reporting those NATIVE (untrained) preferences from r=.40-.46 to r=.70-.71 — improvement on content the training never touched."
  - "The controlled-preference design itself: attribute weights were randomly generated and instilled via fine-tuning specifically so that accurate self-report could not be explained by the model using common-sense priors or its own observed behavior to infer plausible weights — isolating the self-report accuracy as the thing being measured and trained, not general world-knowledge."
critical-questions:
  - "Does this mean the models are 'really' introspecting, in the sense of reading an internal representation of their own weighting process? The authors explicitly decline to claim this — the paper establishes a behavioral transfer pattern (trained accuracy generalizes to untrained content), not a mechanistic account of HOW the model produces accurate reports. The atom's claim is scoped to the transfer pattern, which is diagnostically useful regardless of the underlying mechanism."
  - "Could the generalization be explained by the fine-tuning simply making the model better at a narrow response FORMAT (e.g., producing plausible-looking weight numbers) rather than better at accuracy? The design controls for this: accuracy is measured against the actual ground-truth weights used in each decision (know from the fine-tuning specification for instilled preferences, or estimated via logistic regression on the model's own choice behavior for native preferences) — a format-only improvement would not raise the correlation with these independently-verified ground-truth values."
  - "Is this specific to LLMs, or does the same transfer-vs-memorization diagnostic apply to human introspection training too?  The diagnostic logic (test on held-out, structurally-different content rather than only the trained distribution) is general and predates this paper — the paper's contribution is demonstrating the transfer actually occurs for LLM self-report of a specific quantitative internal feature, not inventing the diagnostic itself."
