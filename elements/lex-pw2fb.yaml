lineage:
  - source: primary
    text: kautilya-arthashastra-competing-to-help-the-same-neighbour
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Treaties,' 'Helping the Ally, the Middle King or the Neutral King,' 'Both Conqueror and Enemy Helping Same Neighbour, Middle or Neutral King,' {from 7.8.17-24}."
    quote: "'If both the conqueror and the enemy give help to the same neighbour, the Middle king or the Neutral king, whoever is a friend (or a better friend) of the king helped, is to be considered to have outmanoeuvred the other. For, he who helps a friend, promotes his own interests. The other, helping one less friendly, not only reaps losses, expenses, absences from home and gains to his enemies but is all the more hated for having been a benefactor.'"
canonical-instances:
  - "Two companies compete to sponsor the same up-and-coming creator who has already publicly praised one of them for years -- the favored company's modest sponsorship reads as a natural extension of an existing relationship, while the rival company's much larger sponsorship offer gets accepted reluctantly out of financial need and quietly resented, since the creator now feels obligated to a brand they never actually wanted to be associated with."
  - "A political figure who has long favored one faction receives an unsolicited campaign donation from a rival faction hoping to buy goodwill, and instead of gratitude, the donation produces visible discomfort and eventual public distancing, because accepting it created an unwanted appearance of obligation to a side the figure never intended to align with."
critical-questions:
  - "how would the less-favored helper actually know in advance that the third party's preference is fixed rather than genuinely open to being shifted by a sufficiently large or well-timed favor -- does acting on this principle risk writing off relationships that were actually persuadable, based on a snapshot of preference that hadn't yet had a chance to change?"
  - "does the claim depend on the third party being unable to simply decline the unwanted help -- if declining is a real option, does the resentment dynamic still apply, or does it specifically require a situation where the recipient feels unable to refuse the assistance despite not wanting the resulting obligation?"
  - "is there a threshold of generosity or need beyond which even an unfavored helper's assistance overcomes the resentment dynamic -- a large enough favor, or one delivered at a severe enough moment of need, might plausibly convert even an unwanted debt into genuine gratitude, and the claim as stated doesn't specify where that threshold might sit."
