    quote: "Fisher offers to give him some meat if he shuts his eyes and opens his mouth, then drops a knife and kills him."
canonical-instances:
  - "A stranger offers to show someone a magic trick if they close their eyes and hold out their wallet, and the trick is that the wallet is gone when they open them."
  - "A coworker asks someone to step away from their computer 'just for a second' to grab a surprise gift from the supply closet, and returns before they're back, having used the unlocked, unattended screen for something the surprise was never actually for."
critical-questions:
  - "Does the mechanism depend on the victim trusting the specific person making the offer, or would the same closed-eyes precondition raise suspicion regardless of who asked, and does the story suggest Sitconski had reason to trust Fisher going in?"
  - "Is there a meaningful difference between a precondition that merely creates opportunity for harm and one that is explicitly designed as the delivery mechanism for it, and does Fisher's specific instructions, eyes closed and mouth open, read as accidental convenience or deliberate engineering?"
  - "Would a target who has been burned by this exact move before still fall for it, or does the mechanism specifically require a fresh victim who has no reason yet to distrust an offer of food after a theft?"
