id: lex-vv7bz
name: repeated-probing-for-a-fear-sets-up-the-scenario-that-exploits-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Testing someone with a series of escalating questions or objects to find the one thing that finally breaks their claimed fearlessness gives you precise information about their actual vulnerability, and that information can then be used to construct a scenario specifically engineered to require deploying exactly that thing against them. In Radin's Winnebago Hare Cycle, Bear insists repeatedly that nothing frightens him -- 'No, grandson, I am not afraid of anything' -- even when reminded that the country is full of wars. Hare tests this directly with a series of arrows, and the first three produce no admission at all: 'Then he took out another, but it was only when he took out the fourth one that the old man said, 'Grandson, put that away quickly for of that one I am afraid.'' Having identified the exact fear, Hare doesn't act immediately; he manufactures the precise circumstance that would make deploying that fear look necessary rather than aggressive: 'Hare went out and scattered dung all around the lodge, stuck feathers in the dung and told the piles of dung to give the war-whoop early in the morning.' When the fabricated war cry sounds, it reads as a real emergency, and Hare is standing ready with the one arrow he already knows Bear cannot withstand: 'When finally he did come Hare took aim and shot him under the arm, the arrow going clear through him.' The probing and the staging were two separate steps, and neither one alone would have worked; the probing found the exact vulnerability, and the staging supplied the cover story for using it. Diagnostic move: when someone tests you with an escalating series of specific objects or scenarios and only stops once you reveal a genuine reaction, treat that moment as the end of information-gathering, not the end of the interaction, and expect whatever comes next to be built specifically around what you just revealed."
related: [lex-z4mtg]
evokes: [radin-winnebago-hare-cycle, hare-and-bear, i-am-not-afraid-of-anything, put-that-away-quickly-for-of-that-one-i-am-afraid]
lineage:
  - source: primary
    text: radin-hare-tests-bears-fear-then-stages-a-war-whoop-to-exploit-it
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 8. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "The Bear spoke to Hare saying, 'Grandson, I don't suppose you have had your meal yet.' So he put a kettle full of fat to boil and soon Hare had a big meal. After the meal Hare suddenly said, 'Grandfather, you have been living here a long time, have you not?''Yes, grandson, I have been living here for a long time.''Don't you ever get frightened?''No, grandson, I am not afraid of anything.' ... Then, after a pause, Hare said again, 'Grandfather, do you know that the country is full of wars?''Yes, indeed, grandson, but I am not afraid of it.''Well, grandfather,' said Hare, 'I feel rather uneasy about it and that is why I am talking in this way.' Then Hare went out and scattered dung all around the lodge, stuck feathers in the dung and told the piles of dung to give the war-whoop early in the morning. Thereupon he went back and said, 'Grandfather, aren't you really afraid of this?' and he took out one of his arrows and showed it to him. 'No,' said he. Then he took out another, but it was only when he took out the fourth one that the old man said, 'Grandson, put that away quickly for of that one I am afraid.' ... Early in the morning the war-whoop was given outside. It was so loud that it seemed as if the enemy were right upon them. 'Oh!' said Hare and rushed outside and waited at the door for the old man to come out. When finally he did come Hare took aim and shot him under the arm, the arrow going clear through him."
canonical-instances:
  - "A negotiator probes a counterpart across several unrelated topics until one specific mention visibly rattles them, then arranges a later meeting whose agenda is built entirely around that topic, using it as the pressure point once its effect has been confirmed."
  - "A con artist tests a mark with a series of small claims until one specific fear, of a manufactured emergency involving a family member, produces a visible reaction, then constructs an elaborate scenario built around that exact fear to extract money under manufactured urgency."
critical-questions:
  - "Would Bear's admission of fear have been safe to make if Hare hadn't already been planning to exploit it, or does the story suggest that revealing a genuine vulnerability under direct testing is inherently risky regardless of the tester's stated intentions at the time?"
  - "Is the fabricated war-whoop doing separate work from the arrow-testing, providing cover and urgency, or would Hare's plan have succeeded just as well if he had simply attacked Bear directly once the fear was identified, without staging a pretext first?"
  - "Does Bear's insistence that he fears nothing, followed by a specific, narrow exception, suggest that blanket claims of fearlessness are typically covering one particular vulnerability rather than describing a genuine absence of fear, and how would a listener tell the difference in advance?"
status: active
