id: lex-ca6v4
name: perceived-status-similarity-is-a-precondition-for-social-comparison
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before asking WHOM someone compares themselves to, check whether the comparison could happen at all — Merton's point is that some minimal perceived or imagined similarity in status has to exist first, or the comparison never gets triggered. 'This suggests the general hypothesis that some similarity in status attributes between the individual and the reference group must be perceived or imagined, in order for the comparison to occur at all.' Once that minimal similarity is established, everything else about the comparison — whether it's flattering or painful, whether it produces satisfaction or resentment — follows from the OTHER similarities and differences layered on top of it: 'The underlying similarities of status among members of in-groups... thus appear as only one special, though obviously important, basis for the selection of reference groups. Out-groups may also involve some similarity of status.' The practical upshot: a person is not wounded by every gap between themselves and everyone richer, more successful, or more admired in the world — only by gaps relative to people who first register as similar enough to belong in the same comparison at all. This is why a specific promotion, salary, or achievement stings coming from a near-peer and barely registers coming from someone in a different perceived category entirely (a celebrity, a different generation, a different field) — the difference isn't the size of the gap, it's whether the minimal-similarity gate that lets the comparison happen was ever opened."
