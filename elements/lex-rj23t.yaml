id: lex-rj23t
name: a-tell-can-flag-concealment-without-revealing-its-content
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Apply this the moment you catch a tell -- a hesitation, an inconsistency, an anomaly, an over-controlled performance -- during any attempt to read whether something is being concealed. Before drawing a conclusion, classify what KIND of tell you actually have. Ekman & Friesen's distinction: a 'deception clue' signals only that concealment or dissimulation is occurring -- it tips you off that something is being managed, but the concealed content itself stays opaque. 'Leakage' is different in kind, not just degree: it is the actual betrayal of the withheld content, not merely its presence. A stiff, over-rehearsed, too-perfect performance is a classic deception clue -- you correctly stop trusting the message, but you still do not know what is true. Only leakage tells you what is true. Practitioner move: when you notice a tell, do not let the fact that you caught SOMETHING collapse into believing you now know WHAT is being concealed -- ask explicitly which kind of tell it is. A deception clue licenses you to distrust the presented message and to look elsewhere (a different channel, a different question, more time) for the actual content; it does not itself supply that content. Treating a mere deception clue as if it were leakage is a specific and common inferential error: it produces false confidence in a SPECIFIC alternative account when the evidence has only ruled OUT the presented one."
related: [lex-8vcfb, lex-e3yhv, lex-ngas3, lex-xk8ry]
evokes: [deception-clue, leakage, ego-alter-deception-framework, presence-evidence-vs-content-evidence, imperfect-simulation-as-tell]
lineage:
  - source: primary
    text: ekmanfriesen-1969-nonverbal-leakage-clues-deception
    citation: "Paul Ekman and Wallace V. Friesen, 'Nonverbal Leakage and Clues to Deception,' Psychiatry 32:1 (February 1969), pp. 88-106. Section 'Definitions' (p. 89): the paper's foundational typology, stated before any of the neuroanatomical or empirical material -- the entire rest of the paper depends on keeping these two categories of evidence separate. A deception clue reveals only the FACT of concealment; leakage reveals the CONTENT that was concealed. The distinction matters practically throughout the paper: e.g., the face's 'imperfectly performed simulations' (a smile that lasts too long, a frown that is too severe) are named explicitly as deception clues -- they tell a keen observer that the display is managed, without by themselves disclosing what the true affect is -- while micro-expressions and adaptors are named as leakage, actually carrying the concealed content."
    quote: "We will consider two forms of deception: alter-deception, where ego, the deceiver, conceals information from the other interactant, alter; and self-deception, where ego is the object of his own deception, concealing information from himself. Alter is not deceived if he perceives either deception clues or leakage. Deception clues tip him off that deception is in progress but do not reveal the concealed information; the betrayal of that withheld information we call leakage. Alter may become aware of deception clues or leakage regardless of whether ego is aware of their occurrence or of alter's cognizance of them."
  - source: primary
    text: ekmanfriesen-1969-nonverbal-leakage-clues-deception
    citation: "Same source, Section 'Leakage and Deception Clues' (pp. 98-99), the paper's own worked instance of a pure deception clue with no accompanying leakage: an imperfectly performed facial simulation reveals that something is being managed without revealing what."
    quote: "Other forms of deception clues in the face are imperfectly performed simulations of affect. These might include performances of too long duration, with too extensive a scope to the expression, or without the usual blend of affects. Examples are the smile that lasts too long, the frown that is too severe, the look of fear that is not sufficiently blended with surprise. [...] One would expect the keen observer... to receive contradictory information from facial cues: simulated messages, micro leakage of information which contradicts the simulations, and deception clues of squelched displays and improperly performed simulations."
  - source: discovery-loop
    text: ekmanfriesen-1969-mining-pass-
    citation: " mining pass (2026-07-14), same source and OCR-acquisition process as sibling atom lex-ngas3 (see that atom's discovery-loop entry for the OCR-resolution and pipeline details -- the definitions-section quote above was cross-checked against a 400dpi/psm-4 re-OCR of page 3 and is clean). Distinctness audit via a distinctness check against the catalog against the full 1061-atom substrate (pre-, run separately from lex-ngas3's audit since this is a genuinely different candidate claim -- an evidence-typology, not a channel-selection heuristic): highest match was lex-yh672 left-brain-interpreter-constructs-causal-narrative-without-access-to-actual-cause at 0.605 (post-hoc narrative construction is a different mechanism from real-time tell-classification; not a collision), followed by lex-e3yhv at 0.585 (same orthogonal-axis relationship documented in lex-ngas3), lex-9pubz concealment-of-intentions at 0.553 (strategic withholding of intentions vs. classifying an already-caught tell -- different question), and lex-8vcfb absence-of-expected-event-as-positive-evidence at 0.500, the closest genuine structural cousin -- both atoms are about what a specific KIND of evidence entitles an observer to conclude, but lex-8vcfb is about the evidential value of a NON-event (something expected that didn't happen), while this atom is about classifying an OBSERVED anomaly into one of two categories with different evidential payloads. No score approached the house concern threshold. This atom composes with sibling lex-ngas3: lex-ngas3 predicts WHERE each kind of tell tends to appear (the well-monitored face predominantly produces deception clues -- imperfect simulations, squelched micro-expressions -- while the unmonitored legs/feet predominantly produce actual leakage of content); this atom names what conclusion each kind of tell, once caught, actually licenses. Neither subsumes the other: lex-ngas3 is silent on what a caught tell tells you; this atom is silent on which channel a tell is likely to come from."
canonical-instances:
  - "The paper's own defining pair: a deception clue ('tips him off that deception is in progress but does not reveal the concealed information') versus leakage ('the betrayal of that withheld information'). An interrogator who notices a suspect's rehearsed, too-smooth alibi has a clean deception clue -- correct to distrust the story, still ignorant of what actually happened -- unless some further leak (an inconsistent detail, a slip) supplies the actual content."
  - "Imperfectly performed facial simulation as pure deception clue: 'the smile that lasts too long, the frown that is too severe' signals management without disclosing the managed-away affect itself. Contrast with a genuine micro-expression, which IS leakage -- it does not just signal that something is off, it briefly shows what the off thing is."
  - "Debugging analogy: a test suite going red is a deception clue about the codebase -- it tells you something is wrong without telling you what. A stack trace or a bisected commit is leakage -- it discloses the actual content of the fault. Treating a red test as if it already told you the bug (rather than merely that a bug exists somewhere in scope) is the generic form of the error this atom flags."
  - "Auditing analogy: a flagged anomaly in a financial statement (round numbers, a ratio outside historical range) is a deception clue -- evidence that something may be managed, not evidence of what. Only a specific reconciling document, a whistleblower's account, or a forensic trace constitutes leakage of the actual misstatement's content. Regulatory and journalistic overreach often comes from treating a strong deception clue as if it were already leakage of a specific, particular wrongdoing."
critical-questions:
  - "Can a single tell be both a deception clue and leakage at once? Yes -- the paper does not claim exclusivity, only that the two are analytically distinct categories of evidential payload. A poorly squelched micro-expression can simultaneously signal 'something is being managed' (deception clue) and briefly display the actual concealed affect (leakage) in the same instant. The distinction is about what a given observed signal ENTITLES you to conclude, not a claim that every real-world tell falls cleanly into only one bucket."
  - "Isn't 'this is a mere deception clue, not leakage' sometimes wrong -- couldn't a good-enough deception clue functionally reveal the content by process of elimination? In narrow cases (a binary choice where 'not A' just means 'B'), yes, a pure presence-signal can collapse into content-revealing. The atom's caution is aimed at the more common case: an open-ended concealment where ruling out the PRESENTED account leaves a large space of possible true accounts, and a deception clue alone gives no way to select among them. Before treating a deception clue as if it narrows the space to one specific alternative, check whether the space genuinely is that narrow, or whether that narrowing is being smuggled in by the observer's own prior suspicion."
  - "How does this relate to sibling atom lex-ngas3 (least-monitored channels leak truth most reliably)? Complementary, not overlapping: lex-ngas3 tells you WHERE to look for a tell that is more likely to be leakage rather than a mere deception clue (the least-scrutinized available channel); this atom tells you, once you have caught SOME tell, how to correctly read what it licenses you to conclude. Use lex-ngas3 to choose where to look; use this atom to correctly interpret what you find there."
