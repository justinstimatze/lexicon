lineage:
  - source: primary
    text: hurleydennettadams-2011-insidejokes
    citation: "Matthew M. Hurley, Daniel C. Dennett, and Reginald B. Adams Jr., *Inside Jokes: Using Humor to Reverse-Engineer the Mind* (MIT Press, 2011), Chapter 8 ('Humor and Mirth')."
    quote: "'In short, (basic) mirth is the pleasure in unearthing a particular variety of mistake in active belief structures. And (basic) humor is any semantic circumstance (any convergence of contentful elements at a particular time)-exogenous or endogenous-in which we make such a mistake and succeed in discovering it... It is only the information that gets introduced covertly-without drawing attention to itself on arrival-into the mental space whose discovery elicits mirth; typically making a presumption too overtly, too explicitly, will draw attention to the possible mistake, thus helping us to approach it with caution and then avoiding it... to become an unquestioned overt element, we must make an epistemic commitment to it; such a commitment is always made if no other elements from [the heuristic search process] successfully challenge the epistemic status of the element in question... The picture that emerges is a time-pressured, involuntary heuristic search for valid expectations, which generates mental spaces in which elements are constantly being tested. According to this model, then, basic humor occurs when 1. an active element in a mental space that has 2. covertly entered that space (for one reason or another), and is 3. taken to be true (i.e., epistemically committed) within that space, 4. is diagnosed to be false in that space-simply in the sense that it is the loser in an epistemic reconciliation process; 5. and (trivially) the discovery is not accompanied by any (strong) negative emotional valence. More simply put: Humor happens when an assumption is epistemically committed to in a mental space and then discovered to have been a mistake... its deliverances must be independently rewarding-and the reward is mirth... Different flavors of rewards allow a learning mechanism to distinguish their different sources... there is a one-to-one mapping between the qualias of a reward and the distinctive triggering circumstance that identify it... This fact tells us why discovery and mirth feel different: They are tied to distinct and discriminable cognitive circumstances.' (Hurley, Dennett & Adams, *Inside Jokes*, Chapter 8)"
  - source: discovery-loop
    text: hurleydennettadams-insidejokes-mining-pass-
    citation: "This is the book's central, most-cited thesis, from Chapter 8; the surrounding chapters — the mental-spaces architecture of Chapter 7, the twenty diagnostic questions of Chapter 5 — build the scaffolding this claim rests on but were not separately mined, since they are setup for this claim rather than independent claims in their own right. Lex-0698 (learning tracks prediction error, not outcome) is the closest structural neighbor — both are reward-tuned-to-a-specific-triggering-circumstance claims — but lex-wgd7u is a general neuroscience mechanism (any expectation violation generates a learning signal), while this atom is the specific claim that mirth is one particular, qualitatively distinct member of a family of such rewards, tuned specifically to covert-false-belief-then-reversal — not mere surprise, not mere discovery or insight, not an overtly flagged error. Lex-0765 (benign-violation theory) is a genuinely distinct mechanism: it concerns the perceived character of a stimulus (simultaneously a norm-violation and benign), while this atom concerns the cognitive process of belief-formation-and-correction, silent on perceived violation or benignness. Dennett is cited elsewhere in the substrate, but from different books (the intentional stance, phenomenal consciousness), not this one."
canonical-instances:
  - "The book's own formal five-condition definition, quoted verbatim: covert entry into a mental space, epistemic commitment, subsequent diagnosis as false, and no accompanying negative valence — offered explicitly as necessary AND sufficient conditions for the pleasurable experience of humor, not merely correlated features."
  - "The 'bad joke-teller' diagnostic case the authors use to isolate covertness as load-bearing: a joke-teller who explicitly flags the key false presumption before telling the story kills the mirth, because the audience can now approach the presumption with caution rather than unconsciously committing to it — demonstrating that IDENTICAL propositional content produces mirth only when smuggled in unannounced."
  - "The sweet/salty reward-differentiation analogy the authors use to explain why mirth feels qualitatively distinct from ordinary discovery/insight pleasure (the 'Eureka!' feeling): just as an organism needs distinguishable rewards for sugar-seeking versus salt-seeking (or it would conflate the two needs), mirth and insight are tuned to different triggering circumstances and so are experienced as qualitatively different, even though both are positively-valenced cognitive rewards."
  - "The authors' explicit contrast with Koestler's and Deacon's discovery-pleasure accounts of humor (both quoted at length in the chapter) — acknowledging the real kinship between mirth and 'Eureka' moments while insisting the two are mechanistically distinguishable by the presence or absence of the specific covert-commitment-then-reversal structure, not merely a difference of degree."
critical-questions:
  - "Isn't this just incongruity-resolution theory with extra jargon? The authors explicitly build on incongruity-resolution (citing Schopenhauer, Kant, Minsky, Coulson as antecedents) but add two falsifiable, previously-unspecified constraints that generic incongruity-resolution theories lack: (a) the false belief must have been COVERTLY committed to, not merely noticed as incongruous, and (b) the resolution must carry NO negative valence. Generic incongruity-resolution doesn't predict the bad-joke-teller phenomenon (why flagging a premise up front kills the joke) or explain why some resolved incongruities feel disturbing rather than funny; this theory's added specificity does."
  - "Is 'mental space' just a redescription of working memory, or does it carry real theoretical weight? The authors treat mental-space construction as a specific cognitive activity (drawing on Fauconnier's mental-spaces framework in linguistics) distinguishable from raw working-memory capacity — it's specifically about provisional, probabilistically-assembled representations built by fast heuristic search, with a distinguishable COVERT/OVERT status for their component elements. The theory's testable content lives in this covert/overt distinction and its role in the mirth-mechanism, not merely in invoking 'working memory' generically."
  - "Does the theory explain laughter, or only the subjective feeling of mirth? The authors are explicit that this chapter's claim is about MIRTH (the felt pleasure) and HUMOR (the semantic circumstance that produces it) specifically, reserving the separate question of why mirth is expressed as laughter (rather than some other behavior) for a later chapter ('But Why Do We Laugh?'). This atom should not be read as also explaining the laugh-response itself, which the authors treat as a distinct, downstream question."
  - "Is this an evolutionary just-so story, or does it make risky predictions? The five-condition definition is stated as a testable model that predicts SPECIFIC manipulations should kill or preserve mirth (covertness removal, valence manipulation, absence of prior epistemic commitment) independent of surface joke-structure — the authors explicitly note the model's conditions apply to 'mental behaviors' rather than to stimulus properties, so the same joke-text can be funny or not depending on how it's delivered (covertly vs. overtly), which is a checkable, non-trivial prediction rather than an unfalsifiable post-hoc story."
