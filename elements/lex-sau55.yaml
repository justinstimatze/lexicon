id: lex-sau55
name: teaching-two-excluded-groups-to-blame-each-other-hides-the-real-cause
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When two groups occupy the same excluded economic position -- competing for the same scarce, low-wage, low-status work -- check whether the surrounding culture is actively teaching them to blame each other rather than the structure that put both of them there. Douglass documents this happening to Irish immigrants and free Black laborers in the 1850s United States: 'We see here the black man attacked in his most vital interests: prejudice and hate are systematically excited against him. The wrath of other laborers is stirred up against him. The Irish, who, at home, readily sympathize with the oppressed everywhere, are instantly taught when they step upon our soil to hate and despise the negro. They are taught to believe that he eats the bread that belongs to them. The cruel lie is told them, that we deprive them of labor and receive the money which would otherwise make its way into their pockets. Sir, the Irish-American will find out his mistake one day. He will find that in assuming our avocation, he has also assumed our degradation.' This hostility, in Douglass's account, is manufactured rather than found: newcomers arrive without it ('readily sympathize with the oppressed everywhere') and pick it up specifically upon arrival ('instantly taught when they step upon our soil'). Douglass also predicts a second effect: the group recruited into the excluded position inherits its degradation along with it, since the labor market's actual bottom rung doesn't move just because who occupies it changes. The scarcity itself -- a labor market offering both groups only its worst positions -- goes unexamined by either side as long as each is looking sideways at the other instead of upward at what created the scarcity."
related: [lex-cxffc]
