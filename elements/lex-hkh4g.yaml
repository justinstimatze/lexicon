lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Xenophanes' fragments, translated and quoted by Karl Popper in 'Back to the Presocratics,' Ch. 5 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), p.205. The original Diels-Kranz fragment numbers are given in the source text but did not survive this PDF's text extraction cleanly; not reproduced here rather than guessed."
    quote: "'The Ethiops say that their gods are pug-nosed and black While the Thracians say that theirs have blue eyes and red hair. Yet if cattle or horses or lions had hands and could draw And could sculpture like men, then the horses would draw their gods Like horses, and cattle like cattle, and each would then shape Bodies of gods in the likeness, each kind, of its own.'"
canonical-instances:
  - "Corporate cultures each describe their 'ideal leader' in terms that conspicuously match whichever traits the people doing the describing already have -- engineers describe ideal leadership as technical depth, salespeople describe it as relationship-building charisma. Nobody has an independent, outside measurement of 'ideal leadership' to check either description against; each group's account is a self-portrait wearing the costume of a job description."
  - "Different political factions each describe 'what the founders really intended' for a country's constitution in terms that happen to match that faction's own current platform. The founders are no more available for cross-examination than Xenophanes' gods are, and every faction experiences its reconstruction as historical discovery rather than as a reflection of its own present commitments projected backward."
critical-questions:
  - "Does this mean NO description of an unobservable entity can ever be more than self-projection -- is the mechanism inescapable? Xenophanes' own fragments elsewhere argue for a single, non-anthropomorphic god specifically to escape this trap, suggesting he treated the projection as a correctable error rather than something metaphysically forced. The diagnostic applies most cleanly when a description conveniently mirrors the describer AND no independent check exists. A description that cuts against what the describer would want to be true weakens the case, since it's some evidence the projection isn't running unchecked."
  - "How is this different from ordinary confirmation bias -- seeing what you expect to see? Confirmation bias is about a single observer misreading available evidence toward a prior belief. This mechanism doesn't require any evidence at all, or even a single observer's error -- it's a MULTI-GROUP pattern where the absence of any independent check on an unobservable category means every group's account, generated with no error in their own reasoning process, still converges on their own image, because self-resemblance is the only available template when no other one exists."
status: active
