id: lex-thrkh
name: repeated-folding-multiplies-layers-exponentially-not-additively
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a structure is built by repeating the same fold-and-stack operation, don't estimate the result by assuming each repetition adds a fixed number of new layers — check whether each repetition instead multiplies the count that's already there, which produces an enormous structure from a small number of repetitions. America's Test Kitchen on laminated pastry: 'These so-called laminated pastries, which are made up of alternating layers of dough and fat, are created by repeatedly rolling and folding the dough over itself, typically in thirds (like a business letter). Each set of folds is called a turn, and with each turn the number of layers increases exponentially rather than linearly. Thus, the first turn gives three layers, the next seven, then 19, then 55, and so on. Just six turns creates an astonishing 1,459 layers.' A cook who mentally models 'one more fold' as 'add a few more layers' will badly underestimate how thin and numerous the layers become after only a handful of turns — the same gap between linear and exponential intuition that trips up estimates of compound growth in any domain built from repeated multiplication rather than repeated addition."
