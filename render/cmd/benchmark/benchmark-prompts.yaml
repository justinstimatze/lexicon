# Curated benchmark for gate evaluation
#
# Purpose: replace the V6 18-prompt threshold-test with a larger,
# labeled benchmark that supports precision/recall/F1 measurement of
# gate behavior. Hand-curated to span elements/'s 7+ mining-source
# domains plus the explicit "should be silent" categories (vague-noise
# and concrete-coding-without-elements-coverage).
#
# Labeling rubric:
#   expected_fires: list of elements entry IDs that SHOULD reasonably
#     appear in top-3 results. ANY match counts as a hit (we don't
#     require all listed entries to fire — just at least one).
#   expected_silent: if true, no entry should clear threshold. Any
#     fire is a precision miss.
#   notes: optional commentary on borderline calls.
#
# Categories:
#   polya-likely         — problem-solving heuristics, work-backwards
#   fermi-likely         — order-of-magnitude estimation
#   gof-likely           — design patterns (decorator, composite)
#   argumentation        — Walton schemes, Bayesian reasoning,
#                          premature-closure, expert opinion
#   physics-scale        — scale separation, regime selection,
#                          perturbation theory
#   mythology-narrative  — mentor, archetypes, hero's journey
#   triz-contradiction   — engineering contradictions, parameter
#                          decomposition
#   composition-ops      — sequential, parallel, choice, iteration
#   concrete-coding      — should be silent (real coding tasks
#                          elements/ doesn't cover)
#   vague-noise          — should be silent (greetings, tiny utterances)
#   ambiguous-borderline — judgment calls; reveal scoring sensitivity

version: 1
created: 2026-05-03

prompts:

