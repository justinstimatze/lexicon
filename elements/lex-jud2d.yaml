lineage:
  - source: primary
    text: lakoff-johnson-1980-metaphors-we-live-by-ch8-metonymy
    citation: "George Lakoff and Mark Johnson, *Metaphors We Live By* (University of Chicago Press 1980; afterword 2003 reissue), Ch.8 'Metonymy' (pp.35-40). The canonical formulation of conceptual metonymy as distinct from conceptual metaphor: where metaphor is cross-domain mapping (target domain understood via source domain), metonymy is within-domain substitution where one entity stands for another it is related to. Lakoff and Johnson document the systematic metonymic concepts in English (THE PART FOR THE WHOLE, PRODUCER FOR PRODUCT, OBJECT USED FOR USER, CONTROLLER FOR CONTROLLED, INSTITUTION FOR PEOPLE RESPONSIBLE, THE PLACE FOR THE INSTITUTION, THE PLACE FOR THE EVENT) and establish three pivotal claims: (a) WHICH part is selected as the stand-in DETERMINES which aspect of the whole becomes the focus of thought and action; (b) the picked aspect is experienced as LITERAL once the metonymy is conventional; (c) metonymy structures thought and action just as metaphor does, not just language. The chapter is short but the analytic move is foundational for cognitive linguistics and has been extensively extended by Kövecses, Radden, Panther & Thornburg, and others. The distinction from metaphor matters operationally because metonymy's substitutions hide DIFFERENT things than metaphor's mappings hide — metonymies hide DISTRIBUTION, MECHANISM, and the unpicked aspects of the WHOLE, where metaphors hide ENTAILMENTS of the unused source-domain."
    quote: "[Lakoff & Johnson 1980 Ch.8 p.36, on the distinction from metaphor and the function of metonymy:] 'In these cases, as in the other cases of metonymy, one entity is being used to refer to another. Metaphor and metonymy are different kinds of processes. Metaphor is principally a way of conceiving of one thing in terms of another, and its primary function is understanding. Metonymy, on the other hand, has primarily a referential function, that is, it allows us to use one entity to stand for another. But metonymy is not merely a referential device. It also serves the function of providing understanding. For example, in the case of the metonymy THE PART FOR THE WHOLE there are many parts that can stand for the whole. Which part we pick out determines which aspect of the whole we are focusing on. When we say that we need some good heads on the project, we are using \"good heads\" to refer to \"intelligent people.\" The point is not just to use a part (head) to stand for a whole (person) but rather to pick out a particular characteristic of the person, namely, intelligence, which is associated with the head.' [Ch.8 p.37, on the key 'becomes literal' claim and the FACE FOR THE PERSON case:] 'This metonymy functions actively in our culture. The tradition of portraits, in both painting and photography, is based on it. If you ask me to show you a picture of my son and I show you a picture of his face, you will be satisfied. You will consider yourself to have seen a picture of him. But if I show you a picture of his body without his face, you will consider it strange and will not be satisfied... Thus the metonymy THE FACE FOR THE PERSON is not merely a matter of language. In our culture we look at a person's face—rather than his posture or his movements—to get our basic information about what the person is like. We function in terms of a metonymy when we perceive the person in terms of his face and act on those perceptions.' [Ch.8 p.38-39, on the systematic metonymic concepts and the CONTROLLER FOR CONTROLLED case:] 'Metonymic concepts like these are systematic in the same way that metaphoric concepts are. The sentences given above are not random. They are instances of certain general metonymic concepts in terms of which we organize our thoughts and actions... Similarly, when a waitress says \"The ham sandwich wants his check,\" she is not interested in the person as a person but only as a customer, which is why the use of such a sentence is dehumanizing. Nixon himself may not have dropped the bombs on Hanoi, but via the CONTROLLER FOR CONTROLLED metonymy we not only say \"Nixon bombed Hanoi\" but also think of him as doing the bombing and hold him responsible for it. Again this is possible because of the nature of the metonymic relationship in the CONTROLLER FOR CONTROLLED metonymy, where responsibility is what is focused on.' [Ch.8 p.39, on the conclusion that metonymy structures thought:] 'Thus, like metaphors, metonymic concepts structure not just our language but our thoughts, attitudes, and actions.'"
canonical-instances:
  - "Lakoff & Johnson 1980 Ch.8 paradigm cases: 'Nixon bombed Hanoi' (CONTROLLER FOR CONTROLLED — picks out responsibility, hides distribution); 'we need some good heads on the project' (PART FOR WHOLE — picks out intelligence); 'she's just a pretty face' (FACE FOR PERSON — picks out appearance over posture/movement); 'the ham sandwich wants his check' (OBJECT USED FOR USER — picks out customer-role, dehumanizes the person); 'Exxon has raised its prices again' (INSTITUTION FOR PEOPLE RESPONSIBLE — picks out unified institutional action, hides which executives); 'Washington is insensitive to the needs of the people' (PLACE FOR INSTITUTION — picks out federal-as-monolith, hides which agencies); 'Remember the Alamo' (PLACE FOR EVENT — picks out site as commemorative anchor, hides which individuals, which decisions)"
  - "geopolitical reporting metonymies: 'Russia invaded Ukraine' (COUNTRY FOR MILITARY — picks out state-actor responsibility, hides which units / which command / which subordinates / which dissent within); 'China is stealing IP' (COUNTRY FOR ACTORS — picks out state-as-villain, hides specific state actors vs state-affiliated companies vs private companies vs individual employees); 'Iran fired missiles' (COUNTRY FOR FORCES — picks out state-as-actor, hides whether IRGC vs army vs proxy militia, hides whether ordered by Supreme Leader vs IRGC commander). Transferable consequence: news consumers experience these as descriptions of unified-actor decisions when they describe distributed-system outputs; policy responses calibrated to the metonymy (sanction the state, attack the leader) may miss the actual structure of the underlying decisions"
  - "AI-discourse metonymies: 'the AI hallucinated' (AGENT-FRAME FOR SYSTEM — picks out output-attribution, hides training data, RLHF, fine-tuning, prompt engineering, deployment context, decoding parameters); 'the model decided' (AGENT-FRAME FOR FUNCTION — picks out decision-attribution, hides probability-distribution, sampling, internal computation); 'the model is biased' (OUTPUT FOR PIPELINE — picks out output-attribution, hides which training-stage / which dataset / which RLHF preferences / which deployment-context produced the bias). Transferable consequence: AI policy discussions treat models as unitary agents and miss the distributed-pipeline structure that actually produced the behavior; alignment research that grants the agent-metonymy may overlook system-level interventions"
  - "organizational metonymies: 'the company decided X' (INSTITUTION FOR EXECUTIVES — picks out unified-intent, hides deliberation / dissent / dissent-suppression / dissent-cost); 'the board approved Y' (INSTITUTION FOR INDIVIDUAL DECISIONS — picks out collective action, hides individual votes / abstentions / dissent / dissent-suppression). Transferable consequence: post-mortems blame 'the company' rather than identifying which executives, which decisions, which dissenters were silenced; accountability reform targeted at 'the company' misses the actual decision-structure"
  - "market metonymies: 'Wall Street is panicking' (PLACE FOR PARTICIPANTS — picks out unified-market-mood, hides which traders / which positions / which institutions / which leveraged positions); 'the market believes X' (MARKET-AS-ENTITY FOR PARTICIPANTS — picks out unified-belief, hides which beliefs are held by which size-weighted positions). Transferable consequence: policy responses to 'market panic' treat the market as a unitary agent; the actual structure (which institutions, which leverage, which counterparties) is hidden by the metonymy and the policy may miss what actually breaks"
  - "civic metonymies: 'Congress passed the bill' (INSTITUTION FOR REPRESENTATIVES — picks out collective action, hides individual votes / amendments / dissent / lobbying-influence / committee-bottleneck); 'the Senate is dysfunctional' (INSTITUTION FOR INDIVIDUAL ACTORS — picks out body-as-actor, hides which senators / which procedural moves / which incentive structures). Transferable consequence: voter accountability oriented to 'Congress' rather than individual representatives' votes; reform proposals targeted at 'the institution' rather than at the specific actors and incentive structures"
  - "city/place metonymies: 'Detroit is dying' (PLACE FOR INDUSTRY — picks out city-as-economic-entity, hides which sectors / which workers / which neighborhoods / which still-thriving subsectors); 'Hollywood is changing' (PLACE FOR INSTITUTION — picks out industry-as-actor, hides which studios / which producers / which distribution-models / which talent-categories); 'Silicon Valley is bullish on AI' (PLACE FOR PARTICIPANTS — picks out unified-position, hides which firms / which investors / which workers / which dissenting positions). Transferable consequence: policy and investment decisions made on the metonymic frame miss the actual heterogeneity"
  - "operationally distinct from lex-kfdep conceptual-metaphors-structure-cognition: lex-kfdep covers CROSS-DOMAIN metaphor (TIME ←→ MONEY, ARGUMENT ←→ WAR — two different conceptual domains linked by mapping). lex-jud2d covers WITHIN-DOMAIN metonymy (Nixon and the bombing forces are in the same domain of military action; Wall Street and the market participants are in the same domain of financial activity). Cross-fire: a culture's metonymic conventions interact with its conceptual-metaphor system (e.g. the AGENT-FRAME metonymy in AI discourse reinforces the AGENT conceptual metaphor for LLMs that lex-kfdep covers as a canonical-instance). Distinct mechanisms, coupled in practice"
  - "operationally distinct from lex-6gy96 value-capture-external-metric-replaces-rich-values: lex-6gy96 is about Goodhart-style proxy replacement where a measurable metric ASSERTS equivalence with a rich value (test scores asserting equivalence with learning; engagement asserting equivalence with value-delivered). lex-jud2d is about referential substitution where a salient part is asserted to STAND FOR a related whole (Nixon for the bombing force; Wall Street for the market participants). The asserted relation is different — Goodhart asserts equivalence; metonymy asserts part-of / related-to. The hiding mechanism is different — Goodhart hides the dimensions of the value not measured by the proxy; metonymy hides the distribution, mechanism, and unpicked aspects of the whole"
  - "operationally distinct from lex-2czcp vivid-concrete-instance-dominates-abstract-statistical: lex-2czcp is about availability-bias / vividness in judgment-weight (the salient anecdote outweighs the abstract base-rate in decision-making). lex-jud2d is about a referential-substitution mechanism (the salient part stands for the complex whole in language and thought). Both involve salience, but the cognitive function is different — vividness is about weight in judgment; metonymy is about substitution in reference. A vivid case and a metonymic stand-in can be the same instance, but the transferable cognitive moves are distinct"
  - "operationally distinct from lex-cgqta naturalization-erases-the-mechanism: lex-cgqta (Bourdieu) is about the social-structural process by which a contingent effect becomes experienced as natural-and-inevitable, erasing the mechanism that produced it. lex-jud2d is about a cognitive-referential substitution that picks out an aspect of a complex referent. Bourdieu naturalization can RIDE on metonymy (the metonymic stand-in becomes the natural way to think about the whole), but the mechanisms are operationally distinct"
  - "operationally distinct from lex-jyzng abstracting-an-entity-from-its-instances: lex-jyzng (Plato Forms) is about LIFTING TYPE FROM PARTICULARS (the abstract entity 'justice' lifted from particular just acts). lex-jud2d is about SUBSTITUTING A PART FOR A WHOLE within a domain (Nixon for the bombing force). lex-jyzng's move creates an abstract entity that can then be reasoned about; lex-jud2d's move efficiently refers to a complex referent via a salient part. Distinct cognitive moves"
critical-questions:
  - "the metonymy-surfacing question: in the description you are operating with, what salient stand-in is being substituted for a complex distributed referent? Diagnostic prompts: is the grammatical subject of the sentence actually a single agent with a single decision (Nixon, the company, Russia, the AI, the market), or is the actual referent a distributed system with internal structure? If the second, what stand-in is being used (CONTROLLER, INSTITUTION, COUNTRY, AGENT-FRAME, PLACE)? Most readers do not notice the metonymy because it has reached cognitive-infrastructure status (lex-kfdep mechanism), so the surfacing discipline is the first move"
  - "the picked-aspect identification: once a metonymy is surfaced, which aspect of the whole does it pick out? Standard pickings include: RESPONSIBILITY (CONTROLLER FOR CONTROLLED — Nixon for the bombing); UNIFIED INTENT (INSTITUTION FOR PEOPLE — the company decided); AGENCY (AGENT-FRAME FOR SYSTEM — the AI hallucinated); AUTHORITY (PLACE FOR INSTITUTION — Washington said); SALIENT-VISIBLE-PROPERTY (FACE FOR PERSON, BRAND FOR PRODUCT). The picking is doing analytic work — name it"
  - "the hidden-aspect identification: which aspect of the whole is the metonymy hiding? Standard hidings include: DISTRIBUTION (which units, which decisions, which subordinates carried out the bombing); MECHANISM (which training data, which fine-tuning, which prompt produced the AI output); PLURALITY (which traders, which positions, which dissent in the market); INTERNAL STRUCTURE (which agencies, which staffers, which positions within Washington); DISSENT-SUPPRESSION (which executives objected, which were overridden, which left, which were silenced)"
  - "the expand-when-load-bearing discipline: when the hidden aspect of the metonymy is essential for your reasoning (e.g. you are designing a policy response, an alignment intervention, an organizational reform, a sanction regime), EXPAND the metonymy back into its constituent parts. 'Russia invaded' → which units, which command structure, which subordinates, which dissent. 'The AI hallucinated' → which training data, which fine-tuning, which prompt context, which decoding parameters. 'The company decided' → which executives, which deliberation, which dissent. The expansion often reveals that the metonymic frame was misdirecting the intervention"
  - "the metonymy-as-cognitive-infrastructure recognition: like conceptual metaphor (lex-kfdep), conventional metonymy stops being experienced as a stand-in and becomes the cognitive default. 'Nixon bombed Hanoi' is not experienced as a metonymy; it is experienced as a description of Nixon's responsibility. The transferable diagnostic: when someone defensively insists that a metonymic description is literally correct ('but Russia DID invade'), suspect that the metonymy has become invisible to them. The defense is the symptom"
  - "the AI-discourse application: contemporary AI policy and alignment discourse is saturated with AGENT-FRAME metonymies ('the AI decided,' 'the AI hallucinated,' 'the AI is biased,' 'the AI is unaligned'). The metonymy picks out output-attribution as the focus, hiding the distributed pipeline that produced the behavior (training data, fine-tuning, RLHF, deployment context, decoding, prompt). Transferable practitioner-discipline: when reasoning about LLM behavior, EXPAND the agent-metonymy back into the pipeline structure that produced it, and check whether the intervention you are proposing addresses the pipeline-level cause or just the agent-level symptom"
status: active
