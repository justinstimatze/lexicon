id: lex-susgz
name: consensus-plan-conceals-the-unassigned-execution-step
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern whenever a group reaches enthusiastic, unanimous agreement on a plan or proposal, and the plan's necessary risky or costly implementation step has not been assigned to a specific, willing, able executor. Aesop's fable 'The Mice in Council' (trans. V. S. Vernon Jones, 1912) states the pattern in full: the mice, plagued by a cat, meet in council; a mouse of standing proposes fastening a bell to the cat's neck so its approach will always be audible; the proposal is 'warmly applauded' and 'it had been already decided to adopt it' — until an old mouse asks the one question the enthusiasm had skipped: 'I agree with you all that the plan before us is an admirable one: but may I ask who is going to bell the cat?' The fable ends there, unresolved, because the answer is that no one will, and everyone knew it once asked — the flaw was never in the plan's LOGIC (a bell genuinely would solve the problem), it was in the plan's SILENCE about who bears the personal risk of installing it. The mechanism: a group evaluating a proposal defaults to assessing it as a PROPOSITION — 'would this work, if it happened?' — a question anyone can answer favorably from safety, rather than as a COMMITMENT — 'who specifically will do this, and have they agreed?' — a question that exposes the real cost immediately. Enthusiastic applause for a plan is evidence the group likes the OUTCOME, not evidence the plan is executable; the two are silently conflated by everyone in the room precisely because no one has yet been asked to be the specific answer to 'who.' The corrective is procedural, not moral: before treating a plan as adopted, ask explicitly who executes the highest-risk or highest-cost step, and require a specific yes from a specific person or role — a plan with no named executor for its hardest step is not a plan, it is a wish with a mechanism attached. Portable beyond the fable: an engineering team agrees 'we should have a documented incident-response runbook,' everyone nods, no one owns writing or maintaining it, and it does not exist when the incident arrives; a strategy meeting agrees 'we should sunset the legacy system,' the room applauds, and the migration never starts because it was never assigned to anyone whose other priorities would yield to it; a city council agrees in the abstract that 'we need more housing,' which polls well right up until the specific parcel and the specific neighbors are named, at which point the abstract consensus evaporates at exactly the concrete step (siting approval) that was never actually secured. Recognize the failure at the moment of applause, not at the moment of failure to deliver — the gap is visible in advance to anyone who asks the concrete question instead of accepting the abstract one."
related: [lex-df6ug, lex-u2kzt, lex-xgyv7]
scaffolds-from: [lex-xgyv7]
evokes: [mice-in-council, belling-the-cat, who-is-going-to-bell-the-cat, plan-as-proposition-vs-plan-as-commitment, applause-is-not-an-executor, unassigned-execution-risk, aesop]
lineage:
  - source: primary
    text: aesop-mice-in-council-belling-the-cat
    citation: "Aesop, 'The Mice in Council' (also widely known as 'Belling the Cat'; attributed to the Aesopic corpus, with attestations across the Greek and Latin fable traditions — the exact classical-source numbering is not independently verified here and is not essential for the claim). Trans. V. S. Vernon Jones, in Aesop's Fables: A New Translation (New York: Avenel Books / London: William Heinemann, 1912; introduction by G. K. Chesterton, illustrations by Arthur Rackham; Project Gutenberg eBook #11339, released 2004). PD (Vernon Jones translation 1912, well past copyright term; Aesopic material itself ancient/anonymous). Note on file provenance: the locally-held source file is named after George Fyler Townsend's 1867 translation, but its actual content, verified against the Project Gutenberg header metadata embedded in the file, is the Vernon Jones 1912 translation — a duplicate under a mislabeled filename, not a distinct 1867 translation. Cited here by the translation actually read."
    quote: "'Once upon a time all the Mice met together in Council, and discussed the best means of securing themselves against the attacks of the cat. After several suggestions had been debated, a Mouse of some standing and experience got up and said, \"I think I have hit upon a plan which will ensure our safety in the future, provided you approve and carry it out. It is that we should fasten a bell round the neck of our enemy the cat, which will by its tinkling warn us of her approach.\" This proposal was warmly applauded, and it had been already decided to adopt it, when an old Mouse got upon his feet and said, \"I agree with you all that the plan before us is an admirable one: but may I ask who is going to bell the cat?\"'"
  - source: cross-attestation
    text: modern-named-owner-conventions
    citation: "Structural, not textual, cross-attestation: modern project-management and organizational practice independently converged on the same corrective this fable dramatizes the absence of — a plan is not treated as real until a specific person is named against its riskiest step. RACI-matrix practice (responsible/accountable/consulted/informed) and the informally documented 'DRI' (directly responsible individual) convention both formalize 'who specifically does this' as a mandatory field on a plan, not an optional afterthought. No claim of textual influence from the fable; offered as independent modern attestation that the plan/commitment gap the fable names is a recurring, diagnosable organizational failure mode rather than a quirk specific to mice."
    quote: "[Structural cross-attestation, not a primary quote: the widespread organizational need to formalize a mandatory named-owner field on any adopted plan is independent modern evidence for the same gap the fable dramatizes — that unanimous agreement on WHAT to do is not evidence of agreement, or even of anyone existing, to do it.]"
canonical-instances:
  - "The direct pattern-application template: a group unanimously endorses a plan; before treating it as adopted, ask who specifically executes its highest-risk or highest-cost step, and require a specific yes from a specific person — silence or vagueness at this question means the plan is not yet a plan."
  - "The textual anchor case itself: the mice's council applauds fastening a bell to the cat, until an old mouse asks who will bell the cat — and the plan dies there, having never been examined past the level of the abstract proposal."
  - "An engineering team agrees in a meeting that 'we should have a documented incident-response runbook'; everyone nods; no one is assigned to write or maintain it; it does not exist when the incident arrives, months later."
  - "A strategy meeting agrees that 'we should sunset the legacy system'; the room applauds the idea; the migration never starts, because it was never assigned to anyone whose other priorities would actually yield to it."
  - "A city council or town hall agrees in the abstract that 'we need more housing,' which polls well right up until the specific parcel and the specific neighbors are named — the abstract consensus evaporates at exactly the concrete siting-approval step that was never actually secured."
critical-questions:
  - "is this the same claim as lex-u2kzt responsibility-diffuses-as-able-actors-multiply (Darley-Latané bystander effect)? No — lex-u2kzt's failure occurs among BYSTANDERS observing an ongoing emergency in real time, each individually assessing whether they personally will be the one to act, with the diffusion happening AT THE MOMENT OF NEED. This atom's failure occurs earlier, at PLAN-FORMATION time, before any emergency exists, when a proposal is approved without anyone confirming an executor exists at all. They compose: even a well-specified plan with a named executor can still fail via lex-u2kzt if that named person hesitates waiting for someone else to move first; but this atom's fable-case is prior and worse — there was never a named executor to begin with, so there is no one for responsibility to even diffuse away from."
  - "is this the same claim as lex-xgyv7 failure-mode-elicitation-by-goal-inversion (Klein's premortem)? No, and they are complementary rather than competing — lex-xgyv7 is the PROACTIVE TECHNIQUE (imagine the plan has already failed, work backward to why) that would catch this fable's flaw if applied before adoption. This atom names the FAILURE MODE that runs to completion when that scrutiny step is skipped: a plan sails through evaluation because everyone assesses it as an abstract proposition rather than as a concrete commitment. This atom is the illustrative disease; lex-xgyv7 is the prescribed inoculation."
  - "is this just the planning fallacy (underestimating time or cost)? No — the planning fallacy presupposes a plan specific enough to have an owner and a timeline, and asks whether that owner's estimate of duration or cost is biased optimistically. This atom's gap is prior to that: the plan has no owner for its hardest step at all, so there is no estimate yet to be optimistic about. A plan can clear this atom's bar (someone is named) and still fall into the planning fallacy afterward."
  - "why does applause make the gap harder to see, rather than easier? Because the group is evaluating the plan as a proposition — 'would this solve the problem, if it happened?' — which is a question anyone can answer favorably from complete personal safety. Enthusiasm for the outcome gets mistaken for confirmation of the mechanism. The gap only becomes visible when someone reframes the same plan as a commitment question — 'who specifically will do this, and have they agreed?' — which is why the fable's turning line is a question, not a counter-proposal."
severity-tier: warning
