id: lex-8a2t3
name: a-messages-fate-turns-on-the-messengers-reputation-rather-than-its-content
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A message can be trusted or dismissed based entirely on the messenger's culturally-coded reputation for luck, without the content of the message itself ever entering the evaluation. A sincere warning delivered by a bad-omen creature gets ignored. The same fate, wished by something read as lucky, gets a bow of thanks. In the Jataka's tale of the two animals, a man's reborn mother tries to warn him away from robbers ahead, and a crane calling out to the robbers to kill him is mistaken for a lucky sign. The narrator names the inversion directly: 'the man does not know what is happening, and drives off his mother, who wishes his welfare, while the crane, who wishes him ill, he worships, under the belief that it is a well-wisher. The man is a fool.' The content of each message was never checked. Only the reputation of whichever creature delivered it."
