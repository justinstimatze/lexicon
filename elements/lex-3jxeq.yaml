canonical-instances:
  - "A small supplier accepts a large retailer's take-it-or-leave-it contract renewal at sharply reduced margins rather than pursue a costly legal dispute, reasoning that any fight would cost more than the shortfall — but under this framework, the operative question isn't the cost of fighting, it's whether the renewal terms are actually fair given both parties' contributions, and if they aren't, the framework treats continued conflict (litigation, seeking alternative buyers, public pressure) as the economically correct choice despite its real costs, precisely because acquiescence locks in an unfair distribution indefinitely."
  - "Two roughly equal-sized companies settling a patent dispute accept a licensing arrangement that splits future royalties in genuine proportion to each side's actual contribution — both sides prefer this to continued litigation specifically because the settlement is fair on its own terms, not merely because litigation is expensive, matching the 'when benefits are fair, peace is preferred' half of the rule."
critical-questions:
  - "who judges whether a treaty's benefits are 'fair,' and does this framework smuggle in exactly the dispute it's supposed to resolve — the weaker party and the stronger party will often disagree sharply about what counts as a fair distribution, and the rule offers no external standard for adjudicating that disagreement, only a directive about what to do once fairness has somehow been determined?"
  - "does 'unfair terms justify war' risk becoming a rationalization any party can invoke, since almost any losing party can characterize a settlement as unfair to justify continued conflict — what would distinguish a genuine application of this principle from self-serving grievance dressed up in its language?"
  - "is the claim that unfair peace is worse than costly war actually true in the long run, or does it discount too heavily the very real, sometimes catastrophic costs of conflict against the more abstract and diffuse cost of an unfair-but-survivable peace — does the rule implicitly assume conflict is winnable at reasonable cost, an assumption that may not hold?"
