canonical-instances:
  - "A landlord who has let a tenant's adult child stay rent-free for years while they 'get on their feet' is met with genuine confusion and anger when finally asked to leave, because the child has come to describe the arrangement to friends as simply 'my apartment' rather than as an ongoing act of generosity that could end."
  - "A company that has quietly absorbed a smaller partner's overflow work for years without a formal contract finds the partner suddenly asserting a right to that work as their own established territory, framing the years of informal accommodation as proof of ownership rather than as a favor that was always revocable."
critical-questions:
  - "how does a generous party protect against this dynamic without becoming so formal or transactional about every act of help that it undermines the actual spirit of generosity being offered?"
  - "is the guest's erasure of the gift's history always cynical, or can it be a genuine, unconscious drift in perception -- does prolonged dependency actually change how people experience the boundary between what's theirs and what's lent, independent of any intent to deceive?"
  - "at what point does continuing to extend hospitality despite early warning signs of this shift become its own kind of failure -- does naming this pattern early enough actually change the outcome, or does an entrenched guest with enough strength or leverage simply proceed regardless of what the giver notices?"
