lineage:
  - source: primary
    text: pryor-1999-dont-shoot-the-dog
    citation: "Karen Pryor, *Don't Shoot the Dog!: The New Art of Teaching and Training* (Revised Edition, Bantam Books, 1999). Pryor's central methodological claim is that complex target behaviors are BUILT by reinforcing successive approximations, not waited-for: 'Devising methods for what Skinner named shaping, the progressive changing of behavior, and carrying out those methods, is a creative process.' Pryor learned the method as head dolphin trainer at Sea Life Park (1963), where traditional force-based training methods (leash, bridle, fist) were impossible to apply — dolphins simply swim away. The constraint forced positive-reinforcement-only training, which Pryor later extended to dogs, horses, zoo animals, children, and self-training. The book popularized the technique outside academic operant-conditioning literature; the broader 'clicker training' movement (which Pryor catalyzed) made shaping accessible to non-specialist trainers worldwide. The transferable claim is the structural one about shaping as a method, separable from the Skinnerian-behaviorist theoretical apparatus and from the specific application domains. In-copyright (Bantam Books); verbatim quotation short and attributed under fair-use. Distinct from lex-da3g3 iteration: iteration is the abstract repeat-until-T operator; shaping is the substantive method for choosing what to reinforce when the target is a behavior. Distinct from lex-exrwy counterexamples-refine: both are progressive-refinement methods but operate on different objects (proofs vs behaviors). Cross-domain attestation: Skinner 1953 *Science and Human Behavior* (the foundational operant-conditioning framework Pryor extends); Lindsley 1971+ Precision Teaching (Ogden Lindsley's educational application of shaping with chart-based progress tracking); Bengio et al. 2009 'Curriculum learning' (ICML — the ML version of shaping: train on progressively-harder examples); Selfridge et al. 1985 + Sutton/Barto 1998 reinforcement learning textbooks (reward shaping as a sub-topic); Vygotsky 1934 zone of proximal development (the developmental-psychology analogue: target behavior should be just-beyond current; not too close, not too far); Kahneman/Klein 2009 deliberate-practice literature (Ericsson et al. — the skill-acquisition analogue; the 'rest-set' of deliberate-practice IS shaping); Bandura 1977 modeling-and-imitation (composes — modeling supplies a candidate approximation; shaping refines it)."
    quote: "[Pryor 1999 *Don't Shoot the Dog!* preface to revised edition:] 'Modern trainers have developed some great shortcuts for reinforcing instantaneously: primarily the use of a marker signal to identify the behavior. This revised version of Don't Shoot the Dog! is about the laws of reinforcement, some practical ways to use those laws in the real world, and the grassroots movement called, at least at present, clicker training, which is taking the technology into new and unexplored terrain.' [On the method's origins:] 'I first learned about training with positive reinforcement in Hawaii, where in 1963 I signed on as head dolphin trainer at an oceanarium, Sea Life Park. I had trained dogs and horses by traditional methods, but dolphins were a different proposition; you cannot use a leash or a bridle or even your fist on an animal that just swims away. Positive reinforcers — primarily a bucket of fish — were the only tools we had.' [On shaping as a creative process:] 'Devising methods for what Skinner named shaping, the progressive changing of behavior, and carrying out those methods, is a creative process.' [On the transferable scope, citing a colleague:] 'As a dolphin researcher whom I worked with sourly put it, \"Nobody should be allowed to have a baby until they have first been required to train a chicken,\" meaning that the experience of getting results with a chicken, an organism that cannot be trained by force, should make it clear that you don't need to use punishers to get results with a baby.' [On the bidirectional nature of training:] 'Training is a loop, a two-way communication in which an event at one end of the loop changes events at the other, exactly like a cybernetic feedback system; yet many psychologists treat their work as something they do to a subject, not with the subject. To a real trainer, the idiosyncratic and unexpected responses any subject can give are the most interesting and potentially the most fruitful events in the training process.'"
canonical-instances:
  - "Dolphin training (Pryor's origin case, 1963 Sea Life Park): impossible to compel a dolphin to perform; positive reinforcement of successive approximations is the only available tool. Pryor shaped behaviors like jumping through hoops, fetching divers, performing aerial behaviors — by reinforcing increasingly-close approximations to target. The constraint-forced discovery: shaping is sufficient for arbitrary behaviors."
  - "Clicker training (Pryor's downstream movement): the click serves as a precise event marker identifying which behavior is being reinforced; reinforcer follows the click. Used by dog owners, zoo keepers, marine mammal trainers, Olympic coaches, and applied behavior analysts working with autism. The shaping primitive operates the same in all these domains; the marker-signal layer (lex-qg753) is a precision tool that makes shaping more efficient."
  - "ML curriculum learning (Bengio et al. 2009 ICML): training neural networks on progressively-harder examples improves convergence and final performance compared to random-order training. Same structural method as shaping: identify what the model CAN currently do, reinforce that with a positive gradient signal, raise the difficulty as competence develops. The ML version is sometimes called 'curriculum learning' but is structurally shaping applied to neural networks."
  - "Reward shaping in reinforcement learning (Sutton/Barto): when sparse rewards make learning intractable, intermediate rewards on the path to the goal provide successive approximations. Same principle: build the target behavior via reinforced approximations. The ML community discovered this independently of Pryor's tradition; the structural form is identical."
  - "Skill acquisition through deliberate practice (Ericsson et al. 1993+): the 'rest-set' of practice tasks targets the gap between current competence and target competence — exactly what shaping does at finer-grained timescales. Coaching is essentially structured shaping with verbal markers + occasional praise reinforcers."
  - "Physical therapy after injury (gait retraining, stroke rehabilitation): the patient cannot suddenly walk normally after a stroke; therapy reinforces successive approximations (weight shift, partial step, full step, paced walking, walking outdoors) over weeks-to-months. The shaping primitive is the operational backbone of rehabilitation."
  - "Self-training programs (weight loss, habit formation, attention regulation): Pryor's own examples — self-reinforcement of small approximations works better than waiting for the perfect behavior to occur. The chart-filling discipline (every-day-fill-in-a-square works better than just-check-marks) is a Lindsley-derived shaping refinement."
  - "Distinguished from lex-da3g3 iteration: iteration is the abstract repeat-until-T loop operator. Shaping is the SUBSTANTIVE method for choosing what to reinforce at each iteration when the target is a behavior. They compose — shaping IS iteration over approximations with a criterion that rises."
  - "Distinguished from lex-exrwy counterexamples-refine (Lakatos): counterexamples-refine operates on PROOFS by lemma-incorporation; shaping operates on BEHAVIORS by criterion-raising. Both are progressive-refinement structures, but the objects refined and the move at each step are different. They compose — both fit under the umbrella of 'refinement methods.'"
critical-questions:
  - "Can you list the successive approximations between current behavior and target? If not, you don't have a shaping plan, you have an aspiration. The practitioner test forces explicit decomposition. Failure mode: declaring shaping as the method while having no concrete approximation sequence — which collapses back to demanding the target behavior directly."
  - "Are you reinforcing approximations or only the target? The failure mode is to reinforce ONLY when the full target appears. If the target is too far from the current behavior, no approximations will be reinforced, no learning will occur, and the trainee will stop trying. The criterion must be calibrated to current capability; if reinforcement isn't happening, the criterion is too high."
  - "Are you raising the criterion too fast or too slow? Pryor's signal: if the behavior starts to break down (frequency drops, accuracy decreases, latency increases), the criterion was raised too fast — drop back one approximation step. If the behavior is perfectly fluent for multiple sessions but no progress is occurring, the criterion is too low — raise it. The calibration is empirical, not theoretical."
  - "Are you using punishment as the dominant tool? Pryor's central argument: punishment (criticism, correction, aversive consequences) DOES alter behavior in the short term but does NOT build the target. Punishment suppresses without specifying what to do instead; reinforcement of approximations builds. The asymmetry is structural. Failure mode: using punishment as a substitute for shaping, then concluding shaping doesn't work because the trainee never produced the target."
  - "Are you accounting for the bidirectional nature of training? Pryor's cybernetic-loop framing: training changes the trainer too. The 'subject' is producing responses that update the trainer's model of what's possible; the trainer is updating the subject's behavior. Treating the subject as a passive target collapses this loop and produces worse training. Failure mode: thinking of training as something done TO the subject rather than WITH the subject."
status: active
