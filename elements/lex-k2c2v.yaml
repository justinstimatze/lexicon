id: lex-k2c2v
name: disrupt-a-conspiracy-at-whichever-role-is-locally-scarce
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When disrupting a coordinated plot with two roles — someone who instigates it and someone who carries it out or enables it locally — don't default to targeting the instigator as the 'root cause' in every case; target whichever role is actually scarce given the plot's structure, because the answer flips depending on whether the plot crosses a boundary or stays within one region. Kautilya works this out across four cases defined by where the instigator and the one who responds (the abettor) are each located — interior or outer regions of the kingdom. For the two CROSS-regional cases, he prescribes targeting the responder, not the instigator: 'The way of successfully overcoming these two types is by tackling the one who responds. More than the instigators, the abettors make the success [of the conspiracy] possible; for, if the abettors are subdued, the instigators will find it difficult to tempt others. To instigate a conspiracy in a different region requires enormous effort and this [itself] is an advantage to the King.' The logic: reaching across a regional boundary to find a willing local accomplice is itself hard and slow, so an instigator who has already succeeded in recruiting one has spent scarce effort that cannot easily be replaced — removing that one cross-boundary bridge denies the whole plot its only working connection. For the two cases where instigator and responder are BOTH in the same region (wholly interior or wholly outer), he reverses the prescription entirely: 'The way of successfully overcoming these two types of conspiracies is to tackle the instigator. For, when the cause of treason is removed, there will be no traitors. If one removes only abettors, others may become so.' Within a single region, a new local accomplice is cheap and easy for the instigator to recruit, so removing one abettor is whack-a-mole — only removing the instigator who keeps generating replacement recruits actually stops the plot. The variable that decides which role to target is never 'which role feels more responsible' or 'which role is the root cause' as a fixed rule — it's whether the plot's structure makes the connecting role SCARCE (cross-boundary, hard to reconstitute) or the generating role SCARCE (same-region, where accomplices are abundant and cheap but the instigator is the one irreplaceable node). Diagnostic move: before deciding whether to target the person who initiates a harmful coordination or the person who locally enables or executes it, map the actual structure of the plot — does it cross a boundary where replacement accomplices are hard to find (target the bridge), or does it stay within one zone where the instigator can cheaply recruit a new local enabler the moment the last one is removed (target the source)?"
related: [lex-3apjn, lex-m7xkd]
