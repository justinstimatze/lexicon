lineage:
  - source: primary
    text: homer-iliad-book-ix-achilles-twofold-fate
    citation: "Homer, *Iliad*, Book IX, trans. William Cullen Bryant (composed orally c. 8th century BCE; canonical Greek text fixed c. 3rd century BCE). Book IX narrates the Embassy to Achilles: Odysseus, Ajax, and Phoenix are sent by Agamemnon to persuade the enraged Achilles, who has withdrawn from battle over the seizure of Briseis, to return to the fighting. Achilles's response to Odysseus's opening plea is the longest single speech in the book. It opens by rejecting concealment or diplomatic softening as such, moves through his refusal of Agamemnon's compensatory gifts (naming wealth and mortal life as goods of fundamentally different, incommensurable kinds), and culminates in Achilles's direct report of his mother Thetis's prophecy — the twofold-fate passage — before he tells the embassy to carry his message home and closes by inviting only Phoenix to stay the night."
    quote: "[Opening refusal of concealment, the anti-euphemism frame for the whole speech:] 'Hateful to me, as are the gates of hell, / Is he who, hiding one thing in his heart, / Utters another. I shall speak as seems / To me the best; nor deem I that the son / Of Atreus or the other Greeks can move / My settled purpose, since no thanks are paid / To him who with the enemy maintains...' [His refusal of any quantity of gifts as compensation, naming wealth and honor as different currencies:] 'Were his gifts / Tenfold — nay, twenty-fold — the worth of all / That he possesses, and with added wealth / From others — all the riches that flow in / Upon Orchomenus, or Thebes, the pride / Of Egypt... nay, should he give / As many gifts as there are sands and dust / Of earth — not even then shall Atreus' son / Persuade me, till I reap a just revenge / For his foul contumelies.' [The recoverable-wealth vs. irrecoverable-life distinction, immediately preceding the prophecy:] 'For not to be compared with life is all / The wealth which, as men say, was treasured up / In Ilium's populous town in time of peace, / Ere the Greeks came, nor all the stores contained / Within the stony threshold of the god / Who bears the bow, Apollo, on the coast / Of rocky Pytho. We may gather spoil / Of oxen and of fatling sheep, and bring / Tripods from war, and yellow-manèd steeds: / The breath of man no force can seize or hold, / And when it leaves the enclosure of the teeth / It comes not back.' [The twofold-fate prophecy itself, the atom's headline claim, stated in Thetis's own reported words:] 'My mother said to me — / The goddess, silver-footed Thetis, said — / A twofold fate conducts me to my death;— / If I remain to fight beneath the walls / Of Ilium, my return will be cut off, / But deathless my renown; if I return / To the dear land in which my fathers dwell, / My glory will be nought, but long my life, / And late will come to me the stroke of death.' [Achilles's own conclusion, choosing — at least at this point in the poem — the long-life branch, and urging the embassy to do the same:] 'And now I counsel all to sail for home, / For never will ye see the overthrow / Of lofty Ilium. Jove the Thunderer / Stretches his great hand o'er her, and her sons / Take courage. Go ye now, and take with you / This message to the princes of the Greeks — / As is the office of an embassy — / And bid them meditate some wiser plan / To save their galleys and the host of Greeks / Within the hollow barques. The plan which brought / You hither cannot serve you while I keep / My anger unappeased. Let Phoenix stay / To pass the night with us, that he may sail / Tomorrow, if it please him, to the land / We love; I take him not against his will.'"
  - source: discovery-loop
    text: distinctness-audit-achilles-twofold-fate-vs-existing-substrate
    citation: "Homer's Iliad, and Achilles's twofold-fate speech specifically, were previously unrepresented in the substrate. Other Homeric material in the substrate draws on the Odyssey (threshold-crossing, depart-trial-return, precommitment, and Ulysses-pact atoms), a different epic with no overlap with the Iliad IX embassy scene; other 'Achilles' references elsewhere belong to unrelated material — Zeno's 'Achilles and the tortoise' paradox, Lewis Carroll's 'What the Tortoise Said to Achilles,' and Jonathan Shay's book titles Achilles in Vietnam and Odysseus in America, cited only by title as moral-injury literature rather than grounding Iliad content directly. The claim is distinct from lex-jey4w (Thoreau, cost-denominated-in-life-hours-not-money-reveals-true-price): Thoreau's claim is a re-denomination move revealing a hidden cost within a single decision (re-pricing an $800 house or a train fare in life-hours), with no structural forced-choice content. This atom's claim is a structural fork between two already-named, mutually exclusive goods, with no hidden-cost-revelation or unit-conversion mechanism involved. It is also distinct from lex-fgc3p (Grandin, detail-attentive-cognition-catches-signal-that-category-generalization-discards): Grandin's own 'you can't have both' claim (general versus hyper-specific intelligence) is a genuine structural-tradeoff family member — the closest neighbor — but it is a continuous capacity-allocation tradeoff within one mind's ongoing cognitive architecture, not a one-time, existential, mutually exclusive branch-point with a point of no return, as Achilles's fork is."
canonical-instances:
  - "The twofold-fate prophecy itself: 'A twofold fate conducts me to my death;— / If I remain to fight beneath the walls / Of Ilium, my return will be cut off, / But deathless my renown; if I return / To the dear land in which my fathers dwell, / My glory will be nought, but long my life, / And late will come to me the stroke of death.' Both branches carry a named good and a named cost; neither is hidden, and no third branch is offered."
  - "The recoverable-wealth vs. irrecoverable-life distinction Achilles states immediately before the prophecy: oxen, sheep, tripods, and steeds can all be regained as spoil, but 'the breath of man no force can seize or hold, / And when it leaves the enclosure of the teeth / It comes not back' — the fork is only existentially weighty because one of its two currencies (mortal life) is non-fungible, which is why 'not to be compared with life is all / The wealth... treasured up' in all of Troy."
  - "Achilles's opening refusal of concealment, framing the whole speech as anti-euphemism: 'Hateful to me, as are the gates of hell, / Is he who, hiding one thing in his heart, / Utters another' — the honest, plainly-stated fork and the refusal of comfortable dishonesty are the same rhetorical move."
  - "A modern cross-domain analogue, responsibly extending rather than quoting Homer: a founder choosing between a high-variance, reputation-maximizing, likely-short-lived venture-backed blitz and a steady, low-variance, long-running but less celebrated business, honestly stated as a genuine either-or rather than a solvable optimization awaiting a clever hybrid plan."
  - "Another modern instance: an elite combat-sport athlete who knowingly trades long-term neurological health for a shot at peak, once-in-a-generation championship glory — the honest framing, per this atom, names both the achievement and the cost as jointly exclusive, rather than treating the health cost as a surprise discovered only later."
critical-questions:
  - "Is this actually a STRUCTURAL fork — where maximizing one named good necessarily and irreducibly forecloses the other — or a PRACTICAL difficulty where a smarter plan, more resources, or more time could still deliver both? Achilles's prophecy is stated as metaphysically certain by a goddess; most apparent forks in ordinary life have not been checked that carefully before being declared forced."
  - "Have BOTH branches' costs been named explicitly and honestly — as Thetis names both 'my return will be cut off' AND 'my glory will be nought' — or is one branch being quietly treated as costless while only the other branch's price is being discussed?"
  - "Is one good being smuggled in as simply superior in every respect, or are both branches being honestly held as genuine goods worth wanting, with the choice turning on which cost is more bearable rather than on one option being a disguised free lunch?"
  - "Is this fork being confused with lex-jey4w's hidden-cost re-denomination (a single decision's price revealed in a different unit, still freely choosable either way) or lex-fgc3p's continuous capacity-allocation tradeoff (an ongoing relative style, not a one-time branch-point), rather than recognized as a one-time, existential, mutually exclusive choice with a genuine point of no return?"
  - "Once the fork is confirmed genuine, is the decision being made with eyes open to the named cost of the chosen branch, or is the chooser quietly hoping — as Achilles explicitly does not — that the foreclosed branch's good might still somehow be recovered later?"
status: active
