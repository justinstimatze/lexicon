id: lex-jgum9
name: creeping-determinism-treats-the-one-realized-history-as-inevitable
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When explaining why a past social, historical, or organizational outcome happened — a war ended, a product succeeded, a policy worked — do not accept an explanation just because it makes the outcome feel like it had to happen. This is creeping determinism: because history only runs once, the counterfactual versions where it turned out differently are invisible, so the single realized outcome gets perceived as having been inevitable all along. This is NOT the same as ordinary hindsight bias (falsely remembering you predicted it) — creeping determinism persists even when you accurately recall having been genuinely uncertain beforehand; knowing an outcome happened is enough to make it feel like it had to happen, independent of what you actually believed in advance. Counter it by explicitly asking what OTHER outcomes were live possibilities at the time, and whether the explanation being offered would have predicted the actual outcome in advance — not just accounted for it after the fact."
related: [lex-tfpzb, lex-vgfgh]
evokes: [creeping-determinism, duncan-watts, everything-is-obvious, hindsight-bias-distinguished, post-hoc-fallacy, sampling-bias, unrerun-history, counterfactual-invisibility, common-sense-explanation-failure]
lineage:
  - source: primary
    text: watts-2011-everything-is-obvious-ch5-history-the-fickle-teacher
    citation: "Duncan J. Watts, *Everything Is Obvious: Once You Know the Answer* (New York: Crown Business, 2011), Chapter 5 ('History, The Fickle Teacher'). Watts introduces creeping determinism through the example of explaining a drop in wartime violence after a troop surge: because history was never re-run under the counterfactual (no surge), we can't observe what would have happened otherwise, and the absence of visible alternate outcomes causes the single realized outcome to be perceived as inevitable. Watts explicitly distinguishes this from hindsight bias — the textbook 'knew it all along' effect, where people misremember having predicted the outcome, and which CAN be corrected by showing people a record of their actual prior predictions. Creeping determinism survives that correction: even a person who accurately recalls having been completely uncertain, or even wrong, beforehand still treats the outcome that actually happened as though it had to happen, purely because it did. Watts pairs this with 'sampling bias' (we attend to and try to explain rare, interesting events — successes, crashes, hits — while ignoring the far larger set of unremarkable non-events that share the same risk factors) to produce what he calls the post-hoc fallacy in commonsense explanation: treating factors that are merely necessary-but-not-sufficient as if they were sufficient, because the only cases we look at are ones where the outcome already happened."
    quote: "This tendency, which psychologists call creeping determinism, is related to the better-known phenomenon of hindsight bias, the after-the-fact tendency to think that we 'knew it all along.' ... Creeping determinism, however, is subtly different from hindsight bias and even more deceptive. Hindsight bias, it turns out, can be counteracted by reminding people of what they said before they knew the answer or by forcing them to keep records of their predictions. But even when we recall perfectly accurately how uncertain we were about the way events would transpire — even when we concede to have been caught completely by surprise — we still have a tendency to treat the realized outcome as inevitable. ... We still believe that it was going to happen, because it did. [Ch.5] ... Together, creeping determinism and sampling bias lead commonsense explanations to suffer from what is called the post-hoc fallacy. [Ch.5]"
canonical-instances:
  - "Watts's own worked example: a troop surge precedes a drop in wartime violence. Because the war was fought only once, there is no observable 'no-surge' version of history to compare against. Even an analyst who correctly recalls having thought the surge might do nothing will still tend to treat the drop as something the surge was bound to cause, simply because the surge happened and the drop happened, in that order."
  - "Business retrospectives: a company's product succeeds, and a case study identifies the '5 things they did right.' The same five things were done by many companies whose products failed and are never studied, because failures don't get written up as case studies — the success looks inevitable in hindsight purely because the failures that shared the same inputs are invisible to the retrospective."
  - "Plane-crash and rare-event investigations (Watts, citing Robyn Dawes on Western Airlines Flight 2605): investigators identify five contributing factors (fatigue, communication mix-up, radio failure, fog, controller confusion) and the combination reads as a compelling, almost inevitable-seeming cause. But the same five factors co-occur constantly without a crash; treating them as sufficient (rather than merely necessary) is the creeping-determinism/post-hoc fallacy acting on a single dramatic case."
  - "Historical 'turning point' narratives generally: a war, an election, or a market crash gets a tidy causal story once the outcome is known, and the story's tidiness is mistaken for evidence of its correctness — when the real test (would this story have predicted the outcome in advance, from the same information available at the time) is rarely applied."
critical-questions:
  - "Would the explanation being offered have PREDICTED this specific outcome in advance, from the information available at the time — or does it only make sense once the outcome is already known? If it only works backward, that's the signature of creeping determinism rather than a genuine causal account."
  - "Is this being confused with ordinary hindsight bias? Hindsight bias is corrected by producing a record of what was actually predicted beforehand. If the feeling of inevitability survives even after confirming genuine prior uncertainty (or a wrong prior prediction), the issue is creeping determinism, not hindsight bias — and the fix is different: it requires surfacing the counterfactual outcomes that never happened, not correcting a memory."
  - "What are the other outcomes that were live possibilities at the time, and why aren't they part of this explanation? An explanation that never engages with what else could have happened is explaining only the one branch that was realized, not the branching structure that produced it."
  - "Distinct from lex-tfpzb (survivorship bias): survivorship bias is a SAMPLING defect — a set of cases has been filtered by an actual selection process (only survivors are observed), and the fix is to recover the eliminated cases. Creeping determinism does not require multiple cases at all — it applies to a SINGLE historical event with no alternate 'runs' to sample from in the first place. The two frequently compound (a single dramatic success both feels inevitable AND is drawn from a filtered sample of similar attempts), but the mechanisms are different: one is about a missing comparison class, the other is about a missing sense of counterfactual possibility within one case."
