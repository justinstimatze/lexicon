name: gentle-questions-from-a-safe-distance-rebuild-approachability
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to earn the trust of someone who is still terrified of you, don't lead with a full explanation or a demand that they look at you and listen -- approach with the smallest, most repeatable, lowest-stakes gesture available, and let each repetition do a little more work than the direct claim 'you can trust me now' ever could. In Cushing's telling, the Serpent, mid-transformation into a gentle man, doesn't announce his new form to the terrified maiden all at once. He starts from behind her, at a physical remove, with the plainest possible question: 'Are you tired, girl?' When she doesn't respond, he doesn't push harder -- he repeats the same low-stakes gesture in a warmer register: 'Are you weary, poor maiden?... in a gentler voice.' Only after a third, still softer repetition does she finally turn enough to see him. Each question costs her almost nothing to ignore and asks nothing of her in return -- no need to look, answer, or trust anything yet -- which is exactly what makes it safe enough to eventually respond to. Diagnostic move: when someone's fear of you is real and justified by recent events, don't try to resolve it with one big reassuring statement -- offer a sequence of small, repeatable, low-stakes contacts that require nothing from them, and let your consistency across repetitions be the evidence, since a person too frightened to process one large claim can often still register a series of small, undemanding ones."
