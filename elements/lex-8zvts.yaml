name: outward-stillness-mimicking-piety-lowers-prey-vigilance
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A predator can lower prey's guard not by hiding but by performing an outward stillness that reads as piety or harmlessness, exploiting the prey's own tendency to interpret a specific visual signal (motionlessness, an averted gaze) as evidence of virtue rather than as evidence of nothing at all. In the Jataka's tale of the hypocritical crane, a crane stands motionless with wings spread near a shoal of fish, and the fish read the posture as devotion: 'See that twice-born bird, how white-- Like a water-lily seeming; Wings outspread to left and right-- Oh, how pious! dreaming, dreaming!' The wise fish among them corrects the reading by naming what the stillness actually signals: 'He is our most treacherous foe; That is why no wing he raises.' The crane's stillness proves nothing at all. It's simply the precondition for an ambush. The naive fish read a necessary condition for predation as a sign of its opposite."
