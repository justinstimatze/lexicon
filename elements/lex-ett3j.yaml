id: lex-ett3j
name: recursive-practice-audit
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When developing skill, periodically audit your practice itself (not just outputs): what am I actually doing, what's it producing, where's the deviation from intention? Recursive practice-audit catches drift that direct skill-pursuit misses."
related: [lex-znaau, lex-wtkuz, lex-spm8x, lex-ewafs, lex-u5869, lex-fmgeg, lex-y6xy9, lex-n42kg, lex-jxaht, lex-6cfu6]
scaffolds-from: [lex-spm8x]
evokes: [meta-protocol-on-the-protocol, is-the-practice-doing-what-it-claims, step-back-from-the-canvas, audit-the-method, second-order-fidelity-check, the-examined-practice]
lineage:
  - source: primary
    text: chapin-2024-review-of-meditation-from-cold-start
    citation: "Sasha Chapin, 'Review: Meditation from Cold Start to Complete Mastery' (Substack post, c. 2023-2024). Chapin presents Mark (meditationstuff)'s 'Meta Protocol' as the central operational discipline of the entire 200,000-word manual: regularly ask — in writing or in your head — what is concretely going on when you practice, and whether it's helping, and where it's going. The Meta Protocol also recursively applies to itself: at intervals, ask whether your self-descriptions of the practice are accurate and helpful. Chapin's commentary makes explicit the failure-mode the Meta Protocol addresses: a meditation practice can encourage a STATE that is a janky bandaid solution to the deeper developmental problem rather than dissolving the problem. Without the meta-audit, the practice can entrench technical-debt rather than pay it down. The headline operational claim — second-order audit of whether the first-order practice is achieving what it claims, recursively applied — is the primary statement."
    quote: "[Chapin 2024 review:] 'The Meta Protocol is simple. As part of your meditative life, frequently ask yourself—in writing or in your head—what, concretely, is going on when you meditate, and whether it\\'s helping, and where you think it\\'s going, and stuff like that. He wants you to do this a lot, and even do a Meta Protocol on the Meta Protocol at times, asking yourself whether your self-descriptions seem to be effective/accurate/helpful.' [And on the failure-mode it prevents:] 'Mark has a specific reason for including this protocol, beyond the value of introspection. He feels that a lot of meditative traditions, which focus on encouraging certain mental states, actually increase your technical debt... maybe you\\'re stressed out a lot because of some emotional issue, and doing a metric tonne of body-scanning practice chills you out. Cool, fine. But the specific chill state you now access habitually might be a janky bandaid solution to the deeper developmental problem... So you\\'ve gone one step forward but you\\'re going to need two steps back eventually. This is something you can maybe avoid if you\\'re doing the Meta Protocol, which will help you keep your eye on the prize.'"
  - source: practitioner
    text: schon-1983-reflective-practitioner
    citation: "Donald Schön, *The Reflective Practitioner: How Professionals Think in Action* (Basic Books, 1983). Schön formulates reflection-in-action and reflection-on-action as the disciplines that distinguish skilled professional practice from rote application of technique. The reflective-practitioner regularly steps back from the immediate execution of the practice to examine whether the practice is achieving the practitioner's evolving understanding of the situation. Schön's central claim: tacit-knowledge-of-practice is updated through cycles of reflection that operate at a level distinct from the practice itself. Cross-attestation in professional-education / organizational-learning of the same structural pattern Chapin/Mark name in subjective-developmental-practice.; in-copyright, procurement queued in. No verbatim quote is claimed here."
  - source: practitioner
    text: socrates-apology-examined-life
    citation: "Plato, *Apology* 38a, the canonical Socratic formulation: 'The unexamined life is not worth living for a human being' (ὁ δὲ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ — exact rendering varies by translator). The transferable claim is the philosophical archetype of recursive-practice-audit applied to the life-as-practice: the discipline of regular second-order examination is what constitutes a worthy human existence per the Socratic position. Already covered via lex-jv983 fluency-trap and other Plato-mining-pass atoms. The Socratic discipline operates at the life-scale; Mark's Meta-Protocol operates at the meditation-session-scale; both are species of the same structural pattern."
    quote: "[Plato, *Apology* 38a, Jowett 1871 trans.:] 'And if I say again that daily to discourse about virtue, and of those other things about which you hear me examining myself and others, is the greatest good of man, and that the unexamined life is not worth living, you are still less likely to believe me.' [The transferable point: the second-order audit of one\\'s life-as-practice is, per Socrates, constitutive of a human-worthy existence. The Greek term ἀνεξέταστος literally 'un-examined' is the absence of the recursive-practice-audit discipline. Cross-temporal attestation ~2400 years before Chapin/Mark; same structural shape applied at life-scale rather than session-scale.]"
canonical-instances:
  - "the Mark Meta-Protocol canonical case (Chapin 2024 + ): a meditator regularly steps out of session-execution to ask: what specifically is happening in my practice? Is it producing what I claim it produces? Is my self-description of the practice accurate? Mark adds the recursive-on-itself step: at intervals, ask whether your self-descriptions are themselves effective/accurate/helpful. The failure-mode prevented: a meditator who habituates to a state-of-calm produced by body-scanning practice can mistake the state-of-calm for the developmental-target when the state-of-calm is actually a janky bandaid that masks the underlying issue. The Meta-Protocol's job is to surface this divergence early"
  - "the Schön reflective-practitioner canonical case (Schön 1983, professional-practice domain): an architect mid-project regularly steps back from the immediate design-execution to examine whether the design is solving the client's underlying problem, not just the surface-formal-program. Schön's empirical observation: skilled professionals exhibit this second-order discipline; rote-applicators don't, and their work fails to adapt as the situation evolves. Cross-substrate attestation with the meditation case: same structural shape (first-order practice + second-order audit-of-practice), different substrate (architecture vs. meditation)"
  - "the Socratic examined-life canonical case (Plato *Apology* 38a): the discipline of recursive examination applied at the life-scale. Socrates asks himself and others 'what am I doing, and does it serve the good I claim to seek?' on an ongoing basis. The Athenian state condemned him for the practice (it makes-people-uncomfortable to be asked the meta-question); Socrates' position is that the examination is constitutive of a worthy human life. Cross-temporal attestation ~2400 years before Mark's Meta-Protocol; same structural shape at a different scale"
  - "the Popper falsifiability-as-meta-discipline canonical case (Popper 1934/1959 *The Logic of Scientific Discovery*): the working scientist is required to ask of every theory-and-protocol 'what would falsify what I am doing?' This is recursive-practice-audit applied to inquiry: the scientific-method's central discipline IS the meta-check on whether the inquiry is producing knowledge-of-the-world or merely confirming-priors. Popper's contribution: the demand for falsifiability is what distinguishes science from pseudo-science; the absence of recursive-practice-audit is the diagnostic of pseudo-science. Cross-domain consistency with the meditation and professional-practice cases"
  - "the painter-stepping-back-from-the-canvas canonical case (cross-domain illustration, no single citation but well-attested in atelier-tradition): a painter at the canvas works in close-up (brush-distance, ~30cm). At regular intervals (every few minutes for a portrait; every hour for a large work) the painter steps back 3 meters or further to assess the work as a whole. The close-up work executes the brushstroke; the stepping-back-audit asks whether the cumulative brushstrokes are producing the intended composition. The two distances of attention serve different functions; the practice fails without the second. Material/visual canonical for ulti-modal lens — the painter's stepping-back is a visible physical instance of recursive-practice-audit"
  - "the IFS-clinician-monitoring-the-unburdening canonical case (Schwartz 1995): in IFS therapy, the clinician runs the unburdening-protocol but ALSO regularly checks whether the unburdening-protocol is producing what it claims. Failure-mode: a part appears to unburden in session but reverts within days; the clinician's recursive-practice-audit catches the reversion and reformulates the protocol. The dual-attention (executing the protocol while auditing it) is what distinguishes the skilled IFS-clinician from the rote-protocol-applier"
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: feedback-loop is the inner control-loop of any goal-directed activity (sense the current-state, compare to target, adjust). Recursive-practice-audit operates one level UP — it asks 'is the goal still the right goal?' and 'is the practice still the right practice?' rather than 'is the execution converging on the goal?' Both are necessary at their respective levels; conflating them leads to false-confidence (the practitioner whose inner feedback-loop is humming may have a deeply-misaligned target that only the second-order audit would catch). The two atoms co-fire: lex-spm8x handles execution, lex-ett3j handles whether-the-execution-is-the-right-thing-to-be-executing"
  - "operationally distinct from lex-znaau premature-closure: premature-closure is a specific failure-mode (resolving an open question before it has been answered). Recursive-practice-audit is the meta-discipline that surfaces premature-closure (the regular audit-of-method would ask 'is this question actually resolved, or have I just stopped asking?'). They are paired: lex-znaau names a thing that can go wrong; lex-ett3j names the discipline that catches it. Many things lex-ett3j catches are NOT premature-closure (it also catches goal-drift, scaling-failure, side-effect accumulation); some premature-closure cases are not caught by recursive-practice-audit (when the meta-audit ITSELF becomes premature-closure)"
  - "operationally distinct from lex-wtkuz descriptive-vs-operational: lex-wtkuz names the discipline of moving from 'what is the case' to 'what should I do given what is the case.' Recursive-practice-audit is the discipline of asking 'is what I'm doing actually doing what I claim it's doing?' lex-wtkuz is about translation between description and action; lex-ett3j is about whether the action is meeting its descriptive claim. They can co-fire: the recursive audit (lex-ett3j) may discover that the descriptive-to-operational translation (lex-wtkuz) was wrong, requiring re-derivation"
  - "operationally adjacent to lex-ewafs wish-with-loophole: wish-with-loophole names the failure-mode where an under-specified goal lets metric-gaming substitute for the actual want. Recursive-practice-audit is one defense against wish-with-loophole — the audit asks 'is what I'm producing actually what I wanted, or have I been gaming a proxy?' The two co-fire as paired discipline: lex-ewafs names the failure-mode; lex-ett3j names the discipline that catches it. The discriminator: not all loophole-shaped wishes are caught by recursive-practice-audit (some loopholes are too clever; some are unrecognized by the auditor); not all recursive-practice-audit catches are loophole-shaped (some are misaligned-goals rather than goal-gaming)"
  - "operationally adjacent to lex-fmgeg compensation-outlives-its-cause: recursive-practice-audit is one way to CATCH a compensation that has outlived its cause. The audit asks 'is the protection-this-adaptation-provides still needed in the current context?' Without the audit, the compensation persists past its context indefinitely. The two atoms are paired discipline: lex-fmgeg names the pattern of persistence-past-context; lex-ett3j names the discipline that detects it. Many other patterns are also caught by lex-ett3j; many compensations-outlives-their-causes are missed by lex-ett3j (audit can be inconsistently applied, or applied at the wrong granularity). The co-fire is productive but not crucial"
critical-questions:
  - "the falsifiable-claim test: does the first-order practice make a claim about what it produces that COULD be checked? Recursive-practice-audit requires a falsifiable claim to operate on. If the practice's claim is 'this makes me more enlightened' with no operational-definition of 'enlightened,' the audit has nothing to check against. Practitioner-discipline: before instituting the audit, articulate what the practice CLAIMS to produce in terms specific enough that the answer 'is it producing this?' could come back NO"
  - "the audit-cadence question: how often should the recursive audit run? Too frequent and the audit interferes with the first-order practice's depth (a meditator who audits every breath cannot meditate; a painter who steps back every brushstroke cannot paint). Too infrequent and significant drift can accumulate before detection. Practitioner-question: what is the maximum drift this practice can absorb before correction is expensive? Audit at half that interval. Mark's recommendation: 'frequently' but not constantly; the cadence is itself something the recursive-recursive-audit calibrates"
  - "the audit-as-bypass risk: can the recursive audit itself become a way to avoid the first-order practice? A common failure-mode in subjective-developmental-practice: 'I'm not meditating today because I'm reflecting on my meditation practice.' The audit is meant to be METHOD-on-method, not REPLACEMENT-for-method. Practitioner-question: am I spending more time auditing than practicing? If yes, the audit has become its own first-order practice and needs its own audit"
  - "the recursive-audit-of-the-auditor: at what level do you stop the recursion? Mark recommends one explicit step (a Meta-Protocol on the Meta-Protocol — auditing whether the audit is accurate and helpful). Further recursion (auditing the audit-of-the-audit) typically has diminishing returns. Practitioner-discipline: one explicit recursion step is usually sufficient; deeper recursion is often a sign of recursive-audit-as-bypass. The discriminator: does the further recursion produce actionable findings, or does it just feel like rigor?"
  - "the audit-versus-rumination distinction: recursive-practice-audit is goal-oriented inquiry ('is the practice producing X?'); rumination is recursive worry without an actionable output ('what if the practice is wrong what if the practice is wrong what if'). The two can look similar from inside but produce very different downstream consequences. Practitioner-question: does this round of audit conclude with a CHANGE-OR-CONTINUE decision? If it concludes with another round of worry, you are in rumination, not audit. The decision-output is the discriminator"
  - "the auditor-trustability check: can you trust your own assessment of whether the practice is working? The practitioner-as-auditor has obvious conflict-of-interest (they want the practice to be working). Recursive-practice-audit benefits from external-perspective input — a teacher, a peer, a journal that captures the audit-output for later re-reading. Practitioner-question: would my audit-finding survive review by someone who doesn't share my investment in the practice? The external-perspective check is one of the most reliable diagnostics for whether the audit is producing accurate findings"
status: active
