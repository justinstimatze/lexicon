id: lex-46nv2
name: own-unmastered-passion-recasts-anothers-freedom-as-pity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Confronting someone who has achieved exactly the freedom you lack, a person still gripped by the desire that person renounced can misread the achievement itself as deprivation — seeing a life with nothing to lose as a life that has lost everything, because their own frame has no category for freedom that doesn't look like accumulation. In the Jataka's tale of Sonaka, king Arindama finally finds his old friend, now a paccekabuddha, meditating in the park; the narrator states the mechanism directly: \"by reason of his being himself given up to evil passion, he fancied he was some poor wretch,\" and addressed him as one: \"His parents dead, with shaven head, clad in monk's robe I see / A wretched Brother in a trance, stretched here beneath this tree.\""
related: []
evokes: [jataka, satthinipata, sonaka-jataka, projection-shapes-perception-of-others, mistaking-freedom-for-deprivation]
lineage:
  - source: primary
    text: jataka-francis1905-sonaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XIX (Satthinipata), No. 529, Sonaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Without saluting him he sat on one side and, by reason of his being himself given up to evil passion, he fancied he was some poor wretch and addressed him in this stanza: His parents dead, with shaven head, clad in monk's robe I see / A wretched Brother in a trance, stretched here beneath this tree."
canonical-instances:
  - "A relative who has spent thirty years chasing promotions looks at a sibling who left a lucrative career to run a small farm and keeps asking, with real concern, when they're going to get back on track — unable to register the sibling's chosen life as anything other than a setback, because status accumulation is the only frame the relative has for a life going well."
  - "An investor who measures every decision by upside potential meets a founder who sold a company early to spend more time with his kids, and describes the founder afterward as someone who left money on the table, never considering that the founder's stated goal was already met."
critical-questions:
  - "The text says the king's misreading happens by reason of his being himself given up to evil passion — is this a general claim that any unresolved craving distorts perception of others' choices, or specific to the particular blind spot of desire, as opposed to fear or grief, which might distort perception differently?"
  - "Sonaka corrects the king's misreading immediately and the king accepts the correction — how often does this reframe actually land, versus the more common case where the person doing the misreading has too much invested in their own frame to accept a stranger's word that they're wrong about what a good life looks like?"
status: active
