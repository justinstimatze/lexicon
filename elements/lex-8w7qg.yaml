    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 7, '\"Speechless Shame and Shameless Speech,\"' on Allen Ginsberg's early poetry about his mother Naomi. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The art is in the mixing up of time and eternity, the amalgamation of muck and gold. What gives Ginsberg’s early poems their durable presence is the way he cuts his idealist visions with great catalogues of actual fact (sick mother Naomi serving him “a plate of cold fish—chopped raw cabbage dript with tapwater—smelly tomatoes—week-old health food”; Naomi exposing herself, “scars of operations, pancreas, belly wounds, abortions, appendix, stitching of incisions pulling down in the fat like hideous thick zippers.”) Ginsberg’s art oscillates between idealizing the actual and actualizing the ideal."
canonical-instances:
  - "A eulogy that only lists a difficult father's virtues rings hollow to anyone who knew him, while one that only lists his failures is simply an airing of grievances; the eulogy that names both the specific harm and the specific love in the same breath is the one mourners remember as true."
  - "A company history that only recites founding-myth triumphs reads as marketing, and one that only lists early failures reads as cynicism, while a history that keeps returning to hard operational specifics right alongside the genuine ambition that drove them earns trust from both employees and customers."
critical-questions:
  - "Is 'durability' actually being measured here, or is this pattern-matching a plausible-sounding aesthetic theory onto Ginsberg's canonical reputation after the fact, when plenty of purely idealizing or purely documentary art has also proven durable?"
  - "Does this formula risk becoming a formula in the bad sense -- could deliberately alternating idealization and grim fact become its own predictable, hollow technique, distinct from the genuine psychological oscillation Hyde is describing in Ginsberg's actual struggle?"
  - "Is the 'mixing' claim doing real explanatory work, or could Ginsberg's poetry's durability be better explained by unrelated factors (his historical position in the Beat movement, institutional canonization, technical skill) that have nothing to do with this specific idealization/fact structure?"
