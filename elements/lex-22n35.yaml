lineage:
  - source: primary
    text: eastman-buffalo-field-mouse-mouse-underpays-the-fox
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'First Evening: The Buffalo and the Field-Mouse.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Please, may I have another piece?' he asked quite humbly. 'Why, I gave you a very large piece! How greedy you are!' exclaimed the Mouse. ... 'Please may I take home a piece of the meat?' he begged. 'I have six little folks at home, and there is nothing for them to eat.' ... 'Why,' declared the Mouse, 'I have already overpaid you for the little work you have done. However, you can take the head, too!' Thereupon the Fox jumped upon the Mouse, who gave one faint squeak and disappeared. _If you are proud and selfish you will lose all in the end._"
canonical-instances:
  - "A founder who has just closed a hard-won, competitive funding round treats the lawyer and accountant needed to actually structure and disburse the funds with dismissive contempt over their fees, not realizing that alienating the people converting the win into usable capital can delay or derail the deal entirely, regardless of how impressive the fundraising victory itself was."
  - "A team that has just won a major client contract treats the operations staff who have to actually deliver the work with escalating stinginess on overtime pay and resources, even as the delivery team's legitimate workload grows, until the operations staff quietly stop going above and beyond, and the celebrated win collapses in execution."
critical-questions:
  - "how does someone in the Mouse's position accurately judge, in the moment, how much genuine leverage the helper actually has -- does the Mouse's contempt stem from an accurate but reckless read of his own power, or from a genuine miscalculation about how dependent he really was?"
  - "does this framework assume the helper will always eventually retaliate when mistreated, when in reality many people in the Fox's position lack the power or the willingness to do so, letting the stinginess go unpunished and reinforcing the very behavior this atom warns against?"
  - "is there a point at which the helper's own escalating demands become unreasonable regardless of how legitimate the original need was, and does treating every instance of push-back from a paying party as 'contempt toward indispensable help' unfairly side with whoever is doing the asking?"
