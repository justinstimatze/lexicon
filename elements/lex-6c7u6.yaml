id: lex-6c7u6
name: association-evidence-substitutes-for-charge-evidence-in-a-hostile-venue
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Before trusting a fair trial to sort out an unprovable specific charge, check whether the venue is hostile enough that evidence of mere association with the accused cause will function as evidence of the charge itself. Frederick Douglass reasoned through exactly this calculation deciding to flee to Canada rather than risk arrest after John Brown's raid on Harper's Ferry: 'I knew if my enemies could not prove me guilty of the offence of being with John Brown they could prove that I was Frederick Douglass; they could prove that I was in correspondence and conspiracy with Brown against slavery; they could prove that I brought Shields Green, one of the bravest of his soldiers, all the way from Rochester to him at Chambersburg; they could prove that I brought money to aid him, and in what was then the state of the public mind I could not hope to make a jury of Virginia believe I did not go the whole length which he went, or that I was not one of his supporters, and I knew that all Virginia, were I once in her clutches, would say let him be hanged.' The specific charge -- murder, robbery, inciting insurrection at Harper's Ferry itself -- was one the government could not actually prove, since Douglass had never been present. But the surrounding facts a hostile jury COULD verify -- correspondence, funding, personal association -- were treated by Douglass as functionally equivalent to proof of the unprovable charge, given the state of public feeling. The rational response to this calculation is not to trust due process to distinguish association from guilt, but to avoid the venue entirely -- flight, not a legal defense, is what the reasoning actually recommends."
