evokes: [when-in-doubt-favor-the-lower-cost-category, kautilya-risky-wrong-and-doubtful-acquisition, an-asymmetric-ranking-resolves-its-own-ties, dont-relitigate-ambiguity-apply-the-standing-default]
lineage:
  - source: primary
    text: kautilya-arthashastra-doubtful-cases-favour-risky-acquisition
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Planning a Campaign,' 'When the Campaign Also Benefits the Enemy,' 'The Three Types,' {9.7.8-13}."
    quote: "'ls it a risky acquisition or not? [Example:] Encouraging a friend of the enemy. Is it a wrong acquisition or not? [Example:] Inciting enemy troops with money and honours. Is it a risky acquisition or a wrong acquisition? [Example:] Seizing the land of a strong neighbour. Is it a wrong acquisition or a risky acquisition? [Example:] Going on a joint campaign by merging forces with those of a more powerful king. In these cases, the conqueror shall choose that course of action which favours risky acquisition.'"
canonical-instances:
  - "A compliance framework classifies vendor gifts as either 'ordinary business courtesy' or 'improper influence,' and rather than convening a review for every ambiguous case (a modest but recurring gift from a long-standing partner), the policy sets a standing default that genuinely borderline cases are treated as ordinary courtesy up to a fixed value, reserving full review for cases well outside that range."
  - "An editorial policy sorts stories into 'in the public interest' and 'unwarranted invasion of privacy,' and for cases that plausibly fit either label, the newsroom applies a standing rule to lean toward publication when the ambiguity can't be resolved quickly, rather than holding every borderline story for a fresh, from-scratch ethical deliberation."
critical-questions:
  - "does always defaulting ambiguous cases toward the already-preferred category risk quietly expanding that category's real-world footprint over time, since every genuinely unclear case gets absorbed into it rather than a roughly even split between the two labels?"
  - "how would an organization verify that a case is genuinely ambiguous rather than actually belonging in the disfavored category but being framed as ambiguous specifically to trigger the favorable default -- does this rule create an incentive to manufacture uncertainty?"
  - "is the asymmetry between the two categories (one justified by necessity, one by self-generated blowback) actually as clean in practice as it is in the stylized framework, or do real cases often have elements of both, making the 'which one is more legitimate' judgment itself contestable rather than settled in advance?"
