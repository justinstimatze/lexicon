id: lex-xr5m6
name: a-positive-metaphor-substitutes-for-an-unpalatable-literal-truth
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A frightening or unpalatable prospect can be made acceptable by substituting a positive figurative image for the literal thing, converting dread into appeal through metaphor alone rather than through any change to the underlying fact. In the Jataka''s tale of Tundila, death and moral purification are reframed as bathing in a crystal pool: "The law is the fair crystal pool, Sin is the stain of sweat, they say: Virtue''s the ointment wonderful, Whose fragrance never will decay."'
related: []
evokes: [jataka, chanipata, tundila-jataka, positive-metaphor-replaces-literal-dread, figurative-substitution-makes-truth-acceptable]
lineage:
  - source: primary
    text: jataka-chalmers1895-tundila-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 388, Tundila-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The law is the fair crystal pool, Sin is the stain of sweat, they say: Virtue's the ointment wonderful, Whose fragrance never will decay."
canonical-instances:
  - "A hospice counselor describes the dying process to a frightened family as 'the tide going out,' and the image alone makes the family able to sit with a conversation the clinical description of organ failure had made unbearable."
critical-questions:
  - "Does a comforting metaphor risk obscuring facts a person actually needs to know clearly in order to make good decisions, even as it makes the truth easier to sit with?"
  - "Whose interest is served by making an unpalatable truth easier to accept — does the metaphor serve the listener, or does it mainly serve whoever needs the listener to stop resisting?"
status: active
