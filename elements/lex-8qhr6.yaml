id: lex-8qhr6
name: an-organizations-stated-mission-can-need-its-own-problem-to-persist
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an organization's stated mission is to fix a problem, check whether its own institutional relevance and funding actually rise and fall with that problem's severity -- even when the organization did not create the problem and isn't lying about wanting to end it. Douglass names the American Colonization Society doing exactly this with the persecution of free Black Americans in the 1850s. As conditions worsened, 'the American Colonization Society, with hypocrisy written on its brow, comes to the front, awakens to new life, and vigorously presses its scheme for our expatriation upon the attention of the American people. Papers have been started in the North and the South to promote this long cherished object—to get rid of the negro, who is presumed to be a standing menace to slavery. Each of these papers is adapted to the latitude in which it is published, but each and all are united in calling upon the government for appropriations to enable the Colonization Society to send us out of the country by steam. Evidently this society looks upon our extremity as their opportunity, and whenever the elements are stirred against us, they are stimulated to unusual activity.' The Society did not manufacture the anti-Black hostility it capitalized on -- other actors did that. But its proposed remedy, expatriation, only found an audience in proportion to how unbearable conditions became, which means the organization's own institutional health moved in lockstep with the persistence and worsening of the very problem it claimed to be solving, without requiring conscious bad faith from any individual member. The diagnostic move: check the correlation between a remedy-organization's funding, attention, and growth and the trajectory of the problem it exists to address -- an organization whose fortunes rise specifically when the problem worsens has an incentive gradient running counter to its own stated goal, regardless of any individual member's intentions."
related: [lex-vw8c3]
evokes: [our-extremity-as-their-opportunity, hypocrisy-written-on-its-brow, they-do-not-deplore-our-misfortunes-but-rejoice-in-them, a-remedys-fortunes-tied-to-the-problems-severity]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch9-colonization-society
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter IX, 'Increasing Demands of the Slave Power' -- from an address Douglass gave to the American Anti-Slavery Society, reproduced in full in this chapter."
    quote: "“While the colored people are thus elbowed out of employment; while a ceaseless enmity in the Irish is excited against us; while State after State enacts laws against us; while we are being hunted down like wild beasts; while we are oppressed with a sense of increasing insecurity, the American Colonization Society, with hypocrisy written on its brow, comes to the front, awakens to new life, and vigorously presses its scheme for our expatriation upon the attention of the American people. Papers have been started in the North and the South to promote this long cherished object—to get rid of the negro, who is presumed to be a standing menace to slavery. Each of these papers is adapted to the latitude in which it is published, but each and all are united in calling upon the government for appropriations to enable the Colonization Society to send us out of the country by steam. Evidently this society looks upon our extremity as their opportunity, and whenever the elements are stirred against us, they are stimulated to unusual activity. They do not deplore our misfortunes, but rather rejoice in them, since they prove that the two races cannot flourish on the same soil.”"
canonical-instances:
  - "The direct textual anchor: the American Colonization Society's fundraising papers, adapted 'to the latitude in which it is published,' rose to 'unusual activity' specifically 'whenever the elements are stirred against us' -- the organization's own record of its activity level tracks the intensity of the persecution it proposed to relieve by removing its targets from the country entirely, rather than by ending the persecution."
  - "Hypothetical: a nonprofit's annual fundraising campaign performs best in years when the crisis it addresses is most visibly worsening, producing quiet institutional relief rather than alarm when a bad year for the cause becomes a good year for the organization's budget."
critical-questions:
  - "Operationally distinct from lex-vw8c3 (producer-supplies-both-need-and-satisfaction-creating-structural-lock-in): that atom requires the SAME entity to both manufacture the need and supply the satisfaction, a tight closed loop (the platform creates the loneliness it then monetizes relief from). This atom is looser and more common -- the Colonization Society did not create anti-Black hostility, it only benefits from a problem other actors caused, which is a structural hazard that can afflict a genuinely well-intentioned remedy organization with no manufactured-need mechanism at all."
  - "How would an outside observer tell, from the correlation alone, whether a given remedy organization is caught in this incentive gradient versus one whose growth simply reflects the problem's objective growth for reasons having nothing to do with the organization's own choices? Correlation between an org's fortunes and a problem's severity isn't by itself proof the incentive is shaping behavior."
  - "Does an organization caught in this gradient inevitably drift toward preferring the problem's persistence over time, or can genuine internal accountability -- external audits, sunset clauses, goals tied to the problem's actual resolution rather than to activity metrics -- counteract the drift?"
status: active
