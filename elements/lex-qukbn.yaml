lineage:
  - source: primary
    text: hyde-the-real-self-behind-a-tricksters-shifting-masks-may-be-the-readers-own-projection
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Hallmarks of Trickster's Mind,' discussing Odysseus, Melville's The Confidence-Man, and Pietro Pucci's reading of the Odyssey. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "If Odysseus can play so many roles, if he can play a part, as Athena once says, “as if it were [his] own tough skin,” then who is the real Odysseus? ... It is our habit to imagine a true self behind the shifting images, but it is sometimes difficult to know if that self is really there, or just the product of our imaginings. ... his “true self” is hopelessly hidden, or doesn’t exist. ... Pietro Pucci contends that because Odysseus is always manipulating reality, disguising his body and telling lies about his past, he “removes himself from his ‘real’ self and falls into shadowy and intermediary postures in which he will at once be himself and not himself, true to his temper and disloyal to it.” ... concluding that “the disguising scenes [themselves] are what create the illusion of his ‘real self.’”"
canonical-instances:
  - "Biographers of a public figure who was famously different in every interview spend decades arguing about which version was the 'authentic' one, each building a plausible unifying theory from the same scattered evidence, without ever confronting that the disagreement itself suggests no single authentic version is recoverable from performances alone."
  - "Coworkers who only ever see a colleague through a string of professionally calibrated personas -- warm with clients, ruthless in negotiations, self-deprecating with the team -- confidently describe 'who they really are underneath it all,' when what they're actually describing is the pattern they've unconsciously stitched together to make the personas feel like one person."
critical-questions:
  - "Does this claim prove too much -- if it's impossible in principle to distinguish a real self from the observer's projected unity, does that make the concept of a 'real self' behind any public performance unfalsifiable and therefore not a very useful skepticism to apply generally?"
  - "Are there cases where private, unobserved behavior (what someone does when no one is performing for anyone) gives genuine evidence of a self behind the masks, which would mean the claim applies only to purely public figures like Odysseus or the Confidence-Man, not to people we know privately?"
  - "If there is in fact no real self behind trickster's masks, does that mean the masks themselves are all there is to know, and if so, is 'no self' functionally different from 'an unusually fluid self,' or is this a distinction without a difference?"
