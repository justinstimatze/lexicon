canonical-instances:
  - "A startup chooses a smaller investor who commits promptly and reliably writes the agreed check on schedule over a prestigious larger investor whose term sheet keeps slipping through additional rounds of diligence, because by the time the larger investor might actually wire funds, the specific opportunity the money was meant to fund (a limited-time acquisition, a narrow hiring window) has already closed."
  - "A nonprofit relies more heavily on a base of small, recurring monthly donors than on the promise of one large one-time grant from a foundation still deliberating, because the recurring donors' aggregate giving is predictable and compounds reliably, while the large grant carries real risk of being reduced, delayed, or declined once the foundation's board actually reviews the ask."
critical-questions:
  - "how would a party actually estimate, in advance, the real probability of withdrawal or delay behind a large contributor's offer -- is there a reliable way to price this discount, or does the framework risk becoming a rationalization for always preferring smaller, safer options even when a large contributor's follow-through is genuinely solid?"
  - "does this principle undervalue the cases where only a large, one-time contribution can actually meet the need at all -- a small, steady stream of help that never reaches the threshold required to fund a specific large outlay may be reliable but insufficient, and the framework doesn't specify a break-even point where scale has to win regardless of reliability?"
  - "in the mobilization-speed case, does preferring the weaker, faster, more controllable ally risk winning the immediate opportunity while losing a larger strategic advantage that only the mightier ally's resources could have secured -- is there a tradeoff between capturing THIS opportunity and building capacity for the NEXT one that the framework doesn't address?"
