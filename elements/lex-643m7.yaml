id: lex-643m7
name: consequences-track-actions-eventually-even-when-the-link-is-not-immediately-visible
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When you act, the consequences of your action will eventually catch up to you — even when the causal link is not immediately visible at the moment of action, even when there are time-lags that disguise the connection, even when intermediate buffering layers absorb the early signal. The proverb-tradition's transferable claim is that THE CONSEQUENCE-TRACKING IS STRUCTURAL, not karmic or moral. 'You reap what you sow,' 'as you sow, so shall you reap,' 'sow the wind, reap the whirlwind' (Hosea 8:7), 'chickens come home to roost,' Yoruba traditional teaching on consequence-action linking. The transferable move is to assume that ANY ACTION HAS A CONSEQUENCE-TAIL — a distribution of downstream effects that propagate through the system. Some of those effects come back to the actor on a delay. Cheap talk has small consequence-tails (no propagation channel); expensive coordinated action has larger consequence-tails. Pollution into a commons has a multi-decade consequence-tail. Trust-violations have consequence-tails through network reputation. Code architecture decisions have consequence-tails through subsequent development. The atom's diagnostic: when contemplating a low-immediate-cost action whose downstream effects are uncertain, ask 'what is the consequence-tail of this action — to whom does it eventually return, and on what time-lag?' If the consequence-tail is invisible because of system buffering (pollution absorbed by a forest sink; a small deception absorbed by general trust capital; a microaggression absorbed by social inertia), the consequence is STILL ACCUMULATING — the buffer is finite. The atom is silent on moral framing (karma, deserved punishment, etc.); what it claims is the STRUCTURAL observation that systems propagate action-signals through causal chains, and the proverb-tradition's empirical sample of human behavior has calibrated to that observation. Be careful with the inverse failure mode: not every action returns to the actor. Truly externalized costs (pollution that genuinely doesn't return; one-shot interactions with strangers) have consequence-tails that don't reach the actor. The atom applies when the actor is embedded in a system with sufficient feedback channels (a community, a body, a reputation network, a code base, an ecosystem) for the consequences to find their way back."
