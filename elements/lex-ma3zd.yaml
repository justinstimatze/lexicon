lineage:
  - source: primary
    text: harvey-2005-a-brief-history-of-neoliberalism
    citation: "David Harvey, *A Brief History of Neoliberalism* (Oxford University Press, 2005), Ch.6 'Neoliberalism on Trial,' section 'Accumulation by Dispossession.' Harvey is a geographer and social theorist (CUNY Graduate Center; formerly Johns Hopkins, Oxford); this book is his widely-cited historical and structural account of neoliberalism's rise since the 1970s. The section argues that Marx's 'primitive accumulation' should be understood not as a closed historical precondition of capitalism but as a permanently available accumulation strategy, most visibly reactivated under neoliberal policy."
    quote: "[On the persistence of primitive-accumulation-type mechanisms into the present, listing instances alongside the historical enclosure case:] '...the commodification and privatization of land and the forceful expulsion of peasant populations... conversion of various forms of property rights (common, collective, state, etc.) into exclusive private property rights... suppression of rights to the commons; commodification of labour power and the suppression of alternative (indigenous) forms of production and consumption; colonial, neocolonial, and imperial processes of appropriation of assets (including natural resources)... and usury, the national debt and, most devastating of all, the use of the credit system as a radical means of accumulation by dispossession. The state, with its monopoly of violence and definitions of legality, plays a crucial role in both backing and promoting these processes.' [On the addition of modern mechanisms to the list:] 'To this list of mechanisms we may now add a raft of techniques such as the extraction of rents from patents and intellectual property rights and the diminution or erasure of various forms of common property rights (such as state pensions, paid vacations, and access to education and health care) won through a generation or more of class struggle.' [The four-feature definition:] 'Accumulation by dispossession comprises four main features: 1. Privatization and commodification. The corporatization, commodification, and privatization of hitherto public assets has been a signal feature of the neoliberal project. Its primary aim has been to open up new fields for capital accumulation in domains hitherto regarded off-limits to the calculus of profitability. Public utilities of all kinds (water, telecommunications, transportation), social welfare provision (social housing, education, health care, pensions), public institutions (universities, research laboratories, prisons) and even warfare... have all been privatized to some degree throughout the capitalist world.' [On crisis as an occasion for dispossession, not merely a disruption:] 'financial crises are deliberately engineered to facilitate accumulation by dispossession.' [Harvey's own summary framing of neoliberalism's institutional role, from the book's Introduction, establishing the state-backing claim that recurs through the dispossession argument:] 'The role of the state is to create and preserve an institutional framework appropriate to [neoliberal] practices... it must also set up those military, defence, police, and legal structures and functions required to secure private property rights and to guarantee, by force if need be, the proper functioning of markets... if markets do not exist... then they must be created, by state action if necessary.'"
  - source: discovery-loop
    text: distinctness-audit-harvey-accumulation-by-dispossession
    citation: "Lex-0457 (Marx, removing-non-market-exits-makes-market-dependence-structural, grounded in Marx's Capital Vol. I Part VIII, the original primitive-accumulation chapter) names the mechanism: eliminating non-market subsistence alternatives forces market dependence. This atom makes a claim about that mechanism's timing and scope — a permanent, recurringly-activated strategy rather than a closed, one-time founding stage — genuinely distinct from lex-ewjec but directly composable with it. Lex-0718 (Schumpeter, qualitative-progress-requires-destruction-of-prior-structures) is also distinct: Schumpeter's claim concerns competitive market innovation destroying incumbent firms and products through ordinary market competition, while Harvey's claim concerns state-backed transfer of previously non-commodified assets into private capital, typically without any competitive-innovation component. Harvey's own text uses the phrase 'creative destruction' once in passing, but the substantive claim grounded here is not Schumpeter's."
canonical-instances:
  - "Chile's pioneering privatization of state pension rights under the Pinochet dictatorship, which Harvey cites as a template later pursued by Republican policymakers in the United States — an instance of state-backed transfer of a previously public, collectively-managed asset into individually-held, commercially-managed private accounts."
  - "The 2008 global financial crisis and its aftermath, read through this atom's lens: a debt- and credit-system-driven crisis followed by waves of foreclosure, asset write-downs bought cheaply by better-capitalized firms, and austerity-driven privatization of public services — Harvey's own claim that financial crises can be 'deliberately engineered to facilitate accumulation by dispossession,' or at minimum exploited as an opportunity for it regardless of original intent."
  - "The TRIPS (Trade-Related Aspects of Intellectual Property Rights) agreement within the WTO, which extends patentability to genetic material and seed plasmas developed over generations by traditional agricultural communities, then permits rent extraction from the same populations whose practices produced the original knowledge — a direct modern parallel to Harvey's account of colonial appropriation of common knowledge and resources."
  - "The privatization of a public utility (water, transit, or telecommunications) that had previously been funded and governed as a shared, non-market resource — evaluated through the atom's question of whether the transfer represents production-efficiency gains, an ownership-and-revenue-stream transfer, or (in Harvey's account, most often) both at once, with the state's regulatory and legal power required to legitimate and enforce the new private property claim."
critical-questions:
  - "Is this transfer of an asset into private hands being evaluated only for its effect on production efficiency, or also for whether it constitutes dispossession — a previously public, common, or non-market resource becoming a source of private extraction, regardless of any efficiency gain?"
  - "What state power (legal redefinition of property, enforcement, coercion, or crisis-management authority) was required to make this transfer possible, and who backed it?"
  - "Is a crisis being treated purely as an unfortunate disruption, or is it also functioning as an occasion for dispossession-based transfer that would not have been politically achievable in ordinary times?"
  - "Is this mechanism actually Schumpeterian creative destruction (competitive innovation displacing an incumbent through market competition, lex-h8t7s) or accumulation by dispossession (state-backed transfer of a non-commodified asset into private capital, this atom)? The two can co-occur but are not the same mechanism and should not be conflated."
  - "Is 'primitive accumulation' being treated as a closed historical stage capitalism has moved past, or is the same structural mechanism being watched for as a standing, recurringly-available strategy in the present?"
