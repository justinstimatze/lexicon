id: lex-p9dfj
name: designed-procedural-friction-as-reinternalization-of-externalized-costs
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When externalized costs need re-internalizing, deliberate procedural friction is the lever — make the externalizer pay the friction. Don't ban; tax. Don't argue; require waiting periods. The friction route is more robust than the prohibition route."
