id: lex-sp7fa
name: every-framing-highlights-some-aspects-and-makes-others-invisible
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you adopt a metaphor, frame, model, or lens for a domain, Lakoff & Johnson's transferable claim is that the framing necessarily HIGHLIGHTS some aspects and HIDES others. There is no neutral framing. The very systematicity that makes a metaphor useful (it lets you reason about one domain via another) is what hides the aspects that don't fit the source-domain. ARGUMENT-IS-WAR highlights the adversarial-zero-sum-strategic aspects of arguing and HIDES the cooperative-mutual-understanding aspects. TIME-IS-MONEY highlights the budgetable-spendable aspects of time and HIDES the cyclical-relational-experiential aspects. LABOR-IS-A-RESOURCE highlights the quantifiable-activity aspect of labor and HIDES the meaningful-satisfying-humane aspects. The hiding is not accidental — it is the inverse of the highlighting; you cannot have one without the other. Practitioner discipline (the transferable affordance): when you adopt a framing, IMMEDIATELY ask 'what is this making invisible?' The hidden aspects don't disappear from reality; they only disappear from the framing. When you act on the framing, the hidden aspects WILL surface as second-order consequences, surprises, externalities, complaints, or eventual collapse. The 'what is this hiding?' question is the transferable debugging move. Specific failure modes: (1) treating one framing as the whole picture and being repeatedly surprised by aspects the framing made invisible (LABOR-IS-RESOURCE management styles repeatedly surprised by motivation, meaning, burnout — those are the hidden aspects asserting themselves); (2) defending a chosen framing against critics who are pointing at the hidden aspects (this is one route by which lex-2kjmb organisms-minimize-surprise pathology manifests as 'shoot the whistleblower'); (3) using a single framing for a domain that requires multiple framings to act on (BUSINESS-IS-WAR is useful for competitive-strategy AND blinding for talent-retention; both framings are needed). Practitioner moves: (a) when adopting a framing, explicitly note what it's hiding; (b) when you can, deliberately apply a SECOND framing that highlights what the first hides; (c) when surprised by a result, ask 'what framing was I using that hid this'; (d) when designing for others, label your framing as a framing so users can apply their own complementary framings. Distinct from lex-kfdep conceptual-metaphors-structure-cognition (meta-claim) and lex-zwnfz orientational-metaphors (specific sub-class). This atom names the GENERAL PROPERTY of all framings (not just metaphors) that they have hidden inverse-of-highlight aspects. Generalizes from Lakoff-Johnson's specific claim about conceptual metaphors to the broader epistemological claim about framings, models, lenses, and abstractions."
