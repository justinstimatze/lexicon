id: lex-zju29
name: skimming-value-from-a-collision-exposes-you-when-it-actually-connects
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you profit by positioning yourself close to a recurring conflict between two much larger forces, weigh that proximity against the risk of the exact moment they actually connect. The Panchatantra's jackal repeatedly slips between two rams locked in ritualized head-butting to lap up the blood from each clash, surviving many rounds — until the pattern that made this profitable (predictable near-misses) fails once, and he is caught between the crashing heads and killed. A bystander in the story sees it coming and says so plainly: if the jackal happens to be between the rams just when they crash, he will certainly die. The jackal ignores the warning because every prior round has ended in a near-miss. Extracting value from friction between two colliding parties means occupying the exact spot the collision will eventually land on."
related: []
evokes: [panchatantra, loss-of-friends, skimming-a-collision-exposes-you-eventually, proximity-to-conflict-is-not-free]
lineage:
  - source: primary
    text: panchatantra-ryder1925-the-jackal-at-the-ram-fight
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book I, nested inside 'Godly and June.' Verified verbatim against a direct extraction of the held copy."
    quote: "Now the next time, being greedy as ever to lap up the blood, the jackal did not move away, was caught between the crashing heads, and was killed."
canonical-instances:
  - "a middleman who profits by brokering deals between two feuding business partners, feeding off the friction of their repeated disputes, gets legally and financially crushed the one time the partners' dispute actually resolves into open litigation that names him as a party."
critical-questions:
  - "How would the jackal, or anyone in a similar skimming position, actually know in advance which specific instance of a recurring collision is the one where the near-misses finally fail, given that every prior instance looked identical right up until it didn't?"
  - "Is the danger really inherent to the skimming position itself, or does it only apply when the skimmer becomes complacent from repeated survival — would a jackal who treated every single approach as newly dangerous have avoided this outcome indefinitely?"
status: active
