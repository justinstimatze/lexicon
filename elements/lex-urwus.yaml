    quote: "As yonder king goes galloping with his milk-white four-in-hand, Dingy has these, his pair of Geese, to bear him over the land!"
canonical-instances:
  - "A junior staffer who rides in the executive's car to the same meetings, sits near the same table, and hears the same briefings starts speaking in meetings as though their own opinion carries the executive's authority, mistaking proximity to decision-making for possessing it."
critical-questions:
  - "Is there a version of this comparison that would actually be legitimate — some threshold of genuine shared standing where 'I am carried like a king' stops being a category error and starts being an accurate description — and where exactly does Dingy's case fall short of it?"
  - "Would Dingy have made the same mistake if he hadn't been physically elevated and moving through the same public space as the king at that exact moment, or is the error specifically triggered by literal spatial parallel rather than any more abstract form of proximity?"
