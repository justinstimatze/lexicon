id: lex-p9sws
name: renouncing-the-object-of-attachment-doesnt-remove-the-attachment-itself
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A person who formally renounced their primary attachments can be shown to have unconsciously redirected the identical attachment structure onto a substitute object, revealing that outward renunciation of the object does not by itself eliminate the underlying attachment mechanism. In the Jataka''s tale of Somadatta, this is observed of the ascetic who left his family only to grieve an adopted elephant as his son: "This ascetic left wife and child for religion, now he is lamenting the young elephant whom he called his son, I will rouse him and make him think."'
related: []
evokes: [jataka, sattanipata, somadatta-jataka, attachment-relocated-not-eliminated, renunciation-doesnt-remove-the-mechanism]
lineage:
  - source: primary
    text: jataka-chalmers1895-somadatta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 410, Somadatta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "This ascetic left wife and child for religion, now he is lamenting the young elephant whom he called his son, I will rouse him and make him think,"
canonical-instances:
  - "An executive who sold his company specifically to escape the stress of being responsible for other people's livelihoods spends the next year just as anxiously fixated on a single angel investment, having relocated the exact same worry onto a smaller target."
critical-questions:
  - "Is the underlying disposition to attach itself the thing that would actually need addressing, rather than any particular object it happens to have found?"
  - "How would a person tell the difference, from the inside, between having genuinely let go of an attachment and having simply moved it somewhere less visible?"
status: active
