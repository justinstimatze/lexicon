id: lex-rpwjb
name: wrongdoing-collapses-under-direct-confrontation-without-a-fight
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When normative appeals fail to move an opponent, combat can be proposed as the only remaining decision procedure — but no battle actually needs to occur: faced with sustained, unwavering confrontation and no capitulation, the wrongdoer can simply collapse rather than being defeated by force, so that the resolution demonstrates wrongdoing cannot withstand direct moral confrontation rather than that it lost a contest of strength. Wrong, in the Jataka''s tale of Right and Wrong, demands exactly such a battle ("Nor if you worthy be, nor if you pray, Nor if it be but fair, will I give way: Here let us two to-day a battle wage; He shall have place, whoever wins the fray."). None follows: the moment Right stands firm, Wrong plunges into the earth unforced. "The words no sooner heard, Wrong from the height Plunged over heels head-foremost out of sight: This was the end and direful fate of Wrong. I had no battle, though I longed to fight."'
related: []
evokes: [jataka, ekadasanipata, dhamma-jataka, self-defeating-wrongdoing, confrontation-without-combat]
lineage:
  - source: primary
    text: jataka-chalmers1895-dhamma-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 457, Dhamma-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The words no sooner heard, Wrong from the height Plunged over heels head-foremost out of sight: This was the end and direful fate of Wrong. I had no battle, though I longed to fight."
canonical-instances:
  - "A manager caught fabricating expense reports, confronted directly and without hedging in front of the full team, resigns on the spot before anyone has proposed any consequence at all."
critical-questions:
  - "Is this a claim about how wrongdoing actually behaves under confrontation, or a narrative convenience that lets the tale avoid depicting an actual fight between its personified abstractions?"
