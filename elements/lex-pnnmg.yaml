lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch10-buchanans-course
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter X, 'The Beginning of the End.'"
    quote: "“The shameful and shocking course of President Buchanan and his Cabinet towards this rising rebellion against the government which each and all of them had solemnly sworn to ‘support, defend, and maintain’—that the treasury was emptied, that the army was scattered, that our ships of war were sent out of the way, that our forts and arsenals in the South were weakened and crippled,—purposely left an easy prey to the prospective insurgents,—that one after another the States were allowed to secede, that these rebel measures were largely encouraged by the doctrine of Mr. Buchanan, that he found no power in the constitution to coerce a State, are all matters of history, and need only the briefest mention here.”"
canonical-instances:
  - "The direct textual anchor: Douglass pairs the material weakening (empty treasury, scattered army, displaced ships, crippled forts) with an explicit doctrinal cover story -- Buchanan's public position 'that he found no power in the constitution to coerce a State' -- which supplied a principled-sounding reason for inaction that the material sabotage then quietly exploited."
  - "Hypothetical: a departing agency head, sympathetic to the industry the agency regulates, spends his final year in office reassigning experienced investigators to unrelated projects, letting enforcement staff positions go unfilled, and delaying a scheduled equipment refresh -- none of it individually reportable as misconduct, all of it leaving his successor's agency materially less capable of acting against that industry the moment he is gone."
critical-questions:
  - "How does an observer distinguish this pattern from ordinary end-of-term drift, lame-duck disengagement, or genuine incompetence, none of which require sympathy for what follows? The diagnostic likely requires checking whether the specific weaknesses created align suspiciously well with the interests of a known anticipated opponent, rather than being generically diffuse."
  - "Does the mechanism require the outgoing official to hold formal doctrinal cover (Buchanan's anti-coercion constitutional theory), or can it operate through pure administrative passivity with no articulated justification at all?"
  - "What internal or external check could have interrupted this pattern in real time, given that no single action in the sequence was clearly impeachable on its own -- is after-the-fact historical judgment the only tool available, or are there structural safeguards (mandatory transition audits, fixed institutional baselines) that could catch a sabotage-via-neglect pattern while it is still happening?"
