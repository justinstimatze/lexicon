id: lex-zq3e4
name: teaching-a-general-principle-lets-the-listener-self-apply-it
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Rather than issue a direct command about a specific situation, answering only in abstract, general terms about how to judge the underlying category lets the listener reason their own way to the correct specific conclusion — the realization lands as their own, not as an order followed. In the Jataka's tale of the tempted ascetic, the father answers only in the abstract, describing the traits of a trustworthy companion versus a fickle one, without ever mentioning the actual woman: 'One that can gain thy confidence and love, Can trust thy word, and with thee patient prove, In thought and word and deed will ne'er offend— Take to thy heart and cling to him as friend. To men capricious as the monkey-kind And found unstable, be not thou inclined.' The son reasons his own way to refusing her offer, unprompted: 'Dear father, how Shall I find a man possessed of these virtues? I will not go. With you only will I live.'"
related: []
evokes: [jataka, catukkanipata, aranna-jataka, a-general-principle-lets-a-listener-self-derive-the-specific-answer, the-realization-lands-as-the-listeners-own-not-an-order]
