id: lex-rfcb7
name: credibility-comes-from-visibly-foreclosed-options-not-from-stated-intent
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you need a threat or commitment to be credible — and stated intent alone won't work because the other party knows you can change your mind — make the credibility come from visibly foreclosing your own options. Schelling's paradox: the power to constrain an adversary depends on the power to bind oneself. Weakness is strength, freedom is freedom to capitulate, and burning bridges behind one may suffice to undo an opponent. Operational moves: (i) take an irreversible action that makes carrying out the threat/commitment cheap-or-mandatory (Cortez burning ships; the buyer who signs a $5000 forfeit-bet with a third party that he won't pay over $16,000 for the house; the negotiator authorized by a board to bid only $X with the board unable to reconvene); (ii) make the foreclosure VISIBLE to the other party — the device only works if the opponent can see it (cross-my-heart only works if cross-my-heart is publicly understood as binding; a precommitment hidden from the opponent is a private cost without strategic effect); (iii) move FIRST — bargaining power is the first-to-bind-effectively; whoever commits first shifts the choice-set onto the other party (the seller who says '$19,000 final, cross my heart' before the buyer says '$16,000 final, cross my heart' wins); (iv) understand the limits — a foreclosure that the third-party can be bribed to release is not actually irrevocable; the device's strength scales with the cost of unwinding the foreclosure for both parties. The transferable lesson: credibility is not about sincerity or character — it's a function of the *structural impossibility* of choosing otherwise, made visible to the other party. This is the foundation of deterrence (national-honor trip-wires, mutually-assured-destruction force structure designed so retaliation is automatic), of negotiation tactics (sealed-envelope bids, take-it-or-leave-it offers from agents-with-limited-authority), of contract design (bonds, forfeitable deposits), and of personal commitment (announcing the diet to friends, paying a non-refundable deposit for the gym, telling your therapist you'll quit smoking by date X)."
