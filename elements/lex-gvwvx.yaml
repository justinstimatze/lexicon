id: lex-gvwvx
name: cognitive-attention-defaults-to-objects-or-to-fields-of-relations
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When making sense of a scene, problem, or system, cognition has a stable bias toward one of two attention-defaults — and the choice shapes everything downstream. The OBJECT-CENTERED (analytic) default attends to discrete entities, isolates them from context, groups by abstract category-membership, and looks for universal rules that apply to the entity regardless of surroundings. The FIELD-CENTERED (holistic) default attends to relationships, grounds entities in their context, groups by functional connection, and looks for situated principles that depend on the configuration. Nisbett's canonical cow/chicken/grass test discriminates: object-default pairs cow + chicken (both are animals — category); field-default pairs cow + grass (the cow eats the grass — relation). Both defaults are valid; neither is universal; both are stable within a person and culturally biased at the population level (East Asian populations bias holistic; Western/WEIRD populations bias analytic, with massive within-group variance). Transferable applications: library design (type-class polymorphism is analytic; duck-typed contextual dispatch is holistic); organizational design (by-function silos are analytic; cross-functional verticals are holistic); diagnostics (organ-isolated Western medicine is analytic; whole-system TCM/Ayurveda is holistic); investment analysis (company-fundamentals analytic vs macro-context holistic); architecture (object-as-form analytic vs object-in-site holistic); pedagogy (axiomatic deduction analytic vs case-based reasoning holistic); debugging (isolate the failing function analytic vs trace the call-context holistic). The practitioner-discipline is to NOTICE which default the team or analyst is operating under, and DELIBERATELY engage the other when stuck. Many failures are not failures of intelligence but failures to switch attention-default when the problem-shape calls for the other mode. Distinct from lex-pm93k (cultural-classification carves the substrate) which is about category-axis-choice; distinct from lex-5a87w (complementary-cyclical vs antagonistic opposites) which is about how to read polarities; this atom names the prior cognitive-attention bias that makes one or the other of those moves feel natural."
