id: lex-eb3wf
name: prospective-hindsight-as-failure-mode-elicitation
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When planning anything important, run a premortem: imagine the project failed and write the story of how. Prospective-hindsight surfaces failure modes that bare planning misses because we instinctively underweight the disaster path."
