id: lex-3yvwm
name: sympathetic-magic-similarity-and-contagion
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "When magic-like thinking operates ('this resembles that, so they're linked'; 'this touched that, so they share essence'), you're seeing sympathetic magic — similarity and contagion as cognitive defaults. Frazer's substrate; persists in modern intuitions about contamination, identity, value."
related: [lex-uz7g4, lex-33w6z, lex-we98d, lex-u8u7y, lex-r3w25, lex-nadsx, lex-68gd3, lex-k7m6e, lex-xr5f5, lex-am8cj, lex-y2tbg, lex-55dm8, lex-5qkj9, lex-rbcsc, lex-a5jhg, lex-hsntu, lex-3haas, lex-jyzng, lex-vs2t5, lex-5a87w, lex-cze3t]
evokes: [frazer-laws-of-magic, like-produces-like, contact-produces-influence, voodoo-doll-logic, contagion-without-physics, homoeopathic-thinking]
lineage:
  - source: primary
    text: frazer-1922-golden-bough-abridged
    citation: "Sir James George Frazer, *The Golden Bough: A Study in Magic and Religion* (1-volume abridgement 1922; Project Gutenberg #3623;). Ch. III 'Sympathetic Magic' §1 'The Principles of Magic'. Frazer's foundational anthropological framework: magical thinking rests on two laws — the Law of Similarity (like produces like; an effect resembles its cause) and the Law of Contact / Contagion (things once in contact continue to act on each other at a distance after physical contact has been severed). Frazer's central observation is that these are proto-causation principles — early humans understood the world through similarity and contagion BEFORE the scientific understanding of mechanism. The pattern survives in modern cognition (Rozin's contagion-disgust experiments; the brand-association principles of marketing) and in pre-rational responses across cultures."
    quote: "[Frazer 1922 abridged Ch.III §1, lines 980-1000:] 'IF we analyse the principles of thought on which magic is based, they will probably be found to resolve themselves into two: first, that like produces like, or that an effect resembles its cause; and, second, that things which have once been in contact with each other continue to act on each other at a distance after the physical contact has been severed. The former principle may be called the Law of Similarity, the latter the Law of Contact or Contagion. From the first of these principles, namely the Law of Similarity, the magician infers that he can produce any effect he desires merely by imitating it: from the second he infers that whatever he does to a material object will affect equally the person with whom the object was once in contact, whether it formed part of his body or not. Charms based on the Law of Similarity may be called Homoeopathic or Imitative Magic. Charms based on the Law of Contact or Contagion may be called Contagious Magic.' [And Frazer's framing of the broader claim:] 'In short, magic is a spurious system of natural law as well as a fallacious guide of conduct; it is a false science as well as an abortive art. Regarded as a system of natural law, that is, as a statement of the rules which determine the sequence of events throughout the world, it may be called Theoretical Magic: regarded as a set of precepts which human beings observe in order to compass their ends, it may be called Practical Magic.' [The transferable claim: similarity-based-reasoning and contagion-based-reasoning are pre-rational cognitive defaults; they pre-date scientific causation; they persist in modern minds as fast intuitions even when explicit beliefs reject them.]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v45
    citation: "Cross-domain attestation: Rozin et al. 1986 'Operation of the laws of sympathetic magic in disgust and other domains' *JPSP* 50:703-712 — empirical demonstration that EDUCATED ADULTS in modern Western societies show similarity-magic (refusing to eat fudge shaped like dog feces) and contagion-magic (refusing to wear a sweater previously worn by Hitler even after laundering) responses. Frazer's framework operates in modern cognition as fast-intuition layer despite explicit-rational rejection. Cross-attestation: marketing (brand-association is contagion-magic: associating a product with a celebrity transfers the celebrity's qualities); placebo-effect (homoeopathic magic in clinical context — substances resembling intended effect trigger the effect even without active ingredient); Hahnemann 1796 homeopathic medicine (literal Law of Similarity applied to pharmacy); voodoo-doll experimental research (DeWall et al. 2013 — manipulating effigy of disliked person produces affective satisfaction); essentialist-thinking in children (Bloom 2010 *How Pleasure Works* — children attribute essence-of-X to objects that touched X). Multi-substrate attestation across anthropology, modern psychology, marketing, clinical medicine, and developmental cognition."
    quote: "[Cross-domain consistency check, 2026-05-24: 5 instantiations across Frazer's anthropological catalog + Rozin's experimental psychology + marketing brand-association + placebo homoeopathic-resemblance + voodoo-doll experimental + essentialism research. The pattern is robust across cultures (Frazer documents global instances) AND robust across the educated/uneducated divide (Rozin's subjects were university students who explicitly rejected magical-thinking yet showed the responses). This evidence supports Frazer's claim that the two laws are cognitive defaults, not cultural constructs that can be educated-away. The transferable operational claim: similarity-based and contact-based reasoning operate at the fast-intuition layer; rational override is possible but the intuitions don't dissolve.]"
canonical-instances:
  - "the voodoo-doll canonical case (Frazer 1922 Ch.III + DeWall et al. 2013): a doll resembles its target (Law of Similarity); damaging the doll is believed to damage the target. DeWall's experimental work: subjects given dolls representing disliked persons and instructed to stick pins reported significant affective satisfaction; the COMBINATION of similarity + contagion (often the doll is created with hair/nail-clippings from the target) is doubly-magical. Transferable: any practice where harming-a-representation is believed to harm the represented operates on Law of Similarity"
  - "the contagion-disgust canonical case (Rozin et al. 1986 + Nemeroff-Rozin 1989): subjects refuse to wear a clean laundered sweater they're told previously belonged to Hitler. The contagion-belief survives explicit rational rejection. Rozin's series demonstrates the Law of Contact operating in modern educated subjects as a fast-affective response. Cross-substrate attestation: same pattern in food-disgust (a sterilized cockroach dropped in juice contaminates the juice; subjects refuse to drink despite knowing-it's-sterile), in objects-of-strangers, and in clothing"
  - "the homeopathic-medicine canonical case (Hahnemann 1796 *Organon der Heilkunst*): the entire homeopathic-pharmacy framework explicitly invokes the Law of Similarity ('similia similibus curentur' — like cures like). Substances that produce the symptoms of disease X are administered (in extreme dilution) to treat disease X. Modern evidence-based-medicine treats homeopathy as Frazer's homoeopathic-magic literalized — the explicit invocation of the Law of Similarity is what makes it a sociologically-stable medical-alternative-system rather than a one-off curiosity"
  - "the brand-association canonical case (marketing practice; cf. Aaker 1996 *Building Strong Brands*): a celebrity endorses a product; the celebrity's qualities (athleticism, beauty, success) are perceived to transfer to the product. The mechanism is contagion-magic + similarity (the product is presented IN PROXIMITY to the celebrity; the product is shaped to RESEMBLE associated qualities). Empirical evidence: celebrity-endorsement produces measurable effects on purchase intent. The marketing industry runs on Frazer's framework without naming it"
  - "the placebo-effect canonical case (Beecher 1955 *JAMA* 'The powerful placebo' + Kirsch 2010 *The Emperor's New Drugs*): inert substances administered in clinical context produce measurable physiological effects. Mechanisms include (a) homoeopathic-magic: substances resembling intended-effect trigger expectation that triggers physiological response; (b) contagion-magic: substances administered BY a high-status physician inherit the physician's authority. Pure-rational accounts cannot explain placebo-magnitude; Frazer's framework supplies one explanatory mechanism"
  - "the essentialism canonical case (Bloom 2010 *How Pleasure Works* + Gelman 2003 *The Essential Child*): children (and adults) attribute essence-of-X to objects that have touched X. A teddy bear that belonged to a deceased grandparent has the grandparent's essence; a replica-identical-teddy-bear does not. Cf. art-forgery: an authentic Picasso is worth millions; a chemically-identical forgery is worth thousands. The valuation gap is essentialist contagion-magic — the authentic has touched Picasso's hand; the forgery has not"
  - "operationally distinct from lex-uz7g4 archetype-as-projective-shorthand: archetypes are NAMED-FIGURE handles that the user projects content onto. Sympathetic-magic is an INFERENCE PATTERN (like→like; contact→continuing-influence). Different mechanisms — archetypes operate at the figure-level; sympathetic-magic operates at the inference-level. They can co-fire (an archetype invokes contagion when properly-empowered figures touch each other)"
  - "operationally distinct from lex-u8u7y social-identity-as-self-concept-determinant: SIT is about which-group-am-I-in (categorization). Sympathetic-magic is about how-influence-propagates between things. They can co-fire: in-group-membership operates partly via contagion (being-near-the-leader confers leader-aura) and partly via similarity (in-group-members resemble each other). But the atoms operate at different layers"
  - "operationally adjacent to lex-33w6z sacrifice-as-transformation: many sacrifice-rituals operate via sympathetic-magic mechanism (the sacrificed-animal RESEMBLES the agent the sacrifice is offered for; the act of contact-with-altar transfers the sacrifice's essence). Frazer extensively documents this. Cross-fire: lex-33w6z names the move; lex-3yvwm names the magical mechanism by which the move is believed to operate"
  - "operationally adjacent to lex-r3w25 confirmation-filtered-tribal-perception: sympathetic-magic generates confirmation-friendly explanations of correlations (the rain-dance preceded the rain → rain-dance caused rain). The pattern reinforces itself when failures are attributed to insufficient-magical-correctness rather than mechanism-failure. Lex-0148 is the confirmation-filter; lex-3yvwm is one source of the pattern-detected"
  - "operationally adjacent to lex-nadsx taboo-and-violation: many taboos are sympathetic-magic protections (avoid the corpse — contagion-of-death; avoid the menstruating-woman — contagion-of-impurity). Lex-0166 names the taboo-structure; lex-3yvwm names the magical-mechanism underlying many specific taboos"
  - "operationally adjacent to lex-we98d cognitive-dissonance: sympathetic-magic produces dissonance when the magical-prediction fails (the rain-dance didn't bring rain). Dissonance-reduction strategies (attributing failure to ritual-impurity; adding-consonant-cognitions about delayed-effect; doubling-down on practice) explain magical-thinking's resilience to disconfirmation. Lex-0129 explains the maintenance-mechanism; lex-3yvwm is the upstream-pattern being maintained"
  - "cross-cultural folk attestation (David Galef, *Even Monkeys Fall From Trees: And Other Japanese Proverbs*, Tuttle Publishing, 1987, Proverb No. 49): 'Tsume no aka o senjite nomu. Boil and drink another’s fingernail dirt.' — English equivalent given: 'Follow in someone's footsteps.' The proverb prescribes literally consuming a physical remnant of an admired figure to acquire their quality — the Law of Contact applied not to harm (the voodoo-doll case) but to aspiration, closest in kind to the essentialism canonical case above (a touched object carries the touched-person's essence)"
critical-questions:
  - "the actually-magical-vs-actually-causal discrimination: is the similarity-or-contact relationship invoked actually mechanism-relevant or just resemblance? Some similarity-based reasoning IS justified (homologous-structures-share-function in biology; similar-symptoms-share-cause in clinical medicine). Practitioner-discipline: when invoking similarity, name the mechanism that makes it causally-relevant. If you can't name one, you're in sympathetic-magic territory not causal-inference"
  - "the modern-survival diagnosis: when you notice a fast-intuition response that you don't endorse on reflection (refusing the sweater; reluctant-to-step-on-an-effigy; squeamish-about-contact-with-strangers' objects), name the Frazerian-mechanism. Practitioner-discipline: surfacing the fast-magical-response makes it inspectable; surfacing-it-not leaves it operative-but-invisible"
  - "the practical-pragmatics of magic-thinking: even when sympathetic-magic is causally false, it can be socially/psychologically functional (placebo-effect; ritual-bonding; symbolic-acts-of-reparation). Practitioner-question: is THIS instance of sympathetic-magic-thinking causally-false-but-functionally-valuable (so accept it), or causally-false-AND-harmful (so dispel it)?"
  - "the design-application of contagion-and-similarity: marketers, propagandists, and ritual-designers explicitly engineer Frazerian effects. When designing influence-resistant frames, name the contagion-and-similarity channels operating. Practitioner-discipline: in any persuasion context, audit for both Frazerian laws as influence-paths"
  - "the cultural-portability boundary: Frazer's framework draws from global anthropology but is articulated in Victorian-British scientific frame; some of his classifications have been criticized as orientalist or evolutionist (placing 'savage' magic on a developmental ladder leading to Western science). Practitioner-question: am I using Frazer as descriptive cognitive-science (which generalizes) or as historical-evolutionary framework (which has critiques)? The cognitive-science use travels; the evolutionary use is contested"
  - "the LLM-context application: LLMs exhibit sympathetic-magic-like reasoning when training-corpus correlations produce similarity-based completions ungrounded in mechanism. The fluency-trap (lex-jv983) often surfaces as sympathetic-magic-shaped reasoning. Practitioner-discipline: when an LLM's output 'feels magical' (correlation-based, not mechanism-based), invoke lex-3yvwm explicitly to check for the failure-mode"
status: active
