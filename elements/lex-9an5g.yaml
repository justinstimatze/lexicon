lineage:
  - source: primary
    tradition: brannen-mass-extinction
    text: brannen-2017-ends-of-the-world
    citation: "Peter Brannen, The Ends of the World: Volcanic Apocalypses, Lethal Oceans, and Our Quest to Understand Earth's Past Mass Extinctions (Ecco, 2017), Introduction."
    quote: "The five worst episodes in earth history have all been associated with violent changes to the planet's carbon cycle. Over time, this fundamental element moves back and forth between the reservoirs of biology and geology: volcanic carbon dioxide in the air is captured by carbon-based life in the sea, which dies and becomes carbonate limestone on the seafloor. When that limestone is thrust down into the earth, it's cooked and the carbon dioxide is spit out by volcanoes into the air once more. And on and on. This is why it's a cycle. But events like sudden, extraordinarily huge injections of carbon […]"
  - source: primary
    tradition: brannen-mass-extinction
    text: brannen-2017-ends-of-the-world
    citation: "Peter Brannen, The Ends of the World: Volcanic Apocalypses, Lethal Oceans, and Our Quest to Understand Earth's Past Mass Extinctions (Ecco, 2017), Introduction — End-Triassic Palisades flood basalts."
    quote: "The eruptions flooded the atmosphere with carbon dioxide at the end of the Triassic period, roasting the planet and acidifying the oceans for thousands of years. Brief blasts of volcanic smog punctuated this super-greenhouse with cold. The runaway volcanism covered more than 4 million square miles of the planet and killed off more than three-quarters of animal life on earth in a geological instant."
canonical-instances:
  - End-Ordovician (~444 Ma) — 86% of marine species lost; associated with rapid CO2 drawdown and glaciation followed by warming, both carbon-cycle perturbations.
  - Late Devonian (~372 Ma) — ~75% of species lost; oceanic anoxia driven by carbon-cycle changes from plant colonization of continents (a sudden new carbon-sink that destabilized the ocean-atmosphere balance).
  - End-Permian (~252 Ma) — 'the Great Dying' — >95% of marine species and ~70% of terrestrial species lost; Siberian Traps flood basalts released CO2 and methane over ~1 million years.
  - End-Triassic (~201 Ma) — Central Atlantic Magmatic Province (Palisades-forming) flood basalts; >75% of species lost.
  - End-Cretaceous (~66 Ma) — Chicxulub impactor triggered the famous dinosaur extinction but the long-term-deadly mechanism was the impact-induced injection of carbon and sulfur into the atmosphere; Deccan Traps volcanism simultaneously perturbed carbon cycle.
  - Anthropogenic carbon emissions 1750-present — current rate of carbon-cycle perturbation is geologically extraordinary; the transferable lesson is that humans are running the mass-extinction mechanism deliberately, even if the magnitude has not yet reached big-five levels.
severity-tier: critical
