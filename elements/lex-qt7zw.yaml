id: lex-qt7zw
name: check-the-source-when-the-signal-doesnt-fit-it
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you notice a signal that doesn't match the scale or nature of the thing it's apparently coming from, don't reach first for a distant, unfalsifiable explanation -- go check the literal physical source before accepting any story about spirits, coincidence, or forces beyond your ability to inspect. In Zitkála-Šá's telling, a new mother hears what sounds like the murmur of an entire distant camp -- singing, drumming, deer-hoof rattles -- and her first instinct is to look upward and wonder, 'Spirits in the air above?' But she doesn't stop at that explanation. She bends down and traces the sound to its actual origin: 'Horrified was she to find the mysterious sound came out of the open mouth of her sleeping child.' A whole camp's worth of noise was never going to fit inside an ordinary baby, and that exact mismatch -- the signal was too large, too complex, too specific for the small, quiet container it was apparently coming from -- is what the supernatural explanation conveniently would have let her skip past without ever noticing anything was wrong. The disguise (an ordinary sleeping baby) held up completely at a distance and would have held up indefinitely if she had accepted the first explanation that let her stop looking. It only failed once she put her ear directly against the actual point of origin. Diagnostic move: when a signal, result, or claim seems too large, too rich, or too complex for the small, ordinary thing it's supposedly coming from, resist the pull of an explanation that requires no further checking -- go verify the literal source directly, since a mismatch in scale between a signal and its apparent origin is often the one tell a well-maintained disguise can't fix, precisely because it can only be caught by someone willing to check closely rather than accept a plausible story from a distance."
