id: lex-e7k3x
name: a-norm-holds-only-when-violating-it-costs-the-violators-own-side
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When judging whether a norm will actually stop a violation in progress, don't count the opposition's resistance — count whether the violator's own side is willing to pay a cost over it. Opposition resistance is expected and, on its own, usually survivable; a leader backed by a unified coalition can absorb it indefinitely. Levitsky and Ziblatt's own two clearest 'the guardrails held' cases both turn on defection from the violator's own side, not the opposing party: 'But the norm held. Roosevelt's court-packing plan faced greater opposition than any other initiative undertaken during his presidency. It was opposed not only by Republicans but by the press, prominent lawyers and judges, and a surprisingly large number of fellow Democrats. Within months, the proposal was dead—killed by a Congress dominated by Roosevelt's own party.' ... 'Although Nixon held out hope that he could muster up the 34 Republican votes needed to avoid a Senate conviction, Senate Republicans sent Barry Goldwater to inform him of the inevitability of impeachment. When Nixon asked Goldwater how many votes he had, Goldwater reportedly replied, 'Ten at most, maybe less.' Two days later, Nixon resigned.' In every one of the book's failure cases — Peru, Venezuela, Hungary — the enabling body stayed unified behind the leader with no internal defection at all. A norm survives specifically when its violation costs the violator support from people who share their side, not merely when it draws predictable opposition from people who never supported them."
