id: lex-kw5y2
name: voluntary-uptake-requirement-structurally-excludes-coercion
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A method of extraction can be structurally restricted to voluntary participation — success requires the target to act, sign, or hand over funds through their own uncoerced decision — which forecloses violence or threat as a tool, not by ethical restraint but because coercion belongs to a different, incompatible technique. Maurer's Life of the confidence game names this boundary directly in its own professional taxonomy: the underworld itself sorts crime into two structurally distinct families defined by exactly this axis. 'Grift... A group of criminal professions which employ skill rather than violence.' 'Grifter. In the strict sense, one who lives by his wits as contrasted to the heavy-men who use violence.' 'Heavy-rackets. Those rackets involving violence or threat of violence as contrasted to the grift.' The book is explicit that these aren't loosely-related styles on a spectrum but two separate professional identities with separate practitioners, separate reputations, and separate skill sets — a grifter who resorted to violence would not be doing a rougher version of the same job, he would have left the grift and entered the heavy-rackets. The structural reason is mechanical, not moral: a con's profitability depends on the mark handing over money through what feels like their own free financial decision (opening accounts, wiring funds, liquidating property themselves), which is exactly what produces the absence of any coercion-evidence and the mark's own reluctance to report — introduce a threat and both of those load-bearing properties collapse at once, along with the entire cast of profitable moves (the convincer, the switch, the tie-up) that depend on the mark's continued voluntary cooperation. Generalize beyond con games: multi-level-marketing recruitment (structurally requires the recruit to buy in and recruit others voluntarily — coercion would produce a different crime, and would also destroy the recruit's-own-enthusiasm signal the pitch depends on); phishing and social-engineering attacks (must get the target to click, type, or transfer voluntarily — a coerced action leaves different forensic and legal traces than a tricked one); high-pressure sales tactics generally (aggressive closing techniques stay just inside the voluntary-participation boundary because crossing it changes both the legal classification and the victim's post-hoc psychology). The diagnostic move: when analyzing an extraction scheme, check whether it depends on the target's own uncoerced action at the critical moment — if so, every other design choice in the scheme will be constrained to protect that voluntariness, since coercion at any point would collapse the scheme into a different, less profitable and more legally exposed crime."
