id: lex-cz6ky
name: literally-altering-the-stigmatized-body-reinforces-the-trap-it-fights
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a social stigma has been fused to a bodily fact (skin color, a physical feature, a bodily process), there are two very different ways to fight it, and one of them, however well-intentioned, ends up reinforcing the exact logic it's trying to escape. Hyde calls the first the 'heavy-bodied' escape: trying to change the body itself, bleaching skin, undergoing mutilation, in extreme cases self-destruction, in order to remove the supposed source of the shame. 'The heavy-bodied, literalizing attempt to escape from shame carries much of the trap with it -- the link to the body, the silence, and so on. Inarticulately, it takes the sign for the thing itself, imagining racism inheres in the color of the skin.' Richard Rodriguez's memoir supplies the concrete case: relatives treating dark-skinned children's faces 'regularly with a mixture of egg white and lemon juice concentrate,' a remedy that accepts the premise (dark skin is the actual problem) while attacking only the symptom. The second, 'light-bodied' escape works differently: 'Wise to the tricks of language, the light-bodied escape from shame refuses the whole setup -- refuses the metonymic shift, the enchantment of group story, and the rules of silence -- and by these refusals it detaches the supposedly overlapping levels of inscription from one another so that the body, especially, need no longer stand as the mute, incarnate seal of social and psychological order.' The first approach spends enormous effort changing the body and leaves the underlying equation (body-feature equals social-worth) completely intact; the second leaves the body alone and dissolves the equation itself. Diagnostic move: when someone is fighting a stigma attached to an unchangeable trait, notice whether the fight targets the trait (which implicitly concedes that the trait really was the problem) or targets the equation linking the trait to social meaning (which denies that the trait was ever the actual problem) -- effort spent on the first can look like resistance while functioning as compliance with the very logic being resisted."
