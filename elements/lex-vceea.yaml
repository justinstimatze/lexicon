evokes: [sort-by-sincerity-not-by-compliance, cushing-the-boy-hunter-and-the-rattlesnakes, gifts-of-double-and-foolish-hearts, returned-to-be-gathered-and-presented-again]
lineage:
  - source: primary
    text: cushing-boy-hunter-sun-father-returns-insincere-offerings
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Boy Hunter Who Never Sacrificed to the Deer He Had Slain: or the Origin of the Society of Rattlesnakes.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'I recognize the really good from the evil,--even of the thoughts of men,--and that I know the prayer and sacrifice that is meant, from the words and treasures of those who do but lie in addressing them to me, and speak and act as children in a joke? ... Some of them I cherished preciously, for they are the gifts to me of good hearts and I treasure them that I may return them in good fortune and blessing to those who gave them. But some thou sawest I cast abroad into the great waters that they may again be gathered up and presented to me; for they were the gifts of double and foolish hearts.'"
canonical-instances:
  - "A manager receiving performance self-assessments from a large team doesn't treat every submitted form as equally meaningful -- some reflect genuine reflection and are used to inform real development conversations and support, while ones that are obviously copy-pasted or perfunctory get sent back for a real answer rather than being filed as complete or used as grounds for punishment."
  - "A grant committee reviewing hundreds of impact reports from funded organizations doesn't accept every report at face value just because it was submitted on time and in the right format -- reports that read as genuine, specific accounting get factored into future funding decisions, while vague, templated ones are returned with a request for real detail rather than either being rewarded or triggering an immediate funding cut."
critical-questions:
  - "how reliably can a recipient actually distinguish a sincerely meant gesture from a well-performed insincere one, especially at scale -- the Sun-father is explicitly divine and infallible at this, but what does this pattern actually require of a human evaluator who can be fooled?"
  - "is returning an insincere offering for a second chance always the right response, or does it sometimes let a bad-faith giver keep performing compliance indefinitely without consequence, since the cost of being caught insincere once is apparently nothing more than a delay?"
  - "does treating sincerity as legible and sortable risk missing cases where the giver's intent was genuinely mixed or uncertain even to themselves -- is the Sun-father's clean binary of good hearts versus double and foolish hearts too simple a model for how human motivation actually works?"
