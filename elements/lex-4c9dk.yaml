id: lex-4c9dk
name: long-term-prophecy-needs-an-isolated-stationary-recurrent-system
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone argues that because science can predict X (eclipses, planetary motion), it should therefore be able to predict Y (revolutions, market crashes, the trajectory of a technology), check what made X predictable in the first place before accepting the analogy. Popper's answer for eclipses: long-term, unconditional predictions can only be derived from ordinary conditional scientific predictions ('if these conditions hold, that outcome follows') when they're applied to systems that are well-isolated, stationary, and recurrent -- and such systems are rare. The solar system happens to be one: 'our solar system is a stationary and repetitive system... because of the accident that it is isolated from the influence of other mechanical systems by immense regions of empty space and is therefore relatively free of interference from outside.' That isolation is a specific, contingent physical fact about this one system, not a general property of predictable-in-principle domains. Human society fails all three conditions at once -- it isn't isolated (everything interacts with everything else), it isn't stationary (it develops), and its most consequential turns aren't recurrent (a new scientific discovery or technology creates a situation genuinely unlike anything before it). Diagnostic move: before treating a predictive success in one domain as a reason to expect similar predictive power in another, check the three conditions directly -- is the target system actually isolated from outside interference, is it in a steady state rather than developing, and does the specific event you want to forecast belong to a recurring class rather than being a one-off shaped by unprecedented conditions? A domain that fails any of the three isn't disqualified from all prediction, but it is disqualified from the eclipse-style unconditional, long-range forecast that the analogy is being used to promise."
