    text: distinctness-audit-carroll-poetic-naturalism-vs-existing-substrate
    citation: "Lex-0243 (Hume's is-ought gap) grounds the classical claim that no valid deductive inference carries from purely descriptive premises to a normative conclusion — a claim about the logical structure of a certain kind of inference. Carroll's poetic naturalism is a different, complementary claim: not primarily about the logic of derivation, but about the legitimacy and non-competition of multiple description-levels, including values-talk, for a single underlying physical reality — a claim about ontological and epistemological pluralism of description, not about inference-validity. The two are compatible (both resist collapsing values into brute physical fact without further argument) but operate on distinct axes. Lex-0605 (the claim that exclusive-truth-claim cosmologies structurally produce intolerance of alternatives) names a horizontal plurality — many coexisting first-order truth-claims tolerating each other versus one exclusive claim — a different axis of plurality than Carroll's vertical plurality of description-tiers for one world; genuinely distinct, but sharing a family-resemblance preference for pluralism over totalizing exclusivity. Lex-0372 (Mill's claim that emergent effects resist decomposition into summed causes) grounds causal composition — whether joint effects are the mechanical sum of separate causes or heteropathic and emergent — which licenses Carroll's tier-two (emergent scientific descriptions) but has no machinery for tier-three (values, which do not aim at fitting data at all). Lex-0010 (coarse-graining) is a general physics and statistical-mechanics levels-of-description mechanism — molar versus molecular disorder, planet-as-point-mass — entirely about tiers one and two, with no tier-three, values payoff. Lex-0667 (Dennett's intentional stance, which treats a system as a rational agent for prediction) is a predictive-strategy stance-pluralism, with the physical, design, and intentional stances all judged by predictive traction, directly thematically adjacent to Carroll's ways-of-talking pluralism — but Dennett's framework has no tier that is exempt from the predictive-traction test the way Carroll's tier-three, values, explicitly is. No atom in the substrate grounds Carroll's specific claim that values-talk is a legitimate third, non-competing description tier that neither requires a separate metaphysical realm nor is eliminated by the fundamental physical description."
canonical-instances:
  - "The Ship of Theseus and Captain Kirk transporter-duplication puzzles (Carroll Ch.2): both puzzles look like they're asking 'which one is the REAL ship/person' as though there must be a fact of the matter fixed at the fundamental level. Poetic naturalism's answer: 'ship' and 'person' are useful, non-fundamental ways of talking about arrangements of atoms; the identity-question is 'up to us to decide,' not a hidden fact awaiting fundamental-physics discovery — and this doesn't make ships or persons illusions, just non-fundamental."
  - "The eliminativist-vs-poetic-naturalist contrast on 'is a person real': an eliminativist, faced with 'we are just collections of atoms,' concludes persons, values, and meaning are fictions to be discarded. The poetic naturalist agrees on the atoms and rejects the conclusion: 'they are no less real for all of that' — the derived-and-useful is not the same as the fake."
  - "The Harris-style scientism attempt to make ethics itself a data-fitting science (deriving 'good' directly from well-being-maximization the way physics derives orbits from gravity): poetic naturalism's diagnosis is that this collapses tier-3 into tier-2 by force — values answer to 'we want to be good people, get along with others, and find meaning,' not to the scientific goal of fitting data, so treating an ethical claim as though it needed data-fitting warrant (or lacked reality for failing to have one) misapplies the tier-2 test to a tier-3 object."
  - "Carroll's own extension to consciousness and free will (Ch. 'Thinking'): 'inner experiences' are 'part of a way of talking about what is happening in our brains' — the same tri-level move (not a separate non-physical mind-stuff, not an illusion either, but a real, non-fundamental, non-data-fitting-in-the-same-sense way of talking) applied to phenomenal experience and to free choice, showing the atom's payload generalizes beyond ethics narrowly construed to the whole 'Caring' and 'Thinking' portions of the book."
  - "A modern cross-domain analogue: debates over whether 'the economy,' 'culture,' or 'the self' are illusions because they are 'just' interacting agents/atoms/neurons run the identical two-horn trap — either posit an emergent non-physical economy-essence, or declare the economy a fiction. The poetic-naturalist move supplies the missing option: economy-talk is a real, useful, non-fundamental way of talking, licensed by its own internal consistency and usefulness rather than by being fundamental."
critical-questions:
  - "Is the argument running on a hidden TWO-TIER premise (fundamental-physical vs. everything-else-must-be-data-fitting-emergent-or-fake) when the actual structure needs three tiers? Naming the missing third tier (values, answering to a different goal than data-fitting) often dissolves the apparent dilemma without requiring either eliminativism or a smuggled-in separate realm."
  - "Is a values-claim being asked to pass the WRONG TEST — treated as though its reality depended on fitting observational data the way a physical theory must, when its actual test is usefulness, internal consistency, and consistency with (not derivation from) the physical facts?"
  - "Is this the is-ought LOGICAL-INFERENCE question (lex-gzgn3: can this specific ought be validly derived from these premises?) or the ONTOLOGICAL-PLURALISM question (this atom: is values-talk in general a legitimate, non-illusory way of talking about the world at all)? They are frequently conflated in naturalism-vs-meaning debates but require different answers."
  - "Does the proposed 'way of talking' pass poetic naturalism's own two-part test — is it USEFUL for some purpose, and is it CONSISTENT with the deeper-tier facts (not contradicting them) — or does it make empirical claims the fundamental/emergent tiers already rule out (astrology, telekinesis, survival of the soul after death), in which case it fails on naturalism's own terms rather than earning tier-3 legitimacy?"
  - "When someone insists a values-claim must be either fundamentally-real (requiring its own metaphysical realm) or fake, are they overlooking that most of what we already treat as unquestionably real — ships, persons, temperatures, species — is ALSO non-fundamental-but-real, and ask what principled difference (if any) is doing the work of treating values differently from those other derived-but-real categories?"
status: active
