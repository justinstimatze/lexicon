id: lex-gaexb
name: consulting-the-affected-party-can-reverse-the-assumed-causal-arrow
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When designing an intervention meant to help a group, and you already have a working theory of what causes their condition, check that theory against the group's own account before funding or building around it -- the causal arrow you assumed may run backward. Harriet Beecher Stowe, planning to spend the proceeds of Uncle Tom's Cabin on 'the permanent improvement of the free colored people,' did not decide unilaterally or consult only fellow reformers -- she invited Frederick Douglass to her home specifically to ask him what would actually help. The reform world's working theory was that ignorance caused poverty, which pointed toward funding education. Douglass, speaking from the inside of the condition being diagnosed, reversed the arrow: 'They were shut out from all lucrative employments and compelled to be merely barbers, waiters, coachmen and the like at wages so low that they could lay up little or nothing. Their poverty kept them ignorant and their ignorance kept them degraded.' Exclusion from lucrative trades produced poverty, and poverty produced the outward appearance of ignorance -- not the reverse. Stowe accepted the correction and redirected the funding toward vocational workshops rather than a purely academic institution."
related: [lex-58ynk]
evokes: [stowe-and-douglass-at-andover, ignorance-kept-them-degraded-poverty-kept-them-ignorant, ask-the-person-you-are-trying-to-help, the-causal-arrow-runs-the-other-way]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch8-john-brown-and-mrs-stowe
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter VIII, 'John Brown and Mrs. Stowe.'"
    quote: "“‘I have invited you here,’ she said, ‘because I wish to confer with you as to what can be done for the free colored people of the country... In what way I can do this most successfully is the subject I wish to talk with you about.’ ... I argued that the want of money was the root of all evil to the colored people. They were shut out from all lucrative employments and compelled to be merely barbers, waiters, coachmen and the like at wages so low that they could lay up little or nothing. Their poverty kept them ignorant and their ignorance kept them degraded. We needed more to learn how to make a good living than to learn Latin and Greek.”"
canonical-instances:
  - "Stowe had already heard other proposals before asking Douglass -- 'several plans had been suggested, among others an educational institution pure and simple' -- meaning the default, pre-consultation plan pointed straight at the standard ignorance-causes-poverty theory. Consulting Douglass himself, rather than more reformers, is what actually surfaced the reversed arrow, and Stowe changed the plan on the strength of it: workshops teaching trades ('iron, wood, and leather') alongside a plain education, not a purely academic institution."
  - "Hypothetical: a nonprofit assumes a neighborhood's low school attendance is caused by parental indifference to education and designs an awareness campaign. Only after interviewing the affected families directly does it learn attendance is low because older children are needed to work or to care for younger siblings while parents hold multiple jobs -- the campaign was aimed at a belief the families didn't actually hold, chasing an effect (apparent indifference) that was itself downstream of the real cause (economic necessity)."
critical-questions:
  - "Operationally distinct from lex-58ynk (Hayek: knowledge of particular circumstances resists centralization): that atom is a general epistemic claim that tacit, local knowledge cannot be aggregated by a distant planner. This atom is narrower and more specific -- it's not just that Douglass had local knowledge Stowe lacked, but that the standard causal model itself (ignorance causes poverty) had the arrow backward, and asking the affected party surfaced a correction to the THEORY, not merely a data point a central planner failed to collect. Is this a special case of Hayek's broader point, or does the causal-arrow-reversal add something Hayek's framing doesn't capture on its own?"
  - "Does consulting the affected party reliably surface a correct causal reversal, or does it only work when, as with Douglass, the person consulted has both the lived experience AND the standing/eloquence to reframe the question rather than simply answer within the terms it was asked? Would a less articulate but equally affected person have been as likely to shift Stowe's frame, or does this mechanism quietly depend on finding an unusually persuasive informant?"
  - "Contrast with lex-jgxp6 (escalating past the affected party to a more distant one for a veto): there, an unwanted answer from the directly-affected party sent the decision-maker looking elsewhere. Stowe asked and accepted the correction; Miss Tracy asked the schoolgirls and then overrode their answer. What decides which response a decision-maker gives to an inconvenient answer -- is it simply whether they had a predetermined outcome in mind before asking, as Miss Tracy did and Stowe apparently did not?"
