lineage:
  - source: primary
    text: Pascal-1670-Pensees-Trotter-S139
    citation: "Blaise Pascal, *Pensées* (Port-Royal edition 1670; Brunschvicg numbering Section II `The Misery of Man without God` fragment 139; Trotter translation Project Gutenberg #18269). The foundational text articulating divertissement (`diversion`) as the systematic human strategy of manufacturing outward activity to avoid attending to one's own condition. Pascal's cardinal claim: `All the unhappiness of men arises from one single fact, that they cannot stay quietly in their own chamber.` The framework has been productively extended across continental philosophy (Heidegger 1927 *Sein und Zeit* on das Man + the fleeing-from-anxiety + the everydayness as divertissement-analog; Sartre 1943 *Being and Nothingness* on bad faith as divertissement-mode); modern sociology of attention (Wu 2016 *The Attention Merchants*; Crawford 2015 *The World Beyond Your Head*; Zuboff 2019 *Surveillance Capitalism*; Hari 2022 *Stolen Focus* — note `feedback_caveat_authors` on Hari); behavioral economics (the hedonic-treadmill literature; Easterlin 1974; Kahneman-Krueger-Schkade-Schwarz-Stone 2006); clinical psychology (Hayes et al 2006 ACT on experiential avoidance; Marlatt 1985 on relapse triggers; Brewer 2017 *The Craving Mind*); contemporary contemplative + meditation literature (Kabat-Zinn 1990 *Full Catastrophe Living*; Goldstein 2013 *Mindfulness*); + critical-tech literature on attention-economy design (Newport 2019 *Digital Minimalism*; Odell 2019 *How to Do Nothing*). The atom encodes the transferable structural form — outward distraction sought to avoid contemplation of own condition — separately from Pascal's specific theological framing. Debunking check applied: Pascal's theological commitments (the diagnosis points to God as the only stable rest for human striving) are NOT vital for the atom. The STRUCTURAL CLAIM about divertissement as systematic avoidance is well-attested across continental philosophy, sociology of attention, behavioral economics, clinical psychology, and contemplative literature, independent of specific Pascalian theological commitments."
    quote: "[Pascal *Pensées* fragment 139 (Trotter tr.), the central diagnostic:] 'When I have occasionally set myself to consider the different distractions of men, the pains and perils to which they expose themselves at court or in war, whence arise so many quarrels, passions, bold and often bad ventures, etc., I have discovered that all the unhappiness of men arises from one single fact, that they cannot stay quietly in their own chamber. A man who has enough to live on, if he knew how to stay with pleasure at home, would not leave it to go to sea or to besiege a town. A commission in the army would not be bought so dearly, but that it is found insufferable not to budge from the town; and men only seek conversation and entering games, because they cannot remain with pleasure at home.' [On the underlying mechanism — the unbearable condition that distraction conceals:] 'But on further consideration, when, after finding the cause of all our ills, I have sought to discover the reason of it, I have found that there is one very real reason, namely, the natural poverty of our feeble and mortal condition, so miserable that nothing can comfort us when we think of it closely.' [On the canonical king-thought-experiment:] 'Whatever condition we picture to ourselves, if we muster all the good things which it is possible to possess, royalty is the finest position in the world. Yet, when we imagine a king attended with every pleasure he can feel, if he be without diversion, and be left to consider and reflect on what he is, this feeble happiness will not sustain him; he will necessarily fall into forebodings of dangers, of revolutions which may happen, and, finally, of death and inevitable disease; so that if he be without what is called diversion, he is unhappy, and more unhappy than the least of his subjects who plays and diverts himself.' [On the chase-not-the-quarry diagnostic:] 'Hence it comes that play and the society of women, war, and high posts, are so sought after. Not that there is in fact any happiness in them, or that men imagine true bliss to consist in money won at play, or in the hare which they hunt; we would not take these as a gift. We do not seek that easy and peaceful lot which permits us to think of our unhappy condition, nor the dangers of war, nor the labour of office, but the bustle which averts these thoughts of ours, and amuses us.' [Practitioner-extraction for transferable lex-cgbrt: the activity is sought NOT for its ostensible reward but for the BUSTLE THAT AVERTS THOUGHTS of one's condition. The hare is not what is wanted; the chase is. The atom generalizes to attention-economy products, workaholism, consumption-as-activity, news-cycle attention, phone-checking, hyperscheduled childhood, and AI-companion + parasocial-relationship technology — wherever activity is engineered or sought to fill the room.]"
  - source: cross-attestation
    text: cross-domain-divertissement-as-avoidance-of-self-confrontation
    citation: "Cross-domain attestation that divertissement as systematic avoidance of self-confrontation recurs across continental philosophy, attention-economy critique, behavioral economics, clinical psychology, and contemplative literature. (a) Continental philosophy: Heidegger 1927 *Being and Time* §27 on das Man + the fleeing-from-anxiety + the everydayness explicitly articulates divertissement-analog as a fundamental mode of inauthentic Dasein (lex-zd4sv substrate-grounded Heidegger care-structure composes); Sartre 1943 *Being and Nothingness* Part 1 Ch.2 on bad faith as divertissement-mode (the waiter who is `playing at being a waiter` is divertissement-engaged); Kierkegaard 1844 *The Concept of Anxiety* on flight from existential confrontation. (b) Attention-economy critique: Wu 2016 *The Attention Merchants* documents the 19th-c to 21st-c development of industries explicitly engineered to capture attention via divertissement; Crawford 2015 *The World Beyond Your Head: On Becoming an Individual in an Age of Distraction*; Zuboff 2019 *Surveillance Capitalism*; Newport 2019 *Digital Minimalism*; Odell 2019 *How to Do Nothing: Resisting the Attention Economy*. (c) Behavioral economics + happiness research: the hedonic-treadmill literature (Brickman + Campbell 1971; Easterlin 1974; Kahneman-Krueger-Schkade-Schwarz-Stone 2006 *Would You Be Happier If You Were Richer?*) documents that material acquisitions do not durably increase happiness — implication: the chase is what's sought, not the arrival. (d) Clinical psychology: Hayes + Wilson + Gifford + Follette + Strosahl 2006 *Experiential Avoidance and Behavioral Disorders* articulates experiential-avoidance as core trans-diagnostic mechanism — clinical parallel of divertissement at the individual level; Brewer 2017 *The Craving Mind* documents the cycle of craving + acting + temporary relief + return of craving as compulsive divertissement; Marlatt 1985 *Relapse Prevention* documents addiction relapse triggers as experiential-avoidance failures. (e) Contemplative + meditation literature: Kabat-Zinn 1990 *Full Catastrophe Living* + Goldstein 2013 *Mindfulness* + Tolle 1997 *The Power of Now* (the popular form) all explicitly frame meditation practice as countering divertissement-tendency to remain present. (f) Sociology of work: Schor 1992 *The Overworked American*; Schulte 2014 *Overwhelmed*; Petersen 2020 *Can't Even: How Millennials Became the Burnout Generation* document workaholism + busy-cult as social-organized divertissement. The cross-domain attestation establishes the transferable structural form: outward distraction is sought to avoid contemplation of one's own condition; the mechanism recurs across individual + organizational + sociological scales."
    quote: "Across continental philosophy (Heidegger 1927, Sartre 1943, Kierkegaard 1844), attention-economy critique (Wu 2016, Crawford 2015, Zuboff 2019, Newport 2019, Odell 2019), behavioral economics + happiness research (Brickman-Campbell 1971, Easterlin 1974, Kahneman-Krueger-Schkade 2006), clinical psychology (Hayes-Wilson-Gifford-Follette-Strosahl 2006 experiential avoidance, Brewer 2017, Marlatt 1985), contemplative + meditation literature (Kabat-Zinn 1990, Goldstein 2013), and sociology of work (Schor 1992, Schulte 2014, Petersen 2020), the same structural form recurs — outward distraction is sought to avoid contemplation of one's own condition. The transferable diagnostic: ask what the activity would not have to face if continued indefinitely; ask whether the person could sit quietly in a room for an hour."
canonical-instances:
  - "Pascal's canonical king-thought-experiment: a king with every pleasure but without divertissement falls into forebodings of dangers, revolutions, death, disease — and becomes more unhappy than the least of his subjects who plays + diverts himself. The thought experiment isolates divertissement from material conditions."
  - "Pascal's canonical chase-vs-quarry diagnostic: men do not actually want the hare they hunt — they would not take it as a gift. They want the bustle that averts thoughts of their condition. The diagnostic test isolates ostensible-reward from actual-function."
  - "Attention-economy products (social media + streaming + games + endless-scroll UX): explicitly engineer divertissement at population scale. The product's design (variable-reward, infinite-feed, autoplay) optimizes for time-on-app — which is divertissement-time. Documented in Wu 2016, Zuboff 2019, Newport 2019, Odell 2019."
  - "Workaholism + busy-cult corporate culture: work is sought as divertissement from non-work confrontation. The workaholic who cannot vacation, the manager who fills calendar to bursting, the entrepreneur who chains startups together — Schor 1992, Schulte 2014, Petersen 2020."
  - "Phone-checking compulsion: the activity, not the content, is what's sought. Average users check phones 80-150x/day; most checks turn up no new content. The check itself is divertissement. Documented across attention + behavioral-addiction literature."
  - "Hyperscheduled childhood: parental project of filling the child's hours protects against child self-confrontation AND against parent self-confrontation about parenting + meaning. Lythcott-Haims 2015 *How to Raise an Adult*; Doepke-Zilibotti 2019 *Love, Money, and Parenting*."
  - "News-cycle attention: the continuous outrage-news refresh as divertissement infrastructure. The user is not seeking information that would actually inform action; they are seeking the bustle that averts thoughts of their own condition. Composes with the attention-economy products."
  - "AI-companion + parasocial-relationship technology: 24/7 availability of conversation-partner functions as divertissement infrastructure. The product is designed to eliminate the silence in which Pascal's chamber-confrontation would occur. Crawford 2021 *Atlas of AI*."
  - "Heidegger's das Man + everydayness (Being and Time §27): an explicit philosophical extension of Pascal — humans flee from anxiety about their own being by absorbing themselves in the They, the public sphere, the everyday tasks. Composes with lex-zd4sv (Heidegger care-structure)."
  - "Experiential avoidance in clinical psychology (Hayes et al 2006): the cross-diagnostic mechanism in which clients avoid uncomfortable internal experiences via behavioral distraction. ACT and CBT explicitly target this; the divertissement-confrontation reversal is the therapeutic intervention."
  - "operationally distinct from lex-rgr3t habit-formation-frees-attention-for-higher-order-work: lex-rgr3t is about how habits free attention for productive deliberate work. lex-cgbrt is about how attention is spent to AVOID confrontation. Different mechanisms — habits free a resource; divertissement consumes it for avoidance."
  - "operationally distinct from lex-y6xy9 gumption-as-engagement-reservoir-with-traps: lex-y6xy9 is about engagement-energy + the traps that drain it during real work. lex-cgbrt is about activity that functions as avoidance. Different mechanisms."
  - "operationally distinct from lex-5kjya (Veblen costly-conspicuous-waste-as-status-signal): Veblen's mechanism is status-signaling via observable waste. lex-cgbrt is about activity-as-self-avoidance. Compose: conspicuous consumption can simultaneously serve status-signaling AND divertissement (the activity of acquiring + showing is both)."
  - "operationally distinct from lex-rfcb7 credibility-comes-from-visibly-foreclosed-options (Schelling commitment-device): lex-rfcb7 is about commitment-as-strategic-credibility. lex-cgbrt is about activity-as-self-avoidance. Different mechanisms."
  - "operationally distinct from lex-5tpy8 single-self-houses-multiple-competing-volitional-sub-agents (Augustine divided will): lex-5tpy8 names the multi-self volitional structure. lex-cgbrt names the specific SHAPE the conflict takes — the avoider-self vs the contemplator-self. They compose: the divertissement-engaged self is one sub-agent; the contemplation-doer is another; lex-cgbrt specializes lex-5tpy8 to this specific conflict-pattern."
  - "operationally distinct from lex-3656j shared-institutional-reality-produced-through-habituation: lex-3656j is about institutional-production. lex-cgbrt is about individual-level avoidance-of-self-confrontation. They compose at the sociological scale: divertissement-infrastructure (attention-economy industries) is the institutional production OF mass divertissement opportunities."
critical-questions:
  - "Could the atom be misused to dismiss all engaged activity as escapism? Yes — and Pascal's own framing risks this (his theological program counsels turning to God as the only authentic non-distracted rest). The discipline against this: the atom names a SPECIFIC FUNCTION (avoidance of self-confrontation) that activity can serve; it does NOT claim all activity serves this function. Productive work with genuine ends (writing this atom, building a thing, repairing a relationship) is structurally distinct from divertissement. The diagnostic test isolates the cases: would the person rest if the ostensible reward were achieved?"
  - "Does the atom assume the avoided condition is always negative (mortality, finitude)? Largely yes, but the transferable form generalizes. People may avoid contemplating a present unhappy relationship, a misaligned career, accumulated regret, internal conflict — not only existential conditions. The atom names the avoidance-function; the specific avoided content is empirically variable."
  - "Could the atom be applied to social isolation + loneliness as themselves divertissement? Carefully. Heavy social activity may be divertissement (the parties to avoid being alone); but heavy social isolation may also be divertissement (the work-alone-all-day to avoid relational confrontation). The atom diagnoses the FUNCTION, not the surface activity-pattern. Either pattern can serve the same function."
  - "How does the atom apply to AI systems? AI-companion + parasocial-relationship technology is explicit divertissement infrastructure — the product is designed to eliminate the silence in which self-confrontation would occur. From the AI-safety perspective, this is a substantive concern about long-term wellbeing impacts; the atom names the mechanism. From the AI-design perspective, the atom counsels asking: does this product help users meet their actual condition or help them avoid it?"
  - "Could the atom be misused to justify forced contemplation + imposed solitude? Yes — and Pascal's stronger forms risk this. The discipline against this: the atom names a STRUCTURAL phenomenon, not a normative prescription about what people should do. Choice + capacity to confront one's condition belong to the person, not to external authorities. Therapeutic + meditative interventions are voluntary + scaffolded."
