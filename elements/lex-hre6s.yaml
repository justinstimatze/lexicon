evokes: [merton-1957, deviant-attitude-isolation, sociometric-friendship-choice, exclusion-versus-correction, insulation-preserves-minority-view]
lineage:
  - source: primary
    text: merton-1957-deviant-attitude-fewer-friends
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.49. Verified against the pdftotext extraction of the source PDF."
    quote: "'Some tentative findings indicate, for example, that in one school a small minority of students believes that the physician ought to exercise firm authoritarian control over patients in the course of therapy. Analysis of data on friendships among students finds that the students who hold to this view, which departs from the attitude most commonly held in the school, are chosen by others as friends far less frequently than would be expected on the assumption that this attitude played no part.'"
  - source: primary
    text: merton-1957-insulation-hypothesis
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education\" (1957), p.49, describing a study by William Nicholls."
    quote: "'Current study is being given to the possibility that such \"deviant\" attitudes tend to persist because those holding these attitudes are thus insulated from intimate association with students holding the more prevalent attitude.'"
canonical-instances:
  - "A workplace where employees who question a popular but flawed process get quietly excluded from lunch groups and informal planning conversations rather than debated — the exclusion is often read as social punishment working as intended, but it also means the skeptics never get the informal exposure that might update their view, or that might let their valid concerns reach the people who could act on them."
  - "An online community shadow-bans or silently drops members who post a minority position, rather than engaging their arguments — the minority members drift into their own separate spaces where the view is never challenged by the majority's actual reasoning, and the position often hardens rather than fading, compared to a norm-enforcement approach that keeps engaging with dissent directly."
critical-questions:
  - "Merton frames this as a hypothesis under active study, not a settled finding — what would distinguish, empirically, a case where isolation preserves deviance from a case where isolation successfully suppresses a minority view that simply never surfaces again (indistinguishable from the outside if the isolated holders leave the group or go quiet)?"
  - "Is there a version of correction that avoids both extremes — neither isolating the deviant minority (preserving the view) nor fully normalizing continued contact (risking the majority view eroding instead) — and if so, what does engagement-without-either-isolation-or-legitimization actually look like in practice?"
