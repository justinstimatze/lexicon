id: lex-68gd3
name: collective-ills-transferred-to-a-scapegoat-then-expelled
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When a community is processing diffuse ill-fortune by blaming a single figure/group, surface the scapegoat structure — the ills are being condensed onto one bearer for expulsion; name the move, because it can be redirected before harm."
related: [lex-33w6z, lex-r3w25, lex-3yvwm, lex-a5hxu, lex-ymckb, lex-fy5k5, lex-avfud]
scaffolds-from: [lex-3yvwm, lex-avfud]
evokes: [find-someone-to-blame, unite-against-a-victim, load-the-sins-onto-a-carrier, expel-the-bearer-of-ills, purge-the-community, the-designated-patient, political-blame-transfer, online-pile-on, vicarious-suffering, transference-of-evil]
lineage:
  - source: primary
    text: frazer-1922-golden-bough-transference-of-evil-and-scapegoats
    citation: "James George Frazer, *The Golden Bough: A Study in Magic and Religion* (abridged edition, 1922). Chapters LV 'The Transference of Evil', LVI 'The Public Expulsion of Evils', and LVII 'Public Scapegoats' (also LVIII 'Human Scapegoats in Classical Antiquity'). Frazer's foundational principle (Ch.LV, lines 28382-28400): the accumulated misfortunes and sins of a whole people can be laid upon a being who bears them away, leaving the people innocent — 'the principle of vicarious suffering.' The evil need not go to a person; it can be transferred to an animal or an inanimate thing, which then acts as a vehicle conveying the trouble away (or to whoever next touches it — the transfer operates by contagion, cf. lex-3yvwm). Ch.LVII generalizes to the PUBLIC scapegoat: at periodic (often annual or calendar-marked) communal purges, the village/town's massed evils are loaded onto a material medium — a ship set adrift (Ceram), an animal, or a human victim — and driven out, after which the community feels cleansed and reunited. The transferable primitive: a group discharges its accumulated collective ills (guilt, disease, misfortune, blame, social tension) by transferring them onto a designated carrier and expelling or destroying it, restoring a sense of purity and unity — WITHOUT addressing the underlying cause. PD globally (Frazer d.1941; 1922 abridged edition pre-1929)."
    quote: "[Frazer 1922 Ch.LV lines 28384-28386]: 'The notion that we can transfer our guilt and sufferings to some other being who will bear them for us is familiar to the savage mind.' [Ch.LVII, lines 29591-29595]: 'the evil influences are embodied in a visible form or are at least supposed to be loaded upon a material medium, which acts as a vehicle to draw them off from the people, village, or town.'"
canonical-instances:
  - "Transference-to-a-vehicle canonical cases (Frazer Ch.LV-LVII): epilepsy struck into tree-leaves then thrown away; a Bahima abscess transferred via buried herbs to the next passer-by; the Ceram demon-ship provisioned with rice and tobacco and set adrift carrying the village's sicknesses out to sea. The common structure: the ill is treated as a transferable load, attached to a material medium, and removed — the medium is the scapegoat in object form. Marker: relief is sought by EXPELLING a loaded carrier, not by treating the condition."
  - "Periodic public purge canonical case (Frazer Ch.LVI-LVII): communities stage calendar-marked expulsions of accumulated evils — masked men personifying devils chased from the village (Pomo, Mandan), the demon-laden bark launched while the people beat gongs and shout that 'the sicknesses are now gone.' The function is communal: the whole population participates and feels collectively cleansed and reunited afterward. Marker: the discharge is a public ritual whose payoff is restored group morale/unity."
  - "Pharmakos / human scapegoat canonical case (Frazer Ch.LVIII, Human Scapegoats in Classical Antiquity): a human victim (often a marginal or expendable person) is laden with the city's ills and driven out or killed to purify the community — the Greek pharmakos, scapegoat rites in ancient Rome. The escalation from object to animal to human victim is Frazer's key continuity, and the bridge to modern human scapegoating."
  - "Organizational-scapegoating transfer instance: after a systemic failure (a missed quarter, an outage, a botched launch) a team or org discharges accumulated blame onto one available member, whose removal relieves the collective bad feeling and restores morale — while the systemic cause (process, incentives, leadership) goes undiagnosed. The Frazer lesson applied: the expulsion purges the FEELING, not the cause. René Girard's scapegoat theory (*Violence and the Sacred*, 1972) is the canonical modern synthesis of the same mechanism without the ritual framing: mimetic rivalry escalates communal tension until it is resolved by uniting against a single victim — political blame-transfer onto a minority or out-group, online pile-ons, and the 'designated patient' in family-systems therapy are the same shape."
  - "operationally distinct from lex-33w6z sacrifice-as-transformation: sacrifice gives up something valued to gain or transform; the scapegoat is loaded with what is UNwanted and expelled to purge. Directionality (discharge-of-bad vs surrender-of-good) and function (restore purity/unity vs effect a transformation/exchange) differ, though a scapegoat is frequently killed sacrificially."
  - "operationally distinct from lex-ymckb subordinated-group-as-magnifying-mirror: lex-ymckb is identity-construction (the dominant self defines itself against a subordinated other); lex-68gd3 is tension-discharge (the group offloads its ills onto a carrier). The same marginal other often serves both, but the mirror builds the self while the scapegoat purges the group."
critical-questions:
  - "how is this distinguished from legitimate accountability? The scapegoat is selected for availability, marginality, or symbolic fit — not for actual causal responsibility — and the aim is to discharge collective bad feeling and restore unity, not to correct a cause. Diagnostic: 'if we remove this carrier, does the underlying condition actually change?' If removal only relieves the group's feeling while the cause persists, it is scapegoating, not accountability."
  - "why does the mechanism work psychologically? It combines the contagion-logic of transference (lex-3yvwm — ills treated as a transferable load), the relief of externalizing internal/systemic conflict onto a single locus, and in-group reunification against a common target (cf. lex-r3w25 tribal perception). Its appeal is precisely that it FEELS resolving — which is its danger, because it forecloses diagnosis of the real (often systemic) cause."
  - "what is the practitioner-actionable upshot? When a group under accumulated stress suddenly converges on blaming one available target, suspect scapegoating. Ask whether removing the target addresses the cause or only the feeling; protect against discharge-without-diagnosis by separating the question 'who do we feel like blaming?' from 'what actually produced this?'. In team retros, name systemic causes before assigning individual fault."
  - "does naming it as scapegoating mean the target is always innocent? No — the target may have real faults; the mechanism is identified by the MISMATCH between the ills assigned and the target's actual causal share, and by the discharge/purity FUNCTION the expulsion serves for the group. A partly-culpable individual can still be scapegoated if they are made to carry the whole of a systemic failure."
  - "where does it compose? lex-68gd3 + lex-3yvwm: the transfer operates by contagion-magic logic. lex-68gd3 + lex-33w6z/0259: the Frazer ritual cluster (sacrifice, dying-king, scapegoat) — overlapping but functionally distinct. lex-68gd3 + lex-ymckb: projection onto a marginal other (identity-mirror vs ill-carrier). lex-68gd3 + lex-r3w25: scapegoating reunifies the in-group against a common target. It is the substrate's anchor for blame-transfer / collective-purge dynamics, previously uncovered."
status: active
