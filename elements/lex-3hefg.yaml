lineage:
  - source: practitioner
    text: wikipedia-trust-social-science
    citation: "Wikipedia 'Trust (social science)' article (en-wp; retrieved via local ZIM dump 2025-12 → local Wikipedia archive, 2026-05-04). Establishes trust as a willingness-to-be-vulnerable structure: the trustor cedes control to the trustee, formed through repeated consistency, in expectation that the trustee will act benevolently. Distinguishes generalized trust (extension to unfamiliar others) from particularized trust (specific to a relationship/situation). Distinguishes trust (about honesty/fairness/benevolence) from confidence (about competence). The verbatim passages below are the most-discriminating definitional and mechanism statements from the article."
    quote: "Trust is the belief that another person will do what is expected and is built through repeated consistency. It brings with it a willingness for one party (the trustor) to become vulnerable to another party (the trustee), on the presumption that the trustee will act in ways that benefit the trustor. In addition, the trustor does not have control over the actions of the trustee. [Lead definition.] Without trust, one should always consider all contingent possibilities, leading to paralysis by analysis. Trust acts as a decisional heuristic, allowing the decision-maker to overcome bounded rationality and process what would otherwise be an excessively complex situation. [Sztompka-tradition mechanism statement.] Once the bet is decided (i.e. trust is granted), the trustor suspends his or her disbelief, and the possibility of a negative course of action is not considered at all. Hence trust acts as a reducing agent of social complexity, allowing for cooperation. [Operational consequence — the suspension-of-disbelief structure.]"
  - source: practitioner
    text: mayer-davis-schoorman-1995-integrative-trust-model
    citation: "Roger Mayer, James Davis, F. David Schoorman, 'An Integrative Model of Organizational Trust,' Academy of Management Review 20(3):709-734 (1995) — the canonical synthesizing paper. Decomposes perceived trustworthiness into the ABI model (Ability + Benevolence + Integrity), with the trustor's propensity-to-trust as a separate dispositional input; trust then drives risk-taking-in-relationship which produces outcomes (Figure 1, p.715)"
    quote: "The definition of trust proposed in this research is the willingness of a party to be vulnerable to the actions of another party based on the expectation that the other will perform a particular action important to the trustor, irrespective of the ability to monitor or control that other party. [p.712 — the canonical definition wired into nearly every subsequent organizational-trust paper.] Being vulnerable implies that there is something of importance to be lost. Making oneself vulnerable is taking risk. Trust is not taking risk per se, but rather it is a willingness to take risk. [p.712 — the trust/risk-taking distinction pivotal for the model.]"
canonical-instances:
  - "the moment you have to commit to depending on someone else BEFORE you can verify they'll come through: ship-relying-on-vendor-SLA, hand-work-off-to-a-team-you-can't-watch, deploy-build-pipeline-the-team-hasn't-seen-fail-gracefully-yet, accept-stranger's-safety-claim. Trust is the bet that lets the cooperation start; without it you're paralyzed checking every contingency. Sztompka: trust is a decisional heuristic that resolves bounded-rationality paralysis"
  - "Mayer/Davis/Schoorman 1995 ABI antecedents: subjects judge trustworthiness along Ability (can they do it?), Benevolence (do they care about my interests?), Integrity (do they hold to principles I share?). The three are partially-independent — high A + low B (capable but indifferent) is a different trust profile than low A + high B (well-intentioned but incompetent). Used widely in organizational research"
  - "generalized vs particularized distinction: generalized trust extends to unfamiliar others (the cultural-institutional substrate that lets you trust strangers in commerce); particularized trust is to a specific party in a specific relationship. Different societies and individuals have different generalized-trust baselines (Putnam's social-capital tradition); particularized trust is built incrementally through repeated consistency"
  - "swift-trust in temporary teams (Meyerson, Weick, Kramer 1996): cross-functional teams formed for a one-time project don't have time to build trust through repeated-consistency. They depend on role-based or category-based trust ('you are a doctor, I am a nurse, we both follow protocol') as a substitute. Operational pattern: when continuity isn't available, formal-role-credibility carries the trust load"
  - "trust-repair after violation: a betrayal opens an asymmetry — apologies + structural assurances are needed but often insufficient. Mayer-tradition research (Kim, Ferrin, Cooper, Dirks 2004) finds competence-violations may be repaired by demonstrating new competence; integrity-violations are much harder to repair. Maps to the Wikipedia-noted distinction: 'A failure in trust may be forgiven more easily if it is interpreted as a failure of competence rather than a lack of benevolence or honesty'"
  - "contractual / competence / goodwill trust (Charles Fried; cultural-competence in healthcare): three application-flavors of trust in working relationships. Contractual trust is the humdrum baseline of voluntary-acceptance-of-obligations (people keep appointments, transactions complete). Competence trust is belief in capacity to do the work. Goodwill trust is belief in counterpart's benevolence and integrity"
  - "operationally adjacent to lex-hbgcb social-proof-as-action-signal: social-proof supplies a substrate for FAST trust-formation (others trust this thing → I should trust it too). The 27.9% co-occurrence in the score corpus reflects this composition pattern. Social-proof × trust-formation is the foundational influence-stack ingredient (Cialdini's six principles share this structure)"
  - "operationally adjacent to lex-5bpee commitment-and-consistency-pressure: commitment-pressure operates within an established trust relationship — the foot-in-the-door works because the small initial commitment is taken seriously by the truster (you trust the asker isn't going to abuse the small ask). Trust precedes commitment-pressure as condition; commitment-pressure exploits the trust"
  - "operationally adjacent to lex-u8u7y social-identity-as-self-concept-determinant: in-group identity supplies a default-trust prior (in-group members get higher trust baseline than out-group). The Asch effect, Gabardine-coat conformity, and 'eat with locals' heuristics all depend on this — trust attaches differentially to in-group vs out-group sources. SIT supplies the identity-categorization that conditions trust assignment"
  - "operationally distinct from lex-vacbr identity-protective-cognition: trust is about willingness-to-be-vulnerable to a specific party; IPC is about willingness-to-accept-information that threatens identity. Both involve identity-relevant credibility judgment, but trust is RELATIONAL (one party trusts another) and IPC is INFORMATIONAL (a claim is accepted or rejected based on identity-fit). Trust-formation supplies one input to IPC (we extend higher credibility to in-group-trusted sources)"
critical-questions:
  - "the competence-vs-benevolence diagnostic: is the question about competence (can they do it?) or about good-faith intent (will they do right by me)? Many 'trust failures' are actually competence failures and have different repair paths than benevolence failures. Misdiagnosing a competence-failure as a benevolence-failure damages relationships unnecessarily; the reverse misses real betrayal. Practitioner-discipline: before assigning the trust-violation diagnosis, name which ABI dimension (Ability, Benevolence, Integrity) failed"
  - "the shortcut-vs-vulnerability check: when does trust-as-heuristic become exploitable? Trust enables cooperation by letting actors skip exhaustive contingency analysis (Sztompka's economic value of trust). But the same shortcut is what con artists exploit. The decision question — WHEN to grant trust, to whom, how much — is itself substantive; the heuristic-quality of trust tends to obscure it. Practitioner-discipline: at high-stakes thresholds, demote trust to explicit-verification"
  - "the swift-trust applicability check: does this temporary team have time to build trust through repeated consistency, or does it need to operate on role-based / category-based substitute? Meyerson-Weick-Kramer 1996 swift-trust applies when continuity is unavailable. The discriminator: how long will this team exist, and what's the cost of mis-cooperation while trust develops?"
  - "the trust-repair-asymmetry check: was the violation a competence-failure (often repairable by demonstrating new competence) or an integrity-failure (much harder to repair)? Kim-Ferrin-Cooper-Dirks 2004 finding. Practitioner-question: which type was this, and does the repair-effort match the failure-type? Apologies + structural assurances are necessary but often insufficient; the repair-path depends on the failure-type"
