id: lex-pa3yb
name: pay-a-specialist-in-the-byproduct-thats-worthless-to-you
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you're facing a task that's genuinely impossible in the time you have, look for someone whose specialty happens to need exactly the byproduct your task produces as waste -- what costs you nothing to give away can be precisely what makes a specialist willing to do the entire job for you, and do it better than you could have. In Cushing's telling, two gods are set an impossible task: scrape and soften a mountain of buckskins by sunset the next day, 'more here than we can clean in a year.' They stumble on a village of Field-mice, who need wool for their nests and offer a trade with no real cost to the brothers at all: 'we will help you if you will promise us something... that you will give us all the hair.' The hair is pure waste to the brothers -- 'we will be glad to get rid of it' -- but it's exactly the resource the mice's whole economy runs on. The mice don't just complete the task; they do it better than the brothers could have: 'they did it better than the men.' The trade only works because the two parties wanted completely different parts of the same material -- neither side had to give up anything they actually valued. Diagnostic move: when you're stuck on a task at a scale you can't manage alone, don't look only for someone who can do the whole job for money or favor -- look for whoever's specialty depends on the exact leftover, waste, or byproduct your task would otherwise generate, since that mismatch in what each side values is what makes a trade that costs you nothing possible in the first place."
