  - source: primary
    text: radin-trickster-uses-coyotes-pride-in-his-own-strength-to-trap-him
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 46. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Grandson, I know you are very strong and therefore I wish to tell you that there is an animal over there near the village, lying dead. If you will push it aside, it will be good.' ... Coyote was very much delighted and went to the place. ... 'I am very strong and I know that I can pull this animal. The animal that I am about to pull is called an elk or a deer.' ... He woke the horse up and it got scared. Up it jumped and finding an animal tied to its tail it got even more frightened and began racing at full speed. ... They untied the coyote and his mouth just twitched as he sat up. He was very much ashamed. He did not even go back to his lodge. He left the village and was not more seen."
canonical-instances:
  - "A rival executive, having learned a colleague is plotting to undermine them, arranges through a mutual friend for the colleague to be invited to 'personally handle' a client known to be notoriously difficult, framed as a compliment to the colleague's famous negotiation skill, and lets the colleague's own eagerness to prove that reputation walk them into a meeting rigged to blow up publicly."
  - "A scammer targeting someone known for pride in their financial savvy has a mutual contact mention that a particular investment opportunity is 'probably too sophisticated for most people to spot early,' relying entirely on the target's desire to prove their own sharpness to get them to commit funds without the scrutiny they would normally apply."
critical-questions:
  - "Would coyote have approached the same task with more caution if the request had come directly from Trickster rather than through a sympathetic-seeming mouse, and does the use of an intermediary matter more for hiding Trickster's involvement or for making the flattery feel more sincere?"
  - "Is coyote's downfall really about pride in strength specifically, or would any framing that appealed to a trait he valued, cleverness, generosity, courage, have worked just as well -- does the diagnostic generalize past strength to any publicly known self-image?"
  - "Does Trickster's preemptive strike here, retaliating before coyote's own trick is executed, change the moral standing of the trap compared to an unprovoked one, and does the story present this as justified self-defense or simply as one trickster outmaneuvering another?"
