id: lex-4ey8t
name: a-besieging-coalition-converts-an-unwinnable-retreat-into-a-dignified-unity
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a besieging coalition realizes it cannot actually defeat a defender who has been conciliatory rather than hostile, the coalition can convert its retreat into an act of collective unity and dignity — declaring one member king together and formally departing — rather than simply admitting defeat piecemeal. In the Jataka''s tale of Prince Samvara, the ninety-nine brothers, unable to defeat Samvara and moved by his generosity, reframe their withdrawal as their own collective decision: "''Now we cannot all uplift the Umbrella at the same moment; let us uplift it over one only, and let him alone be king; so when we see him, we will hand over the royal treasure to him, and return to our own provinces.''"'
related: []
evokes: [jataka, ekadasanipata, samvara-jataka, face-saving-climbdown, graceful-collective-retreat]
lineage:
  - source: primary
    text: jataka-chalmers1895-samvara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 462, Samvara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Now we cannot all uplift the Umbrella at the same moment; let us uplift it over one only, and let him alone be king; so when we see him, we will hand over the royal treasure to him, and return to our own provinces."
canonical-instances:
  - "A coalition of rival bidders who realize none of them can outbid the frontrunner agree among themselves to jointly congratulate the winner and withdraw as a unified gesture of respect, rather than each losing separately and visibly."
critical-questions:
  - "Does framing the retreat as their own collective decision actually change the underlying fact of defeat, or does it just make the same outcome easier for the losing coalition to live with afterward?"
status: active
