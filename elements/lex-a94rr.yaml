id: lex-a94rr
name: slips-and-mistakes-need-different-prevention-strategies
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Before designing a fix for a recurring user error, classify which of two structurally different kinds it is, because the two need opposite remedies. Nielsen's heuristic distinguishes them cleanly: a slip is an unconscious error caused by inattention -- the person's intention and mental model were correct, but execution went wrong (a fat-fingered click, a skipped confirmation they meant to read). A mistake is a conscious error caused by a mismatch between the person's mental model and how the system actually works -- the execution matched their intention exactly, but the intention itself was wrong. A remedy aimed at the wrong kind does nothing, or actively frustrates. Constraints and good defaults fix slips: a disabled button, a required field, a two-step confirmation catches the person whose intention was right but whose hand or attention slipped -- these work precisely because they intervene at the point of execution, which is where a slip actually goes wrong. The same constraints do nothing for a mistake, because the person's execution was already flawless; what's wrong is upstream, in what they believed the system would do. Mistakes need memory-load reduction, undo, and warnings that surface the gap between the model and the system -- interventions aimed at correcting belief, not catching a slipped hand. Diagnostic move before building any error-prevention feature: tell the person what actually happened and listen for which kind of surprise comes back. 'Oh, I didn't mean to do that' is a slip -- their own intention surprised them. 'Wait, that's not what I thought would happen' is a mistake -- the system's actual behavior didn't match what they expected going in. The two answers point at opposite fixes, and building the slip-fix for a mistake-shaped problem (or vice versa) burns effort on a repair that structurally cannot reach the actual failure."
