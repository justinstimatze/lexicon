id: lex-j9fzs
name: winning-the-audience-with-a-general-principle-before-settling-the-personal-grievance
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you're confronted with a personal plea in front of an audience that's already sympathetic to the other side, answering the plea directly puts you in the position of refusing a specific person while everyone watches — but stating the general principle their request violates lets the audience convict the request on its own, so by the time you address the person, the room has already turned before you've said a personal word to them. In the Jataka's tale of Sona and Nanda, a hundred kings arrive backing Nanda's plea to share in caring for their parents; instead of answering Nanda, the Bodhisatta first addresses the assembled kings with a general teaching — \"Whoso shall ancient precedent of his forefathers spurn, sinning against his elders, he, reborn in hell, shall burn... a charge upon the eldest son will evermore abide\" — and only after they \"forsook the sage Nanda and became devoted to the Great Being\" does he turn to forgive his brother personally."
related: []
evokes: [jataka, sattatinipata, sona-nanda-jataka, principle-before-person, audience-capture-precedes-resolution]
lineage:
  - source: primary
    text: jataka-francis1905-sona-nanda-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XX (Sattatinipata), No. 532, Sona-Nanda-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "All ye that swell my brother's train, my words now hear in turn; Whoso shall ancient precedent of his forefathers spurn, Sinning against his elders, he, reborn in hell, shall burn. [...] As eldest son this heavy charge I gladly undertake, And as a pilot guards his ship, the Right I'll ne'er forsake. On hearing this all the kings were highly delighted [...] and they forsook the sage Nanda and became devoted to the Great Being."
canonical-instances:
  - "A tenured professor is publicly petitioned by a student group, backed by several junior faculty, to grant a blanket deadline extension; instead of answering the specific students, she addresses the department first on the general principle of fairness to students who met the original deadline — winning the room's agreement before turning to negotiate individually with the petitioners."
  - "A CEO facing a public walkout demand from employees backing a colleague's grievance doesn't respond to the colleague first; she opens the all-hands by stating the company's general conflict-of-interest policy, gets visible nods from the room, and only then addresses the specific complaint — now with the room's expectations already reset."
critical-questions:
  - "The tactic works partly because Sona is also correct on the merits — is stating a general principle a legitimate way to reach a true judgment through the room's consent, or does routing a personal dispute through a crowd's applause substitute social pressure for an argument that should be settled between the two people directly involved?"
  - "The kings 'forsook' Nanda entirely rather than just updating their view of the specific request — does winning the audience with a general principle risk overcorrecting, turning a room that arrived sympathetic to one person into one that abandons them on every count, not just the one in question?"
status: active
