id: lex-k7b43
name: a-broken-rules-consequence-doesnt-scale-down-for-loving-intent
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a rule exists to prevent a specific catastrophic outcome, breaking it produces that outcome regardless of whether the violation came from malice, carelessness, or the purest possible motive -- the mechanism that enforces the consequence doesn't check intent before it fires. Coyote breaks the prohibition against touching his resurrected wife not out of foolishness or defiance but from the single most sympathetic impulse available: 'the joy of having his wife again overwhelmed him.' The death spirit's response doesn't discount the outcome for the goodness of the motive: 'You inveterate doer of this kind of thing! I told you not to do anything foolish. You, Coyote, were about to establish the practice of returning from death. Only a short time away the human race is coming, but you have spoiled everything and established for them death as it is.' A moment of pure love produced exactly the same result a moment of pure carelessness would have -- mortality fixed as permanent for the entire species to come. The story doesn't soften this; it treats the outcome as settled by the act itself, not by the feeling behind it. Diagnostic move: when a rule protects against a large, structural consequence (not just a personal or interpersonal one), don't assume a well-intentioned violation will be treated more leniently by whatever mechanism enforces the rule -- some consequences are set by what happened, not by what was meant, and the most loving reason for breaking a rule can still trigger its worst outcome."
related: []
evokes: [hyde-trickster-makes-this-world-an-old-story, coyote-and-the-shadow-people, joyous-impulse, established-for-them-death-as-it-is]
lineage:
  - source: primary
    text: hyde-coyotes-loving-impulse-establishes-death-with-the-same-severity-as-carelessness-would
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Interlude, 'The Land of the Dead,' quoting Archie Phinney's 1934 translation of 'Coyote and the Shadow People.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "But suddenly a joyous impulse seized him; the joy of having his wife again overwhelmed him. He jumped to his feet and rushed over to embrace her. ... When the death spirit learned of Coyote’s folly he became deeply angry. “You inveterate doer of this kind of thing! I told you not to do anything foolish. You, Coyote, were about to establish the practice of returning from death. Only a short time away the human race is coming, but you have spoiled everything and established for them death as it is.”"
canonical-instances:
  - "A well-meaning employee, moved by compassion for a struggling colleague, quietly overrides a safety protocol to let them keep working past a mandatory rest period, and when a preventable accident results, the investigation treats the outcome exactly as it would have treated a careless or malicious violation, because the protocol existed to prevent that specific outcome regardless of motive."
  - "A parent, out of pure love, breaks a custody agreement's no-contact provision to comfort a child during a hard moment, and the court's response to the violation is unaffected by the tenderness of the motive, because the provision was designed to prevent a specific pattern of harm the court cannot verify wasn't present just because this instance felt loving."
critical-questions:
  - "Is it actually true that no system distinguishes motive from outcome -- do most real-world rule-enforcement mechanisms (legal, social, institutional) genuinely ignore intent, or does the myth's harshness reflect a specifically mythic, pre-legal severity that most functioning systems have since built in leniency to avoid?"
  - "Does treating well-intentioned and malicious violations identically risk deterring people from ever taking a compassionate risk near a high-stakes boundary, since the downside is the same regardless of how carefully or lovingly they approach it?"
  - "Is the death spirit's anger actually about the outcome being fixed regardless of intent, or is it specifically because Coyote was warned repeatedly and chose to disregard the warning in the moment, meaning foreknowledge and disregard, not the loving quality of the impulse, is what removed any leniency?"
status: active
