lineage:
  - source: primary
    text: Darwin-1859-OnTheOriginOfSpecies
    citation: "Charles Darwin, *On the Origin of Species by Means of Natural Selection* 1st edition (John Murray 1859). (PG #1228). Darwin's foundational claim is a THREE-COMPONENT mechanism, not a single principle: (1) VARIATION exists within populations — heritable individual differences arise spontaneously; (2) DIFFERENTIAL SURVIVAL operates on those variations — under conditions of resource scarcity ('struggle for existence'), individuals with favorable variations survive and reproduce more; (3) INHERITANCE transmits the favorable variations to offspring with high (but not perfect) fidelity. When all three components are present, the population accumulates favorable variations across generations — 'descent with modification.' Darwin emphasizes that ALL three components must operate together; missing any one breaks the cumulative-adaptation process (no variation → no selectable differences; no differential survival → all variants persist equally; no inheritance → each generation starts from scratch). The transferable claim is NOT biological-evolution specifically; it is the three-component substrate-mechanism by which any population with these three properties accumulates adaptation to its environment-of-selection."
    quote: "[Darwin 1859 Ch.IV 'Natural Selection':] 'This preservation of favourable variations and the rejection of injurious variations, I call Natural Selection. Variations neither useful nor injurious would not be affected by natural selection, and would be left a fluctuating element, as perhaps we see in the species called polymorphic.' [And on the three-component mechanism throughout Chs. III-V:] Ch.III 'Struggle for Existence' supplies the differential-survival component; Ch.IV 'Natural Selection' names the selection-preserves-favorable-variations principle; the variation + heredity components are established in Ch.I 'Variation under Domestication' (artificial selection as analog) + Ch.II 'Variation under Nature.' [Practitioner-extraction: the transferable form requires all three — variation + differential survival + inheritance. Each component alone explains nothing; together they explain cumulative-adaptation. The mechanism is substrate-agnostic — it operates wherever the three components co-occur: biological populations, designed systems, ideas, organizations, software, learning agents.]"
  - source: practitioner
    text: cross-domain-three-component-selection-attestation
    citation: "Cross-domain attestation: (a) Genetic algorithms / evolutionary computation (Holland 1975 *Adaptation in Natural and Artificial Systems*; Goldberg 1989 *Genetic Algorithms*): explicit instantiation — solution-population varies via crossover + mutation (variation), fitness-function selects (differential survival), the surviving solutions seed the next generation (inheritance). The atom is the substrate-claim; GA is the algorithmic instantiation. (b) Memetic transmission (Dawkins 1976 *The Selfish Gene* Ch.11 'Memes'; Blackmore 1999 *The Meme Machine*): ideas vary through copying-error + recombination, get selected by social-attention + memorability + reproductive-success-of-hosts, and propagate via cultural inheritance. The atom in the cultural-evolution layer. (c) Cultural evolution (Boyd & Richerson 1985 *Culture and the Evolutionary Process*; Henrich 2015 *The Secret of Our Success*): cumulative-cultural-adaptation through variation in technological + behavioral practices, differential-survival via demographic + economic success, and inheritance via teaching + imitation. The atom is THE underlying claim of the field. (d) Market competition (Alchian 1950 'Uncertainty, Evolution, and Economic Theory' *J. Political Economy* 58:211-221; Nelson + Winter 1982 *An Evolutionary Theory of Economic Change*): firms vary in routines + strategies, markets select via profit + survival, successful patterns inherit via imitation + corporate-DNA. Alchian explicitly applies Darwin to economics. (e) Scientific knowledge (Hull 1988 *Science as a Process*; Campbell 1974 'Evolutionary Epistemology'): theories vary, evidence + community-evaluation selects, citation + textbook-transmission inherits. The atom in epistemology layer. (f) AI training: candidate model-parameters vary (via gradient noise, random initialization, hyperparameter search), validation-loss selects, weights inherit across training epochs. Modern reinforcement-learning explicitly uses evolutionary-strategies (Salimans 2017 'Evolution Strategies as a Scalable Alternative to RL'). (g) Language evolution (Croft 2000 *Explaining Language Change*): linguistic variants compete, social-selection determines which propagate, generational inheritance fixes successful variants. Sound-change + grammaticalization patterns follow the three-component mechanism. (h) Product / startup evolution (Ries 2011 *The Lean Startup*; customer-discovery methodology): product variants emerge, market-validation selects, successful patterns inherit across pivots. The atom is the substrate-claim of iterative product-development. (i) Immune system (clonal-selection theory, Burnet 1959): immune cells vary via somatic-hypermutation, antigens select the variants that bind, surviving variants proliferate and inherit. Immunology is biology-internal but operates by the same three-component mechanism at the cellular layer (separate from organism-level natural-selection)."
    quote: "Transferable scope: applies wherever a population has — (a) heritable variation among individuals; (b) differential-survival or differential-reproduction tied to those variations; (c) inheritance of variations from survivors. When all three are present, cumulative-adaptation occurs over generations. Operational diagnostic: (1) identify the unit of selection (organisms, ideas, firms, parameters, products). (2) test each of the three components: is there variation? does the variation correlate with differential outcome? do successful units transmit their variations forward? If any component is absent, the mechanism fails. The atom predicts: (i) where all three are present, the population WILL adapt to its environment-of-selection over time, even without any intentional design; (ii) the rate of adaptation depends on variation-magnitude × selection-strength × inheritance-fidelity; (iii) when the environment-of-selection changes, the population lags but eventually re-adapts; (iv) sub-optimal local-equilibria are predictable (selection cannot anticipate future environments). The atom does NOT predict that selection produces 'progress' or 'improvement' in any absolute sense — only adaptation to whatever-the-current-environment-selects-for. Critical companion: lex-5kjya costly-signaling — signaling-equilibria arise within natural-selection contexts (signalers + receivers evolve together); lex-f74h5 authenticity-premium — variations in counterfeit-detectability evolve under the same mechanism. [synthesis 2026-05-25]"
canonical-instances:
  - "Darwin 1859 (canonical-case): biological populations adapt to their environments via variation-plus-natural-selection-plus-inheritance. Darwin's *Origin* establishes the mechanism via (i) artificial-selection analog (Ch.I — breeders demonstrate variation + selection + inheritance produces adaptation; therefore nature's parallel process can do the same), (ii) struggle for existence (Ch.III — Malthusian population dynamics ensure differential survival), (iii) natural selection proper (Ch.IV — the mechanism named + operationalized), (iv) supporting evidence (Chs. V-XIV)."
  - "Genetic algorithms (Holland 1975, Goldberg 1989): solution-space populations vary via crossover + mutation; fitness-function selects; survivors seed next generation. Direct algorithmic instantiation of Darwin's mechanism. Used in optimization, ML hyperparameter search, evolutionary computation broadly."
  - "Memetic transmission (Dawkins 1976 *Selfish Gene* Ch.11; Blackmore 1999 *Meme Machine*): ideas vary via copying-error + recombination, get selected by social attention + reproductive-success-of-hosts, propagate via cultural inheritance. The atom in cultural-evolution layer."
  - "Cultural evolution (Boyd & Richerson 1985; Henrich 2015 *Secret of Our Success*): cumulative-cultural-adaptation through variation in practices, selection via demographic-economic success, inheritance via teaching + imitation. Henrich shows the atom explains uniquely-human capability for accumulating-adaptation faster than genetic-evolution alone."
  - "Market competition (Alchian 1950 'Uncertainty, Evolution, and Economic Theory'; Nelson + Winter 1982): firms vary in routines + strategies, markets select via profit + survival, successful patterns inherit via imitation + organizational DNA. Alchian shows even uninformed rational-choice models can be derivable from the three-component evolutionary process."
  - "Scientific knowledge (Hull 1988; Campbell 1974 'Evolutionary Epistemology'): theories vary, evidence + community-evaluation selects, citation + textbook-transmission inherits. Evolutionary-epistemology framework applies the atom to science itself."
  - "AI training: candidate parameter-configurations vary, validation-loss selects, weights inherit. Reinforcement learning increasingly uses evolution-strategies (Salimans 2017) and natural-evolution-strategies (Wierstra 2008). Modern AI directly applies Darwin's mechanism."
  - "Language evolution (Croft 2000): linguistic variants emerge, social-selection determines propagation, generational inheritance fixes successful variants. Sound-change + grammaticalization patterns instantiate the three-component mechanism in linguistic-historical layer."
  - "Lean startup / product evolution (Ries 2011): MVP variants emerge, market-validation selects, successful patterns inherit across pivots. Customer-discovery methodology IS evolutionary-design applied to product-market-fit."
  - "Immune system (Burnet 1959 clonal-selection): immune-cells vary via somatic-hypermutation, antigens select the variants that bind, surviving variants proliferate. Cellular-immunology operates by the same three-component mechanism — separate from organism-level natural-selection but identical in structure."
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: 0094 names feedback-loops generically; 0320 names the specific three-component-feedback that produces cumulative-adaptation. 0320 is a structured-form-of-feedback. They compose: natural-selection IS a particular feedback-loop, but not every feedback-loop instantiates natural-selection."
  - "operationally adjacent to lex-vtytt crisis-recognition-and-orientation: 0145 is paradigm-shift recognition; 0320 is the evolutionary-adaptation mechanism. They can compose — paradigm-shifts in fields often follow evolutionary-dynamics (variation among proposed theories → selection by evidence/community → inheritance via citation)."
  - "operationally adjacent to lex-wkcck sign-value-is-differential-relational: 0316 is structuralist theory of how value emerges; 0320 is evolutionary theory of how adapted-structures emerge. They compose at the meta-layer: differential-relational-systems can themselves evolve via the three-component mechanism."
  - "operationally adjacent to lex-f74h5 authenticity-premium-rises-with-slop: 0287 is a specific selection-dynamic in counterfeit-environments; 0320 is the underlying selection-mechanism. 0287 is a special case of 0320."
  - "operationally adjacent to lex-5kjya costly-conspicuous-waste-as-status-signal: 0318 is the signaling-equilibrium within evolutionary contexts; 0320 is the underlying selection-mechanism. They co-fire in many social-evolutionary analyses (Zahavi 1975 handicap-principle requires natural-selection to operate); 0318 is a specific stable-equilibrium that 0320 can produce."
critical-questions:
  - "are all three components really present in the candidate-application? Common failure-mode: identifying ONE component (e.g., differential outcome) and inferring evolutionary-adaptation without verifying the other two (variation + inheritance). Diagnostic: explicitly test for each component. If variation is missing, the system is in stasis. If inheritance is missing, each generation starts from scratch (no cumulative adaptation). If differential survival is missing, all variants persist (no direction)."
  - "is the unit of selection well-defined? Selection acts on units that vary, survive, and reproduce. In biological evolution the unit is often individual organisms but can be genes (Dawkins 1976), groups (group-selection, contested), or species (Eldredge + Gould 1977 punctuated equilibrium). In other domains: ideas (memes), firms, products, papers, parameters. The atom requires SOMETHING to be the unit; the literature debates which unit is most explanatory in each domain."
  - "does the atom imply 'progress' or 'improvement'? No, and care is needed not to imply this. Selection produces adaptation to current-environment, not progress on any absolute scale. When environments change, prior adaptations become liabilities (adaptation-mismatch). The atom is normatively-neutral about whether selected outcomes are 'good' from any external perspective. Social-Darwinism is the historical misuse of the atom that conflates adaptation with progress; the atom should not be cited to support such conflations."
  - "what about Lamarckian-style inheritance of acquired characteristics? Darwin's mechanism specifies INHERITANCE of variations but is agnostic about how variations arise. Modern biology adds: variations are largely random with respect to fitness (Mendelian genetics + DNA). Lamarckian inheritance (acquired-characteristics) is rare in biological systems but COMMON in cultural-evolution (skills learned in one's lifetime are taught to next generation). The atom's three-component form survives the Lamarckian-extension; what changes is the variation-generation step."
  - "is selection 'designed' if it's intentional? Distinction: artificial-selection (breeder intentionally selects) vs natural-selection (no intentional agent). Darwin uses artificial-selection as didactic analog. Many cross-domain applications (Lean Startup, GA, breeding) are explicitly intentional. The atom's mechanism operates equally in both — the three components are required regardless of intentionality. The 'designed-vs-undesigned' distinction matters for OTHER claims (e.g., teleology) but not for the substrate-mechanism."
