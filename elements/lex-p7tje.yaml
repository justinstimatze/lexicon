    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Hallmarks of Trickster's Mind.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "we have a first mark of trickster’s cunning: it closes off a passage to capture its prey, or it finds a hole to elude its foe. It can seize an opportunity or block an opportunity. ... When the humpback whale comes upon a school of herring, it dives deep and then swims in a slow circle, exhaling all the while, so that a cone of bubbles rises through the water. The herring in the school misperceive this “bubble net” as a barrier through which they cannot swim. Having confined the school, the whale then rises through the center of the bubble net, its mouth open and filling with fish."
canonical-instances:
  - "A security researcher who is skilled at finding overlooked openings in a network's perimeter to slip past detection is, for the same reason, exactly the person a company should hire to design a perimeter with no overlooked openings -- both tasks draw on the identical skill of seeing where passages actually are."
  - "A magician skilled at making a coin vanish through a genuinely open gap the audience can't perceive is equally skilled at making a closed box look impossibly sealed when it actually has a hidden opening -- the same craft of controlling what the audience believes about passages runs both directions."
critical-questions:
  - "Are opening-finding and closing-fabricating really symmetric skills, or does one require more creativity (inventing a plausible illusion of barrier) while the other requires more perception (noticing a genuine gap that already exists), making them related but not identical?"
  - "Does the bubble net example actually prove bidirectionality, or could a whale be evolved specifically for trapping and have no corresponding ability to find escape routes, meaning the humpback's case doesn't generalize to trickster's dual competence?"
  - "In practice, does a being who has mastered blocking passages ever get outcompeted by a specialist purely focused on opening them, suggesting that even if the underlying skill is shared, specialization in one direction still produces an edge?"
