id: lex-wkf6c
name: unusual-privilege-can-be-the-tell-of-impending-sacrifice-not-favor
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An abrupt upgrade in treatment, envied by those still on the ordinary track, can be the leading sign that its recipient is about to be consumed rather than rewarded, and the two possibilities can look identical from outside until the outcome arrives. In the Jataka's tale of the pig Munika, the animal is fattened on rich rice for an upcoming wedding feast while the household's oxen keep eating plain fodder — the oxen see this as unfair favoritism until Munika is slaughtered for the feast, and it becomes clear the rich diet was never a reward at all. The stanza names the actual comparative advantage directly: the mundane, enduring option that looks worse day to day is the one that lasts, precisely because it never attracted the kind of attention that ends in consumption."
related: []
evokes: [jataka, ekanipata, munika-jataka, privilege-as-tell-of-sacrifice, enduring-mundane-option-outlasts-envied-one]
lineage:
  - source: primary
    text: jataka-chalmers1895-munika-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 30, Munika-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Then envy not poor Munika; 'tis death He eats. Contented munch your frugal chaff,-- The pledge and guarantee of length of days."
canonical-instances:
  - "A team member is suddenly pulled off routine work and given a high-visibility solo project with none of the usual oversight, envied by colleagues still doing ordinary tickets, until the project becomes the sole justification for a layoff decision the company had already made."
critical-questions:
  - "Is there any reliable signal that distinguishes genuine reward from fattening-for-sacrifice before the outcome arrives, or does the distinction only ever become visible in hindsight?"
  - "Does staying on the unglamorous, enduring track actually protect someone the way it protects the oxen, or does it just mean a different, less dramatic kind of vulnerability that the story doesn't examine?"
status: active
