id: lex-dmqxm
name: broader-perceived-task-competence-reduces-preferential-case-avoidance
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone in a role develops a preference for easier cases over harder ones despite an obligation to serve all alike (a doctor preferring physically- over emotionally-ill patients, a caseworker preferring cooperative over resistant clients, a teacher preferring engaged over disruptive students), check their perceived competence across the FULL RANGE of tasks the difficult case actually requires, not just their competence at the case's most visible or nominal skill. Martin traces this concretely for physicians and emotionally-ill patients, who require tolerating the patient's distress and hostility rather than any special diagnostic skill; self-confidence at exactly that task predicted neutrality between illness types: 'Among the completely confident students, 62 per cent have no preference between a primarily physical or primarily emotional illness, in comparison with only 32 per cent of those with little confidence (Table 23).' He then generalizes past the one item to the whole battery of preferences: 'This finding may be provisionally extended to this hypothesis: the wider the range of tasks students feel competent to perform, the less marked should be their tendency to prefer certain types of patients to others.' Measuring self-rated confidence across nine distinct clinical tasks (venipuncture, dosage decisions, treating a doctor as patient, delivering bad news, emergency response, delivering a negative workup, a difficult diagnosis, preventing patient embarrassment, and handling an emotional outburst) and testing it against the breadth-of-preference count confirmed the generalized version: 'Figure 11 shows that students who feel confident in most or all respects are less given to partiality in their attitudes toward patients than their classmates. In general, the higher the degree of confidence, the smaller the average number of preferences.' The mechanism is avoidance-REDUCTION through competence, not attitude change through instruction: someone doesn't stop preferring easy cases because they were told to be impartial — they stop needing to avoid the hard case once they trust they can actually handle what it demands of them."
