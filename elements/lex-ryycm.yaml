id: lex-ryycm
name: suppressing-through-due-process-legitimizes-what-it-targets
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When an opponent tries to destroy or suppress something by routing the attempt through a neutral, rule-bound procedure (a courtroom, a formal hearing, a legally-mandated review), the procedure's own legitimacy-conferring machinery can end up certifying the very thing it was meant to eliminate -- because the procedure requires presenting the material formally, on the record, to an impartial decision-maker, the act of prosecuting it becomes indistinguishable from the act of authenticating it. Hyde describes exactly this outcome when Cincinnati sheriff's deputies raided the Mapplethorpe exhibit hoping to suppress it: 'A measure of his success is the degree to which his opponents helped move the drama to its classic conclusion. It's touching, actually, how those sheriffs deputies signed on as part of Mapplethorpe's posthumous crew, making that videotape of the dirt, carrying it to the courthouse, and presenting it with juridic formality to their fellow citizens. This modern shit finally found its way into the sacred throne room, and because in that setting the law of the land imposed certain constraints, the elevated powers had to let it lie there.' The prosecutors needed the images entered as evidence to make their case, expert witnesses testified to their artistic merit under oath, and the jury's not-guilty verdict became a legal certification that the material was art, not obscenity -- an outcome none of that machinery could have produced if the material had simply been ignored. Diagnostic move: before routing a suppression effort through a formal, rule-bound, evidentiary process, ask whether that process's own procedural requirements (presenting the material fully, subjecting it to expert testimony, requiring a reasoned public verdict) will functionally authenticate and preserve exactly what the effort meant to destroy -- a neutral procedure applied to a genuine transgression often cannot suppress without first legitimizing."
related: [lex-bjqgm]
evokes: [hyde-trickster-makes-this-world-matter-out-of-place, mapplethorpes-posthumous-crew, juridic-formality, the-elevated-powers-had-to-let-it-lie-there]
lineage:
  - source: primary
    text: hyde-mapplethorpes-prosecution-legitimizes-what-it-tried-to-suppress
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Democratic Carnival,\"' on the 1990 Cincinnati obscenity trial over Robert Mapplethorpe's photographs. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "If he succeeds in creating that “single continuum” he becomes a dirt-worker in the classic trickster lineage, one who usefully disturbs the shape of things by crossing or reworking the line between the elevated and the excremental. A measure of his success is the degree to which his opponents helped move the drama to its classic conclusion. It’s touching, actually, how those sheriffs deputies signed on as part of Mapplethorpe’s posthumous crew, making that videotape of the dirt, carrying it to the courthouse, and presenting it with juridic formality to their fellow citizens. This modern shit finally found its way into the sacred throne room, and because in that setting the law of the land imposed certain constraints, the elevated powers had to let it lie there."
canonical-instances:
  - "A government tries to suppress a leaked document by prosecuting the person who published it, and the trial requires reading the document's contents into the official court record and having expert witnesses testify to its accuracy, so the prosecution accomplishes the permanent, authoritative public archiving of exactly the material it was trying to bury."
  - "A school board attempts to ban a book by holding a formal public hearing on its content, which requires reading contested passages aloud into the minutes and having literary experts testify to the book's merit, producing an official record that certifies the book's value more thoroughly than the book's own publisher ever did."
critical-questions:
  - "Is this outcome specific to legal/evidentiary procedures, or does any sufficiently formal, rule-bound review process (an institutional ethics review, a corporate compliance investigation) carry the same legitimizing risk -- what's the general boundary of 'due process' here?"
  - "Does this claim hold when the suppressing side controls the procedure's outcome (a rigged trial, a hearing before a hostile board), or does the legitimizing effect specifically depend on the procedure being genuinely neutral and rule-bound, as the Mapplethorpe jury trial was?"
  - "Could a suppressor route around this risk by using informal or extra-legal means (quiet pressure, denial of platform) precisely to avoid the legitimizing machinery of formal process -- and if so, does that make formal due process a worse tool for suppression but a better one for the suppressed?"
status: active
