id: lex-h3ewa
name: forgetting-ones-own-past-turns-a-long-finite-span-into-felt-eternity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A being with an extremely long but still finite lifespan can forget its own prior deaths and rebirths, and from within that induced amnesia mistake "longer than I can remember" for "permanent and uncaused." In the Jataka''s tale of Baka-Brahma, the deity states his false eternalism this way: "this world, my lord, is perpetual, it is permanent, it is eternal, it is absolute, it is unchanging; this world is not born, it decays not, it dies not, it passes not away, it is not born again: apart from this world there is no other salvation beyond."'
related: []
evokes: [jataka, sattanipata, baka-brahma-jataka, scale-blindness-mistaken-for-absoluteness, forgotten-history-produces-false-eternalism]
lineage:
  - source: primary
    text: jataka-chalmers1895-baka-brahma-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 405, Baka-Brahma-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "this world, my lord, is perpetual, it is permanent, it is eternal, it is absolute, it is unchanging; this world is not born, it decays not, it dies not, it passes not away, it is not born again: apart from this world there is no other salvation beyond."
canonical-instances:
  - "An institution that has outlasted every living employee's memory of its founding comes to be spoken of by its own staff as though it simply always existed and always will, rather than as a finite arrangement that happened to start somewhere and could end."
critical-questions:
  - "Is there any way to distinguish, from the inside, a genuinely permanent state from one that merely exceeds the observer's own memory or record-keeping?"
  - "What would it take for a being or institution in this position to recognize its own finitude before an external challenge forces the recognition on it?"
status: active
