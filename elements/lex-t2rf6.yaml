id: lex-t2rf6
name: acute-fear-totally-overwrites-a-dominant-prior-motivation
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Sudden, immediate fear during a crisis doesn't just compete with or dampen a person's strongest prior motivation -- it can erase it from awareness entirely in the moment, so that a desire that felt all-consuming seconds earlier disappears rather than merely being outweighed. High Horse has spent the whole story sick with lovesickness, unable to eat, ready to die for the girl he's about to rescue from her own tepee. Lying flat and frozen while the old woman stirs and might discover him, that consuming desire vanishes completely, not weakened, not deprioritized, gone: 'he just forgot everything, even how beautiful the girl was.' The story doesn't say the fear made her beauty matter less. It says he forgot it -- the strongest motivation of his life, absent from his mind at the exact moment it should have mattered most."
related: []
evokes: [black-elk-speaks, high-horses-courting, he-just-forgot-everything, even-how-beautiful-the-girl-was, fear-erases-not-just-outweighs]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch6-high-horses-courting
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 6, 'High Horse's Courting.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "But High Horse was so scared by now that he lay very still and as flat to the ground as he could. [...] And while he was lying there waiting for the old woman to snore, he just forgot everything, even how beautiful the girl was."
canonical-instances:
  - "A person who has spent months obsessing over asking for a raise finds the entire question completely absent from their mind during a sudden layoff announcement, not deferred or deprioritized but genuinely not there."
  - "A student consumed with anxiety about a crush walking by suddenly stops thinking about them entirely the instant a fire alarm goes off, the infatuation not fading but simply gone from awareness until the danger passes."
  - "A soldier who has thought of nothing but a letter from home for weeks reports total blankness about it during an actual firefight, unable later to recall thinking about anything except the immediate threat."
critical-questions:
  - "Is the motivation actually gone during the fear, or is it more accurate to say it's inaccessible to conscious report while still influencing behavior beneath awareness -- and how would you tell the difference from the outside?"
  - "Does the totality of the erasure scale with the intensity of the fear, or is there a threshold effect where fear either fully displaces competing motivations past some point or barely touches them below it?"
  - "High Horse's desire for the girl returns immediately once the danger passes, he's back to sneaking around soon after -- does the completeness of its disappearance during the fear actually matter if it resumes exactly where it left off, or was something permanently different about him afterward?"
status: active
