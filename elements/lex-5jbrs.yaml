id: lex-5jbrs
name: loss-fixation-sacrifices-a-larger-held-gain-for-a-trivial-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Fixating on recovering a single small loss can drive someone to abandon a much larger gain they're already holding, even when the recovery attempt has no realistic chance of success. In the Jataka's tale of the monkey and the peas, a monkey with both hands and mouth full of peas drops a single pea, then throws away everything else he's holding to search for it on the ground — and never finds it. The Bodhisatta draws the direct comparison to a king about to launch a costly, ill-timed campaign over a minor border provocation: 'A foolish monkey, living in the trees, O king, when both his hands were full of peas, Has thrown them all away to look for one: There is no wisdom, Sire, in such as these.' The monkey doesn't lose the held peas because searching for the lost one is hard — he loses them because he stops holding onto what he has the instant something is taken from him."
