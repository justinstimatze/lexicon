lineage:
  - source: primary
    text: hyde-fosters-image-of-limited-good-judges-identical-wealth-by-its-traceable-source
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"The Lucky Find,\"' citing George Foster's 1965 essay 'Peasant Society and the Image of Limited Good.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Foster argues that many otherwise perplexing details of peasant behavior can be understood by assuming that peasants believe there is a fixed quantity of wealth in the community and therefore that if someone in the group suddenly becomes richer it must be because someone else, or the group as a whole, has become poorer. ... Peasants do not feel ripped off if one of their number becomes richer as a result of selling labor as a migrant worker, for it is clear that wages so earned come from across the border. More telling for my purposes are the other ways to get wealth without being subjected to group opprobrium. In peasant communities in southern Italy, for example, the neighbors won’t harass someone whose sudden success comes as a “gift of Fortune,” as, for example, when “a rich gentleman gave a poor boy a violin,” or when “a rich gentlewoman adopted an abandoned child,” when a man “hit upon a hidden treasure” buried in the woods, and when “another was lucky enough to win in the lottery.”"
canonical-instances:
  - "A team resents a colleague's promotion when it looks like it came at the expense of internal budget and headcount everyone else was competing for, but shows no resentment when an identical promotion is announced alongside news that the role was funded entirely by new external client revenue, even though the personal gain to the promoted colleague is the same either way."
  - "A family accepts a sibling's sudden financial windfall without complaint when it's clearly an inheritance from a distant relative outside the immediate family's shared finances, but the same dollar amount arriving as a larger-than-expected cut of a jointly managed family business triggers immediate suspicion and resentment, because the internal source reads as having come at everyone else's expense."
critical-questions:
  - "Is the 'outside the group' framing doing the actual work, or is it a proxy for something else, like the perceived effort or luck involved -- would a large inheritance from a distant relative outside the group still trigger resentment if it were seen as undeserved in some other way, suggesting source-tracing isn't the whole story?"
  - "Does this pattern hold only in genuinely closed or resource-constrained communities, or does it persist even in wealthy, growth-oriented modern contexts where the 'limited good' assumption is not economically accurate but might still operate as an unconscious heuristic?"
  - "How porous does a group's boundary need to be before gains start reading as internal rather than external -- is 'across the border' doing real conceptual work, or is any sufficiently plausible external story (a distant relative, a stranger's gift) enough regardless of actual boundary permeability?"
