id: lex-mpf4w
name: not-knowing-what-you-prefer-can-mean-two-opposite-things
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone says 'I don't know which one I want,' check whether that means genuine indifference between the options or a genuine inability to compare them -- ordinary language collapses two logically opposite states into the same phrase. Sen: “It is important to distinguish between indifference and lack of completeness. Our daily language is often loose enough to fail to distinguish between the two. If I 'don't know' which one to choose, this could possibly mean that I am indifferent, though a more natural meaning is that I cannot make up my mind. The logical difference between the two is simple enough. Consider the two statements: (1) x is at least as good as y (2) y is at least as good as x. In the case of 'indifference' both are being asserted, and, in the case of lack of 'completeness', neither.” Indifference means the comparison got made and came out tied. Incompleteness means no comparison happened at all. An indifferent person will take either option happily and at random; someone with an incomplete comparison hasn't finished forming a view, and more information, more time, or a different framing could still move them somewhere a tie never would. Diagnostic move: before acting on someone's 'I don't know' or 'either is fine,' check which of the two statements above they'd actually endorse in both directions -- endorsing both is indifference and any choice will do; endorsing neither is incompleteness, and picking for them papers over a comparison nobody has actually made yet."
