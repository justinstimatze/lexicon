id: lex-96qnn
name: ladder-past-the-first-why-before-accepting-a-training-fix
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this whenever someone isn't doing what they're supposed to do, and the proposed fix is 'they need training/education/a reminder.' Moore's move: don't stop at the first answer to 'why aren't they doing it?' — the first answer is rarely the actionable one, and it disproportionately implicates the individual's knowledge, attention, or character rather than the system around them. Instead, keep asking 'why?' repeatedly, checking each successive answer against four categories — ENVIRONMENT (tools, culture, physical setup), SKILLS, KNOWLEDGE, and MOTIVATION (itself usually caused by problems in the other three) — until the laddering bottoms out at something concrete and actionable. Moore's own worked case: 'Why are managers falsifying performance reports?' → 'They want to look good.' Stopping here suggests ethics training. But laddering further — 'Why do they want to look good more than tell the truth?' → 'Because they must meet all their quotas.' → 'Why can't they meet their quotas?' → 'Too many quotas, all equally weighted.' → 'Why not reduce the quotas?' → 'Politically impossible, every leader has a favorite quota.' → 'Why don't managers ask for help instead of lying?' → 'Their bosses expect them to solve their own problems' — reveals that the actionable barrier is a management-incentive and culture problem several layers down, not a knowledge or character gap the front-line managers could fix by being told to be honest. Practitioner moves: (1) when 'training' or 'education' or 'awareness' is proposed as the fix, treat that as a hypothesis to interrogate, not a conclusion — ask what specific barrier in environment/skills/knowledge/motivation the training is supposed to remove, and whether training can actually remove it; (2) budget real laddering time (Moore: ~10 minutes per behavior, more if it 'opens a can of useful worms') rather than accepting the first plausible-sounding answer, especially when the first answer is emotionally satisfying to whoever's asking (it's easier to blame an individual's knowledge/character than to admit a systemic design flaw); (3) explicitly separate solvable-by-training barriers (missing knowledge/skill) from not-solvable-by-training barriers (missing tools, conflicting incentives, punitive culture) — a well-designed training intervention aimed at a non-training barrier wastes resources and, worse, gives the appearance the problem was addressed. Caveat: this is not a claim that training is never the answer, nor a license to launder every uncomfortable finding into 'it's the system's fault' without evidence — the laddering must terminate in a specific, defensible causal claim (verified with the people actually doing the task), not an assumed structural villain."
related: [lex-3u25r, lex-zag9z, lex-h8zzt, lex-emmw2, lex-ay4et, lex-m43kg]
scaffolds-from: [lex-3u25r]
evokes: [why-laddering, environment-skills-knowledge-motivation, dont-stop-at-the-first-answer, blame-the-individual-vs-blame-the-system, the-falsified-reports-case]
lineage:
  - source: primary
    text: moore-2017-why-laddering
    citation: "Cathy Moore, Map It: The Hands-On Guide to Strategic Training Design (Championship Press, 2017), Chapter 6 'Why aren't they doing it?', the sections '1. Prepare to ask, \"Why? Why? Why?\"' and 'DON'T SKIP THIS STEP!'"
    quote: "Your strategy will be simple: Keep asking \"Why?\" for each high-priority action until you can find the real reason it's a problem. [...] You won't settle for the first answer, because it's rarely the real answer. For example, let's say that our client says they want to reduce ethics violations. [...] Too many managers are falsifying those reports, claiming better performance than they're actually getting. [...] Q. Why are the managers falsifying their reports? A. Because they want to look good more than they want to tell the truth. What would happen if we stopped and accepted that answer? We might assume that the managers need some sort of corrective message: \"Telling the truth is more important than filing impressive figures.\" That could easily spawn finger-wagging ethics training. Instead, let's keep asking, \"Why?\" Q. Why are they willing to lie just to look good? A. Because they know that the most important goal is for them to meet all their quotas, even though they can't. Q. Why can't they meet their quotas? A. We have too many quotas, and they're all equally important. Q. Why don't you reduce the number of quotas? A. Every leader has their own favorite quota, and it's politically impossible to cut any of them. Q. Why don't the store managers ask for help instead of filing a false report? A. Their bosses expect them to solve their own problems. [...] At this point, would you say that the store managers need ethics training? [...] This is the most powerful step of action mapping, because it can break open a \"simple\" problem to reveal bigger issues."
canonical-instances:
  - "Moore's own case: store managers falsifying performance reports — laddering from 'they want to look good' down through quota design and management culture to reveal the actionable barrier is several layers removed from the front-line managers who would otherwise be sent to ethics training."
  - "Toyota Production System's Five Whys (Sakichi Toyoda / Taiichi Ohno) as a structurally parallel discipline in manufacturing root-cause analysis: repeated why-questioning to move past the first, individual-blaming explanation ('the operator made a mistake') to a systemic one ('the machine lacked a fail-safe')."
  - "A customer-support team told to 'train agents to be more empathetic' after a wave of complaints, without asking why agents are curt — laddering might reveal agents are rushed by an unrealistic average-handle-time metric, a motivation/environment barrier no empathy-training module can fix."
  - "A safety officer's first-pass diagnosis that workers 'don't know the procedure' (implying a training gap), where laddering reveals the job aid describing the procedure is posted somewhere workers never look, or the tool needed to follow the procedure correctly is chronically unavailable — an environment barrier, not a knowledge barrier."
critical-questions:
  - "how is this different from lex-zag9z cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity (Analysis of Competing Hypotheses)? ACH assumes a SET OF ALREADY-GENERATED candidate hypotheses and provides a procedure for WEIGHING evidence against them comparatively. This atom is about GENERATING the deeper hypothesis in the first place, by refusing to stop at the first, most readily-available answer to a why-question — it operates upstream of ACH's evidence-weighting step. They compose: laddering can surface several candidate root causes at different depths, which ACH-style cross-tabulation could then help weigh against each other."
  - "how is this different from lex-h8zzt credit-for-an-outcome-must-be-traced-not-assumed? lex-h8zzt is about not assuming even DISTRIBUTION of credit/blame across a KNOWN sequence of prior decisions after an outcome is already known (e.g., a team won, so was every play actually good?). This atom is about not stopping the CAUSAL SEARCH ITSELF at the first, shallowest answer when diagnosing why a behavior isn't happening — the object under scrutiny is the search process's depth, not the distribution of credit across an already-enumerated set of causes."
  - "is this just '5 Whys,' fully generic and undifferentiated? The mechanism (repeated why-questioning) is shared with Toyota's Five Whys discipline, and the atom does not claim priority over that older manufacturing technique. Moore's substrate-specific contribution, captured here, is the explicit CATEGORY SCAFFOLD for where the laddering should check at each step (environment / skills / knowledge / motivation) and the sharpened diagnostic PURPOSE: distinguishing whether a performance gap is trainable at all, specifically to prevent training being reflexively proposed as the default fix for problems training cannot solve. The atom names this applied, categorized, training-decision-specific version, not a generic claim to have invented iterative why-asking."
