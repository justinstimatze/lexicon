id: lex-g9b38
name: regulator-variety-must-equal-or-exceed-disturbance-variety-to-keep-outcome-bounded
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When attempting to regulate or control a system against an external disturbance, the regulator must have at least as many distinct states or responses as the disturbance has distinct conditions to-be-corrected. Ashby's Law of Requisite Variety (1956): only variety in R can force down the variety in the outcome O caused by disturbance D — variety can destroy variety. If D has 100 possible conditions and R can choose between only 10 responses, at most 10 of the 100 outcomes can be brought to the target value; the other 90 will fall as they fall. The law is structural, not empirical: it follows from the cardinality of the state space, has nothing to do with the substrate (electronic, biological, organizational) or with how cleverly R is implemented. Diagnostic question when a control system is failing: 'does the regulator have at least as many distinct responses as the situation has distinct conditions worth treating differently?' If the answer is no — the regulator is undersized — no amount of clever tuning will bring outcome-variety to target; the only fix is to add response-variety to R or to coarsen-the-target so that the regulator's available variety becomes sufficient. Operational consequences: (1) policy-against-diverse-population requires diverse policy responses, not one-size-fits-all (which has variety = 1 and cannot regulate a variety-N situation); (2) software-against-attackers needs response-variety matching attack-variety (which is why pure-allow-list firewalls regulate well against known attacks but not against zero-days, which have variety the regulator hasn't enumerated); (3) management-decisions-by-rule cannot regulate variety the rule did not anticipate; (4) immune-system response-variety must grow to match pathogen-variety, which is why both keep pace as evolutionary arms races. Inverse: when the regulator's available variety dramatically exceeds the disturbance's, the system is over-engineered — slack that can be reduced if the disturbance distribution is stable. The transferable claim is the cardinality-of-state-space constraint, which is identical wherever regulation occurs."
