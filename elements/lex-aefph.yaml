lineage:
  - source: primary
    text: wilson-1971-the-insect-societies
    citation: "Edward O. Wilson, *The Insect Societies* (Cambridge, MA: Belknap Press of Harvard University Press, 1971). Chapter 1, 'Introduction: The Importance of Social Insects,' opening paragraph, states the superorganism-tractability claim directly as the book's organizing rationale for why social insects reward scientific study. The claim is illustrated at length in the book's caste chapters: 'Caste: Ants' (Ch. 8) documents F.J. Brian's experiments on caste determination in Myrmica, pinpointing the environmentally-determined 'critical periods' of pupal development via starvation and chilling manipulations; 'Caste: Social Bees and Wasps' (Ch. 9) documents the royal-jelly/worker-jelly feeding-schedule mechanism of queen determination in honeybees, tracing the experimental lineage from Bonnet and Huber's 1789 correspondence proposing a direct food-swap test through Von Rhein (1933/1956), Weaver (1955), Jay (1964), and Rembold and Hanser (1964); 'Caste: Termites' (Ch. 10) documents Lüscher's ecdysone-injection and pheromone/token-stimulus work locating termite caste determination within tractable endocrinology."
    quote: "[Wilson 1971, Ch.1, opening paragraph — the headline claim:] 'The insect colony is often called a superorganism because it displays so many social phenomena that are analogous to the physiological properties of organs and tissues. Yet the holistic properties of the superorganism stem in a straightforward behavioral way from the relatively crude repertories of individual colony members, and they can be dissected and understood much more easily than the molecular basis of physiology.' [Ch.1, immediately preceding, on why social insects reward study at all:] 'The biologist is invited to consider insect societies because they best exemplify the full sweep of ascending levels of organization, from molecule to society. Among the tens of thousands of species of wasps, ants, bees, and termites, we witness the employment of social design to solve ecological problems ordinarily dealt with by single organisms.' [Ch.8 'Caste: Ants,' on Darwin's original puzzle and its environmental-determination resolution:] 'to propound two novel ideas: nongenetic caste determination and evolution by colony selection... It seems to follow that the caste of individual social insects must be environmentally determined.' [Ch.8, on Brian's Myrmica critical-period experiments locating the crude, manipulable variable:] 'Final caste determination occurs in the spring larvae late in their terminal instar... The critical periods of caste determination were revealed by experiments in which sets of larvae were starved at different periods in pupal development... Clearly the larvae destined to be queens either must grow at a faster rate or else start at a higher weight.' [Ch.9 'Caste: Social Bees and Wasps,' on the royal-jelly feeding-schedule mechanism and its long experimental tractability:] 'What is put into the royal cells that turns young honeybee larvae into queens? The answer has been known a long time: it is royal jelly... In 1955 Weaver followed approximately this procedure. He discovered that, if the larvae are given fresh royal jelly every two hours, they will develop into queens... larvae reared on \"worker jelly\"—the salivary secretion deposited by workers into regular brood cells—invariably develop into workers.' [Ch.9, quoting Charles Bonnet's 1789 letter to François Huber, proposing the direct experimental test over a century before it was run:] 'The food supplied to the queen larva is not the same as that given to the common larva... Could we not try, with the point of a pencil, to remove a little of the royal food and give it to a common larva deposited in a cell of the largest dimensions?' [Ch.10 'Caste: Termites,' on the token-stimulus/endocrine tractability of termite caste determination:] 'The caste pheromones, together with selective nutrition and whatever additional factors are programmed by a given species into its caste-determining system, serve as the token stimuli by which individual development is guided at the junctures... Therefore the physiology of caste determination is very much a problem within the domain of endocrinology.'"
  - source: discovery-loop
    text: distinctness-audit-wilson-superorganism-tractability
    citation: "Wilson's *Insect Societies* was previously unrepresented in the substrate. lex-cat29 (grounded in Nowak 2006, five mechanisms of cooperation), lex-btfca (grounded in Lent 2021, transmitting Margulis and Maynard-Smith/Szathmáry on major evolutionary transitions), and lex-5dnd9 (grounded in Hamilton 1964, inclusive fitness) each use eusocial insects as one example within a broader cooperation-and-transitions framework, but none makes Wilson's own epistemological claim that superorganism-level holistic behavior is more tractable to study than organismal physiology, and none cites Wilson's 1971 text as primary lineage. lex-btfca's claim concerns the evolutionary mechanism by which a new tier of biological organization arises — merger of previously independent reproductive units, e.g. mitochondrial endosymbiosis, eusocial-colony formation — a claim about origin. This atom's claim concerns the study-difficulty of an already-existing superorganism's holistic behavior relative to organismal physiology — a claim about methodological tractability, not evolutionary origin. lex-hm8yx (scale separation) is a general renormalization-style claim: fast and slow variables decouple, enabling tractable analysis by separating time or spatial scales — a different tractability mechanism than Wilson's. Wilson's tractability comes from the crudeness and legibility of the individual-level generating rules, not from scale-separation as such; a system could have crude generating rules without any scale gap between levels. lex-eybad (Mill, emergent-effects-resist-decomposition-into-summed-causes) answers a different question: whether a joint effect is mechanically additive (decomposable into summed separate effects) or heteropathic (a qualitatively new regularity, per Mill's water/hydrogen-oxygen and tongue/tissue examples). Wilson's superorganism properties are themselves heteropathic in Mill's sense — colony-level phenomena are not simply summed individual behaviors — and this atom does not dispute that. Its claim is orthogonal: among systems that are already emergent and heteropathic, the one whose generating rules are crude and externally manipulable (the ant colony) is more tractable to study than the one whose generating substrate is dense and opaque (molecular physiology), independent of composition-mode."
canonical-instances:
  - "Wilson's own opening statement of the claim (Ch.1): the insect colony is 'often called a superorganism because it displays so many social phenomena that are analogous to the physiological properties of organs and tissues,' yet its holistic properties 'stem in a straightforward behavioral way from the relatively crude repertories of individual colony members, and they can be dissected and understood much more easily than the molecular basis of physiology.'"
  - "Myrmica caste determination (Ch.8, Brian's experiments): worker-vs-queen outcome is switched by winter chilling, post-hibernation temperature, and larval growth-rate during a narrow, experimentally-locatable 'critical period' in pupal development. Starving or overfeeding larvae at different pupal stages was sufficient to steer the outcome — a crude, externally-manipulable variable doing the work of what looks, from the colony level, like a holistic caste-differentiation system."
  - "Honeybee queen determination via royal jelly (Ch.9): a larva fed fresh royal jelly on an ad-lib schedule develops into a queen; the same larva fed ordinary 'worker jelly' develops into a worker. Bonnet and Huber proposed the direct experimental food-swap test in 1789 correspondence, over a century before Weaver (1955), Jay (1964), and Rembold-Hanser (1964) confirmed it operationally — an unusually long run of straightforward experimental tractability for a caste-differentiation outcome that, viewed at the colony level, looks like organ-like tissue specialization."
  - "Termite caste determination as endocrinology (Ch.10): Lüscher's ecdysone-injection experiments and the 'token stimuli' framework (caste pheromones plus nutrition, relayed by an addressable endocrine system at identifiable developmental junctures) locate termite caste determination squarely within tractable, instrumentable endocrine physiology rather than an opaque, holistic mystery."
  - "Modern cross-domain analogue responsibly extending Wilson's own argument rather than his text: a swarm of simple, individually-legible AI agents (each following a small, inspectable tool-use policy) producing complex, holistic collective task-completion behavior that is more debuggable and tractable to understand than the dense internal mechanism of a single large monolithic model — the same crude-generating-rules-yield-tractable-holism structure Wilson identifies in insect colonies."
critical-questions:
  - "Is a system's holistic/emergent behavior being assumed intractable merely because it is holistic, or has anyone actually checked what the lower-level generating rules look like? Wilson's diagnostic move is to ask whether the individual units follow crude, externally observable and manipulable rules (as ant/bee/termite colony members do) rather than assuming holism implies irreducible complexity."
  - "When comparing the relative tractability of two emergent/holistic systems, is the comparison being made on the legibility and manipulability of each system's GENERATING RULES (Wilson's actual criterion), or on the superficial complexity of each system's higher-level OUTCOME (a comparison that can mislead in either direction)?"
  - "Is a caste-like, role-like, or differentiation-like outcome in a collective (biological, social, or artificial) being attributed to a complex hidden mechanism (deep genetic programming, deep psychological difference) before checking whether a crude, externally-manipulable environmental or interaction-level variable (nutrition, temperature, timing, a simple local threshold) is doing the work — as caste determination itself turned out to be, against the field's own initial genetic-determinism assumptions?"
  - "Is this claim being conflated with the general question of whether emergent effects are additive/decomposable into summed parts (lex-eybad's question), or is it correctly being read as orthogonal — a claim about relative STUDY-TRACTABILITY between two systems that are both already granted to be holistic/heteropathic, based on the crudeness of their respective generating substrates?"
  - "Is this claim being conflated with a claim about EVOLUTIONARY ORIGIN — how the higher tier of organization came to exist in the first place (lex-btfca's merger-of-independent-units mechanism) — rather than correctly read as a claim about how hard an ALREADY-EXISTING higher-tier system is to study relative to a lower-tier system it is routinely compared to?"
