id: lex-4tter
name: elenchus-as-method-opens-inquiry-not-answers
type-in: process
type-out: question
_tier: atomic
agent-instruction: "When you deploy elenchus (systematic refutation-by-questioning) as a deliberate method, aim it at opening a genuine question, not merely producing confusion for its own sake or forcing premature agreement. The aporia it produces is only valuable if it becomes the doorway to a sharper, more answerable question — check that one is actually on the table before treating the confusion as the endpoint."
related: [lex-fpvsu]
scaffolds-from: [lex-fpvsu]
evokes: [torpedo-fish, productive-confusion, aporia-opens-inquiry, socratic-elenchus-as-method]
lineage:
  - source: primary
    text: plato-meno-torpedo-fish-elenchus-as-process
    citation: "Plato, Meno 79e-84d (Benjamin Jowett translation). Distinct from lex-fpvsu's Euthyphro/Apology material: those dialogues frame elenchus as producing a STATE — a confident claim collapses into acknowledged confusion, and the dialogue ends there. The Meno makes explicit that elenchus is run as a deliberate METHOD aimed at producing a sharper QUESTION worth pursuing further. Socrates frames his own perplexity as an invitation to continued joint enquiry, then immediately demonstrates the method's productive continuation by running it on Meno's slave-boy, walking him through a geometry problem entirely by further questions rather than supplied answers. The dialogue's own argument, made explicit a few lines later, is that the torpedo's shock is what makes the interlocutor want to enquire further — without it, false confidence forecloses the very question that needs asking."
    quote: "[Meno, describing the effect of Socrates' questioning:] 'you seem to me both in your appearance and in your power over others to be very like the flat torpedo fish, who torpifies those who come near him and touch him, as you have now torpified me, I think. For my soul and my tongue are really torpid, and I do not know how to answer you; and though I have been delivered of an infinite variety of speeches about virtue before now, and to many persons—and very good ones they were, as I thought—at this moment I cannot even say what virtue is.' [Socrates' reply, reframing the torpor as the opening of enquiry rather than its end:] 'As to my being a torpedo, if the torpedo is torpid as well as the cause of torpidity in others, then indeed I am a torpedo, but not otherwise; for I perplex others, not because I am clear, but because I am utterly perplexed myself. And now I know not what virtue is, and you seem to be in the same case, although you did once perhaps know before you touched me. However, I have no objection to join with you in the enquiry.' [Later, after running the identical method on Meno's slave-boy — Meno's brief confirming replies omitted:] 'We have certainly, as would seem, assisted him in some degree to the discovery of the truth; and now he will wish to remedy his ignorance, but then he would have been ready to tell all the world again and again that the double space should have a double side. ... But do you suppose that he would ever have enquired into or learned what he fancied that he knew, though he was really ignorant of it, until he had fallen into perplexity under the idea that he did not know, and had desired to know?'"
canonical-instances:
  - "the slave-boy demonstration itself: immediately after Meno's own torpedo shock, Socrates runs the identical method on an uneducated slave — walking him step by step: confident wrong answer, contradiction, aporia, then the correct geometric relation reached through further questions rather than supplied answers. The aporia in the middle is the hinge the whole sequence pivots on"
  - "a strong code review comment: a reviewer's pointed question doesn't hand the author a fix, it reopens a question the code had prematurely closed. The value is measured by whether the author now has a sharper question to pursue, not by whether the reviewer supplied an answer"
  - "operationally distinct from lex-fpvsu elenchus-questioning-to-aporia: that atom's type signature is claim→state — a confident claim collapses into an acknowledged confusion-state, and its canonical instances (Euthyphro, Apology) are dialogues that end at that state. This atom's signature is process→question — the same questioning method, tracked through to its deliberate next step: the confusion is aimed at producing a sharper, more answerable question, and Socrates says so explicitly in the Meno. The two atoms name adjacent moments of the same mechanism: lex-fpvsu is where the confident claim dies; this atom is what a practitioner does with the confusion once it's produced"
critical-questions:
  - "after the elenchus lands and the interlocutor is in aporia, is there an actual next question on the table, or has the confusion just been left to sit? The torpedo's shock is only justified by what it opens up next"
  - "is the questioner running elenchus to genuinely open inquiry, or using the form of Socratic questioning to force a predetermined conclusion while claiming neutrality? The Meno's own answer is that Socrates does not supply the slave-boy's answers, only further questions — the discipline is in what the questioner refrains from doing"
  - "would the interlocutor have asked this new, sharper question without first losing confidence in the old, wrong one? If the old confident answer was never actually threatened, the 'question' produced is cosmetic — the Meno's actual test is whether the old answer genuinely broke"
severity-tier: info
status: active
