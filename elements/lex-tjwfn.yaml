id: lex-tjwfn
name: recursive-mind-simulation-shapes-self
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When modeling another person, remember they're modeling you modeling them. This recursive simulation shapes self-concept: who you are partly tracks what you imagine others imagining you. Track at least one level of recursion before claiming you understand a social dynamic."
