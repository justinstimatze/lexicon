id: lex-553tv
name: reframing-forbearance-from-harm-as-itself-full-repayment
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Asked to repay an actual favor, someone can instead argue that not harming the favor-giver, when they had the opportunity and means to do so, already constituted the full debt — treating restraint from an available cruelty as equivalent to the service actually rendered. In the Jataka's tale of the woodpecker, asked for a small favor in return for removing a bone from its throat, the lion refuses by reframing its own past restraint as the real payment already made: 'To trust thy head to a lion's jaw. A creature red in tooth and claw, To dare such a deed and be living still, Is token enough of my good will.' The debt is declared settled, from the lion's side, without anything further changing hands."
related: []
evokes: [jataka, catukkanipata, javasakuna-jataka, not-harming-someone-reframed-as-having-already-repaid-them, restraint-substituted-for-actual-reciprocation]
lineage:
  - source: primary
    text: jataka-chalmers1895-javasakuna-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 308, Javasakuna-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "To trust thy head to a lion's jaw. A creature red in tooth and claw, To dare such a deed and be living still, Is token enough of my good will."
canonical-instances:
  - "An employee who covered a colleague's shift during an emergency later asks for a small scheduling favor in return, and the colleague replies that not reporting the employee's earlier mistake to management was already the favor — treating silence about a past error as equivalent repayment for present help."
critical-questions:
  - "Is there a real asymmetry being papered over here — the woodpecker performed an active, risky service, while the lion is only crediting itself for a passive absence of cruelty it was never entitled to inflict in the first place?"
  - "Does this reframing work only because the lion holds more power in the relationship, meaning the weaker party has no real way to contest the accounting even if it's self-serving?"
status: active
