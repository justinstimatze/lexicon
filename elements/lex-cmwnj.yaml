id: lex-cmwnj
name: forced-graduated-exposure-converts-a-fatal-vulnerability-into-tolerance
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A vulnerability that kills on contact isn't always permanent -- deliberately, incrementally exposing the vulnerable to a controlled version of the very thing that used to be lethal can convert that fragility into ordinary tolerance. In Cushing's telling, an entire village of Underworld people are so unfinished that solid food, wind, birds landing on them, or hot mush all kill them instantly; they survive only by inhaling the steam of food and throwing the substance itself away. Two War-gods, having shown the village that its supposed dangers can be handled with impunity, don't stop at defeating each individual threat: 'when they found that these poor people were only half finished ... they cut vents in them ... and made them eat solid food, by means of which they were hardened and became men of meat then and there, instead of having to get killed after the manner of the fearful.' The fix isn't protecting the villagers from solid food forever; it's a deliberate, forced introduction to the exact substance that used to be fatal, applied until their bodies could tolerate what once destroyed them. Diagnostic move: when a population or system has a vulnerability so severe that ordinary contact with something is lethal, consider whether the vulnerability itself is the untreated condition, and whether a controlled, incremental introduction to the threat, rather than permanent avoidance of it, is what actually resolves it."
related: [lex-56nfs, lex-7ea49, lex-eg3qn]
evokes: [controlled-incremental-exposure-resolves-the-vulnerability-itself, cushing-twins-of-war-and-chance-fare-with-the-underworld, they-cut-vents-in-them-and-made-them-eat-solid-food, became-men-of-meat-then-and-there]
lineage:
  - source: primary
    text: cushing-twins-harden-the-underworld-people-with-solid-food
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Twins of War and Chance, Ahaiyuta and Matsailema, Fared with the Unborn-Made Men of the Underworld.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Then the people crowded still closer around them, wondering to one another that they could vanquish all enemies by eating them with such impunity, and they begged the Twain to teach them how to do it. So they gathered a great council of the villagers, and when they found that these poor people were only half finished, ... they cut vents in them (such as were not afraid to let them), ... and made them eat solid food, by means of which they were hardened and became men of meat then and there, instead of having to get killed after the manner of the fearful, and others of their kind beforetime.'"
canonical-instances:
  - "An immunologist treats a child with a severe food allergy not by enforcing lifelong total avoidance but through an oral immunotherapy protocol that introduces microscopic, controlled doses of the allergen, gradually increasing them until the child's immune system tolerates what used to trigger anaphylaxis."
  - "A trauma therapist treats a client whose panic response to a specific trigger is so severe it's functionally disabling, not by helping the client avoid the trigger forever but through graduated exposure therapy that introduces controlled, incremental contact with it until the nervous system's response shifts from crisis to tolerance."
critical-questions:
  - "Does the story specify how the 'vents' and forced feeding were actually survivable given that these same people died instantly from ordinary contact with solid food moments earlier -- what made the controlled introduction different in kind from the exposure that had always killed them before?"
  - "Is there a meaningful difference between this forced, one-time hardening and a genuinely gradual process, given that the text describes the transformation happening essentially all at once rather than through incremental doses over time -- does the mechanism actually require gradualism, or does the myth compress a longer process into a single moment?"
  - "What made these particular villagers ready for hardening at this specific moment, after having presumably lived their whole unfinished existence avoiding solid food -- was some threshold of trust or desperation necessary before they would consent to an intervention that had always been lethal before?"
status: active
