id: lex-255sa
name: open-confrontation-is-licensed-only-by-already-holding-every-advantage
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Before committing to a declared, above-board confrontation with a rival -- a public legal challenge, an open bidding war, a head-to-head product launch -- check whether you actually hold every relevant advantage already, because a declared, rules-bound contest is only the right choice when nothing is missing; the moment even one advantage is absent, indirection becomes the rational choice, not a lesser one. Kautilya sets an explicit, conjunctive threshold: 'A king shall engage in a [declared] open fight when (i) his army is superior, (ii) his instigations [in the enemy's camp] have been successful, (iii) all precautions against dangers have been taken and (iv) the terrain is suitable to him. If the above conditions are not satisfied, he shall use deception.' The word 'and' is doing the real work -- this isn't a scorecard where meeting three of four conditions is close enough; any single missing element flips the recommended mode entirely, from open to deceptive. This reframes 'why not just deal with this directly and openly' as a question with a hard, checkable answer rather than a matter of preferred style or honor: openness is earned by a specific, verifiable state of advantage, and its absence is sufficient reason to choose indirection, with no moral cost attached to that choice in this framework. Diagnostic move: before choosing a direct, declared confrontation over an indirect approach, run down the actual list of advantages a direct contest requires -- superior resources, groundwork already laid, protections against retaliation, favorable terms -- and treat any single gap as reason enough to prefer an indirect approach instead, rather than treating directness as the default virtuous choice regardless of your actual position."
related: [lex-2dbue]
evokes: [openness-must-be-earned-not-defaulted-to, kautilya-open-and-deceptive-battles, any-single-missing-advantage-flips-open-to-indirect, a-conjunctive-not-a-scorecard-threshold]
lineage:
  - source: primary
    text: kautilya-arthashastra-conditions-for-open-battle-versus-deception
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Open and Deceptive Battles,' {10.3.1,2}."
    quote: "'A king shall engage in a ... open fight when (i) his army is superior, (ii) his instigations ... have been successful, (iii) all precautions against dangers have been taken and (iv) the terrain is suitable to him. If the above conditions are not satisfied, he shall use deception.'"
canonical-instances:
  - "A company deciding whether to challenge a competitor's patent openly in court, versus quietly designing around it, checks whether it actually has stronger prior art, the resources to sustain years of litigation, and no exposure to a damaging countersuit -- and chooses the quiet design-around the moment even one of those isn't true, rather than defaulting to open litigation because it feels like the more forthright option."
  - "A job candidate deciding whether to openly negotiate for a higher salary or quietly build leverage through a competing offer first checks whether they actually have a clearly superior track record, confirmed budget flexibility on the employer's side, and no risk of the request souring the relationship -- and pursues the competing offer first if any of those is missing, rather than assuming direct negotiation is always the more honest and therefore better approach."
critical-questions:
  - "does this framework undervalue the trust and long-term relationship benefits of choosing openness even from a position of partial disadvantage -- does an indirect approach, chosen purely because one advantage is missing, cost more in damaged trust than it saves in tactical position?"
  - "how reliably can a party actually assess all four conditions in advance, especially 'all precautions against dangers have been taken' -- does this threshold assume a completeness of self-knowledge about one's own vulnerabilities that's rarely achievable before a confrontation actually begins?"
  - "does defaulting to indirection whenever any single advantage is missing create a habit of avoiding open confrontation almost permanently, since a state of holding every relevant advantage simultaneously may be rare, effectively making deception the default rather than the exception this framework intends?"
status: active
