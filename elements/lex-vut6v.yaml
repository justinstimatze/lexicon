id: lex-vut6v
name: a-past-good-act-licenses-a-later-moral-lapse-but-modestly
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply when someone has just done (or recalled, or been credited with) a morally good act, and the question is whether that act makes them MORE or LESS likely to behave badly afterward — or when evaluating a folk claim that a good deed 'licenses' a later lapse. Moral licensing theory: 'people who initially behave in a moral way can later display behaviors that are immoral, unethical, or otherwise problematic... the prior good deed provides a \"license\" that allows one to perform morally questionable behavior later on' — someone who volunteered might feel it's more acceptable to fudge a tax return afterward. Blanken, van de Ven & Zeelenberg's meta-analysis (91 studies, 7,397 participants) confirms the effect is REAL but modest: a Cohen's d of 0.31 (95% CI [0.23, 0.38]), smaller than most typical effects in social psychology. Two calibration points matter more than the headline number. First, the effect is inflated in the published literature specifically: 'studies in published articles tend to have larger effect sizes than studies from unpublished' work — published studies show d=0.43, unpublished studies show d=0.11, a roughly fourfold gap consistent with publication bias (striking, statistically significant findings publish more easily than null ones). The honest population-level estimate sits closer to the unpublished figure than the published one. Second, the effect is larger for actual behavior (d=0.36) than hypothetical/self-reported behavior (d=0.28), meaning it isn't purely a self-presentation artifact. Practitioner discipline: moral licensing is a real, small, probabilistic nudge, not a strong or reliable individual-level prediction — don't treat 'they did something good recently' as a strong signal that a specific person is now primed to misbehave, and don't cite the folk-popularized version of the effect (often reported as if it were large and dependable) without the caveat that its true magnitude, once publication bias is corrected for, is closer to negligible-to-small than to the medium-or-large effects social psychology findings are often assumed to carry."
