id: lex-m9hc3
name: conscience-evolved-as-internalized-leveling-norms-via-social-selection
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When asking why humans have moral feelings (shame, guilt, embarrassment, conscience-pang, indignation-at-injustice) and not just external rule-following, Boehm's transferable claim is that conscience evolved via SOCIAL SELECTION as the INTERNALIZED VERSION of the external leveling norms that hunter-gatherer bands used to suppress alpha-dominant individuals. The mechanism: for ~10,000+ generations of mobile-foraging Pleistocene life, individuals who were too selfish, too domineering, too willing to free-ride on group production faced predictable group punishment — ridicule, gossip, ostracism, banishment, and (in serious cases) collective capital punishment. Individuals who could ANTICIPATE this group reaction internally — who felt shame at the prospect of being shamed, guilt at the prospect of being punished — survived and reproduced better than individuals who needed to be caught in the act every time. Selection thus favored the internalization of group leveling-norms into conscience. The transferable claim is that conscience is not a divine endowment, not a rationalist deduction, not a cultural overlay — it is an EVOLVED COGNITIVE-EMOTIONAL ADAPTATION shaped by the specific selection pressure of egalitarian-band social control over deep prehistory. Transferable consequences: (1) the SPECIFIC moral feelings humans have (shame at boasting, guilt at cheating, indignation at others' cheating) MAP to the SPECIFIC leveling-norm violations that egalitarian bands punished — this is testable cross-culturally and predicts the universals Brown 1991 documents; (2) when modern environments lack the social-selection pressure (anonymous online interaction, money relations that allow cheating without face-to-face reputation cost, large-scale societies where you can move and start over), conscience-feelings still fire but lose their evolutionary calibration — explains why digital anonymity produces behavior people would never display in a small band, and why ultra-large-scale societies face systematic conscience-shortcuts (corporate misconduct, political corruption); (3) the variability of conscience across individuals tracks variation in the genetic substrate of social-emotional-regulation — psychopathy (~1% prevalence) is the visible-tail of the distribution that under egalitarian-band conditions faced predictable capital punishment but in modern conditions can flourish; (4) cultural rules can ADD to conscience-base via socialization but cannot create it from nothing — children with normal conscience-substrate internalize even unfamiliar moral norms quickly; children with psychopathic substrate don't, regardless of socialization quality. Distinct from lex-uxqdz egalitarianism-is-actively-maintained-reverse-dominance (which covers the EXTERNAL leveling mechanism — Boehm 1999). This atom names the INTERNALIZATION of the leveling mechanism into individual cognition-emotion — the move from outside-enforced to inside-felt. The two atoms compose: external leveling (lex-uxqdz) creates the selection pressure; internalization (this atom) is the evolved response. Distinct from lex-5yufs do-the-right-thing-as-rule-following: do-the-right-thing is about practitioner-discipline; conscience-evolution is about why the practitioner-discipline has the felt-character it does."
