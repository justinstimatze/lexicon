lineage:
  - source: primary
    text: tomasello-2014-natural-history-of-human-thinking
    citation: "Michael Tomasello, *A Natural History of Human Thinking* (Harvard University Press 2014). The transferable claim is that the cognitive infrastructure distinctive to human collaboration is shared intentionality (also called we-mode or collective intentionality): the capacity to form joint goals with joint attention and coordinated individual roles. Tomasello synthesizes a research program of comparative experiments (humans vs great apes) and developmental experiments (human infants) to argue that (a) great apes have individual intentionality and theory-of-mind but lack shared intentionality; (b) prelinguistic human infants exhibit precursors (joint attention, pointing, helping); (c) the capacity is the evolutionary keystone for collaborative foraging, cooperative communication, and the eventual emergence of cultural institutions. The 2014 book is the synthesis of work since Tomasello et al. 2005 *Behavioral and Brain Sciences* 28:675 'Understanding and sharing intentions' and Tomasello 2008 *Origins of Human Communication*. The atom names the COGNITIVE INFRASTRUCTURE claim — that we-mode is a distinct cognitive primitive — distinct from the EVOLUTIONARY HISTORY claim (which Tomasello also makes) about how it arose via selection for cooperative foraging. Philosophical antecedents: Searle 1995 *The Construction of Social Reality* (collective intentionality); Gilbert 1989 *On Social Facts* (plural subjects); Bratman 1992 'Shared cooperative activity'; Clark 1996 *Using Language* (common ground). Tomasello's empirical work grounds these philosophical primitives in primate cognition and infant development."
    quote: "[Tomasello 2014, Introduction:] 'humans not only understand others as intentional agents but also put their heads together with others in acts of shared intentionality, including everything from concrete acts of collaborative problem solving to complex cultural institutions. The focus now is thus less on culture as a process of transmission and more on culture as a process of social coordination—and indeed, we argue here that modern human cultures were made possible by an earlier evolutionary step in which individuals made a living by coordinating with others in relatively simple acts of collaborative foraging.' [Same volume, on the contrast with apes:] 'When individuals participate with others in collaborative activities, together they form joint goals and joint attention, which then create individual roles and individual perspectives that must be coordinated within them. Moreover, there is a deep continuity between such concrete manifestations of joint action and attention and more abstract cultural practices and products such as cultural institutions, which are structured—indeed, created—by agreed-upon social conventions and norms. In general, humans are able to coordinate with others, in a way that other primates seemingly are not, to form a \"we\" that acts as a kind of plural agent to create everything from a collaborative hunting party to a cultural institution.' [On the developmental evidence:] 'These still fledgling human beings nevertheless operate with some cognitive processes that great apes do not, enabling them to engage with others socially in some ways that great apes cannot, for example, via joint attention and cooperative communication. The fact that these precultural and prelinguistic creatures are already cognitively unique provides empirical support for the social infrastructure theorists' claim that important aspects of human thinking emanate not from culture and language per se but, rather, from some deeper and more primitive forms of uniquely human social engagement.' [On the shared-intentionality hypothesis:] 'The shared intentionality hypothesis is that what created this unique type of thinking—its processes of representation, inference, and self-monitoring—were adaptations for dealing with problems of social coordination, specifically, problems presented by individuals' attempts to collaborate and communicate with others (to co-operate with others).'"
canonical-instances:
  - "Collaborative foraging (Tomasello's central evolutionary case): two early humans hunting an antelope require a joint goal (we are hunting THIS antelope together), joint attention (we both attend to the antelope), and coordinated individual roles (you drive it toward me; I spear it). Apes do parallel pursuit (multiple individuals chase, each privately) but do not coordinate joint roles within a joint goal — they get more meat hunting alone or via individual-luck-in-group, not via we-mode coordination."
  - "Infant pointing-to-share (not pointing-to-request): a 14-month-old human infant points to a bird to share attention with a caregiver, expecting the caregiver to look and acknowledge the shared experience. No great ape exhibits this — they point to request access to food, never to establish joint attention as a goal in itself. The precultural-prelinguistic emergence of joint attention is the developmental evidence for shared intentionality as a distinct cognitive primitive."
  - "Cultural institutions as scaled shared intentionality: a corporate org chart, a national constitution, a marriage, a research collaboration — all are agreed-upon social conventions creating plural agents that act 'as if' a unified intentional system. The plural agent isn't metaphor; it's literal we-mode shared intentionality projected onto larger groups via formal norms."
  - "Team kickoff as joint-goal-formation ritual: software teams that 'just start working' from individual aligned tickets often end up doing parallel individual action — each developer pursues their ticket, no we-mode forms. Teams that conduct an effective kickoff (joint goal stated, joint attention to the same thing, individual roles understood as parts of a joint role) shift into collaborative mode. The cognitive infrastructure is critical; skipping it produces aligned-individual-action that LOOKS like collaboration but lacks the coordination affordances."
  - "Cooperative communication (Grice 1957 + Sperber-Wilson + Tomasello): when I say 'pass the salt' I rely on the addressee inferring that I want them to pass the salt because they want to help me — recursive intention-attribution that presupposes we-mode common ground. Apes don't communicate cooperatively in this sense — they signal but don't engage in recursive intention-attribution about the speaker's communicative intent."
  - "Distinguished from lex-eg9zm cooperation-evolves: lex-eg9zm covers parallel mechanisms (kin selection, reciprocity, mutualism) by which cooperation emerges. Wolves coordinate hunt without shared-intentionality cognitive infrastructure — they do parallel pursuit with sensitivity to others' positions, not we-mode joint goals. Shared intentionality is the SPECIFIC HUMAN cognitive infrastructure that enables a richer kind of collaboration distinct from these other cooperation mechanisms."
  - "Distinguished from lex-hta65 spontaneous-theory-of-mind: theory-of-mind is I-MODE modeling of other intentional agents (I model that you have a goal). Shared intentionality is WE-MODE joint-goal formation (we together have a goal). Theory-of-mind is necessary for shared intentionality (we need to model each other's intentional states) but not sufficient (great apes have theory-of-mind for goal-prediction but lack we-mode joint-goal formation)."
critical-questions:
  - "Have you confused incentive-alignment with we-mode joint-goal formation? A team with aligned individual incentives can still operate in parallel-individual-action mode. The joint-goal-formation step (often skipped) is the cognitive infrastructure that converts aligned-incentives into actual collaboration. Diagnose: are roles understood as 'my part of OUR goal' or 'my goal, which happens to align with yours'? Different cognitive postures, different coordination affordances."
  - "Is the great-ape contrast really as sharp as Tomasello claims? Subsequent debate has shown some great apes show joint-attention precursors in certain experimental setups (especially bonobos; Hare-Tan 2012). The 1995-2010 strong-claim version of Tomasello has been moderated; the current consensus is that shared intentionality is FAR more developed in humans but the boundary may not be a clean species-level distinction. Cite the strong-form claim with appropriate hedge."
  - "Does this atom require shared intentionality to be a UNITARY cognitive primitive? Tomasello argues yes; some philosophers (Searle, Gilbert, Bratman) treat it as composed of theory-of-mind + joint commitment + joint attention. The transferable practitioner-claim ('we-mode is distinct from I-mode-aligned-with-other-I-modes') survives either interpretation. The cognitive-architecture question of unitary-vs-composite is a separate debate."
  - "How does shared intentionality scale beyond face-to-face groups? Tomasello argues cultural institutions are scaled shared intentionality, but the mechanism of scaling (how does a 300-person organization or a 300-million-person nation 'have' a we-mode joint goal) involves additional machinery — symbolic representations of the joint goal, agreed-upon norms, hierarchical role-coordination. The atom names the cognitive primitive; scaling requires the additional cultural-institutional infrastructure."
  - "How does this compose with lex-2kjmb free-energy-principle? The we-mode shared intentionality framing can be cast as joint surprise-minimization: two agents form a shared generative model that includes BOTH their actions, and minimize free energy collectively (Friston's 'active inference for joint actions' work). The composition isn't yet fully worked out empirically but is theoretically promising — shared intentionality may be a specific cognitive implementation of multi-agent free-energy minimization."
