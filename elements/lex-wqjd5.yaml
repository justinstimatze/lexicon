id: lex-wqjd5
name: the-condition-on-a-transformation-forbids-the-impulse-that-motivated-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you finally get to become the thing you envied, watch for a condition that specifically forbids the exact behavior that made you envy it in the first place -- that condition isn't incidental fine print, it's the whole reason the transformation was even possible to grant, and it sets up a violation you were never actually equipped to avoid. In Zitkála-Šá's telling, Iktomi begs a peacock to transform him, envying its 'green and purple feathers' -- and gets exactly the plumage, on one condition: 'Never try to fly like other birds. Upon the day you try to fly you shall be changed into your former self.' Iktomi accepts instantly and breaks it within moments, unable to resist a passing flock. Immediately after, wanting to 'pierce the blue overhead,' he begs to become an arrow, and is granted it on a nearly identical condition -- 'Your flight must always be in a straight line. Never turn a curve nor jump about like a young fawn' -- which he also breaks within moments, leaping to play with the fawns he was flying past. Both times, the thing forbidden isn't some unrelated rule tacked onto the deal -- it's the very capacity (flight, freedom of movement) that made the envied form desirable to Iktomi in the first place, so the condition doesn't just risk being broken, it guarantees it: wanting to fly and being forbidden to actually use flight for anything but a straight, joyless line is not a wish that's been granted so much as a wish whose granting has been made structurally impossible to enjoy. The doubling matters -- Iktomi doesn't learn from the first failure and approach the second transformation more carefully; he makes the identical mistake immediately after watching it cost him everything, because the impulse driving both wishes was never really 'have these specific feathers' or 'be this specific arrow,' it was an underlying restlessness with being himself that no external form could actually satisfy. Diagnostic move: when a transformation, promotion, or acquired status comes with a condition that forbids the very thing that made you want it, recognize that you haven't actually gotten what you wanted -- you've gotten its appearance stripped of its function, and the discipline required to keep the appearance is discipline you likely don't have, since the desire for the function is what drove you to want the appearance in the first place.

Distinct from lex-ewafs (wish-with-loophole): that atom is about a GRANTER exploiting under-specification -- the genie or fate finds an unintended reading of what you asked for and delivers a technically-correct but harmful version. Here, there's no exploited ambiguity at all -- the condition is stated with total clarity up front, and the failure is entirely internal: the wisher cannot restrain the exact impulse the condition names, because that impulse is what generated the wish in the first place."
related: [lex-ewafs]
evokes: [a-condition-that-forbids-the-motivating-impulse, zitkala-sa-iktomi-and-the-fawn, the-form-without-the-function-that-made-it-desirable, repeating-the-identical-mistake-with-no-learning-between]
