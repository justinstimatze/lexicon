id: lex-3jxuw
name: ritual-reenactment-of-origin-activates-present-efficacy
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Knowing or believing in a founding precedent is treated as insufficient by itself — the precedent must be actively RE-PERFORMED, re-narrated, or re-enacted in the present moment before it will actually work, whether 'working' means healing a sickness, legitimizing a new structure, or renewing a system for another cycle. Eliade's Sacred and Profane documents this directly in archaic therapeutic practice: 'It is well known that in all primitive and traditional therapies a remedy becomes efficacious only if its origin is ritually rehearsed in the sick person's presence... we consider it certain that the origin myth was copied after the cosmogonic myth, for the latter is the paradigmatic model for all origins.' An Assyrian toothache incantation recites the creation of the world before it recites the cure, because the cure's power is understood to derive from re-performing the original creative act, not from the healer's private knowledge of it. The same structure governs action generally: 'We must do what the Gods did in the beginning,' says an Indian text (Shatapatha Brahmana, VII, 2, 1, 4). 'Thus the Gods did; thus men do,' the Taittiriya Brahmana adds (I, 5, 9, 4) — the myth must be re-enacted, not merely consulted. Generalize beyond ritual healing: a company retelling its origin story at every all-hands rather than once at founding (the retelling, not the fact of founding, is what re-activates the cohesion it's meant to produce); an oath of office actually spoken aloud at each inauguration rather than assumed from the officeholder's prior belief in the constitution; a scientific paper's methods section reproducing the derivation from first principles rather than citing that it was once derived; a martial-arts or musical practice that repeats the founding kata or scale daily, where the point is manifestly not to learn it once but to keep re-performing it. The mechanism these share: a precedent's authority is not a fact banked once and drawn down indefinitely — it is a claim that has to be re-asserted, in the present tense, by an act of repetition, or it goes dormant. The diagnostic move: when something is justified by appeal to a founding precedent, check whether the precedent is being actively re-performed in the current instance or merely cited as a settled fact from the past — the former activates the precedent's authority in this instance; the latter borrows it without renewing it, and is more fragile than it looks."
related: [lex-3n9fx, lex-bunc4, lex-q8az5]
evokes: [remedy-becomes-efficacious-only-if-its-origin-is-ritually-rehearsed, we-must-do-what-the-gods-did-in-the-beginning, thus-the-gods-did-thus-men-do, the-cosmogony-as-paradigmatic-model]
lineage:
  - source: primary
    text: eliade-1957-the-sacred-and-the-profane-annual-repetition-of-creation
    citation: "Mircea Eliade, The Sacred and the Profane: The Nature of Religion (1957; Willard R. Trask trans., Harcourt, Brace 1959), Chapter 2 'Sacred Time and Myths,' sections 'Regeneration through Return to the Time of Origins' and 'Myth = Paradigmatic Model,' on the necessity of ritually re-performing an origin-myth (not merely knowing it) for the myth to confer present efficacy — illustrated by archaic therapeutic incantation practice and the Vedic/Brahmanic imitatio-dei formula."
    quote: "It is well known that in all primitive and traditional therapies a remedy becomes efficacious only if its origin is ritually rehearsed in the sick person's presence. A large number of Near Eastern and European incantations contain the history of the sickness or of the demon who has provoked it, at the same time that they evoke the mythical moment in which a divinity or a saint succeeded in conquering the malady. But we consider it certain that the origin myth was copied after the cosmogonic myth, for the latter is the paradigmatic model for all origins. ... The therapeutic efficacy of the incantation lies in the fact that, ritually uttered, it reactualizes the mythical time of origins, both the origin of the world and the origin of toothaches and their treatment. ... 'We must do what the Gods did in the beginning,' says an Indian text (Shatapatha Brahmana, VII, 2, 1, 4). 'Thus the Gods did; thus men do,' the Taittiriya Brahmana adds (I, 5, 9, 4)."
canonical-instances:
  - "the Assyrian toothache incantation (Eliade's own example): before naming the cure, the incantation recites the full chain of creation — 'after Anu made the heavens, the heavens made the earth, the earth made the rivers, the rivers made the canals, the canals made the pools, the pools made the worm' — and only then narrates Ea's destruction of the worm; the cure's efficacy is bound to the re-performance of the creation-chain, not to the healer merely knowing it happened."
  - "New Year and installation rituals across cultures (Babylon's akitu, Fiji's installation-of-a-ruler ceremony explicitly called 'creation of the world'): the cosmogonic combat is re-enacted by actors or repeated in ritual formula every cycle, because the world's order is understood to require renewal by re-performance, not to persist automatically once created."
  - "corporate origin-story retelling: 'founded in a garage' narratives are retold at onboarding, all-hands, and press events rather than stated once in a company history document — the retelling is what keeps the founding narrative's cohesion-effect active for the current audience, not the historical fact of the founding by itself."
  - "oaths of office and ceremonial re-swearing: a constitution's authority over a given officeholder is not treated as automatically inherited from their prior belief in it — the oath must be actively spoken, in the present tense, at each inauguration, before the office's legitimacy is treated as active for that term."
critical-questions:
  - "how does this differ from lex-q8az5 noble-lie-instrumental-narrative-for-cohesion? lex-q8az5 is about a narrative's cohesion-function operating on an audience over time once it has been established and propagated — the emphasis is on WHAT the narrative does socially. This atom is about the specific temporal mechanism by which a precedent's efficacy is RENEWED: not narrative-content or its social function, but the requirement of REPETITION-IN-THE-PRESENT as the activating act. A noble lie can be propagated once and then merely maintained by inertia; this atom's claim is stronger — inertia is not enough, the precedent must be actively re-performed or it goes dormant. The two compose: a noble lie that is also ritually re-enacted (a founding myth recited at every civic ceremony, not just taught once in school) draws on both mechanisms at once, and is more durable than a noble lie that relies on cohesion-effect alone."
  - "does this claim that ONLY re-enactment works, and mere belief or citation never does? No — Eliade's own text distinguishes cultures and eras on exactly this axis (the chronological-survey section notes intellectual elites who retain the doctrine of cosmic cycles without the felt need for ritual re-performance, and finds the desacralized version 'terrifying' rather than efficacious to them). The claim is narrower: WHERE a system treats a precedent as needing renewal (therapeutic ritual, installation ceremony, oath, retold origin story), efficacy in that system specifically tracks re-performance, not mere historical fact of origination — it is a claim about which systems work this way, not a universal claim that citation is always insufficient everywhere."
  - "can this mechanism be misused to launder personal choice as inevitability? Yes, and Eliade's own material shows the extreme case: societies that justify ritual cannibalism, human sacrifice, or bodily mutilation by framing the act as re-enactment of a divine precedent rather than a personal decision — 'even the most barbarous act and the most aberrant behavior have divine, transhuman models,' in Eliade's phrase. Framing an act as REQUIRED re-performance of a paradigm, rather than a live choice, is exactly the move that displaces felt moral responsibility from the actor onto the precedent; the diagnostic is to ask whether the 're-enactment' framing is being used to activate a genuinely shared precedent's authority, or to pre-empt scrutiny of a decision that is, in fact, being made fresh in the present."
