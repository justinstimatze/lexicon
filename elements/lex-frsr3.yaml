id: lex-frsr3
name: growth-can-extend-laterally-with-no-terminus-instead-of-progressing-toward-one
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "Question the assumption built into 'growing up': that development is inherently vertical, aimed at a fixed terminus like adulthood or full stature, after which growth stops. Growth can instead extend sideways — widening the range of a person's connections, experience, and ideas — with no natural endpoint and no privileged direction, continuing at any age rather than concluding at one. Under this frame, a life or a mind that develops by lateral extension isn't failing to progress toward the vertical terminus; it's exercising a different, equally legitimate shape of growth that the vertical model doesn't recognize because it only has a vocabulary for height."
related: [lex-mqvyk]
evokes: [growing-sideways, stockton, queer-development, lateral-extension, verticality-assumption]
lineage:
  - source: primary
    text: stockton-2009-queer-child-growing-sideways-introduction
    citation: "Kathryn Bond Stockton, The Queer Child, or Growing Sideways in the Twentieth Century (Duke University Press, 2009), Introduction. No printed page number recovered from this extraction — the source PDF has an invalid XRef entry requiring reconstruction, but the actual text layer extracts cleanly and was verified verbatim. Cite by section until a page number can be confirmed."
    quote: "growth is a matter of extension, vigor, and volume as well as verticality. And \"growing sideways\" would likely be an extremely apt phrase for what recent cognitive science recognizes as the brain's growth (throughout a person's lifetime) through the brain's capacity to make neural networks through connection and extension. Hence, \"growing up\" may be a shortsighted, limited rendering of human growth, one that oddly would imply an end to growth when full stature (or reproduction) is achieved. By contrast, \"growing sideways\" suggests that the width of a person's experience or ideas, their motives or their motions, may pertain at any age, bringing \"adults\" and \"children\" into lateral contact of surprising sorts."
canonical-instances:
  - "A person who returns as an adult to interests, friendships, or forms of play coded as 'childish' reads as regression on the vertical model. The lateral-growth frame gives a second reading: extension sideways into territory the vertical model has no room for once its terminus, adulthood, has already been reached."
  - "operationally distinct from lex-mqvyk crip-time-names-able-bodied-tempo-as-one-temporality-not-the-default: crip time's axis is RATE — how fast development is expected to proceed, exposing able-bodied pace as one tempo among others. This atom's axis is SHAPE AND DIRECTION — whether growth has to aim at a fixed terminus at all, exposing verticality as one growth-shape among others. A life could move at a non-normative rate along a still-vertical path, or move at a normative rate along a lateral one; the two axes are independent."
critical-questions:
  - "Is 'lateral' growth actually directionless, or does it have its own implicit terminus (mastery of a widening domain, a fuller network of connections) that the frame is just declining to name? Pressing on where lateral growth is supposed to lead tests whether the frame escapes teleology or just relocates it."
  - "Does reframing a specific case as lateral growth do real interpretive work, or is it being applied to relabel any developmental pattern that doesn't fit the vertical model as 'sideways' by default? The frame is most useful where the vertical model would otherwise code the same pattern as failure or arrest."
  - "Stockton's own evidentiary anchor is a claim about neuroscience (neural-network growth throughout life) offered in support of a literary-critical and social argument — is that scientific claim doing real argumentative work here, or serving mainly as a plausibility gesture for a claim that stands on its own interpretive merits regardless?"
status: active
