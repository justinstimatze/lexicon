canonical-instances:
  - "An early-stage biotech screening thousands of compounds for a promising drug candidate deliberately uses a lenient statistical threshold at the screening phase, knowing that a stricter confirmatory trial will filter out the false positives later — using the strict threshold at screening would discard real candidates before anyone gets the chance to properly test them."
  - "A startup's growth team runs dozens of small experiments looking for promising retention signals, and deliberately treats a weak but suggestive result as worth investigating further rather than discarding it for failing a strict significance bar — because the cost of missing a real signal (never following up on something that mattered) is higher than the cost of one more follow-up experiment on something that turns out to be noise."
critical-questions:
  - "How does an organization or researcher avoid the trap of NEVER reaching the 'later, more rigorous test' phase this argument depends on — if every finding gets waved through at the exploratory stage as 'worth investigating further,' does the deliberate tolerance for false positives just accumulate indefinitely without the promised later filtering ever actually happening?"
  - "Does this argument implicitly assume that pursuing a false lead is cheap and quickly correctable, and a missed true lead is expensive and possibly permanent — are there exploratory contexts where the asymmetry runs the other way, where chasing a false lead consumes scarce resources that could have gone to a different, real signal, making the 'assemble a wide array of evidence' strategy actively counterproductive?"
