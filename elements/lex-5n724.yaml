id: lex-5n724
name: cross-species-comparison-denaturalizes-a-sex-assigned-decorative-trait
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "A decorative trait can be assumed within one's own culture to naturally and inherently belong to one sex -- long hair as intrinsically feminine, say -- simply because that is the local convention. A quick look across other species undoes the assumption: the same kind of trait, a mane or a crest, turns up assigned to the opposite sex in one species and to both sexes equally in another, revealing that the trait-to-sex pairing people treat as a fact about nature is actually just one culture's arbitrary convention. Gilman's narrator works through this directly, having noticed the short hair of Herland's women: 'Why we should so admire \"a woman's crown of hair\" and not admire a Chinaman's queue is hard to explain, except that we are so convinced that the long hair \"belongs\" to a woman. Whereas the \"mane\" in horses is on both, and in lions, buffalos, and such creatures only on the male.'"
