id: lex-cydgx
name: impersonating-venerated-authority-camouflages-undetected-predation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Adopting the appearance of a widely venerated and trusted figure can grant close, repeated, unsuspected access to a target that would otherwise stay alert to a stranger's approach, since the disguise doesn't just hide the predator's identity — it actively recruits the target's own deference to a category it has been culturally trained not to fear. In the Jataka's tale of the ivory poacher, a poor man wanting elephant tusks doesn't stalk or trap the herd; he disguises himself as a revered holy figure and simply stands in their path: 'clothing himself in a yellow robe, he put on the guise of a Pacceka-Buddha, with a covering band about his head. Taking his stand in the path of the elephants, he slew one of them with his weapon.' The costume doesn't just conceal a threat — it actively signals safety to a herd that has learned, correctly in every other case, that this particular figure poses none."
related: []
evokes: [jataka, dukanipata, kasava-jataka, a-trusted-categorys-signal-is-weaponized-not-just-worn, camouflage-that-recruits-the-targets-own-learned-deference]
lineage:
  - source: primary
    text: jataka-chalmers1895-kasava-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 221, Kasava-jataka (birth story; the source text is cut off before its resolution). Verified verbatim against a direct extraction of the held copy."
    quote: "clothing himself in a yellow robe, he put on the guise of a Pacceka-Buddha, with a covering band about his head. Taking his stand in the path of the elephants, he slew one of them with his weapon."
canonical-instances:
  - "A scammer targeting elderly homeowners doesn't pose as a stranger asking for money — they wear a utility company uniform and badge, since the costume doesn't just avoid suspicion, it actively triggers the homeowner's learned habit of cooperating with utility workers without question."
critical-questions:
  - "Does the mechanism depend on the target species or group having a specific, learnable category to exploit — would this work against a target with no cultural memory of the venerated figure being impersonated, or does the costume need a pre-existing reputation to weaponize in the first place?"
  - "How does a target eventually detect this kind of predation, given that the disguise is specifically engineered to prevent the normal vigilance that would catch an unconcealed threat — is repetition itself (the poacher returning again and again) the only thing that eventually gives it away?"
status: active
