id: lex-e9z2y
name: causal-inference-method-selection-by-control-and-composition
type-in: claim
type-out: posture
_tier: molecule
agent-instruction: "When choosing a causal-inference method, first ask whether composition is summed or emergent. If emergent, isolation-based methods will produce artifacts. If summed, choose between randomization (when feasible), eliminative paired comparison (when isolation possible), or covariation (when permanent causes resist elimination). The selection logic IS the molecule."
related: [lex-6wsw2, lex-b6kvs, lex-eybad, lex-k9ku5, lex-qkrey, lex-rfxtb, lex-spk4s, lex-t732m, lex-v6nqz, lex-xhwqt]
scaffolds-from: [lex-eybad, lex-b6kvs, lex-v6nqz, lex-qkrey, lex-k9ku5]
evokes: [how-do-i-establish-this-cause, can-i-randomize-or-not, controlled-experiment-vs-observational, method-of-difference-vs-deduction, does-it-sum-or-emerge-first, pick-the-causal-method-by-your-constraints, RCT-or-eliminative-or-deduce-and-verify, isolability-gates-the-method, the-causal-staircase]
decomposes-into:
  - lex-eybad
  - lex-b6kvs
  - lex-v6nqz
  - lex-qkrey
  - lex-k9ku5
assembly: "conditional(choice(lex-b6kvs, parallel(lex-v6nqz, lex-qkrey), lex-k9ku5; selector=control-and-separability); if=composition-additive-per-lex-eybad)"
premises:
  - "a causal question is posed: does antecedent X produce effect Y in this system? (type-in: claim)"
  - "FIRST gate — lex-eybad emergent-effects-resist-decomposition: classify the system's composition. If joint effects are additive/mechanical (X retains its own law in combination), isolation-based methods are valid; if heteropathic/emergent (the whole obeys new laws not summable from parts), 'X's separate contribution' is ill-posed — abandon isolation and model the higher-level regularity directly. This gate runs before any method is chosen because every method below presupposes additivity"
  - "THEN select the method by control-and-separability (choice): (a) if you can manipulate/randomize the antecedent → lex-b6kvs randomization, which neutralizes even unknown confounders and yields the strongest warrant"
  - "(b) elif you cannot randomize but can find or construct clean contrasts where causes are separable → the eliminative methods in sequence: lex-v6nqz method-of-difference (paired presence/absence of the candidate cause) then lex-qkrey concomitant-variations (covariation of magnitudes when permanent causes resist elimination)"
  - "(c) elif an uncontrollable plurality of inseparably-intermixed causes acts on every instance with no experiment possible → lex-k9ku5 plurality-without-experiment-forces-deductive-verification: derive tendencies from the known component laws and use observation to verify, not to establish by raw comparison"
  - "output posture: the selected method plus an honest read of the evidential strength it can yield in this constraint-regime (randomization > eliminative-with-clean-contrast > deductive-verification), and the explicit acknowledgment that lower-control regimes yield weaker causal warrant — not a free pass"
critical-questions:
  - "why is lex-eybad the FIRST gate rather than just another method? Because every isolation/elimination method (lex-b6kvs/0342/0343) presupposes that X has a separable contribution that sums into the whole. Under heteropathy/emergence that presupposition fails, so running a difference or concomitant-variation analysis manufactures artifactual 'main effects.' Classify composition before choosing an isolation method; if emergent, the whole branch below is the wrong tool."
  - "isn't this just 'use an RCT if you can'? No — that is only branch (a). The molecule's value is the full ladder: what to do when you CAN'T randomize (eliminative-if-separable) and when you can't even isolate (deduce-and-verify), plus the composition precondition. The RCT-preference is the obvious part; the fallback structure and the gate are the non-obvious contributions."
  - "how does it relate to its component atoms? It is precisely their named assembly: lex-eybad gates, then a choice over lex-b6kvs / (lex-v6nqz→lex-qkrey) / lex-k9ku5 by feasibility. None of the component atoms carries the SELECTION logic — each is a method or a gate; the molecule is the decision procedure that routes a causal question to the right one given your constraints. That selection logic is the molecule's generative contribution (Principle 9 Test 2)."
  - "where does it mislead or need refinement? (1) Skipping the composition gate and forcing an isolation method on a strongly-interacting/emergent system yields spurious additive estimates. (2) Treating the deductive fallback as equal-strength to an RCT — it is what you do when better designs are unavailable, not equivalent warrant. (3) The trichotomy is really a SPECTRUM: quasi-experimental designs (instrumental variables, regression-discontinuity, difference-in-differences, natural experiments) are partial recoveries of experimental variation that sit between the randomize branch and the deduce branch; read branch (b) as containing them rather than as a hard cliff."
  - "does the molecule falsify? It is a method-selection procedure, so the test is whether real causal inferences route cleanly. Cases that stress it: (i) Mendelian randomization (uses genotype as a natural randomizer — sits between (a) and (b)); (ii) mechanistic/single-case causal claims established by tracing a process rather than comparing instances (process-tracing, cf. lex-8j5ms) — a fourth route the molecule should acknowledge alongside (c). These refine the branch boundaries rather than refute the selection logic."
lineage:
  - source: primary
    text: mill-1843-book-vi-ch-vii-the-method-ladder
    citation: "John Stuart Mill, *A System of Logic* (1843), Book VI Ch.VII (lines 31718-32018) supplies the molecule's fallback logic explicitly: Mill walks the eliminative methods (Difference, Agreement, Concomitant Variations, Residues) to FAILURE in complex social domains and concludes the Concrete Deductive Method must take over — i.e., the routing from branch (b) to branch (c). The composition gate (branch precondition) is Mill Book III Ch.VI (lines 13149-13373, lex-eybad). PD globally (Mill d.1873). The molecule is a discovery-loop synthesis whose component-routing Mill articulated; the modern randomize-first branch (lex-b6kvs, Fisher 1925) was added later as the strongest design when manipulation is possible."
canonical-instances:
  - "Drug efficacy → branch (a): the antecedent (drug vs placebo) can be manipulated and assigned, so randomization (lex-b6kvs) is available and chosen; it neutralizes even unknown confounders and yields the strongest warrant. The composition gate is benign (the effect is treated as additive over the trial population)."
  - "Does smoking cause lung cancer (mid-20th-c) → branch (b): randomizing humans to smoke is impossible, but clean contrasts exist (smokers vs non-smokers across many populations, dose-response gradients), so the eliminative + concomitant-variation methods (lex-v6nqz→lex-qkrey) carry the inference, ultimately conjoined with mechanistic verification. The textbook case of establishing causation without an RCT."
  - "Macroeconomic policy effect (e.g., does protectionism cause prosperity?) → branch (c): an uncontrollable plurality of intermixed causes acts on every nation with no experiment possible, so naive comparison fails (Mill's own example) and the route is deduce-from-component-laws-and-verify (lex-k9ku5) — structural models checked against observation, not cross-country regression treated as a crucial experiment."
  - "Emergent-system caution → the gate fires: asking 'what is the separate causal contribution of neuron X to consciousness' or 'of gene X to a polygenic trait with strong epistasis' trips lex-eybad — the contribution may be ill-posed because the joint effect is heteropathic. The molecule routes AWAY from isolation methods toward modelling the higher-level regularity, rather than reporting artifactual main-effects."
  - "Software regression attribution → spectrum: 'did config change X cause the latency regression?' If you can A/B-test → branch (a) (lex-b6kvs); if not, a natural experiment / diff-in-diff over a deploy boundary → branch (b); if the system is a tightly-coupled emergent mess where the regression is a joint effect → gate flags isolation as ill-posed and you model/simulate the whole. The everyday engineering instance of the ladder."
  - "operationally distinct from each component atom: lex-b6kvs/0342/0343/0373 are individual methods (or the no-experiment fallback); lex-eybad is the composition gate. lex-e9z2y is the SELECTION PROCEDURE that routes a causal question to the right one by control-and-separability. The molecule adds routing logic that no single atom carries — which is exactly what makes it a molecule rather than a list."
