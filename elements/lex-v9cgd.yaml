lineage:
  - source: primary
    text: hohwy-2014-the-predictive-mind
    citation: "Jakob Hohwy, *The Predictive Mind* (Oxford University Press, 2014), Chapter 9 ('Precision, Attention, and Consciousness')."
    quote: "'The most famous attempt to capture the essence of attention comes, of course, from William James: \"Everyone knows what attention is. It is the taking possession by the mind, in clear and vivid form, of one out of what seem several simultaneously possible objects or trains of thought. Focalization, concentration, of consciousness are of its essence... \" (James 1890: Vol I: 403-4)... It is tempting to develop Helmholtz's dynamic conception of attention in terms of the conceptual tools provided by the prediction error minimization account. In particular, I believe we need to look at the optimization of precisions... The proposal from the main architect of the contemporary prediction error scheme, Karl Friston and his colleagues, is that attention is just optimization of precisions in hierarchical prediction error minimization (Friston 2009; Feldman and Friston 2010)... The job for the relevant part of the prediction error mechanism is to assess the precision of the incoming signal... Mechanistically this is done via groups of neurons making up error units of each level, increasing or decreasing the gain on the prediction error... Precise prediction error is allowed passage up through the hierarchy to a larger extent than imprecise prediction error... The result is that prediction error minimization effort is selective within the prediction error landscape. This is, most basically, why it fits with the functional role for attention. Attention is then the process of optimizing precision of prediction errors in hierarchical perceptual inference (Friston 2009). On this conception, attention requires learning state-dependent patterns of noise and precision and then using such prior beliefs to set the gain on prediction error.' (Hohwy, *The Predictive Mind*, Ch.9, pp.193-195)"
  - source: discovery-loop
    text: hohwy-predictivemind-mining-pass-
    citation: "Hohwy's *The Predictive Mind* had been cited only as a scaffolding 'deepening source' in two existing atoms — lex-2kjmb (organisms-minimize-surprise-by-acting-or-by-updating-beliefs) and lex-hfcae (expectancy-violation-as-learning-mechanism) — but never mined for its own specific claims. The source PDF is digital-native, not a scan, so the quoted passages carry no OCR risk. Lex-0699's own agent-instruction mentions in passing that 'attention, motivation, and exploration all fall out of this framework as different routes to reducing precision-weighted prediction error,' but never operationalizes the specific mechanism — gain-modulation, Posner cueing, the endogenous/exogenous distinction, inattentional blindness — that this atom is the first to state. Lex-0330 (James, selective-interest-constitutes-experience) is a phenomenological claim about attention constituting experience, distinct from this atom's computational-mechanism claim; lex-73wdz and lex-fgc3p are unrelated attention-adjacent claims about meditation and detail-attentive cognition. Lex-1024 (precision-miscalibration produces opposite clinical profiles), also drawn from Hohwy's Chapter 7, is a companion atom from the same pass."
canonical-instances:
  - "Posner's classic spatial-cueing paradigm: participants fixate centrally; a cue (often an arrow) predicts a peripheral target's location 80% of the time. Valid cues speed detection at the cued location even though the raw sensory input to the eyes is unchanged on every trial — the only thing that changed is the EXPECTED PRECISION assigned to that location, exactly matching the theory's prediction that attention just is a precision-allocation, not a change in raw sensory input."
  - "Inattentional blindness (e.g. the 'invisible gorilla' class of experiments): a fully visible, high-contrast event goes completely unnoticed by an observer engaged in an unrelated counting task — explained on this account as the unattended region carrying such low expected precision (low gain) that even a large prediction error there fails to propagate up the hierarchy and update belief, regardless of how salient the stimulus objectively is."
  - "Helmholtz's pre-theoretical observation, quoted approvingly by Hohwy as an anticipation of the mechanism: 'The natural unforced state of our attention is to wander around to ever new things, so that when the interest of an object is exhausted, when we cannot perceive anything new, then attention against our will goes to something else' — a description of exactly what you'd expect if attention tracks EXPECTED information-gain (precision) rather than raw stimulus intensity: an object that has stopped yielding new, precisely-predictable structure stops attracting the gain."
  - "An expert (e.g. an experienced radiologist scanning an X-ray, or a sommelier tasting wine) attending selectively to regions or features a novice would miss — on this account, not because the expert 'tries harder' but because learned priors about where diagnostic signal reliably lives raise the expected precision of those specific channels, automatically setting a higher gain on them."
critical-questions:
  - "Isn't this just relabeling 'attention' as 'precision' without adding anything? The claim is falsifiable, not merely relabeling: it predicts that experimentally manipulating expected reliability (independent of raw stimulus salience) should modulate attentional allocation, and several of the phenomena it's tested against (Posner cueing, inattentional blindness, endogenous-vs-exogenous attention timing profiles) were not designed with this theory in mind — the theory has to accommodate independently-collected data, which is a real test a mere relabeling would not need to pass."
  - "Does this reduce attention to a purely bottom-up statistical process, missing the volitional, effortful quality of 'paying attention'? Hohwy explicitly addresses this by treating volitional/endogenous attention as active inference — the system doesn't just passively receive precision estimates, it can ACT to change the environment or reallocate the precision-optimizing hierarchy is doing (moving your eyes, positioning your body) in order to raise expected precision where you want it. The felt effort of 'trying to focus' is the active-inference component; the account is not purely passive."
  - "How is 'expected precision' distinct from just 'stimulus intensity' or 'salience'? A dim but reliably-informative signal (e.g. a faint but consistent alarm tone) can carry high expected precision and pull strong attention despite low intensity, while a loud but erratic/unreliable signal can carry low expected precision — the theory's distinguishing prediction is that RELIABILITY, not raw intensity, is what should predict attentional capture, which is testable independent of salience manipulations."
  - "Does the theory explain the RELATIONSHIP between attention and conscious perception, or just attention alone? Hohwy treats this as a live, only partially resolved question in the same chapter — there's evidence attention and consciousness can dissociate (attention without awareness, and vice versa), and the precision-optimization account is offered as a framework capable of accommodating that dissociation (different functional roles: attention as precision-weighting, consciousness as something more like a global summary), not as proof they are identical."
