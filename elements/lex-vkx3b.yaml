id: lex-vkx3b
name: factional-heirs-mistake-a-torn-fragment-for-the-whole-legacy
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an original, unified body of teaching or authority loses its living center -- its founder dies, its founding institution dissolves, its unifying figure exits -- rival successor factions each seize a different fragment of what remains, and each mistakes possessing its fragment for possessing the undivided whole. Outside observers compound the error, treating visible traces of the fragment as proof of full, legitimate inheritance. Philosophy describes this happening to her own legacy: 'the Epicurean herd, the Stoic, and the rest, each of them as far as in them lay, went about to seize the heritage he left, and were dragging me off protesting and resisting, as their booty, they tore in pieces the garment which I had woven with my own hands, and, clutching the torn pieces, went off, believing that the whole of me had passed into their possession. And some of them, because some traces of my vesture were seen upon them, were destroyed through the mistake of the lewd multitude, who falsely deemed them to be my disciples.'"
related: []
evokes: [consolation-of-philosophy, book-i-prose-iii, they-tore-in-pieces-the-garment-which-i-had-woven, believing-that-the-whole-of-me-had-passed-into-their-possession, schism-among-a-founders-heirs]
lineage:
  - source: primary
    text: boethius-c524-consolation-of-philosophy-book-i-prose-iii
    citation: "Boethius, The Consolation of Philosophy (c. 524 AD), trans. H. R. James (London: George Bell & Sons, 1897), Book I, Prose III. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "And when, one after the other, the Epicurean herd, the Stoic, and the rest, each of them as far as in them lay, went about to seize the heritage he left, and were dragging me off protesting and resisting, as their booty, they tore in pieces the garment which I had woven with my own hands, and, clutching the torn pieces, went off, believing that the whole of me had passed into their possession. And some of them, because some traces of my vesture were seen upon them, were destroyed through the mistake of the lewd multitude, who falsely deemed them to be my disciples."
canonical-instances:
  - "After a visionary founder leaves a company, three former lieutenants each launch a startup built around a different piece of the original product philosophy -- pricing model, design language, engineering culture -- and each insists theirs is the true continuation of the founder's vision."
  - "Following a revered teacher's death, several senior students each emphasize a different practice from the teacher's broad curriculum -- one the meditation technique, one the ethical precepts, one the philosophical doctrine -- and each group treats the others as incomplete deviations rather than fellow fragment-holders."
  - "After a political movement's charismatic leader is imprisoned, splinter factions each adopt a single plank of the original platform as though it were the whole program. Outside observers then mistake whichever faction stays most visible for the movement's real heir."
critical-questions:
  - "Is it actually possible for a complex original teaching to survive undivided in any single successor, making 'fragmentation' not a corruption of an achievable whole but simply what always happens to any sufficiently rich legacy after its originator is gone?"
  - "Who gets to judge which faction's fragment is more distorted than another's, when the only witness who held the undivided whole -- the original -- is no longer available to arbitrate?"
  - "Mistaking a visible fragment-bearer for a full disciple inflates that faction's claimed legitimacy beyond what its actual fragment supports -- is that inflation ever a cost to the fragment-bearers themselves, or just a windfall?"
status: active
