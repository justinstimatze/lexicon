lineage:
  - source: primary
    text: kautilya-arthashastra-outmanoeuvring-technique
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Kautilyan Foreign Policy,' 'Theory and Practice,' editorial analysis of {7.1-7.18}."
    quote: "'In developing the theory, Kautilya often uses a technique of comparison to indicate the preferred course of action. He visualizes a hypothetical situation of two kings deciding to do similar things; whoever makes a better choice is said to have \"outmanoeuvred\" the other. The word \"outmanoeuvring\" (atisamdhi) occurs whenever it is necessary to indicate an order of preference. This is purely a technique used for elucidation and does not imply that the hypothetical situations of the two king's acting in a similar way occur in reality. It is akin to the form of argument \"If I did this and my enemy did that...\".'"
canonical-instances:
  - "A business school case-method instructor, wanting to establish that a specific negotiation tactic is genuinely sound rather than merely lucky in the one famous deal it's usually illustrated with, constructs a symmetric hypothetical of two otherwise-identical negotiators who differ only in whether they use the tactic — showing which one 'wins' in the constructed scenario isolates the tactic's own value from the historical deal's many other confounding factors (market conditions, personal relationships, luck)."
  - "A chess or poker strategy writer, evaluating whether a specific opening move or betting pattern is actually good, doesn't just cite a famous game where a grandmaster used it and won — they construct or reference a symmetric analysis where two equally-skilled players differ only in that one choice, so any advantage demonstrated can be attributed to the choice itself and not to one player's overall superior skill."
critical-questions:
  - "does constructing a symmetric hypothetical actually eliminate confounding, or does it just relocate the confounding into the hypothetical's own assumptions — the person constructing the comparison still has to decide what 'otherwise identical' means, and a biased construction could smuggle in an advantage for the preferred choice under the guise of a fair, symmetric setup?"
  - "how does this technique handle strategic choices whose value is genuinely context-dependent — if a choice is good in some situations and bad in others, does forcing a single symmetric-hypothetical comparison risk producing a false general verdict ('outmanoeuvres' or doesn't) about a choice that actually has no fixed value independent of context?"
  - "is the hypothetical-comparison method actually distinct from ordinary game-theoretic or scientific counterfactual reasoning, or is Kautilya's atisamdhi simply an early instance of a much more general reasoning tool (holding variables constant to isolate a causal factor) that shows up across many traditions independently, making the specific historical attribution less significant than the underlying, more universal technique?"
status: active
