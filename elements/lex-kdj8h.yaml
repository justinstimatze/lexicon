id: lex-kdj8h
name: invert-the-problem-engineer-the-path-by-reversing-it
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When a problem resists forward attack — 'how do I achieve X?' — INVERT it: 'how would I guarantee NOT achieving X?' or 'what conditions would make X impossible / what failure modes destroy X?' Munger's Jacobi-inherited discipline 'Invert, always invert.' The transferable mechanism: forward-attack searches the success space (large, ill-defined); inversion searches the failure space (often smaller, sharper, more obvious). Surface the failure-mode list, eliminate paths that produce failures, and the remaining paths converge on success without ever solving the forward problem. The 1986 Harvard School commencement speech is the canonical instance — instead of giving prescriptions for happiness, Munger inverts to 'prescriptions for misery' (envy, resentment, unreliability, etc.), making the recommendations sharper and more actionable than the forward-version would have been. Mathematical heritage: Jacobi worked algebraic problems backward when forward attack failed; Carson analyzed how to make non-X to learn about X; Einstein resolved Maxwell-Newton incompatibility by inverting which framework to revise (modify Newton to fit Maxwell, not the reverse). Practitioner discipline: WHEN STUCK, INVERT THE QUESTION. Diagnostic: 'what would have to be true for THIS to fail catastrophically?' is the inverted form of 'how do I make this succeed?' — and is usually easier to answer concretely. Be careful with the inverse failure mode: not every problem inverts cleanly. Inversion's strength is when the success space is huge and the failure space is small; if both are huge, inversion provides no advantage. The atom is a tool, not a universal solvent. Distinct from lex-eb3wf prospective-hindsight-as-failure-mode-elicitation (Klein 2007 pre-mortem): the Klein atom is the SPECIFIC decision-analysis instance (run a pre-mortem on a project), well-instrumented and time-bound; this atom is the BROADER algebra-of-thought claim (use inversion as a default move when stuck on a question). They compose: a pre-mortem is one operational form of inversion."
