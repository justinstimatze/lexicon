id: lex-72q3j
name: the-whole-and-its-parts-mutually-fix-each-others-meaning
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Dilthey names the central difficulty of all interpretation: to make sense of a work's individual parts you need a prior grip on the whole, yet that grip on the whole is built from nothing but those same parts. Neither side arrives first in some clean form ready to ground the other. Dilthey finds this structure at every scale he examines -- inside a single work, across an author's whole development, inside a literary genre -- and at none of those scales does it resolve into a one-way derivation. The consequence he draws is that understanding stays inherently partial and can never be brought to completion: 'the individual is ineffable.' Recognize the same structure whenever grasping a part requires a prior sense of a whole that only the parts themselves can supply. Rereading a novel's opening chapter changes once you know the ending, and the ending only lands the way it does because of how that opening set things up. A new hire on an unfamiliar codebase can't parse a given function without some sense of the system's architecture -- a sense that exists nowhere except in the accumulated reading of enough individual functions. A disputed contract clause gets read against the document's overall intent, and that intent is nothing but a construction built from reading the clauses themselves. There is no escape from the circle. The productive move is to enter it deliberately at some point, provisionally commit to a reading of the whole, use it to make sense of the next part, and let that part revise the reading in turn."
related: [lex-kxk99]
evokes: [dilthey-1900-rise-of-hermeneutics, hermeneutic-circle, individuum-est-ineffabile, whole-from-parts-parts-from-whole, schleiermacher-preface-to-platos-republic, partial-understanding-never-completed]
lineage:
  - source: primary
    text: dilthey-1900-rise-of-hermeneutics
    citation: "Wilhelm Dilthey, 'The Rise of Hermeneutics' (1900), in Selected Works, Volume IV: Hermeneutics and the Study of History, ed. Rudolf A. Makkreel and Frithjof Rodi, trans. Fredric R. Jameson and Rudolf A. Makkreel (Princeton University Press, 1996), Part I section 4, on the central difficulty of interpretive practice."
    quote: "'It is at this point that the central difficulty of all interpretive practice makes itself felt. The whole of a work is to be understood from the individual words and their connections with each other, and yet the full understanding of the individual part already presupposes that of the whole. This circle repeats itself in the relation between an individual work and the development and spiritual tendencies of its author, and it returns again in the relation between an individual work and its literary genre... Theoretically, we here reach the limits of all interpretation, which is able to fulfill its task only up to a certain point. For all understanding always remains partial and can never be completed. Individuum est ineffabile.' [Verified 2026-08-28 against a direct read of the source: exact match throughout; the checker cannot confirm it because this densely cross-referenced page has marginal footnote-number glyphs that bleed into the reconstructed paragraph text at scattered points during extraction (an 'S' inserted between 'individual' and 'work'; a stray '= 5 S' inserted before 'which is able') -- reconstructed here in the source's actual reading order, with that marginal garbage excluded.]"
canonical-instances:
  - "Rereading a novel's first chapter after finishing the book changes what that chapter means, while the ending itself only makes sense in light of how the opening set its terms up -- neither part settles first; each keeps revising the other."
  - "A new engineer stares at one function in an unfamiliar codebase with no sense yet of the system's overall architecture; that architectural sense only forms after enough individual functions have been read. The two build up together, and there's no clean first move."
  - "A single clause in a long contract is read against the document's overall intent, but that overall intent is itself only ever constructed by reading the individual clauses -- disputes over a contract's meaning are frequently disputes about which direction of this circle should be trusted more in the case at hand."
  - "Operationally distinct from lex-kxk99 principles-and-considered-judgments-mutually-adjust-until-coherent: Rawls's reflective equilibrium is a NORMATIVE-THEORY-CONSTRUCTION method -- principles and judgments are deliberately, iteratively revised toward an achievable stopping point where they cohere. This atom names a structural claim about how UNDERSTANDING ITSELF works for any whole made of parts, and Dilthey is explicit that here the circle stays permanently open rather than settling into any achieved equilibrium. They share a mutual-adjustment shape but disagree sharply on whether the process ever finishes."
critical-questions:
  - "Does where you enter the circle bias where you end up? A reading that starts from a strong first impression of the whole may keep finding that impression confirmed in the parts, simply because it set the terms for how each part gets read."
  - "When do you decide understanding is sufficient to act on, given that Dilthey says completion is impossible in principle? Waiting for the circle to close is waiting forever; some practical threshold has to substitute for completion, and naming that threshold explicitly is different from pretending it isn't there."
  - "Is the circle vicious or virtuous -- does it quietly assume its conclusion, or does it genuinely self-correct? The difference seems to turn on whether each pass actually revises the prior reading of the whole in light of a part that resisted it, or whether the 'whole' is just being used to explain away every part that doesn't fit."
