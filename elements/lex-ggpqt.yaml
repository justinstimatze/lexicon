name: dark-forest-strategic-frame-under-existential-information-asymmetry
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When analyzing strategic interaction between agents who (a) cannot reliably verify each other's intentions, (b) face existential stakes if those intentions are hostile, and (c) face technology-divergence such that the weaker agent may suddenly outpace the stronger — Liu Cixin's transferable claim is that the DARK FOREST STRATEGIC FRAME applies: each agent rationally treats every other agent as a potential threat to be eliminated rather than communicated-with, because the asymmetric downside of trusting wrong (extinction) dominates the asymmetric upside of trusting right (gain from cooperation). The frame is derived from two axioms of cosmic sociology in Liu Cixin's fictional treatment but generalizes far beyond: AXIOM 1 — survival is the primary need of each agent; AXIOM 2 — agents continuously grow but total accessible matter/resources are bounded. Plus two structural concepts: CHAINS OF SUSPICION (you don't know what they think about what you think about what they think... about whether you're hostile, so even good-intentioned actors cannot communicate their good intentions reliably) and TECHNOLOGICAL EXPLOSION (the weaker agent's capability can jump rapidly and unpredictably, so present-day power-asymmetry is no guarantee of future safety). Combine these: the rational move for any agent observing another is to ELIMINATE FIRST, BEFORE the other can become threatening — Liu Cixin's metaphor is the hunter in a dark forest who silently treads carefully and, on seeing any other being, fires immediately because that being might also be a hunter. The transferable consequence: in any strategic environment matching all three preconditions (verification-failure + existential-stakes + capability-asymmetry-can-flip), the equilibrium tends toward MUTUAL PRE-EMPTIVE ELIMINATION rather than cooperative communication. Transferable instances: (1) GREAT-POWER NUCLEAR DOCTRINE — the cold-war first-strike incentive under mutual-assured-destruction is the dark-forest frame at planetary scale; the stability comes from MAD destroying the existential-stakes condition by guaranteeing mutual annihilation, NOT from trust; (2) PIRACY / FRONTIER COMMERCE — sailing ships in lawless waters defaulted to attack-on-sight because hails could be deceptive and mistakes were fatal; (3) ANIMAL TERRITORIALITY in resource-scarce species — encounters with conspecifics often default to attack-or-flee rather than communication because verification is unreliable; (4) STARTUP/CORPORATE COMPETITION under winner-take-all dynamics (the YouTube vs Vimeo era; the early-platform-winner-eats-all era) — when failing to dominate first means extinction, firms rationally attack incumbents and emerging-threats simultaneously rather than coexist; (5) DARK-FOREST APPLIED TO INTERNET (Strickler 2019 Medium) — anonymous-mass-attention adversarial-scrutiny environments push genuine conversation into 'cozy web' enclaves of trusted intimacy; (6) AI-AGENT INTERACTION in adversarial deployment (multi-agent simulation where alignment is unverifiable and capabilities can flip via training jumps) — the dark forest may describe near-future AI strategic interaction. Practitioner consequences: (1) when DESIGNING strategic environments, the dark-forest frame predicts catastrophic equilibria — environments where verification, existential-stakes, and capability-flip-risk all hold MUST be redesigned to remove at least one of those preconditions or the equilibrium will tend toward elimination; (2) when ANALYZING strategic environments, name which precondition is operative or absent; if you observe cooperation in a dark-forest-preconditions environment, ask what is providing the trust-substrate (norms, verification mechanisms, MAD-style mutual exposure, or shared cultural commitments); (3) when REASONING about cosmic-scale or species-scale questions (Fermi paradox, AI-x-risk, civilizational collapse), the dark forest is one structural candidate explanation — distinct from but compatible with other Fermi-paradox candidates (rare-Earth, transcension, simulation, great-filter-behind). Distinct from lex-eg9zm cooperation-evolves: cooperation can evolve via kin-selection, reciprocity, or shared-fate; the dark forest is precisely the case where NONE of those mechanisms applies (verification failure breaks reciprocity; no kin relation; survival is zero-sum at the relevant scale). Distinct from lex-5dnd9 inclusive-fitness: kin-selection produces cooperation among genetic relatives; the dark forest describes interaction between non-related agents under existential information asymmetry. The dark-forest atom names the LIMIT CASE where standard cooperation-mechanisms fail and elimination dominates."
