id: lex-pw2fb
name: helping-someone-who-was-never-going-to-favor-you-breeds-more-hatred-not-goodwill
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two rivals compete to win over the same third party by each offering help, don't assume that whoever gives the most generous assistance comes out ahead -- Kautilya names an asymmetric outcome that depends entirely on which side the third party already favored, not on the size or quality of what either side offers: 'If both the conqueror and the enemy give help to the same neighbour, the Middle king or the Neutral king, whoever is a friend (or a better friend) of the king helped, is to be considered to have outmanoeuvred the other. For, he who helps a friend, promotes his own interests. The other, helping one less friendly, not only reaps losses, expenses, absences from home and gains to his enemies but is all the more hated for having been a benefactor.' The mechanism is precise about the LESS-favored helper's outcome: it is not merely that his help fails to purchase goodwill, leaving him no better off than before -- he ends up MORE hated than if he had done nothing at all, specifically 'for having been a benefactor.' The reason a costly favor can produce resentment rather than gratitude is that receiving help from someone you don't actually like creates an unwanted debt: the recipient now owes something to a party they'd rather not be indebted to, and that discomfort attaches itself to the benefactor rather than dissolving into thanks, precisely because there was no pre-existing goodwill to make the debt feel welcome. Meanwhile the already-favored helper's assistance lands on ground already prepared to receive it warmly, so the identical act of helping produces opposite emotional outcomes purely as a function of the prior relationship, not the help itself. Diagnostic move: before spending real resources trying to win over someone who has already shown a clear preference for a rival, check whether you're actually improving your position or whether you're paying real costs to produce a result that structurally cannot exceed neutral and may well make things worse -- an uninvited favor to someone predisposed against you can curdle into resentment specifically because it forces an unwanted obligation on someone who would have preferred not to owe you anything."
