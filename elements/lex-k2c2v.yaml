canonical-instances:
  - "A financial-crimes unit disrupting a phishing operation that spans multiple countries focuses resources on the rare cash-out facilitator (the cross-border money-mule network) rather than chasing individual phishing-email senders, because senders are cheap and infinitely replaceable while a working cross-border cash-out channel is genuinely scarce — the cross-regional case, matching Kautilya's 'tackle the one who responds.'"
  - "A content-moderation team dealing with a coordinated harassment campaign organized entirely within one online community targets the organizer who keeps recruiting new participants, rather than banning individual participants one at a time, because within a single community new recruits are cheap to find and banning participants alone never stops the source — the same-region case, matching Kautilya's 'tackle the instigator.'"
  - "operationally distinct from lex-3apjn reserve-the-costliest-influence-method-for-the-most-distant-relationship: that atom chooses AMONG conciliation/gifts/dissension/force based on relational distance to a single target; this atom chooses WHICH OF TWO ROLES in a two-party plot to target at all, based on which role is structurally scarce."
critical-questions:
  - "how would someone actually determine, in real time, whether a given accomplice role is 'cheap and replaceable' or 'scarce and hard to reconstitute' before acting — is this knowable in advance, or only inferable after seeing how quickly (or slowly) a plot recovers from a disruption attempt?"
  - "does this framework generalize past exactly two roles (instigator, responder) to conspiracies or coordination networks with three or more distinct functional roles, or does the clean flip-the-target logic depend specifically on there being only one boundary-crossing link to evaluate?"
  - "Kautilya's own four-case table treats 'interior' and 'outer' as the only two relevant zones — in a modern, more fragmented network (many jurisdictions, many platforms, many organizational silos), how many meaningfully distinct 'regions' actually exist, and does the scarce-versus-abundant-accomplice logic still produce a clean answer once there are more than two zones to reason about?"
status: active
