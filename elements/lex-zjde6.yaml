id: lex-zjde6
name: the-using-culture-not-the-maker-authors-an-artifacts-meaning
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When judging whether an adopted or imported cultural artifact -- a textile pattern, a technology, a custom -- is 'authentic' or has a fixed meaning, locate the authority in how the ADOPTING population actually uses, names, and re-contextualizes it, not in the producing population's origin or original intent. A Dutch-designed print renamed after a Ghanaian proverb, or foreign silk thread unraveled and rewoven into a new kingdom's royal cloth, is not a corrupted or inauthentic copy of the source; the adopting culture's re-use IS the artifact's actual, operative meaning, and it can fully supersede whatever the originator intended. Don't treat an artifact's history of foreign origin as evidence against its authenticity within the culture that took it up and made it its own."
related: []
evokes: [wax-prints-renamed, kente-cloth-origin, consumers-determine-meaning, cultural-reappropriation, good-beads-dont-talk, ankara-kitenge]
lineage:
  - source: primary
    text: postrel-2020-fabric-of-civilization-ch6-consumers
    citation: "Virginia Postrel, The Fabric of Civilization: How Textiles Made the World (Basic Books, 2020), Chapter Six: Consumers, on West African wax-print textiles (originally Dutch imitations of Javanese batik) and the local proverb-based names their consumers gave them."
    quote: "'Names are the means by which consumers take possession of wax-print textiles, creating meaning that does not exist when the textiles are designed and produced,' writes an art historian. So a print of curling stems titled 'Leaf Trail' by its Dutch designer became 'Good beads don't talk,' a Ghanaian proverb counseling that truly admirable people don't brag... 'Speed Bird,' a classic pattern of swallows in flight is 'Money Flies' in some parts of Ghana and 'Gossip Flies' in others... The cultural authenticity of cloth arises not from the purity of its origins but from the ways in which individuals and groups turn textiles to their own purposes. Consumers, not producers, determine the meaning and value of textiles."
canonical-instances:
  - "Dutch-manufactured wax prints, engineered around 1890 for a Javanese batik market that ultimately rejected them, were sold instead on the African Gold Coast, where consumers and cloth traders assigned each pattern a local proverb-derived name unrelated to the Dutch designer's own title -- 'Gramophone Record' became 'Cow Dung' among polygynous customers in the Ivory Coast, referencing the proverb that co-wife rivalry, like cow dung, looks calm on top but is sticky underneath -- and it is this local naming, not the Dutch design credit, that 'is as essential to the cloth's value as the designs themselves,' per a curator's Ghana fieldwork."
  - "Kente cloth, now understood as archetypally Asante and African, was constituted from its origin out of foreign material: eighteenth-century Asante weavers, per Danish merchant Ludewig Ferdinand Rømer's 1760 account, unraveled imported silk taffeta traded across the Sahara and Atlantic specifically to obtain colored thread they otherwise lacked, and the resulting double-heddle block pattern most likely originated with the neighboring Ewe before Asante weavers adopted and made it internationally famous under their own name."
critical-questions:
  - "Whose naming, ritual use, or re-contextualization are you actually measuring meaning by -- the original producer's stated intent, or the population that adopted and uses the artifact? These can diverge completely, as with wax prints, without either being simply wrong."
  - "Has the adopting population's re-use been stable and widespread enough to count as genuine re-authoring (generations of use, ritual significance, its own internal names and hierarchy), or is it one individual's idiosyncratic private use that hasn't displaced the original meaning for the broader adopting community?"
  - "Is someone invoking 'authenticity' to gatekeep who is allowed to use or claim the artifact -- and if so, whose interest does defining authenticity by origin rather than by use actually serve?"
severity-tier: info
status: active
