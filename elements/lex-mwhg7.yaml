canonical-instances:
  - "A support engineer feels highly competent handling tickets, each one closed the same day with no follow-up assigned to them — a colleague who owns tickets end-to-end for weeks discovers the same class of problem regularly resurfaces days later in a different form. The first engineer's confidence is real inside the scope they were given; it was never tested against the part of the problem that only shows up on a longer horizon."
  - "A junior analyst feels sure of a quarterly forecast because every past forecast they were assigned turned out close to actual — but they were only ever handed the easy, stable product lines, never the volatile ones a more senior analyst quietly kept for themselves. The junior's track record measures the scope they were protected inside, not their skill at the harder cases they never saw."
critical-questions:
  - "Is there a way to detect this scaffolding effect from inside the narrow scope, before it widens and forces the discovery — some signal a trainee or manager could check for (rate of never-revisited cases, average contact duration per problem) that would flag 'this confidence is scope-limited' without waiting for the scope to actually expand and the collapse to happen?"
  - "Does widening the scope always fully correct the false confidence, or can a person who has spent long enough inside a narrow, protected scope develop habits and self-image that resist correction even once the wider evidence is directly in front of them — the way the third-year student's sense of himself as 'in some respects, in company with an accredited practitioner' might persist past the point where continuity of care should have disabused him of it?"
