lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Public Opinion and Liberal Principles' (read before the Sixth Meeting of the Mont Pelerin Society, Venice, September 1954), Ch. 17 of Conjectures and Refutations (Routledge Classics, 2002), pp.469-471, Section 1, quoting Anthony Trollope, Phineas Finn, Chapter xxv. The quote is split with ellipses where the novel's own dialogue attribution ('said Mr Monk,--') interrupts a single continuous speech, and where a running head sits between 'almost as' and 'traitors' at the page break."
    quote: "'In one sense, yes. Such a debate and such a majority will make men think. But no;--think is too high a word; as a rule men don't think. But it will make them believe that there is something in it. Many who before regarded legislation on the subject as chimerical, will now fancy that it is only dangerous, or perhaps not more than difficult. And so in time it will come to be looked on as among the things possible, then among the things probable;--and so at last it will be ranged in the list of those few measures which the country requires as being absolutely needed. That is the way in which public opinion is made... The first great step was taken long ago... taken by men who were looked upon as revolutionary demagogues, almost as... traitors, because they took it. But it is a great thing to take any step that leads us onwards.'"
canonical-instances:
  - "A city council votes down a proposal to add protected bike lanes on a major arterial, and advocates treat the vote as pure defeat. But the debate has already reclassified the idea locally: council members who called it impossible to prioritize over car traffic before the hearing now call it merely expensive and disruptive right now -- the proposal has moved from impossible to difficult, and the next version, brought back in two years, starts the debate from that higher rung instead of from zero."
  - "An engineering team's proposal to rewrite a critical service in a new language is rejected in its first design review as reckless. A year later, after the same service causes an outage, nobody treats the idea itself as reckless anymore -- the argument has shifted entirely to timeline and staffing, which is exactly the kind of second-round argument Monk's ladder predicts: the idea has already been promoted from dangerous to possible, whether or not anyone credits the first failed proposal for the move."
critical-questions:
  - "Doesn't this just rationalize losing -- can any defeated idea claim it moved the needle? Popper's own text supplies the check: a few lines after quoting Monk's mechanism approvingly, he asks 'But did only the valid claims succeed?' -- the ladder describes a real social dynamic, that repeated debate shifts default classifications, but it says nothing about whether the idea deserved to rise. Use it to explain how a failed proposal can still gain ground with repetition; whether it deserved to is a separate question this mechanism cannot settle."
  - "What actually does the promoting, if not the soundness of the arguments? Popper's own diagnosis, drawn from the same material, is that it is usually a shift in moral sensitivity rather than a persuasive proof: 'it is not so much the truth of an assertion or the wisdom of a proposal that is likely to win for a policy the support of public opinion, as the feeling that injustice is being done which can and must be rectified.' The ladder tracks how urgent an injustice starts to feel with repetition and public airing, which is a separate question from whether the underlying policy claim is actually sound."
