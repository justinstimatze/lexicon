lineage:
  - source: primary
    text: merton-1957-selection-shapes-composition
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.64. Verified against the pdftotext extraction of the source PDF."
    quote: "'the criteria and procedures for selection of medical students have distinct sociological implication. They have the consequence of helping to shape the interpersonal environment which the school provides for each of its students. For, as the criteria of admission vary, manifestly the composition of the student body will vary. If the admissions committee in one school, for example, assigns prime importance to purely intellective qualities of students, the composition of students in that school will of course be skewed toward the upper reaches of intelligence. As a result, students of any particular degree of intelligence will find themselves in a distinctly different kind of environment of peers than would these same students in a school having a differing set of criteria for selection.'"
  - source: primary
    text: merton-1957-manifest-and-latent-function-of-selection
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education\" (1957), p.65."
    quote: "'it can be seen that the criteria and procedures for admission not only have the manifest function of selecting individuals more or less suited to the role of the physician, but also the indirect and latent function of producing a distinctive social environment for each student. In other words, procedures and criteria of selection not only involve the psychological consideration of the personal qualities of each individual student, but also the sociological consideration of the composition of the total student body.'"
canonical-instances:
  - "A startup that hires only for raw technical skill, ignoring collaboration style, ends up with an engineering culture that is uniformly abrasive in code review — not because any individual hire was a bad pick on the criteria used, but because the aggregate effect of many individually-defensible technical hires produced an emergent team culture no single hiring decision was evaluated against."
  - "A selective high school that admits solely on test score creates, as a side effect of thousands of individually fair admission decisions, an unusually homogeneous and intensely competitive peer environment — a student admitted on the same test score would experience a completely different daily environment at a school with broader admission criteria, even though their own individual qualification was identical in both cases."
critical-questions:
  - "If a selection criterion's composition effect is genuinely latent (unintended, unrecognized) at first, does an institution that discovers the effect and keeps the criterion anyway convert it into a manifest function — and does that change the ethical status of maintaining the criterion?"
  - "How would an institution actually optimize BOTH axes at once (individual fit and aggregate composition) when the criteria that best serve one can actively work against the other, e.g. maximizing individual scores versus deliberately admitting a heterogeneous class?"
status: active
