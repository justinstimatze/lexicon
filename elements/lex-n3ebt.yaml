name: reward-a-helper-first-then-arrange-their-betrayal-of-your-pursuer
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to cross a neutral party's territory or service ahead of someone pursuing you, don't just use that service and move on -- pay for it generously and specifically, then use the trust you've just purchased to arrange for the same service to betray your pursuer when they arrive asking for the identical help. In Eastman's telling, a young man fleeing with his lover reaches a river with no way across, and asks two Cranes to bridge it with their necks, offering real, specific payment in advance: 'I will give to each of you a fine ornament for your breast, and long fringes on your leggings, so that you will hereafter be called the handsomest of birds!' Only after the Cranes have accepted this reward and helped him does he ask for the second, decisive favor: 'If an old woman should come down to the river and seek your help, place your heads together once more as if to allow her to cross, but when she is half way over you must draw back and let her fall in mid-stream.' The Cranes have no independent reason to side with the fleeing pair over the pursuing grandmother -- they're a neutral service, willing to help whoever asks -- but having already been paid and befriended by the young man, they have every reason to keep that relationship rather than gamble on an untested stranger who hasn't offered them anything yet. When the grandmother arrives and orders them around rudely, expecting the same neutral service, they instead perform the trap exactly as arranged. Diagnostic move: when you need a neutral party's help to escape or outmaneuver someone chasing you, don't just use their service transactionally -- invest genuinely in that relationship first, then use the goodwill you've built to convert what looks like an impartial service into a specific trap for whoever comes looking for you next, since the neutral party's incentive to protect an existing, rewarded relationship usually outweighs whatever a stranger might offer on the spot."
