id: lex-cpgyd
name: principle-of-similitude-shifts-feasibility-with-scale
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When extrapolating a small-scale result to large scale, surface the principle of similitude: scaling shifts which forces dominate (surface vs volume, friction vs inertia) — what's feasible at one scale may be infeasible at another, and vice versa."
related: [lex-ds73b, lex-3ydmv, lex-axa6h, lex-vtytt, lex-wup2r, lex-yyfx5]
scaffolds-from: [lex-ds73b]
evokes: [galileo-square-cube, surface-grows-as-square-volume-as-cube, ants-can-carry-50x-but-elephants-cannot, on-being-the-right-size, dynamical-similarity, geometrically-similar-bridge-the-larger-is-weaker, scale-up-breaks-the-design]
lineage:
  - source: primary
    text: Thompson-1917-OnGrowthAndForm
    citation: "D'Arcy Wentworth Thompson, *On Growth and Form* (Cambridge UP 1917, 1st ed.), Ch.II 'On Magnitude'. Thompson's foundational claim: as a system's linear dimension L grows, properties scale by different powers of L (surface ~L², volume ~L³, mass ~L³, structural cross-section ~L², metabolic rate scales sub-linearly with mass) — so the structural and physiological *feasibility* of any given configuration changes systematically with size. A configuration viable at one scale becomes infeasible at another, in predictable directions: large animals need disproportionately thick bones; small animals dominate by surface-mediated processes (cooling, diffusion, capillary forces); tall structures need different critical schemes than short ones. Thompson traces the principle back to Galileo 1638 (timber-strength discourse) and credits Herbert Spencer for first applying it to biology systematically. The transferable claim is NOT just 'things scale' but: *each system has a feasibility-window in size-space, and crossing the window's edges forces redesign*."
    quote: "[Thompson 1917 Ch.II 'On Magnitude' pp.16-25:] 'We are taught by elementary mathematics that, in similar solid figures, the surface increases as the square, and the volume as the cube, of the linear dimensions. [...] the effect of scale constitutes what is known as the principle of similitude, or of dynamical similarity. [...] The strength of an iron girder obviously varies with the cross-section of its members, and each cross-section varies as the square of a linear dimension; but the weight of the whole structure varies as the cube of its linear dimensions. And it follows at once that, if we build two bridges geometrically similar, the larger is the weaker of the two. It was elementary engineering experience such as this that led Herbert Spencer to apply the principle of similitude to biology.' [Corrected 2026-08-19: this sentence previously read 'the strength of a beam, as Galileo was the first to point out, varies as the square of a linear dimension' -- the real text has no Galileo clause here and says 'iron girder ... cross-section of its members' rather than 'beam.' Thompson's actual Galileo-attribution sentence sits several sentences later in the same passage ('But it was Galileo who, wellnigh 300 years ago, had first laid down this general principle which we now know by the name of the principle of similitude') -- the claim that Thompson credits Galileo is still true, it was just welded into the wrong sentence here. Verified exact against the source text (a footnote-marker asterisk sits mid-sentence after 'the two' in the source, which defeats an automated exact-substring check on this span -- not a content defect).] [Practitioner-extraction: the principle is not 'big is hard' but the precise structural-claim that load-related quantities and support-related quantities scale by different powers of L, so the same geometric design has a feasibility-window outside of which redesign is forced. The transferable form: for any structural-or-functional configuration, identify the load-scaling and support-scaling powers; the gap between them defines the feasibility-window.]"
  - source: practitioner
    text: cross-domain-similitude-attestation
    citation: "Cross-domain attestation: (a) Galileo 1638 *Discorsi e Dimostrazioni Matematiche, intorno a due nuove scienze* (Two New Sciences), Day 2 — the founding statement of the principle of similitude applied to timber strength and animal bones. Galileo's giant-bones argument (giants would need disproportionately thick bones, eventually unfeasibly so) is the canonical substrate-statement. (b) J.B.S. Haldane 1926 'On Being the Right Size' (essay) — the classic popular generalization: 'For every type of animal there is a most convenient size, and a large change in size inevitably carries with it a change of form.' Haldane derives the consequences for surface-tension-bound organisms (an insect can walk on water; a man cannot), terminal-velocity considerations (a mouse falling down a thousand-yard shaft is killed only by shock; a man, a horse, a horse-sized creature, killed differently), metabolic-cooling problems. (c) Max Kleiber 1932 'Body size and metabolism' *Hilgardia* 6(11):315-353 — the canonical empirical attestation in biology: basal metabolic rate scales as M^0.75 across mammals (Kleiber's law). The exponent 3/4 (vs. naive surface-area 2/3) became foundational metabolic-scaling literature. West, Brown, Enquist 1997 'A general model for the origin of allometric scaling laws in biology' *Science* 276:122-126 derives 3/4 from fractal-vascular-network constraints. (d) Urban-scaling: Bettencourt, Lobo, Helbing, Kühnert, West 2007 'Growth, innovation, scaling, and the pace of life in cities' *PNAS* 104(17):7301-7306 — city infrastructure scales sub-linearly with population (N^~0.85, economies of scale); creative output and crime scale super-linearly (N^~1.15). Same principle-of-similitude logic applied to urban systems. (e) Engineering similarity-analysis: Buckingham 1914 pi-theorem (lex-ds73b dimensional-analysis primary) is the methodological tool; the structural-consequence (feasibility-shifts-with-scale) is the substantive claim. Reynolds-number regimes for fluid flow: laminar at small scales, turbulent at large; the same fluid behaves qualitatively differently across scales. (f) Firm-size economics: as firms grow, coordination-costs scale faster than coordination-benefits (Coase 1937 transaction-cost theory implies a firm-size limit). Boundary set by where marginal-coordination-cost equals marginal-coordination-benefit. (g) Software architecture: monolithic systems hit a scale where coupling-cost exceeds modularity-gain; microservices, sharding, eventual-consistency are the redesigns forced by the scale-crossing. (h) Vehicle design: a child's tricycle is structurally feasible at child-scale; scale linearly to truck-size and it collapses under its own weight. Truck design IS the redesign that the scaling forces."
    quote: "Transferable scope: applies wherever a system has both load-related and support-related quantities scaling by different powers of size. Operational diagnostic: (1) identify the scaling-exponents — what quantity grows as L^a and what as L^b? (2) the feasibility-window is the size-range where the design-margin between them remains positive. (3) crossing the edge of the window forces redesign — usually toward a configuration with different support topology (e.g., thicker proportions, hollow vs solid, branched vs unitary). The atom is NOT about 'units must balance' (that's lex-ds73b dimensional-analysis); it is about the structural-consequence: as you change scale, the configuration's feasibility-margin changes systematically, and at some point the design-window closes. Critical companion: lex-ds73b dimensional-analysis is the methodological tool (units-checking, dimensionless groups); lex-cpgyd is the substantive claim (feasibility-window-shifts-with-scale). [synthesis 2026-05-25]"
canonical-instances:
  - "Thompson 1917 Ch.II (canonical-case): Galileo's giant-bone argument as taught by Thompson. 'The strength of a beam varies as the square of a linear dimension; but the weight of the whole structure varies as the cube.' Geometrically-similar bridges: the larger is the weaker. Geometrically-similar bones: the larger animal needs disproportionately thick bones to support its disproportionately greater weight. Galileo's giant in *Two New Sciences* Day 2 is the canonical illustration: a giant scaled up isotropically from human proportions could not stand."
  - "J.B.S. Haldane 1926 'On Being the Right Size': 'For every type of animal there is a most convenient size, and a large change in size inevitably carries with it a change of form.' Surface-tension-bound organisms vs gravity-bound ones; terminal-velocity differences across scales; cooling-surface vs heat-generating-mass tradeoffs. The classic popular statement of the atom's transferable form."
  - "Kleiber 1932 metabolic-scaling law: basal metabolic rate B ∝ M^0.75 across mammals — empirical attestation of sub-linear metabolic scaling. The 3/4 exponent (rather than naive surface-area 2/3) is itself transferable: it predicts that large animals have lower mass-specific metabolic rate, longer lifespans, slower heart-rates (heart-beats per lifetime is roughly constant across mammals — a transferable invariant)."
  - "Urban-scaling (Bettencourt-West 2007): city infrastructure ∝ N^0.85 (sub-linear: bigger cities use proportionally less infrastructure per capita); socio-economic output ∝ N^1.15 (super-linear: bigger cities produce disproportionately more inventions, wages, crime). Same similitude logic — different quantities scale by different exponents — produces predictable size-feasibility predictions for urban systems."
  - "Reynolds-number regimes in fluid flow: Re = ρvL/μ — at small Re (small L or v) flow is laminar; at large Re flow is turbulent. The atom's transferable form here: same fluid-substance behaves qualitatively differently across scales because viscous-forces and inertial-forces scale differently with L."
  - "Firm-size limits in economics (Coase 1937 implication): coordination costs scale super-linearly with firm size while coordination benefits scale sub-linearly; firm-size is bounded where they cross. The transition from monolithic firm to network-of-firms is the redesign forced by the scale-crossing."
  - "Software architecture transitions: monolithic codebases hit a scale where coupling-cost outstrips modularity-gain; microservices / sharding / eventual-consistency are the structural redesigns forced by the scale-crossing. Same principle-of-similitude logic: load-related quantities (request volume, data size) scale faster than support-related (developer-attention bandwidth, single-machine memory)."
  - "Vehicle / structural-engineering: a tricycle is structurally feasible at child-scale; scale linearly to truck-size and it collapses under its own weight. Truck design IS the redesign — frame topology shifts from open-tube tricycle to ladder-chassis-with-suspension. Not a continuous-redesign but a discrete-topology-change forced by the scale-crossing."
  - "operationally distinct from lex-ds73b dimensional-analysis: lex-ds73b is the METHODOLOGICAL tool (units-checking, Buckingham π — vetoing wrong forms). lex-cpgyd is the SUBSTANTIVE claim (feasibility-window-shifts-with-scale — predicting redesigns). lex-ds73b is local skill; lex-cpgyd is global structural claim. They compose: use lex-ds73b to find the scaling-exponents; use lex-cpgyd to predict the feasibility-window and the redesigns forced at its edges."
  - "operationally adjacent to lex-3ydmv fermi-estimation: fermi-estimation often implicitly relies on cross-domain scaling assumptions (population × per-capita-rate). lex-cpgyd names the specific structural-mechanism that makes scaling matter — the load/support exponent gap — beyond fermi's decomposition-style use."
  - "operationally distinct from lex-axa6h order-of-magnitude-approximation: lex-axa6h is about getting the NUMERIC magnitude right (factor of 10 is fine); lex-cpgyd is about the STRUCTURAL prediction (which exponents apply, where the feasibility-window closes). lex-axa6h is value-finding; lex-cpgyd is regime-classification."
  - "cross-pair with lex-wup2r gnomonic-growth-produces-self-similar-form: both are Thompson 1917 atoms, both name how physical/geometric constraints shape biological/structural form. lex-cpgyd is about the FEASIBILITY-WINDOW of any given configuration; lex-wup2r is about the FORM PRODUCED when growth is gnomonic. They compose: gnomonic growth (0311) produces forms whose feasibility-windows shift (0310); the equiangular-spiral form solves the otherwise-incompatible demands of growing-without-changing-shape under similitude constraints."
critical-questions:
  - "is the principle predicting redesign-forcing, or merely diminishing returns? The atom's strong form predicts qualitative structural-topology changes at feasibility-window edges. The weak form predicts only diminishing returns (more bone needed for slightly bigger animal). Discriminator: at the threshold, does the configuration change KIND or merely DEGREE? Mammal-bones scale up smoothly within a kind; the transition to whale-skeleton (water-supported, gigantic) is a kind-change. Both happen; the atom names the qualitative-change case primarily."
  - "what are the scaling-exponents in the specific domain? The atom's application requires identifying the relevant exponents. Surface vs volume (L² vs L³) is the canonical pair; metabolic-rate vs mass (M^0.75) is the empirical Kleiber pair; brain vs body mass shows allometric exponent ~0.7 across mammals (encephalization-residuals are the substrate of comparative-intelligence claims). Without knowing the exponents, the atom is generic; with them, it predicts specific feasibility-windows."
  - "is fractal-scaling the right model, or is geometric scaling sufficient? Some systems (vascular networks per West-Brown-Enquist 1997) require fractal-network analysis to derive the empirical exponents; others (rigid-bone scaling) work with simple geometric scaling. Diagnostic: does the system have a self-similar internal structure that fills space (fractal — fluid-distribution networks, branched trees), or is it a discrete rigid configuration (geometric — bones, beams)? The exponent calculation differs."
  - "what counts as 'redesign' vs continuous change? The atom predicts that at feasibility-window edges, the configuration changes topology. Discriminator: identify the topological-features (number of supports, branching pattern, hollowness, segmentation); if these change qualitatively across the scale-transition, the atom's strong form fires. If only magnitudes change, the weak form fires. Both are valid applications."
  - "does the atom apply to social-organizational systems as well as physical? Yes, with caveats. The Coase-firm-size argument, urban-scaling, software-architecture transitions, organizational-bureaucracy-emergence all instantiate the same principle: load-related quantities (coordination demands) and support-related quantities (coordination capacity) scale differently, defining a feasibility-window. The exponents are messier (not pure geometric) but the structural-logic is the same. Use cautiously: don't claim mathematical-precision in social applications where the exponents are empirically uncertain."
