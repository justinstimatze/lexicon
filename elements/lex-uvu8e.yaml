id: lex-uvu8e
name: identical-wealth-is-judged-by-whether-its-source-is-outside-the-group
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "In a community that implicitly treats the total available good as fixed, the exact same increase in one member's wealth or fortune gets judged completely differently depending on whether its source can be traced to outside the group's bounded economy -- not on the amount, not on how it was acquired, but purely on whether the gain can be read as having come from somewhere that doesn't subtract from anyone inside the circle. Anthropologist George Foster's 1965 essay on 'the image of limited good' explains much otherwise-puzzling peasant behavior this way: in a closed community, if one neighbor suddenly gets richer, the assumption is that someone else, or the group as a whole, must have gotten correspondingly poorer. But 'peasants do not feel ripped off if one of their number becomes richer as a result of selling labor as a migrant worker, for it is clear that wages so earned come from across the border.' The same forgiveness extends to any gain read as a 'gift of Fortune' arriving from outside the community's internal accounting entirely: 'a rich gentleman gave a poor boy a violin,' a man 'hit upon a hidden treasure,' someone 'lucky enough to win in the lottery.' Diagnostic move: when a community reacts with resentment to one member's sudden gain but not to another's identical gain, don't assume the difference is about fairness of process or amount -- check whether the accepted gain has a legible external source (a border crossed, a stranger's gift, a lottery) while the resented one looks like it might have been drawn from the same internal pool everyone else depends on."
