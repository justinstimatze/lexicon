evokes: [merton-1957, berelson-lazarsfeld-mcphee-1954-voting, elmira-study, breakage-effect, pari-mutuel-analogy, cross-pressures, primary-group-as-insulating-layer]
lineage:
  - source: primary
    text: merton-1957-elmira-divided-vs-solid-primary-groups
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. IX 'Continuities in the Theory of Reference Groups and Social Structure,' pp.333-334, quoting Bernard R. Berelson, Paul F. Lazarsfeld and William N. McPhee, Voting: A Study of Opinion Formation in a Presidential Campaign (Chicago: University of Chicago Press, 1954), pp.98-101. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'When the primary group of friends or co-workers is united in political opinion, then the respondent's vote is firm. When Democratic primary groups are \"solid,\" the party vote is not significantly lower than for \"solid\" Republican groups (i.e., each side loses only about 12 or 15 per cent in deviations). The strong community majority for the Republicans has little effect because it has little access to persons within homogeneous Democratic groups. But when the primary environment is internally divided the effect of the distant community can be seen... The impact of the larger community is thus most evident among voters with discordant or disagreeing primary groups. When the voter's close associates do not provide him with a single, clear political direction-when instead they offer an alternative-then wider associations in the surrounding community reinforce one position over the other.'"
  - source: primary
    text: merton-1957-breakage-effect
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), Ch. IX, p.334, same source, continuing directly."
    quote: "'In general, then, the Republicans get more than their random share of the adjustment to a conflicting environment, because of the pervasive Republican atmosphere of Elmira that thus tends to perpetuate itself. The surrounding majority gets the benefit of the operation of cross-pressures. One might call this the \"breakage\" effect, borrowing a term from horse-racing circles... the breakage in small-group adjustment goes to the Republican community. At any one moment the breakage may be trivial, as it is at the track; but over a period of time it is considerable.'"
canonical-instances:
  - "A new hire whose close work friend group unanimously holds one opinion about a company controversy stays firm in that opinion regardless of what the rest of the office thinks; a new hire whose two closest friends at work disagree with each other ends up drifting toward whatever the broader office consensus is — same person, same broader environment, different outcome purely because of internal agreement within the small circle."
  - "A community organizer trying to shift opinion in a town dominated by one political culture gets far more traction by first splitting a handful of currently-unanimous friend groups (introducing even one dissenting voice into each) than by running ads aimed at persuading individuals directly — the split, not the argument, is what opens the door for the surrounding majority (or the organizer's own message, if it can establish local footholds) to do the converting."
critical-questions:
  - "Does the 'breakage' always flow toward whichever opinion is already dominant in the surrounding community, or could an emerging minority position ever capture the breakage instead — for example, if the minority position controls other channels of influence (media, institutional prestige) that reach discordant primary groups more effectively than the numerical majority does?"
  - "The Elmira finding measures political voting specifically — how far does this generalize to non-political decisions (a jury with a divided friend-group backdrop, a family split on a purchase decision, employees divided on a workplace policy) where 'the surrounding community' might mean something looser than a town's known partisan lean, and does the mechanism require the surrounding majority to be as stable and legible as Elmira's Republican atmosphere was?"
