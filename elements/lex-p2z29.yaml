lineage:
  - source: primary
    text: cushing-gopher-relay-brothers-simulate-one-tiring-racer
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Gopher Raced with the Runners of K'iakime.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'The means by which I shall be distinguished as a racer will be a red plume tied to my head. Do you also procure a red plume and tie it to your head. When you hear the thundering of the feet of the racers, run out and show yourself for a minute, and rush into the other hole as fast as you can. ... this cunning brother had provided himself with a little water which he rubbed over his fur and made it all muddy, as though he were perspiring and had already begun to grow tired ... the most bedraggled and worn out of all the Gophers. ... the original old Gopher ... wallowed about in the dirt until he was well plastered with mud, half closing his eyes, and crawled out before the astonished multitude at the end of the goal, a sorry-looking object indeed, far ahead of the runners.'"
canonical-instances:
  - "A cycling team suspected of doping stations look-alike riders in identical kit at checkpoints along a long solo route, each one showing visible fatigue slightly worse than the last, so that officials spot-checking at each checkpoint see a single rider's plausible physical decline rather than a series of substitutions."
  - "An online seller with hundreds of accounts stages 'customer' reviews that arrive over weeks showing escalating enthusiasm and wear-testing detail, as though one persistent long-term user were reporting in, when each review actually comes from a different account timed to simulate one person's evolving relationship with the product."
critical-questions:
  - "What would it have taken for the runners of K'iakime to detect the substitution given the stipulated check, seeing the Gopher surface periodically -- is there any spot-check design that resists a coordinated team willing to fake gradual decline, or does any interval-based check fail against this exact tactic?"
  - "Does the trick depend on the brothers being literally indistinguishable to a human observer, or would a merely similar appearance combined with the expectation of continuity (the crowd wanting to believe it's the same Gopher) have been enough on its own?"
  - "Is faking exhaustion a meaningfully different tactic from simply faking presence, or is the added decline detail decorative -- would the runners have been just as fooled by six equally fresh-looking Gophers popping up along the course?"
