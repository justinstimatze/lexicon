id: lex-894qg
name: an-escorts-own-standing-secures-what-unaccompanied-pleading-could-not
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "The same request, made in the same words, can fail from an ordinary petitioner and succeed instantly when a well-regarded third party simply accompanies the petitioner to the same source — the wording stays fixed while the variable that actually moves the outcome is whose relationship just entered the room. In the Jataka's tale of the sick Brothers, attendants who begged for dainty food in the Cooks' quarters were turned away empty-handed; the Elder Sariputta, meeting them, takes them to the very same street himself: '\"Come then with me,\" said the Elder, and took them to the very same street. And the people there gave him a full measure of dainty fare.'"
related: []
evokes: [jataka, catukkanipata, mamsa-jataka, an-escort-changes-the-outcome-not-the-words, the-same-request-succeeds-only-with-standing-attached]
lineage:
  - source: primary
    text: jataka-chalmers1895-mamsa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 315, Mamsa-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Come then with me,\" said the Elder, [49] and took them to the very same street. And the people there gave him a full measure of dainty fare."
canonical-instances:
  - "A junior employee's request for a vendor discount gets a form-letter no; the same request, made by a senior partner who simply walks the junior employee into the vendor's office, gets approved on the spot with no change in what's actually being asked."
critical-questions:
  - "Does this actually help the unaccompanied petitioner in the long run, or does it just relocate the dependency — they still can't get the same result without borrowing someone else's standing next time?"
  - "What does it cost the escort to lend their standing this way, and would they extend the same favor to a stranger rather than someone they already know and vouch for?"
status: active
