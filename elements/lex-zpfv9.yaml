id: lex-zpfv9
name: scale-with-compute-methods-eventually-outperform-handcrafted-domain-knowledge
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When designing systems that will operate at GROWING compute budgets, prefer general methods that scale with compute (search and learning) over hand-encoded domain knowledge. Sutton's bitter lesson: across 70 years of AI research, in every domain where the contest played out long enough (chess, Go, speech recognition, computer vision, NLP), the method that won in the long run was not the one that encoded what researchers thought they knew about how minds work in the domain. It was the method that scaled cheaply with more compute — typically some flavor of large-scale search, large-scale learning, or both — applied with as little domain-specific structure as possible. Handcrafted-knowledge approaches DO win in the short term (you get a measurable gain immediately) and are personally satisfying to the researcher (it feels like understanding the domain), but plateau in the medium term and actively INHIBIT further progress, because the human-knowledge encoding complicates the system in ways that make it harder to swap in the eventually-cheaper compute-scaling approach. The lesson is BITTER because the winning approach feels less smart and less human-centric than the carefully-crafted system it replaces — researchers who lose to it tend to dismiss the win as 'brute force' rather than digest the methodology shift. The principle is transferable beyond AI: in any system where the cost of compute (or any quasi-compute resource like storage, bandwidth, or labeling) is dropping over the relevant horizon, expect hand-tuned domain encoding to be a short-term local maximum that the eventually-cheaper compute-scaling approach will displace. Practitioner discipline is two-part. FIRST: when choosing between an immediate-gain handcraft approach and a longer-horizon compute-scaling approach, weigh the time-horizon against the compute-cost trajectory; if compute will be ≥10× cheaper before the project's value is realized, the handcraft is paying for itself in the short window only. SECOND: when encoding domain knowledge into a system, ask which parts are STRUCTURE (minimal, problem-symmetry-matched architectural choices — lex-xrbzz) and which are CONTENT (encoded human intuitions about what answers should look like) — keep the structure, strip the content, and let search/learning fill in the content from the data."
