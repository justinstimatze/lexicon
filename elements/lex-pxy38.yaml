id: lex-pxy38
name: an-emerging-orders-practice-reads-as-theft-to-the-order-it-displaces
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When one economic or social order is giving way to another, the rising order's normal, unremarkable practices don't get judged by their own internal standards -- they get judged by the older morality's categories, which were never built to accommodate them, so what the new order considers ordinary commerce, the old order genuinely experiences and names as immoral theft. Hyde, drawing on Norman O. Brown's Hermes the Thief, locates this in the transition from Greek agrarian aristocracy to Athenian mercantile democracy: 'The older morality took any deviation from \"the archaic form of commerce by mutual exchange of gifts\" to be an immoral thieving (even what we would now call fair trade was taken to be robbery).' The mechanism isn't that the rising traders and artisans were secretly doing anything wrong by their own lights; it's that the vocabulary available for judging them belonged entirely to the order being displaced, a vocabulary in which any exchange outside kin-based gift-circulation counted as violation by definition, regardless of its actual fairness. Diagnostic move: when a rising economic, professional, or social practice is being condemned in the vocabulary of theft, corruption, or impropriety, check whether that vocabulary was built by and for the order the new practice is displacing -- a genuinely new form of legitimate exchange will often look identical to theft from inside a moral system that has no category for it, so the accusation of theft is sometimes evidence of a category gap, not evidence of an actual violation."
related: [lex-p7953]
evokes: [hyde-trickster-makes-this-world-hermes-slips-the-trap, norman-o-brown-hermes-the-thief, fair-trade-taken-to-be-robbery, themis-versus-acquisitive-individualism]
lineage:
  - source: primary
    text: hyde-brown-rising-mercantile-practice-read-as-theft-by-agrarian-morality
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' drawing on Norman O. Brown, Hermes the Thief (1947), on the transition from Greek agrarian kinship morality to sixth-century Athenian mercantile democracy. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Most important, the emerging cosmopolitan democracy brought with it a “new ethics of acquisitive individualism [that] conflicted with the traditional morality which the Greeks called Themis—the body of customs and laws inherited from the age of familial collectivism.” The older morality took any deviation from “the archaic form of commerce by mutual exchange of gifts” to be an immoral thieving (even what we would now call fair trade was taken to be robbery)."
canonical-instances:
  - "Early stock traders and moneylenders in a society still organized around land-based hereditary wealth are condemned as usurers and swindlers by an aristocratic morality that has no legitimate category for wealth created through financial instruments rather than inherited soil, even when the trading itself is transparent and mutually agreed."
  - "Independent contractors and gig workers in an economy still organized around the norms of lifetime employment are described by older institutions as exploiting loopholes or avoiding real commitment, when they are simply operating inside a genuinely new labor arrangement that the older employment morality's vocabulary was never built to recognize as legitimate."
critical-questions:
  - "How would you distinguish a genuine category gap (the old morality simply has no honest category for the new practice) from a case where the new practice really is exploitative and the old morality's condemnation, however differently motivated, happens to be correct?"
  - "Is this framing too convenient for defenders of any rising economic practice, since 'you just don't understand the new paradigm' can be used to wave away legitimate objections to genuinely harmful new arrangements (predatory lending, exploitative gig platforms) as easily as it explains genuinely unfair old prejudices?"
  - "Brown's historical account is itself contested (Hyde notes it 'gives off an air of retrospective Marxism') -- does the general pattern depend on this specific Greek case being historically accurate, or does it stand independently as a structural claim about any moral-vocabulary transition?"
status: active
