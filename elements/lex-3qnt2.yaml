id: lex-3qnt2
name: power-is-finite-game-strength-is-infinite-game-and-grows-when-shared
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When evaluating an actor's capacity (an engineer, manager, researcher, maintainer, teacher, parent, institutional leader, polity), distinguish POWER (the finite-game capacity) from STRENGTH (the infinite-game capacity) — they are operationally distinct in measurement, time-orientation, sharing-behavior, and durability. Carse 1986 §§27-31 establishes the transferable distinction. POWER is comparative-measurable winning-capacity within a bounded play. It is finite, positional, and zero-sum within the play — more power for you means less for me. It is BACKWARD-LOOKING — to speak meaningfully of power is to speak of past finite-game outcomes (titles won, races won, positions secured). It is THEATRICAL — power depends on audience deference to the title; if the deference is withdrawn, the power evaporates. It DIMINISHES WHEN SHARED OR CHALLENGED — a title given away is a title lost; a power-position contested is a power-position weakened. It is RESTRICTED to a relatively small number of selected persons. Power-claims have the diagnostic shape 'I-have-X-because-I-won-Y' — a backward-looking attribution-of-past-victory. STRENGTH is open-ended capacity to extend play, bring others in, and allow others their own play. It is INFINITE, NON-COMPARATIVE, and PARADOXICAL — Carse §29: 'I am not strong because I can force others to do what I wish as a result of my play with them, but because I can allow them to do what they wish in the course of my play with them.' It is FORWARD-LOOKING — strength is 'an opening and not a closing act' (Carse). It is NON-THEATRICAL — strength does not require audience deference; it operates whether or not it is acknowledged. It GROWS WHEN SHARED — the strong person who develops capacity in others is strengthened by the others' growth, not diminished. It is OPEN TO ANYONE — Carse §29: 'Anyone can be strong.' Strength-claims have the diagnostic shape 'I-can-make-this-continue-and-extend-into-the-future-while-allowing-others-their-own-play' — a forward-looking capacity-attribution. The practitioner-discipline is three-part. FIRST: NAME which capacity-type you are evaluating. Diagnostic prompt — is this capacity backward-looking (past wins, accumulated titles, current position) or forward-looking (ability to keep the play going, to extend the work past the actor's tenure)? Power answers backward; strength answers forward. SECOND: NAME which capacity-type you are DEVELOPING in yourself. Most professional development structures (promotion ladders, publication metrics, prize cascades, the open-source ego-economy) are structurally power-development — they reward the backward-looking comparative-measurable winning-capacity. Strength-development requires deliberate counter-investment because the institutional rewards do not flow to it. THIRD: when you have a choice between accumulating power and developing strength (a frequent practitioner choice: take the credit yourself or distribute it; control the decision yourself or develop the team's decision-making; ship the impressive feature yourself or grow the engineers who will ship many features), recognize that the FINITE-GAME framing tells you to take power and the INFINITE-GAME framing tells you to develop strength. They are opposite moves. The atom does NOT advise that power is bad; power is the appropriate capacity-type for finite games, and finite games are real. It advises noticing which capacity-type your current situation calls for and CHECKING whether the finite-game-default that institutional reward systems push is actually fit-for-the-situation. In any context that is structurally infinite (career-as-life's-work, research-as-knowledge-tradition, institution-as-durable-entity, parenting-as-developing-an-independent-adult, democracy-as-deliberative-substrate), strength is the critical capacity and power is the structural temptation that hollows out the underlying play. Transferable instances include the senior engineer who builds her team's capacity vs the one who ships impressive solo features (both have a 'powerful' CV; one has actually developed strength); the manager who develops successors vs the one who centralizes decisions; the researcher who keeps the questions productive past her active career vs the one who corners citations; the OSS maintainer who designs governance for succession vs the BDFL who can never relinquish control; the politician who preserves the conditions of public deliberation vs the one who wins by destroying them. Lex-0619 is the orientation choice (finite vs infinite); lex-3qnt2 is the corollary capacity-typology (power as finite-game capacity vs strength as infinite-game capacity). They compose: orientation choice determines which capacity-type the practitioner develops, and the capacity-type developed reinforces the orientation."
