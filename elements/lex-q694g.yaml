id: lex-q694g
name: duration-earns-no-immunity-against-a-single-violation
type-in: state
type-out: process
_tier: atomic
agent-instruction: "At Twofold Bay on Australia's south coast, Yuin people and orcas ran a hunting partnership that predated European contact and outlasted it. Recorded by ethnographer R.H. Mathews: when a pod of killer whales was chasing a whale toward shore, an old man lit fires and mimed being lame to signal them, calling them to drive the whale in; the orcas beached it, the people killed it, and the orcas got their share. The relationship survived contact -- it was even folded into the 19th-century commercial whaling station at Twofold Bay, still running under new economic terms, still generations deep. It ended in an afternoon. A disgruntled European whaler, who had no stake in the tradition and nothing to lose by breaking it, shot the lead killer whale. The orcas never came back. The relationship's whole multi-generational history bought it nothing against that one act. Duration measures how long trust has accumulated while it holds; it says nothing about how much force it takes to end. That's set by who can end it and what they'd lose by doing so. A single violator with no stake in the reciprocity's future faces no such cost, and can end in one move what took every prior participant generations to build. Diagnostic move: before treating a long-running cooperative arrangement as durable because of its age, check who could unilaterally end it and whether that person's stake in its continuation matches everyone else's -- age protects a relationship only for as long as everyone with the power to break it also needs it to keep working."
