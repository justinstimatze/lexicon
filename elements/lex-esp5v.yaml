id: lex-esp5v
name: mutual-insincere-flattery-lets-both-parties-extract-a-shared-resource
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Two parties who each want something from the other can trade insincere flattery back and forth, with each fully aware the praise is manufactured, because the exchange itself produces the material benefit both are actually after regardless of whether either believes a word of it. In the Jataka's tale of the mutual flatterers, a jackal praises a crow perched in a fruit tree, hoping for scraps, and the crow praises the jackal right back: 'Who is it sits in a rose-apple tree-- Sweet singer! whose voice trickles gently to me? Like a young peacock she coos with soft grace, And ever sits still in her place.' The crow shakes down fruit in response. Neither animal's praise was ever about the other's actual qualities. It was the price of admission to a shared meal."
