id: lex-ttaq9
name: loss-without-clear-closure-produces-frozen-grief-resistant-to-normal-mourning-rituals
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When grief or mourning is not resolving despite time and ritual, suspect ambiguous loss — Boss's 1999 concept naming the loss-form that lacks the physical or psychological closure normal mourning requires. Two types: (1) Physically absent / psychologically present — a person whose status (alive or dead, returning or not) cannot be determined; missing soldiers, kidnapped children, divorced parent no-longer-in-the-home but still psychologically present, immigrants leaving behind family they may never see again, biological parents of adopted children. (2) Physically present / psychologically absent — Alzheimer's patient still alive but no longer the person they were; addicted family member; severely depressed partner; spouse 'always at the office'; head-injury survivor who 'woke up a different person.' In both types, normal mourning rituals (funeral, naming the loss, public acknowledgment, sympathy-from-community) do not apply because the loss itself is not socially recognized as a loss. The result is frozen grief — the bereaved cannot move forward because the loss has no completion-marker. Transferable diagnostic: when a person or family seems stuck in unresolved-ongoing-suffering disproportionate to the time elapsed, ask whether the loss has the structural features of ambiguity (no body / no closure / no acknowledgment / no completion-marker). The fix is NOT to push toward closure that may not be available, but to name the loss itself as ambiguous, normalize the both-and emotional state (grieving AND not-yet-fully-grieving, hoping AND fearing), and develop coping practices that don't depend on resolution. Generalizes beyond family bereavement to: job loss without a clean ending (laid off vs fired vs ghosted; contractor whose contract just stops being renewed); estranged relationships without confrontation or reconciliation; the no-return-from-an-illness with no death; the loss of a community that disperses rather than ends; the disappearance of a discontinued tradition or cultural form that no one mourns because no one acknowledges it ended. The substrate claim: ambiguity in the loss-event itself blocks the normal completion-pathways of grief; recognition-of-ambiguity is the substitute for unavailable closure."
