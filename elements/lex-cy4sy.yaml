name: personal-stake-in-the-friction-produces-the-fix-proposal
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When you're trying to explain why a particular person, rather than someone else equally positioned to notice the same problem, was the one who actually proposed a fix, check whether the change would also personally relieve friction in THEIR OWN work — proposals for organizational improvement disproportionately originate from people who stand to benefit directly, not from people motivated purely by concern for the whole. Goss traces this precisely in a case where a consultant proposed replacing individual instruction with group lectures: 'staff members frequently had an additional personal stake in seeing a particular condition changed. For, if the potential alteration involved some aspect of their own work, it generally meant that the task would subsequently go more smoothly.' The consultant's own reasoning, as she reconstructs it: 'there was no need to repeat the same information many times; much of it could be communicated through lectures which all students might attend. By giving lectures to the group, that is, he would have more time available for consulting on special problems, he would avoid the dreary chore of repeating basic principles to each individual student, and he would be sure, nevertheless, that students obtained the requisite information.' Her conclusion generalizes past this one case: 'Through this change, the consultant benefited personally — and, one may presume, so also did the Program as a whole. That he was motivated to suggest the alteration in the first place is not, therefore, surprising. Nor is this an isolated instance. Many times suggestions for changes came from the very people who were experiencing particular problems in the course of their work which, they felt, would be more satisfying or efficient if their proposed modification were adopted.' The mechanism is not cynical — Goss explicitly notes the organization benefited too — it is diagnostic: personal stake doesn't corrupt the proposal, it EXPLAINS why this particular person, and not another equally well-positioned observer, was the one who actually did the work of noticing and articulating the fix. Diagnostic move: when auditing where an organization's improvement ideas actually come from, don't just ask 'is this a good idea' — ask 'whose daily friction would this personally relieve,' since that person is disproportionately likely to be both the proposer and the most reliable source of similar future proposals in that specific area, precisely because they have a reason to have already thought it through."
