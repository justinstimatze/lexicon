id: lex-kvtrt
name: resolving-the-barrier-that-sustains-desire-ends-the-desire
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When something depends on desire to keep functioning - a romance narrative, a long-term relationship, an aspiration - remember that desire requires an unresolved gap to exist at all: it's structurally a form of lack, sustained by separation between the wanting and the having. Closing that gap completely doesn't satisfy the desire, it ends it, which is why 'happily ever after' is where stories stop rather than where they get more interesting, and why long-term relationships have to keep manufacturing new barriers, new absences, new forms of not-quite-having, to keep the erotic charge alive rather than settling into a calmer, non-erotic form of attachment."
related: [lex-guj26, lex-hykxs]
evokes: ["eros-the-bittersweet-anne-carson", "desire-is-desire-for-desire", "happily-ever-after-is-where-the-story-stops"]
lineage:
  - source: primary
    text: wynn-2024-twilight-contrapoints-barrier-sustains-desire
    citation: "Natalie Wynn, 'Twilight' (ContraPoints, YouTube, published 2024-03-01), drawing on Anne Carson's Eros the Bittersweet (1986) and romance scholar Pamela Regis's concept of the genre 'barrier.'"
    quote: "[quoting Anne Carson:] 'The desirability of the love object derives, in part, from its lack.' ... [Wynn, synthesizing:] 'Because desire is derived from lack, something has to separate the lover and the beloved for desire to sustain itself. In romance fiction that something is the barrier... When the barrier is overcome, when the two lovers unite, then that's the end of your romance novel. Because the narrative is sustained by desire, and desire is sustained by separation, so when the separation ends, the desire ends.' ... 'It's not easy to sustain desire over years. You have to keep inventing new ruses, new barriers that create the space for desire to continually reignite.'"
canonical-instances:
  - "Wynn's own worked example: in Twilight, Edward's bloodlust for Bella is the internal barrier that must be resisted rather than resolved for the romance to continue - resolving it, by killing her, would end both her life and the story, so the tension has to be maintained, not solved, for as long as the narrative runs."
critical-questions:
  - "Is this actually specific to erotic and romantic desire, or does it describe any goal-directed wanting - does achieving a long-sought career goal or possession similarly end the specific desire for it, just without the vocabulary of eros attached?"
  - "Wynn suggests successful long-term couples either settle for calmer attachment or must keep manufacturing new barriers - is manufacturing barriers actually a stable, healthy long-term strategy, or does it describe a pattern that tends toward instability (deliberately created conflict, withholding) when pursued on purpose rather than arising naturally?"
  - "Does the barrier need to be a genuine external obstacle, or can a self-imposed, known-to-be-fictional barrier - as in reading a romance novel, where the reader knows the ending - still generate the same structural desire-effect? What does it mean that desire can be sustained by a barrier the desirer already knows will be resolved?"
status: active
