lineage:
  - source: primary
    text: bohm-1996-on-dialogue
    citation: "David Bohm, *On Dialogue* (Routledge 1996; ed. Lee Nichol). Editor's introduction (Nichol), and Bohm's essays on dialogue (compiled from 1970s-1992 talks and writings). The transferable claim is that DIALOGUE in Bohm's specific sense is a collective practice of SUSPENDING assumptions to look AT them rather than continuing to look FROM them. Nichol's introductory framing: 'The thing that mostly gets in the way of dialogue, [Bohm] says, is holding to assumptions and opinions, and defending them. This instinct to judge and defend, embedded in the self-defense mechanisms of our biological heritage, is the source of incoherence.' Bohm's positive structural claim: 'A different kind of consciousness is possible among us, a participatory consciousness. In a genuine dialogue, each person is participating, is partaking of the whole meaning of the group and also taking part in it.' The operational form Bohm proposes: 15-40 people in a circle, no preset agenda, no facilitator (or minimal), no consensus goal; sustained meetings allow social conventions to wear thin and subcultural assumptions to surface where they can be examined. Output is COHERENCE of shared meaning, not agreement. The atom abstracts the STRUCTURAL MOVE (suspend → look-at → see → choose) without committing to the specific format. In-copyright (Routledge); verbatim quotation short and attributed under fair-use. Distinct from lex-wjwuc Mill collision-with-error (the JUSTIFICATION for entertaining opposition) — Bohm provides the OPERATIONAL DISCIPLINE for doing it. Distinct from lex-bmujx thought-actively-participates-in-forming-perceptions (the INDIVIDUAL claim about thought's role) — lex-wutu8 is the COLLECTIVE practice that supports proprioception of thought. Cross-domain attestation: Schein 1985+ humble-inquiry (suspending the expert stance to surface assumptions); Isaacs 1999 *Dialogue and the Art of Thinking Together* (the explicit operational extension of Bohm's work for organizational settings); Argyris-Schön 1974 double-loop learning (suspending the espoused theory to examine the theory-in-use); contemplative traditions (Buddhist 'beginner's mind' Shoshin; Quaker meeting for worship as collective contemplative practice); modern facilitation traditions (Liberating Structures, World Café, Theory U) — all share the structural move of suspending the default discussion-as-debate mode to surface what underlies it. Bohm's distinctive contribution is the framing of SUSPENSION as the indispensable move (not 'compromise,' 'consensus,' or 'understanding the other')."
    quote: "[Bohm 1996 *On Dialogue*, editor's introduction by Nichol:] 'The thing that mostly gets in the way of dialogue, [Bohm] says, is holding to assumptions and opinions, and defending them. This instinct to judge and defend, embedded in the self-defense mechanisms of our biological heritage, is the source of incoherence.' [Same volume, Bohm on participatory consciousness:] 'A different kind of consciousness is possible among us, a participatory consciousness. In a genuine dialogue, each person is participating, is partaking of the whole meaning of the group and also taking part in it.' [Nichol on the form:] 'A group of fifteen to forty people (Bohm's suggestions regarding numbers varied) voluntarily convene in a circle. After some initial clarification as to the nature of the process, the group is faced with how to proceed. As the group has convened with no preset agenda, settling into an agreeable topic (or topics) may take some time, and generate some frustration. [...] Recognizing the power of these assumptions and attending to their viruslike nature may lead to a new understanding of the fragmentary and self-destructive nature of many of our thought processes.' [Bohm on the structural distinction from debate:] 'Truth does not emerge from opinions,' [says Bohm,] 'it must emerge from something else – perhaps from a freer movement of this tacit mind.' [He continues,] 'we have to get meanings coherent if we are to perceive truth, or to take part in truth.' [The volume positions dialogue as a specific structural practice — suspend assumptions to look AT them — distinct from discussion (which exchanges defended positions), negotiation (which seeks agreement), and even most facilitated processes (which steer toward predetermined outcomes).]"
canonical-instances:
  - "Bohm dialogue group (the canonical instance): 15-40 people meeting weekly or biweekly over months, no facilitator, no agenda. Over time the group's default discussion-as-debate mode wears thin; subcultural assumptions surface; participants notice (through proprioception of thought) the assumptions actively operating in themselves and the group. Coherence rather than consensus is the output."
  - "Argyris-Schön double-loop learning: when an organizational team confronts a recurrent problem, single-loop learning adjusts the action; double-loop learning suspends the espoused theory to examine the theory-in-use (the assumptions that produced the action). Double-loop learning IS Bohm-dialogue applied to organizational practice."
  - "Schein 1985 humble-inquiry: senior leaders surface assumptions about a problem by genuinely asking from a position of not-knowing (rather than telling-disguised-as-questioning). The humility-of-inquiry move is the structural equivalent of Bohm's suspension. The discipline is distinct from being-meek; it's the active CHOICE to suspend the expert stance."
  - "Quaker meeting for worship: a structured silence in which participants suspend the impulse to fill space with words; speech emerges from the suspended ground rather than from defended positions. Same structural move as Bohm dialogue, embedded in a religious-contemplative practice tradition that predates Bohm by centuries."
  - "Distinguished from debate / discussion: debate exchanges defended positions and seeks to convert; discussion exchanges information; dialogue suspends to look AT the assumptions producing the positions. The atom names the structural move (suspend → look-at), not the conversational genre."
  - "Distinguished from consensus-seeking: consensus tries to find an agreed position; Bohm-dialogue does not seek agreement — it surfaces the assumptions that the consensus would paper over. Sometimes the dialogue concludes that the participants must continue to disagree, but now with awareness of what they're disagreeing from."
  - "Distinguished from lex-eb3wf Klein pre-mortem: pre-mortem is one specific decision-analysis instrumentation (project failure-modes); Bohm-dialogue is the broader collective-inquiry pattern. They compose — a pre-mortem can be conducted as a Bohm-dialogue (suspending the assumption that the project will succeed) or as a debate (defending the project against criticism). The pre-mortem framework supplies the topic; Bohm-dialogue supplies the structural mode."
critical-questions:
  - "Are participants actually suspending or just rotating turns to defend? Diagnostic: when a participant offers a view, does the next speaker (a) respond to the substance of that view's underlying assumptions, or (b) defend their own position against it? Mode (b) is debate, not dialogue. Suspension requires a felt-pause between impulse-to-defend and speaking."
  - "Has the group given itself enough time for social conventions to wear thin? Bohm consistently emphasized that the first dialogue meetings produce conventional sharing; the substantive work begins only after participants stop performing 'a good participant' and the actual assumptions surface. Most modern facilitated 'dialogues' run too short for this; they're closer to facilitated discussion."
  - "Are you using Bohm-dialogue language to avoid taking positions you should take? The atom names a structural move for collective inquiry, not a license for endless suspension. Some decisions require taking a position; the dialogue is for SURFACING ASSUMPTIONS, not for indefinitely deferring action. After the dialogue surfaces what was hidden, participants still must choose. Diagnostic: does the dialogue ever conclude with anyone changing a crucial position? If never, the dialogue may be in performative-suspension mode."
  - "Does the suspension produce shared coherence or just shared confusion? Bohm's claim is that genuine suspension produces a participatory coherence — not agreement, but a felt sense of shared field. If the group instead disperses into private confusions, the suspension may be functioning as social retreat rather than substantive examination."
  - "What's the relation to lex-bmujx thought-actively-participates-in-forming-perceptions? lex-bmujx names the INDIVIDUAL structural claim about thought's constitutive participation in forming perception; lex-wutu8 names the COLLECTIVE practice that supports proprioception of that participation. They compose — proprioception of thought is hard alone; dialogue is the social technology that makes it possible at scale."
