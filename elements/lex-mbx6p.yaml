id: lex-mbx6p
name: covariation-judged-by-both-present-cell-ignoring-2x2-remainder
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When judging whether X causes Y, force yourself to fill in all four cells of the 2x2: X+Y+, X+Y-, X-Y+, X-Y-. People judge by the X+Y+ count alone and miss the base rates. Filling the table is the cheapest defense against illusory correlation."
related: [lex-t9fs7, lex-e8wv6, lex-n6t4u, lex-eb3wf, lex-v6nqz, lex-tfpzb, lex-zag9z, lex-zfbef, lex-2czcp, lex-dgwbn, lex-vkhp7, lex-rwvkh, lex-rsnn7, lex-9n7bg]
scaffolds-from: [lex-v6nqz]
evokes: [illusory-correlation, two-by-two-contingency-table, chapman-and-chapman-1967, smedslund-1963-nurses, covariation-detection-failure, perceived-but-nonexistent-relationship, heuer-ch11]
lineage:
  - source: primary
    text: heuer-1999-psychology-of-intelligence-analysis-ch11-illusory-correlation
    citation: "Richards J. Heuer Jr., *Psychology of Intelligence Analysis*, CIA Center for the Study of Intelligence 1999, Ch. 11 'Biases in Perception of Cause and Effect', section 'Illusory Correlation' (pp. 140-145). The substrate-claim: when judging whether two variables (or two events) are correlated, people intuitively rely on counting instances where BOTH are present, while systematically ignoring (a) instances where only A is present, (b) instances where only B is present, and (c) instances where neither is present. To correctly assess a correlation between two binary variables requires information in all FOUR cells of a 2×2 contingency table; people consistently make confident covariation-judgments using only the upper-left cell. Heuer presents the Smedslund 1963 nurses experiment as the vital empirical case: 18 of 19 test subjects judged that symptom A and diagnosis F were related when the underlying card-distribution produced zero correlation. More than half of subjects based their judgment SOLELY on the frequency of A+F co-occurrence. The Chapman & Chapman 1967 'illusory correlation' work demonstrates the same failure-mode in clinical Rorschach interpretation: clinicians 'see' correlations between specific Rorschach responses and homosexuality that don't exist in the data, because they recall the cases where both occurred together and don't sum the non-co-occurrences. The transferable mechanism: human covariation-detection has no built-in 2×2 contingency-table; intuition supplies the upper-left cell only. The failure compounds with confirmation-bias (lex-t9fs7): the analyst seeks instances of A+F, the analyst RECALLS instances of A+F, the analyst's intuitive judgment is based on the FREQUENCY of A+F, and so the correlation 'feels' established. The corrective is structural: forcing the analyst to fill in the full 2×2 (or larger) contingency table from EXPLICIT enumeration of the four cells. Heuer connects this to intelligence-analysis context (pp.141-142): assumptions like 'economic stress → opposition support', 'military government → democratic erosion', 'negotiating-from-strength → success' are all covariation-judgments that are typically asserted without filling in the contingency table — the analyst recalls cases where stress co-occurred with opposition support, but not stress-without-opposition or opposition-support-without-stress. Heuer's resolution (p.141): 'recognizing the need for such qualifying statements is one of the differences between subconscious information processing and systematic, self-conscious analysis.' The practitioner-payload: when forming or accepting a covariation-claim, demand the FOUR-CELL enumeration before treating the correlation as established."
    quote: "[Heuer 1999 Ch.11 pp.140-141:] 'Illusory correlation occurs when people perceive a relationship that does not in fact exist. In looking at a series of cases, it seems that people often focus on instances that support the existence of a relationship but ignore those cases that fail to support it. Several experiments have demonstrated that people do not have an intuitive understanding of what information is really needed to assess the relationship between two events or two variables. There appears to be nothing in people's intuitive understanding that corresponds with the statistical concept of correlation.' [On the Smedslund 1963 nurses experiment, pp.141-142:] 'Eighteen of 19 test subjects given the 100 cards representing this particular combination of A and F thought there was at least a weak relationship, and several thought there was a strong relationship, when in fact, there is no correlation at all. More than half the test subjects based their judgment solely on the frequency of cases in which both A and F were present.' [On the 2×2 requirement, p.141:] 'to determine the existence of such a relationship, one needs information to fill all four cells of a 2 x 2 contingency table.' [On the intelligence-analysis stakes, p.141:] 'Judgments about correlation are fundamental to all intelligence analysis. For example, assumptions that worsening economic conditions lead to increased political support for an opposition party, that domestic problems may lead to foreign adventurism, that military government leads to unraveling of democratic institutions, or that negotiations are more successful when conducted from a position of strength are all based on intuitive judgments of correlation between these variables. In many cases these assumptions are correct, but they are seldom tested by systematic observation and statistical analysis.' [On the corrective discipline, p.141 citing Fischhoff 1980:] 'recognizing the need for such qualifying statements is one of the differences between subconscious information processing and systematic, self-conscious analysis. Knowledgeable analysis might be identified by the ability to fill in the qualification; careful analysis by the frequency with which one remembers to do so.' [The transferable distillation: intuition supplies only the upper-left cell of the contingency table; the other three cells must be enumerated EXPLICITLY for the covariation-judgment to be valid. The failure-mode is invisible to the intuiting analyst because the felt-confidence rises with the count in the upper-left cell, not with the structural completeness of the assessment.]"
canonical-instances:
  - "Smedslund 1963 nurses experiment (Heuer p.141): 100 cards, A symptom and F diagnosis; underlying card distribution produces ZERO correlation between A and F. Of 19 nurses asked to judge the relationship, 18 perceived at least a weak relationship and several perceived a strong one. The majority based the judgment solely on counting A-and-F co-occurrences, without subtracting the A-without-F cases (false positives) or accounting for F-without-A cases (false negatives) or non-occurrences of both. The error is universal and stable across replications."
  - "Chapman & Chapman 1967 illusory-correlation in clinical Rorschach interpretation: clinicians 'observed' correlations between specific Rorschach responses (e.g., 'feminine clothing', 'buttocks') and male homosexuality that the actual case data did not support. The clinicians' recall was strongly biased toward salient co-occurrences; the cells with non-co-occurrence were not retrieved or weighted. The Chapmans demonstrated that the effect persisted even when subjects were shown raw counts that disconfirmed the perceived relationship — vividness of co-occurrence dominated abstract counts (composes with lex-2czcp vividness-criterion)."
  - "Intelligence-analysis worked example (Heuer p.141): 'worsening economic conditions lead to increased political support for an opposition party' — typically asserted without filling in the contingency table. To assess validity requires counting: (a) cases with both economic-worsening and opposition-gain, (b) cases with economic-worsening but no opposition-gain, (c) cases with opposition-gain absent economic-worsening, (d) cases with neither. Most assertions of this form skip (b)-(d) and operate on the salience of (a) alone."
  - "Software engineering: 'every time we deploy on Friday, something breaks.' The analyst recalls Friday-failures, treats them as evidence for the Friday→failure correlation. The 2×2 requires: (a) Friday-deploy + failure, (b) Friday-deploy + success, (c) non-Friday-deploy + failure, (d) non-Friday-deploy + success. Without all four cells, the felt-correlation is spurious. The corrective is to PULL the deploy log and compute the actual joint distribution."
  - "Stereotyping and social attribution: 'engineers are introverted', 'finance people are aggressive'. These are covariation-claims about category-membership and trait-presence. Their felt validity rests on the upper-left cell (introverted engineers + aggressive finance-people you've met) without counting (a) non-introverted engineers, (b) introverted non-engineers, (c) non-introverted non-engineers. Base-rate stereotyping is a specific instance of lex-mbx6p; the corrective is the same 2×2 enumeration."
  - "Medical diagnosis: 'patients with symptom X often have condition Y' — the clinician's training and recall over-represent the cases where both occurred. Without integrating Y-without-X (the false-negative cell) and X-without-Y (the false-positive cell), the diagnostic claim has no measurable diagnosticity (composes with lex-zag9z ACH's diagnosticity-not-consistency principle). Modern clinical-decision-rules (e.g., Wells scoring for DVT) explicitly populate the contingency table from validated studies, replacing the lex-mbx6p failure-mode with structured judgment."
  - "Sports / financial-market commentary: 'when X happens, Y usually follows' — assertions abundant in market commentary, sports announcing, weather almanacs. Few are filled in with the contingency-table cells (b), (c), (d); most rely on memorable cases of joint occurrence. The reason base-rate-aware empirical work (e.g., Tetlock's superforecaster research, base-rate-prediction in finance) outperforms commentary is precisely that it operationalizes lex-mbx6p's corrective."
  - "Operationally distinct from lex-e8wv6 apophenia-induction: lex-e8wv6 is the DESIGN-STANCE of engineering pattern-construction in others (ARGs, conspiracies). lex-mbx6p is the COGNITIVE FAILURE-MODE of detecting covariation incorrectly. Apophenia operates on individual instances treated as meaningful; lex-mbx6p operates on aggregates judged for relationship-existence. They share the broader 'human pattern-detection is unreliable' family but target different failure-shapes."
  - "Operationally distinct from lex-2czcp vividness-criterion: vividness weights a SINGLE vivid case heavily vs abstract data; illusory-correlation involves AGGREGATING multiple cases but doing so incorrectly. Vividness can amplify lex-mbx6p (a vivid co-occurrence dominates the upper-left cell), but lex-mbx6p operates even with non-vivid cases when the analyst counts only co-occurrences."
  - "Operationally distinct from lex-zfbef: lex-zfbef is about VOLUME of detail on the favored hypothesis; lex-mbx6p is about COVARIATION JUDGMENT structure. The two failures compose: piling detail onto co-occurrence cases (lex-zfbef) amplifies the felt-strength of the illusory correlation (lex-mbx6p) without correcting the contingency-table omission."
  - "Operationally composes with lex-v6nqz Mill's eliminative-paired-comparison: lex-v6nqz is the PRESCRIPTIVE method for testing covariation correctly (paired instances differing only in the candidate cause). lex-mbx6p is the DESCRIPTIVE failure-mode for what people do without that discipline. Snow 1854 Broad Street epidemiology (lex-v6nqz canonical instance) succeeded precisely because Snow filled in the contingency cells (pump-near + cholera, pump-near + no-cholera at brewery/workhouse, etc.) that intuitive judgment would have skipped."
  - "Operationally composes with lex-zag9z ACH: ACH's diagnosticity-not-consistency principle requires evidence that DISCRIMINATES between hypotheses — which is structurally what the 2×2 cells (b), (c), (d) enumerate (evidence-consistent-with-one-hypothesis-but-not-the-other). When ACH is applied, the upper-left-cell trap of lex-mbx6p becomes visible because diagnosticity cannot be calculated without the other cells."
critical-questions:
  - "have you written down the FULL 2×2 contingency table? Practitioner-discipline: for any covariation-claim of the form 'when A, then B' or 'A predicts B', explicitly enumerate (a) instances of A and B both present, (b) A present and B absent, (c) A absent and B present, (d) both absent. If you cannot enumerate the cells, you do not have grounds for the covariation-judgment. The 2×2 must precede the claim."
  - "what's the BASE RATE of B? A covariation-claim 'A predicts B' depends on B's base rate. If B happens 80% of the time anyway, finding B after A is barely informative. Practitioner-question: what would the upper-left-cell count look like if A and B were UNCORRELATED — i.e., if you multiplied marginal frequencies? Comparing the actual upper-left to that null-baseline is the diagnosticity check. If you can't articulate the null-baseline, you can't claim the correlation is meaningful."
  - "are you recalling SELECTIVELY? Practitioner-discipline: when forming the covariation-judgment from memory, force yourself to recall instances of EACH cell — including (a) cases where the antecedent occurred but the consequent didn't, and (c) cases where the consequent occurred without the antecedent. If you cannot recall examples of (b) and (c), your memory has supplied a biased sample and your covariation-judgment is unwarranted."
  - "have you written the corollary covariation-claim that the SAME data would support? Heuer (p.141): 'haste makes waste' AND 'he who hesitates is lost' both feel intuitively-supported. They cannot both be true as covariation-claims. When two contradictory covariation-claims feel intuitively-supported, lex-mbx6p is operating — the same memory-pool supplies confirming instances for both. The diagnostic: list 3-5 instances supporting your covariation-claim, then ask whether each instance ALSO supports the opposite claim. If many do, the covariation is illusory."
  - "where does this overcorrect? When the covariation-claim is robustly empirically established (RCT-validated, longitudinal-statistical, large-N case-controlled), the 2×2 has already been filled in. Forcing fresh contingency-table enumeration for each invocation of a well-established correlation is wasted effort. Practitioner-discrimination: is the covariation-claim from a published statistical body (apply the established correlation; lex-mbx6p doesn't apply) or from intuition/recall (apply the 2×2 discipline; lex-mbx6p applies)?"
  - "how does this interact with sample-size adequacy? Even when an analyst correctly enumerates the 2×2, small samples can produce spurious correlations. The 2×2 discipline is necessary but not sufficient — sample-size and statistical-significance considerations come after the cells are filled in. Practitioner-question: how many instances populate each cell? If any cell has fewer than ~5 instances, the covariation-judgment is unreliable even when the 2×2 is correctly structured."
