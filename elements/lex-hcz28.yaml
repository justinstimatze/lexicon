id: lex-hcz28
name: feeding-a-dependent-to-satisfy-your-own-hunger-can-still-kill-them
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you break a stated safety rule and the language you reach for is concern for the dependent in your care, check who is actually consuming the excess -- the same act can be dressed as devotion while being driven by your own appetite, and the dependent can die from that excess rather than from neglect. In Radin's Winnebago Trickster cycle, a father entrusts Trickster with two small children under one explicit condition: 'feed these children once a month. Do not change this rule. If you change it in any respect, you will kill them.' Almost immediately, Trickster tells himself, 'My, my! My dear little children must be hungry by now. But why waste time talking about it? I will let them have something to eat immediately.' He kills game, cooks it, fills their bowl, and violates the rule again and again -- but each time it is Trickster, not the children, who eats the bulk of it: 'He ate up everything that remained and drank all the soup that was in the pail.' The rule was broken in the name of the children's hunger while it was actually feeding his own, and the excess this produces, not any withholding, is what kills them: 'To his surprise the children were dead. The dear little children! How unfortunate that they have died!' Diagnostic move: when a broken safety rule is justified as generosity toward a dependent, check whether the dependent is receiving the generosity or whether the caretaker's own need is what the broken rule is actually feeding."
related: []
evokes: [radin-winnebago-trickster-cycle, wakdjunkaga, feed-these-children-once-a-month, the-dear-little-children-how-unfortunate-that-they-have-died]
lineage:
  - source: primary
    text: radin-trickster-breaks-the-feeding-rule-to-feed-himself-and-the-children-die
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episodes 6-7. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Now, Trickster, remember, if you kill any of these children you will die. Remember if you kill these little children, no matter where you may be, I will pursue and kill you. Keep what I am giving you and feed these children once a month. Do not change this rule. If you change it in any respect, you will kill them.' ... 'My, my! My dear little children must be hungry by now. But why waste time talking about it? I will let them have something to eat immediately.' ... He filled the wooden bowl high and gave it to them. In spite of all that the man had told him he did many things strictly forbidden to him. ... He ate up everything that remained and drank all the soup that was in the pail. ... To his surprise the children were dead. 'The dear little children! How unfortunate that they have died!'"
canonical-instances:
  - "A relative watching a diabetic child breaks the family's strict snack schedule 'because the poor kid looks hungry,' but eats most of what they prepare themselves while the child gets a small share too often between meals, and the resulting blood-sugar swings do the very harm the schedule existed to prevent."
  - "A manager overrides a team's agreed-upon meeting cadence, adding extra 'quick syncs' out of stated concern that the team feels unsupported, but spends most of each sync on their own updates and concerns, and the team burns out from the added meeting load the concern was supposed to prevent."
critical-questions:
  - "Is Trickster aware that he is the one benefiting from each violation, or does the story present his professed concern for the children as sincere self-deception rather than conscious pretext -- does the distinction matter for how the pattern should be recognized in oneself?"
  - "Would the children have survived if Trickster had genuinely fed them once a month as instructed and eaten nothing himself in between, or does the story suggest any deviation from the rule, regardless of who benefits, was going to be fatal?"
  - "Does the father's warning, framed entirely around Trickster's own death as the consequence ('you will die,' 'I will pursue and kill you'), actually protect the children, given that the story shows the threat failing to prevent the very harm it was meant to deter?"
status: active
