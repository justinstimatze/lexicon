lineage:
  - source: primary
    text: bergson-1907-creative-evolution-ch4
    citation: "Henri Bergson, *L'Évolution créatrice* (Paris: Félix Alcan, 1907); English translation: *Creative Evolution* (New York: Henry Holt, 1911), tr. Arthur Mitchell, with authorized revisions by Bergson. Ch. IV `The Cinematographical Mechanism of Thought and the Mechanistic Illusion`, especially pp. 297-313 of the 1911 Mitchell translation. Bergson develops the cinematographical thesis as the keystone of his philosophy of becoming: practical intelligence cuts continuous duration into discrete snapshots because stable handles serve action, then artificially reconstitutes motion by stringing the snapshots along a uniform empty time-axis. The thesis underwrites his readings of Zeno's paradoxes (Bergson 1889 *Time and Free Will* Ch.II, 1907 *Creative Evolution* Ch.IV), his critique of the Eleatic-Platonic-Aristotelian Form-tradition (1907 Ch.IV §`Form and Becoming`), and his critique of evolutionary mechanism (1907 Ch.I-III, where the cinematographical illusion is identified as the source of misconceptions about how species change). Bergson's *durée* (duration) is the alternative — a qualitative continuous heterogeneous becoming that the cinematographical apparatus cannot grasp without distortion."
    quote: "Such is the contrivance of the cinematograph. And such is also that of our knowledge. Instead of attaching ourselves to the inner becoming of things, we place ourselves outside them in order to recompose their becoming artificially. We take snapshots, as it were, of the passing reality, and, as these are characteristic of the reality, we have only to string them on a becoming, abstract, uniform and invisible, situated at the back of the apparatus of knowledge, in order to imitate what there is that is characteristic in this becoming itself. Perception, intellection, language so [...] We may therefore sum up what we have been saying in the conclusion that the mechanism of our ordinary knowledge is of a cinematographical kind. [...] Intelligence, in its natural state, aims at a practically useful end. When it substitutes for movement immobilities put together, it does not pretend to reconstitute the movement such as it actually is; it merely replaces it with a practical equivalent. It is the philosophers who are mistaken when they import into the domain of speculation a method of thinking which is made for action."
  - source: cross-attestation
    text: cross-domain-snapshot-vs-continuous-representation-tradeoff
    citation: "Cross-domain attestation that the structural primitive — practical cognition substitutes discrete state-snapshots for continuous becoming, generating Zeno-style puzzles about transitions — recurs across (a) calculus and continuous dynamical systems, (b) signal processing and information theory, (c) machine learning representation, (d) process philosophy, (e) phenomenology, (f) quantum measurement theory, (g) historiography and periodization, (h) software event-sourcing and stream processing, (i) cognitive science and the binding problem. SOURCES: Zeno of Elea (5th c. BCE) `Achilles and the Tortoise` + `The Arrow` — the canonical generating-cases for the puzzle Bergson diagnoses, preserved in Aristotle *Physics* VI.9; Newton 1687 *Principia* + Leibniz 1684 calculus papers — the formal apparatus that recovers continuous flow from differential rates; Harry Nyquist 1928 `Certain Topics in Telegraph Transmission Theory` + Claude Shannon 1949 `Communication in the Presence of Noise` — the sampling theorem operationalizing when discrete sampling faithfully reconstructs continuous signal; Alfred North Whitehead 1929 *Process and Reality* — fallacy of misplaced concreteness, fallacy of simple location, both critiquing snapshot-thinking from a process-metaphysics standpoint; William James 1909 *A Pluralistic Universe* Lecture VI on Bergson as Anglo-American process tradition's key bridge; Maurice Merleau-Ponty 1945 *Phénoménologie de la perception* on motor intentionality + the continuous body-schema; Martin Heidegger 1927 *Sein und Zeit* §65 on ecstatic temporality vs vulgar now-point time; Niels Bohr 1928 + 1935 on measurement and complementarity in quantum mechanics (continuous wave evolution + discrete measurement event); Hayden White 1973 *Metahistory* + Reinhart Koselleck 1979 *Vergangene Zukunft* on the construction of historical periodization; Greg Young 2010 + Martin Fowler 2017 on event-sourcing in software architecture; Francis Crick + Christof Koch 1990 + Anil Seth 2021 on the binding problem in consciousness studies. The cross-attestation runs from pre-Socratic philosophy through modern physics, software engineering, and cognitive science."
    quote: "Across Zeno of Elea (the Achilles paradox and the arrow paradox as the canonical generating-cases for the snapshot-derived puzzles about motion), Newton 1687 + Leibniz 1684 calculus (the formal apparatus that recovers continuous flow from differential rates rather than from state-snapshots), Nyquist 1928 + Shannon 1949 sampling theorem (operationalizing when discrete sampling faithfully reconstructs continuous signal — sample at more than twice the highest frequency or lose information to aliasing), Whitehead 1929 *Process and Reality* (fallacy of misplaced concreteness — treating the abstract snapshot as the concrete reality; fallacy of simple location — treating things as bounded by their state-instant), Merleau-Ponty 1945 *Phenomenology of Perception* (motor intentionality and the continuous body-schema as prior to the snapshot-judgment), Heidegger 1927 *Being and Time* §65 (ecstatic temporality as the unified past-present-future structure of care vs. vulgar time as a sequence of now-points), Bohr 1928/1935 on the measurement problem (continuous Schrödinger evolution + discrete measurement event), Hayden White 1973 + Koselleck 1979 on historical periodization (the Renaissance, the Enlightenment, the Cold War as snapshot-categories imposed on continuous social becoming), event-sourcing in software (Young 2010 + Fowler 2017 — event-streams preserve continuity-of-process; state-snapshots are the cinematographical default), and the binding problem (Crick-Koch 1990 + Seth 2021 — the puzzle assumes the percept is built from snapshot-features rather than emerging from continuous distributed dynamics), the same structural primitive recurs: PRACTICAL COGNITION DEFAULTS TO SNAPSHOTS + CONTINUOUS BECOMING IS THE ALTERNATIVE THE SNAPSHOTS HIDE."
canonical-instances:
  - "Zeno's arrow paradox (5th c. BCE): the arrow is at rest at every instant of its flight, so how can it be moving? Bergson's diagnosis is that the puzzle is generated by the snapshot-discretization — taking instantaneous states and asking how motion arises from their succession. The continuous-becoming frame dissolves the puzzle: motion is not a property of any instant but of the indivisible flow."
  - "Newton-Leibniz calculus (1665-1684): the differential dx/dt is the formal move that recovers continuous flow from rates of change rather than from state-snapshots. Integration recovers position from velocity over time. The whole apparatus is the mathematical answer to the cinematographical illusion."
  - "Nyquist-Shannon sampling theorem (1928/1949): formal characterization of when discrete sampling faithfully reconstructs continuous signal. Sample at more than twice the highest frequency or lose information to aliasing. The theorem is a precise statement of when the cinematographical reconstruction works and when it fails."
  - "ML tokenization (Mikolov et al 2013 word2vec; Vaswani et al 2017 Transformer): continuous audio, video, and text are chopped into discrete tokens to make manipulation tractable. Autoregressive next-token prediction strings the tokens back together — exactly Bergson's stringing of snapshots on uniform time. The continuous-time alternatives (state-space models, diffusion in continuous time) are explicit attempts to escape the tokenization."
  - "Quantum measurement problem: the Schrödinger equation evolves the wave function continuously; measurement appears to collapse the wave function to a discrete eigenstate. The puzzle of how continuous evolution produces discrete measurement outcomes is the Bergsonian puzzle — the discreteness is at the measurement-cut, not in the underlying becoming."
  - "Historiography periodization (White 1973 + Koselleck 1979): the Renaissance, the Enlightenment, the Cold War are snapshot-categories imposed on continuous social-cultural-political becoming. Treating them as discrete eras with sharp boundaries produces puzzles about transitions (when exactly did the Renaissance begin?) that dissolve when the continuous trajectory is recovered."
  - "Event-sourcing in software (Young 2010 + Fowler 2017): the architectural choice between storing current state vs. storing the event-stream that produced the state. Event-sourcing preserves the continuity-of-process Bergson defends; state-snapshots are the cinematographical default. Both have tradeoffs — event-sourcing is harder to query but preserves transition-reasoning; snapshots are faster but lose the becoming."
  - "Phenomenology of motor action (Merleau-Ponty 1945): the body-schema is continuously updated as one moves; the judgment-snapshot `I am here, my hand is there` is a derivative abstraction from the underlying continuous motor intentionality. Athletes, dancers, surgeons report this directly — the snapshot-mode of attention is task-pathological at high skill levels."
  - "Whitehead 1929 fallacy of misplaced concreteness: treating the abstract snapshot (the actual occasion) as the concrete reality. Whitehead's whole process-metaphysics program is the systematic philosophical response to the Bergsonian diagnosis. The concrete is the becoming; the snapshot is the abstraction we extract for practical purposes."
  - "Heidegger 1927 *Being and Time* §65 ecstatic temporality: past-present-future as a unified structure of care vs. vulgar time as a sequence of now-points. The vulgar-time frame is Heidegger's name for the cinematographical illusion as it appears in everyday-being-with-things-as-handle-able."
  - "Cognitive binding problem (Crick-Koch 1990): how does distributed neural processing produce a unified percept of a coherent object? The puzzle assumes the percept is constructed from feature-snapshots that need binding. Continuous-dynamics frames (Tononi 2008 IIT, Friston 2010 free-energy) dissolve some of the binding puzzle by treating the percept as emergent from continuous distributed dynamics, not from snapshot-feature aggregation."
  - "Music: continuous analog wave vs digital sample-based representation. The 44.1 kHz CD sampling rate is set by Nyquist for the 20 kHz upper limit of human hearing; below the rate, aliasing artifacts appear. The audiophile complaint about digital is a complaint about the cinematographical loss — even when Nyquist is satisfied for hearing, the snapshot-structure feels different from the continuous flow."
critical-questions:
  - "Is the puzzle in front of me being generated by the snapshot-discretization itself, or by the underlying phenomenon? If the puzzle is `how does the system transition between states?`, suspect the discretization first."
  - "Could I work with the continuous variable + its rate of change instead of with state-snapshots + transitions? If yes, the calculus-style move may dissolve the puzzle."
  - "Is the discretization I am using SERVING THE WORK (practical manipulation) or DISTORTING THE WORK (theoretical fidelity)? These have different tolerances for snapshot-loss."
  - "Where is my snapshot-rate relative to the Nyquist threshold for the dynamics I am modeling? Undersampling produces aliasing — apparent slow-dynamics that are artifacts of the discretization."
  - "Am I treating my discrete representation as the concrete reality (Whitehead's misplaced concreteness) or as a practical abstraction from a continuous underlying becoming?"
