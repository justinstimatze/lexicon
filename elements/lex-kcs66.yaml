id: lex-kcs66
name: reframing-an-inescapable-outcome-reduces-resistance-to-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'Facing a genuinely unavoidable outcome, pointing out that fear changes nothing about the result can shift the response from resistance to acceptance, since resistance only adds suffering without altering what''s coming. In the Jataka''s tale of Tundila, the elder pig counsels his brother that there is no escape, so acceptance is the only response that actually helps: "You fear, and look for aid, and quake, But, helpless, whither can you flee? We''re fattened for our flesh''s sake: Eat, Tundila, and cheerfully."'
related: []
evokes: [jataka, chanipata, tundila-jataka, reframing-the-inescapable, acceptance-over-futile-resistance]
lineage:
  - source: primary
    text: jataka-chalmers1895-tundila-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 388, Tundila-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "You fear, and look for aid, and quake, But, helpless, whither can you flee? We're fattened for our flesh's sake: Eat, Tundila, and cheerfully."
canonical-instances:
  - "A patient told a diagnosis can't be reversed stops fighting the news once a counselor points out that the fear itself isn't buying any more time, and redirects that same energy toward making the remaining time better."
critical-questions:
  - "Does this advice only apply when the outcome is truly unavoidable — how would anyone reliably distinguish a genuinely inescapable situation from one that only feels that way?"
  - "Is cheerful acceptance actually the better response even when it's genuinely possible, or does it risk giving up too early on options that resistance might still have uncovered?"
status: active
