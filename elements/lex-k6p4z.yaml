id: lex-k6p4z
name: expert-decisions-flow-from-pattern-match-not-option-comparison
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an experienced practitioner makes a fast high-stakes decision (fireground commander, ER physician, chess master under blitz, navy captain, military officer at the threshold), expect they did NOT generate a slate of options and pick the best. They RECOGNIZED the situation as a member of a familiar prototype-class — and the typical course of action came with the recognition. They evaluated the single recognized action by MENTAL SIMULATION (running it forward in imagination); if a problem surfaced, they revised it or moved to the next-typical action; if not, they executed. Option-comparison is the NOVICE strategy, not the expert one. Klein's empirical finding in naturalistic decision settings: roughly 80% of fireground commanders' decisions on nonroutine fires are recognition-primed, not compared. Diagnostic: when an expert says 'I just knew what to do,' don't read this as inarticulate optimization; read it as recognition-primed decision making — they MATCHED the situation, the action came with the match, and mental simulation tested the action without comparing it to alternatives. Transferable: this is how live expert cognition actually works in domains where time-pressure forbids deliberation."
related: [lex-wtkuz, lex-rgr3t, lex-w5qfe, lex-2jn8d, lex-b2c6b, lex-n42kg, lex-j2tgc, lex-c646m]
scaffolds-from: [lex-j2tgc, lex-rgr3t]
evokes: [recognition-primed-decision, RPD, naturalistic-decision-making, mental-simulation, prototype-recognition, expertise-vs-deliberation, klein-1998, situation-awareness, sources-of-power, fireground-command]
lineage:
  - source: primary
    text: klein-1998-sources-of-power-ch3-rpd-model
    citation: "Klein, Gary. 1998. *Sources of Power: How People Make Decisions*. Cambridge, MA: MIT Press. Chapter 3 'The Recognition-Primed Decision Model' (pp. 15-30) establishes the empirical finding from Klein Associates' field studies of fireground commanders, U.S. Navy decision-makers, design engineers, and chess masters under time pressure: in 127 of 156 classified decision points (~80%), commanders did NOT compare options. 'The commanders' secret was that their experience let them see a situation, even a nonroutine one, as an example of a prototype, so they knew the typical course of action right away. Their experience let them identify a reasonable reaction as the first one they considered, so they did not bother thinking of others.' Klein formalized this as the RPD model with three variations: (1) simple match (recognize → execute), (2) diagnostic (recognize is ambiguous → gather more cues), (3) mental-simulation evaluation (recognize → run the action forward in imagination → revise or proceed). The KEY empirical contrast is to the rational-choice tradition (Janis-Mann 1977, classical decision-analysis): the experts in time-pressured naturalistic settings do NOT 'thoroughly canvas a wide range of options ... carefully weigh the costs, risk, and benefits of each option ... assimilate all new information' [Corrected 2026-08-19: the third clause had previously dropped the article and used the plural form of risk -- verified exact against the Janis-Mann prescriptions diagram in Klein-1998-SourcesOfPower.epub] — they SKIP option-comparison entirely. Klein's methodological move was the Critical Decision Method (cognitive interview, retrospective recall with structured probing) — methodologically distinct from Simon's deductive economic-theory and from laboratory decision-research. Ch.4 develops 'intuition' as the recognition mechanism; Ch.5 develops 'mental simulation' as the evaluation mechanism."
canonical-instances:
  - "Fireground commander encounters a basement fire and immediately calls for a vertical attack from the roof rather than entering from the basement — the recognition that this is a chute-fire pattern delivered the response, no options compared. Klein's worked example, Ch.3."
  - "ER triage by experienced charge nurse: a patient walks in, the nurse takes one look, and they say 'bed 4, stat' — they recognized a constellation (color, breathing, gait) as a high-acuity pattern. The action came with the pattern; option-comparison would have wasted the seconds that mattered."
  - "Senior software engineer reads a stack trace and says 'this is the X bug, fix is Y' without entertaining alternatives — they recognized the pattern from prior incidents. A junior engineer would compare hypotheses; the senior matches and proceeds, then mental-simulates the fix before running it."
  - "Chess masters under blitz (6-second average move) play near-master-level chess — not by analyzing the position from scratch but by recognizing it as a member of a known pattern-class. Klein cites the empirical work (de Groot 1965, Chase-Simon 1973): masters and class-B players generated similar QUALITY first-move candidates under blitz; masters were faster because the recognition was tighter, not because they evaluated more deeply."
  - "Operationally distinct from lex-j2tgc bounded-rationality-replaces-optimizing-with-satisficing: both contradict optimization but the mechanisms differ. Satisficing is SEQUENTIAL search-and-stop-at-threshold; RPD is NO SEARCH AT ALL — the action came with the pattern-recognition. Satisficing is Simon's framework for the general case; RPD is Klein's empirically-grounded refinement of how the satisficing actually plays out in expert hands under time pressure. They compose: RPD is the expert version of satisficing where the search-space collapses to one candidate via pattern-match."
critical-questions:
  - "what distinguishes RPD from blind habit or auto-pilot? The presence of mental simulation as the evaluation step. The expert who recognizes a situation also imagines the chosen action playing out and looks for surfaceable problems; if the simulation surfaces a concern, the action is revised or replaced. Blind habit skips the simulation. Klein's diagnostic distinction: ask whether the expert can articulate WHY they rejected the alternative actions or surfaced a concern with the chosen one; if they can (often after the fact), the simulation was operating. If 'I just did it,' inspect more carefully."
  - "when does RPD fail or mislead? When the situation-class has shifted (new failure modes, novel attack patterns, regime change) — the pattern-recognition fires on surface-similar cues but the underlying generator is different. The Vincennes shootdown (Klein Ch.6) is the cautionary case: the operators' pattern-recognition fired 'descending Iranian F-4 attack' on an ascending civilian Airbus. Mental simulation would have surfaced the inconsistency (an attacking aircraft does not ascend), but didn't. When the world is in a stable regime, RPD outperforms deliberation; when the world has shifted, RPD encodes obsolete priors."
  - "how is RPD acquired, and what does that imply for training? Klein: many years of varied exposure under feedback (firefighters average 23 years; chess masters thousands of games). Training implications: lots of repetition across many cases is what builds the prototype-library; formal analytical training does not substitute. The training design principle: maximize density of varied situations under realistic conditions, not depth of analytical theorizing. Echoes lex-rgr3t habit-formation but at the level of decision-pattern-recognition rather than motor-routine."
  - "how does this compose with lex-n42kg reflection-in-action? RPD handles the cases where recognition delivers a workable action; lex-n42kg handles the cases where the situation talks back unexpectedly mid-execution and the frame needs revising. They are sequential phases: RPD-recognize → execute → (if back-talk arrives) reflection-in-action → reframe → RPD-recognize again on the reframed situation. The expert's full move-loop uses both."
  - "operationally distinct from lex-b2c6b live-adaptive-coupling-is-untransmittable: lex-b2c6b names the FACT that the live in-act expertise cannot be directly transmitted; lex-k6p4z names WHAT the live expertise actually does at the decision level. lex-b2c6b implies you can't ship an RPD library between practitioners; lex-k6p4z names what they have that won't ship. Pair: lex-b2c6b explains why mentorship is hard, lex-k6p4z explains what mentorship would need to convey if it could."
