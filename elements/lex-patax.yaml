id: lex-patax
name: desires-staged-chain-runs-from-dwelling-to-ruined-judgment
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when someone (including yourself) is choosing where to place vigilance against a desire, temptation, or compulsion: at the moment of dwelling on the tempting object, at the moment of feeling the pull, or only once the pull is already strong. The Bhagavad Gita (Book II, in the standard verse numbering II.62-63) states the mechanism as a fixed causal chain with named stages, not a single on/off switch: 'If one Ponders on objects of the sense, there springs Attraction; from attraction grows desire, Desire flames to fierce passion, passion breeds Recklessness; then the memory--all betrayed-- Lets noble purpose go, and saps the mind, Till purpose, mind, and man are all undone.' The chain has a specific order — DWELLING (sustained attention on the object, prior to any wanting) precedes ATTRACTION, which precedes DESIRE, which precedes PASSION, which precedes RECKLESSNESS, which precedes the collapse of memory/judgment ('purpose, mind, and man are all undone'). The operative claim this atom names is about WHERE to intervene, not merely that self-control can fail: the cheapest, easiest-to-win intervention point is the first stage (dwelling/contemplation), before attraction has even formed, because each subsequent stage recruits more of the agent's own cognitive machinery (memory, judgment, purpose) against the agent — by the recklessness stage, the very faculty that would ordinarily catch and correct the error (memory, 'betrayed') has already been co-opted. This reframes 'exercise more willpower in the moment of temptation' as a mistargeted intervention: the moment of strongest craving is the stage furthest from the cheap fix and closest to the point where corrective faculties are already compromised. The text explicitly does not counsel eliminating engagement with the senses altogether — the surrounding passage (II.64-65) describes the alternative not as avoidance but as engaging sense-objects 'not loving and not hating,' i.e. attention without fixation, which is compatible with continued action (compare the Gita's separate teaching at lex-7xz6k on acting without attachment to outcomes — a different mechanism: lex-7xz6k is about motivational orientation toward outcomes of action already undertaken, this atom is about where in a temporal escalation sequence to place vigilance against a specific desire before it compounds). Portable beyond personal temptation: any escalation process with named, ordered stages where later-stage intervention costs more than earlier-stage intervention because later stages corrupt the very apparatus that would notice and correct the escalation — conflict-of-interest policy (the point to intervene is before repeated informal contact with a vendor becomes a relationship that clouds judgment about the vendor, not once the contract is already favorable to them), relapse prevention (the point to intervene is at the 'seemingly irrelevant decision' — walking past the old bar — not at the drink already in hand), content-moderation and radicalization pipelines (the point to intervene is at sustained low-level exposure to an ideology's framing, not once identity is already fused to it), or scope creep in a project (the point to intervene is the first 'just dwelling on' an attractive tangent, not once sunk cost and momentum have built up). Recognize this whenever someone proposes to fix an escalation problem by strengthening resistance at its most intense, latest stage, and ask instead where the chain's ordering puts the cheapest available intervention."
related: [lex-mjav2, lex-v7ceq, lex-fjffq, lex-7xz6k, lex-2qekt, lex-ke8xx]
