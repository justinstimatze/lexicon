evokes: [merton-1957, hard-headed-instrumentalities, fdic, deliberate-institutional-change, vicious-circle, moral-sentiments-are-not-a-substitute, breaking-the-self-fulfilling-prophecy]
lineage:
  - source: primary
    text: merton-1957-moral-sentiments-not-a-substitute
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XI 'The Self-Fulfilling Prophecy,' p.424 (moral-sentiments framing) and p.434-435 (FDIC case). Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'In the social realm, no more than in the psychological realm, do false ideas quietly vanish when confronted with the truth. One does not expect a paranoiac to abandon his hard-won distortions and delusions upon being informed that they are altogether groundless. If psychic ills could be cured merely by the dissemination of truth, the psychiatrists of this country would be suffering from technological unemployment rather than from overwork.'"
  - source: primary
    text: merton-1957-fdic-bank-suspension-rates
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.434-435."
    quote: "'There are ample indications that a deliberate and planned halt can be put to the workings of the self-fulfilling prophecy and the vicious circle in society... During the fabulous '20's, when Coolidge undoubtedly caused a Republican era of lush prosperity, an average of 635 banks a year quietly suspended operations. And during the four years immediately before and after The Crash, when Hoover undoubtedly did not cause a Republican era of sluggish depression, this zoomed to the more spectacular average of 2,276 bank suspensions annually. But, interestingly enough, in the twelve years following the establishment of the Federal Deposit Insurance Corporation and the enactment of other banking legislation while Roosevelt presided over Democratic depression and revival, recession and boom, bank suspensions dropped to a niggardly average of 28 a year... millions of depositors no longer have occasion to give way to panic-motivated runs on banks simply because deliberate institutional change has removed the grounds for panic. Occasions for racial hostility are no more inborn psychological constants than are occasions for panic... These patterns of human behavior are largely a product of the modifiable structure of society.'"
canonical-instances:
  - "A platform running an awareness campaign against a rumor-driven bank-run-style withdrawal spiral is treating the symptom; instituting real-time proof-of-reserves or deposit insurance removes the structural reason the rumor would ever be worth acting on, the way FDIC did."
  - "An employer running unconscious-bias training to fix a hiring pipeline that structurally never sees qualified candidates from an excluded group (because past exclusion produced the credential gap the training-audience now points to as evidence) is applying moral suasion to a problem the union-exclusion case in the same chapter shows only breaks when the structural exclusion itself ends."
critical-questions:
  - "Merton frames moral appeals and structural change as substitutes, with structural change winning — but are there cases where structural change alone reliably fails without some accompanying shift in belief (e.g., structural desegregation that provokes backlash precisely because no persuasion accompanied it), making the two more complementary than the FDIC case suggests?"
  - "The FDIC case had an unusually clean, identifiable structural lever (deposit insurance). How does this generalize to cycles where the structural cause is diffuse or contested — does the prescription 'find the structural condition, not the belief' still give useful guidance when no single lever is visible?"
status: active
