    citation: "Two prior substrate hits for Lévi-Strauss: lex-68gd3 (Frazer 1922, collective-ills-transferred-to-a-scapegoat-then-expelled) grounds Frazer's Golden Bough scapegoat material and mentions neither Lévi-Strauss nor bricolage nor The Savage Mind — an unrelated false positive on a 'savage mind' substring match inside a Frazer quote. Lex-0672 (Lévi-Strauss 1949/1969, exchange-forced-by-prohibition-on-self-pairing-is-the-social-structure) grounds a different Lévi-Strauss book, The Elementary Structures of Kinship (1949), and a different theoretical claim entirely — that a prohibition on self-pairing (the incest taboo) forces cross-group exchange which constitutes social structure. It shares only the author, not the claim, the book, or the argument, and is included as a related-but-distinct atom with an explicit note rather than treated as a duplicate. A broader sweep of 16 further hits (lex-2zyhy, lex-zqf8z, lex-z9kmt, lex-94b62, lex-w5qfe, lex-gvg5j, lex-ct5ux, lex-vac6e, lex-y2tbg, lex-n42kg, lex-ksqk8, lex-jxaht, lex-f2rjs, lex-cdc5g, lex-u7aau, lex-sjyty) found the overwhelming majority to be unrelated false positives on the keyword match (Bergson's comedy-as-mechanical-encrustment, financial optionality, checklist-as-memory-prosthetic, Caillois's four vectors of play, ritual-invariant-form, parallel-modules-of-mind, bounded-daily-energy-units, and similar) — none shares Lévi-Strauss's specific claim. Two genuine near-neighbors: lex-jxaht (Sennett, skill-emerges-from-iterative-hand-head-dialogue) concerns the learning process by which skill develops through practice-reflection cycles — a different axis, skill acquisition over time, from bricolage's claim about the structure of an existing toolkit constraining a single act of problem-solving; distinct enough that no `related` entry was needed. Lex-0356 (Tilly, collective-action-draws-from-historically-constrained-culturally-transmitted-repertoire) is the one genuine structural cousin: Tilly's repertoire-of-contention is itself a bricolage-shaped object — a closed, historically-accumulated, slowly-changing stock that constrains what a collective actor can plausibly do, rather than fresh invention per occasion — but the claim is a descriptive and predictive political sociology of protest-tactic availability with no attached epistemic-parity thesis. Lévi-Strauss's claim is that bricolage-structured thought stands in rigorous parity with purpose-built scientific thought, not merely that repertoires constrain action; included in `related` with an explicit distinctness note covering both the resemblance and the difference. Lévi-Strauss's bricoleur/engineer distinction and the mythical/scientific-thought parity claim were previously ungrounded in the substrate."
canonical-instances:
  - "Lévi-Strauss's own paradigm case (*The Savage Mind*, pp. 16-19): the bricoleur, faced with a task, does not go out and acquire the ideal tool for it; he turns to his already-existing, contingently-accumulated stock of oddments and asks what each could be made to signify for the problem at hand — 'a particular cube of oak could be a wedge... or it could be a pedestal' — while the engineer defines the task first and then designs or procures the tools and materials specific to it."
  - "Dickens's Mr Wemmick, cited by Lévi-Strauss himself as an illustration (*Great Expectations*): Wemmick builds his suburban 'castle' — complete with a miniature drawbridge, a cannon fired at nine o'clock, and a bed of salad and cucumbers for a siege — entirely by inventive recombination of whatever domestic materials are already to hand, rather than by engineering a purpose-built fortification."
  - "Software 'hacky' prototyping vs. greenfield architecture: a team facing a deadline recombines whatever libraries, half-finished modules, and legacy scripts are already sitting in the codebase into a working (if inelegant) solution — bricolage-mode — versus a team that specifies requirements first and designs or acquires a purpose-built stack for exactly that specification — engineer-mode. Neither is a deficient version of the other; they are structurally different modes with different constraints and different failure modes."
  - "Jazz improvisation vs. classical composition: an improvising musician recombines a fixed, inherited vocabulary of licks, changes, and heads already in their repertoire in real time to fit the moment (bricolage-mode, in Lévi-Strauss's own analogical spirit), while a composer designs a structure note-by-note for a specific new work (engineer-mode) — with the further Lévi-Straussian point that neither mode is more 'rigorous' than the other, only differently constrained."
  - "François Jacob's 1977 'evolution as a tinkerer' (bricoleur) argument in biology, noted as a parallel rather than a claim that Lévi-Strauss originated it: natural selection cannot design an organ from scratch for a future function: it can only modify, repurpose, and recombine whatever structures and genes already exist in the lineage's inherited stock — Jacob's own explicit adoption of Lévi-Strauss's bricoleur/engineer vocabulary to describe how evolution is constrained by, and constructive with, its own contingent history."
critical-questions:
  - "Is the actor's set of means being defined by the CURRENT task (engineer-mode: tools and materials conceived and procured for this project) or by the CONTINGENT HISTORY of everything that happened to accumulate into the stock (bricolage-mode: 'whatever is at hand')? Lévi-Strauss's own diagnostic: could you explain the instrumental set by pointing to the project alone, or do you need to tell the set's own history?"
  - "Is a bricolage-structured result — myth, folk technique, retrofit, improvisation, vernacular design — being implicitly or explicitly ranked as a lesser, cruder draft of a properly engineered equivalent? That is precisely the primitive-vs-advanced hierarchy reading Lévi-Strauss's chapter exists to dismantle; his own preferred term is 'prior' science, not 'primitive' science, and his claim is PARITY of rigor, not developmental sequence."
  - "Is this actually Lévi-Strauss's specific claim (a mode-of-thought/mode-of-ordering distinction, with the mythical/scientific parity thesis attached), or a generic 'making do with limited resources' observation that a different atom better captures — Tilly's repertoire-of-contention (lex-94b62) for collective political tactic-availability, or a general resourcefulness/improvisation frame with no epistemic-parity claim at all?"
  - "Per Lévi-Strauss's own qualification: is the 'difference less absolute than it might appear' being respected — i.e., is the engineer/scientist also acknowledged as cross-examining finite resources (never wholly free of the bricoleur's condition) — or is the contrast being flattened into a clean binary the text itself resists?"
  - "Which of the two closing markers is actually doing the work in this case — CONCEPTS (open, in-principle-unlimited reference, engineer-mode) or SIGNS (concrete, limited, already-invested with prior use, bricoleur-mode)? Naming this distinction is often sharper than the raw 'improvised vs purpose-built' framing alone."
