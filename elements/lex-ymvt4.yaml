id: lex-ymvt4
name: differential-mating-success-is-a-selection-regime-distinct-from-survival
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When examining a trait, ask whether it routes through survival selection OR mating selection. Darwin's split: sexual selection produces traits that look maladaptive for survival (peacock tail) because mating-success is a parallel selection regime. Don't fit everything into the survival frame."
related: [lex-r3w25, lex-f74h5, lex-aufzn, lex-vk65z, lex-5kjya, lex-nfdyv, lex-eadyj, lex-rjf7d, lex-s22hf, lex-vjcwu, lex-qjkvn, lex-btfca, lex-u6sw3, lex-cat29, lex-5dnd9, lex-dwey5, lex-bdbb5, lex-c8jus]
scaffolds-from: [lex-5kjya, lex-vk65z, lex-nfdyv]
evokes: [sexual-selection, secondary-sexual-characters, mate-choice, male-male-combat, intersexual-selection, intrasexual-selection, handicap-principle, runaway-selection, sexual-dimorphism, bateman-principle]
lineage:
  - source: primary
    text: Darwin-1859-OnTheOriginOfSpecies-1stEd
    citation: "Charles Darwin, *On the Origin of Species by Means of Natural Selection* (Murray 1859, 1st ed). (PG #1228). Darwin's introduction of sexual-selection as a selection regime distinct from natural (survival) selection, developed at Chapter IV §'Sexual Selection'. Where natural selection acts on differential-survival (the substrate of lex-nfdyv), sexual-selection acts on differential-mating-success: 'This depends, not on a struggle for existence, but on a struggle between the males for possession of the females; the result is not death to the unsuccessful competitor, but few or no offspring.' Two mechanisms: (a) intrasexual — male-male combat for mating opportunities (horns, antlers, spurs, weapons), and (b) intersexual — female-choice via display (plumage, song, ornament). Sexual-selection can produce traits that REDUCE survival (the peacock-tail is the canonical example; Darwin himself noted these are 'less rigorous than natural selection' so the trait-elaboration can run counter to survival-fitness as long as the mating-payoff exceeds the survival-cost). Darwin extended the doctrine systematically in *The Descent of Man, and Selection in Relation to Sex* (1871 Murray), where the second half is devoted to sexual-selection across animal kingdoms. The transferable form: selection-regimes can be MULTIPLE and orthogonal — survival is one axis; differential-reproductive-success is another; they interact but are not reducible to each other, and trait-evolution under one regime can oppose trait-evolution under another."
    quote: "[Darwin 1859 Ch.IV 'Sexual Selection':2867-2898:] 'Sexual Selection. — Inasmuch as peculiarities often appear under domestication in one sex and become hereditarily attached to that sex, the same fact probably occurs under nature... And this leads me to say a few words on what I call Sexual Selection. This depends, not on a struggle for existence, but on a struggle between the males for possession of the females; the result is not death to the unsuccessful competitor, but few or no offspring. Sexual selection is, therefore, less rigorous than natural selection. Generally, the most vigorous males, those which are best fitted for their places in nature, will leave most progeny. But in many cases, victory will depend not on general vigour, but on having special weapons, confined to the male sex. A hornless stag or spurless cock would have a poor chance of leaving offspring.' [And on female-choice as the second mechanism:2900-2925:] 'Amongst birds, the contest is often of a more peaceful character. All those who have attended to the subject, believe that there is the severest rivalry between the males of many species to attract by singing the females... if man can in a short time give elegant carriage and beauty to his bantams, according to his standard of beauty, I can see no good reason to doubt that female birds, by selecting, during thousands of generations, the most melodious or beautiful males, according to their standard of beauty, might produce a marked effect.' [Practitioner-extraction: the transferable claim is that selection-regimes can be multiple and orthogonal. Survival-selection (lex-nfdyv) is one regime; mating-success-differential is another, can produce traits that REDUCE survival, and operates by distinct mechanisms (combat OR choice). The atom names the structural-fact of multiple-orthogonal-selection-regimes; the canonical biological instance is sexual-selection, but the form generalizes to any system with multiple selection-pressures that operate on distinct fitness-components.]"
  - source: practitioner
    text: cross-domain-multiple-orthogonal-selection-regimes-attestation
    citation: "Cross-domain attestation: (a) Fisher 1930 *The Genetical Theory of Natural Selection* Ch.6 — Fisherian runaway-selection mathematized Darwin's intuition: female preference for trait T + correlation between T and male genotype produces positive feedback. Once started, the elaboration of T can run far beyond any survival-utility, ending only when the survival-cost balances the mating-benefit at equilibrium. Fisher provided the formal model Darwin lacked. (b) Bateman 1948 'Intra-sexual selection in Drosophila' (Heredity) — Bateman's principle: in species with asymmetric parental investment (typically female-greater), the sex with greater investment becomes the limiting resource; the sex with lesser investment competes for access. This predicts which sex will be subject to sexual-selection in any species — typically males, but reversed in sex-role-reversed species (pipefish, jacanas, phalaropes). The structural-rule is investment-asymmetry-predicts-competition-direction, not 'males-always-compete.' (c) Trivers 1972 *Parental Investment and Sexual Selection* (in Campbell, ed.) — generalized Bateman: parental-investment ratio determines which sex experiences stronger sexual-selection. The unified theory of sexual-selection-via-investment-asymmetry is post-Darwin but completes his framework. (d) Zahavi 1975 handicap-principle (Journal of Theoretical Biology) — peacock-tail-style elaborations are honest-signals of underlying-quality because only high-quality individuals can afford the handicap. Connects sexual-selection to the broader costly-signaling theory at lex-5kjya. (e) Lek mating systems: sage grouse (Centrocercus urophasianus), manakins (Pipridae), prairie chickens (Tympanuchus cupido), peafowl. Males aggregate at display arenas (leks); females visit, observe displays, choose mates. Pure intersexual-selection with minimal male-male combat; the display IS the competition. Variance in male reproductive success is extreme (top 10% of males may sire 90% of offspring). (f) Sexual dimorphism patterns: where sexual-selection is strong, dimorphism is high (elephant seals — male 3-4x female body mass; peafowl — male iridescent + train, female cryptic; mandrills — male facial coloration). Where parental investment is equal and pair-bonds last, dimorphism is reduced (most monogamous birds, gibbons). The structural-pattern across species predicts where sexual-selection operates strongly. (g) Bowerbirds (Ptilonorhynchidae): male builds elaborate structure (bower) decorated with collected objects; female evaluates bower as proxy for mate-quality. The bower is purely intersexual-signal — has no survival-function and may actively harm survival (time-cost, attracting predators). Gilliard 1969 + Borgia 1985 work documents extreme bower-elaboration. (h) Antlers + horns + weapons: cervids (deer, moose, elk) — antlers grown + shed annually purely for male-male combat during rutting season. Cost is enormous (antlers can be 10% body-mass; growing them requires bone-marrow demineralization). The annual growth-cost is intrasexual-selection's substrate. Goss 1983 *Deer Antlers: Regeneration, Function, and Evolution*. (i) Stickleback fish (Gasterosteus aculeatus): male nuptial-coloration (red throat) drives female choice; lab-experiments by Bakker 1993 + others manipulate coloration and demonstrate causal effect on female-choice. Direct mechanistic confirmation of Darwin's female-choice hypothesis 134 years later. (j) Sexual-selection in HUMANS (substrate-cautious extension): Buss 1989 *Sex differences in human mate preferences* (Behavioral and Brain Sciences) — cross-cultural survey (37 societies) finds sex-differentiated mate-preferences consistent with parental-investment theory; Miller 2000 *The Mating Mind* hypothesizes human cognitive elaboration (art, music, humor, language-virtuosity) as sexually-selected display. The human-extension remains contested; Darwin himself extended in *Descent* but the transferable atom does NOT require human-validity — the biological-attestation alone is decisive."
    quote: "Transferable scope: applies wherever multiple-orthogonal-selection-regimes operate on distinct fitness-components. Operational diagnostic: (1) identify the fitness-component(s) under each regime — survival, reproduction, mating-success, kin-investment success, cultural-transmission success, etc. (2) ask: can a trait improve component-A while degrading component-B? If yes, the regimes are orthogonal (not perfectly correlated). (3) predict: at equilibrium, trait-distribution reflects the WEIGHTED combination of regime-pressures, with weights set by relative-fitness-contribution. (4) where one regime dominates, traits elaborate in its direction even at cost to others — peacock-tail elaborates because mating-selection dominates survival-selection in that lineage. The atom predicts: (i) trait-evolution often shows tension between multiple regimes, visible as 'over-elaboration' or 'inefficiency' from any single-regime perspective; (ii) which regime dominates is predictable from variance-in-fitness-component (high variance = strong selection); (iii) regime-orthogonality explains many 'maladaptive' traits that would be puzzling under single-selection-regime models. Transferable beyond biology: in cultural evolution (Henrich), in firm-evolution (the firm survives via product-quality but reproduces via investor-confidence — two regimes), in software-evolution (codebase survives via correctness but spreads via developer-ergonomics), in academic-careers (the work survives via citation but the career reproduces via prestige-signaling). Critical companion: lex-nfdyv names the survival-component (variation + differential-survival + inheritance); lex-ymvt4 adds the mating-component and the general-form of multiple-orthogonal-selection-regimes. Critical distinction from lex-5kjya costly-signaling: lex-5kjya is broader — any verification-via-cost mechanism. lex-ymvt4 is one specific BIOLOGICAL substrate that GENERATES costly-signaling dynamics within mating-competition. Sexual-selection produces costly-signals as instances; costly-signaling theory subsumes sexual-selection but the regime-orthogonality claim is sexual-selection's specific contribution. [synthesis 2026-05-26]"
canonical-instances:
  - "Darwin 1859 Ch.IV (canonical-case): sexual-selection introduced as distinct selection regime; Darwin's two-mechanism formulation (male-male combat AND female choice) anticipated all later refinements. The Origin treatment is brief; Descent of Man 1871 expands across all animal kingdoms. The doctrine was contested for ~100 years (female-choice especially was dismissed as anthropomorphic) before being broadly accepted in modern evolutionary biology."
  - "Peacock-tail (Pavo cristatus): canonical-example of sexual-selection producing trait counter to survival. The train is metabolically expensive to grow, attracts predators, impairs flight. Yet females consistently prefer males with larger + more-eyespotted trains. Petrie 1991 + Loyau et al. 2008 + others document the preference experimentally. The peacock-tail is the visible counterexample to 'all traits are survival-adaptive'."
  - "Bowerbird bowers (Ptilonorhynchidae): male builds + decorates elaborate structure; female visits + chooses based on bower-quality. Pure intersexual selection — bower has no survival-function and may harm survival (time, predator-attention). Borgia 1985 documents bower-features females discriminate on (decoration count, arrangement, color); the bower is purely-symbolic mating-display."
  - "Cervid antlers (deer, moose, elk): annual-grown + shed for male-male combat during rutting season. Antlers can be 10% body-mass; demineralizing bone for growth is metabolically severe. The annual growth-cost is intrasexual-selection's substrate. Goss 1983; Geist 1998. Antler-size correlates with rutting-success in many cervid species; selection drives elaboration despite survival-cost."
  - "Lek mating systems (sage grouse, manakins, prairie chickens, peafowl): males aggregate at display arenas; females visit + choose; mating variance is extreme (top 10% of males may sire 90% of offspring in some leks). Pure intersexual selection with minimal male-male combat. The strong female-choice + extreme male-variance is sexual-selection's most-acute substrate. Bradbury & Gibson 1983; Höglund & Alatalo 1995."
  - "Sexual dimorphism gradient: where sexual-selection is strong, dimorphism is high (elephant seals — male 3-4x female mass; mandrills — male facial coloration; peafowl). Where parental investment is equal and pair-bonds long, dimorphism is reduced (most monogamous birds, gibbons, swans). The dimorphism-pattern across species is a structural-fingerprint of sexual-selection's operation."
  - "Bateman 1948 + Trivers 1972: parental-investment-asymmetry predicts competition-direction. In species where one sex invests more (typically females via gametes + gestation + lactation), that sex becomes the limiting resource; the lesser-investing sex competes for access. Reversed in sex-role-reversed species (jacanas, phalaropes, pipefish — males brood; females compete). The structural-rule is investment-asymmetry-determines-competition-direction, not 'males-always-compete' — Darwin himself missed this generalization."
  - "Fisherian runaway-selection (Fisher 1930): female preference for trait T + correlation between T and male genotype produces positive feedback; trait elaborates until survival-cost balances mating-benefit. Mathematized Darwin's intuition; explains how sexual-selection can drive trait-elaboration far beyond any 'good genes' signal. Lande 1981 + Kirkpatrick 1982 provided modern quantitative-genetic formalizations."
  - "Zahavi 1975 handicap-principle: peacock-tail-style elaborations as honest-signals of underlying-quality — only high-quality individuals can afford the handicap. Connects sexual-selection to costly-signaling theory (lex-5kjya) more broadly. Grafen 1990 + Pomiankowski 1987 game-theoretic models confirmed Zahavi's intuition was formally valid."
  - "Stickleback nuptial-coloration (Bakker 1993; experimental): male red throat-coloration causally affects female mate-choice; manipulating coloration in lab manipulates female preference. Direct mechanistic confirmation of Darwin's female-choice hypothesis 134 years after Origin. Multiple species (sticklebacks, guppies, swordtails, mollies) provide modern experimental confirmation."
  - "Cultural-evolution analog (Henrich 2015 *The Secret of Our Success*): cultural-traits face survival-of-the-tradition AND reproduction-via-transmission. Some traits survive but don't transmit (idiosyncratic personal practices); some transmit but degrade their host (memes that spread by emotional-arousal at cost to bearer-fitness). The two-regime structure of biological sexual-selection generalizes to cultural-trait-evolution."
  - "operationally distinct from lex-nfdyv variation-plus-differential-survival-plus-inheritance: 0320 names the survival-selection regime (the original Origin Chs.III-IV mechanism). 0327 adds the SECOND regime (mating-differential) and the more-general claim that selection regimes can be multiple and orthogonal. 0320 + 0327 compose to form the full Darwinian theory; Darwin himself separated them across Ch.IV (the boundary between §'Natural Selection' and §'Sexual Selection') and across two books (Origin 1859 + Descent 1871)."
  - "operationally distinct from lex-5kjya costly-conspicuous-waste-as-status-signal: 0318 is broader — any verification-via-cost mechanism (Veblen's social-signaling, Spence's job-market-signaling, religious-sacrifice). 0327 is one specific BIOLOGICAL substrate that GENERATES costly-signaling dynamics within mating-competition. Sexual-selection produces costly-signals as instances (peacock-tail = honest-signal); costly-signaling theory subsumes sexual-selection but the regime-orthogonality claim is sexual-selection's specific contribution. They compose — Veblen anticipated Zahavi by 76 years because the underlying-structural-claim about cost-as-credibility is shared, but the biological mechanism + the multiple-orthogonal-regimes are distinct."
  - "operationally adjacent to lex-f74h5 authenticity-premium-rises-with-slop: 0287 names a signaling-equilibrium dynamic (counterfeit-rises → authentic-premium rises). 0327 explains one BIOLOGICAL source of the underlying-structural-pressure (mating-competition makes counterfeit-vs-authentic discrimination critical). They compose where biological mating-signals are subject to dishonest-mimicry (e.g., some fish species where smaller-males mimic female coloration to sneak-fertilize; the arms-race-with-counterfeit dynamic operates here)."
  - "operationally adjacent to lex-aufzn environment-conditions-shape-organism-trajectory-and-population-pattern: 0314 names environmental-substrate determining biological pattern; 0327 names internal-population-dynamic (mating-system structure) determining selection-pressure. They compose — environmental factors (resource-distribution, predation, climate) shape WHICH mating-system evolves (lekking, monogamy, harem), which then determines sexual-selection intensity. Emlen & Oring 1977 'Ecology, sexual selection, and the evolution of mating systems' (Science) formalizes the composition."
  - "operationally adjacent to lex-vk65z convergent-independent-evidence-streams-warrant-claim-acceptance: 0317 is Wegener's claim about evidence-aggregation. Sexual-selection itself is a case-study in 0317 — Darwin's claim was contested for ~100 years; acceptance came only after Fisher's mathematization + Bateman's investment-theory + decades of field-experimental work + game-theoretic formalization (Zahavi, Grafen) + mechanism-discovery (genetic-basis of preference, hormonal-regulation of display). The convergent streams eventually warranted acceptance; the 100-year-delay is a classic 0317 instance."
  - "operationally distinct from lex-r3w25 confirmation-filtered-tribal-perception: 0148 is about cognitive-filtering. 0327 is about selection-mechanism. They compose where mating-preferences themselves become filtered-perception (the female bowerbird's quality-evaluation IS a discrimination-mechanism), but the BIOLOGICAL substrate-claim is independent of the cognitive-perception claim."
critical-questions:
  - "is the mating-success differential ACTUALLY operating as a distinct selection-regime, or is it reducible to survival-correlated traits? Test: examine whether selected traits IMPROVE or DEGRADE survival in the same direction as mating-success. If a sexually-selected trait (e.g., peacock train) DEGRADES survival while INCREASING mating-success, the regimes are orthogonal. If sexual-selection just amplifies survival-selection (the most-vigorous males also mate most), the regimes are correlated and the distinct-regime claim is weaker. Darwin himself noted both patterns occur; the strong-claim (regimes ORTHOGONAL) requires the trade-off case."
  - "which sex experiences sexual-selection in a given species? Diagnostic via Bateman/Trivers: examine parental-investment ratio. The lesser-investing sex competes; the greater-investing sex chooses. Reversed in sex-role-reversed species (where male-investment > female-investment, females compete + are more-elaborated — jacanas, phalaropes, pipefish, seahorses). The 'males-compete-females-choose' pattern is the typical-case, not the universal-rule. Diagnostic: examine investment-asymmetry before predicting selection direction."
  - "is the female-choice mechanism HONEST-signaling (Zahavi) or arbitrary-runaway (Fisher)? Both can be evolutionarily-stable. Diagnostic: examine whether trait T correlates with underlying-quality (immune competence, parasite-load, genetic-diversity). If yes, honest-signal — choice for T is selection for quality. If trait T does NOT correlate with quality, runaway — the preference itself is the selection-pressure, with no quality-information. Modern empirical work (Petrie 1991 peacock-eyespots + offspring survival; Welch et al. 1998 grey tree frog calls + offspring quality) typically finds partial-honest-signal: trait carries some quality-information but is also elaborated by Fisherian runaway. Both mechanisms operate together in most cases."
  - "does the framework EXTEND to humans, or is human mate-choice culturally-overdetermined? Contested. Darwin extended in Descent of Man 1871. Modern proponents (Buss, Miller, Pinker) argue human mate-preferences show parental-investment-theory's predictions cross-culturally; critics (cultural-anthropology, feminist-evolutionary-biology — Hrdy, Fausto-Sterling) argue cultural-variation swamps biological-signal and that 'just-so' stories often replace empirical-test. The transferable form does NOT require human-validity to hold; biological-attestation across mammals + birds + insects + fish is decisive for the structural-claim. Human-extension is a separate empirical question."
  - "is the multiple-orthogonal-selection-regimes claim distinct from natural-selection-with-multiple-fitness-components? Subtly. Natural-selection-broadly can be defined to include all fitness-components (survival, mating, kin-investment, etc.). The atom's distinctive contribution is recognizing that fitness-components can TRADE-OFF — that improving one can DEGRADE another, and that the trade-off-equilibrium is the actual evolutionary outcome. Single-component models often miss this. Diagnostic: when 'why does this trait persist?' has no answer under any single fitness-component, examine whether the trade-off structure of multiple regimes explains it."
