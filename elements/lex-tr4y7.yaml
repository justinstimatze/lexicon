evokes: [merton-1957, lazarsfeld-and-merton-radio-film-propaganda, no-necessary-relation-to-truth-or-falsity, well-on-the-way-to-nihilism, propaganditis, sinkings-of-american-merchant-ships]
lineage:
  - source: primary
    text: merton-lazarsfeld-1957-propaganda-defined-by-controversy
    citation: "Robert K. Merton and Paul F. Lazarsfeld, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIV 'Studies in Radio and Film Propaganda,' p.509. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'We understand by propaganda any and all sets of symbols which influence opinion, belief or action on issues regarded by the community as controversial. These symbols may be written, printed, spoken, pictorial or musical. If, however, the topic is regarded as beyond debate, it is not subject to propaganda.'"
  - source: primary
    text: merton-lazarsfeld-1957-propaganda-and-falsity-are-not-one
    citation: "Robert K. Merton and Paul F. Lazarsfeld, Social Theory and Social Structure (1957), same chapter, p.509, immediately following."
    quote: "'In many quarters, propaganda is often identified with lies, deceit or fraud. In our view, propaganda has no necessary relation to truth or falsity. An authentic account of the sinkings of American merchant ships in time of war may prove to be effective propaganda inducing citizens to accept many deprivations which they would not otherwise accept in good spirit. If we succumb to the view that propaganda and falsity are one, we are well on the way to nihilism. Let us recognize also that an attitude of uncritical distrust may develop as a defense against the acceptance of deprivation or against a barrage of facts and information which invite fear, discomfort or the abandonment of cherished beliefs.'"
canonical-instances:
  - "A public health agency's accurate, verifiable statistics on a vaccine's side-effect rates are dismissed by a skeptical audience as 'just propaganda' because the agency has an obvious persuasive stake in the outcome — the content is true, but its controversial-issue framing and evident persuasive intent are enough to trigger the dismissal regardless of accuracy."
  - "A wartime government report honestly describing supply shortages, used to justify rationing, gets branded as manipulation by critics who assume any government messaging designed to change behavior must be dishonest — when the persuasive function and the truth of the content are actually independent variables."
critical-questions:
  - "If propaganda's definition rests on the issue being 'regarded as controversial' by the community, what happens as a topic's controversy status shifts over time — does the same true statement about a public health measure become 'propaganda' the moment it becomes politically contested, and stop being propaganda once consensus forms?"
  - "Does treating truth-value and persuasive-controversy-status as fully independent axes risk understating how often false content specifically exploits controversial topics, precisely because falsehood there is harder to check against a settled consensus?"
