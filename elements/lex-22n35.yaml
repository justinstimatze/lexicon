id: lex-22n35
name: mistreating-the-help-you-depend-on-to-convert-your-win-costs-everything
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Winning a hard victory doesn't end your dependency on others -- it often creates a new one, since converting a win into something usable frequently requires help you can't provide yourself, and how you treat that help matters more than the victory did. In Eastman's telling, a Field-Mouse genuinely defeats a Buffalo through real cunning, gnawing at it from inside its ears until it collapses -- an impressive win against overwhelming odds. But the Mouse cannot dress the carcass himself, so he recruits a starving Fox to do the actual labor of converting the kill into usable meat, promising payment. What follows is a study in escalating contempt exactly where dependency should produce fairness: the Fox does the full work and receives a small piece of liver; asks for more and is called greedy, given only blood clots; explains he has hungry children and a wife and is told, with visible irritation, he's already been overpaid, though he may take the feet; presses once more, citing genuine hardship, and is grudgingly allowed the head. Each escalation of the Fox's real, legitimate need is met with more contempt rather than more generosity, right up until the Fox -- who has done literally all the productive labor and been paid almost nothing -- simply takes the mouse's life instead. The Mouse's actual victory over the Buffalo was never the vulnerable point; his complete dependence on the Fox for every subsequent step, combined with his choice to spend that dependency relationship on stinginess and contempt rather than fair payment, is what ended him. Diagnostic move: after winning something you can't personally convert into usable value, notice exactly how much you now depend on whoever's help you need for that conversion -- and treat their legitimate, escalating need as information about how badly you need to keep them cooperative, not as an opportunity to extract more for less."
