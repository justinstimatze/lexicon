id: lex-dq2xc
name: creating-the-gap-you-later-get-credit-for-bridging
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A figure who causes a separation, a gap, a rupture between two things that used to be connected, can end up being the one specifically celebrated and relied upon for bridging that same gap afterward, so that the figure's usefulness as a solution obscures their authorship of the original problem. Hyde traces exactly this pattern across several mythologies: 'the gods lived on earth until something trickster did caused them to rise into heaven. Trickster is thus the author of the great distance between heaven and earth; when he becomes the messenger of the gods it's as if he has been enlisted to solve a problem he himself created.' The role trickster ends up occupying, the essential go-between who alone can carry messages across the new divide, wouldn't exist without the divide, and the divide wouldn't exist without trickster's own earlier action. His indispensability as messenger and his responsibility for the separation are the same fact viewed from two different points in the story. Diagnostic move: when evaluating someone's claimed indispensability as the one who bridges a gap or solves a persistent problem, check the history of how that gap or problem came to exist in the first place -- the same figure who benefits from being needed to cross a divide sometimes had a hand in creating it."
