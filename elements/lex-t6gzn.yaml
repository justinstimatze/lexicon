id: lex-t6gzn
name: reigniting-desire-for-what-they-stand-to-lose-redirects-someones-rage
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When someone''s fury at you is about to turn dangerous, don''t plead or argue against the anger directly — vividly remind them of something else they love and stand to lose if they harm you, describing it richly enough that longing displaces rage. Fear of losing the thing eclipses anger at the person who can still get it back for them. In the Maha-Ummagga-Jataka, King Culani, enraged that Mahosadha helped his enemy escape, orders Mahosadha flayed alive. Rather than defend himself, Mahosadha describes the captured Queen Nanda in loving physical detail, "as though he had never seen her before": "This way, sire, went the woman beauteous in every limb, her lips like plates of gold, her voice like the music of the wild goose." The king''s "great longing arose in him," and his fury dissolves into dependence — only Mahosadha can bring her back.'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, redirect-rage, loss-aversion, reignite-longing]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: 'This way, sire, went the woman beauteous in every limb, her lips like plates of gold, her voice like the music of the wild goose.'
canonical-instances:
  - "A CEO furious at a consultant for a costly recommendation is about to fire her on the spot; rather than defending the recommendation, she reminds him in specific, vivid detail of the acquisition deal still in progress that only her team's due diligence can close in time — his anger about the sunk cost gives way to fear of losing the deal itself."
  - "A parent enraged at a coach for benching their child during a tournament is calmed not by an apology, but by the coach describing, in detail, the specific scholarship scouts in attendance that game and what the child stands to gain if the parent doesn't cause a scene that gets them both ejected."
critical-questions:
  - "This depends on the angry person genuinely caring more about the reignited object of desire than about punishing you — does it work at all against someone whose anger is really about principle or pride rather than loss?"
  - "Deliberately manipulating someone's emotional attachment to redirect their anger raises its own ethical question: is defusing danger this way meaningfully different from other forms of emotional manipulation, or does the immediate safety justification excuse it?"
status: active
