id: lex-7t4yw
name: what-two-tellers-add-to-the-same-fixed-material-reveals-their-temperament
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When two people who learned the same fixed material from the same source produce versions that differ only in a few specific additions, those additions are diagnostic of the individual, not accidents of imperfect memory, and figuring out why each person added what they added tells you more about them than asking whether they remembered correctly. Radin states this as a general principle before giving the evidence: variation between tellings 'must not be dismissed as accidental or as due necessarily to a faulty recounting of the myth or myth-cycle. It generally had some real significance.' His case in point is two Winnebago brothers, Sam and Jasper Blowsnake, who both learned The Twin Myth from their own father and produced versions differing by only a couple of episodes. What Sam added wasn't random: 'The first was introduced to add a humorous note to a humourless plot, the second, to bring the heroes of the myth into relationship with certain hero-deities in order to increase the prestige of the former.' Those specific additions track directly onto who Sam was: 'facile of speech, sociable, superficial, selfimportant... fundamentally a nonconformist,' while Jasper, 'deeply religious, a complete conformist, insistent upon transmitting what he knew as faithfully, indeed, as meticulously as possible,' added nothing that departed from tradition at all. The same source material, filtered through two different temperaments, left two different, individually explicable fingerprints. Diagnostic move: when comparing two authorized accounts of the same fixed material, don't treat the differences as error to average out or discard -- ask what each specific addition or omission was doing for the person who made it, since that's where the more informative signal actually lives."
