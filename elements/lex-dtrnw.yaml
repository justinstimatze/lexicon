    quote: "All the year long never ceasing with unwearied diligence Where the sweet grass grows in clusters day by day he practised it: When he came amid the courtiers all at once he changed the sense; Practice truly nought availeth if a man has little wit."
canonical-instances:
  - "A job candidate rehearses answers to interview questions for weeks with a supportive friend playing the interviewer, and then freezes and gives the exact opposite of a prepared answer the moment a real hiring panel's silence and note-taking triggers a panic the friend's encouraging nods never simulated."
critical-questions:
  - "Was the actual missing variable social panic specifically, or could any sufficiently different context — unfamiliar surroundings, time pressure, an audience — have produced the same collapse regardless of whether the rehearsal partner was human or a labeled tuft of grass?"
  - "Is there a way to rehearse that would have actually transferred here, or does this kind of failure mode suggest some skills simply cannot be practiced in a lower-stakes proxy no matter how faithfully the words are reproduced?"
