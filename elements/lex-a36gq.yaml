id: lex-a36gq
name: an-affect-laden-word-sense-drives-its-neutral-homonym-out-of-circulation
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a word carries two established senses — one emotionally neutral and technical, the other charged with political or moral controversy — expect the charged sense to dominate and eventually crowd out the neutral one from ordinary use, purely because of its greater affective salience, independent of which sense is more valid, more established, or more precise. Merton observes this happening to 'socialization' itself: the sociological and psychological sense of the term predates and is unrelated to the economic/political sense (the 'nationalization' of industry), yet 'the \"socialization of medicine\" is a matter of great and acrimonious controversy, which for many is charged with intense feeling and passion. Such affect-laden words seem to have a way of driving their affectively-neutral and therefore dull homonyms out of circulation.' The mechanism he identifies is a reflexive word-association trained by repeated controversy: '\"socialized medicine\" has become so much the stereotyped phrase that, in some quarters, the first word almost invariably produces the second, both among those who oppose and those who support certain kinds of arrangements for the distribution of medical care by physicians.' Notably, Merton proposes that simply naming the reflex to a reader is itself a partial countermeasure: 'To recognize this tendency in the use of language may perhaps be enough to nullify it — or, less optimistically, to put it in question.' The asymmetry is the whole point: a technical, emotionally flat meaning has no built-in defense against being overwritten in the popular mind by a louder, more contested meaning that happens to share its spelling — vividness and controversy win the word, regardless of which sense came first or which is more rigorously defined. Diagnostic move: when a technical or specialist term shares its spelling with a politically or emotionally charged popular usage, expect the charged usage to dominate any general audience's first reaction, and expect this to worsen over time as repeated exposure trains the reflex more strongly — the fix is not to argue that the technical sense is 'more correct,' but to explicitly flag the homonymy up front, before the charged association can auto-complete the reader's interpretation."
