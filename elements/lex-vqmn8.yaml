id: lex-vqmn8
name: shared-immaterial-goods-multiply-rather-than-divide
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern whenever someone treats a good as necessarily diminished by being shared — assuming, by analogy with material or positional goods, that more claimants must mean a smaller portion for each — and check whether the good in question is actually generated by the desire and reciprocal engagement of its participants rather than drawn from a fixed antecedent stock. Dante's Purgatorio Canto XV states this exactly. Ascending from the terrace of Envy, Dante asks Virgil why a companion's warning against envy implied that shared goods are diminished by more sharers: 'How can it be, that boon distributed / The more possessors can more wealthy make / Therein, than if by few it be possessed?' Virgil identifies the error as a category-transfer from earthly to non-earthly goods: 'Because thou fixest still / Thy mind entirely upon earthly things, / Thou pluckest darkness from the very light.' He then gives the mechanism: charity is not a stock to be portioned out but a process that runs toward whatever ardour receives it and intensifies through reciprocal engagement — 'So much it gives itself as it finds ardour, / So that as far as charity extends, / O'er it increases the eternal valour. / And the more people thitherward aspire, / More are there to love well, and more they love there, / And, as a mirror, one reflects the other.' The mechanism: a material or positional good (a fixed sum of money, a single throne, a ranking) has its quantity fixed independent of the claimants, so each additional claimant necessarily reduces the others' share — this is the correct model for RIVALROUS goods, and Dante's Purgatorio explicitly places the terrace of Envy immediately before this exchange because envy is precisely the fear-response appropriate to rivalrous goods, mistakenly applied to a non-rivalrous one. But some goods (love, understanding, a shared practice, a body of open knowledge, a culture of trust) are not drawn from a fixed stock at all — they are generated BY the participants' desire for and engagement with them, so that each new participant's reception adds to rather than subtracts from the total, and the participants' mutual engagement ('as a mirror, one reflects the other') further amplifies rather than depletes the good. Portable beyond the theological case: a team's shared understanding of a hard problem does not shrink as more members come to understand it — each new understander can explain it to others, catch errors, and extend it, so total institutional understanding grows with participation; a culture of trust within an organization is not a fixed pool split among members but a pattern of reciprocal expectation that strengthens as more people act in accordance with it and weakens only through defection, not through more people relying on it; open-source knowledge and open scientific findings do not become scarcer as more people learn and build on them. Diagnostic: before assuming that extending a good to more people necessarily reduces what current holders receive, check whether the good's quantity is fixed independent of participation (rivalrous — division is the correct model) or whether the good's quantity is itself a function of participants' engagement (non-rivalrous — multiplication is the correct model). Applying the rivalrous-good's scarcity logic to a non-rivalrous good manufactures unnecessary zero-sum anxiety and can motivate exactly the exclusionary, envious behavior that actually would impoverish everyone by shrinking participation."
related: [lex-3qnt2, lex-96xn9, lex-e3uc6, lex-xehnw]
evokes: [purgatorio-canto-xv, virgils-answer-to-envy, more-people-thitherward-aspire, as-a-mirror-one-reflects-the-other, charity-runs-to-ardour, rivalrous-vs-nonrivalrous-good, sharing-multiplies-rather-than-divides, sound-fills-the-ears-of-many-without-being-broken-into-parts]
lineage:
  - source: primary
    text: dante-purgatorio-canto-xv-shared-goods-multiply
    citation: "Dante Alighieri, Purgatorio, Canto XV (part 2 of the Divina Commedia, composed c. 1308-1320), trans. Henry Wadsworth Longfellow (Boston: Ticknor and Fields, 1867; Project Gutenberg eBook #1004, 'Divine Comedy, Longfellow's Translation, Complete' — the same PD edition already grounding the Inferno mining pass). Ascending past the terrace of Envy, Dante asks Virgil to explain a fellow penitent's remark that companionship lessens each person's share of a good; Virgil corrects the earthly-goods analogy and explains that goods rooted in love are generated by, not divided among, their participants."
    quote: "[Dante's question:] 'How can it be, that boon distributed / The more possessors can more wealthy make / Therein, than if by few it be possessed?' [Virgil's correction of the category-transfer:] 'Because thou fixest still / Thy mind entirely upon earthly things, / Thou pluckest darkness from the very light.' [Virgil's mechanism:] 'That goodness infinite and ineffable / Which is above there, runneth unto love, / As to a lucid body comes the sunbeam. / So much it gives itself as it finds ardour, / So that as far as charity extends, / O'er it increases the eternal valour. / And the more people thitherward aspire, / More are there to love well, and more they love there, / And, as a mirror, one reflects the other.'"
  - source: primary
    text: boethius-c524-consolation-of-philosophy-book-ii-prose-v
    citation: "Boethius, The Consolation of Philosophy (c. 524 AD), trans. H. R. James (London: George Bell & Sons, 1897), Book II, Prose V. METHODOLOGICALLY-DISTINCT SECOND PRIMARY, roughly eight centuries before Dante and arguing the mirror-image rivalrous case: where Dante's Virgil establishes that a non-rivalrous good (charity) multiplies through participation, Boethius's Philosophy independently reaches the same rivalrous/non-rivalrous distinction from the opposite direction, using sound as the non-rivalrous contrast case against money as the rivalrous one. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "Sound fills the ears of many at the same time without being broken into parts, but your riches cannot pass to many without being lessened in the process. And when this happens, they must needs impoverish those whom they leave. How poor and cramped a thing, then, is riches, which more than one cannot possess as an unbroken whole, which falls not to any one man's lot without the impoverishment of everyone else!"
canonical-instances:
  - "Boethius states the rivalrous side of the same distinction some eight centuries before Dante: unlike sound, which 'fills the ears of many at the same time without being broken into parts,' riches 'cannot pass to many without being lessened in the process,' so the fullest possible concentration of a rivalrous good is also its maximum impoverishment of everyone else."
  - "The direct textual anchor: Dante asks why sharing a good should not diminish each sharer's portion; Virgil explains that goods rooted in love are generated by participants' mutual ardour rather than drawn from a fixed stock, so more participants produce more good rather than a smaller share each."
  - "A team's shared understanding of a hard technical problem does not shrink as more members come to understand it — each new understander can explain it to others, catch errors the first understander missed, and extend the understanding further, so total institutional understanding grows rather than divides with participation."
  - "A culture of trust within an organization is not a fixed pool split among members but a pattern of reciprocal expectation that strengthens as more people act in accordance with it; unlike a scarce resource, trust is depleted by defection, not by having more people rely on it."
critical-questions:
  - "isn't this the same as lex-3qnt2 (Carse's power-vs-strength, strength grows when shared)? No — lex-3qnt2 is a capacity-typology for AGENTS (an actor's own capability is stronger when they develop it in others, vs. weaker when they hoard control); it concerns what happens to ONE actor's capacity when they choose to share it. This atom concerns the STRUCTURE OF THE GOOD ITSELF, independent of any single actor's choice to share or withhold — the question is whether the good's total quantity is fixed (rivalrous) or generated by participation (non-rivalrous), a claim about the good, not about a sharer's strategy. They compose: a strength-developing actor (lex-3qnt2) is one who correctly recognizes they are dealing with a non-rivalrous good (lex-vqmn8) and acts accordingly, rather than hoarding it as if it were rivalrous."
  - "isn't this just describing envy (lex-xehnw)? No — lex-xehnw names the targeting structure of envy itself (it tracks visible, proximate advantage, not absolute magnitude). This atom names the STRUCTURAL MISTAKE that makes envy's zero-sum fear misapplied to a specific class of goods: envy's scarcity-logic is the correct response to a genuinely rivalrous good, but becomes a category error when applied to a non-rivalrous one. Dante's poem places them adjacently for exactly this reason — this atom is the corrective lens for the terrace envy occupies just below it."
  - "how do you tell, in practice, whether a given good is rivalrous or non-rivalrous? Check whether the good's total quantity is fixed independent of the participants (a single prize, a finite budget, a ranked position — rivalrous) or whether the good's quantity is itself produced by participants' desire for and engagement with it (understanding, trust, a shared practice, love, most forms of open knowledge — non-rivalrous). A useful test: does adding a new, genuinely engaged participant ever, by the good's own nature, reduce what a prior participant already has? If the mechanism by which the good exists requires reciprocal engagement to increase it (as with the mirror-effect Dante describes), it is non-rivalrous."
  - "does this atom claim no goods are genuinely scarce, or that scarcity-thinking is always wrong? No. Material goods, finite budgets, and single positions genuinely are diminished by more claimants, and the division-model is correct for them. The atom's claim is narrower: some goods are NOT of that kind, and treating them as if they were manufactures unnecessary zero-sum anxiety, and can motivate the very exclusionary behavior that would actually shrink the good by suppressing the participation that generates it."
