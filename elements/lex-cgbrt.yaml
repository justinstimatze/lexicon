id: lex-cgbrt
name: outward-distraction-is-sought-to-avoid-contemplation-of-own-condition
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when activity (scrolling, work, achievement-chasing, consumption, conversation, entertainment) is explained by its ostensible reward when the actual driver is AVOIDANCE of attending to one's own condition. Pascal's transferable contribution: humans systematically manufacture OUTWARD distraction not because the ostensible object is desired but because IDLE ATTENTION to one's own state surfaces the unbearable — mortality, finitude, dissatisfaction, the void underneath all conditional satisfactions. Pascal's crucial diagnostic: `All the unhappiness of men arises from one single fact, that they cannot stay quietly in their own chamber.` The hunter does not want the hare; he wants the chase that prevents him from thinking about what he is. The diagnostic test: ask why a person seeks the activity; their answer points to the ostensible reward (winning, novelty, status); test by asking what would happen if they got the ostensible reward and could then rest — if the answer is `I'd seek the next thing,` the activity is divertissement. Transferable applications: (a) attention-economy products (social media + streaming + games + endless-scroll UX explicitly engineer divertissement at population scale; Wu 2016 *The Attention Merchants*; Zuboff 2019 *Surveillance Capitalism*); (b) workaholism + busy-cult corporate culture (work as divertissement from non-work confrontation; Schor 1992 *The Overworked American*; Schulte 2014 *Overwhelmed*; Petersen 2020 *Can't Even*); (c) compulsive shopping + consumption (Veblen 1899 lex-5kjya status-signaling composes; but divertissement is distinct mechanism — buying as activity itself, not the goods); (d) workout/wellness/optimization culture (the project of optimizing the self as divertissement from being the self); (e) addiction patterns generally (Marlatt 1985 composes with lex-5tpy8 multi-self; lex-cgbrt names the FUNCTION the addiction serves); (f) news-cycle attention (the continuous outrage-news refresh as divertissement); (g) phone-checking + email-refresh (the act, not the content); (h) overproduction + content-creation (the activity of making more as divertissement); (i) hyperscheduled-childhood (the parental project of filling the child's hours as protection-against-self-confrontation in the child + in the parent); (j) AI-companion + parasocial-relationship technology (24/7 availability of conversation-partner as divertissement infrastructure). The atom claims the AVOIDED THING is contemplation of one's own condition — mortality, finitude, the absence of stable ground for happiness in conditional outcomes. The atom does NOT claim all activity is divertissement (Pascal explicitly says contemplation has its own real value; productive work has its own real ends). The diagnostic distinguishes activity-with-real-ends from activity-functioning-as-distraction. Distinct from lex-rgr3t habit-formation-frees-attention (habits free attention for higher work; lex-cgbrt names a specific kind of attention-spending that doesn't free anything). Distinct from lex-y6xy9 gumption-as-engagement-reservoir (about energy + traps in genuine work). Distinct from lex-agefm committee-attention-clusters-on-easily-graspable (collective-attention failure mode). Distinct from lex-rfcb7 + lex-5tpy8 (commitment-devices + multi-self structure — those are about volitional conflict; lex-cgbrt is about the SHAPE the multi-self conflict takes — one will is the contemplation-avoider, the other is the contemplation-doer). Composes with lex-5tpy8 + lex-rfcb7. Use when (i) someone explains compulsive activity by its ostensible reward when the actual driver is avoidance, (ii) attention-economy critique requires understanding why users adopt the products against their own stated preferences, (iii) you are designing intervention for compulsive activity + must address the underlying avoidance, not just the surface activity. Counter-move: ask what the activity would NOT have to face if continued indefinitely; ask whether the person could sit quietly in a room for an hour; name the avoided condition + offer it as the actual target of work."
