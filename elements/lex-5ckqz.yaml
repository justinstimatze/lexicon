lineage:
  - source: primary
    text: frye-1957-anatomy-of-criticism
    citation: "Northrop Frye, Anatomy of Criticism: Four Essays (Princeton University Press, 1957; Princeton Classics edition with a new foreword by David Damrosch, 2020), Third Essay, 'Archetypal Criticism: Theory of Myths,' comprising the 'Theory of Mythos: Introduction' and the four section-chapters 'The Mythos of Spring: Comedy,' 'The Mythos of Summer: Romance,' 'The Mythos of Autumn: Tragedy,' and 'The Mythos of Winter: Irony and Satire,' plus the book's own closing Glossary. Frye's argument: beneath the ordinary genre-labels of literature lie exactly four 'narrative pregeneric elements... mythoi or generic plots' — comedy, romance, tragedy, and irony/satire — each correlated with a phase of the natural/seasonal cycle and each defined by a distinct structural relation between protagonist and society: comedy moves the protagonist INTO a renewed, more inclusive society (a blocked, usurping older order displaced, sealed by marriage or festival); romance moves the protagonist THROUGH an agon-pathos-anagnorisis quest sequence toward an idealized, elevated fulfillment; tragedy moves the protagonist OUT of society into isolation and fall from a precariously exceptional position ('the top of the wheel of fortune'); irony and satire DIMINISHES the protagonist relative to the reader's own freedom and judgment, structurally a parody of romance applied to degraded or unidealized content. Frye maps the four onto a single unifying myth via their own archetypal themes (agon/romance, pathos/tragedy, sparagmos/irony, anagnorisis/comedy) and insists the four are positions on a cyclical wheel, not an unordered list: the adjacent pairs (comedy-romance, romance-tragedy-adjacent, tragedy-irony, irony-comedy) blend into one another while only the diagonal pairs (comedy/tragedy, romance/irony) genuinely contrast, and the historical sequence of literary modes, having moved from myth toward increasing realism, curves back toward myth again with irony. The claim is explicitly a structural grammar underlying all narrative — genres, whole works, and individual scenes can each be read as participating in, or transitioning between, one or another mythos — not a taxonomy applied to existing literature after the fact."
    quote: "[Third Essay, 'Theory of Mythos: Introduction':] 'We have thus answered the question: are there narrative categories of literature broader than, or logically prior to, the ordinary literary genres? There are four such categories: the romantic, the tragic, the comic, and the ironic or satiric... We thus have four narrative pregeneric elements of literature which I shall call mythoi or generic plots.' [Same section, the seasonal/wheel framing:] 'The top half of the natural cycle is the world of romance and the analogy of innocence; the lower half is the world of \"realism\" and the analogy of experience. There are thus four main types of mythical movement: within romance, within experience, down, and up. The downward movement is the tragic movement, the wheel of fortune falling from innocence toward hamartia, and from hamartia to catastrophe. The upward movement is the comic movement, from threatening complications to a happy ending and a general assumption of post-dated innocence in which everyone lives happily ever after.' [Same section, the blend-vs-contrast claim:] 'If we think of our experience of these mythoi, we shall realize that they form two opposed pairs. Tragedy and comedy contrast rather than blend, and so do romance and irony, the champions respectively of the ideal and the actual. On the other hand, comedy blends insensibly into satire at one extreme and into romance at the other; romance may be comic or tragic; tragic extends from high romance to bitter and ironic realism.' [First Essay, on the cycle closing back toward myth:] 'Reading forward in history, therefore, we may think of our romantic, high mimetic and low mimetic modes as a series of displaced myths, mythoi or plot-formulas progressively moving over towards the opposite pole of verisimilitude, and then, with irony, beginning to move back.' [Section-chapter titles, the seasonal correlation itself:] 'THE MYTHOS OF SPRING: COMEDY' / 'THE MYTHOS OF SUMMER: ROMANCE' / 'THE MYTHOS OF AUTUMN: TRAGEDY' / 'THE MYTHOS OF WINTER: IRONY AND SATIRE.' [Comedy, on the movement between societies:] 'the movement of comedy is usually a movement from one kind of society to another. At the beginning of the play the obstructing characters are in charge of the play's society, and the audience recognizes that they are usurpers. At the end of the play the device in the plot that brings hero and heroine together causes a new society to crystallize around the hero, and the moment when this crystallization occurs is the point of resolution in the action, the comic discovery, anagnorisis or cognitio.' [Comedy, on its ternary form:] 'The total mythos of comedy... has regularly what in music is called a ternary form: the hero's society rebels against the society of the senex and triumphs, but the hero's society is a Saturnalia, a reversal of social standards which recalls a golden age in the past before the main action of the play begins. Thus we have a stable and harmonious order disrupted by folly, obsession, forgetfulness, \"pride and prejudice,\" or events not understood by the characters themselves, and then restored.' [Romance, on the three-stage quest:] 'The complete form of the romance is clearly the successful quest, and such a completed form has three main stages: the stage of the perilous journey and the preliminary minor adventures; the crucial struggle, usually some kind of battle in which either the hero or his foe, or both, must die; and the exaltation of the hero. We may call these three stages respectively, using Greek terms, the agon or conflict, the pathos or death-struggle, and the anagnorisis or discovery.' [Romance, on the cyclical poles mapped onto hero and enemy:] 'The enemy is associated with winter, darkness, confusion, sterility, moribund life, and old age, and the hero with spring, dawn, order, fertility, vigor, and youth.' [Tragedy, on the wheel of fortune and isolation:] 'The tragic hero is typically on top of the wheel of fortune, halfway between human society on the ground and the something greater in the sky... the center of tragedy is in the hero's isolation, not in a villain's betrayal, even when the villain is, as he often is, a part of the hero himself.' [Tragedy, on hamartia reframed as structural condition rather than moral flaw:] 'Aristotle's hamartia, then, is a condition of being, not a cause of becoming... Every natural man is a Hegelian thesis, and implies a reaction: every new birth provokes the return of an avenging death.' [Tragedy, on its binary structure contrasted with comedy's ternary structure:] 'This happens so often that we may almost characterize the total mythos of tragedy as binary, in contrast to the three-part saturnalia movement of comedy.' [Irony and Satire, on the parody-of-romance structure:] 'As structure, the central principle of ironic myth is best approached as a parody of romance: the application of romantic mythical forms to a more realistic content which fits them in unexpected ways.' [Irony and Satire, on the irony/satire distinction:] 'The chief distinction between irony and satire is that satire is militant irony: its moral norms are relatively clear, and it assumes standards against which the grotesque and absurd are measured... on the other hand, whenever a reader is not sure what the author's attitude is or what his own is supposed to be, we have irony with relatively little satire.' [Romance-section, the four archetypal themes mapped onto the four mythoi as one unifying myth:] 'The four mythoi that we are dealing with, comedy, romance, tragedy, and irony, may now be seen as four aspects of a central unifying myth. Agon or conflict is the basis or archetypal theme of romance, the radical of romance being a sequence of marvellous adventures. Pathos or catastrophe, whether in triumph or in defeat, is the archetypal theme of tragedy. Sparagmos, or the sense that heroism and effective action are absent, disorganized or foredoomed to defeat, and that confusion and anarchy reign over the world, is the archetypal theme of irony and satire. Anagnorisis, or recognition of a newborn society rising in triumph around a still somewhat mysterious hero and his bride, is the archetypal theme of comedy.' [Book's own closing Glossary, the crispest single-line statement of the whole scheme:] 'MYTHOS: (1) The narrative of a work of literature... (2) One of the four archetypal narratives, classified as comic, romantic, tragic, and ironic.'"
