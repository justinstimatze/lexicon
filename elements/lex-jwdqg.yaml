evokes: [popper-history-of-our-time-optimists-view, dictators-pay-homage-to-the-goodness-of-man, communism-and-nationalism-as-moralities, lip-service-to-a-morality-not-believed-in]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The History of Our Time: An Optimist's View' (the Sixth Eleanor Rathbone Memorial Lecture, delivered at the University of Bristol, October 12, 1956), Ch. 19 of Conjectures and Refutations (Routledge Classics, 2002), p.495."
    quote: "'We see how important this aspect of our troubles is if we remember that the great dictators were all forced to pay homage to the goodness of man. They were forced to pay lip-service to a morality in which they did not believe. Communism and nationalism are both believed in as moralities and religions. This is their only strength. Intellectually they border on absurdity.'"
canonical-instances:
  - "A predatory multi-level-marketing company recruits its sales force not with a pitch about wealth extraction, but with a message about financial independence, personal empowerment, and escaping a corrupt corporate system. The executives running the company may not believe a word of it; the recruits joining it are responding entirely to the moral story, which is exactly why exposing the founders' private cynicism rarely stops new recruits from signing up."
  - "A cult leader who privately treats followers as a source of money and labor still frames every demand -- surrendering income, cutting off family, extreme obedience -- as a path to spiritual purity or collective salvation. The followers making real sacrifices are responding to that claimed morality. That's why evidence of the leader's personal corruption so often fails to shake anyone who was already committed."
critical-questions:
  - "Doesn't this let followers off the hook too easily, treating them as passive dupes of a moral pitch rather than people who chose to participate? Followers can still bear real responsibility for what they do. The narrower claim is about mechanism: recruitment and continued participation run through a claimed morality rather than through an accurate appraisal of leadership's private beliefs, and moral accountability for the choice to participate is a separate question from what actually motivated it."
  - "If exposing the leaders' cynicism doesn't work on followers, what does? The diagnostic points elsewhere: at the moral claim itself, not at the character of whoever is making it. Attacking the claimed morality's actual content and consequences engages the thing followers are responding to; attacking the leader's sincerity mostly misses, since sincerity was never the basis of the followers' commitment."
