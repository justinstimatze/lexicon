    text: eastman-wood-chopper-berry-picker-refuses-to-guess-among-identical-bears
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Eighteenth Evening: Wood-Chopper and Berry-Picker.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'As the stranger drew near, every young woman in the great camp came running to meet him. They all looked alike... and they all crowded about him... crying: \"Welcome home, my husband!\" Now the young man became very angry, for he knew that the Bears were trying to deceive him, and that if he did not know his own wife, they would take his life. He took no notice of any of the young women, but turned his back on the village and went home to his own country.'"
canonical-instances:
  - "A hiring manager presented with two candidates whose interview performances, references, and portfolios are genuinely indistinguishable on every available signal declines to make the hire at all and reopens the search, rather than flipping a coin between them and treating whichever answer they pick as though it were based on real evidence."
  - "An investor asked to choose between two competing crypto projects with identical whitepapers, nearly identical teams, and no verifiable track record for either declines to invest in either one, recognizing that picking one and rationalizing the choice afterward would be indistinguishable from a coin flip dressed up as due diligence."
critical-questions:
  - "is walking away always actually available -- what happens when the situation forces a choice regardless (a forced marriage, a mandatory vote, a decision that must be made by a deadline), leaving 'decline to choose' as an option the framework assumes exists but reality doesn't offer?"
  - "how confident can someone actually be that a test is truly unverifiable rather than merely difficult -- does walking away too readily risk abandoning situations that a more careful, patient search for a distinguishing signal could actually have resolved?"
  - "does refusing to guess ever cost more than a wrong guess would have -- in this story walking away preserves the man's life and lets him search again, but are there situations where declining to choose forecloses the only chance at a good outcome entirely, unlike a wrong guess which might still be survivable?"
