    quote: "So to the woods he went, but he kept returning through fear of death and going back to the wood through fear of shame. And in this way six days passed by. The grass died as he walked, and his feet wore away a path."
canonical-instances:
  - "An executive facing a board meeting where they must either admit a costly failure or continue a doomed cover-up spends the night pacing between drafting a resignation letter and drafting a defense of the project, unable to finish either because each option only feels tolerable in the brief moment before its own consequences come into focus."
critical-questions:
  - "What eventually broke this kind of paralysis in the musician's case, and does the resolution depend on outside intervention — Sakka's help — suggesting this particular deadlock may not be something a person can resolve alone from inside it?"
  - "Is six days an unusually long time to sustain this oscillation, or is the specific duration less important than the underlying shape — does the paralysis end only when one fear is somehow reduced, or can it also end from sheer exhaustion regardless of which fear is larger?"
