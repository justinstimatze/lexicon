lineage:
  - source: primary
    text: radin-hare-loses-count-while-refining-his-request-and-breaks-the-rule
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episodes 20-21. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "But about one thing I would like to warn you. Never ask for the same thing four times in succession. ... In the night Hare tried his power on the things that the old man said would be his and everything that he had told him proved correct. When he was ready to go to sleep he said, 'Now I would like to have a nice-looking woman to lie with.' Immediately one came. She was very beautiful but Hare spoke again and said, 'I meant a beautiful woman.' Then the one that had come left and another came in still more beautiful than the former. But Hare said again that he had called for a beautiful woman so she, too, left and another came in still more beautiful. Again he called for a beautiful woman and, again, she left. Finally one came who was superlatively beautiful. With her he had sexual intercourse. Now he had been told not to call for anything four times in succession and yet he had done it."
canonical-instances:
  - "A team given a strict rule of no more than three rounds of client revisions on a design keeps calling each new tweak a 'small clarification' rather than a fourth revision, and only realizes afterward that they blew through the limit precisely because each round felt like refining, not repeating."
  - "A person on a strict budget who has told themselves they'll try on a maximum of three pairs of shoes before deciding keeps asking to see 'just one more, slightly different' pair, each one closer to what they want, and ends up trying on six before noticing they long ago passed their own limit."
critical-questions:
  - "Is the limit here best understood as a rule about the number of requests, or a rule about the underlying attitude of never being satisfied, and would Hare have violated the spirit of the rule even if he had technically stopped at three refinements?"
  - "Does the story suggest that the old man's warning was designed with exactly this failure mode in mind, given how naturally desire for an ideal outcome tends to produce this kind of incremental refinement, or is Hare's specific way of breaking the rule presented as unusually careless?"
  - "Would a person tracking count from the start, rather than only in hindsight, actually notice the moment of crossing the threshold in real time, or does the story suggest that the felt sense of 'improving, not repeating' is strong enough to obscure the count even for someone trying to watch it?"
