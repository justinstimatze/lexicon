evokes: [dont-shoot-the-messenger-institutionalized, reciprocal-immunity-not-mercy, envoy-as-mouthpiece-not-author, kautilya-on-envoys]
lineage:
  - source: primary
    text: kautilya-arthashastra-envoy-reciprocal-immunity
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'On Envoys,' 'At the Court of His Mission,' {1.16.10-17}."
    quote: "'To such a king the envoy shall point out that, just as his own envoy was his mouthpiece, so it was with other kings. Envoys, therefore speak as they are instructed to, even if weapons are raised against them. [The shastras say that] even if an envoy is an outcast, he shall not be killed. It goes without saying that a Brahmin envoy shall never be harmed. The duty of envoys is but to repeat the words of his master.'"
canonical-instances:
  - "A manager who fires the HR representative who delivered news of a mandatory pay cut, rather than addressing the executives who made the decision, discovers that no one in HR will agree to deliver difficult news to that manager directly again -- every future message gets filtered, softened, or delayed by someone unwilling to be the next target, which costs the manager the very channel they needed to hear bad news early."
  - "A company that retaliates against the analyst who correctly flagged a product failure in an internal report, rather than against whoever caused the failure, finds that subsequent reports get written to avoid flagging anything alarming -- the punishment was aimed at the wrong link in the chain, and it disabled the reporting function itself rather than fixing the underlying problem the report described."
critical-questions:
  - "does the reciprocity argument still hold when the two parties are permanently unequal in power -- does a much stronger king actually need the weaker king's envoys to be protected in return, or can raw power asymmetry let the stronger side ignore the reciprocal logic and punish messengers with impunity, since it may never need to send an envoy INTO danger the way the weaker king does?"
  - "how does this principle distinguish a genuine mere-carrier (a courier repeating an exact scripted message) from a messenger who has added their own interpretation, embellishment, or personal agenda to what they deliver -- does the protection still apply once the messenger is no longer purely a mouthpiece?"
  - "in modern organizational contexts without an explicit shastra-like rule, how does an organization actually build and maintain the reciprocal norm this atom describes, given that the incentive to punish an individual messenger for triggering a strong emotional reaction is immediate while the cost (a degraded future information channel) is diffuse and delayed?"
