id: lex-ejtkk
name: graduated-escalation-of-exposure-overcomes-total-initial-resistance
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Total, sincere resistance to something can be worn down not by a direct approach but by a series of small, individually-tolerable increases in exposure, each one normalized by the step before it, until the accumulated exposure produces what a single direct attempt never could. In the Jataka's tale of the isolated prince, a young man raised with no interest in women at all is won over not by direct approach but by careful staging: 'she took her stand in that place, and sang with a voice of honey ... Next day, he commanded that she should stand near and sing. The next day, he commanded her to stand in the private chamber, and the next, in his own presence.' No single step in the sequence looks like the thing his total resistance was built against. Each one was small enough to pass, and the sum of them wasn't."
related: []
evokes: [jataka, tikanipata, culla-palobhana-jataka, incremental-escalation-normalized-by-each-prior-step-overcomes-total-resistance, foot-in-the-door-staging-defeats-what-a-direct-approach-cannot]
lineage:
  - source: primary
    text: jataka-chalmers1895-culla-palobhana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book III (Tikanipata), No. 263, Culla-palobhana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "So in the morning time she took her stand in that place, and sang with a voice of honey, so that the music was as sweet as the song, and the song as sweet as the music. The prince lay listening. Next day, he commanded that she should stand near and sing. The next day, he commanded her to stand in the private chamber, and the next, in his own presence."
canonical-instances:
  - "A vendor who knows a client's procurement policy bars unsolicited pitches wins the account not by pitching directly but by first sharing a free industry report, then offering a short informal call, then a working lunch, then a formal proposal — each step small enough that the client's original no-vendor-contact policy never registers as being crossed until the contract is already signed."
  - "In the Jataka's tale of Kunala (Book XXI, Asitinipata, No. 536), a man disguised as an ascetic wins a bet by seducing a nun famous for her discipline through a week of staged escalation: silence, a look, one word, a kind greeting, a kinder one, a shared confession of spiritual failure, then a proposal — each day's step small enough to pass as the natural next stage of a friendship, until her total initial devotion is gone."
critical-questions:
  - "Is the prince's resistance genuinely defeated, or was it never as total as it appeared, since real resistance might have refused even the very first small step rather than tolerating it as harmless?"
  - "How many steps does an escalation like this actually need, and does the specific staging (increasing proximity, day by day) matter, or would any sufficiently gradual sequence produce the same result?"
