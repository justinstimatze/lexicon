id: lex-e33qq
name: a-single-success-proves-feasibility-many-failures-dont-disprove-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone argues a change is impossible by pointing to a long track record of failed attempts, check whether even one clean counter-case exists — a single success settles the feasibility question in a way that no number of prior failures can settle it the other way. Merton states this as a deliberate methodological point about his own field, not just a rhetorical flourish: 'Nor can widespread, even typical, failures in planning human relations between ethnic groups be cited as evidence for pessimism. In the world laboratory of the sociologist, as in the more secluded laboratories of the physicist and chemist, it is the successful experiment which is decisive and not the thousand-and-one failures which preceded it. More is learned from the single success than from the multiple failures. A single success proves it can be done. Thereafter, it is necessary only to learn what made it work.' He closes on Thomas Love Peacock's line as the compact statement of the same logical asymmetry: '\"Whatever is, is possible.\"' Diagnostic use: a track record of failure is evidence about base rates and difficulty, never evidence of impossibility — the moment a genuine positive instance exists (the Hilltown biracial housing project, the post-FDIC bank stability, the post-unionization decline in Negro strikebreaking, all cited earlier in the same chapter), the debate should shift from 'can this be done' to 'what made this instance work,' since that second question is where the actual leverage is."
related: []
evokes: [merton-1957, thomas-love-peacock, whatever-is-is-possible, existence-proof, the-successful-experiment-is-decisive, single-success-vs-many-failures]
lineage:
  - source: primary
    text: merton-1957-successful-experiment-is-decisive
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XI 'The Self-Fulfilling Prophecy,' p.436. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'Nor can widespread, even typical, failures in planning human relations between ethnic groups be cited as evidence for pessimism. In the world laboratory of the sociologist, as in the more secluded laboratories of the physicist and chemist, it is the successful experiment which is decisive and not the thousand-and-one failures which preceded it. More is learned from the single success than from the multiple failures. A single success proves it can be done. Thereafter, it is necessary only to learn what made it work. This, at least, is what I take to be the sociological sense of those revealing words of Thomas Love Peacock: \"Whatever is, is possible.\"'"
canonical-instances:
  - "A skeptic argues remote-first engineering culture can't sustain deep collaborative work, citing dozens of failed remote experiments; one team's four years of genuinely strong output under a fully remote structure settles the feasibility question, and the live issue becomes what that team did differently, not whether it's possible."
  - "Critics of a novel medical treatment point to a long history of failed attempts at the same goal by other methods; a single well-documented cured patient under the new method is a stronger piece of evidence for feasibility than the accumulated failures are against it, though it says nothing yet about the treatment's reliability or rate of success."
critical-questions:
  - "This settles PURE feasibility ('can it be done at all'), but says nothing about frequency, cost, or reproducibility — how should the single-success argument be qualified so it isn't misused to claim a rare fluke establishes something is generally achievable, only that it's achievable at all?"
  - "How do you rule out that the 'single success' was itself a measurement error, a fraud, or a case that will later turn out not to have been what it seemed — does the asymmetry between one success and many failures survive scrutiny of whether the success itself was real?"
