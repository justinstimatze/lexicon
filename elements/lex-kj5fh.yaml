canonical-instances:
  - "The book directly names the popular belief this corrects: 'There's a popular misconception that the alcohol cooks off when heated. The truth is more complicated.' A cook simmering a pan sauce for an extra ten or twenty minutes to be sure 'all the alcohol is gone' is chasing a floor the process cannot cross — the azeotrope's fixed vapor ratio guarantees roughly 5 percent of the original alcohol survives any length of ordinary simmering."
  - "Hypothetical: a company tries to eliminate all remaining bugs from a legacy codebase by running the same manual QA testing process for another several sprints. If the residual bugs are concentrated in a category the existing test suite structurally can't reach (a specific class of race condition, say), more sprints of the identical process asymptote toward the same non-zero bug floor — reaching genuinely lower requires a different process (say, a targeted fuzzing harness), not more of the current one."
critical-questions:
  - "How would a practitioner recognize, ahead of time, that a removal process has a locked-ratio floor rather than approaching zero — is there a general diagnostic short of the book's own chemistry knowledge (recognizing an azeotrope specifically), or does this always require domain-specific knowledge of the particular mixture or process in question?"
  - "Is the floor always exactly fixed, or can it shift with process conditions (a different starting ratio, a different temperature profile) even while remaining strictly above zero — and if the floor itself is adjustable, does 'more of the same process' ever partially help even though it never fully solves the problem?"
  - "In the software-bugs analogy and other non-chemical instances, is there always a clean binary between 'the current process' and 'a genuinely different process,' or do many real removal processes admit a continuum of partial variations that neither fully break the locked ratio nor stay perfectly identical to the original?"
