  - source: primary
    text: jataka-chalmers1895-mamsa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 315, Mamsa-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "A world without friends, I venture to think, a wilderness surely must be, In that title of friend all that's dear is implied, so I give all the deer unto thee."
canonical-instances:
  - "Four different colleagues email the same overworked IT admin asking for the same expedited fix; the one who opens with 'hey, fellow night-owl' gets it done in ten minutes, while the one who opens with a formal ticket number waits three days — the technical request was identical."
critical-questions:
  - "Is the hunter's grading actually about intimacy, or is it really just responding to politeness and warmth generically, with 'friend' happening to signal the most warmth rather than the most literal closeness?"
  - "Does this reward structure incentivize sincere relationship-framing, or does it just teach requesters to perform whichever register of address extracts the most, regardless of the real relationship?"
