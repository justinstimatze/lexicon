id: lex-k8k5h
name: displaced-retaliation-desecrates-a-substitute-target-not-for-practical-gain
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Grief and rage over a wounded relative can get discharged onto an unrelated enemy body through mutilation, with an explicit marker separating the act from any practical motive -- confirming the violence was purely expressive retaliation against a substitute target, not against the party actually responsible. When Black Elk's cousin, Black Wasichu, is critically wounded, his father and Black Elk's father don't go looking for the specific soldier who fired the shot -- an impossible target in the chaos of battle. Instead: 'his father and my father were so angry over this, that they went and butchered a Wasichu and cut him open.' The next sentence marks the act as expressive rather than practical: 'The Wasichu was fat, and his meat looked good to eat, but we did not eat any.' The meat's edibility is noted and specifically declined -- this wasn't foraging that happened to be violent; it was violence that happened to leave something edible behind."
related: []
evokes: [black-elk-speaks, rubbing-out-of-long-hair, black-wasichu-wounded, went-and-butchered-a-wasichu, meat-looked-good-but-we-did-not-eat-any]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch9-rubbing-out-of-long-hair
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 9, 'The Rubbing Out of Long Hair.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "He was my cousin, and his father and my father were so angry over this, that they went and butchered a Wasichu and cut him open. The Wasichu was fat, and his meat looked good to eat, but we did not eat any."
canonical-instances:
  - "After a hit-and-run driver who is never caught injures their child, a parent vandalizes the car of a random stranger who merely resembles the fled driver's vehicle description, an act that costs them nothing to gain and everything to explain."
  - "A soldier whose close friend was killed by an unseen sniper turns and destroys a nearby civilian's property that has no connection to the shooting, needing an available target for a rage that has no reachable, specific cause."
  - "An online mob unable to identify the actual person responsible for a harmful act instead doxxes and harasses someone who merely shares a name or resembles a description, discharging real anger onto a substitute who had nothing to do with the original harm."
critical-questions:
  - "Practical hunger and expressive rage could both have been present at once, with declining the meat only a separate, later act of restraint -- so does the refusal actually prove the original act was purely expressive, or does it prove nothing about the motive at all?"
  - "Why does mutilating a substitute body provide any relief at all for anger over a specific, unreachable person -- what is the psychological mechanism that lets an arbitrary stand-in absorb rage meant for someone else entirely?"
  - "Does the fact that this happens amid an already-lethal battle, where killing enemies was already sanctioned and expected, change how transgressive the mutilation itself actually was, compared to the same act in a context without active combat?"
status: active
