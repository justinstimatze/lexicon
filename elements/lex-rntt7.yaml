lineage:
  - source: primary
    text: radin-tricksters-fake-tail-tempts-a-bear-into-his-own-trap
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episodes 34-35. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'O, Kunu, how that tail becomes you! If only I were that way!' Then, after a while, the bear again spoke, 'O, Kunu, how that tail becomes you! I wish I could have one too!' Then Trickster answered and said, 'You are always talking in that way. What is the difficulty of obtaining one? Why don't you make one for yourself? When I saw one, a little time ago, I liked it and I had one made for me. Anyone who wishes to can get one.''All right, Kunu, since you think you can make me one, why I wish you would.''Good, that I will do for you. ... Well, let me now first prepare you properly for the tail so that when the hawk comes back I can put him in your rectum.' Then he took a knife and cut out the bear's rectum and, pulling out his intestines, killed him."
canonical-instances:
  - "A rival trader shows off supposedly effortless profits generated by a proprietary trading bot and, when an envious colleague asks how to get one, offers to set them up on the 'same system' for a fee, which is actually a scheme that drains the colleague's account into the trader's own, the visible profits having come from prior victims rather than the bot itself."
  - "An influencer displays a dramatic before-and-after transformation from an unnamed supplement and, when a follower expresses envy and asks how to get the same results, sells them an expensive subscription to the exact program that will actually harm their health, the original transformation photos having been staged or achieved by other means entirely."
critical-questions:
  - "Would the bear have consented if he had known the tail was actually a captured, dying hawk rather than a natural feature, and does the deception here rely more on the bear's ignorance of what he's looking at or on his eagerness not to ask closer questions?"
  - "Is there a meaningful difference between this scheme and an ordinary scam that fabricates a fake benefit outright, given that Trickster's advantage really was genuine, at least in the sense that he really did have something attached to him, even though it was a trapped animal rather than a natural trait?"
  - "Does the bear's specific vulnerability, wanting a status marker other animals would envy, generalize to any situation involving cultivated envy, or does this diagnostic require a particular kind of desire, visible-to-others advantage, rather than a private or functional one?"
