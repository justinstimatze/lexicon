id: lex-pzfq3
name: hedged-attribution-still-smuggles-in-unverified-belief
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a rule demands that every claim be personally verified before it can be reported or asserted, check whether the rule can survive being followed literally -- Popper's example, borrowed from Mark Twain, shows it usually can't. Twain's editor, on his first day as a reporter, told him 'never to report anything unless he could verify it or confirm it by personal knowledge.' Twain complied to the letter and produced this: 'A woman giving the name of Mrs James Jones, who is reported to be one of the society leaders of the city, is said to have given what purported to be a party yesterday to a number of alleged ladies. The hostess claims to be the wife of a reputed attorney.' Every noun in the report is hedged -- reported to be, is said to have, purported to be, alleged, claims to be -- because the only thing Twain could personally verify was that the claims had been made -- their truth was never his to attest. Followed strictly, the verify-everything rule doesn't produce a stream of confirmed facts; it produces a report about a report, receding one hedge further back from the world with every attempt to comply. The instruction was meant to keep unverified belief out of the account, and it cannot: nothing in ordinary experience is available to a reporter, or to anyone else, except by way of some chain of trust, inference, or interpretation that the rule forbids relying on. Diagnostic move: before adopting a rule that requires certainty or personal verification as a precondition for asserting anything, try running Twain's move on it -- write out what the most literal-minded possible compliance would actually produce -- and check whether what comes out is still usable as a claim about the world, or just an infinite regress of attributions about who said what."
