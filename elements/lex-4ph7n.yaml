id: lex-4ph7n
name: mechanism-that-enables-an-act-is-not-its-reason
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating a 'because' explanation for why something happened — an action, a decision, an event — check whether the explanation names the MECHANISM WITHOUT WHICH the thing could not have happened, or the actual REASON it happened; these are routinely conflated, and the conflation feels like an answer while leaving the real question unaddressed. Plato's Phaedo (96a-99b) gives the canonical case. Socrates recounts his youthful excitement at Anaxagoras's claim that 'mind is the disposer and cause of all' — expecting this to mean mind arranges everything for the best, and hoping for explanations in terms of what is good and purposeful. He is bitterly disappointed to find Anaxagoras instead 'having recourse to air, and ether, and water, and other eccentricities' — pure mechanism with no reference to purpose. Socrates makes the failure vivid with his own case: 'I might compare him to a person who began by maintaining generally that mind is the cause of the actions of Socrates, but who, when he endeavoured to explain the causes of my several actions in detail, went on to show that I sit here because my body is made up of bones and muscles... forgetting to mention the true cause, which is, that the Athenians have thought fit to condemn me, and accordingly I have thought it better and more right to remain here and undergo my sentence.' His bones and muscles 'would have gone off long ago to Megara or Boeotia... if they had been moved only by their own idea of what was best' — the mechanism was equally available either way; what actually explains his sitting in prison is his judgment that enduring the sentence was better than fleeing. Socrates names the error precisely: 'There is surely a strange confusion of causes and conditions in all this... I wonder that they cannot distinguish the cause from the condition.' The test this suggests: ask whether the proffered explanation would still hold unchanged if the agent's judgment or purpose had gone the other way while the mechanism remained exactly as available. If yes — the mechanism is invariant across the choice actually made and cannot be what explains that particular choice, however necessary it was for executing it. The atom does not claim mechanistic explanation is worthless: Socrates explicitly concedes 'without bones and muscles... I cannot execute my purposes' — the condition is genuinely necessary. The error is treating the necessary-condition description as if it answered the why-question that was actually being asked, and thereby 'forgetting to mention the true cause.' The clearest modern formalization is Mayr's and Tinbergen's proximate/ultimate-causation distinction in biology: 'a bird migrates because seasonal hormonal changes trigger the behavior' (proximate mechanism, true and necessary) is not the same explanation as 'a bird migrates because ancestral migrators out-survived non-migrators' (ultimate/evolutionary reason) — both are real, but a question aimed at one is not answered by an answer aimed at the other. Engineering incident review shows the same conflation: 'the bridge collapsed because of resonance in the support cables' names the physical mechanism; 'the bridge collapsed because the design review process didn't flag a known resonance risk' names the actionable systemic reason — root-cause analysis that stops at the former, however physically correct, misses what would actually prevent recurrence."
related: [lex-b9yre, lex-nf7gg, lex-rktsy, lex-vgfgh]
evokes: [bones-and-muscles-explain-nothing-about-why-i-sit-here, confusion-of-causes-and-conditions, forgetting-to-mention-the-true-cause]
lineage:
  - source: primary
    text: plato-c380bce-phaedo-jowett-anaxagoras-disappointment
    citation: "Plato, Phaedo 97b-98c (trans. Benjamin Jowett, Standard Ebooks 'The Dialogues of Plato' compilation). Socrates recounts his youthful hope that Anaxagoras's 'mind is the cause of all' would yield purposive, reasons-based explanations, and his disappointment on finding only mechanistic ones."
    quote: "Then I heard someone reading, as he said, from a book of Anaxagoras, that mind was the disposer and cause of all, and I was delighted at this notion [...] As I proceeded, I found my philosopher altogether forsaking mind or any other principle of order, but having recourse to air, and ether, and water, and other eccentricities."
  - source: primary
    text: plato-c380bce-phaedo-jowett-cause-versus-condition
    citation: "Same dialogue, continuing (98c-99b) — Socrates's own bones-and-muscles example and his explicit naming of the cause/condition confusion."
    quote: "I might compare him to a person who began by maintaining generally that mind is the cause of the actions of Socrates, but who, when he endeavoured to explain the causes of my several actions in detail, went on to show that I sit here because my body is made up of bones and muscles [...] forgetting to mention the true cause, which is, that the Athenians have thought fit to condemn me, and accordingly I have thought it better and more right to remain here and undergo my sentence [...] There is surely a strange confusion of causes and conditions in all this [...] I wonder that they cannot distinguish the cause from the condition, which the many, feeling about in the dark, are always mistaking and misnaming."
canonical-instances:
  - "The direct textual anchor: Socrates's bones-and-muscles example — the mechanism that enables his sitting in prison (skeletal-muscular structure) is equally available whichever choice he makes, so it cannot be what explains the particular choice to stay rather than flee, however necessary it is for executing that choice."
  - "Mayr's and Tinbergen's proximate/ultimate distinction in biology: 'a bird migrates because of hormonal changes triggered by shortening daylight' (proximate mechanism) and 'a bird migrates because ancestral migrators survived winter better' (ultimate/evolutionary reason) are both true, non-competing explanations aimed at different questions — mistaking one for an answer to the other's question is the modern instrumented form of the ancient confusion."
  - "Engineering root-cause analysis: 'the bridge collapsed because of resonance in the support cables' names a necessary physical mechanism; 'the bridge collapsed because the design review process failed to flag a known resonance risk' names the systemic, actionable reason. An incident report that stops at the former, however physically accurate, forgets to mention the cause that would actually prevent recurrence."
critical-questions:
  - "isn't this just the necessary-versus-sufficient-condition distinction from formal logic? Related but not identical: necessary/sufficient is a relation between propositions, checkable by truth-table reasoning. This atom names a specific FAILURE MODE IN EXPLANATION-GIVING — offering a necessary-condition description in answer to a why-question that is actually asking for the operative reason or purpose. Someone can understand necessary-and-sufficient conditions perfectly in the abstract and still commit this error in practice, exactly as Anaxagoras's own exposition did."
  - "how does this differ from lex-vgfgh (causal-cognition-stratifies-into-association-intervention-and-counterfactual)? Pearl's ladder sorts causal QUESTIONS by what kind of evidence can answer them — observational, experimental, or counterfactual. This atom sorts causal ANSWERS by whether they name an enabling mechanism or an operative reason, a distinction orthogonal to Pearl's rungs: a mechanistic answer and a reasons-based answer can each in principle be given at any of the three levels Pearl identifies."
  - "how does this differ from lex-rktsy (causation-as-constant-conjunction-not-necessary-connexion, Hume)? Hume is skeptical about whether any necessary connection between cause and effect is ever directly perceivable, at any level of description. This atom takes no position on that skeptical question — it operates one level up, sorting explanations that are already accepted as causally adequate into 'names the mechanism' versus 'names the reason,' regardless of how secure the underlying causal claim is."
  - "does the atom claim mechanistic explanations are worthless or should be dropped? No — Socrates explicitly concedes the mechanism is genuinely necessary ('without bones and muscles... I cannot execute my purposes'). The error named is EXCLUSIVITY: substituting the mechanism for the reason and thereby 'forgetting to mention the true cause,' not citing the mechanism at all."
  - "in a live case, how do you actually tell which is the condition and which is the reason? Diagnostic: ask whether the explanation would hold unchanged if the agent's judgment or purpose had gone the other way while the mechanism remained exactly as available. Socrates's bones and muscles would have carried him to Megara just as readily had he judged escape better — the mechanism is invariant across the choice, so it cannot be what explains the particular choice that was actually made."
