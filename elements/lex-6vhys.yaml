id: lex-6vhys
name: a-hardwired-affection-gesture-reads-as-threat-across-species
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When communicating across a species boundary — or any boundary where two parties share a channel (body posture, gesture, tone) but not the code for interpreting it — don't assume a gesture that's universally affectionate on your side is received the same way on the other side. McConnell's example: primate affection (humans included) is expressed through face-to-face, chest-to-chest ventral contact — hugging — which is hardwired and near-universal across the primate order. Dogs read the identical physical configuration (a torso pressed against them, forelimbs immobilizing their movement, a face brought close to their own) through their own species' signaling grammar, where it reads as a dominance/threat display, not affection. The two parties aren't miscommunicating through carelessness; each is executing its own species-correct affection or warning signal flawlessly, and the collision happens because the physical channel is shared while the interpretive code is not."
evokes: [mcconnell, other-end-of-the-leash, interspecies-communication, ventral-ventral-contact, cross-species-signal-mismatch]
lineage:
  - source: primary
    text: mcconnell-2003-other-end-of-the-leash-ch-monkey-see-monkey-do
    citation: "Patricia McConnell, The Other End of the Leash: Why We Do What We Do Around Dogs (Ballantine Books, 2003), Ch.1 'Monkey See, Monkey Do' and the later chapter on greeting behavior. No page numbers recoverable from the mobi extraction; cited by chapter. The source itself carries an OCR/conversion artifact, 'em-bracingy' for 'embracing,' a few lines before the quoted span — noted here, not silently reproduced or included in the quote. Verified verbatim against a direct ebook-convert extraction."
    quote: "Thanks to the efforts of hundreds of animal behavior researchers, we know that most primates express affection with 'ventral-ventral' contact (chest-to-chest and face-to-face), hugging one another and patting others behind the head or on the shoulders. ... In my experience the individuals who most want to hug and pet soft living things are young adolescent girls and children between about three and five years of age. ... Like young female primates everywhere, they craved cuddling and touching. Yet while they were thinking warm, loving thoughts, their dog interpreted their hug as a rude, domineering threat display."
canonical-instances:
  - "A child hugging a family dog around the neck, growled or snapped at despite the dog's general tolerance of the household: the child's gesture is correctly-executed primate affection, and the dog is reading a face-to-face immobilizing approach exactly the way its own species' signaling grammar says to read it — as a threat. Neither party is malfunctioning; the codes don't match."
  - "operationally distinct from ordinary human-human cross-cultural miscommunication (a gesture polite in one culture, offensive in another): those cases involve two parties who could in principle learn each other's code through the same channel of language and explicit instruction. Here the two parties don't share a symbolic-communication channel at all — the mismatch is at the level of hardwired, largely non-negotiable species-typical signal repertoires."
critical-questions:
  - "How much of this generalizes to other cross-species pairings (working animals, wildlife encounters) versus being specific to the particular primate-affection/canine-threat collision McConnell documents? The general principle — shared channel, mismatched code — likely generalizes; the specific gesture-to-gesture mapping doesn't."
  - "Can the mismatch be corrected through habituation on the dog's side (as McConnell notes many dogs learn to tolerate hugs from their own family), or does correction only work in one direction — and if so, what does that imply about which species is expected to absorb the cost of the miscommunication?"
  - "Is there a comparable but reversed case — a canine affection signal that primates systematically misread as something else? If the phenomenon is genuinely about channel-sharing without code-sharing rather than something specific to how apes greet, a reverse-direction instance should exist and would strengthen the general claim."
status: active
