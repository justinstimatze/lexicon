id: lex-667f3
name: vehement-denunciation-of-a-thing-misuse-can-signal-frustrated-desire-for-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone repeatedly, vehemently denounces the misuse, vanity, or corruption of something -- wealth, status, romance, a career track -- rather than simply not caring about it, consider a specific diagnostic Spinoza offers with a built-in reversal test: this pattern is 'common to all who are ill-used by fortune, and who are infirm in spirit,' and the desire it masks tends to reappear the instant circumstances improve. His examples: an ambitious man who has been denied the honours he sought talks endlessly of 'its emptiness, and the fickleness of mankind'; 'a poor man, who is miserly, will talk incessantly of the misuse of wealth and the vices of the rich... he merely torments himself, and shows the world that he is intolerant, not only of his own poverty, but also of other people's riches'; and, most pointedly, 'those who have been ill received by a woman they love think of nothing but the inconstancy, treachery, and other stock faults of the fair sex; all of which they consign to oblivion, directly they are again taken into favour by their sweetheart.' The reversal clause is the diagnostic's sharpest edge and what distinguishes it from a permanent change of values: the complaint isn't a settled revaluation (deciding wealth or status or romance really is bad) but a temporary cover for continued craving, and it dissolves the instant the underlying want is satisfied -- 'wherefore it is certain that those, who cry out the loudest against the misuse of honour and the vanity of the world, are those who most greedily covet it.' The practical implication Spinoza draws is behavioral, not merely diagnostic: someone who genuinely wants freedom from an emotion should direct their attention toward the RIGHT USE of the thing and the means of attaining it, not toward its misuse and vanity -- 'let him not think of its misuse... with thoughts like these do the most ambitious most torment themselves' -- because dwelling on a thing's corruption, even critically, keeps the mind's attention (and therefore its desire) fixed on the thing. Portable beyond Spinoza's examples: a person who left a competitive field and now frequently, unprompted, criticizes its culture as shallow and its winners as compromised may be signaling unresolved attachment rather than genuine disinterest -- the test is whether the criticism would evaporate on being invited back in; a person who was passed over for a promotion and begins pointedly deriding organizational politics and the emptiness of titles is exhibiting the same pattern Spinoza names, distinguishable from principled critique by whether it persists after their own position improves. Diagnostic and scope: this is a diagnostic for RECOGNIZING the pattern (in oneself or others), not a claim that all criticism of wealth, status, or institutions is secretly frustrated desire -- Spinoza's own test is the REVERSAL: does the criticism vanish the moment the critic's own fortune changes for the better? A settled, principled objection that persists regardless of the critic's own circumstances does not fit this pattern. Should not be confused with lex-96xn9 (envy-and-impotence-route-to-value-inversion), which describes a PERMANENT revaluation of the unattainable thing as actually bad (a genuine, if defensive, change of belief) -- this atom describes a TEMPORARY, self-tormenting complaint that coexists with the desire staying fully intact underneath, revealed precisely by its instant collapse when the desired thing becomes available again."
related: [lex-96xn9, lex-wf4nj, lex-we98d]
scaffolds-from: [lex-we98d]
evokes: [cry-out-the-loudest-against-the-misuse-of-honour, consign-to-oblivion-directly-they-are-taken-into-favour, torments-himself-and-shows-the-world, let-him-not-think-of-its-misuse]
lineage:
  - source: primary
    text: spinoza-1677-ethics-part-v-vehement-denunciation-signals-desire
    citation: "Baruch Spinoza, Ethica (1677 posthumous), Part V 'Of the Power of the Understanding, or of Human Freedom,' Proposition X, Note. Elwes translation (Project Gutenberg)."
    quote: "For instance, if a man sees that he is too keen in the pursuit of honour, let him think over its right use... Let him not think of its misuse, and its emptiness, and the fickleness of mankind, and the like, whereof no man thinks except through a morbidness of disposition; with thoughts like these do the most ambitious most torment themselves, when they despair of gaining the distinctions they hanker after... Wherefore it is certain that those, who cry out the loudest against the misuse of honour and the vanity of the world, are those who most greedily covet it. This is not peculiar to the ambitious, but is common to all who are ill-used by fortune, and who are infirm in spirit. For a poor man also, who is miserly, will talk incessantly of the misuse of wealth and of the vices of the rich; whereby he merely torments himself, and shows the world that he is intolerant, not only of his own poverty, but also of other people's riches. So, again, those who have been ill received by a woman they love think of nothing but the inconstancy, treachery, and other stock faults of the fair sex; all of which they consign to oblivion, directly they are again taken into favour by their sweetheart."
canonical-instances:
  - "The direct textual anchor: Spinoza names the pattern across three examples (the denied honour-seeker, the miserly poor man decrying the rich, the spurned lover) and gives the reversal test explicitly -- the spurned lover's denunciation of 'the fickleness of the fair sex' vanishes the instant he is taken back into favour, revealing the desire was never resolved, only suppressed and expressed as complaint."
  - "A person who left a competitive field and now frequently, unprompted, criticizes its culture as shallow and its winners as compromised may be signaling unresolved attachment rather than genuine disinterest -- testable by whether the criticism would evaporate on being invited back in."
  - "A person passed over for promotion who begins pointedly deriding organizational politics and the emptiness of titles is exhibiting the same pattern, distinguishable from principled critique by whether it persists after their own position improves."
critical-questions:
  - "isn't this the same as lex-96xn9 (envy-and-impotence-route-to-value-inversion)? No -- lex-96xn9 describes a PERMANENT revaluation, where the unattainable thing gets genuinely redefined as bad and that belief-change persists. This atom describes a TEMPORARY, self-tormenting complaint where the underlying desire stays fully intact and the complaint dissolves instantly once the thing becomes available again -- the reversal-on-fortune-change is the specific, distinguishing test."
  - "isn't this the same as lex-wf4nj (master-vs-slave-morality typology)? No -- Nietzsche's typology classifies entire moral frameworks by their psychological origin (values created from strength vs. inverted from resentment), a claim about the genealogy of a value SYSTEM. This atom is a narrower, individual-level behavioral diagnostic (does THIS PERSON'S denunciation collapse when their fortune changes) that makes no claim about the origin of morality as such."
  - "does this mean all criticism of wealth, status, or institutions is secretly frustrated desire? No -- the atom names a recognizable PATTERN, not a universal unmasking of all critique. Spinoza's own diagnostic is the reversal test: a settled, principled objection that persists regardless of the critic's own changing fortune does not fit this pattern and should not be waved away by it."
  - "what's the practical takeaway, beyond just recognizing the pattern in others? Spinoza draws a first-person implication: someone who wants actual freedom from a fixation should redirect attention to the thing's right use and how to attain it, not dwell on its misuse or vanity -- because dwelling on a thing's corruption, even in a critical register, keeps the mind's attention (and therefore the desire) anchored to that thing."
