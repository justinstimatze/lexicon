lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'What is Dialectic?' (paper read to a philosophy seminar at Canterbury University College, Christchurch, New Zealand, 1937; first published in Mind, N.S. 49, 1940), Ch. 15 of Conjectures and Refutations (Routledge Classics, 2002), pp.425-426. The quote is split with an ellipsis at the exact p.425/426 page break, where a running head sits directly against the join with no separating space."
    quote: "'It is true, however, only so long as we are determined not to put up with contradictions, and to change any theory which involves contradictions... It cannot be emphasized too strongly that if we change this attitude, and decide to put up with contradictions, then contradictions must at once lose any kind of fertility. They would no longer be productive of intellectual progress... In other words, all criticism (which consists in pointing out contradictions) would lose its force. Criticism would ... be answered by \"And why not?\" or perhaps even by an enthusiastic \"There you are!\"; that is, by welcoming the contradictions which have been pointed out to us... Thus we must tell the dialectician that he cannot have it both ways. Either he is interested in contradictions because of their fertility: then he must not accept them. Or he is prepared to accept them: then they will be barren, and rational criticism, discussion, and intellectual progress will be impossible.'"
canonical-instances:
  - "A team's retro culture is praised because 'our willingness to surface hard disagreements is what makes this team so innovative.' If the team then adopts a norm of simply logging disagreements without resolving them, to seem more tolerant of dissent, the innovation dries up. What actually produced it all along was everyone's shared refusal to let a disagreement just sit there unresolved, and the disagreements themselves were never the source of anything on their own."
  - "A startup's culture deck says 'failure is how we learn, so we celebrate it.' If failure starts being celebrated regardless of whether anyone changes course afterward, the learning stops -- what actually produced learning was the discomfort of failing combined with a refusal to keep doing the thing that failed, not the failures themselves."
critical-questions:
  - "Doesn't this prove too much -- wouldn't it argue against ever tolerating ANY normally-negative thing, even when tolerance is genuinely called for? No -- the atom isn't a blanket case against tolerance. It targets a specific rhetorical move: crediting a thing with a productive effect that in fact depended on resisting it, and then using that credit as the argument for no longer resisting it. Tolerating something for reasons unrelated to its supposed fertility is a separate question this atom doesn't address."
  - "Is the dialectician's synthesis really worthless, then -- does this atom claim thesis-antithesis-synthesis never happens? Popper doesn't deny synthesis can occur; he denies that the CONTRADICTION did the producing. The synthesis is produced by minds refusing to accept the contradiction and searching for a way past it -- a critical attitude, per [[lex-nf7gg]] on interpretation doing the work a physical or dialectical 'force' gets credited with instead."
status: active
