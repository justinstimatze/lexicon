id: lex-vq4rn
name: a-precommitment-to-give-the-self-makes-every-lesser-request-trivial
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Once you have genuinely settled, in advance, that you would give up something of yourself — your body, your safety, your life — any request for a mere possession clears automatically, without a fresh deliberation each time. The hard threshold was already crossed once, internally; everything asked for afterward is easy by comparison, however large it looks to an outside observer. In the Vessantara-Jataka, the prince at age eight resolves that he would cut out his own heart or eyes if asked, and the earth itself quakes at the resolution. Years later, when foreign brahmins ask for his kingdom''s prized rain-elephant, he does not weigh the loss to his people at all: "I am willing to give anything that is my own, from my head onwards, and what they ask is something without me; I will fulfil their wish." The scale of what he gives away is read by everyone else as reckless; to him it is the trivial case of a decision already made.'
related: []
evokes: [jataka, mahanipata, vessantara-jataka, precommitment, escalating-generosity, trivialized-by-a-higher-standard]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-vessantara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 547, Vessantara-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "I am willing to give anything that is my own, from my head onwards, and what they ask is something without me; I will fulfil their wish."
canonical-instances:
  - "A founder who has already resolved to walk away from the company entirely rather than compromise on user privacy signs away a lucrative but merely inconvenient partnership clause without a second thought — the partnership was never going to be the hard call once the identity of the company was already on the table."
  - "A soldier who has made peace with the possibility of dying in the field hands over rations, ammunition, and eventually a personal keepsake to a stranded civilian without hesitation, each gift trivial next to the risk already accepted."
critical-questions:
  - "The precommitment here was made once, in private, at age eight — how would the mechanism differ if it had to be renewed under the actual pressure of each request, rather than coasting on a resolution made in calm, hypothetical conditions?"
  - "Everyone around Vessantara reads the elephant-gift as reckless because they don't share his internal threshold — when does 'this is trivial by my own standard' stop being humility about a hard-won commitment and start being a failure to weigh the actual cost to people who never consented to the standard?"
status: active
