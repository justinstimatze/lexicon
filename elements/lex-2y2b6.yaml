id: lex-2y2b6
name: complaining-while-trapped-broadcasts-the-exact-vulnerability-to-exploit
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you're stuck, powerless, and frustrated, don't vent your specific complaint out loud to whoever happens to be within earshot -- the content of a frustrated complaint often names precisely the exploitable thing you most need kept hidden, and a listener with no loyalty to you will act on that information rather than sympathize with it. In Zitkála-Šá's telling, Iktomi gets his own foot trapped in a tree while his stolen feast of roasting ducks sits unguarded nearby. Spotting wolves approaching, he shouts a warning meant to protect his food -- 'Don't you come here! I'm caught fast in the tree so that my duck feast is getting cold. Don't you come to eat up my meal' -- and the wolves, hearing exactly what he didn't mean to tell them, respond: 'Ah! hear the foolish fellow! He says he has a duck feast to be eaten! Let us hurry there for our share!' After they finish and start to leave, Iktomi, still trapped and now simply venting his loss like a pouting child, adds, 'At least you have left my baking under the ashes!' -- and loses the second batch exactly the same way, having just watched the mechanism fail him once already. The pattern isn't that Iktomi is unusually foolish -- it's that being trapped and frustrated creates a strong urge to speak the specific content of the loss out loud, and that content is often the one piece of information a listener needs to finish taking what's left. Diagnostic move: when stuck in a vulnerable position and tempted to vent frustration to someone with no stake in protecting you, check whether what you're about to say names a specific asset, location, or weakness -- a general complaint costs nothing, but a specific one can hand a stranger exactly the information needed to exploit the very trap you're already in, and the urge to say it doesn't shrink just because it already backfired once."
