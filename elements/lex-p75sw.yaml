id: lex-p75sw
name: moral-intuitions-are-plural-taste-receptors-cultures-wire-differently
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone else's moral outrage or moral indifference seems bizarre, irrational, or invisible to you, check whether they are responding to a different evolved moral 'taste receptor' than the one(s) you default to — not simply reasoning worse than you. Haidt & Joseph's Moral Foundations Theory (The Righteous Mind, 2012, Ch.6-8) proposes that morality is not one thing (harm-avoidance, as WEIRD — Western, Educated, Industrialized, Rich, Democratic — moral psychology since Kohlberg and Turiel assumed) but a small set of evolved cognitive modules, each an adaptive response to a recurring challenge of social life: Care/harm (protecting the vulnerable), Fairness/cheating (reciprocal altruism without being exploited), Loyalty/betrayal (forming and defending coalitions), Authority/subversion (navigating status hierarchies), Sanctity/degradation (avoiding contamination and pathogens), and Liberty/oppression (resisting domination). Each module has original triggers (the ancestral pattern it evolved to detect) and current triggers (whatever a given culture or individual has learned to hook up to it) — the modules themselves are largely fixed by evolution but what activates them is culturally and politically malleable, the way a sweetness receptor is fixed but what counts as 'the sweet drink' varies by culture. The diagnostic payoff: 'one-receptor' or 'two-receptor' ethical systems (utilitarianism's harm-calculus, rights-based liberalism's harm-and-fairness focus) are not more rational than pluralist moral matrices — they simply weight fewer foundations, and will therefore read foundation-driven concerns outside their scope (loyalty, authority, sanctity, liberty) as confused, oppressive, or not real moral concerns at all, rather than as a different but equally-evolved moral taste being triggered."
related: [lex-rcj6y, lex-b9sqg, lex-6nj6k]
scaffolds-from: [lex-b9sqg]
evokes: [moral-foundations-theory, taste-receptors-of-the-righteous-mind, original-triggers-vs-current-triggers, weird-morality, one-receptor-moralities, care-fairness-loyalty-authority-sanctity-liberty, moral-modularity]
lineage:
  - source: primary
    text: haidt-2012-the-righteous-mind-ch6-8
    citation: "Jonathan Haidt, The Righteous Mind: Why Good People Are Divided by Politics and Religion (Pantheon/Vintage, 2012), Chapter 5 'Beyond WEIRD Morality,' Chapter 6 'Taste Buds of the Righteous Mind,' and Chapter 7 'The Moral Foundations of Politics.' Moral Foundations Theory was co-developed with Craig Joseph, building on Richard Shweder's cross-cultural moral-domain research and Dan Sperber & Lawrence Hirschfeld's cognitive-module framework (original triggers vs current triggers). Haidt names the WEIRD acronym from Henrich, Heine & Norenzayan's 2010 'The Weirdest People in the World?' to argue that psychology's harm/fairness-centric account of morality generalizes a statistical outlier population, not human moral cognition as such."
    quote: "[Ch.6, the taste-receptor analogy:] 'when you see that some version of kindness, fairness, and loyalty is valued in most cultures, you start wondering if there might be some low-level pan-human social receptors (analogous to taste receptors) that make it particularly easy for people to notice some kinds of social events rather than others.' [Ch.6, modularity and original vs current triggers, quoting Sperber & Hirschfeld:] 'An evolved cognitive module...is an adaptation to a range of phenomena that presented problems or opportunities in the ancestral environment of the species... The original triggers are the set of objects for which the module was designed...The current triggers are all the things in the world that happen to trigger it.' [Ch.6, IN SUM:] 'Deontology and utilitarianism are \"one-receptor\" moralities that are likely to appeal most strongly to people who are high on systemizing and low on empathizing... Five good candidates for being taste receptors of the righteous mind are care, fairness, loyalty, authority, and sanctity.' [Ch.5, the WEIRD acronym and its consequence:] 'people from cultures that are Western, educated, industrialized, rich, and democratic (forming the acronym WEIRD)...are statistical outliers; they are the least typical, least representative people you could study if you want to make generalizations about human nature... The moral domain is unusually narrow in WEIRD cultures, where it is largely limited to the ethic of autonomy...It is broader — including the ethics of community and divinity — in most other societies.' [Ch.7, on political variation in which foundations get weighted:] 'The moral matrix of liberals, in America and elsewhere, rests more heavily on the Care foundation than do the matrices of conservatives... conservative caring is somewhat different — it is aimed not at animals or at people in other countries but at those who've sacrificed for the group. It is not universalist; it is more local, and blended with loyalty.'"
canonical-instances:
  - "Care/harm foundation vs Fairness/cheating foundation: political liberals in Haidt's cross-national survey data weight Care and Fairness (construed as equality) heavily and Loyalty/Authority/Sanctity lightly; political conservatives weight all six foundations more evenly, including Fairness construed as proportionality rather than equality — 'people should be rewarded in proportion to what they contribute, even if that guarantees unequal outcomes.' Occupy Wall Street and Tea Party signage both invoke 'fairness' while meaning structurally different things."
  - "the bumper-sticker diagnostic: a 'Save Darfur' sticker activates the universalist Care foundation toward strangers with no personal relationship to the driver; a 'Wounded Warrior' sticker activates a more local, loyalty-blended caring aimed at those who sacrificed for the in-group — both are genuine moral concern, routed through different foundations, and each side tends to read the other's sticker as either performative or parochial rather than as an equally real moral taste."
  - "the spanking controversy as one action linked to two different foundations: on the political left, spanking a child typically triggers the Care/harm module (cruelty, oppression of the vulnerable); on the right it is more often linked to the Authority foundation (proper enforcement of parental and teacherly authority) — the same behavior, routed to different modules, produces intractable disagreement that looks like one side simply not caring about children or the other simply not caring about discipline."
  - "the operating-room nurse example: a nurse who strokes an anesthetized child's head during surgery gains no utilitarian credit (the child feels nothing) and no Kantian credit (the act isn't from a universalizable principle) — but 'tastes good' as a virtue because the Care foundation rewards the disposition to comfort, independent of measurable effect. A one-receptor ethical calculus has no way to register why this looks virtuous."
critical-questions:
  - "is the apparent irrationality of someone's moral position actually a foundation-mismatch — are they weighting Loyalty, Authority, Sanctity, or Liberty in a case where you are only checking for Care and Fairness violations? Naming which foundation is firing on each side often converts a 'they're evil/stupid' impasse into a legible disagreement about which of several genuine moral concerns should take priority."
  - "how does this differ from lex-b9sqg (reason-as-slave-of-passions-instrumental-only)? lex-b9sqg is the PROCESS claim: moral judgment in general is generated by intuition/affect first, with reasoning as a downstream servant (Hume's architecture, empirically extended by Haidt's own moral-dumbfounding research). This atom is the CONTENT claim: there is more than one kind of moral intuition, evolved for different adaptive challenges, and cultures/individuals differ in which ones they've wired up to which triggers. lex-b9sqg explains HOW any single moral judgment gets made; this atom explains WHY two people's intuitive judgments about the same act can differ entirely — they may be running different foundations, not just being more or less rational."
  - "how does this differ from lex-rcj6y (motivated-reasoning) and lex-6nj6k (preacher-prosecutor-politician-scientist typology)? Both of those name mechanisms by which an ALREADY-HELD position resists revision under challenge. This atom is upstream of that: it explains why two people can each be reasoning in good faith, with no motivated defensiveness yet detected, and still reach opposite intuitive verdicts — because their moral matrices weight the six foundations differently before any defensive reasoning ever engages."
  - "when is 'they're just using a different foundation' the wrong diagnosis? When the disputed foundation-triggering concern doesn't survive scrutiny of its own current-trigger accuracy — e.g., a Purity/Sanctity-coded objection to a group of people (rather than to an act) functions as dehumanization rather than a legitimate current trigger of a module whose original trigger was disease-avoidance. Haidt's own framework does not claim all six foundations deserve equal moral authority in every application, only that dismissing a concern as irrational because it doesn't register on YOUR dominant foundations is itself a common error."
