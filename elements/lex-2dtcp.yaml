canonical-instances:
  - "This same article names a second, separate benefit of the annual rebuild: 'Building temporary buildings is flexible, can accommodate a lot of people, and does not fall under normal regulation.' That's a different mechanism (avoiding an external regulatory constraint) riding on the same capped-lifespan structure, standing apart from the experimentation-licensing claim this atom is actually about."
  - "Hypothetical: a company that ships a permanent, hard-to-reverse feature to all users at once tends toward conservative, already-validated designs, because a bad decision has to be lived with indefinitely. That same company, running every new feature as a time-boxed, automatically-sunsetting experiment (explicitly killed after 90 days unless renewed) finds engineers proposing far riskier ideas, because the maximum cost of being wrong is capped at 90 days rather than open-ended."
  - "operationally distinct from lex-63agu (overshoot-deliberately-then-design-the-removal-step): that atom is about intentionally building past a target and then subtracting back to it, a technique for reaching a precise final state via correction. This atom isn't about correcting toward any final target at all -- it's about capping the DURATION any structure is allowed to exist, which changes the incentive to attempt something risky in the first place, independent of whether the result ever gets corrected or refined."
critical-questions:
  - "the mechanism assumes people actually internalize the capped lifespan as psychologically real -- does the experimentation-licensing effect survive if participants know from experience that a genuinely excellent structure sometimes gets quietly kept or rebuilt identically next year, undermining the felt guarantee that a bad idea truly disappears?"
  - "capping a structure's lifespan caps the cost of a BAD idea, but does it also cap the payoff of a GOOD one, since a successful structure gets torn down along with a failed one -- and if so, does the technique systematically discourage investment in refining a good idea past its first rough version, since refinement effort is also capped at one season?"
