id: lex-633cb
name: sorting-a-paradox-as-meaningless-recreates-it-one-level-up
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A paradox sometimes gets 'solved' by sorting the offending sentence into a third category -- neither true nor false, but meaningless. Check whether proving membership in that category rebuilds the identical paradox one level up first. Theaetetus works through exactly this attempted fix for the Liar: classify utterances into three exhaustive classes (true, false, meaningless) and show that the Liar sentence U ('U is false') belongs to the third. He then runs a short reductio showing that a proof of U's meaninglessness would, by the same three-way classification's own rules, force the conclusion that U is meaningful after all -- the full derivation is quoted verbatim below. Socrates names the shape precisely: 'This is a surprising result: a Liar who comes back by the window, just when you think you have got rid of him by the door.' The classification scheme didn't remove the contradiction; it gave the contradiction a new address. U itself generated the original paradox, and the meta-claim 'U is meaningless' generates the same structure by the same logic, one level up. Diagnostic move: when a proposed resolution works by moving a problematic case into a new category, check what happens when you try to prove the case actually belongs there. A proof triggering the same contradiction the category was meant to escape means the fix only relocated which sentence carries the paradox."
related: []
evokes: [popper-self-reference-and-meaning-in-ordinary-language, a-liar-who-comes-back-by-the-window, threefold-classification-of-utterances, meaningless-as-a-third-truth-value, the-reductio-that-undoes-a-classification]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Self-Reference and Meaning in Ordinary Language' (first published in Mind, N.S. 63, 1954), Ch. 14 of Conjectures and Refutations (Routledge Classics, 2002), pp.416-417. Two elisions, both disclosed: the book's own running head sits glued into the sentence at the page break, between 'we find' and 'that from the truth of our hypothesis'; and a short tangential parenthetical aside (restating that the same hypothesis also entails the original paradox) is skipped just before Socrates's reply."
    quote: "“Th. Again by a reductio. Quite generally, we can read off from our classification two rules. (i) From the truth of ‘X is meaningless’ we can derive the falsity of ‘X is true’ and also (what interests us here), the falsity of ‘X is false’. (ii) From the falsity of any utterance Y, we can conclude that Y is meaningful. According to these rules, we find... that from the truth of our hypothesis, ‘U is meaningless’, we can derive by (i) the falsity of ‘U is false’; concluding by (ii) that ‘U is false’ is meaningful. But since ‘U is false’ is nothing but U itself, we have shown (by (ii) again) that U is meaningful; which concludes the reductio. ... S. This is a surprising result: a Liar who comes back by the window, just when you think you have got rid of him by the door.”"
canonical-instances:
  - "A platform, unable to rule a post either true or false under its fact-check policy, adds a third label -- 'unverifiable' -- for exactly this kind of claim. Applying the label requires the fact-check team to assert that the claim cannot be verified as true or false, which is itself a claim needing verification; if that meta-claim gets checked by the same standard that failed on the original one, the team is stuck proving the identical kind of thing it just declared unprovable."
  - "A committee that can't agree whether a proposal violates the bylaws issues a 'procedurally ambiguous' ruling instead of a yes-or-no vote, hoping to sidestep the underlying disagreement. Someone challenges whether the ruling of 'ambiguous' was itself properly reached under the bylaws, and the committee lands back inside the same yes-or-no dispute it built the third category to avoid, now aimed at the ruling instead of the original proposal."
critical-questions:
  - "Doesn't Tarski's actual solution avoid exactly this trap -- so is the 'meaningless' fix just a bad version of a good idea? Yes, and this same dialogue draws that contrast explicitly a few pages later: Tarski's fix removes the true/false predicates from a language entirely and relocates truth-talk to a metalanguage one level up, instead of trying to sort troublesome sentences into a third truth-value inside the same language. This atom names the specific failure of the within-language three-way classification, not a claim that every response to the Liar meets the same fate."
  - "Is this just restating that self-reference is inescapable? No -- the mechanism is narrower than that: the fix fails because the act of classifying generates a new self-referring claim ('this is meaningless') with the identical logical shape as the original, not merely because self-reference exists somewhere nearby. A fix that classified without generating any new claim about the original sentence's own status wouldn't automatically hit this problem."
