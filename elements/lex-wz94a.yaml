id: lex-wz94a
name: a-few-appealing-axioms-can-uniquely-pin-down-one-procedure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before endorsing a list of properties you'd want a decision procedure to have, check whether that list has already been proven to identify exactly one procedure -- agreeing to the list may mean you've already agreed to the answer. May (1952), as Sen reports it, showed that a small set of conditions doesn't just narrow the field of acceptable voting rules. The rule has to cover any preference configuration whatsoever, stay blind to how people rank irrelevant options, and move the social ranking whenever a shift in someone's preference points that way. On top of that, swap which voter holds which opinion and the outcome can't budge (anonymity). Swap the labels on the alternatives themselves, and the same rule applies to the criterion picking a winner (neutrality). Sen: “These conditions look appealing, and May has proved that the only decisive CCR with an unrestricted domain, which is independent of irrelevant alternatives, and is also anonymous, neutral and positively responsive, is the method of majority decision ... If someone approves of all those conditions but is unwilling to accept the majority decision rule, then he has a problem, for at least one of these judgments must be rejected.” The conditions don't leave a shortlist -- they leave exactly one procedure standing, majority rule, and nothing else survives all five at once. Diagnostic move: before signing off on a wishlist of desirable properties for a decision-making procedure, check whether someone has already proven what that wishlist forces. Approving each property one at a time can feel like keeping your options open, when the properties taken together may have already closed off every option except one -- and rejecting that one outcome later means going back and giving up something you already agreed to."
