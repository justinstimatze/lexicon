id: lex-ss99z
name: choose-the-angle-where-geometry-equates-the-hard-and-easy-measurements
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Larkin's 'doubling the angle on the bow' technique finds a boat's distance off a landmark -- a quantity there's no direct instrument for on a moving boat -- without ever measuring distance. The navigator takes relative bearings on a fixed shore object as the boat cruises past it, and does nothing until the object reaches 45 degrees relative to the bow; at that instant, note the time. Then keeps cruising, doing nothing else, until the object is exactly abeam (90 degrees relative); note the time again. 'Using your DR formula, 60D = ST, calculate the distance run from the time that you were 45 degrees relative until you are abeam of the object. The distance run is equal to your distance off the object.' The 45-degree bearing forces a right isosceles triangle between the boat's two positions and the landmark. Inside that specific triangle, the leg you can't measure directly (distance off) turns out geometrically identical to the leg you can time precisely with a stopwatch and a known speed (distance run). Nobody measured distance off directly; they measured elapsed time at two chosen angles, and picking those particular angles is what converts an unmeasurable quantity into an already-solved one. The transferable move: when the number you actually need resists direct measurement, look around for something else nearby that's cheap and precise to read off. If a candidate turns up, hunt for a specific configuration -- a particular angle, moment, ratio, or reference point -- at which a fixed relationship (geometric, physical, or logical) forces the two quantities to be equal or simply convertible, and engineer the observation to land exactly on that configuration. The technique's power sits entirely in choosing WHERE to look; once you're standing at 45/90 degrees, the answer falls straight out of ordinary geometry, where any other pair of angles would send you back to trigonometry and an instrument you don't have."
related: [lex-ea5ug, lex-rp9us]
evokes: [doubling-the-angle-on-the-bow, isosceles-right-triangle, relative-bearing, distance-off-a-landmark, 45-90-trick, dead-reckoning-formula, measure-time-instead-of-distance]
lineage:
  - source: primary
    text: larkin-1993-basic-coastal-navigation
    citation: "Frank J. Larkin, Basic Coastal Navigation: An Introduction to Piloting (Sheridan House, 1993), Chapter 11, 'Taking and Plotting Bearings,' section 'Doubling the Angle on the Bow.'"
    quote: "'Doubling the angle on the bow is a quick, easy technique for determining your distance off a fixed-charted shore object or from an obstruction. [...] Take relative bearings to this object until your boat's heading is 45 degrees relative to the object. Record the time when you take the 45-degree bearing [...] Continue along your planned DR course until the charted object is abeam or 90 degrees relative to your boat's heading. Record the time [...] Using your DR formula, 60D = ST, calculate the distance run from the time that you were 45 degrees relative until you are abeam of the object. The distance run is equal to your distance off the object.'"
canonical-instances:
  - "A civil engineer needs the height of a tall structure with no way to climb it or bounce a signal off the top. Rather than estimate the angle from an arbitrary spot, they walk to the exact distance where the angle of elevation to the top reads 45 degrees -- at that specific angle, the height equals the measured ground distance directly, no trigonometric table needed."
  - "A stellar parallax astronomer times a star's apparent position from opposite ends of Earth's orbit, six months apart, rather than trying to gauge its distance by brightness alone -- picking that specific pair of vantage points converts an otherwise unmeasurable distance into an angle a telescope can read directly, with the geometry of the baseline doing the conversion (cf. lex-ea5ug for the same widened-baseline idea applied to a synthesized instrument aperture rather than a single navigational fix)."
  - "A software team can't directly measure how close a growing dataset is to breaking a system's memory budget, but they can precisely measure how the system's response time changes as load increases; instead of guessing at the breaking point, they run the load up to the exact point where response time visibly inflects, because that specific configuration is where the hard-to-measure quantity (headroom remaining) becomes readable off the easy-to-measure one (latency)."
  - "Operationally distinct from lex-rp9us widen-the-baseline-between-alignment-points-to-shrink-angular-error: lex-rp9us is an ERROR-REDUCTION technique -- it doesn't change what's being measured, it just widens the separation between two references so a given positioning error produces a smaller angular mistake. This atom is a MEASUREMENT-SUBSTITUTION technique -- it doesn't reduce any error at all, it replaces measuring a hard quantity (distance off) with measuring an easy one (elapsed time) by finding a configuration where geometry forces them equal. A blowgun barrel is still measuring the same thing (aim) more precisely; doubling the angle on the bow is measuring an entirely different thing (time) and getting the original quantity (distance) for free."
critical-questions:
  - "Does a configuration where the two quantities become forced-equal actually exist for this problem, or is the 45/90-degree pairing a special case that doesn't generalize? Not every hard-to-measure quantity has a convenient angle or moment waiting to be found; forcing the search when no such configuration exists just wastes time looking for a shortcut that isn't there."
  - "Can the observer actually reach and hold the required configuration precisely enough, or does approximating it (a bearing read as 'about 45 degrees') reintroduce the very imprecision the technique was meant to avoid? Larkin's own caveat -- question your speed curve if the answer shows a wide discrepancy -- is exactly this: an inexact hold on the special angle silently degrades the answer instead of visibly failing."
  - "Is the substituted 'easy' measurement actually independent of the same errors afflicting the 'hard' one, or does it quietly share a common source of error (current, wind, a flawed speed curve) that a naive read of the technique would miss? A trick that converts distance into time only helps if your time-keeping and your assumed speed are themselves trustworthy."
status: active
