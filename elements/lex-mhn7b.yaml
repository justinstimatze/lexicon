lineage:
  - source: primary
    text: eastman-unktomee-bundle-of-songs-face-persuaded-to-stay-quiet
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Ninth Evening: Unktomee and His Bundle of Songs.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'So he lay down in the warm sand near by, first telling his Face to be on the watch and to twitch if any one came, so as to awaken him. While Unktomee slept, the Fox returned with a friend. Unktomee's Face did not twitch as it had been told to do, for the Foxes stroked it very gently, and told it to be quiet.'"
canonical-instances:
  - "A company relies on a single automated fraud-detection alert with no separate escalation requirement, and an insider who knows the system simply configures a maintenance exception 'to be quiet' during a specific window, sailing straight through a control that was never actually adversarial to someone with legitimate-looking access to ask it nicely."
  - "A landlord asks a friendly, unpaid neighbor to keep an eye on a vacant property, and when a smooth-talking stranger shows up claiming to be a new tenant's mover and asks the neighbor not to worry about the truck being there overnight, the neighbor, having no real stake in the property, simply agrees and stops watching."
critical-questions:
  - "how does a designer actually build a watcher with genuine, resistant loyalty rather than one that will comply with whoever addresses it politely -- is a stake-holding guard always more expensive or harder to obtain than a purely mechanical or delegated one?"
  - "does every delegated watcher actually lack a stake, or are some proxies (a well-compensated employee, a system with real accountability built in) genuinely resistant to being talked down, making this a spectrum rather than a binary the story's simple mechanism suggests?"
  - "is the deeper failure here Unktomee's choice of guard, or his decision to rest at all while holding something valuable and vulnerable -- does blaming the guard's lack of loyalty let the actual decision-maker off the hook for accepting the risk of resting unguarded in the first place?"
