id: lex-9a377
name: sens-liberal-paradox-binds-only-those-keeping-both-commitments
type-in: situation
type-out: claim
_tier: molecule
agent-instruction: "When a rule makes two separate promises -- unanimous agreement always wins, and each person's own private business stays their own -- check whether anyone's preference reaches into someone else's private pair of options before assuming the two promises can be kept at once. Sen's liberal paradox shows they can't, even in the weakest possible form: give just two people each a say over one pair of alternatives that's purely their own affair, and if either person also has an opinion about the other's private choice, the unanimous ranking and the private-say ranking can point in opposite directions with no consistent way to satisfy both. But the paradox doesn't wound everyone who values both individual rights and collective welfare -- Sen closes his own discussion by naming exactly who it constrains: whoever refuses to give up either commitment cleanly. Deny that a preference about someone else's private business deserves any weight, or accept that unanimity shouldn't always win when preferences get nosy, and the impossibility stops applying to you. Diagnostic move: when a genuine impossibility result surfaces, don't treat it as a crisis for the whole field that cares about the topic -- find out who is actually holding both of the incompatible commitments at once, because the result only binds them, not everyone in the vicinity of the question."
decomposes-into: [lex-wmcny, lex-psgkw]
premises:
  - "Sen's liberal paradox shows that even the weakest form of personal autonomy -- minimal liberalism, where each of two people gets their own preference honored on one pair of alternatives that's purely their own business -- can conflict with unanimous agreement once either person has a preference about the other's private choice (lex-wmcny)."
  - "Sen's own worked case, the Lady Chatterley's Lover illustration, shows this isn't a remote theoretical possibility: three individually defensible commitments -- honoring A's say over his own reading choice, honoring B's say over his, and respecting their unanimous ranking of the two readers -- produce a genuine cycle with no best alternative among the three options (lex-wmcny)."
  - "Sen closes his own discussion by naming exactly who the paradox constrains: not everyone who cares about rights and collective welfare, but specifically whoever insists on keeping both the rights condition and the Pareto condition intact even when a preference reaches into someone else's private affairs (lex-psgkw)."
  - "Anyone willing to give up one of the two commitments cleanly -- denying that an opinion about someone else's private business deserves normative weight, or dropping strict unanimity when preferences turn nosy -- escapes the paradox; it binds only whoever tries to hold both at once (lex-psgkw)."
  - "Together, the two halves form a complete diagnostic. The first states the precise conditions under which the impossibility arises; the second identifies who those conditions actually describe, which is what keeps the result from reading as a wound to the whole field."
related: [lex-wmcny, lex-psgkw, lex-37m5b]
evokes: [liberal-paradox, paretian-liberal, minimal-liberalism, lady-chatterleys-lover-illustration, who-an-impossibility-result-actually-binds]
lineage:
  - source: primary
    text: sen-1970-liberal-paradox-and-its-scope-editorial-grouping
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 6, Conflicts and Dilemmas, Section 6.2, Liberal Values and an Impossibility Result, and Section 6.6, Critique of Unrestricted Domain, closing paragraph -- Sen states the paradox in 6.2 and its scope-of-application in the closing of 6.6, four sections apart in the source, not gathered into one unit there."
    quote: The paradox and the diagnostic about who it constrains are both Sen's own claims, stated separately in the source; grouping them into one two-part molecule is this corpus's editorial synthesis.
canonical-instances:
  - "The illustration itself, quoted in full in lex-wmcny's lineage: Mr A (the prude) and Mr B (the lascivious) hold opposite preferences over who reads Lady Chatterley's Lover, and honoring each man's say over his own reading choice while also respecting their unanimous ranking of the two of them reading it produces a preference cycle with no best alternative."
  - "The line naming who escapes, quoted in full in lex-psgkw's lineage: 'the no-nonsense man who denies the notion of nosiness' and 'would very likely accept condition P and reject L*' -- the paradox is 'only for an intermediate observer' trying to keep both."
  - "Hypothetical, mirroring Sen's own two-person structure rather than a group vote: neighbors A and B each get sole say over whether their own front yard displays a campaign sign -- purely their own business, nobody else's name on the property. A would rather neither yard have one; B would rather both did. Give each of them the final word over their own yard alone, then also hold the pair to a unanimous ranking of the two yards together -- and because neither one is actually indifferent to what the neighbor puts up, the same cycle Lady Chatterley's Lover produces shows up here too."
critical-questions:
  - "Sen's own resolution names two clean escapes (reject nosiness, or drop strict unanimity) but does not say which one a real institution should actually pick when the paradox bites -- is there a principled way to choose between the two escapes, or does the choice depend entirely on which commitment the institution values more, with no argument that settles it?"
  - "the diagnostic in lex-psgkw generalizes to any impossibility or trilemma finding, but could it end up excusing away something genuinely uncomfortable? A fair criticism of someone trying to have it both ways looks identical, from the outside, to a dodge that avoids a real tension most actual institutions do face -- and the diagnostic alone doesn't say which one is happening in a given case."
status: active
