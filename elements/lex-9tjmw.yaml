id: lex-9tjmw
name: choose-an-already-condemned-carrier-for-deniable-fabricated-evidence
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to introduce fabricated evidence into an adversary's information environment without the fabrication being traceable back to you if the carrier is caught, choose a carrier who has nothing further to lose — someone already condemned to a fate at least as bad as capture — because the standard risk calculus (a courier might be interrogated, might confess, might reveal who sent them) collapses when the courier's worst-case outcome from being caught is no worse than their current fate. Kautilya's method for reinforcing a fabricated rumor of betrayal within an enemy confederacy: 'Once the rumours had become widely current, a condemned man shall carry a [fictitious] letter, as if confirming that the conqueror had sent the presents as part payment for fighting or deserting his fellow confederates, with the promise of more payments later.' The choice of messenger is deliberate and load-bearing: an ordinary agent caught carrying forged evidence of betrayal has every incentive to talk in exchange for leniency, potentially exposing the whole operation; a man already condemned to death has no such leverage available to extract from him, and correspondingly nothing to gain by cooperating with interrogators — his silence costs him nothing he hasn't already lost, and the operation loses nothing if he is caught and killed, since that was already his fate. This is a distinct risk-management principle from ordinary operational security (compartmentalization, cutouts, deniability by ignorance) — it manages risk not by limiting what the courier KNOWS, but by ensuring the courier has NO INCENTIVE STRUCTURE left for an interrogator to exploit, regardless of what he knows. Diagnostic move: when designing any operation that requires a risky, exposed task, ask not only 'what does this person know that could be extracted from them' but also 'what leverage would an adversary have over this specific person if they were caught' — a person with something left to protect (freedom, family, reputation, future) is leverageable even with limited knowledge; a person with nothing further to lose removes that leverage almost entirely, independent of how much they actually know."
