name: envy-for-exclusivity-supplies-belief-in-a-self-harming-story
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone envies an exclusive group and asks how to join, you don't need a plausible story to get them to hurt themselves -- you need a story that flatters their desire to belong badly enough that they'll supply the belief you didn't earn. In Cushing's telling, the Burrowing-Owls tell a nosy, admiring Coyote that their sacred dance requires wearing your own grandmother's severed head and having your own legs deliberately broken, framed entirely as a mark of prestige: 'Instead of losing by this, they gain in a great many ways. Good luck always follows them.' None of this survives even a moment's scrutiny -- but the Coyote never scrutinizes it, because he wants access to something exclusive more than he wants to evaluate whether the price makes sense: 'don't you think that I could learn that dance?' The Owls privately acknowledge exactly what they're doing -- 'The silly fool; the sneaking, impertinent wretch!' -- because the story never had to be credible to a neutral observer, only to someone whose envy had already decided the answer before hearing the terms. Diagnostic move: when someone eager to join an exclusive group asks you what it costs, notice that their eagerness is doing the evaluative work you'd otherwise have to do yourself -- a genuinely absurd or self-destructive requirement can pass completely unchallenged past someone whose desire for belonging outpaces their willingness to question the price, and their envy, not your story's plausibility, is what makes the trap work."
