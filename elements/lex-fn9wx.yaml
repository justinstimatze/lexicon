lineage:
  - source: practitioner
    text: brooks-2023-how-to-know-a-person
    citation: "David Brooks, How to Know a Person: The Art of Seeing Others Deeply and Being Deeply Seen (New York: Random House, 2023), Part 1, Chapter Two, 'How Not to See a Person.'"
    quote: "'NAIVE REALISM. This is the assumption that the way the world appears to you is the objective view, and therefore everyone else must see the same reality you do. People in the grip of naive realism are so locked into their own perspective, they can't appreciate that other people have very different perspectives. You may have heard the old story about a man by a river. A woman standing on the opposite shore shouts to him: \"How do I get to the other side of the river?\" And the man shouts back: \"You are on the other side of the river!\"'"
canonical-instances:
  - "Two colleagues leave the same tense meeting with opposite readings of what happened; each is privately certain the other one is either lying about the tone in the room or too self-absorbed to have noticed it, when both are reporting accurately from where they were sitting -- one facing the room, one facing the door someone kept opening."
  - "A parent and their adult child argue over what a shared childhood was actually like, each treating the other's account as evidence of denial or a bad memory, when the household really did feel different depending on whether you were the one setting the rules or the one living inside them."
  - "Two nations narrate the same border conflict with each side's press treating its own account as simply 'what happened' and the other side's account as propaganda -- when both accounts are internally consistent from where each population is standing, and the asymmetry itself is the naive-realist tell."
critical-questions:
  - "How do you distinguish a genuine difference in vantage point from an actual factual error or bad-faith account? Naive realism explains disagreements that stem from position; it doesn't retroactively excuse disagreements that stem from someone getting the facts wrong or misrepresenting them, and treating every conflict as 'just two valid perspectives' can launder real error into false symmetry."
  - "Once you've correctly diagnosed a disagreement as two-vantage-points rather than one-side-wrong, what actually resolves it? Naming the asymmetry explains why the disagreement exists; it doesn't by itself tell either party what to do next when a shared decision still has to be made despite the standpoints not converging."
