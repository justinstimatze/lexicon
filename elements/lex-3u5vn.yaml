id: lex-3u5vn
name: compounding-processes-maximize-expected-log-not-expected-value
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When a decision repeats and profits reinvest — a wager, a portfolio allocation, any resource-commitment that compounds round over round — don't optimize for the expected value of capital after the next round. That criterion is maximized by staking everything, and staking too large a fraction (including everything) drives the process to ruin with probability one once it repeats indefinitely. Optimize instead for the expected value of the LOGARITHM of capital — equivalently, the long-run compounded growth rate. This isn't a risk-preference or diminishing-marginal-utility argument; it's structural: because capital compounds multiplicatively across rounds, the logarithm of capital — not capital itself — is what behaves additively and obeys the law of large numbers over repeated rounds. The correct stake is a specific fraction driven by your actual edge (how far true odds diverge from the odds offered), not by how favorable next-round expectation looks in isolation."
related: [lex-kxbm2, lex-2zyhy, lex-7wxxd, lex-kyc5a, lex-2t5qw]
evokes: [kelly-criterion, expected-log-of-capital, gamblers-ruin-with-probability-one, bankroll-fraction-not-flat-stake, edge-over-odds, private-wire-gambler-thought-experiment, betting-everything-maximizes-expectation-not-growth, fractional-kelly-in-practice]
lineage:
  - source: primary
    text: kelly-1956-new-interpretation-of-information-rate
    citation: "J. L. Kelly, Jr., 'A New Interpretation of Information Rate,' The Bell System Technical Journal 35(4):917-926 (July 1956). Kelly analyzes a gambler with private advance knowledge of a channel's transmitted symbols (e.g. a private wire on baseball scores) who bets repeatedly at given odds, with winnings reinvested each round. He shows the naive criterion — maximize the expected value of capital after N bets — is maximized by staking everything each round, which drives the gambler to ruin with probability one over an indefinitely repeated game. The correct criterion is to maximize G, the expected value of the logarithm of capital (equivalently the exponential growth rate), which yields a specific fractional stake per round and, under fair odds, equals Shannon's channel transmission rate exactly."
    quote: "[the over-betting trap, on staking everything each round:] 'Now the gambler could still bet his entire capital each time, and, in fact, this would maximize the expected value of his capital ⟨V_N⟩... This would be little comfort, however, since when N was large he would probably be broke and, in fact, would be broke with probability one if he continued indefinitely.' [the resolution — maximize G, not expected value:] 'Let us, instead, assume that he bets a fraction, ℓ, of his capital each time... Let us maximize G with respect to ℓ.' [the paper's own Conclusion, stating the general principle:] 'The gambler introduced here follows an essentially different criterion from the classical gambler. At every bet he maximizes the expected value of the logarithm of his capital. The reason has nothing to do with the value function which he attached to his money, but merely with the fact that it is the logarithm which is additive in repeated bets and to which the law of large numbers applies.' [on generalizing past gambling, to any reinvestment process:] 'Although the model adopted here is drawn from the real-life situation of gambling it is possible that it could apply to certain other economic situations. The essential requirements for the validity of the theory are the possibility of reinvestment of profits and the ability to control or vary the amount of money invested or bet in different categories.'"
  - source: discovery-loop
    text: lexicon-coverage-cli-uncovered-scan
    citation: "The source PDF is a 10-page image scan with no text layer; the quoted passages above were recovered via OCR from 300dpi page-image rasters."
canonical-instances:
  - "the paper's own private-wire gambler: knowing baseball results before they're public, a gambler could bet all his money each game and win with certainty against a noisy channel — but the noisy-channel case (each transmitted symbol has some error probability) is the general case, and there betting everything each round bankrupts the gambler with probability one, even though it maximizes expected capital at every step"
  - "position-sizing in trading and investing: a trader who sizes each position to maximize next-trade expected return, rather than long-run expected-log growth, systematically overbets relative to their actual edge — the position sizes that look best one trade at a time are not the ones that compound best over many trades"
  - "venture-capital and repeated-startup-bet portfolios: allocating capital across many risky, reinvested bets should track expected-log growth of the fund, not expected value of any single bet — this is why VC funds diversify across a portfolio rather than concentrating on the single highest-expected-value bet, which if oversized would risk fund-ruin on a bad early draw"
  - "'double or nothing' intuition failure: repeatedly doubling down after a win (or chasing losses) maximizes the expectation of any single next round while driving the compounded sequence toward near-certain ruin — the failure is treating a repeated, reinvested process as if it were a single terminal decision"
  - "operationally distinct from lex-kyc5a the-margin-of-safety-renders-an-accurate-forecast-unnecessary (Graham): margin-of-safety is about buying BELOW estimated intrinsic value so a single valuation error doesn't cost you — a cushion against being wrong once. This atom is about how much of your capital to commit to a REPEATED, reinvested decision so that compounding doesn't ruin you even when you're right on average — a sizing rule across many rounds, not a pricing cushion within one"
  - "operationally distinct from lex-kxbm2 convexity-bias and lex-2zyhy optionality: those atoms are about the SHAPE of a payoff (convex vs. concave exposure to variance, preserving the right to act without the obligation). This atom is about the OBJECTIVE FUNCTION to optimize once a decision compounds over repeated rounds — expected log of capital, not expected capital — which applies regardless of whether the individual payoff shape is convex or linear"
  - "operationally adjacent to lex-7wxxd exponentially-weighted-ensemble-yields-equality-where-simple-yields-inequality: both atoms turn on the same underlying mathematical fact — that a log/exponential-weighted operator, not a linear arithmetic one, is the correct summary statistic under multiplicative/exponential dynamics. lex-7wxxd applies this in non-equilibrium statistical mechanics (free-energy estimation via the Jarzynski equality); this atom applies it to repeated capital-reinvestment (Kelly's G). Different domains, same deep structural reason: multiplicative processes compound in log-space"
critical-questions:
  - "is this decision actually repeated with reinvestment, or is it a one-shot / non-reinvested decision (Kelly's own 'bet one dollar a week, don't reinvest' counter-case)? If winnings are NOT reinvested, maximizing plain expected value per round is correct — the log-growth criterion only applies once compounding is real"
  - "what is the actual edge here — how far do the true probabilities diverge from the odds/payout being offered? Without a real, quantified edge, there is no positive Kelly fraction to compute; sizing bets when the edge is illusory (over-fit backtest, mistaken probability estimate) just accelerates ruin"
  - "is the stake size being computed from expected-log growth, or is it being backed into from how good next-round expectation looks in isolation? The two criteria agree on direction (bet more when the edge is bigger) but diverge sharply on magnitude, especially near full-Kelly and beyond"
  - "in practice, is a fractional-Kelly (half-Kelly, quarter-Kelly) more appropriate than full-Kelly here, given that the true edge is usually an estimate, not a known quantity, and full-Kelly is maximally sensitive to overestimating that edge?"
status: active
