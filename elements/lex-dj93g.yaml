id: lex-dj93g
name: broad-development-is-advice-for-the-average-not-the-exceptional
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a widely-endorsed developmental rule feels like it's holding you back, check whether the rule was ever calibrated to you specifically, or only to the average practitioner it was built to serve. Réti draws the fork directly from Capablanca's break with a Morphy-era default: 'each move is to be regarded as an element of a scheme, that no move is to be made for itself alone (contrary sometimes to Morphy's principle that every move should have its concomitant development)... moves formerly considered self-understood and made, as it were, automatically by every good player, had to be discarded.' He then generalizes the fork past chess entirely: 'the principle that every move should advance development... but that the most gifted masters of to-day prefer to play from the beginning according to a scheme. This problem applied to life would present itself in this form—\"Should a man from the very outset develop all his powers and capacity or should he from the commencement of his career keep before his eyes a distinct object in life?\" Equally as in chess, one feels bound to recommend to the average man the former alternative...' — and the genius, he goes on, follows no such rule at all. The advice to develop broadly before committing isn't wrong; it's scoped. It fits someone without an unusually strong, already-formed plan of their own, and misfits someone who has one. Before urging the generalist rule on someone, or adopting it yourself, ask which of the two cases is actually in front of you."
related: [lex-2rpxq]
evokes: [reti-1923-symbolism-in-chess, capablancas-scheme-of-the-game, morphys-principle-of-development, advice-calibrated-to-the-median-case, the-genius-follows-no-such-rule]
lineage:
  - source: primary
    text: reti-1923-development-versus-scheme
    citation: "Richard Réti, Modern Ideas in Chess, trans. John Hart (New York: Dover Publications, 1974 reprint), pp. 119, 180."
    quote: "'As we younger masters learnt to know Capablanca's method of play, by which each move is to be regarded as an element of a scheme, that no move is to be made for itself alone (contrary sometimes to Morphy's principle that every move should have its concomitant development), we began to see that moves formerly considered self-understood and made, as it were, automatically by every good player, had to be discarded.' ... 'We have seen, for example, that in chess the principle that every move should advance development... but that the most gifted masters of to-day prefer to play from the beginning according to a scheme. This problem applied to life would present itself in this form—\"Should a man from the very outset develop all his powers and capacity or should he from the commencement of his career keep before his eyes a distinct object in life?\" Equally as in chess, one feels bound to recommend to the average man the former alternative...'"
canonical-instances:
  - "The paper's own repeated demonstration: Réti documents the youngest masters of his era (Alekhin, Bogoljubow, Breyer) explicitly breaking from Morphy-derived development doctrine in serious tournament play, while Capablanca's 'scheme first' style — every move justified only by the whole plan, not by a general rule — draws the book's highest praise in the very same chapters. The median-versus-outlier fork isn't a one-off illustration; it's the organizing story of the whole 'New Ideas' section."
  - "Hypothetical: a bootcamp rotates every junior engineer through backend, frontend, infra, and data before letting anyone specialize — sound advice for someone who doesn't yet know where their strength lies. The one engineer who already has a rare, well-formed research direction and skips the rotation to pursue it looks like she's defying the advice. She isn't — the advice was simply never built with her case in mind."
critical-questions:
  - "How does a learner or advisor actually tell, in advance, which case they're looking at? Réti gives no test — a mediocre player convinced of their own genius and a genuine genius look identical from the outside, right up until the results come in."
  - "Is the fork really binary — average gets breadth, genius gets a scheme — or is there a middle path where breadth IS the scheme, for someone whose distinct plan happens to require wide grounding first?"
  - "Réti frames this as a fact about ability level. Could it instead be a fact about how much is already known about the specific case: an average player faces real uncertainty about their own trajectory, so breadth hedges it, while a genius already has enough self-knowledge that specializing early isn't a gamble at all?"
