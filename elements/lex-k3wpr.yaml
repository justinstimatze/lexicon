id: lex-k3wpr
name: withholding-a-ready-rescue-until-the-crisis-fully-lands-cements-total-trust
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When you already have a solution to someone else''s crisis fully prepared, consider not revealing it immediately — let them feel the complete weight of having no way out first, including confronting their own past refusal to listen to you, before showing your hand. The relief lands harder, and the trust that follows is more total, than if the rescue had come the moment it was ready. In the Maha-Ummagga-Jataka, Mahosadha''s escape tunnel is already built and ready when King Vedeha, besieged and terrified, begs for comfort. Mahosadha instead rebukes him twice more, refusing even his advisor Senaka the same plea — "''Tis too late for men to act, too hard and difficult: I cannot deliver you, and you must decide for yourself''" — until the king is fully broken. Only then does he reveal what was ready all along: "Fear not, O king, fear not, lord of chariots; I will set thee free, like the moon when it is caught by Rahu."'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, withheld-rescue, delayed-relief, cementing-trust]
