evokes: [sacrifice-as-a-competed-for-role-not-a-coerced-fate, cushing-the-foster-child-of-the-deer, spared-unceasingly-in-other-form, who-among-ye-are-willing-to-die]
lineage:
  - source: primary
    text: cushing-foster-child-deer-herd-volunteers-for-the-hunt
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Foster-Child of the Deer.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'We are aware that we shall be hunted now... Even we ourselves are accustomed to give up our lives to the brave hunters among this people, for many of them are sacred of thought, sacred of heart, and make due sacrifices unto us, that our lives in other form may be spared unceasingly.' ... 'Who among ye are willing to die?' And, as if it were a festive occasion to which they were going, many a fine Deer bounded forth, striving for the place of those who were to die, until a large number were gathered, fearless and ready."
canonical-instances:
  - "A cooperative's founding members take turns stepping back from leadership roles to make way for new voices, competing to volunteer for the transition rather than needing to be pushed out, because the cooperative has consistently honored departing leaders with continued respect, equity, and involvement rather than discarding them once their term ends."
  - "Long-tenured employees at a company with a strong, consistently honored severance and alumni-network tradition volunteer for layoff rounds during downturns rather than needing to be selected, because the company's track record of treating departures with genuine care has made the sacrifice feel like a role within a trusted system rather than a pure loss."
critical-questions:
  - "how much of the Deer's willingness depends on having no real alternative -- is this genuinely voluntary reciprocity, or is it a system that has simply made peace with an outcome it can't actually prevent, dressed up in the language of willing sacrifice?"
  - "what happens to a system like this the first time the taking side stops honoring its half of the bargain -- does the story examine what would happen if hunters became careless or disrespectful, or does the reciprocal framing only hold as long as it's never tested?"
  - "does describing repeated loss as 'competed for' and 'festive' risk romanticizing what is still, underneath the framing, an asymmetric relationship where one side always dies and the other always eats -- is the volunteering itself evidence of genuine trust, or evidence of a narrative that makes an unequal arrangement feel mutual?"
