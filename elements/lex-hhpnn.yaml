id: lex-hhpnn
name: neglect-drives-self-sufficiency-that-forecloses-the-neglecters-return
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Sustained neglect can push the neglected party to develop genuine independence during the interval. By the time the neglecter wants to return to the relationship, the option is simply gone. There was no retaliation involved — the need that once bound them was resolved elsewhere while nobody was looking. The Jataka's tale of the prince and the woodland sprite lays out the case plainly: a prince becomes infatuated with a nymph, chases her, and ignores his wife entirely. He fails to win the nymph, comes back wanting his wife again, and finds she has spent the interval attaining complete spiritual self-sufficiency: 'Now desire has gone, Thanks to you, and found its ending: Like a tusk, once sawn, None can make it one by mending.' She isn't punishing him — the neglect simply gave her the exact space she needed to stop needing him, and that change, once complete, can't be undone by his change of heart."
related: []
evokes: [jataka, dukanipata, asitabhu-jataka, neglect-creates-the-space-for-independence-it-cannot-later-reverse, a-resolved-need-cannot-be-restored-by-the-original-neglecters-return]
lineage:
  - source: primary
    text: jataka-chalmers1895-asitabhu-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 234, Asitabhu-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Now desire has gone, Thanks to you, and found its ending: Like a tusk, once sawn, None can make it one by mending."
canonical-instances:
  - "A company that spends a year ignoring a struggling division while chasing a flashier acquisition target comes back wanting to reinvest once the acquisition falls through, only to find the division's team has spent the year building complete independence from headquarters and no longer needs or wants the parent company's support."
critical-questions:
  - "Is the change really irreversible, or could sufficient effort from the returning party eventually rebuild what was lost — does the tusk metaphor overstate the permanence, or does some threshold of self-sufficiency genuinely cross a point of no return?"
  - "Was the wife's transformation actually caused by the neglect specifically, or would she have pursued the same spiritual path regardless, with the prince's absence simply being incidental timing rather than the actual enabling condition?"
status: active
