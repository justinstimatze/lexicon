id: lex-urh87
name: gift-as-three-obligations-give-receive-reciprocate
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When a gift arrives, expect the three-obligation cycle (give → receive → reciprocate) to bind both parties. Refusing the gift refuses the relationship; accepting without reciprocating creates debt. Surface the obligation structure before treating gifts as voluntary."
related: [lex-33w6z, lex-dzqje, lex-5bpee, lex-e98pd, lex-3hefg, lex-xe76g, lex-avv9k, lex-nqxt9, lex-k7m6e, lex-shhk7, lex-eghgf, lex-krmj3, lex-9pubz, lex-ry9qx, lex-ynqj9, lex-u53ue, lex-akgce, lex-s7qxv, lex-643m7, lex-cj5bf, lex-hg2ym, lex-dyr9p, lex-vxnad]
scaffolds-from: [lex-ry9qx]
evokes: [mauss-prestation, the-gift-binds-thrice, give-receive-reciprocate-triad, refusal-equals-declaring-war, the-debt-the-gift-creates]
lineage:
  - source: primary
    text: mauss-1925-essai-sur-le-don
    citation: "Marcel Mauss, *Essai sur le don: Forme et raison de l'échange dans les sociétés archaïques* (originally in *L'Année Sociologique*, 2nd series, vol. 1, 1923-24; published 1925). English trans. Jane Guyer, *The Gift: Expanded Edition* (Hau Books / Univ. of Chicago Press, 2016). (haubooks.org). Mauss's central thesis: gift-exchange in archaic societies is constituted by THREE obligations — to give, to receive, to reciprocate — and failure of any one is equivalent to declaring war / refusing alliance / refusing communion. The triad is the operational structure of the gift; refusal at any node breaks the social-bond."
    quote: "[Mauss 1925/2016 Guyer trans. §III opening, p.73-74:] 'Other themes: The obligation to give, the obligation to receive. To understand completely the institution of total prestation and of the potlatch, we still have to find the explanation for the two other instances which are complementary to the first, for total prestation does not bring with it only the obligation to return the gifts (cadeaux) received; it presupposes two others, of equal importance: the obligation to give them, on the one hand, and the obligation to receive them, on the other. The complete theory of these three obligations, of these three themes in the same complex, would offer a fundamental and satisfying explanation for this form of contract between Polynesian clans.' [And:] 'The obligation to give is no less important. To study it could allow us to understand how people came to be exchangers. We can only point out a few facts. To refuse to give, to neglect to invite, as to refuse to take, is equivalent to declaring war; it is to refuse alliance and communion.' [The transferable operational claim: the gift's binding power operates through THREE distinct obligation-nodes, not through the gift-object itself. Refusal at give-node = stinginess-as-attack; refusal at receive-node = rejection-as-attack; refusal at reciprocate-node = bad-faith-as-attack. Each node is a separate hazard the gift navigates.]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v45
    citation: "Cross-domain attestation: diplomatic-protocol (state visits include reciprocal-gift ceremony where refusal at any node is read as hostility); business-development (the founder who can give-and-receive-and-reciprocate builds a deeper network than the founder who only takes); academic-citation (the obligation to cite-back when cited; the gift-as-information-given that demands reciprocation in subsequent papers); modern-digital (open-source contributions form gift-economies; refusing to upstream is the modern reciprocation-failure); kinship (Lévi-Strauss extended Mauss to argue marriage IS gift-exchange between clans — wife-as-gift creating the three obligations across generations); friendship-formation (the gift-friendship is built through repeated cycles of give-receive-reciprocate, distinct from market-exchange which terminates each transaction). Multi-substrate attestation across anthropology, diplomacy, business, academia, digital-commons, kinship, and friendship-economics."
    quote: "[Cross-domain consistency check, 2026-05-23: 7 instantiations across anthropology (Mauss's potlatch + kula-ring; Lévi-Strauss kinship extension), diplomacy (state-visit gift-protocol), business-development (network-building gift-economy), academia (citation-reciprocation), digital-commons (open-source contribution norms), kinship (wife-as-gift), and friendship-formation. All exhibit the same triadic structure: give-receive-reciprocate, with refusal at any node treated as relational-attack. The pattern is cross-substrate. Distinct from market-exchange (which terminates each transaction): gift-exchange creates ongoing obligation; that's the social-bond-engineering function. The triadic structure is what allows Mauss to predict where gift-relationships fail (the bind breaks at whichever node is refused, and the analysis tells you which node).]"
canonical-instances:
  - "the Mauss canonical potlatch case (Mauss 1925/2016 §II-III on Northwest Coast potlatch + Polynesian kula-ring): in the potlatch (Kwakiutl, Haida, Tlingit), chiefs compete via gift-giving including destruction-of-property to demonstrate the ability to give. Refusal to receive a potlatch gift = declaration of war; failure to reciprocate at next ceremony = loss of status, debt-slavery. The triad of obligations is fully institutionalized; the gift IS the political-economic structure. Mauss treats this as evidence the triad is universal across archaic societies"
  - "the diplomatic-state-visit canonical case (modern, cross-cultural): state visits include reciprocal-gift exchange (Saudi king gives jeweled-sword; recipient state must give something proportional; failure to give back or to publicly-display-receiving creates diplomatic incident). Modern diplomatic-protocol IS the institutional descendant of Mauss's archaic gift-exchange. The three obligations are encoded in protocol manuals (e.g., the U.S. State Department's Office of Protocol explicitly handles all three nodes)"
  - "the open-source-software canonical case (modern digital): contributors give code; downstream users receive (clone, fork, depend); the reciprocation expectation is to upstream-changes, file-issues, document-use, or cite-the-project. Refusal to reciprocate (closed-source forks of GPL code; vendored-without-attribution) breaks the social-bond and produces explicit license-enforcement consequences. The GPL itself is a legal-codification of Mauss's reciprocation-obligation specifically for code"
  - "the academic-citation canonical case: paper A cites paper B (gift-of-attention); paper B's author 'receives' the citation by acknowledging it in subsequent work; the reciprocation-obligation operates over years across the publishing network. Refusal at any node — failure to cite (gift-refused), failure to engage when cited (reception-refused), failure to credit in derivative work (reciprocation-refused) — produces specific reputational consequences (citation-omission as snub; cite-and-ignore as condescension; uncredited-borrowing as plagiarism). Academic culture IS a Maussian gift-economy"
  - "the marriage-as-gift-exchange canonical case (Lévi-Strauss 1949 *Elementary Structures of Kinship*): Lévi-Strauss extends Mauss to argue marriage between clans is gift-exchange of women — the wife-as-gift creates the three obligations across generations. Refusal-to-give-daughters (endogamy strict) = clan-isolation; refusal-to-receive = social-rejection; refusal-to-reciprocate (no return-marriages in next generation) = bad-faith. The pattern explains kinship-structure across many societies. (Modern reading: the gendered framing is problematic; the structural-observation about cross-clan exchange-relationships still holds.)"
  - "the friendship-formation canonical case (cross-cultural common observation): friendships build through repeated give-receive-reciprocate cycles over time. The friend-who-only-takes (never gives, never reciprocates) is read as parasitic; the friend-who-only-gives (refuses to receive, blocks reciprocation) is read as patronizing; the friend-who-gives-and-receives-but-never-reciprocates-back is read as keeping-score-against-you. Distinct from market-exchange: market-relationships terminate per-transaction; friendships sustain obligation. Mauss's analysis applies"
  - "operationally distinct from lex-33w6z sacrifice-as-transformation: lex-33w6z names sacrifice as a specific MOVE (give up X to gain Y; cost IS the mechanism). lex-urh87 names the THREE-NODE structure of gift-exchange specifically — give + receive + reciprocate. A sacrifice is one half of one node (the give-side); the gift-triad is the larger structure that sacrifice participates in. They co-fire: many sacrifices are gifts (Christ's sacrifice as gift-to-humanity creating obligation-to-reciprocate via faith); but not all gifts are sacrifices (a regular birthday gift binds without requiring sacrifice-level cost). lex-urh87's broadening of lex-33w6z: Mauss-grounding for the gift-as-binding canonical-instance"
  - "operationally distinct from lex-5bpee commitment-and-consistency-pressure: commitment-pressure uses YOUR prior behavior as the binding signal. gift-as-triad uses the EXCHANGE-RELATIONSHIP'S history. They can compose: each gift creates a commitment to consistency (you've now demonstrated capacity-to-reciprocate; future failures become commitment-violations) AND the cross-actor obligation Mauss names. Cialdini's reciprocity-principle is partially Maussian but narrower (focuses on the receiver's obligation to reciprocate; doesn't centralize the giver's obligation-to-give)"
  - "operationally adjacent to lex-e98pd reciprocity-as-influence-mechanism: lex-e98pd is the Cialdini-tradition narrower-framing of reciprocity as an influence-principle (receiver feels obligation-to-return). lex-urh87 is the broader Maussian framing: ALL THREE nodes are obligation, not just the reciprocation-node. Influence-practitioners use the reciprocation-node; the broader gift-economy framework requires attention to all three"
  - "operationally adjacent to lex-dzqje licensed-transgression-within-trusted-frame: the gift-triad can be inverted as licensed-transgression (the comic roast WHERE the gift IS the insult; the potlatch destruction-of-property where giving-by-destroying inverts ordinary gift-rules). lex-dzqje supplies the institutional-frame within which the inverted-gift functions as relationship-renewal rather than relationship-attack"
  - "operationally adjacent to lex-3hefg trust-formation: the gift-triad's first-give is an act of vulnerable-trust (you give without guarantee of reciprocation); the receive is an act of allowing-yourself-to-be-bound; the reciprocate is an act of confirming-the-trust. Trust supplies the substrate that lets the triad operate; the triad operates is one of the mechanisms through which trust is built and tested"
  - "operationally adjacent to lex-xe76g ring-of-gyges: the gift-triad operates partly through external-observability (visible refusal at any node has consequences). The ring-of-gyges question for gift-exchange: would the actor still honor the obligations if observation were removed? Mauss's analysis is structural-not-motivational; whether the individual actor internalizes the obligation or merely complies-because-observed varies. The internalization-vs-compliance question is the Gyges-test applied to gift-exchange"
critical-questions:
  - "the actually-gift-vs-market discrimination: is this exchange operating as a gift (creates ongoing obligation; refusal-at-any-node is attack) or as a market-transaction (terminates per-trade; refusal at any node is just no-deal)? Many modern interactions blend both. Practitioner-question: is the relationship being built/maintained, or is each transaction the unit? Gift-as-transaction is the boundary failure-mode"
  - "the which-node-failed diagnosis: when a gift-relationship breaks, which of the three obligations was refused? Stinginess at give-node, rejection at receive-node, or bad-faith at reciprocate-node? Different repairs apply. Practitioner-discipline: locate the specific node before attempting repair; treating a give-refusal as a reciprocate-failure misdirects the remediation"
  - "the agonistic-potlatch failure-mode: gift-exchange can escalate into competitive-destruction (potlatch chiefs destroying property to demonstrate ability-to-give beyond rival's reciprocation-capacity). Practitioner-question: is the gift-cycle in this relationship cooperative (mutual-strengthening) or agonistic (status-competition through escalation)? The two look surface-similar but produce opposite consequences"
  - "the cross-cultural translation hazard: Mauss derives the triad from Northwest Coast + Polynesian + Maori ethnography. Translation to other contexts requires verifying the obligations are felt-similarly. The three-obligation framing fits Western friendship-economies but maps differently in markets-dominated cultures (the gift is suspected as manipulation; the obligation is resisted). Practitioner-question: in this context, does the gift land as gift, or as transaction-suspected-to-have-hidden-strings?"
  - "the modern-context calibration: in market-saturated modernity, gift-exchange survives in family, friendship, mentoring, open-source, and ceremonial diplomatic contexts. The triad is intact in those zones; outside, market-rules apply. Practitioner-discipline: when invoking gift-logic in modern contexts, verify the context belongs to the gift-zone, not the market-zone. Mixing logics produces the kind of confusion Bourdieu analyzes — 'the gift-economy as misrecognized market'"
  - "the influence-weaponization risk (lex-e98pd Cialdini): the gift-triad's reciprocation-obligation can be weaponized by giving small unwanted gifts to manufacture obligation in the recipient. Hare-Krishna airport-flower; corporate-promotional-pen; the 'free' consultation that creates pressure to engage. Practitioner-question: is this gift initiating a genuine relationship or constructing a one-sided obligation? The Mauss-Cialdini distinction is consent-to-the-relationship's-future"
status: active
