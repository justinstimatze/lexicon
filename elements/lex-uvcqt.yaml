evokes: [reasons-of-love, final-ends, volitional-necessity, value-conferring-love, caring-versus-wanting-for-its-own-sake, frankfurt-2004, love-as-source-of-reasons, terminal-value, disinterested-concern-for-the-beloved, boredom-as-loss-of-final-ends, what-we-love-is-not-up-to-us]
lineage:
  - source: primary
    text: frankfurt-2004-the-reasons-of-love
    citation: "Harry G. Frankfurt, *The Reasons of Love* (Princeton University Press, 2004), based on the 2000 Romanell Lectures. The argument runs across the book's three chapters. Chapter One, §5, first separates caring about something from the weaker notion of wanting something purely for its intrinsic value (as a final end, for its own sake) — you can desire a thing entirely for its own sake, recognize it as having no further instrumental point, and still not care about it at all, because caring requires a further, reflexive commitment to sustaining the desire, not just the desire itself. Chapter Two, 'On Love, and Its Reasons,' §1-2 establishes that loving something is itself a source of practical reasons for the lover (illustrated via a reworking of Bernard Williams's drowning-wife example). §3-4 make the book's central reversal: love is not most fundamentally a response to the beloved's independently-existing value; rather, what is loved acquires its value FOR THE LOVER because it is loved, worked out through the paradigm case of parental love. §5-6 argue this structure is not a matter of choice — 'what we love is not up to us' — but a volitional necessity (a constraint operating from within the will itself, not logical necessity, and not felt as confining but as liberating, ending the paralysis of having no settled object of care). §7-9 argue that loving is what supplies human practical reasoning with final ends — terminal, non-instrumentally-justified objects of pursuit — and that without loved final ends, nothing could matter to us even as a means, because instrumental importance is parasitic on some end down the chain mattering non-instrumentally; Frankfurt develops this via Aristotle's claim (Nicomachean Ethics 1094a) that desire aiming at nothing desired for its own sake is 'empty and vain,' and via an extended analysis of boredom as the affective signature of a life with goals but no final ends. Chapter Three, 'The Dear Self,' extends the framework to self-love, which is not covered by this atom's headline claim but is a natural next-chapter application of the same value-conferring structure."
    quote: "[Chapter One, §5, on caring vs. wanting-for-its-own-sake, the ice-cream case:] 'When I want an ice cream cone, I want it simply for the pleasure of eating it. The pleasure is not a means to anything else; it is an end that I desire for its own sake alone. However, this hardly implies that I care about eating the ice cream. I generally recognize quite clearly on such occasions that my desire is inconsequential, and that its object is not at all important to me. A person cannot fairly be presumed to care about something, then, even if he wants it just for its own sake and thus regards fulfilling his desire for it as among his final ends.' [Chapter Two, §2, love as itself a source of reasons, the drowning-wife case:] 'If he does truly love her, then he necessarily already has that reason. It is simply that she is in trouble and needs his help... Loving someone or something essentially means or consists in, among other things, taking its interests as reasons for acting to serve those interests. Love is itself, for the lover, a source of reasons. It creates the reasons by which his acts of loving concern and devotion are inspired.' [Chapter Two, §3, the direction-of-explanation reversal, on parental love:] 'I do not love my children because I am aware of some value that inheres in them independent of my love for them... It is really the other way around. The particular value that I attribute to my children is not inherent in them but depends upon my love for them. The reason they are so precious to me is simply that I love them so much... it is plainly on account of my love for them that they have acquired in my eyes a value that otherwise they would certainly not possess.' [Chapter Two, §5, volitional necessity — 'what we love is not up to us':] 'There are no necessities of logic or of rationality that dictate what we are to love. What we love is shaped by the universal exigencies of human life... It can be measured only against requirements that are imposed upon us by other things that we love... The volitional necessity that constrains us in what we love may be as rigorously unyielding to personal inclination or choice as the more austere necessities of reason. What we love is not up to us.' [Chapter Two, §7-9, on final ends and why loving is important:] 'Why is loving so important to us?... Part of the explanation has to do with the importance to us of having final ends. We need goals that we consider to be worth attaining for their own sake and not only for the sake of other things... without final ends we would find nothing truly important either as an end or as a means. The importance to us of everything would depend upon the importance to us of something else. We would not really care about anything unequivocally and without conditions... It is love, I believe, that meets this need. It is in coming to love certain things... that we become bound to final ends by more than an adventitious impulse or a deliberate willful choice... Love is the originating source of terminal value. If we loved nothing, then nothing would possess for us any definitive and inherent worth.'"
canonical-instances:
  - "Frankfurt's own central worked example: parental love. He 'loved [his] children even before they were born — before I had any especially relevant information about their personal characteristics or their particular merits and virtues' and explicitly rejects the question of whether his children are 'worthy' of his love as misguided, because the love was never conditioned on an independent value-audit in the first place; the value he attributes to them is downstream of, not a precondition for, the loving."
  - "The ice-cream-cone case for the caring/wanting distinction: wanting a trivial pleasure purely for its own sake, with full recognition that 'my desire is inconsequential, and that its object is not at all important to me' — demonstrating that intrinsic-value-desired-as-a-final-end is not sufficient for caring, let alone for loving."
  - "The reworked drowning-wife thought experiment (responding to Bernard Williams's 'one thought too many'): a man who truly loves his wife does not need, and would be doing something faintly corrupt by seeking, a general justifying principle for saving her over a stranger — 'the fact that he loves her entails that he takes her distress as a more powerful reason for going to her aid,' the love itself supplying the reason rather than responding to an antecedently established, impartially-verified importance."
  - "Frankfurt's account of boredom as the affective marker of a life with instrumental goals but no loved final ends: 'without final ends we would find nothing truly important either as an end or as a means' — used here as the canonical instance for the burnout/meaninglessness cross-domain application, where the presenting symptom (nothing feels worth doing) traces to a structural loss of loved terminal ends rather than to depleted energy alone."
critical-questions:
  - "Is the claim 'X matters to me because X is independently/objectively important' actually running in that direction, or would X's importance evaporate if the person's loving/caring for X were subtracted — in which case the real direction is the reverse (X matters because it's loved, and the 'objective importance' talk is a post-hoc gloss)?"
  - "Is this a case of wanting-something-for-its-own-sake (recognizing intrinsic value, as with Frankfurt's ice-cream cone) or of actually caring/loving? Test: does the person work to sustain the desire, feel invested in its persistence, experience its frustration as loss — or would they shrug and let it go without cost?"
  - "In the practical-reasoning chain under examination, is there a loved final end anchoring it — or does 'why does this matter' regress indefinitely, means justified by further means, with nothing non-instrumentally loved at the terminus? If the latter, per Frankfurt, nothing in the chain, including the means, actually matters."
  - "Is 'what we love is not up to us' being invoked honestly — to explain why a love doesn't require (and can't be given) an antecedent rational certification — or is it being used to dodge responsibility for a love's foreseeable costs to others? Frankfurt's volitional-necessity claim explains why loving isn't chosen; it does not, on its own, discharge what a lover owes to those affected by what the love leads them to do."
  - "Is this atom being conflated with lex-63e4c (Frankfurt on indifference to truth-value) or lex-7wvdb (Frankfurt on hierarchical/second-order desires and free will)? Confirm the operative claim here is specifically about the DIRECTION OF EXPLANATION between loving and mattering, and about final ends as the precondition for anything mattering instrumentally — not about truth-tracking or about the structure of first- vs. second-order volition."
