lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 1 'Introduction,' Section 1.2 'Ingredients of Collective Choice,' p.47. The two numbered statements appear as a short list in the source; reproduced inline here."
    quote: "“It is important to distinguish between indifference and lack of completeness. Our daily language is often loose enough to fail to distinguish between the two. If I ‘don’t know’ which one to choose, this could possibly mean that I am indifferent, though a more natural meaning is that I cannot make up my mind. The logical difference between the two is simple enough. Consider the two statements: (1) x is at least as good as y (2) y is at least as good as x. In the case of ‘indifference’ both are being asserted, and, in the case of lack of ‘completeness’, neither.”"
canonical-instances:
  - "A UX researcher asks which of two onboarding flows a user prefers and records 'no preference' for anyone who says 'I don't know.' A handful of those users genuinely liked both equally well. Most of the rest just hadn't used either flow long enough yet to form any opinion, and lumping the whole group together throws away exactly the users who'd land on a strong opinion after one more week of use."
  - "A couple deciding between two apartments both answer 'either is fine' when asked which they prefer. One means it: truly torn, happy walking through whichever door gets picked. The other hasn't actually managed to picture living in either place yet, and pressed further would rather wait than flip a coin -- the shared phrasing makes both positions sound identical when they aren't."
critical-questions:
  - "Does the distinction matter in practice, if both the indifferent and the undecided end up accepting whatever gets chosen for them? Only until something changes. New information, more time, or a different framing leaves an indifferent person's answer exactly where it was, while an incomplete comparison can resolve into a real preference once the missing piece shows up. Treating both as settled forecloses a comparison the second group hadn't actually finished making."
  - "Isn't asking someone which of the two statements they'd endorse just as demanding as asking them to rank the alternatives outright -- doesn't this just relocate the original difficulty? To some degree, and Sen doesn't claim the distinction is always easy to elicit. What it does provide is a name for what's actually missing -- a comparison, versus the absence of one -- which beats the ambiguous 'I don't know,' and it flags when further probing is worth the effort instead of treating every shrug as a dead end."
