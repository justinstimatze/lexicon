lineage:
  - source: primary
    text: gibson-1984-neuromancer-mycotoxin-punishment-and-armitage-recruitment
    citation: "William Gibson, Neuromancer (1984; Ace Books). Fiction; in-copyright, quoted here under fair use in short, attributed excerpt for critical/analytical commentary. Two passages: Case's backstory (his former employers' punishment for theft) and Armitage's recruitment pitch aboard the Sprawl, in which Armitage reveals he has implanted a second, reversible version of the same mycotoxin threat as leverage to secure Case's compliance."
    quote: "They damaged his nervous system with a wartime Russian mycotoxin... For Case, who'd lived for the bodiless exultation of cyberspace, it was the Fall. [...] So you see, Case, you need us. You need us as badly as you did when we scraped you up from the gutter."
canonical-instances:
  - "Case's mycotoxin punishment: his employers don't kill him for theft, they surgically end his cyberspace career while leaving him alive and 'welcome to the money' — manufacturing exactly the desperation Armitage later exploits by implanting a second, reversible version of the same damage and offering restoration as the price of the job."
  - "a disbarred attorney recruited into a fraud operation: disbarment, rather than imprisonment, removes the specific capacity — the license to practice — that the person's entire professional identity was built on, while leaving them free to work; the operation offers ghost-practice work that lets the person still function as a lawyer in substance, which straightforward cash alone would not."
  - "a blacklisted whistleblower or purged party cadre recruited back by a promise of reinstatement: the original punishment (blacklisting, expulsion) removed access to a specific professional or political identity rather than the person's freedom, and the recruiter's offer of a path back to that identity carries leverage an equivalent cash payment to a never-blacklisted person would not."
critical-questions:
  - "how does this differ from lex-u68ue (significance-quest, Kruglanski)? lex-u68ue's significance-quest is a GENERAL motivational state — any form of significance-loss (humiliation, social exclusion, trauma, status threat) activates a search for meaning satisfiable by many different routes (ideology, group-joining, escalating commitment). This atom is narrower and mechanistically sharper: the loss is not general significance but a SPECIFIC, NAMEABLE PROFESSIONAL CAPACITY, and the desperation it manufactures is satisfiable by exactly one thing — restoration of that specific capacity — which is what makes the recruiter's specific offer, and only that offer, effective. A significance-quest can be redirected toward many substitute meanings; capacity-specific desperation cannot be redirected the same way, because the person doesn't want meaning in general, they want their hands back."
  - "how does this differ from lex-e98pd (reciprocity-as-influence-mechanism)? lex-e98pd's reciprocity fires from an unprompted GIFT that creates an automatic, often-disproportionate obligation to reciprocate — the mechanism works even for strangers and small gestures. This atom's leverage isn't a gift at all; it's the offer to undo a deliberately-caused injury, and the leverage is proportional to how much the person needs the specific thing being restored, not to any generalized felt-obligation-to-reciprocate. A reciprocity-obligation can be discharged and the relationship can end; capacity-specific desperation persists exactly as long as the restoration remains incomplete or reversible (as with Case's still-dissolving toxin sacs), which is what makes it a renewable, not one-time, form of leverage."
  - "is this the same as ordinary economic desperation (e.g. poverty) driving someone to accept exploitative work? No — the atom's claim is specifically about capacity-loss, not resource-loss. General poverty makes many kinds of offers attractive; capacity-specific desperation makes ONE kind of offer uniquely attractive — restoration of the exact thing that was taken — even when a cash-equivalent offer of similar or greater value would be refused, because cash doesn't restore who the person was. This is what makes the pattern recruitment-specific rather than merely poverty-exploitative: the recruiter is offering identity-restoration, not just income."
