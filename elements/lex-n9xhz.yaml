id: lex-n9xhz
name: deserved-torment-is-perceived-by-the-sufferer-as-pleasure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A being whose accumulated deeds have earned a specific punishment can perceive that very punishment as delightful for as long as the karmic debt remains unexhausted, with the sensory distortion lifting the instant the debt transfers to someone else. In the Jataka''s tale of Mittavindaka, a hell realm and its torments appear beautiful to him right up until he takes on another''s punishment: "to Mittavindaka it appeared as though a city all beautiful" and "it seemed as though that razor-wheel upon his head were a lotus bloom" and "the sound of groaning was as the sound of sweetest song."'
related: []
evokes: [jataka, dasanipata, catu-dvara-jataka, mittavindaka, karmic-desert, perception-distortion]
lineage:
  - source: primary
    text: jataka-chalmers1895-catu-dvara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 439, Catu-dvara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "to Mittavindaka it appeared as though a city all beautiful... it seemed as though that razor-wheel upon his head were a lotus bloom... the sound of groaning was as the sound of sweetest song."
canonical-instances:
  - "A gambler deep in debt experiences the collections agency's threatening calls as a kind of validation that he still matters to someone, right up until the debt is called in and the illusion collapses into plain fear."
critical-questions:
  - "Is this a claim about how perception actually works under unresolved consequence, or only a narrative device for making an abstract moral debt concrete to a listener?"
status: active
