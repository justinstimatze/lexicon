id: lex-sfgxa
name: the-cures-founder-isnt-covered-by-their-own-cure
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you establish a system that reliably treats a danger for everyone else, don't assume that system will work the same way on you when your own turn comes -- your relationship to the source of that danger may be categorically different from every case you've successfully handled, in a way that makes your own instance of it not an accident to be fixed but something else entirely. In Cushing's telling, a man who married into the Rattlesnake people learns their medicine and cures eight separate snakebite victims using it, becoming the founder of what will be a whole healing tradition. When he himself is finally bitten, by 'his fathers,' the rattlesnakes who are literally his wife's people, his own trained disciples 'tried in vain to cure him,' and he dies. Cushing poses the explanation as a rhetorical question rather than a mystery: 'Need we ask why he was not cured by his disciples?' His bite was never an accident in the sense the other eight were; it was his own fathers-in-law calling him home to rejoin the wife and children he'd already lost. The cure worked perfectly on every case that was actually an injury -- it had no purchase on a summons dressed up as one. Diagnostic move: when you've built or mastered a system that reliably solves a problem for others, don't assume your own encounter with that same-looking problem is drawn from the same population -- ask whether your specific relationship to its source might make your case fundamentally different in kind, not just in severity, from every instance your method has already proven itself against."
related: []
evokes: [your-own-case-may-not-be-drawn-from-the-same-population-as-the-ones-you-cured, cushing-the-boy-hunter-and-the-rattlesnakes, need-we-ask-why-he-was-not-cured-by-his-disciples, a-summons-dressed-up-as-an-accident]
lineage:
  - source: primary
    text: cushing-boy-hunter-founder-dies-of-the-bite-his-own-cure-cant-touch
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Boy Hunter Who Never Sacrificed to the Deer He Had Slain: or the Origin of the Society of Rattlesnakes.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'There, alone in the forest, he was met and bitten by his fathers. Although he slowly and painfully crawled home, long ere he reached his town he was so swollen that the eight whom he had instructed tried in vain to cure him, and, bidding them cherish as a precious gift the knowledge of his beloved wife, he died. Immediately his fathers met his breath and being and took them to the home of the Maiden of the Rattlesnakes and of his lost children. Need we ask why he was not cured by his disciples?'"
canonical-instances:
  - "A burnout-prevention consultant who has successfully coached dozens of executives back from the edge of collapse experiences their own severe burnout and finds none of their own techniques work, because their case isn't a garden-variety instance of the problem they've treated -- it's the compounded result of absorbing everyone else's crises for years, a fundamentally different mechanism wearing the same symptoms."
  - "A cybersecurity expert who has built a company's entire incident-response protocol around detecting and neutralizing external attacks is compromised by an insider threat their own system was never designed to catch, discovering too late that their expertise, built entirely against one category of danger, offered no protection against a different one that happened to look similar on the surface."
critical-questions:
  - "is this actually a case of the cure genuinely not applying, or does the story simply need him to die in order to reunite him with his family, using 'it wasn't really an accident' as a narrative device rather than a diagnosable, generalizable mechanism?"
  - "how would someone in this position actually recognize, before it's too late, that their own case is categorically different rather than just an unusually severe version of what they've already successfully treated -- is there any actionable early warning, or is the distinction only visible in hindsight?"
  - "does this pattern risk becoming a fatalistic excuse, 'my case is special, the usual cure won't work on me,' that discourages someone from trying every available option, when in less mythic circumstances the honest answer might simply be that the treatment failed and could have been improved?"
status: active
