id: lex-am8cj
name: closet-as-epistemic-structure-makes-disclosure-simultaneously-compulsory-and-forbidden
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When a subordinated identity faces a disclosure decision, check whether the surrounding regime is double-bound — penalizing BOTH disclosure AND non-disclosure through structurally separate sanctions. If so, the closet structure is operating, and 'just come out' / 'stay quiet' advice both miss that the bind is in the regime, not the choice. The asymmetry is the artifact; the contradiction is the mechanism."
