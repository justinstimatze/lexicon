id: lex-earu6
name: taking-a-protected-form-bypasses-defenses-built-for-an-adversary
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Defenses built to repel an armed, external threat can be walked straight through by something that instead takes the form of what those same defenses are designed to protect -- a dependent, a helpless member of the household -- because the guard is watching the door for an intruder, not watching the nursery for a threat that has already been welcomed inside. Hyde reads Raven's theft of daylight exactly this way: after entering the chief's household as a swallowed cedar leaf and being born as the daughter's child, \"as a crying baby he then subverts the group's defenses (as con artists sometimes use their children to soften up the mark). All good people are vulnerable to the helpless, unhappy child. If Raven had approached the lodge armed with weapons and demanding the Daylight-Box in a loud voice, he would have had a fight on his hands. But as a helpless babe he is not only welcomed and washed, he is actually given the prize.\" The lodge's defenses were never designed to be suspicious of an infant's crying; they were designed to repel force. Raven doesn't defeat those defenses, he simply doesn't trigger them, because he never presents as the kind of thing they exist to stop. Diagnostic move: when assessing how well-defended something is, ask what category of threat the defenses were actually built to recognize -- a defense calibrated for an external, adversarial intruder has no natural trigger for something that arrives already claiming a protected, dependent status, and that gap is where it can be walked straight through."
