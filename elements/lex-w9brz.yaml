id: lex-w9brz
name: concealing-a-status-marker-behind-a-true-alternate-identity-avoids-pre-judgment
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Approaching someone who would dismiss you on sight for your actual rank, give a different but genuinely true identity that omits the disqualifying status marker, so you get heard on the substance before anyone decides you don''t merit a hearing. In the Vidhurapandita-Jataka, the Yakkha general Punnaka is himself a servant to Vessavana, and when King Dhananjaya asks his name before a high-stakes wager, Punnaka reasons: "if I tell him that I am Punnaka, he will say, ''He is a servant, why does he speak to me so audaciously?'' and he will despise me; I will tell him my name in my last past birth" — and gives the king his former, higher-status name, Kaccayana, which is not a fabrication but a real prior identity, just not the one that would get him dismissed. The king engages him as an equal and the wager proceeds; had Punnaka led with "servant," the conversation likely wouldn''t have started.'
related: []
evokes: [jataka, mahanipata, vidhurapandita-jataka, status-management, identity-framing, avoiding-dismissal]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-vidhurapandita-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 545, Vidhurapandita-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The other reflected, \"This king asks my name: now it is the servant Punnaka; but if I tell him that I am Punnaka, he will say, 'He is a servant, why does he speak to me so audaciously?' and he will despise me; I will tell him my name in my last past birth.\" So he uttered a stanza: \"I am a youth named Kaccayana, O king.\""
canonical-instances:
  - "A self-taught programmer applying to a technical role omits 'no degree' from the first conversation and leads with the specific systems he's built, so the hiring manager evaluates the work before deciding whether the credential gap disqualifies him."
  - "A former enlisted service member consulting on a project run by officers introduces himself by his current civilian title and expertise rather than his old rank, so the room treats his input as coming from a subject-matter expert rather than filtering it through a hierarchy that no longer applies."
critical-questions:
  - "Punnaka's alternate identity is technically true — a real past-life name — which is what makes this different from lying; how much does the tactic depend on there being some genuine, presentable identity to lead with, versus a case where the only honest answer is the disqualifying one?"
  - "The tactic works because the king never learns Punnaka's actual status until after the wager is settled — is the deception here only in the omission, or does letting someone form a false impression of who they're dealing with carry the same weight as an outright lie?"
