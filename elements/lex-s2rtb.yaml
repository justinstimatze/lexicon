lineage:
  - source: primary
    text: kolbert-2014-the-sixth-extinction
    citation: "Elizabeth Kolbert, The Sixth Extinction: An Unnatural History (Henry Holt and Company, 2014; winner of the 2015 Pulitzer Prize for General Nonfiction). Chapter I, 'The Sixth Extinction,' the section following the chytrid-fungus/amphibian-die-off reporting, where Kolbert turns from the specific Bd case to the general paleontological literature distinguishing background extinction from mass extinction. The ebook-derived plain-text extraction used for this mining pass carries no reliable page numbers; quotes are cited by chapter and section content. Kolbert is a staff writer for The New Yorker; the chapter draws on and quotes Anthony Hallam and Paul Wignall (Mass Extinctions and Their Aftermath, Oxford University Press, 1997), David Jablonski, Michael Benton (paleontologist studying the end-Permian extinction), and David Raup (Extinction: Bad Genes or Bad Luck?, W.W. Norton, 1991)."
    quote: "[On background extinction as the ordinary-times baseline:] 'THE same way acoustical engineers speak of “background noise” biologists talk about “background extinction.” In ordinary times—times here understood to mean whole geologic epochs—extinction takes place only very rarely, more rarely even than speciation, and it occurs at what’s known as the background extinction rate... For what’s probably the best-studied group, which is mammals, it’s been reckoned to be roughly .25 per million species-years. This means that, since there are about fifty-five hundred mammal species wandering around today, at the background extinction rate you’d expect—once again, very roughly—one species to disappear every seven hundred years.' [On mass extinction as categorically different, with the four paleontologists' definitions:] 'Mass extinctions are different. Instead of a background hum there’s a crash, and disappearance rates spike. Anthony Hallam and Paul Wignall, British paleontologists who have written extensively on the subject, define mass extinctions as events that eliminate a “significant proportion of the world’s biota in a geologically insignificant amount of time.” Another expert, David Jablonski, characterizes mass extinctions as “substantial biodiversity losses” that occur rapidly and are “global in extent.” Michael Benton, a paleontologist who has studied the end-Permian extinction, uses the metaphor of the tree of life: “During a mass extinction, vast swathes of the tree are cut short, as if attacked by crazed, axe-wielding madmen.” A fifth paleontologist, David Raup, has tried looking at matters from the perspective of the victims: “Species are at a low risk of extinction most of the time.” But this “condition of relative safety is punctuated at rare intervals by a vastly higher risk.” The history of life thus consists of “long periods of boredom interrupted occasionally by panic.”' [The pivotal mechanism — the inversion of adaptive value during the panic:] 'In times of panic, whole groups of once-dominant organisms can disappear or be relegated to secondary roles, almost as if the globe has undergone a cast change. Such wholesale losses have led paleontologists to surmise that during mass extinction events—in addition to the so-called Big Five, there have been many lesser such events—the usual rules of survival are suspended. Conditions change so drastically or so suddenly (or so drastically and so suddenly) that evolutionary history counts for little. Indeed, the very traits that have been most useful for dealing with ordinary threats may turn out, under such extraordinary circumstances, to be fatal.' [The numerical stakes, on amphibians specifically:] 'Today, amphibians enjoy the dubious distinction of being the world’s most endangered class of animals; it’s been calculated that the group’s extinction rate could be as much as forty-five thousand times higher than the background rate. But extinction rates among many other groups are approaching amphibian levels. It is estimated that one-third of all reef-building corals, a third of all freshwater mollusks, a third of sharks and rays, a quarter of all mammals, a fifth of all reptiles, and a sixth of all birds are headed toward oblivion.'"
  - source: discovery-loop
    text: distinctness-audit-kolbert-mass-extinction-regime-break
    citation: "Lex-0641 (Brannen, sudden-carbon-cycle-perturbation-common-driver-of-mass-extinctions) is a genuine same-domain neighbor, but its claim is about the trigger mechanism common across the Big Five (carbon-cycle disruption), not about what happens to the selective value of prior adaptations once an extinction event is underway — the two atoms cross-attest on a different axis, trigger versus consequence. Lex-0706 (Taleb, black-swans-are-outlier-extreme-impact-and-retrospectively-explained) is distinct: Taleb's claim is epistemic (unpredictability and the narrative fallacy about foreseeability), while this atom's claim is about regime-dependent adaptive value inversion (previously-useful traits become specifically fatal) — a different mechanism, though the two compose. Lex-0320 (Darwin, variation-plus-differential-survival-plus-inheritance-produces-cumulative-adaptation) already gestures, in its own critical-questions, at adaptation-mismatch under environmental change ('when the environment-of-selection changes, the population lags but eventually re-adapts'); this atom sharpens that into the extreme, sign-inverting, re-adaptation-foreclosed limit case specific to regime-break-magnitude change, rather than restating it. Lex-0717 (customer-focused-resource-allocation-rejects-disruption-until-too-late, Christensen) is a genuine, close, but distinct neighbor: Christensen's mechanism is a gradual, process-level disruption dynamic — good resource-allocation rejecting a slowly-improving inferior entrant — closer to lex-nfdyv's mismatch territory than to this atom's sudden regime-break sign-inversion."
canonical-instances:
  - "The categorical background-vs-mass-extinction distinction stated with its own numerical anchor: background mammal extinction runs at roughly one species per seven hundred years, but 'mass extinctions are different. Instead of a background hum there's a crash, and disappearance rates spike' — four independent paleontologists (Hallam-Wignall, Jablonski, Benton, Raup) converge on defining mass extinction as a qualitatively distinct category, not an intensified point on the same continuum."
  - "Raup's framing of the history of life as bimodal rather than continuous: 'Species are at a low risk of extinction most of the time,' a condition 'punctuated at rare intervals by a vastly higher risk' — 'long periods of boredom interrupted occasionally by panic.' Benton's tree-of-life metaphor for the same bimodality: 'vast swathes of the tree are cut short, as if attacked by crazed, axe-wielding madmen.'"
  - "The key mechanism: 'the usual rules of survival are suspended... the very traits that have been most useful for dealing with ordinary threats may turn out, under such extraordinary circumstances, to be fatal' — the sign of a trait's selective value inverts, it does not merely become irrelevant or lag behind a shifted optimum."
  - "The numerical stakes on amphibians: an extinction rate 'as much as forty-five thousand times higher than the background rate,' with comparable trajectories underway across 'one-third of all reef-building corals, a third of all freshwater mollusks, a third of sharks and rays, a quarter of all mammals, a fifth of all reptiles, and a sixth of all birds' — a four-order-of-magnitude rate gap as direct evidence that 'different' means categorically different, not merely 'faster.'"
  - "A modern cross-domain analogue responsibly extending Kolbert's claim rather than drawn from her text: LTCM-style leveraged, short-volatility trading strategies that were highly profitable and 'well-adapted' within a stable, low-correlation market regime became the specific mechanism of catastrophic loss once the regime broke (1998 Russian default and the resulting correlation breakdown) — the strategy's prior success was not merely uninformative about the new regime but was converted into the exact channel of its failure."
critical-questions:
  - "Is the claim being made that this system's environment has shifted GRADUALLY (ordinary adaptation-mismatch, degree-of-fit declining, re-adaptation still possible given time — reach for lex-nfdyv) or that the regime has BROKEN sharply enough that formerly-useful traits are being actively converted into the specific mechanism of failure, with no time available for re-adaptation (this atom)?"
  - "Is the question being asked 'could this event have been foreseen' (Taleb's axis, lex-rqbsr) or 'what happens to the selective value of the traits that succeeded under the old regime' (this atom's axis)? The two are frequently both true of the same event but are answers to different questions and should not be used interchangeably."
  - "Which SPECIFIC trait is being claimed to invert, and by what specific mechanism does the regime-break convert its formerly-protective function into a harmful one? Kolbert's own framing — 'evolutionary history counts for little' once 'the usual rules of survival are suspended' — names the mechanism at the level of the general paleontological claim; a claim that only gestures at 'things are different now' without naming which specific trait inverted and how is under-specified and should not lean on this atom's authority."
  - "Is the regime-change genuinely large relative to the system's ordinary operating variance (a mass-extinction-magnitude break) or is it routine volatility within a still-stable regime? Reserve the categorical claim for the former; routine downturns, corrections, or setbacks within a stable regime are lex-nfdyv's mismatch territory, not this atom's inversion territory."
  - "Is this atom's categorical, catastrophic framing being used diagnostically (to identify which regime-dependent traits to diversify away from or build redundancy against) or is it being used to justify fatalism or inaction on the theory that 'the usual rules are suspended anyway'? The atom names a risk to design against, not a reason to stop acting."
