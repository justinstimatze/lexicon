lineage:
  - source: primary
    text: rutter-1985-resilience-in-the-face-of-adversity
    citation: "Michael Rutter, 'Resilience in the Face of Adversity: Protective Factors and Resistance to Psychiatric Disorder' (the 1985 Mapother Lecture, delivered to the Royal College of Psychiatrists), British Journal of Psychiatry 147 (1985): 598-611. DOI: 10.1192/bjp.147.6.598. Rutter (1933-2021) was the founding figure of British developmental psychopathology and child psychiatry; this lecture is the paper that establishes 'protective factor' as a technical term distinct from 'positive experience' and argues that a genuine protective effect is properly detected as an interaction with risk/hazard rather than as a main effect of its own. The definitional section ('Protective factors', pp.599-601) gives the three distinguishing respects; the following section ('Interactive processes', pp.601-602) supplies the statistical caution that a genuine interactive process need not register as a textbook multiplicative statistical-interaction term. OCR note: the source PDF is two-column and the extracted plaintext interleaves column order irregularly in places; quotes below were reconstructed by cross-checking sentence continuity and page-marker positions (598, 600, 601, 602 appear as running headers/footers in the source) and cleaned of OCR mojibake (e.g. garbled curly-quote byte sequences around 'steeling' rendered as plain single quotes; garbled em-dash byte sequences rendered as em dashes)."
    quote: "[p.599, section 'Protective factors' — the definition:] 'Protective factors refer to influences that modify, ameliorate, or alter a person's response to some environmental hazard that predisposes to a maladaptive outcome. It should be noted that the concept is not at all synonymous with a positive or beneficial experience; it differs in three crucial respects.' [First distinction — not necessarily pleasurable, the steeling effect:] 'Firstly, the protective factor may not constitute a pleasurable happening in any ordinary sense of the term. Thus, there is abundant experimental evidence from animal studies that acute physical stresses in early life lead to neuroendocrine changes that enhance the animal's resistance to later stress experiences (Hennessy & Levine, 1979; Hunt, 1979); in certain circumstances, unpleasant and potentially hazardous events may toughen an individual — what has come to be termed the \"steeling\" effect of stressors. In humans, somewhat comparable effects have been observed with psychosocial, as well as physical, stressors; e.g. the neuroendocrine response of experienced parachute jumpers is quite different from that of novices.' [The upshot, stated directly:] '...the relevant point here is that protective factors are defined in terms of their effects, rather than with respect to their hedonic qualities.' [Guard against romanticizing adversity — steeling is not guaranteed:] 'in other circumstances, stressful experiences may make individuals more susceptible to later stressors — a sensitising rather than a steeling effect. Investigations of why experiences steel rather than sensitise are in their infancy, but they constitute a potentially fruitful field for study.' [Second distinction — the interaction component:] 'The second crucial distinction between protective factors and positive experiences concerns the interaction component of the notion of protection. Positive experiences are those that generally predispose to an adaptive outcome — a direct beneficial effect. In contrast, protective factors may have no detectable effect in the absence of any subsequent stressor; their role is to modify the response to later adversity rather than to foster normal development in any direct sense.' [The hospital-admission preparation-programme example:] 'A very different example is provided by the human studies showing that various preventive programmes to prepare children and their families for hospital admission significantly reduce rates of emotional disturbance in hospital (see Wolkind & Rutter, 1985). In this case, we do not know for certain that the preventive programme would not have had an impact in the absence of hospital admission, but it seems highly likely that its effects were specific to the hospital experience — a modifying effect on a potentially stressful experience, rather than a beneficial impact that was independent of subsequent happenings.' [Third distinction — a trait, not an experience:] 'The third distinction is that a protective factor may not be an experience at all; rather, it may concern a quality of the individual as a person. For example, it appears that for many psychosocial adversities, girls are less vulnerable than boys (Rutter, 1970; 1982); the protective factor in this case is being female! The reasons why girls tend to be less susceptible than boys remain obscure.' [The 'purest example' of a protective effect, section 'Immediate response to anxiety situations', p.601:] '...a degree of protection is provided by the presence of an attachment object, even if the object is inanimate, and therefore cannot provide active reassurance, guidance, or affection. In many respects, this constitutes the purest example of a protective effect — an effect on the child's response without any direct effect of its own.' [Section 'Interactive processes', pp.601-602 — the caution against equating interactive process with statistical interaction effect:] 'The twin concept of interactive processes does not mean merely a statistical interaction effect, as determined in the traditional multivariate analyses: such an effect constitutes just one rather specific example (see Rutter, 1983). Because it is usually assumed that the two are synonymous, I need to pause for a moment to consider why they are not.' [The institutional-rearing / marital-support illustration:] 'in our follow-up study of institution-reared women, we found that an institutional rearing was associated with a worse outcome (compared with a general population control group), but that marital support in early adult life almost obliterated the adverse effect of an institutional upbringing. That appears at first sight as if there are two separate main effects, but no interaction between them. However, that is misleading because an institutional rearing made it much less likely that the women would make a harmonious marriage that provided emotional support — a powerful interactive process, but no statistical interaction effect, as ordinarily tested for.' [The companion caution about main effects in multivariate analysis:] 'it is commonly, but wrongly assumed that a significant main effect in a multivariate analysis means that that variable has an effect on its own. It does not. What it means is that there is a significant effect for that variable, after other variables have been taken into account; that is not tantamount to an effect in the absence of all other variables.' [Supporting canonical instance — adversities with no effect in isolation but a sharp effect in combination, same discussion:] 'in our own study of chronic family adversities (such as discord, parental mental disorder, overcrowding, etc) we found that no one of these had any effect on psychiatric risk when it occurred in isolation, but the psychiatric risk went up sharply when several adversities co-existed (Rutter, 1979a).'"
  - source: discovery-loop
    text: distinctness-audit-rutter-1985-protective-factors
    citation: "Lex-0359 and lex-6c5un belong to the Holling/Carpenter ecological-systems-resilience literature; lex-dxx5k and lex-8ennw belong to the Taleb-style antifragility and hormesis cluster. Rutter's claim is distinct from both: a candidate protective factor's benefit must be conditional on the hazard's presence — a main-effect-vs-interaction test for what counts as protective — with the further caution that a real interactive process can hide from a formal multiplicative-interaction significance test, a definitional and statistical discipline neither cluster supplies."
canonical-instances:
  - "The steeling effect: 'there is abundant experimental evidence from animal studies that acute physical stresses in early life lead to neuroendocrine changes that enhance the animal's resistance to later stress experiences... in certain circumstances, unpleasant and potentially hazardous events may toughen an individual — what has come to be termed the \"steeling\" effect of stressors... the neuroendocrine response of experienced parachute jumpers is quite different from that of novices' — a protective factor that is itself an unpleasant, stressful experience, defined entirely by its downstream effect on resistance to later stress, not by any pleasant quality of its own."
  - "The hospital-admission preparation programme: preventive programmes that prepare children and families for hospital admission 'significantly reduce rates of emotional disturbance in hospital,' with effects 'specific to the hospital experience — a modifying effect on a potentially stressful experience, rather than a beneficial impact that was independent of subsequent happenings.' The programme is not a generically nice experience; its entire value is conditional on the hospitalization hazard actually occurring."
  - "Being female as a protective factor: 'it appears that for many psychosocial adversities, girls are less vulnerable than boys... the protective factor in this case is being female!... The reasons why girls tend to be less susceptible than boys remain obscure' — a protective factor that is a stable trait of the person, not an experience at all, and whose mechanism Rutter explicitly flags as unknown."
  - "The comfort-blanket 'purest example': the presence of an attachment object, 'even if the object is inanimate, and therefore cannot provide active reassurance, guidance, or affection,' still reduces a child's distress in an anxiety-provoking situation — 'this constitutes the purest example of a protective effect — an effect on the child's response without any direct effect of its own.' The blanket does nothing on its own; it only modifies the response to the anxiety-provoking situation."
  - "The institution-reared women / marital support case: institutional rearing predicted worse adult outcomes, and marital support 'almost obliterated the adverse effect of an institutional upbringing' — yet 'that appears at first sight as if there are two separate main effects, but no interaction between them,' because institutional rearing itself 'made it much less likely that the women would make a harmonious marriage' — 'a powerful interactive process, but no statistical interaction effect, as ordinarily tested for.' The canonical case of a real protective mechanism invisible to a naive multiplicative-interaction test because it operates by shifting the mediator's prevalence."
  - "A modern cross-domain analogue responsibly extending Rutter's argument rather than drawn from his text: an RCT of a workplace mental-health intervention returns a null average treatment effect across the full employee population, and the intervention is shelved as ineffective — while a pre-specified subgroup analysis (not run) would have shown the intervention was strongly protective specifically among employees already under high workload-and-conflict stress, and inert among low-stress employees. Averaging across risk levels is exactly the main-effect confound Rutter's second distinction warns against."
critical-questions:
  - "Does the candidate factor show a benefit specifically among the high-adversity/high-risk subgroup, or does it show a similar-sized benefit across low-risk and high-risk subgroups alike — i.e. is this a genuine protective interaction, or an ordinary main-effect positive experience?"
  - "Is the factor being credited with a beneficial, pleasant, or 'positive' quality as the basis for calling it protective, or has Rutter's move been applied — checking whether it is defined by its EFFECT on the risk-outcome relationship regardless of its hedonic character, as with the steeling effect and being female?"
  - "If a formal multiplicative statistical-interaction test came back null, has the possibility been checked that the candidate factor operates by altering the PREVALENCE or LEVEL of a mediating variable (Rutter's institutional-rearing/marital-support case), rather than by multiplying against a fixed level of it?"
  - "Is 'toughening' being assumed as the default outcome of early stress, when Rutter is explicit that the same exposure can just as easily sensitise (increase later vulnerability) rather than steel (decrease it), and that the field did not yet know, as of 1985, what determines which occurs?"
  - "Would this factor register as 'protective' in a whole-population regression at all, or does its entire signature disappear once the analysis is restricted to the risk-free/benign-environment subgroup — i.e. is the claim being tested at the population slice where the effect would actually show up?"
status: active
