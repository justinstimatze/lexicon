id: lex-tquf9
name: temporary-possession-is-worth-taking-for-the-lasting-effect-it-buys
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you're deciding whether to take something you know you can't hold onto, don't evaluate it by asking whether you'll still have it later -- ask what you can do with it while you have it that persists after you've lost it. Kautilya names a whole category of gain -- land or territory 'easily recaptured by the enemy' -- that ordinary judgment would reject: 'A conqueror who captures something easily recaptured by the enemy or stays on land easily retaken only courts destruction.' But he then lists conditions under which seizing it anyway is correct, and every condition shares the same structure: the point of taking it was never to keep it, it was to use the interval of possession to produce an effect that outlasts the interval itself. Some effects are extractive -- consume or degrade something the enemy will get back either way: 'exploit all the wealth of the enemy's mines, productive forests, elephant forests, waterworks or trade-routes.' Some are reputational booby-traps for whoever retakes it: 'please the people by suitable means so that when the enemy recaptures the territory his rule would enrage them' -- you make the population loyal to you, and the recapture itself becomes the thing that damages the enemy, since 'liberation' now reads to the people as loss. Some convert the asset into leverage against a third party entirely: 'sell the gain to the enemy's enemy.' And some run in the opposite direction, investing rather than extracting, to manufacture a permanent asset that isn't the land itself: 'improve the land and then return it so that he may gain a long-lasting ally bound to him [by gratitude].' In every case the temporary asset is not the actual payoff -- it's the raw material for producing something that doesn't get returned when the asset does: a weakened rival, a poisoned reputation for the recapturer, a sale price, or a grateful ally. Diagnostic move: before passing on an opportunity because you can't hold onto it long-term, ask specifically what you could extract, install, or convert during the window you'd have it -- a resource, a piece of leverage, a shift in someone's loyalty, or a debt of gratitude -- that would remain yours even after the thing itself reverts; if there's a real answer, the fact that possession is temporary stops being a reason to decline it."
