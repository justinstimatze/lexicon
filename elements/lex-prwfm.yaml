evokes: [perverse-incentive, intervention-creates-counter-incentive, secondary-effect-swamps-primary-gain, second-order-defeats-first-order, solution-becomes-the-new-problem, goodharts-cousin]
lineage:
  - source: practitioner
    text: siebert-2001-der-kobra-effekt
    citation: "Horst Siebert, Der Kobra-Effekt: Wie man Irrwege der Wirtschaftspolitik vermeidet (Deutsche Verlags-Anstalt 2001) — coined the German economics term Kobra-Effekt. The anchoring anecdote: British colonial Delhi (~late 19th c) introduced a bounty on dead cobras to reduce the snake population; locals began breeding cobras for the bounty income; when the bounty was abolished, the now-worthless cobras were released, increasing the wild snake population beyond the pre-intervention baseline. The principle generalizes: any intervention that creates incentives counter to its own intent risks producing a counter-effect that swamps or reverses the first-order gain.; book added to as Tier-1 graduation source. No verbatim quote of the Kobra-Effekt coinage is claimed here — the Delhi-cobra anecdote is widely attested across secondary literature 2001-present."
  - source: practitioner
    text: vann-2003-hanoi-rat-massacre
    citation: "Michael G. Vann, 'Of Rats, Rice, and Race: The Great Hanoi Rat Massacre, an Episode in French Colonial History,' French Colonial History 4:191-203 (Michigan State University Press, 2003; doi 10.1353/fch.2003.0027). Archivally-documented parallel to the Delhi-cobra story: French colonial Hanoi 1902 introduced a bounty per rat-tail to combat plague-vector rats; locals delivered tails from rats whose bodies were released to re-breed, and some farmed rats for the tail-income. The Vann paper is the scholarly cross-attestation that gives the principle a verifiable historical foundation independent of the (possibly apocryphal) Delhi-cobra story. Vann's archival sources are the colonial-administration records at the Centre des Archives d'Outre-Mer, Aix-en-Provence — the peer-reviewed scholarly chain-of-custody that the Delhi anecdote lacks. Principle-8(b)-graduation via peer-reviewed archival cross-attestation: the principle has independent multi-domain anchoring (Siebert 2001 economics-theory framing + Vann 2003 archival-colonial-history instantiation)."
    quote: "[Vann 2003, 'Of Rats, Rice, and Race,' French Colonial History 4:191-203, pp.198-199:] 'Appealing to both civic duty and to the pocketbook, a one-cent bounty was paid for each rat tail brought to the authorities (it was decided that the handing in of an entire rat corpse would create too much of a burden for the already taxed municipal health authorities). Unfortunately, this scheme backfired. Despite initial apparent success, the authorities soon discovered that the best laid plans of mice and men often go awry. As soon the municipal administrators publicized the reward program, Vietnamese residents began to bring in thousands of tails. While many desk-bound administrators delighted in the numbers of apparently eliminated rats, more alert officials in the field began to notice a disturbing development. There were frequent sightings of rats without tails going about their business in the city streets. After some perplexity, the authorities realized that less-than-honest but quite resourceful characters were catching rats, but merely cutting off the tails and letting the still-living pests go free (perhaps to breed and produce more valuable tails). Later, things became even more serious as health inspectors discovered a disturbing development in the suburbs of Hanoi. These officials found that more enterprising but equally deceptive individuals were actually raising rats to collect the bounty. One can only imagine the frustration of the municipal authorities, who realized that their best efforts at dératisation had actually increased the rodent population by indirectly encouraging rat-farming. ... Faced with such fraudulent schemes, the colonial regime scrapped the rat bounty program.' [The full mechanism is named in the primary archival reconstruction: bounty-per-tail → proof-loophole (tail-only required) → rats released alive to re-breed → some locals farm rats for the bounty income → rodent population INCREASES from the intervention. This is the canonical cobra-effect mechanism with peer-reviewed archival foundation; the colonial administration scrapped the program when the counter-effect became visible.]"
  - source: practitioner
    text: goodhart-1975-strathern-1997-related-but-distinct
    citation: "Goodhart's law (Charles Goodhart 1975, Problems of Monetary Management: The U.K. Experience, Reserve Bank of Australia papers; Strathern 1997 canonical formulation — when a measure becomes a target, it ceases to be a good measure — in European Review 5(3):305-321) is the related-but-distinct metric-shaped cobra-effect. Goodhart names the specific shape where the measurement-process becomes a target and optimization-for-the-measure displaces optimization-for-the-underlying-property. The cobra-effect is broader: any intervention whose incentive structure CAN be gamed will tend to BE gamed. Goodhart is one cobra-shape (metric-gaming); cobra-effect is the general form (any incentive-restructuring counter-effect). Both 1975 paper and Strathern 1997; principle-8(b)-cross-attestable via widespread secondary-literature canonization. No verbatim quote is claimed here — the when-a-measure-becomes-a-target formulation is widely attested across economics, regulation, and machine-learning literatures."
  - source: discovery-loop
    text: lexicon-v31-chat-2026-05-21
    citation: "user articulated the principle while reasoning about the five-what-ifs feature design and the RTO worked example. 'secondary problems sometimes swamp the gain from solving the first problem.' The RTO instance: voluntary self-coordinated RTO solves the first-order coordination problem, but creates a second-order tier-of-access where any exec who comes in for unrelated personal reasons (small child at home, no home-office) becomes a socializing/sucking-up locus for those who CAN come in, disadvantaging those who actually live too far to come in. The first-order coordination gain is swamped by the second-order class-creation. User-confirmed 2026-05-21 that the cobra-effect is the closest canonical for this principle. Mintage authorized in."
    quote: "secondary problems sometimes swamp the gain from solving the first problem [user 2026-05-21]; voluntary RTO → exec-attendance-for-own-reasons → tiered-exec-access → first-order-coordination-gain consumed by second-order-class-creation [RTO worked example, same conversation]"
canonical-instances:
  - "Delhi cobra-bounty (~late 19th c, possibly apocryphal but folk-canonical via Siebert 2001): bounty per dead cobra → locals breed cobras for bounty income → bounty abolished → now-worthless cobras released → wild snake population exceeds pre-intervention baseline. The intervention's incentive structure was the proximate cause of the counter-effect."
  - "Hanoi rat-bounty (1902, Vann 2003 archivally-documented): bounty per rat-tail → rat-tail-without-body deliveries (rats re-released to breed) → some locals farm rats for the tail-income → rat population increases. The intervention's evidence-requirement (tail = dead-rat proof) was exactly what made it gameable."
  - "RTO voluntary-coordinated-attendance (user 2026-05-21): voluntary self-coordinated RTO solves the first-order coordination problem (people in the office together when meetings/socializing benefit from it). But if any exec attends for their own valid personal reasons (small child at home, no home-office), people feel compelled to come in to be SEEN by that exec or to socialize/suck-up; creates a tiered class of workers — those who CAN come in for any reason get access to that exec, those who actually live too far or have other constraints do not. First-order coordination gain consumed by second-order class-creation."
  - "Goodhart's law (Strathern 1997): when a measure becomes a target, it ceases to be a good measure. Related-but-distinct cobra-shape — measure-becomes-target → optimization-for-the-measure displaces optimization-for-the-underlying-property. The cobra-effect is broader; Goodhart is the metric-shaped instance."
  - "software-engineering instances: (a) caching to reduce latency introduces stale-data correctness bugs; (b) mutex to fix race introduces deadlock potential; (c) retry-with-backoff to handle transient failure amplifies traffic during outages (thundering-herd); (d) input validation creates rejection-DoS attack surface. Each first-order intervention solves problem X but creates problem Y that can swamp the gain if Y wasn't anticipated."
  - "behavioral and biological instances: (a) rewarding effort-visibility (face-time, hours logged) → workers slow down work to look more effortful; (b) DDT spraying → mosquito-resistance evolution; (c) antibiotic over-prescription → bacterial-resistance evolution. The biological forms are the strongest because the counter-incentive is built into selection pressure itself."
  - "operationally adjacent to lex-u5869 chestertons-fence: Chesterton warns 'don't rip out the fence until you understand why it's there.' The cobra-effect is the failure-mode that materializes when you rip-out without understanding. lex-u5869 is the PRECAUTION; lex-prwfm is the FAILURE-MODE the precaution exists to prevent."
  - "operationally adjacent to lex-rfxtb multifactorial-frame: dualist single-cause reasoning ('to solve Y, do X') is the substrate of cobra-effect risk because it doesn't model the incentive-shifts X creates in the system. The multifactorial discipline asks 'what does intervention X CHANGE in the system, beyond the targeted variable?' — exactly the cobra-effect prophylactic."
  - "operationally adjacent to lex-jy4aq problem-typology-wicked-vs-tame: wicked problems specifically EXHIBIT cobra-effects more than tame problems do, because their structure makes counter-effects difficult to anticipate. The cobra-effect is the failure-shape that distinguishes wicked-problem failure from tame-problem failure."
  - "operationally adjacent to lex-th6tr keep-options-open-under-radical-uncertainty: robustness analysis (Rosenhead) is the antidote-discipline. Keeping options open under uncertainty IS the move that allows you to back out of an intervention if cobra-shaped counter-effects emerge. Commit-irrevocably to a single intervention is what locks-in the cobra-effect when it appears."
  - "operationally adjacent to lex-znaau premature-closure: premature-closure on a first-order solution is the cognitive substrate of cobra-effect risk. lex-znaau names the failure-mode at the cognitive tier; lex-prwfm is its consequence at the system tier."
critical-questions:
  - "is the counter-effect a genuine cobra-effect (intervention CAUSED it via incentive-restructuring) or an accidental correlation? Discriminator: does the counter-effect's mechanism trace BACK through the intervention's incentive structure? Delhi-cobra: bounty-for-dead-snakes → breed-snakes-for-bounty is mechanically traceable. RTO: exec-attendance → tier-of-access is mechanically traceable. Without the mechanism trace, the label 'cobra-effect' is post-hoc rationalization rather than diagnostic claim."
  - "how do you avoid cobra-effect FATALISM (refusing to intervene because some intervention might cobra)? The discipline is not anti-intervention; it's intervention-with-counter-incentive-anticipation. Before deploying intervention X for problem Y, run the cobra-check ('what would game this? what counter-incentive does X create? who benefits from X being gameable?'). If the cobra-shape is severe and unavoidable, redesign X. If mild or addressable, deploy with monitoring. Fatalism misuses this atom as an exit from action."
  - "who benefits from gaming the intervention, and are they organized enough to coordinate? Lone-individual gaming (one person collects extra bounty) is rate-limited; coordinated gaming (rat-farms; bounty-syndicates; gaming-rings) is exponential. Map the would-be-gamers' organizational capacity before assuming the gameability is rate-bounded."
  - "is the cobra-effect detectable in early metrics, or only after irreversible damage? Some interventions surface cobra-shapes quickly (a measure-target divergence shows up in dashboards within weeks); others compound silently for years before the gap becomes visible (resistance-evolution in antibiotics; tier-stratification in workplaces). Pick monitoring metrics that would catch the counter-effect early, not just the first-order effect."
  - "is the proposed mitigation itself cobra-shaped? A common failure: 'we'll prevent gaming by adding more verification' → verification-bureaucracy-burden disproportionately hits good-faith users while sophisticated gamers route around it. The mitigation can itself be cobra-shaped on a sub-mechanism. Cobra-check the cobra-fix."
