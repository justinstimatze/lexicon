evokes: [hyde-trickster-makes-this-world-meat-sacrifice, ritual-apportionment, the-trick-of-reapportionment, memorializes-the-trick-and-its-consequences]
lineage:
  - source: primary
    text: hyde-greek-sacrifice-as-memorial-of-a-trickster-reapportionment
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Meat Sacrifice.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In such a system, when people imagine the first sacrifice they will also be imagining an original apportioning. And if the beginnings amount to a change in apportionment, ... as seems to be the case with both Hermes and Prometheus, then sacrifice will probably be invented by way of some trick or deceit, for such a change usually has the less powerful taking a share away from the more powerful ... Whatever trickster pulls this trick does not initially invent sacrifice, therefore; first he invents the trick of reapportionment, some sleight of hand by which the thigh of an ox ends up on the plate of a slave. ... In both cases, though, there is a change of apportionment and a form of sacrifice emerges that memorializes both the trick and its consequences, the new order of things."
canonical-instances:
  - "A company's tradition of giving the departing employee's parking spot to whoever organized their goodbye party seems like an arbitrary quirk of office culture, until a long-tenured employee explains it actually commemorates a specific incident years earlier when an underpaid organizer successfully negotiated the spot as informal compensation, and the practice has quietly continued as an unspoken acknowledgment of that original deal."
  - "A union's contract clause guaranteeing a specific, oddly precise number of paid break minutes seems arbitrary to new members, until the union's history reveals the number was the exact concession won in a particular contentious negotiation decades earlier, and the clause has been renewed unchanged ever since as an unexamined artifact of that original fight."
critical-questions:
  - "Is Hyde's reconstruction of the first sacrifice as a memorial of a reapportionment trick a claim the actual historical or archaeological record can support, or is it a plausible narrative built entirely from reading backward from later myth and ritual structure?"
  - "Does this diagnostic risk over-interpreting arbitrary or accidental features of long-standing customs as meaningful historical memorials, when some ritual particulars may simply be the accumulated residue of chance and habit rather than a specific contested negotiation?"
  - "If a ritual does preserve the memory of an original reapportionment, does that history remain legible to the people who continue practicing it, or does the memorial function only work retrospectively, for an analyst looking back, while practitioners experience it purely as tradition?"
