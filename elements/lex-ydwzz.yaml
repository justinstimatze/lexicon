id: lex-ydwzz
name: each-horn-of-the-dilemma-favors-you
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When someone fears or is paralyzed by uncertainty about which of two (or more) EXHAUSTIVE possibilities is true, check whether the branches can be independently evaluated and found to BOTH favor the same conclusion — if so, resolving which branch is actually true becomes unnecessary; the conclusion holds regardless. Socrates deploys this exact structure at the end of his own trial (Apology 40c-41c, Jowett), reasoning about the very thing he is about to face: 'there is great reason to hope that death is a good; for one of two things — either death is a state of nothingness and utter unconsciousness, or, as men say, there is a change and migration of the soul from this world to another.' He then argues EACH branch independently, on its own terms. If it is dreamless, unconscious sleep: 'I say that to die is gain; for eternity is then only a single night' — compare the best, most restful night of sleep in an entire life to ordinary waking existence, and the dreamless-sleep branch already wins unaided. If instead it is migration to another place: 'what good, O my friends and judges, can be greater than this?' — the chance to escape unjust human judges for 'the true judges,' and to converse with Homer, Hesiod, Orpheus, and the heroes of the past: 'What would not a man give to be able to examine the leader of the great Trojan expedition... What infinite delight would there be in conversing with them and asking them questions!' Having independently shown BOTH branches are gains, Socrates draws the conclusion without needing to settle which branch is metaphysically correct: 'no evil can happen to a good man, either in life or after death.' The structural requirements for the move to be valid, not merely rhetorically convenient: (1) the branches must be genuinely EXHAUSTIVE — no hidden third option, worse than either named branch, is being suppressed; (2) each branch must be argued INDEPENDENTLY and on its own terms, not by borrowing force or plausibility from the other branch; (3) the favorable verdict on each branch must survive on its own evidence, not merely be assumed favorable because the conclusion needs it to be. Portable beyond death-anxiety: a founder uncertain whether a competitor will enter their market can check whether the planned strategy wins if the competitor enters AND wins if they don't — if so, resolving the uncertainty first is unnecessary, and anxious monitoring can convert into ordinary execution; someone awaiting a medical test result can ask whether there is a real, non-forced case for a good next step on both the benign-result branch and the serious-result branch, rather than suspending all functioning until the news arrives. The technique dissolves ANXIETY OVER NOT KNOWING, specifically, by showing that knowing wouldn't change the right response or the right disposition — it is not a technique for resolving genuine indecision where the correct ACTION actually differs by branch, and using it dishonestly (hiding an unfavorable branch, or inventing a false branch's impossibility to force an exhaustive-looking pair) breaks the argument entirely."
related: [lex-v6kmc, lex-afrq4, lex-a3kky, lex-kbekq]
evokes: [either-dreamless-sleep-or-migration, eternity-is-then-only-a-single-night, no-evil-can-happen-to-a-good-man, true-judges-and-heroes-of-old, whichever-branch-wins]
lineage:
  - source: primary
    text: plato-c399bce-apology-death-dichotomy
    citation: "Plato, Apology, 40c-41c, in The Dialogues of Plato, trans. Benjamin Jowett (3rd ed., 1892; epub edition consulted, extracted from plato_dialogues_benjamin-jowett_advanced.epub). After his death sentence is pronounced, Socrates addresses the jurors who voted to acquit him, explaining why he is not grieved: reasoning that death is either dreamless, unconscious sleep or a migration of the soul to another place, he argues each possibility independently is a good, and concludes that no evil can happen to a good man either in life or after death."
    quote: "Let us reflect in another way, and we shall see that there is great reason to hope that death is a good; for one of two things⁠—either death is a state of nothingness and utter unconsciousness, or, as men say, there is a change and migration of the soul from this world to another. Now if you suppose that there is no consciousness, but a sleep like the sleep of him who is undisturbed even by dreams, death will be an unspeakable gain. [...] Now if death be of such a nature, I say that to die is gain; for eternity is then only a single night. But if death is the journey to another place, and there, as men say, all the dead abide, what good, O my friends and judges, can be greater than this? [...] What would not a man give if he might converse with Orpheus and Musaeus and Hesiod and Homer? [...] Wherefore, O judges, be of good cheer about death, and know of a certainty, that no evil can happen to a good man, either in life or after death."
canonical-instances:
  - "The direct textual anchor: Socrates argues he need not determine whether death is dreamless sleep or migration of the soul, because both possibilities, independently evaluated, are gains — so the uncertainty itself carries no threat."
  - "A founder deciding whether to prepare for a competitor's market entry checks whether the current strategy performs acceptably if the competitor enters AND if they don't — finding both branches acceptable converts anxious uncertainty-monitoring into ordinary execution, without needing advance knowledge of the competitor's plans."
  - "A patient awaiting a biopsy result identifies a good next action on the benign-result branch (resume normal life, keep monitoring) and a good next action on the serious-result branch (a known, prepared-for treatment path) — naming both in advance reduces the specific anxiety of not-yet-knowing, without pretending to know the outcome."
critical-questions:
  - "how does this differ from lex-a3kky (Lucretius's pre-natal/post-mortem symmetry argument, also on the fear of death)? lex-a3kky is a ONE-BRANCH argument: it claims there is really only one relevant fact (no subject exists after death to suffer), reinforced by pointing to an ALREADY-ACCEPTED analogous past state (pre-natal non-existence) and asserting mirror-symmetry between the two. This atom is a TWO-BRANCH argument that concedes genuine uncertainty about which possibility is real and shows both are independently fine — it requires no already-accepted analogous state and works even when the branches are radically different in kind (unconscious nothingness vs. a conscious afterlife), which lex-a3kky's symmetry move cannot accommodate since it depends on the two states being structurally identical."
  - "how does this differ from lex-afrq4 (the Achilles fork: glory-and-long-life-are-a-structural-fork-not-an-optimization)? the Achilles fork names a forced CHOICE between two mutually exclusive goods, where picking one branch means genuinely losing the other — the fork is a warning against false hope of synthesis. This atom's branches are not a choice at all: they are exhaustive possibilities about a single fact the reasoner does not control and cannot select between, and 'winning' means the emotional or dispositional response doesn't need to wait on which branch turns out true."
  - "how does this differ from lex-v6kmc (dichotomy of control)? dichotomy-of-control sorts what's inside versus outside one's agency and counsels indifference toward the latter as a whole category. This atom does not sort by controllability at all — it evaluates one specific uncertain fact by checking whether every possible resolution of it is independently favorable, a narrower, argument-closeable claim rather than a general disposition toward the uncontrollable."
  - "what happens when the branches AREN'T both favorable, or the exhaustiveness is manufactured? Then the move fails and should not be used — this is the honesty check built into the pattern's own validity conditions. A bad-faith user could suppress a genuinely unfavorable branch or invent a false branch's impossibility to force an exhaustive-looking favorable pair. Socrates's own version stays honest by arguing each branch on its stated terms rather than asserting either branch's likelihood — he never claims to know which is real, only that it doesn't matter which is."
