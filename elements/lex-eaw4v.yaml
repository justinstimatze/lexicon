critical-questions:
  - "how does this differ from lex-prwfm (cobra-effect)? lex-prwfm names a mechanism where an incentive scheme produces UNINTENDED optimization — the target being measured is a proxy, and the actor optimizes the proxy in a way that subverts the underlying intent (bounties produce cobra farms). This atom names a different failure: no proxy-substitution or gaming is required, and the actors aren't optimizing around the rule at all. The failure here is structural and internal to the penalty schedule itself — because the maximum available penalty has already been assigned to minor offenses, the schedule simply has no gradient left to express proportional severity, independent of how anyone responds to it."
  - "isn't harsh punishment for minor offenses just about deterrence being maximally strong, not about it being broken? The atom's claim is specifically about MARGINAL deterrence — the code's ability to give someone weighing whether to escalate from a smaller offense to a larger one a reason to stop. A flat-maximum schedule can still deter the first offense strongly; what it cannot do is deter the SECOND, WORSE offense any more than the first, because there's no additional cost to bear for escalating. Maximal severity and functioning marginal deterrence are different properties, and this atom is about the loss of the second."
  - "does fixing this always mean lowering penalties? Not necessarily — the atom's diagnostic claim is about relative GRADIENT, not absolute severity. A code could restore marginal deterrence either by lowering the penalty for minor offenses (Solon's actual repeal) or by raising an already-severe penalty for the worst offenses even further, wherever such escalation remains meaningful — the requirement is only that the worst offense draw a worse consequence than the mildest one, not that the overall severity level fall."
