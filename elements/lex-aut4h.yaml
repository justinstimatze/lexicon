id: lex-aut4h
name: argument-from-commitment-as-dialectical-force-to-consequences-of-prior-stated-position
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When refuting an interlocutor, draw out the commitments their prior position entails and show the contradiction with their current position. The dialectical force is not in your argument; it's in their own commitments."
related: [lex-af9ax, lex-kebfa, lex-q9asc, lex-th68b, lex-hesjt, lex-5bpee, lex-k2kdc, lex-p48xw, lex-xhwqt, lex-utn22, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-tpv83, lex-chtk9, lex-9uac6, lex-xqamc, lex-tbw6f, lex-b9yre]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt, lex-5bpee, lex-b9yre]
evokes: [dialectical-commitment, commitment-store, force-the-consequences, you-said-X-so-you-also-mean-Y, prior-commitment-binds, retraction-as-dialogue-move, the-trap-set-by-your-own-words]
premises:
  - "arguer a has committed to proposition A at some earlier point in the dialogue"
  - "if a is committed to A, it may be inferred that a is also committed to B (because B is entailed by A, or because A and B are both expressions of an underlying coherent position)"
  - "therefore at a later point where B becomes an issue, a may be said to be committed to B — unless a explicitly retracts A or distinguishes A from B"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(retrieve-prior-commitment, derive-entailed-consequence) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "is a really committed to A, and if so, what evidence supports the claim that she is so committed? Walton's CQ1. The dialectical move presumes A is a STANDING commitment in the dialogue's commitment-store — explicitly accepted, inferable from prior assertions, or evidenced through past dialogue moves and actions. If a never accepted A, the move begs the question"
  - "if the evidence for commitment is indirect or weak, could there also be contrary evidence, or at least room for the rebuttal that this case is an exception? Walton's CQ2. Some commitments are domain-specific; a may commit to 'workers deserve a voice' generally without thereby committing to 'this specific union's demands are reasonable'. Forced overreach of commitment is the fallacy mode"
  - "is the proposition A, as cited in the premise, identical to the proposition A as cited in the conclusion? Walton's CQ3 — the equivocation gate. Adversarial users of this scheme often shift A's sense between premise and conclusion to manufacture entailment that doesn't hold under fixed meaning. Diagnostic: can you state both versions of A in a single uniform vocabulary, and does the entailment still go through?"
  - "is the move retraction-friendly, or is it weaponized to trap? Walton's dialectical framing is regulative — the move is legitimate if a can openly retract or distinguish without dialogue-cost. When social or political cost of retraction is high, argument-from-commitment becomes a form of coercion regardless of logical validity. lex-k2kdc (constitutive-defense-when-the-defense-generates-the-threat) is a related dynamic"
  - "distinct from lex-5bpee (Cialdini commitment-and-consistency-pressure)? Yes — lex-5bpee is the psychological mechanism (humans feel compelled to act consistently with prior public commitments, exploited by sales technique). lex-aut4h is the dialectical move (an opponent points out your prior assertion entails the present one). Both might fire together in a real dialogue, but the structures are distinct: psychological-pressure vs argumentative-force"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.4 §3 'Argument from Commitment' (pp.134-135 scheme statement + 3 CQs + Ed-the-communist-and-labor-dispute canonical instance, citing Walton 1996, p.56). Walton notes the scheme is the basis for several others: argument-from-sunk-cost (Ch.4 §4, p.135-136), circumstantial ad hominem (Ch.4 §6), argument-from-inconsistent-commitment (Ch.4 §6). Compendium restatement at Ch.9 #40 p.330. Local copy."
    quote: "The scheme for argument from commitment is the following (Walton, 1996, p. 56): Major Premise: If arguer a has committed herself to proposition A at some point in a dialogue, then it may be inferred that she is also committed to proposition B, should the question of whether B is true become an issue later in the dialogue. Minor Premise: Arguer a has committed herself to proposition A at some point in a dialogue. Conclusion: At some later point in the dialogue, where the issue of B arises, arguer a may be said to be committed to proposition B. [...] CQ1: Is a really committed to A, and if so, what evidence supports the claim that she is so committed? CQ2: If the evidence for commitment is indirect or weak, could there also be contrary evidence, or at least room for the rebuttal that this case is an exception? CQ3: Is the proposition A, as cited in the premise, identical to the proposition A as cited in the conclusion? If not, what exactly is the nature of the relationship between the two propositions? [...] The general scheme of argument from commitment is the basis for several other schemes, like argument from sunk cost and circumstantial ad hominem arguments."
  - source: primary
    tradition: plato
    text: plato-euthyphro-jowett-translation
    citation: "Plato, *Euthyphro* (Benjamin Jowett translation, 1892). The dialogue's central elenchus (Stephanus 10a-11b) is the canonical originating instance of argument-from-commitment as dialectical technique: Socrates extracts Euthyphro's commitment to 'the holy is loved by the gods,' then forces him through the entailment chain (a) is X loved because it's holy, or holy because it's loved? (b) act-precedes-state distinction shows 'dear to the gods' is the EFFECT not the ESSENCE of holiness; (c) therefore Euthyphro's definition is only an attribute not the essence — contradiction with his prior commitment. PD (translation 1892, Jowett d. 1893). Methodologically-distinct from Walton: Walton gives a formal-pragmatic SCHEME-CATALOG with CQ-checklists derived from contemporary argumentation theory; Plato gives the DIALOGICAL DEMONSTRATION of the technique-in-practice in the dialectical originating tradition. Local copy in the lexicon corpus."
    quote: "[Socrates, Euthyphro 10a]: The point which I should first wish to understand is whether the pious or holy is beloved by the gods because it is holy, or holy because it is beloved of the gods. [...] [Euthyphro, after Socrates' analysis]: It is loved because it is holy, not holy because it is loved [...] [Socrates' summation, Euthyphro 11a-b]: I mean to say that the holy has been acknowledged by us to be loved of God because it is holy, not to be holy because it is loved. But that which is dear to the gods is dear to them because it is loved by them, not loved by them because it is dear to them. But, friend Euthyphro, if that which is holy is the same with that which is dear to God, and is loved because it is holy, then that which is dear to God would have been loved as being dear to God; but if that which is dear to God is dear to him because loved by him, then that which is holy would have been holy because loved by him. But now you see that the reverse is the case, and that they are quite different from one another. [...] Thus you appear to me, Euthyphro, when I ask you what is the essence of holiness, to offer an attribute only, and not the essence — the attribute of being loved by all the gods."
canonical-instances:
  - "Socratic elenchus (Plato dialogues): Socrates forces interlocutor to accept consequences of their prior definitional commitments until contradiction emerges (Euthyphro 9a-11b — what's holy=loved-by-gods leads to circular definition)"
  - "legal cross-examination: prior deposition statement A is brought forward to force witness to accept entailed B at trial, OR explain the distinction, OR retract A"
  - "philosophical writing's 'you say X but you're also committed to Y' move: a critic argues their target's stated position entails an unstated commitment the target would reject — forcing either acceptance, distinction, or retraction"
  - "code review move: 'you said this is performance-critical; you also committed to no-allocations-in-the-hot-path; this PR allocates in the hot path; one of those has to give'"
  - "political accountability: a politician's prior public statement is recovered to force them to accept current policy implication or explicitly reverse"
  - "circumstantial ad hominem (Walton-noted subtype): 'you advocate X but practice not-X; therefore you don't really believe X' — forcing argument-from-commitment between stated position and revealed-preference behavior"
severity-tier: info
status: active
