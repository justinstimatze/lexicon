canonical-instances:
  - "A regulatory whistleblower who publicly discloses wrongdoing, names the rule they believe is being violated in spirit, and accepts career and legal risk in the open is doing something structurally distinct from an employee who secretly embezzles funds — even when both get called 'a problem for the organization' and even when the whistleblower is prosecuted, Merton's four checks (announces vs. hides, challenges vs. accepts the norm's legitimacy, wants to change the rule vs. escape it, disinterested vs. self-serving) sort them into different categories."
  - "Merton's own example of the John Brown / Al Capone contrast makes the distinction vivid without collapsing into simple moral endorsement of the nonconformist: 'unlike John Brown's, Al Capone's soul will not go marching on' — the point is not that all nonconformists are admirable, but that even when a nonconformist is tried and punished under ordinary criminal law, sociologically they remain a different type of deviant, oriented to a different, disinterested, alternative-morality logic that the ordinary criminal does not share."
critical-questions:
  - "Merton flags that the psychological motives underneath nonconformity and crime can resemble each other (both may involve compulsive, guilt-driven, or self-punishing dynamics) even while the sociological structure differs sharply — if the psychology can be the same, how confident should an observer be that the four structural checks are really independent of psychology, rather than just a more polite redescription of the same underlying drive?"
  - "The four-part test relies on being able to assess sincerity (is the appeal to higher morality genuine, is the purpose really disinterested) — but sincerity is exactly what's hardest to verify from outside, and self-interested actors have every incentive to perform announced dissent and moral appeal falsely. What observable behavior, short of assuming sincerity, would let someone tell a genuine nonconformist from a sophisticated self-interested actor mimicking one?"
