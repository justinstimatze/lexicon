id: lex-fgrmh
name: coalition-unites-via-shared-defiance-of-a-rule-not-a-positive-identity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Recognize this pattern whenever a diverse, internally fractious population is being pressed to organize around a single POSITIVE, shared identity category — and the pressure is producing exactly the fragmentation it was meant to resolve, because the population's members do not actually share that positive category, only a common relationship to an external rule they have each, in their own different way, broken. Bornstein's move, writing about the transgender/gender-variant population she calls 'gender outlaws,' is to name the alternative organizing principle directly: 'All the categories of transgender find a common ground in that they each break one or more of the rules of gender: what we have in common is that we are gender outlaws, every one of us.' She is explicit that attempting the positive-category route fails on its own terms — 'To attempt to divide us into rigid categories (\"You're a transvestite, and you're a drag queen, and you're a she-male, and on and on and on\") is like trying to apply the laws of solids to the state of fluids' — because the population's members hold genuinely different, sometimes even competing, positive self-descriptions (transvestite, drag queen, transsexual, and so on), and a coalition built on forcing agreement on ONE of these will exclude or subordinate everyone who holds a different one. Her positive proposal is that the connective tissue is not any shared identity-content but the shared FORM of the relationship each member holds to the external rule-system: each one, in a different way, breaks it. 'It's our fluidity that keeps us in touch with each other. It's our fluidity and the principles that attend that constant state of flux that could create an innovative and inclusive transgender community.' The atom's transferable claim: when a diverse population's members share no single positive trait but do share a common posture of defiance, transgression, or non-compliance toward the same external rule or norm, the coalition should be built and defined on that SHARED RELATIONSHIP TO THE RULE (a negative/relational definition) rather than forced into a single positive identity-category that will always exclude some members whose actual self-understanding differs. Bornstein pairs this with a second, related move: relabeling who counts as the actual aggressor. Rather than accepting a frame in which the rule-breakers are the 'terrorists' disrupting a natural order, she redefines 'gender terrorists' as those who violently defend the binary against anyone who unsettles it — 'Gender terrorists are not the drag queens, the butch dykes... Gender terrorists are those who... bang their heads against a gender system which is real and natural; and who then use gender to terrorize the rest of us. These are the real terrorists: the Gender Defenders.' This is a companion rhetorical move (INVERTING WHO IS NAMED THE THREAT) rather than the coalition-definition claim itself, and should be tracked as a distinct but adjacent tactic available to the same coalition once it has organized on the shared-defiance basis. DISTINCT from lex-y2tbg (Butler, essence-as-effect-of-ritualized-repetition-not-its-cause): Butler's claim is about the ONTOLOGICAL STATUS of gender itself — that an apparently stable gender identity is the retrospective EFFECT of repeated, ritualized performative acts, not their pre-existing cause; it is a claim about how any individual's gendered self comes to appear stable at all. Bornstein's claim here is not about the ontology of gender identity but about POLITICAL/SOCIAL ORGANIZATION — how a population whose members hold different, non-unifiable positive self-understandings should organize collectively despite that non-unifiability. Butler explains why gender identity looks fixed when it isn't; Bornstein's atom explains how to build solidarity among people for whom even the performative categories on offer (transvestite, drag queen, etc.) don't converge on one shared identity. DISTINCT from lex-quck2 (Halberstam, refusing-the-heteronormative-capitalist-success-script-is-itself-generative): Halberstam's claim is that EXITING a specific ideological scoring system (success-as-reproductive-maturity-plus-wealth) is itself a generative, positive political stance. Bornstein's claim here is not about what is generative in exit or failure, but about the STRUCTURE OF COALITION-FORMATION among people who have each, independently, already exited or broken a rule in their own different way — a claim about organizing principle, not about the value of the exit itself. The two compose: Halberstam explains why refusing the norm can be generative; Bornstein's atom explains how a group of people who have each refused a norm, but not in the same way, can nonetheless organize together. Cross-domain applications: (a) SOCIAL-MOVEMENT COALITION-BUILDING more broadly — any movement encompassing genuinely divergent constituencies (e.g., a disability-rights coalition spanning very different conditions and needs, a labor coalition spanning workers with conflicting immediate interests) faces the same choice between forcing convergence on a single positive platform-identity (which will alienate members whose actual situation doesn't fit it) and organizing around the shared relational fact of exclusion or rule-violation each member independently experiences; (b) SUBCULTURE AND FANDOM ORGANIZING — subcultures defined by shared deviation from a mainstream norm (rather than a shared taste or practice) recurringly face internal fracturing when leadership tries to impose a single canonical definition of 'real' membership; (c) LEGAL AND ADVOCACY COALITIONS — 'umbrella' civil-rights categories (e.g., broad disability or LGBTQ+ legal-advocacy coalitions) often function successfully precisely by defining membership relationally (anyone excluded or penalized by the targeted rule or law) rather than by a single, positively-specified trait. Failure modes: (a) TREATING THE SHARED-DEFIANCE PRINCIPLE AS REQUIRING NO INTERNAL STRUCTURE OR ACCOUNTABILITY — Bornstein's own text notes the resulting coalition is still uneven in practice ('groups still divide along the lines of male-to-female and female-to-male gender outlaws'), so a negatively-defined coalition is not automatically free of its own internal hierarchies or exclusions; the relational-definition move solves ONE fragmentation problem (forcing convergence on a single positive identity) without automatically solving others; (b) COLLAPSING THIS INTO GENERIC 'UNITY IN DIVERSITY' RHETORIC — the atom's specific claim is narrower and more structural: the connective tissue is a shared RELATIONSHIP TO A COMMON EXTERNAL RULE, not merely an appeal to celebrate difference in the abstract; (c) CONFUSING THE COALITION-DEFINITION MOVE WITH THE WHO-IS-THE-TERRORIST REVERSAL — the two are companion moves in Bornstein's text but are logically separable; a coalition can organize on shared-defiance grounds without adopting the rhetorical reversal, and the reversal move could in principle be deployed by a coalition organized on other grounds."
