    text: sanderson-2013-thirdlawofmagic-brandonsandersoncom
    citation: "Brandon Sanderson, 'Sanderson's Third Law of Magic,' brandonsanderson.com/blogs/blog/sandersons-third-law-of-magic (originally published September 2013, celebrating the release of Steelheart)."
    quote: "'Anyway, without further rambling, the third law is as follows: Expand what you already have before you add something new.'"
  - source: primary
    text: sanderson-2013-thirdlawofmagic-brandonsandersoncom
    citation: "Brandon Sanderson, 'Sanderson's Third Law of Magic,' brandonsanderson.com/blogs/blog/sandersons-third-law-of-magic, the three-move breakdown."
    quote: "'I'll talk about expanding a magic in three directions I've found useful. Extrapolate... Interconnect... Streamline...' [Sanderson's own labels for the three sub-moves, each elaborated with worked examples in the essay: Extrapolate is tracing 'what happens when' consequences of an existing power rather than adding an unrelated one; Interconnect is tying powers, cultures, and themes to each other rather than leaving each as a standalone ability; Streamline is asking, before adding a new culture or character or power, 'where can I combine these?']"
  - source: primary
    text: sanderson-2013-thirdlawofmagic-brandonsandersoncom
    citation: "Brandon Sanderson, 'Sanderson's Third Law of Magic,' the essay's own worked contrast between one deep element and many shallow ones."
    quote: "'A simple magic -- such as some people being able to change their skin color at will -- could spawn religions, influence social mores, provoke wars, play havoc with caste systems, create new kinds of jobs.'"
  - source: primary
    text: sanderson-2013-thirdlawofmagic-brandonsandersoncom
    citation: "Brandon Sanderson, 'Sanderson's Third Law of Magic,' the essay's own caution against over-applying the law."
    quote: "'A larger problem of streamlining can be developing each culture of your world to be identical, except for one little defining trait... That's streamlining way too far.'"
canonical-instances:
  - "A product team's roadmap keeps filling with net-new features nobody specifically asked for, while the one feature customers actually rely on stays unpolished and disconnected from the rest of the product -- shipping the tenth feature reads as progress, but interconnecting and extrapolating the one feature with real traction would do more work per unit of engineering effort."
  - "A fantasy writer wants every one of ten kingdoms to feel distinct, so each gets its own bespoke magic system 'for variety' -- ten shallow, unconnected systems that each read as a party trick. The alternative Sanderson names directly: one magic (people who can change skin color at will) let loose to ripple into religion, caste, war, and labor across all ten kingdoms reads as one deep, coherent world rather than a checklist of separate curiosities."
  - "An organization facing a new adjacent problem defaults to spinning up a new team to own it, rather than extending the mandate of a team that already has deep context in the neighboring problem -- the new team starts from zero interconnection with everything else the org has built; deepening the existing team's mandate multiplies against depth already there."
critical-questions:
  - "When does the inverse hold -- when is adding something genuinely new the higher-leverage move rather than deepening what exists? Sanderson's own answer is implicit in his contrast between the Wheel of Time / Discworld (both enormous, both still praised) and 'worldbuilder's disease': an exploration phase, where you don't yet know which existing element is worth deepening, may need real breadth first to generate the options depth would later be spent on."
  - "Sanderson names his own failure mode for taking this too far -- 'streamlining way too far' collapses genuinely different things into one thing with a single cosmetic variation, which erases real distinctions rather than finding real economy of means. What's the diagnostic for telling elegant reuse of an existing element apart from homogenization that's quietly flattening something that should have stayed separate?"
