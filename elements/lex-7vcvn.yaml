evokes: [help-flows-to-capacity-not-need, five-qualities-of-the-ally-worth-helping, kautilya-helping-an-ally, small-assistance-to-an-already-capable-party]
lineage:
  - source: primary
    text: kautilya-arthashastra-qualities-of-the-ally-worth-helping
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Treaties,' 'Helping the Ally, the Middle King or the Neutral King,' 'Helping an Ally,' {7.8.11-16}."
    quote: "'For both the conqueror and the enemy, the ally to be specially helped is one who: (i) is able, i.e. starts a work he can complete; (ii) is sound, i.e. starts a work free from defects; (iii) is productive, i.e. starts a work producing good results; (iv) is resolute, i.e. works without stopping until it is completed; or (v) has devoted subjects who help him to finish the work, even with a little outside assistance. Such allies, once they have achieved their objective, gladly give abundant assistance in return. Allies who are not able, sound, productive, or resolute or without devoted subjects shall not be helped.'"
canonical-instances:
  - "A venture capital firm with limited follow-on capital directs a second round of funding toward the portfolio company that has already shipped a working product and hit its milestones with its first round, rather than toward a struggling portfolio company that has burned through its funding without results, reasoning that the same dollar produces a completed, reciprocating outcome in the first case and is likely to be lost in the second regardless of the amount."
  - "A mentor with limited time chooses to spend an extra hour a week with the mentee who already shows up prepared, follows through on assignments, and is close to a breakthrough, rather than with a mentee who is more discouraged and arguably needs the attention more but has not yet demonstrated the follow-through that would let an hour of guidance actually convert into progress."
critical-questions:
  - "does this triage principle risk becoming self-fulfilling and unjust -- if help only ever flows to those who are already capable, does the framework simply widen the gap between allies who had early advantages and those who didn't, regardless of what they might become with a genuine, sustained investment rather than a single conditional test?"
  - "how would a party actually assess these five qualities accurately in advance, given that 'starts a work he can complete' is itself often only visible in hindsight -- does the criterion risk collapsing into 'help whoever has already succeeded once,' which is a much narrower and more conservative standard than the five qualities as stated suggest?"
  - "is there a meaningful difference between refusing help to an ally who lacks capacity and actively abandoning an ally in genuine crisis -- does Kautilya's framework have any room for helping a currently-struggling ally who has a credible plan to become capable, or does the filter only ever look backward at track record?"
