id: lex-6chyw
name: a-family-permanently-conceals-a-grave-from-a-hostile-power
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "After a death at the hands of an occupying power, a family can deliberately and permanently conceal the burial location, even from their own community, accepting that no one, including their own descendants, will ever have certainty about the site. Crazy Horse's parents take his body 'away alone toward the east and north,' and 'nobody followed them.' Black Elk states plainly: 'The old people never would tell where they took the body of their son. Nobody knows to-day where he lies, for the old people are dead too.' Two hunters' partial sightings are the only trace, and even Black Elk, decades later, working carefully from that fragmentary evidence, stops short of claiming to know: 'But Crazy Horse might be lying over there just a little way from us right now on Pepper Creek across that hill yonder. I do not know.'"
related: []
evokes: [black-elk-speaks, killing-of-crazy-horse, nobody-knows-to-day-where-he-lies, the-old-people-never-would-tell, i-do-not-know]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch11-killing-of-crazy-horse
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 11, 'The Killing of Crazy Horse.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The old people never would tell where they took the body of their son. Nobody knows to-day where he lies, for the old people are dead too. Many have talked about the place, and some have said they knew where it was and would not tell, and many think it is somewhere on Bear Creek in the Badlands."
canonical-instances:
  - "The family of an assassinated dissident buries them in an unmarked, undisclosed location, refusing to reveal the site even to sympathetic journalists, fearing the ruling government would exhume, display, or destroy the remains to suppress a memorial site."
  - "Enslaved people burying a fellow escapee who died during a flight to freedom conceal the grave's location entirely, even from other members of the group, to prevent slave-catchers from using the body to track or intimidate the survivors."
  - "A resistance fighter's comrades bury him secretly during an occupation and deliberately let false rumors of multiple possible burial sites circulate, ensuring no single account, even under interrogation, could lead searchers to the real grave."
critical-questions:
  - "Does permanent concealment actually protect the dead, or does it primarily protect the living community from further violence and desecration that a known, marked grave might invite?"
  - "What does a community lose, beyond the practical fact of location, when even ordinary mourning rituals like visiting a grave become permanently impossible for descendants who were never told the site?"
  - "Black Elk carefully reconstructs a probable location from hunters' fragmentary sightings decades later, then still concludes 'I do not know' -- does that restraint honor the parents' original intent, or does it show how close the secret came to being solved anyway?"
status: active
