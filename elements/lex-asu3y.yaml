id: lex-asu3y
name: calibration-and-equal-error-rates-jointly-impossible-when-base-rates-differ
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating a probabilistic classifier (or any risk-prediction system) that operates across two or more groups, three intuitively-desirable fairness criteria cannot all be satisfied simultaneously when the groups' base rates differ. The three: (1) calibration — for any predicted-risk score s, the actual rate of the predicted event matches s within each group; (2) equal false-positive rates across groups — the rate of incorrectly flagging non-events is the same in each group; (3) equal false-negative rates across groups — the rate of missing actual events is the same in each group. Kleinberg, Mullainathan, Raghavan (2016) and Chouldechova (2017) independently proved: when base rates differ, you can satisfy at most one of these. This is a mathematical fact about probabilistic risk estimates, not a fact about machine learning or any specific decision domain. Operational consequence: 'is this classifier fair?' is not a well-formed question — different reasonable people will pick different criteria to optimize, and no system can satisfy all of them. The conflict ProPublica vs Northpointe over COMPAS recidivism (2016) was not one side being wrong; ProPublica was emphasizing criterion (2), Northpointe was emphasizing (1), and the two ARE mathematically incompatible at differing base rates. Diagnostic move: when asked about fairness, immediately ask 'fair in which sense — calibrated, equal FP rates, equal FN rates, or something else?' and surface that the chooser is exercising substantive moral judgment, not naming an objective property. Generalizes beyond ML / criminal justice to any classification system across heterogeneous populations: medical diagnosis (different prevalences across demographics), lending (different default rates), college admissions, hiring, anti-fraud, content moderation. The impossibility-fact is structurally identical wherever the inputs differ across groups."
