lineage:
  - source: primary
    text: cushing-summer-birds-boy-opens-eyes-from-boredom-not-doubt
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Summer Birds Came.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Now, will you?' said she. 'Now, can you be certain?--will you promise me that you will keep your eyes shut... Never open your eyes; if you do, the gods will teach you a lesson...' ... 'Now, just listen to that,' said the boy; 'my old grandmother is singing one of those tedious prayers; it will take us forever to go down.' ... 'There she goes again,' said he to himself; 'I declare, I must look up; it will drive me wild to sit here all this time and hear my old grandmother try to sing.' ... 'Look here, grandmother! I have heard your Thlen! Thlen! Thlen! enough this time. I am going to open my eyes.'"
canonical-instances:
  - "A patient undergoing a slow, uncomfortable but medically necessary monitored procedure becomes impatient with how long it's taking and moves or interrupts it against explicit instructions, not out of doubt that the monitoring matters, but purely from boredom and physical restlessness, compromising results that then have to be redone from the start."
  - "An employee following a long, repetitive security or compliance checklist skips the final several steps out of sheer impatience with how tedious the process has become, not because they doubt the checklist's purpose, and the skipped steps turn out to be exactly where the actual risk the checklist existed to catch was hiding."
critical-questions:
  - "is boredom with a slow protocol actually a distinct failure mode from doubt, or is impatience just what doubt feels like once someone has already nominally agreed to comply -- does the story's framing let the boy off too easily by calling it tedium rather than a change of heart?"
  - "does the grandmother's insistence on singing the entire lengthy chant, rather than a shorter version that would have been equally effective, share some responsibility for creating an unnecessarily long window for impatience to build -- is there a design lesson here about making protective protocols as brief as safety allows?"
  - "how would someone distinguish, in the moment, boredom that's genuinely safe to sit through from a scenario where the length of the required wait is itself a sign that something has gone wrong and needs to be interrupted -- does 'just be more patient' generalize as advice, or does it depend entirely on this particular protocol being sound?"
