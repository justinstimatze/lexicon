id: lex-4yhqs
name: coarse-graining
common-name: "Wrong grain for the question"
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When a problem is intractable at full detail, coarse-grain: group elements that behave alike and reason about the groups. The right grain depends on the question; choose grain that preserves the dynamics you care about while collapsing what you don't."
related: [lex-chp44, lex-wtkuz, lex-xcaqj, lex-kkr43, lex-hm8yx, lex-axa6h, lex-y6pqz, lex-e2tnt, lex-t5drx, lex-tmy67, lex-875gz, lex-c9xba, lex-bg3ad, lex-pn7cf, lex-dwey5, lex-p77e7, lex-4pmyk, lex-ndwng]
evokes: [approximation, macro-from-micro, lossy-compression-of-detail]
lineage:
  - source: primary
    text: boltzmann-1898-lectures-on-gas-theory
    citation: "Ludwig Boltzmann, *Lectures on Gas Theory* (1896-1898; Stephen G. Brush trans. 1964, University of California Press). The foundational primary for statistical-mechanical coarse-graining. Boltzmann explicitly names the multi-level hierarchy that the lex-4yhqs atom carves: 'molar-ordered' (macro-scale regularities — density gradients, temperature gradients), 'molar-disordered' (no macro-scale regularities), 'molecular-ordered' (micro-scale regularities — correlations between near-neighbor pairs), 'molecular-disordered' (no micro-scale correlations). The H-theorem assumes molecular-disorder as the macro-derivation's coarse-graining condition; without it, the H-theorem's predictions don't hold. This is the transferable claim — coarse-graining always has a level-of-description and a regime-of-validity, and choosing the wrong level (or applying outside the regime) is when coarse-graining fails. for the foundational primary."
    quote: "[Boltzmann 1898 *Lectures on Gas Theory*, §I.6 on the assumption of molecular disorder, naming the multi-level hierarchy:] 'From the standpoint of mechanics, any arrangement of molecules in the container is possible; in such an arrangement, the variables determining the motion of the molecules may have different average values in one part of the space filled by the gas than in another, where for example the density or mean velocity of a molecule may be larger in one half of the container than in the other, or more generally some finite part of the gas has different properties than another. Such a distribution will be called molar-ordered.' [Continuing — the molecular level:] 'If the arrangement of the molecules also exhibits no regularities that vary from one finite region to another — if it is thus molar-disordered — then nevertheless groups of two or a small number of molecules can exhibit definite regularities. A distribution that exhibits regularities of this kind will be called molecular-ordered. We have a molecular-ordered distribution if — to select only two examples from the infinite manifold of possible cases — each molecule is moving toward its nearest neighbor, or again if each molecule whose velocity lies between certain limits has ten much slower molecules as nearest neighbors.' [The regime-of-validity claim:] 'When these special groupings are not limited to particular places in the container but rather are found on the average equally often throughout the entire container, then the distribution would be called molar-disordered. Equations (14) and (14a) would then always be valid for individual molecules, but Equation (17) would not be valid, since the nearness of the m-molecule would be influenced by the probability that the m1-molecule lies in the space Φ.' [The transferable transition-to-molecular-disorder claim:] 'If the mean free path in a gas is large compared to the mean distance of two neighboring molecules, then in a short time, completely different molecules than before will be nearest neighbors to each other. A molecular-ordered but molar-disordered distribution will most probably be transformed into a molecular-disordered one in a short time.' [Practitioner-extraction: Boltzmann's transferable contribution is the multi-level hierarchy AND the explicit naming of the level-of-description-as-assumption. A macro-derivation (his Equation 14) holds at the molar-disordered level; a finer derivation (Equation 17) requires both molar AND molecular disorder. Choose the wrong level, or apply outside the regime (correlations persist, mean-free-path not large enough), and the coarse-graining fails. lex-4yhqs generalizes this to any hierarchy-with-level-relativity: the level-of-description carries assumptions about what regularities exist at that level vs. lower levels, and changing levels requires checking those assumptions.]"
canonical-instances:
  - "treating a planet as a point-mass for orbital mechanics — captures macro-trajectory while marginalizing internal detail (planet 'is a sphere' vs 'is made of atoms and here are all of them individually to consider')"
  - "an organism is alive AND made of organs AND made of cells AND made of molecules AND made of atoms — each tier captures something the others can't and marginalizes something the others can"
  - "a song is a melody AND a sequence of notes AND a waveform of audio samples — the listener-tier loses sample-by-sample fidelity; the recording-tier loses melody-as-gestalt"
  - "a face is a person AND a configuration of features AND a grid of pixels AND a pattern of photons — recognition vs measurement vs sensing each operate at a different tier"
  - "the lexicon's tier hierarchy itself is coarse-graining (the 'almost a sphere' move applied to cognitive moves) — atoms / molecules / compounds are increasingly coarse-grained representations"
critical-questions:
  - "what is the macro-variable the coarse-graining preserves, and what micro-detail is it lossy about? if you can't name both halves, you may be smuggling privilege of one layer over another"
  - "is the coarse-graining justified by the question being asked, or by computational convenience? legitimate coarse-graining is question-relative (planet-as-point-mass for orbits, not for atmospheric science); convenience-driven coarse-graining begs the question"
  - "where does the regime end? Newtonian-tier is conventionally right at human scales but wrong near c — what defines the boundary where this coarse-graining stops working, and how would you know you'd crossed it?"
  - "does the coarse-graining commute with the operations downstream? coarse-grain-then-act should match act-then-coarse-grain within tolerance — if not, the lossy compression is interacting with the action and the macro is not a closed system"
status: active
