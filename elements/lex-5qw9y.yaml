id: lex-5qw9y
name: destabilizing-news-is-withheld-until-it-becomes-actionable
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When someone's grief or shock at a piece of news would itself be disabling, and there is nothing they could do with the news before a specific moment when action becomes possible, withholding the news until that moment can be the more functional choice. Disclosing it the instant it becomes true spends the person's capacity before there's anything for them to spend it on. In the Jataka's tale of the loyal state elephant, the king's death is deliberately kept from the elephant — his lifelong comrade — because grief might break his heart; the household waits until the kingdom is under siege and the elephant's strength is the only thing that can save the infant heir, then delivers the news and the request for action in the same breath: 'Master, your comrade is dead, but we feared to tell it you lest you might break your heart. This is your comrade's son; the king of Kosala has run a leaguer about the city, and is making war upon your son; the army is losing ground; either kill your son yourself, or else win the kingdom back for him!' The timing isn't about protecting the elephant from truth indefinitely — it's about not spending his capacity to act before there's an action available to spend it on."
related: []
evokes: [jataka, dukanipata, alinacitta-jataka, timing-disclosure-to-the-moment-action-becomes-possible, bundling-bad-news-with-the-ask-it-enables]
lineage:
  - source: primary
    text: jataka-chalmers1895-alinacitta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 156, Alinacitta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Master, your comrade is dead, but we feared to tell it you lest you might break your heart. This is your comrade's son; the king of Kosala has run a leaguer about the city, and is making war upon your son; the army is losing ground; either kill your son yourself, or else win the kingdom back for him!"
canonical-instances:
  - "A surgeon delays telling a patient recovering from a difficult operation about a complication discovered mid-surgery until the patient is stable enough for the follow-up procedure the complication requires, rather than delivering destabilizing news with no immediate next step attached."
critical-questions:
  - "Who decides when the news becomes actionable, and could that same judgment be used to justify indefinitely postponing disclosure that the person withholding it simply finds convenient to delay, regardless of whether an action window has actually opened?"
  - "Does the elephant have any legitimate claim to have been told earlier regardless of whether action was possible, purely on the grounds that the choice not to tell him was made on his behalf without his consent?"
