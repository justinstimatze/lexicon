    quote: "One day, he was drunk, and threw the cup into the air, catching it as it fell. But once he missed it. Down it fell upon the earth, and smashed! Then he got poor again, and went about in rags, begging, bowl in hand, till at last he lay down by a wall, and died."
canonical-instances:
  - "A family repeatedly bails out a relative's failing business with fresh capital instead of addressing the relative's underlying pattern of reckless spending, and the relative eventually loses the new capital exactly as carelessly as every prior injection, arriving at the same ruin only later."
critical-questions:
  - "Would any amount of external intervention have prevented this outcome, or was the son's underlying character the actual variable that no resource, self-renewing or otherwise, could have compensated for?"
  - "Is it fair to call the father's gift a failure, or did it simply buy the son additional years of comfort before the same underlying flaw caught up with him regardless?"
status: active
