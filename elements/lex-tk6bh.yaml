id: lex-tk6bh
name: working-through-a-fixed-taxonomy-of-appeals-instead-of-guessing
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you don't know what will move someone, guessing at a single appeal risks missing entirely. Working systematically through a fixed set of categories, the standard levers people respond to, instead of one intuitive guess covers ground a single attempt can't, and it only takes one category landing to succeed. In the Jataka's tale of Sutasoma, trying to persuade the reformed man-eater to reclaim his throne rather than stay in the forest, Sutasoma doesn't guess at what he misses most — he cycles through the whole set: \"he tempted him first with food, next by appealing to his passions, thirdly by the thought of a bed, fourthly by song, dancing and music, fifthly by remembrance of a park and a city — with all these thoughts he tempted him.\""
related: []
evokes: [jataka, asitinipata, maha-sutasoma-jataka, systematic-appeal-coverage, persuasion-taxonomy]
lineage:
  - source: primary
    text: jataka-francis1905-maha-sutasoma-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XXI (Asitinipata), No. 537, Maha-Sutasoma-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "he tempted him first with food, next by appealing to his passions, thirdly by the thought of a bed, fourthly by song, dancing and music, fifthly by remembrance of a park and a city — with all these thoughts he tempted him."
canonical-instances:
  - "A recruiter trying to win back a candidate who turned down an offer doesn't guess at what mattered most — they work through compensation, then title, then team, then remote flexibility, then mission, one message at a time, because they don't know in advance which lever the candidate actually cares about."
  - "A restaurant trying to win back a lapsed regular sends a sequence of offers rather than one guess: a discount, then a new menu item, then a private event invite, then a loyalty-tier upgrade, then a personal note from the chef, covering the standard categories of what brings someone back rather than betting on a single reason."
critical-questions:
  - "Working through every category costs the persuader little but costs the target repeated exposure to appeals that don't land — at what point does systematic coverage read as respectful persistence versus wearing someone down until something, anything, finally works?"
  - "Sutasoma already knows the man-eater fairly well from having taught him as a boy — does the taxonomy approach only work this well because it's informed by real familiarity, or would cycling through the same five categories work just as well on a total stranger?"
status: active
