id: lex-5f2nj
name: regression-to-the-mean-is-mistakable-for-a-causal-treatment-effect
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When you observe (a) an EXTREME outcome on first measurement followed by (b) a less-extreme outcome on second measurement (after a praise, punishment, treatment, or 'expected slump'), check whether REGRESSION TO THE MEAN explains the change before reaching for a causal story. Whenever the correlation between two measurements is less than perfect (always, in practice), extreme first-measurements are partly driven by luck on that occasion; second-measurements will be closer to the population mean even with no intervention. Praising-high-performers and they-then-do-worse, punishing-low-performers and they-then-do-better, putting-an-athlete-on-the-cover and they-then-slump, treating-depressed-children-with-an-energy-drink and they-then-improve — all are predicted by regression with NO causal effect from the intervention. Operational moves: (i) ask whether the second-measurement direction (toward the mean) is what regression alone predicts; (ii) ask whether a CONTROL GROUP (no intervention) would show the same pattern; without a control, regression and treatment-effect are confounded; (iii) treat causal stories about regression as the default failure mode of System-1 pattern matching; (iv) Kahneman's perverse corollary: under praise-when-good / punish-when-bad feedback regimes, we are 'statistically punished for being nice and rewarded for being nasty' — the feedback reverses its sign because of regression."
related: [lex-2vpet, lex-4697f, lex-633k5, lex-7tvr6, lex-eb3wf, lex-jv983, lex-kyc5a, lex-tgqrf, lex-ut7kt, lex-ythes, lex-zag9z]
