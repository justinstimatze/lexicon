id: lex-25vsj
name: a-shouted-warning-cant-reach-a-mind-too-young-to-decode-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A protective instruction given calmly in advance and a warning shouted in the middle of unfolding danger are not the same tool, and the second one only works on someone who already has the capacity to convert a sound into an action fast enough to matter. In Cushing's telling, a mother sends her older children out with a clear, specific instruction: 'be very careful of your little sister; for she is young. Carry her gently on your shoulders, and place her where she will be safe.' They comply, and nothing goes wrong until the toddler's own delighted impulse to join their sliding game puts her directly in a sibling's path. The elder girl does exactly what you'd hope in the moment -- 'trying in vain to stop herself, called out to her to beware' -- but the warning fails completely, not from disobedience or carelessness, but because 'she was a little thing, and knew not the meaning of her sister's warning.' The advance instruction addressed where to place her; nothing addressed what to do about her own uncontrolled excitement once free to move, and the in-the-moment warning arrived at a mind with no pathway yet for turning an urgent word into a step backward. Diagnostic move: when a plan for someone's safety relies on both an advance instruction and an in-the-moment warning as a backup, check separately whether the person the warning is aimed at actually has, right now, the capacity to convert that warning into action within the time available -- a warning that arrives too fast for its recipient to use is not a safeguard, however clearly it's shouted."
