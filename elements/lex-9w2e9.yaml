name: weak-assumptions-buy-agreement-strong-ones-buy-specificity
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When building a theory or model, separate what follows from assumptions almost nobody would reject from what needs additional, more contestable assumptions to pin down. Merton's 1973 option-pricing paper opens by deriving a set of restrictions from nothing stronger than investors preferring more wealth to less, describing the goal directly: 'It is an attempt to derive theorems about the properties of option prices based on assumptions sufficiently weak to gain universal support. To the extent it is successful, the resulting theorems become necessary conditions to be satisfied by any rational option pricing theory.' He then names the tradeoff explicitly rather than letting it pass unstated: 'assumptions weak enough to be accepted by all are not sufficient to determine uniquely a rational theory of option pricing. To do so, more structure must be added to the problem through additional assumptions at the expense of losing some agreement.' Only after banking the weak, universal layer does he introduce the far more specific assumptions (a particular stock-price process, market completeness) needed to derive one actual formula. Keeping the two layers explicit means that if the strong, contestable assumptions later turn out wrong, the weak layer's conclusions survive untouched — you know in advance exactly how much of the theory was ever at risk. Before presenting a model's conclusions as one undifferentiated bundle, ask which of them follow from assumptions your harshest critic would still grant, and which only follow once you've also bought their more expensive, more arguable cousins."
related: [lex-jjzh7]
evokes: [merton-1973-necessary-conditions, layered-assumptions, universal-support-versus-uniqueness, buying-specificity-with-agreement, what-survives-if-the-model-is-wrong]
lineage:
  - source: primary
    text: merton-1973-weak-necessary-conditions-before-strong-sufficient-theory
    citation: "Robert C. Merton, 'Theory of Rational Option Pricing,' The Bell Journal of Economics and Management Science 4(1):141-183 (Spring 1973), p. 141."
    quote: "'It is an attempt to derive theorems about the properties of option prices based on assumptions sufficiently weak to gain universal support. To the extent it is successful, the resulting theorems become necessary conditions to be satisfied by any rational option pricing theory. As one might expect, assumptions weak enough to be accepted by all are not sufficient to determine uniquely a rational theory of option pricing. To do so, more structure must be added to the problem through additional assumptions at the expense of losing some agreement.'"
canonical-instances:
  - "The paper's own structure carries out exactly what it states: Section 2's restrictions (Theorems 1 through 6) rest only on the no-dominance assumption and hold for essentially any option-pricing theory, while the paper's second half narrows to the specific Black-Scholes stock-price assumptions only when a single formula, rather than a family of bounds, is the goal — the two sections are explicitly sequenced so a reader can stop at the end of the first and keep everything in it regardless of what happens to the second."
  - "Hypothetical: a policy team drafting a recommendation first states what follows merely from 'the policy must not make the median household worse off,' a constraint every stakeholder in the room grants, before adding the specific, contestable growth-rate and elasticity assumptions needed to recommend one particular number — so that if the specific assumptions are later challenged, the team can point to what survives the challenge intact."
critical-questions:
  - "How weak is weak enough? 'Investors prefer more wealth to less' reads as nearly unchallengeable, but the line between a genuinely universal assumption and one that merely feels safe to the author is a judgment call — what test would catch a weak-layer assumption that is actually smuggling in something contestable?"
  - "The paper treats the two layers as cleanly separable, but do the strong assumptions ever quietly do work inside a theorem that's presented as belonging to the weak layer — is layered-assumption discipline something a theory can claim for itself, or does it need an outside check to confirm?"
  - "Once the weak layer's necessary conditions are established, is there a risk of treating them as if they were closer to sufficient than they are — mistaking 'consistent with every rational theory' for 'therefore probably correct,' when a wide range of very different specific theories could each satisfy the same weak constraints?"
