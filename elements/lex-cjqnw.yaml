id: lex-cjqnw
name: role-lore-sorts-people-by-self-image-independent-of-its-truth
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a role or specialty has a folk reputation for requiring a certain personality type, and no one has actually verified the reputation is true, watch for the lore doing real sorting work anyway — not by making the role's requirements match the lore, but by filtering WHO CHOOSES the role in the first place. Merton on medical students choosing specialties: 'There is as yet little firm evidence of a connection between personality and the choice of different kinds of medical careers. But this has not prevented the emergence of a distinct student lore about the type of personality required for each kind of specialized practice. To some unknown extent, this lore itself seems to enter into the process of arriving at a decision. Some students engage in a fairly continual process of trying to match up their own personalities with the alleged personality requirements of various specialties.' A student who believes 'surgeons must be dashing and aggressive' will self-select toward or away from surgery based on whether they see themselves that way — regardless of whether surgery actually requires it. This is DISTINCT from the classic self-fulfilling prophecy (lex-z3qjg), where an acted-on belief reshapes the ENVIRONMENT to confirm itself (a bank run causes the very insolvency it feared). Here nothing about the specialty's actual requirements changes; instead, the belief operates through SELECTION — it sorts a self-selecting population of practitioners so that, over time, the specialty's actual membership DOES skew toward the stereotyped trait, purely because people who don't see themselves that way filter themselves out (or in) at the point of choice. The lore ends up looking confirmed ('look at all the surgeons you know') even though it was never independently tested against the actual skill requirements of the job — the confirmation is a population-composition artifact of the sorting, not evidence the lore was right about what the job needs. Diagnostic move: when a stereotype about 'the kind of person who does X' appears empirically confirmed by the composition of people currently doing X, check whether the stereotype could be operating purely through self-selection at the entry point rather than through any genuine requirement of the role itself."
related: [lex-4dm39, lex-7eseb, lex-z3qjg]
evokes: [merton-1957, occupational-lore, personality-matching-to-specialty, self-selection-not-self-fulfilling-behavior, surgeons-are-dashing-and-aggressive]
lineage:
  - source: primary
    text: merton-1957-lore-enters-the-decision
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.69. Verified against the pdftotext extraction of the source PDF."
    quote: "'There is as yet little firm evidence of a connection between personality and the choice of different kinds of medical careers. But this has not prevented the emergence of a distinct student lore about the type of personality required for each kind of specialized practice. To some unknown extent, this lore itself seems to enter into the process of arriving at a decision. Some students engage in a fairly continual process of trying to match up their own personalities with the alleged personality requirements of various specialties.'"
  - source: primary
    text: merton-1957-dashing-and-aggressive-surgeon
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education\" (1957), p.69."
    quote: "'In contrast to general practice, some students are convinced, surgery and radiology require relatively little ability to reason. \"It takes a certain personality to become a surgeon,\" says one student. \"You have to be dashing and aggressive and full of energy. I've talked to a lot of doctors about this and they all say this is true. Why, just look at all the surgeons you know; I can think of only one exception to this rule and I've worked with a lot of them.\"'"
canonical-instances:
  - "Folk belief holds that 'you have to be an extrovert to succeed in sales' — introverts who internalize this steer away from sales roles regardless of actual aptitude, so the sales workforce does skew extroverted over time, and the pattern gets cited as proof the belief was right, when it was the belief's effect on entry that produced the pattern, not any genuine requirement of selling well."
  - "Students avoid a demanding academic field because of a reputation that 'you have to be a certain kind of obsessive genius' to do it, based on a few famous outliers — the field's practitioner population ends up skewed toward people who see themselves that way, reinforcing the stereotype in the next generation of students deciding whether they 'fit,' independent of whether the field's actual day-to-day work requires that trait at all."
critical-questions:
  - "How would you empirically distinguish role-lore-driven self-sorting from a case where the folk belief is actually TRUE and the role genuinely does require or reward the trait — is the observed correlation between personality and specialty choice ever enough on its own to settle which explanation is operating?"
  - "If the lore is false but the self-sorting it causes is stable and widely believed, does correcting the lore (e.g., publishing evidence that personality doesn't predict success in the specialty) actually change future entrants' behavior, or does the lore's self-confirming population effect make it resistant to correction even once debunked?"
status: active
