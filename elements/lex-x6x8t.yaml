name: one-persons-raised-standard-cascades-into-a-market-shift
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When one person in a market or social system successfully holds out for a higher standard and it visibly pays off, don't expect that outcome to stay isolated to them -- everyone else facing a similar choice tends to update their own minimum requirements to match the proof of concept, even if most of them can't actually clear the new bar. In Cushing's telling, one maiden's demand that her suitor prove himself a hero, unusual and initially mocked, succeeds spectacularly when an outcast youth actually meets it. The effect doesn't stay contained to her: 'copying their lucky sister, all the pretty maidens in Moki declared that they would marry no one who did not show himself at least in some degree heroic.' A single successful holdout becomes the new reference point for an entire generation's expectations, and the market seizes up as a result: 'the whole tribe of Moki, so far as the young men were concerned, became a company of jilted lovers.' The other maidens aren't wrong that heroism is now proven possible to demand -- they're wrong to assume every suitor can supply it just because one, exceptional case did. Diagnostic move: when you see someone else's high standard get vindicated by one dramatic success, be careful about adopting the same standard wholesale for your own situation -- a demonstrated possibility isn't the same as a reliable expectation, and a whole population raising its bar in response to one outlier's success can produce a system-wide standoff where the supply of people who can actually meet the new standard never catches up to the demand for it."
