canonical-instances:
  - "A colleague who finally raises a long-avoided concern in a team meeting is praised afterward for her 'bluntness' and 'not caring what people think,' when in fact she had drafted and deleted the message three separate times over two weeks and rehearsed the exact wording with a friend before saying it out loud."
  - "A memoirist admired for unflinching honesty about a family secret actually wrote and discarded several earlier, heavily disguised versions of the same material over years before arriving at the direct version readers eventually see, a process invisible in the finished book but decisive in producing it."
critical-questions:
  - "Is there a meaningful category of genuinely low-shame or shame-resistant temperament in some real people, making Hyde's claim that 'unalloyed shamelessness exists in myth' too strong, if some people really do speak difficult truths with comparatively little internal resistance?"
  - "Does framing courageous speech as necessarily involving visible struggle risk discounting cases where someone speaks a hard truth easily and directly, treating ease as suspect or somehow less authentic than struggle, when ease might simply reflect a different relationship to the material?"
  - "Is the 'kill it in one form so as to resurrect it in another' formula precise enough to be useful, or is it evocative but vague about what specifically changes about the shame through the engagement, versus simply being endured or worked around?"
