evokes: [radin-winnebago-hare-cycle, hare-and-his-grandmother, arrow-go, that-is-not-the-way-hunters-act]
lineage:
  - source: primary
    text: radin-hare-pleads-with-the-arrow-instead-of-using-a-bow
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 2. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "He put the arrow in the fork of a tree in line with the elk and said, 'Arrow, go!' Then he pushed it but it would not go. He flattered it and tried again to direct it but it would not go. So he went home and spoke thus to his grandmother: 'Grandmother, the arrow would not obey me and so I could not kill an elk. I pleaded with it repeatedly but still it would not go.' Then his grandmother said, 'My grandson, that is not the way hunters act. They send the arrow off by means of an object they call a bow.''Make me one, grandmother,' said Hare."
canonical-instances:
  - "A new employee tries to get an expense-report system to accept a submission by resubmitting the same form repeatedly and adding a polite note in the comments field, when the actual issue is that the report needs a manager's account they haven't been given access to yet."
  - "A person struggling to start a stalled car tries turning the key more firmly and talking to the engine, rather than checking the fuel gauge or the battery connections that would actually explain why it won't start."
critical-questions:
  - "Is Hare's flattering of the arrow meaningfully different from a modern person's frustrated coaxing of a stubborn piece of software, or is the comparison unfair to Hare, who has no prior exposure to bows and no way to know a better method exists?"
  - "Does the story frame this as a failure of Hare's understanding specifically, or as a more general commentary on a mismatch between effort and mechanism that applies whenever someone tries harder at the wrong thing instead of a different thing?"
  - "Would Hare have discovered the need for a bow on his own eventually, or did he need his grandmother's correction specifically because the missing mechanism, the bow, was not something observation of the arrow itself could have revealed?"
