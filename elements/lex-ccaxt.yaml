id: lex-ccaxt
name: everyday-feedback-cannot-falsify-a-wrong-mechanism-behind-a-real-effect
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Justus von Liebig proposed around 1850 that searing meat forms a waterproof crust that seals its juices inside, and cooks should sear first, then finish at lower heat, to keep the roast moist. Simple experiments in the 1930s demonstrated this is false: the crust isn't waterproof, moisture keeps escaping the whole time (that's what the sizzle is), and high heat actually dries the surface faster than moderate heat does. McGee's point goes beyond Liebig simply being wrong: being wrong changed nothing about the myth's staying power, because searing really does make meat taste better, for a completely different reason (the Maillard browning reaction on the surface, which has nothing to do with moisture retention). Every cook who sears a roast and finds it delicious experiences exactly the outcome Liebig's theory predicted, so nothing in ordinary kitchen practice ever contradicts the false explanation. The myth survives professional training, cookbooks, and generations of chefs including Escoffier not because anyone is being credulous, but because normal use of the technique can never distinguish 'this works because of moisture-sealing' from 'this works because of flavor development' -- both theories predict the identical everyday experience of tastier meat. Transferable diagnostic: when a practice or technique reliably produces a good result, and a plausible mechanism is credited for why, check whether ordinary use of the practice could ever actually disconfirm that specific mechanism, or whether it could only ever confirm the outcome. If every use of the technique that goes well is consistent with the stated mechanism AND with at least one unstated rival mechanism, ordinary experience is structurally incapable of catching the error -- no amount of repeated confirming use will ever surface it, and only a test that isolates the claimed mechanism specifically (not just the outcome) can catch a wrong theory riding on a real effect."
related: [lex-4fw56, lex-kzjdw, lex-tfpzb, lex-xbpmu]
evokes: [harold-mcgee, liebig-searing-myth, seal-in-the-juices, maillard-reaction, right-result-wrong-reason, folk-theory-outlives-its-own-refutation, outcome-confirms-theory-mechanism-untested]
lineage:
  - source: primary
    text: mcgee-2004-on-food-and-cooking
    citation: "Harold McGee, On Food and Cooking: The Science and Lore of the Kitchen, completely revised and updated 2nd ed. (New York: Scribner, 2004), section 'The Searing Question.'"
    quote: "'The best-known explanation of a cooking method is probably this catchy phrase: “Sear the meat to seal in the juices.” The eminent German chemist Justus von Liebig came up with this idea around 1850. It was disproved a few decades later. Yet this myth lives on, even among professional cooks. [...] Liebig’s ideas caught on very quickly among cooks and cookbook writers, including the eminent French chef Auguste Escoffier. But simple experiments in the 1930s showed that Liebig was wrong. [...] But searing does flavor the meat surface with products of the browning reactions (p. 777), and flavor gets our juices flowing. Liebig and his followers were wrong about meat juices, but they were right that searing makes delicious meat.'"
canonical-instances:
  - "Pre-scientific medicine's bloodletting for fever: patients sometimes did improve after bloodletting (from the natural course of many illnesses, from placebo response, from the treatment coinciding with the fever's own peak), so physicians across centuries kept crediting the humoral theory that fever was an excess of blood to be drained -- the false theory of WHY it worked was insulated from disconfirmation by the same variability that would have let almost any confident intervention appear to work some of the time."
  - "A sales team credits a specific opening line in their pitch script for closing deals, and keeps using it for years, when the real driver of their success is that the reps using it happen to be the team's most experienced closers -- every closed deal 'confirms' the script theory because nobody ever isolates the line from the rep delivering it."
  - "Operationally distinct from lex-xbpmu test-a-proposed-mechanism-at-the-value-where-rival-theories-diverge: that atom is the METHOD for catching exactly this failure -- design a test at the point where the true and false mechanisms predict different outcomes. This atom names the FAILURE MODE that method is needed for: why ordinary, non-designed experience fails to catch a wrong mechanism on its own, no matter how many times the practice is repeated."
  - "Operationally distinct from lex-4fw56 a-fixed-narrative-can-reframe-any-new-evidence-as-confirming-it: that atom is about a narrative that actively absorbs and reinterprets evidence that would otherwise contradict it. This atom requires no active reframing at all -- there is no contradicting evidence to absorb, because the false mechanism and the true mechanism happen to predict the identical everyday outcome, so disconfirming evidence simply never arises under normal conditions."
critical-questions:
  - "How would a cook without access to controlled experiments ever have caught Liebig's error on their own? McGee's own account suggests they largely couldn't -- it took deliberate 1930s experiments that isolated the specific claim, whether the crust really is waterproof, from the general question of whether the meat tastes good, to surface the mistake. The correction came from outside ordinary kitchen practice entirely."
  - "Does this mean any long-persisting explanation for a reliable practice should be distrusted? No -- many practice-linked explanations are simply correct, and the diagnostic isn't 'old and popular therefore probably wrong.' The specific tell is whether the everyday use-case could ever produce a result the stated mechanism didn't predict. A mechanism whose disconfirming outcome is possible under normal use, and simply hasn't turned up yet, is in a different position entirely from one that normal use can never test in the first place."
  - "Once a wrong mechanism is corrected, does the correct explanation reliably displace it in practice? McGee published the correction in a widely read, authoritative reference book, and the passage itself notes the myth was already surviving among professional cooks decades after being disproved -- correcting the record in expert literature does not by itself guarantee the correction propagates through the practitioner community that actually uses the technique."
status: active
