id: lex-jy27d
name: muscular-bonding-is-blind-to-the-activitys-practical-or-symbolic-validity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when someone assumes that group cohesion or esprit de corps must be tracking something real — that people bond because the shared activity is TACTICALLY SOUND, meaningful, or at least not obviously pointless — and the question is whether that assumption holds. McNeill's claim, drawn from his own WWII experience: rhythmic synchronized muscular movement (close-order drill, dance, chant, march) produces a euphoric, involuntary bonding effect through a pre-verbal, subcortical pathway (sympathetic/para-sympathetic nervous system, only reaching the language-processing cortex after the fact) — and the STRENGTH of that bonding effect tracks the SYNCHRONY itself, not whether the coordinated activity is tactically valid, symbolically meaningful, or even non-self-destructive. McNeill's own case is the sharpest possible test: his 1941 basic-training drill was, by his own account and by general agreement among everyone drilling, tactically obsolete and even suicidal if applied to real combat — 'Given the facts of twentieth-century warfare, troop movement in the rear was a matter of trucks and railroads. Close-order marching within range of machine guns and rifles was a form of suicide. All concerned realized these simple facts, yet still we drilled.' The drill produced no practical training value whatsoever (there wasn't even a working weapon to train on) and everyone involved knew it was pointless — yet it still produced 'a strange sense of personal enlargement,' a diffuse euphoria with 'no apparent external stimulus,' and durable esprit de corps. The mechanism does not check the content for sense before delivering the emotional payoff — it fires on synchrony alone. Practitioner move: don't infer that a group's cohesion validates the shared activity that produced it (a team, a cult, a military unit, a marching protest, a corporate retreat can all bond just as strongly around a pointless or false activity as around a sound one) — and conversely, don't expect rational critique of the activity's content to dissolve a bond that was never formed through the rational/verbal channel in the first place. The bonding is real; it is simply not evidence that what people were bonding over was true, effective, or good."
