  - "LLM output convergence across providers: OpenAI, Anthropic, Google, Meta, Mistral converge from shared training-data composition + RLHF + constitutional-AI assumptions. Apparent variety of `model personalities` masks shared training-formula (Bender et al 2021, Carlini et al 2023, recent interpretability research)."
