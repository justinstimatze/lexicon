lineage:
  - source: primary
    text: newell-simon-1976-inspectable-artifact-as-experiment
    citation: "Allen Newell and Herbert A. Simon, 'Computer Science as Empirical Inquiry: Symbols and Search,' Communications of the ACM 19(3):113-126 (March 1976), p. 113."
    quote: "'Each new machine that is built is an experiment. Actually constructing the machine poses a question to nature; and we listen for the answer by observing the machine in operation and analyzing it by all analytical and measurement means available.' ... 'Neither machines nor programs are black boxes; they are artifacts that have been designed, both hardware and software, and we can open them up and look inside. We can relate their structure to their behavior and draw many lessons from a single experiment. We don't have to build 100 copies of, say, a theorem prover, to demonstrate statistically that it has not overcome the combinatorial explosion of search in the way hoped for. Inspection of the program in the light of a few runs reveals the flaw and lets us proceed to the next attempt.'"
canonical-instances:
  - "The paper's own reason for hedging the label 'experimental science': 'We would have called it an experimental science, but like astronomy, economics, and geology, some of its unique forms of observation and experience do not fit a narrow stereotype of the experimental method.' Computer science joins fields whose object of study can't be manufactured and re-run repeatedly under controlled bench conditions, yet remains empirical because inspecting one well-understood instance substitutes for repetition."
  - "Hypothetical: a developer debugging a production outage doesn't reproduce the failure on a hundred machines to be confident of the root cause — reading the one crash's stack trace against the code that produced it settles the question in a way that would otherwise require an expensive replication study if the system were a sealed black box instead of source they can open and read."
critical-questions:
  - "Newell and Simon's confidence rests on the artifact being genuinely inspectable — but a trained neural network's weights, or an opaque legacy binary, can technically 'be opened up' while resisting meaningful structural interpretation in practice. At what point does an artifact stop being inspectable in the sense this move needs, and revert to requiring the statistical route after all?"
  - "A single well-inspected failure reveals what's wrong with that run. Does it license a general claim about the program's behavior across all possible inputs, or only about the specific flaw found? The paper's confidence reads as general; the evidence from one inspected run is local."
  - "Is 'we can open it up and look inside' actually specific to human-designed artifacts, or does it apply equally to naturally-occurring systems once a good-enough instrument exists to inspect them (a cell under a microscope, a star's spectrum)? If the latter, inspectability rather than artificiality may be the real dividing line, understating how much of ordinary experimental science already works this way."
