id: lex-hkn3v
name: escalate-a-vague-conflict-to-its-extreme-form-to-reveal-the-resolution
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a tradeoff feels vague or merely inconvenient, don't stay at that level of description — push it to its most extreme, absolute statement, because the extreme form is what actually points toward a resolution while the vague form points nowhere. Altshuller names three nested levels of the same conflict and shows that only the sharpest one has diagnostic power. The vaguest level, the administrative contradiction (something must be done, but how is unknown), carries no direction at all: 'There is no need to discover administrative contradictions since they lie at the surface of the problem. But the heuristic 'prompting' force of such contradictions amounts to nil. They do not say in what direction the solution should be sought.' One level down, the technical contradiction (improving one parameter would degrade another) already narrows the search, because it rules out every variant where a gain in one quality costs another: 'a correctly formulated TC possesses a definite heuristic value... it enables one to throw out at once a multitude of empty variants.' But the sharpest and most useful level is reached by pushing the SAME conflict to its physical extreme — stating it as one part of the system needing to be simultaneously in two flatly incompatible physical states. Altshuller's own worked case: a lens polisher's surface must let coolant through (which requires holes) and must abrade glass (which requires a solid surface) — 'the surface of the polisher has to be solid in order to abrase the particles of glass yet 'holed' in order to let the coolant through. This is a physical contradiction (PC): mutually opposing demands are placed upon one and the same system... it is in precisely this, carrying the contradictions to the extreme, that the heuristic strength of the PC shows itself.' The mechanism is that an absurd-sounding, maximally sharpened statement of the conflict (the same surface must be wholly solid AND wholly perforated) forecloses vague compromise-seeking and forces the solver toward the small, known family of separation moves — split the property across space, across time, or across a transitional state — because no partial average of solid-and-holed satisfies either demand, while a genuine separation can satisfy both. The vaguer levels don't force this move because they still admit an illusory middle ground (make it 'somewhat' better on both counts) that a physical contradiction's stark either/or rules out by construction. Diagnostic move: when stuck on a fuzzy tradeoff, restate it as starkly and unreasonably as possible — the same single part or property must be fully X and fully not-X at once — and check whether that extreme, seemingly impossible statement is actually true of your problem; if it is, the extremity itself is what will surface the separation-based resolution that the softer version was hiding."
related: [lex-75nw3, lex-g3kjx, lex-kfzr2, lex-mnxhs, lex-mubyx, lex-s3pkr, lex-stppu, lex-ts7f6, lex-uq4xw]
evokes: [administrative-vs-technical-vs-physical-contradiction, lens-polisher-coolant-holes-example, sharpen-the-conflict-to-force-the-move, absurd-statement-forecloses-compromise]
lineage:
  - source: primary
    text: altshuller-1984-ac-tc-pc-hierarchy
    citation: "G. S. Altshuller, Creativity as an Exact Science, trans. Anthony Williams (Gordon and Breach, 1984), Ch.1, section 'Contradictions, Administrative, Technical and Physical.'"
    quote: "'In point of fact a contradiction is already present in the origin of inventive problems. Something has to be done, but how to do it is unknown. Such contradictions are customarily called 'administrative' (AC)... the heuristic 'prompting' force of such contradictions amounts to nil. They do not say in what direction the solution should be sought. Below the administrative level lie the technical contradictions (TC); if by certain methods one improves one part (or one parameter) of a technical system, it is inadmissible for another part (or another parameter) to deteriorate in the process... a correctly formulated TC possesses a definite heuristic value. Admittedly the formulation of the TC does not give any pointer toward the answer in specific terms, but it enables one to throw out at once a multitude of 'empty' variants: unsuitable by definition are all those variants in which a gain in one quality is accompanied by a loss in another.'"
  - source: primary
    text: altshuller-1984-lens-polisher-physical-contradiction
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.1, 'Contradictions, Administrative, Technical and Physical.'"
    quote: "'The technical contradiction here has already been indicated: the cooling capability of the perforated polisher comes into conflict with its ability to polish the glass... A 'hole' is good at letting a coolant through, but, not unnaturally, is no good at abrasing a piece of glass... Hence the surface of the polisher has to be solid in order to abrase the particles of glass yet 'holed' in order to let the coolant through. This is a physical contradiction (PC): mutually opposing demands are placed upon one and the same system. In physical contradictions the conflict of demands is intensified to the maximum. Therefore at first glance the PC seems absurd, inadmissible by definition... But it is in precisely this, carrying the contradictions to the extreme, that the heuristic strength of the PC shows itself.'"
canonical-instances:
  - "A negotiation stuck on 'we need this deal to be fair to both sides' (administrative-level, no direction) reframes as 'the same clause must give party A full downside protection AND give party B full upside participation' (physical-contradiction level) — the stark either/or then suggests separating the clause across TIME (downside protection for year one, upside participation from year two) rather than searching for a single vague 'fair' compromise clause."
  - "A UI design stuck on 'the settings panel should be simple but powerful' (vague technical-level tradeoff) reframes as 'the same screen must show zero controls and all controls at once' — stated this starkly, the resolution (a collapsed default view with an explicit expand-to-advanced toggle, separating the two states in TIME/interaction-sequence rather than space) becomes visible in a way the vague 'simple but powerful' brief did not suggest."
  - "operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition: lex-mnxhs is the RESOLUTION step once a clean parameter contradiction is already in hand (decompose the parameter, split it in space/time/context); this atom is the earlier DIAGNOSTIC step of deliberately sharpening a vague or merely-inconvenient tradeoff into that clean, extreme contradiction in the first place — without this step, there may be nothing sharp enough yet for lex-mnxhs's decomposition to act on."
critical-questions:
  - "is the extreme statement actually TRUE of the problem (a genuine physical contradiction), or is it a rhetorical exaggeration that misrepresents a softer tradeoff as starker than it really is — forcing an over-engineered separation-based fix onto a problem that a simple compromise would have handled fine?"
  - "once the extreme form reveals a space/time/state separation, has that separation been checked for what it costs elsewhere in the system (a solution that satisfies both demands by never letting them coexist may introduce a new coordination or transition cost the vague version never had to pay)?"
  - "who benefits from the problem staying framed at the vague, administrative level — is the reluctance to sharpen the contradiction genuinely about not having reformulated it yet, or about someone preferring the ambiguity because a stark either/or would make an unwelcome tradeoff explicit?"
status: active
