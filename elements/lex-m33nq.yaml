id: lex-m33nq
name: justifiability-to-others-is-basic-not-derivative-of-independent-wrongness
type-in: question
type-out: claim
_tier: atomic
agent-instruction: "Reach for this atom when the live question is not 'what does the contractualist test say' (that procedural formula already lives at lex-kfk68 as a Tier-3 aside) but a deeper metaethical one: WHAT MAKES reasonable-rejectability the right test in the first place — is it detecting some deeper, independent fact about right and wrong, or is it the bedrock itself? Scanlon's own formula: an act is wrong if and only if any principle that permitted it would be one that could reasonably be rejected by people moved 'to find principles for the general regulation of behavior that others, similarly motivated, could not reasonably reject' (equivalently, disallowed by any principle such people could not reasonably reject). That formula alone is compatible with two very different metaethical pictures, and Scanlon is explicit that he holds the less obvious one. Picture A (the one 'many people' hold, per his own framing): wanton killing is wrong, and BECAUSE it is wrong, any principle permitting it would be reasonably rejected — reasonable-rejectability is a downstream TEST tracking an antecedent, independently-existing fact about wrongness; the fact explains the rejection, not the reverse. Picture B (Scanlon's own view, and the one this atom grounds): 'My view denies this. It holds that thinking about right and wrong is, at the most basic level, thinking about what could be justified to others on grounds that they, if appropriately motivated, could not reasonably reject.' Justifiability to others is basic in two ways at once: 'First, it is by thinking about what could be justified to others on grounds that they could not reasonably reject that we determine the shape of more specific moral notions such as murder or betrayal. Second, the idea that we have reason to avoid actions that could not be justified in this way accounts for the distinctive normative force of moral wrongness.' Scanlon restates this even more sharply later in the book, directly against a rival who concedes the biconditional but denies the metaethical order: 'The idea that an act is right if and only if it can be justified to others is one that even a noncontractualist might accept... For utilitarians, however, what makes an action right is having the best consequences; justifiability is merely a consequence of this. What is distinctive about my version of contractualism is that it takes the idea of justifiability to be basic in two ways: this idea provides both the normative basis of the morality of right and wrong and the most general characterization of its content.' The diagnostic test for whether a given use of the contractualist formula is actually running Picture B (this atom) or has quietly reverted to Picture A: ask whether the explanation for why a principle 'could be reasonably rejected' ever bottoms out in an appeal to an independent fact about the act's wrongness ('because killing is intrinsically wrong') rather than in the burdens, costs, and generic reasons that specific standpoints would have for or against the principle. If it does, the buck-passed fact Scanlon denies is doing any real work has been quietly reintroduced. DISTINCT FROM lex-kfk68 (categorical-imperative-universalizability-as-moral-test), which already carries a Tier-3 aside citing this same formula and book: lex-kfk68's headline claim and primary grounding are Kant's Groundwork test (can the agent will this maxim as universal law?); Scanlon appears there only as a one-paragraph comparative deepening noting structural similarity to Kant, without ever stating or grounding the buck-passing/basicness argument this atom exists to carry. Use lex-kfk68 for Kant's own universalizability procedure; use this atom for Scanlon's own metaethical claim about what makes reasonable-rejectability basic, and for Scanlon's own worked material (Chapters 5 and 7) that lex-kfk68 does not contain at all. DISTINCT FROM KANT ON THE AXIS THAT MATTERS (also touches lex-7mdpd humanity-as-end, lex-d6vbs autonomy-as-self-legislation): the two tests are often run together as 'the same shape,' but Scanlon flags a divergence in DIRECTION, not just detail. Kant's test asks the agent, alone, whether he could rationally WILL his own maxim as a universal law of nature — performed inside one rational will, its authority derived from the AUTONOMY of that will (self-legislation, lex-d6vbs). Scanlon's test asks whether the principle could be justified TO EVERY PERSON IT AFFECTS, on grounds THEY could not reasonably reject — irreducibly relational, run from many standpoints at once. Scanlon says so directly: 'The account of right and wrong presented in Part II is likely to strike many as a Kantian theory... But my account of the reasons supporting our concern with the rightness of our actions is very different from Kant's... While Kant sought to explain the special authority of moral requirements by showing how they are grounded in conditions of our rational agency, I try to explain the distinctive importance and authority of the requirements of justifiability to others by showing how other aspects of our lives and our relations with others involve this idea. The result is an account of right and wrong that is, in Kant's terms, avowedly heteronomous.' Scanlon even revisits Kant's own objection to the Golden Rule (a criminal could tell the judge 'don't do to me what you wouldn't want done to you') and argues Kant's own answer already gestures toward Scanlon's relational test: not 'what would I want in another's shoes' but 'what general principles of action could we all will' — 'to avoid gridlock we must move away from the idea that each person's life... \"matters\" to the question of an acceptable system of general principles... We can consider only representative cases, and take into account only those objections that a person could raise while recognizing the force of similar objections by others.' Use lex-kfk68/0233/0234 for Kant's own solo-will autonomy test; use this atom when the vital move is the relational, other-directed justification test and its heteronomous metaethical grounding. DISTINCT FROM lex-9wbd3 (greatest-happiness-principle): Scanlon is explicit his account 'overlaps to a significant degree with Mill's definition of wrongness while not coinciding with it exactly' — 'If we all have good reason to want acts of a certain kind not to be performed, then it is likely that any principles allowing such acts could be reasonably rejected, hence that they will be wrong. But it does not follow that this will be so in every case in which a greater balance of happiness would result from such acts' being punished.' The frameworks diverge: an aggregate-welfare calculation can license overriding one person's claim whenever summed benefit to others is larger, with no ceiling on how many can be asked to bear a cost for others' marginal gain; Scanlon's test instead runs 'objections to permission' against 'objections to prohibition' one standpoint at a time and asks whether the worst individual complaint against a principle is reasonable, not whether the aggregate sum comes out ahead — a structural check against exactly the aggregation moves utilitarianism licenses (see also lex-xuwr2, Rawls's difference principle, same contractualist family, applied to institutions rather than interpersonal morality). DISTINCT FROM lex-kxk99 (principles-and-considered-judgments-mutually-adjust, reflective equilibrium) and lex-xuwr2 (Rawls's difference principle): lex-kxk99 already cites a LATER Scanlon book (Being Realistic About Reasons, 2014) as one more cross-domain attestation of Rawlsian reflective-equilibrium METHODOLOGY (how to choose among candidate moral principles by mutual adjustment) — a claim about METHOD. This atom is about a different, earlier book's METAETHICAL claim about what makes an act wrong in the first place — a claim about SUBJECT MATTER, not method. Scanlon's own method in this book is broadly reflective-equilibrium-like (he cross-checks the contractualist criterion against considered judgments about wanton killing, promising, and aid), but that shared method is not what this atom grounds. lex-xuwr2 grounds Rawls's application of a structurally similar contractualist-family test to the JUSTICE OF SOCIAL INSTITUTIONS (the basic structure, primary goods, the difference principle) — Scanlon is explicit this is a different, narrower domain from his own: 'it does not seem very likely, for example, that we could come up with a list of \"moral primary goods\" which could form the basis of a quite general \"moral division of labor\" between what we owe to each other and what is each individual's own responsibility. Morality (even the morality of obligation) is not \"about\" the provision of any such list of goods in the way that the question of the justice of social institutions can plausibly be held to be \"about\" the distribution of primary social goods.' Use lex-xuwr2 for Rawlsian institutional justice; use this atom for Scanlon's own narrower target, the interpersonal 'morality of right and wrong' ('what we owe to each other') — duties not to kill, coerce, deceive, or harm, and duties of aid, considered one person's standpoint at a time. THE WORKED MACHINERY (how the basicness claim cashes out, not just asserted): Scanlon spells out how a principle's reasonable-rejectability is actually assessed — 'we should consider possible principles governing how one may act in such situations, and ask whether any principle that permitted one to do X in those circumstances could, for that reason, reasonably be rejected. In order to decide whether this is so, we need first to form an idea of the burdens that would be imposed on some people in such a situation if others were permitted to do X. Call these the objections to permission... We then need... to consider the ways in which others would be burdened by a principle forbidding one to do X... Suppose that, compared to the objections to permission, the objections to prohibition are not significant, and that it is therefore reasonable to reject any principle that would permit one to do X.' This is not vote-counting aggregation (Picture-A or GHP-style); it is a standpoint-by-standpoint weighing of generic burdens, which is precisely why the basicness claim has teeth: there is no further fact about 'X is wrong' feeding into the weighing from outside — the weighing of burdens IS the whole of what 'wrong' picks out. Chapter 7's analysis of promising is Scanlon's own extended demonstration of exactly this: rather than explaining the wrong of promise-breaking by an antecedent social-practice fact (Hume's 'artificial virtue' of a convention; Rawls's own principle of fairness, that those who accept the benefit of a just practice owe compliance with its rules), Scanlon derives 'Principle F' — that once one has knowingly and voluntarily led someone to form a reliance-worthy expectation about future conduct, one is bound to perform, not merely to warn or compensate — directly from what potential promisers and promisees could not reasonably reject, with no institutional fact doing any of the explanatory work: 'I do not doubt that there is such a thing as a social practice of promising... The question is what role this practice plays in generating obligations to keep one's promises... I will argue, however, that the wrong of breaking a promise and the wrong of making a lying promise are instances of a more general family of moral wrongs which are concerned not with social practices but rather with what we owe to other people when we have led them to form expectations about our future conduct.' The Guilty Secret case (a promise not to repeat an old, embarrassing story) and the state-of-nature boomerang exchange (a conditional-intention case with no social practice of agreement-making presupposed at all) are both built to show the same wrong-making structure surviving the total absence of any institutional fact — the buck-passing test performed in miniature. Use this atom when: (i) someone states the contractualist formula correctly but treats reasonable-rejectability merely as a heuristic test for an independently-existing wrongness fact, and the question is whether Scanlon's stronger basicness claim is actually in play; (ii) the comparison at hand is Kant's solo-will autonomy test vs Scanlon's relational, other-directed, avowedly-heteronomous test, and the DIRECTION of justification (self vs others) is the operative distinction, not just formal similarity; (iii) a concrete puzzle (a promise, a lie, a relied-upon expectation) needs an account of why it's wrong that doesn't bottom out in an institutional or antecedent-fact story, and Scanlon's own Principle F / Guilty Secret / boomerang machinery is the worked model. Failure modes: (a) TREATING THIS ATOM AS A RESTATEMENT OF LEX-0232 — the formula overlaps, but the basicness/buck-passing claim is this atom's actual headline and is absent from lex-kfk68's Tier-3 aside; (b) COLLAPSING THE KANT/SCANLON DISTINCTION TO 'SAME THING, DIFFERENT WORDING' — the direction of the test (self-legislating will vs justifiability to others) is a real difference Scanlon himself insists on; (c) TREATING THE PROMISE EXAMPLES AS MERELY ILLUSTRATIVE — they are Scanlon's own demonstration that the buck-passing claim survives removal of every institutional/practice-based fact, the whole argumentative point of Chapter 7; (d) USING THIS ATOM FOR RAWLSIAN INSTITUTIONAL JUSTICE (reach for lex-xuwr2) OR REFLECTIVE-EQUILIBRIUM METHODOLOGY (reach for lex-kxk99) — Scanlon's own text is explicit these are different domains and different books."
