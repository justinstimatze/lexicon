id: lex-7xm57
name: a-system-that-fully-filters-noise-cannot-adapt-when-conditions-change
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A system built to faithfully preserve and replicate itself against error, noise, or deviation gains stability at the direct cost of its ability to change when the environment it's adapted to eventually shifts -- and since environments do eventually shift, a channel that keeps some noise from being filtered out is not a flaw in the system's fidelity but a structural requirement for its long-term survival. Hyde traces this through Jacques Monod's account of DNA: living things 'perpetuate themselves through invariance (DNA is remarkably stable) and guard themselves against the \"imperfections\" that chance might bring upon them,' yet that same invariance means they 'cannot adapt when the world around them changes, nor change to occupy empty niches of the biosphere.' The resolution is that DNA is not, in fact, a perfect filter: '\"The same source of fortuitous perturbations, of 'noise,' which in a nonliving … system would lead little by little to the disintegration of all structure, is the progenitor of evolution in the biosphere and accounts for its unrestricted liberty of creation,\" Monod writes, calling DNA \"[a] registry of chance, [a] tone-deaf conservatory where the noise is preserved along with the music.\"' A conservatory that only ever played the score exactly as written could never produce a new composition; DNA's fidelity is high but not absolute, and it's the residue of imperfect fidelity, the noise preserved alongside the music, that lets a lineage respond when its old adaptations stop working. Diagnostic move: when a system (an institution's rules, a manufacturing process, an organism's genome, a codebase's style guide) is evaluated purely on how well it resists deviation from its own standard, ask what its error-tolerance actually enables downstream -- a system with zero tolerance for noise is not more robust in an absolute sense, it has simply traded the capacity to adapt for the appearance of stability, and that trade only looks free until conditions change."
