id: lex-wrxz5
name: three-kinds-of-uncertainty-personal-field-and-cant-tell-which
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone in a demanding expert role feels unsure, don't treat 'uncertainty' as one undifferentiated feeling. Fox's typology, developed from Cornell medical students' own diaries, distinguishes three kinds: 'Two basic types of uncertainty may be recognized. The first results from incomplete or imperfect mastery of available knowledge. No one can have at his command all skills and all knowledge of the lore of medicine. The second depends upon limitations in current medical knowledge. There are innumerable questions to which no physician, however well trained, can as yet provide answers. A third source of uncertainty derives from the first two. This consists of difficulty in distinguishing between personal ignorance or ineptitude and the limitations of present medical knowledge.' The first kind (call it personal) is fixable by the person's own further study or practice. The second (call it field-level) is not fixable by that person at all — no amount of study closes a gap the whole discipline hasn't closed yet. The third is not a kind of uncertainty about the WORLD at all; it is uncertainty about WHICH OF THE FIRST TWO YOU ARE FACING, and it is the hardest to resolve because the two other kinds call for opposite responses: personal uncertainty calls for more study or supervision, field-level uncertainty calls for accepting the limit and proceeding anyway. Diagnostic move: before coaching someone through a felt uncertainty (a new manager unsure of a decision, an engineer unsure why a system behaves a certain way), ask which of the three they are actually reporting — do they lack knowledge that exists and could be taught to them, does the knowledge itself not yet exist anywhere, or do they genuinely not know which of those two is true — because the intervention that helps with the first (more training, more mentoring) does nothing for the second, and treating the third as if it were simply the first (assuming more training will resolve it) teaches the person nothing about how to recognize a field's own limits when they meet the next one."
related: [lex-j55nd, lex-kravt, lex-n7gkz]
evokes: [fox-1957, training-for-uncertainty, personal-ignorance-versus-field-limitation, cant-tell-which-kind, the-fault-of-the-field-not-your-own-fault]
lineage:
  - source: primary
    text: fox-1957-two-basic-types-plus-a-third
    citation: "Renée C. Fox, \"Training for Uncertainty,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.210-211. The source's own footnote 2 (a parenthetical about uncertainty in other responsible occupations, e.g. business executives and parents) is interposed by the page-break extraction directly inside the word 'knowledge' ('knowl' / footnote / 'edge'); the ellipsis below marks that exact interposition point rather than silently splicing the word back together."
    quote: "'Two basic types of uncertainty may be recognized. The first results from incomplete or imperfect mastery of available knowledge. No one can have at his command all skills and all knowledge of the lore of medicine. The second depends upon limitations in current medical knowledge. There are innumerable questions to which no physician, however well trained, can as yet provide answers. A third source of uncertainty derives from the first two. This consists of difficulty in distinguishing between personal ignorance or ineptitude and the limitations of present medical knowl ... edge.'"
canonical-instances:
  - "A new engineer can't get a distributed system's latency below a certain floor. Is it their own incomplete understanding of the codebase (fixable by more mentoring), a genuine limit of the current architecture that no one on the team knows how to beat yet (fixable only by a redesign nobody has invented), or do they not yet have enough experience to tell which one it is? Coaching them as though it's always the first kind teaches nothing when it's actually the second, and leaves the third kind of not-knowing completely unaddressed."
  - "A new therapist feels uncertain whether a client's lack of progress reflects their own inexperience with a technique, a genuine limit of what talk therapy can do for this presentation, or their inability yet to tell the two apart. Senior supervision that always assumes the first (assign more technique training) will eventually fail a case where the second is true, and won't teach the trainee how to recognize which is which on their own."
critical-questions:
  - "Fox's own conclusion proposes ranking fields by how much of each kind of uncertainty they carry (contrasting a field like Pharmacology, still tentative, against one like Gross Anatomy, largely settled) — does a novice's early exposure to a field's ranking on this scale shape how quickly they develop good judgment about which kind of uncertainty they're facing, or is that judgment acquired independent of which specific field a person trains in first?"
  - "Is there a fourth kind worth distinguishing — uncertainty about whether a question even falls within the role's jurisdiction at all, as opposed to uncertainty about the answer to a question everyone agrees is the role's to answer? Fox's own material (a case conference debating whether a doctor's responsibility extends to a patient's housing and food budget) gestures at this without naming it as a distinct type."
