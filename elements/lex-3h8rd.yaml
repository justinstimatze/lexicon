id: lex-3h8rd
name: an-arrangement-useful-at-one-stage-carries-the-seeds-of-its-own-end
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An arrangement can be genuinely useful at one stage of a system's development, and drive real progress through that stage, while producing byproducts that quietly accumulate the whole time it's succeeding. Once enough of that accumulation has built up, the very same forces that made the arrangement productive tip over into making it destructive -- the arrangement isn't undone by an outside attacker, it exhausts its own usefulness by working exactly as intended for too long. Gilman names this directly in the sexuo-economic relation: 'here is the natural end of an unnatural position, a position that serves its purpose for a time, but holds in itself the seeds of its own destruction,--through the unchecked sex-energy, accumulated under the abnormal pressure of the economic side of the relation, such excess is developed as tends to destroy both individual and race.'"
related: []
evokes: [women-and-economics, chapter-vii, holds-in-itself-the-seeds-of-its-own-destruction, serves-its-purpose-for-a-time, success-accumulates-the-byproduct-that-ends-it]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-vii
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter VII. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "But,--and here is the natural end of an unnatural position, a position that serves its purpose for a time, but holds in itself the seeds of its own destruction,--through the unchecked sex-energy, accumulated under the abnormal pressure of the economic side of the relation, such excess is developed as tends to destroy both individual and race; and such psychic qualities are developed as tend also to our injury and extinction. A relation that inevitably produces abnormal development cannot be permanently maintained."
canonical-instances:
  - "A startup's founder-led, all-hands-on-deck culture is exactly what makes the company's early growth possible, and the same instinct to route every decision through the founder becomes the bottleneck that stalls the company once it's grown past the size where any one person can keep up."
  - "A national industrial policy of heavy subsidies successfully builds a domestic manufacturing base from nothing, and the same subsidies, left in place past that point, breed the inefficiency and import-dependence on cheap inputs that eventually undermines the very industry they built."
  - "A strict, closely-supervised training regimen is what turns a raw recruit into a skilled specialist, and the same regimen, continued unchanged once the specialist has matured, produces the rigidity and resentment that drives their best people to leave."
critical-questions:
  - "How would you tell, while the arrangement is still working well, whether the byproducts accumulating underneath it are genuinely on a trajectory toward destruction, versus byproducts that will simply plateau and stay manageable indefinitely?"
  - "Gilman treats the destructive endpoint as inevitable once the arrangement has served its stage -- but is the timing and severity of the collapse actually fixed, or does it depend heavily on whether anyone intervenes to modify the arrangement once the accumulating byproduct becomes visible?"
  - "Is 'the arrangement serves a purpose and then destroys itself' meaningfully different from simply saying every temporary solution eventually becomes outdated, or does the specific claim -- that success itself, not mere time passing, produces the undoing -- do real additional diagnostic work?"
