id: lex-vhn99
name: loving-a-person-positioned-above-you-has-a-different-texture
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A person raised to associate love with protecting, indulging, or looking after someone weaker meets someone who instead commands genuine reverence, and discovers that the felt texture of the relationship is entirely different. It isn't more or less of the same feeling; the whole structure has changed, from care flowing down to admiration flowing up. Trying this against one's own pride and habit can feel like a loss of status at first, yet turn out more satisfying once tried: a sense of safety and freedom rather than a duty to manage or protect. The narrator states this directly of the women of Herland: 'These were women one had to love \"up,\" very high up, instead of down. They were not pets. They were not servants... I found that loving \"up\" was a very good sensation after all... It was like--coming home to mother... a love that didn't irritate and didn't smother.'"
