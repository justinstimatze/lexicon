id: lex-dvnb6
name: a-fabricated-taboo-isolates-someone-so-a-resource-can-be-taken
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Manufacturing evidence of a taboo condition in someone else, one that culturally requires their own self-isolation rather than requiring you to act against them, gets them out of the way without you ever having to ask them to leave, and the deception can then be extended to keep them from noticing what happens with the resource in their absence. In Radin's Winnebago Hare Cycle, wanting to eat a killed wildcat entirely by himself, Hare throws blood on his grandmother's legs and announces a fabricated cause: 'Grandmother, you are having your menses! You are going to kill my war-weapons!' She has no way to check this against her own body's actual state under the circumstances, and the taboo does the rest of the work on its own: 'she went out immediately' to build a separate lodge, moving farther away each time Hare calls out a new distance, until 'the fourth time she came right up to the lodge and said almost in a whisper, 'Where?''J ust where you are,' he said.' With her safely relocated and excluded from the meal on the same fabricated grounds, Hare stages a second deception to seal it: he throws a fake feast, faking other guests' voices so she'll believe the food was legitimately shared out, while 'Actually he changed his voice so that he could fool his grandmother and thus be able to eat the food alone.' The first lie didn't just remove her; it created the cover story the second lie needed to make the theft look accounted for. Diagnostic move: when someone with no way to verify a claimed condition suddenly removes themselves from access to a shared resource on your word alone, and a second story quickly follows to explain where that resource went, treat the two claims as one connected maneuver rather than two separate, unrelated events."
related: []
evokes: [radin-winnebago-hare-cycle, hare-and-his-grandmother, you-are-having-your-menses, ate-up-everything-alone]
lineage:
  - source: primary
    text: radin-hare-fabricates-a-taboo-to-isolate-his-grandmother-and-eat-alone
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 16. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "When he got home he said, 'Grandmother, we are going to have some soup for I have brought a wildcat with me that I killed.' 'Ah, grandson, I am glad of it.' So they both dressed it and singed it nicely. Suddenly Hare took some blood and threw it at his grandmother's legs, saying to her at the same time, 'Grandmother, you are having your menses! You are going to kill my warweapons!' ... Thus he shouted. So she looked down and the blood was flowing down her legs. 'Oh, dear! I must have killed my grandson's war-weapons,' she said, and she went out immediately. After she had gone some distance away she shouted, 'Grandson, where shall I make my lodge?' and he shouted back, 'A little farther back still. There you may make your lodge.' Instead of going farther away, however, she really came nearer to the lodge and said in a low voice, 'Where?' and he shouted back, 'A little farther still.' The fourth time she came right up to the lodge and said almost in a whisper, 'Where?''J ust where you are,' he said. So there she made her lodge. Then Hare said, 'Grandmother, we were just about to have some meat but as it is impossible for you in your present condition to eat any I will not eat any of it either and instead give a feast with it.' Then he went outside and shouted, 'Come, you are all invited to a feast!' After a while he pretended that someone had come and began talking but, of course, he was only feigning. Actually he changed his voice so that he could fool his grandmother and thus be able to eat the food alone. When the meat was cooked he made a long festal speech and ate up everything alone."
canonical-instances:
  - "A business partner tells a co-owner that a regulatory conflict of interest requires the co-owner to recuse themselves from a specific deal, when no such conflict exists, then closes the deal alone and later reports fabricated terms that make it look like the proceeds were properly shared."
  - "A roommate convinces another roommate that a landlord-mandated inspection requires them to temporarily vacate the apartment for a few days, then uses the time to remove and sell shared furniture, later claiming a fake buyer's story about what happened to it."
critical-questions:
  - "Does the specific choice of a bodily taboo matter here, something the grandmother cannot independently verify or contest, or would any sufficiently urgent fabricated reason for her to leave have worked as well, making the taboo incidental to the actual mechanism?"
  - "Is the second deception, the fake feast and disguised voice, a separate lie or a necessary continuation of the first one, and does recognizing them as one connected maneuver rather than two events change how a bystander might have intervened earlier?"
  - "Would the grandmother have had any way to catch this at the time, given that she has no way to check whether she is actually bleeding for the stated reason, and does that total lack of verification make this a fundamentally different situation from most fabricated excuses, which can at least in principle be checked?"
status: active
