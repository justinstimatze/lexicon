id: lex-7mr6w
name: survival-test-mistaken-for-purpose-degrades-purpose-attainment
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When a survival test (the metric that keeps the entity alive) is mistaken for the entity's purpose, purpose-attainment degrades. The survival metric was a proxy; optimizing it directly hollows out what made the survival worth pursuing. Same shape as Drucker's customer-vs-profit (lex-2jn8d)."
