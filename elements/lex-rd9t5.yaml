    quote: "“The telling of beautiful untrue things is the proper aim of Art,” says Wilde, thinking of all those great creations (Milton’s Satan, Hamlet, Jane Eyre) who are more real and durable than the perishable women and men we know in fact. Thus Wilde honors Balzac, saying his characters “dominate us, and defy skepticism. One of the greatest tragedies of my life is the death of Lucien de Rubempré. It is a grief from which I have never been able completely to rid myself. It haunts me in my moments of pleasure. I remember it when I laugh. But Balzac is no more a realist than Holbein was. He created life, he did not copy it.”"
canonical-instances:
  - "A reader who has cried harder over a beloved fictional character's death than over the passing of a distant acquaintance isn't being irrational or shallow; the novel achieved a durable, high-resolution intimacy over hundreds of pages that a real but thin acquaintance never had the occasion to build."
  - "A screenwriter is told their invented protagonist 'isn't a real person' as a criticism of the film's seriousness, missing that the character's specific, coherent, and memorable construction may leave a more lasting impression on audiences than most of the real, undercharacterized people who pass briefly through their lives."
critical-questions:
  - "Does this claim actually distinguish fiction from mere vivid or memorable non-fiction, or would any sufficiently well-told true story achieve the same durability, making the relevant variable craft and detail rather than fictionality itself?"
  - "Is there a moral risk in a grief for invented characters coming to outweigh attention to real people's actual suffering, and does Wilde's own framing ('haunts me... I remember it when I laugh') romanticize a substitution that could function as a retreat from harder, messier real relationships?"
  - "Does this claim generalize across all art, or is it specifically dependent on the kind of totalizing, single-authored, richly detailed characterization the novel form allows, meaning it might not hold for other media with less capacity to build that particular kind of durable intimacy?"
