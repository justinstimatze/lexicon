id: lex-976aa
name: overcorrecting-a-vice-produces-its-mirror-image-vice
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a group has genuinely learned to stop being self-righteous, check whether the lesson got overlearned into a mirror-image vice rather than settling into balance. Popper names the pattern directly: 'Having discovered the sin of self-righteousness, we have fallen into its stereotyped inversion: into a stereotyped pose of self-depreciation, of inverted smugness. Having learned that one should not be judge in one's own cause, we are tempted to become advocates for our opponents. Thus we become blind to our own achievements.' The lesson itself, that nobody should be judge in his own cause, was sound. What went wrong is that the fix for one blindness, excusing your own side too readily, was a second blindness just as unexamined as the first: crediting your own side with nothing at all. Both postures share the same defect: neither is actually looking at the evidence, one habitually inflates it and the other habitually discounts it. Diagnostic move: when a person or group prides itself on having overcome self-righteousness, arrogance, or overconfidence, check whether the replacement stance is more accurate, or whether it's the same unexamined reflex running in the opposite direction. A pose of humility that never once credits an actual achievement is exhibiting the identical failure to look at evidence that the original self-righteousness was exhibiting -- it has just relabeled which conclusion the reflex is required to reach."
related: []
evokes: [popper-history-of-our-time-optimists-view, stereotyped-inversion-of-self-righteousness, inverted-smugness, blind-to-our-own-achievements]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The History of Our Time: An Optimist's View' (the Sixth Eleanor Rathbone Memorial Lecture, delivered at the University of Bristol, October 12, 1956), Ch. 19 of Conjectures and Refutations (Routledge Classics, 2002), p.501."
    quote: "'We have learned the fundamental moral truth that nobody should be judge in his own cause. This, no doubt, is a symptom of a certain moral maturity; yet one may learn a lesson too well. Having discovered the sin of self-righteousness, we have fallen into its stereotyped inversion: into a stereotyped pose of self-depreciation, of inverted smugness. Having learned that one should not be judge in one's own cause, we are tempted to become advocates for our opponents. Thus we become blind to our own achievements. But this tendency must be resisted.'"
canonical-instances:
  - "An engineering team, burned by a culture of overclaiming and shipping half-tested features as revolutionary, swings hard toward self-deprecation -- every retro opens with what went wrong, every launch gets undersold, every genuine improvement gets waved off as nothing special. The new humility is just as reflexive as the old overclaiming was, and just as disconnected from an honest look at what the team actually accomplished."
  - "A person who spent years excusing their own mistakes in a relationship overcorrects after therapy into assuming they're always the one at fault in any disagreement, with any partner. The new instinct feels like growth, but it's the same non-evaluative reflex as the old one, permanently pointed at themselves instead of away -- neither version actually looks at the specific disagreement to see who's right."
critical-questions:
  - "Isn't some self-deprecation just appropriate modesty, not a mirror-image vice -- how do you tell them apart? The test is whether the stance responds to evidence. Appropriate modesty updates: it credits a real achievement when one occurs and owns a real failure when one occurs. The mirror-image vice is invariant, discounting achievements and inflating failures regardless of the specific facts -- the same rigidity the original self-righteousness had, running in reverse."
  - "Doesn't constantly checking whether your humility is genuine or a mirror-image vice just create endless self-second-guessing? The check is external rather than introspective: look at the actual track record, not your own felt sincerity. A pattern of real achievements going uncredited is what marks the stance as a calcified reflex, regardless of how it feels from the inside."
