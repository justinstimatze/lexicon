lineage:
  - source: primary
    text: lucretius-c55bce-de-rerum-natura
    citation: "Titus Lucretius Carus, *De Rerum Natura* [On the Nature of Things], Book II, trans. William Ellery Leonard (c. 55 BCE)."
    quote: "[The deterministic default, without the swerve:] 'The atoms, as their own weight bears them down / Plumb through the void, at scarce determined times, / In scarce determined places, from their course / Decline a little—call it, so to speak, / Mere changed trend. For were it not their wont / Thuswise to swerve, down would they fall, each one, / Like drops of rain, through the unbottomed void; / And then collisions ne'er could be nor blows / Among the primal elements; and thus / Nature would never have created aught.' [Ruling out the alternative that differential weight alone explains collisions:] 'But, if perchance be any that believe / The heavier bodies, as more swiftly borne / Plumb down the void, are able from above / To strike the lighter, thus engendering blows / Able to cause those procreant motions, far / From highways of true reason they retire... Thus ne'er at all have heavier from above / Been swift to strike the lighter, gendering strokes / Which cause those divers motions, by whose means / Nature transacts her work. And so I say, / The atoms must a little swerve at times— / But only the least, lest we should seem to feign / Motions oblique, and fact refute us there.' [The swerve as ground of free will, breaking the causal chain:] 'Again, if ev'r all motions are co-linked, / And from the old ever arise the new / In fixed order, and primordial seeds / Produce not by their swerving some new start / Of motion to sunder the covenants of fate, / That cause succeed not cause from everlasting, / Whence this free will for creatures o'er the lands, / Whence is it wrested from the fates,—this will / Whereby we step right forward where desire / Leads each man on, whereby the same we swerve / In motions, not as at some fixed time, / Nor at some fixed line of space, but where / The mind itself has urged? For out of doubt / In these affairs 'tis each man's will itself / That gives the start, and hence throughout our limbs / Incipient motions are diffused.'"
  - source: discovery-loop
    text: distinctness-audit-lucretius-swerve-vs-existing-substrate
    citation: "Lex-0219 (akrasia, knowing the good yet doing otherwise) and lex-fecdf (inconceivability mistaken for impossibility) are not about physical determinism, causation, or the metaphysics of free will: lex-v7ceq is a moral-psychology puzzle about weakness of will, lex-fecdf is a general epistemic fallacy about conceivability and possibility. Lex-0762 (Bergson, practical-cognition-substitutes-snapshots-for-continuous-becoming) is the genuinely adjacent prior atom: Bergson denies that reality is composed of discrete, causally-chained states at all — the causal-chain framework is itself a practical fiction imposed by spatializing cognition — while Lucretius's argument grants the chain-of-discrete-atomic-events framework and inserts a genuine causal gap into it. The two are structurally opposite strategies arriving at a similar practical conclusion (freedom is real), not a duplicate pair. No existing atom grounds the specific 'localized uncaused indeterminism at the physical bottom is the necessary condition for free will at the top' argument-form prior to this mint."
canonical-instances:
  - "The founding argument itself: Lucretius denies that unimpeded atomic fall alone could ever produce collision, combination, or creation — 'Nature would never have created aught' — and posits the swerve as the minimal deviation that makes a combinatorial universe (and, at the human scale, free choice) possible at all."
  - "Lucretius's explicit rejection of the differential-weight alternative: rather than let a rival explanation (heavier atoms overtaking lighter ones in free fall) quietly re-establish determinism through the back door, he argues directly that no medium-resistance account can produce oblique motion, forcing the swerve to be posited as genuinely, irreducibly uncaused."
  - "The human-scale payoff passage: 'this free will for creatures o'er the lands... whereby we step right forward where desire leads each man on' is explicitly derived FROM the atomic swerve, not asserted independently of it — making this one of the earliest explicit physical groundings of a metaphysical free-will claim in the Western tradition."
  - "The modern echo: any argument that treats quantum-mechanical indeterminacy (rather than Epicurean atomic swerve) as physics's own gap for libertarian free will to occupy is running the identical argument-form Lucretius stated over two thousand years earlier, inheriting the same unresolved objection — that uncaused randomness is not obviously more 'free' or agent-controlled than strict determinism was."
critical-questions:
  - "Is the argument actually locating a genuinely UNCAUSED deviation, or has it smuggled in a hidden cause (a hidden variable, a differential property) that would, if found, collapse the indeterminism back into ordinary determinism? Lucretius's own text is explicit about ruling out exactly this move for the atomic case."
  - "Even granting a genuine, uncaused gap in the causal chain, does that gap actually deliver AGENCY or FREEDOM, or merely unpredictability? An uncaused swerve is not under the agent's own control any more than a determined fall was — this is the classic unresolved objection to the whole argument-form."
  - "Is this the Lucretian strategy (grant a discrete causal-chain framework, insert a genuine gap in it) or the Bergsonian strategy (lex-pn7cf: deny the discrete causal-chain framework describes reality at all)? These are structurally different anti-determinist moves and should not be conflated even when they're deployed toward the same conclusion."
  - "Is the appeal to indeterminism doing real argumentative work, or is it functioning as a rhetorical gesture toward 'science says the universe isn't fully determined, therefore free will is safe' without actually specifying the mechanism by which a physical gap becomes an agent's freedom?"
