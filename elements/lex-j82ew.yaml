id: lex-j82ew
name: democracies-fix-visible-crises-tolerate-invisible-suffering
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Democratic accountability doesn't treat every harm alike -- a sudden, attributable event gets caught, while a slow-building, diffuse condition can persist indefinitely under the exact same institutions. Sen contrasts India's post-independence record on famine (eliminated within years of democratization) against its record on endemic undernourishment (tolerated for decades under the same democracy): “One reason is the ease with which famines and massive death tolls from starvation and associated diseases can be politicized, in contrast with the difficulty of generating public understanding of less easily observed social failures, including persistent hunger. ... Inattention to widespread deprivation helps the tolerance -- and continuation -- of abject poverty and deprivation, despite the presence of extensive democratic institutions.” A famine has a clear before-and-after, a body count, and a government whose failure to act is unambiguous -- a free press can turn it into a political liability overnight. Chronic malnutrition has no single moment, no clear culprit, and no dramatic image -- it can coexist with a free press and regular elections indefinitely, because there's no acute event for public attention to organize around. Diagnostic move: don't assume that because a democratic system reliably fixes visible, sudden crises, it will eventually get around to chronic, diffuse ones too. The accountability mechanism that catches the first kind is largely blind to the second, and closing that gap takes deliberate work -- sustained reporting, framing, and organizing -- that visible disasters get for free."
