id: lex-94b4j
name: the-protected-party-self-limits-a-blanket-policy-to-keep-it-from-being-revoked
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A blanket protection granted out of gratitude, with no boundary built in, can become unsustainable once the protected class grows large enough to cause real damage the grantor never anticipated — and the grantor may be bound by their own word not to revoke it even as the damage mounts. Rather than wait for the policy to collapse under pressure from the people it harms, the protected party can impose its own limit, addressing the harm directly without asking the grantor to break a promise. In the Jataka''s tale, the king''s decree of protection for all deer, given out of gratitude to the one who saved him, works until the herds start devouring the countryside''s crops: "The deer are eating up our crops: this let the king prevent!" The king, bound by his own vow, refuses to revoke it even as his subjects press him: "Be it the people''s wish or no, e’en if my kingdom cease, I cannot wrong the deer, to whom I promised life and peace... The boon I gave that royal deer I never will deny." It is the deer himself who resolves the standoff, not the king: "assembling all the deer, laid his bidding on them: ''From this time forward you must not devour the crops of men.''" He then arranges for farmers to mark their own land with a placard the herds will respect — narrowing the protection''s practical scope without either side breaking its word.'
related: []
evokes: [jataka, terasanipata, ruru-jataka, self-limiting-a-blanket-grant, protecting-a-policy-from-its-own-side-effects]
