lineage:
  - source: primary
    text: petroski-1985-to-engineer-is-human-preface-and-hypothesis-chapter
    citation: "Henry Petroski, To Engineer Is Human: The Role of Failure in Successful Design (New York: St. Martin's Press, 1985). This is the book's central thesis, stated in the Preface and developed across the chapters 'Engineering as Hypothesis,' 'Success Is Foreseeing Failure,' 'Safety in Numbers,' and 'The Ups and Downs of Bridges.' Petroski's crucial move is to reframe every engineering design as an implicit, testable hypothesis ('this structure will not fail if used as intended'). Because a hypothesis can be disproved by a single disconfirming instance but never fully proved by any number of confirming ones, engineering failure and engineering success are asymmetric evidence: a failure is a decisive, information-rich disproof that shows exactly where a design assumption broke; a success is only a probabilistic, low-information non-disproof, structurally identical to the sun having risen every day so far. Petroski extends this into a historical claim: because successes don't teach the field where its margins actually are, sustained success breeds lower safety margins (overconfidence), and it is failure — not success — that recalibrates a field's understanding and produces the next, more conservative generation of designs, which then erode again in the next run of successes. Chapter/page markers are cited by chapter title; the ebook-convert plain-text extraction used for this mining pass carries no reliable page numbers."
    quote: "[Preface:] 'I believe that the concept of failure—mechanical and structural failure in the context of this discussion—is central to understanding engineering, for engineering design has as its first and foremost objective the obviation of failure. Thus the colossal disasters that do occur are ultimately failures of design, but the lessons learned from those disasters can do more to advance engineering knowledge than all the successful machines and structures in the world. Indeed, failures appear to be inevitable in the wake of prolonged success, which encourages lower margins of safety. Failures in turn lead to greater safety margins and, hence, new periods of success. To understand what engineering is and what engineers do is to understand how failures can happen and how they can contribute more than successes to advance technology.' [Chapter 'Engineering as Hypothesis,' the falsifiability-asymmetry claim:] 'The fundamental feature of all engineering hypotheses is that they state, implicitly if not explicitly, that a designed structure will not fail if it is used as intended. Engineering failures may then be viewed as disproved hypotheses. Thus, the failure of the Hyatt Regency elevated walkways disproved the hypothesis that those skywalks could support the number of people on them at the time of the collapse; the failure of the Tacoma Narrows Bridge disproved the hypothesis that the suspension span could carry morning traffic in a forty-two-mile-per-hour crosswind; and the failure of the Teton Dam disproved the hypothesis that it could hold back river water for irrigation. On the other hand, the past success of an engineering structure confirms the hypothesis of its function only to the same extent that the historical rising of the sun each morning has reassured us of a predictable future. The structural soundness of the Brooklyn Bridge only proves to us that it has stood for over one hundred years; that it will be standing tomorrow is a matter of probability, albeit high probability, rather than one of certainty.' [Same chapter, on scientific hypotheses generally, the asymmetry stated in its purest form:] 'A scientific hypothesis is tested by comparing its conclusions with the reality of the world as it is. Yet, no matter how many examples of agreement one may collect, they do not prove the truth of the hypothesis... On the other hand, just one instance of disagreement between the hypothesis and reality is sufficient to make the hypothesis incontrovertibly false.' [Chapter 'Safety in Numbers,' on the cyclic dynamic of factors of safety:] 'This clearly indicates that it is failure that the engineer is trying to avoid in his design, and that is why failures of real structures are so interesting to engineers... Generally speaking, when structural failures occur, a larger factor of safety is used in subsequent structures of a similar kind. Conversely, when groups of structures become very familiar and do not suffer unexplained failures, there is a tendency to believe that those structures are overdesigned... Confidence mounts among designers that there is no need for such a high factor of ignorance in structures they feel they know so well, and a consensus develops among designers and code writers that the factor of safety for similar designs should in the future be lowered. The dynamics of raising the factor of safety in the wake of accidents and lowering it in the absence of accidents clearly can lead to cyclic occurrences of structural failures. Indeed, such a cyclic behavior in the development of suspension bridges was noted following the failure of the Tacoma Narrows Bridge.' [Chapter 'The Ups and Downs of Bridges,' the paradox stated directly:] 'The paradox of engineering design is that successful structural concepts devolve into failures, while the colossal failures contribute to the evolution of innovative and inspiring structures. However, when we understand the principal objective of the design process as obviating failure, the paradox is resolved. For a failed structure provides a counterexample to a hypothesis and shows us incontrovertibly what cannot be done, while a structure that stands without incident often conceals whatever lessons or caveats it might hold for the next generation of engineers.'"
  - source: primary
    text: petroski-1985-to-engineer-is-human-afterword-challenger-case
    citation: "Henry Petroski, To Engineer Is Human, 'Afterword to the Vintage Edition' (dated December 1991), added after the original 1985 edition to address the Challenger disaster (January 1986). This is Petroski's own case study applying the book's thesis to a real, subsequently-famous instance of a success-record being wrongly read as proof of margin: NASA managers weighed a 'perfect string of successful launchings' against engineers' specific, correct doubts about O-ring performance in cold weather, and the string of successes won — until the actual failure occurred and (Petroski notes) it was only then that the engineers' doubts were credited."
    quote: "[Afterword to the Vintage Edition:] 'By January 1986, there had been two dozen successful shuttle launches and, in spite of nagging incidents with such details as heat shield tiles, landing gear, and O-rings, the general perception was that the overall design of the spacecraft was that of a rather robust, albeit complex and temperamental, piece of machinery. Thus, in a general climate of confidence at the National Aeronautics and Space Administration, the doubts of circumspect engineers like Roger Boisjoly about the ability of the O-rings to function properly in the exceptionally cold weather predicted for the morning of the Challenger launch were, in the final assessment, dismissed. The engineers did have engineering data and judgment about the nagging details on their side, of course, but no one could prove beforehand that Challenger would fail. The managers, on the other hand, had a perfect string of successful launchings and landings to argue for the soundness of their own judgment... It was only after Challenger did explode that NASA as an institution could give the benefit of the doubt to the engineers.' [Same Afterword, the general lesson:] 'Examples like the Challenger explosion and the inadvertent testing of the Golden Gate Bridge demonstrate the states of complacency and familiarity we can fall into when it comes to dealing with large technological systems... The most dramatic failures have occurred in a climate of overconfidence and carelessness, and the least we can learn from those incidents is to be more vigilant.'"
  - source: discovery-loop
    text: distinctness-audit-against-margin-of-safety-premortem-survivorship-bias
    citation: "Lex-0711 (Graham's margin-of-safety) is a prescriptive, pricing-focused claim: build a cushion into a single commitment; it doesn't depend on ever learning the realized margin. Lex-0337 (Klein's premortem, via Mitchell-Russo-Pennington 1989 and Kahneman 2011) is a prospective technique: imagine failure before acting in a single planning session, explicitly bounded by its own critical-questions to failure modes the team can already imagine. Lex-0383 (survivorship bias, Brown-Goetzmann-Ibbotson-Ross 1992) is a sampling-frame error across a population of cases; the defect is in how the sample was truncated, not in what a single case's success or failure reveals. Lex-0706 (Taleb's black swan) is defined by outlier, extreme-impact, and retrospective narrativization; it doesn't require the failure to be rare or high-impact, just informative in a way success structurally cannot be. Lex-0698 (Schultz-Dayan-Montague, reward-prediction-error) and lex-egkjk (Diamond, shifting-baseline/creeping-normalcy) are adjacent-mechanism candidates: lex-wgd7u is the same asymmetric-learning-from-violated-expectation shape at the individual-neural-signal level rather than the field-historical level; lex-egkjk explains why continuous, slow degradation goes unnoticed via baseline-updating, a different mechanism from Petroski's claim that even a static, unchanging, never-degrading structure is uninformative about its own margin merely by virtue of not yet having failed. None of the six make Petroski's specific claim that success and failure are asymmetrically informative about a single design's actual safety margin, and that this asymmetry produces the field-wide historical pattern of daring design after success followed by margin-tightening after failure."
canonical-instances:
  - "The Challenger disaster (Petroski's own 1991 Afterword case): NASA managers weighed 'a perfect string of successful launchings and landings' against engineers' specific, correct doubts about O-ring cold-weather performance, and the success record won the argument — until the actual failure occurred, and only then were the engineers' doubts credited. The successful-launch streak was not merely unhelpful; it was actively used as counter-evidence to a correct warning."
  - "The Tacoma Narrows Bridge (1940): its collapse in a 42-mph crosswind 'disproved the hypothesis that the suspension span could carry morning traffic' in that wind — a single decisive disproof. Contemporary and prior successful slender suspension bridges (the George Washington Bridge, the Bronx-Whitestone Bridge) provided no equivalent information about how close each was to the same aerodynamic-instability limit; only the Tacoma Narrows failure supplied that number, which von Kármán then used to show the bridge should have exhibited the phenomenon 'more dramatically than any bridge extant.'"
  - "Robert Stephenson's Britannia tubular bridge vs. William Fairbairn's diagnosis: Stephenson viewed his own tubular bridge as a potential 'failure' precisely because it succeeded without needing suspension cables, seemingly proving no more efficient design was possible; Fairbairn later blamed the success of the Britannia Bridge for a subsequent generation of 'weak bridges' built after 1850 'perhaps overconfidently, in the wake of the Britannia's success' — a direct historical instance of success lowering the field's margins."
  - "The 19th-century factor-of-safety cycle (Petroski, 'Safety in Numbers'): 'when structural failures occur, a larger factor of safety is used in subsequent structures of a similar kind. Conversely, when groups of structures become very familiar and do not suffer unexplained failures... a consensus develops among designers and code writers that the factor of safety for similar designs should in the future be lowered' — the cyclic raising-after-failure, lowering-after-success pattern stated as an explicit engineering-community dynamic, not a single decision-maker's bias."
  - "The Golden Gate Bridge's 1987 fiftieth-anniversary overcrowding: a quarter-million pedestrians loaded the bridge to a greater extent than in fifty years of traffic, hanger cables went slack, and the deck deflected roughly ten feet — an inadvertent, unplanned proof-test of a design 'built to the same state of the art that gave us the Tacoma Narrows Bridge.' Petroski's point: the bridge's fifty years of successful service had told no one how close this margin actually was until the crowd accidentally tested it."
  - "operationally distinct from lex-kyc5a (Graham margin-of-safety): Graham prescribes pricing a cushion into a single commitment so that being wrong about the future still leaves you whole, independent of whether you ever learn your realized margin. This atom describes why you CANNOT read your realized margin off a success record in the first place — Petroski explains the epistemic gap that makes Graham's prescriptive cushion necessary rather than optional."
  - "operationally distinct from lex-eb3wf (Klein premortem): premortem is a prospective, single-session technique — imagine failure in advance to surface unvoiced risks the team can already conceive of. This atom is a retrospective, historical claim about how an entire field's actual knowledge of its safety margins is generated after the fact by real failures, which by construction includes failure modes no one had imagined in advance."
  - "operationally distinct from lex-tfpzb (survivorship bias): survivorship bias is a sampling-frame defect across a POPULATION of cases (the eliminated ones are missing from the sample). This atom's asymmetry holds for a SINGLE case with no missing population at all — one bridge, examined alone, still tells you nothing about its own margin by virtue of having not yet failed."
critical-questions:
  - "are you crediting a track record (N years without incident, N successful launches, N deployments with no outage) as evidence that the margin is adequate? Petroski's claim says this is a category error — the track record shows only that the margin has not yet been exceeded, which is compatible with the margin being razor-thin or vast. What would you expect to observe differently, right now, if the true margin were much thinner than you assume?"
  - "where are the dismissed doubts, nagging incidents, and near-misses in this system's history? Per the Challenger case, these — not the count of successes — are the closest available signal to the information an actual failure would provide. Has anyone with specific, technical doubts been overruled by an appeal to the general success record?"
  - "has this design, policy, or practice had its margins quietly loosened since the last failure in its category, on the strength of an unbroken run of successes? Petroski's cyclic claim predicts margins erode specifically BECAUSE of sustained success, not despite it — the erosion is often not conscious over-confidence but a gradual community consensus that 'we know this now.'"
  - "if a failure occurred here, would it actually disprove a specific, nameable assumption (a load limit, a wind speed, a use pattern), or is the system too underspecified for a failure to be diagnostic? Petroski's asymmetry is sharpest when the design is a clear hypothesis; vague or unfalsifiable designs get less benefit from either a success or a failure."
  - "is this a case where you can substitute a rigorous independent test (a proof-test, a wind-tunnel model, a stress test, a red-team exercise) for the information an actual failure would give you, without waiting for the real thing to fail? Petroski notes proof-testing (e.g., the rope hoist's factor-of-safety proof-test) as a deliberate way to manufacture some of failure's informativeness without accepting failure's cost — but also that a structure 'cannot be proof-tested to its full expected capacity because that alone might destroy the rope,' so proof-testing has its own limits."
status: active
