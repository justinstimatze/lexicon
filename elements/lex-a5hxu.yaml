id: lex-a5hxu
name: sacred-king-must-die-before-weakening
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When power is invested in a figure whose decline would discredit the role, the sacred king must die before weakening — succession before degradation. Frazer's pattern: the role's sacredness requires perpetual vigor; the carrier's mortality is managed by ritual replacement."
related: [lex-uz7g4, lex-33w6z, lex-dzqje, lex-5yufs, lex-fmgeg, lex-6f5xs, lex-68gd3]
scaffolds-from: [lex-5yufs, lex-33w6z, lex-dzqje, lex-6f5xs, lex-fmgeg]
evokes: [frazer-aricia-priest, the-divine-must-be-killed, ritual-regicide, transferring-divinity-via-mortality, planck-principle, the-old-must-die-for-the-new
]
lineage:
  - source: primary
    text: frazer-1922-golden-bough-abridged
    citation: "Sir James George Frazer, *The Golden Bough: A Study in Magic and Religion* (1-volume abridgement 1922; Project Gutenberg #3623;). The book's central thesis, developed from Ch.I (the Aricia priest-of-Diana who could only be succeeded by his ritual murderer) through Chs.VI-XXVIII (worldwide instances). The sacred-king must die — either at a fixed term (preventing decline) or upon any sign of weakening (preventing the divinity's degradation). The pattern: leadership is divine-substance; divine-substance degrades with the leader's body; the substance must be transferred intact via ritual-mortality. Frazer documents the pattern across Khazars, Bunyoro mock-kings, Babylonian Sacaea, African priest-kings, Roman Aricia, Ancient Egypt sed-festival regicide, and many others."
    quote: "[Frazer 1922 abridged opening + Ch. on royal succession, lines 360-385:] 'A striking instance of a limited monarchy of this sort is furnished by the powerful mediaeval kingdom of the Khazars in Southern Russia, where the kings were liable to be put to death either on the expiry of a set term or whenever some public calamity, such as drought, dearth, or defeat in war, seemed to indicate a failure of their natural powers... Among them the most notable perhaps is the custom formerly observed in Bunyoro of choosing every year from a particular clan a mock king, who was supposed to incarnate the late king, cohabited with his widows at his temple-tomb, and after reigning for a week was strangled. The custom presents a close parallel to the ancient Babylonian festival of the Sacaea, at which a mock king was dressed in the royal robes, allowed to enjoy the real king\\'s concubines, and after reigning for five days was stripped, scourged, and put to death... Other recently discovered parallels to the priestly kings of Aricia are African priests and kings who used to be put to death at the end of seven or of two years, after being liable in the interval to be attacked and killed by a strong man, who thereupon succeeded to the priesthood or the kingdom.' [The transferable claim: when leadership-authority is conceived as divine-substance vulnerable to degradation, the institutionalized solution is ritual mortality at fixed term or first-weakening, transferring the substance to a successor in maximally-intact form.]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v45
    citation: "Cross-domain attestation: Planck's Principle (Max Planck 1948 *Scientific Autobiography*: 'A new scientific truth does not triumph by convincing its opponents and making them see the light, but rather because its opponents eventually die'; Azoulay-Fons-Krieger-Lavetti 2019 *American Economic Review* empirical confirmation that productivity in scientific fields shifts after star-researcher death); modern term-limits (US presidential 22nd Amendment 1951; Mexican single-term presidency; Brazilian original 1988 constitution) — institutionalized regicide replacing ritual-mortality with calendrical-mortality of the office, not the person; CEO-succession when boards 'kill' founders (Steve Jobs's 1985 ouster; Travis Kalanick at Uber 2017) — corporate-ritual regicide; Apprentice-must-defeat-master in martial-arts traditions (the senior must lose to the junior to legitimate the transition); software-paradigm successions (the old framework must be ABANDONED — not just supplemented — for the new framework to consolidate; Kuhn 1962 *Structure of Scientific Revolutions* generalizes); generational-religious-succession (the founder of a sect must die for the institutional-form to consolidate; Weber on routinization-of-charisma). Multi-substrate attestation across anthropology, modern politics, business, martial-arts, philosophy-of-science, and religious-history."
    quote: "[Cross-domain consistency check, 2026-05-24: 7 instantiations across Frazer's anthropological catalog (Khazars + Bunyoro + Sacaea + Aricia + African + Egyptian sed), Planck's-principle in science (Azoulay et al. 2019 empirical), modern term-limits, CEO-succession, martial-arts apprentice-master, Kuhn paradigm-shifts, and Weber routinization-of-charisma. All exhibit the same structural shape: an authority/divinity/legitimacy embodied in a particular figure that requires that figure's removal (death, retirement, ouster) for legitimacy to transfer. The pattern is system-topological. Distinct from lex-fmgeg compensation-outlives-its-cause: lex-fmgeg is about adaptations persisting past context; lex-a5hxu is about authorized-mortality as the planned-solution to such persistence at the institutional-leadership level. lex-a5hxu can be read as institutionalized-prevention of lex-fmgeg at the leadership-position level.]"
canonical-instances:
  - "the Aricia priest canonical case (Frazer 1922 abridged opening): the priest of Diana at Aricia held office by killing his predecessor in single combat and held it until killed in turn. The position required the holder's mortality as a precondition of authority — the priest who tried to outlast the killing-by-successor would have held a degraded version of the office. Frazer's central image; the book is an extended commentary on why this pattern recurs globally"
  - "the Planck-principle canonical case (Planck 1948 *Scientific Autobiography*; Azoulay-Fons-Krieger-Lavetti 2019 *American Economic Review*): scientific paradigms shift not by convincing opponents but by opponents' death. Azoulay et al.'s empirical demonstration: productivity in subfields increases after star-researcher death; entry of new ideas accelerates; citation patterns shift. The institutionalized-position (the senior researcher's authority, grant-allocation power, journal-editorial control) requires the holder's mortality for paradigm-transfer. Modern academic-economy as Frazerian-regicide at the senior-faculty level"
  - "the CEO-ouster canonical case (Jobs 1985 Apple board ouster + Kalanick 2017 Uber board ouster + countless others): the founder's authority becomes the obstacle to the company's next-phase development. The board enacts ritual-regicide (forced resignation; the kill is symbolic-not-literal). Modern descendant of Frazer's pattern; the founder's continued reign would block the institutional-form's evolution. Note: Jobs's eventual return after Apple's near-death is the rare counter-instance — the killed-king returned, restored, and produced Apple's golden age. The exception illuminates the rule"
  - "the term-limits canonical case (US 22nd Amendment 1951 + Mexican single-term + Brazilian 1988 constitution): institutionalized regicide replacing ritual-mortality with calendrical-mortality of the office, not the person. The president's authority is term-limited; the office-as-divine-substance requires the holder's institutional-death (vacating the office) at fixed term. Transferable: any position with fixed-term creates an analog of Frazerian regicide at lower violence-cost"
  - "the apprentice-defeats-master canonical case (martial-arts traditions; cf. Yagyū Munenori 1632 *Heihō kaden sho* + modern dojo lineage): the master who has reached the apex of skill must, at some point, lose to a worthy apprentice. The loss legitimates the transition. The master who NEVER loses prevents lineage-transfer; the master who loses too easily isn't a proper transition-marker. The structural-event is a Frazerian regicide at the lineage-authority level"
  - "the Kuhn paradigm-shift canonical case (Kuhn 1962 *The Structure of Scientific Revolutions*): a scientific paradigm doesn't die when it accumulates anomalies; it dies when the practitioners who carry it die. The new paradigm doesn't 'win' the argument — it occupies the institutional positions vacated by the old. Frazerian-regicide as the meta-mechanism of paradigm-shift; Kuhn's framework predicts what Planck observed and what Azoulay et al. measured"
  - "the Weberian routinization-of-charisma canonical case (Weber 1922 *Wirtschaft und Gesellschaft* §3 on charisma): the charismatic founder's authority depends on his particular person. The institutional-form he creates requires his SUCCESSOR to NOT have charisma but to have routinized-authority. Founder's death is the precondition; if he persists, the routinization cannot complete. Religious sects (Jesus → Paul; Muhammad → caliphate; Marx → Lenin) all exhibit the pattern at the institutional-formation level"
  - "operationally distinct from lex-33w6z sacrifice-as-transformation: lex-33w6z is the general move (give up X to gain Y; cost IS mechanism). lex-a5hxu is a specific institutional-pattern (the leader's authority requires the leader's mortality as transition-mechanism). Sacrifice can co-fire in lex-a5hxu (the leader's ritual death IS a sacrifice transforming the institution), but lex-a5hxu names the specific shape: divine-authority + ritual-mortality + successor-receives-authority-intact"
  - "operationally distinct from lex-fmgeg compensation-outlives-its-cause: lex-fmgeg is the failure-pattern of adaptations persisting past context. lex-a5hxu is the institutional-DESIGN that PREVENTS lex-fmgeg at the leadership level by mandating mortality. The Frazerian-regicide is an evolved cultural-response to the lex-fmgeg problem at the most-consequential institutional scale. Cross-fire: term-limits + mandatory-retirement + age-thresholds for senior positions are all institutionalized lex-a5hxu designed to prevent institutional lex-fmgeg"
  - "operationally distinct from lex-5yufs form-persists-when-content-dissolves: lex-5yufs is the temporal-hollowing pattern (form outlives content). lex-a5hxu is a specific institutional-pattern designed to prevent form-persistence at the leadership level (the form-of-leader is recycled via mortality; the new content can fill the renewed form). lex-a5hxu is one prophylactic against lex-5yufs at the institutional scale"
  - "operationally adjacent to lex-6f5xs static-vs-dynamic-quality-tension (Pirsig MOQ): the static-pattern (institutional-leadership) requires periodic dynamic-renewal (succession-via-mortality). Frazerian-regicide is the explicit institutional-solution to the static-dynamic tension at the leadership level — neither pure-static (eternal-leader; stagnation) nor pure-dynamic (constant chaos) but engineered-periodic-renewal. lex-a5hxu is the institutional case of lex-6f5xs's general framework"
  - "operationally adjacent to lex-dzqje licensed-transgression-within-trusted-frame: the ritual-regicide is licensed-transgression — the murder of the king is normally the most-forbidden act, but within the ritual-frame it's not just permitted but required. lex-dzqje supplies the institutional-licensing; lex-a5hxu specifies the murder-as-transition-mechanism"
critical-questions:
  - "the literal-vs-figurative-mortality discrimination: is the regicide actually-mortal or institutionally-mortal (term-limit, forced retirement, ouster)? Frazer's original cases are literal; modern descendants are institutional. The pattern preserves the structural-claim (the SAME person cannot continuously hold the position) but reduces violence-cost. Practitioner-question: in this institution, what's the figurative-mortality mechanism for the senior position?"
  - "the divinity-substance requirement: does the position actually have the divine-substance-degrades-with-bearer character that the pattern requires? If the position is more like routine-management than charismatic-leadership, Frazerian regicide may be over-engineering. Practitioner-discipline: before designing mandatory-succession, verify the position's authority actually has the substance-vulnerability character that requires it"
  - "the timing-of-mortality calibration: at fixed-term, on-weakening, or by-challenger? Frazer documents all three variants. Fixed-term has the advantage of predictability; on-weakening has the advantage of responsiveness; by-challenger has the advantage of merit-selection. Practitioner-question: which timing fits THIS institution? Term limits + impeachment + ouster-via-board are all variants the practitioner can design between"
  - "the killed-king-returns counter-instance: Jobs's return to Apple, Putin's return to presidency via prime-ministership, Steve Bannon's return to influence — sometimes the killed-king returns and produces important next-phase work. The pattern isn't absolute. Practitioner-question: under what conditions is the resurrection-of-the-killed-king productive vs regressive? Often the returner has been transformed by the exile; the same-old-king returning is regressive, the renewed-king is productive"
  - "the violence-cost vs change-rate tradeoff: the Frazerian-pattern at its literal-mortal-extreme produces high stability but pays in lives. Term-limits produce moderate stability at low cost but slower change. Some institutions tolerate more change-rate than others. Practitioner-question: what's the appropriate change-rate for THIS institution, and what's the minimum-violence mechanism for that rate?"
  - "the lex-y6xy9 gumption interaction: a leader past their gumption-peak (low-engagement, depleted-reservoir) is the pattern's empirical-trigger. Senior-leaders who've lost gumption produce institutional-stagnation; the regicide-pattern responds. Practitioner-discipline: the diagnostic for needing-regicide is gumption-depletion of the incumbent, not always failure-of-output (gumption can degrade before output does; the institutional-pattern correctly anticipates the lag)"
status: active
