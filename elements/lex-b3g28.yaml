id: lex-b3g28
name: turn-back-before-the-conditions-needed-to-turn-back-vanish
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Kershner's rule for a student pilot flying cross-country into deteriorating weather: 'The best maneuver when in doubt about the weather ahead is a 180° turn while you still have visual references.' The instruction is not simply 'turn back when the weather looks bad.' It specifies WHEN to make that call: while you still have visual references -- because executing a 180° turn safely itself requires seeing well enough to fly it. Pressing on and waiting for confirmation that conditions are truly unsafe risks losing the very thing the retreat maneuver depends on, so that by the time the danger is undeniable, the safe way out is already gone. Kershner names the failure mode of waiting too long directly: trying to keep flying visually as ceiling and visibility drop toward minimums is 'an exotic form of Russian roulette' known as 'scud running.' The transferable mechanism: some retreats consume a resource that the advancing threat is simultaneously consuming too -- visibility for a pilot's turn, daylight and energy for a climber's descent, market liquidity for an investor's exit, a counterparty's trust for someone trying to walk away from a bad deal, remaining strength for a swimmer caught in a current. Sometimes the resource that lets you retreat is the same one the danger is eating into. Waiting for the case for retreat to become overwhelming then means gambling with a resource that could be nearly used up by the time you finally act. Decide against how much of that resource remains right now, and act on it while a comfortable margin is still there."
related: [lex-aytnt, lex-t483f]
scaffolds-from: [lex-aytnt]
evokes: [180-degree-turn, scud-running, VFR-minimums, visual-references, turnaround-time, cut-losses-while-you-still-can, the-exit-degrades-with-the-threat]
lineage:
  - source: primary
    text: kershner-2010-student-pilots-flight-manual
    citation: "William K. Kershner, The Student Pilot's Flight Manual: From First Flight to Pilot Certificate, 10th ed., ed. William C. Kershner (Aviation Supplies & Academics, 2010), Chapter 25, 'Flying the Cross-Country,' section 'Weather.'"
    quote: "'The best maneuver when in doubt about the weather ahead is a 180° turn while you still have visual references. [...] Trying to remain VFR while the ceiling and visibility are getting below VFR minimums is an exotic form of Russian roulette and is called \"scud running.\"'"
canonical-instances:
  - "Mountaineering 'turnaround time': climbers set a fixed clock time to begin descending regardless of how close they are to the summit, because the daylight and energy needed for a safe descent are consumed by the same climb that's consuming the time toward the summit -- deciding to turn back only once conditions look clearly dangerous routinely means deciding after dark, with no energy left to get down."
  - "An investor holding a large position in a thinly traded asset sells into the first sign of trouble rather than waiting for confirmation the trend is real, because the same selling pressure that would confirm the trend is also draining the market's liquidity -- the position that could be exited calmly at the first warning may only be exitable at a ruinous discount, or not at all, once the danger is obvious to everyone else too."
  - "Someone trying to leave a business partnership or relationship that's souring negotiates the exit while goodwill and trust still exist, rather than staying until the conflict is undeniable -- the same deterioration that makes leaving feel urgent is also destroying the counterparty's willingness to let the exit be amicable."
  - "Operationally distinct from lex-t483f quitting-a-failing-attempt-early-caps-the-damage-persisting-makes-it-total: lex-t483f's signal to stop is visible mounting COST with no progress toward the goal -- the Eagles quit because their feathers are visibly getting worse for no gain, a straightforward stop-the-bleeding read on accumulating damage. This atom's signal has nothing to do with whether cost is mounting; it's that the SPECIFIC RESOURCE needed to execute the retreat itself is being consumed by the same conditions creating the danger, so the retreat has to be decided before that resource runs out, independent of how much has been spent so far. A situation can fit this atom with costs still low and no mounting-damage signal yet visible -- the pilot in clear-but-thinning haze isn't yet paying any visible cost -- and a situation can fit lex-t483f (rising, visible cost, no progress) without the exit route itself degrading at all."
critical-questions:
  - "Is the retreat resource actually shared with the threat, or is it independent? The whole force of the rule depends on the SAME conditions eroding both the danger and the escape route. A resource that's genuinely independent of the threat (a lawyer you can call any time, an ATM that stays open) doesn't need this early-decision discipline -- ordinary wait-and-see is fine when the exit isn't itself decaying."
  - "How is 'still have visual references' (or its analog) actually measured in the moment, rather than assumed? A pilot who waits for visibility to feel bad enough may already be past the point Kershner means; the rule requires setting a concrete, checkable threshold in advance (a specific ceiling, a specific time, a specific price) rather than trusting an in-the-moment feeling of 'not yet.'"
  - "Does turning back early enough carry its own cost worth weighing -- fuel burned, a summit missed, a position sold at a small loss that would have recovered? The rule argues the asymmetry usually favors early retreat because the downside of waiting too long is often total (no safe way out at all), but a pattern of habitually bailing at the first sign of trouble has its own cost and isn't automatically justified by this atom."
status: active
