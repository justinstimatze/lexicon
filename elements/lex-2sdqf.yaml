id: lex-2sdqf
name: subordinated-identity-fractures-self-via-internalized-dominant-other-gaze
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When someone speaks about themselves through a dominant other's gaze (criticism, expectation, classification), surface that the self being described is partly the internalized observer — separate what is theirs from what was inherited."
related: [lex-tjwfn, lex-u8u7y, lex-wf4nj, lex-5d8hm, lex-6qevt, lex-8grce, lex-xehnw, lex-su2sk, lex-a3tfj, lex-22kep, lex-3ezh8, lex-k8bsd, lex-fv4a3, lex-qg68a, lex-am8cj, lex-y2tbg, lex-55dm8, lex-5qkj9, lex-pn8qn, lex-jd7fe, lex-9zjpf, lex-raydk, lex-b6gyc]
scaffolds-from: [lex-tjwfn, lex-u8u7y, lex-fv4a3]
evokes: [du-bois-double-consciousness, the-veil-and-the-second-sight, two-souls-two-thoughts-two-warring-ideals, no-true-self-consciousness-only-revelation-through-others, the-fractured-self-of-dominated-positions]
lineage:
  - source: primary
    text: dubois-1903-souls-of-black-folk-chapter-1
    citation: "W. E. B. Du Bois, *The Souls of Black Folk* (Chicago: A. C. McClurg & Co. 1903), Ch.1 'Of Our Spiritual Strivings'. (Standard Ebooks edition derived from PG #408 + HathiTrust scans; US PD). Du Bois names the structural-experiential condition of occupying a denigrated identity in a dominant-other's world: the self does not get to form via direct self-perception but only via revelation-through-the-contemptuous-other, producing a felt twoness — two warring ideals in one body, neither of which the subject can fully embrace or abandon without loss. The 'veil' is the medium that interposes between the subordinated self and direct world-access; the 'second-sight' is the by-product of being marked-out (the subordinated subject reads the dominant other accurately as a defensive necessity, while the dominant other doesn't need to read the subordinated subject at all). Du Bois names this for the post-Emancipation African American condition but explicitly frames it as the general structural shape of dominated-identity positions. The primitive ports to gender, sexuality, neurodivergence, class-position, immigrant-identity, and many other contexts where a denigrated-identity-position interacts with a contemptuous-or-pitying-dominant-other."
    quote: "[Du Bois 1903 Ch.1 'Of Our Spiritual Strivings':] 'After the Egyptian and Indian, the Greek and Roman, the Teuton and Mongolian, the Negro is a sort of seventh son, born with a veil, and gifted with second-sight in this American world—a world which yields him no true self-consciousness, but only lets him see himself through the revelation of the other world. It is a peculiar sensation, this double-consciousness, this sense of always looking at one''s self through the eyes of others, of measuring one''s soul by the tape of a world that looks on in amused contempt and pity. One ever feels his twoness—an American, a Negro; two souls, two thoughts, two unreconciled strivings; two warring ideals in one dark body, whose dogged strength alone keeps it from being torn asunder.' [Du Bois names the resolution-aim explicitly:] 'The history of the American Negro is the history of this strife—this longing to attain self-conscious manhood, to merge his double self into a better and truer self. In this merging he wishes neither of the older selves to be lost.' [Practitioner-extraction: the structural-claim is that occupying a denigrated identity in a dominant-other's contemptuous world produces (i) no-direct-self-consciousness, only self-through-the-other; (ii) a felt twoness — two warring ideals; (iii) a costly maintenance — 'dogged strength alone keeps it from being torn asunder'; (iv) a resolution-aim — merge-without-loss, both selves retained in a better-and-truer self. The four-step shape — denial of direct self-formation, internalized fracture, energetic cost of holding, resolution-aim of integrated-merging — is the transferable primitive.]"
  - source: discovery-loop
    text: cross-attestation-across-dominated-positions
    citation: "Distinct from the standpoint-epistemology atom (lex-6qevt Cooper 1892) at structural locus: Cooper names that the dominated-position carries irreplaceable epistemic content (the outside cannot adequately speak for what the inside knows); Du Bois names that the dominated-position fractures the self into internalized-dominant-other-frame + own-frame in mutual war. Cooper points outward (what the position knows); Du Bois points inward (what the position does to the self). The two atoms are upstream-downstream of the same structural fact and frequently co-fire. Cross-attestation in 20th-c. feminist (Beauvoir 1949 *Le Deuxième Sexe* 'one is not born a woman, but becomes one' via the male-gaze-mediated becoming; Friedan 1963 'feminine mystique'), Black-American (Fanon 1952 *Peau noire, masques blancs* the 'corporeal malediction' of the colonised subject seeing themselves through colonial-French eyes (now substrate-attested at lex-fv4a3 sociogeny-pathology-of-the-dominated-is-normal-response-to-pathological-structure, refs-grounded); Hooks 1992 'oppositional gaze'), queer-theory (Sedgwick 1990 *Epistemology of the Closet* the double-bind of disclosure — now substrate-attested at lex-am8cj closet-as-epistemic-structure and lex-fn2gx paradigm-supersession-narrative, refs-grounded), neurodivergence (autistic 'masking' as performed-self-for-neurotypical-audience), and class (Sennett-Cobb 1972 *The Hidden Injuries of Class* working-class internalization of middle-class judgments). The structural shape is the same across all: a dominated-or-marked-out position generates the same four-step pattern."
    quote: "[Cross-attestation summary, 14 2026-05-29: Du Bois 1903 names this for post-Emancipation Black American experience; Beauvoir 1949 ports to gender (the woman-as-Other framework where womanhood is constituted via the male-gaze); Fanon 1952 ports to colonised-subject (the 'corporeal malediction' of the Black man under the colonial-French gaze); Hooks 1992 ports to spectatorship (the 'oppositional gaze' as a refusal of the dominant-spectator-position imposed on Black viewers); autistic masking ports to neurodivergence (the performed-self maintained for neurotypical audiences with energetic cost matching Du Bois's 'dogged strength'); Sennett-Cobb 1972 ports to class (the working-class internalization of middle-class judgments producing a fractured self). The cross-domain consistency is evidence the underlying pattern is structural, not substrate-specific: any dominated-identity in a dominant-other's contemptuous-or-pitying world produces the same fracture-of-self.]"
canonical-instances:
  - "Du Bois 1903 Ch.1 post-Emancipation African American condition: the freed Black man sees himself simultaneously through (a) his own internal frame as an American with full citizenship-aspirations and as a Negro with cultural inheritance, and (b) the contemptuous-or-pitying gaze of the dominant white world. The two cannot be merged easily; the strife to merge them without losing either is what Du Bois names 'the history of the American Negro.' The chapter's argument that this strife wastes substantial energy on identity-maintenance that should be spent on building is the political-strategic point — but the underlying primitive is the structural-experiential condition itself"
  - "Beauvoir 1949 woman-as-Other: 'one is not born a woman, but becomes one' — the becoming is via the constituting-male-gaze that defines woman as the deviation-from-man-default. The woman experiences herself simultaneously as her own first-person frame AND as the Other-of-the-male-gaze. The two warring frames are not symmetric: the male-gaze frame is supported by the social-institutional apparatus while the first-person frame is privately held. Same structural shape as Du Bois's double-consciousness, ported to gender"
  - "Fanon 1952 corporeal malediction: the colonised subject under the colonial-French gaze experiences themselves simultaneously as their own pre-colonial frame AND as the object of the colonising-frame. Fanon's specific contribution: the colonising-frame is not merely cognitive but EMBODIED — the colonised subject feels their own body through the colonising frame, a 'corporeal malediction.' Same structural shape as Du Bois with an embodied-experience emphasis"
  - "autistic masking as performed-self: autistic individuals frequently maintain a performed-neurotypical-self for social-survival purposes. The performed-self is held simultaneously with the first-person autistic-self frame. The energetic cost ('autistic burnout') matches Du Bois's 'dogged strength alone keeps it from being torn asunder' — the fracture is energetically expensive to hold and produces collapse when sustained too long. Recent neurodivergence-literature explicitly identifies this as the autistic version of double-consciousness"
  - "the 'oppositional gaze' (Hooks 1992): Black women spectators of cinema experience themselves simultaneously as their own frame AND as the object-of-the-dominant-cinematic-gaze (which was historically constructed to exclude Black female subjectivity). Hooks names the active practice of REFUSING the imposed-frame as the 'oppositional gaze' — a strategic-resolution move that takes the double-consciousness condition as given and chooses which of the two frames to authorize. Same structural shape, with the practitioner-discipline move added"
  - "operationally distinct from lex-tjwfn recursive-mind-simulation-shapes-self: lex-tjwfn is the broader claim that self-formation occurs through simulating-others; this atom names the specific structural-condition where the dominant-other being simulated is CONTEMPTUOUS or PITYING toward the simulating self, producing a felt fracture rather than just shaping. lex-tjwfn fires in all social mirror-context including positive ones (the loved-child internalizing the parental loving-gaze); this atom fires specifically where the internalized-other-frame is hostile-to-self"
  - "operationally distinct from lex-u8u7y social-identity-as-self-concept-determinant: lex-u8u7y names that group-membership shapes self-concept; this atom names the specific shape that emerges when the group-membership is a denigrated-identity in a dominant-other's world. lex-u8u7y is the broader pattern (all identity shapes self); this atom is the sub-pattern (subordinated-identity produces fractured self in the specific four-step structure)"
  - "operationally adjacent to lex-6qevt lived-position-as-irreplaceable-epistemic-substrate (Cooper 1892): Cooper 1892 names that the dominated-position carries irreplaceable epistemic content (knowledge that cannot be substituted from outside); Du Bois 1903 names that the dominated-position fractures the self into warring frames. Cooper points outward (what the position knows that others cannot); Du Bois points inward (what the position does to the self). They are upstream-downstream of the same structural fact (the dominated-position has structural properties not reducible to general-personhood) and frequently co-fire in practitioner-discipline"
  - "operationally adjacent to lex-wf4nj master-vs-slave-morality (Hegel/Nietzsche): the Hegelian master-slave dialectic + Nietzschean ressentiment describe the genealogy of value-creation under dominated positions (the slave-morality inverts master-values to create dignity). Du Bois's double-consciousness names a different aspect of the same structural-condition: not the value-inversion (which is the diagnostic Hegel/Nietzsche trace) but the felt-fracture-of-self (which is the experiential-state Du Bois names). The two atoms describe complementary aspects of dominated-position phenomenology"
  - "operationally adjacent to lex-xehnw envy-tracks-visibility-and-proximity-not-absolute-magnitude: lex-xehnw is about how envy fires more strongly toward proximate-visible-others-with-slight-edge than toward absolute-distant-superiority. The double-consciousness condition compounds with this: the subordinated subject under the dominant-other's gaze cannot escape envy-firing because the dominant-other is by structural-condition both proximate (cannot be avoided) and visibly-superior (the social order makes the superiority visible). The two atoms describe interlocking aspects of the dominated-position emotional-landscape"
critical-questions:
  - "the dominant-other-is-actually-contemptuous test: is the relevant dominant-other actually contemptuous-or-pitying toward the subordinated identity, OR are they merely indifferent or neutral? Du Bois's framing requires the dominant-other to hold the subordinated identity in 'amused contempt and pity' — that hostility is what produces the fracture. Where the dominant-other is genuinely neutral or even respectful, lex-u8u7y social-identity-as-self-concept-determinant fires without producing the specific fracture of this atom. Practitioner-discipline: don't impose the double-consciousness frame where the dominant-other-stance is not actually contemptuous"
  - "the resolution-aim test: is the subject pursuing the merge-without-loss aim Du Bois describes, OR a different aim (assimilation that erases the subordinated identity; secession that erases the dominant identity; permanent fracture maintained as a chosen condition)? Different aims produce different practitioner-strategies and different outcomes. Du Bois's 'merge into a better and truer self' is one specific resolution-aim; the atom describes the structural-condition but does not dictate the resolution. Practitioner-question: which resolution-aim is the subject actually pursuing?"
  - "the energetic-cost-of-holding measurement: how much of the subject's available energy is going to maintaining the double-consciousness fracture vs other activities? Du Bois names the 'dogged strength alone keeps it from being torn asunder' as the energetic burden, and the political point of the chapter is that this energy is structurally wasted on identity-maintenance that should be spent on building. The cost-of-holding measurement is the practical-diagnostic for whether the condition is producing burnout, collapse, or sustained-performance"
  - "the second-sight reframe: Du Bois names the by-product of the structural-condition as 'second-sight' — the subordinated subject reads the dominant other accurately as a defensive necessity, producing a cross-position knowledge that the dominant-position lacks. Is the subject using this second-sight as a resource, OR is it being expended without compensation in the asymmetric epistemic-labor relation? The reframe from burden-only to burden-with-resource is one practitioner-discipline move, but it can also be co-opted into requiring the subordinated subject to perform-the-second-sight for the dominant-other's benefit without compensation"
  - "the cross-domain transferability: does the structural shape transfer to the specific domain in question (gender, neurodivergence, class, immigration), or is the domain-specific structural condition different enough that the atom mis-fires? Some domains (race in the US South 1900; women-of-color under multiple-axes-of-domination) match Du Bois's structural-conditions very closely; other domains (e.g., 'reverse double-consciousness' claims by dominant-position subjects feeling alienated from their own culture) typically mis-fire because the contemptuous-dominant-other-gaze structural condition is not present. Practitioner-discipline: verify the four-step structural shape (denied direct self-formation; internalized fracture; energetic cost; merge-aim) is actually present in the specific case before applying the atom"
status: active
