id: lex-t59wh
name: small-decision-groups-have-a-distinct-failure-mode-at-each-size
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When deciding how many advisers or decision-makers should be in the room for an important, sensitive decision, don't treat group size as a simple more-is-better-for-quality-but-worse-for-secrecy tradeoff — check the SPECIFIC failure mode that recurs at each size, because Kautilya names a different structural problem at one, two, and more-than-a-few, and lands on a narrow safe zone in between rather than a monotonic tradeoff curve. He stages a debate: Bharadvaja argues for deliberating totally alone, since 'every adviser has his own adviser, and the latter, in turn, his adviser [and so on]. Thus the secret is divulged somewhere along the line.' Vishalaksha counters that 'never can a single person arrive at the right decision' because full knowledge requires combining what the decision-maker directly knows, what is reported, and what must be inferred — a single mind cannot hold or generate all three. Kautilya rejects solo deliberation for a different, more specific reason than divulgence risk: 'If he consults only one, he may find it difficult to reach a decision on complicated questions; for a single adviser can behave as he pleases without restraint' — a single adviser faces no countervailing check and can steer the decision unopposed. He then names TWO advisers as its own distinct failure mode, not merely 'better than one': 'If there are only two advisers, they may either combine together and overwhelm him or fight and neutralise each other' — a pair either colludes against the principal or deadlocks, and both outcomes defeat the purpose of consulting them at all. Only beyond two does a different check emerge — a coalition of two conspiring against the king becomes harder to sustain without detection as a third or fourth party is added, since not everyone can be bought or aligned at once — but Kautilya caps this benefit sharply: 'with more than four, secrecy is rarely maintained,' and 'if ever three or four councillors all combine against the king... it spells great danger.' The resulting rule is not 'use exactly four for every decision' — 'he may, depending on the nature of the work and the special circumstances of each case, take a decision by himself, consult just one adviser, or even two' — but that whenever a decision-maker chooses a SMALL group size, they should know precisely which structural risk that size choice accepts (a solo adviser unrestrained, a pair that may collude or deadlock, a group past four that leaks) rather than treating 'small enough to be manageable' as a single undifferentiated virtue. Diagnostic move: before finalizing how many people will be in the room for a sensitive decision, name the specific failure mode that group size is exposed to — not just 'is this too many or too few' — and check whether that specific failure mode (unchecked solo control, pairwise collusion or deadlock, leak risk past a small threshold) is actually the one you can least afford in this case."
related: []
evokes: [bharadvaja-deliberate-alone, vishalaksha-single-person-cannot-decide, one-adviser-behaves-unrestrained, two-advisers-collude-or-deadlock, more-than-four-secrecy-rarely-maintained, kautilya-caps-advisers-at-three-or-four]
lineage:
  - source: primary
    text: kautilya-arthashastra-number-of-advisers-debate
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IV 'The Well-organized State,' section 'The Royal Councillors,' 'The Number of Advisers,' {1.15.13-40}."
    quote: "Bharadvaja says: 'A secret [prematurely] divulged is fatal to the well-being of the king and the officials entrusted with the task. Every adviser has his own adviser, and the latter, in turn, his adviser [and so on]. Thus, [the series becomes too long and] the secret is divulged [somewhere along the line]. Therefore, a king shall deliberate by himself [without advisers].' Vishalaksha says: 'Never can a single person arrive at the right decision. The work of government is dependent on [complete] knowledge — that which the king personally knows, that which is reported to him and that which he has to infer.'"
  - source: primary
    text: kautilya-arthashastra-cap-advisers-three-or-four
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part IV, section 'The Number of Advisers,' {1.15.32-41}."
    quote: "'Kautilya disagrees. This method is inherently unstable... A king shall confine his deliberations to [at the most] three or four advisers. If he consults only one, he may find it difficult to reach a decision on complicated questions; for a single adviser can behave as he pleases without restraint. If there are only two advisers, they may either combine together and overwhelm him or fight and neutralise each other. If there are more than two, they [may either form a clique or split into factions and] become difficult [to control]. If ever three or four councillors all combine against the king or become involved in a fight among themselves, it spells great danger... because, with more than four, secrecy is rarely maintained.' '[While, normally, the king should consult three or four advisers,] he may, depending on the nature of the work and the special circumstances of each case, take a decision by himself, consult just one adviser, or even two.'"
canonical-instances:
  - "A startup founder who makes every major decision alone because 'moving fast requires no committee' doesn't realize the actual risk isn't slowness — it's that nothing checks a bad call before it's executed, exactly the 'single adviser can behave as he pleases without restraint' failure Kautilya names for a solo decision-maker, here with the founder as their own unrestrained sole adviser."
  - "A two-person co-founder structure with equal authority either rubber-stamps each other's ideas without real challenge (the collusion failure) or deadlocks on every disagreement with no tiebreaker (the neutralization failure) — both are the SAME structural failure mode Kautilya names for exactly two advisers, and adding one more principal specifically to break ties addresses that particular problem rather than being generically 'more input.'"
critical-questions:
  - "does the specific two-adviser failure (collude or deadlock) actually generalize past Kautilya's monarchy context, where the two advisers have no formal tie-breaking authority over each other or over the king — in a modern board or partnership with defined voting rules, does the same dynamic still apply, or does formal tie-breaking procedure dissolve the failure mode entirely?"
  - "the claim that secrecy 'is rarely maintained' past four people is treated as an empirical fact rather than derived from a stated mechanism — is there a way to verify whether four is actually the right threshold for a given modern context (a smaller circle for a highly sensitive matter, a larger one where the underlying secret is lower-stakes), or is the specific number an artifact of Kautilya's own setting rather than a transferable constant?"
  - "how does a decision-maker know, in advance of an actual decision, which specific failure mode (unrestrained solo control, pairwise collusion, pairwise deadlock, leak past a threshold) is the one most likely to occur for THIS particular decision, rather than applying a single default group size to every case regardless of which risk matters most for it?"
status: active
