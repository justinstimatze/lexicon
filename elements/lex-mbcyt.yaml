id: lex-mbcyt
name: scrupulosity-over-trivial-unintended-infractions-signals-genuine-moral-rigor
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Intense self-doubt over a trivial, unintended infraction functions as a hard-to-fake signal of genuine moral rigor, precisely because someone who was actually lax wouldn't bother scrutinizing themselves this closely over something this small. The scruple isn't proof of wrongdoing. It's proof of the standard the person holds themselves to. In the Jataka's tale of the Kuru righteousness, messengers pass down a chain of increasingly virtuous people, and each refuses to claim the virtue, citing some minute, unintended lapse. The messengers point out what the scruple itself demonstrates: 'You had no wish to kill the crab. What is done without intent is not counted to the score; if you feel a scruple about so small a matter, what real transgression would you ever do?' The person worried they'd failed the standard was, by that very worry, shown to be holding it."
