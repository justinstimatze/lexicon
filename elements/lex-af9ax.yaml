id: lex-af9ax
name: defeasible-presumption
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When invoking a presumption ('innocent until proven guilty', 'expert until disqualified'), name what would BURDEN-SHIFT it. Presumptions are defeasible defaults; without naming the shifters you've made a default into a fixed point."
