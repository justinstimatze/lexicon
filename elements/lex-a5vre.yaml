id: lex-a5vre
name: widen-the-window-to-dissolve-a-work-versus-recreation-dispute
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "At Stanford's AI Lab in 1972, hackers were burning company computer time playing Spacewar for hours at a stretch, on the clock, indistinguishable moment-to-moment from the same people doing paid research. A manager forced to police that line moment-to-moment is stuck: any single hour looks like either goofing off or genius depending on what it produces later, and there's no way to tell from inside the hour. The AI Lab's executive officer, Les Earnest, names the move that gets out of the trap: stop trying to classify the hour, and judge the output over a much longer window instead. He states this as a considered institutional policy, not an excuse: judge people 'not on how much time they waste but on what they accomplish over fairly long periods of time, like a half year to a year.' The mechanism has two parts. First, the work/recreation distinction doesn't get resolved -- it gets made irrelevant, because the question the institution actually cares about (does this person's presence pay off) has an answer that doesn't require settling it. Second, this only works if the window is genuinely long enough for output to accumulate and separate the people who convert their unstructured time into results from the people who don't -- a short window collapses back into the original, unanswerable question of whether this particular hour was 'real' work. The diagnostic move: when you're stuck adjudicating whether some specific stretch of someone's time counted as legitimate effort, check whether the dispute is actually about that stretch at all, or whether it only feels urgent because the evaluation window is too short to just watch what accumulates."
