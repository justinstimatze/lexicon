lineage:
  - source: primary
    text: stolz-antonietti-degraaf-hackett-2025-three-stages-religious-decline
    citation: "Jörg Stolz, Alexander Antonietti, Nan Dirk de Graaf & Conrad Hackett, 'The three stages of religious decline around the world,' Nature Communications (2025), DOI 10.1038/s41467-025-62452-z. Tested against Pew Research Center surveys (111 countries), World Values Survey/European Values Study (58 countries, wave 7), and a 17-country longitudinal subset tracked across at least five WVS/EVS waves."
    quote: "'We propose that secularization follows a consistent sequence: first, participation in public rituals declines; second, importance of religion drops, and third, people shed their formal belonging. We refer to this as the Participation–Importance–Belonging (P-I-B) sequence. This ordering reflects the relative costliness of each behavior: public ritual attendance demands the most time and energy, while mere identity affiliation is least burdensome and thus most persistent. The P-I-B sequence normally does not occur within the lifespan of an individual but rather transpires across extended periods among cohort groups.' [On the mechanism:] 'This transformation is assumed to occur not primarily by individuals abandoning religion during their adult life, but by an intergenerational breakdown of religious socialization... Because of the increasing efficiency of secular goods, parents may still teach their children religiosity—but stop backing it up with religious behavior. This will lead children to drop their religiosity levels.' [On the results:] 'In line with our expectations, we find that countries with high religiosity show cohort differences mainly in participation, countries with intermediate religiosity have differences across all three dimensions, and highly secular countries vary primarily in belonging.'"
canonical-instances:
  - "Senegal shows age gaps (younger cohorts less religious than older ones) in worship-service participation but no similar age gaps in the importance of religion or in belonging/identification — read through the P-I-B model, Senegal sits at the high-religiosity end where only the costliest layer has started to move."
  - "The Netherlands shows age gaps in belonging only, with participation and importance already having declined uniformly across cohorts in an earlier era — the highly-secular end of the sequence, where the cheap identity layer is the last one still generating cohort variation because it's the last one still in the process of eroding."
  - "Portugal shows age gaps across all three dimensions simultaneously — the intermediate-religiosity case, mid-sequence, where participation has been declining for a while, importance is now dropping too, and belonging has only just started to move."
  - "operationally distinct from lex-57wqk costly-false-belief-is-a-harder-to-fake-trust-signal: lex-57wqk is about cost as what makes a signal credible WHILE the system is being actively maintained (a costly display proves commitment to others). This atom is about cost as what determines erosion ORDER once reinforcement is withdrawn — the same variable (cost) explains two different things: why costly signals are trusted when a system is intact, and why costly behaviors are the first casualty when a system is declining."
  - "operationally distinct from lex-u6sw3 high-fidelity-copying-of-causally-opaque-steps-enables-cumulative-cultural-evolution: lex-u6sw3 explains how a tradition PERSISTS with fidelity across generations when the transmission chain is intact. This atom explains what happens when that chain breaks — specifically, that the break shows up first in the behavioral-demonstration layer (parents stop backing belief with costly behavior) before it shows up in belief or identity, which is itself a claim about HOW high-fidelity transmission fails, not just that it can."
critical-questions:
  - "Is the observed within-country cohort variation actually intergenerational (as the model claims) or could cross-sectional survey data be capturing adult-life individual drift instead? The paper's own longitudinal test (17 countries, five-plus WVS/EVS waves) is explicitly flagged as limited by the available time span — the strongest evidence for the model's central causal claim is the weakest-powered test in the paper."
  - "Does the P-I-B order hold outside Christian-majority contexts, or are the noted exceptions (Eastern post-Soviet countries deviating from the pattern; traditionally Muslim countries appearing to follow only its early stages) evidence that the mechanism is culturally contingent rather than a human-universal sequence?"
  - "Is 'relative costliness' actually the causal variable, or could a confound track it closely — e.g., participation is also the layer most exposed to state secular-service substitution (per the CRED-erosion account: biomedicine replacing religious healing, welfare states replacing spiritual reassurance) — such that cost and public-visibility-to-substitution are just correlated, not identical?"
  - "When extrapolating the P-I-B shape to a non-religious domain (civic associations, party identification, workplace loyalty, language death), has the same cost-ordered erosion actually been tested there, or is the extrapolation resting entirely on the structural plausibility of the mechanism rather than independent evidence?"
