evokes: [concentric-trust-zoning-around-a-core-asset, kautilya-the-base-camp, proximity-should-track-trust-not-rank, bound-the-damage-a-low-trust-party-can-do-by-distance]
lineage:
  - source: primary
    text: kautilya-arthashastra-base-camp-concentric-trust-rings
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'The Base Camp,' editorial summary preceding {10.1.1}, citing {10.1.4,6-12}."
    quote: "'From the centre outwards, each succeeding sector was occupied by less important officials and less trustworthy troops... The non-native forces (allied, alien and jungle) and the labour corps were placed in the outermost circle... Traps were laid outside the perimeter where the outcast helpers like dog-handlers and hunters were stationed, equipped with drums (for warning) and fire.'"
canonical-instances:
  - "A company designs its access-control system so that the innermost tier (source code for the core product, the signing keys, the customer database) is reachable only by a small group of long-tenured, individually vetted engineers, a middle tier of internal tools is reachable by the broader engineering staff, and contractors and third-party vendors are granted access only to sandboxed, non-production systems where a compromise causes no direct harm to the core."
  - "A museum places its single most valuable and irreplaceable piece in a vault reachable only by two senior, background-checked curators, displays its high-value but replaceable collection in a monitored gallery accessible to trained staff, and keeps general visitors, food-service contractors, and outside vendors confined to public areas with no proximity to either."
critical-questions:
  - "how does an organization actually measure trust independently of rank or tenure, rather than defaulting to using seniority as a proxy for trustworthiness because it's easier to observe -- does this design require a genuine, separate trust-assessment process that most organizations don't actually have?"
  - "does ring-based access create resentment or a two-tier culture among lower-trust groups who can see, both literally and organizationally, how far they are kept from the center, potentially making them more likely to defect or disengage precisely because of how they've been positioned?"
  - "what happens when a threat originates from inside the innermost, most-trusted ring itself -- does concentric trust zoning create a false sense of security about the core precisely because the design assumes the highest-trust ring is the safest, when insider betrayal at the center is often the most damaging kind exactly because it was least anticipated?"
