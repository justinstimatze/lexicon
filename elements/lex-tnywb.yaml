id: lex-tnywb
name: competitive-equilibrium-theory-assumes-what-only-competition-discovers
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a model, plan, or theory treats costs, preferences, best-available techniques, or 'who is actually best at this' as GIVEN INPUTS to be optimized over, check whether those inputs are actually the OUTPUT of an ongoing discovery process that hasn't run yet — not pre-existing facts waiting to be looked up. Hayek's transferable diagnosis of standard 'perfect competition' theory (The Meaning of Competition, 1946): textbook equilibrium models assume, as starting data, exactly the facts that in real life are only ever revealed BY the process of competition itself — the lowest cost at which something can be produced, what consumers actually want and will pay, who is best positioned to supply it. Hayek's decisive line: 'this knowledge which is assumed to be given to begin with is one of the main points where it is only through the process of competition that the facts will be discovered.' The theory doesn't explain how the economic problem gets solved; it defines away the problem by assuming its solution as a precondition, then studies the resulting static state as if it were the interesting object — when the actually interesting object is the PROCESS. Hayek's positive reframe: 'the solution of the economic problem of society is... always a voyage of exploration into the unknown, an attempt to discover new ways of doing things better than they have been done before.' The counter-move for any plan, model, or evaluation that quietly assumes 'given' cost/preference/capability data: ask whether that data is actually knowable in advance by anyone, or whether it only becomes knowable once some competitive, iterative, or exploratory PROCESS is allowed to run — and if the latter, redesign the plan around running the discovery process rather than around optimizing over data nobody yet has."
related: [lex-58ynk, lex-nfdyv]
evokes: [hayek, individualism-and-economic-order, the-meaning-of-competition, discovery-procedure, perfect-competition-critique, pure-logic-of-choice, voyage-of-exploration-into-the-unknown]
lineage:
  - source: primary
    text: hayek-1946-the-meaning-of-competition
    citation: "Friedrich A. Hayek, 'The Meaning of Competition' (the Stafford Little Lecture, Princeton University, 20 May 1946); reprinted as Chapter V of Individualism and Economic Order (University of Chicago Press, 1948). Hayek argues that the standard 'theory of perfect competition,' by assuming as given data the very facts (lowest production costs, consumer wants and willingness-to-pay, who can supply most cheaply) that in reality are generated only by the ongoing competitive process, has smuggled away the actual explanatory problem. The 'Pure Logic of Choice' apparatus, legitimate for describing a single planning mind's optimization over fully-known data, gets illegitimately extended to a social process involving many minds whose data are NOT given in advance and are only adjusted to each other, and to objective facts, through time via the competitive process itself. Competition is therefore not a state (an equilibrium condition to be checked against) but a DYNAMIC DISCOVERY PROCESS whose defining function is producing facts (about costs, techniques, and preferences) that would otherwise remain unknown — including to the very producers and consumers involved."
    quote: "[On equilibrium theory assuming what competition alone discovers:] 'they are assumed to know the lowest cost at which the commodity can be produced. Yet this knowledge which is assumed to be given to begin with is one of the main points where it is only through the process of competition that the facts will be discovered. This appears to me one of the most important of the points where the starting-point of the theory of competitive equilibrium assumes away the main task which only the process of competition can solve.' [On competition as exploration rather than allocation of known quantities:] 'The real problem in all this is not whether we will get given commodities or services at given marginal costs but mainly by what commodities and services the needs of the people can be most cheaply satisfied. The solution of the economic problem of society is in this respect always a voyage of exploration into the unknown, an attempt to discover new ways of doing things better than they have been done before. This must always remain so as long as there are any economic problems to be solved at all, because all economic problems are created by unforeseen changes which require adaptation.' [On the static/dynamic mismatch, stated as the chapter's main conclusion:] 'competition is by its nature a dynamic process whose essential characteristics are assumed away by the assumptions underlying static analysis.'"
canonical-instances:
  - "Any planning process that begins by asking stakeholders to state costs, capabilities, or preferences as fixed inputs to an optimization ('what's your team's velocity,' 'what will customers pay,' 'who's the best vendor') is implicitly running the perfect-competition mistake if those figures are actually unstable, context-dependent, or genuinely unknown until some real process (a pilot, a bid, an A/B test, an actual market) is allowed to reveal them — the fix is to run the discovery process, not to demand better guesses at the input."
  - "Startup/product strategy: business plans that treat 'product-market fit' or 'true customer willingness to pay' as researchable-in-advance facts, rather than as something only discoverable through the process of actually shipping, pricing, and observing real competitive/market response, repeat Hayek's diagnosed error at the firm level — the Lean Startup 'build-measure-learn' loop is, in Hayek's vocabulary, an explicit design-for-discovery response to exactly this problem."
  - "R&D and innovation policy: arguments that a central body (a grant committee, a five-year plan) can identify in advance which research direction or technique is 'best' presuppose the very facts (which approaches will actually work, at what cost) that only a competitive, parallel-exploration process reveals — Hayek's diagnosis generalizes from price-setting to technique-discovery generally."
critical-questions:
  - "is the 'given data' in the model or plan actually stable and knowable in advance by some feasible method (survey, audit, direct observation), or is it inherently the kind of thing that changes AS a result of the competitive/exploratory process running? If the latter, no amount of better upfront data-gathering fixes the plan — the process itself has to run before the facts exist in a form anyone could gather."
  - "is this the same claim as lex-58ynk (knowledge of particular circumstances resists centralization)? No, though both are Hayek and both target central-planning overreach. lex-58ynk says the relevant knowledge EXISTS, distributed among local actors, and cannot be successfully aggregated to a center. This atom says something stronger and different: the relevant knowledge (lowest possible cost, true consumer preference, best available technique) often does NOT YET EXIST anywhere, even locally, until the competitive process generates it — it is not a location problem (where is the knowledge) but a genesis problem (the knowledge is a PRODUCT of the process, not an input available to be found by anyone, however well-positioned). They compose: even a perfectly-informed local actor at time T0 may not yet know their own true lowest cost until competitive pressure at T1 forces the discovery."
  - "does this atom claim competitive markets always outperform any planned alternative? No — it makes a narrower methodological claim about what STANDARD EQUILIBRIUM THEORY explains and doesn't explain, and about which processes are structurally suited to discovering unknown facts versus allocating known ones. Domains where the relevant facts genuinely are already known and stable (not subject to the assumed-away discovery problem) are not automatically covered by this atom's diagnostic."
  - "how does this differ from ordinary A/B testing or experimentation advice? Ordinary experimentation advice says 'test before you decide.' This atom makes the sharper, prior methodological point that treating the tested-for quantity (true cost, true preference) AS IF it were a fixed fact waiting to be measured, rather than as a fact partly CONSTITUTED by the competitive process itself, is a category error inherited from equilibrium theory — the quantity is not just hard to measure, its existence in determinate form depends on the process having run."
