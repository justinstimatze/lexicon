id: lex-97pru
name: an-unresolvable-goal-means-conflict-can-resolve-by-abandoning-both
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone has fully internalized both a goal AND the moral obligation to pursue it only by legitimate means, but the legitimate means are unproductive and the illegitimate ones are morally foreclosed, don't expect them to simply pick a lane — expect some to exit the pursuit of BOTH entirely. Merton's retreatism names this double rejection as the resolution of a genuine double bind, not mere apathy: 'the interiorized moral obligation for adopting institutional means conflicts with pressures to resort to illicit means (which may attain the goal) and the individual is shut off from means which are both legitimate and effective.' Since neither route is available, 'the competitive order is maintained but the frustrated and handicapped individual who cannot cope with this order drops out' — abandoning the goal and the means together rather than compromising on either. The retreatist is, in Merton's phrase, 'in the society but not of it' — sociologically a true alien, included as a member 'only in a fictional sense,' because the shared frame of values that defines membership is exactly what's been relinquished. Diagnostic use: when someone disengages completely rather than cutting a corner, check whether they were actually MORE committed to both the goal and the rules than the people who innovated or ritualized — retreatism can be the exit of the scrupulous, not the unmotivated."
related: [lex-smd64, lex-hzrue, lex-5ggxk]
scaffolds-from: [lex-smd64, lex-hzrue]
evokes: [merton-1957, retreatism, in-the-society-but-not-of-it, dropping-out, opted-out-of-the-whole-game, true-aliens]
lineage:
  - source: primary
    text: merton-1957-retreatism-in-society-not-of-it
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. IV 'Social Structure and Anomie,' p.152, 'IV. Retreatism.' Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'Just as Adaptation I (conformity) remains the most frequent, Adaptation IV (the rejection of cultural goals and institutional means) is probably the least common. People who adapt (or maladapt) in this fashion are, strictly speaking, in the society but not of it. Sociologically, these constitute the true aliens. Not sharing the common frame of values, they can be included as members of the society (in distinction from the population) only in a fictional sense.'"
  - source: primary
    text: merton-1957-retreatism-twofold-conflict
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.152-153, continuing directly."
    quote: "'From the standpoint of its sources in the social structure, this mode of adaptation is most likely to occur when both the culture goals and the institutional practices have been thoroughly assimilated by the individual and imbued with affect and high value, but accessible institutional avenues are not productive of success. There results a twofold conflict: the interiorized moral obligation for adopting institutional means conflicts with pressures to resort to illicit means (which may attain the goal) and the individual is shut off from means which are both legitimate and effective. The competitive order is maintained but the frustrated and handicapped individual who cannot cope with this order drops out.'"
canonical-instances:
  - "A scrupulously honest small-business owner who refuses to cut the corners competitors cut (underpaying staff off the books, falsifying inspections) and whose legitimate revenue can't compete against them may simply close the business and leave the field entirely, rather than either compromise or keep losing — exiting the competition itself rather than picking dishonesty or continued failure."
  - "A researcher committed to both a career goal (tenure) and to rigorous methods, working in a field where the fastest legitimate path is effectively closed (funding dried up, results won't replicate) and p-hacking or salami-slicing papers is foreclosed by conscience, may leave academia entirely rather than either fudge the work or grind on inside a system they can't succeed in honestly."
  - "operationally distinct from lex-5ggxk abandoning-ambition-while-over-complying-with-procedure-buys-safety: the ritualist keeps the MEANS and drops only the goal, staying inside the institution; the retreatist drops BOTH goal and means and exits the institution's frame of reference altogether. Ritualism trades ambition for continued membership; retreatism gives up membership itself."
critical-questions:
  - "Merton's own hedge: some retreatists retain orientation to the values of a subgroup within the larger society rather than none at all (he cites Nels Anderson's account of the hobo) — is 'true alien from the whole society' too strong a description when the retreatist may simply have relocated allegiance to a smaller, self-selected in-group rather than to no group at all?"
  - "How would you distinguish principled retreatism (both routes are genuinely foreclosed) from disguised ritualism-in-reverse or from simple burnout with no moral content? The diagnostic Merton offers is the PRIOR high internalization of both goal and means — retreatism as he defines it requires the person to have actually valued both before dropping both, not merely to have never engaged."
status: active
