    quote: "American semiconductor companies like Motorola learned this painful lesson when they elected to forgo direct participation in the 256k generation of DRAM chips. Having skipped this round, Motorola, like most of its American competitors, needed a large infusion of technical help from Japanese partners to rejoin the battle in the 1-megabyte generation. When it comes to core competencies, it is difficult to get off the train, walk to the next station, and then reboard."
canonical-instances:
  - "Motorola and most American semiconductor firms skipping the 256k DRAM generation for near-term cost reasons, then requiring substantial technical assistance from Japanese partners just to re-enter competition at the 1-megabyte generation."
  - "a research group that stops publishing through a lean funding period, then finds it lacks the accumulated technique needed to even evaluate the field's subsequent breakthrough, let alone contribute to it."
  - "a hardware-adjacent software team that skips optimizing for a new console generation, then finds its next title structurally unable to compete because the skills for exploiting that hardware generation were only learnable by building for it directly."
critical-questions:
  - "isn't this just ordinary opportunity cost — missing one round of revenue or progress? No — ordinary opportunity cost is round-local: you lose what that round would have earned, but you're otherwise unaffected going forward. This pattern is specifically about rounds that are GENERATIVE of the next round's required competence. Skipping a generative round doesn't just cost you that round's returns; it removes your own capacity to independently build what the next round requires, forcing dependence on external rescue (or permanent exclusion) rather than a simple later catch-up."
  - "how is this different from lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories (QWERTY path dependence)? lex-mwgep is about how a small, often arbitrary EARLY choice gets locked in by network effects and becomes hard to dislodge for reasons EXTERNAL to any single actor's skill (everyone else already adopted the standard). This atom is about an actor's own DELIBERATE decision to sit out one round of a personal or organizational skill-building sequence, and the INTERNAL mechanism (the round itself builds the prerequisite competence) that makes re-entry hard. lex-mwgep explains why a standard persists once locked in; lex-zvdxq explains why skipping your own turn in a compounding-skill sequence is disproportionately costly."
  - "does catching up always require outside help, as in the Motorola case? Outside help is one route; the more general claim is that a skipped generative round cannot be substituted for by studying the next round in isolation — SOME form of the missing hands-on competence-building has to happen, whether via partnership, acquisition, or a costly internal catch-up effort, before the actor can compete on equal footing again."
