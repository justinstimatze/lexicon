id: lex-tcrfy
name: a-rule-based-systems-constraints-make-an-argument-independent-of-content
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply when designing, critiquing, or reading the persuasive power of ANY rule-based system — a videogame, a simulation, a piece of software, a bureaucratic process, an economic model — and the analysis is stuck evaluating only its stated CONTENT (text, imagery, explicit messaging) while ignoring what its RULES themselves permit, forbid, reward, and punish. Bogost's coinage: 'procedural rhetoric is the practice of using processes persuasively... Procedural rhetoric is a subdomain of procedural authorship; its arguments are made not through the construction of words or images, but through the authorship of rules of behavior, the construction of dynamic models.' Just as verbal rhetoric persuades through oratory and visual rhetoric persuades through images, procedural rhetoric persuades through the structure of what a system's rules allow you to DO — 'the art of persuasion through rule-based representations and interactions rather than the spoken word, writing, images, or moving pictures.' The claim is not merely that rules can illustrate a point (a diagram illustrates); it's that the rules THEMSELVES are the argument, made by constraining the space of possible actions so that certain outcomes become natural, necessary, or unavoidable within the system, independent of any text the system also displays. Bogost's canonical example, Molleindustria's The McDonald's Videogame: the player manages a fast-food supply chain (pasture, slaughterhouse, restaurant, corporate office) where succeeding long-term REQUIRES using growth hormones, bribing officials, and bulldozing rainforest — not because the game TELLS you corruption is necessary, but because the rules make every non-corrupt path lose. The game 'mounts a procedural rhetoric about the necessity of corruption in the global fast food business' purely through what its mechanics permit and punish; a player who never reads a word of accompanying text still receives the argument by playing. Practitioner discipline: when analyzing what a rule-based system 'says,' separate two questions — what does its surface content claim, and what does its rule-structure actually reward, permit, or make load-bearing for success? The two can align (content and rules make the same argument, reinforcing it) or diverge (content claims one thing while the rules quietly teach another — e.g., a 'safety culture' compliance system whose actual incentive structure rewards speed over reporting). A system's procedural rhetoric is often more honest than its stated content, because a rule enforced every playthrough/use is harder to fake than a slogan stated once. This generalizes past games: any process, workflow, or bureaucratic system that constrains what actions succeed is making a procedural argument about how the world works or should work, whether or not anyone designed it deliberately."
related: [lex-sp7fa, lex-zuzcf, lex-6fwcs]
scaffolds-from: [lex-sp7fa]
evokes: [procedural-rhetoric, rules-as-argument, the-mcdonalds-videogame, molleindustria, anti-advergame, procedural-authorship, rule-based-persuasion, dynamic-models-as-claims]
lineage:
  - source: primary
    text: bogost-2007-persuasive-games
    citation: "Ian Bogost, Persuasive Games: The Expressive Power of Videogames (MIT Press, 2007), Introduction and Ch.1 ('The Rhetoric of Video Games'). Epub edition on shelf."
    quote: "'I call this new form procedural rhetoric, the art of persuasion through rule-based representations and interactions rather than the spoken word, writing, images, or moving pictures.' [Introduction — the coinage.] 'Procedurality refers to a way of creating, explaining, or understanding processes. And processes define the way things work: the methods, techniques, and logics that drive the operation of systems, from mechanical systems like engines to organizational systems like high schools to conceptual systems like religious faith. Rhetoric refers to effective and persuasive expression. Procedural rhetoric, then, is a practice of using processes persuasively.' [Ch.1 — the two-halves definition.] 'Procedural rhetoric is a subdomain of procedural authorship; its arguments are made not through the construction of words or images, but through the authorship of rules of behavior, the construction of dynamic models. In computation, those rules are authored in code, through the practice of programming.' [Ch.1 — the mechanism.] 'The McDonald's Videogame mounts a procedural rhetoric about the necessity of corruption in the global fast food business, and the overwhelming temptation of greed, which leads to more corruption. In order to succeed in the long-term, the player must use growth hormones, he must coerce banana republics, and he must mount PR and lobbying campaigns... The game makes a procedural argument about the inherent problems in the fast food industry, particularly the necessity of overstepping environmental and health-related boundaries.' [Ch.1 — the worked example.]"
canonical-instances:
  - "Molleindustria's The McDonald's Videogame itself: the player runs a fast-food supply chain across four sectors (pasture, slaughterhouse, restaurant, corporate office); winning long-term requires growth hormones, bribery, and rainforest clearance — the corruption argument is made by the rules' reward structure, not by any explicit anti-McDonald's text the game displays."
  - "A corporate ethics-training LMS whose stated content preaches 'speak up about safety concerns' while its completion-tracking rules only reward fast module completion and never surface or act on flagged concerns — the procedural rhetoric (what the system's rules actually reward) argues the opposite of the stated content, and employees learn the rules' argument, not the slogan's."
  - "operationally distinct from lex-sp7fa every-framing-highlights-some-aspects-and-makes-others-invisible: lex-sp7fa is about representational choice — which aspects of a situation a frame foregrounds versus hides, applicable to any medium (language, image, statistic). This atom is narrower and mechanism-specific: it's about RULE-CONSTRAINED ACTION SPACES making an argument through what succeeds and fails within them, a persuasive mode only available to systems the audience actually operates, not merely views. A procedural rhetoric is one way a system can also frame — hiding certain outcomes by making them mechanically unreachable — but framing doesn't require rules to be playable/operable, while procedural rhetoric does."
  - "operationally distinct from lex-zuzcf sugar-coated-content-teaches-that-the-content-itself-is-unpleasant (Bruckman): lex-zuzcf diagnoses a SPECIFIC structural failure — decoupling an engagement reward from instructional content, which teaches the wrong lesson as a side effect. This atom is the general positive claim that ANY rule system's constraints carry an argument, deliberate or not; lex-zuzcf's failure mode is one instance of procedural rhetoric misfiring (the rules of Math Blaster procedurally argue 'math is a toll to pay for the real reward,' regardless of what the software's marketing claims)."
critical-questions:
  - "Is procedural rhetoric a claim about DESIGNER INTENT (the rules were built to argue X) or about EFFECT ON THE PLAYER (the rules produce the impression of X regardless of intent)? Bogost's own examples lean toward intent-driven design, but the framework's most useful applications (the compliance-system example) are often about UNINTENDED procedural arguments a system's designers never meant to make — does the concept hold up equally well in both cases, or does 'rhetoric' (which implies an author with a persuasive goal) overreach when applied to accidental rule-consequences?"
  - "How does a reader/player actually DISTINGUISH a system's procedural rhetoric from simple realism or genre convention — is 'the rules make X necessary to win' always a claim about how the WORLD works, or sometimes just an artifact of what makes a game balanced/playable, with no persuasive content at all? Bogost's own book addresses this with the concept of 'simulation gaps' (what the model leaves out is itself part of its argument), but the line between 'necessary game-balance constraint' and 'ideological claim encoded as constraint' is not always sharp."
  - "Can procedural rhetoric be measured or is it purely an interpretive reading — two different critics analyzing the same ruleset could disagree about what argument it 'mounts.' What distinguishes a well-supported procedural-rhetoric reading from an over-reading that projects meaning onto rules that are actually just arbitrary or balance-driven?"
status: active
