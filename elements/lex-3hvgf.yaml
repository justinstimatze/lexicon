id: lex-3hvgf
name: a-warning-about-a-danger-can-double-as-its-defeat-manual
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone warns you away from a specific danger by describing exactly how it operates, don't treat that description only as a reason to stay away -- a precise account of a threat's method is simultaneously a blueprint for surviving it and, potentially, for turning it back on the source. In Cushing's telling, a mother trying to keep her son from the Misho Lizards' den describes their method in exact operational detail: they're 'very polite,' invite you to 'sit down right here in the middle of the floor before the fire,' then 'gather round the walls and throw this venom on him, and he dies almost immediately.' The boy goes anyway, but he goes as someone who now knows precisely what will happen and when: 'knowing beforehand... he was prepared and protected, and it did him no harm.' Having survived the exact method the warning described, he then redeploys it: 'I will do the same thing,' and destroys the whole council with an exploding countermeasure of his own. The warning was never just a boundary to respect -- once he decided to cross it anyway, it became the single most valuable piece of intelligence he had, more useful than any weapon, because it told him exactly what to prepare for. Diagnostic move: when someone gives you a detailed warning about how a specific danger operates, extract everything actionable from the description itself, independent of whether you intend to heed the warning's actual instruction to stay away -- a warning detailed enough to be convincing is also detailed enough to be a plan, and the same information that's meant to keep you out can be exactly what lets you go in prepared, or turn the danger's own method back on it."
