id: lex-ry4x3
name: pairwise-comparison-elicits-more-reliable-preferences-than-absolute-scoring-from-humans
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When you need to elicit human preferences over a set of options — for training a model, ranking content, choosing a design, evaluating performance, or aggregating opinion — prefer pairwise (or N-wise) COMPARISON over absolute numerical scoring. Christiano et al. 2017 (the canonical RLHF paper) found in deep-RL settings that humans can reliably compare two short clips of agent behavior even when they would struggle to assign each clip an absolute score — and a reward model trained on those comparisons drove complex behaviors (Atari games, simulated robot locomotion) using less than 1% of the agent's interaction budget for human feedback. The transferable claim about humans: relative judgments are cognitively cheaper and more reliable than absolute judgments, because absolute judgments require an internal calibration humans don't maintain (the rater's '7/10' today might be a '8/10' tomorrow on the same item), while pairwise judgments only require local comparison. Operational consequences: (1) when designing a rating UI, prefer 'which of these two is better' over '1-10 scale.' (2) When evaluating multiple proposals, present them in pairs, not as a list with absolute ratings. (3) When tracking employee performance, comparison against peers (relative ranking) is more reliable than absolute target-achievement scoring, though it has its own failure modes (forced-distribution stack-ranking). (4) When eliciting expert judgment for a model, ask 'which of these two is more X?' rather than 'rate each on a scale.' (5) RLHF for large language models (Ouyang et al. 2022 InstructGPT and subsequent) is a direct application: human raters compare model responses pairwise, the comparisons train a reward model, and the LLM is then fine-tuned against the reward model. Inverse failure mode: when the option set is large and the comparison-graph is sparse, pairwise data is insufficient and you need ranking-aggregation methods. Generalizes far beyond AI: scientific peer review (rejected vs accepted is a binary comparison, but reviewers struggle to score absolute quality); evaluating job candidates (interview-by-comparison vs scorecard-by-rubric); market research (A/B preference vs Likert scale)."
