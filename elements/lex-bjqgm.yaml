  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch9-fuel-to-the-fire
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter IX, 'Increasing Demands of the Slave Power.'"
    quote: "“In a word, whatever was done or attempted, with a view to the support and security of slavery, only served as fuel to the fire, and heated the furnace of agitation to a higher degree than any before attained.”"
canonical-instances:
  - "The direct textual anchor: the Congressional 'gag rule' against anti-slavery petitions (1836-1844), mob demonstrations against abolitionist free speech, and the exclusion of Hale, Chase, and Sumner from Senate committees are each named by Douglass as instances that 'only served as fuel to the fire' rather than achieving the silence they were meant to secure."
  - "Hypothetical: a company fires an employee for publicly raising a safety complaint. The complaint itself, on its own, would have reached a small audience; the firing becomes national news, and customers who had no opinion on the underlying safety issue become critics of the company specifically, because responding to a complaint with power rather than an answer reads as an admission that the company had no answer to give."
critical-questions:
  - "Operationally distinct from lex-ws2gv (attempt-to-suppress-information-increases-its-visibility, the Streisand effect): that mechanism is curiosity-driven -- suppression makes a previously-obscure or -concealed piece of content more visible, and the audience's motive is wanting to see what's hidden. This atom's grievance was never hidden or obscure; the audience already knew the content, and what shifts is its judgment of a suppressor who resorted to force rather than argument. Could the two mechanisms compound when the suppressed material is both a hidden fact AND a live grievance?"
  - "Operationally distinct from lex-ryycm (suppressing-through-due-process-legitimizes-what-it-targets): that atom is narrower, requiring a formal, rule-bound legal or evidentiary procedure whose own legitimacy-conferring machinery certifies the suppressed material. This atom requires no formal procedure at all -- a gag rule, a mob beating, or a committee purge exercise raw power directly, with no neutral procedure standing between the act and its target, and the legitimating effect comes from a bystander's inference about what a resort to naked force implies about the suppressor's argument."
  - "Does this mechanism have a scope limit -- can sufficiently overwhelming, sustained force actually succeed in permanently suppressing a grievance rather than amplifying it, and if so, what distinguishes the cases where suppression backfires from the cases where it simply works?"
status: active
