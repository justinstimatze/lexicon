id: lex-eypuq
name: claimed-cosmic-authority-and-actual-coercive-capacity-vary-independently
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When assessing how much real power a ruler or authority figure actually holds, don't read the grandiosity of their claimed cosmic or absolute authority as a proxy for their actual coercive capacity -- the two vary independently and require entirely separate evidence. Graeber and Wengrow's case: a minor nineteenth-century Fijian chief commanding a confederacy of a few thousand people had his herald proclaim each sunrise that he was about to chew his kava root, at which his subjects shouted 'Chew it!' -- a daily ritual claiming he personally recreated the universe, enforced by nothing but his subjects' willingness to play along. Sargon of Akkad and the First Emperor of China made comparably totalizing claims, backed by armies and administrations that could compel obedience whether or not anyone believed a word of the cosmology. Because both the nearly powerless and the genuinely all-powerful reach for identical grandiose language, the scale of a ruler's claimed authority tells you almost nothing on its own about the scale of what that ruler can actually make people do."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, fijian-chief, sargon-of-akkad, philip-abrams, sovereignty, ritual-claims]
lineage:
  - source: primary
    text: dawn-of-everything-cakaudrove-kava
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.10 'Why the State Has No Origin.'"
    quote: "“Such cosmic claims are regularly made in royal ritual almost everywhere in the world, and their grandeur seems to bear almost no relation to a ruler's actual power (as in their ability to make anyone do anything they don't want to do).”"
  - source: primary
    text: dawn-of-everything-abrams-mask
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.10 'Why the State Has No Origin,' quoting sociologist Philip Abrams."
    quote: "“the state is ‘not the reality which stands behind the mask of political practice. It is itself the mask which prevents our seeing political practice as it is.’”"
canonical-instances:
  - "The direct textual anchor, on the specific comparison the book draws to make the point: 'the Fijian subjects of the King of Cakaudrove must at least have been willing to play along with the daily sunrise ritual, since he lacked much in the way of means to compel them. Yet rulers such as Sargon the Great of Akkad or the First Emperor of China had many such means at their disposal.'"
  - "Hypothetical: two mid-level managers at different companies both send company-wide memos describing themselves as 'ultimately responsible for every decision made under this roof.' One heads a two-person department with no budget authority and no one reporting to her; her memo is decorative. The other controls hiring, firing, and budget approval for four hundred people. The wording of the two memos is nearly identical, and reading only the memos gives no way to tell which manager can actually act on the claim."
critical-questions:
  - "Doesn't the persistence of a grandiose ritual over time provide at least indirect evidence of real power? A genuinely powerless ruler's subjects might eventually stop bothering to play along, and a cosmic-claim ritual sustained for generations implies some underlying leverage kept people compliant, even leverage invisible in the ritual's own content."
  - "How should an observer without independent evidence (Sargon's armies, the Fijian chief's genuine dependence on voluntary compliance) actually distinguish the two cases in practice, given that the whole point of the atom is that the ritual language itself provides no reliable signal either way? Is there any feature of the claim's PRESENTATION, rather than external facts about armies or administration, that would help tell them apart?"
status: active
