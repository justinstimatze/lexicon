canonical-instances:
  - "A researcher observes that engineers who contribute to open source earliest in their career are also most likely to eventually get hired by a prestigious tech company. Two directions are equally plausible — early open-source involvement builds the skills and network that lead to prestigious hiring, or a natural early inclination toward the field, which also predicts eventual prestigious hiring on its own, simply shows up as open-source involvement sooner. Confirming that the first mechanism is real (open-source contributions do teach skills recruiters value) does not thereby rule out the second directional story also being true of the same population."
  - "A company notices that employees who receive early praise also tend to become the most engaged over their tenure, and confirms one direction with a controlled study showing early praise measurably increases subsequent effort. It should not conclude the reverse direction has been ruled out — that people who were already going to become highly engaged also happen to draw earlier praise from managers who can sense potential — without separately testing that direction, since both mechanisms could be operating on the same population at once."
critical-questions:
  - "Is there a general test for whether a suspected feedback loop is genuinely bidirectional versus effectively one-directional in practice — or does the discipline this atom recommends (name both, test what you can, admit what you can't) risk becoming a permanent hedge that never actually commits to a causal claim?"
  - "Thielens finds direct comparative evidence for one direction (no-alternatives predicts earlier decision) but explicitly has none for the other (early commitment predicts fading alternatives) — what would the minimal additional data collection have looked like to actually test the second direction, and why might a one-time questionnaire design have made it structurally hard to get?"
