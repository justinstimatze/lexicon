lineage:
  - source: primary
    text: hyde-legba-reverses-douglas-dirt-can-be-the-tool-that-creates-order
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Heaven's Privy,\"' reversing Mary Douglas's byproduct framing via the Legba/Mawu myth. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Douglas has it that “dirt is the by-product of … systematic ordering,” but it’s more that dirt and order are mutually dependent, for in this case the conceit can be as easily reversed: for Legba, the creation of order is a by-product of dirt. Dirt is one of the tools available to trickster as he makes this world, the world in which the heavens are very far away."
canonical-instances:
  - "A company treats a whistleblower's leaked internal document as pure mess to be contained and cleaned up, when in fact the leak was deliberately engineered by a faction inside the company specifically to force a reorganization that couldn't happen through normal channels -- the 'dirt' was the tool, not the byproduct."
  - "A community reads a public scandal involving a respected local figure as an unfortunate breakdown of order, when closer examination shows someone orchestrated the exposure precisely because it was the only available lever to force a change in local leadership that ordinary process had repeatedly failed to produce."
critical-questions:
  - "How would someone distinguish, in a live situation, between excluded material that is genuinely just an incidental byproduct and excluded material that is being actively used as a tool, given that both can look identical from the outside until the reorganization they enable actually occurs?"
  - "Does the 'mutual dependence' framing risk becoming unfalsifiable, since almost any mess could retroactively be reinterpreted as 'secretly the tool that built the new order' after the fact, regardless of whether anyone actually deployed it that way?"
  - "Is Hyde's reversal of Douglas actually a genuine correction to her theory, or is it better understood as a different, narrower claim specifically about trickster myths, which may not generalize to Douglas's broader anthropological cases of dirt as an incidental byproduct of ordinary social systems?"
status: active
