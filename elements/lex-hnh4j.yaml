canonical-instances:
  - "A manager notices a team missing deadlines and immediately offers a bonus for hitting the next one, without checking first whether the team is merely under-resourced (fixable with the bonus and extra help) or has quietly lost trust in the project's direction after repeated scope changes (a structural loss no bonus touches) -- the bonus works for the first team and is wasted, or even resented, on the second."
  - "A company sees customer churn rising and runs a discount campaign to win customers back, treating it as a pricing problem, when a chunk of the churn is actually customers who no longer trust the product after a data breach -- the discount recovers price-sensitive customers fine but does nothing for the trust-broken ones, who need a different, structural remedy entirely."
critical-questions:
  - "how reliably can an observer actually tell the two versions apart from the outside, given that both present with the identical visible symptom (unwillingness, underperformance, low morale) -- does this framework assume a diagnostic clarity that real situations, with mixed and ambiguous causes, rarely provide?"
  - "does insisting on full diagnosis before acting risk paralysis or delay in situations where a partial, imperfect fix applied immediately would have prevented further deterioration, even if it wasn't the theoretically correct remedy?"
  - "can a case actually be BOTH at once -- a team that is genuinely under-resourced AND has accumulated real resentment -- and if so, does this binary framework (transient gap vs. structural loss) oversimplify what is actually a compounding, harder-to-treat mixture of both causes?"
