lineage:
  - source: primary
    text: merton-1957-legitimate-structural-alternatives
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. V 'Continuities in the Theory of Social Structure and Anomie,' pp.192-193. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). A footnote digit ('61') sits glued directly to 'clientele.' in the OCR; it is elided with an ellipsis at that seam rather than reproduced."
    quote: "'We have had frequent occasion to note that criminal \"rackets\" and sometimes associated political machines persist by virtue of the social functions they perform for various parts of the underlying population who constitute their acknowledged and unacknowledged clientele. ... It should be expected, therefore, that as legitimate structural alternatives for performing these functions develop, this would result in substantial changes in the social distribution of deviant behavior.'"
  - source: primary
    text: merton-1957-bell-crime-is-passing
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.193-194, quoting Daniel Bell, 'Crime as an American Way of Life,' The Antioch Review, Summer 1953, 131-154, at 154."
    quote: "'with the rationalization and absorption of some illicit activities into the structure of the economy, the passing of an older generation that had established a hegemony over crime, the rise of minority groups to social position, and the breakup of the urban boss system, the pattern of crime we have discussed is passing as well. Crime, of course, remains as long as passion and the desire for gain remain. But big, organized city crime, as we have known it for the past seventy-five years, was based on more than these universal motives. It was based on characteristics of the American economy, American ethnic groups, and American politics. The changes in all these areas means that it too, in the form we have known it, is at an end.'"
canonical-instances:
  - "A city that tries to shut down unlicensed street vending through fines and confiscation, without opening an affordable licensing path, sees vendors return the next week; a city that opens a cheap fast-track license sees the unlicensed market shrink on its own, because the underlying demand (a livelihood) was never being served by illegality as such."
  - "Employees who route around a slow official IT-request process by installing unsanctioned tools ('shadow IT') keep doing it under every crackdown that blocks the tools, and mostly stop once the official process gets fast enough to compete with the workaround."
critical-questions:
  - "Bell's case took generations to resolve on its own as legitimate opportunity opened; does the mechanism work on a policy-relevant timescale, or is 'open a legitimate channel' a true long-run description that gives no guidance for what to do about an illegitimate channel causing harm right now?"
  - "Does opening a legitimate channel actually substitute for the illegitimate one, or can the two coexist indefinitely if the legitimate channel is more costly, slower, or less profitable than the illegitimate route it was meant to replace? Merton's cases are ones where the legitimate alternative won; the theory doesn't specify when it loses."
