id: lex-a7zbp
name: honest-performance-starves-corrupt-incumbents-into-retaliatory-slander
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a competent, honest newcomer is given even a narrow slice of an entrenched corrupt system''s authority, the incumbents who profited from the corruption don''t experience the loss as a moral correction — they experience it as a direct cut to their income, and the newcomer''s very success at the job becomes the evidence they weaponize against him. Because open opposition to honesty looks bad, the retaliation takes the form of a manufactured loyalty threat rather than an admission of what''s actually motivating it. In the Bhadda-sala-Jataka, when Bandhula judges one case fairly and the crowd applauds, the king hands him the whole judgment-court; the former judges, now poor because the bribes have stopped, don''t contest the ruling — they slander him to the king as secretly aiming at the throne, and this fabricated threat, not the corruption it papers over, is what the king believes.'
related: []
evokes: [jataka, dvadasanipata, bhadda-sala-jataka, reform-threatens-graft-triggers-smear, corrupt-incumbents-retaliate-via-loyalty-narrative]
lineage:
  - source: primary
    text: jataka-chalmers1895-bhadda-sala-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 465, Bhadda-sala-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Then the former judges became poor, because they no longer received bribes, and they slandered Bandhula in the king''s ear, accusing him of aiming at the kingdom himself.'
canonical-instances:
  - 'A new compliance officer who starts actually enforcing expense-reporting rules gets quietly reported to the board by the department heads whose padded budgets she cut, framed not as resistance to oversight but as a warning that she is ''building a power base'' inside the finance function.'
critical-questions:
  - 'Is the king''s downstream suspicion evidence that the slander tactic works, or evidence that a ruler who can be turned this easily by an interested party was already a structural vulnerability the corrupt judges merely exploited rather than created?'
status: active
