    citation: "E. P. Sanders, Paul and Palestinian Judaism: A Comparison of Patterns of Religion, 40th Anniversary Edition (Fortress Press, 2017; first published 1977), Introduction, Section 2 -- Sanders's critique of Buchanan's method of comparing Paul and Judaism by matching individual motifs."
    quote: "'In fact, I would argue that baptism has quite a different place in the Pauline pattern of religion from its place in Judaism.'"
canonical-instances:
  - "Buchanan's covenantal-theology scheme lists Paul's baptism passages alongside Jewish purificatory washings under one heading because both involve water and both concern admission to a religious community -- without asking whether baptism plays the same structural role (how one 'gets in') in Paul's thought that washing plays in Judaism's. Sanders's point: the motif-match proves only that both traditions have a water-ritual, not that the ritual carries the same theological weight in each."
  - "A software team ports a design pattern from one codebase to another because both use a component called a 'cache' -- without checking that correctness in the source system actually depends on that cache (a single source of truth) while the target system's 'cache' is a pure performance optimization with a fallback path. The shared name licenses an import that the actual structural role does not support."
  - "A comparative-law scholar notes that both France and Japan have an institution called a 'notary' and infers similar legal function, missing that French notaries hold quasi-judicial authority over property transfer while the Japanese equivalent is closer to a document-certification clerk -- the label recurs, the position in each legal system's overall structure does not."
  - "Operationally distinct from lex-3gb9b two-frameworks-judge-the-same-act-by-different-harm-metrics: that atom holds one act fixed and shows two frameworks scoring it by different metrics. This atom holds a motif or term fixed across two whole systems and shows the SAME motif occupying a different structural position within each system's own internal architecture -- the error being corrected is treating the recurring label as if it settled the comparison before the structural mapping was ever done."
critical-questions:
  - "How much system-mapping is actually required before a legitimate comparison can begin? Sanders's method is expensive -- it demands reconstructing each system's full 'pattern' before any cross-system claim is safe. A quick, practical comparison may not have the resources to do this for every shared term, which is exactly the shortcut this atom warns against taking without noticing the cost."
  - "Can the whole-pattern comparison itself smuggle in a distorting frame? Sanders concedes the risk directly -- that describing a 'pattern' at all might impose an artificial coherence on a body of material that is really heterogeneous. The corrective to isolated-motif-matching is not immune to its own version of over-systematizing."
  - "Does surface-motif matching ever legitimately indicate shared structural function, or is checking always required? Two systems that share a history (a legal code borrowed wholesale from a common source) may genuinely inherit shared structural roles along with a shared term -- the diagnostic is whether someone has actually verified that inheritance for the specific case rather than inferred it from the resemblance alone."
