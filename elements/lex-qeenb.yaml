id: lex-qeenb
name: a-targets-own-vanity-narrates-the-map-to-its-fatal-point
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a self-important target is explaining their own significance to you in detail, don't just tolerate the vanity -- notice that they may be handing you exactly the information you'd otherwise have to find on your own, including which part of them is actually fatal to touch. In Cushing's telling, a Horned-toad has crawled inside a Coyote and simply asks, with feigned naivety, what each organ he touches is: 'What is this I feel?' The Coyote, unable to resist explaining his own importance, answers each question with escalating self-regard -- the liver is 'the very source of my being,' the stomach is again described the same way -- until he reaches the heart and, still narrating his own significance rather than staying silent, supplies the one fact that matters: 'if you should scratch it ever so little, it would be the death of me.' The Horned-toad never had to search for the vital point or guess at the Coyote's anatomy; the Coyote's own inability to stop explaining how important each part of him was did the targeting for him. Diagnostic move: when someone vain or self-important is explaining, unprompted, exactly how significant and vulnerable different parts of their position, business, or plan are, treat that explanation as a map rather than as flattery to be endured -- a target's own need to narrate their own importance often discloses precisely the leverage point an adversary would otherwise have to work much harder to locate."
related: []
evokes: [self-narrated-importance-doubles-as-a-target-map, cushing-coyote-and-the-burrowing-owls, the-very-source-of-my-being, if-you-scratch-it-it-would-be-the-death-of-me]
lineage:
  - source: primary
    text: cushing-coyote-owls-horned-toad-maps-the-heart-by-flattery
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Coyote Who Killed the Demon Síuiuki: or Why Coyotes Run Their Noses Into Deadfalls.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'What is this I feel?' 'Down here.' 'Merciful daylight! it is my liver, without which no one can have solidity of any kind, or a proper vitality. Be very careful not to injure that; if you do, I shall die at once...' ... 'What is this, my friend?' ... 'That is the very source of my being--my stomach itself!' ... 'What is this?' cried the Horned-toad. ... 'That is the very heart of my being, the thread that ties my existence, the home of my emotions, and my knowledge of daylight. Go away from there, do, I pray you! If you should scratch it ever so little, it would be the death of me...' ... And he hooked one of his horns into the Coyote's heart. The Coyote gave one gasp, straightened out his limbs, and expired."
canonical-instances:
  - "A competitor conducting friendly-seeming due diligence asks a boastful founder naive-sounding questions about their business, and the founder, unable to resist explaining how critical each part of the operation is, inadvertently reveals exactly which single vendor relationship or process the whole company depends on, information the competitor could never have found through research alone."
  - "A social engineer posing as an admiring junior colleague asks a self-important executive open-ended questions about their role, and the executive's own need to demonstrate their indispensability reveals precisely which systems, passwords, or approval chains run entirely through them, mapping out the exact single point of failure an attacker would want to target."
critical-questions:
  - "does this pattern depend on the target's specific vanity and need to self-narrate, or would a more guarded, less self-important target simply not supply this information regardless of how the questions were framed -- is the vulnerability really about naive-seeming questions, or about who's being asked?"
  - "how would the Horned-toad's approach have worked if the Coyote had simply refused to answer or grown suspicious of the pattern of increasingly probing questions -- does the tactic require the target's continued cooperation at every step, or could it work with a target who caught on partway through?"
  - "is there a meaningful difference between a target genuinely not realizing they're disclosing anything, as the Coyote seems not to, and one who suspects but can't resist the flattery of being asked -- does the moral weight of exploiting this pattern change depending on which is actually happening?"
status: active
