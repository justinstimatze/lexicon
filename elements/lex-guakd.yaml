    quote: "Yet they may leave the Hawk's young brood alone, / Perchance, if they see me so fully grown."
canonical-instances:
  - "A veteran negotiator's junior colleague offers to take the next tense meeting alone to spare their boss the stress, and is turned down not because the junior lacks skill but because the other side has only ever backed off when the veteran personally is in the room — a reputation the junior hasn't built yet."
critical-questions:
  - "The father tortoise never explains how he knows his size is the deterrent rather than, say, his age or his manner — the story simply confirms he's right. How would you tell, before the fact, whether a substitution genuinely removes a working deterrent or is just an untested assumption about what's been keeping the threat at bay?"
  - "Does refusing the substitute on these grounds train the substitute out of ever developing the trait that would let them take over later, since they never get to test it under real conditions?"
