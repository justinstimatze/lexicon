id: lex-kwswc
name: resuscitation-effort-tracks-perceived-worth-not-clinical-presentation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a triage-like decision must be made fast, under uncertainty, about how much effort to invest in saving something, the effort actually allocated can track an unstated judgment about the target's perceived worth rather than the observable facts that are supposed to be doing the deciding — and this becomes visible only when two cases with materially indistinguishable presentations receive opposite treatment. Sudnow's Passing On documents the clean natural experiment: 'Two persons in \"similar\" physical condition may be differentially designated dead or not. For example, a young child was brought into the ER with no registering heartbeat, respirations, or pulse — the standard \"signs of death\" — and was, through a rather dramatic stimulation procedure involving the coordinated work of a large team of doctors and nurses, revived for a period of eleven hours. On the same evening, shortly after the child's arrival, an elderly person who presented the same physical signs, with what a doctor later stated, in conversation, to be no discernible differences from the child in skin color, warmth, etc., \"arrived\" in the ER and was almost immediately pronounced dead, with no attempts at stimulation instituted.' A nurse's own comment makes the mechanism explicit rather than deniable: 'They (the doctors) would never have done that to the old lady (i.e., attempt heart stimulation) even though I've seen it work on them too.' The doctors did not lie about the clinical signs — the signs really were indistinguishable — but the presenting signs were not what actually drove the effort decision; an unstated judgment about whose life was worth the team's full mobilization was doing the deciding, dressed in clinical language. Generalize beyond medicine: two comparably-severe production outages get different escalation urgency depending on which customer or which team is affected; two students with equivalent test failures get different amounts of remedial attention depending on how much the teacher expects of them; two comparable startup pitches get different amounts of investor diligence depending on unstated pattern-matching about who 'looks like' a founder. The diagnostic move: find or construct the natural pair — two cases matched on the stated decision criteria — and check whether the actual resource commitment diverges anyway. If it does, the stated criteria were not the operative ones."
