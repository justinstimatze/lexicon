id: lex-svng5
name: defamiliarization-restores-perception-that-habituation-flattened
type-in: state
type-out: process
_tier: atomic
agent-instruction: "Shklovsky names the mechanism by which repeated exposure quietly stops you from actually perceiving something at all. As an action or object becomes familiar, perception of it automatizes: you stop taking it in and start merely recognizing it, the way rapid speech drops most of a word's sounds because the listener only needs enough to identify it. Shklovsky calls this 'algebrization' -- objects reduced to a silhouette, known by their outline rather than seen in their particulars, 'enveloped in a sack.' Art, on his account, exists to work against exactly this automatizing efficiency, and automatized experience stops registering as having happened at all -- which is why he reaches for Tolstoy's own diary entry as evidence rather than a literary example: cleaning a room, Tolstoy couldn't remember whether he'd dusted the divan, and drew a general conclusion from that lapse himself: 'if the whole complex lives of many people go on unconsciously, then such lives are as if they had never been.' The corrective is concrete: make the object strange by describing it without its normal name, from an unfamiliar vantage, so perception can't shortcut to recognition and has to actually happen -- prolonged rather than instant, because 'the process of perception is an aesthetic end in itself.' Tolstoy's own technique supplies the clearest demonstration: describing flogging as 'to strip people who have broken the law, to hurl them to the floor, and to rap on their bottoms with switches' rather than naming the familiar, already-absorbed institution forces a reader who has stopped seeing corporal punishment to see it again. The same move drives 'Kholstomer,' narrated by a horse who finds the concept of 'my horse' as arbitrary and unintelligible as 'my land' or 'my water,' because the horse never automatized the concept of property in the first place. The transferable move: when you need someone to actually perceive something they've stopped seeing -- a familiar cruelty, a familiar cost, a familiar convention -- strip its normal name and familiar vocabulary and describe what it actually, mechanically is. The friction that produces is the point."
related: [lex-p6p82]
evokes: [shklovsky-1917-art-as-technique, ostranenie, algebrization, make-the-stone-stony, kholstomer-the-horse-narrator, tolstoys-dusted-divan]
lineage:
  - source: primary
    text: shklovsky-1917-art-as-technique
    citation: "Viktor Shklovsky, 'Art as Technique' (1917), trans. Lee T. Lemon and Marion J. Reis, in Lee T. Lemon and Marion J. Reis, eds., Russian Formalist Criticism: Four Essays (University of Nebraska Press, 1965), the essay's central statement."
    quote: "'And art exists that one may recover the sensation of life; it exists to make one feel things, to make the stone stony. The purpose of art is to impart the sensation of things as they are perceived and not as they are known. The technique of art is to make objects \"unfamiliar,\" to make forms difficult, to increase the difficulty and length of perception because the process of perception is an aesthetic end in itself and must be prolonged.'"
  - source: primary
    text: shklovsky-1917-art-as-technique
    citation: "Viktor Shklovsky, 'Art as Technique' (1917), on habituation and 'algebrization,' quoting Leo Tolstoy's 1897 diary."
    quote: "'By this \"algebraic\" method of thought we apprehend objects only as shapes with imprecise extensions; we do not see them in their entirety but rather recognize them by their main characteristics. We see the object as though it were enveloped in a sack.' [...] 'I was cleaning a room and, meandering about, approached the divan and couldn't remember whether or not I had dusted it. Since these movements are habitual and unconscious, I could not remember and felt that it was impossible to remember [...] if the whole complex lives of many people go on unconsciously, then such lives are as if they had never been.'"
  - source: primary
    text: shklovsky-1917-art-as-technique
    citation: "Viktor Shklovsky, 'Art as Technique' (1917), the flogging example from Tolstoy's 'Shame.'"
    quote: "'Tolstoy makes the familiar seem strange by not naming the familiar object [...] in \"Shame\" Tolstoy \"defamiliarizes\" the idea of flogging in this way: \"to strip people who have broken the law, to hurl them to the floor, and to rap on their bottoms with switches,\" and, after a few lines, \"to lash about on the naked buttocks.\"'"
  - source: primary
    text: shklovsky-1917-art-as-technique
    citation: "Viktor Shklovsky, 'Art as Technique' (1917), on 'Kholstomer,' Tolstoy's horse-narrated story, quoting the story directly."
    quote: "'The narrator of \"Kholstomer\" [...] is a horse, and it is the horse's point of view [...] that makes the content of the story seem unfamiliar. [...] What's the meaning of \"his own,\" \"his colt\"? [...] The words \"my horse\" referred to me, a living horse, and seemed as strange to me as the words \"my land,\" \"my air,\" \"my water.\"'"
canonical-instances:
  - "Tolstoy's own diary entry, which Shklovsky quotes as the diagnostic case rather than a literary example: he cannot remember whether he dusted the divan, because dusting had automatized into unconscious motion. The forgetting is evidence of something specific: an action performed without perception functionally didn't register as having happened at all."
  - "'Kholstomer' narrated by a horse: property, an institution every human reader has fully automatized, becomes visibly arbitrary the instant it's described from a perspective that never absorbed it. The horse isn't making an argument against property; the estrangement alone does the work an argument would otherwise have to do."
  - "A safety briefing that says 'this machine can amputate a finger in under a second if your hand crosses this line' outperforms one that says 'observe proper hand placement at all times' because it refuses the automatized, absorbed vocabulary ('proper hand placement') that lets a listener's attention slide past without actually picturing the thing."
  - "Investigative journalism that describes a familiar bureaucratic process in mechanical, un-euphemized terms -- what a form actually requires, what a denial actually means for the person denied -- is doing Tolstoy's flogging-move: the institution was already absorbed and unseen under its normal vocabulary; stripping the vocabulary forces it back into view."
critical-questions:
  - "Shklovsky's claim is about art's purpose broadly, extending well past political or moral material -- the flogging and Kholstomer examples happen to be about cruelty and property, but the mechanism (habituation flattens perception; strangeness restores it) applies equally to aesthetic effects with no moral content at all, like a poem's sound patterning. Don't over-read the two most memorable examples as the whole claim; a separate atom specifically about defamiliarization as moral/political technique (stripping euphemism from an accepted practice to force re-examination of it) is a real, narrower, and not-yet-minted claim this essay also supports, concerned with persuasion and moral attention specifically rather than perception in general."
  - "How does this relate to lex-p6p82 (counter-intuitive-premise-opens-explanation)? That atom is about which claim to lead an explanation with, for a rhetorical/pedagogical payoff. This atom is about a broader and different perceptual mechanism -- why ANY repeated exposure degrades genuine perception at all, with defamiliarization as the general countermeasure, independent of whether an explanation is being given. The two atoms can co-occur (a counter-intuitive opening is one way to defamiliarize) but neither implies the other: a pedagogical hook doesn't need habituation to have occurred first, and defamiliarization doesn't require an explanation to be in progress at all."
  - "At what point does deliberate strangeness stop restoring perception and start obstructing it -- when does 'making forms difficult' become mere obscurity that loses the audience rather than re-engaging them? Shklovsky doesn't supply this threshold; it's audience- and context-dependent, and the essay's own examples (all drawn from a virtuoso prose stylist working within a legible narrative) may not license the same difficulty in contexts without that scaffolding."
status: active
