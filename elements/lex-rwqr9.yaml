id: lex-rwqr9
name: sustained-purity-eventually-requires-desecration-to-renew-itself
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A system maintained in a state of total enclosure and purity, admitting nothing that violates its own order, doesn't stay vital indefinitely by staying pure -- left uninterrupted, that same purity trends toward stagnation or decline, and what actually restores its fertility is a controlled violation of its own boundaries, not further enforcement of them. Hyde traces the mechanism through the Shinto myth of Susa-nö-o, storm god and disruptive brother of the sun goddess Amaterasu, who intrudes on her most enclosed and purest rituals, the tasting of the harvest's first fruits, the weaving of sacred garments by virgin attendants, by setting up false boundary stakes in the rice paddies, tearing a hole in the weaving hall's roof, dropping a skinned pony inside 'backward,' and defecating in the hall where the first fruits are tasted, in some versions directly under Amaterasu's throne. The immediate result is catastrophic: 'this sudden intrusion so terrifies his sister the Sun Goddess that she falls against her loom, the shuttle piercing her vagina and wounding her,' or in some tellings kills her outright; in versions where she survives, she hides in a cave and 'the heavens and earth go dark, and \"all manner of calamities\" occur.' Yet the desecration is what turns the year: after Susa-nö-o is banished to earth, he kills a food-goddess whose dead body produces the first seeds, rice, millet, beans, wheat, giving humanity agriculture. Hyde's summary names the pattern directly: 'this motif of revivification through dirt.' The sun's decline was not prevented by preserving her enclosure more carefully; it was reversed only after her purity had already been violated and the ritual year forced through its own dark passage. Diagnostic move: when a system, an institution, a tradition, an art form has maintained an unbroken run of order and refinement and shows signs of exhaustion or decline anyway, don't assume the fix is tighter enforcement of the existing purity -- consider that what actually restarts fertility in such systems is historically some form of controlled desecration, an intrusion the system did not choose and could not have authorized in advance."
