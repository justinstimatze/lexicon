id: lex-65h3b
name: shared-agreement-both-options-beat-disaster-breaks-gridlock
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two factions can't agree which of two good options is better, check whether they agree on something narrower and more useful: that either one beats doing nothing. Sen: “two groups of environmentalists may agree that some carbon-reduction policy x (having high carbon-pricing through a functioning market) and another such policy y (regulatory intervention through banning certain carbon-generating activities) are each much better than doing nothing, as the globe warms up -- that catastrophic outcome may be called alternative z. And yet one group may vastly prefer x to y, whereas the other group has the opposite preference. Their wrangling with each other may prevent any policy from being adopted, which would generate the worst possible result, namely z. ... However, if we take note only of unanimous agreements, we could note that in the Pareto ranking x and y would remain unranked, whereas x and y would both be placed socially higher than z. The discipline of maximal choice would then give us good reason to choose either x or y, but absolutely shun z.” The two factions don't need to resolve which policy is better -- they already unanimously agree both beat the catastrophe that gridlock defaults to. Diagnostic move: when a dispute between two good options stalls decision-making and risks producing the shared-worst outcome by default, don't wait for agreement on which option is superior. Check whether both sides already agree that either option beats the default outcome. That narrower agreement is grounds enough to pick either one now -- gridlock itself is the only route to the outcome nobody wants."
