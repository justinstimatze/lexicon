    quote: "Now I rejoice at my success: a clever plan I found To rid me of my enemy by keeping my own ground."
canonical-instances:
  - "A regional retailer that loses market share to a national chain everywhere except its original neighborhood location holds that one store specifically because the staff know exactly which regular customers need a side-door delivery, which shelf gets restocked slowest, and a dozen other operational specifics the national chain's standardized playbook doesn't account for."
critical-questions:
  - "Is the falcon's death actually about terrain, or about momentum and commitment — would a falcon that dove more cautiously, or one that had scouted the same field in advance, have avoided the clod regardless of whose 'ground' it technically was?"
  - "How much of what gets called home-field advantage in other domains (sports, incumbency in negotiations, a founder's advantage in their own company) is actually this same specific, learnable terrain-knowledge, versus genuinely being about morale or comfort with no exploitable content?"
status: active
