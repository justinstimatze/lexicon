id: lex-e5bxp
name: dependents-of-two-estranged-patrons-keep-the-rift-open-without-scheming
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two powerful allies fall out, check whether a diffuse population of people dependent on both men's individual favor -- not any single scheming mediator -- is what actually prevents reconciliation, simply by each person currying favor with whichever side they're currently closest to. After Charles Sumner and President Grant became permanently estranged over the Santo Domingo annexation question, Douglass named the surrounding mechanism directly: 'Variance between great men finds no healing influence in the atmosphere of Washington. Interested parties are ever ready to fan the flame of animosity and magnify the grounds of hostility in order to gain the favor of one or the other. This is perhaps true in some degree in every community; but it is especially so of the National Capital, and this for the reason that there is ever a large class of people here dependent upon the influence and favor of powerful public men for their daily bread.' No one in this account fabricates a lie about either man or engineers the rift on purpose -- each dependent simply behaves in whatever way currently maximizes their own standing with whichever patron they favor, and the aggregate, uncoordinated effect of many people doing this independently is a standing structural pressure against reconciliation that persists even though both Sumner and Grant, left alone, might well have healed the breach themselves."
