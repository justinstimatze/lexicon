id: lex-tq3fp
name: an-absent-expected-effect-can-be-the-theoretically-important-finding
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't let a reporting standard that only publishes 'significant' results quietly discard exactly the findings that matter most theoretically — sometimes the absence of an expected relationship is the interesting discovery, and a test built to filter out non-findings will filter that discovery out along with the noise. Merton, Reader, and Kendall make this the center of their case against routine significance-test gatekeeping: 'there is a distinction to be made between the importance of a result and its statistical significance. Reliance on tests of significance generally carries with it an obligation to report only those results which meet the criteria of the tests; where a significant difference is not found the result is not presented. But this can often be quite misleading in social research. In this field some of the most important results are those in which an expected relationship is not revealed by the data. Statistically, such results are not significant; conceptually, they have great significance.' Their example makes the point concrete: 'we should expect students in the lower half of their class to be more likely than top students to favor a system of anonymous examinations in medical school. We would consider it highly significant if they did not, if in other words, there were no relationship between class standing and preferences for an examination system in which the students' anonymity is preserved.' The mechanism is a mismatch between two different senses of 'significant' that a rigid testing regime conflates: statistical significance measures whether an observed pattern is unlikely to be chance; theoretical significance measures whether a finding, present OR absent, tells you something important about how the phenomenon works. A standard practice of only reporting statistically significant results silently assumes these two senses always point the same direction — but a null finding against a strongly-predicted relationship is exactly the case where they come apart, and it's discarded by the very convention meant to protect rigor. Diagnostic move: before adopting a norm of 'only report what's significant,' identify your strongest theoretical predictions in advance — a prediction confident enough to be worth stating is also one whose failure is worth reporting, precisely because that failure would need explaining, and a suppression rule that treats all non-significant results as uninformative erases the distinction between 'we found nothing because there was nothing to find' and 'we found nothing where theory said we should have, and that gap itself needs an explanation.'"
