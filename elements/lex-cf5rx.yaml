id: lex-cf5rx
name: let-the-system-service-itself-from-its-own-existing-output
type-in: situation
type-out: composition
_tier: atomic
agent-instruction: "When a system needs an auxiliary function performed alongside its main job (feeding it, maintaining it, powering a secondary part), check whether the system's own main operation already produces something — energy, motion, a byproduct — that could be redirected to perform that auxiliary function, instead of adding a separate dedicated mechanism to do it. Altshuller names this the Self-Service Principle: 'a. The object should service itself and carry out supplementary and repair operations. b. Use should be made of the outlets (of energy, the substance).' His example is a welding gun: 'In an electric welding gun the welding rod is usually applied by a special device. The suggestion is that to apply the rod a solenoid should be used driven by the welding current' — instead of adding an independent motor or feed mechanism to advance the welding rod, the current already flowing through the gun to do the actual welding is tapped to also drive the rod-feed solenoid. The main function (welding current) and the auxiliary function (advancing the rod) stop being two separate systems needing two separate power sources; the auxiliary function is folded into an output the main function was already producing for free. Diagnostic move: before adding a new dedicated mechanism, actuator, or process to handle a support function (feeding, cooling, lubricating, logging, alerting, restocking), inventory what the main process already produces as a byproduct — heat, vibration, motion, pressure, exhaust, unused capacity, a signal — and ask whether that existing output, redirected, could perform the support function on its own, making the system self-sufficient for that function rather than dependent on a second, independently-powered mechanism."
related: [lex-652hb, lex-6xupc, lex-ne5z7, lex-spm8x, lex-vwgpx]
evokes: [self-service-principle, welding-gun-solenoid-example, use-the-outlets-of-energy, system-feeds-its-own-auxiliary-function]
lineage:
  - source: primary
    text: altshuller-1984-principle-25-self-service
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.5 'Forty Basic Methods,' Principle 25 'The Self-Service Principle.'"
    quote: "'25. The Self-Service Principle. a. The object should service itself and carry out supplementary and repair operations. b. Use should be made of the outlets (of energy, the substance). Example: In an electric welding gun the welding rod is usually applied by a special device. The suggestion is that to apply the rod a solenoid should be used driven by the welding current.'"
  - source: primary
    text: americas-test-kitchen-crosby-2012-science-of-good-cooking-concept-9-en-cocotte
    citation: "The Editors at America's Test Kitchen and Guy Crosby, The Science of Good Cooking: Master 50 Simple Concepts to Enjoy a Lifetime of Success in the Kitchen (America's Test Kitchen, 2012), Concept 9, 'A Covered Pot Doesn't Need Liquid.'"
    quote: "'Instead, juices are drawn from the meat into the pot. These juices eventually create a moist-heat environment, so that the meat cooks gently—in effect, braising in its own juices. The result is unbelievably tender and flavorful meat undiluted by additional liquid.' ... 'it's the pot's tight-fitting lid that allows us to trap the meat juices and mitigate total moisture loss by using these juices to produce a rich jus.'"
canonical-instances:
  - "Cooking en cocotte braises meat with no added liquid at all. A sealed pot traps the meat's own escaping juices, and those juices alone create the moist-heat environment a stock-based braise gets from an added liquid instead. Because nothing is added, the resulting jus comes out concentrated. The book's controlled test: chickens roasted in a sealed Dutch oven recovered 74 grams of juices versus 28 grams for an identical chicken in an open baking dish, and once that recovered liquid is counted back in, the sealed pot's net moisture loss (3.5 percent) was less than a third of the open dish's (9.5 percent) at the same oven temperature."
  - "A data center's servers generate waste heat that normally requires a separately-powered cooling system; a facility instead routes that same waste heat into an absorption chiller that uses the heat itself to drive the cooling cycle, so the servers' own byproduct powers part of their own climate control rather than a fully independent cooling system doing all the work."
  - "A web application needs to log usage data for later analysis, which would normally require a separate always-on logging service; instead, the application taps the request/response traffic it's already generating for its main function and streams a copy to storage, rather than standing up an independent instrumentation pipeline with its own separate triggers."
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: feedback uses a MEASUREMENT of the system's own state to adjust its own future behavior (a correction signal); this atom uses the system's own OUTPUT SUBSTANCE OR ENERGY (not a measurement) to directly power a different, auxiliary function — the welding current doesn't measure anything about the weld, it just also happens to drive the rod-feed solenoid."
critical-questions:
  - "does redirecting a byproduct to a second function create a hidden coupling — if the main function's output ever changes (the welding current fluctuates, the server heat output drops in low-traffic periods), does the auxiliary function silently degrade along with it, in a way a dedicated independent mechanism wouldn't have?"
  - "how much of the main output can be redirected before it starts robbing the main function of what it needs — is there a point where 'self-service' auxiliary use meaningfully competes with the primary function for the same energy or substance, and how would a designer know where that line is?"
  - "is there a maintainability cost to folding an auxiliary function into the main system's own output — does it become harder to diagnose, repair, or upgrade the auxiliary function independently once it's no longer a clearly separate mechanism with its own dedicated power source?"
status: active
