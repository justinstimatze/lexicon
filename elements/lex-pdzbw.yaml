id: lex-pdzbw
name: an-unknowable-deadline-defeats-last-minute-gaming-of-a-reward-system
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a reward system lets a late act of compliance fully erase a long history of violations, the obvious exploit is to hold off as long as possible and clean up right before the account closes. Fixing this doesn't require removing the late-compliance option -- it requires making the closing time of the account permanently unknowable. Lakoff's account of the theological Last Judgment names exactly this fix inside Christian moral accounting. If repentance at any point before death wipes the slate clean, the rational strategy is to sin as long as possible and repent right before dying -- 'that's not an incentive to be good; it makes sinning pay off up until you're about to die.' The Last Judgment closes the loophole not by banning late repentance but by making the exact moment the books close permanently unpredictable: it 'could happen at any time.' Once the deadline can arrive before any planned last-minute compliance, there is no longer a safe window to delay into -- the only strategy that works in every possible timeline is immediate and continuous compliance. Diagnostic move: when a reward system has a known, exploitable end-loaded loophole, check whether removing the loophole's window is actually necessary, or whether simply making the closing time unpredictable would convert delay-then-comply from a winning strategy into a gamble with no safe execution point."
related: []
evokes: [george-lakoff, moral-politics-1996, last-judgment, moral-accounting, deadline-uncertainty]
lineage:
  - source: primary
    text: lakoff-1996-last-judgment-closes-loophole
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 14 'Two Models of Christianity,' section 'Strict Father Christianity.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“This loophole is closed by the Last Judgment, the idea that, at some time which human beings cannot predict, the world will come to an end and the moral books will be closed. At that instant, you will be judged, and if you are a sinner—if you have more debits than credits at that instant—you will be forever damned to hell. Because the Last Judgment could happen at any time, the only way to guarantee that you will be able to take advantage of the deal Jesus has offered is to accept it immediately.”"
canonical-instances:
  - "The direct textual anchor, on the loophole this closes: 'Unfortunately, there is a large loophole in this contract. Allowing people to repent at any time and still go to heaven is an incentive to keep sinning as long as possible. Then, at the last minute, you can repent and go to heaven.'"
  - "Hypothetical: a company's expense-reporting system lets employees submit corrections at any time before the fiscal year closes, with no penalty for how late the correction comes. Finance notices employees routinely let small policy violations pile up all year, only cleaning them up in a rush during the last week before the books close. The next year, finance stops announcing the exact closing date in advance and instead audits a randomly chosen week each quarter, telling employees only that any quarter could be the one reviewed. Violations drop immediately, not because the penalty changed, but because there is no longer a safe week to wait for."
critical-questions:
  - "This mechanism assumes the party being deterred can't estimate the deadline's likely timing at all. If people can form even a rough probability distribution over when the deadline will fall -- more likely later in life than earlier, say -- does an unpredictable-but-estimable deadline still fully close the loophole, or does it just shift the optimal delay point rather than eliminating delay as a strategy?"
  - "An unknowable deadline forces continuous compliance only if the cost of being caught out of compliance at the deadline is severe enough to outweigh the benefit of delaying. What happens to this mechanism when the penalty for being caught non-compliant at an unpredictable audit is mild rather than total -- does deadline uncertainty alone still do the work, or does it only work paired with a sufficiently severe penalty?"
