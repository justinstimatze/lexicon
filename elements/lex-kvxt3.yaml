id: lex-kvxt3
name: the-hardest-target-to-fracture-is-the-most-valuable-one-to-acquire
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "When ranking which of several acquisition targets is worth the most effort, don't discount the one that's hardest to break apart just because it costs more to get -- the very cohesion that makes it resistant to you is what makes it valuable once you actually have it. Kautilya ranks three possible acquisitions -- an oligarchy, an army, or an ally -- and puts the hardest one first: 'Among gaining an oligarchy, an army or an ally, gaining an oligarchy is the best, because of its unassailable cohesiveness.' The reasoning depends on a claim made just before it: 'Because oligarchies are cohesive entities, enemies cannot break them [easily].' An oligarchy's collective, mutually-reinforcing leadership structure is precisely what makes it resistant to being fractured by an outside adversary -- and that resistance-to-fracture doesn't disappear once you've won it over; it transfers to you. An army or an ally can be peeled away, subverted, or made to defect by exactly the same techniques (sowing dissension, bribing a faction, exploiting rivalry) that would fail against a genuinely cohesive body. So the ranking isn't 'acquire whatever is easiest' or even 'acquire whatever produces the most immediate output' -- it's 'acquire whatever will be hardest for someone else to take away from you afterward,' and the same structural property (cohesion) determines both how hard something is to get and how hard it is to lose once you have it. Diagnostic move: when choosing which of several possible assets, alliances, or organizations to invest effort in acquiring, don't rank them purely by acquisition cost or immediate output -- ask which one, once acquired, would itself be hardest for a future rival to pry away from you using the same tactics you'd use against them, and weight that durability heavily even against a much cheaper, more fragile alternative."
