id: lex-73wdz
name: shamatha-is-staged-attentional-development-not-passive-relaxation
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When considering meditation, attention-training, or mindfulness practice, Wallace's transferable claim is that SHAMATHA — the contemplative discipline of sustained focused attention — is NOT passive relaxation, NOT a mood-state, NOT a generic 'calm your mind' practice. It is a STAGED SKILL-DEVELOPMENT path with measurable intermediate competencies, formally articulated in eighth-century Indian Buddhist sources (Asaṅga, Kamalaśīla) and consistently taught across Tibetan, early Chinese, and original Theravāda traditions. The transferable structural form: attention is a TRAINABLE FACULTY whose development passes through identifiable stages, each with a clear competency criterion that must be achieved before the next stage. Wallace synthesizes the classical nine-stage path: (1) DIRECTED ATTENTION — the practitioner places attention on a chosen object briefly; sustained attention is mostly lost; (2) CONTINUOUS ATTENTION — attention can be held for a minute; lapses begin to be noticed in their early phase; (3) RESURGENT ATTENTION — when attention lapses, it returns quickly; (4) CLOSE ATTENTION — attention is no longer lost completely, only diminished; (5) TAMED ATTENTION — gross excitation (mind-wandering toward stimulating content) is mostly subdued; subtle distraction remains; (6) PACIFIED ATTENTION — gross laxity (mental fog and dullness) is subdued; (7) FULLY PACIFIED ATTENTION — subtle excitation is subdued; (8) SINGLE-POINTED ATTENTION — attention is effortlessly sustained throughout the session; (9) ATTENTIONAL BALANCE / shamatha proper — sustained effortless attention with full clarity and stability. The transferable consequence: attention-quality is a CULTIVATED CAPACITY, not a stable personality trait or a one-time state. Practitioners moving up the stages exhibit MEASURABLY DIFFERENT attentional dynamics, recently confirmed empirically (Wallace's Shamatha Project with UC Davis; Brefczynski-Lewis et al. 2007 *PNAS* on long-term meditators). Practitioner consequences for non-meditators too: (1) treating attention as a trainable skill changes how you respond to your own distractibility (it's a competency-deficit responsive to training, not a personality defect); (2) the staged-development form is transferable to other faculty-training (musical instrument practice, athletic skill, language acquisition, professional expertise) — each has its own competency-gradient that practitioners can name and target; (3) modern 'mindfulness' practice often skips the sustained-attention foundation, producing momentary-mindfulness without the underlying attentional capacity to support deeper practice; (4) burnout, ADHD-spectrum challenges, and contemporary chronic distractibility may be partly an attentional-capacity-deficit responsive to deliberate cultivation. Distinct from lex-da3g3 iteration and lex-wgd7u prediction-error-as-learning-signal: this atom is about a SPECIFIC FACULTY (sustained focused attention) and its SPECIFIC TRAINING PATH (the nine stages), not about generic iterative practice or prediction-error learning. Composes with lex-2kjmb free-energy-principle: shamatha can be cast as a deliberate training of the attentional precision-weighting that the free-energy framework names — but the empirical practice is much older than the theoretical frame."
