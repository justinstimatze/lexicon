canonical-instances:
  - "A junior technician refuses to run a scheduled migration, unable to say exactly why beyond 'the numbers look wrong,' and a manager who overrides the objection and forces the run through loses a day's data — while a second technician, called in to investigate the same anomaly the first one flagged, would have found the same schema mismatch the chaplain found by simply looking closely at what the elephant already sensed."
critical-questions:
  - "The story validates the refusal after the fact, by way of religious lore — how should this generalize to ordinary cases where a subordinate's refusal turns out to have no real basis at all, and forcing past it would have cost nothing?"
  - "What made the chaplain investigate instead of dismissing the animal's balking as stubbornness, when the king's own instinct was to force it — is there a transferable signal that distinguishes 'worth investigating' from 'just push through'?"
