id: lex-rjgd8
name: hidden-decoy-data-turns-post-hoc-fixes-into-a-checkable-claim
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "The XENON1T dark-matter search adds a second layer on top of ordinary blind analysis. Standard blinding hides the real signal region from the analysts while they finalize their statistical model and event-selection cuts, so the model can't be unconsciously tuned toward a result the team wants to see. XENON1T goes further: before unblinding, the collaboration secretly injects an undisclosed number of known fake signal-like events -- 'salt' -- into the still-blinded dataset. Real analyses are messy, and after unblinding the team did in fact make several justified corrections to their model (fixing genuine mis-modeling problems the newly visible data exposed). That is exactly the moment where motivated reasoning has the most room to operate -- a correction that happens to boost the significance of an ambiguous event is very hard to distinguish, from the inside, from a correction that is quietly fitting noise. The salt is what makes that distinction checkable rather than a matter of self-trust: because the team doesn't know which events are real and which are planted decoys, if a post-hoc fix inflates the significance of what turns out to be salted data, that is direct, external evidence the fix was overfitting. In this run, none of the post-unblinding changes had touched the salted events at all -- the salt was revealed only after every adjustment was already frozen. Transferable move: when a process allows legitimate after-the-fact adjustments to a model or judgment once new information arrives -- exactly where good-faith correction and self-serving overfitting are hardest to tell apart from the inside -- seed the withheld information with a small number of undisclosed decoys whose true status you also don't know yet. Adjustments that happen to land on the decoys convict themselves; adjustments that don't touch them earn some of the credibility that unaided self-report can't provide."
related: [lex-bvz98, lex-tq3fp]
evokes: [xenon1t-2018-dark-matter-search, xenon-collaboration, salted-data, blind-analysis, unblinding, motivated-reasoning-self-check, decoy-events, cant-audit-yourself-from-the-inside]
