    quote: 'The boon I gave that royal deer I never will deny.'
canonical-instances:
  - "A city council grants a blanket noise-complaint exemption to a beloved local venue after a public outcry over its threatened closure. Once the exemption starts drawing envious complaints from every other business on the block, the venue's own owner gets ahead of the council being forced to revoke it, voluntarily capping late-night amplified sound to the hours the original complaints were actually about."
critical-questions:
  - "The deer has the standing and the herd's trust to impose this limit; would the same self-correction be available to a beneficiary with less authority over the group actually causing the harm?"
  - "The king's vow is framed as unbreakable even at the cost of his kingdom — is that framing doing real work here, or would a king willing to revoke the boon have made the deer's intervention unnecessary and this a non-story?"
