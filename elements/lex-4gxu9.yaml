id: lex-4gxu9
name: a-single-status-carries-multiple-conflicting-role-relationships
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone occupying one position (a job title, a family position, a public office) is being pulled in different directions, don't assume they must simply have too many separate roles — check whether the conflict is coming from ONE status's own array of role-partners, a structure Merton named the role-set. Correcting the older assumption (from Linton) that each status has one associated role, Merton states the structural fact: 'a particular social status involves, not a single associated role, but an array of associated roles... role-set, by which I mean that complement of role relationships which persons have by virtue of occupying a particular social status. As one example: the single status of medical student entails not only the role of a student in relation to his teachers, but also an array of other roles relating the occupant of that status to other students, nurses, physicians, social workers, medical technicians, etc. Again: the status of public school teacher has its distinctive role-set, relating the teacher to his pupils, to colleagues, the school principal and superintendent, the Board of Education... and the like.' This is distinct from the older idea of 'multiple roles,' which refers to a person's several different statuses (teacher, spouse, parent, party member); a role-set is the multiplicity built into just ONE of those statuses. The instability this produces has a specific structural source, not a personal one: 'the basic source of disturbance in the role-set is the structural circumstance that any one occupying a particular status has role-partners who are differently located in the social structure... The fact, for example, that the members of a school board are often in social and economic strata quite different from that of the public school teacher will mean that... their values and expectations differ from those of the teacher.' Merton then identifies mechanisms that keep role-sets from tearing status-occupants apart, two of the sharpest being differential intensity of concern (some role-partners care centrally, others only peripherally, which is why the ones who care least press least) and making hidden disagreement between role-partners visible on purpose: a status-occupant confronted with contradictory demands can act to make the contradiction manifest, which 're-directs the conflict so that it is one between members of the role-set, rather than, as was at first the case, between them and the occupant of the status' — Simmel's tertius gaudens position, converting your problem into their problem. Diagnostic use: when mapping conflicting pressure on someone in a single position, list out their actual role-set (everyone with a legitimate claim on how they perform that one status) before assuming the fix is fewer roles or better time management — the fix is often surfacing which role-partners actually disagree with each other, since making that disagreement visible to them, rather than absorbing it silently, is itself one of the structural mechanisms that relieves the pressure."
related: [lex-9nx4x, lex-arct8, lex-f82pz]
evokes: [merton-1957, role-set, linton-1936-the-study-of-man, status-set, tertius-gaudens-simmel, pluralistic-ignorance-allport, differential-power-in-role-sets]
lineage:
  - source: primary
    text: merton-1957-role-set-definition
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. IX 'Continuities in the Theory of Reference Groups and Social Structure,' p.369, correcting Ralph Linton, The Study of Man (New York: Appleton-Century, 1936). Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'a particular social status involves, not a single associated role, but an array of associated roles. This is a basic characteristic of social structure. This fact of structure can be registered by a distinctive term, role-set, by which I mean that complement of role relationships which persons have by virtue of occupying a particular social status. As one example: the single status of medical student entails not only the role of a student in relation to his teachers, but also an array of other roles relating the occupant of that status to other students, nurses, physicians, social workers, medical technicians, etc.'"
  - source: primary
    text: merton-1957-structural-source-of-role-set-instability
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), Ch. IX, p.370."
    quote: "'the basic source of disturbance in the role-set is the structural circumstance that any one occupying a particular status has role-partners who are differently located in the social structure. As a result, these others have, in some measure, values and moral expectations differing from those held by the occupant of the status in question. The fact, for example, that the members of a school board are often in social and economic strata quite different from that of the public school teacher will mean that, in certain respects, their values and expectations differ from those of the teacher.'"
  - source: primary
    text: merton-1957-making-role-set-conflict-manifest
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), Ch. IX, p.377, describing the tertius gaudens mechanism and Floyd H. Allport's concept of pluralistic ignorance."
    quote: "'Confronted with contradictory demands by members of his role-set, each of whom assumes that the legitimacy of his demands is beyond dispute, the occupant of a status can act to make these contradictions manifest. To some extent, depending upon the structure of power, this re-directs the conflict so that it is one between members of the role-set, rather than, as was at first the case, between them and the occupant of the status.'"
canonical-instances:
  - "A middle manager reporting to one boss is nonetheless pulled between that boss's priorities, the expectations of the team members below them, the demands of a partner department, and HR policy — this is not 'having too many roles,' it is the single status of 'manager' carrying one role-set with several structurally distant role-partners, exactly like Merton's schoolteacher caught between the school board and professional colleagues."
  - "A city council member facing conflicting pressure from a neighborhood association, the mayor's office, a state regulator, and local business owners relieves some of the pressure not by picking a side privately but by holding a public hearing that puts the neighborhood association and the business owners in direct, visible disagreement with each other — the tertius gaudens move, converting a many-against-one structure into a fight among the role-set's own members."
critical-questions:
  - "Merton lists several distinct mechanisms for managing role-set conflict (differential involvement, differential power and coalition, insulation from observability, making conflicts manifest, professional codes providing peer support, and abridging the relationship entirely) — how would someone in an unstable role-set actually choose among these, and are some mechanisms only available to high-power status-occupants while others are the only options left to low-power ones?"
  - "The tertius gaudens move (making role-set contradictions visible) is presented as relieving pressure on the status-occupant, but doesn't it also require the status-occupant to have enough standing to force the disclosure without being blamed for airing the conflict in the first place — what happens when a low-power status-occupant tries this and the disagreeing role-partners simply unite against them instead of turning on each other?"
status: active
