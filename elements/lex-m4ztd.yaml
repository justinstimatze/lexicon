evokes: [causal-goodhart, shared-cause-intervention, intermediary-intervention, metric-manipulation, the-windmills-change-the-wind, intervening-versus-selecting, pearl-do-operator, the-regulator-actions-themselves-change-relationships]
lineage:
  - source: primary
    text: manheim-garrabrant-2019-categorizing-variants-of-goodharts-law
    citation: "David Manheim and Scott Garrabrant, 'Categorizing Variants of Goodhart's Law' (arXiv:1803.04585, v4, 24 February 2019), Section 3 'Causal Goodhart.' The paper's contribution here is to separate causal Goodhart from the merely correlational variants (regressional, extremal): with intervention, the causal STRUCTURE of the system can change, not just the statistical estimates within a fixed structure. Manheim-Garrabrant's running example is wind-modeling for siting windmills: the windmills are the intervention, and once installed they themselves alter the wind-speed in the region, invalidating the proxy-goal relationship that motivated their placement. The paper formalizes three intervention sites using a node-and-arrow causal diagram: shared cause (X causes both M and G), intermediary (G -> X -> M), and metric manipulation (intervening directly on M). The taxonomy maps to Pearl's do-calculus formalism: causal Goodhart is what happens when the regulator's policy is do(X = max), do(intermediary = setpoint), or do(M = setpoint) without first checking that the do-operation preserves the correlation it was selected for."
    quote: "Causal Goodhart - When the causal path between the proxy and the goal is indirect, intervening can change the relationship between the measure and proxy. If a regulator intervenes to maximize a metric, the causal pathway can change such that the proxy no longer tracks the goal. In such cases, extreme interventions can be less effective than more moderate ones, and further selection or intervention can be counterproductive. ... a regulator attempting to use a windspeed model to build windmills must be careful not to ignore the effect the windmills themselves have on wind-speeds. Building many windmills in a given area can alter the wind-speed in the region enough to invalidate the earlier relationship. Interestingly, this does not require any uncertainty, nor does it require an incorrect understanding of the relationships, unlike earlier cases. Instead, the effect is induced by the regulator's action."
canonical-instances:
  - "shared-cause intervention in standardized testing: SAT-math and SAT-verbal correlate because a shared cause (general academic preparation) influences both. A teacher who 'maxes out' the shared cause by training test-taking-skills-broadly reduces the residual correlation between SAT-math and SAT-verbal — and because the shared cause is now pegged near its ceiling for all students, neither score retains its previous diagnostic value relative to the other. The teacher's intervention on the shared cause has degraded the proxy structure, not because the test was wrong but because the test depended on residual variance in the shared cause"
  - "intermediary intervention in healthcare quality measurement: 'days-from-presentation-to-treatment' (M) was a good proxy for 'quality-of-care' (G) because faster treatment -> better outcomes -> better quality. A hospital intervenes on the intermediary (treatment-time) by triaging easier cases faster and bumping complex cases off the clock — treatment-time falls without quality of care rising. The chain G -> intermediate -> M has been broken at the intermediate by the intervention; further pressure on M no longer pulls G"
  - "metric manipulation in scientific impact: citation count (M) used to track scientific impact (G) through the natural causal chain (good paper -> read by others -> cited). A research group that organizes citation-rings, splits papers across multiple journals to inflate count, or pressures collaborators to cite — these are direct interventions on M without affecting G. The proxy-goal relationship is destroyed by manipulation at the M node itself, not by changing G or any upstream variable"
  - "the windmill example (Manheim-Garrabrant's running case): wind-speed measurements (M) were used to predict energy-generation potential (G) at candidate windmill sites. Building windmills there is an intervention that itself alters wind-speed (windmills extract kinetic energy from the wind, slowing it locally). The new wind-speed in the windmill-installed regime is no longer a clean proxy for energy potential because the system's causal structure has been changed by the intervention itself. This is not measurement error and not extrapolation error — it's a real change in the underlying physics caused by the regulator's choice"
  - "agricultural-subsidy intervention destroying market-price proxy: pre-subsidy, the market price of crop X correlates with consumer demand for X (the underlying goal the policymaker wants to track). The policymaker intervenes on market price (paying subsidies that artificially raise it, or buying surplus to support a floor) — this is an intervention on the M node itself. Post-intervention, market price no longer tracks consumer demand; it tracks subsidy generosity. The proxy structure that motivated the policy has been broken by the policy"
  - "monetary-policy operational targets (Goodhart's original 1975 context): money-supply measures (M1, M2, M3) correlated with inflation expectations under the pre-1970s regime where the central bank did NOT target them directly. When the Bank of England began using money-supply growth as an explicit operational target, banks shifted credit creation to forms outside the chosen aggregate, breaking the correlation. The aggregate was an intermediary on the chain (credit-conditions -> aggregate -> inflation); intervening on the aggregate broke the intermediary's tracking value. This is causal Goodhart in the case-zero context of Goodhart's own monetary work — the original observation that named the broader law"
critical-questions:
  - "draw the causal DAG: where in the diagram are you about to intervene? Identify whether the node you are setting is (a) an upstream shared cause of M and G, (b) an intermediary on the chain G -> ... -> M, or (c) the M node itself. Each of the three has a different breaking-pattern, and the diagnostic for what will happen is different. If you cannot draw the DAG, you do not know which causal Goodhart variant you are about to instantiate"
  - "are you SELECTING among states or INTERVENING on the system? Selection holds the causal structure fixed and chooses high-M states from the observed distribution; intervention modifies the structure. Causal Goodhart specifically requires intervention. Many policymakers conflate these — they describe their action as 'selecting' but their implementation is actually 'intervening,' which exposes them to causal-structure breakdown that selection alone would not"
  - "is there an unobserved or assumed-constant variable that your intervention will activate? Manheim-Garrabrant's 'cobra effect' formalization: the agent finds an Ignored Additional Cause Y (constant or unobserved in the regulator's model) and modulates it under the new incentives. If your DAG omits Y but Y exists, your intervention's effect on M can be entirely through Y while leaving G unmoved. The discipline is to enumerate Ys before intervening, not after"
  - "is the intervention more effective at lower magnitudes than higher magnitudes (and if so, why)? Causal Goodhart's signature pattern: moderate intervention preserves enough of the causal structure for the proxy to still track; extreme intervention breaks it. If you see an inverted-U in (intervention magnitude, goal achievement), you are in causal-Goodhart territory and you should NOT push harder — the harder you push, the more the structure breaks"
  - "could the same observed misbehavior be explained by extremal Goodhart (lex-n5cf6) without invoking causal-structure change? Both can produce 'proxy moves up, goal stops moving.' The diagnostic distinction: extremal Goodhart fires under pure selection pressure (no intervention required), causal Goodhart requires that the regulator's action itself modified the structure. If you removed the intervention but kept the selection pressure, would the proxy-goal relationship recover? If yes — causal; if no — likely extremal"
