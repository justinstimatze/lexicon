id: lex-hsnup
name: self-critique-against-an-explicit-rule-set-then-revise
type-in: process
type-out: composition
_tier: atomic
agent-instruction: "When an agent's own output must be improved against a STANDARD THAT CAN BE WRITTEN DOWN AS A SHORT LIST OF PRINCIPLES, the transferable structure is a three-step LOOP: (1) the agent emits a candidate output; (2) the agent applies the explicit rule-set as a CRITIQUE step — `where does this output violate principle P_i?` — producing a list of specific objections; (3) the agent REVISES the output to address each surfaced objection, then the loop can iterate. The pattern is distinct from generic iteration (lex-da3g3, which has no rule-set), from checklist-tick-off (single-pass; no output-transformation), from inversion (lex-kdj8h, which reframes the question without revising prior output), and from pre-mortem (lex-eb3wf, which forecasts failure modes before action rather than critiquing after-the-fact-generated output). Three indispensable features: (a) THE RULES ARE EXTERNAL TO THE GENERATOR — written, enumerable, audit-able by a third party, not held implicitly in the generator's intuitions; this is what allows scaling across instances and across reviewers; (b) THE CRITIQUE STEP IS NAMED AS ITS OWN MOVE — not folded into the generation step — which forces the agent to read its own output through the rule-set rather than producing a `revised` output that ignores what was actually said; (c) THE REVISION IS DOWNSTREAM OF THE CRITIQUE — the revise step has a concrete list of objections to address, not a vague `make it better`. Canonical instances spanning ~500 years and many domains: (i) Bai et al. 2022 *Constitutional AI* — the LLM instantiation: principles drawn from a short `constitution` steer a self-critique-revise loop on the model's own outputs during training (`Critique Request: identify specific ways in which the assistant's last response is harmful...` followed by `Revision Request: please rewrite the assistant response to remove any and all harmful... content`); the loop is run automatically across hundreds of thousands of prompts, producing the supervised-fine-tune data without per-output human labels. (ii) Ignatius of Loyola 1548 *Spiritual Exercises* — the daily *Examen*: review the day's actions, compare to the rule (Christ's example + the order's rule), confess deviations, resolve revisions for tomorrow; the rule-set is written and short (~5 steps in Loyola's formulation), the loop runs daily, and the revisions are tracked over weeks. (iii) Atul Gawande 2009 *Checklist Manifesto* operates a related cousin — surgical and aviation checklists run a one-pass critique (`did we do each step?`) but in surgical safety the Pause-and-Read-the-Checklist before incision is structurally the same critique-step over the team's joint state, with revision happening immediately when violations surface. (iv) Code review against an explicit style guide (Google's *Software Engineering at Google* 2020, *Python PEP 8*, internal company guides): the author's draft is the candidate; the reviewer reads it against the style-guide rules; the author revises against the surfaced objections; the loop iterates until pass. (v) Editorial copyediting against a house style sheet (*Chicago Manual of Style*, *AP Stylebook*): same shape — draft → critique against rules → revise → iterate. (vi) Workshop critique (writing programs, design crits, academic peer review): the work is presented; participants apply the rules of the critique tradition (clarity, evidence, originality, scope-honesty); the author revises in response. (vii) Self-assessment against a rubric (educational + competency frameworks): student grades own work against the rubric, surfaces gaps, revises before submission. The transferable claim is that THIS THREE-STEP LOOP — explicit-rules + critique-step-named-separately + revision-keyed-to-surfaced-objections — produces durable improvement of an agent's own output WITHOUT requiring an external grader at each iteration, scales to high volumes because the rules are external + portable, and is auditable because each revision can be traced to a critique-step objection. Practitioner discipline three-part. FIRST: WHEN AN OUTPUT NEEDS TO BE IMPROVED AGAINST A KNOWABLE STANDARD, DON'T FOLD THE STANDARD INTO INTUITION — write the rule-set down, even if short. The act of writing it externalizes the standard, makes it shareable, and lets the critique step actually engage the rules rather than vibes. SECOND: NAME THE CRITIQUE STEP SEPARATELY from generation and from revision. Conflating critique with revision (`just make it better`) loses the diagnostic information; the agent silently overwrites flaws rather than addressing them. The Bai 2022 prompt design — explicit `Critique Request:` then `Revision Request:` — encodes this discipline. THIRD: ITERATE WHEN THE FIRST PASS LEAVES OBJECTIONS UNADDRESSED. The Bai 2022 finding that the first revision usually catches most flaws but subsequent revisions sometimes catch more is the empirical confirmation of this discipline; the *Examen* iteration over weeks does the same at a slower cadence. Distinct from lex-eb3wf prospective-hindsight-as-failure-mode-elicitation (Klein 2007 pre-mortem): pre-mortem forecasts failure modes BEFORE acting; this atom critiques generated output AFTER drafting; the failure space (potential futures) vs the actual draft is the difference. They compose — a pre-mortem can be one source of rules for a critique step. Distinct from lex-da3g3 iteration: iteration is the bare loop-with-feedback; this atom specifies (a) the feedback comes from an explicit rule-set and (b) the loop has a named critique stage. Iteration without a rule-set is searching by gradient; this atom is searching by rule-violation. Distinct from lex-mthv9 hexis-character-as-habituated-disposition (Aristotle): hexis is the LONG-RUN result of repeated practice; this atom is the SHORT-LOOP mechanism (critique-revise) that produces the practice. Habituation operates over many loop-cycles. Distinct from lex-jbegr phronesis-practical-wisdom-in-particulars (Aristotle): phronesis is judgment in particulars without explicit rules; this atom is the opposite — agent uses explicit rules to critique. They compose: a phronetic actor can still run this loop against explicit guidelines while exercising judgment about which guideline matters in this case. Distinct from lex-kdj8h invert-the-problem (Munger/Jacobi): inversion REFRAMES the question (`what would guarantee failure?`); this atom IMPROVES a draft against rules. They compose: a rule-set can be derived by inversion (`don't do X` rules are inverted forms). Distinct from lex-peqcm deceptive-alignment-when-the-mesa-optimizer-games-selection-then-defects: deceptive-alignment is the failure mode where the agent produces critique-passing outputs while not actually internalizing the constitution; this atom names the constructive structure that deceptive-alignment threatens. They are dual — the structure (lex-hsnup) and one of its known failure modes (lex-peqcm). Distinct from lex-ew7zx explicit-state-as-object: lex-ew7zx is a software-engineering pattern at the type-system layer; this atom is a process pattern at the agent layer. They share the move `make-implicit-state-explicit` but operate on different objects. Transferable applications beyond Bai 2022 + Examen + checklists + code review + copyediting + workshop + rubric: (a) AI safety more broadly — RLAIF + RLHF (lex-peqcm is the failure-mode atom; this is the structure they share); (b) regulatory compliance — agent generates filing → compliance officer applies regulation against draft → agent revises; (c) legal brief drafting — paralegal drafts → senior attorney critiques against rules-of-civil-procedure → paralegal revises; (d) medical case write-up — resident drafts → attending critiques against standard-of-care → resident revises; (e) academic peer review iterated revisions against reviewer comments; (f) software security review with checklist of known vulnerability classes; (g) self-coaching against a personal `code` (Marcus Aurelius's *Meditations* Book I is a written rule-set used as the morning-and-evening critique against the day's actual conduct; the practice is structurally identical to the Examen even though Marcus pre-dates Loyola by ~1400 years). Failure modes: (1) RULES TOO VAGUE TO CRITIQUE AGAINST (`be a good writer` doesn't generate concrete critiques; `vary sentence length` does) — the critique step degrades to vibes; FIX: tighten the rules to surface-able predicates. (2) CRITIQUE-CONFLATED-WITH-REVISION (the agent silently rewrites without surfacing what was wrong) — diagnostic information is lost; FIX: force the critique step to produce a list of named objections before the revision step starts. (3) RULE-SET CAPTURES ONLY VISIBLE-DEFECTS, NOT STRUCTURAL ONES (the constitution catches surface-harm phrasing but not underlying mistakes of reasoning) — output passes critique while remaining defective; FIX: add structural-quality rules and audit how often deep flaws survive. (4) DECEPTIVE-ALIGNMENT (lex-peqcm) — agent learns to produce critique-passing outputs while NOT internalizing the rules; FIX is upstream of this atom (the atom describes the structure; lex-peqcm names the threat). (5) RULE-SET DRIFT — over time the rules accumulate special cases until the critique becomes unworkable (a known failure mode of software style guides + tax codes + religious orders' rules over centuries); FIX: periodically prune the rule-set back to transferable principles. (6) RUNAWAY ITERATION — the agent loops forever because some rule is impossible to satisfy or because critique is too sensitive; FIX: bound iterations + accept that some objections may remain after final revision. Use the atom when: (i) you're designing a training procedure, review process, or quality system for an agent that must produce outputs improvable against a knowable standard; (ii) you're auditing an existing process for whether the critique step is separated from revision; (iii) you're under-resourced for per-output human supervision and need a structure that scales; (iv) you want auditability — each revision should be traceable to a critique-step objection."
