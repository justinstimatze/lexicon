name: the-groups-own-celebration-masks-the-danger-outsiders-can-already-see
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a group is fully absorbed in a shared celebration, don't assume their own alertness is a reliable warning system -- the very noise, light, and focus that makes the celebration enjoyable is often exactly what prevents the group from noticing a threat that outside observers have already spotted and are reacting to. In Zitkála-Šá's telling, field mice feast and dance inside a lit buffalo skull on the open prairie while a predator's glowing eyes approach steadily from the tree line. The danger is visible the whole time, to everyone except the mice: sleepy birds are 'disturbed by the unaccustomed fire,' and a pack of wolves, 'fearing to come nigh this night fire, stood together a little distance away' and 'howled and yelped most dismally' -- an unambiguous signal from creatures with every reason to know a predator is near. But 'even the cry of the wolves was unheeded by the mice within the lighted buffalo skull,' who only discover the danger the instant the predator's eyes appear directly in their own eye-sockets, with no time left to do anything but scatter. The structure is precise: the warning signs were real, external, and correctly interpreted by other parties the entire time the mice were dancing -- the mice's own celebration wasn't a failure to notice a subtle signal, it was an active barrier (noise, light, focus inward) that prevented an unambiguous, already-legible signal from reaching them until it was almost too late. Diagnostic move: when your own group is fully absorbed in a shared activity, don't rely solely on internal vigilance to catch approaching danger -- deliberately check what outside parties who aren't distracted by the same activity are doing or reacting to, since their behavior can carry a warning your own group's absorption is actively filtering out."
