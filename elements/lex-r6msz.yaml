id: lex-r6msz
name: self-copying-mechanism-spreads-a-trait-despite-fitness-cost
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Apply this when evaluating whether a trait, gene, module, or behavior will spread through a population by ordinary differential-survival selection (variation + selection + inheritance, lex-nfdyv) or by a categorically different route. Esvelt et al.'s mechanism: a genetic element engineered (or naturally evolved) to cut the corresponding location on the OTHER copy of a chromosome pair whenever it is present in only one copy. The cell's own DNA-repair machinery, needing a template to fix the cut, uses the element's own sequence -- so it copies itself onto the previously-unmodified chromosome as a side effect of ordinary repair. This converts what would normally be a coin-flip chance of inheritance (each parent passes on only one of two chromosome copies) into near-certain inheritance every generation. The critical implication: because the copying happens WITHIN a single organism's cells during reproduction, BEFORE selection ever gets a chance to act on the resulting offspring, the mechanism can drive a trait to near-fixation across a population even when that trait measurably reduces the fitness of every individual that carries it -- ordinary selection, which operates on whole organisms across generations, is simply too slow and too indirect to out-compete a mechanism operating within the reproductive machinery itself. Practitioner move: when you observe a trait, meme, module, or design pattern spreading and ask 'this must be good for the things that carry it, or selection would remove it' -- check first whether a copying/hijacking mechanism inside the unit of reproduction itself could be forcing propagation independent of, or even against, the interests of the carrier. Self-copying-during-replication and selection-after-replication are different engines, and the first can overpower the second."
related: [lex-mwgep, lex-nfdyv, lex-uh48q]
scaffolds-from: [lex-nfdyv]
evokes: [homing-endonuclease, gene-drive, super-mendelian-inheritance, repair-machinery-hijacking, spread-despite-fitness-cost, self-propagation-bypasses-selection]
lineage:
  - source: primary
    text: esvelt-smidler-catteruccia-church-2014-concerning-rna-guided-gene-drives
    citation: "Kevin M. Esvelt, Andrea L. Smidler, Flaminia Catteruccia, and George M. Church, 'Concerning RNA-guided gene drives for the alteration of wild populations,' eLife 2014;3:e03401, DOI: 10.7554/eLife.03401. Open-access feature article. Section 'Natural gene drives' / 'Endonuclease gene drives' (pp. 2-3): the paper's foundational mechanism, predating and motivating its own proposal to build such drives using the newly-discovered CRISPR-Cas9 nuclease. The authors are explicit that the copying mechanism is what lets the trait spread AGAINST individual-level natural selection -- 'these genes can drive through a population even if they reduce the reproductive fitness of the individual organisms that carry them' -- which is the atom's transferable core: a within-generation copying mechanism can override between-generation selection because it acts earlier and faster than selection can respond. Figure 1 (referenced in the quote below) diagrams the exact molecular sequence: cut, template-directed repair, copy."
    quote: "Natural homing endonuclease genes exhibit drive by cutting the corresponding locus of chromosomes lacking them. This induces the cell to repair the break by copying the nuclease gene onto the damaged chromosome via homologous recombination... The copying process is termed 'homing', while the endonuclease-containing cassette that is copied is referred to as a 'gene drive' or simply a 'drive'. Because copying causes the fraction of offspring that inherit the cassette to be greater than 1/2..., these genes can drive through a population even if they reduce the reproductive fitness of the individual organisms that carry them. Over many generations, this self-sustaining process can theoretically allow a gene drive to spread from a small number of individuals until it is present in all members of a population. [...] When an organism carrying an endonuclease gene drive (blue) mates with a wild-type organism (grey), the gene drive is preferentially inherited by all offspring... Endonuclease gene drives are preferentially inherited because the endonuclease cuts the homologous wild-type chromosome. When the cell repairs the break using homologous recombination, it must use the gene drive chromosome as a repair template, thereby copying the drive onto the wild-type chromosome."
canonical-instances:
  - "Companion atom lex-uh48q (same source): the two are complementary but independently mintable -- this atom explains the SPREAD mechanism (why a trait propagates despite fitness cost); lex-uh48q explains a design principle for COUNTERING that spread mechanism once released."
  - "The paper's own defining passage: copying causes 'the fraction of offspring that inherit the cassette to be greater than 1/2 ... these genes can drive through a population even if they reduce the reproductive fitness of the individual organisms that carry them.' The mechanism explicitly overrides, rather than results from, natural selection at the individual level."
  - "Natural precedents the paper itself cites as cross-attestation, independent of any engineering: segregation distorters that destroy competing chromosomes during meiosis, transposons that insert copies of themselves elsewhere in the genome, Medea elements that eliminate siblings who do not inherit them, and heritable Wolbachia microbes -- all naturally-evolved instances of the same structural trick (bias your own inheritance odds via a within-generation mechanism) predating any human engineering of it."
  - "Software/memetic generalization: a self-installing browser extension or app component that, once present on a device, silently re-installs itself or propagates to new devices via shared infrastructure (a synced account, an auto-update channel) spreads at a rate set by its own copying mechanism, not by how many users would deliberately choose to install it if asked -- the copying-before-choice structure is the same shape as the biological mechanism, and can persist even when most individual users would prefer to remove it, for exactly the same reason: the propagation channel bypasses the selection channel (deliberate user choice) that would otherwise cull it."
  - "Contrast with ordinary Mendelian inheritance and ordinary natural selection (lex-nfdyv): in the standard picture, whether a trait spreads is decided AFTER the fact, across many generations, by whether organisms carrying it survive and reproduce more. This mechanism decides the outcome BEFORE that check ever runs, inside the reproductive cells of a single organism, by rigging the coin-flip itself -- selection is not overridden by being outcompeted, it is bypassed by never getting a chance to apply to the relevant step."
critical-questions:
  - "Does this mean natural selection has no effect on a self-copying element at all? No -- selection still acts on OTHER traits and can act on the element itself if it is costly enough or if resistance alleles arise (the paper discusses documented cases of drive-resistant alleles emerging). The claim is narrower and more specific: the copying mechanism gives the element a large enough per-generation inheritance advantage (near 100% vs. the normal 50%) that it can reach fixation faster than ordinary selection against its fitness cost can remove it, not that selection is powerless in every case or over every timescale."
  - "Is 'spreads despite fitness cost' the same claim as lex-rnftn instrumental-convergence (AI subgoals that emerge regardless of an agent's final goal)? No -- lex-rnftn is about a goal-directed OPTIMIZING agent converging on the same intermediate goals across different final goals; this atom's mechanism has no optimizer and no goal at all, only a molecular copying trick exploiting an organism's own DNA-repair response. The surface resemblance ('this keeps happening regardless of what would otherwise be favored') masks a completely different causal engine -- optimization-pressure-toward-convergent-subgoals versus mechanical-hijacking-of-a-repair-process."
  - "How is the mechanism different from lex-mwgep's positive-feedback lock-in (e.g. QWERTY)? lex-mwgep's mechanism operates BETWEEN independent adopters choosing to conform to an existing standard (network effects, switching costs) -- it requires many separate choosing agents. This atom's mechanism operates WITHIN a single organism's own cells during its own reproduction, requiring no choice, coordination, or awareness from any other organism at all. lex-mwgep can in principle be resisted by enough adopters coordinating to switch simultaneously; this atom's mechanism cannot be resisted by carrier coordination because the carriers never get a vote -- the coin is rigged before the toss, not after enough people have already called heads."
