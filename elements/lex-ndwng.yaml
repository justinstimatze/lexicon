id: lex-ndwng
name: a-particular-attachment-is-the-first-rung-not-the-destination
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When you notice a strong, specific attachment to one particular thing -- one person, one codebase, one team, one book, one craft technique -- do not treat the attachment's object as either arbitrary (to be dismissed as mere accident of exposure) or as the final destination of the feeling (something to be defended and clung to as-is). Consider Diotima's technique from the Symposium for deliberately using a particular attachment as the first rung of a disciplined ascent toward something more general. Her sequence, stated as a method rather than a metaphysical claim: begin by loving one beautiful form; notice that the beauty in that one form is akin to the beauty in other forms, and so become a lover of beautiful forms generally rather than fixating on the original one; then notice that beauty of character/mind matters more than beauty of outward form, and redirect attention there; then notice that the beauty of institutions and practices is of the same family as the beauty of a person's character, and extend the love to those; then notice that the beauty of bodies of knowledge (sciences) is of that same family, and extend it further; at each step 'using these as steps only, and from one going on to two, and from two to all fair forms, and from fair forms to fair practices, and from fair practices to fair notions.' Two things distinguish this from either flat generalization-for-its-own-sake or simple loss of the original attachment: first, each step does not require abandoning or refuting the earlier one -- the particular attachment is not exposed as an error, it is used as fuel, 'a violent love of the one' that gets 'abated' and redirected rather than extinguished; second, the ascent is deliberate and effortful ('he who would proceed aright in this matter should begin in youth'), not something that happens automatically merely by having many attachments over time -- someone can stay stuck loving only the one particular thing indefinitely, treating it as a terminus rather than a rung, and the technique is precisely the noticing-and-redirecting move at each stage. Portable beyond eros: a programmer's specific devotion to one codebase, if used as a rung, becomes an appreciation for well-structured systems in general, then for the practices that produce them, then for the underlying principles of good design -- without the original codebase needing to be dismissed as merely incidental; a reader's attachment to one favorite author can become, by the same deliberate move, an attachment to the qualities that made that author's work good, then to the tradition or genre exhibiting those qualities, then to the general principles of the craft -- again without requiring the original author to be devalued. Scope and diagnostic: the technique requires actually performing the abstraction at each stage (asking 'what is it about this particular thing that draws me, and where else does that same quality appear?'), not merely acquiring additional particular attachments alongside the first one -- collecting many favorite codebases or many favorite authors without ever asking what they share is not the ascent Diotima describes; it is horizontal accumulation, not the vertical, generalizing climb."
related: [lex-xcaqj, lex-4yhqs, lex-m8j35]
evokes: [using-these-as-steps-only, beauty-absolute-separate-simple-and-everlasting, a-violent-love-of-the-one, from-fair-practices-to-fair-notions]
lineage:
  - source: primary
    text: plato-c385bce-symposium-diotima-ladder-of-love
    citation: "Plato, Symposium 210a-211c (Jowett translation, Standard Ebooks Dialogues compilation). Diotima's account of the ascent of love, spoken through Socrates."
    quote: "He who has been instructed thus far in the things of love, and who has learned to see the beautiful in due order and succession... For he who would proceed aright in this matter should begin in youth to visit beautiful forms; and first, if he be guided by his instructor aright, to love one such form only -- out of that he should create fair thoughts; and soon he will of himself perceive that the beauty of one form is akin to the beauty of another; and then if beauty of form in general is his pursuit, how foolish would he be not to recognize that the beauty in every form is one and the same! And when he perceives this he will abate his violent love of the one... and will become a lover of all beautiful forms... using these as steps only, and from one going on to two, and from two to all fair forms, and from fair forms to fair practices, and from fair practices to fair notions, until from fair notions he arrives at the notion of absolute beauty, and at last knows what the essence of beauty is."
canonical-instances:
  - "The direct textual anchor: Diotima's ladder, in which love of one beautiful body becomes, by deliberate successive steps, love of beautiful bodies generally, then of beautiful souls, then of beautiful practices and laws, then of beautiful sciences, culminating in the vision of beauty itself -- each step using the previous one as a rung, not discarding it as an error."
  - "A programmer's specific devotion to one codebase, used as a rung, becomes an appreciation for well-structured systems in general, then for the design practices that produce them, then for the underlying principles -- without the original codebase needing to be dismissed as merely incidental."
  - "A reader's attachment to one favorite author becomes, by the same deliberate move, an attachment to the qualities that made that author's work good, then to the tradition exhibiting those qualities, then to the general principles of the craft."
critical-questions:
  - "isn't this just generalization, i.e. lex-xcaqj (generalize-then-instantiate)? No -- lex-xcaqj is a problem-solving technique: solve the general case first because it is often easier, then specialize back down to the concrete instance you actually need. This atom runs the opposite direction and for a different purpose: it starts from an already-felt particular attachment and climbs toward generality as a deliberate developmental practice, using the felt energy of the original attachment as fuel at every step, not as a detour to make a specific problem easier to solve."
  - "isn't this the same as lex-m8j35 (deliberate-perspective-scale-shift)? No -- that atom is about zooming out in SCALE (time, magnitude) to change how heavy a concern feels. This atom is about ascending a hierarchy of GENERALITY (from one instance, to a class of instances, to the shared quality behind the class), which is a different axis than scale, and the goal is enrichment/development of an attachment rather than reduction of its weight."
  - "does this mean the original particular attachment doesn't really matter, or was arbitrary? No -- the technique explicitly does not require treating the first rung as an error or accident; Diotima says the climber 'uses these as steps,' not that he discovers his starting point was a mistake. The particular attachment remains the entry point and the source of motivating energy throughout the ascent."
  - "how is this different from simply having many attachments over a lifetime? Collecting additional particular attachments side-by-side (loving many codebases, many authors) without asking what they share is horizontal accumulation, not the ascent this atom names. The diagnostic test is whether the person has performed the abstraction step -- explicitly asked what quality the particular instances share and redirected attention toward that quality -- at each stage."
  - "is this a claim that a general or abstract love is superior to a particular one, in the sense of replacing it? The Symposium's own framing treats the ascent as a developmental sequence within one person's practice over time, not as a hierarchy of superior versus inferior objects available to be chosen between at a single moment; the atom is agnostic about whether staying at an earlier rung is a defect, only that ascending is available and requires this specific move."
