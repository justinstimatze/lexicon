id: lex-uf24v
name: victory-song-thanks-the-defeated-enemy-by-name-for-a-mock-gift
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A post-battle victory song can address the named, defeated enemy directly, thanking him ironically for the weapons and horses his defeat yielded, as though he had given them freely, converting looted spoils into an object of mocking gratitude rather than framing the victory around his suffering or death. Singing over the aftermath of Little Bighorn, Black Elk's people address Custer -- Long Hair -- by name and in second person, as if he were a generous host rather than a slain enemy: 'Long Hair, guns I had none. You brought me many. I thank you! You make me laugh!' The same structure repeats for horses. The song never mentions his death, his suffering, or the battle's violence directly -- it stages the entire outcome as an unwitting act of generosity from the man they killed, addressed to him as though he could still hear the thanks."
