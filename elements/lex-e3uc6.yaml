canonical-instances:
  - "The article's own framing of the whole piece, stated in its opening summary, names the contrast directly: 'Read on to learn about how Freeside found abundance rather than tragedy of the commons.' The classic tragedy-of-the-commons diagnosis assumes individually-rational actors will overconsume a resource nobody owns; this atom's mechanism is closer to the opposite move -- eliminating individual ownership on purpose, rather than trying to assign or enforce it, and finding that the disputes tragedy-of-the-commons theory predicts don't materialize when there's no individual claim left for anyone to defend or violate."
  - "Hypothetical: a shared office kitchen where everyone labels their own food with their name generates constant passive-aggressive notes and theft accusations. A team that instead adopts a fully communal snack budget -- no individually-labeled items, anyone restocks from a shared fund, anyone can use or toss anything -- finds the disputes disappear, not because people became more honest, but because there's no longer an individual claim for anyone to violate."
  - "operationally distinct from lex-vqmn8 (shared-immaterial-goods-multiply-rather-than-divide): that atom is about NON-RIVALROUS goods (understanding, trust, love) whose total quantity actually grows with more participants, so division is simply the wrong model to apply. This atom is about a genuinely rivalrous, consumable resource (groceries) where division would normally be the correct model, and the group's deliberate refusal to divide it anyway traced the disputes back to the division attempt itself, not to any real scarcity underneath."
critical-questions:
  - "full pooling worked here inside a small, cohesive group (14 people) who had opted into living together -- does the mechanism scale to larger or less voluntarily-associated groups, where free-riding (someone consuming far more than their share while contributing nothing) might not resolve itself the way this account suggests, absent the social cohesion this group already had?"
  - "the technique removes disputes over CONSUMPTION, but the article notes one person did all the weekly shopping and grew 'good at it' -- does full pooling of consumption quietly leave the LABOR of provisioning unevenly and informally distributed, trading one kind of potential resentment (over consumption) for another (over unequal contribution) that just wasn't the one being tracked?"
