id: lex-hr3cu
name: centralized-planning-erodes-rule-of-law-and-concentrates-power
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when someone proposes comprehensive central direction of an economy, sector, or organization — a single coordinated plan allocating resources across competing uses — and defends it by pointing to its democratic mandate, its technical expertise, or its benevolent intent. Hayek's structural claim: planning of this comprehensiveness cannot be reduced to fixed, general, pre-announced rules (the Rule of Law), because an economic plan requires choosing among incompatible ends for different people — whose needs get met first, which projects get resources, whose interests are sacrificed — and only whoever holds the planning power can make and impose that choice, case by case, as circumstances arise. This is not a failure of competence or good faith; it is what comprehensive planning structurally requires. Two consequences follow, and neither is self-limiting: (1) the planning authority's power becomes discretionary rather than rule-bound, and the legitimacy of its SOURCE does not constrain its exercise — it is the limitation of power, not its origin, that prevents arbitrariness, so a democratically-authorized power that cannot be guided by fixed rules becomes arbitrary power regardless; (2) a democratic assembly cannot itself hold or exercise this kind of case-by-case discretionary power (majority rule can't produce one unified plan out of divergent interests), so the demand grows to delegate it to an individual or agency who can act unilaterally — and once granted, this discretionary delegation is not readily reversible, because executing a plan requires continuity of the authority that arbitrates it. Track for: (a) whether the proposal is a BOUNDED, rule-governed intervention (a fixed tax rate, a uniform safety standard) or an OPEN-ENDED authority empowered to arbitrate case-by-case tradeoffs among people's competing ends on an ongoing basis; (b) whether the only claimed check on the power is ELECTORAL, with no accompanying limit on WHAT the power can do once granted; (c) whether 'temporary emergency powers' or 'trust the experts, they're just following the data' is being used to justify open-ended, unreviewable discretion. Counter-move: separate the bounded rule-making element (safely delegable) from the open-ended discretionary-arbitration element (not boundable once granted); ask who decides the tie-breaks among incompatible ends, and by what standing rule rather than by whose judgment, before accepting the plan."
related: [lex-eakec, lex-5rqmv, lex-58ynk, lex-2apyb, lex-kj6tj, lex-f2vjy]
evokes: [road-to-serfdom, planning-requires-choosing-among-incompatible-ends, rule-of-law-vs-arbitrary-power, discretionary-power-is-not-self-limiting, democratic-mandate-does-not-bound-power, plebiscitarian-dictatorship, economic-dictator-delegation, hayek-1944]
lineage:
  - source: primary
    text: hayek-1944-road-to-serfdom
    citation: "Friedrich A. Hayek, The Road to Serfdom (George Routledge & Sons, London / University of Chicago Press, 1944). Hayek — LSE economist, later 1974 Nobel laureate in Economics — wrote The Road to Serfdom as a wartime warning that comprehensive central economic planning, even when adopted through ordinary democratic processes and with the benevolent intent of wartime and postwar reconstruction planners, tends structurally toward the concentration of unchecked, discretionary power and the erosion of the Rule of Law — not because planners are malicious, but because a comprehensive plan requires choosing among people's competing and incompatible ends, and that choice cannot be reduced to fixed, general, pre-announced rules. The chapters `Planning and Democracy,` `Planning and the Rule of Law,` `Economic Control and Totalitarianism,` and `Why the Worst Get on Top` trace the mechanism step by step: democratic assemblies cannot themselves agree on one unified plan across divergent interests, so the demand for `an economic dictator` grows; the power delegated to execute the plan cannot be bound by formal rules because it must decide unforeseeable cases on their merits; and the resulting discretionary power, once granted, is not constrained merely by having originated from an election. Debunking-check caveat discipline: Hayek's specific wartime predictions (that Britain's and America's planning apparatus was already on an inexorable path to totalitarianism) did not play out as he forecast, and his broader political program (a fairly minimal classical-liberal state) is a separate, contested policy position from the structural mechanism this atom encodes. The atom carries only the structural claim — comprehensive planning's discretionary power over incompatible ends tends to erode rule-bound constraint and is not self-limiting — as the critical, portable content, distinct from Hayek's WWII-era predictions or his laissez-faire policy conclusions."
    quote: "[on planning requiring arbitration among incompatible ends, with the discretion accruing to whoever plans:] 'It is the essence of the economic problem that the making of an economic plan involves the choice between conflicting or competing ends — different needs of different people. But which ends do so conflict, which will have to be sacrificed if we want to achieve certain others, in short, which are the alternatives between which we must choose, can only be known to those who know all the facts; and only they, the experts, are in a position to decide which of the different ends are to be given preference. It is inevitable that they should impose their scale of preferences on the community for which they plan.' [on why comprehensive planning cannot be reconciled with the Rule of Law:] 'Economic planning of the collectivist kind necessarily involves the very opposite of this. The planning authority cannot confine itself to providing opportunities for unknown people to make whatever use of them they like. It cannot tie itself down in advance to general and formal rules which prevent arbitrariness. It must provide for the actual needs of people as they arise and then choose deliberately between them. It must constantly decide questions which cannot be answered by formal principles only, and, in making these decisions, it must set up distinctions of merit between the needs of different people. When the government has to decide how many pigs are to be raised or how many busses are to be run, which coal mines are to operate, or at what prices shoes are to be sold, these decisions cannot be deduced from formal principles or settled for long periods in advance. They depend inevitably on the circumstances of the moment, and, in making such decisions, it will always be necessary to balance one against the other the interests of various persons and groups. In the end somebody's views will have to decide whose interests are more important; and these views must become part of the law of the land, a new distinction of rank which the coercive apparatus of government imposes upon the people.' [on why democratic origin does not bound the resulting power:] 'There is no justification for the belief that, so long as power is conferred by democratic procedure, it cannot be arbitrary; the contrast suggested by this statement is altogether false: it is not the source but the limitation of power which prevents it from being arbitrary. Democratic control may prevent power from becoming arbitrary, but it does not do so by its mere existence. If democracy resolves on a task which necessarily involves the use of power which cannot be guided by fixed rules, it must become arbitrary power.' [on the resulting trajectory toward dictatorship as structural, not accidental:] 'Our point, however, is not that dictatorship must inevitably extirpate freedom but rather that planning leads to dictatorship because dictatorship is the most effective instrument of coercion and the enforcement of ideals and, as such, essential if central planning on a large scale is to be possible.' [on the democratic endpoint of this trajectory — plebiscitarian dictatorship:] 'The whole system will tend toward that plebiscitarian dictatorship in which the head of the government is from time to time confirmed in his position by popular vote, but where he has all the powers at his command to make certain that the vote will go in the direction he desires.'"
