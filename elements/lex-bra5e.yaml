id: lex-bra5e
name: maieutic-questioning-extraction
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When teaching, use maieutic questioning: don't deposit content, draw it out. Socrates' midwifery: the questions elicit what the student already implicitly knows. Effective for content that's reconstructible from the student's existing material; less so for genuinely novel content."
related: [lex-4ph9n, lex-89rjr, lex-bkaum, lex-chp44, lex-e5des, lex-fpvsu, lex-jxaht, lex-mmety, lex-p48xw, lex-r5fy3, lex-rzp24, lex-u7tb6, lex-znaau]
scaffolds-from: [lex-e5des, lex-fpvsu]
evokes: [draw-it-out-dont-deposit-it, the-interrogator-as-midwife, knowledge-already-there-just-needs-help-to-emerge, questioning-as-extraction-not-instruction, the-learner-births-the-answer]
lineage:
  - source: primary
    text: plato-theaetetus-149-151-midwifery-exposition
    citation: "Plato, Theaetetus 149a-151d (Jowett translation, Standard Ebooks compilation 2026-05-21). Socrates exposits to Theaetetus that his method is midwifery (μαιευτική) — he inherited the art from his mother (the historical Phaenarete); but where she delivered children, he delivers the THOUGHTS of his interlocutors. The midwife is past-childbearing (cannot herself produce), and the god 'will not allow me to bring anything into the world of my own.' The interrogator's role is therefore explicitly extractive, not depositary: the knowledge already exists in the interlocutor's soul; questioning is what brings it to expressive light. This is paired (in Plato's metaphysics) with anamnesis (recollection — see Meno 81d, 'try to recollect what you do not know'): the doctrine that the soul possesses latent knowledge from a prior state. But the maieutic METHOD is the transferable primitive — it operates whether or not one accepts anamnesis as metaphysics. Modern stripped-of-metaphysics version: the student/client/interlocutor knows more than they can immediately articulate; the questioner's job is to help that knowledge surface, not to import answers from outside."
    quote: "[Plato, Theaetetus 149a-151d, Jowett translation 2026-05-21:] 'Socrates explains to him that he is in labour. For men as well as women have pangs of labour; and both at times require the assistance of midwives. And he, Socrates, is a midwife, although this is a secret; he has inherited the art from his mother bold and bluff, and he ushers into light, not children, but the thoughts of men. Like the midwives, who are past bearing children, he too can have no offspring — the God will not allow him to bring anything into the world of his own. ... At first, says Socrates in his character of the man-midwife, my patients are barren and stolid, but after a while they round apace, if the gods are propitious to them; and this is due not to me but to themselves; I and the god only assist in bringing their ideas to the birth. ... Come then to me, who am a midwife, and the son of a midwife, and I will deliver you. And do not bite me, as the women do, if I abstract your firstborn; for I am acting out of goodwill towards you; the God who is within me is the friend of man, though he will not allow me to dissemble the truth.' [The exposition lays out the maieutic posture: (1) the interlocutor is in labour with their own thoughts and is in pain from them; (2) the interrogator is past-producing themselves and cannot deposit content; (3) the role is to assist delivery — to elicit, not to instruct; (4) any ideas birthed are credited to the interlocutor, not the interrogator. The pedagogical posture is the inverse of deposit-banking instruction.]"
  - source: practitioner
    text: cross-attestation-coaching-therapy-pedagogy
    citation: "Cross-domain attestation: (a) Carl Rogers 1951 client-centered therapy explicitly named the therapeutic frame as bringing the client's own self-understanding into expression, not depositing the therapist's expertise; (b) Socratic-questioning is institutionalized in modern law-school pedagogy (Langdell case method); (c) coaching-vs-mentoring distinction in modern executive coaching literature — coaching as the maieutic posture (questioning surfaces the client's own answers), mentoring as the depositary posture (mentor's experience imported); (d) constructivist pedagogy (Piaget, Bruner, Vygotsky scaffolding) shares the maieutic premise that learning is the learner's construction, not the teacher's transmission; (e) motivational-interviewing (Miller & Rollnick 1991, addictions clinical practice) explicitly grounds itself on the principle that change-motivation must come from the client's own articulation, not from clinician-imposed framing — the maieutic method made operational. The strong claim isn't that ALL teaching is maieutic; rather that for KNOWLEDGE THE LEARNER ALREADY IMPLICITLY HOLDS, depositary methods are slower and more fragile than extractive ones."
    quote: "[Cross-attestation in modern coaching/therapy/pedagogy literatures: Rogers 1951 client-centered approach; Miller & Rollnick 1991 motivational interviewing; constructivist pedagogy traditions all canonize the maieutic posture as the operational frame when the learner holds latent knowledge.]"
canonical-instances:
  - "client-centered therapy (Rogers 1951): therapist's task is to reflect back, ask, and create the conditions in which the client's own understanding can emerge — not to import the therapist's diagnosis. The therapeutic premise is that the client knows things they cannot yet articulate; the therapist is the midwife to that articulation"
  - "motivational interviewing (Miller & Rollnick 1991): for addiction/behavior-change work, the change must be articulated by the CLIENT to take. Clinician-imposed reasons-to-change reliably produce resistance. The clinician's role is to ask questions that surface the client's OWN reasons. The substrate is maieutic"
  - "executive coaching: coaching distinguished from mentoring on exactly this axis — the coach's job is to ask questions whose answers come from the coachee's own knowledge, while the mentor's job is to share their own experience. Coaching = maieutic; mentoring = depositary. The right tool depends on whether the learner has the answer latent (use coach) or needs new information (use mentor)"
  - "rubber-duck debugging: explaining a problem to a rubber duck reliably causes the explainer to identify the bug. The duck is the maieutic frame at zero-cost — the explainer's own articulation produces the insight. The duck is incapable of teaching anything; the entire value is extractive"
  - "law-school case method (Langdell): the Socratic-questioning style in modern American legal education is partly elenchus (refute student's overconfident reading) and partly maieutic (extract the principle from the cases the student has read). The pedagogical premise is that students have done the reading and the principle is in there somewhere — the professor's questions extract it"
  - "user research / contextual inquiry: skilled researchers ask questions whose answers the user already holds tacitly; the research method is maieutic. The classic failure mode is the researcher who pre-supposes answers and asks leading questions — depositary research dressed as extractive, and the data is correspondingly worthless"
  - "critical critical question: when is maieutic the WRONG move? When the learner genuinely does not have the answer latent. If you're teaching someone how to compute eigenvalues from scratch, depositary instruction is faster than questioning. The maieutic prerequisite is that the answer is already there; the corollary is that if it isn't, you're wasting time and the interlocutor's patience. Naming the prerequisite is part of deploying the maieutic responsibly"
  - "pivotal critical question: how does maieutic resist becoming 'cargo-cult Socratic' (asking questions to LOOK like you're not depositing answers, while actually still leading the witness to a predetermined answer)? Discriminator: does the interrogator know the answer in advance? If yes, and you're still asking, you're depositing wearing the maieutic costume. The genuine maieutic stance includes openness to the interlocutor's answer being one you DIDN'T anticipate. The Theaetetus dialogue itself ends with all three definitions of knowledge being rejected — Socrates didn't know what knowledge was either, but the questioning made that the joint discovery"
  - "operational complement to lex-fpvsu elenchus-questioning-to-aporia: maieutic and elenchus are the positive and negative faces of Socratic method. The pair: lex-fpvsu refutes false confidence (produces aporia), lex-bra5e surfaces the better understanding (produces birth-of-knowledge). The full Socratic move is to do both in sequence — refute the bad answer first so the good one has room to emerge. Compare Plato's Meno: Socrates first refutes Meno's confident definitions of virtue (elenchus), then leads the slave-boy to discover the geometry theorem (maieutic)"
  - "operational complement to lex-89rjr (Polya): Polya's heuristic-search posture (have-you-seen-it-before, working-backwards, related-problem) is maieutic in shape — the solver's prior knowledge is being elicited and combined, not new information being imported. Polya's 'Wisdom of Proverbs' frame (the relevant heuristic-prompt is sometimes a folk-saying) is explicitly maieutic: the proverb doesn't ADD information, it activates pre-existing tacit knowledge into the active problem-space"
  - "operational adjacent to lex-chp44 meta-pointer: the maieutic interrogator often uses meta-pointers ('what is the SHAPE of the answer you're trying to articulate? what would COUNT as a satisfying answer here?') to help the interlocutor structure their latent knowledge. Meta-pointing is one operational lever within the maieutic toolkit"
  - "operational adjacent to lex-znaau premature-closure: the maieutic interrogator is specifically guarding against premature-closure by the interlocutor — when the interlocutor offers a first-draft answer, the interrogator's job is to ask follow-ups that probe whether the answer is REALLY their best one or just a comfortable place to stop. Without that probe, the interlocutor will stop at the first plausible-sounding answer; with it, they keep refining. The maieutic frame includes 'don't accept your own first answer too quickly'"
  - "operational adjacent to lex-e5des: dialogical-belief-system names the broader Bakhtinian frame of belief-as-polyphonic-conversation; maieutic names the specific operational stance an interrogator takes within a dialogical frame. Maieutic is one of the moves available; the dialogical frame is the broader posture that enables many such moves"
severity-tier: info
critical-questions:
  - "is the maieutic move actually extracting the interlocutor's latent knowing, or is the leader inserting answers via leading questions?"
  - "does the interlocutor own the answer when it surfaces, or do they recognize it as the leader's?"
  - "what's the cost of being wrong about what's 'already in' the interlocutor — could you induce false confidence?"
  - "is the maieutic technique appropriate to this content (some things must be told, not drawn out)?"
status: active
