id: lex-365um
name: after-breaking-a-cohesive-group-disperse-its-remnant-below-regrouping-mass
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you've successfully divided or defeated a cohesive group by sowing dissension, don't treat the division itself as the finished job -- the same cohesion that made the group dangerous in the first place can reassemble if its members are left in physical or social proximity to each other. Kautilya's prescription for handling the weaker faction after breaking up an oligarchy is specific about the mechanism of prevention, not just the goal: 'When the oligarchy has been divided by sowing dissension, the conqueror shall remove the weaker parties from their own territory and settle them together somewhere else; or, [better still] they shall be settled as agriculturists in groups of five or ten families. For if settled together they may become an armed group. [When settled in a dispersed manner] any attempt by them to get together shall be made a punishable offence.' Two escalating options are given, and the text explicitly ranks the more aggressive one as better: relocating the group intact (which still leaves them together, just elsewhere) is acceptable, but breaking them into small units below the size needed to organize or arm themselves is preferred, because it is that concentration itself, not any particular location, that let the group cohere and threaten in the first place. The rule adds a second layer specifically against reconsolidation: even after dispersal, actively criminalize any subsequent attempt to regroup, because a dispersed population retains the intent and the relationships that produced the original cohesion and will re-concentrate given the chance. Diagnostic move: after successfully fracturing a cohesive threat, don't consider the win complete just because it's currently divided -- ask whether the remaining members are still positioned (physically, socially, digitally) to reconstitute the connections that made them dangerous, and if so, actively reduce their concentration below whatever threshold would let them reorganize, while also treating renewed attempts to regroup as something to actively monitor and block, not something the initial dispersal already ruled out."
related: []
evokes: [disperse-below-the-mass-needed-to-reorganize, kautilya-controlling-oligarchies, settling-a-defeated-faction-in-groups-of-five-or-ten, criminalize-the-attempt-to-regroup]
lineage:
  - source: primary
    text: kautilya-arthashastra-disperse-weaker-parties-below-regrouping-mass
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Against Confederacies and Oligarchies,' 'On Controlling Oligarchies,' {11.1.15-19,53}."
    quote: "'When the oligarchy has been divided by sowing dissension, the conqueror shall remove the weaker parties from their own territory and settle them together somewhere else; or, [better still] they shall be settled as agriculturists in groups of five or ten families. For if settled together they may become an armed group. [When settled in a dispersed manner] any attempt by them to get together shall be made a punishable offence.'"
canonical-instances:
  - "After breaking up a unionizing effort by isolating and reassigning its most cohesive core group, a company doesn't just consider the matter closed once the group is split across departments -- it also monitors for informal channels (shared shift schedules, recurring after-work gatherings) the dispersed members might use to reconsolidate, and treats a resurgence of coordinated activity among the same individuals as a signal to intervene again, rather than assuming the original split is permanent."
  - "A platform that successfully breaks up a coordinated inauthentic-behavior network by suspending its most connected accounts doesn't stop there -- it also watches for the same cluster of remaining, less-central accounts re-establishing dense mutual connections afterward, since the underlying relationships and shared intent survived the removal of the network's most visible nodes."
critical-questions:
  - "does forcibly dispersing a defeated group below its organizing threshold and criminalizing any attempt to regroup risk manufacturing exactly the resentment and shared grievance that produces a MORE motivated, if smaller, future threat, rather than genuinely neutralizing the danger?"
  - "how small does a group actually need to be before it can no longer 'become an armed group' -- is five-to-ten families a real, verifiable threshold or an arbitrary number, and does the dispersing party actually know where the real reorganization threshold sits for a given group's specific capabilities?"
  - "does treating any subsequent attempt to regroup as a punishable offense risk criminalizing ordinary social contact among people who were never actually planning to reorganize, making the prevention measure indistinguishable from indefinite collective punishment of anyone who was ever a member of the original group?"
status: active
