id: lex-bx8hz
name: variable-ratio-reinforcement-produces-the-most-persistent-behavior
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you want behavior to PERSIST through periods without reinforcement — to keep going through extinction-like stretches — the transferable claim from operant conditioning is that VARIABLE-RATIO REINFORCEMENT SCHEDULES (rewards delivered after an unpredictable number of responses) produce the most persistent behavior. Continuous reinforcement (every response rewarded) produces fast initial learning but the behavior extinguishes quickly when reinforcement stops. Fixed-ratio schedules (every Nth response rewarded) produce moderate persistence. Variable-ratio schedules — where the trainee cannot predict which response will be rewarded — produce extraordinary persistence: the trainee keeps responding through long unrewarded stretches because 'this one might be the one.' The structural lesson is that PREDICTABILITY of reinforcement is itself an axis: predictable reinforcement creates dependence on continuous delivery; unpredictable reinforcement creates persistence-under-deprivation. Practitioner consequence: variable-ratio is the engineering choice for ENGAGEMENT MAXIMIZATION (gambling machines, social media feed delivery, app-notification timing, intermittent-attention relationships, abusive-cycle relationships) — and the engineering choice for SKILL ROBUSTNESS (training behaviors that survive periods without practice or external reinforcement). The asymmetry matters because the same engineering tool serves prosocial (resilient skill) and antisocial (compulsive engagement) ends, with the underlying mechanism identical. Pryor's specific observation: 'the intensity of the charm is at least partly due to the nature of the reinforcement schedule.' Variable-ratio relationships (the intermittent reinforcer giving warmth-then-cold-then-warmth) produce extraordinary attachment-persistence to the reinforcer; recognizing the schedule is often the first step in being able to walk away. The atom names the STRUCTURAL CLAIM (variable-ratio → maximal persistence), not a position on whether variable-ratio is good or bad in any specific deployment. Distinct from lex-555ug shaping-by-successive-approximation: shaping is the method of building behavior; variable-ratio is a property of the reinforcement SCHEDULE within the shaping (or any other reinforcement) regime. They compose — shaping can use any schedule; variable-ratio is one specific schedule choice. Distinct from lex-qg753 marker-signal: marker is about precision of identification; variable-ratio is about timing/predictability of reinforcement. They compose. Distinct from lex-tcgej time-on-device-optimization-targets-engagement-not-welfare: lex-tcgej is about the OBJECTIVE (engagement maximization vs welfare); lex-bx8hz is about the MECHANISM (variable-ratio schedules) by which engagement-maximization is operationalized. They compose strongly — lex-tcgej describes WHY a system targets engagement; lex-bx8hz describes HOW the system produces engagement-persistence."
