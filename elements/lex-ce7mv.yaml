id: lex-ce7mv
name: nominal-choice-without-what-you-needed-isnt-real-freedom
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating 'you were free to choose' as proof someone's freedom was respected, check whether the choice on offer actually contained what they needed. Sen: “The right to a process can be important in many contexts: for example, even if some authority can guess entirely accurately what I would most like to choose, my liberty may not be adequately respected if the authority bestows on me what I would have supposedly chosen, while denying me the right to choose for myself. ... On the other hand, a person's real freedom may actually link with outcomes as well. For example, in agitating for safe flights (and the freedom to survive air journeys), our focus may be on having competent (and non-suicidal) pilots who fly us safely, rather than obtaining for ourselves the freedom to choose to do whatever we would like to do in the cockpit. Similarly, if a person is keen to avoid some kind of meat -- pork or beef or duck or whatever -- to have the freedom to pick her own dish at a buffet, without being told which contains what, cannot be seen as vindication of her freedom to eat as she would like.” Nobody agitating for airline safety wants a vote on who flies the plane, and nobody with a dietary restriction wants an unlabeled buffet -- what both actually need is a guaranteed outcome (a safe flight, food they can identify), and offering them a formal choice instead is a substitute that misses the point entirely. Diagnostic move: when someone's freedom or autonomy is being addressed by handing them a choice, check what they were actually asking for. If the thing they needed was a guaranteed outcome or the information to choose meaningfully, an empty formal choice isn't a lesser version of respecting their freedom -- it's a different thing being offered instead of the thing that was asked for."
