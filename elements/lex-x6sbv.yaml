id: lex-x6sbv
name: dualist-reduction-as-cue
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When framed as 'either A or B', suspect dualist reduction. The framing is often the lever — it forces a side-take that ignores a third option. Generate at least one cross-cutting frame before accepting the dichotomy."
related: [lex-znaau, lex-k6d7u, lex-t9fs7, lex-vacbr, lex-2rsad, lex-quu4s, lex-9m3vy, lex-rfxtb, lex-m2cwp, lex-p48xw, lex-78gp5, lex-7t3wr, lex-4dest]
scaffolds-from: [lex-znaau, lex-rfxtb, lex-vacbr, lex-quu4s, lex-k6d7u]
evokes: [either-or-framing, black-and-white-thinking, all-or-nothing-thinking, splitting-good-and-bad, the-binary-partition-cue, dichotomous-categorization, the-shape-of-premature-2-bucket-closure]
lineage:
  - source: practitioner
    text: beck-1976-cognitive-therapy-and-the-emotional-disorders
    citation: "Aaron T. Beck, Cognitive Therapy and the Emotional Disorders (Meridian / International Universities Press 1976; Plume reprint 1979) — the founding text of cognitive therapy. Beck's Ch.13 'Therapeutic Methods' (and the cognitive-distortion enumeration in Ch.12) names dichotomous thinking as one of the canonical systematic distortions: patients in depressive episodes map continuous-valued experiences onto binary categories. This atom names the move as a CUE — recognizable from linguistic markers (totally, completely, never, always) and structural markers (single-cause attribution, success/failure collapse)."
    quote: "[Beck — verbatim located at Ch.12/13 cognitive-distortion enumeration. The clinically-canonical observation: dichotomous thinking is one of a small family of systematic cognitive distortions (along with arbitrary inference, selective abstraction, overgeneralization, magnification, personalization) that produce depressogenic cognition by systematic-misreading-of-reality. The dichotomous variant specifically collapses continuous gradients to binary categories — 'I either succeed completely or I'm a total failure.' Beck's crucial operational contribution: naming the distortion makes it interruptible. The patient who can self-detect 'this is dichotomous thinking' can pivot to multifactorial frame (lex-rfxtb via lex-m2cwp); the patient who cannot detect it lives inside its conclusions. Burns 1980 popularized the move as cognitive-distortion self-administered CBT — the 'all-or-nothing thinking' #1 entry on the canonical 10-distortions checklist.]"
  - source: primary
    text: burns-1980-feeling-good-the-new-mood-therapy
    citation: "David D. Burns, Feeling Good: The New Mood Therapy (William Morrow 1980; revised 1999), Ch.3 'Understanding Your Moods.' Burns systematized Beck's cognitive distortions into a popularized checklist of 10 distortions used in self-administered CBT exercises; 'All-or-Nothing Thinking' is #1 on the canonical list (p.28 first ed., position-1 in the in-chapter enumeration). The verbatim 'You see things in black-and-white categories. If your performance falls short of perfect, you see yourself as a total failure.' is verified at Ch.3 summary box. The longer in-text passage (also Ch.3, page-28 anchor in the source) gives the politician+student examples and explicitly ties the distortion to perfectionism. Burns's cardinal operational contribution is making the distortion-naming move accessible enough to use as a real-time self-detection habit."
    quote: "1. ALL-OR-NOTHING THINKING: You see things in black-and-white categories. If your performance falls short of perfect, you see yourself as a total failure. [Burns 1980 Ch.3 summary-box —]"
  - source: primary
    text: klein-1946-notes-on-some-schizoid-mechanisms
    citation: "Melanie Klein, 'Notes on Some Schizoid Mechanisms,' International Journal of Psycho-Analysis 27:99-110 (1946), reprinted in Envy and Gratitude and Other Works 1946-1963 (Hogarth Press 1975), pp.1-24 of the reprint. The canonical psychoanalytic statement of 'splitting' as a primitive defense: the infant (and the regressed adult) partitions object-representations into ALL-GOOD and ALL-BAD components, unable to hold ambivalence. Klein opens by stating object-relations exist from the beginning of life, with the first object (the mother's breast) split into a gratifying-good and frustrating-bad component, and that this splitting produces the severance of love and hate. Adult splitting under stress (Kernberg's 1975 borderline-organization extension) is one of the most operationally important shapes of dualist-reduction-as-cue."
    quote: "I have often expressed my view that object-relations exist from the beginning of life, the first object being the mother's breast which to the child becomes split into a good (gratifying) and bad (frustrating) breast; this splitting results in a severance of love and hate. [Klein 1946 p.2 of the 1975 reprint —]"
  - source: practitioner
    text: discovery-loop-chat-2026-05-14
    citation: "imported snippet defining dualist-vs-multifactorial-thinking. The chat-snippet supplied operational examples (intelligence-or-effort student-performance attribution; genetics-or-lifestyle obesity attribution) that anchored this atom's canonical-instance design. User's stated goal: practice this as a SELF-RECOGNITION CUE that triggers the multifactorial-frame pivot (lex-rfxtb / lex-m2cwp). The atom's design as a CUE rather than a passive concept follows the "
    quote: "Dualist or dichotomous thinking refers to a cognitive approach where situations, ideas, or concepts are divided into two opposing or mutually exclusive categories. It's a binary way of viewing the world, typically framing issues as either/or — such as good vs. evil, right vs. wrong, success vs. failure — without much recognition for the nuances or complexities that might lie between those extremes. This way of thinking simplifies reality by reducing it to two clear options, even when the situation may be more multifaceted or uncertain. [Chat-snippet 2026-05-14 — discovery-loop articulation. The 'simplifies reality by reducing' phrasing is the vital piece: dualist-reduction is an ACTIVE simplification, not a passive perception.]"
canonical-instances:
  - "the **either-or-prompt cue**: you catch yourself (or a conversational partner) framing a question as 'is it A or B?' for a phenomenon that likely has more than two contributing factors. Examples: 'is the project succeeding or failing?', 'is he smart or lazy?', 'is this caused by nature or nurture?', 'is the team productive or dysfunctional?', 'is the policy good or bad?'. The binary framing IS the cue — recognize it and pivot (lex-m2cwp routes the pivot). The framing is innocent in genuinely-binary cases (the lock is open or closed) and pathological in cases where the underlying structure is continuous / multi-factor"
  - "the **strong-language cue**: words like 'totally,' 'completely,' 'never,' 'always,' 'all,' 'nothing,' 'perfect,' 'ruined' applied to phenomena with empirical gradient-structure. Burns 1980's ice-cream example: 'I've completely blown my diet, I'm a failure' — the 'completely' and 'failure' are the dualist-collapse linguistic markers. Operational self-test: when you produce a sentence containing 'totally / completely / never / always,' notice and ask whether the underlying phenomenon actually has the strong-binary structure your language is asserting"
  - "the **single-cause-attribution cue**: you're explaining a complex outcome via a single cause without ruling out alternative-or-additional causes. 'The startup failed because the founders didn't have product sense.' / 'The relationship ended because she was too needy.' / 'The election turned on Latino voters.' These may have meaningful pieces of truth, but the single-cause framing IS the cue — the multifactorial reading is the same fact-set DECOMPOSED into multiple contributing factors with weights"
  - "the **moral-binarization cue**: ethics framed as good-vs-evil, hero-vs-villain, right-vs-wrong, with no acknowledgment of trade-offs, conflicting values, partial responsibility, or context-dependent rightness. (Some ethical situations ARE binary — taking the action or refusing — but the cause-structure of the situation is rarely binary even when the action-space is.) Klein's splitting: the regressed person sees the partner as all-good (idealization) or all-bad (devaluation) with no integration. The same shape appears in political enemy-framing, group-conflict, and intergenerational family patterns"
  - "the **personality-binarization cue**: applying categorical labels (smart/dumb, motivated/lazy, kind/cruel, introvert/extravert) to people whose actual property-distribution is graded, context-dependent, and multi-dimensional. Rosch prototype-theory's empirical finding: categories are graded by typicality, not sharp-bounded. The categorical label IS the cue — the multifactorial reading asks 'across the relevant dimensions, what's the actual property-vector and how does context modulate it?'"
  - "the **diagnosis-without-differential cue** (medical / engineering / debug): producing a confident diagnosis without first ruling out alternative causes. 'It's a memory leak.' / 'It's the new dependency.' / 'It's depression.' Cue trigger: confidence in a single diagnosis WITHOUT mentioning the alternative hypotheses that were considered. The multifactorial pivot is the differential — list candidates, weight them, design tests that discriminate"
  - "the **success-failure-collapse cue**: post-mortems that collapse a complex project outcome to 'we succeeded' or 'we failed' without decomposing what worked, what didn't, what was orthogonal, what was lucky, what was unforced. The collapse loses retrospective learning value. Operational signal: a retrospective with a single sentiment-direction (all-positive or all-negative) has almost certainly dualist-reduced the actual structure"
  - "the **us-vs-them cue**: tribal / political / organizational framings that map a multi-party situation onto a single conflict-axis. 'Engineering vs Product.' 'Labor vs Management.' 'Our team vs the bad team.' These framings can be locally useful (mobilizing energy for a specific dispute) but the dualist-reduction loses the partial alignments, third parties, and shared interests that the multifactorial reading would surface. The CUE is the moment of mapping to 2 sides; the pivot is the question 'what's the actual N-party structure here?'"
  - "the **either-update-everything-or-update-nothing cue**: in disagreements, the cognitive shortcut of treating the dispute as 'I'm right vs they're right' rather than 'which specific claims update and by how much?' Tetlock's foxes update granularly on specific sub-claims; hedgehogs treat the whole position-bundle as the unit-of-update. Cue trigger: framing a disagreement-resolution as a single accept/reject decision on the whole package"
  - "self-recognition operational protocol (for becoming a practiced-default detector — per user's stated goal): when you notice one of the above cues, pause and verbally name it ('this is dualist-reduction'). The naming-move is what Beck 1976 / Burns 1980 identified as the central intervention — distortions are interruptible once labeled. The pivot (lex-m2cwp sequential to lex-rfxtb) can then proceed. Without explicit naming, the cue often passes unnoticed and the dualist verdict gets accepted"
  - "operationally distinct from lex-znaau premature-closure: premature-closure is closing-before-processing-is-done in ANY shape (could be single-answer, could be 2-bucket, could be N-bucket). Dualist-reduction-as-cue is the specific SHAPE of premature-closure where the closing structure is a 2-category partition. Premature-closure is the failure-mode genus; dualist-reduction is one species. The atom's narrower scope makes it operationally more cue-able (binary linguistic markers are easier to self-detect than 'generic premature closure')"
  - "operationally distinct from lex-quu4s need-for-closure: need-for-closure is the MOTIVATIONAL DRIVER (Kruglanski-Webster's seize-and-freeze tendency); dualist-reduction is one of the COGNITIVE SHAPES the seize takes. High need-for-closure raises the probability that a deliberation will collapse to dualist-reduction (the simplest possible closed structure). They compose: NFC × dualist-reduction is the foundational dynamic of dogmatic group decision-making under time pressure"
  - "operationally adjacent to lex-t9fs7 confirmation-bias: confirmation-bias is search-asymmetry within a held position; dualist-reduction is the position-FORM that confirmation-bias often operates on (once you've collapsed to one of two categories, search asymmetrically favors evidence for the chosen pole). They compose: dualist-reduction sets up the 2-pole frame; confirmation-bias defends the chosen pole against evidence for the other"
  - "operationally adjacent to lex-vacbr identity-protective-cognition / lex-2rsad: dualist-reduction is one of the shapes identity-protective cognition takes (us-vs-them is the canonical identity-protective dualist framing). The integration: lex-vacbr/0143 supplies the motivational pressure; dualist-reduction supplies the cognitive structure; the combination is the most operationally important failure mode in political / tribal / family / organizational conflict"
  - "operationally compositional with lex-rfxtb multifactorial-frame via lex-m2cwp pivot-molecule: this atom is designed AS A CUE TRIGGER for the lex-rfxtb application. The composition is sequential(lex-x6sbv-detect-the-cue, lex-rfxtb-deploy-multifactorial-frame). The atom is incomplete in isolation — its operational meaning is to TRIGGER the pivot. Authoring note: keep the canonical-instances tightly focused on CUES (detection-shapes), not on the response (which lives in lex-rfxtb). Cue-and-response are split intentionally so each can be reused independently"
critical-questions:
  - "the genuinely-binary check: when is dualist framing actually correct? Some structures are genuinely binary (logical disjunction, on/off switch, do/don't action). Misapplying multifactorial to genuinely binary is over-modeling. Discriminator: does the phenomenon have empirically-graded structure the binary is losing? Yes → pivot. No → accept the framing"
  - "the new-dualism failure-mode: how do you avoid this atom becoming THE NEW DUALISM (dualist-or-multifactorial dichotomy)? Self-application: dualist-reduction-as-cue itself can be triggered by people in a 'is this thinking dualist or multifactorial' binary frame. Recursion-resolution: multifactorial-frame ABOUT reasoning-style produces 'this thinking is X% dualist, Y% multifactorial.' The discipline is recursively applied"
  - "the cue-source check: what triggered the dualist-reduction? Common sources: time-pressure (lex-quu4s need-for-closure); identity-stakes (lex-vacbr IPC); rhetorical convenience (binary feels punchier); cultural-default (some communities reward decisive binaries). Practitioner-discipline: name the source; different sources need different interventions"
  - "the binary-as-compression test: is the dualist framing acting as lossy compression (the speaker knows the underlying gradient and is summarizing) or as the actual representation? Compression can be appropriate (audience-tailored simplification); representation-as-reality is the failure-mode. Practitioner-question: if you ask the speaker to elaborate, do they produce multifactorial structure underneath, or double down on the binary?"
status: active
