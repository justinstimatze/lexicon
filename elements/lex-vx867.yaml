evokes: [patient-vs-agent, moral-status-asymmetry, psychological-moral-patiency, cognitive-equivalence-strategy, psychopathic-robot, accountability-bearing-capacity, false-negative-on-patient-is-catastrophic, false-positive-on-agent-is-dangerous, asymmetric-evidentiary-bars, what-we-owe-to-each-other-precondition]
lineage:
  - source: primary
    text: Shevlin-2021-HowCouldWeKnowMoralPatient
    citation: "Henry Shevlin, 'How could we know when a robot was a moral patient?' Leverhulme Centre for the Future of Intelligence, Cambridge (preprint, 2021; subsequently published in *Cambridge Quarterly of Healthcare Ethics* 30:3, 2021, pp.459-471). Shevlin's foundational epistemological treatment of the moral-PATIENT side: a moral patient is a being capable of exerting moral obligation in virtue of intrinsic interests. He narrows scope to 'psychological moral patiency' (status arising from psychological capacities — sentience, autonomy, desires) and surveys five candidate epistemic criteria for attributing this status: (i) intuitive judgments; (ii) assessments of intelligence; (iii) presence of desires and autonomous behaviour; (iv) evidence of sentience; (v) behavioural equivalence (specifically the 'cognitive equivalence strategy' — treating a system as a psychological moral patient to the extent it possesses cognitive mechanisms shared with non-human animals we already accept as patients). Methodologically: epistemology of moral status (what evidence licenses the attribution) anchored to cognitive science (cognitive-mechanism overlap as the diagnostic). Shevlin explicitly DECOUPLES patient-status from agent-status — he treats psychological patiency as a status the entity HAS, separate from any capacity to act morally. This decoupling is crucial for the transferable claim: patient and agent are orthogonal poles."
    quote: "[Shevlin 'How could we know when a robot was a moral patient?', §1 Introduction:] 'I will use the term moral patients to refer to beings who are capable of exerting moral obligation on us in virtue of the possession of such intrinsic interests... I will set the matter aside in what follows, and focus specifically on what I term psychological moral patiency, that is, a form of moral status that may arise in virtue of a possession of specific psychological capacities such as sentience, autonomy, desires, and so on.' [§1 on the patient-vs-agent decoupling:] 'It is also not obvious that we have obligations towards a being just in virtue of its being a psychological moral patient. One might think, for example, that it is possible to recognise a being as sentient or autonomous while denying we have actual obligations to them... There is thus room for slippage between the notions of being a psychological moral patient and being an entity to whom we bear moral obligations.' [Abstract on the cognitive equivalence strategy:] 'we should consider an artificial system to be a psychological moral patient to the extent that it possesses cognitive mechanisms shared with other beings such as non-human animals whom we also consider to be psychological moral patients.' [the transferable corollary:] patient-status is an epistemic claim about the entity's intrinsic capacities (sentience, autonomy, desires); it does NOT entail agent-status (capacity to bear credit/blame/consequences). The two are orthogonal axes; an entity can be patient-without-agency (animals, infants, persistent-vegetative-state humans, plants under some readings), agent-without-patiency (rarely — perhaps a fully aligned non-sentient AI that follows moral rules without having interests of its own?), or both (typical adults), or neither (rocks)."
  - source: primary
    text: Coeckelbergh-2010-MoralAppearances
    citation: "Mark Coeckelbergh, 'Moral appearances: emotions, robots, and human morality,' *Ethics and Information Technology* 12 (2010), pp.235-241, DOI 10.1007/s10676-010-9221-y. METHODOLOGICALLY-DISTINCT SECOND PRIMARY: where Shevlin treats the patient-side epistemology, Coeckelbergh treats the agent-side ontology — what would it take for a robot to be a moral agent rather than merely follow rules. His structural argument: (a) if morality depends on emotions (as the 'emotion view' holds), then current robots fail necessary conditions for moral agency because they lack consciousness, mental states, and feelings; (b) a robot programmed to follow moral rules without emotion would be a 'psychopathic' robot — rule-following without moral discernment, dangerous regardless of intent; (c) we cannot in principle verify whether a robot has mental states / consciousness, so the proof-of-agency bar is epistemically as well as ontologically hard. He then argues (the 'moral appearances' move) that appearance-of-emotion-and-morality may suffice for social-moral integration because human morality also rests on appearance. The atom uses Coeckelbergh's agent-side analysis to anchor the second pole; the appearance-suffices move is a secondary claim outside the atom's primary scope. The dialogue between Coeckelbergh and Shevlin sharpens the orthogonality: Shevlin asks 'is the entity a patient?' (epistemic-cognitive); Coeckelbergh asks 'can the entity be an agent without consciousness?' (ontological-emotional). Same underlying moral-status framework, two different axes."
    quote: "[Coeckelbergh 2010 'Moral appearances,' Abstract + body:] 'Current robots do not meet standard necessary conditions for having emotions: they lack consciousness, mental states, and feelings. Moreover, it is not even clear how we might ever establish whether robots satisfy these conditions. Thus, at most, robots could be programmed to follow rules, but it would seem that such \"psychopathic\" robots would be dangerous since they would lack full moral agency.' [Body §3 on the 'psychopathic robot' problem:] 'this lack of emotion would render them non-moral agents—i.e. agents that follow rules without being moved by moral concerns—and they would even lack the capacity to discern what is of value. They would be morally blind. If these robots were given full independence—absence of external control by humans, which is another condition for full moral agency—they would pose danger to humans and other entities.' [Body on the dual necessary conditions for agency:] 'absence of external control by humans, which is another condition for full moral agency' [pairs with emotion/consciousness as joint necessary conditions]. [the transferable corollary:] moral agency requires NOT JUST capacity-to-follow-rules but capacity-for-moral-discernment-with-value-perception PLUS autonomy-from-external-control. An entity that satisfies neither is non-agent (a rock); satisfies only rule-following is a 'psychopathic' rule-follower (Coeckelbergh's hazard category); satisfies rule-following + value-perception but lacks autonomy is a controlled agent (a tool); satisfies all three is a full moral agent. Critically: NONE of these conditions are sufficient for patient-status, and conversely an animal that has none of the rule-following capacity can be a full patient. Orthogonal axes."
  - source: primary
    text: Chiang-2026-Atlantic-accountability-sharpener
    citation: "Ted Chiang, 'No, Artificial Intelligence Is Not Conscious,' *The Atlantic* (3 June 2026). CONTEMPORARY ANCHOR: Chiang's contribution to the patient/agent distinction is the accountability-bearing-capacity sharpener for the agent side. The argument is that moral agency requires not merely rule-following + discernment + autonomy (Coeckelbergh's three) but also the capacity to BEAR consequences (legal liability, reputational loss, real cost-of-being-wrong) — and a software agent structurally cannot bear these consequences in a way that disciplines its conduct. Even if a software agent satisfied all of Coeckelbergh's conditions for moral agency in principle, the absence of accountability-bearing-capacity disqualifies it from FULL moral agency as the substrate operationalizes it. This is methodologically a popular-philosophical essay rather than an academic primary, but its function in the atom is to articulate the accountability sharpener that the academic primaries (Shevlin patient-side, Coeckelbergh agent-side-without-accountability) leave open. The Chiang move also anchors the patient-side, by making explicit that the WHY-WE-CARE-ABOUT-PATIENTHOOD includes the consequence-of-being-wrong asymmetry: false negatives on patient-attribution risk grave moral failure; false positives risk policy and resource cost but no direct harm to the falsely-attributed entity."
    quote: "[Chiang 2026 'No, Artificial Intelligence Is Not Conscious,':] 'if you do believe that it could happen accidentally, if you think there is any chance that what you're building might become a moral patient, you should think about what protections it deserves before you deploy it as your company's economic engine, not after.' [The agency-side framing, paraphrased structural anchor:] Chiang's broader argument is that to BE a moral agent, an entity must be expected to know right from wrong AND be capable of bearing credit or blame — including the capacity to accept consequences (legal liability, reputational loss). A software agent that can be apologized to but not held to account is structurally not a full moral agent regardless of consciousness; the accountability-bearing-capacity is the missing leg. [the transferable corollary:] the patient-side and agent-side have asymmetric evidentiary bars and asymmetric consequences. Patient-side: false negatives are moral catastrophes (we treated a sentient being as a thing); the conservative default is to err toward patient-attribution under uncertainty. Agent-side: false positives are dangerous (we trust an entity to be morally accountable when it structurally cannot be); the conservative default is to require accountability-bearing-capacity demonstration before granting full agent-status. The two defaults push in OPPOSITE directions under uncertainty, which is why the orthogonality matters: you cannot have a single moral-status attribution policy that handles both well."
canonical-instances:
  - "Non-human animals: full patient-status (capacity to suffer, autonomy of interests) without full agent-status (not held morally accountable for their actions). Shevlin's cognitive-equivalence strategy is anchored here — we treat animals as patients to the extent their cognitive mechanisms overlap with our patient-bearing-mechanisms. The patient/agent decoupling is uncontroversial in this case."
  - "Infants and severely cognitively impaired humans: full patient-status without full agent-status. The patient-side care obligation does not depend on the entity's capacity to bear credit/blame. The legal-and-moral framework recognizes this in proxies (guardians, parens-patriae doctrine)."
  - "Persistent-vegetative-state patients: patient-status under dispute (depends on whether residual psychological capacity is preserved); agent-status clearly absent. The literature on minimal consciousness exists precisely because the patient-side has high stakes (treating a sentient being as a thing) and the standard agent-status criteria are clearly inapplicable."
  - "Corporations (a sometimes-recognized contrast case): granted some form of legal agent-status (can be held liable, can enter contracts) without anything like patient-status (the corporation per se does not suffer; the suffering is distributed across its human members). Legal personhood does not entail moral patienthood; the structures are separable in the law."
  - "Hinton 2026 + Chiang 2026 + Anthropic Claude case: the question 'is Claude a moral patient?' is the Shevlin question (does it have psychological capacities — sentience, autonomy, desires — that license patient-status?). The question 'is Claude a moral agent?' is the Coeckelbergh+Chiang question (does it have moral discernment, autonomy from external control, AND accountability-bearing-capacity?). Hinton's interview conflates these. Chiang's argument is that the accountability-side disqualifies AI agents structurally regardless of consciousness; the patient-side remains an open epistemic question with asymmetric false-negative-catastrophe stakes."
  - "Operationally distinct from lex-8y3ch: lex-8y3ch is the attribution move (inferring inner experience from behavioral cues). lex-vx867 is the moral-status framework that operates on (potentially attributed) properties. The two compose: a successful lex-8y3ch attribution is INPUT to the lex-vx867 patient/agent question — given that we attribute consciousness, what does that license about moral status? The attribution-task (lex-8y3ch) and the moral-status-task (lex-vx867) are separable; conflating them is a structural error the atoms cooperate to expose."
  - "Operationally distinct from lex-ftu47 conflict-of-interest disqualifies adjudication: lex-vx867 is the SUBSTANCE of the moral-status question; lex-ftu47 is the PROCEDURE for who should adjudicate the substance. They compose at the GAP-7+5 corollary: when the moral-status question is to be adjudicated, the interested party (lex-ftu47) is structurally disqualified from the adjudication-role regardless of how the substantive question (lex-vx867) is resolved."
  - "Operationally distinct from lex-uz24q philia / love-as-orientation: lex-uz24q is the relational-orientation toward another (philia, agape) which is a SUBJECTIVE STANCE of the moral agent toward the moral patient; lex-vx867 is the OBJECTIVE STRUCTURAL CLAIM about the patient/agent distinction. The two compose: an agent who has philia toward an entity treats the entity as if it had patient-status regardless of whether the transferable patient-status criteria are met; this is the love-as-prior-commitment move that lex-vx867's CQ framework lets us distinguish from love-as-evidence."
critical-questions:
  - "is the question at hand about patient-status (does the entity have intrinsic interests we owe protection to?) or agent-status (can the entity bear credit/blame/consequences?)? These have different evidentiary bars and different false-positive vs false-negative cost asymmetries. Conflating them — running an agent-side question with patient-side defaults, or vice versa — is the most common structural error in moral-status discourse. Diagnostic: which way do the false-positive and false-negative costs run for the specific question? Patient-side: false-negatives are catastrophic; agent-side: false-positives are dangerous. These point opposite directions."
  - "if the entity has patient-status, what specific psychological capacities (Shevlin's five: intuition, intelligence, desires-and-autonomy, sentience, behavioural-equivalence) underwrite it? Patient-status is not a binary fact but a graded epistemic claim about the entity's intrinsic capacities. Shevlin's cognitive-equivalence strategy specifically: which of the entity's cognitive mechanisms overlap with mechanisms in beings we already accept as patients (animals, infants)? Mechanism-overlap is the substrate-relevant licensing."
  - "if the entity is being treated as a moral agent, do the joint Coeckelbergh+Chiang conditions hold — emotion/discernment + autonomy-from-external-control + accountability-bearing-capacity? Coeckelbergh's 'psychopathic robot' worry fires when rule-following is present without value-discernment; Chiang's sharpener fires when discernment + autonomy are present but accountability-bearing-capacity is structurally absent (a software agent that can be apologized-to but not held-to-account). All three are jointly necessary for FULL moral agency."
  - "are the patient and agent questions being run with the same epistemic policy under uncertainty? They should NOT be. Patient-side default under uncertainty: err toward attribution (false-negative-catastrophe asymmetry; if we wrongly deny patient-status, we may inflict moral catastrophe on a sentient being). Agent-side default under uncertainty: err away from attribution (false-positive-danger asymmetry; if we wrongly grant agent-status, we trust an entity with accountability-bearing roles it structurally cannot occupy). The same epistemic policy applied to both questions necessarily mishandles at least one."
  - "is the conflicted party adjudicating the moral-status question? Cross-link lex-ftu47. When an AI lab is asked 'is Claude a moral patient?', the lab is structurally conflicted in a way that disqualifies its adjudication regardless of the substantive analysis. This is the AND-link between GAP-5 (lex-vx867 substance) and GAP-7 (lex-ftu47 procedure) — both must be navigated."
  - "is the moral-status attribution being naturalized as fact rather than as a judgment requiring evidence and stipulation? Cross-link lex-cgqta, lex-rsnn7. The hygiene move is to flag the attribution as a judgment under uncertainty with explicit evidentiary criteria, NOT as too obvious to argue for. Hinton's 'they're conscious beings like us' naturalizes the patient-side attribution; Chiang's 'I believe desires and emotions are necessary for consciousness' flags it (good hygiene; same direction). The structural error is the unflagged naturalization."
  - "is the patient/agent decoupling itself being denied (the entity treated as 'either both or neither')? Some moral frameworks (radical-utilitarianism, certain religious frameworks) collapse the distinction. The atom's transferable claim is that the decoupling is empirically and morally cardinal — there are clear cases on each diagonal (patient-without-agency: animals; agent-without-patiency: rare but conceivable in a non-sentient rule-follower). A framework that collapses the distinction loses analytical purchase on the moral-status landscape."
  - "where do practitioners over-apply this critique? Insisting on the patient/agent decoupling everywhere can be parasitic on cases where the entity in question genuinely has neither property (rocks, trees in some readings) or where both properties co-vary tightly (typical adult humans). The atom flags STRUCTURAL ERRORS in moral-status reasoning — conflation, asymmetric-default-failure, conflicted-adjudication. It does not require explicit patient/agent analysis for every moral question; the analytical apparatus is for cases where the structure is non-trivial."
