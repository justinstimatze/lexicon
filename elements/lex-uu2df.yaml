    quote: "Now so far from running, they actually stand up against me! Whatever I do, they mimic. There's a fellow yonder on a commanding position: he it is who has organised the rabble. Well, I don't see how to get the better of them."
canonical-instances:
  - "A workplace bully who intimidates coworkers one at a time with aggressive posturing finds the tactic collapses once the whole team, coached by one colleague, starts calmly repeating the bully's own phrasing back at them in every meeting, leaving the bully with no clear target to escalate against."
critical-questions:
  - "Does mimicry actually need to be organized and coordinated to work, or would spontaneous, uncoordinated mimicry from a large enough group produce the same disorienting effect on the predator?"
  - "Is this tactic specific to threats that depend on an unanswered display, or would it fail against a predator willing to escalate to direct force once the display alone stops working?"
