id: lex-mem6b
name: bind-only-the-dimension-where-conditions-currently-favor-you
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When negotiating a joint commitment with a partner or rival, don't treat 'make an agreement' as a single all-or-nothing choice between a full binding alliance and no agreement at all -- Kautilya's treaty framework decomposes any joint undertaking into independent dimensions and prescribes locking in only the specific dimension where your current position is actually favorable, leaving the rest open. He names the decomposition explicitly: 'There are seven types of treaties, according to the nature of the obligations [with three variables of place, time and objective -- all three together, any two, or any one]: place, time and objective; place and time; time and objective; place and objective; place alone; time alone; objective alone.' Each single-dimension treaty is then matched to a specific asymmetry it's designed to lock in before the other party can renegotiate around it: 'A treaty about place is one in which the signatories agree beforehand that each one will attack a different [specified] region. Such a treaty shall be entered into when the other king has to face a campaign in uncongenial territory while the expedition of the king will be in a more favourable territory.' The logic is precise: you don't need the other party to concede on time or objective if the only current advantage you actually hold is which territory each side operates in -- binding that one dimension captures the asymmetry while it exists, and leaving time and objective unconstrained means you aren't simultaneously locked into unfavorable terms on dimensions where you currently have no advantage, or where conditions might still shift in your favor before they need to be settled. A blanket, all-dimensions treaty either forces you to negotiate away your leverage on the favorable dimension in exchange for concessions on the others, or forces the other party to accept unfavorable terms across the board, which they have every reason to resist. Diagnostic move: before proposing or accepting a joint commitment, decompose it into its separable dimensions (which resource, which timeframe, which specific objective, which territory, which scope of exclusivity) and identify precisely which one or two dimensions your current position actually favors -- then propose binding only those, leaving every other dimension open for separate, later negotiation rather than trying to settle everything in one comprehensive deal that dilutes the one advantage you actually hold."
