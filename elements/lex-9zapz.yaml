id: lex-9zapz
name: armoring-up-and-choosing-when-to-accept-an-inevitable-capture
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When something is going to catch you eventually and evasion only delays it, the useful move isn't to keep evading indefinitely -- it's to prepare yourself for what happens after capture, then let yourself be taken on your own schedule, once the preparation is actually in place. In Radin's Winnebago Hare Cycle, having learned that a being can swallow anything it touches, Hare doesn't try to become permanently uncatchable. He arms himself first, covering his body in flint arrow-points, then deliberately puts himself in the being's path and sings a song inviting the very thing he's about to spend three tries dodging. 'Then this being came at him... But Hare jumped aside as he attempted to lap him in and he missed him.' He lets it happen three times, still unprepared to accept it, testing his own readiness or simply extending the setup. Only after everything is in place does he stop evading: 'Three times he missed him. The fourth time, however, Hare allowed himself to be lapped in voluntarily.' The distinction that matters isn't whether Hare gets caught, he was always going to be, it's that being caught happens on a schedule Hare set, armored in a way his captor doesn't know about, rather than as a surprise he has to react to from inside. Diagnostic move: when an outcome is coming regardless of how long you delay it, ask whether the time you're spending on evasion would be better spent preparing for what happens the moment it lands, so that when it finally does, it happens on your terms and not as an ambush."
