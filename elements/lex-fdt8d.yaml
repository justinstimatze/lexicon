id: lex-fdt8d
name: preempt-resistance-by-representing-every-interest-in-the-approval-body
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When designing a new organization inside an environment with 'a rigid structure and powerful vested interests,' don't wait for resistance to changes and then negotiate case by case — build a governing body from the outset that already includes a seat for every group whose interests could be threatened by a future change, so that consultation happens automatically rather than as an afterthought. Goss documents this as the specific reason a new medical-training program's frequent internal changes met almost no organized administrative resistance: 'Representatives of all of the groups concerned with patient care in the hospital and in the medical college were included in the Advisory Committee... Each of the groups working within the C. C. & T. P., therefore, had a counterpart on the Advisory Committee to whom they were unofficially responsible for the progress of Program activity within their particular domain. This meant, in practice, that potential plans for modification tended to be informally \"cleared\" with the appropriate department head or other administrator before they were put into operation.' Her own explanation is explicit about the design intent: 'it was not simply an accident that Program modification met little organized administrative resistance. From the very beginning, the planners of the Program had taken into account the varied and perhaps diverse interests which would be included in the working personnel of the organization, and had accordingly devised an administrative body wherein all interests were represented. Before given changes were adopted, therefore, consultation with the persons most likely to be concerned was possible.' She names the mechanism with Selznick's technical term for it, quoting his definition directly: 'In Selznick's terms, this situation wherein responsibility is shared represents the end-product of the process of \"cooptation,\" which he defines as \"the process of absorbing new elements into the leadership or policy-determining structure of an organization as a means of averting threats to its stability or existence.\"' — but flags a crucial timing distinction: 'It is an end-product in the case under discussion because, on the administrative level at least, all relevant power groups within the sphere of the Program were already represented in the original formal structure of the organization,' meaning the cooptation happened proactively, at design time, rather than reactively, in response to an emerging threat as in Selznick's classic TVA case. Diagnostic move: before launching a new initiative inside an established institution with entrenched departmental interests, map every group whose turf the initiative could eventually touch, and give each a formal seat in whatever body will approve future changes — built in from day one, not granted later as a concession once resistance has already organized."
