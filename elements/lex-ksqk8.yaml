id: lex-ksqk8
name: play-decomposes-into-four-irreducible-vectors-contest-chance-pretense-vertigo
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you analyze any voluntary-engagement situation (a game, ritual, party, performance, social-app, gambling-mechanic, festival, work-culture, designed experience), decompose its motivational pull into Caillois's FOUR IRREDUCIBLE VECTORS: AGON (skill contest where outcome reflects sustained effort under equal conditions — football, chess, hopscotch), ALEA (chance where the player surrenders to a decision outside their control — roulette, lottery, dice), MIMICRY (simulation where the player becomes someone else under a temporary alternate identity — theater, masquerade, role-play, cosplay), and ILINX (vertigo where the player voluntarily destabilizes their own perception — whirling, swings, free-fall, intoxication, certain extreme music). Each vector is also positioned on a PAIDIA↔LUDUS continuum: paidia is the spontaneous, exuberant, improvisational pole; ludus is the structured, rule-bound, skill-formalizing pole. The four vectors are orthogonal — they can combine but cannot reduce to one another, and most cultures cultivate some pairs (agon + alea in lotteries-of-merit; mimicry + ilinx in masked ecstatic dance) while suppressing others. Transferable diagnostic: when a designed engagement-system is failing or feels flat, name which vectors are present and which are missing — a competitive-only system (pure agon) flattens; a chance-only system (pure alea) feels arbitrary; a mimicry-only system (pure role-play) drifts; an ilinx-only system (pure vertigo) burns out. The transferable critique: many modern engagement systems collapse multi-vector engagement into single-vector optimization, which is why they feel impoverished even when 'engaging.' The pair-prohibitions matter too: Caillois's claim is that some pair-combinations are STRUCTURALLY UNSTABLE — agon and alea both rely on rule-fixity, while mimicry and ilinx both rely on rule-suspension, so the orthogonal pairs (agon-ilinx, alea-mimicry) are rare and unstable cultural forms."
