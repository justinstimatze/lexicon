id: lex-zu836
name: names-rigidly-designate-the-same-referent-across-possible-worlds
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When reasoning about whether a name and a description pick out the same thing under counterfactual variation ('what if X had been different'), don't treat names and descriptions as interchangeable labels. Kripke's claim: a proper name is a rigid designator — it designates the same object in every possible world in which that object exists. A definite description ('the U.S. President in 1970') is typically non-rigid — it designates whoever satisfies the description, and that can be a different individual across possible worlds. This is why 'Nixon might not have been president' is coherent (a contingent fact about Nixon) while 'Nixon might not have been Nixon' is not (Nixon rigidly designates Nixon in every world he exists in). Apply this whenever an identifier is being asked to survive a counterfactual, a version change, or a redefinition: does the identifier track the same referent no matter how its defining properties shift, or does it track whichever thing currently satisfies some description?"
related: [lex-zeznb, lex-cqvnu, lex-ts4qp]
scaffolds-from: [lex-zeznb]
evokes: [rigid-designator, nonrigid-designator, transworld-identity, descriptivist-theory-of-names, the-nixon-example, counterfactual-reference]
lineage:
  - source: primary
    text: kripke-1980-naming-and-necessity
    citation: "Saul Kripke, Naming and Necessity (Harvard University Press, 1980; originally delivered as three lectures at Princeton, 1970, first published in Semantics of Natural Language, 1972). The passage below is from Lecture I."
    quote: "'Let's call something a rigid designator if in every possible world it designates the same object, a nonrigid or accidental designator if that is not the case. [...] One of the intuitive theses I will maintain in these talks is that names are rigid designators.'"
canonical-instances:
  - "Kripke's own contrast case: 'the U.S. President in 1970' is a nonrigid designator — someone other than Nixon (Humphrey) might have satisfied it, so it picks out different people across possible worlds. 'Nixon' is a rigid designator — no one other than Nixon might have been Nixon. The description could have failed to apply to Nixon; the name could not have failed to refer to him, in any world where he exists at all."
  - "software identifiers: a database primary key or a UUID is engineered to be a rigid designator — it must keep tracking the same row even after every other column (including the columns a human would use to describe that row) changes. A query keyed on a description ('the customer with that email address') is nonrigid — change the email and the description now designates someone else, or no one."
  - "version numbers vs. project names: 'Windows 11' as a proper name rigidly designates one specific OS release regardless of what features it ships with; 'the current version of Windows' is a nonrigid description that designates whatever release happens to be current, a different referent at different times. Confusing the two is why 'the current version broke my workflow' bug reports are hard to track across releases — the reporter meant the nonrigid description, the tracker needs the rigid designator (the specific build number)."
  - "legal and organizational identity: a company's name (or a person's legal name) is treated as rigidly designating the same legal entity even as every one of its properties changes (ownership, product line, employees, even the name itself via a rebrand with an explicit successor clause) — which is precisely what makes 'is this still the same company' a live question when the rigid-designation convention and the underlying continuity of properties come apart (a shell company retaining a name after total turnover; a rebrand that explicitly disclaims continuity)."
  - "operationally distinct from lex-zeznb signifier-bifurcates-into-denotation-and-connotation: Mill's claim is that proper names lack connotation (they don't ascribe attributes to what they denote); Kripke's claim is a modal one about what happens to reference under counterfactual variation. The two compose — Mill's non-connotative names are good candidates for Kripke's rigid designators — but Kripke's contribution is specifically about behavior ACROSS possible worlds, which Mill's synchronic denotation/connotation distinction doesn't address on its own."
  - "operationally distinct from lex-cqvnu name-to-referent-correspondence-precedes-effective-coordinated-action: Confucius's zhengming is about a name CURRENTLY tracking its referent correctly (a synchronic correspondence requirement for coordinated action); this atom is about whether a name keeps tracking the SAME referent under counterfactual or definitional variation (a modal/diachronic stability claim). A name can satisfy zhengming today and still be nonrigid if its correspondence depends on a description that could shift to pick out something else."
critical-questions:
  - "is the identifier in front of you actually functioning as a name (rigid) or as a disguised description (nonrigid) — would it survive the referent losing the properties that currently justify calling it that?"
  - "when a system 'renames' something, is the underlying rigid designator (the database key, the legal entity, the person) staying constant while a label changes, or is the label staying constant while what it points at silently changes? These are opposite failure modes and get confused for each other."
  - "for version-tracking / bug-tracking / citation contexts specifically: has 'the current X' (nonrigid) been used where a specific, dated, rigidly-designating identifier was needed?"
  - "is the claim actually about the SAME entity across the counterfactual, or does the counterfactual quietly substitute a qualitatively-similar-but-numerically-different entity — and does the argument's force depend on not noticing the substitution?"
status: active
