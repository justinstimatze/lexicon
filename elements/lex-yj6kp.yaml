lineage:
  - source: primary
    text: hyde-the-three-plots-available-for-a-threshold-disruptor
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' drawing on Vladimir Propp's structural analysis of folktale plot and Paul Radin's commentary on the Winnebago trickster cycle. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "There are only a few ways to deal with him, too, only, limited number of plots. From the edge of a group or the threshold of a house there are only a few ways a trickster can move: he can come inside, he can leave entirely, or he can stay exactly where he started, resisting all attempts to civilize or exile."
canonical-instances:
  - "A company facing a disruptive, rule-breaking star employee eventually either promotes them into formal leadership where their disruption becomes sanctioned policy (domestication), fires them (exile), or lets them continue indefinitely as an unmanaged, semi-tolerated exception whose status never resolves either way (permanent threshold)."
  - "A social movement's most radical founding faction typically either gets absorbed into the mainstream organization's leadership as the movement matures (domestication), gets purged or splits off entirely (exile), or persists for decades as an unincorporated fringe that the mainstream organization neither expels nor accepts (permanent threshold)."
critical-questions:
  - "Is this taxonomy actually exhaustive, or does Hyde's own material (Hermes' partial, complicated domestication -- still untrustworthy toward mortals, still the trickster among the gods) suggest a fourth category of incomplete or conditional resolution that doesn't cleanly fit any of the three?"
  - "Do these three outcomes correspond to real, distinguishable processes, or are 'domestication' and 'permanent threshold' sometimes just different names applied to the same ongoing tolerated exception, depending on how settled an observer judges it to be?"
  - "Does the taxonomy hold outside narrative structure -- is there independent evidence that real institutions actually converge on one of exactly three endings when handling a disruptor, or is this a pattern more true of how stories get told than of how history actually unfolds?"
status: active
