id: lex-vkqnv
name: compulsive-response-to-mockery-overrides-a-survival-critical-silence
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A commitment to stay silent for survival can be overridden by the compulsion to respond to mockery, even when the person knows exactly what breaking silence will cost and has every reason to let the insult pass unanswered. In the Jataka's tale of the talkative tortoise, two geese carry him aloft by a stick gripped in his teeth, on the explicit condition that he stays silent no matter what. Jeered at by village children below, he opens his mouth to retort: 'Well, and if my friends do carry me, what is that to you, you caitiffs?' and falls to his death. The tortoise didn't forget the stakes or misjudge the risk — the pull to answer an insult overrode a commitment he understood perfectly well, in the exact moment that commitment mattered most."
related: []
evokes: [jataka, dukanipata, kacchapa-jataka-215, compulsion-to-answer-mockery-overrides-known-stakes, breaking-silence-at-the-worst-possible-moment]
