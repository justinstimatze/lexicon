id: lex-8m2fg
name: net-aggregate-change-conceals-offsetting-individual-level-flows
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When you observe a modest net change, a near-stable total, or even a small reversal in an aggregate statistic between two time points, do not conclude the underlying population was mostly stable or shifted only slightly — check whether that small net figure is actually the residue of two much larger, roughly-offsetting flows in opposite directions, visible only once you break the aggregate down into individual-level transitions. Kendall and Selvin set up exactly this trap and then defuse it with panel data. The cross-sectional trend across classes (Tables 14-16) predicted that internship assignments should keep moving toward specialization: 'If the trend discernible in internship choices were continued through the period in which actual assignments are made, one would expect a considerable majority of the graduating students at Cornell to seek and to receive specialized internships. But this is not the case.' Matching each student's own third-year stated preference against their own fourth-year actual assignment (Table 17) reveals why the net result undershot the prediction: 'we find here that 20 of the 71 students who had expressed a preference for rotating internships at the end of their third year ended up the following March with specialized assignments. But what we had not observed before (compare with Table 16) is that the trend in this direction is counterbalanced—even slightly outweighed—by a trend in the opposite direction. Of the 91 students who had originally said that they hoped to obtain specialized internships, 27 ended up with rotating assignments.' A researcher looking only at the two class-wide totals (how many wanted specialized at the end of third year vs. how many actually received specialized assignments) would see a small, unremarkable decline and might describe it as 'a modest cooling of interest in specialization.' The individual-level breakdown shows something structurally different: 47 of 162 students (nearly 30 percent) actually changed which type of internship they were heading toward, in two directions of comparable size that happen to nearly cancel — the population was not stable and not mildly declining in its enthusiasm, it was churning substantially, with the churn in one direction slightly exceeding the churn in the other. The small net figure and the large gross churn are both true at once; only the panel cross-tab, not the two aggregate totals, tells you which one you are actually looking at. Distinct from verifying-one-causal-arm-leaves-the-reverse-arm-untested (lex-t732m): that atom is about a suspected feedback loop where one causal DIRECTION has been tested and the other has NOT, so the discipline is naming and flagging the untested arm. This atom is about a case where BOTH directions of change are already measured and visible in the data — the risk is not an untested hypothesis but a naive reading of an aggregate number that never looks at the individual-level breakdown at all, so the churn is sitting right there in transitions the researcher already has, just uncombined into the cross-tab that would reveal it. Diagnostic move: whenever an aggregate change is described as 'a shift of N percent' or 'roughly unchanged,' ask whether the underlying data permits an individual-level (panel) breakdown, and if so, demand it before accepting the aggregate figure as a description of population stability or a uniform trend — a small net number and a large invisible churn are not competing explanations, they can both be exactly correct."
