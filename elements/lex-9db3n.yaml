id: lex-9db3n
name: never-fully-merge-your-force-into-anothers-even-in-cooperation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When collaborating closely with an ally, partner organization, or larger coalition, don't let your own team, resource, or asset become fully absorbed into the joint effort's shared structure -- keep it identifiably and operationally yours, because full merger is one of the few conditions from which you can't simply walk away when the alliance sours or the joint effort ends. Kautilya's summary standard for an ideal army specifies this as a named calamity to avoid: 'In war, it should never be abandoned, left leaderless or totally merged into someone else's army.' The pairing with 'abandoned' and 'left leaderless' is instructive -- all three describe ways a force stops being a controllable, extractable asset of its own commander, whether through neglect, decapitation, or dissolution into a larger whole. Being merged is the cooperative-sounding version of the same failure: nothing hostile has happened, the merger may even have been mutually agreed and beneficial in the moment, but the practical result is identical to abandonment -- the original commander can no longer reliably extract, redirect, or reclaim the force as a distinct instrument once it's needed for something other than the joint purpose it was merged for. Diagnostic move: when entering a close partnership, joint venture, or coalition, notice the moment your people, budget, or authority stop having a clearly marked boundary and a route back to your sole control -- treat that boundary-loss as a cost of the collaboration to weigh explicitly, not a natural and costless byproduct of good cooperation, and keep a subset of the merged resource identifiably separable even while the joint effort is working well."
