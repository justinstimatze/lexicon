lineage:
  - source: primary
    tradition: lent-2021-web-of-meaning
    text: lent-2021-ch2-original-ai-animate-intelligence
    citation: "Jeremy Lent, *The Web of Meaning: Integrating Science and Traditional Wisdom to Find Our Place in the Universe* (New Society 2021), Ch.2 'The Original AI: Animate Intelligence' (opening pages). Lent transmits the canonical Clever Hans episode (Oskar Pfungst's 1907 *Das Pferd des Herrn von Osten*) to make a different point — that scientific skeptics dismiss the case to deny animal intelligence broadly, but the case actually demonstrates extraordinary nonverbal-cue perceptiveness in the horse. The transferable claim Lent's framing exposes is bidirectional. Lent emphasizes that Hans's ability to read subtle human cues IS a form of intelligence the skeptics overlook; the atom emphasizes the COMPLEMENTARY methodological lesson — wherever observer-cue-tracking is possible, the test no longer measures what it was designed to measure. Pfungst 1907 (English translation 1911 *Clever Hans (The Horse of Mr. Von Osten)*, public-domain) is the primary source for the original investigation. The atom's modern systematization owes to Robert Rosenthal's 1966 *Experimenter Effects in Behavioral Research* and Rosenthal & Jacobson 1968 *Pygmalion in the Classroom*, which extended the cue-leakage mechanism to human research subjects and to educational settings. The double-blind procedure in pharmacology (foundational for the modern RCT) is the methodological corollary of the same mechanism applied to placebo response."
    quote: "[Lent 2021 Ch.2 opening case, on the original investigation:] 'In the early twentieth century, a German horse known as Clever Hans became an international sensation. His owner would ask him to multiply two numbers, such as three and four, and Clever Hans would answer by tapping his hoof twelve times. There seemed to be no end to Hans's intellectual acumen: he could calculate fractions, tell the time and figure out the date of a given weekday if he knew the date of an earlier day. As his fame spread, with reports of his skills featuring in the New York Times, the German authorities commissioned a psychologist, Oskar Pfungst, to evaluate Clever Hans's intelligence. Pfungst eventually discovered that Hans could only give the correct answer when the questioner already knew it and Hans could see the questioner. It turned out that Hans was noticing subtle facial and bodily cues in the questioner when he reached the correct number of taps. When the questioner was hidden from Hans's view, the horse's mathematical skills suddenly disappeared.' [Lent 2021 Ch.2, on the lesson conventionally drawn:] 'Ever since then, the story of Clever Hans has been rolled out by scientific sceptics whenever they want to pour cold water on reports of intelligence in the nonhuman world. They warn disparagingly of the dangers of anthropomorphism: the tendency to read human intentions, intelligence and emotions into natural phenomena.' [Lent 2021 Ch.2, on the lesson actually warranted:] 'However, the true significance of the Clever Hans episode seems to have been lost amid the sceptics' knowing smirks. In their efforts to ridicule the notion of Hans's mathematical abilities, they ignored the astonishing perceptiveness Hans demonstrated in reading the unconscious behavior of his questioners.'"
canonical-instances:
  - "Clever Hans / Pfungst 1907: the founding case. A horse appeared to perform arithmetic by hoof-tapping. Pfungst's controlled study isolated the cue: when the questioner did not know the answer, accuracy collapsed; when the questioner could not be seen by the horse, accuracy collapsed; the cue was sub-perceptual posture-and-breath release at the correct tap count. The case established the principle that observer-knowledge of the target answer must be controlled for in any claim of subject ability"
  - "double-blind RCT (foundational pharmacology methodology): the gold-standard drug-trial design requires that NEITHER the patient NOR the immediate observer (the clinician administering the dose, the nurse recording the symptom) knows which arm the patient is in. The double-blind is the operational instantiation of the Clever-Hans rule-out: it eliminates BOTH placebo-response (subject knowing) AND observer-cue-leakage (observer knowing). Single-blind protocols control only one side and routinely produce inflated effect sizes that double-blind protocols do not reproduce"
  - "Rosenthal-Jacobson 1968 Pygmalion-in-the-classroom: teachers were told (falsely) that certain students had high learning-potential. The students' actual subsequent IQ-gain measurably exceeded controls. The mechanism was not direct instruction-quality difference but cue-leakage — teachers gave the labeled-high-potential students more eye contact, more wait-time on questions, more warmth in tone, more challenging follow-up. The students tracked these cues and produced the predicted higher performance. The experimenter-expectancy effect at population scale"
  - "parapsychology and dowsing testing (Targ & Puthoff 1970s-1980s, James Randi 1980s onward): purported psychic ability under controlled blind conditions repeatedly fails to reproduce the unblinded results. The replicable finding across the literature is that blinding the protocol (the experimenter does not know the target; the protocol is randomized; the subject cannot see the experimenter) collapses the effect to chance. The mechanism is not subject-fraud (usually) but cue-tracking the subject did not know they were doing"
  - "courtroom lineup identification (Wells 2006 sequential-vs-simultaneous-lineup research): when the detective administering the lineup knows which member is the suspect, the detective's posture, prompt-timing, and prosodic emphasis leak to the witness. Witnesses identify the suspect at rates above chance even when the suspect did not commit the crime. Double-blind lineup administration (the administering officer does not know which member is the suspect) measurably reduces false identification. The cue-channel is exactly the Clever Hans channel"
  - "AI-evaluation blind protocols (modern LLM eval methodology): when a human grader scores model outputs while knowing which model produced them, the score is contaminated by the grader's prior expectation of the model's quality. The brand-blind eval (the grader does not know which model produced which output) is the AI-domain instance of the double-blind protocol. The arena-style head-to-head with random side-assignment is the AI-domain rule-out of the Clever Hans channel. Internal evals that show 'our new model beats the competitor' without brand-blind grading are not measuring what they claim to measure"
  - "peer review (signed-vs-blind review effect, Ross et al. 2006, Tomkins et al. 2017): when reviewers know the author identity, the review score systematically reflects prior expectation of the author's reputation rather than the manuscript-content. Double-blind review (author and reviewer both anonymized) reduces (does not eliminate) the effect. The mechanism is the same Clever Hans cue-channel applied to the reviewer's prior over manuscript-source"
  - "operationally distinct from lex-y48fs pyramid-of-choice: lex-y48fs names how an initial small commitment cascades into incrementally larger self-justified positions. lex-v95t7 names how observer-cues leak target-answers to subjects who then produce them. Different mechanisms — lex-y48fs is internal-justification dynamics within a single agent; lex-v95t7 is cross-agent information-leak through a cue-channel. They CAN compound (a subject who has produced the expected answer once will pyramid-justify producing it again), but the substrate-primitive is distinct"
  - "operationally distinct from lex-yh672 left-brain-interpreter-constructs-confident-causal-narrative: lex-yh672 names how a SINGLE agent constructs post-hoc explanations of its own behavior. lex-v95t7 names how a TWO-AGENT system leaks the expected outcome through a cue-channel that neither party is aware of. Cross-fire: a subject who has produced the expected answer via cue-tracking (lex-v95t7) will then construct a left-brain-interpreter narrative (lex-yh672) about why they produced it. Coupled but distinct mechanisms"
  - "operationally distinct from lex-ubdyr self-observation-converts-in-process-cognition-into-static-product: lex-ubdyr names how the act of self-observation distorts the cognition being observed. lex-v95t7 names how an external observer's expectation leaks to the subject. Both are observer-effects in a broad sense but operate through different channels (self-observation vs other-observation cue-leak)"
critical-questions:
  - "the cue-channel inventory: in the protocol being evaluated, what cue-channels exist between an observer who knows the target outcome and the subject whose ability is being measured? Inventory candidates: direct visual contact, prosody-of-prompt-delivery, micro-timing of follow-up, paralinguistic affirmation (mm-hm, head-nod), posture-shift on candidate-saying-the-target-word, breath-hold-then-release, eye-contact-released, room-temperature-or-other-environmental correlate of the target. If any cue-channel survives the protocol, the result is not yet attributable to the claimed subject-ability"
  - "the observer-blinding diagnostic: is the immediate observer (the one who records, scores, prompts, or interacts with the subject) ignorant of the target outcome at the moment of measurement? If only a remote analyst is blinded but the immediate interaction-partner is not, the cue-channel is open. Most failures of blinding I have seen in practice are this shape — the principal investigator is blinded but the data-collecting RA is not"
  - "the cue-removal replication: when the protocol is rerun with the cue-channel blocked (observer-blinded, or subject-cannot-see-observer, or interaction-mediated-through-typed-text-only, or video-of-interaction-scored-by-blind-third-party), does the original result reproduce? If not, the original result was at least partly cue-tracking. Pfungst's case is the prototype — the original result reproduced only when the observer knew the answer AND the horse could see the observer"
  - "the AI-eval blind-protocol check: when claiming that a model demonstrates capability X, are the graders blind to which model produced the output? Are the prompts presented in randomized order? Is the side-assignment in pairwise comparison randomized per question? When these blind controls are absent, the eval is measuring grader-expectation-of-the-model-brand at least partly, and the gap between blind-eval and unblinded-eval scores is the contamination magnitude"
  - "the educational-and-clinical-practitioner application: when a teacher, therapist, or clinician 'sees improvement' in a student or patient under an intervention they administered and believe in, the improvement is partly the intervention and partly the cue-channel transmitting the expectation. The practitioner-discipline is to (a) acknowledge the cue-channel exists, (b) seek blind measurement (a colleague who doesn't know the protocol scores the outcome), (c) take improvement-claims under the practitioner's own observation with appropriate skepticism. The point is not to dismiss the practitioner's observation but to triangulate"
  - "the cue-channel as legitimate signal: the Lent reading inverts the usual interpretation — Clever Hans's cue-tracking ability is itself a sophisticated form of intelligence (animate-perception of social signal) that the skeptical reading misses. When designing a system that should USE the cue-channel rather than rule it out (a service-animal trained on owner-affect, a human-AI interaction protocol that should be affect-aware, a teacher who should be expectation-positive toward all students), the cue-channel is the FEATURE, not the bug. The atom does not advise removing cue-channels universally — it advises removing them when the claim is about an underlying ability the cue-channel could fake"
