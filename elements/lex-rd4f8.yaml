lineage:
  - source: primary
    text: zitkala-sa-manstin-envies-blind-grandfathers-magic-bags
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'Manstin, the Rabbit.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'My grandchild, your eyes are your luxury! you would be unhappy without them!' the old man replied. ... 'Grandfather, I would give you my two eyes for your place!' cried Manstin. 'How! you have said it. Arise. Take out your eyes and give them to me. Henceforth you are at home here in my stead.'"
canonical-instances:
  - "A junior employee envies a senior colleague's relaxed pace and generous accommodations, not realizing those accommodations exist specifically because a past injury limits the colleague's mobility -- and after requesting and receiving the same arrangement without the underlying condition, finds themselves under-stimulated, isolated from the fast-paced work they actually thrived on, and worse off than before."
  - "Someone envies a retired relative's apparently carefree, unstructured days, not accounting for the relative's declining health and narrowing social circle that the unstructured time is actually a response to -- and after deliberately restructuring their own life to match, discovers the same free time feels empty rather than restful, because it was never designed for someone without the relative's specific constraints."
critical-questions:
  - "how does someone actually identify, from the outside, what specific constraint another person's comforts or accommodations are compensating for, when that constraint often isn't visible or disclosed -- is this diagnostic move even practical to apply before making the trade?"
  - "is every instance of envied ease actually compensation for a hidden constraint, or does this framework risk explaining away legitimate cases of someone simply having an easier, less burdened life for no compensating reason at all?"
  - "does the old grandfather bear some responsibility for letting Manstin make an obviously bad trade despite a clear warning, or is Manstin's own refusal to heed a direct warning the entire point, making this a story about ignored advice rather than hidden constraints?"
