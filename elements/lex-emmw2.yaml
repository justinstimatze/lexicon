id: lex-emmw2
name: practice-activity-requires-a-situated-decision-not-abstract-recall
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when designing, reviewing, or auditing a learning/training item — a course question, a certification exam item, an onboarding quiz, a compliance module — and asking whether it will actually build the on-the-job skill it claims to. Moore's diagnostic: an item counts as a genuine PRACTICE ACTIVITY, one that predicts transfer to real performance, only if it requires the learner to make a realistic decision with consequences inside a plausible situation. If it instead asks the learner to recall or recognize a fact, definition, or procedure OUTSIDE any situational context, it is a TEST QUESTION — regardless of surface format. Format is a red herring: a multiple-choice question, a video, a click-to-reveal interaction, or a branching scenario can each be either kind of item; what determines the kind is what the item cognitively demands (apply a decision-rule to a specific realistic case vs. retrieve a decontextualized fact), not its media. Moore's own canonical minimal pair makes the test operational: 'What's the most secure way to transfer sensitive data to another PC?' is a test question (retrieve abstract information from memory-clutter); 'Tanya wants to work on salary data at home, but needs to pick up her kids and stop for groceries on the way — how should she get the data home?' is a practice activity (apply the same knowledge to make a realistic, consequential decision). Practitioner moves: (1) for any existing or proposed learning item, ask 'does this require recalling a fact, or making a decision in a situation?' — if the situational specifics could be stripped out without changing what's being asked, it's a test question wearing a scenario's clothes; (2) don't mistake engagement features (narration, animation, branching, gamified points) for practice-activity status — a beautifully produced item that still only asks for recall remains a test question; (3) when auditing an existing curriculum for why it isn't changing behavior despite high pass rates, check whether its assessment items are secretly all test-questions-in-disguise. Caveat: this is not a claim that recall/knowledge-check items are worthless — a knowledge-check has legitimate uses (verifying prerequisite facts are held) that a practice activity does not serve, and some domains genuinely require memorized facts as a precondition for situated decision-making. The claim is narrower: don't mistake a test question for a practice activity, and don't expect test-question-heavy training to change on-the-job behavior."
related: [lex-ftke9, lex-555ug, lex-kcgcw, lex-96qnn, lex-ay4et]
scaffolds-from: [lex-96qnn]
evokes: [practice-activity-vs-test-question, situated-decision-with-consequences, decontextualized-recall, the-tanya-data-privacy-example, format-is-not-the-diagnostic]
lineage:
  - source: primary
    text: moore-2017-practice-activity-diagnostic
    citation: "Cathy Moore, Map It: The Hands-On Guide to Strategic Training Design (Championship Press, 2017), Chapter 7 'Brainstorm activity ideas,' the section 'What's a practice activity?' introducing the Tanya/salary-data minimal pair and the 'most secure way to transfer sensitive data' contrast case."
    quote: "What's a \"practice activity?\" I've been using the term \"practice activity\" a lot. But what does that mean? Let's consider a data privacy course. Does the following question help people practice making the decisions they need to make on the job, or is it more like a test question? Tanya wants to work on the salary data on her home computer. On her drive home, she needs to pick up her kids at school and stop for groceries. How should she get the data home? If you said, \"That's a practice activity,\" I agree. We're asking people to make a decision similar to the decisions they have to make on the job. They're not just recalling information; they're using it to make a realistic decision. The fact that it's text instead of, say, video is irrelevant. It's the decision that matters. How about this question? Is it a test question or practice activity? What's the most secure way to transfer sensitive data to another PC? That's a test question, because it simply asks people to retrieve abstract information from the clutter in their brain. It's not asking them to also apply that information to a realistic situation. A test question asks people to recall information. It takes place in an abstract world."
canonical-instances:
  - "Moore's own contrast case: 'What's the most secure way to transfer sensitive data to another PC?' (test question, abstract recall) vs. 'Tanya needs to get salary data home but has to pick up her kids and stop for groceries — how should she transfer it?' (practice activity, situated decision)."
  - "Corporate compliance training: a sexual-harassment module that asks 'Which of the following is prohibited conduct under policy X?' tests recall of the policy; a module that presents a specific ambiguous workplace interaction and asks what the learner should do next is a practice activity."
  - "Medical/nursing certification exams: a question asking learners to name the four stages of a pressure ulcer is a test question; a question presenting a specific patient's chart and vitals and asking what intervention is indicated is a practice activity."
  - "Software onboarding: a quiz asking 'what does this API endpoint return?' is a test question; a task asking the new hire to fix a specific broken call given a stack trace is a practice activity."
critical-questions:
  - "how is this different from lex-kcgcw deliberate-practice-builds-mental-representations-not-mere-hours (Ericsson)? Ericsson's claim is about the STRUCTURE OF REPEATED PRACTICE OVER TIME (comfort-zone-edge, feedback, guided refinement) that builds expert mental representations across many practice sessions. This atom is about a SINGLE-ITEM DESIGN DIAGNOSTIC — does any one given learning item, in isolation, count as practice or as a test — prior to and independent of any question about repetition or feedback structure over time. A single well-designed practice-activity item, per this atom, could still fail to build expertise per lex-kcgcw if it's never repeated with feedback across a deliberate-practice regime; the atoms compose (lex-emmw2 diagnoses whether an ITEM qualifies as practice-material at all; lex-kcgcw diagnoses whether a practice REGIME built from such items is structured for skill growth) but answer different-grained questions."
  - "how is this different from lex-ftke9 work-backwards-from-goal? lex-ftke9 is a general planning heuristic about deriving PRECURSOR STEPS from a desired END-STATE (its own example is chess endgame analysis). This atom is not about deriving steps from a goal; it is a narrower CLASSIFICATION TEST applied to an already-existing or proposed learning item, asking what cognitive operation the item demands (situated decision vs. decontextualized recall). An item could be correctly derived via backward-design from a clear performance goal and still fail this atom's test if its final form only asks for recall — the two atoms operate at different stages (deriving what to build vs. checking whether what got built qualifies as practice)."
  - "isn't this just 'realistic examples are better than abstract ones,' a truism? No — the claim is sharper and falsifiable: REALISM OF SETTING ALONE does not make an item a practice activity; the setting must make a CONSEQUENTIAL DECISION do the cognitive work. An item can be dressed in an elaborate, realistic scenario and still be a test question if the situational detail is decorative — i.e., if the same question ('what's the definition of X') could be extracted unchanged with the scenario stripped away. The diagnostic is about what's actually being asked, not how dressed-up the asking is."
