id: lex-7pk48
name: leaving-early-beats-staying-to-out-clever-a-foreseen-danger
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a foreseeable danger is announced, weigh immediate departure against staying and trusting your own cleverness to handle it once it materializes — the Panchatantra's fable argues the first option wins even against real intelligence. Three fish hear a fisherman announce he'll return to net their pond. Hundred-Wit and Thousand-Wit, confident in their own resourcefulness, stay; Single-Wit leaves immediately. The fisherman returns and nets the pond exactly as warned: Hundred-Wit, who overthought his options, is caught; Thousand-Wit survives only by playing dead at the last possible second; Single-Wit is already gone. The verse states the outcome plainly: 'While Hundred-Wit is on a head, while Thousand-Wit hangs limp and dead, your humble Single-Wit, my dear, is paddling in the water clear.' The unglamorous response — leaving before the danger arrives — outperforms both the failed and the barely-successful bet on in-the-moment cleverness."
related: []
evokes: [panchatantra, ill-considered-action, leave-early-beats-clever-in-the-moment-response, confidence-in-wit-as-a-foreseeable-risk]
lineage:
  - source: primary
    text: panchatantra-ryder1925-hundred-wit-thousand-wit-and-single-wit
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book V, 'Hundred-Wit, Thousand-Wit, and Single-Wit.' Verified verbatim against a direct extraction of the held copy."
    quote: "While Hundred-Wit is on a head, While Thousand-Wit hangs limp and dead, Your humble Single-Wit, my dear, Is paddling in the water clear."
canonical-instances:
  - "an employee who hears credible early rumors of mass layoffs starts a new job search immediately rather than staying to see if they can talk their way onto the survivors' list, while two more confident colleagues stay and gamble on their own indispensability — one gets cut with no notice, the other barely survives after a scramble, and the one who left early is already settled somewhere else."
critical-questions:
  - "Does this claim hold when leaving early carries a real, certain cost of its own — abandoning a genuinely good position on the strength of a threat that might not have materialized — or does the fable only look this clean in hindsight, once we know the fisherman actually returned?"
  - "Thousand-Wit's in-the-moment improvisation did work, barely — does the fable undervalue that outcome by focusing on how close it came to failing, when a real second option that succeeds is still a viable strategy?"
status: active
