lineage:
  - source: primary
    text: whitman-1855-leaves-of-grass-song-of-myself
    citation: "Walt Whitman, 'Song of Myself,' in *Leaves of Grass* (Brooklyn, NY, 1855; revised and expanded through the 1892 'deathbed' edition, in which the poem's now-standard section numbering was fixed). The 'Do I contradict myself?' couplet closes the poem's penultimate movement (§51 in the standardized numbering); it is the poem's own explicit naming of a posture it has been demonstrating since its early sections, not an isolated aphorism."
    quote: "[The headline couplet, §51:] 'Do I contradict myself? / Very well then I contradict myself, / (I am large, I contain multitudes.)' [§16, the both-poles-at-once catalogue that establishes the pattern well before the couplet names it:] 'I am of old and young, of the foolish as much as the wise, / Regardless of others, ever regardful of others, / Maternal as well as paternal, a child as well as a man, / Stuff'd with the stuff that is coarse and stuff'd with the stuff that is fine... / One of the Nation of many nations, the smallest the same and the largest the same.' [§22, the explicit refusal to specialize in one moral register, and the explicit rejection of the demand for a resolved position:] 'I am not the poet of goodness only, I do not decline to be the poet of wickedness also. / What blurt is this about virtue and about vice? / Evil propels me and reform of evil propels me, I stand indifferent, / My gait is no fault-finder's or rejecter's gait, / I moisten the roots of all that has grown.' [§22, the same section, claiming identification across the full range rather than a settled position:] 'I am integral with you, I too am of one phase and of all phases. / Partaker of influx and efflux I, extoller of hate and conciliation.' [§33, the long catalogue section, first-person identification with a victim of violence immediately following identification with an ordinary sufferer, without resolving the two into one consistent social position:] 'All this I swallow, it tastes good, I like it well, it becomes mine, / I am the man, I suffer'd, I was there... / The hounded slave that flags in the race, leans by the fence, blowing, cover'd with sweat... / All these I feel or am. / I am the hounded slave, I wince at the bite of the dogs, / Hell and despair are upon me, crack and again crack the marksmen, / I clutch the rails of the fence, my gore dribs, thinn'd with the ooze of my skin.' [§51, the lines immediately preceding the couplet, showing the couplet arrives mid-monologue rather than as a detached maxim:] 'The past and present wilt⁠—I have fill'd them, emptied them, / And proceed to fill my next fold of the future... / Listener up there! what have you to confide to me? / Look in my face while I snuff the sidle of evening, / (Talk honestly, no one else hears you, and I stay only a minute longer.)'"
  - source: discovery-loop
    text: distinctness-audit-whitman-contradict-myself-vs-existing-substrate
    citation: "Lex-0648 (Hofstadter, strange loops, paradoxical level-crossing feedback arises when a system models itself) is a structural/mechanistic claim about how self-referential paradox arises — a system modeling itself generates level-crossing feedback — while this atom is a posture toward an already-arisen contradiction (resolve it, dissolve it, or, per Whitman, refuse to and call it scale) and takes no position on the mechanism of origin. Lex-0095 (contradiction-resolution-via-parameter-decomposition) is a resolution technique — find the tension-bearing parameter, split it by time, space, or context, and watch the contradiction disappear — and is in fact a near-opposite of Whitman's move: 'Very well then I contradict myself' is not 'I only appear to contradict myself because I mean X in one context and Y in another.' Lex-0271 (apparent-contradiction-marks-domain-boundary-not-rule-failure) is a domain-boundary-identification resolution move for formal and physical rules, not a posture toward a self's contradiction; its own related array already links it to both lex-mnxhs and lex-x4cw4, forming a visible resolve/dissolve cluster this atom stands outside of and against. Lex-0129 (cognitive dissonance) names the psychological pressure to resolve two co-held cognitions via cheap rationalization or costly belief-update; Whitman's posture is a third option neither of these names, leaving the dissonance fully intact and re-describing it as evidence of size rather than instability. Lex-0364 (Bakhtin, polyphonic-narration-grants-multiple-voices-equal-authorial-weight) is a narrative-structural claim requiring plural discrete characters or voices coexisting in a text without authorial subsumption; this atom is about a single first-person 'I' containing internal heterogeneity without splitting into separate voices — a real but distinct relationship, both resisting forced unity but operating on different objects, Bakhtin on a text's cast and Whitman on a single self's internal heterogeneity. No existing atom names this specific claim — self-contradiction embraced as evidence of scale rather than resolved, dissolved, or suffered as dissonance."
canonical-instances:
  - "The headline couplet itself, §51: 'Do I contradict myself? / Very well then I contradict myself, / (I am large, I contain multitudes.)' — the unapologetic 'Very well then' is the critical tone: acceptance offered as strength, not confession offered as weakness."
  - "§16's catalogue of held opposites, establishing the pattern many sections before the couplet names it: 'I am of old and young, of the foolish as much as the wise... Maternal as well as paternal, a child as well as a man, / Stuff'd with the stuff that is coarse and stuff'd with the stuff that is fine.'"
  - "§22's explicit rejection of a single moral register: 'I am not the poet of goodness only, I do not decline to be the poet of wickedness also... Evil propels me and reform of evil propels me, I stand indifferent, / My gait is no fault-finder's or rejecter's gait.'"
  - "§33's first-person identification across victim and ordinary-witness positions in the same breath, without resolving them into one consistent social stance: 'I am the man, I suffer'd, I was there' immediately followed by 'I am the hounded slave, I wince at the bite of the dogs.'"
  - "A modern cross-domain extension responsibly built on Whitman's argument rather than his text: a long-running author, artist, or institution whose decades-spanning body of work is charged with 'inconsistency' when cross-sections from different eras are set side by side, when the more accurate diagnosis is that the body of work is genuinely large enough that no single cross-section could represent all of it — and that forcing one to would require discarding real, legitimate range rather than correcting an actual error."
critical-questions:
  - "Does the entity in question (a self, a career, an organization, a culture) actually have the demonstrated scale to earn the 'I contain multitudes' claim — as Whitman earns it across fifty sections of catalogued opposites before the couplet arrives — or is the line being invoked to cover for a much smaller, un-earned inconsistency that hasn't demonstrated any real range?"
  - "Is this a genuine embrace-as-strength posture (Whitman's 'Very well then'), or is it dissonance-avoidance (lex-we98d) borrowing the same language — a cheap rationalization dressed up as a claim about scale?"
  - "Would the contradiction actually dissolve under parameter-decomposition (lex-mnxhs: different senses, times, or contexts) or domain-boundary analysis (lex-stppu), in which case it isn't really a contradiction requiring this posture at all — or does it survive any such decomposition, which is the actual test for whether 'contains multitudes' applies?"
  - "Is the plurality here ONE self/entity containing internal heterogeneity (Whitman's claim, this atom) or MULTIPLE DISCRETE voices/parts coexisting without one being subsumed by another (Bakhtin's polyphony, lex-mmety)? These look similar from a distance but name different structures."
  - "What specific, real content would have to be cut to force this entity into a consistent through-line? If the answer is 'nothing of value — it was just an unexamined error,' resolve it. If the answer names something genuinely worth keeping, the inconsistency may be the evidence of scale this atom names, not the defect it might first appear to be."
