  - "operationally distinct from lex-2rsad identity-protective-belief-maintenance: lex-2rsad is cognitive operations protecting identity-coherent beliefs; lex-gwx3j is the information-environment architecture that produces the conditions under which lex-2rsad operates without outside-context counter-pressure. Compositional: lex-gwx3j supplies the information environment; lex-2rsad supplies the individual cognitive operations within it."
  - "operationally distinct from lex-k2kdc constitutive-defense-when-the-defense-generates-the-threat: lex-k2kdc is defense-generates-threat at the individual level; lex-gwx3j is information-environment architecture at the algorithmic-network level. Compositional but distinct mechanisms."
  - "operationally distinct from lex-78gp5 inner-ring-admission-priced-in-ethical-compromise: lex-78gp5 is admission-rite mechanism; lex-gwx3j is sustained-immersion mechanism. No explicit admission required for lex-gwx3j (the algorithmic-recommendation supplies entry); the immersion-architecture supplies retention."
  - "operationally distinct from lex-kahec enforcement-becomes-self-defeating-when-the-bound-entity-is-systemically-essential: lex-kahec is institution-vs-society enforcement-failure; lex-gwx3j is algorithmic-network operating beyond reach of traditional institutional enforcement frameworks. Both atoms describe enforcement-failure modes but at different scales."
  - "compositional with lex-f5pns: lex-f5pns supplies the susceptibility-disposition (locus-of-reality-content displaced to others' opinions); lex-gwx3j supplies the algorithmic-network mechanism that monopolizes which others' opinions become the operational-sole source. The two atoms together describe the contemporary information-environment that produces second-hander cognition at population scale."
  - "compositional with lex-w3e3z forcing-the-end-via-prophecy-fulfilling-action: lex-gwx3j supplies the algorithmic-network preconditions that allow lex-w3e3z forcing-action to reach sufficient population-density without traditional institutional architecture. Jan 6 2021 is the operational worked-example where lex-gwx3j produced sufficient lex-w3e3z-readiness in a population without traditional cult-architecture."
  - "compositional with lex-rptqb forced-severance-of-outside-relationships: lex-rptqb operates institutionally (explicit policy, declared SP, mandated shunning); lex-gwx3j operates algorithmically (recommendation-feed monopolization, attention-budget consumption, walled-platform architecture). The two atoms describe complementary mechanisms for achieving functionally-equivalent outside-context isolation. Cult-network of the 2020s+ combines both: explicit institutional architecture WHERE available (Scientology) + algorithmic immersion WHERE distributed (QAnon)."
critical-questions:
  - "the information-environment-closure diagnostic: how closed is the information environment in which the believer is embedded? Test: across a typical day, what fraction of media-content the believer consumes is from sources within the belief-coherent ecosystem vs sources outside it? If the fraction approaches 100% within-ecosystem consumption, lex-gwx3j immersion is fully operative; if the fraction is 50/50 mixed with outside-ecosystem content, immersion is partial; if outside-ecosystem content dominates, immersion is not operative. Practitioner-rule: the within-ecosystem fraction is the diagnostic; the structural variables determining the fraction include algorithmic-feed curation, walled-platform architecture, and the believer's attention-budget allocation."
  - "the attention-budget-consumption test: what fraction of the believer's discretionary attention-budget is consumed by the closed-information environment? Test: across a typical week, what hours-per-day of attention are devoted to ecosystem-engagement (reading Q-drops, watching Q-believer YouTube, posting in Q-believer Telegram groups)? Hours above 4-5/day suggest fully-operative lex-gwx3j immersion; hours 1-2/day suggest partial-immersion; hours under 0.5/day suggest non-operative. The attention-budget is the structural-variable that determines outside-context relationship-maintenance."
  - "the recommendation-algorithm-vector diagnostic: what algorithmic-recommendation systems are operating in the believer's content-environment? Test: identify the recommendation-engines (YouTube Up Next, TikTok For You, Facebook News Feed, Twitter For You, Reddit r/all algorithmic ranking). Document the recommendation-trajectory across time (do recommendations push toward increasingly-extreme content within the ecosystem, or toward outside-ecosystem variety?). The algorithmic-vector is the structural-determinant of lex-gwx3j stabilization."
  - "the prevention-design implication: what structural interventions could prevent lex-gwx3j deployment? Candidate designs: (a) algorithmic-feed transparency requirements (EU Digital Services Act 2022 article 26); (b) recommendation-algorithm audit-and-modification (proposed in US Algorithmic Accountability Act 2022); (c) friction-introduction (rate-limits on extreme-content recommendation, mandatory exposure to counter-evidence); (d) education-and-media-literacy interventions (digital-media-literacy curriculum). Engineering question: do any of these designs survive the social-media-platforms' engagement-maximization commercial-incentive? The EU DSA is the current empirical test."
  - "the cross-platform-migration dynamic: when one platform applies content-moderation that reduces algorithmic immersion (Twitter post-Jan-6 Q-account suspensions, YouTube Q-channel demonetization), the affected community typically migrates to less-moderated platforms (Telegram, Parler, Truth Social, Gab, Rumble). The platform-migration preserves lex-gwx3j immersion while changing the platform-vector. Practitioner-rule: single-platform content-moderation interventions reliably fail at the population-level because of the migration-dynamic; effective prevention requires cross-platform coordination that is currently structurally unavailable."
  - "the cross-scale translation: lex-gwx3j has been attested at cult-population-scale (QAnon ~50M Q-believer-aware population in U.S. 2020), trans-national-jihad scale (ISIS 2014-2019 online-recruitment apparatus), individual-attacker-cohort scale (incel mass-shooting incidents 2018-2024), and emerging-radical-movement scale (eco-accelerationism 2023-2024). The transferable claim: any distributed-belief-network with sufficient information-environment closure can achieve cult-cluster operational outcomes (lex-fjzum/0466) without traditional institutional architecture. The mechanism is the substrate-novelty that algorithmic-network era adds to the cult cluster."
  - "the historical-substrate-context: did lex-gwx3j emerge with the internet era (post-1995) or earlier? Hegghammer 2017's analysis of jihadi forums treats them as functional equivalents of madrassa-and-mosque physical institutions, suggesting the lex-gwx3j mechanism is fundamentally about information-environment closure independent of digital-vs-physical medium. Pre-internet candidates: tract-and-pamphlet ecosystems (Reformation-era Lutheran pamphleteering; 1960s-1980s John Birch Society newsletter circulation); shortwave-radio ecosystems (Cold War anti-Communist broadcasting; militia movement 1990s shortwave). The digital-network era radically increases the lex-gwx3j mechanism's bandwidth and recommendation-algorithm precision, but the substrate-mechanism is likely older. Practitioner-question: what physical-medium-era equivalents of lex-gwx3j operated in pre-1995 mass-society radicalization? Cataloging these would test the transferability across medium-changes."
