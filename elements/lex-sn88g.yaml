name: attachment-to-home-overrides-a-clear-departure-signal
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Attachment to a familiar place can override every reliable signal that it's time to leave. The resulting harm rarely comes from a predator exploiting the delay. It tends to come from an unrelated, oblivious hazard that wouldn't have existed anywhere else. In the Jataka's tale of the tortoise and the drying lake, fish and tortoises correctly read the drought signs and migrate to the river; one tortoise refuses, buries himself in the drying mud out of loyalty to his birthplace, and is killed not by a hunter but by a potter's spade, digging for clay with no idea the tortoise is there. His own dying words diagnose it: 'Go where thou canst find happiness, where'er the place may be; Forest or village, there the wise both home and birthplace see; Go where there's life; nor stay at home for death to master thee.' Home itself was never the danger. Refusing to leave when the signal is clear is what exposes you to whatever happens to be there next, predator or not."
