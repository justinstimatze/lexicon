id: lex-gg87u
name: mechanistic-heterogeneity-can-hide-behind-causally-homogeneous-cases
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When cases look causally homogeneous (same effect, same family of causes), mechanistic heterogeneity may be hiding — the same effect produced by different actual mechanisms. The homogeneity is descriptive; the mechanism could be plural. Don't generalize the mechanism from the descriptive grouping."
related: [lex-znaau, lex-k6d7u, lex-t9fs7, lex-rfxtb, lex-b6kvs, lex-8j5ms, lex-6bycb, lex-eybad, lex-cy243]
scaffolds-from: [lex-8j5ms, lex-znaau, lex-6bycb]
evokes: [mechanistic-heterogeneity, scope-conditions, context-sensitivity-of-mechanisms, snowball-outward-from-typical-case, bounded-population-not-blanket-generalization, same-endpoints-different-paths-fallacy, contextual-conditions-as-enabler-or-inhibitor, beach-pedersen-2019, theorize-mechanisms-at-mid-range-abstraction-not-context-free-one-liners]
lineage:
  - source: primary
    text: beach-pedersen-2019-process-tracing-methods-ch3-5-and-ch4-4
    citation: "Derek Beach and Rasmus Brun Pedersen, *Process-Tracing Methods: Foundations and Guidelines*, 2nd ed., University of Michigan Press 2019. Ch.3.5 'The Importance of Context and the Dangers of Mechanistic Heterogeneity' (pp.77-81) + Ch.4.4 'Five Sources of Mechanistic Heterogeneity' (pp.112-128) + Ch.4.5 'Snowballing Outward as a Strategy to Test the Boundaries of Generalization' (pp.129-144). The transferable claim: two cases that look causally homogeneous at the LEVEL OF CAUSES AND OUTCOMES (same cause-scores, same outcome-scores) can nonetheless be MECHANISTICALLY HETEROGENEOUS — the intermediate process linking C to O can differ either wholly or in one or more parts. Therefore inferring 'same mechanism operates in both cases' from 'same endpoints in both cases' is invalid. The methodological consequence: process-tracing's internal-validity gain (we can show HOW C produces O in this case) has an external-validity COST (we cannot blanket-generalize the mechanism to other endpoint-matching cases without testing whether scope-conditions transfer). The remedy is not to retreat to context-free one-liner mechanisms (Beach criticizes Elster's 'wishful thinking', 'spillover effect' framing as evading the explanatory question) but to (a) explicitly bound the population by scope-conditions, (b) snowball outward by testing cases with progressively more contextual differences from the studied typical case. The five named sources of mechanistic heterogeneity (Ch.4.4): (1) known/unknown omitted contextual conditions; (2) multiattribute concepts hiding sub-mechanism variation; (3) differences of degree in condition-scores triggering different processes; (4) configurational dynamics from condition-sequencing; (5) weakest-link logic in conjunctive solutions. Substrate-distinct from lex-rfxtb (multifactorial-frame's equifinality canonical-instance: cause-side multiplicity producing same outcome via different factor-combinations) — equifinality is the converse shape (different paths produce same outcome); mechanistic heterogeneity is same-cause-same-outcome via different paths. The two compose: equifinality says many paths reach the same outcome; mechanistic-heterogeneity-hidden-by-causal-homogeneity says some of those paths can be invisible even when you fix BOTH endpoints. Substrate-distinct from lex-8j5ms (within-case PT as causal inference) which names the within-case method; this atom is the SCOPE LIMIT on the method's cross-case generalization. Substrate-distinct from lex-6bycb (four-test typology) which is the within-case evidence-classification toolkit; this atom is the cross-case caveat. Substrate-distinct from lex-eybad (emergent-effects-resist-decomposition) which is the non-additivity-of-causes claim; this atom is the context-conditional-mechanism-activation claim."
    quote: "[Beach & Pedersen 2019 Ch.3.5 p.78:] 'Even when the same causes and outcome are present, different contextual conditions can trigger differences in the mechanisms linking them together (Falleti and Lynch 2009; Steel 2008). Context sensitivity of mechanisms means that two cases that look causally homogeneous at the level of conditions (same causes, same outcome) might be heterogeneous when we move to the mechanism level. Mechanistic heterogeneity can both mean that in two or more cases, the same cause triggers different processes, thereby resulting in different outcomes, or it can mean that the same cause is linked to the same outcome through different processes.' [p.77 on the trade-off:] 'What is gained in terms of higher internal validity of causal inferences has costs in terms of the external validity of our findings because of the contextual sensitivity of mechanism-based explanations.' [p.78 on the contextual-condition vs causal-condition distinction:] 'A cause is defined as something that triggers a mechanism, meaning it is in a productive relationship with the outcome. Here a cause does something, whereas a contextual condition is merely an enabler or inhibitor; it does not do anything active. For example, if we conceptualize a car as being a mechanism that transfers causal forces from a cause (the burning of fuel) to the outcome (forward movement), we might theorize that the contextual conditions in which the car mechanism can be expected to operate include the presence of oxygen and relatively level ground. If we throw the car mechanism into a lake, even though the mechanism might be in perfect shape, it will not work, as it is outside of the contextual conditions in which it will run.' [The Tamil Nadu / Bangladesh worked example, pp.79-80:] 'The unpacked mechanism can be described as: Cause (mother participates in program) → (1) mother receives nutritional counseling → (2) exposure results in knowledge acquisition by mother → (3) knowledge used by mother to change child nutrition → Outcome (improved nutritional outcomes for children). Based on the program's success in Tamil Nadu, the World Bank tried it in Bangladesh. However, the mechanism did not function as expected in the different context and instead broke down. The reason was a key contextual difference. In Bangladesh, mothers were not the key decision-makers in households, with men doing the shopping and mothers-in-law in joint households (a sizable minority) acting as decision-makers about what food went onto the table. The mechanism therefore worked until part 3, but a contextual difference caused it to break down in the Bangladesh case.' [p.80 on the wrong remedy — context-free one-liners:] 'The solution to the problem of the contextual sensitivity of mechanism-based explanations is not just to define away details to a level of abstraction at which context no longer matters, turning our theories of mechanisms into context-free one-liners in the way Elster (1998), for example, uses the term mechanism. Elster (1998: 45) defines mechanisms as frequently occurring and easily recognizable causal patterns that are triggered under generally unknown conditions or with indeterminate consequences. Because he is not concerned about context and mechanistic heterogeneity, he is forced to use very abstract one-liners such as wishful thinking or the spillover effect to describe mechanisms, thereby providing explanations that tell us nothing about the actual causal process.' [Ch.4.4 p.113 — the five sources:] 'Five potential sources of mechanistic heterogeneity can lurk in what looks at the level of conditions/outcomes like a causally homogenous set of cases. ... The five potential sources of mechanistic heterogeneity are the product of (1) known/unknown omitted contextual conditions; (2) multiattribute concepts; (3) differences of degree in concepts; (4) the configurational nature of QCA results; and (5) the weakest-link logic in conjunctions produced in QCA.' [Ch.4.4 p.114 on the inferential error in least-likely-case logic:] 'If a mechanism is present when we did not theoretically expect it (a least likely case), this should result in revision of the theory about the contextual conditions under which the mechanism is present instead of enabling us to make a strong cross-case inference that the relationship should also work in more typical cases.' [The transferable claim distilled: causal-level homogeneity (same C, same O across cases) does NOT license mechanism-level homogeneity assumption; mechanism inference requires context-matching, not endpoint-matching; the remedy is bound-the-population-then-snowball-outward, not retreat-to-context-free-abstraction.]"
canonical-instances:
  - "the **Tamil Nadu / Bangladesh nutrition-program** worked example (Beach Ch.3.5, citing Howard White 2009): same C (World Bank program), same O (improved nutrition) was achieved in Tamil Nadu via mother-as-household-decision-maker. The Bangladesh export FAILED because in that context the household-decision-maker was the husband or mother-in-law, not the mother. The mechanism diverged at step 3 (knowledge used by mother to change food). The endpoint-matching logic ('it worked in Tamil Nadu so it should work in Bangladesh') was a mechanistic-heterogeneity error. The remedy was to bound the program's scope-condition (target the actual household-decision-maker) — not to retreat to a context-free one-liner ('parental engagement improves outcomes')."
  - "the **least-likely-case-as-strong-evidence** fallacy that this atom corrects (Beach Ch.4.4 Problem 1): the classic methodology heuristic says if mechanism M is found in a case where contextual conditions least support it, then we have strong cross-case evidence for M in more-typical cases. But this only follows IF context is irrelevant to mechanism — which is precisely the assumption mechanistic-heterogeneity rules out. The Beach correction: a least-likely-case finding should trigger THEORY REVISION about the contextual conditions, not stronger blanket inference. Operationally: when a process you didn't expect is found in an adverse-context case, ask 'what hidden enabling condition is present here that I had overlooked?' rather than 'the mechanism is robust to context.'"
  - "the **snowballing-outward** case-selection strategy (Beach Ch.4.5): rather than assume mechanism-homogeneity across the bounded population, deliberately select cases with PROGRESSIVELY MORE contextual differences from the studied typical case to test where the mechanism breaks down. Start with the case where all contextual conditions match (typical case); next take a case with 1 contextual difference; then 2; etc. The cases that break the mechanism reveal which contextual conditions are pivotal. The strategy converts the externalvalidity problem into a sequence of within-case studies bounded by the strongest scope-condition that survives empirical testing."
  - "the **bound-the-population** discipline as the transferable response: before generalizing a process-tracing finding from one case to a target case, explicitly enumerate the scope-conditions under which the mechanism was observed (analytical, temporal, spatial, institutional, per Falleti and Lynch 2009) and check whether the target case shares them. If the target case differs on a scope-condition, the inference does not transfer without further within-case confirmation. The practitioner-question is not 'does the mechanism generalize?' but 'across which scope-conditions does the mechanism's domain extend?'"
  - "operationally distinct from lex-rfxtb (multifactorial-frame's equifinality canonical-instance): EQUIFINALITY (von Bertalanffy's term in lex-rfxtb) says different cause-combinations can produce the SAME outcome — cause-side multiplicity, outcome-side fixed. MECHANISTIC HETEROGENEITY is the converse: same cause AND same outcome can be linked by DIFFERENT mechanisms — endpoint-side fixed, mechanism-side multiplicity. The two compose: a population might exhibit both (different cause-paths can reach the same outcome, AND within each cause-path the actual mechanism can still differ by context). Operational discriminator: equifinality is observed when you ask 'what else could have caused this outcome?'; mechanistic heterogeneity is observed when you ask 'fix the cause-outcome pair — could the process linking them differ?'"
  - "operationally distinct from lex-8j5ms (within-case-process-tracing as causal inference): lex-8j5ms names what within-case PT achieves (a mechanism-traced causal claim within ONE case). lex-gg87u names the SCOPE LIMIT on PT's external validity — the within-case mechanism cannot be blanket-extended to other endpoint-matching cases because of context-sensitivity. They compose as method + caveat: PT is strong within-case AND requires bounded-population discipline when generalizing."
  - "operationally distinct from lex-6bycb (four-test typology for within-case evidence): lex-6bycb names the within-case evidence-classification toolkit (hoop / smoking-gun / doubly-decisive / straw-in-the-wind tests for a particular case's mechanism). lex-gg87u names the cross-case caveat: even if your four-test inference within a case is airtight, blanket-extending the mechanism to context-different cases is unwarranted. The two compose: lex-6bycb gets you the within-case mechanism; lex-gg87u bounds the population to which it generalizes."
  - "operationally distinct from lex-eybad (emergent-effects-resist-decomposition into summed causes): lex-eybad is about non-additivity of causes at the effect level (the joint effect cannot be decomposed into linear contributions from each cause). lex-gg87u is about context-conditional mechanism activation (the same C-O pair can be linked by different processes depending on scope conditions). Different axes: lex-eybad is about how causes combine; lex-gg87u is about how contexts shape the path between cause and outcome."
  - "operationally distinct from lex-k6d7u (credence-as-graded-belief): lex-k6d7u names the right epistemic FORM (graded credence over claims); lex-gg87u specifies WHAT the credence is over when extending mechanism-claims (a CASE-SPECIFIC mechanism claim with explicit scope-conditions, not a context-free mechanism claim with implicit universality). They compose: cross-case mechanism inferences should be expressed as credence over scope-bounded claims, where the bound is part of the claim being credenced."
  - "operationally distinct from lex-znaau (premature-closure): lex-znaau is the GENERIC failure mode of closing before processing is done. lex-gg87u is one SPECIFIC SHAPE of premature-closure in causal inference — closing the cross-case mechanism inference at endpoint-matching rather than processing the contextual differences. The diagnosis is lex-znaau; one prescription for the causal-inference instance is lex-gg87u's bound-the-population-then-snowball-outward discipline."
  - "operationally distinct from lex-t9fs7 (confirmation-bias): confirmation bias is the general tendency to over-weight evidence supporting a held belief. lex-gg87u is structurally related — once a researcher infers a mechanism in Case A, confirmation bias makes it harder to notice the mechanism diverges in Case B because the Case B evidence is assimilated to the Case A mechanism-template. lex-gg87u names the methodological response (explicit scope-bounding + snowball-outward) that procedurally surfaces the divergence confirmation bias would otherwise suppress. Connects to lex-rsnn7 (objectivity-from-externalization): the procedural arrangement is the only reliable counter to perception-level assimilation."
  - "operationally adjacent to lex-b6kvs (randomization-controls-for-unknown-confounders): randomization is the EXPERIMENTAL design that handles unknown confounders by averaging them out across treatment and control groups. lex-gg87u is the OBSERVATIONAL analog — when you cannot randomize (most policy / historical / social-science process-tracing), you must explicitly bound the population by scope-conditions, since unknown scope-conditions function like unknown confounders for the mechanism's domain of operation. The two designs handle the same underlying problem (unknown context-shapers) through different procedures: randomization through statistical averaging, scope-bounding through case-selection discipline."
critical-questions:
  - "have you actually enumerated the scope-conditions, or are you generalizing the mechanism on the implicit assumption that 'context doesn't matter here'? Practitioner-discipline: before exporting a process-tracing finding to a target case, write down the analytical / temporal / spatial / institutional conditions under which the mechanism was observed, and check the target case against each. If the conditions don't transfer, the inference doesn't."
  - "are you retreating to a context-free one-liner ('it's about incentives' / 'spillover effects' / 'wishful thinking') to evade scope-bounding? Beach calls this the Elster move: trading the explanatory question ('how does it actually work?') for an abstract pattern-label that travels well precisely because it explains nothing. The discriminator: can a reader of your mechanism-claim predict what would BREAK the mechanism? If no specific contextual condition would falsify it, the mechanism has been abstracted to vacuity."
  - "the least-likely-case temptation check: when you find a mechanism operating in a context where you didn't expect it, what's the right inference — strong cross-case generalization, or theory-revision about the scope-conditions? Beach: theory-revision. Practitioner-question: 'what hidden enabling condition is present in this least-likely case that I had previously overlooked?' Treat the surprise as a lens on your scope-condition model, not as evidence for blanket extension."
  - "the bounded-population mapping check: have you explicitly mapped the population for which your mechanism-claim holds? Or have you implicitly assumed the population is universal? A specific test: can you write down concrete cases that are OUTSIDE the mechanism's domain — and explain why? If you cannot, your population is implicitly universal, and the mechanism is over-claimed."
  - "the snowball-outward feasibility check: in real research, you usually cannot conduct PT on every population member. Practitioner-discipline: select 3-5 cases with progressively more contextual differences from the typical case, then check whether the mechanism breaks. The cases that break it identify key scope-conditions. This converts the unanswerable 'does it generalize?' question into a tractable 'which scope-conditions extend?' question."
  - "is the mechanism-claim STATED with explicit scope-conditions in the published finding, or only implicit in the case-study text? Beach's argument is that mechanism-claims are not portable without their scope-conditions; failing to publish the bounds is failing to publish the claim. Practitioner-question for write-up: 'under conditions A, B, C, mechanism M links cause X to outcome Y; the mechanism is expected to fail or modify under conditions ~A, ~B, or ~C.' If your write-up cannot be cast in this form, the scope-conditions are not yet explicit."
