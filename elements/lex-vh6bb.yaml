id: lex-vh6bb
name: proximate-rival-funds-capability-meant-for-a-distant-real-threat
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a group needs to make a costly, disruptive sacrifice now (forgo a payout, redirect a budget, build unfamiliar capacity) to prepare for a real but distant, uncertain, and not-yet-emotionally-available danger, do not expect the distant danger alone to motivate the sacrifice — a threat that hasn't arrived and may not for years reads as abstract and can be argued away. Themistocles's founding of the Athenian navy is the canonical case. Athens customarily distributed the revenue from the Laurium silver mines directly to citizens. Themistocles alone proposed diverting it instead to build a hundred warships — but he built the case on a threat the assembly could feel, not the one he actually had in view: 'Themistocles thus was more easily able to persuade them, avoiding all mention of danger from Darius or the Persians, who were at a great distance, and their coming very uncertain, and at that time not much to be feared; but, by a seasonable employment of the emulation and anger felt by the Athenians against the Aeginetans, he induced them to preparation.' The stated, sufficient-on-its-own justification was a live, felt rivalry with a nearby maritime power; the real strategic payoff — a fleet capable of meeting Xerxes at Salamis a decade later — depended on a threat too remote and uncertain to have carried the vote by itself. 'So that with this money a hundred ships were built, with which they afterwards fought against Xerxes.' The mechanism generalizes wherever the true beneficiary of a present sacrifice is a threat too abstract to move people, but a nearer, felt grievance or rivalry can motivate the identical action: a city funds flood infrastructure by pointing to last year's minor flood, though the engineering is sized for a much larger, statistically distant event; an organization builds security practices ostensibly to compete with a known rival's product, when the capability that matters is resilience against a systemic risk no one can yet picture concretely. The atom's use is diagnostic in both directions: recognizing when a stated, proximate justification is doing motivational work a true, distant justification cannot yet do — and noticing, when you are the one being persuaded, that the capability being funded may quietly outlast and outgrow the reason you were given for it."
related: [lex-nahg9, lex-9pubz]
evokes: [silver-mines-of-laurium, aegina-rivalry, the-persian-threat-not-yet-felt, capability-built-for-one-reason-serves-another, athenian-navy-founding, felt-rivalry-as-motivational-proxy-for-abstract-danger]
lineage:
  - source: primary
    text: plutarch-c100-life-of-themistocles-laurium-silver-mines
    citation: "Plutarch, Life of Themistocles, in Plutarch's Lives (c. 100 CE; Greek; John Dryden's 1683 translation as revised by Arthur Hugh Clough, 1859). Public domain. The episode is dated to the years before Xerxes's invasion of 480 BCE, when the Laurium mines' revenue windfall prompted the proposal to build a fleet rather than distribute the proceeds."
    quote: "And, first of all, the Athenians being accustomed to divide amongst themselves the revenue proceeding from the silver mines at Laurium, he was the only man that dared propose to the people that this distribution should cease, and that with the money ships should be built to make war against the Aeginetans, who were the most flourishing people in all Greece, and by the number of their ships held the sovereignty of the sea; and Themistocles thus was more easily able to persuade them, avoiding all mention of danger from Darius or the Persians, who were at a great distance, and their coming very uncertain, and at that time not much to be feared; but, by a seasonable employment of the emulation and anger felt by the Athenians against the Aeginetans, he induced them to preparation. So that with this money a hundred ships were built, with which they afterwards fought against Xerxes."
canonical-instances:
  - "the silver-mines case itself: rivalry with Aegina was the stated, sufficient reason; the fleet's real strategic payoff came a decade later against Persia."
  - "a municipal instance: flood-defense infrastructure funded and justified by reference to a recent, vivid, moderate flood, though engineered to the scale of a much larger and statistically distant event the public would not otherwise pay to guard against."
  - "a corporate instance: a security or resilience program greenlit as competitive response to a visible rival's recent breach, when the capability being built is what will actually matter against an unpredictable, not-yet-imaginable systemic failure."
critical-questions:
  - "how does this differ from lex-nahg9 (upaya, skillful means)? upaya is a general pedagogical principle — tailor the framing of a TEACHING to what a listener is ready to hear, discarding the framing once it has done its work. This atom is narrower and is not about teaching at all: it is about mobilizing costly COLLECTIVE ACTION by substituting a felt, proximate justification for a real but not-yet-motivating distant one. The audience isn't being taught something for their own understanding; they're being moved to fund and build a capability whose true rationale they are not being given."
  - "how does this differ from lex-9pubz (concealment-of-intentions removes counterparty's window for counter-prediction and counter-action)? lex-9pubz concerns concealing intent from an ADVERSARY specifically to deny them the ability to counter-plan against you. This atom concerns withholding the full rationale from one's OWN constituency — the body whose cooperation and sacrifice you need — and the withholding's function is motivational (supplying an actionable reason where the true reason isn't yet actionable), not tactical surprise against an opponent."
  - "is this just lying to the public? Not necessarily, and the source case is instructive on why: the stated reason (rivalry with Aegina, 'the most flourishing people in all Greece,' who 'held the sovereignty of the sea') was true and, on its own terms, a sufficient justification for building a fleet — Plutarch does not describe it as fabricated. What was withheld was not a false reason but a FULLER one: the deeper, still-uncertain strategic rationale that the felt reason alone could not have supplied motivation for. The atom's diagnostic use is spotting when a true-but-partial justification is doing the motivational work that a true-but-abstract fuller justification cannot yet do — not flagging every partial disclosure as deception."
severity-tier: info
