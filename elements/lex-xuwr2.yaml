id: lex-xuwr2
name: inequality-is-just-only-if-the-worst-off-benefit
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a differential allocation (income, position, access, attention, capacity) across an arrangement is on the table, the test for whether the inequality is JUST is not whether it is efficient, not whether the better-off earned it, not whether the inequality is small — it is whether the WORST-OFF position in the resulting arrangement is better off than its counterpart under the alternative arrangement (typically, equality). Rawls's transferable contribution (*A Theory of Justice* §13, the DIFFERENCE PRINCIPLE): higher expectations for those better situated are just IF AND ONLY IF they work as part of a scheme which improves the expectations of the least advantaged members of society. The principle is what Rawls calls strongly egalitarian: unless an unequal distribution makes the worst-off-representative-person better off than they would be under equality, the equal distribution is to be preferred. This is structurally a MAXIMIN choice — among feasible arrangements, pick the one whose worst-position is best. Two operational moves the principle enforces: (a) FRAME THE COMPARISON AT THE WORST POSITION not at the average or the median; (b) DEMAND COUNTERFACTUAL JUSTIFICATION of the inequality (`under equality the worst-off would be at X; under this inequality they are at X+Δ; therefore the inequality is licensed`) — without a Δ > 0 the inequality fails the test. Transferable applications: (a) economic + redistributive policy (Rawls's home domain — tax + transfer arrangements justified iff they leave the worst-off better off than the alternative arrangement; the standard incentive-effects argument is licensed within the principle iff the incentives genuinely raise the worst-off floor); (b) corporate compensation + organizational design (high executive pay justified within the principle iff it is necessary to attract leadership that improves outcomes for the worst-positioned workers / users / stakeholders — not iff it is merely market-clearing); (c) admissions + access policies (differential admission probabilities justified iff the resulting arrangement improves the position of the worst-off applicant pool, not iff the procedure is procedurally fair in isolation); (d) AI compute + capability allocation (concentration of AI capability with a small set of labs justified within the principle iff the resulting arrangement raises the floor of capability access / benefit for the worst-positioned populations, not iff it is efficient or merit-tracking); (e) attention + recognition allocation in groups (differential attention to high-status members justified iff it raises the floor of recognition + dignity for the lowest-status members — not iff it tracks observed contribution); (f) institutional resource concentration (concentrating resources in a few high-performing units justified iff doing so improves outcomes for the worst-served constituents, not iff it improves the average or the median); (g) capacity allocation in software systems (preferential resource grants to high-traffic services justified iff worst-case latency for marginal users improves, not iff aggregate throughput improves). Distinct from lex-srj3h harm-principle (Mill): harm-principle asks `is this person being harmed?` and forbids interference where no harm; difference-principle asks `does this inequality benefit the worst-off?` and forbids inequality where the answer is no. Different operational questions about when a constraint kicks in. Distinct from utilitarian sum-maximization (cf lex-9wbd3 Mill utilitarianism): utilitarianism maximizes the SUM of expectations, accepting that the worst-off may be made worse so long as the sum rises; difference principle is strictly anti-utilitarian at the bottom — no aggregate gain licenses lowering the worst-off floor. The two principles can recommend opposite arrangements; the substrate generalization is to NAME which is being applied and to what frame. Distinct from lex-r3aug open-impartiality-admits-distant-voices-closed-removes-only-intra-group-bias (Sen): Sen's critique is about WHO is admitted to the deliberation that selects principles; difference-principle is one substantive principle that could emerge from such a deliberation. They compose: a difference-principle test bounded to a single nation (closed impartiality) misses cross-border worst-off positions; opening impartiality changes which `worst-off` count. Distinct from lex-tgqrf outcomes-cluster-heavily-in-vital-few-causes (Pareto 80/20): Pareto is descriptive about distribution shapes; difference-principle is normative about which distributions are licensed. They compose: a Pareto-distributed outcome that fails the difference test is descriptively predicted and normatively unjust under Rawls. Distinct from lex-hbanm social-influence-amplifies-inequality-and-unpredictability (Salganik): Salganik names a mechanism that generates inequality (cumulative-advantage in social influence); difference-principle names a normative test for whether the resulting inequality is just. They compose at the policy layer: knowing the mechanism does not by itself license or condemn the inequality — the difference test must be run on the arrangement. Distinct from lex-kxk99 reflective-equilibrium: lex-kxk99 is the methodological move by which difference-principle could be defended against considered judgments (and revised if it fails them); lex-xuwr2 is the substantive principle itself. Use when: (i) a differential allocation is being proposed or defended and the frame for evaluating it is unsettled (efficiency? merit? average benefit? maximin?); (ii) a sum-maximization argument is offered for an arrangement that lowers a worst-position; (iii) policy or institutional design decisions face a choice between equality + an unequal alternative that promises benefits; (iv) AI capability + compute allocation arguments are being weighed; (v) compensation, admissions, or attention allocation are challenged on fairness grounds. Counter-move: name the WORST-POSITION in the proposed arrangement; name the WORST-POSITION in the comparison arrangement (typically equality, or the next-most-equal arrangement); ask `is the worst-position-under-this-arrangement better than the worst-position-under-the-comparison?`; if not, the principle rejects the proposed arrangement; if yes, the principle licenses it. Failure modes: (a) WORST-POSITION SUBSTITUTION (comparing average-under-A vs average-under-B, or median, instead of worst-position; this collapses difference-principle into utilitarianism or a less-egalitarian principle); (b) CHAIN-CONNECTION ASSUMPTION (assuming improvements at high positions trickle to the worst — Rawls explicitly does NOT assume chain-connection in general; it must be argued for the specific arrangement); (c) JUDGMENT-POOL PAROCHIALISM (cf Sen lex-r3aug — running the difference test against a bounded worst-off that excludes affected outsiders); (d) FRAME SUBSTITUTION (using the principle to justify any inequality that incidentally has some bottom-end benefit, rather than the strict iff-test that the inequality is NECESSARY for the worst-off improvement)."
