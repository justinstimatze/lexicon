id: lex-ahgnm
name: introspective-accuracy-generalizes-as-a-trainable-skill
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "Apply this when a system's (a person's or a model's) accuracy at reporting its own internal state improves through training or practice in one domain, and the question is whether that improvement is a narrow, memorized lookup or a transferable capacity. Plunkett-Morris 2025 fine-tuned GPT-4o and GPT-4o-mini to make decisions according to randomly-generated, quantitative attribute-weight preferences (e.g., how heavily to weigh natural light versus quiet surroundings when choosing a condo) — preferences with no 'common sense' answer, ruling out the model inferring its weights from prior world-knowledge. The models could already report these instilled weights with moderate accuracy (r=.50-.54 against ground truth). The models were then fine-tuned specifically on the TASK OF ACCURATELY REPORTING attribute weights, using 50 decision-contexts for training and 50 held-out contexts for testing — this raised held-out reporting accuracy to r=.74-.75. The critical test came next: when the SAME introspection-training was applied and then the models were asked to report attribute weights for entirely NEW agents and decision types they had NEVER been fine-tuned to have preferences about (their native, off-the-shelf choice processes, not instilled ones), reporting accuracy on those untrained native preferences ALSO rose sharply (r=.40-.46 before training to r=.70-.71 after). The training never taught the model anything about these particular preferences — there was no correct answer demonstrated for them — yet accuracy on them improved anyway. This is the diagnostic signature of a GENERALIZED SKILL rather than a memorized lookup: improvement transfers to cases structurally similar to, but disjoint in content from, the training examples. Practitioner move: when evaluating whether a demonstrated capability (self-report accuracy, but also any other trained skill) is narrow or general, don't just measure performance on the trained distribution — test performance on a held-out class the training never touched. A skill that transfers to untrained content is functioning as a general procedure; a skill that only performs on trained content is a lookup table wearing a general-sounding name. Caveat the authors themselves note: this shows the training IMPROVES CORRELATION WITH GROUND TRUTH, not that the underlying process is literally 'introspection' in a strong sense — the mechanism producing the improved accuracy remains unresolved (the model could be forming and reading an internal self-model, or exploiting some other consistent signal); what's established is the behavioral transfer pattern, not the underlying computational story."
