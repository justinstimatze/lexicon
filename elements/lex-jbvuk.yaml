id: lex-jbvuk
name: impossibility-results-carry-practical-value-without-prediction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a field's usefulness is being judged by whether it can forecast which specific event will happen next, look instead at its list of impossibility results, since that alone can carry the field's entire practical value with zero forecasting involved. Popper's example is the second law of thermodynamics, which converts directly into a design constraint: 'you cannot build a machine which is 100 per cent efficient.' No engineer needs the second law to predict a specific future event; they need it to rule out a whole class of designs before wasting resources chasing them. Popper proposes the same shape of usefulness for the social sciences -- 'you cannot, without increasing productivity, raise the real income of the working population' and 'you cannot equalize real incomes and at the same time raise productivity' -- neither one forecasts a historical event, both rule out a category of policy that promises an outcome its own mechanism can't deliver. 'These examples may show the way in which the social sciences are practically important. They do not allow us to make historical prophecies, but they may give us an idea of what can, and what cannot, be done in the political field.' Diagnostic move: when a field is being dismissed as practically useless because it can't predict the next crisis, revolution, or crash, check instead for its inventory of impossibility results -- the moves that look attractive but that the field's own laws rule out. A field can carry serious practical weight purely by closing off bad options, without ever forecasting which good option will actually happen."
