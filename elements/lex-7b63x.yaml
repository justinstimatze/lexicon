id: lex-7b63x
name: retribution-works-only-through-an-instrument-matching-the-original-transgressions-tool
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'A karmic or poetic-justice system can be imagined to operate with mechanistic literalism, such that a punishment will only take effect through the specific type of instrument used in the original offense, with every mismatched instrument failing no matter how forcefully applied. In the Jataka''s tale of Kanhadipayana, three different execution stakes fail to pierce the ascetic''s body until the exact wood of his ancient transgression is used: "To the cemetery they took him, and lifted him up on a stake of acacia wood; but the stake would not pierce the ascetic''s body. Next they brought a nimb stake, but this too would not pierce him: then an iron spike, and no more would that pierce his body," resolved only when he says, "''If you wish to impale me, take a stake of ebony wood.''"'
related: []
evokes: [jataka, dasanipata, kanhadipayana-jataka, instrument-specific-karmic-resonance, poetic-justice-literalism]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanhadipayana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 444, Kanhadipayana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "To the cemetery they took him, and lifted him up on a stake of acacia wood; but the stake would not pierce the ascetic's body. Next they brought a nimb stake, but this too would not pierce him: then an iron spike, and no more would that pierce his body."
canonical-instances:
  - "A folk story insists a cursed thief can only ever be caught using the very type of lock he once picked, so a detective who tries every modern method fails until an old-fashioned pin-tumbler lock, matching the thief's original crime, finally traps him."
critical-questions:
  - "Is the mechanistic-literalism claim meant to be taken as a real causal law within the story's world, or is it a narrative device for dramatizing the abstract idea that consequences fit their causes?"
