name: false-alarms-spend-down-the-response-youll-need-for-the-real-one
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "Every false alarm you raise doesn't just fail to help -- it withdraws directly from a finite account of trust that determines whether anyone responds to your next one, and that account can hit zero exactly when the real threat finally arrives. In Eastman's telling, Unktomee, having talked his way into a herd of Elk and been made their chief, twice cries a false alarm out of carelessness -- 'Fly! fly! I am struck by an arrow!' when it was only a falling stick, then again when it was only a falling acorn. Each time, the herd's response measurably degrades: the first time they simply flee; the second time they're 'still more displeased' but still respond; by the third time, when they've actually scented a real hunter, they don't warn Unktomee at all -- 'the Elks stole away from Unktomee and left him sleeping,' and he alone is found and shot. The herd's abandonment isn't cruelty or an overreaction to two harmless mistakes -- it's the direct, proportionate result of a trust account that had already been spent down to nothing by the time the real danger showed up needing exactly the response that had already been withdrawn twice for nothing. Diagnostic move: before raising an alarm, escalation, or warning you're not fully certain about, remember that the cost isn't limited to this one instance being wrong -- it's a withdrawal from the same finite reserve of credibility your next, possibly genuine, alarm will need to draw on, and a reserve spent on false positives isn't available when the real one comes."
