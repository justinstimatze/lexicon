evokes: [moral-credentials, self-licensing, publication-bias-inflates-meta-analytic-estimates, cohens-d-0.31, moral-credit-mechanism, folk-effect-vs-honest-estimate]
lineage:
  - source: primary
    text: blanken-vandeven-zeelenberg-2015-meta-analytic-review-moral-licensing
    citation: "Irene Blanken, Niels van de Ven, and Marcel Zeelenberg, 'A Meta-Analytic Review of Moral Licensing,' Personality and Social Psychology Bulletin 41(4):540-558 (2015), DOI 10.1177/0146167215572134."
    quote: "'Moral licensing theory posits that people who initially behave in a moral way can later display behaviors that are immoral, unethical, or otherwise problematic (e.g., Merritt, Effron, & Monin, 2010). For example, someone who has just spent some time volunteering for the local community center might later find it more acceptable to \"forget\" to report some additional income when filling out the tax return. The idea of moral licensing theory is that the prior good deed provides a \"license\" that allows one to perform morally questionable behavior later on.' [...] 'produced a mean effect size of moral licensing of d = 0.31 (95% CI [0.23, 0.38]).' [...] [Table 2, moderator estimates:] 'Dependent variable: Actual behavior (d = 0.36) versus hypothetical behavior (d = 0.28)... Status: Published (d = 0.43) versus unpublished (d = 0.11)' [...] 'the results showed that studies in published articles tend to have larger effect sizes than studies from unpublished... The current meta-analysis gives researchers a good starting point to determine that power.'"
canonical-instances:
  - "The paper's own headline instance: donating to charity, volunteering, or recalling a past moral act, followed by a measured increase in willingness to express ambiguously prejudiced attitudes, cheat on a subsequent task, or act more selfishly — the finding the theory was built to explain, now attached to an honest effect-size (d=0.31), not the folk-inflated version."
  - "A corporate 'ethics/diversity training completed' credential being used internally (consciously or not) to wave off scrutiny of a subsequent decision — the licensing mechanism transposed to an organizational rather than individual actor, untested by this meta-analysis but structurally the same shape the theory describes."
  - "The published-vs-unpublished gap itself (d=0.43 vs d=0.11) as an instance of publication bias distorting a field's working estimate of an effect's true size — a meta-scientific case study sitting inside a substantive one."
critical-questions:
  - "Is d=0.31 (or the more conservative unpublished-only d=0.11) a large enough effect to matter for any specific real-world decision, or is the finding's main value diagnostic (the mechanism is real) rather than predictive (it reliably shapes any individual case)?"
  - "The meta-analysis found no significant moderators besides publication status — does that mean moral licensing is a fairly uniform, weak background tendency across contexts, or does it mean the field hasn't yet found the conditions under which it's actually strong (the paper's own stated motivation for calling for better-powered future studies)?"
  - "How much of the 'file drawer' gap (d=0.43 published vs d=0.11 unpublished) reflects true publication bias (null results not submitted or rejected) versus genuine heterogeneity between the specific published and unpublished study designs — the meta-analysis treats these as the same explanation, but the paper doesn't fully rule out the second possibility."
status: active
