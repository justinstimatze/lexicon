  - source: primary
    text: jataka-chalmers1895-mula-pariyaya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 245, Mula-pariyaya-jataka (the same structural mechanism recurs at No. 231, Upahana-jataka, and No. 243, Guttila-jataka, in this same chunk). Verified verbatim against a direct extraction of the held copy."
    quote: "Do not imagine that this question is in the Three Vedas. You imagine that you know all that I know, and so you act like the jujube tree. You don't know that I know a great deal which is unknown to you."
canonical-instances:
  - "A junior engineer who has completed every module of a company's internal training and starts pushing for equal say in architecture decisions is quietly humbled when a senior engineer walks through a production incident from fifteen years earlier that no training module ever covered, revealing a whole layer of judgment the formal curriculum never touched."
critical-questions:
  - "Is this actually a fair test of relative skill, or does it just prove that teachers accumulate experience outside any curriculum by definition — does demonstrating an off-syllabus reserve prove genuine superior mastery, or only that teaching happened to stop short of covering everything the teacher happens to know?"
  - "What happens once a pupil eventually does close the gap and matches even the reserve capability? A sufficiently deep teacher might keep producing new undisclosed reserves indefinitely, preserving the hierarchy no matter how much the pupil actually learns."
status: active
