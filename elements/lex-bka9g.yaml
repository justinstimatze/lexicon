lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 5 'Values and Choice,' Section 5.3 'Basic and Non-Basic Judgments,' p.99. Two footnote-reference numerals ('fn13' after 'otherwise,' 'fn14' after the parenthetical question) sit at sentence boundaries in the source and are skipped via the elisions below."
    quote: "“A value judgment can be called ‘basic’ to a person if the judgment is supposed to apply under all conceivable circumstances, and it is ‘non-basic’ otherwise. ... For example, a person may express the judgment, ‘A rise in national income measured both at base and final year prices indicates a better economic situation.’ We may ask him whether he will stick to this judgment under all factual circumstances and go on, enquiring, ‘Would you say the same if the circumstances were such and such (e.g., if the poor were much poorer)?’ ... If it turns out that he will revise the judgment under certain circumstances, then the judgment can be taken to be non-basic in his value system. If, on the other hand, there is no situation when a certain person will, say, regard killing a human being to be justifiable, then ‘I should not kill a human being’ is a basic value judgment in his system.”"
canonical-instances:
  - "Hypothetical: A colleague states 'we should always ship the fastest solution, full stop' as a team value. Asked whether they'd still say that if the fast solution silently corrupted a fraction of customer records, they say no, of course not. The value was never basic -- it was standing in for an assumed fact (fast solutions don't have hidden correctness costs), and that assumption is what the team should actually be arguing about."
  - "Hypothetical: A parent insists 'screen time is bad for kids, period.' Asked whether they'd still object to a specific program shown to measurably improve a struggling reader's literacy, they concede that one's fine. The general rule turns out to be non-basic, built on a belief about typical screen content rather than a value about screens as such -- the real dispute is over what the content usually looks like."
critical-questions:
  - "Doesn't inventing an extreme hypothetical to test a value risk trivializing it -- most people would revise almost any stated principle under a sufficiently bizarre scenario, so doesn't this method just prove everything is non-basic? Sen flags this asymmetry directly: the test can demonstrate that a judgment is non-basic, but it can never demonstrate that one is basic, since ruling out every conceivable circumstance is beyond anyone's reach. The test is genuinely useful for showing a judgment rests on a fact rather than settling that any given judgment is truly foundational -- treat surviving the test as provisional, not proof."
  - "If someone just refuses to answer the hypothetical, or says 'that could never happen so the question doesn't matter,' has the test failed? Sen addresses this directly -- the admissible circumstances don't need to be probable, only conceivable. A refusal to engage with an implausible-but-coherent hypothetical is itself informative: it suggests the judgment may be held as basic, or that the person hasn't examined what it actually rests on."
