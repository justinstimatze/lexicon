id: lex-27rxf
name: unsanctioned-ascent-strains-as-much-as-blocked-ascent
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't assume anomic strain from social mobility only runs one direction (wanting to rise, being blocked). Merton, extending his own theory via Elinor Barber's study of the 18th-century French bourgeoisie, identifies a second, symmetric discrepancy: 'anomie may result from two kinds of discrepancy between objective rates of social mobility and cultural definitions of the moral right (and obligation) to move up in a hierarchical social system' — not only the discrepancy where 'culturally valued ascent is objectively restricted,' but also 'the correlative discrepancy,' where ascent actually HAPPENS without the culture granting it moral legitimacy: 'the same demoralization will very likely also arise when there is de facto mobility without the accompanying moral approval.' A group that has genuinely risen in wealth or position, but whose ascent the surrounding culture refuses to ratify as legitimate, experiences the same normative strain as a group blocked from rising at all — resentment and instability flow from the gap between fact and sanction in either direction. Use this when analyzing status anxiety, class resentment, or backlash: check whether the strain in view comes from people who want to rise and can't, or from people who HAVE risen and are being denied the legitimacy that's supposed to come with it — the second case is easy to miss because the group in question is, by any objective measure, doing fine."
related: [lex-hzrue, lex-pn8qn]
scaffolds-from: [lex-hzrue]
evokes: [merton-1957, elinor-barber-1955, bourgeoisie-in-18th-century-france, de-facto-mobility-without-moral-approval, two-kinds-of-discrepancy, status-inconsistency]
lineage:
  - source: primary
    text: merton-1957-barber-de-facto-mobility
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. V 'Continuities in the Theory of Social Structure and Anomie,' p.191, quoting Elinor G. Barber, The Bourgeoisie in 18th Century France (Princeton: Princeton University Press, 1955), 56. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'It has been suggested that . . . too great a discrepancy between the expectation of mobility and actual fulfillment results in a state of anomie, that is, a partial social disintegration reflecting the weakening of moral norms. The same demoralization will very likely also arise when there is de facto mobility without the accompanying moral approval, and it was with discrepancies of both these kinds that the 18th century French bourgeoisie was faced to an increasing extent as the century progressed.'"
  - source: primary
    text: merton-1957-two-kinds-of-discrepancy
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.191-192, Merton's own generalization from Barber's case."
    quote: "'Quite apart from the particular historical case in point, this directs theoretical attention to the general conception that anomie may result from two kinds of discrepancy between objective rates of social mobility and cultural definitions of the moral right (and obligation) to move up in a hierarchical social system. Throughout, we have been considering only the one type of discrepancy in which culturally valued ascent is objectively restricted, and it may turn out that this is historically the more frequent type of instance. But the correlative discrepancy, as Dr. Barber observes, also introduces severe strains upon the system.'"
canonical-instances:
  - "A newly wealthy founder from an immigrant or working-class background finds that money alone doesn't buy the social standing that's supposed to accompany it — old-money gatekeeping withholds the 'moral approval' half of ascent while the 'objective fact' half has already occurred, producing exactly the resentment-and-instability pattern Merton describes."
  - "A first-generation professional whose parents worked manual jobs can face family or community suspicion that their ascent is a betrayal or an affectation rather than a legitimate achievement — de facto mobility (the job, the degree, the income) outpacing the surrounding culture's willingness to ratify it as deserved."
  - "operationally distinct from lex-pn8qn down-crossing-status-stigmatized-more-than-up-crossing: that atom is about DIRECTIONAL asymmetry in stigma when someone crosses a status boundary (voluntary down-crossing draws harsher stigma than up-crossing). This atom is about a different axis entirely — strain from the GAP between an ascent that has actually occurred and the moral sanction that is supposed to accompany it, which can attach to upward movement specifically, independent of any comparison to downward crossings."
critical-questions:
  - "How would you tell, from the outside, whether a group experiencing backlash against its rise is suffering from Merton's 'unsanctioned ascent' strain versus simply facing ordinary resistance from those it is displacing? The demoralization Merton describes is in the RISING group; resentment from an established group being displaced is a related but separate phenomenon that could easily be conflated with it."
  - "Barber's case resolved in revolution — the bourgeoisie eventually rejected the norms denying it approval rather than continuing to seek approval it wasn't granted. Is revolution/rejection the typical resolution to this kind of strain, or is prolonged demoralization without resolution the more common outcome, with revolution the rare case Merton happened to study?"
