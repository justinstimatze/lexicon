id: lex-n6t4u
name: inference-by-constraint-not-computation
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When a result must be inferred from constraints rather than computed forward, work in the space of constraints. Inference-by-constraint is more powerful than search when the constraints are tight; it finds answers computation would never reach."
related: [lex-jv983, lex-wtkuz, lex-u74ex, lex-axa6h, lex-k6d7u, lex-gfb9k, lex-e2tnt, lex-xhvgy, lex-j929z, lex-5mv6r, lex-d7h2y, lex-8vcfb, lex-2czcp, lex-mbx6p, lex-rwvkh]
evokes: [constraints-on-formation-and-exploitation, comparative-not-quantitative-strength, confirmation-not-proof, accessibility-bounded-search, functional-not-logical-view, bounded-rationality-stance, ecological-rationality-stance, dont-model-cognition-as-bayesian-optimum]
lineage:
  - source: primary
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard UP / Blackwell 1986; 2nd ed. 1995). Chapter 2 'Inference' §1 (p.65-67) introduces inferential comprehension as NON-DEMONSTRATIVE: confirmation-not-proof, fallible-not-deducible. Chapter 2 §3 'Strength of assumptions' (p.78-83) develops the functional-vs-logical contrast: the logical view treats assumption-strength as an absolute quantitative confirmation-value computed by Bayesian-like rules; the functional view treats strength as comparative-not-quantitative and explains successful inference by appealing to constraints on what assumptions get formed and exploited. S&W argue strongly for the functional view: unlike-assumptions comparisons fail in conscious intuition (p.79-80 caviar-vs-Chelsea-restaurants example, p.81 'cannot be quantitatively assessed'); Carnap's (1950) classificatory/comparative/quantitative typology grounds the move. The atom names the crucial methodological claim: human spontaneous non-demonstrative inference works by CONSTRAINTS on assumption-formation and assumption-exploitation, not by COMPUTATION of optimal confirmation values. Verified verbatim 2026-05-20 (Ch.2 §1 p.65-67 + §3 p.79-83 OCR'd page text; page numbers verified from per-page file headers using established filename = printed-page + 10 offset)."
    quote: "Inferential comprehension is non-demonstrative: even under the best of circumstances, we argued, communication may fail. The addressee can neither decode nor deduce the communicator's communicative intention. The best he can do is construct an assumption on the basis of the evidence provided by the communicator's ostensive behaviour. For such an assumption, there may be confirmation but no proof. [Ch.2 §1 p.65 — the foundational claim: inference yields confirmation, not proof. Spontaneous non-demonstrative inference is fallible by construction.] On the functional approach, the successes of human non-demonstrative inference must be explained by appealing not to logical processes of assumption confirmation, but to constraints on the formation and exploitation of assumptions. [Ch.2 §3 p.81 — the cardinal methodological move: explain successful inference by what assumptions get formed and exploited, NOT by how perfectly available assumptions get weighted.] It seems to us implausible that humans might have a system for computing and representing the strength of assumptions which is both wholly unconscious and radically more sophisticated than anything that is reflected in their conscious intuitions. We therefore reject the possibility that an individual might unconsciously assess confirmation values through the kind of numerical computations suggested by logicians, when he is incapable of doing so consciously. We conclude, more generally, that the strength of an assumption cannot be quantitatively assessed: in the terms of Carnap (1950), it is a comparative rather than a quantitative value. [Ch.2 §3 p.81 — the rejection of unconscious-Bayesian-optimization as a plausible model of human inference. Strength is comparative not quantitative; the engine is constraint-based not optimization-based.] Where no numerical scale exists, absolute judgements become gross, and comparison of unlike objects becomes much harder. For example, someone might be able to say that one champagne tastes better than another, or that one caviar tastes better than another, but be quite unable to say whether or not a certain champagne tastes better than a certain caviar. [Ch.2 §3 p.80 — the diagnostic for comparative-not-quantitative: unlike-objects comparisons fail. Maps directly to the (14) caviar-vs-Chelsea-restaurants example showing the failure-pattern in assumption-strength judgments.]"
  - source: practitioner
    text: sperber-wilson-mining-pass-1
    citation: "promoted from cross-attestation: bounded rationality (Simon 1955 'A Behavioral Model of Rational Choice' Quarterly Journal of Economics 69:99-118 — the foundational claim that human decision-making is constrained by computational and informational limits, and that 'satisficing' replaces Bayesian-optimal-utility-maximization as the operational description. S&W's functional-not-logical view is a Simon-aligned stance on inference specifically), ecological rationality (Gigerenzer & Selten 2001 Bounded Rationality: The Adaptive Toolbox MIT Press; Gigerenzer 2007 Gut Feelings — heuristics work by exploiting environment-structure, not by approximating logical optima. The 'constraints' that S&W invoke are the cousin of Gigerenzer's 'adaptive toolbox' constraints), behavioral economics and heuristics-and-biases (Tversky & Kahneman 1974 'Judgment under Uncertainty: Heuristics and Biases' Science 185:1124-1131 — the systematic deviations from Bayesian-optimal inference are not noise but evidence of how the constraint-engine actually works. Anchoring, availability, representativeness are constraint-mechanisms, not failures of computation), AI alignment and LLM behavior (LLMs are massive non-demonstrative inference engines that produce confirmation-not-proof: outputs are evidenced by training but not deduced from premises. The functional view applies — explaining LLM output should appeal to constraints on attention/context/sampling, not to Bayesian-optimal posterior computation. Helpful pairing with lex-jv983 fluency-trap: the LLM constraint-engine emits fluent surface even when the underlying confirmation is weak), computer science (Levin 1973 universal search; Halpern's bounded reasoners — formal frameworks for inference under resource constraints; the move from 'compute optimal' to 'achieve good-enough under bounded resources' is the same functional-vs-logical move S&W make). Cross-domain attestation across behavioral economics, cognitive psychology, AI alignment, and bounded computation theory"
canonical-instances:
  - "S&W's caviar-vs-Chelsea example from Ch.2 §3 p.79: assumption (14) 'Jane likes caviar' and assumption (15) 'There are more Indian restaurants than Chinese restaurants in Chelsea' are both held with similar strength, but asking 'is (14) more likely than (15)' yields no usable answer. The unlike-objects-comparison-fails diagnostic: if humans were running a Bayesian-optimal credence-computer underneath consciousness, the comparison would be tractable. The failure-pattern is evidence the engine works otherwise"
  - "Kahneman 2011 Thinking Fast and Slow §System 1 vs System 2: spontaneous System 1 produces conclusions without showing its work; reflective System 2 can compute explicit credences but is slow and effortful. S&W's spontaneous-non-demonstrative-inference is System 1 specifically; the functional view names how System 1 actually works — not by unconscious Bayesian computation but by constraint-driven shortcuts. The relevance-theory machinery (effect-side via lex-xhvgy, effort-side via lex-j929z, spotlight-choice via lex-u74ex) is the constraint-engine in concrete form"
  - "code review heuristic: a senior engineer reading a 1000-line diff doesn't compute Bayesian posteriors over every line; they apply constraints — what assumptions about the codebase get formed (architecture, conventions, naming), what assumptions get exploited (where to look for likely bugs, what tests should exist). The success of expert code-review is constraint-based, not computation-based. lex-n6t4u names the operational claim that this is how it actually works"
  - "LLM evaluation: a model that produces fluent confident output (lex-jv983) is not running a verifiable optimization over the hypothesis-space; it's a constraint-engine whose constraints include training data, attention patterns, sampling temperature, and prompt. Quality of output reflects quality of constraints, not optimality of computation. Paired with lex-jv983: fluency-trap is the failure-mode of treating LLM output as if it came from computation rather than constraint. lex-n6t4u names the constraint-engine reality"
  - "scientific inference vs spontaneous comprehension (Ch.2 §1 p.66-67): scientific theorizing has 'all the time in the world' and can approach optimal computation; ordinary comprehension is almost instantaneous and CANNOT. The accessibility-of-hypotheses constraint is what makes instantaneous comprehension possible — only the immediately-accessible subset of memory is searched. lex-n6t4u names this constraint-bound inference; in S&W's chapter the contrast with scientific reasoning is the vital diagnostic"
  - "operationally distinct from lex-k6d7u credence-as-graded-belief (the STATE representation): lex-k6d7u says belief is graded; lex-n6t4u says the INFERENCE PROCESS that produces those gradations works by constraint not by optimal computation. Compatible-but-distinct: gradations can be the output-shape (lex-k6d7u) while the engine is constraint-based (lex-n6t4u). Tension with lex-k6d7u's Bayesian lineage: S&W's functional view rejects unconscious-Bayesian-computation as a plausible engine; lex-k6d7u holds Bayesian as ONE canonical lineage; lex-n6t4u names the alternative-not-Bayesian functional view. Both atoms can coexist as describing different stances on the engine; the substrate carries both"
  - "operationally distinct from lex-axa6h order-of-magnitude-approximation (the STANCE of comparative rough-comparison): lex-axa6h is the approximation move (a particular technique humans deploy); lex-n6t4u is the META-CLAIM that comparative-not-quantitative is the engine-level reality, of which order-of-magnitude is one operationalization. lex-axa6h is a tool; lex-n6t4u is the engine-physics claim that justifies the tool"
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz distinguishes reflexive-noticing from leveraged-use of meta-cognitive content; lex-n6t4u names the engine-level claim about first-order inference (not meta-cognition). Adjacent — both name structural features of cognition — but lex-n6t4u is at the inference layer, lex-wtkuz is at the meta-layer"
  - "operationally distinct from lex-gfb9k via-negativa: via-negativa is a content move (improve by subtraction); lex-n6t4u is an engine-physics claim (inference works by constraint). Distinct objects entirely"
  - "central edge case — the avoidable risk of lex-k6d7u dilution: lex-k6d7u includes Bayesian-credence as a canonical lineage; lex-n6t4u's functional view EXPLICITLY rejects unconscious-Bayesian-computation as the engine. The atoms are compatible AT THE STATE LEVEL (gradations can exist regardless of engine) but tension-bearing AT THE ENGINE LEVEL. The resolution: lex-k6d7u is the state shape that any engine produces; lex-n6t4u is one engine-claim about which non-Bayesian process produces those states. Carnap's 1950 classificatory/comparative/quantitative typology is the shared theoretical scaffold both atoms invoke"
critical-questions:
  - "the non-Bayesian-vs-constrained-Bayesian discrimination: is the constraint-engine actually NON-Bayesian, or is it just a Bayesian computation under tighter constraints? S&W argue the former (p.81 'we therefore reject the possibility that an individual might unconsciously assess confirmation values through the kind of numerical computations'). Alternative views (Tenenbaum-style Bayesian cognitive science) argue the latter — humans ARE running approximate Bayesian computation with strong priors and structured hypothesis-space pruning. The atom holds under S&W's stance; flag for revision if a 'constrained-Bayesian-engine' alternative is added to the substrate"
  - "the falsifiable-prediction test: does the functional view make falsifiable predictions, or is it just methodological pluralism? S&W argue p.78-82 that the unlike-objects-comparison-fails pattern IS a falsifiable prediction of the functional view that the logical view cannot easily accommodate. Specifically: if humans were running an unconscious Bayesian computer, unlike-objects comparisons should be no harder than like-objects comparisons; they are demonstrably harder. The empirical prediction holds; this gives lex-n6t4u operational teeth beyond mere stance-naming"
  - "the scope-boundary check: does the functional view scale beyond comprehension to general inference? S&W limit themselves to spontaneous comprehension on p.67 ('we are only concerned with spontaneous non-demonstrative inference'); they explicitly disclaim scientific reasoning where painstaking reflective inference can approach the logical view. lex-n6t4u is bounded to spontaneous-not-reflective inference. Reflective scientific reasoning may legitimately be modeled differently. Practitioner-discipline: when invoking lex-n6t4u, verify the inference being analyzed is spontaneous rather than reflective"
  - "the LLM-as-test-case: do LLMs instantiate lex-n6t4u's constraint-engine claim, or are they a different engine entirely? LLM output is constraint-driven (training-data, attention-patterns, sampling-temperature, prompt — exactly the constraint-set lex-n6t4u names). The constraint-engine claim transfers cleanly to LLMs and is operationally useful for evaluating LLM-output (lex-jv983 fluency-trap is the paired failure-mode). Practitioner-question: which constraints are most-load-bearing on this output, and would a different constraint-set produce a different conclusion?"
status: active
