id: lex-ymckb
name: subordinated-group-as-magnifying-mirror-for-dominant-self
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When the dominant group uses the subordinated group as a mirror, the mirror magnifies the dominant self. The subordinated group's perceived qualities are projections; the magnification serves the dominant's self-concept, not the subordinated's reality."
related: [lex-u8u7y, lex-2rsad, lex-k2kdc, lex-xrbzz, lex-cgqta, lex-6qevt, lex-et8q2, lex-qeg52, lex-y2nej, lex-pd9p6, lex-uqmd7, lex-68gd3, lex-cxffc, lex-pn8qn, lex-r7zuy, lex-avfud]
scaffolds-from: [lex-uqmd7, lex-qeg52, lex-pd9p6]
evokes: [looking-glass-function, magnify-the-figure-of-man-at-twice-its-natural-size, subordination-has-a-productive-function-for-the-dominant, criticism-shrinks-the-mirror, asymmetric-rage-when-the-glass-stops-flattering]
lineage:
  - source: primary
    text: Woolf-1929-ARoomOfOnesOwn
    citation: "Virginia Woolf, *A Room of One's Own* (1929), Ch.2. The 'looking-glass' passage is Woolf's most-cited mechanism-claim: the subordinated group's structural function is to serve as a magnification-mirror for the dominant group's self-confidence. Without that mirror the dominant self deflates — which is why criticism by the subordinated provokes rage out of proportion to its propositional content. The mirror is the *productive function* of the asymmetry; the asymmetry must be maintained because the dominant self is constituted by the reflection."
    quote: "[Woolf 1929 Ch.2:] 'Women have served all these centuries as looking-glasses possessing the magic and delicious power of reflecting the figure of man at twice its natural size. Without that power probably the earth would still be swamp and jungle. The glories of all our wars would be unknown. […] Whatever may be their use in civilized societies, mirrors are essential to all violent and heroic action. That is why Napoleon and Mussolini both insist so emphatically upon the inferiority of women, for if they were not inferior, they would cease to enlarge.' [Practitioner-extraction: the atom names *function* not *belief*. The dominant's claim of the subordinate's inferiority is not primarily epistemic — it is *pivotal for self-magnification*. Hence asymmetric rage when the claim is questioned: the mirror would stop enlarging.]"
  - source: discovery-loop
    text: feminist-theory-mining-pass-.3-.2
    citation: "The Black Woman in Cooper's preface is W2-doubled, serving as magnification-substrate for white-women's-rights discourse AND Black-men's-rights discourse simultaneously. lex-u8u7y (social-identity in-group/out-group categorization), lex-k2kdc (constitutive-defense generating threat), lex-2rsad (identity-protective-belief-maintenance) are adjacent but none names the *productive-function-of-subordination-as-ego-substrate* claim. Distinct from scapegoat/projection patterns: those discharge bad-affect; the looking-glass *generates good-affect* for the dominant by stable reflection. Distinct from lex-cgqta naturalization: 0288 erases mechanism; 0293 names what the mechanism *produces for the dominant*."
    quote: "Transferable shape: colonized-as-civilizing-mirror-for-colonizer; immigrant-labor-as-hardworking-foil-for-native-worker; noble-savage anthropology; the magical-Negro literary trope; minor-character idealization that requires their structural-subordination as condition. The general primitive: subordination has a *productive function* for the dominant self, which is why criticism by the subordinated provokes asymmetric rage."
canonical-instances:
  - "Woolf 1929 Ch.2 looking-glass passage: women's centuries-long structural function is mirror-magnification of the male figure at twice its natural size. The cited examples (Napoleon, Mussolini) are not incidental — Woolf's claim is specifically that *violent and heroic action* depends on the magnification-substrate, hence dictators' insistence on women's inferiority."
  - "Cooper 1892: the Black Woman as magnification-substrate doubled — both white-women's-rights discourse and Black-men's-rights discourse use her position as silent ally-or-subordinate. She magnifies two dominant selves at once; her speaking would shrink both mirrors."
  - "Colonizer's civilizing self-image: the colonized population's ascribed 'backwardness' is the substrate of the colonizer's 'civilizing mission' self-conception. Criticism of the colonial project provokes asymmetric rage because the colonizer's identity is constituted by the magnifying reflection."
  - "Native-worker / immigrant-laborer dynamic: the immigrant's ascribed 'willingness to do dirty work' magnifies the native worker's self-conception as 'someone who works for proper conditions.' When the immigrant unionizes (= stops being the mirror), the asymmetric rage is the diagnostic."
  - "Magical-Negro literary trope (and adjacent 'wise-Black-mentor', 'noble-savage', 'mystical-minority' patterns): the minority character's structural function is to deliver the protagonist's growth-arc. Their structural-subordination *is the condition* of their literary-function — they cannot have their own plotline because that would shrink the magnification."
  - "Dictator's insistence on out-group inferiority: Woolf's specific claim, generalized — authoritarian leaders systematically over-insist on the inferiority of an out-group because their self-magnification depends on the mirror. The intensity of the insistence is diagnostic of how key the mirror is to their self-conception."
  - "operationally adjacent to lex-k2kdc constitutive-defense: 0245 is the *threat-generating-defense* loop (defending against X generates X); 0293 is the *function-of-subordination-as-ego-substrate* claim. They compose: the dominant defends the mirror BECAUSE the mirror is constituting, and the defense itself attests to how essential the magnification is."
  - "operationally adjacent to lex-2rsad identity-protective-belief-maintenance: 0143 is the cognitive-defense-of-identity-load-bearing-beliefs; 0293 names a specific *kind* of identity-load-bearing-belief — the belief in subordinate-group's inferiority that magnifies the dominant. 0293 + 0143 co-fire on prompts about why specific beliefs are defended with disproportionate intensity."
  - "operationally distinct from lex-cgqta naturalization-erases-the-mechanism-that-produced-the-effect: 0288 erases mechanism, making subordination look natural rather than constructed; this atom names what the mechanism *produces for the dominant* once naturalized — the magnification the mirror supplies. They compose: once naturalization hides how the mirror got built, nobody questions what it's magnifying."
critical-questions:
  - "is the asymmetric rage diagnostic, or is the substance of the criticism actually significant? The atom predicts that criticism *of the magnification-substrate* will be met with intensity disproportionate to its propositional content. Match: a criticism that should be intellectually-minor produces emotional-major response. Mismatch: the rage is proportionate (the criticism actually is high-stakes). The atom fires when the rage indicates that the mirror is foundational, not when there's good reason for proportionate response."
  - "is the function steady-state magnification or sacrificial discharge? The atom names a stable-state productive function (the mirror reflects continuously). Distinct from scapegoat/projection mechanisms which require periodic discharge of bad-affect onto an out-group. Discriminator: does the dominant need the subordinate to *exist* (mirror) or to *be punished* (scapegoat)? The looking-glass requires the subordinate's continued presence; the scapegoat requires their expulsion."
  - "who else is magnifying through the same mirror? The Cooper observation (the Black Woman magnifies for both white-women and Black-men) generalizes: multiply-subordinated positions tend to serve as magnification for *multiple* dominant groups simultaneously. The atom's full operational use requires tracing the magnification-vectors — who deflates if the subordinate stops mirroring?"
  - "is the dominant's self deflatable or has it acquired non-mirror substrate? The atom predicts strongest deployment when the dominant has *no other source* of self-magnification (the entire identity rides on the mirror). When the dominant has acquired other substrate (real-achievement, non-comparative-grounding), the mirror's removal is tolerable. Match: dominant's identity is shaped by comparative-stratification."
  - "is the dominant's claim of subordinate-inferiority epistemic or constitutive? The atom names constitutive (the claim is decisive for self-magnification, not primarily knowledge-tracking). Discriminator: would correcting the empirical record change the dominant's stance, or would the dominant find another reason to maintain the inferiority claim? If the latter, lex-ymckb is operative — the claim is doing self-magnification work, not knowledge-tracking work."
