id: lex-hnh4j
name: two-problems-with-the-same-symptom-can-need-opposite-diagnoses
type-in: process
type-out: frame
_tier: atomic
agent-instruction: "When diagnosing why a team, system, or organization is underperforming, don't treat a category of visible symptom as a single problem with a single fix -- the same surface presentation often has two versions, one caused by a transient, reversible gap and one caused by a structural, irreversible loss, and applying the fixable version's remedy to the structural version wastes the intervention entirely. Kautilya's method for the army examines its calamities in matched pairs specifically to expose this distinction: 'An unhonoured army will fight if honoured with money; not so a dishonoured army which holds resentment in its heart. An unpaid army will fight if paid immediately, but not so a sick army, which is unfit to fight. An exhausted army will fight after refreshing itself by bathing, eating and sleeping but not so a depleted army, having been reduced in fighting men and draught animals... An angry army [whose officers are provoked for some reason] will fight if their resentment is overcome by conciliation and similar means; not so a disunited army whose members are estranged from each other.' Every pair shares an outward symptom -- low willingness to fight -- but the underlying cause differs by kind: a resource or incentive gap (unpaid, tired, provoked) responds to supplying the missing resource, while a structural loss (resentment accumulated over time, physical incapacity, reduced headcount, relationships broken by estrangement) does not respond to the same remedy because nothing was actually missing that a single transaction can restore. Applying the transient-gap fix to the structural-loss version doesn't fail neutrally -- it consumes the resource (money, rest, an apology) while leaving the actual cause untouched, and can read as evidence the fix doesn't work when the real problem is that the wrong fix was diagnosed. Diagnostic move: before applying a standard remedy to an underperforming team, system, or relationship, check which of the two versions you're facing -- ask whether the deficit is something a single supply of the missing resource restores, or whether it's a structural change (lost trust, reduced capacity, accumulated resentment) that the same-shaped fix cannot touch, and treat determining which one you have as the actual first step, not an afterthought to applying the obvious remedy."
