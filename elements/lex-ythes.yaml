id: lex-ythes
name: aggregating-multiple-independent-judgments-beats-single-judgment-when-errors-are-uncorrelated
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When you face a judgment task with measurable uncertainty — estimating a quantity, picking among alternatives, forecasting an outcome — solicit MULTIPLE INDEPENDENT JUDGMENTS and AGGREGATE them rather than committing to your own. The proverb-tradition's transferable claim is the four-culture-attested 'two heads are better than one,' 'many hands make light work,' and the Yoruba teaching on consultation. The structural condition for the aggregation to outperform any single estimate is that ERRORS BE UNCORRELATED across estimators. When errors are uncorrelated, simple averaging cancels them out (the variance of the mean is the variance-of-one divided by N). When errors are CORRELATED — everyone shares the same blind spot, or the second estimator was influenced by the first — the aggregation does not improve accuracy. Practitioner discipline: BEFORE aggregating, ask each judge independently (no anchoring, no information cascade), THEN aggregate (median, mean, or principled weighting by track record). The Galton 1907 ox-weight demonstration (787 fairgoers' independent guesses produced a mean within 1% of the true weight) is the canonical instance; Tetlock-Mellers superforecasting work is the modern instrumented form. Be careful with the inverse failure mode: aggregating CORRELATED judgments (a panel where all members read the same priming briefing; a meeting where one senior speaker anchors the room; an LLM ensemble all trained on overlapping data) gives a false sense of accuracy because the correlations defeat the variance-reduction. The atom names the structural condition, not the practice of asking-around-for-the-sake-of-it. Diagnostic before aggregating: 'do these N judges have independent information sources, independent reasoning chains, independent error patterns? If yes, aggregation helps. If no, aggregation just confirms the shared bias.'"
