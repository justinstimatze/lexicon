id: lex-smf9s
name: escalating-hedge-is-vindicated-regardless-of-which-outcome-occurs
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Rather than commit to a definite forecast at the point where the evidence would actually support one, a forecaster can instead escalate the SEVERITY OF LANGUAGE gradually over successive updates — never quite naming the feared outcome until it is essentially certain — so that the language track is retroactively validated no matter which way things go: if the bad outcome occurs, the prior cautious language reads as prescient ('dying' will have been seen as having gone on beforehand); if the bad outcome does not occur, no prior statement was ever wrong enough to be checked against, and the forecaster's caution reads as prudence rather than error. Sudnow's Passing On names the exact verbal ladder physicians climb at County Hospital: 'The progressive solemnization of prognostic accounts as the patient's condition deteriorates goes as follows: on early days of admission of the patient who is considered as a possible eventual death, he is talked of as \"in serious condition\"; as his death becomes considered more immediately imminent, references to its being \"a matter of time\" are made. References to \"dying\" are cautiously made — and only when the final moments are considered at hand. The use of such phrases as \"only time will tell,\" \"we've done all we can,\" \"it's just a matter of waiting to let nature take its course,\" \"there's no telling now,\" etc., provide that should the patient die, \"dying\" will have been seen as having gone on beforehand.' Sudnow makes the asymmetric payoff explicit: 'At the same time, should the patient live through the admission, the doctor's competence is not thrown into question, but perhaps enhanced. It is always to the physician's advantage to portray the situation as slightly more serious than he feels it is, so long as its seriousness is not taken or proposed as a warrant for treating \"palliatively.\"' The hedge-ladder is not indecision; it is a structured strategy for capturing credibility under both branches of the outcome tree. Generalize beyond medicine: a project manager who escalates status language from 'on track' to 'watching closely' to 'at risk' over successive weeks without ever naming a firm date for failure, so that a late delivery reads as having been flagged in time and an on-time delivery reads as the team having pulled it off despite real risk; an analyst who gradually darkens the tone of quarterly outlook language ahead of a possible downturn without ever issuing a falsifiable call, positioned to claim foresight either way. The diagnostic move: ask whether the forecaster ever made a single, dated, falsifiable claim at any point in the sequence — if every statement in the escalation is compatible with both eventual outcomes, the sequence was never forecasting; it was credibility-insurance dressed as forecasting."
