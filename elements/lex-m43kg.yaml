id: lex-m43kg
name: ability-barriers-are-cheaper-to-remove-than-motivation-is-to-boost
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when you're designing to increase the likelihood of a target behavior and have BOTH motivation and ability available as levers -- and especially when the default instinct is to reach for motivation first (persuade harder, explain more, offer a bigger incentive). BJ Fogg's Behavior Model (Stanford Persuasive Technology Lab) holds that a behavior occurs only when motivation, ability, and a trigger are simultaneously present in sufficient degree (B = MAT); if any one is missing or inadequate, the behavior does not occur, no matter how strong the other two are. Given that constraint, Eyal's operational extraction of Fogg's model answers a question the formula itself leaves open -- which lever should a designer invest in FIRST -- with a specific, non-obvious answer: always start with ability, not motivation. The reasoning is economic, not moral: increasing motivation is expensive, slow, and unreliable (users ignore instructional text, attention is split across competing demands, and motivation is 'a widely contested topic' with no simple lever to pull), while identifying and removing a specific obstacle to ease is comparatively cheap, fast, and reliable. Fogg's six 'elements of simplicity' -- time, money, physical effort, brain cycles, social deviance, and non-routine -- are not six things to simplify indiscriminately; they are six candidate diagnoses for a single question: 'what is the user's SCARCEST resource at this moment, the one specific thing missing that would let them proceed?' A user who is short on time is not helped by reducing physical effort; a user in a socially awkward context is not helped by saving them money. The diagnostic discipline is to find the ONE scarcest-resource bottleneck for THIS user in THIS context, not to broadly polish every dimension of ease. Generalize beyond product design: whenever you're tempted to increase persuasion, incentive, or willpower-demand to get a behavior to happen, first ask whether the actual blocker is capability/friction rather than desire -- and if it is, fixing the friction is very likely the cheaper, more reliable move, with persuasion-effort reserved for cases where a genuine capability audit turns up nothing left to simplify."
related: [lex-89rjr, lex-kkr43, lex-96qnn, lex-67hpe, lex-v7dty]
evokes: [b-equals-mat, fogg-behavior-model, action-line, six-elements-of-simplicity, scarcest-resource]
lineage:
  - source: primary
    text: eyal-2014-hooked-how-to-build-habit-forming-products
    citation: "Nir Eyal with Ryan Hoover, Hooked: How to Build Habit-Forming Products (Portfolio/Penguin, 2014), Chapter 3 'Action.'"
    quote: "Fogg posits that there are three ingredients required to initiate any and all behaviors: (1) the user must have sufficient motivation; (2) the user must have the ability to complete the desired action; and (3) a trigger must be present to activate the behavior. The Fogg Behavior Model is represented in a formula, B = MAT, which represents that a given behavior will occur when motivation, ability, and a trigger are present at the same time and in sufficient degrees... If any component of this formula is missing or inadequate, the user will not cross the 'Action Line' and the behavior will not occur... Fogg describes six 'elements of simplicity' -- the factors that influence a task's difficulty. These are: Time... Money... Physical Effort... Brain Cycles... Social Deviance... Non-Routine... To increase the likelihood of a behavior occurring, Fogg instructs designers to focus on simplicity as a function of the user's scarcest resource at that moment. In other words, identify what the user is missing... These factors will differ by person and context, so designers should ask, 'What is the thing that is missing that would allow my users to proceed to the next step?' ... Motivation or Ability -- Which Should You Increase First? ... The answer is always to start with ability. Of course, all three parts of B=MAT must be present for a singular user action to occur; without a clear trigger and sufficient motivation, there will be no behavior. But for companies building technology solutions, the greatest return on investment will generally come from increasing a product's ease-of-use. The fact is, increasing motivation is expensive and time-consuming. Website visitors tend to ignore instructional text. Their attention is split on several tasks at once and they have little patience for explanations about why or how they should do something. Instead, influencing behavior by reducing the effort required to perform an action is more effective than increasing someone's desire to do it. (Eyal, Hooked, Ch.3 'Action.')"
canonical-instances:
  - "operationally distinct from lex-96qnn ladder-past-the-first-why-before-accepting-a-training-fix: both distinguish capability from motivation as failure categories, but lex-96qnn's claim is diagnostic-laddering methodology (Moore's four-category ladder) for finding root causes; this atom's claim is a prescriptive lever-ordering rule (try ability first) plus a specific diagnostic (six elements of simplicity, scarcest-resource question)."
  - "Onboarding-flow design: a SaaS product with low trial-to-paid conversion runs A/B tests increasing motivational copy (bigger benefit statements, urgency messaging) with minimal lift, then removes two required form fields from signup and sees conversion jump -- the actual blocker was ability (form friction), not motivation (desire for the product), and no amount of persuasive copy could have fixed a friction problem."
  - "Public-health behavior change: a campaign to increase vaccination rates in a community initially invests in motivational messaging (fear appeals, social-proof statistics) with modest effect, then discovers the scarcest resource for the target population is actually time and transportation access -- adding mobile vaccination units and same-day walk-in slots (an ability fix) produces a larger uptake increase than any messaging campaign, because the audience was already motivated but structurally unable to act."
  - "Internal tooling adoption inside a company: leadership sends repeated reminder emails urging engineers to use a new code-review checklist (a motivation intervention) with poor compliance, then discovers the checklist lives in a wiki page three clicks from the PR interface -- embedding the checklist directly in the PR template (an ability fix, reducing brain-cycles and non-routine-ness) achieves near-universal compliance without a single additional reminder."
critical-questions:
  - "Doesn't Fogg's own formula (B=MAT) say all three components are equally necessary, so why privilege ability over motivation at all? The formula's NECESSITY claim (all three must be present) and the atom's PRIORITIZATION claim (given both are absent or partial, invest in ability first) are compatible, not competing -- the formula describes what must be TRUE for behavior to occur; the atom answers a separate question about where a designer with limited time/budget gets the best return when improving TWO levers simultaneously. If ability is already maximal (nothing left to simplify) and only motivation is deficient, the atom does not claim motivation-investment is wasted -- it claims start-with-ability, not only-ever-use-ability."
  - "Is 'ability is cheaper to move' actually true, or does it just feel that way because friction is more visible/measurable than motivation? This is a fair challenge to the claim's generality -- the atom's grounding is Eyal's practitioner-level generalization from Fogg's applied work, not a controlled comparative study of manipulation-cost across domains. The claim holds clearly in interface/product design (where friction reduction is often a specific, isolatable, low-risk change like removing a form field, while motivation campaigns require sustained messaging investment with uncertain payoff) but should be treated as a domain-calibrated heuristic, not a universal law -- in domains where ability is already near-maximal (a genuinely one-click action) and the real blocker is desire, motivation-investment is the correct first move, and the atom's diagnostic step (identify the SCARCEST resource) is what prevents misapplying the prioritization rule."
  - "How do you avoid over-simplifying every element and wasting effort on dimensions that were never the bottleneck? Fogg's own discipline is the answer: don't simplify all six elements of simplicity indiscriminately -- diagnose which ONE is scarce for the specific user in the specific context (ask 'what is missing that would let them proceed?') and target that one. A user who is time-rich but money-poor is not helped by further reducing time-cost; a broad simplification effort that ignores this targeting wastes design effort on dimensions that were never the actual constraint."
