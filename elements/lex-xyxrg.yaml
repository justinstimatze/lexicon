id: lex-xyxrg
name: a-technically-true-deflection-conceals-a-sacred-experience-without-lying
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When asked directly what happened during a private sacred experience, a person can give a deliberately mundane, technically accurate but misleading explanation, avoiding disclosure without denying anything or stating a falsehood. Alone on a bluff, Black Elk sings to the two spirit-men from his vision, and companions who overhear ask what he saw. He doesn't lie -- he narrows the truth until it reads as ordinary: 'I told them I was only singing to some people I knew in the outer world.' Every word is defensible. The spirits genuinely are people he knows, from the outer world of his vision. The sentence works precisely because it lets the listener supply the mundane reading it invites, without Black Elk ever having to construct or maintain an actual falsehood."
related: []
evokes: [black-elk-speaks, dog-vision, singing-to-some-people-i-knew, in-the-outer-world, technically-true-cover-story]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch15-dog-vision
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 15, 'The Dog Vision.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "When I went back to our little camp by the plum thicket, the others there, who knew of my power and had heard me on the bluff, asked what I had seen up there. I told them I was only singing to some people I knew in the outer world."
canonical-instances:
  - "Asked by a coworker why they were crying in the stairwell, someone says they're 'just tired,' which happens to be true in a limited sense while completely omitting the actual cause."
  - "A scientist asked point-blank whether a controversial result has been replicated says 'we're still analyzing the data,' a statement that's accurate but lets the questioner assume progress is farther along than it actually is."
  - "A parent asked by a child where a beloved pet has gone says it 'went to live somewhere better,' true in the sense the parent means it, but understood by the child as something entirely different."
critical-questions:
  - "Does this kind of deflection actually protect the sacred experience from the mistelling and ridicule Black Elk fears elsewhere, or does it just delay the same risk to whatever moment he eventually does have to disclose the full truth?"
  - "Do the friends who heard him singing actually believe the mundane explanation, or do they accept it as a polite fiction because they already sense there's more to it and are choosing not to press?"
  - "Is there a meaningful ethical difference between this kind of technically-true deflection and an outright lie, given that both are equally designed to produce a false impression in the listener's mind?"
status: active
