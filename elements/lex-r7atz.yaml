id: lex-r7atz
name: a-fixed-step-sequence-cannot-be-the-right-method-for-building-a-theory
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When a methodology promises that following its prescribed steps, in its prescribed order, will produce a good design, check what kind of output the method is actually claiming to produce. Peter Naur's argument: a programming method is a set of work rules -- what to do, in what order, which notations to use, what documents to produce at each stage. That structure presupposes the primary output can be built up through a sequence of discrete actions. But on the Theory Building View, the primary output of programming is a theory held by a person, and a theory has no inherent division into parts and no inherent ordering -- someone possessing a theory can produce explanations, justifications, or designs in response to a question in whatever order the question demands, not in a sequence fixed in advance. Naur concludes that for programming's primary activity there can be no right method, and he backs this with C. Floyd's empirical study of five different methods, which concluded that methods-as-mechanical-rule-systems guaranteeing good solutions in an arbitrary context is an illusion -- what actually remained useful was methods' effect on educating programmers. Diagnostic move: when a method is pitched as the thing that generates good designs, ask whether it's actually functioning as an educational tool that builds a programmer's model-solution vocabulary -- which Naur grants real value -- rather than as a procedure that could substitute for the programmer's own theory-building."
related: [lex-58ynk, lex-b2c6b]
evokes: [peter-naur, programming-as-theory-building, ryle-knowing-how, floyd-1984-methods-study, no-silver-bullet]
lineage:
  - source: primary
    text: naur-1985-theory-has-no-inherent-ordering
    citation: "Peter Naur, 'Programming as Theory Building' (Microprocessing and Microprogramming 15, 1985, pp.253-261), as reprinted in Alistair Cockburn, Agile Software Development (Addison-Wesley, 2002), Appendix B 'Naur, Ehn, Musashi,' section 'Method and Theory Building,' pp.235-236. A running header ('236 * NAUR, EHN, MUSASHI') interposes mid-sentence at the page break in the source; the ellipsis below marks that skip."
    quote: "“A method implies a claim that program development can and should ... proceed as a sequence of actions of certain kinds, each action leading to a particular kind of documented result. In building the theory there can be no particular sequence of actions, for the reason that a theory held by a person has no inherent division into parts and no inherent ordering.”"
  - source: primary
    text: naur-1985-no-right-method-conclusion
    citation: "Peter Naur, 'Programming as Theory Building' (Microprocessing and Microprogramming 15, 1985, pp.253-261), as reprinted in Alistair Cockburn, Agile Software Development (Addison-Wesley, 2002), Appendix B 'Naur, Ehn, Musashi,' section 'Method and Theory Building,' p.235."
    quote: "“It follows that on the Theory Building View, for the primary activity of the programming there can be no right method.”"
canonical-instances:
  - "The direct textual anchor, on what Floyd's study of five methods actually found once the production-procedure claim is stripped away, per Naur's own paraphrase (C. Floyd, 'Eine Untersuchung von Software-Entwicklungs-Methoden,' 1984, cited in the same section, p.237): a study of five different development methods concluded that treating methods as rule-systems that mechanically produce good solutions in any context is an illusion, and that what actually held up was their value in educating programmers."
  - "Hypothetical: a consultancy adopts a rigid design-document template requiring every project to fill in sections in a fixed order -- requirements, then data model, then interface, then algorithm -- before any code is written. Two teams follow the template equally faithfully. One produces a well-structured system; the template happened to match how its senior engineer already thought about the problem. The other produces a system riddled with late-discovered structural mismatches, because the actual hard design question for that project was the interface, and the template forced the team to freeze data-model decisions before anyone had thought hard enough about the interface to know what the data model needed to support."
critical-questions:
  - "Naur grants that a theory-holder 'will be able to produce presentations of various sorts... in response to questions or demands' -- but producing a presentation on demand is different from originally constructing the theory in the first place. Is it actually established that the original construction process has no productive ordering, or only that the FINISHED theory can be queried in any order once built? A method could still help during construction even if it's useless for describing the finished result's structure."
  - "If methods have no power to guarantee outcomes but real power to educate programmers in model solutions and techniques, per Naur's own account of Floyd's study, how would a working programmer distinguish a method genuinely worth adopting for its educational value from one dressed up as a production procedure that happens to teach nothing new?"
status: active
