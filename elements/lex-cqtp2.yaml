id: lex-cqtp2
name: reframing-a-wrong-as-predetermined-forestalls-retaliatory-grief
type-in: process
type-out: posture
_tier: atomic
agent-instruction: 'Someone counseling a person who has just suffered a grave, unjust wrong can preempt a retaliatory or despair-driven response by reframing the wrong as the working-out of a cause already set in motion before the current actors ever entered the picture — not to excuse the wrongdoer, but to remove the victim''s sense that answering in kind is either necessary or even coherent. The reframe explicitly names the risk it''s guarding against: that the victim''s own retaliatory response would itself become a second wrong layered on the first. In the Bhadda-sala-Jataka, Bandhula''s widow tells her thirty-two bereaved daughters-in-law that their husbands, though innocent, ''have reaped the fruit of their former deeds,'' and warns them not to grieve in a way that would itself be ''a sin of the soul worse even than the king''s'' — heading off exactly the vengeful response the king''s spies were watching for.'
related: []
evokes: [jataka, dvadasanipata, bhadda-sala-jataka, prior-cause-doctrine-defuses-revenge-cycle, reframe-to-prevent-retaliation]
lineage:
  - source: primary
    text: jataka-chalmers1895-bhadda-sala-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 465, Bhadda-sala-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Your husbands, though innocent, have reaped the fruit of their former deeds. Do not you grieve, nor commit a sin of the soul worse even than the king''s.'
canonical-instances:
  - 'A hospital''s peer-support counselor tells a nurse who was fired after a preventable error that the systemic understaffing that set the error up had been building for years before she ever took the shift, specifically to keep her from either internalizing it as sole personal failure or escalating into a public campaign against the one manager who happened to sign the termination.'
critical-questions:
  - 'Does naming a wrong as predetermined actually prevent retaliation, or does it only suppress its expression while leaving the underlying grievance — which the king''s own spies confirm the widow and her daughters-in-law still privately hold — completely intact?'
status: active
