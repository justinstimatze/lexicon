lineage:
  - source: primary
    text: hyde-picassos-perfect-circle-exercise-your-distortion-is-your-style
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"The Lucky Find,\"' on Picasso's teaching practice. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "One of Picasso’s favorite assignments for a young artist was to have him or her try to draw a perfect circle. It can’t be done; everyone draws a circle with some particular distortion, and that distorted circle is your circle, an insight into your style. “Try to make the circle as best you can. And since nobody before you has made a perfect circle, you can be sure that your circle will be completely your own. Only then will you have a chance to be original.” The deviations from the ideal give an insight into the style, and thus, Picasso says, “from errors one gets to know the personality.”"
canonical-instances:
  - "A voice coach stops correcting a promising singer's slight, consistent pitch drift on certain notes once she realizes the drift is exactly what makes the singer's covers of standard songs instantly recognizable, while a technically perfect rendition would sound like anyone's perfect rendition."
  - "A writing instructor tells students to stop trying to write the flawless, textbook-clean sentence and instead notice the specific, recurring way their own sentences go slightly wrong, since a grammatically perfect sentence reads the same no matter who wrote it, while a particular habitual imperfection is a genuine authorial signature."
critical-questions:
  - "Does this claim actually hold for every domain with a shared ideal, or specifically for domains where the ideal is a simple, fully specified target (a perfect circle) rather than a richer standard that might itself admit many equally valid, non-identical realizations?"
  - "Is there a risk of romanticizing genuine incompetence by reframing any deviation from a standard as 'style,' when some deviations really are just errors that would improve with practice rather than signatures worth preserving?"
  - "Does deliberately cultivating and preserving your characteristic deviations, rather than continuing to strive toward the ideal, risk freezing a style prematurely, when further practice might have revealed an even more distinctive pattern of deviation than the current one?"
