id: lex-fv4a3
name: sociogeny-pathology-of-the-dominated-is-normal-response-to-pathological-structure
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a member of a dominated population presents psychic disturbance (anxiety, depression, dissociation, rage, intrusive self-doubt, hyper-vigilance, body-schema disruption, identity-fracture), do not reach first for ontogenic-individual etiology (childhood, brain chemistry, individual trauma in isolation). Reach for SOCIOGENIC etiology: the disturbance is the normal-response of a healthy psyche to pathological-structural conditions (colonization, racialization, gendered subordination, class-stratification, persistent epistemic injustice). The individual-deficit framing systematically misdiagnoses by relocating pathology from the structure to the subject. Diagnostic intervention: model the social-structural cause AND the subject's response together; treat the response as evidence of the structure, not as the locus of the disorder."
related: [lex-2rsad, lex-6qevt, lex-2sdqf, lex-fjzum, lex-ct5ux, lex-a3tfj, lex-22kep, lex-y48fs, lex-3ezh8, lex-k8bsd, lex-44byg, lex-qg68a, lex-am8cj, lex-y2tbg, lex-55dm8, lex-5qkj9, lex-t7xcp, lex-5ftak, lex-qy2ej, lex-yx8qx]
