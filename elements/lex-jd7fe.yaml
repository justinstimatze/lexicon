id: lex-jd7fe
name: enduring-power-reproduces-through-cultural-consent-with-coercion-in-reserve
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when analyzing how a dominant social arrangement (class, political regime, corporate culture, platform governance, religious institution, educational system, even a software ecosystem) sustains itself over time. Gramsci's distinction: DOMINATION = rule by coercion / force / direct command. HEGEMONY = rule by CONSENT, achieved through cultural institutions (schools, churches, media, family, professional associations, popular entertainment, what Gramsci calls `civil society`) that shape `common sense` so that the dominant arrangement feels natural and inevitable to the subordinated. Enduring rule is achieved primarily through HEGEMONY, not domination — coercion is HELD IN RESERVE for moments when consent fails. The arrangement becomes self-reproducing because the subordinated themselves come to experience its rules as ordinary, sensible, the way things are — not as choices, not as something an external force is making them comply with. The transferable consequence: changing such an arrangement requires CHANGING THE COMMON SENSE — Gramsci's `war of position,` the long-term cultural struggle through which counter-hegemonic ideas establish themselves in civil society — BEFORE direct political confrontation (`war of movement`) can succeed. Pure coercive challenge to a hegemonic order tends to fail because the order's reproduction does not depend on the contested coercive apparatus; the cultural-institutions continue producing consent. Transferable applications: brand loyalty + customer lock-in via cultural identification (not just switching costs); corporate culture as primary alignment mechanism, HR-discipline as backup; online platform governance via community-norms enforcement primary, banning secondary; educational systems where students internalize discipline before they encounter formal punishment; religious institutions where shared belief is primary mechanism, excommunication rare; authoritarian regimes that rely on legitimacy-theater + propaganda + co-opted civil society, secret-police as backup; LLM safety where instruction-following + RLHF is primary, harm-filters as backup; software ecosystems where developer cultural identification (Linux ethos, Apple aesthetic, Rust safety culture) reproduces the ecosystem more durably than any specific technical lock-in. The atom does NOT claim coercion is irrelevant; it claims that coercion ALONE cannot reproduce enduring rule — the cultural-consent reproduction is structurally primary and the coercion is structurally secondary. Distinct from lex-gv3us alignment-via-internalized-objectives (Drucker MBO — deliberate management-design for organizational alignment; lex-jd7fe is about emergent cultural reproduction of political-economic power, not designed management). Distinct from lex-enpjy ruling-power-cloaks-itself-in-a-shared-legitimating-formula (Mosca — the specific legitimating-RHETORIC; lex-jd7fe is the broader cultural-reproduction-MECHANISM). Distinct from lex-cgqta naturalization-erases-the-mechanism (the naturalization-rhetoric; lex-jd7fe is the cultural-institutions where naturalization is produced). Use when (i) a critique of a power-arrangement focuses only on its coercive face and misses the cultural-reproduction, (ii) a reform strategy tries to change the formal rules without changing the common-sense, (iii) you're designing for endurance and need to think about cultural identification rather than just enforcement. Counter-move: identify the civil-society institutions reproducing the arrangement; trace how `common sense` is being produced; ask whether a counter-hegemonic cultural project is possible OR being attempted."
