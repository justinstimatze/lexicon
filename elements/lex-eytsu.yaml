lineage:
  - source: primary
    text: hyde-trickster-turns-the-image-versus-reality-confusion-that-injured-him-into-a-weapon
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'The First Lie,' 'A Sign of Youthful Theft,' retelling the Winnebago trickster cycle's 'Reflected Plums' episode and quoting Paul Radin's gloss on the red-sky symbol. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "What he had seen in the water was only a reflection. ... trickster fools some mother raccoons into leaving their children alone so that he might eat them. To get the raccoons to leave their young, trickster tells them where the plums are: “You cannot possibly miss the place … for there are so many plums there … . If, toward evening, as the sun sets, you see the sky red, you will know that the plums are causing it. Do not turn back for you will surely find it.” As Paul Radin points out, the joke here is that for the Winnebago “a red sky is the stereotype symbol for death. This is what it should have meant to the foolish women for their children are about to be killed.”"
canonical-instances:
  - "A trader who lost a fortune once by mistaking a technical chart pattern for a guaranteed signal learns exactly how that illusion of certainty is manufactured, and later builds a career selling seminars that manufacture the identical false confidence in other retail traders."
  - "Someone who was once genuinely deceived by a scam's specific script, and felt firsthand how convincing its urgency and coded language were, later becomes unusually effective at running that same script on others, because they now understand precisely which words produce the false certainty that fooled them."
critical-questions:
  - "Does trickster's transition from victim to exploiter of the same confusion require the original suffering, or could the same technique be learned just by observing someone else fall for it, making the personal-injury framing more dramatic than causally necessary?"
  - "Is there a meaningful asymmetry between learning to recognize a confusion (which protects you) and learning to produce it (which enables you to harm others), and does experiencing the confusion firsthand actually teach the second skill, or only the first?"
  - "Could this pattern equally describe someone using hard-won insight into a manipulation to warn or protect others from it, meaning the diagnostic captures a general capability -- precise insight into a confusion -- that is morally neutral until a choice is made about its use?"
