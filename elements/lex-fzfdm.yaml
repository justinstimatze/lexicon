id: lex-fzfdm
name: correct-outward-conduct-is-rebuked-as-its-own-distinct-wrong-when-the-inward-will-is-absent
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'A wise judge can hold that performing the correct external behavior while resenting or disbelieving in it internally is not a neutral shortcut but a distinct fault of its own, separate from and in addition to any fault in the outward act itself. In the Jataka''s tale of Kanhadipayana, the Bodhisatta rebukes the householder not for withholding gifts but for giving them while disbelieving their worth: "In gathering ill-gotten gains, and in disbelieving that when you give liberally, the deed is a seed that brings fruit, in this you have done wrong," and is rebuked in turn, symmetrically, for having accepted gifts while resenting his own vocation: "''you have yourself done wrong in accepting our gifts when walking the path of holiness against your will.''"'
related: []
evokes: [jataka, dasanipata, kanhadipayana-jataka, orthopraxy-without-orthodoxy, correct-conduct-with-absent-will]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanhadipayana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 444, Kanhadipayana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "In gathering ill-gotten gains, and in disbelieving that when you give liberally, the deed is a seed that brings fruit, in this you have done wrong."
canonical-instances:
  - "A performance review flags an employee not for missing any deadline but for privately telling teammates the work is pointless while doing it anyway, treating the resentful compliance as its own separate problem from either quitting or genuinely committing."
critical-questions:
  - "Judging the inner will behind correct conduct assumes an observer can actually see it — can anyone reasonably be asked for more than the outward conduct itself?"
