id: lex-ks25x
name: rank-mobilizable-resources-by-shared-interest-not-by-availability-or-size
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to draw on several available pools of people, capital, or capability, don't default to the one that's easiest to reach or largest in the moment -- rank the pools by how tightly their interests already align with yours, since that alignment determines how reliable the resource stays once things get difficult, not just how quickly it responds now. Kautilya ranks six sources of troops in decreasing order of preference and gives the reasoning for each step down the chain: the standing army beats a territorial army 'because the standing army depends on the king for its existence and because it is constantly under training'; the territorial army beats militias because it is 'near by, more easily mobilised and more obedient'; militias beat allied troops because militia members 'have a common objective' with the king and 'same feelings of rivalry, resentment and expectations of success and gain'; allied troops beat alien forces because allies 'have interests similar to those of the king' and are 'available for use anywhere and at any time'; and alien and jungle forces rank last because they have 'plunder as their objective' and are, absent plunder or in a crisis, 'as dangerous as a viper in one's bosom.' The ranking criterion running through every step is the same: how much does this source's own success depend on and align with mine, versus how much does it merely happen to be near, cheap, or willing right now. A resource that's convenient but has no independent stake in your success will behave predictably right up until conditions change, at which point its lack of aligned interest becomes exactly the vulnerability a crisis exposes. Diagnostic move: when choosing among several pools you could draw on for a critical effort, don't just rank by proximity, cost, or immediate availability -- rank by how much that pool's own fortunes rise and fall with yours, and treat a pool with high convenience but low interest-alignment as reliable only for as long as nothing goes wrong."
