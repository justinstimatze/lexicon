id: lex-z8hbu
name: feeling-rules-cultural-scripts-for-what-should-be-felt
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating an emotional response — your own or another's — surface whether the situation comes with implicit CULTURAL SCRIPTS prescribing what should be felt (and at what intensity, duration, and timing) versus what actually IS felt. Diagnostic: feel for the 'pinch' between what-I-do-feel and what-I-should-feel; that pinch is the trace of an operative feeling-rule. Sanctions for non-compliance (private self-rebuke, social discomfort, formal employment consequences) confirm the rule is operative. The transferable corollary: feeling-rules are CULTURALLY VARIABLE and structurally INVISIBLE to those who naturally comply with them — only the deviants (those whose authentic affect doesn't match the script) experience the rule as a rule. Practitioner-discipline: when surfacing emotional dynamics, name the operative feeling-rule explicitly rather than treating the prescribed affect as natural; name who set the rule + who benefits from compliance + who pays the cost of compliance."
related: [lex-wtkuz, lex-2rsad, lex-xxmeh, lex-pm93k, lex-cgqta, lex-brcgz, lex-6qevt, lex-et8q2, lex-4ydm6, lex-22kep, lex-njj99, lex-b2c6b]
scaffolds-from: [lex-cgqta, lex-wtkuz, lex-pm93k]
evokes: [feeling-rules, what-i-should-feel-vs-what-i-do-feel, the-pinch, emotional-scripts, hochschild-1983, deviation-reveals-the-rule, the-rule-is-invisible-to-the-compliant]
lineage:
  - source: primary
    text: Hochschild-1983-TheManagedHeart
    citation: "Arlie Russell Hochschild, *The Managed Heart: Commercialization of Human Feeling* (University of California Press 1983). Companion mint to lex-njj99. Ch.4 develops the feeling-rules concept as the upstream cultural-script substrate that lex-njj99 emotional-labor commercializes. Hochschild's critical observation: every situation comes with implicit scripts about what should be felt — and we discover the scripts only by FEELING THE PINCH between what we do feel and what we should feel. The script is operative because we can be SANCTIONED for non-compliance — by ourselves (private self-rebuke), by others (social discomfort, awkwardness), or by institutions (employment consequences when the rule is commercialized via lex-njj99). The transferable contribution: feeling-rules are culturally variable + structurally invisible to compliant participants — the rule shows up only at the moment of deviation. The framework grounds transferable analyses of emotional-deviance as a diagnostic for cultural-script identification — when someone consistently fails to produce the 'right' affect for a situation, this is evidence of the rule and may also be a window into alternative cultural arrangements where the rule does not operate (cross-cultural emotional-anthropology, neurodivergent affect-difference, etc.). Pre-mint debunking check passed: the feeling-rules framework has been EXTENDED into the broader emotion-as-cultural-practice tradition (Reddy 2001 *The Navigation of Feeling*; Stearns 2004 *Childhood in World History*; Plamper 2015 *The History of Emotions*) — not retracted; the framework survives all major replications."
    quote: "[Hochschild 1983 Ch.4 'Feeling Rules', the originating definition:] '[Culture] is one of culture's most powerful tools for directing action. How do we sense these scripts or, as I shall call them, feeling rules? In this chapter we discuss the various ways in which all of us identify a feeling rule and the ways in which we discover that we are out of phase with it — ways which include noting the duration, strength, time, and placement of a feeling.' [On the diagnostic for recognizing a feeling-rule:] 'What are feeling rules? How do we know they exist? How do they bear on deep acting? We may address these questions by focusing on the pinch between \"what I do feel\" and \"what I should feel,\" for at this spot we get our best view of emotional convention.' [On the mechanism by which feeling-rules are enforced:] 'How do we recognize a feeling rule? We do so by inspecting how we assess our feelings, how other people assess our emotional display, and by sanctions issuing from ourselves and from them. Different social groups probably have special ways in which they recognize feeling rules and give rule reminders, and the rules themselves probably vary from group to group.' [On the differential pattern across structural positions:] 'I would guess that women, Protestants, and middle-class people cultivate the habit of suppressing their own feelings more than men, Catholics, and lower-class people do.' [On the rule-reminder mechanism as social-enforcement infrastructure:] 'How do we recognize a rule reminder? We can experience it as a private mumbling to ourselves, the voice of a watchful chorus standing to the side of the main stage on which we act and feel. We also receive rule reminders [from other people via comments + gestures + facial reactions].' [Transferable inference: the pivotal diagnostic — feel for the PINCH. Every situation that comes with feeling-rules will produce a measurable pinch between what one does feel and what one should feel; the magnitude + direction of the pinch is the rule's signature. The transferable use: when surfacing emotional dynamics in any context (family, workplace, political discourse, mass media, AI-assistant design), look for the pinch rather than treating prescribed affect as natural; name the rule + who set it + who benefits + who pays the cost of compliance.]"
  - source: discovery-loop
    text: pass-d-negative-space-broadening-
    citation: "(companion mint to lex-njj99). Substrate audit: lex-wtkuz descriptive→operational (Walton) is the general move from descriptive concepts to operational ones; lex-z8hbu names the specific CULTURAL-SCRIPT layer for affective phenomena. lex-2rsad identity-protective-belief-maintenance is cognitive defense against contrary evidence; lex-z8hbu is cultural-script governing affect — orthogonal but composable (identity-protective-belief may be defended by feeling-rules that prescribe a specific affect-response to identity-threat). lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature is about EVOLVED universal expressions; lex-z8hbu is about culturally-variable scripts about which expressions are appropriate when. lex-pm93k cultural-classification-bundles-or-splits-natural-substrate (Morgan) covers how cultural classifications vary; lex-z8hbu is the SPECIFIC case for affective classifications. lex-cgqta naturalization (Woolf W2) erases mechanism by making subordination look natural; lex-z8hbu contributes the affective-script layer of naturalization — feeling-rules-as-natural is one form of naturalized social structure. lex-brcgz (in feminist-theory cluster — check if related) covers internalization-of-dominant-gaze; lex-z8hbu covers the cultural-script substrate for that internalization. lex-6qevt / lex-et8q2 / lex-4ydm6 lived-position / intersectional-position / in-group-universal are about epistemic-position substrates; lex-z8hbu is about affective-script substrates. lex-22kep hermeneutical-injustice (Fricker) is about interpretive-resource gaps; lex-z8hbu names the affective-resource side — what kinds of affect are AVAILABLE in a given culture's emotional vocabulary. lex-njj99 emotional-labor (companion mint) is the commercial extraction of feeling-rule compliance — distinct primitives that compose."
    quote: "[substrate-audit notes, 2026-06-10:] lex-z8hbu feeling-rules is the cultural-script substrate beneath lex-njj99 emotional-labor and many adjacent atoms. Transferable applications: cross-cultural anthropology (which cultures prescribe public weeping at funerals? which prescribe stoicism?), neurodivergent advocacy (the autistic experience of being 'out of phase' with neurotypical feeling-rules), AI-system design (which feeling-rules should the system implement? whose feeling-rules become global defaults?), workplace harassment + dignity-at-work investigation (the 'unprofessional' label often functions as a feeling-rule-violation reminder), parenting + childhood emotion-socialization (children are explicitly taught feeling-rules: 'don't cry over spilled milk'; 'be grateful'; 'don't be angry')."
canonical-instances:
  - "The 'I should feel sad' funeral case (Hochschild 1983 Ch.4): the feeling-rule at a funeral prescribes sadness, grief, somber-affect. Someone who arrives feeling cheerful or indifferent — perhaps because they had a strained relationship with the deceased — feels the pinch between what they do feel and what they should feel. They may either deep-act sadness or perform surface-acting sadness; either way the rule is operative. The exception that proves the rule: if a culture allows joy at funerals (some New Orleans jazz-funeral traditions; Irish wake traditions), the feeling-rule is DIFFERENT, not absent."
  - "The 'I should feel grateful' canonical case (extensive sociological literature; e.g. Hochschild 2012 Ch. 'How Capitalism Captured Feeling Rules'): cultures + employers + parents teach gratitude as the proper response to gifts / services / employment / parenting. The 'I should be grateful for this job' rule is operative when a worker feels resentment over poor conditions and immediately self-rebukes. The 'be grateful' rule disguises the structural conditions for which non-gratitude would be a more accurate response."
  - "The 'I should feel professional' canonical case (Hochschild + extensive workplace-emotion-management literature): the 'professional' standard in most workplaces is a culturally-specific feeling-rule prescribing calm, controlled affect with deference to hierarchy. Workers who fail this rule — by displaying anger at injustice, grief at loss, frustration at incompetence — are labeled 'unprofessional' (a feeling-rule-reminder sanction). The differential exposure pattern: women + people of color are systematically more sanctioned for affect-display that would be tolerated in white men. Practitioner-discipline: surface the structurally-encoded feeling-rule when 'professional' is invoked."
  - "Cross-cultural variation canonical case (Hochschild 1983 Ch.4 + comparative emotion-anthropology literature; e.g. Lutz 1988 *Unnatural Emotions*; Briggs 1970 *Never in Anger*): different cultures prescribe different feeling-rules for the same situation. Briggs documented the Utku Inuit norm of NEVER displaying anger — children who showed anger were sanctioned by being treated as if they did not exist until the anger passed. Lutz documented Ifaluk emotion-categories that don't translate cleanly into English emotion-categories. Transferable inference: feeling-rules are NOT universal even when the underlying emotions (per lex-xxmeh Darwin/Ekman) are. The cultural-script layer is variable + visible only through deviation or comparison."
  - "Childhood emotion-socialization canonical case (Stearns 2004 *Childhood in World History*; extensive developmental psychology + emotion-socialization literature): children are EXPLICITLY taught feeling-rules. 'Don't cry over spilled milk' (prescribes resilience). 'Big boys don't cry' (prescribes gender-specific suppression). 'Be grateful' (prescribes appropriate response to gift / care). 'Use your words' (prescribes verbal over affective expression). 'Don't be angry' (prescribes suppression of anger toward authority figures). Each is a feeling-rule transmission moment. Practitioner-discipline: when designing systems that interact with children (educational tools, AI tutors, mental-health apps), surface which feeling-rules are being transmitted by design and whether the designer endorses the cultural-script being naturalized."
  - "AI-assistant 'how does this make you feel' canonical case (2020s+, transferable AI-design application): AI systems increasingly inquire about emotional state + provide affect-management interventions. The DESIGN choices about (a) which emotions the system recognizes / names as appropriate, (b) which it pathologizes, (c) which it reframes or suppresses, (d) which it reinforces, ENCODE specific cultural feeling-rules at scale. An assistant that consistently re-frames anger toward injustice as 'understandable but try to consider their perspective' is implementing a specific feeling-rule (anger should be civil + accommodating). Practitioner-discipline: surface the feeling-rules the AI is implementing and whether they represent the user's culture or the designer's."
  - "operationally adjacent to lex-njj99 emotional-labor-extracts-affect-as-paid-resource (companion mint): lex-z8hbu is the CULTURAL SCRIPT layer that prescribes the feeling. lex-njj99 is the COMMERCIAL EXTRACTION of compliance with the script. They compose: lex-z8hbu supplies the script; lex-njj99 commercializes compliance. Fire as a pair when discussing institutionally-required affect."
  - "operationally distinct from lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature (Darwin / Ekman / Brown): lex-xxmeh is about how emotions ARE naturally expressed across cultures (evolved signatures of the basic emotions). lex-z8hbu is about culturally-variable SCRIPTS prescribing what should be felt in given situations. They compose at different layers — lex-xxmeh covers the biological substrate of emotion-expression; lex-z8hbu covers the cultural-institutional substrate of emotion-prescription. Cross-cultural studies validate both: the basic emotional expressions are universal (lex-xxmeh), but the feeling-rules about when each is appropriate vary (lex-z8hbu)."
  - "operationally distinct from lex-pm93k cultural-classification-bundles-or-splits-natural-substrate (Morgan): lex-pm93k is the general cultural-classification-varies claim. lex-z8hbu is the SPECIFIC application to affective classifications — which emotions are felt, named, and prescribed in given situations. They compose: lex-pm93k supplies the general claim; lex-z8hbu specifies the affective case."
  - "operationally distinct from lex-cgqta naturalization-erases-the-mechanism-that-produced-the-effect (Woolf W2): naturalization erases the mechanism of subordination by making it look natural. lex-z8hbu names a specific cultural-script-as-natural mechanism — feeling-rules naturalized as how-emotions-just-work. The compliant participant cannot see the rule; only the deviant feels the pinch. The naturalization-mechanism lex-cgqta operates on feeling-rules among other targets; lex-z8hbu specifies the affective case."
  - "operationally adjacent to lex-6qevt / lex-et8q2 / lex-y2nej lived-position / intersectional-position / dominant-group-values: feeling-rules are differentially encoded for different structural positions. Dominant-group members get to set the feeling-rules; subordinated-group members experience them as the rule, with sanctions for deviation. The structural intersection of lex-et8q2 + lex-z8hbu is a substantively important compound primitive — feeling-rules at intersectional positions carry layered + sometimes contradictory prescriptions."
  - "operationally distinct from lex-22kep hermeneutical-injustice (Fricker): lex-22kep names interpretive-resource gaps for sense-making. lex-z8hbu names culturally-variable feeling-rule scripts. They are adjacent — affective-vocabulary gaps (which feelings can be NAMED) and feeling-rule gaps (which feelings are PRESCRIBED) compose at the affective-cultural substrate layer."
critical-questions:
  - "where's the pinch? The atom's key diagnostic. Hochschild's method: feel for the gap between what-you-do-feel and what-you-should-feel. The gap is the trace of an operative feeling-rule. When the gap is large, the rule is strong. When the gap is small or absent, you may simply comply naturally OR there may be no rule operating in this situation. Practitioner-discipline: name the rule by naming the pinch."
  - "who set the rule and who benefits from compliance? The atom's critical-political question. Feeling-rules don't fall from the sky; they are encoded by cultural-institutional infrastructure (family, school, religion, workplace, media, increasingly algorithmic systems). Practitioner-question: trace the rule to its institutional source and ask whose interests are served by compliance. The 'I should be grateful for this job' rule serves employers; the 'big boys don't cry' rule serves a specific gender-arrangement; the 'professional' rule serves the dominant culture of the workplace."
  - "is the rule operative or just nominal? Some feeling-rules are nominally present but weakly enforced; others are strongly enforced with consequential sanctions. Practitioner-discipline: surface the actual sanction mechanism. A rule with private self-rebuke as its only sanction is operationally weaker than a rule with formal employment consequences. The sanction-strength is part of the rule's substrate-significance."
  - "is the deviation evidence of an alternative arrangement? When someone consistently fails to comply with a feeling-rule, two interpretations: (a) individual non-compliance / dysfunction, (b) the person operates under different cultural feeling-rules (cross-cultural difference; neurodivergent affect; subcultural variation). Practitioner-discipline: don't default to interpretation (a). Surface whether the deviation reveals an alternative cultural arrangement that has its own coherent feeling-rules."
  - "what's the cultural-variability claim? The atom rests on the empirical claim that feeling-rules vary across cultures, classes, subcultures, gender configurations, and individual neurodivergence patterns. The cross-cultural emotion-anthropology literature (Lutz, Briggs, Reddy, Plamper) provides extensive empirical support. Practitioner-discipline: when discussing feeling-rules, surface that the SPECIFIC rule under discussion is culturally-positioned, not universal — even if the underlying emotion (per lex-xxmeh) is universal."
  - "the LLM/AI-design application: AI systems that recognize / name / prescribe / suppress / reframe / reinforce affect ARE implementing feeling-rules at scale. The cultural-positionality of the implemented rules typically tracks the designer's cultural defaults (Anglo-American + middle-class + neurotypical + adult-oriented). The system then transmits these defaults globally to users from other cultural positions, naturalizing them as universal. Practitioner-discipline: surface the cultural-feeling-rules being implemented; offer cultural-configurability where possible; resist defaulting to designer-cultural-defaults in cross-cultural deployment contexts."
