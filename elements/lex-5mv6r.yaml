id: lex-5mv6r
name: literalness-as-limiting-case
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When something is described as 'literal,' surface that literalness is the limiting case of a continuum — pure literal speech is rare; most communication runs on implicature, metaphor, indirection. Don't treat the limit as the default."
related: [lex-u74ex, lex-e2tnt, lex-bd324, lex-xhvgy, lex-j929z, lex-n6t4u]
scaffolds-from: [lex-xhvgy, lex-j929z, lex-n6t4u]
evokes: [literal-loose-continuous-not-categorical, relevance-trumps-literalness, loose-talk-as-default, hyperbole-metaphor-as-continuous-with-loose, optimal-relevance-not-literal-truth, paraphrase-loses-information, propositional-resemblance-not-identity]
lineage:
  - source: primary
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard UP / Blackwell 1986; 2nd ed. 1995). Chapter 4 §8 'Literalness and metaphor' (p.231-237). S&W's critical claim: literalness is a LIMITING CASE not a NORM. They reject the philosophical default that literal speech is primary and loose/figurative speech is a deviation requiring special explanation (Grice's literalness maxim, Searle's literal-meaning primacy). Instead: every utterance is governed by the SAME principle of relevance (effect/effort balance from lex-xhvgy + lex-j929z); whether the utterance is literal or loose, hyperbolic or metaphorical, is determined by what maximizes relevance in the context. Literal expression is just the special case where the optimally-relevant utterance happens to share full propositional form with the thought being expressed. Loose talk, hyperbole, and metaphor are continuous extensions of the same machinery. The £797.32 vs £800 example (p.233) is the canonical demo: the false-but-economical reply is BETTER per relevance because the effort-saved exceeds the information-lost. The hearer takes an utterance as fully literal only when nothing less than full literality satisfies the principle of relevance. Verified verbatim 2026-05-20 (Ch.4 §8 p.231-235 OCR'd page text; page numbers verified from per-page file headers using established filename = printed-page + 10 offset)."
    quote: "We see no reason to postulate a convention, presumption, maxim or rule of literalness to the effect that this interpretation must be a literal reproduction. How close the interpretation is, and in particular when it is literal, can be determined on the basis of the principle of relevance. [Ch.4 §8 p.231 — the pivotal rejection: no separate literalness norm; literal/loose is governed by the same relevance principle.] We are treating literalness, or identity of propositional forms, as a limiting case rather than a norm. We will show that this approach, combined with relevance theory, yields a straightforward account of metaphors and related tropes. [Ch.4 §8 p.232 — the operational stance: literalness is the special case where optimal-relevance happens to coincide with propositional-form identity.] From the standpoint of relevance theory, there is no reason to think that the optimally relevant interpretive expression of a thought is always the most literal one. The speaker is presumed to aim at optimal relevance, not at literal truth. The optimal interpretive expression of a thought should give the hearer information about that thought which is relevant enough to be worth processing, and should require as little processing effort as possible. There are many quite ordinary situations where a literal utterance is not optimally relevant: for example, where the effort needed to process it is not offset by the gain in information conveyed. [Ch.4 §8 p.233 — the explicit composition with lex-xhvgy effect-side + lex-j929z effort-side: relevance-maximization can favor loose over literal when literal's extra effort isn't justified by extra effect.] It follows that the hearer should take an utterance as fully literal only when nothing less than full literality will confirm the presumption of relevance. In general, some looseness of expression is to be expected. For example, if someone says, 'It's 5 p.m.', she should not be taken to task if it turns out to be five minutes or two minutes to, unless the relevance of the utterance depends on that kind of exactitude. [Ch.4 §8 p.234 — the canonical heuristic: default to loose interpretation unless context demands literality. Time-of-day, salary, exhaustion are demo cases.] We want to claim that there is no discontinuity between these loose uses and a variety of 'figurative' examples which include the most characteristic examples of poetic metaphor. In both cases, the propositional form of the utterance differs from that of the thought interpreted. In both cases, the hearer can proceed on the assumption that these two propositional forms have some identifiable logical and contextual implications in common. In both cases, the same interpretive abilities and procedures are involved. [Ch.4 §8 p.235 — the continuity claim that closes the carve: loose talk, hyperbole, and metaphor are not separate phenomena requiring separate machinery; they extend the same relevance-driven process.]"
  - source: practitioner
    text: sperber-wilson-mining-pass-1
    citation: "promoted from cross-attestation: linguistic philosophy and pragmatics (Grice 1975 'Logic and Conversation' Studies in the Way of Words: Grice's cooperative principle implies a literalness norm via the Quality maxim; S&W's lex-5mv6r rejects this as overgenerated structure — the same relevance machinery handles literal AND non-literal with no special-case rule), philosophy of language (Davidson 1978 'What Metaphors Mean' Critical Inquiry 5(1):31-47: argues metaphors mean only their literal content, with the figurative effect lying in what they prompt the hearer to notice; opposite stance to S&W but engages the same target — what makes loose/figurative expression work without a separate semantic layer), code review and design-doc craft (a useful comment 'this is racy' is loose: technically the code may not have a strict data race, but the comment delivers the relevant alarm with less effort than the strictly-literal multi-paragraph race-condition analysis. Looseness saves effort while preserving the relevant contextual effect — lex-5mv6r in operation), AI alignment and LLM output evaluation (an LLM that produces over-literal output ('the user requested I list 5 items; I have provided exactly 5 items in numbered form') is bad-prompted by the literalness-as-norm assumption; better-aligned models recognize that user requests are loose and respond at the optimal-relevance level — sometimes 5, sometimes 'here's roughly what you want.' lex-5mv6r names the substrate for evaluating literalness-calibration), legal interpretation (textualism vs purposivism: textualism privileges literal meaning; purposivism allows loose interpretation when literal reading misses the relevant intent. The dispute is fundamentally about whether legal interpretation should treat literalness as a norm or as a limiting case. lex-5mv6r takes a side: literalness as limiting case has both empirical and theoretical support from relevance theory), translation and interpretation theory (Nida 1964 'dynamic equivalence' vs 'formal equivalence' in Bible translation: dynamic equivalence is the literalness-as-limiting-case stance applied to inter-language transfer; formal equivalence is the literalness-as-norm stance. The translation literature anticipated S&W's claim by 20 years). Cross-domain attestation across philosophy of language, code review, AI alignment, legal interpretation, and translation theory"
canonical-instances:
  - "S&W's £797.32 vs £800 example from Ch.4 §8 p.233: when a friend asks 'how much do you earn?', the false-but-economical (105b) 'I earn £800 a month' is OPTIMALLY MORE RELEVANT than the strictly-literal (105a) 'I earn £797.32 pence a month' because the £797.32-precision adds no relevant contextual effect over £800 in the friend-asking-context, but costs extra processing effort. The loose-talk wins because effort-saved exceeds information-lost. The example demonstrates the continuous-not-categorical claim — literal and loose are not separate registers but ordered points on a single relevance gradient"
  - "S&W's 'It's 5 p.m.' example from Ch.4 §8 p.234: a speaker who says 'it's 5 p.m.' when it's actually 4:58 has spoken loosely-not-literally, but this is normal and expected — only when the context demands minute-level precision (catching a train, running a timed experiment) does the hearer treat it as failure. Default-loose interpretation is the operating norm; demand-for-literal is the special case. Maps directly onto how engineers communicate timestamps in casual vs production-critical contexts"
  - "S&W's hyperbole/metaphor extension from Ch.4 §8 p.235-236: 'Bill is the nicest person there is' (hyperbole) and 'Robert is a bulldozer' (metaphor) are NOT separate phenomena requiring distinct semantic machinery — they extend the same relevance-maximizing process that produces loose-talk. The propositional form of the utterance differs from the thought being expressed; the hearer recovers the intended contextual implications via the same effect/effort calculus. Eliminates the need for special 'metaphorical meaning' constructs in semantic theory"
  - "code review heuristic: a useful comment 'this is racy' is loose — technically the code may not have a strict data race, but the comment delivers the relevant alarm with less effort than 'this code may have a race condition because under conditions X, Y, and Z the lock is not held during the read of variable W in thread T1 while thread T2 may be writing to W.' The loose comment is OPTIMALLY RELEVANT in a quick-review context; the literal comment would be optimally-relevant only in a formal-correctness-proof context. lex-5mv6r in operation: register-of-precision is context-dependent"
  - "LLM output evaluation: a model that over-literalizes user requests ('the user requested I list 5 items; I have provided exactly 5 items in numbered form, each prefixed with a decimal number, each on its own line') is bad-prompted by literalness-as-norm. Better-aligned models recognize requests are loose by default and respond at the optimal-relevance level. Paired with lex-jv983 fluency-trap: over-literal output can ITSELF be a fluency-trap (the structural-perfection masks failure to deliver the contextual effect the user actually wanted). lex-5mv6r names the discount that should apply to over-literalized output"
  - "legal interpretation textualism-vs-purposivism: textualism treats literal meaning as primary; purposivism allows loose reading when literal interpretation misses the relevant statutory intent. The substantive disagreement is about whether lex-5mv6r holds — whether literalness is a limiting case or a norm. lex-5mv6r takes the position: literalness is a limiting case (purposivism-aligned), but it does NOT settle the legal-policy question of when to depart from literal reading (that's a separate normative/positivist debate). The atom describes the linguistic substrate, not the legal-doctrinal application"
  - "operationally distinct from lex-j929z processing-effort-as-relevance-cost: lex-j929z names the effort-axis broadly; lex-5mv6r names the specific application of effort-axis to interpretive choices (literal vs loose). lex-5mv6r is a SPECIALIZED CONSEQUENCE of lex-xhvgy + lex-j929z applied to language production, not a separate axis. Distinct because the application is non-trivial: rejecting the literalness-norm is a substantive philosophical claim, not just an instance of effort-saving"
  - "operationally distinct from lex-xhvgy contextual-effects-as-relevance-currency: lex-xhvgy names the effect-side criterion; lex-5mv6r invokes both effect and effort to justify why loose expression can be optimal. lex-5mv6r is a downstream application of lex-xhvgy to a specific domain (language production); the two atoms are not synonyms"
  - "operationally distinct from lex-n6t4u inference-by-constraint-not-computation: lex-n6t4u is the engine-claim about how spontaneous inference works; lex-5mv6r is the production-and-interpretation claim about how loose/literal expressions get generated and understood. Different layers (inference engine vs language production/interpretation), though both flow from S&W's relevance-theoretic framework"
  - "key edge case — when literalness IS optimal: the atom does NOT say 'always loose is better.' It says 'literal is the limiting case, not the norm.' In contexts where exactitude matters (financial systems, legal contracts, scientific measurement, formal verification), full literality IS optimally relevant because the contextual effects DEPEND on the literal-form-equals-thought-form identity. The atom names the calibration not a directional bias: match the literalness-level to what the context's relevance-criterion demands"
  - "essential critical question: does the no-special-machinery-for-metaphor claim actually hold empirically? Empirical work in psycholinguistics (Gibbs 1994 The Poetics of Mind; Glucksberg 2001 Understanding Figurative Language) provides mixed support — metaphor comprehension shows distinct timing patterns from literal comprehension in some experimental setups but converging patterns in others. S&W's claim is theoretically clean but the empirical case for it is not closed. Flag for revision if a strong neurolinguistic case is made that figurative processing recruits machinery literal processing doesn't"
  - "foundational critical question: does the continuity claim erase important distinctions between dead/conventional metaphors and creative/poetic metaphors? S&W discuss this on p.235-236: more creative metaphors yield a wider range of weak implicatures and demand more hearer-responsibility for constructing the interpretation. So creativity is preserved AS A GRADIENT, not as a categorical distinction. The atom holds: continuity at the mechanism level, gradient at the operational outcome"
  - "decisive critical question: does lex-5mv6r generalize to non-linguistic communicative acts (gesture, gaze, visual art)? S&W limit themselves to verbal communication, but the relevance-theoretic framework explicitly extends to ostensive-inferential communication generally. The literalness-as-limiting-case claim likely extends to non-verbal media: a precise pointing-gesture is the limiting case; a vague hand-wave is the optimally-relevant loose version. Atom-shape extension to non-verbal modalities is plausible but not staked"
critical-questions:
  - "is the speaker asking for literal interpretation as a sincere request, or as a refusal of the usual contextual reading?"
  - "what would the literal reading miss that the implicature-laden reading captures?"
  - "could you be flattening to literal because the implicature is uncomfortable — and is that flattening hiding something?"
  - "is the gap between literal and implied the very thing the communication is operating on (irony, sarcasm, indirection)?"
status: active
