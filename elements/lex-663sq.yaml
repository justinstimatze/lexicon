evokes: [forming-storming-norming-performing, tuckman-stages-of-group-development, testing-dependence, intragroup-conflict, functional-role-relatedness, storming-is-a-required-stage-not-dysfunction, group-structure-and-task-activity-are-parallel-tracks]
lineage:
  - source: primary
    text: tuckman-1965-developmental-sequence-in-small-groups
    citation: "Bruce W. Tuckman, 'Developmental Sequence in Small Groups,' Psychological Bulletin, 1965, Vol. 63, No. 6, pp.384-399 (Naval Medical Research Institute)."
    quote: "[Abstract, p.384:] Finally, 4 general stages of development are proposed, and the review consists of fitting the stages identified in the literature to those proposed. In the social realm, these stages in the developmental sequence are testing-dependence, conflict, cohesion, and functional roles. In the task realm, they are orientation, emotionality, relevant opinion exchange, and the emergence of solutions. There is a good fit between observed stages and the proposed model. [pp.396-397, model summary in Discussion:] Groups initially concern themselves with orientation accomplished primarily through testing. Such testing serves to identify the boundaries of both interpersonal and task behaviors. Coincident with testing in the interpersonal realm is the establishment of dependency relationships with leaders, other group members, or preexisting standards. It may be said that orientation, testing, and dependence constitute the group process of forming. The second point in the sequence is characterized by conflict and polarization around interpersonal issues, with concomitant emotional responding in the task sphere. These behaviors serve as resistance to group influence and task requirements and may be labeled as storming. Resistance is overcome in the third stage in which ingroup feeling and cohesiveness develop, new standards evolve, and new roles are adopted. In the task realm, intimate, personal opinions are expressed. Thus, we have the stage of norming. Finally, the group attains the fourth and final stage in which interpersonal structure becomes the tool of task activities. Roles become flexible and functional, and group energy is channeled into the task. Structural issues have been resolved, and structure can now become supportive of task performance. This stage can be labeled as performing. [p.397-398, on variability:] While the suggested sequence appeared to hold up under widely varied conditions of group composition, duration of group life, and specific group task (i.e., the sequence held up across settings), it must be assumed that there is a finite range of conditions beyond which the sequence of development is altered... Setting-specific differences and within-setting differences may affect temporal change as regards the specific content of the stages in the developmental sequence, the rate of progression through the sequence, or the order of the sequence itself."
canonical-instances:
  - "A newly-assembled software team's first sprint retro surfaces sharp disagreement about code-review standards — the tension is stage 2 (storming), not evidence of a bad hire; suppressing the disagreement to keep the retro 'positive' would remove the group's only mechanism for generating its own norms."
  - "A student project group deflects to whichever member seems most confident during the first meeting (forming/testing-dependence), then has a contentious argument over division of labor (storming), then settles into a working split of tasks (norming), then executes smoothly in the final days before the deadline (performing)."
  - "A newly-formed nonprofit board defers heavily to the founding chair's stated procedures in its first two meetings, then has a genuinely heated argument over budget priorities in the third — Tuckman's model predicts this conflict, rather than treating it as a sign the board is dysfunctional or poorly recruited."
  - "A Scrum team's velocity dips in its second and third sprints after a strong first sprint — read against the model, the dip is the group working through storming (renegotiating who owns what, resisting imposed process) rather than a regression that needs correcting with more process."
critical-questions:
  - "Isn't this just generic 'teams need time to gel' advice? No — the specific and non-obvious claim is that storming (real interpersonal conflict, resistance to authority and to each other) is a REQUIRED, PRODUCTIVE stage on the path to performing, not a failure state to be minimized. A facilitator who forces premature harmony (silencing dissent, rotating out anyone who pushes back) removes the mechanism by which the group generates its own norms and roles — the group may look calm but stalls before reaching performing."
  - "Does the model predict a fixed timeline, or that every group hits all four stages in this exact order? No — Tuckman's own paper explicitly qualifies this: rate and even the order of the sequence vary with group composition, task type, and duration of group life. Impersonal/laboratory tasks compress the sequence into hours; personal/therapeutic tasks may take months per stage. The model's value is diagnosing WHICH stage a specific group is in now, not forecasting a universal clock."
  - "How is 'group structure' different from 'task activity' as tracks — aren't they the same progress? No, per the source they are two PARALLEL, COUPLED tracks running through the same four stages simultaneously: group structure is the interpersonal pattern (dependence → conflict → cohesion → role-relatedness), task activity is the work-product pattern (orientation → emotional response → opinion exchange → solution emergence). A group can be ahead on one track and stuck on the other — diagnosing 'what stage are we in' requires checking both, not reading one vibe."
  - "Isn't 'adjourning' the fifth stage of this model? Not in THIS source — the 1965 paper defines only the four stages above. The commonly-cited fifth stage (adjourning/mourning, covering how a group disbands) was added later by Tuckman & Jensen, 'Stages of Small-Group Development Revisited' (1977), a different, not-yet-acquired paper. Don't backdate adjourning's lineage to this 1965 citation."
