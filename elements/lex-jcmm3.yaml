id: lex-jcmm3
name: classification-boundary-excludes-the-evidence-that-tests-it
type-in: question
type-out: process
_tier: atomic
agent-instruction: "Apply this when a categorical boundary (legal, administrative, disciplinary) is defended by citing the boundary itself as the reason the evidence needed to test it is inadmissible. Nutt's exchange with UK Home Secretary Jacqui Smith over his 'equasy' editorial names the exact loop: 'You can't compare harms from a legal activity with an illegal one.' / 'Why not?' / 'Because one's illegal.' / 'Why is it illegal?' / 'Because it's harmful.' / 'Don't we need to compare harms to determine if it should be illegal?' / 'You can't compare harms from a legal activity with an illegal one.' The classification (Class A / legal) was supposedly assigned BECAUSE of a harm assessment, which makes cross-category harm-comparison the natural test of whether the classification is correct -- but the classification is then invoked to rule that exact comparison out of bounds. The loop is airtight from inside: no evidence can enter that would either confirm or overturn the boundary, because the boundary itself is the admissibility filter for the evidence. This differs from ordinary question-begging in that it isn't merely restating the conclusion as a premise -- it actively DISABLES the mechanism (comparison) that would let outside evidence in at all. Practitioner move: when a category's legitimacy is challenged and the response is 'you can't apply that test because of which category this is,' surface explicitly that the category's own boundary is functioning as the gatekeeper against its own falsification, and ask what test WOULD be admissible -- if the answer is 'none, because any comparison crosses the boundary by definition,' the classification is unfalsifiable by construction, not evidence-grounded."
related: [lex-u5869, lex-39muf, lex-znaau]
evokes: [equasy-editorial, misuse-of-drugs-act-classification, circular-defense-of-categories, self-sealing-boundary, jacqui-smith-exchange, unfalsifiable-by-construction]
lineage:
  - source: primary
    text: nutt-2012-drugs-without-the-hot-air
    citation: "David Nutt, Drugs Without the Hot Air: Minimising the Harms of Legal and Illegal Drugs (UIT Cambridge, 2012), Ch.2 ('Ecstasy: a moral issue') and Ch.3 ('Why measure?'). Nutt reports the exchange as occurring after he, as ACMD chair, published a 2009 Journal of Psychopharmacology editorial comparing ecstasy's harms to a made-up affliction ('equasy', equine-addiction-syndrome) built from real horse-riding injury/death statistics -- provoking a personal call from Home Secretary Jacqui Smith and public political condemnation. The UK's Misuse of Drugs Act (1971) created three legal Classes (A/B/C) explicitly intended to track a substance's harmfulness, with the ACMD created specifically to keep that classification evidence-based rather than politically driven."
    quote: "When Jacqui Smith called me to ask me to apologise for my equasy editorial [...] we had the following exchange: Jacqui Smith: You can't compare harms from a legal activity with an illegal one. Me: Why not? Jacqui Smith: Because one's illegal. Me: Why is it illegal? Jacqui Smith: Because it's harmful. Me: Don't we need to compare harms to determine if it should be illegal? Jacqui Smith: You can't compare harms from a legal activity with an illegal one. It's not the only time I've had this circular conversation with an MP. [...] In this world-view, taking certain drugs in certain sorts of ways is not just harmful but immoral; it follows that policy-makers aren't interested in measuring harm -- because they would want to eradicate this kind of drug use even if it wasn't doing any harm at all."
  - source: discovery-loop
    text: nutt-2012-drugs-without-hot-air-mining-pass-
    citation: " mining pass (2026-07-14), same source and triage process as sibling atom lex-cwmus (see that atom's discovery-loop entry for the coverage-triage methodology). a distinctness check against the catalog on this candidate against the full 1018-atom substrate returned no close collision: highest-scoring matches were lex-8vqvy externalities-are-reciprocal-the-question-is-which-harm-to-avoid (0.658, Coase's reciprocal-causation framing for property disputes -- a completely different domain and mechanism, about WHO bears a cost when harm is mutual, not about a category blocking its own test), lex-u5869 chestertons-fence (0.637, about epistemic humility before removing an institution whose purpose you don't understand -- close in the general neighborhood of 'defend existing categories' but the mechanism is opposite: Chesterton's Fence counsels investigating an unclear rationale before acting; this atom is about a rationale that is clear (harm) but structurally excludes the evidence that would test it), lex-8n237 under-determined-rule-admits-multiple-legitimation-methods (0.510, about interpretive pluralism for under-determined rules, not circularity), and lex-7aqqb framing-of-question-fixes-the-ontology-of-the-inference (0.500, about how a question's framing determines what counts as an object, a related-but-distinct meta-epistemic point about framing rather than about a category self-sealing against its own falsification test). A targeted secondary grep for circular-reasoning / question-begging / self-sealing / no-true-Scotsman atoms in substrate found no closer match (lex-z3qjg acted-on-belief-causes-its-own-confirmation is about self-fulfilling prophecy, a different mechanism -- belief causing the world to match it, not a category blocking evidence). No genuine gap risk found; this atom names a distinct, sharply-defined failure mode not covered by the existing near-neighbors."
canonical-instances:
  - "The Jacqui Smith exchange verbatim: the classification (illegal) is justified by an appeal to harm; the harm-comparison needed to test that justification is then ruled inadmissible because of the classification. Four exchanges of the same loop in one conversation."
  - "'No true Scotsman' generalization: a claimed universal ('no Scotsman puts sugar on porridge') is defended against a counterexample by redefining the category to exclude the counterexample ('no TRUE Scotsman...') -- the category's boundary is redrawn specifically to exclude the evidence that would test the original claim, structurally identical to using the boundary to exclude cross-category comparison."
  - "Institutional review boards or licensing bodies that refuse to compare their gatekept profession's harms/failure-rates against an unlicensed alternative on the grounds that 'we can't compare regulated practice to unregulated practice' -- when the original rationale for regulation was itself a harm/quality claim that such a comparison would test."
  - "A company's internal risk classification (a project or vendor rated 'high risk' vs 'low risk') that refuses to permit resource reallocation on the grounds that the classification already determined the resourcing, when the classification was originally supposed to be a data-driven READ on risk rather than an unfalsifiable administrative fact fixed at assignment time."
critical-questions:
  - "Is this just a rhetorical circularity ('begging the question') with no deeper structure? It's a specific SUBTYPE of circularity: ordinary question-begging restates the conclusion as an unstated premise inside an argument; this atom's pattern additionally and explicitly BLOCKS THE ADMISSIBILITY of the specific evidence-gathering move (cross-category comparison) that could break the circle from outside. The extra move -- disabling the test, not just assuming the conclusion -- is what makes it operationally distinct and diagnostically useful: you can name a concrete missing test ('what comparison would you accept?') rather than just flagging fallacious structure."
  - "How is this different from Chesterton's Fence (lex-u5869)? Chesterton's Fence says: don't remove an institution until you understand WHY it exists -- it's a caution against premature reform driven by ignorance of a possibly-good reason. This atom applies when the reason IS known and stated (the classification exists because of harm) but the category is then used to prevent the very comparison that would confirm or refute that stated reason. Chesterton's Fence protects institutions from ignorant reformers; this atom diagnoses institutions protecting themselves from informed testers."
  - "What breaks the loop in practice? Nutt's own resolution was external and structural, not rhetorical: he built an independent multi-criteria harm-ranking (see sibling atom's source, Ch.3) using an expert panel outside the political classification process, published it, and let public/media reaction force the comparison the political process refused to make internally. Practitioner move: when the gatekept comparison can't be won by argument inside the institution, construct the comparison OUTSIDE it, using independent criteria the institution didn't design and therefore can't rule inadmissible by definitional fiat."
