id: lex-9qwt9
name: leaving-before-the-friendship-sours-preserves-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A valued relationship doesn't have to run its natural course to its natural end. Choosing to leave while it's still good, deliberately and before any decline has actually begun, can preserve it in the state worth remembering, instead of staying to find out whether it eventually turns sour. In the Jataka's tale of Mahabodhi, the sage Bodhi has just survived his own king's attempt to have him executed on slander, and the king, now repentant, begs him to remain at court. Bodhi refuses, generalizing past the specific betrayal to a rule: \"Who stay too long find oftentimes that friend is changed to foe; / So ere I lose thy friendship I will take my leave and go.\" He leaves at the height of reconciliation, without waiting to see whether it holds."
related: []
evokes: [jataka, pannasanipata, mahabodhi-jataka, preemptive-exit-preserves-a-relationship, leaving-at-the-peak]
lineage:
  - source: primary
    text: jataka-francis1905-mahabodhi-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XVIII (Pannasanipata), No. 528, Mahabodhi-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Who stay too long find oftentimes that friend is changed to foe; / So ere I lose thy friendship I will take my leave and go."
canonical-instances:
  - "A consultant whose relationship with a client has been genuinely excellent for three years turns down the client's offer of a permanent full-time role, worried that daily proximity and the ordinary friction of employment would erode a partnership that has stayed strong specifically because it had natural boundaries."
  - "A comedian retires a beloved recurring character at the height of its popularity rather than running it until audiences tire of it, choosing to let it be remembered exactly as it was instead of watching it decline in real time."
critical-questions:
  - "Bodhi has just narrowly survived an execution attempt — is this really a case of leaving while things are good, or a more ordinary decision to leave a place that already proved dangerous, framed afterward in the language of preserving friendship?"
  - "The king explicitly asks him to stay, and Bodhi refuses on principle rather than on the specific facts of what just happened. What's lost by generalizing a single betrayal into a rule for all future relationships, when the actual evidence only ever concerned this one particular king?"
status: active
