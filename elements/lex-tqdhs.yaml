id: lex-tqdhs
name: cultural-change-has-internal-mechanisms-not-just-external-causes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When asked to explain a cultural shift — a fashion changing, names cycling, a musical genre rising or falling, a slang term spreading then dying, a design trend — do not jump immediately to 'what external social force caused this?' Lieberson's 2000 *A Matter of Taste* documents systematically that tastes have INTERNAL MECHANISMS that drive change independently of (or in interaction with) external social forces. The two broad classes of explanation: (1) external — social, economic, technological, demographic shifts in surrounding society; (2) internal — endogenous dynamics of the taste-system itself. The internal mechanisms Lieberson surfaces include the ratchet effect (each new generation building on the previous within the taste-tradition), the mutation analogue (small drift accumulating), enhancement-contamination (a fashion becoming over-associated with a particular sub-group then losing appeal among other sub-groups precisely because of that association), the expansion model (taste-bearers expanding into new domains), and others. The decisive empirical evidence is that names exhibit characteristic cycle dynamics (rise-peak-decline-eventual-revival) that look very similar across very different external conditions — suggesting the internal-dynamic part is doing real work. Transferable diagnostic: when proposing an external-cause explanation for a cultural change, check whether the change-shape matches generic internal-dynamics first; many apparently external-cause stories are post-hoc rationalizations of internal dynamics. Operational consequence in adjacent domains: software-language popularity cycles, music-genre rise-decline, academic-jargon spread-and-decay, baby-name fashions, brand-name lifespans, design-pattern adoption-curves — all show signatures of endogenous dynamics that don't need external-cause explanations. Inverse: external explanations are not wrong — they're just systematically over-weighted; the right model is usually internal-dynamics-shaped-by-external-context, not external-cause-only."
