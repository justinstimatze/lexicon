id: lex-j5kxw
name: uncertainty-classified-by-cause-and-response
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When facing uncertainty, classify by CAUSE (aleatory: random in the world; epistemic: ignorance) and by RESPONSE (insurable: pool, hedgeable: portfolio, knowable: investigate). Different uncertainty types route to different responses; misclassification picks the wrong response."
related: [lex-jv983, lex-wtkuz, lex-k6d7u, lex-jy4aq, lex-th6tr, lex-yexax, lex-v6kmc, lex-pm93k]
scaffolds-from: [lex-pm93k]
evokes: [classify-uncertainty-by-cause, ue-uv-ur, technical-vs-political-vs-structural-uncertainty, response-type-depends-on-cause-type, pre-response-diagnostic, friend-strategic-choice-uncertainty-classification]
lineage:
  - source: primary
    text: rosenhead-mingers-2001-rational-analysis-for-a-problematic-world
    citation: "Jonathan Rosenhead & John Mingers (eds.), Rational Analysis for a Problematic World Revisited, 2nd ed. (John Wiley & Sons 2001), Ch.6 'The Strategic Choice Approach' (John Friend), pp.116-118 — the UE/UV/UR classification of uncertainty by cause-type and matching response-type."
    quote: "The strategic choice approach views the steering of any non-routine decision process as governed by perceptions of the relative importance to be attached to three broad types of uncertainty, each calling for a different type of response. These three categories of uncertainty can be introduced as follows: Uncertainties About Our Working Environment: UE for short — This is the kind of uncertainty that can be managed through responses of a relatively technical nature: by surveys, research investigations, forecasts, requests for detailed estimation of costs. The form of the response can range from an informal telephone conversation with an expert at one extreme, to the initiation of an elaborate exercise in mathematical modelling at the other. Uncertainties About Our Guiding Values: UV for short — This is the kind of uncertainty that calls for a more political response. This response might take the form of a request for policy guidance from a higher authority; a structured exercise to clarify declared objectives; or a programme of consultations among affected interests. Uncertainties About Choices on Related Agendas: UR for short — This is the kind of uncertainty that calls for a response in the form of further exploration of the structural links between the decision currently in view and others with which it appears to be linked."
  - source: practitioner
    text: friend-hickling-1997-planning-under-pressure
    citation: "John Friend and Allen Hickling, Planning Under Pressure: The Strategic Choice Approach, 2nd ed. (Butterworth-Heinemann 1997). The SCA core text where the UE/UV/UR uncertainty-by-cause-and-response classification is developed at full length. Tier-3 deepening source — Friend-Hickling 1997 PDF; the Rosenhead-Mingers Ch.6 verbatim above (Friend's own synthesis in the volume) supplies the canonical operational distinction this atom uses. The core text would deepen but not change the classification."
    quote: "[Tier-3 deepening source — Friend; the verified Rosenhead-Mingers Ch.6 verbatim (entry above) supplies the UE/UV/UR triad as Friend's own restatement of the SCA uncertainty-classification. The atom's indispensable claim rests on the verified verbatim, not on Friend-Hickling 1997 directly.]"
canonical-instances:
  - "engineering decision (UE-dominant): 'should we switch from PostgreSQL to a graph database for this workload?' The uncertainty is technical — about throughput, query patterns, schema-evolution. Response-type: benchmark, prototype, measure. Mistaking this for UV (e.g., treating it as a political-team-preference question) wastes consultation effort on something that empirical measurement could resolve."
  - "leadership decision (UV-dominant): 'should we restructure the team along product lines vs functional lines?' The uncertainty is values-laden — about what success looks like, whose priorities matter. Response-type: stakeholder consultation, objective-clarification, structured-debate. Mistaking this for UE (e.g., trying to A/B-test the restructure) misses that the question is about values, not measurable performance."
  - "product roadmap decision (UR-dominant): 'should we ship feature X now or wait until the platform-team's API stabilizes?' The uncertainty is structural — about cross-agenda dependencies. Response-type: cross-team coordination, link-mapping, scope-broadening. Mistaking this for UE (modeling 'when will the API stabilize') misses that the crucial question is about who-controls-the-dependent-decision."
  - "mixed-type situation: real situations often have UE+UV+UR layers. The diagnostic move is to identify the DOMINANT type per sub-question, not to assume a single type. A microservices-vs-monolith question might be UE for performance, UV for team-autonomy, UR for deployment-pipeline ownership. Each layer calls for its own response."
  - "Friend's resource-allocation insight: 'It is tempting for any set of decision makers, faced with a complex and seemingly intractable decision problem, to agree that all three kinds of uncertainty are significant, and so that all should be vigorously addressed. However, this is a counsel of perfection, ignoring the costs and delays incurred by initiating different kinds of response — which may also yield different levels of benefit.' The atom's discipline includes BUDGETING: classify the dominant cause-type per sub-decision and concentrate response-investment there."
  - "operationally distinct from lex-k6d7u credence-as-graded-belief: lex-k6d7u is about quantifying-belief-over-outcomes (epistemic granularity). This atom is the diagnostic-step PRIOR to belief-quantification — figure out the CAUSE of the uncertainty before quantifying anything. UE uncertainty often admits clean probability distributions (lex-k6d7u fires); UV uncertainty doesn't (probabilistic-treatment is category-error)."
  - "operationally distinct from lex-th6tr keep-options-open-under-radical-uncertainty: lex-th6tr is a decision-rule for the case where uncertainty cannot be resolved by any response-type. This atom fires earlier — if uncertainty IS resolvable via the matching response-type (UE→research, UV→consultation, UR→cross-agenda-coordination), do that first. lex-th6tr fires when the cause-classification produces 'no response-type can resolve this in time'."
  - "cardinal critical question: when is the cause-type itself contested? Sometimes a UV-question masquerades as UE (technical-disagreement covering value-disagreement) or vice-versa. The diagnostic move: when the proposed response-type doesn't reduce the uncertainty, suspect cause-misclassification. A 'we need more data' loop that doesn't terminate is often a UV mis-classified as UE."
critical-questions:
  - "what kind of uncertainty is this — aleatoric (random), epistemic (unknown), strategic (adversarial), or model-misspecification?"
  - "does the recommended response (more data, more thought, better model, defensive design) match the uncertainty type?"
  - "are you reaching for one tool (Bayesian updates, more sampling) when a different tool fits the actual cause?"
  - "could the uncertainty itself be misclassified — and is that itself a kind of uncertainty you've under-budgeted for?"
status: active
