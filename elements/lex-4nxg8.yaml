canonical-instances:
  - "A department that has always padded its budget estimates defends the practice as 'how things have always been done here,' and a new finance director ends the defense by asking what the department would even call it if a rival team started doing the exact same thing to steal resources from them."
critical-questions:
  - "Does this rebuttal actually work against every appeal to tradition, or only against cases where the tradition in question is itself clearly harmful — does it fail against customs that are merely unusual rather than damaging?"
  - "Is there a meaningful difference between the jackal's specific appeal to inherited custom and a more general claim that the behavior is simply natural to his kind, or do both defenses collapse under the same rebuttal?"
