lineage:
  - source: primary
    text: hyde-telling-a-navajo-coyote-story-without-its-medicinal-purpose-is-violence
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Introduction, discussing the folklorist Barre Toelken's account of Navajo Coyote storytelling. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Most important, Navajo Coyote stories are used in healing rituals. They are a kind of medicine. “Eye-juggler” is not just a critique of Coyote’s egotism; its telling also plays a role in any healing ritual intended to cure diseases of the eye. ... As entertainment, the story stirs up a fantasy of amusing disorder; as medicine, it knits things together again after disorder has left a wound. In fact, to tell the story without such moral or medicinal motives does a kind of violence to it, and to the community (so that the teller would be suspected of engaging in witchcraft)."
canonical-instances:
  - "A corporate wellness program adopts the outward form of an indigenous smudging ceremony as a stress-relief activity for employees, stripped of the community relationships, protocols, and spiritual purpose that made the original practice function, and members of the source community describe the adaptation as extraction rather than a lighter version of the same ritual."
  - "A therapy training program teaches a specific confession-and-release exercise borrowed from a religious tradition's actual sacrament, using the same words and structure but removing the theological framework that gave the original its healing function, and practitioners from that tradition describe the result as hollowed out rather than merely secularized."
critical-questions:
  - "Is the violation Hyde describes really about the functional purpose being removed, or could a story retain real medicinal effect for a community even when told by someone who doesn't understand or intend that function, making the 'violence' more about unauthorized telling than about missing purpose specifically?"
  - "Does this mechanism apply equally to practices adapted within the same broader culture, a corporate ritual borrowing from another corporate tradition, for example, or does it specifically require crossing into a tradition with its own defined ownership and permission structures, as Winnebago and Navajo myth-telling both have?"
  - "Is there a version of adapting a practice's form to a new context that preserves rather than violates its purpose, and what would distinguish a legitimate reinterpretation from the kind of hollowing-out this diagnostic warns against?"
