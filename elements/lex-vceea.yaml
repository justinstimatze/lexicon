id: lex-vceea
name: insincere-offerings-are-returned-not-quietly-accepted
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you're in a position to accept offerings, tribute, or gestures of goodwill from many people at once, don't treat outward compliance with the ritual as proof of sincerity -- sort what you receive by whether it was actually meant, and hand back what wasn't rather than banking it alongside what was. In Cushing's telling, the Sun-father receives a great tray of shell beads and turquoise sacrificed to him by people across the world, and doesn't accept them uniformly. He explains his method directly: 'I know the prayer and sacrifice that is meant, from the words and treasures of those who do but lie in addressing them to me, and speak and act as children in a joke.' The sincere gifts he keeps and actively reinvests: 'they are the gifts to me of good hearts and I treasure them that I may return them in good fortune and blessing to those who gave them.' The insincere ones he doesn't quietly pocket or publicly shame -- he casts them back into the waters 'that they may again be gathered up and presented to me,' giving the giver another chance to mean it, rather than either rewarding hollow ritual or permanently disqualifying whoever performed it once without meaning it. Diagnostic move: when you're accepting gestures of commitment, effort, or goodwill from many sources at once, resist the pull to treat uniform outward compliance as uniform sincerity -- sort for what's actually meant, quietly return what isn't without either rewarding it or punishing the giver permanently, and let the distinction do its work the next time the offering comes around."
