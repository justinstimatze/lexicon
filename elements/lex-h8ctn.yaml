    quote: 'the villagers do not know whether the sand-rope is to be thick or thin; send them a bit of the old rope, a span long or four fingers; this they will look at and twist a rope of the same size." If the king replied, "Sand-rope there never was in my house," they were to reply, "If your majesty cannot make a sand-rope, how can the villagers do so?'
canonical-instances:
  - "The same sage is later ordered to send the king a new pleasure-tank filled with lotuses grown wild in the forest; he sends men muddy and dripping to report the tank fled back to the forest and to ask for the king's own forest-caught tank to yoke alongside it in recapture, exposing that no such tank ever existed."
  - "The same sage is ordered to deliver a pregnant royal bull with its calf; he has a man weep at the palace gate claiming his own son cannot give birth after seven days of labor, and when the king calls this impossible, the man replies that this is exactly why a bull cannot calve either."
  - "A client demands a contractor deliver a building both cheaper than any competitor and finished twice as fast with no quality loss; the contractor asks the client to first name one other project anywhere that has ever met all three at once, and the client's inability to name one becomes the basis for renegotiating the demand."
critical-questions:
  - "This works because the demander holds enough institutional power that a subordinate can't simply refuse outright — does the mirrored counter-request still function against a demander who has no need to save face or maintain a reputation for reasonableness?"
  - "The tactic relies on the demander not noticing the trap until they've already denied the mirrored version — what happens when the demander is sophisticated enough to see the parallel coming and refuses to engage with the counter-request at all?"
status: active
