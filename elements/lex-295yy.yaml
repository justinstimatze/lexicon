id: lex-295yy
name: powerlessness-is-task-execution-without-authority-or-respectability
type-in: claim
type-out: structure
_tier: atomic
agent-instruction: "Recognize this pattern when the division of labor between those who 'plan' (professionals) and those who 'execute' (nonprofessionals) is producing an oppression distinct from exploitation: 'the powerless are those who lack authority or power even in this mediated sense, those over whom power is exercised without their exercising it; the powerless are situated so that they must take orders and rarely have the right to give them.' Young names three components beyond any income gap: lack of the 'expansive, progressive' orientation professional work carries, lack of day-to-day work autonomy, and denial of 'respectability' — the reflexive deference professional dress, speech, and credentials command in banks, restaurants, and bureaucratic encounters, denied by default to nonprofessionals (and demanded as proof, rather than granted by default, from women and people of color). 'These injustices have distributional consequences, but are more fundamentally matters of the division of labor.'"
related: [lex-s2uyr]
evokes: [powerlessness, task-planning-vs-task-execution, denial-of-respectability, professional-nonprofessional-divide, five-faces-of-oppression, iris-marion-young-1990]
lineage:
  - source: primary
    text: young-1990-justice-and-the-politics-of-difference
    citation: "Iris Marion Young, *Justice and the Politics of Difference* (Princeton, NJ: Princeton University Press, 1990), Chapter 2, 'Five Faces of Oppression,' the powerlessness section (pp. 56-58), plus the Introduction's division-of-labor framing (p. 8). One face of a five-part typology (see lex-s2uyr for the full typology and how the five faces relate)."
    quote: "'Nonprofessionals suffer a form of oppression in addition to exploitation, which I call powerlessness... The powerless are those who lack authority or power even in this mediated sense, those over whom power is exercised without their exercising it; the powerless are situated so that they must take orders and rarely have the right to give them... I have discussed several injustices associated with powerlessness: inhibition in the development of one's capacities, lack of decisionmaking power in one's working life, and exposure to disrespectful treatment because of the status one occupies. These injustices have distributional consequences, but are more fundamentally matters of the division of labor. The oppression of powerlessness brings into question the division of labor basic to all industrial societies: the social division between those who plan and those who execute.' [From the Introduction, on the division of labor as itself domination-enacting:] 'A hierarchical division of labor that separates task-defining from task-executing work enacts domination, and produces or reinforces at least three forms of oppression: exploitation, powerlessness, and cultural imperialism.'"
  - source: discovery-loop
    text: split-from-lex-s2uyr-young-five-faces-of-oppression
    citation: "Split out of lex-s2uyr (see lex-9z37e's discovery-loop entry for the full split rationale). The task-defining/task-executing division of labor is the shared mechanism this atom names alongside lex-9z37e (exploitation) and lex-qrfr5 (cultural imperialism) -- Young's Introduction states the same hierarchical division 'produces or reinforces at least three forms of oppression' -- so a single workplace hierarchy can be diagnosed against all three faces at once without any one reducing to the others: exploitation names the transfer-of-power effect, powerlessness names the authority/respectability denial to the executor, and cultural imperialism (when the executor's own communication norms get marked 'unprofessional') names the meaning-imposition effect."
canonical-instances:
  - "Powerlessness via the professional/nonprofessional division of labor: nonprofessionals 'must take orders and rarely have the right to give them,' lack the 'expansive, progressive' orientation of professional advancement, and are denied 'respectability' — the reflexive deference professional dress, speech, and credentials command in banks, restaurants, and bureaucratic encounters, which women and people of color 'must prove' before receiving at all, while working-class white men are often treated with respect until their working-class status is revealed."
critical-questions:
  - "Is the harm here reducible to income (in which case it's exploitation's mechanism, lex-9z37e), or does it persist even at equal pay — denial of decisionmaking authority, denial of the 'expansive, progressive' orientation professional work carries, denial of default respectability?"
  - "Would raising this group's pay, without changing who plans and who merely executes, actually resolve the oppression — or would the same take-orders-and-rarely-give-them structure simply persist at a higher wage?"
status: active
