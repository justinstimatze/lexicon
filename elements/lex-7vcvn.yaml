name: direct-help-toward-allies-who-can-convert-it-not-those-who-need-it-most
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When deciding which ally, partner, or cause to actually put resources behind, don't default to whoever asks, whoever is most loyal, or whoever needs it most -- Kautilya specifies a capacity filter measured against the ally's OWN prior track record, independent of how deserving or needy they are: 'For both the conqueror and the enemy, the ally to be specially helped is one who: (i) is able, i.e. starts a work he can complete; (ii) is sound, i.e. starts a work free from defects; (iii) is productive, i.e. starts a work producing good results; (iv) is resolute, i.e. works without stopping until it is completed; or (v) has devoted subjects who help him to finish the work, even with a little outside assistance.' The explicit converse closes the loophole that a loyalty- or need-based instinct would otherwise leave open: 'Allies who are not able, sound, productive, or resolute or without devoted subjects shall not be helped.' The reasoning names the payoff mechanism directly: 'Such allies, once they have achieved their objective, gladly give abundant assistance in return' -- help given to someone who can already execute converts into a completed result and a reciprocal debt, while the same help given to someone who lacks execution capacity has nothing to attach to and is likely spent on a venture that would have failed regardless of the assistance. The five qualities are all about the ally BEFORE your help arrives -- do they finish what they start, is their work clean, does it produce results, do they persist, does their own base already carry them most of the way -- not about how much they need outside support or how loyal they've been to you. Diagnostic move: before committing scarce help, effort, or capital to an ally, cause, or venture, assess their demonstrated capacity to execute independent of your assistance -- a small amount of help given to someone who can already mostly finish the job converts reliably into a result and a returned favor, while the same help given to someone who cannot execute regardless of support is help spent into a venture that fails with or without you."
