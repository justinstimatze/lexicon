    quote: "“The right to a process can be important in many contexts: for example, even if some authority can guess entirely accurately what I would most like to choose, my liberty may not be adequately respected if the authority bestows on me what I would have supposedly chosen, while denying me the right to choose for myself. ... On the other hand, a person's real freedom may actually link with outcomes as well. For example, in agitating for safe flights (and the freedom to survive air journeys), our focus may be on having competent (and non-suicidal) pilots who fly us safely, rather than obtaining for ourselves the freedom to choose to do whatever we would like to do in the cockpit. Similarly, if a person is keen to avoid some kind of meat -- pork or beef or duck or whatever -- to have the freedom to pick her own dish at a buffet, without being told which contains what, cannot be seen as vindication of her freedom to eat as she would like.”"
canonical-instances:
  - "Hypothetical: A software company responds to user complaints about invasive default settings by adding an opt-out toggle buried three menus deep, framing it as 'giving users the choice.' What users actually wanted was to not be tracked by default -- offering them a technically-available choice to fix it themselves is a different, lesser thing than the outcome they were asking for."
  - "Hypothetical: A hospital responds to patient complaints about confusing consent forms by adding more optional information sessions patients can choose to attend. What patients actually needed was a form written in plain language they could understand without having to opt into extra sessions -- the added 'choice' to seek clarification doesn't substitute for a form that was clear from the start."
critical-questions:
  - "Doesn't emphasizing outcomes over process risk sliding into paternalism -- deciding for people what they 'really' need instead of respecting what they choose? Sen guards against exactly this by keeping both halves of the claim: the authority that guesses correctly and hands someone their preferred outcome without letting them choose has also failed, just in the opposite direction. The diagnostic asks something narrower: check which one the person is actually asking for before assuming an offer of the other one counts as respecting their freedom."
  - "How do you tell whether a given right is a process right or an outcome right, if the same right can sometimes be either depending on context? There's no fixed rule -- the diagnostic is to ask the person or group making the claim what they're actually agitating for. Airline passengers demanding safety and a diner with a dietary restriction are both telling you plainly, in their own words, which one they need; the mistake is substituting the other one without checking."
