id: lex-v39j4
name: eikos-provisional-account-under-uncertainty
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When certainty isn't available, surface Plato's eikos — offer a provisional account, label it as such, and continue; demanding certainty before speaking can foreclose useful approximations."
related: [lex-abbes, lex-k6d7u, lex-rfxtb, lex-th6tr, lex-vmas8, lex-znaau]
scaffolds-from: [lex-rfxtb, lex-k6d7u]
evokes: [likely-story-while-better-is-unavailable, take-probability-as-the-rule, all-models-are-wrong-some-useful, working-account-as-honest-best-effort, commit-while-knowing-its-provisional]
lineage:
  - source: primary
    text: plato-timaeus-29-30-eikos-mythos
    citation: "Plato, Timaeus 29c-d (the canonical eikos / 'likely story' passage); Jowett translation in 2026-05-21. Timaeus is about to give a cosmogony — an account of the origin of the universe. Plato has him explicitly disclaim that any such account can be more than 'probable' (eikos) because the universe is in the realm of becoming, and we are mortals. The disclaim is NOT a refusal to give the account; Timaeus gives it. The disclaim is a posture about WHAT THE ACCOUNT IS — a likely-story (εἰκὼς μῦθος / eikos mythos), the best one can do, to be held provisionally and revised as warranted. The transferable primitive: when the domain forbids access to full truth (cosmogony, future, complex systems, historical reconstruction), COMMIT TO A WORKING ACCOUNT and proceed with it, while explicitly marking it as provisional. The posture combines (a) action (the account is given, proceeded with) with (b) epistemic humility (the account is named provisional). The pair is the operationally-load-bearing thing — neither paralysis-via-uncertainty nor false-certainty."
    quote: "[Plato, Timaeus 29c-d, Jowett translation 2026-05-21:] 'But what is spoken of the created image can only be probable; being is to becoming what truth is to belief. And amid the variety of opinions which have arisen about God and the nature of the world we must be content to take probability for our rule, considering that I, who am the speaker, and you, who are the judges, are only men; to probability we may attain but no further.' [Socrates responds:] 'Excellent, Timaeus, I like your manner of approaching the subject — proceed.' [Note: (a) the disclaim is explicit before any cosmogony is delivered; (b) the disclaim names the domain (created image / becoming) where eikos applies — i.e., not all domains require eikos posture, only those of becoming; (c) the disclaim is approvingly received and the account proceeds; (d) the closing 'to probability we may attain but no further' is the indispensable humility — we don't pretend to truth, but we don't abandon the inquiry.]"
  - source: practitioner
    text: cross-attestation-box-models-popper-scientific-method
    citation: "Cross-domain attestation: (a) George E. P. Box 1976/1979 'all models are wrong, but some are useful' — the modern canonical statement of the eikos posture in statistics/modeling, generalized to ALL model-building. (b) Karl Popper falsificationism — scientific theories are PROVISIONAL accounts that can never be conclusively verified, only corroborated by survived attempts at refutation; the scientific method IS the institutionalized eikos posture (commit provisionally, proceed, accept revision under evidence). (c) Bayesian inference under uncertainty — posterior probabilities are eikos-shaped: the best-current-estimate that updates with evidence. (d) Working-hypothesis tradition in clinical medicine — physicians act on best-current-diagnosis while explicitly leaving it open to revision. (e) Engineering design under irreducible uncertainty — the design is built on best-current-assumptions about future load / use / environment; the eikos posture is the alternative to either refusing to build OR pretending the assumptions are certain. Cross-domain attestation: statistics, philosophy of science, clinical practice, engineering."
    quote: "[Box 1979 'all models are wrong, but some are useful'; Popper LCR 1934/1959 falsificationism; Bayesian inference; medical working-hypothesis. The eikos posture is the institutionalized epistemic stance in any domain where (i) commitment-to-action is required and (ii) full truth-access is unavailable.]"
canonical-instances:
  - "George Box 1979 'all models are wrong, but some are useful': the canonical modern eikos statement. The statistician is explicitly disclaiming that any model can be fully true while NOT abandoning model-building. The pragmatic value lives in the gap between (i) refusing to model and (ii) overcommitting to a model. Box names that gap as eikos territory"
  - "Popperian science: scientific theories are PROVISIONAL accounts, never fully verified. The community proceeds with them while remaining open to refutation. The institutional structure of science (replication, peer review, retraction) IS the eikos posture made into a methodology"
  - "clinical working diagnosis: a physician treating an undifferentiated chief complaint acts on the most-likely diagnosis while ordering tests that could revise it. Treating only-after-certainty kills patients; treating without-revision-openness mistreats them. The clinical working-diagnosis IS the eikos posture in medicine"
  - "engineering design under irreducible uncertainty: the engineer building a bridge cannot know all future loads, weather, use patterns. The design commits to assumptions, proceeds with construction, and includes margin/monitoring for revision. Building only-after-certainty means never building; building without-margin means catastrophic failure when assumptions break. Eikos posture in engineering practice"
  - "machine-learning model deployment: a deployed model is the best-current-account of the input→output mapping. It will be wrong on some inputs (distribution shift, novel cases); the deployment posture is to commit to its predictions for routine cases while monitoring for failures and retraining on accumulated evidence. The MLOps discipline IS eikos institutionalized"
  - "historical reconstruction: a historian writing about a sparsely-documented era commits to a most-likely narrative based on the available evidence while explicitly marking ambiguities and competing interpretations. Refusing to write means losing the structuring effort; writing-as-if-certain means propagating false confidence. Eikos posture in historical scholarship"
  - "crucial critical question: when does eikos collapse into 'whatever' (loose belief without standards)? Discriminator: is the commitment REVISABLE under evidence? Genuine eikos commits with the explicit understanding that better evidence will revise; loose-belief commits without that revisability and uses 'it's just my view' to deflect challenge. The eikos posture INCLUDES the obligation to update; without that obligation it's not eikos, it's epistemic laziness"
  - "cardinal critical question: when is eikos the WRONG response to uncertainty? When the commitment is IRREVOCABLE and the cost of being wrong is catastrophic. Plato's Timaeus is a cosmogony — getting it wrong has no operational cost; the worst case is just a wrong story. For irrevocable / high-cost decisions (a major migration, a relationship commitment, a policy change with no rollback), keep-options-open (lex-th6tr) is the safer posture. The choice of eikos vs keep-options-open depends on the reversibility of the commitment, not just the level of uncertainty"
  - "operational complement to lex-th6tr keep-options-open-under-radical-uncertainty: the two atoms partition the response-to-uncertainty space. lex-th6tr = delay commitment; lex-v39j4 eikos = commit provisionally. The choice point is whether action requires commitment NOW (eikos) or can wait until more is known (keep-options-open). Both are legitimate; the wrong move is treating one as universal"
  - "operational adjacent to lex-k6d7u credence-as-graded-belief: credence describes the GRADED BELIEF an agent holds about a proposition; eikos describes the PRACTICAL POSTURE an agent takes when committing to an account. The two are tightly coupled — a 0.7-credence account taken as eikos becomes a working-account proceeded with; the same 0.7-credence taken as 'wait until 0.95' becomes a keep-options-open instance. Credence is the descriptor; eikos is one of the postures for acting on it"
  - "operational adjacent to lex-znaau premature-closure: eikos can DEGENERATE into premature-closure when the provisional-commitment-with-openness-to-revision becomes commitment-without-the-openness. The discipline that distinguishes them is the explicit marking of the account AS provisional. If the marking is dropped, eikos slides into premature-closure on the working account. Timaeus's disclaim before the cosmogony is the structural antidote"
  - "operational adjacent to lex-rfxtb multifactorial-frame: an eikos account is often multifactorial-frame's output — the analyst force-lists three causes, weights them, commits to the best-current-account as a working narrative. The multifactorial-frame discipline supports eikos honesty by ensuring the working account doesn't collapse to a single-cause story before the multi-cause options have been considered"
severity-tier: info
critical-questions:
  - "are you offering eikos because certainty is unavailable, or because you don't want to commit to a stronger claim?"
  - "is the audience hearing 'provisional' or 'definitive'? eikos can be mis-received as the latter"
  - "what would close the gap between eikos and certainty — and is closing it worth the cost?"
  - "is the provisional account being updated as new data arrives, or has it calcified into a working dogma?"
status: active
