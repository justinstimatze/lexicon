lineage:
  - source: primary
    text: hohwy-2014-the-predictive-mind
    citation: "Jakob Hohwy, *The Predictive Mind* (Oxford University Press, 2014), Chapter 7 ('Precarious Prediction'), sections 'Delusions and Expected Precisions' (p.157) and 'Autism and Expected Precisions' (p.161)."
    quote: "'Speciﬁcally, a persistent, exaggerated expectation for noise and uncertainty would lead to imprecise sensory prediction errors mediated by low gain on sensory input and heightened reliance on top-down priors. An individual who constantly expects the sensory signal to be noisier than it really is will then tend to be caught in his or her own idiosyncratic interpretations of the input and will find it hard to rectify these interpretations. This gives rise to the idea that psychosis and delusions stem from such faulty uncertainty expectations... Precision optimization is a natural focus for this generic account of delusion formation... It is also domain neutral in a specific sense: to assess the precision of a signal we need not know what it is a signal of. This means that the account of delusions is not tied to specific representational contents, and this can go some way to explain the very heterogeneous nature of psychotic symptoms... [On autism:] A perceiver who expects very precise prediction errors will increase the gain on bottom-up prediction error and will rely relatively more on the senses than on prior beliefs, as compared to a perceiver who expects the world to be somewhat more noisy... Described like this, the perceiver begins to fit the profile of sensory perception characteristic of the autism spectrum. There is a kind of enslavement by the senses, a pre-occupation with local sensory content, extended sampling, intolerance of change in circumstances, and lack of coherence under global models... I think this proposal is consistent with a recent proposal by Friston, Lawson and Frith (2013), who phrase it in the converse terms of increased imprecision of top-down predictions.' (Hohwy, *The Predictive Mind*, Ch.7, pp.158-163)"
canonical-instances:
  - "Hohwy's own delusion example, illustrating content-heterogeneity from one mechanism: patients who believe a doctor 'is out to get them,' or that they 'smell of faeces,' or — his example of a maximally bizarre case — that 'the Mafia have put a horse in their tooth,' are offered as instances of the SAME precision-miscalibration mechanism generating wildly different propositional content, because assessing signal-reliability doesn't require representing what the signal is about."
  - "The autism-profile mentalizing deficit: inferring another person's hidden mental state from behavior requires exactly the kind of flexible, context-sensitive, prior-guided inference that over-trusting raw sensory particulars undermines — Hohwy's example is interpreting 'Beer? You know where the fridge is!' which depends on multiple layered, non-literal top-down expectations rather than a one-to-one mapping from words to meaning."
  - "The prediction that both profiles worsen specifically under RISING uncertainty: delusion-prone systems should lean further into priors as ambient uncertainty increases (worsening reality-testing precisely when it's most needed), while over-precise systems should keep extending sensory sampling even as the payoff drops — both are the SAME dial, pushed further toward its already-mis-set position, which is a distinguishing, checkable prediction rather than a post-hoc description."
critical-questions:
  - "Is this just a redescription of the clinical symptoms in jargon, or does it make a risky prediction? The account predicts a specific asymmetry that ordinary symptom description doesn't: because both profiles trace to ONE parameter, manipulating ambient uncertainty (not directly touching the symptom domain) should differentially worsen each profile in the predicted direction — a risky, checkable prediction, not a mere re-labeling of 'has delusions' and 'is sensory-particularist.'"
  - "Doesn't this oversimplify two extremely heterogeneous clinical categories (schizophrenia, autism spectrum) into a single dial? Hohwy is explicit this is a partial, mechanism-level account of SPECIFIC symptom clusters (delusion formation; weak central coherence / mentalizing deficits) within each condition, not a complete etiological theory of either disorder — both conditions have contributing factors (genetic, developmental, dopaminergic/noradrenergic in psychosis) this atom's mechanism doesn't claim to subsume; the atom names the precision-imbalance CONTRIBUTION, not the whole clinical picture."
  - "Why would the SAME organism-level system ever mis-set this dial in either direction — what would cause over- versus under-estimation of noise? Hohwy connects the delusion-direction to dopamine/norepinephrine dysregulation research (Fletcher & Frith 2009; Corlett et al. 2010) affecting the neural gain-control on prediction-error units, and notes the autism-direction has been independently proposed (Friston, Lawson & Frith 2013) in the converse framing (imprecise top-down predictions rather than over-precise bottom-up ones) — the theory doesn't yet fully explain WHY a given individual's dial gets mis-set in one direction rather than the other, which the atom should be applied with that gap flagged, not treated as fully closed."
  - "Could 'precision' just be doing the explanatory work that a vaguer term like 'confidence' or 'trust' already did, without adding predictive content? The specific contribution is TREATING precision as a second-order, separately-optimized statistical quantity (estimating the reliability of a signal is a distinct computation from estimating the signal's content, 'akin to estimating variance' as opposed to 'akin to estimating the mean') — this generates the DOMAIN-NEUTRALITY prediction (heterogeneous delusion content from one mechanism) that a generic 'confidence' notion, without the mean/variance-estimation structure, would not obviously predict."
  - "why one atom covering both clinical directions rather than two: the SHARED lever and its bidirectionality is the load-bearing insight — a single mis-settable dial producing two clinically opposite profiles is a more general, more reusable pattern than either direction alone. Operationally distinct from lex-2kjmb organisms-minimize-surprise-by-acting-or-by-updating-beliefs: lex-2kjmb is the same underlying free-energy-minimization framework but stays at the general-objective level; this atom is the specific claim about what happens when the precision-estimation sub-mechanism is chronically mis-set, in either direction."
