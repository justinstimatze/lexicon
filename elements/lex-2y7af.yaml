id: lex-2y7af
name: naming-no-one-traps-the-accused-between-silence-and-self-outing
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you need to discipline or warn someone whose status places them beyond direct confrontation, check whether an indirect accusation through analogy denies them any safe response. The 36 Stratagems' 'Point at the mulberry tree while cursing the locust tree' names the trap precisely: 'To discipline, control, or warn others whose status or position excludes them from direct confrontation, use analogy and innuendo. When names are not used directly, those accused cannot retaliate without revealing their complicity.' The accuser gains deniability by never naming the target. The target, meanwhile, is left with only costly moves: staying silent lets onlookers infer guilt on their own, and objecting confirms exactly who the accusation was aimed at."
related: []
evokes: [36-stratagems, point-at-the-mulberry-tree, indirect-accusation, forced-choice-between-silence-and-self-outing]
