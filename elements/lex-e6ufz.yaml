id: lex-e6ufz
name: shared-ritual-participation-manufactures-a-collective-blind-spot
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an attacker needs to disable several potential victims at once, converting a genuinely appealing, voluntary, communal activity into the vulnerability itself can work better than force or a lie about intent. In the Dakota tale of Unktomee and the ducks, the trickster invites willing guests into a shared dance, then makes the dance's own rule — 'shut your eyes or you'll get red eyes' — the mechanism that disables every victim simultaneously, with a folk taboo doing the enforcement work a guard or lock would otherwise need to do. What the victims never see coming isn't Unktomee's presence; it's the cost hidden inside the rule they've all agreed to follow, and their own conformity to that rule synchronizes everyone's vulnerability at once."
evokes: [eastman, wigwam-evenings, unktomee, dakota-trickster, ritual-as-vulnerability]
lineage:
  - source: primary
    text: eastman-1909-wigwam-evenings-unktomee-and-his-bundle-of-songs
    citation: "Charles A. Eastman (Ohíye S'a) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Ninth Evening: Unktomee and His Bundle of Songs.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "Willingly Unktomee threw down his load upon the lake shore, and with the utmost good nature began to build a little teepee of sticks, thatching it with the dry grass. In a few minutes it was done, and he kindly invited the ducks to enter. ... Unktomee was there, too. He stayed by the door, and began to sing: 'Ishtogmus wachee po! Tuwa etowan kin Ishtah ne sha kta!' (Dance with your eyes shut! Whoever looks shall have red eyes!) Every one of the foolish Ducks shut his eyes tight, and Unktomee, as he sang, quietly seized one after another by the neck as they danced in a ring around the teepee, wrung their necks quickly and cast them behind them."
canonical-instances:
  - "The specific risk Unktomee takes on: he builds the shelter himself, issues a genuine invitation, and sings the rule openly rather than hiding his presence. The deception lives entirely in what the rule does once obeyed."
  - "operationally distinct from the corpus's dense con-artist and fraud cluster (Santoro, Huston, Matulich), which all work by a false claim about facts or intent: Unktomee never lies about anything the ducks could check — he really did build a teepee, really did invite them to dance. The deception lives entirely in what the rule does, in a genuine activity, rather than in any false representation of the activity itself."
critical-questions:
  - "What makes a taboo-enforced blind spot more effective for disabling multiple targets at once than physical restraint would be — is it that no single victim can verify what's happening to the others without breaking the rule themselves?"
  - "Does this generalize past mythology to any shared ritual, protocol, or game whose own rules happen to synchronize a vulnerability — a 'don't look' social norm, a trust exercise, a shared moment of collective distraction — without anyone needing to actively enforce compliance?"
  - "How would a wary participant detect that a ritual's own rule, not a lie about the ritual, is the actual danger, when the invitation is genuine and the activity really is what it claims to be?"
status: active
