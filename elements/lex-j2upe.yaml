id: lex-j2upe
name: accept-the-shortchange-while-weak-and-collect-double-once-the-tables-turn
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a more powerful partner shortchanges you on a deal you can't currently contest, don't treat visible acceptance as the end of the matter -- Kautilya prescribes concealing the grievance now and converting it into a compounding, delayed claim to be collected once the power balance shifts. 'If the stronger ruler is not upright, the king shall quickly withdraw under some pretext, when the work has been done... Even if the king receives a small share, or even no share, from the stronger king, he shall go away with a [seemingly?] content look. Later, when the stronger king comes under the king's power [for any reason] twice the loss shall be exacted.' Two separate moves are being made here, not one. The first is purely defensive and immediate: display contentment rather than resentment, because visible anger while you're still the weaker party invites further exploitation or retaliation with no offsetting benefit -- you can't currently enforce a complaint, so voicing one only costs you something for nothing. The second is active and delayed: the shortchange is recorded as a debt, not forgiven as a loss, and the debt is deliberately set to compound -- not simply recovered but doubled -- once your position and the stronger party's happen to reverse for any reason, not necessarily one you engineered yourself. The doubling is the tell that this isn't really about fairness or restoring what was owed; it's a structural deterrent aimed at every FUTURE stronger partner watching how this one gets treated once weak, making exploitation of a temporarily weaker partner a worse long-run bet for anyone who might consider it. Diagnostic move: when you're on the losing end of an unequal deal you have no current power to contest, separate the question of how to act now (conceal frustration, since displaying it costs you and gains nothing) from the question of whether the grievance is settled (it isn't -- record it as a debt against a future reversal of fortune, and set the terms of that eventual collection now, while the memory and the specifics are still clear, rather than deciding what's fair only once you're finally in a position to act)."
