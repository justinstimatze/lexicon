id: lex-62ej3
name: cross-cultural-political-variation-traces-to-variation-in-the-source-model
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a political attitude shows up in one country's conservatism but not in an otherwise-similar country's conservatism, look for the difference in the underlying source model being projected, not in the political ideology's own structure. Lakoff's puzzle: American conservatives resent and sometimes hate their own federal government in a way that French, Italian, Spanish, Israeli, and Japanese conservatives, running versions of the same Strict Father politics, generally don't. The general Nation-As-Family metaphor and the general Strict Father framework are the same across all these countries. What differs is a specific clause inside the American version of the Strict Father family model itself: American children, once mature, are expected to be left completely alone by their parents, and 'any parental meddling or interference is strongly resented' -- a clause largely absent from the Strict Father family models of those other countries. Project that one clause through the identical Nation-As-Family metaphor and you get a government that is expected to leave mature citizens alone, with any intervention read as illegitimate meddling. The national peculiarity in the politics isn't explained by anything peculiar about American conservative ideology -- it's explained by something peculiar sitting one level down, in the family model the ideology is built from. Diagnostic move: when a political attitude varies across otherwise-similar cultures using the same general ideological framework, check the framework's underlying source model for a locally specific addition before concluding the ideology itself differs."
related: []
evokes: [george-lakoff, moral-politics-1996, principle-of-local-knowledge, american-exceptionalism, strict-father-family-model]
lineage:
  - source: primary
    text: lakoff-1996-american-clause-not-found-elsewhere
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 16 'How Can You Love Your Country and Hate Your Government?' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Such a clause is not usually found in Strict Father models in most other countries—not in France, or Spain, or Italy, or Israel, or Japan. If we project this clause back onto the nation, using the Nation As Family metaphor, here’s what it becomes: Mature citizens have to sink or swim by themselves. Citizens are on their own and have to prove their responsibility and self-reliance. They have become the leaders in their own family units (or local communities). They have to, and are competent to, make their own decisions. They have to protect themselves and their families (or communities). They know what is good for them better than their government, which is distant from them. A good government does not meddle or interfere in their lives. Any governmental meddling or interfering is strongly resented.”"
canonical-instances:
  - "The direct textual anchor, on the specific political principle this one clause generates once projected: 'What is explained is more than just antipathy to government \"meddling.\" It is the Principle of Local Knowledge—that local governments always know better than the distant federal government how to spend their money.'"
  - "Hypothetical: a researcher studying corporate cultures notices that tech companies in one country's startup scene are unusually resistant to any headquarters oversight of local branch offices, while an otherwise similar startup culture in a neighboring country readily accepts centralized direction. Both cultures share the same general 'flat hierarchy, move fast' management ideology. The difference traces back to each country's own folk model of family independence. One culture expects grown children to run their own households with zero parental input; the other assumes ongoing extended-family consultation well into adulthood. The identical organizational metaphor inherits whichever family norm is locally on offer, which is why it produces opposite expectations about home-office involvement in the two places."
critical-questions:
  - "Lakoff offers no independent evidence that this specific family-model clause is actually more prevalent in American culture than in the comparison countries, beyond the political difference it's meant to explain. Without a way to measure the clause's prevalence in family life directly -- surveys of actual parenting attitudes, say -- is this explanation checkable, or does it risk reading the political effect backward into an assumed cause?"
  - "If the explanation is right, immigrant communities in the United States whose family models don't include this leave-mature-children-alone clause should show measurably less of the specific anti-government-meddling attitude even when they otherwise adopt conservative politics. Does that prediction actually hold, and would it be a fair test of the mechanism or too confounded by other factors (generation, region, religion) to isolate cleanly?"
status: active
