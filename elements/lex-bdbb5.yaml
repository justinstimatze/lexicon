lineage:
  - source: primary
    text: vingerhoets-2013-why-only-humans-weep
    citation: "Ad Vingerhoets, *Why Only Humans Weep: Unravelling the Mysteries of Tears* (Oxford University Press, 2013), discussing Oren Hasson's appeasement/honest-signal theory. Ch.2 ('Towards a New Explanation of Human Tears') surveys eight prior evolutionary explanations for emotional tears and introduces Hasson's account (p.27) as the final and most developed of them, grounded in Amotz and Avishag Zahavi's handicap principle. Ch.6 ('The Social Effects of Tears', 'Tears and aggression', p.128) restates and extends the mechanism with the cross-species submission-cue parallel and James Blair's violence inhibition mechanism. Ch.6 ('The Work Setting', p.119) documents the social-enforcement corollary of the honest-signal claim: perceived 'fake' tears provoke unusually strong disapproval. The chapter's conclusion (p.135) restates the honest-signal claim as the chapter's bottom line, immediately followed by the qualification that observer reactions to tears are conditional on perceived appropriateness, not guaranteed."
    quote: "[Hasson's core claim, Ch.2 'Hasson: appeasement and trust', p.27:] 'In the final attempted explanation, the Israeli evolutionary biologist Oren Hasson emphasized the fact that tears blur our vision, thus seriously interfering with the human capacity to effectively demonstrate aggression (Hasson, 2009). This is why tears, according to Hasson, have developed into an honest signal to others that the crier will do no harm. The perception of someone as not being threatening may subsequently have a positive effect on others—the tears serve as a \"white flag\", and in doing so they fulfill an appeasement function and facilitate social bonding. This is a fairly straightforward and attractive theory, and Hasson's theory that appeasement, the display of social trust, and a need for attachment play a crucial role seems very plausible. However, I have doubts about the validity and necessity of his \"handicap\" hypothesis. In addition, the question again arises as to why other primates could not have benefited from such a development.' [The handicap-principle restatement and cross-species parallel, Ch.6 'Tears and aggression', p.128:] 'As already mentioned, the evolutionary biologist Oren Hasson has specifically emphasized the aggression-reducing effects of tears (Hasson, 2009). Central to his explanation is the handicap hypothesis, according to which the blurring of one's vision by tears signals to others that one does not have any aggressive tendencies oneself, and so has the effect of making them less aggressive. Such a mechanism exists in most, if not all, social animal species. For example, dogs bare their throats when being attacked by a stronger opponent. Such submission cues quickly result in the inhibition of the aggressive behavior of the assaulter. The British neuroscientist James Blair has proposed a functionally analogous mechanism in humans, namely the violence inhibition mechanism (VIM), which is hypothetically activated specifically by non-verbal communications of distress (Blair, 1995). Crying, of course, might be considered the prototype.' [The counter-evidence that crying can also provoke aggression rather than inhibit it, same section:] 'However attractive and plausible the hypothesis that tears inhibit aggression might be, the fact is that there is also strong evidence demonstrating just the opposite—that crying stimulates aggression in others. In a recent study from the Netherlands, 4.2-7.0% of the parents of 6-month-old infants reported having smothered, slapped, or shaken their baby at least once because of its crying (Reijneveld et al., 2004). The risk of such behavior was particularly high when the infant's crying was perceived as being excessive. This is also true for adults. For example, an analysis of police and court reports of rape cases demonstrated that crying during an attack led to a significant increase, rather than a decrease, in the amount of physical violence used, resulting in more physical injuries (Ullman and Knight...).' [The social-enforcement corollary of the honest-signal claim, Ch.6 'The Work Setting', p.119:] 'It is not acceptable for crying, which is assumed to be an honest signal, to be misused. Individuals who \"fake\" tears in order to achieve some aim may expect very negative reactions and disapproval. Observers may perceive \"pseudo\" tears as a kind of emotional blackmail.' [The book's conclusion restating the honest-signal claim as the bottom line, p.135:] 'The reason why tears have such a strong power to influence others is that they are regarded as an honest signal. Probably this is also the very reason why perceived \"misuse\" of tears can elicit such extremely negative reactions.'"
  - source: discovery-loop
    text: distinctness-audit-hasson-appeasement-tears-vs-costly-signaling
    citation: "Lex-0318 (costly-conspicuous-waste-as-status-signal, Veblen/Zahavi) is the substrate's general costly-signaling/handicap-principle atom, already citing Zahavi's peacock-tail handicap principle as a canonical instance. Hasson's mechanism is a genuinely distinct instance rather than a restatement: lex-5kjya's cost is paid in resources (energy, wealth, time, survival-odds) over a permanent or ongoing trait or display, to demonstrate a stable underlying capacity (genetic quality, wealth, productivity) for selection, allocation, or status purposes, with a typically positive signal polarity (I have capacity X). Hasson's mechanism, by contrast, is a real-time functional sensory impairment paid only while the signal is actively being produced, demonstrating an immediate behavioral disposition (non-aggression, not a stable trait), with inverted polarity (I lack the capacity to harm you right now) serving an appeasement or de-escalation function rather than status or mate-selection. Lex-0327 (differential-mating-success-is-a-selection-regime-distinct-from-survival) grounds sexual selection as a specific biological regime that generates costly signals for mate choice; Hasson's mechanism is a different regime again — conflict-reduction and appeasement, not mating. Lex-0170 (cheap-talk) is the direct contrast-partner this atom's mechanism is explicitly built against: a verbal non-aggression claim is cheap talk, and Hasson's account of tears is the specific move of showing how a real physical cost upgrades an identical-content claim into a credible signal."
canonical-instances:
  - "Hasson's core claim: tears blur vision, which 'seriously interfer[es] with the human capacity to effectively demonstrate aggression,' converting crying into 'an honest signal to others that the crier will do no harm' — the tears function as a 'white flag' that 'fulfill[s] an appeasement function and facilitate[s] social bonding.'"
  - "The cross-species submission-cue parallel Vingerhoets draws directly: dogs baring their throats to a stronger opponent, a submission cue that 'quickly result[s] in the inhibition of the aggressive behavior of the assaulter' — and James Blair's proposed human-specific 'violence inhibition mechanism (VIM)... activated specifically by non-verbal communications of distress,' of which crying 'might be considered the prototype.'"
  - "The social-enforcement corollary: because crying is 'assumed to be an honest signal,' counterfeiting it draws disproportionately harsh social punishment rather than mere disbelief — 'Individuals who \"fake\" tears in order to achieve some aim may expect very negative reactions and disapproval. Observers may perceive \"pseudo\" tears as a kind of emotional blackmail.' The intensity of the backlash against faking is itself evidence the signal is treated as costly, not cheap."
  - "The documented failure case, which caps the atom's claim rather than undermining its core mechanism: crying does not reliably produce appeasement in the observer. Dutch parents of 6-month-olds reported having 'smothered, slapped, or shaken' their infant specifically because of its crying, with risk highest when the crying was perceived as 'excessive'; police and court records of rape cases found that a victim's crying during an attack was associated with 'a significant increase, rather than a decrease, in the amount of physical violence used.'"
  - "A modern cross-domain analogue responsibly extending Hasson's argument rather than drawn from Vingerhoets' text: in a tense confrontation, a party who visibly sets down a weapon, sits down when standing gave them a physical advantage, or otherwise voluntarily and verifiably reduces their own capacity to act aggressively is deploying the same honest-signal structure — the self-imposed capacity-reduction, not the verbal claim of peaceful intent, is what a still-hostile actor would be unwilling to pay."
critical-questions:
  - "Is the cost being paid a REAL, in-the-moment functional impairment (as with tears actually blurring vision) or merely an asserted or performed cost — i.e., has ordinary cheap talk (lex-c7pga) been dressed up as a costly, honest signal without an actual, verifiable capacity-reduction behind it?"
  - "Is the claim being invoked Hasson's contested MECHANISM (self-imposed sensory impairment specifically explains why tears are honest) or the broader, more securely plausible FUNCTION claim (appeasement, trust, and attachment play a role in crying) that Vingerhoets explicitly separates and treats with different confidence?"
  - "Is the signaled content a stable, underlying quality being demonstrated for a selection or status audience (reach for lex-5kjya or lex-ymvt4) or an immediate, real-time non-aggression/vulnerability disposition being demonstrated for an appeasement or trust-building purpose (this atom)?"
  - "Is it being assumed that the honest signal automatically produces a calming or appeasing response in the observer? Vingerhoets' own evidence shows self-imposed vulnerability can also provoke escalation rather than de-escalation, depending on the observer's state and their judgment of whether the display is contextually appropriate."
  - "Vingerhoets' own open question: if this mechanism is adaptive, why did it apparently evolve only in humans and not in other primates who face comparable social and predation pressures? Treat this as an acknowledged gap in the theory, not a resolved point."
status: active
