lineage:
  - source: primary
    text: henrich-2015-secret-of-our-success-ch4
    citation: "Joseph Henrich, *The Secret of Our Success: How Culture Is Driving Human Evolution, Domesticating Our Species, and Making Us Smarter* (Princeton University Press 2015), Ch.4 'How We Got Our Cultural Brain' + Ch.8 'Prestige, Self-Domestication, and Honor' (pp.117-128 esp.). Henrich develops prestige as a SECOND-ORDER cultural-learning mechanism: naive learners cannot directly evaluate competence in many domains, so they use the convergent-attention-of-other-learners as a heuristic for who-to-copy. The chapter assembles four lines of evidence: (1) ethnographic observation of prestige-deference in egalitarian hunter-gatherers (A.R. Radcliffe-Brown's 1906-08 Andaman Islands fieldwork, replicated in lowland Amazonia and elsewhere); (2) the Krakauer 1996 *Into Thin Air* description of Rob Hall's prestige on Mt. Everest, used to defuse Sherpa labor disputes outside his climbing competence — substrate-illustration of cross-domain spillover; (3) experimental MBA investment-game studies showing that copying-the-successful is robust even when the success signal is noisy and incentives are strong; (4) the Larry-King-Live vocal-frequency analysis (Gregory & Webster 1996) showing automatic frequency-matching toward higher-prestige interlocutors. The cumulative-cultural-evolution framing: prestige attention-cues evolved BECAUSE human cumulative culture required learners to find good models in a high-noise environment, and the convergent-attention-of-others is one of the cheapest available signals of model-quality. The primary research paper for the prestige-bias-as-domain-tracking mechanism is Henrich & Gil-White 2001, 'The Evolution of Prestige: Freely Conferred Deference as a Mechanism for Enhancing the Benefits of Cultural Transmission' in *Evolution and Human Behavior* 22(3): 165-196, which distinguishes PRESTIGE (freely-conferred deference based on perceived competence) from DOMINANCE (deference extracted under threat of agonistic harm) and shows that the two attention-mechanisms have distinct behavioral and physiological signatures. The transferable claim — high-prestige models attract cross-domain copying even when their prestige tracks only one domain — is the central operational primitive. Henrich 2015 Ch.4 builds on Boyd & Richerson 1985 *Culture and the Evolutionary Process* dual-inheritance framework; the prestige-bias variant is one of several content-biased and model-biased cultural-learning mechanisms the broader research program identifies. Distinct from lex-hbgcb (social-proof-as-action-signal) in being the evolutionary-mechanism explanation for why social-proof works; distinct from lex-u6sw3 (high-fidelity-copying) in being the model-selection layer rather than the copying-fidelity layer; distinct from lex-hbanm (social-influence-amplifies-both-inequality-and-unpredictability-of-cultural-market-success) in being the cognitive-architecture explanation rather than the observed-population-distribution claim."
    quote: "[Henrich 2015 Ch.4:] 'In weighting the importance of those they can potentially learn from (hereafter their *models*), individuals should combine cues related to the models' health, happiness, skill, reliability, competence, success, age, and prestige, as well as correlated cues like displays of confidence or pride.' [Ch.4 on the spillover mechanism:] 'Since many model-based cues, such as success and prestige, are only loosely tied to particular domains of behavior, such as hunting or golf, we expect them to influence learning about a broad spectrum of cultural traits, ranging from preferences for food, mates, wine, and linguistic labels to beliefs about invisible agents or forces, like gods, germs, angels, karma, and gravity.' [Ch.8 on the if-in-doubt-copy-it heuristic:] 'A naïve learner can't tell all the causal links between an individual's practices and his success... As a consequence, learners often copy their chosen models broadly across many domains. Of course, learners may place more weight on domains that for one reason or other seem more causally relevant to the model's success. This copying often includes the model's personal habits or styles as well as their goals and motivations, since these may be linked to their success. This \"if in doubt, copy it\" heuristic is one of the reasons why success in one domain converts to influence across a broad range of domains.' [Ch.8 on the prestige-evolved-from-cultural-learning argument:] 'Once humans became good cultural learners, they needed to locate and learn from the best models... humans reliably develop emotions and motivations to seek out particularly skilled, successful, and knowledgeable models and then are willing to pay deference to those models in order to gain their cooperation (pedagogy), or at least acquiescence, in cultural transmission.' [Ch.8 on the Paris-Hilton-effect runaway:] 'An initial media exposure, accidental or by design, creates attention cues that cause people to unconsciously perceive someone as a worthy model... This shift can then create a feedback loop, as the media continues to cover those who people want to know more about, and a celebrity is born—seemingly from nothing.'"
canonical-instances:
  - "ROB HALL ON MT. EVEREST: Krakauer's 1996 *Into Thin Air* opens with Rob Hall's prestige at Everest Base Camp. Hall was first-among-equals because of climbing accomplishment, but his prestige extended FAR beyond climbing competence — he was consulted to mediate Sherpa labor disputes, business disagreements, and personal advice. The substrate-illustration is the cross-domain spillover: prestige earned via demonstrated climbing competence transferred to authority on labor relations, an entirely different domain. The fatal closure of the case is that Hall stayed behind on the mountain to save a weakened climber, exhibiting the prosocial behavior that prestige attracts and amplifies — but the substrate-claim is independent of the outcome"
  - "CELEBRITY ENDORSEMENT INDUSTRY: LeBron James paid millions to endorse State Farm Insurance; Michael Jordan wore Hanes; Tiger Woods drove Buicks; Beyoncé drinks Pepsi. The connection between musical or athletic competence and insurance/underwear/cars/colas is zero. The endorsement industry monetizes the cross-domain spillover of prestige cultural-learning cues. Henrich Ch.8 makes the transferable claim: this is not consumer irrationality, it is a side-effect of an evolutionarily adaptive cultural-learning mechanism applied to environments (mass media, novel product categories) that did not exist when the mechanism evolved"
  - "ANGELINA JOLIE BRCA1 OP-ED: Jolie's single 2013 *New York Times* op-ed describing her decision to get a preventive double mastectomy after learning she carried a BRCA1 mutation flooded clinics from the UK to New Zealand with women seeking genetic screening for breast cancer. The substrate-illustration: a single high-prestige actor's public choice propagated faster and more broadly than years of medical-education campaigns on the same topic. The public-health implication: prestige-bias is an underutilized public-health tool if the high-prestige actor's recommendation tracks competent medical advice; an underregulated hazard if it does not"
  - "ACADEMIC CITATION PATTERNS: a paper from a high-prestige institution or by a high-prestige author gets cited more broadly than a paper of equivalent quality from a lower-prestige source. The cross-domain spillover: a researcher who established competence in domain X gets quoted as an authority on domain Y at academic conferences where their actual expertise is loose. The discipline is to ask, for each citation chain, whether the cited authority's prestige is from EXPERTISE-IN-THE-CITED-DOMAIN or from spillover via cultural-learning attention-cues"
  - "SOFTWARE ENGINEERING TASTE PROPAGATION: a respected senior engineer's coding style, library preferences, vim-vs-emacs choice, deployment-tool selection, and even their tone in code reviews propagate beyond the architectural decisions that earned the respect. New hires adopt the senior's aesthetic preferences as if they were technical decisions. The substrate-illustration of within-organization prestige-bias spillover; the practitioner-discipline is to label which propagated practices are domain-competence-grounded and which are aesthetic-mimicry"
  - "operationally distinct from lex-hbgcb social-proof-as-action-signal: lex-hbgcb names the HEURISTIC at the behavioral level — when others do X, treat X as informative. lex-z7kgm names the EVOLUTIONARY MECHANISM that grounds the heuristic — cultural-learning needed model-selection cues, and prestige (convergent attention of other learners) is the cheapest available proxy for model-quality. lex-hbgcb is the procedural rule; lex-z7kgm is the substrate-architecture explanation. They compose: the social-proof signal in lex-hbgcb is itself one of the prestige-cues in lex-z7kgm"
  - "operationally distinct from lex-u6sw3 high-fidelity-copying-of-causally-opaque-steps: lex-u6sw3 is the COPYING-FIDELITY layer of cultural learning (when copying, copy broadly and faithfully). lex-z7kgm is the MODEL-SELECTION layer (when copying, copy from prestige-cued models). They compose tightly — Henrich's full cumulative-cultural-evolution argument requires BOTH: choosing the right model (lex-z7kgm) AND copying that model faithfully even on causally-opaque steps (lex-u6sw3). Distinct primitives at distinct cognitive layers"
  - "operationally distinct from lex-hbanm social-influence-amplifies-both-inequality-and-unpredictability-of-cultural-market-success (Salganik-Dodds-Watts 2006): lex-hbanm is the OBSERVED-POPULATION-DISTRIBUTION CLAIM — when copying is allowed, success becomes more unequal and less predictable. lex-z7kgm is the COGNITIVE-ARCHITECTURE CLAIM — humans evolved to use prestige (convergent attention) as a model-selection cue. lex-hbanm documents the macro-pattern; lex-z7kgm names the micro-mechanism. They compose: the lex-z7kgm prestige-bias is part of why the lex-hbanm cultural-market amplification happens"
critical-questions:
  - "the spillover audit: when you find yourself about to copy a prestigious actor in domain X, ask EXPLICITLY: is this person prestigious BECAUSE of the X-relevant competence I am inferring, or is X a spillover domain where their prestige propagated via cultural-learning attention-cues? The answer determines whether the copy is bandit-optimal under causal opacity or just spillover-noise"
  - "the prestige-source-audit: for a community converging on a high-prestige model, walk back the prestige to its pivotal source. What was the demonstration-of-competence that originally earned the prestige? Has the spillover propagated FAR from that source? If a celebrity's prestige came from athletic performance and the spillover is now driving political opinion, the spillover is structurally further from competence than spillover within one degree (athletic → endorsement of athletic-adjacent products)"
  - "the runaway-attention diagnostic: is the prestige under examination grounded in demonstrated competence, or is it a runaway attention-cascade where the prestige itself manufactured the attention that manufactured more prestige (the Paris-Hilton-effect, lex-hbanm's cultural-market amplification)? Diagnostic markers: when did the prestige emerge? How explicit is the initial competence demonstration? Is the prestige stable across observers who saw the competence demonstration vs observers who only saw the prestige?"
  - "the asymmetric-cost calibration: for a given prestige-based copying decision, what is the cost of WRONG-COPYING (following spillover prestige into a domain where it does not track competence) vs the cost of NOT-COPYING (refusing to use a generally-reliable cultural-learning signal)? Under high causal opacity and low individual reasoning capacity, copying-the-prestigious is often the right move; under low opacity and competent individual reasoning, copy-from-competence-not-from-prestige is the move"
  - "the dual-deference distinction: is the deference being paid to this person FREELY CONFERRED (prestige, per Henrich-Gil-White 2001) or COERCED (dominance)? The two attention-mechanisms have distinct cognitive substrates and produce different copying patterns — freely-conferred deference produces broad cross-domain copying via cultural learning; coerced deference produces compliance under observation but reverses when the observer is absent. The diagnostic helps separate prestige-bias signals from compliance signals when reading a community"
status: active
