id: lex-4jnsz
name: following-a-parent-into-their-exact-field-delays-commitment
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone has every objective advantage for entering an occupation, role, or field their parent already occupies — direct exposure, insider information, a ready-made identity to step into — do not assume this advantage speeds up their commitment. Rogoff found the opposite among doctors' sons who delayed showing interest in medicine until adolescence: 'Doctors' sons who, for whatever reasons, postponed any interest in their fathers' calling until the (for them) relatively late age of 14 or older actually took longer to decide than others who first considered medicine at the same time. They averaged 3.6 years until they were ready to commit themselves, as opposed to 2.7 years for students from other occupational origins.' Her interpretation: 'For the sons of doctors who do go into medicine, it is as though their interest in medicine, objectively facilitated by direct acquaintance with the life of a physician, is in some proportion of cases at odds with their concern to establish a separate identity of their own. To the extent that these two tendencies obtain and work at cross-purposes, they may delay the time of final commitment to medicine as a career.' She names this a special case of cross-pressure, but is explicit about how it differs from the classic case: 'An interesting special case of cross-pressure may actually be involved here. In the study of political elections it has been found that voters tend to postpone their vote decision longer if they hold a combination of opinions or occupy a combination of statuses that work \"against one another.\" One of the strongest of such cross-pressures results when an individual has leanings toward one party while other members of his immediate family prefer the opposing party. But in the case of the career decision, there may be some tendency for young persons with an interest in the same occupation as their fathers to experience a type of inner conflict that does not beset others. The cross-pressure may in these circumstances arise from conflicting interests and needs of the decider himself, even though he may be \"in harmony\" with his family.' The mechanism is worth naming precisely because the two pulls here are not opposing on their face — wanting to become a doctor and having a doctor father both point the same direction. The delay comes from a second-order conflict: taking the identical path as a parent, rather than merely a similar or compatible one, forces a person to do the additional work of establishing that the choice is genuinely their own and not simply inherited, and that work takes time even when there is no external disagreement to resolve. Distinguish this from internally-divided-primary-groups-let-the-wider-community-decide (lex-ygwne), the classic cross-pressure case Rogoff is contrasting herself with: there, the delay comes from holding two genuinely opposing loyalties (competing parties, competing statuses) that pull toward different outcomes. Here, both pulls point toward the SAME outcome, and the conflict is instead between wanting that outcome and wanting it to be self-authored rather than handed down. Diagnostic move: when someone with an unusually easy, well-supported path into a role hesitates or delays longer than a peer with no such advantage, check whether the advantage IS the exact path a parent, mentor, or predecessor already walked — same field, same specialty, same institution — rather than merely an adjacent or compatible one; the more exactly identical the path, the more likely the delay reflects an identity-autonomy conflict rather than any lack of genuine interest or ability."
related: [lex-f82pz, lex-ygwne]
evokes: [rogoff-1957, doctors-sons, inheriting-an-occupation, cross-pressure-versus-identity-conflict, following-in-fathers-footsteps, separate-identity-of-their-own]
