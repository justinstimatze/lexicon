lineage:
  - source: primary
    text: altshuller-1984-mesem-flow-meter-table
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.7 'The Strategy of Invention,' section 'The Wood for the Trees.'"
    quote: "'The structure of the original construction can be denoted as: the MESEM. At the centre is the stream, along both sides of the stream are electrodes, on the outside the magnetic system. It is obvious that by rearranging the parts one can obtain another five constructions: EMSME (fig 16, b); SMEMS (fig 16 ,c ); MSESM (fig. 16,d ); ESMSE (fig. 16,e); SEMES (fig. 16, f). By the moment that such a morphological analysis had been made for the first time, only the chute consumption metre along the MESEM pattern together with the log (speed gauge) with the SEMES pattern were known. Four patterns turned out to be new, which had their own characteristics and advantages.'"
  - source: primary
    text: altshuller-1984-magnetic-filter-table-and-24-year-gap
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.7, 'The Wood for the Trees.'"
    quote: "'He had cleverly modernised the idea of processing metal which had been put forward in our country in 1938. The idea had been put forward but without results, for at first it had been proposed to process cylindrical surfaces in a rotating magnetic field. Shulev developed the idea that the magnetic field should be stationary, and the part should rotate. It was tried out on a lathe and worked... Twenty four years for the transition to the idea of \"don't turn the field, turn the artefact\" is the price paid for unorganised thinking.'"
canonical-instances:
  - "A UI team has a working notification design (icon-badge-count-tap-action) and, instead of brainstorming new notification ideas freely, exhaustively lists every reordering of where the count, the icon, and the tap-target can sit relative to each other — surfacing an unbuilt arrangement (count inside the tap-target rather than beside it) that turns out to be both more discoverable and easier to implement than any design a free brainstorm had produced."
  - "A hardware team's working sensor design places a heating element, a thermocouple, and an insulating layer in one fixed order; systematically enumerating the small number of other orderings of the same three components surfaces a previously-unbuilt arrangement (insulation between the heater and the thermocouple rather than around the outside) that solves a calibration drift problem no one had traced to the original ordering."
  - "operationally distinct from lex-75nw3 accelerating-idea-throughput-does-not-shrink-a-combinatorial-search-space: that atom critiques methods (like unstructured morphological brainstorming) that speed up idea generation WITHOUT reducing what has to be searched; this atom is the case where the space genuinely IS small and fully enumerable, so exhaustive listing is not throughput-without-narrowing — it's a complete, bounded search that covers 100% of the space, which is exactly the kind of small space lex-75nw3 says throughput techniques are legitimately useful for."
critical-questions:
  - "how does someone know their system's component sequence is short enough for exhaustive enumeration to stay tractable — at what number of positions or axes does the table become too large to inspect cell by cell, and what should replace exhaustive listing once that threshold is crossed?"
  - "not every arrangement in a permutation table will be physically sensible or functionally distinct — how does someone efficiently rule out the arrangements that are combinatorially valid but practically nonsensical, without having to seriously evaluate every single cell?"
  - "the flow-meter and filter examples both happened to have several genuinely useful unfilled cells — is there a way to predict, before doing the enumeration work, whether a given system's arrangement-space is likely to be rich with real unbuilt designs versus mostly empty of anything useful?"
status: active
