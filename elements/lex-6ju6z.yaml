id: lex-6ju6z
name: weird-samples-are-extreme-tail-not-norm-of-human-variation
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When making claims about 'human psychology,' 'human nature,' 'how humans reason,' 'how humans behave,' 'how humans decide,' or any other generalization about humans-in-general, CHECK whether the sample on which the claim rests is WEIRD-biased — drawn predominantly from Western Educated Industrialized Rich Democratic populations. The transferable methodological warning (Henrich-Heine-Norenzayan 2010 *Behavioral and Brain Sciences* paper, extended in Henrich 2020) is grounded in three empirical findings: (1) MASSIVELY BIASED SAMPLES — circa 2010, 96 percent of experimental participants in psychology research were drawn from northern Europe, North America, or Australia, and about 70 percent were American undergraduates; (2) PSYCHOLOGICAL DIVERSITY — cross-cultural variation in psychology is substantially larger than published textbooks suggest, spanning visual illusions, spatial reasoning, memory, attention, patience, risk-taking, fairness, induction, executive function, and pattern recognition; (3) PSYCHOLOGICAL PECULIARITY — when cross-cultural data are available from multiple populations, Western samples typically ANCHOR THE EXTREME END of the distribution. They are statistical outliers, not the human norm. The foundational transferable claim is that WEIRD-sampled generalizations about humans are claims about WEIRD humans specifically, not about humans-in-general. The cross-domain extension matters because WEIRD-sample bias is not limited to psychology research — it pervades behavioral economics (Kahneman / Tversky / Thaler experimental corpus is heavily WEIRD-sampled), HCI research (user studies dominated by WEIRD undergrads), educational research (sampled from WEIRD students in WEIRD schools), anthropological 'human nature' claims (often based on WEIRD intuitions about what is universal), LLM training corpora and evaluation benchmarks (heavily English-language and WEIRD-author-authored; English Wikipedia + Reddit + Common Crawl skew is profound), and public-policy pilot studies (sampled from WEIRD jurisdictions). Crucially, the bias is INVISIBLE from inside the WEIRD frame — Henrich's Preface: 'we wondered if WEIRD researchers—who entirely dominate the relevant scientific disciplines—might have unknowingly gravitated toward those aspects of psychology or behavior on which they themselves—their populations—were likely to stand out.' The framing-effect of the WEIRD-dominated discipline is to make WEIRD-typical features appear universal-and-default while WEIRD-atypical features appear exotic-and-deviant. The practitioner-discipline is three-part. FIRST: NAME the sample on which your generalization rests. Diagnostic prompts — who was studied? What's the geographic / educational / economic / political profile of the participants? Is the sample best described as WEIRD (Western Educated Industrialized Rich Democratic) or does it span cross-cultural variation? SECOND: ASK whether the trait you're generalizing about has KNOWN cross-cultural variation. Henrich's list of WEIRD-atypical traits includes: analytic vs holistic thinking; field-independence in perception; individualism / personal-self emphasis; impersonal trust and impersonal fairness; non-relational moral reasoning (focus on intent over outcome, focus on individual rather than group); low context dependence; trust in strangers; weak in-group preferences; willingness to punish anonymous defectors at cost to self; guilt vs shame emphasis. If your trait is in this WEIRD-variable set, generalizations from WEIRD samples are suspect. THIRD: when extending your finding to humans-in-general, EXPLICITLY HEDGE — 'in WEIRD populations, X' rather than 'humans do X.' For transferable applications: when an AI system is trained on WEIRD-skewed data and deployed cross-culturally, its WEIRD-typical defaults will register as 'errors' or 'cultural insensitivity' in non-WEIRD deployment; the transferable practitioner-discipline is to anticipate this AT TRAINING-DATA-CURATION TIME, not at deployment-bug-report time. When behavioral-economics findings are used to design policy interventions, the practitioner-discipline is to ask whether the underlying experimental sample was WEIRD-biased and whether the population the policy is being deployed on shares the WEIRD profile. When LLM evaluation benchmarks are used to claim model capability, the practitioner-discipline is to ask whether the benchmark sample is WEIRD-biased and whether the claim therefore extends to non-WEIRD deployment contexts. The atom does NOT advise that WEIRD-sampled findings are worthless — they are accurate descriptions of WEIRD populations, which is itself a useful object of study. It advises that the generalization step from WEIRD-sample to humans-in-general is the decisive inferential move that must be checked rather than assumed."
