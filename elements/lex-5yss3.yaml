id: lex-5yss3
name: classify-organizational-change-as-substitution-innovation-or-specification
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When an organization modifies one of its own rules or arrangements, don't just log that 'a change happened' — classify what kind of change it was, because the three kinds have different causes and different implications for how institutionalized the underlying plan is. Goss, studying a new medical-training program's first year, derived exactly three types from her cases: 'In the first case of change in selection criteria, one residence requirement for Family Care patients was replaced by another, presumably better calculated to meet current organizational needs. This sort of alteration, wherein one item is eliminated from the whole and replaced by another item, may be called substitution. The second instance of change cited did not involve replacement of an already-existing requirement, but rather, introduction of a new and unanticipated criterion... This kind of change can be designated innovation, with the understanding that more generally, it means addition of an entirely new and unforeseen item to a given whole. A third kind of change was evident in the final case described, for there the already-existing criterion that patients be \"members of families\" was elaborated to refer specifically to \"families with children.\" The term specification covers this sort of change reasonably well; it may be taken to mean that hitherto implicit or vague implications of a given item are made explicit.' She is explicit that the classification itself requires context, not just the visible edit: 'accurate classification of a given change... as \"substitution,\" \"innovation,\" or \"specification\" requires knowledge of staff expectations as well as of initial formal arrangements.' Diagnostic move: when you observe a rule, policy, or plan change anywhere — a company's expense policy, a game's house rules, a team's code-review checklist — ask which of the three happened: did an existing item get swapped for a different one addressing the same need (substitution), did an entirely unanticipated new requirement get added (innovation), or did a vague existing requirement just get made more explicit and particular (specification)? Specification is diagnostically the most common in a young, actively-monitored organization and signals a plan being sharpened through use rather than abandoned or expanded; frequent innovation signals the original plan was genuinely incomplete; frequent substitution signals the original choices were simply wrong, not just underspecified."
related: [lex-wnf8z]
