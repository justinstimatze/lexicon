id: lex-ehhhe
name: an-incapacitated-threat-is-not-a-confirmed-kill
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you disable a threat without confirming its actual death or removal, don't treat the incapacitation as equivalent to elimination -- 'probably dead by now' is an assumption standing in for verification, and a threat left alive with time to recover is still a threat, however badly wounded it looked when you last saw it. In Eastman's telling, a flock of ducks watches a Falcon that attacked them 'drop heavily to the water's edge with a broken wing' and simply moves on, and by the following spring the old Drake retells the story to his children with total confidence in the Falcon's fate: 'Doubtless he is long since dead of starvation, or else a Fox or a Mink has made a meal of the wicked creature!' Nobody checked. The Falcon spent the entire winter recovering exactly where the ducks last saw him, healing slowly, weak but alive, waiting for the flocks to return -- and the flock's collective assumption that a broken wing equals death is precisely what allows them to relax their guard completely and land undefended in the very spot where he's been waiting. The wing genuinely was broken and the danger genuinely was real in the moment; the error isn't underestimating the original injury, it's treating an unconfirmed, assumed outcome (death by starvation or predation) as settled fact good enough to build a season's worth of confident behavior on top of. Diagnostic move: when a threat has been disabled, hurt, or driven off but not confirmed eliminated, resist converting 'badly hurt' into 'as good as dead' in your own risk assessment -- a wounded threat that survives the initial encounter has had time to heal, adapt, or wait, and the confidence that comes from assuming it's gone is exactly the vulnerability an incompletely finished threat is positioned to exploit."
