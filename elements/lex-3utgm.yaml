    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), New Introduction, Chapter A3 'Justice and Equity,' p.lxxxvi."
    quote: "“It is particularly relevant in this context to examine two different but interrelated aspects of the informational basis of these theories, which I shall call basal space and aggregation system, respectively. The basal space of a theory of justice refers to the general class of variables to which the assessment of justice is sensitive under that theory, and (no less importantly) excludes other variables, even though these variables can be indirectly important through their causal influences on the basal space, or as informational proxies for unobserved basal variables.”"
canonical-instances:
  - "Hypothetical: A hospital's triage score uses vital signs as its basal space (the only inputs it looks at) and a weighted-sum formula as its aggregation system. A doctor thinks the score under-treats slow-bleeding patients; the fix is either adding blood-loss rate to the basal space or reweighting the existing vitals in the sum, and those are two different repairs to two different parts of the tool."
  - "Hypothetical: A company's employee ranking tool takes performance-review scores as its basal space and averages them as its aggregation system. Critics complain the tool 'doesn't capture what makes someone valuable,' without specifying whether they mean the reviews are measuring the wrong things (a basal-space problem) or that averaging buries someone who's exceptional in one dimension and weak in another (an aggregation-system problem) -- and the tool can't be fixed until someone says which."
critical-questions:
  - "Isn't this just relabeling an obvious distinction -- doesn't everyone already understand that 'what you measure' and 'how you score it' are different things? The distinction is intuitive once stated, but arguments routinely blur it anyway. 'It can't tell torture from taxation' is a basal-space complaint -- utility as the metric flattens real differences. 'It ignores the worst-off' targets the aggregation system instead, since sum-ranking has no built-in equity term. Folded into one undifferentiated complaint about utilitarianism being wrong, neither fix touches the problem the other one names."
  - "Can a theory be criticized on both counts at once, or does naming the distinction force you to pick one? Both at once is common, stated as two separable claims rather than one vague dissatisfaction. Sen does exactly this to utilitarianism: its basal space (mental-metric utility) is unreliable for the persistently deprived, and, on an entirely separate count, its aggregation system (sum-ranking) has no built-in concern for distribution."
