id: lex-mnhjs
name: a-rescue-condition-can-fail-to-tenderness-not-curiosity
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you're given a single, explicit condition for completing a rescue or a delicate transition -- don't touch, don't approach, don't act until a specific point is reached -- the violation you should actually guard against isn't curiosity or doubt, it's tenderness, because a condition framed as protecting against premature contact is just as often broken by affection succeeding as by suspicion failing. In Cushing's telling, the Owl who revives the dead maiden gives one precise instruction: 'not until ye reach the home of thy fathers shalt thou approach her or kiss her; for if thou doest this, all will be as nothing again.' The young man completes almost the entire journey home -- days of travel, a canyon, a field of cactus, exhaustion -- resisting every hardship along the way. He breaks the condition not out of doubt that it's real, not out of curiosity about what would happen, but purely from being overcome by love at the sight of her sleeping: 'she lay down and seemed to sleep... looked so beautiful to the longing lover that he softly rose and crept close to her.' The single kiss undoes the entire rescue instantly and permanently. The story's real danger was never his skepticism -- it was that a task requiring restraint at the point of near-completion is hardest to fail through doubt and easiest to fail through affection, right when the goal feels close enough to relax the discipline that got him there. Diagnostic move: when a condition on a fragile success requires you to withhold action until a specific finish line, treat the moment you feel closest to safe -- not the moment you feel most tempted to doubt -- as the highest-risk point, because relief and affection erode discipline exactly when vigilance against curiosity would tell you the danger has passed."
