id: lex-x7wbe
name: an-innocent-causal-account-defuses-an-accusation-without-contesting-the-facts
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When someone is about to punish a person over behavior that looks damning but has an innocent explanation the accuser hasn''t considered, supply that explanation directly to the accuser rather than contesting whether the behavior happened at all — accepting the visible fact while reframing its cause can disarm anger faster than denial does. In the Maha-Ummagga-Jataka, Queen Udumbara smiles at the sight of her former husband reduced to menial labor, and King Vedeha, enraged and certain the smile means infidelity, draws his sword to kill her. Mahosadha does not deny that she smiled — he answers the king''s question about whether an unlucky man could ever fail to desire a beautiful, virtuous woman: "O king, I do believe it: the man would be an unlucky wretch; good luck and ill luck never can mate together." This account of her ex-husband''s abandonment as ill-luck-repelling-good-luck, not infidelity, "allayed the king''s anger, and his heart was calmed."'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, defusing-anger, innocent-explanation, reframe-not-deny]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"O king, I do believe it: the man would be an unlucky wretch; good luck and ill luck never can mate together." These words allayed the king''s anger, and his heart was calmed'
canonical-instances:
  - "A manager finds an employee's calendar blocked out during a critical client call and is about to write them up for insubordination; a colleague explains the employee was in a scheduled medical appointment booked weeks earlier, defusing the accusation without disputing that the employee was, in fact, unavailable."
  - "A parent is furious to find a child laughing during a solemn family video call and assumes disrespect; another relative points out the child was reacting to the family dog knocking over a lamp just off-camera, reframing the same visible laughter without denying it happened."
critical-questions:
  - "This worked because the innocent account was actually true and fit the facts precisely — how does the move hold up when the only available innocent explanation is a stretch, or when the accuser can see through a face-saving story that doesn't quite fit?"
  - "Defusing the immediate danger doesn't address whether the underlying relationship (here, the king's readiness to kill on suspicion) has actually improved — does calming one incident risk leaving the accuser's volatility intact for the next one?"
status: active
