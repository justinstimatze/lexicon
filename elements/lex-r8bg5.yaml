id: lex-r8bg5
name: a-partial-discipline-still-compounds-into-outsized-reward
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'Someone who keeps only part of a discipline — starting late, missing the full form of the commitment — can still have that incomplete observance credited as directly causing a disproportionate long-run benefit. The claim generalizes the idea that even a partial, imperfect commitment can compound into outsized reward, not just a full one. In the Jataka''s tale of Gangamala, the Bodhisatta''s rebirth as a prince is attributed to keeping only half a fast-day: "The Bodhisatta, seeing the royal splendour, felt a desire for royalty and prayed for it. Dying, he was conceived again, in consequence of keeping half the fast-day, in the womb of the chief queen."'
related: [lex-xyehs]
evokes: [jataka, atthanipata, gangamala-jataka, partial-discipline-compounds, imperfect-commitment-still-pays]
lineage:
  - source: primary
    text: jataka-chalmers1895-gangamala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 421, Gangamala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The Bodhisatta, seeing the royal splendour, felt a desire for royalty and prayed for it. Dying, he was conceived again, in consequence of keeping half the fast-day, in the womb of the chief queen."
canonical-instances:
  - "Someone who joins a savings habit six years late and only manages to save half of what a full-career saver would have still ends up meaningfully ahead of peers who never started at all, because even the partial version of the discipline compounded."
critical-questions:
  - "Does crediting a partial discipline with the full outcome risk overstating what the partial version actually contributed, versus other factors present at the same time?"
  - "Would knowing in advance that even a half-measure compounds this well change how readily someone commits to the full version of a discipline?"
status: active
