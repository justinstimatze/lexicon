lineage:
  - source: primary
    text: schelling-1971-dynamic-models-of-segregation
    citation: "Thomas C. Schelling, 'Dynamic Models of Segregation,' *Journal of Mathematical Sociology* 1:143-186 (1971). The canonical statement of the micromotive-macrobehavior gap. Schelling develops two formal models: a SPATIAL PROXIMITY model (a one- or two-dimensional board where each agent has a tolerance threshold for the ratio of opposite-color neighbors in their immediate vicinity and moves when their threshold is exceeded) and a BOUNDED-NEIGHBORHOOD model (a single area where each agent has a tolerance threshold for the ratio in the area as a whole). The crucial finding: every individual agent prefers a mixed neighborhood at most reasonable tolerance levels (e.g., median tolerance of 1:1 — willing to be in a 50/50 area), yet the aggregate dynamics produce complete or near-complete segregation. The mechanism is sequential individual-environment feedback: the least-tolerant agent moves first when their threshold is exceeded; their move changes the local ratio, exceeding the threshold of the next-least-tolerant agent; cascade continues until aggregate state is segregated. Schelling's transferable framing (pp. 145-147): 'unregulated behavior does not necessarily reflect preferences about its results. People acting individually are often unable to affect the results; they can only affect their own positions within the overall results.' And: 'the hearts and minds and motives and habits of millions of people who participate in a segregated society may or may not bear close correspondence with the massive results that collectively they can generate.' Schelling explicitly generalizes beyond segregation by color: he notes the same structure appears in 'depression and inflation' (macroeconomic outcomes nobody preferred), 'bank failures and market crashes,' typewriter keyboard standardization, traffic congestion, classroom composition, and any other case where individuals affect their position within an aggregate but not the aggregate itself. The 1978 book *Micromotives and Macrobehavior* (Norton) extends this into a fuller framework, but the 1971 paper is the cardinal technical statement and the source Granovetter 1978 (lex-pjsjj) adapted into the threshold-cascade primitive. (Granovetter's atom carves the specific BINARY-CASCADE special case; lex-d5eew carves the general MICROMOTIVE-MACROBEHAVIOR-GAP claim that underlies it. The two compose: lex-d5eew is the upstream structural framing, lex-pjsjj is the formal cascade-dynamics specialization.)"
    quote: "[Schelling 1971 pp. 145-147, the transferable framing:] 'Some of the phenomena of segregation may be similarly complex in relation to the dynamics of individual choice. One might even be tempted to suppose that some \"unseen hand\" separates people in a manner that, though foreseen and intended by no one, corresponds to some consensus or collective preference or popular will. But in economics we know a great many macro-phenomena, like depression and inflation, that do not reflect any universal desire for lower incomes or higher prices. Similarly with bank failures and market crashes. What goes on in the \"hearts and minds\" of small savers has little to do with whether or not they cause a depression. The hearts and minds and motives and habits of millions of people who participate in a segregated society may or may not bear close correspondence with the massive results that collectively they can generate... unregulated behavior does not necessarily reflect preferences about its results. People acting individually are often unable to affect the results; they can only affect their own positions within the overall results.' [The spatial-proximity model setup, pp. 158-161:] 'It is the least tolerant whites that move out first, and the most tolerant that move in first, and similarly for blacks... Our initial data are represented by a cumulative frequency distribution of \"tolerance\" of the members of each color group.' [The 5:1 stars-to-zeros canonical example, pp. 161-162:] 'In the random distribution only a single star is dissatisfied, the one nearest to the lower right corner. The pattern that results from movement is somewhat sensitive to the precise order of movement imputed to the various dissatisfied zeros, of whom there are 11 out of the 15 individuals.' [The structural finding:] 'This result will be independent of the moderateness of the color demands of the newcomers.'"
  - source: practitioner
    text: schelling-1978-micromotives-and-macrobehavior-trade-name
    citation: "Thomas C. Schelling, *Micromotives and Macrobehavior* (W. W. Norton, 1978). Schelling's book-length elaboration of the 1971 paper, generalizing the segregation result into a framework Schelling explicitly calls the 'micromotive/macrobehavior gap.' The book covers: thermostat-set behavior, the seating-arrangement-in-a-classroom problem, the lemons-market (Akerlof) as a micromotive-aggregating-to-bad-equilibrium case, traffic-merge dynamics, audience seating, and many other domains where the structure recurs. The transferable name 'micromotives and macrobehavior' is Schelling's own coinage and has become the recognized term for the structural gap lex-d5eew carves. Practitioner reference rather than primary because the book popularized and generalized; the 1971 paper is the technical primary. Both should be cited."
    quote: "[Schelling 1978 Ch.1, paraphrased Schelling-original framing — verbatim quote not extracted here pending re-acquisition of the book; Schelling's 1971 paper carries the same transferable claim quoted above.]"
canonical-instances:
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: lex-spm8x is the generic feedback primitive; lex-d5eew specializes to the multi-actor case where each agent's choice changes the environment for subsequent choosers. The transferable claim is about the gap between preferences and aggregate, not about feedback as such."
  - "operationally distinct from lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories: lex-mwgep is about lock-in within a single trajectory; lex-d5eew is about the gap between the trajectory's aggregate outcome and any individual's preferences for it. Compose: lex-mwgep says how the aggregate gets locked in, lex-d5eew says the locked-in aggregate need not match any individual's preference."
  - "operationally distinct from lex-4nunt market-aggregation-weights-preferences-by-purchasing-power: lex-4nunt is about how dollar-weighted aggregation distorts preference-revelation (the rich count more); lex-d5eew is about how sequential environmental feedback distorts the gap between individual choice and aggregate. Both are 'aggregation distorts' but via different mechanisms — weighting vs. feedback."
  - "operationally distinct from lex-k6wka focal-point-coordinates-expectation-via-shared-salience-without-communication (Schelling 1960 ch.4): lex-k6wka is Schelling's coordination-equilibrium primitive — how parallel actors converge on a shared expectation. lex-d5eew is the inverse — how parallel actors fail to coordinate despite each acting on individual preference, producing an aggregate nobody preferred. Same author, complementary primitives."
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is the general translation primitive; lex-d5eew is a specific instance where the operational claim is structurally different from the descriptive preference-data — moving from 'most people prefer mixing' (descriptive) to 'we get segregation anyway' (operational aggregate) is the central translation Schelling teaches."
  - "Bounded-neighborhood model (Schelling 1971 pp. 167-170): 100 whites and 50 blacks share a single neighborhood. Each agent has a tolerance threshold for the ratio of opposite-color in the area. Median white can tolerate 1:1 ratio (willing to live in 50/50); median black same. Most-tolerant white can tolerate 2:1 (one-third minority status). Yet sequential moves — least-tolerant leaves first when threshold exceeded, their leaving changes ratio, next-least-tolerant now exceeded, cascade — drive to complete segregation. With straight-line tolerance schedules and these populations, there is no stable mixed equilibrium. Each agent acts on their own preference; the aggregate is one no agent wanted."
  - "Spatial proximity model with 5:1 starting ratio (Schelling 1971 pp. 161-162): stars outnumber zeros 5:1 on a board. Zeros' demand: minimum 2 zeros in surrounding 24 squares (very moderate — just want SOME like neighbors). Stars' demand: zeros no more than one-third of 24 surrounding (somewhat restrictive). In the random initial distribution, only ONE star is dissatisfied. But the 11 dissatisfied zeros begin moving toward each other; their movement vacates squares the stars now find satisfactory or dissatisfactory; the cascade produces a strongly segregated pattern. Schelling's specific finding: 'This result will be independent of the moderateness of the color demands of the newcomers' (p. 162). Moderate preferences, extreme aggregate."
  - "Macroeconomic outcomes (Schelling 1971 p. 147): 'we know a great many macro-phenomena, like depression and inflation, that do not reflect any universal desire for lower incomes or higher prices. Similarly with bank failures and market crashes. What goes on in the \"hearts and minds\" of small savers has little to do with whether or not they cause a depression.' The bank-run is the canonical case — each saver individually rational to withdraw given fear of others withdrawing; the aggregate is the bank failure no individual saver wanted."
  - "QWERTY keyboard layout (Schelling 1971 p. 147 + Liebowitz-Margolis 1990 critique): once enough typists train on QWERTY, each new typist's individually-rational choice is to learn QWERTY (largest network of trained typists, most jobs requiring it). The aggregate is a suboptimal-relative-to-Dvorak standard nobody chose deliberately. Schelling cites this as a non-segregation example of the same structure; it's the cleanest non-distributional instance — pure path-dependence aggregating to outcomes individual preferences had little to do with."
  - "Traffic congestion and routing equilibria (Schelling 1971 p. 147; Wardrop 1952 Nash-equilibrium for traffic): each driver chooses the route that minimizes their own travel-time given current congestion. Aggregate result is a traffic equilibrium that is typically much slower than the social-optimum — Braess's paradox shows that adding capacity can WORSEN aggregate travel time. The aggregate is a state no driver preferred at their individual choice, but each driver's choice was individually-rational."
  - "Restaurant seating and 'people who get to eat at this restaurant are the ones who don't mind a long wait' (Schelling 1978): each diner decides whether to wait given current line length. Sequential decisions produce a steady-state where the line is long, those who chose to wait are the most patient diners, the restaurant looks like it 'caters to a patient clientele' — but the aggregate experience and selection-effect emerge from sequential individual choices, not from preferences for the result."
  - "Audience-seating-in-a-lecture-hall (Schelling 1978): each audience member chooses a seat to maximize visibility / minimize crowding given who's already there. Sequential arrivals produce specific spatial patterns (clusters in back, scattered front, certain anchors filled) that nobody planned and no individual preferred over alternatives. Each move is locally-rational; the aggregate pattern is the joint product."
  - "operationally distinct from and composing-with lex-pjsjj binary-cascade-outcomes-track-threshold-distribution-not-average-preference: lex-pjsjj is the formal CASCADE-DYNAMICS specialization (binary choice, threshold distribution, cumulative-distribution-function recursion); lex-d5eew is the general MICROMOTIVE-MACROBEHAVIOR-GAP framing that lex-pjsjj is one specific case of. Granovetter (1978) explicitly adapted Schelling (1971); Schelling-as-framing is upstream of Granovetter-as-formalization. Both critical: lex-pjsjj for binary social choices, lex-d5eew for the general structural claim about aggregate-individual disconnection across any feedback domain."
  - "operationally distinct from and composing-with lex-8vqvy externalities-are-reciprocal: Coase (lex-8vqvy) reframes the dyadic externality question (A-harms-B is misframing; both must be present); Schelling (lex-d5eew) reframes the population-aggregate-vs-individual-preference question. Both are reframings of standard policy questions, but at different scales — Coase at the dyadic-cost-assignment level, Schelling at the population-aggregate level."
critical-questions:
  - "Are you reading individual preferences off the aggregate state? The pivotal diagnostic. If the aggregate is segregated, do you infer 'people prefer segregation'? If the market is concentrated, do you infer 'consumers prefer this concentration'? If the highway is congested, do you infer 'drivers prefer congested routes'? In each case, the aggregate is a structural product of sequential individual choices under environmental feedback, not evidence about individual preferences. Refuse the back-inference."
  - "What is the choice-sequence — and how does each choice change the environment for the next chooser? lex-d5eew's mechanism. Diagnose by tracing: who moves first, how does that move change ratios/availability/visibility/cost for the next chooser, how does the next chooser update, and so on. If you can articulate the sequential feedback chain, you can sometimes intervene at a single point in the chain to flip the aggregate. If you can only see the aggregate, you cannot diagnose the cascade."
  - "Would each individual chooser prefer the aggregate they collectively produced? The three-question test: (i) what would each say they prefer (revealed preferences); (ii) what did each individually choose at choice-time given their environment; (iii) what aggregate would each prefer if asked about the aggregate as such. If (iii) diverges from the actual aggregate, lex-d5eew applies — the aggregate is structurally produced, not preference-aggregated. The gap between (ii) and (iii) is the key diagnostic."
  - "Is the policy lever targeting the wrong thing? If you try to change the aggregate by trying to change average preference, you'll fail when the aggregate is structurally produced. The right lever is the feedback structure: change what each chooser sees at the moment of choice (information design), change the order of choices (sequencing), change the cost/benefit at the threshold actor (marginal interventions). lex-d5eew's prescriptive content: 'target the cascade, not the average.'"
  - "Are the individual choices REGULATED in a way that internalizes the externalities? Schelling's 'unregulated behavior need not reflect preferences about its results.' Sometimes the appropriate response to lex-d5eew is regulation that aligns individual choice with aggregate-preferred outcomes (zoning, congestion pricing, traffic merging rules). When the aggregate is bad for everyone, regulation may be a Pareto improvement — not over individual liberty, but over the unregulated cascade-product. lex-d5eew establishes when this regulatory argument applies."
  - "Is the aggregate even visible to the individual choosers? Schelling's note: 'People acting individually are often unable to affect the results; they can only affect their own positions within the overall results.' Individuals choose where to live, what to buy, which route to drive — not what the aggregate looks like. So aggregate-vs-preference disconnection is structurally guaranteed when individuals choose positions-within rather than aggregates-of. Diagnose: at choice-time, what was visible to the chooser? If only their local environment, then their choice was locally-rational and globally-uninformed."
  - "Could a small intervention at the FEEDBACK structure flip the equilibrium? lex-d5eew's actionable lever. The bounded-neighborhood model shows that very slight changes in tolerance schedules can flip equilibria from mixed-and-stable to fully-segregated. Likewise, slight changes in choice-architecture (default options, the first chooser's example, the information available at choice-time) can flip aggregates. Practitioner-discipline: search for the cascade-tipping point and intervene there, not at the average."
