lineage:
  - source: primary
    text: kaplan-2020-scaling-laws-for-neural-language-models
    citation: "Jared Kaplan, Sam McCandlish, Tom Henighan, Tom B. Brown, Benjamin Chess, Rewon Child, Scott Gray, Alec Radford, Jeffrey Wu, and Dario Amodei, 'Scaling Laws for Neural Language Models' (arXiv:2001.08361, January 2020; Johns Hopkins University / OpenAI). The founding paper of the empirical-scaling-laws literature for language models. Trains Transformer language models over more than seven orders of magnitude in scale and shows cross-entropy test loss follows precise power laws in non-embedding parameter count N, dataset size D, and training compute C, when each is not bottlenecked by the other two. The paper's central methodological claim is that performance depends overwhelmingly on aggregate SCALE and barely at all on architectural shape (depth versus width and similar hyperparameters), and that the smooth, predictable power-law relationships let a practitioner solve for the compute-optimal allocation of a fixed training budget in advance, rather than discovering it by trial and error. The paper's own worked-out recipe (Section 6) recommends training very large models on comparatively modest data and stopping well short of convergence — a recipe subsequently shown by Hoffmann et al. 2022 to have under-weighted data scaling relative to parameter scaling."
    quote: "[Abstract:] 'We study empirical scaling laws for language model performance on the cross-entropy loss. The loss scales as a power-law with model size, dataset size, and the amount of compute used for training, with some trends spanning more than seven orders of magnitude. Other architectural details such as network width or depth have minimal effects within a wide range. Simple equations govern the dependence of overfitting on model/dataset size and the dependence of training speed on model size. These relationships allow us to determine the optimal allocation of a fixed compute budget. Larger models are significantly more sample-efficient, such that optimally compute-efficient training involves training very large models on a relatively modest amount of data and stopping significantly before convergence.' [§1.1 Summary, on scale mattering and shape not:] 'Performance depends strongly on scale, weakly on model shape:' [the run-in heading; the body sentence follows:] 'Model performance depends most strongly on scale, which consists of three factors: the number of model parameters N (excluding embeddings), the size of the dataset D, and the amount of compute C used for training. Within reasonable limits, performance depends very weakly on other architectural hyperparameters such as depth vs. width.' [§1.1, on the power-law itself:] 'Performance has a power-law relationship with each of the three scale factors N, D, C when not bottlenecked by the other two, with trends spanning more than six orders of magnitude... We observe no signs of deviation from these trends on the upper end.' [§1.1, on the compute-efficient recipe Hoffmann et al. later correct:] 'When working within a fixed compute budget C but without any other restrictions on the model size N or available data D, we attain optimal performance by training very large models and stopping significantly short of convergence... with data requirements growing very slowly as D ∼ C^0.27 with training compute.' [§8 Discussion:] 'Since scalings with N, D, Cmin are power-laws, there are diminishing returns with increasing scale... Our results strongly suggest that larger models will continue to perform better, and will also be much more sample efficient than has been previously appreciated. Big models may be more important than big data.'"
  - source: primary
    text: hoffmann-2022-training-compute-optimal-large-language-models
    citation: "Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch, Elena Buchatskaya, Trevor Cai, Eliza Rutherford, Diego de Las Casas, Lisa Anne Hendricks, Johannes Welbl, Aidan Clark, Tom Hennigan, Eric Noland, Katie Millican, George van den Driessche, Bogdan Damoc, Aurelia Guy, Simon Osindero, Karen Simonyan, Erich Elsen, Jack W. Rae, Oriol Vinyals, and Laurent Sifre, 'Training Compute-Optimal Large Language Models' (arXiv:2203.15556, March 2022; DeepMind) — the 'Chinchilla' paper. Directly revisits Kaplan et al. 2020's compute-allocation question by training over 400 language models (70 million to over 16 billion parameters, 5 billion to 500 billion-plus tokens) and empirically re-deriving the compute-optimal frontier. Finds that Kaplan's recipe systematically over-weighted parameter count relative to data: the field's resulting large models (Gopher, GPT-3, Jurassic-1, Megatron-Turing NLG, all trained on roughly 300 billion tokens regardless of parameter count) were significantly undertrained for their compute budgets. The paper verifies its corrected allocation by training Chinchilla, a 70-billion-parameter model on 1.4 trillion tokens — the same compute budget as the 280-billion-parameter Gopher — which uniformly and significantly outperforms Gopher and every other large model tested."
    quote: "[Abstract:] 'We investigate the optimal model size and number of tokens for training a transformer language model under a given compute budget. We find that current large language models are significantly undertrained, a consequence of the recent focus on scaling language models whilst keeping the amount of training data constant. By training over 400 language models ranging from 70 million to over 16 billion parameters on 5 to 500 billion tokens, we find that for compute-optimal training, the model size and the number of training tokens should be scaled equally: for every doubling of model size the number of training tokens should also be doubled. We test this hypothesis by training a predicted compute-optimal model, Chinchilla, that uses the same compute budget as Gopher but with 70B parameters and 4× more data. Chinchilla uniformly and significantly outperforms Gopher (280B), GPT-3 (175B), Jurassic-1 (178B), and Megatron-Turing NLG (530B) on a large range of downstream evaluation tasks.' [§1 Introduction, naming the correction to Kaplan directly:] 'Kaplan et al. (2020) showed that there is a power law relationship between the number of parameters in an autoregressive language model (LM) and its performance... One notable conclusion in Kaplan et al. (2020) is that large models should not be trained to their lowest possible loss to be compute optimal. Whilst we reach the same conclusion, we estimate that large models should be trained for many more training tokens than recommended by the authors. Specifically, given a 10× increase computational budget, they suggests that the size of the model should increase 5.5× while the number of training tokens should only increase 1.8×. Instead, we find that model size and the number of training tokens should be scaled in equal proportions.' [§5 Discussion & Conclusion:] 'We hypothesize that the race to train larger and larger models is resulting in models that are substantially underperforming compared to what could be achieved with the same compute budget... All three approaches predict that Gopher is substantially over-sized and estimate that for the same compute budget a smaller model trained on more data will perform better. We directly test this hypothesis by training Chinchilla, a 70B parameter model, and show that it outperforms Gopher and even larger models on nearly every measured evaluation task.'"
canonical-instances:
  - "the Gopher-to-Chinchilla correction itself: Gopher (280B parameters, ~300B training tokens, following Kaplan's parameter-dominant recipe) versus Chinchilla (70B parameters, 1.4T training tokens, following Hoffmann's equal-scaling correction) at the SAME training compute budget — Chinchilla reaches 67.5% average accuracy on MMLU, described in the paper's own abstract as 'greater than a 7% improvement over Gopher,' while using a quarter of the parameters and being substantially cheaper to run at inference and fine-tuning time"
  - "the field's own words reversing within two years: Kaplan et al. 2020 concluded their discussion with 'Big models may be more important than big data'; Hoffmann et al. 2022 showed the opposite emphasis was needed for compute-optimality — not that big models don't matter, but that the field had been under-investing in data relative to parameters precisely because the earlier paper's own allocation recipe pointed the field that way"
  - "a structurally identical correction one field over: Kleiber's 1932 empirical finding that mammalian basal metabolic rate scales as body-mass^0.75 (lex-cpgyd), not the naive geometric guess of mass^0.667 (surface-area scaling) — the 3/4 exponent had to be measured, not derived from an intuitive-but-wrong geometric prior, exactly as Hoffmann's near-1:1 parameter-to-token ratio had to be measured against 400+ trained models rather than inherited from Kaplan's smaller-scale extrapolation. Same higher-order lesson (a scaling law's own exponent or allocation-ratio is an empirical discovery, not a geometric or intuitive given) instantiated in a completely unrelated domain"
  - "operationally distinct from lex-zpfv9 scale-with-compute-methods-eventually-outperform-handcrafted-domain-knowledge (Sutton's bitter lesson): lex-zpfv9 is a general METHODOLOGICAL claim about WHICH METHOD CLASS wins in AI research over decades — compute-scaling approaches (search, learning) eventually beat hand-encoded domain knowledge. This atom is the SPECIFIC QUANTITATIVE EMPIRICAL LAW governing HOW performance scales once you've made that methodological choice (a power law in N, D, C) and WHAT ratio to allocate between the competing scale-dimensions for a fixed budget. Sutton tells a researcher to prefer scale over cleverness; Kaplan and Hoffmann tell a researcher, having already chosen to scale, the precise curve-shape and the precise split to allocate within it — and show that even that split is not obvious and was gotten wrong once already"
  - "operationally distinct from lex-pp5wq binarized-metric-makes-smooth-capability-look-like-sudden-emergence (Schaeffer et al.'s critique of Wei et al.'s emergent-abilities claim): lex-pp5wq is about whether apparent DISCONTINUITIES in downstream TASK-level benchmark scores (exact-match accuracy, multiple-choice grade) are artifacts of a binarized metric applied to an underlying smoothly-improving quantity. This atom is about the underlying LOSS-level scaling law itself — which both Kaplan and Hoffmann treat as smooth, monotonic, and power-law-shaped, not in dispute — and about the empirically-discoverable optimal allocation of resources that minimizes that loss. The two atoms compose rather than compete: this atom's smooth cross-entropy-loss curve is precisely the underlying continuous quantity that lex-pp5wq argues gets deformed into a false step-function once a researcher grades it with a binarized task metric instead of loss or edit-distance"
  - "operationally distinct from lex-uqghr complexity-yields-declining-marginal-returns-eventually-driving-collapse (Tainter's collapse-of-complex-societies frame, which already cites Hoffmann 2022 as its own AI-training illustration): lex-uqghr is a DOMAIN-GENERAL claim about problem-solving systems of any kind — societies, bureaucracies, codebases, tax regimes, AI training regimes alike — investing in complexity until marginal returns decline and collapse (deliberate simplification) becomes the rational response; Hoffmann/Chinchilla appears there only as one illustrative instance of that universal curve. This atom is the underlying SPECIFIC MECHANISM with its own primary-source lineage: the actual power-law functional form Kaplan derived, and the actual empirically-corrected parameter-to-token allocation ratio Hoffmann derived, neither of which lex-uqghr describes or depends on for its own cross-domain argument"
critical-questions:
  - "is a plateaued system's stall actually a scale bottleneck (does a power law fit the loss-versus-N, D, or C curve), or is it an architecture-mismatch problem that no amount of additional scale will fix (see lex-xrbzz)? The two failure modes call for opposite interventions — more scale, or a different inductive bias — and misdiagnosing one as the other wastes a budget either way"
  - "is the current split between competing scale-dimensions (parameters versus data; headcount versus training time; any two resources jointly consumed under one fixed budget) an independently re-derived optimum for this specific budget point, or is it inherited from a convention that may itself be an uncorrected first guess — the way the field trained on ~300B tokens regardless of model size for two years simply because Kaplan's recipe implied it?"
  - "which side of the allocation is more legible or prestige-generating (a bigger headline parameter count) versus less visible (more training-data collection and curation effort) — and is the field's convention biased toward the flashier, more publicized dimension rather than the actually efficient one?"
  - "has the compute-optimal ratio been validated at the SCALE actually being planned, or extrapolated from a different regime? Hoffmann et al.'s own paper flags that only two large-scale runs (Chinchilla and Gopher) were directly compared, and that some concavity was observed in the fitted optimal-parameter-count curve at high compute budgets — meaning even the corrected 1:1 ratio may itself still be an approximation subject to further correction, not a final answer"
  - "is a reported smooth improvement (or a reported sudden jump) being measured on the continuous loss itself, or on a downstream task metric that may binarize or otherwise nonlinearly deform that underlying loss (see lex-pp5wq)? Kaplan and Hoffmann's smoothness claims are specifically about cross-entropy loss, not about every possible metric computed from a model's outputs"
