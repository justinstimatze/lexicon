id: lex-3n87u
name: tribute-disguised-as-a-trap-exploits-the-marks-own-status
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a rival wants to undermine someone newly elevated to power, check whether the attack arrives disguised as ceremonial deference keyed to the target's new rank — the target's own investment in that status is what carries them the rest of the way in. In Aesop's 'The Monkey as King,' a fox leads a newly-crowned monkey-king to a baited trap, framing the bait as tribute befitting royalty: 'Here is a dainty morsel I have found, sire; I did not take it myself, because I thought it ought to be reserved for you, our King.' The monkey is not attacked directly — the trap is presented as a due owed to the crown, and it is specifically the target's expectation of deference in the new role that carries them into it."
related: []
evokes: [aesop, the-monkey-as-king, poisoned-chalice, tribute-disguised-as-trap, exploiting-status-investment]
lineage:
