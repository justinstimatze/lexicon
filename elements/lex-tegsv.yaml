    quote: "She that did thy mangoes eat, As her lord shall own some churl, That with dye grey hairs would cheat And his locks with tongs would curl."
canonical-instances:
  - "With no camera footage and no witnesses, a business partner accused of skimming funds offers to sign a binding agreement forfeiting their entire share of the company if an audit ever finds even a dollar out of place — the specific, self-imposed cost of the offer is what convinces the other partners more than any denial could."
critical-questions:
  - "Does this only work on people who genuinely believe the curse or consequence carries weight — would a skeptic willing to lie also be willing to accept a consequence they don't actually believe will materialize?"
  - "Is there a risk that an innocent person, terrified of the invoked consequence regardless of its unlikelihood, would refuse the oath out of superstition alone, making refusal look like guilt when it isn't?"
