id: lex-dncqu
name: naming-the-general-principle-signals-deeper-mastery
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When several people answer the same open question with equally sound, equally specific advice, the answer that additionally names the general category or framework that advice falls under reads as deeper mastery than the one that just gives more good advice. Specific correctness demonstrates competence; naming the structure the specifics belong to demonstrates that the competence is organized rather than merely accumulated. In the Jataka's tale of the three birds, the king puts the same question — what course of life is best for one who reigns — to three creatures he has raised as his children. The first two, an owl and a myna, each answer with eleven stanzas of solid, specific practical counsel (watch your treasury yourself, choose wise counsellors, act promptly, master your anger) and are rewarded with real offices, general and treasurer. The third, a parrot, opens instead by naming a five-part taxonomy of the kinds of power a king can draw on before ranking them: \"Amidst the great ones of the earth a fivefold power we see; / Of these the power of limbs is, sure, the last in its degree, / And power of wealth, O mighty lord, the next is said to be. / The power of counsel third in rank of these, O king, I name; / The power of caste without a doubt is reckoned fourth in fame... / Of all these powers that one is best, as power of learning known, / By strength of this a man is wise and makes success his own.\" Only after placing his specific advice inside that ranked structure does he give it. He receives the highest office of the three, commander-in-chief, and the story marks the king as having asked him \"in a special way\" — not the same rote question put to the others, because his answer was already expected to operate at a different level."
