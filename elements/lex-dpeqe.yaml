id: lex-dpeqe
name: comply-with-the-letter-of-a-forced-concession-while-sabotaging-its-substance
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a more powerful party forces you to hand over a category of asset as the price of peace, don't treat 'give them what was demanded' as a single, uniform instruction -- within any demanded category there's usually room to choose which specific instances you hand over, and that choice is where you claw back the loss. Kautilya specifies, for each type of demanded concession, exactly which instances to select: for animals, 'give dull and cowardly elephants and horses; if he has to give active and energetic animals, a long-acting poison shall be administered to them'; for troops, hand over 'treacherous, foreign or jungle tribes under the command of a trusted officer who will arrange the destruction of both the strong king's troops and the troops supplied,' or 'hot-headed troops who are likely to revolt when feeling insulted,' or 'loyal troops of the standing army who will strike [on behalf of the weak king] when the strong king is in difficulty'; for money, 'give articles of high value for which there are no buyers, or forest produce that is unfit for use in war'; for land, give land 'that can be easily recovered, which has permanent enemies, which provides no shelter or which can only be settled with heavy losses and expenses.' Every category shares the same mechanism: the demand specifies a quantity or type, but not which specific units satisfy it, and the compliant party controls that selection -- so genuine literal compliance with the demand ('I gave you elephants,' 'I gave you troops,' 'I gave you land') can still leave the receiving party with something that costs them more to hold than it was worth to take. This isn't refusal or partial compliance, which invite retaliation for breaking the deal -- it's full compliance at the category level paired with adversarial selection at the instance level, a distinction the counterparty usually can't easily detect or contest without appearing to renegotiate terms that were already met. Diagnostic move: when you must concede a demanded category of resource, don't hand over your best or most convenient instances by default -- ask which of the acceptable-under-the-letter options will cost the receiver the most to actually use, and select for that, since the demand was satisfied either way and only your choice of which instance changes what they actually end up holding."
related: [lex-5f8ku, lex-wa7s4]
evokes: [malicious-compliance-at-the-instance-level, kautilya-conditions-of-surrender, satisfy-the-category-sabotage-the-specific-instance, poisoned-elephants-and-worthless-forest-produce]
lineage:
  - source: primary
    text: kautilya-arthashastra-what-to-surrender-when-forced-to-give-up-assets
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'The Weak King,' 'Suing for Peace,' {12.1.25-31}."
    quote: "'If the weak king seeks peace on condition of surrendering a portion of his forces [and the offer is accepted], he shall give dull and cowardly elephants and horses; if he has to give active and energetic animals, a long-acting poison shall be administered to them... If peace is sought on condition of paying money, the weak king shall give articles of high value for which there are no buyers, or forest produce that is unfit for use in war. If the condition is surrender of land, the weak king shall give land that can be easily recovered, which has permanent enemies, which provides no shelter or which can only be settled with heavy losses and expenses.'"
canonical-instances:
  - "A company forced by a regulator to divest a business unit as an antitrust remedy chooses to divest its weakest, least-integrated unit with the oldest technology and most customer churn -- fully satisfying the letter of the divestiture order while ensuring the acquirer inherits a liability rather than a genuine competitor."
  - "An employee ordered by a hostile new manager to hand off a portion of their client accounts complies fully with the headcount but selects the highest-maintenance, lowest-revenue accounts to transfer, satisfying the demand for a fixed number of accounts while keeping the valuable relationships."
critical-questions:
  - "does this tactic depend on the receiving party being unable to inspect quality before accepting -- what happens when the counterparty can verify the value of what's being handed over before the deal closes, making instance-level sabotage detectable and treated as bad faith?"
  - "at what point does adversarial selection within a demanded category become indistinguishable from breaking the agreement outright, especially with poisoned animals or sabotaged troops meant to actively harm the receiver rather than merely disappoint them -- does discovery of active sabotage (versus mere low quality) collapse the entire peace and provoke worse retaliation than open refusal would have?"
  - "does relying on this tactic repeatedly train the stronger party to specify demands with much greater precision next time (naming individual assets rather than categories), eliminating the selection leverage for any future negotiation?"
status: active
