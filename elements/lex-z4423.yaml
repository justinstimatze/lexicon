lineage:
  - source: primary
    text: plutarch-c100-life-of-themistocles-hellespont-bridge
    citation: "Plutarch, Life of Themistocles, in Plutarch's Lives (c. 100 CE; Greek; John Dryden's 1683 translation as revised by Arthur Hugh Clough, 1859). Public domain. The episode follows immediately upon the Greek naval victory at Salamis, as Xerxes's land forces remained intact in Greece and his fleet had retreated toward the bridge of boats spanning the Hellespont."
    quote: "Themistocles, being desirous to try the opinion of Aristides, told him that he proposed to set sail for the Hellespont, to break the bridge of ships, so as to shut up, he said, Asia a prisoner within Europe; but Aristides, disliking the design, said, 'We have hitherto fought with an enemy who has regarded little else but his pleasure and luxury; but if we shut him up within Greece, and drive him to necessity, he that is master of such great forces will no longer sit quietly with an umbrella of gold over his head, looking upon the fight for his pleasure; but in such a strait will attempt all things; he will be resolute, and appear himself in person upon all occasions, he will soon correct his errors, and supply what he has formerly omitted through remissness, and will be better advised in all things. Therefore, it is noways our interest, Themistocles,' [he said,] 'to take away the bridge that is already made, but rather to build another, if it were possible, that he might make his retreat with the more expedition.' ... The prudence of Themistocles and Aristides in this was afterwards more fully understood at the battle of Plataea, where Mardonius, with a very small fraction of the forces of Xerxes, put the Greeks in danger of losing all."
canonical-instances:
  - "Aristides' counsel itself: leave the Hellespont bridge standing rather than trap Xerxes's still-substantial land forces in Greece with no way home."
  - "the battle of Plataea as after-the-fact validation: the small remnant force Mardonius commanded, fighting without the option of retreat home, nearly destroyed the Greeks despite being a fraction of the original army."
  - "a competitive-strategy instance: a dominant firm crushing a failing rival's last viable exit (acquisition offer, orderly wind-down) rather than allowing it, can provoke the cornered rival into scorched-earth tactics — predatory pricing, patent litigation, poaching — that cost the dominant firm more than tolerating the rival's retreat would have."
critical-questions:
  - "how does this differ from lex-5u3w3 (Fabius, avoid-decisive-battle-and-let-a-stronger-foe-decay)? lex-5u3w3 concerns an opponent who is CURRENTLY STRONGER, whose position is a wasting asset over time — the tactic is to deny battle altogether while the asymmetry resolves in your favor. This atom concerns an opponent who is ALREADY LOSING or retreating, where the battle has effectively been won — the tactic is not about whether to engage but about how completely to close off the beaten side's remaining options. Fabius is pre-victory patience; this atom is post-victory restraint. They compose across a single campaign's arc (deny battle while weak relative to the foe, then leave an exit once the foe is beaten) but target different decision points."
  - "how does this differ from lex-qa6hc (Sun Tzu, supreme-achievement-in-adversarial-contests-is-winning-without-direct-confrontation)? lex-qa6hc ranks strategies for AVOIDING or PRE-EMPTING confrontation altogether, with direct battle as the worst-case fallback. This atom presupposes confrontation has already occurred and been won; its question is narrower and occurs strictly in the endgame — what to do with a defeated opponent's remaining exit, not whether to fight in the first place."
  - "does this atom counsel mercy or forgiveness toward a beaten enemy? No — the counsel is purely calculative, not moral. Aristides' argument is explicitly about what maximizes Xerxes's fighting effectiveness, not about sparing him. The atom applies only when the opponent retains meaningful latent capacity that desperation could reactivate; an opponent with no capacity left regardless of motivation (fully disarmed, no remaining resources) falls outside its scope, since there is nothing left for desperation to activate."
