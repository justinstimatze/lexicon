id: lex-4xqm6
name: classify-hostility-as-structural-or-situational-before-valuing-the-prize
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a valuable opportunity comes bundled with an ongoing conflict, don't evaluate the opportunity's raw value in isolation from what kind of conflict comes with it -- Kautilya distinguishes an enemy whose hostility is tied to a fixed structural position from one whose hostility is merely situational, and argues the distinction should override the prize's apparent attractiveness: 'Which is better -- a rich land with permanent enemies or poor land without permanent enemies? Some teachers say that, because a rich land enables one to get wealth and an army with which to destroy the enemies, a rich land with permanent enemies is preferable. Kautilya disagrees. In acquiring land with such enemies, one only adds to one's number of enemies; and an enemy remains an enemy whether he is helped or harmed: on the other hand, a temporary enemy can be made to be quiet through favours or [at least] by not harming him.' The rival teachers' error is treating the rich land's own resources as the tool that will eventually solve the enemy problem it comes with -- more wealth, more army, eventually enough to destroy the permanent enemies. Kautilya's counter names why that plan fails specifically for THIS type of adversary: a 'permanent enemy,' defined here as one whose hostility is structurally tied to their position (robber bands, hostile tribes sheltered in the land's own bordering wilderness), doesn't respond to your resources one way or the other -- 'an enemy remains an enemy whether he is helped or harmed' -- so every resource spent against them is spent into a conflict with no exit condition. A temporary or situational enemy, by contrast, is hostile because of a specific, changeable circumstance, and can actually be pacified with a favor or simply by leaving them alone, meaning the conflict has a real off-ramp your resources can actually buy. The rich land's wealth-generating capacity is real, but it's being spent on a debt with no principal reduction, while the poor land's lower yield comes without that structural drain at all. Diagnostic move: before valuing an opportunity by its raw upside, classify any conflict that comes bundled with it -- is the hostility tied to a fixed structural feature of the situation (a position, an identity, a permanent territorial claim) that no amount of resource or goodwill from you will change, or is it tied to a specific, addressable circumstance that favors, concessions, or simple restraint could actually resolve -- because a structural conflict turns the opportunity's own resources into an ongoing cost with no natural end, while a situational one leaves the upside genuinely available once the specific friction is addressed."
