id: lex-29fvm
name: replace-definitional-question-with-operational-test
common-name: "Stop arguing what X means; agree on a test for X-behavior and run it"
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When a substantive dispute is GATED by a contested definition (what is intelligence, consciousness, art, democracy, harm, love), substitute an OPERATIONAL TEST that both sides will accept as evidence-producing regardless of how the definitional debate eventually resolves. The substitution does NOT close the philosophical question; it lets work proceed despite the question remaining open. Practitioner-discipline: (1) name the deadlocked definitional question, (2) propose a criterion that surfaces what the disputants are actually interested in (typically behavioral, observable, repeatable), (3) check whether both sides accept the criterion as DECISIVE-FOR-CURRENT-PURPOSES — not as a complete capture of the essence. Turing's move is the canonical case: 'can machines think?' is replaced by 'can a machine play the imitation game well enough to fool an interrogator over a teleprinter?' The substitution sidesteps the regress about defining 'machine' and 'think' and produces a research program. Transferable: operational definitions in physics (Bridgman 1927 — length IS what the measurement procedure yields), Popper's falsifiability (substitute 'would you accept this observation as falsifying?' for 'is it true?'), the legal 'reasonable person' standard, AI evals (every benchmark is a criterion-substitution), Dahl's polyarchy operationalization of democracy, institutional theory of art (X is art iff the artworld treats it as art). Failure-mode: criterion-creep (the test gets gamed, drifts from the underlying interest, and the substitution loses validity — Goodhart's law, lex-tb3re). Diagnostic: when a definitional argument has stalled, ask 'what would we agree to call decisive evidence?' If the answer is a test we can run, the substitution is alive; if both sides reject every proposed criterion, the definitional dispute is doing the work (sometimes legitimately — the essence-question matters because the answer changes downstream policy)."
related: [lex-3d2he, lex-3v22u, lex-656bb, lex-8f8jk, lex-8y3ch, lex-a886j, lex-eusdp, lex-fdvmu, lex-rq3jn, lex-sxt57, lex-tb3re, lex-w6v3m, lex-wtkuz]
scaffolds-from: [lex-tb3re, lex-656bb]
evokes: [the-imitation-game, behavioral-criterion-over-essence, operational-definition, run-the-test-stop-arguing-about-definitions, dissolve-the-question-by-substituting-a-test, what-would-count-as-evidence, falsifiability-without-essence]
lineage:
  - source: primary
    text: turing-1950-computing-machinery-and-intelligence
    citation: "A. M. Turing, 'Computing Machinery and Intelligence,' Mind 49(236):433-460 (October 1950). Section 1 'The Imitation Game' opens with the canonical statement of the criterion-substitution move: rather than define 'machine' and 'think' (a procedure Turing argues leads either to absurd Gallup-poll consensus-seeking or definitional regress), Turing REPLACES the question 'can machines think?' with the imitation game — an interrogator at a teleprinter, two hidden players (one human, one machine), and the operational criterion is whether the interrogator's identification rate against the machine matches the baseline against a human player. Section 2 'Critique of the New Problem' explicitly defends the substitution: 'as well as asking what is the answer to this new form of the question, one may ask, is this new question a worthy one to investigate? This latter question we investigate without further ado, thereby cutting short an infinite regress.' The transferable move is NOT the imitation game itself (which is one instance) but the META-MOVE of recognizing when a definitional dispute is blocking work and substituting an operationalizable criterion both sides will treat as decisive. Public domain (Crown copyright on a 1950 publication, expired UK 2000, PD globally)."
    quote: "[Turing 1950 Mind 49(236):433, opening of Section 1 — the canonical statement of the substitution move:] 'I propose to consider the question, Can machines think? This should begin with definitions of the meaning of the terms machine and think. The definitions might be framed so as to reflect so far as possible the normal use of the words, but this attitude is dangerous. If the meaning of the words machine and think are to be found by examining how they are commonly used it is difficult to escape the conclusion that the meaning and the answer to the question, Can machines think? is to be sought in a statistical survey such as a Gallup poll. But this is absurd. Instead of attempting such a definition I shall replace the question by another, which is closely related to it and is expressed in relatively unambiguous words.' [Section 1, the substituted operational criterion:] 'The new form of the problem can be described in terms of a game which we call the imitation game ... We now ask the question, What will happen when a machine takes the part of A in this game? Will the interrogator decide wrongly as often when the game is played like this as he does when the game is played between a man and a woman? These questions replace our original, Can machines think?' [Section 2, the meta-defense of substitution-without-essence:] 'As well as asking, What is the answer to this new form of the question, one may ask, Is this new question a worthy one to investigate? This latter question we investigate without further ado, thereby cutting short an infinite regress. The new problem has the advantage of drawing a fairly sharp line between the physical and the intellectual capacities of a man.' [Section 4, on why the substitution still moves the conversation forward even given the consciousness objection:] 'I do not wish to give the impression that I think there is no mystery about consciousness. There is, for instance, something of a paradox connected with any attempt to localise it. But I do not think these mysteries necessarily need to be solved before we can answer the question with which we are concerned in this paper.'"
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Prediction and Prophecy in the Social Sciences' (address delivered to the Plenary Session of the 10th International Congress of Philosophy, Amsterdam, 1948), Ch. 16 of Conjectures and Refutations (Routledge Classics, 2002), pp.463-464, Section X. Predates Dahl's 1971 polyarchy operationalization, already cited elsewhere in this atom, by 23 years."
    quote: "'There are only two kinds of governmental institutions, those which provide for a change of the government without bloodshed, and those which do not. But if the government cannot be changed without bloodshed, it cannot, in most cases, be removed at all... I personally prefer to call the type of government which can be removed without violence \"democracy\", and the other \"tyranny\". But, as I said, this is not a quarrel about words, but an important distinction between two types of institutions.'"
canonical-instances:
  - "Turing's own paradigm instance (Mind 49:433, 1950): 'can machines think?' is replaced by 'can a machine win the imitation game?' The substitution does NOT settle whether machines truly think; it produces a runnable test the result of which both sides will accept as evidence about something they care about. Transferable: every modern AI benchmark (HELM, MMLU, ARC, SWE-bench) is a Turing-style substitution — 'is this model intelligent?' becomes 'what is its score on this fixed task?' The benchmark is not the essence; it is the operational test the field agrees to run"
  - "Bridgman's operational definitions in physics (Bridgman 1927, The Logic of Modern Physics): 'what is length?' is replaced by 'length IS the set of operations by which length is measured.' The essence-question (does length exist independently of measurement?) is bypassed; the operational criterion gives physicists a workable handle and lets relativity proceed without resolving the metaphysics. The transferable shape: when a concept's essence is contested, identify the procedures already used to deploy the concept and let those procedures BECOME the definition for current purposes"
  - "Popper's falsifiability (Popper 1934, Logik der Forschung): 'is this theory true?' is replaced by 'would you accept this observation as falsifying it?' The substitution sidesteps the inductive-justification regress and produces a methodological criterion. A theory that proponents will not allow any observation to refute fails the test, regardless of how its essence is described. Same move as Turing — substitute an operational criterion both parties will accept as decisive for current purposes"
  - "the legal 'reasonable person' standard: 'was the defendant negligent?' is replaced by 'what would a reasonable person have done in the circumstances?' The legal system explicitly substitutes an operational criterion (a notional standard the jury can apply) for the essential question (what does negligence really mean?). Transferable across tort law, criminal law, constitutional law — the criterion-substitution is how doctrinal disputes get resolved into rulings without first settling philosophical disagreements about what reasonableness IS"
  - "Dahl's polyarchy operationalization (Dahl 1971, Polyarchy): 'is this country a democracy?' is replaced by 'does it meet operational tests X1..X8 (contested elections, broad participation, civil liberties, etc.)?' The substitution lets comparative political science proceed without first settling the philosophical question of what democracy IS. The Polity IV / V-Dem datasets are the modern extensions of the same move — measurable proxies that the field will accept as decisive for current purposes"
  - "Popper's earlier, single-criterion version (Conjectures and Refutations, 1963, Ch.16, drawn from a 1948 address): 'is this a democracy?' is replaced by 'can the government be changed without bloodshed?' Popper states the substitution explicitly as a refusal to argue definitions -- 'we need not quarrel about words, and about such pseudo-problems as the true or essential meaning of the word democracy... this is not a quarrel about words, but an important distinction between two types of institutions.' The criterion is coarser than Dahl's later multi-point checklist but makes the same move 23 years earlier: sidestep the essence-question by naming one observable, checkable property that both sides of a definitional dispute could agree to test for"
  - "institutional theory of art (Dickie 1974, Art and the Aesthetic): 'is this object art?' is replaced by 'has the artworld treated it as an artwork (gallery, critic, curator, audience)?' The essential question (what does art-ness consist of?) is bypassed; the operational criterion makes the question runnable. Same Turing-shape — substitute a behavioral/institutional test for the essence-question to let practice proceed"
  - "AI eval culture more broadly: every leaderboard is a Turing-substitution. 'Is this model good?' is replaced by 'what is its score on GSM8K / HumanEval / MMLU?' The benchmark is not the essence of intelligence or capability; it is the criterion the field will TREAT as decisive for the current purpose (model selection, paper publication, capability claim). When benchmarks saturate (the original Turing test arguably HAS saturated for short interactions with GPT-4 class models) the field substitutes a NEW operational criterion. The substitution chain is the transferable pattern; the specific benchmarks are instances"
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is the INTERNAL-NOTICING move (does this metacognitive notice route my next action?). lex-29fvm is the SOCIAL-METHODOLOGICAL move (does this criterion resolve a definitional dispute well enough to let work proceed?). Both involve 'operationalize' but at different scales — lex-wtkuz is intra-personal practice, lex-29fvm is inter-personal method. They co-fire when a person internalizes a discipline of substituting tests for self-definitions ('am I really a writer?' → 'what would I count as writing?')"
  - "operationally distinct from lex-8f8jk judge-by-consequential-fruits: lex-8f8jk (Jamesian pragmatism) substitutes EFFECTS for ORIGINS as the test; lex-29fvm substitutes an OPERATIONAL CRITERION for the DEFINITIONAL QUESTION itself. lex-8f8jk keeps the truth-question alive and routes it through fruits; lex-29fvm sets the truth-question aside in favor of an agreed criterion. They are sibling-pragmatist moves at adjacent axes — Turing's move is closer to operationalism (Bridgman) than to James, but both reject the priority of essence-questions"
  - "operationally distinct from lex-w6v3m computational-universality (Turing 1936): lex-w6v3m is a CLAIM about the equivalence of computational substrates (any universal machine emulates any other). lex-29fvm is a META-MOVE about how to handle definitional disputes. Same author, different paper, different substrate-shape. They co-fire in Turing 1950 Section 5 where universality grounds the claim that the operational criterion is hardware-independent — 'are there imaginable digital computers which would do well in the imitation game?' is the substituted criterion AND it inherits universality from lex-w6v3m, so the criterion is well-posed for the entire class of digital computers"
  - "the criterion-creep / Goodhart failure mode (lex-tb3re): when an operational test becomes the target rather than the proxy, it loses the relationship to the underlying interest. Modern Turing-test critique: GPT-4 can fool short-interaction interrogators, but this no longer tracks the original interest (general intelligence) because the test has been gamed by surface-imitation training. Practitioner-discipline: the substitution is alive only while the criterion still tracks the underlying interest; when it drifts, the substitution must be re-made with a new criterion. lex-29fvm produces criteria that need ongoing maintenance against lex-tb3re — they are co-load-bearing"
critical-questions:
  - "what is the definitional question that is GATING work? Name it precisely. Practitioner-discipline: if you cannot name a stalled definitional dispute, the substitution move may be premature — perhaps the work is not actually blocked. Turing identifies 'can machines think?' as the stalled question whose continued debate produces no research progress. Identify the analogue in your domain (is X art? is X conscious? is X discrimination? is X harm?) before proposing the substitution"
  - "is the proposed criterion accepted as DECISIVE-FOR-CURRENT-PURPOSES by both disputants, even though they may disagree it captures the essence? Turing-test legitimacy turns on this — opponents who reject the imitation game as a criterion are NOT being unreasonable; they are saying the substitution does not preserve what they care about. Practitioner-test: try the substitution and see who accepts it. The disputants who reject it are flagging that the essence-question matters to their downstream interests, which is diagnostic for whether the substitution is the right move"
  - "does the operational criterion still TRACK the underlying interest, or has it drifted into criterion-creep (lex-tb3re)? Modern Turing-test critique applies — a model that passes a short imitation game by surface-imitation training has not advanced general intelligence; the criterion has lost its grip on the original interest. Practitioner-discipline: periodically test whether the proxy still reflects the construct. When it drifts, propose a new substitution. The substitution chain is the transferable practice; the individual criteria have lifespans"
  - "is the definitional dispute LEGITIMATELY essential, or is it a stalling tactic? Some definitional disputes are doing real work because the essence-answer changes downstream policy (is the embryo a person? — substituting an operational test bypasses precisely what the dispute is about). Other definitional disputes are stalling tactics where the disputants do not actually care about the essence but want to delay action. Practitioner-question: would the disputants ACCEPT downstream consequences that flow from the criterion-substitution? If yes, the substitution is productive; if no, the essence-question is doing real work and the substitution is the wrong move"
  - "what is the relationship between this criterion and the prior criterion it replaces? Turing's imitation game replaced no specific prior criterion — it stood up where there had been none. But in mature domains the substitution is criterion-vs-criterion (a new benchmark replacing a saturated one). The successor must (a) cover what the predecessor covered, (b) close the loophole the predecessor leaked, and (c) re-anchor to the underlying interest. Practitioner-discipline: when proposing the substitution, articulate not just what new criterion is in but what old criterion (if any) is being retired and why"
status: active
