id: lex-kauj6
name: coerced-assent-is-worthless-only-free-assent-has-value
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When conformity is being enforced -- ideological, religious, cultural, organizational -- check whether the assent being produced is actually worth anything, independent of whether the enforcement succeeds. Popper names the lesson he says the religious wars taught: 'We learnt that religious faith and other convictions can only be of value when they are freely and sincerely held, and that the attempt to force men to conform was pointless because those who resisted were the best, and indeed the only ones whose assent was worth having.' The argument isn't that forced conformity is cruel, or that it usually fails to stick. A fully successful campaign of forced conformity produces nothing of the value it was aimed at, because the thing being sought -- genuine conviction -- cannot exist in coerced form by definition. Compliance obtained by force isn't a lesser version of the goal; it's a different thing that only resembles the goal from outside. And the people who resisted the coercion turn out to be exactly the ones whose eventual agreement would have been worth something, since resisting is itself evidence that a conviction, once reached, would be genuinely their own. Diagnostic move: before investing effort in enforcing agreement -- a company culture, an ideological line, a shared belief -- ask what success would actually produce. If the answer is compliance rather than conviction, the campaign can succeed completely and still have manufactured nothing of value."
