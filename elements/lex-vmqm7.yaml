lineage:
  - source: primary
    text: cushing-people-disbelieve-the-ugly-boy-and-pay-for-it-anyway
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Ugly Wild Boy Who Drove the Bear Away from Southeastern Mesa.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'A few believed in what the boy said; and some, because he was ugly, would not believe it and would not go; and thus were as much hindered from gathering grass-seed and nuts for daily food as if the Bear had been really there. You know people nowadays are often frightened by such a kind of Bear as this.'"
canonical-instances:
  - "A junior employee who is often dismissed for their inexperience correctly identifies that a supplier issue has been resolved and it's safe to resume orders, and a manager who ignores the report because of the source keeps the team operating under costly emergency procedures for weeks after the actual problem ended."
  - "A community dismisses a local eccentric's accurate report that a contaminated well has been cleaned and retested safe, and continues hauling water from a farther source for months, paying the same ongoing cost in time and effort as if the contamination had never been fixed."
critical-questions:
  - "Is the villagers' skepticism actually irrational given the boy's reputation and appearance, or would a reasonable person in their position have demanded some form of verification before risking a trip to a mountain that recently held a dangerous Bear -- does the story treat their doubt as foolish or merely costly?"
  - "Would the outcome have been different if the boy had brought back some proof, a trophy from the Bear or a witness, rather than simply announcing the result from a rock -- does the story suggest any middle path between blind trust and costly disbelief?"
  - "Is there a meaningful asymmetry here between the cost of wrongly believing a false all-clear (walking into a mountain where the Bear is still present) and the cost of wrongly disbelieving a true one (missing a season's harvest), and does that asymmetry justify caution even at real cost?"
