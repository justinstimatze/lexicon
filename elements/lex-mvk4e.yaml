id: lex-mvk4e
name: what-arises-dependently-is-neither-identical-nor-different-from-its-basis
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Nagarjuna runs the same reductio twice in this chapter, once on the self and once as a general rule. On the self: if it were identical to the aggregates (body, sensation, perception, dispositions, cognition), it would arise and cease exactly as they constantly do; if it were something different from them, it would be unknowable through them, and their fate would have nothing to do with its fate -- both options fail, and not because the self is some third, stranger kind of thing, but because 'identical or different' was never the right pair of options for something that only exists in dependence on its basis. He then states the general form directly: whatever comes into being dependent on another is not identical to that thing, nor is it different from it. The dichotomy itself doesn't apply to a dependency relation. Asking 'is X the same as Y, or is X a separate thing from Y?' presupposes X and Y are the kind of things that could stand in either relation -- and a thing that only exists BECAUSE OF Y was never a free-standing candidate for that comparison in the first place. Recognize the same shape whenever something under discussion only exists in dependence on something else, and the conversation is stuck forcing it into a same-or-different binary. An organization's culture, years after its founders left, persists in a form no longer under their control -- calling it simply theirs, or simply not, both miss what it's actually doing. A person carries decades of replaced cells and revised memories behind one name, which a same-or-different question can't cleanly parse. A running program only exists at all once its code meets a particular interpreter, runtime, and machine state at a particular moment, which is exactly why asking whether the process 'is' the code stalls out."
related: [lex-6xw55]
evokes: [nagarjuna-mmk-18-1, nagarjuna-mmk-18-10, dependent-origination, self-and-the-aggregates, neither-identical-nor-different, pratityasamutpada]
lineage:
  - source: primary
    tradition: madhyamaka
    text: nagarjuna-mmk-18-1
    citation: "Nagarjuna, Mulamadhyamakakarika 18.1, trans. Jay L. Garfield, The Fundamental Wisdom of the Middle Way (Oxford University Press, 1995), p.245, Chapter XVIII 'Examination of Self and Entities.'"
    quote: "'If the self were the aggregates, / It would have arising and ceasing (as properties). / If it were different from the aggregates, / It would not have the characteristics of the aggregates.'"
  - source: primary
    tradition: madhyamaka
    text: nagarjuna-mmk-18-10
    citation: "Nagarjuna, Mulamadhyamakakarika 18.10, trans. Jay L. Garfield, The Fundamental Wisdom of the Middle Way (Oxford University Press, 1995), p.252, Chapter XVIII 'Examination of Self and Entities.'"
    quote: "'Whatever comes into being dependent on another / Is not identical to that thing. / Nor is it different from it. / Therefore it is neither nonexistent in time nor permanent.'"
canonical-instances:
  - "An organization's culture, years after its founders have left, is neither the SAME as what the founders built (it keeps changing under people who never met them) nor a wholly SEPARATE thing (it only exists at all because of decisions those founders made) -- the culture is a dependent continuation, and the same-or-different question misdescribes it."
  - "Asking whether a person at 70 is 'the same person' as at 20, given decades of replaced cells and revised memories, assumes identity and difference are the only two available relations. What actually holds them together is a dependent continuity, each state arising from the last without any of them ever being a fixed, self-standing essence -- a relation the identity/difference pair was never built to capture."
  - "A running program is not identical to its source code (the code alone does nothing; the running process has state the code doesn't) and not simply different from it either (nothing about the running process is independent of the code) -- it is dependently arisen from the code plus an interpreter, a runtime, and a particular machine state, and asking whether it's 'really' the code or something else forces a false choice."
  - "Operationally distinct from lex-6xw55 same-text-in-different-context-is-a-different-work: Borges's claim is that identical marks, reproduced in a new context of utterance, genuinely constitute a DIFFERENT work -- it resolves a same-or-different question by answering 'different.' This atom is about a DEPENDENT thing relative to its basis (a self relative to its aggregates, an effect relative to its cause) and argues the same-or-different question doesn't have either answer, because dependency escapes the dichotomy rather than landing on one side of it."
critical-questions:
  - "Is 'neither identical nor different' always the right answer, or can it become a way to dodge a question that actually does have a determinate one? A photocopy of a document is simply a copy -- there's no ongoing, ineffable dependency escaping the same-or-different frame here, only a one-time mechanical duplication with a perfectly answerable identity question. The move earns its keep specifically where the dependency stays live and open-ended, and reaching for it on a closed, static case like a photocopy just muddies a question that was never hard."
  - "When a stakeholder legitimately needs a yes-or-no answer -- is this code MY code, for licensing purposes; is this person legally the same individual they were before a change of name or identity -- does insisting on the dependent-origination frame actually help, or does it just refuse to answer a question institutions need answered?"
status: active
