    quote: "“The implicit assumption seems to be that if everyone agrees on a value judgment, then it is not a value judgment at all, but is perfectly ‘objective’. ... Unanimous value judgments may provide the basis of a great deal of welfare economics, but this is so not because these are not value judgments, but because these value judgments are acceptable to all.”"
canonical-instances:
  - "Hypothetical: A style guide calls its ban on a slur 'not really a value judgment, just objectively correct usage,' pointing out that literally no one on the team disputes it. The rule is a value judgment about what language causes harm -- it's simply one so widely shared inside this team that it never surfaces as contested, and that unanimity describes the team, never the rule itself."
  - "Hypothetical: An engineering org treats 'don't ship code that deletes user data without confirmation' as a pure technical requirement rather than a value choice, since no engineer has ever argued the other side. The moment a cost-cutting proposal suggests skipping the confirmation step to speed up a migration, the value judgment that was there all along becomes visible, contested for the first time rather than newly created."
critical-questions:
  - "If a value judgment is unanimous and stays unanimous forever, does the distinction actually matter for anything practical? It matters for how the judgment gets treated when circumstances change or a new stakeholder arrives who doesn't share it. A fact gets updated the moment new information arrives; a value judgment mislabeled as one has no established channel for that update to travel through."
  - "Isn't Sen just playing semantics here -- if a claim behaves exactly like a fact in every situation anyone actually encounters, why does its formal classification matter? It matters at the moment classification and behavior come apart, which is precisely when consensus breaks: a claim that's been treated as a settled fact for decades has no ready mechanism for principled disagreement, while a claim correctly understood as a widely shared value at least has the vocabulary already in place."
