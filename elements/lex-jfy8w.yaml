lineage:
  - source: primary
    tradition: bregman-most-people-decent
    text: bregman-2019-humankind
    citation: "Rutger Bregman, Humankind: A Hopeful History, trans. Elizabeth Manton and Erica Moore (Little, Brown and Company, 2020), Chapter 1 (A New Realism)."
    quote: "There is a persistent myth that by their very nature humans are selfish, aggressive and quick to panic. It's what Dutch biologist Frans de Waal likes to call veneer theory: the notion that civilisation is nothing more than a thin veneer that will crack at the merest provocation. In actuality, the opposite is true. It's when crisis hits — when the bombs fall or the floodwaters rise — that we humans become our best selves."
  - source: primary
    tradition: bregman-most-people-decent
    text: bregman-2019-humankind
    citation: "Rutger Bregman, Humankind: A Hopeful History, trans. Elizabeth Manton and Erica Moore (Little, Brown and Company, 2020), Chapter 1."
    quote: "The Germans, she said, don't believe in humanity's innate goodness. A member of the Parisian intelligentsia assured me that the French need government's firm hand. And when I toured the United States after the 2016 presidential election, everyone, everywhere, asked me if my head was screwed on straight. Most people are decent? Had I ever turned on a television? […] We are trained to see selfishness everywhere. See someone helping an elderly person cross the street? What a show-off."
  - source: primary
    tradition: bregman-most-people-decent
    text: bregman-2019-humankind
    citation: "Rutger Bregman, Humankind: A Hopeful History, trans. Elizabeth Manton and Erica Moore (Little, Brown and Company, 2020), Chapter 4 (Colonel Marshall and the Soldiers Who Wouldn't Shoot)."
    quote: "Marshall […] found a heretofore usually unrealized resistance toward killing a fellow man that he will not of his own volition take life. Most people, he wrote, have a 'fear of aggression' that is a normal part of our 'emotional make-up.'"
canonical-instances:
  - "The Blitz (London 1940-1941) — government planners expected mass-panic and psychological collapse; instead the population displayed sustained cooperative behavior even under sustained bombing. Bregman's canonical case."
  - "Hurricane Katrina 2005 New Orleans — media narrative emphasized looting and violence; the empirical reality (per multiple academic studies after the fact, including Solnit's *A Paradise Built in Hell*) was widespread mutual aid and reduced-not-elevated violent crime."
  - "The actual 'Lord of the Flies' — six Tongan boys marooned on 'Ata 1965-1966; survived 15 months by cooperation, rotation of duties, conflict-resolution rituals, never reverted to Golding's predicted savagery. Bregman surfaced this case prominently."
  - "Marshall 1947 *Men Against Fire* — the contested empirical claim that only ~15-25% of WWII US infantry actually fired their weapons in combat, suggesting innate resistance to killing. Even critics granted that some real fire-rate gap existed."
  - "Institutional design for trust — Buurtzorg (Dutch home-care org with no managers, just self-organized nursing teams) operates on default-trust assumption and outperforms managed competitors on outcome and cost; high-surveillance call centers operating on veneer-theory assumption underperform on quality and turnover."
  - "Drug-court / restorative-justice programs vs traditional punitive sentencing — assume offender capacity for prosocial behavior; produce lower recidivism than veneer-theory-based incarceration."
