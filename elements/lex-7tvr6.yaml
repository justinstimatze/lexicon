id: lex-7tvr6
name: outside-view-anchor-on-reference-class-base-rate-before-inside-view
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When forecasting an outcome (project duration, policy effect, business success, geopolitical event, personal-life decision), do not start from the case's specific details (inside view). Start from a reference class of comparable cases and their base rates (outside view). Ask: how often do things of this sort happen in situations of this sort? Only THEN adjust for what distinguishes the specific case. Inside-view-only forecasting chronically underestimates duration and difficulty (planning fallacy) and overestimates success-probability because the forecaster's narrative is anchored on the case's apparent uniqueness rather than on the empirical record of similar cases. Diagnostic intervention: before issuing any forecast, name the reference class you'd assign the case to, look up or estimate the base rate, then justify any deviation from that base rate."
related: [lex-2rpxq, lex-2rsad, lex-4d53x, lex-5f2nj, lex-a55ep, lex-chp44, lex-fr9gf, lex-hbanm, lex-kyc5a, lex-nx7u7, lex-rcj6y, lex-rqbsr, lex-s7jjg, lex-s7qxv, lex-tmy67, lex-vkhp7, lex-w4x7b, lex-y48fs, lex-ythes]
scaffolds-from: [lex-vkhp7, lex-a55ep]
evokes: [outside-view, reference-class-forecasting, kahneman-lovallo-1993, tetlock-gardner-2015, superforecasting, planning-fallacy, base-rate-neglect, flyvbjerg-megaprojects, peter-backus-fermi-estimate, larry-summers-correction-factor, how-often-do-things-of-this-sort-happen, anchor-on-base-rate-not-on-narrative]
lineage:
  - source: primary
    text: tetlock-gardner-2015-superforecasting
    citation: "Philip E. Tetlock and Dan Gardner, *Superforecasting: The Art and Science of Prediction* (Crown, 2015), Ch.4 'Superquants?' + Ch.5 'Supersmart?' + Appendix 'Ten Commandments for Aspiring Superforecasters' (Commandment 3: 'Strike the right balance between inside and outside views'). Tetlock (University of Pennsylvania; Annenberg University Professor; principal investigator of the IARPA Aggregative Contingent Estimation (ACE) tournament 2011-2015, the most rigorous large-scale forecasting study ever conducted) consolidates the operational findings of the Good Judgment Project — the four-year IARPA-funded forecasting tournament involving thousands of volunteer forecasters making ~500,000 probability estimates on ~500 geopolitical and economic questions. The transferable claim Tetlock-Gardner operationalize from Kahneman & Tversky's earlier theoretical work: superior forecasters START from a REFERENCE CLASS of comparable cases and their empirical base rates (the OUTSIDE VIEW), then adjust for what distinguishes the specific case (the INSIDE VIEW). Inferior forecasters reverse the order — they start from the case's specific details and never anchor on the empirical record of similar cases. Tetlock-Gardner Appendix Commandment 3 (pp. 277-278 of 2015 ed.): 'Superforecasters know that there is nothing new under the sun. Nothing is 100% \"unique.\" Language purists be damned: uniqueness is a matter of degree. So superforecasters conduct creative searches for comparison classes even for seemingly unique events, such as the outcome of a hunt for a high-profile terrorist (Joseph Kony) or the standoff between a new socialist government in Athens and Greece's creditors. Superforecasters are in the habit of posing the outside-view question: How often do things of this sort happen in situations of this sort?' The canonical Tetlock-Gardner illustration (Appendix p. 278): Larry Summers (Harvard professor + former Treasury Secretary) corrects employee project-duration estimates by doubling and moving to the next time unit: 'If the research assistant says the task will take an hour, it will take two days. If he says two days, it will take four weeks.' Summers is applying the outside view to his employees' inside-view estimates because he knows employees chronically underestimate task duration (the planning fallacy — Kahneman & Tversky 1979 + Buehler-Griffin-Ross 1994). The transferable form lex-7tvr6 captures: outside-view-first is the foundational forecasting discipline that distinguishes calibrated forecasters from over-confident ones. It works because narrative-based inside-view forecasting (the forecaster constructs a vivid story about how the specific case will unfold) chronically over-weights case-specific details and under-weights the empirical record of similar cases. Tetlock-Gardner's empirical contribution: in the IARPA tournament, the top 2% of forecasters (the 'superforecasters') ALL exhibited the habit of reference-class-first forecasting. This was not the only discriminating feature (also: frequent small Bayesian updates, intellectual humility, probabilistic granularity, post-mortem self-correction), but it was the most consistently-applied foundational discipline. The original theoretical formulation: Kahneman & Lovallo 1993 'Timid Choices and Bold Forecasts: A Cognitive Perspective on Risk Taking' *Management Science* 39(1):17-31 introduced the inside-view / outside-view distinction; Kahneman's 2011 *Thinking, Fast and Slow* (Ch.23 'The Outside View') elaborated. Bent Flyvbjerg operationalized the framework for megaproject management ('reference class forecasting'), publishing in transportation engineering literature (Flyvbjerg 2006 *Project Management Journal*; Flyvbjerg-Holm-Buhl 2002 *Journal of the American Planning Association*) and in his MIT-Sloan + Oxford-Saïd work. The framework is now substantially institutionalized in mainstream forecasting practice across project management (UK Treasury Green Book references reference-class forecasting for megaprojects since 2003), corporate strategic planning, intelligence analysis (CIA Tradecraft Primer 2009 includes 'structured analytic techniques' that operationalize outside-view), and the broader forecasting-tournament literature. The transferable form is the diagnostic: identify the reference class FIRST, look up or estimate the base rate, justify any deviation from the base rate."
    quote: "Superforecasters know that there is nothing new under the sun. Nothing is 100% 'unique.' Language purists be damned: uniqueness is a matter of degree. So superforecasters conduct creative searches for comparison classes even for seemingly unique events, such as the outcome of a hunt for a high-profile terrorist (Joseph Kony) or the standoff between a new socialist government in Athens and Greece's creditors. Superforecasters are in the habit of posing the outside-view question: How often do things of this sort happen in situations of this sort? (Tetlock & Gardner 2015, Appendix Commandment 3)"
  - source: cross-attestation
    text: kahneman-lovallo-1993-flyvbjerg-megaprojects-cross-attestation
    citation: "Cross-tradition attestation of the outside-view / reference-class-first forecasting discipline. (a) Kahneman & Lovallo 1993 'Timid Choices and Bold Forecasts: A Cognitive Perspective on Risk Taking' *Management Science* 39(1):17-31: the original theoretical formulation of inside-view vs. outside-view. Kahneman-Lovallo's diagnostic: the inside view starts from the project's specific features and constructs a forecast by simulating how the project will unfold; the outside view starts from the distribution of outcomes for comparable projects. The two views often produce wildly divergent forecasts; the outside view is reliably more accurate because the inside view is anchored on case-specific narrative rather than on the empirical-statistical record. (b) Kahneman 2011 *Thinking, Fast and Slow* (Farrar, Straus and Giroux) Ch.23 'The Outside View': the popular-clinical synthesis of the framework. Kahneman's central case: his own curriculum-development team in the 1970s constructed a project plan estimating 2 years to completion (inside view); when Seymour Sarason asked Kahneman to look up the base-rate distribution of similar curriculum-development projects (outside view), the base rate was 7-10 years to completion with 40% of projects never completing at all. The team finished in 8 years. The inside-view estimate was wildly optimistic; the outside-view base rate was empirically validated. (c) Flyvbjerg 2006 'From Nobel Prize to Project Management: Getting Risks Right' *Project Management Journal* 37(3):5-15 + Flyvbjerg-Holm-Buhl 2002 'Underestimating Costs in Public Works Projects: Error or Lie?' *Journal of the American Planning Association* 68(3):279-295: the operational extension to megaproject management. Flyvbjerg's empirical work documented systematic cost-overrun + duration-overrun in transportation megaprojects (averaging ~28% cost overrun, ~20% duration overrun across hundreds of projects). The reference-class forecasting methodology Flyvbjerg developed (build a database of comparable projects; locate the new project's category in the reference class; apply the reference class's empirical distribution as the base forecast; adjust for project-specific factors) is now standard practice in the UK Treasury Green Book (since 2003), the European Commission's Better Regulation Toolbox, and major-project assurance frameworks in multiple OECD countries. (d) Buehler, Griffin & Ross 1994 'Exploring the \"Planning Fallacy\": Why People Underestimate Their Task Completion Times' *Journal of Personality and Social Psychology* 67(3):366-381: the experimental documentation of the planning-fallacy phenomenon that lex-7tvr6's outside-view discipline corrects. Subjects asked to estimate their own task-completion times reliably underestimated; subjects asked to estimate similar tasks completed by others did NOT underestimate. The inside-view / outside-view distinction operationalized in laboratory psychology. (e) The IARPA ACE tournament results (Mellers, Stone, Atanasov, Rohrbaugh et al. 2015 'The Psychology of Intelligence Analysis: Drivers of Prediction Accuracy in World Politics' *Journal of Experimental Psychology: Applied* 21(1):1-14): empirically, superforecasters consistently exhibited the outside-view-first habit; the absence of this habit was one of the strongest negative predictors of forecasting accuracy. (f) Klein 2007 *Source of Power* + Klein-Snowden 2009 cynefin-framework operationalize related discipline (premortem; structured analytic technique) — the premortem is one specific outside-view technique (imagine the project has failed; what reference-class of failed-project explanations is most likely?). lex-fr9gf (Klein 2007 premortem) is the substrate's existing primitive for one specific outside-view operational technique; lex-7tvr6 is the broader critical primitive that lex-fr9gf is one application of. (g) The forecasting-tournament literature broadly: Atanasov-Rauchhaus-Mellers-Tetlock 2017 'Distilling the Wisdom of Crowds' *Management Science* 63(3):691-706; Mellers-Tetlock-Karim-Atanasov 2019 'Bias, Information, Noise: The BIN Model of Forecasting' *Management Science* 65(11):4946-4955; the substantial body of work documenting the operational discipline. The cross-attestation is overwhelming — the outside-view / reference-class-first forecasting discipline is one of the best-replicated findings in applied judgment research. The transferable position lex-7tvr6 takes: carry the discipline as pivotal; operational variants (premortem; reference-class forecasting; structured analytic technique) are downstream applications."
    quote: "Kahneman 2011 *Thinking, Fast and Slow* Ch.23: 'The outside view is implemented by using a large database, which provides information on both plans and outcomes for hundreds of projects all over the world, and can be used to provide statistical information about the likely overruns of cost and time, and about the likely underperformance of projects of different types... The renowned Danish planning expert Bent Flyvbjerg, now at Oxford University, offered a forceful summary: \"The prevalent tendency to underweight or ignore distributional information is perhaps the major source of error in forecasting. Planners should therefore make every effort to frame the forecasting problem so as to facilitate utilizing all the distributional information that is available.\"' // [Buehler, Griffin & Ross 1994 is the source of the self-vs-other asymmetry this atom leans on — self-estimates of completion time run short while estimates for comparable others do not. Stated here as summary rather than quotation: it was previously set as a verbatim quote inside this Kahneman entry, although Thinking, Fast and Slow never names Buehler, and the 1994 paper is not among the sources this lineage cites.]"
canonical-instances:
  - "Larry Summers's employee-estimate correction (Tetlock-Gardner Appendix p. 278): Summers doubles employee estimates and moves to the next time unit. 'If the research assistant says the task will take an hour, it will take two days. If he says two days, it will take four weeks.' Summers applies the outside view to employees' chronically-inside-view estimates. The correction-factor encodes empirical knowledge about the planning-fallacy distribution"
  - "Kahneman's own curriculum-development team (1970s, recounted in *Thinking, Fast and Slow* Ch.23): inside-view plan = 2 years to completion. Outside-view base rate (similar curriculum-development projects): 7-10 years to completion with 40% non-completion. Actual outcome: 8 years to completion. Inside-view forecast was wildly optimistic; outside-view base rate was empirically accurate. This is the canonical autobiographical case Kahneman uses to illustrate the framework"
  - "Flyvbjerg megaproject reference-class forecasting (Flyvbjerg-Holm-Buhl 2002 + Flyvbjerg 2006): transportation megaprojects (highways, railways, bridges, tunnels) systematically run over budget by ~28% and over schedule by ~20% relative to inside-view forecasts. Reference-class forecasting methodology: build a database of comparable completed projects; assign the new project to a reference class; apply the reference class's empirical distribution as the base forecast; adjust for specific factors. Adopted as standard practice in UK Treasury Green Book (2003+), European Commission Better Regulation Toolbox, and multiple OECD major-project assurance frameworks"
  - "Peter Backus 'I have no chance of finding a girlfriend in London' analysis (Tetlock-Gardner Ch.4): Backus uses Fermi-estimation to estimate dating-pool size — start with London population (6M) × P(woman) × P(single) × P(right-age) × P(university-graduate) × P(attractive-to-him) × P(he-attractive-to-her) × P(compatible). Result: ~26. This is the outside-view discipline operationalized for personal-decision forecasting: anchor on base-rate decomposition first, then specify"
  - "Iraq WMD intelligence failure (Tetlock-Gardner Appendix Commandment 6 + Ch.10 + the Robb-Silberman Commission 2005 report): the 2002 National Intelligence Estimate stated that Iraq had active WMD programs with high confidence. Outside-view question never explicitly asked: of countries where dictator-led regimes are accused of WMD by an intelligence agency about to go to war with them, what fraction historically have actual active programs vs. abandoned programs vs. never-existed programs? Inside-view evidence (Curveball testimony, aluminum tubes, Niger uranium documents) anchored the analysis on the specific narrative; outside-view would have flagged the base-rate prior as much lower. Post-mortem analyses (Robb-Silberman 2005; Senate Select Committee on Intelligence 2008) name this as one of the structural failures"
  - "Software development time estimates: Standish Group's CHAOS report (1994-2020+) documents that ~30% of IT projects are completed on time and on budget; ~50% are 'challenged' (some combination of overrun, scope-reduction, or feature-cuts); ~20% fail outright. Inside-view software estimates chronically under-predict by factors of 2-3x; outside-view reference-class forecasting (look at the empirical distribution of comparable projects' actual durations) consistently outperforms. Pattern: known well in software-management literature (Brooks 1975 *Mythical Man-Month* names the underlying mechanism; Kahneman-Lovallo 1993 names the cognitive-psychology operation) yet inside-view estimates persist because the forecaster's narrative is anchored on the specific project"
  - "Police-shooting prediction in the IARPA ACE tournament (Tetlock-Gardner Ch.5): superforecasters asked to predict probability of specific geopolitical outcomes (e.g., 'will North Korea conduct a nuclear test in the next 6 months?') start from base-rate: how often have countries-like-North-Korea conducted nuclear tests in 6-month windows historically? Then adjust for current-specific factors (recent rhetoric, leadership transitions, sanctions). Inside-view-only forecasters anchor on current-narrative and over- or under-predict; outside-view forecasters track the base-rate and adjust marginally. Empirical result: outside-view-first forecasters scored significantly better on Brier scores"
  - "Operationally distinct from lex-2rpxq hedgehog-vs-fox (Berlin + Tetlock 2005): lex-2rpxq names the cognitive-style taxonomy (centripetal one-big-thing vs centrifugal many-things). lex-7tvr6 names a specific operational discipline (reference-class first). Foxes are MORE LIKELY to apply the outside view because their multi-framework cognitive-style accommodates the comparison-class search; hedgehogs are LESS LIKELY because their single-framework cognitive-style encourages inside-view narrative-construction within the framework. But the connection is empirical-correlational, not definitional. A hedgehog CAN learn the outside-view discipline; a fox CAN fail to apply it. Compositionally: lex-2rpxq is the style; lex-7tvr6 is one specific operational discipline that the style influences"
  - "Operationally distinct from lex-fr9gf premortem (Klein 2007): lex-fr9gf is the SPECIFIC TECHNIQUE of imagining the project has failed and asking what reference class of failed-project explanations is most likely. lex-7tvr6 is the BROADER PRINCIPLE that outside-view reference-class forecasting should precede inside-view adjustment. Premortem is one operational variant of lex-7tvr6; structured analytic techniques (CIA Tradecraft Primer 2009), red-teaming, and reference-class forecasting (Flyvbjerg) are other operational variants. lex-7tvr6 is the key principle; lex-fr9gf + structured techniques are the downstream applications"
  - "Operationally distinct from lex-rcj6y motivated-reasoning: lex-rcj6y names a synchronic-bias mechanism (evaluating evidence with motivated standards). lex-7tvr6 names a discipline that PARTIALLY ADDRESSES lex-rcj6y by anchoring forecasts on empirical-distributional data rather than on motivated narrative-construction. lex-rcj6y is the failure-mode; lex-7tvr6 is one structural intervention against it. The intervention works because base-rate data is more resistant to motivated-reasoning than narrative-evaluation (it is harder to motivated-reason a distribution than a story)"
  - "Operationally distinct from lex-2rsad identity-protective-belief-maintenance: lex-2rsad names the resistance to disconfirming evidence when the belief is identity-constitutive. lex-7tvr6 names the FORECASTING discipline of starting from base rates. The two atoms compose at the failure-mode level: identity-protected forecasters resist the outside view BECAUSE the outside view would force them to update beliefs the inside view defends; the outside-view discipline is therefore HARDEST to apply when identity is at stake. The Iraq WMD case illustrates this composition — the inside-view anchoring on Curveball testimony + aluminum-tubes evidence was identity-protected by the administration's prior commitment to the war narrative"
  - "Operationally distinct from lex-vkhp7 hindsight-bias (Heuer): lex-vkhp7 names the post-event distortion in retrospective evaluation. lex-7tvr6 names the pre-event forecasting discipline. The two atoms compose: outside-view forecasters who track their predictions and review them WITHOUT hindsight-bias-correction (lex-vkhp7's discipline) calibrate over time. The Good Judgment Project's tournament structure operationalizes both: forecasts are recorded at the time + Brier scores evaluated against actual outcomes (lex-vkhp7 corrective) + reference-class-forecasting habit (lex-7tvr6)"
  - "Composes with lex-y48fs pyramid-of-choice (Tavris-Aronson): the pyramid-of-choice mechanism produces self-justifying inside-view narratives that resist outside-view correction. Each step down the pyramid increases the inside-view forecaster's commitment to the current-narrative and decreases their willingness to consult the empirical base rate that might contradict it. lex-7tvr6's outside-view discipline is structurally hardest to apply for forecasters deep in pyramid-of-choice trajectories. The diagnostic-composition: when forecasts deviate from base rates without explicit justification, suspect pyramid-of-choice commitment to inside-view narrative"
  - "Composes with lex-chp44 meta-pointer (consciousness-as-after-the-fact-observer): the inside view is partly a meta-pointer operation — the forecaster constructs a vivid post-hoc-style narrative about how the future will unfold, anchored on the present moment's salient features. The outside-view discipline interrupts the meta-pointer's narrative-construction by forcing the forecaster to consult empirical-distributional data BEFORE constructing the inside-view story. The intervention works at the cognitive-architecture level: outside-view-first changes which cognitive process runs first"
critical-questions:
  - "is the inside view / outside view distinction always clean in practice, or do many real-world forecasts require both views in interleaved iteration? Kahneman-Lovallo 1993 + Kahneman 2011 acknowledge that the distinction is methodological-procedural rather than strictly categorical — most real forecasts combine some inside-view detail-attention with outside-view base-rate-anchoring. The transferable position: the SEQUENCING discipline matters (outside-view first, inside-view adjustment second) even when the content is mixed. Pure outside-view forecasts (just apply the base rate) under-use case-specific information; pure inside-view forecasts (ignore the base rate) systematically over- or under-predict. The Bayesian-in-spirit synthesis Tetlock-Gardner describe (use base rate as prior; update on case-specific evidence) is operationally the right balance"
  - "what counts as a 'reference class' is a methodological choice with consequences; can the outside-view discipline be gamed by choosing convenient reference classes? Yes — the choice of reference class can be manipulated to produce desired base rates. Flyvbjerg 2006 addresses this directly: the reference class should be (a) similar enough to the target case that base rates are predictive; (b) broad enough that sample sizes support statistical inference; (c) selected BEFORE the forecaster knows the inside-view narrative (to prevent post-hoc rationalization). The transferable form: name the reference class explicitly + ex ante, defend its similarity-and-breadth, and accept that the choice introduces interpretive judgment. The choice problem does not invalidate the discipline; it shifts the rigor-requirement from the forecast to the class-selection step"
  - "does outside-view forecasting always beat inside-view forecasting, or are there domains where inside-view is reliably better? Domains where inside-view can outperform outside-view: (i) truly novel cases with no comparable reference class (genuinely unprecedented events — though Tetlock-Gardner argue these are rarer than they appear); (ii) cases where the forecaster has strong CAUSAL-mechanistic understanding that the reference class lacks (e.g., a domain expert may have inside-view knowledge that improves on a layperson's reference-class application); (iii) very-short-time-horizon forecasts where current-state evidence dominates. The transferable diagnostic: outside-view discipline is the default; inside-view-priority is a defensible exception that should be explicitly justified. The Tetlock-Gardner tournament data show the default is correct in most empirical cases"
  - "does the outside-view framework adequately address black-swan / fat-tailed distributions where the reference-class average is misleading because the variance is enormous and the tail dominates? Taleb 2007 *Black Swan* + Taleb 2012 *Antifragile* (both in) argue that conventional reference-class forecasting fails when distributions are power-law-tailed because the historical sample under-represents the tail probabilities. The transferable response: lex-7tvr6 names the OUTSIDE-VIEW DISCIPLINE; when the reference class has fat tails, the discipline must include tail-aware methods (extreme-value statistics; explicit modeling of low-probability-high-consequence events; pre-mortem-style scenario planning at the tails). lex-7tvr6 does not specify the methods; it specifies the SEQUENCING (outside-view first). Tail-aware outside-view methods exist (Clauset-Shalizi-Newman 2009 *SIAM Review* power-law fitting; Cirillo-Taleb 2016 violence-distribution work; Scheffer 2009 *Nature* tipping-point early-warning). The framework requires extension for fat-tail domains, not abandonment"
  - "is the outside-view discipline genuinely teachable, or is it correlated with stable cognitive-style traits that resist training? The Good Judgment Project's training experiments (CHIPS — Cognitive Heuristics in Probabilistic Inference + Sound Estimates training modules) showed that 1-hour explicit training in outside-view discipline + reference-class identification + probabilistic-granularity produced ~10% Brier-score improvement that persisted across the tournament. Mellers-Stone-Atanasov-Rohrbaugh 2015 documents the training effect. The framework is teachable; the natural-superforecaster baseline can be approached through training. The transferable lesson: outside-view discipline is a learnable skill, not a fixed trait; training is operationally available"
status: active
