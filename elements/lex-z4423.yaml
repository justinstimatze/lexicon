id: lex-z4423
name: escape-route-left-for-a-beaten-foe-prevents-desperate-resistance
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you have gained the advantage over a powerful enemy who is beginning to break or retreat, and the tempting next move is to seal off every avenue of escape and force total annihilation, check first whether the enemy still has latent capacity — resources, will, or numbers — that mere desperation could reactivate. Aristides' counsel to Themistocles at Salamis is the canonical case: with the Persian fleet routed and Xerxes's army still largely intact on land, Themistocles proposed sailing to the Hellespont to destroy the bridge of boats, trapping Xerxes in Europe. Aristides talked him out of it: 'We have hitherto fought with an enemy who has regarded little else but his pleasure and luxury; but if we shut him up within Greece, and drive him to necessity, he that is master of such great forces will no longer sit quietly... but in such a strait will attempt all things; he will be resolute... he will soon correct his errors, and supply what he has formerly omitted through remissness, and will be better advised in all things.' The mechanism: an enemy who is losing but still has an open exit will typically take it, preferring survival with diminished standing over a fight to the death; the same enemy with the exit sealed has nothing left to lose by fighting at full, corrected effort, so total encirclement selects for exactly the desperate, error-correcting resistance you least want to face. Themistocles instead secretly hastened Xerxes's retreat. Plutarch's closing judgment validates the calculation in hindsight rather than treating it as mere caution: 'The prudence of Themistocles and Aristides in this was afterwards more fully understood at the battle of Plataea, where Mardonius, with a very small fraction of the forces of Xerxes, put the Greeks in danger of losing all' — a fragment of the original force, fighting with nothing to retreat to, very nearly undid the whole victory. Generalize beyond battle: a losing competitor with no face-saving exit stops playing by the rules of ordinary competition; a cornered negotiating counterparty with no acceptable walk-away abandons compromise for brinkmanship; a losing faction denied any path back to legitimacy has no further incentive toward restraint. The atom does not counsel mercy for its own sake — it counsels leaving the exit open because a beaten but not-yet-destroyed opponent's residual capacity is a live variable in the calculation, and sealing the exit converts a diminishing threat back into a maximal one."
related: [lex-5u3w3, lex-mrq9p, lex-qa6hc]
