id: lex-d6gyr
name: describing-a-humiliating-state-in-the-language-of-flattery-delivers-the-sting
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A wronged party can mock a deceiver not through direct insult but by describing the deceiver's humiliating punishment in the exaggerated language of flattering praise — the irony of the mismatch between complimentary phrasing and abject reality is what delivers the sting, sharper than a plain accusation would. In the Jataka's tale of Kapota, the mocking bird describes the plucked, smeared, tied deceiver as though praising a well-groomed guest: 'bathed and anointed well, I think, thou hast thy fill of food and drink. Thy neck so bright with jewel sheen, hast thou, friend, to Benares been?'"
related: []
evokes: [jataka, pancanipata, kapota-jataka, backhanded-praise-mocks-a-humiliating-reality, irony-of-mismatch-delivers-the-sting]
