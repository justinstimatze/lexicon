evokes: [sociogeny, fanon-1952, black-skin-white-masks, sociogenesis, normal-response-to-abnormal-conditions, epidermal-racial-schema, body-schema-collapse, the-look-of-the-other, individual-pathology-as-structural-misdiagnosis, anti-psychiatry, decolonial-psychiatry, depathologization]
lineage:
  - source: primary
    text: fanon-1952-black-skin-white-masks
    citation: "Frantz Fanon, *Peau noire, masques blancs* (Éditions du Seuil, 1952); English: *Black Skin, White Masks* (Philcox translation, Grove Press, 2008; earlier Markmann translation, Grove, 1967), Introduction (pp. 1-12 of the Philcox translation) + Ch.5 'The Lived Experience of the Black Man' (pp. 89-119) + Ch.7 'The Black Man and Recognition' (pp. 191-197). Fanon (Martinican psychiatrist trained in Lyon; head of psychiatry at Blida-Joinville hospital in colonial Algeria 1953-56; participant in the Algerian independence struggle; author also of *L'an V de la révolution algérienne* 1959 + *Les damnés de la terre* 1961) consolidates the methodological move that has defined decolonial-psychiatry and critical mental-health work since 1952: psychic disturbance in dominated populations has SOCIAL ETIOLOGY (sociogenesis), not individual-ontogenetic etiology. Fanon's explicit methodological statement (Introduction, p. 11 of Philcox ed.): 'Reacting against the constitutionalizing trend at the end of the nineteenth century, Freud demanded that the individual factor be taken into account in psychoanalysis. He replaced the phylogenetic theory by an ontogenetic approach. We shall see that the alienation of the black man is not an individual question. Alongside phylogeny and ontogeny, there is also sociogeny. In a way... let us say that here it is a question of sociodiagnostics.' The transferable claim Fanon establishes: the neurosis of the dominated subject is the NORMAL response of a healthy psyche to PATHOLOGICAL-STRUCTURAL CONDITIONS, not idiosyncratic personal pathology. The diagnostic frame must include the structural cause (colonization, racialization, gendered subordination, class stratification, persistent epistemic injustice), not just the individual symptoms. The individual-deficit framing systematically misdiagnoses by relocating pathology from the structure to the subject. Fanon's structural model has two components (Introduction, p. 10): 'The inferiority complex can be ascribed to a double process: First, economic. Then, internalization or rather epidermalization of this inferiority.' The economic-structural condition produces the internalization; the internalization produces the psychic-symptomatic presentation. To treat the symptom without addressing the structure is to misdiagnose; to address only the structure without recognizing the subject's lived-experience is also incomplete. Fanon's Ch.5 'Lived Experience of the Black Man' (pp. 89-119) is the canonical phenomenological case study: the body-schema collapses under the colonizing gaze ('the body schema, attacked in several places, collapsed, giving way to an epidermal racial schema'); the subject is forced to inhabit themselves through the colonizer's categories rather than from their own positionality; 'In the train, instead of one seat, they left me two or three. I was no longer enjoying myself. I was unable to discover the feverish coordinates of the world. I existed in triple: I was taking up room.' The body-schema disruption is the somatic-phenomenological face of the sociogenic mechanism — the structural condition produces measurable phenomenological-bodily effects in the subject. The transferable form lex-fv4a3 captures: psychic disturbance in dominated populations is a SOCIODIAGNOSTIC problem, not an individual-clinical problem (or rather: it is individual-clinical only AT THE LEVEL OF THE SYMPTOM, while the etiology and intervention must be structural). The political consequence (Introduction, p. 12): 'Society, unlike biochemical processes, does not escape human influence. Man is what brings society into being. The prognosis is in the hands of those who are prepared to shake the worm-eaten foundations of the edifice.' Sociogenesis as a clinical-political stance: treatment of individual symptoms is necessary but not sufficient; structural change is the foundational intervention. The framework is transferable beyond the colonial-racial case: Fanon's sociogenesis extends to gendered subordination (the second-wave feminist 'the personal is political'), class subordination (anti-psychiatry critiques of mental-health categories pathologizing working-class distress), disability (the social model of disability locating impairment in environmental-structural exclusion), trauma broadly (the moral-injury literature locating military-personnel psychic-disturbance in structural-institutional causation rather than individual-deficit). Fanon's transferable methodological move is the precursor of the social-model framework that has become standard in critical mental-health work."
    quote: "Reacting against the constitutionalizing trend at the end of the nineteenth century, Freud demanded that the individual factor be taken into account in psychoanalysis. He replaced the phylogenetic theory by an ontogenetic approach. We shall see that the alienation of the black man is not an individual question. Alongside phylogeny and ontogeny, there is also sociogeny. In a way, in answer to the wishes of Leconte and Damey, let us say that here it is a question of sociodiagnostics. What is the prognosis? Society, unlike biochemical processes, does not escape human influence. Man is what brings society into being. The prognosis is in the hands of those who are prepared to shake the worm-eaten foundations of the edifice. (Fanon 1952, Introduction)"
  - source: cross-attestation
    text: cross-tradition-attestation-of-sociogenic-etiology-of-psychic-disturbance
    citation: "Cross-tradition attestation of the sociogenic etiology of psychic disturbance. (a) Fromm 1955 *The Sane Society* (Rinehart): the parallel structural argument that 'mental health' in an insane society is not an individual achievement; that conformity to a sick society is itself a form of pathology. Fromm's framework is independent of Fanon's but arrives at structurally identical methodological conclusions: pathology can be relocated from individual to structure. (b) Laing 1960 *The Divided Self* (Tavistock) + Laing 1967 *The Politics of Experience* (Pantheon): the anti-psychiatry argument that schizophrenia and related conditions are intelligible responses to ontologically-incoherent family + social conditions rather than individual brain-pathology. Laing's framework is more focused on the family-system; Fanon's is more focused on the colonial-racial-structural; the structural-portable claim (psychic disturbance has social-relational etiology) is shared. (c) Mills 1959 *The Sociological Imagination* (Oxford UP) Ch.1: 'When, in a city of 100,000, only one man is unemployed, that is his personal trouble... But when in a nation of 50 million employees, 15 million men are unemployed, that is an issue.' Mills's micro-macro distinction is the sociological-methodological substrate of the sociogenic argument. Personal-troubles vs. public-issues — a high enough rate of 'personal trouble' is structurally caused and requires structural intervention. (d) Sennett & Cobb 1972 *The Hidden Injuries of Class* (Knopf): the working-class subordinated-position case of sociogenesis — psychological-symptomatic patterns (resentment, self-doubt, intrusive comparison) are structurally produced by class hierarchy, not idiosyncratic individual pathology. (e) Engels 1845 *The Condition of the Working Class in England* (Wigand): the canonical sociogenic argument for working-class health — the physical and mental ill-health of Manchester workers is structurally caused by capital-industrial-urban conditions, not individual moral deficit. The argument predates Fanon by a century and provides the deep historical grounding for the sociogenic stance. (f) Oliver 1990 *The Politics of Disablement* (Macmillan) + the social model of disability (UPIAS 1976 *Fundamental Principles of Disability*; Shakespeare 2014 *Disability Rights and Wrongs*): the disability-specific application of sociogenesis — impairment is biological; DISABILITY is the social-structural exclusion of the impaired body from full participation. The diagnostic-political consequence is identical to Fanon's: relocate the locus of intervention from individual-medical to social-structural. (g) Hartmann 1976 *Psychoanalysis and Sociology* (Berkeley): the psychoanalytic-sociological synthesis that consolidates sociogenesis into mainstream-adjacent psychiatry. Hartmann's work brings sociogenic framing into clinical practice without rejecting individual-clinical work. (h) Specific clinical applications: trauma-informed care (Bessel van der Kolk 2014 *The Body Keeps the Score* — with the caveat that polyvagal theory itself is contested; alternative grounding in allostatic-load + attachment + HPA-axis literature); decolonial psychiatry (Kirmayer + Guzder + Rousseau 2014 *Cultural Consultation*); Black women's mental-health research (Jackson 1996 + subsequent work on John Henryism + weathering); transgender mental-health research (locating gender dysphoria-distress not in transgender identity but in the structural-social-institutional condition that excludes transgender people from full participation). (i) The general methodological principle Fanon establishes is now substantially incorporated into the WHO ICD-11 + DSM-5-TR diagnostic frameworks via the 'cultural formulation' supplement (DSM-5-TR Appendix); these supplements require clinicians to assess social-cultural-structural factors as part of diagnostic formulation. Fanon's 1952 methodological move is institutionally encoded in 2020s mainstream psychiatric practice, even when not explicitly cited."
    quote: "Mills 1959: 'The personal troubles of milieu and the public issues of social structure... The first range of problems are those of the individual character, his personal life. The second range of problems are those of the institutional contradictions and the historical conjuncture.' (Sociological Imagination, Ch.1.) // Engels 1845: 'When one individual inflicts bodily injury upon another such that death results, we call the deed manslaughter; when the assailant knew in advance that the injury would be fatal, we call his deed murder. But when society places hundreds of proletarians in such a position that they inevitably meet a too early and an unnatural death... yet murder it remains.' (Condition of the Working Class in England, Ch. 'Results.')"
canonical-instances:
  - "Fanon's central case: psychic disturbance among colonized Algerian and Antillean patients during the Algerian war of independence (1954-62). Fanon documented in his clinical notes (published in *Les damnés de la terre* 1961, Ch.5 'Colonial War and Mental Disorders') a series of cases where French colonial military personnel and Algerian victims presented with overlapping symptom patterns (anxiety, dissociation, intrusive imagery, somatic disturbance) whose etiology was clearly the colonial-war structure rather than individual-pre-existing pathology. Fanon's clinical work argued these were sociogenic, not ontogenic — the appropriate intervention is decolonization, not individual psychotherapy. The transferable methodological lesson: when a symptom-pattern recurs across a population sharing a structural condition, sociogenesis is the decisive etiology"
  - "Du Bois 1903 'double consciousness' framework as precursor (W.E.B. Du Bois, *The Souls of Black Folk*, A.C. McClurg): the 'twoness' of African-American consciousness is sociogenic — the psychic-fracture is the response to the racial-structural condition (looking at oneself through 'the eyes of others, of measuring one's soul by the tape of a world that looks on in amused contempt and pity'), not an individual-pathological condition. Du Bois's pre-Fanon articulation establishes the sociogenic argument for the African-American case; Fanon extends it for the colonial-French case; the underlying methodological move is identical. Composes with lex-2sdqf subordinated-identity-fractures-self-via-internalized-dominant-other-gaze (Du Bois primary lineage)"
  - "Working-class mental health (Sennett & Cobb 1972 *The Hidden Injuries of Class*): the patterns of self-doubt, intrusive comparison, hidden shame, and resentment characteristic of working-class subjects in stratified-class societies are sociogenic — they are the normal-response to structural class subordination, not individual-personality pathology. Sennett-Cobb's interview-based study documented the symptom-pattern across many subjects sharing the class-structural condition. Clinical intervention requires both individual therapeutic work AND structural-political intervention; treatment-only-of-symptoms misdiagnoses the source"
  - "The social model of disability (Oliver 1990 *The Politics of Disablement*; UPIAS 1976; Shakespeare 2014): the methodological move that distinguishes IMPAIRMENT (biological condition) from DISABILITY (social-structural exclusion of the impaired body from full participation). The depression and anxiety patterns characteristic of disabled people in able-bodied-default institutions are sociogenic — they are the normal-response to structural exclusion, not symptoms of the impairment itself. The clinical-political consequence is identical to Fanon's: relocate the intervention from individual-medical (cure or fix the disabled body) to social-structural (redesign the environment for full participation). Composes with lex-ct5ux spoon-theory (Miserandino) as the disabled-perspective lived-experience report of the sociogenic mechanism"
  - "Transgender mental health research (Hendricks & Testa 2012 *Professional Psychology* 43:460-467 minority-stress model + subsequent depathologization of gender dysphoria across diagnostic frameworks): gender dysphoria-related distress in transgender people is sociogenic — caused by minority stress (social-structural-institutional exclusion, discrimination, violence) rather than by transgender identity itself. The diagnostic-political consequence: the DSM-5 reframing of 'gender identity disorder' (a personal-pathology framing) to 'gender dysphoria' (a distress-of-experience framing) plus the increasing recognition that the distress-pattern is sociogenic, not ontogenic. Fanon's 1952 methodological move is operationally identical to the 2010s-2020s reframing in transgender mental-health research"
  - "Veteran moral injury (Litz et al. 2009 *Clinical Psychology Review* 29:695-706 + Shay 1994 *Achilles in Vietnam* + Shay 2002 *Odysseus in America*): the psychic-disturbance characteristic of veterans who acted against conscience under institutional command is sociogenic — the institutional structure (military command + small-unit cohesion per lex-fbc4r + combat-environment) is the etiological cause, not individual-pre-existing-deficit. The clinical-political consequence: treatment must address the institutional context AND the individual experience; moral-injury frameworks distinguish moral injury from PTSD in part to highlight the sociogenic etiology that PTSD's individual-trauma frame can obscure. Composes with lex-fbc4r peer-bonded-unit-cohesion-overrides-conscience-when-defection-frames-as-abandonment as the structural mechanism whose downstream psychic effects lex-fv4a3 names"
  - "Operationally distinct from lex-2sdqf subordinated-identity-fractures-self-via-internalized-dominant-other-gaze: lex-2sdqf is the SPECIFIC MECHANISM (internalized dominant other-gaze fractures the self into two competing internal voices). lex-fv4a3 is the METHODOLOGICAL-DIAGNOSTIC STANCE (psychic disturbance is sociogenic — caused by social-structural conditions). lex-2sdqf is one of the SYMPTOM-PATTERNS produced by the sociogenic causation lex-fv4a3 names. Compositionally: lex-fv4a3 names the etiological frame; lex-2sdqf names one specific symptom-pattern within that frame. Other symptom-patterns lex-fv4a3 names without specifying: depression, anxiety, dissociation, intrusive imagery, somatic disturbance, rage, hyper-vigilance, body-schema disruption — all of which can be sociogenic in dominated populations"
  - "Operationally distinct from lex-2rsad identity-protective-belief-maintenance: lex-2rsad is the BELIEF-MAINTENANCE mechanism in dominant-group members. lex-fv4a3 is the SYMPTOM-ETIOLOGY framework for dominated-group members. They are complementary atoms at opposite poles of the structural relationship: lex-2rsad explains why dominant-group members resist evidence of the structural condition; lex-fv4a3 explains why dominated-group members manifest psychic disturbance as evidence of the structural condition. Together they describe the asymmetric psychic-cost distribution under structural domination"
  - "Operationally distinct from lex-6qevt lived-position-as-irreplaceable-epistemic-substrate: lex-6qevt is the EPISTEMIC claim about the dominated-position's knowledge. lex-fv4a3 is the CLINICAL-DIAGNOSTIC claim about the dominated-position's psychic-disturbance etiology. The two atoms compose at the structural level: the lived position carries irreplaceable epistemic content (lex-6qevt) AND produces sociogenic psychic-disturbance (lex-fv4a3) when the structural condition is pathological. Both atoms together describe the dominated-position's epistemic-AND-psychic-economy"
  - "Operationally distinct from lex-fjzum doubling-as-morally-antithetical-self-formation: lex-fjzum is the CLINICAL SELF-ORGANIZATION mechanism Lifton names (institutional context produces a second internally-coherent self that conducts atrocity without integration into the integrated-self's moral standards). lex-fv4a3 is the BROADER METHODOLOGICAL-DIAGNOSTIC STANCE that psychic-pathology has social-structural etiology. lex-fjzum is one specific clinical-pathological form that emerges under specific institutional conditions; lex-fv4a3 is the general methodological frame for diagnosing psychic-pathology sociogenically. lex-fjzum fits inside lex-fv4a3's diagnostic framework"
  - "Operationally distinct from lex-ct5ux bounded-daily-energy-units-spoons (Miserandino disability lens): lex-ct5ux is the LIVED-EXPERIENCE RESOURCE-MANAGEMENT framework from the disabled-perspective. lex-fv4a3 is the METHODOLOGICAL-DIAGNOSTIC FRAME for understanding disabled-persons' psychic disturbance as sociogenic rather than impairment-intrinsic. The two atoms compose: lex-ct5ux names what the disabled-person's lived resource-economy looks like; lex-fv4a3 names how to diagnose the psychic-disturbance that arises when the social-structural environment fails to accommodate it"
  - "Composes with lex-y48fs pyramid-of-choice: the pyramid-of-choice mechanism (each small choice produces dissonance that drives self-justification that raises commitment) operates within the sociogenic structural conditions lex-fv4a3 names. The dominated subject's commitment-trajectory (lex-y48fs) is one mechanism by which lex-fv4a3's sociogenic conditions become internalized as identity. Composing: lex-fv4a3 names the etiology; lex-y48fs names one trajectory by which the etiology produces sustained psychic configuration"
  - "Composes with lex-3ezh8 matrix-of-domination: lex-3ezh8 names the multi-axis multi-level structural ARCHITECTURE of domination; lex-fv4a3 names how that architecture produces psychic-disturbance in the dominated-population (sociogenic etiology). lex-3ezh8 is the structural cause; lex-fv4a3 is the diagnostic methodology for the structural cause's psychic effects. The two atoms together describe the architecture and its psychic-symptomatic downstream"
  - "Composes with lex-44byg dominant-discourse-constructs-the-other-as-rulable-object-and-defining-mirror: lex-44byg names the structural mechanism by which the dominant produces the Other through regulated discourse; lex-fv4a3 names the receiving-end psychic-effect of being so constructed. Together: lex-44byg (Said) names what discursive-structural condition exists; lex-fv4a3 (Fanon) names what the colonized-subject experiences psychically as a result. Said + Fanon are operationally complementary halves of the postcolonial-theory framework"
  - "Composes with lex-k8bsd outsider-within: lex-k8bsd names the standpoint that perceives the structural domination; lex-fv4a3 names the psychic-disturbance pattern that can co-occur with that standpoint. The outsider-within is structurally positioned to see the dominant's operations clearly AND to bear sociogenic psychic-cost from the position. The two atoms together describe the dual character of the outsider-within position: epistemic-affordance (lex-k8bsd) and psychic-cost (lex-fv4a3)"
  - "Composes with lex-a3tfj testimonial-injustice + lex-22kep hermeneutical-injustice: lex-a3tfj/0547 (Fricker) name the EPISTEMIC mechanism by which the dominated-subject's testimony is discounted and their experiences not hermeneutically held. lex-fv4a3 names the CLINICAL-DIAGNOSTIC mechanism by which the epistemic-injustice and broader structural-injustice produce psychic disturbance. Fanon's sociogenic methodology requires the diagnostician to recognize lex-a3tfj/0547 as operating; without that recognition, the clinical interaction itself reproduces the epistemic-injustice that contributed to the disturbance"
critical-questions:
  - "is sociogenesis categorically distinct from biological-individual etiology, or is the distinction provisional pending more research? Contemporary biopsychosocial frameworks (Engel 1977 *Science* 196:129-136) integrate all three levels rather than choosing among them. The transferable position lex-fv4a3 takes: sociogenesis is one of three legitimate etiological levels (alongside biological + individual-ontogenic), and the methodological-clinical risk historically has been to under-attribute psychic disturbance to social-structural causes. lex-fv4a3 is a corrective stance that does not deny biological or individual factors; it requires that social-structural factors be assessed alongside them. The contemporary cultural-formulation supplements in DSM-5-TR + ICD-11 institutionalize this requirement"
  - "does sociogenic framing remove individual responsibility or therapeutic-clinical work? Fanon explicitly addresses this (Introduction, p. 12): 'Genuine disalienation will have been achieved only when things, in the most materialist sense, have resumed their rightful place.' Sociogenic framing identifies the indispensable causal factor (structural conditions) without removing the individual's experience or the clinician's responsibility to work with that experience. The two-level frame Fanon proposes — individual-clinical work AT the symptom level + structural-political work at the etiological level — is the transferable form. Pure structural-level work without individual-clinical engagement underserves patients; pure individual-clinical work without structural attention misdiagnoses etiology"
  - "what counts as evidence that a psychic disturbance is sociogenic vs. individual-ontogenic? Transferable diagnostic indicators: (1) the symptom-pattern recurs across a population sharing the structural condition (Mills's micro-macro test — high enough rate makes it structural); (2) the symptom-pattern attenuates or disappears under conditions of reduced structural exposure (e.g., when the dominated-subject is in a context where the structural condition is suspended); (3) the symptom-pattern correlates with specific structural-condition variables (intensity of exposure, duration of exposure, presence of structural buffers); (4) interventions that change the structural condition produce symptom-attenuation. These are empirical-testable indicators; lex-fv4a3 makes specific predictions about each"
  - "does the sociogenic framework over-pathologize structural conditions (everything becomes 'sociogenic') and lose discrimination among different psychic-disturbance patterns? The transferable response: NO, the framework requires SPECIFIC structural-pathological conditions (sustained domination, racialization, colonization, persistent exclusion, etc.) — not all social-environmental conditions are pathological. Fanon's framework is explicit about WHICH structural conditions produce psychic disturbance (the colonial-racial-structural condition specifically). The framework does not claim that 'all psychic disturbance is sociogenic' — it claims that under specific structural-pathological conditions, sociogenic etiology is crucial. The discrimination between pathological-structural conditions and ordinary-environmental conditions is empirically tractable, not a theoretical problem"
  - "is the sociogenic framework compatible with cross-cultural clinical practice or does it presuppose a specific political-theoretical commitment? The framework's clinical application is substantially institutionalized in current mainstream psychiatry via the cultural-formulation supplements (DSM-5-TR Appendix; ICD-11 cultural-formulation interview) WITHOUT requiring clinicians to share Fanon's specific political-theoretical commitments. The methodological move (assess social-structural factors alongside individual-biological) is institutionally adoptable; the political-theoretical move (structural change as treatment) is a further step. lex-fv4a3 names the methodological move as transferable; the political-implementation is a downstream practical question that varies by setting and by clinician"
