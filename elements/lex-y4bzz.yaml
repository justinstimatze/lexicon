    quote: "“Our desires and expectations adjust to circumstances, particularly to make life bearable in adverse situations. The hopeless underdog does not lead a life of constantly desiring what he or she thinks is unfeasible, nor one of seeking pleasures that are unobtainable. Rather, the focus is on cutting desires to size and on taking joy from smaller successes. In so far as people in chronically deprived situations succeed in getting some attainable pleasures and in fulfilling their restrained desires, their deprivation may look less intense in the mental metrics of pleasures and desires, even when their lack of real opportunities continues unremedied.”"
canonical-instances:
  - "Hypothetical: An annual employee survey finds long-tenured warehouse workers report high job satisfaction despite wages that haven't kept pace with the cost of living for a decade, while newer hires at the same wage report frustration. Management reads this as proof the pay is adequate. The gap says more about how long each group has had to adjust their expectations than about the wage itself."
  - "Hypothetical: A national well-being survey finds residents of a chronically under-resourced region report contentment levels close to the national average, and a policymaker cites this as evidence the region doesn't urgently need investment. The residents most vocally dissatisfied moved away or never adjusted their expectations to begin with; the ones still there and answering the survey are disproportionately the ones who scaled their wants down to match what was actually available."
critical-questions:
  - "Doesn't this prove too much -- if adjusted satisfaction is always suspect, how could anyone's reported contentment ever count as real evidence of well-being? It's not that adjusted satisfaction is never real; it's that satisfaction alone can't distinguish someone who is genuinely fine from someone who has adapted to genuinely not being fine. Self-reports stay useful once paired with information about actual opportunities and circumstances that adaptation doesn't touch -- what Sen elsewhere develops as the capability approach."
  - "Could this reasoning be used the other way -- to dismiss anyone's reported contentment as fake whenever it's politically inconvenient? Yes, and that's a real risk if the diagnostic gets applied selectively rather than consistently. The honest version asks the same question of every reported satisfaction score, favorable or not: has this person's circumstances stayed genuinely good, or have their expectations simply moved to meet a bad situation -- and the answer requires looking past the self-report, not assuming the answer in advance."
