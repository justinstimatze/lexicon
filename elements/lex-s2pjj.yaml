id: lex-s2pjj
name: self-definition-by-disavowing-a-caricatured-predecessor
type-in: process
type-out: frame
_tier: atomic
agent-instruction: "When a group defines itself primarily by what its predecessor failed at, check whether the predecessor's actual position matches the caricature. Disavowal often relies on a strawman; the new position inherits more than it admits."
