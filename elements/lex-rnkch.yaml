evokes: [display-rules, affect-display-management, intensify-deintensify-neutralize-mask, culturally-learned-expression-control, micro-expressions]
lineage:
  - source: primary
    text: ekman-friesen-1969-nonverbal-leakage-clues-to-deception
    citation: "Paul Ekman and Wallace V. Friesen, 'Nonverbal Leakage and Clues to Deception,' Psychiatry 32(1):88-106 (1969), p.97."
    quote: "[p.97:] 'Most affect displays, at least those shown in public places, and perhaps all those shown during even the most intimate interaction, are managed or controlled by display rules. Display rules determine whether an affect display is intensified, de-intensified, neutralized, or masked with a covering affect. The particular display rule which operates upon a particular affect is determined by culture, well mapped in terms of social situations, role, age, sex, and status of the person emitting the display. Display rules may also be idiosyncratic within a culture, shaped by peculiarities of the family interaction.'"
canonical-instances:
  - "A culture with a strong 'stoicism' display rule for men in public settings: a man who feels grief at a funeral may show a neutralized or masked expression (a composed, controlled face) in front of others, while privately, or in a culturally-sanctioned space for grief-display, showing the felt emotion directly — the underlying feeling doesn't change, but which display rule applies (public vs. private context) determines what the face shows."
  - "Ekman & Friesen's own deception-detection application: because display rules are well-practiced (people have years of experience managing facial display according to their culture's rules), the FACE is often the best-controlled channel during deception — a liar can successfully manage facial display rules while leaking true emotion through less-monitored channels (hands, legs/feet, micro-expressions too brief to consciously suppress)."
  - "A workplace norm requiring 'customer-service smiling' regardless of felt emotion: an employee intensifies or fabricates a positive affect display (smiling) over an actually-neutral or negative felt state, per an institutionally-enforced display rule — distinct from cases where the employee genuinely feels positive, and distinguishable (per Ekman-Friesen's broader argument) via inconsistencies in timing, symmetry, or co-occurring micro-expressions."
critical-questions:
  - "how would a practitioner actually distinguish 'display rule masking a different felt emotion' from 'the person genuinely feels the displayed emotion' in a live interaction, rather than in a controlled lab study — what's the operational tell, and how reliable is it outside Ekman's own experimental paradigm?"
  - "does the display-rules concept itself depend on the more contested claim that there's a fixed, universal set of DISCRETE underlying emotions being managed (which display rules then modulate) — if the underlying discrete-emotion taxonomy is shakier than Ekman claimed, does that weaken the display-rules concept too, or is display-rule-governed management a separable claim that would hold even under a different (e.g. dimensional, constructed) theory of emotion?"
  - "given that display rules are explicitly said to be culturally AND idiosyncratically (family-level) variable, how much can actually be inferred about a specific individual's felt state from an unusual display without knowing THEIR specific display-rule set — is the concept more useful as a caution against over-reading expression than as a positive tool for reading it?"
