id: lex-7ff7u
name: trace-the-mechanism-to-locate-who-is-actually-describing
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a system's output behaviorally passes for description or argument -- it names things, answers questions, gives reasons, even complains of being tired -- don't settle the question of whether IT is describing or arguing by watching the output alone. Popper's machine argument gives the diagnostic: trace how the system is actually built, whether it can be copied, and who is responsible for its design. A wall-thermometer 'may be said not only to express its internal state, but also to signal, and even to describe... Yet we do not attribute the responsibility for the description to it; we attribute it to its maker.' Popper then grants his opponents everything: imagine a much more elaborate machine -- lens, analyser, speaking apparatus -- that names whatever object appears before it, says 'I don't know' when stumped, and even occasionally replies 'I am getting tired, let me alone for a while.' However human its behavior gets, 'once we realize completely how it is constructed, how it can be copied, who is responsible for its design, etc., no degree of complexity will make it different in kind from an automatic pilot, or a watch, or a wall-thermometer.' The mechanism does not describe any more than a pen describes; it is expressing its own physical state and signaling, and the actual describing -- the standing-for-something, the giving of reasons -- was done by, and the responsibility for it belongs to, whoever built and specified it. Diagnostic move: when a system's behavior alone is used to settle whether it understands, intends, or argues, redirect the question to what behavior alone cannot answer -- can you trace exactly how the output is produced, could someone else build an identical copy from that account, and can you name who is answerable for what it says. Complexity and human-likeness of the output are not evidence against this diagnostic; Popper explicitly stipulates a machine built to pass every behavioral test and shows the diagnostic still applies to it."
related: [lex-4r2sg]
evokes: [popper-1953-language-and-the-body-mind-problem, the-machine-argument, wall-thermometer-expresses-but-does-not-describe, responsibility-belongs-to-the-maker, chinese-room-precursor, behavioral-indistinguishability-does-not-settle-intentionality]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Language and the Body-Mind Problem' (paper delivered to the 11th International Congress of Philosophy, Brussels, 1953; first published in its Proceedings, vol. 7), Ch. 12 of Conjectures and Refutations (Routledge Classics, 2002), pp.399-400, Section 4 'The Machine Argument.'"
    quote: "'A wall-thermometer may be said not only to express its internal state, but also to signal, and even to describe... Yet we do not attribute the responsibility for the description to it; we attribute it to its maker... Consider a machine (invested with a lens, an analyser, and a speaking apparatus) which pronounces, whenever a physical body of medium size appears before its lens, the name of this body (\"cat\"; \"dog\", etc.) or says, in some cases, \"I don't know\"... (2) by making it in a percentage of cases reply, \"I am getting tired, let me alone for a while\"... But let us assume that we find a physical machine whose mechanism we do not understand and whose behaviour is very human... But once we realize completely how it is constructed, how it can be copied, who is responsible for its design, etc., no degree of complexity will make it different in kind from an automatic pilot, or a watch, or a wall-thermometer.'"
canonical-instances:
  - "A chatbot writes a persuasive, well-reasoned essay arguing for a position, complete with counterarguments it anticipates and rebuts. Whether that counts as the chatbot arguing, in Popper's sense, doesn't turn on how good the essay reads -- it turns on whether the reasoning process is a traceable computation over training data and a prompt, reproducible on identical inputs, built and shipped by an identifiable team who specified its training objective and are answerable for what it outputs."
  - "An automated stock-trading algorithm 'explains' its trade in a generated summary that reads like a human analyst's rationale. The trace of what actually drove the trade is a set of weighted signals computed deterministically from market data; the generated explanation is a separate text-production step layered on top, and responsibility for what the algorithm does sits with the firm that built and deployed it, not with the explanation text or the algorithm itself."
critical-questions:
  - "If the mechanism-tracing test is the real diagnostic, doesn't a fully self-modifying system that even its own designers can no longer fully trace escape the test entirely, leaving the question genuinely open? Popper's argument was built around cases where the mechanism CAN in principle be traced and copied; a system whose behavior has drifted past what its makers can account for is a harder case this atom doesn't resolve on its own -- it names the test; a clean answer isn't guaranteed to exist for every case."
  - "Isn't 'who built it and can it be copied' really just an appeal to origin, which Popper himself argues elsewhere shouldn't determine a theory's status (per [[lex-4r2sg]])? The two claims aren't in tension: [[lex-4r2sg]] is about whether a theory counts as SCIENTIFIC, which depends only on testability regardless of how the theory was arrived at. This atom asks a separate question: whether a SYSTEM counts as the one doing the describing turns on intentional agency and responsibility, and settling it takes a criterion of its own."
