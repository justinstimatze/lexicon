id: lex-fy5k5
name: gift-binds-via-three-linked-obligations
type-in: situation
type-out: structure
_tier: atomic
agent-instruction: "When evaluating a gift exchange, surface Mauss's three linked obligations — to give, to receive, to reciprocate — gifts bind via the chain, refusing any of the three is a status move; name which is being refused."
related: [lex-e98pd, lex-xxmeh, lex-68gd3, lex-p7uh9, lex-ry9qx, lex-ynqj9, lex-kdt2v, lex-cj5bf, lex-dyr9p]
scaffolds-from: [lex-ry9qx]
evokes: [give-receive-reciprocate, mauss-essai-sur-le-don, total-prestation, the-spirit-of-the-gift, hau, no-free-gift, refusing-the-gift-is-an-act-of-war, agonistic-exchange, potlatch, obligation-creates-society]
lineage:
  - source: primary
    text: mauss-1925-essai-sur-le-don
    citation: "Marcel Mauss, *Essai sur le don: Forme et raison de l'échange dans les sociétés archaïques* (1923-24 published *Année sociologique* second series; 1925 book form). (Jane Guyer's 2016 translation for HAU, used as the primary verbatim source for this atom). Mauss's foundational claim: gift-exchange in archaic societies is structured by THREE linked obligations — the obligation to GIVE (initiating the bond), the obligation to RECEIVE (acceptance signals reciprocal-personhood), and the obligation to RECIPROCATE (returning a counter-gift of equal or greater value). The three together produce 'total prestation' — the gift carries the giver's identity (the Maori call this the *hau* or spirit-of-the-thing), so receiving is accepting an obligation, and reciprocating is the discharge that maintains the relationship. The atom's substrate-claim is that the triadic obligation-chain (give→receive→return) is the MECHANISM by which non-market societies generate stable social bonds without contracts or coercion. The mechanism generalises: corporate gift-giving creates implicit-obligation; conference-speaker-pays-back-with-future-favors; open-source contributor-ecosystem reciprocation-chains; tribute-and-counter-tribute diplomatic protocols; the Christmas-card-list as obligation-network. PD complications: original French (Mauss d.1950, France PD 2021); Cunnison 1925 English in (Cunnison d.1990, UK PD 2061); Guyer 2016 HAU edition is in-copyright but the substantive verbatim is mined under fair-use"
    quote: "[Mauss 1925 *Essai sur le don*, Guyer 2016 trans. p.~74 (HAU Books edition):] 'To understand completely the institution of total prestation and of the potlatch, we still have to find the explanation for the two other instances which are complementary to the first, for total prestation does not bring with it only the obligation to return the gifts (cadeaux) received; it presupposes two others, of equal importance: the obligation to give them, on the one hand, and the obligation to receive them, on the other. The complete theory of these three obligations, of these three themes in the same complex, would offer a fundamental and satisfying explanation for this form of contract between Polynesian clans.' [Continuing on obligation-to-receive:] 'a clan, household, company, or guest have no choice but to ask for hospitality, to receive gifts (cadeaux), to trade, to contract an alliance, both through women and through blood. The Dayaks have even developed an entire moral and legal (droit) system around the duty not to fail to share the meal in which one partakes or which one has seen being prepared.' [Continuing on obligation-to-give:] 'The obligation to give is no less important. To study it could allow us to understand how people came to be exchangers. We can only point out a few facts. To refuse to give, to neglect to invite, as to refuse to take, is equivalent...' [to declare war, in many of Mauss's ethnographic instances]. [The atom's critical claim: the three obligations are constitutive of social bonding in non-contract societies — each obligation is a node in a chain whose unbroken continuity IS the relationship. Breaking any link (refusal to give, refusal to receive, refusal to return) is socially equivalent to severing the bond, often coded as declaration of hostility. The contemporary 'no-free-gift' observation is Mauss's primitive applied: gifts in modern personal life (Christmas, weddings, hostess gifts) and modern business life (corporate hospitality, conference sponsorship, recommender-system reciprocation) carry the same obligation-chain even when the actors disclaim it. The Maori *hau* — the spirit-of-the-thing that wants to return to its origin — is the mythopoetic name for the obligation-pressure that is structural rather than merely felt.]"
canonical-instances:
  - "Corporate gift-giving and hospitality: vendor takes engineer to expensive dinner; engineer receives the obligation; the implicit return (preferential consideration in next vendor-evaluation) is what makes vendor-hospitality strategically rational. Disclosure-and-conflict-of-interest rules in professional codes are attempts to disrupt the third obligation (return) by making it explicitly forbidden. Mauss's frame: the rules don't eliminate the obligation, they shift it to a different register (the receiver now owes the institution disclosure instead of owing the vendor a favor)."
  - "Open-source software contribution-and-acknowledgment chains: a contributor submits a patch (gives); a maintainer accepts and merges (receives); future contributors and the broader community recognise the contributor's standing (returns, often in social-capital and reputation form). When any link breaks — maintainer ghosts the PR, community withholds recognition, contributor refuses to submit because they expect no acceptance — the ecosystem's gift-exchange substrate collapses, which is why long-term OSS health depends on reliable instantiation of all three obligations."
  - "Diplomatic protocol: state visits, hosting rituals, exchange of gifts between heads of state, return visits, tribute-and-counter-tribute. The triad operates at international scale; refusing to host a foreign leader, refusing to send an envoy to return a visit, or failing to send appropriate gifts are coded as diplomatic acts (often hostile)."
  - "Hostess-gift / wedding-gift / Christmas-card economies: the obligation-chain operates explicitly. The 'I don't want anything for my birthday' attempt to escape the obligation typically fails because the obligation-structure is on the GIVER (who needs to give to maintain the relationship) as well as on the receiver and returner. Refusing-to-receive is read as relationship-rejection."
  - "Influencer / creator economies: gifts-to-creators from brands (PR boxes, sponsored trips) instantiate Mauss's triad with the third obligation (return) operationalised as positive content. Disclosure-required regulations (FTC sponsored-content rules) try to make the obligation transparent without eliminating it — but Mauss's frame predicts that disclosure doesn't break the obligation-structure, only re-codes it."
  - "Tribute systems in pre-modern political economy (ancient Persian satrapy tribute, Chinese imperial tribute system, Mongol succession-tribute): Mauss's frame explains why these systems were not simply tax-collection but obligation-bond reaffirmations. Refusing tribute was rebellion; over-paying was a bid for elevated status; the symbolic-equivalence of the gifts mattered as much as the material value."
  - "operationally distinct from lex-e98pd reciprocity-as-influence-mechanism: lex-e98pd is the Cialdini/Gouldner reciprocity-norm as a single-vector influence-lever (give-to-induce-return); lex-fy5k5 is the TRIADIC OBLIGATION-CHAIN as constitutive of social-bonding. The Cialdini influence-frame is a special case (deploying the obligation-structure strategically) of the Maussian substrate-frame (the obligation-structure is what generates society). Compose: Cialdini operationalises Mauss for influence; Mauss explains why Cialdini works."
  - "operationally distinct from lex-68gd3: scapegoating discharges accumulated communal ills onto a carrier and expels it; gift-exchange constitutes social bonds through unbroken obligation-chains. Both are mechanisms by which non-market societies organise themselves, but they operate in opposite directions (expulsion vs incorporation). They can compose (the gift to the carrier is a discharge-gift, e.g., the Ceram demon-ship loaded with rice + tobacco) but the substrate-mechanisms are distinct."
  - "operationally distinct from lex-p7uh9 harm-attribution-is-reciprocal-between-incompatible-uses: lex-p7uh9 is Coase's symmetric-harm structure (incompatible-uses impose reciprocal costs); lex-fy5k5 is Mauss's positive-obligation triad (gift-exchange creates linked obligations). Both are about RECIPROCITY but at different layers — Coase at the conflict/cost layer, Mauss at the bond/obligation layer. The compose-point: a Coasian conflict can be RESOLVED via Maussian gift-exchange (the wronged party accepts a gift that establishes ongoing relationship rather than insisting on the strict no-harm rule)."
  - "operationally adjacent to lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature: Mauss's claim is structural-anthropological (the three-obligations triad is observed across many archaic societies as a stable pattern); Darwin's claim is psychological-evolutionary (emotion-expressions are cross-cultural). They share the cross-cultural-stability evidence-shape; Mauss's substrate is institutional, Darwin's is biological. They can co-occur (the gift-receipt smile is both a Mauss-obligation-acceptance signal and a Darwin-evolved-expression)."
critical-questions:
  - "does the atom apply to modern market societies, or only to archaic gift-economies? Mauss's own framing is that market-exchange is one specialised form of obligation-chain; modern commodity exchange formally abstracts away the obligation-chain (the receipt 'discharges' the obligation), but informal gift-exchange persists alongside (and underneath) market-exchange. The atom fires whenever gift-exchange is operative — modern personal relationships, corporate hospitality, OSS communities, political tribute, diplomatic protocol. It does NOT fire on pure commodity exchange (the cash-register settles the obligation; no triadic chain remains)."
  - "is the obligation-chain coercive or voluntary? Both, simultaneously. Mauss's argument is that the obligation feels voluntary to participants (a gift is freely given, freely received, freely returned) while being structurally coercive (refusing any link is socially severe). This double-nature — perceived-voluntary, structurally-coercive — is the diagnostic feature. When the structural-coercion becomes visible (e.g., 'I don't want this gift but I have to accept it'), the obligation-chain is exposed but not eliminated. Practitioner-discipline: identify whether the participants experience the chain as voluntary or coerced; the asymmetry between experience and structure is the substrate of the practice."
  - "what counts as 'reciprocation'? Reciprocation in Mauss's frame is not strict equivalence — counter-gifts may be larger (potlatch), smaller (asymmetric clientelism), of different kind (services for goods), or deferred (favor-banking). The unbroken chain matters more than the value-equivalence. The atom fires when the THIRD obligation is operative; specific reciprocation-shapes are contextual."
  - "does Mauss's frame impose European-anthropological assumptions on non-European practices? Critique-from-decolonial-anthropology (e.g., Annette Weiner 1992 *Inalienable Possessions*; Marshall Sahlins 1972 *Stone Age Economics*) argues Mauss over-systematised diverse practices into a single 'gift-economy' frame and that 'inalienable possessions' (heirloom-class goods that are NOT meant to circulate) are missed by the give-receive-return triad. The atom should be qualified: the triad applies to the CIRCULATING-GIFT layer of an exchange-system; inalienable-possession dynamics are distinct."
  - "when does the atom fail to fire? When exchange is strictly commodified (cash for goods, no relationship-residue) or strictly altruistic (anonymous one-time donation with no return-expectation, the truly 'free gift' Mauss claims is impossible but contemporary critics like Derrida 1992 *Given Time* dispute). Diagnostic: if both giver and receiver disengage immediately after exchange and no future obligation is generated, the atom doesn't fit. If any thread persists, Mauss's frame applies."
status: active
