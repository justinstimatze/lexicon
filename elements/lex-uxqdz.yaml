id: lex-uxqdz
name: egalitarianism-is-actively-maintained-reverse-dominance-not-absence-of-hierarchy
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When observing or trying to maintain a 'flat' or 'egalitarian' social structure, recognize Boehm's finding (1999): egalitarianism is NOT the absence of hierarchy but an actively-enforced REVERSE hierarchy in which the rank-and-file coalition collectively dominates would-be individual dominants. Hunter-gatherer egalitarian bands (and tribal societies) sustain their flatness through an ongoing set of leveling mechanisms — ridicule of the boastful, gossip about the over-reaching, withdrawal of cooperation, ostracism, exile, and in the limit collective execution of the persistent upstart. Boehm's diagnostic is sharp: 'In egalitarian hierarchies the pyramid of power is turned upside down, with a politically united rank and file decisively dominating the alpha-male types.' Transferable consequence: any flatness you observe in human social organization is achieved-and-maintained, not natural-and-default. The default — visible in chimpanzee bands, in absent-leveling-coalitions, in newly-coalescing groups, in workplaces with no leveling norms — is despotic dominance hierarchy. Operational implications: (1) if you want a flat organization, you need ACTIVE mechanisms enforcing flatness — pure 'we don't believe in hierarchy' yields a tyranny-of-structurelessness (lex-5d8hm) at best, an informal dominance hierarchy at worst; (2) flatness is brittle when the coalition fragments or when the would-be dominant has resources the rank-and-file can't credibly threaten to withhold; (3) the historical transition from hunter-gatherer egalitarianism to agricultural-state despotism is a story about the leveling coalition losing the ability to enforce — when wealth could be stored and defended, upstarts became too well-armed for the coalition to ridicule, gossip, or exile out of contention; (4) modern instances persist where the coalition has effective leveling tools (academic departments, Quaker meetings, open-source maintainer communities, monastic orders, kibbutzim) — and dissolve when those tools weaken (founder eject-or-take-over fights in tech startups, charismatic-leader capture of religious sects)."
