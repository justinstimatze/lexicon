id: lex-9cuew
name: fake-a-verifiable-completion-condition-to-stall-decision
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when you are under sustained pressure to make an irreversible decision now, the pressuring party would accept a fair, checkable condition as grounds for delay, and you want to postpone indefinitely without appearing evasive. Homer's Odyssey is the canonical case (Penelope's web, recounted in her own words in Book XIX, and independently by Antinous in Book II): pressed by suitors to remarry, Penelope proposes a condition the suitors themselves judge reasonable and can literally observe — she will choose a husband once she finishes weaving a burial shroud for her father-in-law Laertes. 'Urge me no further till I shall complete... this shroud for old Laertes... I spake, and easily their minds were swayed by what I said, and I began to weave the ample web, but ravelled it again by torchlight every evening. For three years I foiled them thus.' The vital structure: the completion condition is genuinely observable by day (the suitors can watch her loom fill with cloth, which is what makes the condition feel fair rather than evasive) while being secretly, continuously un-done by night, so that observable progress and actual progress toward zero are decoupled. Penelope names her own method without euphemism: 'I with art delay it.' The generalizable claim: when a completion-gated stall is proposed, the credibility of the stall rests entirely on the pressuring party's ability to verify PROGRESS, not COMPLETION — if you control the only channel by which progress is measured, you can let that channel show forward motion indefinitely while ensuring completion never actually arrives, and the appearance of good-faith effort is what buys the time, not any genuine intention to finish."
related: [lex-d7h2y, lex-9pubz, lex-6tvr6, lex-2rn8r]
evokes: [homers-odyssey, penelope, penelopes-web, the-shroud-of-laertes, unravel-by-night, i-with-art-delay-it, fake-progress-metric, hollow-commitment-device, observable-progress-vs-actual-completion]
lineage:
  - source: primary
    text: homer-odyssey-book-xix-penelopes-web
    citation: "Homer, Odyssey, Book XIX, trans. William Cullen Bryant (1871; this ebook a later digitization of the same 1871 text; filename homer_the-odyssey_william-cullen-bryant_advanced.epub). Penelope, speaking to the still-disguised Odysseus, recounts in her own words the shroud-weaving stratagem by which she stalled the suitors for three years; a second, independent account of the same episode is given secondhand by the suitor Antinous in Book II."
    quote: "The suitors urge the marriage rite, / And I with art delay it. Once some god / Prompted me to begin an ample web, / Wide and of subtle texture, in my rooms. / And then I said: 'Youths, who are pressing me / To marriage, since Ulysses is no more, / Urge me no further till I shall complete⁠— / That so the threads may not be spun in vain⁠— / This shroud for old Laertes, when grim fate / And death's long sleep at last shall overtake / The hero; else among the multitude / Of Grecian women I shall bear the blame, / If one whose ample wealth so well was known / Should lie in death without a funeral robe.' / I spake, and easily their minds were swayed / By what I said, and I began to weave / The ample web, but ravelled it again / By torchlight every evening. For three years / I foiled them thus; but when the fourth year came [a servant betrayed the secret and the suitors caught her unraveling the web by night, forcing her to finish it]."
canonical-instances:
  - "The direct pattern-application template: when facing pressure for an irreversible decision, propose a specific, observable, seemingly-fair completion condition under your own control — then ensure the observable channel shows continuous forward motion while the actual completion condition is reset faster than, or as fast as, it advances."
  - "'Penelope's web' as a portable idiom for exactly this move: a task publicly undertaken as the stated precondition for a forced decision, which is privately and continuously undone so that its apparent progress never converges on completion — already partially lexicalized in ordinary usage ('weaving Penelope's web,' 'unraveling it like Penelope') as a recognizable handle for stalling-via-fake-progress specifically, distinct from stalling in general."
  - "Penelope's own naming of the technique ('I with art delay it') as a template for the atom's own self-awareness requirement: unlike lex-e3yhv (self-deception improves other-deception), this technique requires the actor to know precisely what they are doing and why — the deception is aimed entirely outward, at the suitors' inference from observable progress, with no self-deceptive component on the actor's side."
critical-questions:
  - "is this the same claim as lex-6tvr6 (pre-commitment-binds-future-action-against-predictable-erosion)? No — they are structural inverses. lex-6tvr6 (the Ulysses-and-the-mast case) is GENUINE self-binding: the actor removes their own future latitude to guarantee a real outcome despite predictable weakness of will. Penelope's web is a FAKE self-binding: it manufactures the observer's belief that the actor is bound by a real, verifiable process, while the actor's actual freedom of action (to never finish, indefinitely) remains completely intact. lex-6tvr6 trades away real optionality to gain credibility; this atom fabricates the APPEARANCE of traded-away optionality while retaining all of it. Use lex-6tvr6 when the goal is to actually bind yourself; use this atom when the goal is to make someone else believe you are bound while you are not."
  - "is this the same claim as lex-d7h2y (paltering-as-truth-arranged-to-deceive)? Adjacent but distinct. Paltering requires every individual statement the deceiver makes to be literally true, with the deception located entirely in arrangement and inference. Penelope's initial statement ('urge me not until I finish the shroud') is not offered as a technically-true-but-misleading fact — read at face value it is closer to an ordinary promise, and the deception is not in the wording of the promise but in the actor's undisclosed intention never to honor its premise, enacted through a secret, ongoing ACTION (unweaving) rather than through careful arrangement of true statements. Where paltering exploits the target's inferential process on a set of true facts, this atom exploits the target's inability to independently verify a private process (nighttime unweaving) that runs counter to the publicly observable one (daytime weaving)."
  - "what determines how long this technique remains viable? The gap between the pressuring party's verification frequency and the actor's ability to secretly reset progress. Penelope's technique survives exactly as long as the suitors only check in on daytime progress and never observe nighttime activity; it collapses instantly once a single informant (the servant) reveals the private channel. Practitioner-implication: the technique is a wager on the asymmetry between what the pressuring party CAN observe and what they DO observe, not a wager on the completion condition itself being unfalsifiable — a sufficiently suspicious or persistent observer defeats it by increasing observation frequency or coverage, not by disputing the fairness of the original condition."
  - "does the technique require the completion condition to be self-imposed, or can it be externally imposed and still work?  Penelope PROPOSES her own condition, which is part of why the suitors accept it as fair (self-imposed conditions read as good-faith rather than as concessions extracted under duress) — an externally-imposed condition ('you may delay until X is done, but we choose X and we will watch you do it') would remove the actor's control over the verification channel and likely defeat the technique. The atom's claim is therefore narrower than 'propose any delay condition'; it specifically requires the actor to retain control of both the task AND the channel by which its progress is observed."
