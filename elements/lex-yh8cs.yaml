id: lex-yh8cs
name: framing-a-want-as-a-pregnancy-craving-guarantees-maximal-effort
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A stated preference invites a cost-benefit calculation from whoever you're asking — they weigh your want against the effort of granting it and can reasonably say no. Recasting the same want as a physiological necessity you don't control removes that calculation, because refusing now reads as endangering you rather than declining a request. In the Jataka's tale of the great geese, Queen Khema wants to hear golden geese preach — something she suspects doesn't even exist — and reasons through exactly this choice before speaking: \"if I should say to the king, 'I am anxious to hear the preaching of the Law by golden geese,' he will say, 'We have never yet seen any golden geese; there is no such thing as preaching by geese,' and he will take no pains in the matter: but if I say, 'It is a pregnant longing on my part,' he will search for them in every possible way.\" She then feigns illness to sell the frame."
related: []
evokes: [jataka, asitinipata, mahahamsa-jataka, urgency-framing, medicalized-request]
lineage:
  - source: primary
    text: jataka-francis1905-mahahamsa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XXI (Asitinipata), No. 534, Mahahamsa-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "if I should say to the king, \"I am anxious to hear the preaching of the Law by golden geese,\" he will say, \"We have never yet seen any golden geese; there is no such thing as preaching by geese,\" and he will take no pains in the matter: but if I say, \"It is a pregnant longing on my part,\" he will search for them in every possible way."
canonical-instances:
  - "An employee who wants a corner office worth fighting for knows a direct request will get weighed against three other people's tenure and simply lose — so instead they raise it as a health accommodation, glare and back pain from their current desk, a frame their manager can't cost-benefit away without risking liability."
  - "A guest who would merely prefer a window seat, knowing 'preference' loses to a flight attendant's discretion, describes it instead as motion sickness only a window seat controls — converting a request that could be waved off into one that reads as a medical need."
critical-questions:
  - "Khema's stated craving isn't actually true — the 'craving' is invented to fit the goal, not the reverse. Does the tactic depend on this specific kind of fabrication, or would it work just as well if she genuinely believed her own reframing?"
  - "The king never questions whether the longing is real once it's framed as one — is the tactic exploiting a genuine social rule against cross-examining a pregnant person's cravings, or a failure of the king's own diligence in the one case where the stakes might have warranted asking?"
status: active
