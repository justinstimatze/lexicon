evokes: [popper-prediction-and-prophecy-in-the-social-sciences, second-law-of-thermodynamics-as-technological-warning, practical-usefulness-of-social-science, impossibility-results-guide-policy, cannot-rules-versus-prophecy]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Prediction and Prophecy in the Social Sciences' (address delivered to the Plenary Session of the 10th International Congress of Philosophy, Amsterdam, 1948), Ch. 16 of Conjectures and Refutations (Routledge Classics, 2002), pp.461-462, Section IX."
    quote: "'The second law of thermodynamics can be expressed as the technological warning, \"You cannot build a machine which is 100 per cent efficient\". A similar rule of the social sciences would be, \"You cannot, without increasing productivity, raise the real income of the working population\" and \"You cannot equalize real incomes and at the same time raise productivity\". An example of a promising hypothesis in this field which is by no means generally accepted--or, in other words, a problem that is still open--is the following: \"You cannot have a full employment policy without inflation.\" These examples may show the way in which the social sciences are practically important. They do not allow us to make historical prophecies, but they may give us an idea of what can, and what cannot, be done in the political field.'"
canonical-instances:
  - "A CEO dismisses the finance team's models as useless because they never called last quarter's revenue exactly. The models' real value was already delivered earlier: they ruled out a financing plan that assumed the company could grow headcount, cut prices, and hold margin all at the same time -- a combination the underlying unit economics made impossible regardless of how execution went."
  - "A city government funds a transportation study hoping it will predict which neighborhood will gentrify first. The study can't do that, but it does establish a hard constraint: the existing rail line cannot carry both the proposed freight volume and the proposed passenger frequency without a second track. That single 'cannot' reshapes every subsequent proposal, whether or not anyone ever learns which neighborhood changes first."
critical-questions:
  - "How do you tell a genuine impossibility result from a false one dressed up the same way -- couldn't anyone just assert 'you cannot do X' with the same confidence? Popper's own practice supplies the model: he labels his full-employment-without-inflation example 'a problem that is still open' rather than an established result, precisely because it lacks the derivation his other two examples have. The test is the same falsifiability standard applied everywhere else: a genuine 'cannot' claim derives from a stated mechanism that could in principle be shown wrong by a counterexample, and names that mechanism openly rather than resting on confident assertion alone."
  - "Isn't a field that can only say what's impossible still weaker than one that can actually predict outcomes -- doesn't this let low-predictive-power fields off the hook too easily? The atom names a second, independent source of practical value, one that never requires prediction at all -- it says nothing against the value of prediction where prediction genuinely works. A field ideally offers both, but a field with strong impossibility results and weak prediction is still doing real, checkable work. What settles the question is whether its 'cannot' claims are specific and falsifiable -- forecasting ability is a separate, optional bonus."
