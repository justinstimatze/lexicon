canonical-instances:
  - "A junior generalist engineer, after six months inside a large codebase, feels LESS confident they could safely touch every subsystem than they did on day one — and volunteers to specialize on the one component they've actually verified end to end, not from lost ambition but because they now have an accurate map of how much of the rest of the system they don't understand."
  - "A first-year law student who wanted to 'do a bit of everything' narrows to a single practice area by graduation, not because a mentor talked them out of the broader ambition, but because three years of coursework revealed how much depth each area actually demands — the narrowing tracks an improving estimate of the field's true size, not a loss of interest in the rest of it."
critical-questions:
  - "How would you distinguish this mechanism from ordinary risk-aversion or burnout — cases where narrowing scope reflects declining energy or nerve rather than an improving, accurate estimate of the field's size? Both would produce the same observable retreat from breadth to depth."
  - "Kendall and Selvin's data can't rule out that the institution's own specialized structure and faculty (see lex-h5c5x) are what teach students to feel inadequate outside a narrow track, rather than the field's genuine size doing the work unaided — how would you separate a student's independently-formed sense of a field's scope from an institutionally-cultivated one?"
status: active
