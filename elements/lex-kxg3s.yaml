    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 5, '\"Pure Chance,\"' opening the section by way of Jacques Monod's Chance and Necessity. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Most enduring structures (in nature, society, the human psyche) are resistant to fundamental change, by which I mean change that alters the givens of those structures themselves. It’s almost a matter of logic: no self-contained world can induce its own fundamental change, because self-containment means it knows nothing beyond its own givens. In such cases, accidents are useful indeed."
canonical-instances:
  - "A person stuck in the same self-defeating relational pattern for years can journal, reflect, and analyze it exhaustively using their own internal frameworks and never break out of it, because every insight they generate is still produced by the same mind operating the pattern -- what actually shifts things is usually an outside event: a new person, an unplanned experience, a friend's blunt outside observation their own internal logic never would have generated."
  - "A company's internal strategy team keeps producing the same category of product refinement year after year because every idea they generate has to pass through the same internal assumptions about what the company does, and the product line only fundamentally changes after an unrelated outside event, a competitor's unexpected move or an acquired team with no history in the internal logic, introduces information the system had no way to generate on its own."
critical-questions:
  - "Is fundamental change really impossible from purely internal resources, or can sufficiently deep internal reflection sometimes surface genuinely new perspectives that function like external input even though they originate inside the system, complicating the clean internal/external divide the claim depends on?"
  - "How large or disruptive does an external accident need to be to count as capable of producing fundamental rather than merely incremental change, and is there a risk of treating any external input as equally capable of producing the needed shift when most external noise probably changes nothing?"
  - "Does this claim hold equally for social and psychological systems as it does for the biological evolution Monod was actually describing, or does human reflective capacity give minds and institutions some genuine internal route to fundamental self-change that a genome simply doesn't have?"
