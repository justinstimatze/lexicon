id: lex-hubb5
name: a-second-order-tradition-of-criticism-differentiates-science-from-myth
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When asked what actually makes an explanation scientific rather than mythical, resist locating the difference in the content of the explanation itself -- Popper argues the earliest scientific theories were no more sophisticated, as explanations, than the myths they replaced. Popper: 'My thesis is that what we call \"science\" is differentiated from the older myths not by being something distinct from a myth, but by being accompanied by a second-order tradition -- that of critically discussing the myth. Before, there was only the first-order tradition. A definite story was handed on. Later there was still, of course, a story to be handed on, but with it went something like a silent accompanying text of a second-order character: \"I hand it on to you, but tell me what you think of it. Think it over. Perhaps you can give us a different story.\" This second-order tradition was the critical or argumentative attitude.' His own comparison: 'Zeus is angry' explains a thunderstorm at least as easily as an account in terms of air pressure and friction -- the early Greek philosophers' theories weren't harder to refute or more obviously correct than the myths they replaced. What changed wasn't the quality of any single explanation; it was that explanations started arriving with a standing invitation attached -- tell me what's wrong with this, give me a different account -- and under that standing pressure, successive versions were forced to become more realistic and more answerable to observation. Diagnostic move: when comparing a scientific claim to a mythical or dogmatic one and the content alone doesn't obviously settle which is which, ask instead whether the claim is transmitted WITH an expected challenge attached, or transmitted to be received and repeated unchanged. The second-order habit of criticism, sustained across generations, is doing more of the differentiating work than any single explanation's sophistication."
