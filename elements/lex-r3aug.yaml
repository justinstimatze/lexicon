When you find yourself trusting a deliberation because "we removed self-interest," ask the second question: did we remove the conventions everyone in the group shares? Closed impartiality is a check on individual bias; open impartiality is a check on group-level bias; they catch different things and one does not subsume the other.

Sen's diagnostic move in *The Idea of Justice* Ch.6 is that Rawls's veil-of-ignorance is rightly celebrated for what it removes (individual vested interest within the focal group) but is widely mistaken for a complete bias-removal device. It is not. The veil leaves whole-group parochial conventions intact — every person behind it shares them — and the procedure has no internal mechanism to surface them. Smith's earlier device of the impartial spectator (in *The Theory of Moral Sentiments*) was constructed precisely to import distant views, and Sen reads this as the structurally distinct second move that closed impartiality cannot perform. The two procedures are complementary, not redundant: a deliberation that is closed-impartial but open-parochial can be perfectly fair to all its members and still systematically miss what someone outside the group would immediately notice.
