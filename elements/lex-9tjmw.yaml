evokes: [condemned-man-as-courier, fabricated-letter-confirming-rumor, nothing-left-to-lose-removes-leverage, deniable-evidence-carrier]
lineage:
  - source: primary
    text: kautilya-arthashastra-condemned-man-forged-letter
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IX 'Covert Operations,' section 'Against Oligarchies and Enemy Kings,' 'Sowing Dissension Within a Confederacy,' {9.6.28-48}."
    quote: "'When one of the members of the confederacy gets presents from his own land or from outside, the [conqueror's] secret agents shall spread the rumour that these had been received [as a bribe] from the conqueror against whom the confederacy was to start a military campaign. Once the rumours had become widely current, a condemned man shall carry a [fictitious] letter, as if confirming that the conqueror had sent the presents as part payment for fighting or deserting his fellow confederates, with the promise of more payments later. Then secret agents shall make this letter widely known among other members of the confederacy.'"
canonical-instances:
  - "A criminal organization uses a low-level member already facing a life sentence on unrelated charges to physically deliver a forged document implicating a rival gang leader in an informant relationship with police, reasoning that the courier has no remaining incentive to cooperate with investigators even if intercepted, since nothing they could offer in exchange for leniency would improve a sentence already at its maximum."
  - "A wartime intelligence operation, needing to plant a forged document on a body to mislead the enemy about an invasion's true location (the historical 'man who never was' deception), specifically selects a body and cover identity where no living person's actual interrogation or leverage is possible — the same underlying logic of removing exploitable leverage, achieved here through the courier being already dead rather than merely condemned."
critical-questions:
  - "does using someone with nothing left to lose actually reduce risk to the operation, or does it introduce a different risk — a person with no remaining stake in the outcome may also have no remaining incentive to perform the task reliably, to avoid unnecessary suspicion, or to protect the operation's interests in any way beyond the specific instruction given?"
  - "how does an operation actually verify that a condemned person has 'nothing further to lose' — most people retain some leverage-able interest (protecting a family member's safety or reputation, avoiding a worse manner of death, a lingering hope of a reprieve) that a sufficiently resourceful interrogator could still exploit, complicating the clean theoretical picture?"
  - "is there an ethical distinction worth naming between using an already-condemned person's remaining time for an operational purpose versus manufacturing someone's condemnation specifically to create a usable expendable asset — does Kautilya's text, or this atom's modern analogues, ever slide from the former into the latter?"
status: active
