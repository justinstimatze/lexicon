name: meaningful-play-requires-discernable-and-integrated-outcomes
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "Salen and Zimmerman give an evaluative definition of when a game's feedback actually produces meaning: the relationship between a player's action and the game's response has to be both discernable and integrated. Discernable means the outcome is perceivable -- shoot an asteroid and hear no impact, see no change, and the action carries no felt meaning even if it registered internally. Integrated means the outcome carries forward and shapes what's possible later, rather than dead-ending on the spot -- their Decathlon example makes the failure vivid: if the opening footrace's result had zero bearing on the rest of the game, rational competitors would walk it, saving energy for events that actually mattered. Each condition fails in its own distinct way and neither substitutes for the other. An outcome that's clearly signaled but consequence-free is discernable without being integrated -- it registers, then evaporates, and starts to feel hollow no matter how much sound and visual feedback it gets. An outcome that matters enormously later but was never perceptible in the moment is integrated without being discernable -- it feels arbitrary and unfair, a consequence with no legible cause. This generalizes past games to any system that gives a person feedback on their own actions. A dashboard that flashes a clear confirmation on every click but never changes anything downstream trains people to stop trusting the confirmation. A policy change that quietly reshapes outcomes months later, with no visible signal at the moment someone acted, reads as arbitrary even when the causal chain is real. Before treating a feedback signal as sufficient, check both conditions separately: can the person actually perceive what just happened, and does what happened actually change what's possible next?"
