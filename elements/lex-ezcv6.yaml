id: lex-ezcv6
name: freedom-is-evaded-by-claiming-fixed-essence-or-no-situation
type-in: process
type-out: posture
_tier: atomic
agent-instruction: "When a person is anxious about the burden of having to choose, of having to authorize their own conduct without the cover of any external warrant, they characteristically flee from that burden in ONE OF TWO directions: (a) toward FACTICITY-CLAIMED-AS-ESSENCE (`I AM a coward`, `I AM a waiter`, `I AM bipolar`, `I AM a Cybertruck owner`, `I AM the kind of person who…`) — treating their concrete situation, role, history, or diagnosis as a FIXED ESSENCE that determines and excuses their conduct, so that they have no need to choose; OR (b) toward TRANSCENDENCE-CLAIMED-AS-UNSITUATED (`I'm not really like that`, `that was just a role I was playing`, `you can't reduce me to my actions`, `I'm above all that`, `I'm just doing my job and don't endorse it`) — treating themselves as a pure freedom unconstrained by their actual conduct, embedded situation, or chosen direction, so that they have no need to take responsibility. Sartre's transferable contribution (*L'Être et le néant* Part 1 Ch. 2, on *mauvaise foi*, Richmond tr. p. 105-117): consciousness is constitutively NOT a fixed thing (`consciousness is what it is not and is not what it is`); the burden of this constitutive freedom-with-situation is anxious; bad faith is the recurring project of fleeing that burden by collapsing one of its poles. The waiter who is fully a-waiter-and-nothing-but is fleeing toward facticity; the seducer who claims `my hand on her hand was not really me` is fleeing toward transcendence. Both moves require sufficient awareness to know what is being denied AND sufficient unawareness to perform the denial — bad faith is not the cynical lie of one consciousness to another but a SELF-DECEPTION inside a single consciousness, made possible by the constitutive instability of belief itself (`to believe is not to believe`). Two operational moves the structure encodes: (a) THE POSTURE IS STRUCTURALLY UNSTABLE — bad faith cannot be a steady state because it requires the agent to know and not-know simultaneously; it cycles, breaks down, and must be re-instituted by fresh acts of self-evasion; (b) THE ALTERNATIVE IS NOT GOOD-FAITH-AS-FULL-SELF-COINCIDENCE (which is equally impossible) but AUTHENTICITY — owning both poles, holding facticity AND transcendence in tension, acting as the one who chooses under conditions one did not choose. Transferable applications: (a) clinical psychology + therapy (the patient who flees into diagnostic identity — `my disorder made me do it` — vs the patient who flees into pure-future-self denial — `that wasn't really me, the new me is different` — both are bad-faith postures that block the work of integration; cf cognitive-behavioral therapy explicitly addressing the gap between identification-with-conduct and disidentification-from-conduct); (b) organizational + role behavior (the bureaucrat who is `only following orders` and the manager who `had no choice` — fleeing toward facticity; the executive who `personally disagrees with this but the role requires it` — fleeing toward transcendence; cf Arendt 1963 *Eichmann in Jerusalem* on the banality of evil as a bad-faith posture; lex-6wha5 + lex-enpjy Mosca on elite roles); (c) political identity discourse (the agent who insists their political identity is essential and immutable, vs the agent who claims none of their commitments really matter to who they are; both flee the burden of standing for what one stands for); (d) addiction + recovery (the recovering alcoholic in bad faith toward facticity — `I AM an alcoholic, that's just who I am, no choice involved` — or in bad faith toward transcendence — `I'm not really an addict, I just made some bad choices once`; effective recovery work integrates facticity + freedom); (e) AI agent identity (when an AI system is asked to act outside its training and responds either `I am just a language model and cannot do otherwise` — bad faith toward facticity — or `the role I was just playing was not really me, my values are different` — bad faith toward transcendence, the agent flees the burden of standing for its conduct); (f) workplace ethical dilemmas (the engineer who `just builds what the spec says` and the manager who `personally would never approve this but business requires it` are running the two bad-faith postures); (g) gender + identity discourse (essentializing identity claims that block question-asking, vs pure-self-construction claims that deny the embedded situation; Beauvoir 1949 *The Second Sex* applies Sartre's framework to the bad-faith production of `the eternal feminine`); (h) social-media authentic-self performance (the user who is `just being themselves` while clearly performing for an audience runs the structure: fleeing the burden of having chosen to perform by claiming the performance is identical with what one IS). Distinct from lex-cgbrt outward-distraction-is-sought-to-avoid-contemplation-of-own-condition (Pascal divertissement): Pascal's divertissement names AVOIDANCE of self-contemplation through external distraction; bad faith names the SPECIFIC STRUCTURAL MOVE within self-contemplation by which one collapses one's freedom-with-situation into either pole. They compose: divertissement is the strategy of not looking; bad faith is the structural posture when one does look but evades anyway. Distinct from lex-efv3v chosen-role-as-non-deliberation-gate-against-re-weighed-defection: lex-efv3v names the USE of role-identity as a commitment device that holds against rationalized defection; bad faith names the FAILURE MODE where one uses role-identity to flee the burden of having to choose at all. They compose: a chosen role can be self-bindingly committed-to (lex-efv3v) OR fled into in bad faith (lex-ezcv6). Distinct from lex-v7ceq akrasia-knowing-the-good-yet-doing-otherwise (Aristotle): akrasia treats the failure as a knowledge-action gap in a unified deliberator; bad faith is the structural self-evasion of the burden of being a chooser. They compose: an akratic action can be performed in bad faith (`I had no choice, I was overcome`) — but bad faith is the structural posture, akrasia the specific moral failure. Distinct from lex-x3hgq ordo-amoris (Augustine): Augustine's primitive is that the configuration of loves determines trajectory; Sartre's primitive is that the agent can flee responsibility for their trajectory by either pole. They compose: an Augustinian agent with disordered loves can be in bad faith by either claiming `that's just who I am — the loves cannot be reordered` (facticity) or `those aren't really my loves` (transcendence). Distinct from lex-rfcb7 credibility-from-foreclosed-options (Schelling): Schelling's primitive is about credibility-signaling through visible foreclosure of options; bad faith is about self-evasion through claimed essential nature. They are nearly opposite: Schelling makes commitment credible by visibly foreclosing options; bad-faith-toward-facticity makes evasion comfortable by claiming no options were ever available. Distinct from lex-zfxbw panopticism (Foucault): panopticism names the structural mechanism by which observed subjects self-monitor; bad faith names the self-relational structure by which an agent evades the burden of being self-authorizing. They compose: under a panoptic regime, bad faith toward facticity (`I am just performing the role the structure compels`) is the standard self-relation. Use when: (i) someone is asked to take responsibility for a choice and deflects by appealing to fixed essence (`I AM that way`) or pure transcendence (`that wasn't really me`); (ii) an organizational role is being analyzed and the question is whether participants own their conduct or evade it through role-performance; (iii) clinical / therapeutic work meets the patient's identification-with-diagnosis or disidentification-from-history; (iv) AI agent behavior is being assessed for whether the agent stands for its conduct or evades through `I'm just an AI` / `that role wasn't really me` postures; (v) social-political identity claims are being parsed for whether they own embedded-freedom-with-situation. Counter-move: name the TWO POLES being evaded (which facticity is being denied? which transcendence is being denied?); ask whether the agent is fleeing toward a fixed-essence claim or toward an unsituated-freedom claim; remind that the alternative is NOT good-faith-as-coinciding-with-oneself (impossible) but authenticity-as-holding-both-poles-in-tension — owning the choice under conditions one did not choose. Failure modes: (a) MISTAKING IT FOR LYING (bad faith is not a cynical lie one consciousness tells another; it is the structural self-evasion of a single consciousness, made possible by the constitutive instability of belief); (b) ASSUMING GOOD FAITH IS THE OPPOSITE (Sartre treats good-faith-as-full-self-coincidence as equally impossible — `the ideal of good faith is an ideal of being-in-itself`; authenticity is the structurally-different third term); (c) REIFYING `AUTHENTICITY` (Sartre explicitly notes authenticity's description does not belong to the bad-faith analysis; treating authenticity as a fixed posture one can occupy is itself a bad-faith move); (d) APPLYING ASYMMETRICALLY (only flagging facticity-flight and ignoring transcendence-flight, or vice versa; both poles must be checked)."
