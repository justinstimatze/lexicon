id: lex-pxzz8
name: refusing-an-imposed-hierarchy-by-claiming-direct-unmediated-access-to-ultimate-authority
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person under pressure to formally submit to an occupying power's designated authority figure can refuse by asserting that no intermediary stands between them and the actual source of legitimacy they already answer to directly. Pressed to travel to Washington with Red Cloud and Spotted Tail to see 'the Great Father,' Crazy Horse would not go, and gave the refusal a specific theological shape rather than a merely practical one: 'He told them that he did not need to go looking for his Great Father. He said: \"My Father is with me, and there is no Great Father between me and the Great Spirit.\"' The refusal doesn't dispute the Wasichus' authority over their own people -- it denies that any such figure has standing to sit between Crazy Horse and the power he already answers to."
related: []
evokes: [black-elk-speaks, killing-of-crazy-horse, no-great-father-between-me-and-the-great-spirit, refusing-the-intermediary, direct-unmediated-authority]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch11-killing-of-crazy-horse
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 11, 'The Killing of Crazy Horse.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "That summer, my father told me, the Wasichus wanted him to go to Washington with Red Cloud and Spotted Tail and others to see the Great Father there; but he would not go. He told them that he did not need to go looking for his Great Father. He said: 'My Father is with me, and there is no Great Father between me and the Great Spirit.'"
canonical-instances:
  - "A monk within a colonized religious order refuses a summons to be formally received by the colonial church's appointed bishop. He says his obedience runs straight to the god that bishop only claims to represent on earth."
  - "A tribal leader declines a government's invitation to a formal recognition ceremony with a state governor, stating that his people's sovereignty was never the governor's to grant or withhold in the first place."
  - "An independent researcher refuses to submit their findings through a corporate-sponsored review board. Their work answers to the scientific method itself, they say, and a gatekeeper's blessing was never what made it valid."
critical-questions:
  - "Does refusing the intermediary actually preserve any practical independence, given that Crazy Horse's refusal to travel to Washington didn't stop the surrender, disarmament, and eventual killing that followed regardless -- or is the statement's value entirely symbolic?"
  - "Is there a real difference between refusing to recognize an imposed hierarchy and simply lacking the power to resist it -- would Crazy Horse have accepted the trip if refusing it carried a cost he couldn't survive, and does that possibility change how the refusal should be read?"
  - "The Wasichus' own title, 'the Great Father,' already claims the paternal-authority framing Crazy Horse rejects -- does his answer work specifically because it exposes and inverts their own chosen language, rather than simply asserting a competing claim in his own separate terms?"
status: active
