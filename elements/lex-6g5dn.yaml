  - source: primary
    text: goss-1957-no-stigma-attached
    citation: "Mary E. W. Goss, \"Change in the Cornell Comprehensive Care and Teaching Program\" (1957), p.258."
    quote: "'There was definite understanding, therefore, that beginning Program arrangements were not considered fixed and immutable by those in charge, and need not be so viewed by staff members... This meant, in practice, that no stigma attached to finding \"something wrong\" with the Program; in fact, the Director welcomed knowledge of problems encountered, since such information allowed planning for the future on a more informed basis. When, for example, the Social Service Coordinator reported that despite her best efforts not enough families had been recruited, the situation was cause for deliberation over which of the original selection criteria might be at fault, rather than recrimination concerning a job not completed.'"
canonical-instances:
  - "A startup CEO tells the team from day one that the pricing model is 'version one, expect us to change it within six months' — when the sales team later reports the price is losing deals, the report reads as useful market data rather than an admission that someone chose badly, because the plan was never framed as final."
  - "A school pilots a new grading rubric explicitly as a 'one-semester trial, not a permanent policy' — when teachers report the rubric doesn't handle group projects well, the finding gets treated as expected trial output rather than a teacher's failure to make it work."
critical-questions:
  - "Does the experimental label only relocate the stigma rather than remove it — from 'you made a mistake implementing the plan' to 'the plan itself, which leadership chose, was flawed'? Goss's data shows staff readily reported problems, but doesn't show whether anyone was later blamed for the ORIGINAL choice of criteria once enough problems accumulated."
  - "Is the effect durable, or does it decay the longer an 'experimental' arrangement stays in place unchanged — at what point does staff stop believing 'we can always change it' and start treating the current arrangement as the permanent one regardless of the original framing?"
status: active
