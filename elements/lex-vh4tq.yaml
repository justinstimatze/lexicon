id: lex-vh4tq
name: an-unenacted-offer-to-trade-places-converts-a-captor
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Offering to physically trade places with someone a captor holds doesn't require the captor to actually accept the trade for it to work — the sincerity of the offer alone can convert a captor's disposition, proving you value the captive's life above your own in a way argument by itself can't. In the Jataka's tale of the great geese, still free and unbound himself, Sumukha tells the fowler holding his king: \"I too am gold-coloured and for his sake will lay down my life. If you are anxious to take his feathers, take mine; or, if you would have anything else of his, skin, flesh, sinew or bone, take it from my body.\" The fowler never takes him up on it — he releases the king untouched, moved by the offer itself."
related: [lex-kwxam]
evokes: [jataka, asitinipata, mahahamsa-jataka, cullahamsa-jataka, self-substitution-offer, captor-conversion]
lineage:
  - source: primary
    text: jataka-francis1905-mahahamsa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XXI (Asitinipata), No. 534, Mahahamsa-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "I too am gold-coloured and for his sake will lay down my life. If you are anxious to take his feathers, take mine; or, if you would have anything else of his, skin, flesh, sinew or bone, take it from my body."
canonical-instances:
  - "In the Jataka's companion tale of the little geese (Book XXI, No. 533, Cullahamsa-jataka), Sumukha makes the same unaccepted offer to a different fowler: he asks to be bound in the snare himself so the king can go free. The fowler again refuses the trade and releases both birds untouched."
  - "A company's outside counsel, present but not personally implicated in a fraud investigation, tells the prosecutor he'll plead to the charges himself if it means the founder walks — the prosecutor never takes the offer, but drops the case against the founder days later, visibly moved that anyone would offer to take the fall for someone who didn't ask them to."
critical-questions:
  - "In both tellings the substitute offering himself was never actually bound or at risk when he made the offer — does the tactic's power depend on the offer being credible enough that the captor believes it would be honored, or does making an offer everyone secretly knows is safe still count as real devotion?"
  - "The fowler releases the king specifically because Sumukha's offer moves him emotionally, not because it changes what he stands to gain — is this genuine moral conversion, or does the eloquence just give a captor who was already wavering a graceful reason to do what he was leaning toward anyway?"
status: active
