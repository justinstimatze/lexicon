id: lex-jjzh7
name: state-by-state-dominance-bounds-value-without-a-probability-model
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you need a rigorous bound on some quantity's value but lack, or don't trust, a probability model for how the underlying uncertainty will resolve, check whether you can construct two comparable positions whose outcomes you can rank in every single possible future state, not merely on average. Merton's 1973 option-pricing paper builds an entire scaffold of pricing restrictions this way, defining the tool up front: 'Security (portfolio) A is dominant over security (portfolio) B, if on some known date in the future, the return on A will exceed the return on B for some possible states of the world, and will be at least as large as on B, in all possible states of the world' — then constraining any rational price by the rule that 'the option be priced such that it is neither a dominant nor a dominated security.' To prove a warrant must be worth at least its discounted intrinsic value, he compares buying the warrant plus enough bonds to cover the exercise price against buying the stock outright, then checks both positions' payoffs in the only two states that can occur at expiration — stock ends below the exercise price, or above it: 'Suppose at the end of r years, the common stock has value S*. Then, the value of B will be S*. If S* < E, then the warrant is worthless and the value of A will be 0 + E = E. If S* > E, then the value of A will be (S* - E) + E = S*. Therefore, unless the current value of A is at least as large as B, A will dominate B.' No forecast of which state is more likely, no interest-rate assumption beyond positivity, no risk-preference estimate enters the proof anywhere — only the state-by-state ordering does the work. Before reaching for a full probabilistic model to bound something, ask whether a comparison this blunt, worse in no state and better in at least one, already settles the question."
