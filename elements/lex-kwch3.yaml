id: lex-kwch3
name: impersonal-war-markets-manufacture-self-interest-as-real-motive
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you encounter the assumption that everyone's 'real' motive is self-interest -- that generosity, pride, love, and loyalty are just the polite cover story for what people actually want -- recognize that assumption as a specific historical product. In ordinary human economies, where people know each other and expect to go on knowing each other, motives are assumed to be genuinely mixed: a lord's gift to a retainer can be generous, strategic, and self-glorifying all at once, with no felt contradiction. What changes that is impersonal cash exchange between strangers, born out of the violence of the Axial Age -- soldiers disposing of loot, merchants trading goods nobody asks too many questions about, transactions between people who will never see each other again. Only in that setting does it start to feel natural to strip away every stated motive and assume self-interested calculation is what's really underneath. The 'rational self-interested actor' picture of human nature that founds so much of modern economics is best read as the residue of a specific historical transaction type -- violent, anonymous, one-off exchange -- that became common enough to look like the paradigm case for all human exchange."
related: [lex-dccpt]
evokes: [david-graeber, debt-the-first-5000-years, axial-age, self-interest, homo-economicus, human-economies]
