id: lex-6g5dn
name: labeling-an-arrangement-experimental-removes-stigma-from-revising-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you want an organization to actually notice and fix its own problems, rather than hide or defend them, declare the arrangement experimental from the outset — before any problems have even appeared. Goss identifies this as the single condition that most 'geared' staff of a new medical-training program to see problems in the first place: the program's own Advisory Committee chairman had formally stated that 'the enterprise as outlined must be regarded as an experiment in medical education,' reinforced by the Director's informal framing: '\"We won't know whether the idea of comprehensive care is worthwhile unless we try it. If something turns out to be inefficient or undesirable, we can always change it.\" Many times over staff members heard statements such as this, emphasizing the trial character of C. C. & T. P. aims and activities.' The mechanism she names directly: 'There was definite understanding, therefore, that beginning Program arrangements were not considered fixed and immutable by those in charge, and need not be so viewed by staff members.' The practical payoff shows up in how a specific failure got handled: 'This meant, in practice, that no stigma attached to finding \"something wrong\" with the Program; in fact, the Director welcomed knowledge of problems encountered, since such information allowed planning for the future on a more informed basis. When, for example, the Social Service Coordinator reported that despite her best efforts not enough families had been recruited, the situation was cause for deliberation over which of the original selection criteria might be at fault, rather than recrimination concerning a job not completed.' The framing has to be established BEFORE the problem surfaces, repeatedly and from multiple voices (formal committee language and informal daily talk both), or a failure gets read as personal fault rather than expected information. Diagnostic move: before launching any new plan, policy, or process, ask whether it has been explicitly and repeatedly labeled provisional/experimental to everyone who will operate it — not as a hedge to avoid commitment, but as a deliberate mechanism for converting future failure reports from blame-events into planning-events."
related: [lex-b45am]
evokes: [goss-1957, experimental-outlook-removes-stigma, trial-character-of-a-plan, no-recrimination-for-reported-problems, we-can-always-change-it]
