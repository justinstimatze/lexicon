evokes: [conceal-the-kings-illness, double-of-the-king, treasury-and-army-collected-in-one-place, information-control-as-cover-for-resource-consolidation, chief-councillor-manages-succession]
lineage:
  - source: primary
    text: kautilya-arthashastra-conceal-kings-illness
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part III 'The King,' section 'Succession,' 'Organizing Succession on the Death of a King,' {5.6.2-6}."
    quote: "'Well before the anticipated death of the king, the councillor shall, with the help of his friends and followers, allow visitors [to see the king] once in a month or two; [in order to conceal the seriousness of the king's illness, more frequent visits shall be avoided] on the plea that the king was very busy in performing special rites for the prevention of national calamities, the destruction of enemies, long life or getting a son. When [unavoidably] necessary, a double of the king may be shown to the people and envoys (of allies and enemies), at such times when the deception would not be obvious; the double shall hold discussions with envoys [only] through the councillor. With the connivance of the Commandant of the Palace Guards and the King's Chamberlain, the councillor shall give the impression that the king performs all his daily duties.'"
  - source: primary
    text: kautilya-arthashastra-consolidate-treasury-army
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part III, section 'Organizing Succession on the Death of a King,' {5.6.7}."
    quote: "'The councillor shall collect both the treasury and the army together in one place, either within the fort or at the frontier, and place them under the charge of two trustworthy men. Princes, close relatives of the king and important officials shall also be brought together under some pretext.'"
canonical-instances:
  - "A company's board, informed that the CEO has suffered a sudden incapacitating stroke, delays a public announcement for a few days specifically to finalize an interim-successor agreement, secure signing authority over accounts, and brief key clients privately — the delay is defensible exactly as long as it is spent on that consolidation and becomes a governance scandal the moment it's used merely to manage the stock price."
  - "A political party facing the sudden death of its leader before an election quietly manages public appearances and statements attributed to the leader for a short window while internal factions negotiate who will actually take over, but faces severe backlash if that window turns out to have been used only to buy time for internal power struggles rather than to arrange a stable, quick transition."
critical-questions:
  - "how would outside observers (or the leader's own faction) distinguish, in real time, concealment that is legitimately buying time for consolidation from concealment that has become an end in itself — is there any visible signal of 'the consolidation is actually proceeding' short of trusting the concealer's own account?"
  - "does this tactic assume the concealer (the councillor) is trustworthy and acting in the institution's interest — what happens when the person best positioned to conceal a vacuum is the same person who benefits most from prolonging it, since Kautilya's own text immediately goes on to describe a councillor (Bharadvaja's view) who argues for seizing the vacancy outright?"
  - "in a modern context with continuous media scrutiny and instant information spread, is the concealment window Kautilya assumes (weeks to months, per 'once in a month or two') even achievable, or does the tactic's viability depend on an information environment that no longer exists for most modern organizations?"
status: active
