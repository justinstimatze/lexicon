id: lex-9exaw
name: chosen-time-frame-determines-which-causal-structures-can-be-detected
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When analyzing causation, the chosen time frame determines which causal structures can be detected. A short window misses slow causes; a long window misses fast ones. Match the analytic time frame to the suspected causal scale; mismatched frames produce phantom causes or hide real ones."
