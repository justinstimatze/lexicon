id: lex-uz7g4
name: archetype-as-projective-shorthand
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When you label someone or something with an archetype ('Cassandra', 'Trojan horse', 'martyr'), name what the archetype illuminates AND what it obscures. The archetype is a useful pump, not the full picture."
related: [lex-2gtzb, lex-2kwkh, lex-33w6z, lex-3hefg, lex-3mgdz, lex-3yvwm, lex-68abd, lex-8cbn9, lex-99f5w, lex-9spu2, lex-a5hxu, lex-b3vap, lex-chp44, lex-ctnnx, lex-dzqje, lex-e8wv6, lex-etdx7, lex-gng22, lex-h7vet, lex-hbgcb, lex-hng49, lex-jvr5p, lex-maq83, lex-mh7jf, lex-nahg9, lex-ndkkb, lex-nzj6u, lex-ppq72, lex-q8az5, lex-rxvus, lex-s2pjj, lex-t28ya, lex-tjwfn, lex-u68ue, lex-u8u7y, lex-uanys, lex-utuy6, lex-uyk6e, lex-vacbr, lex-vtytt, lex-z9s5d, lex-zgmyw, lex-zqf8z, lex-zxrtf]
scaffolds-from: [lex-t28ya, lex-nahg9, lex-gng22]
evokes: [named-character-as-pattern-pointer, the-figure-stands-in-for-the-cluster, jungian-handle, the-archetype-is-the-handle-not-the-territory]
lineage:
  - source: primary
    text: jung-cw9i-archetypes-collective-unconscious
    citation: "C.G. Jung, The Archetypes and the Collective Unconscious (Collected Works vol.9 part 1, Princeton/Bollingen, 1959; essays composed 1934-1955), tr. R.F.C. Hull, essay 'The Concept of the Collective Unconscious' (1936) para 99. The canonical psychological articulation of archetypes as inherited forms (not contents); building on Plato's eidos and Jung's earlier 'primordial image' (urtümliches Bild) terminology from Psychological Types (CW6, 1921). The shift from 'primordial image' to 'archetype' in the 1930s essays is the canonical-modern statement"
    quote: "There are as many archetypes as there are typical situations in life. Endless repetition has engraved these experiences into our psychic constitution, not in the form of images filled with content, but at first only as forms without content, representing merely the possibility of a certain type of perception and action."
  - source: practitioner
    text: campbell-1949-hero-with-thousand-faces
    citation: "Joseph Campbell, The Hero with a Thousand Faces (1949) — the monomyth as evidence that named archetypal figures (Hero, Mentor, Threshold Guardian, Shadow, Trickster, Goddess) recur cross-culturally in narrative; the recurrence IS the indispensable evidence that archetypes are real cognitive handles"
  - source: practitioner
    text: tarot-major-arcana-tradition
    citation: "Tarot's 22 Major Arcana (The Fool, The Magician, The High Priestess, The Empress, The Emperor, The Hierophant, The Lovers, The Chariot, Strength, The Hermit, Wheel of Fortune, Justice, The Hanged Man, Death, Temperance, The Devil, The Tower, The Star, The Moon, The Sun, Judgement, The World) — each a named archetypal figure functioning as projective handle for a cluster of psychological/situational patterns"
  - source: practitioner
    text: tarot-decomposition-pass
    citation: "promoted from cross-attestation: Jung (archetypes literature), Campbell (monomyth), Tarot (Major Arcana), MTG color pie (gold-standard primitive-explanation), drivermap (https://github.com/justinstimatze/drivermap — typed behavioral-mechanism vocabulary; same shape: named characters carry pattern-clusters), D&D character classes (Fighter / Wizard / Rogue as archetypal handles), marketing buyer personas (named-fictional-buyer as projective handle for market segment), Sanderson Cosmere structural framing (cited as inspiration). Cross-domain attestation across psychology, narrative, gaming, marketing"
canonical-instances:
  - "NAMED FIGURE as handle for a cluster: 'Marketing Mary' the buyer-persona, 'the Trickster' the archetype, 'Fighter' the D&D class — the figure is intentionally underspecified to invite projection; the projection IS the work, the figure IS the coordination-substrate"
  - "Tarot The Magician card: agency-as-arrangement (the wand, cup, sword, pentacle on the table representing tools available); the named figure stands in for 'when you have all the tools and the work is to arrange them.' The card is a hook for the cluster, not a literal description"
  - "D&D character classes: 'Fighter' isn't a description of a person; it's a bundle of mechanics + role + narrative-tropes that lets a player and DM coordinate quickly using a shared handle. The archetype is the coordination-substrate"
  - "operationally distinct from lex-nahg9 upaya: upaya is the stance toward views (vehicles to be discarded); archetype-as-projective-shorthand is a SPECIFIC kind of vehicle — the named-character-handle. The named character is upaya operating on personality-and-role rather than on view-and-position"
  - "operationally distinct from lex-chp44 meta-pointer: meta-pointer marks 'more detail than represented'; archetype-as-projective-shorthand is the specific shape of representing complex patterns via SINGLE NAMED FIGURES that the user projects detail onto. The handle is intentionally underspecified to invite projection"
  - "operationally adjacent to lex-gng22 perspective-shift-via-imagined-other: 'what would your closest friend do?' is perspective-shift via a SPECIFIC imagined other; archetype-as-projective-shorthand is perspective-shift via a NAMED ARCHETYPAL other (the Hermit, the Trickster, the Mentor)"
critical-questions:
  - "the under-specification test: is the named figure under-specified enough to invite projection, or over-specified to the point of preventing it? The handle works because the user fills in detail; an over-specified figure ('Marketing Mary: 34-year-old graphic-designer in Brooklyn with twin daughters and a Volvo') loses the projective quality. Practitioner-discipline: spec the archetype just enough for users to coordinate, no more. The intentional gap IS the affordance"
  - "the crucial vs decorative discriminator: is the archetype actually doing coordination work, or is it being referenced for color while real decisions get made via other means? The test: would the work output change if the archetype were replaced with a different one or with no archetype at all? If the answer is 'no, the work would proceed the same way,' the archetype is decorative — and decorative archetypes accumulate complexity-cost without delivering coordination-benefit"
  - "the archetype-as-position failure-mode: archetypes are upāya (lex-nahg9) — vehicles to be discarded once they have done their work. They calcify when users start defending the archetype against the territory ('a Wizard would never do that' becomes a constraint on legitimate moves rather than a coordination handle). Practitioner-question: am I holding this archetype lightly as a pointer, or treating it as a position that must be defended?"
  - "the cultural-fluency dependency: does the archetype travel to the audience using it? 'The Trickster' is widely-recognizable across cultures with mythological literacy; 'Marketing Mary' requires shared marketing-context; a niche-fandom archetype works only within that fandom. Practitioner-question: do all the people coordinating via this archetype share the cultural-fluency it requires? If not, the archetype is invisible-overhead for those who don't carry the fluency"
  - "the coverage-domain limit: how many distinct clusters does the archetype handle gracefully? The Trickster handles disruption + cleverness + boundary-violation + truth-via-mockery as a single coherent handle. Forcing it to also handle sex, agriculture, or weather stretches it and erodes its utility. Practitioner-discipline: when an archetype keeps getting reached for beyond its native cluster, that's a signal to mint another archetype rather than stretch the existing one"
status: active
