id: lex-5w8jb
name: an-impostor-is-tested-against-invariant-traits-not-costume-or-backstory
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone dresses an unqualified party in the trappings of expertise and supplies a plausible backstory to see if the deception holds, don't evaluate the costume or the story at all. Ask instead what the underlying party actually is and can do. Being told a convincing story about a role is not evidence of fitness for that role. In the Jataka's tale of the disguised monkey, courtiers repeatedly present a monkey dressed as an expert to a child-king, complete with an elaborate false backstory, to see if he can be fooled. Each time, he answers from the animal's fixed nature rather than the presentation: 'It is not a clever builder, but an ape with a wrinkled face; He can destroy what others make; that is the way of his race.' The test target was never the costume. It was whether the observer would check the substrate underneath it."
related: []
evokes: [jataka, tikanipata, gamani-canda-jataka, testing-the-underlying-substrate-defeats-costume-and-narrative, a-plausible-backstory-is-not-evidence-of-role-fitness]
