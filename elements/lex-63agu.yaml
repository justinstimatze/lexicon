id: lex-63agu
name: overshoot-deliberately-then-design-the-removal-step
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When precisely delivering the right amount of something is hard but delivering too much is easy, don't keep trying to perfect the precise delivery — deliberately overshoot on purpose, and put your design effort into removing the excess instead. Altshuller works this through on a real manufacturing problem: small plastic cylinders need an even paint coat, but a spray gun run at full power coats them almost instantly with too much paint (a bad, slow-drying coat), while a spray gun turned down low can be timed precisely but wrecks productivity. The natural instinct is to keep hunting for a way to apply exactly the right amount directly. Altshuller's model of the problem inverts the goal instead: 'the conflicting pair is the cylinder and a large (too much) quantity of paint... The entire problem boils down to removing the superfluity of paint... 'Common sense' tells you to prevent a superfluous coat from forming: why first apply too much and then remove it? The logic of ASIP is different: a superfluous coat of paint can be applied easily, so all right, let's do it! The artefact is painted (and, moreover, quickly), and it only remains to remove the superfluous paint. In fact the problem 'How to apply paint well' has now been replaced by 'How to remove paint well'.' The reframed problem turns out to be far more tractable: a large excess coat can be applied by simply pouring or dipping (fast, no precision needed at all), and removing the excess resolves into a clean physical question — the coat's own drying-in-progress paint particles are weakly bonded to each other but strongly bonded to the cylinder surface, so a field of the right strength (centrifugal force, arrived at by spinning the dipped cylinder) throws off the loosely-bonded excess while leaving the strongly-adhered useful layer intact. The whole redesign becomes possible only because the goal itself was inverted first — from 'apply precisely' (hard) to 'apply crudely, then remove precisely' (two easy steps instead of one hard one). Diagnostic move: when a process demands fine control over how much of something gets delivered and that control keeps fighting speed or cost, check whether generously overshooting the delivery is cheap and fast — if it is, stop trying to perfect the delivery step and instead design a removal step that exploits some real physical or structural difference between the excess and the wanted portion (how firmly each is attached, how each responds to a field or force), because 'deliver crudely, then remove precisely' can be far easier than 'deliver precisely' in one shot."
related: [lex-2dtcp, lex-mnxhs, lex-uq4xw]
scaffolds-from: [lex-mnxhs]
evokes: [paint-spray-cylinder-example, apply-too-much-then-remove-superfluity, invert-apply-well-to-remove-well, centrifugal-excess-removal]
lineage:
  - source: primary
    text: altshuller-1984-paint-overshoot-then-remove
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.4 'Talented Thought: What is it?', section 'Two Interesting Examples.'"
    quote: "'The entire problem boils down to removing the superfluity of paint (admittedly it is better not to remove it altogether but only in such a way that the residue returns to the vat). 'Common sense' tells you to prevent a superfluous coat from forming: why first apply too much and then remove it? The logic of ASIP is different: a superfluous coat of paint can be applied easily, so all right, let's do it! The artefact is painted (and, moreover, quickly), and it only remains to remove the superfluous paint. In fact the problem 'How to apply paint well' has now been replaced by 'How to remove paint well'.'"
  - source: primary
    text: altshuller-1984-paint-centrifugal-solution
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.4, 'Two Interesting Examples.'"
    quote: "'The useful little men adhere to the surface and the 'superfluous' little men only to each other. The different power of connection signifies that there is one mark by which one can distinguish the 'superfluous' little men from the 'useful'... If we examine only the mechanical effects the answer is obvious: centrifugal forces are at work. The cylinder is dipped into the paint and rotated. The centrifugal force hurls the superfluous paint off. The process is controlled by regulating the number of rotations. Many cylinders can be processed at the same time.'"
canonical-instances:
  - "A writer struggling to draft the exact right length section stops trying to write precisely to a word count and instead writes generously over-length quickly, then edits down — the cutting pass is a different, more tractable skill (spotting what's weakest) than trying to compose exactly the right amount from a blank page."
  - "A machine-learning team struggling to precisely tune a retrieval system's result count stops trying to return exactly the right number of relevant documents directly and instead retrieves a generously oversized candidate set cheaply, then applies a fast reranking/filtering step to trim it down — retrieval doesn't need to be precise if filtering is cheap and reliable."
  - "operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition: that atom resolves a contradiction by splitting a parameter across space, time, or context; this atom resolves a precision-vs-speed tradeoff by REFRAMING THE GOAL ITSELF — replacing 'deliver the right amount' with 'deliver too much, then remove the excess' — a sequencing move rather than a splitting move, though the two can be combined (the removal step here also happens to separate the excess from the useful coat spatially, at the cylinder's surface)."
critical-questions:
  - "how does someone know in advance that overshooting will be cheap and that a removable difference (like differing bond strength) will exist between the excess and the wanted portion — does the technique only apply when that structural difference happens to be available, and how would a solver check for it before committing to the overshoot-then-remove reframing?"
  - "does the removal step ever cost more than the precision it was meant to avoid — could 'overshoot then remove' turn out to be a net loss if the removal process itself is hard to control, wasteful of material, or introduces its own defects (as the atom's own caution about not removing 'too much' during centrifugal spinning suggests)?"
  - "is this pattern specific to physical material-application problems, or does it generalize cleanly to non-physical processes (writing, information retrieval, resource allocation) where 'overshoot' and 'remove' don't have the same literal physical meaning — what has to be true about a process for the reframing to even make sense?"
status: active
