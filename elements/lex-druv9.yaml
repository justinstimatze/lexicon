id: lex-druv9
name: aims-are-revisable-ends-in-view-not-rigid-external-ends
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When a goal is being treated as a fixed external target, surface Dewey's ends-in-view — aims are provisional, revisable as the means reveal new constraints; rigid ends produce worse outcomes than aims that learn."
related: [lex-89rjr, lex-da3g3, lex-6f5xs, lex-exrwy, lex-w5qfe, lex-5qv7q, lex-kuqt8]
scaffolds-from: [lex-6f5xs, lex-kuqt8]
evokes: [end-in-view, aims-arise-within-the-activity, hold-the-goal-flexibly, the-end-is-a-tentative-sketch, externally-imposed-ends-are-rigid, means-and-ends-interpenetrate, revise-the-goal-as-you-learn, an-end-that-cant-be-altered-can-only-be-insisted-upon, dont-subordinate-the-process-to-a-fixed-outside-end]
lineage:
  - source: primary
    text: dewey-1916-democracy-and-education-ch8-aims
    citation: "John Dewey, *Democracy and Education* (1916)., Chapter Eight 'Aims in Education', §§1-2 (lines 3605-3779). Dewey distinguishes a mere RESULT (the wind redistributes desert sand — an effect, but 'nothing in the outcome completes or fulfills what went before') from an END (the bees' activity — 'each prior event leads into its successor... until we arrive at the end, which summarizes and finishes off the process'). An AIM is a foreseen end that ARISES WITHIN an ongoing activity and gives it direction; it is not 'an end outside the process to which the activity is subordinate.' Aims function by directing observation of conditions/means, ordering the use of means, and enabling choice among foreseen alternatives — hence 'acting with an aim is all one with acting intelligently.' His criteria of good aims (§2): (1) the aim must grow out of EXISTING CONDITIONS, not be imposed from an outside source (externally-supplied ends 'limit intelligence,' leaving 'nothing but a mechanical choice of means'); (2) the aim must be FLEXIBLE — it 'first emerges as a mere tentative sketch,' and acting on it 'brings to light conditions which had been overlooked,' forcing revision. The signature failure of a rigid external end: 'What happens in the course of action neither confirms, refutes, nor alters it. Such an end can only be insisted upon.' The transferable primitive (Dewey's means-end continuum / 'end-in-view'): hold goals as provisional ends that emerge from and stay revisable within the activity; an end fixed rigidly from outside the process deadens adaptive intelligence. PD globally (Dewey d.1952; 1916 pub. pre-1929; Project Gutenberg)."
    quote: "[Dewey 1916 Ch.8 §1 lines 3619-3623]: 'we are not concerned, therefore, with finding an end outside of the educative process to which education is subordinate... we are rather concerned with the contrast which exists when aims belong within the process in which they operate and when they are set up from without.' [Ch.8 §2, lines 3774-3779]: 'An aim must, then, be flexible; it must be capable of alteration to meet circumstances. An end established externally to the process of action is always rigid... What happens in the course of action neither confirms, refutes, nor alters it. Such an end can only be insisted upon.' [Ch.8 §1, line 3712]: 'acting with an aim is all one with acting intelligently.'"
canonical-instances:
  - "Wind-on-sand vs bee-activity canonical contrast (Dewey Ch.8 §1, lines 3633-3658): the wind redistributing desert sand produces a RESULT but no end — 'one state of affairs is just as good as any other,' nothing completes what went before. The bees' sequence (gather pollen → build cells → lay eggs → brood → feed young) has genuine ENDS because each step completes its predecessor and the terminus 'summarizes and finishes off the process.' Marker: an aim presupposes an activity with intrinsic continuity, not a 'mere serial aggregate of acts.'"
  - "The aim-as-tentative-sketch canonical case (Dewey Ch.8 §2, lines 3765-3779): 'The aim as it first emerges is a mere tentative sketch. The act of striving to realize it tests its worth'; acting brings overlooked conditions to light and forces revision. The aim must be 'capable of alteration to meet circumstances.' This is the operational core: state the end clearly enough to direct action, then expect the doing to revise it."
  - "Externally-imposed rigid end canonical case (Dewey Ch.8 §§1-2, lines 3660-3666, 3750-3779): when 'each act of a pupil is dictated by the teacher,' or aims are 'set up from without' by external authority, intelligence is limited to 'a mechanical choice of means' — and the end is rigid because 'what happens in the course of action neither confirms, refutes, nor alters it. Such an end can only be insisted upon.' Marker: an end that no amount of doing can revise is a deadening external imposition, not a working aim."
  - "Agile / iterative-development transfer instance: treating a product spec as a revisable hypothesis refined by what shipping reveals (end-in-view) versus a rigid upfront waterfall spec fixed before any building (external rigid end). Dewey's test applies directly: can the work confirm/refute/alter the goal? If not, it is being merely insisted upon. The Goodhart-trap is the same shape — a target decoupled from the conditions it was meant to track. Dewey's deeper claim (the means-end continuum, fuller in his *Human Nature and Conduct*, 1922) is that means and ends interpenetrate: the quality of how you proceed shapes the end actually reached, so ends cannot be fixed independently of means."
  - "operationally distinct from (and in tension with) lex-89rjr goal-state-anchoring: lex-89rjr says pre-commit to the exact done-state before starting (fix success criteria, prevent drift); lex-druv9 says hold the end as a flexible end-in-view that emerges within the activity (a rigid external end deadens adaptation). They partition by regime — anchor when criteria are knowable and drift is the risk; hold flexibly when the task is exploratory and acting reveals conditions. Knowing which regime you are in is the skill."
  - "operationally distinct from lex-exrwy counterexamples-refine-the-claim: both have the target co-evolving with the doing, but lex-exrwy is about a CLAIM refined by counterexamples (epistemic), while lex-druv9 is about an AIM/GOAL refined by revealed conditions (practical/volitional). Structural rhyme, different object."
critical-questions:
  - "doesn't this contradict lex-89rjr goal-state-anchoring (commit to a precise done-state upfront)? No — productive tension, not contradiction. They partition by regime: anchor a fixed goal when the success criteria are genuinely knowable in advance and the dominant risk is scope-drift or second-guessing; hold a flexible end-in-view when the task is exploratory and acting reveals conditions a fixed external end could not anticipate. The error is applying either universally."
  - "isn't a 'flexible aim' just an excuse for drift or moving the goalposts? No. Dewey requires the aim to 'set a mark in advance' and to grow from existing conditions; revision must be driven by what action REVEALS (confirms/refutes/alters), not by caprice — he calls 'capricious or discontinuous action in the name of spontaneous self-expression' equally fatal to an aim. The guard against drift is that revision is evidence-driven, not mood-driven."
  - "what is the practitioner-actionable upshot? Hold goals as ends-in-view: state them clearly enough to direct observation, ordering of means, and choice among alternatives — then expect to revise them as the doing surfaces conditions. Distrust ends imposed from outside the process that 'can only be insisted upon' because nothing in the work can confirm, refute, or alter them (a Goodhart / dead-metric signature). Remember means and ends interpenetrate: how you proceed shapes the end you actually reach."
  - "how does it relate to iteration and counterexample-refinement? lex-druv9 + lex-da3g3 iteration: the revise-the-aim-as-you-act loop is iterative, converging as conditions are revealed. lex-druv9 + lex-exrwy: both are 'the target co-evolves with the doing' — an aim revised by revealed conditions parallels a conjecture revised by counterexamples. lex-druv9 + lex-6f5xs static-vs-dynamic-quality: the rigid imposed end is 'static'; the end-in-view is 'dynamic,' responsive to the live situation."
  - "does Dewey's view make all fixed goals bad? No. The point is not goallessness but the LOCUS and FLEXIBILITY of the end: an aim that arises within the activity and stays open to revision enables intelligent action, whereas one imposed rigidly from outside and immune to the activity's feedback deadens it. A fixed goal that genuinely grew from and remains answerable to conditions is fine; the indictment is of ends that are both external AND unrevisable."
status: active
