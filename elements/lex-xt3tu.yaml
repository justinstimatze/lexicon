id: lex-xt3tu
name: an-overloaded-generalists-visible-failure-founds-a-division-of-labor
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When only one or two people are available to fill every specialized role a new undertaking requires, the resulting strain isn't just a temporary hardship, it can become the origin story that justifies permanently splitting the work among specialists. In Cushing's telling, after two boys win a victory, only a Turtle and a grandmother are present to conduct the entire ceremony, and between them they have to become every office it requires: 'the old Turtle was master-priest of ceremonies and people, low priest, song-master, and dancers; sacrificer of arrows and striver after the arrows,' while the grandmother served as 'mother of the children and sisters, and their clan, and somebody's else clan, matron of ceremonials, and maidens of ceremonials--all at the same time.' The text names the outcome plainly: 'it was very hard work, consequently they didn't get along very well.' That visible, specific failure of two overloaded generalists is offered as the direct cause of the present arrangement: 'that's the reason why today we have so many song-masters and singers, dance leaders and dancers, priests and common people, father clans and mother clans, in the great Ceremony of Victory.' Diagnostic move: when you're asked to justify why a function has become divided among specialists rather than handled by one capable generalist, look for a founding case of overload, someone or some small group trying to cover every role and visibly struggling, that made the cost of concentration obvious enough to motivate permanently spreading the work out."
