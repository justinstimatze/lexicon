id: lex-hqa3k
name: a-disguised-culprit-stages-fake-combat-then-leads-victims-into-a-trap
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "The most dangerous moment for a victim seeking justice can be the arrival of someone who appears to have already delivered it -- especially when that person is the culprit in disguise, staging fabricated proof of a victory that never happened. In Radin's Winnebago Trickster cycle, after killing two mothers' children, Trickster returns to them disguised -- 'He had changed himself into another person and his face was blackened' -- and offers to hunt down the killer they're mourning: 'I wish I could get hold of him for you! ... In what direction did he go?' He enters the very hole he had used to commit the murder, stages a fight with no opponent, and manufactures physical evidence of a victory: 'he made quite a commotion as if he were striking something... Soon he came out all bloody. His nose was all covered with blood and bruised. He had, of course, bruised his own nose and then come out.' He then tells the grieving mothers the culprit is dead and safe to approach: 'He is dead so that you need not be in the least afraid of him.' Trusting the fabricated proof completely, 'the women went in,' at which point he seals both ends of the hole and sets it on fire. The staged victory did not just earn their trust; it was engineered specifically to move them into the one position where he could finish what he started. Diagnostic move: when someone presents fabricated proof that a threat has already been neutralized and then invites you into a space you would not otherwise enter, treat the very completeness and convenience of that proof as the reason for more suspicion, not less."
