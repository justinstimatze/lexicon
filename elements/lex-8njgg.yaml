id: lex-8njgg
name: people-rise-to-their-level-of-incompetence
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When promoting someone for past performance, surface the Peter principle — people rise to their level of incompetence; success at level N predicts capacity to perform at N, not at N+1; design promotions against next-level skill, not last-level performance."
related: [lex-smxtw, lex-tb3re, lex-v95t7, lex-9fqqs, lex-w68t8]
scaffolds-from: [lex-tb3re]
evokes: [peter-principle, laurence-peter-1969, peters-plateau, final-placement, promoted-until-you-fail, competence-in-one-role-does-not-transfer]
lineage:
  - source: practitioner
    text: wikipedia-peter-principle
    citation: "Wikipedia, 'Peter principle' (en.wikipedia.org). Primary: Laurence J. Peter & Raymond Hull, The Peter Principle (William Morrow 1969). The substrate-claim: in a hierarchy where promotion rewards success in the CURRENT role, a competent employee is promoted until they reach a role whose required skills they lack — where, being incompetent, they stop earning promotions and remain stuck (Peter's 'final placement' / 'plateau'). Given enough time and levels, every post tends to be filled by someone who has risen to their level of incompetence. The deep flaw: performance in role N is used as the promotion signal for role N+1, but the skills do not necessarily transfer, so the signal is a poor predictor. Peter & Hull intended satire; it was received as a serious observation and has since drawn empirical study (e.g. Benson, Li & Shue 2019 on promoting good salespeople into bad managers). Peter-Hull 1969 in-copyright."
    quote: "[Peter & Hull 1969, via ZIM:] 'In a hierarchy, every employee tends to rise to his level of incompetence.' Corollary: 'In time, every post tends to be occupied by an employee who is incompetent to carry out its duties.' The mechanism: a person competent at their job is promoted to one requiring different skills; if they lack them they are not promoted again and remain at this 'final placement', so competence is selected upward until it runs out."
  - source: primary
    text: peter-hull-1969-the-peter-principle
    citation: "Laurence J. Peter & Raymond Hull, The Peter Principle: Why Things Always Go Wrong (William Morrow, 1969; cited from the Buccaneer Books 1996 reprint). Chapter 1 'The Peter Principle' builds through Peter's case-file method (Case No. 1, the pill-rolling factory promoting Mr. Sphere; the case of Colonel/General A. Goodwin, the field marshal who could not adapt from soldiering to politics) to the named statement of the Principle and its Corollary on who actually keeps a hierarchy running."
    quote: "So my analysis of hundreds of cases of occupational incompetence led me on to formulate The Peter Principle: In a Hierarchy Every Employee Tends to Rise to His Level of Incompetence. [Ch.1 — the named statement, set off as its own line in the original.] [...] For each individual, for you, for me, the final promotion is from a level of competence to a level of incompetence. So, given enough time — and assuming the existence of enough ranks in the hierarchy — each employee rises to, and remains at, his level of incompetence.' [This passage's two-column original interleaves line-by-line in extraction; the wording above is the de-interleaved reading, unambiguous here and matching the book's known text, but reconstructed rather than read cleanly, so treat it as unconfirmed against a clean copy.] ' [Ch.1, Peter's Corollary — the mechanism stated in full: it isn't instantaneous, it's an asymptotic drift given enough time and enough rungs.] In time, every post tends to be occupied by an employee who is incompetent to carry out its duties. [Ch.1 — the Corollary's compressed form, the one most often quoted.] Work is accomplished by those employees who have not yet reached their level of incompetence. [Ch.1, closing the chapter — the completion of the model: it explains not just why hierarchies fill up with the stuck, but why they still function at all — the actual output comes from whoever hasn't yet been promoted past their ability.]"
canonical-instances:
  - "the great engineer promoted to a bad manager: individual-contributor excellence is rewarded with a management role requiring entirely different skills (coordination, delegation, people-development). The skills don't transfer; the org loses a great engineer and gains a poor manager who then stays put. Benson-Li-Shue 2019 documented exactly this for sales-to-management promotions"
  - "the dual-ladder fix: organisations that recognise the principle build separate IC and management tracks so technical excellence can be rewarded with advancement that does NOT require switching to a skill-set the person lacks — directly countering the single-ladder mechanism that produces the plateau"
  - "'Peter's plateau' / final placement: the incompetent-in-new-role employee stops being promoted and stays, so over time, given enough levels, posts fill with people at their incompetence ceiling. The org's real competence is concentrated in those not yet promoted past their ability"
  - "operationally a hierarchy-promotion instance of lex-tb3re Goodhart's law: current-role performance is used as the proxy/target for next-role fitness, but promoting on that proxy selects people into roles the proxy never measured — the measure (past performance) ceases to predict the thing it was used to predict (future-role competence). The Peter principle is what Goodhart looks like in a promotion ladder"
  - "operationally adjacent to lex-smxtw competence-substitution-inverts-the-seniority-premium: lex-smxtw is about the labour-market seniority premium inverting when juniors plus automation substitute for senior skill; lex-8njgg is about the internal promotion mechanism stranding people one level above their competence. Both concern the mismatch between rank/seniority and actual competence, from different causes (market substitution vs promotion-signal failure)"
critical-questions:
  - "is promotion here rewarding performance in the CURRENT role or evidence of fitness for the NEXT one? The principle's engine is using the former as a proxy for the latter. If the skills don't transfer, you are promoting people toward failure — assess for the target role's skills, not the current role's output"
  - "do you have a path to advance excellent people WITHOUT forcing a role-skill switch? A single ladder guarantees the plateau; a dual ladder (or lateral scope-growth within a role) lets you reward competence without promoting it into incompetence"
  - "is a struggling manager a bad person or a Peter-principle artifact — someone competent one level down, mis-promoted? The remedy may be a de-stigmatised move back to the role they excelled at, not coaching them indefinitely in a role whose skills they lack"
  - "given enough levels and time, which of your posts are likely filled at their incompetence ceiling? The principle predicts the steady state; auditing where competence actually sits (often one level below the plateau) tells you where the real work is getting done"
status: active
