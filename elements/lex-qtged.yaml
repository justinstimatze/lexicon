lineage:
  - source: primary
    text: radin-a-peyote-homily-uses-wakdjunkagas-old-failures-to-mirror-the-audience
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Attitude of the Winnebago Toward Wakdjunkaga.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "They told us how, on one occasion, he wrapped a racoon-skin blanket around himself and went to a place where there were many people dancing. There he danced until evening and then he stopped and turned around. There was no one to be seen anywhere, and then he realized that he had mistaken for people dancing the noise made by the wind blowing through the reeds. 'So do we Winnebago act. We dance and make a lot of noise but in the end we accomplish nothing. ... So are we Winnebago. We like all that is forbidden. We say that we like the Medicine Rite; we say that it is good and yet we keep it secret and forbid people to witness it. We tell members of the society not to speak about it until the world comes to an end. They are, in consequence, afraid to speak of it. We, the Winnebago, are the birds and Wakdjunkaga is Satan."
canonical-instances:
  - "A coach retells the story of a past team that lost a championship by celebrating too early in the fourth quarter, then simply says 'sound familiar?' to the current team after they let their lead slip in a recent game, letting the players draw the connection themselves rather than naming their own recent mistake directly."
  - "A pastor repeatedly returns to the biblical story of the Israelites complaining in the desert despite being provided for, using it as a recurring refrain during a period when the congregation has been vocally dissatisfied with a building project, letting each retelling stand in for a direct criticism no one has to hear aimed at them personally."
critical-questions:
  - "Does this technique actually change behavior, or does its indirectness let the audience recognize the parallel intellectually while still avoiding the discomfort that might be necessary to actually motivate change?"
  - "Is there a risk that some listeners simply won't make the connection between the old story and their own current behavior, especially if the parallel isn't as obvious to them as it is to the speaker who chose the story?"
  - "Would this technique lose its effectiveness if used too often, since a refrain like 'so do we' that becomes predictable might stop landing as a genuine moment of recognition and start reading as a rhetorical formula the audience has learned to expect and discount?"
status: active
