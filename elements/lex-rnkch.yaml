id: lex-rnkch
name: display-rules-manage-whether-felt-emotion-reaches-facial-expression
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a face doesn't show the emotion someone is presumably feeling, or shows a different one, don't assume they aren't feeling it — check whether a display rule intervened. Ekman & Friesen's concept: most facial affect displays, in public and even intimate settings, are actively managed by learned display rules that determine whether the felt emotion is INTENSIFIED, DE-INTENSIFIED, NEUTRALIZED, or MASKED with a covering affect (e.g. smiling over anger). Which display rule applies is set by culture, and within a culture by social situation, role, age, sex, and status — and can even be idiosyncratic to a particular family. The concept of display rules is DISTINCT FROM, and less contested than, Ekman's separate and more disputed claim that observers can universally recognize a fixed set of discrete emotions from a photograph — display rules is a claim about learned CULTURAL VARIATION in expression management, not about universal recognition, and the two shouldn't be conflated. (Note: Ekman's broader universal-emotion-recognition program has drawn real methodological criticism — hand-selected stimulus photos, limited controls in some early studies, and researchers who found less cross-cultural agreement than Ekman reported. The display-rules concept itself is not what that criticism targets, but treat any specific Ekman claim on its own evidentiary merits rather than assuming the whole research program is equally well-supported.)"
