id: lex-vk2t6
name: a-hyperbolic-unreachable-comparison-amplifies-praise-of-expertise
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'Praise of an expert''s ability can be rendered as literally unattainable by comparison — anyone who approaches the standard either fails to reach it or is destroyed in the attempt — functioning as rhetorical amplification of admiration rather than as a literal, falsifiable claim. In the Jataka''s tale of Supparaka, the Buddha''s wisdom is praised through an oceanic image where the comparison itself is built to be impossible to complete: "As a billow that rises upon the great sea cannot reach the shore, or if it reaches the shore it breaks; so no man can reach the Dasabala in wisdom, or if he comes to the Master''s feet he is broken."'
related: []
evokes: [jataka, ekadasanipata, supparaka-jataka, hyperbolic-praise, unreachable-standard-metaphor]
lineage:
  - source: primary
    text: jataka-chalmers1895-supparaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 463, Supparaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "As a billow that rises upon the great sea cannot reach the shore, or if it reaches the shore it breaks; so no man can reach the Dasabala in wisdom, or if he comes to the Master's feet he is broken."
canonical-instances:
  - "A biographer describes a chess grandmaster's endgame technique as something no challenger has ever truly matched — anyone who gets close either falls short or is crushed in the attempt — knowing the claim functions as tribute rather than a literal scouting report."
critical-questions:
  - "Does framing an ability as literally unreachable serve the praise, or does it undercut it by making the expert's skill sound less like mastery and more like an exception to ordinary comparison altogether?"
status: active
