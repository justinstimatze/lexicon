lineage:
  - source: primary
    text: eastman-magic-arrows-old-man-won-over-by-delivered-value
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twenty-Sixth Evening: The Magic Arrows.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'You hear, my old man?' said she. 'It will be very well for you to make some little arrows for the boy.' 'And why should I make arrows for a strange little ragged boy?' grumbled the old man. However, he made two or three, and the boy went hunting. In a short time he returned with several small birds... 'You have done well, my grandson!' he said; for they were really very poor."
canonical-instances:
  - "A new hire nobody wanted to bring onto a resource-constrained team wins over a skeptical manager not by explaining their credentials but by asking for one small task, over-delivering on it, and letting a string of small over-deliveries build the trust that no interview pitch could."
  - "An unfamiliar vendor pitching to a cost-conscious, wary small-business owner gets a foot in the door only by offering a tiny trial order at minimal risk, then delivering results that exceed what was promised, converting skepticism into a standing relationship purely through the first trade's returns."
critical-questions:
  - "does this pattern only work because the old man had almost nothing to lose on such a small first ask -- does it scale to situations where even the smallest ask still carries real risk for the skeptic?"
  - "is there a point where 'deliver value repeatedly and let it speak for itself' becomes a trap, keeping someone in an under-recognized, unrewarded role indefinitely because they never assert their actual worth or identity?"
  - "how many repetitions of delivered value does it actually take before it's reliable evidence of ability rather than a lucky first outcome -- the old man is won over after a single catch of birds, which could just as easily have been chance?"
