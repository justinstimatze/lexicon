id: lex-thptv
name: a-single-trait-theory-of-two-groups-breaks-on-a-reversed-domain
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a theory explains two groups' disagreement by placing them on opposite ends of one personality trait, test it by checking whether the same groups reverse on a different domain. Lakoff's target: the common claim that conservatives see people as basically rotten and needing discipline, and that this predicts liberals should be the more trusting side across the board. It fails immediately on a domain the theory should have covered: liberals are the ones who won't count on a profit-seeking business to skip pollution, keep working conditions safe, or avoid discriminating unfairly on its own. Conservatives are comparatively the trusting side on exactly those questions. The single-trait theory has the polarity backwards the moment you change which behavior is being trusted. Trust in human nature turns out to be domain-specific rather than a fixed level attached to a political label -- each side extends it to some actors and situations and withholds it from others, and no single dial captures the pattern. Diagnostic move: before accepting a theory that assigns one group 'trusting' and the other 'suspicious' as a general disposition, find a domain outside the theory's own home turf and check whether the assignment survives the switch."
related: []
evokes: [george-lakoff, moral-politics-1996, human-nature-hypothesis, trust-reversal, conservative-liberal-theories]
lineage:
  - source: primary
    text: lakoff-1996-human-nature-hypothesis-reversed
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 7 'Why We Need a New Understanding of American Politics,' section 'The Conservative Failure to Understand Conservatism.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Another common claim has to do with the liberal and conservative views of human nature: conservatives think that people are basically rotten and have to be subject to authority and disciplined, while liberals think that people are basically good and can decide what to do for themselves. That theory just doesn’t jibe at all with contemporary liberal and conservative politics. Liberals don’t think that people out to maximize their profit can be counted on to do the right thing—not to pollute, not to create unsafe working conditions, not to make unsafe products, not to discriminate unfairly. It’s the liberals who are suspicious of human nature on many issues and the conservatives who are trusting.”"
canonical-instances:
  - "The direct textual anchor is the lineage quote itself: the same trait (trust vs. suspicion toward unsupervised human behavior) assigned to conservatives and liberals in the standard theory reverses completely once the domain shifts from personal morality to profit-driven corporate behavior."
  - "Hypothetical: a management consultant claims that Team A is 'risk-averse' and Team B is 'risk-tolerant,' based on how each team handles new feature launches. Reviewing the teams' actual security incident reports, the consultant finds Team A ships new features with almost no review while Team B subjects every deploy to exhaustive staged rollouts -- the exact reverse of the risk label, once 'risk' is measured on a different axis than the one the label was coined from."
critical-questions:
  - "Lakoff uses one reversed domain (corporate self-regulation) to overturn a general claim about two groups' views of human nature. Is one clean counterexample enough to retire a trait-based theory entirely, or does it only show the trait is domain-specific rather than nonexistent -- in which case conservatives and liberals could still differ in a general trusting/suspicious disposition that simply gets overridden by domain-specific reversals in particular cases?"
  - "If trust in human nature is issue-specific rather than a fixed disposition, what actually determines which domains get the trusting treatment and which get the suspicious one, for a given political position? Lakoff doesn't supply that account here -- without it, the reversal shows the simple theory is wrong but doesn't yet supply the theory that would replace it."
