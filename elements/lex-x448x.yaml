lineage:
  - source: primary
    text: hyde-zeus-sees-through-prometheuss-shell-game-by-reading-deeper-stakes
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Meat Sacrifice,' discussing Hesiod's account of Prometheus and Zeus dividing the sacrificial ox. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Zeus was not deceived, however; he could see beneath the surfaces of the Promethean shell game. And yet he didn’t choose the “better” portion, he chose the bones. ... it helps to know that for the Greeks the bones stand for immortality. They are the undying essence, what does not decay ... Conversely, in all ancient Greek literature the belly stands for needy, shameless, inexorable, overriding appetite. ... The symbolism suggests, then, that those who eat the belly-wrapped meat must take the same thing as their portion in the world. ... Prometheus tries to be a cunning encoder of images, but Zeus is a more cunning reader, and the meat trick backfires."
canonical-instances:
  - "A negotiator structures a contract offer so the more favorable-looking clause actually contains a long-term liability trap, but the counterparty's lawyer, unfazed by which clause looks more generous, reads the underlying obligations directly and picks the clause that structurally favors them regardless of its surface framing."
  - "A salesperson designs a product comparison chart to make the pricier tier look obviously superior on the metrics buyers usually skim, but a technically sophisticated buyer ignores the chart's framing entirely and picks the cheaper tier because they understand what each tier's underlying architecture actually commits them to."
critical-questions:
  - "Does Zeus's choice actually require him to understand the deeper symbolic meaning of bones versus belly, or could the myth equally be read as Zeus punishing Prometheus for the attempted deception itself, regardless of what the portions symbolized?"
  - "Is there a meaningful difference between a chooser who reads the deeper stakes correctly by genuine insight versus one who simply gets lucky picking the option that happens to carry less hidden cost, and how would an outside observer tell the two apart after the fact?"
  - "Would Prometheus's trick have worked against a chooser who was equally skilled at reading surfaces but lacked Zeus's specific symbolic knowledge of what bones and bellies represent, suggesting the failure was about a specific knowledge gap rather than a general principle about deception and deeper stakes?"
