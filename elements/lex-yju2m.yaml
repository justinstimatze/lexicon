    quote: "“The insistence on 'optimality' (involving the identification of an 'ideal' -- or 'best' -- alternative) has to be distinguished from 'maximality', defined as a conclusion that is no less satisfactory than any other conclusion. To illustrate the contrast, when there are two alternatives x and y, neither of which is judged to be better than (or exactly as good as) the other, then in that pair of alternatives (x, y), both are maximal, but neither is optimal. We can reasonably choose either x or y, rather than go on dithering. ... Buridan's famous ass... came to a sad end by seeking optimality when it could not figure out which of the two haystacks facing it was the better one to go for. As the tragic story runs, the ass died of starvation from dithering. ... Given the stubborn incompleteness of the ordering of the two haystacks, both of them are maximal, and the choice of either -- despite their lack of optimality -- would have been a much better option than starvation.”"
canonical-instances:
  - "Hypothetical: A hiring committee has two finalists, each strong in ways the other isn't, and spends three more weeks debating which is objectively superior before making an offer. Both candidates would do the job well; neither is worse than the other or than any remaining option. The committee has a maximal choice available in week one and spends three extra weeks chasing an optimal ranking that the evidence may never produce."
  - "Hypothetical: A couple looking to buy a home tour two houses that trade off differently on the things they care about -- one has a better yard, the other a shorter commute -- and neither can be shown to beat the other overall. They keep touring more houses looking for the one that's clearly best, while the market moves and both original options get sold to someone else who was willing to pick a maximal choice instead of waiting for an optimal one."
critical-questions:
  - "Doesn't accepting 'either is fine' risk covering for laziness -- shouldn't more effort sometimes turn an apparently unrankable pair into a rankable one? Sen is explicit that this isn't license to stop reasoning early: the diagnostic applies after reasoning has gone as far as it productively can, not as an excuse to skip the work. The claim is that even fully reasoned analysis can legitimately end in an unranked pair, not that unranked pairs should be assumed without trying."
  - "How can you tell the difference between a pair that's genuinely unrankable and one that just hasn't been thought through carefully enough yet? There's no shortcut test, but the diagnostic gives a concrete question to ask: has a specific missing piece of information or argument been identified that would break the tie if found? If yes, the incompleteness is tentative and worth pursuing further. If no such piece can be named despite real effort, treating the pair as maximal rather than continuing to search is the reasoned choice."
