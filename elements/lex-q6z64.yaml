id: lex-q6z64
name: distance-and-diffuse-responsibility-do-not-modulate-the-moral-demand
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone defends inaction by appealing to proximity ('they're far away, that's not my problem') or to diffuse responsibility ('there are millions of others who could help, why me'), surface that both are psychological pulls without moral force. If preventing the bad outcome would cost the actor something far smaller than the prevented harm, the case for action survives the distance and the dilution. The argument does not assume utilitarianism — Singer's principle is qualified ('without sacrificing anything of comparable moral importance') and accepts any framework with impartiality, universalizability, or equality. Notice the actual move: psychological salience (we feel obligated to the near, less obligated to the far) is being mistaken for a moral distinction. The fix is to name the conflation, not to attack the feeling."
related: [lex-wtkuz, lex-9wbd3, lex-gzgn3, lex-vx867, lex-4ydm6, lex-5qkj9, lex-6c5un, lex-junvn, lex-y5jm9, lex-v6dz2]
scaffolds-from: [lex-vx867, lex-v6dz2]
evokes: [drowning-child-argument, distance-is-psychologically-salient-but-morally-irrelevant, diffuse-responsibility-pool-does-not-shrink-the-individual-demand, the-bengali-child-ten-thousand-miles-away, comparable-moral-importance-as-the-threshold-not-the-floor, prevent-not-promote-the-weaker-form-still-bites]
lineage:
  - source: primary
    text: singer-1972-famine-affluence-and-morality
    citation: "Peter Singer, 'Famine, Affluence, and Morality,' Philosophy & Public Affairs 1(3):229-243 (Spring 1972). The originating statement of the transferable claim that proximity and diffuse-responsibility do not modulate the strength of a moral demand to prevent suffering. Singer presents the principle in two strengths: the strong form ('if it is in our power to prevent something bad from happening, without thereby sacrificing anything of comparable moral importance, we ought, morally, to do it') and a qualified weak form ('if it is in our power to prevent something very bad from happening, without thereby sacrificing anything morally significant, we ought, morally, to do it'). Even the weak form, Singer argues, would 'fundamentally change' lives, society, and world if acted upon. The two corollaries — distance-irrelevance ('It makes no moral difference whether the person I can help is a neighbor's child ten yards from me or a Bengali whose name I shall never know, ten thousand miles away') and diffuse-responsibility-irrelevance ('the principle makes no distinction between cases in which I am the only person who could possibly do anything and cases in which I am just one among millions in the same position') — are the transferable carry. Singer's central methodological move: the principle does not assume utilitarianism. Any moral framework that accepts impartiality, universalizability, or equality also has to swallow the corollaries — making the argument unusually transferable across rival ethical positions. The drowning-child thought experiment (you wade in, muddy your clothes, save the child; the moral case is undisputed near; the same case at distance is the conclusion) is one of the most-cited illustrations in 20th-century applied ethics, foundational to the effective-altruism tradition. Verified verbatim 2026-06-20 against the JSTOR-distributed published essay text."
    quote: "[Singer 1972 p.231 — the principle:] 'My next point is this: if it is in our power to prevent something bad from happening, without thereby sacrificing anything of comparable moral importance, we ought, morally, to do it.' [Singer 1972 p.231 — the drowning-child illustration:] 'if I am walking past a shallow pond and see a child drowning in it, I ought to wade in and pull the child out. This will mean getting my clothes muddy, but this is insignificant, while the death of the child would presumably be a very bad thing.' [Singer 1972 p.231-232 — the distance corollary:] 'The uncontroversial appearance of the principle just stated is deceptive. If it were acted upon, even in its qualified form, our lives, our society, and our world would be fundamentally changed. For the principle takes, firstly, no account of proximity or distance. It makes no moral difference whether the person I can help is a neighbor's child ten yards from me or a Bengali whose name I shall never know, ten thousand miles away.' [Singer 1972 p.232 — the diffuse-responsibility corollary:] 'Secondly, the principle makes no distinction between cases in which I am the only person who could possibly do anything and cases in which I am just one among millions in the same position.' [Singer 1972 p.232 — the conditions of impartiality:] 'If we accept any principle of impartiality, universalizability, equality, or whatever, we cannot discriminate against someone merely because he is far away from us (or we are far away from him).'"
canonical-instances:
  - "the drowning child in the shallow pond (Singer 1972 p.231): the canonical scenario where the moral case for action is undisputed because the cost (muddy clothes) is trivially smaller than the prevented harm (a child's death). The transferable function is to anchor moral intuition where it is sharp and then ask the reader to identify what changes when the same structural facts (low cost, large benefit, no other obligations sacrificed) hold at distance. The argument is constructed so the only candidate-difference is proximity or diffuse responsibility — and Singer's move is to argue both fail to carry moral weight"
  - "the global-village update (Singer 1972 p.232): Singer notes that the practical-superiority of helping the near (because you can act effectively on it) once justified prioritizing local poverty over distant famine, but 'instant communication and swift transportation' have closed that gap. Effective famine-relief organizations can direct your aid to a Bengali refugee almost as effectively as to someone on your block. The argument moves with technology — the proximity-as-effectiveness justification eroded as logistics globalized. The transferable lesson: arguments that LOOK like moral arguments are sometimes empirical claims about effectiveness. When the empirical premise changes, the conclusion shifts"
  - "GiveWell / effective-altruism cost-effectiveness ranking (2007-): the operational descendant of Singer's argument is the empirical ranking of interventions by cost-per-life-saved or cost-per-DALY-averted. Effective altruism takes Singer's qualitative claim ('distance is morally irrelevant') and makes it quantitative ('and here is which intervention prevents the most suffering per dollar'). The transferable lesson: once distance is removed as a moral filter, the question 'where should marginal resources go' becomes an empirical optimization, not a moral one. Substantive disagreements within EA (longtermism vs neartermism, animal vs human welfare) are about WHICH suffering to prevent, all post-Singer accepting that distance does not bound the search"
  - "kidney-donation (live, to a stranger): Zell Kravinsky donated a kidney to a stranger in 2003 explicitly citing Singer-style reasoning — the probability of donor mortality (~1/4000) is many orders of magnitude smaller than the probability of saving a stranger's life. The argument is the same as the drowning child but the cost is bodily rather than sartorial. The transferable lesson: Singer's principle can be self-applied at higher-cost levels and the moral logic does not collapse, but the action becomes psychologically difficult in proportion to the personal cost — which itself is evidence that psychological resistance is doing the work, not moral reasoning"
  - "critical edge case (acknowledged by Singer, p.232): the proximity-as-effectiveness justification IS a moral consideration if effectiveness varies — better to help someone you can actually help than someone you cannot. Singer's argument depends on the empirical premise that distance no longer hampers effectiveness. In cases where distance DOES still hamper effectiveness (acute crisis with no logistics chain; specialized care only available locally), distance can be a legitimate moral consideration via the effectiveness channel — but not as a primary moral fact. The transferable lesson: distinguish between distance-as-effectiveness-proxy (legitimate; empirical) and distance-as-direct-moral-discount (the move Singer rejects)"
  - "pivotal edge case (acknowledged by Singer, pp.232-233): the diffuse-responsibility-irrelevance corollary is the harder swallow. Singer concedes that one feels less guilty about inaction when many others could also act — but argues this is psychology, not morality. The counterargument from the literature: if everyone reasons 'others won't help so I must,' and everyone is wrong about the others, then collective demand becomes individually-unbearable in a way that may itself be morally problematic. The transferable lesson: the diffuse-responsibility-irrelevance argument requires a coordination assumption (people will not be unilaterally exploited by their conscientiousness) that Singer 1972 does not fully address"
  - "key methodological move: substitute psychological-salience for moral-relevance as the explanatory category for our default behavior. The 'feeling less obligated to the distant or to the diffuse case' is empirical fact; Singer's move is to argue this feeling is the EXPLANATION of our behavior, not a JUSTIFICATION of it. This is structurally the same move as lex-wtkuz descriptive-vs-operational-metacognition (replace the philosophical-default primitive with an empirical mechanism that does the work) and lex-k6wka focal-points (replace logical-optimality with prominence in equilibrium-selection). When a moral intuition turns out to track psychology rather than principle, the principled defense of the intuition collapses"
  - "operationally distinct from lex-9wbd3 greatest-happiness-principle (Mill): lex-9wbd3 is the foundational utilitarian claim that aggregate welfare is the criterion of right action. Singer's argument USES utilitarianism-compatible reasoning but DOES NOT require it — the principle 'prevent bad at low cost' is consistent with Kantian, virtue-ethics, contractualist, and natural-law frameworks insofar as they accept impartiality. lex-q6z64 is the cross-framework portable claim; lex-9wbd3 is one specific framework that grounds it. They co-fire (a utilitarian commits to both) but the bottom-line policy implication is the same across frameworks"
  - "operationally distinct from lex-vx867 moral-patienthood-and-agency-as-orthogonal-poles: lex-vx867 names the STATUS axes (who counts as a patient, who counts as an agent). lex-q6z64 names the SCALAR claim (once they count as a patient, distance does not modulate the demand). They compose: lex-vx867 settles whether the distant person counts at all; lex-q6z64 then says that yes-they-count cannot be partially-discounted by distance. lex-q6z64 presupposes a positive answer to lex-vx867"
  - "operationally distinct from lex-4ydm6 in-group-out-group-ethical-dualism-is-universal: lex-4ydm6 is the descriptive empirical claim that humans default to differential moral treatment of in-group vs out-group across all cultures. lex-q6z64 is the normative claim that this default is psychology, not morality. They compose: lex-4ydm6 explains why Singer's argument is psychologically resisted (we are wired to give preferential moral treatment to the near and the kin); lex-q6z64 names the move to resist the wiring on principled grounds. The pair captures both halves of the universal-default-vs-principled-correction dynamic"
critical-questions:
  - "is the proximity factor in this situation a direct moral discount (which Singer rejects) or an effectiveness proxy (which is a legitimate empirical consideration)? Distinguishing the two changes whether the argument applies"
  - "what is the actual cost to the actor — is it within the 'comparable moral importance' threshold Singer specifies, or have you stretched 'sacrifice' to include things that are not morally weighty?"
  - "is the diffuse-responsibility argument doing work because of psychological salience (Singer's diagnosis) or because of a real coordination concern that unilateral conscientiousness would be exploited?"
  - "does your moral framework accept impartiality, universalizability, or equality? If yes, you owe the corollaries — the argument's portability comes from that minimal commitment"
