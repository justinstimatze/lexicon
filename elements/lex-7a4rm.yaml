id: lex-7a4rm
name: judging-truth-by-later-realization-is-circular-and-cannot-judge-the-present
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When someone proposes to sort past ideas into 'true, ahead of its time' versus 'false, distorted' by checking whether they were LATER realized in events, name two separate defects rather than one. Mannheim's attempt to escape relativism did exactly this: 'if we look into the past, it seems possible to find a fairly adequate criterion of what [idea] is to be regarded as ideological and what is utopian. This criterion is their realization. Ideas which later turned out to have been only distorted representations of a past or potential social order were ideological, while those which were adequately realized in the succeeding social order were relative utopias... The extent to which ideas are realized constitutes a supplementary and retroactive standard.' Merton's demolition names the first defect as circularity: 'this retroactive criterion presupposes the very criteria of validity which Mannheim wishes to supplant, for how else is the observer to demonstrate that his reading of the historical process is correct?' -- deciding what actually got 'realized' already requires the independent judgment the criterion was supposed to provide. The second, distinct defect is that the criterion is structurally useless for anything happening now: it can only be applied by looking backward, so a contemporary idea's validity cannot be assessed by this method at all until enough time has passed to see what became of it -- and Merton notes elsewhere that inadequate ideas can equally be 'in advance of' their situation, so being unrealized-so-far proves nothing either way. Diagnostic move: whenever a validity test is phrased as 'we'll know if it was right by what happens later' or 'history will vindicate/condemn it,' check first whether declaring the later outcome itself requires the very judgment being deferred, and second, whether the test is even in principle available for anything you'd want to evaluate today."
related: []
evokes: [merton-1957, mannheim-ideology-utopia, ex-post-facto-criterion, schelting-critique, retroactive-standard-of-realization, wait-and-see-vindication]
lineage:
  - source: primary
    text: merton-1957-retroactive-realization-criterion
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIII 'Karl Mannheim and the Sociology of Knowledge,' p.503. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'It not only involves an ex post facto criterion of validity but also precludes the possibility of valid judgments on contemporary ideas, as may be seen from the following passage. \"...if we look into the past, it seems possible to find a fairly adequate criterion of what [idea] is to be regarded as ideological and what is utopian. This criterion is their realization. Ideas which later turned out to have been only distorted representations of a past or potential social order were ideological, while those which were adequately realized in the succeeding social order were relative utopias. . . . The extent to which ideas are realized constitutes a supplementary and retroactive standard for making distinctions between facts which as long as they are contemporary are buried under the partisan conflict of opinion.\"'"
  - source: primary
    text: merton-1957-schelting-circularity
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.503."
    quote: "'As Schelting has shown, this retroactive criterion presupposes the very criteria of validity which Mannheim wishes to supplant, for how else is the observer to demonstrate that his reading of the historical process is correct?'"
canonical-instances:
  - "A startup's board says 'we'll know if the pivot was the right call by whether the company is thriving in five years' -- but judging 'thriving' already requires the same business judgment the vote was meant to settle, and the test says nothing useful about whether to approve the pivot today."
  - "A political movement claims its program will be vindicated 'as history judges it' -- which cannot distinguish it, at the moment of judgment, from any rival program making the identical claim, since both are equally unfalsifiable until an arbiter has already decided which later events count as vindication."
critical-questions:
  - "Is there any version of a later-realization test that escapes circularity -- for instance, a pre-registered, narrowly specified prediction ('X will happen by date Y') rather than an open-ended 'was it realized in the succeeding order' -- or does the circularity return as soon as the criterion has to characterize what actually happened?"
  - "Does the uselessness-for-the-present defect matter practically, given that most consequential judgments (was a policy wise, was a theory sound) are made under time pressure anyway -- or is the point precisely that invoking 'let history decide' is often a way to avoid making the judgment now rather than a genuine methodological position?"
status: active
