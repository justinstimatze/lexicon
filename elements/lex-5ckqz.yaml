    citation: "Two substrate hits for 'Frye' are false positives: lex-zfgj2 cites 'Daubert, Frye' as the legal-evidentiary Frye standard for scientific-testimony admissibility, nested inside a Ginzburg-conjectural-inference atom; lex-55dm8 has no Frye reference at all — its match is the unrelated string 'marilyn-frye' in its evokes list, referring to the feminist philosopher Marilyn Frye rather than Northrop Frye. Neither grounds Northrop Frye's narrative-mode taxonomy. Lex-0660 (peripeteia-pursuit-mechanism-produces-the-aims-opposite) and lex-qfwuf (anagnorisis-recognition-reframes-the-meaning-of-prior-action) are both grounded in Aristotle's Poetics and name structural devices that occur within a single plot at a specific scene — a reversal-moment, a recognition-moment — distinct from Frye's claim, which classifies the overall shape of an entire plot or genre into one of four cyclically-related mythoi. Frye himself draws a compositional link (anagnorisis as comedy's archetypal theme, per the four-mythoi/four-archetypal-themes mapping), and both are included as related, reciprocated neighbors rather than duplicates. Lex-0110 (depart-trial-return-arc) grounds Campbell's monomyth — one universal depart-trial-return quest pattern, via Homer and Propp — a genuinely distinct axis, since Campbell's claim concerns one cross-cultural sequence-shape while Frye's claim concerns four distinct, cyclically-related plot-shapes, of which the Campbellian quest maps onto only the romance/summer mythos; a depart-trial-return arc could resolve as romance, tragedy, or irony depending on its ending, so the monomyth and Frye's romance-mythos are adjacent but non-identical. Included as related and reciprocated. No other substrate atom addresses a taxonomy of overall plot-shapes (checked against lex-e8wv6, lex-2kwkh, lex-nzj6u, lex-etdx7, lex-ctnnx, lex-et8q2, lex-z9kmt, lex-y2nej, lex-uqmd7, lex-xehnw, lex-7q3ph, lex-zd7vh, lex-hhx7u, lex-p26va, lex-z26m9, lex-tqdhs, lex-tmy67, lex-bkaum, lex-wutu8, lex-h8t7s, lex-kykwm, lex-2vpet, lex-r7zuy). This atom grounds the four-mythoi taxonomy as its headline claim, together with its explicit cyclical/seasonal structure as a necessary co-claim rather than a separable detail — Frye frames the wheel-structure as key to the classification itself, not as decoration. The related array reflects lex-h7vet (Campbell's monomyth — one universal quest-sequence versus Frye's four cyclically-related shapes, romance being the nearest neighbor) and lex-nr3kg/lex-qfwuf (Aristotle's peripeteia/anagnorisis — structural devices within a scene versus the overall shape of a whole plot or genre)."
canonical-instances:
  - "Comedy (Frye's own paradigm): the Greek New Comedy formula transmitted by Menander, Plautus, and Terence — a young man's desire for a young woman is blocked by paternal or father-surrogate opposition, a twist in the plot (cognitio/anagnorisis) resolves it, and a new, more inclusive society crystallizes around the couple, typically sealed by marriage or festival (Frye's own example of the form's persistence: 'the quadruple wedding at the end of As You Like It')."
  - "Romance (Frye's own paradigm): the St. George and Perseus dragon-slaying quest-myth family, and Spenser's Faerie Queene Book I as Frye's closest English instance of the Biblical quest-romance — the Redcross Knight's three-day battle with the dragon, strengthened each day by the water of life and the tree of life, ending in the rescue of Una's parents' kingdom (Eden restored in the wilderness)."
  - "Tragedy (Frye's own paradigm): Sophocles' Oedipus Tyrannus and Milton's Adam in Paradise Lost — both 'on top of the wheel of fortune, with the destiny of the gods almost within [reach],' both falling into isolation and the manifestation of natural law through an act that is at once free and self-entrapping."
  - "Irony and Satire (Frye's own paradigm): Swift's A Modest Proposal and Gulliver's Travels — satire whose 'brain-softening plausibility' wears down the reader's comfort by applying a rational, reasonable-sounding voice to a monstrous proposal, and whose object of attack (Irish poverty, human vanity) is measured against a clear if implicit moral norm."
  - "Cross-domain application beyond Frye's own literary examples: a corporate turnaround narrative told in comedy's shape — an aging, blocking leadership regime displaced by a younger executive team, culminating in a public 'wedding'-equivalent (a merger, an IPO, a relaunch event) that crystallizes a renewed and more inclusive company culture — versus a corporate decline narrative told in tragedy's shape, where an exceptional, isolated founder-figure is destroyed by the very success and elevation that made them exceptional in the first place."
critical-questions:
  - "Which of the four mythoi is this narrative's OVERALL movement enacting — integration of the protagonist into a renewed society (comedy), elevation through iterated trial toward an idealized fulfillment (romance), isolation and fall of an exceptional individual (tragedy), or diminishment of the protagonist relative to the audience's own judgment (irony/satire) — as distinct from which genre-label or medium the work happens to carry?"
  - "Is the narrative TRANSITIONING between mythoi rather than sitting fixed in one, and if so, at which scene does the wheel turn — a comedy's ending tipping toward satire, a tragedy's fall completing into irony, a romance curdling into its own parody?"
  - "Is a specific reversal or recognition moment (peripeteia/anagnorisis, lex-nr3kg/lex-qfwuf) being mistaken for the mythos itself, rather than read as a scene-level device diagnostic of which overall mythos the surrounding work belongs to?"
  - "Is a quest-structured narrative (lex-h7vet, depart-trial-return) actually landing in romance's triumphant register, or has it, by its ending, slid toward tragedy (a failed quest, an isolated hero) or irony (the quest revealed as illusory or degraded)?"
  - "Is tragedy's hamartia being read as a moral flaw or wrongdoing, when Frye's own claim is structural — the hero's isolation and exposure at the top of the wheel of fortune, independent of culpability?"
