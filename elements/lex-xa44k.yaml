id: lex-xa44k
name: the-obligation-to-give-scales-with-possession-and-terminates-at-zero
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A gift can be routed correctly through a chain of people without any single arbiter deciding who deserves it, if each recipient measures their own remaining attachment to possessions against the next person's and passes the gift on to whoever owns less — because the duty to give, on this logic, is generated by having something to give, and the chain only stops at whoever has nothing left to be obligated by. In the Jataka's tale, a gift of food passes from a king to his chaplain to a forest ascetic to a Pacceka Buddha, each explaining their handoff by their own residual worldliness: the ascetic still forages, cooks, and owns tools, so he defers to the one with nothing — \"I cook, he cooks not: I have wealth, he nothing: I'm bound tight to worldly things, but he is free: the food is his by right.\" The Pacceka Buddha, who owns nothing and generates no further obligation, keeps the food without passing it on, naming the exact principle that ends the chain: \"They have possessions, they have wealth, to give their duty is: / Who asks a giver to partake, he is a foe, y-wis.\""
related: []
evokes: [jataka, pakinnakanipata, bhikkha-parampara-jataka, obligation-to-give-scales-with-possession, a-deference-chain-terminates-at-zero-attachment]
lineage:
  - source: primary
    text: jataka-chalmers1895-bhikkha-parampara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XIV (Pakinnaka-Nipata), No. 496, Bhikkha-parampara-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "They have possessions, they have wealth, to give their duty is: / Who asks a giver to partake, he is a foe, y-wis."
canonical-instances:
  - "A windfall bonus at a company gets passed from a well-paid director, to a mid-level manager who still has some discretionary income, to a contractor living paycheck to paycheck, each one reasoning aloud that whoever has more slack has more duty to redirect it — until it reaches someone with no slack left to redirect, who simply keeps it."
critical-questions:
  - "Each link in the chain volunteers the handoff themselves — no external judge forces the comparison. What happens if two adjacent people in a real version of this chain disagree about who is genuinely less attached, each insisting the other should keep it?"
  - "The chain terminates at literal zero possessions (the Pacceka Buddha owns nothing at all). Is there a coherent version of this principle for the much more common case where everyone in the chain has SOME possessions and none is at true zero — does the obligation-to-give scale continuously, or does it only produce a clean answer at the boundary case?"
status: active
