lineage:
  - source: primary
    text: cushing-maiden-yellow-rocks-brothers-wait-for-witness-before-shooting
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Maiden of the Yellow Rocks.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Keep quiet! Be patient! Wait till the maiden comes,' said the elder one. 'If we should happen to kill one of these deer before she comes, perhaps she has some magic power or knowledge by which she would deprive us of the fruits of our efforts.' ... the elder one kept him curbed until the maiden was climbing the cliff, when he could restrain him no longer, and the youth pulled out his bow and let fly an arrow at the largest deer. One arrow, and the deer fell to the ground, and when the maiden appeared on the spot the deer was lying dead not far away."
canonical-instances:
  - "A whistleblower who has gathered decisive evidence of wrongdoing waits to present it publicly until the responsible executive is in the room, rather than releasing it while they're unreachable, specifically because a live, witnessed confrontation forecloses the executive's ability to quietly alter records or shape the story before anyone with authority has seen the evidence land."
  - "A union negotiating team that has secured a critical piece of leverage waits to invoke it until management is present at the table, rather than announcing it in a memo beforehand, because doing so in the room removes management's opportunity to preemptively undermine or reframe the leverage before it has been seen to work."
critical-questions:
  - "how would the brothers have known in advance that the maiden actually had a countermeasure available if they'd acted early -- is this tactic based on a real, confirmed risk, or is the caution itself just a hedge against an unconfirmed suspicion that happened to be validated by the story's own framing?"
  - "does waiting for the stakeholder to be present risk losing the advantage entirely if circumstances change in the interim -- what protects this tactic from a delay that gives the other party time to notice the threat and act first, before the witnessed moment ever arrives?"
  - "is there a meaningful difference between waiting for a witnessed moment to prevent a countermeasure, versus waiting specifically to maximize the other party's humiliation or helplessness by making the reversal impossible in front of them -- does the tactic's ethical character depend on which of these is the actual motive?"
