canonical-instances:
  - "A customer-success rep assigned a single enterprise account they cannot hand off tracks the account for months without the promised usage growth materializing; early notes describe the client contact as 'engaged, just needs more onboarding support,' later notes describe the same contact as 'difficult, won't follow through, blaming us for their own inaction' — the account's stalled metrics get relocated onto the client's character rather than onto the onboarding plan."
  - "A parole officer with an unmovable caseload tracks one parolee's repeated technical violations over several months; early case notes read as clinical and hopeful, later notes increasingly use character language ('manipulative,' 'doesn't want to change') rather than revisiting whether the conditions imposed are actually achievable for that parolee's circumstances."
critical-questions:
  - "Is the diary evidence generalizable, or is it a single dramatic case Martin selected precisely because it illustrates the mechanism vividly? The essay presents no base rate for how often extended non-improving relationships produce this specific drift versus, say, a student requesting reassignment early or successfully revising their own approach mid-course without relabeling the patient."
  - "The essay frames this as detachment AND confidence both eroding together, but does the diary evidence actually establish that BOTH declined, or primarily that composure declined while confidence-erosion is inferred rather than directly quoted from the diary excerpts themselves? Separating what the primary source shows from what Martin's summary claims about it is worth doing before treating both erosions as equally well-evidenced by this particular case."
