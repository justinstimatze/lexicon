id: lex-c3wfg
name: a-specific-remembered-harm-overrides-flattery-and-any-future-windfall
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A manipulator who caused concrete, verifiable injury can attempt to erase it with wheedling flattery and appeals to shared history; the wronged party can explicitly refuse to let present rhetoric outweigh a specific, remembered cost — and can state that not even a major future personal windfall would make them forgive the specific cruelty. The refusal names its own immunity to both persuasion and incentive. In the Jataka's tale of Ahigundika, the wronged snake-charmer answers a plea for reconciliation by naming the specific beating he still carries in his body: 'who in the stores, when drunk, I pray, did starve and beat me sore to-day? When I, snake-charmer, call to mind the bed of pain where I reclined' — and refuses on that memory alone, whatever fortune might later come his way."
related: []
evokes: [jataka, pancanipata, ahigundika-jataka, remembered-harm-overrides-flattery-and-incentive, refusal-immune-to-future-windfall]
lineage:
  - source: primary
    text: jataka-chalmers1895-ahigundika-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book V (Pancanipata), No. 365, Ahigundika-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Who in the stores, when drunk, I pray, Did starve and beat me sore to-day? When I, snake-charmer, call to mind The bed of pain where I reclined, Though I should some day be a king, No prayer from me this boon should wring, Thy cruelty remembering."
canonical-instances:
  - "A former employee who was publicly humiliated by an executive turns down a lucrative consulting offer from that same executive's new company, stating plainly that no amount of money changes what happened, closing off the possibility before any negotiation over terms even starts."
critical-questions:
  - "Is refusing a genuine future benefit purely on the basis of remembered harm always the wiser course, or can it cost the refuser opportunities that would have been worth taking despite the unresolved grievance?"
  - "Does naming the immunity to persuasion out loud actually make it more durable, or is stating it a form of performance that could still crack under continued pressure or a genuinely changed offer?"
status: active
