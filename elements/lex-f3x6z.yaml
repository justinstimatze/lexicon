    text: radin-trickster-forces-the-refusing-waterfall-to-relocate-anyway
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 48. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Remove yourself to some other location for the people are going to inhabit this place and you will annoy them.' Then the waterfall said, 'I will not go away. I chose this place and I am going to stay here.''I tell you, you are going to some other place,' said Trickster. The waterfall, however, refused to do it. 'I am telling you that the earth was made for man to live on and you will annoy him if you stay here. I came to this earth to rearrange it. If you don't do what I tell you, I will not use you very gently.' Then the waterfall said, 'I told you when I first spoke to you that I would not move and I am not going to.' Then Trickster cut a stick for himself and shot it into the falls and pushed the falls on to the land."
canonical-instances:
  - "A tenant clearly and repeatedly tells a landlord they do not consent to entering the apartment without 24 hours notice, citing the same lease clause each time, and the landlord, holding the only set of keys and facing no real enforcement, simply lets themselves in whenever convenient, treating each refusal as noise rather than a binding boundary."
  - "A smaller company in a supply contract repeatedly and clearly states it will not accept a proposed price increase, and a dominant supplier who controls the only viable source of a critical material imposes the increase anyway, because the smaller company's consistent refusal was never actually load-bearing against a party who could simply act unilaterally."
critical-questions:
  - "Does the waterfall have any real alternative response available, given that it has no way to enforce its own refusal, and does the story suggest any circumstance under which stating a boundary more forcefully or differently would have changed the outcome?"
  - "Is Trickster's threat, 'I will not use you very gently,' functioning as a genuine warning the waterfall could have heeded to avoid worse treatment, or is it simply announcing an outcome that was never actually contingent on the waterfall's response at all?"
  - "Does the story frame Trickster's action here as justified, clearing the way for future human habitation, in a way that might invite the reader to excuse the override of a clearly stated refusal when the stated purpose is presented as sufficiently important?"
