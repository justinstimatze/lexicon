id: lex-qkrey
name: covariation-of-magnitudes-establishes-causation-when-permanent-causes-resist-elimination
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When experimental elimination isn't possible (the cause can't be turned off), covariation of magnitudes establishes causation. Newton on tides: we can't turn off the moon, but moon-tide magnitudes covary. Mill's Method of Concomitant Variation."
related: [lex-spm8x, lex-w97xs, lex-b6kvs, lex-v6nqz, lex-8j5ms, lex-6bycb, lex-9kuqg, lex-s22hf, lex-fecdf, lex-eybad, lex-k9ku5, lex-e9z2y, lex-6pd48, lex-u3e5m]
scaffolds-from: [lex-eybad]
evokes: [the-fifth-canon, method-of-concomitant-variations, when-you-cant-turn-off-gravity, magnitude-correspondence-as-evidence, the-permanent-causes-problem, varying-cause-varies-effect, dose-response]
lineage:
  - source: primary
    text: mill-1843-system-of-logic-book-3-ch-8-method-of-concomitant-variations
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843), Book III 'Of Induction,' Chapter VIII §§6-7 'Method of Concomitant Variations.' Mill introduces this fifth method specifically to address PERMANENT CAUSES — agents that 'it is impossible either to exclude or to isolate; which we can neither hinder from being present, nor contrive that they shall be present alone.' Gravity, earth's mass, the moon, the sun — these cannot be turned-off for the negative-instance Method of Difference requires. Mill's solution: if we cannot exclude the cause, we can MODIFY it (change its quantity, position, distance) and observe whether the effect varies in correspondence. The mechanism is fundamentally distinct from Methods 1-4: those operate on presence/absence (binary); Concomitant Variations operates on magnitude-correspondence (continuous). Mill 1843 is PD globally. This atom is the sibling-pair of lex-v6nqz (which captures Methods 1-4); together they constitute Mill's complete experimental-inquiry methodology."
    quote: "[Mill 1843 *System of Logic* Bk.III Ch.VIII §6 framing:] 'There remains a class of laws which it is impracticable to ascertain by any of the three methods which I have attempted to characterize: namely, the laws of those Permanent Causes, or indestructible natural agents, which it is impossible either to exclude or to isolate; which we can neither hinder from being present, nor contrive that they shall be present alone.' [the problem: Methods 1-4 require excluding or isolating the candidate cause; Permanent Causes like gravity cannot be excluded.] '[T]hough we can not exclude an antecedent altogether, we may be able to produce, or nature may produce for us some modification in it. By a modification is here meant, a change in it not amounting to its total removal. If some modification in the antecedent A is always followed by a change in the consequent a, the other consequents b and c remaining the same; or vice versa, if every change in a is found to have been preceded by some modification in A, none being observable in any of the other antecedents, we may safely conclude that a is, wholly or in part, an effect traceable to A.' [the substrate-mechanism: vary the magnitude of the suspected cause; observe whether the effect varies in correspondence; conclude causation.] [FIFTH CANON:] 'Whatever phenomenon varies in any manner whenever another phenomenon varies in some particular manner, is either a cause or an effect of that phenomenon, or is connected with it through some fact of causation.' [§6 caution:] 'The last clause is subjoined, because it by no means follows when two phenomena accompany each other in their variations, that the one is cause and the other effect. The same thing may, and indeed must happen, supposing them to be two different effects of a common cause: and by this method alone it would never be possible to ascertain which of the suppositions is the true one.' [the critical critical question — correlation ≠ causation; Concomitant Variations establishes connection through causation but does not by itself discriminate direction or common-cause confound.] '[T]hat we may be warranted in inferring causation from concomitance of variations, the concomitance itself must be proved by the Method of Difference.' [the methodological recursion: Concomitant Variations leans on Method of Difference for proving the concomitance itself.]"
canonical-instances:
  - "Newton 1687 inverse-square-law for gravitation (canonical instance Mill himself cites in §6): the moon causes tides; we cannot turn-off the moon to apply Method of Difference. But the moon's POSITION varies daily, monthly, and seasonally; tide-position and tide-height vary in measurable correspondence with moon-position. Mill argues this is sufficient evidence to conclude moon-causes-tides. The mechanism is magnitude-correspondence: variations in moon-position are FOLLOWED BY variations in tide-position. Newton's Principia formalized the law (gravitational force ∝ 1/distance²) by extending this method to other planetary motions — mass-magnitude and distance-magnitude variations correlate with motion-magnitude variations across all observed celestial bodies"
  - "Cavendish 1798 measurement of earth's mass via torsion-balance: gravitational force between Cavendish's lead spheres could not be excluded (gravity is permanent and pervasive), but the force-magnitude could be MEASURED by torsion-deflection. Cavendish varied the distance between spheres systematically; observed force-deflection varying as 1/r²; concluded with high precision the gravitational constant + earth's mass. This IS Method of Concomitant Variations operationalized in physical instrumentation — the very experiment that confirmed Newton's framework relied on Mill's fifth method (~45 years before Mill named it)"
  - "thermal expansion of bodies: Mill's own canonical example (§6). Heat cannot be excluded from objects (Mill says 'we can not expel it altogether from any body'), but heat-quantity can be modified by warming/cooling. Body-dimensions vary in correspondence — heated metals expand; cooled metals contract. The proportionality (linear expansion coefficient α specific to each material) establishes both that heat causes expansion AND the quantitative law of expansion. The Concomitant Variations method discovers both the causal-direction (heat → expansion, not the reverse — verified by Mill via air-pump rarefaction not heating gases) AND the functional-form (linear vs nonlinear)"
  - "dose-response curves in pharmacology and toxicology: drugs cannot always be presence-absence-tested (some drugs have non-trivial baseline-presence in human biology — endogenous hormones, common metabolites). But dose-magnitude can be varied; response-magnitude varies in correspondence. The dose-response curve (often sigmoid; pharmacology recognizes ED50 = dose at which 50% of response is achieved; LD50 = dose at which 50% mortality) IS Method-of-Concomitant-Variations applied to drug-effect-quantification. Pharmacology's central inference-tool is Mill's fifth canon operationalized as a quantitative-curve-fitting framework"
  - "Hubble 1929 redshift-distance relationship (cosmological-expansion evidence): galaxy-recession-velocity (measured via redshift) varies in correspondence with distance (measured via Cepheid-variable luminosity). The proportionality (Hubble constant H₀) is the empirical foundation for cosmological-expansion theory. The substrate-mechanism IS Concomitant Variations: cosmic-expansion cannot be 'turned off' (it's a Permanent Cause in Mill's sense); but velocity-magnitude varies in correspondence with distance-magnitude across hundreds of observable galaxies. The cross-galaxy magnitude-correspondence is the pivotal evidence"
  - "regression analysis as modern Concomitant-Variations generalization: when multiple permanent causes co-occur (climate, economic, demographic variables all simultaneously varying), regression decomposes outcome-magnitude variation into per-cause contributions based on observed magnitude-correspondences. Modern econometrics IS Mill's Method of Concomitant Variations scaled up to multivariate magnitude-correspondence analysis. The critical-question Mill raised about Concomitant-Variations (correlation ≠ causation; common-cause confound) is the SAME critical-question modern causal-inference grapples with via instrumental-variables / regression-discontinuity / difference-in-differences designs"
  - "operationally distinct from lex-v6nqz eliminative-paired-comparison-isolates-cause-by-presence-absence-of-circumstances (sibling atom): lex-v6nqz operates on PRESENCE-ABSENCE (binary) variations; lex-qkrey operates on MAGNITUDE-CORRESPONDENCE (continuous) variations. lex-v6nqz fires when candidate cause can be excluded or isolated; lex-qkrey fires when candidate cause is a Permanent Cause that cannot be excluded but can be varied in magnitude. Mill explicitly distinguishes (§6) the domain of applicability: when Permanent Causes prevent Method-of-Difference, Concomitant-Variations is the alternative. The two together = Mill's complete inquiry methodology"
  - "operationally distinct from lex-w97xs spatial-mapping-reveals-causation-invisible-to-aggregate-statistics (Snow 1854 cholera): Snow's spatial-mapping IS presence-absence at the geographic level (high-density at Broad Street pump location; near-zero density elsewhere) — operationally a Method-of-Difference instance (lex-v6nqz). lex-qkrey fires for CONTINUOUS magnitude-correspondence (tide-height vs moon-position; dose vs response) where presence-absence categorization is artificial or impossible"
  - "operationally distinct from lex-b6kvs randomization-controls-for-unknown-confounders-that-no-other-design-can-address (Fisher 1925): randomization is a DEFENSE for Method-of-Difference against unknown confounders. Concomitant-Variations does not provide this defense — the common-cause confound (X correlates with Y because both caused by Z) is the canonical failure-mode Mill himself warned about (§6). Modern instrumental-variables and regression-discontinuity designs ARE attempts to extend Fisher's randomization-style defenses to the Concomitant-Variations domain"
  - "operationally adjacent to lex-spm8x feedback-loop-as-mechanism: when cause-and-effect feed back into each other (predator-prey magnitude-coupling; price-demand-magnitude-coupling), magnitude-correspondence is symmetric but causation is bidirectional. Concomitant-Variations correctly registers the connection-through-causation (the fifth canon's last clause) but cannot resolve direction; pairing lex-qkrey with lex-spm8x surfaces the bidirectional-causation pattern that simple magnitude-correlation will conflate"
critical-questions:
  - "correlation ≠ causation is Mill's own caveat (§6 'The last clause is subjoined, because it by no means follows when two phenomena accompany each other in their variations, that the one is cause and the other effect'). Magnitude-correspondence is consistent with: A causes B; B causes A; common cause C produces both A and B; the correspondence is coincidental (anti-causal correlation, e.g., spurious correlations from time-series with shared trends). Concomitant-Variations cannot discriminate among these scenarios from concomitance alone. Mill's recommended discrimination-mechanism is 'whether we can produce the one set of variations by means of the other' — i.e., reduce back to Method-of-Difference when possible. Modern equivalent: experimental intervention beats observational correlation"
  - "the magnitude-correspondence requirement is satisfied trivially for any linearly-related variables: heat and dimension are correlated, but so are heat and the Dow Jones Index over arbitrary time-windows. The method is silent on which magnitude-correspondences SHOULD count as causal. Mitigation: Mill (§6) requires that 'other antecedents' be held constant during the magnitude-variation. In practice this is the same ceteris-paribus problem Method-of-Difference faces; Concomitant-Variations does not relax it, only shifts the variable-type from binary to continuous"
  - "the functional-form of the magnitude-correspondence is not predicted by the method: Concomitant-Variations establishes that A and B vary together, but does not by itself reveal whether the relationship is linear, quadratic, exponential, sigmoidal, or has thresholds. Mill (§7) discusses 'the case in which the variations of the cause are variations of quantity' and notes that simple proportionality (A doubles → B doubles) is suggestive but not conclusive. Modern fitting via regression / non-linear-modeling extends this, but the FORM-DISCOVERY is an extra-Concomitant-Variations move (requires hypothesis-generation about plausible functional forms)"
  - "Mill's Permanent-Causes case (gravity, earth's-mass, sun) has been undermined in modern physics: general relativity treats gravity as space-time geometry rather than as a separable cause; quantum field theory presents 'forces' as exchanged virtual-particles. Mill's framework assumes cause-effect separability that 21st-century physics relaxes. The Concomitant-Variations method remains operationally useful for empirical magnitude-correspondence analysis, but its 19th-century ontological assumptions about Permanent Causes do not survive 20th-century physical-theory developments"
  - "the dose-response operationalization assumes a single varying cause and a single varying effect, but real systems often have multiple-causes-with-multiple-effects (multivariate magnitude-correspondence). Regression with multiple predictors generalizes Concomitant-Variations but introduces new problems (multicollinearity, omitted-variable bias, model-misspecification). Mill's framework gives no guidance for multivariate causal-inference; the methodological evolution from Mill (univariate) to modern (multivariate) econometrics is a substantive extension, not a mere refinement"
status: active
