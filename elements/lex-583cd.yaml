id: lex-583cd
name: preemptive-public-piety-insures-against-an-anticipated-future-exposure
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Someone who anticipates a future reckoning can start performing the exact virtue they're at risk of being caught violating, well in advance, so that by the time the accountability moment arrives, an established public record of that performance already exists to draw on. In the Jataka's tale of the impostor slave Katahaka, having married his way into wealth under a false identity, he anticipates his real master's eventual arrival and begins publicly proclaiming his disapproval of children who fail to show proper filial respect — banking social credit against a specific future exposure before it ever occurs. The performance isn't random virtue-signaling; it's targeted insurance, purchased in the exact currency the anticipated crisis will be paid in."
related: []
evokes: [jataka, ekanipata, katahaka-jataka, targeted-virtue-signaling-as-insurance, banking-social-credit-against-a-future-crisis]
lineage:
  - source: primary
    text: jataka-chalmers1895-katahaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 125, Katahaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "he made a point of proclaiming in public on all occasions his disapprobation of the lamentable decay of respect towards parents which shewed itself in children's sitting down to meals with their parents, instead of waiting upon them."
canonical-instances:
  - "An executive who suspects an old ethics violation might eventually surface starts publicly championing corporate transparency initiatives at every opportunity, months before anyone asks a single question, so that when the old issue does come up, colleagues already associate them with the value they're at risk of being seen violating."
critical-questions:
  - "Does this insurance actually work once the specific exposure it was purchased against arrives, or does a sufficiently direct accusation simply cut through the accumulated goodwill regardless of how much was banked?"
  - "Is there a meaningful difference between this and ordinary reputation management, or does the deliberate targeting — choosing the exact virtue tied to the anticipated failure — make it a distinct move worth naming separately?"
status: active
