id: lex-e7keg
name: a-small-universal-set-of-undefinable-meanings-grounds-all-definition
type-in: process
type-out: structure
_tier: atomic
agent-instruction: "Recognize this pattern whenever someone is DEFINING, TRANSLATING, or FORMALLY SPECIFYING the meaning of a word, concept, or term — writing a dictionary entry, building a machine-translation gloss, choosing an ontology's primitive categories, cross-culturally comparing an emotion or value concept, or constructing a formal semantic theory — because any such project that tries to define EVERY term using OTHER terms eventually does one of two things: goes in a circle, or bottoms out in a small set of terms that cannot themselves be defined any further. Wierzbicka's own diagnosis of the failure: 'the very idea of \"defining\" implies that there is not only something to be defined (a definiendum) but also something to define it with (a definiens...)' — a project promising to define literally everything is incoherent on its face, because the defining vocabulary has to come from somewhere. Ordinary dictionaries hide this by disguising circularity as progress — her own example, 'to demand is defined as \"to request firmly\" and to request as \"to demand gently\"' — and she shows the pattern scales up into 'huge webs enveloping whole extended families of words, or... gigantic tentacles extending throughout the pages of a dictionary' (her worked case: a real dictionary's entries for QUESTION and ANSWER, each defined via the other, both looping back through REFUSE, CALL, OFFER, ACCEPT, and CLAIM), and she invokes Pascal's mock-definition of light — defining lumière as 'a luminary movement of luminous bodies' — as the reductio of trying to define a word by itself. The alternative to circularity is not 'define nothing' but STOP AT INDEFINABLES: some concepts are already maximally clear and cannot be made more intelligible by further paraphrase — these are the semantic primitives, or semantic primes. Wierzbicka's substantive empirical claim is threefold, and each part matters independently. (1) SMALL: the set is dozens of items, not thousands — her own worked inventory of 'old primitives', confirmed via cross-linguistic testing, numbers 37, organized into substantives (I, YOU, SOMEONE, SOMETHING, PEOPLE), determiners (THIS, THE SAME, OTHER), quantifiers (ONE, TWO, MANY/MUCH, ALL), mental predicates (THINK, KNOW, WANT, FEEL), speech (SAY), actions/events (DO, HAPPEN), evaluators (GOOD, BAD), descriptors (BIG, SMALL), time (WHEN, BEFORE, AFTER), space (WHERE, UNDER, ABOVE), partonomy/taxonomy (PART OF, KIND OF), metapredicates (NOT, CAN, VERY), and interclausal linkers (IF, BECAUSE, LIKE) — plus a further set of 'new primitives' (SEE, HEAR, MOVE, THERE IS, LIVE, HERE, NOW, FAR, NEAR, and others) added under continued testing. (2) UNIVERSAL, not an artifact of English or of the analyst's own language: the cross-linguistic project Wierzbicka co-directed (Goddard and Wierzbicka 1994, *Semantic and Lexical Universals*) tested the hypothesis against thirteen typologically and geographically unrelated languages — Ewe, Mandarin Chinese, Thai, Japanese, three Australian languages, three Misumalpan languages of Nicaragua, three Austronesian languages, one Papuan language, and French — and found a lexical exponent (a word or bound morpheme) for the proposed primes in every one. (3) COMBINATORIAL: the primes are not just a list, they COMBINE according to a shared, cross-linguistically-recurring 'mini-grammar' — her own formulation is that 'in searching for universal grammatical patterns, we should not be looking for universals of form, but rather for universals of combinability,' illustrated by valency patterns that recur across languages (DO opens an agent-slot and an action-complement slot; SAY opens both a bare complement and an optional addressee, 'SAY' and 'SAY TO'). This combinatorial universal grammar of primes is what licenses the Natural Semantic Metalanguage (NSM): a paraphrase system built entirely out of primes, usable as a 'tertium comparationis' — a language-independent common measure — so that meanings in any language can be compared without the analyst's own language distorting the result: 'without such a language-independent metalanguage, we would be for ever condemned to ethnocentrism, for we could only describe other languages and cultures through the prism of our own language.' Distinct from, and in live tension with, lex-2vpet (Wittgenstein/Rosch, a-category-can-be-held-together-by-crisscrossing-similarities-rather-than-a-shared-essence): Wierzbicka explicitly targets this as the doctrine she thinks has done the most damage to rigorous semantics — 'especially harmful to its progress has been the doctrine of \"family resemblances\" and the associated attacks on the notion of semantic invariant — a corner-stone of effective semantic analysis' — while conceding that prototype/family-resemblance effects are real for many complex, culturally elaborated categories (her own example: 'game'). Her position is not that lex-2vpet's pattern never applies, but that it must not be allowed to swallow the case of the semantic PRIMES themselves, which (she argues) have sharp, articulable, invariant meanings rather than fuzzy, resemblance-based ones — the two atoms mark opposite poles of a live, unresolved argument in semantics about whether ANY meanings are discretely bounded, and should be reached for together when a discussion of 'is this concept fuzzy or does it have a hard core?' is in play. Distinct from Brown's Human Universals (already grounded in this substrate, e.g. lex-4ydm6 in-group/out-group ethical dualism, lex-yzuec triangular awareness, lex-hta65 spontaneous theory of mind): Brown's universals are BEHAVIORAL AND INSTITUTIONAL — recurring practices, norms, and social forms attested across documented human societies. Wierzbicka's universals are SEMANTIC-ATOMIC — a claim about which specific WORD-MEANINGS are cross-linguistically irreducible, a claim about the structure of MEANING ITSELF, not about what humans DO. The two research programs share a fieldwork-against-relativist-skepticism methodology but sit on orthogonal axes; neither subsumes the other, and citing one is not grounding for the other. Also distinct from Chomsky's Universal Grammar (mentioned only in passing elsewhere in this substrate, never primary-grounded there): Chomsky's UG is a claim about innate SYNTACTIC structure explicitly walled off from meaning — Wierzbicka spends much of this book's introduction arguing that Chomskyan generative grammar's 'deep methodological aversion to meaning' left semantics undeveloped, and that her own 'universal grammar' claim is the inverse: a grammar of MEANING (primes and their combinatorics), not of uninterpreted syntactic strings. Use this atom when: (i) evaluating a dictionary, glossary, translation, or formal ontology that claims or implicitly assumes it can define every term without circularity or without any indefinable remainder — ask where its regress actually bottoms out, and whether that bottom is principled or merely unexamined; (ii) building or auditing machine-translation and cross-lingual NLP systems, where 'define word X in language A using words from language B' silently imports language-B's conceptual scaffolding unless some smaller, cross-linguistically-neutral interlingua is used — NSM is the historical proposal for exactly this role; (iii) designing an ontology or knowledge-representation schema and deciding where to STOP defining primitive categories — every KR system faces the same regress Wierzbicka diagnoses in dictionaries, and primitives chosen arbitrarily (in the sense Nelson Goodman defended for formal systems generally, which Wierzbicka explicitly argues does NOT hold for natural-language semantics) reproduce the unprincipled stopping-points she is arguing against; (iv) cross-cultural psychology or anthropology using English emotion/value words (anger, sadness, mind, self) as supposedly culture-neutral analytic tools — her point is that these words are NOT primitives and carry an Anglo conceptual perspective, whereas the actual primes (WANT, FEEL, GOOD, BAD, THINK) are the safer common ground; (v) any general philosophy-of-language discussion of the regress-of-definition problem, where this atom supplies a specific, empirically-tested answer — a concrete, cross-linguistically-attested list of stopping points — rather than an abstract gesture at 'primitives must exist somewhere.' Failure modes: (a) TREATING 'INDEFINABLE' AS 'VAGUE' — indefinable does not mean imprecise; primes are indefinable because they are already maximally clear, not because rigor has been abandoned; (b) SMUGGLING IN A DISGUISED PRIMITIVE — reaching for a technical-sounding word (her own example: glossing 'if' as 'implication') as though naming something in Latinate vocabulary were the same as actually defining it in more basic terms; (c) ASSUMING ENGLISH-CENTRISM WHERE NONE IS CLAIMED — the theory is falsifiable and was tested against typologically remote languages, not asserted from armchair English intuition, though any given prime's status remains open to future cross-linguistic disconfirmation; (d) CONFLATING THIS WITH BROWN-STYLE OR CHOMSKY-STYLE 'UNIVERSALS', or WITH ROSCH/WITTGENSTEIN-STYLE FUZZY CATEGORIES — each carries its own evidentiary base and none licenses borrowing another's."
