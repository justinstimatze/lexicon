lineage:
  - source: primary
    text: godfrey-smith-2016-other-minds
    citation: "Peter Godfrey-Smith, *Other Minds: The Octopus, the Sea, and the Deep Origins of Consciousness* (Farrar, Straus and Giroux, 2016). The argument runs in two linked stages across the book's early chapters. First, Godfrey-Smith traces the branching tree of life back to the point where the lineage leading to vertebrates (and eventually humans) and the lineage leading to cephalopods (and eventually octopuses) share their most recent common ancestor: a small, simple, probably worm-like Ediacaran bilaterian animal living roughly 600 million years ago, likely with only a diffuse nerve-net or at most a rudimentary proto-brain, and almost certainly none of the cognitive capacities later evident on both descendant branches. Because that ancestor was so minimal and lies so far back — nearly twice as far as the common ancestor of mammals and birds — any sophisticated cognitive capacity shared by octopuses and vertebrates cannot be a shared inheritance from that ancestor; it must instead have been assembled independently, at least twice, on the two separate branches, and Godfrey-Smith extends the same logic a level deeper to find complex cephalopod nervous systems themselves evolving independently within the cephalopod lineage. Second, built on the same lineage-split, Godfrey-Smith argues the resulting cephalopod nervous system is organized on a fundamentally different, more distributed architecture than the vertebrate model: where the chordate lineage centralized neurons into a single brain atop a dorsal nerve cord, the cephalopod lineage retained and elaborated an ancestral 'ladder-like,' ganglion-based body plan, so that in a common octopus the majority of its roughly 500 million neurons are distributed through its eight arms rather than concentrated in its central brain — each arm capable of local sensory-motor coordination and even basic reaching-and-grasping after surgical removal from the body — which Godfrey-Smith uses to open a genuinely hard question about the unity and location of octopus subjective experience."
    quote: "[On the minimal common ancestor, ~600 million years back:] 'No one knows what the animals in question looked like in any detail... They did have nervous systems. These might have comprised nets of nerves spread throughout the body, or they might have included some clustering into a tiny brain... These creatures were the last common ancestors of yourself and an octopus, of mammals and cephalopods.' [On locating that ancestor and how far back it lies relative to the mammal-bird split:] 'Now let's look for the common ancestor that connects this first group of animals, which includes ourselves, to an octopus. To find this animal we have to travel much further down the branches. When we find it, about 600 million years before the present, the animal is that flattened worm-like creature I sketched earlier... This step back in time is nearly twice as long as the step we took to find the common ancestor of mammals and birds.' [The book's organizing premise, stated directly:] 'Cephalopods are an island of mental complexity in the sea of invertebrate animals. Because our most recent common ancestor was so simple and lies so far back, cephalopods are an independent experiment in the evolution of large brains and complex behavior. If we can make contact with cephalopods as sentient beings, it is not because of a shared history, not because of kinship, but because evolution built minds twice over. This is probably the closest we will come to meeting an intelligent alien.' [The Y-shaped-tree image:] 'The history of large brains has, very roughly, the shape of a letter Y. At the branching center of the Y is the last common ancestor of vertebrates and mollusks... The ancestor at the center of the Y certainly had neurons. It was probably a worm-like creature with a simple nervous system, though... From that stage the evolution of nervous systems proceeds independently in many lines, including two that led to large brains of different design.' [On convergent cognitive features despite the minimal shared ancestor:] 'The most dramatic similarity is the eyes. Our common ancestor may have had a pair of eyespots, but it did not have eyes anything like ours. Vertebrates and cephalopods separately evolved \"camera\" eyes, with a lens that focuses an image on a retina... The capacity for learning of several kinds is also seen on both sides... If it was present in the human/octopus common ancestor, it was greatly elaborated down each of the two lines.' [On the cephalopod lineage independently repeating the pattern within itself:] 'the earlier date makes it much more likely that cephalopods evolved complex nervous systems at least twice, once in the lineage leading to octopuses and once in the lineage leading to cuttlefish and squid... At least two lines evolved large nervous systems separately. Cephalopods and smart vertebrates are independent experiments in the evolution of the mind.' [On the distributed, decentralized cephalopod nervous-system design versus the vertebrate design:] 'On our lineage, the chordate design emerges, with a cord of nerves down the middle of the animal's back and a brain at one end... On the other side, the cephalopods' side, a different body plan evolved, and a different kind of nervous system. These nervous systems are more distributed, less centralized, than ours... This is sometimes called a \"ladder-like\" nervous system.' [On the absence of part-by-part mapping between octopus and vertebrate brains:] 'When biologists look at a bird, a mammal, even a fish, they are able to map many parts of one animal's brain onto another's. Vertebrate brains all have a common architecture. When vertebrate brains are compared to octopus brains, all bets — or rather, all mappings — are off. There is no part-by-part correspondence between the parts of their brains and ours. Indeed, octopuses have not even collected the majority of their neurons inside their brains; most of the neurons are found in their arms.' [On the majority of octopus neurons living in the arms:] 'Further, much of a cephalopod's nervous system is not found within the brain at all, but spread throughout the body. In an octopus, the majority of neurons are in the arms themselves — nearly twice as many as in the central brain. The arms have their own sensors and controllers. They have not only the sense of touch, but also the capacity to sense chemicals — to smell, or taste. Each sucker on an octopus's arm may have 10,000 neurons to handle taste and touch. Even an arm that has been surgically removed can perform various basic motions, like reaching and grasping.' [On the arms' apparent independence from central control:] 'How does an octopus's brain relate to its arms?... the arms enjoyed considerable independence. The channel of nerves that leads from each arm back to the central brain seemed pretty slim... As Roger Hanlon and John Messenger put it in their book Cephalopod Behaviour, the arms seemed \"curiously divorced\" from the brain, at least in the control of basic motions.' [On arm-level coordination and possible arm-level short-term memory:] 'The internal coordination of each arm can be quite graceful, too. When an octopus pulls in a piece of food, the grasping by the very end of the arm creates two waves of muscle activation... The nervous systems in each arm also include loops in the neurons (recurrent connections, in the jargon) that may give the arm a simple form of short-term memory, though it's not known what this system does for the octopus.' [On the resulting question about the unity and boundary of octopus experience:] 'In the case of the octopus, everything about experience is made more complicated by the unusual relations between brain and body. Let's assume the octopus has a kind of mixed control over what its arms do... Octopuses, as they evolved their complex behavioral abilities, opted for a partial delegation of autonomy to their arms. As a result, those arms are brimming with neurons and seem able to control some actions locally... The octopus may be in a sort of hybrid situation. For an octopus, its arms are partly self — they can be directed and used to manipulate things. But from the central brain's perspective, they are partly non-self too, partly agents of their own.'"
