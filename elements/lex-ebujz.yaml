evokes: [cao-xueqin-dream-of-the-red-chamber, hongloumeng, stone-narrator-frame, nuwa-sky-repair-myth, land-of-illusion, great-void-couplet, truth-under-the-garb-of-fiction, chen-shih-yin, chia-yu-tsun, mise-en-abyme, frame-narrative, diegetic-levels, autobiographical-fiction, dream-within-a-dream, based-on-a-true-story-framing, simulation-realism, zhuangzi-butterfly-dream]
lineage:
  - source: primary
    text: cao-xueqin-c1791-dream-of-the-red-chamber
    citation: "Cao Xueqin [曹雪芹] (with the latter portion of the 120-chapter tradition often attributed to a posthumous redaction, traditionally associated with Gao E), Hung Lou Meng / The Dream of the Red Chamber (Honglou Meng), composed and circulated in manuscript through the mid-eighteenth century and first printed as a complete 120-chapter edition in 1791-92. Cited here in the English translation of H. Bencraft Joly, Hung Lou Meng, or, The Dream of the Red Chamber, a Chinese Novel, Book I (Hong Kong: Kelly & Walsh, 1892), covering Chapters I-XXIV of the novel's opening book. The frame-conceit is stated directly and self-referentially in Chapter I: the narrator explains he 'designedly concealed the true circumstances' of his own history and 'borrowed the attributes of perception and spirituality to relate this story of the Record of the Stone,' naming this device outright via the punning character-name Chen Shih-yin, glossed in-text as 'truth under the garb of fiction.' The stone-frame itself follows: a sentient block of stone, left unused when the goddess Nü Wo repaired the sky, is carried into mortal incarnation by a Buddhist monk and Taoist priest so that it may live out a full human life; its lived experience becomes, upon its return, an inscription on its own surface, later discovered, copied, and transmitted into the world by the Taoist K'ung K'ung, and only afterward revised into its final form by the novel's actual historical author. The doubled truth/fiction status this frame produces is then stated as an explicit, general principle in a couplet inscribed at the gateway to 'The Visionary Confines of the Great Void' / 'the Land of Illusion,' repeated verbatim at two structurally matched narrative moments (Chapter I and Chapter V)."
    quote: "[The narrator's own framing of the truth/fiction device, Ch. I:] 'This is the opening section; this the first chapter. Subsequent to the visions of a dream which he had, on some previous occasion, experienced, the writer personally relates, he designedly concealed the true circumstances, and borrowed the attributes of perception and spirituality to relate this story of the Record of the Stone. With this purpose, he made use of such designations as Chen Shih-yin (truth under the garb of fiction) and the like.' [The stone's origin:] 'The Empress Nü Wo, (the goddess of works,) in fashioning blocks of stones, for the repair of the heavens, prepared... 36,501 blocks of rough stone... Of these stones, the Empress Wo only used 36,500; so that one single block remained over and above, without being turned to any account.' [The stone's own defense of its record as true-to-experience even while being fiction, addressed to the Taoist K'ung K'ung:] 'Sir Priest,' [the stone replied with assurance,] 'why are you so excessively dull?... [these events] do not borrow this customary practice, but, being based on my own experiences and natural feelings, present, on the contrary, a novel and unique character... In these pages, the scenes depicting the anguish of separation, the bliss of reunion, and the fortunes of prosperity and of adversity are all, in every detail, true to human nature, and I have not taken upon myself to make the slightest addition, or alteration, which might lead to the perversion of the truth.' [The displaced-authorship move, crediting the historical author only as a reviser of the stone's own record:] 'In later years, owing to the devotion by Tsao Hsüeh-ch'in in the Tao Hung study, of ten years to the perusal and revision of the work, the additions and modifications effected by him five times, the affix of an index and the division into periods and chapters, the book was again entitled \"Chin Ling Shih Erh Ch'ai\"... This then, and no other, is the origin of the Record of the Stone.' [The couplet, first occurrence, Chapter I, at the gateway 'under a lofty stone portal... \"T'ai Hsü Huan Ching,\" \"The Visionary limits of the Great Void\":] 'When falsehood stands for truth, truth likewise becomes false, / Where naught be made to aught, aught changes into naught.' [The couplet, second occurrence, Chapter V, at 'a stone tablet... \"The confines of the Great Void\"':] 'When falsehood stands for truth, truth likewise becomes false; / When naught be made to aught, aught changes into naught!'"
canonical-instances:
  - "The cardinal couplet itself, inscribed at the gateway to 'The Visionary Confines of the Great Void' and repeated verbatim at two separate, structurally matched moments — Chen Shih-yin's dream-vision (Chapter I) and Chia Pao-yü's dream-vision (Chapter V) — establishing it as the novel's deliberate structural refrain rather than an incidental aside: 'When falsehood stands for truth, truth likewise becomes false; / When naught be made to aught, aught changes into naught.'"
  - "The Stone frame-device: a sentient block rejected by the goddess Nü Wo's sky-repair is incarnated to live a full mortal life, and its own lived experience becomes an inscription later discovered and copied by the Taoist K'ung K'ung; the novel's actual historical author, Tsao Hsüeh-ch'in, appears within his own frame-story only as a later reviser of the stone's already-existing record — displacing historical authorship onto the fictional artifact whose 'reality' the frame insists on."
  - "The naming pun: Chen Shih-yin, glossed explicitly in-text as 'truth under the garb of fiction,' set against Chia Yü-ts'un — Chia also being the surname of the novel's central family — enacting the same true/false convertibility the couplet states at the level of character-naming rather than plot."
  - "Modern analogue: 'based on a true story' / 'inspired by actual events' film and docufiction framing, where a scene is simultaneously marketed as true (for emotional credence) and legally hedged as dramatized/fictionalized (for protection from factual liability) — disputes about such works are usually disputes about which frame is operative at a given moment, not disputes about the underlying facts."
  - "Modern analogue: dream-and-simulation arguments — Zhuangzi's butterfly dream, Descartes' dream/evil-demon doubt, contemporary 'simulation realism' — where content fully real from within a frame is simultaneously unreal from the frame that contains it, with no frame-independent vantage from which to declare one frame the truly real one."
  - "operationally distinct from lex-6xw55 same-text-in-different-context-is-a-different-work: lex-6xw55's axis is diachronic (identical marks, different historical context of authorship, e.g. Cervantes vs Menard); this atom's axis is synchronic (a single narrative, two nested frame-levels, real and fictional at once, in the same reading)."
  - "operationally distinct from lex-2kwkh reality-threshold-crossing: lex-2kwkh is an experiential/design-stance claim about a participant crossing from a staged frame into a consequential one; this atom is a logical/textual claim about truth-value itself being frame-indexed, with no participant crossing required — the doubled status simply holds at both levels at once."
critical-questions:
  - "Is a given piece of content being argued about as though 'real' and 'fictional' are mutually exclusive properties of the content itself, when the actual disagreement is really about which narrative or frame-level is in view?"
  - "Does the frame-device launder authorial accountability — crediting an in-story intermediary (a stone, 'these are the actual case files,' 'a true story') to claim the emotional credibility of truth while evading the accountability of a factual assertion — or is it a sincere, thematized claim about frame-relativity, as Cao Xueqin's couplet is?"
  - "Is the same work using its dual truth/fiction status to have it both ways rhetorically — borrowing credibility from the 'true' framing while borrowing protection from the 'fictional' framing, in the same breath?"
  - "When a text insists it is both true and fictional, is that insistence doing genuine interpretive work (thematizing frame-relativity as a general principle) or merely restating the unremarkable formal fact that it is a story within a story?"
  - "Is the puzzle at hand about the SAME text meaning something different because of who wrote it and when (reach for lex-6xw55), or about a SINGLE text's content being assigned two different truth-values because it is being read at two different nested narrative levels at once (this atom)?"
