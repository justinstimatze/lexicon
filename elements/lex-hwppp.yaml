id: lex-hwppp
name: the-frame-you-apply-supplies-the-moral-verdict
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two people reach opposite moral conclusions from the same set of facts, check whether they are actually reasoning inside the same frame. George Lakoff analyzes a Washington Post column: a city government faces a $722 million budget shortfall. Columnist William Raspberry casts the situation through a parent-and-child frame -- the government is 'the poor but compassionate mother with a credit card,' who has overspent on her children and now must learn self-discipline. Lakoff then reconstructs the identical facts through the opposite parent-and-child casting: Congress plays the parent this time, and Congress is a deadbeat dad who has refused to pay for his children's support. Maternal overindulgence and paternal abandonment are both available readings of the same debt, and each one feels like plain common sense to whoever is already holding that frame. Diagnostic move: before arguing about who's at fault, name which frame is doing the moral casting -- the disagreement usually lives there, dressed up as a dispute about facts."
related: [lex-2rttc, lex-kfdep, lex-sp7fa, lex-tyzes]
evokes: [george-lakoff, moral-politics-1996, william-raspberry, nation-as-family-metaphor, deadbeat-dad-congress]
lineage:
  - source: primary
    text: lakoff-1996-raspberry-compassionate-mother-frame
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 1 'The Mind and Politics,' quoting William Raspberry, Washington Post column as it appeared in the Houston Chronicle, section A, p.30, February 4, 1995. The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“But a good chunk of the underlying problem is the compassionate mom attitude that says: If it’s good for the kid to have, then I ought to buy it—and worry later about where the money will come from.”"
  - source: primary
    text: lakoff-1996-metaphor-not-facts-determines-logical-structure
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 1 'The Mind and Politics.'"
    quote: "“The logical structure of the column is determined by metaphor, not by facts. One could have taken the same budget shortfall and framed it in a different way. One could have observed that Washington, D.C., must have city services beyond its population to serve the large number of relatively well-off civil service workers, lobbyists, and others who live in the wealthy suburbs but work in town. One could also have mentioned that it is the responsibility of Congress to see that the city is maintained properly and that it lives by a humane standard, indeed that it should set a standard for the country. One could then apply the metaphor of the government as parent to Congress, seeing Congress as a deadbeat dad, refusing to pay for the support of his children, the citizens of Washington, D.C. One could then have drawn the moral that deadbeat dad Congress must meet his responsibilities and pay, no matter how tough it is for him. This is just common sense—a different kind of common sense.”"
canonical-instances:
  - "The direct textual anchor, on why the deadbeat-dad reading is exactly as commonsensical as the compassionate-mother reading: Lakoff constructs it as 'the moral that deadbeat dad Congress must meet his responsibilities and pay, no matter how tough it is for him' and calls it 'just common sense—a different kind of common sense.'"
  - "Hypothetical: a city hospital system reports a $40 million deficit. One columnist frames the hospital as a devoted but reckless parent who kept every promised service running for the community's children no matter the cost, and says the hospital must finally learn to say no. A patient advocate frames the identical deficit as the state legislature acting like an absent father who slashed reimbursement rates for a decade and now blames the hospital for the shortfall that decade created. Both columns cite the same budget numbers. Neither writer experiences themselves as having chosen a frame -- each experiences themselves as simply describing what happened."
critical-questions:
  - "Lakoff constructs the deadbeat-dad frame himself, as a demonstration, rather than pointing to a columnist who actually used it on this specific shortfall. Does a frame's mere availability -- the fact that a coherent, plausible alternative casting can always be built -- establish that Raspberry's own frame was arbitrary, or can a demonstration counter-frame be constructed for almost any claim without that showing the original claim was ever a live contender?"
  - "If frame-choice alone supplied the verdict, two people sharing an obvious frame should always reach the same conclusion from the same facts. But people who plainly share a frame -- two conservatives, say -- still argue fiercely about how a given policy fits it. What does that persistence of within-frame disagreement say about how much of the moral verdict the frame actually supplies on its own?"
status: active
