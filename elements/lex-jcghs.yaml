id: lex-jcghs
name: unlimited-scaling-of-a-granted-good-revokes-the-good-itself
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A benefit that looks purely good when you imagine one person receiving it can become the thing that has to be taken away once someone actually models what happens when everyone receives it without limit, because the good was only good at a scale nobody had checked. In Radin's Winnebago Hare Cycle, Hare believes he has secured something unambiguously positive for his people: 'Now the people will live peacefully and forever.' His grandmother doesn't dispute that endless life sounds good; she runs the consequence forward instead: 'if all the people live for ever they would soon fill up the earth. There would then be more suffering than there is now, for some people would always be in want of food if they multiplied greatly. That is why everything has an end.' The argument isn't that death is good for any individual -- it's that a world where nobody dies produces more total suffering than a world where everyone eventually does, because the first benefit Hare secured never had a population or resource constraint built into it. Hare's own response confirms he never modeled this: 'A good thing I had obtained for my uncles and my aunts but my grandmother has spoiled it.' The gift wasn't malicious or fake. It was simply granted at the scale of one wish, evaluated at the scale of everyone taking it up at once. Diagnostic move: before treating a benefit as an unqualified good because it looks good for one person or in isolation, run the scenario where everyone who could take it up actually does, and check whether the thing that made it a good at small scale survives being multiplied to the scale it would actually operate at."
