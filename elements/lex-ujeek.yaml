lineage:
  - source: primary
    text: kautilya-arthashastra-reward-traitors-as-promised
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Peaceful Rule of Acquired Territory,' 'New Territory, Acquired by Conquest,' {13.5.3-21}."
    quote: "'He shall reward, as promised, those who were traitors to the enemy for his sake; if they had exerted themselves more [than required], they shall be rewarded more than promised. For he who does not keep his promises or acts against the interests of the people, becomes unworthy of the trust of his own and other people.'"
canonical-instances:
  - "A company that recruited a competitor's key engineer with a specific equity and title promise honors that promise in full even after the engineer turns out to be difficult to work with, because failing to do so would circulate quickly among other potential recruits at competing companies and end the company's ability to poach talent in the future."
  - "A whistleblower protection program pays out the full promised bounty to an informant even when the informant's own conduct in the underlying scheme was ethically compromised, because underpaying or reneging on this informant would become known and would deter every future informant who might otherwise have come forward."
critical-questions:
  - "does this obligation to honor promises to defectors create a perverse incentive structure where the most valuable partners are, by construction, people who have already demonstrated willingness to betray someone -- does building a reliable talent pipeline this way select for exactly the trait (disloyalty) that makes someone risky to rely on next?"
  - "how does a party distinguish between a defector who genuinely delivered on their end of the bargain and one who merely claims to have, especially when the value of their contribution (intelligence, sabotage, disloyalty) is inherently hard to verify after the fact -- does the pressure to maintain a paying-in-full reputation create room for defectors to over-claim their contribution?"
  - "at what point does honoring every promise regardless of the promisee's conduct become complicity in rewarding harm -- if a defector's actions caused serious damage to innocent third parties, does the reputational argument for paying them in full outweigh the cost of visibly rewarding that harm?"
