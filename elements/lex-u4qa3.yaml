id: lex-u4qa3
name: petition-brokering-rebuilds-power-through-accumulated-obligation
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'A dispossessed figure who has no direct claim to reassert can rebuild real influence without ever asking for status back — by becoming the conduit through which other people''s requests reach the actual authority. Each successful intercession, however small, converts into personal loyalty and obligation owed to the broker rather than to the authority who actually granted it, and these individually modest debts compound into a rival power base built entirely out of other people''s asks. In the Kama-Jataka, a prince who renounced his own claim to the throne starts by getting one merchant family''s taxes remitted through a letter to his brother the king; word spreads, and soon the whole countryside is routing its petitions through him, until his ''receipts and honour were great'' — a second throne built out of intercessions rather than inheritance.'
related: []
evokes: [jataka, dvadasanipata, kama-jataka, intermediary-as-emergent-power-base, influence-rebuilt-through-brokered-favors]
lineage:
  - source: primary
    text: jataka-chalmers1895-kama-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 467, Kama-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Thereupon all the villagers, and the people of the country side, came to him, and said, "Get our taxes remitted, and we will pay taxes to you." For them too he sent his petition, and got the taxes remitted. After that the people paid their taxes to him.'
canonical-instances:
  - 'A former CEO who stepped down but stays close to the new leadership starts quietly helping former colleagues get their proposals approved, and within two years has more informal sway over company decisions than several people who outrank him on the org chart, because everyone routes their asks through him first.'
critical-questions:
  - 'The petitioners end up paying taxes to the broker rather than the king by the passage''s own account — at what point does petition-brokering stop being a service to petitioners and start being a shadow tax authority competing with the very ruler whose goodwill it depends on?'
status: active
