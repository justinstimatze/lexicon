id: lex-6gdts
name: just-a-little-longer-burns-a-benefactors-patience-in-real-time
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you owe a return to someone whose goodwill made your current good fortune possible, don't treat your own private intention to 'go back just a little later' as though it costs nothing while you delay -- the person waiting on you is often forming their own judgment about your character in real time, and their patience can run out well before whatever deadline you privately set for yourself. In Cushing's telling, the Turkeys who transform a poor girl for a single day's festival give her one condition up front: return before too long, or lose everything. Mid-celebration, she does remember them, but resolves the tension with self-permission rather than action: 'I will stay a while longer, and just before the sun sets I will run back to them.' She never gets the chance to keep that private schedule. Long before sunset, the Turkeys draw their own conclusion from her absence: 'It is as we might have expected. She has forgotten us; therefore is she not worthy of better things... Let us go forth to the mountains and endure no more of this irksome captivity.' They don't wait for a fixed deadline to expire -- they act on the accumulating evidence of being deprioritized, and by the time she notices and runs back, they're already gone. Diagnostic move: when you're mentally postponing a return to someone who enabled your current position, remember that 'just a little longer' is a private negotiation you're having with yourself alone -- the other party isn't bound by your internal schedule, and their willingness to keep waiting is being spent down by your visible absence the entire time you assume you still have margin."
