    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 4, '\"An Attack of Accidents,\"' on John Cage's compositional practice and Marcel Duchamp's Large Glass. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In fact, Cage defines modern art as art which cannot be disrupted by nonart. It is permeable, open at its edges. A baby’s cry at a classical music concert is usually a distraction, a noise, a bother. Cage lets it be part of the event, just as some modern painters have let the dust that settles on their canvases become part of the painting (a famous example is Marcel Duchamp, who let his Large Glass gather dust for months, then fixed a portion of it with varnish)."
canonical-instances:
  - "A live-streamed comedy show that scripts every joke spends constant effort suppressing hecklers and technical glitches as threats to the performance, while an improv-based show built to incorporate whatever happens in the room, hecklers included, turns the same disruptions into material, so nothing that occurs can actually derail it."
  - "A rigid project plan treats every unexpected client request as scope creep to be fended off, generating constant friction, while a project framework explicitly built around iterative, client-responsive design treats the same requests as expected input the process was built to absorb, eliminating the category of 'disruption' entirely."
critical-questions:
  - "Does absorbing all intrusion as content eventually dissolve the distinction between the work and its environment so completely that nothing remains identifiable as 'the piece' at all, and if so, at what point does boundary-dissolution stop being a clever solution and start being the loss of the thing being protected?"
  - "Is this move actually available to every kind of work, or does it depend on a genre, like Cage's experimental music, that has already built audience expectations flexible enough to accept absorbed disruption as art rather than as failure or incompetence?"
  - "Does absorbing disruption as content risk removing any incentive to prevent genuinely harmful intrusions, since a system designed to treat all disruption as valid content may struggle to distinguish a productive accident from one that actually damages the work?"
