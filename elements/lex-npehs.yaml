id: lex-npehs
name: the-more-convincing-the-decoy-the-harder-the-attacker-commits
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "A decoy's danger to whoever attacks it scales with how well it mimics the real target's surface -- the more completely the attacker believes it's real, the more force they commit, and that full commitment is what turns their own weapon against them. In Cushing's telling, a Locust escapes a Coyote's anger by building a body double engineered specifically to pass inspection: he splits his own back, crawls out, and finds 'a suitable quartz stone, which, being light-colored and clear, would not make his skin look unlike himself,' seals it into his empty skin with pitch, and leaves 'his exact counterfeit sticking to the bark.' The Coyote, certain he's facing the same Locust that has ignored his mounting threats, commits everything: 'making a quick jump, he snapped the Locust skin off of the bough, and bit it so hard that it crushed and broke the teeth in the middle of his jaw.' A half-convincing decoy invites a cautious, testing bite. This one invited his full weight, because nothing about it suggested he should hold back. Diagnostic move: when you build a decoy to absorb an attack meant for you, the fidelity of the substitution is not just camouflage -- it's what licenses the attacker's maximum commitment, and a decoy that's too obviously fake may cost you less by inviting a lighter, more survivable response."
