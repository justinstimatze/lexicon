lineage:
  - source: primary
    text: borges-1942-funes-the-memorious
    citation: "Jorge Luis Borges, \"Funes el memorioso\" (orig. *La Nación* 1942); collected in *Ficciones* (Buenos Aires: Sur, 1944); English translation in *Ficciones* (New York: Grove Press, 1962), tr. Anthony Kerrigan, pp. 107-115. Borges's narrator recounts the case of Ireneo Funes, a young Uruguayan whose head-injury from a horse-throw gave him perfect total memory of every sensory particular; the story is structured as a thought-experiment on what perfect memory PRECLUDES — namely, the abstraction that constitutes thought. Locke 1690 *An Essay Concerning Human Understanding* Bk.III Ch.III §4 had previously identified the same impossibility from the opposite direction (the impossibility of an individual name for each particular); Borges's contribution is the demonstration that perfect retention IS this impossibility instantiated in a person."
    quote: "Locke, in the seventeenth century, postulated (and rejected) an impossible idiom in which each individual object, each stone, each bird and branch had an individual name; Funes had once projected an analogous idiom, but he had renounced it as being too general, too ambiguous. In effect, Funes not only remembered every leaf on every tree of every wood, but even every one of the times he had perceived or imagined it. He determined to reduce all of his past experience to some seventy thousand recollections, which he would later define numerically. Two considerations dissuaded him: the thought that the task was interminable and the thought that it was useless. He knew that at the hour of his death he would scarcely have finished classifying even all the memories of his childhood. [...] He was, let us not forget, almost incapable of general, platonic ideas. It was not only difficult for him to understand that the generic term dog embraced so many unlike specimens of differing sizes and different forms; he was disturbed by the fact that a dog at three-fourteen (seen in profile) should have the same name as the dog at three-fifteen (seen from the front)."
  - source: cross-attestation
    text: cross-domain-forgetting-as-mechanism-of-abstraction
    citation: "Cross-domain attestation that the structural primitive — abstraction = lossy compression; forgetting particulars is constitutive of thinking in generalities — recurs across (a) philosophy of mind + epistemology, (b) empirical psychology of memory, (c) cognitive science + neuroscience of memory consolidation, (d) statistics + machine learning, (e) information theory + minimum description length, (f) expertise + chunking literature, (g) software engineering abstraction. SOURCES: John Locke 1690 *An Essay Concerning Human Understanding* III.iii.4 — \"if every particular Idea that we take in, should have a distinct Name, Names must be endless... if it were possible, would yet be useless\"; Friedrich Nietzsche 1874 *Vom Nutzen und Nachteil der Historie für das Leben* §1 — the man who could forget nothing would be unable to act; Henri Bergson 1896 *Matière et Mémoire* — attention to life as the filter that prunes pure memory; A. R. Luria 1968 *The Mind of a Mnemonist* — empirical case of Solomon Shereshevsky, whose synesthetic perfect memory disabled face-recognition + metaphor; Andrei Tikhonov 1943 + Arthur Hoerl + Robert Kennard 1970 ridge-regression on regularization; Stuart Geman + Elie Bienenstock + René Doursat 1992 bias-variance decomposition; Nitish Srivastava et al 2014 dropout in neural networks; Jorma Rissanen 1978 minimum description length; William Chase + Herbert Simon 1973 chess-expertise as chunking; Daniel Schacter 2001 *The Seven Sins of Memory* on memory's adaptive forgetting; Howard Eichenbaum 2004 on hippocampus-cortex consolidation; H. L. A. Hart 1961 *The Concept of Law* on rule-as-abstraction-from-case; Harold Abelson + Gerald Sussman 1985 *Structure and Interpretation of Computer Programs* on data abstraction."
    quote: "Across Locke 1690 (the impossibility of individual names for each particular), Nietzsche 1874 (the necessity of forgetting for life and action), Bergson 1896 (attention to life as the filter on pure memory), Luria 1968 (the empirical case of Shereshevsky: perfect memory disabling face-recognition + abstraction + metaphor), Tikhonov + Hoerl-Kennard regularization (explicitly discarding training-fit for generalization), Geman-Bienenstock-Doursat 1992 (formalizing the bias-variance tradeoff Funes embodies), Srivastava et al 2014 dropout (forcing lossy representations during training to produce generalization), Rissanen 1978 minimum description length (pure memorization = description equals data = worst hypothesis), Chase-Simon 1973 chess-expertise (masters see fewer chunks at higher abstraction, not more pieces), Schacter 2001 + Eichenbaum 2004 (the brain's architecture implements gist-extraction by pruning episodic detail), Hart 1961 *Concept of Law* (legal rule abstracts from particular case-facts), and Abelson-Sussman 1985 SICP (every abstraction discards information about the underlying system and that discarding is what makes the abstraction useful), the same structural primitive recurs: ABSTRACTION REQUIRES DISCARDING; forgetting is constitutive of thought, not its failure."
canonical-instances:
  - "Funes (Borges 1942): perfect memory of every leaf at every angle of every tree, every cloud at every dawn, leaves Funes unable to use the generic term `dog` because the same name across two views is intolerable to him; he projects but abandons an idiom with an individual name for each particular as `too general, too ambiguous`."
  - "Shereshevsky (Luria 1968 *The Mind of a Mnemonist*): the journalist S. memorized lists of arbitrary syllables in minutes + retained them for decades + struggled to recognize faces (each angle was a different face) + struggled with metaphor (the abstraction layer required collapsing differences he could not collapse); the empirical replication of Funes."
  - "Locke 1690 *Essay* III.iii.4: \"if every particular Idea that we take in, should have a distinct Name, Names must be endless... if it were possible, would yet be useless.\" The same diagnosis Borges puts in Funes's mouth, two and a half centuries earlier."
  - "Nietzsche 1874 *On the Use and Disadvantage of History for Life* §1: the man who could forget nothing (the historical man taken to the limit) would be unable to act + unable to live; forgetting is constitutive of life + thought, not their failure."
  - "Bergson 1896 *Matière et Mémoire*: pure memory would retain all of the past in its singularity; attention to life prunes it to what is useful for present action; the filter is constitutive, not lossy-by-accident."
  - "Statistical regularization (Tikhonov 1943, Hoerl-Kennard 1970 ridge regression): explicitly discards model-fit on training data in exchange for generalization to new data; the bias-variance decomposition (Geman-Bienenstock-Doursat 1992) formalizes the tradeoff Funes embodies."
  - "Dropout in deep learning (Srivastava-Hinton-Krizhevsky-Sutskever-Salakhutdinov 2014): forces lossy representations by randomly zeroing activations during training; the discarding is what produces generalization."
  - "Minimum description length (Rissanen 1978): the best hypothesis for a body of data is the one that minimizes the sum of the description-length of the hypothesis + the description-length of the data given the hypothesis; pure memorization (description = data) is the limit case + the worst hypothesis."
  - "Expert chunking (Chase-Simon 1973 chess studies): masters do not see more pieces than novices; they see fewer chunks at higher levels of abstraction. The expert has forgotten the individual pieces by absorbing them into patterns."
  - "Hippocampus-cortex consolidation (Schacter 2001 + Eichenbaum 2004): episodic detail is gradually pruned during memory consolidation + the abstract gist is retained in cortex; the brain implements the Funes-corrective in its architecture."
  - "Software abstraction (Abelson-Sussman 1985 SICP; Hickey 2011 simple-made-easy): every abstraction discards information about the underlying implementation + that discarding is what makes it composable; leaky abstractions (Spolsky 2002) are the failure-mode where the discarding was incomplete."
  - "Case-law to rule (Hart 1961 *Concept of Law*): the legal rule abstracts away from the particular facts of any single case + the practitioner who could not perform that abstraction would be paralyzed by every new case; common-law systems institutionalize the Funes-corrective via doctrine + ratio decidendi."
critical-questions:
  - "What is being discarded by this abstraction + is the discarding key for the work the abstraction is doing?"
  - "Could the same generalization survive without discarding what is being discarded? If yes, the discarding may be premature."
  - "Is the system producing brittle outputs because it is over-retaining particulars (Funes failure) or under-learning (insufficient data)? These have opposite fixes."
  - "What would Funes do here — would the all-particulars view make the work harder or impossible?"
  - "Is the abstraction being treated as if it were the underlying particulars + therefore making leaky-abstraction-style mistakes?"
