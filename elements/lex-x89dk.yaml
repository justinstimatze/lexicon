id: lex-x89dk
name: setting-satire-in-a-mythic-past-shields-criticism-of-the-present
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Directing sharp criticism at a real, present institution can be dangerous, but the same criticism becomes sayable, and even celebrated, once it's attached to a legendary figure acting in a distant, mythic past that will never return, because the storyteller can always retreat to the claim that they're just telling an old story, not accusing anyone real. Radin makes this function explicit when explaining why the Wakdjunkaga cycle can attack the chieftainship, the warbundle ritual, and puberty fasting so directly without consequence: 'What we really have here is something equivalent to certain semi-religious mediaeval performances where the participants feel that no harm can come to them and where they can pretend to themselves that they cannot be accused of sacrilege or of ridiculing the traditionally accepted order. After all, they can contend that it is about Wakdjunkaga they are speaking and about things that happened in a distant age that will never return. We have here, in short, an outlet for voicing a protest against the many, often onerous, obligations connected with the Winnebago social order and their religion and ritual.' The critique lands on the actual institutions Winnebago people lived under, but the deniability comes entirely from the setting: nobody living is being named, and the events supposedly happened too long ago to be about anyone in the room. Diagnostic move: when you need to voice real criticism of a present institution or authority without directly attacking it, consider whether framing the same criticism as a story about a legendary figure in a distant, unreturnable past lets the substance of the critique land while the deniability of the frame protects you from the consequences direct criticism would carry."
