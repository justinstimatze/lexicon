id: lex-985tt
name: a-new-institutions-need-for-legitimacy-front-loads-legible-practical-wins
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a newly founded institution's early output looks skewed toward whatever is externally legible and quickly demonstrable -- even in a way its own members would not necessarily choose if left alone -- consider that the skew may be a legitimacy-seeking artifact of the institution's youth rather than a stable preference or a genuine change in underlying need. A new institution has not yet earned the trust of the patrons, funders, and public whose continued support it depends on, so it has a standing incentive to front-load whatever kind of output proves its worth fastest and most visibly, independent of what its own considered judgment would otherwise prioritize. Once the institution's standing is secure, that skew should recede on its own, not because the underlying case for the deprioritized work changed, but because the institution no longer has to keep proving itself to outsiders. Merton's case: having tabulated a heavier orientation toward practical, economically-useful research in the Royal Society's earliest years and a rising share of 'pure science' later, he offers a specific institutional explanation rather than assuming interests simply changed: 'it is probable that at the outset the members of the Society were anxious to justify their activities (to the Crown and the lay public generally) by obtaining practical results as soon as possible; therefore, the initially marked orientation toward practical problems.' Diagnostic move: before treating a young institution's early priorities as a stable revealed preference, ask whether they were shaped by a legitimacy deadline it doesn't yet have to meet -- and predict that the priorities will shift once trust is banked, even if nothing about the institution's mission or its members' underlying interests has changed at all."
