id: lex-hk3c3
name: reveal-genuine-secret-intelligence-to-manufacture-an-appearance-of-omniscience
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you have a genuine information advantage over people whose trust or fear you want to command, don't use it only for the direct tactical purpose it was gathered for -- deploy pieces of it publicly and theatrically, in ways ordinary means couldn't explain, so the audience concludes you have a power well beyond what real intelligence-gathering could produce. Kautilya's prescription for a conqueror wanting to demonstrate 'pervasive knowledge' lists specific moves, each built on real information obtained through mundane means but presented without revealing the means: 'letting his chiefs know that he is aware of their domestic affairs and secret activities [having found out about them through secret agents]; unmasking traitors, having first found them out through secret agents employed for that purpose; revealing that someone was about to make a request for a favour having ascertained that through unnoticed contacts, prior knowledge or signals; and revealing knowledge about foreign countries before it becomes public, having got [from agents] a secret sealed communication through homing pigeons.' Every example follows the same two-step structure: first, do the ordinary, explicable work of intelligence-gathering (spies, informants, courier pigeons); second, present only the output -- the surprising, specific, personal knowledge -- while concealing the mundane process that produced it, so the audience's only available explanation is something supernatural. This is distinct from lying outright, since every fact revealed is true and independently verifiable -- the manipulation is entirely in what's withheld (the ordinary method) rather than in what's claimed. Diagnostic move: when you've gathered real, verifiable information through unglamorous means and want to build outsized authority or fear from it, resist the urge to explain how you know -- reveal the fact itself, timed and framed to look inexplicable, and let the audience supply their own, more impressive explanation for how you could possibly know it."
