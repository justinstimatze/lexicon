evokes: [radin-winnebago-hare-cycle, hare-and-the-frog, i-will-find-your-scent-with-dogs, he-saw-a-little-frog]
lineage:
  - source: primary
    text: radin-a-frog-bluffs-hare-with-an-empty-tracking-threat
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 17. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "One night something came outside of Hare's lodge and sang: 'You who live with your grandmother, wherever you go I will trail you with dogs and crush you in my mouth.' 'Oh, grandmother, we are in a bad fix! Now we shall surely die,' said Hare. 'Only if we hide between the reed mattings will we be able to save ourselves.' ... 'You who live with your grandmother, if you hide between the reed matting I shall find your scent with dogs,' it sang. ... But the being said: 'If you go up to the sky, I will find your scent with dogs.'; Then Hare got angry and went outside and looked around the lodge but could see nothing. So finally he asked his grandmother whether she knew where the being was who was speaking and she answered, 'Over in that direction.' He looked in the direction she mentioned and there he saw a little frog. 'So it is you? How come you to speak in such a fashion?' he said and smashed it with his club."
canonical-instances:
  - "A small landlord threatens a tenants' group that any attempt to organize, whether filing a complaint, contacting the city, or withholding rent, will result in eviction, and the tenants spend weeks devising workarounds before someone actually checks the local tenant-protection law and finds the landlord has no legal ability to follow through on most of it."
  - "An online account sends escalating threats claiming it can track a critic's location no matter what privacy settings they change, and the critic tries progressively more extreme countermeasures before eventually checking and finding the account has no actual technical capability behind any of the claims, only a willingness to keep making them."
critical-questions:
  - "Would Hare have identified the frog sooner if he hadn't been busy generating new hiding places, and does the story suggest that the act of proposing solutions itself delayed the moment he might have simply investigated the source?"
  - "Is there a meaningful difference between a threat that defeats your specific proposed countermeasures and one that makes a vague, unfalsifiable claim to always find you, and does the frog's specificity, naming exactly what Hare just suggested, make the bluff more or less convincing than a generic threat would have been?"
  - "Does this diagnostic risk making someone dangerously overconfident against a threat that turns out to be real, and how would a person in the moment distinguish a frog's empty bluff from a genuine threat that simply sounds similarly confident?"
status: active
