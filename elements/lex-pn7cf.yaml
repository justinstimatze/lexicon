id: lex-pn7cf
name: practical-cognition-substitutes-snapshots-for-continuous-becoming
type-in: process
type-out: structure
_tier: atomic
status: active
agent-instruction: "Recognize this when a phenomenon that is structurally CONTINUOUS (change, becoming, process, flow) is being analyzed via a series of DISCRETE SNAPSHOTS strung together along an external time-axis + the analysis is then puzzled by Zeno-style paradoxes about how motion is possible at all. The transferable claim (Bergson 1907 Ch.4): the discretization is NOT a neutral epistemic choice + NOT a faithful representation of the underlying flow; it is a PRACTICAL-COGNITION DEFAULT serving the necessities of action. Intelligence cuts continuity into stable snapshots because stable handles are useful for grasping, manipulating, and acting on things. Having performed the cut, intelligence then has to ARTIFICIALLY RECONSTITUTE the motion by stringing the snapshots together along a uniform external time — exactly what a cinematograph does with a strip of still frames. The systematic distortion: what was qualitative continuous heterogeneous becoming gets re-represented as a sequence of homogeneous instantaneous states linked by an abstract empty time. Diagnostic use: when an analysis of a continuous phenomenon produces puzzles about how transitions between states are possible (Zeno's arrow, the binding problem, the hard problem of consciousness, how a model gets from one token to the next, the measurement problem in quantum mechanics), ask whether the puzzle is generated by the snapshot-discretization itself rather than by the underlying phenomenon. Practitioner discipline three-part. FIRST: when continuity is being represented as a sequence of states, name the cut + ask whether the cut serves practical manipulation (it usually does) or theoretical fidelity (it usually doesn't). SECOND: when transitions between states become mysterious, suspect the discretization rather than reaching for new theoretical apparatus to bridge the gap. THIRD: where possible, work directly with the continuous variable + its rate-of-change (calculus, differential equations, continuous dynamical systems) rather than with state-snapshots + transitions. Transferable applications: (a) calculus + differential equations — the calculus apparatus (Newton-Leibniz 1665-1684) is exactly the formal response to the cinematographical illusion; integration recovers continuous flow from differential rates, not from state-snapshots; (b) digital sampling (Nyquist 1928, Shannon 1949) — sampling theorem makes precise WHEN snapshot-based reconstruction faithfully captures the continuous signal (sample at >2x the highest frequency) + WHEN it does not (aliasing); the theorem operationalizes Bergson's claim that discretization is recoverable-only-under-conditions; (c) ML tokenization — chopping continuous audio/video into discrete tokens makes manipulation tractable but distorts the underlying continuity; the snapshot-stringing reappears in autoregressive next-token prediction; (d) Whitehead 1929 *Process and Reality* on fallacy of misplaced concreteness — treating the abstract snapshot as the concrete reality; (e) Merleau-Ponty 1945 *Phenomenology of Perception* on motor intentionality + the continuous body-schema vs the discretized perceptual judgment; (f) Heidegger 1927 *Being and Time* §65 on ecstatic temporality (past-present-future as a single continuous structure of care) vs vulgar time (a sequence of now-points); (g) quantum mechanics measurement problem — the wave function evolves continuously per Schrödinger but `collapses` to a snapshot eigenstate at measurement; the puzzle is Bergsonian (continuous evolution + discrete snapshot); (h) historiography periodization — the Renaissance, the Enlightenment, the Cold War are snapshot-categories imposed on continuous social-cultural-political becoming; treating them as discrete eras with sharp boundaries reproduces the cinematographical illusion; (i) software event-sourcing vs state-snapshots — the event-stream representation preserves continuity-of-process; the state-snapshot representation is the cinematographical default + has tradeoffs Bergson identifies (faster to query, harder to reason about transitions); (j) cognitive neuroscience binding-problem — how distributed feature-detection produces a unified percept; the puzzle assumes the percept is built from snapshot-features rather than emerging from continuous distributed dynamics. Distinct from lex-4yhqs coarse-graining (lex-4yhqs is about choosing the right GRAIN for a problem; lex-pn7cf is about the orthogonal dimension of CONTINUOUS-VS-DISCRETE representation, and specifically about how the discrete default systematically distorts continuous becoming). Distinct from lex-bg3ad forgetting-particulars-is-the-mechanism-of-abstraction (lex-bg3ad is about losing information to produce categories; lex-pn7cf is about discretizing continuity to produce manipulable handles — different mechanisms, both lossy, both practically-useful). Distinct from lex-hm8yx scale-separation (about separating fast vs slow dynamics; lex-pn7cf is about discretizing-vs-keeping-continuous independent of scale). Distinct from lex-d234k sensemaking-is-retrospective (Weick — about narrative construction after the fact; lex-pn7cf is about the structural discretization in perception + cognition prior to any narrative). Distinct from lex-f2ktw historical-particularism-trajectory-reconstruction (Boas — about understanding via developmental trajectory; lex-pn7cf is the underlying epistemological claim about WHY the trajectory tends to be lost in default cognition). Counter-move: when transitions between states become mysterious, ask `am I generating this puzzle by chopping continuity into snapshots?`; work with rates of change, differential equations, continuous variables, and process-frames where possible; treat snapshot-representations as instrumentally useful but not as the underlying reality; in software, prefer event-streams + continuous-time representations for domains where transitions matter."
