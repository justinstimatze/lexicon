id: lex-n6rfc
name: a-live-environmental-contrast-lets-a-child-correct-a-parent-without-confrontation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Someone who wants to correct a family superior's temperament, but can't risk a direct confrontation out of filial respect, can use a real-time environmental coincidence as an object lesson instead of narrating a story or making an accusation. Nobody says a word about the actual target. The event in front of everyone does the correcting. In the Jataka's tale of the two birdcalls, a king wants to correct his shrewish mother's harsh temperament but won't openly rebuke her. When a courtly crowd audibly recoils from a harsh-voiced jay and dotes on a sweet-voiced cuckoo, he seizes the moment: 'The Bodhisatta, noting these two things, thought that here was a chance to drop a hint to the queen-mother.' Nobody watching heard him criticize her. They just watched two birds make his point for him."
related: []
evokes: [jataka, tikanipata, sujata-jataka, a-live-environmental-coincidence-delivers-a-correction-a-direct-rebuke-couldnt, correcting-upward-in-a-hierarchy-through-what-is-happening-not-what-is-said]
lineage:
  - source: primary
    text: jataka-chalmers1895-sujata-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book III (Tikanipata), No. 269, Sujata-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The Bodhisatta, noting these two things, thought that here was a chance to drop a hint to the queen-mother."
canonical-instances:
  - "An adult child who can't directly criticize a parent's harsh tone with the grandchildren waits until a family gathering where a cousin's gentler approach visibly gets a better reaction from the kids, then simply remarks on how well that approach worked, letting the parent draw their own comparison."
critical-questions:
  - "Does this method actually work if the queen-mother never makes the connection between the birds and her own behavior, or does the king's plan depend on a level of self-recognition he has no way to guarantee?"
  - "Is waiting for a naturally occurring coincidence a reliable strategy, or does it mean someone stuck without a convenient live contrast has no equivalent option available to them at all?"
status: active
