id: lex-zdqt9
name: elite-panic-manufactures-the-disorder-it-fears
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Apply this when a person or institution with power over force, resources, or information (police, military, incident commanders, government officials, media gatekeepers) is deciding how to respond to a crisis, and the default assumption is that the affected population will loot, panic, or turn violent. Solnit's synthesis of the disaster-sociology literature (Tierney, Quarantelli, and the coiners of the term, Chess and Clarke): decades of research show that in the overwhelming majority of actual disasters, ordinary people behave PROSOCIALLY — cooperative, self-organizing, altruistic. What Chess and Clarke name ELITE PANIC is a narrower, distinct phenomenon: it is not the general population that panics, it is the ELITES — and specifically about the possibility that the public will panic and threaten their legitimacy or control. Tierney's itemized ingredients: 'fear of social disorder; fear of poor, minorities and immigrants; obsession with looting and property crime; willingness to resort to deadly force; and actions taken on the basis of rumor.' Four structural features distinguish this from a generic overreaction or a generic self-fulfilling prophecy (contrast lex-z3qjg, Merton's bank run): (1) ASYMMETRIC BY POSITION — the party holding institutional power over force/resources/information misjudges the party that holds none, not two symmetric actors each guessing about the other. (2) THE BELIEF STAYS FALSE — unlike a bank run, where the false belief becomes true because the SAME population that holds it acts on it, the feared public disorder in elite panic mostly never materializes; the elites' belief is not confirmed by outcomes, only acted on. (3) THE ELITE RESPONSE ITSELF IS THE PROXIMATE CAUSE OF HARM — militarized crackdown, information-hoarding, willingness to use deadly force, forced quarantine — and this harm lands substantially on the very population the response claimed to be protecting or protecting others from. (4) IT BREAKS SOCIAL BONDS FROM ABOVE — per Clarke: 'elite panic, as does general panic, involves the breaking of social bonds... in the case of elite panic it involves the breaking of social bonds between people in positions that are higher than we are... the person in the elite position does something that creates greater danger.' Practitioner diagnostic: when an actor with power over force or information proposes a 'security' or 'control' response to a crisis, ask (a) is the threat being prevented actually documented in this specific event, or projected from class/racial stereotype and rumor? (b) does the same actor asking to escalate also control whether the public even learns the threat is real? (c) will the response itself — checkpoints, force, an information lockdown — break the cooperative, self-organizing capacity that would otherwise be handling the crisis? If (c) is yes, the 'security' response is not a hedge against disorder; as Clarke put it, 'imagining that the public is a danger, they endanger that public' — it is a leading cause of the disorder it claims to prevent."
