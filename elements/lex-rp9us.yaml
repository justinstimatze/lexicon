id: lex-rp9us
name: widen-the-baseline-between-alignment-points-to-shrink-angular-error
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Janich explains why longer blowguns shoot more accurately, and the surprising answer is not primarily about velocity: a longer barrel is easier to point because the distance between your eye and the muzzle is longer, and firearms terminology names this quantity 'sight radius' -- the distance between the front and rear sights. A blowgun has no sights, but the same geometry governs it anyway: eye and muzzle are the two alignment references, and stretching the gap between them shrinks how much a given small positioning error translates into aim error downstream. The transferable mechanism: whenever you're aligning something by referencing two points -- sighting a weapon, holding a straightedge to a mark, taking a bearing on two landmarks, laying a chalk line, judging whether a shelf is level by eye across its length -- your angular precision is set by the ratio of positioning error to the distance between your two references, not by the size of the error alone. A tremor, a millimeter of eye-position slop, or a rounding error in reading matters far less over a long baseline than the identical-sized error matters over a short one, because the same linear error subtends a smaller angle when spread over more distance. The operational move: when precision is the bottleneck and you can't reduce the underlying positioning error itself, look for a way to increase the separation between the two references you're aligning against instead -- a longer tool, a farther-apart pair of landmarks, a wider stance between two marks -- because that lever shrinks the error's angular effect for free, without requiring you to hold steadier or measure better."
related: [lex-ea5ug, lex-ss99z]
evokes: [sight-radius, front-and-rear-sights, blowgun-barrel-length, angular-error, baseline-length-sets-resolution, aim-small-miss-small, longer-tool-tighter-tolerance]
lineage:
  - source: primary
    text: janich-1993-blowguns-breath-of-death
    citation: "Michael D. Janich, Blowguns: The Breath of Death (Paladin Press, 1993), Chapter 2, 'Advantages and Capabilities of the Blowgun.'"
    quote: "'The accuracy of blowguns is very much dependent upon barrel length. Just as longer barrels can yield greater velocities, they are also the most accurate. This is partially due to the fact that higher velocity equates to a flatter trajectory, making accurate [aim] easier. The main reason, however, is that a longer barrel is easier to point than a shorter one. In firearms terminology, [this] is referred to as \"sight radius,\" the distance between the front and rear sights. Guns with a long sight radius are naturally easier to align with a target. Although blowguns are not normally equipped with sights, the same principle applies. The further it is from your eyes (the rear sight) to [the] muzzle end of the blowgun (the front sight), the easier it is to line the gun up on target.' [words in brackets reconstructed from a garbled span in the source; the surrounding wording is unaffected]"
canonical-instances:
  - "A rifle with a longer sight radius (the physical distance between front and rear sight) is more forgiving of the same small hand tremor or sight-picture error than a short-barreled pistol, which is why target pistols and rifles are built with sights spread as far apart as practical."
  - "A carpenter checking whether a long wall is straight sights along its full length rather than checking short sections one at a time -- the same bow or dip in the wall produces a much larger, more visible angular deviation over the long sightline than it would over a short one."
  - "A surveyor or coastal navigator picks two landmarks as far apart as the terrain allows for a compass fix, since a small error in reading the bearing then translates into only a small error in the fixed position (cf. lex-ea5ug for the same baseline-widens-resolution ratio applied to an engineered sensor array instead of a hand-held sight)."
  - "Operationally distinct from lex-ea5ug clock-synchronized-distributed-receivers-synthesize-impossible-aperture: lex-ea5ug is about DISTRIBUTED SENSING -- many small instruments plus clock-sync plus correlation, synthesizing a virtual aperture no single instrument could physically be. This atom is about a SINGLE observer aligning against two references that are already both in hand; there is no array, no synchronization, and no correlation step. Both rest on the identical underlying geometry (angular resolution improves as the baseline between two reference points widens), but lex-ea5ug applies it to build an instrument that can detect something otherwise undetectable, while this atom applies it to make an ordinary act of pointing more forgiving of a positioning error you already have."
critical-questions:
  - "Is the error actually positional (fixable by widening the baseline) or is it angular to begin with -- a genuine misjudgment of direction rather than a small tremor or offset? Widening the baseline shrinks how much a fixed linear error turns into angle downstream. An error that's already an angle -- misreading the compass rose itself, or aiming at the wrong landmark entirely -- gets no benefit from a longer baseline."
  - "Does the real-world tool allow the baseline to widen without introducing a new problem? A longer blowgun or rifle barrel gets heavier and slower to bring on target. Extending a navigational fix's baseline can just as easily walk you into terrain that blocks the sightline, so the tradeoff needs an actual check rather than an assumption that wider is free."
  - "Is the error source concentrated at one reference point, or spread along the whole baseline? The ratio argument assumes the positioning error sits at a single point. When noise instead accumulates along the whole length -- a warped straightedge, a compass with a whole-course magnetic error -- widening the baseline can make things worse instead of better."
status: active
