name: relieving-acute-desperation-can-create-an-irreversible-worse-trap
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An improvised action taken to escape acute desperation can solve the immediate problem completely while creating a new, worse, and irreversible one in its place — because the desperation crowded out any consideration of what happens after the immediate need is met. In the Jataka's tale of the trapped king, a desperately thirsty king fleeing a lost battle finds a well with no rope, improvises a line too short to reach the water, and simply drops the rest of the way to drink: 'So down he dropped, and drank his fill; but he could not get up again, so he remained standing there in the well.' The thirst is solved entirely. The well he chose to solve it in has no exit."
