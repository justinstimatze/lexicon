    citation: "Peter Taylor, The Thirty-Six Stratagems: A Modern-Day Interpretation of a Strategy Classic (Infinite Ideas, 2013), Stratagem 26, 'Point at the mulberry tree while cursing the locust tree.' Verified verbatim against a direct pdftotext extraction of the held copy."
    quote: "To discipline, control, or warn others whose status or position excludes them from direct confrontation, use analogy and innuendo. When names are not used directly, those accused cannot retaliate without revealing their complicity."
canonical-instances:
  - "the 'Grass-Mud Horse' meme and other coded euphemisms used on the Chinese internet to criticize censorship or officials without naming them directly — a well-documented phenomenon that lets critics avoid direct confrontation while forcing targets into the same silence-or-self-outing trap."
critical-questions:
  - "Does this mechanism require an audience of onlookers who can draw the intended inference, or does it fail entirely in a private exchange where no one else is watching to register the accusation?"
  - "Can the targeted party escape the trap by responding to the surface-level content of the analogy itself, treating it as genuinely unrelated, rather than either staying silent or objecting as if it were about them?"
