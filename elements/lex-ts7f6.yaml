id: lex-ts7f6
name: give-each-part-its-own-locally-optimal-treatment-not-one-uniform-rule
type-in: situation
type-out: composition
_tier: atomic
agent-instruction: "When one uniform treatment applied to a whole object or process is fighting itself, stop looking for a single setting that works everywhere and instead let different parts get different, locally-optimal treatments. Altshuller names this Principle 3, 'Local Quality': 'a. Switching from a homogeneous structure of the object or environment (the outward effect) to a non-homogeneous. b. Different parts of the object should carry out different functions. c. Each part of the object should be placed in the conditions which are most propitious for its operation.' His worked case makes the tradeoff concrete: mine dust is suppressed by spraying water as a cone of droplets, and 'the finer the droplets the greater the effect in combatting dust, but fine drops form a mist which hinders work.' A single droplet size can't satisfy both demands at once — fine enough to catch dust, coarse enough not to fog the air. 'The solution: around the cone of fine drops is a layer of larger ones' — the spray isn't uniform at all; the core does the fine dust-catching work, and an outer shell of coarser drops does a different job (not fogging), each region locally optimized for what it needs to accomplish rather than both regions sharing one compromise droplet size. The mechanism generalizes past physical sprays: whenever a single parameter is being tuned to satisfy two demands that actually apply to two DIFFERENT regions, times, or subgroups of the object, the fix isn't to average the two demands into one mediocre setting — it's to recognize that the object doesn't need to be homogeneous at all, and to give each region the setting that's actually right for what it, specifically, has to do. Diagnostic move: when a single uniform parameter (temperature, pricing, permission level, droplet size, response time) is being pulled toward two incompatible values by two different demands, check whether the two demands actually apply to two distinguishable parts, zones, time-windows, or user segments of the same system — if they do, stop searching for a compromise value and instead partition the system so each part receives its own locally-appropriate setting."
related: [lex-2vvck, lex-hkn3v, lex-mnxhs]
evokes: [local-quality-principle, mine-dust-water-spray-example, homogeneous-to-non-homogeneous, locally-optimal-not-globally-uniform]
lineage:
  - source: primary
    text: altshuller-1984-principle-3-local-quality
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.5 'Forty Basic Methods,' Principle 3 'The Principle of Local Quality.'"
    quote: "'3. The principle of local quality. a. Switching from a homogeneous structure of the object or environment (the outward effect) to a non-homogeneous. b. Different parts of the object should carry out different functions. c. Each part of the object should be placed in the conditions which are most propitious for its operation. Example: In order to combat dust in mine workings water is applied to the instruments (the working parts of the drilling and loading machinery) in the form of a cone of tiny drops. The finer the droplets the greater the effect in combatting dust, but fine drops form a mist which hinders work. The solution: around the cone of fine drops is a layer of larger ones.'"
canonical-instances:
  - "A subscription pricing team stuck choosing between a low price (to win price-sensitive small customers) and a high price (to capture value from large enterprise customers) stops looking for one compromise price point and instead segments the offering — a cheap self-serve tier and a separately-priced enterprise tier — giving each customer segment its own locally-appropriate price rather than one number that serves neither well."
  - "A software system's global timeout setting keeps being tuned between 'too short' (fails on slow, legitimate large uploads) and 'too long' (leaves users waiting on failed connections); the fix isn't a better single number — it's per-request-type timeouts, so large uploads get a longer window and small API calls get a short one, each optimized for its own actual demand."
  - "operationally distinct from lex-hkn3v escalate-a-vague-conflict-to-its-extreme-form-to-reveal-the-resolution: that atom sharpens a conflict statement to reveal a space/time/state SEPARATION for a single conflicted element; this atom addresses a system that's ALREADY structurally divisible into distinguishable parts or zones, and the fix is recognizing that divisibility rather than sharpening anything — the parts already differ, they just haven't been treated as if they do."
critical-questions:
  - "how finely should the object actually be partitioned — does 'give each part its own local treatment' risk fragmenting a system into so many locally-optimized pieces that the pieces no longer cohere, or that the overhead of managing many different settings exceeds what a single compromise setting would have cost?"
  - "how does someone identify which parts of a homogeneous-looking system actually have different needs, when the system's current uniform treatment may be actively obscuring that the needs even differ — is there a diagnostic for spotting hidden heterogeneity before defaulting to a single average setting?"
  - "does local-quality optimization ever conflict with a genuine need for uniformity elsewhere in the system — for instance, fairness, predictability, or simplicity of use — where treating different parts (or users) differently is itself a cost the uniform-but-mediocre approach didn't have?"
status: active
