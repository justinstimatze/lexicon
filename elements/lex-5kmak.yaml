id: lex-5kmak
name: shame-can-be-a-protective-instinct-not-only-a-childhood-injury
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Treating shame purely as psychological damage to be identified, worked through, and eliminated misses a second, older sense of the word in which shame functions as a protective instinct, closer to an animal's caution around danger than to a wound needing healing -- and collapsing the two senses into one makes the second kind of shame look pathological when it may be doing real protective work. Hyde names the gap directly: 'the current popular understanding of shame (as a sort of disability acquired in childhood) does not invoke fully enough the kind of recognition and caution this gift entails.' The Greek term aidos, often translated simply as 'shame,' carries a wider range: 'not only modesty, self-respect, and regard for others but, more important, reverence and awe. When you enter the grove of a god (or meet a prophet, poet, or king) these several feelings should rise as one: awe and reverence and the kind of inhibitory shame that keeps you from doing or saying anything profane or sacrilegious.' On this account the person entirely lacking aidos isn't liberated, they're exposed: 'the person who has no such aidos, the person who cannot sense the force fields of the spiritual world, is in danger, like an animal stripped of its protective instincts.' Hyde's reframe of the whole trickster-and-shame problem follows from this: 'the danger isn't really that shamelessness will destroy the cosmos, it's that the cosmos will destroy the shameless.' Diagnostic move: before treating an instance of inhibition, hesitation, or reticence purely as an internalized wound to be dissolved through exposure or reassurance, check whether it might instead be functioning as a working sensor for real social or situational danger -- the therapeutic move of eliminating shame-as-injury and the protective move of preserving shame-as-instinct require opposite responses, and mistaking one for the other leaves a person either needlessly stuck or genuinely unguarded."
