evokes: [merton-1957, the-american-soldier, legitimacy-narrows-comparison-range, rigid-but-legitimate-vs-mobile-but-contested, tocqueville-rising-expectations, dissatisfaction-tracks-comparison-not-deprivation]
lineage:
  - source: primary
    text: merton-1957-legitimacy-affects-comparison-range
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior,' in Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VIII, pp.267-268. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'imputations of legitimacy to social arrangements seem functionally related to reference group behavior. They apparently affect the range of the inter-group or inter-individual comparisons that will typically be made. If the structure of a rigid system of stratification, for example, is generally defined as legitimate, if the rights, perquisites and obligations of each stratum are generally held to be morally right, then the individuals within each stratum will be the less likely to take the situation of the other strata as a context for appraisal of their own lot. They will, presumably, tend to confine their comparisons to other members of their own or neighboring social stratum. If, however, the system of stratification is under wide dispute, then members of some strata are more likely to contrast their own situation with that of others, and shape their self-appraisals accordingly.'"
  - source: primary
    text: merton-1957-depressed-but-legitimate-less-dissatisfied
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior' (1957), same chapter, p.268, continuing after a footnote and page break."
    quote: "'the degree of dissatisfaction with their lot is often less among the people in severely depressed social strata in a relatively rigid social system, than among those strata who are apparently \"better off\" in a more mobile social system. At any rate, the range of groups taken as effective bases of comparison in different social systems may well turn out to be closely connected with the degree to which legitimacy is ascribed to the prevailing social structure.'"
canonical-instances:
  - "A rapidly developing economy with rising average incomes can see MORE visible unrest and complaint than a stagnant, poorer one — not because conditions are worse, but because rapid change and contested legitimacy widen the comparison range (people start comparing themselves to the newly-visible rich, or to their own recently-improved-but-still-behind position) in a way a stable, accepted hierarchy never invites."
  - "Employees at a company with a widely-accepted, transparent leveling system (clear, legitimate criteria for who's senior vs. junior) report less pay dissatisfaction at any given level than employees at a company with murky, contested promotion criteria — even when the transparent company's actual pay gaps between levels are larger, because contested legitimacy widens whose pay people compare themselves against."
critical-questions:
  - "Is legitimacy itself a stable property of a system, or does it partly depend on the same comparison-range mechanism recursively — i.e., can widening comparisons (through media, migration, information) itself erode a system's perceived legitimacy, making the mechanism self-reinforcing in the destabilizing direction once it starts?"
  - "Merton's mechanism explains reduced dissatisfaction under a legitimate rigid hierarchy — does it also imply that anyone actively trying to STABILIZE a stratified system has an incentive to suppress information that would widen comparison range, and if so, does recognizing that incentive change how comparison-range data (transparency initiatives, pay-equity disclosures) should be read?"
