lineage:
  - source: primary
    text: aristotle-c350bce-posterior-analytics-i3-regress-trilemma
    citation: "Aristotle, Posterior Analytics, Book I, Chapter 3, in The Organon, or Logical Treatises of Aristotle, trans. Octavius Freire Owen (Bohn's Classical Library, 1853), Vol. 2, pp. 249-253. Chapter 3 opens by naming and refuting two opposing errors about demonstrative science: that knowledge is impossible because first principles cannot themselves be demonstrated (the infinite-regress horn), and that knowledge is possible because circular demonstration is legitimate (the circularity horn). Aristotle's own position — that demonstrative science exists, but rests on an indemonstrable, immediately-known foundation — is the chapter's conclusion, defended by first showing that circular demonstration reduces, in its minimal three-term case, to the vacuous claim 'A is because A is.'"
    quote: "To some, because it is necessary that first things should be known, science does not appear to exist, but to others to exist indeed, yet they think there are demonstrations of all things, neither of which opinions is true or necessary. For those who suppose that knowledge does not subsist at all, these think that we are to proceed to infinity, as if we may not know things subsequent by things prior, of which there are no first, reasoning rightly, since it is impossible to penetrate infinites. And if they say we are to stop, and there are principles, these are unknown, since there is no demonstration of them, which alone they say is to know scientifically; but if it is not possible to know first things, neither can we know either simply or properly things which result from these, but by hypothesis, if these exist. Others however assent with respect to knowledge, for they assert that it is only through demonstration, but that nothing prevents there being a demonstration of all things, for demonstration may be effected in a circle, and things be proved from each other. We on the contrary assert, that neither is all science demonstrative, but that the science of things immediate is indemonstrable. And this is evidently necessary, for if it is requisite to know things prior, and from which demonstration subsists, but some time or other there is a stand made at things immediate, these must of necessity be indemonstrable."
  - source: primary
    text: aristotle-c350bce-posterior-analytics-i3-circular-demonstration-reduces-to-tautology
    citation: "Same chapter, continuing — Aristotle demonstrates that circular proof, however many terms it passes through, reduces at its logical core to the empty tautology 'A is because A is,' the argument that rules circularity out as a source of genuine knowledge."
    quote: "It is impossible to demonstrate in a circle simply, since demonstration must consist of things prior and more known... there happens to those who assert there is demonstration in a circle, not only what has now been declared, but that they say nothing else than this is if it is, and in this manner we may easily demonstrate all things. For when A existing, B necessarily is, and from this last C, if A exists C will exist; if then, when A is, it is necessary that B should be, but this existing, A exists (for this were to demonstrate in a circle), let A be laid down in the place of C. To say therefore that because B is A is, is equivalent to saying that C is, and this is to say that A existing C is, but C is the same as A, so that it happens that they who assert there is demonstration in a circle, say nothing else than that A is because A is, and thus we may easily demonstrate all things."
canonical-instances:
  - "The direct textual anchor: Aristotle rules out infinite regress and circular demonstration as sources of knowledge, forcing the conclusion that demonstrative science rests on indemonstrable, immediately-known first principles."
  - "A due-diligence chain in finance: asset X is valued based on comparable Y, Y is valued based on a discounted-cash-flow model whose discount rate is calibrated against market prices that were themselves set partly by trades in X — tracing the chain reveals it closes in a circle, and the apparent multi-step rigor is doing no more grounding work than simply asserting X's price is correct because X's price is correct."
  - "A bureaucratic authorization chain: policy A is justified by citing precedent B, precedent B was itself justified at the time by citing policy A's earlier draft — auditing 'why do we do it this way' by tracing the justification chain to its actual termination (rather than accepting the chain's length as evidence of rigor) exposes whether there is a real foundational reason or a closed loop."
critical-questions:
  - "how does this differ from lex-kxk99 (Rawls, principles-and-considered-judgments-mutually-adjust-until-coherent)? Rawls's reflective equilibrium is a considered, modern embrace of something structurally close to Aristotle's rejected circularity horn — principles and judgments are allowed to revise each other iteratively, with coherence rather than a fixed indemonstrable foundation as the terminus. Aristotle would resist this for DEMONSTRATIVE science specifically (his target: mathematics, syllogistic proof, domains where 'A is because A is' really is vacuous), while Rawls explicitly restricts his method to NORMATIVE domains (ethics, justice) where he argues both principle and judgment are genuinely revisable and no single fixed Archimedean point is available or even desirable. The two atoms mark opposing answers to structurally the same regress problem in different domains — engage both when a chain of justification is ambiguous about which regime (demonstrative-with-a-fixed-foundation, or normative-with-mutual-revision) it belongs to."
  - "how does this differ from lex-e7keg (Wierzbicka, a-small-universal-set-of-undefinable-meanings-grounds-all-definition)? lex-e7keg applies the identical regress structure — chains either loop circularly or bottom out in a non-further-decomposable stopping point — to DEFINITIONS of word-meanings specifically (Wierzbicka's own semantic primes), while this atom applies it to DEMONSTRATIONS of propositional claims (Aristotle's own domain, syllogistic proof). Notably lex-e7keg itself quotes Aristotle's parallel demand that a definition proceed 'through terms that are prior and more intelligible' — the two atoms trace to the same Aristotelian regress-diagnostic, applied to two different objects (what a word means vs. why a proposition is true). Use lex-e7keg when the chain in question is definitional; use this atom when the chain is justificatory or causal."
  - "how does this differ from lex-4ww6k (Lewis-Carroll regress on modus ponens)? lex-4ww6k's regress is narrower and more specific: it targets attempts to justify a single INFERENCE RULE (why does modus ponens work?) by adding the rule as an explicit premise, which just re-generates the need to justify the new, bigger inference. This atom's regress is about chains of PROPOSITIONS (why is this claim true?), not about justifying rules of inference themselves. lex-4ww6k's resolution (rules of inference are not premises, they are operations performed ON premises) is a different fix from this atom's resolution (some propositions are foundational and known without further demonstration) — the two regresses look similar on the surface but target different objects and resolve differently."
  - "does this atom claim every long justification chain is either infinite or circular or worthless? No — a long chain that genuinely terminates in a well-supported foundational premise is doing real epistemic work; length alone is neither vice nor virtue. The atom's diagnostic use is specifically to force the question 'where does this actually terminate, and is that termination point examined or merely assumed' — a chain can be long, sound, and non-circular, but the length itself provides no evidence of that; only tracing the actual termination does. The failure this atom targets is treating chain-length or intermediate-step-count as a substitute for checking the foundation."
