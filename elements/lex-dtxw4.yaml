    quote: "Let's just imagine this is Rhodes for a minute: and now--jump!"
canonical-instances:
  - "an interviewer facing an unverifiable 'great results at my last company' claim skips trying to confirm the past and hands the candidate a live problem to solve on the spot, converting an inaccessible boast into a checkable present performance."
critical-questions:
  - "Does this move only work for boasts that are genuinely performable on demand — physical feats, live skills — or can it be adapted to claims about past decisions, judgments, or knowledge that can't be re-enacted in the moment?"
  - "What happens when the person being challenged simply declines the demonstration — does refusing to jump function as an admission, or can a legitimate boast also reasonably decline an artificial staged test?"
