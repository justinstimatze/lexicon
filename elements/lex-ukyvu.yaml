id: lex-ukyvu
name: empathizing-with-someone-blocks-treating-them-as-purely-evil
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When you're trying to hold both a strict good-versus-evil view of someone and genuine empathy for their perspective, check whether those two postures can actually coexist rather than assuming you can simply combine them. Lakoff's account of Nurturant Parent morality's version of Moral Strength: real empathy means being able to see the world through another person's differing values as internally coherent from the inside, not just tolerating that they hold different values while still judging the values themselves monstrous. Once you're actually doing that -- modeling their moral logic well enough to feel why it makes sense to them -- you can no longer file them as an enemy to be demonized, because demonization requires treating their position as beneath understanding rather than as something you've just understood. This is why Nurturant Parent morality's version of Moral Strength can maintain external evils to be fought and internal weaknesses to be overcome, but cannot maintain a strict us-them dichotomy about people who simply hold different moral values -- the empathetic move that Nurturant Parent morality requires structurally forecloses the demonizing move that Strict Father morality's version of Moral Strength permits. Diagnostic move: when someone claims to fully empathize with an opponent while also treating that opponent as simply evil, check which of the two is actually happening -- the empathy is likely partial, stopping short of the values that would be uncomfortable to inhabit, or the demonization is a residual label that hasn't caught up with an empathy that has already undercut it."
related: []
evokes: [george-lakoff, moral-politics-1996, moral-strength, empathy, demonization]
lineage:
  - source: primary
    text: lakoff-1996-empathy-forecloses-demonization
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 6 'Nurturant Parent Morality,' section 'THE MORAL STRENGTH TO NURTURE.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Morality As Empathy and Nurturance requires that one empathize with and be nurturant toward people with different values than one’s own, including different moral values. This means that one cannot maintain a strict good-evil dichotomy. To be able to see the world through other people’s values and truly empathize with them means that you cannot see all people who have different moral values than yours as enemies to be demonized.”"
  - source: primary
    text: lakoff-1996-strict-father-demonization-comparison
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 5 'Strict Father Morality,' section 'MORAL STRENGTH.'"
    quote: "“The metaphor of Moral Strength thus imposes a strict us-them moral dichotomy. It reifies evil as the force that moral strength is needed to counter. Evil must be fought. You do not empathize with evil, nor do you accord evil some truth of its own. You just fight it.”"
canonical-instances:
  - "The direct textual anchor, on which evils survive the shift to a nurturant version of Moral Strength: 'There are external evils, dangers, and hardships and one must be strong to confront them' -- and the internal ones remain too, redefined as 'lack of social responsibility, selfishness, self-righteousness, narrow-mindedness' instead of weakness before temptation. What changes is who counts as the enemy: a whole class of people who merely hold different values exits the category entirely."
  - "Hypothetical: a negotiator preparing to sit down with a rival union spends a week genuinely trying to understand why the rival's leadership believes what it believes -- reading their internal memos, talking to their members, reconstructing the logic that makes their position feel obviously right from inside. By the time the negotiation starts, colleagues notice the negotiator has stopped describing the rival leadership as 'the enemy' in internal meetings, without ever announcing a change of heart. The empathy work itself dissolved the demonization; no separate decision to stop demonizing them was ever made or needed."
critical-questions:
  - "Lakoff's claim implies that empathy and demonization can't coexist, but people who study atrocities closely enough to genuinely understand the perpetrators' internal logic sometimes come away more convinced the acts were evil. Does deep empathetic understanding reliably block demonization, or does that only happen when the values turn out not to be monstrous after all -- leaving the mechanism silent on cases where understanding and condemnation deepen together?"
  - "If genuine empathy structurally forecloses demonization, that would make political dehumanization diagnostic of a specific failure: a refusal to actually model the other side's values from inside, rather than a separate moral failing layered on top of accurate understanding. Is dehumanizing rhetoric typically produced by people who have tried and failed to empathize, or by people who never attempted it, and does the mechanism's explanatory power depend on which one is more common?"
