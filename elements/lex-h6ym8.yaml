id: lex-h6ym8
name: a-visible-marker-makes-punishment-legible-without-explanation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Hanging a distinctive object on a wrongdoer is a public legibility device — it signals guilt and punishment to any observer instantly, without requiring anyone to explain what happened. In the Jataka's tale of Kaka, the cook's punishment includes exactly this kind of marker: \"The cook pulled out the crow's feathers and sprinkled him with flour, then piercing a cowrie he hung it on the crow's neck and threw him into a basket.\""
related: []
evokes: [jataka, chanipata, kaka-jataka, visible-marker-as-social-legibility, punishment-signaled-without-explanation]
lineage:
  - source: primary
    text: jataka-chalmers1895-kaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 395, Kaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The cook pulled out the crow's feathers and sprinkled him with flour, then.piercing a cowrie he hung it on the crow's neck and threw him into a basket."
canonical-instances:
  - "A workshop that catches someone stealing tools makes them wear a bright orange vest for the rest of the shift, not because the vest serves any practical purpose but because it instantly tells everyone on the floor what happened without a word being said."
critical-questions:
  - "Does a visible marker of punishment serve accountability, or does it mainly serve public humiliation once the underlying discipline has already been administered?"
  - "What happens to someone marked this way once the specific punishment ends — does the marker's legibility linger as a reputation the person can't easily shed?"
status: active
