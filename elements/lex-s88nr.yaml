id: lex-s88nr
name: mutual-irreplaceability-overrides-a-punitive-impulse
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Punishing a transgressor can cost more than the transgression did, if both the transgressor and the object of the transgression are too valuable to lose. Tolerance then wins on pragmatic grounds, regardless of what would feel more satisfying. In the Jataka's tale of the tolerant king, he discovers his most useful courtier having an affair with a woman he loves. Rather than destroying either of them, he's counseled with a metaphor: a shared resource doesn't become less itself for being drawn on by many. 'Out of the mighty river all creatures drink at will...the river's a river still.' Nobody claims the affair was harmless in this. Losing a valuable servant and a loved woman both, over an act neither can undo, simply costs more."
related: []
evokes: [jataka, dukanipata, pabbatupatthara-jataka, punishment-cost-exceeds-transgression-cost-when-both-parties-are-valuable, pragmatic-tolerance-over-a-satisfying-punitive-response]
lineage:
  - source: primary
    text: jataka-chalmers1895-pabbatupatthara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 195, Pabbatupatthara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Out of the mighty river all creatures drink at will: If she is dear, have patience--the river's a river still."
canonical-instances:
  - "A company founder discovers that its top-performing sales lead has been quietly interviewing with a competitor while still closing major deals, and rather than firing them on principle, decides the cost of losing both the revenue and the relationship outweighs the satisfaction of a clean, punitive break."
critical-questions:
  - "Is this advice actually pragmatic wisdom, or does it simply teach both the courtier and the wife that transgression carries no real cost as long as they're individually valuable enough — does tolerance here create an incentive problem the story doesn't examine?"
  - "Would the calculus change if the transgression were repeated rather than a single instance — does 'both parties are irreplaceable' justify tolerance once, indefinitely, or only until a pattern establishes itself?"
status: active
