id: lex-rhsrg
name: growing-troop-presence-outweighs-a-simultaneous-verbal-promise
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "An authority can send verbal assurances that a contested practice won't be interfered with, that the matter will simply be reviewed, while at the same time steadily increasing its visible armed presence nearby -- and the recipients can treat the growing buildup, not the verbal promise, as the credible signal of actual intent. Messengers bring word that the ghost dance 'must be looked into' and that the soldiers 'did not mean to take the dance away,' but Black Elk's people read past the words to the fact underneath them: 'Many soldiers were there now, and what were they there for?' The question answers itself; the buildup costs the sender something real to maintain and can't be talked back out of existence the way a promise can."
related: []
evokes: [black-elk-speaks, bad-trouble-coming, they-spoke-with-forked-tongues, many-soldiers-were-there-now, what-were-they-there-for]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch23-bad-trouble-coming
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 23, 'Bad Trouble Coming.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "There came to us Fire Thunder, Red Wound and Young American Horse with a message from the soldiers that this matter of the ghost dance must be looked into, and that there should be rulings over it; and that they did not mean to take the dance away from us. But could we believe anything the Wasichus ever said to us? They spoke with forked tongues. We moved in closer to Pine Ridge and camped. Many soldiers were there now, and what were they there for?"
canonical-instances:
  - "A landlord tells tenants a building's renovation won't affect their leases. Down the hall, eviction paperwork is already being quietly filed on other units, and once tenants learn of it, that paperwork is what actually drives them to organize."
  - "A company assures a newly acquired subsidiary's staff that no layoffs are planned, while simultaneously posting dozens of open roles at the parent company's headquarters, and the staff start job-hunting based on the postings rather than the memo."
  - "A neighboring country announces it seeks only a diplomatic resolution to a border dispute. Armored units are moving to the frontier at the same time, and it's the troop movements the bordering nation mobilizes its own reserves against, not the statement."
critical-questions:
  - "Is the buildup actually a reliable signal of hostile intent, or could a genuinely defensive or precautionary military presence look identical to an offensive one from the receiving side, making the inference less certain than it feels?"
  - "The verbal message came through three specific named intermediaries who may have had their own reasons for softening or distorting it -- is 'the soldiers said this' actually the same claim as 'the soldiers meant this,' or does routing the message through messengers already introduce the gap the buildup is being used to fill?"
  - "If the buildup and the reassurance turn out to both be true at once, review genuinely happening and soldiers stationed defensively, does treating the buildup as proof of bad faith foreclose a real possibility that the situation was as unresolved and ambiguous as the mixed signals suggest?"
status: active
