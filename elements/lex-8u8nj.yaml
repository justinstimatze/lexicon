canonical-instances:
  - "A startup with a single engineer who understands the entire payment system finds itself unable to take on a risky, potentially valuable refactor of that system, not because the refactor is a bad idea, but because if it goes wrong and that engineer is the only one who can fix it, the company can't afford the outage -- the constraint isn't a risk that has materialized, it's a decision the company can no longer make at all while that concentration persists."
  - "A family business run by an only child who is also the sole trained successor finds the parents unwilling to let that child take a demanding overseas assignment or a risky new venture, whereas a family with two capable children being groomed for succession can let one of them take a genuine risk, because the business's continuity no longer depends on that one person's safety."
critical-questions:
  - "does building redundancy into a critical function always genuinely restore freedom of action, or can it sometimes just relocate the constraint -- if the 'many sons' scenario still requires protecting all of them collectively to preserve the line's overall odds, has anything actually been freed up, or has a single hard constraint just become a softer, distributed one?"
  - "is there a point at which pursuing redundancy itself becomes costly enough (raising, training, or maintaining multiple instances of a critical function) that the freedom regained doesn't justify the ongoing investment, especially for functions where a single, well-protected instance might be cheaper overall than genuine duplication?"
  - "does the 'child about to be born' fallback reveal an assumption that even a not-yet-realized, probabilistic second instance meaningfully restores freedom of action -- how much actual freedom does a merely probable future backup provide compared to Kautilya's implicit ranking, versus how much might this be wishful accounting under genuine scarcity?"
