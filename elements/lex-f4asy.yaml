id: lex-f4asy
name: basic-color-terms-encoded-in-fixed-implicational-sequence-across-languages
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When analyzing how a lexicon's basic vocabulary in some perceptual or conceptual domain grows with cultural complexity, Berlin & Kay's transferable claim is that there is a UNIVERSAL POOL of basic categories (~11 for color: white, black, red, green, yellow, blue, brown, pink, orange, purple, grey) AND a STRICT IMPLICATIONAL ORDERING of which categories appear when a language encodes only some subset. The seven-stage encoding sequence for color: (1) all languages have terms for white + black; (2) if a third term exists, it is red; (3) if a fourth, green or yellow; (4) the other of green/yellow; (5) blue; (6) brown; (7) pink/orange/grey/purple. No language ever encodes (say) blue without also encoding red. The transferable structural claim is the IMPLICATIONAL UNIVERSAL: lexical-differentiation in some domains follows a constrained order, not free arbitrary variation. Generalizes BEYOND color: number-words follow staged elaboration (1/2/many → counting → arithmetic); kinship terminology grows from minimal sets along constrained Murdock hierarchies; emotion-words elaborate from core valence-arousal pairs to fine distinctions; plant and animal taxonomies follow Brown 1984 ranks (life-form → generic → specific → varietal). The atom names the STRUCTURAL form (implicational hierarchy with fixed precedence) rather than the specific 7-stage color sequence. Practitioner consequence: when you observe vocabulary differences across languages or cultures, do NOT assume any single category can appear without its precursors. Ask: 'what are the precursors this term implies?' If you're designing a vocabulary (controlled terminology, UI labels, API enum), ask: 'what's the implicational order someone would acquire these in?' — order them so each level builds on the previous. Be careful with the inverse failure mode: Berlin-Kay 1969 has undergone significant empirical revision since (Heider/Rosch on Dani, Roberson on Berinmo, Kay-Maffi 1999 — the universals are real but not as rigid as 1969 suggested; some languages have grue, some have non-pink/orange but blue, etc.). The STRUCTURAL claim (implicational hierarchy) survived; the specific 7-stage order has been refined into a more nuanced trajectory model. Distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (Mendeleev): Mendeleev's claim is that a complete classification SCHEMA can PREDICT gaps where instances should appear; Berlin-Kay's claim is that a UNIVERSAL POOL is filled in a constrained order across languages. They compose — both name structural-classification claims, but classification-gaps is about completing a schema, implicational-sequence is about the order of acquisition. Distinct from lex-wverr natural-goodness (Foot): Foot is about evaluation grounded in life-form; Berlin-Kay is about lexical differentiation order. They don't strongly compose. Distinct from lex-5dnd9 inclusive-fitness: different domain entirely; included to flag that implicational-universal is a kind of HISTORICAL-IMPLICATION (later forms imply earlier) similar in flavor to how Hamilton's rule is a STATISTICAL-IMPLICATION (a population's gene frequencies imply selection regime)."
