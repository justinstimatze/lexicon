evokes: [circulation-of-elites, pareto-trattato-1916, the-mind-and-society, lions-and-foxes, history-is-a-graveyard-of-aristocracies, residues-and-derivations]
lineage:
  - source: primary
    text: pareto-1935-mind-and-society-circulation-of-elites
    citation: "Vilfredo Pareto, *Trattato di sociologia generale* (1916); English: *The Mind and Society*, ed. Arthur Livingston, trans. Andrew Bongiorno + Arthur Livingston, Harcourt Brace & Co. 1935 (4 volumes). The substrate-claim has two coupled parts: (1) TURNOVER — every governing elite decays and is continuously replaced by capable individuals rising from below; an elite that closes itself to able newcomers falls ('history is a graveyard of aristocracies', §2053-2054, Vol 3). (2) TYPE-CYCLING — the governing elite oscillates between two psychological residue-types: the 'foxes' (Pareto's Class I residues: instinct for combination, innovation, cunning, speculation, persuasion) and the 'lions' (Class II residues: persistence, group-loyalty, willingness to use force). A regime strong in lion-conservatism gradually shifts toward fox-cunning as the governing class avoids violence by 'diplomacy, fraud, corruption' — selection then re-shapes the elite toward foxes who 'cannot use force when force is required' (§2178-2179, Vol 4); a catastrophe restores lion-types. The §2178 passage specifies the mechanism: when the governing class meets violence with cunning rather than counter-violence, recruitment selects for fox-residues and blackballs lion-residues. Pareto names this 'metamorphosis' of the ruling class as the recurring driver of regime cycles. Note vs the Italian-School reception captured in lex-s2pjj (Piano 2025): the substantive Pareto mechanism here is distinct from the later 'democratic elitism' caricature."
    quote: "[Pareto, *The Mind and Society* Vol 3 §2052-2055, on the TURNOVER claim:] '§2052. In the beginning, military, religious, and commercial aristocracies and plutocracies — with a few exceptions not worth considering — must have constituted parts of the governing elite and sometimes have made up the whole of it. The victorious warrior, the prosperous merchant, the opulent plutocrat, were men of such parts, each in his own field, as to be superior to the average individual. Under those circumstances the label corresponded to an actual capacity. But as time goes by, considerable, sometimes very considerable, differences arise between the capacity and the label; while on the other hand, certain aristocracies originally figuring prominently in the rising elite end by constituting an insignificant element in it. ... §2053. Aristocracies do not last. Whatever the causes, it is an incontestable fact that after a certain length of time they pass away. History is a graveyard of aristocracies. The Athenian \"People\" was an aristocracy as compared with the remainder of a population of resident aliens and slaves. It vanished without leaving any descent. The various aristocracies of Rome vanished in their time. So did the aristocracies of the Barbarians. ... §2054. They decay not in numbers only. They decay also in quality, in the sense that they lose their vigour, that there is a decline in the proportions of the residues which enabled them to win their power and hold it. The governing class is restored not only in numbers, but — and that is the more important thing — in quality, by families rising from the lower classes and bringing with them the vigour and the proportions of residues necessary for keeping themselves in power. It is also restored by the loss of its more degenerate members. §2055. If one of those movements comes to an end, or worse still, if they both come to an end, the governing class crashes to ruin and often sweeps the whole of a nation along with it. Potent cause of disturbance in the equilibrium is the accumulation of superior elements in the lower classes and, conversely, of inferior elements in the higher classes.' [Pareto, *The Mind and Society* Vol 4 §2178-2179, on the LIONS-TO-FOXES TYPE-CYCLING:] '§2178. ... 2. To prevent or resist violence, the governing class resorts to \"diplomacy,\" fraud, corruption — governmental authority passes, in a word, from the lions to the foxes. The governing class bows its head under the threat of violence, but it surrenders only in appearances, trying to turn the flank of the obstacle it cannot demolish in frontal attack. In the long run that sort of procedure comes to exercise a far-reaching influence on the selection of the governing class, which is now recruited only from the foxes, while the lions are blackballed. The individual who best knows the arts of sapping the strength of the foes of \"graft\" and of winning back by fraud and deceit what seemed to have been surrendered under pressure of force, is now leader of leaders. The man who has bursts of rebellion, and does not know how to crook his spine at the proper times and places, is the worst of leaders. §2179. So it comes about that the residues of the combination-instinct (Class I) are intensified in the governing class, and the residues of group-persistence (Class II) debilitated; for the combination-residues supply, precisely, the artistry and resourcefulness required for evolving ingenious expedients as substitutes for open resistance, while the residues of group-persistence stimulate open resistance.' [The transferable distillation: the type-cycling has a SPECIFIC MECHANISM Pareto names — the governing class's choice to meet violence with cunning IS what selects for fox-residues and erodes lion-residues; the mechanism is not random oscillation but a recruitment-feedback effect. The catastrophe-and-return-to-lions phase happens when fox-cunning fails to handle a threat that requires force, leaving the regime helpless and inviting overthrow by counter-elites who carry lion-residues.]"
canonical-instances:
  - "Pareto's lions and foxes (Trattato 1916): a governing class dominated by lions (force, tradition, loyalty, stability) progressively recruits foxes (cunning, financial manipulation, persuasion) who are better at the day-to-day arts of rule, until their inability to use force when needed precipitates a crisis, after which lion-types re-seize power. Governing style oscillates because each residue-type is good at what the other lacks"
  - "the closed aristocracy that falls (Pareto's 'graveyard of aristocracies'): an elite that stops circulating, refusing to absorb the most capable risers from below, accumulates decadent members at the top and capable resentful ones outside, and is overthrown or replaced. Healthy circulation (talent up, decadence down) preserves a ruling order; blocked circulation destroys it"
  - "Machiavelli's lion-and-fox prince (Pareto's acknowledged antecedent), and modern readings of revolving technocratic-vs-strongman governing styles: the same two-type oscillation recurs as a lens on why regimes that excel at manipulation later prove unable to coerce, and vice versa"
  - "operationally the PARENT social-cycle theory to the Turchin cluster: lex-dqa9j elite-overproduction-supplies-counterelites and lex-ky7un established-elite-closure-against-aspirants-forces-counterelite-organization are modern, mechanised descendants of Pareto's turnover claim. Pareto names the general law (elites circulate; blocked circulation kills the order); Turchin/Nefedov supply the demographic-structural engine (overproduction of aspirants + elite closure as the specific mechanism of blocked circulation and counter-elite formation). lex-qhydj is the ancestor frame; 0341/0345 are the operationalised modern forms"
  - "operationally distinct from lex-s2pjj self-definition-by-disavowing-a-caricatured-predecessor: lex-s2pjj (Piano 2025) is ABOUT the reception of Pareto/Mosca/Michels — how a discipline disavowed a caricature of them. lex-qhydj is Pareto's actual substantive MECHANISM (the circulation and type-cycling itself). They reference the same authors but name different things: 0282 is a meta-pattern about disciplinary identity; 0395 is the first-order social-cycle theory"
critical-questions:
  - "is the elite still CIRCULATING — absorbing the most capable risers and shedding decadent members — or has it closed? Pareto predicts that a closed elite, however entrenched it looks, is accumulating the conditions of its own fall (capable resentful outsiders, decadent insiders). Blocked circulation is the danger sign, not stability"
  - "which residue-type currently dominates the governing group — lions (force, tradition, cohesion) or foxes (cunning, manipulation, speculation)? Each is strong where the other is weak. A fox-dominated regime may be unable to use force when it must; a lion-dominated one may be unable to adapt. Predict the failure mode from the type imbalance"
  - "where are the capable people EXCLUDED from the elite, and are they organising? Pareto's turnover runs on talent denied entry at the top; counter-elite formation (cf. lex-dqa9j/0345) is the mechanism by which blocked circulation converts into replacement — locate the excluded talent to forecast the challenge"
  - "is an observed change of rulers a genuine circulation (new types and abilities entering) or a mere reshuffle within the same closed group? Pareto distinguishes real circulation from cosmetic turnover; only the former relieves the pressure that blocked circulation builds"
