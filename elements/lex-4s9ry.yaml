canonical-instances:
  - "Someone trying to quit doomscrolling deletes the apps and white-knuckles through the urge every evening (practice, no work on the underlying pull) -- the urge stays exactly as strong, and one bad night with the apps reinstalled undoes weeks of restraint. Pairing the same restraint with genuinely addressing what the scrolling was substituting for (boredom, loneliness, dread of a specific task) is the non-attachment half the practice alone never supplied."
  - "A manager who has a single cathartic conversation about no longer needing to control every decision (a non-attachment insight with no practice) finds themselves back to micromanaging within two weeks, because the insight was never consolidated into a repeated, deliberate habit of stepping back in specific recurring situations."
  - "Operationally distinct from lex-v2dps aesthetic-contemplation-as-will-less-knowing: Schopenhauer's will-less state is a temporary mode of perception entered during aesthetic contemplation of an object, valuable precisely because it is momentary and does not require sustained practice to enter. This atom's non-attachment is the opposite structurally -- a durable trait cultivated only through sustained practice over time, meant to persist outside any special contemplative occasion."
critical-questions:
  - "How do you tell genuine non-attachment (craving actually released) from mere avoidance or numbing (craving suppressed or displaced, not resolved)? The text's own test is whether will over the object remains intact while the thirst for it is gone -- avoidance usually removes engagement with the object entirely rather than leaving clear-eyed will over it, which is a different and less stable state."
  - "Is 'practice' here just willpower repackaged, and doesn't willpower-based habit change have a well-documented failure rate on its own? The atom's claim is specifically that practice-only approaches fail for a NAMEABLE reason -- the craving stays intact -- which is a falsifiable, checkable diagnosis rather than a restatement of 'try harder.'"
  - "Does this generalize outside contemplative/therapeutic contexts, where 'releasing craving' may not be a coherent instruction at all -- e.g., an organization trying to break a recurring process failure? The releasing-craving half may need translation (removing an incentive structure that rewards the old pattern) rather than literal non-attachment, and that translation is not supplied by this atom alone."
status: active
