lineage:
  - source: primary
    text: hyde-kingstons-mother-times-a-cautionary-tale-to-her-daughters-first-menstruation
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 7, '\"Speechless Shame and Shameless Speech,\"' quoting Maxine Hong Kingston's The Woman Warrior. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "‘You must not tell anyone,’ my mother said, ‘what I am about to tell you.’” The story that Kingston’s mother prefaced with this injunction to silence concerned an aunt back in China who bore an illegitimate child and, shamed by the village for her adultery, committed suicide, drowning herself and the baby in the family well. Kingston’s mother told her daughter this cautionary tale on the occasion of the girl’s first menstruation. “‘What happened to her could happen to you,’ she warned. ‘Don’t humiliate us. You wouldn’t like to be forgotten as if you had never been born. The villagers are watchful.’”"
canonical-instances:
  - "A father tells his teenage son a grim story about a friend who wrecked his life driving drunk, choosing to tell it the same week the boy gets his driver's license rather than months earlier or later, so the fear of that story is now permanently attached to the moment of getting behind the wheel."
  - "A new manager is told a cautionary story about a predecessor who was fired for a specific kind of decision, delivered in her very first week with signing authority rather than during general onboarding, ensuring that every future use of that authority carries an echo of the warning."
critical-questions:
  - "Does the threshold-timing actually do the causal work Hyde implies, or is it a plausible-sounding but unfalsifiable claim -- would the same story, told a month before or after the threshold, really install the boundary any less effectively?"
  - "Is there a meaningful cost to this technique beyond its effectiveness -- does permanently fusing a biological milestone like menstruation to a fear of shame and death cause harm that outweighs whatever protective or cohesive function the boundary serves for the family or community?"
  - "Could this pattern be exploited manipulatively by anyone who identifies a person's upcoming threshold moment and deliberately times a story to it, meaning the technique's power to install boundaries is morally neutral and available for both protective and coercive uses?"
status: active
