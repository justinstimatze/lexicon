id: lex-h3ud7
name: a-rule-that-forbids-looking-is-what-lets-the-exploiter-work-unseen
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When a group is invited into a shared activity and then given a rule that specifically forbids watching what's happening around them, treat the rule itself as the warning sign, not the activity it's dressed up as -- a legitimate shared ritual doesn't usually require participants to blind themselves, and a rule that does is functioning as cover for something the participants are meant never to see. In Zitkála-Šá's telling, Iktomi lures a circle of curious ducks into a sealed straw hut with the promise of hearing his songs, then sings the actual rule into being as part of the performance itself: 'With eyes closed you must dance. He who dares to open his eyes, forever red eyes shall have.' The ducks obey, and 'no duck dared blink a wink' -- and it is precisely inside that self-imposed blindness, enforced by a supernatural-sounding threat rather than any physical restraint, that Iktomi kills half of them one by one before a single duck named Skiska breaks the rule and discovers what's actually happening. The mechanism doesn't rely on force at all -- it relies on manufacturing a reason (participation in the ritual, fear of a stated consequence) for the victims to voluntarily disable the one thing that would let them notice harm occurring, and the harm only stops the moment someone violates the rule instead of trusting it. Diagnostic move: when you're asked to participate in something collective and told, as part of the activity's own rules, not to look, not to check, or not to verify what's happening to you or around you, treat that instruction as the actual threat rather than an incidental detail of the ritual -- and recognize that breaking the no-looking rule, however taboo it's been made to feel, is usually the only way anyone in the group finds out what's really going on."
