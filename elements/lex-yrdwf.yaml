id: lex-yrdwf
name: declaring-the-world-tool-like-explains-nothing-about-the-world
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone answers 'how can X grasp, describe, or reflect Y' by saying 'because Y is X-like,' recognize the answer as empty before accepting it -- run the same form again with a different X and watch what happens to the conclusion about Y. Popper's chain of examples exposes the trick. First the absurd control case: 'How can this mirror reflect my face?' -- 'Because it is face-like' -- obviously unsound, since a mirror's silvered glass has no facial features and 'face-like' just restates, in different words, that the mirror happens to reflect a face. Then the same form made seriously, by the physicist James Jeans: 'How can mathematics grasp the world?' -- 'Because the world is mathematics-like,' taken as grounds for concluding that reality is fundamentally mathematical, even mind-like. Popper's reductio is to keep running the identical form with a different tool substituted in: 'How can language describe the world?' -- 'Because the world is language-like -- it is linguistic.' 'How can the English language describe the world?' -- 'Because the world is intrinsically British.' Every substitution sounds locally plausible on its own and each one assigns reality a different, incompatible nature depending only on which descriptive tool happened to get plugged in. What actually explains descriptive success is more mundane than any of this: a richer language or symbolic system can express relationships a poorer one can't. A counting system limited to 'one, two, many' has no way to say 'nine, five more than'; arithmetic does. That difference is a fact about the relative richness of two languages, not evidence of some hidden mathematical essence sitting inside the world waiting to be matched. Diagnostic move: when an explanation has the shape 'X can reach Y because Y is X-like,' swap in a different X and see whether the supposed nature of Y changes with it. If it does, the explanation was never actually describing Y -- it was describing the tool, dressed up as a discovery about its object."
