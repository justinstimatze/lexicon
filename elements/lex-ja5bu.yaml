id: lex-ja5bu
name: preaching-a-virtue-one-lacks-extracts-resources-from-those-who-hold-it
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Someone can use the language of a shared value as the direct instrument for extracting resources from people who genuinely hold that value, not as camouflage for a separate act but as the actual mechanism of the theft. Lecturing true believers about their own principle shames them into handing over exactly what the extraction requires. In the Jataka's tale of the greedy monk, a monk visits monasteries and lectures resident brothers on contentment and non-attachment, then walks away with their possessions: 'he began to talk about the four classes of contented ascetics; laid hold of their garments, and made them pick up rags from the dust-heap; made them take earthen bowls, and give him any bowls that he fancied and their metal bowls; then he filled a cart with them, and carried them off to Jetavana.' The sermon wasn't cover for the theft. It was how the theft actually worked."
related: []
evokes: [jataka, tikanipata, samudda-jataka, invoking-a-shared-value-as-the-mechanism-of-extraction-not-its-cover, shaming-true-believers-with-their-own-principle-extracts-resources]
lineage:
  - source: primary
    text: jataka-chalmers1895-samudda-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book III (Tikanipata), No. 296, Samudda-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "When he visited a country monastery, and saw the brothers with their requisites all ready, he began to talk about the four classes of contented ascetics; laid hold of their garments, and made them pick up rags from the dust-heap; made them take earthen bowls, and give him any bowls that he fancied and their metal bowls; then he filled a cart with them, and carried them off to Jetavana."
canonical-instances:
  - "A traveling consultant lectures a nonprofit's staff on the virtue of frugality and doing more with less, then walks away having convinced them to donate their conference budget and equipment to his own for-profit venture, using their genuine commitment to frugality as the exact lever that moved the resources."
critical-questions:
  - "Does this tactic only work on people who genuinely hold the invoked value, meaning a target with no real commitment to contentment or non-attachment would simply be unmoved by the lecture?"
  - "Is there a meaningful difference between this and ordinary hypocrisy, where someone fails to live up to a value they preach, versus actively weaponizing a target's sincerity as the mechanism of a specific theft?"
status: active
