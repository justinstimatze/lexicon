lineage:
  - source: primary
    text: hyde-ifas-mock-funeral-reveals-eshu-as-destinys-true-intimate-not-its-opposite
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 5, '\"The God of the Crossroads,\"' recounting a Yoruba folktale about Ifa and Eshu. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Through the use of divining seeds, Ifa conveyed to men the intentions of the supreme god … and the meanings of fate. But Eshu strove to turn the Sky God’s meanings aside, so that events would take an unintended course. Ifa smoothed the road for humans, while Eshu lurked on the highway and made all things uncertain. Ifa’s character was destiny, and Eshu’s character was accident. In the same folktale we learn that these two who seem so much at odds are nonetheless the best of friends. To find out who were his true intimates, Ifa once staged his own mock funeral. False friends immediately appeared at the house, trying to get something for themselves from the estate; only Eshu was truly heartbroken and wanted nothing. It would seem that accident is fond of destiny, and uncertainty is certainty’s intimate companion."
canonical-instances:
  - "A company's most vocal internal skeptic, the one who constantly challenges the CEO's plans in meetings, turns out to be the only executive who stays through a genuine crisis and works unpaid overtime to save the company, while the visibly agreeable allies who never pushed back quietly start job hunting the moment the stock drops."
  - "A political leader who mostly clashes publicly with one particular rival discovers, when scandal threatens to end their career, that the rival is the only colleague who defends them honestly in private, while long-time public allies distance themselves the instant it becomes costly to be associated with them."
critical-questions:
  - "Is the mock-funeral test actually revealing a pre-existing hidden bond, or is it possible that staging a crisis creates new loyalty in the moment (Eshu rising to an unexpected occasion) rather than exposing an intimacy that was already there all along?"
  - "Does this pattern generalize beyond mythological or narrative contexts, where the test is staged, to real situations where a genuine crisis (not a staged one) reveals the same asymmetry between apparent allies and apparent opponents?"
  - "Could Eshu's grief be explained by something other than intimacy with Ifa specifically, such as Eshu's own character as chaos-agent finding genuine chaos (a death) moving regardless of whose death it is, meaning the test reveals something about Eshu's nature rather than about a specific bond between the two?"
