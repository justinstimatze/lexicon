id: lex-ekcht
name: a-decided-sabotage-hides-inside-the-language-of-rescue
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "Once a group has privately decided to be rid of a member, watch for the sabotage to arrive wearing the vocabulary of help -- the exact words used to reassure the victim can be the instructions for his destruction. In Cushing's telling, the Blackbirds tire of a Coyote they let join their flying dance: 'This fellow is a fool, and we must pluck him when he gets into the air. We'll fly so far this time that he will get a little tired out and cry to us for assistance.' When he does cry for help, the rescue is staged in full view of the victim: 'Catch hold of his wings; hold him up!' cried the old ones. And the Blackbirds flew at him; and every time they caught hold of him (the old fool all the time thinking they were helping) they plucked out a feather.' The Coyote never suspects the hands reaching for him, because the frame he's been given is rescue, and he trusts the frame more than he questions the sensation of each feather leaving his skin. Diagnostic move: when someone in visible distress within a group is 'helped' by members who have already, privately, decided the group would be better off without them, check whether the specific actions taken under the banner of assistance are actually the mechanism of harm -- the victim's trust in the frame is exactly what keeps them from noticing."
related: []
evokes: [help-staged-in-full-view-is-still-the-weapon, cushing-coyote-and-the-blackbirds, catch-hold-of-his-wings-hold-him-up, we-must-pluck-him]
lineage:
  - source: primary
    text: cushing-blackbirds-decide-to-pluck-the-coyote-mid-flight
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Coyote Danced with the Blackbirds.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'So the old ones whispered to one another: This fellow is a fool, and we must pluck him when he gets into the air. We'll fly so far this time that he will get a little tired out and cry to us for assistance. ... Help! help, friends, help! All right! cried the Blackbirds. Catch hold of his wings; hold him up! cried the old ones. And the Blackbirds flew at him; and every time they caught hold of him (the old fool all the time thinking they were helping) they plucked out a feather, until at last the feathers had become so thin that he began to fall.'"
canonical-instances:
  - "Coworkers who have privately agreed a struggling new hire should be pushed out volunteer to 'help' by taking over pieces of their workload right before a review, and the new hire, grateful for the assistance, doesn't notice until the review that the help has left them with nothing they can point to as their own contribution."
  - "A family that has decided an aging relative should move into care 'helps' by taking over their finances and errands one task at a time, each offer framed as relief from a burden, until the relative has no independent capacity left to contest the decision that was already made."
critical-questions:
  - "What would the Coyote have needed to notice, in the moment, to distinguish this rescue from a real one -- is there any observable difference between the two while it's happening, or does the fabrication only become visible in the outcome?"
  - "Does the tactic depend entirely on the victim having asked for help first, as the Coyote does by crying out, or could the same disguised sabotage be initiated by the group without waiting for a request?"
  - "Is there a meaningful difference between a group that decides in advance to harm a member and stages the help accordingly, versus a group whose genuine help turns out badly by accident -- how would an outside observer tell which one they were watching?"
status: active
