    quote: "Friend Boar, a pretty trick this! Were you not all besmeared with filth, I should have had your life this very day. But as it is, bite you I cannot, nor so much as touch you with my foot. Therefore I Spare your life."
canonical-instances:
  - "A tenant with no legal leverage against a landlord threatening eviction starts publicly and loudly documenting every code violation in the building to local inspectors, making the property itself a liability the landlord doesn't want inspected closely enough to force the eviction."
critical-questions:
  - "Does this tactic only work once, since a stronger party who learns the underlying trick can simply overcome its own fastidiousness the next time — and if so, is the boar's win permanent or a single-use exploit of a standard the lion could choose to abandon?"
  - "What made the lion's fastidiousness a hard constraint rather than a preference it could set aside under sufficient provocation, and does the tactic still work against a stronger party willing to tolerate the disgust if the stakes are high enough?"
status: active
