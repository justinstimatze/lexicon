id: lex-ggyt6
name: ethics-can-organize-self-formation-along-four-axes-not-code
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern when you are analyzing an ethical, normative, professional, religious, or cultural system and the live question is not 'what does the rule say' but 'what KIND of ethical work is this system actually asking a person to do' — especially when the system seems organized around self-cultivation, discipline, or a style of being rather than (or in addition to) a fixed table of permitted/forbidden acts. Foucault's own diagnostic move (Introduction to *The Use of Pleasure*, developing the chapter 'Morality and Practice of the Self'): 'morality' conflates at least two separable things — a MORAL CODE (the prescriptive set of values, rules, and interdictions transmitted by family, church, law, custom) and FORMS OF SUBJECTIVATION (the way an individual is called on to constitute themselves as the ethical subject who acts in relation to that code). The same code can support radically different subjectivations, and — his sharper, more useful claim — 'in certain moralities the main emphasis is placed on the code' and its enforcement (a 'quasi-juridical' form, sanctioned by an authority that penalizes infraction), while 'it is easy to conceive of moralities in which the strong and dynamic element is to be sought in the forms of subjectivation and the practices of the self,' with the code left 'rather rudimentary.' These are not two stages of moral development, one more advanced than the other — they are two different PLACES a given ethics can put its foundational weight, and Foucault reads classical Greek ethics of aphrodisia (sexual pleasure/conduct) as an unambiguous instance of the second kind, oriented toward askēsis rather than codification: 'moral conceptions in Greek and Greco-Roman antiquity were much more oriented toward practices of the self... than toward codifications of conducts and the strict definition of what is permitted and what is forbidden.' Within any subjectivation-heavy ethics, Foucault supplies a four-axis analytic scheme for what the self-work actually consists of — use these four as a checklist to decompose ANY ethical or normative system, ancient or modern: (1) ETHICAL SUBSTANCE — which part of the self is picked out as the PRIME MATERIAL of moral concern. Foucault's own example: the 'same' virtue-word, fidelity, can locate its substance in strict observance of the acts themselves, OR in the internal combat against desire and temptation, OR in the intensity/continuity/reciprocity of felt attachment to the partner — three structurally different ethical substances hiding under one word. (2) MODE OF SUBJECTION (mode d'assujettissement, chrēsis) — the way a person recognizes themselves as BOUND to the rule at all: because they belong to a group that holds it as custom, because they are heir to a tradition they must maintain, because a divine command requires it, because a rational principle demands it, or because they want their life to answer to an aesthetic ideal of brilliance or nobility. (3) FORMS OF ELABORATION / ethical work (travail éthique, enkrateia) — the concrete ASCETIC TECHNIQUES of self-work: memorizing and checking oneself against a systematic code, a sudden total renunciation, a sustained ongoing combat against desire (where the skirmishes themselves carry meaning), or a fine-grained hermeneutic decipherment of one's own desire. (4) MORAL TELEOLOGY (telos, sōphrosynē) — the KIND OF PERSON or MODE OF BEING the whole practice aims at: complete self-mastery, radical worldly detachment, tranquility of soul, or ritual purification toward salvation. Foucault's own summary formula: 'no moral conduct... without \"modes of subjectivation\" and an \"ascetics\" or \"practices of the self\" that support them' — every moral action implies delimiting a substance, fixing a relation to a precept, doing ascetic work, and aiming at a mode of being, and 'they do not differ any less from one morality to another than do the systems of values, rules, and interdictions' themselves. Foucault's own historical payoff (which this atom grounds specifically from Volume 2, *The Use of Pleasure* — he signals a three-volume plan extending the same method to Greek/Roman texts of the first two centuries CE in *Care of the Self* and to early Christian doctrine in *Confessions of the Flesh*, but only Volume 2's own content, on classical Greek aphrodisia, is quoted or claimed here): classical Greek ethics of aphrodisia is organized as an AESTHETICS OF EXISTENCE — 'those intentional and voluntary actions by which men not only set themselves rules of conduct, but also seek to transform themselves, to change themselves in their singular being, and to make their life into an oeuvre that carries certain aesthetic values and meets certain stylistic criteria' ('arts of existence,' 'techniques of the self') — rather than a code specifying permitted and forbidden acts; the four great domains of sexual austerity (body, wife, boys, truth) were, for the free Greek man, precisely the areas where he exercised his power and liberty without external prohibition, so the intensity of ethical concern there cannot be explained by interdiction at all — it has to be explained by stylization. USE THIS ATOM to (a) diagnose which of the four axes is actually decisive in a given ethical or professional code, especially when two systems appear to prescribe the 'same' virtue-word (integrity, discipline, fidelity, moderation, professionalism) while doing structurally different ethical work — one profession's 'integrity' might be a MODE-OF-SUBJECTION claim (you signed a code, you are bound by oath), another's might be an ETHICAL-SUBSTANCE claim (integrity names an inner quality of character you are cultivating, not a rule you are obeying) — so that an apparent agreement on values conceals a disagreement about STRUCTURE, not content; (b) read modern wellness, self-optimization, and 'personal growth' culture as a secularized, often etho-poetic (Foucault's own term, borrowed from Plutarch, for texts whose function is to 'shape themselves as ethical subjects') aesthetics of existence, structurally continuous with — not merely metaphorically like — the Greek model, distinct from a rule-obedience frame; (c) explain why two people who both claim to value 'discipline' can be doing incompatible ethical work: one's discipline is enkrateia in Foucault's ascetic sense (ongoing combat against desire, substance = the movements of the soul), the other's is code-compliance (substance = the acts themselves, checked against a rulebook) — same word, different substrate, and advice calibrated to one will misfire on the other; (d) analyze religious or philosophical traditions that explicitly de-emphasize codification (rudimentary rules, heavy self-cultivation apparatus) versus those that emphasize it (elaborate code, enforcement apparatus, quasi-juridical subjectivation), without treating the code-light tradition as merely permissive or undeveloped. DISTINCT FROM lex-jbegr (Aristotelian phronesis, practical wisdom in particulars): phronesis operates at the level of a single deliberative act — the faculty that perceives what THIS situation calls for when a general rule and a particular case pull apart. This atom operates one level up: it is a classificatory scheme for how an entire ethical system organizes moral experience across substance/subjection/elaboration/telos, prior to and independent of any single act of judgment. Phronesis could in principle be the form of elaboration (axis 3) within a given ethics, or could be irrelevant if that ethics runs on code-compliance instead — the two atoms co-fire but answer different-altitude questions and should not be collapsed. DISTINCT FROM this substrate's Volume-1-derived Foucault atoms — lex-am8cj (the closet as a bidirectional disclosure double-bind), lex-fn2gx (paradigm-supersession-narratives obscuring unrationalized coexistence of models), lex-95qfv (biopower: modern power administers life at the population-statistical layer rather than deducting from it via sovereign right). All three ground *The History of Sexuality, Volume 1* (1976) and its central machinery — discourse, discipline, biopolitics, the repressive-hypothesis critique, power as productive rather than merely prohibitive at the level of POPULATIONS and DISCOURSES. This atom grounds Volume 2 (1984), written after Foucault's own well-documented pivot (his Introduction narrates the shift explicitly: he set out to write a third volume on the desiring subject, found the received 'hermeneutics of desire' inadequate, and 'reorganize[d] the whole study around the slow formation, in antiquity, of a hermeneutics of the self') from the analysis of power/knowledge/discourse at the population and institutional level to the analysis of ETHICAL SELF-FORMATION at the level of the individual subject's relation to themselves — a different object (the ethical subject constituting itself) and a different question (how is moral experience structured, not how is power exercised) from the Volume-1 cluster, notwithstanding the shared author and shared genealogical method. Do not use lex-95qfv's biopower frame to analyze an individual's ethical self-cultivation, and do not use this atom to analyze population-level statistical governance — they compose (a wellness regime, for instance, can be simultaneously biopolitical at the population layer, per lex-95qfv, and organized as an aesthetics-of-existence at the individual-subjectivation layer, per this atom) but they are not substitutes. FAILURE MODES: (a) treating 'self-styled/aesthetic' ethics as automatically more libertine or permissive than 'code-based' ethics — Foucault is explicit that Greek austerity around aphrodisia could be exceptionally demanding (moderation, self-mastery, even models of full abstinence), just not demanding via an enforced code; the axis that carries the weight is structure, not strictness; (b) treating the four axes as a rigid sequence that must be filled in the same order for every system, rather than a diagnostic checklist where any axis can be thin (rudimentary code, or a code-heavy ethics with little elaboration-of-self); (c) fabricating or importing content from *Care of the Self* or *Confessions of the Flesh* as if it were Volume 2's own textual claim — the trilogy structure is real and worth noting, but only Volume 2's treatment of classical Greek aphrodisia is grounded here; (d) collapsing 'ethical substance' into 'the rule' — the substance is what part of the SELF is worked on, not the content of the precept; two ethics can share an identical precept ('be faithful') while locating the substance in entirely different places."
related: [lex-jbegr, lex-95qfv]
evokes: [techniques-of-the-self, arts-of-existence, ethical-substance, mode-of-subjection, forms-of-elaboration, moral-teleology, aphrodisia, chrēsis-aphrodision, enkrateia, sōphrosynē, foucault-1984-use-of-pleasure, aesthetics-of-existence, code-based-vs-practice-based-ethics, etho-poetic, hermeneutics-of-the-self]
lineage:
  - source: primary
    text: foucault-1984-the-use-of-pleasure
    citation: "Michel Foucault, *The History of Sexuality, Volume 2: The Use of Pleasure* [*Histoire de la sexualité, tome 2: L'usage des plaisirs*] (Paris: Gallimard, 1984), trans. Robert Hurley (New York: Vintage Books, 1985/1990). The argument runs across the Introduction and Part One, Chapter 1 ('Aphrodisia'). In the Introduction, Foucault narrates his own pivot from a planned history of the desiring subject toward a genealogy of 'techniques of the self' / 'arts of existence,' and states the book's tripartite plan: this volume treats the problematization of sexual conduct in classical Greek culture of the fourth century BCE; *Care of the Self* treats the same problematization in Greek and Latin texts of the first two centuries CE; *Confessions of the Flesh* treats the formation of Christian doctrine on the flesh (only this volume's own content is grounded or quoted here). The chapter 'Morality and Practice of the Self' then draws the book's central methodological distinction: a 'moral code' (the prescriptive rules and values themselves) is separable from 'forms of subjectivation' (how an individual is called to constitute themselves as an ethical subject in relation to that code), and different moralities place their emphasis differently along this axis — some indispensable on the code and its juridical enforcement, others (Foucault argues classical Greek ethics of aphrodisia is one) crucial on self-practice and askēsis with a comparatively rudimentary code. Foucault then supplies a four-part analytic scheme for what that self-practice consists of: the ethical substance (what part of the self is the material of moral concern), the mode of subjection (how one recognizes oneself as bound to a rule), the forms of elaboration or ethical work (the ascetic techniques of self-work), and the moral teleology (the kind of person or mode of being aimed at). Chapter 1 ('Aphrodisia') then applies these four notions specifically to the Greek category ta aphrodisia (loosely, 'the works of Aphrodite'; the pleasures of the body), arguing that Greek moral reflection organized itself around a dynamics of force (how much one is 'carried away' by pleasure and desire) rather than an ontology of forbidden acts, objects, or forms."
    quote: "[Introduction, on 'arts of existence' / 'techniques of the self':] 'this problematization was linked to a group of practices that have been of unquestionable importance in our societies: I am referring to what might be called the \"arts of existence.\" What I mean by the phrase are those intentional and voluntary actions by which men not only set themselves rules of conduct, but also seek to transform themselves, to change themselves in their singular being, and to make their life into an oeuvre that carries certain aesthetic values and meets certain stylistic criteria. These \"arts of existence,\" these \"techniques of the self\"...' [Introduction, on the book's tripartite plan:] 'this volume, The Use of Pleasure, is devoted to the manner in which sexual activity was problematized by philosophers and doctors in classical Greek culture of the fourth century B.C.; Care of the Self deals with the same problematization in the Greek and Latin texts of the first two centuries of our era; lastly, The Confessions of the Flesh deals with the formation of the doctrine and ministry concerning the flesh.' [Chapter 'Morality and Practice of the Self,' on the ethical substance, using fidelity as the worked example:] 'They concern what might be called the determination of the ethical substance; that is, the way in which the individual has to constitute this or that part of himself as the prime material of his moral conduct. Thus, one can relate the crucial aspects of the practice of fidelity to the strict observance of interdictions and obligations in the very acts one accomplishes. But one can also make the essence of fidelity consist in the mastery of desires, in the fervent combat one directs against them, in the strength with which one is able to resist temptations... Alternatively, one can have it consist in the intensity, continuity, and reciprocity of feelings that are experienced vis-à-vis the partner, and in the quality of the relationship that permanently binds the two spouses.' [Same chapter, on the mode of subjection:] 'The differences can also have to do with the mode of subjection (mode d'assujettissement); that is, with the way in which the individual establishes his relation to the rule and recognizes himself as obliged to put it into practice.' [Same chapter, on the forms of elaboration:] 'There are also possible differences in the forms of elaboration, of ethical work (travail éthique) that one performs on oneself, not only in order to bring one's conduct into compliance with a given rule, but to attempt to transform oneself into the ethical subject of one's behavior.' [Same chapter, on the moral teleology:] 'Other differences, finally, concern what might be called the telos of the ethical subject: an action is not only moral in itself, in its singularity; it is also moral in its circumstantial integration and by virtue of the place it occupies in a pattern of conduct.' [Same chapter, summarizing all four and their necessity:] 'There is no specific moral action that does not refer to a unified moral conduct; no moral conduct that does not call for the forming of oneself as an ethical subject; and no forming of the ethical subject without \"modes of subjectivation\" and an \"ascetics\" or \"practices of the self\" that support them.' [Same chapter, on code-oriented vs practice-oriented moralities:] 'we should not be surprised to find that in certain moralities the main emphasis is placed on the code... in these conditions, the subjectivation occurs basically in a quasi-juridical form, where the ethical subject refers his conduct to a law... On the other hand, it is easy to conceive of moralities in which the strong and dynamic element is to be sought in the forms of subjectivation and the practices of the self. In this case, the system of codes and rules of behavior may be rather rudimentary.' [Same chapter, on classical antiquity's own orientation:] 'it seems clear, from a first approach at least, that moral conceptions in Greek and Greco-Roman antiquity were much more oriented toward practices of the self and the question of askēsis than toward codifications of conducts and the strict definition of what is permitted and what is forbidden... The accent was placed on the relationship with the self that enabled a person to keep from being carried away by the appetites and pleasures, to maintain a mastery and superiority over them... and to achieve a mode of being that could be defined by the full enjoyment of oneself, or the perfect supremacy of oneself over oneself.' [Chapter 1 'Aphrodisia,' on the book's four organizing Greek terms:] 'I will consider four notions that are often encountered in the reflection on sexual ethics: the notion of aphrodisia, through which one can grasp what was recognized as the \"ethical substance\" in sexual behavior; the notion of \"use,\" of chrēsis, which allows one to perceive the type of subjection that the practice of pleasures had to undergo in order to be morally valorized; the notion of enkrateia, of mastery, that defines the attitude that was required with respect to oneself in order to make oneself into an ethical subject; and lastly, the notion of \"moderation,\" of sōphrosynē, that characterized the ethical subject in his fulfillment. It should thus be possible to determine what structured the moral experience of sexual pleasures - its ontology, its deontology, its ascetics, its teleology.' [Part One, on austerity as stylization of liberty rather than commentary on prohibition:] 'These themes of sexual austerity should be understood, not as an expression of, or commentary on, deep and essential prohibitions, but as the elaboration and stylization of an activity in the exercise of its power and the practice of its liberty.'"
  - source: discovery-loop
    text: distinctness-audit-foucault-use-of-pleasure-four-axes-ethical-self-formation
    citation: "The closest existing substrate content is Foucault's Volume 1 material: lex-am8cj (Sedgwick's closet-as-bidirectional-disclosure-double-bind) and lex-fn2gx (Sedgwick's paradigm-supersession-narrative critique) both cite Foucault's discourse-and-silence machinery from Volume 1, and lex-95qfv grounds Foucault's own biopower argument that modern power administers population-level life through norms rather than deducting from it via sovereign right. All three operate at the level of populations, discourses, and institutions — Volume 1's territory — rather than at the level of an individual's relation to themselves, which is Volume 2's territory and the documented pivot in Foucault's own corpus that this atom's Introduction lineage narrates. Lex-0763's own canonical instances already cite Care of the Self as an example of biopolitical optimization recursing into ethical self-cultivation, so lex-95qfv anticipates rather than duplicates this atom; lex-95qfv is included in related as the compositional same-author neighbor across the power/ethics divide, and the two compose (a wellness regime can be biopolitical at the population layer and an aesthetics-of-existence at the individual-subjectivation layer simultaneously) without being substitutes. Lex-0216 (Aristotle's phronesis, practical wisdom in particulars) operates at a different altitude: a single deliberative act's case-reading faculty, rather than this atom's classificatory scheme for how an entire ethical system organizes moral experience across four axes prior to any single act of judgment; phronesis could function as the form-of-elaboration axis within a given ethics, or be irrelevant if that ethics runs on code-compliance instead. Only Volume 2's own text is quoted or claimed here; Volume 3 (Care of the Self) and Volume 4 (Confessions of the Flesh) are part of Foucault's stated trilogy plan but their content is not drawn on."
canonical-instances:
  - "Foucault's own worked example: 'fidelity' as a marital virtue-word can locate its ethical substance in strict observance of the acts (a code-compliance ethics), OR in the internal combat against desire and temptation (an ascetic-struggle ethics), OR in the intensity, continuity, and reciprocity of felt attachment to the partner (a quality-of-relationship ethics) — three structurally different ethics sharing one word, none of them wrong about what 'fidelity' means, all of them doing different ethical work."
  - "Classical Greek ethics of aphrodisia (Xenophon, Plato, Aristotle): a comparatively rudimentary code (no lists of licit/illicit acts or positions, no confessional decipherment of desire) paired with an intense apparatus of self-cultivation across four domains where a free man faced no external prohibition at all — the body (dietetics), the wife (household economics), boys (erotics), and truth (philosophy) — because the ethical stakes were in the STYLE and MASTERY of an already-permitted activity, not in policing a forbidden one."
  - "Two professional codes of ethics that both prescribe 'integrity': one binds members via a signed oath and disciplinary board (mode of subjection = institutional authority; ethical substance = compliance with enumerated conduct rules) while another frames integrity as a character trait cultivated through mentorship and reflective practice over a career (mode of subjection = aspiration to a professional ideal; ethical substance = the practitioner's inner disposition) — the same word, doing incompatible structural work, such that advice tuned to one professional culture will misfire when applied to the other."
  - "Modern wellness and self-optimization culture (fitness regimens, meditation practices, personal-development programs) read as a secularized aesthetics of existence: comparatively thin external code (no enforced rulebook, no punitive authority) paired with elaborate techniques of self-work — tracking, journaling, ritual practice — aimed at becoming a certain kind of person (disciplined, mindful, optimized), structurally continuous with Foucault's 'arts of existence' rather than merely metaphorically similar to it."
  - "Two people who both describe themselves as valuing 'discipline': one means enkrateia in Foucault's ascetic sense — an ongoing, sometimes-faltering combat against desire in which the struggle itself has meaning (ethical substance = the movements of the soul) — the other means code-compliance — checking behavior against an external rulebook (ethical substance = the acts themselves) — producing genuinely different practices under a shared vocabulary word."
critical-questions:
  - "Which axis is actually carrying the load here — is the ethical substance the acts themselves, the inner struggle, or the quality of feeling/relationship? Naming the substance directly (rather than accepting the virtue-word at face value) is usually where two apparently-agreeing parties turn out to disagree."
  - "Is this ethics cardinal on the CODE (rules, enumerated prohibitions, an enforcing authority) or on the FORMS OF SUBJECTIVATION (self-practice, ascetic technique, comparatively rudimentary rules)? Per Foucault, these are not stages of moral development — a code-light ethics can be exceptionally demanding; don't mistake 'few rules' for 'permissive.'"
  - "What is the mode of subjection — custom, inherited tradition, divine command, rational principle, or aesthetic ideal? Two people bound to the 'same' rule for different reasons are not doing the same ethical work, and a challenge that targets the wrong mode of subjection (e.g. arguing against divine command to someone bound by aesthetic ideal) will not land."
  - "Is a disagreement that presents itself as being about CONTENT (which acts are right or wrong) actually a disagreement about STRUCTURE (which of the four axes is doing the real work)? Reframing a content dispute as a structure dispute often dissolves apparent contradiction or reveals that no real engagement has occurred yet."
  - "Is this atom being used to analyze the individual subject's relation to themselves, or has it drifted into analyzing population-level statistical governance (which belongs to lex-95qfv's biopower frame instead)? The two compose but are not interchangeable — check which layer (individual ethical subjectivation vs population-level administration) the claim is actually about."
