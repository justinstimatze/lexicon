id: lex-hzfkp
name: upward-criticism-requires-repeated-demonstrated-non-punishment-first
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you ask subordinates for honest criticism of something you're responsible for, expect the default first answer to be reflexive reassurance rather than truth — and expect that only repeated, explicit invitation plus visible proof that past criticism went unpunished will get past it. Goss traces this in detail through a medical program's student-faculty luncheons: 'It was, of course, initially necessary for faculty members to convince the representatives that they were really interested in knowing student reaction to the Program, rather than in receiving a standard answer such as \"Everything's fine, sir.\" And, correlatively, before students expressed themselves freely they apparently needed to know that criticisms they might make in their role as representatives would not call forth reprisals — that the faculty would not regard criticisms of the Program as either personal affronts or indications of student maladjustment.' Getting past the reflexive answer took explicit, repeated verbal invitation from authority figures: 'during one of the first few luncheons, students were assured, for example, that \"we know not everything in the Program is going as smoothly as it could, and we want to improve where possible. You can help us by telling us how things look from the students' angle.\"' and, with a new cohort next semester, an even more pointed prompt: '\"What, you don't have any gripes? You're very unusual — your colleagues of last semester were full of them.\"' But invitation alone wasn't sufficient — it took an accumulated track record of safety: 'Through such statements, student-representatives came to realize that faculty members were indeed interested in their remarks concerning the Program, and that they were prepared to hear critical as well as favorable comments. Further, they learned through actually venturing negative comments that no punishment accrued as a result.' The sequence is: explicit verbal invitation, first, from someone with authority over the subordinate → a subordinate tests it with a real (not hypothetical) criticism → no retaliation follows → only then does the subordinate treat future honest criticism as safe. Each new cohort restarts the sequence; it does not transfer from one group of subordinates to the next merely because the policy is unchanged, since the new group has no personal track record yet — hence the faculty repeating the same reassurance ritual with each new semester's representatives. Diagnostic move: if you are getting suspiciously uniform positive feedback from people who report to you, don't conclude things are fine — check whether you have ever explicitly, repeatedly invited criticism AND whether anyone has actually tested that invitation with a real complaint and watched what happened to them afterward. Absent both, silence is the default, not evidence."
