canonical-instances:
  - The Japanese workplace pattern Galef names — the employee who stands out, even by performing well, attracts correction pressure that punishes the visibility itself, not the performance.
  - Australian tall-poppy syndrome — the cultural-norm word for the same pattern; high-achievers face active social pressure to be 'cut down to size' regardless of whether their achievement harms anyone.
  - Scandinavian Jante Law (Aksel Sandemose 1933) — explicit codification of the same pattern across ten commandments of 'do not think you are anything special'; structural mechanism identical to deru-kugi.
  - Russian 'высокая трава первая косится' / 'the tall grass gets mowed first' — same mechanism, different surface; cross-cultural attestation is the evidence of cognitive-fit.
  - American 'the nail that sticks up gets hammered down' — direct calque of the Japanese, used in U.S. business writing about conformity dynamics; the proverb traveled.
  - Academic suppression of heterodox results — visibility of the result attracts gatekeeping pressure (rejections, dismissive citations, career-damaging coordination against the author) often disproportionate to the substantive critique.
  - Social-media pile-on dynamics — the visible target attracts response disproportionate to the harm caused; visibility itself becomes the harm-coordinate.
  - Dialect leveling — distinctive linguistic features standardize out over generations as visibly-distinctive speakers face correction pressure from majority-dialect speakers.
  - The 'gray rock' interpersonal strategy for dealing with abusers — deliberately reducing one's visibility-as-distinct-target to reduce the abuser's deru-kugi response.
