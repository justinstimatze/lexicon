canonical-instances:
  - "Someone who has just been laid off starts describing the layoff as proof of their own failure, catches themselves mid-sentence, and redirects into compiling everything they learned into a guide they publish for other people facing the same situation."
  - "A researcher whose years-long project gets defunded starts listing everything the cancellation cost them, stops partway through, and instead spends the remaining transition time packaging the unfinished data and methodology for other researchers to pick up."
critical-questions:
  - "Is the speed of the reversal, within the same utterance, doing real diagnostic work here, or would the same shift from lament to constructive reframing count just as much if it took hours or days to arrive at?"
  - "Does immediately converting a loss into material for others risk skipping over a grieving process that might have real value on its own terms, and does the Wakdjunkaga cycle show any cost to how quickly he moves past the loss?"
  - "Would this reframe be available to someone whose loss has no obvious remaining material to redirect, or does the mechanism specifically depend on there being literal leftover pieces, as with Wakdjunkaga's penis becoming food plants, rather than a purely abstract loss?"
