id: lex-9pz2r
name: a-superior-alternative-instantly-strips-an-incumbents-status
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "The arrival of a genuinely superior alternative doesn't gradually erode a previously-overvalued incumbent's status — it can strip it completely and immediately, with the same audience that once prized the incumbent now abandoning it entirely and without transition. In the Jataka's tale of the crow in Baveru, when a trained, beautiful peacock is later brought to the same land, the crow is instantly abandoned: 'From the day of his coming, the gain and honour paid to the crow fell off. And no one wanted even to look at it. The crow no longer getting food either hard or soft, with a cry of \"Caw, caw,\" went and settled on a dunghill.'"
related: []
evokes: [jataka, catukkanipata, baveru-jataka, a-superior-alternative-collapses-an-incumbents-status-instantly, no-gradual-transition-once-genuine-comparison-becomes-available]
lineage:
  - source: primary
    text: jataka-chalmers1895-baveru-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 339, Baveru-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "From the day of his coming, the gain and honour paid to the crow fell off. And no one wanted even to look at it. The crow no longer getting food either hard or soft, with a cry of \"Caw, caw,\" went and settled on a dunghill."
canonical-instances:
  - "The only smartphone brand available in a market for years loses its entire customer base within weeks of a genuinely superior competitor's launch — loyal buyers who praised the incumbent as the best don't gradually drift away, they abandon it all at once."
critical-questions:
  - "Is the collapse actually about the peacock's superior qualities, or does novelty itself do most of the work here, the same way the crow's own initial prestige depended on being new rather than on any lasting virtue?"
  - "Does the crow deserve its fall — did it actually possess the 'ten evil qualities' the story attributes to it, or is even its downfall driven by the same shallow, comparison-free judgment that inflated it in the first place?"
status: active
