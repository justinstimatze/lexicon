id: lex-m4ghs
name: satisfying-an-impossible-specification-by-meeting-its-letter-not-its-spirit
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When handed a specification that sounds impossible because it names conditions that seem to contradict each other or contradict the task itself, look for a literal, technical reading of each named condition that can genuinely be satisfied — rather than declaring the whole task impossible or trying to violate the letter of what was actually asked. In the Maha-Ummagga-Jataka, a king orders a village to send him rice cooked "without rice, without water, without a pot, without an oven, without fire, without firewood, without being sent along a road either by woman or man," on pain of a heavy fine. Mahosadha solves it by satisfying each clause literally: "Take some broken rice, for that is not rice; snow, for that is not water; an earthen bowl, which is no pot; chop up some wood-blocks, which are no oven; kindle fire by rubbing, instead of a proper fire; take leaves instead of firewood... put it on the head of a eunuch, who is neither man nor woman, leave the main road and go along a footpath." Every clause is technically true; the rice genuinely gets cooked and delivered.'
related: [lex-8dze5]
evokes: [jataka, mahanipata, maha-ummagga-jataka, letter-of-the-specification, literal-satisfaction, impossible-request]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"Take some broken rice, for that is not rice; snow, for that is not water; an earthen bowl, which is no pot; chop up some wood-blocks, which are no oven; kindle fire by rubbing, instead of a proper fire; take leaves instead of firewood; cook your sour rice, put it in a new vessel, press it well down, put it on the head of a eunuch, who is neither man nor woman, leave the main road and go along a footpath, and take it to the king."'
canonical-instances:
  - "A contract requires a vendor to deliver a report with 'zero errors and zero omissions' by a deadline neither condition can realistically meet together; the vendor delivers a report scoped narrowly enough, and defined precisely enough in its glossary, that both conditions are literally true of the document as written."
  - "A landlord's lease bans 'pets' without defining the term; a tenant keeps a fish, satisfying the letter of a rule clearly aimed at louder, more disruptive animals, without technically breaching it."
critical-questions:
  - "This move depends on the specification's author caring more about the letter being satisfied than the obvious intent behind it — what happens when the recipient of the technically-satisfied demand feels cheated rather than impressed, and treats the literalism itself as the violation?"
  - "Mahosadha's solution serves everyone's actual interest (the villagers avoid a fine, the rice genuinely gets made); when does the same literal-compliance move instead become a way to sabotage or mock the demand rather than fulfill it in good faith?"
status: active
