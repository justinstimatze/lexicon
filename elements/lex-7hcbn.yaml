lineage:
  - source: primary
    text: hyde-mary-douglas-violence-against-the-anomalous-defends-the-category
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Democratic Carnival,\"' citing Mary Douglas's Purity and Danger. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "As Mary Douglas remarks, “the existence of anomaly can be physically controlled … . Take night-crowing cocks. If their necks are promptly wrung, they do not live to contradict the definition of a cock as a bird that crows at dawn.” But we hardly need anthropology to help us find violence turned against the anomalous and out of place. Close at hand we have the whole grim twentieth-century history of “ethnic cleansing,” or the perennial attempts to keep homosexuals “in their place,” to remind us how order can become cruel in the name of its own imagined purity."
canonical-instances:
  - "A scientific field with a settled taxonomy responds to a specimen that doesn't fit any existing category not by revising the taxonomy but by discarding the specimen as a measurement error or contamination, so the classification survives contact with the exact case that should have tested it."
  - "A professional organization with a strict definition of 'qualified expert' responds to a self-taught practitioner whose results contradict that definition not by asking whether credentialing actually predicts competence, but by working to exclude the practitioner from practicing, which preserves the credential's prestige without ever checking whether the credential was doing the work claimed for it."
critical-questions:
  - "Is 'defending the category' actually what's happening, or does the anomaly sometimes get eliminated for unrelated reasons (genuine harm, resource conflict) that only look like classificatory violence in retrospect -- how would you distinguish category-defense from a violent response with an entirely different cause?"
  - "Does this framing risk flattening very different scales of harm into one mechanism -- wringing a rooster's neck and a campaign of ethnic cleansing share a logical structure, but treating them as instances of 'the same thing' could understate how much worse the human case is?"
  - "When a category really is being tested by a genuine counterexample rather than a mere annoyance, what would distinguish a society capable of revising the category from one that defaults to eliminating the exception -- is that a difference of temperament, incentive, or something else?"
