id: lex-5ckqz
name: narrative-recurs-to-four-cyclical-plot-shapes-comedy-romance-tragedy-irony
type-in: composition
type-out: typology
_tier: atomic
agent-instruction: "Recognize this pattern when analyzing OR constructing any narrative — a novel, film, television series, personal story, myth, folktale, or even a corporate, political, or brand narrative — and asking which fundamental PLOT-SHAPE it is participating in, as distinct from asking what specific genre-label or medium it belongs to. Frye's claim, developed across the Third Essay of Anatomy of Criticism ('Archetypal Criticism: Theory of Myths'), is that beneath the enormous variety of individual genres there are exactly four 'narrative pregeneric elements... which I shall call mythoi or generic plots.' His own glossary crystallizes it: MYTHOS sense 2 is 'one of the four archetypal narratives, classified as comic, romantic, tragic, and ironic.' Each mythos is Frye's own chapter title, correlated explicitly with a phase of the seasonal/natural cycle: 'The Mythos of Spring: Comedy,' 'The Mythos of Summer: Romance,' 'The Mythos of Autumn: Tragedy,' 'The Mythos of Winter: Irony and Satire.' COMEDY is defined structurally as a movement from one society to another: 'the movement of comedy is usually a movement from one kind of society to another. At the beginning of the play the obstructing characters are in charge of the play's society, and the audience recognizes that they are usurpers. At the end of the play the device in the plot that brings hero and heroine together causes a new society to crystallize around the hero' — resolved by the comic anagnorisis/cognitio, typically solemnized by marriage or festival, and structured in ternary form: 'a stable and harmonious order disrupted by folly, obsession, forgetfulness... and then restored,' the restored society being MORE inclusive than the one it replaced (blocking characters converted rather than merely repudiated). ROMANCE is the adventure-quest: 'the complete form of the romance is clearly the successful quest, and such a completed form has three main stages: the stage of the perilous journey and the preliminary minor adventures; the crucial struggle... and the exaltation of the hero' — Frye's own Greek labels for these three stages are agon (conflict), pathos (death-struggle), and anagnorisis (discovery/exaltation). The romance hero is elevated toward the mythical/divine end of Frye's mode-spectrum and is explicitly mapped onto the cyclical poles of nature: 'the enemy is associated with winter, darkness, confusion, sterility, moribund life, and old age, and the hero with spring, dawn, order, fertility, vigor, and youth.' TRAGEDY is the fall of an exceptional individual OUT of society, not merely a sad ending: 'the tragic hero is typically on top of the wheel of fortune, halfway between human society on the ground and the something greater in the sky... the center of tragedy is in the hero's isolation, not in a villain's betrayal, even when the villain is, as he often is, a part of the hero himself.' Hamartia is reframed away from moral flaw and toward structural exposure: 'a condition of being, not a cause of becoming' — being an exceptional, isolated figure is itself what exposes the hero to the reassertion of natural law (nemesis). Tragedy's mythos is BINARY (provocation, then counterbalancing catastrophe) where comedy's is ternary. IRONY AND SATIRE diminishes the protagonist relative to the reader: structurally 'a parody of romance: the application of romantic mythical forms to a more realistic content which fits them in unexpected ways.' SATIRE is 'militant irony,' assuming clear moral norms and an object of attack, while pure irony withholds moral standard, leaving the reader 'not sure what the author's attitude is.' Frye's own cross-mapping ties each mythos to one of four Greek dramatic terms as its 'archetypal theme': 'Agon or conflict is the basis... of romance... Pathos or catastrophe... is the archetypal theme of tragedy. Sparagmos, or the sense that heroism and effective action are absent, disorganized or foredoomed to defeat... is the archetypal theme of irony and satire. Anagnorisis, or recognition of a newborn society rising in triumph... is the archetypal theme of comedy.' The CYCLICAL claim is as pivotal as the fourfold classification and must not be dropped: Frye states explicitly that the four mythoi are positions on a wheel, not an unordered list. 'There are thus four main types of mythical movement: within romance, within experience, down, and up. The downward movement is the tragic movement, the wheel of fortune falling from innocence toward hamartia, and from hamartia to catastrophe. The upward movement is the comic movement, from threatening complications to a happy ending.' The mythoi shade into their neighbors rather than standing as four hermetic boxes: 'comedy blends insensibly into satire at one extreme and into romance at the other; romance may be comic or tragic; tragic extends from high romance to bitter and ironic realism' — only the diagonal pairs (comedy/tragedy, romance/irony) genuinely contrast; the adjacent pairs blend. The wheel closes on itself: tracing fictional modes historically from myth through romance and increasing realism, Frye notes the sequence does not terminate in pure realism but curves back — those modes are 'a series of displaced myths, mythoi or plot-formulas progressively moving over towards the opposite pole of verisimilitude, and then, with irony, beginning to move back' toward myth again, the world comedy and romance inhabit. A work, genre, or even a single scene can therefore be read as participating in a mythos, transitioning between mythoi (a romantic comedy that darkens toward satire in its final act; a tragedy whose closing scenes tip into irony once the hero's fall completes and the wheel of fortune has fully turned), or blending two adjacent mythoi at once. The four are not a taxonomy applied to literature after the fact — Frye's explicit ambition is a structural grammar underlying all narrative, prior to and broader than any individual genre-label: 'are there narrative categories of literature broader than, or logically prior to, the ordinary literary genres? There are four such categories: the romantic, the tragic, the comic, and the ironic or satiric.' Distinct from lex-nr3kg (peripeteia-pursuit-mechanism-produces-the-aims-opposite) and lex-qfwuf (anagnorisis-recognition-reframes-the-meaning-of-prior-action), both grounded in Aristotle's Poetics: those atoms name STRUCTURAL DEVICES — a specific reversal-moment or recognition-moment that can occur WITHIN a single plot, tragic or otherwise, at a specific scene. This atom names a classification of the OVERALL SHAPE of an entire plot or genre — which of four cyclically-related plot-shapes a whole narrative (or a whole genre, or a whole scene considered as a microcosm) is participating in. The two levels compose rather than compete: Frye himself assigns anagnorisis as comedy's own archetypal theme and treats agon/pathos/sparagmos as the parallel archetypal themes of romance/tragedy/irony — so a scene's Aristotelian device (a recognition, a reversal) is often diagnostic of WHICH Frye-mythos the surrounding work belongs to, without the device itself being the mythos. Use lex-nr3kg/lex-qfwuf to name a moment; use this atom to name the shape the moment belongs to. Distinct from lex-h7vet (depart-trial-return-arc, grounding Campbell's monomyth via Homer/Propp): Campbell's claim is that there is ONE universal narrative pattern — departure, initiation (iterated trials), return-transformed — found cross-culturally in myth and hero-tales. Frye's romance mythos (agon-pathos-anagnorisis, the quest for a treasure/bride/kingdom) resembles this quest-structure closely and is its nearest neighbor, but romance is only ONE of Frye's four mythoi, not the whole scheme; Frye's actual claim is that there are FOUR distinct, cyclically-related plot-shapes, of which the Campbellian quest-journey maps onto only the summer phase. A depart-trial-return arc could equally be read, depending on how it ends, as instantiating romance (successful quest, hero elevated) OR sliding toward tragedy (the quest's failure, the hero's isolation and fall) OR irony (a quest revealed as illusory or degraded) — the monomyth names a SEQUENCE-SHAPE that can be filled by any of several mythoi; this atom names the mythos itself. Use this atom when: (i) diagramming a narrative's overall structure and asking which of the four cyclically-related shapes it enacts, rather than merely which genre-label it carries; (ii) tracking a work's TRANSITIONS between mythoi across its runtime (a story that opens in romance and ends in irony; a comedy whose blocking figure's defeat is played with enough menace to tip toward tragedy); (iii) analyzing constructed real-world narratives with the same grammar — screenwriting and story-structure work that names 'which mode is this scene in'; corporate narrative-framing, where a turnaround story is told in comedy's shape (a blocked, aging leadership regime displaced, a younger and more inclusive order restored, sealed with a public wedding-equivalent like a merger or IPO) versus a decline story told in tragedy's shape (an exceptional, isolated founder-figure destroyed by the very success that elevated them); political rhetoric that frames a candidate in romance's shape (questing hero versus a dragon-shaped opponent, ascending toward an idealized restored order) versus the ironic/satirical demystification that answers it by diminishing the same figure relative to the audience's own judgment; brand storytelling that borrows romance's or comedy's shape uncritically. Failure modes: (a) treating the four mythoi as an exhaustive four-box sort rather than a WHEEL — missing the blend at each seam (comedy/satire, comedy/romance, romance/tragedy, tragedy/irony) and the explicit non-blend of the two diagonals (comedy/tragedy, romance/irony); (b) collapsing mythos (the overall shape) into genre-label (comedy the stage-form) — Frye is explicit that 'comedy' names a structural mode usable far outside stage comedy, e.g. in Chaucer or Austen, just as a Dickens novel or a corporate turnaround story can be comedy-shaped without being a stage play; (c) confusing tragedy's hamartia with moral wrongdoing — this atom's tragedy-mythos turns on STRUCTURAL exposure (isolation at the top of the wheel of fortune), not on the hero's culpability; (d) missing that irony/satire is itself a PARODY OF ROMANCE, not an unrelated fourth thing — its structural debt to the mythos it demystifies is part of what defines it."
