canonical-instances:
  - "A sales organization publishes a commission structure before the quarter begins that pays disproportionately more for closing a large strategic account than for many small ones, so that individual reps -- who each have to decide in real time which lead to prioritize -- make choices that collectively support the company's actual growth priority, without a manager having to direct each decision."
  - "A bug bounty program publishes payout tiers before researchers start hunting, paying far more for a critical remote-code-execution vulnerability than for a minor cosmetic bug, so that independent researchers, working with no coordination among themselves, naturally direct their most serious effort toward the vulnerabilities that would actually matter most if exploited."
critical-questions:
  - "what happens when the announced reward ratios don't actually reflect true strategic value, whether through miscalculation or because value shifts once the effort is underway -- does a published, fixed schedule become a liability by locking in incentives that no longer match reality?"
  - "does a graduated reward schedule for identifiable individual achievements (like killing a specific named target) create perverse incentives -- fighters abandoning coordinated tactics or their assigned role to chase the highest-value individual target, undermining the collective effort the reward was meant to serve?"
  - "does publishing exact payout amounts risk revealing strategic priorities to the opposing side, who could then take extra measures to protect precisely the highest-value targets the schedule identifies, partially defeating the purpose of announcing it?"
