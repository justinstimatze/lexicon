id: lex-k8bsd
name: outsider-within-standpoint-inside-access-without-membership
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When seeking accurate analysis of how a dominant group's institutions actually operate, attend especially to the perspective of those who are STRUCTURALLY OUTSIDE the dominant group (so they don't share its self-justifications or blind spots) but who have INSIDE ACCESS to its workings (so they observe its operations close-up rather than from public-facing facades). This 'outsider-within' position — Black domestic workers in white households, women in male-dominated professions, working-class students at elite universities, minority members of majority institutions — produces a distinctive angle of vision on the gap between the dominant group's self-presentation and its actual operations. The standpoint is not merely diversity-of-perspective; it is the specific structural product of inside-access-without-membership."
