id: lex-e2a2q
name: an-answer-technically-satisfies-the-question-while-denying-the-questions-category-any-truth
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'After thoroughly answering a question in the exact terms the audience wants, a respondent can close by explicitly denying that the category the question belongs to has any truth-value at all, technically satisfying the request while undercutting its own premise in the same breath. In the Jataka''s tale of Maha-Mangala, having spent twelve stanzas enumerating specific omens as requested, the sage''s final line withdraws the entire premise: "For in the omens is no truth at all."'
related: []
evokes: [jataka, dasanipata, maha-mangala-jataka, premise-dissolving-answer, socratic-subversion-of-a-questions-foundation]
