id: lex-k6d7u
name: credence-as-graded-belief
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When you find yourself saying 'X is true' or 'X is false', replace with 'I'm N% confident X is true'. Belief is graded; binary framing distorts the actual evidence and makes you over-commit."
related: [lex-znaau, lex-chp44, lex-hfcae, lex-2x8qw, lex-9eprx, lex-hrnuj, lex-vtytt, lex-dvydj, lex-rn9ht, lex-quu4s, lex-e5des, lex-x6sbv, lex-rfxtb, lex-m2cwp, lex-jy4aq, lex-th6tr, lex-c2bwy, lex-xhvgy, lex-j929z, lex-n6t4u, lex-j5kxw, lex-cpjma, lex-v6kmc, lex-mjav2, lex-v39j4, lex-39muf, lex-nn3u9, lex-zag9z, lex-zfbef, lex-2czcp, lex-vkhp7, lex-rwvkh, lex-gg87u, lex-x6ft6, lex-nx7u7]
scaffolds-from: [lex-rfxtb, lex-39muf, lex-j5kxw]
evokes: [bayesian-credence, dont-believe-or-disbelieve-quantify, calibrated-uncertainty, the-superforecaster-stance, replace-binary-with-graded]
lineage:
  - source: primary
    text: ramsey-1931-truth-and-probability
    citation: "Frank P. Ramsey, 'Truth and Probability' (1926), in The Foundations of Mathematics and other Logical Essays, ed. R. B. Braithwaite (Routledge, 1931), pp. 156-198. §(3) 'Degrees of Belief.' The foundational philosophical treatment of credence as graded belief measured by willingness-to-act, from which Bayesian epistemology derives its psychological interpretation. Ramsey defines degree of belief operationally via preference under uncertainty, not via introspection — establishing the behavioral/dispositional account."
    quote: "We are driven therefore to the second supposition that the degree of a belief is a causal property of it, which we can express vaguely as the extent to which we are prepared to act on it."
  - source: practitioner
    text: bayes-1763-essay
    citation: "Thomas Bayes (posthumous), 'An Essay Towards Solving a Problem in the Doctrine of Chances,' Philosophical Transactions of the Royal Society of London 53:370-418 (1763, communicated by Richard Price). The canonical statement of conditional probability updating; the foundation of Bayesian credence-as-graded-belief"
  - source: practitioner
    text: tetlock-2015-superforecasting
    citation: "Philip Tetlock and Dan Gardner, Superforecasting: The Art and Science of Prediction (Crown, 2015). Illustrative secondary lineage: The Good Judgment Project's empirical finding that forecasters who use explicit probability gradients and update on new evidence systematically outperform those who use binary or vague-verbal credences. Calibration training IS training to think in graded credences. (Primary philosophical lineage: Ramsey 1931 above.)"
  - source: practitioner
    text: web-mining-pass
    citation: "promoted from cross-attestation: probability theory (Bayes 1763 canonical; Jaynes 2003 Probability Theory: The Logic of Science as canonical Bayesian-rationality treatise; Cox theorem reductions of probability axioms to coherence requirements), forecasting (Tetlock & Gardner 2015 Superforecasting; the Good Judgment Project's empirical demonstration that calibration training works), legal evidentiary standards (preponderance of evidence ~51%; clear and convincing ~75%; beyond reasonable doubt ~95% — explicitly graded credence levels with different operational consequences; Federal Rules of Evidence and the broader common-law tradition), epistemology (Bayesian epistemology — Joyce 1998 'A Nonpragmatic Vindication of Probabilism' Philosophy of Science 65(4):575-603; the dutch-book arguments establish that incoherent credences are exploitable). Cross-domain attestation across mathematics, decision theory, law, and philosophy"
canonical-instances:
  - "Tetlock superforecaster training: subjects shift from 'I think X will happen' to 'I think X is 73% likely' and explicitly track calibration over time. Calibration improves with practice; subjects rise from average-pundit accuracy to systematically-better-than-experts on geopolitical prediction tasks. The graded credence is the operational unit"
  - "legal evidentiary standards: a preponderance of evidence (>50%) suffices for civil judgments; clear and convincing evidence (~75%) for some specialized civil matters; beyond reasonable doubt (~95%, often glossed) for criminal conviction. The legal system explicitly operates with graded credence rather than binary belief — different evidentiary burdens trigger different operational consequences"
  - "weather forecasting: 'there's a 70% chance of rain tomorrow' is not vague; it's a specific calibration claim that can be tested against observed-frequency over many such forecasts. The graded credence has empirical content; calibration is checkable"
  - "scientific peer review of model-validity claims: rather than 'the model is correct' or 'the model is wrong,' the practice is 'the model is consistent with data X with credence Y given prior Z.' Bayesian model-comparison tools (Bayes factors; AIC/BIC information criteria) operationalize the graded-credence stance"
  - "operationally distinct from lex-znaau premature-closure: premature-closure is the failure mode (settling on a binary answer too soon); credence-as-graded-belief is the constructive stance (don't settle; quantify and update). Paired atoms — premature-closure is what credence-as-graded-belief cures"
  - "operationally distinct from lex-chp44 meta-pointer: meta-pointer marks 'more detail than represented' qualitatively; credence-as-graded-belief is the QUANTITATIVE version specifically about the credence-of-the-claim. Different objects (representation vs assertion)"
  - "operationally adjacent to lex-hfcae expectancy-violation-as-learning-mechanism: Bayesian update IS the formal-mechanism by which prediction-failure shifts credence; expectancy-violation is the trigger, credence-update is the response"
critical-questions:
  - "the calibration test: are your credences calibrated, or just verbal-confidence-laundered-as-numbers? '70% likely' that's actually 30% (overconfidence) is worse than honest 'I don't know.' Calibration tracking is the discipline that distinguishes real graded credence from theatrical numbering. Practitioner-discipline: keep a calibration log of credence-claims and outcomes; the empirical-frequency at each credence-bucket should match the credence-level (events you said were 70%-likely should occur ~70% of the time)"
  - "the actually-update test: do you actually update on evidence, or are the credences post-hoc rationalizations of intuitions? The Bayesian-update test: did your credence shift in response to specific information, in the direction and magnitude predicted by Bayes' theorem? If not, you're using probability language without probability practice. Practitioner-discipline: before receiving new evidence, pre-register the credence-shift you would make conditional on the evidence; check the actual shift against the pre-registration"
  - "the dutch-book coherence check: do your credences across propositions cohere (P(A) + P(¬A) ≈ 1; P(A∧B) ≤ P(A); etc.)? Coherent credences are necessary for the Bayesian-benefits to deliver. Many practical credences are incoherent — the same person assigns 80% credence to A, 80% credence to ¬A, and doesn't notice the contradiction until pointed out. Practitioner-discipline: audit credence-sets for the basic coherence-conditions before treating them as a Bayesian system"
  - "the question-admits-credence check: does this question even admit graded credence, or is it a category-error? 'Is X morally right?' may not be a credence-shaped question; 'will X happen by date Y?' is. Practitioner-discipline: before quantifying, verify the question is empirically-tractable. Forcing graded credence onto questions that don't admit it produces theatre, not Bayesian practice"
  - "the cost-of-discipline test: under what conditions does the graded-credence discipline COST MORE than it returns? Decision-deadline-pressure may not allow the calibration; some social contexts penalize visible uncertainty (a doctor must speak with confidence); the discipline has overhead. Practitioner-question: is the graded-credence discipline net-positive for this decision-context, or is the overhead larger than the calibration-benefit?"
status: active
