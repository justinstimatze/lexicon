canonical-instances:
  - "A career specialist who has spent decades being rewarded for staying strictly within a delimited technical lane defers all judgment about the civic or political implications of their own field's output to 'the people whose job that is' — the same posture that earned them standing at work, generalized to citizenship."
  - "A professional body that trains members to treat any question outside their certified competence as categorically not theirs to weigh in on finds that same membership under-participates in civic deliberation on issues the profession's own work directly shapes."
  - "Operationally distinct from lex-6subr trained-incapacity-past-success-breeds-blindness-to-new-conditions: lex-6subr is about PAST SKILL becoming a blind spot under CHANGED CONDITIONS — the same training that succeeded before misfires now. This atom, though Merton also invokes the phrase 'trained incapacity' here, names a different mechanism: a bureaucratically-rewarded subaltern posture (fixed competence, no larger judgment) TRANSFERRING from the workplace into a person's role as citizen — a scope-of-self problem, not a stale-skill-under-new-conditions problem."
critical-questions:
  - "Is the citizen-self submergence a durable trait of the person, or does it lift the moment they leave the bureaucratic role — i.e., is this about identity capture or merely about the incentives that were operating while employed?"
  - "Does this generalize past engineers to any professional class rewarded for narrow-scope competence (compliance officers, actuaries, career civil servants), or does it depend on the specific 'subaltern to an administrator' power structure Merton describes?"
status: active
