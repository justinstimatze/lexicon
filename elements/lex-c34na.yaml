id: lex-c34na
name: scarcity-of-presence-creates-perceived-value-and-pull
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When something's scarce in availability or presence, perceived value rises by scarcity-effect alone. The scarcity may be real or engineered; either way, calibrate value against the underlying utility, not against availability. Scarcity is rhetoric until proven otherwise."
related: [lex-33p2a, lex-5yufs, lex-9pubz, lex-jv983, lex-mthv9, lex-npyes, lex-ppm3j, lex-qhydj, lex-rptqb, lex-s7bjg, lex-vjcwu, lex-yh672, lex-zrhqq]
scaffolds-from: [lex-yh672, lex-jv983]
evokes: [greene-law-16, strauss-push-pull, absence-makes-the-heart, courtly-rationing-of-attention, raleigh-elizabeth, marilyn-monroe-scarcity, pickup-push-pull]
premises:
  - "an actor is in some kind of evaluative relationship with a target (sovereign, prospective partner, audience, market) whose evaluation of the actor affects the actor's standing"
  - "continuous-presence delivers a high-volume sample of the actor's complicated-real-form to the target, which the target's interpreter (lex-yh672) integrates as habituated familiarity — eroding the perceived novelty and exceptionality"
  - "strategic-withdrawal creates an absence-vacuum that the target's interpreter fills with an idealized-imagined-form, drawing on prior salient samples and what-the-target-wishes-the-actor-was"
  - "the idealized-imagined-form has higher processing-fluency than the present-real-form would (lex-jv983 fluency-trap), so the absence-version feels more compelling than the presence-version would — even when the present-version is objectively better"
  - "the pull-toward-the-absent-actor is the operational consequence the actor wants"
decomposes-into: []
assembly: "sequential(monitor-target-habituation, withdraw-before-erosion-completes, allow-idealization-to-build, return-with-rationed-presence)"
critical-questions:
  - "is the actor's ABSENCE actually generating idealization, or is it generating substitution? The principle assumes the target's attention will fixate on the absent actor's imagined form; in practice the target may simply move to a different target. Diagnostic: 'is there a substitute the target could shift to during my absence, and if so why would they wait for me?'"
  - "is the present-form genuinely good enough that idealization is an UPGRADE the actor benefits from? Some actors are better when present (high in-person warmth, low textual presence). For those actors, the absence-strategy backfires — the imagined form is WORSE than the real one. Diagnostic: 'when the target meets me again after the absence, will they update toward my idealization or away from it?'"
  - "does the principle license relationship-corrosion at the moral level? The Carnegie-frame would treat scarcity-of-presence as withholding-emotional-availability that corrodes long-term trust. Both prescriptions agree on the operational mechanism (absence creates pull) but disagree on whether to deploy it. Diagnostic: 'am I using rationed-presence as a tactical maneuver or as cover for unwillingness to actually show up?'"
  - "is the target sophisticated enough to NOTICE the rationing-strategy and respond by withdrawing pursuit? The principle assumes a target who fills absence with idealization; a target who recognizes the tactic may respond with mirror-withdrawal or contempt. Diagnostic: 'is the target naive about social-tactics or are they running their own counter-game?'"
  - "is the actor's withdrawal interpretable as withdrawal-because-I'm-busy-with-something-prestigious vs withdrawal-because-I-was-rejected-or-am-fading? Same mechanical withdrawal, opposite signaling. Diagnostic: 'will the absence read as elevated-status or as defeated-status?'"
lineage:
  - source: primary
    text: greene-1998-48-laws-of-power-law-16-absence-increases-respect
    citation: "Robert Greene, *The 48 Laws of Power* (Penguin Group 1998), Law 16 'Use absence to increase respect and honor.' Local copy in lexicon corpus. Greene's claim: continuous presence creates familiarity, familiarity erodes the perceived-value of the present party — and erosion can be reversed by strategic withdrawal which causes the target to construct an idealized version of the absent party. Worked case-studies: Sir Walter Raleigh's exile-then-return reactivating Elizabeth I's preference; Marilyn Monroe's brief and rationed appearances vs the over-exposed-then-forgotten contemporaries. Greene's mechanism-claim: the target's interpreter (lex-yh672) fills the absence-vacuum with an idealization the present party could not have matched in person. Substrate-extension via lex-jv983 fluency-trap: the absent party's IDEALIZED-imagined-form has higher processing-fluency than the present party's complicated-real-form, making the absence-version feel more compelling than the presence-version would."
    quote: "(Law 16 chapter excerpt:) LAW 16 USE ABSENCE TO INCREASE RESPECT AND HONOR JUDGMENT Too much circulation makes the price go down: The more you are seen and heard from, the more common you appear. If you are already established in a group, temporary withdrawal from it will make you more talked about, even more admired. You must learn when to leave. Create value through scarcity. TRANSGRESSION AND OBSERVANCE OF THE LAW Sir Guillaume de Balaun was a troubadour who roamed the South of France in the Middle Ages, going from castle to castle, reciting poetry, and playing the perfect knight. At the castle of Javiac he met and fell in love with the beautiful lady of the house, Madame Guillelma de Javiac. He sang her his songs"
  - source: primary
    text: strauss-2005-the-game-push-pull-keeping-target-guessing
    citation: "Neil Strauss, *The Game: Penetrating the Secret Society of Pickup Artists* (Regan Books 2005), section on the 'push-pull' technique within the pickup-artist community's mid-2000s street-game systems. Strauss documents the practitioner-formalization of the same scarcity-of-presence principle Greene 1998 names from the historical-courtier register: the pickup-artist community independently rediscovered that signaled-distance-then-engagement (push-pull) creates target-pull where continuous-engagement creates target-withdrawal. Methodological distinctness from Greene: (i) corpus — historical-courtier case-studies vs late-90s/early-2000s urban-club-dating field-trials in Los Angeles; (ii) social context — court-and-state vs nightclub-and-bar; (iii) target — sovereign-or-superior vs prospective-romantic-partner; (iv) tradition — Renaissance-statecraft via Plutarch and Castiglione vs cognitive-behavioral and NLP-derived street-pickup-systems; (v) verification — narrative-historical vs iterated-field-trial. Both arrive at the same operational rule: ration presence to keep the target's idealization-engine running rather than letting reality replace it. Cross-tradition convergence on the operational rule across this much methodological distance is the substrate-level evidence that lex-c34na names a pattern, not a Greene-specific schema. CAVEAT: Strauss's source-corpus involves the pickup-artist subculture whose ethics and gender-politics are widely criticized; the citation is for the FIELD-OBSERVATIONAL DISTINCTNESS the corpus provides, not endorsement."
    quote: "(Strauss on push-pull mechanism:) push-pull-keeping her guessing by pushing her away and then quickly pulling her in closer. After they’re finished giving opinions on names for the dogs (Milli and Vanilli, Hall and Oates, Dre and Snoop-I’ve heard them all), then you demonstrate value. You give the girls the best friends test or teach them something about their body language or ana"

canonical-instances:
  - "Sir Walter Raleigh's exile and Elizabeth I's preference (Greene case-study): Raleigh's exile from court was followed by Elizabeth's intensified preference upon his return — the absence-vacuum filled with idealization that the present-Raleigh had been competing against."
  - "Marilyn Monroe's rationed-appearances vs over-exposed contemporaries: Monroe's brief and carefully-spaced public appearances maintained scarcity-of-presence; contemporaries who chased every opportunity habituated their audiences."
  - "pickup-artist push-pull as field-tested implementation (Strauss): mid-conversation signaled-distance ('Is she always like that? How do you deal with her?') immediately followed by re-engagement ('a light compliment'). Field-trial verification of the absence-creates-pull mechanism on micro-time-scale."
  - "the email-response-time signal in professional networking: rapid responses signal availability and (over time) lower-status-than-the-correspondent; rationed responses signal demand-on-attention and (over time) higher-status. Mechanism identical to Greene Law 16."
  - "the consultant who batches client communication weekly rather than responding-immediately to each message: scarcity-of-presence framing as deliberate-attention-economy choice; the rationing reads as expert-busy-with-prestige-work rather than unresponsive."
  - "celebrity-disappearance-then-return as career-management: Joaquin-Phoenix-rap-album-as-fake-retirement, David-Bowie-recurring-stage-personality-deaths, Frank-Ocean-multi-year-silences — managed absences that maintain the idealization-engine on a population scale."
severity-tier: info
status: active
