    quote: "'Secondly, this element of indeterminacy contributes also toward undermining the relation which exists between experts and clients. In evaluating the expert's competence, the client cannot always rely on results, for the judgment is always comparative. Perhaps the problem could have been solved more effectively by another specialist; perhaps it could not. There is a large area of indeterminacy in appraising the expert's performance. And consequently, there is an important fiduciary component in the expert's role.'"
