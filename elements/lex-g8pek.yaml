id: lex-g8pek
name: a-shared-taboo-converts-private-skill-into-public-stakes
type-in: state
type-out: process
_tier: atomic
agent-instruction: "Bogong moth harvests in the Australian Alps drew clans from across the region -- Maneroo, Bidwell, Ngarigo, Yuin, Thawa, Diringanj, Walbanga, and the Ngunuwal among others -- to feast on a fat-dense food source abundant enough to sustain hundreds of people through a season. Cooking the moths correctly mattered: singe the wings and legs off in hot ashes without scorching the body. Pascoe records the belief that enforced this: 'if the body of the moth was scorched during cooking, a great storm was said to arise and blow moths off course and out to sea, with the bulk of the harvest lost. Such storms had been witnessed by white settlers, and these events would have caused great hardship for the moth hunters.' A scorched moth is, on its face, one cook's mistake, a technique failure with a small, local cost. The storm belief reassigns the stakes: botch the technique and the claimed consequence scales past a spoiled batch to the whole gathering's food supply for every clan present. That reassignment is what turns a private skill lapse into something the entire group has reason to watch and correct in each other, instead of something only the cook and their immediate kin have any reason to care about. Diagnostic move: when a group needs everyone to police a skill that's otherwise easy to botch quietly and hard to catch from outside, look for a belief, religious, reputational, or otherwise, that scales the claimed consequence of a private mistake up to a shared one; that belief is frequently the actual enforcement mechanism, doing the surveillance work no formal inspection regime could afford to run at that scale."
