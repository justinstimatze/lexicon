id: lex-eaw4v
name: flat-maximum-penalty-erases-the-deterrent-gradient
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a legal or disciplinary code assigns the single most severe available punishment to nearly every offense, the system runs out of room to signal that some violations are worse than others — the deterrent schedule collapses flat, and the harshest penalty ends up spent on trivial offenses for lack of anywhere higher to escalate to for the serious ones. Plutarch's Life of Solon preserves Draco's own explanation for his notoriously harsh legal code, as the setup for why Solon repealed nearly all of it: Draco, 'being once asked why he made death the punishment of most offenses, replied, \"Small ones deserve that, and I have no higher for the greater crimes.\"' Draco's answer is not a denial of the problem — it's an admission of it, phrased as if it were unavoidable: having already assigned death to minor offenses, he has nothing left to reserve for major ones, so the code cannot express that some crimes matter more than others. A rational actor facing a flat-maximum schedule has no differential incentive to stop at the smaller offense rather than escalate to the larger one, since the penalty is identical either way — the code has accidentally removed its own strongest lever for shaping behavior at the margin. Generalize beyond this case: content-moderation policies that permanently ban an account for both a minor first-time infraction and a severe repeated one, removing any incentive for a borderline offender to stop before escalating, since the consequence is the same regardless; zero-tolerance school disciplinary codes where a first minor infraction draws the same suspension as a serious one, eliminating the code's ability to signal proportional severity to students weighing whether to escalate. The diagnostic move: when a penalty schedule looks unusually harsh across the board, check specifically whether it has run out of gradient — whether the worst available penalty is already being spent on the mildest offenses, leaving the system with no way to mark genuinely serious violations as worse than trivial ones."
related: [lex-prwfm]
