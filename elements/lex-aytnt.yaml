id: lex-aytnt
name: order-tactics-by-reversibility-escalate-only-when-the-current-one-fails
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Kretschmer lays out an offshore sailor's storm-tactics ladder: 'There are four basic tactics to consider when contending with heavy weather: two passive measures -- heaving-to and lying ahull -- and two active measures -- forereaching and running-off... in general I am a proponent of heaving-to as a first option and forereaching when the weather becomes truly severe. Running-off is viable, especially in the right boat, but avoid lying ahull until every other card has been played.' The tactics aren't ranked by effectiveness in isolation -- they're ordered by how committal and hard-to-reverse each one is, from heaving-to (parking the boat, easily abandoned for something else) down to lying ahull (dropping all sail and hoping, the option you exhaust everything else before trying). Just as important as the ORDER is the TRIGGER for moving down it: 'Ultimately there comes a time when heaving-to stops being effective. How do you know? The boat tells you.' There's no pre-set wind-speed number that says switch now -- the signal to escalate is a qualitative change in how the boat is actually behaving under the current tactic, read in the moment, not a threshold decided back at the dock. The transferable move: when facing an open-ended adverse situation with several possible responses that differ in how drastic and hard-to-undo they are, start at the most reversible end and hold there as long as it's working, escalating one rung at a time toward the more drastic, harder-to-undo options -- but let the CURRENT tactic's own observed performance be what tells you it has stopped working, rather than committing in advance to a fixed threshold that may fire too early (abandoning a tactic that's still fine) or too late (staying with one that has already failed in a way the pre-set number didn't anticipate)."
related: [lex-b3g28, lex-tghq5]
evokes: [heaving-to, forereaching, running-off, lying-ahull, the-boat-tells-you, storm-tactics-ladder, escalate-on-signal-not-schedule, every-other-card-has-been-played]
lineage:
  - source: primary
    text: kretschmer-2014-sailing-a-serious-ocean
    citation: "John Kretschmer, Sailing a Serious Ocean: Sailboats, Storms, Stories, and Lessons Learned from 30 Years at Sea (International Marine/McGraw-Hill, 2014), Chapter 7, 'Storm Strategies.'"
    quote: "'There are four basic tactics to consider when contending with heavy weather: two passive measures--heaving-to and lying ahull--and two active measures--forereaching and running-off. While many factors influence storm tactics, including sea room, boat type, crew experience, and weather forecasts, in general I am a proponent of heaving-to as a first option and forereaching when the weather becomes truly severe. Running-off is viable, especially in the right boat, but avoid lying ahull until every other card has been played.'"
  - source: primary
    text: kretschmer-2014-sailing-a-serious-ocean
    citation: "John Kretschmer, Sailing a Serious Ocean (International Marine/McGraw-Hill, 2014), Chapter 7, 'Storm Strategies,' section 'Heaving-to.'"
    quote: "'Ultimately there comes a time when heaving-to stops being effective. How do you know? The boat tells you. When the slick no longer keeps the waves from breaking or the bow from being forced off the wind, it becomes clear that a different strategy is needed.'"
canonical-instances:
  - "Medical step therapy: a clinician starts a patient on the least invasive, most easily discontinued treatment for a condition and escalates to more aggressive intervention only once the current treatment's measured effect on the actual symptoms falls short, rather than jumping straight to surgery or a high-risk drug based on the initial diagnosis alone."
  - "An on-call engineer responding to a production incident tries a config rollback first (fully reversible, seconds to undo), escalates to a service restart if the rollback doesn't resolve it, and only reaches for a database failover or a full redeploy -- the hardest options to walk back cleanly -- once the less drastic steps have visibly failed to fix the actual symptom, rather than jumping straight to the drastic fix because the incident looked bad at the start."
  - "Operationally distinct from lex-b3g28 turn-back-before-the-conditions-needed-to-turn-back-vanish: lex-b3g28 is a single binary decision (retreat or don't) whose hard part is TIMING -- deciding to retreat while the resource needed to execute the retreat still exists, before it's consumed by the same threat. This atom is a MULTI-RUNG SEQUENCE of different tactics tried in order of increasing severity, and its hard part is reading which rung you're currently on -- when to move from the tactic you're using now to the next one down the ladder. They can compose: a sailor moving down Kretschmer's ladder from heaving-to toward lying ahull is also watching for the point (per lex-b3g28) where the boat's own maneuverability -- the resource an active escape still depends on -- might itself be running out."
  - "Operationally distinct from lex-tghq5 problem-difficulty-is-typed-by-how-much-of-the-system-must-change: lex-tghq5 sorts SOLUTIONS to an engineering problem by how much of the existing object has to change, as a way to estimate up front how hard a problem actually is -- it's a difficulty-classification scheme applied once, before solving. This atom sorts RESPONSE TACTICS to a single ongoing crisis by reversibility, and its work happens live, in real time, as the crisis unfolds -- deciding when to move from the tactic in use to the next one down the ladder, driven by the current tactic's observed failure rather than an upfront estimate of problem difficulty."
critical-questions:
  - "Does the situation actually support a graduated response, or does the crisis sometimes jump straight past the milder options -- a sudden knockdown, not a gradually building sea, in which case starting at the top of the ladder and working down loses time you don't have?"
  - "Is the feedback signal for 'this tactic has failed' actually legible in time to act on it, or does it arrive only after the tactic has already failed catastrophically? Kretschmer's 'the boat tells you' assumes an attentive, experienced reader of the signal -- a novice crew may not recognize the slick breaking down until well after an experienced sailor would have."
  - "Is the ladder's ORDER actually right for this specific situation, or was it built for a typical case that doesn't apply here? Kretschmer is explicit that the right first tactic depends on the boat -- some hulls won't heave-to at all -- so applying a generic severity-order without checking it against the actual system in front of you can put you on the wrong rung from the start."
