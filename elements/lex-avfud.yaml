id: lex-avfud
name: protectors-death-exposes-suppressed-group-hostility
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern whenever a stigmatized or resented individual's day-to-day safety turns out to have been conditional on ONE person's active, ongoing defense rather than on genuine group acceptance — the hostility was suppressed, not resolved, and its removal is total and immediate the moment that one protector is gone. Homer's Iliad Book XXIV states this exactly. In her lament over Hector's body, Helen — technically the cause of the entire war, and resented for it — reveals that the household and city had been hostile to her all along, with exactly one exception: 'And now the twentieth year is past since first / I came a stranger from my native shore, / Yet have I never heard from thee a word / Of anger or reproach. And when the sons / Of Priam, and his daughters, and the wives / Of Priam's sons... Taunted me grievously, or Hecuba / Herself... thou didst take my part / With kindly admonitions, and restrain / Their tongues with soft address and gentle words.' The hostility did not begin with Hector's death — it was already there, actively restrained by his continual intervention. What his death changes is stated as an immediate, total shift, not a gradual one: 'For now I have no friend in all wide Troy — / None to be kind to me: they hate me all.' The mechanism: one high-status protector's consistent defense can make a stigmatized outsider's position look secure and their belonging look general, when in fact it was specific and delegated — a single dampening force holding back ambient resentment that never went anywhere. When the protector is removed (death, departure, loss of standing), the change in the outsider's treatment is immediate and total precisely because nothing about the group's actual disposition toward them had changed; only the suppression ended. Portable beyond the household: an employee resented by their team is defended in every meeting by one manager who insists on fair treatment; when that manager leaves or is fired, exclusion and blame-piling toward the employee begin almost immediately, revealing the fairness had been personally enforced, not culturally held. In blended families, a stepparent's death or departure can expose long-suppressed resentment between step-relations that the connecting parent had been actively, continuously mediating. A reformist leader who shields an unpopular minority or policy from a hostile establishment falls from power, and persecution that had been dormant — not absent — resumes immediately. Diagnostic: separate this from ordinary loss-triggered friction by checking whether specific past instances of the protector's active intervention can be named (evidence the hostility predates the protector and was being actively restrained) versus whether the shift is gradual and diffuse (more consistent with grief simply souring a group's general mood) — a total, immediate change in treatment upon one person's removal is the marker of structural, delegated protection rather than general goodwill."
related: [lex-68gd3, lex-ymckb]
evokes: [helen-lament-for-hector, i-have-no-friend-in-all-wide-troy, thou-didst-take-my-part, sole-defender, conditional-belonging]
lineage:
  - source: primary
    text: homer-iliad-book-xxiv-helen-lament
    citation: "Homer, Iliad, Book XXIV ('The Body of Hector Recovered'), trans. William Cullen Bryant (Boston: James R. Osgood and Company, 1870; PD — Bryant died 1878 — Standard Ebooks PD edition). Helen's lament, the last of three over Hector's body, reveals that Hector alone had shielded her from the household's ongoing hostility, and that his death leaves her totally and immediately friendless within Troy."
    quote: "[Helen:] 'And now the twentieth year is past since first / I came a stranger from my native shore, / Yet have I never heard from thee a word / Of anger or reproach. And when the sons / Of Priam, and his daughters, and the wives / Of Priam's sons, in all their fair array, / Taunted me grievously, or Hecuba / Herself... thou didst take my part / With kindly admonitions, and restrain / Their tongues with soft address and gentle words. / Therefore my heart is grieved... For now I have no friend in all wide Troy — / None to be kind to me: they hate me all.'"
canonical-instances:
  - "The direct textual anchor: Helen states plainly that the household had been hostile to her throughout her twenty years in Troy, that Hector alone restrained it, and that his death leaves her instantly and totally without a friend in the city."
  - "An employee resented by their team is defended in every meeting by one manager who insists on fair treatment; when that manager leaves or is fired, exclusion and blame-piling toward the employee begin almost immediately, revealing the fairness had been personally enforced rather than culturally held."
  - "In a blended family, a stepparent's death or departure exposes long-suppressed resentment between step-relations that the connecting parent had been actively, continuously mediating."
  - "A reformist leader who shields an unpopular minority group or policy from a hostile establishment falls from power, and persecution that had been dormant, not absent, resumes immediately."
critical-questions:
  - "isn't this the same as lex-68gd3 collective-ills-transferred-to-a-scapegoat-then-expelled? No — lex-68gd3 is an ACTIVE process: a group discharges accumulated ills by loading them onto a carrier and expelling it, restoring felt unity. This atom is passive and prior: a PRE-EXISTING hostility is merely being restrained by one protector's ongoing intervention, with no discharge event and no transfer of blame — just the removal of a dampening force. They can chain: a formerly-protected outsider, once undefended, can subsequently BECOME a scapegoat for some later ill — this atom names the exposure; lex-68gd3 would name what happens if the group then actively converges to blame them for something."
  - "isn't this the same as lex-ymckb subordinated-group-as-magnifying-mirror? No — lex-ymckb is about identity-construction: a dominant self defines itself against a subordinated other. This atom is about a THIRD PARTY's protective role suppressing a group's hostility toward an outsider, independent of any identity-mirroring function; the protector need not be using the outsider to define themselves at all."
  - "is this just 'grief makes people short-tempered,' i.e. ordinary post-loss friction? No — the claim is structural, not moody: the outsider's safety was conditional and delegated to one specific buffer, not a matter of general goodwill. The diagnostic is whether removing the ONE person changes the outsider's treatment totally and immediately (structural dependency, this atom) versus gradually and diffusely across many relationships (more consistent with a general grief-driven mood shift)."
  - "how would you distinguish PRE-EXISTING suppressed hostility from hostility that is newly caused by the protector's death (e.g., displaced grief)? Check whether specific past instances of the protector's active intervention can be named — Helen names them explicitly ('thou didst take my part... and restrain their tongues'). Evidence of a pattern of past restraint indicates the hostility predates the loss and was being actively held back, not created fresh by it."
severity-tier: warning
status: active
