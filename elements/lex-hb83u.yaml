id: lex-hb83u
name: anchoring-a-social-place-to-an-unchangeable-body-fact-naturalizes-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A person's actually changeable, contingent social position, their status, their role, their available future, doesn't stay obviously changeable and contingent once it gets rhetorically equated with something about their body that genuinely can't change -- the equation borrows the body's fixedness and lends it to the social arrangement, so the arrangement starts to feel as natural and non-negotiable as anatomy. Hyde names the trick precisely: 'Before anyone can be snared in this trap, an equation must be made between the body and the world (my skin color is my place as a Hispanic; menstruation is my place as a woman). This substituting of one thing for another is called metonymy in rhetoric... The construction of the trap of shame begins with this metonymic trick, a kind of bait and switch in which one's changeable social place is figured in terms of an unchangeable part of the body.' Once made, the trick doesn't stay visible as a trick: 'Then by various means the trick is made to blend invisibly into the landscape... Once the verbal tricks are invisible, the artifice of the social order becomes invisible as well, and begins to seem natural.' The bait-and-switch has two separate claims doing the work of one: the body fact (skin color, menstruation) really is fixed; the social meaning attached to it (a race's assigned place, a gender's assigned place) is not fixed at all, it's a historical, contingent arrangement, but riding on the body's genuine fixedness, it borrows an unearned appearance of permanence. Diagnostic move: whenever a social arrangement is defended as simply following from a biological or bodily fact, separate the two claims explicitly -- is the body fact itself actually fixed, and, independently, does anything about the social arrangement genuinely follow from it, or is the arrangement's contingency being smuggled past attention by fusing it to something that really can't be argued with?"
related: [lex-cz6ky, lex-jud2d]
evokes: [hyde-trickster-makes-this-world-speechless-shame-and-shameless-speech, metonymic-trap-of-shame, my-skin-color-is-my-place, bait-and-switch-of-the-body]
lineage:
  - source: primary
    text: hyde-metonymy-anchors-a-changeable-social-place-to-an-unchangeable-body-fact
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 7, '\"Speechless Shame and Shameless Speech,\"' on the metonymic trap of shame. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Before anyone can be snared in this trap, an equation must be made between the body and the world (my skin color is my place as a Hispanic; menstruation is my place as a woman). This substituting of one thing for another is called metonymy in rhetoric, one of the many figures of thought, a trope or verbal turn. The construction of the trap of shame begins with this metonymic trick, a kind of bait and switch in which one’s changeable social place is figured in terms of an unchangeable part of the body."
canonical-instances:
  - "A company justifies paying older workers less for the same role by pointing to their age as though age itself determined their market value, fusing a genuinely fixed fact (how many years they've been alive) to a genuinely contingent policy choice (how compensation is structured), so that challenging the pay gap starts to feel like challenging arithmetic."
  - "A caste system justifies a family's hereditary occupation by pointing to their birth lineage as though the work itself were encoded in their blood, so that a landless laborer's grandson questioning whether he must also be a landless laborer feels like he's disputing a fact of nature rather than a social arrangement with a specific, traceable history."
critical-questions:
  - "Is every instance of linking a social role to a body fact actually this kind of illegitimate trick, or are there cases where a bodily fact genuinely does constrain what social arrangements are reasonable (pregnancy and parental leave policy, for instance), making the diagnostic too quick to call every such link a 'trap'?"
  - "Does exposing the metonymy as a trick actually loosen its grip in practice, or does Hyde overestimate how much cognitive work mere rhetorical analysis can do against arrangements that are also enforced through economic and physical power, independent of whether people 'see through' the trick?"
  - "Could this pattern be turned around to attack genuinely justified links between bodies and social arrangements, muddying legitimate claims (that a physical disability genuinely does require an accommodation) together with illegitimate ones (that skin color justifies a caste) under the same 'it's just a rhetorical trick' banner?"
status: active
