canonical-instances:
  - "Hypothetical: A city council debating whether to add wheelchair ramps to three subway stations gets stuck on a board member's demand that the council first agree on a complete vision of the ideally accessible city. The ramps make the city more accessible than not having them, a comparative judgment the council can act on immediately, without ever resolving what full accessibility would ultimately require."
  - "Hypothetical: Two proposed employee handbooks are up for adoption, one banning a specific discriminatory practice the current handbook allows and one that doesn't. A board member objects that the company hasn't defined what a perfectly fair workplace looks like, so it can't say which handbook is 'more fair.' The comparison between the two actual handbooks on this one practice doesn't need that definition to be made."
critical-questions:
  - "Doesn't having some notion of the ideal help identify which comparisons are worth making in the first place -- isn't the transcendental approach doing useful work even if it's not strictly required? It can be useful as a source of direction, and Sen isn't arguing the transcendental tradition is worthless. The claim is narrower: a completed, agreed-upon account of the ideal is not a precondition for making valid comparative judgments, so a debate that stalls waiting for one is stalling unnecessarily."
  - "Can comparative judgments actually settle hard cases, or do they only work for the easy ones, like removing an obvious wheelchair-access gap? Comparative judgments can fail to produce a verdict when two alternatives are genuinely close or trade off different kinds of injustice against each other -- Sen doesn't claim otherwise. The point is narrower than that: when comparative judgments fail, the cause is a genuinely close call between the two alternatives, and the missing theory of the ideal was never the thing standing in the way."
