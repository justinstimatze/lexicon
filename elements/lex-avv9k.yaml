id: lex-avv9k
name: rights-decompose-into-four-jural-relations
type-in: claim
type-out: composition
_tier: atomic
agent-instruction: "When analyzing a 'right', decompose into Hohfeld's four jural relations: claim-right (others' duty), liberty (no duty), power (ability to alter relations), immunity (protection from alteration). Most disputes about 'rights' confuse these; surface which Hohfeldian relation is actually at stake."
related: [lex-spk4s, lex-zxrtf, lex-gzgn3, lex-urh87, lex-8n237, lex-zeznb, lex-bqxvx, lex-6cvnf, lex-dfgda, lex-p5m5u]
scaffolds-from: [lex-zeznb, lex-bqxvx]
evokes: [the-hohfeldian-table, claim-right-vs-privilege-vs-power-vs-immunity, jural-opposites-and-correlatives, rights-as-bundle-not-singleton, the-eight-element-grid, dissecting-the-word-right]
lineage:
  - source: primary
    text: hohfeld-1913-fundamental-legal-conceptions
    citation: "Wesley Newcomb Hohfeld, 'Some Fundamental Legal Conceptions as Applied in Judicial Reasoning,' *Yale Law Journal* 23(1):16-59 (1913). (PD per Hohfeld d. 1918 + work age >100 yr). Hohfeld (Stanford → Yale Law, 1879-1918) argued that the term 'right' in legal discourse conflates four operationally-distinct normative relations: (1) claim-right (X has a right that Y do A — correlative duty on Y); (2) privilege/liberty (X is at liberty to do A — correlative no-right on others to prevent); (3) power (X has the legal capacity to alter Y's normative position — correlative liability on Y to have position altered); (4) immunity (X is shielded from Y's exercise of power — correlative disability of Y to alter X's position). Each of the four has both an opposite (claim/no-right; privilege/duty; power/disability; immunity/liability) and a correlative. Hohfeld presents these as an 8-element grid. The framework is foundational to analytical jurisprudence; the persistence and continued use of 'Hohfeldian' as a technical term in modern philosophy of law indicates the operational utility of the decomposition."
    quote: "[Hohfeld 1913 *Yale Law Journal* 23:16, p.28 'Fundamental Jural Relations With One Another, Contrasted':] 'One of the greatest hindrances to the clear understanding, the incisive statement, and the true solution of legal problems frequently arises from the express or tacit assumption that all legal relations may be reduced to \"rights\" and \"duties,\" and that these latter categories are therefore adequate for the purpose of analyzing even the most complex legal interests, such as trusts, options, escrows, \"future\" interests, corporate interests, etc.' [p.30:] 'The strictly fundamental legal relations are, after all, sui generis; and thus it is that attempts at formal definition are always unsatisfactory, if not altogether useless. Accordingly, the most promising line of procedure seems to consist in exhibiting all of the various relations in a scheme of \"opposites\" and \"correlatives,\" and then proceeding to exemplify their individual scope and application in concrete cases.' [The 8-element table, p.30:] 'Jural Opposites: right / no-right · privilege / duty · power / disability · immunity / liability. Jural Correlatives: right / duty · privilege / no-right · power / liability · immunity / disability.' [And the diagnostic move, p.30, on the term \"rights\":] 'As already intimated, the term \"rights\" tends to be used indiscriminately to cover what in a given case may be a privilege, a power, or an immunity, rather than a right in the strictest sense.' [The transferable claim: when a normative claim invokes 'X has a right to Y', the operational content depends on which of four Hohfeldian relations is meant. Resolving the relation (claim / privilege / power / immunity) is necessary to determine what counter-position any other agent occupies, and therefore what behavior is being demanded, permitted, enabled, or shielded. The decomposition prevents conceptual confusions that arise from using the single word 'right' for distinct underlying structures.]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v46
    citation: "Cross-domain attestations: modern philosophy-of-law has institutionalized the Hohfeldian framework — Wenar 2005 'The Nature of Rights' *Philosophy & Public Affairs* 33:223 explicitly builds modern rights-theory on Hohfeld's grid; Sumner 1987 *The Moral Foundation of Rights* uses the four-fold distinction throughout; Honoré 1961 'Ownership' (in *Oxford Essays in Jurisprudence*) decomposes property similarly. American legal realism (Llewellyn, Cohen) explicitly adopted Hohfeld's analytic. Computer-science formal-policy languages (Deontic logic; access-control policies in security: Lampson 1969 'Protection' uses analogues; Bell-LaPadula 1976 distinguishes 'no read up' (a duty) from 'no write down' (a duty) — both operationalize Hohfeldian relations). Game theory: Schelling's analysis of strategic moves distinguishes between threats (claim-rights), promises (privileges), and credibility-as-power. Multi-substrate attestation across jurisprudence, philosophy, computer-security policy modeling, and game theory."
    quote: "[Cross-domain consistency check, 2026-05-24: Hohfeld's analytic survives ~115 years because the 4-fold decomposition is operationally central wherever normative claims need disambiguation. In modern philosophy of rights, the will-theory vs interest-theory debate explicitly invokes Hohfeldian categories (will-theory privileges claim-rights + powers; interest-theory privileges privileges + immunities). In security policy modeling, the formal apparatus of access-control inherits Hohfeld's structure even when not naming him (Lampson's matrix of subjects × objects × access-modes maps onto the jural-relations grid). In game-theoretic analysis of commitment devices (Schelling 1960 *Strategy of Conflict*), threats/promises/inducements are recognized as operationally-distinct strategic moves — a parallel decomposition of the surface-vocabulary 'I will/won't' into distinct strategic relations. The pattern — pre-theoretic single-term collapses N distinct operational relations; making the distinctions explicit produces analytic clarity — is itself general. Hohfeld is the canonical instance in normative discourse.]"
canonical-instances:
  - "the property-as-bundle canonical case (Honoré 1961 *Oxford Essays in Jurisprudence* + foundational in modern property theory; Hohfeld 1913 p.21-22 itself uses property as introductory example): saying 'X owns Blackacre' decomposes into ~11 incidents per Honoré, all expressible in Hohfeldian terms: (a) right to possess (claim-right that others not enter); (b) right to use (privilege to use as one wishes); (c) right to manage (power to direct how others use); (d) right to income (claim-right to fruits); (e) right to capital (power to alienate); (f) right to security (immunity from confiscation); (g) duty to prevent harm; (h) liability to execution for debts; etc. The decomposition makes visible that 'ownership' is not a single relation but a contingent bundle; restrictions on ownership (e.g., zoning, regulatory takings, tenant-rights) are precise removals of specific Hohfeldian elements, not vague 'reductions of ownership'"
  - "the free-speech canonical case (Wenar 2005 + standard constitutional-law textbook analysis): when someone says 'X has a right to free speech,' the Hohfeldian decomposition reveals (i) a privilege/liberty (X is at no duty not to speak; correlative: others have no-right to demand silence on legitimate topics); (ii) an immunity (X is shielded from government action that would silence; correlative: government has a disability to silence); but typically NOT (iii) a claim-right (others have no duty to PROVIDE X with a platform). Conflating these — treating 'right to speak' as if it included a claim-right against private platforms — produces well-known confusions in modern speech-debate"
  - "the voting canonical case (Hohfeld's own framework + standard constitutional theory): the 'right to vote' is most precisely (i) a power (the act of voting alters the electoral outcome — correlative: candidates have liability to electoral consequence); (ii) an immunity (X is shielded from disenfranchisement under conditions defined by law — correlative: state has disability to disenfranchise without due process); (iii) a privilege (X is at liberty to abstain); but NOT primarily a claim-right (no positive duty on others to ensure X votes). Voter-suppression cases involve removal of immunity; compulsory-voting regimes (Australia) replace privilege with duty"
  - "the contract canonical case (Hohfeld 1913 + Corbin 1919 *Anatomy of a Contract*): a contract creates packaged Hohfeldian relations — promisee gets a claim-right to performance + a power to release the obligation; promisor gets a duty to perform + a liability to be released. Common-law options are pure power-liability relations (option-holder has a power to convert the option; option-grantor has a liability). Hohfeld's framework directly enabled the precision of modern contract theory"
  - "the equity/trust canonical case (Hohfeld 1913 §1, his own introductory example): a trust establishes that the trustee holds legal title (with powers + duties) while the beneficiary holds equitable interest (with claim-rights against trustee + immunities from trustee misappropriation). Hohfeld's 1913 paper opens with trusts because the term 'right' is most confused there — 'cestui que trust has a right in the property' is operationally vague; the precise Hohfeldian decomposition resolves the ambiguity"
  - "operationally distinct from lex-spk4s isolate-component-for-separate-treatment: lex-spk4s is the GENERAL decomposition-as-method pattern (extract-method refactor, separation-of-concerns, factoring). lex-avv9k is a SPECIFIC SCHEMA for decomposing one particular category (normative-claim terms in 'right'-talk) into four pre-named relation types. lex-spk4s supplies the family; lex-avv9k supplies the named decomposition. They co-fire wherever isolating jural relations matters"
  - "operationally distinct from lex-gzgn3 is-ought-gap-no-deduction-of-norm-from-fact: lex-gzgn3 is about the relation between descriptive and normative claims. lex-avv9k is about the internal structure of normative claims themselves — Hohfeld's framework doesn't bridge fact and ought, it disambiguates WITHIN the ought side. lex-gzgn3 supplies the gap; lex-avv9k supplies the structure on the normative side of the gap"
  - "operationally distinct from lex-urh87 gift-as-three-obligations-give-receive-reciprocate: lex-urh87 names a specific composite obligation (Mauss's three-fold gift-obligation). lex-avv9k supplies the analytic vocabulary that makes Mauss's claim precise — the gift triad is three distinct Hohfeldian relations: a duty to give (correlative claim-right on recipient), a duty to receive (correlative claim-right on giver), and a duty to reciprocate (correlative claim-right of reciprocal-obligation-fulfillment). Cross-fire: lex-urh87 is one substantive composite analyzable via lex-avv9k's framework"
  - "operationally adjacent to lex-zxrtf naming-as-power: lex-zxrtf names the performative pattern (the act of naming changes the object's standing). lex-avv9k defines 'power' as one of four jural relations (the capacity to alter another's normative position). They co-fire when naming is the specific power: an authority's act of naming a class of agents creates new jural relations among them. Cross-fire: lex-zxrtf's naming-as-power is one canonical instance of Hohfeldian-power; lex-avv9k supplies the formal slot in the grid"
critical-questions:
  - "the which-relation diagnostic: when someone asserts 'X has a right to Y,' the question to surface is: claim-right, privilege, power, or immunity? Each implies a different correlate-position for other agents. Practitioner-discipline: refuse to accept 'right' as an undifferentiated term in any closely-reasoned argument; insist on the Hohfeldian relation. The discipline is uncomfortable in casual speech but essential in policy/legal/normative-design work"
  - "the correlate-position question: every Hohfeldian relation defines what counter-position another agent occupies. Practitioner-question: who is the OTHER party in this jural relation, and what is their counter-position? If a 'right' is claimed without clear identification of the correlate-bearer, the claim is incomplete. Free-speech debates often involve disagreement about who the correlate-bearer is (state? private platforms? other speakers?)"
  - "the bundle-decomposition question: pre-theoretic categories like 'ownership' or 'citizenship' or 'parenthood' decompose into multiple Hohfeldian relations. Practitioner-discipline: when a regulation modifies a bundle, name which specific Hohfeldian elements are added/removed. 'Restricting ownership' is vague; 'removing the privilege of certain uses while preserving the claim-right of exclusive possession' is precise"
  - "the absent-relation question: Hohfeldian opposites name what's NOT present. If X lacks a power, X has a disability (the opposite); if X has a duty, X lacks the corresponding privilege. Practitioner-question: when describing a relation, also surface what's missing — 'X has a privilege but lacks the power to compel others' is more informative than 'X has a right'"
  - "the framework-portability boundary: Hohfeld's 1913 grid was designed for Anglo-American common-law judicial reasoning. Civil-law systems use related but distinct analytical vocabulary (subjective-right theories; obligation-theories). Practitioner-question: when applying to non-Anglo-American legal contexts, does the 4-fold decomposition still hold? Modern philosophy-of-law tends to claim universality of the analytic; comparative law occasionally pushes back. Default to using the framework with awareness of its historical situation"
  - "the LLM/policy-design application: when an AI system reasons about 'what rights does X have' or 'what permissions are granted,' invoking Hohfeld's framework prevents conflating distinct operational relations. Access-control policy languages (RBAC, ABAC) implicitly use Hohfeldian categories; making them explicit in prompt and policy specification produces more precise reasoning. Practitioner-discipline: when designing AI-mediated rights/permissions reasoning, structure the schema explicitly as claim/privilege/power/immunity quadruples rather than flat 'allowed' / 'denied' bits"
status: active
