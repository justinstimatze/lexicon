lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Back to the Presocratics' (Presidential Address delivered before the Aristotelian Society, 13 October 1958; first published in the Proceedings of the Aristotelian Society, N.S. 59, 1958-9), Ch. 5 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), pp.200-201, on the dogmatic-school pattern (Popper's example is the Pythagorean school). The quote is split at the p.200/201 page break, where a running head sits directly against the join with no separating space."
    quote: "'Far from being places of critical discussion they make it their task to impart a definite doctrine, and to preserve it, pure and unchanged. It is the task of a school to hand on the tradition, the doctrine of its founder, its first master, to the next generation, and to this end the most important thing is to keep the doctrine inviolate. A school of this kind never admits a new idea. New ideas are heresies, and lead to schisms; should a member of the school try to change the doctrine, then he is expelled as a heretic. But the heretic claims, as a ... rule, that his is the true doctrine of the founder. Thus not even the inventor admits that he has introduced an invention; he believes, rather, that he is returning to the true orthodoxy which has somehow been perverted.'"
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Back to the Presocratics,' Ch. 5 of Conjectures and Refutations (Routledge Classics, 2002), pp.202-203, on Thales founding the alternative, critical tradition through his relationship with his pupil Anaximander."
    quote: "'This suggests, I think, that it was Thales who founded the new tradition of freedom -- based upon a new relation between master and pupil -- and who thus created a new type of school, utterly different from the Pythagorean school. He seems to have been able to tolerate criticism. And what is more, he seems to have created the tradition that one ought to tolerate criticism. ... I like to think that Thales was the first teacher who said to his pupils: \"This is how I see things -- how I believe that things are. Try to improve upon my teaching.\"'"
canonical-instances:
  - "A software team's design docs are archived with every rejected alternative and the named engineer who argued for the change, going back years -- a new hire can trace exactly why the current architecture replaced the last one. A rival team's only documentation is a single, continuously-updated 'how we do things' wiki page with no history -- every past disagreement has been silently absorbed into the current version, which now reads as if it were always obviously correct."
  - "A martial arts lineage where each generation's grandmaster is on record modifying specific techniques taught by name ('this throw was changed by the third grandmaster because it failed against a taller opponent') keeps producing refinements. A rival lineage that insists its founder's original forms have never changed in 200 years cannot actually demonstrate this, and in practice has quietly absorbed centuries of adjustments -- it just has no record of any of them, and no mechanism for evaluating whether the current form is actually an improvement."
critical-questions:
  - "Isn't 'we've never changed' sometimes just true, for a genuinely stable and correct core teaching -- does every claim of unbroken continuity indicate erased disagreement? No: the diagnostic isn't 'any claim of continuity is suspect,' it's that an institution's INABILITY to produce an attributed record of its own past disagreements, when disagreements of some kind are all but certain over enough generations, is what signals erasure. A tradition that can name its genuine points of continuity alongside its documented changes is doing something different from one that can only assert continuity because no record of change survives to check it against."
  - "Doesn't crediting individual innovators risk the opposite failure -- a cult of personality around whoever gets credited, or infighting over credit itself? Popper's own case sets the bar much lower than that: Thales and Anaximander apparently disagreed with no recorded schism, no dispute over credit, no formal system at all. The minimal requirement is only that the change stay nameable and traceable. A system that turns attribution into a high-stakes prize is solving this atom's problem while creating a different one."
