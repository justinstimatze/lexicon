id: lex-hrufg
name: check-your-own-capacity-to-endure-before-trading-places-with-sufferers
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you offer to take on someone else's suffering directly -- trading places with them rather than just assisting from outside it -- don't evaluate the offer only by how worthy the cause is; evaluate it by whether you can actually endure what you're volunteering for, since a rescuer who has to be rescued from their own rescue attempt has doubled the problem, not solved it. In Eastman's telling, Mashtinna makes a lifelong mutual-aid pact with a comrade -- 'if either is ever in need of help let him call upon the other and he will come instantly to his aid!' -- and then twice offers to literally trade places with a stranger in distress without pausing to assess what he's taking on. First he swaps places with a man pinned in a tree's crushing forks, and 'the pain was worse than he had supposed'; he endures as long as he can, then has to call his comrade for rescue. He does the same again, trading his own eyes for a blind old man's situation, only to nearly drown and then stumble half-blind through the forest until he again needs rescuing. His comrade's closing words name the actual lesson directly: 'It is right to help those who are in trouble, but one must also consider whether he himself is able to hold out to the end.' The story doesn't fault the impulse to help, or even the specific choice to trade places rather than assist from the side -- it faults the total absence, both times, of any assessment of his own capacity to actually bear what he was volunteering for before committing to it. Diagnostic move: before offering to fully take on someone else's burden -- their debt, their caretaking role, their suffering, their risk -- pause to honestly assess whether you can actually sustain it to completion, not just whether the person deserves help; a generous offer made without that check tends to produce a second person who now also needs rescuing."
