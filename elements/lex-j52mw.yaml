id: lex-j52mw
name: legitimate-access-not-suppression-drains-the-illegitimate-channel
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an illegitimate channel (a racket, a black market, a workaround) is serving a real underlying demand, expect direct suppression of the channel to fail and expect it to empty out on its own once a legitimate channel opens to serve the same demand instead. Merton's theory implies this directly: 'as legitimate structural alternatives for performing these functions develop, this would result in substantial changes in the social distribution of deviant behavior' — because the illegitimate channel wasn't surviving on depravity, it was surviving on being the only available route to a goal people were pressured to pursue. Daniel Bell's case study of organized crime traces exactly this: each immigrant group in turn used crime as a route to social ascent when legitimate routes (the political ladder, established business) were closed to them, and each group's involvement in organized crime receded, generation by generation, as legitimate professional and political routes opened — not because of direct law-enforcement pressure on that particular group. Merton's closing summary of Bell: 'with the rationalization and absorption of some illicit activities into the structure of the economy, the passing of an older generation that had established a hegemony over crime, the rise of minority groups to social position, and the breakup of the urban boss system, the pattern of crime we have discussed is passing as well.' Even the urban political machine's decline is attributed less to reformers' direct assaults than to the rise of the welfare state providing the same services through legitimate bureaucratic channels. Diagnostic use: when tempted to fight an illegitimate channel head-on, ask what legitimate channel could serve the same underlying demand instead — that is usually the intervention that actually works."
