    quote: "“Indeed, there are individuals who tend to be extremists and find things either ‘magnificent’ or ‘horrible’, while others finely differentiate between such things as ‘excellent’, ‘good’, ‘mediocre’, ‘poor’ and ‘awful’. It seems manifestly unfair to make the ethical assumption that the welfare significance of moving the first individual from what he regards as ‘horrible’ to what he finds as ‘magnificent’ is no more than moving the second individual from what he finds ‘poor’ and what strikes him as ‘mediocre’. What is particularly objectionable about this particular mechanism is not that it violates condition I, which of course it does, but that it implies an ethical assumption that will appear to be arbitrary and objectionable.”"
canonical-instances:
  - "A hiring rubric scores interview feedback by counting how many rating-buckets a candidate moved between two interviewers' scales -- one interviewer who only ever marks 'pass' or 'fail,' another who uses a ten-point scale. A candidate who moves the blunt interviewer from 'fail' to 'pass' scores the same one-step jump as a candidate who moves the fine-grained interviewer from a 4 to a 5, despite the blunt scale having only two settings total against the fine one's ten."
  - "A restaurant aggregates review scores by counting star-differences, treating a diner who almost always gives either 1 or 5 stars the same as a diner who uses the full 1-through-5 range thoughtfully. The all-or-nothing diner's occasional 1-star review moves the average by four times as much per review as the careful diner's incremental complaints ever could, simply because the blunt diner's scale has fewer, wider steps."
critical-questions:
  - "Isn't this just an argument for measuring feelings directly instead of using discrete categories at all -- doesn't finer measurement just push the same problem down a level? Sen targets a specific assumption (equal ethical weight per step, regardless of scale), not discreteness itself. A method that asked each person to rate the size of their own jump, rather than simply counting it as one step, would sidestep the objection without abandoning categories."
  - "Doesn't giving more weight to someone's step just because their scale is finer create the opposite problem -- rewarding whoever happens to use more categories, whether or not their finer distinctions are actually meaningful? That risk is real, and Sen doesn't offer a repaired alternative in this section -- his point stays diagnostic. Once step-counting is the unit of aggregation, the arbitrariness runs in both directions, whichever way the weighting goes."
