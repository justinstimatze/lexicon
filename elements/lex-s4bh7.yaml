name: insider-warnings-beat-raw-competence-against-a-rigged-test
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you're being evaluated by someone who controls every term of the test, don't assume your own genuine skill is what will get you through -- if the test is actually rigged, your competence is irrelevant unless someone on the inside tells you specifically how it's rigged. In Eastman's telling, a father secretly plans to kill his daughter's suitor by disguising his own sons as game animals and ordering the young man to hunt them: 'Chase it, chase it, son-in-law!' The young man is explicitly described as 'a clever hunter,' but his hunting skill was never the actual test -- the real trap was the instruction itself, since 'chasing' an animal that turns and attacks, versus shooting it from a fixed position, was the specific, disguised difference between killing an innocent creature and being killed by one. His skill with a bow means nothing against a test whose danger is entirely procedural, not physical. He survives only because the daughter, sympathetic to him, secretly tells him exactly what the test will be and exactly what to do differently each time: 'you must take care always to keep behind him. If he tells you to follow any animal, do not do so, but shoot it from where you stand!' Each of the father's three attempts fails specifically because the daughter's advance warning neutralized exactly that attempt, not because the young man out-hunted or out-thought his rival unaided. Diagnostic move: when facing an evaluation, negotiation, or trial controlled entirely by someone who may have reason to want you to fail, don't rely on your own competence at the test's apparent subject -- actively seek out anyone inside that person's circle who might know the test isn't what it appears to be, since a rigged test's actual danger is almost never in the skill it pretends to measure."
