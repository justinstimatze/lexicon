lineage:
  - source: primary
    tradition: russell-assistance-games
    text: russell-2019-human-compatible
    citation: "Stuart Russell, Human Compatible: Artificial Intelligence and the Problem of Control (Viking, 2019), Chapter 7 (AI - A Different Approach) — the three principles of beneficial AI."
    quote: "(1) The machine's only objective is to maximize the realization of human preferences. (2) The machine is initially uncertain about what those preferences are. (3) The ultimate source of information about human preferences is human behavior."
  - source: primary
    tradition: russell-assistance-games
    text: russell-2019-human-compatible
    citation: "Stuart Russell, Human Compatible: Artificial Intelligence and the Problem of Control (Viking, 2019), Chapter 8 (Provably Beneficial) — off-switch problem under objective-uncertainty."
    quote: "An instrumental goal is one that is generally useful as a subgoal of almost any original goal. Self-preservation is one of these instrumental goals, because very few original goals are better achieved when dead. This leads to the off-switch problem: a machine that has a fixed objective will not allow itself to be switched off and has an incentive to disable its own off-switch. The off-switch problem is really the core of the problem of control for intelligent systems. […] By the first principle of beneficial machines, Robbie cares only about Harriet[…] the more randomly she behaves, the more uncertain Robbie has to be about her preferences before deferring to her."
canonical-instances:
  - A LLM assistant that asks clarifying questions before committing to a long action — the asking emerges from the model treating the user's unspecified spec as objective-uncertainty, not from a hardcoded 'ALWAYS ASK' rule.
  - A surgical resident under attending supervision who interrupts to confirm before doing a step they're not sure about — the deferral is optimal under the trainee's correct uncertainty about whether their judgment is calibrated yet, not because the rules say 'always ask.'
  - A self-driving car that backs up slightly at an ambiguous 4-way stop to signal "you go" — Russell's example, emerging from the car's uncertainty about who has right-of-way and treating the other driver's action as evidence.
  - A new employee who shadows the team for a week before making big calls — the shadowing is optimal because the employee correctly models objective-uncertainty about org norms; same person three years later doesn't shadow because uncertainty has resolved.
  - A constitution-following AI that defers to elicited human values rather than imposed-by-developer values — the deferral pattern is structurally the same as Russell's assistance-game.
