id: lex-s7qxv
name: quorum-trigger-over-distributed-quality-weighted-advocacy-beats-consensus-poll
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When a group of N independently-evaluating agents must converge on a single choice among K alternatives, do NOT design a central-consensus-polling procedure (poll everyone, repeat until unanimity). The honeybee-swarm transferable structure beats this: (1) DISTRIBUTE the evaluation — each agent independently scouts one or more alternatives and forms their own quality assessment; (2) QUALITY-WEIGHTED ADVOCACY — agents advertise their preferred alternative with intensity proportional to their evidence (a bee's dance-duration tracks site-quality; a researcher's writeup-vehemence tracks confidence; a market-maker's spread tightens with conviction); (3) QUORUM TRIGGER at one alternative — collective action commits as soon as a threshold number of agents have INDEPENDENTLY converged at one alternative, BEFORE remaining agents have caught up. The triggered action stops further advocacy for losing alternatives (the piping signal in bees; the deadline announcement in committees; the trade-execution in markets). This beats consensus-polling on three dimensions: SPEED (don't wait for laggards), ACCURACY (the quorum threshold prevents one over-confident agent from dominating — every committed agent has had to convince enough others independently), and RESILIENCE (a single hold-out cannot block forever). The classic counter-example is the Quaker meeting Seeley cites: pursuing unanimity blocked a decision for four years until the dissenting member died. The transferable move is silent on group size, time-pressure, or stakes — what it claims is that the three-element structure (distributed advocacy + quality-weighting + quorum trigger) is a STABLE DESIGN that outperforms consensus-poll under most conditions where (a) individual evaluation is noisy, (b) the choice must commit collectively, and (c) the value of speed is non-trivial."
