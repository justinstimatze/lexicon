evokes: [hyde-trickster-makes-this-world-an-attack-of-accidents, aristotles-categories, essence-versus-accident, one-drop-rule]
lineage:
  - source: primary
    text: hyde-the-one-drop-rule-shows-essence-versus-accident-weighting-is-chosen-not-discovered
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 4, '\"An Attack of Accidents,\"' discussing Aristotle's Categories and American racial classification. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Racial categories are famously difficult to establish for many reasons, not the least of which is that the races can mix. There being no natural boundaries, what is the essence of “white” or “black”? In America, where social formation depends so heavily on these designations, the bizarre fiction developed that “one drop” of “black” blood consigns an individual to the category “black.” One drop makes the essence; fifty drops of “white” blood are accidents."
canonical-instances:
  - "A club's membership rule treats one disqualifying past infraction as permanently defining ('once a cheater, always a cheater') while treating years of subsequent honest conduct as mere accident that doesn't change the underlying category, and the asymmetric weighting itself, not any neutral logic, is what makes the single infraction essential and the years of good conduct incidental."
  - "A hiring committee treats one non-traditional item on a resume (a gap year, a career change) as essentially disqualifying while treating dozens of conventional qualifications as merely accidental background, revealing that the committee's actual essence/accident split tracks a narrow definition of a 'serious candidate' rather than any principled read of what predicts job performance."
critical-questions:
  - "Does exposing the arbitrary weighting behind a category's essential trait actually delegitimize the category, or can a category be historically contingent in its construction and still function coherently and even usefully once established, regardless of how it originated?"
  - "Is there ever a case where an asymmetric essential/accidental weighting is defensible on grounds other than self-interest, such as erring toward inclusion in a protected category for people's benefit rather than exclusion, and does the diagnostic distinguish between weightings that harm versus protect the people being categorized?"
  - "If all essence/accident weightings are ultimately chosen rather than discovered, does that make the distinction useless for any category, including ones like 'apple' that seem to work cleanly, or does the arbitrariness specifically concentrate in categories about socially contested groups?"
