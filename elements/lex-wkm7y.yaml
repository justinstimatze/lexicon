id: lex-wkm7y
name: a-shared-incentive-to-believe-undermines-a-groups-apparent-consensus
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When many people who share the same desperate circumstances converge on the same hopeful belief, a bystander can treat that consensus as non-independent evidence -- discounting it not by disputing the belief's content but by naming the shared incentive that could produce the same false-positive belief in everyone regardless of whether it's true. Watching his hungry, starving people rally around news of a coming Messiah, Black Elk withholds belief for an entire winter and spring: 'I thought maybe it was only the despair that made people believe, just as a man who is starving may dream of plenty of everything good to eat.' The many believers aren't treated as many independent confirmations -- they're treated as one shared cause, hunger, producing one correlated effect across a whole population at once."
related: []
evokes: [black-elk-speaks, the-messiah, a-man-who-is-starving-may-dream-of-plenty, only-the-despair-that-made-people-believe, i-did-not-yet-believe]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch21-the-messiah
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 21, 'The Messiah.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "I did not go over there to hear, because I did not yet believe. I thought maybe it was only the despair that made people believe, just as a man who is starving may dream of plenty of everything good to eat."
canonical-instances:
  - "An investor hears that an entire industry's analysts have converged on optimistic projections for a struggling sector, and discounts the apparent consensus on noticing that every analyst's firm holds large positions that only pay off if the projections come true."
  - "A doctor notices that every patient in a support group reports the same alternative remedy worked for them, and treats the shared testimonial not as independent confirmation but as evidence that desperation for relief produces the same reported effect regardless of whether the remedy does anything."
  - "A journalist covering a besieged town notices that every resident interviewed believes reinforcements are coming soon, and reports the belief as a symptom of the siege's desperation rather than as independently corroborated intelligence about actual troop movements."
critical-questions:
  - "Does naming desperation as the common cause of belief actually settle whether the prophecy is true, or does it just supply a reason to doubt the consensus while leaving the underlying question exactly as open as before?"
  - "Black Elk eventually converts to belief himself after personally witnessing the dance, partly while grieving his own father's recent death -- does his earlier diagnosis of others' desperation-driven belief apply just as well to his own later change of mind?"
  - "Is discounting a starving population's shared hope as an artifact of hunger a fair diagnosis, or does it risk dismissing the one thing, direct testimony from three trusted, specific eyewitnesses who made the actual journey, that would ordinarily count as real evidence regardless of anyone's hunger?"
status: active
