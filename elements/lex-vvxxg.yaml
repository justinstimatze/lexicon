id: lex-vvxxg
name: attempts-to-sully-the-incorruptible-only-polish-it-brighter
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An attempt to smear or discredit something whose fundamental nature resists corruption can end up drawing more attention to it, or improving its visible condition, precisely because the material being attacked converts the attempted damage into something closer to maintenance. In the Jataka's tale of the crystal cave, boars terrified by a lion's reflection in crystal walls try to hide it by rubbing mud over the surface: 'So they got some mud from a pool close by, and rubbed and rubbed the crystal with it. But the crystal, being constantly polished by the boars' bristles, got brighter than ever.' The attack and the polish were the same physical action. Only the material determined which one it actually was."
related: []
evokes: [jataka, tikanipata, manisukara-jataka, an-attack-on-an-incorruptible-target-converts-into-maintenance, the-attempted-smear-and-the-polish-are-the-same-action]
