name: matching-a-gifts-exact-value-signals-you-want-the-relationship-to-end
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone reciprocates a gift or favor, check whether they matched its value exactly or deliberately came in a bit above or below -- because in an ongoing relationship, exact settlement reads as a signal to end things, while a slightly unbalanced return signals the relationship is meant to continue. Graeber's account of Tiv gift exchange in rural Nigeria makes this explicit: neighbors' small gifts 'did have to be returned,' but 'above all, that one did not bring the exact cost' back -- 'it had to be either a bit more or a bit less.' Both failure modes carry a real social cost, but they're opposite failures: 'to bring back nothing at all would be to cast oneself as an exploiter or a parasite. To bring back an exact equivalent would be to suggest that one no longer wishes to have anything to do with the neighbor.' Precise settlement is available to people who plan to walk away from each other once a transaction closes -- a buyer and a seller, say. Among people who intend to keep dealing with each other indefinitely, the account has to stay perpetually and deliberately a little unbalanced, because a perfectly balanced account removes the one thing still pulling both parties back into contact."
related: [lex-qbbav]
evokes: [david-graeber, debt-the-first-5000-years, tiv-gift-exchange, laura-bohannan, exact-equivalent-ends-the-relationship, deliberately-unbalanced-accounts]
lineage:
  - source: primary
    text: graeber-2011-debt-exact-reciprocation-ends-relationship
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.5 'A Brief Treatise on the Moral Grounds of Economic Relations,' section 'Exchange,' citing Laura Bohannan's fieldwork among the Tiv of rural Nigeria."
    quote: "“Eventually, two women adopted her and explained that all such gifts did have to be returned. It would be entirely inappropriate to simply accept three eggs from a neighbor and never bring anything back. One did not have to bring back eggs, but one should bring something back of approximately the same value. One could even bring money—there was nothing inappropriate in that—provided one did so at a discreet interval, and above all, that one did not bring the exact cost of the eggs. It had to be either a bit more or a bit less. To bring back nothing at all would be to cast oneself as an exploiter or a parasite. To bring back an exact equivalent would be to suggest that one no longer wishes to have anything to do with the neighbor.”"
canonical-instances:
  - "The direct textual anchor: Graeber describes the aggregate pattern this produces across an entire community -- Tiv women 'might spend a good part of the day walking for miles to distant homesteads to return a handful of okra or a tiny bit of change, \"in an endless circle of gifts to which no one ever handed over the precise value of the object last received\"—and in doing so, they were continually creating their society.' The permanent, deliberate imprecision is doing the actual maintenance work, and the exchange itself is just the occasion for it."
  - "Hypothetical: a freelance designer does a favor for a longtime client, touching up a logo for free. The client insists on paying and sends exactly what a market-rate invoice would total for that work -- correct to the dollar. The designer reads this as the client formally converting the relationship from ongoing goodwill to arm's-length transactions, even though nothing was said, because a precisely matched payment closed the account rather than leaving anything owed either way."
critical-questions:
  - "Is the 'bit more or bit less' rule doing real relationship-signaling work, or could it just as easily be explained by the practical difficulty of ever finding an item of genuinely identical value to reciprocate with -- meaning near-misses might be incidental rather than a deliberately coded signal?"
  - "Does this generalize past small-scale, face-to-face communities where reciprocity is tracked informally and personally, or does it break down in settings with formal accounting (a company ledger, a legal contract) where exact settlement is the norm precisely because the relationship is meant to be transactional rather than ongoing -- meaning the rule might describe a specific social register rather than a general principle of relationships?"
