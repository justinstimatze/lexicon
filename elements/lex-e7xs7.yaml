id: lex-e7xs7
name: destroying-the-tradition-that-carries-a-value-destroys-the-value
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a program proposes tearing down an institutional or traditional framework in order to finally realize the values it claims that framework has been suppressing, check whether those values can actually survive the framework's removal -- Popper argues they structurally cannot. His claim about revolution: it 'always destroys the institutional and traditional framework of society,' and this 'must thereby endanger the very set of values for the realization of which it has been undertaken,' because 'a set of values can have social significance only in so far as there exists a social tradition which upholds them.' A value lives inside specific practices, institutions, and shared expectations, and dismantling those removes the only thing that was making the value operative in anyone's actual life. Worse, the destruction can't be stopped at the point you intended: 'if you begin to revolutionize society and to eradicate its traditions, you cannot stop this process if and when you please. In a revolution, everything is questioned, including the aims of the well-meaning revolutionaries; aims which grow from, and which were necessarily a part of, the society which the revolution destroys.' The revolutionaries' own aims were themselves a product of the tradition being torn down, so there's no guarantee the aims survive the tearing-down any better than anything else in it did. Diagnostic move: before backing a plan to dismantle the framework that currently embodies a value in order to better realize that value, ask what specifically will carry the value once the framework is gone -- if the honest answer is 'the revolutionaries' own good intentions,' notice that those intentions are themselves a product of the very framework being removed, with no guaranteed way to survive its removal intact."
