id: lex-qp3df
name: the-fire-that-saves-you-from-cold-can-be-what-finds-you
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "The same signal that keeps you alive against one threat can be exactly what exposes you to another, and there's no way to have the benefit without also broadcasting the risk. In Cushing's telling, a lost maiden finds a cave and rebuilds a dying fire to survive a night of falling snow -- an unambiguously correct decision that saves her from freezing. But a Cannibal Demon roaming the same dark valley sees precisely what the fire was built to be seen as: warmth and shelter. 'One of the Cannibal Demons of those days ... had seen the light of her fire through the cave entrance, with his terrible staring eyes, and assuming it to be a lost wanderer, had cried out, and so led her to guide him to her place of concealment.' The fire didn't fail her -- it did exactly what fires do, warm the person who lit it and announce their location to anything else in the dark that's looking for warmth. Both effects come from the identical light; there was no version of the fire that kept her warm without also being visible. Diagnostic move: when a resource is protecting you against one danger by making your position obvious, unmistakable, or attractive, recognize that you haven't solved your exposure problem by solving your survival problem -- the same signal serves both audiences, and only one of them wishes you well."
