id: lex-uanys
name: identity-directed-threat-scanning
type-in: state
type-out: posture
_tier: reaction
agent-instruction: "When threat-perception becomes identity-directed (everywhere I look, my identity is under attack), suspect identity-directed-threat-scanning. The scanning is real but the threats are partially generated by the prior; recalibrate the prior, not just the threats."
related: [lex-uz7g4, lex-u8u7y, lex-vacbr, lex-jw34x, lex-u68ue, lex-rn9ht, lex-gc6ek, lex-mmq8x]
scaffolds-from: [lex-u68ue, lex-uz7g4, lex-rn9ht]
evokes: [the-scan-is-targeted-at-what-could-unmake-who-i-am, sustained-vigilance-but-identity-shaped, threats-to-significance-are-the-salient-threats, hypervigilance-as-identity-protective-machinery, the-paranoia-has-a-narrative-not-just-an-arousal]
reactants:
  - lex-u68ue   # significance-quest: the agent in a state of significance-stake or significance-loss (identity / mattering / in-group-position at stake)
conditions:
  - "identity is genuinely at material risk; otherwise the binding becomes decorative (the agent scans for identity-threats out of habit even when identity is no longer materially at risk)"
mechanism: "lex-rn9ht hypervigilance supplies sustained threat-scanning machinery (continuous low-level monitoring for danger signals); significance-quest BINDS the threat-filter so the scanning targets threats-to-identity-and-significance specifically (in-group rejection, status-loss, belief-disconfirmation, out-group encroachment) while ignoring identity-irrelevant threats — a directed, identity-protective vigilance distinct from broad exhausting hypervigilance and from exploratory significance-quest"
catalysts:
  - "persecution-context / real out-group threat (makes the directed scan adaptive rather than purely costly)"
  - lex-uz7g4   # archetype supplies the identity-narrative the scan-direction tracks (persecuted-prophet vs besieged-defender)
products:
  - "a directed identity-protective vigilance posture; it sets the threat-prior that lex-mmq8x then defends against disconfirmation"
inhibitors:
  - "decoupling significance-from-scan (Beck-lineage cognitive therapy reframes the threat-significance link); contexts where identity is no longer at material risk"
reversibility: "self-stabilizing / autocatalytic — each detected identity-threat REINFORCES the significance-stake (proving the identity is worth defending) and the hypervigilance posture (proving the environment justifies the alertness); resists relaxation because relaxing would feel like abandoning the identity"
critical-questions:
  - "is the threat-detection calibrated to actual base-rates or amplified by the significance-stake? Hypervigilance solo over-weights ambiguous cues toward threat; this molecule routes that over-weighting through identity, making correction harder because the false-positives feel identity-protective"
  - "is the significance-stake genuinely tied to the threats being scanned, or has the binding become decorative (the agent scans for identity-threats out of habit even when identity is no longer at material risk)? Decoupling significance-from-scan is a clinical move (Beck-lineage cognitive therapy reframes the threat-significance link)"
  - "is the molecule producing protective benefit or maintaining unnecessary cost? In persecution-context (real out-group threat) the molecule is adaptive — the directed scan reduces the cost of broad hypervigilance. Outside such contexts, it can become a sustained tax on attention and energy"
  - "operationally distinct from lex-mmq8x threat-prior-sustained-against-disconfirmation: that molecule names what happens when disconfirming evidence arrives and gets re-routed to confirm the threat-prior; this molecule names the upstream identity-directed-scanning that sets the threat-prior in the first place. The two compose: this molecule generates the prior, lex-mmq8x defends it."
  - "operationally distinct from lex-vacbr identity-protective-cognition solo: lex-vacbr names the protective routing of BELIEF; this molecule names the protective routing of ATTENTION. Different cognitive surfaces; both serve identity-protection"
lineage:
  - source: primary
    text: beck-1979-cognitive-therapy-and-emotional-disorders
    citation: "Aaron Beck, Cognitive Therapy and the Emotional Disorders (Meridian / International Universities Press 1976; Plume reprint 1979) — Ch.4 'Cognitive Content of the Emotional Disorders' supplies the canonical content-specificity hypothesis: each neurotic disorder has its own thematic ideational content directed at a domain. The 'domain' of Beck's Table 1 IDEATIONAL CONTENT OF NEUROTIC DISORDERS is precisely what this molecule names as the identity-direction of vigilance — Anxiety: Danger to domain; Paranoid: Unjustified intrusion on domain; Depression: Devaluation of domain. The scanning is bound to the domain because the affective state is bound to it. (Ch.4)"
    quote: "The emotional state characteristic of each disorder is evoked by the specific content of the aberrant thinking. Sadness — the typical emotion of depression — stems from the patient's tendency to interpret his experiences in terms of being deprived, deficient, or defeated. ... The anxious patient experiences his feelings of distress by overinterpreting his experiences in terms of danger, while the paranoid patient feels intense anger because of his fixation on notions of [unjustified intrusion]. [Ch.4 — content-specificity hypothesis names the per-disorder thematic direction of cognitive content; the molecule generalizes from clinical neuroses to identity-stakes more broadly, naming the same direction-of-scan mechanism.] TABLE 1 IDEATIONAL CONTENT OF NEUROTIC DISORDERS — Idiosyncratic Ideational Content: Depression: Devaluation of domain; Hypomania: Inflated evaluation of domain; Anxiety Neurosis: Danger to domain; Phobia: Danger connected with specific, avoidable situations; Paranoid State: Unjustified intrusion on domain; Hysteria: Concept of motor or sensory abnormality; Obsession: Warning or doubting; Compulsion: Self-command to perform specific act to ward off danger. [Ch.4 Table 1 — Beck's 'domain' is what this molecule reads as identity-stake; the ideational content is what the molecule reads as the direction of the scan.]"
  - source: practitioner
    text: kruglanski-2019-3n-model
    citation: "Arie Kruglanski et al., The Three Pillars of Radicalization (Oxford 2019) — radicalized actors display sustained scanning for in-group threats (perceived out-group encroachment, perceived disrespect, perceived erasure) and the scanning intensity tracks the significance-loss. The 3N framework operationalizes the significance-quest → scanning link. Already in lex-u68ue lineage; here named as the scanning-direction step. No verbatim quote has been pulled into this entry yet."
  - source: discovery-loop
    text: score-drivermap-mining-pass-1
    citation: "The co-occurrence pass identified hypervigilance × significance_quest (23.6% strength) as a co-occurrence pair. The pair-strength reflects that score's corpus exercises identity-defending scanning patterns (status-monitoring, in-group-monitoring, threat-anticipation in identity-relevant relationships) — the molecule names a indispensable identity-design pattern, not a rare composition"
canonical-instances:
  - "persecuted-minority hypervigilance: a member of a historically-targeted group scans for signs of discrimination in workplace/public interactions. The scanning is directed (cues that signal in-group-targeting are salient; identity-irrelevant cues are background). The directedness is what makes the cost sustainable — undirected hypervigilance would be incapacitating; identity-directed hypervigilance is functional"
  - "post-layoff professional scanning: after a layoff wave, surviving employees scan for signs of next-round indicators (manager body-language, calendar-event patterns, hiring-page activity). Significance-stake (career-identity at risk) directs the scan; hypervigilance supplies the sustained attention. Counter-productive if it interferes with the work that would actually reduce next-round risk"
  - "ideologue scanning for in-group betrayal signs (post-radicalization phase): the agent identifies as a defender of in-group-purity; scans for signs of impurity (insufficient zeal in others, suspicious moderation, contact with out-group). The molecule sustains the ideological project's energy through the identity-directed scan"
  - "relationship-anxiety hypervigilance (attachment-pattern manifestation): an anxiously-attached partner scans for signs of partner withdrawal, tone-shifts, absence-patterns. Significance-stake (relationship-identity) directs the scan; the cost is the partner experiences the scanning as suffocating, which often produces the withdrawal the scanner was scanning for — a self-fulfilling loop"
  - "operationally distinct from lex-jw34x dissonance-driven-identity-defense: that molecule operates on belief-defense when dissonance arrives; this molecule operates on attention-direction continuously before threats arrive. lex-jw34x is reactive; lex-h2ehw is anticipatory. The two compose into an identity-protective stack: scanning detects → if threat materializes, defense activates"
  - "operationally compositional with lex-uz7g4 archetype-as-projective-shorthand: archetypes supply the identity-narrative the scan-direction tracks (the persecuted-prophet archetype scans for one threat-set; the besieged-defender archetype scans for another). The archetype is the slot; the scan operationalizes vigilance within the slot"
severity-tier: info
status: active
