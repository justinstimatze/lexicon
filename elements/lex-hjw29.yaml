id: lex-hjw29
name: secretly-violating-a-status-code-while-preserving-its-performance
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Someone who publicly upholds a status or purity code can secretly violate it under duress while still performing the code for an audience, discarding only the visible portion of the violation to preserve a fig-leaf of compliance — and the psychological cost of the hypocrisy can exceed the cost of the original transgression. In the Jataka's tale of the proud brahmin, a young man refuses to share a low-caste traveler's food out of caste pride, then secretly eats the man's leftovers once hungry enough, discarding only the visibly 'defiled' outer portion. Once he realizes what he's done, the shame destroys him: 'How I have disgraced my birth, my clan, my family! Why, I have eaten the leavings of a low born churl!' He wasn't punished by anyone else for the violation — the code's performance had convinced him of its own reality so completely that breaking it, even secretly, felt like an injury to himself."
related: []
evokes: [jataka, dukanipata, satadhamma-jataka, preserving-a-codes-performance-while-secretly-violating-it, internalized-status-codes-punish-their-own-violator]
lineage:
  - source: primary
    text: jataka-chalmers1895-satadhamma-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 179, Satadhamma-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "How I have disgraced my birth, my clan, my family! Why, I have eaten the leavings of a low born churl!"
canonical-instances:
  - "A strict dietary purist who publicly refuses any food that doesn't meet their standard secretly eats a forbidden snack when starving on a delayed flight, then feels a wave of self-disgust wildly disproportionate to the actual food, precisely because the identity was built on never having to make that choice."
critical-questions:
  - "Is the shame here really about the specific status code (caste, in the original), or would any sufficiently internalized purity rule — dietary, professional, religious — produce the same self-punishing reaction regardless of whether the rule itself has any independent merit?"
  - "Would public disclosure of the violation have been worse or better for him than the private shame that destroyed him — does secrecy actually protect the violator, or does it just remove the possibility of anyone helping them see the rule differently?"
status: active
