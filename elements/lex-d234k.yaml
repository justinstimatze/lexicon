lineage:
  - source: primary
    text: Weick-1995-SensemakingInOrganizations
    citation: "Karl E. Weick, *Sensemaking in Organizations* (Sage Publications 1995). Weick — University of Michigan organizational theorist (Rensis Likert Distinguished University Professor of Organizational Behavior and Psychology) — develops the foundational framework for `sensemaking` as a distinct organizational-cognition concept. The transferable claim: sensemaking is RETROSPECTIVE — meaning attaches to past action looking back, not derived from a plan and executed forward. Weick names seven foundational properties (Ch.2): identity-grounded, retrospective, enactive, social, ongoing, focused on extracted cues, driven by plausibility. The retrospective-and-enactive properties are the most transferable. The classic Weick case study (Ch.5, also Weick 1993 *Administrative Science Quarterly*) is the Mann Gulch fire disaster — Norman Maclean 1992 *Young Men and Fire* — where wildland firefighters' sensemaking system broke down catastrophically when the situation departed from their existing-frame. Weick's analysis: the men could not make sense of what was happening fast enough to act on it. The transferable form lex-d234k lifts the retrospective-construction-of-meaning-from-action claim into its general form — applicable to lab science, software architecture, career narratives, startup founding stories, LLM chain-of-thought, product strategy, engineering, and therapy/journaling. Weick's framework has been the most influential single contribution to organizational-cognition research in the past three decades, cited 50,000+ times and extended across high-reliability-organization research (Weick + Sutcliffe 2007 *Managing the Unexpected*), behavioral strategy (Maitlis 2005), institutional theory (Powell + DiMaggio extensions), and LLM interpretability (recent `motivated reasoning` literature). Debunking check applied: Weick's specific organizational theory contains contested empirical claims (the Mann Gulch reading has been disputed by Useem 2001 and others), but the STRUCTURAL claim that sensemaking is retrospective-and-enactive is well-attested across organizational behavior, cognitive psychology, and LLM-interpretability research. The atom encodes the structural primitive, not the specific empirical readings."
    quote: "[Weick 1995 Ch.1 `The Concept of Sensemaking`:] 'The concept of sensemaking is well named because, literally, it means the making of sense. Active agents construct sensible, sensable events. They \"structure the unknown.\"' [Ch.2 on retrospective property:] 'The little girl had the making of a poet in her who, being told to be sure of her meaning before she spoke, said: How can I know what I think till I see what I say?' [Ch.2 on enactive property:] 'I use the word enactment to preserve the fact that, in organizational life, people often produce part of the environment they face. ... the people are very much a part of their own environments. They act, and in doing so create the materials that become the constraints and opportunities they face.' [Weick 1993, 'The Collapse of Sensemaking in Organizations: The Mann Gulch Disaster,' Administrative Science Quarterly 38(4):628-652 — the 1995 book cites this case at note 54 rather than narrating it, and Weick's own narration is deliberately stripped of the prose it replaces:] 'The purpose of this article is to reanalyze the Mann Gulch fire disaster in Montana described in Norman Maclean's (1992) award-winning book Young Men and Fire to illustrate a gap in our current understanding of organizations. I want to focus on two questions: Why do organizations unravel? And how can organizations be made more resilient? Before doing so, however, I want to strip Maclean's elegant prose away from the events in Mann Gulch and simply review them to provide a context for the analysis. ... A lightning storm passed over the Mann Gulch area at 4 p.m. on August 4, 1949 and is believed to have set a small fire in a dead tree. The next day, August 5, 1949, the temperature was 97 degrees and the fire danger rating was 74 out of a possible 100 (p. 42), which means \"explosive potential\" (p. 79). When the fire was spotted by a forest ranger, the smokejumpers were dispatched to fight it. Sixteen of them flew out of Missoula, Montana at 2:30 p.m. in a C-47 transport.' [Practitioner-extraction for transferable lex-d234k: sensemaking is the retrospective construction of meaning from action. The transferable diagnostic generalizes far beyond organizational behavior. The seven properties Weick names are decisive for the framework; the retrospective + enactive properties are the most generalizable.]"
  - source: cross-attestation
    text: cross-domain-sensemaking-as-retrospective-construction-of-meaning-from-action
    citation: "Cross-domain attestation that retrospective-construction-of-meaning-from-action recurs across lab science, software engineering, career narratives, startup founding stories, LLM chain-of-thought, and product strategy. (a) Lab science methods sections: Bauer 1992 *Scientific Literacy and the Myth of the Scientific Method* + Latour 1979 *Laboratory Life* document how the methods section is constructed AFTER the experiment is run, with the published account selecting what to report. The hypothetico-deductive ideal (hypothesis → experiment → conclusion) is rarely the actual sequence; the sequence is more often: experiment + observation + retrospective hypothesis-and-method-construction. The transferable form of lex-d234k in scientific publication. (b) Software architecture `the design that emerged`: Fowler 2014 *Refactoring* + Hunt + Thomas 1999 *Pragmatic Programmer* + Evans 2003 *Domain-Driven Design* explicitly describe emergent design as the dominant pattern in real software development — design emerges from the action of implementation; the post-hoc architecture-document explains why-the-current-thing-makes-sense rather than what-was-planned. (c) Career narratives: Krumboltz 2009 + Pryor + Bright 2011 *The Chaos Theory of Careers* document the gap between linear-career-narrative reconstructions and actual career-development sequences, which are typically opportunistic, contingent, and only-retrospectively-coherent. (d) Startup founding-mission narratives: Sull + Eisenmann 2015 + numerous biographies of well-known companies (e.g., Airbnb's pivot from `pay rent during a conference` to `home-sharing platform`; Slack's pivot from a game) document the gap between the polished founding-narrative and the messy iterative reality. The elegant founding-mission is constructed retrospectively to make the surviving-company's path appear inevitable. (e) LLM chain-of-thought: Lyu et al 2022 + Turpin et al 2023 + Chen et al 2024 (Anthropic interpretability research) document `motivated reasoning` in LLMs — the chain-of-thought is often POST-HOC justification of an already-computed answer, not the actual reasoning process. This is direct transferable confirmation: even artificial reasoning systems exhibit retrospective sensemaking. (f) Product strategy in tech companies: the strategy-document is typically constructed after the product roadmap has been set by other forces (engineering capacity, customer demand, founder intuition); the strategy retrospectively rationalizes what was already going to happen. (g) Engineering refactor: a refactor makes the existing code make sense, not the other way around. The refactored architecture is the retrospective construction of meaning from the action of having built the code in a particular way. (h) Therapy + journaling: Bruner 1990 *Acts of Meaning* + Pennebaker 1997 *Opening Up by Writing It Down* document the therapeutic mechanism as retrospective narrative-construction making the messy-action-sequence coherent. The cross-domain attestation establishes the transferable structural form: meaning attaches retrospectively to action, not derived from plan to execution."
    quote: "Across lab science methods sections (Bauer 1992, Latour 1979), software architecture (Fowler 2014, Evans 2003), career narratives (Krumboltz 2009, Pryor + Bright 2011), startup founding stories (Sull + Eisenmann 2015), LLM chain-of-thought (Lyu et al 2022, Turpin et al 2023, Chen et al 2024 Anthropic), product strategy, engineering refactor, and therapy + journaling (Bruner 1990, Pennebaker 1997), the same structural form recurs — sensemaking is retrospective construction of meaning from action, not plan-then-execute. The transferable diagnostic: when analyzing an actor's behavior, distinguish the action-sequence (what was done) from the sense-making artifact (the post-hoc narrative); the relationship between them is typically retrospective, not anticipatory."
