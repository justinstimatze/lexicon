id: lex-a5dmb
name: simulation-as-diagnostic-probe
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When you can't directly observe a system, simulate it as a diagnostic probe. Build the simplest simulation that reproduces the observed behavior; the simulation's required structure constrains what the real system must contain."
related: [lex-y6pqz, lex-gng22, lex-hfcae, lex-th6tr, lex-ts4qp, lex-ah2es, lex-ctnnx, lex-akfgc, lex-p48xw, lex-eb3wf, lex-rzgzr, lex-xuna9, lex-xz9br]
scaffolds-from: [lex-gng22]
evokes: [the-mousetrap, play-within-as-instrument, wargame-the-decision, A-B-test-the-tell, role-play-as-tell-elicitor, controlled-perturbation-on-the-target, the-confederate-experiment]
lineage:
  - source: primary
    text: shakespeare-hamlet-act-II-scene-ii
    citation: "William Shakespeare, *Hamlet, Prince of Denmark* (c. 1599-1601, First Folio 1623), Act II scene ii closing soliloquy + Act III scene ii (the canonical 'play within a play'). Hamlet, uncertain whether the ghost's accusation is veridical, constructs a diagnostic instrument: stage *The Murder of Gonzago* (called *The Mousetrap* by Hamlet) before Claudius, observe Claudius's reaction at the moment that corresponds to Hamlet's hypothesis (the poisoning-via-ear). The construction is the literary archetype of the simulation-as-diagnostic-probe: rather than asking Claudius directly (which the suspect would deny) or relying on Hamlet's own inference (which could be motivated-reasoning), construct a re-presentation that, if the hypothesis is true, will produce a tell in the target's behavior. lines 37139-37140 (the central 'play's the thing' statement) + lines 37123-37133 (the explicit operational logic)."
    quote: "[Hamlet II.ii closing soliloquy lines 37123-37140:] 'About, my brain! I have heard / That guilty creatures sitting at a play, / Have by the very cunning of the scene, / Been struck so to the soul that presently / They have proclaim\\'d their malefactions. / For murder, though it have no tongue, will speak / With most miraculous organ. I\\'ll have these players / Play something like the murder of my father / Before mine uncle. I\\'ll observe his looks; / I\\'ll tent him to the quick. If he but blench, / I know my course. The spirit that I have seen / May be the devil, and the devil hath power / T\\'assume a pleasing shape, yea, and perhaps / Out of my weakness and my melancholy, / As he is very potent with such spirits, / Abuses me to damn me. I\\'ll have grounds / More relative than this. The play\\'s the thing / Wherein I\\'ll catch the conscience of the King.' [The transferable operational shape: Hamlet (1) names his hypothesis (Claudius murdered Hamlet's father); (2) names his uncertainty (the ghost may be a deceiving devil); (3) constructs a controlled probe that produces a tell IF the hypothesis is true; (4) commits to observe-not-influence ('I\\'ll observe his looks'); (5) pre-specifies the predicted tell ('if he but blench'). The full structure of a designed diagnostic instrument, articulated ~400 years before the formal experimental-psychology literature on confederate-elicitation paradigms.]"
  - source: practitioner
    text: moreno-1934-1953-psychodrama-as-diagnostic
    citation: "Jacob L. Moreno, *Who Shall Survive? A New Approach to the Problem of Human Interrelations* (1934, 1st ed.; 2nd revised ed. 1953 Beacon House). The founding text of psychodrama and sociometric measurement. Moreno's central technique is the staged enactment of social situations to elicit responses that introspection alone cannot reach. The 'protagonist' (target) and 'auxiliary egos' (confederates) re-enact a problem-situation; the protagonist's reactions, choices, and resistances become diagnostic data unavailable through interview. Independent attestation in 20th-century clinical-psychology of the simulation-as-diagnostic-probe pattern.; in-copyright; procurement queued. No verbatim quote is claimed here — the paraphrase above carries the substantive claim. Moreno + Hamlet show the pattern's cross-tradition convergence."
  - source: practitioner
    text: cross-domain-pattern-synthesis-v45
    citation: "Cross-domain attestation: police-interrogation reverse-projection (the detective re-tells the suspect's claimed alibi back to them, observing which details the suspect corrects and which they let stand; the 'Reid technique' formalization); A/B testing in product design (rather than asking users 'do you prefer X', deploy X and Y to user-segments and observe which produces the target behavior — the user's actual choice is the tell); military wargaming (the planner constructs a controlled-simulation of the operational situation, observes how the team responds under simulated pressure, identifies the doctrinal gaps); economic confederate-experiments (Asch 1951 conformity; Milgram 1963 obedience; the confederate generates the experimental probe, the subject's response is the diagnostic data); architectural mockup / pre-occupancy evaluation (build a temporary mock-up of the proposed space, observe how occupants actually use it, refine the design); software canary deployment (deploy the change to 1% of traffic, observe metrics, decide whether to ramp). Multi-substrate cross-attestation across literature, clinical-psychology, law-enforcement, product-design, military-doctrine, social-psychology, architecture, and software-engineering. The pattern is system-topological."
    quote: "[Cross-domain consistency check, 2026-05-23: 8 instantiations across literary-canonical (Hamlet ~1601), clinical-psychology (Moreno psychodrama 1934-1953), law-enforcement (Reid-technique reverse-projection), product-design (A/B testing), military-doctrine (wargaming), social-psychology experimental method (Asch 1951, Milgram 1963 confederate paradigms), architecture (pre-occupancy mockup evaluation), and software-engineering (canary deployment). All exhibit the same structural shape: rather than INTERROGATE the target directly (which fails because the target may not know, may not say, or may say strategically), construct a controlled re-presentation of the situation-of-interest and observe the target's response to it. The target's behavior in the simulated situation is the diagnostic data. The pattern is cross-substrate and the operational logic is identical across 400 years of independent attestation. Distinct from lex-hfcae expectancy-violation in that simulation-as-probe is INSTRUMENT-DESIGN for elicitation; expectancy-violation is what the LEARNER updates on once an expectation is violated. Distinct from lex-y6pqz toy-model-then-perturb in that toy-model is structure-investigation (drop a body to see how the dynamics simplify); simulation-as-probe is target-elicitation (re-present to surface the target's tell). They can co-fire when the diagnostic probe IS a toy model.]"
canonical-instances:
  - "the Mousetrap canonical case (Shakespeare *Hamlet* II.ii-III.ii lines 37123-37140 + Act III scene ii): Hamlet stages *The Murder of Gonzago* (re-named *The Mousetrap*) before Claudius. The dumb-show + the dialogue reproduce the hypothesized poisoning-via-ear. Hamlet positions himself to observe Claudius's reaction at the critical moment. Claudius's interruption (calling for lights and exiting) is the predicted tell. The literary archetype — and the explicit articulation by Hamlet of WHY the design works ('guilty creatures sitting at a play, / Have by the very cunning of the scene, / Been struck so to the soul')"
  - "the A/B-test canonical case (modern product-design, e.g. Kohavi-Longbotham 2017 *Online Controlled Experiments*): rather than asking users 'would you click this button if it were green' (which produces inaccurate self-report data), deploy the green button to 50% of users and the control color to 50%, observe click-through rates. The deployment IS the diagnostic instrument; the user's actual behavior in the simulated-natural environment is the tell. Cross-substrate attestation with Hamlet — same operational logic, different substrate (web-traffic vs. court theater)"
  - "the Reid-technique reverse-projection canonical case (Inbau-Reid-Buckley *Criminal Interrogation and Confessions* 1962, 5th ed. 2011): the interrogator re-tells the suspect's claimed alibi back to them in slightly modified form ('so you were at the bar from 8 PM until 11 PM, you had two beers, and you took an Uber home') and observes which details the suspect corrects vs. lets stand. Strategic-suspect corrects only what would impair their alibi; non-strategic-suspect corrects everything that's inaccurate. The CORRECTION-PATTERN is the diagnostic. Same operational structure as the Mousetrap: present a re-construction, observe the target's response, infer the underlying truth"
  - "the wargame canonical case (Perla 1990 *The Art of Wargaming*; the U.S. Naval War College's century of practice): the planner constructs a controlled-simulation of an operational situation (Red Force vs. Blue Force, scripted constraints, time-compressed decision-cycles), runs the simulation, observes the doctrinal gaps and coordination failures that the simulation surfaces. The wargame IS the diagnostic instrument; the team's behavior in the simulated crisis is the diagnostic data unavailable from doctrinal review. Military-doctrine substrate attestation"
  - "the architectural-mockup canonical case (Brand 1994 *How Buildings Learn* + Frampton 1995 *Studies in Tectonic Culture* on pre-occupancy evaluation): before constructing a major architectural feature, the architect builds a temporary 1:1 mock-up using inexpensive materials (foam-core, scaffold) and invites the eventual occupants to use the mockup for a period. The occupants' actual behaviors in the mock-up — which paths they choose, where they gather, what they avoid — diagnose design problems no review of plans would catch. Visual/material substrate instance per ulti-modal lens — the mockup is a literal physical simulation-as-probe"
  - "the canary-deployment canonical case (software-engineering, Krishnan 2017 + standard SRE practice): rather than deploy a change to 100% of traffic at once, deploy to 1-5% (the 'canary') first, observe the canary's metrics for elevated error-rates / latency / regression-indicators, decide whether to ramp or roll-back. The canary IS the diagnostic probe; the system's behavior under the new code on a small slice is the tell about how it will behave on the full slice. Same operational logic as the Mousetrap, scaled to distributed-systems substrate"
  - "operationally distinct from lex-hfcae expectancy-violation-as-learning-mechanism: expectancy-violation names what the LEARNER does (update against violated predictions). Simulation-as-diagnostic-probe names what the OBSERVER constructs (a controlled situation that will produce a tell). The two are operationally separate: the Mousetrap's purpose is for HAMLET to learn (about Claudius's guilt); the expectancy-violation in Claudius is the SUBJECT of the observation, not the operation. They co-fire (a well-designed probe produces expectancy-violations in the target whose telltale is the data) but the atoms describe different sides of the interaction"
  - "operationally distinct from lex-gng22 perspective-shift-via-imagined-other: perspective-shift is INTERNAL ('what would my close friend say about this?' — a mental simulation by the actor to find their own answer). Simulation-as-diagnostic-probe is EXTERNAL — construct a real-world re-presentation to elicit a real-world response from a target. The two are paired: perspective-shift is solo, probe-construction is interpersonal/social. They can co-fire (the probe designer perspective-shifts to predict the target's response before constructing the probe)"
  - "operationally distinct from lex-y6pqz toy-model-then-perturb: toy-model-then-perturb is STRUCTURE-INVESTIGATION (drop a body to see how 3-body dynamics simplify into solvable 2-body; perturb back). Simulation-as-diagnostic-probe is TARGET-ELICITATION (re-present a situation to surface a target's behavior under that situation). They are paired-but-distinct: the toy-model investigates the dynamics; the diagnostic-probe investigates the responding-actor. They can co-fire (the diagnostic probe IS a toy model of the situation-of-interest), but the targeting differs"
  - "operationally adjacent to lex-th6tr: a well-designed diagnostic probe is robust — it produces a clear tell under multiple plausible-true variants of the hypothesis. The Mousetrap is robust to Claudius's specific guilty-reaction-style (whether he calls for lights or exits silently or interrupts the play, any of those reactions is the tell). Probe-design discipline: construct the probe so the SPACE of guilty-responses is distinct from the space of innocent-responses across multiple plausible-true variants"
  - "operationally adjacent to lex-ts4qp: the probe must include a PRE-SPECIFIED PREDICTION of what counts as a positive vs. negative tell, made BEFORE the observation. Hamlet pre-commits: 'if he but blench, I know my course.' Without pre-specification, the probe degenerates into post-hoc interpretation where the observer reads-in their hypothesis. Discipline: write down what counts as the tell before running the probe"
critical-questions:
  - "the pre-specification test: did you write down what counts as a positive tell BEFORE running the probe? Without pre-specification, post-hoc interpretation rules and the probe loses its diagnostic value. Practitioner-discipline: in writing, name the tell (Hamlet: 'if he but blench, I know my course') before deploying the probe"
  - "the target-aware vs. target-unaware question: is the target aware they are being probed? Hamlet's Mousetrap is target-aware (Claudius knows he's at a play but doesn't know it's a probe); A/B testing is typically target-unaware (users don't know they're in a treatment cell); some clinical psychodrama is target-aware (the protagonist knows they're enacting). The awareness-condition shapes what counts as a clean tell — a target who suspects probing may strategically suppress the tell. Practitioner-discipline: design the probe so its diagnostic value survives the target's possible awareness"
  - "the construct-validity question: does the simulated situation accurately re-present the situation-of-interest? A mockup that abstracts away the pivotal variable produces tells that don't generalize. Practitioner-discipline: identify which features of the situation-of-interest must be faithful in the probe vs. which can be abstracted. The Mousetrap reproduces the murder-method but not the Danish-royal-court context; that abstraction works because Claudius's guilty conscience is in the method-recognition, not the context"
  - "the observer-bias control: the probe's observer often has a hypothesis they want confirmed. Without controls, the observer reads-in confirming tells where neutral observers wouldn't. Practitioner-discipline: pre-specify the tell-criteria in writing; use a second observer blind to the hypothesis when possible; record the probe for later third-party verification. Hamlet uses Horatio as a second observer ('Observe my uncle... If his occulted guilt / Do not itself unkennel in one speech') — explicit observer-redundancy"
  - "the ethics-of-deception consideration: many simulation-as-probe applications involve some degree of target-deception (Asch's confederate-experiment; Milgram's obedience-study; police-interrogation reverse-projection). The deception is operationally necessary (the probe doesn't work if the target knows the structure) but raises ethical questions. Practitioner-discipline: distinguish probes whose value justifies the deception-cost (clinical-diagnosis, criminal-investigation) from probes whose value does not (commercial-marketing manipulation, paltering — see lex-d7h2y). Modern IRB protocols formalize this distinction"
  - "the failure-mode: probe-as-self-confirmation. A poorly-designed probe is structured so that the target's behavior, whatever it is, confirms the observer's hypothesis. (Hamlet's contemporaries like Ophelia were diagnosed-mad by sequences of probes that no behavior could refute.) Practitioner-discipline: before running the probe, name what observation would FALSIFY the hypothesis (the Popper-falsification requirement, lex-gfb9k). If you cannot name a falsifying observation, the probe is not diagnostic — it is confirmation-theater"
status: active
