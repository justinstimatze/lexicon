evokes: [tetlock-mellers-scoblic-2017, bayesian-question-clusters, resolvable-indicators, macro-question-versus-micro-question, forecasting-tournaments-as-policy-tool]
lineage:
  - source: primary
    text: tetlock-mellers-scoblic-2017-bayesian-question-clusters
    citation: "Philip E. Tetlock, Barbara A. Mellers, and J. Peter Scoblic, 'Bringing Probability Judgments into Policy Debates via Forecasting Tournaments,' Science 355, no. 6324 (3 February 2017): 481-483, at p. 482."
    quote: "'Admittedly, the specificity required to make questions rigorously resolvable precludes asking 'big' questions. Take a concern such as 'Will increasing automation destabilize white-collar labor markets over the next 20 years?' Here, key terms are too ill-defined for the question to ever be answered 'yes' or 'no.' Probability estimates are therefore unhelpful. But there is a way around this problem: Subject-matter experts can generate specific resolvable indicators, each of which captures a distinct facet of the larger issue. For instance, will driverless for-hire vehicles without human supervision be taking passengers in a major American city by the end of 2017? Will IBM's Watson engine outperform top physicians in medical-diagnosis tournaments by the end of 2018? Will half of all accounting jobs be automated by the end of 2019? Each micro question has independent diagnostic value vis-a-vis the macro question. Taken together, these 'Bayesian question clusters' can help policy-makers better prepare for looming megachanges.'"
canonical-instances:
  - "The paper's own worked example, restated: instead of forecasting whether automation will 'destabilize white-collar labor markets' — a claim with no fixed resolution date and no agreed definition of 'destabilize' — the authors propose three separately checkable proxies (driverless taxis operating unsupervised by end of 2017, an AI diagnostic tool beating physicians by end of 2018, half of accounting jobs automated by end of 2019). The pattern across all three says something the original question could never have been directly scored on."
  - "Hypothetical: a venture firm wants to bet on whether 'AI will transform healthcare,' a claim too broad to falsify either way. Instead it tracks a cluster of dated proxies — an FDA-cleared diagnostic tool beating radiologists on a named cancer screen by a named year, a hospital system replacing a specific triage role by a specific year — and lets the pattern across proxies, not any one of them alone, inform the broader bet."
  - "Hypothetical: a national-security team debating whether a rival power's 'rise' threatens regional stability breaks the debate into resolvable indicators — a named territorial dispute escalating to armed confrontation by a named year, a specific trade agreement collapsing, a specific alliance publicly fracturing — rather than arguing the unscorable question directly."
critical-questions:
  - "Who chooses which proxies belong in the cluster, and does that choice quietly decide the answer to the macro-question in advance? A cluster stacked with proxies favorable to one side's expectations isn't independent evidence — the same selection risk reference-class choice raises for outside-view forecasting."
  - "How is the pattern across proxies supposed to combine into a verdict on the macro-question? Two out of three resolving 'yes' isn't automatically proof the macro-claim is true — the aggregation rule needs fixing in advance, or it's just a story fitted afterward to whatever happened to occur."
  - "Does decomposition risk replacing one hard, important question with several easier, less important ones — winning the individual proxy bets while missing the actual macro-outcome the cluster was supposed to be tracking?"
