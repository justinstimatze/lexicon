lineage:
  - source: primary
    tradition: cognitive-developmental-psychology
    text: bruner-1960-process-of-education
    citation: "Jerome Bruner, The Process of Education (Cambridge, MA: Harvard University Press, 1960), the report of the 1959 Woods Hole curriculum conference. Ch.2 'The Importance of Structure,' pp.23-26, lays out the four claims verbatim (comprehensibility, memory, transfer, narrowing the elementary/advanced gap) in that order and in Bruner's own numbering ('The first is...', 'The second point...', 'Third...', 'The fourth claim...'). Two scan notes for whoever checks this: 'placed-into' in the memory sentence carries a hyphen artifact from the source scan's line-wrap, not a stylistic choice; and the fourth claim's own opening clause ('The fourth claim for emphasis on structure and principles in teaching is that') is paraphrased in this citation rather than quoted, because a page break splits 'principles' mid-word around the running head in the extracted text — the quote below picks the fourth claim back up at the first clean unbroken span after that break."
    quote: "'Inherent in the preceding discussions are at least four general claims that can be made for teaching the fundamental structure of a subject... The first is that understanding fundamentals makes a subject more comprehensible... The second point relates to human memory. Perhaps the most basic thing that can be said about human memory, after a century of intensive research, is that unless detail is placed-into a structured pattern, it is rapidly forgotten... A good theory is the vehicle not only for understanding a phenomenon now but also for remembering it tomorrow. Third, an understanding of fundamental principles and ideas... appears to be the main road to adequate “transfer of training.” To understand something as a specific instance of a more general case... is to have learned not only a specific thing but also a model for understanding other things like it that one may encounter... by constantly reexamining material taught in elementary and secondary schools for its fundamental character, one is able to narrow the gap between ‘advanced’ knowledge and ‘elementary’ knowledge.'"
canonical-instances:
  - "the falling-body case Bruner himself gives: a scientist does not memorize a handbook of distances, times, and gravitational constants for every combination — he carries the formula s = ½gt² and regenerates whatever specific distance he needs from it. The formula lets him produce any of those numbers on demand, something a plain list of distances and times never would"
  - "the tides case: a student who memorizes 'the moon pulls the water into a bulge' cannot explain the second bulge on the far side of the earth, or where the crest actually lags — because the fact was learned without the structural idea (gravity acting on a free elastic body, inertia) that would have made the second bulge predictable rather than a separate fact to memorize"
  - "a mathematics course that teaches the distributive property as the reason multiplication algorithms work, rather than teaching each algorithm (long multiplication, FOIL, polynomial expansion) as an unrelated recipe to be drilled separately — one structural idea generates all of the specific procedures instead of competing with them for memory"
  - "onboarding a new engineer onto a codebase by teaching the architecture and the invariants it enforces, rather than handing over a list of 'when X happens, do Y' runbook entries. Someone who has the architecture can see why any given runbook entry exists and can work out the right response to a situation no entry covers — a pile of memorized entries, on their own, offers no such route"
  - "operationally distinct from lex-345ta and lex-dun6c's Merton/Labov material: those atoms are about the SOCIAL cost and signal of adopting a group's norms or standards; this atom is about the COGNITIVE architecture of what makes learned material usable later. Different Woods-Hole-adjacent tradition (educational psychology) from the structural-functionalist and variationist-sociolinguistic traditions those draw on"
critical-questions:
  - "is the 'structure' being taught actually the discipline's own organizing principle, or a teacher's convenient simplification mistaken for one? Bruner's own caution (echoed by later critics of 1960s 'structure of the disciplines' curricula, e.g. the New Math backlash) is that a structure imposed for pedagogical convenience, rather than discovered from the discipline's actual logic, can be just as brittle and unmemorable as the isolated facts it replaced — it has the FORM of structure without the function"
  - "does the transfer claim actually hold for THIS structural idea, or only for the ones Bruner illustrated? The atom's own text flags this as needing more research even in 1960 — treat 'principle X will transfer' as a claim to verify against a genuinely novel instance, not as automatic once a principle has been stated"
  - "is the audience's developmental stage able to hold the structural version at all, or does presenting the principle before enough concrete instances actually reduce comprehension rather than aid it? This atom names a trade Bruner is making, one that can fail for a given learner or subject even where the general argument holds"
  - "for the codebase/organizational instances: was the 'architecture' actually written down before it started predicting runbook entries, or assembled afterward to fit entries that were really generated ad hoc? A structural account earns the name only by generating testable predictions about cases nobody has hit yet"
