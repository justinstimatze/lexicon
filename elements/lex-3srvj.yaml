evokes: [popper-prediction-and-prophecy-in-the-social-sciences, naive-collectivism, methodological-individualism, social-wholes-are-postulates, the-middle-class-as-ideal-object]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Prediction and Prophecy in the Social Sciences' (address delivered to the Plenary Session of the 10th International Congress of Philosophy, Amsterdam, 1948), Ch. 16 of Conjectures and Refutations (Routledge Classics, 2002), p.459-460, Section VII."
    quote: "'This view must be rejected as naive. It completely overlooks the fact that these so-called social wholes are very largely postulates of popular social theories rather than empirical objects; and that while there are, admittedly, such empirical objects as the crowd of people here assembled, it is quite untrue that names like \"the middle-class\" stand for any such empirical groups. What they stand for is a kind of ideal object whose existence depends upon theoretical assumptions. Accordingly, the belief in the empirical existence of social wholes or collectives, which may be described as naive collectivism, has to be replaced by the demand that social phenomena, including collectives, should be analysed in terms of individuals and their actions and relations.'"
canonical-instances:
  - "A product review claims 'users want a simpler interface,' treating 'users' as a single entity with one preference. The actual data shows three distinct usage patterns with three different, partly conflicting preferences -- 'users' was never an observed thing wanting anything; it was a placeholder for a theory about who the customer base is that nobody had stated out loud."
  - "A market analyst says 'the market is worried about inflation,' as though the market were a single mind. What actually exists is a large number of individual traders placing individual orders on individual, often conflicting expectations. The sentence compresses an aggregate pattern in those orders into the shape of one entity's mental state, and that compression is exactly what hides which traders are doing what, and why."
critical-questions:
  - "Isn't talking about 'the middle class' or 'the market' just an unavoidable, useful shorthand -- does the atom really forbid using it? No -- the atom doesn't forbid the shorthand, it flags when an argument's validity secretly depends on treating the shorthand as an observed thing rather than a construction. 'The market fell today' is harmless as a summary; 'the market wants X, so we should do Y' is where the naive-collectivism error does real damage, because it smuggles in a theory about aggregate preference that was never stated or checked."
  - "Doesn't reducing everything to individuals miss real group-level phenomena -- network effects, culture, institutions that outlast any individual member? Popper's target is the ontological claim that the group is an observed thing on the same footing as a person, not a denial that group-level patterns are real and worth studying. The demand is to explain those patterns in terms of individuals and their relations -- how the network effect actually propagates from one person to the next, how the institution's rules actually get enforced by particular people. Skip that and the group-level label itself gets treated as a cause with a will of its own."
