lineage:
  - source: primary
    text: radin-trickster-chases-celebratory-noise-that-is-only-flies-in-an-elk-skull-and-gets-trapped
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episodes 31-32. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Well, I wonder what these people are up to? I guess I will go over and see for I have not had any fun for a long time. Whatever they are doing, I will join them. If they are going to dance, why I will dance too. I used to be a fine dancer.' ... Not far away, however, he saw, lying around, the bones of an animal and, farther still, he saw an object that turned out, on closer inspection, to be an elk's skull. ... The head was filled with many flies. ... They would go inside and then, when they rushed out, they made the noise that he had heard and which he had taken to be shouting. ... 'Younger brothers, you are certainly having a lot of fun. You surely are doing an important thing. I would very much like to be like one of you. How can I do it? Do show me how I can do it so that I, too, can join you.' ... 'If you wish to come in just say, 'Neck, become large!' and it will become large. In that way you can enter.' ... So he sat down and said, 'Neck, become large!' and the hole in the neck became large. Then he put his head in and entered. He put his head in up to his neck. All the flies ran away and the opening into which he had thrust his head became small again. Thus he was held fast."
canonical-instances:
  - "Someone scrolls past a stranger's photos of a wild-looking party and, feeling left out of the apparent fun, tracks down and joins the event, only to discover on arrival that the crowd is thin and the excitement was mostly camera angles and filters, and still stays and spends money trying to feel the version of fun they saw online."
  - "An investor hears about a booming private trading group generating loud excitement and profit talk, investigates and finds the 'gains' are mostly members hyping each other up with no real returns behind them, and still puts money in anyway because the appeal was never really about the returns, it was about not being left out of what looked like everyone else's good time."
critical-questions:
  - "Does Trickster's envy persist because he genuinely still believes there's something valuable inside the skull worth accessing, or because the desire to belong operates independently of any belief about what's actually there -- does the story distinguish between these two possibilities?"
  - "Would stopping to ask why flies specifically enjoy this, rather than immediately asking how to join, have changed the outcome, or was the trap set regardless of how much Trickster understood before entering?"
  - "Is there a meaningful difference between chasing a sound that turns out to be nothing and chasing a sound that turns out to be something real but not worth what it costs to join -- does the diagnostic here apply equally to both, or only to the case of genuine hollowness?"
status: active
