id: lex-exssy
name: possessing-the-coveted-thing-invites-attack-relinquishing-it-ends-attack
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'Watching a chain of birds attack whichever one currently holds a coveted object, and seeing that each bird is attacked only while holding it and left in peace the instant it relinquishes the object, a person can generalize that possessing or craving any desired thing invites suffering, and relinquishing it ends the suffering. In the Jataka''s tale of Kumbhakara, King Nimi reaches paccekabuddha-hood from exactly this observation: "Whoever took the flesh, sorrow befel him: whoever relinquished it, happiness befel him: whoever takes the five pleasures of sense, sorrow befals him, happiness the other man: these are common to many: now I have sixteen thousand women: I ought to live in happiness leaving the five pleasures of sense, as the hawk relinquishing the morsel of flesh."'
related: []
evokes: [jataka, sattanipata, kumbhakara-jataka, possession-invites-attack, relinquishment-ends-suffering]
lineage:
  - source: primary
    text: jataka-chalmers1895-kumbhakara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 408, Kumbhakara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Whoever took the flesh, sorrow befel him: whoever relinquished it, happiness befel him: whoever takes the five pleasures of sense, sorrow befals him, happiness the other man: these are common to many: now I have sixteen thousand women: I ought to live in happiness leaving the five pleasures of sense, as the hawk relinquishing the morsel of flesh."
canonical-instances:
  - "Watching a string of colleagues get dragged into political fights the moment they claimed credit for a popular internal project, a manager next in line for that credit hands it off entirely instead, and for the first time in months nobody comes after her."
critical-questions:
  - "Does relinquishing the coveted thing genuinely produce lasting peace, or only remove you from this particular chain of pursuit while leaving whatever made the thing coveted in the first place unaddressed?"
  - "Is watching other people's fate really sufficient evidence to generalize a rule for yourself, given that your own relationship to the same object might differ from theirs?"
status: active
