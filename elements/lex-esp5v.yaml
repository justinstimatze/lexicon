canonical-instances:
  - "Two colleagues who privately think little of each other's work exchange effusive praise in every performance review meeting, because each review's outcome depends on the other's endorsement, and both understand the compliments are currency rather than assessment."
critical-questions:
  - "Does mutual awareness that the flattery is insincere actually change its function, or does the exchange still shape how each party feels about the other over time regardless of the shared understanding that it's transactional?"
  - "What happens when the shared resource runs out — does the flattery stop immediately, revealing it was never about the relationship at all, or does the habit of mutual praise persist past its original purpose?"
