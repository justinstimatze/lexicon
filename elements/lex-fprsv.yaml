id: lex-fprsv
name: mistaking-the-traps-next-offer-for-the-trappers-foolishness
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "A gambler who has already lost everything and is offered one more absurd-sounding bet may accept it not out of desperation but out of contempt for the person making the offer -- believing he's the one about to exploit a fool, right up until the bet closes on him instead. In Cushing's telling, a master gamester who has already stripped a young man of his possessions, then his clothing, casually raises the stakes to something no reasonable opponent would offer: 'Bet your left thigh. I'll put all you have lost and more, too, on that.' The young man's internal reaction isn't fear or hope, it's condescension: 'What an old fool you are!' he thinks, 'and reply: All right! I will take your bet.' He accepts precisely because the offer looks like it favors him, a wildly generous wager from someone who doesn't understand the odds, when in fact the offer only ever looked generous because the game was already fixed against him from the start. Diagnostic move: when an opponent who has already been beating you offers a bet so lopsided it seems to favor you, be suspicious of your own private thought that they must be foolish to offer it -- if they've won every round so far, the more likely explanation is that they know something about the game you don't, not that they've suddenly become careless."
