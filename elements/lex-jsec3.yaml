id: lex-jsec3
name: staying-despite-a-known-exit-option-counts-as-agreement
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When judging whether someone has agreed to an arrangement they never explicitly signed onto — a state's laws, an organization's norms, a platform's terms — check whether their conduct satisfies the specific evidentiary structure Plato's Crito uses to construct Socrates's 'implied contract' with Athens, rather than treating mere presence as automatically consent. The Laws' argument (Crito 51c-53a) requires three elements together, not any one alone: (1) INFORMED — the resident has actually observed 'the ways of the city' and 'made... acquaintance' with its practices, not merely arrived ignorant of them; (2) UNIMPEDED — the exit is genuinely available without punishment or forfeiture: 'he may go where he pleases and take his goods with him... none of us laws will forbid him or interfere with him'; (3) SUSTAINED AND REVEALED-PREFERRED — the person did not merely fail to leave once, but remained for an extended period during which other choices confirmed the preference (Socrates 'begat children' in Athens, rarely traveled, and — decisively — at his own trial explicitly chose death over the lesser penalty of exile when exile was available to him: 'you preferred death to exile'). Only when all three are present does the Laws' conclusion follow: 'he who has experience of the manner in which we order justice and administer the state, and still remains, has entered into an implied contract that he will do as we command him.' The mechanism is falsifiable in the negative direction too: strip any one element (the resident was deceived about the terms; leaving would cost them their livelihood or safety; they arrived yesterday) and the 'implied contract' reading collapses back into mere unconsenting presence. Portable well beyond political obligation: a long-tenured employee who knew a company's culture, could have left for a comparable job at any point, and repeatedly chose to stay and even declined competing offers has a stronger claim to have 'agreed' to that culture than a new hire on their first week; a long-time user of a platform who understood its data practices, had free alternatives, and stayed anyway is in a different evidentiary position than a user locked in by switching costs or deception. Diagnostic: for any 'they agreed by staying' claim, check informed + unimpeded + sustained-and-revealed-preferred; if any element is missing, the claim needs a different, weaker warrant than implied contract."
related: [lex-q6cba, lex-6tvr6, lex-7mdpd]
scaffolds-from: [lex-q6cba]
evokes: [an-implied-contract-that-he-will-do-as-we-command, he-may-go-where-he-pleases-and-take-his-goods-with-him, you-preferred-death-to-exile]
lineage:
  - source: primary
    text: plato-c380bce-crito-jowett-implied-contract
    citation: "Plato, Crito 51c-53a (trans. Benjamin Jowett, Standard Ebooks 'The Dialogues of Plato' compilation). The personified Laws' argument to Socrates for why his seventy years of informed, unforced residence in Athens, confirmed by his own choice of death over exile at trial, constitutes an implied contract to obey the city's judgments."
    quote: "[...] he who has experience of the manner in which we order justice and administer the state, and still remains, has entered into an implied contract that he will do as we command him. [...] Of all Athenians you have been the most constant resident in the city, which, as you never leave, you may be supposed to love. [...] here in this city you begat your children, which is a proof of your satisfaction. Moreover, you might in the course of the trial, if you had liked, have fixed the penalty at banishment; the state which refuses to let you go now would have let you go then. But you pretended that you preferred death to exile[.]"
  - source: primary
    text: plato-c380bce-crito-jowett-exit-unimpeded
    citation: "Same dialogue, immediately preceding, establishing the unimpeded-exit condition the implied-contract argument depends on."
    quote: "[W]e further proclaim to any Athenian by the liberty which we allow him, that if he does not like us when he has become of age and has seen the ways of the city, and made our acquaintance, he may go where he pleases and take his goods with him. None of us laws will forbid him or interfere with him."
canonical-instances:
  - "The direct textual anchor: the Laws' three-part case for Socrates's implied contract — informed residence, an unimpeded and repeatedly-declined exit, and a trial-stage choice of death over exile that confirmed the preference."
  - "A senior employee who understood a company's management style from years of exposure, had standing offers elsewhere, and turned them down repeatedly has a stronger claim to have endorsed that management style than a first-week hire who has not yet had a real chance to leave or compare."
  - "A long-time resident of a homeowners' association who attended meetings, knew the rules, and could have sold and moved at any point, but stayed and even opposed rule changes that would have loosened restrictions, is in a different position — evidentially — than a new buyer who inherited the same rules unknowingly at closing."
critical-questions:
  - "isn't 'silence implies consent' obviously fallacious — doesn't this atom just launder that fallacy? No — the atom is narrower than generic silence-as-consent. It requires all three elements (informed, unimpeded, sustained-and-revealed-preferred) together; bare passive silence with no other evidence satisfies none of them. The Laws' argument leans specifically on Socrates's ACTIVE choices (having children there, declining exile at trial) as revealed preference, not on his mere failure to object."
  - "how does this differ from lex-q6cba (threat-versus-offer-turns-on-who-controls-the-comparison-baseline)? lex-q6cba supplies the test this atom's 'unimpeded' element depends on and does not independently verify: whether the cost of leaving is itself a baseline the authority manufactured or controls. If leaving would mean statelessness, destitution, or persecution that the very authority claiming consent created or maintains, the exit is not genuinely unimpeded under lex-q6cba's moral-baseline test, and the implied-contract reading fails on its own terms — this is the classic modern objection to Crito's argument (echoed by Hume's 'Of the Original Contract'): most people cannot really 'go where they please and take their goods with them.' The atom does not resolve this dispute; it names the evidentiary structure and flags that the 'unimpeded' element is exactly where lex-q6cba's proposal-prong analysis must be run before the argument can be trusted."
  - "how does this differ from lex-6tvr6 (pre-commitment-binds-future-action-against-predictable-erosion)? lex-6tvr6 is about deliberately binding ONE'S OWN future action in advance (Ulysses at the mast) to defeat predictable future weakness. This atom is about a THIRD PARTY (the Laws, a court, an outside observer) retrospectively inferring agreement FROM a pattern of past non-departure — no advance deliberate self-binding is involved, and the person may never have consciously intended their staying to constitute agreement at all."
  - "how does this differ from lex-7mdpd (humanity-as-end-never-merely-as-means, Kant)? lex-7mdpd is a normative constraint on how one may TREAT another person (never merely instrumentally). This atom is a narrower, empirical-evidentiary claim about what pattern of CONDUCT counts as evidence of consent to an existing arrangement — it does not by itself say anything about whether treating someone according to an inferred consent is morally permissible if that inference turns out to be wrong."
  - "does the atom endorse the Laws' conclusion that Socrates must die rather than escape? No — the atom names the argument's evidentiary STRUCTURE (what pattern of conduct the argument treats as consent-constituting) so it can be examined and applied elsewhere; it takes no position on whether the specific conclusion Plato has Socrates draw from it was correct, including within the dialogue's own ancient reception (Plato's Phaedrus 275B suggests even the frame-story's factual basis is uncertain)."
severity-tier: info
status: active
