canonical-instances:
  - "A company requires every engineer to write a design doc before starting work, meant to enact the ideal of 'think before you build' — an engineer complains about writing a design doc for a two-line config change, and a colleague working on a genuinely complex migration defends the requirement from their own case; the fix isn't dropping design docs or keeping the rule blanket, it's conditioning the requirement on actual complexity, with a lightweight justification for skipping it on small changes."
  - "A hospital requires every attending to co-sign a resident's note, meant to enact the supervisory-oversight role — a resident on a routine, low-risk case chafes at the delay while a resident on a genuinely ambiguous case defends the value of the co-sign from their own experience; conditioning the requirement on case complexity, with a documented override for routine cases, resolves both without discarding supervision altogether."
critical-questions:
  - "Conditioning a rule on its rationale requires someone to judge, case by case, whether the rationale applies — here, a faculty member evaluating the student's justification. Does this just relocate the original problem (uniform rule vs. judgment call) onto whoever adjudicates the exception, and under what conditions does that adjudicator become a new bottleneck or a new source of inconsistent application?"
  - "The fix here assumes the rationale ('medical indication') is itself something a rule-follower can honestly self-assess and a supervisor can readily verify. What happens to this fix pattern when the rationale is much harder to assess than the original blanket rule was to follow — does conditioning the rule on rationale then trade a bad rule for a much costlier judgment process?"
