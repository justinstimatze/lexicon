id: lex-a5pdv
name: a-floor-already-at-bottom-prefers-upheaval-over-stability
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A party who holds no stake in a stable order's continuation has an asymmetric preference for upheaval over the status quo, since disruption can only improve a floor that is already at the bottom -- ordinary risk-aversion arguments for preferring stability don't apply to someone for whom the current arrangement offers nothing to protect. Douglass, writing of the weeks before the Civil War, names this directly: 'I confess to a feeling allied to satisfaction at the prospect of a conflict between the North and the South. Standing outside the pale of American humanity, denied citizenship, unable to call the land of my birth my country, and adjudged by the supreme court of the United States to have no rights which white men were bound to respect, and longing for the end of the bondage of my people, I was ready for any political upheaval which should bring about a change in the existing condition of things.' The reasoning is explicitly comparative to those with something to lose: for a citizen with property, standing, or legal protection, war risks all three; for Douglass, the pre-war status quo already denied him citizenship, legal personhood, and freedom for his people, so the same war carried none of the downside it carried for others and only the chance of improvement."
related: [lex-2dbue]
evokes: [ready-for-any-political-upheaval, no-rights-which-white-men-were-bound-to-respect, outside-the-pale-of-american-humanity, nothing-to-lose-in-the-stable-order]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch10-satisfaction-at-the-prospect-of-conflict
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter X, 'The Beginning of the End.'"
    quote: "“I confess to a feeling allied to satisfaction at the prospect of a conflict between the North and the South. Standing outside the pale of American humanity, denied citizenship, unable to call the land of my birth my country, and adjudged by the supreme court of the United States to have no rights which white men were bound to respect, and longing for the end of the bondage of my people, I was ready for any political upheaval which should bring about a change in the existing condition of things.”"
canonical-instances:
  - "The direct textual anchor: Douglass explicitly names the Dred Scott decision's 'no rights which white men were bound to respect' as the specific legal fact establishing that the pre-war order held nothing for him to lose, immediately before describing his readiness for upheaval -- the preference traces to that stated legal floor rather than to any general temperament for risk."
  - "Hypothetical: a tenant facing eviction regardless of outcome supports a risky rent-strike campaign that homeowners in the same building oppose, not because the tenant is more reckless by temperament, but because the strike's worst case changes nothing about a situation that was already the worst case, while its best case offers a floor the tenant does not currently have."
critical-questions:
  - "Operationally distinct from lex-2dbue (bad-position-collapses-every-choice-to-defeat-good-position-preserves-both): that atom is about a position so bad that BOTH available choices lead to the same defeat, making the choice itself irrelevant. This atom is about a position so bad that upheaval becomes an asymmetric bet worth preferring -- the floor is fixed, but upheaval's outcome stays genuinely open, with real room to improve on it, unlike the uniformly bad outcome that atom describes."
  - "Does this preference actually improve a floor-holder's expected outcome, or is 'nothing to lose' sometimes a miscalculation -- can upheaval make an already-terrible situation actively worse (more violence, more repression) even for someone with no formal legal standing left to lose?"
  - "How does this scale from an individual's stated preference to a group's actual behavior -- does a population with a floor already at the bottom reliably act on this asymmetry (support instability, back radical change), or do other constraints (family ties, physical safety, lack of organizing capacity) suppress the preference even when it would be individually rational?"
