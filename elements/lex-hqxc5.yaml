id: lex-hqxc5
name: retaliation-through-a-vastly-more-powerful-ally-outruns-the-original-wrong
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Calling in an ally powerful enough to guarantee you win a grievance can solve the immediate wrong while producing damage so far beyond the original offense that undoing it becomes its own separate project. In Radin's comparative Assiniboine summary, Sitconski loses meat to a small, specific thief: 'Mink steals the meat.' His response isn't proportionate to Mink -- he escalates past the actual wrongdoer entirely: 'Sitconski angrily calls on Thunder, who causes a flood. All unwinged animals perish.' The flood doesn't discriminate between the mink who wronged him and every other flightless creature that did nothing; the ally's power operates at its own scale, not the scale of the grievance that invoked it. Only after the indiscriminate damage is done does the story record any correction: 'Thunder stops the rain, and Sitconski revives the animals.' The revival is necessary precisely because the retaliation overshot the target so completely. Diagnostic move: before invoking an ally, authority, or system whose power vastly exceeds what your specific grievance requires, ask whether that power can actually be aimed narrowly at the wrongdoer, or whether it operates at a scale that will catch everyone nearby -- and if it's the latter, have a plan for undoing the collateral damage before you invoke it, not after."
