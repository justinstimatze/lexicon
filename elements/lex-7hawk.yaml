id: lex-7hawk
name: player-experience-goals-set-before-mechanics-then-playtesting-corrects-them
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Before designing any mechanic, name the target experience you want the user or player to have — not the feature, the felt experience. Build the cheapest possible version of the mechanic, then let observed behavior during real use — not your own intuition about whether it works — judge whether the mechanic actually produces that experience. Repeat: adjust the mechanic, test again, adjust again, until observed use matches the stated experience goal. The discipline this enforces is sequencing — experience goal first, mechanic second, evidence third — which blocks the common failure of building a mechanic you find personally satisfying and then retrofitting a story about what experience it must be creating."
related: [lex-a55ep, lex-ubyz3]
evokes: [playcentric-design, playtesting-loop, iterative-design, fullerton-game-design-workshop, experience-first-design]
lineage:
  - source: primary
    text: fullerton-2024-game-design-workshop-ch1-playcentric
    citation: "Tracy Fullerton, Game Design Workshop: A Playcentric Approach to Creating Innovative Games, 6th edition (CRC Press/Taylor & Francis, 2024), Chapter 1 'The Role of the Game Designer.' No page numbers survive this epub extraction, only chapter headings — matching how other epub-only sources in this corpus (Chang, Collins) are cited. Verified verbatim against ebook-convert extraction."
    quote: "I'll talk about the answers to these questions and outline a method of iterative design that designers can use to judge the success of gameplay against their goals for the player experience throughout the design and development process. This iterative method, which I call the \"playcentric\" approach, relies on inviting feedback from players early on and is the key to designing games that delight and engage the audience because the game mechanics are developed from the ground up with the player experience at the center of the process. By \"iteration\" I simply mean that you design, test, and evaluate the results over and over again throughout the development of your game, each time improving upon the gameplay or features, until the player experience meets your criteria."
canonical-instances:
  - "A designer wants a horror game to produce dread rather than jump-scare startle (the experience goal, set first). A prototype using slow ambient sound design and restricted visibility is built cheaply and tested with real players; observed player behavior (do they creep forward cautiously, or do they just get startled and laugh) tells the designer whether the mechanic hit the target experience — not the designer's own sense while building it, which is compromised by already knowing what's coming."
  - "operationally distinct from lex-a55ep lenses-as-multi-perspective-design-evaluation-method: Schell's lenses are applied to evaluate a design that already exists, viewing it through many analytical perspectives. This atom is a sequencing discipline applied before and during construction — set the experience goal, then let playtesting (not multi-lens analysis) be the judge, repeated as a loop rather than a one-time evaluation pass."
  - "operationally distinct from lex-ubyz3 plan-to-throw-one-away-first-system-is-pilot-not-production: Brooks's claim is that your first working system teaches you what the production system should actually be, and you should plan from the start to discard it. This atom doesn't require discarding anything — the same prototype gets iteratively refined across many playtesting cycles rather than being thrown away and rebuilt from scratch once."
critical-questions:
  - "Was the experience goal actually stated in observable, testable terms before the mechanic was built, or is it a vague feeling that gets reverse-engineered to justify whatever got built? A goal like 'make it fun' isn't testable; 'players should feel outmatched but not hopeless' is."
  - "Is the feedback genuinely coming from observed player behavior? Players' verbal self-reports about their own experience are a separate signal that can diverge sharply from what their behavior actually shows in the moment. Fullerton's method leans on watching play over asking players what they thought."
  - "How many iteration cycles did the design actually go through before shipping? A single playtest pass is a much weaker instance of this atom than a genuine loop of repeated build-test-adjust cycles, since the repetition itself is what the discipline is asking for."
status: active
