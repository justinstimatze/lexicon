id: lex-pnyzg
name: reserve-the-happiness-verdict-until-the-outcome-is-final
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Because fortune can reverse at any point before an outcome actually concludes, no intermediate state — however prosperous it currently looks — licenses a verdict of 'happy,' 'successful,' or 'safe.' A later event can always retroactively falsify a label applied too early; only a concluded, no-longer-reversible outcome can be evaluated with any safety. Plutarch's Life of Solon dramatizes this directly in Solon's answer to Croesus, who expected to be told he was the happiest of men on the strength of his current wealth and power: 'him only to whom the divinity has continued happiness unto the end, we call happy; to salute as happy one that is still in the midst of life and hazard, we think as little safe and conclusive as to crown and proclaim as victorious the wrestler that is yet in the ring.' The wrestling image names the operative structure precisely: a match still in progress has no winner yet, no matter how dominant one competitor currently looks, because the match itself has not produced its irreversible result. Calling the leading wrestler 'victorious' mid-bout isn't premature optimism — it's a category error, since victory is a property only a completed match can have. Generalize beyond this case: refusing to call an early-stage startup with a hot funding round 'a success' before an exit event (acquisition, IPO, sustained profitability) has actually occurred, since any of the ordinary hazards of the intervening years can still reverse the current trajectory; scientific practice of withholding 'replicated' status from a result until independent confirmation has actually closed the loop, no matter how strong the original finding looked in isolation. The operational discipline: identify what would count as the outcome's actual conclusion (the match ends, the exit event occurs, the replication completes) and treat every state before that point as provisional, regardless of how confidently it currently trends toward a good ending."
related: [lex-sdc6x]
evokes: [wrestler-yet-in-the-ring, continued-happiness-unto-the-end, croesus, midst-of-life-and-hazard]
