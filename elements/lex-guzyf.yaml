id: lex-guzyf
name: children-treat-a-genuinely-dangerous-unexploded-object-as-a-prize
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Boys can run toward and retrieve an unexploded artillery shell as a trophy immediately after watching it fail to detonate, showing none of the danger-recognition an adult would apply to the same object -- fascination overriding any sense of risk. During the fight on the Tongue, the soldiers fire cannon shells designed to explode on impact and again after a delay: 'Some of them did not go off, and we boys ran after one of these and got it.' The sentence carries no hesitation, no adult intervention, no acknowledgment that a live, unexploded shell is exactly the object a soldier would treat with the most caution. To the boys, its failure to explode reads simply as availability."
related: []
evokes: [black-elk-speaks, walking-the-black-road, wagon-guns-that-shot-twice, some-of-them-did-not-go-off, we-boys-ran-after-one]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch10-walking-the-black-road
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 10, 'Walking the Black Road.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Then they began shooting with the wagon guns that shot twice, because the iron balls went off after they fell. Some of them did not go off, and we boys ran after one of these and got it."
canonical-instances:
  - "Children playing near a construction site pick up an unexploded firework left over from a display the night before, drawn to the object precisely because it looks unusual, with no sense that a dud firework can still ignite."
  - "Kids in a former conflict zone collect and play with spent shell casings and occasionally live, unexploded ordnance found in fields, treating the objects as curiosities and toys rather than the lethal hazards deminers would recognize instantly."
  - "A group of children finds a dead power line downed in a storm and takes turns getting close to touch it, unaware that a line can remain live even while lying inert on the ground."
critical-questions:
  - "Does a child's fascination with a dangerous object come from genuinely not recognizing the danger, or from recognizing it and being drawn to the danger itself as part of the appeal -- and would the same shell have been just as attractive to an equally uninformed adult?"
  - "Why does no adult in the account intervene to stop the boys from retrieving the shell -- does the surrounding chaos of battle simply leave no one available to notice, or was retrieving unexploded ordnance not actually treated as unusually dangerous in that context?"
  - "Black Elk reports this with no note of fear or regret in hindsight -- does the absence of any adult-retrospective caution in his telling suggest nothing bad ever came of keeping the shell, or is it simply not the kind of detail the account chose to follow up on?"
status: active
