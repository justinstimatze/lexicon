    quote: "he was a young man who had everything, he made a bundle of presents as large as he could carry; but it did him no good. He, too, ran away from the may-flies and gnats and mosquitoes... 'I do not wonder that she asks hard tasks of her lovers; for it is not of their bundles that she thinks, but of themselves.'"
canonical-instances:
  - "Multiple well-funded startups compete for a strategic enterprise contract by offering the lowest price and biggest feature bundle, all losing to a smaller company that correctly identified the client was actually screening for a demonstrated ability to move fast under real operational pressure during a paid pilot, not for the largest proposal."
  - "Several wealthy, well-connected applicants to a highly selective mentorship program are rejected despite offering to donate or network on the program's behalf, while an under-resourced applicant is accepted because they alone recognized the program was filtering for demonstrated resilience under a specific hands-on trial task, not for what the applicant could bring to the table."
critical-questions:
  - "how would a candidate competing on the wrong currency ever detect, in real time, that repeated failures by equally well-resourced peers is evidence the test measures something else, rather than evidence that they simply need an even bigger bundle?"
  - "is it possible the maiden's test genuinely does favor a certain kind of wealth -- access to specific knowledge, like the grandmother's tactical advice -- just not the kind the suitors assumed -- does the winning suitor's success actually disprove that wealth matters, or just that a different kind of wealth mattered?"
  - "does recognizing 'this test measures something else' actually help if you don't have access to whatever informational advantage a knowing grandmother provided -- is the diagnostic move here actionable for someone without an equivalent insider, or does it just redescribe an outcome that depended on luck of birth?"
