lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Back to the Presocratics' (Presidential Address delivered before the Aristotelian Society, 13 October 1958; first published in the Proceedings of the Aristotelian Society, N.S. 59, 1958-9), Ch. 5 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), p.188."
    quote: "'What prevented Anaximander from arriving at the theory that the earth was a globe rather than a drum? There can be little doubt: it was observational experience which taught him that the surface of the earth was, by and large, flat. Thus it was a speculative and critical argument, the abstract critical discussion of Thales' theory, which almost led him to the true theory of the shape of the earth; and it was observational experience which led him astray.'"
canonical-instances:
  - "Special relativity's claim that simultaneity is relative to the observer's frame runs against every human's direct, repeated experience that 'now' is the same instant everywhere -- an observation that's accurate at everyday speeds and distances and wrong as a claim about the structure of spacetime at large. The abstract argument (from the constancy of the speed of light) outran what a lifetime of ordinary observation could ever have suggested."
  - "A city planner walks a single well-maintained block and reports the district's infrastructure as sound. A structural analysis of the district's aggregate maintenance budget flags the same district as failing. If the analysis turns out right, the planner's eyes didn't lie -- the block really is fine -- the error was generalizing one well-kept block to the whole district."
  - "operationally distinct from lex-zate6 expecting-one-thing-shapes-what-is-actually-perceived: that atom is about a PRIOR EXPECTATION distorting what gets perceived in a single ambiguous instance (mistaking a person for a deer). This atom is about an ACCURATE, undistorted observation at one scale being wrongly generalized to a claim at a larger scale -- the observation itself is not an error, the generalization from it is."
critical-questions:
  - "Doesn't this just license 'my theory beats your evidence' whenever the two disagree? No -- the specific condition doing the work is that the observation is being generalized past the scale where it was actually checked (local flatness to global shape). Where an observation directly addresses the claim at the scale the claim is actually made, it should still override a plausible-sounding argument; this atom names a narrower, specific failure mode of observation, not a general license to prefer theory over evidence."
  - "How would you know, in real time, that an observation is the misleading-local-sample kind rather than the reliable kind, before the truth is settled independently (as it eventually was for the earth's shape)? Popper doesn't supply a general test here, and this atom doesn't invent one -- the practical value is retrospective diagnosis of why a correct abstract argument was rejected, plus a standing prompt, when observation and reasoning conflict, to ask explicitly whether the observation's scale matches the claim's scale before treating the observation as decisive."
