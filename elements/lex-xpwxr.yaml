id: lex-xpwxr
name: expand-existing-elements-before-adding-new-ones
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Sanderson's Third Law names the failure mode that hits any system a person keeps extending over time: the reflex to make it richer by adding a new, independent element rather than deepening one already there. He calls the reflex 'worldbuilder's disease' and states the corrective as a single sentence: expand what you already have before you add something new. The reasoning is about where richness actually comes from. A system with many shallow, disconnected elements reads as a checklist -- each one novel for a moment, none of them doing real work, because nothing forces them to interact. A system with fewer elements that are worked hard reads as coherent, because every part of it has to answer to every other part. Sanderson breaks the 'work it hard' move into three concrete sub-moves, each answering a different question about an existing element. Extrapolate asks what changes ripple outward from this element if you trace its consequences seriously -- not what NEW element could sit beside it, but what this one, taken further, would actually cause. Interconnect asks whether this element is wired into the rest of the system or floating free beside it -- tie it to what's already there rather than letting it stand as an isolated party trick. Streamline asks, before reaching for a new component to solve a new problem, whether an existing component -- reused, reinterpreted, given a new angle -- could do the job instead. The three moves compound: an element that's been extrapolated AND interconnected AND streamlined into everything else does more narrative or functional work per unit of novelty than ten fresh elements each doing their own separate, shallow thing. The law is not an argument for minimalism as such -- Sanderson is explicit that some of his own favorite worlds (Wheel of Time, Discworld) are enormous. It's an argument about where the next unit of development effort should go: into depth on what exists, not breadth via addition, unless breadth is genuinely what the situation calls for. Before adding a new component to a system you're extending -- a feature, a team, a character, a rule -- ask whether an existing one, pushed further, interconnected harder, or reused more deliberately, would do the same job. If yes, that's the higher-leverage move; the new component was reaching for novelty the existing one could have supplied."
