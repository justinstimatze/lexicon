id: lex-yecsx
name: a-gift-that-requires-closed-eyes-delivers-the-attack-instead
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone offering you a benefit asks you to first close your eyes and open your mouth, or otherwise fold your body into a posture that removes your ability to see or defend yourself, the request for that posture is often the actual point of the offer, not an incidental condition attached to it. In Radin's comparative Assiniboine trickster summary, Fisher has stolen meat from Sitconski, and when Sitconski corners him, Fisher doesn't run or fight -- he makes a generous-sounding offer instead: 'Fisher offers to give him some meat if he shuts his eyes and opens his mouth, then drops a knife and kills him.' The gift was never going to be delivered; the posture required to receive it was the entire mechanism, engineered to look like a condition of generosity rather than what it actually was, a request for total exposure. Diagnostic move: when an offer of benefit comes with a physical or informational precondition that would leave you unable to perceive or react -- close your eyes, turn your back, hand over your only copy, step outside your normal channel of verification -- treat the precondition itself as the thing to evaluate, separately from how generous the offer sounds, since the precondition is where the actual risk lives."
