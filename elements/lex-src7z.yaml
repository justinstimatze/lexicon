id: lex-src7z
name: disinhibition-reveals-temperament-rather-than-causing-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Removing a normal inhibition doesn't manufacture a new temperament in whoever experiences it — it reveals whatever temperament was already there, underneath the ordinary constraint. In the Jataka's tale of the thoroughbreds and the donkeys, the same stable receives strong wine and diluted wine-dregs respectively. The thoroughbreds, given the full strength, stay perfectly composed. The donkeys, given only the leftovers, go wild and loud. The Bodhisatta's explanation points at disposition as the actual variable, with dosage beside the point: 'The low-born churl, though he but taste and try, Is frolicsome and drunken by and by: He that is gentle keeps a steady brain Even if he drain most potent liquor dry.' The disinhibiting substance is the same kind of thing in both cases — what differs is what each temperament does once the ordinary restraint is loosened."
related: []
evokes: [jataka, dukanipata, valodaka-jataka, a-disinhibitor-exposes-existing-disposition, removing-restraint-tests-character-rather-than-creating-it]
lineage:
  - source: primary
    text: jataka-chalmers1895-valodaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 183, Valodaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The low-born churl, though he but taste and try, Is frolicsome and drunken by and by: He that is gentle keeps a steady brain Even if he drain most potent liquor dry."
canonical-instances:
  - "Two coworkers given the same amount of unsupervised freedom on a slow work week: one uses the slack time to get ahead on a project nobody would have noticed if skipped, and the other disappears for three days, revealing something about how each actually behaves without oversight rather than what the freedom itself caused."
critical-questions:
  - "Is 'reveals rather than causes' actually always true, or can a disinhibitor sometimes genuinely create behavior a sober or restrained version of the same person would never have been capable of — is the story's clean binary too tidy?"
  - "The original story frames this in terms of caste and birth ('the low-born churl'); does the mechanism actually depend on any such categorical distinction, or does it hold just as well between two individuals of identical background who simply have different temperaments?"
status: active
