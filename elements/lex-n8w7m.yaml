id: lex-n8w7m
name: robust-graded-effect-does-not-specify-its-underlying-mechanism
type-in: claim
type-out: warning
_tier: atomic
agent-instruction: "Apply this when a reliably-measured graded effect (a rating, a reaction-time gradient, a hedge-acceptability pattern) has been established beyond dispute, and the temptation is to treat that effect as evidence for one specific underlying mechanism. Rosch's own methodological discipline, applied to her own most famous finding: prototypicality ratings (how good an example X is of category Y) are extremely reliable -- subjects agree even when they disagree about a category's boundaries, and the ranking predicts reaction time, learning speed, developmental order, output order, priming, and hedging acceptability across a dozen independent paradigms. But Rosch explicitly refuses to let that robustness license a claim about MECHANISM: the same graded-typicality signature is equally well produced by feature-list matching, exemplar storage with best-match retrieval, literal template matching, frequency-of-attribute counting, or explicit cultural teaching of 'good examples' -- all are consistent with the data, and the data alone cannot adjudicate between them. The effect CONSTRAINS candidate mechanisms (a model predicting equal reaction times for good and bad examples is refuted) but does not SPECIFY one (nothing in the effect picks out feature-lists over exemplar-storage over templates). The common error is reification: talking about 'THE prototype' as though it names a literal single stored object in memory, when it is -- Rosch's own phrase -- 'simply a convenient grammatical fiction' for a pattern of judgments. Practitioner move: when you have a robust, well-replicated graded effect in hand, list at least two structurally different mechanisms that would produce the identical signature before asserting which one is 'the' explanation; if you can't name a second candidate mechanism, you haven't checked whether the effect actually discriminates."
related: [lex-2vpet, lex-4dest, lex-jyzng, lex-exrwy]
scaffolds-from: [lex-4dest]
evokes: [prototype-as-convenient-fiction, cue-validity-does-not-imply-template, rosch-mervis-1975, feature-list-vs-exemplar-vs-template, constrain-not-specify, reification-of-a-statistical-regularity]
lineage:
  - source: primary
    text: rosch-1978-principles-of-categorization
    citation: "Eleanor Rosch, 'Principles of Categorization,' in Eleanor Rosch & Barbara B. Lloyd (eds.), Cognition and Categorization (Lawrence Erlbaum Associates, 1978), pp. 27-48. Section 'The Horizontal Dimension: Internal Structure of Categories: Prototypes' and its immediate follow-on subsection 'Effects of Prototypicality on Psychological Dependent Variables.' Rosch chaired the original basic-object/prototype research program (Rosch et al. 1976, Rosch & Mervis 1975); this chapter is her own synthesis and, notably, her own explicit warning against over-reading the research she is credited with founding."
    quote: "By prototypes of categories we have generally meant the clearest cases of category membership defined operationally by people's judgments of goodness of membership in the category. [...] The fact that prototypicality is reliably rated and is correlated with category structure does not have clear implications for particular processing models nor for a theory of cognitive representations of categories. [...] What the work summarized does not tell us, however, is considerably more than it tells us. [...] 1. To speak of a prototype at all is simply a convenient grammatical fiction; what is really referred to are judgments of degree of prototypicality. [...] For natural-language categories, to speak of a single entity that is the prototype is either a gross misunderstanding of the empirical data or a covert theory of mental representation. 2. Prototypes do not constitute any particular processing model for categories. [...] a prototype can be described as well by feature lists or structural descriptions as by templates. And many different types of matching operations can be conceived for matching to a prototype given any of these three modes of representation of the prototype. [...] What the facts about prototypicality do contribute to processing notions is a constraint -- process models should not be inconsistent with the known facts about prototypes. [...] 3. Prototypes do not constitute a theory of representation of categories. [...] such a statement remains an unspecified formula until it is made concrete by inclusion in some specific theory of representation. [...] 4. Although prototypes must be learned, they do not constitute any particular theory of category learning. [...] could be represented in terms of counting attribute frequency [...], in terms of storage of a set of exemplars to which one later matched the input [...], or in terms of explicit teaching of the prototypes once prototypicality within a culture is established [...] In short, prototypes only constrain but do not specify representation and process models."
canonical-instances:
  - "operationally distinct from lex-2vpet family-resemblance and lex-4dest basic-level-is-where-cue-validity-peaks: both already cover Rosch's substantive categorization findings (graded category structure, the cue-validity-maximizing abstraction level); this atom covers a separate, purely epistemic-discipline point Rosch makes about her OWN findings -- that a robust effect constrains but does not specify the mechanism that produced it."
  - "operationally distinct from lex-exrwy counterexamples-refine-the-claim-and-its-concepts-not-merely-refute: Lakatos's dialectic is about counterexamples reshaping a definition mid-argument; this atom is about one stable, uncontested effect being compatible with multiple silent generative mechanisms -- a different kind of underdetermination."
  - "operationally distinct from lex-jyzng abstracting-an-entity-from-its-instances: lex-jyzng (Lent on Platonic Forms) is about hypostatizing a predicate into an entity via grammar (the definite article); this atom is about conflating a measured, real effect with the specific process that produced it -- a narrower, methodological point about mechanism-underdetermination rather than a claim about reification-via-language."
  - "Rosch's own worked list of alternative mechanisms for prototypicality: feature-list matching, structural-description matching, literal template matching, exemplar-storage-with-best-match, attribute-frequency counting, and explicit cultural teaching of 'good examples' -- six structurally different processes, all equally consistent with the single graded-rating effect she spent the chapter establishing."
  - "Reaction-time studies in cognitive psychology generally: a robust RT effect (faster responses to X than Y) is compatible with serial search, parallel search with different activation strengths, spreading activation, or strategic response bias -- the RT DATA alone constrains (rules out models predicting equal RTs) but does not specify which of these produced the pattern, a generalization of exactly Rosch's caution beyond categorization research."
  - "Behavioral-economics 'nudge' effects: a robust, replicated finding that framing A produces more compliance than framing B tells you the effect is real, but not whether the mechanism is loss-aversion, anchoring, social-proof, or reduced cognitive load -- treating 'it's a nudge' as if it names a single mechanism repeats Rosch's 'convenient grammatical fiction' error one field over."
  - "LLM interpretability findings: a robust behavioral signature (a model reliably does X under condition Y) is frequently reported as evidence for a specific internal mechanism (e.g., 'the model has learned concept Z') when the same external signature is consistent with multiple different internal computations -- the same constrain-but-don't-specify gap Rosch names for prototypes applies directly to claims about what a robust probing or behavioral result reveals about a network's internals."
critical-questions:
  - "Isn't this just 'correlation isn't causation' restated? No -- it's a sharper, adjacent claim. Correlation-vs-causation is about whether X causes Y at all. This atom assumes the EFFECT itself is real and uncontested (prototypicality ratings ARE reliable, RT differences ARE real) and asks a separate question: given that a real graded effect exists, how many different generative mechanisms could produce that exact effect, and does the effect's shape actually distinguish among them? The error isn't inferring a false causal link; it's over-specifying a true effect's cause among several live candidates the data doesn't discriminate."
  - "How do you know when an effect DOES specify its mechanism, rather than merely constrain it? Look for a prediction that is unique to one candidate mechanism and absent from the others -- e.g. if literal template-matching predicts a specific error pattern that exemplar-storage does not, and that error pattern is observed, the effect has moved from constraining to specifying (for that one comparison). Rosch's own point 2 gives the practitioner test directly: 'process models should not be INCONSISTENT with the known facts' is the constrain-level claim; specification requires a finding that is inconsistent with all-but-one candidate, which prototypicality data, as she reviews it, does not provide."
  - "Does this counsel permanent agnosticism about mechanism? No -- Rosch's own program (and cognitive science generally) went on to adjudicate among representation theories using further, more targeted experiments (e.g. Chapter 6 and 9 in the same volume, on exemplar vs. schema models). The atom's discipline is about NOT skipping that adjudication step -- not about refusing to ever run it. The practitioner move is 'name the alternatives and check whether this data set discriminates them,' not 'give up on finding the mechanism.'"
