lineage:
  - source: primary
    text: radin-foxes-learn-tricksters-anus-guard-is-a-bluff-through-repeated-probing
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 12. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'It is Trickster and he is asleep! Let us eat this meat. But we must be very careful not to wake him up. Come, let us eat,' they said to one another. When they came close, much to their surprise, however, gas was expelled from somewhere. 'Pooh!' such was the sound made. 'Be careful! He must be awake,' So they ran back. After a while one of them said, 'Well, I guess he is asleep now. That was only a bluff. He is always up to some tricks.' So again they approached the fire. Again gas was expelled and again they ran back. Three times this happened. When they approached the fourth time gas was again expelled. However, they did not run away. ... Then louder, still louder, was the sound of the gas expelled. 'Pooh! Pooh! Pooh!' Yet they did not run away. On the contrary, they now began to eat the roasted pieces of duck."
canonical-instances:
  - "A website shows an intrusive 'you are being monitored for unusual activity' warning on every login attempt regardless of behavior, and within weeks regular users learn to click through it automatically, so the one time it fires for a genuine account compromise it gets dismissed along with all the rest."
  - "A parent repeatedly threatens to cancel a family vacation if children don't behave but never actually follows through, and by the third or fourth trip the children have learned through direct testing that the threat carries no real cost, ignoring it entirely regardless of how loudly or often it's repeated."
critical-questions:
  - "Would a single, real consequence early on, rather than the recurring but empty gas, have prevented the foxes from ever learning to ignore the warning, or does the story suggest that even a real deterrent eventually gets tested and mapped by a sufficiently patient adversary?"
  - "Is the increasing volume of the later warnings, 'Pooh! Pooh! Pooh!', a sign that the deterrent is trying harder, or is it functionally identical to the first quiet one now that the foxes have already learned there is nothing behind it -- does escalating a toothless signal ever change anything?"
  - "Does Trickster bear responsibility for setting an inherently toothless guard, given that he was asleep and unable to reinforce it with any real consequence, or is the deeper failure his choice not to notice that his chosen deterrent had no teeth to begin with?"
