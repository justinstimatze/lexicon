id: lex-k5hgu
name: mirth-is-the-reward-for-debugging-a-covert-false-belief
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when explaining why humor feels good, why a specific joke does or doesn't land, or when a cognitive-science-flavored account of humor treats it as just one instance of general incongruity-resolution or discovery-pleasure without pinning down what's SPECIFIC to mirth. Hurley, Dennett & Adams's claim: '(basic) mirth is the pleasure in unearthing a particular variety of mistake in active belief structures. And (basic) humor is any semantic circumstance... in which we make such a mistake and succeed in discovering it.' Fast, unconscious background reasoning ('heuristic search') constantly builds provisional 'mental spaces' by incorporating information on a probabilistic basis, without full examination — useful almost all the time, but a standing source of dormant errors. The theory's precise, falsifiable five-part definition: mirth occurs when (1) an active element in a mental space (2) covertly entered that space — without drawing conscious attention to itself on arrival — and is (3) taken to be true (epistemically committed) within that space, (4) is then diagnosed to be false — loses an epistemic reconciliation process — and (5) the discovery carries no strong negative emotional valence. Critically, COVERTNESS is load-bearing: 'It is only the information that gets introduced covertly... into the mental space whose discovery elicits mirth; typically making a presumption too overtly, too explicitly, will draw attention to the possible mistake' before it can be committed to and later exposed — which is why a badly-told joke that telegraphs its premise up front isn't funny even with an identical punchline. The functional story: debugging unconscious background reasoning is expensive (requires monopolizing scarce conscious-attention resources) and this 'janitorial work' would lose out to more pressing cognitive demands unless independently rewarded — mirth IS that reward, tuned specifically to this triggering circumstance the way sweet-taste is tuned to sugar and salty-taste to salt, so the organism can reliably seek out debugging opportunities without confusing them with other rewards (ordinary discovery/insight, which lacks the epistemic-commitment-then-reversal structure and so feels qualitatively different — no 'Eureka' has this shape). Practitioner move: when diagnosing why something is or isn't funny, locate the specific covert false belief — what did the mind quietly accept as true, unannounced, that then got knocked down — rather than reaching for generic 'incongruity' or 'surprise,' both of which are necessary but not sufficient (a surprising true fact isn't funny; an overtly-flagged false premise isn't funny either)."
