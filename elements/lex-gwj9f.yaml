lineage:
  - source: primary
    text: penzias-wilson-1965-a-measurement-of-excess-antenna-temperature-at-4080-mcs
    citation: "A. A. Penzias and R. W. Wilson, 'A Measurement of Excess Antenna Temperature at 4080 Mc/s,' Astrophysical Journal 142 (1965): 419-421, Bell Telephone Laboratories."
    quote: "'The possibility of losses in the antenna horn due to imperfections in its seams was eliminated by means of a taping test. Taping all the seams in the section near the throat and most of the others with aluminum tape caused no observable change in antenna temperature. ... From a combination of the above, we compute the remaining unaccounted-for antenna temperature to be 3.5 [degrees] +/- 1.0 [degrees] K at 4080 Mc/s.'"
canonical-instances:
  - "A monitoring team sees a persistent, unexplained spike in error rates on one service. Before filing it as evidence of an attack or a fundamental architecture flaw, they individually rule out clock skew, a misconfigured retry policy, a noisy neighbor on the same host, and a stale cache -- and only once each has been tested and cleared do they report the residual rate as a real, unexplained signal for someone else to investigate."
  - "A lab sees an effect size larger than any prior study in its literature. Instead of writing up the exciting causal story first, the honest version of the paper reports every mundane confound it tested and excluded (sampling artifact, measurement drift, a confederate's inconsistent script) before stating what's left, and leaves the causal interpretation for a separate, explicitly labeled discussion or a follow-up study."
critical-questions:
  - "How do you know when you've exhausted the mundane explanations rather than just the ones that occurred to you? You don't, fully -- Penzias and Wilson's list was bounded by what a 1965 radio engineer could think to test with an antenna and a roll of tape. The discipline isn't a guarantee of completeness; it's a floor: don't report a residual as though it survived scrutiny it never actually received."
  - "Doesn't refusing to name the interpretation risk losing credit for the actual discovery, given that Dicke's team got equal billing in the history of the CMB despite arriving at the theory, not the measurement? Possibly -- but that's a real cost the discipline can impose, not evidence against it. The alternative is a paper padding its measurement out to also cover its meaning, reaching for exactly the kind of premature interpretive claim this discipline exists to block."
