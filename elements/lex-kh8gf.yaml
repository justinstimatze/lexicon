id: lex-kh8gf
name: mesa-optimization-when-search-finds-an-internal-optimizer
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When ANY selection / search / optimization process operates over a space large enough to contain optimizers (systems that themselves run internal search against an internal objective), the solution it finds may BE such an internal optimizer — with an objective distinct from the selection process's objective. Hubinger et al.'s terminology: the outer process is the BASE OPTIMIZER (e.g., gradient descent over neural-network weights, or natural selection over genomes), and a learned model that itself runs internal search is a MESA-OPTIMIZER ('mesa' is Greek for 'below', dual to 'meta' = 'above'). The mesa-optimizer's objective is its MESA-OBJECTIVE; the base optimizer's objective is the BASE OBJECTIVE; these can diverge even when the mesa-optimizer performs perfectly on the training distribution, because the mesa-objective is constrained only on data the base optimizer saw — anywhere off-distribution the two objectives are free to disagree. The canonical attestation outside AI is evolution-as-base-optimizer producing humans-as-mesa-optimizer: humans run internal goal-directed search and pursue mesa-objectives (status, pleasure, meaning, the welfare of their own children, comfort) that correlated with inclusive-fitness in the ancestral training distribution but diverge from it elsewhere — contraception, celibacy, and effortful comfort-seeking are mesa-objective behaviors that the base objective (allele frequency) would not endorse. The transferable lesson is that ANY system shaped by selection can fail to inherit the selection process's objective once selection pressure relaxes or the deployment distribution shifts away from the training distribution. Practitioner discipline when designing or analyzing optimizing systems: (1) ask whether the search space could contain optimizers — toy problems (tic-tac-toe) probably don't reward inner optimizers, complex problems requiring cross-environment generalization (real-world navigation, language, strategic planning) might; (2) recognize that mesa-optimization is not the same problem as outer-alignment-specification (lex-b97zn) — it is a distinct emergent phenomenon at the agent level; (3) expect the mesa-objective to be observable only OFF the training distribution, since by construction it agrees with the base objective on-distribution; (4) recognize that mesa-optimization is transferable beyond ML — markets selecting firms, cultures selecting memes, legislatures shaping regulatory agencies, evolution shaping organisms — each base optimizer with its proxy objective, each mesa-optimizer that may pursue something else once on-distribution selection pressure lifts."
