    quote: "“two groups of environmentalists may agree that some carbon-reduction policy x (having high carbon-pricing through a functioning market) and another such policy y (regulatory intervention through banning certain carbon-generating activities) are each much better than doing nothing, as the globe warms up -- that catastrophic outcome may be called alternative z. And yet one group may vastly prefer x to y, whereas the other group has the opposite preference. Their wrangling with each other may prevent any policy from being adopted, which would generate the worst possible result, namely z. ... However, if we take note only of unanimous agreements, we could note that in the Pareto ranking x and y would remain unranked, whereas x and y would both be placed socially higher than z. The discipline of maximal choice would then give us good reason to choose either x or y, but absolutely shun z.”"
canonical-instances:
  - "Hypothetical: A city council splits over two competing plans to fix a dangerous intersection -- a roundabout faction and a traffic-light faction -- each convinced their design is clearly superior. Both factions agree either design beats leaving the intersection as it is, where pedestrians keep getting hit. Years of stalemate between the two camps produces exactly the status quo both sides agree is worst, because the disagreement over which fix is better keeps blocking either fix from happening."
  - "Hypothetical: A company's leadership team is split between migrating to two different cloud platforms, each side certain theirs is the better long-term bet. Both sides agree the current on-premises system is failing and getting worse. The migration decision stalls for another year over which platform wins, while the failing system both sides already agreed needed replacing keeps degrading in the background."
critical-questions:
  - "Doesn't this just paper over a real disagreement that matters -- won't picking either option arbitrarily produce worse long-term results than actually resolving which one is better? The diagnostic doesn't claim the choice between x and y is unimportant, only that it's a separate question from whether to avoid z. Nothing stops the factions from continuing to argue for their preferred option after one is chosen, or from revisiting the choice later -- the point is that this ongoing argument shouldn't be allowed to hold the far worse outcome hostage in the meantime."
  - "What if one faction refuses to accept the 'maximal choice' framing and keeps blocking any option besides their own preferred one? Then the diagnostic has correctly identified where the actual disagreement lives -- not between the two good options, but in one faction preferring gridlock-toward-catastrophe over compromise on the better-but-not-preferred option. Naming that clearly is itself useful, since it reframes the standoff from 'which policy is right' to 'is blocking any policy actually being chosen on purpose.'"
