lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, Addendum 10, 'An Argument, due to Mark Twain, Against Naive Empiricism' (1989), Conjectures and Refutations (Routledge Classics, 2002), p.557."
    quote: "\"My argument on pp. 27 f. against a naive form of empiricism was essentially anticipated by Mark Twain. On his first appointment as a reporter, he tells us, the editor of the newspaper instructed him never to report anything unless he could verify it or confirm it by personal knowledge. So he described a social event as follows: 'A woman giving the name of Mrs James Jones, who is reported to be one of the society leaders of the city, is said to have given what purported to be a party yesterday to a number of alleged ladies. The hostess claims to be the wife of a reputed attorney.' One sees that Mark Twain was quick to realize the silliness of the naive empiricist (verificationist) theory of the sources of our knowledge.\""
canonical-instances:
  - "A new fact-checking desk adopts a rule requiring every sentence in a story to be independently confirmed by the reporter rather than merely sourced. The first draft written under the rule reads as a wall of 'according to,' 'is understood to have,' and 'sources indicate,' because independent confirmation of a stranger's private actions is rarely available at all -- the rule didn't raise the story's reliability, it just relocated every claim one step further from a direct assertion."
  - "A compliance policy requires employees to state only what they have personally witnessed when filing an incident report, never what a colleague told them. The resulting reports are technically compliant and functionally useless, since almost everything worth reporting in a workplace was learned from someone else -- the policy forces every honest report to admit its own limits while leaving out the information that made it worth filing."
critical-questions:
  - "Isn't some hedging obviously good practice -- shouldn't a careful reporter distinguish confirmed fact from rumor? Distinguishing degrees of confidence is exactly what a good reporter does, and it's not what Twain's rule demands. The rule doesn't ask for calibrated hedging; it asks for personal verification as the ONLY admissible basis for any statement, which is a much stronger and, Twain shows, unmeetable demand."
  - "Couldn't Twain have just verified the facts by asking Mrs Jones directly, rather than hedging everything? Asking her would still only yield her own testimony, which the rule equally forbids treating as verified -- he'd have to personally witness her being a society leader, being married to an attorney who is in fact an attorney, and so on, each of which bottoms out in someone else's word. The rule doesn't fail because Twain was lazy about checking; it fails because personal verification of an ordinary social fact isn't available to be had."
