id: lex-6yuvt
name: forcing-past-a-subordinates-unexplained-refusal-costs-what-investigating-it-would-not-have
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'When a subordinate agent balks at a boundary for reasons its handler cannot perceive, the handler has two options: force it through, or stop and investigate why. In the Jataka''s tale, king Kalinga''s state elephant halts at the edge of the sacred bo-tree circuit and will go no further, "again and again the king urged him on, but pass he could not." The king''s own chaplain, seeing the same ground the elephant refuses, dismounts and looks closely rather than dismissing the animal''s balking: "This," thought he, "is the place where all the Buddhas have crushed all the desires of the flesh; and beyond this none can pass, no not if he were Sakka himself." He reports what he found and advises the king to descend. But the king does not wait for that judgment before it arrives — he has already driven the goad into the animal to test the soothsayer''s claim by force: "Pierced, the creature trumpets loudly, shrill as any heron cries, moved, then fell upon his haunches neath the weight, and could not rise" — and dies. Only after killing the first elephant does a second, willingly, carry the king across the same ground the first had refused.'
