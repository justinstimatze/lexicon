    quote: "'My thesis is that what we call \"science\" is differentiated from the older myths not by being something distinct from a myth, but by being accompanied by a second-order tradition -- that of critically discussing the myth. Before, there was only the first-order tradition. A definite story was handed on. Later there was still, of course, a story to be handed on, but with it went something like a silent accompanying text of a second-order character: \"I hand it on to you, but tell me what you think of it. Think it over. Perhaps you can give us a different story.\" This second-order tradition was the critical or argumentative attitude.'"
canonical-instances:
  - "A junior engineer's design doc and a senior architect's design doc might propose equally weak first drafts -- the org's actual engineering culture is revealed not by which draft is smarter, but by whether either author expects a design review where colleagues are invited, and obligated, to try to break it. A team that skips review isn't necessarily worse at drafting; it's missing the second-order habit that would improve the draft over successive iterations."
  - "Two religious traditions can hand down origin stories of comparable narrative sophistication; what differs is whether either tradition also hands down a standing practice of textual criticism, comparative source analysis, or reasoned dispute about the story's claims. A tradition with that second practice attached will see its account of the world change across centuries in ways a tradition without it will not, independent of which origin story started out more 'reasonable.'"
  - "A company's post-mortem culture, not the quality of any single decision, predicts whether its strategy improves over time. Two companies can make an equally bad call; the one that treats the call as open to challenge ('tell me what was wrong with this reasoning') accumulates better decisions over subsequent quarters, while the one that treats the call as settled repeats the same mistake under different names."
critical-questions:
  - "Doesn't this prove too much -- does ANY tradition of argument and challenge count as producing something science-like, even one with no commitment to testing claims against observation? Popper's own account folds observation back in immediately: the critical challenge that matters for science specifically asks whether the account fits what can be observed, over and above whether it's internally elegant or persuasive. A second-order tradition of purely rhetorical disputation, with no observational check built into what counts as a 'better account,' would produce refined argument without producing science."
  - "How does this relate to falsifiability [[lex-vmas8]] -- is the second-order critical tradition just falsifiability by another name? They're related but not identical: falsifiability is a property a single claim can have or lack (does some observation forbid it?); the second-order tradition described here is a social and historical practice -- a habit of successive generations actually mounting that challenge -- that a community can have or lack independent of whether its individual claims happen to be falsifiable in principle. A claim can be falsifiable in isolation while the community around it never actually practices the challenge that would exploit that."
