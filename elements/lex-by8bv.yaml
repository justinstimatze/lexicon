id: lex-by8bv
name: fifty-percent-failure-rate-maximizes-information-generated
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When designing a test purely to generate information (not to validate a design), don't aim for a low failure rate — aim for a 50 percent chance of failure, since that's the point of maximum information yield. Reserve near-100-percent-success testing for validation tests, and be honest about which kind of test you're actually running before picking a target failure rate."
related: [lex-v3vk3]
evokes: ["LD50", "the-binary-search-connection", "information-content-as-degree-of-surprise"]
lineage:
  - source: primary
    text: reinertsen-2016-principles-of-product-development-flow-ch4-optimum-failure-rate
    citation: "Donald G. Reinertsen, The Principles of Product Development Flow (2nd ed. 2016), Ch.4 'Exploiting Variability,' Principle V4 'The Principle of Optimum Failure Rate.' Drawing on Hartley's 1928 information theory (information content as a logarithmic function of an event's probability), Reinertsen shows that a two-outcome test generates maximum information at a 50 percent failure rate — the same point pharmaceutical toxicology testing targets with LD50 (the dose lethal to 50 percent of subjects), and the same logic behind binary search."
    quote: "[Reinertsen 2016, Ch.4:] 'V4: The Principle of Optimum Failure Rate: Fifty percent failure rate is usually optimum for generating information. ... The average information generated by such a test is a function of its failure rate ... maximum information generation occurs when the probability of failure equals 50 percent. ... This curve shows why testing to failure is so valuable. ... When pharmaceutical companies evaluate the toxicity of new drugs, they determine LD50, the dose that is lethal to 50 percent of the animal subjects. Again, this lies at the peak of the information curve.' [On the distinction that matters:] 'Product developers should clearly distinguish exploratory testing, which should be optimized for information generation, and validation testing, which should be optimized for high success rates.'"
canonical-instances:
  - "LD50 toxicology testing, cited directly by Reinertsen (Ch.4): pharmaceutical companies deliberately target the dose lethal to exactly 50 percent of animal subjects, because that dose sits at the peak of the information curve — a lower or higher lethal-dose target would waste the test."
critical-questions:
  - "Is this test actually exploratory (its job is to generate information) or a validation test (its job is to confirm the design already works)? Aiming for 50 percent failure on a validation test wastes money proving what should already be near-certain."
  - "Is the observed failure rate consistently far from 50 percent in one direction — too low, meaning the test isn't stressing the design enough to learn anything, or too high, meaning it's testing at too immature a stage to generate useful information?"
  - "Are failures actually being documented as carefully as successes? A test run at the right failure rate still generates no new information if the same failure repeats because nobody wrote down what happened last time."
status: active
