name: an-inferior-substitute-passes-only-the-losers-own-self-check
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When you improvise a replacement for something you've lost, the fact that it satisfies your own test of function doesn't mean it's actually equivalent -- your self-check may simply be worse at detecting the loss than an outside observer would be. In Cushing's telling, a blinded Coyote gropes his way through a valley and finds two frozen cranberries where his eyes used to be: 'Ha! said he, lucky fellow, I! Here is one of my eyes. So he picked it up and clapped it into one of his empty sockets; then he peered up to the sky, and the light struck through it. Didn't I tell you so, old fellow? It is one of your eyes.' The cranberries pass his only available test -- light gets through, and that is all he has left to check with. 'He didn't seem to see quite as well as he had seen before, but still the cranberries answered the purpose of eyes exceedingly well, and the poor wretch of a Coyote never knew the difference.' Everyone else could see the difference instantly: 'it was observed when he returned to his companions ... that he had yellow eyes instead of black ones.' The substitution was permanent and obvious to the entire world except the one person whose only available instrument for checking it was the very thing that had been damaged. Diagnostic move: when you've lost something and improvised a replacement, remember that your own satisfaction with the replacement is being judged using the same damaged apparatus that created the need for it in the first place -- ask someone with an intact, external vantage point before declaring the substitution equivalent."
