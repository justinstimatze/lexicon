name: cultivated-envy-of-a-fake-advantage-sells-the-victim-their-own-undoing
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone else's visible advantage draws your envy and they respond by offering to give you the same thing, check whether what impressed you was ever a real capability at all -- an offer to 'install' someone else's advantage in you is most dangerous exactly when that advantage was staged rather than genuine. In Radin's Winnebago Trickster cycle, Trickster has just trapped a hawk by its own head, deep inside a decoy carcass, and is walking around wearing the trapped, dying bird as though it were a tail. A bear, seeing only the tail, is consumed with envy: 'O, Kunu, how that tail becomes you! I wish I could have one too!' Trickster does not correct the misunderstanding; he monetizes it: 'What is the difficulty of obtaining one? Why don't you make one for yourself? ... Anyone who wishes to can get one.' The bear, eager and unsuspecting, consents to the exact procedure that let Trickster acquire his own 'tail': 'Well, let me now first prepare you properly for the tail so that when the hawk comes back I can put him in your rectum.' The bear is then killed. The envy was engineered by presenting a trapped victim as a fashion accessory, and the offer to replicate it was really an invitation to become the next victim. Diagnostic move: before asking someone to give you what they have, verify that what impressed you was a skill or resource, not a captured, suffering, or stolen thing being displayed as though it were a personal attribute -- an eager 'yes, I can get you one too' from someone benefiting from your envy should raise suspicion, not lower it."
