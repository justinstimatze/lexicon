id: lex-zn6gj
name: equal-interval-assumptions-favor-coarse-scales-over-fine-ones
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before aggregating people's ratings, rankings, or feedback by counting how many steps each person moved on their own scale, check whether everyone's steps are actually the same size. Sen's critique of the Goodman-Markowitz cardinalization method targets exactly this: it counts each person's move from one 'discrimination level' to the next as ethically equal in weight, regardless of how coarse or fine that person's own scale happens to be. “There are individuals who tend to be extremists and find things either ‘magnificent’ or ‘horrible’, while others finely differentiate between such things as ‘excellent’, ‘good’, ‘mediocre’, ‘poor’ and ‘awful’. It seems manifestly unfair to make the ethical assumption that the welfare significance of moving the first individual from what he regards as ‘horrible’ to what he finds as ‘magnificent’ is no more than moving the second individual from what he finds ‘poor’ and what strikes him as ‘mediocre’. What is particularly objectionable about this particular mechanism is not that it violates condition I, which of course it does, but that it implies an ethical assumption that will appear to be arbitrary and objectionable.” The extremist's single jump from 'horrible' to 'magnificent' spans their entire range of judgment; the fine differentiator's jump from 'poor' to 'mediocre' spans a sliver of theirs. Counting both as one equal step inflates the coarse rater's voice and discounts the fine rater's. Diagnostic move: whenever an aggregation method tallies steps, ranks, or category-jumps across people rather than magnitudes, ask what happens to someone who simply recalibrates to a coarser or finer scale without any real change in what they feel -- a method whose verdict shifts under that recalibration has confused scale habits for the thing it claims to measure."
