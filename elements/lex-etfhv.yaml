id: lex-etfhv
name: operations-externalized-from-stable-hierarchy-via-double-dispatch
type-in: situation
type-out: structure
_tier: atomic
agent-instruction: "When operation extension feels blocked by class hierarchy, surface double-dispatch / visitor pattern — operations live outside the class hierarchy and dispatch on two types; class structure stays stable, new operations don't require its modification."
related: [lex-9akfh, lex-9nj6a, lex-z8m97, lex-dwycr, lex-p25q4]
scaffolds-from: [lex-9akfh, lex-9nj6a, lex-dwycr]
evokes: [gof-visitor-pattern, double-dispatch, expression-problem, the-dual-dispatch-tradeoff, open-closed-principle, types-vs-operations-axis, sum-types-and-pattern-matching]
lineage:
  - source: practitioner
    text: wikipedia-visitor-pattern-2025-12
    citation: "Wikipedia 'Visitor pattern' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Visitor_pattern). The underlying primary is Gamma, Helm, Johnson, Vlissides 1994 *Design Patterns* (Addison-Wesley). The substrate-claim: when an object-hierarchy is stable but the SET OF OPERATIONS over it grows over time, externalize each operation as a separate Visitor object. The hierarchy provides an accept(visitor) method on each concrete type; the visitor provides a visit(concreteType) method for each type; double-dispatch (the accept call pivots on the receiver-type, then the visit call pivots on the visitor-type) routes to the right operation-on-type combination at runtime. The transferable shape is THE-DUAL-DISPATCH-TRADEOFF: in any system with a (Types × Operations) matrix, you can decide which axis is open-for-extension (without modification) and which is closed. Class-based polymorphism optimizes for adding types (each type implements all operations); visitor optimizes for adding operations (each operation implements visits for all types). This is the EXPRESSION PROBLEM — visitor is one classical OO answer."
    quote: "[Wikipedia 'Visitor pattern', 2025-12 ZIM snapshot:] 'A visitor pattern is a software design pattern that separates the algorithm from the object structure. Because of this separation, new operations can be added to existing object structures without modifying the structures. It is one way to follow the open/closed principle in object-oriented programming.' [On the mechanism:] 'the visitor allows adding new virtual functions to a family of classes, without modifying the classes. Instead, a visitor class is created that implements all of the appropriate specializations of the virtual function. The visitor takes the instance reference as input, and implements the goal through double dispatch.' [On the problem solved:] 'It should be possible to define a new operation for (some) classes of an object structure without changing the classes. When new operations are needed frequently and the object structure consists of many unrelated classes, it's inflexible to add new subclasses each time a new operation is required because [...] distributing all these operations across the various node classes leads to a system that is hard to understand, maintain, and change.' [On the solution:] 'Define a separate (visitor) object that implements an operation to be performed on elements of an object structure. Clients traverse the object structure and call a dispatching operation accept (visitor) on an element — that dispatches (delegates) the request to the accepted visitor object. The visitor object then performs the operation on the element (visits the element). This makes it possible to create new operations independently from the classes of an object structure by adding new visitor objects.' [Wikipedia GoF quote on the pattern:] 'Represent[ing] an operation to be performed on elements of an object structure. Visitor lets you define a new operation without changing the classes of the elements on which it operates.' [On the alternative:] 'Programming languages with sum types and pattern matching obviate many of the benefits of the visitor pattern, as the visitor class is able to both easily branch on the type of the object and generate a compiler error if a new object type is defined which the visitor does not yet handle.' [The substrate-claim is THE EXPRESSION PROBLEM TRADEOFF: visitor is the OO answer for stable-types + growing-operations; sum-types-with-pattern-matching is the FP answer for the same trade-off. One of the 23 GoF behavioral patterns (Gamma-Helm-Johnson-Vlissides 1994).]"
canonical-instances:
  - "Abstract Syntax Tree (AST) traversal in compilers: the AST node types are fixed (Number, BinaryOp, FunctionCall, IfExpression, ...); operations grow (type-checker, pretty-printer, optimizer, code-generator, linter). Each operation is a Visitor. Adding a new optimization adds a new visitor; doesn't modify AST classes."
  - "Document object model traversal: an HTML/XML document tree is the stable hierarchy; rendering, serialization, querying, accessibility-walking are different visitors over the same tree."
  - "Type-system check operations on an IR: type-check, escape-analysis, alias-analysis, constant-propagation are visitors over an IR-node hierarchy that the IR-designer keeps closed."
  - "Linter / static-analyzer rule implementations: ESLint rules, Clang Tidy checks, golangci-lint linters all visit the same AST-types; each rule is a visitor."
  - "Sum-type alternative (Rust, Haskell, OCaml, Scala): pattern-match on an algebraic data type substitutes for visitor — same expression-problem axis (stable types, growing operations) but without the visitor-double-dispatch ceremony. Wikipedia explicitly notes this."
  - "operationally distinct from lex-dwycr strategy-pattern: strategy is ONE-AXIS dispatch (pick which algorithm to use given a single context); visitor is TWO-AXIS dispatch (pick which (operation, type) combo to invoke). Strategy: caller chooses strategy; visitor: visitor and accepting-element collaborate to choose method."
  - "operationally distinct from lex-9akfh decoupling-via-indirection: lex-9akfh is the broad design-rule; visitor is the specific operational case where the decoupling is between the type-hierarchy and the operations-over-it, mediated by double-dispatch."
  - "operationally distinct from lex-z8m97 gof-decorator: decorator wraps elements to ADD behavior at the SAME level; visitor adds OPERATIONS that are EXTERNAL to the elements. Decorator stacks; visitor traverses."
  - "operationally distinct from lex-9nj6a composition-over-inheritance: lex-9nj6a is the meta-rule; visitor is one specific case of composing-operations rather than extending-types-via-inheritance."
  - "compose-related with lex-p25q4 command-pattern: visit-method can be seen as a reified-action (Command) over the element; some visitor implementations reify the visit as a Command for queuing, undo, etc."
critical-questions:
  - "is the type-hierarchy genuinely stable? Visitor's main cost is the (Type × Operation) matrix that must be kept consistent: every new type requires every existing visitor to add a visit(NewType) method. If TYPES are also growing, visitor becomes a maintenance burden. Practitioner-discipline: visitor pays off when you EXPECT operations to grow much faster than types. If unsure, prefer pattern-matching (where the compiler enforces completeness) over visitor (where it doesn't)."
  - "is the language a good fit for visitor? In OO without sum-types, visitor is the canonical answer. In FP with sum-types + pattern-matching (Rust, Haskell, OCaml, Scala, Swift), pattern-matching is usually cleaner. In modern OO languages with sealed-classes/exhaustiveness-checks (Kotlin, Java 17+, Scala), visitor can often be replaced. The substrate-claim (operations-externalized) generalizes; the visitor-as-implementation is OO-paradigm-specific."
  - "the EXPRESSION PROBLEM (Wadler): the classical statement of the trade-off — can your language extend BOTH new types AND new operations to a closed hierarchy without modifying old code AND without giving up type-safety? OO with subclassing handles new types; visitor + sum-types handle new operations; tagless-final / Object Algebras / type-classes attempt both. Substrate-relevant: every language imposes a default-extensibility-axis choice; that choice has downstream costs."
  - "double-dispatch overhead: visitor pays per-call overhead (two virtual-dispatches instead of one) and indirection through the accept method. For hot-loops over millions of elements, this can matter. Practitioner-discipline: visitor for expressivity; specialized direct-dispatch (manual switch, JIT compilation, generated code) for performance-critical paths."
  - "does the substrate-claim require object-orientation? No — the substrate-claim is the EXPRESSION PROBLEM AXIS CHOICE (operations-vs-types extensibility), which any language faces. The visitor design pattern is one OO realization; pattern-matching is the FP realization; type-classes (Haskell), traits (Rust), Protocol Extensions (Swift) are other realizations. The substrate-claim is the TRADE-OFF, not the implementation."
