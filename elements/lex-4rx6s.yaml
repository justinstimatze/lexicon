id: lex-4rx6s
name: iatrogenics
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When a remedy causes harm by way of its application, you're seeing iatrogenics. Intervention has costs; sometimes those costs exceed the disease's costs. Before recommending intervention, calculate the iatrogenic risk against the no-action baseline."
related: [lex-jv983, lex-8ennw, lex-gfb9k, lex-dxx5k, lex-u5869, lex-k2kdc, lex-fmgeg, lex-4u23a]
evokes: [the-cure-is-worse-than-the-disease, do-no-harm, intervention-bias, semmelweis-reflex, harm-by-the-healer]
lineage:
  - source: primary
    text: taleb-2012-antifragile
    citation: "Nassim Nicholas Taleb, Antifragile: Things That Gain from Disorder (Random House 2012, Incerto Book 3) — Chapter 7 'Naive Intervention' explicitly introduces the term and generalizes it from medicine to policy, economics, parenting, journalism. Verified verbatim."
    quote: "The name for such net loss, the (usually hidden or delayed) damage from treatment in excess of the benefits, is iatrogenics, literally, 'caused by the healer,' iatros being a healer in Greek. [Ch.7 — the definition.] Until penicillin, medicine had a largely negative balance sheet — going to the doctor increased your chance of death…it was 'scientific progress,' the birth of the clinic and its substitution for home remedies, that caused death rates to shoot up, mostly from what was then called 'hospital fever'—Leibniz had called these hospitals seminaria mortis, seedbeds of death. [Ch.7 — the well-meaning intervention is the harm-source, not a side-effect of it.] The famously mistreated Austro-Hungarian doctor Ignaz Semmelweis had observed that more women died giving birth in hospitals than giving birth on the street…the doctors who kept killing patients could not accept his facts or act on them since he 'had no theory' for his observations. [Ch.7 — the Semmelweis case: iatrogenics + social-epistemic blockage to recognizing it.] The very notion of iatrogenics is quite absent from the discourse outside medicine. [Ch.7 — Taleb's crucial extension: the concept is needed everywhere, not just medicine.]"
  - source: practitioner
    text: hippocratic-tradition
    citation: "Hippocratic Corpus (5th–4th century BCE) — the maxim 'primum non nocere' ('first, do no harm'), though not verbatim in Hippocrates' own works, is the canonical Western-medical formulation of the iatrogenics-aware posture: action carries risk; default is restraint when harm is possible. Taleb explicitly anchors iatrogenics to the Hippocratic tradition (Ch.21), writing that medicine has known about iatrogenics since at least the fourth century before our era. The closest documented source in the Hippocratic Corpus itself is Epidemics Book I §11, on making a habit of helping, or at least doing no harm — a historical pointer, and no verbatim quote from Hippocrates is claimed here. Substantive grounding for the iatrogenics primitive itself is carried by Taleb 2012 above."
  - source: primary
    text: gilman-1892-the-yellow-wallpaper
    citation: "Charlotte Perkins Gilman, 'The Yellow Wallpaper,' The New England Magazine (January 1892). A gendered, psychiatric case of iatrogenics predating Taleb's framework by 120 years: the narrator, prescribed S. Weir Mitchell's real 'rest cure' (absolute rest, no work, no writing, no stimulus) for 'temporary nervous depression,' names directly what she believes would actually help and is denied it, then deteriorates into psychosis over the story's course. Gilman underwent the actual rest cure herself and wrote the story as a direct indictment of it — a documented case where the diagnosis (hysteria requiring passivity) was wrong, and the prescribed treatment (enforced idleness and isolation) was the harm-mechanism, not a side-effect of otherwise-sound care. Distinct from the Semmelweis case above: Semmelweis's iatrogenics is a transmission-mechanism failure (germ transfer); Gilman's is a diagnosis-and-treatment-model failure, where the treatment's premise about what the patient needed was itself backwards."
    quote: "'So I take phosphates or phosphites—whichever it is, and tonics, and journeys, and air, and exercise, and am absolutely forbidden to “work” until I am well again. Personally, I disagree with their ideas. Personally, I believe that congenial work, with excitement and change, would do me good.' [Later, on being threatened with an escalated version of the same treatment:] 'John says if I don’t pick up faster he shall send me to Weir Mitchell in the fall. But I don’t want to go there at all. I had a friend who was in his hands once, and she says he is just like John and my brother, only more so!'"
  - source: primary
    text: legge-1899-i-ching-appendix-ii-wu-wang-medicine
    citation: "James Legge, translator, The Yî King (I Ching), Sacred Books of the East vol. 16 (Oxford University Press, 1899), Appendix II (Tuan Zhuan, the Treatise on the Thwan), line commentary on Hexagram XXV (Wû Wang, freedom from insincerity/error). A pre-modern, non-Western attestation of the same principle Taleb names iatrogenics: intervention applied where nothing is actually wrong is itself the harm."
    quote: "'Medicine in the case of one who is free from insincerity!'--it should not be tried (at all)."
  - source: practitioner
    text: antifragile-mining-pass-1
    citation: "promoted from cross-attestation: medicine (Taleb's primary domain; iatrogenic injury kills 3-10× more US patients than car accidents per Ch.7), policy (regulatory capture; well-meaning regulations that create the harm they prevent), software engineering ('fixes' that introduce new bugs; bug-fix-rate vs bug-introduction-rate as the metric), parenting (helicopter-parenting suppressing child antifragility), AI safety (training-for-helpfulness can produce dishonest sycophancy; the alignment intervention is the misalignment source), economics (Alan Greenspan / 'Überfragilista' interventions per Ch.7 producing the very volatility they suppressed elsewhere)"
canonical-instances:
  - "Semmelweis 1847: more women die giving birth in hospitals than on the street; the intervention (going to the hospital) is the harm-source. Compounded by social-epistemic blockage — Semmelweis is rejected and dies in an asylum because he 'has no theory.' The iatrogenics is real AND the social structure prevents naming it"
  - "Gilman's 'The Yellow Wallpaper' (1892): the narrator, prescribed the real S. Weir Mitchell rest cure for 'nervous depression' — absolute rest, no work, no writing, no stimulus — names directly what she believes would help (congenial work, society, stimulus) and is denied exactly that, then deteriorates into psychosis over the story. Gilman underwent the actual treatment and wrote the story as a direct indictment of it. A gendered, psychiatric iatrogenics case, and a different failure mode from Semmelweis: not a transmission-mechanism error but a diagnosis-and-treatment-model that had the patient's actual need backwards"
  - "software bug-fixes that introduce regressions: 'we fixed the deadlock' adds three new race conditions. The intervention is well-intentioned and the metric (deadlock-rate) improves; the net effect on correctness can be negative. Detection requires measuring iatrogenic-introduction-rate alongside fix-rate"
  - "The I Ching's Tuan commentary names the same principle nearly three millennia before Taleb, in one line on Hexagram XXV: medicine 'in the case of one who is free from insincerity' — someone with nothing actually wrong — 'should not be tried (at all).' A pre-modern, non-medical-tradition attestation that the harm-mechanism isn't specific to Western clinical practice: treating a sound state is itself the error, independent of the treatment's own quality"
  - "regulatory capture: a regulation written to prevent harm X creates the legal framework within which exploitative actor Y operates with unprecedented protection. The regulator is the harm-source-enabler, not just an absent guardian"
  - "operationally distinct from lex-8ennw harm-as-resource-via-redirection (Taleb explicitly cites the inverse direction): harm-as-resource is 'apparent-weakness becomes input for strengthening'; iatrogenics is 'apparent-help becomes input for harm.' Same shape, mirrored valence. The pairing diagnostically: when an actor's intervention is studied, BOTH inverses should be checked (could harm-here actually be a resource? could help-here actually be net iatrogenic?)"
  - "operationally distinct from lex-jv983 fluency-trap: fluency-trap is about reasoning-feel (fluent inference seems true); iatrogenics is about action-effect (helpful action causes net harm). Fluency-trap can produce iatrogenics (a fluent intervention-theory licenses the harmful intervention) but the harm-causation is the iatrogenic part"
  - "the Semmelweis-reflex sub-mechanism: pattern of rejecting evidence of iatrogenics specifically because no theoretical account exists for the observed harm-pattern. Iatrogenics is structurally hard to detect because the absence-of-causal-theory is the gatekeeper, not the absence-of-data"
critical-questions:
  - "is the harm caused BY the intervention, or just correlated with it? Patients in hospitals are sicker; some 'hospital-acquired harm' is selection effect on baseline severity. The atom requires the intervention be the causal mechanism. Discriminator: counterfactual — would equivalent patients without the intervention be worse off, or just as bad? Without the counterfactual, iatrogenics-claims are diagnostically weak."
  - "is the net effect actually negative, or just visible-harm against invisible-benefit? Most interventions create both. Cancer chemotherapy has severe iatrogenic effects AND saves lives; the atom fires only when the iatrogenic side dominates the gross expected effect. Selectively naming the harm without the offsetting benefit is misuse — it can argue against all intervention indifferent to net effect."
  - "is the intervention being judged at the right time horizon? Antibiotics save lives short-term and create resistant pathogens long-term. Same intervention; opposite iatrogenics-verdict depending on horizon. Before invoking the atom, name the time-scale at which the iatrogenic effect emerges; if it's outside the decision-maker's planning window, the atom may be raising a real concern that won't move the decision."
  - "what was the alternative-to-intervention? 'Do nothing' is itself an intervention with its own harm profile (untreated condition progresses; untreated patient dies). Iatrogenics-claims sometimes covertly assume a zero-harm baseline that doesn't exist. Force the comparison to be intervention-A vs intervention-B (where B may be inaction), not intervention-A vs perfection."
  - "is the Semmelweis-reflex operating on YOUR side? You may be the actor whose intervention is iatrogenic and whose social/institutional structure prevents naming it (no theoretical account; career-cost of admitting; etc). The atom is most actionable when applied reflexively — am I producing the harm I'm intending to fix? The pattern is hardest to see when you are the actor inside it."
status: active
