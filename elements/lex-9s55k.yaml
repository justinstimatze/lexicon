id: lex-9s55k
name: reframing-an-exposed-transgression-as-moral-teaching-earns-release
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Caught in an act that would normally invite punishment, delivering an eloquent piece of moral teaching drawn from the very incident can convert the moment of exposure into an occasion for admiration instead of penalty — the accusation dissolves into permission. In the Jataka's tale of the self-testing priest, caught stealing coins and brought before the king as a thief, he doesn't deny it or beg for mercy — he recites a stanza on the power of virtue, and the encounter ends with the king's blessing to leave and become an ascetic: 'After thus praising virtue in the first stanza, he gained the king's consent and adopted the ascetic life.'"
related: []
evokes: [jataka, catukkanipata, silavimamsa-jataka, eloquence-about-the-offense-converts-punishment-into-blessing, an-accusation-dissolved-by-turning-it-into-a-teaching-moment]
lineage:
  - source: primary
    text: jataka-chalmers1895-silavimamsa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 330, Silavimamsa-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "After thus praising virtue in the first stanza, he gained the king's consent and adopted the ascetic life."
canonical-instances:
  - "Caught having quietly redirected company funds toward an unauthorized but genuinely valuable community program, an employee doesn't deny anything. Instead they deliver a compelling account of what the program achieved, and the disciplinary meeting ends with leadership offering them a formal role running it rather than a termination notice."
critical-questions:
  - "Does this reward eloquence and confidence over actual accountability — would the same reframing have worked for someone less articulate, committing the exact same offense?"
  - "Is the king's leniency here specific to this priest's already-established reputation, meaning the tactic depends on prior standing rather than being available to anyone caught in similar circumstances?"
status: active
