id: lex-hxesr
name: the-act-of-truth-a-confession-of-a-real-imperfection-used-as-a-causal-lever
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'A formal ritual utterance can be built not on a boast but on an honest, often unflattering confession of a true personal fact, with the sincerity of the confession itself treated as the causal mechanism that produces a real effect in the world. In the Jataka''s tale of Kanhadipayana, three successive Acts of Truth cure a snakebite, each one a confession of imperfection rather than a claim of virtue — the ascetic admits ongoing reluctance about his own vocation: "Seven days serene in heart Pure I lived, desiring merit: Since then, for fifty years apart, Self-absorbed, I do declare it, Here, unwillingly, I live: May this truth a blessing give: Poison baulked, the lad revive!"'
related: [lex-mcbfv]
evokes: [jataka, dasanipata, kanhadipayana-jataka, act-of-truth, saccakiriya, confession-as-causal-lever]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanhadipayana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 444, Kanhadipayana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Seven days serene in heart Pure I lived, desiring merit: Since then, for fifty years apart, Self-absorbed, I do declare it, Here, unwillingly, I live: May this truth a blessing give: Poison baulked, the lad revive!"
canonical-instances:
  - "A family therapist has each parent state, out loud and specifically, the one thing about their marriage they have never admitted even to themselves, on the premise that the honesty of the admission — not its content being flattering — is what actually shifts the family's stuck dynamic."
critical-questions:
  - "Is the causal power attributed to the Act of Truth here doing any real explanatory work, or is it a narrative device standing in for the more mundane observation that honest confession often precedes genuine change?"
