    quote: "Monod makes this point with the analogy of a sugar crystal forming in a sugar solution. If you dissolve enough sugar in hot water, and then cool the water, crystals will always form. The cooling in a sense “creates” the crystals, but the creation is not “absolutely new” the way the surviving consequences of a mutation are new. In the case of the sugar crystal, “the necessary information was present, but unexpressed, in the constituents. [Such] building of a structure is not a creation; it is a revelation,” while evolutionary creation, by contrast,”arises from the essentially unforeseeable [and] is the creator of absolute newness.” Like the sugar crystal, the butterfly that emerges from its chrysalis reveals a structure that already exists; in any one species, every chrysalis always reveals the same butterfly. There is no surprise, nothing absolutely new."
canonical-instances:
  - "A large language model trained on existing text can produce outputs that feel surprising and novel to a reader, but if every output is ultimately derivable from patterns already present in the training data, it is performing an elaborate revelation of latent structure rather than the kind of genuine, informationally disconnected creation a truly novel input would produce."
  - "A student's brilliant essay is praised as wonderfully original, but if every idea in it can be traced back to arguments already present in the assigned readings, competently recombined, the essay is a sophisticated revelation of the source material's latent implications rather than a case of genuinely new thought disconnected from what was given."
critical-questions:
  - "Is this distinction actually verifiable in most real cases, given that establishing whether an outcome was 'derivable in principle' from prior information requires a kind of omniscient hindsight that's rarely available when judging whether something counts as genuinely new in the moment?"
  - "Does the distinction between revelation and creation actually matter practically, if a sufficiently surprising and valuable revelation of latent structure produces the same beneficial outcome as genuine creation would have -- is the metaphysical distinction doing real work, or is it a technicality?"
  - "Could almost anything be reframed as revelation of latent information by expanding what counts as 'the system' widely enough, since even a genetic mutation is constrained by the chemistry of DNA, meaning the revelation/creation line might be less sharp than the sugar-crystal example suggests?"
