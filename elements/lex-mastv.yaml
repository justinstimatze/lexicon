    quote: "In ridding themselves of their television businesses, these companies failed to distinguish between divesting the business and destroying their video media-based competencies. They not only got out of the TV business but they also closed the door on a whole stream of future opportunities reliant on video-based competencies. The television industry, considered by many U.S. companies in the 1970s to be unattractive, is today the focus of a fierce public policy debate about the inability of U.S. corporations to benefit from the $20-billion-a-year opportunity that HDTV will represent in the mid- to late 1990s. Ironically, the U.S. government is being asked to fund a massive research project—in effect, to compensate U.S. companies for their failure to preserve critical core competencies when they had the chance."
canonical-instances:
  - "GE, Motorola, GTE, Thorn, and GEC exiting the color-television business in the 1970s-80s, unintentionally destroying video-media competencies that would have positioned them for the multi-billion-dollar HDTV opportunity a decade later."
  - "Sony scaling back its VCR business after the Betamax defeat while explicitly preserving its videotape-recording competence, which it then redeployed to compete in the 8mm camcorder market."
  - "a company shutting down an internal developer-tools team because the specific tool wasn't widely adopted, losing the infrastructure expertise that could have solved the company's next three platform problems."
critical-questions:
  - "isn't exiting a genuinely unprofitable business always the right call? The claim isn't that the exit decision is wrong — it's that the exit decision and the competence-destruction decision are usually made together without being examined separately. A company can exit the product and still find a way to preserve the underlying capability (through redeployment, licensing, or a skeleton unit), as Sony's contrast case shows; the failure mode is not noticing there were two decisions to make."
  - "how is this different from lex-cy243 cost-decline-barrier-holds-only-if-its-source-resists-copying? lex-cy243 is about evaluating whether an EXISTING competitive position (a cost advantage) is actually defensible, by tracing its mechanism. This atom is about a DECISION under your own control (whether to exit a business) that can unknowingly destroy an asset (a transferable competence) that the decision-maker wasn't explicitly weighing. Both share the deeper move of 'the surface fact doesn't tell you what's really at stake — trace the underlying mechanism or asset' — lex-cy243 applies it to judging a rival's moat, lex-mastv applies it to judging your own exit decision."
  - "does this apply only to physical/technical competencies like video engineering? No — the mechanism generalizes to any transferable, hard-to-rebuild capability embedded in a business unit: institutional relationships, domain-specific judgment, a trained team's tacit know-how. The diagnostic question is the same regardless of what kind of competence is at risk: does this unit contain a capability that outlives the specific product it currently serves?"
