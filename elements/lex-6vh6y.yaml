lineage:
  - source: primary
    text: merton-1957-need-precipitates-invention-demands-restatement
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIX 'Science and Economy of 17th-Century England,' p.610. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'The widely accepted notion that need precipitates appropriate inventions and canalizes scientific interests demands careful restatement.'"
  - source: primary
    text: merton-1957-needs-so-general-they-explain-little
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.610."
    quote: "'In the technical sphere, needs far from being exceptional, are so general that they explain little. Each invention de facto satisfies a need or is an attempt to achieve such satisfaction.'"
  - source: primary
    text: merton-1957-need-must-be-culturally-experienced-to-direct-interest
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.610."
    quote: "'It is only when the goal is actually part and parcel of the culture in question, only when it is actually experienced as such by some members of the society, that one may properly speak of a need directing scientific and technological interest in certain channels.'"
  - source: primary
    text: merton-1957-foster-mother-of-invention
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.610."
    quote: "'But given the routine of fulfilling certain types of needs by technologic invention, a pattern which was becoming established in the seventeenth century; given the prerequisite accumulation of technical and scientific knowledge which provides the basic fund for innovation; given (in this case) an expanding capitalistic economy; and it may then be said that necessity is the (foster) mother of invention and the grandparent of scientific advance.'"
canonical-instances:
  - "A tech pundit explains a startup's breakthrough by saying 'there was a real need for this' -- but the need (people wanting X) long predated the product and was present in every failed competitor's market too; the actual explanatory variable was a newly cheap enabling technology or newly available distribution channel, not the need, which never varied."
  - "\"Necessity is the mother of invention\" applied to wartime technology: the claim explains nothing about why a particular breakthrough emerged from one war specifically rather than any other, since militaries have always needed better weapons; the actual explanatory variables are the newly available industrial capacity, the specific accumulated scientific stock, and the specific funding structures that made that war's need, unlike previous wars' identical need, something researchers could actually act on."
  - "operationally distinct from lex-v6nqz eliminative-paired-comparison-isolates-cause-by-presence-absence-of-circumstances (Mill's canons): lex-v6nqz supplies the general logical apparatus for isolating a cause by finding paired instances that differ in the candidate factor's presence or absence. This atom names a specific precondition check that has to pass before Mill's apparatus is even applicable: if the candidate cause (need) never varies across any available instance -- it's present in every case, including the ones where the effect didn't occur -- there is no pair to compare, and invoking it as an explanation isn't weak evidence, it's a category error. lex-v6nqz tells you how to run the comparison once a genuine candidate is on the table; this atom tells you when a candidate ('need') fails to qualify as one at all."
critical-questions:
  - "How do you tell a genuine culturally-activated need (one that is actually directing effort) from a need that a later observer has simply projected backward onto history because the resulting invention happens to satisfy it? Merton's own caution -- 'each invention de facto satisfies a need or is an attempt to achieve such satisfaction' -- means post-hoc need-attribution is always available and therefore never, by itself, evidence of anything."
  - "If a need must be 'actually experienced' by 'some members of the society' to count as causally operative, how large or influential must that subgroup be? A need felt acutely by a small merchant elite with the resources to direct research (Merton's actual case) plausibly has more channeling power than the same need felt diffusely by an unorganized majority -- does the mechanism require weighting by the group's capacity to act on the need, not just the need's bare presence in someone's experience?"
