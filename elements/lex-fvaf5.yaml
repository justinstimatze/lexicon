    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), New Introduction, Chapter A5 'The Idea of Rights,' p.cxxxv."
    quote: "“It is possible to define social states in terms of what can be called 'culmination outcomes' (e.g. 'Anne got the medical support to which she was socially entitled'), or more fully described as 'comprehensive outcomes' (e.g. 'Anne exercised her socially recognized right for medical support and obtained it, rather than being given it through charity'). An articulation of the comprehensive outcome can enrich bare-bone consequential descriptions by bringing into them the processes through which the final outcomes come about.”"
canonical-instances:
  - "Hypothetical: A company reports that two employees each received a promotion this quarter, treating the two cases as identical outcomes on the org chart. One employee applied through the standard review process and was selected on merit; the other got the title after a manager quietly arranged it as a favor, bypassing the review entirely. Both employees now hold the same title -- the culmination outcome -- but only one of them earned the promotion through a process either of them, or their coworkers, would treat as equivalent."
  - "Hypothetical: A city's homelessness dashboard counts 'housed' as a single outcome category, with no distinction between someone who moved into permanent supportive housing through a stable program and someone temporarily placed in a shelter bed the same week the count was taken. Both show up as 'housed' in the culmination-outcome tally, even though only one of them reflects a housing situation anybody involved would call resolved."
critical-questions:
  - "Doesn't tracking process alongside outcome just make every comparison more complicated, when sometimes the end state really is all that matters? Sen isn't arguing the end state never matters on its own -- culmination outcomes remain a legitimate and often sufficient description for many purposes. The diagnostic is for cases where the process carries independent weight for the people involved (dignity, entitlement versus charity, earned versus granted), and treating those cases as equivalent to ones where it doesn't is where the error creeps in."
  - "Who decides which processes are the ones worth tracking, given that almost any outcome has some process behind it? There's no universal list -- Sen's own examples (entitlement versus charity, exercising a right versus receiving a favor) suggest the test is whether the people actually involved would care about the difference. If they would, the culmination-outcome description is too thin for the purpose at hand; if they wouldn't, it may be perfectly adequate."
