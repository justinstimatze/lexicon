id: lex-ad7eg
name: an-unshared-position-tests-affiliation-better-than-a-shared-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two groups arrive at the identical position on one issue, resist treating that agreement as evidence they share an underlying affiliation or worldview. Check a different, unshared position instead -- that's the actual test. Lakoff's case: libertarians and political liberals both strongly advocate civil liberties, which looks like real common ground. But the libertarian's advocacy comes from an extremely pragmatic conservatism -- self-interest as the end, with a moral focus on government noninterference -- while the liberal's comes from empathy and a commitment to fair distribution. These are two unrelated generating mechanisms that happen to output the same conclusion on this one issue. Because the mechanisms are otherwise unrelated, they predict the two groups will diverge sharply everywhere else: libertarians oppose welfare, affirmative action, and the progressive income tax exactly as central conservatives do, none of which liberal civil-libertarians would share. The shared position was never diagnostic of anything; a single point of agreement between two systems tells you almost nothing about whether the systems are actually related, because two independent mechanisms can converge on one output by coincidence of structure rather than by shared origin. Diagnostic move: when trying to determine whether two people or groups share an underlying system, don't test the position where they already agree -- test a position their two different generating mechanisms would predict to diverge, since that's where the real evidence lives."
related: []
evokes: [george-lakoff, moral-politics-1996, libertarians, civil-liberties, shared-conclusion-different-mechanism]
lineage:
  - source: primary
    text: lakoff-1996-libertarian-liberal-superficial-similarity
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 17 'Varieties of Liberals and Conservatives,' section 'Libertarians.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“The fact that libertarians and political liberals both strongly advocate civil liberties is a superficial similarity. They do so for very different reasons, out of different moral impulses, with a very different spirit. Though two steps away from mainline conservatism, libertarians are conservatives in three very important respects.”"
canonical-instances:
  - "The direct textual anchor, on where the two mechanisms actually come from: 'The advocacy of civil liberties in Nurturant Parent morality comes from the nurturance model, especially the concern with empathy, with fair distribution, with happiness, with development of one's potential, and so on. Empathy and fair distribution are not libertarian concerns.'"
  - "Hypothetical: two hiring managers at different companies both insist on removing names from resumes before the first screening round, and a diversity consultant cites their shared practice as evidence both companies take equity seriously. Digging further, the first manager only adopted it after a lawsuit made unstructured hiring too risky to defend in court. The second genuinely believes blind screening surfaces whoever is most qualified, lawsuit or not. Checking a different practice -- whether either company tracks outcomes by demographic group afterward -- immediately shows the two companies otherwise operate nothing alike, which the shared resume policy never predicted either way."
critical-questions:
  - "The mechanism assumes the two generating systems are actually independent rather than secretly sharing some deeper structure that produces both the agreed-on position and the predicted divergences. How would you rule out a third possibility -- that libertarians and liberals share some root commitment neither Strict Father nor Nurturant Parent morality names, which happens to generate both civil-liberties agreement and the observed divergence on everything else -- rather than concluding the shared position is coincidental?"
  - "If a single shared position is weak evidence of affiliation, how many shared positions would it take before the agreement stops being coincidental and starts being diagnostic? The mechanism explains why one point of agreement isn't enough, but doesn't say what would be, which matters if a real-world case shows several points of overlap rather than exactly one."
