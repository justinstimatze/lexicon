  - source: primary
    text: radin-the-trickster-myth-opens-by-satirizing-the-warbundle-ritual
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'Winnebago History and Culture.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "To be a successful warrior was the highest ideal of a Winnebago, and it was in the warbundle rites that this ideal received its greatest glorification. It has, therefore, a very deep significance, psychologically and culturally, that the Winnebago Trickster myth should begin with what is essentially a satire on the warbundle ritual. The same significance attaches to the fact that of all Winnebago religious beliefs and practices the only one mentioned in the Trickster myth, and satirized, is the acquisition of a guardian spirit."
canonical-instances:
  - "A military academy's own most-repeated origin legend centers on a founding officer's ceremonial blunder during the institution's most solemn tradition, and cadets retell it affectionately every year even though an outsider mocking the same tradition would be treated as a serious insult."
  - "A religious order's founding story includes an episode where its own most revered ritual is performed incompetently by the founder, and the order preserves this detail in its official history rather than editing it out."
critical-questions:
  - "Does the satire in the Trickster myth function as license for the community to laugh at the ritual without threatening its actual practice, or does repeated mockery within a sacred narrative eventually erode the seriousness with which the ritual itself is treated?"
  - "Is Radin's inference of deep significance from the choice of target verifiable, or could the warbundle-satire opening be better explained by narrative convenience or structural convention, rather than a genuine cultural self-critique?"
  - "Would this diagnostic apply equally to a satire imposed on a tradition from outside, or does the mechanism specifically require that the satire be authored and preserved by members of the tradition being satirized?"
