id: lex-y48fs
name: pyramid-of-choice-incremental-self-justification-drives-similar-starters-apart
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When two parties whose starting positions were nearly identical now defend opposite poles, suspect a pyramid-of-choice trajectory rather than original difference. Each small choice produces dissonance that drives retrospective justification; the justification raises commitment, which makes the next small choice in the same direction easier. Two near-identical starters diverge to opposite corners not because of original disagreement but because of accumulated micro-justifications. Diagnostic intervention: short-circuit the trajectory at the FIRST small choice, when commitment is still cheap to reverse, not at the bottom when reversal requires repudiating the whole accumulated self-narrative."
