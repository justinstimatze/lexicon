lineage:
  - source: primary
    text: eastman-comrades-mashtinna-trades-places-twice-without-assessing-capacity
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twentieth Evening: The Comrades.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'The pain was worse than he had supposed, but he bore it as long as he could without crying out... at last he could endure it no longer, and called loudly upon his comrade to help him.' ... 'Instantly the youth appeared and gave him back his eyes, saying at the same time: \"Friend, be not so rash in future! It is right to help those who are in trouble, but one must also consider whether he himself is able to hold out to the end.\"'"
canonical-instances:
  - "A friend offers to move in and become a full-time caregiver for a chronically ill relative without first honestly assessing their own physical stamina, financial reserves, or emotional resilience for the role, and within months burns out completely, needing the relative's family to step in and manage both the original care crisis and the friend's own collapse."
  - "A manager, moved by an underperforming employee's personal struggles, personally takes over the employee's entire workload to give them a break, without checking whether they can actually sustain double their normal output alongside their own job -- and within weeks is behind on everything, needing their own manager to intervene and unwind an arrangement that was well-intentioned but never actually assessed for feasibility."
critical-questions:
  - "does insisting on a capacity check before every act of trading-places-style help risk making people overly cautious about a form of generosity that's genuinely valuable precisely because it's costly and immediate -- does hesitation to assess capacity sometimes cost more than acting rashly would have?"
  - "how does someone accurately assess their own capacity to endure something they've never actually experienced before -- Mashtinna couldn't have known the pain would be 'worse than he had supposed' until he was already in it, so what does an honest capacity check actually look like in advance?"
  - "is having a reliable rescuer to call on (as Mashtinna does) actually a safety net that makes rash, capacity-unchecked offers of help more defensible, since the worst outcome is a call for backup rather than total failure -- does this framework undervalue the safety that a strong support network provides against exactly this risk?"
