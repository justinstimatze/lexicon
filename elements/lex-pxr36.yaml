id: lex-pxr36
name: ranking-two-options-doesnt-require-knowing-the-ideal
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before insisting that a debate over which of two options is more just (or better, or fairer) first settle what the perfectly just outcome would look like, check whether the comparison actually needs that answer. Sen distinguishes two traditions in justice theory: one that defines the perfectly just society and treats everything as either fully just or not, and one that compares real alternatives to see which is more or less just. Sen: “This approach has two distinct and separable features. First, it concentrates on the nature of the perfectly just society, rather than on making comparisons between justice in different societies, in terms of comparative justice and injustice. This perfection-focused approach concentrates only on the 'just' society that cannot be 'transcended' in terms of justice, and it is concerned with the partition between 'the just' and 'the unjust', rather than with comparative judgements of being 'more just' or 'less just'.” Knowing that a Rembrandt is superior to a stick-figure sketch requires no theory of the perfect painting -- and identifying that abolishing a specific injustice would leave a society more just requires no completed account of the ideally just society either. Diagnostic move: before a debate stalls on defining the perfect end-state, ask whether the actual question on the table is a ranking between two real, specific alternatives. If it is, a comparative judgment can proceed without ever settling what the ideal looks like -- demanding the ideal first is adding a much harder problem to a question that didn't require it."
