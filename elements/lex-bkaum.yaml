id: lex-bkaum
name: pisteis-ethos-pathos-logos-as-three-independent-proof-channels
common-name: "The three modes of persuasion"
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When constructing OR auditing persuasion (speech, paper, advertisement, model output, UI flow, courtroom argument), separate three INDEPENDENT proof channels: (1) ethos — the perceived credibility of the speaker AS THE AUDIENCE READS IT IN THIS SPEECH (character, motive, expertise, trust-track); (2) pathos — the emotional frame the speech puts the audience into (the disposition from which they will judge); (3) logos — the proof-from-the-words-themselves (the argument-internal logic the speech displays). Aristotle (Rhet I.2, 1356a) names these as the three modes of persuasion and treats them as substitutable but NOT redundant — a persuasive act that wins on logos alone but loses on ethos is structurally weaker than one that wins on all three, and a persuasive act that wins on pathos alone with bad logos collapses on later audit. The transferable claim is the DECOMPOSITION (three orthogonal channels), not a rule 'use all three.' The diagnostic on any persuasive artifact: which mode is its primary channel? Which is it neglecting? Which is it accidentally INVERTING (e.g., a paper with strong logos signed by an author whose ethos is broken)? The trio is also a forensic self-defense: when persuasion succeeds against your better judgment, decompose to ask 'which mode carried me — argument, speaker, or my own mood?' — preventing being persuaded by one channel while believing you were persuaded by another. Crucially, ethos here is the AUDIENCE-FACING perception within the speech-event (distinct from lex-mthv9 hexis, the speaker's actual stable disposition); the rhetorical ethos can be crafted, the hexis cannot. The pathos channel is also Aristotle's bridge to his theory of emotions (Rhet II.2-11, which provides the substrate for emotion-specific cognitive frames)."
