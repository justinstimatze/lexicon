id: lex-kxber
name: granting-power-and-then-disclaiming-its-misuse-are-separable-acts
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A person or authority who grants someone real power, status, or a defined mission can later hold the full grant as fully real while still disclaiming any responsibility for how the recipient actually used it, treating the grant and the outcome as two entirely separable acts. Earthmaker's speech to Wakdjunkaga does exactly this: he first affirms the grant was genuine and generous, 'I created you good natured: I made you a sacred person... you were given the greatest of powers,' then draws a hard line at what happened next: 'What happened to you after you reached the earth that you brought upon yourself alone. It is because of your own actions and activities that you became the butt of everyone's jest... It was not anything I told you to do. It is therefore your own fault... I did not create you to injure my creation.' Earthmaker doesn't deny giving Wakdjunkaga the power to do real harm or real good -- he simply insists that the choice of which one Wakdjunkaga made was never his own to answer for. Diagnostic move: when evaluating a claim like 'I gave them everything they needed, what they did with it is on them,' separate the two claims and check each independently -- whether the grant of power or resources was genuinely adequate is one question, and whether the grantor bears any responsibility for foreseeable misuse is a different one, and a speaker can be telling the truth about the first while using it to obscure the second."
