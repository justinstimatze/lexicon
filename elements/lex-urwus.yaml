id: lex-urwus
name: passive-proximity-to-grandeur-is-mistaken-for-personal-importance
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Being carried alongside, near, or by something impressive can be mistaken by the one being carried for evidence of their own comparative standing, when the only actual similarity is the surface structure of the situation. In the Jataka's tale, Dingy the crow-goose hybrid is being carried aloft on a stick by his two goose half-brothers when he sees King Videha processing through the city behind four milk-white horses. He draws a direct comparison to his own situation: 'As yonder king goes galloping with his milk-white four-in-hand, Dingy has these, his pair of Geese, to bear him over the land!' Being transported by others isn't inherently meaningless, so that isn't what makes the comparison absurd. Dingy mistakes the structural parallel — being borne along by someone else — for the substantive one he actually lacks: commanding respect, wealth, or authority. His own brothers' furious reaction is the tell that the gap between the two was never actually close."
related: []
evokes: [jataka, dukanipata, vinilaka-jataka, structural-parallel-mistaken-for-substantive-parity, riding-along-with-grandeur-is-not-possessing-it]
