id: lex-hz6u3
name: messengers-approach-choreography-signals-outcome-before-the-words-do
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Before a messenger says anything at all, the physical manner of their approach — walking speed, distance at which they begin speaking, facial demeanor, posture — functions as a pre-verbal information channel that primes the recipient's emotional state ahead of the actual announcement, and skilled messengers deliberately or habitually shape that channel to control how the news lands. Sudnow's Passing On documents the choreography directly from hospital waiting-room observation: 'It seems that a direct relationship exists between the distance at which talk begins and the character of the news. In circumstances of bad news, announcers approach recipients slowly and seldom begin talk before a rather close physical distance separates them, a partial concern being to be in a position where the recipient's response can be shielded from potential onlookers. When good news is brought, everyone present may become involved, the announcement made in tones for all to hear.' The good-news case is vivid: 'One obstetrician at Cohen characteristically shouted out to relatives the sex of the child as he came nearly running down the hall to them,' with surgeons observed to 'leave the operating room with broad smiles on their faces, and begin talking long before they get within usual conversational distance.' The channel operates independently of and prior to content: the recipient reads the outcome from gait and distance before a single word of the actual announcement is spoken, and this pre-signal both prepares them emotionally (so they don't ambush the messenger with anxious questions before bad news, or fail to appropriately share in good news) and lets the messenger control who else witnesses the reaction. Generalize beyond hospitals: a manager's slow, closed-door walk toward a direct report's desk signals a layoff conversation before any words are exchanged, giving the employee time to brace; a lawyer's rushed, smiling approach out of a courtroom signals a favorable verdict to waiting family before the verdict is read aloud; a coach's body language walking toward the bench after a decision on a player's injury telegraphs the severity before the diagnosis is announced. The diagnostic move: separate what was communicated by the approach itself (pace, distance-before-speech, visible affect) from what was communicated by the words — the approach often does more real information-transfer, and controlling it deliberately is itself a skill distinct from choosing what to say."
