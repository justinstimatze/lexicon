id: lex-wtcy3
name: compassion-drives-defection-from-a-punishing-bodys-own-consensus
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a collective that holds real power to punish reaches a unanimous decision to destroy a group of transgressors, an individual member of that collective can privately break ranks to warn the targets, driven by a personal sense of compassion that overrides loyalty to the group''s own agreed verdict. The defection is quiet and unauthorized — the whistleblower doesn''t try to change the collective''s mind, only to give its targets a chance to escape the consequence the collective has already fixed. In the Bhadda-sala-Jataka''s companion tale, after the deities of an island unanimously resolve to drown a colony of carpenters who have defiled it, one of those same deities — ''a righteous deity who was one of them'' — privately appears to the carpenters and warns them of the coming flood so they can build a ship and flee before the sentence is carried out.'
related: []
evokes: [jataka, dvadasanipata, samudda-vanijja-jataka, individual-conscience-overrides-punitive-consensus, whistleblower-inside-an-enforcement-body]
lineage:
  - source: primary
    text: jataka-chalmers1895-samudda-vanijja-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 466, Samudda-vanijja-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Thus they fixed the day. At this a righteous deity who was one of them thought, "I would not that these should perish before my eyes." So in his compassion, at the time when the men were sitting at their doors in pleasant converse, after their evening meal, he made the whole island one blaze of light, and adorned in all splendour stayed poised in the air towards the north, and spoke to them thus: "O ye carpenters! the deities are wroth with you.'
canonical-instances:
  - 'A regulator who voted with the rest of the board to shut down a factory without advance notice quietly tips off a plant manager the week before, so workers can start job-hunting before the closure becomes public, even though the board explicitly agreed to withhold warning to prevent a stock-price reaction.'
critical-questions:
  - 'Does the individual deity''s warning actually save the carpenters as a whole, or does it only save the minority who choose to act on it — and if the collective''s original judgment against the carpenters was itself justified, is the defector undermining a legitimate verdict or correcting a disproportionate one?'
status: active
