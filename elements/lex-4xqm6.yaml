canonical-instances:
  - "A company considers acquiring a lucrative but heavily regulated market segment where a specific advocacy group is structurally opposed to the entire business model on principle, versus a less lucrative segment with only situational friction from a competitor over a specific pricing dispute -- the structural opposition won't be resolved no matter how much goodwill or lobbying budget the lucrative segment's own profits could fund, while the competitor dispute has a real settlement available."
  - "A person takes a high-paying job at a company where a particular executive is permanently hostile to anyone in the new hire's specific role due to an old organizational turf conflict that predates the hire entirely, versus a lower-paying offer with a manager who is merely cautious due to a specific, resolvable past miscommunication -- the turf conflict will outlast any individual performance or goodwill, while the caution can genuinely be addressed."
critical-questions:
  - "how would a decision-maker actually verify, in advance, that a given hostility is truly structural and unappeasable rather than merely appearing that way due to insufficient information -- is there a risk of writing off a genuinely resolvable conflict as permanent simply because early attempts at favor or restraint haven't yet worked?"
  - "does this framework assume the structural enemy's hostility is fixed forever, when circumstances that created a seemingly permanent structural conflict (a territorial claim, an identity-based grievance) can themselves shift over long enough time horizons -- at what point does 'permanent' become an overstatement that forecloses options too early?"
  - "is the poor-land-without-enemies choice actually available in practice, or does declining the rich, contested opportunity simply hand its resources to a rival who will use them against you regardless -- does avoiding a structural conflict only work if a genuinely conflict-free alternative exists, and what happens when every attractive option comes bundled with some form of permanent hostility?"
