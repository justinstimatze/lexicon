id: lex-4dm39
name: distance-from-a-role-shapes-which-facet-you-see
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When two groups form very different images of the same multi-faceted occupation or role, do not assume one group is simply better-informed or more accurate than the other — check whether each group's own current activity happens to overlap with a different facet of the role, which would make each image locally correct and systematically incomplete rather than one right and one wrong. Rogoff proposes exactly this to explain why students who decided on medicine very young form a different picture of the profession than those who decided later: 'We start with the assumption that students' images of the profession are affected by the interests of, and information held by, those persons who influence their decision. Young adolescents and their families may be likely to look on medicine from the \"outside,\" and see it primarily as an occupation in which one helps sick people, with emphasis on the face-to-face dealings between doctor and patient. College students, and, a fortiori, medical students, may be more aware of the intellectual challenge of medicine, for they are in a position to relate the content of the doctor's role to the scientific studies they are pursuing.' The mechanism is not merely proximity or amount of exposure — it is that the college and medical students are themselves engaged in the same kind of scientific coursework that produces the doctor's technical expertise, so that facet of the role becomes salient to them precisely because it maps onto something they are already doing, while adolescents and their families, whose own activities don't overlap with laboratory science, notice the facet that is visible without that overlap: the interpersonal, helping side. Rogoff finds this image is sticky rather than merely a passing first impression: 'In support of this idea it is encouraging to observe that youthful deciders, as late as a few weeks before arriving at medical school, show a propensity for the interpersonal rather than the intellectual side of medicine.' Years spent afterward in the same college environment as later deciders were not enough to fully overwrite the facet that was salient when the image first formed. Diagnostic move: when two people or groups disagree about what a shared role, job, or field is 'really' about, ask what each observer's own current activity is, and check whether it happens to overlap with a different part of the role's actual content — the disagreement may not be a factual dispute to adjudicate but a difference in which real facet each vantage point makes visible. This is distinct from outsider/insider standpoint concepts built around KNOWLEDGE ACCESS or epistemic privilege (an outsider-within who has entry without membership, or a marginalized standpoint that sees power structures a dominant position cannot) — this atom is about which facet of a role becomes SALIENT depending on whether the observer's own ongoing activity happens to resemble the content-producing side of that role, independent of any access or power differential."
