canonical-instances:
  - "Hypothetical: A company's stated hiring principles -- hire the most qualified candidate, never discriminate by protected class, and always promote the most tenured internal applicant when qualifications are close -- jointly produce a recommendation to promote someone the team knows is a poor fit, in a case where tenure and qualification pull apart sharply. Treating the recommendation as binding because each principle sounded reasonable is the wrong response; the case is evidence that the tenure rule needs an exception clause, not proof the poor-fit promotion is secretly correct."
  - "Hypothetical: A legal reasoning chain -- built from precedents that each seemed sound on their own -- concludes that a company owes no duty of care in a case everyone agrees was genuinely negligent. A court treating that outcome as merely regrettable-but-required is accepting the monster; a court that goes back to find which precedent doesn't actually fit this fact pattern is doing what the reasoning demands."
critical-questions:
  - "Doesn't this let anyone reject any uncomfortable conclusion just by calling it 'monstrous' -- what stops this from being a license to dodge valid arguments whenever they're inconvenient? The diagnostic asks for something more specific than dislike: when a conclusion is monstrous enough, go find and name the actual weak premise, rather than either swallowing the conclusion whole or waving the argument away unexamined. Sen and Arrow's own field did the work: they identified exactly which axioms could be dropped or weakened, and what new problems appeared when they tried (see the oligarchy result from weakening transitivity)."
  - "How do you decide which premise is the weak one, when several axioms each look equally plausible in isolation? There's no formula -- Sen describes decades of the field actually doing this work, discovering that weakening any one condition just relocates the problem elsewhere (a different impossibility, or an oligarchy). The value of the diagnostic isn't that it hands you the answer; it's that it stops 'the logic checks out' from ending the inquiry before that harder work starts."
