id: lex-sdh3h
name: a-witnessed-principled-decision-licenses-immediate-imitation-by-a-peer
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Once one person''s request to take an unconventional, costly path is granted, a peer who witnessed the process can immediately request the identical permission, using the precedent as license without needing to independently earn or argue for it — the first mover''s success creates a permission structure the second simply exploits. In the Jataka''s tale of the Great Renunciation prefigured, the king has scarcely granted his eldest son leave to renounce the world when the youngest brother steps forward asking the same, and receives it on the spot: "When this consent was gained, the Bodhisatta''s youngest brother, Prince Yudhitthila, greeted his father, and likewise asked leave to follow the religious life, and the king consented."'
related: []
evokes: [jataka, ekadasanipata, yuvanjaya-jataka, modeling, precedent-as-license]
lineage:
  - source: primary
    text: jataka-chalmers1895-yuvanjaya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 460, Yuvanjaya-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "When this consent was gained, the Bodhisatta's youngest brother, Prince Yudhitthila, greeted his father, and likewise asked leave to follow the religious life, and the king consented."
canonical-instances:
  - "The moment one engineer's request for a four-day work week is approved after months of negotiation, a teammate who watched the whole process asks for the identical arrangement in a single sentence and gets it immediately."
critical-questions:
  - "Does the second request actually rest on the same reasoning as the first, or does it just ride the precedent — and if the father's consent was really about the eldest son's specific circumstances, does granting it again to the second son on precedent alone actually track anything real?"
status: active
