id: lex-7za5n
name: an-interruption-mid-hazard-forces-a-full-stop-before-responding
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Barney and Loveless give a specific, prescriptive rule for the moment an interruption lands while a knifemaker's hands are working a bevel on a belt grinder: 'shut down the machine, right there and then... stop the machine!' The danger sits specifically in the half-attention state of trying to finish the cut while turning part of your mind toward the interruption. The grinding belt runs at speed regardless of whether you are fully watching it, and a hand drifting toward the belt is exactly what a split-attention moment produces.

Transferable rule: when a task carries a live hazard -- a moving blade, a live circuit, a vehicle in motion, a surgical incision -- and an external interruption arrives mid-task, the correct response is a complete stop of the hazardous process before attending to the interruption. Holding both the task and the interruption in attention at once is the failure mode the rule exists to prevent. Aviation's sterile-cockpit rule (no non-essential conversation below 10,000 feet) encodes the same structure from the other direction: it removes the interruption instead of the hazard, but aims at the same underlying failure mode: a moment where attention is genuinely divided between something dangerous and something merely competing for notice. The rule has to be pre-committed rather than judged case by case, because the interruption usually feels trivial relative to the work already underway, and the in-the-moment judgment about whether this particular interruption is safe to half-attend to is the exact judgment that gets compromised once the hazard is live."
related: [lex-ga4dw]
evokes: [how-to-make-knives, loveless-barney-knifemaking, sterile-cockpit-rule, split-attention-hazard, shut-down-the-machine-right-there, safety-starts-with-your-state-of-mind]
lineage:
  - source: practitioner
    text: barney-loveless-1995-how-to-make-knives-safety-state-of-mind
    citation: "Richard W. Barney and Robert W. Loveless, How To Make Knives (Krause Publications, 1995), Section I, Chapter 2, 'Safety Starts With Your State Of Mind,' p. 13."
    quote: "'In fact, be careful about being distracted by anything or anyone. Being surprised when making a roughing cut on the grinder by someone coming into the shop can distract you just as you are moving your hand toward the sharp edge of the 60 grit belt and you'll end up with a very painful cut. The grinding belt both cuts and burns as it tears the skin, and these cuts sometimes take forever to heal. If your wife comes into the shop to ask about supper, shut down the machine, right there and then. Even though you are trying to get that bevel finished before supper, stop the machine!'"
  - source: practitioner
    text: barney-loveless-1995-how-to-make-knives-safety-state-of-mind
    citation: "Richard W. Barney and Robert W. Loveless, How To Make Knives (Krause Publications, 1995), Section I, Chapter 2, 'Safety Starts With Your State Of Mind,' p. 14."
    quote: "'Trying to finish off your newest skinner to show your hunting partner later in the evening when he comes over? Stop right there! NOTHING CAN HURT YOU AS MUCH AS TRYING TO GO TOO FAST. Learn that rule, and live by it. Take your time. Work carefully, knowing in advance what the next step is. Have your tools ready, fresh blade in the hacksaw, etc., and work at a slow and steady planned pace. Safety always starts with your state of mind.'"
canonical-instances:
  - "A worker on a construction site keeps a bolt half-torqued while answering a supervisor's question, planning to finish the turn once the conversation ends, and loses attention on the wrench's position for the two seconds that matter."
  - "A driver reaches for a dropped phone while merging, treating the merge as already handled, when the merge is the one phase of the maneuver that cannot tolerate divided attention."
  - "A lab technician mid-titration answers a colleague's question without capping the reagent or stepping back from the bench, keeping one hand near an open container while talking."
  - "Aviation's sterile-cockpit rule (US FAA regulation, no non-essential crew conversation or activity below 10,000 feet) is the institutionalized, removes-the-interruption-not-the-hazard version of the same underlying discipline: eliminate the state of divided attention rather than trust individual judgment to manage it in the moment."
  - "Operationally distinct from lex-ga4dw rushed-individual-execution-trades-quality-at-nonlinear-rate: that atom's variable is PACE -- how fast the task itself is being executed, with quality degrading nonlinearly as speed increases. This atom's variable is ATTENTION SPLIT -- whether a hazardous task is sharing attention with an unrelated demand at all, independent of how fast or slow the task is being performed. A worker moving slowly through a hazardous step while simultaneously fielding an interruption is at the same risk this atom names as a fast one; slowing down does not fix a split-attention moment the way it fixes a rushed one."
critical-questions:
  - "Is the interruption itself sometimes the more urgent hazard -- a fire alarm, an injury elsewhere -- such that the rule's framing (finish stopping the machine first, then attend to the interruption) gets the priority backwards for that specific case?"
  - "Does habitual full-stopping for every trivial interruption train a worker to treat all interruptions as equally serious, which could degrade the signal value of a true emergency and produce its own form of complacency over time?"
  - "How does the rule hold up when the interruption itself demands immediate physical action rather than attention -- an alarm requiring an instant response where there is no safe 'stop the machine first' step available before reacting?"
status: active
