id: lex-jsere
name: small-coalitions-make-private-loyalty-cheaper-than-public-goods
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when assessing why a leader — head of state, CEO, party boss, agency head, HOA president — governs the way they do, and the instinct is to explain it by their personal character (greedy vs. benevolent) or by a regime label (democracy vs. dictatorship). Bueno de Mesquita and Smith's selectorate theory: any leader's actual base of power is the WINNING COALITION — the specific, often small, group of essential supporters without whom the leader falls (distinct from the much larger nominal selectorate, everyone with some formal say, like all voters or all shareholders, most of whom are individually powerless 'interchangeables'). The size of the winning coalition relative to the selectorate — not the leader's virtue, not the regime's label — determines HOW a leader spends resources to stay in power. When the winning coalition is SMALL (a junta, a royal court, a rigged one-party state, a closely-held corporation), it is cheap per-supporter to buy loyalty with concentrated PRIVATE goods — patronage, graft, exclusive privilege — so leaders tax heavily and redistribute to a narrow circle. When the winning coalition is LARGE relative to the selectorate (a mass democracy with genuine competition), private rewards spread too thin to buy loyalty efficiently, so leaders are forced toward PUBLIC goods — low taxes, rule of law, infrastructure, welfare — that benefit the coalition (and, incidentally, everyone else) at once. The mechanism is not about who is a better person; a democrat who could get away with rule 1 (shrink the coalition) would do it too — she is simply more constrained. Practitioner diagnostic: before predicting or explaining a leader's or institution's policy, don't ask 'are they authoritarian or democratic, corrupt or clean' — count (or estimate) the winning coalition: how many people, specifically, would have to defect before this leader falls? A small number predicts patronage, opacity, and high extraction from outsiders; a large number predicts public-goods provision and lower extraction, regardless of what the organization calls itself. Watch for leaders actively trying to shrink their own effective coalition (gerrymandering, vote-count manipulation, narrowing a board, purging a party) — that move itself is diagnostic of an attempt to make private-goods governance more affordable."
related: [lex-m54nv, lex-6wha5, lex-enpjy, lex-gt9kt, lex-w4tm3]
scaffolds-from: [lex-6wha5]
evokes: [selectorate-theory, winning-coalition, nominal-selectorate, interchangeables-influentials-essentials, five-rules-of-politics, buy-loyalty-with-private-goods, small-coalition-autocracy]
lineage:
  - source: primary
    text: bueno-de-mesquita-smith-2011-the-dictators-handbook
    citation: "Bruce Bueno de Mesquita and Alastair Smith, The Dictator's Handbook: Why Bad Behavior Is Almost Always Good Politics (PublicAffairs, 2011; 2nd trade paperback ed. 2022). Chapter 1, 'The Rules of Politics.'"
    quote: "For leaders, the political landscape can be broken down into three groups of people: the nominal selectorate, the real selectorate, and the winning coalition. ... The most important of these groups is the third, the subset of the real selectorate that makes up the winning coalition. These are the people whose support is essential if a leader is to survive in office. ... A simple way to think of these groups is as interchangeables, influentials, and essentials. ... In a democracy, or any other system where a leader's critical coalition is really large, it becomes too costly to buy loyalty exclusively through private rewards. The money has to be spread too thinly. So more democratic types of governments, dependent as they are on large coalitions, tend to emphasize spending to create effective public policies that improve general welfare... By contrast, dictators, monarchs, military junta leaders, and most CEOs all rely on a smaller set of essentials. ... it is more efficient for them to govern by spending a chunk of revenue to buy the loyalty of their coalition through private benefits, even though these benefits come at the expense of the larger taxpaying public... The choice between enhancing social welfare and enriching a privileged few is not a question of how benevolent a leader is. Honorable motives might seem important, but they are overwhelmed by the need to keep essential supporters happy, and the means of keeping them happy depends on how many need rewarding. ... RULE 1: Keep your winning coalition as small as possible. A small coalition allows a leader to rely on very few people to stay in power. Fewer essentials equals more control and contributes to more discretion over expenditures. (Bueno de Mesquita and Smith, The Dictator's Handbook, 2011/2022)"
canonical-instances:
  - "operationally distinct from lex-m54nv concentrated-benefits-diffuse-costs: lex-m54nv is a public-choice claim about WHO organizes to capture a policy given any group-size asymmetry; this atom is specifically about how the RATIO of winning-coalition-size to selectorate-size determines a ruler's OPTIMAL SPENDING STRATEGY (private vs. public goods) — a distinct, more specific causal claim."
  - "Louis XIV's France: after inheriting a near-bankrupt treasury and a disloyal old aristocracy, Louis replaced his winning coalition with a new class (the noblesse de robe and select commoners in the military) who owed their wealth and status entirely to him; by enlarging the POOL of possible replacements (the nominal/real selectorate) while keeping the actual winning coalition small and dependent, he secured 72 years in power through private patronage, not popular consent."
  - "USSR vs. USA winning-coalition size: in the Soviet Union, the nominal selectorate was every adult citizen (mandatory voting), but the actual winning coalition — the small group inside the Communist Party whose support kept a general secretary in office — numbered in the dozens or low hundreds; commissars and general secretaries ruled by directing resources to this tiny essential circle. By contrast, the winning coalition for a US presidency, while nowhere near a majority of voters due to the Electoral College, is vastly larger, forcing US presidents toward broader public-policy spending to keep a much bigger essential group satisfied."
  - "Cross-national coalition-size variation among nominally similar regimes: the book's tracked 'normalized coalition size' measure shows Costa Rica sustaining one of the largest proportional winning coalitions in the world across five decades while other states calling themselves democracies (with universal suffrage and regular elections) maintain far smaller effective coalitions — demonstrating that 'democracy' as a label doesn't fix coalition size; the actual essential-supporter count varies continuously and independently of the regime label."
critical-questions:
  - "Isn't this just saying 'power corrupts,' relabeled? No — the claim is specifically about coalition SIZE, not about power or character. A leader dependent on a large coalition who WANTED to loot the treasury for private cronies mostly can't, because private rewards spread too thin across that many essentials to buy loyalty efficiently; a leader with a small coalition who wanted to govern purely for the public good would still be outbid by a rival willing to concentrate rewards on the same small essential group. The theory predicts behavior from coalition arithmetic, not from an assumption about anyone's virtue or vice."
  - "Doesn't this reduce to 'small dictatorships are corrupt, big democracies are clean' — something everyone already knows? The distinctive, less obvious claim is that the SAME logic operates continuously inside both categories and can invert the intuitive label: a nominally democratic city council or corporate board with a very small effective winning coalition (a handful of votes needed to win a seat, a handful of shareholders who control the board) will show small-coalition, private-goods dynamics despite being formally a 'democracy'; a large single-party state that must keep a genuinely broad internal coalition satisfied can show more public-goods behavior than its label suggests. The predictive lever is the coalition count, not the regime's name for itself."
  - "How is this different from simply saying organized minorities rule (lex-6wha5, Mosca)? Mosca explains WHY a minority ends up ruling at all (organization beats an unorganized majority's numbers) — a claim about the EXISTENCE of a ruling group. This atom takes that ruling group's existence as given and asks a further, more specific question: given a ruling coalition of some particular SIZE, what spending strategy — private patronage or public goods — does that size make the economically rational choice for staying in power? Mosca's claim doesn't vary by how big or small the organized minority is; this atom's claim is entirely ABOUT that variation."
