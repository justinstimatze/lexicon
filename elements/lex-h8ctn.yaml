id: lex-h8ctn
name: mirroring-an-impossible-demand-back-forces-the-demander-to-concede-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When someone in power issues a demand that sounds specific but is actually impossible, don''t argue that it can''t be done — construct a matching, equally absurd counter-request that only makes sense if the original demand were real, and send it back framed as a reasonable clarification. The demander''s own denial of the counter-request becomes their admission that the original demand was never possible. In the Maha-Ummagga-Jataka, a king orders a village to weave a rope of sand or pay a fine. Mahosadha has messengers tell the king: "the villagers do not know whether the sand-rope is to be thick or thin; send them a bit of the old rope, a span long or four fingers; this they will look at and twist a rope of the same size." If the king replied, "Sand-rope there never was in my house," they were to reply, "If your majesty cannot make a sand-rope, how can the villagers do so?"'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, mirrored-demand, forced-concession, impossible-request]
lineage:
