id: lex-wnf8z
name: three-ways-practitioners-cope-when-an-expanded-role-hits-an-intractable-case
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a role is deliberately expanded beyond its narrow technical core — a doctor asked to treat the whole family, not just the disease; a manager asked to develop the whole person, not just the output — expect practitioners to diverge into a small number of recognizable coping styles once they hit a case where the expanded scope produces frustration rather than payoff. Goss documents three from medical students required to treat patients within their full family and social context. First, retreat to the narrower traditional scope: 'It is not the responsibility of the physician to solve the social problems of his patients. Their solution is primarily the responsibility of his patients, and secondarily within the province of the social agencies.' Second, delegate while staying engaged, splitting the labor rather than abandoning it: 'I think they [the social worker and the physician] should work as a team, and therefore the doctor should not wash his hands of the [social] problem but should refer the patient to the social worker and follow the patient.' Third, escalate personal effort within the full expanded scope rather than narrowing or delegating it — a student presenting a difficult family at a case conference: 'The real problem is a family problem that exists in the tortured interrelationships among these people.... Now what concrete measures can we put forth? ... We're going to have to work through Mr. [ ], the husband. Also, we want to pull the children away from the home... to place them in camps, recreational organizations.' Goss's own framing: this third student was 'far from rejecting patients' social problems as out of his sphere of interest or competence' and 'was determined to try to solve them, even though he recognized that \"a lot of what should be done gets into the province of the social worker.\"' The case also surfaces the risk of the third style: a faculty member, hearing this same student's account, responded not with praise but with a diagnosis of case mismatch: 'It has been said by some people that we have been giving you [students] too complicated cases. I think this case is too complicated for anybody' — naming escalation-without-limit as itself a signal that the case, not the student's effort, was the actual problem. Diagnostic move: when observing several people in an expanded, ambiguous-scope role respond very differently to the same category of hard case, check whether they're sorting into these three styles — narrow back to the traditional core, split the labor via referral while staying involved, or escalate personal effort to match the full expanded scope — since which style someone defaults to says less about their competence than about how they've individually resolved the tension the expanded role was designed to create in the first place, and unlimited escalation specifically may indicate the case itself needs to be reclassified as unreasonable, not that the practitioner needs to try harder."
