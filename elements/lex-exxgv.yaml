canonical-instances:
  - "A company's helpdesk metrics show a sharp drop in tickets filed against the platform team after they start sitting in the open engineering area — leadership reads this as the platform team having fewer problems to fix, when the real story is that engineers now just lean over and ask, and those quick fixes never become tickets at all."
  - "A hospital's referral-tracking system shows very few 'consultations' with the on-call pharmacist compared to other specialists, because nurses just text her directly with quick questions instead of filing a formal consult request — the low official count reflects that she is unusually accessible, not that she's rarely needed."
critical-questions:
  - "Does this mechanism have a natural ceiling — could a service become SO frictionless that its true usage volume actually grows unboundedly while its logged count stays near zero, making the undercount not just biased but essentially unmeasurable by any adjustment factor applied to the log?"
  - "Olencki treats the undercounting as a 'compliment' to good design, but does the same undercounting also erase the evidence an organization would need to justify keeping or expanding that easily-available resource — could invisible success in the metrics eventually lead an organization to defund the very service that was working best, simply because nothing on paper shows it being used?"
