    citation: "Aesop's Fables, translated by V. S. Vernon Jones (1912, Project Gutenberg #11339), 'The Frogs' Complaint Against the Sun.' Verified verbatim against a direct extraction of the held copy."
    quote: "The Sun is bad enough even while he is single, drying up our marshes with his heat as he does. But what will become of us if he marries and begets other Suns?"
canonical-instances:
  - "an antitrust objection to a dominant platform's acquisition, aimed less at the current harm the platform causes than at the multiplication of that harm across many more subsidiaries once the deal expands its reach."
critical-questions:
  - "How would an observer distinguish a genuine multiplication risk from unfounded catastrophizing about a threat that has no real mechanism to reproduce — what would count as evidence the sun actually could 'marry and beget other Suns'?"
  - "Does front-loading concern about future multiplication risk drawing attention and resources away from the present, tolerable harm that is actually happening right now?"
