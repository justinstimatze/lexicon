critical-questions:
  - "does the candidate member ACTUALLY instantiate the named-systematic-distortion shape, or is it a different kind of substrate-mechanism? Diagnostic: does the candidate atom name a SPECIFIC, REPEATABLE, EMPIRICALLY-DOCUMENTED distortion that occurs even when reasoners are informed about it, or is it a broader epistemic-pattern (perception, attention, memory) without the specific distortion-vs-normative-baseline character? lex-jv983 fluency-trap (substrate-primitive but mechanism rather than named-bias-effect) is a borderline case worth flagging"
  - "is this label-molecule covering a structural-kind, or just a topical adjacency? The cognitive-bias kind is structural — every member is a named distortion-mechanism documented in the heuristics-and-biases literature against a normative baseline (rational-actor, Bayesian-updater, normative-statistics, attribution-symmetry). A label like 'psychology-atoms' would be topical and fail this test. Diagnostic: can a substrate-naive reader, given the membership-list, identify the shape (named systematic deviation from a normative baseline) without prompting?"
  - "is the membership list complete-relative-to-current-substrate, or did it stop at convenience? ships with nine members; additional substrate-primitive cognitive-bias candidates may exist (lex-jv983 fluency-trap is borderline; future mining of Tversky-Kahneman 1974 + Kahneman 2011 would surface availability heuristic, framing-effect, loss-aversion, endowment-effect, planning-fallacy, illusion-of-control, dunning-kruger, sunk-cost-fallacy as named candidates). Diagnostic: re-run the bar against every substrate atom; flag candidates the membership-list missed"
  - "does the label-molecule overgenerate — would atoms from adjacent-mechanism kinds (perceptual-illusions, conformity-effects, emotional-distortions) also satisfy the shape and want to join? lex-2zyhy conformity (Asch line-judgment) is the clearest borderline — it IS a documented social-psychological distortion-mechanism, but it sits at the perception-of-group-consensus layer rather than the individual-judgment-vs-normative-baseline layer. If the label is broader than 'cognitive bias' as Kahneman-Tversky use the term, either include lex-2zyhy or rename the label"
  - "does the label inflate substrate coherence beyond its actual cross-source attestation? ships with two methodologically-distinct primaries: Bacon 1620 Novum Organum Book I aphorisms XXXIX-LII (foundational catalogue of systematic-bias-sources at four levels, with Idola Tribus XLV-LII enumerating specific sub-mechanisms that map directly to modern named-cognitive-biases — confirmation in XLVI, availability in XLVII, motivated-reasoning in XLIX) + substrate-attestation (nine members organically cohered in the substrate as a recognizable named-effect class). For further strengthening: Kahneman-Tversky 1974 Science 185 'Judgment under Uncertainty: Heuristics and Biases' (acquisition queued; foundational modern naming of the kind) and Kahneman 2011 *Thinking, Fast and Slow* (in-copyright)"
lineage:
  - source: primary
    text: bacon-1620-novum-organum-book-i-idola-tribus
    citation: "Francis Bacon, *Novum Organum* (1620), Book I aphorisms XXXIX-LII (PG #45988, Devey 1902 translation; acquired ). PD; in the lexicon corpus. Bacon NAMES the kind that lex-jafkg catalogues in transferable form: the four Idola (Tribus, Specus, Fori, Theatri) are the foundational catalogue of systematic-bias-sources. Idola Tribus specifically — the biases inherent in 'the very tribe or race of man' — are the species-level cognitive-distortions that the modern heuristics-and-biases literature inherited and instrumentalized. Bacon's aphorisms XLV-LII enumerate the specific sub-mechanisms of Idola Tribus, anticipating modern named-cognitive-biases by ~360 years: XLV (imposition-of-order on irregular reality, ancestor of pattern-finding-bias); XLVI (confirmation: 'although most cogent and abundant instances may exist to the contrary, yet either does not observe or despises them' — direct ancestor of lex-t9fs7 confirmation-bias) + XLVI second half (affirmative-bias: 'more moved and excited by affirmatives than negatives'); XLVII (availability/vividness: 'most excited by that which strikes and enters the mind at once and suddenly' — ancestor of lex-2czcp vivid-concrete-instance); XLIX (motivated-reasoning: 'man always believes more readily that which he prefers'). Bacon names the KIND ('Idols beset the human mind') and SUB-KINDS (the specific mechanisms in XLV-LII) before any empirical psychology existed to test them — this is foundational naming-of-the-kind that licenses lex-jafkg's label-molecule. The methodological grounding: Bacon's framework treats these biases as systematic, predictable, and pre-empirical — the same theoretical posture Kahneman & Tversky 1974 adopted three centuries later. Distinct from lex-xqamc argument-from-bias (which uses Bacon's Idols as cognate source) because lex-xqamc is the dialectical-move scheme for DEPLOYING bias-attribution as an argument, while lex-jafkg is the substrate-organizing label for the COGNITIVE-MECHANISM family that grounds what 'biased' means in the first place. The two atoms cite the same Bacon source for different reasons."
    quote: "(Aphorisms XXXIX-XLIV, opening the four Idols framework + XLVI on confirmation + XLVII on vividness/availability + XLIX on motivated-reasoning, Devey 1902:) XXXIX. Four species of idols beset the human mind, to which (for distinction's sake) we have assigned names, calling the first Idols of the Tribe, the second Idols of the Den, the third Idols of the Market, the fourth Idols of the Theatre. (...) XLI. The idols of the tribe are inherent in human nature and the very tribe or race of man; for man's sense is falsely asserted to be the standard of things; on the contrary, all the perceptions both of the senses and the mind bear reference to man and not to the universe, and the human mind resembles those uneven mirrors which impart their own properties to different objects, from which rays are emitted and distort and disfigure them. (...) XLVI. The human understanding, when any proposition has been once laid down (either from general admission and belief, or from the pleasure it affords), forces everything else to add fresh support and confirmation; and although most cogent and abundant instances may exist to the contrary, yet either does not observe or despises them, or gets rid of and rejects them by some distinction, with violent and injurious prejudice, rather than sacrifice the authority of its first conclusions. (...) it is the peculiar and perpetual error of the human understanding to be more moved and excited by affirmatives than negatives. (...) XLVII. The human understanding is most excited by that which strikes and enters the mind at once and suddenly, and by which the imagination is immediately filled and inflated. (...) XLIX. The human understanding resembles not a dry light, but admits a tincture of the will and passions, which generate their own system accordingly; for man always believes more readily that which he prefers."
  - source: practitioner
    text: substrate-attestation-v108-cognitive-bias-cluster
    citation: "substrate-attestation: nine substrate-primitive atoms minted at independent times in the substrate development organically cohered as a recognizable named-cognitive-bias family without being designed-together: lex-t9fs7 confirmation-bias (Wason 2-4-6, myside-bias), lex-hrnuj anchoring-bias (Tversky-Kahneman anchor-and-adjust), lex-kxbm2 convexity-bias (Jensen-inequality second-order effects — borderline because it sits between cognitive-distortion and statistical-phenomenon; included because the practitioner-framing is the linear-thinking bias against tracking second-order effects), lex-tfpzb survivorship-bias (Wald's bomber-armor, Taleb's silent evidence), lex-2czcp vivid-concrete-instance-dominates-statistical-evidence (availability/representativeness heuristic), lex-dgwbn (fundamental attribution error, Ross-Nisbett), lex-vkhp7 (hindsight bias, Fischhoff), lex-rwvkh (base-rate neglect with causal-vs-statistical-framing distinction), lex-yv8ag need-for-cognitive-closure (Kruglanski seize-and-freeze). All nine share the structural identity: NAMED, SYSTEMATIC, EMPIRICALLY-DOCUMENTED distortion of judgment or inference relative to a normative baseline, surviving even when the reasoner is informed about it. The structural-identity emerged in mining, not by design — this is substrate self-attestation parallel to -g's Walton-cluster attestation that grounded lex-rnwph. Per ROADMAP #15 the bar for active status requires (a) a refs-grounded primary that names the kind (Bacon 1620 does so), AND (b) substrate-attestation that the kind is real-and-distinct. Both criteria met."
