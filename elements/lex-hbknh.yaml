id: lex-hbknh
name: selecting-on-a-noisy-proxy-also-selects-for-the-noise
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When any inexact proxy M is used to select for an underlying goal G (M = G + noise), selection on the high tail of M necessarily also selects for the high tail of the noise term — so the expected G of the selected set is predictably LOWER than the expected M. This is REGRESSIONAL Goodhart in Manheim-Garrabrant's typology and the most fundamental of the four variants: it is unavoidable for any imperfect metric. No causal-structure mistake is required, no extreme-region extrapolation is required, no adversary is required. The bare statistical fact of correlation < 1 between proxy and goal is sufficient. The colloquial name (Lewis 2014, cited by Manheim-Garrabrant) is 'tails come apart' — at the population mean, a high-percentile M roughly co-locates with a high-percentile G; in the extreme tails, the cheap-noise paths to high M dominate. Transferable: any time you select on a proxy, your effective ceiling for the underlying goal is strictly below the ceiling of the proxy, and the gap widens with tail-pressure. Practitioner consequence: do not extrapolate proxy-goal correlation observed at the population mean into the high-percentile region; the extrapolation systematically over-promises. Distinction from lex-n5cf6 (extremal): regressional Goodhart needs no extrapolation outside the observed regime — even with the correct functional form fully understood across all regions, selection on M gives you noise-weighted M, not G. Distinction from lex-tb3re (parent): lex-tb3re is the umbrella claim that metrics-pushed-as-targets lose validity; lex-hbknh names the specific mechanism by which that happens even under the most generous conditions (no agent gaming, no causal intervention, no regime change). The fix is not better data or better models — the fix is recognizing that the proxy-goal gap is irreducible and budgeting for it explicitly: use multiple independent proxies, leave headroom in expected G when reporting expected M, or accept that the achievable G ceiling is structurally lower than the achievable M ceiling."
related: [lex-2hh73, lex-5yufs, lex-asu3y, lex-cpq3s, lex-cwmus, lex-ewafs, lex-m4ztd, lex-n5cf6, lex-nbk6e, lex-nx898, lex-qb3zf, lex-ry4x3, lex-spm8x, lex-tb3re]
