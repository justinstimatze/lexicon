id: lex-663sq
name: group-development-sequence-forming-storming-norming-performing
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when standing up a new team, project group, or committee, or when diagnosing friction in a group that's been together only briefly. Tuckman's model claims small groups predictably pass through FOUR sequential developmental stages before they can function effectively, not straight to functioning: FORMING (members orient to the task through testing what's acceptable, and depend on the leader or preexisting norms/structure for guidance — low real conflict, low real output, because the group hasn't yet earned the standing to disagree); STORMING (interpersonal conflict and polarization emerges as members resist the leader's authority and each other's influence, while emotional resistance to the task's demands slows task work — this is the group finding out where the real boundaries and disagreements are); NORMING (the resistance is overcome; the group develops cohesion, generates its OWN new norms and roles rather than borrowed ones, and members begin exchanging genuinely personal opinions on the task); and PERFORMING (interpersonal structure has stabilized into a flexible tool FOR the task — roles adapt to what the task currently needs instead of needing to be renegotiated, and group energy channels fully into output). The practitioner move: treat STORMING as a NORMAL, REQUIRED, load-bearing stage rather than evidence of a bad team or a bad hire — a facilitator who suppresses it (forcing premature agreement, silencing dissent, rotating out anyone who pushes back) gets a group that looks calm but never generates the norms and roles that only emerge from working through real conflict, and it stalls before reaching performing. Two tracks run through all four stages AT THE SAME TIME and must be diagnosed separately: GROUP STRUCTURE (the interpersonal pattern — dependence, conflict, cohesion, role-relatedness) and TASK ACTIVITY (orientation, emotional response to the task, opinion exchange, emergence of solutions) — a group can be ahead on one track and stuck on the other, so 'what stage are we in' needs a check on both, not a single vibe-read. Caveat the model makes explicitly: it does not predict a fixed timeline or a fixed order — rate and even sequence vary with group composition, task type (impersonal/laboratory tasks compress the stages faster than personal/therapeutic ones), and duration of group life; the value is diagnosing WHICH stage a specific group is currently in, not forecasting how long getting through it will take."
