    quote: "this man shut him up in a grease-box and kicked it off a high cliff, but Raven had induced him to fasten it with a piece of straw instead of rope, and immediately flew our. ... put Raven into a grease-box, and kicked him off from a high cliff as had happened before. Raven also escaped in the same manner."
canonical-instances:
  - "An employee being escorted out after being let go offers to help pack their own boxes and quietly leaves an unlocked side door propped instead of the main exit the security guard is watching, having appeared entirely cooperative the whole time."
  - "A contractor sealing a client's data into a locked export format suggests using a specific, weaker encryption setting 'to save processing time,' which the client accepts without scrutiny, leaving the contractor with a way back into data that looks fully secured."
critical-questions:
  - "Does the mechanism depend on the captor never learning what actually happened the first time, and does the fact that it works twice suggest the captor never investigates his own failures, rather than that the sabotage is undetectable?"
  - "Is there a point at which repeating the exact same escape against the same person becomes reckless rather than clever, given that a captor who eventually notices the pattern could close off the vulnerability permanently?"
  - "Does Raven's ability to induce the captor to choose the weaker fastener depend on some specific leverage or persuasion the story doesn't detail, or does the story simply assume captors can be talked into weakening their own security?"
