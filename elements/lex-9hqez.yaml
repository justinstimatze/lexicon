id: lex-9hqez
name: an-enumerated-refrain-of-virtues-each-yoked-to-the-same-claimed-outcome-by-repetition
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'To argue for an implausible causal claim, a speaker can recite a long catalogue of distinct virtuous behaviors, each stanza closing on the identical refrain asserting the same protective outcome, so the sheer repetition makes the claim feel cumulative and overdetermined rather than resting on any single fragile link. In the Jataka''s tale of Maha-Dhammapala, the family''s freedom from early death is attributed across stanza after stanza to uprightness, honesty, and generosity, each closing on the same line: "We walk in uprightness, we speak no lies, All foul and wicked sins we keep afar, We do eschew all things that evil are, Therefore in youth not one among us dies."'
related: []
evokes: [jataka, dasanipata, maha-dhamma-pala-jataka, enumerated-virtues-refrain, just-world-reasoning]
lineage:
  - source: primary
    text: jataka-chalmers1895-maha-dhamma-pala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 447, Maha-Dhamma-Pala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "We walk in uprightness, we speak no lies, All foul and wicked sins we keep afar, We do eschew all things that evil are, Therefore in youth not one among us dies."
canonical-instances:
  - "A wellness influencer lists a dozen distinct daily habits — cold showers, gratitude journaling, intermittent fasting, early rising — each one individually credited with the same claimed outcome of disease-free longevity, so the accumulated list feels more convincing than any single habit's evidence would justify."
critical-questions:
  - "Does stacking many distinct virtues behind an identical claimed outcome actually strengthen the causal case, or does it just repeat an unproven link enough times to make it feel proven?"
