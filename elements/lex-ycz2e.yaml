id: lex-ycz2e
name: surrendering-your-one-defense-is-framed-as-a-favor-to-you
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When you're asked to hand over your one distinctive capability or defense, watch for the request to arrive dressed as relief -- something being done for your comfort, not extraction being done for someone else's purpose. In Cushing's telling, the Burrowing-owl fattens a Tip-beetle on bean soup until it's miserably swollen, then proposes taking the beetle's foul-smelling defensive gas, the beetle's only real asset, as though it were a kindness: 'you are exceedingly uncomfortable, being larger of girth than is safe and well ... I would advise you, therefore, when I lay this pouch on the floor, to run your head into it and exhale as much wind as possible.' He frames the extraction as double relief: 'you are at once to be relieved of the serious consequences of your gluttony, while at the same time paying for your food.' The Beetle, genuinely uncomfortable and genuinely grateful for the meal, takes the bait completely: 'Now, this is an excellent idea, upon my word.' What actually happens is that his one weapon, the gas that makes him untouchable, gets captured and later used as a weapon against the rain-gods -- a use with nothing to do with the Beetle's own comfort. Diagnostic move: when someone proposes relieving you of the very thing that makes you formidable, and frames it as being for your own benefit, separate what the framing offers you from what the request actually asks you to give up -- comfort and extraction can be real at the same time, but only one of them is the reason you're being asked."
