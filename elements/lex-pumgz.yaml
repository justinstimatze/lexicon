lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Public Opinion and Liberal Principles' (read before the Sixth Meeting of the Mont Pelerin Society, Venice, September 1954), Ch. 17 of Conjectures and Refutations (Routledge Classics, 2002), p.473, Section 3, thesis (4)."
    quote: "'We are democrats, not because the majority is always right, but because democratic traditions are the least evil ones of which we know. If the majority (or public opinion) decides in favour of tyranny, a democrat need not therefore suppose that some fatal inconsistency in his views has been revealed. He will realize, rather, that the democratic tradition in his country was not strong enough.'"
canonical-instances:
  - "A company's shareholders approve a plan that turns out disastrous, and a board member argues this shows shareholder votes shouldn't govern major decisions. But the original case for shareholder voting was never that shareholders are usually right -- it was that letting them vote is less prone to abuse than concentrating that power in a single founder or a self-perpetuating board. What the bad vote actually exposes is a company whose voting safeguards needed strengthening long before this decision came up for a vote."
  - "A jury acquits a defendant most observers believe was guilty, and a commentator calls it proof the jury system doesn't work. The justification for trial by jury was never that twelve laypeople reliably reach the correct verdict -- it's that a jury is harder to intimidate, bribe, or capture wholesale than a single judge or a state prosecutor acting alone. A wrong verdict is a data point about that specific jury or that specific case, not a refutation of why juries are used in the first place."
critical-questions:
  - "If the outputs don't have to be right, what stops least evil from becoming an excuse to wave away every bad outcome as somehow not the system's fault? Popper's own move blocks this: a bad outcome gets relocated to the strength of the surrounding tradition rather than dismissed, which a society can build up or let atrophy, and which can be checked against other cases (does this country's democratic tradition survive other stress tests, or is this failure part of a pattern?). The comparative justification stays falsifiable; it just isn't falsified by any single bad vote."
  - "Doesn't least evil of the alternatives we know just concede that something better might exist and we haven't found it? Yes, explicitly -- that's the honest content of the claim, not a weakness to be argued around. The comparative case for democracy is compatible with continuing to look for a better alternative; what it rules out is treating majority-correctness as the standard democracy has to clear to remain justified today."
