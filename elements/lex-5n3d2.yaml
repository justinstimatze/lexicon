canonical-instances:
  - "A company tracks the share of new hires who say 'still exploring, no specific team preference' at 30, 90, and 180 days, and reports the decline as 'growing clarity about career direction.' For a 30-day hire, 'no preference' usually means genuine lack of exposure; for a 180-day hire who still says it, it may mean active avoidance of committing to a team they've already learned they dislike — the same checkbox, opposite underlying states, reported as one smooth trend line."
  - "A dating app asks 'not looking for anything serious right now' at signup and again after six months. For a new user this typically signals genuine openness; for a user who has been through repeated bad matches, the identical answer can be a defensive posture adopted specifically to avoid further disappointment. A stable percentage answering this way over time could mean nothing has changed, or could mean an entirely different population has cycled in with an entirely different reason for the same answer."
critical-questions:
  - "How would a researcher empirically distinguish 'suspended judgment' from 'settled preference for the general option' among two respondents giving the identical answer at the identical career stage — is there any test besides waiting for the next decision point, and if that is the only test, does that make the category unfalsifiable at the moment it is actually collected?"
  - "If a single response category shifts meaning across a population's stage in a process, does the standard survey practice of reporting 'percent choosing X by cohort or year' need a categorically different design (always paired with an independent measure of information or exposure level), or is naming the risk explicitly, as Kendall and Selvin do in a footnote, sufficient caution for readers to apply the correction themselves?"
status: active
