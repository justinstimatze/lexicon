    citation: "Robert K. Merton, Social Theory and Social Structure (1957), Ch. IX, p.301, immediately following the Singer example."
    quote: "'it has often been noted that many Americans will reject out of hand conceptions which have merit in their own right, simply because they originated in Soviet Russia or are currently popular there. It would appear that many Russians do much the same for conceptions tagged as American.'"
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Science: Conjectures and Refutations,' Ch. 1 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), footnote 4."
    quote: "'In fact Newton's theory of gravity, and especially the lunar theory of the tides, was historically speaking an offspring of astrological lore. Newton, it seems, was most reluctant to adopt a theory which came from the same stable as for example the theory that influenza epidemics are due to an astral influence. And Galileo, no doubt for the same reason, actually rejected the lunar theory of the tides; and his misgivings about Kepler may easily be explained by his misgivings about astrology.'"
canonical-instances:
  - "A hospital declines to adopt a hand-hygiene protocol for years after it is first proposed, then adopts a near-identical version once it arrives re-packaged through a source the staff already trusts — the content did not change, only the tag identifying whose idea it was."
  - "A corporate team dismisses a process improvement the moment they learn a disliked rival team originated it, then quietly reinvents the same process a year later and credits it internally — Merton's mechanism predicts this exact pattern of delayed, re-labeled adoption."
  - "Galileo and the lunar tides (Popper 1963, Ch. 1 footnote 4): Newton's gravitational theory, including the correct lunar theory of the tides, grew historically out of astrological lore about celestial influence on earthly events -- the same tradition that produced the claim that influenza epidemics come from astral influence. Galileo rejected the correct lunar-tide explanation for the same reason Newton was reluctant to adopt it: its ancestry smelled of the astrology he'd spent his career opposing. The theory's disreputable source, not any flaw in the theory, is what one of the best scientists of the era rejected it for. A case where the negative-reference-group mechanism cost a correct scientific idea, not just a social or political one."
critical-questions:
  - "How does a negative reference group get its status in the first place — is it always downstream of prior conflict (a rival, an enemy, a repudiated former group), or can a group become a negative reference group for reasons unrelated to any direct history with it (pure out-group category membership)?"
  - "Since Merton frames this as symmetric across sides of a rivalry (Americans and Russians alike), does the mechanism ever get corrected from the inside — do groups develop internal norms or experts whose job is specifically to catch idea-rejection-by-source-tag and re-evaluate the idea on its merits — or does the correction always require an external re-labeling?"
