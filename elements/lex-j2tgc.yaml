id: lex-j2tgc
name: bounded-rationality-replaces-optimizing-with-satisficing
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When facing a real decision (not a textbook one), assume the decision-maker is BOUNDEDLY RATIONAL: cognitive capacity is small relative to problem complexity, so the actual procedure is not OPTIMIZATION (search the full alternative-space, evaluate against a complete utility function, pick the maximum) but SATISFICING (search SEQUENTIALLY until an alternative meets an aspiration threshold on each criterion, then stop). Aspirations adjust over time — they rise when rewards are easy, fall when they are not. The transferable consequence: when modeling or predicting an actor's behavior under cognitive load, don't assume optima; ask what their aspiration thresholds are and what alternatives their search procedure could plausibly reach. Diagnostic: did the decision-maker stop searching when they hit 'good enough,' or did they keep going until the marginal improvement was zero? If the first, satisficing is operating. Pair this with lex-w5qfe iterative-refinement (the loop that revises target against feedback) — satisficing is the per-cycle stopping rule that lets bounded-rational actors USE the loop without collapsing it into infinite optimization."
related: [lex-wtkuz, lex-rgr3t, lex-w5qfe, lex-2jn8d, lex-6pd48, lex-k6p4z, lex-vsede, lex-k2r45, lex-kuqt8]
scaffolds-from: [lex-kuqt8]
evokes: [bounded-rationality, satisficing, aspiration-level, performance-program, sequential-search, simplified-models, the-administrative-man-vs-economic-man, herbert-simon-1957, hierarchical-problem-decomposition]
lineage:
  - source: primary
    text: march-simon-1958-organizations-ch6-cognitive-limits-on-rationality
    citation: "March, James G. and Simon, Herbert A. 1958. *Organizations*. New York: Wiley. Chapter 6, 'Cognitive Limits on Rationality,' Sec. 6.1-6.3, gives the canonical statement of bounded rationality as a SIMPLIFIED MODEL of rational behavior: because of the limits of human cognitive capacity relative to the complexity of the problems individuals and organizations face, rational behavior calls for simplified models that capture a problem's main features without capturing all its complexity. The simplifications have characteristic features: optimizing is replaced by satisficing (the requirement that satisfactory levels of the criterion variables be attained), and alternatives and consequences of action are discovered sequentially through search rather than surveyed exhaustively. [The source PDF's text layer has a reading-order scramble on this specific page (Sec. 6.1) -- confirmed present under both default and -layout pdftotext extraction, so this is the source, not the extraction method. Given as paraphrase rather than verbatim for that reason. An opening clause originally quoted here, about the perceived world being fantastically different from the real one, could not be found anywhere in the extracted text -- not even scrambled -- and multiple targeted web searches turned up no attestation of that exact phrase to Simon or March-Simon; likely misattributed or invented. Removed rather than left unverified. The aspiration-level and performance-program quotes below extract cleanly and are verbatim.] Aspiration-level adjustment is developed across Ch. 3-5: when rewards are easy, aspirations rise; when rewards fail, 'the aspiration level is gradually revised downward ... we assume, however, that the change in aspiration level occurs slowly, so that' the satisficer doesn't oscillate. Ch. 6 also distinguishes 'performance programs' (routinized stimulus-response repertoires for recurring situations — \"the stimulus will evoke, with a minimum of problem-solving or other computational activity, a well-structured definition of the situation\") from 'problem-solving activity' (search for new alternatives when no program fits). This pair (bounded rationality as axiom, satisficing + sequential search + aspiration-adjustment + performance-programs as the consequent procedure) is what cognitive science, behavioral economics, AI search algorithms, and organization theory built on for the next 60 years. Simon's 1957 *Models of Man* and the 1955 'Behavioral Model of Rational Choice' (QJE 69:99-118) are the earlier statements; the 1958 *Organizations* coauthored synthesis is the canonical book-length version."
canonical-instances:
  - "Job search: Simon's canonical example. A jobseeker doesn't sample the entire labor market and pick the highest-utility offer — they search sequentially until an offer meets their aspiration threshold (salary, location, role), then stop. If aspirations are well-calibrated, satisficing produces a near-optimum at vastly lower search cost; if they aren't, it can lock in a sub-optimum (the stopping rule fires too early) or never terminate (no offer meets the threshold, aspirations don't adjust)."
  - "Engineering design under deadline: the design that ships is the first one to pass the test suite + meet the customer requirements, not the design at the bottom of the global optimum. Designers satisfice on N criteria simultaneously (correctness, performance, maintainability, cost) and stop searching once each criterion crosses its aspiration band. This is why 'shipping is a skill' — it's the skill of calibrating aspiration thresholds correctly enough that satisficing produces good outcomes."
  - "Reinforcement-learning epsilon-greedy and Beam-search are computational satisficing: at each decision point, expand only the top-K candidates (not the full tree); stop search when expected value crosses a threshold. The bounded-rationality assumption is built into the algorithm by construction — full minimax is intractable, so the agent satisfices in policy space."
  - "Organizational standard operating procedures (SOPs): March-Simon's 'performance programs' are the OPERATIONAL form of satisficing at organizational scale. When a recurring situation arises, the SOP fires — the org doesn't re-deliberate the response, it executes the stored response. New situations trigger 'search' (which is more expensive in attention + time); the SOP-fired response is a satisficing solution that was good enough for the recurring class."
  - "Operationally distinct from lex-rgr3t habit-formation-frees-attention-for-higher-order-work: lex-rgr3t is the cognitive-individual primitive (recurring tasks become habits, freeing attention upward); lex-j2tgc is the decision-theoretic primitive (when facing a NEW problem, the procedure is satisficing not optimizing under bounded rationality). They compose tightly — habit-formation is what makes satisficing tractable for the routinized class of decisions; satisficing is what handles the non-routine class — but they answer different questions."
critical-questions:
  - "what distinguishes satisficing from giving up? Satisficing has a clear stopping condition: aspiration met across all criterion-variables simultaneously. Giving up is stopping without that. The diagnostic: name the aspiration threshold(s) the actor was searching against, and check whether the chosen alternative crossed each one. If yes, satisficing; if the actor took an alternative below threshold, something else happened (deadline pressure, exhaustion, mood, frame collapse)."
  - "when is satisficing actually worse than optimizing? When (a) the optimum is reachable at reasonable search cost AND (b) the optimum is substantially better than satisficing thresholds AND (c) aspiration thresholds are uncalibrated for the problem. In well-defined small-state-space games with full information, optimizing wins (chess engines minimax; sat solvers exhaust). The bounded-rationality assumption earns its keep precisely OUTSIDE this regime — in the messy, large-state-space, partial-information domain where optimization is intractable. Don't apply the satisficing diagnostic to closed-world problems where optimization is feasible."
  - "how do aspiration levels get set, and what goes wrong when they don't adjust? March-Simon's empirical claim: aspirations adjust to recent reward experience — easy success raises them, failure lowers them, slowly. Failures of the adjustment loop: rigidly-fixed aspirations (the organization that won't lower its growth target after a market shift, the engineer who won't ship anything below their personal aspiration even after the customer-requirement clarifies), or hyper-mobile aspirations (the actor who adjusts thresholds after every data point, never building stable expectations). Both failure modes break satisficing's normal operation."
  - "how does this compose with lex-w5qfe iterative-refinement and lex-n42kg reflection-in-action? lex-w5qfe is the closed feedback loop on a provisional target; lex-n42kg is the in-act framing-revision; lex-j2tgc is the per-cycle decision-rule (when to stop the loop, what alternatives to evaluate). They stack: lex-j2tgc gives the local stopping rule, lex-w5qfe gives the macro-iteration structure, lex-n42kg gives the within-cycle reframing move when surprise arrives. A bounded-rational practitioner running an iterative loop with reflection-in-action uses all three together."
  - "operationally distinct from lex-6pd48 intervention-and-observation: Pearl gave the mathematical framework for causal queries under structural assumptions; March-Simon gave the cognitive-decision framework under capacity limits. They are complementary — bounded-rational actors estimating causal effects from observational data are constrained by both the do-calculus (what's mathematically identifiable) and their own limits (what they can compute in time). The pair partitions: Pearl is about identifiability-given-data; March-Simon is about decidability-given-cognition."
