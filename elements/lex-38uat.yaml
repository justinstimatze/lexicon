id: lex-38uat
name: maintaining-a-valued-practice-at-minimum-viable-scale-via-direct-labor
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a valued practice loses the resource base it depended on, the response doesn't have to be abandoning the practice — substituting your own direct physical labor lets you keep it alive at whatever minimum scale that labor can sustain, even if it means personally doing work you've never had to do before. In the Jataka's tale of Visayha, left with nothing after Sakka destroys his fortune, the merchant takes up manual grass-cutting himself so he can still generate something, however small, to give away: 'My dear, all these years I have never mown grass before, but to-day I will mow grass and take and sell it, and by this means dispense the fitting alms.' He splits even that meager yield with beggars until he collapses from hunger."
related: []
evokes: [jataka, catukkanipata, visayha-jataka, direct-labor-substitution-sustains-a-practice-at-minimum-scale, refusing-to-abandon-a-practice-when-its-resource-base-collapses]
lineage:
  - source: primary
    text: jataka-chalmers1895-visayha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 340, Visayha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "My dear, all these years I have never mown grass before, but to-day I will mow grass and take and sell it, and by this means dispense the fitting alms."
canonical-instances:
  - "A nonprofit's entire grant funding for a free meal program disappears overnight, and rather than shutting the program down, the director starts personally cooking and serving a scaled-down version out of their own kitchen — sustaining the practice at whatever scale their own direct labor can carry."
critical-questions:
  - "At what point does maintaining minimum viable scale through direct sacrifice become self-destructive rather than admirable — the merchant collapses from hunger doing this, which raises whether the practice was worth preserving at that specific cost."
  - "Does keeping the practice alive at a token scale actually serve its original purpose, or does it become more about the symbolic commitment to not quitting than about the practical good the full-scale version once accomplished?"
status: active
