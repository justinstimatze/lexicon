id: lex-pvpag
name: commitment-decay-sheds-costliest-behavior-before-cheapest-identity
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Apply this when a system of graded commitment (religious practice, civic association, party membership, brand loyalty, workplace culture, a language community) is losing the reinforcement that sustains it, and the live question is which parts erode first — or whether declining X (attendance, participation, output) means the whole commitment is gone. Stolz, Antonietti, de Graaf & Hackett's finding, tested across 111 countries (Pew), 58 countries (WVS/EVS), and a 17-country longitudinal subset: secularization does not happen all at once or in random order. It follows a consistent Participation-Importance-Belonging (P-I-B) sequence — public ritual participation declines first, private importance of the belief declines second, and formal identity-affiliation (belonging) is shed last. The ordering tracks relative cost: 'public ritual attendance demands the most time and energy, while mere identity affiliation is least burdensome and thus most persistent.' The costliest, most externally-visible behavioral commitment is the first casualty of declining reinforcement; the cheapest, most private identity-marker is the most durable and the last to go. Critically, this is a COHORT-level, intergenerational pattern, not an individual life-course one: 'the P-I-B sequence normally does not occur within the lifespan of an individual but rather transpires across extended periods among cohort groups.' The mechanism the authors propose is a breakdown in intergenerational transmission, not adult deconversion — parents keep teaching the belief but stop backing it up with the costly behavior, and it is THAT gap (belief taught without behavioral demonstration) that erodes the next generation's own behavioral commitment first, leaving their private importance and formal identity comparatively more intact for longer. Diagnostic payoff: a system's LOWEST-cost commitment layer (identity/affiliation) is the worst indicator of how much real commitment remains — it is definitionally the last thing to erode, so 'still affiliated' or 'still identifies as X' undercounts how far decline has already progressed, while a drop in the costliest layer (behavior/participation) is the earliest and most sensitive signal, appearing well before identity-level numbers move. When extending this shape beyond religion — civic-association attendance eroding before formal membership lapses, employees quietly stopping discretionary extra effort well before they stop calling themselves 'loyal' to the company, party-rally attendance and volunteering dropping before people drop their partisan self-identification, daily language use fading a generation before ethnolinguistic self-identification does — treat it as an untested extrapolation of the SHAPE (cost-ordered erosion, cheap-identity-lags-behind-costly-behavior), not as an already-validated claim outside the religion domain the paper actually tested. Don't use 'people still identify as X' as evidence that a system is stable; check the costliest behavioral layer instead, since it moves first and it is the layer this model says is genuinely diagnostic."
