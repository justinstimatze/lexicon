lineage:
  - source: primary
    text: habermas-1983-discourse-ethics-notes-program-philosophical-justification
    citation: "Jürgen Habermas, *Moral Consciousness and Communicative Action*, trans. from the German (Cambridge, MA: Polity Press / MIT Press, 1990; original German *Moralbewußtsein und kommunikatives Handeln*, Suhrkamp Verlag, 1983), esp. Ch. III 'Discourse Ethics: Notes on a Program of Philosophical Justification,' section II 'The Principle of Universalization as a Rule of Argumentation,' and the closing essay 'Morality and Ethical Life: Does Hegel's Critique of Kant Apply to Discourse Ethics?' Habermas's own essay is a first-person, translated primary text (not a summary): sections 3-5 of 'Discourse Ethics' state, in his own voice, the formal universalization principle (U) and the discourse principle (D), and explicitly derive both in a way designed to exclude any monological (single-reasoner) application. The 'Morality and Ethical Life' essay restates the same move in direct contrast with Kant's categorical imperative and with Rawls's original position. The volume also includes an Introduction by Thomas McCarthy (translator/editor's scholarly framing, not Habermas's own words) which is quoted below where it supplies a clean summary formulation; passages so marked are McCarthy's, not Habermas's."
    quote: "[Habermas's own statement of intent, opening 'The Principle of Universalization as a Rule of Argumentation':] 'In section 4 I will introduce the principle of universalization (U) as a bridging principle that makes agreement in moral argumentation possible. The version of the principle that I will give excludes any monological application of this rule for argumentation.' [Habermas's first formal statement of (U):] '(U) All affected can accept the consequences and the side effects its general observance can be anticipated to have for the satisfaction of everyone's interests (and these consequences are preferred to those of known alternative possibilities for regulation).' [Habermas's formal statement of (D), immediately distinguished from (U):] 'We should not mistake this principle of universalization (U) for the following principle, which already contains the distinctive idea of an ethics of discourse... (D) Only those norms can claim to be valid that meet (or could meet) with the approval of all affected in their capacity as participants in a practical discourse.' [Habermas explaining why (U) is built to block monological use:] 'I have formulated (U) in a way that precludes a monological application of the principle. First, (U) regulates only argumentation among a plurality of participants; second, it suggests the perspective of real-life argumentation, in which all affected are admitted as participants. In this respect my universalization principle differs from the one John Rawls proposes.' [Habermas on why a real discourse, not a hypothetical one, is required:] 'Discourse ethics... stands or falls with two assumptions: (a) that normative claims to validity have cognitive meaning and can be treated like claims to truth and (b) that the justification of norms and commands requires that a real discourse be carried out and thus cannot occur in a strictly monological form, i.e., in the form of a hypothetical process of argumentation occurring in the individual mind.' [Habermas restating (U) later, more compactly:] '(U) For a norm to be valid, the consequences and side effects of its general observance for the satisfaction of each person's particular interests must be acceptable to all.' [Habermas restating (D) later, more compactly:] '(D) Every valid norm would meet with the approval of all concerned if they could take part in a practical discourse.' [Habermas on the moral theorist's own limits:] 'The moral theorist may take part in [real or advocatory discourses] as one of those concerned, perhaps even as an expert, but he cannot conduct such discourses by himself alone.' [Habermas's direct contrast with Kant's monologism, from 'Morality and Ethical Life':] 'discourse ethics rejects the monological approach of Kant, who assumed that the individual tests his maxims of action foro interno or, as Husserl put it, in the loneliness of his soul. The singularity of Kant's transcendental consciousness simply takes for granted a prior understanding among a plurality of empirical egos; their harmony is preestablished. In discourse ethics it is not. Discourse ethics prefers to view shared understanding about the generalizability of interests as the result of an intersubjectively mounted public discourse.' [Habermas's Gültigkeit/Geltung distinction, the criterion for what counts as genuine validity:] 'every agreement, whether produced for the first time or reaffirmed, is based on (controvertible) grounds or reasons. Grounds have a special property: they force us into yes or no positions. Thus, built into the structure of action oriented toward reaching understanding is an element of unconditionality. And it is this unconditional element that makes the validity (Gültigkeit) that we claim for our views different from the mere de facto acceptance (Geltung) of habitual practices.' [McCarthy's Introduction, summarizing the replacement-of-Kant move — editorial framing, not Habermas's own words:] 'His \"discourse ethics,\" however, replaces Kant's categorical imperative with a procedure of moral argumentation: normative justification is tied to reasoned agreement among those subject to the norm in question. The central principle is that for a norm to be valid, its consequences for the satisfaction of everyone's interests must be acceptable to all as participants in a practical discourse. This shifts the frame of reference from Kant's solitary, reflecting moral consciousness to the community of moral subjects in dialogue. Whether a norm is justifiable cannot be determined monologically, but only through discursively testing its claim to fairness.' [McCarthy on the Rawls contrast, same passage:] 'Unlike Rawls's original position, however, practical discourse does not feature rational egoists prudently contracting behind a veil of ignorance — a procedure that can itself be carried out monologically — but moral agents trying to put themselves in each other's shoes... Habermas's discourse model, by requiring that perspective-taking be general and reciprocal, builds the moment of empathy into the procedure of coming to a reasoned agreement: each must put him or herself into the place of everyone else in discussing whether a proposed norm is fair to all. And this must be done publicly; arguments played out in the individual consciousness or in the theoretician's mind are no substitute for real discourse.'"
  - source: discovery-loop
    text: distinctness-audit-habermas-discourse-ethics-vs-existing-substrate
    citation: "The source text is the Polity/MIT Press translated volume of Habermas's own *Moral Consciousness and Communicative Action*: Thomas McCarthy's Introduction is secondary/editorial framing, quoted above and clearly marked as such, and sits alongside Habermas's own first-person essays 'Discourse Ethics: Notes on a Program of Philosophical Justification' and 'Morality and Ethical Life,' which state the formal (U) and (D) principles directly in Habermas's own voice and corroborate McCarthy's summary. Elsewhere in the substrate, Habermas appears only in passing citations within lists unrelated to discourse ethics as a primary claim — Frankfurt-school extensions of Kant, deliberative-democracy political theory, responses to Nietzschean perspectivism, a decolonial critique of 'Habermasian ideal speech,' the methodological-pluralism tradition, a rhetorical-fallacy example, and corporate-personhood theory. lex-653ng (when-power-decides-which-reasons-count-evidence-quality-stops-binding) does carry a full primary Habermas lineage entry citing this same book, but grounds a distinct claim: lex-653ng's headline claim is configurational — when power shapes who gets to participate and which reasons are admissible, the resulting agreement is not genuinely binding even if it looks like consensus. This atom's headline claim is methodological: what a genuinely valid norm-test even is (a real, dialogical, plural-participant discourse) as opposed to what Kant's and Rawls's test is (single-reasoner, monological, however sophisticated). lex-653ng presupposes this atom's ideal-discourse-conditions as the norm that power can violate; this atom states what those ideal conditions replace and why. lex-kfk68 (categorical-imperative-universalizability-as-moral-test) carries a Rawls veil-of-ignorance lineage entry noting Rawls as another modern Kantian-style universalizability test, and a Scanlon contractualism entry, but no mention of Habermas anywhere — it stands as the direct contrast-pair related neighbor: Kant's monological test that this atom's claim explicitly replaces. No dedicated Rawls veil-of-ignorance/original-position primary atom exists in the substrate; the Rawls contrast the source text itself draws (practical discourse vs. a procedure 'that can itself be carried out monologically') is folded into this atom's own lineage quote block and into lex-kfk68's existing Rawls entry rather than grounding a redundant new atom."
canonical-instances:
  - "The direct Kant/Habermas contrast: a single agent asks 'could I will my maxim to become universal law?' and answers alone, in Kant's phrase reused approvingly by Habermas, 'foro interno... in the loneliness of his soul.' Habermas's replacement test asks instead whether the norm 'meet[s] (or could meet) with the approval of all affected in their capacity as participants in a practical discourse' (D) — a question that, on Habermas's own explicit statement, 'cannot occur in a strictly monological form... in the form of a hypothetical process of argumentation occurring in the individual mind,' no matter how conscientiously or impartially the single reasoner tries to imagine everyone else's assent."
  - "The Rawls contrast: Rawls's veil-of-ignorance original position looks dialogical (multiple represented parties choosing principles together) but is, on Habermas's own diagnosis, 'a procedure that can itself be carried out monologically' — one theorist working out what rational egoists would choose behind a veil. Habermas's practical discourse instead requires 'moral agents trying to put themselves in each other's shoes' with 'perspective-taking be[ing] general and reciprocal,' conducted publicly among really-present, really-differentiated people, not simulated by one mind."
  - "The Gültigkeit/Geltung diagnostic: a norm that everyone happens to accept, complies with, or has stopped objecting to has, at most, Geltung — 'the mere de facto acceptance... of habitual practices.' Only a norm that emerged from an actual discourse in which each affected party could respond with a real 'yes' or 'no' to the reasons offered has Gültigkeit — genuine validity. Widespread compliance is not, by itself, evidence that a norm passed Habermas's test."
  - "A modern cross-domain extension responsibly built on Habermas's own argument, not his text: a leadership team drafting a workplace policy, an AI lab drafting a set of model values, or a platform drafting community guidelines by reasoning carefully about 'what our stakeholders would find fair' has run a sophisticated monological universalizability test — Kantian in form even when well-intentioned — rather than Habermas's discourse-ethics procedure, which would require the actual stakeholders to participate as real interlocutors able to say yes or no to the reasons offered, not merely be modeled inside the drafters' own reasoning."
critical-questions:
  - "Is the validity of this norm being tested by one person (or one team) carefully imagining what everyone affected would accept, or by an actual discourse in which those affected can themselves respond with a real 'yes' or 'no' to the reasons offered? Habermas's own diagnostic is exactly this: a hypothetical process of argumentation occurring in one mind, however careful, remains monological."
  - "Is a multi-party thought experiment (a veil of ignorance, a stakeholder-modeling exercise, an internal 'devil's advocate' review) being treated as equivalent to real discourse? Per Habermas's own explicit classification of Rawls's original position, a procedure that represents multiple parties can still be 'carried out monologically' if it is one reasoner's construction rather than an actual discourse among really-present people."
  - "Is observed agreement, compliance, or absence of objection being mistaken for genuine validity? Habermas's Gültigkeit/Geltung distinction names the gap: de facto acceptance (habit, convention, coercion, or a power-configured appearance of consensus) is not the same as validity secured through justified, uncoerced discourse. Reach for lex-653ng when the live question is specifically whether power shaped who got to participate or which reasons counted."
  - "Are all those actually affected by the norm's consequences included as real participants, or has the circle of 'the affected' been drawn narrowly, implicitly, or unilaterally by whoever is setting the norm?"
  - "Is the perspective-taking in this process general and reciprocal — does everyone involved take on the obligation to imagine the norm from every other participant's standpoint — or does only the norm-setter do empathetic work while everyone else is merely informed, surveyed, or consulted after the fact?"
