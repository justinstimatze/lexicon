lineage:
  - source: primary
    text: westermarck-1891-history-of-human-marriage
    citation: "Edvard Westermarck, The History of Human Marriage (London: Macmillan, 1891), Chapter XII, 'Sexual Modesty.' The general theoretical statement of the childhood-co-residence aversion mechanism closes the chapter at p. 453; the Northern New Hebrides ethnographic illustration, citing Dr. R. H. Codrington, The Melanesians: Studies in Their Anthropology and Folk-Lore (Oxford: Clarendon Press, 1891), p. 240, appears at p. 438, embedded in a wider survey of sexual-modesty and avoidance customs (pp. 433-454) that Westermarck reads as convergent evidence of a single underlying mechanism: sexual bashfulness generated by, and confined largely to, members of one's own or one's mate's domestic circle."
    quote: "[Westermarck's own general theoretical statement of the mechanism, closing Ch. XII 'Sexual Modesty,' p. 453:] 'But I feel confident that they are in the main due to that feeling of sexual shame which a person is naturally apt to experience in the presence of a member of the family circle of his (or her) mate, as well as in the presence of a member of his (or her) own family circle. That there is such a tendency is beyond all dispute; nor can there be any doubt about its origin. It must be an offshoot of that aversion to sexual intercourse between parents and children, brothers and sisters, and generally persons who have grown up in the same home, which is normally felt among all races of men. This feeling throws a veil of secrecy over the relations between husband and wife and imposes a taboo on sexual matters in all other relations inside the domestic circle. Nay, through the influence of early sentiments and habits, it has also become a motive force of sexual modesty outside that circle.' [His explicit rejection of alternative explanations for this specific aversion, same page:] 'Female coyness could never account for the peculiar sexual reserve between near relatives, nor do I think that it could account for the genuine shyness which characterises true modesty... in the sexual shame felt in the presence of a near relative there is nothing pleasing or exciting when displayed by a woman and nothing conventional when displayed by a man. Why? Because it is rooted not in love but in aversion.' [The Northern New Hebrides ethnographic illustration, p. 438, quoting Dr. Codrington:] 'In this connection the following statement made by Dr. Codrington with reference to the natives of the Northern New Hebrides deserves mentioning:— \"A girl betrothed in childhood is taken to her father-in-law's house and brought up there; the boy often thinks she is his sister, and is much ashamed when he comes to know the relation in which he stands.\"' [Supporting avoidance-custom material generalizing the domestic-circle-aversion mechanism to in-laws encountered under the same conditions of intimate household proximity, pp. 440-441:] 'The custom of avoidance between a man and members of his wife's family I thus take to be ultimately based on the sexual bashfulness felt inside the domestic circle... It seems only natural that where this aversion is so exceedingly strong as it is among peoples at the lower stages of culture, a man should feel sexual shame in the presence of persons of his wife's family, who would not only at once come to think of his relations to their daughter or sister but feel aversion to the very idea of those relations, and that they, on their part, also should be anxious to avoid him.' [Dr. Jochelson on the Yukaghir, cited by Westermarck in the same discussion, p. 437-438:] 'the sense of shame prevailing in a high degree among near relatives undoubtedly helped to prevent sexual intercourse among them.'"
canonical-instances:
  - "The Northern New Hebrides betrothal case itself, via Dr. Codrington: a girl betrothed in early childhood is raised in her future father-in-law's household alongside her intended husband; despite having no genetic relation to him whatsoever, the boy 'often thinks she is his sister,' and reacts with shame rather than desire on learning the actual (marital) relation between them — proof that co-residence alone, absent genetic kinship, is sufficient to trigger the aversion Westermarck attributes to 'persons who have grown up in the same home.'"
  - "Westermarck's own catalogue of corroborating in-law and sibling avoidance customs presented as evidence for the same underlying mechanism rather than independently-invented etiquette: a Moroccan bridegroom avoiding his own parents from the moment his marriage is first arranged; the Yukaghir belief that a man and his mother-in-law's souls are 'ashamed when they look at each other'; and a circum-Pacific pattern (Mortlock Islands, Arunta) of brother-sister speaking and touching avoidance instituted specifically once both parties reach sexual maturity — all read by Westermarck as surface expressions of 'sexual bashfulness felt inside the domestic circle,' not as separately-taught social rules."
  - "Twentieth-century natural-experiment corroboration Westermarck's own text anticipates but could not yet cite: Israeli kibbutz cohorts raised communally with unrelated agemates from infancy, and Taiwanese 'minor marriage'/sim-pua households in which an unrelated future bride is adopted in infancy and reared alongside her intended husband — both settings later studied as direct empirical tests of the same childhood-co-residence mechanism, with reduced mutual attraction and elevated marital difficulty as the recurring finding among co-reared, unrelated pairs."
  - "A responsible modern extension beyond Westermarck's own text: adoptive or step-siblings introduced into the same household in early childhood who report, on reaching adulthood, an unprompted mutual absence of romantic interest indistinguishable from what they feel toward a genetic sibling — the co-residence proxy firing identically whether or not any genetic relationship is actually present."
  - "The contrast case that proves the mechanism tracks the proxy and not the target variable directly: adult-onset genetic-sibling reunions (siblings separated at birth, raised apart, and only introduced to each other as adults) in which mutual romantic or sexual attraction is sometimes reported — because the childhood-co-residence window that would have triggered Westermarck's aversion mechanism never occurred, despite full genetic relatedness being present."
  - "The modern hedge on the strongest reading of the mechanism: Shor & Simchai's re-study of Israeli kibbutz cohorts found some co-reared, unrelated peers still reported residual sexual attraction to each other as adults, but rarely acted on it or pursued marriage. Their conclusion is that social norms and pressure against such pairings supply genuine additional force alongside whatever aversion the co-residence mechanism itself produces. Treat co-residence-produces-aversion as a well-evidenced tendency that leans on social reinforcement, not an infallible mechanism that operates alone."
critical-questions:
  - "Is the aversion or avoidance being observed keyed to actual genetic relatedness, or to childhood co-residence and early domestic intimacy — and would it still occur, per the Northern New Hebrides case, if the co-residence were present without the genetic relationship, or fail to occur if the genetic relationship were present without the co-residence?"
  - "Is someone attributing incest-avoidance to moral teaching, taboo-internalization, or conscious calculation of genetic risk, when Westermarck's own claim is a spontaneous, felt aversion that predates and does not depend on any taught rule — with the codified prohibition, where one exists, following the felt aversion rather than causing it?"
  - "When two people who are NOT genetically related but WERE raised together in close daily intimacy from early childhood report a mutual, sibling-like absence of attraction or active aversion, is that being investigated as an instance of the general co-residence-triggered mechanism, or dismissed as anomalous and left unexplained?"
  - "Is this question actually about the specific MECHANISM that assesses relatedness and the concrete case proving it can be fooled (this atom, and lex-5dnd9's flagged 'reliability of the relatedness-assessment cue' question), about the fully general abstract PRINCIPLE of proxy/target divergence in any selected system (lex-kh8gf), or about the STRUCTURAL/FUNCTIONAL role the resulting prohibition plays in generating social exchange systems (lex-akgce)? These are adjacent but different questions with different atoms."
  - "Has the co-residence assumption itself actually been verified in the case at hand, or is the proxy (shared upbringing) merely being assumed because the parties are nominally kin — i.e., is the aversion (or its absence) being explained by the right variable, or by whichever variable happens to be easiest to observe?"
  - "Given Shor & Simchai's finding that residual attraction can persist even when marriage or pursuit doesn't, how would you distinguish 'genuine reduction in attraction' from 'attraction suppressed by social pressure that happens to correlate with co-residence' — the two produce the same behavioral outcome (no intermarriage) but very different underlying mechanisms, and the available evidence may not cleanly separate them."
status: active
