id: lex-55yvr
name: covertly-testing-experts-against-known-ground-truth-reveals-the-honest-one
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone wants to know which of several purported experts is actually reliable, staging a private event only they know actually happened and then quizzing the experts about it separates honest, accurate reporting from generic, safe answers designed to sound plausible either way. The test works because the questioner alone holds the ground truth the experts are unknowingly being scored against. In the Jataka's tale of the disguised king, a king wandering incognito is briefly mugged and released, an event only he knows occurred. Quizzing his astrologers the next morning, most give vague, comfortable answers, but one reports the event accurately: 'Yes, my lord: last night you fell into the hands of your enemies, and in a moment you got free again.' The king's verdict is immediate: 'That is the kind of man a star-gazer ought to be.'"
