  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 4 'Choice Versus Orderings,' Section 4.3 'Rationality and Collective Choice,' p.89."
    quote: "“Various selection processes do not, in fact, satisfy property β. Two Australians may tie for the Australian championship in some game, neither being able to defeat the other, but it is perfectly possible for one of them to become the world champion alone, since he might be able to defeat all non-Australians, which the other Australian champion may not be able to do. Similarly, two poets or scientists could get the same national honours, with only one of them receiving some international honour such as the Nobel Prize, without this appearing as irrational in any significant sense.”"
canonical-instances:
  - "Hypothetical: Two candidates tie for top score in a regional coding competition, and only one of them goes on to win the international round outright. A commentator calls the regional result unreliable, since 'the real best coder' should have shown up there too -- but the international round pitted both against a field of competitors the regional round never included, so the tie and the later split describe two different comparisons, not one inconsistent one."
  - "Hypothetical: Two internal candidates tie in a company's regional sales rankings, and one of them later wins a national award the other doesn't. HR flags the regional scoring as inconsistent for producing a tie that 'should have' predicted the national result. The national award reflects performance against a national pool of competitors the regional ranking was never built to measure against."
critical-questions:
  - "Doesn't this reasoning let any tie-then-split pattern off the hook, no matter how suspicious -- couldn't 'the wider field had new competitors' always be claimed after the fact? Only if the new competitors are actually named and shown to matter, which is checkable: did the broader comparison introduce entrants the narrower one lacked, and did the eventual winner's edge come specifically from beating some of them? If no new competitors can be pointed to, the split has no such excuse and the inconsistency stands."
  - "If property β doesn't have to hold, what's left of the idea that a rational choice process should be internally consistent? Sen keeps a different consistency condition, property α (whatever's best in the whole set must be best in every subset it belongs to), and treats that one as solid. The claim here is narrower than 'consistency doesn't matter' -- it's that this specific consistency demand, over-tie-breaking across differently-populated comparisons, asks for something a rational process has no obligation to provide."
