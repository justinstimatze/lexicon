id: lex-w77q7
name: redirect-fixed-giving-from-volume-to-highest-value-recipients
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Dissatisfied that indiscriminate alms are being consumed by unworthy takers, a giver can deliberately seek out a narrower set of recipients judged to be the highest-value use of the same fixed resource — a shift from volume-maximizing to selectivity-maximizing allocation of a fixed budget. In the Jataka''s tale of Aditta, King Bharata does exactly this once he grows dissatisfied with his own indiscriminate charity: "My alms are devoured by worthless greedy people: I don''t like this: I should like to give alms to the virtuous paccekabuddhas who deserve the best of gifts: they live in the Himalaya region: who will bring them here on my invitation and whom shall I send on this errand?"'
related: []
evokes: [jataka, atthanipata, aditta-jataka, selective-philanthropy, targeting-the-highest-value-recipient]
lineage:
  - source: primary
    text: jataka-chalmers1895-aditta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 424, Aditta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "My alms are devoured by worthless greedy people: I don't like this: I should like to give alms to the virtuous paccekabuddhas who deserve the best of gifts: they live in the Himalaya region: who will bring them here on my invitation and whom shall I send on this errand?"
canonical-instances:
  - "A donor who has spent years writing small checks to every charity that asks stops and redirects the entire fixed budget toward the handful of programs an independent evaluator rates as producing the most measurable good per dollar."
critical-questions:
  - "What is lost when a giver moves from broad, indiscriminate giving to narrow, selective giving — does anyone who was previously helped now go without?"
  - "How does a giver actually verify that a narrower set of recipients is higher-value, rather than simply more flattering to give to or easier to feel good about?"
status: active
