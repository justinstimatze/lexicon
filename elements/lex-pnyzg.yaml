    quote: "him only to whom the divinity has continued happiness unto the end, we call happy; to salute as happy one that is still in the midst of life and hazard, we think as little safe and conclusive as to crown and proclaim as victorious the wrestler that is yet in the ring."
canonical-instances:
  - "Solon's answer to Croesus in Plutarch: current wealth and power are not evidence of a happy life, because fortune can still reverse before the life concludes — calling someone happy mid-course is like declaring a wrestler victorious while the match is still underway."
  - "refusing to call a hot-funding-round startup a success before an exit event: any of the ordinary hazards of the intervening years (a competitor, a market shift, a founder departure) can still reverse the current trajectory before the outcome that would actually license the label has occurred."
  - "scientific practice of withholding 'replicated' status until independent confirmation closes the loop: no matter how strong an original finding looks in isolation, the result remains provisional until the specific concluding event (independent replication) has actually happened."
critical-questions:
  - "how does this differ from lex-sdc6x (fortune-arrives-mixed-never-purely-good)? lex-sdc6x names a claim about the COMPOSITION of fortune at any given moment — good and bad arrive mixed together, so no one's current state is purely fortunate, and visible good fortune doesn't mean someone is exempt from loss. This atom names a claim about TIMING and FINALITY specifically — the objection isn't that current happiness is secretly mixed with hidden misfortune, but that ANY current state, however purely good it looks, remains open to reversal by a later event, so the verdict itself must wait for the outcome to close. lex-sdc6x is about the mixture within a moment; this atom is about the sequence across time and when a verdict becomes safe to render."
  - "isn't this just excessive caution — at some point don't you have to call an outcome one way or another? The atom's claim is conditional on a REAL possibility of reversal remaining open, not a demand for infinite caution. Once the wrestling match ends, once the startup's exit event occurs, once the replication is independently confirmed, the atom's own logic licenses a verdict — the claim is specifically about the interval BEFORE that concluding event, when a verdict is still vulnerable to being falsified by something that hasn't happened yet."
  - "doesn't this make it impossible to ever act on early good news, since nothing is ever truly final? The atom governs the LABEL ('happy,' 'successful,' 'victorious'), not action under uncertainty generally — a wrestler currently ahead can still be backed, invested in, or celebrated provisionally; the atom's specific target is the overconfident, closed-form verdict that treats a reversible intermediate state as if it were already the concluded outcome. Provisional confidence and a premature final verdict are different things, and the atom only forecloses the second."
