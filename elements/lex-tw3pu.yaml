id: lex-tw3pu
name: barred-from-producing-but-showered-with-means-to-consume-distorts-the-market
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A class of people can be systematically blocked from productive or creative output while simultaneously being given generous, unearned means to consume -- resources that arrive independent of anything the class itself makes. Because their consumption is severed from any prior production of their own, it isn't disciplined by the ordinary check of having to earn what's spent, and the class becomes a market that rewards decoration, novelty, and variety for their own sake rather than genuine utility, pulling real productive effort elsewhere in the system toward serving that undisciplined demand. Gilman names the mechanism directly: 'For the woman there is, first, no free production allowed; and, second, no relation maintained between what she does produce and what she consumes. She is forbidden to make, but encouraged to take... the consuming female... creates a market for sensuous decoration and personal ornament, for all that is luxurious and enervating, and for a false and capricious variety in such supplies, which operates as a most deadly check to true industry and true art.'"
related: []
evokes: [women-and-economics, chapter-vi, she-is-forbidden-to-make-but-encouraged-to-take, the-priestess-of-the-temple-of-consumption, unearned-consumption-untethered-from-production-distorts-supply]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-vi
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter VI. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "But other things are not equal. Half the human race is denied free productive expression, is forced to confine its productive human energies to the same channels as its reproductive sex-energies. [...] For the woman there is, first, no free production allowed; and, second, no relation maintained between what she does produce and what she consumes. She is forbidden to make, but encouraged to take. [...] Again, the consuming female, debarred from any free production, unable to estimate the labor involved in the making of what she so lightly destroys, and her consumption limited mainly to those things which minister to physical pleasure, creates a market for sensuous decoration and personal ornament, for all that is luxurious and enervating, and for a false and capricious variety in such supplies, which operates as a most deadly check to true industry and true art. As the priestess of the temple of consumption, as the limitless demander of things to use up, her economic influence is reactionary and injurious."
canonical-instances:
  - "Trust-fund heirs who never work still receive lavish, unearned allowances, and their spending on ever-changing luxury fashions and status goods pulls skilled craftspeople and designers away from durable, useful work toward producing novelty items whose main purpose is to be visibly new and expensive."
  - "A royal court class barred by rank from trade or productive labor but funded by taxation develops an appetite for elaborate, frequently-replaced court fashion and ornament, and merchants across the kingdom reorient toward supplying that appetite instead of goods the wider population actually needs."
  - "In a company where one department is deliberately kept out of any revenue-generating role but is given a large, loosely-supervised discretionary budget, that department's vendors learn to sell elaborate, frequently-refreshed presentation materials and events rather than anything that measurably improves the company's output."
critical-questions:
  - "Is the distortion caused specifically by the severing of consumption from production, or would the same market-warping toward decoration and novelty occur in any group given large discretionary purchasing power, whether or not that group was also barred from producing anything itself?"
  - "Gilman treats the consuming class's taste for luxury and variety as a symptom of their forced position rather than a preference they might hold regardless -- how would you tell the difference between taste-as-adaptation-to-constraint and taste that would persist even if the constraint on production were lifted?"
  - "If the barred class were suddenly given free access to productive work, would the market distortion reliably correct itself, or might the consumption patterns it created in the meantime persist as an independent habit, no longer requiring the original bar to keep reproducing themselves?"
status: active
