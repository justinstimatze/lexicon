lineage:
  - source: primary
    text: hyde-hermess-confounded-polarity-tracks-paralyze-apollos-skilled-reading
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Hallmarks of Trickster's Mind,' on the Homeric Hymn to Hermes. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "His own tracks are thus hard to read; they seem to point in all directions; they have no orientation. ... confounded polarity makes the world unpassable and is a kind of aporia. It blocks all passage by destroying the orientation that passage requires. When Apollo comes upon the tracks that Hermes and the cattle leave, he is stopped in his own tracks, unable to move: And when the Great Archer made out the footprints, he cried out: “Well, well! This is remarkable, what I’m seeing. Clearly these are longhorned cattle tracks, but they all point backwards, toward the fields of daffodils! And these others, they are not the tracks of a man or a woman, nor of a gray wolf or a bear or lion. ... What swift feet took these long strides? The tracks on this side of the path are weird, but those on the other side are weirder still!”"
canonical-instances:
  - "An investigator skilled at reading financial records isn't stopped by a company that hides its transactions, since missing records just tell her where to dig -- she's actually stopped longer by a set of books that are fully disclosed but internally inconsistent in a way that admits no single coherent story."
  - "A skilled chess player isn't most troubled by an opponent making a hidden, unclear move; they're most troubled by a move that is perfectly visible but seems to serve two contradictory plans at once, since there's no missing information to go find, only an irresolvable ambiguity to sit with."
critical-questions:
  - "Does this tactic actually work against every skilled reader, or only against one committed to finding a single coherent explanation -- would a reader willing to hold multiple contradictory hypotheses simultaneously be immune to this kind of paralysis?"
  - "Is Apollo's bafflement genuinely different from ordinary deception, or is 'confounded polarity' just an unusually elaborate form of hiding the truth, since Apollo still doesn't know where his cattle are either way?"
  - "Does deploying contradictory-but-visible evidence risk drawing more attention and effort from the reader than simply hiding evidence would have, since visible strangeness itself signals that something deliberate is going on?"
