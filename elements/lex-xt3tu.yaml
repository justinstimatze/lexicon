lineage:
  - source: primary
    text: cushing-turtle-and-grandmother-overloaded-founds-ceremonial-specialization
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Revenge of the Two Brothers on the Hawikuhkwe.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'And the old Turtle was master-priest of ceremonies and people, low priest, song-master, and dancers; sacrificer of arrows and striver after the arrows. He would beat the drum and sing a little, then run and dance out the measure; but it was very hard work. And the old woman was mother of the children and sisters, and their clan, and somebody's else clan, matron of ceremonials, and maidens of ceremonials--all at the same time;--but it was very hard work, consequently they didn't get along very well. That's the reason why today we have so many song-masters and singers, dance leaders and dancers, priests and common people, father clans and mother clans, in the great Ceremony of Victory.'"
canonical-instances:
  - "A startup's two founders try to personally handle sales, support, engineering, and finance during a first major product launch, and the visible chaos and mistakes from that overload becomes the explicit justification the founders give employees for why the company now has dedicated departments for each function."
  - "A small nonprofit's single volunteer coordinator tries to run outreach, fundraising, event logistics, and board communications alone during its first major campaign, and the resulting burnout and dropped tasks becomes the case the board cites when creating separate paid roles for each function going forward."
critical-questions:
  - "Does the story frame the resulting specialization as strictly better, or merely as the path actually taken because two generalists happened to be overwhelmed -- would a different pair, more capable or better organized, have avoided the split and kept concentrated roles indefinitely?"
  - "Is there a meaningful difference between specialization that emerges from a demonstrated overload failure, as here, versus specialization designed proactively in anticipation of overload before any failure occurs -- does the story suggest anything about which produces a more durable division of labor?"
  - "Given that only two figures, a Turtle and a grandmother, are covering an entire ceremony's worth of roles, is the failure here really about the number of tasks, or about the complete absence of a community large enough to have specialists in the first place?"
status: active
