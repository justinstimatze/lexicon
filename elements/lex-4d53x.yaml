evokes: [horizon-determines-ranking, short-horizon-wins-different-strategy-than-long-horizon, what-you-measure-when-selects-what-strategy-wins, immediate-test-and-delayed-test-rank-strategies-oppositely, delayed-retrieval-is-the-only-honest-learning-kpi, measurement-window-is-load-bearing-not-incidental, the-test-timing-chooses-the-winner]
lineage:
  - source: primary
    tradition: cepeda-pashler-vul-wixted-rohrer-2006-distributed-practice-meta-analysis
    text: cepeda-pashler-vul-wixted-rohrer-2006-distributed-practice
    citation: "Nicholas J. Cepeda, Harold Pashler, Edward Vul, John T. Wixted, and Doug Rohrer, 'Distributed Practice in Verbal Recall Tasks: A Review and Quantitative Synthesis,' *Psychological Bulletin* 132(3):354-380 (2006). Quantitative meta-analysis of 839 assessments across 317 experiments in 184 articles on the distributed practice (spacing) effect. The key finding for substrate purposes: the optimal interstudy interval (ISI) is not a fixed property of learning but a function of the retention interval (RI) — i.e., the planned delay between final study session and measurement. Longer RIs require longer ISIs to maximize retention; the joint function inverts the rank-ordering of strategies as RI changes. The transferable claim is one step abstracted from Cepeda's empirical finding: the strategy that scores best at horizon T1 is generally not the strategy that scores best at horizon T2, so 'which strategy is best' is ill-formed until the measurement horizon is named. The learning-domain instance is the strongest empirical attestation (n=839); the same structural fact recurs across investment horizons, training regimes, drug-trial endpoints, organizational metrics, and sprint-vs-marathon cultures."
    quote: "[Cepeda et al. 2006, abstract:] 'The authors performed a meta-analysis of the distributed practice effect to illuminate the effects of temporal variables that have been neglected in previous reviews. This review found 839 assessments of distributed practice in 317 experiments located in 184 articles. Effects of spacing (consecutive massed presentations vs. spaced learning episodes) and lag (less spaced vs. more spaced learning episodes) were examined, as were expanding interstudy interval (ISI) effects. Analyses suggest that ISI and retention interval operate jointly to affect final-test retention; specifically, the ISI producing maximal retention increased as retention interval increased.' [Cepeda et al. 2006, Summary p.~370:] 'More than 100 years of distributed practice research have demonstrated that learning is powerfully affected by the temporal distribution of study time. More specifically, spaced (vs. massed) learning of items consistently shows benefits, regardless of retention interval, and learning benefits increase with increased time lags between learning presentations. On the other hand, it seems clear that once the interval between learning sessions reaches some relatively long amount of time, further increases either have no effect upon or decrease memory as measured in a later test. The magnitude of the observed distributed practice benefit depends on the joint effects of ISI and retention interval; retention interval influences the peak of this function.' [Cepeda et al. 2006, Introduction p.~356:] 'The practical relevance is obvious: One can hardly select an ISI that optimizes instruction unless one knows how learning depends upon ISI; if that function varies with retention interval, this too must be considered in designing the most efficient procedures for pedagogy or training. Theories of the distributed practice effect are incomplete unless they can account for joint effects of ISI, retention interval, and task.' [Practitioner-extraction: Cepeda's empirical finding establishes that in verbal-recall learning, the choice of ISI cannot be evaluated without specifying the retention interval at which retention will be measured. The transferable abstraction generalizes this to: any strategy-comparison is incomplete without specifying the measurement horizon, because the horizon is what determines which strategy wins. This is the learning-science anchor for adversaria's 'delayed-retrieval is the only honest KPI' invariant.]"
canonical-instances:
  - "in learning research (Cepeda 2006 meta-analysis of 839 assessments): the optimal between-session study interval scales with the retention interval; massed practice often outperforms spaced practice on immediate posttests but is reversed on delayed posttests"
  - "in financial portfolio comparison: a portfolio maximizing monthly returns (high-frequency trading) generally does not maximize 10-year returns; choosing the rank-order by monthly-return systematically picks the wrong long-horizon strategy"
  - "in software engineering: the team that maximizes features-shipped-per-sprint is not the team that maximizes system stability over a year; a sprint-velocity comparison ranks teams oppositely from a multi-year maintenance-cost comparison"
  - "in drug-efficacy trials: a 6-month endpoint can rank treatments oppositely from a 5-year endpoint; the trial-design choice of horizon determines which drug looks better, independently of patient outcomes"
  - "in exercise training: regimes optimizing weekly soreness/strain may produce faster short-term strength gain at the cost of injury or burnout that dominates the year-long outcome"
  - "operationally distinct from lex-tb3re Goodhart-on-velocity: Goodhart is about a metric becoming a target and being gamed; this atom is about an honest metric that simply doesn't predict the longer-horizon outcome (no gaming required — the timing of measurement itself selects the wrong winner)"
  - "operationally distinct from lex-jv983 fluency-trap: fluency-trap is about felt-ease-of-processing during judgment misleading truth assessment; this atom is about the structural fact that performance at one horizon is uncorrelated with (or anti-correlated with) performance at a later horizon, independent of any judgment heuristic"
  - "operationally distinct from lex-4mtpe stress-tested-through-use: stress-tested-through-use is about validation through actual deployment vs. proxies; this atom is about the choice of WHEN to measure during deployment (not whether to measure)"
critical-questions:
  - "what horizon am I optimizing for? If you cannot name the time-horizon at which the strategy's success will be measured, the comparison between strategies is structurally underdetermined. Practitioner-discipline: before scoring two strategies against each other, name the horizon explicitly and check whether that horizon matches the actual decision being made"
  - "what horizon is THIS measurement actually measuring? When reading a benchmark, evaluation, A/B test, or strategy comparison, ask: at what time-distance from intervention was this measured? Was it the intervention's natural payoff horizon, or was it whatever horizon was cheapest/fastest to instrument? Cheap-fast horizons systematically favor strategies that optimize for cheap-fast horizons"
  - "are the strategies being compared at the SAME horizon? Comparing strategy A scored at month 1 vs. strategy B scored at month 6 is structurally meaningless. Practitioner-question: have I aligned the measurement-time across the strategies I'm ranking?"
  - "does my proxy metric assume a horizon I haven't checked? Many evaluation pipelines implicitly assume that a near-horizon metric correlates with a far-horizon outcome. When the correlation breaks, the pipeline systematically picks the wrong strategy. Practitioner-discipline: when adopting a near-horizon proxy, derive what correlation with the far-horizon outcome you are assuming, and check it"
  - "the 'fast-feedback' trap: maintenance favors short-horizon metrics because they enable fast iteration. The hidden cost is that short-horizon metrics systematically reward strategies that lose at the actually-relevant horizon. Practitioner-question: is my use of short-horizon metrics a real proxy, or a substitution of what's easy-to-measure for what matters?"
