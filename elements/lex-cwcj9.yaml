id: lex-cwcj9
name: implicit-resolution
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When a dispute persists, surface that not every disagreement needs explicit closure — sometimes the resolution is implicit (the question moves, the parties drift, conditions shift) and forcing closure produces worse outcomes than letting it dissolve."
related: [lex-znaau, lex-jv983, lex-4mtpe, lex-33p2a, lex-zrhqq, lex-tqa55]
evokes: [topic-moved-past-without-closure, unresolved-but-effectively-closed, conversation-analytic-residue]
lineage:
  - source: primary
    text: sacks-schegloff-jefferson-1974-simplest-systematics-for-turn-taking
    citation: "Harvey Sacks, Emanuel A. Schegloff, and Gail Jefferson, 'A Simplest Systematics for the Organization of Turn-Taking for Conversation,' *Language* 50(4):696-735 (December 1974). The founding paper of conversation analysis (CA). Crucial claim for lex-cwcj9: the turn-taking system operates INDEPENDENTLY of topic-organization — turn-taking has no built-in mechanism for closing or resolving topics, only for allocating speaking turns. Topic-shift can therefore occur without any topic-closure operation, leaving the prior topic in the state lex-cwcj9 names (effectively-closed-by-being-no-longer-current rather than actually-resolved). The atom is a within-CA practitioner-extraction sharpening the topic-vs-turn distinction Sacks-Schegloff-Jefferson establish. for the foundational frame."
    quote: "[Sacks Schegloff Jefferson 1974 *Language* 50(4):696-735, on the topic-independence of turn-taking — the cardinal claim for lex-cwcj9:] 'One aspect of conversation's flexibility is a direct and important consequence of this feature of its turn-taking organization: its turn-taking organization (and thus conversational activity per se) operates independently of various characterizations of what occupies its turns, the \"topic(s)\" in them.' [The paper's central abstract claim:] 'A model for the turn-taking system for conversation is proposed, and is examined for its compatibility with observable facts about conversation. The results of the examination indicate that, at least, a model for turn-taking in conversation will be context-free in a sense to be specified, locally managed, party-administered, interactionally controlled, and sensitive to recipient design.' [On adjacency pairs as the local constraint mechanism — relevant because they ARE the case in which next-turn IS constrained by prior-turn, hence the contrast with topic-shift which is NOT so constrained:] 'The group of allocation techniques which we have called \"current speaker selects next\" cannot be used in just any utterance or utterance-type whatever. Rather, there is a set of utterance-types, adjacency pair first parts, that can be used to accomplish such a selection.' [Practitioner-extraction: Sacks-Schegloff-Jefferson establish that turn-taking is context-free with respect to topic. A consequence — the transferable claim lex-cwcj9 carves — is that topics can move past without being formally resolved, because the turn-taking system supplies no resolution-operation. The atom names a state the CA framework predicts but does not itself label: a topic that has been functionally abandoned via topic-shift, in the residual zone between actually-resolved and currently-live. The within-CA name 'topical coherence' (in later CA work) treats the same domain; lex-cwcj9 carves the specific failure-mode of leaving residue.]"
canonical-instances:
  - "a conversation moves from topic A to topic B without ever resolving A — A is now effectively-closed by being-no-longer-current, distinct from being-actually-resolved"
  - "the move that surfaces an implicit-resolution and offers to actually finish A: 'wait, we never actually decided about A — should we?'"
critical-questions:
  - "is the topic actually closed, or only effectively-closed by being no-longer-current? the discriminator: would re-raising provoke renewed discussion (effectively-closed-only), or has it been actually-resolved (re-raising is unnecessary)? Implicit-resolution names the first state"
  - "what would surfacing the implicit-resolution look like? the move 'wait, we never decided about A — should we?' tests whether the topic remains live. If 'no, we don't need to,' it was actually-resolved by context; if 'yes,' implicit-resolution was masking unresolved work"
  - "is this distinct from lex-4mtpe stress-tested-through-use? both involve absence-of-contradiction over duration, but lex-4mtpe is about an assumption holding; lex-cwcj9 is about a topic moving past without closure. lex-4mtpe produces accumulated-support; lex-cwcj9 produces conversation-analytic-residue"
  - "did the topic-shift happen by exhaustion or by avoidance? exhaustion-based shifts legitimately defer (the topic petered out); avoidance-based shifts mask a position someone didn't want to surface. The diagnostic: track WHO drove the topic away from A — if it's the party whose position was about to be challenged, the implicit-resolution is strategic, not natural"
status: active
