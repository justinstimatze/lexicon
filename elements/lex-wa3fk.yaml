    text: assembled-from-lex-jyzng-lex-vs2t5-lex-5a87w
    citation: "Molecule assembled from lex-jyzng (abstracting-an-entity-from-its-instances-creates-an-independent-domain-of-reasoning, Greek Good-move), lex-vs2t5 (contemplative-discipline-yields-a-distinct-class-of-evidence-about-mind-and-reality, Indian route), and lex-5a87w (opposites-can-be-complementary-and-cyclical-rather-than-antagonistic-and-exclusive, Chinese route). lex-5a87w's own canonical-instances state the composition directly: 'Composes with lex-jyzng (the Greek Good-move via abstraction, which underwrites antagonistic-dualism) and lex-vs2t5 (the Indian contemplative-route, which arrives at transcendent monism) — together the three name distinct cosmological resolutions: Greek dualist-transcendent (lex-jyzng), Indian monist-transcendent (lex-vs2t5), Chinese immanent-organismic (lex-5a87w).' All three share type-in=claim, type-out=claim — same abstract signature (a route to a cosmological resolution), different domain (which civilization, which resolution) — the textbook case for `classification` rather than `sequential`/`parallel`."
canonical-instances:
  - "A philosophy survey comparing Plato's Form of the Good, the Upanishadic Brahman-Atman identity reached through meditative absorption, and the Daoist yin-yang complementarity of the Yijing: each is presented as reaching a distinct metaphysical resolution not because the cultures 'believed different things' arbitrarily, but because each culture's characteristic epistemic method (abstraction-by-reasoning, contemplative-observation, correlative-reading-of-cycles) structurally predisposes it toward that resolution."
  - "A cross-cultural ethics course notices that a culture's dominant cosmology (transcendent-dualist vs. transcendent-monist vs. immanent-organismic) predicts which arguments land as intuitive in that tradition — mind-body dualism argues persuasively in Greek-descended traditions, non-dual awareness practices argue persuasively in Indian-descended traditions, and yin-yang-style both/and framing argues persuasively in Chinese-descended traditions — because the underlying cosmological resolution, not just surface belief-content, differs by route."
