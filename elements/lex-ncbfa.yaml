id: lex-ncbfa
name: what-counts-as-creative-genius-is-whatever-hasnt-been-formalized-yet
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When an output is being admired as a sign of individual talent or genius, check whether it's actually the product of a systematic procedure that simply hasn't been recognized or formalized as a procedure yet — because the label 'creative genius' tends to attach to whatever a domain hasn't yet reduced to a reliable method, and it quietly detaches the moment a formula for producing that same output becomes known. Altshuller makes the mechanism explicit with a historical case: 'In the Middle Ages, for example, the solution of equations of the third degree was genuinely creative. Tournaments were organised in which mathematicians challenged each other with equations, or square root problems. But then the Cardano formula came out and the solution of third degree equations was open to every first year mathematician.' He then applies the same logic directly to his own systematic method for solving inventive problems: 'Now imagine a 'transitional period'; everyone is looking for the roots of algebraic equations, eliminating possibilities, but we... know the Cardano formula. They all consider us geniuses — or at least very talented — but we know that it is the formula at work.' He names the paradox this produces starkly: 'man makes high level inventions... without in so doing making creative effort... This result (invention) is formally called creative, but in fact it is a common or garden [calculation], such as, for instance the calculation of a beam according to the formulae for the resistance of materials.' The underlying claim is that 'creativity' is not a fixed property of a task's difficulty or value — it's a label for the current boundary of the un-systematized, and that boundary moves. Once cubic equations got a formula, they left the 'creative' category entirely, regardless of how impressive solving one still looks to someone who doesn't know the formula. Diagnostic move: when praising an output as evidence of talent or genius, ask specifically whether a reliable, teachable procedure exists (even if the observer doesn't personally know it) that reproduces the same class of output — if such a procedure exists, the achievement reflects having or applying the procedure, not an innate or mysterious creative capacity, and the genuinely 'creative' territory has already moved to whatever that procedure still can't handle."
related: [lex-svcmp, lex-s3pkr]
evokes: [cardano-formula-analogy, creativity-migrates-to-the-unformalized, formula-at-work-not-genius, moving-boundary-of-creative-territory]
lineage:
  - source: primary
    text: altshuller-1984-cardano-formula-creativity-migrates
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.8 'The Science of Invention,' section 'Masterpieces According to Formula.'"
    quote: "'The paradoxical situation arises in which man makes high level inventions (i.e. obtains a high quality product of creativity) without in so doing making creative effort (i.e. without the process of creation)... This paradox has been caused by the fact that the concept of 'creativity' is not something unchanging and frozen: the contents invested in this concepts are constantly changing. In the Middle Ages, for example, the solution of equations of the third degree was genuinely creative. Tournaments were organised in which mathematicians challenged each other with equations, or square root problems. But then the Cardano formula came out and the solution of third degree equations was open to every first year mathematician.'"
  - source: primary
    text: altshuller-1984-they-consider-us-geniuses
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.8, 'Masterpieces According to Formula.'"
    quote: "'Now imagine a 'transitional period'; everyone is looking for the roots of algebraic equations, eliminating possibilities, but we both know the Cardano formula. They all consider us geniuses — or at least very talented — but we know that it is the formula at work.'"
canonical-instances:
  - "A photographer using an early camera's manual exposure controls in the 1900s was considered to have a rare technical gift; once modern cameras automated exposure calculation, the same correctly-exposed photograph stopped being evidence of any special skill at all — the 'creative' territory in photography migrated to composition, subject, and post-processing, the parts a camera still can't do for you."
  - "A chess player who could calculate several moves deep was once considered a rare prodigy; once chess engines could calculate far deeper than any human, that specific skill stopped conferring 'genius' status even though the underlying cognitive act (calculating variations) hadn't changed — what counts as chess talent shifted to judgment, preparation, and psychological factors engines don't need."
  - "operationally distinct from lex-svcmp accumulated-precedent-as-substrate-for-individual-genius: that atom is about WHERE a credited individual achievement's scaffolding actually comes from (communal precedent an individual draws on); this atom is about HOW THE LABEL 'creative' ITSELF migrates over time as procedures get formalized, independent of whether the achievement drew on precedent or not."
critical-questions:
  - "does discovering that a formula exists for producing an output retroactively devalue everyone who produced that output BEFORE the formula existed, or does the value of the earlier achievement depend on when it happened relative to the formula's discovery, in a way this frame doesn't fully address?"
  - "is there a symmetric risk of over-applying this frame — dismissing a genuinely difficult, non-formulaic achievement as 'probably just an undiscovered formula' without evidence that any such formula actually exists yet?"
  - "does 'creativity' ever get replaced by a formula and then genuinely disappear from a domain entirely (with nothing new to be creative about), or does Altshuller's own claim (that TSIP itself will eventually formalize away all invention) hold only for domains that keep generating new frontiers faster than formulas can catch up?"
status: active
