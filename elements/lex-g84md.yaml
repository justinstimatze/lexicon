id: lex-g84md
name: a-costless-hypothetical-refusal-proves-character-more-than-a-real-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Refusing a purely hypothetical, fantasy-scale request costs the refuser nothing, which is exactly what makes the refusal unusually damning — a real request could plausibly be refused for practical reasons, but there's no such excuse available when the thing being asked for was never actually at stake. In the Jataka's tale of the golden mountain, a wife asks her husband whether he'd share a mountain if it turned entirely to gold; his flat refusal draws harsher judgment than an ordinary 'no' would: '\"Suppose this mountain were to become all gold, would you give me some of it?\" \"Who are you?\" he replied, \"I would not give you a jot.\"'"
related: []
evokes: [jataka, catukkanipata, succaja-jataka, a-hypothetical-with-nothing-at-stake-is-a-cleaner-character-test, refusing-a-costless-request-has-no-practical-excuse]
