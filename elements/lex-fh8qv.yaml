id: lex-fh8qv
name: a-relativist-theory-must-locate-its-own-claim-within-its-own-scheme
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a theory claims that all standards of truth are relative to a culture, mentality, or system, don't just note the self-reference problem in the abstract — check what the theorist actually DOES with their own theoretical claim, since that reveals whether the relativism is being applied consistently. Merton's specific test on Sorokin's claim that different cultures have radically disparate, non-comparable 'systems of truth' (ideational, sensate, idealistic): 'In so far as Sorokin adopts the position of radically different and disparate criteria of truth, he must locate his own work within this context... he never resolves this problem.' The evidence: 'at the very outset, he states that his constructions must be tested in the same way \"as any scientific law. First of all the principle must by nature be logical; second, it must successfully meet the test of the 'relevant facts,' that is, it must fit and represent the facts.\" In Sorokin's own terminology, he has thereby adopted a scientific position characteristic of a \"sensate system of truth.\"' Then, confronted directly with the tension, Sorokin reaches for a separate 'integralist' escape hatch (intuition, mystical experience) rather than owning that his own scholarly method already picked a side. Merton's follow-up question is the generalizable diagnostic: 'does this meet the issue? The question is not one of the psychological sources of valid conclusions, but of the criteria and methods of validation. Which criteria would Sorokin adopt when \"supersensory\" intuitions are not consistent with empirical observation? ...he accepts the facts and rejects the intuition.' The theorist's own practice — which criterion he actually defers to when the systems conflict — reveals which system he's really operating inside, regardless of what his relativism claims about all systems being equally valid. Use this whenever someone asserts strong relativism about truth, morality, or validity: ask what standard THEY use to validate their own relativist claim, and watch what they do (not just what they say) when their own preferred standard conflicts with the ones they've declared merely 'relative.'"
related: [lex-u4cxv, lex-ucw53, lex-us3ap, lex-wmq5h]
scaffolds-from: [lex-u4cxv]
evokes: [merton-1957, sorokin-sensate-ideational, integralist-truth-escape-hatch, relativism-must-locate-itself, practice-reveals-the-real-standard, wissenssoziologie]
lineage:
  - source: primary
    text: merton-1957-sorokin-must-locate-his-own-work
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XII 'The Sociology of Knowledge,' p.475. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'In so far as Sorokin adopts the position of radically different and disparate criteria of truth, he must locate his own work within this context. It may be said, though an extensive discussion would be needed to document it, that he never resolves this problem... Thus, at the very outset, he states that his constructions must be tested in the same way \"as any scientific law. First of all the principle must by nature be logical; second, it must successfully meet the test of the 'relevant facts,' that is, it must fit and represent the facts.\" In Sorokin's own terminology, he has thereby adopted a scientific position characteristic of a \"sensate system of truth.\"'"
  - source: primary
    text: merton-1957-does-this-meet-the-issue
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.475-476."
    quote: "'But does this meet the issue? The question is not one of the psychological sources of valid conclusions, but of the criteria and methods of validation. Which criteria would Sorokin adopt when \"supersensory\" intuitions are not consistent with empirical observation? In such cases, presumably, so far as we can judge from his work rather than from his comments about his work, he accepts the facts and rejects the intuition.'"
canonical-instances:
  - "A pundit who argues 'all news framing is equally biased, there's no neutral standpoint' still edits their own commentary for factual accuracy and corrects genuine errors when caught — their editing practice reveals they haven't actually abandoned a fact/error distinction, whatever their stated theory claims."
  - "A manager who insists 'there's no objectively right way to run a team, it's all just different valid styles' still fires people for missing deadlines and promotes people who hit targets — the standard they actually apply when it counts is not the relativism they preach."
critical-questions:
  - "Is this always a genuine inconsistency, or can a sophisticated relativist coherently say 'my own claim about relativism is itself only relatively true, and that's fine' without contradiction — does Merton's test only catch relativists who implicitly claim their own theory is exempt, not ones who explicitly accept it isn't?"
  - "How far can this generalize beyond Sorokin's specific case — is 'watch what standard someone actually defers to when their own preferred systems conflict' a reliable diagnostic across contexts, or does it only work cleanly when the theorist is unusually explicit about their own method, as Sorokin happens to be here?"
status: active
