id: lex-cpeee
name: exploit-greed-by-offering-an-unverified-substitute-at-the-moment-of-pursuit
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When facing an opponent driven by appetite and actively pursuing something, don't try to block the pursuit directly -- offer a plausible-looking substitute for what they're chasing, timed to arrive exactly when their eagerness is highest and their willingness to pause and verify is lowest. In Eastman's telling, Unktomee intercepts Eya, a monstrous glutton actively hunting a fleeing village, and doesn't fight or outrun him. Instead he redirects the pursuit's own hunger: 'Why not rest a little now, and refresh yourself with the delicacy that I have prepared for you? See, these are human ears, nicely dried for your meal!' The offering is a heap of mussel shells, nothing like the food it's presented as -- but Eya, mid-chase and ravenous, doesn't inspect it: 'The greedy monster was deceived, and hastily swallowed the shells, which caused him such distress that he was helpless.' The trick depends entirely on timing, not cleverness of disguise -- mussel shells wouldn't survive calm scrutiny as human ears for a moment, but offered to a hungry pursuer at the exact instant he expects to be rewarded for the chase, verification is the one thing he has no patience left for. Diagnostic move: when trying to stop someone driven by appetite or urgency from reaching their actual target, look for the moment their eagerness peaks -- right as they expect to finally get what they're chasing -- and offer a substitute then, since a decoy that would never survive calm inspection can still work perfectly against someone whose hunger has already decided the outcome before they've looked closely."
