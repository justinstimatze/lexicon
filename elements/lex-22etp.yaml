id: lex-22etp
name: postels-law
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When designing a protocol or interface, surface Postel's law — be conservative in what you send, liberal in what you accept; the asymmetry buys interoperability across implementation variance, at some cost to spec strictness."
related: [lex-jv983, lex-9akfh, lex-gfb9k, lex-br4uk, lex-sp7fa, lex-v8dgj]
scaffolds-from: [lex-gfb9k]
evokes: [be-strict-in-output-be-lenient-in-input, asymmetric-tolerance-at-interface-boundary, protocol-survives-implementation-variation, accept-any-input-you-can-interpret, liberal-acceptance-as-bug-masking-risk]
lineage:
  - source: practitioner
    text: postel-1980-rfc760-internet-protocol
    citation: "Jon Postel (ed.), RFC 760 'DOD Standard Internet Protocol' (Information Sciences Institute, USC, January 1980), §3.2 'Discussion'. The first appearance of the principle in IETF-standards literature, applied to the Internet Protocol. RFC 760 is an IETF Request for Comments, governed by the IETF IPR rules; pre-2008 RFCs are freely redistributable. Verified verbatim from https://www.rfc-editor.org/rfc/rfc760.txt 2026-05-20 ((local copy); §3.2 'Discussion' at the IP-spec text). The atom: in a multi-implementer ecosystem where different parties build interoperating components, adopt an asymmetric posture — strict on what you emit, tolerant of what you receive. The asymmetry preserves protocol-level interoperability across implementation drift"
    quote: "The implementation of a protocol must be robust. Each implementation must expect to interoperate with others created by different individuals. While the goal of this specification is to be explicit about the protocol there is the possibility of differing interpretations. In general, an implementation should be conservative in its sending behavior, and liberal in its receiving behavior. That is, it should be careful to send well-formed datagrams, but should accept any datagram that it can interpret (e.g., not object to technical errors where the meaning is still clear). [§3.2 — the first formulation, applied to IP. The phrase 'must be robust' opens the discussion; the conservative/liberal asymmetry follows; the vital qualifier is 'any datagram that it can interpret' — liberal acceptance is bounded by interpretability, not unbounded.]"
  - source: practitioner
    text: postel-1980-rfc761-tcp
    citation: "Jon Postel (ed.), RFC 761 'DOD Standard Transmission Control Protocol' (Information Sciences Institute, USC, January 1980), §2.10 'Robustness Principle'. The canonical short formulation. RFC 761 was superseded by RFC 793 (September 1981) but contains the principle in the same form. Verified verbatim from https://www.rfc-editor.org/rfc/rfc761.txt 2026-05-20 ((local copy); §2.10 explicitly titled 'Robustness Principle'). This is where the principle gets its now-canonical short form and its widely-cited name"
    quote: "2.10. Robustness Principle: TCP implementations should follow a general principle of robustness: be conservative in what you do, be liberal in what you accept from others. [§2.10 — the canonical short-form formulation, with the explicit section-title 'Robustness Principle' that gives the principle its name in subsequent literature.]"
  - source: practitioner
    text: postel-1981-rfc793-tcp-current-spec
    citation: "Jon Postel (ed.), RFC 793 'Transmission Control Protocol' (Information Sciences Institute, USC, September 1981), §2.10 'Robustness Principle'. RFC 793 supersedes RFC 761 and is still the operating TCP specification (modulo errata and later RFCs that extend rather than replace it). The §2.10 text is identical to RFC 761's in canonical form, with only modal-verb tightening ('will follow' instead of 'should follow'). Verified verbatim from https://www.rfc-editor.org/rfc/rfc793.txt 2026-05-20 ((local copy); §2.10 'Robustness Principle'). Citing this RFC is the convention because it is the surviving spec; the principle is also restated later in the document (§3.10 'Event Processing') as 'The robustness principle dictates that...'"
    quote: "2.10. Robustness Principle: TCP implementations will follow a general principle of robustness: be conservative in what you do, be liberal in what you accept from others. [§2.10 — surviving TCP-spec form; the modal-verb shift from 'should follow' (RFC 761) to 'will follow' (RFC 793) reflects normative tightening as the principle entered standards-track use.]"
  - source: practitioner
    text: postels-law-mining-pass-1
    citation: "promoted from cross-attestation: protocol design (HTTP parsers historically accept malformed line-endings and case-insensitive headers — Postel-tolerance built into the format; JSON parsers split on this axis, with strict parsers like Go's encoding/json rejecting trailing commas while lenient parsers like JavaScript's eval-then-parse accepted them, producing the canonical Postel debate in JSON-the-data-language; XML parsers were architected from day one in opposition to Postel — Tim Bray's 'XML is the cure for HTML' framing was specifically anti-tolerance), API design (Stripe API versioning + GitHub API parameter coercion both lean Postel — accept reasonable variations on input shape; the contrast is gRPC's strict-schema posture which rejects malformed at the wire-format layer), distributed-systems engineering (the principle's surface area is largest when you cannot control all implementations of your protocol — internal-only APIs can be stricter because you can fix the misbehaving client; public-facing protocols typically lean Postel because you cannot), interpersonal communication (the maxim 'be precise in what you say, charitable in what you hear' is a direct interpersonal port of Postel — same asymmetric-tolerance shape at the conversation interface), AI alignment / RLHF (training a model to be strict in output format while accepting messy input is canonical Postel; the failure mode where models silently 'correct' malformed input and proceed with a hallucinated interpretation is the canonical Postel critique applied to AI systems). Cross-domain attestation across protocol design, API design, distributed systems, interpersonal communication, and AI engineering"
canonical-instances:
  - "the original Internet Protocol design context: ARPANET-era hosts running different operating systems (TENEX, ITS, Multics, Unix, VMS) needed to interoperate over a single packet protocol. Strict-output / liberal-input was the only viable posture because no central authority could enforce conformance across a heterogeneous host population. Postel codified the implicit working practice into a principle. The principle then transferred from network protocols to file formats, programming-language standards, and beyond"
  - "HTTP parsers as the canonical software-engineering instance: nearly all production HTTP parsers accept lowercase headers, missing trailing CRLF on the last header, slightly malformed Content-Length, and other technical errors-that-don't-block-interpretation. Strict parsers (e.g. some hardened reverse proxies) reject such requests; the rejection rate measurably exceeds the bug-detection benefit when the parser sits in front of mass-market clients. Postel's posture won in production HTTP; strict-rejection won at security-critical edges (header smuggling defenses)"
  - "the interpersonal port — 'be precise in what you say, charitable in what you hear': same asymmetric-tolerance structure applied to conversation. Strict-output discipline: don't be sloppy with phrasing, don't assume the listener will fill in your gaps. Liberal-input discipline: when the speaker is sloppy, model what they meant rather than rejecting them for surface mismatches. Couples well with lex-c2bwy hanlons-razor — both push toward charitable interpretation, but hanlons-razor is about attribution (motive-modeling) while Postel-in-conversation is about acceptance (interpret-then-respond)"
  - "operational complement to lex-gfb9k via-negativa: via-negativa says 'prefer subtraction over addition'; Postel-output says 'subtract everything not strictly required from what you emit.' Strict-output is via-negativa applied at the interface boundary. The pair: lex-gfb9k is the general subtraction discipline; Postel-output is the specific instance of it at protocol edges. Liberal-input is the inverse direction (additive tolerance), so Postel-as-a-whole pairs via-negativa with its complement — subtract from output, expand from input"
  - "operational complement to lex-9akfh decoupling-via-indirection: decoupling-via-indirection says 'introduce a layer between sender and receiver to absorb change.' Postel's Law is a different decoupling mechanism — instead of an indirection layer, build the tolerance directly into receiver semantics. The two are alternatives at the protocol-design level: indirection-layer (heavyweight, can do format-translation) vs. liberal-input (lightweight, only handles within-format tolerance). Mature systems often use both"
  - "central critical question: does Postel's Law SCALE OVER TIME? The IETF's RFC 9413 (Thomson & Iyengar 2023, 'Maintaining Robust Protocols') argues that liberal-input is harmful at ecosystem-time-scale: malformed implementations accumulate when they're tolerated, eventually becoming part of the de-facto protocol; the strict parser that does what the spec says becomes the broken one. The HTML rendering history is the canonical evidence — quirks-mode accumulated for two decades because browsers were Postel-liberal, and the cleanup cost (HTML5 specification of error-recovery behavior) was enormous. Postel's Law is correct at moment-of-deployment under strong-implementer-population heterogeneity; it may be wrong at ecosystem-time-scale because tolerance creates evolutionary pressure FOR malformed-implementation drift. The atom's correct posture is: deploy Postel-liberal when you cannot control the implementer population; switch to strict-rejection in environments where the spec can be enforced (internal APIs, version-locked clients, security-critical interfaces)"
  - "critical edge case — when liberal acceptance masks upstream bugs: if your receiver silently accepts malformed input and proceeds with an interpretation, the upstream sender never learns that they're emitting malformed output. The bug accumulates in the sender, undetected. The corrective is to log+accept rather than silently-accept — preserve the interoperability benefit while preserving the bug-detection signal. The atom's pairing with lex-jv983 fluency-trap is precisely here: 'liberal acceptance' produces fluent-feeling success when input is malformed, masking the error. The mitigation is to track the acceptance-of-malformed as a signal, not to suppress it"
  - "pivotal edge case — bounded vs. unbounded liberality: Postel's RFC 760 phrasing is 'accept any datagram that it CAN INTERPRET' — liberality is bounded by interpretability, not unbounded. The misuse is interpreting Postel as 'accept anything' or 'guess the user's intent.' The bound matters: if you cannot interpret the input under the protocol, reject it; the principle is about charity toward DIFFERING interpretations of the spec, not toward arbitrary input. AI systems frequently violate this bound by 'best-effort' interpretation of inputs that should produce a clean error"
critical-questions:
  - "are you being conservative-in-output without being liberal-in-input, in which case you've just made integration harder?"
  - "what's the cost of accepting malformed input — buffer overflow, parse confusion, security hole? Postel's law has predictable failure modes"
  - "is the asymmetry expensive on your side, and is that cost worth the gained interoperability?"
  - "if the protocol calcifies around the liberal-acceptance behavior, can you ever tighten it later (lex-br4uk)?"
status: active
