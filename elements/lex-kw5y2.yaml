canonical-instances:
  - "the grift/heavy-rackets professional boundary in Maurer's The Big Con: con men, pickpockets, and other grifters are a distinct professional caste from violent criminals, precisely because the grift's entire method depends on the mark's own voluntary, uncoerced participation — a grifter who used force would not be doing the same job more roughly, he would have left the profession entirely."
  - "multi-level-marketing recruitment: the scheme structurally requires each recruit to buy in and recruit others of their own free will — coercing a recruit would both constitute a different crime and destroy the genuine enthusiasm the pitch depends on to recruit the next tier."
  - "phishing and social-engineering attacks: the attacker must get the target to voluntarily click a link, type a password, or authorize a transfer — a coerced action would leave different forensic and legal traces, and would require an entirely different (and riskier) attack methodology than deception does."
critical-questions:
  - "how does this differ from lex-9pubz (concealment-of-intentions removes counterparty window for counter-prediction)? lex-9pubz is about whether the actor's INTENTIONS are hidden from the target. This atom is about a separate axis entirely — whether the target's PARTICIPATION is voluntary or coerced — which is independent of concealment: a scheme could in principle disclose its rules openly to a mark who half-suspects a con yet still voluntarily plays along (some short cons work exactly this way), and would still be an instance of this atom without depending on concealment at all. Concealment and voluntary-uptake are separable design axes that frequently co-occur in practice but are not the same mechanism."
  - "isn't nearly all crime nominally in the criminal's self-interest — why does THIS specific boundary matter? Because the boundary named here is about MECHANISM, not motive: the taxonomy Maurer's own underworld subjects use (grift vs. heavy-rackets) shows that professional criminals themselves treat voluntary-versus-coerced extraction as a hard technical dividing line, not a matter of degree. The required skills, professional reputations, and downstream consequences (legal exposure, victim report-rates, victim psychology) differ categorically depending on which side of that line a given scheme falls, which is why the underworld maintains the distinction as a matter of professional identity rather than moral gradation."
  - "does this mean coercion-based crime is simply cruder or less sophisticated than the grift? No — the atom names a structural trade-off, not a ranking: violence is faster and doesn't require the elaborate machinery (roping, convincing, cooling out) that voluntary-uptake schemes need, but it forfeits exactly the properties voluntary schemes buy — deniability, low report rates, absence of coercion-evidence, and the victim's own complicity discouraging pursuit. Each family optimizes for a different risk-and-effort profile; the grift's characteristic design choices only make sense once you see they all exist to protect the voluntary-uptake requirement this atom names."
