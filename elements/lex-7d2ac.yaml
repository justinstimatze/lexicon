    quote: "“The approach has been an integral component of what goes by the name of ‘rational choice theory’, which makes the self-interest approach rational by definition -- a kind of conquest by nomenclature. By giving the name ‘rational choice’ to some specific kind of behaviour there is an implicit attempt to avoid any disputation on whether that kind of behaviour can actually be seen as rational. It rides roughshod over the fact that the long-used term ‘rationality’ has antecedent meanings -- or at least established associations -- which cannot be erased merely by a new definition.”"
canonical-instances:
  - "Hypothetical: A logistics company brands its policy of always choosing the cheapest available shipping option as 'smart routing.' Once the label sticks, a manager who pays slightly more for a carrier with a far better damage record is filed as making a 'less smart' choice, even though nobody ever argued that minimizing shipping cost is actually what the company should be optimizing for."
  - "Hypothetical: A diet plan calls its restrictive eating pattern 'clean eating.' Anyone eating outside the plan's rules is now, by the vocabulary alone, eating 'unclean' -- a value judgment smuggled into the name before any nutritional argument about that particular food has been made."
critical-questions:
  - "Isn't this too broad a suspicion -- don't all technical fields coin specialized terms that depart from everyday usage, without that being dishonest? Coining a term is fine when the field flags the departure and argues for it. The problem Sen names is specific: reusing a word that already carries a strong general endorsement (rational, healthy, natural), attaching it to one narrow behavior, and then treating anything outside that behavior as having lost the endorsement -- without ever making the case that the endorsement belongs there."
  - "How would you even argue about rationality without adopting some definition first -- doesn't every position have to pick a working definition to get started? Yes, and Sen isn't objecting to definitions as such -- he's objecting to a definition that gets used to end the argument rather than open it. A definition stated and defended invites the question of why anyone should accept it; naming the same definition 'rational choice theory' tends to carry it past that question without anyone noticing it was skipped."
