    quote: "O king, when people hail us by the name Of holy, we must make our acts the same: We must not waver nor fall short of it; We must take up the yoke for very shame. \"O king, this name has been bestowed on me: To-day they cry how holy I must be: Therefore I would a hermit live and die; I have no taste for joy and revelry."
canonical-instances:
  - "Someone whose name gets misspelled on a conference badge as a job title they don't actually hold spends the rest of the event acting the part rather than correcting it, and comes home having decided to actually pursue that role for real."
critical-questions:
  - "Is there a meaningful difference between this and ordinary self-fulfilling prophecy, or does the specifically voluntary and conscious nature of the ratification — he chooses to treat the accident as binding, nobody pressures him into it — make this a genuinely different mechanism from social-labeling effects that operate on someone without their active participation?"
  - "Would the same move work for an unwanted or shameful accidental label, or does it depend on the label being something the person would be glad to live up to if it were true — is 'ratify the accident' actually just a permission structure for a change someone already wanted?"
