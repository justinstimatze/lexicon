canonical-instances:
  - "A board ignores a distrusted executive's forecast and green-lights a project despite it, and when the project quietly succeeds anyway, the executive doesn't feel vindicated -- they start updating their resume, correctly reading the board's success as evidence that their own judgment has just been publicly discredited and that they're now more disposable, not less."
  - "A trusted, senior engineer's confident architecture recommendation is followed and the system fails in production; the team doesn't just fix the bug, it quietly starts second-guessing every other call that engineer has made, and the engineer starts overexplaining routine decisions, because the failure didn't just cost the company an outage, it broke a reputation everyone had been relying on."
critical-questions:
  - "does this pattern assume the outcome is legible enough for everyone to agree on who was actually right -- in real organizations, is credit and blame for outcomes usually clear enough for a trust-map violation to register cleanly, or is it typically contested and reinterpreted after the fact in ways that blunt this dynamic?"
  - "is the destabilizing reaction in the 'vindicated but distrusted' cell actually rational self-preservation by the advisor, or could it just as easily be interpreted as the advisor projecting a threat that never materializes -- does the framework risk encouraging paranoia in people whose ignored advice happens to work out?"
  - "how does this generalize to situations with more than two reputational categories (not just trusted vs. untrusted, but a spectrum of partial trust) -- does the clean four-cell stabilize/destabilize split hold up, or does a more graded trust landscape produce more graded and less predictable reactions to a surprising outcome?"
