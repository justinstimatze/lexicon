    quote: "'Ho!' cried the others, 'he could not fight, this one!' ... 'Ho!' hooted the others, 'he could not fight, this one!' ... 'You see this!' said the four, 'this one could not fight.'"
canonical-instances:
  - "A startup's founding team loses members to burnout, a co-founder dispute, and a family emergency over its first year, and the remaining founders treat each departure as proof the company is filtering down to only the truly committed, rather than asking whether the pace and conditions that caused each departure are also a warning sign about the venture's actual viability."
  - "A group of climbers attempting a dangerous peak loses two members to altitude sickness and one to a twisted ankle on the approach, and the remaining climbers, framing each turnaround as the weaker members 'not being cut out for it,' push on with more confidence rather than less, even though none of the departures actually tested anything about the technical climb still ahead."
critical-questions:
  - "is there ever a legitimate version of this pattern, where early attrition genuinely does filter for real fitness -- how does an observer distinguish a meaningful selection process from this false one, where the elimination criteria are simply unrelated to the actual challenge?"
  - "does naming this bias in the moment actually change behavior, or is the psychological pull to interpret survival as validation strong enough that groups will keep making this error even when it's been explicitly pointed out to them?"
  - "who benefits from the survivors' rising confidence being wrong -- does someone (a leader, an organizer) have an incentive to encourage this misreading specifically because it keeps the venture moving forward despite mounting evidence it shouldn't?"
