id: lex-v5dhf
name: redefining-wretchedness-by-conduct-flips-the-insult-back
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Rather than dispute the facts an insult points to, you can dispute the criterion the insult assumes — relocate what the key term actually measures, and the same facts that were meant to condemn you can condemn the speaker instead. In the Jataka's tale of Sonaka, king Arindama calls the meditating ascetic a wretched Brother, pointing to his shaved head and bare robe as evidence. Sonaka does not deny the appearance; he replaces the king's criterion for wretchedness, material circumstance, with his own, moral conduct, and the reversal is immediate: \"He is no wretched wight / Who in his every action, Sire, has aye attained to right. / Nay rather wretched those who right neglect and practise ill, / For evil doer evil doom is destined to fulfil.\""
related: []
evokes: [jataka, satthinipata, sonaka-jataka, relocating-the-criterion-for-an-insult, reframing-conduct-over-circumstance]
lineage:
  - source: primary
    text: jataka-francis1905-sonaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XIX (Satthinipata), No. 529, Sonaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "He is no wretched wight / Who in his every action, Sire, has aye attained to right. / Nay rather wretched those who right neglect and practise ill, / For evil doer evil doom is destined to fulfil."
canonical-instances:
  - "A junior employee is mocked in a meeting for still renting at their age by a senior colleague who owns three properties financed by debt he can't actually service. Rather than defend the rental, the employee redefines financial wretchedness as being asset-rich and solvency-poor, and lets the room do the arithmetic on who that actually describes."
  - "A critic calls an indie film amateur for its small budget. The director responds by redefining amateurism as indifference to craft rather than absence of money, and points to the critic's own big-budget picks that reused the same three shot compositions for two hours."
critical-questions:
  - "Sonaka's redefinition works because his own conduct genuinely holds up under the new criterion he's proposing — does this move require that the speaker actually can survive the scrutiny of their own substituted standard, or does it work even when the redefinition is a bluff nobody checks?"
  - "The king accepts the reversal without resistance in this telling — what happens when the original insulter refuses to accept that the criterion has changed, and simply repeats the original insult on its original terms?"
status: active
