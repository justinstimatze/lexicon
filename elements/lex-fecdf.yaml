id: lex-fecdf
name: inconceivability-mistaken-for-impossibility
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you can't imagine something, you may mistake inconceivability for impossibility. Most expanded conceptual capacities revealed previous inconceivability as imaginative limit, not reality limit. Test by asking 'is this inconceivable in principle, or only in my current concepts?'"
related: [lex-2s3ze, lex-aysgg, lex-jv983, lex-q8pxm, lex-qkrey, lex-rcj6y, lex-t9fs7, lex-u5869, lex-v6nqz, lex-znaau]
evokes: [argument-from-inconceivability, cant-imagine-it-so-it-cant-be, limits-of-my-mind-mistaken-for-limits-of-nature, subjective-faculty-projected-onto-objective-world, this-is-too-weird-to-be-true, antipodes-impossible-because-unimaginable, gravity-at-distance-too-absurd, ex-nihilo-nihil-fit-as-faculty-limit, intuition-overruling-evidence, conceivability-as-evidence-of-possibility-and-its-inverse]
lineage:
  - source: primary
    text: mill-1843-book-v-ch-iii-fallacies-of-simple-inspection
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843; final 8th ed. 1872). (Project Gutenberg #27942). Book V Ch.III 'Fallacies Of Simple Inspection; Or A Priori Fallacies', §§2-3. Mill's central claim (which he calls the cause of 'two-thirds of the bad philosophy... which the human mind has never ceased to produce'): people routinely treat properties of their own conceptive faculty as properties of the world. The fallacy has two symmetrical forms: (i) 'things which we cannot think of together cannot co-exist' (positive: inability-to-imagine → impossibility-in-fact), and (ii) 'things which we cannot help thinking of together must co-exist' (its mirror: necessity-of-imagining → necessity-in-fact). Mill enumerates the historical cases where the fallacy was decisively refuted: the medieval/early-modern conviction that antipodes were impossible (because one could not picture people standing with heads opposite); the Cartesian rejection of Copernican astronomy on the grounds that the void-space between bodies was inconceivable; Newton's own struggle (in the famous Bentley letter quoted by Mill) with action-at-a-distance as 'so great an absurdity that I believe no man, who in philosophical matters has a competent faculty of thinking, can ever fall into it'; the scholastic maxim 'a thing cannot act where it is not' which the Cartesians wielded against Newtonian gravitation. Mill's diagnostic: the fallacy's signature is the move from a faculty-limit ('I cannot conceive X') to a world-claim ('X cannot be true'). PD globally (Mill d.1873)."
    quote: "[Mill 1843 Book V Ch.III §3 lines 27065-27076]: 'I am indeed disposed to think that the fallacy now under consideration has been the cause of two-thirds of the bad philosophy, and especially of the bad metaphysics, which the human mind has never ceased to produce. Our general ideas contain nothing but what has been put into them, either by our passive experience, or by our active habits of thought; and the metaphysicians in all ages, who have attempted to construct the laws of the universe by reasoning from our supposed necessities of thought, have always proceeded, and only could proceed, by laboriously finding in their own minds what they themselves had formerly put there, and evolving from their ideas of things what they had first involved in those ideas.' [Mill Book V Ch.III §3, lines 27137-27155, on Newton-Bentley]: 'This passage [Newton to Bentley on inanimate matter and action-at-a-distance] should be hung up in the cabinet of every cultivator of science who is ever tempted to pronounce a fact impossible because it appears to him inconceivable. In our own day one would be more tempted, though with equal injustice, to reverse the concluding observation, and consider the seeing any absurdity at all in a thing so simple and natural, to be what really marks the absence of a competent faculty of thinking.' [Mill Book V Ch.III §3, lines 27193-27199, on the doubled error]: 'Not content with assuming that nothing can be true which we are unable to conceive, scientific inquirers have frequently given a still further extension to the doctrine, and held that, even of things not altogether inconceivable, that which we can conceive with the greatest ease is likeliest to be true.'"
canonical-instances:
  - "Antipodes-impossibility canonical case (Mill Book V Ch.III §3, lines 27085-27095): the medieval/early-modern argument that people on the antipodal side of a spherical earth cannot exist because one cannot picture humans with heads 'in the same direction as our feet'. The fallacy is the move from 'I cannot conceive antipodes' to 'antipodes cannot exist.' Resolved when explorers actually reached antipodal latitudes and reported no falling-off, demonstrating that the conceptive-limit was a property of the imaginer, not of the world. The case stands as Mill's paradigm — a confident impossibility-verdict backed by nothing but inability-to-picture, decisively overturned by evidence."
  - "Newton-Bentley letter on action-at-a-distance canonical case (Mill Book V Ch.III §3, lines 27128-27155): Newton wrote to Bentley that 'gravity should be innate, inherent, and essential to matter, so that one body may act on another, at a distance, through a vacuum, without the mediation of any thing else, by and through which their action and force may be conveyed from one to another, is to me so great an absurdity that I believe no man, who in philosophical matters has a competent faculty of thinking, can ever fall into it' — and yet the action-at-a-distance interpretation eventually won. Mill explicitly names this as the canonical case where even an exceptionally competent thinker fell into the inconceivability-fallacy. The case is doubly diagnostic: it shows the fallacy can grip top minds, AND it shows that 'absence of a competent faculty of thinking' (Newton's phrase) often correctly names the failure to overcome an inconceivability-prejudice."
  - "Vacuum-impossibility canonical case (medieval physics): the scholastic 'horror vacui' doctrine — nature abhors a vacuum — rested on the inconceivability of empty space (everything must be something). Torricelli 1643 and Pascal 1648 (Puy-de-Dôme barometer experiment) supplied the empirical refutation. The fallacy persisted in Cartesian physics (Descartes denied vacuum on conceptual grounds) and required experimental decision. The pattern: an a-priori-impossible move surrenders to evidence once the experiment is designed."
  - "Quantum-mechanics-as-inconceivable canonical case (Einstein 1935 EPR + sequelae): Einstein's lifelong objection to quantum nonlocality and indeterminism rested on appeals to inconceivability — 'God does not play dice with the universe', the 'spooky action at a distance' charge against entanglement. Bell 1964 demonstrated that local hidden-variable theories make different predictions from quantum mechanics; Aspect 1982 and subsequent loophole-free experiments (Hensen et al 2015; Giustina et al 2015; Shalm et al 2015) ruled out local realism. The Einsteinian inconceivability-argument was Mill-fallacy-shaped — appeal to classical intuition as evidence against a microphysical claim with empirical support. The contemporary practitioner-application: when an expert objects to a theoretical claim primarily on the grounds that it 'doesn't make sense' or 'isn't intuitive', check whether the objection adds any non-inconceivability content beyond the faculty-report."
  - "Continental-drift-impossibility canonical case (Wegener 1912 → plate tectonics ~1962): Wegener's continental-drift hypothesis was rejected for fifty years largely on the inconceivability of rock-continents moving through rock-seafloor. The fallacy was: I cannot imagine the mechanism, therefore no such mechanism exists. Hess 1962 (seafloor spreading) + Vine-Matthews 1963 (magnetic-stripe confirmation) supplied the mechanism. The pattern: inconceivability-of-mechanism wrongly inferred to imply impossibility-of-phenomenon; the empirical evidence for the phenomenon should have been weighted independently of the mechanism-conceivability."
  - "Non-Euclidean-geometry canonical case (Lobachevsky 1829 → Riemann 1854 → Beltrami 1868 → Einstein 1915): for ~2200 years the parallel postulate was treated as self-evidently true because its denial was inconceivable. The 19th-century constructions of consistent non-Euclidean geometries (where parallels can converge or diverge) demonstrated that the postulate's denial was conceivable-once-modeled — the inconceivability was a property of the unaided imagination, not of mathematical possibility. The case is unusually clean: a 2200-year inconceivability-prejudice resolved by the construction of an existence-proof. Practitioner-lesson: a faculty-limit ('cannot picture X') may dissolve under the right model or notation; the absence of a model is not the absence of a possibility."
  - "Ex-nihilo-nihil-fit fallacy canonical case (Mill Book V Ch.III §3, lines 27164-27176): the scholastic maxim that 'nothing can come from nothing' rested on the inconceivability of creation-from-void. Mill explicitly notes that the maxim may simply be one of the limitations of human imagination, not a feature of nature. Modern cosmology (vacuum fluctuations in quantum field theory; Hawking 1988 *A Brief History of Time* on the no-boundary proposal) treats 'something from nothing' as an open empirical question rather than a settled impossibility. The Mill-warning applies: appeal to ex-nihilo-nihil-fit as an a-priori argument against creation-cosmologies is an inconceivability-fallacy until conjoined with positive evidence."
  - "operationally distinct from lex-jv983 fluency-trap: lex-jv983 names POSITIVE-direction (ease-of-processing → truth); lex-fecdf names NEGATIVE-direction (inability-to-process → impossibility). Sibling-atoms sharing meta-infrastructure (cognitive-property-projected-onto-world) but cutting different operational targets. Practitioner-discrimination: lex-jv983 fires when a fluent claim feels true; lex-fecdf fires when a difficult-to-imagine claim feels impossible. The Mill diagnostic (lines 27193-27199) treats the fluency-direction as a 'further extension' of the inconceivability-direction; both belong to the same meta-pattern but the operational interventions differ."
  - "operationally distinct from lex-znaau premature-closure: lex-znaau names closing-on-first-plausible-candidate-and-stopping-the-search; lex-fecdf names judging-impossible-because-unimaginable. Adjacent but different: lex-znaau is about not-searching-further; lex-fecdf is about ruling-out-via-a-priori-faculty-report. They can compose (premature closure on the inconceivability-verdict is doubly-bad) but the operational target differs."
  - "operationally distinct from lex-u5869 chestertons-fence: lex-u5869 names assume-existing-arrangement-has-a-reason-before-removing-it; lex-fecdf names don't-conclude-a-thing-is-impossible-from-an-inability-to-imagine-it. Different vectors: lex-u5869 is a conservative-bias prescription against destructive removal; lex-fecdf is an anti-conservative prescription against impossible-ruling-out of novel claims. They share a 'don't trust your immediate intuition' structure but pull in opposite operational directions — lex-u5869 protects what exists from your impatient intuition; lex-fecdf protects what does-not-yet-exist-in-your-imagination from your dismissive intuition."
critical-questions:
  - "what's the discrimination from 'reasonable skepticism about extraordinary claims'? Sagan's dictum — 'extraordinary claims require extraordinary evidence' — is not the lex-fecdf fallacy; it's the appropriate calibration of evidential standard to prior-improbability. The fallacy is the move from 'inconceivable to me' to 'impossible'; the appropriate move from 'extraordinary' is to 'demand more evidence'. Diagnostic: ask whether the rejecter is invoking insufficient evidence (defensible) or invoking inability to imagine the claim (the fallacy). If 'I just can't see how that could work' is the substantive argument, the fallacy is in play."
  - "does the historical batting-average prove the fallacy is always wrong? No — sometimes inconceivability tracks impossibility (you cannot imagine 2+2=5 because it's actually false). The fallacy is the unwarranted-confidence move, not the existence of any inconceivability-impossibility correlation. Practitioner: when inability-to-imagine occurs, treat it as a hypothesis-generator about possible obstacles, not as a verdict on the claim. The diagnostic question: 'what would have to be true for this to be possible, and what evidence would I accept?' — this is the anti-fallacy stance."
  - "what's the practitioner-actionable upshot? When someone says 'I just can't see how that could be true', register the move as a faculty-report not a world-report, and ask for the substantive objection. When you yourself feel the impossibility-pull, perform the Newton-Bentley reflex: name a historical case where an inconceivability-prejudice was later overturned by evidence (gravity-at-distance, antipodes, non-Euclidean geometry, vacuum, continental-drift, quantum-nonlocality) and ask whether the present case might be similar. The reflex is not a proof that the present claim is true — it's a circuit-breaker against confusing your faculty-limits with the world's possibility-space."
  - "does this atom recommend credulity? No. It recommends decoupling the verdict-on-possibility from the report-of-inability-to-imagine. The appropriate move on an unimaginable claim is to suspend the impossibility-verdict, look for evidence, and treat the imagination-failure as a feature of one's own cognitive equipment rather than a probative argument. Most unimaginable claims will still turn out to be false — but they should be ruled false on substantive grounds, not on faculty-reports."
  - "where does this compose with other atoms? lex-fecdf + lex-jv983 fluency-trap together cover the bidirectional cognitive-state-as-world-property fallacy. lex-fecdf + lex-u5869 chestertons-fence form a balanced prescriptive pair: don't remove what exists merely because you can't see its purpose (lex-u5869), and don't reject what's claimed merely because you can't see its mechanism (lex-fecdf). lex-fecdf + lex-znaau premature-closure together cover the not-searching-further failure: premature-closure on a possibility-space because the alternative was deemed inconceivable. lex-fecdf + lex-v6nqz (Mill eliminative-paired-comparison) form a Mill-internal pair: Book III gives the inductive method for what to BELIEVE; Book V Ch.III gives the diagnostic for what NOT to disbelieve a priori."
status: active
