id: lex-xwq46
name: a-real-time-public-itemized-accounting-of-a-fulfilled-obligation
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "As each part of a larger obligation is performed, a person can address the party who imposed it directly and out loud, stating specifically what was given and that it has now been passed on -- auditing the debt piece by piece in public as it's discharged, rather than declaring the whole thing complete only at the end. At each of the four quarters of the horse dance, Black Elk stops and reports, item by item, to the specific Grandfather who granted that piece of the vision: 'Grandfather, behold me! What you gave me I have given to the people -- the power of the healing herb and the cleansing wind. Thus my nation is made over. Hear and help me!' He repeats the structure at the east and south with different specific items -- wisdom, the flowering stick, the nation's hoop -- so that by the end of the dance, the entire promise has been verified in public, in installments, witnessed by the whole village rather than asserted as a single finished claim afterward."
related: []
evokes: [black-elk-speaks, horse-dance, grandfather-behold-me, what-you-gave-me-i-have-given-to-the-people, itemized-public-report]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch14-horse-dance
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 14, 'The Horse Dance.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "When I thus faced the north, I sent a voice again and said: 'Grandfather, behold me! What you gave me I have given to the people -- the power of the healing herb and the cleansing wind. Thus my nation is made over. Hear and help me!' And when we reached the east, and after the Grandfathers had sung, I sent a voice: 'Grandfather, behold me! My people, with difficulty they walk. Give them wisdom and guide them. Hear and help me!'"
canonical-instances:
  - "A project lead closing out a multi-phase grant reports to the funding committee after each milestone individually, stating exactly what was delivered against what was promised, rather than submitting one summary claim of full completion at the very end."
  - "An apprentice completing a formal guild training publicly demonstrates and names each specific skill mastered in front of the master craftsman as it's completed, rather than simply being declared qualified once the whole apprenticeship period has passed."
  - "A recovering addict working a structured program makes amends to each specific person harmed individually and by name, stating exactly what was done and what is now being repaired, rather than issuing one general statement of having changed."
critical-questions:
  - "Does breaking the report into four separate, itemized public statements actually make the fulfillment more verifiable to onlookers than a single closing statement would, or does the repetition mainly serve the performer's own sense of having discharged the obligation properly?"
  - "What would count as a failed or incomplete report at any one of the four stations -- is there a mechanism in this ritual for the community to reject or question a specific claim as the dance proceeds, or is each report accepted automatically once spoken?"
  - "Does addressing each Grandfather individually, rather than reporting once to all of them together, reflect a belief that each grant genuinely requires its own separate accounting, or is the four-part structure simply inherited from the vision's own four-quarter form regardless of whether separate reporting was ever necessary?"
status: active
