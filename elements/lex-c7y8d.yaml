name: the-marginalized-insider-covertly-helps-the-victim-while-performing-complicity
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When everyone in a powerful group is mocking or harming an outsider, look for the one member of that group who doesn't join in -- and notice that they usually aren't the group's most secure or highest-status member, but one who is themselves marginalized within it, and who helps covertly rather than objecting openly. In Zitkála-Šá's telling, when the bear cubs mock the starving badger for falling down, one cub doesn't laugh: 'He was the ugly cub... The hair was dry and dingy. It looked much more like kinky wool. He was the ugly cub. Poor little baby bear! he had always been laughed at by his older brothers.' His own experience of being an outsider inside his family is what produces his sympathy for a different outsider entirely -- but he doesn't act on it openly. He reasons explicitly that open advocacy would fail and cost him further standing: 'I shall not ask my father for meat to give away. He would say \"No!\" Then my brothers would laugh at me.' Instead, he performs ordinary belonging in public -- 'singing happily and skipping around his father at work' -- while using that exact performance as cover to secretly kick a piece of meat toward the badgers' hut on his way past, then immediately returns to his normal place in the group as if nothing happened. The mechanism has two parts working together: marginal status inside the powerful group produces the empathy that makes helping the outsider feel necessary, and that same marginal status is precisely why open defiance isn't a viable option, forcing the help to be covert, deniable, and folded into behavior that looks like unremarkable compliance. Diagnostic move: when looking for who might help a group's victim from the inside, don't look first at the group's most powerful or secure members -- look at whoever is already somewhat marginal within the group, since they're the ones most likely to feel kinship with the outsider, and expect any help they offer to come disguised as ordinary behavior rather than open dissent, since open dissent is the one option their own precarious position doesn't actually afford them."
