id: lex-k9ku5
name: plurality-of-causes-without-experiment-forces-deductive-verification
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When multiple causes could produce the effect and experiment is unavailable, surface Mill's plurality-of-causes problem — induction alone can't decide; deductive verification (derive expected differences from each cause, check against data) is required."
related: [lex-b6kvs, lex-bj7ak, lex-e9z2y, lex-eybad, lex-qkrey, lex-rfxtb, lex-v6nqz, lex-xbpmu]
scaffolds-from: [lex-rfxtb, lex-b6kvs, lex-v6nqz]
evokes: [cant-run-a-controlled-experiment, no-two-nations-alike-but-one-policy, too-many-intermixed-causes, eliminating-an-antecedent-doesnt-prove-it-didnt-contribute, observational-causal-inference-defeated, correlation-from-history-proves-nothing, deduce-from-laws-then-verify, open-system-causation, plurality-of-causes, the-deductive-method]
lineage:
  - source: primary
    text: mill-1843-book-vi-ch-vii-chemical-experimental-method
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843; final 8th ed. 1872). (Project Gutenberg #27942). Book VI Ch.VII 'Of The Chemical, Or Experimental, Method In The Social Science' (lines 31718-32018). Mill argues that the experimental/eliminative methods of Book III (Difference, Agreement, Concomitant Variations, Residues) cannot establish causation in domains where every effect is the joint product of a great plurality of inseparably-intermixed causes and no controlled experiment is possible. Note (§1): Mill is explicit that this is NOT an emergence/heteropathy problem — 'Men are not, when brought together, converted into another kind of substance... In social phenomena the Composition of Causes is the universal law' (so the defeater is distinct from lex-eybad). The defeaters he enumerates: (§2) no artificial experiments are possible — one can only watch spontaneous instances and cannot vary circumstances to suit elimination; (§3) the Method of Difference fails because no two complex instances tally in all but one circumstance ('Two nations which agreed in every thing except their commercial policy would agree also in that'); (§4) the Method of Agreement fails under Plurality of Causes — eliminating an antecedent is decisive 'only if the effect can have but one cause,' which social effects never do — and Concomitant Variations fails because each effect's quantity is 'the mixed result of all the agents'; (§5) the Method of Residues is not pure observation at all — it presupposes prior deduction. Mill's positive prescription: use the Concrete Deductive Method (Ch.IX) — derive tendencies from the known general laws of the component causes, then use observation to VERIFY, not to establish causation directly. The principle is domain-general (Mill illustrates with the tariff/national-prosperity debate). PD globally (Mill d.1873)."
    quote: "[Mill 1843 Book VI Ch.VII §3 lines 31838-31841]: 'But the supposition that two such instances can be met with is manifestly absurd. Nor is such a concurrence even abstractedly possible. Two nations which agreed in every thing except their commercial policy would agree also in that.' [Mill Book VI Ch.VII §4, lines 31908-31912]: 'That some one antecedent is the cause of a given effect, because all other antecedents have been found capable of being eliminated, is a just inference, only if the effect can have but one cause. If it admits of several, nothing is more natural than that each of these should separately admit of being eliminated.' [Mill Book VI Ch.VII §5, lines 31991-31993]: 'we may subtract the effect of one, two, three, or four causes, but we shall never succeed in subtracting the effect of all causes except one.'"
canonical-instances:
  - "Tariff-and-national-prosperity canonical case (Mill Book VI Ch.VII §§2-5, the running example): to prove by the Method of Difference that protectionism caused a nation's prosperity, one would need two nations alike in every circumstance except commercial policy — impossible, since 'Two nations which agreed in every thing except their commercial policy would agree also in that' (differences in policy are themselves effects of prior differences, opening unbounded further differences). The Method of Agreement fares no better: even if all prosperous nations shared only a restrictive policy, that proves causation 'only if the effect can have but one cause,' and national prosperity has countlessly many. Mill's verdict: the closest social-science imitation of a direct induction 'gives but a specious semblance of conclusiveness, without any real value.'"
  - "Method-of-Agreement-under-plurality canonical case (Mill Book VI Ch.VII §4, lines 31908-31927): when an effect admits of several causes, eliminating an antecedent in some instances does not show it was not instrumental in others — 'We can conclude that the effect is sometimes produced without it; but not that, when present, it does not contribute its share.' This is the precise logical reason eliminative inference fails under Plurality of Causes, and the substrate's anchor for the limits of observational causal claims."
  - "Concomitant-Variations-failure canonical case (Mill Book VI Ch.VII §4, lines 31929-31942): the method works only if different causes produce qualitatively different effects that can be tracked separately; but in social bodies 'every attribute... is influenced by innumerable causes,' the quantity of each effect is 'the mixed result of all the agents,' so the variation of the aggregate cannot bear a uniform proportion to any single component. Marker: when outcomes are scalar aggregates of many co-varying inputs, covariation with one input is uninformative about its contribution."
  - "Method-of-Residues-presupposes-deduction canonical case (Mill Book VI Ch.VII §5, lines 31972-31997): residues only works by subtracting the KNOWN effects of other causes — and those could not have been learned by specific experience (same impossibility), so they were learned by deduction from laws of human nature. Hence the genuinely operative method is deductive; 'we may subtract the effect of one, two, three, or four causes, but we shall never succeed in subtracting the effect of all causes except one.' The positive payload: establish causation deductively from component laws, use observation to verify."
  - "Modern observational-causal-inference instances: the structural/deductive tradition in econometrics (the Cowles Commission's identification program; Haavelmo 1944) treats causal claims as coming from theory plus verification rather than raw correlation; macroeconomics (no controlled experiments on whole economies → structural models + natural experiments, not naive cross-country regression); the 'credibility revolution' (Angrist-Pischke) use of instrumental variables / natural experiments as partial recoveries of the experimental variation history rarely supplies; epidemiology of multifactorial disease; climate attribution via deductive physical models verified against observation. Each re-confirms Mill's structure. Practitioner-translation: if you cannot randomize and the outcome has many intermixed causes, do not expect comparison-of-instances to establish causation — build the mechanism deductively and verify."
  - "operationally distinct from lex-b6kvs randomization-controls-for-unknown-confounders: lex-b6kvs is the experimental SOLUTION (randomize to neutralize even unknown confounders); lex-k9ku5 governs the case where no experiment or randomization is possible at all, so that solution is off the table and deduction-plus-verification is the remaining route. They are complementary: lex-b6kvs when you can manipulate; lex-k9ku5 when you cannot."
  - "operationally distinct from lex-v6nqz/0343 (Mill's eliminative methods): those atoms give the positive method for isolating a cause; lex-k9ku5 is their boundary — the conditions (uncontrollable plurality, no experiment) under which they cannot be applied — together with the deductive alternative. lex-v6nqz/0343 say how; lex-k9ku5 says when-not and what-instead."
  - "operationally distinct from lex-eybad emergent-effects-resist-decomposition: lex-eybad's obstacle is heteropathy (joint effects are qualitatively new); lex-k9ku5's obstacle is plurality-plus-inseparability-plus-no-experiment even when composition is mechanical. Mill explicitly classifies social phenomena under the Composition of Causes (mechanical), so lex-k9ku5 is not an emergence claim. The two are orthogonal failure-modes of causal analysis: emergence (can't sum the parts) vs uncontrollable plurality (can't isolate a part)."
critical-questions:
  - "isn't this just 'correlation is not causation'? It is the stronger, structural form of that maxim: it explains WHY observational comparison fails here (uncontrollable plurality of intermixed causes with no experimental variation) and prescribes the remedy (deduce tendencies from component laws, then verify) rather than merely warning. 'Get more data' does not fix it; only experimental control (lex-b6kvs) or deduction-plus-verification does."
  - "does it counsel against all non-experimental social science? No — Mill's positive move is the Concrete Deductive Method: derive consequences from the known general laws of the component causes, then use observation to VERIFY (and to estimate the unexplained residue), not to establish causation by raw comparison. The atom licenses theory-driven inquiry with empirical verification; it indicts only naive comparison-of-instances treated as crucial experiments."
  - "when does this apply rather than the eliminative methods or randomization? Apply lex-k9ku5 when BOTH (a) you cannot manipulate or randomize the system, AND (b) the outcome is the joint product of many causes acting inseparably on every instance with no clean natural variation. If you can randomize → lex-b6kvs. If the effect is plausibly single-caused and a clean contrast exists → lex-v6nqz/0343. The diagnostic question: 'could two instances differ in only the candidate cause?' — if structurally impossible, you are in lex-k9ku5 territory."
  - "isn't 'reason deductively' circular or unfalsifiable? Mill's explicit guard is that deduction must be VERIFIED against observation — the method is deduce-then-check, and a deduction whose consequences fail observational test is rejected. The danger he names is the opposite over-caution: refusing a-priori reasoning about one cause only forces you into as many separate a-priori reasonings as there are concurrent causes."
  - "how does it compose with other atoms? lex-k9ku5 + lex-v6nqz/0343: it marks the boundary of where the eliminative methods are licensed. lex-k9ku5 + lex-b6kvs: complementary halves of 'what to do about confounding' — randomize if you can, deduce-and-verify if you can't. lex-k9ku5 + lex-rfxtb multifactorial-frame: multifactoriality is the precondition that triggers lex-k9ku5's methodological consequence. lex-k9ku5 + lex-eybad: the two orthogonal reasons decomposition-and-compare can fail (emergence vs uncontrollable plurality)."
