evokes: [wegener-continental-drift, mechanism-came-fifty-years-later, the-pattern-is-too-coincidental, multiple-independent-attestations, kuhn-paradigm-shift, semmelweis-handwashing-without-germ-theory, marshall-warren-h-pylori]
lineage:
  - source: primary
    text: Wegener-1915-OriginOfContinentsAndOceans
    citation: "Alfred Wegener, *Die Entstehung der Kontinente und Ozeane* (1st ed. 1915, 3rd ed. 1922), J.G.A. Skerl 1924 Eng. trans. *The Origin of Continents and Oceans* (Methuen, London). chapters 1-2. Wegener's methodological move: he marshals MULTIPLE INDEPENDENT lines of evidence converging on continental displacement — (1) GEOMETRIC: the coastlines of South America and Africa match like puzzle pieces; (2) GEOLOGICAL: stratigraphic columns on opposite sides of the Atlantic match in age + lithology where the proposed-once-joined coasts meet; (3) PALEONTOLOGICAL: identical fossil species (*Mesosaurus*, *Glossopteris* flora) appear on now-separated continents that the Atlantic should have prevented from sharing; (4) PALEOCLIMATIC: coal deposits in Antarctica + glacial striations in equatorial Africa, India, Australia + tropical fossils in northern Europe imply prior continental positions far from current latitudes. The argument is: these independent evidence-streams ALL converge on the same conclusion (the continents have moved). Wegener's PROPOSED MECHANISM (tidal + centrifugal forces drifting continents through oceanic crust) was geophysically too weak — opponents focused on this and rejected the entire claim. The structural claim was VINDICATED ~50 years later when plate-tectonics + seafloor-spreading + paleomagnetism supplied the correct mechanism (mantle convection driving plate motion). The transferable claim is NOT continental-drift specifically; it is the methodological principle: when many independent evidence-streams converge, the claim should be accepted on the convergence; demanding a complete mechanism BEFORE accepting the claim conflates structural-warrant with mechanistic-explanation."
    quote: "[Wegener 1915 Chs. I-II, Skerl 1924 trans.:] Wegener Ch.I introduces the displacement hypothesis from geometric coastline-matching ('The first concept of continental drift... came to me as far back as 1910, when considering the map of the world, under the direct impression produced by the congruence of the coastlines on either side of the Atlantic'); Ch.II marshals geological + paleontological + paleoclimatic evidence as independent attestations. [Practitioner-extraction: the transferable form is the CONVERGENCE-OF-INDEPENDENT-EVIDENCE-STREAMS warrant. Each evidence-stream alone is suggestive; their independent convergence is dispositive. The atom is methodological: when N independent lines of evidence point at conclusion C, P(C|N-evidence) >> P(C|single-evidence) by the multiplicative independence — and this can warrant acceptance even when mechanism is incomplete.]"
  - source: practitioner
    text: cross-domain-convergent-evidence-attestation
    citation: "Cross-domain attestation: (a) Mendel's genetics (1866, rediscovered 1900): Mendel's pea-experiments showed clean 3:1 + 9:3:3:1 ratios suggesting discrete particulate inheritance. The mechanism (chromosomes + DNA) was 40-90 years away. The convergence of (mathematical-ratio-pattern) + (independent-trait-segregation) + (consistency-across-species) warranted acceptance of the structural claim before the mechanism was known. (b) Ignaz Semmelweis 1847 hand-washing reduces puerperal fever mortality: Semmelweis had statistical evidence (mortality drops from 18% to 2% in the obstetrical clinic when hand-washing with chlorinated lime was introduced) + the comparative-clinic natural experiment (the midwife-attended clinic had lower mortality than the doctor-attended clinic that handled cadavers). Mechanism (germ theory) was 20+ years away. Convergence of evidence was rejected on insufficient-mechanism grounds; Semmelweis was vindicated by Pasteur + Lister. (c) Marshall + Warren 1982 *H. pylori* causes ulcers: they marshaled microscopy + culture + Koch-postulates evidence; the prevailing dogma was 'ulcers are caused by stress + acidity'. Mechanism (the bacterium survives the gastric acid environment) seemed implausible; Marshall famously drank a Petri-dish to demonstrate. Nobel 2005. (d) Galileo's heliocentric system (1610s): convergence of Jupiter-moon observations + Venus-phases + sun-spots + lunar topography against geocentric model. Mechanism (gravitational attraction) was 70 years away (Newton 1687). The convergence warranted acceptance; Galileo's struggle was over the convergence-vs-authority question, not the mechanism question. (e) Darwin 1859 evolution: convergence of (biogeographic distribution) + (fossil-record sequence) + (comparative anatomy) + (artificial-selection analogy) + (embryology) warranted natural-selection. Mechanism (Mendelian genetics + DNA) was 41+ years away. The 'modern synthesis' (1930s-40s) supplied the mechanism; Darwin's structural claim was accepted decades earlier on convergence. (f) Dark matter (Zwicky 1933, Rubin 1970s): convergence of (galaxy-cluster velocities exceeding visible mass) + (galaxy rotation curves) + (gravitational lensing) + (CMB power spectrum). Mechanism (what dark matter IS) remains unknown 90+ years later. The structural claim — there's more gravitating mass than we see — is accepted on the convergence. (g) Climate change (IPCC reports): convergence of (instrumental temperature records) + (ice-core CO₂ + temperature) + (sea-level rise) + (glacier retreat) + (paleoclimatic proxies) + (radiative-forcing physics). The structural claim — anthropogenic CO₂ is warming the planet — is accepted on convergence; the mechanism (radiative-transfer physics) was actually well-known (Arrhenius 1896, Plass 1956). The atom's domain extends to policy-relevant scientific claims. (h) Lyme disease as bacterial vs psychosomatic (1970s controversy): convergence of (geographic-clustering in Connecticut) + (tick-bite-correlation) + (serological response) + (antibiotic-responsive cases) over the prevailing 'juvenile rheumatoid arthritis' psychogenic-attribution diagnosis. Vindicated when the bacterium (*Borrelia burgdorferi*) was isolated 1981."
    quote: "Transferable scope: applies wherever multiple independent evidence-streams can be brought to bear on a structural claim, even when mechanism is incomplete. Operational diagnostic: (1) identify the candidate-claim. (2) enumerate evidence-streams that could attest. (3) verify INDEPENDENCE — does evidence-stream A select for the same explanation as evidence-stream B for distinct reasons? Multiplicative independence is key; correlated streams don't count as separate convergences. (4) count the converging streams. The atom predicts: N truly-independent converging streams warrant acceptance of the structural claim P(C|N-streams) approaches certainty as N grows, even without mechanism. (5) reject the move 'we don't know HOW, therefore reject WHAT' — that conflates structural-warrant with mechanistic-explanation. The atom does NOT predict that mechanism is unimportant — mechanism eventually matters for application + integration with broader theory — only that DEMANDING mechanism as precondition for accepting the structural claim is methodologically incorrect when convergent evidence is strong. Critical companion: lex-vtytt crisis-recognition-and-orientation — Kuhn 1962 names the paradigm-shift moment; lex-vk65z names the methodological pattern of WHAT TYPE OF EVIDENCE WARRANTS the shift. [synthesis 2026-05-25]"
canonical-instances:
  - "Wegener 1915 continental drift (canonical-case): 4 independent evidence-streams (geometric + geological + paleontological + paleoclimatic) converge on continental displacement. Mechanism rejected by 1920s geophysical orthodoxy as insufficient. Vindicated 1960s by plate-tectonics + seafloor-spreading + paleomagnetism. The structural-claim acceptance lagged the convergent-evidence by ~50 years due to mechanism-demand."
  - "Mendel 1866 → 1900 rediscovery: mathematical-ratio pattern (3:1, 9:3:3:1) + independent-trait-segregation + species-generality converge on discrete particulate inheritance. Mechanism (chromosomes + DNA) was 40-90 years away. Convergence accepted upon rediscovery (de Vries, Correns, Tschermak 1900); the structural claim warranted acceptance."
  - "Semmelweis 1847 puerperal fever / hand-washing: statistical-evidence (18% → 2% mortality reduction with chlorinated-lime hand-washing) + comparative-clinic natural-experiment (midwife clinic lower mortality than doctor clinic handling cadavers) + temporal-correlation. Mechanism (germ theory) was 20+ years away. The convergence was rejected on insufficient-mechanism grounds; Semmelweis spent the rest of his life advocating until vindicated by Pasteur + Lister germ-theory work in the 1860s-70s."
  - "Marshall + Warren 1982 *H. pylori* causes ulcers: microscopy + culture + Koch-postulates evidence against prevailing 'stress + acidity' dogma. Mechanism initially implausible (bacterium surviving gastric acid). Marshall drank a Petri dish of H. pylori in 1984 to demonstrate; Nobel 2005. Vindication ~22 years after initial claim."
  - "Galileo 1610s heliocentric system: Jupiter-moons (Medicea Sidera 1610) + Venus-phases (1610-1611) + sun-spots (1612) + lunar-topography (1610) all converge against geocentric model. Mechanism (gravitational attraction) was 70 years away (Newton 1687). The convergence warranted acceptance; Galileo's struggle was authority-vs-convergence, not mechanism-vs-claim."
  - "Darwin 1859 evolution by natural selection: biogeographic-distribution + fossil-record-sequence + comparative-anatomy + artificial-selection analogy + embryology converge on common descent + natural selection. Mechanism (Mendelian genetics + DNA) was 41+ years away. Modern synthesis 1930s-40s supplied mechanism; Darwin's structural claim accepted decades earlier on convergence."
  - "Dark matter (Zwicky 1933 → Rubin 1970s): galaxy-cluster-velocity-dispersions + galaxy-rotation-curves + gravitational-lensing + CMB-power-spectrum converge on more-gravitating-mass-than-visible. Mechanism — what dark matter IS — remains unknown 90+ years later. The structural claim is accepted on convergence; the field continues to seek mechanism (WIMPs, axions, MOND, etc.). Canonical instance of structural-claim-accepted-with-mechanism-pending."
  - "Anthropogenic climate change: convergence of instrumental-temperature + ice-core-CO₂ + sea-level + glacier-retreat + paleoclimate-proxies + radiative-forcing-physics. Structural claim widely accepted; the mechanism (radiative transfer) was actually well-known historically (Arrhenius 1896, Plass 1956). Modern instance of evidence-convergence warranting acceptance against political/economic resistance."
  - "Lyme disease as bacterial (1975 Steere → 1981 Burgdorfer): geographic-clustering (Lyme, CT) + tick-correlation + serological-response + antibiotic-response converge on bacterial cause, against the prevailing 'juvenile rheumatoid arthritis' psychogenic-attribution. Mechanism (the spirochete *Borrelia burgdorferi*) isolated 1981. Convergence accepted ~6 years after initial epidemiological detection."
