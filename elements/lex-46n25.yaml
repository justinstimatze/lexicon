id: lex-46n25
name: shared-intentionality-enables-collaborative-action-via-joint-goals
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When analyzing what makes a group of agents capable of collaborative action — coordinated hunting, joint project work, cultural institution-building — Tomasello's transferable claim is that the cognitive precondition is SHARED INTENTIONALITY, also called we-mode or collective intentionality: the capacity for two-or-more agents to form a JOINT GOAL (we are doing X together) with JOINT ATTENTION (we both attend to Y, and each knows the other is attending) and INDIVIDUAL ROLES (you do this part; I do this part) that they understand to be coordinated within the joint goal. Great apes have individual intentionality (private goals, private attention) and they understand other intentional agents — they can predict what another ape will do — but they do NOT form joint goals in this we-mode sense. Human infants exhibit the precursors (gaze-following, pointing, joint attention) before language; the capacity is precultural and prelinguistic, not a downstream effect of culture. The transferable consequence is that collaborative action requires more than aligned individual interests — it requires the COGNITIVE INFRASTRUCTURE of joint goals + joint attention + individual roles understood as joint-role-fillers. Without this cognitive infrastructure you get parallel individual action (multiple agents pursuing aligned private goals — what apes do) or coerced action (one agent's goal forced on others via dominance) but not GENUINE collaboration. Practitioner consequences: (1) team performance depends on cognitive infrastructure not just incentive alignment — you can incentive-align a team and still get parallel-individual-action if the joint-goal representation hasn't formed; (2) the JOINT-GOAL formation step (often skipped in 'kickoff' rituals) is the cognitive central move that converts a group of individuals into a we-mode team; (3) cultural institutions (laws, norms, organizational structures) are SCALED versions of shared intentionality — agreed-upon social conventions that create plural agents larger than any individual; (4) when teams stall, the diagnostic is often 'we never had a real joint goal — we had aligned private goals which is not the same thing'. Distinct from lex-eg9zm cooperation-evolves: cooperation can evolve via kin-selection or reciprocity (lex-5dnd9) without requiring shared-intentionality cognitive infrastructure — wolves cooperate-by-coordination without we-mode. This atom names the SPECIFIC COGNITIVE INFRASTRUCTURE distinctive to human collaboration. Distinct from lex-hta65 spontaneous-theory-of-mind: theory-of-mind is modeling-other-as-intentional-agent (I-mode about you); shared intentionality is the further capacity for we-mode (we together about a joint goal). Theory-of-mind is necessary but not sufficient for shared intentionality. Composes with lex-5dnd9 inclusive-fitness (kin altruism explains low-cost cooperation in genetically related groups; shared intentionality explains high-cost coordination in mixed-kinship groups) and lex-uxqdz reverse-dominance (the leveling coalition is itself a we-mode actor — the rank-and-file form a joint goal of suppressing alpha behavior)."
