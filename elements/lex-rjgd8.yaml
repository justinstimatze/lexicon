    quote: "'The DM search data was blinded (SR0 re-blinded after the publication of [5]) in the signal region above the S2 threshold of 200 PE [...] prior to the tuning and development of event selection criteria and signal and background models.'"
  - source: primary
    text: aprile-et-al-2018-xenon1t-one-tonne-year-dark-matter-search
    citation: "E. Aprile et al. (XENON Collaboration), 'Dark Matter Search Results from a One Tonne x Year Exposure of XENON1T,' arXiv:1805.12562v2 [astro-ph.CO] (13 September 2018), analysis-methodology section."
    quote: "'In addition to blinding, the data were also “salted” by injecting an undisclosed number and class of events in order to protect against fine-tuning of models or selection conditions in the post-unblinding phase. After the post-unblinding modifications described above, the number of injected salt and their properties were revealed to be two randomly selected 241 AmBe events, which had not motivated any post-unblinding scrutiny.'"
canonical-instances:
  - "A hiring committee lets interviewers revise a candidate's scorecard after a reference call surfaces new information. To check whether revisions are principled rather than a route to a predetermined outcome, the recruiter could seed a small number of fabricated, undisclosed reference-call summaries into the packet -- a revision pattern that happens to consistently favor the salted summaries would expose score creep the committee could not see from inside its own reasoning."
  - "A security team allows analysts to reclassify alerts after an incident review reveals context the automated triage missed. Planting a handful of undisclosed synthetic test-alerts among the real backlog turns 'did reviewers get more lenient once they knew what mattered to leadership' into a measurable question instead of an assumption about the team's integrity."
  - "Operationally distinct from lex-bvz98 bias-the-classification-against-your-own-thesis-to-earn-the-finding: that atom is a single researcher's static pre-commitment, made once before looking at any data, to resolve ambiguous cases against their own hypothesis. This atom targets a different moment -- adjustments made AFTER seeing real data, when a legitimate need to correct genuine flaws is unavoidable -- and checks those adjustments empirically via decoys, rather than trying to design bias out of the process in advance."
critical-questions:
  - "How many decoys, and how similar to plausible real signal, before the technique itself starts distorting the analysis -- either by making the team overcautious about any adjustment, or by being detectable and defeating its own purpose? XENON1T's two decoys were revealed to have motivated zero scrutiny, suggesting a light touch is enough, but a process under more pressure to find a result might need more."
  - "What happens when a post-hoc fix DOES land on a decoy? The technique only works if there's a real, pre-committed consequence -- discarding the fix, escalating for independent review, publishing the finding -- rather than quietly noting it and moving on, which would defeat the entire point of making the check external."
  - "Does the domain even allow undisclosed decoys to be inserted credibly? The move requires a party who controls the withheld data and is trusted to inject decoys without leaking which ones -- a single self-auditing individual can't run this on themselves, since the same motivated reasoning that might taint an adjustment could also taint the memory of what was salted."
status: active
