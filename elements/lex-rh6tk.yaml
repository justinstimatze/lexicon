id: lex-rh6tk
name: announcing-a-forced-sale-collapses-the-assets-own-value
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Announcing that you must sell an asset because you're leaving can collapse that asset's market value on the spot, since part of what it was worth traced to your own credible willingness to keep it. Douglass warns Black Southerners against joining the 1879 exodus movement by first selling off their land and livestock: 'Let it be understood that you are going, and you advertise the fact that your mule has lost half its value; for your staying with him makes half his value. Let the colored people of Georgia offer their six millions' worth of property for sale, with the purpose to leave Georgia, and they will not realize half its value. Land is not worth much where there are no people to occupy it, and a mule is not worth much where there is no one to drive him.' The mechanism isn't primarily an information leak about desperation in a single negotiation -- it's that some assets' value is genuinely coupled to continued use by a present owner (a mule needs a driver, land needs an occupant), so announcing departure doesn't just weaken your bargaining position, it shrinks the pool of value there is to bargain over at all."
