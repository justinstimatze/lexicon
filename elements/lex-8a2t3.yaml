canonical-instances:
  - "A team dismisses a blunt bug report from a contractor known for being difficult to work with while eagerly acting on a vague, upbeat status update from a well-liked colleague, even though the contractor's report was the one that accurately identified the actual problem."
critical-questions:
  - "Is the man's error really about ignoring content in favor of reputation, or is relying on a messenger's track record actually a reasonable shortcut most of the time, one that simply failed in this specific case?"
  - "How would the man have been expected to evaluate the jackal's and crane's messages on their content alone, given that neither species can be reasoned with the way a human informant could?"
