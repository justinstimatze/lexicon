id: lex-fugev
name: reframing-a-rule-as-local-to-its-source-exempts-you-elsewhere
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A rule given to you by someone else, along with an explicit warning about its limit, can be quietly reinterpreted as a local custom rather than a universal fact once you're operating somewhere the rule's author isn't watching, even though the rule was actually describing a fixed physical or structural limit that doesn't care whose territory you're standing in. Coyote learns the eye-throwing trick along with an explicit warning: ''Don't do this more than four times in one day,' the man said. 'Of course not. Why would I do that?' said Coyote.' Having used the trick exactly four times without consequence, Coyote doesn't simply forget the warning -- he actively reasons his way past it: 'That man's rule is made for his country. I don't think it applies here. This is my country.' The rule wasn't jurisdictional at all; it described a property of the trick itself, not a local custom of the place he learned it. The fifth attempt confirms this immediately: his eyes don't come back, and he's left blind. Diagnostic move: when you catch yourself reasoning that a warning or limit someone else gave you must have been specific to their context and therefore doesn't bind you in a different one, check whether the limit was actually describing a fixed property of the thing itself, in which case moving to new territory changes nothing about whether it applies."
