name: live-the-question-rather-than-force-a-premature-answer
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Rilke's advice to the young poet Kappus addresses a specific temptation: someone facing a genuinely unresolved question -- about vocation, about a relationship, about what to do with a life still taking shape -- wants the question closed, and reaches for whatever answer is available now, even a premature or borrowed one, just to stop holding the discomfort of not knowing. Rilke's counter-move has two parts. First, relate to the unresolved question itself differently: not as an obstacle to clear away but as something to be patient toward and even to love, the way you'd approach a locked room you can't yet enter or a book written in a language you haven't learned yet -- worth respecting as it is, not worth forcing. Second, and this is the part that makes the advice more than resignation: don't wait passively for the answer to arrive: 'live the questions now,' actively, as the substance of what you're doing, rather than treating the present as empty time to be endured until the real answer shows up later. The payoff Rilke offers is not that patience is virtuous for its own sake but that living the question is what actually prepares you for the answer -- by the time you'd genuinely be capable of holding it, of doing something real with it rather than just reciting it, you may find yourself living into it 'without noticing,' because the years spent actually inhabiting the question built the capacity the answer would otherwise have found nobody home to receive. The diagnostic move: when you notice the impulse to resolve a genuinely open question quickly, ask whether the answer you're reaching for is one you could actually live right now, or whether you're grabbing it mainly to stop the discomfort of the question remaining open -- if it's the latter, the discipline is not to keep searching harder for an answer, but to change your relationship to the question itself."
