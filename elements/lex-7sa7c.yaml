lineage:
  - source: primary
    text: merton-1957-mutually-reinforcing-comparison
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior,' in Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VIII, pp.227-228. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'Comparing himself with his unmarried associates in the Army, he could feel that induction demanded greater sacrifice from him than from them; and comparing himself with his married civilian friends, he could feel that he had been called on for sacrifices which they were escaping altogether.'"
  - source: primary
    text: merton-1957-cross-cutting-comparison
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior' (1957), same chapter, p.242, describing the overseas noncombat soldier's situation."
    quote: "'the overseas noncombat soldier is, by the standards of Army life, worse off than the soldier at home in that he is comparatively deprived of amenities and cut off from social ties, and better off than the combat soldier in that he is not exposed to the same measure of deprivation and risk. It is as though he had said, \"Bad off as we are, the others are worse off,\" a comparison not seldom adopted by those who would accommodate themselves to their position.'"
canonical-instances:
  - "A mid-level manager who compares their pay unfavorably to peers at competitor companies AND unfavorably to their own company's executives is getting reinforcing comparisons — both push toward feeling underpaid, and the grievance compounds beyond what either comparison alone would produce."
  - "A remote worker who compares their isolation unfavorably to in-office colleagues' social connection, but favorably compares their flexibility to in-office colleagues' commute and schedule rigidity, is getting cross-cutting comparisons — the two pull in opposite directions and net out to a milder, more ambivalent overall attitude toward the arrangement than either comparison alone would predict."
critical-questions:
  - "Do reinforcing and cross-cutting comparisons actually combine this cleanly (compound vs. net out), or can a cross-cutting comparison sometimes fail to blunt a reinforcing one at all — e.g. if one comparison is much more salient or emotionally weighted than the other, does the weaker comparison's canceling effect actually show up in the person's felt experience?"
  - "Merton's cross-cutting case resolves into apparent acceptance ('bad off as we are, the others are worse off') — is this genuinely a stable psychological compromise, or a temporary accommodation that could tip toward the grievance-producing comparison if circumstances make that comparison more salient (e.g., news specifically about people back home)?"
