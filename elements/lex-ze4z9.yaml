id: lex-ze4z9
name: an-opportunist-can-capture-a-sincere-symbolic-transgression-for-unrelated-power
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A sincere act of symbolic transgression, intended to renew or deepen a shared belief by violating its own overprotected purity, can be intercepted in public by an actor with no stake in that belief at all, who uses the resulting outrage to build personal or political power instead -- when this happens, the transgression doesn't fail to land, it succeeds at something entirely different from what it was for. Hyde traces exactly this turn in the aftermath of Andres Serrano's Piss Christ: Serrano himself described the work as working from inside his Christian faith, not against it, but 'the controversy over Piss Christ was not the \"practice of faith\" that Serrano hoped for. His experiment may have worked in the privacy of his studio, but when it hit the streets something else happened. The politicians who attacked the National Endowment for the Arts, using Serrano as one of their wedges, were not really interested in their relationship to God. Senator Helms, at least, has an exquisite instinct for how to build a power base and raise money; like any demagogue, he knows how to translate a complicated problem into a simple fear, how to stir up racial animosity, and how to set his constituents at each other's throats.' Hyde's verdict names the failure precisely: 'If that's what was actually going on, then this artist's dirt-work fails: he tries to revive a dying god, and revives a politician instead, and a particular kind of politician at that.' The old ritual's logic (debase the god, then restore him, newly powerful) still runs to completion, but the power that gets renewed at the end isn't the god's -- it's the opportunist's, who never needed the underlying belief to be true, only needed the outrage to be usable. Diagnostic move: when a genuine, good-faith transgression against a shared symbol produces a wave of public outrage, ask who actually gains durable power from that outrage before assuming the transgression itself succeeded or failed on its own terms -- a demagogue skilled at converting a complicated question into a simple fear can extract exactly what they need from the reaction regardless of what the original act was trying to accomplish."
