lineage:
  - source: primary
    text: bornstein-1994-gender-outlaw
    citation: "Kate Bornstein, *Gender Outlaw: On Men, Women and the Rest of Us* (Routledge, 1994). Bornstein is a playwright, performer, and gender theorist; this book, drawing on her own transition and life in theater and subculture communities, is a foundational text in transgender studies. Ch.7 ('Which Outlaws?') and Ch.8 ('Gender Terror, Gender Rage') develop the claims grounded here."
    quote: "[On the failure of positive-category organizing, and the alternative:] 'All the categories of transgender find a common ground in that they each break one or more of the rules of gender: what we have in common is that we are gender outlaws, every one of us. To attempt to divide us into rigid categories (\"You're a transvestite, and you're a drag queen, and you're a she-male, and on and on and on) is like trying to apply the laws of solids to the state of fluids: it's our fluidity that keeps us in touch with each other. It's our fluidity and the principles that attend that constant state of flux that could create an innovative and inclusive transgender community.' [On the coalition's continuing internal unevenness, acknowledged directly:] 'Very few groups exist... that encompass the full rainbow that is gender outlawism, and sadly, groups still divide along the lines of male-to-female and female-to-male gender outlaws.' [On the companion who-is-the-terrorist reversal:] 'gender terrorists are not the drag queens, the butch dykes, the men on roller skates dressed as nuns. Gender terrorists are not the female to male transsexual who's learning to look people in the eye while he walks down the street... Gender terrorists are those who... bang their heads against a gender system which is real and natural; and who then use gender to terrorize the rest of us. These are the real terrorists: the Gender Defenders.'"
  - source: discovery-loop
    text: distinctness-audit-bornstein-shared-defiance-coalition
    citation: "Lex-0566 (Butler's claim that gender essence is an effect of ritualized repetition, not its cause) concerns the ontological status of gender identity itself — that an apparently stable gender identity is the retrospective effect of repeated, ritualized performative acts, not their pre-existing cause. This atom's claim is not about the ontology of gender identity but about political and social organization: how a population whose members hold different, non-unifiable positive self-understandings should organize collectively despite that non-unifiability. Butler explains why gender identity looks fixed when it isn't; this atom explains how to build solidarity among people for whom even the performative categories on offer don't converge on one shared identity. Lex-0838 (Halberstam's claim that refusing the heteronormative capitalist success script is itself generative) concerns the generative value of exiting a specific ideological scoring system. This atom's claim is not about what is generative in exit or failure, but about the structure of coalition-formation among people who have each, independently, already exited or broken a rule in their own different way. The two compose: Halberstam explains why refusing the norm can be generative; this atom explains how a group of people who have each refused a norm, but not in the same way, can nonetheless organize together."
canonical-instances:
  - "Bornstein's own naming of the internal category-fracture the positive-identity approach produces: distinct groups (transvestite, drag queen, she-male, transsexual) that could be, and often are, set against one another when a coalition insists on adjudicating which is the 'real' or 'correct' category — resolved not by settling the adjudication but by organizing around the shared relationship each holds to the gender rule they've each broken differently."
  - "The reframing of 'gender terrorist': rather than accepting the frame in which those who visibly break gender norms are the aggressors disrupting a natural order, Bornstein relabels the enforcers of the binary — those who 'use gender to terrorize the rest of us' — as the actual 'Gender Defenders' and the real source of harm."
  - "A modern cross-domain analogue, responsibly extending rather than drawn from Bornstein's text: a disability-rights coalition spanning conditions as different as chronic illness, sensory disability, and mobility impairment, which does not share a single positive medical category or even a shared day-to-day experience, but organizes successfully around the shared relational fact of being excluded by the same set of inaccessible institutional rules and physical designs."
  - "The coalition's own acknowledged internal unevenness, which Bornstein reports rather than resolves: even a shared-defiance coalition can still stratify along its own internal lines (in her account, along male-to-female versus female-to-male divisions) — evidence that the relational-definition move solves the single-positive-identity fragmentation problem without automatically solving every other internal hierarchy."
critical-questions:
  - "Does this population actually share a single positive identity or trait, or does it share only a relationship to the same external rule, norm, or institution — each member breaking, exceeding, or being excluded by it in a different way?"
  - "Is a coalition-building effort forcing convergence on one positive category that will necessarily exclude or subordinate members whose actual self-understanding is different, when organizing around the shared relational fact (defiance of, or exclusion by, the same rule) would include everyone without requiring that convergence?"
  - "Has a 'who is the real threat' framing been accepted uncritically — and would inverting it (naming the rule's enforcers, rather than its transgressors, as the source of harm) more accurately locate where the coercion is actually coming from?"
  - "Even after organizing around shared defiance rather than a single positive identity, has the coalition checked for its OWN internal hierarchies or exclusions — since a negatively-defined coalition is not automatically free of the fragmentation problems a positively-defined one has?"
  - "Is the live question the ONTOLOGICAL status of an identity category (lex-y2tbg, Butler) or the STRUCTURAL basis on which a diverse population without a shared positive identity can nonetheless organize collectively (this atom)? These are adjacent but different questions."
status: active
