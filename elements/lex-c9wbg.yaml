id: lex-c9wbg
name: fabricated-intimacy-built-over-repeated-visits-extracts-a-guarded-secret
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When the only source who knows a critical secret is someone with routine, trusted proximity to the people guarding it, approach them with an invented but sympathetic backstory, build a real-feeling relationship across multiple encounters before asking anything sensitive, and time the actual question for after trust is established — with no intention of honoring whatever was promised to get there. In the Maha-Ummagga-Jataka, only a caged maynah bird who watches a rival king''s bedchamber knows his war plans. Mahosadha''s spy parrot invents a fake identity and a dead-wife story to win her sympathy, courts her over what becomes a full relationship, and only after intimacy is established does he ask: "I want to ask you something; shall I say it?"— extracting the secret once trust is real. He then leaves, having privately resolved beforehand, "Live or die, what care I for you?", and never returns to her as promised.'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, fabricated-intimacy, honeytrap, extracted-secret]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: 'The other said: "Lady, what is this you say! if I see you not after seven days, how can I live?" So he spake with his lips, but thought in his heart, "Live or die, what care I for you?"'
canonical-instances:
  - "An intelligence service assigns an operative to cultivate a romantic relationship with an executive assistant who has calendar access to a hostile foreign minister, spending months building a convincing personal connection before ever asking a question that touches the target's actual work."
  - "A corporate spy poses as a new hire's mentor at a rival firm's favorite off-site bar, buying drinks and sharing an invented personal history over several weeks, and only once the junior employee trusts him enough to vent about work does he start steering conversation toward the product roadmap he was sent to learn."
critical-questions:
  - "The mechanism depends on the source never discovering the relationship was instrumental — what happens to the value of the extracted secret, or to any future access, once the deception is inevitably exposed?"
  - "The parrot invests real, sustained effort — multiple visits, a consistent fabricated backstory, emotional intimacy — before asking anything; does the sheer cost of building the deception make it feel more legitimate to the person using it, independent of the harm it does to the person deceived?"
status: active
