evokes: [s-curve-life-cycle, momentum-of-interests, torrey-canyon-tanker-example, economics-adapts-to-momentum-not-the-reverse]
lineage:
  - source: primary
    text: altshuller-1984-momentum-of-interests
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.7 'The Strategy of Invention,' section '\"The Lifeline\" of Technological Systems.'"
    quote: "'When the curve reaches level 1 many people turn out to be interested in the future development of the system... a momentum of interests gets going — financial, scientific (pseudoscientific), careeristic, and simply human (fear of abandoning an accustomed and time worn system). One can ask, does this mean that the momentum of interests turns out to be stronger than economic factors? Yes, it is stronger. But the economic factors themselves are able to adapt to the momentum of interests.'"
  - source: primary
    text: altshuller-1984-torrey-canyon-tanker-growth
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.7, '\"The Lifeline\" of Technological Systems.'"
    quote: "'Right down to level 2 the system continues to remain advantageous at a cost of destruction, pollution and chemical exploitation of the environment. A typical example is served by the accelerated construction of large tankers... The famous Torrey Canyon disaster (where 120,000 tons of oil were spilled into the sea) led to severe consequences for the British and French coastlines. Since that time the oceans have not become calmer... But already tankers are being constructed of half a million tons and tankers are on the drawing boards with a water displacement of one million tons... 'This is good for me today, and I don't give damn for the rest,' is the formula that pulls curve upwards, to level 2 (economical at the expense of causing harm to the environment).'"
canonical-instances:
  - "A company keeps investing in an aging on-premise data-center architecture well past the point cloud alternatives would be cheaper, because the team that built and maintains it, and the budget line that funds it, have real career and institutional stakes in its continuation — the internal 'it's still cost-effective' accounting quietly excludes the opportunity cost and technical-debt risk that a neutral analysis would count."
  - "A city keeps expanding highway capacity for cars long after congestion research shows induced demand will erase the benefit, because road-construction contracts, agency mandates, and political identity are built around car infrastructure — the growth continues to look 'necessary' only because the true cost (induced sprawl, transit underinvestment) doesn't appear on the transportation department's own balance sheet."
critical-questions:
  - "how would an outside observer distinguish 'momentum of interests keeping a declining system alive past its rational point' from 'the system's actual economics were simply healthier than a naive theoretical curve predicted' — is there a way to test which explanation is operative before the hard physical ceiling arrives and settles the question after the fact?"
  - "does identifying vested-interest momentum in a system's continued growth imply the growth should be stopped, or only that its true cost accounting should be corrected — could a system legitimately continue growing even after its cost is fully internalized, simply because the internalized-cost version is still worth it?"
  - "the tanker case reached a hard physical ceiling (level 3) that finally forced change — but not every system has an equivalently hard, externally-imposed ceiling; for systems whose growth could in principle continue indefinitely on borrowed cost, what forces (other than a physical wall) could ever actually stop the momentum?"
status: active
