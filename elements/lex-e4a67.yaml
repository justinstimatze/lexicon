id: lex-e4a67
name: reaction-intensity-scales-with-damage-not-whether-triggered
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an action ruptures a barrier that keeps two reactive components apart, don't treat the reaction as a binary switch. Any rupture starts it, but the amount of product it makes keeps climbing continuously with the amount of rupture that occurred. The nominal label on the action ('minced,' 'cut,' 'triggered') can hide wildly different potency depending on how violently it was done. America's Test Kitchen on garlic and onions: 'When the cells of a garlic clove are ruptured, an odorless sulfur-containing amino acid is released and immediately comes into contact with an enzyme called alliinase. The reaction of the two eventually produces a new compound commonly called allicin... The more a garlic clove is broken down, the more enzymes are released, and the more allicin — and therefore more flavor — is produced.' Before cutting into their controlled experiment, the enzyme and its precursor sit in separate compartments inside the cell, inert; a single knife stroke that ruptures even one cell wall is enough to start the reaction, but a food processor rupturing thousands of cells at once releases proportionally more of both reactants and produces proportionally more of the flavor compound. Two samples labeled identically by task ('minced onion') can differ enormously in potency because the task's name only describes the goal — the amount of underlying damage done to reach it is a separate, unstated variable."
related: [lex-mrhyp, lex-d7p2y]
evokes: [americas-test-kitchen-crosby-2012-science-of-good-cooking, slicing-changes-garlic-and-onion-flavor, alliinase-and-allicin, thiosulfinates, more-chopping-equals-more-flavor]
lineage:
  - source: primary
    text: americas-test-kitchen-crosby-2012-science-of-good-cooking-concept-31-slicing-alliums
    citation: "The Editors at America's Test Kitchen and Guy Crosby, The Science of Good Cooking: Master 50 Simple Concepts to Enjoy a Lifetime of Success in the Kitchen (America's Test Kitchen, 2012), Concept 31, 'Slicing Changes Garlic and Onion Flavor.'"
    quote: "'When the cells of a garlic clove are ruptured, an odorless sulfur-containing amino acid is released and immediately comes into contact with an enzyme called alliinase. The reaction of the two eventually produces a new compound commonly called allicin, which is responsible for garlic's familiar scent and characteristic fiery flavor. The more a garlic clove is broken down, the more enzymes are released, and the more allicin—and therefore more flavor—is produced.'"
  - source: primary
    text: americas-test-kitchen-crosby-2012-science-of-good-cooking-concept-41-mixing-and-gluten
    citation: "The Editors at America's Test Kitchen and Guy Crosby, The Science of Good Cooking (America's Test Kitchen, 2012), Concept 41, 'Gentle Folding Stops Tough Quick Breads.' A second instance, mechanical rather than enzymatic: the triggering action is mixing intensity, not cell rupture, but the same continuous-scaling shape holds."
    quote: "'Stirring would seem to be a gentle way of mixing the ingredients, but in a wet batter it's enough to begin unfolding the proteins and activate the formation of gluten. It really doesn't require much gluten formation to make a tender quick bread tough.'"
canonical-instances:
  - "The book's own controlled test: half a batch of potato juice got an onion hand-minced with a sharp knife (clean cuts, minimal cell rupture); the other half got an onion 'minced' the same nominal amount in a food processor (violent pulsing, extensive cell rupture). Both were labeled 'minced onion,' but the food-processor sample released measurably more thiosulfinates — confirmed indirectly because those compounds' antioxidant effect kept a shared batch of oxidizing potato juice pale, while the hand-minced sample's juice still darkened almost as much as juice with no onion at all."
  - "The book's own three-way brownie test: batter folded just until combined (a few flour streaks remaining) baked compact and tender; the same batter folded further, until perfectly smooth, baked cakey and tough; batter run five full minutes in a stand mixer baked almost twice as tall but 'downright tough,' lacking any fudgy texture at all. Nothing else changed between batches — only how much mechanical mixing was applied — and gluten development, and therefore toughness, tracked that continuously rather than switching on at some single 'overmixed' threshold."
  - "Hypothetical: two managers each describe having 'given feedback' to an underperforming employee. One delivered it in a five-minute private conversation with specific, narrow examples; the other delivered the same nominal task in a public, blistering half-hour dressing-down. Both count as 'gave feedback,' but the amount of relational damage produced scales with how the feedback was actually delivered — the bare fact that feedback occurred says nothing about that."
critical-questions:
  - "Operationally distinct from lex-d7p2y (insufficient and excessive intensity failing through different mechanisms, a two-regime Goldilocks zone): that atom describes a U-shaped failure curve with a narrow correct zone between two different failure modes. This atom describes a monotonic scaling relationship with no U-shape at all — more damage simply means more product, in one direction, without a corresponding failure mode from too little. Is there a regime where allicin/thiosulfinate production actually turns over and declines at extreme damage (enzyme destruction from excess heat of friction, say), which would fold this into a two-regime case after all?"
  - "Does the continuous-scaling relationship hold indefinitely, or is there a ceiling where all available reactant is already exposed and further rupture stops adding potency — and if so, how would a cook (or an analogous practitioner in a non-cooking domain) know where that ceiling sits without running the equivalent of the book's own controlled experiment?"
  - "In the human-feedback analogy, is 'damage' actually the right frame for what determines the outcome, or does audience, tone, and specificity vary independently of sheer intensity in ways that garlic and onion cells, being purely mechanical systems, don't capture?"
