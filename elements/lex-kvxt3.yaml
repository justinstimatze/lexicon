  - source: primary
    text: kautilya-arthashastra-gaining-an-oligarchy-is-best-for-its-cohesiveness
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Against Confederacies and Oligarchies,' 'On Controlling Oligarchies,' 'General,' {11.1.1-3}."
    quote: "'Because oligarchies are cohesive entities, enemies cannot break them [easily]. Among gaining an oligarchy, an army or an ally, gaining an oligarchy is the best, because of its unassailable cohesiveness.'"
canonical-instances:
  - "An acquiring company chooses to pursue a smaller competitor with an unusually tight-knit, mission-driven team and strong internal culture over a larger but more fragmented one with high turnover and weak internal cohesion, correctly betting that the tight-knit team's own cohesiveness -- the very thing that made it a harder, more expensive acquisition -- is exactly what will make it resistant to poaching, culture clash, or internal fracture after the deal closes."
  - "A political coalition builder prioritizes winning over a small, disciplined, ideologically unified bloc of votes over a larger but loosely-affiliated and easily-fractured group of swing voters, reasoning that the disciplined bloc's cohesion, though it took more work and concessions to secure, will hold reliably through future votes in a way the larger but fragile group never would."
critical-questions:
  - "is the transfer of cohesion actually reliable -- does an oligarchy's internal unity survive being absorbed into a new external power structure, or does the very act of conquest disrupt the trust and shared governance that produced the cohesion in the first place, leaving the conqueror with a fractured prize despite the theory?"
  - "does this ranking undervalue the raw immediate utility of an army (which can be deployed right away) or an ally (which may bring resources an oligarchy doesn't), if durability is weighted so heavily that more urgently useful but less durable acquisitions are systematically passed over?"
  - "how does an acquirer verify, before committing resources, whether a target's apparent cohesion is genuine and durable versus superficial or situational -- could a group that looks unassailably cohesive from the outside actually be one crisis away from fracturing, making the entire premise of this ranking rest on a hard-to-verify property?"
