id: lex-qbf3g
name: standing-outside-a-conflict-lets-you-extract-value-and-void-its-rules
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Standing outside a two-party conflict entirely, rather than playing as either side, lets you extract the value both sides are fighting over without engaging the fight's actual terms, and having done so once can permanently undermine the system's authority for everyone who relies on it afterward. Raven doesn't outcompete the fishermen or outrun the fish; he studies how the fishermen bait their hooks, then goes underwater and takes the bait directly, leaving the hooks bare: 'The next time they went out, he walked off behind a point and went underwater to get this bait. Now they got bites and pulled up quickly, but there was nothing on their hooks.' Hyde names the structural position this creates: 'in the relationship between fish and fishermen this trickster stands to the side and takes on a third role... A parasite or epizoon, he feeds his belly while standing just outside the conflict between hunter and hunted.' The consequence isn't limited to one meal. Among the Zulu, a trap that has once caught the trickster weasel Thlokunyana is permanently ruined: 'A kind of jinx or magical influence remains in the trap that has caught a weasel and that influence forever after 'stands in the way' of the trap's power; it will no longer catch game.' The bait thief's single act of standing outside the game doesn't just extract one payoff, it corrodes the game's future authority: 'the bait thief becomes a kind of critic of the usual rules of the eating game and as such subverts them, so that traps he has visited lose their influence.' Diagnostic move: when you're stuck choosing between two roles inside a fixed conflict, ask whether there's a third position, adjacent to the conflict but not defined by it, that lets you take what the conflict was actually about without engaging its rules -- and recognize that doing so visibly can cost the system more than your single extraction, since others watching lose confidence in a mechanism they've seen beaten from outside."
