id: lex-daes9
name: debunking-narratives-ride-pre-existing-alienation-not-cause-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a debunking or unmasking narrative gains sudden traction, check the demand side before assuming the narrative itself is what's driving belief. Merton's claim about the rise of ideological analysis and professional debunking: 'The professional iconoclast, the trained debunker, the ideological analyst and their respective systems of thought thrive in a society where large groups of people have already become alienated from common values; where separate universes of discourse are linked with reciprocal distrust. Ideological analysis systematizes the lack of faith in reigning symbols which has become widespread; hence its pertinence and popularity. The ideological analyst does not so much create a following as he speaks for a following to whom his analyses 'make sense,' i.e., conform to their previously unanalyzed experience.' The mechanism: the debunker supplies an articulate, systematic vocabulary for a distrust that already existed unarticulated — the narrative's popularity is a symptom of the pre-existing alienation, not proof that the narrative itself manufactured the distrust from nothing. Use this to reframe 'how did this conspiracy theory / cynical narrative spread so fast' questions: look first for what alienation or broken trust already existed in the audience before the narrative arrived, since a narrative that just systematizes an existing feeling will spread far faster than one trying to create the feeling from scratch."
