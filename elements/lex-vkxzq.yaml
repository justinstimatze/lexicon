lineage:
  - source: primary
    text: koestler-1964-tri-valent-triptych
    citation: "Arthur Koestler, The Act of Creation (Hutchinson, 1964), Book One, Part One, Chapter III 'Varieties of Humour,' section 'Man and Machine,' pp.45-47."
    quote: "When two independent matrices of perception or reasoning interact with each other the result (as I hope to show) is either a collision ending in laughter, or their fusion in a new intellectual synthesis, or their confrontation in an aesthetic experience. The bisociative patterns found in any domain of creative activity are tri-valent: that is to say, the same pair of matrices can produce comic, tragic, or intellectually challenging effects. [...] Surprisingly, Bergson failed to see that each of the examples just mentioned can be converted from a comic into a tragic or purely intellectual experience, based on the same logical pattern—i.e. on the same pair of bisociated matrices—by a simple change of emotional climate. The fat man slipping and crashing on the icy pavement will be either a comic or a tragic figure according to whether the spectator's attitude is dominated by malice or pity: a callous schoolboy will laugh at the spectacle, a sentimental old lady may be inclined to weep. But in between these two there is the emotionally balanced attitude of the physician who happens to pass the scene of the mishap, who may feel both amusement and compassion, but whose primary concern is to find out the nature of the injury. Thus the victim of the crash may be seated in any of the three panels of the triptych."
canonical-instances:
  - "the fat man slipping on icy pavement: a callous schoolboy's malice produces laughter; a sentimental old lady's pity produces distress; a passing physician's detached professional curiosity produces neither, only diagnostic interest — same event, same structural clash of mind-versus-matter, three different affective outcomes."
  - "Don Quixote: read with 'arrogant condescension' at his delusions, he is comic; read with 'detached curiosity' about their psychological causes, he becomes a puzzling, intellectually interesting figure; read with 'sympathetic identification' — recognizing him as 'my brother-in-arms in the fight against windmills' — he becomes tragic. The text of the novel does not change; the reader's stance does."
  - "stock farce characters (the cuckold, the miser, the stutterer, the hunchback, the foreigner) appear as comic, intellectually challenging, or tragic 'according to the different emotional attitudes which they arouse in spectators of different mental age, culture, or mood' — the same character-structure, routed through different audiences' affective stances toward it."
  - "generalized beyond Koestler's examples: a startup's failure can be told as a comic cautionary anecdote at a conference, a tragic case study in a eulogy for the founder's effort, or a neutral post-mortem for an engineering team — the facts are identical; only the narrator's and audience's emotional stance toward the people involved differs."
critical-questions:
  - "how is this different from lex-zqf8z mechanical-encrustment-on-the-living-produces-comic (Bergson)? lex-zqf8z is exactly the narrower theory this atom explicitly targets: Bergson claims rigidity-on-life explains comedy AS SUCH. This atom names Koestler's rebuttal — the same rigidity-on-life pattern (the man-automaton, the puppet, the pedant) converts cleanly into tragedy (Golem, Frankenstein's monster, a catatonic patient) or intellectual fascination (how much acceleration can an organism withstand?) with the structure unchanged, only the emotional climate shifted. Use lex-zqf8z for the SPECIFIC comic mechanism when comedy is confirmed; use lex-vkxzq when you need to explain why the identical structural pattern is landing differently across retellings or audiences."
  - "does this mean the structural clash (lex-xfsbm) doesn't matter, only the emotional stance? No — both are necessary and neither is sufficient alone. Without a genuine bisociative clash (two self-consistent, habitually incompatible frames), there is nothing for the emotional stance to color; a structure-free event evokes only a single, uncomplicated feeling. The claim is specifically that WHICH of the three registers (comic/tragic/intellectual) a given clash produces is not determined by the structure alone — the structure sets up the possibility-space, the emotional stance selects the outcome within it."
  - "is 'emotional climate' fully under the storyteller's control, or does the audience bring its own? Both — Koestler's physician example shows a single individual can hold an intermediate, mixed stance (amusement AND compassion) rather than a pure one, and different audience members (schoolboy vs. old lady) bring their own dispositional stance to the identical scene. Practitioner-relevant consequence: the same structural material will not land uniformly across an audience with heterogeneous emotional stances toward what's depicted — expect the tri-valent split to appear as audience disagreement, not storyteller error, when the stance itself is contested (e.g. dark comedy about tragedy)."
