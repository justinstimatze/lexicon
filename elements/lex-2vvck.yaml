    quote: "'Now for the ends of the block. These should be used for the cutting of all small stuff; only insoles, soles, etc., should be cut in the centre and it should be a golden rule never to use the centre if the end will do.'"
  - source: primary
    text: thornton-1964-textbook-footwear-manufacture
    citation: "J. H. Thornton, ed., Textbook of Footwear Manufacture (National Trade Press, 1964), Part II, 'Bottom Stock,' section 'Good Pressmanship.'"
    quote: "'If the block is not level, whether it has a ridge down the centre, or along the front edge, or if the ends are high he cannot cut his material cleanly and evenly, a slope in any direction causing the knife to slide; the result is an undercut on one side and the reverse on the other.'"
canonical-instances:
  - "A kitchen keeps one cutting board reserved exclusively for delicate garnish and fish work, where nicks and grooves would tear the flesh, while a second, older board absorbs all the rough vegetable and bone work that dulls edges and scars the surface -- the same principle applied to a kitchen's own wear-prone shared resource."
  - "A recording studio reserves its best-calibrated, most acoustically pristine room for vocal takes and quiet passages, where any room coloration is audible, and routes rehearsal, scratch tracks, and loud drum tracking -- which don't depend on that room's specific quality -- into a secondary space, even though the good room could technically host any of it."
  - "Operationally distinct from lex-ts7f6 give-each-part-its-own-locally-optimal-treatment-not-one-uniform-rule: Altshuller's Local Quality solves a single object simultaneously facing two incompatible demands (a spray needs both fine droplets and no fog) by zoning space so each zone meets one demand at once. This atom solves a single object facing the same demand repeatedly over TIME, from tasks that differ in how much they need the demand met -- the zoning is a triage rule for sequencing unequal-priority uses against a resource that degrades, not a simultaneous compromise between two coexisting requirements."
  - "Operationally distinct from lex-spk4s isolate-component-for-separate-treatment: that atom separates a complex system into components so each can be reasoned about independently. This atom doesn't decompose the resource into independently-treated parts -- it allocates USE across an already-single, already-whole resource by priority, protecting one region's quality by directing lower-priority demand elsewhere."
critical-questions:
  - "How do you know which tasks actually need the prime zone's quality, rather than merely gaining a small benefit from it? Every task benefits from the best available surface in some small way; the rule only works if there's a real, checkable threshold (a large panel that will show an undercut vs. a small piece that won't) rather than a vague sense that the important-feeling work deserves the good resource."
  - "What happens when demand for the prime zone from tasks that genuinely need it exceeds the zone's capacity? The footwear-shop rule assumes the periphery can absorb essentially all of the low-priority load. Where the high-priority tasks alone already wear out the prime zone, zoning by task-sensitivity only delays the shared problem, and a capacity or replacement plan is still needed underneath the triage rule."
  - "Does the peripheral zone's own faster degradation eventually create a second-order problem? Routing routine work to the block's ends wears them down faster than the untouched alternative would have; Thornton's own text has to address this directly (rotating and periodically re-leveling the ends), so applying this atom without a plan for managing the periphery's accelerated wear just relocates the maintenance burden rather than eliminating it."
status: active
