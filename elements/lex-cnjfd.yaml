canonical-instances:
  - "A new manager given the title but no real reports or consequential decisions to make (gate one closed) continues to describe herself as 'not really a manager yet' no matter how long she holds the title — access without occasion is inert."
  - "Two driving students log the same number of practice hours; one gets easy, low-traffic routes and handles them cleanly, the other gets thrown into difficult merges and repeatedly needs the instructor to intervene. The first feels like 'a driver' well before the second, despite equal seat-time, because gate two (succeeding at the attempt) was open for one and not the other."
  - "A junior consultant is finally allowed to run a client call solo (gate one opens) but the call goes badly and the client has to be rescued by a senior colleague; rather than accelerating the consultant's sense of being 'a real advisor,' the failed attempt sets it back further than never having had the chance at all."
critical-questions:
  - "Is 'difficulty' doing causal work on identity formation directly, or is it a proxy for something else entirely — visible competence, positive feedback from the role-partner, or simply which students happened to be assigned easier cases to begin with? The essay does not disentangle self-reported difficulty from the possibility that easier families were non-randomly assigned to more capable or more confident students in the first place."
  - "Given gate two, would manufactured, artificially easy successes (deliberately assigning trivially simple tasks to guarantee a low-difficulty experience) produce the same identity shift as a genuine, non-manufactured success — or does the trainee need to believe the task was real and consequential for the mechanism to fire at all?"
