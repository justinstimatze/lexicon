id: lex-dbewf
name: a-conflicted-sources-fix-can-solve-one-threat-create-a-worse-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before adopting a solution offered by a party who benefits from your species' or group's decline, check both whether the source has an undisclosed adverse interest and what the fix actually exposes you to beyond the immediate threat it solves. The Panchatantra's heron, terrified of a snake threatening her chicks, takes advice from a crab — a natural enemy of herons generally, not just this one heron. The crab's private reasoning is explicit: 'he is a natural-born enemy of my race. I will give him such advice — a kind of true lie — that other herons may also perish.' The crab's fix does work against the snake, technically; it also lures a mongoose that wipes out the entire flock. The heron evaluated whether the advice solved the stated problem and never asked what new exposure accepting it created, or why this particular advisor was motivated to help at all."
related: []
evokes: [panchatantra, loss-of-friends, a-conflicted-fix-solves-one-threat-creates-a-worse-one, check-the-advisors-incentive-not-just-the-fix]
lineage:
  - source: primary
    text: panchatantra-ryder1925-a-remedy-worse-than-the-disease
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book I, 'A Remedy Worse Than the Disease' (the heron and the crab). Verified verbatim against a direct extraction of the held copy."
    quote: "After all, he is a natural-born enemy of my race. I will give him such advice—a kind of true lie—that other herons may also perish."
canonical-instances:
  - "a company facing a specific cybersecurity threat accepts a remediation plan from a consulting firm with an undisclosed relationship to a rival, and the plan does eliminate the original vulnerability while quietly introducing a new dependency that leaves the company's entire infrastructure exposed to a threat only the rival's other clients are positioned to exploit."
critical-questions:
  - "Is there any way the heron could have detected the crab's adverse interest in advance, given that the advice itself was 'a kind of true lie' — technically accurate about the immediate threat, which is exactly what made it credible?"
  - "Does this generalize past cases of active malice, to situations where an advisor's incentive is merely misaligned rather than outright hostile — does a fix from a merely self-interested (not enemy) source carry the same hidden-cost risk?"
status: active
