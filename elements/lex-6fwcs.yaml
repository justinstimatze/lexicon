id: lex-6fwcs
name: an-uninterrogated-simulation-naturalizes-its-modeling-choices-as-given
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply when someone learns from, teaches with, or evaluates a simulation — a game, an economic model, a policy-planning tool, a scientific visualization — and the live risk isn't that the simulation is FALSE, but that its specific, contestable modeling choices get absorbed as simply how the domain works, because the simulation never marks them as choices. Bogost's 'simulation gap' names the space this happens in: 'the breach between the game's procedural representation of a topic and the player's interpretation of it.' He rejects the naive behaviorist reading that a faithful simulation directly transfers its content wholesale (Flight Simulator teaches flying, Sim City teaches urban planning) — 'playing a role in a videogame does not automatically imply validation for the behavior the game models.' But he equally rejects the opposite, purely-abstract constructivist reading (games only teach general transferable skills like strategic thinking, content-neutral) as 'not strong enough': 'the underlying models of a videogame found a particular procedural rhetoric about its chosen subjects... the particular representations of taxation in Sim City, of criminality in Grand Theft Auto... are not merely contingent.' His resolved position: a simulation's specific implementation choices ARE a real, particular argument about the subject — Sim City's tax-and-development mechanics are built on Jay Forrester's specific urban-dynamics theory, not a neutral summary of how cities work — and that argument gets absorbed by a player who never interrogates the simulation gap, precisely because good production values and internal consistency make the model FEEL like a transparent window rather than an authored, contestable claim. This is the documented critique of Sim City specifically: 'indoctrinating young people into an American model of taxation' and 'advancing an overly simplistic understanding of urban dynamics' — not because the simulation lied, but because its one, specific, uncontested model of how tax policy affects development read as simply true to players who had no reason to ask what alternative models were left out. Practitioner discipline: before treating a simulation's output as evidence about the real world (or before deploying one for others to learn from), ask what the ONE model embedded in the rules assumes that a different, equally defensible model would assume differently — and whether the simulation gives any way to notice that assumption as a choice rather than a fact. A simulation is often most persuasive exactly where it's least marked as an argument: the parts a user takes for granted, plays through without a second thought, are the parts most likely to be naturalized rather than critically received."
related: [lex-tcrfy, lex-sp7fa]
scaffolds-from: [lex-sp7fa, lex-tcrfy]
evokes: [simulation-gap, procedural-literacy, naturalized-assumptions, sim-city-taxation-critique, forrester-urban-dynamics, behaviorist-vs-constructivist-reading, the-model-is-a-choice-not-a-fact]
lineage:
  - source: primary
    text: bogost-2007-persuasive-games
    citation: "Ian Bogost, Persuasive Games: The Expressive Power of Videogames (MIT Press, 2007), Ch.8 'Procedural Literacy' (pp.233-260 in the print edition). Epub on shelf."
    quote: "'I have previously called the simulation gap, the breach between the game's procedural representation of a topic and the player's interpretation of it.' [On the naive behaviorist reading:] 'Playing a role in a videogame does not automatically imply validation for the behavior the game models... Behaviorist approaches to games foreclose... the simulation gap.' [On Sim City specifically:] 'Sim City has likewise been criticized for indoctrinating young people into an American model of taxation,' [endnote 25] 'and for advancing an overly simplistic understanding of urban dynamics.' [On Sim City's actual model:] 'Under the shiny, credible graphics of Sim City towns is an abstract simulation of urban development, based largely on Jay Forrester's concept of urban dynamics.' [Rejecting the opposite, purely-abstract constructivist reading (Gee's 'situated learning'):] 'I do not want to suggest that Gee's position is invalid, but rather that it is not strong enough. Videogames do not just offer situated meaning and embodied experiences of real and imagined worlds and relationships; they offer meaning and experiences of particular worlds and particular relationships... The underlying models of a videogame found a particular procedural rhetoric about its chosen subjects... The particular representations of taxation in Sim City, of criminality in Grand Theft Auto, and of humanitarianism in Food Force are not merely contingent.'"
canonical-instances:
  - "Sim City's tax-rate slider and its effect on development speed: presented as a simple dial with an obvious correct direction (lower taxes, more growth), it encodes one specific, contested economic model (Forrester's urban dynamics) as if it were the mechanics of taxation itself. A player who never asks 'what would a different economic model predict here' absorbs the game's one answer as the answer."
  - "A corporate financial-planning simulation used in an MBA course, built on one specific theory of market behavior (e.g., efficient-market assumptions) baked into the mechanics rather than flagged as a modeling choice — students who never interrogate why the market in the sim behaves as it does walk away having practiced decisions inside one contested economic paradigm while experiencing it as simply 'how markets work.'"
  - "operationally distinct from lex-tcrfy a-rule-based-systems-constraints-make-an-argument-independent-of-content (Bogost, same book): lex-tcrfy is the general claim that a rule system's constraints ARE an argument, whether legible or not. This atom is narrower and about UPTAKE — what happens when that argument is never noticed as an argument at all, and gets absorbed as neutral fact instead. lex-tcrfy explains why The McDonald's Videogame's corruption-argument works even without text; this atom explains why Sim City's taxation-argument is MORE dangerous than The McDonald's Videogame's, precisely because it doesn't look like an argument."
  - "operationally distinct from lex-sp7fa every-framing-highlights-some-aspects-and-makes-others-invisible: lex-sp7fa covers framing in any medium (a sentence, a photo, a headline) and doesn't require operability. This atom is specific to OPERATED, RULE-GOVERNED models where the naturalization risk comes from the model FEELING transparent and interactive rather than authored — the player builds the taxation outcome themselves, turn by turn, which makes Sim City's specific model harder to notice as a choice than a single framed sentence would be."
critical-questions:
  - "Bogost's own examples (Sim City's taxation model, GTA's criminality) are ones where critics have ALREADY identified the naturalized assumption — is there a reliable way to notice an unmarked modeling choice from INSIDE the simulation, before an outside critic names it, or does this claim only become actionable in hindsight once someone else has already done the interrogation?"
  - "Does marking a model's assumptions explicitly (a 'policy knobs' interface exposing the underlying parameters, which Bogost mentions and is skeptical actually solves the problem) meaningfully reduce naturalization, or does surfacing the knobs just relocate the naturalized assumption one level up (now the KNOB'S range and defaults are the unmarked choice)?"
  - "Is procedural naturalization actually worse than naturalization via other persuasive media (a textbook's uncontested framing, a documentary's editorial choices), or does Bogost's argument that it's specifically DANGEROUS BECAUSE it's interactive rest on an assumption about interactivity increasing credibility that itself needs empirical support rather than being self-evident?"
status: active
