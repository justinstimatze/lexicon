id: lex-ay4et
name: learner-motivation-decomposes-into-attention-relevance-confidence-satisfaction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when designing instruction/training, diagnosing why a course or learner is demotivated, or auditing an existing curriculum's motivational appeal. Keller's ARCS model claims learner motivation is not a monolithic quantity to be raised or lowered — it decomposes into FOUR analytically independent categories, each with its own diagnostic process question: ATTENTION (capturing curiosity — 'how can I make this stimulating and interesting?'), RELEVANCE (perceived personal value/goal-connection — 'in what ways will this be valuable for my students?'), CONFIDENCE (expectancy of success plus perceived personal control over that success — 'how can I help students succeed and control their success?'), and SATISFACTION (reinforcement of accomplishment, intrinsic and extrinsic — 'what can I do to help students feel good about their experience?'). The practitioner move: when an instructional item or whole course isn't landing motivationally, diagnose WHICH of the four categories is actually deficient before reaching for a generic 'make it more engaging' tactic — a learner who is curious and sees the relevance but doesn't believe they can succeed needs a CONFIDENCE intervention (lower initial challenge, attributional feedback), not another attention-grabbing hook; a learner who is confident and satisfied but never saw why the material mattered needs a RELEVANCE intervention, not more rewards. Achieving the first three (attention, relevance, confidence) makes the student motivated to learn; satisfaction is what sustains motivation to continue learning afterward — the four aren't a flat set, they have this partial ordering. Caveat the model explicitly makes: the categories are diagnostically SEPARABLE but not mutually exclusive in deployment — a single well-designed tactic (Keller's example: a rescue-sling training video) can simultaneously stimulate curiosity, demonstrate relevance, and provide vicarious satisfaction, while also requiring a confidence-building follow-up because the depicted task looks dangerous. Use the four-category decomposition as a DIAGNOSTIC LENS on any instructional artifact, not as a checklist requiring one tactic per box."
