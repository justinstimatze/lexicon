id: lex-qg68a
name: subaltern-speech-cannot-register-within-a-framework-constituted-by-her-erasure
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When the speech or self-representation of a structurally-subordinated group fails to register in dominant discourse, do not treat it as a problem of access or amplification alone. The dominant epistemic framework may be constituted in a way that forecloses the speech-as-speech: even when the words are recorded and attended to, they get intercepted, mistranslated, or reabsorbed into pre-existing categories that erase the speech-act's intended meaning. Sympathetic intermediaries (academics, journalists, well-intentioned advocates) often intercept just as the colonial archive did. The diagnostic: trace not just whether the subaltern's words were transmitted, but whether the intended speech-act (what the subaltern was DOING in speaking — refusing, claiming, performing, witnessing) registered as itself rather than as a category the dominant framework was already prepared to hear. The hardest interpretive labor is preserving the speech-act's intended force against the framework's automatic reabsorption."
related: [lex-2rsad, lex-6qevt, lex-et8q2, lex-uqmd7, lex-2sdqf, lex-rsnn7, lex-a3tfj, lex-22kep, lex-3ezh8, lex-k8bsd, lex-44byg, lex-fv4a3, lex-am8cj, lex-5qkj9, lex-t7xcp, lex-5ftak, lex-pch8u, lex-sb7wj, lex-q4kj7]
