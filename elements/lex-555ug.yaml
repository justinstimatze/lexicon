id: lex-555ug
name: shaping-builds-a-target-behavior-by-reinforcing-successive-approximations
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When you want to produce a behavior (or skill, or output, or state) that the subject does not currently produce — and which is too complex to occur spontaneously — the transferable method is SHAPING: identify a behavior the subject CAN already do that resembles the target in some respect, reinforce that, and then progressively raise the criterion so that only closer-and-closer approximations earn reinforcement. The target behavior is BUILT, not waited for. Pryor's central practitioner insight is that shaping is a CREATIVE process: the trainer must decide which dimension of the current behavior to reinforce, when to raise the criterion (and by how much), and when the current step is solid enough to move on. Raising too fast extinguishes the behavior; raising too slow stalls progress. The practitioner test for a shaping plan: can you list the successive approximations between current behavior and target? If not, the plan is aspirational, not operational. Generalizes far beyond animal training: applies to teaching, parenting, habit formation, skill acquisition, organizational change, ML curriculum learning, writing-draft revision, physical therapy, weight loss, behavior of one's own attention. Practitioner discipline: when shaping yourself or others, the failure mode is going FOR the target behavior directly — punishing/criticizing whenever the current behavior falls short — which extinguishes the precursor approximations rather than building from them. Reinforcement of approximations builds; criticism of non-targets extinguishes. The asymmetry is structural, not a matter of preference. Distinct from lex-da3g3 iteration (composition-operator): iteration is the abstract repeat-until-T loop operator; shaping is the SUBSTANTIVE method for choosing what to reinforce at each iteration when the target is a behavior. They compose — shaping IS iteration over approximations with a criterion that rises. Distinct from lex-exrwy counterexamples-refine (Lakatos): counterexamples-refine operates on PROOFS by lemma-incorporation; shaping operates on BEHAVIORS by criterion-raising. Both are progressive-refinement structures, but the objects refined and the move at each step are different. Distinct from lex-wverr natural-goodness (Foot): natural-goodness names the LOGICAL FORM of the evaluation (life-form-grounded); shaping names the METHOD of producing instances that match the form. They compose: shaping is one operational method for building a natural-good-instance, given a target life-form. Distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz names the prescription-to-action transformation; shaping is the operational TOOL that converts a target-state into action-able successive approximations. lex-wtkuz supplies the discipline; shaping supplies the method."
