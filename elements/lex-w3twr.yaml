id: lex-w3twr
name: critical-reasoning-can-outrun-misleading-direct-observation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When direct observation and abstract critical reasoning point in different directions, don't assume the observation is automatically the more reliable of the two -- check whether the observation is reliable locally but misleading about the larger structure it's being generalized from. Popper on Anaximander, whose own symmetry argument implied a globe (equally distant from everything in every direction) while his stated belief stopped at a drum shape: 'What prevented Anaximander from arriving at the theory that the earth was a globe rather than a drum? There can be little doubt: it was observational experience which taught him that the surface of the earth was, by and large, flat. Thus it was a speculative and critical argument, the abstract critical discussion of Thales' theory, which almost led him to the true theory of the shape of the earth; and it was observational experience which led him astray.' The mechanism: Anaximander's observation (the ground looks flat) was accurate at the scale he could check it, and actively wrong about the shape of the whole -- a case where the abstract argument, followed to its logical conclusion, was closer to the truth than the evidence of his own eyes. Diagnostic move: before treating 'but I can see it with my own eyes' as the trump card against a piece of reasoning that points the other way, ask whether what's being observed is a local sample being silently generalized to a global claim -- local flatness generalizing to global flatness is exactly the move that misled Anaximander, and the same shape recurs whenever an observation is true at the scale it was taken and false at the scale it's used to settle."
