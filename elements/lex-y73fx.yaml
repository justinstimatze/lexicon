id: lex-y73fx
name: consulting-omens-instead-of-acting-is-what-actually-causes-the-loss
type-in: posture
type-out: claim
_tier: atomic
agent-instruction: "When you're tempted to wait for a favorable sign before acting on a wealth- or opportunity-related decision, notice that the waiting itself, not the absence of a sign, is usually what produces the bad outcome you were trying to avoid. Kautilya names habitual reliance on omens as one of the obstacles standing between a ruler and the gains available to him, then states the alternative directly: 'Wealth will slip away from that childish man who constantly consults the stars: the only [guiding] star of wealth is itself.' The claim isn't that omens are false in some cosmic sense -- it's a causal claim about mechanism: the 'childish man' loses wealth not because the stars failed to warn him, but because time spent consulting them is time not spent acting, and wealth (unlike a fixed fortune waiting to be read) is produced by action taken on it, so the delay itself is the loss. Calling the omen-consulting man 'childish' locates the error specifically in mistaking an external, uncontrollable signal for the actual causal lever, when the real lever -- effort and initiative directed at the wealth itself -- was available the whole time and required no signal at all. Diagnostic move: when you notice yourself looking for a sign, a favorable moment, or external confirmation before committing to a wealth-producing or opportunity-seizing action, ask whether the search for the sign is itself substituting for the action that would actually produce the outcome -- if the delay has no function other than accumulating more confirmation, the delay is the cost, not a hedge against one, and the corrective isn't a better sign but simply proceeding."
