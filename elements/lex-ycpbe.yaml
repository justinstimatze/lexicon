id: lex-ycpbe
name: escalating-past-the-fastest-imaginable-thing-to-make-decay-felt
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'To make an abstract truth felt rather than merely stated, build a ladder of comparisons the audience finds impressive, each rung sitting at the edge of what they can already picture, then declare the actual point swifter still than the top of that ladder. The escalation does the work a flat assertion could not: by the time the audience reaches the payoff, they have already run out of superlatives, so the claim lands as something beyond anything they had reserved a category for. The Buddha''s own version of the device: "great as the swiftness of such a man might be, great as the swiftness of sun and moon, there is something swifter: great, I say, Brethren, as the swiftness of such a man might be... and though the gods outfly sun or moon in swiftness, there is something swifter than the gods... yet more swiftly than the gods can go, the elements which make up life do decay." In the embedded Jataka tale, the swift Goose demonstrates his own speed by catching four archers'' arrows in mid-air before they touch ground, then undercuts the demonstration itself: "that speed, O great king, is not my swiftest nor my middle speed, ‘tis my slowest of the slow... Swifter than my swiftest a hundredfold, a thousandfold, nay a hundred thousandfold, is the decay of the elements of life in living beings."'
related: []
evokes: [jataka, terasanipata, javana-hamsa-jataka, dalhadhamma-suttanta, rhetorical-escalation, impermanence-made-visceral]
lineage:
  - source: primary
    text: jataka-chalmers1895-javana-hamsa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XIII (Terasanipata), No. 476, Javana-Hamsa-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: 'Swifter than my swiftest a hundredfold, a thousandfold, nay a hundred thousandfold, is the decay of the elements of life in living beings: so they crumble away, so they are destroyed.'
canonical-instances:
  - "A safety trainer, wanting new hires to feel how fast a warehouse accident actually happens, first has them time their own reaction to a dropped object, then shows footage of a professional stunt catch, then states that the machine's crush cycle is still faster than either — landing the real point (react-time training is not optional) only after the audience has run out of faster things to imagine."
critical-questions:
  - "Does the ladder's persuasive force depend on each rung being genuinely, verifiably faster than the last, or does the emotional momentum of escalation work even when a listener could, on reflection, question whether gods are really swifter than the sun?"
  - "Is there a point past which adding more rungs stops building conviction and starts reading as padding — how many escalating comparisons can a payoff bear before the device calls attention to itself?"
status: active
