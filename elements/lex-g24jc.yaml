id: lex-g24jc
name: a-kings-and-a-slaves-shared-ground-is-severed-kinship
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When comparing a society's most powerful figure to its most powerless one, check whether they occupy the identical structural position with respect to ordinary human relationships, despite standing at opposite ends of the power spectrum. Graeber and Wengrow's case: a king who rules equally over all subjects is, by that same logic, kin to none of them in particular -- as a Malagasy proverb puts it, kings have no relatives. A slave is likewise severed from all prior kin attachments by the fact of enslavement. In both cases the only relationships left available to the person are ones based purely on power and domination, because the ordinary web of mutual obligation that would otherwise constrain or support them has been stripped away. The king and the slave are, structurally, standing on the same ground -- kinlessness -- and differ only in which end of the power differential that shared condition happens to land them on."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, kings-have-no-relatives, slavery, kinship, sumerian-temples]
lineage:
  - source: primary
    text: dawn-of-everything-kings-have-no-relatives
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.12 'Conclusion.'"
    quote: "“kings, as the Malagasy proverb puts it, ‘have no relatives’ – or they shouldn't, since they are rulers equally of all their subjects. Slaves too have no kin; they are severed from all prior attachments.”"
  - source: primary
    text: dawn-of-everything-same-ground
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.12 'Conclusion.'"
    quote: "“In structural terms, and as against almost everyone else in society, kings and slaves effectively inhabit the same ground. The difference lies in which end of the power spectrum they happen to occupy.”"
canonical-instances:
  - "The direct textual anchor, on how this played out institutionally in early Mesopotamia: Sumerian war-kings “were able to insert themselves into institutional spaces once reserved for the care of the gods, and thus removed from the realm of ordinary human relationships,” the same institutional space that also absorbed war captives and slaves bereft of family support."
  - "Hypothetical: a multinational corporation's CEO, who reports to no one inside the company and whose every relationship with staff is mediated by formal authority, and a contract warehouse worker hired through a staffing agency with no direct employment relationship, seniority, or standing to grieve mistreatment, turn out to be the only two people in the entire organization with no one who owes them anything outside of pure positional power -- everyone in between has colleagues, mentors, and reciprocal obligations neither of them has access to."
critical-questions:
  - "Is 'kinlessness' really doing the causal work here, or is it just a consequence both positions happen to share for entirely different reasons? A king's isolation stems from a deliberate ideology of impartial rule; a slave's stems from violent forced severance. The shared label might obscure two causally unrelated phenomena rather than reveal one underlying structure."
  - "How far does the parallel actually hold once real historical kings are examined closely -- many rulers maintained extremely close, politically consequential relationships with specific family members (mothers, favored children, in-laws), which would seem to undercut the claim that kingship structurally requires or produces kinlessness rather than just an idealized description of it?"
status: active
