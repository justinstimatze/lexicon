name: flattery-inflates-confidence-then-the-stake-arrives-after-you-cant-back-out
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When someone praises your skill right before proposing a contest or risk, and only names what's actually at stake once you're already committed to trying, recognize both halves as parts of the same manipulation rather than two separate, unrelated moments. In Zitkála-Šá's telling, Iktomi opens with calibrated flattery -- 'you are a skillful fellow who finds nothing hard to do' -- to a turtle who has just admitted 'I fear I cannot do it,' talking him into a reckless leap over a carcass. Only after Patkasa is already positioned to run, mid-preparation, does Iktomi add the real stake: 'Let the winner have the deer to eat!' The text names exactly why the timing works: 'It was too late now to say no. Patkasa was more afraid of being called a coward than of losing the deer.' Announced first, the stake would have let Patkasa weigh the actual risk before committing to anything; announced only after the social commitment to try was already locked in by the flattery, withdrawing now would mean visibly confirming the coward label the flattery had just talked him out of accepting. The two moves aren't independent errors in judgment -- the flattery's job is to manufacture a commitment that can't be un-made without a face-losing reversal, and the stake only gets revealed once that commitment is irreversible enough to make the real risk beside the point. Diagnostic move: when a compliment about your competence immediately precedes a proposed contest or risk, treat the compliment as a possible setup rather than genuine encouragement, and specifically ask what the actual stakes are before doing anything that would count as a commitment to proceed -- if the other party is reluctant to name the stakes until after you're already moving, that reluctance is itself the tell."
