id: lex-r4x7h
name: distancing-from-your-own-group-buys-approval-from-the-dominant-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Gössl names a pattern he calls queer, recognition-based envy: some members of a stigmatized minority publicly distance themselves from, or show disdain toward, other members of the same minority who are more visibly nonconforming to majority norms. He frames this as transactional rather than as simple internalized shame. Showing solidarity or recognition to a more visibly deviant member of your own group is itself legible to the dominant group as reduced conformity, and costs you some of the approval you're pursuing from that dominant group. Withholding recognition from your own people is the payment; the majority's approval is the thing purchased. He frames the underlying tension as a pendulum between two incompatible wants: the wish to unfold freely as an individual against the need to be valued for conforming, with the reference point for what counts as 'too deviant to associate with' being arbitrary and constantly shifting -- wealth, success, sexuality, beauty, culture, whatever axis is currently under majority scrutiny. Transferable diagnostic: when a member of any stigmatized or subordinate group publicly criticizes, mocks, or refuses solidarity with a more visibly nonconforming member of that same group, don't assume the critic has simply absorbed the majority's judgment as their own sincere belief. Check whether the distancing is doing transactional work -- whether the act of publicly not-recognizing a fellow group member is functioning as currency the distancer is spending to buy standing with the group whose approval actually controls their outcomes. The tell is whether the target of the distancing shifts opportunistically to track whatever the dominant group happens to be scrutinizing at the moment, rather than tracking a stable personal conviction about what's actually wrong with the target's behavior."
related: [lex-pnh7q, lex-t7xcp, lex-mzzgc]
evokes: [goessl-2024-great-queer-provocation, queer-envy-of-recognition, horizontal-distancing, respectability-as-currency, minority-stress, buying-majority-approval, sideways-disdain, conformity-pendulum]
lineage:
  - source: primary
    text: goessl-2024-great-queer-provocation
    citation: "Martin J. Gössl, Great Queer Provocation: The Seriously Playful Recognition Game, trans. Henry Holland (transcript Verlag, Bielefeld, 2024), Chapter 10, 'Queer Envy of Recognition.'"
    quote: "'Recognizing queer others means reducing one’s own capacity to conform to the norm, and reduces the appreciation shown for the subjugation presented. This humiliation leads to distancing, disdain, and animosity within the queer community—if only through this, it knows it will be appreciated by its own heteronormative equivalent. Queer, recognition-based envy is a pendulum swinging between one’s own wish to unfold freely as an individual, and the overwhelming greed/need to be valued for conforming.'"
canonical-instances:
  - "Politics of respectability within Black American communities (E. Frances White 2001, Evelyn Brooks Higginbotham 1993): some members of the community publicly police other members' dress, speech, or conduct as insufficiently respectable, partly as a strategy for demonstrating the whole community's fitness for white approval -- the disdain lands sideways, on fellow members, while its actual audience is the dominant group."
  - "A newly promoted employee from an underrepresented background publicly distances themselves from a colleague's workplace accommodation request or advocacy, worried that visible association with 'too much asking' will read to leadership as their own insufficient conformity to the unstated performance norms that got them promoted."
  - "Operationally distinct from lex-pnh7q the-same-defection-is-renegade-to-one-group-convert-to-another: that atom is about how the SAME act of leaving a group gets opposite labels depending on which group is doing the labeling. This atom is about a member who has NOT left the group at all, still identifies with it, but performs public disdain toward fellow members as a transaction with a different, dominant audience."
  - "Operationally distinct from lex-t7xcp common-oppression-claim-erases-intra-group-stratification-when-appropriated-by-the-privileged: that atom is about a PRIVILEGED outsider appropriating a shared-oppression claim to flatten real stratification within the group they're joining. This atom is about a genuine INSIDER member of the stigmatized group who distances from other insiders, not about an outsider claiming insider status."
critical-questions:
  - "How do you actually distinguish transactional distancing from sincere disagreement about where a subculture's boundaries should be drawn? Not every act of a group member criticizing another member's conduct is this mechanism -- the diagnostic Gössl offers is whether the standard being applied moves to track whatever the dominant group currently scrutinizes, rather than staying fixed to an independently held position."
  - "Does naming this mechanism risk delegitimizing every internal critique a minority group makes of its own members, treating all internal disagreement as secretly about majority approval? Gössl's own framing keeps this narrower: the mechanism explains a specific envious, humiliation-driven pattern, not the existence of legitimate internal disagreement or accountability within any community."
  - "Who benefits from this dynamic being framed as an individual psychological failing (envy) rather than a predictable response to a structural incentive (approval from the dominant group is genuinely scarce and genuinely valuable, and this is one of the few levers an individual member actually controls)? Treating it purely as a character flaw in the distancer, rather than also as evidence of the incentive structure the whole group operates under, may let the structural cause escape scrutiny."
