id: lex-jbfer
name: repeatedly-aiming-without-firing-breaks-resistance-more-than-one-shot
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Demonstrating lethal capability repeatedly without using it can break someone's resolve more completely than actually using it once, because each unfired shot proves both that you could have ended things and that you chose not to, forcing the other party to sit inside that gap rather than resolving it either through death or through relief. In Radin's Winnebago Hare Cycle, having drawn a bear out of hiding, Hare doesn't kill it. He points an arrow at it, waits, and doesn't fire. He does this a second time, aimed now at the heart, and still doesn't fire. Only on the fourth aim does the bear's resistance collapse entirely: 'The fourth time Hare pointed the arrow at the bear he began to cry.' Hare's mockery afterward names exactly what happened: 'So you are not as strong-minded as you thought? ... This is what human beings could do to you... If I had been one of your uncles you would have been killed by this time.' The bear surrenders completely, permanently changing its own behavior toward every future hunter: 'From now on the people will be able to find me whenever they hunt for me.' A single shot would have ended the encounter with either death or a miss. The repeated, deliberate non-firing is what produced total, voluntary capitulation. Diagnostic move: when you have real leverage over someone and want lasting behavioral change rather than a one-time outcome, consider whether repeatedly demonstrating the capability without using it, making clear each time that the restraint is a choice, produces more durable submission than exercising the leverage once would."
