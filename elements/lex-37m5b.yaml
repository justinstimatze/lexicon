lineage:
  - source: primary
    text: sen-1970-arrows-general-possibility-theorem-editorial-grouping
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 3, Collective Rationality, Section 3.3, The General Possibility Theorem, p.79, together with the theorem's individual conditions as Sen examines them across Chapter 2 (the Pareto criterion), Chapter 3.4 (independence of irrelevant alternatives), and Chapter 4.2 (Collective Choice and Arrow's Conditions) -- a structure the book examines piece by piece across four chapters but does not itself gather into one decomposed molecule the way this entry does. Two of Arrow's four named conditions, unrestricted domain and non-dictatorship, are not separately atomized elsewhere in this corpus as of this molecule's minting and are flagged MISSING rather than forced from unrelated material."
    quote: The theorem's own four conditions and its core impossibility claim are each independently atomized already; the grouping into one molecule, and the identification of the two unmined conditions, is this corpus's editorial synthesis rather than a sentence Sen states in one place.
canonical-instances:
  - "Sen's own summary line, quoted directly in lex-jjbt3's lineage: 'The rather stunning theorem that Arrow proved is that there is no SWF that can simultaneously satisfy all these four conditions, mild as they look. Each looks innocuous enough, but together they seem to produce a monster that gobbles up all the little SWFs in the world.'"
  - "Hypothetical: a hiring committee drafts a wishlist for a candidate-ranking process -- it must handle any possible slate of applicants, it must respect a hiring manager's unanimous preference between two finalists, it can't let a withdrawn or clearly-unqualified applicant's position on the list change the ranking between the two finalists, and no single committee member's vote can automatically decide the outcome. Each requirement sounds reasonable in isolation; the committee never checks whether all four together are even possible before adopting them as fixed ground rules."
critical-questions:
  - "the two missing conditions (unrestricted domain, non-dictatorship) were checked against the rest of this corpus via a distinctness search and nothing else genuinely covered either one -- does that mean they're genuinely absent from the corpus's other 3900-plus atoms, or does it mean the search simply failed to surface a real match, the same failure mode already documented elsewhere in this corpus's own mining notes?"
  - "this molecule gives all four conditions equal billing in stating the theorem, but Sen's own text spends far more space critiquing Pareto and IIA than the other two -- does that reflect genuine relative fragility among the conditions (some are more often violated in practice, or more often defended), or just where Sen's own expository interest happened to land?"
