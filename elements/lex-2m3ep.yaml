id: lex-2m3ep
name: exit-barriers-keep-losers-competing-and-depress-everyones-returns
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A market's collective profitability can stay depressed indefinitely not because the surviving competitors are badly run, but because the mechanism that would normally clear out failing competitors — the ability to exit cheaply — is structurally blocked, so weak players keep operating and keep the whole market oversupplied. Porter's 1979 analysis names the mechanism as a structural feature of an industry, not a psychological failing of any one manager: 'Exit barriers are high. Exit barriers, like very specialized assets or management's loyalty to a particular business, keep companies competing even though they may be earning low or even negative returns on investment. Excess capacity remains functioning, and the profitability of the healthy competitors suffers as the sick ones hang on.' The critical feature is that this is a STRUCTURAL drag on the entire market, not a story about any single actor's poor judgment: even a perfectly well-run, healthy competitor cannot escape the depressed returns, because the failing competitors' continued presence keeps supply above what demand supports, holding prices down for every participant regardless of that participant's own performance. This is distinct from an individual firm's sunk-cost bias (continuing to invest because of what's already been spent) — the mechanism here is that specialized, hard-to-redeploy assets or non-financial commitments (management's identity tied to the business) make LEAVING itself costly, independent of whether continuing to operate is rational for that firm in isolation. Generalize beyond industrial capacity: a declining professional field stays overcrowded and underpaid because credentialed practitioners have sunk years of specialized training that has no value outside the field, so they keep competing for shrinking work rather than exiting; a dying product category stays price-competitive and unprofitable for every seller because manufacturers have specialized tooling with no other use, so none of them shut down the line; an online platform's ad rates stay suppressed because marginal publishers with no alternative revenue model keep publishing rather than shutting down, since their only asset (their existing audience/content archive) has no value outside the platform. The diagnostic move: when an entire market or field stays unprofitable longer than seems rational, look for what makes EXITING costly for the weakest participants specifically — the drag on everyone else's returns traces back to what's trapping them in, not to anything wrong with the healthy competitors' strategy."
