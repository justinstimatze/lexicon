id: lex-p3vqz
name: seed-a-recruitment-network-with-real-help-then-let-it-cascade
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to build a large network of people willing to work for you covertly or informally, don't recruit by direct pitch to strangers one at a time — seed the network with a genuinely useful, real cover activity that creates real beneficiaries, then recruit from among the people your own genuine help has already put in your debt, and let each new recruit repeat the same cascade. Kautilya's method for building the base layer of an intelligence network works exactly this way: a cover agent (posing as a monk, farmer, or trader) is 'provided with plenty of money and assistants' and told to 'pursue a [profitable] occupation at the places assigned to them.' Critically, the profits are not simply pocketed or used only to fund espionage directly — 'out of the profits, they shall give others [monks, farmers, or traders as applicable] food, clothing and shelter,' meaning the cover activity does real, valuable, non-manipulative charitable work first. Only then does recruitment happen, and it happens from inside that pool of real beneficiaries rather than from cold outreach: 'Among those thus helped, the ones who want to earn money shall be recruited to act as spies using the appropriate cover.' The final step is what converts a one-time recruitment effort into a self-sustaining network: 'with the new recruits also recruiting others, a network of spies shall be set up' — each person recruited through this process becomes a new node capable of running the identical cascade (do real, valuable cover work; identify who among the beneficiaries wants more; recruit them), rather than every new member having to be personally sourced by the original organizer. The mechanism's strength is that it doesn't rely on ideological persuasion or pure payment to close each individual recruitment — it relies on a pre-existing debt of genuine gratitude that makes the ask land differently than a cold approach would, while the cascading structure means the network's growth rate compounds rather than staying linear with the founder's own personal recruiting effort. Diagnostic move: when trying to grow a network of committed participants (informants, brand advocates, community organizers, referral-based sales), check whether the growth model depends on the founder or a small core team doing all the direct recruiting, or whether it's structured so that each new participant does real, valuable work first and then recruits from among the people that work genuinely helped — the second structure scales in a way the first cannot, because recruiting capacity grows with the network rather than staying bottlenecked at the top."
