id: lex-tmy67
name: non-random-selection-into-sample-produces-bias-equivalent-to-an-omitted-variable
common-name: "Selected sample, biased answer"
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When estimating a relationship from a sample that wasn't drawn at random from the target population — self-selection (only employed women have observable market wages; only completers stay in the panel), analyst-imposed selection (intact families, attriters dropped), filter-by-outcome (looking only at successful startups) — treat the selection rule as a missing-data problem and ask 'why are these observations the ones I have?' If the variable that drove selection is correlated with the outcome of interest, the regression is misspecified the same way as if you'd dropped a confounder. The corrective isn't more data — it's modeling the selection mechanism."
related: [lex-4697f, lex-4yhqs, lex-6pd48, lex-7tvr6, lex-875gz, lex-j98sj, lex-nx7u7, lex-s7jjg, lex-smney, lex-tfpzb, lex-vgfgh, lex-yejp2]
scaffolds-from: [lex-6pd48, lex-vgfgh]
evokes: [why-are-the-data-missing, the-cases-you-have-are-not-the-cases-you-want, selection-on-the-thing-youre-measuring, two-stage-correction, drop-the-attriters-lose-the-answer]
lineage:
  - source: primary
    text: heckman-1979-sample-selection-bias
    citation: "James J. Heckman, 'Sample Selection Bias as a Specification Error,' Econometrica 47(1):153-161 (January 1979). Abstract + Section 1 'A Simple Characterization of Selection Bias.' The paper formalizes self-selection (wages of working women, union members, migrants, trainees) and analyst-selection (drop attriters in panel data, require intact families) as the SAME structural problem: regression on the selected sample confounds the behavioral parameters of interest with parameters of the function that determined entry into the sample. Heckman's two-stage correction (estimate the selection equation first, use the predicted inverse-Mills-ratio as a regressor in the outcome equation) is the canonical fix; the transferable atom is the underlying claim that selection-induced bias IS a specification error, not a sample-size problem."
    quote: "[Heckman 1979 Abstract, p.153 —] 'This paper discusses the bias that results from using nonrandomly selected samples to estimate behavioral relationships as an ordinary specification error or \"omitted variables\" bias.' [Section 1 opening, p.154 —] 'Such procedures have the same effect on structural estimates as self selection: fitted regression functions confound the behavioral parameters of interest with parameters of the function determining the probability of entrance into the sample.' [The decisive operational question, p.154 —] 'Suppose that one seeks to estimate equation (1a) but that data are missing on Y1 for certain observations. The critical question is \"why are the data missing?\"'"
  - source: practitioner
    text: methodology-canon
    citation: "Heckman 1979 is the founding citation for the 'selection bias' diagnostic across applied econometrics, labor economics, evaluation research, epidemiology (where the structurally-identical Berkson-1946 paradox arose 33 years earlier in case-control studies), and causal-inference more broadly. The 2000 Nobel Memorial Prize in Economic Sciences cited the development of this method explicitly. The atom is transferable because the failure mode appears outside formal regression — anywhere a non-random filter precedes measurement of a relationship."
canonical-instances:
  - "Heckman's own canonical case (1979 §0): market-wage regressions estimated only on working women understate the relationship between wages and observables because the women who chose to work are precisely those whose market wage exceeded their home wage — selection ON the outcome variable. The fix is not 'more women in the sample'; it's modeling the labor-force-participation decision as the first stage"
  - "panel-data analyses that drop attriters: 'stability of the family unit imposed as a requirement for entry into a sample' (Heckman §0). The dropped observations aren't missing at random — attrition correlates with the outcome being studied (divorce predicts both attrition and family-income changes). Same structural problem as self-selection"
  - "venture-capital returns estimated from observable funds: the data set is the surviving funds; failed funds disappear from the rolls. Reported returns systematically overstate the asset class because selection is on outcome (lex-tfpzb survivorship is the limiting case of this atom — Heckman names the general structure of which survivorship is a specific instance)"
  - "online-survey results: respondents are self-selected on willingness-to-respond, which correlates with the topic. Polls of 'what fraction of people read books?' over-sample readers because non-readers don't open the survey email. The corrective is to model response-propensity, not collect more responses"
  - "ML model evaluation on production traffic: cases that survive the upstream filter (e.g., posts that aren't deleted by spam classifiers, queries that aren't refused by a guardrail) are the only cases the downstream model sees. Performance on the filtered population over-estimates performance on the unfiltered population by exactly the amount the filter correlates with task difficulty"
  - "per-protocol analysis in RCTs: analyzing only the patients who completed the protocol throws away the intent-to-treat property. Non-completers correlate with both side-effects and underlying disease severity; the per-protocol estimate of efficacy is biased toward stronger effects than the population would experience. The discipline is ITT analysis, but the substrate-claim is the underlying selection-bias structure"
  - "post-hoc 'successful startups' analyses (the entire how-to-succeed business-book genre): comparing successful companies on dimensions X, Y, Z without comparing to the equally-large population of failed companies that ALSO had X, Y, Z is sampling on the outcome. The narrative pattern survives in popular books because the failure cases are conveniently invisible"
  - "operationally distinct from lex-tfpzb survivorship-bias: survivorship is the SPECIAL CASE where selection is precisely 'made it through'; Heckman selection is the GENERAL CASE where any variable correlated with outcome drives selection. Survivorship is transferable as a recognizable folk-name; this atom is the underlying mechanism that explains why survivorship is biased AND why panel attrition, self-selection, and analyst-filters all produce the same shape of error"
  - "operationally distinct from lex-6pd48 intervention-and-observation-induce-different-distributions (Pearl do-operator): Pearl names that observational P(Y|X) ≠ interventional P(Y|do(X)) when there's confounding. Heckman names the special case where the selection of which (X, Y) pairs you OBSERVE is itself the confounder. Pearl is the upstream causal-inference framework; Heckman is one specific failure mode it predicts"
critical-questions:
  - "what is the selection rule, and is it stated explicitly? Heckman's discipline starts with naming the function that determined who entered the sample. If you can't write it down, you can't model it, and you can't tell whether the bias is small or fatal. Practitioner-test: can you write the selection equation? If not, you're inferring from a filter you haven't characterized"
  - "is the selection ON observables or unobservables? If selection is fully explained by variables you measure (selection on observables), inverse-probability-weighting or matching corrects it. Heckman's specific contribution is selection on UNOBSERVABLES — the selection rule depends on a latent that ALSO affects the outcome. The two-stage method estimates the latent's effect via the joint distribution. Practitioner-discipline: name which variables drove selection AND whether you observe them"
  - "is the selection variable correlated with the outcome? If selection is on a variable uncorrelated with the outcome you're estimating, the selection is 'ignorable' (Rubin's term). Selection bias requires correlation between selector and outcome. Practitioner-question: can you argue selection is uncorrelated with outcome? If yes, the regression is OK; if not, the regression is biased and Heckman's question — 'why are the data missing?' — has to be answered before the estimate means anything"
  - "is the corrective 'more data' or 'model the selection'? The lex-tmy67 trap is treating selection-bias as a sample-size problem ('we just need a bigger sample of working women / surviving funds / successful applicants'). More data from the SAME selection process produces the same bias more precisely. The corrective is structural — either model the selection mechanism, or change the sampling design so the rule no longer correlates with outcome"
  - "how does this relate to lex-nx7u7 base-rate-neglect? Both involve failure to properly condition probabilities, but at different stages: base-rate-neglect is failure to weight prior P(category) in diagnostic inference; selection-bias is failure to weight P(in-sample | latent) in estimation. Same underlying Bayesian discipline, different operational moment. They can co-fire — e.g., diagnostic screening on a self-selected high-risk subpopulation — and the transferable consequence is the same: priors and selection probabilities have to be made explicit, not assumed flat"
status: active
