    citation: "Mary E. W. Goss, \"Change in the Cornell Comprehensive Care and Teaching Program\" (1957), p.259."
    quote: "'The Program's Nursing Coordinator, for instance, felt she was doing no more than her duty when she reported to the C. C. & T. P. staff that a few students... had complained to her that they could \"hardly give comprehensive care in the Medical Clinic as we're supposed to when a patient has to leave the Clinic and make a special trip to the Minor Surgery Clinic just to have a little dressing changed!\" She believed it well within the confines of her role to suggest at a staff meeting that \"this situation could be remedied quite easily by the addition of a surgical dressing tray as standard equipment for the General Medical Clinic.\" Doing one's job well, then, encompassed participation in this process of adapting the organization to existing conditions; helping was not a gratuitous favor, extraneous to other duties.'"
  - source: primary
    text: goss-1957-part-time-attendings-less-involved
    citation: "Mary E. W. Goss, \"Change in the Cornell Comprehensive Care and Teaching Program\" (1957), p.259."
    quote: "'Not all of the groups who functioned in the Program, however, were as concerned with improving the organization. While full-time staff physicians, consultants, social service, nursing personnel, and — to some extent — students shared the general sort of responsibility which has been described, the part-time attending staff as a group was less involved... When, for example, several of these physicians were asked whether they \"would recommend any changes in the Program,\" the majority had no improvements to suggest.'"
canonical-instances:
  - "A restaurant where every server, not just the manager, is expected to flag when a menu item keeps coming back wrong sees problems fixed within a shift; a chain where only shift managers are expected to notice such patterns sees the same problem recur for months because line staff never considered noticing it part of their job."
  - "An engineering team culture where any engineer, not only tech leads, is expected to file and even fix small process friction (a flaky test, a confusing onboarding step) catches and resolves far more small problems than a team where 'process improvement' is understood to be the tech lead's exclusive lane — but a team's contractors or part-time consultants, never explicitly folded into that norm, keep quiet about the same friction even after months on the team."
critical-questions:
  - "Does diffusing improvement-duty this broadly risk contradictory or redundant fixes proposed by different roles for the same problem, with no clear owner to reconcile them — and did Goss's account simply not surface a case where this went wrong, or did the small size of a single-year pilot program avoid the problem that would appear at larger scale?"
  - "The part-time attendings' disengagement could reflect exclusion from the diffused-responsibility norm, OR it could simply reflect that anyone spending only one or two half-days a week has genuinely less basis to notice patterns worth fixing. How would you distinguish 'this role was never folded into the norm' from 'this role's low time investment makes noticing genuinely harder,' since Goss's data can't separate the two?"
status: active
