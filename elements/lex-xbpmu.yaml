lineage:
  - source: primary
    text: lopez-alt-2015-the-food-lab
    citation: "J. Kenji López-Alt, The Food Lab: Better Home Cooking Through Science (W. W. Norton & Company, 2015), chapter on roast turkey, section 'What About Brining?'"
    quote: "'Some sources attribute it all to osmosis -- the tendency for water to move across a membrane from an area of low solute concentration to an area of high solute concentration. [...] But this theory is not quite accurate. If it were, then soaking a turkey in pure unsalted water should be more effective than soaking it in a brine, and we've seen that that is not the case. Moreover, if you soak a turkey in a ridiculously concentrated brine (I tested turkey in a fully saturated salt solution), according to the osmosis theory, it should dry out even more. [...] However, I found that despite turning the turkey inedibly salty, a highly concentrated 35-percent salt solution was just as effective as a more moderate 6-percent salt solution at helping the turkey retain moisture, indicating that there's something else going on here.'"
canonical-instances:
  - "The same chapter runs an analogous extreme-value test on the baking-soda-browning claim: rather than confirm baking soda browns pancakes at one normal dose, López-Alt varies the amount in eighth-teaspoon increments from none up to a full half teaspoon per batch, tracing out where the browning effect actually saturates or continues, rather than reporting a single before/after comparison."
  - "Newton's original prism experiments (Opticks, 1704) are the classical instance of the same structural move: rather than merely confirming that a prism produces colored light (consistent with both the standard theory that the prism itself adds color and Newton's rival claim that white light already contains all colors), Newton isolated a single color with a second prism and re-refracted it, pushing the test to the point -- an already-separated color band -- where the two theories predict different outcomes (further splitting vs. no further change)."
  - "A product team debating whether a new onboarding flow's higher signup rate is caused by the flow's clearer copy or by its shorter form doesn't resolve the question by rerunning the A/B test with the same two variants -- both explanations already predict the observed result. Testing a version with the clear copy but the original long form (or vice versa) isolates the mechanism at the point where the two explanations disagree."
  - "Operationally distinct from lex-zag9z cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity-not-consistency: that atom is about scoring EXISTING evidence for how well it discriminates between hypotheses already in hand. This atom is about actively DESIGNING a new experimental condition, chosen specifically because it is the point where the hypotheses' own predictions come apart -- it operates upstream, at test-design time, rather than downstream at evidence-weighing time."
  - "Operationally distinct from lex-v6nqz eliminative-paired-comparison-isolates-cause-by-presence-absence-of-circumstances: Mill's method of difference isolates a cause by holding everything constant except the SUSPECTED CAUSE'S presence or absence. This atom holds the suspected cause present in both conditions and instead varies its MAGNITUDE to a value chosen because two rival mechanisms, both already consistent with the moderate case, predict different magnitudes of effect at the extreme."
critical-questions:
  - "How do you find the diagnostic extreme before running the test, rather than by luck? It requires actually working out each rival mechanism's quantitative prediction in advance. Osmosis predicts water uptake that keeps climbing as concentration rises. The competing protein-denaturation story instead expects the effect to level off once enough salt has already dissolved the available muscle proteins, with any further salt adding nothing more. Skipping that derivation leaves no principled basis for picking a test point at all -- you'd just be guessing which concentration to try."
  - "Does pushing to an extreme risk leaving the normal operating range entirely, so that even a clean result at the extreme doesn't tell you what's happening under ordinary conditions? A 35-percent brine is far outside any turkey anyone would actually eat; the inference back to the 6-percent case assumes the same mechanism operates continuously across that whole range, an assumption the extreme test itself does nothing to confirm."
  - "A test designed to discriminate between two named hypotheses can rule one in relative to the other while still missing the true mechanism, if the real explanation was never on the list to begin with. López-Alt's own answer -- protein denaturation loosening the fiber sheath -- is a hypothesis the saturated-brine test made more likely than osmosis, but did nothing to independently confirm on its own terms. What happens when both named theories are wrong and something entirely unaccounted-for is driving the extreme-case result?"
