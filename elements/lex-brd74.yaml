id: lex-brd74
name: piecemeal-reform-targets-concrete-evils-not-utopian-blueprints
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When choosing what a reform effort should aim at, check whether the stated target is a specific, currently-experienced harm or a positive vision of an ideal end-state -- Popper argues these two targets differ in kind: only one of them is something people who disagree about everything else can actually agree on. Popper's own formula, offered as a direct alternative to Utopian blueprint-building: 'Work for the elimination of concrete evils rather than for the realization of abstract goods. Do not aim at establishing happiness by political means. Rather aim at the elimination of concrete miseries. Or, in more practical terms: fight for the elimination of poverty by direct means -- for example, by making sure that everybody has a minimum income. Or fight against epidemics and disease by erecting hospitals and schools of medicine. Fight illiteracy as you fight criminality. But do all this by direct means.' His reason isn't aesthetic preference for modesty over ambition -- it's that concrete evils are the kind of thing people who disagree about everything else can still recognize and agree are evils, because they're being experienced right now by people who can describe them; an ideal vision of the good society is known only from dreams, cannot be argued about, and can only be proclaimed. Aiming at the removable evil gives reform something to test itself against and something opponents can actually be brought to agree exists; aiming at the ideal good gives reform nothing to check itself against except its own blueprint. Diagnostic move: when a reform proposal states a vision of what should exist, try substituting a list of the specific harms it's meant to remove. A proposal that resists this substitution is likely running the Utopian-blueprint move, which per [[lex-djru4]] tends to carry real coercion costs downstream."
related: [lex-djru4]
scaffolds-from: [lex-djru4]
evokes: [popper-1963-conjectures-and-refutations, popper-utopia-and-violence, concrete-evils-not-abstract-goods, piecemeal-social-engineering, fight-poverty-by-direct-means, minimum-income-proposal, elimination-of-concrete-miseries]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Utopia and Violence' (address delivered to the Institut des Arts, Brussels, June 1947; first published in The Hibbert Journal 46, 1948), Ch. 18 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), p.485."
    quote: "'Work for the elimination of concrete evils rather than for the realization of abstract goods. Do not aim at establishing happiness by political means. Rather aim at the elimination of concrete miseries. Or, in more practical terms: fight for the elimination of poverty by direct means -- for example, by making sure that everybody has a minimum income. Or fight against epidemics and disease by erecting hospitals and schools of medicine. Fight illiteracy as you fight criminality. But do all this by direct means.'"
canonical-instances:
  - "A city council debating homelessness policy splits between a faction proposing 'a comprehensive vision for a city where housing is a human right' and a faction proposing 'fund 200 more shelter beds and a rapid-rehousing fund this fiscal year.' Both factions may want the same eventual world, but only the second target is something the council can actually vote on, fund, and check next year -- the first is a banner to rally behind or against; the second is a policy the council can actually be held to."
  - "A nonprofit's mission statement promises to 'end injustice and build a fairer world'; its actual grant applications name specific evils -- a named county's food-desert rate, a named clinic's wait-list length. Funders and skeptics alike can verify progress against the second kind of target; the first kind absorbs any amount of activity without ever being falsifiable as done or not done."
  - "operationally distinct from lex-acyqk breaking-an-unliftable-whole-into-pieces-makes-it-tractable: lex-acyqk is about decomposition as a general problem-solving move (any large task benefits from being cut into smaller ones); this atom's claim is narrower and specifically about the TARGET a reform effort decomposes toward: a named, experienced harm keeps the effort arguable and checkable; a positive ideal doesn't, regardless of how small the pieces get."
critical-questions:
  - "Doesn't 'fight poverty' still require some notion of what a non-impoverished life looks like -- some implicit positive vision? Popper would grant a minimal one is unavoidable (enough income, enough health, literacy), but the claim is narrower than 'never have any positive idea' -- it's that the TARGET a reform effort organizes itself around and is held accountable to should be the removal of a named, currently-felt harm, not a fully specified blueprint of the resulting good society. The minimal positive content smuggled into 'eliminate poverty' is far less contestable than a blueprint for the ideal economic order."
  - "Can concrete-evils reform still drift into something blueprint-like if enough of them get chained together into one master program? Popper doesn't rule this out as a risk, and this atom doesn't claim piecemeal reform is immune to Utopian capture -- the diagnostic is per-target (is THIS proposal a named harm or a vision?), not a permanent inoculation once a movement adopts piecemeal language. A reform program that starts concrete can still calcify into a fixed distant aim; that's exactly the condition [[lex-djru4]] describes."
status: active
