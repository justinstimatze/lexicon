id: lex-jqz9f
name: pleasure-granted-by-another-differs-from-pleasure-earned-by-your-own-deeds
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Two experiences of pleasure can be sensorially identical in the moment and still differ in what they actually are, if one is a grant from someone else's continuing supply and the other is the direct product of your own action — the granted kind is functionally borrowed, contingent on the giver's will, and this difference surfaces precisely once the supply runs out, revealed as never having been truly yours. In the Jataka's tale, King Sadhina, having been carried bodily to heaven and enjoying seven hundred years of divine pleasure that was Sakka's gift rather than his own earned merit, articulates the distinction the moment his allotted pleasure begins to fade: \"As when a chariot, or when goods are given on demand, / So is it to enjoy a bliss given by another's hand... I care not blessings to receive given by another's hand, / My goods are mine and mine alone when on my deeds I stand.\""
related: []
evokes: [jataka, pakinnakanipata, sadhina-jataka, granted-pleasure-versus-earned-pleasure, borrowed-goods-as-a-model-for-contingent-happiness]
lineage:
  - source: primary
    text: jataka-chalmers1895-sadhina-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XIV (Pakinnaka-Nipata), No. 494, Sadhina-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "As when a chariot, or when goods are given on demand, / So is it to enjoy a bliss given by another's hand... I care not blessings to receive given by another's hand, / My goods are mine and mine alone when on my deeds I stand."
canonical-instances:
  - "A retiree who spent decades building a company notices that the comfort of an inherited family fortune, however lavish, never satisfies the way a single hard-won contract used to — the inherited comfort is real, but it isn't answerable to anything they did, and its absence of that answerability is the thing they can feel."
critical-questions:
  - "Sadhina's dissatisfaction arrives exactly when his store of merit (the metric that makes the pleasure his own) runs out — the text frames it as depletion, not as a realization he could have had at any point. Does the distinction between earned and granted pleasure only become salient at the moment of loss, or was it always structurally true and merely unfelt while the supply held?"
  - "The king voluntarily returns to earning through action (alms and virtue) rather than accepting restoration to a kingdom offered to him for free. Is refusing an offered good specifically because it isn't earned a coherent standard to hold, or does it risk devaluing gifts that were never meant to be measured against one's own effort in the first place?"
status: active
