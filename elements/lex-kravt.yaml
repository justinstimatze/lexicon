canonical-instances:
  - "A junior engineer who suspects a library has a bug stays quiet the first year, assuming the bug is their own misunderstanding; two years later, with enough accumulated cases of the library actually being wrong, the same engineer speaks up immediately on a similar suspicion — not simply because they've gotten better at their job, but because they've gotten better at telling their own confusion apart from the library's actual defects."
  - "A new translator hesitates to flag an apparently untranslatable idiom as untranslatable, assuming their own vocabulary is at fault; a translator with more experience recognizes the same hesitation as evidence the source phrase genuinely resists translation, and says so in the delivered work rather than silently forcing a bad rendering — the change is in what the hesitation gets attributed to, not just in how much vocabulary they have."
critical-questions:
  - "Could the attribution skill be taught directly and faster, independent of raw skill growth — for example by explicitly walking a novice through cases of each type before they've personally accumulated enough experience to sort them intuitively — or does the discrimination only reliably form through the novice's own accumulated first-hand cases of being wrong both ways?"
  - "Does this mechanism predict a specific failure mode — a highly skilled person who never develops good self/field attribution staying silent about genuinely well-justified doubts indefinitely, mistaking expertise for a shrinking need to ever say 'I don't know'?"
status: active
