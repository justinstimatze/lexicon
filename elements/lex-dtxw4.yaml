id: lex-dtxw4
name: collapsing-distance-to-here-and-now-defeats-an-unfalsifiable-boast
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone makes an unfalsifiable boast anchored to a distant place or a past time, check whether the strongest response is not argument but collapsing the distance and demanding immediate, local demonstration. In Aesop's 'The Boasting Traveller,' a man claims he once made a prodigious jump at Rhodes, citing witnesses who cannot be produced; a bystander cuts through it: 'Let's just imagine this is Rhodes for a minute: and now--jump!' The move works because it removes the exact feature (inaccessibility) that made the boast unfalsifiable in the first place, rather than engaging with the claim on its own terms. This fable is the origin of the phrase 'Hic Rhodus, hic saltus' ('here is Rhodes, jump here'), later used by Hegel and Marx to make the identical demand of theorizing detached from present, concrete action."
related: []
evokes: [aesop, the-boasting-traveller, hic-rhodus-hic-saltus, collapsing-distance-defeats-unfalsifiability]
