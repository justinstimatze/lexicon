lineage:
  - source: primary
    text: cushing-warrior-suitor-moki-one-success-raises-every-maidens-bar
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Warrior Suitor of Moki.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'copying their lucky sister, all the pretty maidens in Moki declared that they would marry no one who did not show himself at least in some degree heroic, like the youth of the dog-holes who had married their pretty sister. It therefore came about that the whole tribe of Moki, so far as the young men were concerned, became a company of jilted lovers, and all the maidens became confirmed in their resolutions of virgin maidenhood.'"
canonical-instances:
  - "After one job candidate in a competitive field successfully negotiates an unusually high salary and gets it, other candidates in similar roles start anchoring their own expectations to that one success story, causing a wave of stalled negotiations and rejected offers as most employers can't or won't match a standard that was only proven viable for one exceptional case."
  - "After one homebuyer in a hot market successfully holds out for a seller to cover closing costs and repairs, other buyers start making the same demand as a baseline expectation, and the market stalls as sellers, who could accommodate one unusually motivated buyer, can't or won't extend the same terms across the board."
critical-questions:
  - "does the cascade actually reflect a real, generalizable shift in what's achievable, or does it mistake one exceptional outlier's success for evidence that the new standard is now broadly attainable, when the outcast youth's specific advantages, his relationship with the Dogs, were not available to anyone else?"
  - "who bears the cost when a whole system raises its standard in response to one success story but supply doesn't follow -- does the story examine what happens to the maidens who now can't find any suitor who clears the new bar, or does it end before that consequence plays out?"
  - "is there a point at which the cascading standard becomes self-defeating, discouraging the exact behavior, more suitors attempting heroic feats, that would eventually let supply catch up with the new demand, rather than encouraging it?"
