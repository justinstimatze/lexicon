  - source: primary
    text: merton-1957-converts-priggishness-information-deficit
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. IX 'Continuities in the Theory of Reference Groups and Social Structure,' p.352. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'the convert may also be peculiarly conformist for want of having had first-hand knowledge of the nuances of allowable and patterned departures from the norms of the group which he has lately joined. As a result, and unlike long-established members of the group who have acquired this knowledge unwittingly in the course of their socialization, the convert tries to live up to the strict letter of these norms. He becomes a rigid conformist... he has no alternative but to make the official norms his compelling guide to behavior.'"
