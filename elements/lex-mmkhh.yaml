id: lex-mmkhh
name: buffer-an-unwanted-interaction-with-a-variant-of-a-substance-already-present
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When two things in a system interact badly and the direct cause is hard to eliminate outright, insert a third element between them — but make that buffer a VARIANT of a substance already present in the system, not an unrelated new material, because a genuinely alien addition tends to introduce its own new complications while a homologous variant slots in without disturbing anything else. Altshuller derives this from analyzing many solved 'breaking an unwanted interaction' problems and states the finding as a rule: 'Analysis of a large number of problems for the breaking of the S-Field has shown that the most effective solution turns out to be introduction of a third substance, which is a variant of one of the two already available.' His worked case is a photocopier where a tissue overlay clings to a glass plate by static: 'Between the tissue and the glass one should introduce a third substance which is a variation on either the tissue or the glass. It is simpler to take the tissue, since it is cheaper... if one stretches a clean piece of tissue over the glass it adheres. The tissue with the drawing is now applied not to the glass but to the tissue stretched over it.' The buffer here is not a new kind of material at all — it's a second, plain sheet of the exact same tissue already in use, just without the drawing. Altshuller names why this specific constraint (variant, not alien substance) matters: 'An alien substance can feel ill at ease in a technical system outside itself. It is necessary that there be and not be a third substance; the field is not broken, the system does not become dearer and its action is not destroyed - in other words, it does not introduce any complications.' The paradox he's naming is real: the fix needs a third element to exist (to do the buffering work) and needs to behave as though it isn't really a new element at all (to avoid adding new cost, new failure modes, or new interactions of its own) — and a variant of something already validated in the system is what satisfies both demands simultaneously, because it inherits the system's existing tolerances instead of introducing an untested one. Diagnostic move: when the fix for an unwanted interaction seems to require a new component, check first whether a plain, unmodified, or duplicated instance of something ALREADY in the system can serve as that component — the same material, the same part, a spare of the same kind — before reaching for a purpose-built new material or mechanism that will need its own compatibility and failure analysis."
related: [lex-fgjhn, lex-njefx, lex-uq4xw, lex-v5v63]
scaffolds-from: [lex-uq4xw]
evokes: [s-field-breaking-rule, photocopier-static-cling-example, third-substance-as-variant, homologous-buffer-not-alien-material]
lineage:
  - source: primary
    text: altshuller-1984-s-field-breaking-rule
    citation: "G. S. Altshuller, Creativity as an Exact Science, trans. Anthony Williams (Gordon and Breach, 1984), Ch.2, 'Construction and Transformation of S-Fields.'"
    quote: "'Analysis of a large number of problems for the breaking of the S-Field has shown that the most effective solution turns out to be introduction of a third substance, which is a variant of one of the two already available.'"
  - source: primary
    text: altshuller-1984-photocopier-static-cling-example
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.2, 'Construction and Transformation of S-Fields.'"
    quote: "'Between the tissue and the glass one should introduce a third substance which is a variation on either the tissue or the glass. It is simpler to take the tissue, since it is cheaper. Since this tissue has to be placed between the glass and the tissue with the drawing it is necessary for it to be transparent and not retain light. This means one has to take pure tissue. Problem solved: if one stretches a clean piece of tissue over the glass it adheres. The tissue with the drawing is now applied not to the glass but to the tissue stretched over it... An 'alien' substance can feel ill at ease in a technical system 'outside' itself. It is necessary that there be and not be a third substance; the field is not broken, the system does not become dearer and its action is not destroyed — in other words, it does not introduce any complications.'"
canonical-instances:
  - "Two microservices communicate directly and their tight coupling causes cascading failures; instead of introducing a brand-new message broker technology (an alien addition with its own operational learning curve), the team inserts a lightweight in-process queue built from the same request/response types already used elsewhere in the codebase — the buffer is a variant of what's already validated, not a new dependency."
  - "A shared kitchen has two housemates whose cooking schedules keep colliding at the stove; rather than buying a second, different stove (an alien new element with its own installation and maintenance burden), they add a second identical burner unit of the same model already in use, which slots into the existing counter and power setup without new compatibility questions."
  - "operationally distinct from lex-uq4xw an-object-cannot-change-itself-add-the-instrument-and-the-coupling-field: that atom diagnoses a MISSING piece needed to act on a target at all (no instrument, or no coupling field); this atom addresses a DIFFERENT situation — an interaction already exists and is actively unwanted, and the fix is inserting a buffer between two already-interacting elements, specifically one drawn from material the system already trusts."
critical-questions:
  - "how similar does the 'variant' need to be to count as safely homologous rather than secretly alien — the photocopier case uses literally the same tissue material; would a variant that shares only some properties with the existing substance (same category, different grade or supplier) still avoid the 'alien substance' complications, or does the safety only hold for a genuinely identical-in-kind addition?"
  - "does this rule generalize past physical/material systems — in an organizational or software context, is 'a variant of something already present' (reusing an existing team's process, an existing library, an existing role) reliably lower-risk than a purpose-built new solution, or does that assumption sometimes hide a worse fit that a bespoke new element would have avoided?"
  - "when there genuinely is no existing substance in the system that could plausibly serve as a variant buffer, does the rule offer any guidance, or does it only apply to the subset of unwanted-interaction problems where a suitable existing material happens to already be present?"
status: active
