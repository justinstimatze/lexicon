agent-instruction: "When an agent is rotated through a position before the long-run consequences of their decisions become visible, the incentive structure inverts: extracting now and leaving later is dominant over maintaining. Jackall calls this 'milking the asset' — defer maintenance, defer capital expenditure, skip what only pays off after your tenure ends, ride the short-term metric. The asset degrades; the metric looks great; the next person inherits both the degradation and the blame ('plant ran great under X; now Y can't keep it running'). The diagnostic question is NOT 'is the agent ethical?' but 'over what time-window will the consequences of this decision become visible, and over what time-window does the agent expect to be in the role?' If the consequence-window exceeds the tenure-window, milking is the rational strategy and you cannot fix it by exhortation — only by aligning the windows (longer tenure, deferred compensation, attached-to-asset reputation, or successor-protected accounting). Watch for: aggressive cost-cutting paired with personal mobility upward; 'great manager' careers built on serial 2-year extractions; the predecessor-looked-great-until-I-took-over pattern. The successor effect is not a coincidence — it is the key signature of milking having occurred. Inverse: when consequence-window fits inside tenure-window (e.g. founders, long-tenure plant managers, equity-locked partners), maintenance returns as a positive-NPV move and milking stops being rational."
