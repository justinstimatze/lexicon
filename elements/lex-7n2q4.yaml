name: low-confidence-and-low-detachment-jointly-produce-the-most-partiality
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When investigating why some people in a role develop the strongest preferences for easy cases over hard ones, check whether you are looking at two SEPARATE risk factors that reinforce each other rather than one. Martin identifies two distinct vulnerabilities in physicians dealing with patients they define as uncooperative: doubt about one's own competence to handle the case, and loss of emotional composure toward the case. Each alone motivates avoidance: 'lack of confidence and lack of detachment seem to develop when students work with patients whom they define as uncooperative, that is, patients who do not conform to their expectations. Students may, on the one hand, come to doubt the adequacy of their ability to handle such patients. At the same time, they may feel some annoyance at patients whose behavior they consider deviant. Each of these reactions in turn, we have also seen, motivates students to avoid working with particular types of patients. Now it appears that when both reactions are present, they reinforce each other.' The data (Figure 12, crossing confidence with detachment/irritation) confirm the pattern needs BOTH strengths present to reach the best outcome, not just one: 'Students who were able to carry out their work with the least strain, both confidently and without undue affective involvement, also have the fewest preferences. Those who lacked both confidence and the ability to remain detached have the largest number of preferences. They are, it would appear, the least able to work easily with all types of patients.' Diagnostic move: when designing an intervention to reduce someone's tendency to avoid or resent difficult cases, do not assume a single lever — competence training alone, or emotional-regulation coaching alone — will move the worst-affected group; check whether that group's problem is the CONJUNCTION of both deficits, which may require both interventions delivered together rather than either alone."
