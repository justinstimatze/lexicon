lineage:
  - source: primary
    text: dartmouth-1955-proposal-for-ai-summer-research
    citation: "J. McCarthy, M. L. Minsky, N. Rochester, C. E. Shannon, 'A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence' (August 31, 1955), the proposal's opening paragraph."
    quote: "'The study is to proceed on the basis of the conjecture that every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate.'"
canonical-instances:
  - "The proposal's own scope, described in its opening paragraph: a two-month, ten-person study aimed at finding how to make machines 'use language, form abstractions and concepts, solve kinds of problems now reserved for humans, and improve themselves' -- language, abstraction, general problem-solving, and self-improvement, treated as tractable within a single summer by a field that did not yet exist."
  - "The early-genome-sequencing timeline estimates of the 1980s, and early nuclear-fusion power predictions from the 1950s onward ('twenty years away' repeated across seven decades): both share the Dartmouth shape -- confident, specific, expert-authored timelines for a genuinely new kind of engineering problem, made before the field's actual bottlenecks had been encountered by anyone."
  - "A startup's founding pitch deck projects a specific, near-term timeline for a genuinely novel technical capability nobody has built before. The team isn't lying and isn't unusually naive -- they are, definitionally, standing at the one point in the project's life where the real difficulty is least visible, because encountering it is what the project itself consists of."
critical-questions:
  - "Is this pattern actually distinct from ordinary planning-fallacy optimism about familiar tasks (a contractor underestimating a familiar renovation), or is it the same bias operating at a larger scale? The proposed distinction: planning-fallacy cases usually involve a task-type with real precedent the estimator could have consulted; a genuinely new field's founders have no precedent to consult at all, because the field doesn't exist yet -- the invisibility is a structural fact about not yet having done the thing, and no amount of additional data closes that gap in advance."
  - "Does the pattern predict anything actionable, or is it only a retrospective diagnosis? If a field's real difficulty can't be seen from the founding moment, what would it even mean to 'correct for' this in advance, rather than just noting after the fact that the founders couldn't have known? One candidate answer: build revision into the plan's structure itself (short funding cycles, staged re-scoping) rather than trying to make the first estimate more accurate, since the estimate's inaccuracy is close to structurally guaranteed."
