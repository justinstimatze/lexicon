lineage:
  - source: primary
    text: homer-iliad-book-vi-glaucus-diomedes-armor-exchange
    citation: "Homer, Iliad, Book VI ('Interviews Between Glaucus and Diomed, and Hector and Andromache'), trans. William Cullen Bryant (Boston: James R. Osgood and Company, 1870; PD — Bryant died 1878 — Standard Ebooks PD edition). Glaucus and Diomedes meet as enemies mid-battle; on discovering their grandfathers Oeneus and Bellerophon were guest-friends, they clasp hands, pledge to avoid each other in combat, and exchange armor — Diomedes's bronze for Glaucus's gold — as a renewal of the ancestral bond. The narrator notes the trade's stark inequality directly."
    quote: "[On the exchange:] 'Thus having said, and leaping from their cars, / They clasped each other's hands and pledged their faith. / Then did the son of Saturn take away / The judging mind of Glaucus, when he gave / His arms of gold away for arms of brass / Worn by Tydides Diomed — the worth / Of fivescore oxen for the worth of nine.' [Diomedes, proposing the trade:] 'Let us exchange our arms, / That even these may see that thou and I / Regard each other as ancestral guests.'"
canonical-instances:
  - "The direct textual anchor: Glaucus and Diomedes, enemies on the battlefield, discover an inherited guest-friendship between their grandfathers and exchange armor — gold for bronze, a hundred oxen's worth for nine — with the poet explicitly flagging the trade as a suspension of Glaucus's normal judgment."
  - "This scene is the origin of the classical adage (later collected by Erasmus among others) for a hugely unequal exchange, still occasionally cited by that name."
  - "A founder discovers a potential acquirer's CEO attended the same small college and concedes board seats or preferred terms a stranger-buyer would never have received."
  - "A landlord relaxes lease terms sharply for a tenant who turns out to share a family, religious, or alumni connection, treating the concession as proof of the bond rather than a loss."
critical-questions:
  - "isn't this just the Mauss gift-obligation triad (lex-urh87 / lex-fy5k5)? Related but narrower. Mauss's triad describes the ordinary give-receive-reciprocate cycle for gifts generally. This atom names a specific sub-case: a LIVE, simultaneous, priced exchange (not sequential gift-giving) where invoking an inherited bond causes the parties to stop pricing the items at all, and where the resulting disparity is treated as evidence of the bond's strength rather than corrected. Mauss's triad would predict Glaucus owes Diomedes nothing further after this exchange; this atom explains why he handed over ten times the value in the first place."
  - "isn't this the same as lex-e98pd reciprocity-as-influence-mechanism? No — lex-e98pd concerns how receiving something primes a recipient toward felt obligation to reciprocate, generally scaled to what was given. This atom names a case where the reciprocity frame doesn't produce proportionate return at all — it produces active indifference to proportion, because the exchange's purpose has shifted from balancing accounts to demonstrating that accounts don't need balancing between these two parties."
  - "is Homer's 'took away his judging mind' just poetic language for 'he was careless'? The text is doing real diagnostic work: it names the trade as a departure from Glaucus's normal reasoning, attributing the lapse to divine intervention rather than to the relationship itself being a good reason. That framing preserves both readings at once — the trade is genuinely irrational by market pricing, AND it is the socially correct, honorable thing to do given the discovered bond. The pattern lives exactly in that tension, not in resolving it toward either 'he was foolish' or 'he was right.'"
  - "how would you tell, in a live negotiation, whether an invoked bond is real leverage for the weaker party or a costume for extraction? Ask whether the discovery of the bond happened before or after the terms started moving, and whether the party benefiting from the discount would still honor the relationship's other obligations (hospitality, future reciprocity, public acknowledgment) or whether the bond talk stops once the discount is banked — the latter is the costume version; the former is closer to what Glaucus and Diomedes actually do (they part as declared allies, not just as a completed trade)."
