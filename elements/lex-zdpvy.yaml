id: lex-zdpvy
name: a-third-partys-public-articulation-revives-eroded-appreciation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Appreciation for someone that has quietly eroded through simple habituation — not through any actual falling-out — can be revived not by the neglected person's own pleading but by a third party naming their virtues out loud, giving the neglecting party language for something they'd stopped consciously noticing. In the Jataka's tale of the two lizards, the minister's intervention causes the king to suddenly recall the queen's long-standing virtues: 'My dear, ever so long I observed not your virtues, but through the words of this wise man, I have observed them. Bear with my offence. This whole realm of mine I give to you alone.'"
related: []
evokes: [jataka, catukkanipata, godha-jataka, a-third-partys-words-supply-language-for-eroded-appreciation, habituation-not-conflict-explains-the-original-neglect]
lineage:
  - source: primary
    text: jataka-chalmers1895-godha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 333, Godha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "My dear, ever so long I observed not your virtues, but through the words of this wise man, I have observed them. Bear with my offence. This whole realm of mine I give to you alone."
canonical-instances:
  - "A husband who has stopped noticing his wife's daily contributions after years of routine suddenly sees them clearly again after a dinner guest spends ten minutes genuinely praising her — not because anything about her changed, but because someone else's words interrupted the habituation."
critical-questions:
  - "Does the appreciation actually last once revived this way, or does it fade back into the same habituation once the third party's words are no longer fresh in memory?"
  - "Is it a healthy dynamic that the neglected party needed an outside advocate at all — does relying on a third party to be heard reflect a deeper problem in the relationship that a moment of revived appreciation doesn't fix?"
status: active
