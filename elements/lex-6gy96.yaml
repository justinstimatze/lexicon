id: lex-6gy96
name: value-capture-external-metric-replaces-rich-values-with-its-simplified-rendition
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When an agent (person or organization) enters an institutional setting that offers a SIMPLIFIED, OFTEN QUANTIFIED rendition of values they already cared about richly, the simplified version tends to OVERWRITE the original values rather than supplement them. This is Nguyen's VALUE CAPTURE: 'you get your values from some external source and let them rule you without adapting them.' The restaurant stops caring about making good food and starts caring about Yelp ratings. The professor stops caring about student learning and starts caring about course evaluations and citation count. The pastor stops caring about long-term spiritual development and starts caring about baptism rates. The athlete stops caring about the joy of movement and starts caring about the leaderboard. The agent's pre-existing rich, contextual, embodied values are REPLACED by the metric's thin, decontextualized, externally-authored rendition. Diagnostic: ask the captured agent what they REALLY value — if they can only express it in the metric's vocabulary, capture has happened. Transferable: GPA, social-media follower count, LinkedIn endorsements, Strava segments, productivity scores, OKRs, h-index, college rankings, app-engagement metrics, hospital bed-turnover rates, police arrest-quotas — wherever a metric authored by a distant institution can BECOME the value, value-capture is the risk. Distinct from incentive-following: in pure incentive-following, the agent keeps their original values but acts on the metric for instrumental reasons (e.g., posts a viral tweet for ad revenue while still loving the writing-for-its-own-sake); in value-capture, the agent's INTERNAL value-set has been REWRITTEN by the metric (the writer who genuinely no longer experiences the writing as good unless it goes viral). The replacement is the transferable failure mode. Defensive move: keep an articulated, non-metric-dependent vocabulary for what you value alive in your own mouth — the moment you can only articulate value in the metric's terms, you've already lost the original."
