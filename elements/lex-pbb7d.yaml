id: lex-pbb7d
name: broad-equal-support-is-what-holds-a-structure-under-pressure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A building held up by many equally-set rafters, none bearing disproportionate load, models how a ruler''s or leader''s stability actually depends on a broad base of steadfast supporters rather than on any single point of unilateral strength. In the Jataka''s tale of Kukku, the parable is drawn from a roof''s own construction: "The thirty rafters bent, of sara wood, Set equally, encompass it around, They press it tightly, for their hold is good."'
related: []
evokes: [jataka, sattanipata, kukku-jataka, distributed-support-as-political-stability, broad-base-over-single-point-strength]
lineage:
  - source: primary
    text: jataka-chalmers1895-kukku-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 396, Kukku-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The thirty rafters bent, of sara wood, Set equally, encompass it around, They press it tightly, for their hold is good:"
canonical-instances:
  - "A founder who tries to run every department decision personally is more fragile than one who has built a bench of department heads each carrying real authority, even though the first looks more in control day to day."
critical-questions:
  - "How would a leader actually tell, before a crisis arrives, whether their support is broadly and equally distributed or just looks that way from the top?"
  - "Does equal distribution of support trade away the speed and decisiveness that concentrated authority provides, and is that trade worth making outside of a crisis?"
status: active
