id: lex-rd4f8
name: envying-someones-ease-without-seeing-the-constraint-that-produces-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you envy someone's apparently effortless comfort, check whether that ease is actually compensation for a constraint you haven't noticed -- and don't assume you can have the comfort without inheriting the constraint that makes it necessary. In Zitkála-Šá's telling, Manstin the rabbit envies a blind grandfather's life of sitting by the fire smoking, eating from magic bags that never empty, needing to do nothing for himself: 'Grandfather, I wish I lived in such sure luxury!' The old man warns him plainly first -- 'your eyes are your luxury! you would be unhappy without them' -- but Manstin trades his own eyes for the arrangement anyway. The magic bags and the sedentary comfort weren't a free gift to the grandfather; they were specifically compensation for his blindness, which is also why he needs guide-ropes just to reach the brook and the woodpile. Manstin discovers this the moment he tries to move through the world with youthful confidence rather than the old man's earned caution -- the very rope that made blindness survivable snaps under impatient handling, and he ends up soaked, lost, and panicking in the dark. The comfort was never separable from the constraint; it was the specific adaptation built to make that particular constraint livable, and adopting the comfort without also inheriting the constraint's own hard-won caution just produces catastrophe faster. Diagnostic move: before envying someone's apparent ease -- a slower pace, external supports, exemptions from ordinary demands -- ask what specific constraint or cost that ease might be compensating for, since features designed to offset a real limitation are usually miscalibrated, or actively dangerous, when adopted by someone who doesn't have the limitation they were built to address."
