lineage:
  - source: primary
    text: radin-hare-interrogates-the-young-chief-before-killing-and-impersonating-him
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 20. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "In the meantime Hare was asking all sorts of questions, such as 'Who is the chief of the village?' and 'What do you usually do?' The man answered, 'I am the chief of the village and I usually get four braces of birds and then go home. I go to a place where some women are watching a field and I give each of them one pair. They always ask me to stop but I always refuse and go right on to the outskirts of the village where an old woman lives. There I leave another brace and go to a large lodge in the centre of the village. When I get home, I throw my arrows to the rear of the lodge. They always fall even. My mother always notices this. Then I take off my moccasins and throw them up on the lodgepoles and they always fall even. My mother always notices this, too. Then she gives me something to eat. I eat just a little and stop. Sometimes I say to my father that my head aches and that I would like to put on my head-dress provided the people dance.' ... Thus Hare asked him all about himself. Suddenly, when he had turned around for a minute, Hare struck him dead. He skinned him and put the skin over himself and thus he was exactly like the young chief in appearance."
canonical-instances:
  - "A scammer strikes up friendly conversation with an elderly target's neighbor, asking seemingly harmless questions about the target's daily schedule, favorite phrases, and family nicknames, then uses those exact details days later in a phone call impersonating a relative to make the fabricated emergency sound convincingly authentic."
  - "A corporate spy asks a departing employee casual questions about a coworker's specific working habits, which emails get flagged as urgent, what time they usually log off, how they sign off messages, then uses those details to send a convincing impersonated request from that coworker's account after they're gone."
critical-questions:
  - "Would Hare's impersonation have survived scrutiny at all without this specific interrogation, or is the exhaustiveness of the questioning the actual load-bearing element of the whole plan, with the killing and skin-disguise being comparatively minor steps by contrast?"
  - "Does the young chief have any way to recognize the questions as reconnaissance rather than ordinary friendliness, given that each individual question sounds like the kind of thing any curious traveler might ask, and what would it have taken for him to notice the pattern in time?"
  - "Is there a meaningful difference between this kind of pre-impersonation intelligence gathering and ordinary getting-to-know-you conversation, and does the answer depend entirely on the asker's undisclosed intent rather than on anything observable in the questions themselves?"
status: active
