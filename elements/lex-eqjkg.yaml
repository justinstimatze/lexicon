    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XIII, 'Vast Changes.'"
    quote: "“Gentlemen, with all respect, you might as well ask me to put a loaded pistol to my head and blow my brains out, as to ask me to keep out of this convention, to which I have been duly elected. Then, gentlemen, what would you gain by this exclusion? Would not the charge of cowardice, certain to be brought against you, prove more damaging than that of amalgamation? Would you not be branded all over the land as dastardly hypocrites, professing principles which you have no wish or intention of carrying out? As a mere matter of policy or expediency, you will be wise to let me in. Everybody knows that I have been duly elected as a delegate by the city of Rochester. The fact has been broadly announced and commented upon all over the country. If I am not admitted, the public will ask, ‘Where is Douglass? Why is he not seen in the convention?’ and you would find that enquiry more difficult to answer than any charge brought against you for favoring political or social equality; but, ignoring the question of policy altogether, and looking at it as one of right and wrong, I am bound to go into that convention; not to do so, would contradict the principle and practice of my life.”"
canonical-instances:
  - "The direct textual anchor: Douglass names the specific reason exclusion couldn't stay quiet -- 'the fact has been broadly announced and commented upon all over the country' -- his election was already public record, so excluding him wasn't a return to an unremarked-upon status quo, it was a new, conspicuous, unexplainable absence."
  - "Hypothetical: a company quietly asks its most visible openly-disabled engineer to skip a televised product launch, worried his presence will draw attention to accessibility complaints. The engineer's role on the project is already public knowledge from prior press coverage, so his sudden absence from the launch draws exactly the scrutiny -- and worse, suspicion of a cover-up -- that his presence would only have partially risked."
critical-questions:
  - "Does this reversal hold generally, or does it depend on the entitled member's presence already being publicly known, as Douglass's election was? Would the calculus favor quiet exclusion instead, if no one outside the room would ever have known the person was entitled to be there in the first place?"
  - "Who bears the cost if the prediction is wrong -- if the committee had excluded Douglass and faced no cowardice charge at all, would Douglass's argument have been vindicated in hindsight, or was he making a confident bet on a genuinely uncertain outcome?"
  - "The committee's fear (a backlash against the Republican party for favoring equality) and Douglass's counter-fear (a backlash for cowardice and hypocrisy) are aimed at different audiences. Does resolving which fear is bigger require actually knowing the composition and mood of the electorate, or is Douglass's argument valid on principle regardless of the specific audience?"
