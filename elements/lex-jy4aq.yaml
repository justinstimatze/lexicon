id: lex-jy4aq
name: problem-typology-wicked-vs-tame
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When approaching a problem, type it: tame (definition stable, solution measurable, structure clear) or wicked (definition contested, solution debatable, structure interdependent). Wicked problems break methods that work on tame ones; pick technique to problem-type."
related: [lex-89rjr, lex-j5kxw, lex-k6d7u, lex-prwfm, lex-q8pxm, lex-sjsxx, lex-spk4s, lex-th6tr, lex-ucrqj, lex-xgt9j, lex-yexax]
scaffolds-from: [lex-yexax]
evokes: [classify-problem-before-method, wicked-problem, tame-problem, rittel-design-typology, judgment-not-true-or-false, stakeholders-not-analyst, structure-not-optimize]
lineage:
  - source: primary
    text: rittel-webber-1973-dilemmas-in-general-theory-of-planning
    citation: "Horst W.J. Rittel and Melvin M. Webber, 'Dilemmas in a General Theory of Planning,' Policy Sciences 4(2):155-169 (1973). Original 'wicked problem' framing. Rittel was a designer at HfG Ulm and UC Berkeley; Webber an urban planner. Tier-3 deepening source — primary paper; the Rosenhead-Mingers Ch.1 verbatim above quotes Rittel's tame-vs-wicked criterion directly and supplies the canonical operational distinction this atom uses."
    quote: "[Tier-3 deepening source — Rittel-Webber 1973 PDF; the verified Rosenhead-Mingers Ch.1 p.5 verbatim (entry above) supplies the canonical tame-vs-wicked criterion: tame = problem agreed in form ahead of analysis and stable during it; wicked = many alternative explanations, type of explanation determines solution, solutions are good-or-bad rather than true-or-false. This is Rittel's original distinction as recapitulated by the operational-research-side adopters; the primary paper would deepen but not change the operational claim.]"
  - source: practitioner
    text: rosenhead-mingers-2001-rational-analysis-for-a-problematic-world
    citation: "Jonathan Rosenhead & John Mingers (eds.), Rational Analysis for a Problematic World Revisited, 2nd ed. (John Wiley & Sons 2001), Ch.1 'A New Paradigm of Analysis' p.5. Operational-research-side adoption of Rittel's distinction, situating it as the pre-method classification step."
    quote: "For Rittel, a 'tame' problem is one which can be specified, in a form agreed by the relevant parties, ahead of the analysis, and which does not change during the analysis. For a 'wicked' problem by contrast, there are many alternative types and levels of explanation of the phenomena of concern, and the type of explanation selected determines the nature of the solution. Alternative solutions are therefore not true or false, but good or bad."
  - source: practitioner
    text: ackoff-1979-future-of-or-is-past
    citation: "Russell Ackoff's 'messes' frame is the OR-side parallel: messes = dynamic interconnected systems of changing problems where solutions don't compose because they interact. Adjacent-but-not-identical to wicked: wicked is epistemic-disagreement, messes is ontological-interconnectedness. Both flag the same operational consequence (hard-OR doesn't fit; need PSM). Tier-4 adjacent source — Ackoff 1979 'The Future of Operational Research is Past'; cross-attested in Rosenhead-Mingers Ch.1 narrative as a parallel OR-side recognition. The atom's crucial claim rests on the wicked-criterion verbatim above, not on Ackoff."
    quote: "[Tier-4 adjacent source; cross-attested by the Rosenhead-Mingers volume which the verified verbatim above derives from. The messes-frame is adjacent-but-distinct from wicked (epistemic vs ontological) and is not cardinal for this atom's classification claim.]"
canonical-instances:
  - "architectural-decision-making: 'should we use microservices for this system?' is wicked because (a) what counts as success depends on the team's worldview about coupling vs cohesion; (b) the answer changes once partial work reveals system properties; (c) competing answers aren't true/false but good-or-bad for specific stakeholders. The tame version would be 'what's the lowest-latency RPC encoding given fixed throughput constraints?' — agreed objective, single best answer derivable."
  - "policy-design: should we expand a social-service program? Wicked — interacting stakeholders, contested values, evidence underdetermined, the very problem-framing is contested. Diagnosis matters because optimization-tooling can't structure the answer."
  - "tame-pretending-to-be-wicked: a problem APPEARS to have stakeholder disagreement but actually has a hidden agreed-objective behind the disputes (e.g., bikeshed discussions that look like architectural debates but are actually about who-gets-credit). Mis-classifying tame as wicked produces over-investment in participatory structuring."
  - "wicked-pretending-to-be-tame: a problem APPEARS to have a single best answer but actually has hidden stakeholder-value-conflicts. Mis-classifying wicked as tame produces optimal-solution outputs that fail at implementation because the un-surfaced disagreement re-emerges downstream. The RAND-in-NYC moon-ghetto pattern."
  - "operational discriminator: ask 'can the problem-statement be agreed in advance by all relevant parties, and would it not change during the analysis?' If yes → tame (hard-OR / optimization-tools apply). If no → wicked (soft-OR / problem-structuring methods needed first)."
  - "operationally distinct from lex-sjsxx physics-model-regime-selection: lex-sjsxx picks a model regime WITHIN hard-OR (Newtonian vs relativistic vs quantum framework) where the problem is already tame; lex-jy4aq operates one level UP — picking whether the problem admits hard-OR at all."
  - "operationally distinct from lex-89rjr goal-state-anchoring: lex-89rjr is about anchoring on a goal once it's known; lex-jy4aq is about classifying whether the goal can be anchored at all (wicked problems may have multiple incompatible goals)."
critical-questions:
  - "the meta-classification question: does the wicked/tame classification itself admit clean answers, or is the classification itself wicked? Empirically: usually clean enough to be operational. Edge cases exist (problems drift between modes as scope expands) but the binary is rarely false. Practitioner-discipline: when the classification feels contested, treat the contestation itself as a soft-OR problem-structuring task rather than collapsing prematurely"
  - "the stakeholder-agreement test: can the problem-statement be agreed in advance by all relevant parties, and would it NOT change during the analysis? If yes → tame; if no → wicked. The operational discriminator. Practitioner-question: name the stakeholders and check whether their problem-formulations would converge or diverge. Diverging formulations are the wicked-signal"
  - "the wicked-pretending-tame failure-mode: a problem appears to have a single best answer but actually has hidden stakeholder-value-conflicts. Misclassifying wicked as tame produces optimal-solution outputs that fail at implementation because un-surfaced disagreement re-emerges downstream (RAND-in-NYC moon-ghetto pattern). Practitioner-discipline: when an optimization-result fails to land, ask whether the problem-statement was actually agreed pre-analysis"
  - "the scope-creep failure-mode: tame problems can become wicked as scope expands (tame engineering problem → wicked organizational adoption → wicked political legitimacy). Practitioner-question: at what scope-boundary does this stop being a single-best-answer problem? Solving the tame inner problem is necessary-but-not-sufficient when the wicked outer problem will reabsorb it"
status: active
