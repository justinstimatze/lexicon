lineage:
  - source: primary
    text: merton-1957-renegade-or-convert
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior,' in Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VIII, p.269."
    quote: "'The value-laden connotations of these terms used to describe identification with groups other than one's own definitely suggest that these patterns of behavior have been typically regarded from the standpoint of the membership group. (Yet one group's renegade may be another group's convert.)'"
  - source: primary
    text: merton-1957-topdogs-and-underdogs
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior' (1957), same chapter, pp.269-270, continuing the analysis."
    quote: "'The transfer of allegiance of upper class individuals from their own to a lower class-whether this be in the pre-revolutionary period of 18th century France or of 20th century Russia-belongs to the same family of sociological problems as the more familiar identification of lower class individuals with a higher class, a subject which has lately begun to absorb the attention of sociologists in a society where upward social mobility is an established value. Our cultural emphases notwithstanding, the phenomenon of topdogs adopting the values of the underdog is as much a reference group phenomenon lending itself to further inquiry as that of the underdogs seeking to become topdogs.'"
canonical-instances:
  - "An employee who leaves a startup for a large competitor is a 'sell-out' to former colleagues and a 'great hire' to the new team; an executive who leaves a large company to join a scrappy startup is sometimes cast as 'brave' or a 'true believer' by the startup and baffling or disloyal by the old employer — same act-shape, opposite labels, purely a function of which side is talking."
  - "A wealthy heir who adopts the politics and lifestyle of a movement opposed to their own class's interests is called a 'traitor to their class' by former peers and celebrated as a principled ally by the new movement — Merton's point is that this is structurally the identical phenomenon as an ambitious worker adopting the manners of the class above them, just running in the opposite direction and therefore triggering a different, culturally-available vocabulary."
critical-questions:
  - "Does the standpoint-relativity of the label mean the underlying act really is morally neutral, or can some group-switches be substantively assessed as better or worse on independent grounds (harm caused, values actually held) even after stripping away the self-serving vocabulary of the group left behind?"
  - "Is the topdog-to-underdog direction actually treated with full symmetry in practice, or does cultural common sense (which Merton notes explicitly: 'our cultural emphases notwithstanding') supply a strong asymmetric default — treating upward moves as basically legible ambition and downward moves as requiring special explanation (idealism, rebellion, guilt) — that a purely structural reference-group account doesn't capture?"
