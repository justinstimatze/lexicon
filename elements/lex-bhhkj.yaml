lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Humanism and Reason' (review of Grassi and von Uexküll, first published in The Philosophical Quarterly 2, 1952), Ch. 20 of Conjectures and Refutations (Routledge Classics, 2002), p.515."
    quote: "“I have no doubt that the accusation of arguing in a circle falls back on Uexküll, and that his faulty reasoning is at least partly due to his untenable subjectivist interpretation of modern physics. For Uexküll overlooks the fact that his whole biological analysis presupposes the possibility of a (more or less) objectivist approach. It is only such an approach which enables us to speak, for example, of an ‘imitative contraption’ taking over the functions of a bird’s mother. It is only because we know—in our ‘objective’ world, which goes beyond the bird’s ‘subjective’ world—what its real mother is, and what a contraption is, that we can say that, if animal A differentiates by its actions between its real mother and an imitative contraption of a certain kind while animal B does not, then A has, to that extent, the greater powers of discrimination or differentiation, and is, to the same extent, better adapted to certain possible environmental situations.”"
canonical-instances:
  - "A researcher argues that all human perception is entirely constructed and that there is no such thing as a mind-independent visual world to get right or wrong. Their own flagship experiment, designed to show subjects being fooled by an optical illusion, depends on the researcher knowing what the scene actually looks like, independent of any subject's perception, in order to call it an illusion at all -- the demonstration needs the very mind-independent fact the theory denies."
  - "A brand consultancy insists that a product's 'real' value is entirely a social construction with no underlying quality independent of perception, and showcases a blind taste test where marketing changes which product people rate higher as proof. Running that test at all requires holding the product's actual physical composition fixed and known across conditions -- the demonstration of perception's power presupposes exactly the underlying, perception-independent fact the theory claims doesn't matter."
critical-questions:
  - "Isn't this just a version of self-refuting relativism -- 'everything is relative' being itself a non-relative claim? It's a narrower and sharper failure than that generic move. The problem isn't that Uexküll's THESIS is self-undermining in the abstract; it's that his own EVIDENCE, described in his own words, is unstatable without the category he denies. A theory can sometimes survive the abstract self-refutation worry while still failing this test, or vice versa -- they're different points of attack."
  - "Couldn't a committed subjectivist just redescribe the evidence without the objectivist vocabulary -- say the goose merely 'responds differently' to two stimuli, with no talk of 'real' versus 'fake' mothers? That redescription is available, but it costs the theory its own explanatory claim: the whole point of citing the dummy experiment was to show discrimination BETWEEN a real thing and an imitation of it, which is exactly the distinction the flattened redescription erases. Keeping the evidence's explanatory force and dropping the objectivist vocabulary that alone makes it evidence of anything in particular are not both available at once."
