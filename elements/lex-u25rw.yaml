id: lex-u25rw
name: terror-is-deliberately-induced-then-relieved-to-install-a-belief
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'A would-be reformer facing an audience too complacent to accept moral instruction on its own merits can engineer acute fear first and arrive immediately afterward as the source of relief, so the audience is maximally receptive precisely because they are grateful to whoever ends the fear the messenger themselves created. The two-phase strategy is deliberate from the start, laid out as a plan well before anyone acts on it: manufacture the terror, supply the consolation, then deliver the actual teaching while the audience is still relieved enough to listen. In the Maha-Kanha-Jataka, the god Sakka, observing that people have grown too indifferent to accept moral teaching, explicitly resolves in advance: ''I will scare and terrify mankind; and when I see they are terrified, I will console them, I will declare the Law'' — and only then manifests as the monstrous black hound that devours a kingdom''s food supply before delivering his moral catalog.'
related: []
evokes: [jataka, dvadasanipata, maha-kanha-jataka, manufactured-crisis-precedes-persuasion, shock-then-relief-installs-receptivity]
lineage:
  - source: primary
    text: jataka-chalmers1895-maha-kanha-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 469, Maha-kanha-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Ah, I have it!" thought he: "I will scare and terrify mankind; and when I see they are terrified, I will console them, I will declare the Law, I will restore religion which has decayed, I will make it last for another thousand years!'
canonical-instances:
  - 'A safety consultant hired to fix a plant''s complacent culture stages an unannounced, realistic evacuation drill that convinces workers for several terrifying minutes that a real chemical leak is underway, then reveals it was a drill and uses the still-shaken room''s full attention to walk through the actual safety protocol they had ignored in every prior training.'
critical-questions:
  - 'Sakka states his plan explicitly in advance, which is unusually candid for a manipulation of this kind — does naming the intent to the reader (rather than to the audience being terrified) change the ethical reading of the tactic, or does the deception remain exactly as manipulative regardless of who is let in on it?'
status: active
