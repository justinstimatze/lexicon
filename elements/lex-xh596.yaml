id: lex-xh596
name: treating-gain-and-loss-as-transient-forecloses-reactive-grief
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Rather than dispute a rival's account of an unfair loss point by point, treating the entire category — gain, loss, praise, blame, pleasure, pain — as equally transient states removes the ground a grievance needs to stand on, since nothing in that category was ever stable enough to be owed. In the Jataka's tale of the two parrots, when his brother rages at losing status to the monkey, Radha doesn't dispute the unfairness — he reframes the whole axis it's measured on: 'Gain and loss and praise and blame, Pleasure, pain, dishonour, fame, All as transient states conceive— Why should Potthapada grieve?'"
related: []
evokes: [jataka, catukkanipata, kalabahu-jataka, naming-a-whole-category-as-transient-defuses-a-specific-grievance, refusing-to-dispute-unfairness-on-its-own-terms]
lineage:
  - source: primary
    text: jataka-chalmers1895-kalabahu-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 329, Kalabahu-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Gain and loss and praise and blame, Pleasure, pain, dishonour, fame, All as transient states conceive— Why should Potthapada grieve?"
canonical-instances:
  - "A colleague passed over for a promotion they clearly deserved vents to a mentor about the specific unfairness of it, and the mentor responds not by agreeing or disputing the unfairness but by naming titles, raises, and recognition generally as things that come and go for everyone regardless of merit."
critical-questions:
  - "Does this reframing actually resolve the grievance, or does it just suppress a legitimate complaint by relabeling it as an instance of something universal and therefore not worth addressing specifically?"
  - "Is Radha's own restraint here made easier by the fact that his brother is doing the complaining for both of them — would the same equanimity hold if Radha were the sole one affected with no one else voicing the grievance?"
status: active
