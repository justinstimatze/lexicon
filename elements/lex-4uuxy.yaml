lineage:
  - source: primary
    tradition: federici-reproductive-labor
    text: federici-2004-caliban-and-the-witch
    citation: "Silvia Federici, Caliban and the Witch: Women, the Body and Primitive Accumulation (Autonomedia, 2004), Chapter 2 (Accumulation of Labor and the Degradation of Women), Section II."
    quote: "The separation of commodity production from the reproduction of labor-power also made possible the development of a specifically capitalist use of the wage and of the markets as means for the accumulation of unpaid labor. Most importantly, the separation of production from reproduction created a class of proletarian women who were as dispossessed as men but, unlike their male relatives, in a society that was becoming increasingly monetarized, had almost no access to wages, thus being forced into a condition of chronic poverty, economic dependence, and invisibility as workers."
  - source: primary
    tradition: federici-reproductive-labor
    text: federici-2004-caliban-and-the-witch
    citation: "Silvia Federici, Caliban and the Witch: Women, the Body and Primitive Accumulation (Autonomedia, 2004), Introduction."
    quote: "It is generally agreed that the witch-hunt aimed at destroying the control that women had exercised over their reproductive function and served to pave the way for the development of a more oppressive patriarchal regime. It is also argued that the witch-hunt was rooted in the social transformations that accompanied the rise of capitalism. […] the persecution of witches (like the slave trade and the enclosures) was a central aspect of the accumulation and formation of the modern proletariat, in Europe as well as in the 'New World.'"
canonical-instances:
  - "A two-earner household where the lower-earner ALSO does most of the laundry, school pickup, and elder-call arrangement — the wage of the higher earner balances only because the lower earner is the captive substrate."
  - "Hospital nurses (often female, often migrant) doing dignity-and-bodily-care work that is uncounted in the patient-billing line but is essential for outcomes — when their union strikes the system reveals the substrate was foundational."
  - "Big Tech 'platform' economy worker (Uber driver, DoorDash deliverer) whose wage equation balances because their car maintenance and health insurance are off-balance-sheet — the platform pattern is Federici's pattern in a new gendered/raced configuration."
  - "University adjunct teaching whose office-hours-grading-mentoring labor is unpriced and presupposed for the institution's reputation; new tenure-track women being asked to do disproportionate service work, an institutional re-enactment of the pattern."
  - "Open-source maintainer ecosystem where a small number of unpaid maintainers carry the substrate that paid commercial software depends on; the wage-equation in the commercial layer balances because the maintainer layer doesn't get paid."
  - "Care-of-elderly-parents that falls disproportionately on daughters; the daughter's wage-earning capacity drops to make the substrate work; the parents' 'estate plan' never accounts for it."
