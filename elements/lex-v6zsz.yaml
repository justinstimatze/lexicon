id: lex-v6zsz
name: innocent-questions-to-naive-subordinates-extract-the-patrol-schedule
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need operational intelligence that a target's leadership would never give up, look for the least-informed, most trusting people close to that leadership -- they often don't realize the innocent details they know are exactly the intelligence you need, and won't recognize a friendly question as reconnaissance. In Cushing's telling, the boy, having infiltrated the Eagles' nest, doesn't need to fight both parent Eagles at once -- he just needs to know when each one is coming. He gets it by asking the naive, trusting chicks directly, dressed as harmless curiosity: 'Tell me about what time your mother comes home... what time does your father come home?' The chicks answer without any sense that they're revealing anything at all -- to them, 'when the clouds begin to gather' and 'when the fine rain begins to fall' are just facts about their own lives, not operational intelligence about their parents' movements. Their innocence is exactly what makes the extraction work: an adult Eagle would recognize the question as a threat, but the chicks have no framework for treating a simple question as anything other than conversation. Diagnostic move: when you need to know an organization's or a target's patterns, routines, or schedule, look past the people who'd recognize the value of that information and toward the ones closest to it who wouldn't -- a junior, trusting, or simply uninformed insider will often answer a plainly phrased question that a more guarded principal would immediately recognize as reconnaissance."
