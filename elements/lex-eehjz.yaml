lineage:
  - source: practitioner
    text: wikipedia-reductio-ad-absurdum-2025-12
    citation: "Wikipedia 'Reductio ad absurdum' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Reductio_ad_absurdum). Public-domain mathematical / logical primitive — formalized in Aristotle's *Prior Analytics* (c. 350 BCE) as one of the per impossibile reduction methods; widely used throughout the history of mathematics. The substrate-claim: to establish claim P, assume the negation ¬P, derive a contradiction (any statement that cannot be true; typically Q ∧ ¬Q), and conclude that ¬P is false — therefore P holds. The transferable shape is ASSUME-THE-OPPOSITE-DERIVE-CONTRADICTION: an argumentative move that proves the original claim INDIRECTLY by demonstrating the impossibility of its negation. This is the canonical INDIRECT-PROOF technique, distinct from CONSTRUCTIVE proofs that exhibit a witness or a procedure. Several schools of mathematical thought (intuitionism, constructivism) accept only constructive proofs and reject reductio in its classical form, because reductio proves existence without exhibiting a witness. Nonetheless reductio is widely used and powerful: famous examples include the proof that √2 is irrational, the infinitude of primes (Euclid), and Cantor's diagonal arguments (one specific form of reductio applied to enumerations)."
    quote: "[Wikipedia 'Reductio ad absurdum', 2025-12 ZIM snapshot:] 'In logic, reductio ad absurdum (Latin for reduction to absurdity), also known as argumentum ad absurdum (Latin for argument to absurdity), apagogical argument, or proof by contradiction is the form of argument that attempts to establish a claim by showing that following the logic of a proposition or argument would lead to absurdity or contradiction. Although it is quite freely used in mathematical proofs, not every school of mathematical thought accepts this kind of nonconstructive proof.' [On the formal structure: a proof of P by reductio (a) assumes the negation ¬P; (b) derives a logical contradiction (either an internal Q ∧ ¬Q, or a contradiction with a previously-established theorem or axiom); (c) concludes that the assumption ¬P is false, so by the law of excluded middle (¬¬P ↔ P), P holds. The substrate-claim is the INDIRECTNESS itself — establishing P by demonstrating the impossibility of ¬P, rather than constructing P directly. The technique's POWER comes from indirectness: many statements (like 'there are infinitely many primes' or 'the reals are uncountable') are easier to prove by negation-and-contradiction than by direct construction. The technique's CONTROVERSY comes from the same indirectness: it establishes EXISTENCE without producing a CONSTRUCTIVE example, which intuitionist and constructive mathematics rejects. The transferable lesson: when DIRECT proof is hard, sometimes the OPPOSITE-IS-IMPOSSIBLE proof is easy.]"
canonical-instances:
  - "Proof that √2 is irrational (Pythagoras/Euclid): assume √2 = p/q in lowest terms; derive 2q² = p², so p is even, so q is also even, contradicting 'lowest terms.' Therefore √2 is not rational."
  - "Euclid's infinitude of primes: assume there are finitely many primes p_1, ..., p_n; consider N = p_1 × p_2 × ... × p_n + 1; then N is either prime (contradicting the finite-list) or has a prime factor not in the list (also contradicting). Therefore there are infinitely many primes."
  - "Cantor's diagonal argument (one form of reductio): assume the reals are countable, enumerate them, construct the diagonal element, derive contradiction. Reductio applied to enumerability."
  - "Halting problem undecidability: assume a halting-decider exists, construct a paradoxical program, derive that the decider gives wrong answer on it. Reductio applied to algorithm-existence."
  - "Russell's paradox in unrestricted set theory: assume the set R = {x : x ∉ x} exists; derive R ∈ R ⟺ R ∉ R, a contradiction. Reductio applied to set-existence (forcing axiom-system revision)."
  - "Politics / rhetoric uses: 'If your principle were true, then this absurd consequence would follow.' Used to attack philosophical positions by showing their implausible logical consequences. Slippery-slope arguments are reductio-misapplications when the consequence is not actually entailed."
  - "Legal practice: showing that a proposed legal rule, if applied consistently, would lead to absurd outcomes (the 'absurdity doctrine' in statutory interpretation). Used to override literal readings."
  - "Software-engineering proof-of-impossibility: 'If algorithm X existed, we could solve problem Y; Y is provably unsolvable; therefore X cannot exist.' Common in complexity-theory negative results."
  - "operationally distinct from lex-ftke9 work-backwards-from-goal: work-backwards is DIRECT (start at goal, decompose toward sub-goals); reductio is INDIRECT (negate the claim, derive impossibility). Both shape proof-strategy but in opposite directions."
  - "operationally distinct from lex-xcaqj generalization-then-instantiation: lex-xcaqj is the structure of MOST mathematical proofs (general → specific); reductio is a SPECIFIC PROOF SHAPE within that broader pattern. Reductio uses generalization-instantiation but adds the negation-and-derivation steps."
  - "operationally distinct from lex-tt5tv diagonalization: diagonalization is a SPECIFIC CONSTRUCTION (the diagonal element); reductio is a STRATEGY (assume-negation-derive-contradiction) that uses diagonalization in some specific theorems but is more general. Diagonal-arguments are reductio + diagonal-construction."
  - "compose-related with lex-w7fxz pigeonhole: pigeonhole provides the CONTRADICTION many reductio-proofs need. Reductio + pigeonhole is a frequent combination (e.g., proving collisions exist by reductio: assume all-different, derive pigeonhole-violation contradiction)."
critical-questions:
  - "is reductio always valid? In CLASSICAL logic (with law of excluded middle, ¬¬P ↔ P), yes. In INTUITIONIST / CONSTRUCTIVE logic, reductio for proving P is only valid if ¬P leads to ⊥ (falsity); proving ¬¬P is NOT the same as proving P constructively. The split has real consequences: constructive proofs give algorithms; non-constructive proofs do not. Practitioner-discipline: when an algorithmic / computational answer is needed, reductio-style existence proofs may be insufficient; you need a constructive proof of WITNESS-FOR-P."
  - "when does reductio fail in practice? When the supposed 'contradiction' derived from ¬P is actually consistent — i.e., the alleged derivation has a logical error or implicitly assumes the conclusion. Practitioner-discipline: when constructing a reductio, name explicitly which step produces the contradiction; double-check that the contradiction is genuine (not just unexpected, surprising, or inconvenient)."
  - "how does reductio differ from a slippery-slope fallacy? Reductio shows ¬P ENTAILS a contradiction (deductively). Slippery-slope claims ¬P leads to undesirable consequences via empirical / probabilistic / psychological steps — not deductive. When the chain of entailment is not strict, the argument is slippery-slope, not reductio. The substrate-meta question is always: does each step actually follow?"
  - "what's the relation to dialectical argument? Plato's Socratic method uses a quasi-reductio: extract premises from interlocutor, derive consequences uncomfortable to them, force revision. The reductio frame here is rhetorical (find premises THE OPPONENT accepts that produce a contradiction THE OPPONENT cannot tolerate). Substrate-relevant: reductio's force depends on whether the contradiction-producer accepts the assumed premises."
  - "where do practitioners over-apply reductio? When using it to argue ¬P from 'P seems implausible' rather than 'P entails contradiction.' Implausibility is not a contradiction. The transferable claim requires actual logical impossibility, not merely surprise."
