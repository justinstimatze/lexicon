evokes: [nielsen-1994-ten-usability-heuristics, error-prevention-heuristic, slip-vs-mistake, unconscious-execution-error-vs-wrong-mental-model, heuristic-evaluation]
lineage:
  - source: primary
    text: nielsen-1994-ten-usability-heuristics
    citation: "Jakob Nielsen, '10 Usability Heuristics for User Interface Design,' Nielsen Norman Group, originally published April 24, 1994, last revised January 30, 2024. Heuristic #5, 'Error Prevention.'"
    quote: "'Good error messages are important, but the best designs carefully prevent problems from occurring in the first place. Either eliminate error-prone conditions, or check for them and present users with a confirmation option before they commit to the action. There are two types of errors: slips and mistakes. Slips are unconscious errors caused by inattention. Mistakes are conscious errors based on a mismatch between the user's mental model and the design.'"
  - source: primary
    text: nielsen-1994-ten-usability-heuristics
    citation: "Jakob Nielsen, '10 Usability Heuristics for User Interface Design,' Heuristic #5 tips."
    quote: "'Prioritize your effort: Prevent high-cost errors first, then little frustrations. Avoid slips by providing helpful constraints and good defaults. Prevent mistakes by removing memory burdens, supporting undo, and warning your users.'"
canonical-instances:
  - "A form that requires re-typing an email address into a confirmation field catches slips: a typo the person didn't notice. It does nothing for someone who deliberately, correctly typed the wrong email because they misunderstood which account the form was for -- what that person needs is a label clarifying what the field is for. A second typing box catches nothing there."
  - "A surgical checklist's 'confirm patient identity and procedure site before incision' step is a slip-catcher: it assumes the surgical team already knows the correct patient and site (a correct mental model) and guards against the attention lapse of operating on the wrong one anyway. It does nothing to fix a team that has been told the wrong patient's chart from the start -- that failure is a mistake, upstream of the checklist's reach entirely."
  - "A codebase with a linter that blocks committing an unused variable is guarding against slips (the developer meant to remove it, forgot). A team that keeps re-introducing a race condition because everyone believes a shared cache is thread-safe when it isn't is making a mistake -- more linting won't fix it; correcting the team's actual model of the cache will."
critical-questions:
  - "Can the same observable error be genuinely ambiguous between the two categories from the outside -- a person who clicks 'delete' by accident (slip) is behaviorally indistinguishable, in the log, from a person who clicked 'delete' believing it meant 'archive' (mistake)? If so, what's the cheapest way to disambiguate before committing to a fix, since asking the person directly may be the only reliable signal?"
  - "Does a single system change ever fix both at once, or does treating them as fully separable miss cases where a better mental model would also reduce the attention burden that produces slips -- i.e., is the two-category split itself sometimes a false dichotomy for a specific failure?"
