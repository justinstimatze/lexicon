id: lex-p7uh9
name: harm-attribution-is-reciprocal-between-incompatible-uses
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When attributing harm in a use-conflict (factory vs residents, train vs farm), surface Coase reciprocity — both uses make the other costly; the question is not who caused the harm but which assignment of right minimizes joint cost."
related: [lex-wtkuz, lex-d7h2y, lex-xxmeh, lex-yyfx5, lex-fy5k5, lex-p5m5u]
evokes: [coase-1960, reciprocal-nature-of-externalities, A-harms-B-is-also-B-harms-A, total-and-marginal, restraint-imposes-counter-cost, problem-of-social-cost, asymmetric-attribution-conceals-the-symmetric-structure]
lineage:
  - source: primary
    text: coase-1960-problem-of-social-cost
    citation: "R. H. Coase, 'The Problem of Social Cost,' *Journal of Law and Economics* 3:1-44 (October 1960). The paper that established the modern law-and-economics literature and earned Coase the 1991 Nobel. The atom names the substrate-claim Coase makes in §I-II: when two uses of a resource are incompatible, the standard 'A harms B' framing conceals that restricting A also harms A (the foregone use), so the question is symmetric — 'should A be allowed to harm B, or should B be allowed to harm A?' The right answer is whichever produces less total harm, evaluated total-and-at-the-margin. The atom generalises beyond economic externalities to any conflict over rivalrous resources: noise vs quiet, view vs construction, free-speech vs reputation, cyclist vs motorist, dev-velocity vs reliability — the asymmetric attribution ('X harms Y') conceals the symmetric structure (each constraint imposes a counter-cost). PD globally (Coase d.2013; *J. Law & Econ* 1960 US-published, life+95 corporate-published ≈ 2056"
    quote: "[Coase 1960 *J. Law & Econ* 3 p.2:] 'The traditional approach has tended to obscure the nature of the choice that has to be made. The question is commonly thought of as one in which A inflicts harm on B and what has to be decided is: how should we restrain A? But this is wrong. We are dealing with a problem of a reciprocal nature. To avoid the harm to B would inflict harm on A. The real question that has to be decided is: should A be allowed to harm B or should B be allowed to harm A? The problem is to avoid the more serious harm. I instanced in my previous article the case of a confectioner the noise and vibrations from whose machinery disturbed a doctor in his work. To avoid harming the doctor would inflict harm on the confectioner.' [p.27 — Coase notes the courts often recognise this:] 'it is clear from a cursory study that the courts have often recognized the economic implications of their decisions and are aware (as many economists are not) of the reciprocal nature of the problem.' [Quoting Prosser on Torts (cited by Coase):] 'a person may make use of his own property or conduct his own affairs at the expense of some harm to his neighbors... It is only when his conduct is unreasonable, in the light of its utility and the harm which results, that it becomes a nuisance.' [The atom's central claim: any conflict over an incompatible use of a shared resource has a SYMMETRIC harm-structure; the asymmetric framing 'A harms B' is a rhetorical accident of which party is treated as the default-baseline. Restoring symmetry is a precondition for asking the correct question (which use produces more value net of the harm to the other). The Coase Theorem corollary (when transaction-costs are zero, the assignment of rights doesn't affect efficiency, only distribution) sits downstream — but the substrate-primitive is the symmetry-restoration move itself, which holds whether or not transactions are costless.]"
canonical-instances:
  - "Noise complaints in mixed-use neighbourhoods: the new resident moving in next to a long-standing bar frames the bar as 'harming' them with noise. Coase's move surfaces the symmetric structure — silencing the bar harms the bar's customers and owner. The question is which harm is larger and who should bear it; the answer depends on context (zoning, who-was-there-first, ongoing-use vs new-use), but the symmetric framing is needed before that question can be asked correctly."
  - "View-blocking construction: a homeowner objects to a neighbour's planned addition because it blocks their view. The asymmetric framing is 'addition harms view'; the symmetric framing is 'preserving view harms the neighbour's ability to expand.' The Coase move doesn't pre-determine which side wins; it surfaces that the conflict is reciprocal and forces an explicit total-harm comparison."
  - "Cyclist-vs-motorist road conflicts: each frames the other as the harm-imposer (cyclists slow cars; cars endanger cyclists). The Coase frame: the conflict is reciprocal over the shared resource (road space), and the rule-design question is which configuration produces less total harm. Bike-lane separation, vehicular-cycling laws, and Idaho-stop legislation are all attempts at the total-harm calculus."
  - "Free-speech vs reputation conflicts: defamation law sits on Coase's substrate-claim. 'Speech harms reputation' and 'reputation-protection harms speech' are reciprocally symmetric; the question is which produces less total harm. Different jurisdictions (US vs UK defamation regimes) reflect different total-harm judgements."
  - "Dev-velocity vs reliability: 'reliability-team blocks velocity' and 'fast-shipping blocks reliability-investment' are reciprocally symmetric. SRE error-budget systems (Beyer et al. 2016 *Google SRE*) operationalise the Coase frame — both teams have their costs surfaced and the budget makes the total-harm calculation explicit."
  - "Carbon emissions and consumption goods: 'driver harms global climate' and 'climate-restriction harms driver's mobility/livelihood' are reciprocally symmetric in Coase's sense. Carbon-pricing schemes attempt the total-harm calculation; the political contestation reflects different framings of which harm is larger and who should bear the transition costs."
  - "operationally distinct from lex-yyfx5 coordination-mode-set-by-relative-transaction-costs: lex-yyfx5 is Coase 1937 — the boundary between coordination-MODES (firm vs market); lex-p7uh9 is Coase 1960 — the reciprocal-harm structure of incompatible-USES over shared resources. Both Coase papers contribute distinct substrate-primitives. They compose when the response to reciprocal-harm is to integrate the uses into one firm (internalise the externality) — that is the Coase-1937 mechanism applied to the Coase-1960 problem."
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is about MOVING from descriptive ('emotion = inner state') to operational ('emotion = bodily-perception that fires under specific conditions'); lex-p7uh9 is about RESTORING SYMMETRY ('A harms B' → 'A and B each impose a cost on the other'). Both are conceptual-clarification moves but they target different rhetorical defaults."
  - "operationally distinct from lex-d7h2y: paltering is OMITTING information that would change the conclusion; lex-p7uh9 is about REFRAMING an already-framed conflict to expose its reciprocal structure. Paltering operates at the information layer; Coase's move operates at the conceptual-structure layer."
  - "operationally distinct from lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature: that atom names a positive empirical claim about emotion-expression universals; lex-p7uh9 names a normative-analytic move about harm-attribution structure. They are orthogonal."
critical-questions:
  - "does the reciprocal-framing collapse all moral asymmetries? Critics from the law-and-economics-skeptical tradition (e.g., Calabresi 1968, Sunstein, deontological theorists) argue Coase's move smuggles in a utilitarian net-harm metric that ignores rights-based asymmetries (e.g., the right to bodily integrity is not symmetric with another's preference for industrial production). The atom should be deployed as a STARTING MOVE for analysis, not as a normative conclusion — restoring symmetry is necessary but not sufficient for resolution."
  - "what determines whose harm 'comes first' in default attribution? Often it's status-quo bias (the prior user is the default-baseline) or political power (the louder party gets framed as the victim). The atom's diagnostic power requires asking 'what would the asymmetric framing look like if reversed?' If the reversed framing seems absurd, that's evidence the original asymmetry is doing rhetorical work."
  - "does the atom require commensurable harms? The total-harm calculus requires comparing the harm-to-A and harm-to-B on some scale; in many real conflicts (e.g., monetary loss vs aesthetic loss vs health loss), commensuration is contested. Practitioner-discipline: when applying the atom, make the commensuration assumption explicit — saying 'we are comparing $X of lost property value with $Y of reduced industrial output' surfaces what is being treated as commensurable."
  - "how does the atom interact with the Coase Theorem corollary? The Coase Theorem (zero transaction-costs implies rights-assignment doesn't affect efficiency, only distribution) is a downstream technical claim; the substrate-primitive lex-p7uh9 names is the symmetric-harm-structure that holds regardless of transaction-costs. In high-transaction-cost contexts (most real ones), rights-assignment matters for both efficiency and distribution, but the symmetry-restoration is still the correct opening move."
  - "when does the atom mislead? When the conflict is not actually over a shared rivalrous resource (one party is simply attacking the other), the reciprocal-framing creates a false-equivalence. Diagnostic: ask whether each party would also be acting in a way that imposes cost on the other if they swapped positions. If yes, the reciprocal frame fits; if no, the conflict is not symmetric in the relevant sense and Coase's move misapplies."
status: active
