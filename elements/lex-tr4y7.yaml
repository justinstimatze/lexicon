id: lex-tr4y7
name: propaganda-has-no-necessary-relation-to-truth-or-falsity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone dismisses a persuasive communication as 'mere propaganda' and treats that label as proof it must be false, or conversely assumes that because a piece of persuasion checks out as factually accurate it therefore can't be propaganda, check Merton and Lazarsfeld's actual definition: propaganda is any set of symbols that tries to move opinion, belief, or action on a topic the community treats as controversial — a matter of the topic's contested status and the communication's persuasive function, not of whether its content is true. They give a deliberately uncomfortable illustration: a completely honest wartime report of real ship losses can function as highly effective propaganda, inducing citizens to accept deprivations they would otherwise resist, without a single false claim in it. Collapsing propaganda into falsehood is not just imprecise, it's corrosive, because it teaches an audience to treat every persuasive appeal — true or false — as equally suspect, which breeds a defensive uncritical distrust that rejects real information along with real manipulation. Diagnostic move: separate two questions that get collapsed into one — is this content actually false, and is this content trying to move me on a contested issue — because a message can score high on the second axis while remaining completely true on the first, and dismissing it on the second axis alone throws away real information rather than exposing a lie."
