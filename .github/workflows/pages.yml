name: Pages

# This workflow publishes every atom in elements/ — id, name, tier, status,
# cluster, canonical-instances and evokes, plus all edges — to a URL any
# stranger can read. It ran on every push to substrate/** (the directory's
# pre-2026-08-20 name) from 2026-07-22 until 2026-08-04, which published a
# private repo's contents for two weeks; the push trigger was removed
# entirely after that and this stayed workflow_dispatch-only until the repo
# actually went public (2026-08-23, confirmed via `gh repo view`).
#
# Re-added 2026-08-31 as a tag push only, not every push to main -- a tag is
# a deliberate release act (`git tag`), not something that fires on every
# commit, so the "running it IS the decision to publish" framing below still
# holds: tagging a release now IS that decision, made once, on purpose,
# rather than something to separately remember to go dispatch afterward.
# workflow_dispatch stays available for a manual re-publish with no new tag.
# Note that `configure-pages` below carries `enablement: true`, so a run of
# this workflow will re-enable Pages even if Pages was disabled at the
# repository level.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GitHub Pages: one running deploy at a time. Rapid-fire pushes cancel the
# in-flight build so only the latest elements state ships.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: render/go.mod
      - name: bake static elements graph
        run: bash scripts/build-web.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
