id: lex-cwmus
name: easiest-to-move-subpopulation-is-not-highest-harm-subpopulation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when designing or evaluating any intervention that targets a population-level proxy (reduce prevalence, raise a completion rate, lower an average) as a stand-in for the real goal (reduce total harm, improve outcomes). Nutt's diagnosis of UK drug policy: an intervention aimed at reducing PREVALENCE (how many people use) will find its easiest compliance among the subpopulation that was ALREADY lowest-risk -- casual, moderate users who can most readily quit or cut back -- while the subpopulation responsible for most of the real-world harm (heavy users, addicts) is the LEAST responsive to the same intervention, because their use is driven by dependence rather than by the marginal social/legal pressure the intervention applies. The result is not merely an imperfect proxy (regressional Goodhart, lex-hbknh) or a gamed metric (adversarial Goodhart, lex-nbk6e) -- no one is gaming anything and there is no noise term to blame. The mechanism is DIFFERENTIAL RESPONSIVENESS: the population's compliance-probability and its harm-contribution are negatively correlated, so the intervention can move the aggregate metric substantially (fewer total users) while the target quantity (total harm) barely moves, because the people who left were never the ones doing most of the damage. Practitioner move: before adopting a population-level proxy, ask not just 'does this proxy correlate with the goal on average?' but 'who specifically will comply with pressure to move this proxy, and is that the same group that drives the outcome I actually care about?' If compliance concentrates in the low-contribution tail, redesign the intervention to target the high-contribution tail directly (treatment access for addicts, not prevalence campaigns aimed at moderate users) rather than declaring success on the proxy."
related: [lex-hbknh, lex-m4ztd, lex-nbk6e, lex-tb3re]
scaffolds-from: [lex-m4ztd, lex-hbknh, lex-nbk6e, lex-tb3re]
evokes: [prevalence-vs-harm, drug-policy-mcda, casual-users-vs-addicts, differential-treatment-response, rave-act, aggregate-metric-conceals-outcome-stagnation]
lineage:
  - source: primary
    text: nutt-2012-drugs-without-the-hot-air
    citation: "David Nutt, Drugs Without the Hot Air: Minimising the Harms of Legal and Illegal Drugs (UIT Cambridge, 2012). Ch.1-3 (Equasy / Why measuring drug harms frightens politicians / How can we measure the harms done by drugs?). Nutt chaired the UK's Advisory Council on the Misuse of Drugs (ACMD) until his 2009 dismissal, then founded the Independent Scientific Committee on Drugs (ISCD). The book's argument here is not a policy proposal but a diagnostic claim about why prevalence-reduction and harm-reduction are structurally different targets even when applied to the same population of drug users."
    quote: "In addition, if policies that aim for total abstinence do meet with some success, this will primarily be among casual users (who will find it easiest to give up altogether), rather than the heavy users and addicts who suffer the most harm. If we focused solely on reducing the prevalence of alcohol use, for example, it's the 30 million British drinkers who stay within the recommended daily limits who would be most likely to become teetotal, if any did at all. It would be absurd to aim an alcohol-harm-reduction strategy at those who suffer the least harm, rather than trying to help the 10 million hazardous drinkers to reduce their intake. [...] Being 'tough on drugs' requires governments to reduce prevalence, but prevalence alone is the wrong thing to measure -- it's only one factor among many that make up the total effect of drugs on society. [...] even if a small number of people were dissuaded from using ecstasy by the RAVE Act, it's perverse that this would be charted up as a 'success' if the harm done to users had increased overall."
canonical-instances:
  - "This is a fifth mechanism by which metric-gains and goal-gains decouple, distinct from all four of Manheim-Garrabrant's Goodhart variants (regressional, extremal, causal, adversarial) already in substrate: none of them capture heterogeneous treatment-response anti-correlated with target-contribution."
  - "operationally distinct from lex-nbk6e another-agent-with-different-goals-can-bend-your-metric-to-their-ends: lex-nbk6e (adversarial Goodhart) requires a second agent strategically gaming the metric; this atom has no adversary -- the low-harm users aren't gaming anything, they're just more responsive to ordinary social pressure. Distinct from lex-m4ztd intervening-on-a-proxy-changes-the-causal-structure-that-validated-it: lex-m4ztd (causal Goodhart) is about an intervention SEVERING the causal link that made the proxy predictive; this atom is about the intervention's effect being heterogeneously distributed across a population in a way that anti-correlates with harm-contribution."
  - "The book's own case: a hypothetical UK alcohol-prevalence campaign would most successfully move the 30 million moderate drinkers (who face the lowest bar to becoming teetotal) while leaving the 10 million 'hazardous drinkers' -- who generate most of alcohol's economic cost, injury, and family harm -- largely unmoved, because their drinking is driven by dependence rather than casual habit."
  - "The RAVE Act case (US, 2003): legislation aimed at reducing ecstasy use by penalizing venues; even if it modestly reduced prevalence among casual clubgoers, it removed the public-health measures (water, chill-out rooms) that specifically protected the highest-risk users from dehydration deaths -- moving the prevalence needle while plausibly increasing harm concentration among those who kept using anyway."
  - "Smoking-cessation campaigns generalization: mass anti-smoking advertising most reliably moves light/social smokers to quit, while heavy, dependent smokers -- who carry the overwhelming majority of tobacco-attributable disease burden -- are the least responsive population to broad prevalence-reduction messaging and require targeted, higher-intensity cessation support (nicotine-replacement therapy, individual counseling) to move at all."
  - "Corporate 'reduce time spent on the platform' wellness features: the users most likely to actually engage with screen-time limits and act on them are moderate, already-low-risk users; users with compulsive/addictive usage patterns -- who account for the disproportionate share of the harm the feature was nominally built to reduce -- are the least likely to change behavior in response to the same nudge."
critical-questions:
  - "Isn't this just regressional Goodhart (lex-hbknh) under another name -- doesn't a noisy proxy always underperform its apparent signal? No: regressional Goodhart is a static fact about correlation<1 between a proxy and a goal when SELECTING on the proxy's high tail; it requires no action and no population of differentially-responsive individuals. This atom describes what happens when you ACT on the proxy (run an intervention) and the population's response to that action is heterogeneous in a way that specifically anti-correlates responsiveness with harm-contribution. A population could have a perfectly noise-free M-G correlation at baseline and still exhibit this failure mode once an intervention is applied, because the intervention itself introduces the differential-response structure."
  - "How would you know, in advance, whether an intervention will fall into this trap? Practitioner-diagnostic: segment the target population by their contribution to the real outcome (top-decile harm-contributors vs. the rest), then separately estimate each segment's expected responsiveness to the specific intervention mechanism (social pressure, price, legal risk, a nudge). If the harm-weighted segment and the responsiveness-weighted segment don't overlap, the intervention will show apparent success on the aggregate metric while failing the actual goal."
  - "Does this mean prevalence-style interventions are always useless? No -- the atom's claim is narrower: an intervention that targets the WHOLE population uniformly will preferentially move whichever subgroup finds compliance easiest, and that subgroup is not guaranteed (and in cases like drug/alcohol harm, is specifically NOT) the subgroup driving the outcome. The fix is not abandoning prevalence-reduction but targeting the intervention at the harm-concentrated segment directly (Nutt's own conclusion: focus resources on the 10 million hazardous drinkers, not the 30 million moderate ones) rather than measuring success by the population-wide aggregate."
