id: lex-7sa7c
name: multiple-reference-groups-can-reinforce-or-cancel-each-other
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone is subject to more than one comparison group at once, don't assume the effects simply add up in magnitude — check whether the groups point the same direction (reinforcing, producing an intensified verdict) or opposite directions (cross-cutting, producing a netted-out compromise). Merton distinguishes these as two distinct patterns found in the same data. Reinforcing case: the married draftee compares himself unfavorably to BOTH his unmarried Army peers AND his still-civilian married friends, and both comparisons push toward the same conclusion — 'comparing himself with his unmarried associates in the Army, he could feel that induction demanded greater sacrifice from him than from them; and comparing himself with his married civilian friends he could feel that he had been called on for sacrifices which they were escaping altogether.' Both comparisons independently manufacture grievance; the sense of injustice compounds. Cross-cutting case: the overseas noncombat soldier compares himself unfavorably to troops back home (worse off there) but favorably to combat troops (better off there) — 'the overseas noncombat soldier is, by the standards of Army life, worse off than the soldier at home in that he is comparatively deprived of amenities and cut off from social ties, and better off than the combat soldier in that he is not exposed to the same measure of deprivation and risk. It is as though he had said, \"Bad off as we are, the others are worse off.\"' Here the two comparisons partially cancel, and the resulting attitude is a compromise, not an intensification. Diagnostic move: before predicting how someone will feel about their situation from multiple simultaneous comparisons, map each comparison's direction separately — same-direction comparisons compound into stronger reactions than any single comparison would produce alone, while opposite-direction comparisons blunt each other into something milder than either alone would produce."
