id: lex-fcnbk
name: an-unchanging-bearing-on-a-closing-object-is-the-danger-signal
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Seamanship's collision-avoidance rule inverts the intuition most people navigate by. Ordinary threat perception is tuned to detect motion: a boat sliding across your view, growing larger, drifting toward one horizon or the other, reads as something happening and gets attention. Rousmaniere names the actual danger signature as the opposite of that: 'If you are converging with another vessel, take bearings on her every 30 seconds either with the compass or by determining the relative angle. If the bearings move forward, she'll cross ahead of you; if aft, she'll cross behind you. But if they don't change, you are certainly on a collision course.' A vessel whose bearing holds rock-steady while the range closes produces almost no visual signature of danger at all -- no apparent sideways drift, nothing that resembles how a human eye expects closing distance to look. It just grows larger, dead ahead of wherever it already was. The geometry that makes the bearing hold constant is exactly the geometry of two objects on course to occupy the same point in space at the same time.

Transferable diagnostic: when two trajectories are converging -- a competitor closing a market-share gap, a project against a hard deadline, a relationship accumulating grievances, a negotiation running out of runway -- take the same repeated-measurement approach Rousmaniere prescribes for a sailor, rechecking one relative number at intervals instead of trusting a felt impression of how urgent things seem. If that number holds steady while everything else about the situation keeps moving, treat it as confirmed danger and act immediately, exactly as a sailor acts on a bearing that refuses to change. The corrective action itself has to be decisive rather than incremental: Rousmaniere's own advice once collision risk is confirmed is not a small nudge but a large, unambiguous change -- 'turn radically,' not a gentle correction -- because a marginal adjustment to a converging trajectory barely dents the constant-bearing signature that revealed the danger in the first place."
