    citation: "Michael Spence, 'Job Market Signaling,' The Quarterly Journal of Economics 87, no. 3 (Aug. 1973): 355–374 — the contrast partner: costly signals separate types because the cost is type-correlated; cheap-talk assertions don't separate types because anyone can say them."
