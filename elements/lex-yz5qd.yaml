lineage:
  - source: primary
    text: hyde-hermes-god-of-the-hinge-enchants-and-disenchants-at-once
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' section 'Hermes of the Light, Hermes of the Dark.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Hermes himself is neither one of these alone but both at once. He is neither the god of the door leading out nor the god of the door leading in—he is the god of the hinge. He is the mottled figure in the half-light, the amnigoge who simultaneously amazes and unmazes, whose wand both “bewitches the eyes of men to sleep and wakes the sleeping,” as Homer says in the Iliad. I sometimes wonder if all great creative minds do not participate in this double motion, humming a new and catchy theogony even as they demystify the gods their elders sang about. Pablo Picasso had that double motion, disturbing classical perspective while presenting a strange new way of seeing, one so hypnotic it shows up decades after his death on billboards and children’s printed pajamas. Sigmund Freud had that double motion, dragging slips of the tongue into the daylight, or “explaining” Moses, while simultaneously retelling the old story of Oedipus in a manner so compelling that, decades after his death, Ivy League literary critics can’t get it out of their heads."
canonical-instances:
  - "Charles Darwin's theory of natural selection simultaneously dismantled the prevailing belief in special creation and cast a new, equally compelling story of how every living thing came to be exactly as it is, so that the same act of demystification (species are not fixed and designed) supplied the enchanting replacement myth (a single unbroken lineage connecting all life)."
  - "A stand-up comedian's best bit about a painful shared experience simultaneously exposes the absurdity of a social convention everyone had been unreflectively following and makes that convention newly vivid and memorable in the telling, so that naming the illusion and reinforcing its grip on the audience's imagination happen in the same laugh."
critical-questions:
  - "Is this a real structural claim about creativity, or a flattering redescription applied after the fact to any influential work -- could a critic always find both an enchanting and disenchanting element in retrospect regardless of whether the creator's actual process involved anything like a single indivisible motion?"
  - "Does the claim hold for creative work that seems to succeed at only one half (purely dismantling satire with no replacement myth, or purely comforting art with no critical edge) -- are those genuinely lesser, or does Hyde's framework simply exclude cases that don't fit its own thesis?"
  - "Is 'the god of the hinge' meaningfully different from Koestler's bisociation (lex-xfsbm), where a single event is perceived in two frames at once, or is Hyde describing the same underlying mechanism from the creator's side rather than the audience's?"
