id: lex-5jqug
name: a-founding-laws-power-comes-from-generality-not-detail
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When judging whether a proposed foundational claim is worth taking seriously, don't discount it for being simple, general, and short on specifics — that's often exactly the shape a field's highest-leverage discovery takes. Newell and Simon's 1976 Turing lecture names this category directly as a 'law of qualitative structure' and illustrates it with the cell doctrine: 'A good example of a law of qualitative structure is the cell doctrine in biology, which states that the basic building block of all living organisms is the cell.' The same shape recurs with plate tectonics and germ theory, and in each case the claim's later influence had almost nothing to do with the detail it specified up front — it specified almost none — and everything to do with what it let researchers subsequently look for: 'Now that it is accepted, the whole earth seems to offer evidence for it everywhere, for we see the world in its terms,' and, of germ theory despite its many exceptions, 'The law tells us to look for a particular kind of cause; it does not insist that we will always find it.' Their conclusion states the pattern directly: 'Laws of qualitative structure are seen everywhere in science. Some of our greatest scientific discoveries are to be found among them. As the examples illustrate, they often set the terms on which a whole science operates.' A claim like this earns its keep not by being validated in full detail on day one but by reorganizing what the whole field subsequently counts as a relevant observation. Before dismissing a proposed foundational claim as too vague to be useful, ask what new thing it would send you looking for."
