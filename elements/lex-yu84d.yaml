    text: radin-grandmothers-outrage-flips-to-relief-over-the-bear
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 8. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Then Hare went home and said, 'Grandmother, what a great man my grandfather is!''Yes,' said she, 'he is one of the great spirits.''Oh, I wouldn't praise him too much. This is what I did to him.' And he went through the motions of shooting. 'Oh, you big-eyed, big-eared, big-footed creature, you must have killed my brother,' she exclaimed. 'Well, you evil old woman, I will wait for you outside and shoot you under the arm just as I did him,' said Hare. 'Oh, I only said that in fun. Actually I am glad, for now we shall have plenty of fat to eat,' she said."
canonical-instances:
  - "A board member publicly condemns an executive's aggressive, ethically questionable acquisition tactic in a meeting, then privately tells the executive it was the right call once the quarterly numbers come in and show the acquisition paid off."
  - "A relative loudly criticizes a family member for cutting off contact with a difficult in-law, then quietly admits relief once it becomes clear the estrangement means one less person to split an inheritance with."
critical-questions:
  - "Does the story present the grandmother's outrage as a genuine but easily overridden feeling, or as pure performance from the start, and does the answer matter for deciding whether the diagnostic applies to a person's disapproval more broadly or only to this specific, exaggerated pattern?"
  - "Is the grandmother's reversal here different in kind from ordinary grief resolving into acceptance over time, given that hers happens within the same conversation and is triggered specifically by naming a benefit, rather than by any passage of time or emotional processing?"
  - "Does the repeated, near-identical structure of this reaction across multiple killings in the cycle, grasshopper, flint, sharp-elbow, bear, suggest this is a stock narrative formula rather than a claim about how real disapproval works, and if so, does that undercut or simply relocate the diagnostic's usefulness?"
