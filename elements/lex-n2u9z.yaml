lineage:
  - source: primary
    text: cushing-youth-and-eagle-neither-world-will-take-him-back
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Youth and His Eagle.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'You fool and faithless lout, why did you go and become enamored of Death, however beautiful?... You can neither descend to your own people below without wings, nor can you live with the people of the Eagles without love. Go, therefore, to your grandparents!'"
canonical-instances:
  - "An employee who was hired and vouched for entirely by one senior sponsor, and who has spent years building a role and reputation defined entirely through that sponsor's patronage, finds that when the sponsor leaves or falls out of favor, they have no independent standing with the rest of the organization and no easy path back to their prior career track either, having let both atrophy."
  - "Someone who immigrates and builds their entire social and legal standing in a new country through a spouse's sponsorship, without independently establishing their own footing, finds that if the marriage ends, they may have no clear path to remain in the new country and no straightforward way to resume the life and standing they gave up in the old one."
critical-questions:
  - "is this really about the relationship being lost, or about the youth never having built any independent standing of his own in the Eagle world beyond his wife's sponsorship -- would a different failure, one that didn't involve losing her love specifically, have left him in the same stranded position?"
  - "does the story assume the human world is permanently closed to him ('cannot descend... without wings') as a fixed rule, or is that framing driven by the specific way he lost his standing -- could a different kind of failure have left a path back to his original world open?"
  - "how would someone in this structural position actually go about building independent standing in a new domain without either betraying the sponsor whose trust granted them entry, or spreading their loyalty thin enough to weaken the very relationship that got them in?"
status: active
