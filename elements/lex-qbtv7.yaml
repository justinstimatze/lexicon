id: lex-qbtv7
name: an-avoided-place-outlasts-the-memory-of-why-it-is-avoided
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a community collectively abandons a place after a political catastrophe, consider that simply leaving the place unoccupied can transmit the lesson across many more generations than any story ever could, because avoidance requires no one to remember the reason -- only to keep not settling there. Graeber and Wengrow's case: after Cahokia's collapse around AD 1400, the entire fertile American Bottom and the territory stretching to the Ohio River became the Vacant or Empty Quarter -- hundreds of miles of river valley left entirely without permanent human habitation for centuries, erased even from later oral tradition, occasionally crossed by hunters but never resettled. The taboo against the place outlived the specific memory of what had happened there, functioning as a self-perpetuating, geographically encoded rejection of everything the city had stood for. A story can be forgotten, misremembered, or argued with; an empty stretch of land that everyone simply avoids doesn't require anyone to keep telling it right."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, cahokia, vacant-quarter, mississippian, collective-memory, abandonment]
lineage:
  - source: primary
    text: dawn-of-everything-vacant-quarter
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.11 'Full Circle.'"
    quote: "“After AD 1400 the entire fertile expanse of the American Bottom... became what's referred to in the literature as the Vacant or Empty Quarter: a haunted wilderness of overgrown pyramids and housing blocks crumbling back into swamp, occasionally traversed by hunters but devoid of permanent human settlement.”"
  - source: primary
    text: dawn-of-everything-self-conscious-rejection
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.11 'Full Circle.'"
    quote: "“The Vacant Quarter implies a self-conscious rejection of everything the city of Cahokia stood for.”"
canonical-instances:
  - "The direct textual anchor, on how completely the memory itself was lost even as the avoidance persisted: 'Whatever happened in Cahokia, it appears to have left extremely unpleasant memories. Along with much of its bird-man mythology, the place was erased from any later oral traditions.'"
  - "Hypothetical: a factory town's central mill burns down after a strike turns violent, killing several workers, and the town never rebuilds on that lot -- it becomes an empty field that generations of children are simply told to stay away from, with the actual story of the strike having faded from local memory by the third generation. The empty field keeps doing the work the story used to do, discouraging anyone from ever proposing to build there again, long after no one could say why."
critical-questions:
  - "How would researchers distinguish a deliberate, memory-encoded political taboo from a much more mundane explanation -- that the region was simply left unfarmed because the same ecological pressures (overpopulation, soil depletion, disease) that likely contributed to Cahokia's collapse in the first place also made the area a genuinely poor place to resettle, independent of any collective political rejection?"
  - "If the avoidance really outlives the memory of its cause, how would anyone ever confirm that it started as a POLITICAL rejection specifically, rather than a purely practical avoidance (fear of a haunted or cursed place, unrelated to any considered judgment about Cahokia's system of rule) that only later gets narrated, after the fact, as having been about political rejection all along?"
status: active
