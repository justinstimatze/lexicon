canonical-instances:
  - "A public defender assigned cases by docket rotation, with no ability to decline, develops a strong preference against a certain category of client; because the rotation guarantees exposure regardless of preference, the preference shows up only in the defender's own burnout and case-satisfaction scores, not in a reduced share of that client type on their docket."
  - "A ride-share driver working through an app's automatic dispatch, unable to decline a match without a penalty, develops a preference for short, high-tip rides; the preference cannot change the mix of rides dispatched to them, so it surfaces purely as lower self-reported job satisfaction on days the mix skews toward the disfavored ride type, with no behavioral escape valve available."
critical-questions:
  - "Martin's data is cross-sectional: students with more preferences report less satisfaction, but the essay does not rule out the reverse causal direction — that generally dissatisfied students are simply more prone to expressing preferences of all kinds, rather than the preferences themselves lowering satisfaction. Which direction does the causal arrow actually run, and could an independently-timed prior measure of satisfaction (compare lex-s3c3x's method) separate the two?"
  - "Does the 'no escape valve' framing hold up if assignment is only PARTIALLY random — for instance, if senior staff can informally trade or decline the worst-fitting cases while junior staff cannot? At what threshold of actual selection-power does the preference stop being a pure satisfaction cost and start becoming, once again, a behavior-shaping lever?"
