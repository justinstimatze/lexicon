    quote: "Like my own son you shall be, Master in our family: Come down, Nuncle, from the tree-- Come and hurry home with me?... You are laughing in your sleeve! Have you quite forgot that beating? Here I am content to live (So good-bye) ripe mangoes eating."
canonical-instances:
  - "An employee who left a job after months of a manager's public humiliation gets a warm, personal message from that same manager the week a major project needs extra hands. They decline. Change might be possible in principle, but this outreach arrived exactly when the manager needed something, and no apology ever came earlier, when nothing was at stake."
critical-questions:
  - "Is the monkey's refusal actually well-calibrated, or does it foreclose a genuine possibility that people do sometimes change and that timing coinciding with need doesn't automatically prove insincerity?"
  - "What would it actually take for the snake-charmer to earn back trust here, given that almost any gesture he makes while still wanting the monkey back could be read through the same lens the monkey is applying?"
