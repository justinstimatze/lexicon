    quote: "We are no fools, and we know you; We are the same, and you are too: You have designs against our weal, So, heretic, this fear we feel."
canonical-instances:
  - "A vendor who has supplied a company reliably for fifteen years is caught once quietly substituting a cheaper material without disclosure, and no amount of the vendor's subsequent reassurance or discount offers restores the account, because the single detected substitution outweighs the entire prior track record."
critical-questions:
  - "Is the pigeon-chief's total distrust proportionate here, given that the ascetic never actually harmed a single pigeon in fifty years — does one detected intention deserve the same response as one completed betrayal?"
  - "Would a differently-timed flattery attempt, offered before rather than after the detection, have had any better chance of working, or does the sequence itself make no difference once genuine suspicion exists?"
