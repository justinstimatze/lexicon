id: lex-tytpk
name: broadcasting-a-stigmatized-origin-drains-its-power-to-shame-into-silence
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A group can silence someone by attaching shame to some fact about their origin or condition (illegitimacy, a stigmatized birth, a subordinate status), treating 'legitimate' and 'illegitimate' as if they were categories found in nature rather than labels the group itself is applying -- and the silencing works specifically by making the marked person reluctant to speak about their own condition at all, since speaking risks the shame reaction. The countermove Hyde locates in the Hymn is not concealment but the opposite: publicly naming the stigmatized fact before anyone else can weaponize it. Hermes, born of a secret and shameful affair between Zeus and Maia, responds not by hiding his origins but by making his own new-made lyre into an instrument for 'broadcasting the story of his own famous conception.' Hyde generalizes the silencing mechanism first: 'Often the powerful (or the proper) tease and taunt the powerless (or the impudent), invoking Legitimate and Illegitimate as if they were categories of nature, then tying illegitimate tongues so they cannot speak to their own condition.' Frederick Douglass names the same seizure from the inside, describing his own first public speech: 'The truth was, I felt myself a slave, and the idea of speaking to white people weighed me down. I spoke but a few moments, when I felt a degree of freedom, and said what I desired with considerable ease.' Diagnostic move: when a stigmatized fact about someone's origin is being used to keep them from speaking on their own behalf, the fix is not to hide the fact more carefully -- hiding leaves the shame-mechanism fully loaded for whoever else discovers it -- but to say the fact aloud, in public, on one's own terms and in one's own voice, before it can be deployed as an accusation; the shame threshold that depends on the fact staying unspoken by its owner loses its grip the moment its owner speaks it first."
