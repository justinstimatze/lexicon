canonical-instances:
  - "A company facing a hostile activist investor's demand for a board seat opens negotiations by offering a much smaller concession -- an advisory role with no vote -- and only escalates toward an actual seat in stages if each smaller offer is rejected, rather than immediately offering the full board seat to end the standoff quickly."
  - "A freelancer being pressured by a client to discount a project doesn't jump straight to their real bottom-line rate to seem accommodating -- they offer a small discount first, and only increase it in increments if the client keeps pushing, discovering the client's actual threshold rather than assuming it's as low as their own worst-case number."
critical-questions:
  - "does incremental escalation risk signaling weakness or bad faith to the other party, making them dig in harder or become suspicious of stalling, in a way that a single credible, final offer would not?"
  - "how much time does this approach actually cost, and is that cost always affordable -- if the threat has its own deadline pressure or patience limit, does testing successively higher offers risk missing the window entirely and ending up paying the maximum anyway, or worse, facing the attack outright?"
  - "does the weak king's information asymmetry actually favor this tactic, or does the aggressor also learn from each rejected offer -- specifically, that the weak king is willing to keep raising the price, which could itself invite the aggressor to hold out longer than they otherwise would have?"
