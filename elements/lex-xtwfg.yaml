id: lex-xtwfg
name: a-groups-failed-joint-decision-splits-into-factions-blaming-each-other
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a group commits together to a course of action and it fails, the group often doesn't hold itself collectively responsible -- it splits into factions that each blame the other faction for the very decision both of them made together. In Cushing's telling, an entire people jointly decides to kill a divine family for the 'crime' of an unknown marriage, arming for war as one body. As the family escapes upward out of reach, the failure doesn't produce collective reflection; it produces internal war: 'the people, old and young, began to quarrel and fell to beating one another, and to fighting among themselves. The old ones called the young ones fools for attempting the life of a god, and the young ones in turn called the old ones fools for counselling them to attempt the life of a god.' Both factions took part in the same council, the same arming, the same siege. Neither questions whether the plan was wrong when it was being made; each only discovers, after it fails, that the other faction must be the one responsible for having wanted it. The tale names this moment as the origin of a permanent condition: 'ever since then ... the world has been filled with anger, and even brothers agree, then disagree, strike one another.' Diagnostic move: after a group decision fails, watch for the split into 'the ones who pushed for it' and 'the ones who went along with it' -- both labels usually retrofit a unity that existed fully at the time the decision was made, and the split itself is often more about avoiding collective responsibility than about who was actually at fault."
