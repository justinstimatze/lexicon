agent-instruction: "When examining cultic dynamics in modern settings, algorithmic immersion can functionally substitute for physical institutional severance. The feed colonizes the same cognitive niche the cult location used to. Surface the immersion-time/exposure ratio before treating someone as just 'having opinions'."
