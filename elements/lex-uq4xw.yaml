id: lex-uq4xw
name: an-object-cannot-change-itself-add-the-instrument-and-the-coupling-field
type-in: situation
type-out: composition
_tier: atomic
agent-instruction: "When a problem stalls on 'how do I change/measure/detect this thing', check whether you're missing one of two necessary pieces: an instrument (a second substance that can act on the target) and a field (the specific form of energy or interaction that lets the instrument actually couple to the target) — a bare target object cannot act on itself, and a target-plus-instrument with no coupling field is just two inert things sitting next to each other. Altshuller derives this from comparing solved problems across unrelated domains (leak detection, polymer-hardening measurement, bulk-material motion sensing, wedge extraction) and finding the same minimal shape in every solved case: 'each time a substance is given one has to add a second one, together with a field... In the solutions to our problems three active agents are present: Substance S1 which has to be changed, processed, converted, discovered, inspected, etc; Substance S2, the instrument by which the necessary action is accomplished; Field F, which provides the energy, force, etc, that is, it guarantees the reaction of S2 on S1... Of themselves the field or substances can produce no effect. In order to do something with substance S1 one needs an instrument (Substance S2) and energy (Field F).' He calls this minimal three-element unit the S-Field and states the completion rule directly: 'a barely complete technical system is known to be more effective than an incomplete system, therefore the non-S-field and incomplete S-Field systems given in the problems should be augmented into full S-Fields.' The diagnostic payoff is concrete: a problem statement that names only an object (an incomplete, one-element system) or an object plus a field with no way for the field to act on it (an incomplete two-element system) is missing a piece, and the fix is almost always to add the missing element rather than to keep trying to act on the bare object directly — his wood-chip-sorting case shows this explicitly: chips alone can't be sorted by any field directly, so a ferromagnetic powder (the missing instrument S2) is added to the bark, which THEN lets a magnetic field (the missing coupling) separate it from the wood. Diagnostic move: when stuck on 'how do I affect/measure/detect X', name the three slots explicitly — the target (X), the instrument (what specific second thing will act on X), and the field (what specific form of energy or interaction couples the instrument to X) — and check which slot is empty; a problem that names a target and a general intention but no instrument, or an instrument with no way to couple to the target, is missing exactly the piece a solution needs to supply."
