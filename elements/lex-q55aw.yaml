    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'That's My Way, Coyote, Not Your Way,' bridging into 'Hallmarks of Trickster's Mind.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "there is an important way in which these lying animals are just like animals that do not lie: both are constrained by instinct. The lying animal cannot lie creatively; it cannot vary its repertoire. The mother grouse never plays possum and the possum never plays grouse. ... any animal bound by instinct is vulnerable to what I call “technicians of instinct.” ... an animal with one instinctual deception in its repertoire has some advantage over an animal with none, but that advantage is lost when it meets a predator who knows how to decipher the deception. Then it is stuck, trapped in its own defense. ... Bee and Bear, who cannot tell a lie, are easier to trap than Grouse, who has her single famous fib. But Grouse is easier to trap than trickster, whose fabulations never end."
canonical-instances:
  - "A fraud-detection team eventually learns the one telltale pattern a scam ring always uses to disguise its transactions, and every account run by that ring becomes instantly flaggable, while a more sophisticated ring that varies its method each time is never solved by any single detection rule."
  - "A prey species that has exactly one alarm call for danger becomes easy for a predator to exploit once the predator learns to ignore or mimic that specific call, while a species capable of generating novel warning signals stays ahead of any predator that has only ever learned its past signals."
critical-questions:
  - "Does maintaining a genuinely unlimited, ever-varying repertoire of deceptions carry its own cost -- unpredictability to allies, difficulty being trusted, cognitive overhead -- that a fixed, reliable single trick avoids, making the tradeoff more even than 'more variety always wins'?"
  - "Is there a practical ceiling on how large a deceptive repertoire can actually be before an opponent, given enough exposure, starts to detect the pattern of pattern-varying itself, rather than any single trick?"
  - "Does this framing hold for deceptions used defensively (evading capture) as well as offensively (deceiving a mark), or does an offensive deceiver face different constraints on repertoire size than a defensive one?"
