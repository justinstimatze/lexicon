lineage:
  - source: primary
    text: stryker-2017-transgender-history-ch5-millennial-wave
    citation: "Susan Stryker, *Transgender History: The Roots of Today's Revolution* (2nd ed., Seal Press, 2017). Stryker (historian; founding co-editor of *TSQ: Transgender Studies Quarterly*) develops the noun-versus-adjective analysis in Chapter 5 ('The Millennial Wave'), in the section titled 'LGB(T) (and Sometimes I),' following her account of Transgender Nation's 1992 founding within Queer Nation-San Francisco, the fight over trans inclusion at the 1993 March on Washington for Lesbian, Gay, and Bi Equal Rights, and the 1990s shift in nomenclature from 'queer' alliance-politics toward an 'LGBT+' model of minority-tolerance organizing. The passage is Stryker's own analytic gloss on why the LGBT coalition's nominal inclusion of transgender people so often failed, in practice, to be genuinely inclusive."
    quote: "Most transgender advocates used the word transgender as an adjective to describe a way of being a man or a woman, or as a way of resisting categorization by those labels. Like class or race or physical ability, transgender functioned for them as a descriptive term that cut across the sexual orientation categories, rather than as a noun describing a separate “species” of sexual identity. A transgender man could be gay or straight or bi, in other words, just as he could be black or poor or disabled. Many cisgender gays and lesbians, however, regarded the T precisely as a new species of sexual identity appended to their own. They considered trans people to be, first and foremost, trans people rather than members of the L, G, or B groups who also just happened to be trans. This construction of transgender identity as a noun rather than an adjective—as a kind of person rather than a descriptive quality attached to another category of personhood—had the unfortunate effect of reinforcing the idea that homosexuality and bisexuality were by definition “gender normative” and that anyone who deviated from the conventional definitions of “man” and “woman” automatically belonged in the transgender category. This way of thinking about transgender tended to reinforce the similarities between homosexual cultures and mainstream society based on shared concepts of gender and to perpetuate the marginalization of transgender people, within both the mainstream society and the LGBT movement."
canonical-instances:
  - "The core historical instance Stryker names directly: transgender advocates' own adjective-model ('transgender functioned for them as a descriptive term that cut across the sexual orientation categories... A transgender man could be gay or straight or bi... just as he could be black or poor or disabled') against the noun-model many cisgender gays and lesbians actually applied ('a new species of sexual identity appended to their own'), with the stated political consequence: reinforcing 'the idea that homosexuality and bisexuality were by definition “gender normative”' and perpetuating 'the marginalization of transgender people, within both the mainstream society and the LGBT movement.'"
  - "The institutional operationalization of the noun-framing Stryker traces across the same chapter: the 1993 March on Washington's national organizing committee voting down a trans-inclusion resolution even as some local committees added 'transgender' to the title; and the broader 1990s shift Stryker critiques from queer alliance-politics to an 'LGBT+' minority-tolerance model that 'sometimes amounted to little more than a “politically correct” gesture of token inclusion for transgender people' — nominal addition of the letter without structural change to the noun-not-adjective classification underneath it."
  - "A modern cross-domain analogue, responsibly extending rather than drawn from Stryker's text: a corporate diversity program organized as parallel, mutually exclusive employee-resource-group slots ('Women,' 'LGBTQ+,' 'Disability,' 'Veterans') rather than as independently-varying adjectival qualities, which structurally implies that a disabled woman, a queer veteran, or a disabled person of color has no natural home in the scheme, reproducing Stryker's noun-not-adjective mechanism outside the LGBT-movement-history context it was diagnosed in."
  - "The general form Stryker's own text gestures at beyond the single 'T': 'In the decades ahead, any number of other initials representing other identities were added to the alphabet soup, and their order was perpetually rearranged' — each new letter added to an identity-coalition's acronym is, unless the category it names is explicitly modeled as an adjective, at risk of repeating the same noun-based, appended-species structure for the population it nominally represents."
critical-questions:
  - "Is this category being modeled as a NOUN — a separate, bounded kind of person appended alongside the coalition's other categories — or as an ADJECTIVE — a descriptive quality, like 'poor' or 'disabled,' that a member of any other category in the coalition could also carry?"
  - "If the category is modeled as a noun, what is the default-normativity effect on the OTHER categories in the scheme? Are members of A, B, C being implicitly assumed to lack quality X, simply because X has its own separate slot rather than being an independently-varying dimension every slot could carry?"
  - "Has the category been added NOMINALLY (a new letter, a new name on the letterhead) without being modeled STRUCTURALLY as cross-cutting — i.e., is the population still organizationally, rhetorically, or literally kept in a separate track (a separate resource group, a separate line on an intake form, a separate march) rather than folded through the coalition's existing categories?"
  - "Is the live question about the BASIS on which a coalition lacking a shared positive identity can organize at all (lex-fgrmh, Bornstein's shared-defiance principle), or about how an already-included category is grammatically and structurally modeled relative to the coalition's OTHER categories (this atom)? A coalition can get Bornstein's question right and still make Stryker's noun-not-adjective mistake."
  - "Is the live question about the ONTOLOGICAL status of an identity — whether it is the effect of performative repetition rather than a prior essence (lex-y2tbg, Butler) — or about a DEFINITIONAL, POLITICAL choice in how an already-formed category is taxonomized relative to other categories in a coalition (this atom)? These operate at different levels and neither answer determines the other."
