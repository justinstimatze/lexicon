id: lex-u2bg6
name: visible-abundance-invites-the-destruction-that-obscurity-escapes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'Observing two otherwise similar objects treated oppositely by others solely because one is visibly valuable and the other is not, a person can generalize that visible desirability itself invites damaging attention, while going unremarked confers safety — extending the observation from trees to social positions like wealth and poverty. In the Jataka''s tale of Kumbhakara, King Karandu reaches paccekabuddha-hood from exactly this observation: "This mango tree stands beautiful in its barrenness like a bare mountain of jewels; the other from its fruitfulness fell into that misfortune: the householder''s life is like a fruitful tree, the religious life like a barren tree: the wealthy have fear, the poor have no fear: I too would be like the barren tree."'
related: []
evokes: [jataka, sattanipata, kumbhakara-jataka, visible-value-invites-destruction, obscurity-as-safety]
lineage:
  - source: primary
    text: jataka-chalmers1895-kumbhakara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 408, Kumbhakara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "This mango tree stands beautiful in its barrenness like a bare mountain of jewels; the other from its fruitfulness [377] fell into that misfortune: the householder's life is like a fruitful tree, the religious life like a barren tree: the wealthy have fear, the poor have no fear: I too would be like the barren tree."
canonical-instances:
  - "A founder who watched a visibly successful competitor get torn apart by lawsuits, imitators, and regulatory scrutiny deliberately keeps her own company's growth quiet and modest, reasoning that staying unremarkable is what let two similar businesses survive while the flashy one didn't."
critical-questions:
  - "Does staying deliberately obscure actually reduce risk, or does it just trade the risk of being targeted for the cost of never getting the benefits that visibility would also bring?"
  - "Is this a sound generalization from one pair of trees, or does it overfit a single vivid contrast into a rule that doesn't hold once the sample gets bigger?"
status: active
