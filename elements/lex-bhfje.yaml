canonical-instances:
  - "A young adult raised with a total ban on unsupervised internet access leaves for college with no practiced sense of how to regulate their own time online, and the sudden unrestricted access produces a level of compulsive use that gradual, supervised exposure earlier in life would likely have never allowed to develop."
critical-questions:
  - "Is the extreme reaction actually caused by the total shielding, or would this particular prince have reacted the same way regardless of how he was raised — does the story give enough evidence to separate the two explanations?"
  - "Does this mean any exposure at all is better than total shielding, or are there stimuli where the graduated-regulation tradeoff doesn't apply and complete avoidance really is the safer strategy?"
