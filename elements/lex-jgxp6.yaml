evokes: [tracy-seminary-not-one-made-objection, escalating-past-the-people-who-actually-know, a-distant-veto-is-cheaper-to-give-than-a-close-one, venue-shopping-for-an-objection]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch7-tracy-seminary
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter VII, 'Triumphs and Trials.'"
    quote: "“I went at once to Miss Tracy to ascertain if what I had heard was true, and was coolly told it was, and the miserable plea was offered that it would have injured her school if she had done otherwise. I told her she should have told me so at the beginning, but I did not believe that any girl in the school would be opposed to the presence of my daughter, and that I should be glad to have the question submitted to them. She consented to this, and to the credit of the young ladies, not one made objection. Not satisfied with this verdict of the natural and uncorrupted sense of justice and humanity of these young ladies, Miss Tracy insisted that the parents must be consulted, and if one of them objected she should not admit my child to the same apartment and privileges of the other pupils. One parent only had the cruelty to object, and he was Mr. Horatio G. Warner, a democratic editor, and upon his adverse conclusion, my daughter was excluded from ‘Tracy Seminary.’”"
canonical-instances:
  - "The escalation was not neutral fact-finding -- Miss Tracy had already stated her actual motive before the schoolgirls were ever asked ('it would have injured her school if she had done otherwise'), meaning the poll of the girls was never going to be treated as dispositive if it came back the wrong way. The parent poll wasn't a more thorough version of the same inquiry; it was a second attempt to get a different answer to the same question."
  - "Hypothetical: a manager proposes assigning a disabled employee to a client-facing project. The employee's actual teammates, who'd work alongside them daily, have no objection. The manager then polls other regional office heads who've never met the employee and have no stake in the project's daily execution. One eventually raises a vague liability concern, and the manager cites it as grounds to reassign the employee -- ignoring the team's own unanimous comfort with the arrangement."
critical-questions:
  - "How does an observer distinguish this pattern from a decision-maker who is doing legitimate due diligence by consulting a genuinely relevant secondary stakeholder group (parents DO have some legitimate interest in their own children's schooling)? Douglass's account suggests the tell is sequence and stated motive -- the escalation happened only after the first, more-informed answer failed to produce the desired result, and the decision-maker had already revealed what result she wanted -- but is sequence alone a reliable diagnostic, or does it require independent evidence of the decision-maker's prior stated motive, which won't always be available?"
  - "Does the mechanism require the decision-maker to already have a stated reason to want a particular outcome (as Miss Tracy did), or can it occur unintentionally -- a decision-maker genuinely uncertain what to do, who unconsciously keeps polling wider circles until ANY strong opinion emerges, without ever having wanted a specific answer in advance?"
  - "What structurally protects against this move -- does treating the directly-affected party's consensus as procedurally FINAL (not merely advisory) close the loophole, or does a sufficiently motivated decision-maker always find some more distant body with formal authority to overrule a closer, more-informed one?"
