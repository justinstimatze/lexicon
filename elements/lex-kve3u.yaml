name: shame-attaches-to-identity-guilt-attaches-to-a-correctable-act
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Shame and guilt aren't two intensities of the same bad feeling -- they attach to different objects, and that difference determines whether the feeling is repairable through action or not. Guilt says 'I did a bad thing'; the thing is separable from the self, and there's a standard remedy, apologize, make restitution, do penance, after which the account is understood to be settled. Shame says 'I am a bad thing'; because the flaw is fused to identity rather than to a discrete act, there's no equivalent action that closes it out, and it tends to persist regardless of anything done afterward. Hyde states the folk formula and its consequence together: '\"Shame is what you are, guilt is what you do,\" goes an old saying. Guilt can be undone with acts of penance, but the feeling of shame sticks around like a birthmark or the smell of cigarettes.' The comparison is exact: a birthmark isn't removed by behaving well afterward, because it was never a behavior in the first place. This is why treating a shame problem with a guilt-shaped solution reliably fails, offering someone an apology to make, a restitution to pay, or a corrective action to take does nothing for a feeling that was never about a discrete act to begin with, and can even deepen the shame by implying the person should have been able to fix it and didn't. Diagnostic move: before proposing a remedy for someone's bad feeling about themselves, ask whether the feeling is actually attached to something they did (in which case an act of repair may genuinely resolve it) or attached to what they take themselves to be (in which case no act of repair addresses the actual location of the wound, and a different kind of response, one aimed at identity rather than behavior, is what the feeling actually calls for)."
