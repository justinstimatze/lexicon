id: lex-hjcxk
name: extend-protection-on-observable-disengagement-not-on-judged-guilt
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When deciding who to spare in an ongoing conflict, don't try to judge each person's underlying loyalty, guilt, or past conduct in the moment -- protect based on a small set of observable, unambiguous signals of disengagement instead, since those can be checked instantly while assessing someone's true allegiance or history cannot be, and a rule that requires the latter simply won't be followed under pressure. Kautilya's rule for storming a fort names exactly six protected categories, all defined by visible behavior rather than assessed character: 'the following shall not be harmed when the enemy fort or camp is attacked: (i) anyone falling down in the fight; (ii) those turning their backs; (iii) anyone surrendering; (iv) anyone who unties his hair or throws his weapons down; (v) anyone contorted by fear; or (vi) anyone who does not fight.' None of the six categories asks whether the person was a loyal defender, a reluctant conscript, or a committed enemy combatant -- each is purely about what the person is visibly doing right now (falling, fleeing, surrendering, disarming, showing fear, not fighting). This is deliberate design, not a simplification for convenience: in the chaos of an actual assault, there's no time and no reliable way to assess anyone's true history or intent, but there is time to see whether someone is currently fighting or not. A rule built on judged character would either go unenforced (impossible to apply fast enough) or be applied arbitrarily (whoever seems suspicious gets harmed regardless of actual conduct); a rule built on observable action can actually be followed consistently by many different people acting independently and under pressure. Diagnostic move: when designing a rule meant to protect people during a fast-moving, high-stakes situation, don't define the protected category by an internal state (loyalty, remorse, guilt) that can't be verified in the moment -- define it by an external, checkable behavior that any observer can confirm on the spot, even if that means occasionally protecting someone whose actual history or intent wouldn't have earned protection under a more discerning rule."
