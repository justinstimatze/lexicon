evokes: [hyde-trickster-makes-this-world-a-net-to-catch-contingency, john-cage-chance-operations, the-highest-discipline-is-the-discipline-of-chance, forgetting-the-ego]
lineage:
  - source: primary
    text: hyde-cages-chance-operations-are-a-harder-discipline-than-following-preference
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"A Net to Catch Contingency,\"' on John Cage's compositional practice. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In many ways the discipline Cage recommended was as stringent as that of any monk on a month-long meditation retreat. He asked that intention be thwarted rigorously, not occasionally or whimsically. He worked hard at chance. He would literally spend months tossing coins and working with the I Ching to construct a score. It took so much time, he would toss coins as he rode the New York subway to see friends. One famous piece less than five minutes long took him four years to write. And when a piece was finished, it was not meant to be an occasion for improvisation; it was meant to be played within the constraints chance had determined. “The highest discipline is the discipline of chance operations … . The person is being disciplined, not the work.”"
canonical-instances:
  - "A writer who commits to a strict constrained-writing exercise, like using only words containing a specific letter, finds it far more mentally exhausting than writing freely, because every habitual word choice has to be caught and rejected in real time, while writing 'whatever comes naturally' requires no comparable vigilance."
  - "A manager who genuinely commits to letting a randomized, blind process decide a contested promotion, actively resisting the urge to intervene when the process favors someone other than their gut pick, finds it takes far more sustained self-discipline than simply promoting their preferred candidate would have."
critical-questions:
  - "Is the difficulty here really about discipline, or is it partly about unfamiliarity -- would surrendering to chance become as easy and automatic as following preference once someone had enough practice, meaning the extra effort is a transitional cost rather than an inherent property of the method?"
  - "Does the woodwind player's 'going wild' actually prove that following preference is 'easier' in a meaningful sense, or does it just show that habit is more automatic under pressure, which isn't quite the same claim as habitual choice requiring less genuine effort in general?"
  - "Is there a risk of over-generalizing from Cage's specific, highly demanding practice to a broader claim about chance versus preference, when most everyday instances of 'going with the flow' really are lower-effort than deliberate planning, making Cage's case the unusual exception rather than the rule?"
