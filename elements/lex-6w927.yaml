id: lex-6w927
name: system-operator-nine-windows-scale-and-time
type-in: situation
type-out: composition
_tier: atomic
agent-instruction: "When analyzing any system, don't hold just one mental picture of it in its current form — run three mental screens across scale (the subsystem it's built from, the system itself, the supersystem it belongs to) and three across time (past, present, future) simultaneously, because talented analysis catches design pressure that's invisible from a single fixed viewpoint. Altshuller names this directly: 'Technical systems exist not in isolation. Each one is part of a supersystem of which it forms a part reacting with other parts. But the systems themselves also consist of interreacting parts and subsystems. The first indicator of talented thinking is the ability to shift from the system to the sub- and supersystems and for this three mental screens have to be at work.' He extends the same requirement across time: 'not only at this, but at each stage it is necessary to see the line of development: the past, present and future.' His worked case is a speedboat trying to break a speed record: looking only at the boat (the system, present) produces only timid variants — 'lengthen the hull? give the hull a more streamlined shape? build in a more powerful engine?' Looking at the subsystem level reveals the actual design pressure driving the whole line of development: 'The greater the speed the greater the resistance offered by the surrounding medium. And for this reason the hull tries to shrink, get smaller. The ideal hull would be when there is no hull at all... And the engine, the other subsystem of the boat, tries to get bigger and more powerful' — the hull-shrinks/engine-grows tension IS the mechanism generating every past and future speed-record boat, visible only once you track the subsystem's trajectory across time rather than inspecting one boat's present shape. Altshuller is explicit that this full nine-window pattern (three scales times three time-stages, and in a genuinely rich analysis even more scales above and below) is rare even among skilled thinkers — 'In reality the full screen pattern shows the thinking of a genius in his starry hours, which are extremely rare even in the lives of great thinkers' — but treats deliberately running through the nine windows as a trainable substitute for waiting on that rare talent to strike unprompted. Diagnostic move: before proposing a change to a system, explicitly fill in nine windows — what does the subsystem look like now, what did it look like before, what pressure is pushing it to change next; what does the system look like now, before, next; what does the supersystem look like now, before, next — because a design pressure visible only as a TREND across several windows (a subsystem shrinking while another grows, a supersystem's requirements tightening over time) will not appear if you only ever inspect the system's current, isolated state."
related: [lex-evy3q, lex-gactg, lex-hj2ds, lex-kkkjz, lex-qu6y5, lex-skfsg, lex-tghq5, lex-w42zr]
evokes: [nine-windows, system-operator, supersystem-subsystem-past-present-future, speedboat-hull-shrinks-engine-grows, three-mental-screens]
lineage:
  - source: primary
    text: altshuller-1984-three-screens-scale-and-time
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.4 'Talented Thought: What is it?', section 'Structure of Talented Thought.'"
    quote: "'Technical systems exist not in isolation. Each one is part of a supersystem of which it forms a part reacting with other parts. But the systems themselves also consist of interreacting parts and subsystems. The first indicator of talented thinking is the ability to shift from the system to the sub- and supersystems and for this three mental screens have to be at work... In other words, when looking at a tree (the system) we have to see the wood (the supersystem) and individual parts of the tree (the roots, the trunk, twigs, leaves, etc). Incidentally, not only at this, but at each stage it is necessary to see the line of development: the past, present and future.'"
  - source: primary
    text: altshuller-1984-speedboat-hull-engine-tension
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.4, 'Structure of Talented Thought.'"
    quote: "'Take one of the subsystems of the speed boat, the hull. The greater the speed the greater the resistance offered by the surrounding medium. And for this reason the hull tries to shrink, get smaller. The ideal hull would be when there is no hull at all... And the engine, the other subsystem of the boat on the other hand tries to get bigger and more powerful. If one were to give it its way it would fill the whole hull and then some, breaking to the outside. The struggle of these two mutually contradicting tendencies also determines the line of development of the boat's subsystems: the hull contracts, shrinks and becomes even more willowy, whereas the engines swell and grow, filling all the empty space inside the hull.'"
canonical-instances:
  - "A team debating a mobile app's next feature looks only at the app itself (system, present) and proposes minor UI tweaks; running the nine windows reveals the phone's own hardware trend (subsystem: cameras/sensors getting cheaper and more capable over time) and the platform ecosystem's trend (supersystem: OS-level APIs increasingly exposing that hardware) — together pointing toward a feature no amount of UI-only analysis would surface."
  - "An urban planner studying a congested intersection (system, present) misses that the real design pressure comes from a subsystem trend (vehicles: individual car size and autonomy level changing over the next decade) crossed with a supersystem trend (the city's zoning: density increasing on one side of the intersection) — the nine-window view reframes 'fix this intersection' as 'design for what will be driving through and living near it in ten years,' a different problem than optimizing today's traffic pattern."
  - "operationally distinct from lex-tghq5 problem-difficulty-is-typed-by-how-much-of-the-system-must-change: that atom classifies a SOLUTION's difficulty by how much of the existing system it disturbs; this atom is a DIAGNOSTIC SCANNING PROCEDURE run before any solution is proposed, surfacing design pressures (recurring tensions across scale and time) that then inform what kind of change — and at what level — is actually needed."
critical-questions:
  - "how many windows is actually necessary before diminishing returns set in — Altshuller's own example uses three scales and three times, but also notes richer analyses go further above and below; is there a principled stopping point, or does the method risk becoming an unbounded, ever-expanding checklist?"
  - "does identifying a design-pressure TREND (like hull-shrinks/engine-grows) risk treating an observed historical pattern as an inevitable law, when the trend might instead be an artifact of a particular technology era that a genuinely novel approach could break rather than extend?"
  - "is the nine-window method equally useful for diagnosing a NEW system with no history yet (no real past window to examine), or does it depend on having enough documented precedent in the subsystem and supersystem's own past to make the trend-extraction step meaningful?"
status: active
