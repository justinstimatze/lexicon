    quote: "our hereditary right we shall not lose. One day will take me to Takkasila; one night will be enough to teach me the three Vedas and the elephant lore; on the morrow I will journey home; and on the fourth day I will manage the elephant festival. Weep no more!"
canonical-instances:
  - "A cofounder who is about to be voted out of a leadership role on the stated grounds that they don't understand the company's finances spends the four days before the board vote learning the entire financial model well enough to run the walkthrough themselves, removing the board's stated justification before the vote happens."
critical-questions:
  - "Was the rivals' plan actually contingent on the gap, or was the gap a pretext for a decision they wanted to make anyway — and if it's the latter, does closing the gap just force them to state their real reason, rather than actually stopping them?"
  - "How often does this kind of compressed, extreme effort succeed versus simply exhaust the person attempting it while the outcome was already decided — does the story's version, where the method works flawlessly, understate how rarely a single night is actually enough?"
