name: tradition-fixes-the-plot-and-leaves-style-to-the-teller
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A tradition can hold its plot, themes, and cast of characters completely fixed while leaving the actual language, pacing, and delivery entirely open to the individual performer, and audiences can end up preferring the open part more than the fixed part. Among Winnebago raconteurs, 'no marked departure from a traditional plot or from the specific literary tradition is countenanced' -- the fundamental structure is non-negotiable. But within that fixed structure, fidelity to a predecessor's exact wording was never actually required: 'fidelity was not demanded of him. In fact, an audience generally preferred and valued a raconteur in terms of his own style and phrasing, that is, in terms of his own personality.' Radin is explicit about why this distinction matters: 'we are not dealing here with narratives that were written down. Every narrative was, strictly speaking, a drama where as much depended upon the acting of the raconteur as upon his actual narration.' The fixed plot gave the audience a stable structure they already knew and could track; the free style gave each performer room to be recognizably themselves inside it, and that personal signature, not verbatim accuracy, was the thing audiences actually valued. Diagnostic move: when operating inside a tradition, format, or genre with a fixed underlying structure, look for where the real creative and personal latitude actually lives, since it's rarely in the structure itself but in the style and delivery layered on top of it, and audiences often care more about that layer than about the parts you assumed were the point."
