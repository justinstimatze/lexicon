id: lex-xxmeh
name: emotional-expression-as-cross-cultural-evolved-signature
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When reading emotional expression cross-culturally, expect a small set of evolved signatures (Ekman's basic emotions). The cross-cultural recognition rate is not 100% but well above chance; treat as evidence of biological substrate rather than pure cultural construction."
