canonical-instances:
  - "Solon's neutrality-disfranchisement law in Plutarch: Athenian citizens who deliberately stayed out of a factional civil conflict, choosing neither side to protect their own private affairs, were stripped of citizenship rights — the law treats calculated neutrality during crisis as itself a civic failure."
  - "a professional ethics code that sanctions a bystander's documented silence during a colleague's misconduct as its own violation, separate from the misconduct itself, on the theory that institutional survival requires active alignment, not passive non-involvement."
  - "a wartime loyalty regime that treats a declared-neutral citizen as functionally disloyal, reasoning that opting out during existential crisis is a form of free-riding on whichever side ultimately prevails."
critical-questions:
  - "how does this differ from lex-u2kzt (responsibility-diffuses-as-able-actors-multiply, the bystander effect)? lex-u2kzt describes an EMERGENT PSYCHOLOGICAL FAILURE — individuals fail to help because the presence of other capable bystanders diffuses each individual's felt responsibility, without anyone deciding to withhold help. This atom describes a CODIFIED LEGAL PENALTY targeting DELIBERATE, CALCULATED neutrality — Solon's law does not address a crowd's diffused responsibility during an emergency; it targets a citizen who consciously and strategically declines to align during an ongoing factional conflict specifically to protect private interests while awaiting the outcome. lex-u2kzt is a failure of individual psychology under diffused responsibility; this atom is a legal theory that treats strategic non-alignment itself as a punishable civic wrong."
  - "doesn't this just coerce people into taking sides regardless of merit, rewarding factionalism? The law as Plutarch frames it is explicitly agnostic about WHICH side a citizen joins — it requires only that citizens 'join with the good party and those that have the right upon their side,' i.e. take a considered position, not join any faction indiscriminately. The atom's claim is narrower than 'always pick a side' — it's that a specific kind of self-protective, outcome-watching neutrality during a live crisis is being treated as a civic failure distinct from either faction's substantive claims."
  - "is this compatible with ordinary tolerance for disagreement or dissent? The law targets neutrality specifically DURING AN ACTIVE SEDITION/CRISIS — a moment when the community's basic order is genuinely at stake — not ordinary political disagreement in stable conditions. The atom's scope is bounded to crisis conditions; applying the same logic to routine political disagreement would be a significant and unwarranted generalization beyond what Solon's law or its modern analogs actually claim."
