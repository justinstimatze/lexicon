id: lex-4pb6j
name: broadcast-a-stuck-problem-outside-its-native-field-to-reach-its-solver
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a problem has stalled inside its own specialty, don't only recruit more people from that specialty — publicize the problem itself as widely as possible outside its native field, because the knowledge needed to solve it may sit in a completely unrelated discipline that no one inside the original field would think to consult. Altshuller names this 'the problem finds its own solver' and gives the founding case: nitrogen fixation. 'A complex problem is difficult because it relates to one field, and for its solution knowledge from quite a different field is needed. When in 1898 Crookes presented the problem of binding nitrogen, thanks to his scientific reputation this became known to very many scientists. Birkeland, the Norwegian specialist in polar aureolas, proposed using the processes similar to those going on in the upper atmosphere. The problem 'sought out' the man whose special knowledge was necessary for its solution.' Crookes did not personally identify Birkeland or guess that aurora physics held the key; his contribution was making the unsolved problem visible enough, to a broad and prestigious enough audience, that it eventually reached someone whose adjacent-field knowledge happened to fit. Altshuller pairs this with a second, structurally similar case inside his own teaching practice: a navigation problem stuck for years inside aeronautical specialists was solved by four students who were explicitly NOT navigation specialists, because 'they calculated that a powerful solution would be found outside the range of accepted ideas and principles of navigational instrumentation... The necessary principle of analytical measurements was found in the technology of the confectionery trade.' Both cases share the same mechanism: a hard problem's real bottleneck is often that the needed knowledge exists but sits outside the search radius of anyone currently working on it, so widening WHO ENCOUNTERS THE PROBLEM (rather than working harder within the existing team) is what closes the gap. Diagnostic move: when a problem has stalled despite genuine effort from qualified specialists, consider that the missing piece may not be more effort or more specialist hours but broader exposure of the problem statement itself to fields with no obvious connection to it — publicizing the problem is a distinct, sometimes higher-leverage move than recruiting more people who already look like the people who've been trying."
related: [lex-a6hvx, lex-f6rqu, lex-tghq5]
evokes: [nitrogen-fixation-crookes-birkeland, problem-seeks-its-solver, confectionery-trade-navigation-example, open-problem-broadcast, cross-domain-knowledge-transfer]
lineage:
  - source: primary
    text: altshuller-1984-problem-finds-its-solver
    citation: "G. S. Altshuller, Creativity as an Exact Science, trans. Anthony Williams (Gordon and Breach, 1984), Ch.1, 'On the Road to a Theory of Creativity,' section 'Levels of Problems.'"
    quote: "'There is another method, which can be called 'the problem finds its own solver.' A complex problem is difficult because it relates to one field, and for its solution knowledge from quite a different field is needed. When in 1898 Crookes presented the problem of binding nitrogen, thanks to his scientific reputation this became known to very many scientists. Birkeland, the Norwegian specialist in polar aureolas, proposed using the processes similar to those going on in the upper atmosphere. The problem 'sought out' the man whose special knowledge was necessary for its solution.'"
  - source: primary
    text: altshuller-1984-confectionery-navigation-example
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.1, 'Levels of Problems.'"
    quote: "'One further example: four students at Public Institute of Inventive Creativity took as the subject of their diploma dissertation a highly complicated problem in the field of aeronautical navigation. Work was being carried on in this field in many countries. Three of the students and one young engineer were not specialists in this field. They calculated that a powerful solution would be found outside the range of accepted ideas and principles of navigational instrumentation. So it turned out. The necessary principle of analytical measurements was found in the technology of the confectionery trade which is a long way removed from aviation. The invention received a positive evaluation from the assessors and a patent was awarded.'"
canonical-instances:
  - "A biotech company stuck on a protein-folding bottleneck posts the problem as an open challenge rather than only hiring more structural biologists — the eventual breakthrough comes from a games/crowdsourcing platform (Foldit-style) where players with no biology training, but strong spatial-puzzle intuition, find configurations specialists missed because they weren't anchored to the field's existing heuristics."
  - "A hospital's supply-chain team, stuck for months on reducing surgical-tray turnaround time, finally solves it after the problem is described (stripped of medical jargon) to a Formula 1 pit-crew consultant — pit-stop choreography turns out to contain the exact parallel-task-sequencing knowledge the hospital's own logistics specialists didn't have, because none of them had ever had reason to look at motorsport."
  - "operationally distinct from lex-tghq5 problem-difficulty-is-typed-by-how-much-of-the-system-must-change: that atom classifies WHY a problem is intrinsically hard (how much of the existing system a solution requires changing); this atom is a specific TACTIC for closing the gap once a problem is hard — widen who encounters the problem statement rather than only escalating effort within the field that already owns it."
critical-questions:
  - "how does the person broadcasting the problem know when to stop expanding its audience — is there a point at which wider publicity has genuinely diminishing returns (a problem's needed knowledge may be common enough that any field-crossing already would have surfaced it), or does this pattern assume unlimited value from ever-wider exposure?"
  - "does broadcasting a problem outside its field carry costs the two examples don't mention — competitive exposure, credit disputes, or the risk that a genuinely wrong but confident outside answer gets adopted because it comes from an unexpected and therefore seemingly insightful source?"
  - "in both worked cases, the eventual solver had DEEP expertise in their own adjacent field (Birkeland was a serious specialist in a hard science, not a generalist); does the pattern actually require reaching a specific OTHER specialist with the matching hidden-relevant expertise, rather than simply exposing the problem to a wide, undifferentiated audience — and if so, does 'publicize widely' overstate what actually worked, when 'publicize precisely enough to reach the right adjacent specialty' is the more accurate mechanism?"
status: active
