lineage:
  - source: primary
    text: cushing-coyote-owls-envy-supplies-belief-in-the-self-harming-initiation
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Coyote Joined the Dance of the Burrowing-Owls.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Do you not observe that it is their own grandmothers' heads they have on, the feathers turned white with age?' ... 'Now, this limp is essential to the proper performance of our dance -- so essential, in fact, that in order to attain to it these my children go through the pain of having their legs broken. Instead of losing by this, they gain in a great many ways. Good luck always follows them.' ... 'Look here, my friend, don't you think that I could learn that dance?' ... And he added, aside: 'The silly fool; the sneaking, impertinent wretch! I will teach him to be sticking that sharp nose of his into other people's affairs!'"
canonical-instances:
  - "A cult or high-control group tells an eager, status-seeking recruit that genuine commitment requires cutting off contact with their entire existing support network, framed as a mark of spiritual seriousness rather than an obviously self-destructive demand, and the recruit's desire to belong to something exclusive prevents them from evaluating the cost the way an outsider immediately would."
  - "A predatory investment scheme tells an envious would-be investor that access to an exclusive, high-return opportunity requires liquidating their entire retirement savings immediately, framed as the price of admission the truly committed pay, and the investor's fear of missing out on exclusivity does the persuasive work no honest pitch could have done on its own."
critical-questions:
  - "does this pattern depend entirely on the victim's pre-existing envy and desire for status, or could the same absurd story work on someone with no particular investment in belonging to the group, just through sheer social pressure or authority?"
  - "the Owls privately admit they're punishing the Coyote for prying rather than simply exploiting an opportunity that presented itself -- does knowing the deceivers had a specific grievance change how this pattern should be read, versus a purely opportunistic version with no prior conflict?"
  - "how would a bystander or the target himself have caught this before it was too late, when the story specifically preempts scrutiny by wrapping the cost in the language of exclusive privilege rather than presenting it as a cost at all?"
