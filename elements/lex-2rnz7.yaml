id: lex-2rnz7
name: an-involuntary-tell-under-stimulus-outlasts-a-competent-disguise
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A disguise can be maintained flawlessly against every deliberate test and still fail against a stimulus the wearer cannot consciously suppress. The Panchatantra's donkey, dressed in a tiger skin to graze undisturbed in a farmer's field, passes every visual inspection — until another donkey brays nearby and he cannot stop himself from braying back, exposing what he is. The verse names the exact gap between competence and instinct: 'However skilful in disguise, however frightful to the eyes, although in tiger-skin arrayed, the ass was killed.' A specific triggering stimulus reached a response the disguise never covered — the disguise itself held right up to that point."
related: []
evokes: [panchatantra, loss-of-gains, involuntary-tell-outlasts-a-disguise, instinctive-response-under-a-specific-trigger]
lineage:
  - source: primary
    text: panchatantra-ryder1925-the-ass-in-the-tiger-skin
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book IV, 'The Ass in the Tiger-Skin.' Verified verbatim against a direct extraction of the held copy."
    quote: "However skilful in disguise, However frightful to the eyes, Although in tiger-skin arrayed, The ass was killed"
canonical-instances:
  - "an undercover investigator maintains a fabricated identity through months of scrutiny without a single slip in the story, then is exposed in seconds when a specific trigger — a hometown sports team scoring, a childhood nickname called out in a crowd — produces an unplanned, unsuppressed reaction the cover story never accounted for."
critical-questions:
  - "Which specific stimulus will trigger an uncontrollable response for a given disguise? Is that ever knowable in advance, or does the exposing trigger only become identifiable after the fact, once it has already done its damage?"
  - "Does this claim generalize past instinctive/reflexive tells to deliberate but habitual behaviors — professional mannerisms, verbal tics — that a person could in principle suppress with enough advance awareness, unlike a truly involuntary reflex?"
status: active
