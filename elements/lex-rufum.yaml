    text: distinctness-audit-independent-evolution-of-mind-vs-neuron-count-ladder
    citation: "Five substrate atoms mentioning octopuses or convergent evolution (lex-p6p82, lex-dvydj, lex-gwx3j, lex-qhrpv, lex-xxmeh) were checked directly. Lex-0126 (counter-intuitive-premise-opens-explanation) mentions octopus/human convergent evolution only as a framing-question example ('what if all of evolution had only one organism') illustrating a general explanatory technique, not grounding Godfrey-Smith's argument. Lex-0150 (curiosity-as-uncertainty-reduction) mentions octopuses prying open jars as one example among several of perceptual curiosity in non-human animals — unrelated subject matter. Lex-0468 (algorithmic-immersion-as-functional-substitute-for-institutional-severance) is grounded in an unrelated conspiracy-theory book that happens to share the word 'Octopus' in its title, an entirely different subject. Lex-0128 (comparative-substrate-bootstrapping) is grounded in a Kurzgesagt video's neuron-count-as-pedagogical-ladder (roundworm to bee to octopus to bird to human), using the octopus's 500 million neurons purely as one rung on a teaching scaffold; it does not engage Godfrey-Smith's independent-origin argument or his distributed-versus-centralized architecture claim, and is not grounded in Godfrey-Smith or any primary evolutionary-biology source. None of the five grounds Godfrey-Smith's book or either half of its claim. A further set of atoms using 'distributed cognition' vocabulary (lex-e2tnt, lex-4dsbe, lex-m946g, lex-xxmeh, lex-hbanm, lex-xdc7z, lex-gvwvx, lex-m9arm, lex-t78sc) was also checked. Lex-0189 (cognitive-environment-as-scope) cites the Hutchins distributed-cognition tradition only as one item in a cross-domain-attestation list for an unrelated claim about scoped belief-states. Lex-0277 (recognizer-actuator-decomposition) does not concern evolution or cognition architecture at all. Lex-0784 mentions 'distributed cognition' only inside its own prior distinctness-audit's negative-match list. Lex-0265 (emotional-expression-as-cross-cultural-evolved-signature, Darwin/Ekman) raises the homology-vs-analogy distinction in one critical-question, using octopus camera eyes as a one-line illustrative aside — genuinely adjacent, sharing convergent-evolution vocabulary, but not a primary grounding of Godfrey-Smith's argument; the two atoms are complementary, with lex-xxmeh grounding convergent evolution for a homologous, shared-mechanism trait across close relatives and this atom grounding it for a non-homologous trait across a maximally distant, minimally-common-ancestored pair. Lex-0571, lex-xdc7z, lex-gvwvx, and lex-m9arm cover unrelated subject matter (cultural-market dynamics, gossip, object-vs-field attention, supernatural-surveillance iconography) with no foundational connection to independent evolutionary origins of mind. Lex-0409 (shared-external-substrate-extends-and-distributes-cognition, Hutchins/Clark-Chalmers/extended-mind) is the substrate's only other primary-grounded 'distributed cognition' atom, and is a genuinely distinct mechanism: its distribution is extended-mind distribution across co-present agents and external tools or artifacts (a ship's navigation team, Otto's notebook), while this atom's distribution is within a single organism's own nervous system, across its own body parts, with no external tool or second agent involved — included in `related` as an adjacent-vocabulary neighbor with the distinction made explicit in the agent-instruction. This atom is the substrate's first primary grounding of Godfrey-Smith's book, of the independent-origin-of-complex-mind-as-natural-experiment argument, and of the octopus's distributed-nervous-system architecture as a philosophically decisive claim, as opposed to lex-qhrpv's incidental neuron-count mention."
canonical-instances:
  - "Godfrey-Smith's central natural-experiment move: tracing the vertebrate and cephalopod lineages back roughly 600 million years to a shared last common ancestor no more complex than a small, worm-like Ediacaran bilaterian with a diffuse nerve-net, an animal Godfrey-Smith describes as almost certainly incapable of anything like object-recognition, play, or sleep. Because the shared starting point was this minimal, complex cognitive capacities now found on both branches (large nervous systems, camera eyes, reward-based learning, memory, play, individual recognition) cannot be inherited from that ancestor and must instead have been independently assembled — in Godfrey-Smith's own words, 'evolution built minds twice over.'"
  - "The cephalopod lineage's own internal repetition of the pattern: revised molecular-clock dating (pushing the octopus/cuttlefish-squid split back to roughly 270 million years ago, before the loss of the external shell) implies that complex cephalopod nervous systems themselves evolved independently at least twice within cephalopods — once on the line to octopuses, once on the line to cuttlefish and squid — a natural experiment nested inside the larger vertebrate/cephalopod one."
  - "Convergent camera-eye evolution: vertebrates and cephalopods separately evolved lensed 'camera' eyes structurally similar enough to invite direct comparison, from a common ancestor that had, at most, simple eyespots — Godfrey-Smith's own generalization of the independent-origin logic beyond nervous-system architecture and mind specifically."
  - "The distributed-arm-cognition instance: a common octopus's roughly 500 million neurons are concentrated more in its eight arms than in its central brain (nearly twice as many arm-neurons as brain-neurons), each sucker carrying up to 10,000 neurons for touch and taste, each arm capable of local, recurrent-connection-supported short-term memory and of performing basic reaching-and-grasping motions even after surgical removal from the body — early researchers (Hanlon and Messenger) described the arms as 'curiously divorced' from the brain, and Godfrey-Smith describes octopuses as having 'opted for a partial delegation of autonomy to their arms,' raising the question of where the unified locus, if any, of octopus experience is actually located."
  - "operationally distinct from lex-qhrpv (comparative-substrate-bootstrapping): lex-qhrpv's canonical instance places the octopus's 500 million neurons as one rung on a Kurzgesagt-style pedagogical capacity ladder (roundworm→bee→octopus→bird→human), using the neuron-count comparison as a scaffolding device for teaching what minds-in-general can do. This atom's claim is different in kind — not a scale comparison, but an argument about EVOLUTIONARY INDEPENDENCE (no complex-cognition-capable common ancestor, so shared traits are convergent not inherited) plus a claim about ARCHITECTURE (distributed rather than centralized control). Neither claim is present in or implied by lex-qhrpv's neuron-count-scale."
critical-questions:
  - "Is the similarity between the two compared systems actually inherited from an already-complex shared source — in which case it explains nothing about convergent necessity — or does the most recent common point lie so far back, and was it so minimal, that inheritance cannot be the explanation? Godfrey-Smith's own test: what could the common ancestor actually do, and does that already account for the shared trait?"
  - "If the shared trait cannot be explained by inheritance, is it being properly attributed to convergent pressure toward a genuinely necessary solution (like camera eyes, independently rediscovered because that optical design is a strong local optimum), or could it instead be coincidence, a shared non-adaptive constraint, or an artifact of how the comparison was framed?"
  - "For the distributed-vs-centralized-architecture half of the claim: is 'the mind' or 'the locus of control' being smuggled in as necessarily singular and centralized, when the system under study (an octopus arm, a decentralized organization, a swarm-robotics system) may be doing sophisticated adaptive work with no single point that holds the whole computation?"
  - "Are the two branches or systems being held to a shared, fair standard of comparison — treated as two independent answers to a similar problem — rather than treating one (typically the centralized, human/vertebrate case) as the default 'real' mind and the other as a deficient or exotic variant?"
  - "Is this atom being reached for to explain within-species scale (how much cognitive capacity does X have), in which case lex-qhrpv's neuron-count ladder is the right tool, or to explain the EVOLUTIONARY INDEPENDENCE and ARCHITECTURAL DIVERGENCE of two lineages' solutions, which is this atom's actual claim?"
