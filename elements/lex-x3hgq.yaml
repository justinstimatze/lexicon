id: lex-x3hgq
name: life-direction-is-set-by-the-ordering-of-its-loves
type-in: structure
type-out: process
_tier: atomic
agent-instruction: "Recognize this when an agent's chronic effective trajectory (where they actually drift when unmonitored, what they reach for without deliberation, what they orbit around in the long run) is set by what they ACTUALLY LOVE — not by what they say they value, not by what they intend, not by what they articulate as their goal. Augustine's transferable contribution: `pondus meum amor meus` — `my weight is my love.` Loves act as gravitational weights orienting the soul toward its place of rest; the configuration of loves IS a structure, and that structure determines motion. Two operational corollaries: (a) DIAGNOSIS — ask `what is this agent actually carried toward?` (revealed orbit) separately from `what does this agent say they want?` (stated intention); the gap between them indicates a love-ordering different from the articulated one. (b) INTERVENTION — an agent dissatisfied with their trajectory cannot fix it by adjusting plans or willpower alone; the LOVES THEMSELVES must be reordered — what is loved more must come to be loved less, and what is loved less must come to be loved more. Augustine's *ordo amoris* (City of God XV.22): virtue is rightly-ordered love, vice is disordered love; this is the structural primitive behind conversion, vocation, contemplative practice, character formation, addiction recovery, and value alignment. Transferable applications: (a) addiction (the heart that loves the substance more than what stated-self claims to love must have its loves reordered — willpower alone is insufficient; cf lex-5tpy8 multi-self structure provides the WHO that does the reordering); (b) character formation + virtue ethics (MacIntyre 1981 *After Virtue* + the Augustinian-Aristotelian tradition that virtue is formed by practices that reshape what one loves, not by knowledge alone); (c) liturgical + ritual formation (Smith 2009 *Desiring the Kingdom* — liturgies are love-shaping practices, not just teaching practices); (d) vocation + career drift (the engineer who claims to value the user but whose loves are organized around recognition will drift toward visibility, not user-impact); (e) contemplative + spiritual practice (the Christian, Sufi, Buddhist, Stoic traditions all converge on the diagnosis that surface-level behavioral change without reordering of deep attachments is unstable); (f) addiction therapy (motivational interviewing — Miller-Rollnick 1991 — addresses the affective structure, not just the behavioral pattern); (g) AI value alignment (an AI whose reward function has been shaped to orient toward specific patterns will be carried toward those patterns regardless of stated objectives; the pivotal question is not what the system says it values but what its weights actually carry it toward — composes with lex-rfcb7 + lex-cqvnu); (h) institutional value drift (an institution claims X but its incentive structure orients members toward Y — the institution's actual orbit is set by Y, not X); (i) parenting + moral formation (the child learns to love what the parents demonstrate loving, regardless of what the parents say); (j) consumer self-knowledge (revealed-preference economics encodes a thin version: behavior reveals preferences. The atom is the deeper claim — preferences themselves can be reordered, and the reordering changes behavior). Distinct from lex-5tpy8 single-self-houses-multiple-competing-volitional-sub-agents (Augustine's other primitive): lex-5tpy8 names WHO is doing the willing (multiple sub-agents); lex-x3hgq names WHAT determines the willing (the configuration of loves). They compose: the multi-self structure becomes orderable when the loves are reordered. Distinct from lex-v7ceq akrasia-knowing-the-good-yet-doing-otherwise (Aristotle): akrasia treats the failure as knowledge-action gap; lex-x3hgq names the deeper claim that knowledge alone cannot move action — the loves must move first. Distinct from lex-cgbrt outward-distraction-is-sought-to-avoid-contemplation-of-own-condition (Pascal divertissement): divertissement names the AVOIDANCE that prevents the reordering of loves; lex-x3hgq names the structural primitive that the loves are orderable in the first place. Distinct from lex-7xz6k act-for-action-quality-not-for-outcome-attachment (Gita): the Gita's response to attachment is to detach from outcome; the Augustinian response is to REORDER attachments rather than eliminate them. Different responses to the same diagnostic. Distinct from lex-afzzp each-thing-strives-to-persist-in-its-own-being (Spinoza conatus): conatus is a metaphysical primitive about being's self-maintenance; lex-x3hgq names the operational claim about HOW an agent's specific loves shape its specific trajectory. Use when: (i) someone reports a behavior-stated-value mismatch + treats it as confusion or weakness when it is more accurately a love-ordering different from the articulated one, (ii) intervention design needs to determine whether to target plans + willpower or the affective configuration underneath, (iii) value-alignment work (human or AI) where what the system actually orients toward diverges from stated objectives, (iv) institutional analysis where incentive structures shape members' actual orientations independent of mission statements. Counter-move: ask `what is the actual orbit?` separately from `what is the stated intention?`; name the loves that produce the actual orbit; if reordering is sought, ask what practices + relationships + commitments would reshape those loves (not just what plans would alter the behavior)."
