    text: substrate-attestation-v108-interpreter-architecture-coherence
    citation: "substrate-attestation: lex-gvg5j names the architectural-fact that lex-yh672 left-brain-interpreter operates WITHIN. The substrate has been steadily accumulating atoms that presuppose modular-mind without explicitly naming it: lex-jv983 fluency-trap operates because processing-ease at the synthesis-layer doesn't track modular-truth; lex-mthv9 narrative-coherence operates because the synthesis-layer's job IS narrative-coherence; lex-xqamc argument-from-bias operates because biases reflect modular-incentives the synthesis-layer can't see; lex-jafkg cognitive-bias-as-systematic-judgment-distortion-mechanism label-molecule operates because each named bias is a modular-distortion the synthesis-layer presents as if it were a feature of unified-reasoning; lex-yh672 left-brain-interpreter names the synthesis-layer module itself. Naming the architecture (lex-gvg5j) makes the substrate's accumulated implicit cognitive-architecture explicit and machine-checkable. Cross-source corroboration available: Fodor 1983, Jaynes 1976, Hawkins 2021, Gurdjieff 1915 (acquisition queued for cousin-source strengthening). Note on attribution-hygiene: the phrase 'society of mind' is associated with a primary source whose author has been credibly named in serious sexual-abuse documentation; the substrate does not lead with that author or use that branded phrase, instead grounding the architecture in Gazzaniga's neuroscience-canonical statement plus the cousin-attesters above. This route-around follows established substrate-hygiene practice for problematic-author cases (cf. similar route-arounds in substrate memory)."
canonical-instances:
  - "split-brain experimental result (Gazzaniga + Sperry, 1970s onward): the left and right hemispheres process different stimuli, control different actions, and produce different verbal outputs when the corpus callosum is severed. The unified-self IS the corpus-callosum + synthesis machinery; sever it, and you observe what was always there underneath — multiple processing modules operating in parallel"
  - "akrasia / inner-conflict / weakness-of-will (Aristotle NE Book VII via lex-v7ceq, Augustine *Confessions* on divided will): when a person 'wants X but does Y', the architecture predicts this as competing-modular-outputs the synthesis-layer cannot reconcile, not as a unitary-self failing to be coherent. The classical 'akrasia' framing IS the unified-self framing struggling with what modular-mind predicts"
  - "the lexicon-tool itself (substrate-meta canonical instance): a user consuming lexicon's pattern-catalog is running a synthesis-layer that is composing the patterns into a coherent reading. The modules supplying the user's actual interest in any specific pattern operate below the synthesis-layer's awareness. This means lexicon's affordances should support inspection of multiple possible pattern-fits in parallel rather than presenting a single 'the right pattern' — the modular substrate is the audience, not just the synthesis-layer"
  - "LLM-as-modular-architecture: a transformer LLM has many attention-heads operating in parallel, many feed-forward layers contributing different signal-types, and the output-token is a synthesis. The 'self' the LLM presents in conversation is a synthesis-layer construction over the modular substrate, not a primitive property — directly parallel to the human architecture. lex-gvg5j thus applies cleanly to AI-system introspective reports, which inherit the same modular-substrate-opaque-to-introspection structure"
  - "the **Fodor input-systems-as-modules cognitive-science argument** (Fodor 1983 *Modularity of Mind*): perception and language parsing are modular (domain-specific, mandatory, fast, informationally encapsulated, hardwired, with characteristic breakdown and ontogenetic patterns); they deliver shallow outputs that feed into central systems for belief-fixation. Central systems are NOT modular because confirmation is isotropic (any knowledge may be relevant) and Quinean (confirmation depends on global belief-system properties). Fodor First Law: the more global the cognitive process, the less anybody understands it. The Fodor architecture has stricter scope-commitments than Gazzaniga (modularity restricted to input systems), and the convergence-at-architectural-level despite scope-disagreement is the substrate-meta evidence for lex-gvg5j."
  - "personality-and-mood inconsistency: a person 'is different when tired/hungry/drunk/stressed' because different modules dominate the synthesis-layer's output under different conditions. The architectural prediction: 'who you are' is condition-dependent because the modules contributing to the synthesis are condition-dependent. The unified-personality framing IS the synthesis-layer presenting condition-dependent module-mixtures as if they were stable-trait expressions"
  - "Hawkins thousand-brains voting: when the brain perceives an object, many modules each construct a model of the object from different inputs (different sensory channels, different cortical columns, different reference frames), and the perception is the result of these models voting toward consensus. This is one specific engineering-formulation of how the synthesis-layer operates over the modular substrate — useful as a concrete mechanism-proposal even where Gazzaniga's framing stays at the architectural-level"
  - "Jaynes bicameral mentality (historical-metaphor): Jaynes's proposal that pre-classical humans experienced what we now call modular-output as 'voices' from gods or ancestors is dated as historical-theory but architecturally-suggestive — it frames the modular substrate as having BEEN experientially-accessible before being absorbed into a unified-self synthesis-layer. Useful as architectural-thought-experiment more than as confirmed history"
  - "Gurdjieff 1915 'multitude of small I's': the much-earlier first-person-experiential statement of the architecture — 'man has no single, big I; man is divided into a multiplicity of small I's' — from a non-scientific tradition. Architectural cousin-attestation; the architecture was being noticed by careful introspectors long before the neuroscience demonstrated it"
