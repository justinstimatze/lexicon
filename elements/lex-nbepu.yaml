id: lex-nbepu
name: an-open-ended-wish-forecloses-even-the-grantors-own-future-visits
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'Given an open-ended wish, the sharpest use of it is not to decline every material option in favor of internal virtues (freedom from malice, from lust, from covetousness) — that alone still leaves one channel of future risk open: the grantor''s own continued, well-meaning presence. In the Jataka''s tale of the ascetic Akitti, having already chosen boon after boon for inner freedom, his final request targets the benefactor himself: "Sakka, the lord of beings all, to me a boon he gave:— O Sakka, visit me no more: this boon is all I crave." Sakka, honestly puzzled, points out that most people would want more of his company, not less: "But many men and women too of those who live aright / Desire to see me: can there be a danger in the sight?" Akitti''s answer names the specific mechanism: the sheer splendor of Sakka''s own form is the danger, whatever Sakka actually intends by visiting. "Such is thy aspect all divine, such glory and delight, / This seen, I may forget my vows: this danger has the sight." He spends the wish not on gaining anything, but on removing a temptation that has not yet occurred and would otherwise recur indefinitely, however benevolently offered.'
related: [lex-cxbhy]
scaffolds-from: [lex-cxbhy]
evokes: [jataka, terasanipata, akitta-jataka, foreclosing-future-temptation, boon-spent-on-absence-not-gain]
