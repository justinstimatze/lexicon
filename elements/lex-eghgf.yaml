id: lex-eghgf
name: structured-extractive-protocol-internalises-reciprocity-into-the-act-of-taking
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When extracting from a system, internalize reciprocity into the act of taking — Kimmerer's Honorable Harvest. Take only what you need, ask permission, give in return. The protocol turns extraction into relationship; without it, extraction becomes depletion."
related: [lex-9pgpf, lex-e98pd, lex-urh87, lex-pm93k, lex-k7m6e, lex-fjffq, lex-npyes, lex-qjkvn, lex-ry9qx, lex-u53ue, lex-kdt2v, lex-vw8c3]
scaffolds-from: [lex-npyes]
evokes: [honorable-harvest, kimmerer-2013-honorable-harvest, haudenosaunee-thanksgiving-address, ask-permission-before-taking, listen-to-the-answer, take-only-what-you-need, take-only-what-is-given, never-take-the-first-never-take-the-last, use-everything-you-take, give-thanks, give-back, sustain-the-ones-who-sustain-you, gifts-abandon-the-ungrateful, kiss-the-rice, potlatch-cluster, more-than-human-relations]
lineage:
  - source: primary
    text: kimmerer-2013-honorable-harvest
    citation: "Robin Wall Kimmerer, *Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge, and the Teachings of Plants* (Milkweed Editions 2013). (in-copyright). Chapter 'The Honorable Harvest' (around line 6312 in pandoc extraction) grounds the transferable claim: a structured protocol for human-to-more-than-human extractive relationships internalises reciprocity into the act of taking itself, so that the protocol is not decoration on top of extraction but is constitutive of the relationship that makes the extraction not-theft. Kimmerer enumerates the protocol's cardinal rules — ask permission before taking; listen to the answer; take only what you need; take only what is given; never take the first, never take the last; use everything you take; give thanks; give back / reciprocate; sustain the ones who sustain you. The protocol applies in the extractive relationship itself, not in a separate cohesion-cycle (lex-urh87 Mauss) or commons-institutional-rule (lex-9pgpf Ostrom). Cross-cultural attestation Kimmerer explicitly cites: Haudenosaunee Thanksgiving Address, Pacific Northwest potlatch traditions, Polynesian gift economies, Algonquin elder Carol Crowe's 'first thoughts not what can we take but what can we give to Mother Earth', a Turkish student's grandmother and the 'kiss the rice' tradition. The Corn Spirit story Kimmerer tells (around line 6810: villagers abandon gratitude, the Corn Spirit departs, the cornfields go to weed) is the vital operationalisation: where the protocol fails, the relationship dissolves and what was gift becomes scarcity."
    quote: "[Kimmerer 2013 Ch. 'The Honorable Harvest', on the protocol-applied-in-the-extractive-moment:] 'I resist the urge to answer their call immediately and instead address the plants the way I've been taught: introducing myself in case they've forgotten, even though we've been meeting like this for years. I explain why I've come and ask their permission to harvest, inquiring politely if they would be willing to share... If you ask permission, you have to listen to the answer.' [On the gratitude-vs-reciprocity distinction, the central operational shift:] 'I've heard it said that sometimes, in return for the gifts of the earth, gratitude is enough. It is our uniquely human gift to express thanks, because we have the awareness and the collective memory to remember that the world could well be otherwise, less generous than it is. But I think we are called to go beyond cultures of gratitude, to once again become cultures of reciprocity.' [Algonquin elder Carol Crowe via Kimmerer, on the frame-inversion:] 'This sustainable development sounds to me like they just want to be able to keep on taking like they always have. It's always about taking. You go there and tell them that in our way, our first thoughts are not What can we take? but What can we give to Mother Earth? That's how it's supposed to be.' [Turkish-grandmother cross-cultural attestation:] 'In my grandmother's house we were taught to kiss the rice. If a single grain fell to the ground, we learned to pick it up and kiss it, to show we meant no disrespect in wasting it.' [On the Honorable Harvest as a recognisable cross-cultural family:] 'The Honorable Harvest is her way, too.'"
  - source: practitioner
    text: cross-domain-extractive-reciprocity-attestation
    citation: "Cross-domain attestation of structured-extractive-reciprocity protocols across cultures. (a) Pacific Northwest potlatch (documented in Boas's ethnography from the 1890s; later Mauss 1925 *Essai sur le don*): the potlatch is held to celebrate first-salmon runs, harvests, and significant takings, and operationalises give-back as institutional obligation alongside the extraction. (b) Polynesian gift-economies (Sahlins 1972 *Stone Age Economics* + Marshall Sahlins's broader Pacific ethnography): kinship-based extraction-and-redistribution protocols with explicit consume-the-first-fruits-ceremonially rules. (c) First-fruits offerings in many world religions (Levantine, sub-Saharan African, Mediterranean): the first of each harvest is given back ceremonially before the rest may be consumed — a partial-instance of never-take-the-first. (d) The Haudenosaunee Thanksgiving Address (Ohenten Kariwatekwen): the words-that-come-before-all-other-words ritually acknowledge each provider — earth, waters, fish, plants, animals — before any business. Pairs with lex-k7m6e collective-effervescence as the affective channel through which the protocol is socially reproduced. (e) Modern partial-instances: 'leave no trace' wilderness-ethics (uses don't-take-more-than-you-need; missing the give-back element), Sustainable Forestry Initiative certification (institutional-rule form, weaker than ethical-internalisation), Community Supported Agriculture (CSA — partial give-back via subscription-financing-of-grower-risk), permaculture's 'fair share' principle (Mollison's third design principle: 'set limits to consumption and reproduction and redistribute surplus'). (f) Critical contrast: extractive industries operating WITHOUT the protocol (industrial fishing collapsing fisheries; clear-cut logging destroying forests; groundwater overdraft destroying aquifers) are Kimmerer's empirical demonstration of the Corn Spirit story at industrial scale — where the protocol is absent, the relationship dissolves and the gift withdraws. Cross-substrate attestation across Pacific Northwest ethnography, Polynesian gift-economy literature, comparative religion (first-fruits), Iroquois ritual, modern environmental-ethics, and industrial-fisheries collapse-evidence."
canonical-instances:
  - "operationally distinct from and composing-with lex-pm93k cultural-classification-bundles-or-splits-natural-substrate: lex-pm93k supplies the grammatical-ontological layer determining whether non-human entities are grammatically available to be addressed in the second person at all. lex-eghgf is the ethical-protocol layer that runs on that grammatical substrate — where animacy-grammar is the cultural default (lex-pm93k's Potawatomi case), the Honorable Harvest protocol follows naturally; where inanimate-default is the cultural ontology, the protocol requires deliberate ethical work to overlay."
  - "Kimmerer's leek-picking opening (Braiding Sweetgrass Ch. 'The Honorable Harvest'): she crosses into the woods, finds dense leek patches, but stops to address them — introducing herself, explaining her purpose, asking permission. She digs one clump and finds the bulbs withered. She tucks them back and goes home empty. The micro-instance encodes the critical rule: 'If you ask permission, you have to listen to the answer.' The asking is not theater; it is the protocol element that makes the extraction conditional on the more-than-human's consent (operationally: on the actual state of the patch — whether the leeks have already exhausted themselves)."
  - "the Haudenosaunee Thanksgiving Address (Ohenten Kariwatekwen): the words-that-come-before-all-other-words. Ritually acknowledges each provider — Mother Earth, the waters, the fish, the plants, the animals, the trees, the medicine herbs, the four winds, the thunderers, the sun, grandmother moon, the stars, the enlightened teachers — before any business may commence. Daily extraction is preceded by daily acknowledgement of who is being extracted from. lex-eghgf + lex-k7m6e co-fire: the protocol-rule + the collective-affective state of ritualised acknowledgement together do the work."
  - "Algonquin elder Carol Crowe's frame-inversion (Kimmerer Ch. 'The Honorable Harvest'): asked at her tribal council to summarise mainstream 'sustainable development,' she reports its framing back as 'they want to keep on taking like they always have... it's always about taking.' Her counter-framing: 'in our way, our first thoughts are not What can we take? but What can we give to Mother Earth?' The transferable diagnostic — the orientation of the first thought encodes which protocol is operating, and which orientation is dominant in the surrounding institutions tells you which protocol is institutionalised."
  - "the Turkish 'kiss the rice' tradition (a student of Kimmerer's, reporting on her grandmother's village): a fallen grain of rice is picked up and kissed to show no disrespect was intended in wasting it. Cross-cultural confirmation that the protocol is not Indigenous-North-American only but is a recognisable cross-cultural family across Anatolian peasant-agriculture, Pacific Northwest potlatch, Polynesian first-fruits, Levantine and Sahel first-fruits offerings, and Indigenous North American Honorable Harvest traditions. Different surfaces; same primitive."
  - "the Corn Spirit story (Kimmerer Ch., line ~6810 in extraction): a village abandons gratitude — letting corn rot, burning it for fuel, allowing children to kick ears around in games. The Corn Spirit departs. The next year's fields fail and the people starve until a small child wanders into the woods, finds her, and is taught to teach his people gratitude and respect. After a hard winter she returns. The pivotal claim Kimmerer extracts: 'When they abandoned gratitude, the gifts abandoned them.' Where the protocol fails, the relationship — and therefore the resource — withdraws. This dramatises the constitutive-not-decorative claim."
  - "operationally distinct from lex-urh87 Mauss gift-three-obligations: scope (cross-species vs human-only) AND locus (binds reciprocity into the EXTRACTIVE ACT vs runs reciprocity through the cohesion-cycle of human exchange). Both reciprocity-shaped; different primitives. Many practitioners will fire both simultaneously (a community feast IS both a Mauss-gift exchange AND a Honorable Harvest acknowledgement of the more-than-human providers); the atoms distinguish what each does."
  - "operationally distinct from lex-e98pd reciprocity-as-influence-mechanism: lex-e98pd is reciprocity deployed as a SOCIAL-INFLUENCE LEVER (Cialdini's first-give move; Krishna airport flower). lex-eghgf is reciprocity ETHICALLY-INTERNALISED into how one approaches the more-than-human. Different moral structure and different operational use; lex-e98pd wants to elicit a behavioural return; lex-eghgf wants to make extraction not-theft regardless of whether anyone is watching."
  - "operationally distinct from lex-9pgpf tempo-asymmetry-as-strategic-variable (Ostrom commons-graduated-sanctions): lex-9pgpf is institutional-rules-preventing-defection at the group level. lex-eghgf is ethical-protocol at the practitioner level. They are complementary across scales: Ostrom-style institutions can implement at scale what the Honorable Harvest models individually; the Honorable Harvest is what a commons-protocol BECOMES when fully internalised by participants and the explicit institutional enforcement falls away because the practitioner-orientation IS the enforcement."
  - "modern partial-instances + the diagnostic for industrial-scale failures: permaculture's 'fair share' principle (Mollison's third design principle), Community Supported Agriculture (CSA) subscription-financing, 'leave no trace' wilderness ethics (missing the give-back element), Sustainable Forestry Initiative certification. Each captures part of the protocol; few capture all of it. The Kimmerer-diagnostic for industrial-scale: where the full protocol is absent, the Corn Spirit story plays out empirically — industrial fisheries collapse, clear-cut forests fail to regenerate, aquifer overdraft destroys groundwater. The empirical evidence for the constitutive-not-decorative claim is the global pattern of extraction-without-protocol producing relationship-collapse-with-the-extracted."
critical-questions:
  - "is this protocol DECORATIVE (theatre overlaid on extraction-as-usual) or CONSTITUTIVE (without it, the relationship doesn't exist, and what looks like extraction is theft)? Kimmerer's strong claim, dramatised by the Corn Spirit story, is constitutive. Diagnostic: do practitioners encounter material constraints (the leek bulbs are withered; you have to go home empty) when the protocol is honoured? If yes, the protocol is doing constitutive work. If the protocol is honoured and the practitioner ALWAYS gets the take, the protocol may have decayed into decoration."
  - "is the framing 'what can we take?' or 'what can we give?' (Carol Crowe's diagnostic)? The orientation of the FIRST thought encodes which protocol is operating. The institutionally-dominant framing in surrounding context tells you which protocol the practitioner-as-individual is swimming against. Practitioner-question: in your domain, is the first-thought take-oriented (sustainability-as-keep-taking) or give-oriented (sustainability-as-tend-the-source)? The answer tells you what kind of work the protocol must do."
  - "does the modern context allow honorable extraction at all? Kimmerer wrestles with this: she cannot grow all her own food, must shop in markets, exists in an industrial extraction-context that her protocol is poorly designed for. The honest answer is partial: the protocol can be PARTIALLY applied in a market context (sourcing decisions, gardening, foraging-where-legal, gratitude-practices, reciprocity-actions like giving to mutual-aid). The protocol cannot fully scale to industrial extraction without institutional redesign. Practitioner-question: which elements of the protocol can you apply now, and which require institutional change to enable?"
  - "is 'give thanks' sufficient, or is 'give back / reciprocate' required? Kimmerer explicitly: gratitude alone is not enough; cultures of reciprocity must replace cultures of gratitude. Diagnostic: does the practitioner's protocol include a material give-back component (replanting, restoration, tithe, contribution to the more-than-human's sustenance), or only an affective gratitude component? Affect-only protocols are incomplete and dramatised by Kimmerer's college-lecture vignette where the student says 'you sound like my grandmother' while the cafeteria food is being swept into trash bins."
  - "when does the protocol scale and when does it break? Small-scale band-society protocols may not transfer to industrial-scale extraction; new protocols may need to be designed (this is the substantive task of e.g., post-fossil-fuel energy systems design, regenerative-agriculture institution-building, biodiversity-credit markets done well rather than as greenwash). Practitioner-question: what is the largest scale at which THIS protocol form has been successfully institutionalised, and what would the next-larger-scale version need to look like?"
status: active
