premises:
  - "oppression is structural (embedded in institutional norms and everyday practice), not necessarily the exercise of tyranny by an identifiable ruling group — an oppressed group need not have a correlate, consciously oppressing group"
  - "such structural power, when it lands on social groups, presupposes those groups are real, relationally-constituted entities with a shared sense of identity, not arbitrary aggregates of individuals who happen to share an attribute (lex-4kfah)"
  - "structural group-oppression differentiates into five analytically distinct, mutually irreducible mechanisms: exploitation (lex-9z37e), marginalization (lex-sxc7c), powerlessness (lex-295yy), cultural imperialism (lex-qrfr5), and violence (lex-wcpsk)"
  - "none of the five reduces to, or is remedied solely by, redistributing goods — the distributive paradigm addresses at most a symptom of one or more faces, never the generating institutional relation"
  - "therefore, diagnosing an injustice requires identifying which face or faces, in what combination, are actually operating — not merely whether a distributive deficit exists, since Young's own cross-group combinatorics show groups suffer different combinations rather than all five uniformly"
critical-questions:
  - "Which of the five mechanisms — exploitation, marginalization, powerlessness, cultural imperialism, violence — is actually operating here, and in what combination? Young's own cross-group table shows the combinations vary; don't assume a group exhibiting one face must exhibit all five, and don't assume a single fix (e.g., higher pay) addresses more than the face it targets."
  - "Is this oppression being attributed to an identifiable, intending oppressor in a sovereignty/tyranny model, or is it structurally reproduced by 'well-meaning people... simply doing their jobs' following ordinary institutional rules and unquestioned norms? Young's Foucault-derived point is that an oppressed group need not have a correlate, consciously oppressing group."
  - "Is a single-axis reduction being applied — 'it's really all class,' 'it's really all one root system' — that would erase a distinct mechanism (say, cultural imperialism or violence) a group actually experiences, the same move Young charges against orthodox Marxism's treatment of racism and sexism?"
lineage:
  - source: primary
    text: young-1990-justice-and-the-politics-of-difference
    citation: "Iris Marion Young, *Justice and the Politics of Difference* (Princeton, NJ: Princeton University Press, 1990). The Introduction (pp. 3-14) states the book's organizing move: justice should not refer only to distribution but also to 'the institutional conditions necessary for the development and exercise of individual capacities and collective communication and cooperation,' with 'oppression and domination... the primary terms for conceptualizing injustice.' Chapter 2, 'Five Faces of Oppression' (pp. 39-65), does the foundational conceptual work: it defines oppression as structural rather than tyrannical-dyadic, develops a specific concept of the social group (see lex-4kfah), and explicates the five irreducible faces (see lex-9z37e, lex-sxc7c, lex-295yy, lex-qrfr5, lex-wcpsk), closing with a worked demonstration ('Applying the Criteria,' pp. 63-65) that different oppressed groups exhibit different combinations of the five, which is the chapter's own evidence for their mutual irreducibility. An earlier version of the chapter's core argument appeared as Young, 'Five Faces of Oppression,' *The Philosophical Forum* 19, no. 4 (Summer 1988): 270-290."
    quote: "[The book's framing statement of the whole typology, Introduction:] 'I have proposed an enabling conception of justice. Justice should refer not only to distribution, but also to the institutional conditions necessary for the development and exercise of individual capacities and collective communication and cooperation... Chapter 2 fills this conspicuous gap in social theory by defining oppression. Actually a family of concepts, oppression has five aspects which I explicate: exploitation, marginalization, powerlessness, cultural imperialism, and violence. Distributive injustices may contribute to or result from these forms of oppression, but none is reducible to distribution and all involve social structures and relations beyond distribution. Oppression happens to social groups. But philosophy and social theory typically lack a viable concept of the social group.' [On oppression as structural rather than tyrannical-dyadic, Ch.2:] 'New left social movements of the 1960s and 1970s... shifted the meaning of the concept of oppression. In its new usage, oppression designates the disadvantage and injustice some people suffer not because a tyrannical power coerces them, but because of the everyday practices of a well-intentioned liberal society... Oppression in this sense is structural, rather than the result of a few people's choices or policies.' [Quoting Frye:] 'an enclosing structure of forces and barriers which tends to the immobilization and reduction of a group or category of people' (Frye, 1983a, p. 11). 'The systemic character of oppression implies that an oppressed group need not have a correlate oppressing group... Foucault (1977) suggests that to understand the meaning and operation of power in modern society we must look beyond the model of power as \"sovereignty,\" a dyadic relation of ruler and subject, and instead analyze the exercise of power as the effect of often liberal and \"humane\" practices of education, bureaucratic administration, production and distribution of consumer goods, medicine, and so on.' [On refusing both single-cause reductionism and separate-silo pluralism:] 'Black liberation theorists and feminist theorists have argued persuasively... that Marxism's reduction of all oppressions to class oppression leaves out much about the specific oppression of Blacks and women... There is a double problem with considering each group's oppression a unified and distinct structure or system. On the one hand, this way of conceiving oppression fails to accommodate the similarities and overlaps in the oppressions of different groups. On the other hand, it falsely represents the situation of all group members as the same.' [On the mutual irreducibility of the five, demonstrated by cross-group combinatorics, 'Applying the Criteria':] 'I have arrived at the five faces of oppression—exploitation, marginalization, powerlessness, cultural imperialism, and violence—as the best way to avoid such exclusions and reductions... The presence of any of these five conditions is sufficient for calling a group oppressed. But different group oppressions exhibit different combinations of these forms... Working-class people are exploited and powerless, for example, but if employed and white do not experience marginalization and violence. Gay men, on the other hand, are not qua gay exploited or powerless, but they experience severe cultural imperialism and violence... As a group women are subject to gender-based exploitation, powerlessness, cultural imperialism, and violence.'"
  - source: discovery-loop
    text: distinctness-audit-young-five-faces-of-oppression-vs-existing-substrate
    citation: "Young's five-part oppression taxonomy and social-group-ontology argument were previously unrepresented in the substrate. The claim is distinct from lex-xuwr2 (Rawls, inequality-is-just-only-if-the-worst-off-benefit): the difference principle is precisely the distributive-paradigm apparatus this atom argues the limits of — a substantive test for when unequal distribution is just, run at the worst-off position, with no machinery for exploitation's transfer-relation, powerlessness's division-of-labor structure, cultural imperialism's meaning-imposition, or violence's systemic-tolerance mechanism. This atom names what a passed difference-principle test can leave untouched. It is distinct from, but tightly composable with, lex-95qfv (Foucault, modern-power-administers-life-rather-than-deducting-from-it): Young cites Foucault directly and by name for exactly the claim lex-95qfv grounds — power beyond the sovereign/dyadic model, exercised through liberal-humane administrative practices without a correlate intending tyrant. lex-95qfv is the general biopolitical-power thesis Young imports as one premise; this atom's distinct further claim is that such structural power differentiates into five analytically separate faces when it lands on social groups. It is distinct from lex-raydk (Connell, dominant-category-stratifies-into-hegemonic-complicit-subordinate-marginalized): Connell names a four-position internal stratification pattern within a single privileged category, operating at a different level than Young's five external mechanisms constituting a group's oppression. The two are compositional: Connell's marginalized-position-holders are a candidate site to ask which Young-face is operating. It is distinct from lex-a3tfj (Fricker, testimonial-injustice-deflates-credibility-via-prejudicial-stereotype): Fricker's testimonial injustice is a specific single-exchange epistemic mechanism, narrower than and compositional with Young's broader structural cultural-imperialism claim — testimonial injustice is best read as a recurring interactional instance of the credibility-deflating side effect cultural imperialism produces at scale, not a restatement of Young's structural claim about whose cultural meanings dominate a society's self-understanding."
  - source: discovery-loop
    text: split-into-six-children-young-five-faces-of-oppression
    citation: "This atom originally carried all five faces plus the social-group-ontology companion claim in one _tier: atomic entry -- six atoms' worth of content compressed into one, flagged by an Anki-lint length pass. Split into this molecule (retaining the unifying diagnostic frame, the structural-not-tyrannical move, and the cross-group mutual-irreducibility evidence) plus six children: lex-9z37e (exploitation), lex-sxc7c (marginalization), lex-295yy (powerlessness), lex-qrfr5 (cultural imperialism), lex-wcpsk (violence), and lex-4kfah (the social-group-ontology companion claim, which is not one of the five faces but a premise the whole typology presupposes). Every quote in the six children is excerpted from this atom's own already-verified lineage, not independently re-acquired. Existing neighbors lex-raydk, lex-a3tfj, lex-sb7wj, and lex-tjr5d, whose own distinctness notes named a specific face rather than the whole typology, gained an additional edge to that face's specific child atom alongside their existing edge to this one."
canonical-instances:
  - "Young's own cross-group combinatorics, the chapter's direct evidence for mutual irreducibility: 'Working-class people are exploited and powerless, for example, but if employed and white do not experience marginalization and violence. Gay men, on the other hand, are not qua gay exploited or powerless, but they experience severe cultural imperialism and violence... Old people are oppressed by marginalization and cultural imperialism... As a group women are subject to gender-based exploitation, powerlessness, cultural imperialism, and violence.' If the five categories were really one thing, or reducible to a distributive deficit, this variable per-group combinatorics would be incoherent to state."
