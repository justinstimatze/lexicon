name: a-shared-deceptions-collapse-scatters-the-co-conspirators-not-just-the-instigator
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When several parties knowingly participate in and benefit from one member's deception, an accidental exposure doesn't just implicate the instigator -- it can scatter every participant at once, each one fleeing rather than sharing the consequences they helped produce. In Radin's Winnebago Trickster cycle, four traveling companions agree to a scheme for surviving winter: Trickster proposes, 'I will disguise myself as a woman and marry him. Thus we can live in peace until spring comes,' and all three companions consent with open eyes -- 'Good!' they ejaculated. All were willing and delighted to participate. The deception is not incidental to their survival; it is built with their direct complicity: 'Then he let the fox have intercourse with him and make him pregnant, then the jaybird and, finally, the nit.' The scheme holds for years, through three children and a comfortable position in the chief's household, until an involuntary bodily accident exposes it in an instant: 'the chief's son's wife (Trickster) jumped over the pit and she dropped something very rotten. The people shouted at her, 'It is Trickster!'' In that same moment, 'the animals who had been with Trickster, the fox, the jaybird and the nit, all of them now ran away,' leaving Trickster alone to face the exposed shame while the men of the household stood ashamed beside him. Diagnostic move: when a group's shared benefit depends on one member's ongoing performance, assume the exposure risk is shared too, and notice when the actual behavior around you suggests otherwise -- a group of co-conspirators that would scatter rather than stand together at the moment of exposure was never as unified as the shared benefit made it look."
