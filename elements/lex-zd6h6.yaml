id: lex-zd6h6
name: one-partys-blocked-drive-shows-up-as-the-others-excess
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When one side of a relationship is denied a direct outlet for a drive, that drive doesn't vanish. It transfers onto whoever remains free to act, pushing that person's output past what their own unconstrained motives alone would ever produce. The dammed-up energy doesn't stay put -- it surfaces downstream, as exaggerated striving in whichever actor still has room to move. What looks like pure ambition in that free actor is, in real measure, someone else's blocked pressure finding an outlet through them. Gilman states this directly: 'Woman's abnormal development of sex, restrained and imprisoned by every law, has acted like a coiled spring upon the only free agent in society,--man. Under its intense stimulus he has moved mountains.'"
related: []
evokes: [women-and-economics, chapter-vii, has-acted-like-a-coiled-spring, the-only-free-agent-in-society, blocked-drive-surfaces-as-someone-elses-excess]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-vii
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter VII. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "In her subordinate position, under every disadvantage, through the very walls of her prison, the constructive force of woman has made man its instrument, and worked for the upbuilding of the world. As his energy was purely individualistic, and only to be controlled by the power of sex-attraction, it needed precisely this form of union, with its peculiar exaggeration of sex-faculty, to hold him to his task. Woman's abnormal development of sex, restrained and imprisoned by every law, has acted like a coiled spring upon the only free agent in society,--man. Under its intense stimulus he has moved mountains."
canonical-instances:
  - "A stay-at-home parent with no independent career outlet channels their frustrated ambition entirely into pushing their working spouse toward promotions and longer hours, and the spouse's visible workaholism is, in large part, a measurement of the partner's own blocked drive rather than pure personal ambition."
  - "In a rigid corporate hierarchy where junior staff have no direct path to influence strategy, their frustrated strategic ideas surface as intense, disproportionate lobbying pressure on the one senior executive who does have that freedom, and the executive's erratic pivots start tracking the junior staff's blocked energy more than the executive's own judgment."
  - "A community that denies a religious minority any public political voice sees that group's political energy resurface as unusually intense pressure on the one civic leader willing to broker on their behalf. The leader's political career ends up tracking that group's blocked outlet as much as the leader's own convictions."
critical-questions:
  - "How would you distinguish a party's output that is genuinely inflated by absorbing someone else's blocked drive from output that simply reflects that party's own ordinary ambition, given that both would look identical from the outside as 'excessive achievement'?"
  - "If a free actor's excess really is fueled by someone else's blocked energy, does removing the constraint on that other person reliably bring the free actor's output back down to baseline? Or can the exaggerated pattern become self-sustaining, persisting even after the original block is gone?"
  - "Gilman frames the coiled-spring dynamic as an unintended byproduct of restriction rather than something either party chooses -- but could the constrained party come to prefer channeling their drive this way, making the arrangement more stable and harder to dislodge than a purely involuntary mechanism would suggest?"
