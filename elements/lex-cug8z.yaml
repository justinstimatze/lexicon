lineage:
  - source: primary
    text: rilke-1929-letters-to-a-young-poet-herter-norton
    citation: "Rainer Maria Rilke, Letters to a Young Poet (Insel-Verlag, 1929, four letters written 1903-1908 to Franz Xaver Kappus), trans. M. D. Herter Norton (W. W. Norton & Company, revised edition), the letter dated Worpswede, near Bremen, July 16, 1903."
    quote: "'You are so young, so before all beginning, and I want to beg you, as much as I can, dear sir, to be patient toward all that is unsolved in your heart and to try to love the questions themselves like locked rooms and like books that are written in a very foreign tongue.'"
  - source: primary
    text: rilke-1929-letters-to-a-young-poet-herter-norton
    citation: "Rainer Maria Rilke, Letters to a Young Poet, trans. Herter Norton, same letter -- the closing instruction, quoted as a separate span because the source PDF's text layer is corrupted across the sentences directly between the two (a garbled 'do not now seek the answers... because you would not be able to live them' passage that isn't reproduced here to avoid presenting corrupted OCR as a verbatim quote)."
    quote: "'Live the questions now. Perhaps you will then gradually, without noticing it, live along some distant day into the answer.'"
canonical-instances:
  - "A recent graduate feels pressure to declare a five-year career plan before they have any real basis for one, and picks a plausible-sounding answer mainly to stop being asked. The alternative Rilke names: stay openly undecided and actually do the work in front of them -- internships, real projects, real failures -- treating the undecidedness itself as the current task rather than a problem to paper over with a premature answer."
  - "Someone in a new relationship wants to know immediately whether it's 'the one,' and reaches for reassuring certainty neither the relationship's history nor their own self-knowledge yet supports. Living the question here means actually being present in the relationship as it develops, rather than either forcing a verdict now or treating the present as a waiting room for a future verdict."
  - "A researcher facing a genuinely open problem in their field resists the pull to publish a tidy, premature synthesis just to have something to show, and instead keeps working the actual open questions -- not from indecision, but because a forced-early synthesis would be a worse answer than the one that comes from having actually lived inside the problem longer."
critical-questions:
  - "How do you distinguish 'living the question' from ordinary procrastination or avoidance dressed up in Rilke's language? Both can look identical from outside -- someone not yet committing to an answer. The test Rilke's own text implies but doesn't spell out: is the person actively engaged with the question's real material (the relationship, the work, the actual data), or are they simply not thinking about it? Living the question requires active inhabitation, not passive drift."
  - "Does this advice generalize to questions with real deadlines and consequences -- a medical decision, a legal filing, a hiring choice -- where 'live it a few more years and grow into the answer' isn't available? Rilke is explicitly addressing an inner, developmental question (vocation, self-understanding) with no external clock; the advice may not transfer cleanly to questions where an answer, even an imperfect one, must be given by a fixed date regardless of readiness."
