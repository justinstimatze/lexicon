id: lex-sjsae
name: request-travels-handler-chain-until-one-accepts
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When designing for variable handlers, surface chain-of-responsibility — the request walks the chain until one handler accepts; decouples sender from receiver; lets the set of handlers vary without changing the sender."
related: [lex-9akfh, lex-z8m97, lex-gbmev, lex-p25q4]
scaffolds-from: [lex-9akfh]
evokes: [gof-chain-of-responsibility, middleware-stack, exception-bubble-up, support-escalation, first-handler-wins, pipeline-with-early-exit]
lineage:
  - source: practitioner
    text: wikipedia-chain-of-responsibility-pattern-2025-12
    citation: "Wikipedia 'Chain-of-responsibility pattern' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Chain-of-responsibility_pattern). Underlying primary is Gamma, Helm, Johnson, Vlissides 1994 *Design Patterns: Elements of Reusable Object-Oriented Software* (Addison-Wesley). The substrate-claim: a request is passed along a linear chain of potential handlers; each handler examines the request and either handles it (terminating the chain) or forwards it to the next handler. The request-sender does not need to know which handler will accept responsibility; the chain-topology determines that at runtime via FIRST-HANDLER-WINS dispatch. Distinct from decorator (decorator's links ALL handle the request to compose behavior; CoR's chain has EXACTLY ONE handler accept). Distinct from observer-pattern's broadcast (all observers receive; CoR's chain terminates at first acceptance)."
    quote: "[Wikipedia 'Chain-of-responsibility pattern', 2025-12 ZIM snapshot:] 'the chain-of-responsibility pattern is a behavioral design pattern consisting of a source of command objects and a series of processing objects. Each processing object contains logic that defines the types of command objects that it can handle; the rest are passed to the next processing object in the chain. A mechanism also exists for adding new processing objects to the end of this chain.' [On the variant tree-of-responsibility:] 'In a variation of the standard chain-of-responsibility model, some handlers may act as dispatchers, capable of sending commands out in a variety of directions, forming a tree of responsibility. In some cases, this can occur recursively, with processing objects calling higher-up processing objects with commands that attempt to solve some smaller part of the problem; in this case recursion continues until the command is processed, or the entire tree has been explored.' [On the foundational distinction from decorator:] 'The chain-of-responsibility pattern is structurally nearly identical to the decorator pattern, the difference being that for the decorator, all classes handle the request, while for the chain of responsibility, exactly one of the classes in the chain handles the request.' [The substrate-claim is the FIRST-HANDLER-WINS dispatch topology: each link in the chain has the choice to accept or forward; the sender is decoupled from the choice; the chain composition determines who handles what at runtime. One of the 23 GoF behavioral patterns (Gamma-Helm-Johnson-Vlissides 1994).]"
canonical-instances:
  - "Exception handling: a thrown exception bubbles up the call stack; each enclosing try/catch is a potential handler; the first handler whose catch-type matches the exception accepts responsibility. The throw-site doesn't know which handler will catch."
  - "Middleware stacks (Express.js, ASP.NET, Rack): an HTTP request flows through middleware layers; each can handle (respond + terminate) or pass (call next()). Authentication middleware short-circuits unauthenticated requests; routing middleware dispatches based on path; static-file middleware serves matching paths; etc."
  - "Event-handler propagation in DOM: a click event bubbles up the DOM tree; each ancestor element's click-handler can stopPropagation() to terminate or let the event continue. The user-click doesn't know which handler will respond."
  - "Logging-framework filter chains: a log-message passes through a filter-chain (level-filter → topic-filter → throttle-filter → formatter → sink). Each filter can drop the message (terminate) or pass it on."
  - "Support-ticket escalation: tier-1 support attempts to resolve; if not, escalates to tier-2; if not, to tier-3. The customer doesn't choose tier; the escalation-chain determines who handles which kind of problem."
  - "Approval workflows: a purchase-request escalates through manager → director → VP based on amount thresholds. Each level's approver either signs-off (terminating) or forwards-up."
  - "Java Servlet Filter chain: each filter inspects the request; can short-circuit (return response without calling next filter) or pass through."
  - "operationally distinct from lex-z8m97 gof-decorator: decorator's links ALL participate (each layer adds behavior to the same call); CoR's chain has EXACTLY ONE accept (the chain terminates at first match). Wikipedia notes the structural near-identity but operational opposition."
  - "operationally distinct from lex-gbmev observer-pattern: observer broadcasts to all subscribers (multiplicity-many response); CoR terminates at first acceptance (multiplicity-one response). Both are one-to-many topologies but different termination semantics."
  - "operationally distinct from lex-9akfh decoupling-via-indirection: lex-9akfh names broad decoupling; CoR is the specific operational case of sender-decoupled-from-handler-via-first-accept-dispatch."
  - "compose-related with lex-p25q4 command-pattern: the request flowing along the CoR chain is naturally a Command object (per Wikipedia: 'source of command objects'). Command-pattern reifies the request; CoR routes it. Composition is canonical."
critical-questions:
  - "what if no handler accepts? The chain may terminate with the request unhandled (default-action / error / drop). Practitioner-discipline: every CoR chain should specify the default-handler-or-error policy at the tail."
  - "should the chain be statically composed at compile time or dynamically at runtime? Static chains (built once via DI configuration) are predictable but inflexible; dynamic chains (handlers register at runtime) are flexible but introduce ordering-bugs. Middleware-stacks lean static; plugin systems lean dynamic."
  - "what about chain-traversal performance? Long chains for high-frequency requests are O(chain-length) per request. CoR pays off when (a) the handler-set is open-ended, (b) handler-applicability is cheap to test, and (c) average-traversal-depth is small. Hash-routing or pattern-matching dispatch can beat CoR when the handler is determinable from request-shape."
  - "tree-of-responsibility variant: when the chain becomes a tree (handlers can fan out to multiple sub-chains and recurse), the substrate-claim still holds but composition complexity grows. XML/HTML interpreters use this; substrate-relevant for hierarchical decomposition with backtracking."
  - "does the substrate-claim require object-orientation? No — function-pipeline composition (Unix pipes, Express middleware as function-chain, Ring/Compojure middleware) all instantiate CoR without classes. The substrate-claim is the FIRST-HANDLER-WINS dispatch topology, not the OO implementation."
severity-tier: info
