canonical-instances:
  - "A commercial kitchen's expo line runs on a rule that any dish sent out cold gets the whole table comped, not just replaced. A new line cook who plates one dish two minutes late thinks of it as their own small screwup. The comp policy converts it into a cost every other cook on the pass has a stake in preventing, so the rest of the line starts checking each other's plates before they leave the window, not from generosity, but because the shared consequence made a stranger's mistake worth catching."
  - "A climbing gym's belay-check culture treats an unchecked knot as everyone's problem because a single fall from an unchecked system closes the wall for the rest of the day pending an incident review. Regular climbers start double-checking strangers' knots unprompted, because one person's untied figure-eight now costs the whole room its climbing time."
  - "A shared irrigation ditch runs on an old rule that if any one farmer's gate is left open overnight and the reservoir runs low, the whole valley loses a week of water rights while the district investigates. A farmer's ordinary forgetfulness, leaving a gate open, stops being their own problem and becomes something every neighbor has a reason to walk the ditch and check."
critical-questions:
  - "Isn't this just describing any collective-punishment system, and don't those usually backfire by breeding resentment? A stated rule authored by an identifiable person (fine the whole team for one person's lateness) invites resentment aimed at that person. A shared belief with no author works differently: no one decided the connection between the mistake and the consequence, so there's no target for resentment except the mistake itself, which is exactly what makes the peer-monitoring durable rather than resented."
  - "Doesn't this require the belief to be literally true -- what happens once someone realizes cooking technique doesn't actually cause storms? The mechanism doesn't require the causal story to be true, only that it's collectively believed and that violations can plausibly be observed to correlate with real bad outcomes, which Pascoe notes settlers did witness. Once the belief stops being credible, the enforcement it was doing has to be replaced by something else, inspection, reputation, formal rule, or the underlying vulnerability (private mistakes with large shared costs) goes back to being unmonitored."
