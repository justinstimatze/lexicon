id: lex-9uac6
name: argument-from-verbal-classification-as-defeasible-property-inference
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When inferring a property from category-membership ('X is a bird, so X flies'), check whether X is in the category by stipulation or by evidence, and whether the property holds for ALL members or just typical members. Class-based property inference is defeasible at both joints."
related: [lex-af9ax, lex-th68b, lex-hesjt, lex-99f5w, lex-jbegr, lex-pm93k, lex-8j5ms, lex-2s3ze, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-tpv83, lex-chtk9, lex-xqamc, lex-xm754, lex-x6ft6, lex-e3ddu, lex-njj99, lex-4uuxy, lex-r5fy3]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt]
evokes: [labeling, framing, loaded-term, question-begging-epithet, semantic-classification, endoxic-definition, the-word-does-the-work, persuasive-definition, category-membership]
premises:
  - "if some particular thing a can be classified as falling under verbal category C, then a has property F (in virtue of such a classification)"
  - "a can be classified as falling under verbal category C"
  - "therefore a has property F"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(propose-classification, derive-property-from-category-meaning) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "does a definitely have F, or is there room for doubt? CQ1 (Walton 2008 p.69 from Walton 1996 p.54). The conclusion-property must actually obtain in the particular case beyond the verbal label; if the property assignment is itself contestable independent of the classification, the scheme is undercut. Diagnostic: 'set aside the category-label momentarily — do the case's own features warrant the property, or is the label doing all the inferential work?'"
  - "can the verbal classification (in the second premise) be said to hold strongly, or is it one of those weak classifications that is subject to doubt? CQ2 (Walton 2008 p.69). The classification itself must rest on a settled definition; many real arguments rely on a contested or stretched category-application. Diagnostic: 'is the definition of category C settled in this discourse, and does the case clearly fall within it — or are we stretching the category to cover a marginal instance?'"
  - "is the verbal category C itself loaded — that is, does the category bundle a normative judgment into what looks like a descriptive label? Substrate extension via Walton 2008 p.68's observation that 'definitions, especially of ethical terms, are rarely, if ever, argumentatively neutral. Defining almost always means advancing an opinion about a situation, often one that is not explicitly formulated.' Diagnostic: 'can I restate the case in neutral language without the contested label — if the conclusion no longer follows, the label is doing concealed normative work and the scheme has slid into persuasive-definition'"
  - "would the conclusion still hold if the classification were replaced by an empirical examination of the case's features? Substrate extension. The Walton scheme is structurally vulnerable to question-begging-epithet: when the only proof of the conclusion is the loaded label, the argument is circular. Diagnostic: 'remove the verbal classification entirely and ask: does direct evidence of the case's properties independently support the conclusion?' — if not, the scheme is doing fallacious work"
  - "is the implicit definition shared by all parties to the dispute, or does each side hold a different definition of C? Substrate extension via lex-2s3ze equivocation. Walton 2008 p.67 emphasizes that 'classification proceeds from semantic, endoxic, or shared properties of a definition.' If the speaker's and hearer's working definitions of C diverge, the argument equivocates and the scheme requires explicit definitional alignment before the inference can be evaluated"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.2 §6 'Arguments from Classification' (pp.67-69) + Ch.2 §7 'Arguments Based on Rules and Classifications' (pp.69-72). Scheme cited to Walton 1996 p.54. Two critical questions on p.69. Walton-Reed-Macagno establish argument-from-verbal-classification as the SEMANTIC counterpart to argument-from-established-rule (lex-tpv83), which is the PRAGMATIC counterpart (Walton 2008 p.70 explicit: 'argument from an established rule is the pragmatic counterpart to argument from verbal classification'). The two schemes share the same shape — instance-of-X → property-of-X — but operate on different layers: established-rule on procedural-action-prescription, verbal-classification on semantic-category-property. Key substrate-relevant observation: Walton-Reed-Macagno explicitly identify the question-begging-epithet failure-mode (p.68 citing Walton 1996 p.54), where the loaded category-label is the only proof of the conclusion, producing circular reasoning. Distinct from lex-chtk9 precedent because precedent works through cited prior cases; verbal-classification works through definitional category-membership. Distinct from lex-kh9cr analogy because analogy maps features case-to-case; verbal-classification derives properties from category-membership alone."
    quote: "[Ch.2 §6 pp.67-68] Arguments from classification are based on two main components: the description, or presentation, of the facts or events, and their classification, proceeding from properties presented in the definition itself. The classification may derive from a semantic aspect of the words used to describe the event [...] Such verbal categorization is a speaker's choice, but it may also be backed by common or shared knowledge. [...] The classification is inherent, already implied by the properties the terms are categorized as having. Classification is, therefore, a matter of choice of words that support or attack a viewpoint. A subject of a classification is tacitly included under a point of view with different characteristics that are relevant to an issue. For this reason, a classification of a term based on a definition always implies the exclusion of relevant opposed perspectives. Definitions, especially of ethical terms, are rarely, if ever, argumentatively neutral. Defining almost always means advancing an opinion about a situation, often one that is not explicitly formulated. Argument from verbal classification proceeds from semantic, endoxic, or shared properties of a definition. For this reason, the main problem concerns the acceptance of the definition itself, and this aspect is the key to grasping the fallacious uses of arguments from classification. [...] [Scheme for Defeasible Argument from a Verbal Classification, p.69, from Walton 1996 p.54] Major Premise: If some particular thing a can be classified as falling under verbal category C, then a has property F (in virtue of such a classification). Minor Premise: a can be classified as falling under verbal category C. Conclusion: a has property F. [...] [Critical Questions, p.69] CQ1: Does a definitely have F, or is there room for doubt? CQ2: Can the verbal classification (in the second premise) be said to hold strongly, or is it one of those weak classifications that is subject to doubt? [...] [Ch.2 §7 p.70 on the rule/classification parity] In these arguments, argument from an established rule is the pragmatic counterpart to argument from verbal classification."
  - source: primary
    text: mill-1843-system-of-logic-book-v-ch-vii-fallacies-of-confusion
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843), Book V Chapter VII 'Fallacies of Confusion' (§§ 1-3). PD; in the lexicon corpus. Mill's foundational treatment of fallacies-of-confusion grounded in ambiguity-of-terms — the same locus Walton 2008 Ch.2 §6 frames as argument-from-verbal-classification's failure-modes. Mill catalogues the Fallacia Figurae Dictionis (fallacy built on the grammatical structure of language, citing Whately) where paronymous words are taken to have precisely-corresponding meaning when they actually diverge, plus the cognate etymological-meaning-shift fallacy and a sequence of ambiguous-key-terms cases drawn from political-economy and ethics. Methodologically-distinct from Walton-Reed-Macagno along three axes: (1) Catalogue-of-instances vs defeasible-scheme-treatment: Mill catalogues specific recurring instance-classes (paronymous-word ambiguity, etymological-meaning-shift, key-term-ambiguity in contested public-discourse) whereas Walton extracts the abstract scheme-shape and its CQs. Mill is doing fallacy-taxonomy; Walton is doing argumentation-theory. (2) Pre-defeasibility-theory framing: Mill (1843) predates the formal-pragmatic theory of defeasible-argumentation by 130+ years; his fallacies are framed as outright errors (ambiguity produces invalid syllogism) rather than as defeasible inference-moves with CQs. The two frames cohere: Mill demonstrates WHEN the scheme fails outright; Walton's CQs are per-dialogue instruments detecting those failure-modes earlier. (3) Inductive-logical-system-level vs per-dialogue-level: Mill situates ambiguity-fallacies within his System of Logic as one of five classes of fallacy that distort inductive inquiry at the system-level; Walton operates per-dialogue per-scheme. Together: Mill 1843 Book V Ch.VII is the foundational nineteenth-century catalogue establishing that argument-from-verbal-classification has structurally-predictable failure-modes; Walton 2008 catalogues the same failure-modes as defeasible CQs that operationalize Mill's diagnoses into a per-dialogue critical-thinking protocol."
    quote: "(Book V Ch.VII Fallacies of Confusion, opening of section 1 + Whately on Fallacia Figurae Dictionis:) § 1. Under this fifth and last class it is convenient to arrange all those fallacies in which the source of error is not so much a false estimate of the probative force of known evidence, as an indistinct, indefinite, and fluctuating conception of what the evidence is. At the head of these stands that multitudinous body of fallacious reasonings in which the source of error is the ambiguity of terms: when something which is true if a word be used in a particular sense, is reasoned on as if it were true in another sense. In such a case there is not a mal-estimation of evidence, because there is not properly any evidence to the point at all; there is evidence, but to a different point, which from a confused apprehension of the meaning of the terms used, is supposed to be the same. This error will naturally be oftener committed in our ratiocinations than in our direct inductions, because in the former we are deciphering our own or other people’s notes, while in the latter we have the things themselves present, either to the senses or to the memory. Except, indeed, when the induction is not from individual cases to a generality, but from generalities to a still higher generalization; in that case the fallacy of ambiguity may affect the inductive process as well as the ratiocinative. It occurs in ratiocination in two ways: when the middle term is ambiguous, or when one of the terms of the syllogism is taken in one sense in the premises, and in another sense in the conclusion. Some good exemplifications of this fallacy are given by Archbishop Whately. “One case,” says he, “which may be regarded as coming under the head of Ambiguous Middle, is (what I believe logical writers mean by ‘_Fallacia Figuræ Dictionis_’) the fallacy built on the grammatical structure of language, from men’s usually taking for granted that _paronymous_ (or _conjugate_) words, _i.e._, those belonging to each other, as the substantive, adjective, verb, etc., of the same root, have a precisely corresponding meaning; which is by no means universally the case. Such a fallacy could not indeed be even exhibited in strict logical form, which would preclude even the attempt at it, since it has two middle terms in sound as well as sense. But nothing is more common in practice than to vary continually the terms employed, with a view to grammatical convenience; nor is there any thing unfair in such a practice, as long as the _meaning_ is preserved unaltered; _e.g._, ‘murder should be punished with death; this man is a murderer, therefore he deserves to die,’ etc. Here we proceed on the assumption (in this case just) that to commit murder, and to be a murderer—to deserve death, and to be one who ought to die, are, respectively, equivalent expressions; and it would frequently prove a heavy inconvenience to be debarred this kind of liberty; but the abuse of it gives rise to the Fallacy in question; _e.g._, _projectors_ are unfit to be trusted; this man has formed a _project_, therefore he is unfit to be trusted: here the sophist proceeds on the hypothesis that he who forms a _project_ must be a _projector_: whereas the bad sense that commonly attaches to the latter word, is not at all implied in the former. This fallacy may often be considered as lying not in the Middle, but in one of the terms of the Conclusion; so that the conclusion drawn shall not be, in reality, at all warranted by the premises, though it will appear to be so, by means of the grammatical affinity of the words; _e"
canonical-instances:
  - "trademark-infringement disputes: 'the defendant's product is a knockoff; knockoffs are infringing; therefore the product is infringing' — verbal-classification scheme; CQ1 fires on whether the product genuinely shares the features that make it a knockoff, CQ2 on whether 'knockoff' has a settled enough legal definition for the inference to hold, CQ3 on whether 'knockoff' bundles a normative judgment ('infringing') into a descriptive label"
  - "diagnostic-category-application in psychiatry: 'patient X meets DSM criteria for category C; category C entails treatment Y; therefore treatment Y is indicated' — verbal-classification at clinical scale; the entire DSM apparatus is the institutionalized definitional substrate that makes category-application argumentatively decisive; CQ2 + CQ3 are the perennial controversy (does the patient cleanly meet the criteria; is the category itself loaded with normative content)"
  - "tax-law category disputes: 'this transaction is a sale; sales are taxed at rate R; therefore this transaction is taxed at R' — verbal-classification on the foundational legal-classification of the transaction; the whole tax-advice industry is built on contesting which category a transaction falls under because the category-property mapping is statutory"
  - "scientific naming-as-claim: 'this organism is in genus Homo; members of genus Homo have property F; therefore this organism has F' — verbal-classification deployed in taxonomic argument; CQ2 fires on cladistic disputes (does this fossil genuinely fit the genus diagnosis), CQ4 fires on whether the F-claim should be tested directly rather than inherited from genus-membership"
  - "code-review categorization: 'this change is a refactor; refactors don't need tests; therefore this change doesn't need tests' — verbal-classification at developer-team-policy scale; the loaded-label problem (CQ3) is acute because 'refactor' shifts meaning depending on who is classifying. The honest move is to skip the label and reason directly about behavior-preservation"
  - "the question-begging-epithet failure-mode (Walton 1996 p.54): when the entire force of the argument is 'X is a [loaded category]; [loaded category] entails [bad conclusion]; therefore [bad conclusion for X]' with no independent argument that X actually fits the category or that the category genuinely entails the conclusion, the scheme has collapsed into circular reasoning. CQ4 is the substrate diagnostic"
  - "lex-tpv83 established-rule contrast: same scheme-shape (instance-of-X → property-of-X), different operating layer. Established-rule operates on procedural-action-prescription ('rule says A, this is an A-case, therefore action'); verbal-classification operates on semantic-category-property ('definition says C has F, this is a C, therefore F'). The two together exhaust the rule/classification layer of Walton's apparatus"
  - "lex-kh9cr analogy contrast: analogy maps feature-by-feature from a source case to a target case; verbal-classification derives properties from category-membership directly, without needing a source case. Where analogy says 'A is like B, B has F, so A has F', classification says 'A is a C, Cs have F, so A has F' — the category C does the work the source case B does in analogy"
