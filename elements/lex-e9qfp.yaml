id: lex-e9qfp
name: doing-injustice-is-worse-than-suffering-it
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When comparing the harm of committing an unjust act against the harm of being its victim, do not default to the intuitive ranking (that suffering, being more painful and more visible, must be the greater evil). Consider instead that the two harms are measured on different axes -- pain to the victim versus damage to the agent's own character -- and that the agent's self-damage can be assessed as the worse harm on its own terms, independent of any external consequence to the agent. Plato's Gorgias derives this via a chain Socrates gets Polus to grant step by step: the more disgraceful of two things is disgraceful by exceeding the other in pain, evil, or both; doing injustice is agreed (even by ordinary opinion) to be more disgraceful than suffering it; the injurer does not suffer more PAIN than the injured (obviously false -- the victim hurts more); therefore, if doing injustice exceeds suffering it in disgrace, and not in pain, it must exceed it in the remaining term -- evil. Socrates states the conclusion directly against Polus's popular-opinion appeal (Polus cites the tyrant Archelaus, murderer of his own family, living gloriously unpunished, as proof that injustice pays): 'the unjust or doer of unjust actions is miserable in any case -- more miserable, however, if he be not punished... and less miserable if he be punished.' The claim is not that victims don't suffer, or that suffering is trivial -- it is that the specific comparison ('which is the worse evil to have befallen someone, doing wrong or having wrong done to you') resolves in favor of the wrongdoer being worse off, because the wrongdoer's soul has taken on the deformity of injustice itself, a self-inflicted harm layered on top of and independent of whatever external gain or escape from punishment they achieve. Portable beyond Socratic ethics: a whistleblower deciding whether to falsify a report to protect a colleague, weighing their own future guilt and compromised integrity against the colleague's immediate professional harm, may find this framework names what's actually being traded -- not two comparable external costs, but an external cost to one party against a structural, self-directed cost to the other; a person mistreated by a friend who considers retaliating in kind can use this atom to separate the question 'was I wronged' (yes) from the question 'would wronging them back make me worse off than staying wronged' (this atom says yes, on the disgrace-implies-evil chain). Diagnostic and scope: this atom is a comparison between the WRONGDOER and the VICTIM -- which of the two, considered as two different people, is actually worse off. It requires accepting Socrates's premise that disgrace tracks evil (that what is more shameful is, by that fact, more harmful to the one it characterizes) -- a premise Polus never independently grants, only fails to refute within the dialogue's rules. It does not address, and should not be confused with, the separate question of what happens to the SAME wrongdoer depending on whether they are punished or escape punishment (see lex-rnkta)."
related: [lex-7mdpd, lex-fqqx8, lex-rnkta, lex-v7ceq]
evokes: [worse-to-do-than-to-suffer-injustice, the-injurer-does-not-exceed-in-pain-only-in-evil, archelaus-the-tyrant-is-most-miserable, i-and-you-and-every-man-do-really-believe]
lineage:
  - source: primary
    text: plato-gorgias-jowett-do-versus-suffer-injustice
    citation: "Plato, Gorgias 469b-479e (Jowett translation, Standard Ebooks Dialogues compilation). Socrates's argument with Polus, using the Archelaus case as the test example, that committing injustice is a greater evil than suffering it, even though suffering is more painful."
    quote: "Then would you rather suffer than do injustice? [Socrates:] I should not like either, but if I must choose between them, I would rather suffer than do... I say that this is an impossibility... the unjust or doer of unjust actions is miserable in any case -- more miserable, however, if he be not punished and does not meet with retribution, and less miserable if he be punished and meets with retribution at the hands of gods and men... [Later, deriving it formally from Polus's own admissions:] First, then, let us consider whether the doing of injustice exceeds the suffering in the consequent pain: Do the injurers suffer more than the injured? [Polus:] No, Socrates; certainly not. [Socrates:] Then they do not exceed in pain?... Then they can only exceed in the other?... That is to say, in evil?... Then doing injustice will have an excess of evil, and will therefore be a greater evil than suffering injustice."
canonical-instances:
  - "The direct textual anchor: Socrates derives, from Polus's own admission that doing injustice is more disgraceful than suffering it, that doing injustice must be the greater evil -- since the injurer does not suffer more pain than the injured, the excess in disgrace can only be an excess in evil to the doer."
  - "A whistleblower weighing whether to falsify a report to protect a colleague can use this atom to separate what's actually being traded: not two comparable external costs, but the colleague's external professional harm against a structural, self-directed harm (compromised integrity) to themselves."
  - "A person wronged by a friend, considering retaliation in kind, can use the atom to distinguish 'was I wronged' (yes, and it hurt) from 'would wronging them back leave me worse off than staying the victim' -- which this atom's chain answers yes."
critical-questions:
  - "isn't this the same as lex-rnkta (escaping-punishment-is-worse-than-being-punished)? No -- this atom compares the WRONGDOER to the VICTIM (two different people; which is worse off). lex-rnkta compares two possible FATES OF THE SAME WRONGDOER (punished vs. unpunished). They are adjacent links in Socrates's argument to Polus but answer different comparison questions; a reader can accept one and reject the other."
  - "isn't this just a restatement of the golden rule or a general injunction against harming others? No -- the atom makes a specific, counterintuitive COMPARATIVE claim (the doer is worse off than the sufferer), not a general prohibition. It requires the disgrace-implies-evil premise to do the comparative work; a simple 'don't harm others' injunction makes no claim about which party in a harm-event is worse off."
  - "does this claim require that the victim's suffering is not real or not bad? No. The atom explicitly grants that suffering is the more PAINFUL of the two (Polus's point, which Socrates concedes) -- the claim is narrower: that pain and evil are different axes, and while suffering wins on pain, doing wrong wins on evil, because disgrace (which the doer, not the sufferer, incurs) has been shown to track evil rather than pain."
  - "is this premise (disgrace tracks evil) actually established, or just extracted from Polus by leading questions? The dialogue itself flags this as contestable -- Callicles later attacks exactly this premise, arguing that 'disgraceful' and 'evil' track only convention, not nature (see the appeal-to-nature critique in lex-8ca5h). This atom names Socrates's claim and the chain that produces it; it does not certify the chain is unassailable, only that it is the specific, non-obvious move by which the counterintuitive conclusion is reached."
