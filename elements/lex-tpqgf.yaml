id: lex-tpqgf
name: demanding-proof-instead-of-trust-breaks-a-serial-exploitation-scheme
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone offers help by warning you of a threat you cannot independently confirm, ask for evidence before acting on the warning, since a serial exploitation scheme depends entirely on victims never checking. The Panchatantra's heron fabricates an approaching danger to fish in a pond, offering to carry them one by one to a safer place — then eats each fish privately as it arrives, thinking to himself: 'My shrewdness has brought these fishes into my power. They ought to be eaten very comfortably.' A crab, offered the same rescue, breaks the pattern by demanding to be shown proof rather than accepting the offer on faith, and discovers a rock littered with fish skeletons before ever getting within reach. The scheme's entire mechanism depends on each victim volunteering in isolation without comparing notes or demanding to see where the previous ones went."
related: []
evokes: [panchatantra, loss-of-friends, demanding-proof-breaks-a-serial-scheme, fabricated-crisis-recruits-victims-in-isolation]
lineage:
  - source: primary
    text: panchatantra-ryder1925-the-heron-that-liked-crab-meat
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book I, 'The Heron That Liked Crab-Meat.' Verified verbatim against a direct extraction of the held copy."
    quote: "My shrewdness has brought these fishes into my power. They ought to be eaten very comfortably."
canonical-instances:
  - "an investment scheme recruits new participants one at a time through private conversations, each told a version of the same manufactured urgency, and collapses the moment a single skeptical prospect insists on independently verifying a previous 'successful' payout instead of taking the recruiter's word for it."
critical-questions:
  - "What made the crab willing to demand proof when every fish before him accepted the offer without question — is skepticism here a trait some individuals simply have more of, or something anyone could be taught to apply consistently?"
  - "Does demanding proof before accepting help have a real cost in situations where the danger is genuine and the delay to verify it actually increases the risk, making blanket skepticism the wrong general policy?"
status: active
