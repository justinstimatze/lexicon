id: lex-n7cgz
name: positioning-at-a-rivals-unguarded-routine-spot-overhears-their-real-plans
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When people you distrust have an unvarying habit — the same spot, the same time, after the same event — of talking freely because they believe themselves unobserved, exploit the very predictability of that routine rather than trying to extract the truth from them directly. In the Maha-Ummagga-Jataka, four rival ministers who plot against Mahosadha have one fixed habit: "on other days, these four on coming out of the palace used to sit on a trough at the palace door, and talk of their plans before going home." Mahosadha reasons that hiding beneath that specific, unchanging spot is the way in: "so the sage thought that if he should hide beneath that trough he might learn their secrets. Lifting the trough accordingly, he caused a rug to be spread beneath it and crept in."'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, exploit-routine, positioning-to-overhear, unguarded-habit]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: 'Now on other days, these four on coming out of the palace used to sit on a trough at the palace door, and talk of their plans before going home: so the sage thought that if he should hide beneath that trough he might learn their secrets. Lifting the trough accordingly, he caused a rug to be spread beneath it and crept in.'
canonical-instances:
  - "A journalist investigating a company's real decision-making learns the executives always debrief informally at the same corner table of the same coffee shop after every board meeting, and books that exact table an hour early rather than chasing quotes through official channels."
  - "A parent suspects a teenager's friend group is planning something they'd never admit if asked directly, and rather than interrogating anyone, simply stays in the next room during the group's habitual Friday hangout, where the plan naturally surfaces."
critical-questions:
  - "This depends on the targets' routine staying genuinely unguarded — once someone suspects they've been overheard once, does the same spot ever work again, or does the method have exactly one use per routine before it's compromised?"
  - "There's a real cost-benefit question the method doesn't address on its own: is deliberately concealing yourself to overhear private conversation justified by what you expect to learn, or does the method's effectiveness make it easy to reach for regardless of whether the intrusion is warranted?"
status: active
