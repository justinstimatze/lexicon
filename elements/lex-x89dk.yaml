canonical-instances:
  - "A satirical historical drama depicts a fictionalized ancient kingdom's corrupt council in ways that map precisely onto a network's current board of directors, and the show's creators can always point out that it's set centuries ago and involves entirely invented characters."
  - "An office comic strip taped to a break-room wall mocks a generic, unnamed 'boss from an old job' whose specific complaints happen to match every complaint currently circulating about the actual manager, and nobody can be disciplined for a strip that is, technically, about someone else, somewhere else, a long time ago."
critical-questions:
  - "Does the deniability this mechanism provides actually protect the storyteller from consequences, or does everyone involved, including the authority being satirized, understand exactly who and what is being criticized, making the mythic distance a shared fiction rather than a genuine shield?"
  - "Is there a point at which repeated use of this mechanism against the same specific institution becomes recognized as pointed criticism regardless of the mythic framing, eroding the deniability over time through sheer pattern-recognition?"
  - "Does this outlet for protest actually reduce pressure toward more direct forms of dissent or reform, or does venting criticism safely through myth make the underlying grievances easier for the institution to tolerate indefinitely without ever addressing them?"
