id: lex-btxna
name: protect-the-messenger-because-your-own-messenger-needs-the-same-protection
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you receive an unwelcome message and feel the urge to punish whoever delivered it, don't treat the messenger as an extension of the message's content -- the norm against harming envoys isn't framed as mercy or courtesy toward the individual, it's framed as strict reciprocity, and Kautilya has the envoy state the reciprocal logic directly to an angry king: 'To such a king the envoy shall point out that, just as his own envoy was his mouthpiece, so it was with other kings. Envoys, therefore speak as they are instructed to, even if weapons are raised against them. [The shastras say that] even if an envoy is an outcast, he shall not be killed. It goes without saying that a Brahmin envoy shall never be harmed. The duty of envoys is but to repeat the words of his master.' The argument does not appeal to the envoy's personal innocence or status -- it appeals to a structural fact both kings share: every king needs to be able to send messages, including unwelcome ones, through a carrier who will not be held personally liable for the content. 'Just as his own envoy was his mouthpiece, so it was with other kings' names the protection as symmetric and conditional on reciprocity, not as a one-way kindness: the instant one side punishes a messenger for the message, the channel that both sides depend on to communicate anything -- including future surrenders, warnings, and offers to de-escalate -- becomes unusable for everyone, themselves included. The rule survives specifically because violating it destroys a shared resource, not because of anything special about the individual messenger. Diagnostic move: when you're furious at whoever brought you bad news -- a subordinate relaying a superior's harsh decision, an intermediary carrying a rejected offer, a courier bearing an ultimatum -- separate the question 'do I object to this message' from 'do I want messengers who bring me true but unwelcome information to keep existing,' because punishing the current messenger answers the second question for every future messenger you'll ever need, including your own."
