evokes: [popper-1940-what-is-dialectic, marx-economism-critique, base-and-superstructure, ultimate-basis-of-development, ideas-outweigh-economic-forces]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'What is Dialectic?' (paper read to a philosophy seminar at Canterbury University College, Christchurch, New Zealand, 1937; first published in Mind, N.S. 49, 1940), Ch. 15 of Conjectures and Refutations (Routledge Classics, 2002), p.447, Section 3 'Dialectic After Hegel.'"
    quote: "'Marx's economism--his emphasis on the economic background as the ultimate basis of any sort of development--is mistaken and in fact untenable. I think that social experience clearly shows that under certain circumstances the influence of ideas (perhaps supported by propaganda) can outweigh and supersede economic forces. Besides, granted that it is impossible fully to understand mental developments without understanding their economic background, it is at least as impossible to understand economic developments without understanding the development of, for instance, scientific or religious ideas.'"
canonical-instances:
  - "A startup's board is told that 'unit economics are the ultimate basis of any product decision -- get the numbers right and the product follows.' Run the same argument in reverse: you can't get unit economics right without first understanding which product decisions shape user behavior, retention, and willingness to pay. Neither one sits underneath the other as bedrock -- the numbers and the product choices keep reshaping each other on an ongoing basis."
  - "A hiring debate claims that 'culture is the ultimate basis of performance -- fix the culture and results follow.' The same case runs the other way just as easily: a team's culture is shaped by what actually gets measured, rewarded, and shipped, so results feed back into culture as much as culture feeds into results. Treating either one as the sole root cause of the other misdescribes a loop as a one-way chain."
critical-questions:
  - "Doesn't showing mutual dependency between two things prove too little -- everything depends on everything else eventually, so isn't this diagnostic always available and therefore useless? A faint or remote reverse dependency doesn't pass the test. What has to be checked is whether the reverse argument lands with comparable force to the forward one, judged by the same standard of evidence. Popper doesn't just gesture at ideas mattering to economics -- he names specific, substantial cases (scientific and religious ideas shaping economic development) that meet the same bar Marx set for economics shaping ideas. A trivial or remote reverse dependency doesn't pass this test; a dependency argued with the same rigor and specificity as the original claim does."
  - "Could two things be genuinely asymmetric even while showing some mutual influence in both directions, so that the reverse-argument test gives a false negative? Yes -- mutual influence in both directions is compatible with one direction still being dominant in degree. The atom's target is a specific rhetorical move: calling one side the 'ultimate' or sole basis when the case for the other direction turns out, on inspection, to be just as substantial. Two-way influence of any strength doesn't by itself rule out asymmetry. What settles the matter is an actual comparison of how strong each dependency runs, and a forward-only argument never supplies one."
