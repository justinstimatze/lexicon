lineage:
  - source: primary
    text: hyde-hermes-theft-as-response-to-exclusion-from-gift-exchange
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' opening section, drawing on the Homeric Hymn to Hermes. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "All of which is very fine if you are one of the in-group. But what if you’re an outsider, or what if you’re inside but the customary commerce always leaves you beneath your “betters”? All the wonderful gift exchange in tribe A is little help if you’ve had a crop failure and belong to tribe B. The small-business club down the street may have a fine program for start-up capital, but what if it’s for white folks only? What if all the male scientists swap data and you happen to be a woman? What if students at your high school always get scholarships to trade schools, never to elite universities? In cases such as these, you may have to resort to some form of subterfuge to get ahead; if the others won’t give, you may have to steal."
canonical-instances:
  - "A junior employee excluded from the informal after-hours socializing where promotion decisions actually get discussed and mentorship actually flows starts quietly cultivating relationships with senior leaders through unofficial, unsanctioned channels, because the official mentorship program was never actually where advancement happened."
  - "A researcher from an under-resourced institution, excluded from the closed circles of pre-publication data-sharing among elite labs, resorts to scraping or reverse-engineering competitors' published results to stay current, because the field's actual currency (early access to unpublished findings) was never distributed through any channel open to her."
critical-questions:
  - "Does this framing risk providing blanket justification for any rule-breaking by anyone who can construct a narrative of exclusion, even when the exclusion is minor or the 'theft' causes serious harm to specific people rather than just circumventing an unfair gate?"
  - "How should this apply when the excluded party's workaround itself creates new exclusions or harms third parties (the scientist who scrapes data may violate the consent of research subjects) -- does the legitimacy of the original exclusion transfer cleanly to legitimize any means of working around it?"
  - "Is there a meaningful difference between an excluded party using cunning and rule-bending (Hermes' trickery) versus outright harmful theft (violence, fraud that damages innocents), and does Hyde's framing risk collapsing that distinction by treating all workarounds as equally justified 'slipping the trap'?"
