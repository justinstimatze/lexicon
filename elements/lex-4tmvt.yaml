lineage:
  - source: primary
    text: cushing-youth-and-eagle-dancers-chant-dead-dead
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Youth and His Eagle.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Hapa! hapa! is! is! is! (Dead! dead! this! this! this!)--pointing at one another, and repeating this baleful expression, although so beautiful, and full of life and joy and merriment. Now, the youth looked at them all through this long dance, and though he thought it strange that they should exclaim thus one to another, so lively and pretty and jolly they were, he was nevertheless filled with amusement at their strange antics and wordless jokes.'"
canonical-instances:
  - "Employees at a company repeatedly joke among themselves about 'working for a sinking ship' or being there 'until the lights go out,' and a new hire dismisses it as typical gallows-humor banter, only to be blindsided when the company actually goes under weeks later -- the literal truth had been stated aloud, repeatedly, in a register that coded as joke rather than warning."
  - "A patient's family jokingly refers to a relative's persistent symptom as 'the thing that's going to kill him one day' as a running family joke for years, and a visiting friend dismisses it as dark humor rather than register it as a literal, repeated statement worth investigating, until the joke turns out to have been true diagnostic information all along."
critical-questions:
  - "how is a listener actually supposed to distinguish a chant that happens to be literally true (as here) from the vast majority of ritualized or playful refrains that are genuinely just noise, without becoming someone who treats every joke as a coded warning?"
  - "does this pattern only work in hindsight -- is the youth's failure to register 'Dead! dead!' actually a diagnosable error, or is the story simply constructed so that the correct interpretation is only obvious once we already know the twist?"
  - "if the dancers' chant was addressed to each other and not actually meant as communication to the youth at all, does treating it as a warning he should have heeded misread the scene -- was there ever an intended message here, or only an accidental truth he happened to overhear?"
