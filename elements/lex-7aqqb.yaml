id: lex-7aqqb
name: framing-of-question-fixes-the-ontology-of-the-inference
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When formulating a question for inference, surface that the question's framing fixes the ontology — which objects are countable, which boundaries hold, which categories exist; reframing the question can change the answer without changing the data."
related: [lex-wtkuz, lex-hm8yx, lex-axa6h, lex-3d2he, lex-9exaw, lex-ry9qx, lex-6xw55, lex-e6mj8]
evokes: [paradigm-as-constitutive-of-nature, incommensurability, seeing-as, duck-rabbit-gestalt-switch, frame-analysis, ontological-commitment-not-theory-neutral, problem-field, what-counts-as-data-is-paradigm-laden, theory-laden-observation, cross-framing-replication, ontological-negative-space, no-view-from-nowhere]
lineage:
  - source: primary
    text: kuhn-1962-structure-of-scientific-revolutions-ch9-ch10
    citation: "Thomas S. Kuhn, The Structure of Scientific Revolutions (2nd ed., enlarged, University of Chicago Press 1970; orig. 1962), Chapter IX 'The Nature and Necessity of Scientific Revolutions' (pp.103-110) and Chapter X 'Revolutions as Changes of World View' (pp.111-135). Kuhn's central transferable claim: a paradigm is not merely a theoretical model overlaid on neutral data — it is constitutive of what counts as data, of what questions are askable, and of what counts as a solution. The paradigm sets the ontology of the inference (what entities the universe contains, what behaviors they have, which observations are even possible). When the paradigm changes, the world itself effectively changes — not because nature has been swapped out, but because the perceptual and inferential apparatus through which the scientist accesses nature has been re-trained. The Kuhnian claim travels far beyond philosophy-of-science: any inference whose gating-question is framed within ontological commitments will surface only those forces, entities, and causes that the commitments permit. Forces excluded by the framing cannot be wrong — they cannot even appear. In-copyright."
    quote: "[Kuhn 1970 Ch.IX p.103]: 'Successive paradigms tell us different things about the population of the universe and about that population's behavior. They differ, that is, about such questions as the existence of subatomic particles, the materiality of light, and the conservation of heat or of energy. These are the substantive differences between successive paradigms... But paradigms differ in more than substance, for they are directed not only to nature but also back upon the science that produced them. They are the source of the methods, problem-field, and standards of solution accepted by any mature scientific community at any given time. As a result, the reception of a new paradigm often necessitates a redefinition of the corresponding science. Some old problems may be relegated to another science or declared entirely \"unscientific.\" Others that were previously non-existent or trivial may, with a new paradigm, become the very archetypes of significant scientific achievement. And as the problems change, so, often, does the standard that distinguishes a real scientific solution from a mere metaphysical speculation, word game, or mathematical play. The normal-scientific tradition that emerges from a scientific revolution is not only incompatible but often actually incommensurable with that which has gone before.' [Ch.IX p.109]: 'I have so far argued only that paradigms are constitutive of science. Now I wish to display a sense in which they are constitutive of nature as well.' [Ch.X p.111]: 'when paradigms change, the world itself changes with them. Led by a new paradigm, scientists adopt new instruments and look in new places. Even more important, during revolutions scientists see new and different things when looking with familiar instruments in places they have looked before. It is rather as if the professional community had been suddenly transported to another planet where familiar objects are seen in a different light and are joined by unfamiliar ones as well.' [Ch.X p.111]: 'What were ducks in the scientist's world before the revolution are rabbits afterwards.' [Ch.X p.112]: 'the world that the student then enters is not, however, fixed once and for all by the nature of the environment, on the one hand, and of science, on the other. Rather, it is determined jointly by the environment and the particular normal-scientific tradition that the student has been trained to pursue.' [Ch.X p.113]: 'What a man sees depends both upon what he looks at and also upon what his previous visual-conceptual experience has taught him to see. In the absence of such training there can only be, in William James's phrase, \"a bloomin' buzzin' confusion.\"' [Ch.X p.113]: 'something like a paradigm is prerequisite to perception itself.' [Ch.IX p.109 on cross-paradigm communication]: 'To the extent, as significant as it is incomplete, that two scientific schools disagree about what is a problem and what a solution, they will inevitably talk through each other when debating the relative merits of their respective paradigms. In the partially circular arguments that regularly result, each paradigm will be shown to satisfy more or less the criteria that it dictates for itself and to fall short of a few of those dictated by its opponent.'"
  - source: primary
    text: goodman-1978-ways-of-worldmaking-ch1-relative-reality
    citation: "Nelson Goodman, Ways of Worldmaking (Hackett Publishing, 1978), Chapter I 'Words, Works, Worlds,' section 6 'Relative Reality,' pp.20-21. Goodman's ontological-pluralism extends and generalizes Kuhn's paradigm-constitutive claim from scientific paradigms to all symbolic-system-based world-versions: there is no single neutral 'world' against which world-versions are tested, and stripping a version down to that supposedly neutral remainder leaves nothing worth having. Verified verbatim against a direct pdftotext extraction (this PDF has a real text layer, no OCR needed); the plain hyphen in 'pattern-a world' below is exact as printed in the source, not a dash-rendering artifact."
    quote: "Shouldn't we now return to sanity from all this mad proliferation of worlds? Shouldn't we stop speaking of right versions as if each were, or had, its own world, and recognize all as versions of one and the same neutral and underlying world? The world thus regained, as remarked earlier, is a world without kinds or order or motion or rest or pattern-a world not worth fighting for or against."
  - source: primary
    text: quine-1968-ontological-relativity-p32
    citation: "W. V. O. Quine, 'Ontological Relativity,' Journal of Philosophy 65:7 (1968), pp.185-212; reprinted in Ontological Relativity and Other Essays (Columbia University Press, 1969), p.32. Quine's central claim: ontological commitments are only meaningful relative to a background theory or translation scheme, which itself fixes the ontology of the asking; two complete and internally consistent translations of an alien language can disagree about the ontology of the alien's claims with no fact of the matter to adjudicate. The gavagai/rabbit passage below is the canonical illustration. Verified against a pdftotext extraction of a digitization with several character-level encoding errors (letter substitutions like 'tern1' for 'term', 'undctached' for 'undetached'); the quote below corrects those confirmed encoding artifacts to the actual words rather than reproducing the corruption. The source itself sets off 'gavagai' with straight double quotes, rendered here as single quotes per house YAML convention."
    quote: "Such is the quandary over 'gavagai': where one gavagai leaves off and another begins. The only difference between rabbits, undetached rabbit parts, and rabbit stages is in their individuation. If you take the total scattered portion of the spatiotemporal world that is made up of rabbits, and that which is made up of undetached rabbit parts, and that which is made up of rabbit stages, you come out with the same scattered portion of the world each of the three times. The only difference is in how you slice it. And how to slice it is what ostension or simple conditioning, however persistently repeated, cannot teach."
  - source: primary
    text: postrel-2020-fabric-of-civilization-preface
    citation: "Virginia Postrel, The Fabric of Civilization: How Textiles Made the World (Basic Books, 2020), Preface, on archaeologist Arthur Evans's 1900 excavation of Knossos and his decades-long misreading of a Linear B hieroglyph."
    quote: "He identified two distinct scripts, along with hieroglyphs representing objects such as a bull's head, a spouted vase, and what Evans took to be a palace or tower: a rectangle bisected on the diagonal, with four spikes on top. But he couldn't read the tablets. Although he worked on the problem for decades, Evans never managed to decipher them... But we do know that Evans got his 'tower' upside down and completely mistook its meaning. The hieroglyph depicted not a crenellated battlement but a fringed piece of fabric or perhaps a warp-weighted loom. It meant not palace, but textile... Textile records make up more than half of the tablets ultimately uncovered at Knossos... Evans had missed the source of the city's wealth and the primary activity of its residents. Knossos was a textile superpower."
  - source: practitioner
    text: cross-domain-pattern-synthesis-v114
    citation: "Cross-domain attestations of the framing-fixes-ontology mechanism observed via operational diagnostics (2026-06-09): (i) Bohr complementarity in quantum mechanics — which observable the experimenter chooses to measure (position vs momentum) determines which class of outcomes is even possible; the unmeasured quantity does not have a hidden definite value; the measurement-frame is constitutive of the outcome-space. (ii) Heisenberg microscope thought-experiment — the act of observation under a chosen measurement-frame fixes which complementary quantities can be jointly observed. (iii) Goffman 1974 Frame Analysis — the same social interaction, under different participation-frameworks (theatrical-performance vs sincere-conversation vs ritual), generates categorically different inventories of 'what is happening' for the participants. (iv) Latour 1987 Science in Action — the laboratory's chosen instrument-frame (calorimetry vs spectroscopy vs crystallography) determines which forces are even nameable in the lab's reports. (v) lex-9exaw chosen-time-frame as the temporal-window special case: when the gating frame is temporal-zoom, lex-7aqqb specializes to lex-9exaw. The transferable mechanism: identify the gating commitment (ontological, temporal, instrumental, classificatory), notice that it pre-selects which forces can surface, expect blind spots in the orthogonal-ontology directions, do not infer from blindness that the orthogonal forces are absent. Pre-acquisition for Goffman, Latour; in-copyright. Cross-substrate attestation across philosophy-of-science, philosophy-of-language, quantum mechanics, sociology, science-and-technology-studies."
canonical-instances:
  - "Newton vs scholastics on gravity (Kuhn 1970 Ch.IX pp.104-106): For the post-scholastic seventeenth-century mechanico-corpuscular paradigm, occult forces were out-of-bounds; gravity-as-innate-attraction was forbidden by the frame and the question 'what is the mechanical cause of gravity?' was the only legitimate one. Newton's Principia eventually required scientists to accept innate-attraction (a reversal of the frame), and by the mid-eighteenth century the standards had shifted: innate attractions and repulsions joined size, shape, position, and motion as physically-irreducible primary properties of matter. The same phenomenon (gravity) was framed as 'requires-mechanical-explanation' under one paradigm and 'physically-irreducible-primary' under another. The phenomenon did not change; the frame did, and what counted as a legitimate question changed with it."
  - "Pre-Lavoisier vs post-Lavoisier chemistry (Kuhn 1970 Ch.IX p.107): Before Lavoisier's reform, accounting for the qualities of chemical substances (why some are acidic, others metalline, combustible) was one of the acknowledged tasks of chemistry, addressed via 'principles' including phlogiston. Lavoisier's reform did away with chemical 'principles' and thereby with the explanatory project. For much of the nineteenth century, failure to explain the qualities of compounds was no indictment of a chemical theory because the question had been removed from the frame. (Quantum mechanics later restored a version of the question.) The same data (substances exhibit qualities) sat outside the asking-frame for a century after the paradigm shift."
  - "Maxwell's electromagnetic ether (Kuhn 1970 Ch.IX p.107): When the mechanical-medium framing of light-propagation was the paradigm, Maxwell's electromagnetic theory was widely rejected because it gave no account at all of a medium able to support light waves. As Maxwell's theory achieved paradigm status, the same omission ceased to be a flaw; designing such a medium was abandoned. Scientists no longer thought it unscientific to speak of an electrical 'displacement' without specifying what was being displaced. The framing of 'what counts as a legitimate explanation' shifted; the empirical adequacy of the theory was unchanged."
  - "Duck-rabbit gestalt-switch (Kuhn 1970 Ch.X p.111): The same line-drawing perceives as a duck under one perceptual frame and a rabbit under another; both frames are sustained by the same retinal input but generate categorically different 'what is in the picture' inventories. Kuhn uses this as the perceptual analog: 'What were ducks in the scientist's world before the revolution are rabbits afterwards.' The cross-domain claim is that scientific frame-shifts have the same constitutive structure as perceptual gestalt-switches — what one sees is jointly determined by the input and the trained perceptual-conceptual apparatus."
  - "Inverting-goggles experiment (Stratton 1897, Kuhn 1970 Ch.X p.112): A subject who puts on inverting lenses initially sees the world upside down. After prolonged exposure, the visual field flips and objects are again seen right-side-up — the perceptual frame has been retrained. 'Literally as well as metaphorically, the man accustomed to inverting lenses has undergone a revolutionary transformation of vision.' Empirical demonstration that the perceptual frame is plastic AND constitutive: the same retinal input maps to different perceived-worlds depending on the frame the apparatus has learned."
  - "Anomalous-playing-card experiment (Kuhn 1970 Ch.X p.112-113): Subjects shown anomalous cards (e.g., a red six of spades) initially see only the categories their previous experience equipped them for — they assimilate the anomaly to 'normal six of hearts' or 'normal six of spades' depending on the dominant cue. Only after prolonged exposure providing the requisite additional categories can they see all anomalous cards on first inspection. The category-frame is prerequisite to perception itself; an unframable anomaly is, in James's phrase, 'a bloomin' buzzin' confusion.'"
  - "Sluice 1835 fan-out cross-framing-replication (2026-06-09 — surfaced this atom): A 50-branch imagined-19th-century fan-out + 3-pass invariance aggregation was run twice with the SAME data and the SAME model, varying only the framing of one contested question (Q6: the press). Under the power-channel framing (centralize-vs-disperse), reflexivity-through-print returned ZERO matches across all 3 passes. Under the ideational framing ('mass print manufactures self-aware publics and imagined collective identities'), reflexivity went to the TOP INVARIANT in all 3 passes (44/4, 46/4, 50/0), AND reorganized the whole card (counterfeit-participation promoted watch→invariant; leveling re-expressed as class-identity; nationalism named). The data did not change; the model did not change. The frame was the only varying parameter, and the frame was constitutive of which invariants could surface. Operational corollary the run-out forced: cross-framing replication under ≥2 ontologies is required before trusting any invariant claim from a single framing. (Internal sibling-project transmission via dispatch ; mining-pass markdown only — not lineage.)"
  - "Bohr complementarity in quantum mechanics: the experimenter's choice of which observable to measure (position or momentum, energy or time, polarization-axis A or polarization-axis B) determines the class of possible outcomes. The unmeasured complementary quantity does not have a hidden definite value awaiting discovery — the measurement-frame is constitutive of the outcome-space, not a passive window onto a frame-independent reality. The framing-fixes-ontology mechanism operates at the level of physical measurement, not merely conceptual organization. Cross-substrate consilience: Kuhn's paradigm-as-constitutive-of-nature and Bohr's complementarity make the same structural claim about how frame-selection precedes observation."
  - "Goffman 1974 Frame Analysis: the same social interaction (a conversation between two strangers) generates categorically different inventories of 'what is happening' depending on the participation framework: sincere-getting-to-know-you vs theatrical-performance vs ritual-courtship vs scam-setup. Participants who frame the interaction differently are not having the same conversation with different interpretations — they are inhabiting different events with different ontologies of action. Cross-domain instance of the frame-as-constitutive-of-the-event claim, in the social-interaction domain rather than the natural-science domain."
  - "Arthur Evans and the Knossos textile hieroglyph (Postrel 2020, Preface): Evans excavated Knossos in 1900 already primed by Greek myth -- Theseus, the Labyrinth, the Minotaur -- to expect a palace, and named an ambiguous rectangular hieroglyph with four spikes 'a palace or tower' accordingly. He worked on decipherment for decades without ever correcting the reading. The evidence that would have corrected him was not scarce or hidden: textile records made up more than half of all the tablets his own dig had already uncovered, and the mundane, exhaustively-documented economic activity of the site (wool and flax processing on an industrial scale) sat right alongside the mythic palace narrative he'd already fixed on. His palace-and-labyrinth frame did not merely bias which NEW evidence he sought -- it determined how the majority of evidence he already possessed got read, treating an enormous, already-in-hand textile archive as background administrative noise rather than as the answer to what the site actually was. Correction required a different investigator (Michael Ventris, 1952) applying a different method (script identification via cryptographic technique, not archaeological narrative) to identify the tablets' other script as an early form of Greek -- eleven years after Evans's own death. The hieroglyph itself was never palace at all: a fringed piece of fabric or a warp-weighted loom. Cross-domain instance of the frame-as-constitutive claim in archaeology and historical philology, and a sharper case than several instances above in one respect: the correcting evidence was not merely available in principle but already physically possessed in bulk, which shows frame-capture can outweigh evidentiary volume, not just evidentiary access."
  - "operationally distinct from lex-9exaw chosen-time-frame-determines-which-causal-structures-can-be-detected: lex-9exaw specializes lex-7aqqb to the case where the gating frame is the TEMPORAL window of observation (5 years vs 50 years vs 500 years). lex-9exaw's 'window-truncation hides slow-moving causes' is the temporal-window instance of lex-7aqqb's general claim 'frame-truncation hides forces in the orthogonal-ontology directions.' The relation: lex-9exaw ⊂ lex-7aqqb. A reader who recognizes lex-9exaw in a case (chronic-pain attribution, climate-attribution, software-postmortem) should ALSO ask the lex-7aqqb question (is the temporal frame the ONLY ontological commitment doing gating-work, or are there others — disciplinary frames, instrumental frames, narrative frames — also pre-selecting which forces can surface?). lex-9exaw is the canonical Pierson-grounded instance; lex-7aqqb is the general claim under which lex-9exaw falls."
  - "operationally distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions: lex-3d2he is about USING a classification to predict the existence of unobserved entities at empty cells; the classification's frame is taken as given and exploited. lex-7aqqb is about how a classification (or any framing of a question) PRE-CONSTITUTES which entities can be candidates for the cells. The two compose: lex-7aqqb says 'the framing fixes the ontology'; lex-3d2he says 'within a fixed framing, the gaps generate predictions.' A reader applying lex-3d2he should first apply lex-7aqqb to verify that the classification's frame is being defended on its own terms rather than treated as theory-neutral."
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is about whether a metacognitive claim is describing a fact about a process vs operating on the process. lex-7aqqb is about whether the framing of the question being asked is theory-neutral vs theory-laden. Both are meta-level moves, but lex-wtkuz operates on procedural-frame selection (am I describing or operating?), while lex-7aqqb operates on ontological-frame selection (what does the framing presuppose exists?). They compose: a researcher choosing a method (lex-wtkuz's domain) is doing so within a framing of the problem (lex-7aqqb's domain); both choices need to be defended."
critical-questions:
  - "what ontological commitments are baked into the question's framing? Discriminator: list the entities the framing presupposes exist (e.g., 'power channels,' 'rational actors,' 'media of exchange'), the relations it presupposes are relevant (e.g., 'centralization vs dispersion,' 'cooperation vs defection,' 'centripetal vs centrifugal'), and the dimensions it does NOT name. The unnamed dimensions are where the frame's blind spots live."
  - "which forces or causes could only surface under a DIFFERENT framing of the same question? Discriminator: attempt to re-frame the gating question under an ontologically-distinct commitment (a participation-framework if the original was a causal-mechanism framework; an ideational-framework if the original was a power-channel framework; a temporal-framework if the original was a procedural-framework). The forces that surface ONLY in the alternative framing are the negative-space of the original frame."
  - "would the same data, re-analyzed under a different framing of the gating question, yield different invariants? (Cross-framing replication discipline.) Discriminator: do not trust a claimed invariant from a single framing. Re-run the analysis under at least one alternative ontological framing of the gating question; compare invariant sets. Invariants that survive across framings have higher epistemic standing than invariants from a single frame. The within-frame replication addresses model-confound; the cross-framing replication addresses frame-confound. Both are needed."
  - "is the analyst silently treating their frame as theory-neutral when it is actually theory-laden? Discriminator: ask whether the analyst would CONCEDE that an alternative framing exists. If the answer is 'no, this is just how it is,' the frame is being treated as theory-neutral. If the answer is 'yes, but mine is better because X,' the X is the substantive defense and should be made explicit. The Kuhnian failure-mode is conflating 'my paradigm is widely accepted' with 'my paradigm is the view from nowhere.'"
  - "when frames diverge between analysts, are they having a substantive disagreement or talking past each other? Kuhn's 'incompleteness of logical contact' diagnosis: 'each paradigm will be shown to satisfy more or less the criteria that it dictates for itself and to fall short of a few of those dictated by its opponent.' Discriminator: identify what each analyst's framing presupposes; check whether the disagreement concerns the data, the inferences from the data within a shared framing, or the framings themselves. Cross-frame disagreement requires either (a) translating into a shared frame for the duration of the debate, (b) examining the framings on their own terms, or (c) accepting that within-frame standards cannot adjudicate."
  - "what is the practitioner-actionable upshot? For research design: frame-selection is not a free parameter to be optimized for tractability; it is a substantive commitment that pre-selects which forces can surface. For collaborative inference (multi-analyst, multi-discipline): make framings explicit before debating conclusions, and budget for cross-framing replication on essential invariant claims. For forecasting and backcasting: a forecast's robustness should be evaluated not only across data-realizations and model-realizations but also across ontological framings of the gating question; a forecast that holds across all three is more robust than one that holds across two."
