lineage:
  - source: primary
    text: kautilya-arthashastra-comparison-of-the-six-types-of-troops
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Military Organization,' 'Types of Troops,' 'Comparison,' {from 9.2.13-20}."
    quote: "'Because the standing army depends on the king for its existence and because it is constantly under training, it is better than a territorial army... Alien troops and jungle tribal forces both have plunder as their objective. When there is no plunder or when there is a calamity, they are as dangerous as a viper in one's bosom.'"
canonical-instances:
  - "A startup choosing between hiring full-time staff, using a nearby staffing agency's contractors, or engaging a distant freelance marketplace prioritizes the more expensive full-time hires for its most critical function, reasoning that only staff whose own career and equity are tied to the company's success will still be reliable during a crunch, when the cheaper contractor pool has no comparable stake and will simply move to the next contract."
  - "A political campaign choosing among volunteers who share the candidate's actual convictions, paid canvassers who show up reliably for the fee, and a loosely affiliated outside group with its own separate agenda prioritizes the convicted volunteers for the most sensitive tasks, since the paid canvassers' and the outside group's cooperation is contingent on terms that could change, while the volunteers' interest is identical to the campaign's own."
critical-questions:
  - "does interest-alignment actually predict reliability better than raw competence or availability in every case -- could a highly capable but less-aligned resource outperform a deeply aligned but under-skilled one on tasks where skill matters more than loyalty?"
  - "how does a decision-maker actually measure 'shared interest' in advance, rather than assuming it from category membership (employee vs. contractor, ally vs. mercenary) -- can a nominally aligned resource turn out, in practice, to have much weaker alignment than its category suggested?"
  - "does over-indexing on interest-alignment lead to under-using genuinely useful but lower-alignment resources when speed or scale matters more than long-term reliability, costing an opportunity that a more pragmatic, availability-first choice would have captured?"
