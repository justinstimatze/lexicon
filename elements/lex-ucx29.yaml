    text: distinctness-audit-approximate-number-sense-vs-symbolic-arithmetic
    citation: "Neither lex-acmmk nor lex-f4asy grounds numerical cognition, the accumulator mechanism, or approximate-vs-exact arithmetic specifically. Lex-0793 (Kant, synthetic-a-priori-knowledge-is-possible-because-mind-structures-experience) names a transcendental-philosophical, a priori argument about the fixed, universal preconditions of any possible cognition whatsoever, argued from the analytic/synthetic distinction rather than from comparative or developmental data; it is not falsifiable by animal-cognition evidence and makes no claim about a phylogenetically-specific, quantity-dedicated module. Lex-0697 (Berlin & Kay, basic-color-terms-encoded-in-fixed-implicational-sequence-across-languages) names a claim about how languages lexically categorize an already-shared human perceptual continuum (color) in a fixed cross-linguistic implicational order — a claim about vocabulary acquisition across cultures that presupposes ordinary perception is already in place before naming occurs. This atom's claim is about a pre-linguistic, pre-cultural perceptual faculty itself, operating in rats, pigeons, and six-month-old infants with no language at all: Dehaene explicitly analogizes number to color, shape, and position as one more perceptual dimension the accumulator adds, rather than describing how a perceptual dimension gets named."
canonical-instances:
  - "The Robinson Crusoe accumulator metaphor (Chapter 1): a castaway with no language builds 'an approximate calculator' from a water tank and a spring, filling it by a fixed amount for each item counted, so 'the final level of water in the accumulator is thus completely equivalent to number' — and, because the representation is a continuous variable standing for a discrete quantity, it inherits the same two signatures found in real animal arithmetic: 'Robinson clearly will be better able to discriminate numbers that are more different; this is the distance effect... exacerbated as the numbers become larger, thus reproducing the magnitude effect.'"
  - "Pigeons and rats doing approximate arithmetic (Chapter 1): 'Pigeons will never be able to distinguish 49 from 50, because they cannot represent these quantities other than in an approximate and variable fashion. For an animal, 5 plus 5 does not make 10, but only about 10: maybe 9, 10, or 11.'"
  - "Six-month-old human infants (Introduction / Chapter 2): 'All people possess, even within their first year of life, a well-developed intuition about numbers... Elementary additions and subtractions are already available to 6-month-old babies!' — evidence Dehaene presents as vindicating Tobias Dantzig's 1954 coinage of 'Number Sense' against Piaget's contrary claim that young children have no numerical competence."
  - "Mr. N, the Approximate Man (Chapter 7): a patient with a left-hemisphere lesion 'does not know how to add 2 + 2' and answers 3, 4, or 5 at random, yet 'he never offers a result as absurd as 9' and can instantly and correctly reject 5+7=19 while accepting the merely-imprecise 5+7=11 — the clinical double dissociation Dehaene uses to argue that 'those two categories [approximate and exact arithmetic] rely on partially separate cerebral systems. One can be abolished while the other remains intact.' (Formally reported as Dehaene & Cohen 1991, 'Two mental calculation systems: A case study of severe acalculia with preserved approximation,' Neuropsychologia 29.)"
  - "Ordinary adult innumeracy (Chapter 5) as the same architecture's everyday failure mode: numerate adults reflexively answer 'three' to 'a farmer has eight cows, all but five die, how many remain?' (correct answer: five), because 'the mere presentation of the words \"fewer than\" or \"all but\" suffices to trigger an automatic subtraction scheme' that overrides, rather than consults, the approximate number sense that would have flagged the answer as implausible."
  - "Distinguished from lex-f4asy (Berlin-Kay, basic color terms): Berlin-Kay's implicational hierarchy describes the order in which LANGUAGES ACQUIRE WORDS for an already-shared human perceptual continuum; this atom describes the EXISTENCE OF THE PRE-LINGUISTIC PERCEPTUAL FACULTY ITSELF — the accumulator operates identically in rats, pigeons, and pre-verbal infants who have no words at all. Distinguished from lex-acmmk (Kant, synthetic a priori): Kant's claim is a fixed, universal, a priori transcendental precondition of any cognition whatsoever, argued independent of empirical or comparative data; Dehaene's claim is a specific, falsifiable, evolved perceptual module documented via animal, infant, and lesion evidence."
critical-questions:
  - "Is the numerical competence under discussion APPROXIMATE (fuzzy, analog, present in rats, pigeons, and pre-verbal infants) or EXACT (symbolic, culturally invented, requiring language and education)? Conflating the two hides exactly where evolved number sense ends and cultural mathematics begins."
  - "Is a 'built from nothing' assumption being smuggled in about how a symbolic skill was acquired — is there an older, cruder, non-symbolic faculty it might instead be repurposing and sharpening?"
  - "Would the two systems being discussed survive selective brain damage, dementia, or a developmental disorder independently of one another? Dehaene's strongest evidence for treating them as genuinely separate systems, rather than one system at different precisions, is exactly this kind of clinical dissociation (Mr. N); if no plausible dissociation exists for the case at hand, the 'two systems' framing may be asserting more structure than is warranted."
  - "Is the claim being over-extended to imply ALL of mathematics — including recognizing that 37 is prime, or computing π — is innate? Dehaene is explicit that advanced, culturally-elaborated mathematics 'remain[s] the privilege of only a few humans in a few cultures'; the innate contribution he documents is bounded to approximate quantity and very small exact numbers (subitizing, roughly 1-4)."
  - "Is this atom's claim being confused with lex-acmmk's Kantian a priori claim, or lex-f4asy's Berlin-Kay linguistic-categorization claim? Check whether the argument on the table is empirical/comparative (this atom), transcendental/philosophical (lex-acmmk), or about lexical acquisition across languages for an already-perceived continuum (lex-f4asy)."
