id: lex-aryva
name: asymmetric-quality-information-drives-good-out-and-collapses-the-market
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When buyers can't tell quality differences, low-quality drives out high-quality and the market collapses. Akerlof's lemons: asymmetric quality information is the disease, signaling/warranty/regulation are the cures. Identify the asymmetry before predicting market failure."
