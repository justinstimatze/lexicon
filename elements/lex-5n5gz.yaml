    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education\" (1957), p.28. Ellipsis marks a disclosed cut of a page break where three scrambled footnote citation fragments are spliced into the sentence by the OCR extraction between \"invite\" and \"the fallacious.\""
    quote: "'But this should not invite [...] the fallacious though superficially plausible inference that sociological considerations are pertinent only in such instances of gross defects of environment. Well-fed patients living in well-ventilated and well-heated houses may also be subject to less conspicuous but no less stressful conditions of environment, in their homes, at work, and in the other groups of which they are a part.'"
canonical-instances:
  - "A workplace-stress training program illustrates burnout entirely with extreme cases (100-hour weeks, hostile managers, no time off), leading employees with a merely mediocre-but-not-abusive workload to conclude their own situation can't be a stress-mechanism case — missing that the same causal mechanism operates at lower intensity in their own milder-but-still-real chronic overwork."
  - "Public-health messaging about the dangers of a sedentary lifestyle uses only the most extreme illustration (a person who never leaves their chair), leaving moderately active people to assume the mechanism doesn't apply to them, when the same dose-response mechanism continues to operate, just less dramatically, well above the extreme threshold used to illustrate it."
critical-questions:
  - "Is there a principled way to decide how far a mechanism actually extends past its dramatic illustrations, or does correcting for this bias just replace one unexamined assumption (it stops at the extreme) with another (it extends indefinitely) without evidence either way?"
  - "Does using extreme cases for illustration always risk this fallacy, or are there mechanisms that genuinely DO have a threshold below which they don't operate at all — and how would you tell the two situations apart before committing to 'it's probably continuous' as the safer default?"
