lineage:
  - source: primary
    text: kautilya-arthashastra-three-types-of-aggressors
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'The Weak King,' 'Types of Aggressors,' {12.1.10-16}."
    quote: "'The righteous aggressor is satisfied with submission. The weak shall yield to him, particularly when there is danger from another enemy. The greedy aggressor is satisfied with seizing land and goods. The weak king shall give up wealth to him. The monstrous aggressor is satisfied only when he takes the land, goods, wives, sons and [even the] life of the defeated. A weak king may give up land and goods but shall not let himself be taken.'"
canonical-instances:
  - "A small vendor facing pressure from a dominant retail partner first diagnoses whether the partner mainly wants a symbolic acknowledgment of the power imbalance, a real price concession, or effective control over the vendor's own business decisions -- and offers exactly that level of concession rather than defaulting to either token deference (which won't satisfy a partner after real margin) or handing over operational control (which wasn't actually being demanded)."
  - "An employee being pressured out of a role by a hostile executive assesses whether the executive mainly wants a public show of deference, a reduction in the employee's scope and resources, or the employee's outright departure, and concedes only up to that read -- refusing, in every case, to accept being blamed for something they didn't do, treating that specific line as non-negotiable regardless of how much else they're willing to give up."
critical-questions:
  - "how reliably can a weaker party actually diagnose which type of aggressor they're facing before conceding, given that a genuinely greedy or monstrous aggressor has every incentive to present themselves as merely wanting symbolic submission in order to extract an easy first concession before escalating further demands, and does offering a calibrated but still real concession risk being read as weakness that invites escalation rather than being credited as an accurate diagnosis?"
  - "is the 'non-negotiable core' assumption realistic against a monstrous aggressor who, by the framework's own description, is 'satisfied only when' they take everything including life -- if that's genuinely true, does holding a line at personal safety actually work, or does it just provoke the very outcome (being taken) that the weaker party was trying to avoid?"
