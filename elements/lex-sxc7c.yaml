id: lex-sxc7c
name: marginalization-expels-a-group-from-useful-labor-participation
type-in: claim
type-out: structure
_tier: atomic
agent-instruction: "Recognize this pattern when a group is being expelled from useful participation in social and economic life — 'people the system of labor cannot or will not use': the old, the involuntarily unemployed, single mothers, disabled people, many racially marked groups. Young calls it 'perhaps the most dangerous form of oppression' because a whole category of people risks 'severe material deprivation and even extermination.' The non-distributive part is what a welfare check alone misses: even where material deprivation is mitigated, marginalization inflicts two further injustices — welfare provision itself can strip 'rights and freedoms that others have' via patronizing, arbitrary bureaucratic authority over recipients, and marginalization 'blocks the opportunity to exercise capacities in socially defined and recognized ways' even for someone materially comfortable. 'Marginalization does not cease to be oppressive when one has shelter and food.'"
related: [lex-s2uyr, lex-raydk]
evokes: [marginalization, expulsion-from-labor, welfare-dependency-and-rights-suspension, five-faces-of-oppression, iris-marion-young-1990]
lineage:
  - source: primary
    text: young-1990-justice-and-the-politics-of-difference
    citation: "Iris Marion Young, *Justice and the Politics of Difference* (Princeton, NJ: Princeton University Press, 1990), Chapter 2, 'Five Faces of Oppression,' the marginalization section (pp. 53-55). One face of a five-part typology (see lex-s2uyr for the full typology and how the five faces relate)."
    quote: "'Marginals are people the system of labor cannot or will not use... Marginalization is perhaps the most dangerous form of oppression. A whole category of people is expelled from useful participation in social life and thus potentially subjected to severe material deprivation and even extermination... Two categories of injustice beyond distribution are associated with marginality in advanced capitalist societies. First, the provision of welfare itself produces new injustice by depriving those dependent on it of rights and freedoms that others have. Second, even when material deprivation is somewhat mitigated by the welfare state, marginalization is unjust because it blocks the opportunity to exercise capacities in socially defined and recognized ways... Marginalization does not cease to be oppressive when one has shelter and food.' [The 'perhaps the most dangerous form of oppression... expelled from useful participation in social life' span crosses a column break the source's extraction interleaves rather than reads straight through -- confirmed reconstructing correctly against the PDF directly, in the order quoted above.]"
  - source: discovery-loop
    text: split-from-lex-s2uyr-young-five-faces-of-oppression
    citation: "Split out of lex-s2uyr (see lex-9z37e's discovery-loop entry for the full split rationale). Distinct from lex-raydk (Connell, dominant-category-stratifies-into-hegemonic-complicit-subordinate-marginalized): Connell names a four-position internal stratification pattern within a single privileged category (a gender, a race, a profession) -- hegemonic/complicit/subordinated/marginalized positions WITHIN that category. This atom names something different in kind: not a position within a stratified category, but expulsion from useful labor-participation entirely, standing as one of five distinct external mechanisms by which a whole group can be oppressed. A group can occupy Connell's internal 'marginalized' position and separately be expelled from labor-participation on this atom's terms -- the two are compositional, not competitive, since Connell's marginalized-position-holders are a candidate site to ask whether this atom's expulsion mechanism is also operating."
canonical-instances:
  - "Welfare's own rights-suspension: 'the provision of welfare itself produces new injustice by depriving those dependent on it of rights and freedoms that others have' — a recipient of means-tested aid routinely submits to home inspections, spending restrictions, and caseworker discretion that a taxpayer receiving a mortgage-interest deduction never faces, even though both are receiving a state-administered benefit."
  - "The capacity-blocking half, independent of material deprivation: a comfortably-housed retiree involuntarily excluded from the workforce still experiences marginalization's second injustice — 'marginalization does not cease to be oppressive when one has shelter and food' — because the exclusion from socially recognized productive participation is its own harm, not merely a proxy for poverty."
critical-questions:
  - "Is the group in question being expelled from useful labor-participation specifically — not merely paid less within it, which would be exploitation's mechanism (lex-9z37e) rather than this one?"
  - "If material deprivation were fully addressed by a welfare payment, would the recipient still face either of marginalization's two further injustices — bureaucratic rights-suspension, or continued exclusion from socially recognized capacity-exercise? A payment that answers only the first question hasn't answered this one."
status: active
