id: lex-kpxbv
name: successive-revolutions-relocate-authority-without-removing-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an intellectual movement announces that it has overthrown a discredited authority, check whether the underlying posture of unquestioning deference actually went away, or just found a new object to attach itself to. Popper traces a specific sequence across the history of Western thought. The earlier naturalistic revolution against God didn't remove theistic deference -- it relabeled the same slots: 'Theology, the Science of God, was replaced by the Science of Nature; God's laws by the laws of Nature; God's will and power by the will and the power of Nature (the natural forces); and later God's design and God's judgment by Natural Selection.' Then Hegel and Marx ran the identical substitution one level further: 'Hegel and Marx replaced the goddess Nature in its turn by the goddess History. So we get laws of History; powers, forces, tendencies, designs, and plans, of History; and the omnipotence and omniscience of historical determinism. Sinners against God are replaced by \"criminals who vainly resist the march of History\"; and we learn that not God but History (the History of \"Nations\" or of \"Classes\") will be our judge.' What each 'revolution' actually delivered was a new capitalized noun sitting in the God-shaped slot -- final, all-explaining, entitled to obedience and judgment -- while the actual intellectual habit (defer to a single named Authority rather than examine the specific claim on its own evidence) never got touched. Diagnostic move: when a field announces it has replaced an old authority with a new, more rigorous one -- Nature, History, Science, the Market, the Algorithm, the Data -- check whether the new authority is being examined claim by claim, or is instead being granted the same blanket deference, judgment-power, and immunity from challenge the old one had. If the deference transferred wholesale, the revolution changed the name on the door and left the room exactly as it was."
