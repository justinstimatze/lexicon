id: lex-us7nk
name: a-chronic-offender-is-checked-by-default-not-by-accusation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "In the fuel-system chapter of his diesel-repair manual, Dempsey states a standing diagnostic default rather than a symptom-matching rule: 'Injectors, like spark plugs, are to be assumed guilty until proven innocent. Injector failure has many symptoms, some of which are more pronounced for the different engine brands and models.' He doesn't tell the reader to check injectors only once black smoke or uneven running specifically points at them -- he tells the reader to treat injectors as the presumptive culprit for a wide swath of engine trouble as a matter of course, and to actively clear them (test against a tester or a known-good unit) rather than wait to be persuaded they're involved. This is a different move from simply ranking many candidate causes by how often each turns out to be the answer and working down the list. It singles out ONE specific component whose track record is disproportionate to how cheap it is to check. The burden shifts onto that component: attention moves elsewhere only once it has been affirmatively cleared, on every relevant occurrence, whatever the specific symptom pattern happens to look like. Transferable move: in any system with a component, actor, or factor that has a documented history of being the disproportionate cause of a given class of trouble, adopt a standing procedural default that checks or clears it FIRST and AUTOMATICALLY, rather than waiting for the specific case at hand to build a particular case against it. The trigger for this move is cheaper and fires more reliably than symptom-matching does: 'am I in the failure class where this offender has a track record,' answerable before any of the case's particular symptoms have even been read. The payoff is specifically strongest when the check is cheap relative to the cost of chasing rarer causes first, since that's what makes eating the false-positive cost of checking the usual suspect even when it turns out innocent still cheaper, on average, than skipping it."
