id: lex-9at9e
name: a-minimal-sincere-gift-to-a-worthy-recipient-yields-disproportionate-return
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A minimal, humble offering given with full sincerity to a worthy recipient can be portrayed as generating a vastly disproportionate future reward, with the specific case generalized into a stated causal law. In the Jataka''s tale of Kummasapinda, this is stated directly: "wise men of old gave gruel without salt or oil to paccekabuddhas, and owing to that attained in their next birth the glory of being kings in Kasi, three hundred leagues in extent."'
related: []
evokes: [jataka, sattanipata, kummasapinda-jataka, disproportionate-return-on-a-small-gift, merit-multiplier]
lineage:
  - source: primary
    text: jataka-chalmers1895-kummasapinda-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 415, Kummasapinda-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "wise men of old gave gruel without salt or oil to paccekabuddhas, and owing to that attained in their next birth the glory of being kings in Kasi, three hundred leagues in extent"
canonical-instances:
  - "A retired teacher who spent thirty years giving a few minutes of genuine attention to struggling students, never expecting anything in return, is later credited by one of them — now a public figure — as the single reason they stayed in school at all."
critical-questions:
  - "Is the reward here actually caused by the gift's sincerity, or does the story retrofit a modest good deed with an oversized explanation for an unrelated later success?"
  - "Does framing generosity as an investment with disproportionate future returns change the nature of the giving itself, even when the giver has no such calculation in mind?"
status: active
