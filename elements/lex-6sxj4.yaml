id: lex-6sxj4
name: divergence-among-self-report-body-and-behavior-is-data-not-error
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When someone's account of their own state, their body's signal, and what an outside observer sees don't line up, resist both the urge to average them and the urge to crown one as the real answer. None of the three is a privileged readout: self-report is narrative-prone, bodily signal is unlabelled and often inaccurately read even by its owner, outside observation lacks interior context. Ask instead what the specific pattern of disagreement rules out, and whether the channels are diverging at a moment (discordance) or drifting apart over time (desynchrony) — those imply different things. Lang's original framing is the discipline: none of the three systems is held to be primary or to hold a special controlling relationship to the others."
related: [lex-cpjma, lex-yh672, lex-e2yxr, lex-ngas3, lex-uhbgy]
scaffolds-from: [lex-cpjma, lex-yh672]
evokes: [self-report-vs-behavior-gap, interoceptive-dissociation, attitude-behavior-gap, discordance-not-error, no-privileged-channel, believing-you-know-your-body, three-systems-verbal-overt-motor-somatic]
lineage:
  - source: primary
    text: lang-1968-three-systems-none-primary
    citation: "Peter J. Lang, 'Fear Reduction and Fear Behavior: Problems in Treating a Construct,' in Research in Psychotherapy Vol. III, ed. John M. Shlien (American Psychological Association, 1968), pp. 90-102; DOI 10.1037/10546-004. PDF on shelf, verbatim 2026-07-23. The origin of the three-systems model that Rachman & Hodgson 1974 borrow. Lang's claim is not merely that fear has three measurable channels but that NONE of them is privileged — which is this atom's central posture, stated at the source rather than reconstructed from downstream users."
    quote: "[Lang 1968, p.90]: 'It was assumed that fear is a response, and further that it is a response expressed in three main behavioral systems: verbal (cognitive), overt-motor, and somatic. For the purposes of measurement, none of these systems is held to be primary or to hold a special controlling relationship to the others.' [p.91, on the measured divergence]: 'the correlation between different measures proved to be surprisingly low... the relationship between change in one measure and change in another measure, whether or not it is a function of therapy, are indifferently correlated.' [p.91, summary]: 'while the phenomenal experience of fear invites us to think of it as a unitary feeling and thus a correlated set of similarly determined responses, the measurement of fear relevant behavior invites an opposite conclusion. Different measures produce different estimates of fear intensity. Furthermore, different variables apparently control different aspects...' [p.91, on physiology specifically]: 'the failure of autonomic activity to relate in a direct way to verbal or overt-motor measures of emotion-or change in psychotherapy-has already been abundantly documented at a previous conference (Lacey, 1959).'"
  - source: primary
    text: garfinkel-seth-barrett-suzuki-critchley-2015-interoceptive-dimensions
    citation: "Sarah N. Garfinkel, Anil K. Seth, Adam B. Barrett, Keisuke Suzuki, and Hugo D. Critchley, 'Knowing your own heart: Distinguishing interoceptive accuracy from interoceptive awareness,' Biological Psychology 104 (2015), pp. 65-74. CC BY-NC-ND; via the authors' institutional repository, verbatim 2026-07-23. Establishes the divergence OUTSIDE the emotion frame: three dimensions of bodily self-knowledge dissociate in a normative sample of 80."
    quote: "[Garfinkel et al. 2015, abstract]: 'Here, we provide empirical support for dissociation between dimensions of: (1) interoceptive accuracy (performance on objective behavioural tests of heartbeat detection), (2) interoceptive sensibility (self-evaluated assessment of subjective interoception, gauged using interviews/questionnaires) and (3) interoceptive awareness (metacognitive awareness of interoceptive accuracy, e.g. confidence-accuracy correspondence).' [Discussion]: 'It is noteworthy that interoceptive awareness was independent of (i.e. did not predict) interoceptive sensibility.' [Discussion, on the self-report/objective gap]: 'questionnaire ratings of interoceptive sensibility and interoceptive accuracy... tend not to be strongly correlated with actual (experimentally measured) heartbeat awareness, such that a preoccupation with internal bodily sensations and a belief in one's own interoceptive accuracy does not necessary predict actual interoceptive ability.'"
  - source: primary
    text: lapiere-1934-attitudes-vs-actions
    citation: "Richard T. LaPiere, 'Attitudes vs. Actions,' Social Forces 13(2) (December 1934), pp. 230-237. PDF on shelf is a re-typeset copy (Penn State course reserve), so pagination does not match the journal. The classic self-report-versus-observed-behavior divergence, outside emotion entirely. Carries a substantial and well-known methodological critique — see critical-questions; the figure is cited here for the SHAPE of the divergence, not as a clean effect size."
    quote: "[LaPiere 1934, opening]: 'But by derivation social attitudes are seldom more than a verbal response to a symbolic situation. For the conventional method of measuring social attitudes is to ask questions (usually in writing) which demand a verbal adjustment to an entirely symbolic situation.' [on the observed behavior]: 'The one instance in which we were refused accommodations is worth recording here.' [on the questionnaire responses to the same establishments]: 'With persistence, completed replies were obtained from 128 of the establishments we had visited; 81 restaurants and cafes and 47 hotels, auto-camps, and \"Tourist Homes.\" In response to the relevant question 92 per cent of the former and 91 per cent of the latter replied \"No.\"'"
  - source: primary
    text: hodgson-rachman-1974-desynchrony-conditions
    citation: "R. Hodgson and S. Rachman, 'II. Desynchrony in Measures of Fear,' Behaviour Research and Therapy 12 (1974), pp. 319-326. The companion paper, and the one that says WHEN to expect divergence rather than just naming it. Five named conditions, which is what turns the atom from a caution into something predictive."
    quote: "[Hodgson & Rachman 1974, p.325, conclusion]: 'We suggested that concordance or desynchrony between response systems is a function of the intensity of emotional arousal. level of demand. therapeutic technique. length of follow-up and the specific physiological system which is measured.' [p.319, on weak states]: quoting Lang (1971), 'So-called mild feeling states may involve no more than the verbal report. and we might find little specific activity in the autonomic or behavioural sphere . . . the verbal behaviour of a human being is capable of reflecting gradations of affect, to which the cruder autonomic system may be completely insensitive'. [p.320, on intensity]: 'it is likely that intense emotions are associated with greater concordance than are weak emotions.' [p.321, on demand]: 'These results support our hypothesis that a high level of demand partially uncouples the behavioural response system from the other response systems.' [sentence-medial periods appear as printed in the source, likely commas in the original]"
  - source: primary
    text: rachman-hodgson-1974-synchrony-desynchrony
    citation: "S. Rachman and R. Hodgson, 'I. Synchrony and Desynchrony in Fear and Avoidance,' Behaviour Research and Therapy 12 (1974), pp. 311-318. Supplies this atom's two-axis vocabulary: concordance/discordance for agreement at a point, synchrony/desynchrony for whether channels move together over time. Defined over fear and avoidance (two components); the three-channel form comes from Lang 1968, above, whom they credit."
    quote: "[Rachman & Hodgson 1974, p.311]: 'when fear and avoidance are not co-varying. one can speak of a discordance between the two at any particular point: when there is a high correlation between the two then one has concordance. The terms synchrony and de-synchrony have a similar but not identical meaning to that of concordance and discordance. It is suggested that synchrony and de-synchrony should be restricted to [changes] in fear and avoidance which either vary together (synchrony) or vary independently or inversely (in both of these cases. one has de-synchrony).' [bracketed word reconstructed from a damaged span in the source]"
canonical-instances:
  - "Garfinkel et al. 2015 (N=80): believing you are attuned to your body does not predict being able to count your own heartbeats. Self-rated interoceptive sensibility and objectively measured interoceptive accuracy come apart, and metacognitive awareness is independent of sensibility again — so 'I'm very in touch with my body' and 'I can actually read my body' are separate claims that must be evidenced separately."
  - "LaPiere 1934: travelling with a Chinese couple, LaPiere was refused service at one establishment out of roughly 250 visited; months later, questionnaires to the same establishments asking 'Will you accept members of the Chinese race as guests in your establishment?' returned 92 per cent 'No.' Stated attitude and observed behavior did not merely differ in degree — they pointed opposite ways."
  - "the therapy-room case the atom was surfaced from: a person's narrated account of why they made a choice, the somatic register they notice while telling it, and how the same episode looks to someone who was in the room can all diverge. The move is not to pick the 'honest' one but to ask what the specific mismatch rules out — a narrative that has drifted from the felt sense implicates lex-yh672; a felt sense with no behavioral trace implicates something else."
  - "operationally distinct from lex-cpjma triangulation-of-independent-methods: triangulation treats multiple channels as a CONVERGENCE instrument — agreement raises confidence, and disagreement is a problem to be resolved by finding which method failed. This atom takes the disagreement as the object of study. lex-cpjma's own critical-questions list poses exactly this ('can the disagreement be diagnostic?') and leaves it open; this atom is the answer to that question, so the two compose rather than compete."
  - "operationally distinct from lex-yh672 left-brain-interpreter-constructs-causal-narrative-without-access-to-actual-cause: lex-yh672 is a claim about ONE channel — self-report is a post-hoc construction rather than privileged access. That explains why self-report can be wrong; it does not by itself say what to do when three channels disagree, and it implicitly grants the other channels a truth-status this atom denies them. lex-yh672 is a defeater FOR one channel; this atom is a posture toward the whole set."
  - "operationally distinct from lex-e2yxr gesture-speech-mismatch-signals-readiness-to-learn: Goldin-Meadow's mismatch is the same mismatch-as-datum shape but reads a SPECIFIC mismatch (hand vs speech) as a SPECIFIC signal (this learner is ready for instruction). This atom is the general form and deliberately does not claim a fixed interpretation — it says read the pattern, not that every divergence means one thing. lex-e2yxr is the best-worked instance of what this atom describes generally."
  - "operationally distinct from lex-uhbgy emotion-response-systems-couple-loosely-with-physiology-loosest: lex-uhbgy is the emotion-domain measurement finding with a specific directional claim (physiology is the loose channel). This atom is the general posture, holds no ordering among channels, and draws on non-emotion evidence (interoception, social attitudes). lex-uhbgy is the strongest single instance of this atom; this atom is what survives when you leave the emotion literature."
critical-questions:
  - "how bad is the LaPiere evidence, really? Substantial known critique: there is no verification that the person answering the questionnaire was the person who provided service; the couple travelled accompanied by LaPiere, a white professor, which changes the encounter; the questionnaire's 'members of the Chinese race' invited a stereotype that the actual well-dressed couple did not match; and the six-month gap is uncontrolled. The 92 per cent figure should never be cited bare as an effect size. The finding survives as a DEMONSTRATION that stated and enacted disposition can point opposite ways — which is all this atom needs it for."
  - "are the channels actually measuring the same underlying state? This is the strongest deflationary reading and it must be taken seriously: if self-report, physiology, and behavior are simply about different things, then 'divergence' is a category error rather than a finding. Garfinkel et al. address it directly — their objective heartbeat-tracking and heartbeat-discrimination tasks correlated with each other, establishing they measure a shared construct, while the awareness measures derived from each did not. Demand that kind of within-channel convergence before treating between-channel divergence as meaningful."
  - "is divergence even expected here? Hodgson & Rachman name five conditions that govern it: intensity of arousal, level of demand, technique applied, length of follow-up, and which physiological measure was taken. Two are directly actionable — WEAK states diverge more than intense ones (a mild feeling may exist as verbal report only, with nothing autonomic to find), and HIGH DEMAND uncouples the channels (someone who knows what answer is wanted produces it in the channel they control). Before reading a divergence as informative about the person, check whether the situation was low-intensity or high-demand enough to produce it mechanically."
  - "the intensity prediction has mixed support and should not be stated as settled. Hodgson & Rachman predicted intense emotion produces greater concordance; Mauss et al. 2005 found exactly that for amusement (coherence rose with intensity) but NOT for sadness (no such relationship). One confirmation and one disconfirmation across two emotions means intensity is a real moderator, not a reliable rule."
  - "is this being used to dismiss someone's self-report? The failure mode is using 'your body says otherwise' or 'that's not what I observed' to overrule a person's own account, which inverts the atom into exactly the privileged-channel move it rejects. No channel outranks the others by default; the atom licenses holding the disagreement open, not resolving it against the speaker."
  - "discordance at a point, or desynchrony over time? Rachman & Hodgson's distinction does real work: channels disagreeing at one moment is common and weakly informative, whereas channels that drift apart across a course of treatment or a course of change implicates the mechanism differently. The two demand different evidence — a snapshot versus a series — and conflating them lets a single measurement stand in for a trajectory."
  - "does the three-system carve match the channels you actually have? Lang's systems are verbal (cognitive), overt-motor, and somatic — a person's SPOKEN account, their observable action, and their bodily state. An outside observer's report is evidence about the overt-motor channel, not a fourth channel, and it carries its own error. Don't silently promote 'what the observer concluded' into 'what the behavior was.'"
  - "Lang's no-privileged-channel claim was made for measurement purposes within fear research. Does it hold where one channel has a genuine accuracy advantage? Garfinkel et al.'s objective heartbeat tasks ARE more accurate than self-rated sensibility about heartbeats — so for that specific question the channels are not symmetric. The atom's posture is a default to start from, not a proof that no channel can ever be shown better for a given claim."
status: active
