lineage:
  - source: primary
    text: prahalad-hamel-1990-manufacturing-share-versus-brand-share
    citation: "C.K. Prahalad and Gary Hamel, 'The Core Competence of the Corporation,' Harvard Business Review, May-June 1990, section 'From Core Competencies to Core Products,' p.83. Verified verbatim 2026-09-05 against the primary HBR reprint (the copy previously pinned to this citation was a 2017 Macat International study-guide analysis, not the article itself)."
    quote: "'Canon is reputed to have an 84% world manufacturing share in desktop laser printer 'engines,' even though its brand share in the laser printer business is minuscule. Similarly, Matsushita has a world manufacturing share of about 45% in key VCR components, far in excess of its brand share (Panasonic, JVC, and others) of 20%. And Matsushita has a commanding core product share in compressors worldwide, estimated at 40%, even though its brand share in both the air-conditioning and refrigerator businesses is quite small.'"
canonical-instances:
  - "Canon holding an estimated 84% world manufacturing share of desktop laser-printer 'engines' while its own brand share of finished laser printers is minuscule — the company that seems marginal by brand share actually controls most of the category's underlying production."
  - "Matsushita commanding roughly 40% of world compressor manufacturing share even though its air-conditioning and refrigerator brand shares are small — the branded competitors in that market are more dependent on Matsushita than their own market position suggests."
  - "a startup ecosystem where a handful of consumer-app brands compete visibly for public attention while a single infrastructure or payments provider captures disproportionate value from most of the transactions running through all of them."
critical-questions:
  - "isn't brand share still the metric that ultimately matters for revenue and consumer relationships? Brand share matters for a specific kind of value capture (customer relationship, pricing power at retail), but the atom's claim is narrower: brand share is an unreliable PROXY for underlying competitive strength or capability, because a company can rationally choose to dominate the component layer instead of the brand layer (as JVC did in VCRs) and still hold the real leverage in the market."
  - "how is this different from lex-68abd map-not-territory? lex-68abd is the general epistemic caution that any model or representation necessarily omits some of the reality it describes, and the omissions may or may not be decision-relevant. This atom is a SPECIFIC, business-strategy instance of that caution: it names exactly which map (end-market brand share) and which territory (manufacturing/component share) diverge, and gives the specific structural reason for the divergence (upstream suppliers can rationally prioritize the invisible metric). lex-72yj6 is what lex-68abd looks like when applied to competitive-position measurement in an industry with layered supply chains."
  - "does this mean brand share is always the misleading metric and component share the true one? No — the direction of concealment can run either way. A company with high brand share but low manufacturing share (an assembler with a thin insourced base) may look strong while its actual production is fragile and rival-dependent. The diagnostic isn't 'trust component share over brand share' — it's 'check both, because a company can rationally optimize one while looking weak on the other.'"
