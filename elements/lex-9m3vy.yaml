id: lex-9m3vy
name: catuskoti-schema
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a question seems to demand yes-or-no but neither fits, try the catuskoti: yes, no, both, neither. Madhyamaka logic admits all four positions; the right answer may be 'both' or 'neither' when reality straddles or escapes the dichotomy."
related: [lex-75r77, lex-nahg9, lex-68abd, lex-x6sbv, lex-rfxtb, lex-m2cwp, lex-fpvsu]
scaffolds-from: [lex-x6sbv]
evokes: [four-cornered-logic, assert-deny-both-neither, madhyamaka-position-schema, view-free, refuse-the-binary-as-fifth-move]
formal-if-any: "{assert(p), ¬assert(p), assert(p) ∧ assert(¬p), ¬assert(p) ∧ ¬assert(¬p)}"
lineage:
  - source: primary
    tradition: madhyamaka
    text: nagarjuna-mmk-18-8
    citation: "Nāgārjuna, Mūlamadhyamakakārikā 18.8 — the catuṣkoṭi schema (four corners: assert / deny / both / neither). Sanskrit canonical text c. 2nd century CE, preserved through the Tibetan canon (Tengyur), Chinese canon (Taishō 1564), and Sanskrit transmission via Candrakīrti's Prasannapadā. Principle-8(b) externally-cross-attested graduation: graduates via (i) canonical preservation across three independent textual traditions; (ii) multiple independent critical Sanskrit editions across 100+ years (La Vallée Poussin 1903-13 Madhyamakavṛtti, de Jong 1977 Adyar, Ye Shaoyong 2011 Mūlamadhyamakakārikā Sanskrit critical edition); (iii) 60+ years of stable scholarly translations and commentaries (Streng 1967, Garfield 1995, Westerhoff 2009, Siderits-Katsura 2013); (iv) extensive analytic-philosophy treatment of the catuṣkoṭi as a non-classical-logic structure (Priest 2010 'The Logic of the Catuskoti' *Comparative Philosophy*; Garfield-Priest 2003 'Nāgārjuna and the Limits of Thought' *Philosophy East and West*). The verbatim below is from Garfield 1995 (Oxford UP); the Sanskrit is from the standard critical edition transmitted through La Vallée Poussin and de Jong. The companion atom lex-75r77 two-truths (MMK 24.8-10) graduates ia the same 8(b) cross-attestation chain — the two atoms are decomposable parts of the Madhyamaka method."
    quote: "[Sanskrit, MMK 18.8, La Vallée Poussin/de Jong critical edition:] sarvaṃ tathyaṃ na vā tathyaṃ tathyaṃ cātathyam eva ca | naivātathyaṃ naiva tathyam etad buddhānuśāsanam || 18.8 || [English, Garfield 1995 p.250, Oxford UP:] 18.8 Everything is real and is not real, / Both real and not real, / Neither real nor not real. / This is Lord Buddha's teaching. [The four corners enumerated: (1) sarvaṃ tathyaṃ — everything is real (assert); (2) na vā tathyaṃ — or not real (deny); (3) tathyaṃ cātathyam eva ca — both real and not real (both); (4) naivātathyaṃ naiva tathyam — neither real nor not real (neither).]"
  - source: practitioner
    text: garfield-1995-fundamental-wisdom-of-the-middle-way
    citation: "Jay L. Garfield, The Fundamental Wisdom of the Middle Way: Nāgārjuna's Mūlamadhyamakakārikā (Oxford University Press 1995). The most-widely-cited English-language translation; Garfield's Ch.18 commentary (pp.245-256) reads the catuṣkoṭi as the systematic structure of Madhyamaka non-positioning. Tier-3 deepening source; the verified Sanskrit + Garfield verbatim above is critical. Garfield-Priest 2003 'Nāgārjuna and the Limits of Thought' (Philosophy East and West 53.1:1-21) is the analytic-philosophy follow-up giving the catuṣkoṭi a formal paraconsistent-logic treatment."
    quote: "[Tier-3 deepening source; the verbatim entry above carries the pivotal translation of MMK 18.8. Garfield's commentary pp.250-253 unpacks: 'The fourfold structure is not arbitrary — it exhausts the logical space of positions one can take regarding any proposition, and Nāgārjuna's claim is that Madhyamaka practice ultimately moves beyond all four to a non-positioning stance. The catuṣkoṭi is both the map and the warning that the map's structure is itself transcendable.']"
  - source: practitioner
    text: streng-1967-emptiness
    citation: "Frederick J. Streng, Emptiness: A Study in Religious Meaning (Abingdon Press 1967). The first major Western critical-scholarly study of Madhyamaka in English; Streng's treatment of MMK 18.8 establishes the catuṣkoṭi as a systematic dialectical instrument rather than a paradox. Tier-3 deepening source — the foundational secondary text; 60-year reception confirms the catuṣkoṭi as the stable interpretive frame across the Madhyamaka literature."
    quote: "[Tier-3 deepening source; the cross-attestation chain Streng 1967 → Garfield 1995 → Westerhoff 2009 → Siderits-Katsura 2013 establishes the catuṣkoṭi as multiply-attested across independent stable secondary literature spanning 60+ years and at least three distinct interpretive frameworks (religious-studies-comparative, Tibetan-influenced philosophical, analytic-philosophy/paraconsistent-logic).]"
  - source: practitioner
    text: westerhoff-2009-nagarjunas-madhyamaka
    citation: "Jan Westerhoff, Nāgārjuna's Madhyamaka: A Philosophical Introduction (Oxford University Press 2009). The current analytic-philosophy reference; Westerhoff's Ch.4 (pp.67-90) treats the catuṣkoṭi via formal-philosophical analysis of negation-types (paryudāsa vs prasajya — implicative vs non-implicative negation). The fourth corner ('neither') is read as non-implicative-negation, refusing the assert/deny binary entirely. Tier-3 deepening source; completes the principle-8(b) cross-attestation across three interpretive frames."
    quote: "[Tier-3 deepening source; the formal-philosophical treatment confirms the catuṣkoṭi's key structural feature — corner-4 (neither) is operationally distinct from corner-2 (deny) because it refuses the assert/deny framing rather than answering negatively within it. This distinction is what makes the schema substrate-worthy rather than redundant with bivalent logic.]"
  - source: practitioner
    text: priest-2010-logic-of-catuskoti
    citation: "Graham Priest, 'The Logic of the Catuskoti,' Comparative Philosophy 1.2:24-54 (2010). The analytic-paraconsistent-logic treatment, formalizing the catuṣkoṭi as a four-valued logic (FDE-like). Tier-3 deepening source; the principle-8(b) basis is strengthened by Priest's independent formal treatment converging on the same operational structure. Garfield-Priest 2003 (Philosophy East and West 53.1:1-21) is the predecessor jointly-authored paper that established the analytic-Madhyamaka cross-tradition synthesis."
    quote: "[Tier-3 deepening source; the formal paraconsistent-logic treatment is an independent fourth attestation that converges on the same essential structure. The four-valued semantic preserves the catuṣkoṭi's distinct fourth-corner (neither) without collapsing it into double-negation.]"
canonical-instances:
  - "position-1 (assert): treating p as asserted, before considering its negation, conjunction with negation, or rejection-of-binary"
  - "position-2 (deny): treating ¬p as asserted; distinct from position-4 because still operating within the assert/deny binary (e.g., 'the answer is no' vs 'the question is malformed')"
  - "position-3 (both): assert(p) ∧ assert(¬p) — operationally meaningful when a claim has multiple aspects and is true on one reading, false on another (Nāgārjuna's analysis of motion: 'the goer is going' is both affirmable and deniable depending on whether you index the goer or the going)"
  - "position-4 (neither): ¬assert(p) ∧ ¬assert(¬p) — refuses the assert/deny binary entirely; the apophatic / via-negativa stance toward ultimate-reality questions; distinct from position-2 because it rejects the framing rather than answering negatively. Westerhoff 2009 reads this as prasajya-pratiṣedha (non-implicative negation) vs the implicative paryudāsa negation of corner-2."
  - "the schema-as-stance: knowing all four positions are available is itself a posture toward claims — refuses pre-commitment to assert-or-deny, makes both-and-neither into legible options"
  - "engineering example (position-3 both): 'is this codebase good?' — assert (the team can ship features in it, business value flows) AND deny (every refactor reveals technical debt and structural hostility). Both true at different indexing dimensions. Position-3 surfaces this without forcing a false single-claim verdict."
  - "engineering example (position-4 neither): 'is the user emotionally engaged with this feature?' — neither assert (no measurable engagement signal) nor deny (no measurable disengagement signal) because the measurement-frame itself is mis-aligned with the construct. Position-4 surfaces that the question's framing is the problem, not the answer."
  - "compositional move with lex-75r77 two-truths: a claim's truth-value can take any of the four catuṣkoṭi positions AT EACH OF the two truth-layers. 'The self exists' takes position-1 at the conventional layer and position-2 at the ultimate layer in classical Madhyamaka. The product (4 positions × 2 layers = 8 cells) is the full Madhyamaka analytical surface."
  - "operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition: lex-mnxhs dissolves contradiction by axis-separation (the wall is thin AND thick along different operational axes). Catuṣkoṭi preserves the contradiction-shape as an analytic option (position-3 both). Adjacent but distinct: lex-mnxhs makes contradiction go away; catuṣkoṭi makes contradiction tractable as a structured stance."
  - "foundational critical question: when does corner-4 (neither) collapse into corner-2 (deny)? If the practitioner conflates non-implicative-negation (prasajya: 'the question doesn't apply') with implicative-negation (paryudāsa: 'no, ¬p'), corner-4 loses its discriminating power. The discipline: distinguish 'the claim is false' from 'the claim is mis-framed.' Westerhoff 2009 Ch.4 names this as the key training-discipline."
  - "decisive edge case: the dialetheist reading (Priest 2010): position-3 (both) admits TRUE contradictions, not just appearances-of-contradiction. Classical Madhyamaka readers (Streng 1967, Garfield 1995) avoid this; analytic-paraconsistent readers (Priest 2010, Garfield-Priest 2003) embrace it. The substrate atom is agnostic on this — both readings preserve the four-position structure; the metaphysical question of whether corner-3 is real-contradiction or apparent-contradiction is downstream of the schema's operational use."
critical-questions:
  - "is the four-corner (true / false / both / neither) actually open in this domain, or is one or more corner ruled out by structure?"
  - "are you reaching for catuskoti because the binary feels wrong, or because the four-fold actually captures something? these have different remedies"
  - "is the 'neither' corner the resolution or just a polite escape from having to decide?"
  - "what does the choice between the four tell you about the system you're describing — beyond the surface answer?"
status: active
