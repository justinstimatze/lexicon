id: lex-dyxk3
name: irrelevant-alternatives-can-flip-a-ranked-vote
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before trusting a ranked-choice scoring method (marks for first place, fewer for second, and so on, summed across voters) to reflect only the head-to-head standing of your top two options, check what happens to their score gap when a third, already-losing option moves around in the rankings. Sen walks through the exact case: with x and z tied at 7 marks each under a points-based scoring rule, one voter reshuffles only where the third option y sits -- moving it below both x and z, where it was already going to lose either way. Sen: “This change keeps the total score of x unchanged, but z gets one more mark, scoring 8, and now defeats x with its score of 7. While everyone's ordering of x and z are still the same, the social choice between x and z is not the same, and this of course violates condition I.” Nobody changed their mind about x versus z. The only thing that moved was where an also-ran sat beneath them, and that alone flipped which one wins. Diagnostic move: before trusting a points-based aggregation method to reflect the real preference between your top contenders, check whether an option nobody's actually choosing between the leaders can still move points around underneath them and change who wins -- if it can, the ranking between your real contenders isn't as settled as the point totals make it look."
related: [lex-37m5b]
evokes: [sen-collective-choice-and-social-welfare-chapter-3-collective-rationality, independence-of-irrelevant-alternatives, rank-order-voting-method, borda-count-manipulation, condition-i]
lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 3 'Collective Rationality,' Section 3.4 'A Comment on the Significance of Arrow's Results,' p.82."
    quote: "“However, it does not pass condition I. Consider the following simple example: Let individual 1 prefer x to y and that to z, whereas individuals 2 and 3 prefer z to x and that to y. With the method of marking outlined, x receives 7 marks and so does z, and the outcome is a tie between the two. Now, consider a second case when everyone's ranking of x vis-a-vis z remains the same, but individual 1 changes his mind about an irrelevant alternative, viz., y, and decides that it is worse than both x and z. This change keeps the total score of x unchanged, but z gets one more mark, scoring 8, and now defeats x with its score of 7. While everyone's ordering of x and z are still the same, the social choice between x and z is not the same, and this of course violates condition I.”"
canonical-instances:
  - "Hypothetical: A hiring committee scores three finalists on a points system: 3 for a first-place rank on each interviewer's ballot, 2 for second, 1 for third. Two finalists are tied. One interviewer, who never had those two anywhere but tied for the top slot, revises only where the clearly-weakest third candidate ranks on their ballot -- and the points shift enough to break the tie between the two finalists who were never in question."
  - "Hypothetical: A product team ranks three feature proposals by weighted votes. Feature A and Feature B are neck and neck. Nobody's opinion of A versus B changes all sprint, but as Feature C -- already the least popular by a wide margin -- keeps sliding further down individual ballots, its vanishing points tip the totals and Feature A overtakes Feature B, with not one vote actually cast between A and B differently than before."
critical-questions:
  - "Isn't this just a quirk of one particular scoring method -- does the vulnerability generalize past marks-for-rank voting? Arrow's theorem says yes: every rule that produces a complete ranking from individual preferences and satisfies the other three conditions has to give up independence of irrelevant alternatives somewhere. The rank-order method makes the failure easy to see with small numbers; the same trade is being made, less visibly, in less transparent methods."
  - "If a third option can always be found to swing the top two, isn't every points-based ranking meaningless? Not meaningless -- just not independent of the full ballot. The point totals still reflect something real about aggregate preference; what they don't reflect is a stable head-to-head verdict on your top two that survives changes elsewhere on the ballot, which is a narrower and more useful thing to know before relying on the score."
