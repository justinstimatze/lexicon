id: lex-v5v63
name: manipulate-a-cheap-copy-instead-of-the-fragile-or-costly-original
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When measuring, inspecting, or working with an object is difficult because the object itself is expensive, fragile, dangerous, or hard to access, check whether a cheap representation of it — a photograph, a scaled model, a recording — can be substituted for the object in the actual work, so the original never has to be touched, moved, or risked at all. Altshuller names this the Copying Principle: 'a. Instead of an unavailable, complicated, expensive, inconvenient or fragile object a simplified and cheap copy is used. b. Replace an object or system of objects by their optical copies (depictions). Make use of scale in so doing (scale the copies down or up). c. If visible optical copies are used, switch to infra-red or ultra-violet copies.' He applies this later in the book to a genuinely tricky measurement problem: checking the interior dimensions of a large hollow metal cone by physically fitting a series of graduated moulds inside it — accurate, but slow and laborious, since 'the more moulds the greater the accuracy of the measurement... each measurement takes a lot of time and trouble.' Rather than hunting for a faster way to fit real moulds into the real cone, the fix drops the physical measurement instrument for a photographic copy: fill the cone incrementally with water, photographing the waterline's silhouette at each level against the cone's rim, producing 'a series of concentric circumferences which can easily be compared with the circumferences on the standard photograph' — the actual measurement and comparison happen entirely on photographs, never on the physical cone itself past the initial water-filling step. The underlying logic: once a faithful, cheap, and freely re-examinable copy exists, all the fiddly comparison, iteration, and precision work can move onto the copy, where mistakes cost nothing and speed is unconstrained by the original's fragility or unwieldiness. Diagnostic move: when a task requires repeatedly handling, testing, or comparing against something costly, fragile, one-of-a-kind, or hard to access, ask whether a faithful but cheap copy (a photograph, a scan, a scale model, a recorded measurement) could stand in for the original during the actual iterative work — reserving direct contact with the real object for the single, minimal step needed to produce the copy in the first place."
related: [lex-mmkhh, lex-aj89z]
evokes: [copying-principle, hollow-cone-water-photograph-measurement, proxy-instead-of-original, scale-model-substitution]
lineage:
  - source: primary
    text: altshuller-1984-principle-26-copying
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.5 'Forty Basic Methods,' Principle 26 'The Copying Principle.'"
    quote: "'26. The Copying Principle. a. Instead of an unavailable, complicated, expensive, inconvenient or fragile object a simplified and cheap copy is used. b. Replace an object or system of objects by their optical copies (depictions). Make use of scale in so doing (scale the copies down or up). c. If visible optical copies are used, switch to infra-red or ultra-violet copies.'"
  - source: primary
    text: altshuller-1984-cone-measurement-via-photograph
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.5, section 'How to Use the Methods.'"
    quote: "'The first method, however (26), proffers a radical change to a known method. No templates are needed, and we shall measure not the cone itself but a copy of it, depictions, photographs... The cone is placed in a bath, water is poured in to a certain level and the level of that located above this level is fixed with camera. Then water is added to the next level, and again it is photographed on the same plate. As a result the plate shows series of concentric circumferences which can easily be compared with the circumferences on the standard photograph.'"
canonical-instances:
  - "A museum wants researchers to be able to closely study a fragile ancient manuscript's handwriting without repeatedly handling the physical pages; a high-resolution scan lets researchers zoom, annotate, and compare freely on the copy, with the original touched only once, briefly, to produce the scan."
  - "An engineering team needs to test many structural load scenarios on an expensive, one-of-a-kind physical prototype; instead of stressing the real prototype repeatedly, they build a detailed digital 3D model and run the iterative load tests against the simulated copy, reserving the physical prototype for a final confirming test."
  - "operationally distinct from lex-mmkhh buffer-an-unwanted-interaction-with-a-variant-of-a-substance-already-present: that atom inserts a buffer BETWEEN two already-interacting elements to neutralize an unwanted interaction; this atom substitutes a REPRESENTATION for one interacting element ENTIRELY, so the real object never participates in the interaction (the measurement, the handling, the testing) at all."
critical-questions:
  - "how faithful does the copy actually need to be, and what's the risk of an infidelity in the copy propagating into a wrong conclusion about the original — the cone-measurement technique depends on the photograph accurately capturing the waterline's true circumference; what would a systematic photographic distortion do to the result?"
  - "does working exclusively on the copy risk losing information the original alone carries — a manuscript's ink texture, a material's exact surface feel, a physical object's real-world tolerances — that no representation (however high-resolution) actually preserves?"
  - "at what point does producing a sufficiently faithful copy become as expensive or risky as working with the original directly, undermining the whole rationale for substituting a copy in the first place?"
status: active
