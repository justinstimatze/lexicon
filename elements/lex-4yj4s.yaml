evokes: [the-one-spur-wisdom-of-paddy, one-side-of-the-horse-carries-the-other, doing-right-from-selfish-motives, trusting-the-coupling-not-the-motive]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch12-one-spur-wisdom
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XII, 'Hope for the Nation.'"
    quote: "“For my own part, I took the proclamation, first and last, for a little more than it purported; and saw in its spirit, a life and power far beyond its letter. Its meaning to me was the entire abolition of slavery, wherever the evil could be reached by the Federal arm, and I saw that its moral power would extend much further. It was in my estimation an immense gain to have the war for the Union committed to the extinction of Slavery, even from a military necessity. It is not a bad thing to have individuals or nations do right though they do so from selfish motives. I approved the one-spur-wisdom of ‘Paddy’ who thought if he could get one side of his horse to go, he could trust the speed of the other side.”"
canonical-instances:
  - "The direct textual anchor: Douglass explicitly separates the proclamation's motive (military necessity, a selfish rather than moral motive on the government's part) from its trusted downstream effect (moral power extending far beyond its narrow military letter) -- the coupling argument is doing the work of justifying acceptance despite the impure motive, not despite the partial scope alone."
  - "Hypothetical: a company adopts an accessibility feature purely to avoid a lawsuit, with no stated commitment to disabled users beyond the legal minimum. An advocate inside the company argues for accepting this narrow, legally-motivated win rather than holding out for a values-driven commitment, betting that once the feature exists and users rely on it, the coupled system of user expectations and product roadmap will carry further accessibility improvements along on its own."
critical-questions:
  - "What determines whether two things are actually coupled tightly enough for this bet to pay off, versus merely adjacent -- a horse's two sides share one skeleton and can't move independently, but a war effort and a moral cause are only loosely and contingently linked, and history could have shown the war ending without slavery's full abolition following. What would a wrong bet on this coupling have looked like in Douglass's own case?"
  - "Does accepting the partial, selfishly-motivated version of an outcome ever weaken the pressure toward the fuller version, by removing the urgency that a still-unmet demand would have supplied -- could 'trusting the other side to follow' sometimes cause it not to, by satisfying just enough of the coalition that pushed for the whole?"
  - "Is this fundamentally the same claim as lex-xgt9j (judge-constrained-actors-by-feasible-not-ideal-frame), with Douglass here applying it to himself rather than to Lincoln, accepting the constrained partial outcome as the feasible move available instead of holding out for an unconstrained ideal? Or does the coupled-system mechanics add something further -- a specific causal claim about the parts actually being joined, testable and potentially false, beyond the simple observation that one part was all that could be gotten?"
