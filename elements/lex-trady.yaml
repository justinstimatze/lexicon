id: lex-trady
name: anticipatory-obedience-teaches-power-what-it-can-take
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Recognize this whenever a person, profession, or institution adjusts its own conduct to match what it GUESSES an emerging or newly-empowered authority will want, BEFORE that authority has actually issued the demand or acquired the legal means to compel it. Snyder's Lesson 1 claim (2017) is that this pre-emptive self-adjustment is not a passive symptom of authoritarian consolidation but one of its primary MECHANISMS: 'Most of the power of authoritarianism is freely given... A citizen who adapts in this way is teaching power what it can do.' The tyrant does not need to issue the order; a citizen, professional, or institution who anticipates the order and complies pre-emptively demonstrates to the emerging power what it can get away with, and hands over freedoms that were never actually demanded. Snyder's own case: after the German elections of 1932 and the Czechoslovak elections of 1946, the 'next crucial step' toward full regime change was not legal compulsion but anticipatory obedience by ordinary citizens and professionals who voluntarily extended their services to the new leaders before any law required it — 'the first heedless acts of conformity could not then be reversed.' His sharpest instance is Austria in March 1938: after the Anschluss, non-Nazi Austrian neighbors and professionals spontaneously joined in humiliating and dispossessing Jewish Austrians — forcing them to scrub streets, looting marked property — entirely ahead of any German directive to do so. That anticipatory obedience directly TAUGHT the Nazi leadership what was newly possible: Eichmann's Vienna emigration office opened months later, and the Kristallnacht pogrom that November explicitly followed the Austrian example. Snyder extends the same mechanism to actors already embedded in an institutional hierarchy — the SS in 1941 devising the operational methods of mass killing without being ordered to, 'guessing what their superiors wanted' and thereby demonstrating a possibility 'far more than Hitler had thought' — which is the point in his own text where he gestures toward Milgram's experiment as a further illustration that obedience of this general kind is not uniquely German. The corrective discipline Snyder offers is explicit and simple: notice the impulse to think ahead about what a more repressive power might want and to offer compliance before being asked, and REFUSE it — continuing to act exactly as one did before the shift in power is itself a form of resistance, not mere inertia. DISTINCTNESS: this atom is prior to and structurally distinct from lex-z9s5d obedience-to-authority (Milgram) — Milgram's subjects comply with an order an authority figure has ALREADY ISSUED and is actively present to reinforce (the scripted 'please continue' prods); Snyder's anticipatory-obedient actor adjusts conduct when NO order exists yet at all, guessing at an unstated future wish. The anticipation is the whole point; once an order is actually given, whatever follows is Milgram's mechanism, not this one. Distinct from lex-fbc4r (Browning, peer-bonded unit cohesion) — Browning's Reserve Police Battalion 101 men were already given an explicit order (and an explicit opt-out) at Józefów; the question there is why so few took the offered exit from an order already on the table. Anticipatory obedience precedes any order or opt-out point — it is what happens before the battalion is ever assembled and given instructions. Distinct from lex-fjzum (Lifton, doubling) — doubling is the self-organization split that lets someone ALREADY embedded in an atrocity-committing institutional role sustain that role over months or years without integrating it into their normal moral self; anticipatory obedience is typically the FIRST, entry-level act, often taken by people not yet embedded in any such role at all (ordinary shopkeepers, civil servants, neighbors). Distinct from lex-xj7s3 (preference falsification) — preference falsification conceals an EXISTING private belief under an ALREADY-ESTABLISHED, known social cost of disclosure; anticipatory obedience volunteers NEW compliant conduct in anticipation of a demand and a cost regime that do not yet exist and may never be formally articulated. Distinct from lex-zfxbw (panopticism/chilling effects) — panoptic self-monitoring operates under a KNOWN rule plus unverifiable observation of compliance with that rule; anticipatory obedience requires no surveillance apparatus or announced rule at all — the actor is guessing at the preferences of a power that has not yet articulated any rule to be watched for. Cross-domain applications beyond national politics: a company's legal or HR department pre-emptively adjusting hiring, speech, or personnel policy in anticipation of a new CEO's or a regulator's guessed wishes before any policy has actually been announced; a university pre-emptively narrowing what research or teaching it will support in anticipation of a funder's or administrator's assumed preferences; a platform over-correcting its moderation policy in anticipation of a regulation that has only been rumored, not proposed; an employee reshaping their visible conduct around a new manager's guessed tastes before the manager has said anything at all. In each case the diagnostic move is the same: ask whether the adjusting party is responding to an actual demand or to its own guess about a demand that hasn't been made — because in Snyder's account it is precisely the guessing-and-complying, not the demanding, that teaches power its own reach."
