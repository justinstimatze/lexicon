id: lex-uyk4w
name: a-chance-encountered-object-becomes-a-ready-made-image-of-virtue
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A natural object encountered by chance can be seized on immediately as a ready-made image of virtue-amid-corruption, without needing to stage or construct anything — the moral is already sitting there, waiting to be pointed at. In the Jataka''s tale of Kukku, a lotus growing in muddy water supplies this on the spot: "Friend, that lotus grown in the water stands undefiled by the water."'
related: []
evokes: [jataka, sattanipata, kukku-jataka, found-object-as-virtue-exemplar, unstaged-teaching-moment]
lineage:
  - source: primary
    text: jataka-chalmers1895-kukku-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 396, Kukku-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Friend, that lotus grown in the water stands undefiled by the water."
canonical-instances:
  - "Walking past a food stand that stays honest on a corner known for short-changing customers, a manager points it out to a new hire as the example of what integrity under pressure actually looks like, rather than reaching for a hypothetical."
critical-questions:
  - "Does relying on whatever happens to be at hand limit the lesson to whatever image is available, rather than the one that would actually land best?"
  - "Is the lotus-in-mud image doing real explanatory work here, or is it a culturally familiar symbol being invoked rather than examined?"
status: active
