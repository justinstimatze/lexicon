id: lex-5ftak
name: instruments-of-oppression-embed-its-logic-and-cannot-dismantle-it
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a proposal addresses a structural problem by using instruments — frameworks, vocabularies, procedures, metrics, institutional mechanisms — produced within the structure being addressed, surface the embedded-logic problem: those instruments carry the structure's constitutive assumptions, so wielding them can yield tactical wins on the structure's own terms but cannot produce structural transformation. The signature: 'beating him at his own game' is possible; dismantling the game by playing it is not. Watch for proposals that rely on rights-discourse to address structural-racism, market-mechanisms to address market-produced inequality, corporate-HR to address corporate-produced exclusion, academic-publication to elevate voices excluded from academia, platform-features to address platform-effects, etc. Tactical gains are real and sometimes worth pursuing; structural change requires different instruments — built from outside the structure's logic, often jointly across positions the structure marginalizes."
