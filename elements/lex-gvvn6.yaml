id: lex-gvvn6
name: specific-know-how-succeeds-where-reputation-based-strength-already-failed
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a problem resists everyone whose qualification is general strength or general competence, the fix that works may not need more of that same quality -- it may need one narrow piece of specific know-how that none of the strong candidates happened to possess. In Radin's Winnebago Trickster cycle, Trickster's penis has become lodged fast inside the chief's daughter, and the people first call on exactly the group whose reputation seems most relevant: 'the men who had the reputation for being strong were called and tried it but they, too, could not move it. Finally they all gave up.' Only then does someone think of a different kind of qualification entirely: 'There is an old woman around here who knows many things. Let us go and get her.' She does not pull, wrestle, or apply force at all. She takes an awl, and while working it in, sings a specific line: ''First-born, if it is you, pull it out! Pull it out!'' Immediately, 'in the midst of her singing, the penis was jerked out.' The strong men's failure was never a matter of insufficient strength; it was a wrong-shaped tool applied by the wrong kind of expert, and the actual fix required someone whose competence had nothing to do with strength at all. Diagnostic move: when a problem defeats everyone recruited for their strength or general capability, consider that the missing ingredient may be a specific, narrow piece of knowledge rather than more of the quality already being tried and failing."
related: []
