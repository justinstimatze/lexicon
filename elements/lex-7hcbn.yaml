id: lex-7hcbn
name: defending-a-category-by-eliminating-what-violates-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a classification system encounters something that contradicts its own definitions, one available response is to physically eliminate the offending case rather than revise the category or tolerate the anomaly -- the category stays intact not because it was accurate but because whatever disagreed with it no longer exists to disagree. Hyde, drawing on Mary Douglas, gives the minimal case: a cock is defined as a bird that crows at dawn; a cock that crows at night contradicts the definition; 'the existence of anomaly can be physically controlled ... . Take night-crowing cocks. If their necks are promptly wrung, they do not live to contradict the definition of a cock as a bird that crows at dawn.' Hyde extends the same logic past barnyard taxonomy to its human cost: 'we hardly need anthropology to help us find violence turned against the anomalous and out of place. Close at hand we have the whole grim twentieth-century history of \"ethnic cleansing,\" or the perennial attempts to keep homosexuals \"in their place,\" to remind us how order can become cruel in the name of its own imagined purity.' The mechanism is the same at both scales: the category was never actually tested against the case that violated it, because the case was removed instead of examined. Diagnostic move: when a system responds to a boundary-violating instance by eliminating, expelling, or silencing that instance rather than by investigating whether the boundary itself was wrong, treat the elimination as evidence about the system's tolerance for anomaly, not as evidence that the category was correct all along -- a definition defended by removing its counterexamples has been protected from revision, not confirmed by it."
