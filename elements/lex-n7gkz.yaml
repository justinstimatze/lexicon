canonical-instances:
  - "A junior product manager privately agonizes over whether it's their job to push back on a design decision that seems technically sound but ethically questionable, assuming their discomfort reflects inexperience — until an open team retrospective reveals senior PMs have never agreed on where product's authority over ethics questions actually ends, converting a private doubt into a known, unresolved boundary question for the whole discipline."
  - "A new public defender feels privately inadequate for not knowing whether advocating for a client's housing situation is part of the job or overreach into social work's territory — until a case-review meeting shows veteran defenders split on the same question, revealing it was never a personal knowledge gap but an unsettled jurisdictional question the whole profession still argues about."
critical-questions:
  - "Fox's own typology (personal ignorance / field limits / can't tell which) doesn't name this as a fourth category — is jurisdictional uncertainty genuinely a different kind of uncertainty, or is it better described as a special case of 'field limits,' where the 'field' in question is the profession's own self-definition rather than its medical knowledge?"
  - "Does an institution have to deliberately build a forum for this (a case conference, a retrospective) or can jurisdictional uncertainty surface and get resolved through less structured channels (hallway conversation, informal mentorship) just as effectively — and if structure matters, what does the Comprehensive Care conference format specifically supply that an unstructured venue wouldn't?"
