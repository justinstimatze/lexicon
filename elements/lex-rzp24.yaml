id: lex-rzp24
name: true-belief-needs-a-reasoned-tether-to-become-knowledge
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone reaches a correct conclusion, gives correct guidance, or produces a correct answer, and the question is whether that correctness can be TRUSTED TO RECUR — not whether it's correct THIS TIME — apply Plato's distinction (Meno 97a-98a) between true opinion and knowledge. Socrates first establishes that, for a SINGLE instance, true opinion is exactly as good a guide as knowledge: 'a person who had a right opinion about the way, but had never been and did not know, might be a good guide also... while he has true opinion about that which the other knows, he will be just as good a guide if he thinks the truth, as he who knows the truth.' This is the load-bearing first move — don't dismiss correct-but-unjustified belief as worthless; it performs identically to justified knowledge in the moment it's exercised. But Meno then asks the natural follow-up: if true opinion is just as useful, why is knowledge considered more valuable? Socrates' answer is the DAEDALUS STATUES image: 'they require to be fastened in order to keep them, and if they are not fastened they will play truant and run away... this is an illustration of the nature of true opinions: while they abide with us they are beautiful and fruitful, but they run away out of the human soul, and do not remain long, and therefore they are not of much value until they are fastened by the tie of the cause... when they are bound, in the first place, they have the nature of knowledge; and, in the second place, they are abiding. And this is why knowledge is more honourable and excellent than true opinion, because fastened by a chain.' The mechanism named is precise: what converts a true opinion into knowledge is not additional correctness (it was already correct) but a TETHER — reasoning about the cause (aitias logismos) that binds the belief so it stays put and reproduces reliably across repeated encounters, rather than being a one-off correct guess that 'runs away' the moment context shifts. This same instability shows up earlier in the SAME dialogue, in the slave-boy geometry scene: after the boy recovers the correct diagonal construction purely through questioning, Socrates observes the notions have 'just been stirred up in him, as in a dream; but if he were frequently asked the same questions, in different forms, he would know as well as anyone at last' — true opinion is dream-like (vivid, present, but unstable) until repeated, varied engagement with the reasoning tethers it into stable knowledge. The generalized diagnostic: when you encounter a correct answer, a right call, or good advice, and want to know how much to trust it GOING FORWARD (in a new situation, under a paraphrase, after time has passed), don't just check whether it's correct now — check whether it's tethered. A correct answer with no accompanying reasoning about WHY it's correct is a Daedalus statue: valuable and beautiful while it holds, but liable to walk off the moment the exact conditions that produced it aren't reproduced. This applies to a person's lucky-guess-turned-confident-claim, a memorized-but-not-understood exam answer, a pattern-matched-but-not-derived model output, or a policy recommendation adopted without understanding the mechanism it depends on — in each case the practical test is: ask for the reasoning-about-the-cause, and see whether it holds under a changed instance. If it does, you're looking at knowledge. If the holder can restate the conclusion but not derive it under a new instance, you're looking at an unbound true opinion — still valuable, but budget for it running away."
related: [lex-u7tb6, lex-bra5e, lex-fpvsu]
scaffolds-from: [lex-u7tb6, lex-bra5e]
evokes: [daedalus-statues-run-away-unfastened, tie-of-the-cause, right-guide-to-larisa, true-opinion-as-good-as-knowledge-once, stirred-up-as-in-a-dream, knowledge-fastened-by-a-chain]
lineage:
  - source: primary
    text: plato-c385bce-meno-true-opinion-as-good-a-guide
    citation: "Plato, Meno, 97a-b, in The Dialogues of Plato, trans. Benjamin Jowett (3rd ed., 1892; epub edition consulted, extracted from plato_dialogues_benjamin-jowett_advanced.epub). Socrates has just argued that good men act rightly under the guidance of phronesis (practical wisdom/knowledge); Meno presses him on whether knowledge is truly required, prompting Socrates to introduce right opinion as an equally effective guide to action in a given instance."
    quote: "If a man knew the way to Larisa, or anywhere else, and went to the place and led others thither, would he not be a right and good guide? [...] And a person who had a right opinion about the way, but had never been and did not know, might be a good guide also, might he not? [...] And while he has true opinion about that which the other knows, he will be just as good a guide if he thinks the truth, as he who knows the truth? [...] Then true opinion is as good a guide to correct action as knowledge; and that was the point which we omitted in our speculation about the nature of virtue, when we said that knowledge only is the guide of right action; whereas there is also right opinion."
  - source: primary
    text: plato-c385bce-meno-daedalus-statues-tie-of-the-cause
    citation: "Plato, Meno, 97d-98a, same translation. Immediately following the Larisa-guide exchange, Meno asks why knowledge should be preferred to right opinion if they are equally effective guides — the natural objection to the previous passage. Socrates' answer is the Daedalus-statues image, explaining the difference not in terms of correctness but of stability."
    quote: "Because they require to be fastened in order to keep them, and if they are not fastened they will play truant and run away. [...] I mean to say that they are not very valuable possessions if they are at liberty, for they will walk off like runaway slaves; but when fastened, they are of great value, for they are really beautiful works of art. Now this is an illustration of the nature of true opinions: while they abide with us they are beautiful and fruitful, but they run away out of the human soul, and do not remain long, and therefore they are not of much value until they are fastened by the tie of the cause; and this fastening of them, friend Meno, is recollection, as you and I have agreed to call it. But when they are bound, in the first place, they have the nature of knowledge; and, in the second place, they are abiding. And this is why knowledge is more honourable and excellent than true opinion, because fastened by a chain."
  - source: primary
    text: plato-c385bce-meno-slave-boy-stirred-up-as-in-a-dream
    citation: "Plato, Meno, 85c, same translation. Earlier in the same dialogue, immediately after the slave-boy recovers the correct diagonal construction through pure questioning (no instruction), Socrates characterizes the epistemic status of what the boy now holds — foreshadowing the true-opinion/knowledge distinction made explicit later at 97a-98a."
    quote: "And at present these notions have just been stirred up in him, as in a dream; but if he were frequently asked the same questions, in different forms, he would know as well as anyone at last. [...] Without anyone teaching him he will recover his knowledge for himself, if he is only asked questions?"
canonical-instances:
  - "The direct textual anchor: Socrates establishes that a person with mere correct opinion guides just as well as a person with knowledge in a single instance, then explains via the Daedalus-statues image why knowledge is still more valuable — not more correct, but tethered and therefore stable, while unbound true opinion 'runs away' after a single use."
  - "A student who has memorized the correct answer to a specific exam problem (perhaps from a similar practice problem) gets full marks, performing identically to a student who derived the answer from first principles. On a slightly rephrased or extended version of the problem, the memorizer's answer 'runs away' — it doesn't reproduce — while the deriving student's answer holds, because it was tethered to the reasoning rather than to the specific surface form."
  - "A language model that produces a correct factual answer via surface pattern-matching on training data, without an internal representation of the causal or logical structure that makes the answer true, will typically fail to reproduce the correct answer under a paraphrase, a slightly altered premise, or a compositional variant of the same question — the classic 'right answer, wrong reason' failure mode that probes for reasoning robustness are specifically designed to expose."
critical-questions:
  - "how does this differ from lex-u7tb6 (Aristotle, knowing-a-universal-already-partly-knows-its-instances)? lex-u7tb6, drawn from Aristotle's direct response to this SAME Meno paradox, answers the question 'how can you learn/recognize something you didn't already fully know?' — its claim is that holding a universal already gives latent knowledge of particulars. This atom answers a DIFFERENT, later question in the SAME dialogue: once you HAVE arrived at a correct belief (however that happened — lucky guess, partial recollection, valid derivation), what determines whether that belief is stable knowledge or a fragile true opinion that will fail to reproduce? Aristotle's atom is about the STRUCTURE of what you already know; this atom is about the STABILITY of what you've just come to believe. They compose: even a particular recognized via lex-u7tb6's universal-instantiation route still needs this atom's tethering (reasoning about the cause) to become secure knowledge rather than a one-off correct recognition."
  - "how does this differ from lex-fpvsu (elenchus-questioning-to-aporia) and lex-bra5e (maieutic-questioning-extraction)? Both of those atoms are about the QUESTIONING PROCESS that produces or refines a belief — elenchus refutes false confidence, maieutic extracts a positive answer. This atom is about what happens to the belief AFTER it's been extracted: the slave-boy's maieutically-extracted correct answer is explicitly described as 'stirred up... as in a dream' — vivid but unstable — and this atom names the further step (reasoning-about-the-cause, repeated varied questioning) required to convert that dream-like true opinion into abiding knowledge. Maieutic extraction is necessary but not, by itself, sufficient for knowledge on Plato's own account."
  - "does this atom claim true opinion is worthless or shouldn't be acted on? No — the atom's first move is explicitly that true opinion is JUST AS GOOD a guide to action as knowledge, in the moment. The atom's force is narrower: don't mistake a single correct performance for a stable, reproducible capacity. It licenses acting on correct-seeming answers while budgeting for the possibility they won't reproduce under new conditions — the practical corrective is to test reproduction under variation, not to withhold action pending full justification."
  - "what counts as 'the tie of the cause' in a non-geometric domain? Plato's own example (recollection via repeated, varied questioning) is domain-general: the operational test is whether the belief-holder can regenerate the conclusion when the surface conditions change — a new phrasing, a new instance, an adjacent case. If they can only reproduce the original form, the belief is unbound; if they can regenerate it under variation, something like reasoning-about-the-cause is present, regardless of whether it takes the form of a formal proof, a causal mechanism, or an internalized principle."
