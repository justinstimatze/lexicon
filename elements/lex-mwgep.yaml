id: lex-mwgep
name: positive-feedback-amplifies-early-events-into-locked-in-trajectories
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When examining a current state that seems 'inevitable', trace the early small differences that got amplified. The current state may be path-dependent on a small early event, not the consequence of underlying conditions."
related: [lex-spm8x, lex-t28ya, lex-fmgeg, lex-5d8hm, lex-vacza, lex-z7dbd, lex-dqa9j, lex-8mpe8, lex-ky7un, lex-dzr6g, lex-d56d4, lex-8j5ms, lex-uarce, lex-suent, lex-9kuqg, lex-sxwn7, lex-v32sr, lex-94b62, lex-3fzvf, lex-2jaf6, lex-9exaw, lex-rax8z, lex-6cvnf, lex-pqqhr, lex-977gg, lex-z3qjg, lex-wx2ma, lex-fjffq, lex-9we2s, lex-4xcqa, lex-su2sk, lex-fn2gx, lex-hbanm, lex-5y7zb, lex-q77ce, lex-643m7, lex-pjsjj, lex-d5eew, lex-mxdrn, lex-h8t7s, lex-wfuyn, lex-vw8c3, lex-egkjk, lex-5tpy8, lex-f2ktw, lex-qjsgk, lex-cbrcm, lex-md8ku, lex-zvdxq, lex-r6msz]
