id: lex-n9x8j
name: fullness-invites-correction-across-independent-domains-at-once
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When something reaches a state of excess or fullness, check whether the corrective pressure against it converges from more than one independent register at once — cosmic, natural, institutional, and personal — rather than from a single source that could plausibly be coincidence. The I Ching's Tuan commentary on hexagram XV (Khien, Humility) states the convergence across four separate registers in one breath: 'It is the way of heaven to diminish the full and augment the humble. It is the way of earth to overthrow the full and replenish the humble. Spiritual Beings inflict calamity on the full and bless the humble. It is the way of men to hate the full and love the humble.' Heaven, earth, the spirits, and human sentiment are named as four independently-operating sources, and all four are claimed to land on the identical correction. A claim earns more weight when the same effect shows up from unconnected directions than when it comes from one channel restated four times."
related: []
evokes: [i-ching, ten-wings, tuan-zhuan, humility, multi-domain-convergence]
lineage:
  - source: primary
    text: legge-1899-i-ching-appendix-i-hexagram-15
    citation: "The Yî King, translated by James Legge, Appendix I ('Treatise on the Thwan'), Hexagram XV (Khien, 'Humility'), Sacred Books of the East vol. 16 (Oxford, 1899). Verified verbatim against a direct extraction of the full text hosted at sacred-texts.com, clean digital text, no OCR."
    quote: "It is the way of heaven to diminish the full and augment the humble. It is the way of earth to overthrow the full and replenish the humble. Spiritual Beings inflict calamity on the full and bless the humble. It is the way of men to hate the full and love the humble."
canonical-instances:
  - "Legge's own footnote flags the passage's unusual force directly: 'The Thwan on this hexagram was so brief, that the writer here deals generally with the subject of humility, showing how it is valued by heaven and earth, by spirits and by men... What he says of man's appreciation of humility is striking.' The commentator himself reads it as an escalation beyond the hexagram's own terse original line."
  - "The four registers named are not interchangeable restatements of the same mechanism: heaven's diminishing (an impersonal astronomical process, e.g. the sun's daily decline), earth's overthrowing (a physical/seasonal process), the spirits' calamity-and-blessing (a moral-supernatural sanction), and human hatred-and-love (a psychological/social response) are four distinct causal mechanisms independently arriving at one outcome."
critical-questions:
  - "Is the four-domain convergence doing real evidentiary work, or is it rhetorical — a single cultural intuition about humility projected outward and then read back as if it were four independent confirmations?"
  - "Do all four registers actually converge without exception, or does the text simply omit counterexamples (a humble person who goes unrewarded, a proud one who thrives) that would complicate the claimed universality?"
  - "Does this generalize into a usable test — when a claim is asserted to hold across cosmic, natural, social, and personal registers simultaneously, is genuine independence between those registers checkable, or does the same underlying cultural belief usually generate all of them?"
status: active
