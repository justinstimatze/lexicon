id: lex-nbk6e
name: another-agent-with-different-goals-can-bend-your-metric-to-their-ends
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a regulator uses a metric M to optimize for goal G, and there exists a second agent inside the system whose own goal differs from G and who can observe or anticipate the regulator's use of M, the second agent's strategic response can BEND M away from G — not merely add noise, but actively pull the proxy-goal relationship toward the agent's preferred outcome. This is ADVERSARIAL Goodhart in Manheim-Garrabrant's typology, and it is fundamentally different from the other three variants because it requires a MULTI-AGENT structure with goal-divergence and at least partial mutual model. Two sub-mechanisms are formalized. (1) ADVERSARIAL MISALIGNMENT (Campbell's Law subcase): the agent observes the regulator's choice of metric M and selects their own actions (or their own metric to optimize) so as to make M move while making G stagnate or reverse — the canonical example is Campbell's-Law decay of social statistics under any consequential decision-making. (2) COBRA EFFECTS: the regulator modifies the agent's goal (typically by attaching incentives to M), aligning agent action with M but not with G; the agent then acts to maximize M either by changing the causal structure (normal cobra, see lex-prwfm) or by other Goodhart-flavored mechanisms (non-causal cobra). Critical distinction from the other three variants: regressional / extremal / causal Goodhart all fire even with a single benevolent regulator and no opposing agent. Adversarial Goodhart requires the second agent and is the only variant in which the proxy-goal gap can be actively WIDENED by strategic counter-optimization. Transferable instances span every multi-agent context where one party sets a metric another party is incentivized to influence: regulatory capture, tax-loophole arbitrage, gaming-the-curriculum, search-engine-SEO, accountability-metric corruption. The practitioner discipline: before deploying a metric in a context with second-agents, run the adversarial-think — what is the cheapest action available to the agent that moves M favorably while leaving G untouched or reversed? If you cannot answer, you do not understand the threat model."
