lineage:
  - source: primary
    tradition: kleinberg-chouldechova-fairness
    text: christian-2020-alignment-problem
    citation: "Brian Christian, The Alignment Problem: Machine Learning and Human Values (W. W. Norton & Company, 2020), Chapter 2 (Fairness), section 'The Impossibility of Fairness'."
    quote: "It is simply, Kleinberg and his colleagues write, a fact about risk estimates when the base rates differ between two groups. Chouldechova's analysis lands exactly in the same place: A tool that is calibrated, she writes, cannot have equal false positive and negative rates across groups, when the recidivism prevalence differs across those groups. So you just can't have it all, she says. It's a general principle, but in this case it leads you to interesting conclusions . . that [have] implications for risk assessment in the real world."
  - source: primary
    tradition: kleinberg-chouldechova-fairness
    text: christian-2020-alignment-problem
    citation: "Brian Christian, The Alignment Problem: Machine Learning and Human Values (W. W. Norton & Company, 2020), Chapter 2 (Fairness), Kleinberg quoted."
    quote: "Only in a world in which Black and White defendants happened to have equal 'base rates' — that is, happened to actually reoffend exactly as often as one another — would it be possible to satisfy ProPublica's and Northpointe's criteria at the same time. Otherwise, it is simply impossible. This has nothing to do with machine learning. Nothing to do with criminal justice as such."
canonical-instances:
  - COMPAS recidivism algorithm (2016) — ProPublica reported it had higher false-positive rates for Black defendants; Northpointe reported it was calibrated across groups; both were correct, and the criteria are mathematically incompatible given different actual recidivism base rates across demographic groups.
  - Medical-AI breast-cancer screening — calibrated across age groups means it cannot have equal false-positive rates across age groups (because base rates differ by age); a policy choice has to be made and articulated.
  - Mortgage-default risk scoring across geographic regions with differing actual default rates — same impossibility; lender must pick which criterion to optimize and own the policy implication.
  - University-admissions predictive models that try to be simultaneously calibrated and equally-error-balanced across demographic groups; the math says you can't, regardless of how thoughtful the modeling team is.
  - Content moderation systems flagging posts as policy-violating across user populations with differing actual violation rates — the impossibility is the same; "fair moderation" is not a single-target objective.
