id: lex-tdvtf
name: one-accounting-frame-covers-obligations-owed-in-three-different-time-directions
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Support given to dependents who cannot yet reciprocate, support given to elders who can no longer reciprocate, and support given to strangers who will never reciprocate are three structurally different obligations — owed forward in time, owed backward in time, and owed to no one in particular. Naming all three with a single financial vocabulary (loan, debt, treasure) makes them mutually legible as instances of one coherent practice rather than three unrelated acts of generosity, without collapsing the real difference in who is owed and when. In the Jataka's tale, the parrot king, asked what he does with the food he doesn't eat, answers with exactly this three-part accounting: \"My callow chicks, my tender brood, whose wings are still ungrown, / Who shall support me by and bye: to them I grant the loan. / Then my old ancient parents, who far from youth's bounds are set, / With that within my beak I bring, to them I pay my debt. / And other birds of helpless wing, and weak full many more, / To these I give in charity: this sages call my store. / This is that loan the which I grant, this is the debt I pay, / And this the treasure I store up: now I have said my say.\""
