id: lex-heuug
name: fifty-years-of-undetected-disguise-collapses-instantly-on-one-detected-tell
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A disguise that has held perfectly for decades offers no protection once a single genuine tell is detected, and a belated charm offensive delivered right after that detection cannot undo the alarm the tell already triggered. The years of accumulated trust were never a buffer against a fresh, specific warning sign. In the Jataka's tale of the false ascetic, a hermit lives among a flock of pigeons for over fifty years, entirely undetected, until he decides to eat one and prepares the meal in advance. The pigeon-chief scents the preparation and immediately flees with his flock. The ascetic then tries flattery to lure them back, calling their old bond into question, and the chief's answer names exactly why it fails: 'We are no fools, and we know you; We are the same, and you are too: You have designs against our weal, So, heretic, this fear we feel.' Fifty years of trust bought him nothing once the scent was on him."
