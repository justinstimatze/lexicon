id: lex-jevku
name: economics-has-two-distinct-traditions-ethics-related-and-engineering
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern whenever a field's methodology, its account of human motivation, or its standard for judging success is treated as if it had always been, or must necessarily be, a single unified thing — when in fact the field has two (or more) historically distinct origin-traditions that pull in different directions, and the field's current character reflects which tradition has come to dominate rather than any necessary or inevitable feature of the subject matter itself. Sen's move is to trace economics specifically to two distinct historical origins that remain in tension. The first he calls the 'ETHICS-RELATED' tradition, tracing to Aristotle: 'At the very beginning of The Nicomachean Ethics, Aristotle relates the subject of economics to human ends, referring to its concern with wealth. He sees politics as \"the master art\"... since, again, it legislates as to what we are to do and what we are to abstain from, the end of this science must include those of the others, so that this end must be the good for man.' In this tradition economic activity (wealth-seeking) is understood as a MEANS toward the deeper ethical question of human ends and social achievement, not an end justified on its own terms — 'The life of money-making is one undertaken under compulsion, and wealth is evidently not the good we are seeking; for it is merely useful and for the sake of something else.' Sen draws out two foundational issues this tradition keeps in view: the question of human motivation ('How should one live?', which ethical deliberation cannot be totally dissociated from even though it is not the whole of actual behavior — Sen calls this 'the ethics-related view of motivation'), and the judgement of social achievement, which 'cannot stop the evaluation short at some arbitrary point like satisfying \"efficiency\"' but must take a broader ethical view of the good. The second tradition Sen calls the 'ENGINEERING' tradition, which he traces to ancient administrative/logistical texts contemporary with Aristotle (he cites the Arthashastra) concerned with practical problems — 'building of villages,' 'land classification,' 'collection of revenue,' 'tariff regulations,' 'diplomatic manoeuvres,' 'employing spies,' 'controlling embezzlement by officers' — where 'the motivations of human beings are specified by and large in fairly simple terms' and 'ethical considerations in any deep sense are not given much role in the analysis of human behaviour.' Sen's transferable claim is not that one tradition is simply correct and the other wrong: 'it is not surprising that both the ethics-related origin and the engineering-based origin of economics have some cogency of their own... in the writings of the great economists both the features are noticeable in varying proportions' — the ethics-related strand runs stronger in Smith, Mill, Marx, and Edgeworth; the engineering strand stronger in Petty, Quesnay, Ricardo, Cournot, and Walras. His diagnostic point is that MODERN economics, and especially modern welfare economics, has increasingly narrowed toward the engineering tradition's comparatively simple, largely self-interested model of motivation, at the cost of the deeper ethical questions the field's other historical origin always kept live — a narrowing that is a HISTORICAL, CONTINGENT DRIFT within the field, not a discovery that the ethics-related tradition was mistaken or dispensable. The atom's transferable form: when a discipline presents its current dominant methodology as simply what the field IS, check whether the field instead has two or more genuinely distinct historical origin-traditions, each with its own account of motivation and its own standard for success, and whether the field's present character reflects a historically contingent (and possibly still-contestable) drift toward one tradition at the expense of the other, rather than a settled, necessary feature of the subject matter. DISTINCT from a generic 'economics ignores ethics, bring ethics back in' complaint: Sen's specific contribution is the HISTORICAL/DISCIPLINARY framing — identifying two traditions with distinct, datable historical origins (Aristotle vs. contemporary administrative-logistical texts) that have coexisted with varying weight across the discipline's major figures, rather than treating the absence of ethical content in modern economics as either economics' timeless nature or a recent unprincipled error with no deeper historical structure. DISTINCT from lex-6pcc4 (Hayek, price-signal-compresses-dispersed-knowledge-into-actionable-symbol): Hayek's claim concerns a specific MECHANISM (how a compressed price signal transmits information sufficient for coordinated action without centralizing knowledge); Sen's claim concerns the HISTORICAL AND METHODOLOGICAL SELF-UNDERSTANDING of economics as a discipline — an entirely different axis, with no overlap in subject matter. Cross-domain applications: (a) ANY PROFESSIONAL OR ACADEMIC FIELD'S METHODOLOGICAL SELF-PRESENTATION — medicine (an art-of-healing-the-whole-person tradition vs. a narrow biomedical-mechanism tradition), law (a justice-and-equity tradition vs. a formalist-rule-application tradition), computer science (a humane/social-computing tradition vs. a pure-engineering-efficiency tradition) can each be examined for a similar two-tradition history, where the field's present dominant self-conception may reflect contingent drift rather than necessity; (b) ORGANIZATIONAL CULTURE — a company's stated mission ('we optimize for X') may likewise reflect the historical dominance of one founding tradition (e.g., an engineering-first founding culture) over another (e.g., a mission-first founding culture) that was present at the organization's origin but has since been narrowed away; (c) POLICY DEBATES ABOUT 'WHAT ECONOMICS SAYS' — invoking economics as a unified, value-neutral technical authority obscures that the discipline itself contains an internal, historically-grounded debate about whether technical efficiency or broader ethical/social-achievement standards are the correct measure, a debate economics has not settled by discovering that ethics is out of scope. Failure modes: (a) TREATING THE ENGINEERING TRADITION AS SIMPLY WRONG OR ILLEGITIMATE — Sen is explicit that 'the engineering approach has much to offer to economics as well'; the atom is not a brief for the ethics-related tradition alone but a claim about a live tension between two traditions each with genuine cogency; (b) TREATING THE PRESENT DOMINANCE OF ONE TRADITION AS PROOF THAT IT IS THE CORRECT OR NECESSARY APPROACH — the historical-drift framing specifically blocks this inference: dominance reflects a contingent balance among traditions, not a discovery that the other tradition was mistaken; (c) FLATTENING THE CLAIM INTO 'ECONOMISTS SHOULD BE NICER' — Sen's claim is about which FOUNDATIONAL QUESTIONS (the standard for judging social achievement, the account of human motivation) a discipline's methodology admits or excludes, not a claim about individual economists' personal ethics or intentions."
