id: lex-yzq5c
name: the-visionary-witnesses-their-own-inert-body-inside-the-vision
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A vision or altered state can include, as one of its own scenes, a view of the dreamer's ordinary physical body lying inert in the world the vision temporarily left -- collapsing the vision and the bodily crisis that produced it into a single witnessed event rather than two separate experiences. Near the end of Black Elk's vision, riding as the spotted eagle above his own village, he looks down at his people and reports: 'all were well and happy except one, and he was lying like the dead -- and that one was myself.' He is simultaneously the eagle-borne witness flying above the scene and the sick boy visible from above, lying in his family's tepee. When the vision closes, he walks back into that same tepee and finds his mother and father 'bending over a sick boy that was myself,' completing the loop the vision had already shown him from outside."
related: []
evokes: [black-elk-speaks, lying-like-the-dead-and-that-one-was-myself, spotted-eagle, out-of-body-witnessing, coma-and-near-death-self-viewing]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch3-the-great-vision
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 3, 'The Great Vision.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "I looked below and saw my people there, and all were well and happy except one, and he was lying like the dead -- and that one was myself. [...] I saw my own tepee, and inside I saw my mother and my father bending over a sick boy that was myself."
canonical-instances:
  - "A patient under general anesthesia later reports an out-of-body experience during surgery, describing watching their own unconscious body on the operating table from a vantage point near the ceiling."
  - "A meditator in deep trance reports observing their own physically motionless, seated body from a separate vantage point, describing the seated body as an object being watched rather than as the location of their awareness."
  - "A person recovering from a coma describes watching over their own hospital bed during the coma, seeing family members gathered around a body they later confirm was theirs, though at the time it felt like someone else's."
critical-questions:
  - "Does seeing one's own body from outside during a vision provide real evidence that consciousness and the body are separable, or is a simpler explanation available: the mind renders itself as just another figure in a scene it is already populating with everyone else?"
  - "If Black Elk had not already known that his body had in fact been lying sick in the tepee throughout the vision, would the scene of seeing himself 'lying like the dead' have been included in his account at all, or does the detail get added because it's already known to be true?"
  - "What distinguishes this self-witnessing scene from an author simply narrating 'meanwhile, back at the tepee' as a storytelling device -- does the visionary's own sense of literally seeing both places at once change what kind of claim is being made?"
status: active
