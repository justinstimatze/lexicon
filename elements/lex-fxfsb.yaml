evokes: [the-opportunity-to-be-what-they-already-believe-themselves-to-be-is-the-apology, cushing-the-revenge-of-the-two-brothers-on-the-hawikuhkwe, im-a-warrior-every-direction-of-me, im-just-made-to-use-up-life]
lineage:
  - source: primary
    text: cushing-rainbow-worm-forgives-the-prank-for-the-chance-at-glory
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Revenge of the Two Brothers on the Hawikuhkwe.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Shoma! he exclaimed. It's my grandchildren, is it? I am old and a little deaf, and you frightened me, my boys. Did we frighten you, grandfather? That's too bad. Well, never mind; we've come to you for advice. ... Ah ha! exclaimed old Amiwili. Very well! ... I'll show them that they are not to treat my grandchildren like that. I'm a warrior, every direction of me--and there are a great many directions when I get angry, now, I can tell you! I'm just made to use up life, said he, with another swagger of his head.'"
canonical-instances:
  - "A manager who publicly overruled a senior engineer's technical judgment in front of the team later needs that same engineer's help on a high-visibility rescue project, and finds the engineer eager to join the moment the ask is framed around their unique expertise being indispensable, the earlier slight barely mentioned once the identity-affirming opportunity is on the table."
  - "A sibling who forgot a family member's birthday and caused real hurt later asks that same relative to be the lead organizer of an important family event, and the relative agrees readily, the role of trusted organizer mattering more to them in the moment than the unresolved hurt feelings."
critical-questions:
  - "Does this pattern depend on the grudge being minor or the identity-appeal being unusually strong, or would it also work to smooth over a genuinely serious wrong if the opportunity offered were large enough -- is there a threshold past which no appeal to identity outweighs the grievance?"
  - "Is the Rainbow-worm's forgiveness genuine, or is he simply performing the persona of 'warrior who doesn't dwell on slights' because that persona is itself part of the identity he wants to project -- does the story give any way to tell the difference?"
  - "Would this tactic fail on an ally whose self-image doesn't depend on the specific kind of opportunity being offered -- does recruiting through identity-appeal require you to already know exactly which identity the person is hungry to inhabit?"
status: active
