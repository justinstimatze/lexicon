id: lex-8p8ha
name: invoking-custom-to-force-acknowledgment-from-an-unrecognizing-superior
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'When a powerful party simply fails to notice or remember a petitioner, the petitioner can skip pleading altogether and name an established social protocol instead — converting a private claim into a public, normative one the powerful party cannot wave off without visibly breaking custom. In the Jataka''s tale of the Moonlight Prince, a brahmin the now-crowned king passes without recognition stops him not by asking to be remembered but by naming the rule of hospitality itself: "O king of men, hear what I have to say! Not without cause have I come here this day. ''Tis said, O best of men, one should not pass A wandering brahmin standing in the way."'
related: []
evokes: [jataka, ekadasanipata, junha-jataka, appeal-to-custom, compelling-acknowledgment]
lineage:
  - source: primary
    text: jataka-chalmers1895-junha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 456, Junha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "O king of men, hear what I have to say! Not without cause have I come here this day. 'Tis said, O best of men, one should not pass A wandering brahmin standing in the way."
canonical-instances:
  - "A former colleague the CEO walks past without recognizing at a conference stops him not by saying her name but by citing the firm's own stated open-door policy loudly enough for the people around them to hear it invoked."
critical-questions:
  - "Does this move work because the custom is genuinely binding, or because invoking it in public makes refusal to comply cost the powerful party more than compliance would?"
status: active
