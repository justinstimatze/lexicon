id: lex-x6nvg
name: a-victorious-groups-honor-code-slows-for-its-weakest-member
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a group is flush with victory and eager to celebrate, watch for whether its own standards, not an outside rule, are what slow it down for the sake of its weakest members -- a self-policed pace, invoked reluctantly and against the majority's own excitement, is a much stronger signal of a group's real values than anything said before the win. In Cushing's telling, a pack of Dogs returning triumphant and 'crazy with victory' notices that the short-legged among them are falling behind, and it's the fastest, most eager Dogs who raise the concern themselves: 'it is not valorous, however great your victory and however strong your desire to proclaim it at home, to leave a worn-out brother lagging behind.' Nobody in authority orders the slower pace; the group's own invoked standard of valor does, and the strong ones comply 'most reluctantly,' genuinely wanting to press on, but recognizing that abandoning a slower member for the sake of a faster celebration would betray the very honor the victory was supposed to prove. Diagnostic move: when a group succeeds and its strongest, most eager members are the ones who voluntarily slow down for its weakest, treat that as a much more reliable signal of the group's actual values than any stated commitment made before success was on the line -- values invoked reluctantly, against one's own immediate desire, in a moment when no one would notice their absence, are the ones actually load-bearing."
related: []
evokes: [reluctant-self-policing-is-the-real-signal-of-values, cushing-the-warrior-suitor-of-moki, not-valorous-to-leave-a-worn-out-brother-lagging-behind, the-strongest-members-name-the-standard-themselves]
lineage:
  - source: primary
    text: cushing-warrior-suitor-moki-dogs-slow-for-the-short-legs
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Warrior Suitor of Moki.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'By the music of marrowbones!' exclaimed some of the swifter of foot; 'we will have to slacken our pace, father.' Said they, addressing the youth: 'Our poor brothers, the Short-legs, are evidently getting tired; they are falling far in the rear, and it is not valorous, however great your victory and however strong your desire to proclaim it at home, to leave a worn-out brother lagging behind. The enemy might come unawares and cut off his return and his daylight.' Most reluctantly, therefore, they slackened their pace."
canonical-instances:
  - "A high-performing sales team celebrating a record quarter notices its newest, least experienced member struggling to keep pace with an impromptu after-hours celebration plan, and the team's most eager top performers are the ones who suggest scaling it back so no one gets left out, treating group cohesion as inseparable from the win they're celebrating."
  - "A group of hikers who just successfully summited a difficult peak notices the slowest member of the party falling behind on the descent, and it's the fastest, most eager hikers who voluntarily slow the whole group's pace, framing leaving anyone behind as a betrayal of what completing the climb together was supposed to mean."
critical-questions:
  - "does this pattern only hold up when the cost of slowing down is genuinely low, in this case, a delayed celebration -- would the same self-policing standard survive if slowing down for the weakest member carried a serious risk to the whole group, as the Dogs themselves note (\"the enemy might come unawares\")?"
  - "is 'most reluctantly' actually evidence the standard is genuine, or does it show the values are real but weaker than the immediate desire to celebrate, meaning the group complies with its own standard rather than actually wanting to act on it?"
  - "how would this dynamic play out in a group without an obvious internal spokesperson to name the standard out loud -- does self-policing require someone confident enough to invoke the group's values directly, or does it happen more diffusely without anyone needing to say it?"
status: active
