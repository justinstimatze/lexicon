id: lex-adn2x
name: total-comfort-forecloses-the-constraint-growth-requires
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A condition of total abundance and power can remove exactly the friction that further growth depends on, so that staying in it — however pleasant — is itself what blocks progress. Someone who actually wants that growth may have to leave the comfortable condition for a harder one on purpose, not despite already having access to the easier option but because of it. In the Jataka's tale of the Naga king Samkhapala, a being with a palace of gold and silver, three hundred wives, and every heavenly pleasure repeatedly chooses to leave it and take on the constrained, vulnerable condition of human life instead, explaining why to the human Alara who can't understand the trade: \"Nowhere but in the world of men, I ween, / May purity and self-restraint be seen: / If only once midst men I draw my breath, / I'll put an end to further birth and death.\" The Naga world's very comfort is what the tale marks as the thing standing between him and what he actually wants. When he later offers Alara an inexhaustible wealth-jewel as a parting gift, Alara refuses it too, on the same logic: \"I have no need of riches, sir, but I am anxious to take orders.\""
related: []
evokes: [jataka, cattalisanipata, samkhapala-jataka, comfort-as-obstacle-not-reward, voluntary-constraint-enables-growth]
lineage:
  - source: primary
    text: jataka-francis1905-samkhapala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XVII (Cattalisanipata), No. 524, Samkhapala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Nowhere but in the world of men, I ween, / May purity and self-restraint be seen: / If only once midst men I draw my breath, / I'll put an end to further birth and death. ... I have no need of riches, sir, but I am anxious to take orders."
canonical-instances:
  - "A founder who's built a company profitable enough to run itself steps back down to launch a new venture from nothing, on a shoestring, because operating without a cushion is the only condition under which the specific skills they still want to build ever actually get exercised."
  - "A tenured professor with guaranteed funding for life turns down a renewal and moves to a soft-money position with no security, because the certainty was quietly letting years pass without the harder, riskier work they'd meant to do getting done."
critical-questions:
  - "The tale frames this as the Naga king's own free, repeated choice — but is total comfort really what blocks growth, or is it that this particular being had already extracted everything comfort could teach and genuinely needed something new, meaning the pattern describes a specific stage rather than a general rule that abundance is bad for growth?"
  - "Alara refuses the wealth-jewel outright rather than testing whether he could hold both the resources and the discipline at once — does the tale's binary (comfort or growth, never both) hold up, or is refusing all abundance a stronger claim than the actual mechanism (comfort removing friction) requires?"
status: active
