id: lex-zfbef
name: additional-detail-on-existing-variables-raises-confidence-without-raising-accuracy
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When additional detail is provided on existing variables, confidence rises but accuracy doesn't. People mistake richness of representation for evidential weight. Demand new VARIABLES (orthogonal information), not new details on familiar ones."
related: [lex-jv983, lex-k6d7u, lex-t9fs7, lex-eb3wf, lex-zag9z, lex-ckahh, lex-2czcp, lex-mbx6p, lex-rsnn7, lex-63e4c, lex-ga4dw]
scaffolds-from: [lex-jv983, lex-k6d7u, lex-zag9z]
evokes: [oskamp-horserace-handicappers, more-data-more-confidence-same-accuracy, the-illusion-of-thorough-analysis, raw-intelligence-volume-trap, more-isnt-better, supporting-detail-vs-discriminating-evidence, heuer-ch5]
lineage:
  - source: primary
    text: heuer-1999-psychology-of-intelligence-analysis-ch5
    citation: "Richards J. Heuer Jr., *Psychology of Intelligence Analysis*, CIA Center for the Study of Intelligence 1999, Ch. 5 'Do You Really Need More Information?' (pp. 51-63). The substrate-claim: empirical experiments (Stuart Oskamp 1965 horserace handicappers; Summers/Taliaferro/Fletcher 1970; Shepard 1964) show that adding additional detail about variables ALREADY in the analyst's model INCREASES confidence in the conclusion WITHOUT improving accuracy. Heuer (p.61) distinguishes four types of additional information: (1) more detail on existing variables — increases confidence, not accuracy; (2) additional variables — usually little accuracy gain; (3) better values for critical variables — genuine accuracy gain; (4) better mental model (which variables matter, how they relate) — genuine accuracy gain. Most current intelligence reporting falls in categories 1-2; the categories that actually move accuracy (3-4) are rarer. The transferable shape: adding supporting-evidence to a pre-formed conclusion does not test it; it merely makes the pre-formed conclusion FEEL better-supported. To improve accuracy, change the model (type 4) or the values on critical variables (type 3); detail-elaboration is the wrong move. The cognitive mechanism is that conclusions are typically based on a few critical variables, so detail on non-critical variables is decorative. The Heuer corollary: 'mosaic theory' of analysis (small pieces assemble into a picture) is the wrong metaphor; 'medical diagnosis' (hypothesis-driven information-collection) is the right one. The substrate-meta point: when an analyst wants to be more sure, the typical move (gather more data) often raises confidence without raising accuracy — producing miscalibrated certainty. The transferable failure-mode signature: confidence is rising while ground-truth-accuracy plateaus or even regresses."
    quote: "[Heuer 1999 Ch.5 p.55-61:] 'One would not expect such supplementary information to affect the overall accuracy of the analyst's judgment, and it is readily understandable that further detail that is consistent with previous information increases the analyst's confidence. Analyses for which considerable depth of detail is available to support the conclusions tend to be more persuasive to their authors as well as to their readers.' [On the four-type taxonomy:] 'It is necessary to distinguish four types of additional information that an analyst might receive: Additional detail about variables already included in the analysis ... Identification of additional variables ... Information concerning the value attributed to variables already included in the analysis ... Information concerning which variables are most important and how they relate to each other.' [p.58:] 'The accuracy of an analyst's judgment depends upon both the accuracy of our mental model (the fourth type of information discussed above) and the accuracy of the values attributed to the key variables in the model (the third type of information discussed above). Additional detail on variables already in the analyst's mental model and information on other variables that do not in fact have a significant influence on our judgment (the first and second types of information) have a negligible impact on accuracy, but form the bulk of the raw material analysts work with. These kinds of information increase confidence because the conclusions seem to be supported by such a large body of data.' [On mosaic theory:] 'Insights from cognitive psychology suggest that intelligence analysts do not work this way and that the most difficult analytical tasks cannot be approached in this manner. Analysts commonly find pieces that appear to fit many different pictures. Instead of a picture emerging from putting all the pieces together, analysts typically form a picture first and then select the pieces to fit. Accurate estimates depend at least as much upon the mental model used in forming the picture as upon the number of pieces of the puzzle that have been collected.' [The transferable distillation: gathering more confirming-detail is the natural response to wanting-to-be-more-sure, but it does not work — it raises felt-certainty without raising actual accuracy. The correct moves are sharper hypothesis-discrimination (lex-zag9z ACH) or better mental-model — not more raw data.]"
canonical-instances:
  - "Oskamp 1965 (cited Heuer p.55): clinical psychologists were given increasingly-large information batches about a patient and asked to diagnose. Accuracy plateaued at the SECOND batch of information; CONFIDENCE continued rising through batches 3, 4, 5. After batch 5, confidence was nearly double batch-1 confidence; accuracy was unchanged. Same pattern in horserace handicappers, finance analysts, and intelligence analysts."
  - "Software engineering: spending hours gathering more performance data about a system before deciding to optimize a particular code path. The marginal data doesn't improve the decision (which path to optimize) — it just makes the engineer feel more justified. The accuracy-relevant move is to TEST a hypothesis (try the optimization, measure end-to-end) not to gather more characterization data."
  - "Medical diagnosis (per Heuer's own analogy, p.62): the 'mosaic' approach (collect every possible test, assemble the picture) wastes resources and produces overconfidence. The correct approach is hypothesis-driven testing — list candidate diagnoses, identify tests that DISTINGUISH them (high-diagnosticity, per lex-zag9z ACH), run those. More tests with low diagnosticity just feel like more rigor."
  - "Investing / due diligence: investors who gather extensive supporting research on a stock they've already decided to buy often feel highly confident in the decision but show no improvement in returns. The detail is decorative; the actual decision-quality depends on the small number of critical variables (valuation, business model, management quality) and whether the analyst correctly identified them — not on the volume of supporting analysis."
  - "Academic literature reviews: reviewing additional papers that support the author's already-formed thesis increases confidence in the thesis but does not test it. The accuracy-relevant move is to find papers that CHALLENGE the thesis (try-to-disprove, per lex-zag9z ACH) — those would update the thesis if it's wrong. Confirming citations are decorative."
  - "Operationally distinct from lex-jv983 fluency-trap: fluency-trap is about EASE-OF-PROCESSING (something that's easy to process FEELS true); this atom is about VOLUME-OF-EVIDENCE (more supporting detail FEELS more decisive). Different cognitive mechanisms; both produce miscalibrated confidence. They can co-fire when fluent presentation of voluminous detail amplifies confidence."
  - "Operationally distinct from lex-k6d7u credence-as-graded-belief: lex-k6d7u names the credence-as-output; lex-zfbef names the FAILURE MODE where credence rises with detail-volume rather than with evidential-warrant. Credence calibration (lex-k6d7u done well) requires actively counter-acting the lex-zfbef."
  - "Operationally distinct from lex-t9fs7 confirmation-bias: confirmation-bias is the SEARCH BIAS toward favored conclusions; lex-zfbef is the CONFIDENCE EFFECT of accumulated detail regardless of source. They compose: confirmation-bias produces selectively-favorable detail; lex-zfbef says that detail (even if neutrally-acquired) raises confidence beyond what's warranted."
  - "Operationally composes with lex-zag9z cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity-not-consistency: ACH addresses the substantive failure (treating consistency as evidential); lex-zfbef names the CONFIDENCE-WITHOUT-ACCURACY signature that signals ACH should be applied. When you notice your confidence rising while you can't articulate what NEW hypotheses your latest evidence rules out, lex-zfbef is operative; apply ACH (lex-zag9z) as countermeasure."
  - "Operationally related to lex-eb3wf prospective-hindsight (Klein premortem): both attempt to counteract overconfidence. Premortem imagines failure to surface unconsidered risks; lex-zfbef is the diagnosis-name for one specific overconfidence-source (detail-accumulation). They are complementary tools."
critical-questions:
  - "is your rising confidence tracking new HYPOTHESES being ruled out, or just MORE DETAIL on the already-favored hypothesis? Practitioner-discipline: at each information-acquisition step, name explicitly: (a) which hypothesis on your mental list does this evidence rule OUT? (b) does this evidence change the relative ranking? If both answers are 'no' / 'not really', the evidence is decorative — it's adding confidence without adding accuracy."
  - "which of Heuer's four types is your new information? Type 1 (detail on existing variables) and Type 2 (new variables) typically don't move accuracy. Type 3 (better values on critical variables) and Type 4 (better mental model) do. Practitioner-question: ask of each new data-source 'which type is this?' before committing time to gathering it. Skip Type 1-2 acquisitions for high-stakes decisions; insist on Type 3-4."
  - "are you treating analysis as MOSAIC (collect pieces, assemble picture) or as MEDICAL DIAGNOSIS (hypothesize, test)? Heuer's diagnostic question: what would lead you to abandon your current picture? If the answer is 'I can't imagine any single piece that would' — you're in mosaic-mode and lex-zfbef will produce false confidence. The medical-diagnosis discipline is hypothesis-driven testing."
  - "what's the calibration-feedback loop? Per Heuer p.61, intelligence analysts get little systematic feedback on judgment-accuracy — so the analyst can't learn that volume-of-detail isn't calibrated to accuracy. Practitioner-discipline: when no clear feedback loop exists, suspect lex-zfbef; deliberately seek ground-truth check-ins. When feedback exists (forecasters, oddsmakers, engineering test-results), calibration improves."
  - "where do practitioners over-apply this critique? When evidence-gathering really IS the bottleneck (e.g., crime investigation with thin evidence; novel scientific domains with little prior data). The atom is specifically about ADDITIONAL detail on existing variables when an analytical model is already in place. In data-scarce environments, more evidence is genuinely needed for Type 3 (better values on critical variables). Practitioner-discrimination: is this the FIRST detail you have on this critical variable (Type 3, gather), or the NTH detail elaborating what you already knew (Type 1, skip)?"
  - "what does this mean for raw-intelligence-collection budgets? Heuer's policy implication (p.62): 'there appear to be inherent practical limits on how much can be gained by efforts to improve collection' — improving ANALYSIS (mental model, hypothesis-testing discipline) has higher returns than improving COLLECTION (more data) once a basic-coverage threshold is met. Transferable: when your team faces a quality problem, ask whether 'more data' or 'better thinking about the data' is the bottleneck. Most teams over-invest in data."
