id: lex-f2rjs
name: fun-rewards-pattern-mastery-and-saturates-with-mastery
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When designing or evaluating activities that should be 'fun' — games, exercises, learning curricula, hobbies, work routines, software interfaces — recognize Koster's 2013 structural claim: fun is the brain's reward signal for mastering a pattern in a context without consequence. The signal tracks the RATE of pattern-mastery, not the absolute skill level. Operational consequences: (1) An activity is fun while the brain is acquiring new chunks (pattern-recognition, motor sequences, strategic insights) and stops being fun once those chunks are fully mastered. This is why mastered games become boring, why competent professionals stop being excited by routine work, why hobbies cycle, why kids stop playing with a toy once they've 'figured it out.' (2) Difficulty calibration must track the learner's current mastery: too easy → no new chunks to acquire → not fun; too hard → can't make progress → frustrating not fun. The fun-window is the zone where chunks are being acquired at a manageable rate. (3) The same activity can be fun for one person and boring for another based on where they are on the mastery curve — a child finding chess deeply fun while a Grandmaster finds the same game routine. (4) Designing for sustained engagement requires either continuously serving new patterns (game difficulty progression, new content, expansion packs, procedural generation) OR accepting that an activity has a natural fun-lifespan and designing for graceful saturation rather than permanent engagement. (5) Compare with Schüll's time-on-device (lex-tcgej): platforms that optimize for engagement without serving new chunks substitute variable-ratio reinforcement (gambling) for genuine fun — addictive without being fun. Transferable beyond games to: pedagogy (good teaching presents patterns at the rate the learner can chunk), software UX (good interfaces have a learning curve that delivers chunks at expected rates), career design (the fun-saturation curve explains career change drives), exercise (variation prevents the saturation that demotivates), and the general design question of how to keep something enjoyable over long timeframes."
