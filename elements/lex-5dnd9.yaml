id: lex-5dnd9
name: inclusive-fitness-extends-selection-through-relatives-weighted-by-relatedness
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you observe an actor incurring a real cost to benefit another — alarm calls that attract predators, sterile worker castes, parental sacrifice, food-sharing across households, blood donation, willingness to die for kin — Hamilton's transferable claim is that selection operates not on individual fitness alone but on INCLUSIVE FITNESS: the actor's own reproductive success PLUS the reproductive success of relatives, each relative weighted by the coefficient of relatedness r (probability that a random gene in the actor is identical-by-descent to one in the relative). Hamilton's rule: an allele for altruistic behaviour spreads when rB > C, where B is the benefit to the recipient and C is the cost to the actor. The transferable structural claim: APPARENTLY-COSTLY OTHER-HELP IS EXPLAINED BY THE GENETIC-CHANNEL RETURN, NOT BY INDIVIDUAL ALTRUISM. The actor isn't 'choosing' to help; the genes that prescribe helping behavior are favored by selection because the helped relatives carry copies of those same genes. Practitioner consequence: when you encounter what looks like altruism, ask three questions before invoking a 'pure-altruism' explanation: (1) what's the genetic relatedness r between actor and beneficiary? (2) does the benefit-to-cost ratio satisfy rB > C? (3) is the relatedness assessment by the actor's mechanism (kin-recognition cues, co-residence proximity, phenotypic matching) reliable enough to track r? If yes, no further explanation needed — Hamilton's rule predicts the behavior. The transferable generalization extends BEYOND genetic kin: any channel that returns benefit-weighted-by-similarity (cultural similarity, reputation networks, repeated-interaction, institutional bonds) can produce structurally-equivalent behavior. Genetic kin-selection is one specific instance of a broader class. Be careful with the inverse failure modes: (a) over-applying to behavior that's NOT actually altruistic when reciprocal benefit is direct; (b) explaining cooperation among non-kin via kin-selection when reciprocity or institution is doing the work; (c) treating Hamilton's rule as proving genes are 'selfish' in a moral sense — the rule is descriptive, not normative. Distinct from lex-ymvt4 differential-mating-success (Darwin sexual selection): lex-ymvt4 is about WHO REPRODUCES (mate-choice + competition); lex-5dnd9 is about INDIRECT-REPRODUCTION-VIA-RELATIVES. They are different selection regimes operating in the same population. Distinct from lex-yzuec triangular-awareness-enables-coalition-formation: lex-yzuec is the cognitive capacity for forming coalitions across non-kin; lex-5dnd9 is the genetic-channel that makes kin-favoritism evolutionarily stable. They compose — many real coalitions are kin-biased, and Hamilton's rule explains the bias. Distinct from lex-4ydm6 in-group-out-group-ethical-dualism: lex-4ydm6 is about ETHICAL ASYMMETRY; lex-5dnd9 is about THE EVOLUTIONARY ORIGIN of one important channel feeding that asymmetry. They compose. Distinct from lex-wjwuc collision-with-error: different domain entirely; included only to flag that Hamilton's rule does NOT depend on actor's reasoning about it — it operates at the gene-frequency level whether or not actors understand."
