id: lex-fjffq
name: insatiable-consumption-self-amplifies-the-appetite-it-feeds
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone tries to satisfy an appetite by feeding it, surface that some appetites (status, novelty, recognition, scroll) self-amplify with consumption — feeding makes them bigger, not smaller; the move is to cut supply or substitute."
related: [lex-spm8x, lex-k2kdc, lex-5kjya, lex-mwgep, lex-eghgf, lex-npyes, lex-vjcwu, lex-vw8c3, lex-kykwm, lex-2qekt, lex-patax]
evokes: [wiindigo, kimmerer-2013-windigo-footprints, the-more-it-eats-the-hungrier-it-becomes, anti-homeostatic-consumption, addiction-tolerance, solomon-corbit-opponent-process, robinson-berridge-incentive-sensitization, growth-imperative, veblen-positional-consumption, attention-economy-engagement-ratchet, hedonic-treadmill, faust-archetype]
lineage:
  - source: primary
    text: kimmerer-2013-windigo-footprints
    citation: "Robin Wall Kimmerer, *Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge, and the Teachings of Plants* (Milkweed Editions 2013). Chapter 'Windigo Footprints' (around line 10889 in pandoc extraction) grounds the transferable claim that there exists a class of consumption-dynamics in which feeding the appetite does not satiate it but amplifies it — a specifically anti-homeostatic-consumption pattern where the negative-feedback satiation signal is absent or has the wrong sign. Kimmerer's vehicle: the Anishinaabe Wiindigo figure, a human-turned-cannibal-monster of insatiable hunger whose 'heart is made of ice,' specifically characterised by 'the more a Windigo eats, the more ravenous it becomes.' Kimmerer's substantive cross-domain extension: industrial extraction economies operate at civilisational scale as Wiindigo at scale — consumption-growth-as-structural-requirement that cannot be satiated by any finite quantity. The atom names the structural feedback-sign-flip: where homeostatic systems have negative-feedback at the satiation stage (consume → satiated → stop), Wiindigo-systems have positive-feedback there (consume → larger appetite → consume more)."
    quote: "[Kimmerer 2013 Ch. 'Windigo Footprints', on the self-amplifying-appetite structure that IS the transferable claim:] 'It is said that the Windigo will never enter the spirit world but will suffer the eternal pain of need, its essence a hunger that will never be sated. The more a Windigo eats, the more ravenous it becomes. It shrieks with its craving, its mind a torture of unmet want.' [Ch. same, on the human-made character of the figure:] 'Windigos are not born, they are made. The Windigo is a human being who has become a cannibal monster. Its bite will transform victims into cannibals too.' [Ch. same, on the cultural-function reading of the figure as taboo-reinforcement during Little Ice Age winter-famine and the fur-trade overexploitation period:] 'Starvation in winter was a reality for our people, particularly in the era of the Little Ice Age... Some scholars suggest that Windigo mythology also spread quickly in the time of the fur trade, when overexploitation of game brought famine to the villages.' [Ch. same, on the cultural-name-for-extraction-pathology reading:] 'As the monster shrieked on the wind, the Windigo stories reinforced the taboo against cannibalism... Succumbing to such a repulsive urge doomed the gnawer of bones to wander as a Windigo for the rest of time.'"
  - source: practitioner
    text: cross-domain-anti-homeostatic-consumption-attestation
    citation: "Cross-domain attestation of the consumption-amplifies-appetite pattern across drug-pharmacology, behavioural-neuroscience, economics, and social-systems analysis. (a) Solomon & Corbit 1974 opponent-process theory of motivation (*Psychological Review* 81:119-145): every primary affective response generates an opposing process that strengthens with repeated exposure, so the 'kick' required to reach hedonic baseline grows. The OPERATIONAL mechanism for drug tolerance + withdrawal. The Wiindigo at the neurobiological scale. (b) Robinson & Berridge 1993 incentive-sensitization theory (*Brain Research Reviews* 18:247-291) + subsequent work: 'wanting' (dopaminergic incentive-salience) and 'liking' (opioid hedonic-impact) dissociate over chronic drug exposure — wanting amplifies even as liking diminishes. The addict's experience of craving-without-pleasure is the canonical Wiindigo state. (c) Brickman-Coates-Janoff-Bulman 1978 hedonic-treadmill (lottery-winners and accident-victims regress toward baseline life-satisfaction within months): material/positional gains that should produce permanent satisfaction-increase do not, requiring further gains to reach the same affective state. (d) Veblen 1899 *Theory of the Leisure Class* — positional/conspicuous consumption: status-value of goods is relative, so as everyone consumes more the bar shifts upward, requiring still-more consumption to maintain position. lex-5kjya (costly-conspicuous-waste-as-status-signal) names this directly; lex-fjffq names the more-general dynamic. (e) Herman Daly *Steady-State Economics* (1977, 1996) + Jason Hickel *Less Is More* (2020) + Tim Jackson *Prosperity Without Growth* (2009): the structural-growth-imperative of capitalist economies as anti-homeostatic — GDP-must-grow built into debt-finance, equity-return expectations, employment-stability requirements. Civilisational-scale Wiindigo. (f) Modern attention-economy + engagement-metric ratchet: platforms optimise for engagement → users develop attention-tolerance → platforms must extract more aggressively → more compulsive use with less subjective satisfaction. The Tristan Harris / Center for Humane Technology critique operationalises this in user-experience design. Cross-substrate attestation across pharmacology, behavioural neuroscience, hedonic psychology, sociology, ecological economics, and HCI / platform-critique. The unifying claim: a structural feedback-sign-flip at the satiation stage produces consumption that grows the appetite it feeds."
canonical-instances:
  - "Kimmerer's Wiindigo (Braiding Sweetgrass Ch. 'Windigo Footprints'): the Anishinaabe cultural figure made (not born) human-turned-cannibal-monster, 'heart of ice,' 'the more a Windigo eats, the more ravenous it becomes... its essence a hunger that will never be sated.' Operationalises the anti-homeostatic-at-satiation claim in cultural-figure form. Kimmerer's civilisational-scale extension: industrial extraction economies are Wiindigos at scale."
  - "drug tolerance + incentive-sensitization (Solomon & Corbit 1974 opponent-process; Robinson & Berridge 1993 incentive-sensitization): repeated drug exposure produces an opposing affective process that strengthens with each exposure, so larger doses are required to reach the same hedonic state — tolerance. Simultaneously the dopaminergic 'wanting' system amplifies even as opioid 'liking' diminishes — sensitization. The addict experiences craving without pleasure: the canonical neurobiological Wiindigo. lex-fjffq names the structural dynamic; pharmacology supplies the mechanism."
  - "Veblen positional / conspicuous consumption (Veblen 1899 *Theory of the Leisure Class*; lex-5kjya canonical-instance): status-value of goods is RELATIVE. As everyone consumes more, the bar shifts upward, requiring still-more consumption to maintain position. lex-5kjya names this specific case; lex-fjffq names the more-general dynamic that lex-5kjya specialises."
  - "the hedonic treadmill (Brickman, Coates & Janoff-Bulman 1978 *Journal of Personality and Social Psychology* 36:917-927): material and positional gains that should produce permanent life-satisfaction increase do not — subjects regress toward baseline life-satisfaction within months, requiring further gains for the same affective lift. The anti-homeostatic pattern in subjective-wellbeing form."
  - "growth-imperative as structural feature of industrial economies (Daly 1977 *Steady-State Economics*; Hickel 2020 *Less Is More*; Jackson 2009 *Prosperity Without Growth*): GDP-must-grow is structurally required by debt-finance, equity-return expectations, employment-stability. Failing-to-grow becomes recession-with-cascading-harms even when material consumption is sufficient by any biophysical measure. The civilisational-scale operationalisation Kimmerer points at — economies designed without a satiation-signal at the systemic level."
  - "attention-economy engagement ratchet (Tristan Harris / Center for Humane Technology; the post-2010 social-media critique literature): platforms optimise for engagement → users develop attention-tolerance → platforms must extract attention more aggressively → users experience more compulsive use with less subjective satisfaction. The same dynamic the addiction literature describes for substances, instantiated in HCI / platform-design. lex-fjffq names what designers are accidentally instantiating when they optimise the wrong metric without a satiation-stop."
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: feedback is the generic primitive; lex-fjffq names the specific satiation-stage-feedback-sign-flip variant. lex-fjffq uses lex-spm8x + adds the anti-homeostatic-at-satiation specification."
  - "operationally distinct from lex-k2kdc constitutive-defense-when-the-defense-generates-the-threat: both are wrong-sign-feedback-at-a-homeostatic-stage. lex-k2kdc sits at defense → threat; lex-fjffq sits at consumption → satiation. Sibling primitives, recognisably same shape, distinct stages."
  - "operationally distinct from lex-5kjya costly-conspicuous-waste-as-status-signal: lex-5kjya is positional-status-consumption (one specific instance). lex-fjffq generalises to any anti-homeostatic-consumption pattern; positional consumption is one canonical-instance."
  - "operationally distinct from lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories: lex-mwgep is path-dependence-flavoured (early-events amplify into lock-in). lex-fjffq is satiation-failure-flavoured (feeding makes hungrier on continuous basis). Both involve positive feedback; different system-stages."
  - "operationally paired with lex-eghgf honorable-harvest: Kimmerer's substantive structural reading. lex-eghgf names the protocol-internalising-reciprocity that holds the satiation stage in place (extraction that stops when enough is taken). lex-fjffq names what the system does when that protocol fails (extraction that cannot stop because consumption amplifies appetite). lex-eghgf is prescriptive; lex-fjffq is diagnostic. Co-fire in any extraction-system analysis: 'is there a satiation-stop?' if yes, lex-eghgf is operating; if no, lex-fjffq has taken hold."
critical-questions:
  - "is the consumption-system genuinely missing a satiation-signal, or just missing acknowledgement of one that exists? Diagnostic: where in the consumption-cycle does the negative-feedback that should produce satiation-and-stop fire? If it cannot be located, the system is structurally Wiindigo (lex-fjffq). If it exists but is being suppressed or overridden, intervention has a target (restore the satiation-signal). The honest answer often: industrial systems vary; some are structurally without satiation (growth-imperative), some have suppressed satiation-signals that could be restored (regulatory + cultural)."
  - "what is the operational satiation-signal in this domain? Diagnostic: name the specific mechanism that should stop the consumption at the satiation point. In addiction: receptor-saturation and post-ingestion satiety. In food: hunger-hormone signalling (leptin, CCK, GLP-1). In status: 'enough' culturally defined. In economics: 'sufficient' biophysical use. If you cannot name the satiation-signal, you cannot design around the Wiindigo dynamic."
  - "are you treating the symptom (more consumption per unit appetite) or the structure (the missing satiation-signal)? Symptom-treatments (rehab without addressing supply, more aggressive content-moderation without addressing engagement-metric, growth-slowdown without addressing growth-imperative) reliably fail because the underlying anti-homeostatic structure remains. Structure-treatments require institutional or cultural redesign — much harder, much rarer."
  - "is the Wiindigo at the individual or systemic scale? Individual-scale (one addict, one consumer) can sometimes be treated by individual-scale interventions (therapy, abstinence, mindfulness). Systemic-scale (capitalist growth-imperative; attention economy) requires systemic redesign. The categorical error of treating systemic-Wiindigo with individual-scale interventions (telling everyone to consume less, telling addicts to choose recovery) is one of the most common policy failures of the present era."
  - "does naming the dynamic give purchase, or just performative gesture? Kimmerer's substantive bet: naming Wiindigo in cultural terms gives purchase that abstract critique cannot. The named-figure encodes the moral stance + the dynamic + the failure-mode + the (in her telling) defeat-strategy together. Practitioner-question: in your domain, is there a named-figure or operational-name that gives the same purchase, or does the abstract critique have to do the work? If the latter, the critique may be operationally inert."
