id: lex-65etu
name: all-vice-is-love-misaimed-or-mismeasured
type-in: question
type-out: claim
_tier: atomic
agent-instruction: "When trying to diagnose the root cause of a broad category of failure modes (moral, motivational, organizational) rather than treating each failure as an unrelated case, check whether they reduce to a single generative variable — desire/love/motivating-attachment — miscalibrated along one of two independent axes: WRONG OBJECT (the desire is aimed at another's harm or diminishment) or WRONG MAGNITUDE (the desire toward a legitimate object is either too weak to pursue it or so strong it overshoots proportion). Dante's Purgatorio Canto XVII states this exactly. Virgil, asked what fault is purged on the terrace they have just reached, gives a general theory before naming the specific sin: 'Neither Creator nor a creature ever... was destitute of love / Natural or spiritual... Hence thou mayst comprehend that love must be / The seed within yourselves of every virtue, / And every act that merits punishment.' He then derives the taxonomy. Correctly-aimed, correctly-measured love cannot itself produce sin: 'While in the first it well directed is, / And in the second moderates itself, / It cannot be the cause of sinful pleasure.' The wrong-OBJECT failure is love turned toward a neighbor's harm, and Virgil further subdivides it by mechanism: 'by abasement of their neighbour, / Hope to excel' (pride — desiring another lowered so the self appears higher), fearing 'power, grace, honour, and renown... they may lose because another rises' (envy — desiring another's rise reversed), and being 'greedy for revenge' (wrath — desiring another harmed in return for injury). The wrong-MAGNITUDE failure is love toward a legitimate good calibrated badly in force: too little force is sloth ('languid love,' failing to pursue the good), too much force is the excess that becomes avarice, gluttony, and lust ('the love that yields itself too much'). Every one of the seven terraces of Purgatorio derives from this single generative variable and its two failure-axes; the taxonomy is not seven independent vices but one mechanism instantiated three ways on one axis and further instantiated on a second axis. The mechanism transfers beyond moral theology to any domain where a wide array of surface-distinct failure modes turn out to share one generative motivational variable with the same two failure-axes: an organization's dysfunctions (undermining colleagues to look better by comparison — wrong object; giving up too easily on a hard but worthwhile initiative — deficient magnitude; over-investing resources in a project past the point of proportionate return — excessive magnitude) may all trace to a single variable (what the organization actually rewards attention and effort toward) miscalibrated in one of these same ways, rather than requiring seven unrelated fixes. Diagnostic: when facing an apparently large and heterogeneous set of failure modes, before treating each as requiring its own bespoke explanation, ask whether they share a single generative variable (what is being desired, attended to, or invested in) that is failing along only two possible axes — wrong target, or right target at the wrong intensity. If so, the practitioner-lever is not seven separate interventions but recalibrating the single variable along whichever axis is actually miscalibrated."
related: [lex-pbdbb, lex-x3hgq, lex-xehnw]
evokes: [purgatorio-canto-xvii, virgils-taxonomy-of-love, love-is-the-seed-of-every-virtue-and-vice, wrong-object-vs-wrong-measure, languid-love, love-that-yields-itself-too-much, three-modes-of-malice, the-seven-terraces-reduce-to-one-variable]
lineage:
  - source: primary
    text: dante-purgatorio-canto-xvii-loves-taxonomy-of-vice
    citation: "Dante Alighieri, Purgatorio, Canto XVII (part 2 of the Divina Commedia, composed c. 1308-1320), trans. Henry Wadsworth Longfellow (Boston: Ticknor and Fields, 1867; Project Gutenberg eBook #1004, 'Divine Comedy, Longfellow's Translation, Complete'). Standing at the boundary between the lower terraces (malice toward one's neighbor) and the upper terraces (excessive love of legitimate goods), Virgil delivers the structural theory underlying all seven terraces of Purgatorio: every vice and virtue is love, correctly or incorrectly calibrated."
    quote: "[Virgil's general claim:] 'Neither Creator nor a creature ever... was destitute of love / Natural or spiritual... Hence thou mayst comprehend that love must be / The seed within yourselves of every virtue, / And every act that merits punishment.' [Correctly-calibrated love cannot sin:] 'While in the first it well directed is, / And in the second moderates itself, / It cannot be the cause of sinful pleasure.' [The three wrong-object modes:] 'There are, who, by abasement of their neighbour, / Hope to excel, and therefore only long / That from his greatness he may be cast down; / There are, who power, grace, honour, and renown / Fear they may lose because another rises, / Thence are so sad that the reverse they love; / And there are those whom injury seems to chafe, / So that it makes them greedy for revenge.' [The wrong-magnitude modes:] 'Now of the other will I have thee hear, / That runneth after good with measure faulty... If languid love to look on this attract you, / Or in attaining unto it... / The love that yields itself too much to this / Above us is lamented in three circles.'"
canonical-instances:
  - "The direct textual anchor: Virgil derives all seven terraces of Purgatorio from one generative variable (love) miscalibrated along two axes — wrong object (pride, envy, wrath) and wrong magnitude, deficient (sloth) or excessive (avarice, gluttony, lust)."
  - "An organization's apparently unrelated dysfunctions — colleagues undermining each other to look better by comparison, a team abandoning a hard but worthwhile initiative at the first setback, a division over-investing resources in a pet project past the point of proportionate return — may all trace to a single variable (what the organization actually rewards attention and effort toward) miscalibrated along the same two axes, rather than requiring seven unrelated fixes."
  - "A person's scattered self-improvement failures (comparing themselves destructively to peers, giving up on valuable habits too readily, overcommitting obsessively to others) can be diagnosed as one motivational variable miscalibrated in different instances rather than as unrelated character flaws each requiring separate willpower."
critical-questions:
  - "isn't this the same as lex-pbdbb (Aristotle's doctrine of the mean)? No — Aristotle's mean doctrine addresses only ONE of this atom's two failure-axes (magnitude: deficiency and excess flanking a virtuous mean), applied separately to each of many distinct virtues (courage, temperance, generosity), with no single generative substance connecting them. This atom's claim is broader on two counts: it adds a second, independent failure-axis (wrong OBJECT — desire aimed at another's harm, which has no place in Aristotle's per-virtue magnitude-mean at all), and it claims all instances of both axes share ONE generative variable (love/desire) rather than being separately-calibrated virtues. Aristotle gives a procedure for finding each mean; Dante gives a monistic theory of what is being miscalibrated across the entire moral field."
  - "isn't this the same as lex-x3hgq (Augustine's ordo amoris, life-direction set by the ordering of loves)? No — lex-x3hgq concerns the RANK-ORDER among multiple distinct loves (loving a lesser good more than a greater one shapes an agent's trajectory). This atom concerns the CALIBRATION of a single love-instance along two axes (object and magnitude), independent of how it ranks against other loves. A love could be correctly ranked relative to other loves and still be miscalibrated in object or magnitude (e.g., proportionate love for a friend that curdles into envy at the friend's success is a wrong-object failure regardless of rank), or correctly calibrated in object and magnitude while badly ranked against a higher love. They compose but answer different diagnostic questions — lex-x3hgq asks 'what does this agent love most,' this atom asks 'is this specific love aimed right and sized right.'"
  - "isn't envy (lex-xehnw) or the specific vices just being renamed here? No — lex-xehnw and similar atoms describe the OPERATIONAL SIGNATURE of individual vices (envy tracks visible, proximate advantage). This atom names the GENERATIVE STRUCTURE that explains why the terraces cluster the way they do and why a widely scattered set of failure modes can share one root cause. It composes with, rather than replaces, atoms describing individual vices' specific mechanics — Dante's own text treats pride, envy, and wrath as three DISTINCT modes of the same wrong-object failure, so the taxonomy operates one level of abstraction above any single vice's operational signature."
  - "does this atom claim every failure mode reduces to love-miscalibration, even ones with no moral or motivational content? No. The claim is scoped to failure modes that ARE generated by a motivating attachment or desire — moral vices, organizational dysfunctions rooted in what is valued or rewarded, personal-development failures rooted in what a person cares about. It does not claim that failures with no motivational component (a mechanical fault, a factual error unconnected to any desire) reduce to this structure. The diagnostic value is in recognizing when a wide, seemingly disparate set of MOTIVATED failures shares one variable, not in forcing every failure into a motivational frame."
