id: lex-8vqvy
name: externalities-are-reciprocal-the-question-is-which-harm-to-avoid
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a conflict is framed as 'A is harming B; how do we restrain A?' (factory smoke harms neighbours, confectioner's noise harms the doctor next door, cattle damage the neighbouring farmer's crops, the new building shades the neighbouring hotel), refuse that framing. The harm is RECIPROCAL: restraining A to spare B inflicts a corresponding harm on A (lost production, abandoned activity, reduced value). The real question is not 'who is the offender?' but 'which harm is the more serious to avoid, given the values at stake?' This dissolves the standard victim-vs-offender frame. Operational moves: (i) name what A loses if restrained, in the SAME units (or with the same weight) as what B loses if unrestrained; (ii) recognize that the legal rule allocates WHO PAYS, not WHICH ALLOCATION is reached when bargaining is cheap (Coase's allocation-independence claim under zero transaction costs) — when bargaining is expensive (the realistic case), the rule's allocation of liability shapes the outcome by determining who must initiate the bargain; (iii) treat the total value of production (or the joint welfare of all parties) as the optimization target, not the protection of one party from the other; (iv) be cautious of Pigovian-style 'tax the polluter' framings — they assume a one-way causation Coase's reciprocal-framing dissolves."
