id: lex-r34dy
name: a-careless-third-party-promise-binds-the-uninvolved-person
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Be careful what you offer as a reward when the thing being offered is a person who wasn't consulted -- once the offer is made and someone claims it, the social system built around honoring such promises can bind the uninvolved party regardless of what she actually wants. In Cushing's telling, the Prey-gods offhandedly promise their sister as a wife to 'whoever would kill the speckled Demon,' with no indication she agreed to this or was even present when it was said. When a Coyote arrives claiming the reward, her outrage at being claimed at all -- 'Impertinent scoundrel!... I have never been married!' -- gets no traction whatsoever once he produces the proof: 'the poor girl said not a word, but sat there' and 'had to submit.' The brothers who made the promise never intended to consult her about who would collect it; the reward's whole value to them was that it cost them nothing to offer, since it was never theirs to give in the first place. Diagnostic move: when you're tempted to offer someone else, their time, their loyalty, their hand in marriage, as an incentive to motivate a third party, recognize that you're not actually paying the cost of your own offer -- the person you've offered is the one who bears it, often without ever having agreed to be part of the transaction at all, and the more binding your community treats such promises, the less recourse they have once someone comes to collect."
