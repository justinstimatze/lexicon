lineage:
  - source: primary
    text: radin-winnebago-tradition-fixes-plot-but-leaves-style-open-to-the-raconteur
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'Winnebago Mythology and Literary Tradition.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "In short, no marked departure from a traditional plot or from the specific literary tradition is countenanced. ... The strict conformists and 'classicists' among the raconteurs would manifestly try to preserve the exact language of a predecessor. However, fidelity was not demanded of him. In fact, an audience generally preferred and valued a raconteur in terms of his own style and phrasing, that is, in terms of his own personality. We must never forget that we are not dealing here with narratives that were written down. Every narrative was, strictly speaking, a drama where as much depended upon the acting of the raconteur as upon his actual narration."
canonical-instances:
  - "A stand-up comedian performing a well-worn bit structure that every comedian in the genre uses gets judged entirely on timing, phrasing, and persona rather than on inventing a new structure, and audiences return specifically for that comedian's particular delivery of familiar material."
  - "A jazz musician playing a jam-session standard everyone in the room already knows keeps the chord changes and form completely intact while the actual notes, phrasing, and personal voice in the solo are where all the individual expression and audience interest concentrate."
critical-questions:
  - "Does this distinction between fixed plot and free style hold uniformly across all Winnebago narrative genres, or does Radin's account suggest some myths permitted more structural latitude than others, undermining a single clean rule?"
  - "Is audience preference for personal style over verbatim fidelity specific to oral performance traditions, or does it also hold for written or recorded traditions where the audience can directly compare two fixed texts side by side?"
  - "Could a raconteur's stylistic latitude eventually accumulate into what amounts to a plot change, and if so, where does Winnebago tradition draw the line between acceptable stylistic variation and unacceptable structural departure?"
