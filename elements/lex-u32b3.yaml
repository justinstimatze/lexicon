    citation: "Clifford Stoll, The Cuckoo's Egg (Doubleday, 1989). Nonfiction memoir; in-copyright, quoted here under fair use in short, attributed excerpt for critical/analytical commentary. Two passages: Stoll discovering a hidden file at an Army base in Anniston, Alabama, that the hacker returns to and re-uses three months after planting it; and Stoll noticing the hacker reset four separately-stolen accounts to the identical new password in a single session."
    quote: "The hacker had laid this egg on July 3, yet remembered exactly where he'd hidden it three months later. He didn't guess or hunt around for the .d file. No, he went straight for it. [...] This hacker must be keeping track of what he's done. [...] A kid on a weekend lark doesn't keep detailed notes. [Chapter 18] He picked the same password for four different accounts. If there were four different people involved, they'd each have a separate account and password. [...] I had to be following a single person. [Chapter 19]"
canonical-instances:
  - "Stoll identifying a single persistent actor in The Cuckoo's Egg: a three-month-old hidden file retrieved without hesitation, and four stolen accounts reset to one identical password in a single session, are both read as the signature of someone disciplined and methodical enough to be effective — and that same discipline is what makes the sessions correlatable as one actor rather than several."
  - "criminal profiling and repeat-offense linkage: a burglar's or serial offender's consistent modus operandi (entry method, timing, object selection) links otherwise-separate crimes to one perpetrator, because deviating from a working method would cost them effectiveness even though it would also cost them detectability."
  - "automated bot- and fraud-detection: a script's suspiciously perfect timing regularity or transaction-structure consistency — the byproduct of always executing the identical optimized routine — is what flags it despite IP rotation or account cycling, because randomness would look more like ordinary human noise."
critical-questions:
  - "how does this differ from lex-zfgj2 (conjectural-reasoning-from-traces-to-concealed-cause)? lex-zfgj2 names the general epistemic mode of inferring a concealed cause from minute observable traces (Ginzburg's conjectural paradigm — a hoofprint implies a horse). This atom names a narrower, more specific claim about WHAT KIND of trace is most diagnostic in an adversarial, repeated-interaction setting: not any trace, but the specific trace produced by the disciplined consistency an actor NEEDS in order to be competent at their task. lex-zfgj2 covers a single inference from a single trace; this atom is about why REPEATED traces from a skilled, disciplined actor are unusually correlatable across separate incidents, and why that correlatability is not a flaw in their tradecraft but an unavoidable cost of the tradecraft being good."
  - "doesn't better discipline mean better evasion, i.e. shouldn't a smarter attacker vary their methods precisely to avoid this fingerprint?  In principle, yes — and the atom names exactly the tension a sophisticated actor has to manage: deliberately randomizing methods trades effectiveness (relying on practiced, memorized routines) for reduced correlatability. The claim isn't that discipline-as-fingerprint is unavoidable in all cases, only that it's the DEFAULT outcome absent a deliberate, costly countermeasure, and that most real intruders — like Stoll's hacker — don't pay that cost, because doing so would undermine the very reliability that makes their operation sustainable over months."
  - "is this just saying 'patterns exist,' too general to be useful? No — the atom's specific, actionable content is the DIRECTION of the inference: don't look for what makes an actor careless or sloppy as the identifying signal; look for what makes them GOOD at what they're doing, since that competence-supporting consistency is what survives across separate incidents and produces the correlatable signature. A defender who is only watching for mistakes will miss a disciplined actor; a defender watching for competence-consistent repetition will find them."
