    text: distinctness-audit-against-milgram-browning-lifton-preference-falsification-panopticism
    citation: "No existing atom grounds Snyder's specific claim — voluntary pre-emptive compliance with an unstated, unissued demand, as a mechanism of authoritarian power-expansion. The substrate's sole prior 'Snyder' reference (lex-b2r4u) is an unrelated citation to a different historian, Louis Snyder, cited by Robinson 1983 on Anglo-Saxonism, with zero overlap. Lex-0152 (obedience-to-authority, Milgram) turns on compliance with an order an authority figure has already issued and is actively present to reinforce (the scripted four-prod escalation); this atom's mechanism requires no order to exist at all — the anticipating party is guessing at an unstated future wish. Lex-0557 (Browning, Ordinary Men) is distinct under the project's Milgram/Browning/Arendt framing: Browning's Reserve Police Battalion 101 men at Józefów were already given an explicit order and an explicit opt-out, and the analytical question there is why so few took an offered exit from an order already on the table — this atom precedes any order or opt-out point. Lex-0465 (Lifton, doubling) names the self-organization split that sustains someone already embedded in an atrocity-committing institutional role over months or years; this atom is typically the entry-level act taken by people not yet embedded in any such role. Lex-0754 and lex-x3hgq (Sartre's bad faith, Augustine's ordo amoris) are adjacent complicity/self-evasion frameworks cited within lex-fjzum, but none names Snyder's specific pre-emptive-guessing-at-an-unstated-demand mechanism. Lex-0504 (preference falsification, Greene/Mill/Kuran) conceals an existing private belief under an already-established, known cost of disclosure; lex-zfxbw (panopticism, Foucault) operates under a known rule plus unverifiable observation of compliance with that rule. Both require an already-existing cost regime or rule; this atom requires neither — it is the case where the demand, the rule, and the cost regime do not yet exist and the actor is guessing at all three. All six related atoms are genuine adjacencies in the obedience/complicity/self-adjustment cluster; none restate Snyder's specific claim."
canonical-instances:
  - "The German 1932 / Czechoslovak 1946 elections (Snyder, Lesson 1): in both cases the 'next crucial step' toward full regime change was not a new law but anticipatory obedience — enough citizens and professionals voluntarily extended their services to the incoming leaders, before compulsion existed, that the new leadership realized it could move quickly. 'The first heedless acts of conformity could not then be reversed.'"
  - "Austria, March 1938, following the Anschluss: non-Nazi Austrian neighbors and professionals spontaneously joined in forcing Jewish Austrians to scrub streets and in looting marked Jewish property, entirely ahead of any German directive to do so. This anticipatory obedience directly taught the Nazi leadership what was newly possible: Eichmann's Central Office for Jewish Emigration opened in Vienna that August, and the national Kristallnacht pogrom that November explicitly followed the Austrian example."
  - "The SS, 1941, on the invasion of the Soviet Union: SS units took the initiative to devise the operational methods of mass killing without having been ordered to do so, 'guessing what their superiors wanted' — the resulting escalation was, in Snyder's account, 'far more than Hitler had thought,' demonstrating that anticipatory obedience by actors already inside a hierarchy can outpace the demands the hierarchy's own leadership had actually formed."
  - "A modern cross-domain analogue (constructed, transferable form rather than a named case): an organization's legal, compliance, or editorial staff pre-emptively narrowing what speech, research, hiring, or content it will permit in anticipation of a new leader's, regulator's, or funder's guessed preferences — before any policy, rule, or law has actually been announced. The diagnostic mark distinguishing this from ordinary caution is that the adjusting party cannot point to an actual demand, only to its own guess about one; per Snyder's mechanism, the pre-emptive adjustment itself becomes the evidence the power later cites for what it may formally require."
critical-questions:
  - "Is this actually anticipatory — has no demand been issued yet at all — or is it compliance with an already-issued-but-informal or merely-verbal demand? If an order exists in any form, even unwritten, the operative mechanism shifts toward lex-z9s5d (Milgram-style obedience to an issued instruction), not this atom's pre-emptive-guessing mechanism. The distinction matters because the corrective differs: refusing an issued order is defiance; declining to guess at an unissued one is simply continuing to act as before."
  - "What specific signal is the anticipating party actually reading — a leader's rhetoric, an election result, a rumor, a new manager's tone, a market anxiety — and could they be wrong about what is actually wanted? Snyder's cases show the guess is frequently self-fulfilling and disproportionate to any signal actually given (the SS 'guessed' an escalation 'far more than Hitler had thought'); the anticipating party's guess, once acted on, becomes the new floor rather than a correct reading of an actual demand."
  - "Does refusing to anticipate carry a real cost that the corrective discipline (continue acting as before; do not obey in advance) underweights? Snyder does not deny this cost exists — he argues the cost of refusal is precisely what gets exploited, and that the cost of refusal RISES specifically because others have already pre-complied ('the first heedless acts of conformity could not then be reversed'). The practical question in any specific case is whether the actor is early enough in that ratchet that refusal is still cheap, or late enough that the social cost has already been set by others' anticipatory obedience."
  - "Has anticipatory obedience already occurred and been rewarded, such that it has become the new expected baseline — meaning NOT anticipating now reads as active defiance requiring its own justification? This composes with lex-y48fs (pyramid-of-choice) and lex-egkjk (shifting-baseline): each round of anticipatory obedience that goes unresisted resets what counts as normal compliance for the next round, independent of any new demand being issued."
  - "Is the anticipating actor an ordinary bystander or professional not yet embedded in any institutional atrocity-role (Snyder's core Austria 1938 case), or already inside a hierarchy that has begun issuing at least partial instructions (closer to the SS 1941 case, which shades toward lex-fjzum doubling)? The further into an institutional role the actor already is, the more the relevant substrate atom shifts from this one toward lex-fbc4r or lex-fjzum."
