id: lex-5ksmy
name: information-wants-to-be-both-free-and-expensive
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when someone invokes 'information wants to be free' as a simple, one-sided justification — for open access, for piracy, for why paywalls are doomed — or when someone invokes its mirror ('but IP has value, it deserves a price') as an equally simple refutation. Both readings truncate the actual claim. Stewart Brand's original formulation, spoken at the first Hackers Conference (1984) and recorded by Steven Levy: 'On one hand, information wants to be expensive, because it's so valuable... On the other hand, information wants to be free, because the cost of getting it out is getting lower and lower all the time. So you have these two fighting against each other.' The claim is that BOTH pulls act on the SAME information SIMULTANEOUSLY, not that one side wins: valuable information is expensive to produce/verify/curate (justifying a price), while the marginal cost of copying and distributing it keeps falling (undermining any price). Levy notes the phrase is 'so often misquoted' — collapsed to just the free half — which strips the tension that gives it predictive power. Operational use: (1) when you see the free-half quoted alone, ask what the expensive-half correspondingly implies for the SAME case (what was costly to produce, verify, or first discover?); (2) don't treat the phrase as resolved in either direction — it names a standing structural tension that different information goods settle differently depending on production cost vs. copying cost, not a law that always resolves toward openness; (3) distinguish this from Richard Stallman's related but different claim (also present in Levy's account) that free should mean 'free as in freedom' (unencumbered use) rather than 'free as in beer' (zero price) — Brand's tension is about the ECONOMICS of information (cost to make vs. cost to copy); Stallman's distinction is about what FREE even MEANS. The concrete generative mechanism behind the 'wants to be free' pull, per Levy's account of the MIT hacker culture: unrestricted internal circulation of tools ('Tools to Make Tools,' shared subroutines kept in a drawer by the console) let anyone build on the best existing version instead of separately re-deriving it, raising the community's aggregate rate of improvement — a real, demonstrated mechanism, not merely an ideological slogan, but one that coexists with (not replaces) the expensive-half of the tension."
related: [lex-r37df, lex-ea48g, lex-p9dfj, lex-fe26z]
evokes: [tools-to-make-tools, information-wants-to-be-expensive-too, so-often-misquoted, free-as-in-freedom-not-free-as-in-beer, two-pulls-fighting-against-each-other]
lineage:
  - source: primary
    text: levy-1984-hackers-heroes-of-the-computer-revolution
    citation: "Steven Levy, Hackers: Heroes of the Computer Revolution (Anchor Press/Doubleday, 1984; 25th Anniversary Edition, O'Reilly Media, 2010, with author's afterword)."
    quote: "[Chapter 2, 'The Hacker Ethic,' on the MIT TX-0 hackers, 1959-61 era:] All information should be free. If you don't have access to the information you need to improve things, how can you fix them? A free exchange of information, particularly when the information was in the form of a computer program, allowed for greater overall creativity. When you were working on a machine like the TX-0, which came with almost no software, everyone would furiously write systems programs to make programming easier—Tools to Make Tools, kept in the drawer by the console for easy access by anyone using the machine. This prevented the dreaded, time-wasting ritual of reinventing the wheel: instead of everybody writing his own version of the same program, the best version would be available to everyone, and everyone would be free to delve into the code and improve on that. [From the 25th Anniversary afterword (2010), recounting the first Hackers Conference, Marin County, 1984, the week of the book's original publication:] It was there that Stewart Brand, hacker godfather and Whole Earth Catalog editor, hacked the 'Information Should Be Free' principle. It's worth citing his comment, uttered off the cuff at a session I hosted called 'The Future of the Hacker Ethic,' because it's so often misquoted. 'On one hand, information wants to be expensive, because it's so valuable,' Brand said. 'The right information in the right place just changes your life. On the other hand, information wants to be free, because the cost of getting it out is getting lower and lower all the time. So you have these two fighting against each other.' A quarter-century later, Brand's rephrasing is so familiar that it's become an adjective (critics talk about the 'information-wants-to-be-free crowd'). But the entire quotation neatly encapsulates the tension that has defined the hacker movement... Hackers want information to be free—not necessarily free as in beer, but free as in freedom, to quote Richard Stallman. (Levy, Hackers, Ch. 2 and 25th Anniversary Afterword.)"
canonical-instances:
  - "operationally distinct from lex-p9dfj designed-procedural-friction and lex-fe26z by-product-theory-collective-action: both concern what sustains a collective or institutional good, but neither states this atom's specific two-sided-simultaneous-tension claim (the same information is expensive to originate and cheap to copy at once), nor the free-as-in-freedom/free-as-in-beer distinction."
  - "Open-source software licensing debates recreate the same tension by name: free software (GPL, 'free as in freedom') vs. freeware/gratis software (zero price, 'free as in beer') are frequently conflated by critics and defenders alike, exactly the collapse Levy flags — and separately, the actual economics of open source (expensive to build well, cheap to copy once built) reproduce Brand's expensive/free tension independent of the freedom/beer licensing question."
  - "Academic publishing: journal articles are expensive to produce (peer review, editorial curation, the research itself) yet, once digitized, cost near-zero to copy and distribute — the open-access movement is a decades-long, still-unresolved argument about which pull should govern, not a case where one side has definitively won."
  - "A company's internal knowledge base or a startup's core algorithm: expensive to develop (the R&D, the tacit expertise), but once written down becomes trivially copyable within or beyond the organization — leadership's instinct to lock it down (expensive-pull) and employees' instinct to document and share it for collective velocity (free-pull, the actual Tools-to-Make-Tools mechanism) are both locally rational responses to the same underlying tension, not a dispute where one side is simply wrong."
critical-questions:
  - "Doesn't 'information wants to be free' just mean prices trend toward zero over time, so isn't the tension resolved in practice? No — Brand's point, and Levy's reason for calling out the misquotation, is that the EXPENSIVE pull doesn't go away as copying costs fall; the cost of ORIGINATING valuable information (research, verification, first discovery, curation) doesn't fall at the same rate copying costs do, so the tension persists even as distribution gets cheaper. Treating the phrase as a one-way prediction (prices → zero) drops exactly the half that explains why paywalls, patents, and trade secrets keep recurring rather than disappearing."
  - "Is this just supply-and-demand with extra branding? The added, checkable content is the SIMULTANEITY claim: the same unit of information carries both pulls at once (not that some information is expensive and other information is free), and the specific mechanism Levy documents for the free-half (Tools to Make Tools — shared internal circulation raising a community's collective improvement rate) is a real, demonstrated causal pathway, not merely a restatement of falling marginal cost."
  - "Does 'free as in freedom, not free as in beer' collapse this atom into a licensing/IP-law question? No — that distinction (Stallman's, reported by Levy) answers what kind of freedom is being claimed once you've decided to release something; Brand's tension is about whether and how much to release in the first place, given that the same information is simultaneously costly to make and cheap to copy. The two questions compose (you can want freedom-not-price for something you've decided, via the expensive/free tension, to release) but are not the same question."
