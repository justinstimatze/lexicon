id: lex-5c3kt
name: an-internalized-precommitment-is-recalled-at-the-exact-moment-of-temptation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "At the precise moment when an impulsive act is both possible and emotionally justified, a previously internalized commitment can be recalled and honored even at high personal risk, overriding the immediate incentive — a restraint mechanism functioning at the moment of maximum temptation itself, rather than earlier as a standing rule announced in advance. In the Jataka's tale of Dighitikosala, a prince holding his father's killer at swordpoint recalls his parents' counsel at the exact instant of striking: 'at the very moment when he was brandishing his sword, he recalled the advice given him by his parents and he thought, \"Though I should sacrifice my own life, I will not trample under foot their counsel. I will content myself with frightening him.\"'"
related: []
evokes: [jataka, pancanipata, dighitikosala-jataka, precommitment-recalled-at-peak-temptation, restraint-overrides-a-justified-impulse]
lineage:
  - source: primary
    text: jataka-chalmers1895-dighitikosala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book V (Pancanipata), No. 371, Dighitikosala-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "And at the very moment when he was brandishing his sword, he recalled the advice given him by his parents and he thought, \"Though I should sacrifice my own life, I will not trample under foot their counsel. I will content myself with frightening him.\""
canonical-instances:
  - "A trader with a finger on the button to dump a position out of pure spite toward a rival firm, in a moment where doing so is both possible and would feel entirely justified, recalls a mentor's old rule about never trading on emotion — and closes the terminal instead."
critical-questions:
  - "Is recalling the commitment at the moment of temptation actually reliable, or does it depend on the strength of the original counsel and the specific person's capacity for that kind of in-the-moment recall, meaning it can't be counted on as a general safeguard?"
  - "Does honoring the precommitment here actually produce the better outcome, or does restraint in this specific case simply delay a reckoning that the sparing itself sets up for later in the story?"
status: active
