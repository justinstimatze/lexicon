id: lex-69beq
name: giving-someone-something-to-lose-preempts-worse-behavior
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Deliberately giving someone something valuable to lose can function as a preemptive corrective for a person prone to worse behavior, distinct from punishment after the fact -- once they have an acquired comfort they fear losing, the fear of that specific loss becomes the deterrent that keeps them from the more destructive path they would otherwise have taken. Philosophy gives the mechanism as a specific case: 'there is one, perhaps, whose nature is so reckless and violent that poverty would drive him more desperately into crime. His disorder providence relieves by allowing him to amass money. Such a one, in the uneasiness of a conscience stained with guilt, while he contrasts his character with his fortune, perchance grows alarmed lest he should come to mourn the loss of that whose possession is so pleasant to him. He will, then, reform his ways, and through the fear of losing his fortune he forsakes his iniquity.'"
related: []
evokes: [consolation-of-philosophy, book-iv-prose-vi, his-disorder-providence-relieves-by-allowing-him-to-amass-money, fear-of-losing-his-fortune, a-stake-in-good-behavior]
