id: lex-ujewy
name: precision-miscalibration-produces-opposite-clinical-profiles
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when two clinical or behavioral profiles look like they must have opposite causes because their symptoms are opposite (one person clings to bizarre beliefs against all counter-evidence; another can't generalize past literal sensory particulars) — and check whether they're actually the SAME dial mis-set in opposite directions rather than two unrelated mechanisms. Hohwy's claim, synthesizing the predictive-processing account of psychosis and autism: a single computational parameter — the system's EXPECTED PRECISION (confidence/reliability estimate) assigned to incoming sensory prediction-error — produces two clinically opposite profiles depending on which direction it's mis-set, because the same knob controls the balance between trusting raw sensory input and trusting top-down priors. Direction one (over-estimating noise): 'a persistent, exaggerated expectation for noise and uncertainty would lead to imprecise sensory prediction errors mediated by low gain on sensory input and heightened reliance on top-down priors. An individual who constantly expects the sensory signal to be noisier than it really is will then tend to be caught in his or her own idiosyncratic interpretations of the input and will find it hard to rectify these interpretations' — this is offered as a parsimonious, content-neutral account of delusion formation in psychosis: because assessing a signal's precision doesn't require knowing what the signal is ABOUT, the same disturbance can generate wildly heterogeneous delusional content (a doctor is 'out to get them,' or bizarre beliefs about foreign objects in one's tooth) while remaining ONE mechanism. Direction two (under-estimating noise): 'A perceiver who expects very precise prediction errors will increase the gain on bottom-up prediction error and will rely relatively more on the senses than on prior beliefs... There is a kind of enslavement by the senses, a pre-occupation with local sensory content, extended sampling, intolerance of change in circumstances, and lack of coherence under global models' — offered as an account of the autism-spectrum profile of weak central coherence: over-trusting raw sensory particulars starves the system's ability to generalize into higher-level regularities, producing 'particularist, lookup-table' learning that struggles precisely where context-sensitive generalization is required (e.g. mentalizing — inferring others' hidden mental states from behavior, which depends on flexible, context-dependent inference rather than one-one sensory-to-meaning mappings). Practitioner move: when two profiles present as opposite failure modes, check whether they share a single underlying regulatory parameter before assuming separate mechanisms — the diagnostic question is not 'what's different about these two conditions' but 'is there one dial that, turned too far in either direction, produces each.' This also predicts WHERE the two profiles should diverge most sharply: under rising uncertainty, delusion-prone systems should lean further into priors (worsening reality-testing) while precision-over-trusting systems should keep sampling the senses longer than is adaptive (both are the same dial, pushed further toward its already-mis-set position)."
