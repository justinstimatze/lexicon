id: lex-psr5s
name: a-boundary-that-absorbs-intrusion-cant-be-violated-by-it
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Instead of defending a work's boundary against accidental intrusion by trying to keep every disruption out, a maker can redesign the boundary so that intrusion is no longer capable of violating it -- absorbing the accident as content rather than excluding it as contamination. John Cage built his practice around exactly this move: Hyde writes that 'Cage defines modern art as art which cannot be disrupted by nonart. It is permeable, open at its edges. A baby's cry at a classical music concert is usually a distraction, a noise, a bother. Cage lets it be part of the event, just as some modern painters have let the dust that settles on their canvases become part of the painting (a famous example is Marcel Duchamp, who let his Large Glass gather dust for months, then fixed a portion of it with varnish).' The classic response to an intrusion is to treat it as an impurity to be removed so the 'true' event can be heard or seen underneath. Cage's move is different in kind, not just in tolerance: he doesn't merely permit the baby's cry, he redefines the piece so that a cry occurring during it simply becomes part of what the piece is, which means there's no longer any intrusion left to defend against. Diagnostic move: when protecting something from unpredictable disruption feels like an endless, unwinnable defensive project, consider whether the more durable fix is not better exclusion but a redefinition of the thing's boundary broad enough that disruption can no longer count as a violation -- the fortress that keeps losing to what gets through it is fighting the wrong problem; a boundary that has nothing outside it to worry about cannot be breached."
