id: lex-bvjvu
name: an-opportunistic-strike-on-a-bystander-only-pays-if-it-wins-a-lasting-ally
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a distracted, more powerful bystander presents a tempting opening to weaken them opportunistically, don't take the shot just because the opening exists -- check whether the strike converts into a durable relationship, because without that, the tactical gain evaporates while the new enmity doesn't. Kautilya analyzes the case of striking at a Middle or Neutral king -- a power bigger than either the conqueror or his enemy -- while that king is distracted fighting a third party. Rangarajan summarizes the resolution: 'Who comes out better out of this operation, may depend on the third king attacked by the Middle or Neutral king since the third king may become a friend as a result of the help given by the rear attack... In short, an attack-in-the-rear on the Middle or Neutral king is worth making only if it wins an ally.' The reasoning is asymmetric in a way that matters: the Middle or Neutral king is too powerful to actually be weakened in any lasting way by an opportunistic rear-strike, so any material gain from the attack is temporary, while the resentment it generates in a much stronger power is not temporary at all. The one thing that can make the strike worthwhile despite that asymmetry is if it produces a durable side-effect the temporary material gain can't -- specifically, winning over the third party the Middle king was fighting, who now has reason to see you as a helpful patron rather than a bystander's aggressor. Without that conversion into a lasting relationship, the move is pure downside: a fleeting gain against a target you can't actually damage, purchased at the cost of a durable grudge from a power that outclasses you. Diagnostic move: before taking an opportunistic shot at a powerful, currently-distracted party, ask specifically what would remain yours after the distraction ends and the opening closes -- if the answer is only a temporary material gain and the target is too strong for that gain to matter long-term, the move only makes sense if it also produces a durable relationship (a grateful third party, a new ally) that survives the closing of the window; if it doesn't, the lasting cost of the new enmity outweighs the fleeting gain."
