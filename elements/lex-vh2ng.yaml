id: lex-vh2ng
name: too-little-contact-with-the-lowly-world-harms-the-elevated-too
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Distance from what's messy, mortal, or beneath you isn't a purely protective good where more is always safer -- there's a working middle range, and pushing distance to its maximum can starve and destroy the elevated position exactly as surely as too little distance can contaminate it. Hyde makes this explicit about the gods needing contact with humanity: 'heavenly essences are vulnerable not just to the return of earthly accidents but to their absence as well. The gods need distance from earth, but not too much. They can be wounded by the return of rubbish, but they can also suffer if they have no contact with whatever is beneath them.' He names the mechanism directly: 'the gods need to be fed by human beings; gods who aren't, who have no real contact with the lowly time-infected earth, may starve and disappear even as their perfection increases, like anorexics whose lethal idealism forbids all contact with the world of changing bodies. What the gods need, it seems, is some sort of \"right distance,\" neither too much contact nor too little.' Increasing purity or elevation past a certain point doesn't make the elevated thing safer or stronger; past that point, the same trajectory that looked like protection starts starving the thing it was meant to protect. Diagnostic move: when evaluating whether more distance, more purity, or more separation from something 'lower' or messier is good, don't assume the relationship is monotonic -- ask whether you've already found the working middle range, since past a certain point additional distance can become its own failure mode, symmetric to and just as damaging as too little distance, not a continuation of the same protective benefit."
