id: lex-wbhtq
name: exclusion-from-legitimate-exchange-makes-theft-the-rational-entry-route
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "A system of reciprocal exchange (gift circulation, data-sharing among peers, a professional network's mutual favors) genuinely binds its participants together and distributes real value among them -- but that same binding mechanism offers nothing at all to whoever the system structurally excludes, and for the excluded, working around the system's rules rather than through them stops being simple criminality and becomes the only route to what everyone else received freely. Hyde opens Chapter 9 with Hermes' own justification for stealing Apollo's cattle rather than waiting to be given a share: 'Why should we be the only gods who never eat the fruits of sacrifice and prayer?... If my father won't give it to me I intend to be -- and I mean it -- the Prince of Thieves.' He then generalizes past myth to name the structural condition directly: 'All of which is very fine if you are one of the in-group. But what if you're an outsider, or what if you're inside but the customary commerce always leaves you beneath your \"betters\"?... What if all the male scientists swap data and you happen to be a woman?... In cases such as these, you may have to resort to some form of subterfuge to get ahead; if the others won't give, you may have to steal.' The mechanism has a name Hyde supplies for the whole chapter: Hermes' method is how 'an outsider penetrates a group, or how marginalized insiders might alter a hierarchy that confines them... He knows how to slip the trap of culture.' Diagnostic move: before judging an excluded actor's rule-breaking as simple dishonesty, check whether the system's own legitimate channel (the gift circle, the informal network, the credentialing pathway) was ever actually open to that actor -- a system that calls its own withheld generosity 'normal' and the excluded party's workaround 'theft' has defined the terms of the judgment before the judgment starts."
