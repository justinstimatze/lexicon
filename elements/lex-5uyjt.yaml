lineage:
  - source: primary
    text: bryson-1999-a-walk-in-the-woods
    citation: "Bill Bryson, A Walk in the Woods: Rediscovering America on the Appalachian Trail (Broadway Books, 1999), Chapter 3, recounting the Appalachian Trail's founding history."
    quote: "'MacKaye always gets the credit for the trail, but this is largely because he lived to be ninety-six and had a good head of white hair; he was always available in his later years to say a few words at ceremonies on sunny hillsides. Avery, on the other hand, died in 1952, a quarter-century before MacKaye and when the trail was still little known. But it was really Avery’s trail. He mapped it out, bullied and cajoled clubs into producing volunteer crews, and personally superintended the construction of hundreds of miles of path. He extended its planned length from 1,200 miles to well over 2,000, and before it was finished he had walked every inch of it. In under seven years, using volunteer labor, he built a 2,000-mile trail through mountain wilderness. Armies have done less.'"
canonical-instances:
  - "Two co-founders build a startup together, one handling the founding pitch and early fundraising before leaving after a dispute, the other running the company for the next fifteen years through its IPO. Journalists writing the company's origin story default to interviewing whoever is still returning emails, so the resulting narrative centers on the person easiest to reach, largely independent of whose decisions actually shaped the company across those fifteen years."
  - "An open-source library's original creator writes a popular blog post laying out its design philosophy, then largely stops contributing; a small group of maintainers spends the next decade fixing bugs, writing the real documentation, and keeping the project alive through every dependency upgrade. Conference talks and retrospectives keep booking the original creator to speak about 'their' project, because the maintainers never built a public profile and nobody thought to ask them."
  - "Operationally distinct from lex-svcmp accumulated-precedent-as-substrate-for-individual-genius: that atom explains misattributed credit as genius drawing on communal precedent it didn't build -- the substrate is impersonal and often anonymous. This atom explains misattributed credit as one of two named, known collaborators being unavailable at the specific moments credit gets handed out -- the substrate is a single identifiable person whose absence, not anonymity, is what let the story simplify to the other name."
  - "Operationally distinct from lex-2bufe reputation-is-anchored-to-outcome-not-to-antecedent-merit: that atom is about how the SAME person's reputation swings with outcomes over their own lifetime. This atom is about credit splitting unevenly across TWO different people's shares of one achievement, tracking which of them remained around to be asked about it."
critical-questions:
  - "Is availability actually doing the work here, or is it a proxy for something else that also explains both the availability and the credit -- MacKaye's temperament (drawn to public ceremony) versus Avery's (famously prickly, 'not one for publicity')? A contributor who avoids the spotlight even while alive would confound this claim; the mechanism needs genuine absence, not just personality difference."
  - "How would you distinguish this from ordinary self-promotion -- a contributor who survives and actively campaigns for credit, versus one who survives and simply remains reachable without seeking it? Bryson's account suggests MacKaye did little active campaigning; the credit came to him passively, at ceremonies organized by others, which is a weaker and more common mechanism than deliberate myth-building."
  - "Does correcting the record (as Bryson does here) actually redistribute credit, or does the corrective account just become a footnote to the myth it's correcting? A book read by a fraction of the AT's visitors is unlikely to unseat decades of ceremony-honoring one name."
status: active
