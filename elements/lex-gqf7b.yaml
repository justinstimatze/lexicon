id: lex-gqf7b
name: the-trouble-stirrer-can-be-the-one-whose-service-resolves-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A figure whose service depends on people needing help can benefit from trouble existing in the first place, which makes it worth checking whether that figure is simply skilled at responding to trouble or is actually involved in generating it -- the same actor being both cause and cure isn't a contradiction, it's a stable and self-perpetuating arrangement. Hyde notes this directly about the Yoruba trickster Eshu, patron of divination: 'Eshu is well known for setting people to fighting with each other; when we read at the outset that the gods themselves have been quarreling we might suspect that Eshu has been at work (it would be like him to cause a problem only he can solve!).' He returns to the point with the diviner's own tradition: 'people say that Eshu starts fights and stirs up troubles so that human beings will have to go to the diviners, have to sacrifice, have to feed the gods.' Whether or not Eshu literally caused any specific conflict, the arrangement he benefits from and the arrangement that would exist if he were deliberately causing trouble look identical from outside: humans in need, Eshu supplying the remedy, Eshu taking his cut (about ten percent, Hyde notes, 'the same as agents take from authors'). Diagnostic move: when someone's livelihood or standing depends on a specific kind of trouble existing, don't assume their relationship to that trouble is purely reactive -- check whether the frequency or shape of the trouble tracks their interests suspiciously well, since a genuine problem-solver and a manufactured-crisis operator can be structurally indistinguishable from the outside, and the fact that their solution genuinely works doesn't rule out that they had a hand in creating the need for it."
