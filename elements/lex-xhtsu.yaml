name: pathologizing-a-boundary-crosser-keeps-people-from-approaching-what-it-does
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Relabeling a figure who performs genuinely necessary boundary-crossing work as simply dangerous or disordered doesn't just misdescribe them -- it functions socially as a deterrent, keeping people from approaching or engaging with the disruptive function that figure actually serves, whether or not the relabeling is consciously intended that way. Hyde makes this explicit about the recurring move of calling tricksters psychopaths: 'I have often wondered, then, whether the associative leap that links these two characters isn't really a defense against the anxiety that trickster's methods can produce. There is, of course, good reason to be cautious when glib and cunning human beings appear on the scene. But it must also be the case that a society, to preserve the status quo, will slide an image of the psychopath over the face of the trickster to prevent real contact.' The image does real work precisely by being frightening rather than accurate: 'Like one of those Styrofoam owls they put on buildings to scare off timid pigeons, the image of the psychopath is a minatory illusion, a threatening mask to keep the conventional from approaching trickster's sacred/not-sacred functions.' The diagnostic label and the deterrent effect are the same move: once someone is filed under a category reserved for dangerous pathology, engaging with what they actually do reads as risk rather than curiosity, and the substance of their boundary-crossing function goes unexamined. Diagnostic move: when a person, practice, or idea that crosses an established boundary gets described in terms usually reserved for pathology or threat (unstable, toxic, dangerous, unhinged), ask what genuine engagement with their actual function would require, and whether the pathologizing label is doing double duty as an accurate clinical description and as a fence keeping people from finding out."
