id: lex-g294v
name: a-rehabilitated-adversarys-risk-does-not-decay-with-good-behavior
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone who once sided with your opponent has come back to you and been behaving loyally for some time, don't let their track record since returning erase the fact of where they came from -- Kautilya states the claim as a structural, not a psychological, one: the danger isn't that the returnee is currently plotting anything, it's that their origin makes a future reversion possible in a way a person without that history doesn't carry. He states it with two deliberately vivid images: 'Just as living with a snake is living in constant fear, one who has come from the enemy is always a danger, because of his long association with the enemy. Just as the plaksha seeds dropped by a pigeon nesting in a salmali tree eventually take root and smother the salmali, one who has come from the enemy must always be feared as posing a danger even in the future.' The seed image is doing precise work: the seed does not look dangerous on arrival, it is small, dormant, and easy to ignore for a long time, and the tree that eventually gets smothered by it was the one that gave it shelter. The claim is not that the returnee is lying about their current loyalty -- it's that a genuinely loyal present doesn't retire the risk the way it would for someone with no enemy history at all, because the association itself (not any specific bad intent) is what supplies the latent capacity for future betrayal. Kautilya's own prescribed handling matches this reading exactly: not accusation or punishment for anything the returnee has actually done, but permanent, low-drama structural containment -- 'kept at a distance and well-guarded until the end of his life,' assigned to fight jungle tribes or guard a frontier where their actions can be monitored and their potential defection has less to attach to, or in the more extreme readings, quietly disposed of when the risk is judged unacceptable regardless of current behavior. The vigilance is not evidence of suspicion about anything specific; it is the appropriate permanent posture toward a specific class of risk. Diagnostic move: when integrating a former adversary, defector, or rehabilitated insider threat back into a position of trust, separate the question 'has this person behaved well since returning' (which good behavior can genuinely answer) from 'has the structural possibility of reversion gone away' (which good behavior, however long sustained, does not answer) -- and design containment, monitoring, or limited-exposure roles around the second question rather than treating an improving track record as evidence the first question has resolved the second."
related: [lex-r8fnk, lex-vn75w]
scaffolds-from: [lex-r8fnk]
evokes: [plaksha-seed-smothers-the-salmali, latent-risk-does-not-decay-with-time, origin-supplies-capacity-not-intent, kautilya-renegotiation-when-inadvisable]
lineage:
  - source: primary
    text: kautilya-arthashastra-plaksha-seed-latent-danger
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Treaties,' 'Renegotiation of Treaties,' 'Renegotiation When Not Advisable to Do So,' {7.6.38-39}."
    quote: "'Just as living with a snake is living in constant fear, one who has come from the enemy is always a danger, because of his long association with the enemy. Just as the plaksha seeds dropped by a pigeon nesting in a salmali tree eventually take root and smother the salmali, one who has come from the enemy must always be feared as posing a danger even in the future.'"
  - source: primary
    text: kautilya-arthashastra-returnee-containment-options
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part X, section 'Treaties,' 'Renegotiation When Not Advisable to Do So,' {7.6.33-37}."
    quote: "'One who is suspected of belonging to the enemy's side but has been given favours for coming over, shall be kept at a distance and well-guarded until the end of his life; or he shall be made to fight against the enemy. If the returnee's actions can be controlled, he may be sent, at the head of an army, to fight hostile jungle tribes or guard a frontier.'"
canonical-instances:
  - "A cybersecurity firm rehires a former employee who left to work for a direct competitor and, after several years of good performance elsewhere, comes back with a genuine change of heart -- the firm still restricts the returnee's access to certain sensitive client accounts indefinitely, not because of anything the returnee has done since returning, but because the structural fact of having spent years inside a competitor's systems doesn't expire with good behavior."
  - "An intelligence agency debriefs and reintegrates a former double agent who now appears fully loyal, but keeps them permanently off any assignment involving the specific foreign service they once worked for, regardless of how many years of demonstrated loyalty accumulate, because the original relationship supplies a standing capacity for renewed contact that a lifelong loyalist never had to begin with."
critical-questions:
  - "does this principle risk becoming a self-fulfilling, permanent second-class status that itself produces the resentment and disloyalty it claims to guard against -- if a returnee is never actually trusted no matter how long they behave well, does the containment strategy manufacture the very risk it was designed to manage?"
  - "how would anyone actually distinguish a genuinely dormant, still-latent risk from a risk that has, in fact, fully resolved -- is there any observable evidence that could ever satisfy this framework, or does it treat the origin itself as permanently disqualifying regardless of any future evidence, making the claim unfalsifiable in practice?"
  - "does the plaksha-seed metaphor prove too much -- since almost anyone with a past affiliation, a former employer, a prior political party, an old friendship group, could be described as carrying some 'seed' of a different loyalty, what principled line separates a genuine enemy-association risk from an overbroad suspicion applied to anyone with a complicated history?"
status: active
