id: lex-m7xkd
name: eliminate-both-a-target-and-the-instrument-in-one-operation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When removing a dangerous person requires using another person as an instrument (a deceived accomplice, a manipulated rival, an unwitting proxy), recognize the structural opportunity to eliminate the instrument in the same operation, using the instrument's own compromised position as the pretext — converting a single operation into a double removal with a clean, self-justifying public narrative and no remaining loose end who knows what actually happened. Kautilya's catalogue of methods for eliminating a treacherous official runs this pattern repeatedly and explicitly. Using a deceived relative: 'A secret agent shall tempt the brother of the traitor to kill him with the promise of being given his brother's property; when the deed is done, by weapon or by poison, he himself should be killed for the crime of fratricide.' Using a deceived son: an agent convinces a minister's son he is secretly the king's own child being kept from his rightful place out of fear of his 'father,' inciting him to murder the minister — 'when the deed is done, the king shall have him [also] executed on the very ground that he was a parricide.' The same double-elimination logic scales to removing two suspect officials at once by engineering a conflict between them: 'a mischief maker shall cause a quarrel among them. An assassin shall kill one; the other shall be blamed for it and killed' — one operation, two removals, and a public record that shows only two men who destroyed each other, never an outside hand. In every version, the instrument is never left alive as a witness or loose end, and the FRAMING is not incidental — the instrument's own compromised act (fratricide, parricide, an apparent quarrel-turned-murder) becomes the publicly legible justification for eliminating them too, so the operation reads afterward as justice served on two independent wrongdoers rather than as one coordinated removal of two people who were, in different ways, both used. Diagnostic move: when analyzing an event where a dangerous actor was removed via an intermediary, and that intermediary was then also removed shortly after for an offense connected to the very act that served the original goal, consider whether this reflects two unrelated incidents of misconduct, or whether it fits the single-operation structural pattern — a deceived or manipulated instrument used to remove the primary target, then eliminated using the compromised act itself as pretext, closing off the one person positioned to know or reveal what actually happened."
related: [lex-k2c2v]
evokes: [tempt-the-brother-to-fratricide, deceived-son-becomes-parricide, engineer-a-quarrel-kill-one-blame-the-other, double-elimination-one-operation, instrument-eliminated-with-the-target]
lineage:
  - source: primary
    text: kautilya-arthashastra-deceived-relative-double-elimination
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IX 'Covert Operations,' section 'Internal Security,' 'Treacherous High Officials,' 'Using Relatives,' {5.1.5-13,15-19}."
    quote: "'Against a traitorous minister... a secret agent shall tempt the brother of the traitor to kill him with the promise of being given his brother's property; when the deed is done, by weapon or by poison, he himself should be killed for the crime of fratricide.' 'A secret agent may mislead the seditious minister's son... into thinking that he is really the son of the king and is being kept in ignorance of his \"true\" origin for fear of the enemy... The son shall thus be instigated to murder his father. When the deed is done, the king shall have him [also] executed on the very ground that he was a parricide.'"
  - source: primary
    text: kautilya-arthashastra-engineered-quarrel-double-elimination
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part IX, section 'Treacherous High Officials,' 'Playing One Against the Other,' {5.1.14,38-52}."
    quote: "'If there is an adulterous relationship between members of the two families... a mischief maker shall cause a quarrel among them. An assassin shall kill one; the other shall be blamed for it and killed.'"
canonical-instances:
  - "An organized-crime boss orders a lower-level associate to kill a rival, then has the associate killed shortly after and framed for both crimes — the boss achieves the rival's removal and eliminates the one person who could testify to the boss's own involvement, with police and rivals alike reading it as a single unrelated gang dispute rather than a coordinated two-stage operation."
  - "A corporate power struggle in which an executive manipulates a junior employee into leaking a rival executive's damaging secret, then has the junior employee fired and publicly blamed for corporate espionage once the leak does its damage — the instigating executive gets the rival discredited and the only witness to the actual instigation discredited and removed in the same stroke."
  - "operationally distinct from lex-k2c2v disrupt-a-conspiracy-at-whichever-role-is-locally-scarce: that atom is about choosing which of two EXISTING conspiratorial roles (instigator or local accomplice) to target for disruption; this atom is about DELIBERATELY MANUFACTURING an instrument's compromised act specifically so their subsequent elimination becomes structurally justified, rather than about deciding which existing role in an organic plot to target."
critical-questions:
  - "how would an outside investigator or historian actually distinguish this pattern from two genuinely independent events (a real fratricide followed by a real, separately-motivated execution) without access to the orchestrating party's private intentions — is the pattern only identifiable in cases where a plotter's own private records or later confession reveal the coordination?"
  - "does relying on an unwitting, deceived instrument make the operation more fragile than using a knowing, willing agent — a deceived person's confusion, guilt, or attempts to explain themselves before being eliminated could surface the deception, whereas Kautilya's account assumes the instrument is eliminated quickly enough that this risk never materializes?"
  - "is there a meaningful difference between the two variants shown here — actively deceiving an innocent relative into committing a crime they would never have committed on their own, versus exploiting an ALREADY-EXISTING adulterous relationship or grievance between two guilty parties — in terms of how much the orchestrator's culpability differs, even though the operational structure (double elimination, clean narrative) is identical in both?"
