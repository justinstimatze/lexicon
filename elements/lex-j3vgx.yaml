    citation: "Benjamin Franklin, Father Abraham's Speech ('The Way to Wealth' / 'Poor Richard Improved'), 1758 (Gutenberg #43855). Verified verbatim against a direct extraction of the held copy."
    quote: "It is easier to build two chimneys, than to keep one in fuel"
canonical-instances:
  - "a household buys a larger house at a manageable mortgage rate, then discovers the recurring costs of heating, insuring, and maintaining the extra square footage exceed what the purchase price itself ever suggested — the sticker price was the easy number."
critical-questions:
  - "Does this comparison hold generally, or only for assets whose maintenance cost scales with time rather than with use — would a tool used rarely but requiring the same fixed upkeep regardless of use flip the ratio back?"
  - "Is 'easier to build two chimneys' actually a fair comparison, given that acquisition costs are usually visible and budgeted for up front while upkeep costs are diffuse and easy to underestimate at the moment of purchase — or does the aphorism only feel true because of that visibility bias?"
