lineage:
  - source: primary
    text: wertheimer-1987-coercion
    citation: "Alan Wertheimer, *Coercion* (Princeton, NJ: Princeton University Press, 1987). The book's Introduction (pp. 3-7) opens with the paradigmatic gunman case and states the project: to explain what makes a proposal coercive in contexts where the answer bears on responsibility, the validity of promises, or the excusing of wrongdoing. Chapter Two, 'Contracts' (pp. 29-31), extracts from the Restatement of Contracts the two-pronged structure of legal duress doctrine — an independently-necessary choice prong (does the proposal leave B with 'no reasonable choice'?) and proposal prong (is A's proposal itself morally wrongful?) — jointly sufficient for duress. Part Two's Chapter Twelve, 'Coercive Proposals: I' (pp. 202-221), is the book's central philosophical chapter: it states the threat/offer baseline distinction directly, works through Nozick's 'Coercion' (1969) three candidate baseline tests (statistical, phenomenological, moral) via the Drowning Case, the Private/Public Physician Cases, and the Slave Case, argues that the moral test is what does the real work wherever a coercion-claim is meant to affect responsibility, and closes ('Setting the Moral Baseline') by showing that the moral-baseline approach is what lets us separate coercive proposals from mere hard bargaining — specifically, whether the deprivation being leveraged is part of B's independent background situation (for which A is not responsible) or is a rights-violation specifically attributable to A."
    quote: "[Introduction, p.5, the paradigm case anchoring the whole theory:] 'Consider some paradigmatic examples of such coercion. A gunman says to Jones, \"Your money or your life.\" Jones, preferring his life to his money, turns over his wallet... It is easy to say that Jones is coerced in these cases (or they would not be paradigmatic). It is less easy to explain what makes them coercive.' [Chapter Two, 'Contracts,' pp.29-30, the original statement of the two-pronged theory:] 'the Restatement adopts what I shall call a two-pronged theory of duress... The essential and structural feature of the two-pronged theory is that it consists of two independent tests for duress, each of which is necessary and which are jointly sufficient. I shall refer to the first test as the choice prong... the point is that A's proposal must prevent B from \"exercising free will and judgment,\" or, as it is sometimes put, that B has \"no reasonable choice\" or \"no acceptable alternative\" but to succumb to A's proposal. I shall refer to the second test as the proposal prong. To show that B acts under duress, it is also necessary, but not sufficient, to show that A's proposal is wrongful.' [Chapter Twelve, 'Threats and Offers,' p.204, the key baseline definition:] 'The crux of the distinction between threats and offers is quite simple: A threatens B by proposing to make B worse off relative to some baseline; A makes an offer to B by proposing to make B better off relative to some baseline. More precisely, A makes a threat when, if B does not accept A's proposal, B will be worse off than in the relevant baseline position. A makes an offer when, if B does not accept A's proposal, he will be no worse off than in the relevant baseline position.' [Same section, on why felt pressure alone cannot settle the question, p.204:] 'It is important to see that the distinction between threats and offers is not a function of the distance between the options or their efficacy in securing the desired response... it may be no less irrational to refuse an offer than not to succumb to a threat.' [Same page, on the baseline's own dependence on a benchmark:] 'It should be emphasized that the distinction between better and worse off always requires some baseline. To say \"better off\" is always to say \"better off than ___.\" Without some benchmark, there would be better and worse alternatives, but no better and worse off.' [\"Moral and Nonmoral Baselines,\" p.206, introducing Nozick's statistical/moral distinction and the Drowning Case:] 'In his seminal article \"Coercion,\" Robert Nozick shows that fixing B's baseline is not always so unproblematic... \"The term 'expected' is meant to shift between or straddle predicted and morally required.\"' [The Drowning Case, p.206-207:] 'A comes upon B, who is drowning. A proposes to rescue B if B agrees to pay him $10,000... Under the statistical test, whether A is making an offer or a threat will depend on what is \"normal\" in their society... Under the moral test, whether A is making an offer or a threat will depend on whether A is morally required to rescue B. If he is, then B's baseline includes A's beneficial intervention, and A's proposal is a threat. If he is not, then A's proposal is an offer.' [The Private/Public Physician Cases, p.207-208, showing the same act-type flips category depending purely on independent duty:] 'Under the moral test, A is making an offer in the Private Physician Case, because A does not have an obligation to treat B's illness free of charge. A is making a threat in the Public Physician Case, because A does have an obligation to treat B's illness free of charge.' [The Slave Case, pp.207-208, the sharpest divergence between tests Wertheimer analyzes:] 'A beats B, his slave, each morning for reasons unconnected with B's behavior. A proposes not to beat B the next morning if and only if B does X... Under the statistical and phenomenological tests, A is making an offer. B expects to be beaten each morning, and relative to that expectation, A is proposing to make B better off. Under the moral test, A is making a threat. For A is morally required not to beat B any morning (indeed, not to have B as a slave), and relative to that baseline, A is proposing to make B worse off.' [\"Multiple Baselines and the Two-Pronged Theory,\" p.215-216, tying the moral-baseline analysis directly back to the law's two-pronged structure:] 'the proposal prong captures B's moral baseline, which in turn allows us to translate morally permissible threats into offers. A moral threat does not constitute legally recognizable duress because relative to B's moral baseline, A's moral threat is actually an offer. And offers do not coerce.' [\"Setting the Moral Baseline,\" p.219, the passage grounding the labor/hard-bargaining cross-domain application directly:] 'the moral baseline approach allows us to distinguish — to the extent that we want to — between B's background conditions for which A is not responsible and rights-violating threats to B's welfare which are specifically attributable to A, or in slightly different terms, between coercive proposals and hard bargaining. Thus when LaBeach signed an agreement with Beatrice Foods Corporation because he was under pressure to repay a personal loan, it was held that this was part of LaBeach's background situation for which Beatrice had not been responsible, and hence the agreement had not been made under duress.' [Chapter Thirteen, 'Coercive Proposals: II,' p.222, on why an irresistible offer is still not coercive absent a rights violation:] 'I have argued, in effect, that the coerciveness of proposals is all in the baseline. And relative to that baseline, only threats are coercive... A might offer B a job at three times the salary he is now receiving. But... although we may plausibly say that the distance between the alternatives is such that B has \"no choice,\" the claim would be virtually without moral force. There is little of moral interest to be gained by referring to genuine and generous offers as coercive.' [Verified 2026-08-19 against the real PDF: exact match throughout; the checker cannot confirm three of these spans (the paradigm-case close, the baseline-benchmark passage, and the Slave Case statistical/phenomenological sentence) because footnote citation blocks are interleaved into the body text at exactly those points.]"
  - source: discovery-loop
    text: distinctness-audit-threat-versus-offer-baseline-theory
    citation: "Wertheimer was entirely absent from the substrate before this atom, as was the specific threat-versus-offer baseline-comparison analytic machinery, the legal-duress vocabulary, and the baseline-comparison vocabulary generally. A broader search for 'coercion/coercive' surfaces roughly 60 atoms using the term in a loose, non-technical sense; the highest-probability candidates — lex-7mdpd, lex-653ng, lex-vw8c3 — were checked directly and none grounds a baseline-comparison test. Lex-0233 is Kant's treat-as-ends formulation, a different question about how persons may be treated rather than whether a specific proposal is a threat or offer. Lex-0514 is Sen and Forst's configurational-power-shapes-which-reasons-count claim, a different mechanism concerned with who controls the space of reasons rather than what baseline a specific proposal is measured against. Lex-0727 is Marcuse's producer-supplies-both-need-and-satisfaction structure, a system-level lock-in mechanism rather than a dyadic proposal-classification test. None contains the specific analytic move of comparing a proposal to a moral or nonmoral baseline to classify it as threat or offer. No atom in the substrate grounds Harry Frankfurt's free-will and hierarchical-desire work (candidates lex-63e4c, lex-s2pjj, lex-7mdpd, lex-653ng, lex-5tpy8, lex-kykwm, lex-fjzum, lex-7wvdb, lex-vw8c3 are false positives on other Frankfurts or unrelated content); separately, Wertheimer's own text cites a different Frankfurt paper, 'Coercion and Moral Responsibility' (1973), as a direct interlocutor on the threat/offer distinction, confirming the two Frankfurt projects are genuinely distinct questions rather than the same author's work appearing twice. Lex-0231 (Nozick's experience-machine thought experiment, cited as a tier-3 deepening inside a Mill higher/lower-pleasures atom) and lex-xuwr2 (Rawls's difference principle, mentioning Nozick only as a libertarian critic in passing) do not engage Nozick's 1969 'Coercion' essay or the baseline-test machinery Wertheimer builds on and departs from. Lex-0622 (WEIRD-samples-are-extreme-tail) is a false positive on a passing mention of ultimatum-game experiments in cross-cultural psychology, unrelated. Two genuine compositional neighbors were identified. Lex-0716 (Schelling, credibility-via-visibly-foreclosed-options) concerns the structure of proposals in bargaining but answers a different question: Schelling asks how a party makes a threat or commitment credible — a question about believability, orthogonal to whether the threatened baseline-shift is one the proposer had a right to bring about — while Wertheimer asks whether a proposal, credible or not, is a threat or an offer in the first place, and whether that classification makes it coercive. The two compose: a credible commitment device (Schelling) can be built around either a legitimate offer or a rights-violating threat (Wertheimer), since visibility and irreversibility do not themselves determine which. Included in `related` with this distinctness note; reciprocated. Lex-0457 (Polanyi, removing-non-market-exits-makes-market-dependence-structural) names the historical and structural mechanism by which a party's exits get removed, producing a desperate baseline; Wertheimer's theory supplies the analytic test for whether a specific later proposer, given that already-desperate baseline, is making a coercive threat (if they created or control the removed exits) or a mere hard offer (if the exit-removal was not their doing) — directly matching Wertheimer's own LaBeach v. Beatrice Foods worked case. Included in `related`; reciprocated. The substrate's existing power, domination, exploitation, and coercion cluster supplies observations that power imbalances can be exploitative, but none supplies Wertheimer's precise analytic machinery for distinguishing a coercive proposal from a legitimate hard one via baseline comparison plus the two-pronged, moral-and-psychological test."
canonical-instances:
  - "The gunman's 'your money or your life' (Wertheimer's own paradigm case, Introduction p.5): coercive because the gunman has no moral or legal right to kill Jones — the baseline Jones is entitled to (his life, his money, both) is exactly what the proposal threatens to violate unless Jones complies. Both prongs fire: the proposal prong (the gunman's threatened act is a rights-violation) and the choice prong (Jones's will is genuinely overcome by the threat of death)."
  - "Nozick's Drowning Case (Wertheimer pp.206-207): A finds B drowning and proposes to rescue him for $10,000, with A and B both knowing no other rescuer is available. Whether this is a threat or an offer depends entirely on whether A has an independent moral duty to rescue B for free — if A is so obligated, B's baseline already includes rescue, and charging for it is a threat; if A has no such duty, charging for the rescue is an offer, however desperate B's circumstances."
  - "Nozick's Slave Case as reworked by Wertheimer (pp.207-208): a slave beaten every morning for no reason is told he won't be beaten tomorrow if he does X. The statistical/phenomenological baseline (beatings are the norm) makes this look like an offer; the moral baseline (the enslaver has no right to beat the slave at all) makes it a threat. Wertheimer argues the moral test carries the real moral weight here despite the statistical test's intuitive pull — the clearest demonstration that the three baseline tests can diverge and that the choice of test is not cosmetic."
  - "LaBeach v. Beatrice Foods Corp. (cited by Wertheimer p.219): LaBeach signed an unfavorable agreement under pressure to repay a personal loan; the court held this was part of LaBeach's own background situation, for which Beatrice was not responsible, and so the agreement was not made under duress — Wertheimer's own primary-source instance of the hard-bargain-versus-coercion distinction that generalizes directly to 'take this job or starve' labor cases."
critical-questions:
  - "Who is responsible for the baseline being leveraged — did the proposer create or control the deprivation the recipient would face by refusing, or does that deprivation belong to the recipient's own independent background situation (the LaBeach test)? This single question does most of the discriminating work between a coercive threat and a hard bargain."
  - "Does the proposer have an independent moral or legal right to bring about the outcome they are threatening (or declining to prevent) if the recipient refuses? If yes, the proposal — however unwelcome — is at most a poor offer, not a threat; if no, the proposal is a threat regardless of how the parties or society happen to experience or expect it."
  - "Which baseline test is actually being invoked here — statistical (what's normal), phenomenological (what's expected/felt), or moral (what's owed)? Per the Slave Case, these can diverge sharply, and the answer to 'threat or offer' can flip depending on which test is silently assumed."
  - "Is the choice prong being treated as sufficient on its own — 'I felt I had no choice, therefore I was coerced'? Wertheimer's two-pronged theory makes this a necessary but not sufficient condition: an irresistibly attractive, fully legitimate offer can also produce 'no choice' without any coercion occurring at all, because it fails the proposal prong (the proposer violated no entitlement of the recipient's)."
  - "Is the same external circumstance (poverty, urgency, an existing illness or debt, a power asymmetry) being treated as automatically coercive wherever it produces compliance — rather than asking whether THIS proposer created or controls that circumstance, versus merely operating within a baseline that predates and is independent of them?"
