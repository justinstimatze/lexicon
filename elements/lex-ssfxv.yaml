lineage:
  - source: primary
    text: eastman-little-boy-man-tree-disguise-resists-uprooting
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Fourteenth Evening: The Little Boy Man.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Husband!' exclaimed the wife of Unk-tay-hee, 'for ages this has been our resting-place, and yet I have never seen this tree before!' 'Woman, the tree has always been there!' returned the water monster. ... Then Unk-tay-hee wound his immense scaly tail about the giant pine and tried to pull it out by the roots. The water foamed and boiled with his struggles, but He-who-was-first-Created stood firm, and at last the monster gave up the attempt. 'There,' he declared, 'I told you it had always been there!'"
canonical-instances:
  - "An auditor flags an account balance that doesn't match what they remember from the prior review, and a colleague runs a quick reconciliation that fails to immediately surface an obvious error; the team concludes the balance must be fine, when a reconciliation that fails to explain a genuine discrepancy on the first pass is at least as consistent with a deeper, harder-to-find problem as it is with there being no problem at all."
  - "A quality control worker on a production line notices a component that doesn't sound right, and management runs a single quick diagnostic test that comes back inconclusive rather than clearly failing, and declares the component fine -- when an anomaly that resists a quick, simple test to clear it is exactly the kind of anomaly that needed a more thorough check, not a green light to move on."
critical-questions:
  - "how does someone distinguish an anomaly that genuinely resists disproof because it's real from one that simply resisted a poorly designed or insufficiently thorough test, when both look identical from the outside as 'the check didn't clear it'?"
  - "does treating every failed disproof attempt as evidence for the anomaly risk manufacturing endless suspicion, where nothing can ever be cleared because any failure to immediately explain something away gets read as confirmation rather than as an inconclusive result deserving further, calmer investigation?"
  - "why does Unk-tay-hee specifically choose to interpret the tree's resistance as favorable to his own view rather than as concerning -- is this a universal cognitive bias toward maintaining an initial dismissal, or something more specific to overconfident authority figures being challenged by a subordinate's correct instinct?"
