id: lex-n2gav
name: assign-a-mandatory-high-risk-task-to-the-resource-you-already-distrust
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a costly, high-risk task absolutely must be done, and you separately have a resource whose loyalty or reliability you already doubt, don't treat the assignment decision as a simple matter of picking your best available option -- consider deliberately assigning the risky, necessary task to the resource you were already worried about, because the assignment wins for you regardless of how it turns out. Kautilya's advice for a king who is himself attacked in the rear -- a situation his own dictum treats as intolerable to ignore, 'an enemy's destruction shall be brought about even at the cost of great losses and expenses' -- pairs that non-negotiable necessity with a specific personnel choice: 'For fighting the attacker-in-the-rear, unreliable troops should be used, thus killing two birds with one stone - warding off the attack while getting rid of treacherous troops.' The task has to happen no matter who does it, and it's genuinely dangerous, which means whoever is assigned to it faces real losses -- so the assignment decision isn't 'who will perform best' but 'whose losses cost me the least and buy me the most.' If the unreliable troops succeed, you've repelled the attack using a resource you weren't otherwise depending on. If they fail or are consumed by it, you've absorbed the loss with the resource whose loss you were more prepared to accept anyway, and you've simultaneously resolved the separate, ongoing problem of not being able to fully trust them. Either branch of the outcome is a net gain compared to using a trusted resource for the same task, which would only pay off in the success branch and would cost you something you actually wanted to keep in the failure branch. Diagnostic move: when a mandatory, high-risk task and a standing doubt about a particular resource's reliability exist at the same time, don't solve them as two separate problems -- check whether assigning the doubted resource to the necessary risk converts a pure cost (the risk) and a pure liability (the doubt) into a single move that pays off whichever way the risk resolves."
