id: lex-qd63r
name: the-same-accident-either-reveals-a-fixed-self-or-produces-genuine-newness
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "An artist's encounter with pure accident, a chance find, an uncontrolled variable, a lucky mistake, does not automatically produce the same kind of outcome for every artist it happens to, because what the accident becomes depends on what disposition the artist brings to it, not on the accident's own properties. Hyde draws the contrast through two figures at the same event: Picasso's Tête de Taureau, made from a found bicycle seat and handlebars that his eye caught as a bull's head, and John Cage's chance-operation compositions. 'The materials in Picasso's accidental find are new, but the art he shapes from them returns us to the same old Picasso. Picasso, of course, was quite happy to work with accident as a tool of revelation (\"From errors one gets to know the personality!\"), but Cage was not (\"Personality is a flimsy thing on which to build an art\"), for Cage was after Monod's \"absolute newness\" of pure chance.' Picasso's accident is symptomatic: it is legible as an accident specifically because it expresses a deep personality already in love with bulls since childhood, so a different artist's eye passing over the same rubbish heap would have caught a different pattern entirely, or none. Cage's practice deliberately routes around this: 'He was not out to discover any hidden self, nor did he think chance operations would reveal any hidden, already existing divine reality.' The accident is the same kind of event in both cases, contact with the uncontrolled, but one artist's disposition converts it into a mirror of a stable self, and the other's converts it into material with no informational debt to any self at all. Diagnostic move: when evaluating what an accident, a mistake, or a chance find 'reveals' about its finder, don't assume revelation is the only thing accident can do -- check whether the finder's whole practice is oriented toward reading the self back out of chance encounters (in which case the accident is symptomatic and will keep circling the same territory) or toward using chance specifically to escape the self (in which case looking for a hidden personality in the result misreads what's actually happening)."
