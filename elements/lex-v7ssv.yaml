canonical-instances:
  - "An employee caught padding an expense report avoids disciplinary action by turning the incident into a self-deprecating, widely-shared observation about how everyone in the office quietly does the same thing, and their manager, charmed by the honesty of the bit, drops the matter entirely instead of enforcing the policy."
critical-questions:
  - "Does this tactic actually work on any offense, or only on ones minor enough that the judge was never strongly motivated to punish in the first place?"
  - "Is the king's charmed reaction a failure of judgment on his part, or a reasonable response to genuinely valuable insight that happens to have been delivered by a thief?"
