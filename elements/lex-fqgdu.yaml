name: attributing-a-flattering-motive-baits-out-an-honest-less-flattering-confession
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Instead of asking someone directly why they did something, describing their action as if it were skilled and purposeful can provoke them to correct the flattering assumption with the plain, less impressive truth. The bait works because being seen as more capable than you actually are triggers a correction, where a neutral question might not. In the Jataka's tale of the shredding monkey, a gardener drops discarded leaf-cups from a tree, and a monkey shreds each one as it falls. The Bodhisatta addresses the monkey as if the destruction were expert craftsmanship: 'No doubt the king of beasts is clever In pottle-making; he would never Destroy what's made with so much pother, Unless he meant to make another.' The monkey corrects him immediately: 'Neither my father nor my mother Nor I myself could make another. What others make, we tear to pieces: The proper way of monkeys, this is!'"
related: []
