lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Public Opinion and Liberal Principles' (read before the Sixth Meeting of the Mont Pelerin Society, Venice, September 1954), Ch. 17 of Conjectures and Refutations (Routledge Classics, 2002), pp.473-475, Section 4."
    quote: "'This critical rational method must not be mistaken for a method of proof, that is to say, for a method of finally establishing truth; nor is it a method which always secures agreement. Its value lies, rather, in the fact that participants in a discussion will, to some extent, change their minds, and part as wiser men... It is often asserted that discussion is only possible between people who have a common language and accept common basic assumptions. I think that this is a mistake. All that is needed is a readiness to learn from one's partner in the discussion, which includes a genuine wish to understand what he intends to say. If this readiness is there, the discussion will be the more fruitful the more the partners' backgrounds differ. Thus the value of a discussion depends largely upon the variety of the competing views. Had there been no Tower of Babel, we should invent it.'"
canonical-instances:
  - "A product team pairs an engineer and a user-researcher on a redesign, expecting the disciplinary gap to slow things down. Neither converts the other to their framework, and no shared correct answer emerges -- but the engineer stops assuming user behavior mirrors their own mental model, and the researcher stops treating technical constraints as arbitrary, and both make better calls afterward than either would have made from their own background alone."
  - "Diplomats from two countries with no shared language, legal tradition, or starting assumptions about property rights spend a week failing to reach a treaty. A colleague calls the summit a failure because nothing got signed. But each delegation leaves able to name specifically which of its own assumptions the other side rejects and why, a map neither side had going in, and one that does more for the eventual treaty than an early handshake between delegations who'd never actually tested where they diverged."
critical-questions:
  - "If agreement isn't the measure of success, how do you tell a genuinely valuable discussion from one that just went in circles? Popper's test is concrete: did participants change their minds about anything, even a small point, and can they now state the other side's view in a way the other side would recognize as fair? A discussion producing neither -- no shifted position on either side, no improved grasp of the other's reasoning -- hasn't fertilized anything, regardless of how animated it was."
  - "Doesn't the more backgrounds differ, the more fruitful break down once the gap gets too large -- can truly incommensurable worldviews still have a productive discussion? Popper's own stated precondition does the limiting work: 'a readiness to learn from one's partner... which includes a genuine wish to understand what he intends to say.' Where that readiness is absent, no amount of background diversity produces fruit -- the presence of genuine mutual willingness to be understood is what actually caps how much divergence a discussion can hold, independent of the raw size of the gap."
