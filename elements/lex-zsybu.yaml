lineage:
  - source: primary
    text: hyde-hermes-lottery-dispels-the-old-orders-air-of-necessity
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' on Hermes' division of the sacrificed cattle by lot, and Norman O. Brown's connection to Athenian sortition. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "With it, we have the trick of reapportionment and the cancellation (or remaking) of hierarchy. Hermes symbolically makes himself a player (he aspires to be one of the twelve gods, so to make twelve portions is to deal himself in); he subjects existing order to an attack of accidents, letting things fall as they may; and if the existing order had an air of necessity about it, he dispels that air, making it clear that any order is partly a matter of chance."
canonical-instances:
  - "A university that fills its most competitive seminar seats by lottery among all qualified applicants, rather than by additional prestige rankings, exposes how much of the difference between applicants at the top of a merit ranking was actually noise rather than meaningful signal, once a random draw among equally-qualified candidates produces cohorts no one can distinguish in outcome from the ranked ones."
  - "A company that decides layoffs partly by lottery among a pool of equally-tenured employees, rather than purely by manager discretion, makes visible how much of ordinary performance-based ranking within that pool was itself running on soft, unverifiable judgment calls that a fair coin flip replaces with no measurable loss of accuracy."
critical-questions:
  - "Does introducing chance actually test whether a hierarchy is arbitrary, or does it simply replace one arbitrary-feeling mechanism (accumulated advantage, unexamined tradition) with a different one (a random draw) without settling whether either tracks anything real?"
  - "Is the disenchanting effect of a lottery permanent, or does a new hierarchy re-solidify around lottery winners just as quickly as the old one did, meaning the lottery resets the feeling of necessity rather than eliminating it?"
  - "For domains where merit genuinely does predict outcomes (surgical skill, structural engineering), would introducing chance into distribution be exposing false necessity or destroying real, earned differentiation -- how do you tell which case you're in before running the experiment?"
