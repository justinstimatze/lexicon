    text: distinctness-audit-price-signal-compression-vs-existing-substrate
    citation: "Lex-0722 (the claim that knowledge of particular circumstances resists centralization) is the diagnostic half of the same argument: particular-circumstance knowledge is irreducibly distributed and is lost whenever an aggregation procedure abstracts away the specific circumstances that made it decision-relevant. This atom explains how coordinated action is nevertheless achieved without the centralization lex-58ynk says is impossible — not by aggregating the knowledge after all, but by aggregating a thinner thing: a signal carrying only the practical upshot of the knowledge, while the knowledge itself stays exactly where it started, dispersed and uncentralized. Lex-0722's own lineage text names and queues this claim explicitly; this atom fulfills that queue entry. Lex-0777 (Holmstrom's claim that any signal informative about hidden effort improves an incentive contract) is a narrow, formal, single-principal-single-agent contracting result about which signals are worth adding to a contract. This atom concerns an entire economy's worth of actors simultaneously reading the same signal with no principal-agent relationship or contract at all. Lex-0456 (Scott's claim that legibility via standardization erases what doesn't fit) applies its schema-erasure mechanism directly to the price system, reading a market's reduction of quality to quantity as a loss — a real tension with this atom's claim that is not resolved by either text alone. This atom's claim is narrower than it first appears: the price signal is sufficient for the specific, narrow action each actor needs to take, not a claim that the price captures everything about the situation of every actor it touches. What is lost from Scott's point of view is, from this atom's point of view, precisely the information that does not need to travel for the coordination to work; the two atoms are two lenses on the same compression event rather than a contradiction to resolve."
canonical-instances:
  - "Hayek's own 'marvel' passage, the canonical instance of the whole atom: a scarcity of tin appears somewhere in the world — from a new use or a lost supply source, and Hayek insists 'it is significant that it does not matter' which — and 'without an order being issued, without more than perhaps a handful of people knowing the cause, tens of thousands of people whose identity could not be ascertained by months of investigation, are made to use the material or its products more sparingly; that is, they move in the right direction.' The chain of local substitutions 'spread[s] throughout the whole economic system... without the great majority of those instrumental in bringing about these substitutions knowing anything at all about the original cause of these changes.'"
  - "Hayek's telecommunications/dial-watching metaphor for the price system, offered as more than a figure of speech: 'It is more than a metaphor to describe the price system as a kind of machinery for registering change, or a system of telecommunications which enables individual producers to watch merely the movement of a few pointers, as an engineer might watch the hands of a few dials, in order to adjust their activities to changes of which they may never know more than is reflected in the price movement.'"
  - "The 2020-2022 global chip/lumber/shipping-container price spikes: a Renesas semiconductor-fab fire, Texas winter-storm plant shutdowns, and the Suez Canal blockage each independently spiked prices and lead times; automakers, appliance makers, and homebuilders worldwide rationed materials and redesigned products in response to the price/lead-time signal alone, the overwhelming majority never learning, and not needing to learn, which of the proximate causes (or which combination) was operative — a modern, well-documented replay of Hayek's own tin example."
  - "Engineered price-like signals in computing: Ethereum transaction gas fees and cloud spot-instance pricing deliberately compress network congestion or datacenter spare capacity into a single number that lets independent, mutually-unaware transactions or workloads self-ration without querying underlying system state — a case worth holding against Hayek's claim that the classical price system was 'not the product of human design,' since these are the same compression principle built on purpose once its logic was understood."
  - "Whitehead's aphorism, which Hayek explicitly imports to generalize the claim past economics: 'Civilization advances by extending the number of important operations which we can perform without thinking about them' — glossed by Hayek as 'We make constant use of formulas, symbols, and rules whose meaning we do not understand and through the use of which we avail ourselves of the assistance of knowledge which individually we do not possess.'"
critical-questions:
  - "Is the compressed signal actually SUFFICIENT to induce correct local action, or does the actor still need supplementary knowledge the signal doesn't carry? Hayek's marvel claim is narrow and empirical, not guaranteed by the mere existence of a signal — compare lex-fa9nq's (Holmstrom) formal informativeness test: does this signal move the recipient's correct-action probability beyond what they'd do without it?"
  - "Does correct action here require the recipient to understand WHY the signal moved, or only to react correctly to its movement? If understanding-of-cause is actually required for correct action, this is not Hayek's marvel — it's a different, harder knowledge-transmission problem, closer to lex-58ynk's territory."
  - "Is the live question WHY a centralizing proposal will degrade decision quality (reach for lex-58ynk) or HOW a decentralized system nevertheless produces coordinated action without centralizing anything (reach for this atom)? They are sequential halves of Hayek's own argument, not competing answers to the same question."
  - "What does this specific compression leave out, and who bears the cost of what's left out? Scott's lex-b9us2 legibility-erasure critique applies directly to price ('a market necessarily reduces quality to quantity via the price mechanism') — Hayek's marvel is a claim about sufficiency for a narrow class of action, not a claim that the compression is costless or that nothing of value is lost."
  - "Has the signal stopped actually moving, or become gameable or manipulable? Hayek's own caveat — the mechanism fulfils its function 'less perfectly as prices grow more rigid' — generalizes: a fixed price, a stale dashboard number, or a metric someone has learned to game looks like the same signal but has stopped carrying the marvel's information content."
