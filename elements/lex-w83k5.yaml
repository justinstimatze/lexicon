    quote: "he laid some dried celery stalks across, covered them with moss, and induced Deer to try to Walk across. Deer did so and was precipitated to the bottom, where he was devoured by Raven. Afterward Raven began mourning for him."
canonical-instances:
  - "A business partner who structured a deal specifically to bankrupt a smaller competitor is the most visibly sympathetic person at that competitor's closing announcement, expressing genuine-sounding regret to everyone who will listen."
  - "A manager who set an impossible deadline specifically to force out an employee they wanted gone leads the team's condolence message when that employee resigns under the pressure, framing it as a shared loss."
critical-questions:
  - "Does the story present Raven's mourning as sincere in some sense he can't fully suppress despite having caused the death, or is it purely strategic performance with no genuine feeling behind it, and can the terse summary format even distinguish between those two readings?"
  - "Would anyone else in the Tlingit cycle's world have grounds to suspect Raven given his established pattern of deception, or does the story suggest the mourning goes unquestioned specifically because grief is rarely interrogated?"
  - "Is there a meaningful difference between mourning a death you caused accidentally versus one you engineered deliberately, and does the specific, planned nature of the bridge trap matter to how this diagnostic should be applied?"
