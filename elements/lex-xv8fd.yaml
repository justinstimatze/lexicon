id: lex-xv8fd
name: voluntary-self-degradation-deters-a-stronger-challenger
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A physically weaker party facing a challenge it cannot win by force has another option: deliberately becoming repulsive enough that the stronger party refuses contact, substituting disgust for the fight entirely. The stronger party's advantage assumes an ordinary confrontation; it says nothing about tolerating what that party finds intolerable. In the Jataka's tale of the boar who challenges a lion, the boar's kin advise him to roll in an ascetics' dunghill for seven days until the filth dries onto his body, then meet the lion downwind. The lion never touches him: 'Friend Boar, a pretty trick this! Were you not all besmeared with filth, I should have had your life this very day. But as it is, bite you I cannot, nor so much as touch you with my foot. Therefore I Spare your life.' The boar doesn't win by becoming stronger. He wins by making the lion's own fastidiousness the constraint that actually decides the outcome, in place of the strength the lion actually has."
related: []
evokes: [jataka, dukanipata, sukara-jataka, weaponized-self-disgust-as-deterrent, exploit-the-strong-partys-own-standards-not-its-strength]
