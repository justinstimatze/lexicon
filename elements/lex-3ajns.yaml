id: lex-3ajns
name: anthropodenial-mirrors-anthropomorphism-graded-by-evolutionary-distance
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When inferring the inner states of another being — animal, distant culture, machine, alien intelligence — there are TWO symmetric errors available, not one. Anthropomorphism is the well-known error: attributing humanlike traits to beings that don't have them (calling a hurricane 'angry,' projecting intent onto a thermostat). The less-recognized symmetric error is ANTHROPODENIAL: the a priori REJECTION of humanlike traits in other beings, or of animallike traits in humans. De Waal's transferable claim is that these two errors are NOT independent — they sit on opposite ends of a single epistemic axis, and the RISK of each is graded by EVOLUTIONARY (or structural) DISTANCE between observer and observed. The closer the species (or the more shared the substrate), the GREATER the danger of anthropodenial — denying a real continuity. The more distant the species, the greater the danger of anthropomorphism — asserting a fake similarity. Critical-anthropomorphism (Burghardt) is the principled-middle: use the candidate human-analogue label as a SOURCE OF TESTABLE HYPOTHESES (if apes 'laugh,' they should show specific co-occurring features: ambivalent push-pull, breath-sound, social context), then test. The default-deny stance ('it's not really X until proven') treats the negative as the safe choice — but de Waal's argument is that under evolutionary continuity, the default-deny smuggles in a strong claim (discontinuity) it never argues for. The transferable lesson generalizes BEYOND animal-cognition to any inference about other-minds where shared-history (evolutionary, developmental, cultural) is non-zero: across-cultures, across-generations, across-species, across-substrates (human vs LLM). The structural move is to ASK FOR THE DISTANCE FIRST — the appropriate prior is distance-graded, not category-graded. Practitioner test: when you find yourself confidently saying 'X doesn't really feel/think/want Y,' check whether the denial rests on actual evidence of discontinuity OR on a category-default. If category-default, you may be in anthropodenial. The atom names the STRUCTURAL CLAIM (symmetric errors, distance-graded prior) rather than the specific animal-cognition domain. Distinct from lex-hhx7u argument-from-ignorance-absence-treated-as-evidence-of-falsity: lex-hhx7u is the general fallacy of treating non-proof as disproof; lex-3ajns names the SPECIFIC DOMAIN where this fallacy hides under a 'scientific caution' costume and where the SYMMETRIC ERROR (over-attribution) is well-recognized but its sibling is not. They compose: anthropodenial is one important species of argument-from-ignorance, but its DISTANCE-GRADING insight is the structural novelty lex-hhx7u doesn't carry. Distinct from lex-r3w25 confirmation-filtered-tribal-perception: confirmation-bias filters EVIDENCE for a held position; anthropodenial sets the PRIOR (default-deny) before evidence-collection — they're related but operate at different stages. Distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is about converting vague-prescription to actionable form; lex-3ajns is about the SYMMETRIC-ERROR-PAIR structure. They compose: descriptive-vs-operational rewrites 'don't anthropomorphize' (vague) into 'test the candidate human-analogue label as a hypothesis' (operational)."
