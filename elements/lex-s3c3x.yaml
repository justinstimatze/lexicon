canonical-instances:
  - "A company wants to know whether customers who already loved the brand are simply inferring a new product must be high quality (projection), versus the product's own quality shaping perception (reflected influence). Checking PRE-launch brand loyalty (collected before the product existed) against POST-launch perceived product quality separates the stories: if prior loyalty barely moves perceived quality while it strongly predicts continued loyalty itself, quality perception looks more independent of prior brand attachment than a pure halo-effect account would predict."
  - "A researcher studying whether an employee's belief that 'my manager respects me' is shaped by the manager's actual behavior or is just an echo of the employee's own pre-existing self-regard checks the employee's self-regard score from before the manager relationship began against their current belief about the manager's view — separating a genuine relational read from a projected one."
critical-questions:
  - "The test only weakens the projection story for this one perceived-other measure; it does not rule out that projection is happening but is simply weak relative to noise, nor does it rule out that the 'prior' measure was itself already contaminated by informal exposure before the formal interval began — Huntington does not establish that her year-earlier expectation measure was collected free of any prior contact with the medical setting."
  - "This move assumes the researcher happens to have, or can collect, an independently-timed prior measure of the self-report variable. How often is that data actually available in practice, and when it is not, does the absence get papered over by researchers who treat an ambiguous cross-sectional correlation as if it had already settled the causal direction?"
