lineage:
  - source: primary
    text: lakoff-johnson-1980-metaphors-we-live-by
    citation: "George Lakoff and Mark Johnson, *Metaphors We Live By* (University of Chicago Press 1980; afterword 2003 reissue). The foundational cognitive-linguistic argument that conceptual metaphor is cognitive infrastructure, not decorative language. Lakoff and Johnson document several dozen conceptual metaphors operating in English (TIME IS MONEY, ARGUMENT IS WAR, MIND IS A CONTAINER, IDEAS ARE FOOD, LOVE IS A JOURNEY, THE MIND IS A MACHINE, LIFE IS A GAMBLING GAME, SEEING IS TOUCHING, etc.) and trace their entailment-structures across hundreds of attested linguistic-expression patterns. The book establishes the empirical case that (a) abstract domains are systematically structured by conceptual metaphors with source-domain entailments imported; (b) the entailments shape reasoning, inference, and behavior toward the target domain; (c) participants do not experience the metaphor as a metaphor — the source-domain entailments feel like literal properties of the target domain; (d) different cultures and historical periods use different conceptual metaphors for the same abstract domains, and the differences track downstream cognitive and behavioral differences. Conceptual Metaphor Theory (CMT) has been extensively replicated and extended by Lakoff, Kövecses, Gibbs, Fauconnier-Turner, and many others. The theory has applications across cognitive science, anthropology, political science (Lakoff's *Moral Politics* 1996, *Don't Think of an Elephant* 2004 — political frames as conceptual metaphors), philosophy of science (the role of metaphor in scientific paradigm change), and cultural history (the historical-cultural mapping of metaphor-availability)."
    quote: "[Lakoff & Johnson 1980 *Metaphors We Live By* Ch.1 'Concepts We Live By', central thesis:] 'Most people think they can get along perfectly well without metaphor. We have found, on the contrary, that metaphor is pervasive in everyday life, not just in language but in thought and action. Our ordinary conceptual system, in terms of which we both think and act, is fundamentally metaphorical in nature.' [Ch.1 on the ARGUMENT IS WAR example:] 'Try to imagine a culture where arguments are not viewed in terms of war, where no one wins or loses, where there is no sense of attacking or defending, gaining or losing ground... It is in this sense that the ARGUMENT IS WAR metaphor is one that we live by in this culture; it structures the actions we perform in arguing.' [Ch.2 on TIME IS MONEY:] 'Time in our culture is a valuable commodity. It is a limited resource that we use to accomplish our goals. Because of the way that the concept of work has developed in modern Western culture, where work is typically associated with the time it takes and time is precisely quantified, it has become customary to pay people by the hour, week, or year. In our culture TIME IS MONEY in many ways: telephone message units, hourly wages, hotel room rates, yearly budgets, interest on loans, and paying your debt to society by 'serving time.'' [Ch.4 on systematicity:] 'The very systematicity that allows us to comprehend one aspect of a concept in terms of another (e.g., comprehending an aspect of arguing in terms of battle) will necessarily hide other aspects of the concept. In allowing us to focus on one aspect of a concept (e.g., the battling aspects of arguing), a metaphorical concept can keep us from focusing on other aspects of the concept that are inconsistent with that metaphor.' [Ch.21-22 on the broader empirical claim:] 'It is reasonable enough to assume that words alone don't change reality. But changes in our conceptual system do change what is real for us and affect how we perceive the world and act upon those perceptions.'"
  - source: primary
    tradition: lent-2017-the-patterning-instinct
    text: lent-2017-ch15-to-command-the-world
    citation: "Jeremy Lent, *The Patterning Instinct: A Cultural History of Humanity's Search for Meaning* (Prometheus 2017), Ch.15 '\"To Command the World\": Metaphors of Nature' (pp.277-296). Lent's Ch.15 applies the Lakoff-Johnson conceptual-metaphor framework to the historical-cultural case of European-modern conceptual metaphors for nature, and documents the specific population-scale behavioral consequence. Lent traces the cluster CONQUERING NATURE / DOMINION OVER NATURE / NATURE AS MACHINE through Bacon (1620-1630s), Descartes, Boyle, Leibniz, Kepler, Hobbes, Malebranche, Loeb (1912 *Mechanistic Conception of Life*), and on into Dawkins ('a bat is a machine'), naming the four-century arc of extractive-and-mechanistic relation to the natural world as the population-scale behavioral consequence of the metaphor-cluster. Lent's substantive contribution beyond Lakoff is the historical specificity: it was Bacon's specific 1612-1620s witch-interrogation legal metaphors (Pendle Hill trial as background) that crystallized the CONQUERING NATURE metaphor, and the metaphor then spread irresistibly through European discourse because it (a) cohered with the existing Christian DOMINION-OVER-NATURE metaphor in Genesis, (b) fit the emerging mechanistic-clockwork worldview, and (c) provided theological cover for unlimited extraction. The behavioral consequence — four centuries of accelerating environmental degradation — was experienced by participants as natural-and-obvious rather than as a metaphor-contingent choice, exactly as Lakoff-Johnson's mechanism predicts. The historical case grounds and operationalizes the abstract conceptual-metaphor-theory claim at civilizational scale."
    quote: "[Lent 2017 Ch.15 p.278, on Bacon's metaphor:] 'The images Bacon used to galvanize the spirit of scientific discovery helped to create a new metaphor of humanity's relationship with the natural world unlike any that had come before: CONQUERING NATURE. Sometimes, Bacon envisaged an all-out battle between humanity and nature, calling upon mankind \"to unite forces against the nature of things, to storm and occupy her castles and strongholds and extend the bounds of human empire.\"' [Lent 2017 Ch.15 p.278, on the metaphor's irresistible spread:] 'Bacon hit such a nerve in the popular imagination that his metaphor quickly pervaded European discourse. Descartes wrote of how, with the new scientific approach, we could \"render ourselves the masters and possessors of nature.\" The famous scientist Robert Boyle noted approvingly his colleagues' \"desire to command her\" and \"to bring nature to be serviceable to their particular ends, whether of health, or riches, or sensual delight.\" The German philosopher and mathematician Gottfried Leibniz wrote admiringly of \"the art of inquiry into nature itself and of putting it on the rack — the art of experiment which Lord Bacon began so ably.\"' [Lent 2017 Ch.15 p.278, on the structural claim about metaphor cognition:] 'Metaphors matter. As we've seen, the root metaphors cultures use to make sense of the cosmos encourage patterns of thought that permeate daily life. They hide in plain sight within our cognition, becoming so entrenched in our thinking that we forget they are metaphors and begin to believe them as fact, along with the logical entailments that arise from them. As George Lakoff puts it, \"Metaphor plays a very significant role in determining what is real for us... Metaphorical concepts... structure our present reality. New metaphors have the power to create a new reality.\"' [Lent 2017 Ch.15 p.282-285, on the NATURE AS MACHINE metaphor and Kepler-Descartes-Hobbes propagation:] 'Johannes Kepler framed his entire life's work on the metaphor, writing to a friend in 1605, \"My aim is to show that the celestial machine is to be likened not to a divine organism but to a clockwork.\"... It was Descartes who transformed the NATURE AS MACHINE metaphor into a pseudoscientific theory that nature actually is a machine, boldly declaring, \"I do not recognize any difference between the machines made by craftsmen and the various bodies that nature alone composes.\" Meanwhile, in England, Thomas Hobbes introduced his famous work Leviathan with a full-blown description of the body as a machine constructed by God.' [Lent 2017 Ch.15 p.285, on the metaphor losing its metaphor-character:] 'The metaphor became so entrenched in the burgeoning scientific worldview that it began to lose its metaphoric character and be used as if it were reality.' [Lent 2017 Ch.15 p.285, on contemporary continuation in Dawkins:] 'Richard Dawkins, has famously written that \"life is just bytes and bytes and bytes of digital information,\" adding, \"That is not a metaphor, it is the plain truth. It couldn't be any plainer if it were raining floppy discs.\" Dawkins is equally strident in reprising Descartes's view of the mechanical nature of the animal world, stating that \"a bat is a machine, whose internal electronics are so wired up that its wing muscles cause it to home in on insects.\"' [Lent 2017 Ch.15 p.285, naming the population-scale behavioral consequence:] 'This, however, has not prevented Dawkins's mechanistic view of life from being broadly accepted as the truth in mainstream thought. \"New metaphors have the power to create a new reality,\" Lakoff observes. Dawkins provides compelling evidence in support of that statement.'"
canonical-instances:
  - "ARGUMENT IS WAR (Lakoff & Johnson 1980 Ch.1): in modern American English, arguments are 'defended,' 'attacked,' 'won,' 'lost,' positions are 'demolished' or 'indefensible,' claims are 'shot down.' The metaphor structures the practice of arguing: adversarial, zero-sum, focused on victory. The metaphor makes collaborative-argument feel like a category error. Alternative cultures and contexts use different metaphors (ARGUMENT IS DANCE, ARGUMENT IS COOPERATIVE BUILDING) that produce different practices"
  - "TIME IS MONEY (Lakoff & Johnson 1980 Ch.2): in modern Western culture, time is 'spent,' 'saved,' 'wasted,' 'budgeted,' 'invested,' 'borrowed.' The metaphor makes hourly-wage labor, time-budgeting, and 'paying your debt to society by serving time' feel coherent. Pre-modern cultures and many non-Western cultures use different metaphors (TIME IS CYCLE, TIME IS A RIVER) that produce different practices around scheduling, deadlines, and the value-of-time"
  - "the CONQUERING-NATURE / DOMINION-OVER-NATURE / NATURE-AS-MACHINE metaphor-cluster (Bacon 1620s onward via Descartes-Boyle-Hobbes-Kepler-Leibniz, transmitted through Loeb 1912 to Dawkins; Lent 2017 Ch.15 traces the four-century arc): the cluster crystallized a behavior pattern of extractive-and-mechanistic relation to the natural world that participants experienced as natural-and-obvious. The population-scale behavioral consequence — accelerating environmental degradation across four centuries — was not experienced by participants as a metaphor-contingent choice. The canonical large-scale case of the transferable mechanism"
  - "MIND IS A CONTAINER (Lakoff & Johnson 1980, Lent 2017 Ch.10 p.204): in modern Western English, the mind 'holds' thoughts, 'fills' with worries, can be 'emptied' or 'cleared,' and we can 'put something out of your mind.' The metaphor makes thought-objects-in-spatial-container feel literal; it makes consciousness feel bounded; it produces specific therapeutic interventions (emptying the mind in meditation, putting worries into a box). Cultures with different metaphors (MIND IS A RIVER, MIND IS A NETWORK, MIND IS A LIGHT) produce different therapeutic and contemplative practices"
  - "LOVE IS A JOURNEY (Lakoff & Johnson 1980 Ch.5): the relationship 'goes places,' 'reaches a dead end,' 'gets off track,' has 'crossroads,' the partners are 'fellow travelers.' The metaphor makes coupled-progress over time feel like the criterion for love; it makes relationship-ending feel like 'arriving nowhere'; it produces specific relationship interventions ('relationship counseling' as path-correction). Different metaphors (LOVE IS A PLANT TO TEND, LOVE IS A FORGE, LOVE IS A DANCE) produce different relationship-practices"
  - "BODY IS A MACHINE (Descartes onward, Loeb 1912, modern biomedicine): symptoms are 'malfunctions,' the body 'needs repair,' parts can be 'replaced' (transplants, prosthetics), 'maintenance' is required (annual checkups). The metaphor makes biomedical reductionism feel obvious; it produces organ-by-organ specialization in medical training; it makes integrative-medicine feel like new-age woo. The alternative metaphor (BODY IS A GARDEN, BODY IS A FIELD OF RELATIONSHIPS) produces traditional-medicine and integrative-medicine practices that the biomedical default cannot generate from its own metaphor"
  - "CODE IS BUILDING vs CODE IS GARDENING (software-engineering metaphor shift 1970s waterfall → 1990s agile/emergent): waterfall methodology assumed CODE IS BUILDING (foundations, blueprints, finished product); agile assumed CODE IS GARDENING (planting, weeding, growing, never-finished). The metaphor-swap was foundational for the methodology-shift; it made emergent design feel coherent rather than chaotic. Modern variants: CODE IS A MACHINE (engineering discipline), CODE IS A LIVING SYSTEM (autopoiesis), CODE IS A LIBRARY (documentation-centric), CODE IS ART (aesthetic discipline)"
  - "ECONOMY IS A MACHINE vs ECONOMY IS AN ECOSYSTEM (Keynesian vs complex-systems economics): the MACHINE metaphor produces interest-rate-as-throttle policy, fiscal-multiplier reasoning, and central-bank engineering. The ECOSYSTEM metaphor produces complex-adaptive-systems analysis, network-fragility concerns, and humility about top-down intervention. Different metaphor → different policy stance. Practitioners do not experience their position as metaphor-driven; they experience it as the obvious reading of the evidence"
  - "MODEL IS A BRAIN vs MODEL IS A FUNCTION vs MODEL IS AN AGENT vs MODEL IS A LIBRARY (contemporary AI metaphor-space): each conceptual metaphor for what a large language model IS produces different questions, different evaluations, different safety concerns, different product designs. BRAIN-metaphor produces consciousness-and-rights concerns; FUNCTION-metaphor produces input-output-evaluation focus; AGENT-metaphor produces goal-and-alignment concerns; LIBRARY-metaphor produces retrieval-and-citation focus. The available metaphors structure the cognitive space of AI thinking at the population scale; practitioners often do not see their own metaphor-choice"
  - "operationally distinct from lex-pm93k cultural-classification-bundles-or-splits-natural-substrate: lex-pm93k names cultural classification AXES carving substrate. lex-kfdep names how conceptual metaphors STRUCTURE reasoning within domains. Cross-fire: a culture's classification axes (lex-pm93k) influence which source-domains are available as metaphor sources (lex-kfdep); a culture's active metaphors (lex-kfdep) influence which classifications feel coherent (lex-pm93k). Coupled but distinct mechanisms"
  - "operationally distinct from lex-rbcsc worldview-shapes-values-shapes-history: lex-rbcsc names the cultural-historical CONSEQUENCE chain (worldview → values → behavior at civilizational scale). lex-kfdep names the COGNITIVE MECHANISM by which a worldview structures cognition (root metaphors as invisible cognitive infrastructure). Cross-fire: lex-rbcsc is the macro-historical claim that worldviews matter; lex-kfdep is the micro-cognitive mechanism by which worldviews matter. Used together they constitute Lent's broader cognitive-history thesis"
  - "operationally distinct from lex-hsntu recursive-displaced-language-converts-private-pattern-into-shareable-cultural-sediment: lex-hsntu names the TRANSMISSION RAIL for ideas. lex-kfdep names what RIDES the rail — conceptual metaphors that have become cognitive infrastructure. Cross-fire: lex-hsntu supplies the transmission medium; lex-kfdep names the cognitive payload"
critical-questions:
  - "the active-metaphor surfacing question: in the cognitive domain you are operating in, what conceptual metaphor are you using to think about it? Diagnostic prompts: what verbs are you using? (the verbs leak the metaphor) What inferences feel natural? (the inferences are entailments of the metaphor) What questions feel like category errors? (those are inferences the metaphor forbids) Most practitioners cannot name their active metaphor without prompting; the surfacing-discipline is the first move"
  - "the inference-constraint identification: once a metaphor is surfaced, what inferences does it make feel natural and what does it make feel forbidden? Lakoff & Johnson Ch.4: 'the very systematicity that allows us to comprehend one aspect of a concept in terms of another will necessarily hide other aspects of the concept.' The hidden aspects are where the metaphor's cognitive blockage operates. The discipline is to name SPECIFICALLY which inferences are made-easy and which are made-hard by the metaphor"
  - "the metaphor-swap thought experiment: when stuck on a problem, deliberately swap to an alternative conceptual metaphor for the domain and ask which inferences become available that were previously blocked. The swap often surfaces breakthrough thinking. Examples: ARGUMENT IS DANCE (not war) → cooperative resolution; ECONOMY IS ECOSYSTEM (not machine) → complex-adaptive analysis; MODEL IS LIBRARY (not brain) → retrieval-and-citation design. The discipline is to maintain a portfolio of alternative metaphors rather than commit to a single one"
  - "the population-scale behavioral diagnostic: at population scale (a community, a profession, a civilization), what conceptual metaphors are operative? Are participants experiencing the population-scale behavioral patterns as natural-and-obvious or as metaphor-contingent choices? Lent's contribution to the cognitive-metaphor framework is the historical mapping at civilizational scale; the practitioner-question is whether the contemporary patterns you are observing have a similar metaphor-driven structure"
  - "the breakthrough-as-metaphor-swap recognition: many scientific and cultural breakthroughs are conceptual-metaphor swaps disguised as discoveries. Kepler's celestial-machine reframing Aristotle's celestial-spheres; Watson-Crick's DNA-AS-INFORMATION reframing protein-as-life-stuff; Marr's three-levels reframing computation-as-mechanism; Wirth's STRUCTURED PROGRAMMING reframing CODE IS GOTO; Christensen's DISRUPTIVE INNOVATION reframing markets-as-quality-competition; Berliner's PRINTING-PRESS-AS-COMMUNICATIONS-REVOLUTION reframing typography-as-craft. Recognizing the pattern lets the practitioner consider whether the next breakthrough in their domain might similarly be a metaphor-swap"
  - "the disavowal-of-metaphor warning sign: when a practitioner DENIES that a description is metaphorical and claims literal truth ('this is not a metaphor; it is the plain truth' — Dawkins), the disavowal often signals that the metaphor has reached cognitive infrastructure status. Lakoff & Johnson note this; Lent applies it to Dawkins. The diagnostic: when someone defensively insists a description is non-metaphorical, suspect that the metaphor has become invisible to them. The defense itself is the symptom of metaphor-as-infrastructure"
  - "the LLM/AI-design application: training corpora reproduce conceptual metaphors from the source culture; LLMs inherit those metaphors as cognitive infrastructure. When a model produces normative reasoning, what conceptual metaphors is it using? Are those metaphors fit-for-purpose for the deployment context, or are they Western-modern defaults that may produce bad inference in other cultural deployments? The practitioner-discipline at deployment time is to surface the model's active metaphors and test whether they fit the use-case"
status: active
