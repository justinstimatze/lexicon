id: lex-2b9sn
name: satisfy-the-want-at-the-boundary-instead-of-blocking-the-crossing
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Bill Gammage's research into Aboriginal land management in southeastern Australia found wells positioned between kangaroo grazing pastures and the grain and tuber croplands they bordered. Pascoe's Dark Emu describes the effect: the wells 'provided all the needs of animals so they had no cause to enter areas dedicated to crops.' No fence stood at that boundary. None was needed. A fence stops a crossing that would otherwise happen by physically blocking the path -- it has to be strong enough to resist whatever wants through, and it has to be maintained against that pressure indefinitely. This does the opposite: it removes the reason to cross in the first place, by making sure everything the crosser wants is already available on the near side of the line. The animal never tests the boundary because the boundary was never where the conflict actually lived -- the conflict lived in the animal's unmet need, and that's what got addressed. The technique needs one thing a fence doesn't: you have to know exactly what the crosser wants, in enough specific detail to supply it, and you have to be willing to supply it rather than just defend against its absence. Diagnostic move: when you're about to build a barrier to stop something from crossing a line, ask what's actually pulling it across. If the pull can be satisfied on the near side instead, the barrier may be solving the wrong half of the problem -- and unlike a fence, satisfying the want doesn't need to be strong enough to survive an attack, because there's no attack to survive."
related: []
evokes: [gammage-biggest-estate-on-earth, psychological-fence, wells-between-pasture-and-cropland, no-cause-to-enter, remove-the-reason-not-the-path]
lineage:
  - source: primary
    text: pascoe-2018-dark-emu-aboriginal-australia-and-the-birth-of-agriculture
    citation: "Bruce Pascoe, *Dark Emu: Aboriginal Australia and the Birth of Agriculture* (Scribe Publications, 2018), Ch. 5 'Fire,' describing Bill Gammage's findings from *The Biggest Estate on Earth* (2011)."
    quote: "'Bill Gammage has made an exhaustive study of the Australian Aboriginal use of fire and noticed that, even in contemporary times, grassland production has been used as a lure to kangaroos and emus but, primarily, to keep stock away from deliberate plantings of grain and tuber crops. He speculates that the positioning of wells between kangaroo pastures and croplands provided all the needs of animals so they had no cause to enter areas dedicated to crops. A psychological fence.'"
canonical-instances:
  - "A data center keeps losing capacity to unauthorized personal charging of e-bikes and scooters in the server room, despite signage and a locked door that people keep propping open. Facilities stops fighting the propped door and installs a free charging station in the lobby instead. The propping stops, and the reason is simple: nobody needs to bring a scooter past that door anymore."
  - "A national park's most damaged trail is a shortcut hikers cut through fragile understory to reach a viewpoint faster than the marked path allows. Every barrier the park service builds gets stepped over or around within a season. The damage stops only when they reroute the marked trail itself to be the shortest path to the viewpoint -- the desire line and the official line become the same line, and there's nothing left to cut through the brush for."
  - "A company's IT department spends years blocking employee use of unapproved cloud storage for work files, tightening firewall rules each time a new service gets discovered. Usage drops for good only once IT ships an approved tool that's actually as convenient as the banned ones -- the same file-sharing need the employees had all along, now met on the approved side of the policy line."
critical-questions:
  - "Doesn't this just relocate the resource cost from building a fence to permanently supplying the want -- is it actually cheaper? Sometimes. Wells and grasslands were already part of the managed landscape's upkeep; the technique is cheap specifically when the want being satisfied is something you're already positioned to provide, or something with much lower ongoing cost than a fence's construction and maintenance. Where satisfying the want would be more expensive or would need to be invented from nothing, a physical barrier can be the better trade."
  - "What happens when the want changes, or a new crosser arrives whose want isn't the one you provisioned for? A psychological fence protects against the specific want it was built to satisfy and nothing else -- a physical fence at least resists an unanticipated pressure by default. This is the technique's real fragility: it requires an accurate, standing model of what the crosser wants, and it degrades silently (not visibly, the way a breached physical fence does) when that model goes stale."
