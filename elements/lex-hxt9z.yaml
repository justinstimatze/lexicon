id: lex-hxt9z
name: performing-unaffected-composure-protects-standing-despite-private-hardship
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person under real material hardship can maintain the outward posture of someone unaffected by it, specifically to protect a social standing that depends on being seen as unaffected — a warrior who hasn't eaten still holds his toothpick high, performing the aftermath of a meal he didn't have. The performance is a separate, deliberate choice about what the hardship gets to cost socially, layered on top of what it already costs materially — a different question from whether the hardship's severity is being honestly represented."
related: []
evokes: [galef, kotowaza, japanese-proverbs, composure-as-status-maintenance, performing-unaffected-under-deprivation]
lineage:
  - source: primary
    text: galef-1987-even-monkeys-fall-from-trees
    citation: "David Galef (compiler and translator), *Even Monkeys Fall From Trees: And Other Japanese Proverbs*, illustrations by Jun Hashimoto, foreword by Edward G. Seidensticker (Tuttle Publishing, copyright 1987; ebook ISBN 978-1-4629-0318-4), Proverb No. 96. Verified verbatim against a direct extraction of the held copy."
    quote: "Bushi wa kuwanedo taka-yōji. Even when a samurai has not eaten, he holds his toothpick high."
canonical-instances:
  - "A freelancer between contracts still shows up to industry events well-dressed and describing a full pipeline, not to deceive anyone about a specific deal, but because looking unaffected by the dry spell is itself part of what keeps future work coming."
critical-questions:
  - "Does maintaining this posture actually protect the standing it's meant to protect, or does it also block the person from getting help they could otherwise ask for, by hiding the hardship from the people positioned to offer it?"
status: active
