evokes: [installment-requests-add-up-to-a-refusal-you-never-got-to-make, zitkala-sa-the-tree-bound, each-step-alone-looks-reasonable-together-they-disarm-you, the-cumulative-total-is-the-real-ask]
lineage:
  - source: primary
    text: zitkala-sa-tree-bound-graduated-disarming-of-the-avenger
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'The Tree-Bound.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'I have not had a mouthful of food this day. Have pity on me, young brave, and shoot yonder bird for me!' ... 'My friend, your beaded buckskins may be torn by the branches. Leave them safe upon the grass till you are down again.' ... 'My friend, toss to me your arrow that I may have the honor of wiping it clean on soft deerskin!' ... 'Grow fast to the bark of the tree!'"
canonical-instances:
  - "A new employee is asked by a manipulative coworker for a small favor covering a shift, then a bit later to share their manager's private contact for 'a quick heads-up,' then to forward an internal document 'just for reference' -- each request small and plausible on its own, but together they've quietly given the coworker exactly the access and leverage needed for something the employee would have refused outright if asked directly."
  - "A scammer posing as tech support asks a victim to first confirm their name, then their account email 'to verify identity,' then a one-time verification code 'to complete the security check' -- each step framed as routine and protective, cumulatively handing over everything needed to take over the account, when the direct request ('give me your login code') would have triggered obvious suspicion."
critical-questions:
  - "how does someone distinguish a genuinely manipulative sequence of small requests from an ordinary, benign series of favors that simply happens to accumulate over time without any orchestrated intent behind it?"
  - "does periodically auditing the cumulative total of a series of requests risk making someone overly suspicious of normal incremental cooperation, damaging relationships that depend on granting reasonable small favors without constant reassessment?"
  - "once someone recognizes mid-sequence that the cumulative ask is dangerous, is it always possible to stop or reverse course, or does the sequence sometimes reach a point (like the avenger already up the tree, unarmed) where recognizing the pattern comes too late to act on it?"
status: active
