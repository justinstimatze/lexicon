    quote: "\"What is half a realm to me?\" said he in his heart; \"I will kill Sakka, and reign alone!\" But kill Sakka he could not. This desire and greed of his was the root of his misfortune."
canonical-instances:
  - "An executive who wanted a division, then the whole company, then a board seat at the parent conglomerate, finds that reaching each position produces only weeks of satisfaction before the next tier up becomes the new fixation, with no level ever registering as genuinely enough."
critical-questions:
  - "Is the escalation itself the problem, or only the final, impossible step — would the emperor's desire have been perfectly sustainable if he'd stopped wanting anything beyond ruling half of Sakka's realm?"
  - "Does satisfaction actually relocate at every single tier, or does the story compress what might, for most people, be a much slower and less total pattern of escalating want?"
