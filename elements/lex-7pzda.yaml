canonical-instances:
  - "The direct textual anchor: Douglass extends the same reversal to a general principle about any unequal power relationship -- 'until it shall be safe to leave the lamb in the hold of the lion, the laborer in the power of the capitalist, the poor in the hands of the rich, it will not be safe to leave a newly emancipated people completely in the power of their former masters.'"
  - "Hypothetical: a factory's management argues against unionization by warning that ownership will react badly and relations will sour. A worker organizer points out that management's admitted willingness to retaliate against organized labor is itself the reason workers need the collective protection a union provides, not a reason to remain unorganized and exposed to that same retaliation individually."
critical-questions:
  - "Does this reversal hold in every case, or only when the resented protection is genuinely defensive rather than itself aggressive -- would the same logic wrongly justify escalating power grabs by pointing to an opponent's predictable resentment of any power shift at all, defensive or not?"
  - "Whose resentment counts as diagnostic here -- does the argument require the resentment to come specifically from the party the protection defends against, or would resentment from an unrelated third party carry the same evidentiary weight?"
  - "Is there a point at which the predicted retaliation becomes so severe or so certain that it should count as a genuine cost to be weighed against the protection's benefit, rather than treated purely as confirming evidence for granting it regardless of that cost?"
