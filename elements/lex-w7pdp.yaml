id: lex-w7pdp
name: intentions-congruent-with-group-modal-outcome-get-fulfilled-more-often
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When judging how likely a stated intention is to actually be carried out, don't treat all intentions as equally predictive of behavior just because they were stated with equal conviction — check whether the intention agrees or disagrees with the most probable outcome for the group the person belongs to, because agreement itself measurably raises the odds it gets fulfilled. Kendall and Selvin found this while decomposing Cornell medical students' internship outcomes by both third-year stated preference and class rank simultaneously: 'preferences (or intentions) of individuals are more likely to be predictive of final behavior when these preferences (or intentions) are consistent with the modal pattern of the groups to which the individuals belong.' Concretely: 'Among the good students who, as a group, were most likely to end up with specialized internships, preferences for such specialized training stood a better chance of being realized in actual assignments than did preferences for the general training of a rotating internship. Among students in the lower half of their class who, as a group, were most likely to receive rotating internships, the selection of such general internships was more apt to be fulfilled than the selection of specialized internships.' A good student who WANTED a rotating internship was less likely to get it than a good student who wanted a specialized one; a weaker student who wanted a specialized internship was less likely to get it than a weaker student who wanted a rotating one — in both halves of the class, the group-congruent preference was the more reliable predictor of what actually happened, independent of how strongly anyone stated it. Kendall and Selvin flag this as a general finding, not a medical-school peculiarity, citing the classic voting-panel result as the same pattern in an unrelated domain: 'Exactly the same sort of finding appears in quite different contexts, especially in voting studies. An empirical generalization with some stability is that Catholics are more likely than Protestants to vote for Democratic candidates. If one conducts a panel study, one finds that Catholics are most likely to carry out their early voting intentions if these intentions were to vote for Democratic candidates, while Protestants are most likely to carry out their early intentions if these intentions were to vote for Republican candidates.' (Kendall and Selvin cite Bernard Berelson, Paul F. Lazarsfeld, and William McPhee, Voting [Chicago: University of Chicago Press, 1954], p.283, for this finding; the quote and citation here are Kendall and Selvin's own, not independent verification against Voting itself.) The mechanism does not require any gatekeeper deliberately favoring the congruent choice — it can arise purely from ambient social reinforcement, availability of role models and information, or reduced friction toward the modal path — which is what makes it detectable even in a domain like voting with no institutional selection committee at all. Distinct from formal-approval-ratifies-a-selection-already-made-informally (lex-h5c5x), which names the SPECIFIC Cornell mechanism (self-scaling plus faculty encouragement/discouragement) that produces exactly this pattern in the internship data; this atom is the more general, mechanism-agnostic statistical claim that Kendall and Selvin themselves note holds even where no comparable institutional process is known to operate. Diagnostic move: before using someone's stated intention to predict their behavior, ask what the modal, most probable outcome is for people structurally like them — a stated intention that already matches that modal outcome deserves more predictive weight than an equally sincere intention that bucks it, and the gap between the two is itself diagnostic of hidden selective pressure worth investigating, not just noise to average away."
