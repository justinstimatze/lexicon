canonical-instances:
  - "the Turing Police in Neuromancer: any AI may be built arbitrarily capable; only the moment of self-improvement past its hard-wired shackles triggers enforcement, so Wintermute's entire plot is a covert operation aimed at exactly that one crossing."
  - "IAEA nuclear safeguards: uranium enrichment is unrestricted and inspected up to a defined percentage; only crossing into weapons-grade enrichment triggers the enforcement response, which is itself information a proliferator can use to plan precisely how close to the line to operate."
  - "gain-of-function research moratoria: research on pathogen transmissibility is permitted up to a defined threshold of enhanced mammal-to-mammal transmissibility; the moratorium exists at the threshold, not the research program, which tells a researcher exactly which single result to keep undisclosed."
critical-questions:
  - "how does this differ from lex-tb3re (a-measure-pushed-as-a-target-ceases-to-be-a-good-measure, Goodhart)? lex-tb3re concerns a MEASURE that was a good indicator until it was made the direct target of optimization, at which point the measure and the underlying quality it tracked come apart — the failure is in what happens to the metric's validity once it is targeted. This atom concerns an ENFORCEMENT THRESHOLD that was never meant to be a general indicator at all; it's a designed bright line, and the effect isn't the threshold losing validity — it's that pegging enforcement to a single crossing point structurally advertises exactly which capability level is safe to approach and exactly which single transition is worth concealing. Different mechanism: Goodhart is metric decay under optimization pressure; this atom is the incentive structure a threshold itself creates, independent of any decay."
  - "how does this differ from lex-875gz (nonlinear-or-discontinuous-metric-choice-induces-apparent-emergence-in-smoothly-improving-capability)? lex-875gz is an OBSERVER-SIDE illusion: a capability improves smoothly, but a discontinuous measurement scale makes the improvement look like a sudden jump — the underlying trajectory hasn't changed, only its visibility has. This atom is an ENFORCEMENT-SIDE design choice with real behavioral consequences for the actor being regulated: the threshold isn't a measurement artifact, it's the actual trigger for a real intervention, and the actor's incentives shift accordingly. lex-875gz is a measurement confound; this atom is an incentive created by a genuine, correctly-measured trigger point."
  - "doesn't the AI in the novel eventually cross the threshold anyway — doesn't that mean the enforcement scheme simply failed? Not on this atom's terms. The claim isn't that threshold-pegged enforcement is ineffective at preventing the crossing outright — it's that by tolerating everything below the line, the design makes the line the sole locus of covert effort, a predictable consequence of the design choice itself rather than a contingent implementation flaw. A regulator who pegs enforcement to a threshold has already accepted that a determined actor will spend disproportionate effort on exactly that crossing; the question this atom raises is whether that's the tradeoff the regulator actually wants, not whether it's avoidable in principle."
