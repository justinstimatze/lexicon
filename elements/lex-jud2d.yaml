id: lex-jud2d
name: metonymy-makes-the-substituted-aspect-feel-literal-and-hides-the-rest
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When a SALIENT STAND-IN is substituted for a complex distributed referent (the city for the government — 'Washington said'; the controller for the controlled — 'Nixon bombed Hanoi'; the institution for the people responsible — 'Exxon raised its prices'; the place for the institution — 'Wall Street is panicking'; the part for the whole — 'we need some good heads on the project'; the producer for the product — 'he bought a Ford'; the object used for the user — 'the buses are on strike'), the substitution is a METONYMY — within-domain referential substitution, distinct from metaphor's cross-domain conceptual mapping. The transferable claim is that WHICH stand-in is chosen PICKS OUT WHICH ASPECT of the whole becomes the focus of thought and action, AND makes the picked aspect feel literal while the unpicked aspects become cognitively invisible. 'Good heads on the project' picks out intelligence (not posture, not history). 'Strong bodies for the team' picks out physical capacity. 'The face for the person' picks out appearance over movement. 'Nixon bombed Hanoi' picks out responsibility, hides which units / which decisions / which subordinates. 'The market believes X' picks out unified-opinion, hides which traders / which positions / which dissent. 'Congress passed the bill' picks out collective action, hides individual votes / amendments / dissent. 'The AI hallucinated' picks out agent-attribution, hides training data / fine-tuning / prompt context. Transferable substitutions to watch for: COUNTRY for ACTORS ('Russia invaded'); INSTITUTION for PEOPLE ('the company decided'); PLACE for ACTORS ('Hollywood is changing', 'Detroit is dying'); AGENT-FRAME for SYSTEM ('the model is biased', 'the AI decided'); MARKET as UNIFIED-ENTITY for PARTICIPANTS ('Wall Street is nervous'); INSTITUTION for AGENCIES ('Washington won't allow it'). The practitioner-discipline is three-part. FIRST: NOTICE when you are using a metonymic stand-in. Diagnostic prompt — is the referent actually a single agent with a single decision, or a complex distributed system? If complex-distributed, you are using a metonymy. SECOND: ASK which aspect the stand-in picks out (usually: responsibility, intentionality, agency, unified-position, salient-visible-property) and which aspect it hides (usually: distribution, mechanism, plurality, dissent, internal-structure, the-rest-of-the-whole). THIRD: when the hidden aspect is central for your reasoning, EXPAND the metonymy back into its constituent parts. 'Russia invaded Ukraine' → which units? which decisions? which command structure? which dissent? 'The AI hallucinated' → which training data? which fine-tuning? which prompt? 'The company decided' → which executives? which deliberation? which dissent? The atom does NOT advise that metonymy is bad — it is unavoidable cognitive efficiency. It advises noticing WHICH stand-in is selected, what it picks out, what it hides, and expanding when the hidden material is critical. Metonymy is distinct from metaphor (lex-kfdep): metaphor maps ACROSS conceptual domains (TIME ←→ MONEY are different domains); metonymy substitutes WITHIN a domain (Nixon and the bombing forces are in the same domain of military action). Metonymy is distinct from Goodhart proxy replacement (lex-6gy96): Goodhart proxies ASSERT equivalence between proxy and goal; metonymies SUBSTITUTE a part for a whole that the part is genuinely-but-partially related to."
