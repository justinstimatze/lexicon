id: lex-73m95
name: anti-problem-elicitation-via-guaranteed-failure-inversion
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When stuck eliciting requirements, surface anti-problem elicitation — ask 'how would we guarantee failure?' and invert the answers; people often articulate constraints negatively that they can't state positively."
related: [lex-mnxhs, lex-ypecd, lex-jw34x, lex-6f5xs, lex-eb3wf, lex-xgyv7, lex-junvn, lex-u3e5m]
scaffolds-from: [lex-ypecd, lex-jw34x]
evokes: [how-do-we-GUARANTEE-failure, the-anti-problem-frame, sacred-cows-surfaced-via-humor, the-act-of-creation-is-first-an-act-of-destruction, heretical-thinking-with-psychological-cover, what-must-we-stop-doing]
lineage:
  - source: practitioner
    text: lipmanowicz-mccandless-2013-liberating-structures-triz
    citation: "Henri Lipmanowicz & Keith McCandless, *The Surprising Power of Liberating Structures* (Liberating Structures Press 2013) + liberatingstructures.com (CC BY-NC 3.0) — microstructure #6 'Making Space with TRIZ.' Verified verbatim from liberatingstructures.com 2026-05-26. NOT the Altshuller engineering-TRIZ (which is lex-mnxhs). The LS variant is an anti-problem elicitation technique: instead of asking 'what should we do?', ask 'what would we have to do to GUARANTEE the worst possible outcome?' The inversion makes psychologically-safe what would otherwise be heretical critique. Three-step protocol: (1) generate destructive actions; (2) honestly assess which the organization is currently doing; (3) commit to stopping. Lipmanowicz-McCandless borrow the TRIZ name from Altshuller but operationalize a different mechanism (anti-goal inversion, not parameter-contradiction-resolution)."
    quote: "[Lipmanowicz-McCandless 2013 / liberatingstructures.com #6 Making Space with TRIZ, CC BY-NC 3.0:] 'an act of creation is first an act of destruction' [framing — the creation-presupposes-destruction premise that licenses the technique.] 'What must we stop doing to make progress on our deepest purpose?' [the substrate-question — what-to-stop, not what-to-do.] 'Make a list of all you can do to make sure that you achieve the worst result imaginable' [the operational instruction — explicit anti-goal elicitation.] framing things as the inverse — describing what would guarantee failure — makes it easier to acknowledge uncomfortable truths that are normally taboo [the elicitation mechanism: inversion provides cover for naming sacred cows.] 'seriously fun' tone encourages 'heretical thinking' [the affective register; humor is operational not decorative — it lowers social cost of dissent the same way pre-mortem's depersonalization does.] three-step process: (1) generate destructive actions, (2) identify which the organization currently does, (3) commit to stopping [the canonical protocol; the recognition-of-self in step 2 is where the technique pays out.]"
  - source: practitioner
    text: hegelian-dialectic-as-distant-philosophical-antecedent
    citation: "G.W.F. Hegel, *Phänomenologie des Geistes* (1807). The dialectical move where antithesis is necessary for synthesis — destruction is constitutive of creation. lex-73m95's substrate-claim shares the Hegelian intuition (creation-via-destruction-as-precondition) but operationalizes it as a 35-minute facilitation technique rather than a philosophical-historical theory. The Hegel link is at the philosophical-antecedent layer; LS-TRIZ draws on Hegelian negation-positive mechanisms (antithesis-as-constitutive-of-synthesis). Not for THIS atom (already grounded elsewhere for Hegel-related atoms via Phenomenology B.IV)."
canonical-instances:
  - "the canonical worst-result protocol (LS #6): leader asks 'how would we guarantee that our team fails?' Participants list: 'don't communicate,' 'punish whistleblowers,' 'reward visible effort over outcomes,' 'micromanage,' 'hide failures,' 'tolerate verbal abuse from senior staff.' The list reads as comedy; then the group is asked which they currently do. The recognition-laugh is the technique's signature — the team has been doing 3-5 of those things without naming them as failure-causing"
  - "operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition (Altshuller TRIZ): SAME NAME, DIFFERENT TECHNIQUE. Altshuller-TRIZ resolves engineering contradictions by parameter-decomposition (a furnace-wall thin-AND-thick via variable-thickness). LS-TRIZ inverts the goal (how do we guarantee failure?) for facilitation elicitation. They share an ancestor (Genrich Altshuller's Russian engineering methodology) but the operational mechanisms are different. lex-mnxhs fires for engineering-contradiction; lex-73m95 fires for facilitation-elicitation"
  - "operationally distinct from lex-ypecd inversion-as-meaning-modifier: lex-ypecd is the general inversion operator (reverse the order/sign/role to reveal what the original presupposes). lex-73m95 is a specific inversion: invert the GOAL (success → guaranteed failure) for the specific purpose of eliciting suppressed knowledge about current counterproductive activities. lex-ypecd is the genus; lex-73m95 is a particular operational-species"
  - "operationally distinct from lex-eb3wf prospective-hindsight-as-failure-mode-elicitation (pre-mortem): pre-mortem assumes the failure HAS happened and asks for plausible causes (retrospective frame). LS-TRIZ asks what would CAUSE failure if we wanted to guarantee it (anti-goal frame). Pre-mortem points at risks; LS-TRIZ points at currently-active counterproductive practices. Pre-mortem is forward-looking risk-elicitation; LS-TRIZ is current-state critique-elicitation"
  - "operationally adjacent to lex-jw34x dissonance-driven-identity-defense: LS-TRIZ explicitly addresses the dissonance-defense problem. Naming a current practice as 'we're doing the thing that guarantees failure' would normally trigger defensive-justification (Festinger-style dissonance reduction). The inversion + humor framing lowers identity-threat: the participant who recognizes their behavior in the failure-list is laughing-with-the-group not being-accused. The technique routes around dissonance via cognitive-distance"
  - "operationally adjacent to lex-6f5xs static-vs-dynamic-quality-tension (Pirsig MOQ): lex-6f5xs holds tensions productively (consolidation vs creativity); lex-73m95 inverts a goal to elicit hidden destructive-static-patterns that block dynamic-quality. The two compose: identifying counterproductive practices via lex-73m95 is one operational pathway by which dynamic-quality re-opens space against over-static patterns. Different mechanisms (paradox-holding vs goal-inversion) but adjacent purpose (un-blocking productive change)"
  - "the 'sacred cow' surfacing pattern: LS-TRIZ is especially effective at surfacing TABOO practices — those everyone knows are problems but no-one can name without political cost (e.g., 'the founder's pet project that everyone agrees is a money-pit'). The inversion grants permission: 'how would we guarantee failure?' allows naming the founder's pet project as a failure-cause without directly criticizing the founder. The technique creates a fictive frame in which heretical statements are humor-not-attack"
  - "Sun Tzu *Art of War* parallel: 'know yourself and know your enemy' — but the LS-TRIZ enemy is internal (one's own organization's habits). The strategic-self-criticism move is operationally equivalent to identifying one's own vulnerabilities before an external adversary does. Cross-cultural attestation of the inverted-self-examination pattern"
critical-questions:
  - "the destruction-as-precondition-of-creation claim is contingent: not every organizational failure is caused by current-counterproductive-practices that need stopping. Some failures are caused by absent-positive-practices that need starting. LS-TRIZ surfaces the FIRST class but misses the SECOND. Diagnostic complement: pair LS-TRIZ (what to stop) with positive-deviance (lex-jw34x-style) or appreciative-inquiry (what's working) for full diagnostic coverage"
  - "the humor-framing is culturally contingent: 'seriously fun' anti-problem inversion lands well in low-power-distance Western corporate cultures. In high-power-distance cultures (East Asian organizational contexts; military hierarchies; some religious institutions) the inversion frame may itself feel insubordinate and trigger defensive-shutdown rather than psychological-safety. Mitigation: adapt the framing-language to local cultural norms; the substrate-mechanism (inversion-grants-cover) survives the framing-adaptation"
  - "the recognition-of-self step (step 2 of the protocol) requires honest self-assessment: if the group is willing to laugh at the failure-list but unwilling to recognize themselves in it, the technique stops at humor-without-action. Practitioner-discipline: explicitly require each participant to name AT LEAST ONE item from the list that their own team-area currently does. Without that forced-recognition, LS-TRIZ devolves into entertainment"
  - "the suppression-via-shaming counter-failure: if the failure-list is used as ammunition outside the LS-TRIZ session ('you said X! that means you guarantee failure!'), the technique back-fires and trust drops below pre-session baseline. The session must explicitly establish that what's named in the failure-list is contributed-by-the-group-not-by-individuals; attribution to specific people violates the depersonalization premise. The chatham-house-rule-style discipline is indispensable"
status: active
