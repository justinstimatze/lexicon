id: lex-tk8mr
name: wisdom-heard-without-receptivity-produces-no-actual-change
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Hearing genuinely good instruction and being able to act on it are separate capacities, and someone lacking the second will remain unchanged no matter how sound or how frequently repeated the instruction is. Exposure to wisdom is not the same event as receiving it. In the Jataka's tale of the reformed monkey, the Bodhisatta observes that the frivolous ascetics, having now heard his teaching secondhand through the monkey they own, will still never actually change: 'If seed upon the rock you sow, Though rain should fall, it will not grow. You may hear perfect wisdom still; But meditate you never will.' The teaching reached them completely intact. It simply had nothing in them to take root in."
related: []
evokes: [jataka, tikanipata, komaya-putta-jataka, hearing-instruction-and-being-able-to-act-on-it-are-separate-capacities, exposure-to-wisdom-without-receptivity-changes-nothing]
lineage:
  - source: primary
    text: jataka-chalmers1895-komaya-putta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book III (Tikanipata), No. 299, Komaya-putta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "If seed upon the rock you sow, Though rain should fall, it' will not grow. You may hear perfect wisdom still; But meditate you never will."
canonical-instances:
  - "A team sits through the same excellent training on a critical process failure every year, nodding along each time, and repeats the identical mistake within months, because the training was never the missing ingredient — the willingness to change how they actually work was."
critical-questions:
  - "Is receptivity itself something that can be cultivated, or does this framing risk treating some people as permanently incapable of change regardless of how the instruction is delivered?"
  - "Could the failure here belong partly to the method of delivery — hearing wisdom secondhand through an intermediary rather than experiencing it directly — rather than entirely to the listeners' own capacity?"
status: active
