id: lex-kahec
name: enforcement-becomes-self-defeating-when-the-bound-entity-is-systemically-essential
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When enforcement against a systemically-essential entity would dissolve the entity, enforcement becomes self-defeating. The binding party can't punish without destroying what the punishment is supposed to preserve. Surface this constraint before relying on enforcement as a check."
