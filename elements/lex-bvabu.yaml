id: lex-bvabu
name: epistemic-iteration-resolves-measurement-circularity-without-a-foundation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you need to justify a measurement method, a standard, or a piece of foundational knowledge, and every attempt to justify it seems to presuppose the very thing being justified — you cannot calibrate a thermometer without already knowing the temperature, cannot verify a gas is ideal without already being able to measure the absolute temperature it's supposed to indicate — do not treat the circularity as a defect to be escaped by finding an independent, theory-free starting point. There usually isn't one. Chang's resolution: accept the circularity and work inside it through epistemic iteration. Provisionally affirm an existing, admittedly fallible system of knowledge or standard, treating it as the starting point you need in order to act at all rather than as a claim you're certain is correct. Use that system to launch real inquiry. Let the results of that inquiry refine, correct, or replace parts of the original system. Repeat. Each stage is built on the one before it but is not simply deducible from it — the process is closer to creative evolution within a continuous tradition than to executing an algorithm toward a pre-known target, which is the crucial way it differs from ordinary mathematical iteration. Mathematical iteration approaches an answer that is already known or knowable by other means, so convergence can be checked directly against that true value. Nothing plays that role for epistemic iteration, so 'is this converging' gets judged pragmatically instead — by whether successive rounds of correction keep shrinking and the system keeps getting more useful. THE OPERATIVE MOVE: name the circularity explicitly rather than pretending an assumption is theory-free: state which system you're provisionally affirming, run the inquiry it enables, and treat whatever it reveals as grounds to revise the system — including, if warranted, the specific assumption you started from. The justification for the whole chain is retrospective (this process of self-correction produced real convergence and real improvement) rather than foundational (this stands on indubitable bedrock). Distinct from lex-kxk99 principles-and-considered-judgments-mutually-adjust-until-coherent (Rawlsian reflective equilibrium): reflective equilibrium adjusts principles and judgments toward each other SIMULTANEOUSLY, seeking a static coherent fit; epistemic iteration is a SEQUENCE of stages through TIME, each stage a fallible working system that inquiry then revises, with no requirement that principle and judgment ever reach mutual fit. Distinct from lex-555ug shaping-builds-a-target-behavior-by-reinforcing-successive-approximations (operant shaping): shaping has a trainer who already knows the target behavior and reinforces steps toward it; epistemic iteration has no one who already knows the target — the 'target' (e.g. the true absolute-temperature scale) is precisely what's not yet available by any other means. Distinct from lex-qhrpv comparative-substrate-bootstrapping: that atom borrows structure FROM an already-understood domain to explain a NEW one; epistemic iteration has only one domain, and each round doesn't borrow from elsewhere — it corrects itself from its own results."
related: [lex-kxk99, lex-555ug, lex-qhrpv, lex-2x8qw]
evokes: [complementary-science, hasok-chang, the-problem-of-nomic-measurement, the-thermometer-calibration-circle, provisional-affirmation, retrospective-not-foundational-justification, coherentism-over-foundationalism, callendar-le-chatelier-absolute-temperature, peirces-self-correcting-inquiry]
lineage:
  - source: primary
    tradition: philosophy-of-science
    text: chang-2004-inventing-temperature
    citation: "Hasok Chang, Inventing Temperature: Measurement and Scientific Progress (Oxford UP 2004), ch.1 'The Iterative Improvement of Standards' (coins the term, building explicitly on Peirce's notion of self-correcting inquiry) and ch.5 'Chasing Ontological Phlogiston,' the abstract and conclusion. Chang's motivating case throughout the book is the historical problem of thermometric calibration: any law expressing temperature (X) as a function of an observable quantity like thermometric-fluid volume (Y) can only be justified by already knowing X-values to test it against, but X can only be measured via the very function being tested. His resolution generalizes past thermometry to any measurement standard or foundational system facing the same circularity."
    quote: "'I propose a broadened notion of iteration, which I will call [epistemic iteration] as opposed to mathematical iteration. Epistemic iteration is a process in which successive stages of knowledge, each building on the preceding one, are created in order to enhance the achievement of certain epistemic goals. It differs crucially from mathematical iteration in that the latter is used to approach the correct answer that is known, or at least in principle knowable, by other means. In epistemic iteration that is not so clearly the case... in each step, the later stage is based on the earlier stage, but cannot be deduced from it in any straightforward sense... We have a theoretical assumption forming the basis of a measurement technique, in the form of a law that expresses the quantity to be measured, X, as a function of another quantity, Y, which is directly observable... f cannot be determined without knowing the X-values, but X cannot be determined without knowing f... In making attempts to justify measurement methods, we discover the circularity inherent in empiricist foundationalism. The only productive way of dealing with that circularity is to accept it and admit that justification in empirical science has to be coherentist. Within such coherentism, epistemic iteration provides an effective method of scientific progress, resulting in the enrichment and self-correction of the initially affirmed system.'"
canonical-instances:
  - "the book's central case: the Callendar-Le Chatelier operationalization of absolute temperature, starting from the provisional assumption that air-thermometer temperature and true absolute temperature are very close to each other, using that assumption to compute a first-round correction, checking whether the correction shrinks and converges, and treating the resulting refined scale as the improved standard — with no independently-known 'true' absolute-temperature value available anywhere in the process to check against"
  - "any bootstrapped scientific instrument-calibration problem with the same shape: you need a working thermometer to establish the physical law a thermometer is built on, you need a working ruler to determine the manufacturing precision a ruler requires, you need a trusted clock to test whether a new clock keeps accurate time. Each is resolved the same way — provisionally affirm an existing standard, use it, let what you learn correct it"
  - "operationally distinct from lex-unfs7 teaching-structure-not-facts-produces-comprehension-memory-and-transfer: that atom is about how a LEARNER acquires an already-settled body of knowledge efficiently; this atom is about how a FIELD establishes knowledge that isn't settled yet and has no external check available. Bruner's structure exists to be taught; Chang's iteration exists because there is nothing else to build the structure from"
  - "software versioning and bootstrapped compilers: an early, crude compiler is used to compile a better version of itself, which is then used to compile a still-better version — no external 'true compiler' exists to check convergence against, only the pragmatic fact that each generation successfully compiles the next and defects get fixed rather than compounded. The same epistemic shape as the thermometer case, in a domain Chang never discusses"
critical-questions:
  - "is the process actually converging, or just changing? Chang's own caution: mathematical iteration can be checked against a known target; epistemic iteration cannot. 'The corrections keep getting smaller' is evidence of convergence, but Chang notes even in his own worked case that nobody gave a conclusive demonstration that further rounds would keep converging — treat apparent stabilization as provisional, not proven"
  - "which epistemic goal is actually being optimized — truth, precision, practical usability, internal consistency? Chang deliberately allows the target to be something other than truth. Naming the goal explicitly is what keeps 'the system improved' from being an empty claim; an unstated goal lets any change be called progress after the fact"
  - "has the provisional starting system been genuinely revised by what the inquiry found, or only elaborated while its core assumption stays untouched? A process that always confirms its starting point has slid into confirmation dressed as method. Epistemic iteration only earns the name if the initial affirmation stays open to correction, up to and including being abandoned"
  - "for a non-scientific application of this shape: is there really no independent check available, or is 'there's no foundation, so any provisional start is fine' being used to justify skipping a check that does in fact exist? Chang's argument is for domains where the circularity is real and unavoidable (thermometric calibration had no outside referee); importing the same license into a domain that does have an independent check available is a misuse"
