id: lex-ezg65
name: an-unseen-protector-deters-an-assassin-through-their-own-fear-alone
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A protector can neutralize a threat without the protected party ever perceiving the intervention at all — deterrence can work entirely through the assassin's own fear of the unseen protector, leaving the target unaware anything happened until they're told afterward. In the Jataka's tale of the reforming king, Sakka stands invisibly over the sleeping king with a thunderbolt; the assassin, seeing Sakka, is too afraid to strike, while the king himself never perceives the threat or the protection: 'The Yakkha through fear of Sakka durst not strike the Bodhisatta.' The Yakkha admits as much directly: 'But all in vain the fiery bolt I wield Against the head that Indra's self would shield.'"
related: []
evokes: [jataka, catukkanipata, ayakuta-jataka, deterrence-works-through-the-assassins-fear-not-the-targets-awareness, protection-that-never-registers-to-the-one-being-protected]
lineage:
  - source: primary
    text: jataka-chalmers1895-ayakuta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 347, Ayakuta-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The Yakkha through fear of Sakka durst not strike the Bodhisatta."
canonical-instances:
  - "A high-profile executive sleeps soundly every night with no idea a former colleague's discreet, unrelated feud with a would-be blackmailer is the actual reason the blackmailer never follows through — the protection is real, but it never touches the executive's own awareness."
critical-questions:
  - "Does the protected party have any obligation to eventually learn about protection they never perceived, or is ignorance of the danger they were in actually part of what made their peace of mind genuine rather than anxious?"
  - "What happens if the unseen protector's own deterrent power ever wanes or is challenged — does the protected party remain permanently vulnerable precisely because they never knew to take any precautions of their own?"
status: active
