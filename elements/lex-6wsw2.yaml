id: lex-6wsw2
name: compare-naturally-similar-systems-that-differ-on-the-factor-of-interest
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When a phenomenon you want to study cannot be manipulated experimentally — because the subject is in the past (historical questions), too large or slow (geology, evolution, climate), embedded in human ethics (most epidemiology and social questions), or otherwise unreachable — search for NATURALLY-OCCURRING PAIRED CASES where the factor of interest VARIES while other factors are SIMILAR. The transferable move is the search-discipline: instead of abandoning the inference because manipulation is impossible, look for systems nature has already varied. Diamond-Robinson distinguish four design-axes that scale this technique: (1) number of cases — 2-case narrative (Hispaniola Haiti/DR), N-case narrative (3-7 islands or societies), large-N statistical (81 Pacific islands, 233 Indian areas), (2) data-type — non-quantitative narrative vs ranked categories vs continuous quantitative, (3) the comparison type — different perturbations applied to similar systems vs same perturbation applied to differing initial-conditions vs spatial patchwork of perturbed and unperturbed cases, (4) lag-handling — outcomes may emerge decades after the perturbation. The methodology is NOT substitute for experiment — it inherits the pitfalls Diamond-Robinson name: confounding factors the comparison missed; reverse-causation (did the perturbation cause the difference, or did pre-existing differences attract the perturbation); selection effects in which sites get perturbed; the omitted-variable risk that a measured factor is merely correlated with the actual cause. The fix is not to abandon the methodology but to make those pitfalls explicit and address them — through case-selection that minimizes confounds (Haber choosing three New-World post-colonial countries instead of a New-World + European mix), through measuring the same outcome multiple ways (Rolett-Diamond ranking deforestation on a 5-point scale), through testing whether the perturbation was geographically random (Acemoglu et al. on French Revolution patchwork over Germany). Practitioner-discipline: when you find yourself saying 'we can't run that experiment so we just have to use judgment,' STOP. Ask: has nature already run a version of that experiment? Where are the paired cases? What confounds need to be addressed?"
