id: lex-2vsgs
name: repeating-a-past-successs-form-without-what-authorized-it-yields-nothing
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Precisely reproducing every visible action of a process that worked before doesn't reproduce the outcome if what actually made it work wasn't the actions themselves but a relationship or permission that granted access to them -- the motions can be flawless and still open onto nothing. After losing his wife back to the shadowland, Coyote tries to retrace his original journey there on his own, without the death spirit who had guided and permitted him the first time: 'he began to do the same things they had done on their way to the shadowland. \"Oh, look at the horses; it looks like a roundup.\" He went on until he came to the place where the ghost had found the serviceberries. \"Oh, such choice serviceberries! Let us pick and eat some.\" He went through the motions of picking and eating berries... He went through the motions of eating again.' Every gesture is exact. What's missing is the spirit's presence and consent that made those gestures mean something the first time. The result is total absence, not a diminished version of what happened before: 'Coyote sat there all night but the lodge didn't appear again nor did the ghost ever return to him.' Diagnostic move: when trying to recreate a past success by faithfully repeating its visible steps, check whether those steps actually caused the outcome, or whether they were only the outward form of an underlying relationship, permission, or condition that isn't present this time -- if it's the latter, no amount of precision in repeating the motions will reopen what only that relationship could open."
related: [lex-63b4q]
evokes: [hyde-trickster-makes-this-world-an-old-story, coyote-and-the-shadow-people, going-through-the-motions, the-lodge-didnt-appear-again]
lineage:
  - source: primary
    text: hyde-coyotes-solo-repetition-of-the-ritual-motions-opens-onto-nothing
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Interlude, 'The Land of the Dead,' quoting Archie Phinney's 1934 translation of 'Coyote and the Shadow People.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "He went on and finally came to the place where the long lodge had stood. He said to himself, “Now when I take hold of the door flap and raise it up you must do the same.” Coyote remembered all the little things his friend had done. He saw the spot where he had sat before. He went there, sat down, and said, “Now, your wife has brought us food. Let us eat.” He went through the motions of eating again. Darkness fell, and now Coyote listened for the voices, and he looked all around, he looked here and there, but nothing appeared. Coyote sat there in the middle of the prairie. He sat there all night but the lodge didn’t appear again nor did the ghost ever return to him."
canonical-instances:
  - "A junior employee who watched a mentor close a major deal by following a precise sequence of calls, meetings, and phrasing tries to replicate the exact script solo after the mentor leaves the company, and gets nowhere, because what actually closed the deal was the mentor's accumulated trust with the client, not the sequence of words that trust happened to be expressed through."
  - "A researcher meticulously repeats every documented step of a colleague's successful experiment and gets no result, eventually discovering that the original success depended on a specific reagent batch or an informal favor from another lab that was never written into the protocol because no one realized it was load-bearing."
critical-questions:
  - "How could Coyote, or anyone in his position, actually tell in advance which parts of a successful process are the load-bearing relationship and which are genuinely replicable mechanics, when both look identical from the outside as a sequence of actions?"
  - "Is it possible that Coyote's repetition failed not because relationship matters more than form, but simply because the specific one-time permission he'd been given had already been used up and revoked after his earlier failure, making this a story about a used chance rather than about form versus substance?"
  - "Does this diagnostic risk excusing failed replication attempts too easily by attributing failure to 'missing relationship' when the actual cause might be a subtle procedural difference the replicator failed to notice or reproduce?"
status: active
