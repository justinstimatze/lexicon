id: lex-m4ztd
name: intervening-on-a-proxy-changes-the-causal-structure-that-validated-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a regulator INTERVENES on a system in order to maximize a proxy M — rather than merely SELECTING states with high M — the act of intervention can alter the causal structure that made M predictive of the goal G in the first place. This is CAUSAL Goodhart in Manheim-Garrabrant's typology. Three distinct intervention failure modes exist. (1) SHARED-CAUSE INTERVENTION: the regulator intervenes on a variable X that was a shared cause of M and G; setting X eliminates X's contribution to the M-G correlation, leaving only error terms — further M-tracking does not track G. (2) INTERMEDIARY INTERVENTION: the regulator intervenes on a variable X that lies on the causal chain G -> X -> M; setting X breaks the chain, decoupling M from G entirely. (3) METRIC MANIPULATION: the regulator intervenes directly on M without affecting G — M is changed, G is not, the proxy-goal relationship is now noise. Distinct from regressional Goodhart (lex-hbknh) and extremal Goodhart (lex-n5cf6): those failure modes operate under pure SELECTION pressure (the regulator chooses among states without intervening on the system); causal Goodhart requires the regulator to ACT on the system. Distinct from adversarial Goodhart (lex-nbk6e): causal Goodhart needs no second agent — the regulator's own intervention causes the structure-break. Importantly, the mistake does not require uncertainty or model error: even with perfect causal knowledge, an intervention can still break the proxy-goal relationship if the intervention selects a node that was cardinal for the correlation. The practitioner discipline is to model the CAUSAL DIAGRAM before intervening: ask which node you are setting and whether that node was upstream, downstream, or alongside the goal. The diagram is more important than the prediction model — predictions stay valid until you act, causal structure may not."
related: [lex-spm8x, lex-5yufs, lex-ewafs, lex-tb3re, lex-hbknh, lex-n5cf6, lex-nbk6e, lex-cwmus]
