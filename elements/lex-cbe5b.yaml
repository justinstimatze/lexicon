id: lex-cbe5b
name: food-sharing-functions-as-insurance-where-storage-and-reciprocity-accounting-both-fail
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a group shares a variable, unstorable resource (a large-game kill, a windfall catch) roughly equitably even though contribution is unequal and membership keeps shifting, don't reach first for simple reciprocal-altruism (I'll help you because you'll help me back) — exact reciprocation accounting breaks down when the same people aren't consistently paired. Boehm's forager-band finding: because meat can't be stored, sharing it out functions as insurance against the variance of hunting success — today's successful hunter is tomorrow's empty-handed one, so sharing pools risk across the whole band rather than banking favors between individuals. The mechanism that makes equitable sharing hold, despite unequal contribution and no exact accounting, is not trust or altruism alone — it also requires active suppression of would-be hoarders and self-aggrandizing 'bullies' who try to keep a disproportionate share for themselves (see lex-uxqdz for that suppression mechanism in general; this atom is about the specific resource-condition — no storage, high variance, fluid membership — that makes sharing-as-insurance the group's rational response in the first place)."
related: [lex-uxqdz]
scaffolds-from: [lex-uxqdz]
evokes: [food-sharing-as-insurance, variance-pooling, no-storage-forces-sharing, meat-sharing-among-foragers, free-riders-and-bullies]
lineage:
  - source: primary
    text: boehm-2012-moral-origins-ch3
    citation: "Christopher Boehm, Moral Origins: The Evolution of Virtue, Altruism, and Shame (Basic Books, 2012), Chapter 3 'Of Altruism and Free Riders.' The Cephu case is Boehm's own retelling of an incident among the Mbuti reported by Colin Turnbull."
    quote: "[on the equitable pattern despite unequal contribution and shifting membership:] 'in practice these people all share their big-meat carcasses in a reasonably equitable fashion and manage to do so even when some hunters are far more productive than others. This goes on even though families are constantly changing bands, which means that anything like exact reciprocation is out of the question.' [naming the insurance function directly:] 'For foraging nomads who seldom invest in storing food, meat-sharing amounts to a system of insurance.' [on why free-riders are actively suppressed rather than merely disfavored by outcome:] 'the active, punitive social suppression of free riders does not directly select for altruism; rather, it disfavors these classically deceptive born enemies of altruists by either completely suppressing their behavior at the level of phenotype or by placing them at a net genetic disadvantage.' [on the specific, less-obvious free-rider category — dominant bullies, not just passive cheaters:] 'in human evolution I believe the more potent free riders have been alpha-type bullies, who simply take what they want ... A great deal of this book will be about bullies and what small groups of people do about them.' [the Cephu case, a hunter who tried to withhold his catch:] 'being aggressively shamed to a point of humiliation by most of his peers would not be forgotten; furthermore, banishment from the band constituted a future threat that could cost him and his kin personal hardship ... Cephu's case is interesting because he was not just a cheater; he also had strong tendencies to aggrandize his own status and behave as an alpha male. The rest of the band made it clear that he could not act on these impulses and remain a member of the band.'"
canonical-instances:
  - "Big-game hunting among forager bands (Boehm's general case): meat from a successful hunt is shared across the band roughly equally regardless of who made the kill, because the alternative — each hunter keeping their own catch — leaves everyone exposed to the high variance of hunting success; sharing converts an individually high-variance resource into a collectively low-variance one, which is the actuarial logic of insurance applied without money, contracts, or storage."
  - "Cephu among the Mbuti (Turnbull's account, via Boehm): a hunter who tried to withhold part of his catch was shamed to the point of humiliation and threatened with banishment — notably not just for cheating on the sharing norm, but because he was also read as trying to behave as a self-aggrandizing alpha, and the band's response suppressed both violations at once."
  - "Operationally distinct from lex-uxqdz (egalitarianism as actively-maintained reverse dominance): lex-uxqdz names the GENERAL political mechanism — a rank-and-file coalition using ridicule, gossip, ostracism, and exile to suppress any would-be dominant, across any resource or status domain. This atom names the specific ECONOMIC CONDITION — an unstorable, high-variance resource shared across a band whose membership shifts too much for exact reciprocity accounting — that makes sharing-as-insurance the group's rational response, and for which lex-uxqdz's suppression mechanism is the enforcement layer. They compose: the economic condition (this atom) explains WHY sharing has to happen; the reverse-dominance mechanism (lex-uxqdz) explains HOW it's kept from being subverted by hoarders."
critical-questions:
  - "is the insurance framing doing real independent work, or is it fully reducible to reverse-dominance enforcement — would meat-sharing collapse to nothing without active suppression of hoarders even in a band with zero bullies, or does the insurance logic alone (everyone benefits in expectation) sustain some sharing without enforcement?"
  - "does the no-storage condition generalize past hunter-gatherer meat-sharing — does the same insurance-via-sharing logic predict sharing behavior for OTHER unstorable, high-variance resources in non-forager contexts (e.g., informal mutual-aid networks, gig-economy income pooling), or is something else about the small-band setting doing necessary work?"
  - "how large can a group get before fluid membership and lack of exact accounting stop being a feature (forcing insurance-style sharing) and start being a vulnerability (letting free-riders exploit the system without the close social monitoring a small band provides)?"
status: active
