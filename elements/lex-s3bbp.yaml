lineage:
  - source: primary
    text: radin-tricksters-keep-your-eyes-closed-rule-hides-him-killing-the-dancing-ducks
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 12. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'My younger brothers, this is the way in which you must act. When I sing, when I have people dance for me, the dancers must, from the very beginning, never open their eyes.' 'Good,' they answered. ... 'Now remember, younger brothers, you are not to open your eyes. If you do they will become red.' So, as soon as he began to sing, the ducks closed their eyes and danced. ... Finally a duck whose name was Little-Red-Eyed-Duck secretly opened its eyes, just the least little bit it opened them. To its surprise, Trickster was wringing the necks of his fellows ducks! ... Little-Red-Eyed-Duck shouted. 'Alas! He is killing us! Let those who can save themselves.' He himself flew out quickly through the opening above."
canonical-instances:
  - "A financial adviser tells clients that questioning or reviewing his trades personally 'undermines the strategy's magic' and will hurt their returns, and only one client who ignores this and audits the statements anyway discovers the fund is being quietly drained, giving the rest a chance to withdraw before it collapses."
  - "A cult leader instructs members that looking too closely at the organization's finances or leadership's private conduct is a sign of spiritual weakness that will bring them harm, and it is only when one member breaks that rule and looks anyway that others learn what has been happening and begin to leave."
critical-questions:
  - "Did any of the other ducks have reason to suspect the rule before Little-Red-Eyed-Duck broke it, or does the story present total compliance as the default outcome absent a single deliberate violator -- what would it take for suspicion to arise without anyone actually looking?"
  - "Is the stated reason for the rule, that opened eyes will turn red, plausible enough on its own that a reasonable duck would have no cause to doubt it, or does the story suggest the cover story was always thin and compliance was more about trust in the authority than belief in the specific claim?"
  - "Would partial compliance, opening the eyes only briefly as Little-Red-Eyed-Duck did rather than open defiance, generalize as the safer way to test such a rule, or does the story's outcome, most ducks still dying, suggest that a single partial violator is not enough to protect the group?"
