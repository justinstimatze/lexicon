lineage:
  - source: primary
    text: pryor-1999-dont-shoot-the-dog-reinforcement-schedules
    citation: "Karen Pryor, *Don't Shoot the Dog!: The New Art of Teaching and Training* (Revised Edition, Bantam Books, 1999), chapters on reinforcement schedules. The transferable claim is that VARIABLE-RATIO REINFORCEMENT SCHEDULES (rewards delivered after an unpredictable number of responses) produce the most persistent behavior under extinction conditions — far more persistent than continuous reinforcement (every response rewarded) or fixed-ratio schedules (every Nth response rewarded). Pryor draws on the foundational operant-conditioning literature (Skinner & Ferster 1957 *Schedules of Reinforcement*) and translates the structural finding into practitioner-accessible form. The transferable lesson generalizes far beyond animal training: variable-ratio is the engineering principle underlying gambling-machine design, social-media feed delivery, app-notification timing, intermittent-warmth relationships, and skill-training that produces behavior robust to periods of no external reinforcement. The structural claim is independent of the moral valence of the application — the same mechanism produces resilient skill (good) and compulsive engagement (often bad). Pryor's specific contribution: linking the formal operant-conditioning schedule literature to the recognizable life-pattern of intermittent-warmth relationships, where recognizing the schedule is often the first step in being able to walk away. In-copyright (Bantam Books); verbatim quotation short and attributed under fair-use. Distinct from lex-555ug shaping: shaping is the method of building behavior; variable-ratio is one specific schedule choice within any reinforcement regime. Distinct from lex-qg753 marker-signal: marker is about precision-of-identification; variable-ratio is about predictability/timing of reinforcement. Cross-domain attestation: Skinner & Ferster 1957 *Schedules of Reinforcement* (the foundational operant text — variable-ratio produces the steepest response curves and most resistance to extinction); Schüll 2012 *Addiction by Design: Machine Gambling in Las Vegas* (the modern empirical extension to slot-machine design — variable-ratio is the explicit engineering target); Eyal 2014 *Hooked: How to Build Habit-Forming Products* (the consumer-product application — explicit use of variable-ratio for engagement); Walker 2017+ social-media engagement research (variable-ratio feed delivery is documented engineering practice at large platforms); Walker 2014 *Why Love Hurts* (the relational analogue — intermittent warmth creates persistence in attachment that continuous warmth does not); Lerman et al. 2016 sleep-disordered breathing reinforcement-learning analogies (the medical application)."
    quote: "[Pryor 1999 *Don't Shoot the Dog!* on intermittent relationships, paraphrasing the transferable lesson:] 'the intensity of the \"charm\" is at least partly due to the nature of the reinforcement schedule, he or she can usually walk quietly away from this kind of relationship and look for something else.' [The book's broader treatment, paraphrasing:] Variable-ratio schedules produce behavior that is extraordinarily resistant to extinction — the trainee keeps responding through unrewarded stretches because the unpredictability of when the reinforcer comes makes 'this one' always a possibility. Continuous reinforcement extinguishes fast when reinforcement stops; variable-ratio reinforcement persists. Pryor extends this empirical finding to gambling, to compulsive checking behaviors, to romantic-attachment patterns where intermittent warmth produces attachment-persistence far exceeding what continuous warmth would. The atom captures the STRUCTURAL claim about schedule properties, with normative valence intentionally left open."
canonical-instances:
  - "Slot machine engineering (the canonical modern instance, documented in Schüll 2012 *Addiction by Design*): casinos engineer variable-ratio payout schedules as the explicit design target. The unpredictability is what produces the documented psychological phenomenon of 'machine zone' — extended persistence on a single machine through long unrewarded stretches. The same mechanism Pryor identifies in lab pigeons drives behavioral patterns in human gamblers."
  - "Social media feed delivery (transferable extension): pull-to-refresh produces a variable-ratio reinforcement schedule — sometimes there's new content, sometimes there isn't, and the unpredictability is what produces compulsive checking. The engineering practice is documented at the major platforms; the mechanism is identical to Pryor's primitive."
  - "Intermittent-warmth relationships (Pryor's relational example): a partner who is warm-then-cold-then-warm-then-cold creates variable-ratio reinforcement for affection-seeking behavior. The attachment-persistence is structurally identical to slot-machine engagement: the trainee keeps trying because the next response might be the one that gets warmth. Recognizing the schedule is often what allows people to disengage."
  - "App notification timing (transferable extension): well-designed app notifications arrive on a variable-ratio schedule — sometimes important, sometimes not, and unpredictability is what produces the constant checking. The mechanism is the same operant primitive; the deployment is at industrial scale."
  - "Skill robustness through intermittent practice (the prosocial application): musicians, athletes, and craftspeople who train themselves through periods of variable reinforcement (some sessions rewarding, some not) produce skill that survives periods of no external reinforcement. The same mechanism that produces gambling addiction produces resilient practice. The structural claim is symmetric across moral valence."
  - "Distinguished from lex-tcgej time-on-device-optimization-targets-engagement-not-welfare: lex-tcgej is about the OBJECTIVE (engagement-maximization as the optimization target); lex-bx8hz is about the MECHANISM (variable-ratio schedules) by which engagement-maximization is operationalized. They compose strongly — lex-tcgej supplies the WHY, lex-bx8hz supplies the HOW."
  - "Distinguished from lex-555ug shaping: shaping is about progressively building behavior; variable-ratio is one specific schedule choice within any reinforcement regime. They compose — shaping with variable-ratio produces resilient learned behavior; shaping with continuous reinforcement produces faster initial acquisition but more brittle behavior."
critical-questions:
  - "Is the schedule actually variable-ratio, or are you confusing variable-INTERVAL with variable-RATIO? Variable-ratio = reinforcer after an unpredictable NUMBER of responses (gambling, social media checking). Variable-interval = reinforcer after an unpredictable TIME (regardless of response rate). They produce different behavioral patterns — variable-ratio drives high response rates, variable-interval drives steady-but-lower response rates. Failure mode: collapsing the distinction and predicting the wrong behavioral pattern."
  - "Are you deploying variable-ratio toward engagement or toward welfare? The structural claim is mechanism-only; the deployment is normative. Gambling-machine engineering uses variable-ratio toward engagement-maximization with documented welfare costs (lex-tcgej composes here). Skill-training uses variable-ratio toward resilient learning with prosocial outcome. The same mechanism, different deployments. Failure mode: pretending the mechanism is neutral when the deployment context determines its moral valence."
  - "Have you recognized the schedule operating on YOU? Pryor's specific practical advice: recognizing that an intermittent-warmth relationship is operating on a variable-ratio schedule is often the first step in being able to walk away. The behavioral persistence is not a sign of true love or genuine attachment — it's a sign of the schedule. The same recognition applies to compulsive app-checking, gambling, intermittent friendship patterns. Failure mode: interpreting the behavioral persistence as evidence of the relationship's importance, when it's evidence of the schedule's effectiveness."
  - "What's the COST of producing this persistence? Variable-ratio produces persistence at the cost of welfare in many cases. The slot-machine player loses money; the social-media user loses attention; the intermittent-warmth-attached person loses agency. The persistence itself is the SYMPTOM of the schedule operating on them, not evidence of genuine value in the activity. Failure mode: confusing schedule-induced persistence with rational engagement."
  - "How does the schedule interact with the marker-signal and the shaping method? In well-designed prosocial deployments, variable-ratio composes with precise markers (lex-qg753) and explicit shaping (lex-555ug) — the trainee can see the criterion being shaped, the markers identify exactly which behavior is being reinforced, and the variable schedule produces robustness. In abusive deployments, the schedule operates without clear markers (the trainee can't predict what behavior earns warmth) and without acknowledged shaping (no consent to the criterion being shaped). The combination of the three lenses diagnoses the deployment."
