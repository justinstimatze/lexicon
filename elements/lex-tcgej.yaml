id: lex-tcgej
name: time-on-device-optimization-targets-engagement-not-welfare
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When evaluating a designed system that mediates between a user and some nominal benefit (entertainment, information, money, a service), ask whether its operative objective is the nominal benefit or 'time-on-device' — Schüll's 2012 term from gambling-industry interviews for keeping the player at the machine as long as possible, regardless of whether they win or even enjoy themselves. The mechanism: when extraction is metered per unit time of engagement, every design choice that increases engagement is incentive-compatible with the operator, regardless of how it affects user outcome. Schüll's gambling-industry quote: 'I want to keep you there as long as humanly possible — that's the whole trick, that's what makes you lose.' The transferable diagnostic: when a system's revenue or value-extraction is proportional to engagement-duration NOT to user-outcome, you should expect the design to optimize for continuous engagement at the expense of the nominal purpose. Operational signatures: (1) variable-ratio reinforcement schedules (slot machines, push notifications, infinite scroll); (2) seamless friction-elimination on entry, friction-injection on exit (the casino floor with no clocks or windows; the app that closes only via 5-step navigation); (3) personalized 'low-volatility / high-hit-frequency' tuning (the player's preference learned and exploited — Schüll's 'drip-feed, grind, dribble-pay' modes); (4) industry-acknowledged 'time-on-device' KPI replacing or supplementing user-stated-purpose KPIs. Generalizes to: social media engagement-optimization, free-to-play mobile games, streaming auto-play, attention-economy platforms, casino design, some workplace surveillance / productivity tools, certain therapeutic apps that optimize for retention not improvement. Inverse — systems where revenue is proportional to USER OUTCOME (a per-task billing structure, a money-back-on-no-recovery medical incentive, a school paid only on student post-graduation success) align design with the nominal purpose rather than with engagement duration."
