id: lex-k63nn
name: a-mockers-own-description-of-the-real-thing-is-instantly-fulfilled
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'When someone mocks another''s claim to a transformed status by sarcastically describing what the genuine version would look like, the claimant can instantaneously manifest precisely those described features, turning the mocker''s own words into unintended, literal proof — an ironic reversal in which doubt inadvertently specifies, and thereby validates, its own refutation. In the Jataka''s tale of the five Pacceka-Buddhas, one man''s friend mocks his claim to enlightenment by describing the real marks of a Pacceka-Buddha, and those exact marks appear on the claimant at once: "''Pooh! are Pacceka-Buddhas like you?'' ''What are they like, then?'' ''Hair two fingers long, yellow robes they wear, in Nandamiula cave they live high up in Himalaya.'' The other stroked his head: in that very moment the marks of a layman disappeared".'
related: []
evokes: [jataka, ekadasanipata, paniya-jataka, mockery-fulfilled-literally, ironic-reversal]
lineage:
  - source: primary
    text: jataka-chalmers1895-paniya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 459, Paniya-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Pooh! are Pacceka-Buddhas like you?\" \"What are they like, then?\" \"Hair two fingers long, yellow robes they wear, in Nandamiula cave they live high up in Himalaya.\" The other stroked his head: in that very moment the marks of a layman disappeared"
canonical-instances:
  - "A colleague sarcastically names what a 'real' six-figure book deal would take, down to the imprint and the advance figure; minutes later the skeptic's own agent calls with an offer matching every detail she just mocked."
critical-questions:
  - "Does the mocker's description do any causal work in producing the outcome, or is the irony purely coincidental — the claimant would presumably have manifested the same marks whether or not anyone had just described them?"
status: active
