id: lex-8sbet
name: wishing-a-great-responsibility-had-gone-to-someone-more-worthy
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "A person carrying a large, unfulfilled life mission can judge their own worth as inadequate to the magnitude of what they were given, wishing in retrospect that it had gone to someone more capable, while continuing to act on the very mission they doubt they deserve to carry. Looking back on decades of trying and largely failing to help his people, Black Elk doesn't reject the vision or claim it was a mistake -- he questions only the choice of recipient: 'I wish and wish my vision could have been given to a man more worthy. I wonder why it came to me, a pitiful old man who can do nothing.' In the same breath, he lists what he actually accomplished -- curing the sick, helping individuals -- before returning to the deeper failure he can't forgive himself: 'my nation I could not help.'"
related: []
evokes: [black-elk-speaks, dog-vision, a-man-more-worthy, a-pitiful-old-man-who-can-do-nothing, doubt-about-deserving-not-about-the-mission]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch15-dog-vision
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 15, 'The Dog Vision.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "And now when I look about me upon my people in despair, I feel like crying and I wish and wish my vision could have been given to a man more worthy. I wonder why it came to me, a pitiful old man who can do nothing. Men and women and children I have cured of sickness with the power the vision gave me; but my nation I could not help."
canonical-instances:
  - "A founder whose startup failed to scale into the industry-changing company it might have been says they wish the idea had gone to someone with the operational skill to actually execute it, while still working every day on a smaller version of the same vision."
  - "A first-generation immigrant entrusted with carrying a family's hopes for advancement into a new country privately doubts they were the right child for that burden, while continuing to work toward it decades later."
  - "A movement's aging founding organizer, watching the cause stall, says the torch should have passed to someone more capable years ago, while still showing up to every meeting and doing the work themselves."
critical-questions:
  - "Is this self-assessment actually accurate, or does long-term failure to achieve an enormous goal, saving an entire nation from historical catastrophe, produce this kind of doubt regardless of how capable the person carrying it actually was?"
  - "Does wishing the vision had gone to someone else function as genuine humility, or as a way of holding the vision blameless by relocating the failure entirely onto himself rather than questioning whether the mission itself was ever achievable by anyone?"
  - "Black Elk lists real successes, curing individuals, in the same passage where he calls himself someone who 'can do nothing' -- does the surrounding despair distort his own accounting of what he actually accomplished?"
status: active
