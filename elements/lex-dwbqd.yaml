lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Back to the Presocratics' (Presidential Address delivered before the Aristotelian Society, 13 October 1958; first published in the Proceedings of the Aristotelian Society, N.S. 59, 1958-9), Ch. 5 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), p.190."
    quote: "'Anaximander's achievement is valuable in itself, like a work of art. Besides, his achievement made other achievements possible, among them those of the great scientists mentioned. But are not Anaximander's theories false, and therefore non-scientific? They are false, I admit; but so are many theories, \"based\" upon countless experiments, which modern science accepted until recently, and whose scientific character nobody would dream of denying, even though they are now believed to be false. (An example is the theory that the typical chemical properties of hydrogen belong only to one kind of atom -- the lightest of all atoms.) There were historians of science who tended to regard as unscientific (or even as superstitious) any view no longer accepted at the time they were writing; but this is an untenable attitude. A false theory may be as great an achievement as a true one.'"
canonical-instances:
  - "The Bohr model of the atom is false as physics -- electrons don't orbit in fixed shells like planets -- but it's still taught first because it made the right questions askable and cleared a path to quantum mechanics that a more accurate but less approachable model wouldn't have. Chemistry textbooks that footnote its falseness while keeping it in Chapter 1 are applying this atom's logic without naming it."
  - "A startup's failed initial product thesis -- built on a customer-need hypothesis that turned out to be wrong -- can still count as the reason the company survives, if the market feedback the failed thesis generated is what let the founders find the real need next. Investors who write off the first thesis as pure waste because it 'didn't work' are scoring it on the wrong axis; the axis that matters is what the failure made visible."
  - "operationally distinct from lex-697ka frameworks-evolve-via-cycles-of-normal-stability-and-revolutionary-reframing: lex-697ka names the structural CYCLE by which paradigms replace each other (normal phase, anomaly, crisis, revolution); this atom names the STANDARD used to value a single superseded theory once the cycle has moved past it -- generativity and boldness, not correctness. A theory can occupy any phase of Kuhn's cycle and still be judged by this atom's separate axis."
critical-questions:
  - "Doesn't this risk excusing bad theorizing -- can't anyone claim their wrong idea 'cleared the way' for something better after the fact? The claim isn't that being wrong is itself a virtue; Anaximander's theory specifically had to be bold and structurally serious enough to demand real criticism, and the generativity has to be demonstrable (Aristarchus, Copernicus, Kepler, and Galileo actually building on the specific idea of unsupported, freely-poised bodies), not asserted as a post-hoc excuse for an idea that simply failed to provoke anything."
  - "How would you actually tell, at the time a theory is proposed, whether it has this kind of value, rather than only in hindsight once its successors exist? Popper doesn't offer a forward-looking test here, and this atom doesn't invent one -- the honest position is that generativity is usually visible only retrospectively, which means the practical use of this atom is mostly in how a FALSIFIED theory gets written up and taught afterward, not in picking winners in advance."
status: active
