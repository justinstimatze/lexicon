id: lex-w4x7b
name: decompose-an-unscorable-question-into-a-cluster-of-scorable-proxies
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a question that actually matters is too vague or too far off to ever be scored — 'will automation destabilize labor markets over the next 20 years?' — don't give up on forecasting it, and don't force a single premature number onto it either. Break it into several narrower questions that can each be resolved on a specific date, with each one capturing a different facet of the same underlying issue. Tetlock, Mellers, and Scoblic: 'Admittedly, the specificity required to make questions rigorously resolvable precludes asking 'big' questions. Take a concern such as 'Will increasing automation destabilize white-collar labor markets over the next 20 years?' Here, key terms are too ill-defined for the question to ever be answered 'yes' or 'no.' Probability estimates are therefore unhelpful. But there is a way around this problem: Subject-matter experts can generate specific resolvable indicators, each of which captures a distinct facet of the larger issue. For instance, will driverless for-hire vehicles without human supervision be taking passengers in a major American city by the end of 2017? Will IBM's Watson engine outperform top physicians in medical-diagnosis tournaments by the end of 2018? Will half of all accounting jobs be automated by the end of 2019? Each micro question has independent diagnostic value vis-a-vis the macro question. Taken together, these 'Bayesian question clusters' can help policy-makers better prepare for looming megachanges.' No single proxy settles the big question — a wrong call on driverless taxis doesn't refute automation's broader threat to labor markets — but a pattern across several independently-resolved proxies, tracked over time, is real evidence that the vague macro-question alone could never produce."
