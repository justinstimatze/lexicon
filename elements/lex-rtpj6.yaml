lineage:
  - source: primary
    text: salen-zimmerman-2003-rules-of-play-game-design-fundamentals
    citation: "Bernard Suits, Grasshopper: Games, Life, and Utopia (Boston: David R. Godine, 1990 [1978]), p.23, quoted in Katie Salen and Eric Zimmerman, Rules of Play: Game Design Fundamentals (MIT Press, 2003), Chapter 9 'The Magic Circle,' section 'The Lusory Attitude.'"
    quote: "'Suppose I make it my purpose to get a small round object into a hole in the ground as efficiently as possible. Placing it in the hole with my hand would be a natural means to adopt. But surely I would not take a stick with a piece of metal on one end of it, walk three or four hundred yards away from the hole, and then attempt to propel the ball into the hole with the stick. That would not be technically intelligent. But such an undertaking is an extremely popular game, and the foregoing way of describing it evidently shows how games differ from technical activities.'"
  - source: primary
    text: salen-zimmerman-2003-rules-of-play-game-design-fundamentals
    citation: "Bernard Suits, Grasshopper: Games, Life, and Utopia (Boston: David R. Godine, 1990 [1978]), pp.38-39, quoted in Katie Salen and Eric Zimmerman, Rules of Play: Game Design Fundamentals (MIT Press, 2003), Chapter 9 'The Magic Circle,' section 'The Lusory Attitude.'"
    quote: "'In anything but a game the gratuitous introduction of unnecessary obstacles to the achievement of an end is regarded as a decidedly irrational thing to do, whereas in games it appears to be an absolutely essential thing to do.'"
canonical-instances:
  - "A runner picks a hilly, slower trail over a flat route to the same destination, because the climb is what makes the run worth doing. Pave the hills flat and you haven't improved the run -- you've removed the reason the runner chose that trail."
  - "A home baker makes bread from scratch when a nearby bakery sells a better loaf in ten minutes. The kneading and the waiting constitute the actual activity being pursued; buying the loaf would satisfy the stated goal while quietly eliminating the reason for wanting it."
  - "A hobbyist programmer hand-builds a tool that an existing library already does faster and more reliably. Suggesting they just use the library treats the goal (a working tool) as the whole point, when for this person the building was."
critical-questions:
  - "How do you tell a genuine lusory attitude from someone stuck doing something the hard way out of ignorance, sunk cost, or lack of access to the easier method? The test is what happens when the easier method becomes available and cost-free -- a lusory player declines it; someone in the other cases takes it."
  - "Does the lusory attitude require full awareness that the obstacle is arbitrary, or can it operate on someone who genuinely believes the hard way is objectively necessary? Suits' account seems to require the players know the stick-and-hole method is inefficient and choose it anyway -- a golfer who sincerely thought there was no other way to move a ball wouldn't be exhibiting the same stance."
