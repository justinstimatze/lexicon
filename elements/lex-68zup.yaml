id: lex-68zup
name: buffering-traumatic-news-through-a-controlled-physical-setting
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'Before delivering news expected to cause severe shock, someone can first place the recipients in a constrained, calming physical setting and deliver the content in controlled installments, reasoning that a sudden unbuffered disclosure could be more than the recipients can bear. Rama, in the Jataka''s tale of Dasaratha, applies exactly this reasoning to his own younger siblings: before telling them their father is dead, he has them stand in water, then breaks the news across two halves of a single stanza. "Rama-pandita thought — ''These two are young: all-comprehending wisdom like mine is not theirs. If they are told on a sudden that our father is dead, the pain will be greater than they can bear, and who knows but their hearts may break. I will persuade them to go down into the water, and find a means of disclosing the truth.''"'
related: []
evokes: [jataka, ekadasanipata, dasaratha-jataka, buffered-disclosure, controlled-setting-for-bad-news]
lineage:
  - source: primary
    text: jataka-chalmers1895-dasaratha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 461, Dasaratha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Rama-pandita thought — \"These two are young: all-comprehending wisdom like mine is not theirs. If they are told on a sudden that our father is dead, the pain will be greater than they can bear, and who knows but their hearts may break. I will persuade them to go down into the water, and find a means of disclosing the truth.\""
canonical-instances:
  - "A hospice nurse has a family sit down and finish a cup of tea together before delivering a terminal diagnosis, rather than saying it the moment they walk through the door."
critical-questions:
  - "Rama's siblings faint three times even with the buffering — does the controlled setting actually reduce the impact of the news, or does it only manage the physical circumstances under which an unavoidable shock is received?"
