id: lex-y36ps
name: misattributing-repeated-setbacks-to-the-category-not-your-skill
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When you notice yourself (or someone else) generalizing from a handful of disappointing experiences with a category of things — people, arguments, hires, investments, sources — into a blanket verdict against the whole category ('you can't trust anyone,' 'you can't trust any argument,' 'you can't trust any résumé'), check specifically WHERE the blame has been routed. Plato's Phaedo (89c-91c) names this precisely by drawing a parallel Socrates himself constructs: 'as there are misanthropists or haters of men, there are also misologists or haters of ideas, and both spring from the same cause, which is ignorance of the world. Misanthropy arises out of the too great confidence of inexperience... you trust a man and think him altogether true and sound and faithful, and then in a little while he turns out to be false and knavish; and then another and another... he at last hates all men.' The parallel move: someone trusts an argument, it turns out false, then another, then another — and 'instead of blaming himself and his own want of wit... [he transfers] the blame from himself to arguments in general: and forever afterwards... hate[s] and revile[s] them, and lose[s] truth and the knowledge of realities.' The diagnostic has two independent parts, and both matter. First, a STATISTICAL check: 'experience would have taught him the true state of the case, that few are the good and few the evil, and that the great majority are in the interval between them' — a small sample of bad instances is not evidence that the category itself is untrustworthy; extremes (all-good, all-bad) are rare in most populations, so a run of a few bad draws is compatible with an ordinary base rate. Second, and this is the atom's sharper contribution: an ATTRIBUTION check — did the blame get routed to the category (protecting the self from having to admit 'I was not good at judging whom to trust' or 'I was not skilled at evaluating this argument') rather than to the actual point of failure, which is usually the evaluator's own underdeveloped judgment or vetting process? The self-protective move is comfortable precisely because it requires no further self-examination: 'the category is bad' ends the inquiry, while 'I am not yet skilled at this' obligates further work. Portable well beyond philosophy: a manager burned by two bad hires concludes 'you can never trust an interview' and abandons structured hiring altogether, rather than auditing what specifically their own interview process failed to screen for; a reader burned by a few overhyped self-help books concludes 'the whole genre is a scam' and stops reading any of it, rather than sharpening the heuristics they use to select which books are worth their time. Diagnostic: name the actual sample size behind the verdict, and ask directly — is the fault being placed in the category, or in my own still-developing skill at evaluating instances of it? If the former without ever seriously entertaining the latter, this pattern is likely operating."
related: [lex-kgphf, lex-s7jjg, lex-t9fs7]
scaffolds-from: [lex-s7jjg]
evokes: [misanthropists-and-misologists-spring-from-the-same-cause, blaming-arguments-instead-of-his-own-want-of-wit, few-are-the-good-and-few-the-evil]
lineage:
  - source: primary
    text: plato-c380bce-phaedo-jowett-misology-definition
    citation: "Plato, Phaedo 89c-90d (trans. Benjamin Jowett, Standard Ebooks 'The Dialogues of Plato' compilation). Socrates warns Phaedo against becoming a 'misologist' (hater of arguments), drawing an explicit structural parallel to misanthropy (hatred of people) as both arising from the same root: generalizing from a small run of bad instances, encountered by an inexperienced judge, into a verdict against the whole category."
    quote: "Lest we become misologists, he replied, no worse thing can happen to a man than this. For as there are misanthropists or haters of men, there are also misologists or haters of ideas, and both spring from the same cause, which is ignorance of the world. Misanthropy arises out of the too great confidence of inexperience;—you trust a man and think him altogether true and sound and faithful, and then in a little while he turns out to be false and knavish [...] he at last hates all men [...] Is it not obvious that such an one having to deal with other men, was clearly without any experience of human nature; for experience would have taught him the true state of the case, that few are the good and few the evil, and that the great majority are in the interval between them."
  - source: primary
    text: plato-c380bce-phaedo-jowett-misology-self-blame-corrective
    citation: "Same dialogue, continuing (90d-91c) — Socrates draws out the specific misattribution move: blame transferred from the evaluator's own skill to the category itself."
    quote: "Yes, Phaedo, he replied, and how melancholy, if there be such a thing as truth or certainty or possibility of knowledge—that a man should have lighted upon some argument or other which at first seemed true and then turned out to be false, and instead of blaming himself and his own want of wit, because he is annoyed, should at last be too glad to transfer the blame from himself to arguments in general: and forever afterwards should hate and revile them, and lose truth and the knowledge of realities."
canonical-instances:
  - "The direct textual anchor: Socrates's misanthropy/misology parallel — a run of bad experiences with people or arguments, encountered by someone inexperienced in judging them, generalizes into blanket distrust of the whole category, with blame routed away from the evaluator's own undeveloped judgment."
  - "A hiring manager burned by two bad hires in a row concludes 'interviews don't tell you anything' and drops structured interviewing entirely, rather than auditing what specifically their own screening process missed — routing the failure to the method rather than to their own execution of it."
  - "A reader burned by a few overhyped self-help books concludes the entire genre is worthless and stops engaging with it, rather than sharpening the heuristics they use to tell a well-evidenced book from a hollow one — the category absorbs blame that belongs to an underdeveloped filter."
critical-questions:
  - "isn't this just ordinary cynicism — why does it need a name? The atom's contribution is narrower than 'people get cynical': it names two specific, checkable components — a base-rate claim (small samples of bad instances are compatible with a normal population where extremes are rare) and an attribution claim (blame gets routed to the category specifically because that protects the evaluator from having to admit their own judgment is still developing). Either component can be checked directly; generic 'cynicism' cannot."
  - "how does this differ from lex-kgphf (burnt-child-fears-fire-singular-pain-generalizes-to-over-broad-avoidance)? lex-kgphf is a BEHAVIORAL pattern — a salient painful event installs an over-broad AVOIDANCE gradient (do I approach or avoid X-like things), corrected by comparing the avoidance to the actual recurrence rate. This atom is an EPISTEMIC/RELATIONAL pattern — repeated disconfirming experiences with a category of judgment-objects (people, arguments, sources) produce a trust-withdrawal specifically explained by a self-protective misattribution of blame, corrected by redirecting attribution to one's own evaluative skill rather than by base-rate comparison alone. The two frequently co-occur (someone burned by bad arguments both avoids arguing AND blames arguments-in-general) but name different engines and different correctives."
  - "how does this differ from lex-s7jjg (success-attributed-to-external-causes-fails-to-update-competence-belief)? lex-s7jjg is the same attribution-asymmetry structure pointed in the OPPOSITE direction at the OPPOSITE target: successes are routed externally and failures internally, undermining a person's belief in their OWN competence despite mounting contrary evidence. This atom routes failures (of trust) externally to a CATEGORY outside the self, protecting the evaluator's self-image at the cost of losing genuine future engagement with that category. Both are attribution-asymmetries; they point in opposite directions and protect different things."
  - "how does this differ from lex-t9fs7 (confirmation-bias)? Confirmation bias operates DURING active evaluation — it shapes which evidence gets sought and how it's weighted while a judgment is still being formed. This atom operates AFTER a track record of disconfirming outcomes has already accumulated, diagnosing how the person explains that track record in retrospect. It is a post-hoc attribution move about a completed pattern, not a search-and-weighting bias during ongoing evaluation."
  - "does the atom claim that distrust of a category is always the wrong conclusion? No. Socrates specifically locates the failure in 'a simple man who has no skill in dialectics' — an under-experienced judge. A domain expert whose repeated disconfirmations reflect a genuinely poor base rate for the category (e.g., a professional fact-checker whose sample of viral claims really is mostly false) is not committing this error; the atom names the failure mode for generalizers whose sample is small relative to their skill at evaluating it, not a universal ban on ever concluding a category is untrustworthy."
severity-tier: info
