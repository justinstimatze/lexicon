id: lex-a3tfj
name: testimonial-injustice-deflates-credibility-via-prejudicial-stereotype
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a speaker's testimony gets a lower credibility-rating than the evidence warrants, surface whether the deflation is being caused by a PREJUDICIAL STEREOTYPE about the speaker's social identity (race, gender, class, accent, age, disability status) rather than by the propositional content of what they said. Diagnostic: if the same statement made by a speaker without the marked identity would receive higher credibility, the deflation is testimonial injustice — not innocent error, not justified skepticism, but a structural epistemic harm that disrespects the speaker's capacity as a knower."
related: [lex-22kep, lex-2sdqf, lex-3ezh8, lex-44byg, lex-6qevt, lex-924xa, lex-9zjpf, lex-cgqta, lex-cxffc, lex-e3ddu, lex-et8q2, lex-fv4a3, lex-k8bsd, lex-kwswc, lex-mqvyk, lex-qg68a, lex-qrfr5, lex-r7zuy, lex-s2uyr, lex-uqmd7, lex-x6ft6, lex-xqamc, lex-y2nej]
