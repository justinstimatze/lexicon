id: lex-ut2hj
name: willing-sacrifice-in-turn-sustains-a-reciprocal-system
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a relationship between a taker and a giver has to repeat indefinitely, treating the exchange as adversarial on both sides usually breaks down faster than treating the sacrifice as a role someone can volunteer for within a system that guarantees renewal. In Cushing's telling, the Deer herd doesn't try to evade or resent being hunted -- they've built an entire framework around expecting it, because the hunters' own sacred treatment of the kill is what lets 'our lives in other form... be spared unceasingly.' When the moment for the hunt actually arrives, the herd doesn't select victims by force or lot; it asks for volunteers, and gets more than it needs: 'Who among ye are willing to die?... as if it were a festive occasion... many a fine Deer bounded forth, striving for the place of those who were to die.' The system only works because both halves hold up their end -- the hunters treat the kill as sacred rather than as pure extraction, and the Deer treat the sacrifice as a role worth competing for rather than a fate to escape, because the reciprocity, renewal in exchange for the sacred handling of death, is genuinely trusted to hold. Diagnostic move: when a group must repeatedly give something up to sustain a relationship with those who take it, look at whether the taking side visibly honors and reinvests in what it takes -- a sacrifice that's institutionalized, expected, and even competed for tends to signal that the exchange has held up its reciprocal half reliably enough that giving no longer needs to be coerced."
