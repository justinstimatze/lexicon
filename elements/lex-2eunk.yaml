id: lex-2eunk
name: flawless-daily-practice-can-run-with-no-theory-behind-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When several observers each correctly name the pattern governing a system, check whether a much larger group is enacting that same pattern with no explicit theory of it at all. The I Ching's Great Appendix names a three-way split rather than the usual two: 'The benevolent see it and call it benevolence. The wise see it and call it wisdom. The common people, acting daily according to it, yet have no knowledge of it.' The first two groups each project their own frame onto the same underlying course of things, correctly but partially. The third group's practice is flawless and constant, and runs with no articulated theory whatsoever — competent enactment doesn't require, or even correlate with, conscious knowledge of what's being enacted."
related: []
evokes: [i-ching, yi-jing, legge, ten-wings, xi-ci, great-appendix, tacit-competence]
lineage:
  - source: primary
    text: legge-1899-i-ching-appendix-iii-i-common-people
    citation: "James Legge, translator, The Yî King (I Ching), Sacred Books of the East vol. 16 (Oxford University Press, 1899), Appendix III ('The Great Appendix'), Section I, Chapter V, paragraph 26. Verified verbatim against a direct extraction of the text hosted at sacred-texts.com, clean digital text, no OCR."
    quote: "The benevolent see it and call it benevolence. The wise see it and call it wisdom. The common people, acting daily according to it, yet have no knowledge of it. Thus it is that the course (of things), as seen by the superior man, is seen by few."
canonical-instances:
  - "The text's own closing line draws the conclusion explicitly — 'the course (of things), as seen by the superior man, is seen by few' — treating articulate perception of the pattern as rare precisely because most people are already living it out fluently without ever needing to name it."
  - "A native speaker producing grammatically flawless sentences their whole life without ever being able to state the grammatical rule they're following is the same structure in a different domain: the competence and the theory of the competence are two separate achievements, and the first doesn't require the second."
critical-questions:
  - "Does the common people's version of the pattern actually match what the benevolent and wise separately name, or does the text assume a unity between theorized and untheorized enactment that might not hold in practice?"
  - "Is unarticulated daily competence actually more reliable than the theorized versions, given that it can't be examined or corrected the way an explicit account can — or does the text implicitly rank it as inferior precisely because it 'has no knowledge' of what it does?"
  - "Could the benevolent and the wise be wrong about what they're each naming, given that both frames are explicitly partial — does the passage offer any way to check either projection against the common people's untheorized practice?"
status: active
