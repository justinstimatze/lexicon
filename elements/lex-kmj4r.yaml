name: overriding-a-messengers-instructions-in-the-moment-defeats-their-purpose
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "An instruction given to a messenger in advance, to keep a distance, to avoid a conversation, to hand something off quickly, only works if the messenger actually follows it once they're face to face with the person the instruction was designed to guard against -- and a direct, polite-sounding request in that moment can override it completely. In Radin's Winnebago Trickster cycle, Trickster deliberately leaves a mitten behind after visiting woodpecker, purely to manufacture a reason to send a messenger. Woodpecker, anticipating exactly this kind of manipulation, briefs his child in advance: 'Take this mitten over to your uncle but stop some distance away and throw it at him. He talks a good deal.' The instruction is specific and defensive, designed to prevent exactly the kind of extended, purpose-driven exchange Trickster wants. But when the child actually arrives and prepares to throw it, Trickster simply asks for the opposite, framed as an innocuous personal preference: 'Here, here! Bring it over, my child, for I dread to turn back and that is why I asked you to bring it over to me.' The child complies immediately, and Trickster gets exactly the closer, longer exchange the father's instruction existed to prevent, ending with a message the father never approved: 'Now, that is exactly why I wanted you not to go too near him.' The countermanding instruction worked not because it was more persuasive than the original one, but because it arrived in person, in the moment, when the messenger had no way to check back with whoever briefed them. Diagnostic move: a defensive instruction given to a messenger in advance is only as strong as the messenger's willingness to hold it against a direct, reasonable-sounding counter-request delivered face to face -- brief the messenger on what to do if asked to deviate, not just on what to do by default."
