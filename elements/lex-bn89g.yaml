lineage:
  - source: primary
    text: kautilya-arthashastra-envoy-discredits-the-aggressors-advisors
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'The Weak King,' 'Averting an Attack,' {12.2.2-7}."
    quote: "'The arguments to be used are that the strong king (i) was being misled by friends in name but enemies in reality, (ii) frightening all his allies, (iii) promoting the interests of his enemies, and (iv) [because of all this] risking his wealth and his life... Those who advised him to behave rashly, in violation of the principles of dharma and artha, were friends only in name but were really his enemies.'"
canonical-instances:
  - "A board member trying to talk a CEO out of a reckless acquisition doesn't just list the deal's risks to the company -- they point out that the investment bankers pushing the deal collect their fee regardless of whether the acquisition succeeds, reframing the bankers' enthusiasm as self-interested rather than as objective counsel."
  - "A friend trying to talk someone out of a risky confrontation with their landlord points out that the person egging them on to 'stand their ground' has nothing at stake themselves and won't be the one facing eviction if it goes wrong, shifting the target's suspicion from the landlord to their own hype-man."
critical-questions:
  - "does this tactic actually work on someone determined to act, or does questioning their advisors' motives just read as an attempt to isolate and manipulate the decision-maker, backfiring by making them defensive of the very people being criticized?"
  - "is the claim that risk-bearing advisors are always self-interested actually reliable, or does this framework encourage a cynical, universal suspicion of anyone offering bold advice, even when the advice happens to be genuinely sound and the advisor genuinely aligned?"
  - "who is actually best positioned to make this argument credibly -- doesn't the weak king's own envoy have an equally obvious self-interest in discrediting the aggressor's advisors, making the accusation of 'friends in name, enemies in reality' cut just as sharply against the messenger delivering it?"
