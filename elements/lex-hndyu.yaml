id: lex-hndyu
name: sustained-peer-bonded-participation-crystallizes-into-doubling
type-in: claim
type-out: process
_tier: reaction
agent-instruction: "When ordinary people end up committing conduct their prior selves would have refused, don't stop at explaining why they FIRST went along — check whether sustained participation under that same peer-bonded pressure crystallized into an operational second self. lex-fbc4r is the reactant: the entry (opt-out framed as abandonment made the social cost of refusing exceed the moral cost of complying). lex-fjzum is the product: what happens if participation continues (the conduct gets routed through a self-organization that experiences it as appropriate, while the original self persists elsewhere). Diagnostic sequencing: at the entry point, intervene on the social framing of opt-out or break the small-unit structure — both are cheap. Once doubling has stabilized, neither works — the second self isn't waiting to be freed, it's genuinely running the conduct."
related: [lex-fbc4r, lex-fjzum, lex-46twa, lex-78gp5]
scaffolds-from: [lex-fbc4r, lex-78gp5, lex-46twa, lex-fjzum]
evokes: [browning-ordinary-men, lifton-doubling, jozefow-opt-out, entry-point-vs-stabilized-state, peer-bond-to-second-self, atrocity-enablement-architecture]
reactants:
  - lex-fbc4r
products:
  - lex-fjzum
mechanism: "an actor inside a peer-bonded small unit faces an opt-out explicitly available but socially framed as abandoning comrades or as cowardice (lex-fbc4r); the social cost of stepping out exceeds the moral cost of the first participation, so participation happens on the first occasion. If participation continues under the same institutional and peer-bonded conditions rather than stopping there, each repetition extracts a further compromise from the actor's integrated-self standards — the same logic lex-78gp5's admission-rites run on, repeated — and given enough repetition the conflicting conduct comes to be routed through a separate operational self that experiences it as appropriate, while the original self persists in non-institutional contexts (lex-fjzum). The transformation is gradual and repetition-dependent, not a single-occasion conversion."
catalysts:
  - lex-78gp5
conditions:
  - "the unit must be small enough for peer-bonds to be individually felt — a large anonymous crowd is a different regime (diffused-responsibility bystander dynamics, lex-u2kzt, not this reaction)"
  - "participation must be sustained and repeated, not a single occasion — a one-off act under lex-fbc4r's social-cost pressure does not by itself stabilize into lex-fjzum"
  - "the institutional demand must require conduct that actually conflicts with the actor's prior moral standards; cohesion alone, absent that conflict, just produces ordinary team loyalty and this reaction does not fire"
inhibitors:
  - lex-46twa
reversibility: "reversible early — at or shortly after lex-fbc4r's entry, before repetition compounds; the ~10-20% of Battalion 101 who sought quiet evasion after the first action never fully stabilized. Largely irreversible once lex-fjzum has stabilized, absent external institutional collapse or incarceration — per lex-fjzum's own critical-questions, recovery requires structural conditions that remove the person from the institutional-self's operating context, not individual resolve alone."
critical-questions:
  - "does the reaction actually run to completion, or does the actor exit after lex-fbc4r's entry but before lex-fjzum forms? Most historical cases show a real gap here — the ~10-20% of Battalion 101 who later sought quiet evasion went through 557's entry but did not fully stabilize into 465's doubling. Partial instances are real and worth distinguishing, because the available intervention differs — exit is still cheap for someone who hasn't doubled yet."
  - "is there a way to tell whether the reaction has actually completed rather than only its reactant (557) still being active? Lifton's own test is whether the original self remains accessible in non-institutional contexts. Applied here: check whether the person, on leave or under independent questioning outside the unit, still shows the pre-participation self's standards. If yes, the reaction hasn't completed and intervention is still cheap. If the original self no longer surfaces even outside the institutional context, the product has formed."
  - "lex-fbc4r names ordinary peer-cohesion — morally valence-neutral, the same mechanism produces effective military units and effective surgical teams — while lex-fjzum names a specifically atrocity-enabling product. What determines the reaction's direction rather than whether it fires at all? The mechanism points to the institutional DEMAND — what the unit's participation actually requires — as the deciding variable, not the cohesion mechanism itself. Cohesion is the vehicle, not the direction."
  - "who can intervene once the reaction has run? Hugh Thompson at My Lai is the structural answer at the product end: someone OUTSIDE the bonded unit, not subject to lex-fbc4r's social cost, can act where insiders cannot. This implies two different design responses at two different points: break the small-unit structure or reframe opt-out (effective against the reactant, before the reaction runs); place outside observers with intervention authority (effective against the product, after it forms, because insiders are compromised either way)."
lineage:
  - source: practitioner
    text: assembled-from-lex-fbc4r-lex-fjzum
    citation: "Reaction assembled from lex-fbc4r (peer-bonded-unit-cohesion-overrides-conscience-when-defection-frames-as-abandonment, Browning 1992) and lex-fjzum (doubling-as-morally-antithetical-self-formation-enables-atrocity-by-ordinary-people, Lifton 1999/1986). Both atoms already document the sequential relationship in their own canonical-instances (lex-fbc4r #30: 'lex-fbc4r produces the initial participation; sustained participation under lex-fbc4r can develop into lex-fjzum doubling'; lex-fjzum's lineage names Browning explicitly among its cross-domain attestation). First drafted as a molecule with `assembly: sequential(lex-fbc4r, lex-fjzum)`; `lexicon lint` correctly rejected it — the two atoms' types don't chain (lex-fbc4r type-out=posture, lex-fjzum type-in=state) and don't share type-in either, so neither `sequential` nor `parallel` type-checks. Per `docs/principles/reaction-tier-design.md`, that exact mismatch is the documented diagnostic for a reaction rather than a molecule: a transformation with catalysts/inhibitors modulating a state-change, not a type-clean bonded structure. Re-tiered accordingly, with catalyst (lex-78gp5, the admission-rite that extracts repeated compromise) and inhibitor (lex-46twa, the exit-mechanism lex-fjzum itself names as preventing stabilization) drawn from language already present in lex-fjzum's own canonical-instances rather than newly invented."
canonical-instances:
  - "Reserve Police Battalion 101, extended across its full 1942-1943 deployment: the Józefów opt-out (lex-fbc4r, the reactant) explains why ~80% shot on July 13, 1942 despite Trapp's explicit offer to step aside; Browning's later chapters and the postwar interrogations document that continued participation across subsequent actions produced, in a substantial share of the battalion, the operational second self that could shoot routinely without the daily 'physical revulsion' the first killings produced (lex-fjzum, the product). The ~10-20% who sought quiet evasion after the first action are the incomplete-reaction case: reactant present, product never formed."
  - "Aum Shinrikyō's Hayashi: recruitment into Aum's peer-bonded inner circle plus the social cost of being seen as insufficiently committed (lex-fbc4r, transposed from a military to a religious-cult institutional frame) preceded years of escalating participation — each admission a further compromise (lex-78gp5 acting as catalyst) — that stabilized into the 'Aum self' capable of administering a lethal overdose and manufacturing sarin, while Hayashi's pre-Aum medical self persisted well enough to resurface immediately post-arrest (lex-fjzum)."
  - "Contrast case showing the reaction does not fire: Hugh Thompson at My Lai was never inside Charlie Company's peer-bonded structure in the relevant sense — he was air-mobile, loyal to his own crew — so lex-fbc4r's social-cost-of-opt-out never applied to him with respect to the infantry unit, and there was no reactant for lex-fjzum to form from. The reaction explains why insiders participated and outsiders like Thompson could intervene; it doesn't claim everyone near an atrocity is subject to the same entry mechanism."
status: under-review
