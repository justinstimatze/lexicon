canonical-instances:
  - "A new engineer's first pull requests go against a codebase with a strict type system, a small well-factored core, and a thorough test suite. Their design choices are clumsy and their first attempts at the logic are wrong twice before they're right, but the type system and tests catch each wrong attempt before it reaches anyone else -- the floor was set in the tooling and architecture chosen long before this engineer's first commit, not in their as-yet-undeveloped judgment."
  - "A first-time public speaker is handed a talk built from material they already know cold and care about, rather than material they had to research and half-understand for the occasion. Their delivery is rough -- pacing, eye contact, filler words -- but the content underneath holds up regardless, because the floor was already set upstream, in the choice of what they were asked to speak about, well before any delivery skill entered the picture."
  - "A cooking class asks students to buy pre-diced, uniform-size vegetables for their first knife-skills lesson rather than whole ones, reasoning that inconsistent knife work is educational and low-stakes, while inconsistent ingredient quality just produces a bad dish no matter how the knife work goes -- so the class spends its one controllable upstream lever on the part a beginner can't yet fix downstream."
critical-questions:
  - "How much of the outcome does the input-quality lever actually control, versus execution? Bittman's claim holds for home cooking because a home cook's realistic mistakes (overcooking a vegetable by a few minutes, uneven dicing) are survivable; a domain where execution errors are catastrophic regardless of input quality (a surgical mistake, a structural miscalculation) doesn't get the same protection just because the starting materials were good."
  - "Does raising the input floor remove the motivation to develop execution skill at all, if the result is 'good enough' either way? Bittman frames the floor as room to practice without catastrophic failure while skill is still developing -- temporary scaffolding for a beginner, meant to come down as execution improves, rather than a permanent substitute for it."
  - "Is the upstream lever actually cheap, or does 'good inputs cost no more effort' quietly hide a cost somewhere else (money, access, time spent sourcing) that a genuine beginner may not have? The claim is strongest when the upstream investment really is low-cost relative to what execution-skill would otherwise have to supply."
