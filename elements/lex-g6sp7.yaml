id: lex-g6sp7
name: patterns-resolve-recurring-conflicts-and-compose-into-generative-design-language
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When designing within ANY field that has recurring design problems (architecture, software, organizations, education, gardens, conferences, writing), the transferable Alexander move is: (1) name the RECURRING SITUATION where the design problem arises; (2) name the CONFLICTING FORCES that the situation puts into tension; (3) name the SPATIAL OR STRUCTURAL CONFIGURATION that resolves those forces. The triple (context, forces, resolving-form) is a PATTERN. Patterns are not descriptions of finished artifacts; they are GENERATIVE — given the context, they generate the form. Multiple patterns compose into a PATTERN LANGUAGE: a vocabulary of design-moves where small patterns (window-place) nest inside larger ones (alcoves of light) which nest inside larger still (the building's overall organization). The transferable diagnostic: when a designed thing feels alive, named patterns are operating coherently and resolving forces; when it feels dead, either the patterns are wrong (resolving the wrong forces) or composing without coherence (each pattern locally good but the language fragmenting). Alexander's vocabulary of ALIVE vs DEAD patterns names this: alive patterns let inner forces loose and set us free; dead patterns lock us in inner conflict. Transferable: Gang of Four software design patterns, agile retrospective patterns, UX heuristics, organizational design patterns (Spotify squads, holacracy, etc.), curriculum-design patterns, conference-design patterns, writing patterns (the topic-sentence-and-evidence form is a writing-pattern resolving the force-conflict between claim-attention and evidence-support). When you face a recurring design problem, the productive move is not to invent from first principles each time but to name the pattern (its context, forces, resolving form) so it can be RE-INVOKED and COMPOSED with other patterns; this is what makes design knowledge accumulate. The lexicon project itself is an Alexander-style pattern language — for cognitive and social primitives rather than architectural ones."
related: [lex-wtkuz, lex-g9zrz, lex-ccbdh, lex-hfqw7, lex-4snxu, lex-b2c6b, lex-n42kg, lex-h7z9x, lex-a55ep, lex-g6qbp]
