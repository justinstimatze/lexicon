critical-questions:
  - "are the evidence-streams TRULY independent, or correlated under a confounder? The atom's predictive power depends on independence. Correlated streams provide much weaker convergence than independent ones. Diagnostic: identify potential common-causes that could produce all streams simultaneously. Wegener's evidence-streams ARE independent (geometric coastline-matching is independent of fossil-distribution which is independent of paleoclimate-evidence). When streams correlate (e.g., multiple-eyewitnesses-to-a-rumor), convergence is weaker than it appears."
  - "how many converging streams are needed? Context-dependent. Bayesian update: each independent stream multiplies the likelihood-ratio. N=3-4 streams of moderate evidential strength can warrant strong acceptance; single-stream-of-extreme-strength may also warrant. The atom is not a fixed-N rule; it's a methodological orientation. Diagnostic: what would each-stream's likelihood-ratio be in isolation? Multiply them; if combined LR is large, convergent warrant is strong."
  - "what if the streams converge on a FALSE claim? Possible (rare but real). Historical example: phlogiston theory had convergent evidence (combustion + calcination + respiration all involve transfer of something) but the postulated something (phlogiston) was wrong — Lavoisier's oxygen theory provided a better account of the same convergent phenomena. The atom does NOT guarantee truth; it warrants STRONG WORKING ACCEPTANCE pending better theory. Critical-question: are there alternative-explanations that account for the convergence equally well? If yes, the warrant is weaker than apparent."
  - "is the atom predictive about when mechanisms eventually arrive? Weakly. Mechanism-discovery typically comes from independent technological / methodological advances that weren't available when the convergent-evidence accumulated. Wegener needed seafloor-mapping + paleomagnetism + radiometric dating; Mendel needed cytology + biochemistry. The atom predicts: when convergent-evidence is strong but mechanism is unavailable, mechanism-discovery is the future research-program. Empirically supported across many cases."
  - "what about cases where mechanism-demand is RIGHT to delay acceptance? Some convergent-evidence patterns turn out wrong (UFO sightings, conspiracy theories, parapsychology). The atom should NOT be used to defend everything-with-convergent-claims-must-be-accepted. Discriminator: (a) are the streams truly independent? (b) are alternative explanations comparably good? (c) is the underlying physics/biology/etc. compatible? Where independence fails, alternatives are strong, or basic-science is incompatible, mechanism-demand IS appropriate as a discipline against premature acceptance."
