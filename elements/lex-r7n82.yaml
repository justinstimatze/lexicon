id: lex-r7n82
name: internal-heterogeneity-cross-cuts-and-blunts-inter-group-hostility
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two groups locked in ongoing competition — political parties, rival departments, opposing factions — show real cooperation despite disagreement, check whether either group is internally diverse enough that some of its members actually have more in common with people on the other side than with their own. Levitsky and Ziblatt: 'For most of the twentieth century, American parties were ideological 'big tents,' each encompassing diverse constituencies and a wide range of political views. The Democrats represented the New Deal coalition of liberals, organized labor, second- and third-generation Catholic immigrants, and African Americans, but they also represented conservative whites in the South. For its part, the GOP ranged from liberals in the Northeast to conservatives in the Midwest and West. [...] Because the two parties were so internally heterogeneous, polarization between them was far lower than it is today. [...] This internal heterogeneity defused conflict. Rather than viewing one another as enemies, Republicans and Democrats frequently found common ground. [...] Now that most senators and representatives had more in common with their partisan allies than with members of the opposing party, they cooperated less frequently and voted consistently with their own party. As both voters and their elected representatives clustered into increasingly homogeneous 'camps,' the ideological differences between the parties grew more marked.' The overlap does the moderating work automatically — a party containing both civil-rights liberals and segregationist conservatives cannot present a unified face against a rival that also contains both, so cross-cutting alliances form issue by issue instead of two clean opposing blocs. Homogenize either group internally, and the natural cross-boundary allies that used to blunt every fight disappear as a direct consequence of the sorting itself, not gradually."
related: [lex-cahck, lex-ygwne]
evokes: [levitsky-ziblatt-2018-how-democracies-die, big-tent-parties, conservative-coalition, cross-cutting-cleavages, partisan-sorting]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch7-big-tents-and-the-conservative-coalition
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 7 'The Unraveling,' on mid-20th-century party heterogeneity versus post-1965 ideological sorting."
    quote: "'For most of the twentieth century, American parties were ideological 'big tents,' each encompassing diverse constituencies and a wide range of political views. The Democrats represented the New Deal coalition of liberals, organized labor, second- and third-generation Catholic immigrants, and African Americans, but they also represented conservative whites in the South. For its part, the GOP ranged from liberals in the Northeast to conservatives in the Midwest and West. [...] Because the two parties were so internally heterogeneous, polarization between them was far lower than it is today. [...] This internal heterogeneity defused conflict. Rather than viewing one another as enemies, Republicans and Democrats frequently found common ground. [...] Now that most senators and representatives had more in common with their partisan allies than with members of the opposing party, they cooperated less frequently and voted consistently with their own party. As both voters and their elected representatives clustered into increasingly homogeneous 'camps,' the ideological differences between the parties grew more marked.'"
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch9-deliberately-built-crosscutting-coalition
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 9 'Saving Democracy,' on building an opposition coalition deliberately across adversarial lines rather than among natural allies."
    quote: "'The most effective coalitions are those that bring together groups with dissimilar—even opposing—views on many issues. They are built not among friends but among adversaries. An effective coalition in defense of American democracy, then, would likely require that progressives forge alliances with business executives, religious (and particularly white evangelical) leaders, and red-state Republicans.' ... 'a broader coalition would crosscut these axes and maybe even help dampen them. [...] Where a society's political divisions are crosscutting, we line up on different sides of issues with different people at different times. [...] Such alliances help us build and sustain norms of mutual toleration. When we agree with our political rivals at least some of the time, we are less likely to view them as mortal enemies.'"
canonical-instances:
  - "Mid-20th-century Democrats spanned the New Deal coalition (liberals, labor, Catholic immigrants, African Americans) and conservative Southern whites; the GOP spanned Northeastern liberals and Midwestern/Western conservatives. On civil rights specifically, liberal Democrats and liberal Republicans voted together in Congress, while southern Democrats and conservative Republicans formed their own cross-party 'conservative coalition' to block it — cooperation ran across party lines precisely because both parties held members on both sides of the actual fault line."
  - "The post-1965 realignment sorted race, then religion, cleanly along party lines. The overlap vanished, and by the 2000s 'most senators and representatives had more in common with their partisan allies than with members of the opposing party' — a shift the book credits directly with the collapse in routine cross-party cooperation, independent of any change in the parties' formal rules or institutions."
  - "As opposition strategy rather than an inherited condition: the book proposes that an anti-Trump coalition deliberately recruit business executives, white evangelical leaders, and red-state Republicans alongside progressives — groups with little natural overlap — specifically because a narrow, ideologically uniform coalition would reinforce existing partisan lines while a deliberately adversarial-spanning one crosscuts them. This answers one of this atom's own open questions above: heterogeneity doesn't have to be an inherited big-tent condition that later erodes — it can be assembled on purpose, mid-conflict, for the crosscutting effect itself."
critical-questions:
  - "Would deliberately preserving or engineering internal heterogeneity (recruiting ideologically atypical members into a coalition) actually reduce hostility toward a rival group, or would it just delay the same sorting the book describes, since members with more in common across the boundary may eventually migrate toward whichever side actually matches them, as southern conservative Democrats did?"
  - "Does the mechanism need each coalition's internal split to line up on the SAME issue as the rival's internal split to produce real cross-party allies, or would two coalitions that are each diverse along unrelated, non-overlapping axes fail to generate any cross-cutting alliance at all?"
  - "The book names specific sorting axes — race, then religion — as what killed the overlap. Does homogenization along any single salient axis produce the same collapse, or does it take several reinforcing axes sorting the same way before cross-cutting alliances actually disappear?"
