id: lex-tj7ma
name: name-a-comparisons-goal-and-procedure-before-running-it
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Apply before conducting, presenting, or evaluating ANY comparison — of religious traditions, historical cases, product designs, organizations, texts, legal systems, or scientific theories — where the comparison's own structure hasn't been made explicit. Freiberger's method for religious studies generalizes past its home discipline: most comparisons are conducted without the comparer naming what kind of comparison it is, which leaves the comparison's actual logic implicit and therefore both harder to defend and harder to critique. His framework has two layers. First, GENERAL CONFIGURATION: before comparing, specify the comparison's GOAL (are you classifying, explaining, or simply describing similarities/differences — 'one study can well pursue both descriptive and classificatory goals,' but which is primary matters), its MODE, its SCALE, and its SCOPE — and specify the tertium comparationis, 'the aspect with regard to which they are compared,' since two things can be compared on infinitely many possible dimensions and an unstated tertium comparationis lets the comparer silently choose whichever dimension makes their point. Second, the COMPARATIVE PROCESS itself breaks into five operations: SELECTION (choosing the comparands — the items being compared — and justifying why these and not others), DESCRIPTION AND ANALYSIS (characterizing each comparand on its own terms before setting them side by side), JUXTAPOSITION (setting the descriptions next to each other along the chosen tertium comparationis), REDESCRIPTION (revising the initial descriptions in light of what the juxtaposition reveals — comparison should change how you see EACH case, not just produce a verdict about their relationship), and RECTIFICATION/THEORY-FORMATION (using the comparison to correct or build a more general claim). The framework 'provides the researcher with tools for questioning, reconsidering, and defending the decisions made in the course of the study' and doubles as a critical vocabulary for evaluating someone else's comparison — 'being able to pinpoint, with this terminology, specific strengths or weaknesses enables us to provide more precise and constructive criticism.' Practitioner discipline: before making or accepting a comparative claim ('X is like Y,' 'X and Y both show Z'), ask what the tertium comparationis actually is, whether the comparands were selected to make the point or independently justified, and whether the comparison changed the understanding of either individual case (redescription) or just produced a scorecard. A comparison that skips redescription — that only counts up similarities and differences without letting either case look different afterward — has usually smuggled in its conclusion at the selection stage."
related: [lex-6wsw2]
evokes: [tertium-comparationis, comparands, general-configuration, comparative-process, redescription, scholar-situatedness, name-the-procedure-before-doing-it]
lineage:
  - source: primary
    text: freiberger-2019-considering-comparison
    citation: "Oliver Freiberger, Considering Comparison: A Method for Religious Studies (Oxford University Press, 2019), Introduction and Ch.4."
    quote: "'Chapter 3 explores the epistemology of comparison by taking a close look at the origin and genesis of the comparands (the items that are to be compared) and the tertium comparationis (the aspect with regard to which they are compared) as well as their mutual relationship. It proposes a scholar-centered approach to comparative methodology that takes the situatedness of the scholar seriously but also acknowledges her or his agency in conducting a comparative study.' [...] '[Chapter 4] describes the general configuration of a comparative study by distinguishing modes, scales, and scopes of comparison. Each of these categories comprises several options, out of which the researcher selects those that are most appropriate for the study... it is also important to note that for an individual study these broad categories are by no means mutually exclusive. In other words, one study can well pursue both descriptive and classificatory goals.' [...] 'Second, the chapter breaks the comparative process down into the five operations of selection, description and analysis, juxtaposition, redescription, and rectification/theory formation. This methodological framework provides a vocabulary that enables us to talk about the elements of the comparative method... A comparativist may use it as a template or foil against which to devise a comparative study. It provides the researcher with tools for questioning, reconsidering, and defending the decisions made in the course of the study.' [...] 'Being able to pinpoint, with this terminology, specific strengths or weaknesses enables us to provide more precise and constructive criticism (or praise).'"
canonical-instances:
  - "A comparative-religion claim like 'Buddhism and Stoicism both teach detachment from desire' left unexamined: naming the tertium comparationis (attitude toward desire, specifically) exposes that the comparands were selected FOR that similarity — a different tertium comparationis (metaphysical commitments, institutional structure, theory of the self) would yield a very different comparison between the same two traditions."
  - "A product team comparing their app to a competitor's, listing feature parity and gaps — read through the redescription operation, a comparison that only produces a checklist (X has feature A, we don't) hasn't done the work; a comparison that changes how the team understands their OWN product's actual design philosophy (by contrast with the competitor's) has completed the cycle Freiberger's framework requires."
  - "operationally distinct from lex-6wsw2 compare-naturally-similar-systems-that-differ-on-the-factor-of-interest: lex-6wsw2 (Diamond-Robinson) is a specific comparative-DESIGN technique for causal inference — finding naturally-occurring paired cases that vary on one factor to substitute for an impossible experiment. This atom is a general meta-level vocabulary for structuring ANY comparison, interpretive or causal, humanities or science — it doesn't presuppose a causal-inference goal, and it names the SELECTION and TERTIUM COMPARATIONIS choices lex-6wsw2's natural-experiment method treats as already settled (find similar cases differing on the factor of interest) rather than as choices requiring their own justification."
critical-questions:
  - "Does naming the general configuration and five operations actually change the resulting comparison's quality, or does it just make an already-good comparison's implicit structure explicit after the fact — i.e., is this a design tool or a post-hoc description tool?"
  - "The framework's own account of REDESCRIPTION assumes a comparison SHOULD change how each case is understood — but is that always true, or are some comparisons legitimately just verdict-producing (X performs better than Y on metric Z) without any redescription obligation?"
  - "Freiberger frames this as a 'scholar-centered' method acknowledging the comparer's own situatedness and agency — does naming the tertium comparationis actually neutralize the risk that comparands were selected to fit a predetermined conclusion, or does it just relocate the same selection bias one level up, into which tertium comparationis gets chosen?"
