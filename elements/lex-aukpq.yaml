id: lex-aukpq
name: rights-can-stay-intact-while-people-starve
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "'No one's rights were violated' only counts as a defense of an outcome if those rights were ever meant to guarantee it -- check what they were actually built to cover before accepting the defense. Sen: “People's entitlements related to their libertarian rights cannot be outweighed by the nature of their results -- even when those results are clearly rather nasty. This version of libertarianism is thus quite insensitive to the actual social consequences of these constraints and requirements. ... even large famines can occur without anyone's libertarian rights being violated: those who are destitute and unemployed may starve precisely because their entitlements do not give them enough food to eat.” A libertarian rights framework protects a process -- property honored, contracts enforced, no one's holdings seized -- and says nothing about whether that process leaves everyone with enough to survive on. Someone can lose their job, exhaust their savings, and starve to death without a single transaction along the way being coercive or fraudulent -- the rights framework has no complaint to register, because it was never built to have one about outcomes. Diagnostic move: when a system is defended as just because it respects everyone's rights, ask what those specific rights actually guarantee. Rights protecting how resources move (free exchange, no seizure) are silent on whether people end up with enough -- and a catastrophic result can clear every procedural bar a rights framework sets, precisely because outcomes were never what it was checking."
related: []
evokes: [sen-collective-choice-and-social-welfare-new-introduction-a3, libertarian-entitlements, sen-1981-poverty-and-famines, procedural-justice-blind-to-outcomes, nozick-libertarianism]
lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), New Introduction, Chapter A3 'Justice and Equity,' p.xcvii. Sen cites his own Poverty and Famines (1981) and Drèze and Sen (1989) for the underlying entitlement analysis of famine."
    quote: "“People's entitlements related to their libertarian rights cannot be outweighed by the nature of their results -- even when those results are clearly rather nasty. This version of libertarianism is thus quite insensitive to the actual social consequences of these constraints and requirements. ... even large famines can occur without anyone's libertarian rights being violated: those who are destitute and unemployed may starve precisely because their entitlements do not give them enough food to eat.”"
canonical-instances:
  - "Hypothetical: A gig-economy platform's terms of service are scrupulously honored on every side -- workers agree to the pay rate, the platform pays exactly what it promised, no contract is broken anywhere in the chain. A worker who can't cover rent on that pay has no rights violation to point to; the system was never designed to check whether the agreed rate was enough to live on, only whether the agreement itself was honored."
  - "Hypothetical: A defunct company's severance policy is followed to the letter -- every departing employee gets precisely the payout their contract specifies, no shortfalls, no broken promises. Several of those employees, with no savings and no other income lined up, fall behind on medical bills within months. The policy's perfect compliance record has nothing to say about that outcome, because compliance was never a claim about sufficiency."
critical-questions:
  - "Isn't this an argument against rights-based frameworks altogether, in favor of outcome-focused ones? Sen doesn't argue for abandoning rights -- he argues against treating rights-compliance as if it settled the outcome question. A framework can value both: honoring entitlements as one commitment, and tracking whether those entitlements leave people with enough to live on as a separate, additional commitment that rights alone don't provide."
  - "Doesn't every framework have some blind spot -- why single out libertarian rights specifically? The point isn't that libertarian rights are uniquely flawed; it's that this framework's blind spot is easy to miss precisely because 'no rights were violated' sounds like a complete defense. Naming the specific gap -- entitlements protect how resources move, not whether anyone ends up with enough -- makes the blind spot checkable rather than something the framework's own vocabulary quietly hides."
