name: manufactured-scarcity-around-a-windfall-erases-a-competitors-caution
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Once you're trapped and want company, don't invite others in -- pretend you'd rather keep the spoils to yourself, and their own competitive instinct will do the recruiting you can't risk doing directly. In Cushing's telling, a Coyote falls into a hidden pit-trap and lures a passing Bear in by claiming it's a feast, but once several animals are already inside, the tactic flips: 'Keep away, my friends,' cried out the Coyote. 'No such luck for you. We got here first. Our spoils!' The other pests, hearing this, don't get suspicious -- they get desperate: '\"Can't I come?\" \"Can't I come?\" cried out one after another.' The Coyote's grudging, rationed reply is what finishes the job: 'Well, yes,--no,--there may not be enough for you all.' 'Come on, though; come on! who cares?' cried the Bear, and the whole crowd 'rushed in so fast that very soon the pit-hole was almost full of them,' none of them stopping to ask why two creatures were so oddly gleeful about having fallen into a hole. Manufactured stinginess about a suspicious windfall converts wariness into urgency, because the story it tells isn't 'something is wrong here' but 'I might be left out.' Diagnostic move: when access to an unexplained windfall is being rationed or grudgingly restricted right in front of you, notice that the restriction itself is what's driving your hurry -- ask why the ones already inside are so pleased before assuming the only risk is missing out."
