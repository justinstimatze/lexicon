canonical-instances:
  - "A startup founder negotiating a partnership with a much larger company treats the specific terms of that partnership as entirely disposable and renegotiable the moment they stop serving the founder's actual fixed aim (building a sustainable independent business), rather than treating the partnership's continuation as itself a success to be protected even after it has stopped helping."
  - "A political coalition builder forms a temporary alliance with a faction whose values they don't share, purely to block a specific piece of legislation, and is willing to publicly oppose that same faction on the very next vote without contradiction, because the fixed aim was never 'maintain this alliance' -- it was the underlying policy outcome the alliance was a disposable tool for."
critical-questions:
  - "how does an observer, or even the actor themselves, distinguish principled willingness to abandon a stratagem from simple untrustworthiness or bad faith -- does treating every commitment as disposable in service of a hidden fixed aim erode the trust needed to form alliances and stratagems in the first place?"
  - "does keeping only the top-level aim fixed create a moral hazard, where genuinely harmful or exploitative tactics get justified as 'merely a disposable stratagem' rather than being evaluated on their own terms as actions with real consequences for the people involved in them?"
  - "how does a party avoid the failure mode of accumulating so many discarded, contradictory stratagems that the fixed aim itself becomes obscured or forgotten amid the tactical churn, especially over a long campaign where the original goal might quietly drift?"
