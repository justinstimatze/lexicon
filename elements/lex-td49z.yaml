id: lex-td49z
name: naming-an-exhaustive-category-closes-a-sophistic-definition-trap
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A sophistic trap can demand ever more precise definition of a term, hoping to find some gap between the offered categories that forces an admission of confusion. One move closes it: point out that the offered categories already exhaust every possibility, so no further distinction is left for the trap to demand. In the Jataka's tale of the disputing pilgrim, he tries to catch an ascetic by demanding an impossibly precise definition of 'the Ganges': 'What is Ganges? Ganges may be sand, Ganges may be water...Ganges may be the far bank!' The ascetic doesn't attempt a finer definition. He points out that the gambit has already listed everything there is: 'Besides the sand, the water, the hither and the further bank, what other Ganges can you have?' The trap depended on there being some remaining category to demand next; naming that none exists ends the game in one move."
