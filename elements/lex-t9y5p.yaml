    text: radin-trickster-lures-the-mothers-away-with-a-false-promise-of-plums
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 27. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'We would like very much to have some, brother,' they said. 'However, we cannot leave our children alone for they are very disobedient.''Sisters, if you wish to go, I will take care of the children for you,' he said. ... 'You cannot really pick them all for they are too plentiful. If, toward evening, as the sun sets, you see the sky red, you will know that the plums are causing it. ... Do not turn back for you will surely find it.' They started out and as soon as they were out of sight, he killed the children, singed them, and then boiled them. They were racoons."
canonical-instances:
  - "A babysitting scammer offers to watch a family's children for free so the parents can attend a limited-time sale event across town, framing it as a favor, and uses the parents' absence to search the house for valuables while the children are left unsupervised."
  - "A fraudster convinces a small business owner to leave their storefront unattended during business hours by offering to 'mind the register' while directing the owner toward an unusually generous supplier deal that turns out to require an in-person visit, then empties the till during the owner's absence."
critical-questions:
  - "Would the mothers have refused the offer if Trickster had not also solved their explicit stated obstacle, the disobedient children needing supervision, or was the guardianship offer the specific thing that converted a tempting opportunity into an actionable one?"
  - "Is the instruction not to turn back, 'do not turn back for you will surely find it,' functioning mainly to keep the mothers moving forward physically, or is it also designed to preempt the moment of doubt that might otherwise make them check on their children partway through the journey?"
  - "Does this pattern require the guardian's own generosity or trust to be exploited specifically, or would it work identically against a purely self-interested guardian who simply calculated that the trade, absence for opportunity, was worth the risk?"
