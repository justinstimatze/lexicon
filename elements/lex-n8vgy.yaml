id: lex-n8vgy
name: a-fabricated-crisis-fails-once-the-target-has-already-renounced-the-stake-it-threatens
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A manufactured emergency only moves someone through the stake they still hold in the thing being threatened — once that stake has been genuinely given up, the same fabricated crisis has nothing left to pull on and the manipulation simply fails to register as urgent. In the Jataka''s tale of Mahajanaka, his queen orders fires set and smoke raised along his path and tells him falsely that Mithila is burning, but because he has already renounced ownership of everything in it, the lever finds no purchase: "The Bodhisatta replied, ''What sayest thou, O queen? the possessions of those who have can be burned, but I have nothing;'' ''We who have nothing of our own may live without a care or sigh; Mithila''s palaces may burn, but naught of mine is burned thereby.''"'
related: []
evokes: [jataka, mahanipata, mahajanaka-jataka, staged-crisis, divestment-removes-leverage]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-mahajanaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 539, Mahajanaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The Bodhisatta replied, \"What sayest thou, O queen? the possessions of those who have can be burned, but I have nothing;\" \"We who have nothing of our own may live without a care or sigh; Mithila's palaces may burn, but naught of mine is burned thereby.\""
canonical-instances:
  - "A vendor tells a procurement officer that a discount 'expires tonight' to force a rushed decision, but the officer has already decided to walk away from the deal entirely on unrelated grounds, so the manufactured deadline produces no urgency at all — there's nothing left in that account for the threat to spend."
  - "A former partner threatens to badmouth someone's reputation at their old firm to pressure a settlement, not realizing the person has already resigned and moved industries — the threatened harm targets a stake that no longer exists for them."
critical-questions:
  - "Mahajanaka's immunity to the fabricated fire only holds because his renunciation was already genuine and total — how does this move fail against a target who claims to have no stake but is bluffing, or whose divestment is only partial?"
  - "Does recognizing that a crisis is fabricated depend on already knowing you hold no stake, or could someone with a real, unrenounced stake use the same reasoning to talk themselves out of a genuine emergency?"
status: active
