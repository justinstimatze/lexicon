  - source: primary
    text: snyder-2017-on-tyranny-lesson-1-do-not-obey-in-advance
    citation: "Timothy Snyder, On Tyranny: Twenty Lessons from the Twentieth Century (New York: Tim Duggan Books; London: The Bodley Head, 2017), Lesson 1, 'Do not obey in advance.' Snyder, a historian of twentieth-century Europe at Yale, opens the book's first and organizing lesson with the claim that authoritarian power is overwhelmingly volunteered rather than extracted: citizens, professionals, and institutions who guess what a newly empowered or emerging authority will want, and pre-emptively adjust their own conduct to match that guess before any actual order or legal compulsion exists, are not merely complying but actively teaching the power what it is able to demand. Snyder's illustrative case is Germany, Czechoslovakia, and Austria between 1932 and 1938: the 'next crucial step' after the Nazis' and (in his parallel case) the Czechoslovak communists' electoral victories was not legal compulsion but anticipatory obedience by ordinary citizens and professionals, which taught the new leadership that it 'could move quickly toward a full regime change.' His sharpest single case is Austria in March 1938, where non-Nazi Austrians' spontaneous anticipatory participation in humiliating and dispossessing Jewish neighbors — ahead of any German directive — directly instructed the Nazi leadership on what was newly possible, a lesson institutionalized months later in Eichmann's Vienna emigration office and the national Kristallnacht pogrom. Snyder extends the mechanism past bystanders to institutional actors already inside a hierarchy (the SS in 1941 devising mass-killing methods without being ordered to), which is the point at which his own text gestures toward Milgram's experimental paradigm as a further illustration — but the central Lesson-1 claim is prior to and distinct from Milgram's: it concerns conduct volunteered before any order exists, not obedience to an order already given."
    quote: "[The headline claim, opening epigraph of Lesson 1:] 'Most of the power of authoritarianism is freely given. In times like these, individuals think ahead about what a more repressive government will want, and then offer themselves without being asked. A citizen who adapts in this way is teaching power what it can do.' [The core definitional passage and the 1932/1946 elections case:] 'ANTICIPATORY OBEDIENCE IS a political tragedy. Perhaps rulers did not initially know that citizens were willing to compromise this value or that principle. Perhaps a new regime did not at first have the direct means of influencing citizens one way or another. After the German elections of 1932, which permitted Adolf Hitler to form a government, or the Czechoslovak elections of 1946, where communists were victorious, the next crucial step was anticipatory obedience. Because enough people in both cases voluntarily extended their services to the new leaders, Nazis and communists alike realized that they could move quickly toward a full regime change. The first heedless acts of conformity could not then be reversed.' [The Austria 1938 case — anticipatory obedience deciding an outcome ahead of any formal order:] 'In early 1938, Adolf Hitler, by then securely in power in Germany, was threatening to annex neighboring Austria. After the Austrian chancellor conceded, it was the Austrians' anticipatory obedience that decided the fate of Austrian Jews. Local Austrian Nazis captured Jews and forced them to scrub the streets to remove symbols of independent Austria. Crucially, people who were not Nazis looked on with interest and amusement. Nazis who had kept lists of Jewish property stole what they could. Crucially, others who were not Nazis joined in the theft.' [The teaching-effect — anticipatory obedience instructing power on what it can subsequently formalize:] 'The anticipatory obedience of Austrians in March 1938 taught the high Nazi leadership what was possible. It was in Vienna that August that Adolf Eichmann established the Central Office for Jewish Emigration. In November 1938, following the Austrian example of March, German Nazis organized the national pogrom known as Kristallnacht.' [The 1941 SS case — anticipatory obedience by actors already inside an institutional hierarchy, guessing upward rather than receiving orders downward:] 'In 1941, when Germany invaded the Soviet Union, the SS took the initiative to devise the methods of mass killing without orders to do so. They guessed what their superiors wanted and demonstrated what was possible. It was far more than Hitler had thought.' [The closing definitional line, immediately before Snyder pivots to Milgram's experiment as a further illustration:] 'At the very beginning, anticipatory obedience means adapting instinctively, without reflecting, to a new situation.'"
