id: lex-442fr
name: unratified-provisional-tag-becomes-binding-through-downstream-deference
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A hedged, provisional classification made by someone with no formal authority to make it can become operationally decisive if the people downstream who DO have the authority to overturn it instead defer to it as though it were already settled — not because they formally ratify it, but because acting with the urgency that would be needed to actually reverse it costs more effort than accepting it. The hedge word survives; the hedge itself quietly disappears. Sudnow's Passing On documents the exact mechanism at County Hospital's Emergency Ward: an ambulance driver signals 'possible DOA' on arrival — 'the use of the term possible is required by law which insists, primarily for insurance purposes, that any diagnosis unless made by a certified physician be so qualified' — a purely provisional, legally non-binding tag from someone with zero authority to pronounce death. Yet: 'Some ER staff came to regard the fact of a DOA as decided in advance; they exhibited a degree of nonchalance in answering the siren or page, taking it that the \"possible DOA\" most likely is \"D.\" In so doing they in effect gave authorization to the ambulance driver to make such assessments.' The physicians hold the sole legal authority to pronounce death, and never formally cede it — but their response speed, urgency, and demeanor come to track the driver's provisional call rather than an independent assessment, and Sudnow notes the mechanism has real stakes: 'it is not inconceivable that in several instances patients who might have been revived died during this interim.' Generalize beyond medicine: an intern's rough, hedged first-pass classification of a bug as 'probably not urgent' gets treated by the on-call engineer as decided, so the ticket sits; a junior analyst's tentative 'looks like noise' flag on an anomaly gets waved through by the senior reviewer without independent examination, because re-checking every hedge would defeat the purpose of having a junior filter at all. The diagnostic move: find where a formally non-binding, explicitly hedged call is nonetheless shaping downstream urgency and effort as if it had already been authoritatively decided — the authority never moved on paper, but it moved in practice, and the hedge is the tell that it was never supposed to."
related: [lex-gthkp, lex-kwswc]
evokes: [possible-doa-most-likely-is-d, gave-authorization-to-the-ambulance-driver, nonchalance-in-answering-the-siren, patients-who-might-have-been-revived-died-during-this-interim]
lineage:
  - source: primary
    text: sudnow-1967-passing-on-doa-authorization-cascade
    citation: "David Sudnow, Passing On: The Social Organization of Dying (Prentice-Hall, 1967), Chapter 4 'Death and Dying as Social States of Affairs,' section 'Death, Uses of a Corpse, and Social Worth,' on the ambulance driver's 'possible DOA' designation and its downstream operational effect on ER staff response urgency."
    quote: "It is interesting to note that while the special siren alarm is intended to mobilize quick response on the part of the ER staff, it occasionally operates in the opposite fashion. Some ER staff came to regard the fact of a DOA as decided in advance; they exhibited a degree of nonchalance in answering the siren or page, taking it that the \"possible DOA\" most likely is \"D.\" In so doing they in effect gave authorization to the ambulance driver to make such assessments. Given that time lapse which sometimes occurs between that point at which the doctor knows of the arrival and the time he gets to the patient's side, it is not inconceivable that in several instances patients who might have been revived died during this interim."
canonical-instances:
  - "the ambulance driver's legally-required-to-be-hedged 'possible DOA' page treated by on-duty physicians as decided in advance, producing exactly the nonchalant response-lag that could turn a marginal case irreversible."
  - "a junior support agent's tentative 'seems like a duplicate ticket' tag gets accepted by the triage lead without re-examination, because re-verifying every junior call would defeat the purpose of having a first-pass filter."
  - "an intelligence analyst's caveated low-confidence assessment gets treated by policymakers as the settled read once it has circulated for a few briefings, the original hedge having quietly dropped out of how the call gets used."
critical-questions:
  - "isn't some deference to a first responder's field judgment simply efficient triage, not a distinct failure pattern? Some deference is efficient — the pattern is specifically about the hedge word ('possible') surviving in the language while its epistemic function (marking the call as unverified) disappears from the actual response. The diagnostic is whether urgency/effort tracks the hedged call AS IF it had already been verified, not whether any deference occurs at all."
  - "who is actually 'authorized' here, and does the pattern require that the deferring party knows they're overriding the formal authority structure? No — Sudnow's ER staff are not portrayed as knowingly usurping the physician's sole legal pronouncement authority; the nonchalance is described as a demeanor, not a deliberate delegation. The pattern names an effect (informal authority migrating downstream through response-urgency) that can occur without any party consciously intending or acknowledging the shift."
  - "how does this differ from lex-xrg6e plausible-deniability? Plausible-deniability is about an actor deliberately structuring an action so THEY can later deny intent. This atom is about a party with NO decision authority producing a hedged classification that OTHER parties, who do hold the authority, come to treat as settled — the mechanism is downstream deference eroding a hedge, not upstream structuring for deniability. They can co-occur (a hedge can be exploited deliberately) but the core mechanisms are distinct."
severity-tier: info
status: active
