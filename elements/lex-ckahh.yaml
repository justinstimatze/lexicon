id: lex-ckahh
name: projecting-self-as-prediction-when-other-cant-be-modeled
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When you can't actually model what someone else wants, you'll default to projecting your own goals and call it a prediction. Catch yourself: if your 'prediction' is what YOU would do in their place, you're projecting, not modeling."
related: [lex-jv983, lex-t9fs7, lex-r3w25, lex-exczm, lex-eb3wf, lex-zag9z, lex-zfbef, lex-2czcp, lex-dgwbn, lex-rsnn7, lex-8y3ch, lex-7qp5w, lex-36cbh, lex-yzuec, lex-hta65, lex-4ydm6, lex-fdvmu, lex-7ra5h]
scaffolds-from: [lex-yzuec, lex-hta65]
evokes: [mirror-imaging, everybody-thinks-like-us, theory-of-mind-failure, false-consensus-effect, naive-realism, projection-as-pseudo-empathy, the-if-I-were-them-trap, heuer-ch6]
lineage:
  - source: primary
    text: heuer-1999-psychology-of-intelligence-analysis-ch6-mirror-imaging
    citation: "Richards J. Heuer Jr., *Psychology of Intelligence Analysis*, CIA Center for the Study of Intelligence 1999, Ch. 6 'Keeping an Open Mind', section 'Be Wary of Mirror Images' (pp. 70-71). The substrate-claim: when an analyst lacks direct knowledge of how the OTHER party reasons (a foreign leader, a competitor, a customer, a child), the gap is filled by PROJECTION — assuming the other reasons the way the analyst (or the analyst's reference group) would. This is mirror-imaging. The failure mode: the substituted-pseudo-knowledge then gets treated as a model of the other, generating predictions about their behavior. The predictions are systematically wrong when the other party's actual priors, constraints, or value-system differ from the analyst's. Heuer cites Adm. David Jeremiah's post-mortem on the Intelligence Community's failure to predict India's 1998 nuclear weapons testing, which Jeremiah termed the 'everybody-thinks-like-us mind-set'. Heuer notes: 'The US perspective on what is in another country's national interest is usually irrelevant in intelligence analysis. Judgment must be based on how the other country perceives its national interest.' Transferable beyond intelligence: customer research that assumes customers value what engineers value; product launches that fail because the team modeled users via self-projection; international negotiations where each side assumes the other shares its decision-frame; parenting failures where adults assume children weight risks adult-style; ML models trained on one population deployed to another (the analyst's distribution is the 'self'; the deployment distribution is the 'other'). The substrate-meta point: mirror-imaging is the DEFAULT mode of social cognition when other-modeling is hard — projection is cognitively cheap, real other-modeling is cognitively expensive — so the practitioner has to actively suppress mirror-imaging, not just notice it."
    quote: "[Heuer 1999 Ch.6 p.70-71:] 'One kind of assumption an analyst should always recognize and question is mirror-imaging — filling gaps in the analyst's own knowledge by assuming that the other side is likely to act in a certain way because that is how the US would act under similar circumstances. To say, \"if I were a Russian intelligence officer . .\" or \"if I were running the Indian Government . .\" is mirror-imaging. Analysts may have to do that when they do not know how the Russian intelligence officer or the Indian Government is really thinking. But mirror-imaging leads to dangerous assumptions, because people in other cultures do not think the way we do. The frequent assumption that they do is what Adm. David Jeremiah, after reviewing the Intelligence Community failure to predict India's nuclear weapons testing, termed the 'everybody-thinks-like-us mind-set.'' [Heuer's South Africa example p.70:] 'In 1977, for example, the Intelligence Community was faced with evidence of what appeared to be a South African nuclear weapons test site. Many in the Intelligence Community, especially those least knowledgeable about South Africa, tended to dismiss this evidence on the grounds that Pretoria would not want a nuclear weapon, because there is no enemy they could effectively use it on. The US perspective on what is in another country's national interest is usually irrelevant in intelligence analysis. Judgment must be based on how the other country perceives its national interest. If the analyst cannot gain insight into what the other country is thinking, mirror-imaging may be the only alternative, but analysts should never get caught putting much confidence in that kind of judgment.' [Verified 2026-08-19 against the real PDF: exact match; the checker cannot confirm it because a footnote (citation 70, then the marker 71) is interleaved into the body text at exactly this point by the PDF's extraction.] [The transferable distillation: when other-modeling is impossible, projection-of-self is the default fill — and the practitioner has to know they're doing it. The treatment is two-step: (1) explicitly tag the projection as projection-not-knowledge; (2) seek primary evidence of the other's actual reasoning structure (their statements, history, cultural-norms, incentive-structure) rather than treating the projection as the answer.]"
canonical-instances:
  - "Heuer's South Africa 1977 case (p.70): analysts dismissed evidence of an SA nuclear test site because 'Pretoria would not want a nuclear weapon, because there is no enemy they could effectively use it on' — projecting US strategic reasoning onto SA. South Africa actually did pursue weapons (and tested in the late 1970s/80s; the program was dismantled 1989). The mirror-image dismissed the actual evidence."
  - "India 1998 nuclear testing surprise (Jeremiah post-mortem, Heuer p.70): IC failed to predict because they modeled BJP rhetoric as US-style 'campaign promises' and assumed the test would not actually happen. The everybody-thinks-like-us mind-set: BJP rhetoric was campaign theater (us-projection); BJP was actually committed (reality)."
  - "Customer research / product design: when an engineering team builds the product they'd want, then can't understand why users don't use it the way the team does — mirror-imaging the user. Common in technical products that fail with non-technical users (engineers project engineer-priors). The systematic fix is user interviews + observed usage, not self-imagination."
  - "ML / AI deployment: a model trained on a population (the developer's data distribution) deployed to a different population shows systematic bias because the developer's 'mirror' isn't the deployment user. Algorithmic fairness failures often reduce to this projection-of-training-population onto deployment-population."
  - "International negotiations: each side often assumes the other is computing the same payoff matrix; concessions or threats calibrated to that assumption misfire when the other party actually values different things (face, sovereignty, historical grievance, religious commitment, internal-coalition stability). Successful negotiators are those who suppress mirror-imaging and model the other's actual valuation function."
  - "Parenting / child development: adults often project adult risk-assessment, time-horizons, or motivational-structure onto children. A child who refuses to do something the adult thinks is obviously good may be operating from a completely different model (social-stakes, sibling-rivalry, developmental capacity)."
  - "Animal behavior / ethology: explanation-of-animal-behavior-via-human-motivation (anthropomorphism) is a form of mirror-imaging. Tinbergen-Lorenz behavioral ethology explicitly resists this; explanations should reduce to operations the animal can actually perform."
  - "Operationally distinct from lex-r3w25 confirmation-filtered-tribal-perception: lex-r3w25 is about how tribal-identity filters what evidence registers; lex-ckahh is about how the FILL for missing other-mental-state defaults to self-projection. They can compose (the tribal-filter projects the in-group's priors onto out-group), but are distinct: 0148 is filtering, 0445 is fabrication-via-projection."
  - "Operationally distinct from lex-exczm sympathy-as-affective-transmission (Hume): Hume's sympathy is the mechanism by which observed-affect becomes felt-affect; mirror-imaging is the COGNITIVE substitute (project-the-self) used when the other's affect/cognition is invisible. They operate on different levels (affective transmission vs cognitive other-modeling)."
  - "Operationally distinct from lex-t9fs7 confirmation-bias: confirmation-bias is search-bias toward favored conclusions about A-LREADY-FORMED hypotheses; mirror-imaging is the source of one specific FAILURE MODE in hypothesis-formation about others (you start with a wrong other-model, then confirmation-bias entrenches it). Treat them as compose-able: mirror-imaging produces the bad model; confirmation-bias defends it."
  - "Operationally composes with lex-zag9z cross-tabulate-hypotheses-against-evidence (ACH): ACH provides the procedural countermeasure to mirror-imaging — Step 1 (generate hypotheses including 'they think differently than I do') explicitly invites non-mirror models; Step 5 (try to disprove) tests whether the mirror-image hypothesis survives challenge."
  - "Operationally composes with lex-zfbef: when mirror-imaging is operative, adding more detail about the other's behavior often reinforces the projection rather than challenging it — you re-interpret each new data point through the projection. The combination produces highly-confident-but-systematically-wrong predictions about adversaries / customers / opponents."
  - "Operationally distinct from lex-eb3wf prospective-hindsight (Klein premortem): both counteract specific overconfidence sources. Premortem imagines failure; lex-ckahh names the specific failure-source of self-projection on other-modeling."
critical-questions:
  - "have you tagged your other-modeling as PROJECTION or as KNOWLEDGE? Heuer's discipline: when the analyst says 'if I were them...', they should immediately flag this as projection-not-knowledge and look for primary evidence of the other's actual reasoning. Practitioner-discipline: explicitly distinguish 'this is what I assume they think (projection)' from 'this is what I have evidence they think (data)'. Confusion of these is the failure mode."
  - "what's your evidence base for the other's value-system / decision-frame? Mirror-imaging is a cheap substitute for primary evidence. Heuer-style countermeasure: gather evidence of their actual statements, history, cultural-norms, incentive-structure, decision-making process — the things that constitute their actual reasoning rather than the projection. If you cannot name evidence-sources, you're mirror-imaging."
  - "what would they have to be like for the projection to be correct? Practitioner-question: name the specific assumptions about the other's priors/values/constraints that make the projection-match-reality. Then ask: is there evidence those assumptions are TRUE in their case (not just true in mine)? Mirror-imaging fails because these assumptions are usually wrong."
  - "what alternative HYPOTHESES about their reasoning exist? Use ACH (lex-zag9z): generate hypotheses including 'they think similarly to me' AND 'they think differently along axis X' AND 'they think differently along axis Y'. Run the standard ACH machinery. The mirror-image hypothesis is one of several to test, not the default."
  - "where do practitioners over-apply this critique? When the other party actually IS similar enough that projection-is-reasonable (close-cultural-cousin allies; same-industry competitors with shared training; users from your demographic). Mirror-imaging is unreliable WHEN the other party operates from a substantially-different reference frame. Practitioner-discrimination: assess the distance between your frame and theirs FIRST; calibrate mirror-imaging trust to that distance."
  - "what's the institutional countermeasure? Heuer's recommendations include: (a) red-team analysts who explicitly model the other's perspective; (b) area-specialists with deep cultural-historical knowledge; (c) explicit alternative-models analysis (Heuer's Ch.6 'Identify Alternative Models'). Institutional check: does your team have a structural mechanism for non-mirror modeling, or does everyone share the same default-projection?"
