id: lex-bfwev
name: withhold-personal-recruitment-until-promised-terms-honored
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When you have been personally urging others to accept risk or sacrifice on the strength of an institution's specific promised terms, and those specific terms go unmet, suspend your own personal solicitation of further recruits -- while keeping this suspension distinct from, and not requiring, any retraction of your continued belief that the institution's cause is just or that it may eventually make good. The failure being tracked is not the cause's legitimacy; it is that YOU, personally, cannot keep serving as the instrument that leads others into a bargain the other side has not kept. Frederick Douglass's 1881 autobiography records this exact, carefully bounded withdrawal. Having recruited heavily for the black regiments through early 1863 on assurances of equal pay, equal prisoner-exchange protection, and equal promotion, Douglass wrote to his recruiting partner Major Stearns in August 1863 declining a scheduled recruitment appearance: 'I have hitherto deemed it a duty, as it certainly has been a pleasure, to coöperate with you in the work of raising colored troops... Nevertheless I must for the present leave to others the work of persuading colored men to join the Union army. I owe it to my long-abused people, and especially to those already in the army, to expose their wrongs and plead their cause. I cannot do that in connection with recruiting. When I plead for recruits I want to do it with all my heart, without qualification. I cannot do that now.' Crucially, in the same letter he preserves his belief in the cause and even in the government's eventual good faith: 'I continue to believe in the black man's arm, and still have some hope in the integrity of our rulers.' The two claims are logically independent and Douglass keeps them independent: the cause remains just; the government's specific promise (equal pay, equal treatment of prisoners, equal promotion) remains unkept; and the second fact, not the first, is what disqualifies him personally from recruiting, because recruiting-with-reservations is not recruiting -- 'when I plead for recruits I want to do it with all my heart, without qualification.' The mechanism generalizes beyond wartime enlistment: an advocate who has been vouching for an institution's specific commitments to induce others' participation, upon learning those specific commitments are being broken, faces a choice distinct from either continuing to recruit (which now means vouching for terms known to be unreliable) or publicly repudiating the institution's larger cause (which may overstate the actual failure and isn't warranted by it). The atom names the third option: step back from personally soliciting further participants, precisely because solicitation requires a wholeheartedness the advocate can no longer honestly supply, while leaving open both continued private belief in the cause and the possibility of resuming full-throated recruitment once the specific broken terms are honored -- as Douglass in fact did once Secretary Stanton's assurances on prisoner protection were confirmed. Portable beyond Douglass's case: a sales manager who has been personally vouching for a vendor's delivery timeline to close deals, upon learning the vendor has quietly slipped that timeline for existing customers, stops personally pitching the vendor to new prospects -- without concluding the vendor is worthless or advising existing customers to cancel -- until the vendor's specific promise is restored. Diagnostic: when torn between 'keep recruiting despite doubts' and 'publicly denounce the whole enterprise,' check whether a narrower, specific promise -- not the enterprise's overall legitimacy -- is what actually broke; if so, the proportionate move is withdrawing your personal role as solicitor for that specific unmet term, not either extreme."
related: [lex-7mdpd, lex-czseb, lex-68v4p, lex-sxsn7, lex-b53wy, lex-u967f]
evokes: [dear-major-stearns-letter, three-particulars-to-lincoln, plead-with-all-my-heart-or-not-at-all, fort-wagner-broken-promise, continue-to-believe-in-the-black-mans-arm, faith-nearly-gone]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-stearns-letter
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (Hartford: Park Publishing Co., 1881), Chapter XI, 'Secession and War' -- Douglass's third and final autobiography. Reproduces his August 1, 1863 letter to Major George L. Stearns declining a scheduled recruitment appearance after the government failed to deliver on promised equal pay, prisoner-exchange protection, and promotion for black soldiers, following the 54th Massachusetts's costly assault on Fort Wagner."
    quote: "Nevertheless I must for the present leave to others the work of persuading colored men to join the Union army. I owe it to my long-abused people, and especially to those already in the army, to expose their wrongs and plead their cause. I cannot do that in connection with recruiting. When I plead for recruits I want to do it with all my heart, without qualification. I cannot do that now... I continue to believe in the black man's arm, and still have some hope in the integrity of our rulers."
canonical-instances:
  - "The direct textual anchor: Douglass suspends his own personal recruiting of black soldiers after the government fails to honor promised equal pay and prisoner protection, while explicitly preserving his belief in the cause and in the possibility the government would still make good -- resuming full recruitment once Stanton's assurances were confirmed."
  - "A sales manager who has personally vouched for a vendor's delivery timeline to close deals stops personally pitching that vendor to new prospects, without denouncing the vendor's product or urging existing customers to cancel, once the vendor is known to have quietly broken that specific promise for current customers."
  - "A community organizer who has been personally recruiting volunteers on the strength of a nonprofit's promised stipend or housing support steps back from further recruiting -- but not from the organization's mission -- once volunteers already in the field report the stipend isn't materializing as promised."
critical-questions:
  - "isn't this the same as lex-68v4p (cost-benefit-analysis-on-honoring-a-given-word-destroys-trust)? No -- lex-68v4p concerns a PROMISOR deciding, after giving their own word, whether the current costs of keeping it still make it worth honoring; the failure it names is doing that calculation in secret. This atom concerns a third-party ADVOCATE who gave no promise of their own, but who vouched for someone ELSE'S promise to induce others' participation -- the question is not whether Douglass will honor his own word (he isn't the promisor), but whether he can keep serving as the instrument that leads others to trust a promise the actual promisor (the government) has broken."
  - "isn't this the same as lex-czseb (Weber, responsibility-ethic-owns-tainted-means)? No -- Weber's distinction concerns whether an actor OWNS the foreseeable consequences of the coercive means THEY chose, versus laundering those consequences onto 'the world.' This atom concerns an advocate's response to a THIRD PARTY'S broken promise -- Douglass did not choose the government's discriminatory terms and is not disclaiming responsibility for them; he is declining to keep vouching for terms he did not set and cannot make the government honor. The two atoms could co-occur in a case where an advocate also bears some responsibility for the tainted means, but this atom's core content -- withdrawing solicitation while preserving belief in the cause -- has no analog in Weber's ownership question."
  - "isn't this the same as lex-sxsn7 (resisting-domination-reconstitutes-dignity-independent-of-victory)? No -- lex-sxsn7 concerns what an act of RESISTANCE does to the resister's OWN self-conception during an ongoing domination relation. This atom concerns a specific ADVOCACY-ROLE decision (whether to keep personally recruiting others) made in response to a broken institutional promise -- it is a claim about the ethics and mechanics of vouching for others' commitments, not about the psychological effect of resistance on the person withdrawing."
  - "does this atom counsel abandoning a cause the moment any promised term is delayed or imperfectly met? No. The withdrawal is specifically scoped to PERSONAL SOLICITATION OF OTHERS, not to private belief, public advocacy for the cause's legitimacy, or permanent repudiation -- and Douglass's own resumption of recruiting once assurances were confirmed shows the posture is meant to be reversible. An advocate who treats every minor promise-slippage as grounds for full withdrawal, or who conflates 'I can't recruit wholeheartedly right now' with 'the cause is worthless,' is misapplying the atom; the proportionality is the point."
severity-tier: info
status: active
