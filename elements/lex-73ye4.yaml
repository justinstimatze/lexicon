    quote: "The elder noticed him lying there and suspecting his character said to himself, \"It would be wrong for me to have any dealings with a robber.\" So coming out of his hut he told him not to lie there, and drove him away."
canonical-instances:
  - "A shopkeeper declines to extend informal credit to a new customer whose story doesn't quite add up, with no evidence beyond a gut sense — and later learns from a neighboring shop that the same person had just walked out on an unpaid tab across the street."
critical-questions:
  - "How often does acting on unconfirmed suspicion turn out to be wrong, and what's the cost to the wrongly-suspected person in those cases — does the story only get told when the suspicion happens to be vindicated?"
  - "Is there a meaningful difference between 'suspecting before too late' as prudent foresight and simply discriminating against strangers based on unverifiable first impressions?"
