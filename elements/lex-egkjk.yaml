lineage:
  - source: primary
    text: Diamond-2008-Collapse
    citation: "Jared Diamond, *Collapse: How Societies Choose to Fail or Succeed* (Viking 2005; revised 2011 edition with afterword). Ch.14 `Why Do Some Societies Make Disastrous Decisions?` — the crucial diagnostic of why societies that should be able to perceive their cumulative degradation often fail to act in time. Diamond names two perception-side mechanisms that operate jointly: CREEPING NORMALCY (slow trends concealed within noisy fluctuations) + LANDSCAPE AMNESIA (forgetting how the landscape looked decades ago because intermediate change was gradual). The framework extends Pauly 1995 *Anecdotes and the shifting baseline syndrome of fisheries* (TREE 10:430) from fisheries management to societal-scale collapse-perception. Diamond's transferable contribution is the IDENTIFICATION of the baseline-updating mechanism as a perception-side failure mode distinct from structural-collapse mechanisms (Tainter 1988 *Collapse of Complex Societies* lex-wx2ma substrate-grounded; Turchin 2009 lex-wgd7u; Pierson 2004 path-dependence lex-gv3us). The atom encodes the transferable structural form — slow cumulative change evades detection because the receiver's baseline updates to the current state — separately from Diamond's specific environmental focus. Debunking check applied: Diamond's specific historical case studies have been substantially debated by archaeologists (Hunt + Lipo 2011 on Easter Island; McAnany + Yoffee 2010 *Questioning Collapse* edited volume contains multiple critiques of Diamond's specific narratives). The PERCEPTUAL MECHANISM claim — baseline-updating produces cumulative-degradation invisibility — is well-attested across fisheries science (Pauly 1995 + extensive subsequent work), conservation biology (Soga + Gaston 2018), behavioral economics (the boiled-frog phenomenon as folk-version), social-psychology (Overton-window literature), and software engineering (legacy-system normalization). The atom encodes the perceptual primitive separately from Diamond's specific cases."
    quote: "[Diamond 2008 Ch.14, the cardinal creeping-normalcy passage:] 'Politicians use the term \"creeping normalcy\" to refer to such slow trends concealed within noisy fluctuations. If the economy, schools, traffic congestion, or anything else is deteriorating only slowly, it's difficult to recognize that each successive year is on the average slightly worse than the year before, so one's baseline standard for what constitutes \"normalcy\" shifts gradually and imperceptibly. It may take a few decades of a long sequence of such slight year-to-year changes before people realize, with a jolt, that conditions used to be much better several decades ago, and that what is accepted as normalcy has crept downwards.' [On landscape amnesia — the vital distinct mechanism:] 'Another term related to creeping normalcy is \"landscape amnesia\": forgetting how different the surrounding landscape looked 50 years ago, because the change from year to year has been so gradual. An example involves the melting of Montana's glaciers and snowfields caused by global warming. After spending the summers of 1953 and 1956 in Montana's Big Hole Basin as a teenager, I did not return until 42 years later, in 1998, when I began visiting every year. Among my vivid teenaged memories of the Big Hole were the snow covering the distant mountaintops even in mid-summer, my resulting sense that a white band low in the sky encircled the basin... I was stunned and saddened on my return to the Big Hole in 1998 to find the band almost gone, and in 2001 and 2003 actually all melted off. When I asked my Montana resident friends about the change, they were less aware of it: they unconsciously compared each year's band (or lack thereof) with the previous few years. Creeping normalcy or landscape amnesia made it harder for them than for me to remember what conditions had been like in the 1950s.' [Practitioner-extraction for transferable lex-egkjk: cumulative degradation evades detection because each year of observation UPDATES THE RECEIVER'S BASELINE to the current state. Year-to-year comparison conceals decade-scale change. The diagnostic is to introduce an external fixed reference — an outsider's eye, a decadal benchmark, a deliberate longitudinal comparison.]"
  - source: cross-attestation
    text: cross-domain-baseline-update-perceptual-failure
    citation: "Cross-domain attestation that baseline-updates-hiding-cumulative-change recurs across fisheries science, conservation biology, behavioral economics, social-psychology, software engineering, and organizational dynamics. (a) Fisheries science: Pauly 1995 *Anecdotes and the shifting baseline syndrome of fisheries* (Trends in Ecology and Evolution 10:430) — the foundational paper. Each generation of fisheries scientists sets their baseline at career-start, so each generation's `pristine` reference is already-depleted relative to the prior generation's. The cumulative depletion across generations is invisible through within-career observation. (b) Conservation biology: Soga + Gaston 2018 *Shifting baseline syndrome: causes, consequences, and implications* (Frontiers in Ecology and Environment 16:222) extends Pauly framework to biodiversity loss generally; documents the inter-generational baseline-drift mechanism across multiple taxa + landscape categories. (c) Behavioral economics + organizational psychology: the boiled-frog phenomenon literature (originally folk-wisdom; researched in Bardwick 1991 *Danger in the Comfort Zone* + multiple subsequent organizational behavior texts); the normalization-of-deviance literature (Vaughan 1996 *The Challenger Launch Decision* + Vaughan 2016 retrospective). (d) Social psychology: Overton-window literature (Lakoff 2004 *Don't Think of an Elephant*; the political-discourse baseline-drift mechanism). The cumulative shift in what counts as `mainstream` over decades is invisible through year-to-year tracking. (e) Software engineering: legacy-system normalization — each developer joining a codebase normalizes to the current state; the cumulative tech-debt is invisible until external review or new-hire arrival. Brooks 1995 + Hunt-Thomas 1999 *Pragmatic Programmer* + Martin 2008 *Clean Code* document the mechanism in software-specific form. (f) Health + personal habits: gradual weight gain + fitness decline + sleep degradation are common forms of personal baseline-drift, documented in behavioral-health literature (Marteau + Hollands + Fletcher 2012 *Changing Human Behavior* + WHO 2013 *Global Action Plan for the Prevention and Control of NCDs*). (g) Relationship + workplace satisfaction: the slowly-degrading partnership or job; the perceiver's tolerance baseline shifts so the cumulative degradation does not trigger leaving until a triggering event forces external-baseline comparison (Hochschild 1989 *The Second Shift* + Gottman 1999 *The Marriage Clinic*). (h) Privacy erosion: each individual ToS change + UX change is small; cumulative privacy erosion is invisible without longitudinal comparison (Solove 2008 *Understanding Privacy* + Zuboff 2019 *Surveillance Capitalism*). The cross-domain attestation establishes the transferable structural form: receivers update their baseline to current state, hiding cumulative change."
    quote: "Across fisheries science (Pauly 1995, Soga-Gaston 2018), conservation biology, behavioral economics + organizational psychology (Bardwick 1991, Vaughan 1996+2016 normalization-of-deviance), social psychology (Lakoff 2004 Overton-window), software engineering (Brooks 1995, Hunt-Thomas 1999, Martin 2008), health (Marteau-Hollands-Fletcher 2012), relationship + workplace research (Hochschild 1989, Gottman 1999), and privacy research (Solove 2008, Zuboff 2019), the same structural form recurs — receivers update their baseline to the current state, hiding cumulative change. The transferable diagnostic: introduce an external fixed reference; design for periodic forced-comparison-with-baseline."
canonical-instances:
  - "Diamond's Montana Big Hole Basin glaciers (Ch.14): Diamond's own observation of substantial snow loss between teenage visits (1950s) and adult visits (1990s-2000s) compared to local residents' lack of awareness — the baseline-updating mechanism made the cumulative loss invisible to continuous residents."
  - "Pauly 1995 shifting-baseline-syndrome in fisheries: each generation of fisheries scientists sets `pristine` baseline at career start. The cumulative depletion across generations is invisible. Pauly: `each generation accepts as a baseline the stock size and species composition that occurred at the beginning of their careers, and uses this to evaluate changes. When the next generation starts its career, the stocks have further declined, but it is the stocks at that time that serve as a new baseline. The result obviously is a gradual shift of the baseline.`"
  - "Climate change baseline-perception: each year's temperature anomaly is compared to recent decades; the cumulative warming relative to pre-industrial baseline (~1.2C as of 2024) is invisible through within-lifetime year-to-year comparison."
  - "Vaughan 1996 *The Challenger Launch Decision* — normalization-of-deviance at NASA: each O-ring erosion event was compared to the previous event, not to original specifications. The cumulative drift from `no erosion acceptable` to `erosion within margin` to `disaster` was invisible through local comparison."
  - "Legacy software codebases: each developer joining the codebase normalizes to the current state. The cumulative tech-debt is invisible until external review or new-hire arrival surfaces it. Common pattern across engineering organizations."
  - "Overton-window shift (Lakoff 2004): political-discourse baseline drift across decades. What was outrage in 1990 (e.g., specific anti-immigrant policies, specific surveillance-state expansions, specific corporate-power concentrations) is normal in 2025. The shift is invisible through year-to-year media-cycle attention."
  - "Privacy erosion via cumulative ToS + UX changes: each individual change to Facebook or Google or Amazon terms-of-service was small; cumulative erosion from 2005 default-private to 2025 default-tracked-everywhere was massive but largely unregistered (Solove 2008, Zuboff 2019)."
  - "Relationship + workplace satisfaction drift: the slowly-degrading partnership or job; the tolerance baseline shifts so the cumulative degradation does not trigger leaving until a triggering event forces external-baseline comparison (the friend who hasn't seen you in 5 years; the new job offer that surfaces what you've been tolerating)."
  - "operationally distinct from lex-uqghr complexity-yields-declining-marginal-returns-eventually-driving-collapse (Tainter): Tainter's mechanism is structural — declining returns on complexity-investment trigger collapse. lex-egkjk is PERCEPTUAL — baseline-update prevents recognition that the structural decline is happening. They compose: lex-wx2ma explains the structural-decline; lex-egkjk explains the failure-to-respond."
  - "operationally distinct from Olson 1982 institutional-sclerosis (not currently substrate-grounded): Olson's mechanism is institutional accumulation of veto-points. lex-egkjk is perceptual baseline-drift. They compose: lex-k6wka explains why response is structurally difficult; lex-egkjk explains why need-for-response is not perceived."
  - "operationally distinct from lex-mwgep path-dependence: path-dependence is commitment-trap mechanism. lex-egkjk is perceptual baseline-update mechanism. Different mechanisms; they compose."
  - "operationally distinct from lex-dqa9j elite-overproduction-supplies-counterelites-who-mobilize-grievance (Turchin): different cycle dynamics; lex-egkjk is perceptual-failure that can apply within any cycle."
  - "operationally distinct from lex-kj6tj democratic-consent-sustains-soft-tutelage (Tocqueville): lex-kj6tj is about consent-based-acceptance of administrative apparatus. lex-egkjk is about perceptual-failure-through-baseline-update. They compose when the administrative apparatus's degradation is hidden from the consenting citizens by baseline-drift."
critical-questions:
  - "Could the atom be misused to argue every nostalgic comparison is correct + every adaptation is failure? Yes — this is the standard misuse pattern in some conservative + reactionary writing. The discipline against this: the atom names a PERCEPTUAL FAILURE MODE, not a normative-claim that older baselines were uniformly better. Empirically some changes are improvements; the atom's claim is that the PERCEPTUAL MECHANISM hides change, regardless of whether the change is for better or worse."
  - "How do you distinguish baseline-drift that hides genuine degradation from baseline-drift that correctly tracks neutral or beneficial adaptation? Operational test: introduce an external fixed reference (decadal benchmark; outsider's eye; specific operational measures from prior period). If the external reference shows substantial loss of value (biodiversity, function, satisfaction, capability), the baseline-drift was hiding degradation. If the external reference shows comparable or improved function, the baseline-drift was tracking adaptive change."
  - "Does the atom imply individuals are at fault for not perceiving change? No. The atom names a STRUCTURAL PERCEPTUAL MECHANISM — humans naturally compare locally (year-to-year), not against fixed external references. The failure is in perception-design at the institutional level (insufficient longitudinal benchmarking; insufficient external-eye exposure), not at the individual-blame level."
  - "How does the atom apply to long-running AI systems (model drift, training-data drift, capability drift)? The structural form applies — operators of long-running systems normalize to current state; cumulative drift is invisible without fixed external benchmarks. Common in production-ML: model-performance drift detected only when external benchmarks are run; data-drift detected only with monitoring designed for it. The mitigation is the same: design for periodic forced-comparison against fixed baseline."
  - "Could the atom be applied to cultural appropriation + assimilation analyses? Speculatively yes — the mechanism by which dominant-culture-appropriating-subordinate-culture-elements becomes accepted-as-normal over decades likely involves baseline-update. But application requires care; the atom names the perceptual mechanism, not the normative claim about appropriation."
