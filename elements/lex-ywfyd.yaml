id: lex-ywfyd
name: lacking-any-transferable-resource-one-pledges-ones-own-body-instead
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you hold a commitment to help whoever asks but genuinely possess nothing storable or transferable to give, the commitment doesn't lapse for lack of an asset — it can instead resolve into treating your own body as the one thing you do have available to offer. In the Jataka's tale of the four friends, the hare, unlike his three companions who each found food to store, realizes he has nothing to hoard and reasons his way to the only asset left: 'It is impossible for me to offer grass to any beggars that may chance to appear, and I have no oil or rice and such like. If any beggar shall appeal to me, I Shall have to give him my own flesh to eat.'"
related: []
evokes: [jataka, catukkanipata, sasa-jataka, no-storable-asset-redirects-a-commitment-onto-the-self, a-vow-forces-the-only-remaining-resource-into-view]
lineage:
  - source: primary
    text: jataka-chalmers1895-sasa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 316, Sasa-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"It is impossible for me to offer grass to any beggars that may chance to appear, and I have no oil or rice and such like. If any beggar shall appeal to me, I Shall have to give him my own flesh to eat.\""
canonical-instances:
  - "A volunteer who promised to help every stranded traveler at a shelter but has run out of food, blankets, and cash decides the only thing left to offer is a night sitting up with them so no one is alone — the promise doesn't lapse for lack of supplies, it converts into personal presence."
critical-questions:
  - "Is escalating to one's own body or wellbeing actually the right response to a resource shortfall, or does treating it as the 'only remaining option' foreclose less drastic alternatives, like simply admitting nothing can be given this time?"
  - "Does the commitment itself deserve this level of loyalty, or is the hare's reasoning here a rationalization for self-sacrifice that a more measured version of the vow would have avoided entirely?"
status: active
