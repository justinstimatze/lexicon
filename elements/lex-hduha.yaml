lineage:
  - source: primary
    text: kautilya-arthashastra-fire-rejected-for-unpredictable-effects
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'The Siege,' 'Use of Fire,' {13.4.22-24}."
    quote: "'When a fort can be captured by fighting, fire shall not be used at all. For fire is a divine calamity whose effects are unpredictable; it is a destroyer of uncountable numbers of people as well as grains, animals, wealth, forest produce and other goods.'"
canonical-instances:
  - "A company facing a defamatory smear campaign considers leaking damaging but true information about the attacker to the press, and rejects it once they recognize the leak would inevitably also implicate several uninvolved former colleagues and business partners whose reputations can't be protected once the story is out -- the tactic works, but its damage can't be confined to the intended target."
  - "A government agency considers a broad economic sanction that would cripple a hostile regime's leadership but rejects it in favor of narrower, targeted sanctions after recognizing the broad version's effects would also devastate the civilian population and neighboring economies in ways no design of the sanction could actually contain."
critical-questions:
  - "at what point does refusing every uncontrollable-but-effective tactic become a disadvantage against an opponent who has no such scruple, potentially costing a decisive advantage or even the entire contest to an adversary willing to accept collateral damage?"
  - "how confidently can a party actually predict, in advance, whether a tactic's effects will stay confined or spread -- does this framework require a level of foresight about second-order effects that's often unavailable until after the tactic has already been deployed?"
  - "is 'unpredictable spread' really a fixed property of a tactic, or can careful preparation and constraint (a controlled burn, a narrowly scoped leak) sometimes convert an otherwise indiscriminate tool into a targetable one, making the fire-versus-not-fire distinction less binary than this framework suggests?"
