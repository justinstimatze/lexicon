    text: zitkala-sa-iktomi-and-the-ducks-complaint-reveals-the-baking-ducks
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'Iktomi and the Ducks.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'He! Gray wolves! Don't you come here! I'm caught fast in the tree so that my duck feast is getting cold. Don't you come to eat up my meal.' The leader of the pack upon hearing Iktomi's words turned to his comrades and said: 'Ah! hear the foolish fellow! He says he has a duck feast to be eaten! Let us hurry there for our share!' ... when the wolves had scampered off ... Iktomi cried out like a pouting child, 'At least you have left my baking under the ashes!' 'Ho! Po!' shouted the mischievous wolves; 'he says more ducks are to be found under the ashes! Come! Let us have our fill this once!'"
canonical-instances:
  - "An employee locked out of a shared drive during a tense dispute complains loudly in an open office chat channel that 'at least they can't touch the backup files on the external drive in my desk,' not realizing a colleague with no loyalty to either side will now mention the external drive to management, who then secures it too."
  - "A small business owner, venting to a competitor at an industry event about a difficult season, mentions offhand that their biggest remaining account is up for renewal next month and hasn't been re-signed yet -- information the competitor immediately uses to approach that exact client before the renewal happens."
critical-questions:
  - "how does someone reliably distinguish, in the heat of genuine distress, between a complaint that's safely general and one that's dangerously specific -- is this a discipline that can actually be exercised in the moment of frustration, or does it require after-the-fact hindsight to even recognize?"
  - "does staying silent about a specific loss while trapped and vulnerable ever cost more than speaking up -- are there situations where naming the exact threat to a bystander is the only way to recruit help, making blanket silence its own kind of mistake?"
  - "why does Iktomi repeat the exact same disclosure a second time immediately after watching it fail him once -- is this really an information-hygiene lesson, or is it more specifically about how acute distress overrides even freshly-learned caution, a different and perhaps more useful thing to name?"
