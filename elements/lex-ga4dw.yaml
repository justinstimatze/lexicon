id: lex-ga4dw
name: rushed-individual-execution-trades-quality-at-nonlinear-rate
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When you feel time-pressure to finish a task — a draft, a calculation, a code change, a conversation, a physical assembly — the proverb-tradition's transferable claim is that rushed execution trades QUALITY for SPEED at a NONLINEAR rate, often beyond what you intuit in the moment. The first 10% time-saved costs 5% quality; the next 10% time-saved costs 15% quality; past some inflection point, the quality loss exceeds the absolute output (negative work — the rushed version creates errors that cost more time to fix than careful execution would have taken). Five proverb-traditions independently encode this: American 'haste makes waste'; Latin/Augustan 'festina lente' (make haste slowly); British 'fair and softly goes far in a day' and 'fools rush in where angels fear to tread'; Japanese 'the more haste, the less speed' (急がば回れ — when in a hurry, take the long way); Yoruba teaching 'with slow and steady application, even a difficult task will be done.' The five-tradition convergence is the transferability evidence: this is a structural feature of execution under time-pressure, not a Western maxim. Practitioner discipline: when you notice the urge to speed up, ask whether you are at the LINEAR portion of the cost-curve (early time-cut, small quality cost) or the CONVEX portion (late time-cut, runaway quality cost). The proverb-tradition's diagnostic shorthand is 'slow is smooth, smooth is fast' — past the inflection point, careful pace outpaces rushed pace by absolute output. Be careful not to misapply: this is NOT a license for chronic over-deliberation. The atom names the convex tail of the speed-quality curve, not the linear early portion. If a calibrated observer would say 'this is the cheap-fast-good-pick-two zone, take the speed,' the atom does not apply. It applies when the rushed execution would produce errors that propagate into larger fix-costs."
related: [lex-7za5n, lex-dme3d, lex-q77ce, lex-rgr3t, lex-s7qxv, lex-spm8x, lex-wtkuz, lex-zfbef]
evokes: [haste-makes-waste, festina-lente, slow-is-smooth-smooth-is-fast, fools-rush-in, more-haste-less-speed, isogaba-maware, fair-and-softly, speed-quality-tradeoff, convex-cost-of-rushing, proverb-tradition-cross-cultural-attestation]
lineage:
  - source: primary
    text: cross-proverb-convergence-haste-makes-waste-festina-lente
    citation: "Multi-tradition proverb-attestation. The transferable claim — rushed execution trades quality at a nonlinear rate, often producing negative output past an inflection point — is attested across at least five independent proverb-traditions. (a) MIEDER ed., *A Dictionary of American Proverbs* (Oxford 1992): 'Careless hurry may cause endless regret' and 'Fools rush in where angels fear to tread' (American attestation, the latter via Pope 1711 'An Essay on Criticism' but recorded as proverb across English-speaking cultures). (b) SIMPSON-SPEAKE eds., *The Oxford Dictionary of Proverbs* (5th ed. 2008): canonical entry 'Fair and softly goes far in a day' (recorded from c.1350 Douce MS 52: 'Fayre and softe me ferre gose'; 1670 Ray *English Proverbs*: 'Fair and softly goes far in a day...Festina lente'). The Latin tag 'festina lente' was Suetonius's report of Augustus's personal motto (Suetonius, *Vita Augusti* 25.4); the English proverb-tradition explicitly co-cites the Latin alongside the English form. (c) MIEDER, *The Prentice-Hall Encyclopedia of World Proverbs* (1993): entry #7240 'Haste makes waste' (multi-tradition attestation in the encyclopedia's organizing structure). (d) GALEF compiler/translator, *Even Monkeys Fall from Trees: Wit and Wisdom of Japanese Proverbs* (Tuttle 2015): 'The more haste, the less speed' (急がば回れ, *isogaba maware* — literally 'when in a hurry, take the long way around'), a fully-attested Japanese proverb pre-dating the modern English form. (e) OWOMOYELA, *Yoruba Proverbs* (University of Nebraska Press 2005): explicit discussion of 'Haste makes waste' as paralleled in Yoruba teaching, and the Yoruba pattern 'with slow and steady application, even a difficult task will be done.' The five-tradition convergence (American, British/Latin-co-cited, Japanese, Yoruba, multi-tradition encyclopedia) is the transferability evidence: this is a structural feature of execution under time-pressure, not a Western maxim. The atom is silent on the exact shape of the cost-curve (whether quadratic, exponential, etc.); what it claims is that the curve is CONVEX UP past some inflection point and that the proverb-tradition is empirically calibrated to that inflection. Distinct from lex-s7qxv quorum-trigger-over-distributed-advocacy because lex-s7qxv is about COLLECTIVE decision-making with a quorum threshold; lex-ga4dw is about INDIVIDUAL execution under time-pressure. The two atoms compose (Seeley's bees explicitly tune the quorum threshold for accuracy-vs-speed at the collective level; lex-ga4dw is the individual-level analog). Distinct from lex-q77ce marginal-cost-of-correction-grows-with-deferral because lex-q77ce says ACT EARLY before defects compound; lex-ga4dw says CAREFULLY when you do act. Orthogonal — act early AND carefully. Distinct from lex-dme3d soft-overcomes-hard because lex-dme3d is about yielding-vs-forcing (Taoist); lex-ga4dw is about pacing under time-pressure. Distinct from lex-rgr3t habit-formation-frees-attention-for-higher-order-work because that atom is about automaticity gains; lex-ga4dw is about the speed-quality tradeoff in single executions. Distinct from lex-spm8x feedback-loop-as-mechanism because that's the general mechanism class; this is a specific cost-curve claim."
    quote: "[Mieder ed. *Dictionary of American Proverbs* 1992, entry 'haste' / 'hurry':] '2. Careless hurry may cause endless regret. [...] 82. Fools rush in where angels fear to tread.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'Fair and softly':] 'c 1350 Douce MS 52 no. 50 Fayre and softe me [one] ferre gose. 1670 J. RAY English Proverbs 87 Fair and softly goes far in a day. .He that spurs on too fast at first setting out, tires before he comes to his journeys end. Festina lente.' [Mieder *Prentice-Hall Encyclopedia of World Proverbs* 1993, entry:] '7240. Haste makes waste.' [Galef *Even Monkeys Fall from Trees* 2015:] 'The more haste, the less speed.' [Owomoyela *Yoruba Proverbs* 2005, on cross-cultural comparison:] 'Of \"Two heads are better than one\" or \"Haste makes waste\"? [...] with slow and steady application, even a difficult task will be done.' [The cross-cultural pattern: in every collection surveyed except the Arabic 19th-c. collection (which uses different metaphors for the same claim — 'a hasty man drinks his coffee with sand'), the proverb-tradition independently crystallizes the same structural claim — rushed execution trades quality at a nonlinear rate. The five-tradition convergence demonstrates transferability rather than cultural-particularity.]"
canonical-instances:
  - "Surgical practice: 'slow is smooth, smooth is fast' is verbatim a US Navy SEAL / surgical team motto recognizing that careful pace produces faster total time-to-completion than rushed pace, because rushed errors require corrective sub-procedures. The cost-curve inflection is the empirical observation; the proverb-tradition encoded it centuries before instrumentation could quantify it."
  - "Code review under deadline: 'just ship it' under late-stage pressure has a measurable cost-curve. The first 20% time saved produces small quality regression; the last 20% saved produces order-of-magnitude debugging cost. Engineering practice (Brooks 1975 *Mythical Man-Month*, Fred Brooks's adding-manpower-to-a-late-project-makes-it-later) is a downstream specific instance of the general claim. Linters, tests, code review processes operationalize the haste-makes-waste discipline — they slow the input but reduce the convex-tail cost of integrating broken code."
  - "Combat-shooting training (the 'slow is smooth' motto context): the explicit drill discipline is to execute each movement at the pace that produces NO ERRORS, then increase pace only after error-free execution is reliable. The motto encodes the cost-curve: an error in a high-stakes execution (drawing weapon, clearing room) costs orders of magnitude more than the time saved by rushing. Same proverb-shape applied to a domain where the cost-curve is brutal."
  - "Surgical hand-washing (Semmelweis 1847 / Lister 1867 / modern WHO surgical-safety checklists): the 'wasted' time on careful hand prep + surgical-time-out is the transferable application — the inflection point is INVISIBLE to the surgeon under time-pressure but obvious in mortality statistics. Modern surgical-checklist research (Atul Gawande *Checklist Manifesto* 2009, derived from Pronovost ICU central-line research) makes the proverb-tradition's claim empirically observable."
  - "Distinguished from cases where SPEED IS RATIONAL: a routine task at the linear portion of the cost-curve (typing a quick reply, sending a one-line acknowledgment, executing a well-rehearsed motion) does not require the slow-pace discipline. The atom applies past the inflection point. The diagnostic: have you executed this exact task enough times to know your error rate at various paces? If yes, you can rationally calibrate to the cost-curve. If no, the proverb-tradition's default-to-careful is the right prior."
  - "Distinguished from chronic over-deliberation: someone who can never finish anything because they're always polishing has misapplied the atom. The atom names the convex tail of the cost-curve, NOT the linear early portion. The check: would a calibrated observer say 'this is past good-enough'? If yes, deliberation is the failure mode and lex-ga4dw does NOT apply. Adam Mastroianni's writing on 'epistemic perfectionism' is one named version of this misapplication."
  - "Distinguished from lex-s7qxv Seeley quorum-trigger: Seeley is about COLLECTIVE decision speed/accuracy with the quorum threshold tuning the tradeoff at group level. lex-ga4dw is about INDIVIDUAL execution. They compose: Seeley's bees as individuals also exhibit the haste-makes-waste curve in their site-scrutiny phase (rushed scouts produce poorer quality assessments); the collective quorum threshold compensates by requiring multiple independent scouts to converge. Two levels of the same general phenomenon."
critical-questions:
  - "Are you past the inflection point or still on the linear early portion of the cost-curve? Diagnostic: estimate quality loss at 10% speed-up vs 30% speed-up. If the 30% case feels 3-5x worse than the 10% case, you're approaching the convex tail and the atom applies. If 30% feels only 3x worse (linear), the atom does not apply yet — there is room to speed up."
  - "Is the cost-curve actually convex in this domain, or are you assuming proverb-tradition wisdom that doesn't apply? Some domains have nearly-linear cost-curves (routine tasks, well-rehearsed motions, low-stakes outputs). The atom encodes a HEURISTIC, not a theorem. Check whether the specific domain has been shown convex in your experience or in published research."
  - "Are you using 'slow is smooth' to avoid finishing? The atom's failure mode is chronic over-deliberation. The check: would a calibrated observer say 'this is past good-enough'? If yes, the immediate-completion cost is below the further-polishing cost and the atom does not apply. Recognize the difference between 'past inflection point — slow down to avoid convex-tail cost' and 'past good-enough — speed up to capture remaining value of completion.'"
  - "Is the time-pressure REAL or PERCEIVED? Sometimes the felt urgency to rush is internal (anxiety, social pressure, status-signaling about productivity) rather than external (actual deadline cost). The atom applies to real time-pressure decisions. If the time-pressure dissolves on examination (the deadline is self-imposed; the cost of being a day late is minimal), the speed-quality tradeoff is not the binding constraint and the atom is not the right analytic tool."
  - "Are you confusing 'slow is smooth' with 'careful equals slow'? Some practitioners with high skill can execute at high pace WITHOUT entering the convex tail (the surgical-team or SEAL motto specifically envisions executions that combine speed and care via repetition-built reliability). The atom is about the cost-curve, not about pace per se. A novice's careful pace and an expert's fast pace can both be 'smooth' in the transferable sense. Don't confuse the heuristic with the practice."
status: active
