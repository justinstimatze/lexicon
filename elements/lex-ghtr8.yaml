canonical-instances:
  - "A code reviewer approving pull requests has time to read the diff and check that tests pass, but no time to trace every new code path against every existing caller. 'Approved, tests green' becomes the working definition of safe to merge, and the bugs that survive are precisely the ones a full trace would have caught and a diff-read plus test-suite cannot."
  - "A financial auditor samples a fixed percentage of a company's transactions each quarter because auditing every transaction is not economically possible. A finance team that learns the sampling method can route irregular transactions through whichever category the sample rarely touches, passing every audit while the actual books stay unreliable."
  - "A restaurant health inspector visits once or twice a year and checks a fixed checklist (temperature logs, handwashing signage, pest-control records) in the time allotted. A kitchen that keeps the checklist items pristine while ignoring everything the checklist doesn't ask about can hold a top rating for years without the food actually being handled well."
  - "Operationally distinct from lex-tb3re a-measure-pushed-as-a-target-ceases-to-be-a-good-measure: that atom describes a measure that starts out genuinely tracking the goal and DEGRADES once it becomes the optimization target. This atom describes a floor that never tracked the goal in the first place -- it was calibrated to the auditor's checking capacity from the moment it was set, so there is no prior good state for it to degrade away from."
critical-questions:
  - "How would you know the gap between 'passes inspection' and 'actually adequate' is real, rather than the auditor having correctly calibrated a floor that already is adequate? Some inspection regimes overshoot genuine need instead of undershooting it; the diagnosis only holds where the auditor's own account (as Cauldwell gives one) or independent evidence shows the floor tracking checking capacity rather than the domain's real requirements."
  - "Building to a self-set standard above the floor costs real time and money with no external party requiring it and no inspector rewarding it. What sustains that spending once the person setting the higher bar is not the one who will personally suffer the consequences of skipping it -- a contractor building a house to sell, a reviewer approving someone else's production system? The atom assumes the builder internalizes the eventual occupant's interest; that assumption can fail."
  - "Once 'above the floor' is adopted as the target, what stops it from becoming the new floor that the next audit calibrates to -- and needing its own margin above it? The move can regress without a way to fix a standard independent of what any given round of inspection happens to catch."
