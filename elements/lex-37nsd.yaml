id: lex-37nsd
name: felt-contingency-of-an-outcome-tracks-consistency-of-past-exposure
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When you notice yourself feeling that a future outcome is genuinely 'up in the air' -- a coin-flip, unpredictable, contingent -- rather than simply unlikely or likely, consider Spinoza's psychological account of where that specific FEELING originates, before treating it as a read on the world's actual variability. His mechanism (II. Props. xvii-xviii, extended in II. xliv. Cor. i.): once the body has been affected by two things together, imagining one causes the mind to straightway remember the other, and absent anything excluding it, the mind treats an imagined thing as present. Applied to time, this lets the mind project a future in whatever pattern its past pairings have actually taken -- reliably, if the pairing was uniform, and WAVERING between remembered alternatives if the pairing was itself mixed; Spinoza's claim is that this wavering, not some perception of the world's objective openness, is what the FEELING of contingency consists of: 'it is only through our imagination that we consider things... as contingent.' His worked example: a child sees Peter every morning, Paul every noon, Simon every evening, for many days running -- each dawn confidently calls up Peter, each evening confidently calls up Simon, because the pairing has been uniform. But if on one occasion the child sees James instead of Simon at evening, from then on the thought of 'evening' no longer reliably calls up one person: the child's anticipation 'will waver,' imagining Simon and James 'in the future, neither of them as certain, but both as contingent.' The objective world has not changed in how open the outcome actually is -- what changed is that the child's own personal sample of evenings switched from uniform to mixed, and that switch alone is sufficient to produce genuine, non-mystical felt uncertainty, wildly out of proportion to the true frequency (one exception among dozens of repetitions still produces wavering, not calibrated 95%-confidence). Portable beyond the child's case: someone who has had one bad flight in fifty may feel their next flight's safety as more 'up in the air' than the roughly 2% true rate would warrant, because their personal exposure sample now contains both outcomes rather than one; a manager whose usually-reliable analyst was wrong once may feel genuinely unsure about every subsequent report from that analyst, even though the analyst's real hit rate is still near-perfect, because the manager's own experience sample flipped from uniform to mixed. Diagnostic use: when a future event feels like a coin-flip, checking whether that feeling traces to a small, recently-mixed personal sample -- rather than to some deeper truth about the event's actual variability -- can recalibrate the unease without requiring the person to distrust their instincts wholesale. Scope: this is a claim about the PSYCHOLOGICAL ORIGIN of the raw feeling of contingency, prior to and separate from any explicit frequency calculation a person might also (correctly or incorrectly) perform."
related: [lex-dy6xw, lex-nx7u7, lex-kgphf]
evokes: [imagines-peter-paul-and-simon, imagination-will-waver, neither-of-them-as-certain-but-both-as-contingent, only-through-our-imagination-that-we-consider-things-as-contingent]
lineage:
  - source: primary
    text: spinoza-1677-ethics-part-ii-contingency-from-wavering-imagination
    citation: "Baruch Spinoza, Ethica (1677 posthumous), Part II 'On the Nature and Origin of the Mind,' Prop. XLIV, Corollary I and Note. Elwes translation (Project Gutenberg)."
    quote: "It is only through our imagination that we consider things, whether in respect to the future or the past, as contingent... let us suppose that a child yesterday saw Peter for the first time in the morning, Paul at noon, and Simon in the evening; then, that today he again sees Peter in the morning... with the imagination of the morning, he will imagine Peter; with noon, he will imagine Paul; and with evening, he will imagine Simon... If it should at any time happen, that on some other evening the child should see James instead of Simon, he will, on the following morning, associate with his imagination of evening sometimes Simon, sometimes James, not both together: for the child is supposed to have seen, at evening, one or other of them, not both together. His imagination will therefore waver; and, with the imagination of future evenings, he will associate first one, then the other -- that is, he will imagine them in the future, neither of them as certain, but both as contingent."
canonical-instances:
  - "The direct textual anchor: a child who has reliably seen Simon every evening confidently expects Simon again -- but after one evening with James instead, the child's anticipation of future evenings wavers between Simon and James, and this wavering is what the feeling of contingency consists of, independent of the true underlying frequency."
  - "Someone who has had one bad flight in fifty may feel their next flight as more 'up in the air' than the roughly 2% true rate warrants, because their personal exposure sample now contains both outcomes rather than only the safe one."
  - "A manager whose usually-reliable analyst was wrong once may feel genuinely unsure about every subsequent report from that analyst, even with a near-perfect real hit rate, because the manager's own experience sample flipped from uniform to mixed."
critical-questions:
  - "isn't this the same as lex-nx7u7 (base-rate-neglect)? No -- base-rate neglect is about ignoring a KNOWN prior frequency in favor of vivid specific evidence, a miscalculation. This atom concerns where the raw FELT SENSE of contingency comes from in the first place, prior to and independent of any explicit frequency reasoning."
  - "isn't this the same as lex-kgphf (a single exposure over-generalizing to broad avoidance)? No -- that atom involves ONE exposure producing an over-broad avoidance response. This atom typically requires a TWO-STATE history (mostly one outcome, plus at least one exception), and the resulting effect is not avoidance but a WAVERING between the two remembered alternatives."
  - "is the takeaway 'never trust your gut, always calculate the real odds'? Not quite -- the atom's diagnostic value is narrower: when a future event feels like a coin-flip, checking whether your own personal sample happens to be small and recently mixed, rather than assuming the feeling reflects some deep truth about the world's actual variability, can dissolve or recalibrate the unease without requiring blanket distrust of intuition."
  - "how does this relate to lex-dy6xw (necessity-mutes-emotional-charge, also minted from this Part)? They compose but answer different questions: this atom explains where the raw feeling that an outcome is contingent comes from in the first place; lex-dy6xw addresses what happens to an emotion's intensity once an outcome is reframed as necessary rather than contingent. This atom is upstream of the feeling; lex-dy6xw is what to do with it."
  - "isn't this the same territory as lex-2kjmb (organisms minimize surprise via free-energy)? No -- lex-2kjmb is a formal, general framework for how any adaptive system reduces prediction error through action or belief-updating. This atom is a specific, narrower psychological claim about one particular felt experience (contingency) and traces it to one particular cause (a small, recently-mixed personal exposure sample), not a general theory of prediction or adaptation."
severity-tier: info
