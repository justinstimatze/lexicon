    text: martin-1957-lack-of-confidence-lack-of-detachment-reinforce
    citation: "William Martin, \"Preferences for Types of Patients,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.201."
    quote: 'As we have seen, lack of confidence and lack of detachment seem to develop when students work with patients whom they define as uncooperative, that is, patients who do not conform to their expectations. Students may, on the one hand, come to doubt the adequacy of their ability to handle such patients. At the same time, they may feel some annoyance at patients whose behavior they consider deviant. Each of these reactions in turn, we have also seen, motivates students to avoid working with particular types of patients. Now it appears that when both reactions are present, they reinforce each other.'
