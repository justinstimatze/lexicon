lineage:
  - source: primary
    text: kautilya-arthashastra-small-revolt-outweighs-large-gain
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Planning a Campaign,' 'Revolts and Rebellions in the Rear,' {9.3.1-8}."
    quote: "'A small revolt in the rear outweighs a large gain in the front; for, when the king is not there, a small revolt in the rear may be worsened by the anger of the people or by traitors, enemies and jungle tribes. If this happens, a large gain in front, even if actually obtained, will be eaten up by the subjects, allies, losses and expenses. Therefore, a king shall not undertake a campaign when the gain in front is [less than] a thousand times the likely loss due to a revolt in the rear or, at best, a hundred times the loss. A well-known proverb is: Misfortunes are, [in the beginning] no longer than the point of a needle.'"
canonical-instances:
  - "A founder is offered a chance to spend six months chasing a major new market abroad while an unresolved co-founder dispute simmers at home; the founder declines despite the market's large potential size, reasoning that the dispute, left unattended and free to be worsened by disgruntled staff or a departing co-founder poaching talent, could destroy the company before the new market pays off at all."
  - "A manager postpones an ambitious cross-department initiative that would require weeks away from their own team, after noticing early signs of a morale problem that could spiral through gossip and departures if left unmanaged during that absence, judging that no plausible size of the initiative's payoff is worth risking a team that could unravel while unsupervised."
critical-questions:
  - "is a hundred-to-a-thousandfold threshold a genuine calibration or just rhetorical emphasis on caution -- how would a real decision-maker estimate either the size of the gain or the likely-worsened size of the left-behind risk precisely enough to apply a specific multiplier rather than a vague gut check?"
  - "does this rule risk permanent paralysis for anyone who always has some unresolved friction at home, since almost any base has traitors, disgruntled people, or rivals who could in principle exploit an absence -- at what point does 'some risk of trouble in the rear' stop being a reason to decline every large opportunity indefinitely?"
  - "does the compounding-in-absence mechanism actually depend on the specific channels named (traitors, enemies, jungle tribes) being present and capable, and does the rule overstate the risk in situations where the base genuinely has no such channels for a small problem to grow through?"
status: active
