id: lex-k2kdc
name: constitutive-defense-when-the-defense-generates-the-threat
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When the entity's defense mechanism is what defines its identity, removing the threat may dissolve the entity. Before recommending threat-removal, check whether the threatened thing is still coherent without the threat to organize against."
