id: lex-t2h77
name: a-deterrent-with-no-real-consequence-gets-learned-through-by-patient-probing
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A warning signal only deters as long as whoever hears it believes something bad will actually follow it -- and that belief can be tested and disproven through nothing more than patient, repeated probing. In Radin's Winnebago Trickster cycle, Trickster sets his own anus to guard his roasting meat while he sleeps: 'you, my younger brother, must keep watch for me while I go to sleep. If you notice any people, drive them off.' When foxes approach, the anus expels gas as its only defense -- 'Pooh!' -- and at first it works: 'Be careful! He must be awake.' But the foxes do not leave for good; they retreat and return, retreat and return, each time recalibrating: 'Well, I guess he is asleep now. That was only a bluff. He is always up to some tricks.' By the fourth approach the gas is expelled louder and more insistently than ever -- 'Pooh! Pooh! Pooh!' -- and it no longer matters at all: 'they did not run away. On the contrary, they now began to eat.' The signal never stopped firing; it simply stopped meaning anything, once its targets had enough data to know that firing was all it ever did. Diagnostic move: a deterrent that keeps sounding without ever imposing a real cost teaches its targets exactly one lesson through repetition -- that it is safe to ignore -- and no amount of increased volume or frequency substitutes for that missing cost."
