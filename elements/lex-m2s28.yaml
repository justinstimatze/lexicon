id: lex-m2s28
name: doubt-their-pluck-to-goad-self-destructive-imitation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you want someone to volunteer for something self-destructive that they'd resist if you simply asked them to do it, don't sell them on the benefit -- question whether they have the toughness to endure the cost, and let their own pride do the recruiting. In Cushing's telling, a Coyote fakes a demonstration of shattering his own legs with a stone to gain miraculous speed, and when the demon watching wants to try it too, the Coyote doesn't encourage him -- he warns him off in a way calculated to provoke the opposite response: 'I am afraid you won't have the pluck to go through with it.' The demon can't let that stand: 'Do you think I am a baby?... or a woman, that I should be afraid to pound my legs and arms?' The Coyote never has to argue for the benefit at all -- once the demon's pride is on the line, he demands to be allowed to shatter his own limbs, and does. The whole persuasion rests on a single move: state the cost, then cast doubt on whether the target can bear it, and let them override your reluctance rather than your enthusiasm. Diagnostic move: when someone is deciding whether to imitate a risky or costly action you've supposedly just taken yourself, watch for anyone who responds to your caution about the cost with a challenge to their own toughness -- that's the exact lever being pulled, and 'I only thought I'd warn you, go ahead if you want' is often the final push toward a decision they were talked into resisting less, not persuaded to want more."
