id: lex-zjmt6
name: replication-failure-tracking-a-known-structural-difference-validates-both-findings
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a finding fails to replicate in a second group, don't automatically treat the original finding as discredited — check first whether the second group differs from the first on some known, theoretically relevant structural feature, because if it does, the opposite finding in that group can be evidence FOR the same underlying causal mechanism rather than evidence against the original result. Merton, Reader, and Kendall build this modification directly into their replicative-consistency criterion: 'There is, of course, one type of situation where the criterion of replicative consistency must be modified. If two medical schools differ markedly in their organization or curriculum, then we should not expect to find that attitudes or preferences affected by these organizational features will be replicated from one school to the other.' Their worked example shows both findings being accepted as valid, not one overturning the other: 'in a school where students do not have substantial contact with patients until their third or fourth years, we may find that first-year students worry more about their performance in their medical studies than they do about their competence to deal with patients. In a second school, where first-year students have considerable contact with patients, we may find exactly the reverse — namely, that first-year students in this school worry more about their adequacy in dealing with patients than they do about their performance in their studies. Because this discrepancy can be related to significant differences in the organization of medical studies in the two schools, we consider both findings valid.' A second example applies the same logic to cohorts within one school: 'one entering class may contain a relatively large number of married students, while the class entering the next year contains relatively few. Under these conditions, we expect very different findings with regard to such matters as the way in which friendships are formed... and patterns of leisure-time activity.' The key distinguishing test is whether the opposite finding in the second group can be traced to a SPECIFIC, INDEPENDENTLY KNOWN structural difference (curriculum timing of patient contact; cohort composition by marital status) that offers a theoretically coherent reason for the mechanism to produce a different outcome there — this is categorically different from a replication simply failing for no identifiable reason, which would properly cast doubt on the original finding. When the moderating variable is named in advance (or independently confirmed after the fact) and the direction of its effect makes theoretical sense, a 'failed' replication becomes a demonstration that the underlying mechanism is context-dependent in a specified, explicable way, which is a stronger result than an unconditional replication would have been. Diagnostic move: before treating a non-replicating finding as disconfirming, check whether the two groups differ on some independently identifiable structural variable plausibly relevant to the mechanism in question — if such a variable exists and explains the direction of the discrepancy, report both findings as valid instances of a context-sensitive mechanism rather than concluding the original finding was spurious; if no such variable can be identified, the failure to replicate should count as genuine disconfirming evidence."
