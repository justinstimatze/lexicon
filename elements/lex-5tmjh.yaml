id: lex-5tmjh
name: private-devotion-does-not-produce-public-virtue
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "Intense devotion to close, private relationships does not by itself produce the cooperative virtues a wider social life requires, and the two can coexist with one fully present and the other largely absent. The causal direction actually runs the other way: broader social engagement cultivates private virtue. Private virtue does not radiate outward into social capacity on its own. Maximizing devotion to the inner circle is therefore not a path to the outer one. Gilman states the reversal directly: 'A noble home life is the product of a noble social life. The home does not produce the virtues needed in society. But society does produce the virtues needed in such homes as we desire to-day. The members of the freest, most highly civilized and individualized nations, make the most delightful members of the home and family.'"
related: []
evokes: [women-and-economics, chapter-x, the-home-does-not-produce-the-virtues-needed-in-society, society-does-produce-the-virtues-needed-in-such-homes, private-devotion-is-not-the-source-of-public-virtue]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-x
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter X. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "The exquisite development of modern home life is made possible only as an accompaniment and result of modern social life. If the reverse were true, as is popularly supposed, all nations that have homes would continue to evolve a noble civilization. But they do not. [...] A noble home life is the product of a noble social life. The home does not produce the virtues needed in society. But society does produce the virtues needed in such homes as we desire to-day. The members of the freest, most highly civilized and individualized nations, make the most delightful members of the home and family. The members of the closest and most highly venerated homes do not necessarily make the most delightful members of society."
canonical-instances:
  - "A tight-knit company culture with fierce internal loyalty and genuine care between colleagues doesn't automatically produce employees who deal fairly and cooperatively with outside vendors, competitors, or the public; those wider-facing virtues have to be cultivated through the company's actual engagement with the outside world, not assumed to flow outward from internal warmth."
  - "A close, insular friend group that takes exceptional care of its own members shows no corresponding tendency to treat strangers or outsiders with the same generosity, because the skills of extending trust and fairness beyond a known circle are trained by practicing them with strangers, not by deepening loyalty within the circle."
  - "An organization famous for how it treats its founding members can simultaneously be notorious for how it treats new hires, contractors, or the broader industry, because the private, in-group devotion and the public, out-group conduct are cultivated by entirely different kinds of practice."
critical-questions:
  - "Is the causal direction really one-way, from social engagement to private virtue, or can a demonstrably strong private virtue sometimes seed the confidence and skill that later generalizes outward, making the relationship bidirectional rather than strictly one-directional?"
  - "How would you rule out the possibility that a society with more of both public and private virtue simply has more resources, security, or leisure enabling both, rather than one causing the other -- could a third factor be driving both variables independently?"
  - "Gilman's claim rests on comparing whole nations -- does the same directional relationship hold at smaller scales, like a single family or a single company, or does the mechanism only operate reliably at the scale of an entire society's institutions?"
status: active
