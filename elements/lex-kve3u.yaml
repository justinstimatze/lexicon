    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 7, '\"Speechless Shame and Shameless Speech,\"' on the distinction between shame and guilt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "“Shame is what you are, guilt is what you do,” goes an old saying. Guilt can be undone with acts of penance, but the feeling of shame sticks around like a birthmark or the smell of cigarettes."
canonical-instances:
  - "A manager who missed a deadline apologizes and delivers the work late but complete, and the guilt genuinely resolves once the team sees the recovery; a manager who feels fundamentally incompetent apologizes and delivers the same recovery, and the shame persists unchanged, because the feeling was never about that specific deadline in the first place."
  - "A support group tells a recovering addict that admitting the specific harms caused to specific people and making amends will resolve his guilt over those acts, which it does, while his separate, deeper shame about being 'an addict' as an identity remains completely untouched by the same amends process, requiring an entirely different kind of work."
critical-questions:
  - "Is this distinction as clean in practice as it is in theory, given that a single situation (an affair, a firing, a public failure) typically generates both kinds of feeling simultaneously, making it hard to know in the moment which one is actually driving a person's distress?"
  - "Does framing shame as essentially unfixable by action risk becoming a self-fulfilling prescription -- if someone believes their shame can't be addressed through changed behavior, might that belief itself foreclose forms of healing (sustained changed behavior over time, not a single act of penance) that could in fact work?"
  - "Is the folk formula too tidy -- can guilt, in fact, also 'stick around' indefinitely despite genuine acts of penance, and can shame, in fact, sometimes fade through sustained different treatment from others, undermining the clean guilt-fixable/shame-unfixable split?"
