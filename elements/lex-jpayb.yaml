id: lex-jpayb
name: praising-well-is-not-the-same-as-praising-truly
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When composing or evaluating a speech, review, tribute, or piece of writing whose genre is praise (an encomium, a eulogy, a glowing recommendation, a product testimonial, a hagiographic profile), do not assume that speaking WELL within that genre is the same task as speaking TRULY about the thing being praised. Consider Socrates's diagnosis of Agathon's speech in the Symposium. Agathon has just delivered an extravagant, technically brilliant oration praising Love as the youngest, most beautiful, most virtuous, wisest of the gods, met with general applause. Socrates's critique does not dispute any particular claim in the speech; instead it exposes the genre convention Agathon (and every previous speaker) had silently followed: 'I imagined that the topics of praise should be true, and that this being presupposed, out of the true the speaker was to choose the best and set them forth in the best manner. And I felt quite proud, thinking that I knew the nature of true praise... Whereas I now see that the intention was to attribute to Love every species of greatness and glory, whether really belonging to him or not, without regard to truth or falsehood -- that was no matter; for the original proposal seems to have been not that each of you should really praise Love, but only that you should appear to praise him.' The diagnostic move is precise: true praise is a subset-selection operation (find what is actually true of the subject, then choose the best true things and present them well); the corrupted convention Socrates names is instead an accumulation operation (gather every attribute with positive valence -- fair, young, tender, wise, just, brave -- and attach it to the subject, indifferent to whether the subject actually has it). Both operations can produce equally polished, equally moving, equally well-received speech; the difference is invisible from the outside (the audience applauded Agathon) and is only exposed by asking, of each individual claim, whether it is true of THIS subject specifically, or would be said of any sufficiently favored subject. Portable beyond eulogy: a performance review, a grant recommendation letter, a product launch announcement, or a retrospective tribute can all be internally coherent, well-organized, and rhetorically effective while running on the accumulation operation rather than the selection operation -- praising a departing employee for 'strategic vision' or a product for being 'transformative' because those are the words the genre expects, not because a specific, checkable fact grounds the claim for this particular case. Diagnostic test: for any given praise-claim, ask whether removing the specific name/subject and inserting a different one of the same general category would make the sentence equally plausible to an uninformed listener -- if so, the claim is doing genre-work (signaling 'this is the kind of thing one says about a favored X') rather than truth-work (reporting something actually distinctive about this X). Scope: this is not a claim that praise is inherently dishonest, or that positive language about someone should be treated with suspicion by default -- Socrates explicitly distinguishes true praise (which selects among real, true attributes) from the corrupted convention, rather than rejecting praise as a genre; the atom names the specific failure mode of substituting appearance-of-praise for truth-tracking, not praise itself."
related: [lex-j5vdt, lex-c5j2s, lex-5mtky, lex-63e4c, lex-xu94g, lex-rjaeb]
scaffolds-from: [lex-xu94g, lex-63e4c, lex-j5vdt]
evokes: [gorginian-or-gorgonian-head, whether-really-belonging-to-him-or-not, promise-of-the-lips-and-not-of-the-mind, i-cannot-refute-you-socrates]
lineage:
  - source: primary
    text: plato-c385bce-symposium-socrates-critique-of-agathon
    citation: "Plato, Symposium 198a-199b (Jowett translation, Standard Ebooks Dialogues compilation). Socrates's response after Agathon's encomium of Love."
    quote: "For I was reminded of Gorgias, and at the end of his speech I fancied that Agathon was shaking at me the Gorginian or Gorgonian head of the great master of rhetoric... And then I perceived how foolish I had been in consenting to take my turn with you in praising love... For in my simplicity I imagined that the topics of praise should be true, and that this being presupposed, out of the true the speaker was to choose the best and set them forth in the best manner. And I felt quite proud, thinking that I knew the nature of true praise, and should speak well. Whereas I now see that the intention was to attribute to Love every species of greatness and glory, whether really belonging to him or not, without regard to truth or falsehood -- that was no matter; for the original proposal seems to have been not that each of you should really praise Love, but only that you should appear to praise him."
canonical-instances:
  - "The direct textual anchor: Agathon's polished, applauded encomium of Love turns out, on Socrates's diagnosis, to have attributed to Love every attractive quality available regardless of whether it actually belonged to Love -- optimized for appearing to praise well, not for being true."
  - "A glowing performance review praises a departing employee for 'strategic vision' and 'exceptional leadership' -- phrases the genre expects for any well-liked departing employee -- without any specific, checkable fact that distinguishes this employee's actual conduct from the generic template."
  - "A product launch announcement calls a new release 'transformative' and 'reimagined from the ground up,' language interchangeable with any competitor's launch copy, rather than naming the specific, verifiable thing that changed."
critical-questions:
  - "isn't this the same as lex-j5vdt (rhetoric-is-flattery-not-a-craft)? No -- lex-j5vdt (from Gorgias) is about rhetoric AS A WHOLE lacking a genuine target: it aims at producing pleasure/persuasion rather than at the good, structurally, regardless of genre. This atom is narrower and genre-specific: it diagnoses one particular convention within the epideictic (praise) genre specifically -- substituting positive-attribute-accumulation for truth-tracking -- and supplies a concrete test (the subject-swap test) for detecting it in an otherwise well-formed piece of praise."
  - "doesn't this make all praise suspect? No -- Socrates explicitly affirms that true praise exists and is a legitimate, different operation: selecting the best among a subject's actually-true attributes and presenting them well. The atom targets the specific corrupted convention, not the genre of praise itself."
  - "how do you actually test whether a piece of praise has fallen into this pattern? The atom supplies a concrete diagnostic: for each praise-claim, ask whether swapping in a different subject of the same general category would leave the sentence equally plausible to an uninformed listener. If yes, the claim is genre-signaling rather than truth-tracking."
  - "isn't this just 'flattery is bad,' i.e. generic cynicism about compliments? No -- the mechanism named is specific (accumulation-of-positive-valence-attributes regardless of truth, versus selection-among-true-attributes) and testable (the subject-swap diagnostic), not a blanket attitude of suspicion toward positive statements."
  - "how does this relate to lex-c5j2s (valid-reasoning-is-practically-inert-without-persuasive-eloquence)? That atom concerns the gap between having a sound argument and having a PERSUASIVE one -- eloquence as a separate, necessary ingredient for reasoning to move an audience. This atom concerns a specific way eloquence can go wrong within one genre (praise): producing persuasive, well-received language that has quietly stopped tracking truth about its subject. They are compatible and can co-occur, but diagnose different things -- one is about what makes reasoning move people, the other is about what makes praise stop being about its subject."
  - "isn't Agathon just bullshitting per lex-63e4c (bullshit-is-truth-indifference-not-truth-inversion)? The convention this atom names is a species of Frankfurtian truth-indifference, yes -- Socrates's phrase 'without regard to truth or falsehood' is close kin to Frankfurt's 'without bothering to take into account at all the question of accuracy.' But this atom is scoped narrower and adds two things lex-63e4c's general framework does not supply on its own: it is specific to the epideictic/praise genre rather than speech in general, and it supplies a genre-specific diagnostic (the subject-swap test) for detecting the pattern. It also names a different SOURCE of the truth-indifference -- lex-63e4c concerns an individual speaker's posture toward truth, whereas this atom's convention can produce truth-indifferent output even from a sincere, non-cynical speaker, because the genre's own social expectations (what a praise-speech is supposed to sound like) reward accumulation over selection independent of any individual speaker's relationship to truth."
  - "how does this differ from lex-xu94g (surface-appearance-cheap-to-produce-detaches-from-underlying-substance)? lex-xu94g is a signal-economics claim: cheap-to-produce surface signals decouple from costly-to-verify substance because low-substance actors profit from mimicking the presentation. This atom is not about the cost of faking a signal at all -- it is about a specific compositional error within one rhetorical genre (accumulating positive attributes instead of selecting among true ones), and the diagnostic it supplies (the subject-swap test) checks truth-specificity, not production-cost."
