id: lex-rv7za
name: relative-deprivation-is-neutral-between-self-blame-and-system-blame
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Relative deprivation theory explains WHY someone feels shortchanged (a comparison with a reference group came out unfavorably) but it does not by itself explain WHERE the person points the blame — and that second question is separate, underexplored, and arguably more consequential. Merton flags this fork explicitly, noting that one study's dependent variable was institutional evaluation, not self-evaluation, which 'introduces a problem, deserving attention which it has not yet received: do the two types of evaluations, self-appraisals and appraisals of institutional arrangements, involve similar mechanisms of reference group behavior? ... research is needed to discover the structure of those social situations which typically elicit self-evaluations or internalized judgments — for example, where comparison with the achievements of specified others leads to invidious self-depreciation, to a sense of personal inadequacy — and the structure of those situations which typically lead to evaluations of institutions or externalized judgments — for example, where comparison with others leads to a sense of institutional inadequacies, to the judgment that the social system militates against any close correspondence between individual merit and social reward.' He names the stakes directly: 'the sociological factors which lead men to consider their own, relatively low, social position as legitimate, as well as those which lead them to construe their position as a result of defective and possibly unjustified social arrangements clearly comprise a problem area of paramount theoretical and political importance. When are relatively slim life-chances taken by men as a normal and expectable state of affairs which they attribute to their own personal inadequacies and when are they regarded as the results of an arbitrary social system of mobility?' Use this to separate two questions that get conflated constantly: (1) is this person experiencing relative deprivation at all (a comparison came out unfavorably), and (2) given that they are, what determines whether the resulting feeling gets internalized as 'I am inadequate' or externalized as 'the system is unjust'? The first question is well-theorized; Merton is explicit that the second is not, and treating it as automatically settled by the first is exactly the gap he's naming."
