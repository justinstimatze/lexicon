lineage:
  - source: primary
    text: cushing-serpent-of-sea-father-distrusts-the-unclaimed-child
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Serpent of the Sea.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Come back! come back! Why do you make fools of yourselves? Do you suppose any mother would leave her own child in the waters of this or any other spring? There is something more of meaning than seems in all this.' ... 'I expected as much as this from the first report which you gave me. It was impossible, as I then said, that a woman should be so foolish as to leave her child playing even near the waters of the spring. But it is not impossible, it seems, that one should be so foolish as to take into her arms a child found as this one was.'"
canonical-instances:
  - "An employee who has been quietly violating a compliance policy finds an unexpected, unclaimed windfall, a forgotten expense credit, an unassigned bonus, access left open, appear right around the same activity, and rather than treating it as luck, a colleague recognizes that windfalls this convenient, this untraceable, and this perfectly timed are far more often bait or evidence of a setup than genuine good fortune."
  - "A person who has been trespassing on private land finds an apparently lost, valuable item sitting in plain sight in the exact spot they've been cutting through, and a more skeptical companion points out that genuinely lost valuables are rarely found untouched in a place people are known to pass through repeatedly -- the convenient timing and location are themselves reason for suspicion."
critical-questions:
  - "how does someone actually distinguish a genuine coincidence from a manufactured trap, when both would look identical from the perspective of the person who finds the object -- does the father's insight only work in hindsight, once the reader already knows the child is the Serpent?"
  - "does this pattern place unfair suspicion on genuine acts of compassion -- the maiden's instinct to rescue what she believed was an abandoned child was itself morally admirable, so is the lesson here that kindness itself needs to be more suspicious, or something narrower about specific circumstances?"
  - "the father recognized the danger immediately but chose to let events play out rather than physically intervening before his daughter took the child in -- does correctly diagnosing a trap in advance carry any obligation to act on that diagnosis before the harm occurs, or is naming the danger after the fact sufficient?"
