id: lex-2rn8r
name: provoke-a-false-premise-to-verify-embedded-knowledge
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern whenever you need to verify a claimed identity, authorship, or first-hand involvement, and a passive credential (a document, a badge, a physical mark, a claimed familiarity) is not conclusive enough — state a false premise about a fact that only the genuine party could have embedded, first-hand knowledge of, and read their spontaneous reaction rather than their claimed answer. Homer's Odyssey Book XXIII states this exactly. Twenty years after Odysseus's departure, Penelope still will not fully believe the ragged stranger before her is her husband, despite her son's impatience and her nurse's insistence on the more passive proof of a scar. Rather than ask him to prove himself, she sets a trap: 'Bestir thyself, / Dame Eurycleia, and make up with care / A bed without the chamber, which he framed / With his own hands; bear out the massive bed.' The narrator marks the intent directly: 'She spake to try her husband.' The order is false on its face — the bed cannot be moved, because Odysseus built it himself around a living olive tree, its trunk still rooted in the ground, worked into a bedpost and enclosed by a chamber built around it afterward. Only the actual builder could know this, and only the actual builder would react to 'move the bed' with the specific outrage of someone who knows the request is impossible: 'O woman, thou hast said unwelcome words. / Who hath displaced my bed?... it was I myself / Who shaped it, no one else... Now, O wife, I cannot know / Whether my bed remains as then it was, / Or whether someone from the root has hewn / The olive trunk, and moved it from its place.' Penelope herself names why this test, and not a simpler one, was necessary: 'my heart / Has ever trembled lest someone who comes / Into this isle should cozen me with words; / And they who practise fraud are numberless.' A claimed familiarity or a rehearsed answer to a direct question could be counterfeited by anyone who had gathered enough information; a spontaneous, specific, structurally-correct objection to a false premise about a private, self-constructed fact could not. The mechanism: don't ask the party to assert their knowledge — hand them a false statement built to be wrong in a way only true embedded knowledge would catch, and let their uninstructed reaction do the verifying. Portable beyond the marriage bed: a security-conscious team tests a colleague's claimed prior involvement in a project by casually misstating a decision they supposedly made ('so you're the one who chose Postgres for that service' when it was actually MySQL) and watching whether the correction is immediate, specific, and unprompted, versus vague or absent; a manager suspicious of a job candidate's claimed authorship of a codebase references a deliberately wrong detail about its architecture and gauges whether the candidate corrects it from memory or accepts it. Diagnostic: this differs from ordinary lie-detection or cross-examination in that the false premise is not an accusation to be defended against — it is a factual claim about the domain, stated as if settled, that only genuine first-hand construction-knowledge would recognize as wrong; a rehearsed impostor prepares to defend claims about themselves, not to correct incidental factual errors about an object they did not actually build."
related: [lex-2bbqf, lex-9cuew]
evokes: [penelopes-bed-test, the-bed-rooted-in-the-olive-tree, she-spake-to-try-her-husband, who-hath-displaced-my-bed, unfakeable-embedded-knowledge, provoked-verification]
lineage:
  - source: primary
    text: homer-odyssey-book-xxiii-penelopes-bed-test
    citation: "Homer, Odyssey, Book XXIII ('Ulysses and Penelope After the Slaughter'), trans. William Cullen Bryant (Boston: James R. Osgood and Company, 1871; PD — Bryant died 1878 — Standard Ebooks PD edition). Penelope, still doubting the disguised Odysseus's identity despite the suitors' slaughter and Eurycleia's scar-based testimony, orders the immovable, self-built marriage bed carried outside; Odysseus's outraged, structurally-correct objection — describing in specific detail how he built the bed around a living olive tree — is what finally proves his identity to her."
    quote: "[Narration:] 'She spake to try her husband.' [Penelope's order:] 'Bestir thyself, / Dame Eurycleia, and make up with care / A bed without the chamber, which he framed / With his own hands; bear out the massive bed.' [Ulysses' reply:] 'O woman, thou hast said unwelcome words. / Who hath displaced my bed?... it was I myself / Who shaped it, no one else... I stretched / Upon it thongs of oxhide brightly dyed / In purple. Now, O wife, I cannot know / Whether my bed remains as then it was, / Or whether someone from the root has hewn / The olive trunk, and moved it from its place.' [Penelope's own account of her method:] 'my heart / Has ever trembled lest someone who comes / Into this isle should cozen me with words; / And they who practise fraud are numberless... since thou, by tokens clear and true, / Hast spoken of our bed, which human eye / Has never seen save mine and thine... thou hast won my mind / To full belief, though hard it was to win.'"
canonical-instances:
  - "The direct textual anchor: Penelope orders the immovable marriage bed carried outside, a false premise on its face; Odysseus's specific, structurally-correct outrage at the impossible request proves his identity where physical tokens and claimed familiarity had not sufficed."
  - "A security-conscious team tests a colleague's claimed prior involvement in a project by casually misstating a technical decision they supposedly made, watching whether the correction is immediate and specific or vague and absent."
  - "A hiring manager suspicious of a candidate's claimed authorship of a codebase references a deliberately wrong architectural detail and gauges whether the candidate corrects it from memory or accepts the false premise."
critical-questions:
  - "isn't this the same as lex-2bbqf (the Noman/Polyphemus deception, also Book IX of the Odyssey)? No — lex-2bbqf is a deception mechanism: a false self-identifier is planted in advance so that a victim's later, entirely truthful report fails to summon help. This atom is a verification mechanism aimed at the opposite goal: confirming a TRUE identity by eliciting a reaction only the genuine party could give. Both exploit gaps between a stated claim and the ground truth it references, but one manufactures a false identity to escape detection, the other manufactures a false premise to force detection of the true one."
  - "isn't this the same as lex-9cuew (Penelope's web, also her stratagem)? No — lex-9cuew is a stalling technique: an observable-but-secretly-undone task (weaving by day, unravelling by night) buys time by decoupling apparent progress from actual completion. This atom is a one-shot verification test with no ongoing deception on Penelope's part — she states one false claim and reads one reaction. They share a protagonist and a general theme of Penelope's resourcefulness under uncertainty, but operate on entirely different axes: stalling vs. verifying, sustained vs. instantaneous, self-directed concealment vs. eliciting another's reaction."
  - "how does this differ from simply asking someone to prove their identity or recall a shared memory? Asking a direct question invites a prepared or reconstructed answer, which a sufficiently informed impostor could approximate. Stating a false premise as settled fact requires the respondent to notice, unprompted, that it conflicts with knowledge they could only have if their claimed relationship to the fact is genuine — the objection has to be generated, not retrieved, which is much harder to counterfeit."
  - "what makes a false premise suitable for this test, versus one that would produce false negatives? The premise must reference a fact whose correct version is known ONLY through the specific first-hand involvement being verified (here: how and why the bed cannot be moved, knowable only to its builder) — a premise touching on public or inferable information will not discriminate, since a well-informed outsider could react correctly by luck or research rather than genuine embedded knowledge."
