id: lex-6bycb
name: necessity-and-sufficiency-of-evidence-classify-process-tracing-tests
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When designing a process-tracing test, ask: is passing NECESSARY (failing rules out) or SUFFICIENT (passing rules in)? Hoop tests are necessary-not-sufficient; smoking-gun tests are sufficient-not-necessary. Doubly-decisive tests are both. Pick the test to the diagnostic shape."
related: [lex-ftke9, lex-2cjtz, lex-vk65z, lex-v6nqz, lex-qkrey, lex-8j5ms, lex-8f8jk, lex-rax8z, lex-gg87u, lex-bj7ak, lex-nx898]
