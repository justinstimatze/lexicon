evokes: [radin-winnebago-hare-cycle, hare-and-the-woodtick, the-little-hare-is-hiding, this-is-the-one-that-was-always-telling-me]
lineage:
  - source: primary
    text: radin-a-woodtick-in-hares-ear-betrays-every-hiding-place
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 18. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "One day as Hare was ambling along again he heard some people shout at him, 'Look, there is a little Hare!' So Hare ran away to seek shelter in a thicket. But again they said, 'Little Hare has run into a thicket.' So Hare ran away again and hid under a log. But again they said, 'The little Hare is hiding under a log.' Hare, then, ran away again and went into a hole in the ground. But they again called out, 'The little Hare ran into a hole in the ground so give chase to him.' Hare then ran up a hollow tree but they said again, 'The Hare has gone up a hollow tree.' Finally Hare ran away until he came to a lodge where someone from within spoke to him, 'Grandson, come in!' So he went in and there he found an old man with his head bandaged up. 'It was I who caused you to come here for I want you to do something for me. This, grandson, is what brought you here,' and he took a woodtick from Hare's ears. 'This is the one that was always telling me where you were going whenever you tried to hide, so how could you ever have succeeded?'"
canonical-instances:
  - "A fugitive keeps changing safe houses, routes, and disguises, and is located within hours every single time, until an ally discovers the fugitive's own phone, carried the entire time out of habit, has been broadcasting location data regardless of which safe house or route was chosen."
  - "A company keeps losing every competitive bid to the same rival no matter how it varies its pricing strategy or sales pitch, until an internal audit discovers a shared vendor has been leaking the company's bid details to the rival before every single submission."
critical-questions:
  - "Would Hare have found the woodtick himself eventually, or does the story suggest that a leak this close to the body, in his own ear, is specifically the kind of thing a person cannot discover through their own effort and needs an outside party to find?"
  - "Does the fact that the old man already knew about the woodtick suggest he had some relationship to the pursuers or the informant himself, and does that change whether this is a story about detection or about who controls the flow of information in the first place?"
  - "Is there a meaningful difference between a literal physical informant like the woodtick and a metaphorical one, a habit, a shared account, a routine, and does the diagnostic of 'stop varying the strategy and check what travels with you' apply equally well to both?"
status: active
