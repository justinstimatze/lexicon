name: persistent-return-despite-rejection-triggers-a-second-look
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you're rejected on first appearance and don't fit the category the other party assumes you belong to, repeating the same approach rather than giving up can be what eventually gets your actual situation investigated -- not because persistence itself is persuasive, but because it becomes strange enough to demand an explanation. In Cushing's telling, a hunter cursed into coyote form is thrown bodily out of the Badgers' home twice, each time mistaken for nothing more than an ordinary, unwelcome scavenger. He has no way to explain himself in that form -- all he can do is keep returning. It's the sheer oddity of the repetition that finally makes the Badgers pause: 'It is marvellously strange that this Coyote, the miserable fellow, should insist on coming back, and coming back.' That strangeness is what prompts the old Badger-woman to recall a rumor and reconsider: 'It may be he. Let us see when he comes again if it be he.' The third return, identical to the first two, gets an entirely different reception -- not because it was more convincing, but because the pattern itself had become the evidence that something didn't fit the ordinary case. Diagnostic move: when you're being turned away because you're being read as an unremarkable instance of some dismissible category, and you have no way to explain otherwise in the moment, consider that simply persisting in the same, otherwise-ordinary approach can eventually make your case for you -- ordinary things don't usually behave this abnormally, and that mismatch is sometimes the only signal available to prompt someone to actually look closer."
