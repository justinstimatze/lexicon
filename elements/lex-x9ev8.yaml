name: eliminating-a-victim-can-be-about-suppressing-word-not-punishing-them
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a predator disposes of a victim who has nothing left to take, the motive often isn't cruelty or reward, it's information control -- a single survivor going home and warning others is the one thing that could end the whole scheme's future supply of victims. In Cushing's telling, a master gamester strips a young man of everything, piece by piece, down to his own body, until the man surrenders utterly: 'Do with me as thou wilt. I am thy slave.' At that point there's nothing left to win from him. Yet 'old Mitsina with the same devil-may-care manner would catch him up, take him out to the back of his house and wring his neck that he might not go back and report his losses to his people.' The killing produces no further winnings; its entire function is named in the same sentence as the reason, preventing a report that would warn the next young man away before he ever climbed the ladder. Diagnostic move: when you see a scheme that eliminates every person who reaches its worst outcome rather than merely taking what it can from them, look for what a survivor's testimony would cost the scheme's future operation -- the elimination is often priced not against that one victim's remaining value, but against the entire future pipeline of victims their story would warn away."
