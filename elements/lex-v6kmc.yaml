id: lex-v6kmc
name: dichotomy-of-control
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When in distress about an outcome, sort what's IN your control from what's outside it. Spend agency on the controllable; spend equanimity on the rest. The dichotomy is operationally productive even when philosophically contested."
related: [lex-k6d7u, lex-th6tr, lex-2zyhy, lex-j5kxw, lex-mjav2, lex-75vrt, lex-2unt7, lex-juc5s, lex-9t2ux, lex-jbegr, lex-srj3h, lex-d6vbs, lex-ykb5a, lex-efv3v, lex-m8j35, lex-7xz6k, lex-sxsn7, lex-bdkgh, lex-da3ps, lex-ke8xx, lex-sdc6x, lex-7w239, lex-dy6xw, lex-ydwzz]
scaffolds-from: [lex-da3ps, lex-sdc6x]
evokes: [things-in-our-power-vs-things-not-in-our-power, the-stoic-fork, what-depends-on-me-and-what-doesnt, the-locus-of-equanimity, bind-affect-to-the-controllable]
lineage:
  - source: primary
    text: marcus-aurelius-meditations-c170-180-ce
    citation: "Marcus Aurelius, Meditations (composed in Greek c. 170-180 CE during the Marcomannic Wars; first printed edition Xylander 1559). (George Long 1862 translation, Standard Ebooks edition).: the dichotomy-of-control schema runs continuously through the Meditations — what is in our power (judgment, intent, the ruling faculty) vs what is not (body, fame, others' actions, events). Aurelius doesn't formulate it as systematically as Epictetus (whom he read; cf. 1.7, 4.41 'Thou art a little soul bearing about a corpse, as Epictetus used to say'), but instantiates it constantly. The canonical formulation is Epictetus Enchiridion §1 (2nd c. CE): 'Some things are in our power and others are not. In our power are opinion, movement towards a thing, desire, aversion; in a word, whatever are our own acts. Not in our power are the body, property, reputation, offices, and in a word, whatever are not our own acts.' The pair Aurelius+Epictetus provides cross-source attestation within primary tradition (Aurelius; Epictetus Enchiridion canonical Greek text widely available in dozens of stable English translations 1758-present)."
    quote: "[Aurelius, Meditations Book V.19, Long trans., Standard Ebooks edition:] 'Things themselves touch not the soul, not in the least degree; nor have they admission to the soul, nor can they turn or move the soul: but the soul turns and moves itself alone, and whatever judgements it may think proper to make, such it makes for itself the things which present themselves to it.' [Book VI.41:] 'Whatever of the things which are not within thy power thou shalt suppose to be good for thee or evil, it must of necessity be that, if such a bad thing befall thee or the loss of such a good thing, thou wilt blame the gods, and hate men too, those who are the cause of the misfortune or the loss... But if we judge only those things which are in our power to be good or bad, there remains no reason either for finding fault with God or standing in a hostile attitude to man.' [Book VIII.47:] 'If thou art pained by any external thing, it is not this thing that disturbs thee, but thy own judgement about it. And it is in thy power to wipe out this judgement now.' [Book IX.13:] 'Today I have got out of all trouble, or rather I have cast out all trouble, for it was not outside, but within and in my opinions.' [The schema is recursive across the Meditations: every appearance of a disturbance is addressed by relocating the disturbance from the external thing to the internal judgment, where it can be acted upon.]"
  - source: practitioner
    text: epictetus-enchiridion-c125-ce
    citation: "Epictetus, *Discourses* (c. 108 CE; recorded by Arrian; 4 books extant of original 8), George Long 1877 translation. (Standard Ebooks PD edition). The Discourses is the source from which Arrian compiled the Enchiridion §1 formulation; Discourses I.7 gives the canonical statement of the dichotomy in Epictetus's own teaching voice. The Aurelius + Epictetus pair now BOTH refs-grounded provides full Stoic-tradition primary attestation for the schema."
    quote: "[Epictetus *Discourses* I.7, Long trans.:] 'Education is the learning how to adapt the natural precognitions to the particular things conformably to nature; and then to distinguish that of things some are in our power, but others are not: in our power are will and all acts which depend on the will; things not in our power are the body, the parts of the body, possessions, parents, brothers, children, country, and generally all with whom we live in society.' [And from Discourses I.1, on operational use:] 'When the weather is not fit for sailing, we sit down and torment ourselves, and continually look out to see what wind is blowing. It is north. What is that to us? When will the west wind blow? When it shall choose, my good man, or when it shall please Aeolus; for God has not made you the manager of the winds, but Aeolus... We must make the best use that we can of the things which are in our power, and use the rest according to their nature.' [The Discourses formulation predates and is the source of the Enchiridion §1 paraphrase. Aurelius assumes this schema; Epictetus articulates it explicitly. Both now refs-grounded.]"
  - source: practitioner
    text: cbt-cognitive-behavioral-therapy
    citation: "The cognitive lineage of CBT (Ellis 1957 REBT; Beck 1976 cognitive therapy) explicitly cites Epictetus / Stoicism as foundational. The CBT mechanism — the disturbance is in the appraisal of the event, not the event itself — IS the dichotomy-of-control in clinical-empirical form. Tier-3 deepening source: Ellis 1957/1962, Beck 1976, both in stable continuous-print and cross-cited across thousands of clinical-outcome studies (Hofmann et al. 2012 meta-analysis showing CBT efficacy across 269 controlled trials)."
    quote: "[Tier-3 deepening — CBT instantiates the Stoic dichotomy: the 'A-B-C' schema (Activating event → Belief about event → Consequent affect) targets the B-step, which is exactly where Aurelius and Epictetus locate the locus of intervention. The contemporary clinical-empirical evidence base validates the Stoic claim that the locus of effective action is the judgment, not the event.]"
canonical-instances:
  - "professional setback: a layoff is not in your power; your interpretation (am I worthless? is this an opportunity? what is the next move?) is. Equanimity is the discipline of binding your affective state to the second category, not the first. Stoics do not deny the loss is real; they deny that the loss is what is doing the damage to your soul (it is your judgment about the loss)"
  - "running an organization: a colleague's choice to leave, an executive's choice to deprioritize your project, a market shift — none in your power. Your preparation, your decisions, your stance toward what happens — in your power. Effective leaders typically operate the dichotomy unconsciously; explicit Stoic framing makes it teachable. The discipline is to invest care proportional to the controllability"
  - "engineering review: a critique of your code is not in your power (the reviewer will write what they write); your response (defensive vs curious, what to fix vs what to push back on, how to learn from it) is. Engineers who suffer code review have typically not made this division; the ones who learn from it routinely have"
  - "the practical question 'where should I direct my effort?' is solved by the dichotomy: spend effort on the controllable; spend acceptance on the uncontrollable. Wasting effort on the uncontrollable produces frustration, helplessness, the appearance of moral failure when in fact it was a category-error"
  - "compositional with lex-mjav2 discipline-of-assent: the dichotomy is the SCHEMA (what is mine); discipline-of-assent is the PROCEDURE (when an impression arrives, refuse the automatic embellishment). The pair are the two halves of the Stoic toolkit — the map (lex-v6kmc) and the operation on the map (lex-mjav2). Aurelius and Epictetus both treat them together"
  - "compositional with lex-juc5s obstacle-becomes-the-way: when an obstacle (not in your power) arrives, the dichotomy classifies it as not-yours-to-control; lex-juc5s then names the move of converting the obstacle into material for an action you CAN take. The dichotomy without lex-juc5s risks passive resignation; lex-juc5s without the dichotomy risks misallocating effort to the uncontrollable"
  - "operationally distinct from lex-2zyhy optionality: optionality is about ASYMMETRIC PAYOFFS (Taleb); the dichotomy is about LOCUS OF AGENCY. They can co-fire (optionality strategies tell you WHICH controllable actions to invest in) but the mechanisms are distinct"
  - "operationally distinct from lex-th6tr: robustness is a property of choices ('this choice survives many futures'); the dichotomy is a property of the chooser's stance ('what is mine to choose at all'). lex-th6tr helps within-the-controllable; lex-v6kmc demarcates the controllable from the rest"
critical-questions:
  - "the crisp-vs-fuzzy boundary: is the dichotomy treated as crisp or as a fuzzy heuristic? Epictetus / Aurelius treat it as crisp; contemporary readers often push back that many things are PARTIALLY in our power (health, relationships, career). The Stoic reply is operational: even partially-controllable outcomes are not 100% controllable, so the controllable ASPECT is the part to invest in; the uncontrollable aspect is to be accepted. Practitioner-discipline: when a thing is partially controllable, decompose into the controllable-aspect and the uncontrollable-aspect rather than treating the whole as one"
  - "the passivity-quietism risk: does this primitive risk passivity in the face of injustice? Epictetus and Aurelius both reject this — they were active in their lives (Aurelius governed an empire; Epictetus taught a school). The dichotomy is not 'don't try to change the world'; it is 'attach your equanimity to what is yours to control, while you act on the world.' Stockdale 1995 named the same distinction — 'never confuse faith that you will prevail in the end with the discipline to confront the most brutal facts of your current reality.' Practitioner-question: am I using the dichotomy as a license for non-action, or as an organizing-frame for effective action?"
  - "the effort-allocation test: are you spending effort proportional to controllability? Wasting effort on the uncontrollable (the colleague's decision; the market shift; the weather) produces frustration, helplessness, the appearance of moral failure when in fact it was a category-error. Practitioner-discipline: when you find yourself frustrated, ask whether the frustration is attached to a controllable that effort would help or an uncontrollable that acceptance would handle"
  - "the discrimination-from-learned-helplessness check: the dichotomy can be misapplied to genuinely-controllable situations to license learned-helplessness. The trained learned-helplessness response is to misclassify controllables as uncontrollables (Seligman's dog-shock experiments). Practitioner-question: am I correctly classifying this as uncontrollable, or am I post-hoc rationalizing a controllable I'd prefer to abandon? The check: would a thoughtful outside observer agree with my classification?"
status: active
