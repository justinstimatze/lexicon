lineage:
  - source: primary
    text: homer-iliad-book-ix-embassy-rejected-gifts
    citation: "Homer, Iliad, Book IX ('The Embassy to Achilles'), trans. William Cullen Bryant (Boston: James R. Osgood and Company, 1870; the Bryant translation is PD — Bryant died 1878 — Standard Ebooks PD edition). Book IX dramatizes Agamemnon's attempted reconciliation with Achilles after publicly seizing his prize Briseis in Book I: Agamemnon, via the embassy of Ulysses, Ajax, and Phoenix, offers an inventory of restitution — seven untouched tripods, six talents of gold, twenty cauldrons, twelve prize-winning horses, seven skilled women, the return of Briseis herself sworn untouched, and, contingent on Troy's fall, a choice among Agamemnon's daughters in marriage with seven cities as dowry. Achilles refuses the entire offer, stating explicitly that no quantity of goods could move him."
    quote: "[Odysseus relays Agamemnon's offer, Iliad IX:] 'Seven tripods which the fire / Hath never touched; six talents of pure gold; / And twenty shining cauldrons; and twelve steeds / Of hardy frame, victorious in the race... Seven faultless women, skilled in household arts, / He offers... and with them he will send / Her whom he took away — Briseis, pure — / He swears it with a mighty oath — as pure / As when she left thy tent.' [Achilles' answer:] 'I hate his gifts; I hold / In utter scorn the giver. Were his gifts / Tenfold — nay, twenty-fold — the worth of all / That he possesses, and with added wealth / From others — all the riches that flow in / Upon Orchomenus, or Thebes, the pride / Of Egypt, where large treasures are laid up... not even then shall Atreus' son / Persuade me, till I reap a just revenge / For his foul contumelies.'"
canonical-instances:
  - "The direct textual anchor: Agamemnon offers Achilles an inventory of lavish restitution — tripods, gold, horses, skilled women, the return of Briseis herself, marriage to a daughter with seven cities as dowry — and Achilles refuses all of it, stating that no multiple of the offer could satisfy him, because the injury was never a debt of goods."
  - "An employee publicly overruled and humiliated in a meeting is later offered a raise with no acknowledgment of what happened; accepting it silently can feel like being paid to pretend the humiliation didn't occur."
  - "A betrayed business partner is offered a larger ownership stake in place of an apology or restored decision-rights — the equity doesn't touch what was actually damaged."
  - "A company facing a public scandal offers an injured party a large confidential settlement; the injured party insists on a public trial instead, specifically because a settlement buys silence where what is sought is acknowledgment."
  - "A further attestation within the same epic (Book XXII): the dying Hector begs Achilles by his knees to accept ransom in exchange for returning his body to Troy for burial. Achilles refuses categorically — 'not though thy Trojan friends should bring to me tenfold and twenty-fold the offered gifts... not though Priam... should send thy weight in gold' — because the grief for Patroclus, like the earlier violation of Achilles' own standing, is not a debt payable in goods at any multiple."
critical-questions:
  - "isn't this just Mauss's gift-obligation triad (lex-urh87 / lex-fy5k5) — and doesn't refusing a gift count as an aggressive move under that frame ('refusal equals declaring war')? Not quite. Mauss's triad describes the ordinary case where a gift, once offered, binds giver and receiver via give-receive-reciprocate, and refusing it IS read as an escalation between parties who are otherwise still in a relationship. This atom names the case where the injury is severe enough that the wronged party judges declaring war (via refusal) preferable to accepting a settlement that ratifies the violation as ordinary business. They compose: in less severe injuries, refusing a conciliatory gift reads as Maussian escalation; this atom names the specific threshold past which refusal becomes the wronged party's only remaining leverage rather than an aggressive overreach."
  - "isn't this the same as lex-pd9p6 recognition-asymmetry-undermines-recognized-position (Hegel)? No. lex-pd9p6 names a structural impossibility — a master's need for recognition can never be satisfied by a slave's coerced recognition, because coerced recognition isn't real recognition; no repair is available even in principle. This atom names a specific REJECTED REPAIR ATTEMPT: the offending party does try to offer something, sincerely and at real cost, and the wronged party still rejects it — not because recognition is structurally impossible here, but because the currency offered (goods) doesn't match the currency the injury damaged (public standing). Compositional: this atom supplies the diagnostic for telling whether an attempted repair used the right currency; lex-pd9p6 names the harder case where no currency would work because the relationship's structure itself precludes real recognition."
  - "is this just 'money can't buy happiness,' or a claim that Achilles is indifferent to wealth? No — Achilles cares intensely about material spoil and status-goods elsewhere in the poem (Book I laments the loss of Briseis partly as his fair share of plunder; he later itemizes his own war-winnings at length). This isn't asceticism. The claim is narrower: goods are the wrong currency for THIS specific injury, offered in THIS transactional structure, at THIS moment — not that goods are worthless to him in general."
  - "how would you diagnose in advance whether an offered remedy will be rejected, rather than only after the fact? Identify what currency the injury actually damaged — ask what the violation DEMONSTRATED, not just what it cost. If the violation demonstrated an asymmetry of power or standing, the remedy needs to visibly reverse or acknowledge that demonstration (public apology, restored decision-rights, structural change); a remedy that only moves goods, however large, leaves the power-demonstration unaddressed and predictably invites refusal or grudging, resentment-laden acceptance."
