id: lex-ayx4e
name: when-forced-to-choose-keep-the-generalizable-trait-release-the-narrow-one
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you can only keep one of two valuable people or resources and must give up the other, don't default to keeping whichever one currently performs best on the task in front of you -- Kautilya works through three successive paired trade-offs for choosing which son to keep and which to send away as a hostage, and across all three the deciding factor is which trait generalizes further, not which one currently measures highest. First: 'When there is a choice between a legitimate but less wise son and an illegitimate wise son, it is better to give the illegitimate one, though he may have better judgment. For, a legitimate son commands loyalty and can improve his judgment by associating with [and listening to the advice of] elders.' Legitimacy is a structural asset no amount of training can manufacture in the illegitimate son, while the legitimate son's wisdom deficit is a trainable gap that mentorship can close -- so the untrainable asset gets kept and the trainable deficit gets tolerated. Second: 'When there is a choice between a wise son and a brave son, it is better to give the brave son, who, though valorous, lacks wisdom. For, a wise son, though timid, uses his intelligence in his endeavours; like the hunter outwitting the elephant, the intelligent outwit the brave.' Wisdom is named as generalizing even against a raw-strength advantage -- a hunter's cunning defeats an elephant's power -- so it outranks bravery, which wins only within its narrower domain of direct physical confrontation. Third: 'When there is choice between a brave son and one who is expert in the use of arms, it is better to give the expert son who, though trained in weapons, may not fight as bravely. For a brave son, even if he be not expert in the use of weapons, will fight better due to his steadfastness, quick thinking and alertness.' Here bravery itself is reframed as a bundle of adaptive qualities -- steadfastness, quick thinking, alertness -- that outperforms a narrowly drilled technical skill once conditions depart from what the training anticipated. The pattern across all three: wisdom beats bravery, bravery (as adaptive steadfastness) beats narrow technical expertise, and an unearnable structural asset beats a merely-currently-superior trainable one -- the ranking runs from most-generalizable to most-narrowly-specific, and the resource to keep is always the one further up that ranking, regardless of which one is winning on the immediate, visible metric. Diagnostic move: when you must retain one of two valuable people or capabilities and release the other, don't default to whoever currently scores highest on the task at hand -- ask which one's strength would still hold up if the situation changed in ways you can't fully anticipate, and which deficit is actually fixable through later development versus structurally permanent, then keep the more generalizable, more nearly irreplaceable asset even if it currently trails on the narrower measure."
