id: lex-t66mm
name: a-hollow-source-of-joy-can-still-trap-you
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "The desire to join in on what sounds like a large, joyous, ongoing celebration can carry you past the point of ever checking what's actually making the noise -- and even after the source turns out to be nothing, the same desire to belong can still pull you into it anyway, at real cost. In Radin's Winnebago Trickster cycle, Trickster hears distant drumming and shouting and, driven purely by wanting in, runs toward it: 'I have not had any fun for a long time. Whatever they are doing, I will join them.' What he finds is not a crowd at all: 'he saw an object that turned out, on closer inspection, to be an elk's skull... The head was filled with many flies. ... They would go inside and then, when they rushed out, they made the noise that he had heard and which he had taken to be shouting.' Learning the celebration is only flies in a dead skull does not end his desire to participate; if anything it sharpens it, because he still envies what looks like their fun: 'Younger brothers, you are certainly having a lot of fun... I would very much like to be like one of you. How can I do it?' He follows their instructions to enter, and the moment he commits, the flies flee and the opening closes: 'All the flies ran away and the opening into which he had thrust his head became small again. Thus he was held fast.' Diagnostic move: when you're pulled toward a distant sound of collective joy, separate two questions that usually arrive fused together -- what is actually making that sound, and whether joining it, once you know, is still something you want. Discovering the source is hollow doesn't automatically extinguish the pull to belong to it."
