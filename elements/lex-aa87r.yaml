id: lex-aa87r
name: publicly-questioning-an-authoritys-existence-provokes-intervention
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a plea addressed directly to a powerful, normally-responsive authority goes unanswered, switching from request to public taunt — loudly questioning whether the authority exists, is present, or is even alive — can provoke the response the direct plea failed to get. The taunt works by putting the authority's own standing on trial in front of an audience, rather than asking a favor of them; an authority that would ignore a request may still act to avoid appearing absent or powerless. In the Jataka's tale, the fairy Canda's wife, unable to revive her poisoned husband by any means she has, does not pray to the god Sakka — she taunts him: \"Are there none who govern the world? are they on a journey? or peradventure they are dead, and therefore save not my dear husband!\" Sakka's throne grows hot from the force of her pain, he investigates the cause, and comes to heal Canda personally. The same shape appears in the taunt Elijah directs at the silent prophets of Baal in 1 Kings 18:27, needled at length in the same spirit — mocking the god's plausible absence (busy, traveling, asleep) rather than pleading with him to appear."
