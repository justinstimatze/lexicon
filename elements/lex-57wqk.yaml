id: lex-57wqk
name: costly-false-belief-is-a-harder-to-fake-trust-signal
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When evaluating why a community sustains a materially costly commitment to something demonstrably false or empirically unsupportable, don't assume the costliness is incidental to the belief or a sign of irrationality to be explained away. Atran's claim: religion is a community's costly and hard-to-fake commitment to a counterfactual and counterintuitive world, and the cost is doing real work — believing (and materially demonstrating belief in) something false is HARDER to fake than believing something true, because a rational actor has no independent incentive to maintain a costly false belief unless the commitment itself, not the belief's truth-value, is the point. This makes costly commitment to a false or counterintuitive claim a stronger group-trust signal than the same cost spent on something true or useful would be — a true, useful belief could be adopted for its own instrumental payoff, muddying what the cost actually signals; a costly commitment with no instrumental payoff signals nothing except the commitment itself."
related: [lex-5kjya, lex-uyx42, lex-pvpag]
evokes: [hard-to-fake-signal, costly-commitment-to-falsity, existential-anxiety-management, supernatural-agent-as-witness, religion-as-group-trust-mechanism]
lineage:
  - source: primary
    text: atran-2002-in-gods-we-trust
    citation: "Scott Atran, In Gods We Trust: The Evolutionary Landscape of Religion (Oxford University Press, 2002)."
    quote: "'Religion is (1) a community's costly and hard-to-fake commitment (2) to a counterfactual and counterintuitive world of supernatural agents (3) who master people's existential anxieties, such as death and deception. All known human societies, past and present, bear the very substantial costs of religion's material, emotional, and cognitive commitments to factually impossible worlds.' [on the signaling logic:] 'Everybody, whether they are religious or not, implicitly knows that religion is costly, counterfactual, and even counterintuitive. The more one accepts what is materially false to be really true, and the more one spends material resources in displays of such acceptance, the more others consider one's faith deep and one's commitment sincere.'"
canonical-instances:
  - "Costly ritual sacrifice (Atran's own framing): a community that visibly destroys resources — food, time, sometimes life — on behalf of a claim with no verifiable payoff signals commitment more credibly than the same resources spent on a claim that might independently pay off anyway. If the belief were true and useful, adopting it wouldn't distinguish the sincere believer from the merely self-interested one; because it's costly and unverifiable, sustaining it separates the two."
  - "Kierkegaard's 'leap of faith' read structurally rather than theologically (Atran cites Kierkegaard's Abraham-and-Isaac case): the demand that faith be 'absurd' and incommensurable with ordinary calculation is, functionally, a demand that the commitment be resistant to being explained by any ordinary incentive — which is exactly what makes it legible as a hard-to-fake signal to observers."
  - "Non-religious analogs: a costly, materially unrewarded commitment to an organization's stated values (working unpaid overtime for a cause with no career payoff, publicly holding an unpopular position with real social cost) functions the same way — the absence of an independent incentive to bear the cost is what makes the commitment legible as sincere to onlookers, regardless of whether the underlying claim is religious."
  - "operationally distinct from lex-5kjya costly-conspicuous-waste-as-status-signal (Veblen): Veblen's mechanism signals INDIVIDUAL capacity/quality via visible waste of a real, possessed resource (leisure, wealth) to a general audience, establishing relative status. This atom's mechanism signals GROUP-DIRECTED commitment specifically via sustained acceptance of a claim that is FALSE or COUNTERINTUITIVE, to fellow group members, establishing trustworthiness for cooperation. Both use costliness as the hard-to-fake mechanism, but Veblen's signal is about a possessed quality, this atom's is about a maintained (and costly to maintain) false belief — different content being signaled, different audience relationship."
  - "operationally distinct from lex-uyx42 minimal-violation-of-a-category-maximizes-a-concepts-memorability: lex-uyx42 (Boyer) explains why a specific supernatural CONCEPT is cognitively cheap to represent and pass on — a claim about the content's transmissibility. This atom explains why costly COMMITMENT to such a concept functions as a group-trust signal — a claim about what sustained, costly belief communicates to other people. A concept can be maximally memorable (lex-uyx42) without anyone paying a real cost to signal commitment to it (this atom); the two mechanisms compose in actual religious practice but answer different questions."
critical-questions:
  - "is the cost actually unrecoverable and undirected toward any independent payoff, or does the 'costly' commitment secretly also serve an ordinary instrumental function (social status, business networking, political access) that would explain its persistence without the signaling mechanism doing any work"
  - "who is the signal actually being sent to — is this genuinely about establishing trust with a specific in-group, or is the costliness better explained by coercion, sunk-cost entrapment, or lack of exit options rather than voluntary credible signaling"
  - "does the belief need to be FALSE specifically, or would any sufficiently unverifiable claim (true, false, or genuinely unknowable) serve the same signaling function — the mechanism as stated turns on unverifiability and lack of independent incentive, not strictly on falsity, and conflating the two risks over-claiming"
status: active
