canonical-instances:
  - "A UX team A/B tests five interface changes drawn from one coherent redesign philosophy and applies standard significance tests to each metric independently — but if users who respond positively to one change also systematically respond to the others (because both reactions stem from the same underlying preference the redesign was built around), treating each test as independent overstates confidence in each result individually."
  - "A marketing team tests whether three different email subject-line strategies each significantly increase open rates, but the three strategies were all generated from the same insight about audience curiosity — a reader who responds to one is disproportionately likely to respond to the others, so testing each in isolation for significance ignores the shared mechanism linking all three results."
critical-questions:
  - "If a batch of hypotheses fails independence because they share a common generating theory, does that argue for abandoning significance testing entirely (as this appendix concludes) or for testing a single higher-level hypothesis about the shared theory instead of many lower-level ones — would reformulating the hypothesis set itself resolve the independence problem rather than requiring a different statistical approach altogether?"
  - "The essay rejects the joint-occurrence-probability fix because it requires knowing exactly how hypotheses relate — but is 'exactly' too high a bar? Could a rough, partially-specified dependency structure (even an imperfect one) still improve on treating hypotheses as fully independent, or does any error in specifying the relationships risk making the joint-probability estimate worse than no correction at all?"
