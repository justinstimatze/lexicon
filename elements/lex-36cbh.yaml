id: lex-36cbh
name: authority-leaks-across-its-domain-of-validity
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When an expert opines outside their field, suspect authority-leakage: credibility earned in one domain imported as authority in another. Match the claim's domain to the source's actual expertise; if they don't match, demote the credibility."
related: [lex-jv983, lex-kebfa, lex-t9fs7, lex-nn3u9, lex-cgqta, lex-wx2ma, lex-ckahh, lex-2czcp, lex-xqamc, lex-8y3ch, lex-7qp5w, lex-6tvr6, lex-ftu47, lex-vx867, lex-653ng, lex-gu8st, lex-jmnap, lex-udyax]
scaffolds-from: [lex-kebfa]
evokes: [nobel-disease, intellectual-overreach, out-of-field-expert-deference, credibility-transfer-across-domains, expert-on-X-on-Y, field-question-failure, celebrity-scientist-overreach, halo-into-domain, sternberg-omniscience, bias-blind-spot]
lineage:
  - source: primary
    text: Walton-Reed-Macagno-2008-CQ2-specialization
    citation: "Douglas Walton, Chris Reed, and Fabrizio Macagno, *Argumentation Schemes* (Cambridge: Cambridge University Press, 2008), Ch. 1 §2 'Argument from Position to Know and Expert Opinion,' pp.14-15; Ch. 9 #2 p.310. ACQUIRED V_pre (source, second-use; previously cited as lex-kebfa lineage). This atom is a specialization of lex-kebfa argument-from-expert-opinion KEYED TO ITS SECOND CRITICAL QUESTION FAILING: 'Field Question: Is E an expert in the field that A is in?' The Walton scheme is valid AS A scheme; the atom names the specific failure mode where expertise in domain D1 is imported as credibility-on-claims in domain D2, with the field-mismatch unmarked by speaker or audience. The scheme-with-CQ frame is exactly the resource: lex-kebfa is the valid-presumptive scheme, lex-36cbh is the named failure-state of CQ2 specifically. Walton's apparatus does not name this failure-mode as such (it is left as 'CQ2 unanswered'); the atom promotes the unanswered-CQ2 state to first-class so the substrate can tag the move when it occurs without re-walking the scheme each time."
    quote: "[Walton, Reed, Macagno 2008 Ch.1 §2 p.14-15:] 'Argument from Expert Opinion. Major Premise: Source E is an expert in subject domain S containing proposition A. Minor Premise: E asserts that proposition A (in domain S) is true (false). Conclusion: A may plausibly be taken to be true (false).' [The six critical questions per Walton 1997 p.223:] '1. Expertise Question: How credible is E as an expert source? 2. Field Question: Is E an expert in the field that A is in? 3. Opinion Question: What did E assert that implies A? 4. Trustworthiness Question: Is E personally reliable as a source? 5. Consistency Question: Is A consistent with what other experts assert? 6. Backup Evidence Question: Is E's assertion based on evidence?' [the transferable specialization, derived:] when CQ1 (Expertise) is satisfied — E is genuinely a Nobel-tier or otherwise certified expert — AND the audience grants the scheme's presumptive force, but CQ2 (Field) is violated — the proposition A is in field S2 distinct from E's field S1 — and neither speaker nor audience raises the field-mismatch, the move is authority-leaks-across-its-domain-of-validity. The diagnostic move is to make CQ2 the first question asked of any high-status authority deployment, before the others; CQ2 is the domain-of-validity gate, and the substrate's scheme-with-CQ machinery already encodes it."
  - source: primary
    text: Basterfield-Lilienfeld-Bowes-Costello-2020-NobelDisease
    citation: "Candice Basterfield, Scott O. Lilienfeld, Shauna M. Bowes, and Thomas H. Costello, 'The Nobel Disease: When Intelligence Fails to Protect against Irrationality,' *Skeptical Inquirer* 44:3 (May/June 2020). METHODOLOGICALLY-DISTINCT SECOND PRIMARY: where Walton 2008 is normative argumentation theory (scheme-with-critical-questions formalism), Basterfield et al. 2020 is empirical psychology of intelligence + case-survey method drawing on Stanovich, Sternberg, Bensley, Shermer literatures. The article surveys ~15 Nobel laureates who endorsed fringe claims outside their field of expertise: Pauling (vitamin-C megadosing), Shockley (eugenics), Phillip Lenard + Alexis Carrel (Nazi racial theories), Egas Moniz (lobotomy over-extension), Julian Schwinger (cold fusion), Ivar Giaever (climate-change denial), Arthur Schawlow (facilitated communication for autism), Richard Smalley (anti-Darwinism), Wolfgang Pauli (Jung's synchronicity). The article credits Dubner 2014 with naming the underlying pattern 'intellectual overreach' and Sternberg 2004 with three sub-mechanisms explaining WHY high-intelligence individuals are vulnerable: (i) unrealistic optimism ('I'm smart so I needn't worry about intellectual errors'), (ii) sense of omniscience ('I'm smart so I know virtually everything'), (iii) sense of invulnerability ('I'm smart so I'm immune to mistakes'). The article also names the larger bias-blind-spot in highly intelligent individuals (Stanovich et al. 2013) — they are LESS aware of their own susceptibility, which is the mechanism that predicts the CQ2-violation pattern lex-36cbh names will go unflagged by speaker and audience alike. Stanovich & West 2008 finding: intelligence is only modestly correlated with immunity to most cognitive biases, consistent with the observation that even very smart people fall prey to authority-leaks."
    quote: "[Basterfield, Lilienfeld, Bowes, Costello 2020 'Nobel Disease' Skeptical Inquirer 44:3:] 'Nobelists may need to be on guard against \"intellectual overreach,\" the mistake of assuming that because one is an expert in one domain, one is likely to display comparable levels of expertise in other domains (Dubner 2014).' [The Sternberg 2004 three-mechanism inventory, paraphrased verbatim from the article:] 'Unrealistic optimism occurs when people believe that because they are smart, they need not worry about intellectual errors. The sense of omniscience arises when people believe they are so intelligent that they know virtually everything. The sense of invulnerability emerges when people believe they are so smart that they are essentially immune to mistakes.' [On the bias-blind-spot amplification:] 'Preliminary evidence further suggests that intelligent people may have a somewhat larger bias blind spot than other people, meaning they are less aware of their propensity toward biases (Stanovich et al. 2013).' [The closing pattern claim:] 'The Nobel Disease, along with the stories of these three scientists, strongly suggest that high levels of general intelligence, traditionally conceptualized as the capacity to analyze and evaluate information, do not preclude high levels of irrational thinking.' [the transferable corollary:] the Sternberg three-mechanism inventory plus the Stanovich bias-blind-spot finding gives lex-36cbh its predicted FAILURE MODE: the CQ2-violation goes unflagged because the speaker's intelligence-confidence has been calibrated against general-intelligence-measure (max-performance metric) rather than against domain-validity-measure (typical-performance metric), and the audience's calibration of speaker-credibility carries the same max-performance bias."
canonical-instances:
  - "Linus Pauling and vitamin-C megadosing: Pauling won the Nobel Prize in Chemistry (1954) for work on chemical bond structure AND the Nobel Peace Prize (1962). He used the dual-Nobel authority to promote vitamin-C megadoses as a cure for the common cold and as an adjunctive cancer treatment. Pauling's chemistry-expertise (CQ1 satisfied at Nobel-tier) does not transfer to clinical-trial methodology in nutrition or oncology (CQ2 violated); the field-mismatch was insufficiently raised by media or audiences, and the megadose-vitamin-C movement persisted long after randomized trials disconfirmed his clinical claims."
  - "William Shockley and eugenics: Shockley won the Nobel Prize in Physics (1956) for the invention of the transistor. He used the transistor-fame as platform for race-and-eugenics claims (the Bay Area dysgenics-thesis lectures). Physics expertise (CQ1) does not transfer to genetics, demography, or population biology (CQ2 violated); Shockley's authority leaked across the domain boundary with the field-mismatch insufficiently flagged."
  - "Geoffrey Hinton 2026 Big Technology Podcast interview: deep-learning Nobel-tier credibility deployed in (a) philosophy of mind ('they're already conscious beings like us'), (b) labor-economics forecasting (mass-unemployment timeline claims), (c) science of consciousness (multiple-decades-held metaphysical commitment presented as inference-from-ML-systems). lex-kebfa CQ1 satisfied at maximum tier; CQ2 violated across three distinct field-mismatches; the audience (interview format, public discourse) does not raise the field-question. Hinton partly flags it ('I came from psychology') which should RAISE not lower scrutiny — confessing the field-mismatch does not satisfy CQ2 unless the speaker also down-tunes the claim's confidence to fit the actual field-of-validity."
  - "Egas Moniz lobotomy over-extension (Basterfield et al. canonical case): Moniz won the Nobel Prize in Physiology or Medicine (1949) for prefrontal lobotomy. The original Nobel-recognized work was a narrow neurosurgical demonstration. Moniz then promoted the procedure as a general treatment for serious mental illness, generalizing from a frontal-lobe-disconnect-renders-chimps-docile observation. The field-mismatch (neurosurgical-anatomical expertise vs. clinical-psychiatric treatment-effectiveness) was insufficiently raised; tens of thousands of lobotomies were performed before the field-question was effectively answered."
  - "James Watson (post-helix-discovery) racial-IQ claims: Watson co-discovered the DNA double helix (Nobel 1962, with Crick and Wilkins). His subsequent statements on race-and-intelligence used the molecular-biology authority as platform for population-genetics + psychometrics + sociology claims he was not credentialed in (CQ2 violated across multiple fields)."
  - "Operationally distinct from parent lex-kebfa argument-from-expert-opinion: lex-kebfa is the SCHEME — a presumptively-valid mode of inference equipped with six critical questions. lex-36cbh is the NAMED FAILURE-STATE of CQ2 specifically: the scheme's Field Question goes unraised by speaker and audience alike, and authority leaks across the field boundary. The relationship is parent/child: lex-kebfa stays available for cases where the scheme is correctly bounded; lex-36cbh fires when the CQ2 gate has failed without anyone noticing. (Other CQ failures have their own potential children: CQ4-failure could be a 'trustworthiness-leak' atom; CQ5-failure could be 'consistency-with-other-experts-leak'.)"
  - "Operationally distinct from lex-xqamc argument-from-bias: lex-xqamc is the DIALECTICAL counter-move (attacking the arguer's bias to undermine credibility). lex-36cbh is the OBJECT-LEVEL FAILURE in the original argument (field-domain mismatch in the authority claim). They compose: noticing lex-36cbh in someone's argument provides a non-bias-based reason to discount; lex-xqamc is the additional bias-based reason. Defense-side preferences should favor lex-36cbh over lex-xqamc when CQ2-failure is available because it does not require establishing a motivated-state, only a field-mismatch."
  - "Operationally distinct from lex-cgqta naturalization: lex-cgqta erases the production-mechanism (the system manufactured the artifact it then cites as natural). lex-36cbh leaves the speaker's credentials in plain view and exploits them across a domain boundary the audience does not flag. Cross-fire when authority-leak is NATURALIZED — when 'Nobel-laureate X says Y about field Z' is treated as too obvious to question and the field-Z boundary becomes invisible to the audience. The transferable claim: naturalized authority-leak is the most resistant form because the audience cannot even ask CQ2 if the field-boundary has dissolved into 'Nobel-laureate X just knows things.'"
critical-questions:
  - "is the claim in the speaker's actual field of demonstrated expertise, or adjacent-but-distinct? Walton 2008 CQ2 promoted to first-question status: ask this BEFORE the other CQs because if CQ2 fails, the scheme's presumptive force is unavailable regardless of how well CQ1, CQ3, CQ4, CQ5, CQ6 fare. The field-boundary test: would a working specialist in the field-of-the-claim recognize the speaker as a peer? If not, CQ2 is failing."
  - "is the audience transferring credibility across the field boundary on the speaker's behalf? Even if the speaker partially flags the boundary ('I came from psychology'), the audience may not down-tune. The transferable diagnostic: would the audience accept the same claim, in the same form, from a working specialist in the claim's field at non-Nobel-tier credentialing? If the answer changes, the audience is transferring credibility across fields the source has not explicitly transferred."
  - "what specific feature of the speaker's expertise SHOULD transfer, and what should not? Sometimes field-adjacency is real (a physicist on physics-adjacent ML). The honest move is to identify which specific skills/knowledge from the speaker's expertise are doing the work in the new claim, and which adjacent-domain competencies are silently being claimed. lex-36cbh flags UNMARKED transfer; it does not deny that some transfer is licensed when explicitly justified."
  - "is the speaker's confidence calibrated to general-intelligence performance or to domain-specific performance? Sternberg 2004 + Stanovich 2008: general-intelligence measures are max-performance metrics; out-of-domain performance is a typical-performance metric. A speaker whose self-confidence is calibrated to their max-performance experience will systematically over-confident on out-of-domain claims. (This is the predicted-mechanism by which CQ2-violations feel licensed to the speaker.)"
  - "does the audience exhibit the larger bias-blind-spot Stanovich et al. 2013 found in intelligent individuals? Audiences of high-IQ-self-selecting venues (tech-podcast, prestige-newspaper opinion, conference keynote) may be MORE likely to grant authority-leak unflagged because the audience shares the predictive mechanism. The diagnostic: are alternative-field specialists present and being heard, or is the audience composed of fans-of-the-speaker?"
  - "does the speaker flag the boundary themselves, and does flagging suffice? Hinton-2026 partly does this ('I came from psychology'). The transferable answer: explicit boundary-flagging is necessary but not sufficient. It satisfies the speaker's hygiene but does not RESOLVE the audience's credibility-transfer unless the speaker also down-tunes the claim's confidence-language to match the actual field-of-validity. CQ2 is satisfied only when both the speaker and the audience have updated."
  - "where do practitioners over-apply this critique? Demanding strict field-of-degree-credential for any claim is also wrong; cross-domain insight is real and important. The atom fires on UNMARKED transfer in a context where the field-mismatch matters to the claim's verifiability. It does not fire on genuine interdisciplinary work that explicitly engages the methods/literatures of the new field. Honest test: has the speaker actually engaged the claim's field (read the relevant literature, run the relevant tests, talked to working specialists), or is the speaker reasoning from first principles using their out-of-field intuitions?"
  - "is the speaker performing a sociological move (using out-of-field credibility to elevate ideas that would not be heard from in-field voices) and is that move benign or harmful in the given context? Sometimes cross-domain authority deployment is the only way an under-attended idea gets oxygen; sometimes it crowds out the in-field experts who should be heard. The CQ surfaces the question explicitly so the audience can make the judgment rather than absorbing the cross-domain claim implicitly."
severity-tier: info
