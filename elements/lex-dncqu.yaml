    quote: "Amidst the great ones of the earth a fivefold power we see; / Of these the power of limbs is, sure, the last in its degree, / And power of wealth, O mighty lord, the next is said to be. / The power of counsel third in rank of these, O king, I name; / The power of caste without a doubt is reckoned fourth in fame, / And all of these a man that's wise most certainly will claim. / Of all these powers that one is best, as power of learning known, / By strength of this a man is wise and makes success his own."
canonical-instances:
  - "Three finalists are asked the same open-ended interview question about handling a difficult stakeholder. Two give strong, specific stories of what they did. The third gives an equally specific story but frames it first as one instance of a named pattern — 'this is a case of surfacing the unstated constraint before it becomes a blocker' — and gets the offer."
  - "A panel of reviewers reads three grant proposals answering the same call. Two describe rigorous, well-designed studies. The third opens by naming the general class of confound the field keeps failing to control for, then positions its own design as the first to close that specific gap — and is ranked highest, even though all three designs are comparably sound."
critical-questions:
  - "Is the framework-naming answer actually more useful, or does it just read as more impressive — could the two specific-advice answers in the tale have been executed just as well without any taxonomy attached, making the reward gap a matter of style read as substance?"
  - "The parrot is already the story's protagonist and was always going to give the best answer — does the tale demonstrate that framework-naming signals mastery, or does it simply dress up 'the wisest character wins' in a way that happens to use this device, with the causal story running the other direction?"
