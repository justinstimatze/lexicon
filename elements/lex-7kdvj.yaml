name: blaming-your-own-body-parts-for-your-actions-marks-undeveloped-selfhood
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Treating a part of your own body, or an impulse that clearly originated with you, as though it were an independent agent that acted on you rather than as you, is a way of disowning responsibility for your own actions without technically denying that they happened. After Wakdjunkaga's anus fails to wake him and his stored food is stolen, he punishes it by burning it, then complains as though the anus had betrayed him rather than simply being part of him: ''Ouch! This is too much!...Is it not for such things that I am called Wakdjunkaga? Indeed, they have talked me into doing this, just as if I had been doing something wrong!'' Radin reads this stage of the cycle as marking a specific kind of undevelopment: 'he does not as yet accept responsibility for his actions. In fact, he holds other people, the world outside of himself, as compelling him to behave as he does.' The developmental turn Radin traces is Wakdjunkaga coming to realize that his hands, his anus, his body, are actually his: 'he is being singled out, even if only to be ridiculed, and he has begun to understand why he is called Wakdjunkaga. But he does not as yet accept responsibility for his actions.' Diagnostic move: notice when you or someone else describes their own hand, temper, appetite, or impulse in language that treats it as a separate actor, 'my hand just did it,' 'my temper got the better of me,' since that framing is doing real work: it lets the person acknowledge that something happened without accepting that they are the one who did it."
