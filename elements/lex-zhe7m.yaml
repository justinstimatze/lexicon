id: lex-zhe7m
name: overheard-secret-knowledge-is-converted-into-deliberate-self-effacing-resource-allocation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Someone who overhears privileged information others missed can act on it decisively for personal gain while also choosing, without external pressure, to allocate the largest share of the resulting benefit to others and take the smallest share for themselves. In the Jataka''s tale of Nigrodha, Pottika overhears two roosting cocks reveal that eating different parts of one grants different fortunes, and instead of maximizing his own take, deliberately assigns the best shares away from himself: "''Whoever kills me and eats my flesh will receive a thousand pieces of money this very morning!... if any one kills me and eats of my fat, he will become a king this very morning; he that eats the middle flesh, becomes commander-in-chief; who eats the flesh about the bones, he will be treasurer!'' All this Pottika overheard... the fat he gave to Banyan, the middle flesh to Branch, and himself ate the flesh that was about the bones."'
related: []
evokes: [jataka, dasanipata, nigrodha-jataka, eavesdropped-fortune, self-effacing-resource-allocation]
lineage:
  - source: primary
    text: jataka-chalmers1895-nigrodha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 445, Nigrodha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Whoever kills me and eats my flesh will receive a thousand pieces of money this very morning!... if any one kills me and eats of my fat, he will become a king this very morning; he that eats the middle flesh, becomes commander-in-chief; who eats the flesh about the bones, he will be treasurer! All this Pottika overheard... the fat he gave to Banyan, the middle flesh to Branch, and himself ate the flesh that was about the bones."
canonical-instances:
  - "An assistant who overhears a leaked detail about which of three candidates a search committee actually favors quietly acts on the information to help her two colleagues each land better roles first, and only afterward takes the more modest opening for herself."
critical-questions:
  - "Pottika still acted decisively and secretly on privileged information the roosters never meant to share. Does taking the smallest share of the resulting windfall actually count as restraint, or only as a milder form of the same exploitation?"
status: active
