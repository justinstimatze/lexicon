canonical-instances:
  - "A product team strongly expects that users who complete an onboarding tutorial will retain at a higher rate than users who skip it, given how much design intuition supports the theory — finding no retention difference at all would be the headline result, prompting a rethink of what onboarding is actually accomplishing, yet a report that only surfaces 'statistically significant' findings would bury this null result as if nothing happened."
  - "Economists strongly predict that raising a local minimum wage will measurably reduce employment in that area — a well-designed study finding no significant employment effect is a major, theory-challenging finding precisely because the prediction was so confident, not a non-result to be filed away; suppressing null findings in this literature would suppress exactly the studies that force theoretical revision."
critical-questions:
  - "How strong does the prior theoretical expectation need to be before an absent effect counts as 'theoretically significant' rather than merely 'uninteresting' — is there a principled threshold, or does this always require a judgment call about how confidently the relationship was predicted beforehand, which risks being made with hindsight once the null result is already in hand?"
  - "Does this argument only work for a PRE-registered or clearly pre-stated expectation — if a researcher can retroactively claim any absent effect was 'strongly expected,' does treating null results as potentially important open a door to unfalsifiable post-hoc storytelling about what the absence of a finding 'really' means?"
