canonical-instances:
  - "Hypothetical: A city's news coverage and city-council attention swing hard toward a bridge collapse that kills a dozen people, prompting an emergency inspection program within weeks. The same city has let its water system leach lead into homes in a poor neighborhood for a decade -- no single dramatic event, no body count attached to one date, and it barely registers as a local political issue despite years of the same council being in office."
  - "Hypothetical: A country's democratic government responds to a single, well-publicized workplace disaster with fast-tracked safety legislation within a legislative session. The same country lets tens of thousands of workers a year die slowly from cumulative exposure to industrial pollutants no different in origin, spread across too many workplaces and too many years for any one election to turn on it."
critical-questions:
  - "Isn't this just describing media incentives, not something specific to democracy -- wouldn't any political system have this same visibility bias? The visibility bias in attention is broader than democracy, but the mechanism Sen names is specifically about ACCOUNTABILITY: a free press and competitive elections are what convert visible failure into political cost for the people in power. An authoritarian system without either doesn't even have that partial corrective, so the same visibility bias produces worse outcomes there, not the same ones."
  - "Does this mean chronic, diffuse harms are simply undemocratic problems that no amount of public reasoning can fix? No -- Sen's own point is that the epistemic side of democracy, sustained public discussion and reporting, is exactly the tool that CAN close the gap; it's just that this tool doesn't get deployed automatically the way electoral accountability does for visible crises. The gap is real but not permanent -- closing it takes deliberate journalistic and political effort that visible disasters generate on their own."
