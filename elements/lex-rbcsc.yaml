lineage:
  - source: primary
    tradition: lent-2021-the-web-of-meaning
    text: lent-2021-web-of-meaning-introduction
    citation: "Jeremy Lent, *The Web of Meaning: Integrating Science and Traditional Wisdom to Find Our Place in the Universe* (Profile Books / New Society Publishers, 2021). Sequel/integration to Lent's 2017 *The Patterning Instinct*. The Introduction restates the core substrate-claim from Patterning Instinct: humans encounter the world through a worldview that is cognitively prior to and constitutive of what counts as value, what counts as possibility, what counts as a thing at all. The worldview is invisible-as-worldview to its holder; it appears as 'just how the world is.' Once surfaced as a constructed pattern, it becomes debatable. Lent's specific historical claim: a culture's worldview shapes its values, and those values shape history — so the leverage point for changing trajectory is upstream of values, at worldview-work. The book's structural argument: the dominant Western worldview ('Uncle Bob speech': humans are selfish individuals, all creatures are selfish-genes, nature is a machine, technology + market solve all problems) was constructed by ~17th-century European thinkers, accomplished much, and is now structurally driving civilizational + ecological collapse. The alternative worldview Lent lays out integrates systems science with traditional wisdom traditions. The transferable claim, stripped of Lent's specific normative project: worldview is cognitively prior; worldview shapes values; values shape history. The atom is the structural fact, not Lent's particular alternative."
    quote: "[Lent 2021 *Web of Meaning* Introduction:] 'The reason a worldview is so important is that it imbues virtually every aspect of the way people think, what they value and how they act – without them even realizing it. Worldviews lead cultures to respond to their reality in fundamentally contrasting ways.' [Same:] 'Like fish that don't realize they're swimming in water because it's all they know, we tend to assume that our worldview simply describes the world the way it is, rather than recognizing it's a constructed lens that shapes our thoughts and ideas into certain preconditioned patterns.' [Same:] 'In my earlier book The Patterning Instinct I looked at major worldviews through history, investigating how cultures structured patterns of meaning into the universe from humanity's earliest days in nomadic hunter-gatherer bands to modern times. One over-arching theme emerged from The Patterning Instinct: a culture's worldview shapes its values – and those values shape history. By the same token, the values according to which we conduct our lives today will shape the future. Ultimately, the direction of history is determined by the dominant culture's worldview.' [Same, the practitioner-move:] 'we need to take a long, hard look at the faulty ideas that have brought us to this place and reimagine them. We need a new worldview – one that is based on sturdy foundations.' [Same, the recursive-self-application:] 'these basic elements, give or take a few, form the foundation of the predominant worldview. They infuse much of what is accepted as indisputably true in most conversations that take place about world affairs. They are so pervasive that most of us never question them. We feel they must be based on solid facts – why else would all those people in positions of authority rely on them?' [Practitioner-extraction: Lent's substrate-claim is structural, not normative — the WORLDVIEW-IS-PRIOR claim does not depend on which worldview you favor. It says: worldview-work is upstream of values-work is upstream of action-work. Most arguments at the values-level are actually worldview-arguments-in-disguise; surfacing the worldview lets the actual disagreement become visible. For lexicon's self-application: this atom names what lexicon does — it surfaces the patterns the worldview is composed of so they can be inspected and chosen rather than swimming-in-it. The atom is meta-load-bearing for the project itself.]"
canonical-instances:
  - "Lent 2021's 'Uncle Bob speech' canonical-instance: the assemblage 'humans are selfish individuals + nature is a machine + technology + market solve all + survival of fittest' presented as if it's 'just how the world is' — when it is actually a specific 17th-century-European worldview that selects which values are admissible (efficiency, competition, growth) and which are invisible (relational, ecological, sufficient)"
  - "in design / architecture: a 'how should we build housing?' debate is structurally a debate among at-least-three worldviews (single-family-private-property vs commons-shared vs nomadic-mobile), each of which makes certain values invisible (e.g., commons-shared makes 'investment-vehicle' invisible). Until you name the worldview, the values-level argument cycles"
  - "in software engineering: 'should we use microservices or a monolith?' is a worldview debate (decoupling-purity-as-virtue vs cohesion-as-virtue) disguised as a values debate. The worldview-level question is which of fast-iteration-of-independent-units or coherent-shared-state-and-shared-mental-model you take as the privileged structural primitive"
  - "in education: 'how should we teach?' is structurally a worldview question (knowledge-as-content-to-transfer vs learning-as-pattern-recognition-substrate-to-cultivate vs schooling-as-credentialing-pipeline-vs-curiosity-amplifier). adversaria's edu-game design rests on choosing the second worldview explicitly"
  - "in policy: 'should we tax carbon?' is a worldview debate (economy-is-substrate-of-civilization vs ecology-is-substrate-of-economy) disguised as a tradeoff. Lent's central political argument is that the current worldview makes the latter invisible and that the policy debate cycles until the worldview becomes visible"
  - "operationally distinct from lex-jv983 fluency-trap: fluency-trap is about felt-ease-of-processing misleading TRUTH judgments at a particular moment. This atom is about a stable structural fact — the worldview-as-prior-pattern-set is not a momentary fluency illusion but a long-standing cognitive medium that selects what is even thinkable. They compose (a worldview can be the source of a fluency-trap), but they operate at different scales"
  - "operationally distinct from lex-jafkg cognitive-bias-as-systematic-judgment-distortion-mechanism: cognitive-biases name specific JUDGMENT distortions within a worldview. This atom names the worldview itself as a higher-order pattern selection that is upstream of which biases are even possible to have"
  - "operationally distinct from lex-6gy96 value-capture (Nguyen): value-capture is about an external metric SUPPLANTING rich internal values. This atom is upstream — it asks how the metric-and-values pair were both selected by a worldview in the first place. Value-capture happens WITHIN a worldview; lex-rbcsc names the worldview as the pre-condition"
  - "operationally distinct from lex-4d53x measurement-horizon: lex-4d53x names the timing-of-measurement as a strategic input. lex-rbcsc names the worldview as upstream of EVEN the choice of what is worth measuring. lex-4d53x is one specific instance of how a worldview can be pre-decided (which horizon counts) that lex-rbcsc abstracts"
  - "self-applicative for lexicon: the substrate-mining project itself is performing the practice this atom names. Each atom surfaces a pattern that has been operating invisibly; the substrate as a whole is a worldview-disassembly tool. lex-rbcsc is the meta-atom that names what the lexicon project is doing"
critical-questions:
  - "what is MY worldview? Whose pattern-set am I swimming in unawares? The fish-in-water test: name three things that 'just are how the world is' for you that someone in a different culture / class / discipline / century would deny. Those are the worldview's invisible essential elements"
  - "what is the worldview of the position I'm arguing AGAINST? Most arguments cycle because the disputants are operating within different worldviews while pretending to disagree at the values level. Practitioner-discipline: before answering an argument, ask 'what worldview would make this argument seem obvious?' — the worldview is the disagreement; the values are downstream"
  - "is the worldview-question actually the right level to surface here? Worldview-work is expensive and slow; it should not be the default move for every disagreement. For routine within-worldview questions (which API design, which restaurant), surfacing the worldview is overkill and patronizing. The discriminator: are people unable to converge despite extensive object-level discussion? That is the signature of a worldview-level disagreement"
  - "is this atom being mis-used as a thought-stopper? 'That's just your worldview' can be a dismissal that refuses engagement. Lent's substrate-claim is structural (the worldview-is-prior fact); it does NOT license 'all worldviews are equally good.' Practitioner-discipline: surface the worldview, then ARGUE about it, do not use the worldview-claim to end argument"
  - "what worldview am I building by my mining choices? If lexicon is itself a worldview-disassembly tool (per the self-applicative canonical-instance), what worldview is it constructing through which patterns I select to atom? The substrate-design choices are themselves worldview-work; the substrate is not view-from-nowhere"
