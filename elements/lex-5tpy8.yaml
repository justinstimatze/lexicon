id: lex-5tpy8
name: single-self-houses-multiple-competing-volitional-sub-agents
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when self-control failure is analyzed as a single agent knowing-but-not-doing (Aristotelian akrasia) when the actual mechanism is competing volitional sub-agents WITHIN the self, each with its own want. Augustine's transferable contribution: it is not just knowledge-vs-action gap; the WILL ITSELF is multiple. `The mind commands the body, and it obeys instantly; the mind commands itself, and is resisted.` When `I want to stop drinking but keep drinking,` it is not that one unified `I` knows the better and fails to do it; it is that there are TWO WILLS WITHIN — one wanting to stop, one wanting to drink — and neither is entire. `What the one lacketh, the other hath.` The self is not a unified deliberator but a contested arena. Transferable applications: (a) addiction + habit-change (the wanting-to-stop self + the wanting-the-substance self both genuinely present; treatment that addresses only the conscious-deliberator self misses the other agent — Marlatt 1985 *Relapse Prevention*; Heyman 2009 *Addiction: A Disorder of Choice*); (b) procrastination + commitment-device design (Schelling 1984 *The Mind as a Consuming Organ* on the planner-doer split that commitment devices exploit; lex-rfcb7 substrate-grounded composes); (c) dual-process theory (Kahneman 2011 System 1 + System 2 — though more rule-of-thumb than Augustine's multiplicity; still the structural intuition aligns); (d) Internal Family Systems therapy (Schwartz 1995 *Internal Family Systems Therapy* explicitly operationalizes Augustine-style multiplicity for clinical practice); (e) parts-work in trauma therapy (Schwartz, Fisher 2017 *Healing the Fragmented Selves of Trauma Survivors*); (f) Plato's tripartite soul (Republic IV — earlier articulation: reason, spirit, appetite); (g) Freud's structural model (Ego, Id, Superego — modernization of the same multi-agent picture); (h) behavioral economics multi-self models (Thaler-Shefrin 1981 planner-doer; Loewenstein 1996 visceral factors); (i) consumer behavior (Hoch + Loewenstein 1991 time-inconsistent preferences); (j) software-engineering self-control (the engineer who wants to write tests + the engineer who wants the feature done; the senior who wants to mentor + the senior who wants to ship — both genuinely the same engineer); (k) AI multi-objective alignment (the model that has been trained on multiple competing objectives — helpfulness + harmlessness + honesty — and the resulting tensions are not knowledge-action gap but real multi-objective conflict — composes with lex-cqvnu + AI-safety reward-specification work). Distinct from lex-v7ceq akrasia-knowing-the-good-yet-doing-otherwise (Aristotle): Aristotle's mechanism is incomplete-knowledge or weakness-of-resolve in a unified deliberator. lex-5tpy8 names a different mechanism: the deliberator is itself MULTIPLE, not weak. They compose: lex-v7ceq names a knowledge-vs-action gap; lex-5tpy8 names a will-vs-will conflict; either can occur. Distinct from lex-mwgep path-dependence (commitment-trap mechanism). Distinct from lex-rfcb7 credibility-comes-from-visibly-foreclosed-options (Schelling — commitment-device against future self; presupposes lex-5tpy8 multi-self structure but names a specific solution-pattern). Use when (i) self-control failure is being analyzed as single-agent failure when multi-agent conflict is more accurate, (ii) someone reports `I want X but also don't want X` and that is taken as confusion rather than as accurate report of multi-self conflict, (iii) you are designing intervention (treatment, commitment device, AI alignment objective) + must decide whether to address single agent or multi-agent reality. Counter-move: name the multiple wills + their respective wants; ask which sub-agent the intervention addresses + which it leaves unchanged; design for multi-self reality rather than single-self idealization."
