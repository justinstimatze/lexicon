id: lex-p7953
name: a-thefts-truth-depends-on-which-property-order-is-presupposed
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A plain factual statement about whether something was stolen is not free-standing -- its truth-value depends entirely on which system of legitimate ownership is being taken for granted, and when that background system is itself the thing in question, the same statement can be simultaneously a lie under one order and true under another. Hyde works this out through Hermes' theft: '\"Hermes did not steal the eternal cattle\" is a lie in the initial context of the Hymn when Apollo's world is still intact, but afterwards -- when they are no longer eternal, when Hermes has the herder's whip -- it feels a little quaint to call it a lie.' He then applies the identical structure to slavery: 'Similarly, the assertion \"The slaves didn't steal Colonel Lloyd's fruit\" might be a lie in the fictive world of plantation culture but true in a world that takes slavery itself to be a form of theft.' The mechanism he names for how this shift happens is that 'before that shift can take place, however, the old story must lose its charm' -- the background property-order has to be exposed as one contestable arrangement among others before a statement that violates it can stop reading as a lie and start reading as a simple description of an unjust taking reversed. Diagnostic move: when a statement is being defended or attacked as 'true' or 'false' on the question of theft, identify the background ownership system the judgment is quietly assuming -- if that system is itself the live question (was this property rightfully held in the first place), then calling the taking 'theft' or 'not theft' is not reporting a fact, it is taking a side in the more fundamental dispute the surface statement is smuggling past unexamined."
