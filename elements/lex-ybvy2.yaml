id: lex-ybvy2
name: semantic-primes-are-the-indefinable-bedrock-of-all-meaning
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When trying to define a word or concept, don't assume you can define ALL the way down — some elements have to be accepted as indefinable, or every definition becomes circular (defining 'demand' as 'to request firmly' and 'request' as 'to demand gently' explains nothing). Wierzbicka's Natural Semantic Metalanguage thesis: there exists a small set of semantic primes — irreducible concepts like NOT, SAME, WANT, GOOD, BIG, THINK, KNOW — that cannot themselves be defined in simpler terms and are lexicalized (have a word or fixed expression) in every human language. Among these, NOT is her paradigm case of a universal LOGICAL-OPERATOR prime: negation applies to any clause, of any kind, in any language, apparently without restriction. Treat this as Wierzbicka's own specific, actively-defended theoretical position within linguistics — the general insight (some definitional bedrock is unavoidable, or definitions regress circularly) is close to a truism, but the SPECIFIC claim (this particular inventory of ~65 primes, in this exact form, is universal and complete) is her own contested proposal, not settled linguistic consensus."
related: [lex-d6f8b, lex-r6q47]
evokes: [semantic-primes, natural-semantic-metalanguage, indefinibilia, not-as-universal-clause-operator, circularity-of-definition]
lineage:
  - source: primary
    text: wierzbicka-1996-semantics-primes-and-universals-ch1-ch3
    citation: "Anna Wierzbicka, Semantics: Primes and Universals (Oxford University Press, 1996), Chapter 1 'Introduction,' p.10-11, and Chapter 3 'Universal Grammar,' Section 15.1 'Negation: NOT,' p.139."
    quote: "[p.10-11:] 'The elements which can be used to define the meaning of words (or any other meanings) cannot be defined themselves; rather, they must be accepted as indefinibilia, that is, as semantic primes, in terms of which all complex meanings can be coherently represented.' [Verified 2026-08-19: this sentence is absent from pdftotext's extracted text layer, which jumps straight from the prior paragraph to the next sentence across the p.10/p.11 page break -- a silent extraction gap, not a missing source. Targeted 300dpi render + tesseract OCR of pages 10-11 confirms the sentence is genuine and accurate as quoted.] [p.11, continuing:] 'meaning cannot be described without a set of semantic primitives; one can purport to describe meaning by translating unknowns into unknowns ... but nothing is really achieved thereby. Without a set of primitives all descriptions of meaning are actually or potentially circular (as when, for example, to demand is defined as \"to request firmly\", and to request as \"to demand gently\").' [Correction 2026-08-19: this entry previously continued with a second sentence — \"Any set of primitives is better than none, because without some such set semantic description is inherently circular and, ultimately, untenable\" — that does not appear in the book; the accurate claim is already fully stated in the sentence above. Removed rather than replaced, since nothing else in the source makes that further claim.] [p.139, on NOT specifically:] 'Negation is, universally, a \"clause operator\". Remarkably, it seems to be totally unrestricted: apparently any clause, of any kind, in any language, can be negated.'"
canonical-instances:
  - "The demand/request circularity Wierzbicka herself cites: a dictionary defines 'to demand' as 'to request firmly' and 'to request' as 'to demand gently' — each word is defined in terms of the other, so a reader who doesn't already know either word learns nothing; this is presented as a small, concrete illustration of what happens when a definitional system has no genuinely indefinable bedrock terms."
  - "NOT as the paradigm universal logical-operator prime (p.139): across the world's languages, whatever grammatical form negation takes (a particle, a verbal suffix, a bound morpheme), it attaches to essentially any clause without restriction — Wierzbicka treats this unrestricted combinability as evidence NOT belongs in the small set of genuinely primitive, cross-linguistically lexicalized concepts, rather than being a complex notion built from simpler parts."
  - "Contrast with a critic's position: a linguist who rejects the strong NSM claim might grant that SOME primitive bedrock is unavoidable (agreeing with Wierzbicka's general circularity argument) while disputing that her SPECIFIC 65-item list is the right, complete, or uniquely-motivated inventory — the atom's transferable lesson (definitions must bottom out somewhere) survives that dispute even if the exact list doesn't."
critical-questions:
  - "is the ~65-prime inventory itself well-supported across the many languages Wierzbicka and collaborators have checked it against, or does cross-linguistic 'lexicalization' get established more loosely (a close paraphrase counted as evidence of the prime) than a skeptic would accept as rigorous?"
  - "does 'NOT is universally unrestricted' hold up against the harder cases — languages where negation interacts unusually with mood, evidentiality, or other grammatical categories — or does the 1996 text's own hedging ('apparently', 'remarkably') already signal this is a working hypothesis rather than an exhaustively verified universal?"
  - "how does a practitioner actually USE the indefinability claim outside linguistics proper — is the transferable lesson just 'expect definitional regress to bottom out somewhere and don't demand infinite justification', or does the specific NSM apparatus (paraphrase everything into combinations of the ~65 primes) do additional real work that a looser version of the lesson would lose?"
status: active
