evokes: [the-self-as-script-for-imagined-audience, second-order-intentionality, theory-of-mind-recursion, the-watcher-watching-watchers, performance-as-cognitive-architecture, simulating-being-simulated]
lineage:
  - source: practitioner
    text: pilot-J-pass-1
    citation: "First surfaced from Frankie's Cultural Observations corpus (4/5 video attestation, named provisionally as 'self-as-script-for-imagined-audience'): T2 (most explicit) 'watching a movie about our lives...everyone else has memorized their lines, rehearsing the lines we say out loud to make our performance believable'; T1 'they cosplay freedom to a crowd who aren't looking'; T4 'the performance of business' — busyness as audience-legible script; T5 representation-of-masculinity as media-image performed for dating-app audience. Verified 2026-08-19: T2 identified and confirmed, YouTube id ZDHkW8w9dRw (why life doesn't feel real anymore) — corrected here: the real caption repeats the word lines where the atom had substituted lies. T1, T4, T5 not yet located; unverified, not confirmed wrong."
  - source: practitioner
    text: pilot-J-pass-2
    citation: "Cross-creator attestation in Kurzgesagt T01 'Our Minds Are Weirder than You Think' at the cognitive-mechanism level: 'We humans are not just simulating other minds in our minds. We simulate minds simulating minds. We think about what others think. We think about what they think about us thinking about what they think and so on. There are a lot of layers.' This is the cognitive-architecture mechanism behind Frankie's sociological surface phenomenon. Cross-discipline attestation REFRAMED the candidate: not just performance-for-imagined-audience (Goffman territory) but second-order-intentionality from cognitive science. Verified 2026-08-19 against the actual video, YouTube id dl0-TveDDGA -- exact match."
  - source: practitioner
    text: premack-woodruff-1978-theory-of-mind
    citation: "David Premack & Guy Woodruff, Does the chimpanzee have a theory of mind? (Behavioral and Brain Sciences 1(4):515-526, 1978) — the canonical paper introducing theory of mind as a research construct: the capacity to attribute mental states to others. Subsequent work established second-order theory of mind (modeling another's model of you) as developmentally distinct and tightly tied to social-self formation."
  - source: practitioner
    text: goffman-1959-presentation-of-self
    citation: "Erving Goffman, The Presentation of Self in Everyday Life (University of Edinburgh Social Sciences Research Centre Monograph No.2, 1956 — preceding Anchor 1959 paperback that became canonical) — the canonical sociological treatment of self-as-performance-for-audience. Goffman's dramaturgical analysis is the surface-level instance of the cognitive-mechanism Premack-Woodruff later operationalized: the back-stage / front-stage distinction is operationalized recursive-mind-simulation. (1956 Edinburgh Monograph) Preface"
    quote: "The perspective employed in this report is that of the theatrical performance; the principles derived are dramaturgical ones. I shall consider the way in which the individual in ordinary work situations presents himself and his activity to others, the ways in which he guides and controls the impression they form of him, and the kinds of things he may and may not do while sustaining his performance before them... on the stage one player presents himself in the guise of a character to characters projected by other players; the audience constitutes a third party to the interaction—one that is essential and yet, if the stage performance were real, one that would not be there. In real life, the three parties are compressed into two; the part one individual plays is tailored to the parts played by the others present, and yet these others also constitute the audience."
  - source: primary
    text: mead-1934-mind-self-society
    citation: "George Herbert Mead, *Mind, Self and Society* (Charles W. Morris ed., University of Chicago Press 1934) — the foundational claim that self and thinking ARE the social process internalized within the organism. Mead's transferable contribution to lex-tjwfn is the deepest version of the recursion-shapes-self claim: thinking does not just USE the model of how others see you, thinking IS the internalized conversation in which one takes the attitude of the 'generalized other' toward oneself. (i) Section 20 'Play, the Game, and the Generalized Other' (pp.152-164): the generalized other is the organized social attitudes of the group as a whole — distinct from the imagined-audience of a particular individual (Goffman's surface). The generalized other arises developmentally through stages: play (taking single roles ad hoc) → game (coordinating multiple roles at once, e.g. baseball) → generalized other (abstracting from particular roles to 'the attitudes of the entire social group toward our common projects'). 'Only by taking the attitude of the generalized other toward himself, in one or another of these ways, can he think at all; for only thus can thinking — the internalized conversation of gestures which constitutes thinking — occur' (p.156). Thinking is constitutively recursive social cognition: 'the more abstract that conversation is, the more abstract thinking happens to be, the further removed is the generalized other from any connection with particular individuals' (footnote p.155). Abstract thought = the limit case where the generalized-other-modeling becomes universal. (ii) Section 22 'The I and the Me' (pp.173-178): the self is split into the responsive 'I' (the spontaneous reactor that 'we are never fully aware of') and the social 'Me' (the internalized organized attitudes of others). Critical claim: 'The I reacts to the self which arises through the taking of the attitudes of others. Through taking those attitudes we have introduced the Me and we react to it as an I' (p.174). The recursive-mind-simulation is not just a feature mind has — it IS the architecture by which the Me arises, and thinking IS the I-Me conversation. (iii) Section 23 (p.178): the constitutive claim made explicit: 'The self is not so much a substance as a process in which the conversation of gestures has been internalized within an organic form... so that they become what we call social attitudes rather than roles of separate individuals.' Mead's relationship to lex-tjwfn's other lineage entries: Mead is the constitutive parent of the Goffman dramaturgical analysis (Goffman's front-stage / back-stage is the surface phenomenology Mead's I/Me dialectic mechanism produces), and the philosophical parent of Premack-Woodruff's cognitive-science theory of mind (which operationalizes Mead's 'taking the role of the other' as a measurable second-order intentionality). Mead's account is more general than either: not just 'modeling another's model of you' (Premack-Woodruff) and not just 'managing presentation for the audience' (Goffman), but mind itself as the internalized social process."
    quote: "It is in the form of the generalized other that the social process influences the behavior of the individuals involved in it and carrying it on, i.e., that the community exercises control over the conduct of its individual members; for it is in this form that the social process or community enters as a determining factor into the individual's thinking. In abstract thought the individual takes the attitude of the generalized other toward himself, without reference to its expression in any particular other individuals; and in concrete thought he takes that attitude in so far as it is expressed in the attitudes toward his behavior of those other individuals with whom he is involved in the given social situation or act. But only by taking the attitude of the generalized other toward himself, in one or another of these ways, can he think at all; for only thus can thinking — the internalized conversation of gestures which constitutes thinking — occur. And only through the taking by individuals of the attitude or attitudes of the generalized other toward themselves is the existence of a universe of discourse, as that system of common social meanings which thinking presupposes as its context, rendered possible. [On the I/Me dialectic, p.174:] The 'I' reacts to the self which arises through the taking of the attitudes of others. Through taking those attitudes we have introduced the 'me' and we react to it as an 'I'. [On the constitutive claim, p.178:] The self is not so much a substance as a process in which the conversation of gestures has been internalized within an organic form... The organization of the social act has been imported into the organism and becomes then the mind of the individual. (Mead 1934, Mind, Self and Society, Univ. of Chicago Press, pp.155-156, 174, 178)"
canonical-instances:
  - "Kurzgesagt T01 recursion explicit: 'We simulate minds simulating minds. We think about what others think. We think about what they think about us thinking about what they think.' The recursion-depth IS the cognitive capacity that distinguishes humans from other minded animals; Kurzgesagt explicitly ties it to moral-conscience emergence and large-scale cooperation"
  - "Frankie T2 sociological surface: 'watching a movie about our lives...everyone else has memorized their lines, rehearsing the lines we say out loud to make our performance believable.' The phenomenology of being-watched-while-performing — what the cognitive recursion produces at the experience-level"
  - "Goffman 1959 dramaturgical analysis: the front-stage / back-stage distinction in everyday social interaction. People present a curated self for the imagined audience and reserve another self for the back-stage. The architecture of having-a-front-stage IS a deployed instance of recursive-mind-simulation: front-stage is 'how I think they think I should look'"
  - "Sally-Anne false-belief task (Wimmer & Perner 1983, Baron-Cohen et al. 1985): the developmental milestone for first-order theory of mind. Children pass at age 4-5; second-order theory of mind ('what does Sally think Anne thinks?') develops around age 7. The recursion depths add at well-defined developmental stages"
  - "code-switching across audiences: a single person speaks differently in family / professional / online contexts. Each context engages a different audience-model that shapes the self-presentation. The audience-modeling is the upstream cause of the surface variation; the variation IS the trace of recursive-mind-simulation"
  - "operationally a specific instance of lex-uz7g4 archetype-as-projective-shorthand: the recursive-mind-simulation produces archetypes (the imagined-audience, the generalized-other, the inner-critic) as projective shortcuts. Archetypes are THIS atom's projective products"
  - "operationally distinct from lex-jvr5p beginner-stance-as-power: beginner-stance is the move of suspending the apparatus; recursive-mind-simulation IS the apparatus. Setting it down (beginner-stance) requires having it (recursive-mind-simulation) as the precondition"
  - "operationally adjacent to lex-5yufs form-persists-when-content-dissolves: when an audience-model becomes outdated (the imagined audience no longer exists / has changed), the self-as-script can persist as form-without-content, performing for an audience that's gone. This is the mechanism behind 'I don't know who I'm performing for anymore'"
critical-questions:
  - "the productive-vs-pathological discrimination: is the recursion productive (calibrating self to context) or pathological (rumination, social-anxiety spirals, audience-paranoia)? Healthy social cognition uses recursion sparingly and for specific decisions; pathological recursion is unbounded and self-feeding. Severity is a function of recursion-depth × frequency × inability-to-disengage. Practitioner-discipline: when recursion exceeds 2-3 levels or persists for hours without yielding a decision, treat as pathological"
  - "the audience-attribution surfacing: whose model of you are you simulating? The imagined audience is not always the actual audience — often it's an internalized parental / cultural / past-self audience that the actual current audience does not match. Surfacing the audience-attribution is a therapeutic move (CBT 'who told you that?'). Practitioner-question: name the specific person or group whose judgment this audience-model represents. If the named audience is absent or no longer foundational, the recursion is misallocated"
  - "the depth-saturation check: at what recursion-depth does the additional level stop yielding actionable information? In most social contexts, 2nd-order ('what does X think Y thinks?') is the practical ceiling — further depth produces diminishing returns and rapidly increasing cognitive cost. Practitioner-discipline: when finding yourself at depth 3+, ask if any deeper level would actually change the decision; if not, truncate"
  - "the disengagement-availability check: can you actually disengage the recursion when you decide to, or has it become non-voluntary? Voluntary recursion is a tool; non-voluntary recursion is rumination. The discriminator: when you direct attention elsewhere (physical activity, absorbing task, conversation), does the recursion stop? If not, the disengagement-pathway is impaired — therapeutic intervention may be needed"
status: active
