id: lex-xj8zk
name: total-transgression-ends-the-transgressive-role-rather-than-expanding-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A figure or role defined by disturbing settled boundaries doesn't get more powerful as disruption becomes universal -- it disappears, because the role only means anything against a background of structures that are mostly stable and only occasionally, meaningfully crossed. Hyde makes this explicit against the tempting modern claim that trickster is everywhere in a world where everyone travels and norms constantly shift: 'The god of the roads needs the more settled territories before his traveling means very much. If everyone travels, the result is not the apotheosis of trickster but another form of his demise.' A boundary-crosser requires the boundary to still be a boundary for most people, most of the time; once transgression is the norm rather than the exception, there's nothing left distinctively transgressive about it. Hyde's fuller point is that the disruptive role needs an actual relationship with the settled powers it disturbs, 'institutions and traditions that can manage the odd double attitude of both insisting that their boundaries be respected and recognizing that in the long run their liveliness depends on having those boundaries regularly disturbed.' Diagnostic move: when a disruptive practice, role, or figure seems to be proliferating everywhere at once, consider whether that proliferation is actually its high point or its dissolution -- a transgressive function depends on the persistence of the norm it transgresses, and universalizing the transgression can quietly eliminate the very thing that made it meaningful."
related: [lex-dzqje, lex-h7z9x]
scaffolds-from: [lex-dzqje]
evokes: [hyde-trickster-makes-this-world-slipping-the-trap-of-appetite, another-form-of-his-demise, boundaries-regularly-disturbed, if-everyone-travels]
lineage:
  - source: primary
    text: hyde-universal-travel-would-mean-tricksters-demise-not-his-apotheosis
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Introduction. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The god of the roads needs the more settled territories before his traveling means very much. If everyone travels, the result is not the apotheosis of trickster but another form of his demise. Here we have come back in a roundabout way to the earlier point: trickster belongs to polytheism or, lacking that, he needs at least a relationship to other powers, to people and institutions and traditions that can manage the odd double attitude of both insisting that their boundaries be respected and recognizing that in the long run their liveliness depends on having those boundaries regularly disturbed."
canonical-instances:
  - "A once-edgy comedy club that built its reputation on a handful of acts willing to break audience expectations starts booking only envelope-pushing acts every single night, and the shock value that made those acts distinctive disappears once transgression becomes the club's entire, predictable format."
  - "An organization's designated internal dissenter, the person everyone expects to push back on groupthink, loses their actual function once leadership starts encouraging everyone to be a contrarian, since the role depended on most people defaulting to consensus most of the time."
critical-questions:
  - "Is Hyde's claim that universal disruption ends the trickster role empirically checkable, or is it closer to a definitional claim about what 'trickster' means that can't really be falsified by observing what happens when everyone transgresses?"
  - "Does this mechanism apply symmetrically to any transgressive role, or are some forms of disruption robust to widespread adoption in a way trickster specifically isn't, because trickster's meaning is relational rather than intrinsic to the specific acts?"
  - "If a society reaches a state where norms genuinely are constantly shifting for everyone, does that actually eliminate the need for boundary-crossing figures, or does it just relocate the boundaries to a different, less obvious level that a new kind of trickster figure might still operate against?"
status: active
