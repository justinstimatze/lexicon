id: lex-qvhbe
name: recruit-the-overlooked-by-naming-what-they-actually-want
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need a force or a following and the obvious candidates have already turned you down, look at whoever's been living in plain sight, overlooked and undervalued, and ask what they actually want -- not what a warrior or a peer would want, but what they specifically prize, given their actual position. In Cushing's telling, an outcast youth, rejected by no one because he was never even considered, recruits an entire town's population of dogs, animals normally driven off with stones, into a private army. He doesn't offer them glory or belonging; he names, with total specificity, the two things his years living among them have taught him they actually value: 'An occasional good feast is one of them; being let alone is another.' No one else courting the maiden's favor had thought to look at the dogs at all, let alone identify what would motivate them, because the dogs weren't in the category of things worth recruiting. The youth's only advantage over every other suitor is that he'd spent his life at the exact social position from which the dogs' actual incentives were visible. Diagnostic move: when you need help and the obvious sources have already declined, look for whoever's presence is so constant it's become invisible, and ask specifically what would motivate them given their actual daily existence, not given the assumptions a person in your own position would normally bring -- the answer is often available only to someone who's spent real time at their level, which is exactly why no one else thought to ask."
related: []
evokes: [the-overlooked-population-has-visible-incentives-only-to-those-at-their-level, cushing-the-warrior-suitor-of-moki, a-good-feast-and-being-let-alone, no-one-thought-to-recruit-the-dogs]
lineage:
  - source: primary
    text: cushing-warrior-suitor-moki-recruits-the-dogs
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Warrior Suitor of Moki.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'My friends and brothers, I am about to go forth on the path of war to the cities of the Zuñis toward the sunrise. If I succeed, my reward will be great. Now, as I well know from having lived amongst you and been one of you so long, there are two things which are more prized in a Dog's life than anything else. An occasional good feast is one of them; being let alone is another. I think I can bring about both of these rewards for you all if you will... join me in my warlike expedition against the Zuñis.'"
canonical-instances:
  - "A startup founder who can't compete for top engineering talent against well-funded rivals recruits a network of overlooked freelancers and career-changers by identifying precisely what this specific population values, flexible hours and meaningful ownership rather than prestige or top-market salary, and builds a competitive team nobody else thought to assemble."
  - "A community organizer unable to mobilize traditional volunteer networks turns to a group of retirees who've been sidelined from civic life, by identifying specifically what they want, purposeful work and social contact rather than any of the incentives that motivate younger volunteers, and builds an effective, dedicated organizing base that established campaigns had never considered approaching."
critical-questions:
  - "does this pattern depend on the recruiter having genuinely spent time among the overlooked group beforehand, as the outcast youth had lived with the dogs his whole life -- can this be done by someone studying a population from the outside, or does it require the specific access that comes from shared marginalization?"
  - "the story frames the youth's use of the dogs approvingly from the Moki side, but the Zuni narrator frames the whole campaign as a source of grief and slaughter -- does recognizing and exploiting an overlooked group's real incentives carry any ethical weight of its own, independent of what the recruited force is then used to do?"
  - "is naming what a group actually wants sufficient on its own, or did the youth's success also depend on already having their trust from years of living alongside them -- would the same accurate diagnosis of incentives work coming from someone with no prior relationship to the group at all?"
