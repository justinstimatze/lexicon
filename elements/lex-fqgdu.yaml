    quote: "No doubt the king of beasts is clever In pottle-making; he would never Destroy what's made with so much pother, Unless he meant to make another.\" ... \"Neither my father nor my mother Nor I myself could make another. What others make, we tear to pieces: The proper way of monkeys, this is!"
canonical-instances:
  - "A manager suspects an employee broke a piece of equipment out of carelessness, but says instead: 'I assume you were testing its load limits on purpose.' The employee corrects the flattering guess and admits plainly they just weren't paying attention."
critical-questions:
  - "Does this tactic risk backfiring by letting a genuinely guilty party simply accept the flattering explanation rather than correct it, if the false motive happens to be more convenient than the truth?"
  - "Is the monkey's correction actually honest self-disclosure, or is it closer to reflexive pride in its own species' nature, unrelated to any deliberate choice to tell the truth?"
