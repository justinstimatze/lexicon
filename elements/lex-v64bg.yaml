id: lex-v64bg
name: visible-deviation-from-group-norms-attracts-correction-pressure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating why someone or something is being targeted, criticized, or 'hammered down' by a group, weight the deru-kugi-wa-utareru pattern surfaced by the Japanese proverb (Deru kugi wa utareru, literally 'the protruding nail will be hammered'): visible deviation from group norms attracts correction pressure proportional to how visible the deviation is, not necessarily to how harmful it is. The mechanism is decoupled from substantive-harm — what triggers the pressure is the SIGNAL of nonconformity, not the cost of the nonconformity. Transferable across many domains: workplace pressure on outliers (the high performer who makes others look bad gets sidelined, not for performance but for visibility), tall-poppy syndrome in egalitarian cultures, social-media pile-ons (the visible target attracts disproportionate response), academic suppression of heterodox-but-correct results, dialect leveling (distinctive features standardize out), homogenization in group decision-making (Janis groupthink). Cross-cultural attestation as evidence: the same pattern appears in Russian 'tall grass gets mowed first,' Australian 'tall-poppy syndrome,' Northern European Jante Law ('do not think you are anything special'), Anglo-American 'don't make yourself a target' — broad cross-cultural surfaces of the same structural mechanism strongly suggest it is a tier-1 cognitive-fit primitive. Operational diagnostic: when someone is being attacked, ask whether the attack is proportionate to actual harm OR proportionate to visibility/deviance. If the latter, you are watching deru-kugi dynamics, and substantive arguments about harm will not resolve it — only changing the visibility profile will. Operational consequence for change-makers: useful novel ideas can be killed simply for being visible; the way to ship them is often to make them invisible or to gradually normalize the deviation before raising visibility. Caveat: the pattern can be HEALTHY (catching actual violations of beneficial norms) or PATHOLOGICAL (leveling beneficial novelty). The atom names the mechanism; whether to invoke or resist it requires judgment about whether the norms being defended are themselves central. Cultural-context note: more pronounced in collectivist cultures and small groups; weaker in individualist cultures and large anonymous groups, though still operative."
