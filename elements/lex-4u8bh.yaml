id: lex-4u8bh
name: keep-the-door-open-for-intelligence
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you discover a sophisticated adversary already has unauthorized access to a system, immediate eviction is not automatically the correct move — it destroys the only channel through which you can learn what they've already done and what they're after, while doing nothing to undo damage that has already, possibly, occurred. Clifford Stoll's The Cuckoo's Egg is the canonical account: days after discovering an unauthorized superuser account on his lab's computer, Stoll reasons through the choice explicitly. 'For a week, our computer was wide open to this hacker. Could we prove that he hadn't tampered with our databases? [...] We couldn't. Trying to shut him out wouldn't work, as he'd only find another way in. We needed to find out what he had done and what he was doing.' The reasoning has two parts: first, closing the hole doesn't retroactively secure what may already be compromised — the exposure already happened; second, a capable adversary who is locked out simply finds another route in, this time invisibly, so eviction trades a MONITORED exposure for an UNMONITORED one rather than eliminating exposure at all. Sustained covert observation is chosen instead, converting the situation from pure loss into a source of intelligence about identity, method, and objective. Generalize beyond this case: counterintelligence 'running' a detected double agent rather than arresting them immediately, in order to map the rest of their network and, eventually, feed them calibrated disinformation; a security operations center leaving a detected intruder inside an isolated, monitored segment of a network rather than immediately terminating the session, so their tools and objectives can be captured before they can be redeployed against an unmonitored target. The tradeoff is real and time-limited, not a universal rule: it holds only while the marginal intelligence value of continued observation exceeds the marginal harm of continued access, and that balance has to be re-evaluated as the exposure continues, not decided once and forgotten."
related: [lex-th6tr]
evokes: [wide-open-to-this-hacker, trying-to-shut-him-out-wouldnt-work, sustained-covert-observation, eviction-destroys-the-channel, run-not-arrest]
