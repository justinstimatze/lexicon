id: lex-ctj2g
name: modeling-an-adversarys-competing-priorities-calms-a-trapped-group
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A group cornered by an adversary can be genuinely calmed by a leader who models the adversary's other constraints and obligations, rather than merely reassured by a leader who promises an escape that doesn't yet exist. In the Jataka's tale of the monkeys trapped in a tree by armed villagers until dawn, the chief doesn't claim they'll be safe — he reasons aloud about the besiegers' own situation: 'Fear not; human beings have plenty to do. It is the middle watch now; there they stand, thinking--'We'll kill them!' but we will find some other business to hinder this business of theirs.' The comfort isn't manufactured optimism; it's a specific, falsifiable claim about what will pull the adversary's attention elsewhere, which the troop can actually evaluate rather than just choose to believe."
related: []
evokes: [jataka, dukanipata, tinduka-jataka, reasoning-about-an-adversarys-other-obligations-calms-a-group, falsifiable-comfort-beats-manufactured-reassurance]
