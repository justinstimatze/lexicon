id: lex-zbncd
name: rising-credential-bar-closes-internal-mobility-and-imports-class-cleavage
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When a field's operating positions come to require formal technical credentials that were not previously required, check for two effects landing together rather than separately: the informal channel of promotion-from-within (rising through the ranks on demonstrated skill) closes, AND — if access to the new credential is itself unevenly distributed across social strata — the newly credentialed entrants are increasingly drawn from strata already remote from the people they will now supervise, importing an external class cleavage into what had been an internal hierarchy of experience. Merton: 'Advances in methods of production, as Elliott Dunlap Smith and Robert S. Lynd, among others, have observed, may enlarge the social cleavage between workmen and operating executives. It may produce a sharper social stratification of industry.' He then traces the specific mechanism through educational access: 'To the extent that opportunities for higher education are socially stratified, moreover, managers come increasingly to be drawn from social strata remote from those of workers. Also, since technically trained personnel enter industry at a relatively high level, they have little occasion to share the job experience of workers at an early stage of their careers and tend, accordingly, to have an abstract knowledge about rather than a concrete acquaintance with the perspective of workers.' Diagnostic use: when a field professionalizes by adding a credential requirement, don't evaluate the change only on whether the credential improves competence — separately ask (a) whether it closes a promotion channel that previously let experienced non-credentialed people rise, and (b) whether access to the credential itself tracks existing social stratification; if both are true, the field should expect growing distance in outlook between its newly credentialed leaders and its front-line workers, independent of any individual leader's good intentions."
