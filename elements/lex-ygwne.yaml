id: lex-ygwne
name: internally-divided-primary-groups-let-the-wider-community-decide
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When predicting how someone will vote, decide, or behave under competing influences, don't just ask 'what do their close friends and co-workers think' — check first whether that immediate circle actually agrees among itself, because the answer changes which layer of social influence actually wins. Merton reports the Elmira voting study's finding as a structural condition, not a personality difference: 'When the primary group of friends or co-workers is united in political opinion, then the respondent's vote is firm... When Democratic primary groups are \"solid,\" the party vote is not significantly lower than for \"solid\" Republican groups... The strong community majority for the Republicans has little effect because it has little access to persons within homogeneous Democratic groups.' A unanimous immediate circle is nearly insulated from the surrounding community's majority opinion. But: 'when the primary environment is internally divided the effect of the distant community can be seen. Then the Republicans get a higher proportion of the vote... The impact of the larger community is thus most evident among voters with discordant or disagreeing primary groups. When the voter's close associates do not provide him with a single, clear political direction... then wider associations in the surrounding community reinforce one position over the other.' Merton and the study's authors name the resulting asymmetry the 'breakage' effect, borrowing the term from pari-mutuel betting: 'the odd pennies left over-the breakage-go to the track or to the state in the background... the breakage in small-group adjustment goes to the Republican community... over a period of time it is considerable.' Diagnostic use: a person's immediate reference group only functions as an insulating layer against the wider society's dominant opinion when it speaks with one voice; the moment it is internally split, the tie doesn't go to a coin flip, it goes disproportionately to whichever position the surrounding, larger community already favors. This means the same close-knit circle can be either a strong shield against majority pressure or an open conduit for it, depending entirely on whether its own members agree — and organizers or persuaders looking to shift outcomes should target getting a foothold inside currently-unanimous groups (to create the internal split that then lets the surrounding majority do the rest of the work), rather than trying to out-argue the surrounding majority directly."
