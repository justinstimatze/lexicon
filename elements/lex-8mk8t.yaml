id: lex-8mk8t
name: a-cultures-founding-story-sets-its-descendants-orientation-to-nature
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Two populations can occupy the same physical world and face the same ecological facts. What diverges between them can still be which origin story shaped their ancestors, independent of any difference in the information each population actually has. Kimmerer's example: the Skywoman story gives a garden made for everyone's well-being, received as a gift. The Genesis story gives a garden lost through transgression, land that has to be subdued to survive. She reads these as the root of two divergent orientations toward the living world, stewardship on one side and domination on the other. The claim runs strong: descendants inherit the orientation even without ever consciously hearing or believing the founding story, carried instead by the cultural practices and assumptions the story originally shaped."
related: [lex-7yemm]
evokes: [kimmerer, braiding-sweetgrass, skywoman, comparative-cosmology, origin-story-as-orientation]
lineage:
  - source: primary
    text: kimmerer-2013-braiding-sweetgrass-skywoman-falling
    citation: "Robin Wall Kimmerer, Braiding Sweetgrass (Milkweed Editions, 2013), 'Skywoman Falling' (opening chapter). Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "On one side of the world were people whose relationship with the living world was shaped by Skywoman, who created a garden for the well-being of all. On the other side was another woman with a garden and a tree. But for tasting its fruit, she was banished from the garden and the gates clanged shut behind her. ... Same species, same earth, different stories. Like Creation stories everywhere, cosmologies are a source of identity and orientation to the world. They tell us who we are. We are inevitably shaped by them no matter how distant they may be from our consciousness. One story leads to the generous embrace of the living world, the other to banishment."
canonical-instances:
  - "Kimmerer's own classroom anecdote: twenty years of environmental-science students, asked to name a beneficial relationship between people and the environment, could not think of a single one — offered as the diagnostic symptom of inheriting the second orientation without ever having read Genesis."
  - "operationally distinct from lex-7yemm (Lévi-Strauss, a single myth internally resolving a real contradiction via structural transformation into a mediating term): this atom compares two separate myths against each other, and its claim concerns downstream behavioral orientation, a different move than resolving a logical tension inside one narrative."
critical-questions:
  - "Is the causal link between founding myth and later practical orientation actually demonstrated, or narratively plausible — could the same divergent land-use patterns trace to independent ecological or economic factors that happened to correlate with which story a culture told?"
  - "Does crediting one story with generating stewardship and the other with domination oversimplify either tradition — Christian environmental theology and Indigenous extractive practices both exist, complicating a clean mapping?"
  - "If a founding story sets downstream orientation independent of conscious belief, what carries it — is the transmission mechanism embedded in language, in specific cultural practices, in institutions, or something Kimmerer leaves unspecified?"
status: active
