id: lex-8v6ea
name: success-cannot-prove-safety-margin-only-failure-can-disprove-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you're assessing whether a design, system, policy, or practice is actually safe based on its track record, recognize Petroski's central claim (1985): a standing structure and a collapsed one are not symmetric evidence. Treat every engineering design as an implicit HYPOTHESIS — 'this arrangement will not fail under intended use.' A failure DISPROVES that hypothesis outright and with certainty: it shows incontrovertibly, and often precisely, where the assumptions broke down (the exact wind speed, the exact load, the exact connection detail). A success, by contrast, only CONFIRMS the hypothesis the way the sun rising confirms it will rise again tomorrow — repeated non-failure raises your confidence but never proves the structure is not, in fact, standing at 99% of its actual capacity. The asymmetry is total: you cannot read a design's real margin of safety off its history of not-yet-failing. Operational consequence #1 (single case): don't treat 'N years without incident' or 'N successful launches/deployments/uses' as evidence that the margin is adequate — it is evidence only that the margin has not yet been exceeded, which is a much weaker claim. Look instead for near-misses, nagging incidents, and dismissed engineering doubts (Petroski's Challenger case: a 'perfect string of successful launchings' was explicitly used by managers to overrule engineers' specific, correct doubts about O-ring performance in cold weather — the doubts were the only signal pointing at the true margin, and the string of successes was actively misleading). Operational consequence #2 (field/historical cycle): because success is uninformative about margin while failure is precisely informative, whole disciplines learn almost entirely from their failures, not their successes — engineers push designs more daring in the wake of a run of successes (lower factors of safety, longer and slenderer spans, given confidence that 'we know this now'), until a failure recalibrates the field's actual understanding of the limit, producing a new, more conservative safety margin, which is then eroded again by the next run of successes. This is a structural, field-level, cross-generational pattern, not a single decision-maker's technique. Practitioner moves: (i) before crediting a track record as evidence of safety, ask what would have had to happen for you to observe a DIFFERENT track record under the same actual margin — if the answer is 'nothing, a wide range of true margins produces the same observed success,' the track record is not informative; (ii) treat a lengthening string of unbroken successes in any domain (software uptime, financial-model backtests, medical-device trials, organizational-process reliability) as a prompt to actively distrust complacency and look for where margins have quietly been shaved, not as reassurance; (iii) seek out the dismissed doubts, nagging incidents, and near-misses that a success-only read of history discards — they are the closest thing to a failure signal that hasn't yet fully happened; (iv) when a failure does occur, treat it as the highest-value data your field will get about where the real limit is, and update margins accordingly rather than treating it as a fluke to be explained away. Distinct from lex-kyc5a (Graham's margin-of-safety): Graham's atom is PRESCRIPTIVE and PRICING-focused — build a cushion into a single commitment so that being wrong about the future still leaves you whole; it doesn't matter whether you ever learn your true margin, because you priced for the adverse case up front. This atom is DESCRIPTIVE and EPISTEMIC — it's a claim about what a design's own history of success or failure can and cannot tell you about the margin that was actually built in, and about the field-wide historical dynamic that results. They compose: Petroski explains why you can't infer your realized margin from a success streak, which is exactly why Graham says to price the cushion in up front rather than relying on a forecast (or a track record) to tell you it's fine. Distinct from lex-eb3wf (Klein's premortem): premortem is a PROSPECTIVE technique — imagine failure before acting, to surface unvoiced risks in a single planning session. Petroski's claim is RETROSPECTIVE and HISTORICAL — it describes how an entire field's actual knowledge of its safety margins gets generated after the fact, through real failures, not through anyone's imagination of failure in advance. A premortem can surface some imaginable failure modes, but per Petroski it cannot substitute for the information content of an actual failure, because the imaginable failure modes are, by construction, the ones the team can already conceive of — exactly the critical-questions boundary lex-eb3wf itself names. Distinct from lex-tfpzb (survivorship bias): survivorship bias is a SAMPLING-FRAME error — across a POPULATION of cases (funds, planes, founders), looking only at the survivors and drawing a conclusion, when the eliminated cases (that didn't survive) are the informative ones. Petroski's claim holds even for a SINGLE case with no missing-population problem at all: one single standing bridge, examined on its own, still tells you nothing about its own margin, because success and failure are asymmetrically informative about THAT bridge's actual state, not because a sample was filtered. They're structurally adjacent (both turn on 'what you can't see is where the real information is') but the locus of the effect differs: survivorship bias lives in the sample; Petroski's asymmetry lives in the single design's own evidentiary content. Distinct from lex-rqbsr (Taleb's black swan): black-swan events are defined by being outlier, high-impact, AND retrospectively-narrativized-as-foreseeable; Petroski's claim doesn't require the failure to be a rare tail event or later mis-explained as inevitable — routine, well-understood, entirely foreseeable-in-principle failures (a bridge collapsing from a load exactly at its calculated failure point) still carry the same asymmetric-informativeness property. Distinct from lex-wgd7u (Schultz-Dayan-Montague, learning tracks prediction error not outcome): genuinely adjacent at the mechanism level — both claims say a system's cumulative knowledge is updated by violated expectation, not by confirmation of it. But lex-wgd7u is a claim about individual neural learning-rate signals (dopaminergic reward-prediction-error in a brain), while this atom is a claim about a discipline's collective, historical, institutional learning across generations of engineers and structures. Composes: Petroski's field-level pattern is what an RPE-style learning rule looks like scaled up to an entire profession's accumulated case-law. Distinct from lex-egkjk (Diamond, shifting-baseline / creeping normalcy): lex-egkjk explains why a SLOW, CONTINUOUS degradation goes unnoticed (each observer's baseline updates to the current, slightly-worse state). Petroski's claim doesn't require any degradation at all — a structure can be built once, never change, and STILL be uninformative about its margin merely by virtue of having not yet failed. They compose in cases like Challenger: shifting-baseline explains why repeated O-ring erosion incidents got normalized as acceptable; Petroski's asymmetry explains why the run of successful launches was independently, and more fundamentally, incapable of proving the design safe in the first place."
