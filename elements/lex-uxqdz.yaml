lineage:
  - source: primary
    tradition: boehm-political-anthropology
    text: boehm-1999-hierarchy-in-the-forest
    citation: "Christopher Boehm, Hierarchy in the Forest: The Evolution of Egalitarian Behavior (Harvard University Press, 1999), Chapter 4 ('Reverse Dominance Hierarchy')."
    quote: "In despotic social dominance hierarchies the pyramid of power is pointed upward, with one or a few individuals (usually male) at the top exerting authority over a submissive rank and file. In egalitarian hierarchies the pyramid of power is turned upside down, with a politically united rank and file decisively dominating the alpha-male types."
  - source: primary
    tradition: boehm-political-anthropology
    text: boehm-1999-hierarchy-in-the-forest
    citation: "Christopher Boehm, Hierarchy in the Forest: The Evolution of Egalitarian Behavior (Harvard University Press, 1999), Chapter 1 ('Antihierarchy thesis')."
    quote: "egalitarian societies amount to hierarchies in which the flow of power has reversed direction quite radically. […] I believe that if a stable egalitarian hierarchy is to be achieved, the basic flow of power in society must be reversed definitively."
  - source: primary
    tradition: boehm-political-anthropology
    text: boehm-1999-hierarchy-in-the-forest
    citation: "Christopher Boehm, Hierarchy in the Forest: The Evolution of Egalitarian Behavior (Harvard University Press, 1999), Chapter 3 ('Intentional egalitarian societies')."
    quote: "Band members regularly create and maintain egalitarian blueprints for social behavior, 'plans' that are implicit or (in part) explicit in the ethos and well understood by the rank and file who implement them."
canonical-instances:
  - "!Kung San and other Kalahari hunter-gatherer bands — successful hunters are ridiculed and their kills socially diminished ('insulting the meat') precisely to block status-accumulation that would seed dominance."
  - Quaker meetings — explicit anti-hierarchical norms enforced by silence-as-rebuke, refusal-of-honorifics, and consensus-based decision rules; the structure is maintained, not assumed.
  - Mennonite and Hutterite communities — Wilson and Sober (1994) emphasis on 'militant concern for avoiding any development of individual authority or other individual advantage within the group.'
  - Open-source maintainer communities at flagship projects — when a maintainer over-reaches, the rank and file fork the project (the leveling mechanism); the threat-of-fork keeps would-be dominants in check.
  - Academic department dynamics where senior faculty exercise leveling against any one professor accumulating disproportionate influence; tenure-track structure mediates the leveling.
  - Tech startup founder ejection events — when a charismatic founder over-reaches, the rank-and-file coalition (sometimes including the board) ejects them; the events that fail (founder consolidates control) reveal which leveling mechanisms had decayed.
  - Online communities where collective downvoting or ban-by-popular-petition keeps would-be alpha posters in check; when those tools weaken (algorithm change, moderator capture), the despotic structure reasserts.
