evokes: [radin-the-winnebago-trickster-figure, wakdjunkaga-and-polecat, the-problem-is-simply-solved-he-must-waste-these-provisions, without-any-reason-he-persuades-himself]
lineage:
  - source: primary
    text: radin-wakdjunkaga-wastes-polecats-gift-rather-than-risk-succeeding
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Figure.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Wakdjunkaga is now faced with a new situation. In the case of his visits to muskrat, snipe and woodpecker ( 41 - 43 ), all he had to do to get himself into difficulties and inflict pain upon himself was to imitate them. But now, provided with the means for really accomplishing what his host, polecat, had done, how was he to fail, for fail he must? The problem is simply solved: he must waste these provisions. So, without any reason, he persuades himself that polecat has deceived him, and he shoots at four objects in succession blowing them to pieces -- at a knoll, at a tree, at an enormous rock and at a rocky precipitous hill, the last the symbol of a sacred precinct."
canonical-instances:
  - "A writer who has always blamed a lack of connections for never finishing a manuscript gets a genuine offer of mentorship and a realistic deadline from an editor, then abruptly picks a fight with the editor over a minor note and walks away from the deal, rather than finding out whether they could finish it with real support."
  - "A salesperson who has always blamed bad leads for missing quota gets handed a list of genuinely strong, pre-qualified leads, and spends the quarter convinced the list must be flawed somehow, working it half-heartedly rather than risk discovering their previous excuse wasn't the real explanation."
critical-questions:
  - "Is Radin's reading of Wakdjunkaga's motivation, that failure is structurally required and he unconsciously arranges to preserve it, a claim the text itself supports, or is it Radin's own psychoanalytic framework filling in a motivation the narrative leaves genuinely unexplained?"
  - "Would this diagnostic apply equally to someone who wastes a genuine opportunity for reasons unrelated to protecting a failure-based identity, and how would an outside observer distinguish authentic incompetence or bad luck from this specific self-protective waste?"
  - "Does the manufactured grievance against the benefactor, blaming polecat for deceiving him, serve any function beyond justifying the waste, or does it also protect the relationship with the benefactor by giving a face-saving reason not to use the gift rather than admitting the real reason?"
