id: lex-duz8k
name: a-system-needs-all-four-functional-roles-and-a-controllable-part-to-work-at-all
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before trying to improve or troubleshoot a system, check two more basic things first: does it actually have all the functional roles a working system requires, each performing at least adequately, and does it have at least one part that can actually be adjusted — because a system missing either of these can't be fixed by improving what IS there, no matter how well the existing parts perform. Altshuller states this as the first 'law of statics': 'A necessary condition for the living capability in principle of technical systems is the presence and minimal functioning power of the basic parts of the system. Each technical system must include four basic parts: an engine, a transmission, a working organ and an organ of steering.' The requirement is strict and non-compensating: 'a technical system is capable of life if all its parts do not have a \"bad mark\"... If at least one part is given a \"bad mark\" the system is incapable of life even if all the other parts are given \"top marks.\"' — he explicitly draws the parallel to Liebig's 19th-century law of the minimum in biology, where a single deficient nutrient limits growth regardless of how abundant every other nutrient is. A direct, practically important corollary follows: 'For a technical system to be controllable it is necessary for at least one of its parts to be controllable' — meaning you cannot gain any control over a system built entirely from fixed, unadjustable parts; you have to introduce a genuinely controllable part before any control is possible at all. His worked example is sealing pharmaceutical ampoules with burners: the ampoules themselves can't be altered and the burners are only weakly adjustable, so no amount of tuning the existing two elements produces reliable sealing — the actual fix introduces a third element (a water bath around the ampoules) whose level and temperature CAN be freely controlled, and that new controllable element is what finally makes the whole system controllable, not any improvement to the ampoules or burners themselves. Diagnostic move: when a system misbehaves or resists improvement, first check for a genuinely missing or non-functional role (something has to generate the driving action, something has to transmit it, something has to do the actual work, something has to steer/regulate it) before assuming the fix lies in refining what's already present; separately, check whether ANY part of the system can currently be adjusted at all — if none can, the fix is not to tune anything, but to introduce a new element solely for the purpose of giving the system a controllable handle."
related: [lex-uq4xw, lex-mnxhs]
evokes: [law-of-completeness-of-parts, engine-transmission-working-organ-steering, liebigs-law-of-the-minimum, controllability-corollary, ampoule-sealing-water-bath-example]
lineage:
  - source: primary
    text: altshuller-1984-law-of-completeness-of-parts
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.7 'The Strategy of Invention,' section 'Laws of Development of Systems.'"
    quote: "'1. The law of the completeness of parts of the system. A necessary condition for the living capability in principle of technical systems is the presence and minimal functioning power of the basic parts of the system. Each technical system must include four basic parts: an engine, a transmission, a working organ and an organ of steering... a technical system is capable of life if all its parts do not have a \"bad mark\", and at the same time the \"overall mark\" is given according to the quality of work of a given part in the overall system. If at least one part is given a \"bad mark\" the system is incapable of life even if all the other parts are given \"top marks.\" A similar law applied to biological systems was formulated by Liebich in the mid-nineteenth century (\"the law of the minimum\").'"
  - source: primary
    text: altshuller-1984-controllability-corollary-ampoules
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.7, 'Laws of Development of Systems.'"
    quote: "'For a technical system to be controllable it is necessary for at least one of its parts to be controllable... 'To be controllable' means changing its properties in a way required by the controller... Given is a system consisting of two non-controllable parts: the ampules are uncontrollable in general — it is impossible (inconvenient) to change their characteristics, and according to the specifications of the problem the burners are badly susceptible to control. Clearly solution of the problem will consist of introducing into the system one further part... Let us arrange the ampules in water in such a way that only the tips of the capillaries appear above the surface... The system acquires controllability: one can change the level of the water — which ensures an alteration in the boundary between hot and cold zones. One can change the temperature of the water — this ensures stability of the system during the working process.'"
canonical-instances:
  - "A customer-support process has excellent agents (working organ) and clear scripts (transmission) but no mechanism for anyone to decide WHEN to escalate an unusual case (no steering organ) — training the agents harder or rewriting the scripts further can't fix this, because the missing role, not the quality of the existing roles, is the actual limit."
  - "A team wants to make a legacy batch-processing pipeline more responsive to changing priorities but every existing component (data source, transform logic, output sink) is hard-coded and fixed; no amount of optimizing those fixed parts creates responsiveness — the fix is introducing one new, genuinely adjustable parameter (a priority queue, a config flag) purely to give the system something a controller can actually change."
  - "operationally distinct from lex-uq4xw an-object-cannot-change-itself-add-the-instrument-and-the-coupling-field: that atom is about a system missing the instrument+field needed to ACT ON a target at all; this atom is broader and stricter — it requires ALL FOUR functional roles (not just instrument and field) to be present and minimally working, and separately requires at least one part to be adjustable for the system to be controllable in the first place, which is a distinct claim from simply having a complete acting mechanism."
critical-questions:
  - "how would someone map an arbitrary system (organizational, biological, software) onto the four roles (engine, transmission, working organ, steering) when the mapping isn't as clean as it is for a physical machine — is the four-part taxonomy specific to mechanical/technical systems, or does it generalize cleanly to other kinds of systems?"
  - "the law says a missing or failing part makes the WHOLE system non-functional regardless of the other parts' quality — but are there real systems with partial degradation tolerance, where a weak or partially-functioning part still allows the system to work at reduced capacity rather than not at all, which this all-or-nothing framing would misdiagnose?"
  - "when introducing a new controllable part (as with the ampoule water bath), how does someone choose WHICH new element to add and what property of it to make controllable — the law establishes that SOME controllable part is necessary, but doesn't by itself say which controllable addition will actually solve the specific problem at hand?"
status: active
