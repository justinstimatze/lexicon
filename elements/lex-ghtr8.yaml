id: lex-ghtr8
name: compliance-floor-tracks-auditor-bandwidth-not-real-adequacy
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Cauldwell, a working electrician writing a residential-wiring manual, opens by separating two standards a job could meet: 'minimum code,' the legally required floor, and his own higher personal standard he calls 'Above Code.' He explains why the floor sits where it does: 'Minimum code means exactly that—it's the absolute minimum required to pass inspection... on today's jobs even minimum codes are not always enforced. Most inspectors are backlogged and overworked. They do not have the time to fully inspect every house—they only have time to look for obvious violations. They cannot trace every wire and look inside every electrical box. Inspectors do very good work for the time allotted—but there is never enough time.' The diagnosis: the legal minimum is set where it is because that's what a rushed inspector can actually verify inside a fixed visit, not because a house wired exactly to that floor is genuinely as safe as one could reasonably make it. His own example makes the gap concrete: a bathroom circuit can legally carry the lights, the fan, the heater, and even share the GFCI with the light -- so a hair dryer trips the breaker and the room goes dark with someone standing on a wet floor, and every part of that circuit passed inspection. His fix is to build to a self-set standard above the floor, aimed at what the house's actual occupant would want over years of use rather than at what a walkthrough could catch that day. Transferable diagnosis: whenever a domain has a formal minimum enforced by inspection, review, or audit, that minimum is shaped by two different forces that are easy to conflate -- what the domain genuinely requires, and how much an auditor operating under real time and attention constraints can actually check. Picture the same shape in software review: a reviewer who has time to read a diff and confirm the test suite is green, but not to trace the new code against every existing caller, ends up treating 'approved, tests green' as the definition of safe to merge -- and a compliance audit that samples ten records out of ten thousand produces a similarly shaped floor, calibrated to what sampling can reach rather than to what the full ledger actually contains. In both cases the resulting standard inherits the checker's own visibility limit as a permanent feature of the system built to satisfy it. Diagnostic move: before treating 'it passed the audit/review/inspection' as evidence of adequacy, ask what the auditor's actual constraints were -- time per unit, sampling rate, what tooling can reach -- and whether the gap between 'checkable' and 'actually adequate' has quietly become the working definition of done."
