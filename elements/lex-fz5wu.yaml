id: lex-fz5wu
name: naming-unlike-phenomena-with-one-term-implies-a-single-cause
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a research literature, a diagnosis, or a policy debate uses one blanket term ('crime,' 'delinquency,' 'addiction,' 'burnout') to cover a wide range of behavior, check whether the term's users have quietly started assuming a single underlying cause and a single fix — an assumption the name itself smuggled in, not one anyone argued for. Merton's own theory of anomie was built to explain only one slice of what gets called 'delinquency' (the innovation-type response to blocked goals), and he explicitly names the failure mode of expecting it to explain all of it: 'the decision to encompass a wide array of behavior in the one rubric of crime or delinquency tends to lead to the assumption that a single theory will account for the entire range of behavior placed in this category.' His analogy: assuming a single 'theory of disease' rather than distinct theories for tuberculosis, arthritis, and syphilis, just because they all get called 'disease.' The diagnostic move: before accepting or building a single explanatory account for everything a blanket term covers, ask whether the term is a genuine natural kind or an administrative/legal convenience (like 'crime,' which groups things by which code section they violate, not by mechanism) — and if it's the latter, expect that a good theory will only ever explain a slice of it, the way Merton's does."
related: [lex-2vpet, lex-hzrue]
scaffolds-from: [lex-2vpet, lex-hzrue]
evokes: [merton-1957, blanket-concept, one-rubric-of-crime-or-delinquency, benjamin-rush-and-john-brown, single-overarching-theory-of-disease, aubert-white-collar-crime]
lineage:
  - source: primary
    text: merton-1957-aubert-crime-incoherence
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. V 'Continuities in the Theory of Social Structure and Anomie,' p.176, quoting Vilhelm Aubert on the incoherence of 'crime' as a legally-defined but mechanistically ungrounded category. The lead-in clause naming 'the legal definition of crime' is dropped rather than reproduced: the source drops a letter at the exact line-wrap seam between 'definition o' and 'crime,' so the retained span begins at Merton's own mid-quotation ellipsis, where the text becomes unambiguous."
    quote: "'... probably [represents] little in common between all the phenomena covered by the concept. And the same seems to be true of white collar crime.'"
  - source: primary
    text: merton-1957-blanket-concept-of-disease
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.177, Merton's own commentary following Aubert and Albert K. Cohen's parallel observation about 'juvenile delinquency' as a treated-as-unified category. A transcription artifact inverts 'it was' to 'is was' immediately after 'medical systematists to believe that'; that short span is elided with an ellipsis rather than reproduced. The source's own stray/missing quotation marks around 'juvenile delinquency' and 'its' are normalized to double quotes for YAML safety, per house convention; no wording is changed."
    quote: "'Furthermore, the decision to encompass a wide array of behavior in the one rubric of crime or delinquency tends to lead to the assumption that a single theory will account for the entire range of behavior placed in this category. This is not too remote, in logical structure, from the assumption of a Benjamin Rush or a John Brown that there must be a theory of disease, rather than distinct theories of disease-of tuberculosis and arthritis, of Mèniere's syndrome and syphilis. Just as classifying enormously varied conditions and processes under the one heading of disease led some zealous medical systematists to believe that ... their task to evolve a single over-arching theory of disease, so, it seems, the established idiom, both vernacular and scientific, of referring to \"juvenile delinquency\" as though it were a single entity, leads some to believe that there must be a basic theory of \"its\" causation.'"
canonical-instances:
  - "'Burnout' covers at least three distinct mechanisms — chronic understaffing, a values-mismatch between the worker and the institution, and straightforward physiological exhaustion — and a single company wellness program built on a single theory of 'what burnout is' will help whichever slice it happens to target and do nothing for the other two."
  - "'Addiction' applied uniformly across substance dependency, behavioral compulsions (gambling, gaming), and heavy social-media use invites a single dopamine-hijack etiology that fits some cases well and others only by analogy, the same way 'crime' fits armed robbery and unlicensed lemonade stands only by sharing a legal label."
  - "operationally distinct from lex-2vpet a-category-can-be-held-together-by-crisscrossing-similarities-rather-than-a-shared-essence (Wittgenstein): that atom says a category CAN be coherently held together by overlapping family-resemblance features even without a single shared essence. This atom names the separate, further error of assuming a shared essence or cause exists BECAUSE a name exists — some blanket terms (like the legal category 'crime') aren't family-resemblance categories either; they're administrative groupings with no unifying structure at all, and expecting even a family-resemblance-style unified account is still a category error."
critical-questions:
  - "How do you tell a 'genuine natural kind with diverse presentations' from a 'pure blanket term with no shared mechanism at all'? Merton doesn't offer a test; he only flags the failure after Cohen points out that the anomie theory explains professional theft well but not the non-utilitarian vandalism and 'wholesale negativism' of some delinquent gangs."
  - "Does splitting a blanket concept into narrower categories risk the opposite error — proliferating so many micro-categories that no theory can ever accumulate evidence across cases, and every finding becomes a one-off?"
status: active
