id: lex-ddcvm
name: unadorned-self-acknowledgment-beats-self-righteousness-built-on-comparison
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A person's stated righteousness, when it's built by explicit comparison to a worse other, ranks lower than an unadorned admission of unworthiness that makes no comparison at all — a Pharisee's prayer lists his own virtues against a nearby publican's vices, while the publican simply asks for mercy on himself as a sinner, without reference to anyone else. The comparison itself is what discredits the first prayer; it isn't that the Pharisee's listed virtues are false, it's that the act of measuring them against someone else's worse conduct is doing the self-justifying work instead of any actual self-examination."
related: []
evokes: [kjv, the-pharisee-and-the-publican, god-i-thank-thee-that-i-am-not-as-other-men-are, god-be-merciful-to-me-a-sinner, justified-rather-than-the-other]
lineage:
  - source: primary
    text: kjv-1611-luke-18-pharisee-and-publican
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), Luke 18:11-14. Verified verbatim against a direct extraction of the held copy."
    quote: "The Pharisee stood and prayed thus with himself, God, I thank thee, that I am not as other men are, extortioners, unjust, adulterers, or even as this publican. [...] And the publican, standing afar off, would not lift up so much as his eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner. I tell you, this man went down to his house justified rather than the other: for every one that exalteth himself shall be abased; and he that humbleth himself shall be exalted."
canonical-instances:
  - "In a performance review, one candidate frames their year entirely against a struggling teammate's shortfalls, while another simply names their own two biggest misses without mentioning anyone else — reviewers consistently trust the second self-assessment more, even when the first candidate's actual output was objectively stronger."
critical-questions:
  - "Is a comparison-free self-assessment actually more trustworthy here, or does refusing to compare just as easily hide a real accomplishment gap that a direct comparison would have surfaced honestly?"
status: active
