id: lex-cpq3s
name: voters-punish-incumbents-for-suffering-regardless-of-causal-responsibility
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating democratic accountability — whether voters reward and punish leaders based on what those leaders actually did — assume the answer is mostly NO. Achen and Bartels (2017) documented that voters punish incumbents for events demonstrably outside any leader's control: droughts, floods, shark attacks (Wilson 1916 New Jersey shore — voters in counties where sharks attacked swam away from the incumbent), measles outbreaks, sports-team losses. This 'blind retrospection' is the operational meaning of retrospective voting: when in pain, voters kick the dog within reach, which is the incumbent. The 'folk theory of democracy' — that voters assess candidates' policies, weigh evidence, and choose by considered judgment — is empirically false; voters mostly group-identify and rationalize, then retrospect blindly. Operational consequences: (1) democratic outcomes are far more random than the folk theory predicts — competence has weaker selection pressure than expected because random pain shocks confound signal; (2) the incentive to govern well is correspondingly attenuated — diligent incumbents get punished for bad luck almost as often as negligent ones; (3) leaders who can attribute their pain to a scapegoat outperform leaders who cannot — the available causal narrative gets accepted faster than the technically correct one; (4) policy quality is loosely coupled to election outcomes; the tighter coupling is between voters' moment-of-vote subjective welfare and their attribution-by-narrative-availability. Inverse: the rare cases where causal attribution IS clear and salient (a leader's personal scandal, a war they started by name) do see proper signal; the failure mode is the generic 'incumbent owns the economy' attribution which is mostly luck. Transferable diagnostic in any principal-agent system relying on retrospective performance reviews: ask whether the principal can disentangle agent-contribution from luck. If not, accountability is mostly blind and the agent's incentive is to minimize visible pain regardless of underlying competence."
