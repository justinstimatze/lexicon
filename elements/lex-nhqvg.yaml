id: lex-nhqvg
name: what-stays-constant-across-independent-tellings-marks-the-original-core
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When the same core figure or story shows up across many independently-developed traditions, the traits that stay constant everywhere are your best evidence of the original, oldest layer, while the traits that vary from place to place, especially ones that consistently look like later additions or upgrades, are evidence of local, secondary reconstruction rather than shared ancestry. Radin builds his case for what belongs to the 'original' trickster cycle exactly this way: across the Winnebago, Tlingit, Haida, Gros Ventre, Blackfoot, Assiniboine and more, the specific claims to divine status vary enormously, some tribes attempt it and struggle, others displace the figure from godhood entirely, others never bother. From this pattern of inconsistency he concludes: 'Trickster's divinity is always secondary and that it is largely a construction of the priest-thinker, of a remodeller.' What's left after stripping the locally-variable divinity claims is a core that is consistent everywhere: 'an account of a nondescript person obsessed by hunger, by an uncontrollable urge to wander and by sexuality.' The variable material isn't wrong or fake -- it's just demonstrably later, because if it were original, independent traditions with no contact with each other wouldn't have handled it so differently. Diagnostic move: when trying to identify what's original versus later addition in a tradition, practice, or story that shows up across many independent groups, look at what's genuinely constant across all of them versus what varies group to group in ways that look locally motivated -- the constant core is your best evidence for antiquity, and the variable overlay is your best evidence for later, separate reconstruction."
