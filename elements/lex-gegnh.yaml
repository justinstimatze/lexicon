id: lex-gegnh
name: commitment-crystallizes-at-the-first-available-overt-act
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When a population's self-reported 'moment I decided X' clusters tightly around one age, milestone, or institutional checkpoint, do not conclude that everyone's private resolve genuinely converged there at the same time — check whether the checkpoint is simply the first point at which a forming, private intention becomes expressible as a concrete act. Rogoff found the age at which University of Pennsylvania medical students first thought of a medical career was widely and evenly spread out, with no real concentration anywhere in the range. But the age at which the same students reported a definite decision concentrated sharply, with the mean, median, and mode all landing at 18: 'Unlike the wide dispersion in the age at which medicine is first considered, the age at making the definite decision shows a marked concentration, occurring during the 16 to 20 year age period.' Her explanation for the concentration is structural, not psychological: 'The career decision, it would appear, is most frequently experienced as final or definite when it can take the form of an overt act—typically, enrolling for a premedicai course in an undergraduate college. Once it is possible, through his college status, for the future doctor to identify himself as a premedicai student, his hitherto private and perhaps not fully shaped intention tends to become a definite commitment.' The spike at 18 is not eighteen-year-olds having a uniquely powerful moment of clarity — it is the first age at which the American undergraduate curriculum lets someone formally register as pre-med. Diagnostic move: when a reported 'decision' or 'realization' seems to date reliably to a milestone, ask what the milestone is the FIRST OPPORTUNITY to do — sign a form, make a public announcement, take an irreversible first step — before treating the reported date as evidence of when the underlying resolve actually formed. A private inclination can predate the reported decision by years without the person having any way to mark it, simply because there was nothing yet to point to. This is distinct from repeated-measurement-beats-recalled-self-report-of-change (lex-h2waf): that atom is about recall itself being unreliable and fixed by re-measuring instead of asking people to remember. This atom is not about faulty memory at all — a person can recall the milestone date perfectly accurately and still be wrong that it was when the resolve was actually reached, because the milestone genuinely is the first date the intention became sayable, not a distorted memory of an earlier true date."
