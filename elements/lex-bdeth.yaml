lineage:
  - source: primary
    text: radin-sharp-elbow-kills-hares-proxy-then-faces-hare-directly
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 7. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Now, grandmother, let my friend go after my arrow.' ... The friend started out and when he came to the village of Sharp-elbow, he said, 'My friend wants his arrow.' But the chief did not so much as answer him and so he went back without it. 'Go again,' said Hare. Three times he went back. At the fourth time Sharp-elbow said, 'There it is, take it!' The friend went forward and tried to reach it but the chief, Sharp-elbow, using his elbows, thereupon tore him open and said to his attendants, 'Hang him up to dry. I will soon make a nice meal of him.' ... Then Hare, who was present, turned to the old woman and said, 'I thought you told me your grandson was a chief and yet this man says he has been killed. However, I will now go over and see this chief Sharp-elbow myself.'"
canonical-instances:
  - "A junior staffer sent repeatedly to ask a difficult vendor to honor a contract term gets stonewalled and eventually dismissed from meetings entirely, and only once the actual department head calls the vendor directly does the vendor suddenly treat the same request as serious."
  - "A tenants' association sends a rotating series of volunteers to ask a landlord to fix a recurring safety violation, and each volunteer is brushed off or threatened with eviction, until a city housing inspector, acting on the tenants' behalf but with real institutional standing, shows up in person and the repair happens within days."
critical-questions:
  - "Was Sharp-elbow's willingness to kill the friend actually a calculated bet on the friend's low status specifically, or would he have reacted identically toward anyone who approached him the same way, including Hare, making the difference in outcome about Hare's own power rather than about who is doing the asking?"
  - "Does the old woman's warning, 'he will be killed,' before the friend is sent, suggest that the risk to a proxy was already fully known in advance, and if so, what does it say that Hare sent his friend anyway rather than going himself from the start?"
  - "Is there a meaningful difference between an aggressor who escalates against proxies specifically because they're proxies, and one who simply escalates against anyone who doesn't immediately have the power to stop them, and does the story give enough evidence to tell which one Sharp-elbow is?"
