evokes: [merton-1957, hyman-1953, relative-proportions-vs-absolute-numbers, larger-percentage-smaller-group, substantial-number-not-substantial-proportion]
lineage:
  - source: primary
    text: merton-1957-proportions-vs-absolute-numbers
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. V 'Continuities in the Theory of Social Structure and Anomie,' pp.174-175, correcting Herbert H. Hyman's re-analysis of public opinion survey data on success-values by social class. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'it is not the relative proportions of the several social classes adopting the cultural goal of success that matter, but their absolute numbers. To say that a larger percentage of the upper social and economic strata hold fast to the cultural goal of success is not to say that larger numbers of them than of lower-class people do so. Indeed, since the number of people in the topmost stratum identified in these studies is substantially smaller than the number in the lowest stratum, it is sometimes the case that more lower-class than upper-class people abide by this goal.'"
  - source: primary
    text: merton-1957-substantial-number-not-proportion
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.174, immediately following, defining the theory's actual empirical requirement."
    quote: "'the hypothesis does not require that larger proportions or even larger numbers in the lower social strata be oriented toward the success-goal, but only that a substantial number be so oriented. For it is the disjunction between culturally induced high aspirations and socially structured obstacles to realization of these aspirations which is held to exert distinct pressure for deviant behavior. By a \"substantial number,\" then, is meant a number sufficiently large to result in a more frequent disjunction between goals and opportunity among the lower-class strata than among the more advantaged upper-class strata.'"
canonical-instances:
  - "A headline reporting 'Rate of X doubled among Group A' while Group A is a tenth the size of Group B can describe a change smaller in absolute terms than a flat rate in Group B — a policy built to address 'the group with the alarming rate' can end up addressing fewer actual people than one built around the group with the unremarkable-looking rate."
  - "A/B test results reported only as conversion-rate percentages can mask that the smaller-traffic variant's 'better rate' represents fewer converted users in absolute terms than the larger-traffic variant's 'worse rate' — a decision to ship the higher-rate variant without checking absolute volume can reduce total conversions."
critical-questions:
  - "When does the rate, not the count, actually matter? Per-capita comparisons (disease prevalence, crime rates) are usually built to compare risk or exposure across different-sized populations on purpose — the count-vs-rate correction applies specifically when the underlying claim is about AGGREGATE real-world effect (total strain, total converted users, total affected people), not about individual-level risk."
  - "Merton's own fix requires knowing both the rate AND the base population size — a comparison that reports only percentages, with no denominator disclosed, can't be corrected by the reader at all. Is the fact that percentage-only reporting is so common itself evidence of a bias toward the comparison that's easier to compute, rather than the one that's decision-relevant?"
