lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch12-breaking-down-an-unreasonable-custom
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XII, 'Hope for the Nation.'"
    quote: "“It came out that the officers at the White House had received no orders from Mr. Lincoln, or from any one else. They were simply complying with an old custom, the outgrowth of slavery, as dogs will sometimes rub their necks, long after their collars are removed, thinking they are still there. My colored friends were well pleased with what had seemed to them a doubtful experiment, and I believe were encouraged by its success to follow my example. I have found in my experience that the way to break down an unreasonable custom, is to contradict it in practice.”"
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch12-you-have-deceived-me
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XII, 'Hope for the Nation.'"
    quote: "“We halted so soon as we saw the trick, and I said to the officers: ‘You have deceived me. I shall not go out of this building till I see President Lincoln.’”"
canonical-instances:
  - "The direct textual anchor: the officers, once directly challenged, did not produce or claim any written order -- they attempted instead to quietly divert Douglass out a side exit, a tactic that only works on someone who doesn't notice or doesn't press the confrontation to its conclusion."
  - "Hypothetical: a long-standing office norm holds that only senior staff use the executive elevator, though no policy document says so and no one can name who decided it. A new employee, unaware of the norm, rides it anyway; nothing happens, because there was never an actual rule to enforce -- only unbroken, unquestioned habit."
critical-questions:
  - "How does an actor tell in advance whether a custom is genuinely unauthorized and just needs defying, versus backed by real (if unstated) authority that will actually enforce it upon defiance -- Douglass could not have known for certain there was no order until he tested it, and the outcome might have gone differently."
  - "A single successful defiance might just carve out a one-time exception for whoever tested it, leaving everybody else facing the same wall unchanged. What decides whether a single act of defiance actually ends a custom, versus just exempting the one person who forced the issue?"
  - "What made this particular custom vulnerable to simple defiance -- the presence of a sympathetic authority (Lincoln himself) who could immediately overrule the officers once informed? Would the same act of defiance work absent any such appeal available, or does the mechanism quietly depend on there being someone above the enforcers willing to side against the custom once asked directly?"
