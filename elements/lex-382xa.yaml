id: lex-382xa
name: aligning-public-names-with-reality-precondition-for-coordinated-action
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When coordinating action requires shared reference (this person, that policy, the named thing), public names must align with reality. When names lie, coordination breaks because everyone's pointing at different things. Restore name-reality alignment before debating action."
related: [lex-2s3ze, lex-4hfyp, lex-bgjaj, lex-d7h2y, lex-h94k5, lex-hjnej, lex-n8888, lex-nadsx, lex-sxt57, lex-wtkuz, lex-zxrtf]
scaffolds-from: [lex-sxt57]
evokes: [confucius-rectification-of-names, zheng-ming, if-names-be-not-correct-language-is-not-in-accordance, names-drift-and-action-fails, the-five-step-cascade-of-mis-naming]
lineage:
  - source: primary
    text: confucius-c500BCE-analects-book-xiii-chap-iii
    citation: "Confucius (Kongzi), *Analects* (*Lúnyǔ*), Book XIII Ch. III. Compiled by disciples c. 5th-3rd c. BCE; transmitted via the Han-era recension. James Legge English translation 1893 (*The Chinese Classics*, Vol. I, 2nd ed.; sacred-texts.com PD). Confucius's `zhèng míng` (正名, 'rectification of names') is the doctrine that the first task of governance is to make sure the public names of things match what they refer to. The mechanism Confucius articulates is a five-step propagation cascade: (1) names drift from reality → (2) language no longer mediates the truth of things → (3) coordinated affairs cannot succeed → (4) the meta-protocols (proprieties, music) fail to flourish → (5) punishments lose proportionality → (6) the people no longer know how to move hand or foot. The transferable primitive: language is not a mere mirror of reality but the COORDINATION-SUBSTRATE on which collective action runs; mis-named referents propagate dysfunction downstream through the action-coordination chain. Distinct from lex-zxrtf naming-as-power (the true-name-as-handle Rumpelstiltskin pattern); distinct from lex-wtkuz descriptive-vs-operational-metacognition (the individual-frame split). Specifically about public-name-to-public-reality alignment as a precondition for coordinated action."
    quote: "[Confucius Analects Book XIII Ch.III (Legge 1893 trans.):] 'Tsze-lu said, ''The ruler of Wei has been waiting for you, in order with you to administer the government. What will you consider the first thing to be done?'' The Master replied, ''What is necessary is to rectify names.'' ''So, indeed!'' said Tsze-lu. ''You are wide of the mark! Why must there be such rectification?'' The Master said, ''How uncultivated you are, Yu! A superior man, in regard to what he does not know, shows a cautious reserve. If names be not correct, language is not in accordance with the truth of things. If language be not in accordance with the truth of things, affairs cannot be carried on to success. When affairs cannot be carried on to success, proprieties and music will not flourish. When proprieties and music do not flourish, punishments will not be properly awarded. When punishments are not properly awarded, the people do not know how to move hand or foot. Therefore a superior man considers it necessary that the names he uses may be spoken appropriately, and also that what he speaks may be carried out appropriately. What the superior man requires, is just that in his words there may be nothing incorrect.''' [Practitioner-extraction: Confucius names the five-step downstream cascade — name-drift → language-failure → action-failure → meta-protocol-failure → proportionality-failure → behavioural-paralysis. The substrate-claim is that language is the coordination-substrate on which collective action runs; misaligned-public-names propagate dysfunction through the entire chain. The first move of effective governance is therefore to repair the names. The doctrine ports across any context where public language mediates collective action — legal terms-of-art, scientific paradigm-vocabulary, software-engineering naming-discipline, organizational role-titles, political euphemism / dysphemism wars.]"
  - source: discovery-loop
    text: cross-attestation-across-coordination-substrates
    citation: "Cross-attestation summary, 15 2026-05-29. The rectification-of-names primitive recurs across coordination contexts wherever public language mediates collective action. Examples: (i) Orwell 1949 *Nineteen Eighty-Four* names the inverse-move — Newspeak as deliberate name-corruption to make heterodox thought literally unsayable (the Confucian causal chain run in reverse: corrupt the names to disable the action). (ii) Kuhn 1962 *The Structure of Scientific Revolutions* names paradigm-shifts as exactly the re-naming of basic categories (phlogiston→oxidation; absolute-time→spacetime-curvature) where coordination across the scientific community requires shared up-to-date names. (iii) Law: legal terms-of-art must mean precisely the same thing across jurisdictions or the law fails to coordinate enforcement (lex-sxt57 is the upstream-mechanism). (iv) Software engineering: 'naming is one of the two hard problems in computer science' (Phil Karlton aphorism); Hyrum's law (lex-br4uk) is partly downstream of API names diverging from API behaviour. (v) Political euphemism / dysphemism wars: the contest over what to call a thing (enhanced-interrogation vs torture; pro-life vs anti-abortion vs pro-choice vs pro-abortion) is recognized by all sides as substantive because each side knows that controlling the public-names shifts the coordination of subsequent action. (vi) Organizational role-titles: 'product manager' vs 'product owner' vs 'project manager' carry materially-different action-coordination implications, which is why title-disputes are not merely status-disputes. Cross-domain consistency is evidence the underlying pattern is structural rather than substrate-specific."
    quote: "[Cross-attestation summary, 15 2026-05-29: Confucius c.500 BCE names the doctrine for governance of states; Orwell 1949 names the inverse-move (deliberate name-corruption as control); Kuhn 1962 names paradigm-shifts as scientific re-naming; legal terms-of-art carry the same mechanism in adjudication; software-engineering naming discipline (Karlton aphorism + Hyrum's law lex-br4uk) is the same mechanism at compile/runtime scale; political euphemism / dysphemism wars (enhanced-interrogation, pro-life, illegal-aliens-vs-undocumented-immigrants) are the contemporary contest over public-coordination-names; organizational role-title disputes are the same mechanism inside firms. The structural shape — public-names-drift-or-corrupt → language-fails-to-coordinate → action-cascades-into-dysfunction — is invariant across the scales (state, scientific community, courtroom, codebase, political discourse, firm).]"
canonical-instances:
  - "Confucius Analects XIII.III governance application: the Master's answer to 'what is the first task of governance' is 'rectify names.' The disciple Tsze-lu objects that this seems beside the point — Confucius responds with the five-step downstream cascade (name-drift → language-failure → action-failure → meta-protocol-failure → proportionality-failure → behavioural-paralysis). The political-strategic point: a ruler who cannot align public-names with reality cannot coordinate anything else; therefore name-rectification precedes all other policy work"
  - "Orwell 1949 Newspeak inverse-move: the totalitarian state deliberately corrupts public-names (war is peace, freedom is slavery, ignorance is strength) AND deliberately strips the language of words that name heterodox concepts (no word for 'liberty,' so liberty cannot be thought clearly). Orwell's mechanism runs Confucius's causal chain IN REVERSE: corrupt the names to disable the action. The inverse-move is itself evidence the underlying mechanism is real — totalitarians invest enormously in name-corruption because they know names propagate downstream"
  - "Kuhn 1962 paradigm-shifts as re-naming: the scientific community coordinates around shared category-names. When the paradigm shifts (phlogiston→oxidation; absolute-time→spacetime-curvature; non-coding-DNA→regulatory-DNA), the old names lose alignment with the new theory of things, and continued use of old names propagates research-coordination failures. The Kuhnian incommensurability claim is partly that workers in different paradigms cannot coordinate because they are using public-names that no longer share referents"
  - "legal terms-of-art across jurisdictions: legal coordination requires that 'reasonable person,' 'mens rea,' 'consideration,' 'fiduciary duty,' etc. mean precisely the same thing across courts. When names drift between jurisdictions (the US 'discovery' vs UK 'disclosure' obligations; the multiple competing definitions of 'antitrust' across G20 jurisdictions), enforcement coordination fails. Legal codification efforts (the UCC; the Restatements; the Model Penal Code) are explicit rectification-of-names exercises"
  - "software engineering naming-discipline: 'naming is one of the two hard problems in computer science' (Phil Karlton aphorism — softened in lex-zxrtf ). The reason it's hard is that names propagate through dependent code via Hyrum's law (lex-br4uk) — once a name is in public API, all downstream consumers depend on the name aligning with the behaviour. Rectification within a codebase requires explicit deprecation campaigns; rectification across the industry (e.g., the systemd vs init-scripts naming wars; master/main branch renaming) is much harder because of consumer-side dependency"
  - "political euphemism / dysphemism wars: the contest over what to call a thing (enhanced-interrogation vs torture; pro-life vs anti-abortion; undocumented-immigrant vs illegal-alien; structural-adjustment vs austerity; freedom-fighter vs terrorist) is recognized by all sides as substantively-important because each side knows public-names control the downstream coordination of public action. The contest itself is evidence the mechanism is real; the outcome of the naming-contest predictably propagates into law, policy, and resource-allocation"
  - "organizational role-titles: 'product manager' vs 'product owner' vs 'project manager' vs 'program manager' carry materially-different action-coordination implications — which artifacts you own, who you report to, what meetings you call, what decisions you can make unilaterally. Title-disputes inside firms are therefore not merely status-disputes; they are rectification-of-names exercises about how action gets coordinated downstream"
  - "operationally distinct from lex-zxrtf naming-as-power: lex-zxrtf is the Rumpelstiltskin pattern — knowing the TRUE NAME of a thing confers power over it (debugging, therapy, security passwords). This atom is the inverse-of-the-inverse: ensuring that PUBLIC NAMES align with public reality so collective coordination can succeed. lex-zxrtf is private-handle-as-leverage; lex-382xa is public-coordination-substrate. The two can co-fire (correctly naming a buggy pattern is both rectification-of-names AND naming-as-power), but the discriminating mechanism is whether the work is private-leverage-acquisition or public-coordination-restoration"
  - "operationally adjacent to lex-d7h2y paltering-as-truth-arranged-to-deceive: paltering is true-statements-arranged-to-deceive (technically true but misleading). Mis-rectification-of-names is the systemic-scale version: even individual true statements cannot rescue coordination if the public-names they're built from have drifted. The two atoms describe complementary failures of public truth-mediation — paltering at the speech-act level; mis-naming at the language-substrate level"
  - "operationally adjacent to lex-sxt57: lex-sxt57 is the foundational move of carving the conceptual-space with stipulative marks (Mendeleev's marks for unknown elements; legal terms-of-art definitions; programming-language type-systems). lex-382xa is the maintenance-problem that follows: once marks are stipulated, they require active maintenance as reality shifts; without rectification-of-names the stipulations drift and the substrate-coordination fails. lex-sxt57 establishes; lex-382xa maintains"
  - "operationally adjacent to lex-2s3ze equivocation-shifts-a-words-sense-across-an-argument: lex-2s3ze names the within-argument shifting of a word's sense (the classical equivocation fallacy). lex-382xa names the across-time / across-community drift of public-names from their referents. Both atoms describe failures of public-name stability, but at different timescales: lex-2s3ze is the within-conversation drift; lex-382xa is the across-society drift"
critical-questions:
  - "the name-drift-or-reality-drift diagnostic: when there is a mismatch between a public-name and its public-reality, the rectification-of-names move says ALIGN THE NAME. But sometimes the right move is to align the REALITY (the name is fine; the reality has drifted from what should be). Practitioner-discipline: before rectifying the name, ask whether the name was always-aspirational ('marriage' as a social institution; 'professionalism' as a workplace norm) and the reality should be re-aligned to the name rather than the name re-aligned to the reality. Confucius's framing assumes name-drift is the failure-mode; reality-drift is the symmetrically-possible failure-mode"
  - "the rectification-cost test: rectifying a public-name carries a transition-cost — all downstream consumers have to update their internal models, their coordination-protocols, their action-routines. Is the rectification-cost less than the ongoing-mis-coordination-cost? Hyrum's-law-style propagation means rectification at API surfaces in a mature codebase can be more expensive than tolerating the name-misalignment. Practitioner-question: is the present mis-coordination producing more downstream damage than the rectification campaign would cost?"
  - "the equilibrium-stability question: after rectification, what stabilises the new alignment? Public-names tend to drift unless actively maintained — euphemism-treadmills (lex-not-yet-named — 'idiot' → 'retarded' → 'mentally-handicapped' → 'intellectually-disabled' → 'neurodivergent'), softening-then-corrupting cycles, jargon-creep into general use. The first rectification is rarely the last; the discipline requires recurring maintenance. Practitioner-question: what social-process will keep the rectified names aligned over time?"
  - "the contest-over-rectification: rectification of public-names is itself a political-process. The Confucian framing assumes a single ruler-actor who can rectify by authority. In contested-public-discourse contexts (modern democracies; international law; scientific paradigm-debates), rectification is itself the contest — multiple parties propose alternative names, each consistent with their preferred-reality. Practitioner-discipline: rectification is not always available as a private discipline; sometimes it requires winning the public-contest first"
  - "the inverse-Newspeak detection: when a powerful actor proposes a name-change, is the move rectification (aligning the name with the reality) or Newspeak (corrupting the name to disable thought / action against the actor)? The Orwellian-inverse uses the same mechanism Confucius identifies, but with opposite intent. Practitioner-discipline: check whose downstream action gets disabled by the proposed name-change — if the answer is 'critics of the powerful actor,' suspect Newspeak rather than rectification"
status: active
