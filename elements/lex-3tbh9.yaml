id: lex-3tbh9
name: strategic-misrepresentation-can-only-subtract-never-promote
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before assuming that a decision system open to strategic misrepresentation is equally exploitable in every direction, check whether the exploit can actually promote a favored outcome, or only ever demote a disfavored one. Sen, citing Murakami: 'with those collective choice systems that are non-negatively responsive to individual preferences the scope of what voters can achieve by distorting their preferences is very limited. ... By distorting his preferences a person cannot increase the weight on his most preferred alternative, for the greatest weight he can put on it is to vote sincerely.' His worked example under majority rule: three voters rank x, y, z with cyclical preferences such that honest voting makes x the social winner. The second voter, who actually prefers y, tries lying about his ranking to break x's win. It works, but only in one direction: his lie creates a cycle among all three alternatives that removes x from contention. Sen states the limit precisely: 'he cannot bring y into the choice set this way, since the most he can do to help y into the choice set is to vote honestly. He can knock x out of the choice set by dishonest voting, but he cannot put y into it.' The asymmetry is exact: a vote can be weaponized to sabotage a rival option, but the only way to actually elevate your own favorite is to state your real preference for it. Diagnostic move: when a decision process (a vote, a review score, a ranked-choice input) is vulnerable to gaming, work out separately whether the gaming can only spoil outcomes for others or can also lift the gamer's own preferred outcome beyond what honesty already achieves -- the two failure modes call for different fixes, and a system resistant to one may still be wide open to the other."
