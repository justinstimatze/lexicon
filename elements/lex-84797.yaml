id: lex-84797
name: treating-a-non-agential-process-as-a-reciprocating-friend-invites-betrayal
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Feeding, tending, or otherwise investing in something that has no capacity to reciprocate — because it isn't an agent at all, only a process that reacts according to its own fixed nature — can produce the same feeling of betrayal as a broken relationship, even though nothing was ever actually promised or capable of being kept. In the Jataka's tale of the fire-worshipping ascetic, he offers his sacred fire a rich gift of rice soaked in fat, expecting the devoted tending of years to have built some kind of standing with it; the fat catches, and the fire burns down the hut he built with his own hands. His response treats the fire as though it had broken faith: 'Nothing is worse than evil company; I fed my fire with plenteous rice and ghee; And lo! the hut which gave me such ado To build it up, my fire has burnt for me.' The fire did nothing but combust exactly as fire does — the only failure was his own expectation that consistent care would be met with anything but the process's own indifferent nature."
related: []
evokes: [jataka, dukanipata, santhava-jataka, non-agential-systems-cannot-honor-an-investment, mistaking-consistent-care-for-an-earned-reciprocal-bond]
