    quote: "Good friend, it is just these two creatures [357] that protect our homes. Once they are driven off, our homes will be made desolate. If men see not the lion and the tiger tracks, they will cut all the forest down, make it all one open space, and till the land."
canonical-instances:
  - "A company fires its most difficult, litigious client-relations veteran because internal staff find working with them exhausting, only to discover within months that this employee's reputation had been the sole thing keeping a much larger, more aggressive competitor from poaching the firm's biggest accounts."
critical-questions:
  - "How would the tree-spirits have known in advance that the lion and tiger were providing this protection, given that the benefit was invisible until after it was removed?"
  - "Does this pattern generalize to any unpleasant presence, or does it only apply when the presence and the deterred threat happen to share the same underlying resource, as the predators and the loggers both wanted the same forest?"
