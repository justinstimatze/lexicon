id: lex-75nw3
name: accelerating-idea-throughput-does-not-shrink-a-combinatorial-search-space
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a method promises to help solve hard problems by generating more ideas faster, check whether it actually reduces the SIZE of the space being searched or only raises the RATE at which that same space gets sampled — because a rate increase that leaves the space's size untouched provides no real leverage once the space is large enough. Altshuller runs this diagnosis against the whole family of 'activating the search' techniques (brainstorming, synectics, morphological analysis, the focal-object method, control-question checklists), crediting them with real value at small scale while naming their structural ceiling: 'The aim of methods of activating the search also consists in 1) intensifying the process of generation of ideas, and 2) raising the concentration of original ideas in the overall stream' — both goals are about throughput and mixture, not about narrowing what has to be searched at all. His verdict after describing brainstorming, synectics, and the rest: 'The storm (simple or synectic) throws up more ideas than the usual trial and error method. But this is not much if the cost of the task would be 10,000 or 100,000 trials... Methods of activating the search retain (albeit in a rather improved form) the old tactics of selecting variants.' The mechanism is arithmetic: if a problem's real difficulty requires searching on the order of 100,000 variants, doubling or tripling the rate of idea-generation (what a good brainstorm session achieves) leaves the required search still many orders of magnitude too large to complete by throughput alone — the only thing that helps at that scale is a method that eliminates whole regions of the space before they're generated at all, which is a different kind of intervention than generating faster within the same space. Diagnostic move: before adopting a technique billed as helping solve hard problems, ask whether it changes WHAT gets searched (a filter, a decomposition, a contradiction that rules out an entire class of variants in advance) or only HOW FAST candidates get proposed and reviewed within the existing space — a throughput technique is real value for problems small enough that raw volume can plausibly cover the space, and a wasted investment (mistaken for real leverage) on problems whose difficulty comes from the space's sheer combinatorial size."
