lineage:
  - source: primary
    text: radin-wakdjunkaga-destroys-every-status-marker-to-begin-his-development-from-zero
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Figure.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Hardly has he left the shore when he returns and destroys his boat as useless. At this piece of stupidity some of his companions leave him. He then starts on foot, but after a short time destroys both his warbundle and his arrowbundle and finds himself eventually deserted by everyone and alone; alone, that is, as far as human beings and society are concerned. ... Wakdjunkaga is to be desocialized, to be represented as breaking all his ties with man and society. ... he has decided that Wakdjunkaga is to be depicted as completely unconnected with the world of man and as gradually evolving from an amorphous, instinctual and unintegrated being into one with the lineaments of man and one foreshadowing man's psychical traits."
canonical-instances:
  - "A memoir about recovering from addiction opens with the narrator deliberately burning old photographs, cutting off old friendships, and quitting a stable job, all before any part of the recovery itself begins, so the reader experiences the later transformation as starting from genuine zero rather than as a gradual adjustment."
  - "A company rebrand strips out every visible trace of the old identity, logo, office decor, internal terminology, before introducing any part of the new one, even though some of the discarded material still had practical value, because leadership wants employees to experience the new culture as a real restart rather than a continuation with new branding."
critical-questions:
  - "Is Radin's reading of the opening sequence as a deliberate literary device falsifiable, or could the destruction of the boat, warbundle, and arrowbundle simply be residue of an older, differently-motivated version of the myth that a later raconteur inherited without fully understanding?"
  - "Does forcing a genuine blank slate actually produce a more convincing developmental arc for an audience, or does destroying real, possibly irreplaceable assets in the process carry a cost that a story or a real transformation should weigh against the narrative benefit?"
  - "Is there a meaningful difference between destroying markers of status because a genuine restart requires it, and destroying them simply as a display of contempt for what came before, and does the Wakdjunkaga cycle's opening let us distinguish between these two motives?"
