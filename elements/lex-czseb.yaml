lineage:
  - source: primary
    text: weber-1919-politics-as-a-vocation
    citation: "Max Weber, 'Politics as a Vocation' ['Politik als Beruf'], a lecture delivered to the Free Students' Union of Bavaria in Munich, 28 January 1919, amid the collapse of the Wilhelmine political order and the revolutionary upheavals of the German Revolution of 1918-19; in *The Vocation Lectures*, ed. David Owen and Tracy B. Strong, trans. Rodney Livingstone (Indianapolis: Hackett Publishing Company, 2004), pp.32-94 (the companion lecture, 'Science as a Vocation,' occupies the earlier pages of the same volume). The lecture's argument runs in one continuous chain: first, politics is defined sociologically not by its ends but by its specific means, physical violence, with the modern state defined as the form of community claiming a monopoly of legitimate physical violence within a territory; second, this makes the striving for political power inherently a handling of a morally dangerous instrument; third, because the decisive political means is force, no ethic can say in the abstract when a good end justifies a dangerous means, which forces a choice between two irreconcilable maxims — an ethic of conviction (Gesinnungsethik), which judges an action by the purity of the conviction behind it and disclaims responsibility for consequences the agent did not intend, and an ethic of responsibility (Verantwortungsethik), which requires the actor to answer personally for the foreseeable consequences of the means chosen; fourth, Weber closes not by picking a side but by arguing the two are mutually complementary, and that only a mature actor capable of holding both — passionate commitment to a cause and full ownership of what pursuing it will foreseeably cost — has a genuine vocation for politics."
    quote: "[On the state defined by its means, pp.32-33:] '\"Every state is based on force,\" Trotsky remarked at Brest-Litovsk. That is indeed the case... the state is the form of human community that (successfully) lays claim to the monopoly of legitimate physical violence within a particular territory... all other organizations or individuals can assert the right to use physical violence only insofar as the state permits them to do so.' [On the three qualities of a politician, pp.76-77:] 'We can say that three qualities, above all, are of decisive importance for a politician: passion, a sense of responsibility, and a sense of proportion... For mere passion, however sincerely felt, is not enough in itself. It cannot make a politician of anyone, unless service to a \"cause\" also means that a sense of responsibility toward that cause is made the decisive guiding light of action.' [On the tragedy politics is blind to when power is worshipped for its own sake, p.78:] '...a blase attitude that remains completely blind to the tragedy in which all action is ensnared, political action above all.' [On the absolute ethic of the Gospel and its collision with political necessity, pp.81-82:] 'The Sermon on the Mount... is a far more serious business than is imagined by those who like to quote its commandments nowadays... Anyone who wishes to act in accordance with the ethic of the Gospel should abstain from going on strike — for strikes are a form of coercion... For if, following this unworldly ethic of love, you ought to \"resist not him that is evil with violence\" — the politician must abide by the opposite commandment: \"You shall use force to resist evil, for otherwise you will be responsible for its running amok.\"' [The formal statement of the two maxims, pp.82-83:] 'We need to be clear that all ethically oriented action can be guided by either of two fundamentally different, irredeemably incompatible maxims: it can be guided by an \"ethics of conviction\" or an \"ethics of responsibility.\" This does not mean that an ethics of conviction is identical with irresponsibility or an ethics of responsibility with a lack of conviction... In the former case this means, to put it in religious terms: \"A Christian does what is right and leaves the outcome to God,\" while in the latter you must answer for the (foreseeable) consequences of your actions.' [The syndicalist example and the disclaiming-move it names, p.83:] 'You may be able to prove to a syndicalist who is a convinced adherent of an ethics of conviction that in all likelihood the consequences of his actions will be to improve the prospects of the reactionaries... But however convincing your proofs may be, you will make no impression on him at all. Such a man believes that if an action performed out of pure conviction has evil consequences, then the responsibility must lie not with the agent but with the world, the stupidity of men — or the will of God who created them thus. With the ethics of responsibility, on the other hand, a man reckons with exactly those average human failings... He does not feel that he is in a position to shift the consequences of his actions, where they are foreseeable, onto others. He will say, \"These consequences are to be ascribed to my actions.\"' [On force as the decisive political means and the Zimmerwald-tendency case, pp.83-84:] 'In politics, the decisive means is the use of force. The extent of the moral tension between means and ends can be gauged from the case of the revolutionary Socialists (of the Zimmerwald tendency)... \"If we face the choice of either another few years' war, after which there will be revolution, or else peace now but no revolution, our choice must be: another few years' war!\"... Here, with this problem of justifying the means by the ends, we see the inevitable failure of an ethics of conviction in general.' [Invoking Dostoevsky's Grand Inquisitor as the emblem of the conviction-ethicist's inability to bear the world's ethical irrationality, pp.85-86:] 'The man who embraces an ethics of conviction is unable to tolerate the ethical irrationality of the world. He is a cosmic, ethical \"rationalist.\" All of you who know your Dostoyevsky will remember the scene with the Grand Inquisitor...' [The closing synthesis, pp.91-92:] 'I find it immeasurably moving when a mature human being... who feels the responsibility he bears for the consequences of his own actions with his entire soul and who acts in harmony with an ethics of responsibility reaches the point where he says, \"Here I stand, I can do no other.\" That is authentically human... In this sense an ethics of conviction and an ethics of responsibility are not absolute antitheses but are mutually complementary, and only when taken together do they constitute the authentic human being who is capable of having a \"vocation for politics.\"' [The closing image of the vocation itself, pp.93-94:] 'Politics means a slow, powerful drilling through hard boards, with a mixture of passion and a sense of proportion... The only man who has a \"vocation\" for politics is one who is certain that his spirit will not be broken if the world... proves too stupid or base to accept what he wishes to offer it, and who, when faced with all that obduracy, can still say \"Nevertheless!\" despite everything.'"
  - source: discovery-loop
    text: distinctness-audit-ethic-of-responsibility-vs-ethic-of-conviction
    citation: "Every existing ethical-theory atom in the substrate (lex-9wbd3 Mill greatest-happiness, lex-y9q22 Mill higher/lower pleasures, lex-kfk68 Kant universalizability, lex-7mdpd Kant humanity-as-end, lex-qdxa7 Hume bundle-theory-of-self, lex-8n237 Weber-adjacent legitimation-methods, lex-8f8jk James judge-by-fruits, lex-p7uh9 Coase reciprocal-harm, lex-7t3wr Walton argument-from-consequences, lex-efv3v Epictetus chosen-role-as-non-deliberation-gate, lex-wverr Foot natural-goodness) is a generic ethical-theory or argumentation-scheme atom; none grounds Weber's specific vocational claim — responsibility for foreseeable political consequences when the chosen means is force. Of the substrate atoms mentioning Weber by name, only lex-qjsgk is a primary-grounded Max Weber atom (Protestant Ethic, iron-cage); it addresses institutional spirit outliving structure, not the ethic-of-responsibility/conviction distinction, and is cited here as a compositional Weber-cluster neighbor. The state's monopoly-on-legitimate-violence definition was not previously primary-grounded anywhere in the substrate: lex-5rqmv (Acemoglu-Robinson) uses 'monopoly on violence' only as one critical-question test-item for political-institution inclusivity, and lex-jyzng (Lent) cites it only as one property in passing of the abstracted 'State'; neither cites Weber as the primary source for the definition itself. The definition is carried here as the premise that makes the ethic-of-responsibility bind specifically political — force is the state's, and hence the politician's, decisive means — while the atom's headline claim remains the ethic-of-responsibility/ethic-of-conviction distinction. Lex-0746 (Bhagavad Gita, act-for-action-quality-not-for-outcome-attachment) is a genuinely distinct axis: motivational orientation versus responsibility-attribution."
canonical-instances:
  - "Weber's own worked example, the revolutionary Socialists of the Zimmerwald tendency (1915 conference, attended by Lenin): faced with 'another few years' war, after which there will be revolution, or else peace now but no revolution,' they chose more war — accepting, per their own ethic of conviction, that responsibility for the resulting carnage belonged to the world's irrationality and the old regime's guilt, not to their own choice of means."
  - "Weber's syndicalist interlocutor: shown convincing proof that his direct-action tactics will in all likelihood strengthen the reactionaries and worsen his own class's position, he is unmoved, because on his own accounting his responsibility ends at keeping the flame of pure conviction alight, not at the tactics' actual downstream effects — the canonical instance of the disclaiming-move this atom names."
  - "A whistleblower deciding how much classified material to release: the conviction-ethic version judges the leak solely by the purity of exposing wrongdoing and treats any resulting harm to named sources or diplomatic relationships as the wrongdoers' fault, not the leaker's; the responsibility-ethic version treats the same foreseeable harms as costs the leaker is personally choosing to impose by the scope of the release, and redacts, limits, or times the leak accordingly while still owning the tradeoff."
  - "An activist movement debating property destruction as a tactic: sharing the movement's just end does not, per Weber's own example, exempt a participant from owning the foreseeable costs of THESE specific means (radicalized opposition, harm to bystanders, a state crackdown) — the debate Weber's frame sharpens is not whether the end is good but who answers for what these particular means will foreseeably do."
critical-questions:
  - "Is the actor answering for the foreseeable consequences of the specific means they chose, in their own name, or disclaiming responsibility onto 'the world,' 'the enemy,' 'the market,' or the counterparty's prior wrongdoing? Weber's diagnostic is exactly this attribution question, not a judgment about the actor's sincerity."
  - "Is force, coercion, or a comparably irreversible or violent means actually the operative means here — the state's monopoly-claim domain — or is 'ethic of conviction' language being imported into a dispute where Weber's specifically political tragic structure doesn't actually obtain?"
  - "Per the Zimmerwald/syndicalist test: if a critic could PROVE, to the actor's own satisfaction, that the chosen means will foreseeably produce an outcome the actor would regard as bad, would the actor's commitment change? If proof would make no impression at all, that is Weber's marker of a pure ethic of conviction in operation."
  - "Is the actor conflating 'I hold this conviction with total sincerity and depth' with 'I am therefore not responsible for what my chosen means foreseeably does' — the specific move Weber isolates as available to conviction-ethics and unavailable, by definition, to responsibility-ethics?"
  - "Following Weber's own resolution: is the actor capable of holding passionate commitment to the cause AND full ownership of the foreseeable cost of the means at the same time — the 'mature human being' synthesis — or is the situation being falsely framed as a one-time, exclusive choice between the two ethics?"
status: active
