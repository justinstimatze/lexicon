id: lex-kj5fh
name: a-locked-ratio-removal-process-leaves-an-irreducible-floor
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When trying to remove an unwanted component from a mixture by applying more of the same removal process (more heat, more time, more of the identical cycle), check whether the wanted and unwanted components leave together at a fixed, locked ratio — if they do, no amount of additional time or intensity through that same process will fully separate them; a residual floor of the unwanted component remains indefinitely, and full separation requires a genuinely different process, not more of the one you're already running. America's Test Kitchen on cooking off alcohol: 'When alcohol and water mix, they form a solution called an azeotrope — a mixture of two different liquids that behaves as if it were a single compound. Even though alcohol evaporates at a lower temperature than water, the vapors coming off of an alcohol-water azeotrope will contain both alcohol and water — they become inextricably mixed... unless you keep cooking until all the azeotropic mixture evaporates, the alcohol content of the liquid will remain at about 5 percent of the initial alcohol content no matter how long you simmer the mixture.' Longer simmering doesn't chase the alcohol content asymptotically toward zero the way a simple exponential decay would — it approaches a hard, non-zero floor set by the fixed vapor ratio, and staying there is exactly what the belief 'the alcohol cooks off' gets wrong."
