lineage:
  - source: primary
    text: cushing-brothers-discount-young-turkeys-alone-survivor-claim
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Revenge of the Two Brothers on the Hawikuhkwe.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'but they were not so much alarmed as the old grandmother, for, said they, one to the other, it is nothing but a youngster, anyway, and they are always more scared than the old ones. ... Alas! my fathers, exclaimed the Turkey. Alas! I, alone, am left to tell of it; ere I left they were thrown down all around me. ... Oh, no! broke in the elder brother, there will yet many return, for this is but a Long-leg, and surely when he could save himself others and older ones could. Even then they heard some of the Turkeys calling to one another, out of breath over the low hills. ... One by one, or in little bunches, the Turkeys came fleeing in, scared, weary, and bedraggled; and the boys knew by this, and that only a few after all returned, that the Long-leg had not been for nothing taught to fear.'"
canonical-instances:
  - "A dispatcher receiving a panicked first call about a building fire that says 'everyone is dead, I'm the only one who got out' immediately sends every available unit on the confirmed fact of a fire, while correctly declining to plan around the caller's death toll until firefighters on scene report actual casualties."
  - "A manager hearing a stressed junior engineer say a production outage has 'taken down everything, nothing is working' triggers the incident response immediately on the core fact of an outage, while withholding judgment on the claimed total scope until dashboards or a more senior engineer confirm which systems are actually affected."
critical-questions:
  - "Would the brothers' calibration have held up if the young Turkey's report had actually been accurate this one time, meaning the whole flock really was destroyed -- does relying on a known bias in a reporter's class risk under-reacting on the occasion the catastrophizing report happens to be true?"
  - "Is there a meaningful difference between discounting a report's scale-claim because of a general pattern about the reporter's type, versus discounting it because of something specific about this particular Turkey's demeanor or account -- does the story support reasoning from the category or from the individual?"
  - "What would the brothers have done differently if no further Turkeys had returned at all, confirming the young one's claim -- does the story show any mechanism for updating quickly back toward the alarming interpretation if the expected disconfirmation doesn't arrive?"
