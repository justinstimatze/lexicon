id: lex-73dy5
name: honor-mapped-onto-a-waxing-and-waning-moon-as-a-mnemonic-for-angers-cost
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'To make an abstract claim about reputation memorable and teachable, a speaker can map the rise and fall of honor onto the familiar waxing and waning of the moon, giving listeners a recurring, visible natural cycle to hang the moral lesson on rather than leaving the claim as bare assertion. In the Jataka''s tale of Culla-Bodhi, indulged and quenched anger are each paired with a moon-phase: "Whose anger grows like fire with fuel and grass that blaze, As the moon in the dark fortnight, so his honour wanes and decays. He who quiets his anger, like a fire that fuel has none, As the moon in the light fortnight, his honour waxes well grown."'
related: []
evokes: [jataka, dasanipata, culla-bodhi-jataka, lunar-cycle-mnemonic, honor-consequence-of-anger]
lineage:
  - source: primary
    text: jataka-chalmers1895-culla-bodhi-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 443, Culla-Bodhi-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Whose anger grows like fire with fuel and grass that blaze, As the moon in the dark fortnight, so his honour wanes and decays. He who quiets his anger, like a fire that fuel has none, As the moon in the light fortnight, his honour waxes well grown."
canonical-instances:
  - "A leadership coach tells clients that reputation behaves like a tide, rising with every restrained response to provocation and receding with every outburst, giving them a recurring natural image to check their own behavior against rather than an abstract rule."
critical-questions:
  - "Does pairing a moral claim with a natural-cycle image make the claim more memorable at the cost of making it feel more inevitable or law-like than the underlying social dynamic actually is?"
status: active
