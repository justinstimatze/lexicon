id: lex-9brfh
name: dispersing-heirs-in-different-directions-spreads-succession-risk
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Rather than contest a single cursed or compromised inheritance, heirs can each be sent in a different direction with a distinct sign to watch for, converting one collapsed claim into several independent new claims and distributing succession risk across space instead of concentrating it in one contested location. In the Jataka''s tale of Cetiya, the fallen king''s five sons are each sent toward a different gate with a different sign: "Come, dear: leave the city by the eastern gate and go straight on: you will see a white royal elephant prostrate, touching the earth in seven places :: that will be a sign for you to lay out a city there and dwell in it: and the name of it will he Hatthipura."'
related: [lex-ebmmd]
evokes: [jataka, atthanipata, cetiya-jataka, dispersal-as-risk-spreading, founding-myth-of-diaspora]
lineage:
  - source: primary
    text: jataka-chalmers1895-cetiya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 422, Cetiya-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Come, dear: leave the city by the eastern gate and go straight on: you will see a white royal elephant prostrate, touching the earth in seven places :: that will be a sign for you to lay out a city there and dwell in it: and the name of it will he Hatthipura."
canonical-instances:
  - "Rather than have five siblings fight over control of a scandal-tainted family company, the estate's advisor sends each of them off with capital to start a separate venture in a different city, so no single claim on the tainted brand has to be defended."
critical-questions:
  - "Does spreading the risk across several new, independent claims actually protect the heirs, or does it just delay a reckoning with whatever caused the original claim to collapse?"
  - "What is lost — shared resources, combined standing, a unified claim — by choosing dispersal over consolidation when the original inheritance falls apart?"
status: active
