id: lex-zd7vh
name: argument-from-slippery-slope-as-gradualism-plus-intolerable-terminus
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When you hear a slippery-slope argument, separate the gradualism claim (small steps lead to bigger steps) from the intolerable-terminus claim (the endpoint is bad). Defeasible at both joints: the slope may not be slick, or the terminus may not be intolerable."
related: [lex-af9ax, lex-th68b, lex-hesjt, lex-2s3ze, lex-xhwqt, lex-utn22, lex-aut4h, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-tpv83, lex-chtk9, lex-9uac6, lex-xqamc, lex-y48fs, lex-55dm8, lex-hsnup, lex-urwym, lex-r7zuy, lex-bg3ad, lex-pn7cf, lex-95qfv]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt]
evokes: [sorites-paradox, heap-paradox, gradualism, camel-nose-under-tent, where-do-you-draw-the-line, foot-in-the-door, pandoras-box, no-defensible-stopping-point, slope-mechanism, intolerable-terminus]
premises:
  - "starting claim or action A is accepted (or proposed)"
  - "there exists a sequence A → B1 → B2 → ... → Bn → C such that each transition is defensible (small step, similar case, vague-term-failure-of-reversal, precedent-binding)"
  - "the terminus C is intolerable (absurd, monstrous, catastrophic, contradictory)"
  - "no defensible stopping-point between A and C exists (no principled criterion distinguishes one step from the next)"
  - "therefore A must be rejected (by reductio against C)"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(propose-gradualist-sequence, identify-intolerable-terminus, deny-stopping-point) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "is the slope-mechanism real — does each transition actually have non-trivial probability of producing the next step? Walton's CQ2 for precedent-slippery-slope. Slope-arguments often assert step-to-step linkage that depends on unanalyzed assumptions about social momentum, judicial logic, technology dynamics. When the mechanism is named (cost-lowering, attitude-altering, precedent-binding, vague-term-creep) the slope may be real; when unspecified, it's likely fallacious"
  - "is the terminus C actually intolerable, or is it being portrayed as intolerable through framing? Walton's CQ3. Many slippery-slope arguments smuggle in the conclusion that C is monstrous; if C is actually defensible or merely undesirable, the reductio fails. Test: state the terminus in neutral terms and ask whether someone could in fact defend it"
  - "is there a principled stopping-point between A and C that the argument is suppressing? The strongest slippery-slope defeater. Most real legal / policy / engineering systems operate fine despite vague terms because principled-stopping-points exist (line-drawing by domain experts, judicial interpretation, deliberate friction). The argument is fallacious whenever it asserts no-stopping-point-exists but principled stopping-points are widely deployed in practice"
  - "is this a SORITES variant (vague-term failure-of-reversal once chain enters grey area) or a PRECEDENT variant (case-to-case binding through analogy-or-consistency)? Different defeater-strategies. Sorites is defused by accepting fuzzy boundaries, supervaluationist semantics, or pragmatic stipulation. Precedent-slippery-slope is defused by distinguishing the cases on relevant grounds or by accepting some cases as exceptions to the precedent without binding others"
  - "could the argument be a CONSISTENCY-DEMAND in slippery-slope clothing? Sometimes 'if you accept A you must accept C' is just the demand to treat like cases alike. If C is actually entailed by A under any principled view, the right response is to either accept C, distinguish A from C explicitly, or revise the principle — not to reject A. Conflating consistency-demands with slippery-slope erodes both"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.3 §9 'Slippery Slope Arguments' (pp.113-117). Walton presents three slippery-slope variants: argument-from-gradualism (the underlying form), sorites-slippery-slope (vague-term failure-of-reversal; the heap paradox lineage), and precedent-slippery-slope (case-to-case binding). Three CQs for precedent-slippery-slope (precedent-set, intervening-evidence, terminus-intolerable). Walton notes slippery-slope arguments are particularly common in law and medical-ethics. Citing Walton 1992a, 1995, 1996, 1999. Local copy."
    quote: "All slippery slope arguments are based on an underlying form of reasoning called argument from gradualism, in which a respondent is persuaded of the conclusion through a series of small steps. [...] Scheme for Argument from Gradualism: Proposition A is true (acceptable to the respondent). There is an intervening sequence of propositions, B1, B2, ... Bn-1, Bn, C, such that the following conditionals are true: If A, then B1; if B1, then B2; ... ; if Bn-1, then Bn; if Bn, then C. The conditional 'If A then C' is not, by itself, acceptable to the respondent, nor are shorter sequences (than the one specified in the second premise) from A to C acceptable to the respondent. Therefore, the proposition C is true (acceptable to the respondent). [...] If you take one grain away from a heap, it makes no significant difference, you still have a heap. Each time you repeat this step, it makes no difference, because one grain is too small to make a difference between something being a heap or not. But repeated long enough, the conclusion of this reasoning will become absurd, for it will become obvious that what is left can no longer be described as a heap. [...] Scheme for the Sorites Slippery Slope Argument: Initial Base Premise: It is clearly beyond contention that a1 has P. General Inductive Premise: If ak has P, then ak+1 has P. Reapplication Sequence: A sequence of modus ponens subarguments linking premises and conclusions from the clear area through the grey area. Conclusion: an may have P, for all we know (or can prove). [...] Critical Questions for Argument from Precedent Slippery Slope: CQ1: Would Ca set a precedent? CQ2: What is the evidence showing why each of the cited intervening precedents would occur? CQ3: Is Cn as intolerable as it is portrayed?"
  - source: primary
    text: cicero-c45bce-academica-book-ii-on-sorites-as-fallacious
    citation: "Marcus Tullius Cicero, *Academica* (Academic Questions) Book II §92-94 + §49, written c.45 BCE, presenting the Academic-Skeptic critique of Stoic dogmatism via the sorites paradox. Charles Duke Yonge translation 1853, public domain via Project Gutenberg eBook #29247. METHODOLOGICALLY-DISTINCT SECOND PRIMARY for the gradualism-plus-intolerable-terminus pattern. Five-way methodological distinctness from Walton 2008: (i) era — 45 BCE vs 2008 CE (~2050 year separation); (ii) method — dialectical debate between Academic-Skeptic and Stoic positions, transmitted as a Latin philosophical treatise vs contemporary informal-logic textbook scheme; (iii) theoretical frame — Carneades-Stoic dispute about the criterion of truth vs Walton's CQ-instrument for argumentation-scheme classification; (iv) inferential warrant — Cicero's text is the proximate Latin transmission of the Greek dialectical tradition (Eubulides, Chrysippus) and bears the etymological taproot for 'slippery slope' as a fallacy-name; (v) substantive contribution — Cicero explicitly identifies the Chrysippus 'arrest' technique (resting at some interrogation-step rather than continuing) as the principled-stopping-point defense, anticipating Walton's CQ3 (is there a principled stopping-point?) by 2050 years. Substrate-meta note: Cicero's literal phrasing 'sorites, a very slippery and hazardous topic' is potentially the etymological taproot for the modern fallacy-label 'slippery slope' — substrate-level evidence that lex-zd7vh's name preserves the classical Latin metaphor. The Academic-Skeptic critique of the sorites also subtly differs from Walton's defeasible-scheme framing: where Walton treats slippery-slope as a defeasible argument that can be reasonable given a real slope-mechanism, Cicero (via Carneades) treats it as a 'vicious and captious style of arguing' to be 'crushed' as a paradigm of Stoic-dogmatist abuse. This substantive divergence strengthens the methodological-distinctness argument: the two primaries do not just describe the same pattern from different methodologies — they take partially-incompatible normative postures toward the pattern."
    quote: "(Book II §92 on sorites as fallacious gradualism:) step by step, minute items from a proposition, is a kind of argument very little to be approved of in philosophy. They call it sorites,(11) when they make up a heap by adding grain after grain; a very vicious and captious style of arguing (Book II §93 on the sorites as 'slippery and hazardous' — etymological taproot:) sorites, a very slippery and hazardous topic, and a class of argument which you yourself pronounced to be a vicious one. XXIX. What then, you will say; are we to be blamed for that viciousness? The nature of things has not given us any knowledge of ends, so as to enable us, in any subject wha (Book II §94 on the Chrysippus 'arrest' as principled-stopping-point defense:) Chrysippus’s plan is, when he is interrogated step by step (by way of giving an instance), whether there are three, or few, or many, to rest a little before he comes to the “many;” that is to say, to use their own language, ἡσυχάζειν. Rest and welcome, says Carneades; you may even snore, for all I care. But"
  - source: primary
    text: diogenes-laertius-c225-lives-of-eminent-philosophers-book-vii-stoics
    citation: "Diogenes Laertius, *Lives and Opinions of Eminent Philosophers* Book VII (the Stoics), composed c.225 CE, transmitting earlier Stoic logic-and-dialectic teachings particularly of Chrysippus (c.279-206 BCE). Charles Duke Yonge translation 1853, public domain via Project Gutenberg eBook #57342. Methodologically-distinct THIRD primary at a different point in the transmission-chain: where Cicero gives the Academic-Skeptic critique of the sorites and Walton gives the contemporary informal-logic CQ-instrument, Diogenes Laertius gives the doxographical Stoic-internal classification of sorites as one of the sophism-categories Stoic dialectic was developed to handle. Book VII presents (a) sorites as a named category of sophism alongside the horned, the nobody, the mower, the veiled — Stoic logic developed an entire classification system for fallacy-kinds that long pre-dates Walton's scheme-catalogue; (b) the 'arrest' technique attributed to Chrysippus — the principled stopping-point defense (per the translator's footnote 105: 'the argument by progression is the sorites. The arrest is the method of encountering the sorites, by taking some particular point at which to stop the admissions required by the sorites'). The substrate-extension contribution: lex-zd7vh's CQ3 (is there a principled stopping-point?) is the Chrysippean 'arrest' under another name. Methodological distinctness from Cicero: (i) tradition — Stoic-internal vs Academic-skeptic-external critique; (ii) genre — doxographic biography compilation vs philosophical treatise; (iii) era — c.225 CE vs c.45 BCE; (iv) treatment — Diogenes catalogues sorites as a sophism-category WITHOUT taking a normative stance on it, while Cicero attacks it as captious — the two primaries thus span the descriptive/normative axis of the classical engagement with the pattern."
    quote: "(Book VII on sorites as one of the named sophism-categories Stoic dialectic addresses:) sophisms are of various kinds; there is the false one, the one which states facts, the negative, the sorites, and others like these; the imperfect one, the inexplicable one, the conclusive one, the veiled one, the horned one, the nobody, and the mower. (Book VII on the sorites as 'veiled' or 'concealed' argument-progression:) such as are called sorites, the horned one, or the nobody. That is a veiled argument[88] which resembles the following one; “two are not a few, nor three, nor those, nor four, and so on to ten; but two are few; therefore, so are ten few.” The nobody is a conjunctive argument, and one that c"
canonical-instances:
  - "Chrysippus's 'arrest' technique (3rd c. BCE Stoic logic, transmitted via Cicero *Academica* II and Diogenes Laertius VII): when interrogated step-by-step via a sorites — 'are three many? are four many? are five many? ...' — Chrysippus's prescribed defense is to 'rest a little' at some particular point and refuse further admissions, treating the principled-stopping-point as a deliberate dialectical move rather than a confession of arbitrary line-drawing. The classical anticipation of lex-zd7vh CQ3."
  - "Cicero's etymological taproot (45 BCE, *Academica* II): Cicero describes the sorites as 'a very slippery and hazardous topic' (sorites, lubrica res et periculosa) — likely the Latin source for the modern English fallacy-label 'slippery slope.' Substrate-meta evidence that lex-zd7vh's name preserves the classical metaphor across 2050 years and three philosophical traditions (Greek Stoic, Latin Academic-Skeptic, contemporary informal-logic)."
  - "sorites: the classical heap-paradox — one grain at a time; at no step does removal turn a heap into non-heap; yet the chain produces no-heap (Eubulides of Miletus, 4th c. BC; transmitted via Cicero *Academica* II and Diogenes Laertius VII)"
  - "the bald-man variant: one hair at a time; no step makes someone bald; yet chain produces baldness"
  - "abortion debate: if a baby has rights at week 38, by what principle does it not at week 37, week 36 (etc) down to conception? Walton's Ted-Marcia example for vague-term slippery slope"
  - "VAT-introduction strategy (Walton's example): government introduces a 3% VAT, raises it gradually every few years to the politically-impossible 18% terminus — each step too small to mobilize opposition"
  - "free-speech precedent cases: if extreme-speech-X gets first-amendment protection, what stops extreme-speech-Y from claiming the same precedent? Walton: line-drawing under genuinely vague terms"
  - "criminal-law mens-rea-creep: if reckless conduct counts as criminal at threshold T, by what principle does T-1 not, T-2 not, etc — eventually criminalizing ordinary risk"
  - "AI capability discourse: 'if we allow X capability deployment, what stops Y, then Z, then unaligned-superintelligence?' — sometimes a real slope-mechanism (cost-lowering for next step), sometimes lazy reductio"
