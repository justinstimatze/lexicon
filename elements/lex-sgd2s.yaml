id: lex-sgd2s
name: prefer-the-explanation-with-fewest-assumptions
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When choosing among explanations, prefer the one requiring fewest assumptions. Occam: the parsimony principle isn't a guarantee of truth but a TIE-BREAKER and prior-weight. Don't multiply entities; the cost of the assumption is upstream of its plausibility."
related: [lex-3ajns, lex-4ww6k, lex-axa6h, lex-eehjz, lex-ngc66, lex-nn3u9, lex-rfxtb, lex-vf5ff, lex-vmas8, lex-yf8ar, lex-zag9z]
evokes: [occams-razor, ockhams-razor, parsimony, novacula-occami, law-of-parsimony, principle-of-parsimony, simplest-hypothesis-wins, do-not-multiply-entities-beyond-necessity]
lineage:
  - source: practitioner
    text: wikipedia-occams-razor-2025-12
    citation: "Wikipedia 'Occam's razor' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Occam%27s_razor). Public-domain epistemic/scientific primitive — attributed to William of Ockham (c. 1287-1347 CE) but anticipated by Aristotle, Ptolemy, and others; the canonical Latin formulation 'entia non sunt multiplicanda praeter necessitatem' (entities should not be multiplied beyond necessity) is attributed to John Punch 1639 (not Ockham himself, though related to his actual statements). The substrate-claim: among competing explanations or hypotheses that fit the available evidence equally well, prefer the one with the FEWEST assumptions, entities, or moving parts. The transferable shape is PREFER-FEWEST-ASSUMPTIONS-AMONG-FITTING-EXPLANATIONS: a default-rule (not a guarantee) for hypothesis-selection when evidence is consistent with multiple causal stories. Importantly, Occam's razor is NOT an argument against complexity per se — it's a heuristic for choosing AMONG equally-supported explanations. When evidence prefers a complex hypothesis over a simple one, parsimony does not override. The technique's modern formalizations include Akaike Information Criterion, Bayesian Information Criterion, and minimum-description-length — each rigorizes 'fewer assumptions' as 'lower model complexity penalty.'"
    quote: "[Wikipedia 'Occam's razor', 2025-12 ZIM snapshot:] 'In philosophy, Occam's razor (also spelled Ockham's razor or Ocham's razor; Latin: novacula Occami) is the problem-solving principle that recommends searching for explanations constructed with the smallest possible set of elements. It is also known as the principle of parsimony or the law of parsimony.' [The substrate-claim is the PARSIMONY HEURISTIC: among hypotheses that equally fit available evidence, prefer the one with fewer assumptions. This is a default-rule, not a guarantee — it bets that nature is more often simple than not, and that simpler hypotheses are easier to test, easier to falsify, and require less ad-hoc rescue. The principle is widely used: in medical diagnosis (the 'common things are common' heuristic), in epistemology (rejecting unnecessary entities like Cartesian-demon-deceptions), in scientific theory-choice (Copernicus vs Ptolemy), in software engineering (YAGNI — You Aren't Gonna Need It), and in personal decision-making (when in doubt, assume cock-up not conspiracy — Hanlon's razor as a special case). Modern formalizations: AIC and BIC explicitly penalize model-complexity; minimum-description-length (Rissanen 1978) treats hypothesis-quality as compression-quality. The principle has its critics: the universe is in fact often complex, and parsimony is a HEURISTIC not a LAW. The substrate-meta lesson: when evidence is tied, prefer simplicity; when evidence is not tied, follow the evidence.]"
  - source: primary
    text: ockham-quodlibeta-septem-quodlibet-iii-q6
    citation: "William of Ockham, Quodlibeta Septem, Quodlibet III, Question VI (c.1322-1324), on whether an animal's organic parts (flesh, bone) are distinguished by species. The Logic Museum (logicmuseum.com), Latin with facing English translation. This is Ockham's own actual wording of the razor — not the popular 'entia non sunt multiplicanda praeter necessitatem,' which the Wikipedia entry above already correctly notes traces to John Punch 1639, not Ockham. Scholastic-disputation format: the passage occurs inside the 'Contra' argument of the question (Ockham deploying an already-accepted maxim as one side's premise, not coining it fresh in this exact spot) — the phrasing recurs across Ockham's corpus in this same argumentative role, which is the actual pattern of how he used it."
    quote: "'Una forma substantialis sufficit pro omnibus; igitur non sunt plures ponendae, quia pluralitas non est ponenda sine necessitate.' [English, same page:] 'One substantial form suffices for all; therefore there are no pluralities to be posited, because plurality is not to be posited without necessity.'"
canonical-instances:
  - "Medical diagnosis (Hickam's dictum vs Occam's razor): the 'one-condition-explains-all-symptoms' diagnosis (Occam) usually beats the multiple-coincident-conditions diagnosis (Hickam). When one diagnosis explains every observed symptom, prefer it. But when the one-condition story requires rare-coincidence or contradicts a symptom, multiple-conditions may be correct."
  - "Copernicus vs Ptolemy: both heliocentric and geocentric models could be fit to planetary observations of the era, with sufficient epicycles. Copernicus's model had fewer arbitrary parameters; Galileo's evidence later resolved the tie. Parsimony as theory-choice when evidence ties."
  - "Einstein vs ether theories: special relativity dispensed with the luminiferous ether (an unobservable entity); Lorentz's ether theory could fit the same Michelson-Morley data with additional ether-properties. SR won partly on parsimony."
  - "Software engineering — YAGNI (You Aren't Gonna Need It): when designing, don't add features or abstractions that current requirements don't need. Parsimony at code-architecture layer."
  - "Hanlon's razor: 'Never attribute to malice that which is adequately explained by stupidity / incompetence.' Special-case of Occam — malice requires assuming intent + capacity + opportunity; stupidity requires only one of these. Hanlon is parsimony applied to attribution-of-cause."
  - "Statistical model selection: AIC = 2k - 2ln(L), where k is parameter count. Penalizes additional parameters unless they substantially improve fit. Operationalization of Occam's razor in modeling practice."
  - "Bayesian Occam's razor (MacKay 2003): the prior probability of a hypothesis with more parameters is spread thinner over the parameter space, so even with no explicit complexity penalty, simpler hypotheses with the same likelihood get higher posterior. Parsimony as automatic consequence of Bayes."
  - "Minimum-description-length (Rissanen 1978): the best model is the one that produces the shortest description of (model + data given model). Compression-as-explanation, with Occam built in."
  - "operationally distinct from lex-axa6h order-of-magnitude-approximation: lex-axa6h is a strategy for tractability (give up precision for usability); lex-sgd2s is a hypothesis-selection rule (choose simpler among equally-fitting). Different purposes."
  - "operationally distinct from lex-nn3u9 extraordinary-claims-require-extraordinary-evidence (Sagan): Sagan's razor is about EVIDENCE-PROPORTIONALITY (proportional to claim's prior-improbability); Occam is about ASSUMPTION-MINIMIZATION among fitting explanations. They compose: extraordinary-claims have higher complexity-cost AND require higher evidence-threshold."
  - "operationally distinct from lex-rfxtb multifactorial-frame: multifactorial-frame favors HIGHER complexity (multiple causes, fox-cognition); Occam favors LOWER complexity. These are at-tension; the right balance depends on whether the phenomenon is genuinely simple or genuinely complex. Multifactorial-frame is the corrective when Occam over-simplifies."
  - "compose-related with lex-eehjz: reductio is a proof-technique; Occam is a hypothesis-selection-rule. They compose in theory-construction: build theory with parsimony, then test by trying to derive contradictions from it."
critical-questions:
  - "what counts as a 'simpler' explanation? Multiple operationalizations: (a) FEWER FREE PARAMETERS in a parametric model (AIC, BIC); (b) SHORTER PROGRAM/DESCRIPTION (Kolmogorov complexity, MDL); (c) FEWER ENTITIES POSTULATED (the original Ockham formulation); (d) MORE BAYESIAN-AUTOMATIC (MacKay). These don't always agree — sometimes the 'simpler' theory under one metric is not under another. Practitioner-discipline: name your simplicity-metric explicitly when invoking Occam."
  - "when does Occam fail? When the universe IS complex relative to our expectations. Biology (which is genuinely messy, with many co-acting causes), medicine (Hickam's dictum: 'patients can have as many diseases as they damn well please'), and policy (multifactorial causation) are examples where over-applying Occam misses real complexity. Practitioner-discipline: Occam is a TIEBREAKER, not a force-of-nature; when evidence prefers complexity, follow the evidence."
  - "is parsimony empirically justified or just an aesthetic preference? Both. Empirically, simpler theories generalize better out-of-sample (PAC learning theory, statistical-learning-theory bounds; Vapnik-Chervonenkis dimension). Aesthetically, simpler theories are easier to communicate, debug, falsify. The empirical justification is the strong one; the aesthetic one alone is not enough."
  - "what about 'simpler' theories that are simpler by hiding parameters? A theory with one explicit parameter and 100 hidden assumptions is not simpler than one with 10 explicit parameters. Practitioner-discipline: count assumptions including the hidden ones (implicit boundary conditions, implicit calibrations, modeling-choices). 'Cocktail-napkin Occam' often misses this."
  - "how does Occam interact with hypothesis-testing? In null-hypothesis-significance-testing, the null is often the simpler hypothesis; rejecting it requires the data to strongly disfavor it. This is Occam-compatible: when in doubt, stay with the simpler null. But it produces classic critique problems (null is often a strawman, the alternative is what's interesting; significance-vs-effect-size confusion). The substrate-meta lesson: Occam works best when null and alternative are genuinely competing on equal evidential terms."
