id: lex-swhh3
name: fluency-in-both-worlds-reads-as-loyalty-to-neither
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A role built to represent one world to another -- public relations speaking for the corporation to the public, a financial manager translating the firm's position to outside markets -- earns suspicion from both sides at once, generated by the role's own design regardless of what the person in it actually does. Being fluent enough in the external world's language to be useful internally reads, from inside, as too identified with outsiders; being close enough to the organization to have real information reads, from outside, as too identified with the organization. Freeman's PR interviews return this as the job's defining complaint: 'No one in the company listens to us... Our publics don't listen to us. They want to speak to someone who can make decisions.' He generalizes it structurally: the boundary-spanner has 'little credibility inside the organization (too identified with external groups) and little credibility outside the organization (too identified with the organization),' caught in the middle of exactly the change the role exists to manage. No dishonesty or divided loyalty is required to produce this bind -- the credibility gap is a function of occupying the position at all."
related: []
evokes: [freeman-1984-strategic-management, chapter-8, boundary-spanner, public-relations, external-affairs]
lineage:
  - source: primary
    text: freeman-1984-strategic-management-ch8
    citation: "R. Edward Freeman, Strategic Management: A Stakeholder Approach (Pitman, 1984), Chapter 8 'The Functional Disciplines of Management,' section 'External Affairs: A New Role for Public Relations and Public Affairs.'"
    quote: "Exhibit 8.2 depicts the role of the PR person as boundary spanner (Thompson, 1967), having little credibility inside the organization (too identified with external groups) and little credibility outside the organization (too identified with the organization). In short, as Exhibit 8.2 depicts, the PR manager is caught in the middle of all of the environmental change described in chapter One... No one in the company listens to us. They do things as if we didn't exist, and expect us to handle it. Our publics don't listen to us. They want to speak to someone who can make decisions."
canonical-instances:
  - "A company's community liaison, hired specifically to speak the neighborhood's language, gets read by management as 'going native' whenever they push back on a decision, and gets read by the neighborhood as a corporate mouthpiece whenever they defend one -- both readings are triggered by the same fluency that was the reason the role exists."
  - "An immigration caseworker who is fluent in both the agency's procedures and the client's language and culture is trusted by neither side outright: the agency treats client-facing warmth as a sign the caseworker is too soft on enforcement, and clients treat procedural fluency as a sign the caseworker really works for the agency against them."
critical-questions:
  - "Does the credibility gap shrink with tenure and a track record, or is it structurally renewed every time the boundary-spanner does their job well enough to be visibly useful to one side?"
  - "Is there an organizational design that gives a boundary-spanner independent standing with both sides at once, or does every fix (more authority, a formal charter, a reporting line) just relocate whose suspicion the role attracts?"
