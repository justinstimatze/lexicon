id: lex-j9jcf
name: indirect-self-reference-reconstructs-the-banned-paradox
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A named feature sometimes gets blamed for a paradox, with elimination proposed as the fix. Before trusting that fix, try rebuilding the paradox with the named feature absent. Popper's Theaetetus addresses philosophers who claim the Liar paradox cannot arise because 'a meaningful and properly constructed statement cannot refer to itself,' and shows the ban failing on contact: 'it cannot solve the paradox if you admit that indirect self-reference is admissible. For, as Russell and Jourdain and Langford have shown (and Buridan before them), the Liar or the Epimenides can be formulated by using indirect self-reference instead of direct self-reference.' He then builds it live, using two ordinary statements that refer only to each other, neither one referring to itself: 'The next assertion I am going to make is a true one,' followed immediately by 'The last assertion I made was untrue.' Socrates confirms the result: 'It is old Epimenides all over again.' Banning direct self-reference never touched the actual generative structure, because the paradox only ever required a closed reference cycle -- one statement pointing at another which points back -- and a pair of statements supplies that cycle just as completely as a single self-referring one does. Diagnostic move: before adopting a fix that removes some named surface feature of a problem, try to construct the problem again with that feature absent. If the reconstruction succeeds, the feature was never the actual mechanism, and the fix removes nothing however plausible it sounded going in."
