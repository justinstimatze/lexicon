    text: radin-sitconski-becomes-a-moose-to-lure-and-kill-the-eagle
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'Summary of the Assiniboine Trickster Myth' (after R. H. Lowie, The Assiniboine, Anthropological Papers of the American Museum of Natural History, Vol. IV, 1909), episode 8. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Sitconski wishes to travel with the eagle. Eagle abandons him on a mountain top. Sitconski tumbles down head foremost, and sticks in a swamp. When he frees himself, he turns into a moose to entice the eagle down. When the eagle eats of the meat, Sitconski kills him."
canonical-instances:
  - "A supplier who was cut loose by a buyer the moment a cheaper option appeared rebrands as exactly the kind of vendor that buyer's rival is actively hunting for, and waits for the outreach instead of chasing the original buyer back."
  - "An employee passed over for a promotion by a manager who only responds to visible wins builds a highly visible side project in the manager's own area of interest, drawing that manager to seek them out instead of asking again directly."
critical-questions:
  - "Does the mechanism require the pursuer's appetite to be specific and predictable, and would it fail against a predator whose interest can't be anticipated or manufactured as bait?"
  - "Is there a real difference between becoming bait to lure someone within reach and simply setting a trap, or does the transformation into something desirable add something a static trap couldn't accomplish?"
  - "What does it cost Sitconski to make himself into prey even temporarily, and does the story consider that risk, or does it treat the disguise as costless because he controls when to stop being a moose?"
