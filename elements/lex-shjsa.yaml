id: lex-shjsa
name: pin-an-existence-claim-to-a-place-and-time-to-make-it-testable
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone offers a bare existence claim -- something exists, somewhere, that would explain or support their position -- don't accept or reject it on the strength of the claim's content alone; check whether it names a place and time you could actually go check. Popper's diagnosis: an isolated, unlocated existential statement can be searched for forever without ever being refuted, because absence-so-far never rules out presence somewhere still unsearched. 'There exists a perpetual motion machine' and 'There exists a sea-serpent' both have this shape -- no failed search anywhere can close the possibility that the thing is elsewhere. But pin the same claim to a location and moment -- 'There is a sea-serpent now on view in the British Museum' -- and it becomes trivially testable: go look, and it's confirmed or refuted on the spot. The universal law built on this same asymmetry gets stated as a negation for exactly this reason: 'There does not exist any perpetual motion machine' (Planck's formulation of the First Law of Thermodynamics) is a genuine, testable law precisely because any single working machine anywhere would refute it, while its positive existential counterpart could never be pinned down enough to test. Diagnostic move: when evaluating an existence claim -- a cure that works, a document that proves it, a witness who saw it, a market that wants it -- ask whether the claim specifies where and when to look. If it does, it's a claim you can act on: go check. If it doesn't, the vagueness isn't a minor omission waiting to be filled in later -- it's what's making the claim un-checkable right now, and unlocated confidence in it is doing the work that evidence should be doing."
