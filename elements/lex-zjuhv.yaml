id: lex-zjuhv
name: majority-rule-can-license-total-expropriation-of-a-minority
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A clean, procedurally consistent majority decision proves nothing about whether it treated the losing side fairly -- check what actually happened to whoever was outvoted. Sen works this out with a bare two-option case built from Arrow's own cake-division example: option x splits a cake equally among three people; option y gives person 1 nothing and splits the whole cake between persons 2 and 3. Sen: “There is no problem of intransitivity here (because there are only two distinct states), and no absence of majority winner (y wins over x by a two-to-one majority). But in what sense is y a 'satisfactory' welfare-economic outcome in this choice problem? Person 1 has been driven completely to the wall and 2 and 3 have been fattened up more. It is very hard to maintain that the majority rule is 'a plausible way of aggregating preferences' for these welfare-economic judgements.” With only two options on the table, majority rule can never produce a cycle or fail to pick a winner -- every formal worry Arrow's theorem raises is simply absent. And majority rule still validates a coalition of two stripping the third person of everything. Diagnostic move: when a vote or a majority-backed decision comes out clean and formally unimpeachable, that tells you nothing yet about what it did to the losing side. Check the actual distribution the decision produced, separately from whether the procedure that produced it was well-behaved -- a procedure can be flawless by every formal test and still authorize the majority taking everything from the minority."
