id: lex-ac9ga
name: feigned-madness-and-slander-outcompete-virtue-in-a-gullible-society
type-in: process
type-out: frame
_tier: atomic
agent-instruction: "In a society whose members can't reliably distinguish genuine merit from performance, the fastest route to material success runs through fabricated eccentricity, slander, theatrics, and abandoned shame, not through actual virtue, since a gullible audience rewards the appearance of remarkability regardless of what's actually behind it. In the Jataka's tale of the two students, a teacher explains this playbook to his pupil as simple fact, not cynicism: 'He that hath madness, he that slanders well, That hath an actor's tricks, ill tales doth tell, Such is the man that wins prosperity Where all are fools: let this your maxim be.' The virtuous pupil rejects the advice and leaves for a hermit's life instead. The teacher's claim was never about what deserves to win. Only about what actually does, given the audience."
