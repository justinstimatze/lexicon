id: lex-h4fvk
name: group-boundary-is-invoked-by-frame-not-fixed-by-identity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When judging whether someone counts as 'one of us,' notice that the line isn't a fixed fact about the person — it's redrawn by whichever frame the situation activates, and the same person can fall on opposite sides of it within the same audience. Merton: 'There is nothing fixed or eternal about the lines separating the in-group from out-groups. As situations change, the lines of separation change. For a large number of white Americans, Joe Louis is a member of an out-group-when the situation is defined in racial terms. On another occasion, when Louis defeated the nazified Schmeling, many of these same white Americans acclaimed him as a member of the (national) in-group. National loyalty took precedence over racial separatism.' The mechanism cuts both ways and can expose a boundary-drawer's own logic as self-defeating: when Black American athletes dominated the Berlin Olympics, the Nazis pointed to the second-class citizenship assigned Negroes in various regions of this country and denied that the United States had really won the games, since the Negro athletes were by America's own admission \"not full-fledged\" Americans — using America's own racial-exclusion frame to try to discount an outcome produced under a national-inclusion frame. Diagnostic use: before treating group membership as a settled property of a person, name which frame is currently active (racial, national, professional, generational, etc.) and check whether switching to an adjacent frame would flip which side of the line they're on — if it would, the boundary is doing situational work, not describing a fixed fact."
related: []
evokes: [merton-1957, joe-louis-schmeling, frame-dependent-group-boundary, national-loyalty-over-racial-separatism, berlin-olympics-1936, not-full-fledged-americans]
lineage:
  - source: primary
    text: merton-1957-joe-louis-in-group-out-group
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XI 'The Self-Fulfilling Prophecy,' pp.425-426. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). A page-turn running head ('(426) / SOCIAL THEORY AND SOCIAL STRUCTURE') interrupts the source scan mid-sentence between 'really' and 'won the games'; that pagination artifact is elided with an ellipsis rather than reproduced as running text."
    quote: "'There is nothing fixed or eternal about the lines separating the in-group from out-groups. As situations change, the lines of separation change. For a large number of white Americans, Joe Louis is a member of an out-group-when the situation is defined in racial terms. On another occasion, when Louis defeated the nazified Schmeling, many of these same white Americans acclaimed him as a member of the (national) in-group. National loyalty took precedence over racial separatism. These abrupt shifts in group boundaries sometimes prove embarrassing. Thus, when Negro-Americans ran away with the honors in the Olympic games held in Berlin, the Nazis, pointing to the second-class citizenship assigned Negroes in various regions of this country, denied that the United States had really ... won the games, since the Negro athletes were by our own admission \"not full-fledged\" Americans.'"
canonical-instances:
  - "A company's engineering org treats a contractor as an outsider for headcount and equity purposes, then claims them as 'one of the team' when citing the contractor's shipped feature in an all-hands demo — the same person, two different frames invoked depending on which claim is currently useful."
  - "A country excludes a diaspora community from full civic belonging domestically, then invokes that same community's achievements as national pride when they succeed internationally — visible as the identical structural move Merton names, run by a different in-group under a different flag."
critical-questions:
  - "Is frame-switching here always strategic or self-interested, or can it also run as a genuine, non-cynical widening of moral concern (the way national pride can authentically override racial prejudice in the moment, even if it reverts afterward) — and if both happen, how would you tell them apart from the outside?"
  - "Does naming the frame-switch to someone actually change their boundary-drawing, or does pointing out the inconsistency just prompt a post-hoc justification for why the two cases are really different after all?"
