id: lex-mrhyp
name: slowing-the-driver-keeps-a-fast-part-from-outrunning-a-slow-one
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a single driving force pushes a system whose parts respond at different speeds — a fast-heating exterior and a slow-heating center, a fast-reacting subsystem and a slow-reacting one — check whether weakening the driver, not just watching the slow part more closely, is what actually protects the fast part. America's Test Kitchen's own explanation: 'Whether cooked by conduction, convection, or radiant heat, the outside of food always cooks faster than the inside. And if the temperature is too high, the outer layers may become overcooked by the time conduction moves the heat toward the center of the food... A greater difference in temperature between the food's edge and its center means that this will happen faster. Conversely, a smaller temperature difference within the food will help the exterior retain more moisture and produce more uniform cooking.' The exterior doesn't overcook because it's watched too little — it overcooks because the gap between it and the slower-responding center stays open too long at too high an intensity. Shrinking that gap, by turning down the driving force itself, is what keeps the fast part from finishing badly while the slow part is still catching up. Turning down the driving force is what closes that gap; watching either endpoint more closely never does."
