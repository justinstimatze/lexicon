id: lex-v9k6f
name: rejecting-an-idea-because-its-source-group-is-negative
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone rejects a claim, technique, or proposal not on its merits but because of who holds it, check whether a NEGATIVE reference group is doing the work. Merton, building on Newcomb's distinction: 'The positive type involves motivated assimilation of the norms of the group or the standards of the group as a basis for self-appraisal; the negative type involves motivated rejection, i.e., not merely non-acceptance of norms but the formation of counter-norms.' A negative reference group is not just a group you don't belong to — it is a group whose positions you are motivated to oppose, such that its endorsement of X becomes evidence against X, independent of X's actual content. Merton's own illustration is pointed: 'Charles Singer, the historian of science, has suggested that even the outstanding schools of medicine in ancient Greece rejected the concept of infection in disease precisely because it was held by the \"barbarians.\"' He generalizes it symmetrically rather than parochially: 'it has often been noted that many Americans will reject out of hand conceptions which have merit in their own right, simply because they originated in Soviet Russia or are currently popular there. It would appear that many Russians do much the same for conceptions tagged as American.' The diagnostic move: when you notice an idea being dismissed with unusual heat or speed, ask who is credited with holding it, and whether that credit — not the idea's content — is doing the rejecting. This also predicts a specific failure mode: a negative reference group can make its members permanently unable to adopt a correct idea, a useful technique, or a good policy for as long as it stays tagged with the wrong source, and un-tagging it (attributing it to a neutral or friendly source) is often sufficient to make it acceptable again with no change to the idea itself."
