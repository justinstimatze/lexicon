id: lex-dcr6p
name: unmistakable-effects-certify-an-unseen-cause
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "When deciding whether to believe in the existence of something you cannot directly observe, check whether its effects are as forceful, repeatable, and structurally specific as those of an already-confirmed visible cause of the same category — that structural match, not mere impressiveness, is what licenses confident belief rather than tentative hypothesis. Lucretius's Book I (De Rerum Natura) states this exactly. Having argued that atoms exist despite being too small to see, he defends the principle with a case everyone already accepts: winds. 'The winds infuriate lash our face and frame, / Unseen, and swamp huge ships and rend the clouds, / Or, eddying wildly down, bestrew the plains / With mighty trees.' No one doubts winds are real physical bodies, even though no one has ever seen one — the confidence comes from a direct structural comparison to a visible analog: 'The winds are sightless bodies and naught else— / Since both in works and ways they rival well / The mighty rivers, the visible in form.' The comparison is not vague resemblance; winds do the SAME KIND of work a flood does — uprooting, battering, sweeping away — with the same force and specificity, just unseen. Lucretius then generalizes the same move across every sense but sight: 'we know the varied smells of things / Yet never to our nostrils see them come; / With eyes we view not burning heats, nor cold, / Nor are we wont men's voices to behold. / Yet these must be corporeal at the base, / Since thus they smite the senses: naught there is / Save body, having property of touch.' The mechanism: don't ask merely 'could this unseen thing exist' (weak, permits anything) — ask 'does what I can observe of its effects match, in kind and force, the effects of something I already know to be a real physical cause' — and treat a genuine match as certifying the existence of the unseen cause, not just permitting it as a live possibility. This differs from generic argument-by-analogy, which merely notes two things resemble each other in some respects; here the comparison is a direct structural match WITHIN THE SAME CAUSAL CATEGORY — winds aren't merely 'like' rivers, they are claimed to be doing the identical kind of physical work, unseen. Portable well beyond ancient physics: physicists infer the existence of dark matter not by seeing it but by its gravitational effects on galactic rotation curves and gravitational lensing, effects that match — in kind, if not in visible form — the gravitational signature any confirmed visible mass would produce. A network engineer diagnosing packet loss on a link they cannot physically inspect infers a specific fault (a failing switch, not electromagnetic interference) from the exact signature of the effects — which hosts drop packets, at what times, at what rate — trusting the effect-pattern's specificity over the absence of direct observation, because that pattern structurally matches known switch-failure signatures rather than known interference signatures."
related: [lex-n7dqw, lex-u29fu, lex-2cjtz]
evokes: [winds-are-sightless-bodies-and-naught-else, rival-well-the-mighty-rivers, naught-there-is-save-body-having-property-of-touch, unseen-yet-corporeal-at-the-base]
lineage:
  - source: primary
    text: lucretius-c55bce-de-rerum-natura-book-i-winds-invisible-bodies
    citation: "Titus Lucretius Carus, De Rerum Natura [On the Nature of Things], Book I, trans. William Ellery Leonard (c. 55 BCE; first published 1916, Leonard d. 1944; PD globally). Lucretius defends the reality of unseen atoms by appeal to winds, which are never seen directly yet are known with total confidence to be physical bodies because of the unmistakable force and specificity of their effects, structurally matched against the visible case of rivers."
    quote: "'since I have taught that things cannot / Be born from nothing, nor the same, when born, / To nothing be recalled, doubt not my words, / Because our eyes no primal germs perceive; / For mark those bodies which, though known to be / In this our world, are yet invisible: / The winds infuriate lash our face and frame, / Unseen, and swamp huge ships and rend the clouds [...] The winds are sightless bodies and naught else— / Since both in works and ways they rival well / The mighty rivers, the visible in form.'"
  - source: primary
    text: lucretius-c55bce-de-rerum-natura-book-i-corporeal-senses-coda
    citation: "Same passage, continuing — Lucretius extends the argument to smell, heat, cold, and sound, generalizing the effects-certify-existence structure across every sense but sight."
    quote: "'Then too we know the varied smells of things / Yet never to our nostrils see them come; / With eyes we view not burning heats, nor cold, / Nor are we wont men's voices to behold. / Yet these must be corporeal at the base, / Since thus they smite the senses: naught there is / Save body, having property of touch.'"
canonical-instances:
  - "The direct textual anchor: winds are never seen, yet their capacity to sink ships, uproot forests, and howl with the same force as a visible flood proves them corporeal — generalized immediately to smell, heat, cold, and sound, none of which are ever seen yet all of which are confidently treated as physically real."
  - "Physicists infer the existence of dark matter not by seeing it but by its gravitational effects on galactic rotation curves and gravitational lensing — effects that structurally match, in kind, what any confirmed visible mass would produce, certifying belief rather than merely permitting the hypothesis."
  - "A network engineer diagnosing packet loss on a link with no physical access infers a specific fault — a failing switch, not electromagnetic interference — from the exact signature of the effects (which hosts drop, at what times, at what rate), because that pattern structurally matches known switch-failure signatures rather than settling for 'something unseen is wrong.'"
critical-questions:
  - "isn't this just ordinary inference-to-the-best-explanation / abduction? Related but narrower: the atom names what specifically licenses CONFIDENT belief rather than mere hypothesis — that the unseen cause's effects are as forceful, repeatable, and structurally specific as an already-confirmed visible cause's would be. Lucretius's move is an explicit like-for-like comparison (winds 'rival well... the visible' rivers), not just 'some explanation is needed.'"
  - "how does this differ from lex-n7dqw (LIGO template-matching-against-theoretical-prediction)? lex-n7dqw names a specific modern statistical protocol — comparing noisy data against a precise theoretical waveform template to quantify detection confidence. This atom is the general ancient epistemic principle underlying why such a protocol is trustworthy at all: an unseen cause's reality is certified by effects as specific and forceful as a seen cause's. lex-n7dqw is a highly instrumented descendant of this atom's argument-form, not a restatement of it."
  - "how does this differ from lex-u29fu (discovery-claim-bar-as-community-convention)? lex-u29fu is about WHERE a scientific community sets its confidence threshold (e.g. 5-sigma) for declaring a discovery — a social/statistical convention question. This atom is about the underlying warrant for believing in an unseen entity at all, prior to any question of where to set a formal threshold; Lucretius has no statistical apparatus, only the qualitative structural comparison of effect-strength to a known visible analog."
  - "does the atom claim any sufficiently forceful unseen effect proves its cause is real? No — the comparison must be to a structurally specific known case within the same causal category (winds rival rivers specifically in 'works and ways,' not just 'big impressive effects in general'); a vague or diffuse effect that could have many causes does not license this move."
  - "how is this different from argument-by-analogy in general? Argument from analogy alone is weak — two things resemble each other in some respects, therefore they resemble in others. This atom's specific strength is that it is not analogy to an unrelated case but a direct structural comparison within the same causal category (invisible force vs. visible force, both physical, both measured by their work) — the winds aren't merely 'like' rivers, they are claimed to be doing the identical kind of physical work, just unseen."
