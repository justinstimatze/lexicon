id: lex-2xssd
name: a-trivial-tool-matched-to-true-nature-beats-a-mismatched-weapon
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When your standard weapon fails completely against an opponent, the problem may not be that they're too strong for it -- it may be that they're a fundamentally different kind of thing than the weapon assumes, and something trivial matched to their actual nature will succeed where your best tool utterly failed. In Cushing's telling, two War-gods descend to a village of unfinished, insubstantial Underworld people and try to fight them off with real weapons: arrows pass 'through and through the people, but never a one fell,' and a war-club only leaves a man 'confused (he was too soft and unstable to be hurt).' Then one brother tries something absurd: 'he snatched up a bunch of dry plume-grass and leaped forward. Swish! Two ways he swept the faces and breasts of the pursuers. Lo! right and left they fell like bees in a rain-storm.' Mere grass-straws, useless against a normal body, are devastating against a body made of haze and suggestion rather than solid flesh. The same logic repeats twice more: hair-snares catch birds that kill on contact, and eating a monster's food, rather than fighting it, defeats it outright. Diagnostic move: when a real weapon fails against an opponent completely, stop asking for a stronger version of the same tool and start asking what the opponent is actually made of -- the right answer is often something your normal arsenal would consider too weak to bother carrying."
