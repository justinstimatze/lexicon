evokes: [acquire-purely-to-deny-a-rival-not-because-you-need-it, recruit-first-disband-later, kautilya-obstruct-or-absorb-enemy-mobilisation, denial-by-absorption-not-by-blocking]
lineage:
  - source: primary
    text: kautilya-arthashastra-recruit-first-disband-later
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Planning a Campaign,' 'Troop Mobilisation,' 'General,' {9.2.9,11,12}."
    quote: "'When the enemy tries to mobilise his own troops, the king shall obstruct the mobilisation, divert the potential recruits elsewhere or render the mobilisation ineffective. Or, the king may recruit troops first [to protect them joining the enemy] and, when the time is ripe, disband them.'"
canonical-instances:
  - "A company hears a well-funded competitor is about to go on a hiring spree in a specialized skill area it doesn't urgently need, and instead of trying to outbid the competitor candidate-by-candidate, it makes a round of offers first to the strongest people in that pool, planning to keep the roles lean or let some go later once the competitor's window to build that team has closed."
  - "A distributor buys up more warehouse capacity in a region than its current volume requires, purely because a rival distributor is known to be shopping for the same limited capacity to expand into the market -- once the rival gives up and looks elsewhere, the distributor lets the excess lease lapse rather than keeping it."
critical-questions:
  - "does the carrying cost of absorbing an unneeded resource get systematically underestimated -- maintaining people or capacity you don't actually use has real ongoing costs (pay, morale, idle capital) that could exceed the cost of simply losing the contest to a rival outright?"
  - "is 'disbanding when the time is ripe' actually a clean, low-cost exit in practice, or does releasing people you've recruited and then no longer need carry its own reputational and legal costs (severance, morale damage, a harder time recruiting again later) that the tactic doesn't account for?"
  - "how does an actor know, in the moment, whether the danger has genuinely passed and it's safe to release the absorbed resource, rather than prematurely disbanding it and handing the rival a second opportunity to acquire the same pool they were originally denied?"
status: active
