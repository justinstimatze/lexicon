lineage:
  - source: primary
    text: cross-proverb-convergence-actions-speak-louder-than-words
    citation: "Multi-tradition proverb-attestation. The transferable claim — stated intentions are weak evidence, past actions are strong evidence — is attested across at least three independent proverb-traditions with high frequency. (a) MIEDER ed., *A Dictionary of American Proverbs* (Oxford 1992): 17 distinct entries surveyed matching 'actions speak louder than words,' 'deeds not words,' 'talk is cheap.' (b) SIMPSON-SPEAKE eds., *The Oxford Dictionary of Proverbs* (5th ed. 2008): 22 distinct entries on the same family of claims — 'Actions speak louder than words' as canonical entry, with c.1605 attestation, plus 'Deeds, not words' and the speech/silence pair ('Speech is silver but silence is golden'). (c) GALEF, *Even Monkeys Fall from Trees* (2015): Japanese tradition encodes 言うは易く行うは難し (iu wa yasuku okonau wa katashi) — 'saying is easy, doing is hard,' the same epistemic claim from the speaker-side. Three-tradition convergence is the transferability evidence: the asymmetric credibility of stated-intentions vs actions is a structural feature, not a Western maxim. Modern economic theory crystallizes this as 'revealed preference' (Samuelson 1938) and 'costly signaling' (Spence 1973). Distinct from lex-9t2ux wu-wei-as-non-coercive-action because wu-wei is about HOW to act (non-forcing); this atom is about HOW TO READ what others' acts mean. Distinct from lex-jbegr phronesis (Aristotle): phronesis is the practical-wisdom faculty; this atom is the epistemic move of reading-actions-as-evidence-of-character. Distinct from lex-pbdbb doctrine-of-the-mean: that's about virtue-as-the-mean-between-vices; this atom is about reading-others' virtue from their behavior. Distinct from lex-eb3wf Klein pre-mortem (specific anticipation tactic) — this is about reading-evidence-from-revealed-action. Distinct from lex-tb3re Goodhart's law (a measure pushed as target ceases to be a good measure) — that's about metric corruption; this is about credibility-asymmetry between two signal sources. Distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition (Butler): Butler's atom is constructively performative (acts constitute essence); this atom is epistemically diagnostic (acts reveal character)."
    quote: "[Mieder ed. *Dictionary of American Proverbs* 1992, entry 'action' / 'deed' family:] Multiple entries: 'Actions speak louder than words. [...] Deeds, not words.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'ACTIONS speak louder than words':] 'c 1605 G. CHAPMAN et al. Eastward Ho IV. ii. (1965 ed.) 73 To express their loues thus, by their actions; though theyr words be sometimes loose. [...] [The phrase 'Actions speak louder than words' is recorded as a fully canonical proverb from at least 1736 in American English (Boston Gazette), with the structural claim attested earlier in the form 'words are but wind' (1654 ELLEY).]' [Same volume, the paired entry 'SPEECH is silver, but silence is golden':] '1834 CARLYLE Sartor Resartus III. iii. As the Swiss Inscription says: Sprechen ist silbern, Schweigen ist golden (Speech is silvern, Silence is golden).' [Galef *Even Monkeys Fall from Trees* 2015, on the Japanese tradition:] 'Saying is easy; doing is hard.' [The cross-cultural pattern: in three traditions (English-British, English-American, Japanese) surveyed, the proverb-tradition independently encodes the asymmetric credibility of stated-intentions vs actions. The atom extracts the structural epistemic move — actions carry information past base-rate; stated intentions often do not — without committing to any one tradition's specific framing.]"
canonical-instances:
  - "Hiring decisions: a candidate's stated commitment to 'work hard / value collaboration / be detail-oriented' is cheap signal. Their past job tenure, observed collaboration patterns in references, GitHub commit history are expensive signal. The atom's claim: prefer the action-history evidence over the stated-intention evidence when they diverge."
  - "Public commitments: corporate sustainability pledges ('net zero by 2050') carry far less information than actual capex deployment patterns. A company that PLEDGES sustainability but ALLOCATES capital to extractive operations is revealing their actual prioritization. The pledge is presentation; the capex is the operative belief."
  - "Personal relationships: someone who says 'I want to spend more time with you' but consistently prioritizes other commitments is providing two contradicting signals. The atom's epistemic discipline is to weight the action-pattern. Distinct from interpretation as 'they're lying' — usually the stated intention is sincere; the revealed preference is the operative one."
  - "Distinguished from cases where the action-evidence is genuinely missing: with a new agent who has no track record (a startup founder, a junior employee, a new political candidate), stated intentions are the only signal available. The atom does not eliminate stated intentions as evidence — it asks for ASYMMETRIC WEIGHTING. With no track record, statements get default weight; once actions accumulate, the weight shifts."
  - "Revealed preference theory in economics (Samuelson 1938): the canonical formalization of the claim. Consumers' actual purchase patterns reveal their utility function more reliably than stated survey preferences. Behavioral economics has documented systematic stated-vs-revealed-preference gaps (status-quo bias, hyperbolic discounting, social-desirability bias in stated preferences). The proverb-tradition encoded this insight centuries before Samuelson formalized it."
  - "Costly signaling theory (Spence 1973): expensive actions (an educational credential that costs years of effort) credibly signal underlying type (high productivity) in a way that cheap statements ('I'm smart!') cannot. The atom's transferable claim is the underlying observation Spence's model formalizes: signal cost determines signal credibility."
  - "Distinguished from cases where stated intentions DO predict future behavior: well-calibrated track records of saying-and-then-doing produce credible commitment. The atom is silent on this — it doesn't say stated intentions are NEVER informative; it says they are weak DEFAULT evidence. An agent whose statements have historically predicted their actions has built a track record; their statements then carry above-default credibility."
critical-questions:
  - "Is there an action-history available? Without one, statements are the only evidence. The atom's asymmetric-weighting applies when both are available."
  - "Has the agent's track record been consistent or have they recently changed direction? Recent action-change carries info about the current state. The atom doesn't fix weights — it asks for empirically-informed weighting given available signals."
  - "Is the action evidence coerced, accidental, or out-of-character? A single coerced action doesn't reveal preference. The atom assumes free choice across a meaningful sample of actions."
  - "Are you using the atom to discount inconvenient stated intentions selectively? The failure mode: dismissing what someone says because their actions don't support it, while accepting another agent's stated intentions where convenient. The check: apply the asymmetric weighting consistently to all agents, including yourself."
  - "Is the stated intention CHEAP-TO-PRODUCE or COSTLY-TO-PRODUCE? A pre-registration of a study is a costly stated intention; the act of writing it down publicly is itself an action carrying signal. The atom's spectrum runs from pure cheap talk to fully costly signal — read each statement on this dimension before applying the discount."
status: active
