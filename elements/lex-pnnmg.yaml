id: lex-pnnmg
name: an-outgoing-sympathetic-gatekeeper-sabotages-institutions-via-neglect
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An outgoing official who privately sympathizes with an anticipated insurgency can weaken the institutions still under his command before departure, without ever taking an action that looks like open defection -- the sabotage is disguised as neglect, delay, and passivity rather than sabotage. Douglass describes President Buchanan's final months exactly this way: 'The shameful and shocking course of President Buchanan and his Cabinet towards this rising rebellion against the government which each and all of them had solemnly sworn to ‘support, defend, and maintain’ -- that the treasury was emptied, that the army was scattered, that our ships of war were sent out of the way, that our forts and arsenals in the South were weakened and crippled, -- purposely left an easy prey to the prospective insurgents, -- that one after another the States were allowed to secede, that these rebel measures were largely encouraged by the doctrine of Mr. Buchanan, that he found no power in the constitution to coerce a State, are all matters of history.' Each individual item in the list -- an empty treasury, a scattered army, ships sent elsewhere, weakened forts -- has an innocent-sounding administrative explanation available on its own; what makes the pattern read as sabotage rather than misfortune is that they compound in exactly the direction that helps the side the outgoing official does not oppose, timed to conclude right as his own accountability for the outcome ends."
