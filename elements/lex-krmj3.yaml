id: lex-krmj3
name: gift-object-retains-givers-trace-and-pursues-the-holder
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When something is given (gift, name, story, secret), surface Mauss's hau-trace — the object retains the giver's trace and 'pursues' the holder, creating an obligation that disposing of the object does not break."
related: [lex-33w6z, lex-3hefg, lex-xe76g, lex-urh87, lex-br4uk]
scaffolds-from: [lex-xe76g]
evokes: [the-hau-the-spirit-of-the-thing-given, the-taonga-is-not-inert, abandoned-by-the-giver-still-something-of-his, the-gpl-as-legal-hau, my-grandmothers-chair, the-stolen-mask-pulls-toward-its-village]
lineage:
  - source: primary
    text: mauss-1925-essai-sur-le-don-ch-1-the-hau-of-the-taonga
    citation: "Marcel Mauss, *Essai sur le don*, Ch. I §III 'The spirit of the thing given (Maori),' pp. 70-72 of the Guyer 2016 translation (HAU Books / Univ. of Chicago Press). Mauss's argument from the Tamati Ranaipiri testimony (Maori informant of Elsdon Best): the gift-object — taonga — possesses a hau, a 'spiritual power,' that remains bound to the giver even after physical transfer. The hau pursues whoever holds the object; failure to return what the hau pulls toward (the equivalent received from a third party) brings 'serious evil, even death' on the holder. The transferable mechanism is distinct from the three-obligations-on-actors frame of lex-urh87: lex-krmj3 names the OBJECT-LEVEL mechanism — the transferred thing is not inert; the giver retains a hold through the thing; the return-pressure is exerted by the object itself, not by social pressure on the recipient. Mauss explicitly distinguishes (p.71): 'the gift (cadeau) received and exchanged is binding as the thing received is not inert. Even abandoned by the giver, it is still something of his. Through this thing he has a hold over the recipient in the same way that he, as its owner, has a hold over the thief.' The hau-mechanism explains WHY the social-obligation triad has the binding force it does — it grounds the obligation in an object-property rather than treating it as bare convention. Modern instantiations: the GPL viral clause as legal codification of the hau (downstream forks must remain open-source because the code carries the original author's hau forward through every transfer); cryptographic signatures and watermarks (cryptographic identity-trace pursues the object); citation and academic plagiarism (the text-fragment 'wants to return' to its origin via citation; uncited use is theft of the hau); cultural-property repatriation (the Benin bronzes, Elgin marbles, Native American sacred objects under NAGPRA — the hau-of-origin pulls the objects back across centuries); 'this is my grandmother's chair, I can't sell it' (the object carries an indelible relational charge that resists market-conversion); brand-marks and trademarks following objects past ownership transfer."
    quote: "[Mauss 1925/2016 Guyer trans., Ch. I §III, p.71, Mauss's interpretation of the Ranaipiri testimony:] 'The taonga and all goods termed strictly personal possess a hau, a spiritual power. You give me one of them, and I pass it on to a third party; he gives another to me in turn, because he is impelled to do so by the hau my present (cadeau) possesses. I, for my part, am obliged to give you that thing because I must return to you what is in reality the effect of the hau of your taonga. Interpreted in this way, the idea not only becomes clear, but emerges as one of the central tenets of Maori law (droit). The gift (cadeau) received and exchanged is binding as the thing received is not inert. Even abandoned by the giver, it is still something of his. Through this thing he has a hold over the recipient in the same way that he, as its owner, has a hold over the thief. Because the taonga is animated by the hau of its forest, of its territory, of its soil; it is truly native; the hau pursues anyone who holds it.' [And the Ranaipiri testimony itself, p.70, the Maori informant of Elsdon Best speaking:] 'Suppose that you possess a certain article, and you give that article to me, without price. We make no bargain over it. Now, I give that article to a third person, who, after some time has elapsed, decides to make some return for it (utu), and so he makes me a present of some article (taonga). Now, that article (taonga) that he gives to me is the hau of the article I first received from you and then gave to him. The goods (taonga) that I received for that item I must hand over to you. It would not be right for me to keep such goods for myself... I must hand them over to you, because they are a hau of the article (taonga) you gave me. Were I to keep such equivalent for myself, then some serious evil would befall me, even death.' [Practitioner-extraction: the transferable claim is that transferred objects can carry a trace of their origin that exerts return-pressure on subsequent holders, independent of any social-obligation between giver and recipient. This is an OBJECT-PROPERTY mechanism. lex-urh87 names the social-frame (give/receive/reciprocate as actor-obligations); lex-krmj3 names the object-mechanism (the hau pursues the holder). The two compose: the hau-of-the-object grounds the felt-force of the reciprocation-obligation in lex-urh87's third node. They can be separated diagnostically — a context can have lex-urh87-style obligations without a strong hau (modern market-gifts felt as transactional), or a strong hau without lex-urh87 obligations (the inherited object that 'belongs to grandmother' even when no living recipient is owed reciprocation).]"
canonical-instances:
  - "the **GPL viral clause as legal codification of the hau** (Stallman 1989 / GNU GPL v1-v3): code released under the GPL carries the author's hau forward through every transfer. Downstream forks, even those many transfers removed from the original author, must remain open-source — the hau of the original release pursues every holder. Failure to return the hau (closed-source forks of GPL code; vendored-without-attribution) triggers explicit legal-enforcement consequences. The GPL is the cleanest modern engineered-instance of the Mauss-hau mechanism: it deliberately binds an object-property to the author's identity such that the return-pressure operates legally rather than spiritually."
  - "the **cultural-property repatriation case** (Benin bronzes; Elgin / Parthenon marbles; Native American sacred objects under NAGPRA 1990): the hau-of-origin pulls the objects back across centuries and many holders. Repatriation movements operate on a structurally-Maussian claim: the object is not inert; it is still something of its origin; the holder is obliged to return it. NAGPRA legally codifies this for U.S. museums holding Native American cultural patrimony, eagle feathers, and funerary objects. Distinct from market-property logic (which would treat the object as alienable through valid transfer); operates on hau-logic (the object carries an indelible origin-trace that exerts return-pressure)."
  - "the **citation and academic-plagiarism case**: the cited idea or text-fragment 'wants to return' to its origin via citation. Uncited use is hau-theft: the holder has the object (idea, text, method) but has not let the hau return to its source. The MLA / APA / Chicago citation systems are codifications of how the hau is returned in academic-substrate. Plagiarism's specific moral force — distinct from mere unoriginality — is that it is hau-theft: the idea-object is held without acknowledging its origin's continued hold."
  - "the **cryptographic-signature and digital-provenance case**: a cryptographically-signed object carries author-identity through every transfer. Cryptographic signatures, NFT provenance chains, content-address-storage (IPFS), and git's commit-hash chain all engineer hau-equivalents into digital objects. The author's identity persists with the object; tampering breaks the signature (the hau departs); receivers can verify the hau-link to origin. These are deliberate technical instantiations of the Mauss-hau mechanism for digital substrates where objects can be copied at will."
  - "the **grandmother's chair / heirloom case** (cross-cultural family observation): 'this is my grandmother's chair, I can't sell it.' The object carries an indelible relational-charge that resists market-conversion. The chair's market value and its felt value diverge sharply because the hau of the giver persists with the object. Selling it would be hau-theft against one's own lineage. The atom names this distinct from sentimental-attachment: sentimental-attachment is the holder's affect; hau is a property of the object itself that operates structurally even on holders who are not sentimentally attached (the inherited heirloom that an heir 'cannot' sell even when they personally don't care for it)."
  - "the **trademark and brand-mark following the object case**: a trademarked item carries the brand's hau forward through every transfer (resale of branded goods triggers trademark-enforcement when the brand's identity has been altered or removed). Generic trademark law operates partially on hau-logic: the brand-hau persists with the object; the holder is obliged either to return the hau (preserve the brand-association) or remove the object from circulation. This is structurally distinct from copyright (which is about copying) or patent (which is about implementing); trademark is specifically about the object-carries-identity mechanism."
  - "operationally distinct from lex-urh87 gift-as-three-obligations-give-receive-reciprocate (Mauss): lex-urh87 names the SOCIAL-FRAME of gift-exchange — the obligations on actors at each of three nodes (give / receive / reciprocate). lex-krmj3 names the OBJECT-MECHANISM — the gift-object retains a trace of its origin that exerts return-pressure independent of the recipient's social-obligation. They compose: the hau-of-the-object is what grounds the felt-force of lex-urh87's third (reciprocate) node. They can be separated diagnostically — modern market-gifts can satisfy lex-urh87's actor-obligations transactionally without a strong felt-hau (the obligatory birthday gift, perfunctorily reciprocated); inherited heirlooms can carry strong hau without any living lex-urh87 recipient owed reciprocation. Same primary source (Mauss 1925); different operational mechanism."
  - "operationally distinct from lex-33w6z sacrifice-as-transformation: lex-33w6z names sacrifice as a specific MOVE (give-up-X to gain-Y; cost IS the mechanism). lex-krmj3 names the OBJECT-PROPERTY of carrying the giver's identity-trace post-transfer. They can co-fire in religious sacrifice (the offered object carries the offerer's hau into the divine relationship — Christ's body-and-blood as the offered taonga carrying the divine hau forward) but the topologies are distinct. Sacrifice can occur without hau (a generic donation of money) and hau can persist without sacrifice (the inherited family object)."
  - "operationally distinct from lex-3hefg trust-formation: trust-formation is a social-process between actors. The hau-mechanism is an object-property. They compose: the gift-object's hau makes trust-formation more robust (the persistent hau-link to giver gives the gift its trust-bearing weight); but trust can form without hau-carrying-objects (verbal promises, witnessed-presence) and hau can persist without sustained trust (the heirloom from an estranged relative still carries hau)."
  - "operationally adjacent to lex-xe76g ring-of-gyges: the hau operates whether or not the holder is observed (the Maori claim is that the hau itself causes 'serious evil, even death' to the holder who refuses to return — this is enforcement without external observation). lex-xe76g is the question of behavior-without-observation; lex-krmj3 names one of the mechanisms by which behavior-without-observation can be regulated (the object itself carries the enforcement, no observer required). They compose: the hau-mechanism is one substrate-grounded answer to the ring-of-gyges challenge of how non-observation-dependent moral behavior can be sustained."
  - "operationally adjacent to lex-br4uk every-observable-behavior-becomes-a-de-facto-contract (Hyrum's law): Hyrum's law names how the user-observable behavior of a system becomes a de facto contract that constrains future modifications. lex-krmj3 names how an object-property (the giver's identity-trace) becomes a constraint on holders of the object. Both involve OBJECTS carrying constraints forward through time and transfer; they differ in the type of constraint (Hyrum: behavioral / API; hau: relational / origin-pointing). API contracts could be seen as the modern hau of code-objects: the original author's API-design pursues every downstream user."
critical-questions:
  - "the hau-present discrimination: is this transferred object actually carrying a persisting origin-trace, or is it operating as an alienable market-object? Test: does the holder feel a structural pull to acknowledge / return / preserve the origin, beyond personal sentiment? Does removing the origin-trace (rebranding, sanding-off marks, decontextualizing) feel like a violation? If yes to both, lex-krmj3 is operative; if no, the object is in market-substrate not hau-substrate."
  - "the substrate-translation hazard: Mauss derives the hau from Maori law specifically. The transferable claim is that object-level identity-persistence is a recurring mechanism across substrates (legal: GPL; cultural: NAGPRA; digital: cryptographic signatures; familial: heirlooms). Practitioner-question: in this context, does the object actually carry a felt-trace of its origin that exerts return-pressure on holders, or is the cross-substrate claim being over-extended? Some modern market objects have NO hau (mass-produced commodity); applying lex-krmj3 to such objects misuses the atom."
  - "the engineering-the-hau question: when designing a system that needs to preserve origin-attribution across many transfers, what's the engineering question? Mauss-hau operated through religious-magical mechanism (the holder feared death). Modern engineered-hau operates through legal mechanism (GPL), cryptographic mechanism (signatures), or institutional mechanism (museum-protocols). Practitioner-question: which substrate is available to carry the hau? The answer determines the engineering."
  - "the hau-extraction failure-mode: when an object's hau is deliberately extracted to allow market-conversion (the brand-stripped designer good; the de-attributed open-source code in a closed-source product; the museum-laundered cultural-property), the system has performed hau-theft. Practitioner-diagnostic for an object: can its origin-trace be erased without consequence? If yes, no hau; if no, hau-removal IS the violation that lex-krmj3 names. Note the analogy to lex-urh87's reciprocation-failure: hau-extraction is the object-mechanism analog of the social-mechanism reciprocation-refusal."
  - "the kinship-with-lex-urh87 boundary: when does this case need lex-krmj3 (object-mechanism) vs lex-urh87 (social-obligations) vs both? Three-way decision: (a) ongoing actor-relationship with bilateral obligations → lex-urh87 alone; (b) inherited object with no living obligation-counterparty but indelible origin-charge → lex-krmj3 alone; (c) live gift-exchange where the object carries its giver's identity AND the actors are bound by give-receive-reciprocate → both. The conjunctive case (c) is Mauss's canonical Maori-Polynesian case and is the strongest substrate for the joint mechanism."
  - "the hau-on-information case: does the hau-mechanism apply to information-objects (ideas, designs, methods) as it does to physical-objects? Mauss treats taonga as physical-property (sometimes including immaterial taonga like cults, traditions, magical rituals). Modern practice (citation systems, patent law, trade-secret law) operates on a hau-of-information assumption. The transferable claim is that information-objects can carry origin-trace and exert return-pressure on holders. Practitioner-question: in a specific information-context, what is the equivalent of the hau, and what is the equivalent of return-pressure?"
status: active
