evokes: [tom-robinson-cant-be-believed, female-intuition-and-then-there-are-facts, credibility-deficit, prejudicial-stereotype, capacity-as-a-knower, identity-power, fricker-2007]
lineage:
  - source: primary
    text: Fricker-2007-EpistemicInjustice
    citation: "Miranda Fricker, *Epistemic Injustice: Power and the Ethics of Knowing* (Oxford UP 2007). Fricker is a moral philosopher at CUNY Graduate Center; this book originated and named the two-form epistemic-injustice framework that has since become canonical across analytic ethics, social epistemology, and feminist philosophy. Ch.1-4 develop the testimonial-injustice form. Fricker's core operational definition: a speaker suffers a testimonial injustice when prejudice on the hearer's part causes the hearer to give the speaker a lower level of credibility than they would otherwise have given — a CREDIBILITY DEFICIT caused by IDENTITY PREJUDICE channelled through a PREJUDICIAL STEREOTYPE (a distorted image of the social group the speaker belongs to). Fricker distinguishes this carefully from credibility-deficits caused by innocent error or by epistemically-culpable-but-ethically-innocent error; the testimonial-injustice case is when both ethical AND epistemic culpability obtain because the deflation tracks the speaker's identity rather than the content. The atom captures the transferable primitive: when credibility-rating systematically tracks the speaker's social identity rather than the evidence, the discount is structural epistemic harm, not appropriate skepticism."
    quote: "[Fricker 2007 Ch.1 'Testimonial Injustice', the central definition:] 'a speaker suffers a testimonial injustice just if prejudice on the hearer's part causes him to give the speaker less credibility than he would otherwise have given.' [Fricker then narrows to the central case:] 'the injustice that a speaker suffers in receiving deflated credibility from the hearer owing to identity prejudice on the hearer's part, as in the case where the police don't believe someone because he is black. Thus the central case of testimonial injustice can be defined (if rather telegraphically) as identity-prejudicial credibility deficit.' [Provenance: the definition previously recorded here read 'a deflated level of credibility' where Fricker wrote 'less credibility than he would otherwise have given' -- a phrase she does use, but in a different sentence -- and continued 'such that the influence of identity prejudice on the hearer's credibility judgement is causal in producing the credibility deficit', which does not appear in the book at all.] [On the canonical Tom Robinson example from Harper Lee 1960 *To Kill a Mockingbird*:] 'The defendant is a young black man named Tom Robinson... It is easy to see... that Tom Robinson is entirely innocent... The fact that Tom Robinson makes the [admission that he felt sorry for a white woman]... the damage was done. Below us, nobody liked Tom Robinson's answer.' [Fricker's diagnostic: the white Alabama jury cannot believe Tom Robinson because the prejudicial stereotype of Black-man-as-liar deflates his credibility BELOW what the evidence warrants, and would have warranted had he been a white man making the same statement.] [On the Marge Sherwood / Greenleaf example from Highsmith 1955 / Minghella 1999 *The Talented Mr Ripley*:] 'Marge, there's female intuition, and then there are facts' [as Greenleaf silences Marge's testimony about Dickie's murder. Fricker:] 'Greenleaf's exercise of identity power here is active, in that he... would have exercised the same power over a Marge' [his stereotype of women-as-emotional channelling a credibility deflation regardless of the evidential support Marge's claim actually has.] [On the framework's operational structure:] 'in the form of a prejudicial stereotype — a distorted image of the social [group] that... causes the hearer to give a deflated level of credibility... the central case of testimonial injustice can be conceived as a credibility deficit caused by identity-prejudice.' [Transferable inference: when credibility-judgments track speaker identity rather than statement content, the deflation is structural epistemic harm. The atom forces the question after any credibility-judgment: would the SAME statement from a differently-identified speaker have received higher credibility? If yes, the deflation is testimonial injustice — not skepticism, not error, but injustice.]"
  - source: discovery-loop
    text: pass-d-negative-space-broadening-
    citation: "(after batches 1-4 shipping at ccea73d / e20fa9b / 5671d9d / 1fddc63). Fricker 2007 acquired by user 2026-06-10 evening. Distinctness audit: lex-2sdqf double-consciousness (Du Bois) is about the INTERNAL psychological effect of being-othered (doubled gaze fracturing the self); testimonial injustice is about the EXTERNAL transactional moment when testimony is discounted. They cross-fertilize but are distinct atoms — lex-2sdqf names the SELF-EFFECT, lex-a3tfj names the OTHER'S CREDIBILITY-DEFLATION. lex-6qevt lived-position-as-irreplaceable-epistemic-substrate (Cooper, Truth) is the general standpoint claim; lex-a3tfj names the specific mechanism by which dominant-position hearers FAIL TO RECEIVE that content via credibility-deflation. lex-et8q2 intersectional-position (Cooper, Crenshaw) is about multi-axis positions; lex-a3tfj operates at single OR intersectional positions. lex-y2nej dominant-group-values is adjacent. All distinct."
    quote: "[substrate-audit notes, 2026-06-10:] Pass D — Fricker 2007 mining-pass. Two atoms: lex-a3tfj testimonial-injustice + lex-22kep hermeneutical-injustice. Fricker's framework is the most-cited contribution to social epistemology since Lorraine Code 1995; the operational vocabulary is now standard across analytic ethics + feminist philosophy + critical race theory. Transferable applications: legal-testimony evaluation (Tom Robinson generalization), medical-symptom-reporting (women's pain discounted; Hoffman et al. 2016 on racial bias in pain assessment), workplace harassment-claims credibility, peer-review credibility-bias, AI-system credibility-bias."
canonical-instances:
  - "The Tom Robinson canonical case (Harper Lee 1960 *To Kill a Mockingbird*, anchored in Fricker 2007 Ch.1): 1935 Alabama. A young Black man on trial for raping a white woman; physical evidence shows he could not have inflicted the injuries (the witness's left-eye injury could only have been inflicted by a left-handed assailant; Tom Robinson's left arm is withered). The jury convicts because the prejudicial stereotype of Black-man-as-liar deflates Robinson's credibility below what the evidence warrants. Fricker's central testimonial-injustice case."
  - "The Marge Sherwood / Greenleaf canonical case (Highsmith 1955 / Minghella 1999 *The Talented Mr Ripley*, anchored in Fricker 2007 Ch.1): Greenleaf silences Marge's testimony about his son Dickie's murder with 'Marge, there's female intuition, and then there are facts.' Marge's testimony is in fact correct — Ripley murdered Dickie. The prejudicial stereotype of women-as-emotional deflates Marge's credibility below what her evidence supports."
  - "Medical pain-reporting canonical case (Hoffman et al. 2016 *PNAS* on racial bias in pain assessment; Hoffmann-Tarzian 2001 on gender bias in pain assessment): Black patients' pain reports are systematically discounted by physicians holding false beliefs about Black biological pain-tolerance; women's pain reports are systematically discounted via attribution to psychogenic causes. Same substrate-shape: credibility-deflation tracks identity not content. Downstream harm: undertreatment, misdiagnosis, premature death."
  - "Peer-review identity-bias canonical case (Budden et al. 2008 on double-blind peer review increasing female-author acceptance; Tomkins et al. 2017 on single-blind vs double-blind in NIPS reviewing): when reviewers know author identity, credibility-judgments track identity at least partly independent of paper quality."
  - "AI-system credibility-bias canonical case: AI is treated as MORE credible than human speakers from marked identities (the 'AI is objective' fallacy). The testimonial-injustice mechanism extends to AI-mediated contexts; users design systems that treat the AI output as a credibility-substitute for low-credibility-prejudiced human speakers."
  - "operationally distinct from lex-2sdqf subordinated-identity-fractures-self-via-internalized-dominant-other-gaze (Du Bois): lex-2sdqf is the PSYCHOLOGICAL self-effect (internalized other-gaze fracturing the self). lex-a3tfj is the TRANSACTIONAL external moment (credibility-deflation by the hearer). They cross-fertilize — the speaker who has internalized the dominant gaze may pre-emptively deflate their own testimony, compounding the testimonial-injustice. Distinct mechanisms."
  - "operationally distinct from lex-6qevt lived-position-as-irreplaceable-epistemic-substrate (Cooper, Truth): lex-6qevt names that any structural position has irreplaceable epistemic content. lex-a3tfj names the specific mechanism by which dominant-position hearers FAIL TO RECEIVE that content via credibility-deflation."
  - "operationally distinct from lex-et8q2 intersectional-position-not-decomposable-into-component-axes (Cooper, Crenshaw): lex-et8q2 is about multi-axis-overlap position structure. lex-a3tfj is about the credibility-deflation mechanism that operates at single OR intersectional positions. They compose — at intersectional positions, testimonial injustice often operates via MULTIPLE prejudicial stereotypes simultaneously, producing compound credibility-deflation."
  - "operationally distinct from lex-22kep hermeneutical-injustice (Fricker 2007 Ch.7, companion mint): testimonial injustice operates AT THE MOMENT of speech-uptake — the speaker's testimony exists but is discounted. Hermeneutical injustice operates UPSTREAM of speech — the collective interpretive resources are insufficient to make sense of the speaker's experience in the first place. Sister atoms; co-fire on cases like Carmita Wood 1975 where BOTH operate."
critical-questions:
  - "would the same statement from a differently-identified speaker have received higher credibility? The atom's crucial diagnostic. If yes, the deflation is testimonial injustice — not appropriate skepticism, not innocent error. Practitioner-discipline: run the swap-test mentally before concluding the discount is justified."
  - "is the credibility-deflation tracking IDENTITY (race, gender, class, accent, age, disability) or CONTENT (the claim itself is implausible)? Fricker's framework requires identity-tracking deflation. Identity-tracking can be subtle: 'she seems hysterical / he seems aggressive / they're too young to understand / they're too credentialed to be in touch.' Name the specific prejudicial stereotype being deployed."
  - "is the deflation epistemically culpable, ethically culpable, or both? Fricker distinguishes innocent error (epistemically AND ethically blameless), epistemically-culpable-but-ethically-innocent error, and testimonial injustice (both epistemically AND ethically culpable because the deflation tracks identity). The atom's strongest application is the third case."
  - "what's the downstream harm? Fricker emphasizes that testimonial injustice has BOTH epistemic harm (the truth-claim doesn't propagate) AND ethical harm (the speaker is disrespected as a knower). When documenting testimonial injustice, name both the epistemic loss and the ethical loss."
  - "is the system you're designing channeling credibility through identity? The AI-design application is direct: any system that weights credibility-judgments by speaker identity is implementing testimonial injustice. In any credibility-weighted system (peer review, content moderation, fact-checking, expert-witness evaluation, performance review), surface where identity is being used as a credibility-proxy."
