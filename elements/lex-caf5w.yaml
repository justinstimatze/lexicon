canonical-instances:
  - "The direct textual anchor, on who was missing from the massacre sites and why it matters: “At Kilianstädten and Asparn, younger women were missing from the assemblage, suggesting their appropriation as captives.”"
  - "Hypothetical: a small manufacturing town builds its entire economy around one factory that makes a single component for one industry. When that industry consolidates and the factory closes, the town has no fallback -- no diversified local economy to absorb the shock, no way to disperse into other viable livelihoods nearby. A town with three or four different industries could have lost one and adapted; this one had narrowed itself into having nothing left once its single economic base was gone."
critical-questions:
  - "Is the vulnerability here really about economic narrowing specifically, or simply about sedentism and population density? A densely settled, immobile forager population relying on one especially rich but singular resource, a salmon run for instance, might well face the same exposure to catastrophic raiding, whether that resource happened to be farmed or foraged."
  - "The mass graves at these sites are dramatic evidence, but they represent a small number of documented cases. How confident can we be that food-web narrowing was the decisive vulnerability, rather than other factors specific to these particular communities (their location on a contested frontier, local political rivalries) that a wider sample of Linear Pottery sites might not support as a general pattern?"
