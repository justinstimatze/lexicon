id: lex-e6mj8
name: category-fallacy-reliability-is-not-cross-population-validity
type-in: claim
type-out: warning
_tier: atomic
agent-instruction: "Apply this when a diagnostic or classificatory category built and validated in one population is exported to a different population, and the category's fit there is assumed rather than checked. Kleinman's specific point is sharper than the generic 'this measure may not transfer' worry: achieving high measurement RELIABILITY in the new population -- consistent scores via careful translation, back-translation, and inter-rater training -- does NOT establish that the category has cross-population VALIDITY there, because reliability measures the consistency of applying the category while validity requires the category to correspond to something real and locally coherent in the population being classified. A scale can be translated flawlessly, administered by well-trained raters, and produce highly reproducible scores in a population where the underlying construct the scale purports to measure simply doesn't carve that population's world at its joints -- the numbers agree with each other while agreeing with nothing real on the ground. Kleinman names the move itself: 'the reification of one culture's diagnostic categories and their projection onto patients in another culture, where those categories lack coherence and their validity has not been established, is a category fallacy.' The fallacy is specifically the inferential leap from 'we can apply this category consistently' to 'this category applies.' Practitioner move: when exporting any classificatory instrument -- diagnostic criteria, a survey construct, a UX research taxonomy, a market segment -- across a genuine population boundary (cultural, linguistic, generational, institutional), verify two separate things: (1) do raters/scorers agree on how to apply the category (reliability), and (2) does the category pick out something locally coherent and meaningful in the target population on its own terms, not merely as a projection of the source category (validity). High (1) is necessary but never sufficient evidence for (2); a translation-and-training process that drives reliability up can coexist with a total absence of (2), and no amount of further reliability work substitutes for actually checking it."
related: [lex-68abd, lex-yexax, lex-7aqqb, lex-yx8qx]
scaffolds-from: [lex-68abd, lex-yexax]
evokes: [category-fallacy, reliability-vs-validity, kleinman-1977, obeyesekere-semen-loss-thought-experiment, dsm-iii-dysthymic-disorder, cross-cultural-psychiatry, explanatory-models, reification-of-a-diagnostic-category]
lineage:
  - source: primary
    text: kleinman-1988-category-fallacy
    citation: "Arthur Kleinman, Rethinking Psychiatry: From Cultural Category to Personal Experience (Free Press, 1988), Chapter 1 ('What Is a Psychiatric Diagnosis?'), section 'The Category Fallacy,' pp. 15-16. Kleinman cites his own earlier coinage (Kleinman 1977) and extends it with Gananath Obeyesekere's (1985) thought experiment and Kleinman's own real-world DSM-III dysthymic-disorder parallel."
    quote: "The reification of one culture's diagnostic categories and their projection onto patients in another culture, where those categories lack coherence and their validity has not been established, is a category fallacy (Kleinman 1977). Obeyesekere (1985) offers a telling example. Suppose, he suggests, a psychiatrist in South Asia, where semen loss syndromes are common, traveled to the United States, where these syndromes have neither professional nor popular coherence. Let us imagine that this South Asian psychiatrist has first operationalized the symptoms of semen loss in a psychiatric diagnostic schedule, translated this interview protocol into English, had other bilingual persons translate it back into the original language to check the accuracy of the translation, adjusted those items that were mistranslated, and then trained a group of American psychiatrists in its use and established a high level of consistency in their diagnoses. Using this schedule, he could derive prevalence data for 'semen loss syndrome' in the United States. But would these findings have any validity in a society in which there are neither folk nor professional categories of semen loss and in which semen loss is not reported as a disturbing symptom? [...] Dysthymic disorder in DSM-III, or neurotic depression in ICD-9, may be an example of a category fallacy. [...] dysthymia would seem to be an instance of the medicalization of social problems in much of the rest of the world [...] where moral, religious, and political configurations of such problems have coherence for the local population but psychiatric categories do not. [...] is the psychiatrist who is armed with a local translation of the major North American diagnostic instruments [...] any different from his hypothetical Bangladeshi colleague studying semen loss in mid-town Manhattan? Clearly, great care must be taken before applying this diagnostic category to assure that its use is valid."
canonical-instances:
  - "operationally distinct from its three nearest substrate neighbors: lex-68abd map-not-territory is a much more general representation-vs-reality point, where this atom names the specific, checkable failure mode of mistaking consistent map-DRAWING (reliability) for map-territory FIT (validity); lex-yexax method-domain-transferability is a general claim about methods transferring across domains, not specifically about reliability-vs-validity in classificatory-category export; lex-7aqqb framing-of-question-fixes-the-ontology-of-the-inference is about question-framing rather than measurement-reliability-vs-referential-validity specifically."
  - "Obeyesekere's semen-loss-syndrome thought experiment, Kleinman's own illustration: a South Asian psychiatrist operationalizes a semen-loss-anxiety diagnostic schedule, translates and back-translates it flawlessly, trains American psychiatrists to a high level of scoring consistency, and derives 'prevalence data' for the syndrome in the United States -- while the category corresponds to nothing coherent in how those patients actually understand their own symptoms. Kleinman cites this reversal of the real DSM export direction precisely because inverting who is doing the exporting makes the fallacy vivid."
  - "DSM-III dysthymic disorder (or ICD-9 neurotic depression) exported to non-Western clinical populations: a Western nosological category, translated and reliably scored via structured interview training, applied to patients whose distress arises from chronic deprivation, powerlessness, and malnutrition-linked physiological symptoms, and whose own explanatory models organize that distress as moral, religious, or political rather than as a discrete mood-disorder entity -- reliable scoring proceeds while the category's validity in that setting is assumed, not demonstrated."
  - "Cross-cultural export of Western psychometric, UX-research, or market-research instruments generally: a construct (a 'customer satisfaction' or 'engagement' scale, a personality inventory) is professionally translated and administered with high inter-rater or inter-respondent reliability in a new market or demographic, while the underlying construct fails to correspond to how that population actually organizes the relevant experience -- the category-fallacy move recurs wherever an instrument crosses a real population boundary and reliability is quietly treated as having done validity's job."
critical-questions:
  - "Isn't this just external validity or generalizability, restated with anthropological vocabulary? It is a prior and sharper question. External validity usually asks whether a FINDING replicates elsewhere; the category fallacy asks whether the CATEGORY ITSELF has a real referent in the target population at all. A depression scale can 'generalize' in the sense of producing similar score distributions cross-culturally while still committing a category fallacy, if 'depression' as bounded by the instrument matches no locally coherent illness category -- the scores travel; the construct does not."
  - "How would you actually check validity once reliability is established? Kleinman's own method: elicit the population's own explanatory models -- how they name, group, and explain the phenomenon in their own terms -- and check whether the imported category's boundaries line up with a locally coherent illness or kind category, rather than checking only whether raters using the imported category agree with each other."
  - "Does this counsel abandoning cross-population measurement entirely? No -- Kleinman's own career is built on cross-cultural psychiatric research; the discipline is diagnostic, not prohibitive. The practitioner move is to run the validity check as its own non-optional step, not to treat a passed reliability check as having already answered it."
