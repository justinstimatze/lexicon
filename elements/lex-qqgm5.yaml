id: lex-qqgm5
name: showing-vs-saying-some-things-cannot-be-said-only-shown
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When a question 'cannot be answered in words,' surface Wittgenstein's distinction: some things can only be shown (demonstrated, lived, pointed-at) not said — the failure to articulate is sometimes structural, not a vocabulary gap."
related: [lex-3r2f8, lex-9ar8w, lex-fz8n7, lex-jbegr, lex-n3ayj, lex-nahg9, lex-rq3jn, lex-vpwbb, lex-wtkuz]
scaffolds-from: [lex-3r2f8]
evokes: [what-can-be-shown-cannot-be-said, the-tacit-dimension, the-mystical-shows-itself, demonstration-not-articulation, limits-of-the-sayable]
lineage:
  - source: primary
    text: wittgenstein-tractatus-1921
    citation: "Ludwig Wittgenstein, *Tractatus Logico-Philosophicus* (1921). (Project Gutenberg #5740). The showing/saying distinction (Tractatus Props 4.121-4.1212, 6.522, 7): some things can be SAID in language (factual propositions about contingent states-of-affairs); other things can only be SHOWN (logical form, ethical/aesthetic value, the mystical). Trying to SAY what can only be SHOWN produces nonsense (Unsinn) — the propositions of the Tractatus itself, on its own account (Prop 6.54). This distinction is the deepest contribution of early-Wittgenstein and was preserved in later-Wittgenstein's distinction between rule-following-explicitly vs. rule-following-as-practice."
    quote: "[Tractatus Props 4.121-4.1212:] '4.121: Propositions cannot represent the logical form: this mirrors itself in the propositions. That which mirrors itself in language, language cannot represent. That which expresses itself in language, we cannot express by language. The propositions show the logical form of reality. They exhibit it.' '4.1212: What can be shown cannot be said.' [Prop 6.522:] 'There is indeed the inexpressible. This shows itself; it is the mystical.' [Prop 7:] 'Whereof one cannot speak, thereof one must be silent.' [The structural claim: language has a limit; what cannot be said within it can still be shown by it — the showing is in the use, the application, the practice, not in any explicit articulation. Trying to cross the limit produces nonsense.]"
  - source: practitioner
    text: polanyi-1958-tacit-knowledge
    citation: "Michael Polanyi, *Personal Knowledge: Towards a Post-Critical Philosophy* (1958) + *The Tacit Dimension* (1966). Tier-3 deepening: Polanyi's 'we can know more than we can tell' (1966 Ch.1 opening) is the canonical mid-20th-c. operationalization of showing-vs-saying in epistemology of skill. The skilled practitioner KNOWS how to bike, swim, recognize faces — but cannot articulate the knowledge propositionally. The knowing is shown in the doing; trying to say it is incomplete. Cross-attests Dreyfus 1980 skill model (lex-jbegr phronesis), Schön reflective-practitioner; extensively cross-cited."
    quote: "[Tier-3 deepening — Polanyi 1966 *The Tacit Dimension* Ch.1: 'I shall reconsider human knowledge by starting from the fact that we can know more than we can tell.' Polanyi's example: face recognition — we know thousands of faces but can articulate the criterion for none of them. Riding a bike — we know how but cannot teach by verbal-instruction alone. Polanyi's mid-20th-c. epistemology of skill is the direct empirical-practical articulation of Wittgenstein's logical-philosophical claim that some things show themselves in practice rather than being said in propositions.]"
  - source: practitioner
    text: code-comments-show-vs-tell
    citation: "Modern engineering practice: well-written code shows the algorithm; the comments explain WHY (the part the code can't show because the code shows-what-not-why). The naming-as-documentation principle (Knuth 1984 literate programming + clean-code traditions Beck/Martin) operationalizes showing-vs-saying for software. widely cross-attested."
    quote: "[Tier-3 deepening — engineering instantiation: the function `validateEmail(addr)` shows what it does (you can read the code); a comment '// emails must be valid per RFC 5322' SAYS the intent and the constraint. Code shows the algorithm; comments say the rationale. The discipline: don't comment what the code shows (redundant); do comment what the code can't show (intent, edge cases, the 'why this approach'). This is showing-vs-saying applied to software-as-language.]"
canonical-instances:
  - "the bicycle-riding case (Polanyi): you can show someone how to ride a bike (by demonstration, by guided practice) but you cannot SAY it sufficient for them to learn from words alone. The riding shows itself in the rider; the proposition 'lean into the turn' is inadequate to convey what the proprioceptive coordination actually is"
  - "tacit knowledge in expert practice (lex-jbegr phronesis): the phronetic practitioner SHOWS competence in particulars; explicit rules SAY only the general form. The senior surgeon, the master chess-player, the expert engineer all have knowledge that exceeds what their explicit rule-set captures. The transferable point: expertise is shown-in-action, not said-in-rules"
  - "ethical demonstration vs ethical theory: ethical behavior shows itself in conduct; ethical theory tries to say what it is. Wittgenstein's later position (PI + Lectures on Ethics 1929): the ethical SHOWS itself in how a person LIVES, not in the propositional content of their stated values. The disconnect between stated-values and lived-values is the discriminator"
  - "code-as-language: well-named code shows the algorithm; comments say the intent. The discipline of code-review treats this as a indispensable distinction — 'rewrite the comment as code if possible; rewrite the code as a clearer name if possible; only comment what genuinely cannot be shown'"
  - "the logical-form case (Wittgenstein's original): propositions cannot say what logical form they have; they SHOW it by their structure. A logical truth like 'p or not-p' doesn't say anything about the world — it exhibits a feature of the logical scaffolding. Russell's logical-atomism agreed but tried to SAY logical form; Wittgenstein's deeper move was to recognize that the saying produces nonsense"
  - "operationally adjacent to lex-nahg9 upaya (Buddhist skillful means): upaya is the practice of choosing the right SHOWING for the student — what they can absorb through demonstration vs what they can hear as articulated doctrine. Wittgenstein and Buddhist pedagogical tradition converge: the deepest content is transmitted by showing, not saying"
  - "operationally adjacent to lex-jbegr phronesis: phronetic judgment is inherently showing-shaped — the wise practitioner exhibits judgment in particulars rather than articulating universal rules. lex-jbegr and lex-qqgm5 are tightly coupled: phronesis is what gets SHOWN, not said"
  - "the failure-mode 'trying to say the unsayable': academic prose that tries to explicate aesthetic value, ethical commitment, or skilled judgment in fully propositional form. The output is typically either circular or trivial — because the content is structurally show-only. Transferable: when articulation feels strained, suspect you're trying to say what can only be shown"
critical-questions:
  - "where exactly is the boundary between saying and showing? Wittgenstein leaves this radically open in the Tractatus (Russell's introduction notes the difficulty). Transferable test: if you can specify a structural mapping between language and target, you can SAY it; if the target is itself a feature of the language-target relation (logical form, semantic structure, ethical orientation), you can only SHOW it"
  - "is the distinction stable across domains? Polanyi 1958 extends it from logic to skill-epistemology; later philosophy (Brandom 1994, McDowell 1994) extends to social-practice. Transferable: the distinction generalizes wherever there's an operative substrate that the explicit representation does not fully capture"
  - "what's the operational consequence of recognizing showing-vs-saying? (1) Don't waste effort trying to articulate the unsayable; (2) Build practices/demonstrations for content that cannot be said; (3) Treat 'I cannot explain why but I know it' as evidence of show-content, not as evidence of irrational gut; (4) In teaching, lead with demonstration where show-content is crucial"
status: active
