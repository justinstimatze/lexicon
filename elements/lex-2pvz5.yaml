id: lex-2pvz5
name: a-terminal-accounting-names-lifelong-failure-and-asks-only-for-others
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Near the end of life, a person can deliver a formal accounting of their central life's mission, naming the goal plainly as unmet rather than softening it into partial success -- and, in the very same breath, direct the closing request entirely outward, asking nothing for themselves. Standing at the vision's own center decades later, Black Elk states the verdict without qualification: 'the tree has never bloomed. A pitiful old man, you see me here, and I have fallen away and have done nothing.' The prayer that follows asks for no personal absolution: 'Hear me, not for myself, but for my people.'"
related: []
evokes: [black-elk-speaks, authors-postscript, the-tree-has-never-bloomed, a-pitiful-old-man, hear-me-not-for-myself-but-for-my-people]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch26-authors-postscript
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 26, 'Author's Postscript.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "With tears running, O Great Spirit, Great Spirit, my Grandfather—with running tears I must say now that the tree has never bloomed. A pitiful old man, you see me here, and I have fallen away and have done nothing. Here at the center of the world, where you took me when I was young and taught me; here, old, I stand, and the tree is withered, Grandfather, my Grandfather! [...] Hear me, not for myself, but for my people; I am old. Hear me that they may once more go back into the sacred hoop and find the good red road, the shielding tree!"
canonical-instances:
  - "A retiring scientist who spent a career chasing a single unproven theory tells her final lecture audience plainly that the theory was never confirmed and she leaves the field no closer to proving it, then spends the rest of the talk urging funding be redirected to the younger researchers still pursuing other angles."
  - "An aging community organizer, addressing his organization for what he says may be the last time, states outright that the neighborhood he spent forty years trying to unite remains as divided as when he started, then asks only that the next generation of organizers be given the resources he never had."
  - "A dying founder tells the board the company never became what she'd envisioned when she started it, without hedging the admission, then spends her final address asking only that the employees who stayed be protected in whatever comes next."
critical-questions:
  - "Naming the failure this starkly reads as honest, but 'I have done nothing' may overstate it for rhetorical weight, discounting real partial progress the rest of his life's account elsewhere describes."
  - "Does redirecting the final ask entirely to others actually serve them, or does it function partly as a way of ending on a note of selflessness that feels better to deliver than a request that risks being refused?"
  - "The prayer is witnessed and later published by Neihardt -- does knowing an audience beyond the Six Grandfathers will hear this confession change what gets said, compared to a truly private reckoning with no listener at all?"
status: active
