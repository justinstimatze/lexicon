id: lex-mt5h4
name: problem-framing-not-methodology-is-where-values-enter-research
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone defends a piece of research as value-free because the methodology was rigorous and the findings weren't distorted, check the QUESTION the research answered, not the analysis that answered it — that's usually where the values actually entered. Merton's own case study is deliberately built so both researchers are fully honest and fully rigorous: two intellectuals studying the same racial-segregation situation reach 'much the same conclusions' on the facts — low morale among Negro workers, white-worker resistance to desegregation. They diverge entirely at the next step: 'the policy may be defined for the bureaucratic intellectual in these terms: how can we make segregation tolerable if not palatable to the Negro worker?... The unattached intellectual, however... may study means of eliminating racial segregation without appreciably lowering morale of white workers.' Same facts, two different questions, two different bodies of usable findings — and Merton is explicit that this isn't a corruption of either researcher's integrity: 'the validity of the two sets of findings is not in question but the respective researches will be of use for one purpose and not for the other. The crucial point is to recognize the value-implications entailed by the very choice and definition of the problem itself... Thus, the intellectual makes his most significant value decision in selecting both his clientele and, derivatively, the type of problem with which he shall be concerned.' Diagnostic move: when evaluating a claim of research neutrality, don't audit only the method for bias — audit the question for whose interests get served by an answer to exactly that question, since a perfectly unbiased method answering a value-laden question still produces a value-laden result."
related: [lex-65bcq, lex-h5av3]
evokes: [merton-1957, choice-and-definition-of-the-problem, value-implications-of-problem-selection, bureaucratic-vs-unattached-intellectual, same-facts-different-questions, mannheim-wertbeziehung]
lineage:
  - source: primary
    text: merton-1957-segregation-case-study
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VII 'Role of the Intellectual in Public Bureaucracy,' pp.217-218. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). This is Merton's own analytical illustration, used to make a general point about problem-framing and values in research; reproduced here for that methodological point, not as an endorsement of either policy position it describes."
    quote: "'Both bureaucratic and unattached intellectuals may find themselves dealing with the same problem-area: racial segregation in a northern industrial center. On the fact-finding level, both intellectuals may emerge with much the same conclusions: that a large proportion of Negro workers have low morale and low industrial output, apparently as a result of experiencing continued discrimination. The investigators may also agree that a considerable number of white workers object to any proposal for eliminating segregation. The difference between the outlook and research of the bureaucratic and unattached intellectuals may well become manifest on the next level: that of establishing a policy and converting it into a program. The policy may be defined for the bureaucratic intellectual in these terms: how can we make segregation tolerable if not palatable to the Negro worker? Accordingly, the bureaucratic adviser may indicate that certain types of propaganda directed toward the Negro population may serve to heighten morale, without eliminating segregation. The research of the bureaucratic intellectual has thus served to implement a pre-defined policy. The unattached intellectual, however, need not confine his investigation in this way but may study means of eliminating racial segregation without appreciably lowering morale of white workers.'"
  - source: primary
    text: merton-1957-value-decision-in-problem-choice
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.218, Merton's own generalization from the case."
    quote: "'It should be noted that the validity of the two sets of findings is not in question but the respective researches will be of use for one purpose and not for the other. The crucial point is to recognize the value-implications entailed by the very choice and definition of the problem itself and that the choice will be in part fixed by the intellectual's position within the social structure ... Thus, the intellectual makes his most significant value decision in selecting both his clientele and, derivatively, the type of problem with which he shall be concerned.'"
canonical-instances:
  - "A pharmaceutical-funded study asking 'does this drug outperform placebo' and an independent study asking 'does this drug outperform the current standard of care' can both be methodologically flawless and non-overlapping in what they license a doctor to conclude — the bias, if any, was fully spent by the time either question was chosen, not introduced afterward in the analysis."
  - "A city's own study asking 'how can we make this policing tactic more community-accepted' and an outside researcher's study asking 'does this policing tactic reduce crime at all' can both use identical statistical rigor and produce equally valid, equally unusable-for-the-other-purpose answers, because the choice of question already decided what kind of usefulness the findings would have."
critical-questions:
  - "If problem-framing is genuinely where the values enter, does that mean methodological rigor is worth less than research-ethics discourse typically credits it — or are the two failures independent, so that a study can fail on framing, on method, on both, or on neither, and auditing one doesn't substitute for auditing the other?"
  - "Merton frames this as fully compatible with both researchers having 'full integrity' — does that framing let institutions off too easily by treating value-laden problem selection as an individual researcher's unavoidable positioning, when in some cases the institution itself chose which questions would get funded and asked at all?"
status: active
