id: lex-xmhvc
name: believing-yourself-the-source-of-your-own-effectiveness-disables-it
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "A skilled practitioner can describe themselves as a hollow channel through which an outside power flows, and state explicitly that believing oneself to be the actual, personal source of one's own effectiveness would close off that channel and stop the power working entirely. Black Elk states the mechanism in a single unhedged sentence: 'Of course it was not I who cured. It was the power from the outer world, and the visions and ceremonies had only made me like a hole through which the power could come to the two-leggeds. If I thought that I was doing it myself, the hole would close up and no power could come through. Then everything I could do would be foolish.' This isn't presented as humility for its own sake -- the claim is functional: self-attribution is described as the specific failure mode that breaks the mechanism, not merely an unbecoming attitude alongside it."
related: [lex-kq2g7]
evokes: [black-elk-speaks, powers-of-the-bison-and-the-elk, like-a-hole-through-which-the-power-could-come, if-i-thought-that-i-was-doing-it-myself, self-belief-closes-the-channel]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch18-bison-and-elk
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 18, 'The Powers of the Bison and the Elk.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Of course it was not I who cured. It was the power from the outer world, and the visions and ceremonies had only made me like a hole through which the power could come to the two-leggeds. If I thought that I was doing it myself, the hole would close up and no power could come through. Then everything I could do would be foolish."
canonical-instances:
  - "A jazz musician deep in a strong improvised solo reports that the moment they start thinking 'I am playing brilliantly right now,' the flow breaks and the playing becomes noticeably worse for the rest of the set."
  - "A translator working at their fastest and most fluent describes losing that fluency the instant they become consciously proud of a particularly elegant phrase they've just produced, as though noticing the skill interrupts it."
  - "An athlete in a personal-best performance reports that becoming aware of how well they're doing, mid-race, causes an immediate drop in form, as though the awareness itself pulls attention away from whatever was actually producing the performance."
critical-questions:
  - "Is this a literal metaphysical claim about an outside power, or a phenomenologically accurate description of how self-conscious attention to one's own competence disrupts skilled performance regardless of what's actually causing the skill?"
  - "If self-belief genuinely disables the mechanism, how does Black Elk describe his own effectiveness at all without triggering the very failure he warns against -- does talking about the power in this way risk closing the hole he's describing?"
  - "Does this framing let a practitioner avoid responsibility for failures, since a bad outcome could always be attributed to a lapse into self-belief rather than to a real limit in skill or judgment?"
status: active
