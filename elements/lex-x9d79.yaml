id: lex-x9d79
name: provoking-a-coalitions-own-borrowed-power-destroys-it-from-within
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A coalition assembled around one leader's command over vastly more powerful subordinates can be destroyed by provoking the leader into actually exercising that borrowed power, since the leader's own body and position were never built to survive what the power itself produces. In the Jataka's tale of the jackal king Sabbadatha, he commands elephants, lions, and every four-footed beast through a stolen magic spell, but has no capability of his own beyond the command. Goaded into proving he can make even the lion he personally rides roar, he does: 'So he tapped with his foot on the lion which he sat upon, to roar. And the lion resting his mouth upon the Elephant's temple, roared thrice... The elephants were terrified and dropped the Jackal down at their feet; they trampled upon his head and crushed it to atoms.' The coalition's power was always real — the jackal's mistake was standing inside the blast radius of the very force he commanded, with nothing of his own to survive it."
related: []
evokes: [jataka, dukanipata, sabbadatha-jataka, a-leader-with-no-power-of-their-own-is-destroyed-by-the-power-they-command, exercising-borrowed-power-can-kill-the-one-who-borrowed-it]
