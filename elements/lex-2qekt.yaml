id: lex-2qekt
name: craving-an-image-cannot-be-sated-by-consuming-the-image
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern when a desire (romantic longing, obsessive attraction, infatuation) intensifies with proximity to its object rather than resolving the way ordinary appetites resolve when fed. Lucretius's De Rerum Natura (c. 55 BCE), Book IV, argues that erotic desire is stimulated by 'idol-images' — in his atomist theory of perception, thin films of atoms constantly shed from a person's surface and striking the eye — and that this specific origin makes the craving structurally unsatisfiable by ordinary means. Hunger and thirst are relieved because food and water are literally incorporated into the body, filling a real physical deficit — 'they can stop up certain parts' and 'desire of water is glutted and of bread.' But 'from human face and lovely bloom / Naught penetrates our frame to be enjoyed / Save flimsy idol-images and vain': nothing of substance crosses over even in the closest embrace — lovers 'strive and struggle... powerless / To rub off aught, or penetrate and pass / With body entire into body.' Lucretius supplies the operative illustration directly: 'As when the thirsty man in slumber seeks / To drink, and water ne'er is granted him... thirsts even whilst he gulps / In middle of the torrent, thus in love / Venus deludes with idol-images / The lovers.' The mechanism: because the craving was never actually FOR the image (the visible face, the felt presence) but for something the image cannot deliver — genuine union, genuine incorporation — no quantity of the obtainable thing (proximity, gazing, touch, even intercourse itself) discharges the underlying deficit. Lucretius states the resulting paradox explicitly: unlike food and drink, 'this same love it is the one sole thing / Of which, the more we have, the fiercer burns / The breast with fell desire' — satisfaction fails to negatively-feed-back, and consumption INCREASES rather than decreases the craving. This differs from consumption-patterns where feeding an appetite merely fails to satiate it via tolerance or positional comparison: here, the specific reason satiation is impossible is a TYPE MISMATCH between the object craved (real incorporation) and the object obtainable (mere appearance). Recognize it whenever proximity to, or possession of, the visible/audible/represented form of a desired thing intensifies rather than relieves the craving, because what's actually wanted was never obtainable through that channel in the first place — parasocial fixation on a broadcast image, obsessive rereading of a beloved's messages, or any pursuit where the 'more' obtained is always more of the representation, never more of the thing represented. Lucretius's own prescription (Epicurean, not fully portable) is to disperse the craving across many objects rather than fixate on one, on the theory that the ache itself, not the specific person, is the thing to manage."
related: [lex-2m6jq, lex-ykb5a, lex-fjffq, lex-a3kky, lex-xtfe3, lex-patax]
evokes: [lucretius, de-rerum-natura, book-iv, venus-deludes-with-idol-images, simulacra, thirst-in-a-dream, type-mismatch-craving, proximity-intensifies-not-relieves, eyeless-with-passion]
lineage:
  - source: primary
    text: lucretius-c55bce-de-rerum-natura-book-iv-image-based-desire
    citation: "Titus Lucretius Carus, De Rerum Natura [On the Nature of Things], Book IV, trans. William Ellery Leonard (c. 55 BCE). Following his account of vision as caused by thin films ('idol-images') constantly shed from physical surfaces and striking the eye, Lucretius applies this theory of perception to erotic desire: because what crosses from the beloved to the lover is only ever an image, never substance, the craving stimulated by that image cannot be discharged the way hunger is discharged by food, and proximity or even physical union intensifies rather than relieves it. PD globally (Lucretius d. c. 55 BCE; Leonard translation itself PD, Leonard d. 1944, first published 1916)."
    quote: "[The food/water contrast — why ordinary appetites CAN be satisfied:] 'Desire of water is glutted and of bread. / But, lo, from human face and lovely bloom / Naught penetrates our frame to be enjoyed / Save flimsy idol-images and vain— / A sorry hope which oft the winds disperse.' [The dream-thirst illustration:] 'As when the thirsty man in slumber seeks / To drink, and water ne'er is granted him / Wherewith to quench the heat within his members, / But after idols of the liquids strives / And toils in vain, and thirsts even whilst he gulps / In middle of the torrent, thus in love / Venus deludes with idol-images / The lovers. Nor they cannot sate their lust / By merely gazing on the bodies, nor / They cannot with their palms and fingers rub / Aught from each tender limb.' [Even physical union fails to deliver substance:] 'They seem to strive and struggle thus to do; / So eagerly they cling in Venus' bonds, / Whilst melt away their members, overcome / By violence of delight. But when at last / Lust, gathered in the thews, hath spent itself, / There come a brief pause in the raging heat— / But then a madness just the same returns.' [The paradox stated directly:] 'For this same love it is the one sole thing / Of which, the more we have, the fiercer burns / The breast with fell desire.'"
canonical-instances:
  - "The direct pattern-application template: a craving that grows rather than diminishes with proximity to its object is evidence the craving's actual target is not the obtainable thing (an image, a presence, a representation) but something the obtainable thing structurally cannot deliver."
  - "The dream-thirst illustration as a portable diagnostic phrase: 'thirsting even whilst he gulps' names any situation where consumption is visibly occurring yet the underlying deficit is untouched because the wrong kind of thing is being consumed."
  - "Parasocial attachment / media-image fixation: proximity-by-broadcast (rewatching, rereading, endlessly viewing a public figure's image) intensifies fixation rather than satisfying it, because broadcast images are exactly the 'idol-images' Lucretius describes — visible form with no possibility of the incorporation the craving is actually for."
  - "Compulsive image-consumption (e.g. pornography) as a case where the 'idol-image' literally is the entire transaction: Lucretius's mechanism predicts escalation of craving with consumption rather than satiation, since nothing of the needed kind (per his account, genuine union) is ever delivered by the image alone."
critical-questions:
  - "is this the same claim as lex-fjffq (insatiable-consumption-self-amplifies-the-appetite-it-feeds)? No — lex-fjffq explains failure-to-satiate via a MISSING OR WRONG-SIGN feedback signal at the satiation stage (drug tolerance, positional-status ratchet, attention-economy engagement loops): the object consumed is the right KIND of thing, but the feedback loop that should produce satiation has failed. This atom explains failure-to-satiate via a TYPE MISMATCH: the object obtainable (an image) is never the right kind of thing to satisfy the craving at all, so no feedback-sign question even arises. They can co-occur — romantic obsession often shows Wiindigo-style escalation on top of Lucretius's type-mismatch — but imply different interventions: lex-fjffq says 'find or restore the satiation signal'; this atom says 'the channel cannot deliver the needed kind of thing — change channel, or reduce reliance on it.'"
  - "is this the same claim as lex-ykb5a (pendulum-between-pain-and-boredom, Schopenhauer)? No — Schopenhauer's atom claims ANY satisfied desire produces boredom because the will wants wanting itself, not any specific object. This atom is narrower: it explains why one specific SUBCLASS of desire — desire stimulated by an image/appearance rather than the underlying thing — cannot even reach Schopenhauer's brief satisfied-then-bored plateau, because it structurally never reaches satisfaction at all. Schopenhauer's pendulum presupposes a satisfaction phase this atom's mechanism denies exists for image-triggered craving specifically."
  - "is this the same claim as lex-a3kky (pre-natal-and-post-mortem-nonexistence-are-symmetric, same poem, same book-neighborhood)? No — different argument in the same general Book III-IV sequence on the ills and remedies of human passions. lex-a3kky concerns whether death can harm a nonexistent subject; this atom concerns why an image cannot discharge a craving for substance. Only commonality: same author, same atomist/materialist framework, adjacent books."
  - "does this mean romantic love or attachment can never be satisfying? No — Lucretius's own text distinguishes 'prospering love and true' (which still carries costs but is livable) from 'crossed love and helpless' (unbounded ills), and this atom names specifically the CRAVING-DYNAMIC he diagnoses in obsessive, image-fixated desire — not a claim that no durable satisfaction is ever possible once a relationship moves beyond the image-mediated stage into sustained mutual presence."
