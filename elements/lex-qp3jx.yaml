id: lex-qp3jx
name: host-extends-an-invitation-to-those-with-no-standing-to-expect-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When the intended guests for an event decline, one after another, on grounds of competing priorities, the host doesn't cancel the event — the invitation gets extended outward to people who had no reason to expect one: the poor, the maimed, the halt, and the blind, gathered from the streets and hedges specifically because the originally-invited list has excused itself. The host's response to rejection is expansion of who counts as a guest, not contraction of the event."
related: []
evokes: [kjv, compel-them-to-come-in, highways-and-hedges, the-poor-the-maimed-the-halt-and-the-blind, made-light-of-it-and-went-their-ways]
lineage:
  - source: primary
    text: kjv-1611-luke-14-the-great-supper
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), Luke 14:16-23. Verified verbatim against a direct extraction of the held copy."
    quote: "A certain man made a great supper, and bade many: And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready. And they all with one consent began to make excuse. [...] So that servant came, and shewed his lord these things. Then the master of the house being angry said to his servant, Go out quickly into the streets and lanes of the city, and bring in hither the poor, and the maimed, and the halt, and the blind. And the servant said, Lord, it is done as thou hast commanded, and yet there is room. And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled."
canonical-instances:
  - "A conference's keynote speakers all drop out in the final month over scheduling conflicts, and rather than shrink the program, the organizers open the main stage to attendees who'd submitted talks and been rejected the first round — the event ends up larger and more varied than the original invite-only lineup would have been."
critical-questions:
  - "Is the expansion here a genuine broadening of who's welcome, or does it read to the newly-included guests as being visibly second-choice — does the host's motive (filling seats versus genuinely widening the circle) change how the invitation lands?"
status: active
