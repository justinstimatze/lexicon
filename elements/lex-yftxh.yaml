id: lex-yftxh
name: your-provider-becomes-your-real-adaptive-environment
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "When one party's entire food supply comes through another party rather than through direct interaction with the wider world, the feeding party effectively becomes the dependent party's real adaptive environment -- selection pressure then shapes the dependent party not toward broad competence in the world, but toward whatever pleases the specific party they depend on, because that relationship, not the wider world, is what actually determines their survival. Gilman states this directly: 'Where the two sexes obtain their food under different conditions, and where that difference consists in one of them being fed by the other, then the feeding sex becomes the environment of the fed. Man, in supporting woman, has become her economic environment. Under natural selection, every creature is modified to its environment, developing perforce the qualities needed to obtain its livelihood under that environment. Man, as the feeder of woman, becomes the strongest modifying force in her economic condition.'"
related: []
evokes: [women-and-economics, chapter-ii, the-feeding-sex-becomes-the-environment-of-the-fed, man-in-supporting-woman-has-become-her-economic-environment, the-provider-as-adaptive-environment]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-ii
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter II. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "Where the two sexes obtain their food under different conditions, and where that difference consists in one of them being fed by the other, then the feeding sex becomes the environment of the fed. Man, in supporting woman, has become her economic environment. Under natural selection, every creature is modified to its environment, developing perforce the qualities needed to obtain its livelihood under that environment. Man, as the feeder of woman, becomes the strongest modifying force in her economic condition."
canonical-instances:
  - "An employee whose entire livelihood depends on a single controlling boss, rather than on a broad, competitive labor market, develops skills and habits shaped by what pleases that specific boss, not by what would make them competent or valuable in the wider field."
  - "A child raised in total isolation by one caregiver develops personality traits calibrated to that caregiver's particular preferences and moods, rather than to the broader social world they'll eventually have to navigate, because the caregiver is functionally the only environment the child has ever had to adapt to."
  - "An artist entirely dependent on a single wealthy patron's taste develops a style shaped by pleasing that one patron specifically, rather than by any broader engagement with audiences, critics, or the art world, because the patron functions as the artist's whole economic environment."
critical-questions:
  - "Does the concept of environment get stretched too far here -- an actual physical environment presents countless unpredictable challenges an organism must adapt to broadly, while a single feeding individual is a much narrower, more specific, and more negotiable source of pressure than a genuine ecosystem."
  - "If the feeding party is itself embedded in a wider economic and social environment, does the dependent party's adaptation to the feeder transmit, indirectly, some adaptation to that wider environment too, softening the claim that the dependent party's world has been narrowed to just one person?"
  - "Human relationships involve mutual influence and negotiation in a way pure environmental adaptation doesn't -- does treating a spouse or parent as an environment the dependent party is simply shaped by understate the dependent party's own agency and capacity to influence the relationship back?"
status: active
