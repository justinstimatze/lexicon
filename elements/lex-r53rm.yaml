name: permitted-use-creates-the-stakeholder-a-ban-removes
type-in: state
type-out: process
_tier: atomic
agent-instruction: "Bruce Pascoe argues that Australia's blanket resistance to commercial kangaroo and wallaby harvest, framed as protecting the animals, works against its own stated goal. Pascoe: 'Harvesting kangaroos and wallabies will not endanger the population of macropods, but instead guarantee their protection. ... Utilising these animals does not mean they will never again be seen in the wild; rather, it guarantees that they will, whereas our current methods are seeing mass extinctions of animals adapted to an environment previously managed and shaped by Aboriginal Australia.' The mechanism: a species nobody may legally profit from has no one whose land-use decisions depend on it staying alive. A landholder choosing between running cattle, which damage the same soil and water Pascoe is discussing, and supporting native macropods has every economic reason to pick cattle when the macropods carry no earning potential of their own. Permit a regulated harvest instead, and the calculus flips -- the landholder now has a reason to keep habitat intact and the population healthy, because the animal itself is worth something standing on their land. The ban and the harvest right both aim at the same outcome, a surviving population, but only one of them creates an actor with a continuing stake in producing that outcome. Diagnostic move: before assuming a use-ban is the protective option, check who gains an economic stake in the resource's survival under each policy -- a resource nobody may use often ends up with nobody defending it either."
