id: lex-skfsg
name: shift-from-macro-mechanism-to-micro-mechanism-for-breakthrough-level-fixes
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you want a breakthrough-level solution rather than an incremental one, don't keep improving the same kind of macro-scale mechanism (levers, springs, hinges, blocks) — look for a way to replace it with a micro-scale mechanism (a molecular, crystalline, magnetic, or field-level effect) that produces the same function, because that specific kind of shift is disproportionately more likely to jump to a much higher level of invention. Altshuller names four possible directions an invention can move between a macro-object (built from ordinary parts) and a micro-object (built from molecules, atoms, ions, or fields), and reports a striking asymmetry between them: 'the shift M-M rarely produces an invention of higher than the third level; the shift M-m as a rule leads to an invention of the fourth and fifth level; the shift m-m usually produces inventions no higher than the third level... [and] the switch from m-M contradicts the tendencies of development of technology.' His worked contrast: a normal car brake works at the macro level 'with the help of blocks, levers, springs, rods'; the breakthrough version replaces the mechanical ring with piezo-ceramics driven by a high-frequency generator — 'the brake ring is extended by dint of changes in the parameters of a crystal lattice' — the SAME braking function, but the mechanism moved from macro parts to a micro (crystal-lattice) effect, which is what makes it a fourth/fifth-level invention rather than an incremental improvement to springs and levers. He traces the same pattern across a whole technology's history: sailing ships slowly improved their sails (M-M, incremental); the real technical revolution was the shift to steam pistons driven by molecules of steam under a heat field (M-m); later refinements within that new regime (steam to internal combustion) stayed at the m-m level; a further M-m-style shift (to electromagnetic pumping of ions directly) was already visible as the next revolution. Diagnostic move: when trying to push a design toward a genuinely higher level of solution rather than another round of incremental refinement, ask what CURRENTLY macro-scale part of the mechanism (a lever, a spring, a mechanical linkage) could instead be accomplished by a molecular, crystalline, electromagnetic, or other micro-scale effect performing the equivalent function — this specific direction of change (macro to micro, not micro to macro, and not staying at either level) is where the largest jumps in solution quality actually cluster."
related: [lex-6w927, lex-uq4xw]
evokes: [macro-to-micro-shift, M-m-M-M-m-M-taxonomy, brake-ring-piezo-ceramics-example, sail-to-steam-piston-to-ion-pump-history]
lineage:
  - source: primary
    text: altshuller-1984-macro-micro-shift-taxonomy
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.6 'From Simple to Complex Methods,' section '\"Macro\" and \"Micro\" Levels of Methods.'"
    quote: "'If one is to compare the levels of inventions obtained by means of the first shifts, we obtain the following picture: the shift M-M rarely produces an invention of higher than the third level; the shift M-m as a rule leads to an invention of the fourth and fifth level; the shift m-m usually produces inventions no higher than the third level, if the changes occur within the bounds of a single sub-level (a molecule remains a molecule throughout) and higher than the third level if a replacement of sub-level takes place... there are no such inventions [of the m-M type]: the switch from m-M contradicts the tendencies of development of technology, and demands a 'primitivization' of the technical system.'"
  - source: primary
    text: altshuller-1984-brake-ring-piezo-ceramic-example
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.6, '\"Macro\" and \"Micro\" Levels of Methods.'"
    quote: "'2) from macro-object to micro-object (M - m); for instance the invention in Pat. Cert. No 465 502: 'A braking device containing a shaft and a brake ring fixed to it under tension linked to the source of driving energy; in order to improve the exploitative properties of the braking ring it is made of piezo-ceramics and as a source of energy a high frequency generator is used.' Normal braking systems (as in a car, for instance), work on a macro-level — with the help of blocks, levers, springs, rods, etc. The essence of the invention is the transfer to a microlevel: the brake ring is extended by dint of changes in the parameters of a crystal lattice.'"
canonical-instances:
  - "A team improving a mechanical lock's pick-resistance keeps refining pin geometry and spring tension (M-M, incremental); replacing the pin-tumbler mechanism entirely with an electromagnetic or biometric locking mechanism is the M-m shift that produces a genuinely different security level, not just a better version of the same pin mechanism."
  - "A shipping company improving package-tracking accuracy keeps refining the mechanical/procedural steps of scanning barcodes at each hub (M-M); switching to embedded RFID or NFC chips that respond to ambient reader fields without manual scanning is the M-m shift into a fundamentally more capable and less labor-dependent tracking regime."
  - "operationally distinct from lex-6w927 system-operator-nine-windows-scale-and-time: that atom scans a system's ALREADY-EXISTING structure across subsystem/system/supersystem to surface a design pressure; this atom is a specific DIRECTIONAL RECOMMENDATION (move toward the micro scale specifically) for where to look when actively hunting for a higher-level solution, not a general diagnostic scan."
critical-questions:
  - "does the M-m shift's advantage hold across all technology domains equally, or is it an artifact of the specific historical period (mechanical-to-electromagnetic transitions) that Altshuller's patent sample was drawn from — would a modern software or biological system show the same asymmetry, or a different one?"
  - "is a micro-scale solution always available for a given macro-scale problem, or does this heuristic risk sending solvers on an unproductive search for a molecular/field-level effect that simply doesn't exist for their specific function, wasting effort that a good M-M refinement could have captured cheaply?"
  - "does moving to a micro-scale mechanism introduce new costs (fabrication difficulty, fragility, unfamiliarity, higher unit cost) that this asymmetry in 'invention level' doesn't account for — is a higher TRIZ 'level' always the right tradeoff against these practical costs?"
status: active
