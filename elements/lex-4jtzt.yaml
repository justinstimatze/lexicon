id: lex-4jtzt
name: default-to-speed-and-require-a-named-reason-to-slow-down
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When advancing toward a goal, don't treat 'move faster' and 'wait' as equally available options to weigh case by case -- make speed the default and require any deliberate slowdown to be justified by a specific, nameable condition it's actually buying you, so that hesitation never gets to disguise itself as prudence. Kautilya's rule for the army's march states exactly six conditions under which the pace should deliberately slow -- countering a threat to the rear, clearing a difficult path, awaiting reinforcements or the right season, waiting for the enemy's position to deteriorate, waiting for subversion efforts already underway to bear fruit, or waiting for the enemy to make a helpful mistake -- and then closes with the default: 'In the absence of any such reason, the march shall be speeded up.' Each of the six named reasons describes something concrete the delay is purchasing (safety from a specific threat, an ally's arrival, an opponent's decline, a spy's payoff) -- none of them is 'to be careful' or 'to make sure' in the abstract. This structure makes vague caution impossible to hide inside: a commander who wants to slow down has to name which of the six conditions applies, and if none does, the rule itself forecloses the option. Diagnostic move: before slowing down or delaying a decision already in motion, name the specific condition the delay is buying -- a resource that hasn't arrived yet, a risk that hasn't yet passed, information that isn't yet in -- and if no such condition can be named, treat the default (move faster, not slower) as the one already in force rather than something that has to be argued back into place."
