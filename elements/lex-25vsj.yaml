lineage:
  - source: primary
    text: cushing-rattlesnake-toddler-warning-too-late
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Rattlesnakes Came to Be What They Are.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'My children, said the mother, go if you wish, but be very careful of your little sister; for she is young. Carry her gently on your shoulders, and place her where she will be safe, for she is very small and helpless. ... The little creature ran, clapping her hands and laughing, to catch her sister as she came; and the elder one, trying in vain to stop herself, called out to her to beware; but she was a little thing, and knew not the meaning of her sister's warning; and, alas! the elder one slid down upon her, knocked her over and rolled her in the sand, crushing her so that she died.'"
canonical-instances:
  - "A lifeguard instructs a group of children to stay in the shallow end before they enter the pool, and when a toddler wanders toward the deep end during play, an older sibling's shouted 'stop, come back!' fails to register in time, not from disobedience but because the toddler has no existing capacity to translate an urgent shout into an immediate change of direction."
  - "A construction supervisor briefs a new worker on where the fall-hazard zones are before the shift starts, and when the worker wanders near an unmarked edge while distracted, a coworker's shouted warning arrives a half-second too late to be useful, because a warning shouted mid-motion requires a trained reflex the worker hasn't yet built."
critical-questions:
  - "Would any advance instruction have actually prevented this, given that the danger came from the toddler's own uncontrolled excitement rather than from anyone failing to follow the mother's stated care, or was some accident of this kind close to inevitable once a toddler was present at all?"
  - "Is there a meaningful difference between a warning that fails because the recipient can't decode it in time and one that fails because the recipient understands it but can't physically act on it fast enough -- does the story's phrase 'knew not the meaning' point specifically at the first kind?"
  - "Does assigning blame anywhere in this story, to the mother for allowing it, to the elder sister for not stopping in time, or to no one at all, change what the actual diagnostic lesson is about warnings arriving too fast for their recipients to use?"
status: active
