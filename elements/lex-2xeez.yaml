lineage:
  - source: primary
    text: cushing-younger-brother-breaks-the-taboo-to-feed-his-mother-and-kills-her
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Maiden the Sun Made Love To, and Her Boys: or the Origin of Anger.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Now, I have given ye with your birth the power to slay all game; but mind that not a single rabbit, nor deer, nor antelope, nor mountain sheep, nor elk--though he be the finest ye have ever seen--shall ye slay, for in that case ye shall perish with your mother. ... Why not? Here our poor mother has nothing but corn-cakes to eat, with all this meat around us. And before his brother could speak another word, he drew his arrow to the head, and tsi! it pierced the heart of the great antelope and it fell dead. Now, all the great animals round about grew angry when they saw this ... the great deer had trampled their poor mother to death.'"
canonical-instances:
  - "A caregiver ignores a doctor's explicit instruction not to give a frail elderly patient a large meal too soon after surgery, reasoning that the patient looks hungry and deserves to be fed generously, and the meal triggers a complication that the instruction existed specifically to prevent."
  - "A parent breaks an agreed household rule against giving a child unsupervised access to a pool, reasoning that the child loves swimming and deserves the treat after a hard week, not recognizing that the rule was created for exactly the drowning risk that then occurs."
critical-questions:
  - "Was the younger brother's stated motive, wanting to feed his mother, sincere, or was it a convenient framing for an impulse he already wanted to act on regardless -- does the story give any indication of which, and does it matter for the lesson?"
  - "Would the outcome have differed if the elder brother's repeated warnings had been heeded even a moment sooner, or was the antelope's death already sufficient to trigger the animals' retaliation regardless of how quickly they fled afterward?"
  - "Is there a meaningful difference between a prohibition whose reason is stated plainly in advance, as this one is ('for in that case ye shall perish'), and one that simply forbids an action without explanation -- does an explicit stated consequence make violating it for a sympathetic reason more or less forgivable?"
