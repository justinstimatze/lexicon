canonical-instances:
  - "A trade that begins requiring a four-year degree for supervisory roles it previously filled by promoting its most skilled tradespeople closes an internal ladder at the same moment it starts recruiting supervisors from a demographic that never worked the floor."
  - "A hospital system that shifts head-nurse and ward-management roles to require an MBA-style credential, rather than promoting from its own senior nursing staff, ends up with managers whose acquaintance with patient-floor work is abstract rather than concrete, exactly as Merton describes for industry."
critical-questions:
  - "Does raising the credential bar always produce this effect, or only when the credential's cost or access is itself stratified — i.e., would a widely and cheaply available credential (e.g., a free certification open to all incumbents) avoid the class-cleavage half of the mechanism while still closing the pure seniority-based promotion path?"
  - "Is the resulting gap in outlook (abstract knowledge vs. concrete acquaintance) reversible by deliberate rotation or shadowing programs, or does Merton's account imply the gap is structurally reinforced by the recruitment pattern itself, requiring a change to who is recruited rather than added training for whoever is already recruited?"
