id: lex-e6r4n
name: an-invisible-obstacle-at-the-strike-point-turns-aggression-into-capture
type-in: process
type-out: process
_tier: atomic
agent-instruction: "You don't need to stop an aggressor before they attack if you can place something undetectable exactly where their own attack is going to land -- their aggression does the work of driving them into the trap themselves. In Cushing's telling, one of the War-gods hurls a magic net-shield at a cannibal demon about to bite one of his captives: 'it sailed straight over the heads of the maidens and settled between them and the demon's face. The shield was invisible, and the old demon knew not it was there.' Nothing about the scene has changed from the demon's point of view; he still sees an open, undefended target. He 'opened his great mouth, and, bending yet nearer, made a vicious bite at the elder one,' fully committing to the strike, and 'the demon's teeth caught in the meshes of the invisible shield,' leaving him tangled and vulnerable precisely because his own aggressive impulse carried him straight into it. No restraint was required of the maidens; the trap needed only the demon's own eagerness to attack an apparently helpless target. Diagnostic move: when facing an aggressor confident enough to commit fully to an attack on what looks like an easy target, an obstacle they cannot perceive in advance turns that very confidence into the mechanism of their capture -- the more certain they are of an easy strike, the harder they commit, and the harder they commit, the more thoroughly they're caught."
