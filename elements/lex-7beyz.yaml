id: lex-7beyz
name: an-authoritys-dismissal-silences-an-accurate-doubt
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone with less standing voices a specific, accurate doubt about a deception, an authority figure can shut it down not by refuting the substance but by reframing the doubt itself as an offense, unkindness, or nervousness-inducing behavior -- and the reframing works precisely because it never has to engage with whether the doubt was correct. In Radin's Winnebago Hare Cycle, Hare has killed the young chief and taken his place, but the chief's mother notices the disguise is imperfect, twice, and is right both times: 'I believe one of the arrows sticks out just a little more than the other' and later 'this cannot be my son for he never eats so much food.' Both observations are accurate; this is not her son. Each time, the old chief intervenes not by checking her claim but by attacking her for making it: 'What do you mean by making our boy nervous, you evil old woman' and 'Why don't you let our child eat in peace? You will make him nervous with your talk.' The father's authority in the household lets him substitute a judgment about the doubt's social cost for any judgment about its truth, and because his response never touches the actual claim, the mother's correct suspicion dies without ever being investigated. Diagnostic move: when someone in authority responds to a specific, checkable doubt by criticizing the doubter's tone or effect rather than addressing the substance, notice that the doubt itself has not been answered -- and that the silencing works exactly as well whether the doubt was right or wrong, which is why it should never be mistaken for a resolution."
