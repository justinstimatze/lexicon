id: lex-8ef2d
name: eligibility-criteria-manufacture-the-comparison-group-people-use
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an institution writes a rule that grants or withholds something based on a status category (age, marital status, tenure, income bracket), the rule doesn't just regulate behavior — it manufactures the exact peer group people will use to judge whether their own treatment was fair. Merton: 'it is the institutional definitions of the social structure which may focus the attention of members of a group or occupants of a social status upon certain common reference groups... These same rules, since they are defined in terms of such statuses as marital condition and age, also focus attention on certain groups or statuses with which individuals subject to service will compare themselves.' His illustration: 'This was officially recognized by draft boards.... The very fact that draft boards were more liberal with married than with single men provided numerous examples to the drafted married man of others in his shoes who got relatively better breaks than he did.' The mechanism: naming a category as eligibility-relevant doesn't just sort people into groups for administrative purposes, it tells everyone in that category exactly who counts as 'others in his shoes' — the specific comparison set whose different treatment will register as fair or unfair. Diagnostic use: when designing or auditing an eligibility rule, ask not only 'who does this include or exclude' but 'what comparison group does drawing this line create,' since that comparison group is where grievance and legitimacy-questioning will concentrate — a category the rule never mentions can't generate this kind of grievance at all, however unequal it may be by other measures."
related: [lex-csnjj]
evokes: [merton-1957, the-american-soldier, draft-boards, others-in-his-shoes, institutional-definitions-create-reference-groups, eligibility-rules-manufacture-comparison-sets]
lineage:
  - source: primary
    text: merton-1957-institutional-definitions-focus-comparison
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior,' in Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VIII, p.246. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'it is the institutional definitions of the social structure which may focus the attention of members of a group or occupants of a social status upon certain common reference groups. Nor does this refer only to the fact that soldiers will take the official institutional norms (the rules governing induction and exemption) as a direct basis for judging the legitimacy of their own induction into the service. These same rules, since they are defined in terms of such statuses as marital condition and age, also focus attention on certain groups or statuses with which individuals subject to service will compare themselves.'"
  - source: primary
    text: merton-1957-others-in-his-shoes
    citation: "Robert K. Merton and Alice S. Rossi, 'Contributions to the Theory of Reference Group Behavior' (1957), same chapter, pp.246-247, immediately following."
    quote: "'This is, in effect, implied by the authors who, referring to the greater sacrifices entailed by induction of the married man, go on to say: \"This was officially recognized by draft boards. . . . The very fact that draft boards were more liberal with married than with single men provided numerous examples to the drafted married man of others in his shoes who got relatively better breaks than he did.\" The institutional norms evoke comparisons with others similar in particular aspects of status — \"others in his shoes\" — thus encouraging common reference groups for these married soldiers.'"
canonical-instances:
  - "A company's promotion policy that explicitly names 'five years of tenure' as a criterion doesn't just decide who's eligible — it hands every employee at year four a specific, named comparison group (people who just hit five years) whose promotion will read as fair or unfair in a way a criterion the policy never mentioned (say, geographic office) never could."
  - "A scholarship rule that grants aid based on a specific income cutoff creates intense grievance right at that cutoff line — families just above it compare themselves specifically to families just below it — even though the same rule is indifferent to, and generates no comparable grievance from, families far above or far below the line where the gap in actual dollars is much larger."
critical-questions:
  - "Does this mean institutions should avoid stating eligibility criteria explicitly in order to avoid manufacturing grievance-generating comparison groups — or does explicit criteria at least make the comparison legible and contestable, versus an unstated criterion that still sorts people but leaves them unable to name who they're being compared to?"
  - "Is the manufactured comparison group always the two sides of the eligibility line (just-included vs. just-excluded), or can a rule create comparison groups further from the boundary too — and if grievance concentrates specifically at the boundary, does that suggest boundary design (a sharp cutoff vs. a graduated phase-in) is itself a lever for how much of this effect a policy produces?"
