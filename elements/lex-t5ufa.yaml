id: lex-t5ufa
name: a-lost-collective-ritual-forces-the-underlying-need-into-improvisation
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a society loses its shared, agreed-upon ritual form for handling a recurring psychological or social need, the need itself doesn't disappear along with the ritual -- it keeps recurring, and without a collective container to hold it, individuals are forced to invent private, unsanctioned versions on their own, with none of the shared rules, timing, or containment the old ritual provided. Hyde makes this the pivot of his closing argument: 'It's not that the modern world has no ritual -- simple rituals are all around us -- but we certainly don't have much agreed-upon collective dirt-work... What are the modern forms by which order deals with its own exclusions? Where is the dirt-work of democratic mass society?' He locates the clearest case in Carl Jung's own childhood vision: 'Jung's work with his childhood fantasy is homemade ritual. His twelve-year-old psyche spontaneously provided the initial material, material that would, in a differently developed culture, have found its reflection in already active community rituals... But little such collective understanding remains in the modern world, and a child like Jung... must create his own psychological system if he's to get any lasting benefit from that early moment of grace.' The consequence Hyde draws for public art controversies follows the same logic: 'because the need for this kind of renewal does not go away, we are periodically forced to make something up.' Diagnostic move: when an individual act looks like private transgression, obsession, or invented practice with no clear precedent, check whether it might be doing the structural work of a ritual a culture used to hold collectively and no longer does -- the absence of a shared container doesn't mean the underlying need went away, it means whoever still has the need is now solving it alone, ad hoc, and without agreed rules for how far it should go or when it ends."
