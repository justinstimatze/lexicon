id: lex-vqk8h
name: feigning-incapacity-preempts-succession-to-a-role-that-would-corrupt-you
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Someone born into a role they foresee will eventually force them to commit acts they consider wrong does not wait until the choice is theirs to refuse it — they preemptively disqualify themselves from ever inheriting it, adopting a costly, sustained disability that makes succession structurally impossible rather than merely declined. In the Jataka''s tale of Temiya, having witnessed his own father casually sentence four robbers to torture and execution and foreseeing the same cruelty as his own eventual duty as king, the prince''s protective goddess counsels feigned incapacity as the escape: "Fear not, my child Temiya; if you really desire to escape, then pretend to be acripple, although not really one; though not deaf, pretend to be deaf, and, though not dumb, pretend to be dumb. Putting on these characteristics, shew no signs of intelligence."'
related: []
evokes: [jataka, mahanipata, muga-pakkha-jataka, temiya-jataka, preemptive-self-disqualification, feigned-incapacity]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-muga-pakkha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 538, Muga-Pakkha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Fear not, my child Temiya; if you really desire to escape, then pretend to be acripple, although not really one; though not deaf, pretend to be deaf, and, though not dumb, pretend to be dumb. Putting on these characteristics, shew no signs of intelligence."
canonical-instances:
  - "An heir apparent to a family business built on tax practices the heir considers unconscionable spends years cultivating a reputation as unreliable and disengaged, specifically so the board looks past them when naming a successor, rather than publicly refusing a role no one has offered yet."
  - "A junior officer who foresees that rising to command means eventually ordering actions they'd consider war crimes deliberately tanks a promotion review years before the choice would ever be theirs, rather than waiting to refuse the order in the moment."
critical-questions:
  - "Sixteen years of feigned incapacity is also sixteen years the prince's mother genuinely believes her son is disabled — does preempting a future wrong justify inflicting a present, ongoing grief on someone with no part in causing it?"
  - "What happens if the disqualifying disability had arrived by chance rather than choice — would refusing an offered cure to preserve the exclusion carry the same moral weight as fabricating the disability in the first place?"
status: active
