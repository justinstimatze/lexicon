id: lex-n46qu
name: a-disgust-analogy-fortifies-the-irreversibility-of-a-renunciation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "To make backsliding on a renunciation feel not just inadvisable but viscerally repugnant, frame the abandoned thing as bodily waste already expelled — reversing course becomes equivalent to reingesting your own phlegm, not merely returning to a former state. In the Jataka's tale of Sayha, offered the high office of royal chaplain and every temptation the king can name, the ascetic refuses by reaching for exactly this image: 'The wise do not again take up the sins they have once abandoned any more than they would swallow the phlegm they have once raised.' The disgust does the work that pure willpower against temptation might not."
related: []
evokes: [jataka, catukkanipata, sayha-jataka, reversing-a-renunciation-framed-as-reingesting-waste, disgust-as-a-harder-barrier-than-willpower-alone]
lineage:
  - source: primary
    text: jataka-chalmers1895-sayha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 310, Sayha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The wise do not again take up the sins they have once abandoned any more than they would swallow the phlegm they have once raised."
canonical-instances:
  - "Someone who quit a toxic relationship for good tells a friend urging reconciliation that going back would feel like 'eating something I already spat out' — the visceral framing makes the option feel physically unthinkable rather than just a decision to keep re-litigating."
critical-questions:
  - "Does manufacturing disgust toward a genuinely neutral or even valuable option (the chaplaincy itself isn't inherently corrupt) risk overcorrecting into rejecting things that might actually be worth reconsidering on their own merits?"
  - "Is this a durable commitment device, or does the vividness of the disgust image fade with time in a way that a more reasoned commitment might not?"
status: active
