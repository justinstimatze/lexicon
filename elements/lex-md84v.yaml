evokes: [revenge-seeks-the-same-category-of-loss-not-just-equivalent-harm, cushing-zuni-the-cock-and-the-mouse, the-very-mark-of-my-mousehood, bereft-of-distinction]
lineage:
  - source: primary
    text: cushing-zuni-cock-and-mouse-mirrored-revenge-on-the-bristles
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Cock and the Mouse' (Zuñi version, as retold by Waihusiwa from Cushing's own telling of the Italian tale, reproduced alongside the Italian original for comparative folklore study). Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'For he is worse than an owl or a night-hawk. They eat us all up, but he has taken away the very mark of my mousehood and left me to mourn it. I'll take vengeance on him, will I! ... he ran across, before ever the Cock had opened an eye, and gnawed his bristles off so short that they never could grow again. There, now! said the Mouse. Lo! thus healed is my heart, and my enemy is even as he made me, bereft of distinction!'"
canonical-instances:
  - "A colleague who was publicly and unfairly stripped of credit for a project doesn't seek an equivalent salary penalty against the person responsible when the chance for payback arrives, but specifically maneuvers to make sure that person's own contribution to a future project goes uncredited in front of the same audience."
  - "A sports team humiliated by a rival's showboating after a blowout loss doesn't settle for winning the rematch by a comfortable margin, but specifically engineers a moment to run up the score with the exact same style of celebration that had humiliated them, matching the category of insult rather than just the scoreline."
critical-questions:
  - "Does the mouse's satisfaction ('thus healed is my heart') actually depend on the mirrored specificity of the revenge, or would any sufficiently severe injury to the rooster have produced the same sense of resolution -- is the category-matching doing real psychological work, or is it incidental to the story's symmetry?"
  - "Is there a meaningful difference between revenge that mirrors the category of loss and revenge that simply escalates past it, given that the mouse also causes a serious head injury with the nut before ever touching the bristles -- does the story present the bristle-cutting as the point, or as an addition to an already-completed punishment?"
  - "Would recognizing this pattern in oneself, wanting revenge to match the specific category of what was taken rather than just its severity, change how someone pursues or evaluates a grievance, or is the pattern only visible in hindsight once the retaliation has already been carried out?"
