id: lex-6tvr6
name: pre-commitment-binds-future-action-against-predictable-erosion
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you predict future erosion of your will or credibility, pre-commit now — bind future action via mechanism, contract, public declaration. Pre-commitment defeats predictable erosion by removing the erosion-vulnerable decision point."
related: [lex-wtkuz, lex-89rjr, lex-2rsad, lex-v7ceq, lex-cgqta, lex-u2kzt, lex-k6wka, lex-efv3v, lex-36cbh, lex-ftu47, lex-vx867, lex-653ng, lex-5y7zb, lex-nb82m, lex-gu8st, lex-68v4p, lex-9cuew, lex-gwu5b, lex-76nk7, lex-2sr4y, lex-jsec3, lex-hs9vn, lex-uh48q]
scaffolds-from: [lex-v7ceq, lex-gwu5b]
evokes: [ulysses-pact, self-paternalism, burning-bridges, binding-oneself, if-then-commitment, credibility-via-irrevocability, trip-wire, tying-the-mast, constitutional-pre-commitment, responsible-scaling-policy, weakness-of-will-rescue]
lineage:
  - source: primary
    text: Elster-1979-UlyssesAndTheSirens
    citation: "Jon Elster, *Ulysses and the Sirens: Studies in Rationality and Irrationality* (Cambridge: Cambridge University Press, 1979), Ch. II 'Imperfect Rationality: Ulysses and the Sirens'. Elster's foundational treatment of pre-commitment as the structural rescue for imperfect rationality: an agent who is 'weak and knowing it' (the Ulysses predicament — clarity now about predicted future-clouding) cannot solve the problem in the moment of weakness but can solve it indirectly by acting on the environment in advance, building causal machinery that will hold against the predicted future preference-shift. The pact binds at t1 the action that t2-self would otherwise reverse under passion / addiction / motivated drift. Elster generalizes from Homer's Ulysses to constitutions (societies binding themselves), to smoking cessation, to weight-loss self-paternalism, and explicitly connects to Aristotelian moral psychology. The diagnostic move is to notice the t1/t2-self asymmetry: pre-commitment is rational ONLY IF the future preference-shift is predictable, the predicted future-self would actually defect, and the binding mechanism's causal-force exceeds the predicted future pressure."
    quote: "[Elster 1979 Ch.II.1 epigraph (Homer Odyssey XII):] '...but you must bind me hard and fast, so that I cannot stir from the spot where you will stand me...and if I beg you to release me, you must tighten and add to my bonds.' [Ch.II.1 thesis statement:] 'Ulysses was not fully rational, for a rational creature would not have to resort to this device; nor was he simply the passive and irrational vehicle for his changing wants and desires, for he was capable of achieving by indirect means the same end as a rational person could have realised in a direct manner. His predicament — being weak and knowing it — points to the need for a theory of imperfect rationality...' [Ch.II.1 general thesis:] 'The general thesis being defended is that binding oneself is a privileged way of resolving the problem of weakness of will; the main technique for achieving rationality by indirect means.' [Ch.II.1 group-level extension:] 'societies as well as individuals have found it useful to bind themselves, e.g. through constitutions. The problem of binding oneself is also relevant for many questions in the philosophy of mind (who binds whom?) and in moral psychology (who has the right to bind whom?).' [Ch.II.2 smoking-cessation worked example:] 'In order to stop smoking it is standard practice to set up some causal machinery that will add force to your inner resolution: to tell your friends about your intention so as to invite their sarcastic comments if you are backsliding; to go for a walk in the mountains so as to make cigarettes physically unavailable; to cross the street when you see a tobacco shop further on so as not to be exposed to the sight of cigarettes...' [the transferable corollary:] pre-commitment is rational under three jointly-necessary conditions — (i) predicted future preference-shift is structurally inevitable, not contingent; (ii) the t2-self would actually defect absent the binding; (iii) the binding's causal-force at t2 exceeds the predicted pressure. If any condition fails, the binding is paternalism without warrant (the t1-self over-constraining the t2-self)."
  - source: primary
    text: Schelling-1960-StrategyOfConflict
    citation: "Thomas C. Schelling, *The Strategy of Conflict* (Cambridge MA: Harvard University Press, 1960), Ch. 2 'An Essay on Bargaining' (esp. pp.21-52 'The Threat'). Schelling's complementary treatment of commitment from the strategic-interaction side: 'the power to constrain an adversary may depend on the power to bind oneself; that, in bargaining, weakness is often strength, freedom may be freedom to capitulate, and to burn bridges behind one may suffice to undo an opponent.' Commitment in Schelling's sense is the voluntary-but-irreversible sacrifice of freedom-of-choice that makes a threat or a bargaining position credible to an OUTSIDE observer (adversary, counterparty), where Elster's pre-commitment operates against the FUTURE-SELF. The two together name the same structural shape — binding at t1 forecloses options at t2 — applied to two different epistemic problems (future-self credibility vs other-party credibility). The Schelling instance highlights the paradox at the core of the pattern: removing options can be a strategic gain precisely because it makes one's predicted-future-behavior legible and non-negotiable to the other side."
    quote: "[Schelling 1960 p.22:] '...the same tactic is illustrated by the burning of bridges behind oneself to persuade an adversary that one cannot be induced to retreat.' [p.22 on democratic ballot as commitment device:] 'Being stripped of his power to prove how he voted, he is stripped of his power to be intimidated. Powerless to prove whether or not he complied with a threat, he knows—and so do those who would threaten him—that any punishment would be unrelated to the way he actually voted.' [pp.24-25 the decisive general statement:] 'The essence of these tactics is some voluntary but irreversible sacrifice of freedom of choice. They rest on the paradox that the power to constrain an adversary may depend on the power to bind oneself; that, in bargaining, weakness is often strength, freedom may be freedom to capitulate, and to burn bridges behind one may suffice to undo an opponent.' [pp.10-11 on threats and commitment:] 'We have developed the idea of making a threat credible by getting ourselves committed to its fulfillment, through the stretching of a \"trip wire\" across the enemy's path of advance, or by making fulfillment a matter of national honor and prestige.' [the transferable corollary:] Schelling's commitment-tactics work when (i) the binding is *visible* to the adversary (a private bind has no credibility-effect), (ii) the binding is *irrevocable* by the binder (a revocable bind is no commitment), and (iii) the adversary is rational enough to update on the bind ('madmen, like small children, can often not be controlled by threats'). The diagnostic move is to ask which of (i)-(iii) is doing the strategic work, and which is failing in a commitment that is not landing."
canonical-instances:
  - "Homer's Ulysses (Odyssey XII): Ulysses predicts the Sirens' song will overwhelm his deliberative will and binds himself to the mast in advance, with explicit instructions to the crew not to release him even if he begs. The pact succeeds because the binding is causal-mechanical (rope) not deliberative (the t2-self cannot un-bind), the predicted future preference-shift is structurally certain (every sailor near the Sirens drowns), and the bind is timed to the moment of t1-clarity, not t2-passion."
  - "Constitutional pre-commitment: societies bind future legislatures via constitutional rules that are deliberately harder to amend than ordinary legislation — supermajority requirements, judicial review, entrenched-rights provisions. Elster 1979 Ch.II.1 explicitly extends his Ulysses-pact framework to constitutions; the structural identity is: t1-self (the founding moment) binds t2-self (the future majority) against predicted future passion-driven defection."
  - "Schelling burning-bridges (Strategy of Conflict p.22): a general who burns the bridges behind his army makes retreat physically impossible, raising the army's commitment-to-attack to credibility-conferring level. The adversary observes the binding and updates: no retreat is possible, so the threat to attack is irrevocable. The strategic gain comes precisely from the foreclosure of options the binder would otherwise prefer in some t2-states."
  - "AI-safety if-then commitments (Responsible Scaling Policies, Frontier Safety Frameworks, Preparedness frameworks): labs publicly pre-commit to specific responses if their AI systems cross specified capability thresholds (e.g., 'if model exhibits autonomous-replication capability above bar X, halt training until safety bar Y is met'). The structural shape is Ulysses-pact at organizational scale: t1-self (lab leadership at policy-adoption time) binds t2-self (lab leadership at threshold-crossing time, when economic incentive to keep going is maximal). The failure modes documented in the Hinton-feedback prior-art review (vague triggers, self-judged adherence, non-binding language) map directly onto Elster's conditions (i)-(iii) and Schelling's visibility-and-irrevocability requirements."
  - "Operationally distinct from lex-efv3v chosen-role-as-non-deliberation-gate: lex-efv3v's mechanism is INTERNAL — identity-anchored exclusion of certain options from the candidate-space (the Stoic does not deliberate about lying); lex-6tvr6's mechanism is EXTERNAL — causal-mechanical foreclosure of options regardless of whether they would enter the deliberation (Ulysses cannot un-tie himself even if he wants to). They compose (a public role-vow combines both) but are mechanistically distinct: lex-efv3v fails when the role-identity erodes; lex-6tvr6 fails when the binding-mechanism is reversible by the bound party. The diagnostic question: would the agent still hold the line if their identity-commitment dissolved? If yes, lex-6tvr6 (binding holds); if no, lex-efv3v (identity holds)."
  - "Operationally distinct from lex-v7ceq akrasia: lex-v7ceq is the *condition* (weakness of will: knowing the better and choosing the worse); lex-6tvr6 is the *structural rescue pattern* against predicted akrasia. lex-v7ceq names the problem; lex-6tvr6 is one of the responses. The previous lex-v7ceq lineage names Ulysses-pact as a tier-3 deepening; this atom upgrades the structural pattern to first-class status because it composes far beyond akrasia (adversarial credibility, constitutional self-restraint, organizational policy, addiction-medicine)."
  - "Operationally distinct from lex-k6wka Schelling focal-points: focal-points are coordination devices in pure-coordination games (no conflict — both parties want to meet); pre-commitment is a strategic device under conflict (binder gains by foreclosing options that would benefit the binder in some t2-states). Both are Schelling concepts; they sit in different cells of his game-theoretic taxonomy."
  - "Naturalized pre-commitment as failure mode: a binding that has slid from acknowledged-stipulation ('I committed to this; I am now executing the commitment') to naturalized-fact ('this is just how things are done') has lost its diagnostic visibility — the binding does deliberation-work it is no longer being checked for. Cross-link lex-cgqta: when a pre-commitment is naturalized, the question of whether the predicted t2-defection-pressure has *changed* (so the binding may now be over-restrictive) cannot be asked. The hygiene move is to keep the bind flagged as a chosen-binding, not a fact."
critical-questions:
  - "is the predicted future preference-shift structurally inevitable, or contingent? Elster's Condition (i): pre-commitment is rational only if the t2-self's predicted defection is genuine (Ulysses near the Sirens, the addict near the cigarette, the lab leadership near profitable-deployment-time). If the t2-pressure is hypothetical, the binding is preemptive paternalism without warrant."
  - "would the t2-self actually defect absent the bind? Elster's Condition (ii). Test: in the absence of the binding mechanism, do agents in t2-situation actually behave the predicted way? If not (the smoker would not relapse, the lab would not keep training), the binding is solving a problem that does not exist."
  - "does the binding's causal-force at t2 exceed the predicted t2-pressure? Elster's Condition (iii). Test: is the binding *reversible by the bound party at t2*? If yes, the binding is theatre — Ulysses-with-untieable-rope. For Schelling-side credibility commitments: is the binding *visible and verifiable to the adversary*? An invisible bind has no credibility-effect."
  - "what does the binding cost in t2-states where the predicted defection-pressure does NOT materialize? Pre-commitment is a tradeoff: gain robust execution under high-pressure t2, lose flexibility in low-pressure t2. If the bind is high-cost in surprise-low-pressure futures and the high-pressure future is uncertain, the expected-value calculation may not favor binding. (Constitutional rigidity vs. legislative responsiveness is the perennial example.)"
  - "who is the binder, and who is the bound — are they the same agent, or is one party binding another under cover of pre-commitment language? Elster Ch.II.1: 'the problem of binding oneself is also relevant for many questions in moral psychology (who has the right to bind whom?)' When the t1-self and t2-self are *politically* distinct (a founding generation binding a present one; current leadership binding future leadership; one corporate department binding another), the pre-commitment frame may be doing paternalism-by-temporal-displacement. The diagnostic: does the t1-self have legitimate authority over the t2-self's preferences?"
  - "is the pre-commitment naturalized (lex-cgqta) so the original stipulation is invisible? A pre-commitment that has become 'just how things are' has lost the diagnostic question 'should this still bind?' The hygiene is to keep bindings *flagged as bindings* with their stipulation-history attached; this is the lex-rsnn7 externalize-assumptions corrective at the organizational scale."
  - "where do practitioners over-apply this critique? Treating EVERY policy / commitment / rule as suspect-naturalized-pre-commitment is itself a failure mode (rule-skepticism-as-default). The atom flags *unargued* or *naturalized* bindings; it does not deny that some bindings are well-grounded and worth preserving. Honest application asks (i)-(iii) explicitly, not as gotcha but as audit."
  - "if the binding fails (the t2-self defects, the adversary fails to update on the commitment, the binding mechanism turns out reversible), what is the contingent-fallback? Pre-commitment with no Plan-B for binding-failure is brittle. Schelling's recognition that 'madmen, like small children, can often not be controlled by threats' generalizes: some t2-conditions are outside the binding's effective domain, and the structural design should include detection-and-fallback for those."
