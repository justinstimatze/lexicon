id: lex-2bbqf
name: false-name-sabotages-the-victims-own-truthful-alarm
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when you are about to place yourself at a decisive disadvantage relative to someone who could summon help against you, and you have a brief window BEFORE the confrontation to establish how you will be identified. Homer's Odyssey (Book IX) is the canonical case: trapped in the Cyclops Polyphemus's cave, Odysseus supplies wine until Polyphemus, pleased, asks his name and offers a gift in return. Odysseus answers: 'Noman is my name, my father and my mother gave it me, and Noman am I called by all my friends.' Only after this exchange is settled does Odysseus blind the sleeping Polyphemus. The other Cyclopes, woken by Polyphemus's screams, call from outside asking who is attacking him. Polyphemus's answer is completely truthful — 'Noman is killing me; by treachery Noman kills me; none by force' — and it is precisely because it is truthful that it fails: the other Cyclopes hear an ordinary sentence stating that no one is attacking him, conclude he is either raving or divinely afflicted, and depart without helping: 'If no man does thee violence, and thou art quite alone... make thy prayer to Father Neptune.' The cardinal move: the deception is not located in the moment of crisis at all — it was already completed earlier, when Odysseus planted a false identifier that happens to be grammatically identical to an ordinary negation. Once planted, Odysseus needs to tell no further lies; the victim's own subsequent, entirely honest testimony does the deceiving FOR him, because the victim has no way to know his attacker's name is also a sentence. This is distinct from lying in the moment of danger — it is pre-poisoning the victim's future vocabulary so that truth-telling itself becomes an unwitting accomplice to the deception."
related: [lex-9ty22, lex-d7h2y, lex-9pubz, lex-2rn8r, lex-6ts6x]
evokes: [homers-odyssey, polyphemus, cyclops, outis, noman-is-my-name, self-referential-alias, poisoned-vocabulary, the-victims-own-testimony-betrays-him, truthful-report-fails-to-summon-help]
lineage:
  - source: primary
    text: homer-odyssey-book-ix-polyphemus-noman
    citation: "Homer, Odyssey, Book IX, trans. William Cullen Bryant (1871; this ebook a later digitization of the same 1871 text; filename homer_the-odyssey_william-cullen-bryant_advanced.epub). The Polyphemus episode: Odysseus and his men are trapped in the Cyclops's cave; Odysseus plies Polyphemus with wine, gives his name as 'Noman' (a rendering of Greek Outis/Metis, the pun on 'no-man'/'no one'), then blinds the sleeping giant. Polyphemus's cry for help is truthfully answered by the other Cyclopes as no attack at all."
    quote: "'Thou hast inquired, O Cyclops, by what name / Men know me. I will tell thee, but do thou / Bestow in turn some hospitable gift, / As thou hast promised. Noman is my name, / My father and my mother gave it me, / And Noman am I called by all my friends.' [...] Then called he to the Cyclops who in grots / Dwelt on that breezy height. They heard his voice / And came by various ways, and stood beside / The cave [...] 'What hurts thee, Polyphemus [...] Hath any of the sons of men / Driven off thy flocks in spite of thee, or tried / By treachery or force to take thy life?' / 'Huge Polyphemus answered from his den:⁠— / O friends! 'tis Noman who is killing me; / By treachery Noman kills me; none by force' / Then thus with winged words they spake again:⁠— / 'If no man does thee violence, and thou / Art quite alone, reflect that none escape / Diseases; they are sent by Jove. But make / Thy prayer to Father Neptune, ocean's king.' / So spake they and departed. In my heart / I laughed to think that by the name I took, / And by my shrewd device, I had deceived / The Cyclops."
canonical-instances:
  - "The direct pattern-application template: before entering a confrontation where the opponent could call for outside help against you, establish your identifying label such that the opponent's own truthful report of the attack — spoken to a third party who was not present and has no independent way to check — will be misread as a non-event or a denial, rather than an alarm."
  - "'Nobody did it' / 'no one's fault' as a portable idiom-family for the same underlying move: a technically accurate statement about responsibility that is systematically misheard as an assertion that nothing happened, because the language used to name the responsible party is homophonic with ordinary negation."
  - "The two-stage structure as a template independent of the specific pun: STAGE 1 (before harm) — plant a false identifier while the target has no reason to scrutinize it, since nothing threatening has happened yet and the request ('tell me your name, that I may make a gift') is itself framed as benign. STAGE 2 (after harm) — do nothing further; let the victim's own unprompted, sincere report to bystanders do the work, since a lie told by the deceiver at this stage would be far more likely to be scrutinized than a truthful cry from the actual victim."
critical-questions:
  - "is this the same claim as lex-d7h2y (paltering-as-truth-arranged-to-deceive)? No — paltering requires the DECEIVER's own statements to be literally true and arranged to mislead the person they are speaking to. Here, Odysseus's foundational statement ('Noman is my name') is a straightforward FALSE statement, not a true one arranged cleverly — the deception is an ordinary lie. What makes this atom distinct from ordinary lying is that the payoff of the lie is not delivered by the liar at all: it is delivered later, by the VICTIM's own subsequent, entirely truthful statement, to a THIRD PARTY the liar never speaks to. Paltering is deceiver-truth-to-target; this atom is deceiver-lie-to-victim, then victim-truth-to-bystander. The mechanism and the person doing the (technically accurate) misleading speech-act are different."
  - "is this the same claim as lex-9ty22 (strategic-ambiguity)? No — strategic ambiguity is a SINGLE utterance, crafted by the strategist, that different audiences decode differently because the language itself supports multiple simultaneous readings, and the speaker benefits regardless of which reading each audience takes. Here, the audience (the other Cyclopes) has no live alternate reading available to them in the moment — they simply parse Polyphemus's sentence the only way ordinary grammar allows. The ambiguity was manufactured earlier and elsewhere, by a different speaker (Odysseus, in a wholly separate conversation), and by the time it fires, it is not perceived as ambiguous by anyone in the room — it reads as perfectly unambiguous, ordinary language. This atom's mechanism is delayed-fuse identity-poisoning, not live multi-reading language."
  - "does this technique require the specific Noman/no-man homophone, or does it generalize? It generalizes to any situation where an identifier can be selected, before the fact, such that its later truthful use in a report will be misparsed by someone unfamiliar with the identifier's status as a name — code names that coincide with common words or negations, usernames or aliases chosen to blend with system messages or error strings, self-designations chosen to be indistinguishable from a null/absence marker in whatever channel the eventual alarm will travel through. The Odyssey's version is the canonical, maximally-legible case because Greek Outis reads as 'no one' with no additional decoding required, but the underlying move is choosing your label for what it will do to the SYNTAX of someone else's future sentence, not for what it communicates about you now."
  - "what is the failure mode if the technique is detected before deployment, or if the victim gets a chance to clarify? Once the other Cyclopes have already departed on the strength of the misheard sentence, the technique is complete and largely irreversible within the scene — Polyphemus never gets a second chance to clarify, because by the time he might explain further, the immediate crisis (Odysseus's men escaping) has already resolved. The technique's robustness therefore depends heavily on the report being a single, urgent, one-shot communication under time pressure (a cry in the night) rather than an extended dialogue where the victim has room to notice and correct the misparse — a longer or lower-stakes exchange gives the 'Noman' name away almost immediately, since a follow-up question ('who is Noman?') would surface the trick."
