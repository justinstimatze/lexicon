id: lex-s3c3x
name: rule-out-projection-with-an-independently-timed-prior-measure
type-in: question
type-out: process
_tier: atomic
agent-instruction: 'When two contemporaneous self-reports move together — what someone believes about themselves, and what they believe a specific other person or group thinks of them — the correlation is genuinely ambiguous between two different causal stories, and ordinary cross-sectional data cannot tell them apart. Story one, reflected appraisal: the other''s actual view is shaping the person''s self-image. Story two, projection: the person''s own self-image is shaping their guess about what the other thinks, so the ''perceived-other'' report is really just an echo of the self-report and carries no independent information. Huntington faces exactly this with first-year medical students: those who thought patients saw them as doctors were much likelier to see themselves as doctors too, but she flags the ambiguity directly: ''Self-images appear, then, to be in part \"reflections\" of the expectations of others. As students are defined by their patients, so do they tend to define themselves. But we are on less than firm footing with this inference, because it is not based on reports from patients. The data might be interpreted in quite another way: as students define themselves so do they think patients define them. Other data in hand permit a rough test of this second interpretation.'' Her fix is to bring in an independently-timed PRIOR measure — the same students'' self-expectation, collected a year earlier, before any patient contact had occurred — and check whether it predicts the LATER perceived-other report. If projection were what generates the perceived-other report, students who already expected to feel like doctors should disproportionately end up believing patients saw them as doctors. It does not happen: ''These initial states of mind do not appear to have colored students'' impressions of the image which patients have of them. Of those who expected to play the role of doctor, 78 per cent felt, a year later, that they had been so defined by patients; of those who expected to play the role of student, almost exactly the same proportion, 77 per cent, felt that they had been defined, contrary to their own expectations, as doctors.'' That near-identity across the two starting groups weakens the pure-projection story. But the same prior measure DOES predict the final self-image strongly on its own: ''At the same time, self-confirming tendencies do appear when anticipated and actual self-images are compared. The majority—51 per cent—of the 41 students who had expected that they would feel more like doctors reported at the end of the year that they so defined themselves, compared with only 24 per cent of the 111 students who had anticipated that they would feel more like students than doctors.'' This shows a genuine self-confirming continuity in self-image that is separate from, and does not require, contamination of the perceived-other measure. Diagnostic move: when a self-report and a paired ''what-they-think-of-me'' report correlate and projection is a live alternative explanation, look for or collect a measure of the first variable taken BEFORE the episode that could have produced either effect, and check whether that early measure still predicts the second report. If it does not (rates converge across starting groups) while it does predict the first variable''s own later value, that is evidence the second report carries some independent information rather than being pure projection, even though the first variable is separately shown to be self-perpetuating.'
