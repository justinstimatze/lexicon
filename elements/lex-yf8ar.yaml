lineage:
  - source: practitioner
    text: dempsey-1974-how-to-repair-small-petrol-engines
    citation: "Paul Dempsey, How to Repair Small Petrol Engines (Slough, Bucks, England: Foulsham-Tab Limited, 1972 and 1974), back-cover synopsis."
    quote: "'The opening chapter deals with Basic principles and the final one gives advice on setting up a repair shop, but the rest of the text is arranged in a logical sequence based on the likelihood of faults -- those which practical experience has shown to occur most frequently are dealt with first and those which seldom happen are discussed last. Consequently the order of chapter headings is: ignition systems; fuel systems; electrical systems; engine service; power transmission; and accessories and controls.'"
canonical-instances:
  - "A hospital's differential-diagnosis checklist for chest pain lists the common causes (musculoskeletal strain, acid reflux, anxiety) ahead of the rare ones (aortic dissection, pulmonary embolism) for routine triage ordering, while still flagging the rare-but-lethal causes for immediate rule-out regardless of their position in the frequency-ordered list -- frequency sets the default search order, not the override for a cause whose cost of missing it is catastrophic."
  - "An on-call runbook for a web service lists 'check the deploy that went out an hour ago' and 'check the database connection pool' before 'check for a cosmic-ray bit flip in the load balancer,' because a review of the last two years of incidents shows the first two account for the overwhelming majority of pages, however more narratively satisfying the rare explanation would be to have found."
  - "A customer-support script has agents ask about the most common cause of a given complaint first (a setting the customer changed by accident) rather than the rarest (a server-side data-corruption bug), because escalating straight to the rare explanation wastes the support team's time on the large majority of tickets where the mundane cause was actually the answer."
critical-questions:
  - "How was the frequency table itself built, and does it stay current? A troubleshooting order tuned to faults common in an older generation of a system silently misdiagnoses a newer generation whose actual fault distribution has shifted -- frequency-ordering a search is only as good as the track record it's drawn from, and that record can go stale exactly when the underlying system changes."
  - "When does frequency-first ordering actively cost more than it saves? A rare cause that is catastrophically expensive to miss (Dempsey's own book still has to cover ignition failures that stall an engine outright, and those sit alongside far more mundane, merely-annoying faults) may need to be checked early regardless of its low base rate. The ordering this atom recommends minimizes expected search cost; it only tracks worst-case cost as well when every candidate cause happens to be roughly as costly to miss as the others."
