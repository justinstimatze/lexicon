id: lex-4s9ry
name: controlling-a-recurring-mental-pattern-needs-practice-and-released-craving
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Patanjali's Yoga Sutras define yoga as restraining the mind-stuff from taking on its habitual fluctuations, and then name exactly two mechanisms for achieving that restraint, presented as a pair rather than as alternatives: practice and non-attachment. Practice (abhyasa) is the 'continuous struggle to keep them perfectly restrained' -- repeated, sustained effort that 'becomes firmly grounded' only after 'long constant efforts,' never from a single act of will. Non-attachment (vairagya) gets a precise definition that stops short of suppression: 'that effect which comes to those who have given up their thirst after objects either seen or heard, and which wills to control the objects.' Read that definition closely: the will to control the object stays intact, and the only thing removed is the craving toward it, the 'thirst.' The text treats these as jointly necessary, not as two paths to the same result. Practice without non-attachment tends to look like white-knuckled suppression -- restraining behavior while the underlying pull toward the object remains fully intact, which is exactly the state primed to snap back the moment vigilance lapses. Non-attachment without practice is a one-time insight or mood that never gets consolidated into a stable default, so the old pattern resumes as soon as the insight fades. Transferable move: when trying to change a recurring mental or behavioral pattern -- a compulsive checking habit, a reactive anger response, a craving -- ask separately whether you have (a) sustained, repeated practice at the new response, done consistently over real time rather than as an occasional effort, and (b) done the separate work of releasing the underlying pull toward the old object, rather than just gritting through exposure to it. A plan that only supplies one of the two is missing a mechanism the other doesn't substitute for."
related: [lex-v2dps, lex-8q7zk]
evokes: [patanjali-yoga-sutras, vivekananda-1896-raja-yoga, yutang-1942-wisdom-of-china-and-india, abhyasa, vairagya, practice-and-non-attachment, chitta-vritti-nirodhah, two-levers-not-one]
