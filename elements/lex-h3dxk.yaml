id: lex-h3dxk
name: an-authority-backed-arbitrary-boundary-restrains-a-crowd-until-one-crossing-voids-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A person trying to stop a crowd from following them, having found that pleading fails, can invoke the formal authority they still hold to draw an arbitrary line and threaten punishment for crossing it — obedience to the marker itself succeeds where persuasion did not, but the boundary''s power is total only until someone actually breaks it, at which point everyone behind them treats the line as already void. In the Jataka''s tale of Mahajanaka, the departing king draws a line across the road with his staff and orders his own line-guardians to punish any trespasser: "No one was able to violate that line; and the people, standing behind that line, made loud lamentation. The queen also being unable to cross that line, and beholding the king going on with his back turned towards her, could not restrain her grief, and beat her breast, and, falling across, forced her way over the line. The people cried, ''The line-guardians have broken the line,'' and they followed where the queen led."'
related: []
evokes: [jataka, mahanipata, mahajanaka-jataka, boundary-enforcement, crowd-restraint, precedent-collapse]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-mahajanaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 539, Mahajanaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "No one was able to violate that line; and the people, standing behind that line, made loud lamentation. The queen also being unable to cross that line, and beholding the king going on with his back turned towards her, could not restrain her grief, and beat her breast, and, falling across, forced her way over the line. The people cried, \"The line-guardians have broken the line,\" and they followed where the queen led."
canonical-instances:
  - "A picket line holds a crowd back through the sheer social force of the marked boundary long after individual appeals to stay off company property have failed — until one person crosses under enough personal pressure, and within minutes the rest of the crowd treats the line as already broken and follows."
  - "A store manager tapes off a section of the sale floor and tells the waiting line no one enters until the doors officially open; the line holds until one customer slips under the tape when a staffer looks away, and the whole crowd surges through behind them."
critical-questions:
  - "The line worked because the king still held enough residual authority to threaten punishment even as he was actively renouncing that authority — how does this move fail once the boundary-setter has fully relinquished the power to enforce it?"
  - "Once the queen's transgression voids the line for everyone, is that because the boundary's authority was always borrowed from being unbroken rather than from any actual threat, or because the crowd specifically reads a superior's crossing as license?"
status: active
