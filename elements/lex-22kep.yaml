scaffolds-from: [lex-wtkuz, lex-6qevt, lex-3ezh8, lex-44byg, lex-qg68a]
evokes: [sexual-harassment-before-the-term-existed, carmita-wood-1975, gap-in-collective-hermeneutical-resources, name-it-to-tame-it, you-cannot-testify-to-what-cannot-be-said, fricker-2007, the-dominant-named-it-first]
lineage:
  - source: primary
    text: Fricker-2007-EpistemicInjustice
    citation: "Miranda Fricker, *Epistemic Injustice: Power and the Ethics of Knowing* (Oxford UP 2007). Ch.7 develops the hermeneutical-injustice form. Fricker's core operational definition: hermeneutical injustice occurs when a structural prejudice in the economy of collective hermeneutical resources puts a subordinated speaker at an unfair disadvantage in making sense of their social experiences. The harm is UPSTREAM of testimonial injustice — even if the speaker had perfect uptake from a hearer, there is no concept available to do the testifying with. The canonical example: women experiencing workplace sexual harassment before the term existed (coined 1975 by Lin Farley and collaborators at Cornell working with Carmita Wood after Wood's 1974-75 unemployment-benefits case). Wood had been driven from her job by her supervisor's unwanted advances; she lacked the vocabulary to explain why she had left, and the unemployment office refused her claim because she 'left for personal reasons.' The experience was real and structurally widespread, but the collective interpretive resources had no concept for it. Once Farley's working group coined the term, the same experiences became namable and testifiable. Transferable primitive: when the collective interpretive resources have a structural gap that affects subordinated experiences specifically, the resulting sense-making failure is hermeneutical injustice."
    quote: "[Fricker 2007 Ch.7 'Hermeneutical Injustice', the central definition:] 'hermeneutical injustice is caused by structural prejudice in the economy of collective hermeneutical resources.' [A gloss ran on from here about a central case of this kind of epistemic injustice stemming from a gap in collective hermeneutical resources. It was not Fricker's wording and is dropped: that phrase occurs zero times in the book. What she writes next is:]'The overarching aim is to bring to light certain ethical aspects of two of our most basic everyday epistemic practices: conveying knowledge to others by telling them, and making sense of our own social experiences.' [On the harassment-before-the-term canonical example:] 'you suffer sexual harassment in a culture that still lacks that critical concept. We might say that testimonial injustice is caused by prejudice in the economy of credibility; and that hermeneutical injustice is caused by structural prejudice in the economy of collective hermeneutical resources.' [On the structural-not-individual character:] 'While hermeneutical injustice is not perpetrated by individuals, it [is suffered by individuals] whose communicative labours are hampered by hermeneutical injustice... the speaker [suffers] owing to a gap in collective hermeneutical resources. That is, the sense-making failure is a function of a collective hermeneutical impoverishment.' [Transferable inference: when an experience cannot be made-sense-of within available interpretive resources, the first question is whether the gap traces to individual articulation-failure or to structural-resource-failure. The diagnostic: do other people in the same structural position have the same sense-making failure? If yes, the gap is collective hermeneutical injustice.]"
  - source: discovery-loop
    text: pass-d-negative-space-broadening-
    citation: "(companion mint to lex-a3tfj). Substrate audit: lex-wtkuz descriptive→operational (Walton) is about the GENERAL move; lex-22kep names the specific structural-gap-in-interpretive-resources claim. lex-pm93k cultural-classification (Morgan) covers how cultural classifications vary; doesn't name what happens when a needed classification is ABSENT. lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (Mendeleev) covers natural-science classification gaps as predictive; lex-22kep is about social-classification gaps blocking experience-articulation. The Fricker-specific contribution — naming the collective-hermeneutical-resource-gap as a structural epistemic harm distinct from testimonial injustice — was absent from substrate."
    quote: "[substrate-audit notes:] Transferable applications: workplace harassment categories (sexual harassment 1975; mobbing 1980s; microaggressions 1970-2007), medical-syndrome naming (chronic fatigue syndrome / ME pre-naming; fibromyalgia pre-naming; long COVID 2020-2021), domestic-violence categories (coercive control 2008+ Stark; gaslighting 1944+), identity categories (non-binary; asexual; aromantic), programming bug categories (memory leak, race condition — each was once unnamed and unnamable). Transferable shape: COLLECTIVE NAMING is the operational fix for hermeneutical injustice."
canonical-instances:
  - "The sexual harassment canonical case (Lin Farley + Carmita Wood + Cornell working group 1975, anchored in Fricker 2007 Ch.7): Wood's 1974-75 unemployment-benefits case was denied because she could not explain why she had left her job — her supervisor's unwanted advances and the structurally-coercive workplace dynamics had no name. Farley's working group coined 'sexual harassment' to fill the gap. Within years the term became operational in legal doctrine (Williams v Saxbe 1976; Meritor v Vinson 1986 SCOTUS). An entire generation of women had suffered the same structural arrangement IN SILENCE because the collective interpretive resources had no concept for it."
  - "The coercive control canonical case (Evan Stark 2007 *Coercive Control*; UK Serious Crime Act 2015): pre-2007 domestic-violence vocabulary was overwhelmingly about discrete physical assaults; the broader pattern of psychological / economic / surveillance / isolation control was unnamed and structurally-invisible despite being widespread. Stark's 2007 conceptualization filled the gap; UK criminalized coercive control specifically (2015), and survivors became able to articulate the structural harm."
  - "The microaggressions canonical case (Chester Pierce 1970; Derald Wing Sue 2007 *Racial Microaggressions in Everyday Life*): the cumulative effect of small daily race-based slights had been experienced for centuries by people of color but had no operational name distinct from 'rudeness.' Pierce and Sue named the cumulative-low-amplitude harm and the concept allowed previously-unnamable experiences to become articulable."
  - "The long COVID naming canonical case (2020-2021): patient communities (often led by women with prior ME/CFS organizing experience) coined 'long COVID' in mid-2020 to name the post-acute multi-system condition that mainstream medicine initially dismissed. The naming was bottom-up via Twitter / Slack communities (Body Politic; Patient-Led Research Collaborative) before institutional medicine accepted the term. Once named, NIH funding + research + clinical recognition followed. Transferable: the naming moment is the inflection-point where a structurally-invisible experience becomes a structurally-tractable category."
  - "The gaslighting canonical case (Hamilton 1938 *Gas Light* play → 1944 film → Bernard et al. 1969 first sociological use → mainstream 2000s+): the pattern of deliberately destabilizing someone's perception of reality had been a discrete tactical move in abusive relationships for centuries without a name. The Hamilton play coined the metaphor; sociologists picked it up; by 2010s mainstream domestic-violence and workplace-abuse literatures had 'gaslighting' as standard vocabulary."
  - "The non-binary / asexual / aromantic identity naming canonical case (2000s-2020s): cumulative coining of identity categories (non-binary 2000s+; asexual via AVEN 2001+; aromantic 2005+; demisexual 2006+) filled collective-resource gaps. Pre-naming, individuals reported feeling broken or alone; post-naming, the same individuals reported finding community + structural-recognition."
  - "Programming bug-category naming canonical case (transferable cross-domain attestation): 'memory leak,' 'race condition,' 'off-by-one error,' 'N+1 query problem,' 'thundering herd,' 'cache stampede' — each was once unnamed and unnamable, each was experienced repeatedly by programmers who lacked the operational vocabulary to name and prevent it. The naming-moment for each enabled the failure-mode to become structurally-tractable."
  - "operationally distinct from lex-a3tfj testimonial-injustice (companion mint, Fricker 2007 Ch.1): testimonial injustice operates AT THE MOMENT of speech-uptake — testimony exists but is discounted. Hermeneutical injustice operates UPSTREAM — the collective interpretive resources are insufficient to make the experience articulable as testimony in the first place. Sister atoms; co-fire when BOTH operate. The Carmita Wood case is the canonical co-fire: pre-1975, Wood's experience could not be named (hermeneutical injustice); when she did try to articulate it, the unemployment office discounted her (testimonial injustice)."
  - "operationally distinct from lex-wtkuz descriptive→operational (Walton): lex-wtkuz is the GENERAL move from descriptive concepts to operational ones. lex-22kep is the SPECIFIC SOCIAL-EPISTEMIC pattern where a gap in collective resources blocks experience-articulation specifically because of structural prejudice."
  - "operationally distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (Mendeleev): lex-3d2he names how gaps in a classification-system can be predictive in science (Mendeleev's gaps predicted gallium, germanium, scandium). lex-22kep names the social-epistemic case where the gap blocks experience-articulation rather than predicting determinate entities."
  - "operationally distinct from lex-pm93k cultural-classification-bundles-or-splits-natural-substrate (Morgan): lex-pm93k covers how cultural classifications vary across cultures. lex-22kep names what happens when a needed classification is structurally ABSENT due to the dominant position controlling the substrate."
  - "operationally distinct from lex-6qevt lived-position-as-irreplaceable-epistemic-substrate (Cooper, Truth): lex-6qevt names that any structural position has irreplaceable epistemic content. lex-22kep names the specific structural-harm when the dominant interpretive substrate fails to make space for that content."
critical-questions:
  - "is the sense-making failure individual or collective? The atom's cardinal diagnostic. If only this one person is failing to make sense of the experience, the failure may be individual articulation-difficulty. If many similarly-positioned people report the same sense-making failure, the gap is collective and the atom fires. Poll the structurally-similar population — do they share the gap?"
  - "is the gap structural-prejudicial or structural-neutral? Some gaps in collective vocabulary are random or innocent. Hermeneutical injustice requires the gap to track structural-power-asymmetry: the dominant position has rich vocabulary for the dominant experience, the subordinated position has sparse-to-absent vocabulary for the subordinated experience of the same domain. Name the structural-power-asymmetry that produced the gap."
  - "what would the naming-moment look like? The atom predicts that the operational fix for hermeneutical injustice is COLLECTIVE NAMING — typically initiated by the subordinated population in conversation with allies (Wood + Farley's working group; Stark on coercive control; long-COVID patient communities; Pierce + Sue on microaggressions). What would the name look like, and what coalition would be needed to make it stick?"
  - "is the experience real even without a name? The atom claims yes — the experience exists prior to its naming (Wood's harassment was real before 1975; long COVID was real before the term). The naming makes the experience COLLECTIVELY ARTICULABLE, not real. When encountering a population reporting unable-to-name experiences, take the experiences as real and look for the structural-resource gap rather than dismissing them as confused."
  - "the cross-fertilization with lex-a3tfj testimonial-injustice: when both atoms fire (Wood case canonical), the operational response is two-stage: (1) name the experience to fill the hermeneutical gap (creates testifiable category); (2) ensure the testimony gets fair credibility-uptake. Skipping stage 1 leaves the harm structurally-invisible; doing stage 1 without stage 2 produces named but discounted testimony."
  - "the LLM/AI-design application: AI systems trained on text corpora inherit the collective-hermeneutical-resources of the training distribution — including its gaps. When a user attempts to articulate an experience that lacks vocabulary in the training distribution, the system may dismiss / pathologize / fail-to-recognize the experience because the operational categories aren't there. When designing AI systems for support / counselling / patient-history-taking / claim-evaluation contexts, surface where the model's available vocabulary maps onto structurally-dominant experiences and gaps where subordinated experiences cannot be articulated within the model's frame."
