    quote: "The Wolf is in the habit of seizing what he wants and running off with it without paying, and you, too, can run much faster than I. So how shall I be able to come up with either of you when the debt falls due?"
canonical-instances:
  - "a lender requiring a co-signer who shares the same financial-recklessness profile as the primary borrower, providing zero incremental security even though the paperwork formally lists two names on the obligation instead of one."
critical-questions:
  - "How would the sheep verify, before agreeing, whether a proposed guarantor's risk is genuinely independent of the principal's, given that the correlation may not be obvious from the guarantor's own reputation alone?"
  - "Does a guarantor need to be fully independent to add any value, or is there a useful middle ground where partial independence still improves the sheep's odds of recovering something, even if not full security?"
