id: lex-q5grg
name: a-tactic-that-destroys-the-prize-is-not-a-win
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When weighing a tactic that would guarantee victory over a rival or obstacle, don't evaluate it only by whether it works -- check whether it also destroys the thing you were actually trying to end up with, since a tactic that wins the contest while ruining the prize has solved the wrong problem. Kautilya explicitly rejects burning a besieged fort as a siege tactic despite its effectiveness: 'Setting fire to the fort... is a possibility but this is not recommended for there is little to be gained by conquering ashes.' The same logic governs how he treats the conquered population more broadly -- even amid tactics designed to terrify and depopulate an enemy's territory, he insists there shall be no permanent loss of population from land the conqueror intends to rule, stating flatly: 'there cannot be a country without people and there is no kingdom without a country.' Both cases share the same structure: the goal was never 'defeat the enemy' as an end in itself, it was 'end up ruling a functioning kingdom' -- and a tactic evaluated only against the first goal can look like a clean win while completely failing the second, because destroying the fort or emptying the land removes the very thing the whole campaign was for. This is a distinct failure from merely a costly win -- a costly win still leaves you with the prize, just expensively; this failure mode leaves you having 'won' a contest whose object no longer exists. Diagnostic move: before adopting a tactic that would guarantee a decisive victory, ask explicitly what you actually want to be true once the contest ends -- not just 'the other side loses' but the substantive thing that loss was supposed to secure -- and rule out any tactic, however effective, that gets you the first without preserving the second."
