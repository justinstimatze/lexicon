canonical-instances:
  - "A company watching two struggling business units for morale risk assumes the lower-paid, more overworked team is the greater flight or unionization risk, but that team's manager is widely loved and trusted, so grievances there get reinterpreted charitably ('she's doing her best with what corporate gives her') and never convert to organized action, while a better-compensated team with a distant, disliked manager is already organizing quietly -- the material hardship ranking gets the actual risk backwards."
  - "A political party assumes a poor rural constituency is its most vulnerable base for an opposition's outreach, but the constituency's long personal loyalty to its incumbent representative (a halo effect built over decades) makes poverty-based appeals bounce off, while a wealthier suburban district whose representative is already seen as having betrayed a promise is the one that actually flips."
critical-questions:
  - "how would an outside party distinguish genuine, durable love-based loyalty from a temporarily quiet resentment that simply hasn't yet found its instigator -- does treating 'still loyal despite poverty' as settled evidence risk missing a slow-building betrayal that just needs a better pitch?"
  - "does 'love' as Kautilya frames it require the leader to have actually earned it through some observable justice or care, or can pure charisma or long habituation produce the same halo effect even toward a leader who is genuinely harming the group -- and if the latter, does this principle risk validating exploitative arrangements as stable simply because affection happens to be present?"
  - "is manifest rebellion always the more reliable signal, or could a rebellion be shallow and reversible (a temporary flare-up over one incident) while an unaddressed poverty grievance quietly deepens into something more durable once the current affection eventually wears thin -- does the debate's binary framing miss cases where the trajectories are heading in opposite directions from their current state?"
