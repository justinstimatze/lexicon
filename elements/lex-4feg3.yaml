lineage:
  - source: primary
    text: kautilya-arthashastra-varna-composition-brahmin-troops-vulnerability
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Military Organization,' 'Varna Composition,' {9.2.21-24}."
    quote: "'Kautilya disagrees. An enemy may win over Brahmin troops by prostrating himself before them. It is better to have either an army composed of Kshatriyas trained in the use of weapons or a Vaishya or Sudra army with a large number of men.'"
canonical-instances:
  - "A company that grants system access based on executive seniority rather than verified security training creates a target an attacker can exploit with a well-crafted authority-deferring pretext -- a scammer posing as a compliant subordinate or invoking an executive's own claimed urgency -- where an access policy based on tested security awareness would have no equivalent trigger."
  - "A protocol that automatically grants diplomatic vehicles unchallenged passage through a checkpoint creates a known gesture (displaying diplomatic plates) that anyone can perform to bypass the same scrutiny an ordinary vehicle would face, regardless of what's actually inside."
critical-questions:
  - "does avoiding all status-based, deference-triggering roles come at a real cost when status genuinely correlates with legitimate authority or trust that the situation actually needs -- is the framework recommending discarding a useful signal just because it's also exploitable?"
  - "how does an organization actually detect, in advance, which of its status-based rules carry a known, exploitable trigger versus which are benign -- is the Brahmin-prostration case unusually clean because the norm was overt and widely known, when many real-world deference rules are murkier and harder to identify as vulnerabilities before they're exploited?"
  - "does replacing status-based selection with competence-based selection introduce its own new vulnerabilities (competence is harder to verify quickly, credentials can be faked, tests can be gamed) that this framework doesn't weigh against the deference-trigger risk it's warning about?"
status: active
