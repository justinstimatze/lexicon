id: lex-5au8b
name: felt-necessity-to-fixate-on-a-fast-target-can-be-false
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a fast-paced tracking task feels like it requires locking your eyes directly onto the moving target — a ball, a cursor, a live data feed — don't trust that felt necessity as evidence you actually need direct fixation. Sudnow believed for ten days that Breakout's fast 'slam' shots required gluing his eye to the ball, the 'time-honored method' for a tight coordination problem at speed. He tested it directly: taped over the paddle, then fixed his gaze on a static point at the screen's edge and played entirely in peripheral vision. It worked, including on the fast shots he'd assumed demanded direct tracking. The lesson isn't 'use peripheral vision' as a technique — it's that the subjective sense of needing a particular attentional allocation is not reliable data about what the task actually requires, and the only way to find out is to deliberately withdraw the presumed-necessary channel and see what still works."
related: [lex-y53nq]
evokes: [gluing-your-eye-to-the-ball, peripheral-vision-experiment, quiet-eye, felt-necessity-vs-actual-requirement, testing-your-own-assumptions-about-perception]
lineage:
  - source: primary
    text: sudnow-1983-eyeball-peripheral-test
    citation: "David Sudnow, Pilgrim in the Microworld: Eye, Mind and the Essence of Video Skill (Warner Books, 1983), reissued as Breakout: Pilgrim in the Microworld (Boss Fight Books, 2019), chapter 'Eyeball.' Sudnow's own deliberate experiment: taping over the visible paddle path, then deliberately fixing his gaze on a static edge of the screen rather than tracking the ball, to test whether direct visual fixation was actually required to return fast shots."
    quote: "'I took off the tape and fixed my gaze right where the barricade touches the edge of the screen on the right, stared intently there without moving my eyes, and served a shot. I returned it. In fact I could play through a long volley gluing my eye away from the ball. Peripheral vision sufficed. Then came a slam, and my eyes were still experimentally riveted on this edge of the field. How do you like that! I returned it, and the next and the next, handling several fast balls without moving my eyes.'"
  - source: primary
    text: sudnow-1983-eyeball-ten-days-convinced
    citation: "David Sudnow, Pilgrim in the Microworld (1983 / Boss Fight Books 2019), chapter 'Eyeball.' Sudnow's own retrospective naming of what the experiment overturned: a belief held and acted on for ten days of play, treated as self-evident until directly tested."
    quote: "'For ten days I'd been convinced you had to fixate tightly to handle fast shots, the time-honored method for dealing with a tricky coordinational problem at a fast tempo. And I'd played that phase of Breakout frantically sitting still. With slow balls I tried to find targets, control shots, to aim. With slams I dared not take my eye off the ball long enough to see where I was going, just hung in there waiting to cave in. My little test for peripheral vision came as a surprise. You could in principle aim the ball right through the fast phase, from front to finish, stay right in there playing all the way, handling fast action and long range vision as well. Looking could stay mobile, thinking expansive, the eyes could plan.'"
canonical-instances:
  - "A goalkeeper convinced they must stare directly at a penalty-taker's foot to react in time may perform just as well, or better, watching the hips and torso peripherally while fixing gaze elsewhere — the felt need for direct fixation and the actual information source for the save are not the same thing."
  - "A new driver white-knuckling the wheel and staring fixedly at the car directly ahead often drives worse than one using peripheral awareness of the whole lane; the felt safety of direct fixation doesn't track the actual perceptual requirement for safe following distance."
  - "operationally distinct from lex-y53nq widening-the-gaze-trades-visual-detail-for-reading-intent: lex-y53nq is a prescriptive strategic choice — deliberately keep a broad gaze in an adversarial context because reading an opponent's overall intent requires it. This atom is not prescriptive and not adversarial: Breakout has no opponent (see lex-a7jn2), and the claim is narrower and more epistemic — a felt subjective necessity for a specific attentional strategy can simply be wrong, discoverable only by testing it directly, not by choosing a better strategy on purpose."
critical-questions:
  - "How much of 'felt necessity' failures like this one are general (the belief was never load-bearing) versus partial (some direct fixation was needed, just less than believed, or at a different moment than believed)? Sudnow's own test targeted a specific claim — direct-eye-on-ball for slams — cleanly enough to falsify it outright, but not every felt-necessity claim will be that separable from what it's bundled with."
  - "What made Sudnow willing to run the experiment rather than just accept the felt necessity as fact? He was already deep in obsessive self-experimentation with an unusual tolerance for methodologically deliberate self-testing (blindfolding, mouth-operating the controls elsewhere in the same book) — is willingness to test one's own perceptual assumptions itself a trainable disposition, or does it require an unusual starting motivation?"
  - "Does the felt necessity ever serve a real function even when it's not perceptually required — e.g., does believing you need to fixate change effort or arousal in a way that happens to help, independent of the fixation itself doing anything?"
status: active
