name: a-loyalty-test-can-reveal-which-apparent-opposite-is-the-true-intimate
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Two forces that look like adversaries -- fixed necessity and pure chance, order and disorder, destiny and accident -- can turn out to be each other's closest and most loyal companions, and a staged crisis that separates genuine attachment from opportunistic association is what reveals it, because ordinary observation of two 'opposed' things gives no way to see which relationships around them are real. A Yoruba folktale stages exactly this test: Ifa, the deity of destiny, fakes his own death to learn who his true friends are. 'False friends immediately appeared at the house, trying to get something for themselves from the estate; only Eshu was truly heartbroken and wanted nothing.' Eshu, the trickster of chance and accident, is Ifa's supposed opposite -- 'Ifa's character was destiny, and Eshu's character was accident' -- and yet he is the only one whose grief is real. Hyde draws the conclusion directly: 'It would seem that accident is fond of destiny, and uncertainty is certainty's intimate companion.' The people who looked aligned with Ifa while he was successful and secure turn out to have been drawn by what he could give them, not by attachment to him; the one figure who looked structurally opposed to him turns out to be bound to him in a way self-interest cannot explain. Diagnostic move: when you want to know whether two things that look opposed are actually adversarial or are secretly interdependent, look for or create a moment that separates real attachment from opportunistic proximity -- a crisis, a apparent loss, a moment when supporting the 'losing' side costs something -- since ordinary observation under stable conditions can't distinguish genuine complementary relationship from mere convenient alignment."
