lineage:
  - source: primary
    text: skinner-1996-reason-and-rhetoric-in-hobbes
    citation: "Quentin Skinner, *Reason and Rhetoric in the Philosophy of Hobbes* (Cambridge University Press, 1996). Introduction (pp.1-4) frames the book's whole argument around Hobbes's documented change of mind: The Elements of Law (1640) and De Cive (1642) reject the humanist union of reason and rhetoric inherited from Cicero's De Inventione, insisting that valid demonstration is self-sufficient to compel assent and that persuasion has no legitimate place in teaching; Leviathan (1651), further extended in the Latin Leviathan (1668), reverses this and reconstructs the humanist position that reason's findings are practically inert ('small Power') unless joined to 'powerfull Eloquence.' Chapter 7 ('Hobbes's Rejection of Eloquence', pp.250-284) documents the early rejection in detail, including the De Cive epistle dedicatory's explicit renunciation of ethos-establishment. Chapter 9 ('Hobbes's Reconsideration of Eloquence', pp.327-356), section 'The Indispensability of Eloquence' (pp.343-356), documents the reversal in detail, including the Leviathan ch.10 and ch.25 formulations and the review-and-conclusion passage (Leviathan p.483) that states the two-component thesis explicitly. The book's own conclusion (pp.426-437) is devoted entirely to the question 'Why did Hobbes change his mind?' — treating the reversal as the book's central historical fact requiring explanation, not an incidental detail."
    quote: "[Skinner's Introduction (p.3-4), summarising the early rejection in The Elements of Law, 1640:] 'He maintains that, so long as we reason aright from premises based in experience, we shall be able not merely to arrive at scientific truths, but to teach and beget in others exactly the same conceptions as we possess ourselves. He denies, however, that it will ever be necessary to employ the arts of persuasion to bring about these results. He insists that persuasion must be categorically distinguished from teaching, and that the arts of persuasion have no legitimate place in the process of teaching at all. This is because the methods of recta ratio, and hence the procedures of all the genuine sciences, serve in themselves to dictate the acceptance of the truths they find out. They supply us with demonstrations evident to the meanest capacity, giving rise to conclusions that admit of no controversy and cannot possibly be gainsaid.' [Hobbes's own words for the same early position, De Cive epistle dedicatory 1642 (Ch.7 'The attack on inventio', p.259):] 'there is a certain thread of reason which, when we are guided by it, serves in itself to bring us to the clearest light' — and, at the exact point where classical rhetoric would have him establish his own ethos, Hobbes instead praises his dedicatee for refusing to pay attention to 'such matters as the reputation of writers, the alleged novelty of their arguments, or the outward splendour of their style,' reserving admiration 'not for the status of authors but for the firmness of their arguments themselves.' [Skinner's Introduction (p.3-4), announcing and summarising the reversal in Leviathan, 1651:] 'If we turn from these pronouncements of 1640 to the Leviathan of 1651, we encounter a remarkable change of mind — a change of mind later consolidated and even extended in the Latin Leviathan in 1668. Hobbes now endorses in large measure the humanist analysis of the relations between reason and rhetoric which he had earlier sought to challenge and supersede. He acknowledges that \"the Sciences are small Power\", and cannot hope in themselves to persuade us of the findings they enunciate. He accepts in consequence that, if reason is to prevail, we shall need to supplement and enforce its findings by means of the rhetorical arts.' [Ch.9 'The Indispensability of Eloquence' (p.351-352), on Leviathan ch.10:] '\"The Sciences are small Power\", he now concedes, but \"Eloquence is Power\", and is indeed to be numbered among the most eminent faculties of the human mind.' [Ch.9 (p.351-352), quoting Leviathan p.483 in full — the core statement of the two-component thesis, which Skinner calls 'Hobbes's volte face':] 'In all Deliberations, and in all Pleadings, the faculty of solid Reasoning is necessary: for without it the Resolutions of men are rash, and their Sentences unjust: and yet if there be not powerfull Eloquence, which procureth attention and Consent, the effect of Reason will be little. But these are contrary Faculties; the former being grounded upon principles of Truth; the other upon Opinions already received, true, or false; and upon the Passions and Interests of men, which are different and mutable.' [Ch.9 (p.350), Hobbes's own diagnosis of why demonstration fails to move an audience, Leviathan ch.2, p.74 — the geometry-suppression thought experiment:] 'I doubt not, but if it had been a thing contrary to any mans right of dominion, or to the interest of men that have dominion, That the three Angles of a Triangle, should be equall to two Angles of a Square, that doctrine should have been, if not disputed, yet by the burning of all books of Geometry, suppressed, as farre as he whom it concerned was able.' [Skinner's Introduction (p.2-3), on the classical (Ciceronian) formulation of the union of reason and eloquence that the young, humanist-formed Hobbes had first absorbed, then rejected, then re-embraced — Cicero, De Inventione I.1.1:] '\"Wisdom in itself is silent and powerless to speak\", so that \"wisdom without eloquence cannot do the least good for cities\". We can thus be sure that \"cities were originally established not merely by the ratio of the mind, but also, and more readily, by means of eloquentia\"... The need for rhetoric stems from the fact that, as Cicero repeatedly emphasises, reason lacks any inherent capacity to persuade us of the truths it brings to light. This is why the persuasive force of eloquence must always be added if reason is to be empowered and given effect.'"
  - source: discovery-loop
    text: distinctness-audit-skinner-hobbes-reason-rhetoric
    citation: "Lex-0662 (enthymeme-the-persuasive-syllogism-with-suppressed-premise) and lex-bkaum (pisteis-ethos-pathos-logos-as-three-independent-proof-channels) are both grounded in the same Aristotle Rhetorica Book I Ch.2 source. Lex-0663 is a taxonomy of three independent persuasive channels (ethos/pathos/logos), usable to decompose the channel-balance of any persuasive artifact; this atom is a narrower, sharper claim specifically about the insufficiency of the logos channel alone, however strong, evidenced not by a general theory but by Hobbes's own twice-reversed, historically documented change of mind. Lex-0242 (reason-as-slave-of-passions-instrumental-only, Hume) is also genuinely distinct: Hume's is a general metaphysical and architectural claim about any individual agent's psychology — that reason cannot originate motivation for any agent, full stop — while this atom is a narrower, practical and rhetorical claim about an arguer's efficacy in winning an audience's assent in civil and political life, historically documented rather than metaphysically derived."
canonical-instances:
  - "Hobbes's own documented reversal itself, which IS the primary source's own argument structure and the strongest canonical instance available: The Elements of Law (1640) and De Cive (1642) reject the arts of persuasion as illegitimate in teaching, insisting recta ratio alone 'dictates the acceptance of the truths it finds out'; Leviathan (1651), extended in the Latin Leviathan (1668), reverses this and states 'if there be not powerfull Eloquence, which procureth attention and Consent, the effect of Reason will be little' — an expert holding the opposite position first, on principle, and revising it based on the practical failure of pure demonstration to move people."
  - "the geometry-suppression thought experiment (Leviathan ch.2, p.74): even a truth as maximally demonstrable as a fact of geometry ('the three Angles of a Triangle... equall to two Angles of a Square') would be resisted, 'if not disputed, yet by the burning of all books of Geometry, suppressed,' were it to touch someone's interest — Hobbes's own diagnosis that validity alone cannot overcome interest-contaminated assent, and therefore cannot by itself be sufficient for practical efficacy."
  - "the compressed slogan form of the reversal (Leviathan ch.10, p.62): 'the Sciences are small Power... but Eloquence is Power' — reason's own findings, however sound, carry no inherent power to move; eloquence is named as a faculty of power in its own right, on a level with the sciences rather than subordinate to them."
  - "Cicero's original De Inventione formulation, which the young, humanist-formed Hobbes had first absorbed before rejecting and then re-embracing: 'wisdom in itself is silent and powerless to speak,' so that 'wisdom without eloquence cannot do the least good for cities' — the persuasive force of eloquence 'must always be added if reason is to be empowered and given effect.' Hobbes's career recapitulates, rejects, and then vindicates this classical thesis across three decades."
  - "modern cross-domain analogue responsibly extending Skinner's argument rather than drawn from his text: a public-health campaign that presents scientifically valid vaccine-efficacy data to a hesitant public and finds uptake unmoved — the data's validity and its power to change behavior are separate variables; per Hobbes's own diagnosis, resistance tracks the audience's 'Passions and Interests,' not the soundness of the demonstration, and the missing component is not more or better data but rhetorical engagement with those passions and interests."
  - "modern cross-domain analogue: an organizational change proposal with a technically correct business case (the analysis is sound, the numbers check out) that fails to move an organization to adopt it — illustrating that a valid argument's failure to secure assent is evidence about its motivational force, not evidence against its validity, and that the two must be supplied separately."
critical-questions:
  - "is the disagreement actually about whether the argument is VALID, or is it about whether a valid argument has been made PERSUASIVELY MOVING to this particular audience? Conflating the two licenses the early-Hobbes mistake — assuming that because an argument is sound, resistance to it must reflect either the audience's error or bad faith, when Hobbes's own diagnosis is that resistance more often tracks the audience's 'Passions and Interests,' which a valid demonstration does not by itself touch."
  - "has the disagreement been treated as a problem to be solved with MORE OR BETTER ARGUMENT, when the missing component might instead be eloquence — narrative, emotional engagement, accommodation to the audience's received opinions — supplied ALONGSIDE the existing valid argument rather than as a replacement for it?"
  - "is 'the audience won't listen to reason' being used to conclude the audience is simply irrational or malicious, rather than to prompt the Hobbesian diagnostic: what interest or received opinion is this specific valid conclusion running up against, and what rhetorical work would be required to engage it?"
  - "is this atom being reached for when the actual phenomenon is a single agent's own failure to act on their own best judgment? That is akrasia (lex-v7ceq), an intra-personal gap between a person's own knowledge and their own action — distinct from this atom's inter-personal gap between an arguer's valid claim and an audience's assent."
  - "is the eloquence being supplied actually compatible with the argument's own truth-conditions, or has 'valid reasoning needs eloquence too' become license for sophistry — asserting things the evidence doesn't support because they are more persuasively moving? Hobbes's own reversal explicitly keeps 'the faculty of solid Reasoning' as necessary ('without it the Resolutions of men are rash, and their Sentences unjust'); eloquence is the second required component, not a substitute for the first."
