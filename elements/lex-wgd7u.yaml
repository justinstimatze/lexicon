id: lex-wgd7u
name: learning-tracks-prediction-error-not-the-outcome-itself
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When analyzing how a learner — biological brain, artificial network, social-feedback loop — updates from experience, Schultz, Dayan & Montague's transferable claim is that the LEARNING SIGNAL is prediction error (the difference between what was expected and what occurred), NOT the outcome itself. Specifically: dopaminergic neurons in primate midbrain phasically activate when a reward is BETTER than predicted, fire at baseline when reward matches prediction, and depress when reward is WORSE than predicted (or omitted). Once a stimulus reliably predicts reward, the phasic burst transfers BACKWARD in time from the reward onset to the earliest reliable predicting cue — because the cue itself becomes the new source of prediction error. This matches the Rescorla-Wagner classical-conditioning rule and the temporal-difference (TD) algorithm: weight updates are proportional to prediction error, not to outcome magnitude. Transferable consequences: (1) what FEELS like a signal of value is actually a signal of expectation-violation — a fully-predicted reward generates almost no learning, while an unexpected one generates a lot; (2) intermittent reinforcement schedules are sticky precisely because they generate sustained prediction error (variable-ratio schedules maximize RPE per trial — basis for slot-machine engineering, lex-0XXX Schüll machine-zone eventually); (3) near-misses generate transient positive RPE even when objectively losses (cue partially predicted, outcome partially confirms) — explains why near-misses feel almost-like-a-win and amplify gambling pull; (4) novelty captures attention because new stimuli have no learned predictions yet so any outcome generates RPE; (5) habituation = a once-predictive cue no longer carrying RPE; (6) in LLM training, the loss IS the prediction error — RLHF and next-token-prediction both ride this same primitive at much larger scale. Practitioner failure modes: confusing reward-CODING (what the dopamine system does) with reward-EXPERIENCING (what consciousness reports); treating dopamine as a hedonic-pleasure signal when it's a learning-rate signal; designing reward systems that pay out predictably (employee bonuses, achievement systems) and being puzzled when they stop motivating — the prediction has saturated. Boundary: this is the original 1997 RPE claim. Subsequent work has shown additional complexity (Schultz 2016 review on dopamine subpopulations; ramping signals; risk-sensitivity in dopaminergic firing) — the core claim survives, the simple-scalar-RPE story has been refined. Distinct from lex-da3g3 iteration: iteration is a process; RPE is the signal the process consumes. Distinct from lex-tt5tv reward-shaping: reward-shaping is a designer-side intervention; RPE is the receiver-side signal interpretation. Composes with lex-5dnd9 inclusive-fitness as twin examples of how a value/reward computation in the nervous system rides a simpler-than-it-looks transferable rule."
