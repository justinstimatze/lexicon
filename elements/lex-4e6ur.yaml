id: lex-4e6ur
name: parallel-independent-review-makes-flaws-shallow
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a flaw seems intractable, surface Linus's law — given enough parallel independent eyes, all flaws become shallow; the move is to widen the review pool, not to push the existing reviewers harder."
related: [lex-eg9zm, lex-vk65z, lex-u2kzt, lex-zjyr8, lex-4snxu]
scaffolds-from: [lex-eg9zm, lex-4snxu]
evokes: [linuss-law, given-enough-eyeballs-all-bugs-are-shallow, the-bazaar, eric-raymond-1999, release-early-release-often, many-eyes]
lineage:
  - source: primary
    text: raymond-1999-cathedral-and-bazaar-linuss-law
    citation: "Eric S. Raymond, 'The Cathedral and the Bazaar' (1997 conference paper; revised 1999, O'Reilly; author-hosted full text at catb.org). Raymond's thesis 8, which he dubs 'Linus's Law' after Linus Torvalds: with a large enough base of testers and co-developers, almost any defect is quickly characterised and someone finds the fix — 'given enough eyeballs, all bugs are shallow.' The substrate-claim generalised beyond software: flaw-finding parallelises well across INDEPENDENT reviewers because different people hold different priors, blind spots, and expertise, so a defect opaque to one is obvious to another; the binding resource is the diversity and number of independent eyes, not the depth of any single reviewer. Raymond notes (per Torvalds's correction) that the finder and the fixer need not be the same person — characterising the bug is the hard, parallelisable part."
    quote: "[Raymond 1999 thesis 8:] 'Given a large enough beta-tester and co-developer base, almost every problem will be characterized quickly and the fix obvious to someone. Or, less formally, given enough eyeballs, all bugs are shallow. I dub this: Linus's Law.' [Raymond's refinement via Torvalds:] 'My original formulation was that every problem will be transparent to somebody. Linus demurred that the person who understands and fixes the problem is not necessarily or even usually the person who first characterizes it.'"
canonical-instances:
  - "open-source bug-finding (the origin case): a defect that stumps the core maintainers is spotted by one of thousands of users running the code in a configuration the maintainers never imagined. Linux's reliability came not from a small elite catching everything but from a vast, diverse user/developer base each catching different things"
  - "security review and bug bounties: 'many eyes' is the argument for open-sourcing security-critical code and for paying a crowd to find vulnerabilities — independent reviewers with different attack models find flaws no single audit would. Caveat: it only works if the eyes are actually LOOKING — Heartbleed sat in widely-used open code for years because few were auditing it (cf. lex-977gg the unmaintained single-point dependency)"
  - "scientific peer review, replication, and red-teaming: independent reviewers, replicators, and adversarial critics surface errors invisible to the original author because each brings a different prior and blind spot. The mechanism is the same — parallel independent inspection beats serial inspection by one expert"
  - "operationally a payoff case of lex-eg9zm parallel and a dual of lex-vk65z convergent-independent-evidence: lex-eg9zm is the general operator (run sub-tasks concurrently); lex-4e6ur is the specific empirical claim that ERROR-FINDING is unusually parallelisable because flaws are heterogeneous in who-can-see-them. lex-vk65z is the positive-side dual (independent streams CONFIRMING a claim); lex-4e6ur is independent reviewers DISCONFIRMING / finding flaws — both lean on the statistical independence of the observers"
  - "operationally in tension with lex-u2kzt responsibility-diffuses-as-able-actors-multiply and lex-zjyr8 Brooks's law: adding people does not always help — diffusion (lex-u2kzt) says more bystanders means less individual ownership, and Brooks (lex-zjyr8) says more developers on a late project means more coordination cost. Linus's law is the case where adding people DOES help, and the discriminator is work type: REVIEW/finding (independent, partitionable, no coordination — eyes help) versus CONSTRUCTION/integration (coupled, coordination-heavy — eyes hurt). The same 'more people' is good for the first and bad for the second"
critical-questions:
  - "are the eyes actually INDEPENDENT and actually LOOKING? Linus's law fails when reviewers share the same blind spot (correlated, not independent) or when code is open but unaudited (Heartbleed). Count effective independent inspections, not nominal availability"
  - "is this a finding task or a building task? Flaw-finding parallelises (independent, no coordination); construction does not (coupled, coordination cost — Brooks). Apply Linus's law to review/testing/audit, not to the implementation work itself"
  - "does the crowd have the diversity to cover the flaw-space? Many eyes help only if reviewers' priors, expertise, and usage-patterns differ enough to cover different defect classes. A thousand reviewers with identical training catch one class of bug a thousand times and miss the rest"
  - "who fixes what's found? Raymond's refinement: the finder need not be the fixer. A large base is great at CHARACTERISING problems; ensure there is also a path from 'someone noticed' to 'someone competent fixes it', or the shallow bugs stay unfixed"
status: active
