id: lex-khdnm
name: influence-percolates-through-adjacent-strata-not-straight-from-the-top
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When mapping how opinion or influence moves through a hierarchy, don't default to a broadcast model where the top tier reaches everyone directly — check whether influence instead moves link by link through adjacent levels. Merton's Rovere data shows people are most swayed by those one rung above their own position, not by the top tier directly: 'People in each influence-stratum are more likely to regard as influential people who are in the stratum immediately above their own than are informants in other strata, either above or further below.' He names the resulting structure explicitly: 'this structure involves a \"chain of influence,\" with the links in the chain constituted by persons in adjacent strata of influence... Thus rank-and-file informants looking upward toward their adjacent stratum (the middle influentials) more often mention these people as influential than do the top influentials, and middle influentials, in turn, more often mention the top influentials than do the rank-and-file. This suggests that some opinions and advice originated (or derived from mass communications) by the top influentials may be passed on progressively down the line.' The practical implication is about where to intervene: if you want an idea to reach the bottom of a hierarchy, the top tier is not the most efficient entry point, because most people aren't listening to the top tier directly — they're listening to the tier just above them, which is itself listening to the tier above that. Use this to design or diagnose any information-cascade problem (organizational communication, marketing through opinion-leaders, policy diffusion): map who each layer actually listens to before assuming a message placed at the top will reach the bottom in one hop."
