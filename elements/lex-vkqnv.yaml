    quote: "Well, and if my friends do carry me, what is that to you, you caitiffs?"
canonical-instances:
  - "An employee who has been explicitly warned to stay silent during a tense legal deposition, for reasons they fully understand, blurts out a defensive retort the moment opposing counsel makes a sarcastic remark, undoing weeks of careful preparation in a single reflexive sentence."
critical-questions:
  - "Is there any way to prepare someone against this specific failure mode in advance, given that the tortoise's mistake wasn't a lack of understanding but a failure of impulse control at the exact moment understanding was tested hardest?"
  - "Does the specific trigger matter here — would the tortoise have held his silence against a genuine threat but broken it only for mockery specifically, suggesting the vulnerability is narrower than 'any provocation' and more about status and pride being challenged?"
