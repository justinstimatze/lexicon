lineage:
  - source: primary
    text: henrich-2015-secret-of-our-success-ch7
    citation: "Joseph Henrich, *The Secret of Our Success: How Culture Is Driving Human Evolution, Domesticating Our Species, and Making Us Smarter* (Princeton University Press 2015), Ch.7 'On the Origin of Faith' (pp.97-116). Henrich (Harvard Human Evolutionary Biology, formerly UBC psychology + economics; co-author with Robert Boyd and Peter Richerson of the cultural-evolution research program) develops the central argument that humans alone are a CULTURAL SPECIES — meaning our cognitive architecture has been shaped by hundreds of thousands of years of cumulative cultural evolution to PREFERENTIALLY COPY procedural information from social models with high fidelity, even when individual steps appear causally irrelevant. The chapter assembles three lines of evidence: (1) Field ethnography on causally-opaque food-processing — Tukanoan bitter-manioc detoxification (multi-day wash-peel-grate-soak-dehydrate sequence preventing cyanide poisoning that emerges only after years; villagers cannot articulate WHY each step matters but follow them faithfully); (2) Cross-cultural recipe analysis — Billing & Sherman 1998 in *Quarterly Review of Biology* analyzed 4578 traditional recipes from 36 countries, finding that hotter climates use more antimicrobial spices, that the specific spices have measurable bacterial-killing properties, and that culinary protocols apply them in ways that preserve antimicrobial action (heat-stable spices added during cooking, heat-sensitive ones added fresh); (3) Experimental psychology on overimitation — Horner & Whiten 2005 in *Animal Cognition* presented chimpanzees and Scottish 3-4-year-old children with an 'artificial fruit' that could be opened by a multi-step procedure where some steps were causally irrelevant; the apparatus was tested in opaque-box vs clear-box versions. Chimpanzees in the clear-box condition dropped all causally-irrelevant steps; Scottish children in BOTH conditions copied all steps faithfully. The Kalahari-forager replication (Berl & Hewlett 2015 and others) extends the finding beyond WEIRD samples. Lyons, Young, & Keil 2007 in *Proceedings of the National Academy of Sciences* establish that children continue to overimitate even when explicitly instructed not to copy irrelevant actions, and even when alone. Henrich's transferable claim is that overimitation IS the mechanism by which causally-opaque accumulated cultural wisdom propagates across generations; without it, cumulative cultural evolution would be impossible. The chapter is the canonical primary source for the OVERIMITATION-as-cumulative-cultural-evolution-mechanism claim; the broader theoretical apparatus is developed across the book but Ch.7 carries the empirical-mechanism load. Composes tightly with the broader cultural-evolution program (Boyd-Richerson 1985 *Culture and the Evolutionary Process*; Mesoudi 2011 *Cultural Evolution*); distinct from lex-nfdyv generalized Darwinian-mechanism by being the specific cognitive-architecture claim that the human selection-of-which-variations-to-copy step privileges high-fidelity-copying over causally-driven-selection."
    quote: "[Henrich 2015 p.108-109 on the overimitation experimental setup:] 'In a typical experiment, a participant sees a model engage in a multistep procedure that involves using simple tools to push, pull, lift, poke, and tap an \"artificial fruit\" (often a large box with doors and holes). The procedure usually results in obtaining some desirable outcome, such as a toy or snack. Some of the steps in the procedure are not apparently required to achieve the goal of getting the reward. Sometimes people even copy steps with no evident material-physical connection to the outcome. Notorious for inappropriately naming of behavioral patterns, psychologists have labelled this not-particularly-shocking phenomenon overimitation.' [p.109 on the chimp comparison:] 'When the causality was more transparent, with the clear box, the chimpanzees immediately dropped all irrelevant actions, whereas the three-to four-year-old Scottish kids copied the irrelevant actions as much as with the opaque fruit. Chimpanzees did learn some stuff by watching the model work on the fruit: it helped them assess the affordances of the apparatus. They learned how different parts of the fruit could move. But once they had visual evidence that these actions would not do anything, they dropped them. Though chimps clearly have some culture, they aren't a cultural species.' [p.109 on robustness across populations and explicit instruction:] 'People even copy the irrelevant actions when they are alone, after they think the experiment is over, and when they've been told explicitly not to copy any irrelevant actions. However, as we'd expect from chapter 4, people are more likely to copy irrelevant actions when the model is older and higher in prestige. This is also not merely some tendency of little children: assuming the problem is sufficiently opaque, the magnitude of overimitation increases with age.' [p.108 on the cumulative-cultural-evolution claim:] 'Crucial to making cultural adaptations like manioc, corn, or nardoo processing work is not only faithfully copying all the steps, but also sometimes actually avoiding putting much emphasis on causal understandings that one might build on the fly, on one's own. As shown above, dropping seemingly unnecessary steps from one's cultural repertoire can result in neurological disorders, paralysis, pellagra, reduced hunting success, pregnancy problems, and death. In a species with cumulative cultural evolution, but only in such a species, faith in one's cultural inheritance often favors greater survival and reproduction.'"
canonical-instances:
  - "TUKANOAN BITTER-MANIOC DETOXIFICATION: in lowland-Amazonia Tukanoan villages, processing bitter manioc to make it safe to eat requires a multi-day sequence of peel, grate, wash, soak (24-48 hours), dehydrate, and re-grind. The procedure removes cyanogenic glucosides that would otherwise produce gradual cyanide poisoning manifesting as neurological deficits, paralysis, thyroid disease, and pregnancy complications. No village informant explains the procedure in terms of cyanide chemistry; the steps are transmitted as 'how it's done.' Generations who attempted shortcuts (which are abundant — the early steps APPEAR more important than the multi-day soak that is actually vital) developed the chronic poisoning syndromes; the surviving cultural transmission converged on the full sequence. Henrich Ch.7 ground-truths the cumulative-cultural-evolution argument with this case"
  - "HORNER-WHITEN 2005 ARTIFICIAL-FRUIT CHIMP-VS-KID: the canonical experimental paradigm. An opaque box has steps that include both causally-relevant manipulation (gets the reward) and causally-irrelevant decoy actions (do nothing). A clear-walled version of the same box exposes the causal structure visually. Chimpanzees in the clear-box condition strip out the causally-irrelevant steps; Scottish 3-4-year-old children copy all steps faithfully in BOTH conditions. The transferable finding: chimps optimize by what-they-can-see-causes-what; humans copy faithfully and let cultural-selection over generations handle the optimization"
  - "BILLING-SHERMAN 1998 SPICES-AS-ANTIMICROBIAL: analysis of 4578 traditional recipes from 36 countries finds that (1) common culinary spices have measurable antibacterial and antifungal properties; (2) hotter climates use more spices and stronger ones; (3) culinary protocols deploy heat-stable spices during cooking and heat-sensitive spices fresh, maximizing antimicrobial action. The cumulative-cultural-evolution interpretation: no individual cook reasons about microbes; the recipes evolved under selection-pressure-for-cooks-whose-families-survived-foodborne-illness, with high-fidelity-copying preserving the central protocol elements"
  - "AVIATION CHECKLIST DISCIPLINE: pre-flight, takeoff, landing, and emergency-response checklists in commercial aviation are followed item-by-item without skipping, even when the pilot 'knows' the system state. The checklist items are the accumulated record of every prior incident; many items individually appear trivial but the cost of skipping any one is catastrophic-event probability. The faithful-copying discipline is what makes commercial aviation the safest mode of transportation; it is the engineered version of the cultural overimitation Henrich documents in food-processing"
  - "SURGICAL TIMEOUT AND WHO CHECKLIST: the WHO Surgical Safety Checklist requires team identification, antibiotic-administration confirmation, and instrument-count verification at each phase of a surgery. Adoption reduces complications and mortality (Haynes et al 2009 NEJM). The protocol is causally-opaque to the individual surgeon (each item alone seems redundant) but selection-tested across millions of operations. The faithful-copy discipline parallels the manioc-detox case at hospital scale"
  - "CODE-REVIEW CHECKLIST WITH SELECTION-TESTED ITEMS: in software engineering organizations with mature postmortem culture, code-review checklists accumulate items that originated from specific failure modes (off-by-one in pagination, missing null check on optional field, untransactional database write, etc.). Items that survived multiple postmortem cycles ARE selection-tested cultural wisdom; the high-fidelity-copying discipline applies. Items that originated from individual reviewer preference WITHOUT a postmortem are accretion-without-selection; they should be simplified out. The transferable diagnostic is whether each checklist item can be traced to a specific selection event"
  - "CHESTERTON'S FENCE PARALLEL: the Chesterton 1929 principle 'do not remove a fence until you understand why it was put up' is a domain-specific instance of the overimitation discipline. The transferable claim is the same: causal opacity is evidence of accumulated selection pressure that the simplifier-now lacks access to. Henrich provides the cognitive-architecture mechanism that explains why the Chesterton-fence intuition is correct AS A DEFAULT and the boundary condition (selection-tested opacity vs accretion-without-test opacity) at which the default should flip"
  - "operationally distinct from lex-nfdyv variation-plus-differential-survival-plus-inheritance-produces-cumulative-adaptation: lex-nfdyv is the GENERAL Darwinian mechanism — variation + selection + inheritance. lex-u6sw3 is the SPECIFIC cognitive-architecture claim that human cultural transmission selects for high-fidelity-copying over individual-rational-evaluation, and that this is what makes the cultural-information substrate behave as if Darwinian. lex-nfdyv describes the abstract pattern; lex-u6sw3 names the human-species cognitive trait that instantiates it for culture"
  - "operationally distinct from lex-kfdep conceptual-metaphors-structure-cognition-invisibly: lex-kfdep (Lakoff) is about cognitive priming via metaphor structure. lex-u6sw3 is about procedural transmission via high-fidelity copying. Different cognitive substrates: lex-kfdep is the conceptual-grammar layer; lex-u6sw3 is the procedural-imitation layer. They compose (conceptual metaphors can travel via the same high-fidelity-copying mechanism that propagates manioc-detox) but are distinct primitives"
  - "operationally distinct from lex-kdt2v need-reduction-and-supply-augmentation-are-equivalent-paths-to-affluence (Lent 2017): lex-kdt2v is about the substrate of subjective well-being. lex-u6sw3 is about the substrate of cultural-knowledge transmission. Both engage cultural-evolution as a substrate but at different levels; they compose (a culture's chosen path to affluence is itself transmitted via overimitation) but are distinct primitives"
  - "operationally distinct from lex-6ju6z weird-samples-are-extreme-tail-not-norm (Henrich 2020): lex-6ju6z is the cross-cultural-psychology-sampling claim. lex-u6sw3 is the cognitive-architecture claim about transmission. Both are Henrich's transferable contributions; lex-u6sw3 is the critical mechanism behind lex-6ju6z's empirical finding (WEIRD samples are extreme because they inherit a specific cumulative-cultural-evolution trajectory enabled by overimitation)"
critical-questions:
  - "the selection-history audit: for a given causally-opaque procedure in your domain, what is its SELECTION HISTORY? Diagnostic prompts — how long has it existed? Has it been tested by failure modes during that history (i.e., have simplifications been attempted and produced observable harm)? If yes, treat the opacity as evidence of accumulated-wisdom-you-don't-yet-understand and copy faithfully until the why-of-each-step becomes legible to you. If no — if the procedure accumulated by accretion without selection-test — the appropriate response is to simplify and watch what breaks"
  - "the chimp-vs-human heuristic: when you encounter a procedure with steps you can't justify, which posture are you in? The chimp posture: 'I will drop steps I can't see causing the reward.' The human posture: 'I will copy faithfully even steps I can't justify because the procedure's history may have selection-tested them.' The transferable practitioner-discipline is to identify which posture is appropriate for the specific procedure, NOT to default to one or the other. Engineers tend to default chimp (justify or remove); bureaucrats tend to default human (copy faithfully); the right answer is procedure-history-dependent"
  - "the prestige-bias amplification: Henrich Ch.7 documents that overimitation INCREASES when the model is older or higher-prestige. The transferable application is that high-prestige actors get faithful-copied even on procedures that have NO selection history (a celebrity chef's idiosyncratic technique gets propagated as 'the right way' the same way a 500-year-old detox sequence does). The practitioner-discipline is to NOTICE when high-prestige imitation is driving faithful-copying of accretion-without-selection procedures, and to discriminate"
  - "the Chesterton-fence calibration: when a transferable practitioner is about to remove a piece of accumulated procedure (a checklist item, a bureaucratic step, a deployment gate, a code-review rule, a religious observance), the question is whether the removal-decision is based on (a) the procedure's selection history (track), (b) the practitioner's individual reasoning about causal structure (don't track), or (c) prestige-mimicry of a high-status simplifier (definitely don't track). The atom does not advise against simplification; it advises that the basis of simplification be selection-history-aware"
  - "the AI-training-data parallel: when an LLM is trained on chain-of-thought traces or other procedural-reasoning data, the high-fidelity-copying-of-causally-opaque-steps dynamic applies at the training-substrate level. The transferable question is whether the procedural traces being copied have selection-history (validated debugging reasoning, peer-reviewed mathematical proof structures) or accretion-without-test history (an individual researcher's preferred CoT style). The Henrich-cumulative-cultural-evolution discipline of high-fidelity-copying-of-selection-tested-procedures applies; the discipline of simplifying-accretion-without-test does not have an obvious analog in current training pipelines, and the transferable practitioner should flag the gap"
