id: lex-e3yhv
name: self-deception-improves-other-deception-by-removing-leakage-tells
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When an actor's belief seems too convenient — too well-suited to what their interest requires others to accept — suspect that the conviction itself is the strategic asset. Hiding truth from oneself removes the autonomic tells, micro-behavioral leakage, and cognitive-load signatures that betray conscious lying; the deceiver who first deceives self deceives others more reliably. Trade-off: the self-deceiver pays a reality-alienation cost in domains where outcomes are decided by accuracy rather than by impression."
