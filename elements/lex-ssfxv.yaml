id: lex-ssfxv
name: a-failed-disproof-attempt-can-confirm-the-anomaly-instead
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When someone raises a correct observation that something is off, and a follow-up test to check it fails to move or dislodge the suspicious thing, don't treat that failure as proof the original worry was wrong -- an inability to disprove an anomaly is not the same as evidence it isn't one, and mistaking the two can convert a genuine warning into false reassurance. In Eastman's telling, the water monster Unk-tay-hee's wife notices something is wrong the instant she sees it: 'for ages this has been our resting-place, and yet I have never seen this tree before!' Her husband dismisses her flatly -- 'Woman, the tree has always been there!' -- and when she persists, he tries to settle the matter by force, winding his tail around the tree (which is actually the shape-shifted hero in disguise) and attempting to uproot it. The tree doesn't budge, because it's the hero standing firm, not a real tree with real roots giving way to a determined pull. Unk-tay-hee reads this failure as vindication: 'There, I told you it had always been there!' -- when the correct reading of an object that resists being pulled up like a normal tree should is that it isn't a normal tree at all. The wife's instinct was right the whole time; the disproof attempt didn't fail to find evidence against her, it produced evidence FOR her that both of them then misread as evidence against her. Diagnostic move: when a follow-up check fails to dislodge, disprove, or explain away something flagged as anomalous, resist treating that failure as settling the question in favor of 'nothing's wrong' -- an anomaly that resists a reasonable attempt to explain it away just as often means the anomaly is real and larger than assumed, not that the original alarm was mistaken."
