name: threat-versus-offer-turns-on-who-controls-the-comparison-baseline
type-in: situation
type-out: typology
_tier: atomic
agent-instruction: "Recognize this pattern whenever a proposal leaves its recipient feeling they have 'no real choice' but to comply, and you need to know whether that felt-necessity makes the proposal COERCIVE or merely a hard-but-legitimate bargain. Wertheimer's pivotal move: 'the crux of the distinction between threats and offers is quite simple: A threatens B by proposing to make B worse off relative to some baseline; A makes an offer to B by proposing to make B better off relative to some baseline.' The felt intensity of pressure does not settle the question — 'it may be no less irrational to refuse an offer than not to succumb to a threat' — only the BASELINE comparison does. And 'to say \"better off\" is always to say \"better off than ___.\" Without some benchmark, there would be better and worse alternatives, but no better and worse off' — so the whole analysis turns on how B's baseline (the situation B would have been in absent A's proposal) gets fixed. Wertheimer names (via Nozick) three candidate tests for that baseline, which can converge or sharply diverge: the STATISTICAL test (what is normal/predicted in the normal course of events), the PHENOMENOLOGICAL test (how B actually experiences or expects their situation), and the MORAL test (what A is morally/legally REQUIRED to do for B, or refrain from doing to B) — and argues the moral test is the one that 'does most of the important work' wherever the coercion-claim is meant to bear on responsibility, excuse, or the validity of an agreement. The MORAL BASELINE is a rights-based benchmark: to fix it you must ask not where B is, or where B expects to be, but where B is ENTITLED to be, independent of A's current proposal. This yields the two-pronged theory jointly: the PROPOSAL PRONG asks whether A's proposal, relative to B's moral baseline, is wrongful (does A propose to make B worse off than B has a right to be, i.e. does A lack the right to bring about the threatened state?); the CHOICE PRONG asks whether the proposal actually left B with 'no reasonable choice' or 'no acceptable alternative' — deprived B's will in some further, specifiable psychological sense. BOTH prongs are individually necessary and jointly sufficient for genuine coercion; a proposal can fail the choice prong (a genuinely irresistible but morally permissible job offer at triple salary is not coercive merely because refusing it would be irrational — 'there is little of moral interest to be gained by referring to genuine and generous offers as coercive'), or it can feel like 'no choice' yet still be a mere offer because it fails the proposal prong (the proposer had every right to withhold the benefit, so relative to the moral baseline they are proposing to make the recipient BETTER OFF, not worse). The two prongs compose: even where a proposal genuinely overcomes the will (choice prong satisfied), it is only coercive where the proposer had no right to the baseline they are threatening to impose (proposal prong satisfied) — psychological desperation alone, absent a rights violation, yields a hard bargain, not coercion. The paradigmatic case anchoring the whole apparatus: a gunman's 'your money or your life' is a threat because the gunman has no right to kill Jones — the baseline Jones is entitled to (being alive, keeping his money) is what the proposal threatens to violate unless Jones complies. By contrast, a genuine job offer, a private physician's fee-for-service, or declining to extend credit at the old price are mere offers — however desperately the recipient needs the money, the proposer is not threatening to make the recipient worse off than a baseline the recipient is ENTITLED to; they are offering to make the recipient better off than an independently-existing baseline the proposer did not create and has no duty to improve. CRITICAL DISTINCTNESS move Wertheimer himself makes explicit (the 'Setting the Moral Baseline' section): the moral-baseline approach lets you separate 'B's background conditions for which A is not responsible' from 'rights-violating threats to B's welfare which are specifically attributable to A' — in other words, between coercive proposals and hard bargaining. The same external circumstance (desperate need, urgent deadline, asymmetric power, a stock-market loss about to happen, an illness, an existing debt) can sit behind either a coercive threat or a legitimate hard offer depending ENTIRELY on whether the proposer created or controls the baseline deprivation being threatened, or is merely declining to fix, or offering to fix, a baseline deprivation that already existed independent of them. Distinct from Frankfurt's classic free-will work (hierarchical desires, first-order vs second-order volitions, what makes a want truly one's own): Frankfurt asks a question about the STRUCTURE OF INDIVIDUAL AGENCY — what makes a desire authentically the agent's own regardless of any other party. Wertheimer's question is irreducibly DYADIC and BASELINE-RELATIVE — it is not about the structure of B's will in isolation but about the moral relationship between what A proposes and what B is independently entitled to, and cannot be answered by examining B's psychology alone (this is precisely why the theory needs TWO prongs, not one — the choice prong alone, without the proposal prong's rights-based baseline test, cannot distinguish a coercive threat from an irresistible but legitimate offer). Cross-domain applications: LABOR — 'take this job or starve' is a hard bargain, not coercion, if the employer did not create the worker's poverty and has no independent duty to relieve it (Wertheimer's own worked case: a debtor who signs an unfavorable contract under pressure to repay a personal loan is not coerced by the counterparty, because the loan pressure was part of his own background situation, not something the counterparty was responsible for) — but the same 'take it or leave it' structure IS coercive where the employer manufactured the desperation (withholding wages already owed, engineering a company-town monopoly that eliminates alternative subsistence) because then the employer controls the baseline being threatened; ABUSIVE RELATIONSHIPS — a genuine boundary ('I will leave if you hit me again') is not a threat because the abuser has no right to the partner's continued presence, but 'I will leave/hurt myself/expose you unless you comply' where the demand exploits a dependency the abuser manufactured is coercive on the identical logic; CONTRACT LAW'S DURESS DOCTRINE — courts asking whether a party had 'a right to do what it threatened to do' (Sony's right to terminate a contract, the IRS's right to sue, a prosecutor's right to bring an available charge) are applying exactly this baseline-and-rights test, translating a 'moral threat' into a legally non-coercive offer; SANCTIONS AND INTERNATIONAL RELATIONS — an 'offer' to lift sanctions is a genuine offer only if the sanctioning party had an independent right to impose them in the first place and is not itself the source of the baseline harm from which relief is being sold; PLATFORM / AI TERMS-OF-SERVICE — a take-it-or-leave-it clickwrap is a hard bargain rather than coercion only insofar as the platform did not itself manufacture the user's dependency on the specific baseline being withheld (compare lex-vw8c3's producer-supplies-both-need-and-satisfaction structure, which names exactly the mechanism by which a platform can shift from genuinely-independent-baseline offeror to baseline-controlling threatener over time). Failure modes to guard against: (a) treating raw psychological pressure ('I felt I had no choice') as sufficient on its own for a coercion claim — Wertheimer's choice prong is necessary but not sufficient, and unreasonably ATTRACTIVE offers can produce the same felt 'no choice' without any coercion at all; (b) assuming there is one uniquely correct baseline — Wertheimer explicitly denies this: the statistical, phenomenological, and moral tests can diverge (his worked Slave Case: a slave beaten every morning for no reason, whom the enslaver proposes not to beat tomorrow if the slave does X, is statistically/phenomenologically receiving an 'offer' — beatings are the normal expectation — but morally receiving a 'threat,' because the enslaver has no right to beat the slave at all; Wertheimer holds the moral test carries the real moral force here despite the statistical test being 'common-sense' intuitive); (c) collapsing the analysis into 'any circumstance that makes someone comply against their preference is coercive' — the baseline test is specifically about who is RESPONSIBLE for the deprivation being leveraged, not about the sheer presence of pressure or inequality."
