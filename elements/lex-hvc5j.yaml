id: lex-hvc5j
name: visible-successful-deviance-erodes-norms-and-spreads-more-deviance
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Treat anomie as a spreading process, not a fixed condition: once some deviant behavior is visibly rewarded, it doesn't stay contained to the people who did it. Merton: 'A mounting frequency of deviant but \"successful\" behavior tends to lessen and, as an extreme potentiality, to eliminate the legitimacy of the institutional norms for others in the system. The process thus enlarges the extent of anomie within the system so that others, who did not respond in the form of deviant behavior to the relatively slight anomie which first obtained, come to do so as anomie spreads and is intensified.' The mechanism is a feedback loop, not a one-time event: rule-breaking that visibly pays off makes the rule look optional to bystanders, which produces more rule-breaking, which further erodes the rule's authority for the NEXT round of bystanders — 'creates a more acutely anomic situation for still other and initially less vulnerable individuals in the social system.' Merton's stated escape clause is the only thing that stops the spiral: it runs 'unless counteracting mechanisms of control are called into play.' Use this to recognize why a single unpunished instance of successful rule-breaking (one executive's fraud that pays off, one athlete's undetected doping, one student's uncaught cheating) is not a self-contained event — the visible reward is itself a structural input that lowers the threshold for the next person, and the intervention that matters is whatever restores the norm's credibility before the second round of erosion compounds the first."
