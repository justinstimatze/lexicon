id: lex-cmwmy
name: an-unchecked-in-principle-distinguishing-trace-still-collapses-interference
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Feynman works a specific case: neutrons scattering off a crystal whose nuclei carry spin. Ordinarily the neutron wave scattered from every nucleus in the crystal combines into one sharp interference pattern, because there is no way, even in principle, to say which nucleus did the scattering. But when a neutron and a nucleus have opposite spin, one scattering channel flips both spins over -- and that flip leaves a mark: the nucleus that scattered is now the one with its spin reversed, distinguishable from every other nucleus in the crystal, and that fact holds regardless of whether anyone ever checks which one it is. Feynman draws the general rule directly from this: 'If you could, in principle, distinguish the alternative final states (even though you do not bother to do so), the total, final probability is obtained by calculating the probability for each state (not the amplitude) and then adding them together. If you cannot distinguish the final states even in principle, then the probability amplitudes must be summed before taking the absolute square to find the actual probability.' Nobody has to look at the flipped nucleus for the interference to vanish -- the scattering pattern smears out into the same diffuse background you would get from a single identifiable atom, because the possibility of telling the paths apart is already enough to break the coherent combination, whether or not that possibility is ever exercised. Transferable structure, stripped of the physics: when several parallel processes, contributions, or paths could in principle be told apart by some trace they leave behind, they behave as separate, independently-adding cases rather than as a single combined effect -- even if the distinguishing trace is never read, checked, or used by anyone. The question that determines which regime you're in isn't 'is anyone watching' or 'does the difference matter to the outcome you care about' -- it's the narrower, colder question of whether a fact capable of telling the alternatives apart exists at all, however deeply buried or however little anyone cares to retrieve it."
