id: lex-v6s2z
name: repeated-direct-verification-outweighs-the-apparition-explanation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you report something anomalous and the group's first move is to explain it away as illusion, omen, or misperception, don't let the availability of a comfortable non-literal explanation talk you out of what you actually, repeatedly checked. In Cushing's telling, a hunter who has genuinely seen a human youth living among a Deer herd returns to report it, and the community's immediate reaction reaches for the supernatural-but-safe interpretation: 'You have seen an apparition, and of evil omen to your family.' The hunter doesn't hedge or defer to the group's more comfortable framing. He states exactly what he did to check: 'I looked, and again I looked, and yet again, and again, and I avow to you that what I saw was as plain and as mortal as the Deer themselves.' His authority comes specifically from having verified the sighting multiple times before ever reporting it, not from insisting on his own credibility in the abstract. The community accepts this and organizes a hunt on the strength of it. Diagnostic move: when your own repeated, direct observation conflicts with a group's preferred explanation for something strange, don't retreat into the easier social framing just because it's the one that requires no further action -- cite specifically how many times and how carefully you checked, since the strength of a claim against a comfortable dismissal comes from the verification behind it, not from repeating the claim itself more insistently."
