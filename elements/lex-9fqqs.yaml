id: lex-9fqqs
name: relocation-without-power-is-not-a-real-promotion
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When an organization gives a stuck employee a new title, a new office, or a sideways move — without any increase in their actual authority, budget, or scope of decision-making — recognize this as a pseudo-promotion, not a real one. Peter & Hull (The Peter Principle, 1969) name two variants: 'percussive sublimation' (being 'kicked upstairs' — moved to a grander-sounding but powerless post) and 'the lateral arabesque' (a sideways move to a new title at the same rank, 'without being raised in rank — sometimes without even a pay raise'). Both share the same test: 'Does he now undertake any greater responsibility than before? No. Does he accomplish any more work in the new position than he did in the old? No.' The organization's motive is not deception of the employee (who often already knows) but management of everyone ELSE watching: it (a) camouflages the failure of the original promotion decision, since an outright demotion or firing would concede the original call was wrong; (b) preserves the fiction that the hierarchy still rewards merit, since visible sideways movement reads as 'something is happening' to onlookers; (c) avoids losing an employee who, though incompetent in the role, may know enough about the organization's business to be a liability if let go. The diagnostic move: before reading a title change, office move, or reorg as evidence of the org's health or the employee's standing, ask the same two questions Peter asks — has this person's actual authority increased, and are they now producing more of value than before? If both answers are no, the move is cosmetic, and its function is reputation-management for the hierarchy, not advancement for the person."
related: [lex-8njgg, lex-w68t8]
scaffolds-from: [lex-8njgg]
evokes: [percussive-sublimation, the-lateral-arabesque, kicked-upstairs, pseudo-promotion, camouflaging-a-bad-promotion]
lineage:
  - source: primary
    text: peter-hull-1969-the-peter-principle-ch3
    citation: "Laurence J. Peter & Raymond Hull, The Peter Principle (William Morrow 1969; Buccaneer Books 1996 reprint). Chapter 3 'Apparent Exceptions,' 'Apparent Exception No. 1: The Percussive Sublimation' and 'Apparent Exception No. 2: The Lateral Arabesque' — Peter's case that these two moves LOOK like counter-examples to the Principle (an incompetent employee gets promoted anyway) but are not, because neither confers real competence-relevant authority."
    quote: "'Did Blockett move from a position of incompetence to a position of competence? No. He has simply been moved from one unproductive position to another. Does he now undertake any greater responsibility than before? No. Does he accomplish any more work in the new position than he did in the old? No. The percussive sublimation is a pseudo-promotion. ... Hierarchiologically, the only move that we can accept as a genuine promotion is a move from a level of competence. ... Hierarchiology tells us that every thriving organization will be characterized by this accumulation of deadwood at the executive level, consisting of percussive sublimatees and potential candidates for percussive sublimation. ... The lateral arabesque is another pseudo-promotion. Without being raised in rank — sometimes without even a pay raise — the incompetent employee is given a new and longer title and is moved to an office in a remote part of the building. ... I conclude that the larger the hierarchy, the easier is the lateral arabesque.' [Verified 2026-08-19: the lateral-arabesque sentence is exact against the real PDF; the checker cannot confirm it because the scan scrambles the word order around 'rank — sometimes without even a pay raise —'.] [Corrected 2026-08-19: this entry had never been quote-marked, so it had never actually been checked -- check_atom() silently skips a lineage entry with no quote-marked span. On checking, one sentence was wrong: the atom claimed 'a move from a level of incompetence to a level of competence,' but the real sentence (confirmed via both the PDF's extracted text and a fresh 300dpi page render + tesseract OCR of p.55, independently agreeing) reads 'a move from a level of competence' -- no destination clause. The shorter reading also fits Peter's own framework better: percussive sublimation moves someone between two positions requiring the SAME level of competence (no real change), where a genuine promotion moves someone FROM a level where they demonstrated competence to an untested one -- not, as the previous wording implied, from incompetence toward competence, which inverts the direction of Peter's whole thesis.]"
canonical-instances:
  - "Walt Blockett, 'hopelessly incompetent, a bottleneck' as a manager, is 'kicked upstairs' to a grander-sounding post with no more responsibility — the textual anchor for percussive sublimation, and Peter's own worked example of the three organizational payoffs it buys (camouflages the prior bad promotion, boosts morale via carrot-on-a-stick, keeps a liability inside the tent rather than firing them into a competitor's arms)"
  - "R. Filewood, incompetent as office manager, is moved at the same salary to 'co-ordinator of inter-departmental communications, supervising the filing of second copies of inter-office memos' — the textual anchor for the lateral arabesque: a longer title, a real-sounding department, and strictly less actual work"
  - "a modern reorg that creates a new 'Chief of Staff' or 'Special Advisor' title for a manager whose team has been quietly reassigned elsewhere: the announcement reads as advancement to outside observers, but the diagnostic test (more authority? more output?) returns no on both counts — the same structural move Peter catalogued, in contemporary corporate vocabulary"
critical-questions:
  - "how does this differ from lex-8njgg (people-rise-to-their-level-of-incompetence, same book, same author)? lex-8njgg is the mechanism by which someone GETS STUCK — competence at level N earns a shot at N+1, and the skills don't transfer. This atom is what the hierarchy does AFTER someone is already stuck: a face-saving relabeling move that makes the stuck state look like continued advancement. lex-8njgg explains the disease; this atom explains one of the organization's cosmetic treatments for its symptoms."
  - "how does this differ from lex-w68t8 (manufactured-incompetence-forestalls-unwanted-promotion, same book, adjacent chapter)? This atom is a move the ORGANIZATION makes about an already-incompetent employee, after the fact. lex-w68t8 is a move the EMPLOYEE makes proactively, before ever being promoted past their competence, specifically to prevent themselves from becoming this atom's subject. They are complementary: one is offense, one is defense, and a sufficiently self-aware employee can use lex-w68t8 to avoid ever needing lex-9fqqs applied to them."
  - "how does this differ from lex-n365w (things-are-what-they-are-reported-to-be, Gall's F.L.A.W.)? lex-n365w's claim is about an administrative SYSTEM's blindness — what isn't recorded doesn't exist for the system, regardless of anyone's intent. This atom is about a DELIBERATE act of relabeling performed BY people who know the underlying reality, aimed at people outside the hierarchy who don't. The mechanism here is closer to reputation-management than to record-keeping blindness — the people executing the pseudo-promotion are not themselves deceived."
  - "when does this read wrongly — i.e. when is a lateral or upward-sounding move NOT a pseudo-promotion? When the new role genuinely does carry more authority or scope even without a title bump (a flat structure that rewards influence over titles), or when the sideways move is a deliberate skill-broadening step for someone who IS advancing, just not linearly. The diagnostic (more authority, more output) is the test precisely because the surface signal — title, office, department name — is cheap to fake and expensive to verify without it."
