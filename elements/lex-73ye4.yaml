id: lex-73ye4
name: acting-on-unconfirmed-suspicion-to-preempt-danger-before-proof-arrives
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Waiting for proof before acting on a plausible suspicion means acting only after the danger has already materialized; treating the suspicion itself as sufficient grounds for preemptive caution, even without confirmation, is what actually avoids the entanglement — and events afterward often vindicate the suspicion the person could never have verified in the moment. In the Jataka's frame story, the elder Moggallana finds a stranger lying at his hut door and, purely on a hunch, decides not to risk association with him: 'The elder noticed him lying there and suspecting his character said to himself, \"It would be wrong for me to have any dealings with a robber.\" So coming out of his hut he told him not to lie there, and drove him away.' Pursuers hunting an actual robber arrive moments later, confirming what Moggallana never had proof of. The Jataka's own birth-story generalizes this into an explicit maxim: 'Beware a danger yet unseen: suspect before too late, The wise e'en in this present world look to a future state.'"
