id: lex-ngc66
name: which-predicates-project-to-future-cases-is-itself-contested
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When projecting a regularity from past to future, surface Goodman's new riddle — which predicates project (green vs grue) is itself underdetermined by the data; name the predicate choice as the decisive assumption."
related: [lex-39muf, lex-sxt57, lex-exrwy, lex-sgd2s, lex-vmas8, lex-hjnej, lex-x4cw4, lex-brkcw, lex-vgfgh, lex-kdj8h, lex-5qv7q, lex-kgphf, lex-xu94g, lex-c9xba, lex-bmujx, lex-wutu8, lex-wverr, lex-f4asy, lex-p77e7]
scaffolds-from: [lex-39muf, lex-sgd2s]
evokes: [goodman-new-riddle-of-induction, grue-bleen, projectible-predicates, fact-fiction-and-forecast, law-like-vs-accidental-generalization, putnam-language-dependence]
lineage:
  - source: practitioner
    text: wikipedia-new-riddle-of-induction-2025-12
    citation: "Wikipedia 'New riddle of induction' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/New_riddle_of_induction). Underlying primary: Nelson Goodman 1955 *Fact, Fiction, and Forecast* (Harvard University Press). The substrate-claim: Goodman's new riddle of induction shows that the OLD problem of induction (Hume — why do past regularities project to future cases?) leaves a deeper question untouched: even GRANTING that some predicates project from past to future, WHICH predicates project? Define 'grue' as 'observed before time t and green, OR not observed before t and blue.' All emeralds examined to date have been BOTH green AND grue. So past evidence equally well supports 'all emeralds are green' AND 'all emeralds are grue.' But these predict opposite outcomes after time t. The transferable shape is: which-predicates-project is itself an inductive question, with no purely-logical answer. Some predicates (green) are PROJECTIBLE; others (grue) are not. But this distinction is not purely-syntactic — Putnam showed it depends on the language. The riddle thus shows that the project-from-past-to-future operation requires more than logical structure; it requires a prior judgment about which predicates count as natural kinds."
    quote: "[Wikipedia 'New riddle of induction', 2025-12 ZIM snapshot:] 'The new riddle of induction was presented by Nelson Goodman in Fact, Fiction, and Forecast as a successor to Hume's original problem. It presents the logical predicates grue and bleen which are unusual due to their time-dependence. Many have tried to solve the new riddle on those terms, but Hilary Putnam and others have argued such time-dependency depends on the language adopted, and in some languages it is equally true for natural-sounding predicates such as green. For Goodman they illustrate the problem of projectible predicates and ultimately, which empirical generalizations are law-like and which are not.' [On definitions:] 'Goodman defined grue relative to an arbitrary but fixed time t: an object is grue if and only if it is observed before t and is green, or else is not so observed and is blue. An object is bleen if and only if it is observed before t and is blue, or else is not so observed and is green.' [The substrate-claim is the DEEP-INDUCTION-PROBLEM: even after solving Humes problem (somehow grounding induction), we face the further question of WHICH predicates support the inductive inference. The substrate-meta point: scientific generalizations rest on a prior selection of natural-kind predicates that the logic of induction itself does not provide. This sharpens Hume's problem (lex-39muf) by showing induction-justification has TWO layers: justifying-induction-in-general AND identifying-the-projectible-predicates.]"
canonical-instances:
  - "Goodman's emeralds: all emeralds examined before some future time t are green AND grue (since grue at this point coincides with green). Past evidence cannot distinguish 'all emeralds are green' from 'all emeralds are grue.' But on January 2, 2035, the two hypotheses make opposite predictions."
  - "Putnam's language-relativity: in some natural languages, 'green' and 'grue' could be swapped — speakers of those languages would find 'grue' the natural predicate and 'green' the artificial one. So the green-vs-grue distinction is not purely-syntactic; it depends on which predicates are entrenched in the language."
  - "Machine learning generalization: an ML model trained on data labeled by feature f might generalize well or poorly depending on whether f is a 'natural' or 'gerrymandered' predicate relative to the test distribution. This is the practical face of the grue problem — when does the predicate you trained on generalize?"
  - "Curve-fitting paradoxes: given n data points, infinitely-many polynomials fit them perfectly. Which one is the 'right' generalization? The grue problem at the function-space level — choosing between equally-fitting predicates."
  - "Scientific law-likeness: 'all gold spheres are less than a mile in diameter' is true but not law-like (no theoretical principle predicts it); 'all uranium spheres are less than a mile in diameter' IS law-like (because critical-mass physics predicts it). The grue problem isolates this distinction: not all true universal-claims are projectible."
  - "operationally distinct from lex-39muf problem-of-induction (Hume): Humes problem asks why ANY induction works at all; Goodman's riddle asks WHICH predicates support induction GIVEN that some do. Goodman's is the SUCCESSOR problem, sharpening Hume's by identifying a previously-hidden layer."
  - "operationally distinct from lex-sgd2s Occams razor: Occam prefers simpler hypotheses; but 'simpler' depends on which predicates are basic. If grue and bleen are basic, then 'all emeralds are grue' is the simpler hypothesis. The grue problem reveals that simplicity itself is predicate-relative."
  - "operationally distinct from lex-vmas8 falsifiability: falsifiability is a property of hypotheses given a language; the grue problem operates at the prior level of language-selection. Both 'all emeralds are green' and 'all emeralds are grue' are falsifiable; the riddle is choosing which to test."
  - "compose-related with lex-sxt57: lex-sxt57 names how stipulating boundaries creates the categories that downstream classification operates over; the grue problem is the inductive-projection analogue — the language-choice creates the projectibility-distinctions that downstream prediction operates over."
critical-questions:
  - "is there a non-circular criterion for projectibility? Goodman proposed ENTRENCHMENT — predicates are projectible if they have been successfully projected in the past. But this seems circular (it just defers the question to the meta-level). Critics have argued for natural-kind theories (predicates corresponding to real natural-kind boundaries are projectible), pragmatic theories (predicates that work in our cognitive economy), and language-relativist theories (no language-independent answer). Practitioner-discipline: when applying induction, name explicitly why your chosen predicates are projectible."
  - "what does the grue problem imply for empirical science in practice? Mostly it means scientists rely on background theory to choose predicates BEFORE running inductive procedures. The 'natural' predicates aren't selected by the data; they're selected by theory + intuition + entrenchment + comparison-to-other-successful-theories. This SHOULD make us suspicious when novel domains require novel predicates — there's no guarantee the obvious-looking predicate will project."
  - "is the grue problem a real problem for machine learning? Yes — out-of-distribution generalization failures are often grue-like: the model learned features that worked on training data but don't project to test data because the relevant 'natural kind' wasn't what we labeled. Adversarial examples + distribution-shift problems are practical instances of the grue problem."
  - "what about predicates that AREN'T time-dependent but ARE still gerrymandered? Goodman's grue uses time as the gerrymander-axis but the structure generalizes. Any disjunctive-predicate that coincides with a natural-predicate on observed data but diverges on unobserved data exhibits the same problem. Practitioner-question: how many gerrymander-axes are there, and which ones does my predicate-choice depend on?"
  - "where do practitioners over-apply the grue problem? When using it as a general skepticism about induction. The grue problem doesn't show induction is impossible — it shows induction requires a prior predicate-selection that the logic doesn't provide. Most scientific practice goes well because background theory makes the predicate-selection unproblematic. The grue problem becomes acute at frontiers where the right predicates aren't obvious."
