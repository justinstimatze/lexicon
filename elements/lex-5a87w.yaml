id: lex-5a87w
name: opposites-can-be-complementary-and-cyclical-rather-than-antagonistic-and-exclusive
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you encounter opposing forces, values, or properties in a system, ask which of two structural readings is operative. The dualist-antagonistic reading (Zoroastrian, Platonic, Manichean, monotheistic) treats opposites as competing for the same space, with one needing to conquer the other; light vs dark, good vs evil, body vs soul, signal vs noise — the practitioner-prescription is to maximize one and minimize the other. The complementary-cyclical reading (yin-yang, Daoist) treats opposites as MUTUALLY DEFINING (each is what it is only by reference to the other), CYCLICAL (each contains a seed of the other and is always becoming the other), and STRUCTURALLY NECESSARY for the system to function — the practitioner-prescription is to balance, integrate, and respect both phases. Same observation (the system has two poles); two structural readings; two different practitioner-prescriptions. The atom asks the practitioner to NOTICE which reading is being defaulted to and consider whether the alternative would fit the system better. Most Western technical and ethical traditions default to dualist-antagonistic; many problems become more tractable under the complementary-cyclical reading. Examples: psychological 'shadow' work treats negative emotions as material to integrate (cyclical) not eliminate (antagonistic); engineering tradeoffs (latency vs throughput, simplicity vs power) yield to phase-management (cyclical use of both) better than to one-conquers-the-other; political polarities (centralized vs distributed power, individual vs collective) often work via institutionalized cycling rather than permanent victory; biological regulation (sympathetic vs parasympathetic, inflammation vs healing) is built on phase-cycling not on elimination of one phase. The atom does NOT advise that complementary-cyclical is always right; some opposites really are antagonistic (a bug vs working code; a fraud vs a legitimate transaction). It advises NOTICING the default reading and considering the alternative deliberately."
