id: lex-ebdcg
name: the-answer-was-already-where-the-seeker-was-standing-the-whole-time
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you're searching for something by asking one reputed authority after another and getting the same unhelpful answer every time, consider that the thing you're looking for may not require any authority at all -- it may already be exactly where you are, waiting only to be noticed rather than found. In Radin's Winnebago Trickster cycle, Trickster is lost in the ocean and asks fish after fish where the shore is, always addressing them by their reputation: 'My younger brother, you have always had the reputation of being very clever, would you not tell me where the shore is?' 'I do not know, brother, for I have never seen the shore,' answered the fish. He repeats this with a catfish, then a nasidjaga, then a spoon-bill catfish, then a yellow catfish, and 'every fish imaginable,' each one equally reputed and equally useless. Only when he reaches a whole school of ordinary white fish, addressed collectively as 'younger brothers' rather than singled out as an individual expert, does he get an answer: 'Why, older brother, the shore is right there, just exactly where you are,' answered the fish. And indeed he could see the shore from where he was swimming! He had been at the shore the entire time he was asking. Diagnostic move: if a search for expert-sourced knowledge keeps returning the same non-answer, check whether the thing sought is actually a matter of location or presence rather than expertise -- the search itself, by ranging further afield for a better-reputed source, may be moving attention away from where the answer already sits."
