id: lex-yejp2
name: conditioning-on-a-common-consequence-induces-spurious-association-between-its-independent-causes
common-name: "Filtering by the shared effect"
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When you only see cases that share a common consequence — only patients who reached the hospital, only candidates who got the interview, only papers that got published, only ideas that survived the editing pass — independent causes of that consequence will appear correlated WITHIN your sample even when they are uncorrelated in the population. The filter itself manufactures the association. Before reading any correlation as evidence of mechanism, ask: 'is the variable that defines my sample a common consequence of the two things I'm comparing?' If yes, the correlation may be entirely produced by the filter."
related: [lex-tfpzb, lex-6pd48, lex-nx7u7, lex-smney, lex-vgfgh, lex-tmy67, lex-875gz]
scaffolds-from: [lex-tmy67, lex-vgfgh, lex-6pd48, lex-tfpzb]
evokes: [collider-conditioning, the-hospital-paradox, the-talented-asshole-illusion, why-published-papers-look-more-novel-than-they-are, when-the-filter-IS-the-correlation]
lineage:
  - source: primary
    text: berkson-1946-fourfold-table-hospital-data
    citation: "Joseph Berkson, 'Limitations of the Application of Fourfold Table Analysis to Hospital Data,' Biometrics Bulletin 2(3):47-53 (June 1946). Originally presented in 1938 at the American Statistical Association; published 1946 'in response to recent inquiries.' Berkson, then Head of Biometry at the Mayo Clinic, showed via a worked example (cholecystitis, diabetes, refractive errors) that two diseases statistically independent in the general population will appear NEGATIVELY correlated in the hospital sample whenever each disease independently raises the probability of hospital admission. The mechanism — what Pearl 1995/2000/2009 would later formalize as 'conditioning on a collider' in a DAG — is identifiable in this 1946 paper without graph-theoretic vocabulary. The transferable claim is broader than its 1946 epidemiological framing: ANY observational dataset filtered by a variable jointly caused by the two variables you're comparing will show spurious association."
    quote: "[Berkson 1946 p.48 — the result of the worked example:] 'We see here that though in the general population, the incidence of cholecystitis was identical among the persons who had diabetes and the persons who had refractive errors, in the hospital population the incidence was less in the diabetic group than in the control group, giving an appearance of a small negative correlation, and this in the face of the fact that we have assumed equality of selective rates for the various diseases.' [The mechanism, p.48 — selective probabilities operating independently are the filter:] 'we shall suppose that a person who has cholecystitis has a certain definite probability of being drawn to the hospital because of the presence of that disease alone, and so for other diseases. Furthermore, for simplicity we shall say that these selective probabilities operate independently...' [Verified 2026-08-19 against the real PDF: both spans exact; the checker cannot confirm them because this is a two-column JSTOR scan and the extraction interleaves the two columns word-by-word, with a JSTOR terms-of-use footer injected mid-passage as well.] [The paper's structural conclusion, p.49 — the ratio of multiple-diagnoses to single-diagnoses in any hospital sample is systematically higher than in the population, even when diseases are independent in the population, because each diagnosis independently raises P(admission).]"
  - source: practitioner
    text: methodology-canon
    citation: "Berkson's paradox is now standard in causal-inference textbooks (Pearl 2009 Ch.6 §6.5; Hernán & Robins 2020 'Causal Inference' Ch.8; Rosenbaum 2017 'Observation and Experiment'). Transferable beyond medicine because the mechanism — selection on a common consequence — applies to any filter that depends on the variables being compared. The journal-publication / hiring-decision / dating-pool literature uses the same structure under different names (the 'attractive jerk' phenomenon: among people you go on a date with, attractiveness and being a jerk appear negatively correlated because each independently makes someone date-able)."
canonical-instances:
  - "Berkson's own canonical case (1946 §0-§1): two diseases independent in the general population (no biological relationship between cholecystitis and diabetes) appear negatively correlated in the hospital admissions sample, because each disease independently raises the probability that a patient ends up at the hospital. The negative correlation is a pure artifact of the admission filter — no biological mechanism is involved"
  - "the 'attractive-jerk' or 'why are all the good guys taken' folk paradox: among the people one chooses to date, attractiveness and other-positive-traits appear negatively correlated because each trait independently raises the probability of getting selected into the dating pool — anyone in your pool either has many positive traits or is unusually attractive. The folk explanation ('attractive people are jerks') gets the mechanism backwards; the filter manufactures the correlation"
  - "published-papers and replicability: among papers that got published, study novelty and methodological rigor appear negatively correlated, because each independently raises the probability of acceptance — a sufficiently novel result can get published with weaker methods, a sufficiently rigorous study can get published with a modest result. The publication filter induces an apparent novelty-vs-rigor tradeoff that doesn't exist among submitted (let alone conducted) studies"
  - "hiring at selective firms: among employees of a highly-selective company, intelligence and other-positive-traits (work ethic, charisma) can appear negatively correlated because the company filter requires high values on at least ONE dimension. The folk observation 'the smartest people at our firm are the worst to work with' is the Berkson signature, not a real mechanism. Same structure as the attractive-jerk paradox"
  - "academic-admissions: among the students admitted to a selective program, standardized-test scores and admissions-essay quality often correlate negatively — each independently raises the probability of admission. Naive analysis from the admitted-students sample concludes the two predict each other inversely; in the applicant pool they're uncorrelated"
  - "celebrity-talent and notoriety: among people who become famous, talent and scandal can appear negatively correlated because each independently raises the probability of being famous (talent-route vs scandal-route). The folk observation 'famous people are either talented OR scandalous, rarely both' is the Berkson filter signature"
  - "the survivorship-of-mediocrity in long-running organizations: among employees who survived a long tenure at an institution, competence and political-skill can appear negatively correlated because each independently raises P(survival) — survivors either did good work and were tolerated, or did poor work but were politically protected. Among hires, the two skills are uncorrelated"
  - "operationally distinct from lex-tfpzb survivorship-bias: survivorship conditions on a SINGLE outcome (survived/eliminated) — selection is on the outcome variable itself. Berkson conditions on a COMMON CONSEQUENCE of two upstream variables, producing spurious correlation BETWEEN those upstream variables. Survivorship distorts estimates of the surviving-feature's average; Berkson manufactures a relationship between features that aren't there in the population"
  - "operationally distinct from lex-tmy67 Heckman sample-selection-bias: Heckman is the general 'selection-as-omitted-variable' framing; Berkson is the specific mechanism where the selection variable is a COMMON CONSEQUENCE of the variables being compared, producing the surprising signature of inducing correlation where none existed in the population. Heckman 1979 generalizes the Berkson 1946 case to non-binary outcomes and continuous regression; Berkson is the historically-earliest named instance and the cleanest transferable shape"
  - "operationally distinct from lex-6pd48 intervention-and-observation Pearl: Pearl's DAG framework names collider-conditioning generally; lex-yejp2 is the specific atom for the conditioning-on-common-consequence move and its observational signature (spurious association in a filtered sample). The Pearl atom is the upstream theory; Berkson is the working substrate primitive for the practitioner who needs to recognize the pattern in their own data without pulling out a DAG"
critical-questions:
  - "is the sample-defining variable actually a common consequence of the variables being compared, or just adjacent? Berkson requires the filter to be jointly CAUSED BY the variables being compared (a collider in the DAG sense). If the filter is upstream of one variable and downstream of the other (a mediator or confounder), conditioning has different consequences. Practitioner-discipline: draw the DAG between (filter variable, variable A, variable B). If filter is downstream of BOTH, you have a Berkson setup"
  - "how strong is the induced correlation? Berkson's mathematical result is that the magnitude of induced correlation depends on the strength of each variable's effect on the filter AND on the prevalence of the variables in the population. Weak filters or small effects produce weak spurious correlations; strong filters with strong effects produce dramatic apparent correlations. Practitioner-question: is the magnitude observed in the filtered sample consistent with the magnitude predictable from filter-strength alone?"
  - "would the correlation reverse, vanish, or amplify in the unfiltered population? The diagnostic test for Berkson is: if you could measure both variables in the unfiltered population, would the correlation still be there? In Berkson's canonical case, the two diseases are independent in the population and negatively correlated in the hospital sample — the filter manufactures the entire correlation. Practitioner-question: can you measure the variables in the unfiltered pool (or any approximation of it)? Differences between the filtered and unfiltered correlations are the Berkson signature"
  - "is this distinct from lex-tmy67 Heckman sample-selection? Both involve selection-induced bias, but Berkson names a specific subset of selection-bias settings: where the selector is a COMMON CONSEQUENCE of two variables, and the bias appears as CORRELATION BETWEEN those two variables. Heckman names the general case where selection is on a variable correlated with the outcome of a regression. Berkson is older (1946 vs 1979) and transferable as a recognizable structural shape; Heckman is the formal regression-theoretic framework. They share substrate but operate at different abstraction levels"
  - "is the practitioner reaching for 'they look correlated, must be related' or 'I selected my sample by their joint consequence'? The transferable failure mode is forgetting that the filter operation occurred. People presented with the published-paper / hospital / dating data see the apparent correlation and reach for mechanism explanations; the discipline is to FIRST ask 'how was this sample assembled?' before reading correlations as evidence of relationship"
status: active
