id: lex-zag9z
name: cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity-not-consistency
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When weighing evidence against multiple hypotheses, cross-tabulate evidence × hypothesis and weight by DIAGNOSTICITY (does this evidence distinguish hypotheses?) not by consistency (does it fit my favored hypothesis?). Most prized evidence is consistent-but-not-diagnostic."
related: [lex-2czcp, lex-5f2nj, lex-8j5ms, lex-8vcfb, lex-96qnn, lex-bj7ak, lex-ckahh, lex-dgwbn, lex-eb3wf, lex-hv2dn, lex-k6d7u, lex-kyc5a, lex-mbx6p, lex-rsnn7, lex-rwvkh, lex-sgd2s, lex-t9fs7, lex-vgfgh, lex-vkhp7, lex-vmas8, lex-xbpmu, lex-ythes, lex-zfbef]
scaffolds-from: [lex-rsnn7, lex-8vcfb, lex-k6d7u, lex-vmas8, lex-vkhp7, lex-rwvkh]
evokes: [analysis-of-competing-hypotheses, ACH, heuer-1999, diagnosticity, disprove-not-prove, hypothesis-matrix, simultaneous-hypothesis-evaluation, satisficing-as-failure-mode]
lineage:
  - source: primary
    text: heuer-1999-psychology-of-intelligence-analysis-ch8
    citation: "Richards J. Heuer Jr., *Psychology of Intelligence Analysis*, CIA Center for the Study of Intelligence 1999, Ch. 8 'Analysis of Competing Hypotheses' (pp. 95-110). The substrate-claim: when evaluating between candidate explanations, the natural approach (pick the most-likely-seeming candidate, look for confirming evidence) systematically fails because most evidence is consistent with multiple hypotheses. The corrective procedure: lay out ALL plausible hypotheses simultaneously; cross-tabulate each piece of evidence against each hypothesis; weight evidence by its DIAGNOSTICITY (ability to distinguish between hypotheses) not its CONSISTENCY (compatibility with the favored hypothesis); proceed by trying to DISPROVE hypotheses rather than confirm them. The 8-step ACH procedure operationalizes this. The substrate-meta point: diagnosticity is the right unit of evidence-value — a high-temperature-reading tells you a patient is sick but barely distinguishes among illnesses; a SPECIFIC SYMPTOM that rules in/out particular diagnoses has high diagnosticity. Most natural analysis ignores diagnosticity and asks 'does this support my hypothesis?'; disciplined analysis asks 'which hypotheses does this rule out?'. Operationally portable beyond intelligence: differential diagnosis in medicine, root-cause analysis in engineering, debugging by hypothesis-elimination, scientific hypothesis-testing programs, legal trials with multiple defendants."
    quote: "[Heuer 1999 Ch. 8 p.95-101:] 'Analysis of competing hypotheses (ACH) requires an analyst to explicitly identify all the reasonable alternatives and have them compete against each other for the analyst's favor, rather than evaluating their plausibility one at a time.' [On satisficing as the failure mode:] 'The way most analysts go about their business is to pick out what they suspect intuitively is the most likely answer, then look at the available information from the point of view of whether or not it supports this answer. If the evidence seems to support the favorite hypothesis, analysts pat themselves on the back ('See, I knew it all along!') and look no further. ... Decision analysts call this a satisficing strategy.' [The 8-step procedure:] '1. Identify the possible hypotheses to be considered. ... 2. Make a list of significant evidence and arguments for and against each hypothesis. 3. Prepare a matrix with hypotheses across the top and evidence down the side. Analyze the diagnosticity of the evidence and arguments — that is, identify which items are most helpful in judging the relative likelihood of the hypotheses. 4. Refine the matrix. ... 5. Draw tentative conclusions about the relative likelihood of each hypothesis. Proceed by trying to DISPROVE the hypotheses rather than prove them. 6. Analyze how sensitive your conclusion is to a few critical items of evidence. ... 7. Report conclusions. Discuss the relative likelihood of all the hypotheses, not just the most likely one. 8. Identify milestones for future observation that may indicate events are taking a different course than expected.' [On diagnosticity:] 'Diagnosticity may be illustrated by a medical analogy. A high-temperature reading may have great value in telling a doctor that a patient is sick, but relatively little value in determining which illness a person is suffering from. Because a high temperature is consistent with so many possible hypotheses about a patient's illness, this evidence has limited diagnostic value in determining which illness (hypothesis) is the more likely one.' [The transferable distillation: the natural-mode of analysis evaluates evidence by 'does it support my hypothesis?'; the ACH-mode evaluates evidence by 'does it discriminate between hypotheses?'. These produce very different rankings of what's evidentially important.]"
canonical-instances:
  - "Differential diagnosis in medicine: a patient presents with multiple symptoms; the clinician lists plausible diagnoses (rule-in candidates) + lists distinguishing tests (high-diagnosticity exams). A negative result on a high-diagnosticity test rules out a hypothesis; a positive result on a low-diagnosticity test (e.g., elevated CRP) merely confirms inflammation without identifying which condition. The DDx workup is ACH applied to clinical reasoning."
  - "Debugging: when a bug has multiple plausible causes, the natural approach (start with the most-likely cause and investigate) often wastes hours when the most-likely cause turns out to be unrelated. The ACH approach: list candidate causes, identify experiments that would DISTINGUISH them (high-diagnosticity tests), run the most-distinguishing experiments first. The bisect-search debugging technique is structurally ACH — find the cheapest test that maximally rules-out candidates."
  - "Legal cases with multiple defendants: prosecutorial 'theory of the case' often picks one defendant and seeks confirmation. ACH-discipline would lay out all plausible-perpetrator hypotheses, find evidence that DISTINGUISHES them, and let the most-supported hypothesis emerge. Many wrongful convictions are produced by satisficing on the first candidate and ignoring disproving evidence (Brandon Garrett's *Convicting the Innocent* 2011 documents this systematically)."
  - "Scientific hypothesis-testing: Popper's falsificationism (lex-vmas8) prescribes 'try to disprove'; ACH gives the operational procedure for doing so across multiple hypotheses simultaneously. The 'crucial experiment' concept (Bacon, then Duhem-Quine) is the high-diagnosticity test in ACH terms — the experiment that maximally discriminates between competing theories."
  - "Intelligence analysis canonical case (Heuer 1999 Iraq-1993-retaliation example, p.101): the question 'Will Iraq retaliate after US bombing of intelligence headquarters?' had multiple plausible hypotheses (yes-via-terrorism, yes-via-military, no-public-deterrence-suffices, no-internal-constraints). ACH matrix layout makes diagnosticity visible: an Iraqi public statement is consistent with all hypotheses (low diagnosticity); covert preparations are inconsistent with no-hypotheses (high diagnosticity). The methodological win is making this visible procedurally."
  - "Operationally distinct from lex-8vcfb: lex-8vcfb names the principle that not-seeing-X can be evidence; lex-zag9z names the FULL PROCEDURE for systematically extracting evidential value (presence + absence) from multiple-hypothesis evaluation. ACH USES lex-8vcfb (Step 2 explicitly notes 'absence of evidence as well as its presence') but goes further by structuring the comparison."
  - "Operationally distinct from lex-eb3wf prospective-hindsight (Klein 2007 premortem): premortem imagines failure of a SINGLE planned decision; ACH evaluates MULTIPLE candidate explanations of a current situation. Both resist confirmation bias but at different decision-types (forward-planning vs current-explanation)."
  - "Operationally distinct from lex-k6d7u credence-as-graded-belief: lex-k6d7u is the credence-as-output concept; lex-zag9z is the comparative-procedure for producing well-calibrated credences via cross-tabulated diagnosticity. Compose: ACH inputs evidence and hypotheses, outputs credences; lex-k6d7u names what credences are."
  - "Operationally distinct from lex-t9fs7 confirmation-bias: lex-t9fs7 names the failure mode (seeking confirming evidence); lex-zag9z names the PROCEDURAL COUNTERMEASURE (matrix + diagnosticity + try-to-disprove). They compose: ACH is the disciplined alternative when confirmation-bias is the diagnosed cognitive risk."
  - "Operationally distinct from lex-8j5ms within-case-process-tracing: process-tracing analyzes the INTERNAL CAUSAL MECHANISM of ONE hypothesis in a single case; ACH compares MULTIPLE hypotheses against shared evidence. Different unit-of-analysis."
  - "Operationally related to lex-sgd2s Occam's razor and lex-vmas8 falsifiability: ACH operationalizes both. Falsifiability says 'prefer theories that forbid observations'; ACH operationalizes this as 'work down the columns trying to disprove, not across the rows seeking to confirm.' Occam prefers simpler hypotheses; ACH's diagnosticity-weighting tends to reward hypotheses that make sharper predictions (the inverse of Occam's surface but compatible since simpler theories often have sharper predictions)."
critical-questions:
  - "did you actually GENERATE all the reasonable hypotheses, including the politically-inconvenient ones? Heuer's Step 1 fails most often at hypothesis-omission. Without a candidate-hypothesis on the matrix, the procedure cannot evaluate it. Practitioner-discipline: get the brainstorm from people with DIFFERENT priors; explicitly include 'deception by the source' and 'we are wrong about the question itself' as candidates."
  - "are you confusing CONSISTENCY with DIAGNOSTICITY? A piece of evidence that 'supports' your favored hypothesis but is equally consistent with all other hypotheses adds NO evidential value to the comparison. Practitioner-question: for each cell in the matrix, ask 'if this hypothesis were FALSE and another were true, would I expect to see this evidence anyway?' If yes, low diagnosticity."
  - "are you proceeding by DISPROOF (column-wise) or by CONFIRMATION (row-wise focused on favorite)? Step 5 explicitly: 'Proceed by trying to disprove the hypotheses rather than prove them.' Failing to do this is the most common procedural error. Practitioner-discipline: for each hypothesis, count the inconsistent-evidence cells (disconfirming pressure); the hypothesis with FEWEST disconfirmations is the surviving one — NOT the one with most confirmations."
  - "is your conclusion robust to changes in 1-2 critical evidence items? Step 6 sensitivity analysis: identify the 1-3 pieces of evidence that most strongly support your conclusion; ask 'what if this were wrong, deceptive, or differently-interpreted?'. If the conclusion is overly sensitive, flag the dependence in the report."
  - "where do practitioners over-apply ACH? When the hypothesis-space is genuinely a continuum (e.g., 'how strong is the dollar?') rather than a discrete set of competing explanations. Forcing discrete-hypothesis structure on continuous questions distorts the analysis. Practitioner-discipline: ACH for explanation-comparison, Bayesian-update for parameter-estimation. They are complementary not interchangeable."
  - "what about deception / D&D (denial-and-deception)? Heuer specifically discusses (Ch 8 p.99) that deception hypotheses should not be rejected for lack of evidence — 'if deception is planned well and properly implemented, one should not expect to find evidence of it readily at hand'. Practitioner-discipline: include deception as a candidate hypothesis; assess what high-diagnosticity evidence WOULD reveal it; investigate that specifically. Deception is the hypothesis that satisficing-analysis is least equipped to detect."
