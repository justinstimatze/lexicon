id: lex-z3g3q
name: latent-impulse-defeats-apparent-mastery-via-unplanned-stimulus
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A person who has achieved visible, sustained self-control is shown to have suppressed rather than eliminated an underlying drive; an accidental, unplanned sensory trigger instantly reactivates the dormant impulse and overrides the accumulated discipline. This is a caution against mistaking absence of triggering stimulus for genuine resolution of an underlying vulnerability — stability under normal conditions doesn''t certify stability under a novel one. In the Jataka''s tale of Harita, years of successful meditation collapse the instant an unintended exposure occurs: the sinful feeling, that had been dwelling for countless aeons in his heart, rose up like a snake lying in a box, and put to flight his mystic meditation.'
related: []
evokes: [jataka, navanipata, harita-jataka, suppressed-not-eliminated-impulse, novel-stimulus-defeats-discipline]
lineage:
  - source: primary
    text: jataka-chalmers1895-harita-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IX (Navanipata), No. 431, Harita-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Then the sinful feeling, that had been dwelling for countless aeons in his heart, rose up like a snake lying in a box, and put to flight his mystic meditation."
canonical-instances:
  - "A recovering gambler who has stayed clean for a decade in a town with no casinos relapses within a week of a work trip that happens to route him through an airport with a betting lounge he never had to plan around avoiding before."
critical-questions:
  - "If years of stability under normal conditions don't certify anything, what test, short of an actual novel trigger, could ever tell someone their self-control is genuine rather than merely untested?"
status: active
