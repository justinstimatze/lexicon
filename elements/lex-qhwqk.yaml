  - source: primary
    text: rogoff-1957-correlation-footnote
    citation: "Natalie Rogoff, \"The Decision to Study Medicine\" (1957), p.116, footnote 11 (corrected from an initial mis-citation of p.114; see the offset note on the entry above)."
    quote: "'For the series as a whole, the correlation between age at first considering a career in medicine and number of years until the decision was made is -.62.'"
canonical-instances:
  - "Two employees are handed the same project with a fixed release date. The one who started scoping it out three weeks before the deadline 'took three weeks to decide on an approach'; the one who started the day before 'decided in a day.' Both hit the same deadline — the difference in apparent deliberation time mostly reflects when each one started, not how decisively either one thinks."
  - "Retirement age is fixed by policy at 65 for a cohort. Someone who starts thinking seriously about retirement planning at 30 will show 35 years of 'deliberation,' while someone who starts at 60 shows five — a naive read calls the first person chronically indecisive and the second decisive, when both are simply filling the gap between an arbitrary start and the same fixed endpoint."
critical-questions:
  - "How much of the -.62 correlation is this compensating-duration mechanism versus a simple ceiling/floor artifact of the measurement itself — since no one can 'decide' before they've first considered the career, and few decide after their early twenties, doesn't the fixed institutional window mechanically produce a negative correlation between start and duration even with zero real psychological compensation happening in individuals?"
  - "Does the mechanism require the fixed endpoint to be a hard external constraint (an admissions deadline, a policy age), or does it also appear when the 'deadline' is itself just a strong social norm with no formal enforcement — and if the latter, how would you tell a norm-driven convergence apart from a genuinely enforced one using only the timing data?"
status: active
