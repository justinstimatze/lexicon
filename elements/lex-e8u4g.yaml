name: violating-a-protected-boundary-discredits-whoever-guaranteed-it
type-in: state
type-out: process
_tier: atomic
agent-instruction: "In 2009, Bruce Pascoe took his wife on a North Queensland tour built around Aboriginal art and nesting turtles. One of the tour's own 'experts' boasted around the campfire of talking local police into escorting his group past a Land Council's refusal into a restricted initiation site; once inside, the group threw beer cans into the sacred water and took turns shooting them with police-issue Glock pistols. Weeks later the local Elders brought their young initiates to the same site for ceremony. Pascoe: '... they threw beer cans into the sacred water, and took it in turns to shoot the cans with police-issue Glock pistols. ... when next the local Aboriginal Elders brought their young men to the initiation site, they found it full of bullet-riddled beer cans. The most disturbing thing about the event was that it undermined the authority of the Elders. They were trying to impress on their young men the importance of maintaining culture and a responsible, alcohol-free way of life. The young men would have seen immediately that Australia had no regard for the authority of the Elders.' The violator had no stake in the Elders' standing and no plan to undermine anyone -- he was chasing a story for his own bravado. His motive turns out to be irrelevant to what actually happened: the Elders had spent years telling their initiates one specific claim, that this place is protected and their authority over it holds, and the claim failed a live test in front of the exact audience it existed to persuade. Whoever guarantees a boundary is judged by whether it holds; the violator's intent toward that guarantor is beside the point. Diagnostic move: before treating a boundary violation as damage contained to the boundary itself, locate who was standing behind it telling their own followers it would hold -- that person carries the real cost, and the bill comes due the next time those followers are watching."
