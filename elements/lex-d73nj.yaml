id: lex-d73nj
name: othering-pairs-subordinate-immanence-with-dominant-transcendence
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when a hierarchical-othering relation (gender, race, class, disability, colonized/colonizer, human/animal, human/AI, paid/unpaid labor) is analyzed as merely descriptive of inherent properties rather than as an ASYMMETRIC ASSIGNMENT of roles. Beauvoir's transferable contribution: hierarchical-othering does not just rank parties; it ASSIGNS them to STRUCTURALLY-COMPLEMENTARY ROLES. The subordinate is assigned to IMMANENCE — maintenance, repetition, care, the cyclic-given, presence-as-substance. The dominant is assigned to TRANSCENDENCE — projection, futurity, project, the historical-acting, presence-as-becoming. Beauvoir's essential claim: 'In truth, all human existence is transcendence and immanence at the same time; to go beyond itself, it must maintain itself.' Both terms are constitutive of any human existence — but hierarchical-othering PARTITIONS them across parties, assigning each party to ONLY ONE term. The result: the dominant appears as ACTIVE-PROJECTING (transcendence without immanence) and the subordinate as PASSIVE-MAINTAINING (immanence without transcendence); both appearances are SOCIALLY PRODUCED, not metaphysically given. The immanence-side is BUILT BY OFFLOADING what the transcendence-side needs to maintain itself — domestic labor offloaded from the producer to the housewife; affective labor offloaded from the master to the slave; reproductive labor offloaded from the colonizer to the colonized. Transferable applications: (a) gender (Beauvoir's original — paid producer vs domestic carer); (b) race + colonialism (Fanon 1952 *Black Skin White Masks* + Said 1978 *Orientalism* explicitly invoke Beauvoir — colonized as natural/timeless vs colonizer as historical-acting); (c) class (worker as repetition vs entrepreneur as project); (d) disability (disabled body as stuck-being vs able body as project-pursuing); (e) human/animal (animal as instinct-driven immanence vs human as rational-projecting); (f) human/AI (AI-as-tool vs human-as-deciding-subject in current AI-ethics discourse); (g) care work generally (paid vs unpaid; the carer assigned to maintenance, the cared-for to self-actualization); (h) age (the elderly assigned to fading-immanence vs young as future-projecting); (i) artistic-craft pairings (the craftsman-as-perpetuating-tradition vs artist-as-innovator). Distinct from lex-y2tbg (Butler 1990 performativity) — Butler's mechanism is performative-doing-constitutes-being; lex-d73nj is asymmetric-role-assignment under hierarchy. They compose. Distinct from lex-94nsz (Fausto-Sterling — independently-variable dimensions). Distinct from lex-jd7fe (Gramsci hegemony — cultural reproduction; lex-d73nj is the specific asymmetric-role-partition pattern within hegemonic relations). Distinct from lex-raydk (Connell hegemonic-masculinity — specific to gender; lex-d73nj is the structural primitive lex-raydk specializes). Use when (i) a hierarchical relation is treated as descriptive of inherent properties rather than as asymmetric role-assignment, (ii) the dominant party's `active` character is presented as pre-political, (iii) the subordinate party's `passive` character is presented as pre-political. Counter-move: name the offloaded immanence-side labor; ask which party is reproducing the other's transcendence; recognize that the asymmetric partition is socially produced + reversible."
