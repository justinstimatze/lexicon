    quote: "\"You imagine, Sire, that my patience dwells in the extremities of my hands and feet. It is not there, but it is deep seated somewhere else.\"... \"Think not that my patience is seated in the tips of my nose and ears: my patience is deep seated within my heart.\""
canonical-instances:
  - "A whistleblower who loses their job, then their industry reputation, then their closest professional friendships over a disclosure, tells a reporter each time that their sense of having done right doesn't live in any of those things — it's still intact regardless of what's been stripped away."
critical-questions:
  - "Is there an actual limit to how far the claimed virtue can retreat inward, or does the argument work precisely because 'the heart' is unfalsifiable — is this genuine resilience or an unfalsifiable claim that can never be tested to failure?"
  - "Does the escalating destruction itself change anything about whether the claim is true, or does the story's dramatic structure (worse mutilation, same answer) simply make repetition look like proof?"
