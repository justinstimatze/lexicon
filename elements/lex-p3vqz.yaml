evokes: [cover-agent-genuine-charity, recruit-from-those-you-helped, cascading-self-propagating-network, kautilya-secret-service-recruitment]
lineage:
  - source: primary
    text: kautilya-arthashastra-cascading-spy-recruitment
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IX 'Covert Operations,' section 'Creating the Secret Service,' 'Using Different Roles as Cover,' {1.11.5-8,10,12}."
    quote: "'These agents, having been provided with plenty of money and assistants, shall pursue a [profitable] occupation at the places assigned to them. Out of the profits, they shall give others [monks, farmers, or traders as applicable] food, clothing and shelter. Among those thus helped, the ones who want to earn money shall be recruited to act as spies using the appropriate cover. They shall swear loyalty to the king and be promised payment of salaries and expenses. With the new recruits also recruiting others, a network of spies shall be set up.'"
canonical-instances:
  - "A multi-level community-health program trains local volunteers who genuinely help their neighbors access real medical care and supplies, and then recruits the next round of volunteers specifically from among the people that help reached — rather than advertising for volunteers broadly, the program grows through people who have direct, grateful, first-hand experience of the program's value, and each new volunteer repeats the same local-help-then-recruit cycle."
  - "A software company's developer-relations team builds real, freely useful open-source tooling with no strings attached, then recruits its most engaged users — the ones who benefited enough to become vocal advocates — into a paid developer-advocate program, who in turn identify and recruit the next cohort of advocates from among the users their own advocacy work reaches."
critical-questions:
  - "at what point does 'genuine help creates a debt of gratitude that makes recruitment land differently' cross into manipulation — is there a meaningful ethical line between this mechanism and a predatory scheme that also provides real initial value specifically to make a later ask harder to refuse, given that Kautilya's own version was explicitly designed to be persuasive rather than to be purely disinterested charity?"
  - "does the cascading structure actually compound recruitment capacity, or does quality degrade with each layer — a monk's monk's monk's recruit may share less of the original organizer's judgment, training, and loyalty, and Kautilya's text doesn't specify what quality-control mechanism (if any) prevents the network from drifting as it grows further from its origin?"
  - "how would an organization verify, at scale, that the 'real help' being provided at the base of the cascade is actually real and valuable rather than merely instrumental theater staged to manufacture the gratitude the recruitment pitch depends on — is there a way to distinguish the two from outside the organization, or only from inside it?"
