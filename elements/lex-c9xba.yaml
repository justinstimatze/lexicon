lineage:
  - source: primary
    text: bohm-1980-2005-wholeness-and-the-implicate-order-ch6-7
    citation: "David Bohm, *Wholeness and the Implicate Order* (Routledge 1980; 2005 ed., ISBN 9780203995150). Chapters 6 ('The Enfolding-Unfolding Universe and Its Implications') and 7 ('The Enfolding-Unfolding Universe and Consciousness'). The implicate-order claim is stated explicitly: 'in the enfolded order, space and time are no longer the dominant factors determining the relationships of dependence or independence of different elements. Rather, an entirely different sort of basic connection of elements is possible, from which our ordinary notions of space and time, along with those of separately existent material particles, are abstracted as forms derived from the deeper order. These ordinary notions in fact appear in what is called the explicate or unfolded order, which is a special and distinguished form contained within the general totality of all the implicate orders.' Canonical analogues: the hologram (each region of the plate contains the whole image enfolded); the treacle-and-ink-droplet experiment (stirring distributes the ink such that the original drop's structure is enfolded into the grey; reverse stirring reconstitutes the drop, showing the structure was preserved even when invisible). Bohm extends the claim to the 'holomovement' — the unbroken totality of all enfolded orders. In-copyright (Routledge); verbatim quotation short and attributed under fair-use. The transferable atom extracts the STRUCTURAL CLAIM (fragments as partial-unfoldings of a shared enfolded whole) without committing to the QM-interpretive controversy. Bohm's de Broglie-Bohm pilot-wave interpretation of quantum mechanics is a minority position in physics; the structural claim (enfold/unfold relation) transfers cleanly to non-physics domains independent of the QM commitment. Distinct from lex-bwubx the-fold (Deleuze's structural fold) — Bohm's implicate-order is about simultaneous enfolding of a whole into each region; Deleuze's fold is about the topological doubling of inside/outside. They are related — both name structural-enfolding patterns — but distinct. Distinct from lex-gfxw3 recursive-composition: recursion is iterated self-application; implicate is simultaneous enfolded co-presence. Distinct from lex-wup2r gnomonic-growth: gnomonic is process-dynamic self-similarity; implicate is static structural enfolding. Cross-domain transfer attestation: Pribram 1971 holographic-brain hypothesis (information distributed-enfolded across cortical regions, partial damage produces partial degradation rather than localized loss); morphogenetic-field tradition (Sheldrake — though contested; cleaner version: Bonner 1952 on cellular slime mold; Turing 1952 on morphogenesis); modern distributed-representation in neural networks (Hinton et al. 1986 distributed representations; Mikolov 2013 word2vec semantic enfolding); information-theoretic redundancy (Shannon 1948 — each bit-position carries some information about the whole message under suitable encoding)."
    quote: "[Bohm 1980 *Wholeness and Implicate Order* Ch.6:] 'In the enfolded order, space and time are no longer the dominant factors determining the relationships of dependence or independence of different elements. Rather, an entirely different sort of basic connection of elements is possible, from which our ordinary notions of space and time, along with those of separately existent material particles, are abstracted as forms derived from the deeper order. These ordinary notions in fact appear in what is called the explicate or unfolded order, which is a special and distinguished form contained within the general totality of all the implicate orders.' [Same chapter, the hologram analogue:] 'in each region of space, the order of a whole illuminated structure is enfolded and carried in the movement of light. [...] What carries an implicate order is the holomovement, which is an unbroken and undivided totality. In certain cases, we can abstract particular aspects of the holomovement (e.g., light, electrons, sound, etc.), but more generally, all forms of the holomovement merge and are inseparable.' [Same chapter, the treacle-droplet:] 'If an insoluble droplet of ink is placed in the fluid and the stirring device is set in motion, the ink drop is gradually transformed into a thread that extends over the whole fluid. The latter now appears to be distributed more or less at random so that it is seen as some shade of grey. But if the mechanical stirring device is now turned in the opposite direction, the transformation is reversed, and the droplet of dye suddenly appears, reconstituted. [...] When the dye was distributed in what appeared to be a random way, it nevertheless had some kind of order which is different, for example, from that arising from another droplet originally placed in a different position. But this order is enfolded or implicated in the grey mass.' [Bohm presents the enfold/unfold relation as substrate-level structural primitive, not just as a QM interpretation — Ch.6 frames it as relevant to physics, consciousness, and the structure of cognition.]"
canonical-instances:
  - "Hologram (Gabor 1948+, applied by Pribram 1971 to brain): each region of a holographic plate contains the whole image enfolded; cutting the plate in half produces TWO complete (lower-resolution) images, not two half-images. Pribram's transferable extension: brain damage often produces graceful degradation rather than localized loss, consistent with distributed-enfolded representation."
  - "Bohm's treacle-and-ink-droplet experiment (Ch.6): stirring an ink drop into viscous fluid produces an apparent grey; reverse-stirring reconstitutes the drop. The structure was enfolded into the grey, not destroyed. The canonical lab demonstration that 'random distribution' can contain structure enfolded into the position-correlations of each element."
  - "Distributed representation in modern neural networks (Hinton 1986+; Mikolov 2013 word2vec): a concept like 'king' is not encoded at one position but enfolded across thousands of weight values; the concept can be recovered by unfolding (projection); the same weights enfold many concepts simultaneously. The implicate-order pattern is the structural basis of modern ML's transfer-learning success."
  - "Market price (one possible implicate-order reading): each bidder has partial-information about a hypothesized 'true' implicate-state of supply/demand/future-expectation; the observed price is a partial-unfolding of that enfolded state via the bidding mechanism. Hayek 1945 'The Use of Knowledge in Society' is the same structural claim under different vocabulary (price as a partial-unfolding of distributed-enfolded knowledge)."
  - "Distinguished from lex-bwubx the-fold (Deleuze): Deleuze's fold is the topological doubling of inside/outside (the inside as folded-in outside); Bohm's implicate is the simultaneous enfolding of a whole into each region. Both name structural-enfolding patterns but at different levels of abstraction."
  - "Distinguished from holism-as-philosophical-claim: holism asserts that wholes have properties not reducible to parts; implicate-order specifies HOW the unreducibility works — the parts are partial-unfoldings of an enfolded whole, not separate-entities-plus-emergent-properties. Holism is the claim; implicate-order is one specific structural mechanism for the claim."
  - "Failure mode — not every fragmented system has an implicate order: some fragments really are independent (the stones on a beach do not enfold a shared whole). The atom is a HEURISTIC for surfacing implicate-order hypotheses, not a metaphysical commitment. Test: do multiple partial-unfoldings (observations from different angles, different times, different perspectives) co-vary in ways predicted by a shared enfolded structure? If yes, implicate-order is operative. If no, the fragments are independent."
critical-questions:
  - "What is the candidate enfolded whole, and what mechanism would unfold it into each partial fragment? Vague 'everything is connected' invocations don't qualify. The atom requires NAMING the enfolded structure and the unfolding mechanism. Diagnostic: 'if I knew the implicate whole, could I predict the specific fragments?' If yes, implicate-order is operative."
  - "Do multiple partial fragments co-vary in ways predicted by the hypothesized whole? Implicate-order makes a falsifiable prediction: partial observations should be COHERENT with each other (because they share the enfolded source). If they're independent, the hypothesized whole isn't there."
  - "Are you using implicate-order to dismiss real fragmentation? The atom names a structural hypothesis, not a guarantee. Some systems really are fragmented (lex-eybad Mill heteropathic-effects names the failure mode of treating emergent systems as decomposable). Don't smuggle wholeness in where the evidence isn't there."
  - "Is the analogue (hologram, treacle) decisive or decorative? Bohm's physical analogues are illustrative of a structural relation; the atom is portable to non-physical domains EXACTLY when the enfold/unfold relation holds, not when 'it looks like a hologram.' Test the structural relation directly, not by analogue-resemblance."
  - "How does the atom relate to lex-5qv7q latticework-of-models? The latticework is the multi-disciplinary scaffold for retrieving facts; implicate-order is one specific structural pattern that the latticework includes. They compose: the implicate-order pattern is one model in the latticework, deployable when fragments seem to share an enfolded source."
