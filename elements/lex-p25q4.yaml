id: lex-p25q4
name: action-reified-as-object-enables-deferred-execution-queue-and-undo
type-in: process
type-out: structure
_tier: atomic
agent-instruction: "When designing actions that need queueing, undo, scheduling, or logging, surface that reifying the action as an object (Command pattern) decouples invoker from receiver and enables all four — distinct from straight function calls."
related: [lex-9akfh, lex-z8m97, lex-gbmev, lex-dwycr, lex-sjsae, lex-ew7zx, lex-etfhv, lex-cqvnu, lex-p77e7]
scaffolds-from: [lex-9akfh]
evokes: [gof-command-pattern, action-as-data, the-verb-becomes-a-noun, undo-history, command-queue, transaction-log, cqrs-command-side]
lineage:
  - source: practitioner
    text: wikipedia-command-pattern-2025-12
    citation: "Wikipedia 'Command pattern' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Command_pattern). Underlying primary is Gamma, Helm, Johnson, Vlissides 1994 *Design Patterns: Elements of Reusable Object-Oriented Software* (Addison-Wesley). The substrate-claim: a method-call (action) can be REIFIED — stored as a first-class object containing the method-name, the target-receiver, and the parameter-values — so the action can be invoked later, queued, logged, undone, or transmitted across a boundary. The reification transforms a verb (do-this-now) into a noun (a-doing-this) that can be manipulated by ordinary data-handling tools. The transferable shape is THE-VERB-BECOMES-A-NOUN: any operation that would normally be a synchronous method-call can be made deferrable, replayable, auditable, and reversible by packaging it as data."
    quote: "[Wikipedia 'Command pattern', 2025-12 ZIM snapshot:] 'the command pattern is a behavioral design pattern in which an object is used to encapsulate all information needed to perform an action or trigger an event at a later time. This information includes the method name, the object that owns the method and values for the method parameters.' [On the canonical four-role structure:] 'Four terms always associated with the command pattern are command, receiver, invoker and client. A command object knows about receiver and invokes a method of the receiver. Values for parameters of the receiver method are stored in the command. The receiver object to execute these methods is also stored in the command object by aggregation. The receiver then does the work when the execute() method in command is called. An invoker object knows how to execute a command, and optionally does bookkeeping about the command execution. The invoker does not know anything about a concrete command, it knows only about the command interface.' [The substrate-claim is the REIFICATION of an action — the method-call becomes a first-class object (Command) that bundles together everything needed to invoke it later, decoupling the WHEN/WHERE/WHETHER of execution from the WHAT of the action. The invoker-knows-only-the-interface decoupling enables queue, log, undo, and replay infrastructure on top of the command-stream. One of the 23 GoF behavioral patterns (Gamma-Helm-Johnson-Vlissides 1994).]"
canonical-instances:
  - "Undo history in document editors: every user-action (type-character, delete-line, paste, format-change) is stored as a Command object on a stack. Ctrl-Z pops and invokes the inverse-action; Ctrl-Y re-pushes and re-invokes. Without command-reification, undo requires snapshotting full document state."
  - "Job queues / task queues: Celery, Sidekiq, BullMQ, AWS SQS — a producer reifies 'do-this-thing-with-these-args' as a serialized command-object; a worker pool pops and executes them. The reification is what enables persistence, retry, fan-out, and rate-limiting infrastructure."
  - "Database transaction logs: every state-change (INSERT, UPDATE, DELETE with params) is reified as a log-entry; the log is the source-of-truth, the current-state is replayable from the log. Write-ahead-log (WAL), binlog, redo-log all instantiate command-reification."
  - "CQRS command-side: Command-Query-Responsibility-Segregation reifies write-operations as explicit Command objects (PlaceOrderCommand, UpdateAddressCommand) routed through a command-bus to handlers. Enables auditability, event-sourcing, scaling write-path independently."
  - "Macros / scriptable actions: recording a sequence of actions as a list of Command objects so they can be replayed. Photoshop actions, Vim macros, Emacs keyboard-macros are all command-stream reifications."
  - "GUI menu actions decoupled from triggering widgets: a 'Save' command may be wired to a menu-item, a toolbar-button, a keyboard-shortcut, AND a context-menu — each invoker references the SAME Command object; the action's definition lives in one place."
  - "operationally distinct from lex-9akfh decoupling-via-indirection: lex-9akfh names the broad design-rule (interpose an abstraction); lex-p25q4 is the specific operational case where the abstraction is an ACTION OBJECT bundling method+receiver+params. The reification is what enables the queue/log/undo capabilities — generic decoupling doesn't."
  - "operationally distinct from lex-gbmev observer-pattern: observer notifies of state-change; command reifies an action-to-be-performed. Observer is signal-direction (subject→observer); command is execution-deferral (invoker queues; receiver executes later)."
  - "operationally distinct from lex-dwycr strategy-pattern: strategy SELECTS which algorithm to execute now; command STORES which action to execute later. Strategy is runtime-polymorphism over algorithms; command is reification-of-action-for-deferred-handling."
  - "compose-related with lex-z8m97 gof-decorator: a command object can be DECORATED (logged-command wraps command; retry-command wraps command; throttled-command wraps command) — composing command-objects gives middleware-like cross-cutting concerns on the action-stream."
  - "compose-related with event-sourcing: storing a command-log enables event-sourcing — system state is a fold over the command-history. The reification is what makes events first-class."
critical-questions:
  - "when is command-reification wrong vs direct-call? If the action is always synchronous, never undone, never queued, never logged, and the receiver is stable — direct method-call is simpler and clearer. Command pays off when at least one of (queue, log, undo, replay, distribute, decouple-from-trigger) is in the requirements. Reifying without such requirements adds ceremony with no benefit."
  - "how is the undo-action specified? Two paradigms: (a) every Command object carries its own undo() method that knows how to reverse the action; (b) a Memento or pre-snapshot is stored alongside the Command, and undo restores the snapshot. Option (a) is more granular but harder to implement for actions with complex side-effects; option (b) is simpler but stores more state. Hybrid: command stores diffs (compact memento)."
  - "what about command-failure mid-execution? Atomicity matters when commands are processed in batch: if command N fails after N-1 succeeded, is the state rolled-back, or is the partial-state acceptable? Practitioner-discipline: specify command-execution semantics up-front (all-or-nothing vs best-effort vs explicit-compensation)."
  - "does the substrate-claim require object-orientation? No — function-pointers with bound arguments, closures, and tagged-union message-types are all equivalent reifications. Erlang/Elixir message-passing, Redux action-objects, Clojure data-as-action are all command-pattern in non-OO clothing. The substrate-claim is REIFICATION-OF-ACTION-AS-DATA, not the OO implementation."
severity-tier: info
status: active
