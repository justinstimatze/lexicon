evokes: [merton-reader-kendall-coleman-selvin-1957, appendix-c-significance-tests, total-population-not-a-sample, random-sampling-premise, no-sampling-error-to-test]
lineage:
  - source: primary
    text: appendix-c-1957-total-student-bodies-not-samples
    citation: "Robert K. Merton, George G. Reader, and Patricia L. Kendall, eds., Appendix C, \"Note on Significance Tests,\" in The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.303 (editors' note credits Dr. James Coleman and Dr. Hanan C. Selvin with contributing to the formulation of some of these points)."
    quote: "'these tests presuppose that the units being studied were sampled randomly from the populations to which they belong. We have administered our questionnaires to the total student bodies of three medical schools; in no sense can these groups be considered random samples, or even, for that matter, samples. There is a real question, therefore, whether there would be any justification at all for making use of traditional tests of significance.'"
canonical-instances:
  - "A company runs an engagement survey of every single employee (not a sample) and finds the engineering department scores 4 points lower than sales — reporting a 'p-value' for that gap is a category error, since there is no larger population of 'possible employees' this data was randomly drawn from; the 4-point gap is simply a fact about this company's two departments as they actually are, not an estimate with sampling uncertainty around it."
  - "An election analyst who has the FULL vote count for every precinct treats a 2-point margin between two candidates as needing a 'significance test' to determine if it's 'real' — but the full count IS the population, not a sample of it, so there's no sampling error to test; the 2-point margin is simply how the vote came out, and no error is more real than that."
critical-questions:
  - "Does the total-population objection dissolve once the researchers want to generalize beyond these three specific schools to medical students in general — at that point aren't these three schools functioning AS a sample (of some larger, if unformalized, population of medical schools), even though no formal random-sampling procedure selected them, reintroducing exactly the kind of inferential question a significance test is meant to address?"
  - "If the goal is only to describe these three schools as they actually are, is any inferential statistic appropriate at all, or does the total-population point argue for abandoning inferential statistics (not just significance tests specifically) in favor of purely descriptive reporting — and if descriptive reporting is the real implication, does the appendix's later substitute criteria (internal and replicative consistency) function as inferential statistics in disguise, smuggling generalization back in through a different door?"
