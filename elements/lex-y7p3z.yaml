id: lex-y7p3z
name: argument-from-cause-to-effect-as-defeasible-forward-prediction-from-causal-generalization
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When predicting an effect from a cause, name the causal generalization you're invoking and check whether it actually applies to this case. Forward causal inference is defeasible at both joints: the generalization may not hold, or this case may not be a generalization-fit."
related: [lex-af9ax, lex-kebfa, lex-th68b, lex-hesjt, lex-8j5ms, lex-9exaw, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-7t3wr, lex-tpv83, lex-chtk9, lex-9uac6, lex-xqamc, lex-33p2a, lex-zfgj2, lex-ht9ud]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt, lex-ht9ud]
evokes: [causal-prediction, hastings-warrant, toulmin-warrant, predictive-inference, defeasible-generalization, forward-causal-inference, dual-of-sign, hume-induction]
premises:
  - "generally, if A occurs, then B will (might) occur (the causal-generalization premise, defeasible)"
  - "in this case, A occurs (or might occur)"
  - "therefore, in this case, B will (might) occur (the predicted-effect conclusion, defeasible)"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(retrieve-causal-generalization, verify-cause-instantiation) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "how strong is the causal generalization (if it is true at all)? CQ1 (Hastings 1963 p.70 / Walton 1996 p.74). Causal generalizations vary from law-like (gravity, thermodynamics) to weak statistical (most people in situation X do Y). Forward prediction is licensed only in proportion to the generalization's strength + the specific case's match to its scope. Diagnostic: 'what's the warrant-strength evidence — case-controlled experiments, mechanism understood, or just observed regularity?'"
  - "is the evidence cited (if there is any) strong enough to warrant the generalization as stated? CQ2. Often the causal-generalization is asserted without the evidence-trail that would warrant the modal claim ('will' vs 'might' vs 'tends to'). Diagnostic: 'when the generalization was first established, what data supported it, and is the current case within that data's sampling scope?'"
  - "are there other factors that would or will interfere with or counteract the production of the effect in this case? CQ3. The causal scheme presumes a closed-system or all-else-equal background; reality often presents interfering factors that break the generalization in the specific case. Diagnostic: 'what would have to be true of the current case for the generalization to fail, and is any of that true?'"
  - "is the causal-generalization symmetric forward-and-backward, or only forward? Forward cause-to-effect (predict outcome from cause) is structurally distinct from effect-to-cause (lex-xhwqt sign — abductive). When the same generalization is deployed bidirectionally (cause A causes B; therefore observing B implies cause A), the scheme is implicitly nesting both forms, and EACH direction needs its own CQ apparatus. Diagnostic: surface which direction is currently essential"
  - "is the action of acting on the predicted effect going to change the system enough to break the underlying causal generalization? Like consequence-scheme (lex-7t3wr), forward causal-prediction can be self-defeating when the act of prediction or preparation alters the predicted state. Financial-market predictions, public-health interventions premised on predicted trajectories, political-polling predictions — all face this defeat mode. lex-z3qjg (acted-on-belief-causes-confirmation) gives the substrate machinery"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.5 §2 'Argument from Cause to Effect' (pp.167-169). Scheme attributed to Hastings 1963 p.69 (Toulmin-line-diagram with conditional warrant) + Walton 1996 p.73 (transferable formulation). Three critical questions (Hastings p.70 / Walton 1996 p.74). Compendium Ch.9 #28 'Argument from Cause to Effect' (p.328). Walton-Reed-Macagno note Perelman + Olbrechts-Tyteca 1969 p.262 ('tending to show the effect which must result from a given event'), van Eemeren + Kruiger 1987 p.74, and Grennan 1997 p.187 (warrant-backing 'events of one kind cause events of another kind') as parallel formulations. The scheme is FORWARD causal-inference: from cause instantiation + causal generalization to predicted-effect; structurally dual to argument-from-sign (lex-xhwqt) which is the BACKWARD effect-to-cause inference."
    quote: "[Ch.5 §2 p.168] Argument from Cause to Effect. Generally, if A occurs, then B will (might) occur. In this case, A occurs (might occur). Therefore, in this case, B will (might) occur. (Walton, 1996, p. 73) The conditional in the major premise represents a kind of sufficiency relation. But it is not one that expresses the idea that if A occurs, then B must necessarily occur. The conditional is not absolute, like the material conditional of deductive logic. It is merely a generalization that is defeasible. All it warrants is that if A occurs in a particular context that an agent is familiar with, then the agent can reasonably expect B to occur as well, subject to possible exceptions as the agent comes to acquire new information. But should such information come into the dialogue, the agent must be prepared to give up the argument and retract the conclusion he previously accepted. [...] [Critical Questions, p.169, Hastings 1963 p.70 / Walton 1996 p.74] C1: How strong is the causal generalization (if it is true at all)? C2: Is the evidence cited (if there is any) strong enough to warrant the generalization as stated? C3: Are there other factors that would or will interfere with or counteract the production of the effect in this case?"
  - source: primary
    text: hume-1748-enquiry-iv-v
    citation: "David Hume, *An Enquiry Concerning Human Understanding* (1748), Section IV 'Sceptical Doubts Concerning the Operations of the Understanding' §§20-33 (Selby-Bigge §§20-33) + Section V 'Sceptical Solution of These Doubts' §§34-38, esp. §V.36 on Custom or Habit. PD; in the lexicon corpus. Hume's treatment is foundational-skeptical, methodologically-distinct from Walton-Reed-Macagno along three axes: (1) Foundational vs dialectical: Hume asks 'what justifies cause-to-effect inference at all?' and answers 'nothing in reason — only the customary association produced by constant conjunction'; Walton asks 'when does the scheme fail?' and gives a critical-question apparatus, presupposing the inference is licensed when CQs are answerable. (2) Custom/Habit vs critical-questions: Hume locates the inferential commitment in pre-rational, pre-critical habit ('After the constant conjunction of two objects—heat and flame, for instance, weight and solidity—we are determined by custom alone to expect the one from the appearance of the other'); Walton locates it in defeasible-presumptive dialectical commitment subject to CQ challenge. (3) Skeptical-epistemology vs argumentation-theory: Hume's project is epistemic-foundational (the canonical 'problem of induction' — no rational ground for the uniformity premise); Walton's project is argumentation-theory (scheme catalog for dialogue). Together: Hume's §IV-V is the foundational worry that explains WHY the scheme needs CQs at all (the inference is not deductively valid; the major-premise generalization is itself defeasible because grounded in custom not in necessity); Walton's CQ apparatus is the practical dialectical instrument that operationalizes Hume's foundational skepticism into a usable everyday-reasoning protocol. Hume's analysis is also the originating English-language identification of the conditional-as-defeasible structure that Walton/Hastings/Toulmin formalize 200 years later."
    quote: "[§IV.22] All reasonings concerning matter of fact seem to be founded on the relation of Cause and Effect. By means of that relation alone we can go beyond the evidence of our memory and senses. [...] [§IV.23] If we would satisfy ourselves, therefore, concerning the nature of that evidence, which assures us of matters of fact, we must enquire how we arrive at the knowledge of cause and effect. I shall venture to affirm, as a general proposition, which admits of no exception, that the knowledge of this relation is not, in any instance, attained by reasonings a priori; but arises entirely from experience, when we find that any particular objects are constantly conjoined with each other. [...] [§IV.31] From causes which appear similar we expect similar effects. This is the sum of all our experimental conclusions. [...] [§V.35-36] Suppose [a person]... has lived so long in the world as to have observed familiar objects or events to be constantly conjoined together; what is the consequence of this experience? He immediately infers the existence of one object from the appearance of the other. Yet he has not, by all his experience, acquired any idea or knowledge of the secret power by which the one object produces the other; nor is it, by any process of reasoning, he is engaged to draw this inference. But still he finds himself determined to draw it: And though he should be convinced that his understanding has no part in the operation, he would nevertheless continue in the same course of thinking. There is some other principle which determines him to form such a conclusion. This principle is Custom or Habit. For wherever the repetition of any particular act or operation produces a propensity to renew the same act or operation, without being impelled by any reasoning or process of the understanding, we always say, that this propensity is the effect of Custom. [...] And it is certain we here advance a very intelligible proposition at least, if not a true one, when we assert that, after the constant conjunction of two objects—heat and flame, for instance, weight and solidity—we are determined by custom alone to expect the one from the appearance of the other."
canonical-instances:
  - "weather forecasting: 'low-pressure system over the Pacific will produce rain over Seattle in 36 hours' — pure cause-to-effect scheme; CQ1 fires on warrant-strength (numerical model + observed initial state), CQ3 on interfering factors (mesoscale features, sea-state changes)"
  - "engineering load prediction: 'this beam at this span under this load will deflect 4mm' — cause-to-effect deployed in design; the structural-engineering practice IS the institutionalized form of the scheme, with safety-factors as the operational expression of CQ2 + CQ3 buffers"
  - "epidemiological projection: 'with R₀=2.1 and no intervention, this outbreak will reach 50% prevalence by week 8' — cause-to-effect at population scale; CQ5 (self-defeat) is the canonical issue because the projection itself drives the intervention that breaks the trajectory"
  - "drug dosing: 'this dose in this weight-class will achieve target plasma concentration in 90 minutes' — cause-to-effect from pharmacokinetic generalization; CQ1 (warrant-strength) is what dose-response trials establish, CQ3 (interfering factors) is the individual-variation gate that motivates therapeutic-drug-monitoring"
  - "historical counter-factuals: 'if Britain had not entered WWI, would WWII have occurred?' — cause-to-effect deployed across distant counterfactual; CQ1 is the canonical hard case (warrant-strength for one-shot historical events is unwarranted), CQ3 is the interference gate that makes such counterfactuals notoriously weak"
  - "tool-output prediction: 'this build configuration with these dependencies will produce this artifact' — cause-to-effect at engineering scale; build-reproducibility practice IS the discipline of making CQ1 + CQ3 maximally strong (deterministic builds, locked dependencies, sandboxed environment)"
  - "Walton's bear-tracks contrast (Ch.5 §3 pp.169-170): cause-to-effect would be 'a bear is in the area; therefore tracks should be visible' (forward prediction); the actual canonical bear-tracks reasoning ('tracks visible; therefore a bear passed') is argument-from-sign (lex-xhwqt, abductive backward); the two are structurally dual"
  - "Aristotle's NE deliberation example reframed: 'if I take this medicine, I will recover' — cause-to-effect prediction is what practical deliberation USES; argument-from-consequences (lex-7t3wr) is the action-recommendation downstream of the cause-to-effect prediction"
