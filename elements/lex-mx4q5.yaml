lineage:
  - source: primary
    text: bell-1964-on-the-einstein-podolsky-rosen-paradox
    citation: "J. S. Bell, 'On the Einstein Podolsky Rosen Paradox' Physics Vol.1 No.3 (1964) pp.195-200. Section IV 'Contradiction' proves the inequality (equation 22 in the paper) and Section VI 'Conclusion' draws the locality consequence."
    quote: "'In a theory in which parameters are added to quantum mechanics to determine the results of individual measurements, without changing the statistical predictions, there must be a mechanism whereby the setting of one measuring device can influence the reading of another instrument, however remote. Moreover, the signal involved must propagate instantaneously, so that such a theory could not be Lorentz invariant.' [Verified 2026-08-19 against the real paper: exact match; this span had never been quote-marked, so it was passing the checker's looser unquoted-prose check by coincidence rather than being confirmed as a verbatim claim.]"
  - source: primary
    text: bell-1964-formulation
    citation: "Same paper, Section II 'Formulation' stating the locality assumption that Bell will show is incompatible with QM correlation predictions for the singlet state."
    quote: "'The vital assumption is that the result B for particle 2 does not depend on the setting a, of the magnet for particle 1, nor A on b.' [Verified 2026-08-19 against the real paper: exact match, with a footnote marker '[2]' interleaved into the body text right after 'vital assumption'.]"
  - source: cross-attestation
    text: "Aspect, Dalibard, Roger 1982 Phys. Rev. Lett. 49:1804-1807 'Experimental Test of Bell's Inequalities Using Time-Varying Analyzers' — first experiment to switch polarizer orientations during photon flight, closing the locality-loophole and confirming violation of Bell's inequality by ~5 standard deviations."
  - source: cross-attestation
    text: "Hensen et al. 2015 Nature 526:682-686 'Loophole-free Bell inequality violation using electron spins separated by 1.3 kilometres' — closed the locality AND detection loopholes simultaneously, giving the first experimentally complete refutation of local realism. The 2022 Nobel Prize in Physics (Aspect, Clauser, Zeilinger) recognized this experimental tradition."
  - source: cross-attestation
    text: "EPR 1935 (Einstein, Podolsky, Rosen, Phys. Rev. 47:777-780) is the paper Bell's theorem answers. EPR argued quantum mechanics must be incomplete because two spatially separated systems could have predetermined values — Bell shows the assumption of predetermined values plus locality is itself inconsistent with QM predictions."
  - source: cross-attestation
    text: "Kochen-Specker 1967 — contextuality theorem proving even single-particle hidden-variable assignments cannot reproduce QM if measurement outcomes are required to be context-independent. Different no-go result, same conceptual move: rule out a CLASS of explanations by deriving a contradiction with quantum predictions."
  - source: cross-attestation
    text: "Tsirelson 1980 — proved the quantum maximum for the Bell-CHSH expression is 2√2, strictly less than the algebraic maximum of 4. Tsirelson's bound shows QM is nonlocal but not maximally nonlocal — there are conceivable theories that violate Bell's inequality MORE than QM does. Why nature stops at 2√2 is an open question (the 'information causality' principle is one proposed answer)."
  - source: cross-attestation
    text: "Mermin 1985 Physics Today 38(4):38-47 'Is the moon there when nobody looks? Reality and the quantum theory' — pedagogical reformulation of Bell using a three-detector-setting device that makes the locality+realism conflict obvious without algebraic machinery. Standard introductory exposition."
  - source: cross-attestation
    text: "Hardy 1993 Phys. Rev. Lett. 71:1665-1668 'Nonlocality for two particles without inequalities for almost all entangled states' — derived Bell-type contradictions for nearly all entangled states using only logical reasoning about probabilities (no inequality required). Shows the deep structural nature of the no-go."
  - source: cross-attestation
    text: "Pironio et al. 2010 Nature 464:1021-1024 'Random numbers certified by Bell's theorem' — turns the theorem into a device-independent randomness-certification protocol. If your detectors violate Bell, you can prove the output bits are unpredictable to any adversary without trusting the device. Foundation of device-independent quantum cryptography."
  - source: cross-attestation
    text: "Wood and Spekkens 2015 New J. Phys. 17:033002 'The lesson of causal discovery algorithms for quantum correlations' — shows Bell's theorem is equivalent to saying no classical causal model (DAG) of the EPR setup can reproduce QM correlations without fine-tuning. Connects Bell to Judea Pearl's causal-inference framework explicitly."
canonical-instances:
  - "The singlet state of two spin-1/2 particles: spins always anti-correlated when measured along the same axis, with cos²(θ/2) correlation when measured along axes differing by angle θ. No local hidden-variable theory reproduces this dependence; Bell's inequality bounds what local theories can give at 2; QM and nature give 2√2 (the CHSH version, Clauser-Horne-Shimony-Holt 1969)."
  - "Aspect-Dalibard-Roger 1982 PRL experiment: cascade-emitted photon pairs from calcium, polarizer orientations switched faster than light could traverse the apparatus, Bell inequality violated by ~5σ. First closure of the locality loophole."
  - "Hensen et al. 2015 Delft experiment: electron-spin pairs in NV centers separated by 1.3 km, with high detection efficiency closing the fair-sampling loophole simultaneously with locality. First fully loophole-free violation."
  - "QKD device-independent protocols (Mayers-Yao 1998, Acín et al. 2007): security guaranteed by Bell violation alone, no trust in device internals required. The no-go theorem becomes a positive cryptographic resource."
  - "Pearl-style causal-model analyses (Wood-Spekkens 2015): no DAG over (measurement settings, hidden variables, outcomes) without fine-tuning of parameters can reproduce the QM correlation function. The no-go becomes a constraint on causal structure."
  - "EPR 1935: original argument that QM must be incomplete because either (a) reality has predetermined values and locality is preserved, or (b) one rejects realism. Bell's theorem proves option (a) is itself inconsistent with QM."
critical-questions:
  - "Have I assumed the system's correlations CAN be explained by hidden local variables without checking whether the data violates a Bell-type bound?"
  - "When defending an explanatory frame against anomalous data, am I defending against a specific candidate alternative or against a structural impossibility argument?"
  - "Which assumption am I willing to give up if forced — locality, realism (predetermined outcomes), or measurement-independence (free choice of measurement setting)? The 'superdeterminism' loophole exists but most physicists treat it as too costly."
  - "If I claim 'no theory of type X can do Y,' what is the proof bound? Am I making a no-go claim or a no-candidate claim? They have very different burdens."
  - "Does my framework treat distant correlations as evidence of communication, predetermination, or something genuinely new? Bell shows nature is the third option."
