id: lex-awabk
name: a-closed-question-forces-an-admission-that-grief-changes-nothing
type-in: process
type-out: posture
_tier: atomic
agent-instruction: 'Rather than telling a grieving person to stop grieving, a counselor asks a single closed question the sufferer cannot answer any way but one: will grieving bring back what was lost? Once the sufferer admits, in their own words, that it will not, the conclusion — so why grieve — arrives as something the sufferer has effectively told themselves, not an instruction imposed from outside. The same three-beat structure (will X undo it? no. then why do X?) can be redeployed verbatim on a second grief within the same conversation, since its force comes from the logical form rather than the specific content being grieved. In the Kama-Jataka, the Buddha uses this exact structure twice on two different sufferers: ''will what is lost come back for grieving?''—''No... that will it not.''—''If that is so, why grieve?'' with a brahmin over a ruined harvest, and again, nearly verbatim, with a king over three lost cities: ''can you capture those cities by grieving?''—''Why no.''—''Since that is so, why grieve?'''
related: []
evokes: [jataka, dvadasanipata, kama-jataka, socratic-futility-of-grief-question, closed-question-elicits-self-supplied-conclusion]
lineage:
  - source: primary
    text: jataka-chalmers1895-kama-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 467, Kama-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Why, will what is lost come back for grieving?"—"No, Gotama, that will it not."—"If that is so, why grieve?'
canonical-instances:
  - 'A financial advisor asks a client spiraling over a stock-market loss whether worrying about it will get his money back. He admits it won''t. Only then does she say, ''so let''s spend this hour on what you can still control'' — a redirection the client arrived at himself before she ever voiced it.'
critical-questions:
  - 'The same closed question is used twice in one tale for two very different losses (a ruined harvest, a lost political prospect) — does the argument''s force actually depend on the specific loss being genuinely irrecoverable, and does it work equally well on a loss the sufferer could, with effort, still do something about?'
status: active
