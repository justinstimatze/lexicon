id: lex-rpz7p
name: extra-institutional-opposition-tactics-backfire-against-a-norm-breaking-incumbent
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When facing an incumbent who is already breaking democratic norms, resist the pull toward extraconstitutional resistance — a coup attempt, an indefinite general strike, an election boycott — even though the incumbent started it. Levitsky and Ziblatt, on Venezuela's anti-Chávez opposition: 'Not only did they fail to knock Chávez out, but they eroded the opposition's public support, allowed Chávez to tag his rivals as antidemocratic, and handed the government an excuse to purge the military, the police, and the courts, arrest or exile dissidents, and close independent media outlets.' ... On Colombia's anti-Uribe opposition, which stuck to congress and the courts instead: 'This made it more difficult for Uribe to question his opponents' democratic credentials or justify cracking down on them. [...] The lesson is this: Where institutional channels exist, opposition groups should use them.' Stepping outside the institutions does three things at once, all of them bad for the opposition: it hands the incumbent a legitimate-sounding target ('extraconstitutional threat') to unify supporters against, it converts the opposition's own moral standing into the very thing being litigated instead of the incumbent's conduct, and it supplies the public justification for a crackdown the incumbent may have wanted to carry out anyway. Working the existing channels, even slowly and even when those channels are already compromised, denies the incumbent that justification."
related: [lex-cahck, lex-dvb4u, lex-gt9kt]
evokes: [levitsky-ziblatt-2018-how-democracies-die, venezuela-2002-coup-and-strike-backfired, colombia-uribe-third-term-blocked-by-courts, fight-dirty-versus-institutional-channels]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch9-venezuela-versus-colombia-opposition-strategy
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 9 'Saving Democracy,' contrasting the anti-Chávez opposition's extraconstitutional tactics with the anti-Uribe opposition's institutional strategy, drawing on political scientist Laura Gamboa's research."
    quote: "'Not only did they fail to knock Chávez out, but they eroded the opposition's public support, allowed Chávez to tag his rivals as antidemocratic, and handed the government an excuse to purge the military, the police, and the courts, arrest or exile dissidents, and close independent media outlets.' ... 'This made it more difficult for Uribe to question his opponents' democratic credentials or justify cracking down on them. [...] The lesson is this: Where institutional channels exist, opposition groups should use them.'"
canonical-instances:
  - "Venezuela's anti-Chávez opposition tried three extra-institutional tactics in three years: a 2002 military coup attempt (failed, destroyed their image as democrats), a two-month 2002-03 general strike costing an estimated $4.5 billion (failed to force resignation), and a 2005 legislative election boycott (handed the chavistas total control of Congress instead). Each attempt left the opposition weaker and Chávez more entrenched than before it."
  - "Colombia's anti-Uribe opposition, facing a president who attacked critics as terrorists, spied on journalists, and twice tried to extend his own term limits, never attempted to remove him outside the constitution. In February 2010 the Constitutional Court — reached through ordinary institutional channels the opposition had spent years working — struck down Uribe's bid for a third term as unconstitutional, and he stepped down."
  - "Hypothetical: two employees both believe a manager is unfairly favoring certain reports. One goes over the manager's head to HR with documented instances and follows the formal grievance process; the other starts a workplace petition and recruits colleagues to refuse assignments from the manager. The second employee hands the manager a ready-made insubordination framing. Nobody ever rules on the original favoritism complaint; everyone spends the next month arguing about the petition instead."
critical-questions:
  - "Colombia had functioning courts and a congress still willing to check Uribe; Venezuela's institutions were more thoroughly captured by the time the opposition acted. Does the mechanism assume institutional channels are still viable, and does a Chávez-style opposition facing genuinely closed courts have any strategy left that isn't extraconstitutional?"
  - "Both the coup attempt and the general strike were coordinated, above-ground actions with identifiable leaders — is spontaneous, leaderless popular protest (which the book treats separately, via Wasow's nonviolent-versus-violent-protest research) governed by the same backfire logic, or is 'extra-institutional' doing different work depending on whether an organized opposition leadership authorized the tactic?"
  - "The Colombian outcome took eight years (2002 to 2010) of patient institutional pressure. Is the institutional-channels strategy actually more effective, or does it only look that way in retrospect because it avoided a dramatic, visible failure — and would an opposition facing a faster-moving authoritarian consolidation have time to wait for courts to act at all?"
