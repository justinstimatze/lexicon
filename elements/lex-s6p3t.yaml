id: lex-s6p3t
name: shared-emotional-suppression-becomes-its-own-intimacy
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "People under sustained pressure to suppress emotion in a competitive institutional setting can withdraw emotionally from their families while simultaneously plunging deeper, with mixed fascination and regret, into the dense relationships of the institution's own circles — where the very emotional aridity that would normally prevent intimacy instead signals a distinct 'fraternity of expediency.' This is a genuine form of closeness, not merely its absence: shared suppression itself becomes the bond, recognizable and meaningful to the people inside it, even though it looks from outside like the opposite of intimacy. The ambivalence matters — fascination and regret coexist, meaning the people inside this bond aren't simply deceived about its nature; they experience both its real pull and its real cost at once."
related: []
evokes: [jackall-moral-mazes, "a kind of fraternity of expediency", suppression-itself-becomes-the-bond]
lineage:
  - source: primary
    tradition: jackall-moral-mazes
    text: jackall-2014-moral-mazes-ch8-fraternity-of-expediency
    citation: "Robert Jackall, Moral Mazes: The World of Corporate Managers (Oxford University Press, 2014), Chapter 8, Invitations to Jeopardy, Section III."
    quote: "one withdraws emotionally from one's family and, with alternating fascination and regret, plunges ever deeper into the dense and intimate relationships of organizational circles where emotional aridity signals a kind of fraternity of expediency."
canonical-instances:
  - "Colleagues in a high-pressure trading environment who never discuss personal struggles with each other describe their bond with each other as closer than their relationships at home, recognizing in each other's practiced composure a kinship that people outside the environment don't share."
critical-questions:
  - "Does the fraternity of expediency actually meet the needs intimacy is supposed to meet, or does it function as a substitute that feels like closeness precisely because the real thing has been withdrawn from elsewhere in the person's life?"
status: active
