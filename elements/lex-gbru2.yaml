id: lex-gbru2
name: daimonion-aversive-only-intuition
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When deliberating an action, surface that Socrates's daimonion is aversive-only — intuition that stops, never that suggests; design the analog as a no-detector, not a yes-detector, when leaning on inarticulate signal."
related: [lex-jv983, lex-chp44, lex-dvydj, lex-u5869, lex-5mtky]
scaffolds-from: [lex-chp44]
evokes: [the-inner-voice-that-only-says-stop, negative-only-signal, the-internal-oracle-of-restraint, dont-pursue-this-without-knowing-why, aversive-gut-check-as-late-warning]
lineage:
  - source: primary
    text: plato-apology-31-40-daimonion
    citation: "Plato, Apology 31c-d, 40a-c (the canonical daimonion passages); also Theaetetus 151a (the daimonion 'will not let' Socrates teach certain students); Phaedrus 242b-c (the sign warns Socrates against leaving a discussion). Jowett translation in 2026-05-21. Socrates describes throughout the dialogues an internal 'divine sign' or 'voice' (daimonion) that operates ONLY in the negative — it tells him not to do things, never tells him to do things. The transferable primitive (stripped of metaphysics): a class of internal signals that fire only on 'don't' and never on 'do.' The aversive-only structure makes them informationally distinct from positive intuition; they CANNOT be the source of action-initiation, only of action-stoppage. Modern instances: the 'this feels wrong' gut-stop on a deal; the gymnast's pre-vault sense that something's off; the experienced surgeon's halt mid-procedure. The asymmetry between positive (which can drive in many directions, often misleadingly) and negative (which can only stop, which is the structurally-safer error-direction) is what makes daimonion-class signals informationally valuable."
    quote: "[Plato, Apology 31c-d (Jowett translation 2026-05-21):] 'A sort of voice comes to me; and when it comes it always forbids me to do something which I am going to do, but never commands me to do anything ... and I am sure that I have done nothing of any importance without consulting this divine voice.' [Apology 40a-c, the final speech:] 'Hitherto the divine faculty of which the internal oracle is the source has constantly been in the habit of opposing me even about trifles, if I was going to make a slip or error in any matter; and now as you see there has come upon me that which may be thought, and is generally believed to be, the last and worst evil. But the oracle made no sign of opposition, either when I was leaving my house in the morning, or when I was on my way to the court, or while I was speaking, at anything which I was going to say; and yet I have often been stopped in the middle of a speech, but now in nothing I either said or did touching the matter in hand has the oracle opposed me. What do I take to be the explanation of this silence? I will tell you. It is an intimation that what has happened to me is a good.' [The asymmetry is explicit: 'always forbids ... never commands.' The daimonion is structurally a negative-only signal. Socrates additionally observes that the ABSENCE of the negative signal (the daimonion's silence) is itself informational — it means 'nothing here to forbid,' which can be read as a (weaker) endorsement.]"
  - source: practitioner
    text: cross-attestation-gut-check-recognition-primed-decision
    citation: "Cross-domain attestation: (a) Klein 1999 'Sources of Power' / recognition-primed decision (RPD) model — expert decision-makers (firefighters, ICU nurses, pilots) report a class of intuitions that fire as 'something's off here' BEFORE they can articulate what; the intuitions reliably correlate with subsequent identification of a real anomaly. The aversive-direction primacy in RPD ('something's wrong' fires before 'I know what's wrong') matches the daimonion shape. (b) Damasio 1994 'Descartes' Error' somatic-marker hypothesis — affective markers attach to options in the decision space, biasing AWAY from previously bad outcomes; the structure is aversive-asymmetric in the same way. (c) Gigerenzer 'gut feelings' work — the negative-direction gut-stop has higher base-rate reliability than the positive-direction gut-pursue, because the aversive signal is shaped by past errors (well-sampled training data) while the positive signal is more easily hijacked by salience or novelty. (d) Modern UX 'cognitive ease' research — users' aversive reactions to a UI ('I don't trust this site' / 'something looks off') correlate with later identification of dark patterns more reliably than positive reactions correlate with quality. Cross-attestation: cognitive science, decision research, applied UX. The pattern is robust: aversive-direction signals reliably encode meaningful information even when the bearer cannot yet articulate it."
    quote: "[Klein 1999 RPD; Damasio 1994 somatic markers; Gigerenzer gut-feeling research; UX aversive-reaction research. The negative-direction asymmetry is empirically validated across multiple expertise-decision domains.]"
canonical-instances:
  - "experienced surgeon's mid-procedure halt: a senior surgeon stops mid-procedure when 'something doesn't feel right,' even when they cannot immediately articulate what. Post-hoc the halt reliably correlates with an actual anomaly (anatomical variant, equipment issue, attention lapse). The intuition fires aversively; the articulation comes after the stop. Daimonion in clinical practice"
  - "experienced pilot's go-around: a pilot calls off a landing approach because 'something's not right' (winds, fuel, runway visual). The aversive intuition is the institutional norm — if a pilot has a daimonion-class signal, the procedure SUPPORTS calling the go-around even without articulable reason. The asymmetry of the cost (a go-around is cheap; a botched landing is catastrophic) justifies trusting the negative-only signal"
  - "due-diligence reviewer's red flag: a lawyer or accountant reviewing a deal develops an aversive sense that 'something's off' before they can name it. The mature due-diligence posture treats that aversive sense as a signal to slow down and look more carefully, not as a stop-condition. The articulation comes after the slowing"
  - "code review smell: an experienced reviewer reads a PR and gets 'this feels wrong somehow' before they can name the bug. The mature response is to dig in, not to ship-anyway. The 'code smell' literature (Fowler 1999) institutionalizes this as a class of pattern recognition — the signal IS aversive-only, and is most reliable when it's not yet articulated"
  - "Cuban Missile Crisis decision-making: ExComm transcripts show several members responding to proposals with 'I don't like this' before they could specify what. McNamara and Kennedy reportedly treated those aversive responses as worth investigating before action, slowing decisions down enough to surface the substantive reason. The daimonion-class signals contributed to the de-escalation pathway"
  - "vital critical question: when is the daimonion WRONG? It can produce false positives in the stopping direction (stopping you from action you should take). The signal is shaped by past experience; if your past experience is unrepresentative, the daimonion will fire on patterns that AREN'T actually problematic. The discipline is to investigate WHY the signal fired rather than treating it as gospel — articulate post-hoc, validate empirically, update the signal if it's miscalibrated. Treating the daimonion as ALWAYS RIGHT is its own failure mode"
  - "central critical question: how does the daimonion differ from anxiety / phobia / pathological avoidance? Discriminator: the signal's correlation with subsequent articulable real anomaly. Healthy daimonion can be POST-HOC articulated (the surgeon names the anatomical variant; the pilot names the wind shift; the reviewer names the bug). Pathological avoidance produces aversive signals that DO NOT correlate with real anomaly — they're driven by trauma-prior or generalized anxiety, not by domain-pattern recognition. The discriminator is empirical, run over many instances"
  - "operational complement to lex-dvydj curiosity (Loewenstein-Berlyne curiosity): the daimonion and curiosity are the negative-and-positive faces of pre-articulate signal — daimonion says 'don't pursue this' aversively; curiosity says 'this is worth pursuing' attractively. Both fire before articulation. The asymmetric reliability (daimonion more trustworthy than positive curiosity) is the operational discovery — curiosity is more easily hijacked by salience and novelty than daimonion is"
  - "operational adjacent to lex-jv983 fluency-trap: the fluency-trap is the POSITIVE-DIRECTION failure mode (smooth claims feel true). The daimonion is the asymmetric corrective — the aversive-only signal that interrupts the fluent-feeling claim before it carries the listener away. Trusting daimonion against fluency-trap-vulnerable positive intuitions is a structurally safer epistemic posture"
  - "operational adjacent to lex-u5869 chestertons-fence: chestertons-fence says 'don't remove the fence until you understand why it's there.' The daimonion that fires when you're about to remove the fence ('something feels off about this removal') is the relational signal that the chesterton-prior should be activated. The daimonion is the felt EXPERIENCE of an unarticulated chesterton-prior; the chesterton frame is the deliberate cognitive structure that supports trusting it"
  - "operational adjacent to lex-chp44 meta-pointer: the daimonion signal often points at something the signal-bearer cannot yet specify — it's a META-POINTER without the content yet attached. The mature deployment is to use the daimonion AS a meta-pointer: 'there's something I'm not articulating; let me work to articulate it before deciding.' The signal points; the articulation follows"
severity-tier: info
critical-questions:
  - "is the no-signal arriving as inarticulate aversion, or as articulate objection? the daimonion is specifically the inarticulate aversive form"
  - "are you treating its absence as license — and is that warranted (no signal = no danger), or is it a quiet failure mode?"
  - "what's the false-positive rate of your daimonion — does it stop you from things that turned out fine?"
  - "could the daimonion be misread as personal preference or trauma response? distinguishing matters"
status: active
