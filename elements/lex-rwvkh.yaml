id: lex-rwvkh
name: specific-evidence-overrides-prior-unless-prior-is-causally-framed
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When specific evidence arrives, people overweight it and ignore the prior probability. The fix isn't 'remember the prior' — it's CAUSALLY framing the prior so it stays vivid. People update base rates only when the rate is mechanism-attached."
related: [lex-k6d7u, lex-t9fs7, lex-r3w25, lex-n6t4u, lex-eb3wf, lex-zag9z, lex-2czcp, lex-mbx6p, lex-vkhp7, lex-rsnn7, lex-jafkg, lex-yh672, lex-fn2gx]
scaffolds-from: [lex-k6d7u, lex-2czcp]
evokes: [base-rate-fallacy, base-rate-neglect, Bayesian-inversion, taxi-cab-problem, vietnamese-cambodian-fighter, prior-probability, causally-framed-vs-statistically-framed, kahneman-tversky-1972, heuer-ch12]
lineage:
  - source: primary
    text: heuer-1999-psychology-of-intelligence-analysis-ch12-base-rate
    citation: "Richards J. Heuer Jr., *Psychology of Intelligence Analysis*, CIA Center for the Study of Intelligence 1999, Ch. 12 'Biases in Estimating Probabilities', section 'Base-Rate Fallacy' (pp. 157-159). The substrate-claim: when new specific-case evidence arrives (a test result, an observation, an identification), human judgment systematically updates only on the case-evidence and ignores the prior probability (base rate) of the underlying hypothesis-class. The mathematical operation is Bayesian inversion: P(H|E) = P(E|H) × P(H) / P(E). Untrained intuition substitutes P(H|E) ≈ P(E|H), discarding the prior P(H). Heuer's worked example (Vietnamese-Cambodian fighter aircraft, modified from Kahneman-Tversky 1972 taxi-cab problem): a pilot with 80% identification accuracy identifies an attacking fighter as Cambodian. Base rate: 85% of fighters in the area are Vietnamese, 15% are Cambodian. Intuitive answer: 80% probability the fighter was Cambodian. Bayesian answer: only 41% probability (12/29). The intuitive answer ignores the strong prior. The crucial NUANCE Heuer makes explicit (pp.158-159): base-rate neglect is mediated by CAUSAL FRAMING. When the same base rates are presented as 'no causal link to the observation' (raw statistical fact: 85% of fighters happen to be Vietnamese), subjects ignore them and answer ~80%. When the SAME base rates are presented with a causal frame ('85% of HARASSMENT INCIDENTS in this area involve Vietnamese fighters' — implying a Vietnamese propensity to harass), subjects integrate the prior with the observation and arrive at approximately the Bayesian answer (~50%, close to the 41% optimal). The transferable mechanism: the human inference engine treats causally-framed probabilities as evidence-bearing but treats statistically-framed probabilities as background-noise. The corrective is not just 'remember to apply Bayes' rule' — it is to RE-FRAME the prior causally so the inference-engine treats it as evidence. The composing-implication: practitioners who want their probability assessments to be base-rate-aware should present the base rate as a story about WHY the prior holds, not as a brute statistic. This atom is distinct from but composes with lex-mbx6p illusory-correlation (which operates on covariation judgment across many cases) and lex-vkhp7 hindsight-bias (which operates on outcome-knowledge-contaminated retrospective probability)."
    quote: "[Heuer 1999 Ch.12 pp.157-159, the Vietnamese-Cambodian fighter problem:] 'A common procedure in answering this question is to reason as follows: We know the pilot identified the aircraft as Cambodian. We also know the pilot's identifications are correct 80 percent of the time; therefore, there is an 80 percent probability the fighter was Cambodian. This reasoning appears plausible but is incorrect. It ignores the base rate—that 85 percent of the fighters in that area are Vietnamese. The base rate, or prior probability, is what you can say about any hostile fighter in that area before you learn anything about the specific sighting.' [The full Bayesian unpacking, p.158:] 'Imagine 100 cases ... 80 percent or 68 of the 85 Vietnamese aircraft will be correctly identified as Vietnamese, while 20 percent or 17 will be incorrectly identified as Cambodian ... Similarly, 80 percent or 12 of the 15 Cambodian aircraft will be correctly identified as Cambodian, while 20 percent or three will be incorrectly identified as Vietnamese. This makes a total of 71 Vietnamese and 29 Cambodian sightings, of which only 12 of the 29 Cambodian sightings are correct; the other 17 are incorrect sightings of Vietnamese aircraft. Therefore, when the pilot claims the attack was by a Cambodian fighter, the probability that the craft was actually Cambodian is only 12/29ths or 41 percent, despite the fact that the pilot's identifications are correct 80 percent of the time.' [On the causal-framing nuance, p.159:] 'Most people do not incorporate the prior probability into their reasoning because it does not seem relevant. It does not seem relevant because there is no causal relationship between the background information on the percentages of jet fighters in the area and the pilot's observation. The fact that 85 percent of the fighters in the area were Vietnamese and 15 percent Cambodian did not cause the attack to be made by a Cambodian rather than a Vietnamese.' [On the causally-reframed version of the same statistics:] 'Although the fighter forces of the two countries are roughly equal in number in this area, 85 percent of all harassment incidents involve Vietnamese fighters, while 15 percent involve Cambodian fighters. The problem remains mathematically and structurally the same. Experiments with many test subjects, however, show it is quite different psychologically because it readily elicits a causal explanation relating the prior probabilities to the pilot's observation.' [The transferable distillation: the same numerical prior gets used or ignored depending on whether it fits a causal story. The corrective for analysts is to articulate the causal link between the prior and the observation, not merely to memorize Bayes' rule. The composing-corollary: when communicating probability-evidence to a consumer who you want to actually update on, present the prior causally — the brute-fact version will not produce updating.]"
canonical-instances:
  - "Kahneman-Tversky 1972 taxi-cab problem (foundational, Heuer p.157 fn.147): a cab was involved in a hit-and-run; witness identifies it as Blue. Witness accuracy: 80% under appropriate visibility. Base rate: 85% of cabs in city are Green, 15% Blue. Intuitive answer: 80% Blue. Bayesian answer: 41% Blue. The exact same problem-shape Heuer uses with fighter-aircraft. Established the base-rate-neglect phenomenon as a stable empirical finding."
  - "Heuer Vietnamese-Cambodian fighter problem (Heuer p.157-159): the pilot-identification variant. Bayesian answer 41% despite intuitive 80%. The causally-reframed version (which presents the 85% as 'harassment incidents' implying Vietnamese propensity) produces near-optimal updating from the same subjects — the statistical prior becomes evidence when framed causally."
  - "Medical diagnosis: rare-disease test interpretation. Disease prevalence 1%, test sensitivity 99%, test specificity 99%. A positive test result intuitively feels like 99% probability of disease. Bayesian answer: 50%. Half of all positive results are false positives because the disease is rare. Doctors and patients both make this error (Eddy 1982); the corrective is base-rate-aware Bayesian-reasoning training, often operationalized via 'natural frequencies' (Gigerenzer): 'imagine 1000 people. 10 have the disease ...' which empirically reduces the error to ~50% of subjects answering correctly."
  - "Software engineering — bug-detection-test interpretation: a static-analysis tool flags a line of code as a potential bug. The tool has 95% precision and 95% recall. The intuitive read: this is 95% likely a real bug. The Bayesian-aware read: depends on the base rate of bugs per line — if 1% of lines have real bugs, then a flag has only ~16% probability of being a true positive. Software-engineering practitioners who calibrate against tool outputs without considering bug-density base-rate will spend disproportionate time on false-positive flags."
  - "Hiring / resume screening: a screening criterion has 80% predictive validity for 'good hires'. The base rate of 'good hires' in the applicant pool is 5%. Applying the screen and accepting the survivors yields a population that is only ~17% good hires, despite the 80% validity figure. Recruiting teams who present 'our screen has 80% validity' as if that's the conversion rate are subject to base-rate-neglect; the actual lift depends on the prior. The corrective: present the screen's effect on the GOOD-HIRE rate (prior + posterior) rather than as the screen's accuracy."
  - "Customer segmentation: 'customers in segment X have 70% retention.' Intuitive read: serving this segment is a good bet. Base-rate-aware read: if the company overall has 65% retention, the 70% segment is only marginally above baseline; the segment is much weaker evidence than '70%' alone suggests. Practitioner-discipline: when evaluating predictive features, always specify the baseline (population base rate) the feature is improving on."
  - "Heuer's causal-framing antidote in action (Heuer p.159): the Vietnamese-Cambodian problem's causally-reframed version triggers near-correct Bayesian updating in subjects who failed the brute-statistical version. The mechanism: when the prior fits a causal story ('Vietnamese propensity to harass'), the inference engine treats it as evidence; when the prior is brute statistics, the engine discards it. Practitioner-implication for evidence-presenters: choose causal framing for priors you want consumers to actually use."
  - "Operationally distinct from lex-mbx6p illusory-correlation: lex-mbx6p operates on COVARIATION judgment across many cases (the 2×2 contingency-table failure); lex-rwvkh operates on SINGLE-CASE Bayesian updating with prior. Both share the broader 'human probability-judgment ignores certain cells of the relevant information' family but target different judgment-shapes. They compose when a covariation claim is used as the prior for single-case updating — both biases can fire."
  - "Operationally distinct from lex-vkhp7 hindsight-bias: hindsight is about retrospective contamination by outcome-knowledge; base-rate-neglect is about prospective failure to integrate prior with case-evidence. Hindsight reshapes the perceived prior AFTER the outcome; base-rate-neglect ignores the prior BEFORE the outcome. Both can compose in postmortems where the analyst reconstructs 'what the prior was' without the base-rate discipline."
  - "Operationally composes with lex-zag9z ACH: ACH's discipline of identifying alternate hypotheses and assigning evidence-diagnosticity is structurally a Bayesian-updating discipline. When ACH is applied carefully, base-rate-neglect is partially defended-against because the matrix forces consideration of multiple hypotheses (and thus their priors). When ACH is applied superficially without thinking about priors, the matrix can recapitulate base-rate-neglect."
  - "Operationally composes with lex-k6d7u credence-as-graded-belief: lex-k6d7u names the credence concept; lex-rwvkh names the structural failure-mode in updating credences. Calibrated credence assignment requires explicit prior-elicitation; without that step, credences are systematically too close to the case-evidence and too far from the prior."
  - "Operationally distinct from lex-r3w25 confirmation-filtered-tribal-perception: lex-r3w25 is about MOTIVATED filtering toward favored conclusions; lex-rwvkh is about STRUCTURAL failure in unmotivated Bayesian updating. They can compose — confirmation-bias can amplify base-rate-neglect when the favored hypothesis has a low prior (the analyst latches onto the case-evidence and the low prior is doubly ignored)."
critical-questions:
  - "what is the BASE RATE for this hypothesis? Practitioner-discipline: before treating evidence-of-strength-S as updating you to credence-S, explicitly state the prior probability of the hypothesis without the evidence. Then compute (or estimate) the Bayesian posterior. If you skipped the prior, you are running base-rate-neglect — the felt credence will be too close to the case-evidence's apparent strength and too far from the prior."
  - "is the prior presented CAUSALLY or STATISTICALLY? Heuer's empirical finding: the same prior gets used vs ignored depending on framing. Practitioner-question: when you (or your audience) need to apply a prior, can you tell a causal story about why the prior holds? If yes, the prior will be used; if not, it will likely be discarded. The corrective for evidence-communicators is to choose causal framing for priors."
  - "what's the test's PRECISION at this prior? Practitioner-discrimination for diagnostic-test interpretation: a test with 80% accuracy applied to a 15% base rate yields only ~41% positive-predictive-value. Practitioners (medical, security, fraud-detection, ML-classifier consumers) routinely mis-state test accuracy as if it were the conversion rate. Always specify: 'at this base rate, a positive result means [posterior]'."
  - "are you using NATURAL FREQUENCIES? Gigerenzer's empirical finding: representing the same Bayesian problem in natural frequencies ('out of 1000 people, 10 have the disease, of which 9 test positive, and of the 990 without disease 50 also test positive') reduces error rates from ~80% to ~50%. Practitioner-discipline: when presenting probabilistic-evidence to non-statistical audiences, use natural-frequency framing rather than percentages or conditional probabilities."
  - "where does this overcorrect? When the prior is genuinely uninformative (uniform over relevant hypothesis-space) or when the case-evidence is overwhelmingly diagnostic (P(E|H) ≫ P(E|¬H) such that the prior doesn't matter). For very-strong evidence with diffuse priors, base-rate-neglect produces approximately the right answer. Practitioner-discrimination: is the prior informative (skewed away from uniform)? Only then does ignoring it produce error."
  - "what's the institutional/organizational pattern? Heuer's implicit prescription: institutional Bayesian-update protocols (ACH, structured-analytic-techniques, calibrated-forecasting practices) defend against base-rate-neglect that individual discipline alone cannot reliably correct. Practitioner-implication: in high-stakes domains (intelligence, medicine, security), prefer institutionalized Bayesian procedures over individual probability-judgment."
