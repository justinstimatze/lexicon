id: lex-cgnsz
name: a-creditor-tracks-a-debt-more-precisely-than-the-debtor-does
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "In any relationship where one party owes something to another — money, a favor, a promised deliverable — expect the two sides' attention to the obligation to be structurally lopsided rather than equally forgetful or equally alert. Franklin's Poor Richard names the asymmetry directly: 'Creditors have better memories than debtors; creditors are a superstitious sect, great observers of set days and times.' The debtor has every incentive to let the due date blur, since remembering it clearly only produces anxiety before the day arrives; the creditor has the opposite incentive, since tracking the date precisely is the only thing protecting the claim. The same obligation is therefore held in two very different states of resolution inside two different minds at the same time, and the gap is not a personality difference between a careless debtor and a careful creditor — it is generated by which side benefits from precision."
related: []
evokes: [franklin, way-to-wealth, asymmetric-attention-to-a-shared-obligation, creditor-debtor-memory-gap]
lineage:
  - source: primary
    text: franklin-1758-way-to-wealth
    citation: "Benjamin Franklin, Father Abraham's Speech ('The Way to Wealth' / 'Poor Richard Improved'), 1758 (Gutenberg #43855). Verified verbatim against a direct extraction of the held copy."
    quote: "Creditors have better memories than debtors; creditors are a superstitious sect, great observers of set days and times."
canonical-instances:
  - "in a workplace favor economy, the person who did someone a favor tracks the unreturned obligation for months, while the person who received it genuinely forgets it happened within weeks — not from bad faith on either side, but because only one party's interest is served by remembering."
critical-questions:
  - "Is the asymmetry purely motivational, or does a genuine cognitive-load difference contribute — the creditor is tracking one salient number, while the debtor may be juggling many obligations at once and the specific one is simply diluted?"
  - "What happens when the debtor holds social or institutional power over the creditor? A powerful debtor may face no consequence for forgetting at all, which would mean the whole asymmetry only holds among roughly equal parties."
status: active
