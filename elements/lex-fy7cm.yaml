name: sharp-disagreement-can-still-produce-consistent-outcomes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating a 'chaos under random inputs' finding as a real-world risk, check what the actual inputs are shaped by. Studies of majority voting that assume every possible preference ordering is equally likely find that cyclical, inconsistent outcomes become nearly certain as the number of options grows -- an alarming-looking result. Sen's rebuttal is that real preferences are never drawn from that kind of noise: “the equiprobability assumption is a very special one, and seems to involve a denial of society, in a significant sense. Depending on peoples' values and their personal and group interests there would be a fair amount of link-up between individual preferences. Individual preferences are determined not by turning a roulette wheel over all possible alternatives, but by certain specific social, economic, political and cultural forces. This may easily produce some patterns in the set of individual preferences. The patterns need not, incidentally, be one of agreement. Sharp disagreements may produce consistent and transitive majority decisions. For example, in a two-class society where 'class war' takes the form that all members of one class (e.g., capitalists) have exactly the opposite preference to each member of the other class (e.g., workers), majority decision must be transitive, irrespective of the number of people in each class.” The sharpest possible conflict -- every capitalist's ranking the exact mirror of every worker's -- still yields a perfectly consistent, transitive social ordering, because 'exact mirror opposite' is itself a structural pattern, just an adversarial one. Diagnostic move: when a worst-case analysis assumes maximal randomness to derive a scary failure rate, ask what the real inputs are actually shaped by. What saves the system doesn't require agreement -- polarization, mirrored factions, and organized blocs are all patterns, and almost any pattern is exactly what an equiprobability model rules out by construction."
