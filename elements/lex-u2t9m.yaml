name: approach-avoidance-paralysis-between-two-dreaded-outcomes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Facing two outcomes each dreaded for a different reason, someone can oscillate physically between them for an extended period, unable to resolve toward either, because each direction only becomes bearable by comparison to the other for as long as neither is actually chosen. In the Jataka's tale of the aging musician facing a public contest he fears losing, he can neither commit to the woods (fearing death from exposure) nor commit to returning (fearing the shame of a public defeat): 'So to the woods he went, but he kept returning through fear of death and going back to the wood through fear of shame. And in this way six days passed by. The grass died as he walked, and his feet wore away a path.' Both fears are genuine and neither yields the other any priority. The paralysis has nothing to do with weighing which is worse. Whichever direction he moves, it's the other fear's sudden absence that makes the chosen direction momentarily unbearable."
related: []
evokes: [jataka, dukanipata, guttila-jataka, oscillation-between-two-dreaded-outcomes-with-neither-resolvable, comparative-relief-in-either-direction-prevents-commitment-to-either]
