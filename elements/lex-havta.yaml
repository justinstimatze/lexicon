lineage:
  - source: primary
    text: radin-trickster-blames-and-burns-his-own-anus-after-foxes-steal-his-meat
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 14. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Ah, ha, now I understand! It must have been those covetous friends of mine who have done me this injury!' he exclaimed. ... 'Alas! Alas! They have caused my appetite to be disappointed, those covetous fellows! And you, too, you despicable object, what about your behaviour? Did I not tell you to watch this fire? You shall remember this! As a punishment for your remissness, I will burn your mouth so that you will not be able to use it!' Thereupon he took a burning piece of wood and burnt the mouth of his anus. He was, of course, burning himself and, as he applied the fire, he exclaimed, 'Ouch! Ouch! This is too much! I have made my skin smart.'"
canonical-instances:
  - "After a warehouse gets robbed overnight, a manager correctly identifies that the thieves cut through an exterior fence, and then also disciplines the night-shift junior clerk for 'not stopping it,' even though that employee had no security training, no weapon, and explicit instructions never to confront intruders -- a punishment that leaves the fence still cut and one demoralized employee worse off."
  - "A company's servers go down from a supplier's outage entirely outside its control, and leadership, having correctly identified the supplier as the cause, also cuts the on-call engineer's bonus for 'failing to prevent the incident,' despite the engineer having no access to the supplier's infrastructure at all."
critical-questions:
  - "Is Trickster's anger at his own anus a genuine belief that it could have done more, or is it closer to a reflex need to punish something, anything, now that the real culprits are already gone and unreachable -- does the story give any evidence for which it is?"
  - "Would assigning the anus a task it was actually capable of, rather than guarding against thieves with nothing but noise, have changed the outcome, or does the deeper failure sit entirely with Trickster's original choice of guard rather than with any subsequent punishment?"
  - "Does naming the real external cause correctly, as Trickster does here, make the additional self-punishment more forgivable, more absurd, or simply irrelevant to it -- is there any causal link between getting the diagnosis right and still reaching for an unjustified internal punishment anyway?"
