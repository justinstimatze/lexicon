lineage:
  - source: practitioner
    text: siegel-bryson-2013-the-whole-brain-child
    citation: "Daniel J. Siegel and Tina Payne Bryson, The Whole-Brain Child: 12 Revolutionary Strategies to Nurture Your Child's Developing Mind (Delacorte Press, 2011; Scribe Publications edition cited here, 2013), Chapter 4, 'Kill the Butterflies! Integrating Memory,' Whole-Brain Strategy #6, 'Use the Remote of the Mind: Replaying Memories.'"
    quote: "'I want you to imagine that you’re holding a remote control, just like the one we use when we watch movies in the house. And when I get to a part of the story you don’t want to think about, you just hit pause. When you say ‘Pause,’ I’ll stop. Then we can fast-forward past that scene. Can we do that? ... When he said, “Then Ryan picked up a root and started to cut it,” Eli broke in. “Pause.” He said it quietly, but with plenty of force. David said, “OK. Now let’s fast-forward to the hospital.” “Farther.”'"
canonical-instances:
  - "A team runs a blameless post-mortem after a bad outage. Rather than asking the engineer who made the mistaken change to narrate the whole sequence unprompted, the facilitator walks the timeline themselves and checks in before each escalation point -- 'we're coming up on the moment the alert fired, is it OK to go through what happened next, or do you want to come back to that part' -- so the engineer can slow or skip the moment that's hardest to sit with instead of being carried through it at the facilitator's pace."
  - "A journalist interviewing a survivor of a disaster agrees in advance on a hand signal that means 'stop this line of questioning now,' rather than only relying on the survivor to interrupt verbally in the moment, since producing a verbal interruption is itself harder in the middle of a hard memory than using a signal set up beforehand."
  - "Operationally distinct from lex-cmwnj forced-graduated-exposure-converts-a-fatal-vulnerability-into-tolerance: that atom's mechanism is an outside party deliberately, incrementally forcing contact with a threat until tolerance builds, with the exposer controlling the dose. This atom's mechanism is the reverse allocation of control -- the person being exposed holds the pause-and-skip authority, and that reversal of who holds the control is what does the work here, over and above whatever incrementalism is also present."
critical-questions:
  - "Does handing over pause-and-skip control let someone avoid the hard part indefinitely, defeating the point of revisiting it at all? In the source scene David keeps gently returning to the account on later occasions rather than treating one avoided pass as finished -- the control governs pacing within a given attempt, and a fresh attempt is expected to follow later."
  - "Is the control being offered real, or symbolic? A 'pause' that the narrator quietly overrides a few seconds later teaches the opposite lesson -- that the control doesn't actually work -- and is likely worse than no offered control at all, since it adds a broken trust to the original difficulty."
  - "Whose story is it to pace in the first place? This move fits naturally when the person revisiting the account is also its subject (their memory, their incident). It fits less naturally when multiple people were involved and need different paces at once -- Ryan, in the source scene, might need a different pace through the same story than Eli does."
status: active
