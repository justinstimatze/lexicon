canonical-instances:
  - "A supplier agrees to put up inventory as collateral against a large advance payment, but quietly pledges obsolete, hard-to-sell stock rather than its best-moving goods -- the buyer's confidence that the supplier has 'skin in the game' is technically satisfied and practically hollow, since the supplier would barely notice losing that specific inventory."
  - "A business partner agrees to a personal guarantee on a loan but structures their own finances beforehand so that the guaranteed assets are the ones they were already planning to shed or that sit in an entity they don't actually control -- the lender's sense of security rests on an assumption of genuine personal exposure that the partner has quietly engineered away."
critical-questions:
  - "how would a receiver actually verify, in advance, that a pledged asset or hostage is genuinely valued by the giver rather than a strategically expendable substitute -- is there any reliable signal short of a track record with that specific party, and if not, does this vulnerability apply to essentially every first-time collateral arrangement?"
  - "does insisting on a demonstrably high-value hostage or asset (the giver's actual heir, their most liquid and needed capital) simply shift the exploit rather than closing it -- could a sufficiently motivated giver still fake attachment to something that looks valuable but isn't, meaning the receiver's verification problem never fully resolves?"
  - "in the human-hostage case specifically, does the framework's own solution (give a devalued family member) risk revealing something troubling about how readily a family or organizational hierarchy treats some of its own members as expendable -- is 'who would this person be relieved to lose' itself a diagnostic worth applying to the giver's internal power structure, independent of the treaty question?"
status: active
