id: lex-r5njv
name: contradictory-signals-paralyze-a-skilled-reader-better-than-hidden-ones
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Against an opponent skilled at reading signs, hiding the evidence isn't your best move -- leaving fully readable evidence that contradicts itself is, because a skilled reader confronted with no signal simply looks elsewhere, while one confronted with clear, self-contradictory signals has nothing to correct toward and gets stuck. When the infant Hermes steals Apollo's cattle, he doesn't erase his tracks; he engineers them to be unreadable in a specific way. He makes the cattle walk backward so their prints point the wrong direction, and binds strange sandals to his own feet so his tracks have \"no 'heel and toe,' and therefore seem to go both ways at once.\" Hyde names the effect: \"confounded polarity makes the world unpassable and is a kind of aporia. It blocks all passage by destroying the orientation that passage requires.\" Apollo, a god famous for reading every sign correctly, is stopped cold by evidence that is perfectly visible and perfectly uninterpretable: \"'Well, well! This is remarkable, what I'm seeing. Clearly these are longhorned cattle tracks, but they all point backwards... And I don't think the shaggy-maned Centaur leaves such prints. What swift feet took these long strides? The tracks on this side of the path are weird, but those on the other side are weirder still!'\" He isn't misled toward a wrong conclusion he could later correct; he's denied any conclusion to hold at all. Diagnostic move: when trying to defeat a skilled interpreter, don't just try to hide your evidence from them -- consider instead leaving evidence that is fully visible but genuinely points in contradictory directions at once, since a reader who is merely missing information keeps searching, but one facing irreconcilable information can be stopped in place."
