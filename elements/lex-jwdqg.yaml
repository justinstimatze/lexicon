id: lex-jwdqg
name: even-tyranny-must-claim-a-morality-to-recruit-followers
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When assessing why people follow an obviously exploitative or destructive movement, don't assume the leaders sold followers on the exploitation itself -- check what morality they claimed to be serving instead. Popper's observation about the twentieth century's worst regimes: 'the great dictators were all forced to pay homage to the goodness of man. They were forced to pay lip-service to a morality in which they did not believe. Communism and nationalism are both believed in as moralities and religions. This is their only strength. Intellectually they border on absurdity.' The dictators' actual conduct was often nakedly self-serving, but that was never the pitch made to the people who sacrificed for them -- the pitch was always a claimed higher morality, a promised justice, a righteous cause. Diagnostic move: when a movement, company, or cause recruits people into serving harmful ends, look past what its leadership privately believes or does and ask what moral story is being told to the followers doing the actual work. That story, not the underlying reality, is what's doing the recruiting -- which means countering the movement by exposing its leaders' cynicism rarely moves the followers, since they were never buying the leaders' sincerity to begin with, only the morality on offer."
