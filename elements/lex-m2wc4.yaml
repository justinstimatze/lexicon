id: lex-m2wc4
name: a-deliberately-hard-task-screens-for-the-trait-status-cant-fake
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you're overwhelmed by candidates who all look qualified on the trait you don't actually care about, wealth, looks, confidence, don't screen on that trait at all -- pose a genuinely hard, unfakeable problem whose only solution requires the trait you actually want, and let the difficulty itself do the screening. In Cushing's telling, a wealthy, beautiful young woman is pursued by every eligible man in the valley for her looks and possessions, neither of which tells her anything about the quality she actually values. So she sets a real problem instead of a beauty contest: 'if any one of you will go to my corn-fields, and destroy or scare away ... the pests that eat up my corn, him I will marry and cherish, for I shall respect his ability and ingenuity.' Every wealthy, handsome suitor fails. An ugly, poor stranger solves it by building an elaborate camouflaged pit-trap, because the test was never about status; it was built specifically to require ingenuity, and he names the difficulty as the whole point rather than a flaw: when told the condition was very hard, the girl replies simply, 'I know it is ... that is why I ask it.' Diagnostic move: when the candidates in front of you all clear an easy bar on the wrong trait, resist relaxing the bar to make a decision faster -- design a genuinely difficult, hard-to-fake task around the trait you actually need, and treat anyone who balks at the difficulty as having already told you what you needed to know."
