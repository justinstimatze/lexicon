id: lex-pnnv6
name: escaping-an-impossibility-result-can-just-relocate-the-problem
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating a technical workaround to an impossibility theorem as good news, check what the workaround actually produces, not just whether it formally clears the bar. Arrow's theorem requires social preference to be a full transitive ordering; weaken that single requirement to 'acyclic enough to pick a best option' and all four of Arrow's conditions become jointly satisfiable again -- the impossibility dissolves. Sen: “What all this really shows is how economic Arrow's impossibility theorem is. Relax any of his restrictions and the result collapses; if it had not we would have been able to strengthen Arrow's theorem immediately. ... all SDFs that satisfy conditions U, I, P and D, and yield quasi-transitive social preference must represent an 'oligarchic' form of decision taking. There would be an identifiable and unique group of persons in the community such that if any one of them strictly prefers any x to any y, society must regard x to be at least as good as y; and if all members of the group strictly prefer x to y, then society must also prefer x to y. ... An SDF can pass all the tests of Arrow and still look very unappetizing.” The rule that escapes the impossibility formally is not a rule anyone would want: it lets a fixed minority's preferences override the majority's whenever the minority is unanimous, and it treats every option that minority is indifferent between as equally acceptable no matter how the rest of the community feels. The impossibility didn't get solved -- it got relocated into the rule's structure, in a form that no longer trips the formal test. Diagnostic move: when a system finds a technical route around a proven impossibility or hard limit, don't stop at confirming the checks now pass. Ask what property the fix actually gave up, and check the concrete shape of what that gives you -- a workaround can satisfy every formal condition and still reproduce the exact problem the theorem was warning about, just in a form the test wasn't built to catch."
related: [lex-37m5b]
evokes: [sen-collective-choice-and-social-welfare-chapter-4-choice-versus-orderings, arrows-impossibility-theorem, quasi-transitivity, oligarchy-result, social-decision-function, formal-escape-hides-the-real-cost]
lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 4 'Choice Versus Orderings,' Section 4.2 'Collective Choice and Arrow's Conditions,' pp.87-88."
    quote: "“What all this really shows is how economic Arrow's impossibility theorem is. Relax any of his restrictions and the result collapses; if it had not we would have been able to strengthen Arrow's theorem immediately. ... all SDFs that satisfy conditions U, I, P and D, and yield quasi-transitive social preference must represent an ‘oligarchic’ form of decision taking. There would be an identifiable and unique group of persons in the community such that if any one of them strictly prefers any x to any y, society must regard x to be at least as good as y; and if all members of the group strictly prefer x to y, then society must also prefer x to y. ... An SDF can pass all the tests of Arrow and still look very unappetizing.”"
canonical-instances:
  - "Hypothetical: A distributed system relaxes strict consistency to eventual consistency to escape a proven impossibility result about achieving consistency, availability, and partition tolerance together. Shipping the relaxed version without checking what 'eventual' actually means for this workload can reproduce the exact stale-read bugs the original tradeoff was meant to force a deliberate decision about -- the impossibility didn't disappear, it moved into a window of time nobody sized."
  - "Hypothetical: A hiring process drops a strict seniority-ranking requirement to get around a deadlock between two equally-strong final candidates, replacing it with 'the hiring committee chooses by informal consensus.' In practice the same two or three loudest committee members end up deciding every close call under that new procedure -- an informal oligarchy wearing the costume of a resolved deadlock."
critical-questions:
  - "Isn't relaxing an overly strong requirement often the correct fix, not a sleight of hand -- how do you tell a legitimate weakening from one that just hides the cost? The distinction is whether anyone went on to check the weakened version concretely, past the point where the formal test came back clean. Sen doesn't reject social decision functions in general; he specifically works out what escaping the impossibility actually requires (oligarchy) and judges that outcome unappetizing on its own terms, rather than declaring victory the moment the formal test passes."
  - "Doesn't every impossibility result get 'escaped' this way eventually -- some condition always turns out negotiable, so isn't this just how progress on hard problems normally works? Often, yes, and that's not itself a criticism. The diagnostic isn't 'never relax a condition'; it's 'don't stop checking once the formal test passes.' An escape that trades the original problem for oligarchy, or for staleness, or for some other concrete cost is real progress only if that cost is one you'd have chosen on purpose."
status: active
