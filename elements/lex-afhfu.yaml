lineage:
  - source: primary
    text: cushing-trial-of-lovers-young-man-kills-real-wife-by-heuristic
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Trial of Lovers: or the Maiden of Mátsaki and the Red Feather.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "The poor young man started forward to part them, but he knew not one from the other, so thinking that the bad one must know how to fight better than his beautiful maiden wife, he suddenly caught up his stone-weighted hoe, and furiously struck the one that was uppermost on the head, again and again, until she let go her hold, and fell back, murmuring and moaning: 'Alas! that thus it should be after all, after all!' Then she forgot, and her eyes ceased to see. While yet the young man looked, lo! there was only the dying maiden before him; but in the air above circled an ugly black Crow, that laughed 'kawkaw, kawkaw, kawkaw!' and flew away."
canonical-instances:
  - "A hiring manager forced to choose between two nearly identical final-round candidates uses 'the one who pushed back harder in negotiation must be the more entitled, less genuine one' as a tiebreaker, when the candidate who pushed back hardest was actually the one who most needed and valued the job, while the passive one had a backup offer and didn't care as much."
  - "A fraud investigator unable to distinguish a genuine claimant from an impostor filing an identical-looking claim assumes 'the one who protests most forcefully is probably lying to cover for the fraud,' when the wrongly accused genuine claimant is the one with the most at stake and therefore protests hardest, while the actual fraudster stays calm because they have nothing real to lose."
critical-questions:
  - "is there ever a reliable behavioral signal that discriminates a genuine claimant from a well-prepared impostor, or does this pattern imply that under true indistinguishability, no behavioral heuristic can be trusted at all?"
  - "the young man had no time to deliberate and had to act to stop the fight -- does this framework offer any alternative to guessing with a heuristic when walking away or refusing to intervene isn't actually available because the situation forces action?"
  - "how does someone recognize, in the moment, that a confident-sounding heuristic ('the real one would act calmer') is untested rather than a reliable rule, especially under the time pressure and adrenaline of watching a violent struggle unfold in front of them?"
