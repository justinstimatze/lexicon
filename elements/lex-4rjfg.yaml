    quote: "'Thirdly, this indeterminacy of appraising achievement in the field of human affairs increases the need for policy-makers to rely on the judgment of experts in recruiting new expert personnel. It is in this way, quite apart from deliberate nepotism, that cliques of advisors tend to develop. For those experts who are in an organization are quite likely to call upon other experts whom they know and concerning whom they can pass grounded judgment on the basis of this direct familiarity. Networks of personal relations among intellectuals serve often as agencies for establishing self-contained cliques, at least among the more important advisors.'"
canonical-instances:
  - "A venture capital firm's deal flow runs almost entirely through a small network of founders and operators who already know each other, which reads as an old-boys' club from outside — but venture returns are so noisy and long-delayed that no clean, near-term performance signal exists to select on instead, making the trust-network the only available substitute for a results-based filter."
  - "Academic hiring committees in highly theoretical fields lean heavily on letters from a small circle of mutually-known senior scholars, which produces visible clustering by advisor lineage — not necessarily because of favoritism, but because the field's own work is too hard for outsiders to verify quickly, so trusted judgment has to stand in for direct assessment."
critical-questions:
  - "Does this frame let real nepotism off the hook too easily — if 'indeterminate expertise breeds cliques' is always available as an innocent explanation, how would anyone ever distinguish a structurally-necessary trust network from actual favoritism operating under its cover?"
  - "Would introducing a cleaner, more verifiable performance metric into an indeterminate field actually dissolve the cliques, or would the metric itself get gamed or ignored once the existing trust-network has enough institutional power to protect its own position regardless of what a new metric shows?"
