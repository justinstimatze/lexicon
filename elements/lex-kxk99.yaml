id: lex-kxk99
name: principles-and-considered-judgments-mutually-adjust-until-coherent
type-in: frame
type-out: process
_tier: atomic
agent-instruction: "When evaluating normative or interpretive theories against intuitions, neither anchor: don't lock the theory and force intuitions to bend to it (rationalist closure), and don't lock the intuitions and reject any theory that conflicts with them (intuitionist closure). Move iteratively in BOTH directions: when a confident considered judgment conflicts with the principle, look for an explanation that either (a) reveals the judgment as distorted (bias, parochialism, limited information) and warrants its revision, or (b) reveals the principle as missing a relevant case and warrants the principle's revision. Continue until principles and considered judgments cohere — the equilibrium state. Rawls's transferable contribution (*A Theory of Justice* §9): the best account of a domain's normative structure is not the one that fits intuitions PRIOR TO theoretical examination, nor the one derived from first principles without regard to intuitions, but the one that fits considered judgments IN REFLECTIVE EQUILIBRIUM — judgments stabilized after weighing candidate principles and the arguments for them. Two interpretive choices Rawls flags (§9): NARROW reflective equilibrium considers only principles close to existing judgments and smooths irregularities; WIDE reflective equilibrium presents all plausible principles + all relevant philosophical arguments and may radically revise the agent's sense of the domain. For moral philosophy Rawls insists the relevant target is WIDE. Transferable applications: (a) ethics + political philosophy (Rawls's home domain — derive principles of justice that match considered judgments under wide reflection; later DEPNs Daniels 1979 generalize the method); (b) legal interpretation (case law + general principle mutually adjust — a new ruling that fails on confident considered judgments either reveals the ruling's flaw or surfaces an exception worth naming; cf lex-8n237 Cardozo); (c) scientific theory + observation (analogous but Rawls (§9) notes a contrast: in physics we cannot revise the heavenly bodies to fit a more elegant theory, so the asymmetry is stricter than in ethics — observations constrain theory more rigidly than judgments constrain principles; nonetheless the iterative adjustment between fit + parsimony recurs); (d) software design (refactoring as moving between principles — abstractions, type systems, architectural patterns — and considered judgments about specific use sites; the equilibrium is the codebase where the principles articulate the patterns the code actually wants); (e) curriculum + pedagogy (the syllabus + the student's accumulated considered judgments about which examples + framings genuinely illuminate must mutually adjust over iterations); (f) institutional policy (a rule + its application history mutually adjust — exceptions accumulate, the rule revises, until both stabilize); (g) self-interpretation + therapy (a theory of one's own pattern + considered judgments about specific episodes mutually adjust; therapy that ignores judgments to fit theory or refuses theory in deference to every judgment fails); (h) AI alignment + interpretability (a candidate explanation of a model's behavior must answer to behavioral judgments in specific cases; both can be revised as evidence accumulates — neither the theory nor any single case is sacred). Distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz distinguishes what-to-do from what-is; lex-kxk99 names a method that operates within either register — operational principles can be reflectively equilibrated against operational judgments, descriptive principles against descriptive judgments. Distinct from lex-znaau premature-closure: lex-znaau names the failure of stopping iteration too early; lex-kxk99 names the constructive method of iterating until coherence. They compose: premature-closure is the characteristic failure mode of reflective equilibrium done badly. Distinct from lex-hm8yx scale-separation: scale-separation is a methodological choice about resolution levels; reflective equilibrium is mutual adjustment between principles and judgments at any chosen scale. Distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions: classification-gaps treats unfilled slots in a classification as predicted-but-unobserved entities (Mendeleev); reflective equilibrium treats mismatches between principle and judgment as opportunities for revision in either direction. They compose: a classification gap is one specific kind of principle/judgment mismatch — the principle predicts an entity the judgments do not yet recognize, and reflective equilibrium asks whether to trust the principle (and look for the entity) or trust the judgments (and revise the principle). Distinct from lex-r3aug open-impartiality-admits-distant-voices-closed-removes-only-intra-group-bias (Sen): Sen's critique applies to the SPECIFIC construction Rawls gives reflective equilibrium when bounded to a single political community; the methodological primitive of mutual adjustment between principles + judgments can be run with open impartiality (admitting outside judgments) or closed impartiality (only insider judgments). The atom names the method; lex-r3aug names the boundary-of-judgment-pool question that arises when applying it. Distinct from lex-8n237 under-determined-rule-admits-multiple-legitimation-methods (Cardozo): Cardozo's framework decomposes ways to apply a rule when it under-determines a case; reflective equilibrium names the iterative adjustment between rule + case-judgments as such. They compose: Cardozo's methods are the moves available when the equilibrium has not yet stabilized — which methodological route to revision the judge selects shapes which side adjusts. Use when: (i) a normative or interpretive theory conflicts with a confident considered judgment in a specific case and the response will be either to revise the theory, revise the judgment, or rest at equilibrium; (ii) institutional policy meets its application history and exceptions are accumulating; (iii) self-interpretive or therapeutic work proposes a theory of one's pattern that conflicts with felt-confident judgments about specific episodes; (iv) any iterative-design context where general principles + specific cases mutually constrain. Counter-move: name the two anchors (which principle, which judgment); ask `if this principle is correct, what explanation accounts for the judgment's distortion?` and `if this judgment is correct, what revision to the principle accounts for it?`; choose between revising principle, revising judgment, or naming the case as a genuine exception; iterate. Failure modes: (a) PSEUDO-EQUILIBRIUM (stopping at narrow when wide is required + the answer changes radically under wide reflection — Rawls §9 flags this directly); (b) ASYMMETRIC ANCHORING (always-revising-judgments-to-fit-principle = rationalist closure, always-revising-principle-to-fit-judgments = intuitionist closure; the method's whole point is the mutual revision); (c) PAROCHIAL JUDGMENT POOL (cf Sen lex-r3aug — running closed impartiality and treating the equilibrium as universal); (d) PREMATURE CLOSURE (lex-znaau — stopping at first coherent fit without testing alternatives)."
