id: lex-e3gkt
name: defining-a-category-as-noun-not-adjective-forecloses-cross-cutting-membership
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Recognize this pattern whenever a population or quality is being folded into a larger coalition, movement, or classification scheme, and the live question is not WHETHER it gets included but HOW it gets defined relative to the other categories already in that scheme — specifically, whether it is defined as an ADJECTIVE (a descriptive quality that can attach to and cut across many different kinds of people, the way 'poor,' 'disabled,' or 'black' can attach to a person of any sexual orientation) or as a NOUN (a separate, bounded 'species' of person, appended alongside the other categories rather than cutting through them). Stryker's claim, made about the 'T' in the LGBT coalition, is that this is not a merely semantic or stylistic choice — it has real, locatable political consequences, and she names both the failed and the working version of the choice directly: 'Most transgender advocates used the word transgender as an adjective to describe a way of being a man or a woman, or as a way of resisting categorization by those labels. Like class or race or physical ability, transgender functioned for them as a descriptive term that cut across the sexual orientation categories, rather than as a noun describing a separate “species” of sexual identity. A transgender man could be gay or straight or bi, in other words, just as he could be black or poor or disabled.' Against this, she names the alternative, noun-based construction that cisgender gays and lesbians in practice imposed on the category: 'Many cisgender gays and lesbians, however, regarded the T precisely as a new species of sexual identity appended to their own. They considered trans people to be, first and foremost, trans people rather than members of the L, G, or B groups who also just happened to be trans.' Stryker's central move is to name the SPECIFIC POLITICAL EFFECT this definitional choice produces, not just its abstract wrongness: 'This construction of transgender identity as a noun rather than an adjective—as a kind of person rather than a descriptive quality attached to another category of personhood—had the unfortunate effect of reinforcing the idea that homosexuality and bisexuality were by definition “gender normative” and that anyone who deviated from the conventional definitions of “man” and “woman” automatically belonged in the transgender category. This way of thinking about transgender tended to reinforce the similarities between homosexual cultures and mainstream society based on shared concepts of gender and to perpetuate the marginalization of transgender people, within both the mainstream society and the LGBT movement.' The mechanism, stated at its most general and transferable: when category X is defined as a NOUN alongside categories A, B, C in a coalition or classification scheme, two effects follow automatically, independent of anyone's stated intentions. First, A, B, and C are implicitly defined as NOT-X by default — the scheme quietly assumes that members of A, B, C do not also carry the X quality, since X has its own separate slot rather than being a dimension every slot could independently vary along. (Here: L, G, and B become implicitly gender-normative by default, because 'transgender' has its own separate box rather than being a quality a gay, straight, or bi person could also have.) Second, X's members are treated as a bolted-on population within the scheme — nominally counted as included, but organizationally, rhetorically, and often literally kept separate from full membership in the categories the scheme was actually built around. Defining X as an ADJECTIVE instead — a quality, like 'poor' or 'disabled,' that any member of A, B, or C might also carry — avoids both effects: it makes X compatible with, rather than exclusive of, every other category in the scheme, and it makes X's members full members of whichever other categories they also belong to, not a separate population appended to the scheme from outside. DISTINCT from lex-fgrmh (Bornstein, coalition-unites-via-shared-defiance-of-a-rule-not-a-positive-identity): Bornstein's claim concerns HOW A POPULATION THAT LACKS A SHARED POSITIVE IDENTITY can nonetheless organize as a single coalition — her answer is to organize around a shared RELATIONSHIP to an external rule (the rule of the gender binary) rather than around any positive trait-in-common, since the population's members (transvestite, drag queen, transsexual, and so on) don't converge on one positive self-description. This atom's claim is a different axis entirely: it presupposes the category has already been named and included in a coalition, and asks a narrower, definitional question — once named, is that category GRAMMATICALLY AND CONCEPTUALLY MODELED as a noun (bounded, separate, exclusive of the coalition's other categories) or as an adjective (a cross-cutting quality compatible with, and present within, the coalition's other categories)? Bornstein's atom is about the BASIS on which a coalition is organized in the first place; this atom is about the STRUCTURAL FORM a category takes once it is inside a coalition already organized on some other basis (in Stryker's history, the LGBT alphabet-soup coalition, organized on a roughly positive-identity basis per category). The two compose directly: a coalition could adopt Bornstein's shared-defiance organizing principle and STILL make Stryker's noun-not-adjective mistake in how it models one of its own component categories, because the two are answers to different questions (how do we hold this coalition together at all, vs. how is this specific category defined relative to the others already inside it). DISTINCT from lex-y2tbg (Butler, essence-as-effect-of-ritualized-repetition-not-its-cause): Butler's claim is about the ONTOLOGICAL STATUS of gender identity itself — whether an apparently stable gender essence is the retrospective effect of ritualized performative repetition rather than its prior cause; it is a claim about how any individual's gendered self comes to appear fixed at all, argued at the level of philosophy of identity. Stryker's claim here makes no ontological claim whatsoever about what transgender identity IS at the level of performative constitution; it is a claim about TAXONOMY AND COALITION POLITICS — a claim about which of two available ways of classifying an already-formed category (as noun or as adjective) a movement chooses, and what follows politically from that choice, regardless of any deeper fact about how gender identity itself comes to exist. A political coalition could accept Butler's performative account of gender identity in full and still face Stryker's noun-versus-adjective choice when deciding how to write its own membership categories, bylaws, or organizational chart — the two claims operate at entirely different levels (ontology of identity vs. taxonomy of coalition-membership) and neither implies nor blocks the other. Cross-domain applications beyond LGBT-movement history: (a) ORGANIZATIONAL DIVERSITY STRUCTURES — a corporate or institutional diversity program that lists 'Women,' 'LGBTQ+,' 'Disability,' 'Veterans,' and 'People of Color' as separate, parallel employee-resource-group slots reproduces exactly the noun-based structure Stryker diagnoses: it implicitly treats each slot as mutually exclusive of the others (as if disabled women, queer veterans, or disabled people of color didn't exist as such) rather than modeling disability, queerness, veteran-status, and race as independently-varying adjectival qualities any employee might carry in combination; (b) LEGAL AND POLICY CLASSIFICATION — a nondiscrimination statute or intake form that lists 'sex,' 'race,' 'disability,' and 'gender identity' as a flat, parallel list of separate protected-category boxes (rather than as independently-varying dimensions) risks the same default-normativity effect: whichever categories are NOT explicitly named on a given form or in a given clause get treated as silently normative for anyone claiming a different named category, reproducing Stryker's LGB-by-default-gender-normative mechanism in a different domain; (c) SUBCULTURE AND FANDOM TAXONOMY — any classification scheme (genre tags, identity-tag systems, community subforums) that adds a new axis of variation as a new PARALLEL CATEGORY rather than as a CROSS-CUTTING TAG risks the same structural mistake: users who fall into the new category get siloed into their own separate space rather than remaining full participants, tagged with an additional adjective, in every space they already belonged to. Failure modes: (a) TREATING THE NOUN-VS-ADJECTIVE CHOICE AS MERELY SEMANTIC OR STYLISTIC — Stryker's explicit point is that the choice has a specific, locatable, non-trivial political payload (default-normativity for the unmarked categories, and marginalization of the marked category's members within a coalition that nominally includes them); dismissing the distinction as 'just wording' is itself the failure Stryker is diagnosing; (b) ASSUMING NOMINAL INCLUSION EQUALS STRUCTURAL INCLUSION — a category can be added to a coalition's name or letterhead (the 'T' added to 'LGB') while still being modeled internally as a noun-species rather than an adjective-quality, in which case the addition changes the coalition's title without changing the marginalizing structure Stryker names; check whether the newly-included category is treated as compatible with and present within the coalition's other categories, or merely appended alongside them; (c) CONFUSING THIS ATOM WITH THE COALITION-ORGANIZING-PRINCIPLE QUESTION (reach for lex-fgrmh) OR THE ONTOLOGICAL-STATUS-OF-IDENTITY QUESTION (reach for lex-y2tbg) — this atom's question is specifically about how an already-included category is grammatically and structurally modeled relative to the OTHER categories already inside the same scheme, not about how the coalition is held together in the first place or about what identity fundamentally is."
