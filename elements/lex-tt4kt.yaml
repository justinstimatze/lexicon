canonical-instances:
  - "The same episode also touches on the festival's annual build-and-teardown discipline -- a structure gets built fresh in the desert and comes down again at the end of every event, with nothing left standing in between. Don't conflate that with this atom's claim: Mars College's capped-lifespan mechanism (lex-2dtcp) is about impermanence lowering the cost of a bad idea, a fully separate question from why the setting's own lack of control produces felt authenticity, which holds regardless of whether anything built inside it is temporary or permanent."
  - "Hypothetical: an escape room company builds an elaborate haunted-house set with professional fog machines, jump-scare timing, and actors -- fully controlled, perfectly safe. Attendees describe it as impressive but never scary. A separate, cheaper event held in a genuinely abandoned, structurally uncertain building, where staff themselves are visibly uneasy about a creaking floor, generates real fear despite far less production value, because the uncertainty in the room is real rather than performed."
  - "operationally distinct from lex-t5f3r (engineer-intimacy-against-a-mass-mediums-own-grain): that atom is about counteracting a medium's default psychological tendency (anonymity at scale) through deliberate design choices within a fully controlled production. This atom is about a different lever entirely -- choosing a setting whose lack of control is itself the source of authenticity, which can't be engineered into a controlled setting no matter how the controlled setting is designed."
critical-questions:
  - "genuine uncontrolled risk (sandstorms, extreme heat, structural hazards) carries genuine potential for real harm alongside whatever immersion it buys -- at what point does the same mechanism that produces authenticity cross into a liability or safety failure the organizers can no longer justify accepting on attendees' behalf?"
  - "does this mechanism generalize past physical, environmental risk to other kinds of uncontrolled exposure (financial risk, social risk, reputational risk in an experience), or is the felt-authenticity effect specific to physical danger that a body can register directly, in a way abstract or social risk might not replicate?"
