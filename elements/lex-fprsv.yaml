evokes: [an-opponent-who-has-been-winning-doesnt-suddenly-turn-careless, cushing-the-hermit-mitsina, bet-your-left-thigh-ill-put-all-you-have-lost, what-an-old-fool-you-are]
lineage:
  - source: primary
    text: cushing-mitsina-offers-the-body-bet-victim-mistakes-it-for-folly
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Hermit Mitsina.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Then old Mitsina, with a jolly, devil-may-care manner, would say: Bet your left thigh. I'll put all you have lost and more, too, on that. The young man would say to himself, with a sigh of relief: What an old fool you are! and reply: All right! I will take your bet. Alas! the one thigh he bet is lost; then the other goes the same way.'"
canonical-instances:
  - "A trader who has been steadily losing to a counterparty is offered a wildly favorable-looking derivative contract and thinks the counterparty must not understand the market, taking the trade eagerly, when the counterparty's apparent generosity actually reflects insider knowledge of a coming move the trader doesn't have."
  - "A poker player who has been losing all night is finally dealt what looks like an unbeatable hand and reads their opponent's continued aggressive betting as a sign the opponent has misjudged the situation, going all-in with contempt for the opponent's apparent foolishness, only to discover the opponent has been reading the table correctly the entire time."
critical-questions:
  - "Is there ever a legitimate case where an opponent who has been winning genuinely does become careless or overconfident, making an apparently favorable offer that really is a mistake on their part -- how would the young man have told a real error apart from bait designed to look like one?"
  - "Does the young man's contempt for Mitsina function as a form of denial about his own losing streak, letting him feel back in control of the game at the exact moment he has the least actual control -- is the emotional need to feel superior part of what makes the trap effective?"
  - "Would the young man have refused the escalating bet if Mitsina had framed it neutrally rather than with a 'jolly, devil-may-care manner' that specifically invites the reading of foolishness -- how much of the trap depends on that particular performance of carelessness?"
