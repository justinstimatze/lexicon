id: lex-5d8hm
name: denied-structure-becomes-unaccountable-informal-hierarchy
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a group denies it has a hierarchy or structure, the structure is still there — just unaccountable and informal. Identify who actually decides what; the absence of formal rules concentrates power in those with access, not those with claim."
