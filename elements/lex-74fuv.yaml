id: lex-74fuv
name: each-successive-pinnacle-of-power-relocates-desire-rather-than-satisfying-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Attaining a long-sought level of power or wealth often produces satisfaction only briefly before the object of desire simply relocates to whatever tier lies beyond it, and this repeats at every successive level with no natural stopping point until nothing bigger remains to want. In the Jataka's tale of the world-emperor, a supreme ruler conquers the earth, then gains a heavenly kingdom, then half of the god Sakka's own realm — satisfied only briefly each time before wanting the next tier. Having run out of anything larger to acquire, he turns on his own co-ruler: 'What is half a realm to me?' said he in his heart; 'I will kill Sakka, and reign alone!' But kill Sakka he could not. This desire and greed of his was the root of his misfortune.' The escalation never had an endpoint built into it. It only had a ceiling, reached the moment there was nothing left to promote desire toward."
related: []
