id: lex-kkkjz
name: enumerate-every-arrangement-of-a-fixed-part-sequence-to-find-unbuilt-designs
type-in: situation
type-out: composition
_tier: atomic
agent-instruction: "When a working design can be described as a short, fixed sequence of typed components, don't stop at the one arrangement you have — write out the small number of OTHER possible orderings of those same components exhaustively, because in a bounded combinatorial space, most of the other arrangements are usually real, unbuilt, patentable designs rather than nonsense. Altshuller demonstrates this on an electromagnetic flow meter, whose working arrangement he denotes as a five-letter sequence: 'the stream to be measured (P) are introduced electrodes (E), a magnetic system (M) is placed outside... The structure of the original construction can be denoted as: the MESEM.' Because the sequence has a small number of positions, the complete set of rearrangements is small and fully listable: 'by rearranging the parts one can obtain another five constructions: EMSME, SMEMS, MSESM, ESMSE, SEMES.' At the moment he wrote this, only two of the six total arrangements had ever been invented — 'only the chute consumption metre along the MESEM pattern together with the log (speed gauge) with the SEMES pattern were known. Four patterns turned out to be new, which had their own characteristics and advantages' — and he confirms each remaining cell corresponds to a real, functionally distinct design (one pattern measures local flow across a stream's width; another uses an internal rather than a dispersal magnetic field, making it more sensitive). He runs the identical exercise on a magnetic filter (six structural rearrangements of MFAFM) and crosses it with a second independent axis (the artefact's physical state: gas, liquid, solid, elastic, powder), producing a 30-cell table where most cells are unfilled, and shows that several already-existing inventions occupy specific cells purely by coincidence — including one (an inside-out magnetic filter) that took seven years to be invented after the first version, and another (a stationary field with the workpiece rotating, instead of the reverse) that took twenty-four years: 'Twenty four years for the transition to the idea of \"don't turn the field, turn the artefact\" is the price paid for unorganised thinking.' Diagnostic move: when a working design can be described as an ordered sequence of a small, fixed set of typed elements (or crossed with a second small axis, like physical state), list every possible ordering exhaustively rather than searching for new ideas by unstructured brainstorming — the resulting table is small enough to inspect cell by cell, the cells already occupied by a known invention confirm the representation is sound, and the empty cells are concrete, checkable candidates for designs that may simply not have been tried yet."
