id: lex-ea48g
name: demonstrated-output-at-the-console-displaces-credentials-as-status-basis
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Apply this when a group needs to decide whose judgment or work to trust, and the default cues available are credentials (degree, age, title, tenure, prior reputation) rather than a directly-observable, hard-to-fake performance. Levy's account of the early MIT hacker culture names the alternative: status is assigned strictly on demonstrated output at the actual task ('hacking'), and credentials are explicitly named as illegitimate substitutes for it ('bogus criteria such as degrees, age, race, or position'). The mechanism has two directional halves, and BOTH must hold for the pattern to be genuinely in effect — a group that only enforces one half is not running this pattern: (1) CREDENTIALS WITHOUT DEMONSTRATED OUTPUT DO NOT BUY STANDING — Levy reports that people who arrived with impressive credentials 'were not taken seriously until they proved themselves at the console of a computer'; the credential does not shortcut the proving. (2) DEMONSTRATED OUTPUT WITHOUT CREDENTIALS DOES BUY STANDING — a twelve-year-old (Peter Deutsch) with no credentials at all was accepted the moment he proved himself, something that would not happen in a credential-gated hierarchy regardless of his actual skill. Levy is explicit that this was not principled egalitarianism ('not necessarily rooted in the inherent goodness of hacker hearts') but incidental to what the group actually optimized for: whether someone could 'advance the general state of hacking' — the mechanism is a SIDE EFFECT of caring intensely about one measurable thing, not a deliberate anti-credentialist ideology. Practitioner move: when building or evaluating a status system that claims to be 'meritocratic,' check both halves independently — a system where credentialed people still get automatic deference (half 1 fails) or where uncredentialed excellent output still gets ignored (half 2 fails) is not actually running this pattern regardless of what it calls itself. The precondition for either half to hold is that the task has a DIRECTLY OBSERVABLE, LOW-AMBIGUITY performance the group can watch and evaluate on the spot ('proved themselves at the console') — remove that observability (the task is slow, subjective, or effects are delayed/attributable) and the mechanism has nothing to substitute for credentials, so groups predictably fall back to credential-based deference by default."
