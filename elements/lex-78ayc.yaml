id: lex-78ayc
name: pre-install-a-latent-receptivity-so-a-later-action-works-easily
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an object will need to respond to some action or field later, but currently has no way to respond to it at all, don't wait until that moment to solve the problem — introduce, in advance, a small addition that gives the object exactly the capacity to respond when the time comes, so the later action becomes trivial. Altshuller names this combination 'receptivity' — pairing the principle of preparatory action with the principle of partial fulfillment — and defines the failure it fixes directly: 'It is hard to extract the ball — it has no receptivity to the extraction effort.' His worked example: a ball jammed tight in a metal recess must later be removed without dismantling the housing. Rather than searching for a stronger extraction technique applied at the moment of removal, the fix is installed before the ball is even pressed in: 'before the ball is pressed in, introduce into the opening a substance which later, when it is necessary to withdraw the ball, under the action of a field, implements the pressing effect... one should introduce a drop of water which before the time for extraction is heated to evaporation point; under the pressure of steam the ball is forced out.' The water does nothing while the ball sits jammed — it only becomes useful the moment a field (heat) is applied to it later, and its entire purpose was to make an otherwise-impossible later action (extracting a ball with no dismantling allowed) trivial. Altshuller traces the same move in a wood-sorting problem where magnetic powder is applied to bark before chipping, so that a later magnetic field can separate it, and in a leak-detection problem where a luminescent tracer is introduced into a liquid before any leak occurs, so that later ultraviolet light can reveal exactly where the liquid has gone. In every case, the pattern is the same: the object gains no obvious new function at the moment the substance is introduced — it only gains a hidden capacity to react correctly to a SPECIFIC field or action that will be applied at a specific later moment. Diagnostic move: when a future action on an object will be difficult or impossible because the object currently has no way to respond to it, ask what small, low-cost addition — a substance, a coating, a marker, a state change — could be introduced right now, well before the action is needed, that would give the object exactly the missing responsiveness; the addition should do nothing on its own and only 'activate' when the intended later field or action arrives."
related: [lex-s3pkr, lex-uq4xw]
scaffolds-from: [lex-s3pkr]
evokes: [receptivity-principle, jammed-ball-steam-extraction-example, pre-mark-for-later-responsiveness, latent-capacity-installed-in-advance]
lineage:
  - source: primary
    text: altshuller-1984-receptivity-defined
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.6 'From Simple to Complex Methods,' section 'Methods Form the System.'"
    quote: "'There is one further important group of complex methods: combinations into which come the principle of preparatory action (method 10) and the principle of partial fulfillment (method 16)... the use of the combination of methods 10 and 16 has been dubbed the principle of receptivity... This is a typical pathway: one introduces a substance capable later of responding easily to the action of a field.'"
  - source: primary
    text: altshuller-1984-jammed-ball-steam-extraction
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.6, 'Methods Form the System,' Problem 46."
    quote: "'It is hard to extract the ball — it has no receptivity to the extraction effort. One must, before the ball is pressed in, introduce into the opening a substance which later, when it is necessary to withdraw the ball, under the action of a field, implements the pressing effect. 'A means of joining parts together one of which is pressed into a deep recess by the other; in order to make it possible to replace the part under pressure, for instance the ball of an indicator tip, before pressing it into the recess one should introduce a drop of water which before the time for extraction is heated to evaporation point; under the pressure of steam the ball is forced out.''"
canonical-instances:
  - "A hardware manufacturer knows a sealed component will eventually need to be identified and traced after years of field use, when opening the casing won't be an option; they embed a passive RFID tag at assembly time that does nothing during normal operation and only 'activates' when a reader is later passed near it — the receptivity to identification was installed long before it was needed."
  - "A construction crew knows a section of concrete will need to be located and cut open years later for a utility upgrade, when it will look identical to the surrounding slab; they embed a strip of metallic mesh in that specific section during the original pour, so a metal detector can later find the exact spot without guessing — the slab's later 'discoverability' was built in from the start."
  - "operationally distinct from lex-s3pkr do-the-hard-later-action-now-while-conditions-still-favor-it: that atom moves the WHOLE intended action itself earlier in time (the entire theft happens before the guard is posted); this atom does NOT perform the later action early at all — it installs a small, inert, unrelated-looking addition now, purely so that the real action, still performed later, becomes newly possible or trivial."
critical-questions:
  - "how far in advance can receptivity be installed before the added substance or marker degrades, gets removed, or becomes unreliable — does the technique assume the gap between installation and use is short enough that the latent addition survives intact?"
  - "does installing a receptivity feature ever create an unintended vulnerability — a substance or marker meant to respond to one specific intended field might also respond to an unrelated field or condition later, producing a false trigger or unintended side effect nobody anticipated at installation time?"
  - "how does someone identify, at design time, which future actions are worth pre-installing receptivity for, when many possible future actions on an object are never actually needed — is there a cost-benefit discipline for deciding which anticipated future needs deserve this kind of advance investment versus being handled reactively if and when they arise?"
status: active
