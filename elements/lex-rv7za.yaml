    quote: "'the sociological factors which lead men to consider their own, relatively low, social position as legitimate, as well as those which lead them to construe their position as a result of defective and possibly unjustified social arrangements clearly comprise a problem area of paramount theoretical and political importance. When are relatively slim life-chances taken by men as a normal and expectable state of affairs which they attribute to their own personal inadequacies and when are they regarded as the results of an arbitrary social system of mobility, in which rewards are not proportioned to ability?'"
canonical-instances:
  - "Two employees passed over for the same promotion, comparing themselves to the same successful peer, can land in opposite places — one concludes 'I need to work harder' (internalized), the other concludes 'the promotion process is political and rigged' (externalized) — and relative deprivation theory alone predicts that both would feel deprived, without predicting which way either one resolves it."
  - "Political messaging that tries to shift a population's felt economic strain from self-blame to system-blame (or the reverse) isn't manufacturing the underlying comparison — the comparison and the resulting sense of shortfall may already exist — it's specifically targeting this second, separate attribution question, which is why the same economic data can be narrated as personal failure to adapt or as structural injustice with equal surface plausibility."
critical-questions:
  - "What DOES determine the self-blame/system-blame split, if not relative deprivation itself? Merton names the question as open rather than answering it — candidates might include the perceived legitimacy of the institution (see the companion atom on legitimacy narrowing comparison range), the availability of a plausible structural narrative, or prior ideological commitments the person already held."
  - "Can the same person hold both resolutions simultaneously about different aspects of the same deprivation (blaming themselves for not having tried a different path, while also blaming the system for the path being closed at all), or does Merton's framing implicitly assume the split resolves to one or the other?"
