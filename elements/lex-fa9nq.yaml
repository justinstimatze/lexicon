id: lex-fa9nq
name: any-signal-informative-about-hidden-effort-improves-the-incentive-contract
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When designing an incentive contract, evaluation, or measurement scheme for someone whose effort or action you can't directly observe — an employee, a contractor, an insured driver, a delegated decision-maker — don't restrict the incentive signal to the single outcome you ultimately care about. Look for ANY other observable correlate of their action, however noisy or indirect, and ask whether it carries information about the action beyond what the outcome already reveals. If it does — if it is a genuinely INFORMATIVE signal, not merely a noisy retelling of the same outcome — incorporating it into the contract makes both principal and agent better off: it lets you reduce the risk premium you're paying the agent to bear outcome-noise, without weakening their incentive to act well. This holds even for signals that are extremely noisy on their own; casual, imperfect supervision is still worth using. Conversely, a measure that adds nothing beyond what the outcome already implies about the action — a signal that is a sufficient statistic away, redundant with the outcome — is worthless to add, no matter how appealing it looks as a KPI. The practical test is not 'is this signal precise?' but 'does this signal move my beliefs about the agent's action beyond what the outcome alone already tells me?'"
related: [lex-9pgpf, lex-aryva, lex-qb3zf, lex-cpq3s, lex-f2vjy, lex-6pcc4]
evokes: [moral-hazard, hidden-action, principal-agent-contract, informativeness-principle, sufficient-statistic-for-effort, casual-supervision-is-still-valuable, deductibles-as-optimal-insurance-contract, noisy-but-informative-signal, holmstrom-1979]
lineage:
  - source: primary
    text: holmstrom-1979-moral-hazard-and-observability
    citation: "Bengt Holmström, 'Moral Hazard and Observability,' The Bell Journal of Economics 10(1):74-91 (Spring 1979). Formalizes the principal-agent problem under moral hazard: an agent's privately-taken action affects the probability distribution of an observable outcome, and Pareto-optimal risk sharing is precluded because it would not induce proper incentives. Holmstrom derives a necessary and sufficient condition — the 'informativeness principle' — for when an additional, imperfect signal about the agent's action can improve a contract that would otherwise be based on the outcome alone, and characterizes the optimal use of such signals. Also shows the result explains the routine use of deductibles in accident insurance."
    quote: "[the core result, Proposition 3:] 'Let s(x) be an optimal sharing rule for which the agent's choice of action is unique and interior in A. Then there exists a sharing rule s(x,y) which strictly Pareto dominates s(x) if and only if [the signal y is not a sufficient statistic for the action]; or more concisely, a signal is valuable if and only if it is informative.' [on what this means in practice:] 'The conclusion that a noninformative signal will have no value may not be surprising... Basically, it tells us that pure randomization does not pay. The more important part of the proposition is the result that any informative signal, regardless of how noisy it is, will have positive value (if costlessly obtained and administered into the contract).' [on casual, imperfect monitoring:] 'Suppose first that y is independent of x. This could be the case if the agent is directly monitored or supervised... Thus, whenever g depends at all on a, it is informative and consequently valuable. Even the most casual supervision of an agent can be used to the benefit of both parties.' [the deductibles application, Proposition 2:] 'Given the assumptions in (11), optimal accident insurance policies entail a deductible. If the insured's action only affects the probability of an accident but not the size of damage and the insurance company is risk-neutral, a deductible alone is optimal.' [from the introduction, framing the problem:] 'The source of this moral hazard or incentive problem is an asymmetry of information among individuals that results because individual actions cannot be observed and hence contracted upon... interest centers around the use of imperfect estimators of actions in contracting. Casual observation indicates that imperfect information is extensively used in practice to alleviate moral hazard, for instance in the supervision of employees or in various forms of managerial accounting.'"
canonical-instances:
  - "the paper's own deductibles result: optimal accident-insurance contracts entail a deductible because the insurer's payoff outcome (whether an accident occurred, and how large) is itself informative about the insured's care level — no additional monitoring signal is even needed once the outcome distribution's dependence on effort is used correctly"
  - "'even the most casual supervision of an agent can be used to the benefit of both parties' — a manager's occasional, imperfect check-in on a report's process (not just the report's final numbers) is worth incorporating into a performance review, because it is informative about effort even though it is far noisier than the outcome itself"
  - "conditional information systems: investing in a costly, more-informative signal (e.g., an audit) only when the outcome is already bad economizes on information costs while capturing most of the value — checking harder exactly when the outcome alone leaves the most uncertainty about whether the agent shirked"
  - "operationally distinct from lex-9pgpf (Jensen-Meckling agency theory / tempo mismatch): that atom's lever is the SPEED MISMATCH between the evaluator's clock and the value-creation clock. This atom's lever is INFORMATION CONTENT — which additional signals, at any speed, are worth adding to the contract at all"
  - "operationally distinct from lex-qb3zf (Jackall milking-the-asset): that atom is about an agent's incentive to extract now because the consequence-window exceeds their tenure-window — a TIME-HORIZON problem. This atom assumes a fixed horizon and asks a different question: given that horizon, what signals should the contract actually be conditioned on"
  - "operationally distinct from lex-cpq3s (Achen-Bartels blind retrospective voting): that atom describes a FAILURE — voters cannot filter noise from signal and punish incumbents for luck. This atom is CONSTRUCTIVE — it says how a rational contract-designer, aware of the noise, should still extract value from any signal that carries real information, rather than being fooled by noise or discarding informative-but-noisy measures altogether"
  - "operationally distinct from lex-aryva (Akerlof lemons): that atom is adverse selection — the counterparty's TYPE (quality) is hidden and fixed before the contract. This atom is moral hazard — the counterparty's ACTION (effort) is hidden and chosen after the contract, and the fix is a different one: incentive-compatible use of any informative signal, not signaling or screening on type"
critical-questions:
  - "is the candidate signal genuinely informative about the agent's action beyond the outcome — or is it merely correlated with the outcome itself (in which case adding it is administratively costly and adds no real value)? The test is whether the signal changes inference about the action, not whether it looks intuitively relevant"
  - "what does administering this additional signal cost — in measurement, monitoring, or contract complexity? Holmstrom's result establishes that an informative signal has positive value in principle, not that it's worth its administrative cost in every case"
  - "has the organization instead added a metric that FEELS like it should matter (activity, hours logged, meetings attended) without checking whether it's actually informative about the action being incentivized, versus just another noisy proxy for the same outcome?"
  - "is the contract artificially restricted to a narrow class (e.g. a single linear bonus formula) for administrative simplicity? Holmstrom notes informativeness may not guarantee improvement within an arbitrarily restricted contract class — the general result assumes the contract form itself can adapt to use the new signal"
status: active
