    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 44. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Polecat used to be unreliable. Perhaps he has fooled me and I have not discovered it yet.' ... So he turned his anus toward the rock and broke wind and the rock was blown to pieces. 'Well, the little wayward fellow did tell the truth after all!' ... 'I am sure that he did not give me the full amount,' Trickster again said to himself, 'for he is a very peculiar fellow. He did more than I expected in giving me three rounds of ammunition.' ... Then he hid himself and pointed his anus outside and said, 'Deer, come here and eat.' ... All of a sudden they saw him standing near the door, with his anus turned toward them, trying to expel gas. He strained himself very much but with each straining simply soiled himself all the more. ... Then all the deer left. They even stepped on him and bruised him."
canonical-instances:
  - "An engineer distrusts a vendor's newly patched authentication library despite it passing every test in staging multiple times, keeps re-running tests that keep passing without ever feeling reassured, and the library still fails during the actual production login surge it was purchased to handle, in front of the exact users and stakeholders the patch was meant to protect."
  - "A pilot privately runs an unfamiliar backup system through several successful checks before a flight and still can't shake a nagging doubt about it, narrowing their worry each time to some untested edge case, and the system fails during the one real emergency where passengers are actually depending on it working."
critical-questions:
  - "Is Trickster's persistent doubt despite repeated successful tests evidence of good instinct, that the gift really was unreliable in some way he couldn't yet identify, or is it simply anxious rumination disconnected from the actual evidence in front of him, which kept confirming reliability every time?"
  - "Does the specific target matter here, inanimate objects like a rock and a tree versus live, moving deer, suggesting the tool's failure might be a real functional difference rather than a matter of luck running out, and if so, would earlier testing against a live target have caught it?"
  - "Would Trickster's family have been less harmed by his failure if he had disclosed his ongoing private doubts to them beforehand, rather than presenting the plan with confidence right up until it collapsed in front of them?"
