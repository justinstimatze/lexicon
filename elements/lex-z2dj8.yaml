id: lex-z2dj8
name: a-mutual-pact-to-report-back-from-beyond-death
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'Facing an unfalsifiable uncertainty neither party can resolve in advance, two people can make a mutual pact that whichever dies first will return and report on what follows, converting an unverifiable metaphysical question into something the survivor expects, in principle, to be able to confirm. In the Jataka''s tale of the chaste king, the king and his consort make exactly this pact before either has died: "nay, a promise they even made, that which of them soever should first die, he should return to the other from his place of new birth, and say, ''In such a place am I born again.''"'
related: []
evokes: [jataka, ekadasanipata, udaya-jataka, return-from-death-motif, unfalsifiable-claim-converted-to-testable]
lineage:
  - source: primary
    text: jataka-chalmers1895-udaya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 458, Udaya-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "nay, a promise they even made, that which of them soever should first die, he should return to the other from his place of new birth, and say, \"In such a place am I born again.\""
canonical-instances:
  - "Two elderly siblings, unsure what either believes about an afterlife, half-jokingly agree that whichever dies first will find a way to signal the other, and the survivor spends years genuinely watching for it."
critical-questions:
  - "Does making the pact actually convert the uncertainty into something testable, or does it only create the appearance of testability while leaving every possible outcome — a sign, or no sign — equally consistent with either belief?"
status: active
