id: lex-xuna9
name: discursive-practice-is-mutual-scorekeeping-of-commitments-and-entitlements
type-in: process
type-out: frame
_tier: atomic
status: active
agent-instruction: "Recognize this when language is being modeled as a representation-conveyance pipe (speaker encodes meaning → hearer decodes) and you observe that the actual conduct of inquiry depends on something the pipe-model can't see: who is on the hook for what, who is entitled to make a claim without further justification, and how a new assertion shifts that ledger. Brandom's transferable claim (Making It Explicit Ch.3): the practice of giving and asking for reasons is fundamentally NORMATIVE-PRAGMATIC. Each speaker keeps DEONTIC SCORE — tracking their own and others' (a) COMMITMENTS (what each speaker has bound themselves to by their assertions) and (b) ENTITLEMENTS (which of those commitments the speaker has earned the right to hold without further challenge, by deferring to authority, by inference from other commitments, or by direct observation). The norms governing language are IMPLICIT in this scorekeeping practice. Asserting is not transmitting an internal state to a receiver; it is undertaking a public commitment that scorekeepers will hold you to, and authorizing others to inherit that commitment (deferral). Three vital consequences. (1) DEONTIC STATUS IS INSTITUTED BY ATTITUDE, NOT CAUSED BY FACT — 'the natural world does not come with commitments and entitlements in it; they are products of human activity... creatures of the attitudes of taking, treating, or responding to someone in practice as committed or entitled.' Commitment is not a brain-state; it's a status assigned by other scorekeepers' practice of holding-you-to-it. (2) INFERENTIAL ARTICULATION IS WHAT MAKES CONTENT PROPOSITIONAL — a proposition is whatever can serve as a PREMISE or CONCLUSION in the inferential network that scorekeepers track. Meaning is not picture-of-the-world but inferential-role in the commitment-scoreboard. (3) MAKING-IT-EXPLICIT IS THE SUBSTRATE METHOD — the title-move of the book: implicit norms are best understood by surfacing them in vocabulary that lets practitioners discuss them explicitly. Normative vocabulary (`is committed,` `ought,` `entitled to`) exists to make the scoreboard discussable. Transferable applications: (a) CODE REVIEW — the author's PR is an undertaking of commitments (to invariants, to behavior, to performance) that the reviewer tracks; the author is entitled to defer to upstream library docs (inheriting their commitments); reviewer questions whose entitlement isn't established. (b) SCIENTIFIC PEER REVIEW — the paper asserts findings (commitments); reviewers probe entitlement (was the method appropriate? do the data support it?); citations are deferral (inheriting commitments from cited work). (c) LEGAL PROCEEDINGS — the witness commits to a story; cross-examination probes entitlement; precedent is inherited commitment. (d) CONTRACT NEGOTIATION — each clause is an undertaking; the scoreboard tracks who has committed to what; downstream disputes are about which scoreboard state was authoritative. (e) GIT AUTHORSHIP / BLAME — committing code asserts you maintain it; reverts/follow-ups shift entitlement; commit history is a scoreboard. (f) LLM DIALOGUE — when the model asserts a fact, the conversational scoreboard now contains a commitment; later turns can challenge entitlement or extend by deferral. (g) CONVERSATIONAL TURN-TAKING — every utterance shifts the deontic scoreboard; clarification requests are entitlement-probes; backchannels are acknowledgments. (h) PROFESSIONAL CREDENTIALING — a license/certification is a third-party-issued entitlement to make certain claims without further justification. (i) ATTRIBUTION & TRUST GRAPHS — chains of inherited commitment from primary source through intermediaries. Distinct from lex-p48xw articulation-as-thinking-completion-test (Vygotsky-Polanyi-Feynman tradition: thinking-via-verbalization as INDIVIDUAL cognitive completion). lex-xuna9 is about INTER-PERSONAL deontic accounting; lex-p48xw is about INTRA-PERSONAL articulation as cognition. They compose: articulating to think (lex-p48xw) IS the speaker-side activity that produces the public commitments lex-xuna9 tracks. Distinct from lex-3656j shared-institutional-reality (Berger-Luckmann reciprocal typification): Berger-Luckmann's claim is about how INSTITUTIONS become objective-and-taken-for-granted via habituation + typification. Brandom is about how INDIVIDUAL ASSERTIONS within a linguistic institution carry deontic weight via the scorekeeping practice. They compose: the discursive institution lex-3656j names is the broader frame within which lex-xuna9's scorekeeping happens. Distinct from lex-d7h2y paltering-as-truth-arranged-to-deceive (Schauer-Rogers): paltering is a specific deceptive ASSERTION strategy. lex-xuna9 names the underlying scoreboard against which paltering is a manipulation. Distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition-not-its-cause (Butler performativity): Butler's claim is about gender-as-performative-doing; Brandom is about LINGUISTIC commitment as performative. Both extend the Austin-1955 performative-utterance tradition. Counter-move when a discussion treats assertion as mere information-transmission: surface the commitment-scoreboard. Ask whose commitments are at stake, who is entitled to what, and how this assertion shifts the scoreboard. Failure modes: (i) DEONTIC-VACUUM speech — assertions with no scorekeeper-tracking (e.g., late-stage LLM hallucinations in non-evaluated contexts) become noise because the commitment is unwitnessed; (ii) MASS-ENTITLEMENT-WITHOUT-INHERITANCE — too many assertions become entitled by default (vibes/social proof) rather than by inheritance from primary sources, producing unmoored discourse; (iii) UNCOLLECTED-COMMITMENT — a speaker incurs commitments the scorekeepers never call on, eroding the practice of accountability (the classic 'no one fact-checks anymore' complaint)."
