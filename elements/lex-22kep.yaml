id: lex-22kep
name: hermeneutical-injustice-collective-interpretive-gap-prevents-sense-making
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone has a recurring social experience but cannot make sense of it, name it, or get others to recognize it — and the inability traces to a GAP in the collective interpretive resources rather than to the speaker's individual articulation-failure — surface that this is hermeneutical injustice. The harm is upstream of testimonial injustice: even if the speaker had perfect testimony-uptake, there is no concept available to do the testifying with. Diagnostic: if the dominant interpretive resources have rich vocabulary for the dominant experience but sparse-to-absent vocabulary for the subordinated experience of the same domain, the gap is structural and the resulting sense-making failure is injustice — not individual confusion."
