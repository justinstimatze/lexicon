id: lex-uyx42
name: minimal-violation-of-a-category-maximizes-a-concepts-memorability
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a concept, story, or design spreads unusually well, check whether it's built from a well-understood category with exactly one salient property violated, rather than many. Boyer's claim: a concept that activates an intuitive ontological category (PERSON, ANIMAL, PLANT, ARTIFACT) and then violates just one of that category's built-in expectations inherits the category's whole rich inference structure for free, while the single violation supplies the attention-grabbing hook. A statue that hears prayers keeps every other PERSON-like and OBJECT-like inference (it has a location, a history, can be addressed) except the one violated property (an inanimate object with perception) — that's what makes it easy to represent, remember, and retell, not because it's stranger than a fully alien concept but because it's cognitively CHEAPER: maximum inferential payload for minimum violated structure. A concept that violates many category-expectations at once (a talking, bodiless, locationless, timeless thing) loses the inheritance and becomes hard to hold in mind, not more impressive."
related: [lex-k7m6e, lex-57wqk]
evokes: [minimally-counterintuitive-concept, ontological-category-violation, inheritance-of-inferential-structure, cognitive-optimum-for-transmission, boyer-1994-2001]
lineage:
  - source: primary
    text: boyer-2001-religion-explained
    citation: "Pascal Boyer, Religion Explained: The Human Instincts That Fashion Gods, Spirits and Ancestors (Vintage/Random House, 2001; also published as Religion Explained: The Evolutionary Origins of Religious Thought)."
    quote: "'Religious concepts invariably include counter-intuitive information, relative to the category activated.' [the technical definition of the term:] ''Counter-intuitive' is a technical term here. It does not mean strange, inexplicable, funny, exceptional or extraordinary. [...] these concepts are still counter-intuitive in the precise sense used here, namely 'including information contradicting some information provided by ontological categories'.' [the transmission payoff:] 'These concepts just happen to be optimal in the sense that they activate a variety of systems in a way that makes their transmission possible.'"
canonical-instances:
  - "A statue that hears prayers (Boyer's own recurring example): activates the ARTIFACT category (has a location, was made, occupies space) and the PERSON category's perception-sub-inference (can hear, can be addressed) without violating anything else — it still can't move on its own, still has one location, still needs no food. Almost the whole ARTIFACT/PERSON inference set survives; only perception-without-a-body is added."
  - "A mountain that eats and bleeds (Aymara mountain-deity concept, cited by Boyer): activates NATURAL OBJECT (has a fixed location, a stable form) and adds PERSON/ANIMAL biological properties (feeding, bleeding) as the single violation — everything else about being a stationary, massive, geographically fixed thing stays intact."
  - "A ghost that passes through walls but still recognizes family members, still has a name, still 'wants' things: violates PERSON's physical-solidity expectation while keeping PERSON's psychological and social inference-set completely intact — which is why ghosts are easy to reason about (you can still ask what a ghost wants) despite being physically impossible."
  - "Design and branding analog: a mascot, logo-character, or fictional AI system that is given exactly one impossible or exaggerated trait (talks, but is otherwise a normal dog; is superhumanly strong, but otherwise behaves like an ordinary person) is easier to remember and retell than one redesigned wholesale — the single violation is memorable precisely because everything else can be inferred for free from the base category."
  - "operationally distinct from lex-k7m6e shared-coordinated-action-generates-collective-effervescence: lex-k7m6e (Durkheim) explains WHY a group ritual generates the FEELING of the sacred at all — a social-mechanism account of religious experience's origin. This atom explains WHY a specific concept (a god, a spirit, a supernatural claim), once it exists, is easy to represent, remember, and pass on — a cognitive-transmission-bias account of religious CONTENT's success. They're complementary, not competing: Durkheim's mechanism can generate the occasion and emotional charge for a religious idea; Boyer's mechanism explains which candidate ideas survive the retelling process afterward."
critical-questions:
  - "how many category-expectations does this concept actually violate — one, or several? The claim predicts a sharp memorability drop-off past roughly one salient violation, not a smooth gradient where 'weirder is more memorable'"
  - "which base category is doing the inheritance work, and is it genuinely intuitive/universal (PERSON, ANIMAL, ARTIFACT, NATURAL OBJECT) or a culturally-specific category being mistaken for a universal one — the mechanism's predictive power depends on the base category being a real cross-cultural cognitive default"
  - "is the concept's spread actually being explained by minimal-violation memorability, or is something else doing the work (institutional enforcement, economic incentive, coercion) that would produce the same observed prevalence without this cognitive mechanism — transmissibility-by-design and transmissibility-by-force are both possible explanations for a widespread concept and need to be distinguished"
status: active
