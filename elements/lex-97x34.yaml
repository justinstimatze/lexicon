id: lex-97x34
name: contact-between-beings-produces-friction-that-solitude-avoids
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'Observing that two objects touching each other produce noise while an object alone produces none, a person can generalize the physical principle to social and political life: solitary beings never clash, and it is contact between them — including the act of ruling others — that inevitably produces friction, favoring self-governance over governing others. In the Jataka''s tale of Kumbhakara, King Naggaji reaches paccekabuddha-hood from exactly this observation: "That bracelet when separate touched nothing, it now touches the second and makes a noise: just so living beings when separate do not touch or make a noise, when they become two or three they rub against each other and make a din: now I ought to dwell like the single bracelet ruling myself and not ruling another."'
related: []
evokes: [jataka, sattanipata, kumbhakara-jataka, contact-produces-friction, self-rule-over-ruling-others]
lineage:
  - source: primary
    text: jataka-chalmers1895-kumbhakara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 408, Kumbhakara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "That bracelet when separate touched nothing, it now touches the second and makes a noise: just so living beings when separate do not touch or make a noise, when they become two or three they rub against each other and make a din: now! rule the inhabitants in the two kingdoms of Cashmere and Candahar, and I too ought to dwell like the single bracelet ruling myself and not ruling another"
canonical-instances:
  - "After years of managing a large team, an executive steps down to become an independent consultant, reasoning from a single quiet weekend alone that most of her stress came not from the work itself but from the constant friction of coordinating other people's competing needs."
critical-questions:
  - "Does eliminating contact with others actually eliminate the friction, or does it just remove the visible noise while leaving the underlying tensions unaddressed and unresolved?"
  - "Is a single bracelet a fair model for a person, given that isolation forecloses cooperation's benefits along with its friction — does the analogy quietly assume solitude has no costs of its own?"
status: active
