id: lex-wvb83
name: survivors-misread-unrelated-attrition-as-proof-of-their-own-fitness
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a group pursuing an ambitious, risky venture loses members one by one to causes that have nothing to do with the actual challenge ahead, watch for the remaining members to interpret each loss as proof of the fallen member's inferiority rather than as a warning about the venture itself -- the confidence of the survivors tends to rise with every casualty, even though the objective odds of anyone succeeding haven't improved at all. In Zitkála-Šá's telling, seven characters set out together 'to make war,' and each is eliminated by an ordinary environmental hazard entirely unrelated to combat: wind blows away the Ashes, water extinguishes the Fire, a thorn apple kills the Bladder for trying to rise above the treetops, mud pulls off the Grasshopper's legs, grief over the Grasshopper literally causes the Dragon Fly's head to fall off from crying too hard. Each time, the survivors respond identically: 'Ho! he could not fight, this one!' -- treating an unrelated accident as if it were a combat-fitness test the fallen member failed, and using that verdict to reassure themselves rather than to question whether the expedition itself is sound. By the end, only two of seven remain, and their confidence is, if anything, higher than when there were seven, purely because they're still standing. The mechanism is a pure survivorship error: nothing about surviving wind, fire, height, or mud actually predicts anything about surviving an actual battle, so each 'validation' is manufactured entirely out of the fact of still being alive, not out of any real evidence of fitness for the task ahead. Diagnostic move: when a team or venture is shedding members or resources to causes unrelated to its actual core challenge, don't let the remaining participants' rising confidence stand in for evidence -- ask directly whether anything about the losses actually predicts success at the real task, or whether 'we're still here' is being mistaken for 'we're the ones equipped to win.'"
