    quote: "'as Köhler has pointed out, everyone knows that we come to forget many experiences, and many take it for granted that this decay of memory is simply the result of passage of time. Yet recent experimental work in psychology has shown how much more complex are the processes which make for faulty memory; that forgetting is less a case of old experience fading from memory than of \"the interference, inhibition, or obliteration of the old by the new.\" It might also be said that it is the office of systematic study to question the \"self-evident\" commonplaces of human experience and to show, often if not invariably, that these are not what they seem.'"
canonical-instances:
  - "Everyone has always known that muscles get sore after unfamiliar exercise, and for decades the folk explanation ('lactic acid buildup') stood unquestioned precisely because the gross fact — soreness happens — felt fully explained by it, until researchers actually tested the claim and found lactic acid clears within hours, long before soreness peaks, and the real mechanism is microscopic muscle-fiber damage and inflammation."
  - "Sailors and coastal communities have always known that the tides go in and out, twice a day, with total reliability — that gross-level familiarity was compatible with centuries of having no correct account of WHY, and folk explanations (a breathing sea-monster, a cosmic sponge) filled the gap unchallenged because nobody experienced the reliable daily fact itself as a live question."
critical-questions:
  - "How would you tell, from the inside, that you're in this trap right now — that some phenomenon you consider fully understood is actually only understood at the gross level, with an unexamined or wrong mechanism silently filling in the rest? Is there a general tell, or does it only ever become visible in hindsight, once someone else has already done the systematic study?"
  - "Does the mechanism generalize past 'commonsense knowledge' to expert knowledge as well — can a field's own established, textbook explanation for a well-known phenomenon function the same way this folk theory of memory did, foreclosing further mechanistic inquiry within the field itself because the phenomenon already has an accepted (but possibly wrong or incomplete) explanation?"
