id: lex-62kfn
name: verifying-freedom-from-resentment-before-committing-support-to-the-wronged
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'Before deciding to stand by someone who has been wronged, a would-be supporter can first check directly whether the wronged person harbors ill will toward those responsible, treating that inner state as the actual precondition for the support rather than the injustice itself. In the Jataka''s tale of Kanhadipayana, the friend asks explicitly before sitting down: "''Can you guard against ill feeling, or not?'' asked the other. ''Good friend,'' said he, ''neither against those who have seized me, nor against the king, either, is there any ill feeling in my mind.''—''If that is so, the shadow of one so virtuous is delightful to me.''"'
related: []
evokes: [jataka, dasanipata, kanhadipayana-jataka, verifying-inner-state-before-support, freedom-from-resentment-as-precondition]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanhadipayana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 444, Kanhadipayana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Can you guard against ill feeling, or not? asked the other. Good friend, said he, neither against those who have seized me, nor against the king, either, is there any ill feeling in my mind. If that is so, the shadow of one so virtuous is delightful to me."
canonical-instances:
  - "Before agreeing to publicly back a colleague through a messy dispute, a senior partner first asks privately whether the colleague is out for revenge or genuinely just wants a fair outcome, making his own support conditional on the answer rather than on the unfairness alone."
critical-questions:
  - "Is checking for the wronged party's inner state before offering support a reasonable precondition, or does it place an unfair burden of emotional composure on someone who has already been harmed?"
status: active
