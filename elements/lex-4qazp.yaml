id: lex-4qazp
name: granting-the-desired-object-defuses-infatuation-faster-than-denial
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Infatuation with an idealized object can be cured faster by granting it outright and letting ordinary tedium replace the fantasy, than by denying access and leaving the idealization intact. In the Jataka's tale of the ascetic Mudulakkhana, a king, warned in advance, doesn't refuse the queen to the smitten ascetic — he gives her to him, and she has him fetch a house, clean out its filth himself, plaster the walls, and gather furnishings one mundane chore at a time. The fantasy doesn't survive the accumulation of ordinary friction; a single jarring line about what he's become breaks the spell that months of forbidden distance never could have touched, because distance leaves the idealized image untested."
related: []
evokes: [jataka, ekanipata, mudulakkhana-jataka, granting-access-defuses-idealization, tedium-breaks-a-fantasy-that-denial-preserves]
lineage:
  - source: primary
    text: jataka-chalmers1895-mudulakkhana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 66, Mudulakkhana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Hast thou forgotten that thou art a holy man and a brahmin?\""
canonical-instances:
  - "A manager who suspects an employee romanticizes a transfer to a glamorous-sounding department doesn't block the transfer — they approve it immediately, and the employee's fascination evaporates within weeks once the daily reality of the role replaces the idea of it."
critical-questions:
  - "Does this approach risk real harm if the granted access itself carries genuine costs or dangers, given that the technique deliberately lets the person fully enter the situation rather than staying protected from it?"
  - "Is the mundane-friction method reliably faster than denial, or does it just trade a slower, invisible erosion of willpower for a faster, more visible one that happens to look like a cure?"
status: active
