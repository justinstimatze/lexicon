id: lex-geqyt
name: claimed-fertility-of-tolerating-x-is-parasitic-on-refusing-x
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone credits a phenomenon (contradiction, conflict, dissent, failure) with being generative -- it's what produces progress, growth, new ideas -- and uses that credit to argue we should therefore accept or tolerate more of it, check whether the generativity actually comes from a background refusal to accept it, one that the proposal would remove. Popper's dissection of dialectic: dialecticians correctly observe that the contradiction between a thesis and antithesis is fertile, producing a synthesis and thereby progress -- and conclude that contradictions need not, or even cannot, be avoided. But trace WHERE the fertility actually comes from: 'it is true, however, only so long as we are determined not to put up with contradictions, and to change any theory which involves contradictions... It cannot be emphasized too strongly that if we change this attitude, and decide to put up with contradictions, then contradictions must at once lose any kind of fertility... In other words, all criticism (which consists in pointing out contradictions) would lose its force. Criticism would... be answered by \"And why not?\" or perhaps even by an enthusiastic \"There you are!\"; that is, by welcoming the contradictions which have been pointed out to us.' The dialectician cannot have it both ways: 'Either he is interested in contradictions because of their fertility: then he must not accept them. Or he is prepared to accept them: then they will be barren, and rational criticism, discussion, and intellectual progress will be impossible.' The generative force was never the contradiction itself -- it was the standing refusal to let a contradiction stand, which is what forces revision. Remove the refusal and you remove the fertility along with it, even though the thing being praised (the contradiction) is still just as present as before. Diagnostic move: when X is praised as productive and that praise is used to argue for accepting more X, ask what was actually doing the producing -- if it's the resistance to X rather than X's mere presence, then endorsing X wholesale doesn't get you more of the good effect, it gets you the effect's disappearance."
