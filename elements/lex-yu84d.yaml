id: lex-yu84d
name: scolding-a-killer-flips-to-relief-once-the-benefit-is-named
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A caregiver's shock at hearing that someone has been killed can function as a scripted first response rather than a genuine reaction, one that reverses completely and instantly the moment the practical benefit of the killing becomes clear. In Radin's Winnebago Hare Cycle, this happens with mechanical regularity: every time Hare reports killing one of his grandmother's brothers, she responds first with performed outrage, then immediately with relief once she names what's in it for her. After Hare kills the bear, he reenacts the killing for her: 'Oh, you big-eyed, big-eared, big-footed creature, you must have killed my brother,' she exclaims, and Hare threatens to do the same to her. She reverses instantly: 'Oh, I only said that in fun. Actually I am glad, for now we shall have plenty of fat to eat.' The outrage was never a real objection to the killing; it was a formality that evaporated the moment the food supply was named as the actual stake. Diagnostic move: when someone's strong disapproval of an action reverses completely and immediately the instant a concrete benefit to them is mentioned, treat the disapproval as having been about appearances rather than principle, and weigh what they say once the benefit is on the table more heavily than what they said before it was."
