canonical-instances:
  - "Two people hold the identical title of 'senior engineer' at the same company, but one uses the title as a platform for internal politics and cross-team favor-trading while the other treats it purely as recognition of technical depth and rarely exercises any organizational leverage from it — the title predicts almost nothing about which behavior you'll see."
  - "Two professors hold the same tenured chair at the same university; one uses it primarily to accumulate committee influence and shape departmental hiring, the other treats committee service as a minor, largely honorary obligation and channels all their energy into research — comparing their behavior by job title alone would miss the entire explanation."
critical-questions:
  - "Is the split between using a position instrumentally (as leverage) versus formally (as mere recognition) itself explained by something upstream — like the local/cosmopolitan orientation Merton identifies — or can the same person switch which way they play an identical position depending on context, making it a strategy rather than a fixed disposition?"
  - "How would an outside observer, without extensive interviews like Merton's, detect which way someone is playing a formal position — is there an observable behavioral signature, or does this pattern only become visible in retrospect once enough decisions have accumulated to show a trend?"
