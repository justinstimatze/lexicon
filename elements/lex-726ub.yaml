    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 6 'The Unwritten Rules of American Politics,' closing caveat on the racial-exclusion foundations of twentieth-century American bipartisan norms."
    quote: "'We must conclude with a troubling caveat, however. The norms sustaining our political system rested, to a considerable degree, on racial exclusion. The stability of the period between the end of Reconstruction and the 1980s was rooted in an original sin: the Compromise of 1877 and its aftermath, which permitted the de-democratization of the South and the consolidation of Jim Crow. Racial exclusion contributed directly to the partisan civility and cooperation that came to characterize twentieth-century American politics. [...] America's democratic norms, then, were born in a context of exclusion. As long as the political community was restricted largely to whites, Democrats and Republicans had much in common. Neither party was likely to view the other as an existential threat. The process of racial inclusion that began after World War II and culminated in the 1964 Civil Rights Act and 1965 Voting Rights Act would, at long last, fully democratize the United States. But it would also polarize it, posing the greatest challenge to established forms of mutual toleration and forbearance since Reconstruction.'"
canonical-instances:
  - "The Compromise of 1877 installed Hayes in exchange for pulling federal troops out of the South. Thirteen years later, the 1890 Federal Elections Bill — the last federal push to protect Black voting rights — failed too. Both took Black political equality off the table entirely, and the book credits exactly that removal, not any independent growth in political maturity, with softening the partisan hostility that had persisted since the Civil War."
  - "Hypothetical: a company's engineering and sales departments are famously low-conflict for years, because a large contractor workforce doing the disputed on-call and support labor has no voice in either department's planning meetings. Once the company converts contractors to employees with a seat at the scheduling table, engineering and sales suddenly find themselves in open conflict over who bears the burden of undesirable work — a conflict the old arrangement had simply never had to register, not one the change created from nothing."
critical-questions:
  - "Is there a way to tell, from inside a period of apparent civility, whether it reflects genuine accommodation or an exclusion-funded truce, before the excluded party's return reveals which one it was?"
  - "The book frames the post-1965 polarization as a cost of inclusion. Is 'cost of inclusion' the right description, or is it more accurate to call it a bill finally coming due for a peace nobody had actually paid for the first time around?"
  - "A settlement between litigants that ignores affected bystanders, a merger nobody's workforce is consulted on — do cases like these run on the same mechanism, or is something narrower required: specifically, that the excluded party's own inclusion stays a decision in the hands of whoever benefits from excluding them?"
