id: lex-kdt2v
name: need-reduction-and-supply-augmentation-are-equivalent-paths-to-affluence
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "Affluence is the ratio between what you need and what you have access to. The conventional path closes the gap from the supply side — produce, earn, accumulate more. Sahlins names a second, equally valid path: close the gap from the need side — want less, depend on fewer things, accept what is sufficient. Hunter-gatherers, on this analysis, achieve affluence not by producing more but by needing less; the ~2-3 hours per day !Kung adults spent on basic provisioning is not poverty but the Zen path to affluence. The practitioner-move: when a constraint feels tight, the default move is to augment supply (build more, hire more, raise more, ship more). Surface the second path: what would it look like to shrink the need-side instead? Are these requirements actually required, or could the system meet a smaller specification? This generalizes far beyond economics: Stoic and Buddhist traditions are need-reduction technologies; voluntary simplicity, minimalism, FIRE; lean engineering (build only what is truly needed); reducing dependencies in software (fewer packages = fewer failure modes). The two paths are not morally equivalent in all contexts — supply-augmentation can drive innovation; need-reduction can drive austerity. They ARE structurally equivalent as ways to make the supply/need ratio cross the sufficiency threshold. Most cultural-economic argument treats supply-augmentation as the only path; surfacing the need-reduction path opens design space."
