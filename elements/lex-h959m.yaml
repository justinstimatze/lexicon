evokes: [maldacena-1997, ads-cft-correspondence, large-n-limit, strong-weak-coupling-duality, holographic-principle, supergravity, super-yang-mills, string-theory-duality, change-of-representation, complementary-tractability]
lineage:
  - source: primary
    text: maldacena-1997-large-n-limit-adscft
    citation: "Juan Maldacena, 'The Large N Limit of Superconformal Field Theories and Supergravity,' Advances in Theoretical and Mathematical Physics 2 (1998): 231-252; arXiv:hep-th/9711200."
    quote: "'This is a new form of “duality”: a large N field theory is related to a string theory on some background... It is also a strong-weak coupling correspondence in the following sense. When the effective coupling gN becomes large we cannot trust perturbative calculations in the Yang-Mills theory but we can trust calculations in supergravity on (AdS5 × S5)N.'"
canonical-instances:
  - "Electric-magnetic duality in gauge theory (Montonen-Olive conjecture, which the AdS/CFT paper cites as antecedent): a theory's strongly-coupled electric description and its weakly-coupled magnetic dual describe the same physics, so a calculation intractable in one variable becomes a tractable perturbative calculation in the other."
  - "The Fourier transform in signal processing: convolving two signals directly against their raw time samples is expensive to carry out. Re-express both signals in the frequency domain first, and the very same operation collapses into an ordinary pointwise product. Neither domain is universally easier; the choice of which one to compute in follows from what the problem actually demands."
  - "Linear-programming duality in optimization: a primal problem's search for the best achievable value can stall out entirely, while a paired dual problem produces a bound on that same value from the opposite direction with far less effort -- and strong duality guarantees the two converge on the true optimum, which is why a stuck primal search is routinely set aside in favor of just solving its dual."
  - "Operationally distinct from lex-y6pqz toy-model-then-perturb and lex-kkr43 simplification-by-removing-constraints: those atoms solve a genuinely EASIER, APPROXIMATE version of the hard problem and then correct back toward the true answer. This atom requires an EXACT correspondence -- no information is dropped and no correction step is needed, because the tractable-regime calculation on the dual side already is the answer to the original question."
  - "Operationally distinct from lex-stppu apparent-contradiction-marks-domain-boundary-not-rule-failure: that atom is about two theories that each have their own separate domain of validity, with an apparent contradiction only at the boundary between them. This atom is about two descriptions that are ALWAYS both valid for the same object, with only their computational TRACTABILITY (not their truth) trading off across the parameter range."
critical-questions:
  - "How do you know a proposed correspondence is a genuine duality and not wishful pattern-matching between two things that merely resemble each other? Maldacena's paper is explicit that AdS/CFT is a conjecture, supported by matched supersymmetry and matched conserved charges, not a proof -- treating an unproven duality as though it were established can license computing an answer on the 'easy' side that has no actual guarantee of matching the hard side."
  - "Even granting a real duality, does the dual description answer the SAME question you started with, or a related but distinct one? Not every quantity of interest on one side has a clean, computable counterpart on the other; the correspondence has to be checked question-by-question rather than assumed to transfer wholesale on the strength of the theories being dual overall."
  - "What happens when both sides are hard in the same regime, or the duality's own dictionary becomes intractable to evaluate near the boundary where you need it? Some dualities have transition regions where translating a question from one side to the other is itself the bottleneck, in which case the duality hasn't actually relocated the difficulty, only relabeled it."
