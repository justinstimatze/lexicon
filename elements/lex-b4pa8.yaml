id: lex-b4pa8
name: the-trap-lets-you-succeed-and-detonates-when-you-claim-the-prize
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A trap doesn't have to stop you from succeeding at the task in front of you -- it can let you succeed completely and spring only at the separate moment when you try to take possession of what you won. In Cushing's telling, two War-gods send enchanted stone deer and antelope to lure a thieving Tarantula out of hiding, knowing hunting is his one irresistible compulsion. He hunts perfectly: he draws, fires, and drops all four animals clean, exulting each time, 'who says I am not a good hunter?' The hunt itself was never the trap. The trap waits until he bends down, ties the first carcass to carry it home, and tries to rise with his burden: '_klo-o-o-o-o!_ he fell down almost crushed under a mass of white rock.' The same thing happens with the second carcass, and the third. Every kill was real and clean; the animals only reverted to stone at the exact instant he attempted to claim them as his own. Diagnostic move: when you've succeeded cleanly at a task that seems designed to test your one known compulsion, don't relax at the moment of apparent victory -- if a trap is present at all, it's more likely to be waiting at the handoff, the instant you reach to actually take what you've won, than anywhere in the effort that got you there."
