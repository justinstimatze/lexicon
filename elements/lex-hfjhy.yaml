# signal-mimicry

A cognitive move that produces a *frame* — an observable signal — that
encodes type T while the signaler is of type ¬T. The recipient
classifies the signaler by signal, not by type, extracting behavior
the recipient reserves for type-T from a signaler who is not T.

## Type-signature rationale

Type-signature is `state → frame` rather than `claim → ...` because mimicry
doesn't require an asserted claim. The signaler's actual *state* (their type)
is the input; the *frame* (the signal-encoding observed by recipients)
is the output. The asymmetry between input-state and output-frame is
the deception structure.

## Distinct from neighbors

- **cheap-talk** (lex-c7pga) is *unbacked claim*; the assertion exists
  but carries no commitment. Signal-mimicry is *false-backed signal*;
  the signal encodes a (counterfeit) commitment-pattern that observers
  read as type-evidence. Different mechanisms; cheap-talk is recognized
  by absence of cost, mimicry by presence of misleading-cost.
- **plausible-deniability** (lex-xrg6e) is *retractable assertion*;
  signal-mimicry is *non-retractable counterfeit*. Mimicry-once-detected
  doesn't retract — the deception was the signal-emission itself.
- **lex-q9asc source-attribution** can be a vehicle for mimicry
  (counterfeit attributions) but the orthogonal axis matters; an
  honest attribution can be the surface of a mimicry move.
- **lex-uz7g4 archetype-as-projective-shorthand** is the reverse
  direction: archetypes are signal-types the recipient projects;
  mimicry is signal-types the signaler emits to be projected onto.

## Why it surfaces

The cognitive primitive isn't the act of mimicking (which is mostly
behavioral/perceptual) but the *recognition of mimicry as a signal-class*
— observers learning to distinguish backed signals (where signal-cost
correlates with type) from mimicked signals (where signal-cost is
non-type-correlated, often near-zero). This recognition is what makes
mimicry a defeasible inference, not a deductive one.

In Bowyer Bell & Whaley's 2×2, signal-mimicry is the **simulation**
half (showing what isn't there), as distinct from **dissimulation**
(hiding what is there). Future molecule
Future molecule `dissimulation-simulation-typology` (lex-rfxtb reserved)
decomposes the full taxonomy.

