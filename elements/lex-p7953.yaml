lineage:
  - source: primary
    text: hyde-truth-of-theft-claims-is-relative-to-the-presupposed-property-order
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' juxtaposing Hermes' theft with Frederick Douglass's account of plantation slavery. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The statement “Hermes did not steal the eternal cattle” is a lie in the initial context of the Hymn when Apollo’s world is still intact, but afterwards—when they are no longer eternal, when Hermes has the herder’s whip—it feels a little quaint to call it a lie. Similarly, the assertion “The slaves didn’t steal Colonel Lloyd’s fruit” might be a lie in the fictive world of plantation culture but true in a world that takes slavery itself to be a form of theft. Before that shift can take place, however, the old story must lose its charm."
canonical-instances:
  - "Whether a colonized people's armed resistance 'stole' land or territory from a colonial government is a lie under a property system that presupposes the colonial government's original claim was legitimate, and a straightforward description of reclamation under a property system that takes the original conquest itself to have been the theft."
  - "Whether an employee who takes proprietary code with them to a competitor 'stole trade secrets' depends on whether the background system of who owns the fruits of an individual's labor (the employer's non-compete framework, versus a framework where an idea belongs to whoever can use it) is taken for granted or itself contested."
critical-questions:
  - "Does this framing risk collapsing into pure relativism, where any theft can be relabeled as justified reclamation simply by asserting a different background property order, regardless of whether that alternative order has any independent moral standing?"
  - "Is there a principled way to judge which background property order is the correct one to presuppose, or does Hyde's argument only work retrospectively, once a moral consensus (slavery was theft) has already formed for independent reasons?"
  - "Does the claim apply symmetrically -- could a currently-illegitimate-seeming property order (a rising kleptocracy, a coercive land grab) eventually 'lose its charm' in reverse, making today's theft accusation tomorrow's quaint misreading, and if so, what stops the framework from justifying any successful power grab in hindsight?"
