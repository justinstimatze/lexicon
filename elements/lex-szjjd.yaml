id: lex-szjjd
name: self-perceived-competence-not-external-evaluation-predicts-role-neutrality
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone's willingness to treat all cases within a role even-handedly (not favoring the easy client, the compliant patient, the low-maintenance account) is at stake, don't assume that objectively-verified competence — a grade, a certification score, a supervisor's rating — is the operative variable, even when self-assessed competence clearly predicts the outcome. Martin found exactly this split among fourth-year medical students: self-rated confidence in handling a battery of clinical tasks strongly predicted neutrality toward patient types (see lex-dmqxm), but the students' actual fourth-year grades predicted neither their own self-confidence nor their neutrality. On the grade-confidence link: 'The data show no relationship between degree of self-confidence of students and the fourth-year grades they received. As can be seen from Table 27, students who have relatively low average grades are about as confident of their abilities as classmates with high academic averages. Among students in the top quartile, 28 per cent have high estimations of their ability to perform as a doctor should (Table 27). But as many (29 per cent) of those in the bottom quartile also feel quite confident.' A parallel table on preference-breadth by grade quartile showed the same non-relationship. Martin's own conclusion states the diagnostic move directly: 'We have noted that students whose self-judgments of performance are quite favorable—who believe that they can manage many of the problems faced by the practicing physician—are more willing than the rest to work with all kinds of patients. It is now evident that those students who receive the most favorable judgments from the faculty are not more likely than others to hold this neutral attitude toward patients. It becomes clearer that it is not academic superiority as such that disposes a student to think of all patients as equally preferable, but the psychological perception of himself as a capable physician—a perception which apparently is not merely a reflection of judgments made by the faculty in the form of grades.' Diagnostic move: when trying to predict or improve someone's willingness to serve a difficult case without discrimination, target their SELF-PERCEPTION of competence directly (graduated real successes, honest feedback on specific skills) rather than assuming a rise in their objective performance score will move it automatically — the two constructs have already been shown to travel independently in at least one clean empirical test."
