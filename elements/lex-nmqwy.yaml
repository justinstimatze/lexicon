id: lex-nmqwy
name: proactive-amends-preempt-an-oversight-calcifying-into-resentment
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Noticing an accidental oversight — a guest missed, a courtesy not extended — before it has a chance to fester into resentment, and personally correcting it with visible, immediate generosity, prevents a small accident from being read as a deliberate slight. In the Jataka's tale of the proper merchant, learning his household missed a visiting ascetic purely by accident, the merchant personally escorts him back and showers him with hospitality: 'There he offered him a seat and comforted him with the washing and anointing of his feet, and with rice, cakes and other food.' He then apologizes explicitly rather than assuming the oversight would go unnoticed."
related: []
evokes: [jataka, catukkanipata, pitha-jataka, correcting-an-oversight-before-it-reads-as-a-deliberate-slight, visible-immediate-amends-preempt-resentment]
lineage:
  - source: primary
    text: jataka-chalmers1895-pitha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 337, Pitha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "There he offered him a seat and comforted him with the washing and anointing of his feet, and with rice, cakes and other food."
canonical-instances:
  - "A host who realizes mid-event that a guest was never actually greeted or introduced to anyone doesn't wait to see if it becomes a problem — they immediately pull the guest aside, personally apologize, and spend the next twenty minutes making sure they're folded into every conversation for the rest of the night."
critical-questions:
  - "Does the speed of the correction matter as much as its sincerity — would the same amends offered a day later, after the offended party had already privately concluded it was deliberate, still work as well?"
  - "Is there a risk of overcorrecting — does lavish, visible amends for a minor accidental oversight sometimes draw more attention to the slight than simply moving forward naturally would have?"
status: active
