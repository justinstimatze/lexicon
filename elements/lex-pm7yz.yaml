id: lex-pm7yz
name: revealing-true-kinship-mid-conflict-converts-an-opponent-into-an-obligated-ally
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Losing an argument to someone with real standing over you can be resolved not by conceding or by out-arguing them, but by disclosing a genuine (not fabricated) kinship tie that was true the whole time but withheld — converting the opponent's incentive from adversarial correction into a parent's or kin's obligation to soften toward you. The move works only because the relationship is real; it changes what the other party owes you, not what's true in the argument itself. In the Jataka's tale, the ascetic Uddalaka, cornered and losing a public debate to the king's chaplain, thinks: \"It will never do to be on ill terms with this man. If I tell him I am his son, he needs must love me; I will tell him I am his son,\" then reveals it: \"I'm Uddalaka, a shoot, / Noble brahmin, from thy root.\" The chaplain verifies the claim against a token from decades before and the relationship visibly softens from there."
related: [lex-ucd7a]
evokes: [jataka, pakinnakanipata, uddalaka-jataka, kinship-disclosure-as-a-forcing-move, converting-an-adversary-via-obligation]
lineage:
  - source: primary
    text: jataka-chalmers1895-uddalaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XIV (Pakinnaka-Nipata), No. 487, Uddalaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "It will never do to be on ill terms with this man. If I tell him I am his son, he needs must love me; I will tell him I am his son."
canonical-instances:
  - "An employee losing a heated performance-review argument with a new director mentions, for the first time, that the director's predecessor personally recruited them out of a previous company as a favor to their late mentor — a true fact they'd never brought up before — and watches the director's tone shift from adversarial to protective."
critical-questions:
  - "Operationally distinct from lex-ucd7a (inventing kinship to appease a predator): that move is a fabricated claim used to survive an immediate physical threat; this one is a genuine, previously undisclosed tie used to convert an intellectual opponent's incentives mid-argument. Does the same defense — 'the tie is real, not invented' — actually hold up if the timing of disclosure was itself calculated for maximum tactical effect?"
  - "Uddalaka had this card the entire debate and only played it once he was losing. Does holding back a true, relevant fact until it's tactically useful undercut the honesty of the eventual disclosure, even though nothing false was ever said?"
status: active
