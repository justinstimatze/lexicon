id: lex-s9q5q
name: repeated-false-announcements-become-a-cue-for-the-payoff-not-belief
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone repeats the same announcement several times and it fails to come true each time, the group stops evaluating whether the announcement is true and starts treating the announcement itself as the trigger for a known side-benefit, attending purely for that payoff. In Radin's Winnebago Trickster cycle, a chief three times announces a feast to prepare for war, and three times abandons his guests mid-feast to be with a woman instead, never going to war at all. By the fourth announcement, nobody is fooled, but nobody stays home either: 'all those invited realized that this was all mere talk. There would be a feast to which they would all go. But they also knew that the chief had no intention of going on the warpath.' The announcement's truth-value has become irrelevant to the group's behavior; only the feast that reliably follows it still matters. Diagnostic move: when a repeated claim keeps failing to materialize but the group keeps responding to it anyway, check whether they've actually stopped believing it and are just showing up for whatever real thing does reliably follow it -- the announcement has been demoted from a claim to a bell."
