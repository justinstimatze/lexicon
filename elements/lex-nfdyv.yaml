id: lex-nfdyv
name: variation-plus-differential-survival-plus-inheritance-produces-cumulative-adaptation
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When seeing a feature that looks designed, check whether VARIATION + DIFFERENTIAL SURVIVAL + INHERITANCE could have produced it cumulatively. Selection is the default explanation for fit-to-environment; design is the exception, not the rule. The three-step engine grinds slowly; verify the components are present."
