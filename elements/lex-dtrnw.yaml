id: lex-dtrnw
name: rehearsal-against-a-mock-stand-in-fails-under-real-stakes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Extensive rehearsal against a low-stakes stand-in can fail completely to transfer once the real situation carries genuine social or emotional weight, sometimes producing an outcome that inverts the intended result rather than merely falling short of it. In the Jataka's tale of the bashful father, he practices a request for an ox for a full year against tufts of grass labeled 'king,' 'viceroy,' and 'chief captain.' Facing the actual king, panic flips the script entirely, and he offers his own last ox to the king instead of asking for one. His son's verdict names the gap precisely: 'All the year long never ceasing with unwearied diligence Where the sweet grass grows in clusters day by day he practised it: When he came amid the courtiers all at once he changed the sense; Practice truly nought availeth if a man has little wit.' The rehearsal built fluency with the words, but the actual barrier — social panic in the presence of real authority — was never the thing being practiced against."
