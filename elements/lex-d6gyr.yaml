  - source: primary
    text: jataka-chalmers1895-kapota-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book V (Pancanipata), No. 375, Kapota-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Bathed and anointed well, I think, Thou hast thy fill of food and drink. Thy neck so bright with jewel sheen, Hast thou, friend, to Benares been?"
canonical-instances:
  - "After a colleague's plagiarized report gets publicly exposed and shredded in review, a teammate greets them the next morning with an exaggerated compliment on how thoroughly researched their work always is — the flattering language landing harder than any direct jab would have."
critical-questions:
  - "Does ironic praise actually land as more cutting than a direct accusation would, or does the indirection risk letting the target pretend to miss the point entirely, denying the mocker the confrontation a direct statement would force?"
  - "Is there a point where this kind of mockery, however earned, stops serving justice and starts serving cruelty for its own sake, especially once the wrongdoer has already been punished by other means?"
