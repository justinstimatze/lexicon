id: lex-8u8nj
name: concentrating-a-critical-function-in-one-instance-forfeits-your-own-freedom-to-act
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a single person, system, or resource carries a function you can't afford to lose, don't just ask whether it's adequately protected -- ask what your own freedom of action costs once that function has only one instance, because concentration doesn't just create fragility, it can hostage your own future decisions to preserving that one instance. Kautilya's reasoning for which son to offer as a hostage makes this second cost explicit, separate from the risk of loss itself: 'It is better to give one among many sons, rather than an only son. For, all expectations [for the continuance of the royal line] are concentrated on an only son. On the other hand, the hostage giver giving one among many sons is still supported by the rest and can violate the treaty.' The claim being made is not simply 'don't put all your eggs in one basket' as a risk-of-loss statement -- it's specifically that redundancy preserves your OPTION to take a risky action later (violating the treaty, in this case) that concentration forecloses, because a king with only one heir literally cannot afford to let that heir be harmed even in service of a decision that would otherwise be correct. The graded fallback for when redundancy genuinely isn't available makes the same point from the other direction: 'If one is obliged to give as hostage his only son, he who can beget a son is better placed. In this situation, he who can beget more sons [from different queens?] is even better placed. He to whom a child is about to be born is in the best situation' -- each step up this ladder is a step back toward having a second instance in reserve, even a merely probable or future one, and each step measurably restores some of the lost freedom to act. Diagnostic move: when a critical function currently has only one instance -- a single key employee who holds all the institutional knowledge, a single supplier for an essential component, a single irreplaceable decision-maker -- don't evaluate the risk only in terms of 'what happens if we lose it,' evaluate it in terms of 'what actions are we now afraid to take because we can't risk it' -- the second cost is often the one that's actually constraining you day to day, and it disappears the moment a second, independent instance exists, even before anything goes wrong with the first."
