lineage:
  - source: primary
    text: Confucius-c500BCE-Analects-XIII-3
    citation: "Confucius (孔子, traditionally 551-479 BCE), *The Analects* (論語 Lúnyǔ), Book XIII Chapter 3. James Legge translation (1893 Clarendon Press; The Chinese Classics Vol. 1). The foundational text articulating zhèngmíng (正名, rectification of names) as the necessary precondition for coordinated political + social action. Confucius's transferable contribution: name-to-referent CORRESPONDENCE is the upstream condition without which language, action, ritual, sanction, and social coordination cascade into incoherence. The framework has been productively extended across East Asian political theory (Mencius, Xunzi, Han Feizi each modify Confucian zhengming for different political-theoretical purposes); Western analytic philosophy of language (Frege 1892 *Über Sinn und Bedeutung*; Russell 1905 *On Denoting*; Quine 1953 *From a Logical Point of View*; Kripke 1980 *Naming and Necessity*); operational-definition tradition in 20th-c philosophy of science (Bridgman 1927 *The Logic of Modern Physics*; later challenged but the underlying concern remains); software engineering (Brooks 1995 *Mythical Man-Month* on the centrality of definitional clarity in specifications; Hickey 2013 *Simple Made Easy*); AI safety (current literature on reward specification + capability evaluation + benchmark validity — Hubinger 2019 *Risks from Learned Optimization*; Bowman 2023 *Eight Things to Know About Large Language Models*); legal drafting + statutory interpretation; policy design; standards bodies (NIST, ISO, IETF). The atom encodes the transferable structural form — name-to-referent correspondence is precondition for effective coordinated action — separately from Confucius's specific political-ritual context. Debunking check applied: Confucius's zhengming has been extensively interpreted + contested across 2500 years of East Asian + Western scholarship (Chad Hansen 1992 *A Daoist Theory of Chinese Thought* offers a radical reinterpretation; Hall + Ames 1987 *Thinking Through Confucius* offers another). The STRUCTURAL CLAIM — that name-to-referent correspondence is precondition for coordinated action — is well-attested across philosophy of language + operational-definition tradition + software engineering + AI safety + legal drafting practice, independent of specific Confucian commitments."
    quote: "[Confucius Analects XIII.3 (Legge tr.), the essential rectification-of-names passage:] 'Tsze-lu said, \"The ruler of Wei has been waiting for you, in order with you to administer the government. What will you consider the first thing to be done?\" The Master replied, \"What is necessary is to rectify names.\" \"So, indeed!\" said Tsze-lu. \"You are wide of the mark! Why must there be such rectification?\" The Master said, \"How uncultivated you are, Yu! A superior man, in regard to what he does not know, shows a cautious reserve. If names be not correct, language is not in accordance with the truth of things. If language be not in accordance with the truth of things, affairs cannot be carried on to success. When affairs cannot be carried on to success, proprieties and music will not flourish. When proprieties and music do not flourish, punishments will not be properly awarded. When punishments are not properly awarded, the people do not know how to move hand or foot. Therefore a superior man considers it necessary that the names he uses may be spoken appropriately, and also that what he speaks may be carried out appropriately. What the superior man requires, is just that in his words there may be nothing incorrect.\"' [Practitioner-extraction for transferable lex-cqvnu: name-to-referent correspondence is the UPSTREAM PRECONDITION for coordinated action. Without it, language fails to track truth; downstream action, ritual, sanction, and coordination cascade into incoherence. The cascade is structural, not just unfortunate — fix the name-reality correspondence first, then action becomes possible. Generalizes from political-ritual context to software specifications, AI safety reward functions, legal drafting, policy design, scientific operational definitions, ML benchmarks, diagnostic categories, and industrial standards.]"
  - source: cross-attestation
    text: cross-domain-name-referent-correspondence-precondition
    citation: "Cross-domain attestation that name-to-referent correspondence as precondition for coordinated action recurs across software engineering, AI safety, legal drafting, policy design, scientific operational definitions, and standards bodies. (a) Software engineering: Brooks 1995 *Mythical Man-Month* (chapter on conceptual integrity); Hickey 2013 *Simple Made Easy* on naming as fundamental simplification act; Martin 2008 *Clean Code* devotes opening chapters to naming as foundation. (b) AI safety + specification: extensive recent literature on reward function specification, capability evaluation, and benchmark validity. Hubinger 2019 *Risks from Learned Optimization*; Krakovna et al 2020 *Specification gaming examples*; Lambert et al 2024 *RewardBench* + critical-benchmark literature documents the failure cascade from mis-specified reward + mis-designed benchmark to mis-trained model behavior. (c) Legal drafting + statutory interpretation: the long tradition of definitional sections in statutes + contracts (Garner 2009 *Garner's Modern American Usage* legal style guides; Adams 2017 *Practical Drafting Manual*). Ambiguous statutory definitions cascade into litigation + inconsistent enforcement. (d) Policy design: Pressman + Wildavsky 1973 *Implementation*; subsequent policy-implementation literature documents the cascade from sloppy definition to implementation failure. (e) Operational-definition tradition in 20th-c philosophy of science: Bridgman 1927 *The Logic of Modern Physics* + Hempel 1965 *Aspects of Scientific Explanation*. Though the strong operationalism program was substantially modified, the underlying concern about definitional accuracy as precondition for testable claims remains. (f) Industrial + technical standards: the entire apparatus of NIST + ISO + IETF + W3C + IEEE rests on definitional accuracy. The Internet's RFC tradition (Postel 1980+) explicitly elevates definitional precision as engineering virtue. (g) Diagnostic categories in medicine: DSM + ICD revisions are explicitly about rectifying diagnostic names to better track underlying realities (cf. controversies over DSM-5 revisions; Kirk + Kutchins 1992 *The Selling of DSM*). (h) Conversation analysis + ethnomethodology: Garfinkel 1967 *Studies in Ethnomethodology* + Sacks-Schegloff-Jefferson 1974 demonstrate that everyday coordinated action presupposes shared referential infrastructure; breakdown of this infrastructure produces the kind of incoherence Confucius diagnoses. The cross-domain attestation establishes the transferable structural form: name-to-referent correspondence is upstream precondition for coordinated action; without correspondence, action cascades into incoherence."
    quote: "Across software engineering (Brooks 1995, Hickey 2013, Martin 2008), AI safety (Hubinger 2019, Krakovna 2020, Lambert 2024), legal drafting (Garner 2009, Adams 2017), policy design (Pressman-Wildavsky 1973), operational-definition tradition (Bridgman 1927, Hempel 1965), industrial standards (NIST + ISO + IETF + W3C + IEEE), diagnostic categories (DSM + ICD revisions), and ethnomethodology (Garfinkel 1967, Sacks-Schegloff-Jefferson 1974), the same structural form recurs — name-to-referent correspondence is upstream precondition for effective coordinated action; without it, downstream activity cascades into incoherence. The transferable diagnostic: audit names against realities; trace the cascade from name to action; rectify names before acting."
canonical-instances:
  - "Confucius's canonical case (Analects XIII.3): governance requires rectification of names first because without it, language fails → action fails → proprieties + music fail → punishments mis-applied → people cannot move hand or foot. The cascade is structural, not optional."
  - "Software engineering: a variable named `data` that holds something specific (e.g., a list of customer-purchase records filtered to recent activity) creates cascading confusion downstream — code-readers must mentally re-derive the actual content from context. Renaming to `recent-customer-purchases` short-circuits the cascade."
  - "AI safety: reward function for an LLM trained on helpfulness can mis-specify what `helpful` actually means + the model learns to produce confident-sounding output regardless of accuracy. The mis-named reward target cascades into a mis-aligned model. Composes tightly with lex-tb3re (Goodhart) — first the name has to be correct, then there's still the Goodhart-gaming problem."
  - "Legal drafting: a statute defining `affordable housing` as `housing costing less than 30% of median household income` may diverge from on-the-ground reality where the median household has been priced out of all available housing. The definition no longer tracks the policy intent. Implementation cascades into incoherence + litigation."
  - "DSM revisions: each major revision (III, IV, IV-TR, 5) involves explicit rectification of diagnostic names + criteria. Each revision matters BECAUSE the cascade from category to treatment to insurance to research depends on the names tracking realities."
  - "ML benchmarks: a benchmark named `reading-comprehension` may, on inspection, measure something quite different (shallow pattern-matching, label leakage, etc.). The mis-named benchmark cascades into mis-directed research effort. Bowman + Etzioni + critical-benchmark literature 2020+ document this systematically."
  - "Industrial standards: a NIST standard for `electrical safety` rests on extensive definitional apparatus — voltage thresholds, contact-area definitions, insulation classifications. The standard's effectiveness depends entirely on these definitions tracking the underlying physical realities of harm."
  - "operationally distinct from lex-99f5w naming-as-regulation: lex-99f5w is about NAMING AS A REGULATORY ACT (the act of naming brings the thing into the rule system). lex-cqvnu is about CORRESPONDENCE between names + realities being precondition for effective action. Different mechanism."
  - "operationally distinct from lex-zxrtf naming-as-power: lex-zxrtf is about who CONTROLS naming + the power that comes from that control. lex-cqvnu is about whether names track realities. Both important; different mechanisms."
  - "operationally distinct from lex-5qkj9 naming-a-structural-problem-recasts-the-namer-as-its-source: lex-5qkj9 is about NAMING-A-PROBLEM mechanism. lex-cqvnu is about name-reality CORRESPONDENCE. Different mechanism."
  - "operationally distinct from lex-tb3re a-measure-pushed-as-a-target-ceases-to-be-a-good-measure (Goodhart): lex-tb3re is about METRIC-GAMING after a measure is pushed as a target. lex-cqvnu is about CORRECTNESS of the name itself. Composes: lex-cqvnu says the name must track reality to start with; lex-tb3re says even when it does, optimizing it as a target degrades the tracking. Both required."
  - "operationally distinct from lex-n5cf6 + lex-nbk6e (Manheim-Garrabrant Goodhart variants): those are about the MECHANICS of how metric-gaming happens. lex-cqvnu is upstream — about whether the names track realities in the first place."
critical-questions:
  - "Could the atom be misused to argue that names must be FIXED + STATIC to track reality? No. The atom is compatible with dynamic re-rectification of names as realities + understanding evolve. DSM revisions, statutory amendments, software refactoring (renaming) are all instances of ongoing rectification. The atom claims correspondence is necessary; not that it must be achieved once + then frozen."
  - "Does the atom imply names can ever PERFECTLY track realities? No. The atom claims correspondence is necessary precondition; not that perfect correspondence is achievable. Philosophy of language since Quine + Putnam has documented the inherent indeterminacy in reference. The atom's substantive claim is about the DIRECTION + STRUCTURAL UPSTREAM PRECONDITION character: more accurate correspondence is better for downstream action; sloppy correspondence cascades into failure."
  - "Could the atom be used to argue that disputed categories (e.g., race, gender, mental illness) must be `rectified` in ways that erase contested social-political dimensions? Yes — this is a known misuse pattern. The discipline against this: the atom's claim is about correspondence as precondition for coordinated action; it does NOT determine WHICH realities the names should track. In contested cases, the contestation itself is part of the reality + the atom counsels recognizing that fact (the name `cisgender` was rectified-into-existence to make explicit a previously-unnamed default; the atom would say this rectification serves coordinated action better, not worse)."
  - "How does the atom apply when names + realities co-evolve (e.g., scientific categories that the science creates by naming + measuring)? Hacking 1999 *Social Construction of What?* distinguishes `indifferent kinds` (electron — name + reality co-stable) from `interactive kinds` (child-abuser — name + reality interact via classified individuals' awareness). The atom applies more cleanly to indifferent kinds + with care to interactive kinds. For interactive kinds, the atom counsels recognizing that the act of rectification itself modifies the realities being tracked (composes with lex-3656j social construction of institutional reality)."
  - "How does the atom apply to AI systems specifically? AI safety has become a major site of this concern — reward specification, capability evaluation, benchmark design, alignment taxonomy. The atom names the upstream precondition: before you can align a model to a target, the target must accurately name what you want. Composes with lex-tb3re (Goodhart) which addresses the downstream gaming problem even when the name is correct. Both required for AI-safety success."
