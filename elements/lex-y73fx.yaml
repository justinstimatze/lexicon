    text: kautilya-arthashastra-only-guiding-star-of-wealth-is-itself
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Planning a Campaign,' 'Losses, Expenses and Gains,' {9.4.26}."
    quote: "'Wealth will slip away from that childish man who constantly consults the stars: the only [guiding] star of wealth is itself; what can the stars of the sky do?'"
canonical-instances:
  - "A founder keeps delaying a product launch to wait for a more auspicious economic indicator, a friendlier competitive landscape, or a clearer market signal, while a less cautious competitor with a worse product ships first and captures the customers who would have been available to either of them -- the delay, not the timing, was the deciding factor."
  - "An investor waits for a technical chart pattern to confirm before entering a position they'd already researched and believed in, and by the time the pattern 'confirms,' the price has already moved past the point where the trade would have been profitable -- the confirmation-seeking behavior itself consumed the opportunity it was meant to protect."
critical-questions:
  - "does this collapse a real distinction between reckless impulsiveness and prudent patience -- some delays genuinely do improve information and reduce risk, so how does a decision-maker tell the difference between omen-consulting that wastes time and legitimate waiting that gathers real, actionable signal?"
  - "does the claim hold up in domains with genuine, verifiable leading indicators (weather forecasts for a harvest, seasonal cycles for a campaign) where waiting for an external signal is not superstition but sound risk management, and does labeling all such waiting 'childish' overcorrect against caution that is sometimes warranted?"
  - "is the causal story here actually falsifiable -- if someone acts immediately and it goes badly, does this framework retroactively call it bad luck, while if someone waits and it goes badly, it's called superstition, making the claim unfalsifiable regardless of outcome?"
