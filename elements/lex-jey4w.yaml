    text: distinctness-audit-thoreau-cost-as-life-exchanged
    citation: "Lex-0318 (Veblen, costly-conspicuous-waste-as-status-signal) explains a signaling mechanism — why people spend on visible waste — not a unit-of-account; Thoreau's own remark that 'most men appear never to have considered what a house is... because they think that they must have such a one as their neighbors have' is a conformity/status observation adjacent to Veblen's territory, but this atom's headline claim is about the unit in which a trade should be priced, independent of whether the motive was status-signaling, genuine need, or habit — the two compose (a status-driven purchase is exactly the kind of trade this atom's re-denomination exposes as a bad bargain in life-hours even though it succeeds as a Veblenian signal) but neither implies the other. Lex-0386 (Munroe/xkcd, optimize-only-when-amortized-savings-exceed-the-optimization-cost) is a bounded engineering heuristic about whether to invest effort automating a recurring task; this atom is a general existential/economic re-denomination applied to any priced good or institutional arrangement, normative and totalizing rather than a bounded rule-of-thumb for one decision class — Thoreau's Fitchburg arithmetic resembles lex-xfda8's form (compare two paths in the same time-unit) but does this atom's broader work, revaluing an entire technology's claimed benefit against the finite-life cost of earning the fare. Lex-0598 (Sahlins, need-reduction-and-supply-augmentation-are-equivalent-paths-to-affluence) grounds a strategic claim — which of two paths (reduce wants vs. increase production) closes an affluence ratio — with no unit-of-account content; this atom grounds a measurement claim — whatever is wanted, its true price is life-hours, not currency — with no claim about which strategy is preferable. The two are tightly adjacent and compose (Thoreau's savage is affluent on Sahlins's Zen road precisely because the wigwam's life-cost is low) but are orthogonal axes, not a duplicate pair. Thoreau's specific re-denomination move — cost is measured in life, not money — was entirely absent from the substrate before this mint."
canonical-instances:
  - "The wigwam-vs-palace arithmetic: an $800 Concord house costs a laborer 'from ten to fifteen years' of life at the era's one-dollar-a-day wage — 'more than half his life' — while 'the savage owns his shelter because it costs so little,' outright, from the start. Thoreau's rhetorical question states the reframed verdict directly: 'Would the savage have been wise to exchange his wigwam for a palace on these terms?'"
  - "Thoreau's own $28.12½ construction ledger for the Walden house — boards, shingles, laths, secondhand windows, brick, lime, nails, hinges, latch, chalk, transportation, itemized to the half-cent — presented explicitly as a corrective to the fact that 'very few are able to tell exactly what their houses cost'; the ledger operationalizes the re-denomination claim as an actual auditable accounting rather than leaving it at the level of assertion."
  - "The Cambridge College room-rent passage: a student's room 'only a little larger than' Thoreau's own rents for $30/year — a recurring extraction roughly equal, annually, to the ENTIRE one-time cost of Thoreau's owned house — while 'those things for which the most money is demanded are never the things which the student most wants,' making tuition-and-rent an especially clear case of price and value coming apart once re-priced in life."
  - "The Fitchburg foot-race: the thirty-mile train fare costs 'ninety cents,' 'almost a day's wages'; the friend who rides must first spend a day earning the fare and arrives 'some time tomorrow,' while Thoreau on foot 'get[s] there before night' — a literal side-by-side ledger, in the same life-hours unit, showing the 'labor-saving' railroad has not actually saved life once the cost of earning the ticket is included. Verdict: 'this spending of the best part of one's life earning money in order to enjoy a questionable liberty during the least valuable part of it.'"
  - "Modern descendant, responsibly extending rather than quoting Thoreau: the personal-finance 'hourly wage' framing common to the FIRE (Financial Independence, Retire Early) movement — converting a purchase's dollar price into the number of post-tax work-hours required to earn it before deciding whether to buy — is a direct, if independently arrived-at, operationalization of the same re-denomination move Thoreau performs on his house, his tuition, and his train fare."
critical-questions:
  - "Has the cost of this purchase, career choice, or institutional fee actually been converted into life-hours (at the wage the payer must earn to cover it), or has the evaluation stopped at the dollar figure? Thoreau's own move is to re-run the arithmetic in the other unit before pronouncing something cheap or expensive."
  - "Does a 'labor-saving' convenience or technology actually save life-hours net of the labor required to earn, build, and maintain it — or only at the point of use, as the Fitchburg fare appears cheap only until the day spent earning it is added back in?"
  - "Is a good's dollar price actively HIDING its true cost by being cheap in currency but expensive in life (a mortgaged farm '[toiled at] twenty, thirty, or forty years'), or expensive in currency but cheap in life (an owner-built structure, cheap or free in materials, costing only the builder's own labor-hours)?"
  - "Is the question here about the STRATEGY of wanting less vs. producing more (reach for lex-kdt2v), a bounded task-automation decision (reach for lex-xfda8), a status-signaling explanation for why the purchase was made (reach for lex-5kjya), or the UNIT in which cost itself should be measured, independent of strategy or motive (this atom)?"
  - "Does re-denominating in life-hours argue for frugality here, or for up-front investment? The move cuts both ways: it can justify skipping a purchase (the $800 house) or justify paying more once for a thing that saves decades of repeated life-cost later — 'cheaper' and 'lower total life-cost' are not the same ranking."
