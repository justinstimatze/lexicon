    quote: "My callow chicks, my tender brood, whose wings are still ungrown, / Who shall support me by and bye: to them I grant the loan. / Then my old ancient parents, who far from youth's bounds are set, / With that within my beak I bring, to them I pay my debt. / And other birds of helpless wing, and weak full many more, / To these I give in charity: this sages call my store. / This is that loan the which I grant, this is the debt I pay, / And this the treasure I store up: now I have said my say."
canonical-instances:
  - "A mid-career employee describes mentoring juniors as an investment in the team's future, covering their own aging parents' costs as a debt owed for their upbringing, and donating anonymously to a scholarship fund as neither — and can explain the difference between the three the moment someone asks who they expect to pay them back."
critical-questions:
  - "The parrot's three categories map cleanly onto forward, backward, and directionless obligation. Is there a fourth kind of obligation this frame can't place — one that's neither a loan, a debt, nor undirected charity — or does the frame just not have a slot for something like a mutual, present-tense exchange between equals?"
  - "Calling undirected generosity toward strangers a 'store' or 'treasure' rather than a loan or debt implies it's accumulating for the giver's own future benefit. Does that framing quietly turn charity into self-interest, or is it an honest acknowledgment that even open-ended generosity is expected to come back around eventually?"
