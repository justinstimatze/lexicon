    quote: "there is one, perhaps, whose nature is so reckless and violent that poverty would drive him more desperately into crime. His disorder providence relieves by allowing him to amass money. Such a one, in the uneasiness of a conscience stained with guilt, while he contrasts his character with his fortune, perchance grows alarmed lest he should come to mourn the loss of that whose possession is so pleasant to him. He will, then, reform his ways, and through the fear of losing his fortune he forsakes his iniquity."
canonical-instances:
  - "A parole officer helps a high-risk offender secure stable housing and a steady job specifically because having something concrete to lose measurably reduces reoffending, functioning as ongoing prevention rather than a reward for good behavior."
  - "A company deliberately grants equity that vests over several years to an otherwise brilliant but volatile employee, not primarily to reward them, but because the prospect of forfeiting unvested shares gives them a concrete reason to stay disciplined during conflicts they'd otherwise walk away from."
  - "A community organization gives a young person at risk of gang involvement a paid leadership role in a youth program, betting that the value of the position itself, once genuinely held, becomes a reason to avoid the behavior that would put it at risk."
critical-questions:
  - "Does this mechanism actually work as reliably as the passage implies, or does giving a reckless person resources sometimes just provide them with more capacity to do harm, especially if the fear of loss doesn't materialize the way the theory predicts?"
  - "The passage frames this as something Providence does deliberately and successfully -- in human practice, how would anyone reliably distinguish a case where the something-to-lose strategy will work from a case where it will simply be squandered or exploited?"
  - "Is there something troubling about a strategy that relies on fear of loss rather than genuine internal change -- does 'reform' that only holds because of an external stake in place count as real reform, or is it just behavior held in check by circumstance?"
