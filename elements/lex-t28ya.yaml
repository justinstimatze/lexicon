id: lex-t28ya
name: execution-state-as-existence
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When asking whether something 'really exists', check whether it's currently executing — being processed, being maintained, being attended to. For many phenomena (selves, organizations, traditions), existence is constituted by execution; pause the execution and the entity dissolves."
related: [lex-26v8g, lex-448qd, lex-8mpe8, lex-cbrcm, lex-cmkdq, lex-d56d4, lex-dqa9j, lex-dzr6g, lex-mwgep, lex-pbpbj, lex-rgr3t, lex-rktsy, lex-spm8x, lex-su2sk, lex-th6tr, lex-uarce, lex-uz7g4, lex-yrbrz]
evokes: [the-process-IS-the-thing, the-meeting-only-exists-while-convened, dissipative-existence, autopoiesis, alive-only-while-running, stop-the-process-and-it-is-not]
lineage:
  - source: practitioner
    text: prigogine-1977-dissipative-structures
    citation: "Ilya Prigogine, 1977 Nobel Lecture in Chemistry on dissipative structures. Detailed in Prigogine & Stengers, Order Out of Chaos: Man's New Dialogue with Nature (Heinemann, 1984). Dissipative structures (Bénard convection cells, the Belousov-Zhabotinsky reaction, hurricanes, biological organisms) are entities that exist ONLY while continuous energy flux maintains them; cut off the energy flow and the structure does not just lose function — it ceases to exist as a structure"
  - source: practitioner
    text: maturana-varela-1980-autopoiesis
    citation: "Humberto Maturana and Francisco Varela, Autopoiesis and Cognition: The Realization of the Living (Boston Studies in the Philosophy of Science vol. 42, D. Reidel, 1980), essay 'Autopoiesis: The Organization of the Living' (Varela's 1972 essay translated for the 1980 English edition), pp. 78-79. The canonical definitional statement of autopoiesis: a living system is defined by its self-producing organization — the network of processes that produces the very components that produce the network. The system IS the ongoing self-production; halt it and the system is gone. This passage is reproduced throughout systems theory, second-order cybernetics, biology of cognition, and philosophy of biology literature"
    quote: "'An autopoietic machine is a machine organized (defined as a unity) as a network of processes of production (transformation and destruction) of components that produces the components which: (i) through their interactions and transformations continuously regenerate and realize the network of processes (relations) that produced them; and (ii) constitute it (the machine) as a concrete unity in the space in which they (the components) exist by specifying the topological domain of its realization as such a network.' [Note: the source PDF's running head 'ON MACHINES, LIVING AND OTHERWISE' and page number are inserted mid-sentence at the p.78/79 break, which can defeat an automated exact-substring check on this span even though the quote is verbatim.]"
  - source: practitioner
    text: web-mining-pass
    citation: "promoted from cross-attestation: thermodynamics (Prigogine dissipative structures; canonical in non-equilibrium thermodynamics), philosophy of mind (Searle 1992 The Rediscovery of the Mind treats consciousness as biological process — the conscious-experience IS the brain's ongoing activity, not a separable object; Damasio 1999 The Feeling of What Happens makes the same case from neuroscience), evolutionary biology (autopoiesis — Maturana & Varela 1980; the broader systems-biology tradition treating life as ongoing process rather than thing), software systems (Unix process model: a process IS its execution; the binary file is a separate object that GIVES RISE TO processes when run; killing the process makes IT cease to exist even though the binary persists), social systems (Karl Weick 1979 The Social Psychology of Organizing — organizations exist as ongoing processes of organizing rather than as static structures; a meeting only exists while convened; a market only exists during trading hours), ecology (Lindeman 1942 trophic-dynamic concept — ecosystems as ongoing energy/matter flow networks). Cross-domain attestation across thermodynamics, biology, philosophy of mind, computer science, organizational theory, and ecology"
canonical-instances:
  - "Bénard convection cells: heat a thin fluid layer from below; once the temperature gradient exceeds a critical threshold, the fluid spontaneously self-organizes into hexagonal convection cells. The cells are real (you can photograph them, predict their wavelength). Cut the heat — the cells do not 'turn off'; they cease to exist. The cells ARE the ongoing convective flow"
  - "Unix process: 'pid 12847' is the running incarnation of /usr/bin/sh interpreting your shell session. The PID exists in /proc; kill it and there is no longer any 'pid 12847' — only the binary /usr/bin/sh, which is a separate kind of object. The process IS its execution; the binary GIVES RISE TO processes"
  - "a hurricane: a self-organizing low-pressure system maintained by ocean-thermal energy flow. As long as the flow continues, the hurricane exists as a coherent structure (Saffir-Simpson rated, named, tracked). Once it makes landfall and the energy source cuts off, it dissipates within hours — not just losing intensity but ceasing to exist as a coherent structure"
  - "a conversation: exists only while it is happening; the transcript is a different kind of object (a record of what was said, not the conversation itself). The relational-meaning-making that constituted the conversation cannot be re-instantiated by reading the transcript; the process IS the conversation"
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: feedback-loop is a control structure that operates on whatever exists; execution-state-as-existence is the ontological claim that some things ARE their operation. A feedback loop within a thermostat helps the thermostat function; the dissipative structure IS its functioning"
  - "operationally adjacent to lex-uz7g4 archetype-as-projective-shorthand: 'the company,' 'the institution,' 'the practice' are archetypes that look like static things but are actually executions; the archetypal-handle-as-noun obscures the underlying process-nature"
  - "operationally adjacent to lex-pbpbj substrate-precedes-code: many process-existent entities are substrates that the code/representation describes after the fact"
critical-questions:
  - "is the entity actually process-existent, or thing-with-process? A clock is a thing (it persists when stopped; can be re-started). A hurricane is process-existent (cannot be re-started; the next hurricane is a new entity). Misidentifying which kind you have is a canonical category error — treating institutions as thing-like leads to expectations that they persist without ongoing maintenance work."
  - "when you 'preserve' a process-existent thing (record the conversation, archive the meeting minutes, save the running-state of the simulation), what survives the preservation? Often a thin remainder: the relational/temporal/contextual content that constituted the process is lost in the preserved artifact. This is the distinction between 'saving' a process and 'photographing' it."
  - "what is the substrate (energy flow, attention, participation, network connectivity) that keeps the execution running? Process-existent entities require continuous input; identifying the input is identifying the existence-condition. When the input flags, the entity flags before the input runs out — the relationship is structural, not delayed."
  - "are two parallel-running instances of the 'same' process-existent thing one entity or two? A meeting convened twice in two cities at the same time is two meetings; a hurricane that splits into two cells becomes two hurricanes; a Unix process forked is two processes. The identity of process-existent things is the identity of the ongoing execution, not the identity of the type. Treat 'instance' carefully."
  - "can the entity be paused and resumed without becoming a different entity? Some processes survive suspension (a saved game, a hibernated computation, a parliamentary recess); others cannot (a conversation paused for a year is over). The discriminator: does the substrate restore on resume, or does the gap break the continuity that constituted the entity?"
status: active
