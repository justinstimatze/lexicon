id: lex-4ckek
name: reification-masks-social-relations-as-relations-between-things
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Notice this pattern whenever a human-made, socially-constructed system — a market, an algorithm, 'the numbers,' a bureaucratic rule, an institution's dispatch or rating system — is presented or experienced as an autonomous, natural THING with its own laws, rather than as a crystallized relation between people that could in principle be otherwise. Lukács's move: commodity-exchange is fundamentally a relation between the people who produce and trade, not a relation between objects. But when commodity-exchange becomes the UNIVERSAL structuring principle of an entire society (not merely an episodic activity at its margins), this relation-between-people acquires what Lukács calls 'phantom objectivity' — it appears governed by impersonal, calculable 'natural laws' (market prices, supply and demand) that confront every individual as an external force to adapt to, not something people author and could change. This has two further concrete symptoms Lukács traces from the same root: (1) QUANTIFICATION — continuous, qualitative activity gets broken into discrete, calculable, comparable units; his paradigm case is Taylorist time-and-motion management, where even the worker's psychological attributes are separated from their whole personality and reduced to 'statistically viable concepts.' (2) THE CONTEMPLATIVE STANCE — as the rationalized system becomes more autonomous and self-enclosed, the person's practical relation to it shifts from active participation to passive contemplation: you can calculate and predict the system's laws, but a purely contemplative stance cannot intervene in or author them. Practitioner moves: (a) when something is presented as simply 'how the numbers work' or 'what the market wants' or 'what the algorithm decided,' ask whether a human-authored, alterable relation is being presented as an autonomous natural force; (b) check for the quantification-symptom — is a continuous, qualitative activity being broken into calculable, tracked units, with the people involved reduced to statistically-managed inputs?; (c) check for the contemplative-stance symptom — has the practitioner's own relation to the process shifted from actively shaping it to passively monitoring it as though it ran itself? Caveat: this is not a blanket case against quantification or abstraction — money, prices, and calculable law are often genuinely useful and even a precondition for large-scale coordination. The diagnostic value is specifically in noticing when the thing-like frame has become total and invisible: when the underlying human relation can no longer even be perceived as a relation between people, only as a fact of nature to be planned around."
