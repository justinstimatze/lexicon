id: lex-bzpnx
name: substrate-before-affect
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When evaluating an emotional response (yours or someone else's), surface that the substrate (resource state, sleep, food, hormonal cycle, recent news) often determines the affect more than the surface cause — read the substrate before debating the trigger."
related: [lex-bwubx, lex-mjav2, lex-8grce, lex-5mtky]
evokes: [warmth-as-side-effect, anti-theater, engagement-then-warmth-not-warmth-as-substrate]
lineage:
  - source: practitioner
    text: load-bearing-vibes-detector
    citation: "an internal bright-pattern detector — instructed-warmth-without-substance fires this"
  - source: practitioner
    text: goffman-1959-presentation-of-self
    citation: "Erving Goffman, The Presentation of Self in Everyday Life (1959), Ch.I 'Belief in the Part One is Playing.' Adjacent framing: Goffman names the actor's own relation to their performance as a sincere↔cynical continuum (sincere = believes own performance / engagement is real; cynical = no belief in own act, performing for instrumental reasons). lex-bzpnx is the substrate-ordering claim adjacent to this: when engagement is real (Goffman's sincere pole), affect emerges as byproduct; when engagement is absent and affect is performed directly (Goffman's cynical pole), the performance is hollow. The shared finding: real engagement and performed affect are structurally different states, observable in their second-order effects. PDF on shelf, p.10 (Ch.I opening), verbatim 2026-05-20."
    quote: "When the individual has no belief in his own act and no ultimate concern with the beliefs of his audience, we may call him cynical, reserving the term sincere for individuals who believe in the impression fostered by their own performance."
canonical-instances:
  - "engaging substantively with a problem produces warmth as a byproduct (the warmth is real because the engagement was real); attempting to deliver warmth without the substance produces theater (the warmth is performed because the engagement was missing)"
  - "the ordering test: substance must come first; affect-first inverts the dependency and produces detectable hollowness"
critical-questions:
  - "did the engagement come first, or is the affect being performed without engagement-substrate? the ordering test — if you trace the producing-causes back, real engagement produces affect as byproduct; reversing the order produces theater"
  - "would the observer detect hollowness under perturbation? real engagement is robust (substance survives questioning; warmth survives); performed affect collapses under questioning (substance can't be found; warmth thins). If neither pattern is detectable, the diagnostic doesn't apply"
  - "is the speaker sincere (Goffman — believes own performance) or cynical (no belief in own act)? lex-bzpnx fires against the cynical-pole-disguised-as-sincere; the sincere-pole produces warmth naturally and isn't a target of this atom"
  - "is inverted-ordering pathology, or scaffolding? sometimes affect is rehearsed FIRST as scaffolding for engagement-yet-to-form (training, social-skill development). The distinction: scaffolding is honest about being scaffolding; theater claims to be substance"
status: active
