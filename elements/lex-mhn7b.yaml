id: lex-mhn7b
name: a-stakeless-guard-can-be-asked-to-stand-down
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When you delegate vigilance to a proxy while you rest -- an automated alert, a junior watcher, a mechanism with no independent stake in the outcome -- don't assume it protects you the way your own attention would, because a watcher with no loyalty of its own can often be neutralized simply by being asked, rather than by being defeated. In Eastman's telling, Unktomee, exhausted after killing a flock of ducks for a feast, wants to nap while his dinner cooks, so he instructs his own detached Face to keep watch: 'first telling his Face to be on the watch and to twitch if any one came, so as to awaken him.' When the thieving Foxes arrive, they don't have to trick, disable, or overpower this guard at all -- 'the Foxes stroked it very gently, and told it to be quiet,' and it simply complied, having no actual investment in Unktomee's dinner or any reason to resist a direct, gentle request. The vigilance was real in form -- there genuinely was a designated watcher, with a genuine mechanism for raising an alarm -- but it failed completely because the watcher had no stake of its own in the outcome it was guarding, and could therefore be talked out of doing its job as easily as it could have been talked into doing it in the first place. Diagnostic move: when evaluating whether a guard, alert system, or delegated watcher actually protects you, ask not just whether it's technically capable of detecting a threat, but whether it has any independent reason to resist being asked, persuaded, or instructed to stand down by the very party it's supposed to be watching for -- a mechanism that will do whatever it's told, by whoever tells it, isn't vigilance, it's a formality that anyone polite enough can walk straight past."
