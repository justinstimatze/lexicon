canonical-instances:
  - "A publisher rejects hundreds of manuscripts each year as not commercially viable, confident the rejected pile is genuinely weaker work, until a former slush-pile reader who kept copies of favorites builds an independent press from exactly those rejections and finds several become the publisher's biggest missed successes."
  - "A tech company's promotion process consistently passes over engineers who don't fit its narrow definition of 'high performer,' confident the passed-over group is simply less capable, until a competitor hires several of them and they go on to lead its most successful products, revealing the original criterion tracked cultural fit more than actual capability."
critical-questions:
  - "Is the iris garden anecdote actually generalizable, or is it a fluke made possible only because one specific garbage collector happened to have unusual skill or taste -- does 'discarded material can be superior' hold as a general expectation, or only as a reminder that it's occasionally, surprisingly true?"
  - "Does verifying that a discard pile is actually superior require exactly the kind of independent, external judgment the original selector already failed to apply, meaning the diagnostic just relocates the same problem (whose standard counts as the real measure of quality) rather than resolving it?"
  - "If a selection criterion is shown to be tracking something other than quality, does that mean it should be abandoned, or might the criterion still serve a legitimate purpose, such as internal consistency or brand coherence, that the discarded material genuinely doesn't satisfy even if it's independently good?"
