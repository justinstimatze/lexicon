# cheap-talk

A cognitive move that produces a *posture* of having-asserted-without-cost.
The asserter emits a claim that imposes no measurable cost (financial,
reputational, opportunity-of-retreat) on themselves; the recipient
infers little to no type-information from its presence.

## Distinct from neighbors

- **plausible-deniability** (lex-xrg6e) is about *engineering retractability*
  — the asserter does commit, but with retreat pre-arranged. Cheap-talk
  doesn't commit at all; there's no need to engineer retreat because
  there was no advance.
- **costly-signal** (mining target, future molecule) is the inverse:
  the assertion is backed by an action whose cost is type-correlated.
  Cheap-talk and costly-signal partition the signaling space; the
  asymmetry between them is the central object of Spence/Crawford-Sobel.
- **lex-q9asc source-attribution** (claim → frame) tags a claim with
  provenance metadata. Cheap-talk doesn't preclude attribution; an
  attributed cheap-talk claim is still cheap-talk if the attribution
  itself is costless.

## Why it surfaces in the substrate

The cognitive operation isn't "say something cheaply" — speakers do
that constantly without it being a deception move. The operation is
*classifying a received claim as cheap-talk* and downgrading inference
accordingly. The atom captures the receiver-side move: the recognition
that an emitted signal has no cost-backing, therefore carries no
type-discrimination.

In Crawford-Sobel's formal model, the only equilibria of cheap-talk
games are *pooling* (every type emits the same signal) or *partial
pooling* (types split into intervals where preferences are sufficiently
aligned). The cognitive primitive is the recognition of this structure
in the wild.

## Composition notes

Pairs naturally with `lex-q9asc source-attribution` to form the
recognition-of-unbacked-claim sequence: source-attribution then
cheap-talk-classification produces the posture of attributed-but-
unbacked. This 2-atom shape may graduate to a molecule under the
3-occurrence rule once it shows up in distinct enough domains
(politics, vendor pitches, LLM self-assessment all already qualify).

The contrast partner `costly-signal` (lex-x6sbv reserved, future
molecule) shares the input type (claim) but produces the opposite
posture; the `evokes:` field carries the partnership without
inflating the substrate.
