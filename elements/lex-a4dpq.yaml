id: lex-a4dpq
name: a-token-that-looks-audience-addressed-may-be-addressed-to-its-maker
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A record, marker, or token created in the middle of a secretive act doesn't have to be evidence left for an eventual observer -- it can be a private act of self-reflection, made by and for the person who created it, with no audience ever intended. Hyde works through this puzzle about Hermes: after stealing and secretly sacrificing Apollo's cattle, Hermes hangs some of the meat in his mother's barn as a sêma, a 'marker, sign, or token,' seemingly of his theft. The natural assumption is that it's a message aimed at Apollo -- except it doesn't work as one: 'in fact Apollo never does notice the token, and when Hermes leaves it in the barn he is still wrapping himself in secrecy (in the same scene he dumps his trick shoes in the river and hides the traces of his fire). It seems more likely, then, that Hermes is presenting this sêma to himself... Like the writing we do in our journals, some tokens are addressed first and foremost to their maker.' Every other action in the same scene is aimed at concealment; only this one act, creating the token, points toward disclosure, and the disclosure it points toward is to Hermes' own later reflection, not to any rival or audience. Diagnostic move: when you find a record, note, or symbolic marker embedded within an otherwise secretive or private process, don't assume it must be a message meant for someone else to eventually find -- check whether it functions instead as the maker's own act of processing or consolidating what just happened, addressed to no one but themselves."
