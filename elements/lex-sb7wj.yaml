lineage:
  - source: primary
    text: achebe-1958-things-fall-apart
    citation: "Chinua Achebe, *Things Fall Apart* (London: William Heinemann, 1958). The passage grounding this atom is the novel's final chapter (Chapter Twenty-Five), its closing paragraphs."
    quote: "[Obierika's outburst, still fully inside the community's grief, immediately before the perspective-shift:] 'That man was one of the greatest men in Umuofia. You drove him to kill himself and now he will be buried like a dog...' He could not say any more. His voice trembled and choked his words. [The Commissioner's habitual dual mode, switching from enforcer to detached observer at will:] 'The District Commissioner changed instantaneously. The resolute administrator in him gave way to the student of primitive customs.' [The perspective-shift itself, and the dignity-preserving administrative reflex:] 'The Commissioner went away, taking three or four of the soldiers with him. In the many years in which he had toiled to bring civilization to different parts of Africa he had learned a number of things. One of them was that a District Commissioner must never attend to such undignified details as cutting a hanged man from the tree. Such attention would give the natives a poor opinion of him. In the book which he planned to write he would stress that point.' [The compression itself, stated as ordinary editorial calculation:] 'As he walked back to the court he thought about that book. Every day brought him some new material. The story of this man who had killed a messenger and hanged himself would make interesting reading. One could almost write a whole chapter on him. Perhaps not a whole chapter but a reasonable paragraph, at any rate. There was so much else to include, and one must be firm in cutting out details.' [The novel's final line, the self-flattering title:] 'He had already chosen the title of the book, after much thought: The Pacification of the Primitive Tribes of the Lower Niger.'"
  - source: discovery-loop
    text: distinctness-audit-achebe-official-record-compression-vs-existing-substrate
    citation: "Lex-0827 (Young's cultural-imperialism face) names a general taxonomic category — a dominant group's own perspective is rendered the invisible, neutral default, while a subordinate group's self-expression is stereotyped and silenced. This atom is a narrower, more mechanistic instance and claim within that category: not the general condition of whose meanings count as universal, but the concrete act of an outside documentary authority converting a specific person's lived tragedy into a measured unit of text for an institutional purpose, staged through a formal perspective-shift that demonstrates the compression on the reader rather than merely describing it, with the self-flattering book title as concrete diagnostic evidence of the record's function. Lex-0562 (Spivak's claim that subaltern speech cannot register within a framework constituted by its own erasure) names why a subaltern's own attempted speech-act fails to register as itself within a dominant interpretive framework — an interpretive, intelligibility-level foreclosure, exemplified by Bhubaneswari Bhaduri. This atom's mechanism is different in kind: not interpretive foreclosure of an offered utterance, but administrative space-rationing of a life that was never uttered to the outsider as speech at all — the Commissioner's compression would occur regardless of how fully Okonkwo's story had been communicated to him, because the book's genre has no chapter-length slot for it. Lex-0560 (Said's claim that dominant discourse constructs the Other as a rulable object and a defining mirror) names the general structural-discursive thesis that a dominant power's representation of a subordinated population is constitutive rather than descriptive, producing both the ruled object-of-knowledge and the dominant power's own contrastive self-identity. The Commissioner's self-flattering book title is a clean illustrative case of that general mechanism; this atom's distinct further contribution is the specific compression-mechanics — a life reduced to a measured unit of text under a fixed genre-budget — and the specific formal device of the perspective-shift as demonstration rather than mere description. Achebe's own 1975 lecture criticizing Joseph Conrad's *Heart of Darkness* for denying African characters interiority and voice is well-documented literary history and forms part of the interpretive context this passage is often read against; *Things Fall Apart* is frequently read, including via Achebe's own later remarks about his motivation for writing it, as a positive-construction answer to that kind of erasure. No dedicated Conrad/Heart-of-Darkness atom grounds that erasure mechanism in the substrate as of this mint; this atom notes the relationship without claiming to ground the Conrad critique itself."
canonical-instances:
  - "The novel's closing compression itself: after Okonkwo's suicide, the District Commissioner thinks, 'The story of this man who had killed a messenger and hanged himself would make interesting reading. One could almost write a whole chapter on him. Perhaps not a whole chapter but a reasonable paragraph, at any rate.' A life the novel spent 200+ pages depicting in full psychological and cultural depth is budgeted, by the outsider who will author its only surviving official account, at less than a chapter."
  - "The self-flattering title as diagnostic evidence: the Commissioner's planned book is titled *The Pacification of the Primitive Tribes of the Lower Niger* — violence, suicide, and a community's desecrated grief are recast, by the very genre-convention of the colonial administrative memoir, as a benevolent civilizing achievement. The inversion and the compression are the same act."
  - "The dignity-preserving administrative reflex, immediately prior to the compression: 'a District Commissioner must never attend to such undignified details as cutting a hanged man from the tree. Such attention would give the natives a poor opinion of him. In the book which he planned to write he would stress that point.' The Commissioner is banal and procedurally fastidious, not depicted as sadistic — the ordinariness of the reflex is what makes the compression mechanism durable rather than an isolated act of malice."
  - "The formal enactment: the chapter holds Obierika's grief and accusation ('You drove him to kill himself and now he will be buried like a dog...,' his voice 'trembled and choked') right up until the final paragraph, where the narration cuts, without transition or comment, into the Commissioner's petty editorial calculations. The reader is made to feel, structurally, the same denial of narrative space that the novel has just finished naming."
  - "A modern cross-domain analogue extending the mechanism rather than the text: a workplace death or long-running grievance reduced to a fixed 'resolution notes' field in an HR case-management system, or a person's complex life reduced to a wire-service obituary paragraph sized to column-inches and news-value criteria — the compression is not any one author's cruelty but the predictable output of a documentary genre with a fixed space-budget and an institutional audience."
critical-questions:
  - "Is the record being produced, or already produced, by an outside authority that held power over the events it describes — and if so, what did that record's genre (page-budget, institutional purpose, intended audience) structurally have no room to include, regardless of how well or fully the subject's own story was actually knowable?"
  - "Is the compression being treated as an isolated failure of one author's empathy or honesty, or is it being recognized as the predictable, structural output of the record's genre — one that would compress the next subject's life the same way regardless of who specifically held the pen?"
  - "Does the record's own self-description (a title, a euphemism, a sanitized summary line) invert loss, violence, or injustice into an achievement or a neutral administrative event? That inversion is diagnostic evidence that the record's function is self-flattering rather than merely economical."
  - "Could the audience of this account be made to FEEL the compression happening — via a formal device (a perspective-shift, a citation, a closing frame) — rather than simply being told that compression occurs? Achebe's closing paragraphs demonstrate the mechanism on the reader instead of only asserting it."
  - "Is this specifically the record-compression mechanism (this atom), the general oppression-taxonomy question of which structural mechanism is operating (lex-s2uyr), the subaltern's-own-speech-act foreclosure mechanism (lex-qg68a), or the general claim that dominant representation constitutes rather than merely describes the ruled Other (lex-44byg)? These are adjacent but distinct questions with different atoms."
