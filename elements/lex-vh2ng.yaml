lineage:
  - source: primary
    text: hyde-gods-need-right-distance-not-maximum-distance-from-the-lowly-earth
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 5, '\"The God of the Crossroads,\"' introducing the Yoruba trickster Eshu and the origins of Ifa divination. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "I rehearse all this because in the story of Eshu bringing the art of divination to humankind, it becomes clear that heavenly essences are vulnerable not just to the return of earthly accidents but to their absence as well. The gods need distance from earth, but not too much. They can be wounded by the return of rubbish, but they can also suffer if they have no contact with whatever is beneath them. In West Africa as in Greece (in fact, as must be the case all over the world), the gods need to be fed by human beings; gods who aren’t, who have no real contact with the lowly time-infected earth, may starve and disappear even as their perfection increases, like anorexics whose lethal idealism forbids all contact with the world of changing bodies. What the gods need, it seems, is some sort of “right distance,” neither too much contact nor too little."
canonical-instances:
  - "An executive team that isolates itself further and further from frontline staff to preserve strategic clarity and avoid getting bogged down in operational noise eventually loses touch entirely with what the business actually does day to day, and the isolation that was meant to protect their judgment starves it of the information it needs to be any good."
  - "A researcher who withdraws further and further from popular or applied work to protect the purity of pure theory eventually finds their work has no contact with any problem anyone outside the field cares about, and the isolation that was supposed to protect the work's rigor instead starves it of relevance and eventually of funding and readers."
critical-questions:
  - "How would anyone actually locate the 'right distance' in a given case, given that the myth only illustrates the two failure modes at the extremes and offers no way to identify the working middle range in advance rather than after the fact?"
  - "Is the anorexia analogy doing real explanatory work here, or is it primarily rhetorical, given that anorexia's actual mechanism (a distorted relationship to bodily need) may not map cleanly onto institutional or conceptual over-purification?"
  - "Does this claim risk being used to justify never pursuing rigorous separation or purity at all, treating any push toward greater distance as suspect, when some domains may genuinely benefit from distance well past what feels intuitively comfortable?"
