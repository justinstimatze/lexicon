    citation: "Aesop's Fables, translated by V. S. Vernon Jones (1912, Project Gutenberg #11339), 'The Athenian and the Theban.' Verified verbatim against a direct extraction of the held copy."
    quote: "All right, have your way; I only hope that, when our heroes are angry with us, Athens may suffer from the anger of Hercules, and Thebes only from that of Theseus."
canonical-instances:
  - "a smaller company deliberately chooses a less dominant strategic partner or investor over the flashiest one available, reasoning that the powerful partner's occasional displeasure carries a far costlier blast radius."
critical-questions:
  - "Does this reframe genuinely change the expected outcome, or is it purely a face-saving rhetorical move that feels satisfying without altering any actual risk calculation the Theban would act on?"
  - "Is the asymmetric-downside argument actually sound here — does a more powerful patron's anger really scale with their overall power, or could a weaker patron's anger be just as dangerous to those closest to it?"
