pedagogy-gloss: "The nine cognitive-bias substrate-primitive atoms (confirmation lex-t9fs7, anchoring lex-hrnuj, convexity lex-kxbm2, survivorship lex-tfpzb, vividness-dominates-statistics lex-2czcp, dispositional-attribution-asymmetry lex-dgwbn, hindsight lex-vkhp7, base-rate-neglect lex-rwvkh, need-for-cognitive-closure lex-yv8ag) all instantiate the same substrate-shape: a named, systematic, predictable distortion-mechanism in human judgment or inference that survives even when reasoners are aware of it. The label makes the shared kind machine-checkable instead of a prose observation, parallel to lex-rnwph walton-style-defeasible-scheme. ROADMAP #15 generalization test #2 (the first being lex-rnwph): does the metapattern-label operator work outside the Walton cluster? Yes — same operator, different substrate-kind."
