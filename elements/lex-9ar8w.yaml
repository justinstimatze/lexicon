id: lex-9ar8w
name: organizational-knowledge-spirals-through-tacit-explicit-conversion
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When you need an organization — a team, an R&D group, a whole company — to turn one person's know-how into something the organization as a whole can use, recognize Nonaka and Takeuchi's structural claim (1995): organizational knowledge creation is not a single hand-off but a continuous SPIRAL cycling through four distinct modes of tacit/explicit conversion, each one amplified as it moves from the individual to the group, the organization, and even the inter-organization level. (1) SOCIALIZATION: tacit-to-tacit, transmitted via shared experience — observation, imitation, on-the-job apprenticeship, informal working sessions — with no language required at all. (2) EXTERNALIZATION: tacit-to-explicit, the hardest and most consequential mode, where a person's tacit insight gets articulated into explicit, shareable form — a name, a metaphor, an analogy, a diagram, a model — via dialogue and collective reflection. This is the bottleneck step: skip it, and the knowledge stays locked in whoever has it, socialized at most among the people who happened to be present when it was shared; do it, and the organization gains a concept it can combine, teach, critique, and build on. (3) COMBINATION: explicit-to-explicit, systemizing and recombining existing explicit knowledge (documents, reports, databases, meetings) into new explicit knowledge. (4) INTERNALIZATION: explicit-to-tacit, embodying explicit knowledge (a manual, a documented policy, a written concept) back into a person's own tacit skill through learning-by-doing, until it becomes usable know-how rather than remembered text. Practical implication: don't mistake a knowledge-management system that only captures documents, wikis, and databases for a complete solution — that covers combination alone. If your organization's most valuable tacit expertise never crosses the externalization step, it stays trapped with the person who has it; deliberately engineer occasions for dialogue, metaphor-making, and collective reflection (a cross-functional working session, a 'why does this design feel wrong' debrief, a retrospective that asks someone to name the pattern they were applying) to force the articulation. And don't treat one pass through the spiral as finished — knowledge internalized at the individual level has to be re-socialized with others to start the next turn, or the gain dies with the one person who now embodies it."
related: [lex-qqgm5, lex-p48xw, lex-b2c6b, lex-jxaht, lex-58ynk, lex-vpwbb]
