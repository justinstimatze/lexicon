lineage:
  - source: primary
    text: Beauvoir-1949-TheSecondSex
    citation: "Simone de Beauvoir, *The Second Sex* (Gallimard 1949; English tr. Borde + Malovany-Chevallier 2010, complete unabridged translation — Vintage). Beauvoir's transferable contribution: the IDENTIFICATION of immanence + transcendence as STRUCTURALLY-COMPLEMENTARY TERMS that get asymmetrically partitioned across hierarchical-othering relations. The framework derives from Sartre's *Being and Nothingness* (1943) ontology of being-in-itself / being-for-itself, but Beauvoir's distinct contribution is showing the partition's SOCIAL PRODUCTION + APPLICATION TO HIERARCHICAL OTHERING — not just gender but more generally. The Hegelian master-slave dialectic (1807 Phenomenology, lex-s2pjj substrate-grounded) is the philosophical precursor; Beauvoir explicitly invokes it. The framework has been productively extended across feminist + critical theory: Fanon 1952 *Black Skin White Masks* + Said 1978 *Orientalism* explicitly invoke Beauvoir for race + colonialism; Federici 2004 *Caliban and the Witch* + Hartsock 1983 + the social-reproduction-theory tradition (Bhattacharya 2017) extend the offloaded-immanence frame to capitalist class structure; care-ethics tradition (Tronto 1993, Held 2006, Kittay 1999) applies it to care-work analysis; disability-studies (Garland-Thomson 1997) applies it to ability-hierarchy. The atom encodes the structural primitive — hierarchical-othering partitions immanence + transcendence asymmetrically — separately from Beauvoir's specific gender focus. Debunking check applied: Beauvoir's specific empirical claims about 1940s French women's situation are heavily context-dependent + later feminist theory has substantially refined the framework (Butler 1990 + intersectional theory both substrate-grounded). The STRUCTURAL CLAIM about asymmetric immanence/transcendence partition under hierarchy is well-attested across feminist + critical theory + decolonial theory + care ethics + disability studies + animal ethics; even critics who reject Beauvoir's existentialist framework accept the structural-partition diagnostic separately."
    quote: "[Beauvoir 1949 Vol 2, on the foundational transcendence/immanence partition in marriage and gendered division of labor:] 'Since he is the producer, it is he who goes beyond family interest to the interest of society and who opens a future to her by cooperating in the construction of the collective future: it is he who embodies transcendence. Woman is destined to maintain the species and care for the home, which is to say, to immanence. In truth, all human existence is transcendence and immanence at the same time; to go beyond itself, it must maintain itself; to thrust itself toward the future, it must integrate the past into itself; and while relating to others, it must confirm itself in itself. These two moments are implied in every living movement: for man, marriage provides the perfect synthesis of them; in his work and political life, he finds change and progress, he experiences his dispersion through time and the universe; and when he tires of this wandering, he establishes a home, he settles down, he anchors himself in the world; in the evening he restores himself in the house, where his wife cares for the furniture and children and safeguards the past she keeps in store. But the wife has no other task save the one of maintaining and caring for life in its pure and identical generality; she perpetuates the immutable species, she ensures the even rhythm of the days and the permanence of the home she guards with locked doors; she is given no direct grasp on the future, nor on the universe; she goes beyond herself toward the group only through her husband as mouthpiece.' [On the structural narcissism resulting from confinement to immanence:] 'Male beauty is a sign of transcendence, that of woman has the passivity of immanence: the latter alone is made to arrest man's gaze and can thus be caught in the immobile trap of the mirror's silvering; man who feels and wants himself to be activity and subjectivity does not recognize himself in his immobile image; it does not appeal to him, since the man's body does not appear to him as an object of desire.' [On the result — being-swallowed-by-generality vs being-recognized-as-individual:] 'They reigned over the world, conquering it day after day: and now they are separated from the universe, doomed to immanence and repetition. They feel dispossessed. But what they suffer from the most is being swallowed up in generality: a wife, mother, housewife, or one woman among millions of others.' [Practitioner-extraction for transferable lex-d73nj: hierarchical-othering ASYMMETRICALLY partitions immanence + transcendence — both terms constitutive of any human existence — across parties. The dominant appears purely-projecting; the subordinate appears purely-maintaining; both appearances are SOCIALLY PRODUCED through the offloading of the dominant's immanence-side onto the subordinate. The framework generalizes beyond gender to race, class, disability, colonialism, human/animal, human/AI, care work, age, and craft/art hierarchies.]"
  - source: cross-attestation
    text: cross-domain-asymmetric-immanence-transcendence-partition
    citation: "Cross-domain attestation that asymmetric immanence/transcendence partition under hierarchical othering recurs across decolonial theory, social-reproduction theory, care ethics, disability studies, animal ethics, AI ethics, and labor theory. (a) Decolonial theory: Fanon 1952 *Black Skin White Masks* + Fanon 1961 *The Wretched of the Earth* explicitly extend Beauvoir's frame — the colonized are assigned to natural/timeless/immanent existence while colonizer is historical-acting/transcendent. Said 1978 *Orientalism* documents the orientalized other as constructed in the same immanent/timeless register. (b) Social-reproduction theory: Federici 2004 *Caliban and the Witch* documents how primitive accumulation produced the gender-partition assigning women to unpaid reproductive labor (immanence) — composing with lex-ewjec + lex-4uuxy. Hartsock 1983 *Money, Sex and Power* + Bhattacharya 2017 *Social Reproduction Theory* + Fraser 2014 *Behind Marx's Hidden Abode* extend the framework to capitalist class structure — workers' immanence-side labor reproduces capitalist class's transcendence. (c) Care ethics: Tronto 1993 *Moral Boundaries* + Kittay 1999 *Love's Labor* + Held 2006 *The Ethics of Care* document the historical assignment of care-work to subordinated groups (women, racial minorities, immigrants) as immanence-side labor that reproduces the cared-for's transcendence. (d) Disability studies: Garland-Thomson 1997 *Extraordinary Bodies* + Davis 1995 *Enforcing Normalcy* document the disabled-body-as-stuck-being vs able-body-as-project-pursuing as ability-hierarchy's analog of Beauvoir's partition. (e) Animal ethics: Adams 1990 *The Sexual Politics of Meat* + Donovan + Adams 2007 *The Feminist Care Tradition in Animal Ethics* explicitly invoke Beauvoir for animal-as-immanent vs human-as-transcendent partition. (f) AI ethics: contemporary AI-ethics discourse on AI-as-tool vs human-as-deciding-subject (Crawford 2021 *Atlas of AI* + Suchman 2007 *Human-Machine Reconfigurations*) explicitly invokes the immanence/transcendence frame for the human/AI relation. (g) Labor + craft hierarchies: Sennett 2008 *The Craftsman* + Pye 1968 *The Nature and Art of Workmanship* document the craft-as-perpetuating-tradition vs art-as-innovation partition as a less-obvious analog of Beauvoir's framework. The cross-domain attestation establishes the transferable structural form: hierarchical-othering relations asymmetrically partition the immanence/transcendence dyad — both terms constitutive of any human existence — across parties; the dominant appears purely-projecting through the offloading of immanence-side labor onto the subordinate."
    quote: "Across decolonial theory (Fanon 1952+1961, Said 1978), social-reproduction theory (Federici 2004, Hartsock 1983, Bhattacharya 2017, Fraser 2014), care ethics (Tronto 1993, Kittay 1999, Held 2006), disability studies (Garland-Thomson 1997, Davis 1995), animal ethics (Adams 1990, Donovan-Adams 2007), AI ethics (Crawford 2021, Suchman 2007), and craft/labor hierarchies (Sennett 2008, Pye 1968), the same structural form recurs — hierarchical-othering relations asymmetrically partition the immanence/transcendence dyad across parties. The transferable diagnostic: name the offloaded immanence-side labor; ask which party is reproducing the other's transcendence; recognize the partition as socially produced + reversible."
canonical-instances:
  - "Beauvoir's canonical case (Vol 2): gendered division of labor in 1940s French marriage — husband as producer + political-actor (transcendence); wife as maintenance + care (immanence). The wife's immanence is OFFLOADED from the husband; without her maintenance work he could not sustain his transcendence. The partition appears natural; it is socially produced."
  - "Race + colonialism (Fanon 1952 *Black Skin White Masks*; Said 1978 *Orientalism*): the colonized constructed as natural/timeless/cyclic/instinct-driven (immanence); the colonizer as historical-acting/progress-bearing/rational-projecting (transcendence). Same structural form as Beauvoir's gender partition."
  - "Class structure (Federici 2004; Hartsock 1983; Bhattacharya 2017): the working class's labor reproduces the capitalist class's capacity for accumulation + projection — workers handle the immanence-side of capitalism (subsistence, reproduction, infrastructure maintenance); capital handles the transcendence-side (innovation, investment, expansion). Composes tightly with lex-ewjec + lex-4uuxy."
  - "Care work (Tronto 1993; Kittay 1999): the caregiver assigned to maintaining the cared-for's body, schedule, emotional baseline; the cared-for assigned to self-actualization + project-pursuit enabled by that maintenance. The partition is socially produced + has been historically racialized + gendered (women + Black + Latina + Filipina caregivers reproducing white-male transcendence)."
  - "Disability hierarchy (Garland-Thomson 1997; Davis 1995): the disabled body assigned to stuck-being + symbolic-immanence; the able body assigned to active-projecting. The partition obscures that ALL bodies are both immanent + transcendent — the partition is socially produced."
  - "Animal ethics (Adams 1990; Donovan-Adams 2007): animals constructed as pure-instinct-immanence; humans as rational-projecting-transcendence. The partition has been used to justify treating animals as tools/food/research-subjects."
  - "Human/AI relation (Crawford 2021 *Atlas of AI*; Suchman 2007): AI-systems framed as tools (immanence — pure execution) while humans framed as deciding-subjects (transcendence — value-judgment + responsibility). The framing obscures both the human-labor-reproducing-AI-systems (data labelers, content moderators) AND the AI-systems-making-substantive-decisions affecting humans (algorithmic management, content curation)."
  - "Domestic + care labor offloading: in many high-income societies, professional + managerial classes outsource immanence-side labor (childcare, eldercare, cleaning, cooking) to lower-paid workers (immigrant women particularly) — this is the contemporary form of Beauvoir's partition, racially + economically stratified. Federici 2012 *Revolution at Point Zero* + Romero 2002 *Maid in the U.S.A.* document the pattern."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition-not-its-cause (Butler 1990): Butler's mechanism is performative-doing-constitutes-being. lex-d73nj names the asymmetric-role-assignment under hierarchy. They compose: Butler explains how the gender is sustained through doing; lex-d73nj explains why the doing is asymmetrically partitioned in the first place."
  - "operationally distinct from lex-94nsz monolithic-category-bundles-multiple-independently-variable-dimensions (Fausto-Sterling): Fausto-Sterling names the false-bundling within a category. lex-d73nj names the asymmetric-pairing across categories in hierarchical relation."
  - "operationally distinct from lex-jd7fe enduring-power-reproduces-through-cultural-consent (Gramsci hegemony): lex-jd7fe is cultural-reproduction mechanism. lex-d73nj is the specific asymmetric immanence/transcendence partition pattern within hegemonic relations. They compose."
  - "operationally distinct from lex-raydk dominant-category-stratifies-into-hegemonic-complicit-subordinate-marginalized (Connell hegemonic-masculinity): lex-raydk is the internal-stratification within a dominant category. lex-d73nj is the cross-category partition between dominant + subordinate. They are complementary structural primitives at different scales."
  - "operationally distinct from lex-4uuxy paid-labor-requires-unpriced-reproductive-substrate-shifted-onto-least-refusable-class: lex-4uuxy names the economic-substrate offloading mechanism. lex-d73nj names the structural philosophical-partition of immanence + transcendence. lex-d73nj is the broader frame; lex-4uuxy specializes to the economic case."
  - "operationally distinct from lex-vw8c3 producer-supplies-both-need-and-satisfaction (Marcuse): lex-vw8c3 names producer-side lock-in via market provision. lex-d73nj names the asymmetric-role-partition in any hierarchical-othering relation. Different scales + mechanisms."
critical-questions:
  - "Is the immanence/transcendence framing always tied to hierarchy, or can the dyad operate non-hierarchically? Beauvoir's atom is specifically about the ASYMMETRIC PARTITION under hierarchy. In non-hierarchical relations, both parties operate in both registers simultaneously (Beauvoir: `for man, marriage provides the perfect synthesis of them` — the diagnostic is that man synthesizes them while woman is restricted to one term). The atom names the failure mode where the synthesis is denied to one party."
  - "Does the atom imply immanence-side labor is dishonorable or that transcendence-side activity is intrinsically more valuable? No. Beauvoir is explicit that both are constitutive of human existence; the FAILURE MODE is restricting one party to only one term. Care ethics tradition (Tronto, Kittay, Held) goes further and argues that immanence-side labor is undervalued + that the FAILURE MODE is partly the cultural devaluation of immanence-side labor itself. Both diagnostics are compatible with the atom."
  - "Could the atom be misused to deny that some parties genuinely face constraints (biological, situational, cognitive) that limit their transcendence-side activity? Yes — and this is the standard misuse pattern from voluntarist directions. The discipline against this: the atom names the SOCIALLY-PRODUCED PARTITION, not the absence of any real constraint. Bodies have biological needs; situations have material constraints; the diagnostic is that the SOCIAL ASSIGNMENT of who handles which constraint is asymmetric + producing the appearance of natural hierarchy."
  - "How does the atom apply when both parties have substantial agency (e.g., a peer professional relationship that is structurally hierarchical for institutional reasons)? The atom applies at the structural-role level even when individual exchanges between parties are reciprocal. The diagnostic is about institutional-position, not individual-interaction. A junior researcher + senior researcher may have warm reciprocal exchanges while the senior-researcher's transcendence-side career-advance is structurally enabled by junior researchers' immanence-side labor (data collection, paper drafting, lab maintenance)."
  - "Could the atom be applied to AI-as-immanent vs human-as-transcendent in ways that miss the actual moral situation? Yes — and contemporary AI-ethics literature (Crawford 2021, Suchman 2007) is careful here. The atom diagnoses the FRAMING, not the moral conclusion. Whether AI deserves moral consideration, whether human-AI relations involve genuine reciprocity, are separate questions. The atom names the failure mode where the framing of AI-as-pure-tool conceals both (a) the immense human labor reproducing AI systems and (b) the substantive decisions AI systems are making."
