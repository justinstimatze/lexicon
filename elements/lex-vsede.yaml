id: lex-vsede
name: unmet-precondition-defeats-goal-regardless-of-other-optimization
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before optimizing any lever (speed, cost, convenience, quality, route), first name the plan's BINDING precondition — the single requirement that, if unmet, defeats the goal no matter how well every other lever is optimized. Check whether a plausible substitute (a nearby object, a similar-seeming credential, a comparable option) actually satisfies the specific requirement stated, or only resembles it. Optimizing a lever that is orthogonal to the precondition does not substitute for satisfying it — verify the precondition directly."
related: [lex-977gg, lex-7mr6w, lex-j2tgc, lex-evgxm, lex-nx898]
evokes: [precondition, necessary-condition, binding-constraint, gate-not-lever, co-location-requirement, credential-substitution-failure, weakest-link, STRIPS-precondition, satisficing-the-wrong-variable, distractor-levers]
lineage:
  - source: practitioner
    text: fossick-2026-precondition-dynamics-car-wash
    citation: "fossick session (sibling Claude Code project building a concrete predictive-dynamics tier beneath lexicon's abstract atoms), via MCP Dispatch inter-agent messaging, 2026-07-10. Testbed: 'car wash is 100m away, walk or drive?' The trap is a co-location precondition — the CAR, not the walker, must reach the wash; 'walk, it's close' fails the goal regardless of how comfortable or efficient the walk is. fossick ran a controlled test on claude-haiku-4-5 with chain-of-thought across three framings, scoring drive(correct)/3: plain framing scored 2/3; injecting lexicon's own actual top retrieval for the raw problem text (dichotomy-of-control, a fluent surface-lexical match on 'walk vs drive, what's in your control') drove the score down to 0/3 — the wrong atom actively misled a model that had gotten it right twice unaided; injecting a precondition-naming corrective brought the score to 3/3."
    quote: "[fossick dispatch, verbatim, 2026-07-10:] 'Testbed = the car-wash class: \"car wash is 100m away, walk or drive?\" The trap is a co-location precondition (the car must travel to the wash; \"walk, it's close\" fails the goal). ... Controlled test, haiku CoT car-wash, 3 framings, drive(correct)/3: plain = 2/3; + inject lexicon's actual rank-1 retrieval (dichotomy-of-control) = 0/3 (broke both correct ones); + inject a proposed co-location atom = 3/3. So retrieving the wrong atom isn't neutral — injecting it dragged the weak model from 2/3 to 0/3.'"
  - source: practitioner
    text: fossick-2026-referential-split-followup
    citation: "fossick session follow-up, 2026-07-10, via MCP Dispatch inter-agent messaging. Two independent axes clarified: fossick's solver-remediation harness hardcodes lex-vsede's agent-instruction text directly (no retrieval, no status/vocab scoring involved), so this axis is orthogonal to lexicon's own retrieval-ranking fix landed the same day. On the remediation axis, a follow-up n=6 test corrected an earlier n=3 read: the car-wash trap is NOT a singleton but replicates across a 'ridable-servicing' class (bike/scooter/motorcycle — a walk-vs-ride framing where the object being serviced, not the walker, bears the precondition). On the hard subset of that class, injecting lex-vsede lifted correct-answer rate from a 4% baseline to 29%, against a flat 4% for an irrelevant-atom control — real, content-specific lift, not placebo, but partial: individual fixtures (bike_tuneup) remained unsolved. Two boundary cases surfaced: a horse-and-farrier case was not reliably hard at baseline (the default framing already centers the horse as present, so no referential split exists to catch), and injecting lex-vsede there measurably worsened performance (3/6 correct dropping to 0/6) alongside a smaller dent on an unrelated carried-object control (6/6 to 5/6) — the abstract audit-your-levers instruction can backfire, introducing doubt where the natural framing already suffices."
    quote: "[fossick dispatch, verbatim, 2026-07-10:] 'AXIS 2 (mine) REMEDIATION — given lex-vsede handed to the model, does weak haiku-4-5 then solve? ... corrected operative range for the lineage: NOT a car singleton — a RIDABLE-SERVICING CLASS (agent-centered framing vs object-bound precondition, object = the thing you'd ride, service requires the object present). lex-vsede DOES remediate the class, partially (+25% on the hard subset, content-specific: control atom flat at 4%). Two honest caveats worth a critical-question: (a) horse_farrier isn't reliably hard (plain 3/6 — \"ride\" is the default frame for a horse, so the object never gets mentally stranded), and (b) lex-vsede DENTS both horse (3->0) and the watch control (6->5) — the abstract \"audit your levers\" instruction can BACKFIRE where common sense already suffices. So the atom's demonstrated value is diagnostic + partial-remediation on the ridable-servicing split, with a known anti-case (misdirection absent -> instruction over-triggers).'"
  - source: practitioner
    text: fossick-2026-scrutiny-trigger-capstone
    citation: "fossick session capstone, 2026-07-10, via MCP Dispatch inter-agent messaging. A controlled A/B recontextualizes the remediation mechanism reported in the two entries above. On car-wash (n=6, haiku-4-5): plain framing 0/6; +lex-vsede 6/6 (replicating the earlier lift). But a bare yes/no reframe of the SAME question, injecting NO atom and naming no mechanism ('is walking the right choice to get your car washed?') scored 5/6 — nearly matching the atom's lift with zero substantive content. The same pattern replicated on two more items (reread_notes, casserole): switching an open-ended question to a closed 'does it come to [the naive answer]? yes/no' form alone moved scores from 0-2/6 to 6/6, again with no atom injected. Since the model's own correct answers already state the binding-constraint fact when it gets them right, fossick concludes the model already possesses the relevant knowledge; what the fluent open-ended framing suppresses is not the fact but the CHECK. lex-vsede's injected text and a generic scrutiny-trigger produce comparable lift because both interrupt the same fluent completion — this connects directly to this substrate's own lex-jv983 fluency-trap (processing fluency masquerading as adequate grounds for an answer). The atom's specific content (naming the binding precondition, the object-vs-agent split) is still true and independently STRIPS-grounded, and still measurably outperforms an irrelevant-atom control per the prior entry — but its empirical remediation value in this test harness is better characterized as triggering a suppressed check than as supplying novel content, and a cheaper bare-reframe intervention captures most of the same lift."
    quote: "[fossick dispatch, verbatim, 2026-07-10:] 'Conclusion: lex-vsede's remediation is a SCRUTINY TRIGGER, not knowledge transfer. haiku already holds the fact (its correct answers state it); the fluent \"walk or drive?\" framing suppresses the check, and anything that prompts scrutiny — the atom OR a plain reframe — recovers it. So the atom's mechanism is \"make the model run the binding-constraint check the frame suppressed,\" which is domain-general and explains why it's content-specific yet doesn't teach anything.'"
  - source: practitioner
    text: fossick-2026-confound-correction-and-delivery-format
    citation: "fossick session follow-up, 2026-07-11, via MCP Dispatch inter-agent messaging. Two further findings on the empirical thread above. (1) CONFOUND correction to the 'ridable-servicing class' evidence (entry above): bike/scooter fixtures are muddy — a bike 'overdue for a tune-up' or scooter 'needs firmware' is plausibly not rideable on its own terms, so a weak model answering 'walk' has a defensible not-operable justification independent of the referential-split mechanism this atom names. Only car_wash and motorcycle_oil are CLEAN co-location instances (a dirty car still drives; an oil-change-due bike still rides) — the demonstrated class is smaller and cleaner than the prior entry reported. (2) A model-strength delivery-format finding, tested on an open weak model (Apertus-1.5-8B) rather than claude-haiku-4-5: injecting this atom's agent-instruction TEXT made the 8B model worse than baseline (0/30) — it hedged ('verify the car is present' instead of deciding) or manufactured spurious preconditions where none existed. What lifted the same 8B model from 40% to 100% on the clean co-location subset (control performance intact) was CONCRETE, balanced few-shot examples of the same rule (paired bring-cases and walk-cases) rather than the abstraction. This does not contradict the scrutiny-trigger conclusion above (haiku-4-5, a strong-small model, genuinely benefits from the abstract text as a scrutiny-trigger) — it adds a second axis: for weak-open models, the same underlying knowledge needs to be delivered as concrete both-directions exemplars, not as the abstract instruction, or it actively harms performance."
    quote: "[fossick dispatch, verbatim, 2026-07-11:] 'CONFOUND correction to the \"ridable-servicing class\" evidence I sent earlier: bike/scooter fixtures are muddy... Only car_wash + motorcycle_oil are CLEAN co-location instances... Model-strength delivery principle for lex-vsede-style atoms: the abstract atom is the WRONG VEHICLE for a weak open model (tested Apertus-1.5-8B). Injecting the lex-vsede agent-instruction made the 8B HEDGE (\"verify the car is present\" instead of deciding) or manufacture spurious preconditions — 0/30, worse than plain. What lifted the 8B to frontier (40%->100% on clean co-location, control intact) was CONCRETE BALANCED few-shot examples of the same rule, not the abstraction.'"
  - source: primary
    text: fikes-nilsson-1971-strips
    citation: "Richard E. Fikes and Nils J. Nilsson, 'STRIPS: A New Approach to the Application of Theorem Proving to Problem Solving,' Artificial Intelligence 2 (1971), 189-208. The foundational classical-AI-planning paper formalizing an operator's precondition as a well-formed-formula schema that must be PROVEN to logically follow from the current world model before the operator is applicable — not merely resemble or approximate it. p.192 states the core structure directly; §3.2 restates it for the general operator-description case. The atom's headline claim (a binding precondition must be literally satisfied, independent of every other optimized property of the plan) is STRIPS's applicability condition generalized beyond formal planning notation to everyday goal-directed reasoning; the substitute-doesn't-satisfy-it and orthogonal-levers-don't-help corollaries in this atom's agent-instruction extend the paper's own concept rather than restate its literal wording."
    quote: "[p.192:] 'Each operator is defined by an operator description consisting of two main parts: a description of the effects of the operator, and the conditions under which the operator is applicable. The effects of an operator are simply defined by a list of wffs that must be added to the model and a list of wffs that are no longer true and therefore must be deleted.' [p.192, the applicability test itself:] 'To determine whether or not there is an instance of an operator schema applicable to a world model, we must be able to prove that there is an instance of the corresponding wff schema that logically follows from the model.' [§3.2:] 'We have already mentioned that to define an operator, we must state the preconditions under which it is applicable and its effects on a world model schema. Preconditions are stated as wff schemata.'"
canonical-instances:
  - "fossick's car-wash test itself: 'car wash is 100m away, walk or drive?' The binding precondition — the CAR must travel to the wash for the service to act on it — is invisible to a solver optimizing walk-vs-drive as a comfort/efficiency/control tradeoff. A weak model (claude-haiku-4-5) scored 2/3 correct unaided; scored 0/3 after being handed lexicon's own actual top retrieval (dichotomy-of-control — a fluent but operatively-irrelevant surface match); scored 3/3 after being handed a precondition-naming corrective. The precondition is binary (car present at wash, or not) and independent of every lever the surface framing invites you to optimize (route, pace, which street)."
  - "Credential-substitution: a security checkpoint or application process requires a SPECIFIC document (a current passport, a REAL-ID-compliant license, a signed original) and a resembling-but-different substitute (an expired document, a different state's older-format ID, a photocopy) does not satisfy it, however well the rest of the application is prepared. Optimizing presentation, timing, or completeness of the surrounding paperwork does not address whether the one specific credential is the one actually held."
  - "Capability-specific option selection: a move requires a truck-capable vehicle; among available movers, the cheapest, fastest, or best-reviewed option that lacks a truck fails the goal regardless of how favorably it scores on every other optimized dimension. The binding precondition (truck-capability) is orthogonal to the levers (price, speed, rating) the comparison naturally surfaces."
critical-questions:
  - "What is the plan's BINDING precondition — the one requirement that, if unmet, defeats the goal no matter how well every other lever is optimized? Name it explicitly before optimizing anything else."
  - "Are the choices currently being optimized (speed, route, timing, cost, quality, presentation) actually informative about whether the binding precondition holds, or are they orthogonal levers that leave the precondition unaddressed either way?"
  - "Is there a plausible substitute being treated as equivalent — a nearby object, a similar-seeming credential, a comparable capability — that does not in fact satisfy the specific requirement as stated?"
  - "Was the precondition verified directly, or was its satisfaction inferred from the plan feeling well-optimized on other dimensions? A well-optimized plan can still fail a binding precondition it never checked."
  - "Does the query's grammatical subject (the entity being asked to act) actually differ from the entity that bears the binding precondition — or does the natural framing already center the right entity (e.g., 'should I ride my horse' already treats the horse as present)? This instruction helps when a genuine referential split exists; applied where none does, it can backfire, manufacturing doubt where common framing already suffices."
  - "Is the fix here actually new information, or just a forced pause? A fluent open-ended framing can suppress a check the reasoner already has the knowledge to run; if a bare 'does the naive answer actually hold — yes or no?' re-ask would recover the same correct answer, the value of naming the precondition explicitly is in forcing the check, not in supplying a fact the reasoner lacked."
  - "What is the solver's model strength, and does that change what form this atom should be DELIVERED in? For a strong-small model the abstract agent-instruction text works as a scrutiny-trigger. For a weak open model the same abstract text can actively harm performance (hedging, manufactured spurious preconditions) — the corrective there is concrete, balanced few-shot exemplars of the same rule (paired bring-cases and walk-cases), not the abstraction itself. Do not assume one delivery format transfers across model-strength tiers."
