canonical-instances:
  - "the Kuang Eleven virus penetrating Tessier-Ashpool ice in Neuromancer: rather than bore-and-inject or hide inside a trusted data packet, it slowly mutates its own signature until it is structurally identical to the target ice, defeating detection because there is no anomaly to find."
  - "living-off-the-land cyberattacks: an intruder who has gained a foothold uses the compromised system's own legitimate administrative tools (PowerShell, WMI, existing user credentials) rather than external malware, defeating anomaly-based detection because the malicious activity is statistically indistinguishable from normal system administration."
  - "brood parasitism (cuckoos, cowbirds): rather than physically overpowering a host nest's defenses or hiding the egg from view, some brood-parasite lineages evolve egg mimicry — coloration and speckle pattern matching the host species' own eggs closely enough that the host's egg-recognition system reports no anomaly and accepts the parasite egg as its own."
critical-questions:
  - "how does this differ from lex-x6ft6 (fact-and-forgery-mixed-amplifies-credibility-via-true-anchor)? lex-x6ft6 is a PERSUASION mechanism: mixing verifiably true material with fabricated material so the true material's credibility bleeds onto the fabrication — the fabrication remains discoverably distinct from the truth if traced claim-by-claim, it's just harder to bother tracing. This atom is a DETECTION-EVASION mechanism with no persuasion or claims involved: the intruder doesn't mix true and false signals, it converges its entire signature on the target's signature until there is no discoverable seam to trace, even in principle, at the level the defense is watching. lex-x6ft6's fabrication is always separable in theory; this atom's mimicry is designed to not be separable by the detection method in use."
  - "how does this differ from a Trojan horse / concealment-inside-a-trusted-container? A container-concealment strategy keeps the intruder's true signature intact but hides it inside something the defense already trusts (a gift horse, a signed software update, a diplomatic pouch) — the boundary between container and contents still exists and can, in principle, be found by whoever thinks to look inside. This atom's mechanism has no container and no inside/outside boundary by the time the intrusion completes: the intruder's own signature has been incrementally reshaped to match the target's, so there is nothing to look inside of. Concealment defeats detection by exploiting misplaced trust in a boundary; this atom defeats detection by eliminating the boundary the detection method depends on."
  - "does this atom require the mimicry to be perfect from the start? No — Gibson's description is explicitly gradual ('interface with the ice so slow, the ice doesn't feel it'; the virus 'sleazes up to the target and mutates'), and the brood-parasite and living-off-the-land analogues are both the product of incremental convergence (evolutionary iteration in one case, staged privilege escalation in the other), not an instantaneous perfect copy. The atom names the CONVERGENCE PROCESS, not a claim about how the convergence is achieved technically."
