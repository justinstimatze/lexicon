id: lex-y5jm9
name: procedural-norm-becomes-inapplicable-when-technology-erases-its-anchor-distinction
type-in: structure
type-out: claim
_tier: atomic
status: active
agent-instruction: "When a normative regime is built around procedural compliance with a distinction — 'is this data about an identifiable individual?', 'did the subject consent to this use?', 'is this transaction over the reporting threshold?', 'is the speaker the originator of the content?' — and the underlying technology no longer respects the distinction the procedure anchors on, the regime fails at its applicability, not at its decisions. Procedural compliance can succeed completely while the substantive protection it was meant to deliver collapses. Barocas and Nissenbaum (2014) develop this for privacy in two strokes: (1) anonymization presupposes that 'identifiable' carves a clean boundary, but inference attacks make individuals 'reachable' through aggregated non-identifying features even when they are no longer identifiable, so de-identification protects the procedural form without protecting what anonymity was for; (2) notice-and-consent presupposes that purposes can be specified at consent-time, but big-data analytics discovers uses inductively from data after collection, so the consent form cannot describe what the data will actually be used for and informed consent becomes structurally impossible to give. The transferable diagnostic, when a procedural regime confronts a new technology, is to ask: which feature does the procedure ANCHOR on? Does the technology preserve, transform, or route around that feature? When routed-around, no amount of procedural tightening — clearer notice, harder-to-reverse anonymization, more granular consent — restores the substantive protection because the failure is at the regime's trigger condition, not at its decision rule. The regime needs substantive principles (what flows are legitimate, contextually) rather than procedural triggers (was the form signed; was the identifier removed). This pattern recurs across regulatory domains: AML structuring (Bank Secrecy Act anchors on per-transaction thresholds; transactions split below threshold route around), KYC and shell companies (anchor on beneficial-owner identity; multi-jurisdiction layering routes around), DMCA notice-and-takedown (per-work procedure outpaced by algorithmic upload), GDPR consent over inferential profiling, FCRA over alternative-data scoring, voter-ID over inactive-voter lists, IRB human-subjects rules over web-scraped public posts, antitrust 'relevant market' over two-sided platforms, §230 platform-vs-publisher over algorithmic recommendation, audit's transaction-basis-documented over revenue-recognition timing games. Operational uses: (a) when evaluating a regulatory proposal, locate the anchor feature explicitly and stress-test it against the technology in question; (b) when defending a procedural safeguard against criticism, distinguish 'implementation slop' (procedure can be tightened) from 'anchor-erasure' (procedure cannot recover what was lost) — they call for different responses; (c) when designing a new safeguard for a technology in flux, prefer substantive standards keyed to contextual norms (Nissenbaum's contextual integrity) over procedural triggers whose anchor features the technology may itself dissolve; (d) recognize 'we just need stricter notice' as a category error when the failure mode is anchor-erasure."
