id: lex-cxdtb
name: escalating-pursuit-of-a-trivial-taunt-causes-disproportionate-self-harm
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A small, harmless taunt can trigger a pursuit that keeps escalating past any reasonable relationship to the original provocation, right up until the pursuer has done catastrophic, irreversible damage to themselves in the chase. In Radin's Winnebago Trickster cycle, a chipmunk repeatedly sings a small, accurate taunt about what Trickster is carrying. Trickster's response is immediate and total: 'I will kill you for this, you contemptible thing.' He commits an escalating, irreversible resource to the chase, unwinding his own penis further and further into a hollow tree to reach the fleeing chipmunk: 'he unwound more and more of his penis and probed still deeper, yet all to no avail. Finally he took what still remained, emptying the entire box, and probed and probed but still he could not reach the end.' At no point does the size of the provocation, a mocking song, come back into the calculation as he keeps committing more. When he finally gives up, the cost is revealed all at once: 'suddenly withdrew his penis. Much to his horror, only a small piece of it was left.' The chipmunk's teasing never threatened him with anything; the entire injury was self-inflicted by a pursuit that never once checked whether the response still matched what provoked it. Diagnostic move: when a pursuit of payback keeps requiring you to commit more of something you can't get back, stop and compare the size of what you're spending against the size of what started it -- if the two have stopped being comparable, the escalation itself, not the original provocation, has become the actual threat."
