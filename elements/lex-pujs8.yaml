id: lex-pujs8
name: an-engineered-mirror-confrontation-exposes-hypocrisy
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Someone can be made to confront their own hypocrisy by privately coaching another person to voice, in their presence, the identical self-serving excuse they themselves rely on — forcing them to hear their own logic applied to someone else before an audience, rather than being told directly that they are being unfair. In the Jataka's tale of the neglected queen, a counselor wanting to shame a king into honoring his neglected wife coaches her to answer a question with the king's own excuse: 'Madam, you are very cruel. Ought you not to give the Fathers a piece of cloth or a dish of food?' And she made answer, 'Good sir, I myself receive nothing from the king: what can I give to you?' The king recognizes the excuse instantly, because it's word-for-word his own — the confrontation works precisely because it removes the option of hearing the accusation as someone else's complaint about him rather than as his own reasoning played back."
related: []
evokes: [jataka, dukanipata, puta-bhatta-jataka, coaching-a-mirrored-excuse-forces-self-recognition, hearing-your-own-logic-from-another-mouth]
