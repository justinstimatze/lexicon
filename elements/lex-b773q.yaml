    quote: "'He is a giant with spindling legs. He cannot fight, for he cannot run. He is powerful only in the night with his tricks. We are safe as soon as day breaks.' ... 'Ha! ha!' laughed all the village people to see Iya made foolish with anger. 'Such spindle legs cannot stand to fight by daylight!'"
canonical-instances:
  - "A small business facing a much larger competitor's aggressive, temporary price war doesn't try to match prices and fight it out during the window when the competitor has deep enough pockets to sustain losses -- it conserves cash and waits, knowing the competitor's advantage depends on a subsidized pricing period that will expire, at which point the small business's leaner cost structure becomes the decisive factor instead."
  - "An employee targeted by a manipulative colleague who has temporary favor with an unpredictable, soon-departing manager doesn't try to confront the colleague directly during that window, when any conflict would be adjudicated in the colleague's favor -- they document quietly and wait, since the colleague's leverage is tied entirely to a specific manager's tenure, not to any lasting institutional standing."
critical-questions:
  - "how does someone reliably identify, in advance, whether a threat's power is genuinely tied to an expiring condition versus being a durable advantage that will still be there once the apparent window closes -- misjudging this could mean waiting indefinitely for a vulnerability that never actually arrives?"
  - "does waiting out a threat's window of power sometimes cost more than confronting it early would have -- if Iya had woken and devoured someone during the escape, would the story's own strategy have looked reckless rather than wise in hindsight?"
  - "does this framework only work when the threatened party can actually detect the transition between the threat's strong and weak regimes -- what happens when the boundary between the two isn't as clean and knowable as day and night, and the weak window might already have passed unnoticed?"
