id: lex-mv3qh
name: overwhelming-attention-displaces-a-craving-before-the-teaching-begins
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "An argument aimed at someone still gripped by a craving has to fight the craving directly, and usually loses. Flooding their attention with an overwhelming alternative experience first, before any argument is made, can displace the craving on its own, so that by the time the teaching arrives, it lands on an audience whose attachment has already loosened rather than one still defending it. In the Jataka's tale of Kunala, before delivering a hard teaching to five hundred monks pining for the wives they'd left, the Buddha first takes them on a tour of the Himalayas' full splendor, with no argument made at all: \"This charming part of it by his mighty power did he show them, and the dwelling places that were built there, the quadrupeds too, troops of lions, tigers, elephants and so forth did he show from this place. [...] From the first sight of these charming regions, the passionate longing of these Brethren for their former wives passed off.\" Only after their craving has already lifted does he speak."
related: []
evokes: [jataka, asitinipata, kunala-jataka, attention-displacement, craving-preempted-not-argued-away]
lineage:
  - source: primary
    text: jataka-francis1905-kunala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XXI (Asitinipata), No. 536, Kunala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "This charming part of it by his mighty power did he show them, and the dwelling places that were built there, the quadrupeds too, troops of lions, tigers, elephants and so forth did he show from this place. [...] From the first sight of these charming regions, the passionate longing of these Brethren for their former wives passed off."
canonical-instances:
  - "A therapist treating a client fixated on a breakup doesn't argue against the ex directly in the first session — they spend it having the client narrate, in vivid sensory detail, everything else that's alive in their life right now, and only in the following session, once that attention has somewhere else to land, does the harder conversation about the relationship begin."
  - "A manager trying to redirect a team obsessed with a shelved feature doesn't open the all-hands by explaining why it's dead — they open with a live demo of the new direction, letting the team's attention and excitement move there first, and only afterward, almost as an aside, addresses the old feature's cancellation."
critical-questions:
  - "The monks' craving 'passed off' from sheer sensory overwhelm, not from anything resembling insight into why the craving was mistaken — does displacing a craving this way actually resolve it, or does it just relocate their attention until the next unguarded moment, when the original craving might resurface once the novelty fades?"
  - "This tactic requires access to something overwhelming enough to compete with the craving. Does the mechanism generalize to situations where nothing comparably overwhelming is available, or does it only work at the scale of a genuinely awe-inducing experience?"
status: active
