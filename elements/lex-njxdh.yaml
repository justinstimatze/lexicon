id: lex-njxdh
name: intent-toward-a-sacred-figure-determines-the-approachers-fate
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When two people encounter the same powerful or sacred figure under the same circumstances, the figure itself doesn't have to change or discriminate between them for their fates to diverge completely -- the approacher's own internal disposition can be the entire mechanism. In the White Buffalo Calf Woman story Black Elk tells, two scouts see the same beautiful stranger; one has 'bad thoughts' and approaches her with them; the other warns him 'this is a sacred woman; throw all bad thoughts away.' The one who approached with desire is destroyed the instant he reaches her -- a white cloud covers them, and when it clears he is 'a skeleton covered with worms.' The one who held back respect is given the sacred pipe and detailed instructions for his whole people. She does nothing different toward either man; she doesn't test them, trick them, or choose between them. The differentiation is entirely internal to what each man brought to the encounter. Distinct from a disguised tester who withholds their true identity specifically to see how a subject responds, like a deity posing as a beggar (lex-jhau7): the Calf Woman doesn't conceal anything to manufacture the test -- both men see exactly what she is, and the outcome still splits entirely on what each does with that knowledge."
related: [lex-jhau7]
evokes: [black-elk-speaks, white-buffalo-calf-woman, the-foolish-scout, a-skeleton-covered-with-worms, sacred-pipe-origin-story]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch1-offering-of-the-pipe
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 1, 'The Offering of the Pipe.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Then one of the scouts, being foolish, had bad thoughts and spoke them; but the other said: 'This is a sacred woman; throw all bad thoughts away.' When she came still closer, they saw that she wore a fine white buckskin dress... And she knew their thoughts and said in a voice that was like singing: 'You do not know me, but if you want to do as you think, you may come.' And the foolish one went; but just as he stood before her, there was a white cloud that came and covered them. And the beautiful young woman came out of the cloud, and when it blew away the foolish man was a skeleton covered with worms."
canonical-instances:
  - "Two employees are offered the same confidential information by a whistleblower under identical circumstances; one uses it for personal leverage and is caught and fired, the other reports it through proper channels and is protected -- the whistleblower didn't test either of them, the differing outcome came entirely from what each one chose to do with the same access."
  - "A rare, unguarded opportunity for exploitation, an unlocked donation box or an unattended cash drawer, sits in front of two people in the same circumstances; the story of 'who gets caught' often obscures that the actual divergence happened earlier, at the moment of intent, before either action was taken."
  - "Distinct from a trap deliberately set to catch bad actors, like a decoy left out specifically to see who steals it: those setups manufacture the differentiation on purpose. This pattern is different because nothing was staged -- the object of desire was simply present, doing nothing to provoke or filter either response."
critical-questions:
  - "Is the fatal outcome actually proportionate to the offense -- a moment of 'bad thoughts,' not yet acted into anything beyond approach, ends in death, while the respectful scout receives an enormous reward -- does this story teach a real moral principle, or mainly enforce the tabooed status of the sacred object, with the punishment scaled for that purpose rather than for the actual severity of the man's intent?"
  - "How would an outside observer, lacking access to either man's internal state, have predicted which one would approach with which disposition -- is 'intent determines fate' a genuinely useful diagnostic before the fact, or only a clean story after it?"
  - "When the sacred or valuable thing in question can't actually detect intent at all, an inanimate resource or an unmonitored system, is there anything left actually differentiating the outcomes, or does the moral lesson quietly stop applying?"
status: active
