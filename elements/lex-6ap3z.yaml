id: lex-6ap3z
name: assign-a-companion-to-monitor-someone-without-it-looking-like-monitoring
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to keep someone from ever being unsupervised without making the supervision visible as control, attach a companion to them under the cover of an ordinary, warm relationship rather than an assigned watch. In Zitkála-Šá's telling, the toad who has raised a stolen human boy for ten years senses she's about to lose him the moment he's moved by his birth mother's distant voice. Rather than confining him or forbidding him to wander, 'when by chance he started off alone, she shoved out one of her own children after him, saying: \"Do not come back without your big brother.\"' The result: 'always at his feet hops a little toad brother' -- framed entirely as sibling companionship, not as surveillance, so the boy has no obvious reason to resist or resent it, and no clear moment at which he could name what's actually happening to him. The mechanism depends on the cover relationship being genuinely plausible on its own terms -- a toad sibling accompanying a toad-raised boy isn't inherently suspicious, which is exactly what makes it effective as monitoring: the boy would need to first doubt the sincerity of an otherwise unremarkable family bond before he could even recognize that he's being tracked. Diagnostic move: when you notice a companion, mentor, or 'buddy' has been placed with you under a warm, relationship-shaped pretext right around the time your loyalty or intentions became suspect to someone with power over you, consider that the relationship's true function may be surveillance -- and recognize that the reason it's hard to object to is precisely that objecting would mean rejecting what looks, on its face, like ordinary companionship."
