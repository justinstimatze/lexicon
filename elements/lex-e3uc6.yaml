id: lex-e3uc6
name: full-pooling-removes-the-ownership-claim-partial-sharing-still-has
type-in: situation
type-out: structure
_tier: atomic
agent-instruction: "When a group sharing a resource keeps generating disputes over who used how much of what, skip the usual fixes of better tracking or a fairer division rule and consider a more drastic one: remove individual ownership of the resource entirely. At Mars College's Freeside camp, groceries were pooled completely rather than assigned in individual portions: 'Buying and sharing groceries as a group had many benefits... Because we were largely sharing all of our food, we didn't have the classic roommate conflict of Who ate my x? All of the food belonged to everyone.' A partial-sharing arrangement (a shared pantry with individually-bought items sitting alongside it) still has individual ownership boundaries to police, which is exactly what manufactures disputes over crossing them. Full pooling doesn't solve that policing problem -- it deletes the boundary the policing would have been for, so there's nothing left to dispute. The structure pays off in reverse too: 'Since the food belonged to everyone, that meant the random molding mystery items at the back of the fridge also belonged to everyone. If anyone saw something gross, that person had full license to throw it away' -- nobody needs permission to discard shared waste, because nobody's individual claim could be violated by discarding it. Diagnostic move: when a shared-resource conflict keeps recurring despite clearer rules or better tracking, check whether the actual fix is a fairer division of individual shares, or whether the individual-ownership structure itself is what's generating the disputes -- in which case removing ownership boundaries entirely, not refining them, is the available move."
related: [lex-vqmn8]
