canonical-instances:
  - "A hostage negotiator who can't force a barricaded gunman to lower his weapon instead praises his tactical planning at length, and the gunman, absorbed in being complimented on his own cleverness, lowers his guard long enough for the standoff to end without force."
critical-questions:
  - "Does this only work on a target vain enough to be genuinely distracted by praise, or is there a version of this that works even on someone who consciously suspects flattery but still can't resist responding to it?"
  - "Once free, does the elephant's retaliation suggest the crab's vanity cost it more than the original grip ever risked, and would a captor who noticed the pattern learn to distrust praise the next time?"
