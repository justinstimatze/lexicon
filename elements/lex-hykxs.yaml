id: lex-hykxs
name: wanting-to-be-desired-can-pass-as-desiring-someone
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When you feel pulled toward someone, separate two distinct pleasures before calling it attraction: wanting them, and liking that they want you. The second is a real, valid pleasure on its own - flattery, validation, the thrill of being pursued - but it can substitute for and be mistaken for the first, especially when the surrounding social role rewards being desired more than it rewards naming your own desire. If you can't tell which one you're actually feeling, ask what would still be appealing if the other person's interest in you were removed from the equation."
related: [lex-kvtrt, lex-v8jbf]
evokes: ["i-want-you-versus-i-like-that-you-want-me", "the-flattery-of-being-pursued", "excitement-at-the-attention"]
lineage:
  - source: primary
    text: wynn-2020-shame-contrapoints-desire-versus-being-desired
    citation: "Natalie Wynn, 'Shame' (ContraPoints, YouTube, published 2020-02-16). Wynn distinguishes the pleasure of being pursued by men from actual sexual attraction to them, identifying the conflation as central to how she spent years believing herself heterosexual."
    quote: "'I've felt desired by men in a way I've never truly felt desired by women. ... But notice how excitement at the attention, the flattery of being desired, is not the same thing as attraction to men. You know, there's a difference between, \"I want you.\" and, \"I like that you want me.\" But for a long time I confused one for the other.'"
canonical-instances:
  - "Wynn's own account of what drew her to men in the first place, by her own naming: 'I think that's what got me interested in men in the first place. It's that they were interested in me' - the pursuit itself, not an independent pull toward the pursuer, supplying the felt sense of attraction."
critical-questions:
  - "Is this distinction actually introspectable in the moment, or only visible in retrospect once the relationship has ended and the flattery has stopped supplying its reward - can someone reliably tell which pleasure they're feeling while they're still inside it?"
  - "Wynn ties the conflation to a specific social role (the normative pursued-rather-than-pursuing position for women) - does the mechanism generalize to people in a pursuing or symmetrical role, or does it specifically require an asymmetric being-desired position to take hold?"
  - "Does noticing the distinction actually change anything on its own, or does it only help once paired with an alternative source of validation that doesn't depend on being desired by the person in question?"
status: active
