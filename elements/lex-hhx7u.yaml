id: lex-hhx7u
name: argument-from-ignorance-absence-treated-as-evidence-of-falsity-under-closure
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When concluding 'X is false because there's no evidence for X', check whether the search-space was actually exhausted (closure-world). Argument-from-ignorance is defeasible: maybe the evidence exists but wasn't sought, or the domain doesn't have the closure-property your inference assumes."
related: [lex-af9ax, lex-kebfa, lex-th68b, lex-hesjt, lex-3d2he, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-rnwph, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-tpv83, lex-chtk9, lex-9uac6, lex-xqamc, lex-smney, lex-3ajns, lex-bvjpk]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt, lex-kebfa]
evokes: [ad-ignorantiam, absence-of-evidence-as-evidence-of-absence, epistemic-closure, presumption-of-innocence, no-news-is-news, normal-expectations-failure, the-dog-that-didn't-bark, negative-practical-reasoning, knowledge-base-completeness]
premises:
  - "if A were true, then A would be known to be true (epistemic-closure / knowledge-base-completeness premise)"
  - "it is not the case that A is known to be true (the no-evidence premise)"
  - "therefore presumptively A is not true"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(establish-knowledge-base-completeness, verify-absence-of-evidence) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "is the knowledge-base actually complete enough to support the closure premise? Walton's core gate. 'If A were true, then A would be known' presumes someone has actually searched comprehensively for evidence of A. If search was shallow, recent, or restricted to one channel, absence-of-evidence is uninformative. Diagnostic: ask 'how would we know if A were true? where would we have looked?' — if the answer is unclear, the closure premise fails"
  - "is the type-of-proposition A one that WOULD normally produce known evidence if true? Walton's epistemic-variant gate. Some propositions (Leona-Helmsley-released, novel-pathogen-spreading, dog-barked-in-the-night) produce strong observable signal IF true; others (private-thoughts, ancient-historical-facts, rare-events-in-large-populations) don't. Sherlock's 'dog that didn't bark' works because barking-would-have-been-expected; absence of barking is evidence specifically because the expected signal was pivotal"
  - "is this argument being used in a domain where presumption-against-A is COSTLIER than presumption-for-A? Walton's negative-practical-reasoning variant: firearms-safety treats unknown-load-status as loaded BECAUSE consequences of wrong-direction error are asymmetric. The ad ignorantiam direction (presume false vs presume true) is choosable in negative-practical mode; in pure epistemic mode the direction is determined by where the closure premise points"
  - "is the burden of proof being inappropriately shifted via ad ignorantiam? Common fallacy mode: 'you haven't proven X is false, therefore X is true' (or vice versa) treats the absence of an OPPOSING proof as positive evidence when there's no closure-base supporting that inference. The argument is legitimate when grounded in genuine closure; fallacious when used to flip burden-of-proof in domains where neither side has a complete knowledge-base"
  - "is the knowledge-base-completeness premise itself secretly an empirical claim? The closure premise often hides a strong empirical assertion: 'the security audit was thorough', 'the regulatory review covered all known risks', 'the literature search captured all relevant studies'. When this hidden claim is contested, the ad ignorantiam degrades to argument-from-expert-opinion (lex-kebfa) — and the CQs for that scheme also need to fire"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.2 §3 'Argument from Ignorance' (pp.97-100) — scheme statement + epistemic-closure premise + two sub-variant treatments (epistemic / normal-expectations, and negative-practical-reasoning / firearms-safety analogy). Citing Walton 1995 p.150 + 1992 p.386 + 1996 pp.85-86. Compendium restatement at Ch.9 #26 (Argument from Ignorance, p.327) + #27 (Epistemic Argument from Ignorance, p.328). Local copy."
    quote: "This topic is an instance of the general form of ad ignorantiam: the absence of positive proof for the truth of the proposition is considered a reason to believe in its falsity. This argument is the basis for the presumption of innocence in criminal law. In the absence of evidence, the accused is assumed to be legally innocent. The form of argument is the following (Walton, 1995, p. 150): Major Premise: If A were true, then A would be known to be true. Minor Premise: It is not the case that A is known to be true. Conclusion: Therefore, A is not true. [...] [Epistemic argument from ignorance] It has not been established that all the true propositions in D are contained in K. A is a special type of proposition such that if A were true, A would normally or usually be expected to be in K. A is in D. A is not in K. For all A in D, A is either true or false. Therefore, it is plausible to presume that A is false (subject to further investigations in D). [...] [Negative practical reasoning, firearms-safety variant] It is a rule of safety in handling firearms that if you do not know for sure that a weapon is unloaded to act in accordance with the presumption that the weapon is (or may be) loaded."
  - source: primary
    text: locke-1690-essay-iv-17-20
    citation: "John Locke, *An Essay Concerning Human Understanding* (1690), Book IV, Chapter XVII 'Of Reason', §20 (in the standard four-book division reproduced in the Project Gutenberg edition PG #10616, Vol. II). Locke coins the name *argumentum ad ignorantiam* here, cataloguing it as the second of 'four sorts of arguments, that men, in their reasonings with others, do ordinarily make use of to prevail on their assent; or at least so to awe them as to silence their opposition' — alongside ad verecundiam (§19), ad hominem (§21), and ad judicium (§22). Locke's diagnostic framing is critical-rhetorical: the ad ignorantiam is a pressure tactic operating by forcing the adversary 'to admit what they allege as a proof, or to assign a better' — burden-shift via exploitation of inability-to-refute — and Locke explicitly contrasts it with ad judicium ('the using of proofs drawn from any of the foundations of knowledge or probability'), which 'alone, of all the four, brings true instruction with it, and advances us in our way to knowledge.' Methodologically-distinct from Walton-Reed-Macagno: Locke is taxonomic-critical (naming the genre + diagnosing it as forensic pressure that may be epistemically empty), Walton-Reed-Macagno is defeasible-scheme-analytical (giving it a critical-question apparatus that distinguishes legitimate epistemic-closure-grounded uses from illegitimate burden-shifting). Locke does not separate the legitimate case (presumption-of-innocence, dog-that-didn't-bark) from the fallacious case — that analytical move is Walton's; what Locke contributes is the NAMING and the taxonomic siting of the move among forensic/rhetorical pressure tactics rather than truth-tracking proofs. PD; in the lexicon corpus."
    quote: "Before we quit this subject, it may be worth our while a little to reflect on FOUR SORTS OF ARGUMENTS, that men, in their reasonings with others, do ordinarily make use of to prevail on their assent; or at least so to awe them as to silence their opposition. [...] II. Secondly, Another way that men ordinarily use to drive others, and force them to submit their judgments, and receive the opinion in debate, is to require the adversary to admit what they allege as a proof, or to assign a better. And this I call ARGUMENTUM AD IGNORANTIAM. [...] [§22 ad judicium] IV. The fourth is the using of proofs drawn from any of the foundations of knowledge or probability. This I call ARGUMENTUM AD JUSTICIUM. This alone, of all the four, brings true instruction with it, and advances us in our way to knowledge. For [...] It proves not another man to be in the right way, nor that I ought to take the same with him, because I know not a better."
canonical-instances:
  - "presumption of innocence in criminal law — Walton's canonical instance; absence of established proof of guilt treated as warrant for innocent verdict"
  - "Sherlock Holmes 'the dog that didn't bark' (Doyle 1892 *Silver Blaze*): the absence of barking on a night a stranger was present is evidence the visitor was familiar to the dog — works specifically because the closure premise is strong (this dog DOES bark at strangers)"
  - "security audit clean-bill-of-health: 'no vulnerabilities found in the audit' treated as evidence of security; legitimate when closure (audit comprehensiveness) is real, fallacious when audit was narrow"
  - "firearms safety rule (Walton's variant): unknown-load-status treated as loaded, presuming worst-case under negative practical reasoning"
  - "intelligence-analysis: 'no SIGINT chatter detected' treated as evidence of operation-cancelled, legitimate when collection coverage is comprehensive, fallacious when collection has known gaps"
  - "medical screening: 'mammogram clear' treated as evidence of no-cancer, defeasible on known false-negative rate of the screening modality"
  - "scientific publication-bias defeat: 'no studies showed effect X' is weak evidence X is false if null results go unpublished — closure fails because publication bias prevents complete knowledge-base"
  - "epidemic surveillance reverse: absence of reported cases treated as evidence of no-outbreak; defeats when surveillance is patchy or cases are mild/asymptomatic"
severity-tier: info
status: active
