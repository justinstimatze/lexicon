    quote: "So down he dropped, and drank his fill; but he could not get up again, so he remained standing there in the well."
canonical-instances:
  - "A company facing an imminent cash crunch takes on emergency debt at terms nobody would accept under normal conditions, solving the immediate liquidity problem completely while creating repayment obligations that make the company's actual survival less likely than the crunch itself would have."
critical-questions:
  - "Was there genuinely no better option available to the desperate king, or does hindsight make an unavoidable emergency measure look like an obviously bad decision only after the specific downside became visible?"
  - "Does acute desperation reliably impair the ability to check for an exit before acting, or did this king simply have no way to know the well offered no way out until he was already inside it?"
