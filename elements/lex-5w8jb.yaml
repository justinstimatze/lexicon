    quote: "\"It is not a clever builder, but an ape with a wrinkled face; He can destroy what others make; that is the way of his race.\""
canonical-instances:
  - "A hiring panel meets a candidate whose polished resume and rehearsed backstory claim years of relevant experience. The interviewer who catches the mismatch sets that story aside and simply asks the candidate to perform the core task live."
critical-questions:
  - "How does an observer learn which properties of a role are actually fixed and testable versus which ones a genuinely qualified newcomer might simply not have developed yet?"
  - "Is the child-king's method scalable, or does it depend on the deception being crude enough that a direct capability check is even available to run?"
