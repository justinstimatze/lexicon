lineage:
  - source: primary
    text: hyde-ecos-semiotics-true-worm-only-exists-once-lying-worm-is-possible
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'The First Lie,' 'A Sign of Youthful Theft,' quoting Umberto Eco, A Theory of Semiotics. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Semiotics is concerned with everything that can be taken as a sign. A sign is everything which can be taken as significantly substituting for something else … . Thus semiotics is in principle the discipline studying everything which can be used in order to lie. If something cannot be used to tell a lie, conversely it cannot be used to tell the truth: it cannot in fact be used “to tell” at all. ... A worm with no hook in it, a worm the fish can eat in safety, has, by Eco’s way of thinking, no significance, but the worm that says “I’m harmless” when in fact it hides a hook tells a lie and by that lie worms begin to signify (and fish, if they are smart, will begin to read before they eat). Only when there’s a possible Lying Worm can we begin to speak of a True Worm, and only then does Worm become a sign."
canonical-instances:
  - "Before deepfakes existed, a video of a person saying something was treated as settled proof they said it, not as a 'true' claim being verified, because a false version was not yet practically possible; once fabrication became possible, video testimony had to become a truth claim for the first time, subject to doubt and verification like any other."
  - "A handwritten signature was long treated as inherently authentic in low-forgery contexts, not because it was especially trustworthy but because forging it was hard enough that the false version rarely existed; as forgery got easier, the signature had to start actually earning trust as a truth claim rather than being definitionally true."
critical-questions:
  - "Does this framework risk conflating two different things -- the logical possibility of falsehood (any statement can in principle be false) with the practical, causal possibility of deception (a signal's material structure could be manipulated) -- when the worm example specifically hinges on the latter?"
  - "If a signal becomes capable of lying only when a deceiver invents the capability (the hook), does that mean truth as a category is invented by the first liar rather than discovered, and does that framing hold for natural signals that were never engineered by anyone, like a genuine warning cry?"
  - "Is there a meaningful difference between a signal that cannot lie because it is physically incapable of it (an involuntary reflex) versus one that cannot lie because no one has yet thought to falsify it, and does Eco's claim apply equally to both?"
