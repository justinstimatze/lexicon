id: lex-qxt8p
name: the-same-trait-that-cost-you-becomes-your-revenge
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A quality someone used as the excuse to reject or wrong you can sit dormant for years and then become the exact instrument for repaying them, once you're no longer in a position to be dismissed for it. In the Jataka's tale of Ummadanti, the merchant's daughter is examined as a possible match for king Sivi, but the brahmin testers, overcome by her beauty, humiliate themselves and retaliate by calling her a witch; the king rejects her on their word, and she vows, \"Should I ever see the king, I shall know what to do.\" Years later, married to the king's own loyal general and explicitly warned to stay out of sight during a royal procession, she deliberately shows herself at the window and showers him with flowers — and the king who once refused her is left helplessly, publicly infatuated with a woman he can now never have."
related: []
evokes: [jataka, pannasanipata, ummadanti-jataka, delayed-symmetric-revenge, repurposing-the-cause-of-your-own-injury]
lineage:
  - source: primary
    text: jataka-francis1905-ummadanti-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XVIII (Pannasanipata), No. 527, Ummadanti-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Should I ever see the king, I shall know what to do."
canonical-instances:
  - "A brilliant engineer is passed over for a leadership role because a panel found her directness 'abrasive.' Years later, now running a competing team with hiring authority, she recruits the same panel's rising star away with a blunt, unflattering assessment of his current manager delivered in the exact tone that once cost her the promotion — and this time it lands as decisive rather than off-putting."
  - "A founder is denied funding by an investor who calls his big vision 'unrealistic and grandiose.' Years later, after his company succeeds without that investor, he's invited to speak at the same firm's portfolio event and delivers a keynote built entirely around the scale of ambition the firm once rejected in him — now framed as the exact quality every founder in the room should aspire to."
critical-questions:
  - "Ummadanti also lies to her own husband about what happened at the window ('I do not know whether he was a king or a prince'), concealing that the display was deliberate — does the revenge read differently once you weigh that it required deceiving the one person who trusted her completely, not just repaying the one who wronged her?"
  - "The king suffers for pursuing a woman he can never lawfully have, not the brahmins who actually slandered her — does this count as revenge against the people responsible for the original harm, or does it just relocate the cost onto someone who happened to be collateral to it?"
status: active
