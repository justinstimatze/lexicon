id: lex-xctqs
name: an-alliance-needs-ongoing-bidirectional-exchange-not-a-founding-gesture
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An alliance formed through a single generous founding gesture does not sustain itself on that gesture alone — it requires continued, bidirectional exchange, and stops the moment that exchange goes one-directional or halts entirely. The Panchatantra names the six actions that keep a friendship functioning: 'Six things are done by friends: to take, and give again; to listen, and to talk; to dine, to entertain' — every verb paired with its reciprocal. The warning that follows makes the fragility explicit: 'as soon as presents cease, so soon does friendship die: the calf deserts the cow whose udder has gone dry.' The calf's attachment was never really to the cow as an individual; it was to the ongoing flow the cow supplied, and the bond dissolves the instant that flow does, regardless of how it began."
related: []
evokes: [panchatantra, winning-of-friends, alliance-needs-ongoing-exchange-not-a-founding-gesture, bond-attaches-to-the-flow-not-the-source]
lineage:
  - source: primary
    text: panchatantra-ryder1925-six-things-are-done-by-friends
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book II, 'Six things are done by friends.' Verified verbatim against a direct extraction of the held copy."
    quote: "Six things are done by friends: To take, and give again; To listen, and to talk; To dine, to entertain."
canonical-instances:
  - "a client relationship built on a vendor's initial, generous onboarding investment cools within a year once the vendor shifts to purely transactional support, because the client's loyalty was never to the vendor as a company — it was to the level of ongoing attention the onboarding period had established as the norm."
critical-questions:
  - "Is the calf's attachment to the flow rather than the source actually a flaw in the relationship, or is that just an accurate, unsentimental description of how most functional alliances — not just this one — actually work?"
  - "Does an alliance ever survive purely on accumulated goodwill from the past, without needing continued exchange in the present, or does the fable's logic imply that no reserve of past generosity is ever sufficient on its own?"
status: active
