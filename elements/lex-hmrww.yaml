id: lex-hmrww
name: sitting-beside-the-unjustly-condemned-as-solidarity-permanently-marks-the-witness
type-in: process
type-out: state
_tier: atomic
agent-instruction: 'A friend who cannot prevent an unjust punishment can still choose to remain physically present with the condemned person through it, an act of solidarity costly enough that it visibly and permanently marks the one who stayed. In the Jataka''s tale of Kanhadipayana, the friend sits by the impaled man''s stake through the night, and the gore that falls on him from the wound becomes a permanent mark that gives him his name from then on: "with these words down he sat by the side of the stake. Then upon his body from the body of Mandavya fell gouts of gore; and these as they fell upon the golden skin, and there dried, became black spots upon it; which gave him the name of Kanha or Black Dipayana from thenceforth."'
related: []
evokes: [jataka, dasanipata, kanhadipayana-jataka, solidarity-with-the-condemned, bearing-witness, etiological-mark]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanhadipayana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 444, Kanhadipayana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "with these words down he sat by the side of the stake. Then upon his body from the body of Mandavya fell gouts of gore; and these as they fell upon the golden skin, and there dried, became black spots upon it; which gave him the name of Kanha or Black Dipayana from thenceforth."
canonical-instances:
  - "A colleague with no power to stop a wrongful termination hearing sits in the room through the entire proceeding anyway, and years later is still known at the company as the one person who did not leave when everyone else found reasons to be elsewhere that day."
critical-questions:
  - "Does the permanent mark left by an act of solidarity change its moral weight, or is the mark simply an incidental narrative detail that dramatizes a choice that would matter equally without it?"
