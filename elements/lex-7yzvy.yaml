id: lex-7yzvy
name: specialist-argot-serves-coordination-and-identity-not-secrecy
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A specialized subculture's technical vocabulary can persist and flourish mainly because it performs group-coordination and identity-signaling work, not because it conceals meaning from outsiders — the popular assumption that professional argot exists FOR secrecy gets the causation backwards in most cases. Maurer's Life of the confidence game confronts this directly, using con-men's own lingo as the test case: 'Why do criminals speak a lingo? There are several reasons, perhaps the most widely accepted of which is that criminals must have a secret language in order to conceal their plans from their victims or from the police... But most professional criminals speak argot only among themselves... It is a fact that argots are unintelligible to the layman, but I think that we should not assume that this is a deliberate protective device invented by criminals; we might as well conclude that, because the professional lingo of railroaders, doctors, sailors or tobacco auctioneers is not readily understood by outsiders, it was created to deceive the public. The argot is inherent to the profession; secrecy is a very minor motive for its formation and use.' Maurer's positive account names what the jargon is actually doing: 'There is a very strong sense of camaraderie among criminals, a highly developed group-solidarity... A common language helps to bind these groups together and gives expression to the strong fraternal spirit which prevails among them.' The diagnostic test he supplies is decisive — a genuinely concealment-motivated code would be used SELECTIVELY, deployed only when outsiders are present and dropped among insiders; argot instead runs the opposite direction, appearing most densely in private in-group talk and receding in front of marks or police specifically because using it in public would mark the speaker as underworld regardless of comprehension. Generalize beyond criminal argot: medical jargon, legal Latin, military acronyms, and technical-subculture slang all share the same unintelligible-to-outsiders property that gets casually read as gatekeeping, when the primary driver is usually the same combination this book names — economical reference to a large body of shared technical situations, plus the bonding and mutual-recognition function of a shared code. The diagnostic move: before assuming a group's jargon exists to exclude you, check whether it's used differently in front of you than among themselves — genuine concealment-code is deployed selectively; identity/coordination-code is used constantly, indifferent to who's listening."
