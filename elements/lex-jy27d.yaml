lineage:
  - source: primary
    text: mcneill-1995-keeping-together-in-time
    citation: "William H. McNeill, *Keeping Together in Time: Dance and Drill in Human History* (Harvard University Press, 1995), Chapter 1 ('Muscular Bonding'), pp.1-3."
    quote: "'IN SEPTEMBER 1941 I was drafted into the army of the United States and underwent basic training in Texas... We boasted a single (inoperative) anti-aircraft gun for the entire battalion, so that practical training on the weapon we were supposed to master was impossible... Given the facts of twentieth-century warfare, troop movement in the rear was a matter of trucks and railroads. Close-order marching within range of machine guns and rifles was a form of suicide. All concerned realized these simple facts, yet still we drilled, hour after hour... What I remember now, years afterwards, is that I rather liked strutting around, and so, I feel sure, did most of my fellows... a strange sense of personal enlargement; a sort of swelling out, becoming bigger than life, thanks to participation in collective ritual... The strongest human emotions — love, hate, and fear — are ordinarily triggered by encounters with other persons or particular external circumstances... But the diffused exaltation induced by drill has no apparent external stimulus. Instead, marching became an end in itself... Obviously, something visceral was at work; something, I later concluded, far older than language... 'Muscular bonding' is the most economical label I could find for this phenomenon.' (McNeill, *Keeping Together in Time*, Ch.1, pp.1-3)"
  - source: discovery-loop
    text: mcneill-keepingtogetherintime-mining-pass-
    citation: "McNeill's book had been cited five times as cross-attestation for lex-k7m6e (shared-coordinated-action-generates-collective-effervescence-and-bonds-the-group) but never directly mined for its own specific claim. The source PDF is an OCR scan; layout and raw extractions were cross-verified as identical for all quoted passages. Lex-0407 is the closest structural neighbor — the same underlying synchrony-bonding phenomenon, the same McNeill cross-attestation — but states the Durkheimian claim: shared action generates collective effervescence, projected onto a totem or sacred symbol. This atom states a different, narrower, and more falsifiable claim that lex-k7m6e does not: that the bonding effect is blind to whether the synchronized activity has any practical or symbolic validity at all — McNeill's drill example produced full-strength bonding despite being tactically pointless and known by all participants to be pointless."
canonical-instances:
  - "McNeill's own 1941 basic-training drill: tactically obsolete (troop movement by the 1940s was trucks and railroads, not marching columns), literally suicidal if used near machine guns, and known to be pointless by every recruit and officer present — yet it produced full-strength euphoric bonding indistinguishable from any other instance of muscular bonding McNeill catalogs across the rest of the book."
  - "Maurice de Saxe, Marshal of France (quoted by McNeill, Ch.1): 'Have them march in cadence. There is the whole secret... Movement to music is natural and automatic. I have often noticed while the drums were beating for the colors, that all the soldiers marched in cadence without intention and without realizing it. Nature and instinct did it for them' — an 18th-century military professional independently noting that the bonding/fatigue-countering effect of cadence is automatic and does not depend on the soldiers understanding or endorsing why they are marching."
  - "Any modern instance of manufactured cohesion around content-free or content-false shared activity — corporate team-building chants, cult initiation drills, hazing rituals, mass calisthenics at a rally — where the observed strength of group loyalty is sometimes read backward as evidence that the group's cause or claims must have some validity, when the loyalty-generating mechanism (synchronized repetitive action) would have produced the same bonding strength regardless of the content."
critical-questions:
  - "Isn't this just an anecdote — one man's memory of one drill session? McNeill supplements his own recollection with independent cross-cultural and historical attestation of the same content-blind pattern (Maurice de Saxe on automatic marching-in-cadence 'without intention'; Sir Michael Howard's independent recollection that 'drill developed group cohesion to a very high degree'; the general historical fact that close-order drill continued to be used and continued to produce esprit de corps for roughly a century after it had lost its 1840s-era tactical rationale) — the claim is that the mechanism is general, not that this one anecdote proves it alone."
  - "Doesn't group bonding usually correlate with worthwhile shared activity in practice, making the content-blindness a moot point? The claim isn't that content never matters or is never worth choosing well — it's a narrower, falsifiable claim about the MECHANISM: bonding strength is not GATED on content validity. This matters practically precisely in the cases where content and bonding come apart — pointless hazing, obsolete tradition, or false belief can generate bonding just as strong as sound shared purpose, which is what makes the mechanism exploitable and what makes 'they're clearly bonded, so they must be onto something' an unreliable inference."
  - "Could the bonding just be ordinary social reinforcement (shared hardship, in-group time spent together) rather than anything specific to RHYTHMIC SYNCHRONY? McNeill's account isolates synchrony specifically: the drill produced bonding disproportionate to the actual hardship involved (marching on a dusty field is mild hardship compared to other basic-training tasks) and the phenomenology reported — a diffuse euphoria 'with no apparent external stimulus,' felt as an end in itself rather than as relief from shared difficulty — points to the rhythmic-movement mechanism itself, not merely time-spent-suffering-together."
  - "Does 'blind to validity' mean the bond can never be dissolved by argument? Not addressed directly by McNeill in this passage, but implied by his own account of the pathway (excitation reaches the verbal/left-cortex only after passing through subcortical structures): if the bond forms through a channel that never routed through verbal reasoning, verbal counter-argument against the activity's content should be expected to have limited power to dissolve a bond that content-based argument never created in the first place — a testable but McNeill-unaddressed corollary, flagged here as an open extension rather than a settled part of the claim."
