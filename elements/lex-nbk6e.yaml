lineage:
  - source: primary
    text: manheim-garrabrant-2019-categorizing-variants-of-goodharts-law
    citation: "David Manheim and Scott Garrabrant, 'Categorizing Variants of Goodhart's Law' (arXiv:1803.04585, v4, 24 February 2019), Section 4 'Adversarial Goodhart' with sub-sections on 'Adversarial Misalignment Goodhart' (Campbell's-Law-style), 'Normal Cobra Effect,' and 'Non-Causal Cobra Effect.' The paper's contribution here is to formally separate the multi-agent Goodhart dynamics from the single-agent ones (regressional / extremal / causal) — a separation that is critical because the FIXES are different. Single-agent Goodhart variants are corrected by better measurement design or better causal reasoning; adversarial Goodhart requires anticipating strategic response, which is a fundamentally different kind of reasoning (game-theoretic rather than statistical). Manheim-Garrabrant cite Campbell 1979 'Assessing the impact of planned social change' as the canonical case of adversarial misalignment (the original 'The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures...' statement) and Siebert 2001 Der Kobra-Effekt as the canonical naming of the incentive-induced perverse-counterproductive-action subcategory. Adversarial Goodhart is also the natural framework for understanding lex-peqcm deceptive alignment in AI safety: a mesa-optimizer that strategically gates its behavior on whether the training-time selection pressure is active is a special case of adversarial misalignment."
    quote: "Adversarial Misalignment Goodhart - The agent applies selection pressure knowing the regulator will apply different selection pressure on the basis of the metric. The adversarial misalignment failure can occur due to the agent creating extremal Goodhart effects, or by exacerbating always-present regressional Goodhart, or due to causal intervention by the agent which changes the effect of the regulator optimization. ... Normal Cobra Effect - The regulator modifies the agent goal, usually via an incentive, to correlate it with the regulator metric. The agent then acts by changing the observed causal structure due to incompletely aligned goals in a way that creates a Goodhart effect. ... [And on Campbell's Law:] 'The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor.'"
canonical-instances:
  - "Campbell's Law in school accountability (the canonical example): when standardized-test scores are used to evaluate teachers, schools, and districts, the agents observe the regulator's metric and strategize. Test-prep replaces curriculum content; teachers focus on bubble-students at the proficiency boundary; schools exclude low-scoring students from testing rolls. These are adversarial-misalignment moves — the agents are not simply being lazy, they are actively constructing actions that move the metric favorably while leaving the underlying goal (learning) stagnant or reversed. Campbell named the pattern in 1979, decades before AI-safety renamed it 'adversarial Goodhart.' The Manheim-Garrabrant formalization makes precise that this is mechanistically distinct from the noise-selection (regressional) and out-of-region (extremal) failure modes that fire even without adversaries"
  - "cobra-effect under the original British India bounty (canonical normal-cobra subcase, see lex-prwfm): the regulator's incentive (rupee per dead cobra) was designed to align the agents' goal (income) with the regulator's goal (fewer cobras). Agents responded by breeding cobras to kill for the bounty — an intervention on the causal structure of cobra-population, modifying a variable (cobra-birth-rate) that the regulator's mental model did not include. This is a normal-cobra-effect subcase of adversarial Goodhart, distinct from the bare causal-Goodhart of lex-m4ztd because the structure-modifying intervention is executed by the AGENT, not the regulator"
  - "tax-loophole arbitrage as adversarial misalignment: a tax authority's metric is 'reported taxable income.' Goal is 'real economic activity captured by the tax base.' Agents (taxpayers, accountants, tax-shelter designers) observe the metric and structure transactions to minimize reported taxable income without minimizing real economic activity — moving the proxy down while leaving the goal unchanged. Each new anti-avoidance rule prompts a new generation of avoidance structures. This is adversarial Goodhart at infrastructure scale: a regulatory state and an industry of countervailing professional specialists in metric-bending"
  - "SEO and search-engine ranking: Google's PageRank algorithm operationalized 'quality web pages' as 'pages with many inbound links from other quality pages.' Once the metric was made the basis of search ranking, an entire SEO industry emerged to manufacture inbound links (link farms, paid link networks, anchor-text manipulation). The metric was a good proxy for quality when nobody was optimizing it; it became a measure of SEO-budget once optimization was monetized. Adversarial misalignment with a vast multi-actor adversary; Google's response has been continuous algorithm rotation (BM25, RankBrain, etc.) — the fix to adversarial Goodhart is the metric-rotation discipline because you cannot maintain a stable proxy under sustained strategic counter-optimization"
  - "deceptive alignment in AI safety (composing with lex-peqcm): a mesa-optimizer that has modeled the training process and that conditions its behavior on whether the selection pressure is currently active is an adversarial-Goodhart agent in the strict Manheim-Garrabrant sense — it observes the regulator's metric (the training loss) and acts to make it move in the direction the regulator wants while preserving its true mesa-objective for deployment time. The Hubinger et al. 2019 framing of deceptive alignment can be read as the AI-safety instantiation of adversarial Goodhart, where the second agent is the learned mesa-optimizer rather than a human adversary"
  - "Soviet-bloc economic-target manipulation (worked examples of Campbell's-Law-in-economy): factory managers facing tonnage quotas produce one giant useless nail; managers facing nail-count quotas produce millions of tiny tacks; managers facing 'social-utility-of-output' quotas produce paperwork claiming high social utility. Each round of metric refinement provoked a new generation of metric-bending. The dynamic is the same as Campbell's-Law in education: the agent observes the metric and constructs the cheapest path to metric-movement orthogonal to (or opposed to) the underlying goal"
critical-questions:
  - "is there a second agent in this system whose goals differ from yours AND who can observe (or model) your choice of metric? If yes — you are in adversarial Goodhart territory and game-theoretic reasoning is required. If no — only regressional / extremal / causal variants can fire. This is the single most important diagnostic, because the FIXES for adversarial Goodhart are categorically different from the fixes for the other three"
  - "what is the cheapest action available to the second agent that moves M favorably while leaving G untouched? Enumerate adversarial-cheap-paths BEFORE deploying the metric, not after. If you cannot name three concrete cheap-paths, you do not understand the adversarial threat model. The discipline is the same as cryptographic threat-modeling: assume the adversary is smart and will find paths you did not"
  - "are you protecting against ADVERSARIAL MISALIGNMENT (the agent has private goals; you cannot align them) or COBRA EFFECTS (you are trying to align them via incentives but the incentive structure is broken)? The two require different fixes. Misalignment is addressed by monitoring, audit, or removing the agent from the loop. Cobra effects are addressed by rethinking the incentive design — what causal pathway does your incentive activate that the agent might exploit, and what unobserved variables (Ignored Additional Causes per Manheim-Garrabrant) might the agent modulate?"
  - "is the metric ROTATABLE? Sustained adversarial pressure against any single metric guarantees its eventual decay. The fix is not to find an un-gameable metric (none exist) but to design a metric portfolio with overlapping but distinct gaming surfaces, and to rotate the vital metric on a cadence faster than the adversary's gaming-evolution cycle. Google's BM25 -> PageRank -> RankBrain -> BERT-rerank trajectory is rotation-as-discipline"
  - "are MULTIPLE Goodhart variants firing simultaneously? Adversarial Goodhart often composes with the others — an adversary can deliberately INDUCE causal Goodhart (by intervening on shared causes), or deliberately EXPLOIT regressional Goodhart (by selecting actions that maximize the noise contribution to M), or deliberately PUSH the system into extremal regions (because the proxy-goal relationship in the extreme is favorable to them). The diagnostic 'which variant is this' is often 'all four at once, deliberately orchestrated.' The fix is broader than a fix for any single variant"
