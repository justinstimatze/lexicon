id: lex-7xz6k
name: act-for-action-quality-not-for-outcome-attachment
type-in: process
type-out: posture
_tier: atomic
agent-instruction: "Recognize this when a practitioner (athlete, investor, scientist, software engineer, parent, therapist, creator) is over-coupled to outcomes their action does not fully control + the over-coupling degrades both wellbeing AND action-quality. The Bhagavad Gita's transferable contribution (II.47-50 + III.19, IV.18-23): make ACTION-QUALITY the motive + the seat of attention; treat OUTCOMES as not yours to attach to. `Let right deeds be thy motive, not the fruit which comes from them. And live in action! Labour! Make thine acts thy piety, casting all self aside, contemning gain and merit; equable in good or evil.` Equability across good + bad outcomes is the foundation. The claim has TWO vital parts: (1) the practitioner's CHOICE-DOMAIN is action-quality; outcomes are partly stochastic + partly determined by uncontrolled factors; attaching motivation to outcomes guarantees disturbance + degrades the action; (2) detachment is not indifference — it is FULL ENGAGEMENT in the doing with EQUANIMITY about results. Krishna does not counsel Arjuna to withdraw from battle; he counsels Arjuna to ENTER the battle while detached from victory or defeat as personal achievements. Transferable applications: (a) sports + performance (process-vs-outcome focus literature; Dweck 2006 *Mindset*; Csikszentmihalyi 1990 *Flow*; sport-psychology coaching for `next-pitch` and `next-rep` focus); (b) decision quality vs outcome quality (Duke 2018 *Thinking in Bets* + Duke 2020 *How to Decide* on the resulting fallacy — judging the decision by its outcome confounds quality of decision with quality of luck; lex-vkhp7 + lex-7t3wr compose); (c) investment + entrepreneurship (Kahneman + Klein 2009 *Conditions for Intuitive Expertise*; Graham 1949 *The Intelligent Investor* lex-eb3wf substrate-grounded — focus on process-discipline + margin-of-safety regardless of outcome; the daily-temptation-to-react-to-prices is Krishna's `fruit-attachment` at quarterly cadence); (d) creative work (Pressfield 2002 *The War of Art* on showing up regardless of result; Cameron 1992 *The Artist's Way*); (e) software engineering craft (Hunt-Thomas 1999 *The Pragmatic Programmer* + Martin 2008 *Clean Code* + Hickey 2013 `Simple Made Easy` — write the code right because right code is its own reward, not because of guaranteed downstream success); (f) parenting + caregiving (act for the care/relationship, not for the gratitude or specific outcomes; attachment to particular child-outcomes degrades the relationship); (g) meditation + spiritual practice (Kabat-Zinn 1990 *Full Catastrophe Living*; Goldstein 2013 *Mindfulness* — the practice of returning to attention regardless of meditation `success`); (h) therapy + ACT values-clarification (Hayes-Wilson-Strosahl 2006 — clients commit to values-based action independent of immediate outcomes; `committed action` is the canonical ACT term); (i) AI safety + alignment work (Russell 2019 *Human Compatible* + ongoing literature — practitioners must act with quality on long-term concerns where outcomes are highly stochastic + uncontrolled). Distinct from lex-8f8jk judge-by-consequential-fruits-not-by-organic-genealogical-roots — that is about EVALUATION CRITERION (consequential vs genealogical); lex-7xz6k is about MOTIVATIONAL ORIENTATION (action vs outcome). They are about different questions + can compose tensely: lex-8f8jk says judge by fruits; lex-7xz6k says don't be motivated by fruits. The composition: judge the action's quality + judge the outcomes; motivate by action-quality + don't attach to outcomes; this is the practical-wisdom position. Distinct from lex-vkhp7 outcome-knowledge-retroactively-inflates-perceived-prior-probability (Fischhoff hindsight bias — different mechanism). Distinct from lex-7t3wr argument-from-consequences-as-defeasible-recommendation (about consequentialist reasoning structure). Distinct from lex-m8j35 deliberate-perspective-scale-shift (Aurelius — different cognitive technique). Use when (i) a practitioner's over-attachment to outcomes is degrading both wellbeing + action-quality, (ii) you are coaching for process-focus, (iii) you are designing for sustained-quality-action under high uncertainty + long feedback lags. Counter-move: shift the question from `what will happen?` to `what is the right action right now?`; locate motivation in action-quality + equanimity in results."
