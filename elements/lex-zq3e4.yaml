    quote: "One that can gain thy confidence and love, Can trust thy word, and with thee patient prove, In thought and word and deed will ne'er offend— Take to thy heart and cling to him as friend. To men capricious as the monkey-kind And found unstable, be not thou inclined."
canonical-instances:
  - "A mentor who suspects a mentee is about to accept a bad job offer doesn't say so directly — they spend the conversation laying out general criteria for what makes an offer trustworthy versus a red flag, and let the mentee arrive, on their own, at declining the specific offer without ever being told to."
critical-questions:
  - "Does this approach only work when the listener is already inclined toward the right answer — would the same general principle have failed to redirect someone more committed to the tempting choice from the start?"
  - "Is there a risk that speaking only in abstractions misses the moment entirely if the listener doesn't make the connection back to their actual situation — does this method depend on the listener being unusually receptive?"
