id: lex-hapcz
name: an-audience-member-repudiates-the-spectacle-while-still-attending-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A powerful person watching an exploitative commercial display can tell the exploited performers directly, to their faces, that she would not permit this arrangement if she had authority over them -- criticizing the spectacle's own premise while she is currently attending and benefiting from it, without taking any action to change her own relationship to watching it. Meeting Black Elk's delegation at her own request, Queen Victoria tells them plainly: 'If you belonged to me, I would not let them take you around in a show like this.' She says this as the show's guest of honor, having just watched them perform for her entertainment, and then 'she got into one of them and they all went away' -- the criticism spoken, the show continuing, her own attendance unchanged by the words she'd just said."
related: []
evokes: [black-elk-speaks, across-the-big-water, grandmother-england, i-would-not-let-them-take-you-around, criticism-spoken-attendance-unchanged]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch19-across-big-water
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 19, 'Across the Big Water.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "She said something like this: 'I am sixty-seven years old. All over the world I have seen all kinds of people; but to-day I have seen the best-looking people I know. If you belonged to me, I would not let them take you around in a show like this.' She said other good things too, and then she said we must come to see her, because she had come to see us. She shook hands with all of us."
canonical-instances:
  - "A celebrity guest at a factory-farm-adjacent charity gala tells the workers privately that the industry's labor conditions are shameful, then returns to her seat at the head table for the rest of the evening's fundraiser."
  - "A visiting dignitary touring a foreign sweatshop that manufactures goods for her own country's market tells the workers directly that no one should be treated this way, then boards her flight home having changed nothing about her country's continued purchasing."
  - "A wealthy donor at a for-profit nursing home tells an underpaid caregiver that the facility's staffing levels are unconscionable, then writes a check to the facility's fundraiser before leaving."
critical-questions:
  - "Does Queen Victoria's statement actually cost her anything, socially or politically, given that she says it privately to the performers rather than publicly to the show's organizers or to her own government?"
  - "Is there a meaningful difference between genuine sympathy expressed with no intention of acting on it and calculated flattery meant to make a marginalized audience feel valued, and can the performers themselves, or a later reader, actually tell which one this was?"
  - "Black Elk records the moment warmly, without visible resentment at the gap between her words and her inaction -- does his own reception of the comment suggest the words carried real value for him regardless of whether anything changed, or does his account simply not dwell on the contradiction?"
status: active
