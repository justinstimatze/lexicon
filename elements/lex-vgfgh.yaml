lineage:
  - source: primary
    tradition: pearl-causal-inference
    text: pearl-2009-causality
    citation: "Judea Pearl, Causality: Models, Reasoning, and Inference (2nd ed., Cambridge University Press, 2009), Preface to the Second Edition."
    quote: "I now take causal relationships to be the fundamental building blocks both of physical reality and of human understanding of that reality, and I regard probabilistic relationships as but the surface phenomena of the causal machinery that underlies and propels our understanding of the world. […] In the last decade, owing partly to advances in graphical models, causality has undergone a major transformation: from a concept shrouded in mystery into a mathematical object with well-defined semantics and well-founded logic. Paradoxes and controversies have been resolved, slippery concepts have been explicated, and practical problems relying on causal information that long were regarded as either metaphysical or unmanageable can now be solved using elementary mathematics. Put simply, causality has been mathematized."
  - source: primary
    tradition: pearl-causal-inference
    text: pearl-2009-causality
    citation: "Judea Pearl, Causality: Models, Reasoning, and Inference (2nd ed., Cambridge University Press, 2009), Section 7.2 (on the supply-demand example illustrating the hierarchy)."
    quote: "[W]e recognize these queries as representing (respectively) actions, predictions, and counterfactuals – our three-level hierarchy. The second query, representing prediction, is standard in the literature and can be answered directly from the covariance matrix without reference to causality, structure, or invariance. The first and third queries rest on the structural properties of the equations and, as expected, are not treated in the standard literature of structural equations."
  - source: primary
    tradition: pearl-causal-inference
    text: pearl-2009-causality
    citation: "Judea Pearl, Causality: Models, Reasoning, and Inference (2nd ed., Cambridge University Press, 2009), Section 7.1.1, Definition 7.1.3 ('Effect of Action')."
    quote: "Let M be a causal model, X a set of variables in V, and x a particular realization of X. The effect of action do(X = x) on M is given by the submodel Mx. […] If we interpret each function fi in F as an independent physical mechanism and define do(X = x) as the simplest manipulation of M that yields Mx, then Definition 7.1.3 stands as a mathematical translation of the atomic intervention 'X = x.'"
canonical-instances:
  - "Randomized controlled trial — directly samples P(Y | do(X)). The randomization replaces the natural assignment mechanism with a controlled coin-flip, instantiating the do-operator empirically."
  - "Observational study claiming a treatment effect from non-randomized data — typically claims to answer P(Y | do(X)) while actually computing P(Y | X). Valid only under additional structural assumptions (no unobserved confounders, instrumental variables, regression-discontinuity, back-door criterion satisfied, etc.). The hierarchy makes the gap legible."
  - "Counterfactual statement 'if the patient had received treatment, they would have survived' — strictly level-3. Requires more than just data on treatment-survival rates; requires a structural model that can simulate the patient with their specific covariates under the alternative intervention."
  - "Recommender system trained on observational click data — learns P(click | shown). When deployed, the system is intervening — P(click | do(shown)) — and the two diverge unless the original logging was random. Confusing the levels is the source of much production ML failure."
  - "Policy analysis as counterfactual reasoning — Pearl §7.2.1 argues policy questions are intrinsically counterfactual ('what would have happened under a different policy'). The Lucas critique in econometrics is essentially the same warning at the macroeconomic level."
  - "Software debugging — 'why did the request fail' can ask association (was X present), intervention (would changing X have prevented it), or counterfactual (would this specific failure not have occurred). Diagnosis often confuses the levels; fixing observational correlation does not always survive deployment."
  - "Personal causal inference — 'I'm doing X and Y happened' (association) vs 'if I do more of X, Y will happen' (intervention) vs 'if I had done X yesterday, Y wouldn't have happened' (counterfactual). The cognitive slide between these is the transferable failure mode."
  - "The retrospective-voting / blind-retrospection dynamic (lex-cpq3s) — voters intend a counterfactual ('would my welfare have been different under the other party') but compute an association ('my welfare changed during this term'); the level-slide is the structural pathology."
