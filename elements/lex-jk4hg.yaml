id: lex-jk4hg
name: a-claimants-track-record-substitutes-for-an-explained-mechanism
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A trusted figure can act on someone's unexplained hunch or premonition without requiring them to explain how they know, because the claimant's recent, dramatic track record already established enough credibility that the mechanism doesn't need to be spelled out. Scouting deer with his father, Black Elk says, without knowing why he said it, 'No, father, stay here; for they are bringing them to us.' His father presses once -- 'Who is bringing them?' -- and gets nothing back: 'I could not answer.' A man who had recently watched his son recover from a near-fatal illness that the whole camp still talked about doesn't need the mechanism explained. He looks hard at the boy a second time, then simply says 'All right, son,' and they wait. The deer come."
related: []
evokes: [black-elk-speaks, they-are-bringing-them-to-us, i-could-not-answer, all-right-son, unexplained-hunch-acted-on]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch5-at-the-soldiers-town
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 5, 'At the Soldiers' Town.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Then the queer feeling came back, and I said without knowing why I said it: 'No, father, stay here; for they are bringing them to us.' He looked at me hard, and said: 'Who is bringing them?' I could not answer; and after he had looked hard at me again, he said: 'All right, son.' So we lay down there in the grass and waited. They did come to us, and my father got two of them."
canonical-instances:
  - "A veteran detective's rookie partner says a suspect is lying but can't articulate why; the detective, having watched the rookie's gut instinct pay off twice already this month, follows the hunch anyway without demanding an explanation."
  - "A surgeon delays a procedure because a senior nurse says something feels wrong about the patient, with no specific finding offered; that nurse's unnamed hunches have panned out twice already this year."
  - "An investor backs a founder's sudden pivot with no clear rationale given, because that same founder's previous unexplained pivot, also taken purely on trust, produced the company's only real success to date."
critical-questions:
  - "Does deferring to an unexplained claim on the strength of past performance actually track a real, if inarticulate, competence, or does it just reward whoever's most recent success happened to be the most dramatic and memorable?"
  - "Black Elk's father asks 'who is bringing them' exactly once and stops -- would a second or third press have gotten a different answer, or was the boy's silence a genuine inability to explain rather than a refusal to?"
  - "What happens the first time a track-record-backed hunch turns out wrong -- does the trust built by prior accuracy survive one failure, or does an unexplained claim need to keep succeeding indefinitely to keep being acted on without question?"
status: active
