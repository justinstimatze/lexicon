id: lex-7h6w8
name: an-unimproving-forced-relationship-recasts-the-other-as-deviant
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a professional is locked into an extended relationship with a case that is not improving, and has no ability to exit or transfer it, watch for a specific drift in how they narrate the other party — not a sudden judgment, but a slow, one-directional slide from sympathetic to adversarial framing as the weeks of non-improvement accumulate. Martin reproduces this arc verbatim from a fourth-year student's diary tracking the same outpatient over ten weeks. Week one, sympathetic: '[My patient] is a woman who has been followed for several months with globus hystericus. She is still bothered by this, but has noted some improvement in the frequency of attacks and feels that she is improving.' By the sixth week the framing has curdled into irritation and a moral verdict on her character rather than her condition: 'This woman is beginning to get on my nerves. She is a chronic complainer and in some instances shows very poor judgment in her relationships with her husband.' By the seventh week the student names his own urge to say something punitive: 'I really have difficulty at times restraining myself from telling this woman that she''s far too concerned with herself, and in no uncertain terms.' Martin's summary of the arc names both halves of what eroded together: 'By the time ten weeks had elapsed, this student was motivated to end the relationship with his patient. In the interim, he had become increasingly pessimistic about the prospect of bringing about marked improvement in the patient, he had been confronted by what seemed to him a never-ending stream of bodily complaints, and he had found himself faced with the serious problem of controlling his own affect. The student's detachment and confidence seem to have been closely interrelated in the gradual unfolding of this case; as the patient failed to conform to the normative expectations of the student-physician, both detachment and confidence diminished.' Note what did NOT happen: the student never concluded his own approach, technique, or expectations for the case were wrong — the case's failure to improve was relocated onto the patient's character ('chronic complainer,' 'poor judgment,' 'far too concerned with herself') rather than onto the treatment or the treater. Diagnostic move: in any forced, extended, low-exit-option professional relationship that is not producing the hoped-for outcome (a case manager and a non-compliant client, a teacher and a struggling student they can't reassign, a manager and an underperforming report they can't easily transfer), expect the failure's meaning to migrate toward 'this person is the problem' well before it migrates toward 'my approach or my expectations need revising' — and build in an external check (supervision, peer consultation, a scheduled case review) specifically because the person living inside the drift is the least likely to notice it happening to their own framing."
