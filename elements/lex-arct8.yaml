id: lex-arct8
name: transitional-self-image-tracks-perceived-status-per-relationship
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: 'When someone is partway through a status transition (student to professional, trainee to expert, newcomer to member), do not expect their self-image to flip as one global switch applied uniformly across every relationship they are in. Check instead whether the self-attribution is locally indexed to each relationship separately, tracking what the person believes that specific partner currently assigns them — so the same person can hold several different self-definitions at once, each locally correct for a different audience. Huntington finds this directly in first-year medical students: almost none thought of themselves as doctors around faculty or classmates, more did around nurses, and by far the most did around patients — the same students, at the same point in training, holding markedly different self-images depending on who they were with. She states the mechanism plainly: ''Because they find themselves in situations calling for widely disparate attitudes and behavior, students at any one stage in their training tend to think of themselves now as students, now as physicians, as they work in diverse social contexts.'' And: ''The first-year student who thought of himself as a doctor while in contact with his instructors or classmates is clearly the rare exception. The tendency is somewhat more common in relation to nurses, and most marked in connection with patients.'' Critically, the variation is not noise — it tracks the perceived expectation of each specific role-partner: ''The second column in Table 21 suggests one explanation of the \"unstable\" self-image held by students at a single point in their medical training, for there is a consonance between the status that students believe others in their role set assign them and the status to which students assign themselves.'' This is distinct from role-set itself (a-single-status-carries-multiple-conflicting-role-relationships, lex-4gxu9), which explains why a status-occupant faces conflicting external DEMANDS from different role-partners; this atom is the further claim that the person''s own SELF-CONCEPT partitions to match, relationship by relationship, rather than resolving into one fixed self-image or averaging across partners. It is also distinct from a deliberate, designed status grant (premature-peer-framing-accelerates-professional-identity-formation, lex-k2gnb), where an institution confers a title early on purpose; here the variation is organic, emerging from ordinary differences in what each role-partner already happens to expect. Diagnostic move: when someone''s self-concept looks inconsistent or ''unstable'' across contexts, first check whether it is actually well-organized — matched, relationship by relationship, to what each interaction partner is believed to expect — before treating the inconsistency itself as the finding.'
