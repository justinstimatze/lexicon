id: lex-rgr3t
name: habit-formation-frees-attention-for-higher-order-work
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When skill acquisition matters, build the habit until execution requires no attention. Habit-formation frees attention for higher-order work; you can't do creative work on top of effortful basics. Pay the habituation cost upfront for the attention dividend."
