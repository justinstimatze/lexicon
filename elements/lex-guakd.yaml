id: lex-guakd
name: declining-a-volunteer-substitute-because-only-the-original-has-the-deterrent-trait
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone volunteers to take on a dangerous task in another's place out of care or duty, the offer can still be refused for a reason that has nothing to do with the substitute's competence or willingness: the original's deterrent effect may depend on a specific attribute — size, reputation, visible standing — that the substitute doesn't yet possess. Swapping in the substitute wouldn't just risk the substitute; it would remove the very thing that was keeping the threat passive. In the Jataka's tale, the young tortoise offers to face the men who plan to kill his father in his place: \"Here at thy ease remain, O father mine, / And I thy son will do this task of thine.\" The father accepts the sentiment but declines the substitution on a specific, stated ground — his own bulk is doing deterrent work the son's cannot yet do: \"Yet they may leave the Hawk's young brood alone, / Perchance, if they see me so fully grown.\""
related: []
evokes: [jataka, pakinnakanipata, maha-ukkusa-jataka, deterrence-depends-on-a-specific-trait-not-general-willingness, refusing-a-well-meant-substitute]
lineage:
