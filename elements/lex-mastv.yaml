id: lex-mastv
name: divestment-severs-the-transferable-competence-not-just-the-product
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Exiting a mature end-product market is not one decision but two, and organizations routinely make both without noticing they've made the second: deciding a specific product no longer justifies investment, and — as an unintended side effect of leaving the market entirely — destroying the more general, transferable capability that produced it, a capability that could have gone on to power products nobody has imagined yet. Prahalad and Hamel's 1990 analysis names the conflation directly, using the U.S. exit from color television as the case: 'In ridding themselves of their television businesses, these companies failed to distinguish between divesting the business and destroying their video media-based competencies. They not only got out of the TV business but they also closed the door on a whole stream of future opportunities reliant on video-based competencies. The television industry, considered by many U.S. companies in the 1970s to be unattractive, is today the focus of a fierce public policy debate about the inability of U.S. corporations to benefit from the $20-billion-a-year opportunity that HDTV will represent in the mid- to late 1990s. Ironically, the U.S. government is being asked to fund a massive research project — in effect, to compensate U.S. companies for their failure to preserve critical core competencies when they had the chance.' Their contrast case is instructive: Sony scaled back its VCR business after the Betamax defeat, but kept investing in the underlying videotape-recording competence — and that preserved competence, not the abandoned product line, is what let it compete in 8mm camcorders afterward. The two decisions look identical from a P&L standpoint (both show 'exit this business'), but only one of them is reversible in its consequences: a product can always be re-entered later if the capability that made it still exists, but a destroyed capability cannot be un-destroyed by re-entering the product category, because competencies are 'built through a process of continuous improvement and enhancement that may span a decade or longer.' Generalize beyond television sets: a company shutting down an underperforming internal tool disbands the engineering team that understood a whole class of infrastructure problems, not just retiring one dashboard; a hospital that closes an unprofitable specialty department loses the clinical expertise that could have staffed an adjacent, newly profitable specialty five years later; a publisher that discontinues a low-selling imprint lays off the editors whose acquired genre-expertise was the actual asset, not the specific backlist titles. The diagnostic move: before exiting any business, product, or unit, ask explicitly whether the exit decision and the competence-destruction decision are actually the same decision — and if a competence worth preserving is entangled in the thing being cut, find a way to keep the capability (redeploy the team, license the technology, retain a skeleton unit) even while exiting the specific product."
