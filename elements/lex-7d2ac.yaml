id: lex-7d2ac
name: naming-a-behavior-rational-forecloses-asking-if-it-is
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a field names a specific pattern of behavior after a general virtue -- calling self-interested maximization 'rational choice,' say -- check whether the name is doing argumentative work that evidence should be doing instead. Sen: “The approach has been an integral component of what goes by the name of 'rational choice theory', which makes the self-interest approach rational by definition -- a kind of conquest by nomenclature. By giving the name 'rational choice' to some specific kind of behaviour there is an implicit attempt to avoid any disputation on whether that kind of behaviour can actually be seen as rational. It rides roughshod over the fact that the long-used term 'rationality' has antecedent meanings -- or at least established associations -- which cannot be erased merely by a new definition.” Once self-interest maximization owns the label 'rational,' anyone who deviates from it -- acting out of altruism, reciprocity, or rule-following -- has been redefined as irrational before any behavior is even observed, without a shred of evidence entering the argument. Diagnostic move: when a specific, contestable behavior pattern has been given the name of a general virtue (rational, efficient, natural, healthy), ask whether the case for that behavior rests on the name or on an argument you could state without it. If the name is carrying weight the argument hasn't earned, the field has settled by relabeling what should have stayed open to dispute."
