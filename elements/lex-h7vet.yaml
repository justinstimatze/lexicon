id: lex-h7vet
name: depart-trial-return-arc
type-in: state
type-out: state
_tier: molecule
agent-instruction: "When narrating change, surface the depart-trial-return three-beat — what was left behind, what was endured, what was carried back; missing any of the three suggests the arc is incomplete or repressed."
related: [lex-5ckqz, lex-da3g3, lex-hng49, lex-ppq72, lex-utuy6, lex-uz7g4, lex-zgmyw]
scaffolds-from: [lex-utuy6, lex-ppq72, lex-hng49, lex-zgmyw, lex-uz7g4, lex-da3g3]
evokes: [the-monomyth, the-heros-journey, the-bildungsroman-shape, depart-be-tested-return-changed, the-developmental-arc]
decomposes-into:
  - lex-utuy6
  - lex-ppq72
  - lex-hng49
  - lex-zgmyw
  - lex-uz7g4
assembly: "sequential(lex-utuy6, iteration(lex-zgmyw), lex-ppq72)"
premises:
  - The protagonist begins in a stable but limited initial state (everyday world)
  - Some call/event surfaces a domain the protagonist must enter; crossing requires a readiness-gate (lex-utuy6)
  - "Once across, the protagonist undergoes ITERATED trials. The constitutive iteration body is lex-zgmyw stress-reveals-latent-structure (always present per trial — Propp's function-25-26 difficult-task-and-its-resolution). lex-hng49 mentor-as-scaffolded-transmission is an INTERMITTENT participant (Propp's function-14 donor; Schon's scaffolder) — present when the protagonist needs scaffold, absent when they self-correct. Named in decomposes-into and related as a co-occurring archetypal figure; not in the iteration body because intermittent participants don't belong in fixed-point iteration"
  - lex-uz7g4 archetypes-as-projective-shorthand applies to the figures inhabiting the arc (mentor, threshold-guardian, trickster-companion, shadow-antagonist) for audience pattern-recognition; named in decomposes-into, not in the typed assembly because the archetypal-projection is audience-side, not protagonist-side
  - The arc terminates with a descent-and-return (lex-ppq72) where the deepest transformation occurs and the protagonist returns to the everyday world materially changed (carrying a 'boon' / new capability / new identity)
critical-questions:
  - is the arc actually present, or are you imposing it on phenomena that don't have it? Campbell was criticized for over-fitting his 17-stage monomyth onto traditions where it doesn't actually appear; the abstract shape (depart-trial-return) attests broadly but the specific stage-sequence does not
  - does the protagonist actually return CHANGED, or does the arc just terminate? An arc that ends with the protagonist back where they started and unchanged is not the depart-trial-return shape; it's a bounded adventure. The transformation IS the essential element
  - is the iteration through trials genuine, or is it just one trial dressed up? The molecule's iteration() composition operation marks that the trials phase is structurally ITERATED — Propp's morphology has multiple-trial structure; Campbell's monomyth has multiple-trial structure; bildungsroman has multiple-trial structure. Single-trial 'arcs' are simpler shapes
  - is the protagonist's ARC actually present, or is the change happening to the WORLD via the protagonist? Some narratives have a static protagonist whose actions transform the world (some action-heroes); these are not depart-trial-return arcs (no transformation of protagonist) even though they have departure-and-return structure
lineage:
  - source: primary
    text: homer-odyssey-c750-bce
    citation: "Homer, Odyssey (composed orally c. 8th c. BCE; canonical Greek text fixed by Alexandrian editors 3rd c. BCE). The canonical depart-trial-return arc — its proem (Book I lines 1-10) states the arc in compressed form. (William Cullen Bryant trans. 1871; Standard Ebooks edition of the Bryant translation). The Bryant translation is one of the canonical 19th-c. English Homers (alongside Pope 1725, Cowper 1791, Butler 1900). Books 1 (departure-frame), 9-12 (iterated trials: Polyphemus, Lotus-eaters, Aeolus, Laestrygonians, Circe, Hades-katabasis Book 11, Sirens, Scylla/Charybdis, Helios's cattle), 23 (recognition by Penelope), 24 (recognition by Laertes; arc terminates) — collectively instantiate the abstract three-act shape (depart / iterated-trials / return-transformed) the atom names."
    quote: "[Homer, Odyssey Book I lines 1-10, Bryant trans., Standard Ebooks edition:] 'Tell me, O Muse, of that sagacious man / Who, having overthrown the sacred town / Of Ilium, wandered far and visited / The capitals of many nations, learned / The customs of their dwellers, and endured / Great suffering on the deep: his life was oft / In peril, as he labored to bring back / His comrades to their homes. He saved them not, / Though earnestly he strove; they perished all, / Through their own folly; for they banqueted, / Madmen! upon the oxen of the Sun— / The all-o'erlooking Sun, who cut them off / From their return. O goddess, virgin-child / Of Jove, relate some part of this to me.' [The proem instantiates the arc-shape: depart (Ilium-overthrow), iterated trials (wandered far, many nations, great suffering, perils), the return as the foundational stake (the goal that organizes the whole; the failed companions who perish through folly mark the discriminator — the arc requires return-transformed, and those who can't transform don't return).]"
  - source: practitioner
    text: campbell-1949-hero-with-thousand-faces
    citation: "Joseph Campbell, The Hero with a Thousand Faces (Pantheon Books / Bollingen Series XVII 1949; 2nd ed. Princeton UP 1968; 3rd ed. New World Library 2008). Canonical theoretical-secondary statement of the monomyth: Departure (Call/Refusal/Mentor/Threshold/Belly-of-Whale), Initiation (Trials/Goddess/Atonement/Apotheosis/Boon), Return (Refusal/Magic-Flight/Threshold-Return/Master-of-Two-Worlds). The 17 stages have been criticized for over-generalizing; the abstract three-act shape (depart, trial-iterated, return-transformed) is more defensible. Tier-3 deepening source; provides the theoretical articulation that names the cross-cultural pattern Homer instantiates. The atom's decisive claim now rests on the Homer verbatim above; Campbell's monomyth articulation gives the cross-cultural deepening but is not gating."
    quote: "[Tier-3 deepening source; the indispensable instance is now the Odyssey Book I proem (entry above). Campbell's contribution is the theoretical generalization (depart-trial-return as cross-cultural pattern, not Greek-only); the substrate atom is the abstract shape Campbell named grounded in Homer.]"
  - source: practitioner
    text: propp-1928-morphology-of-the-folktale
    citation: "Vladimir Propp, Morphology of the Folktale (Russian 1928; English 1968 University of Texas Press, trans. Laurence Scott, ed. Louis A. Wagner). 31 narratorial functions identified through analysis of 100 Russian folktales from the Afanas'ev collection; the multi-trial structure (functions 25-26 'difficult task' and 'resolution') as crucial empirical finding — the hero faces multiple difficult-tasks not a single one. Tier-3 deepening source; provides the iteration composition's empirical support (the trials-phase is structurally iterated, not stylistically). Cross-cultural extension of Propp's specific 31-function sequence is contested; the within-corpus iteration finding is robust and is what this atom's assembly: sequential(lex-utuy6, iteration(lex-zgmyw), lex-ppq72) deploys."
    quote: "[Tier-3 deepening source; the iteration composition operation in this atom's assembly draws on Propp's empirical finding that functions 25-26 (difficult-task / its-resolution) are structurally iterated. The Odyssey's nine-episode trial sequence (Books 9-12) is the canonical Greek instance of this iteration; Propp's Russian-folktale corpus established the cross-corpus structural finding.]"
canonical-instances:
  - "Odyssey (Homer ~750 BCE): Odysseus departs Troy → multiple trials (Cyclops, Sirens, Scylla and Charybdis, Calypso, etc. — note the ITERATION; not a single trial) → underworld descent (Book XI; lex-ppq72 instance) → return to Ithaca → recognition by Penelope and Telemachus (lex-zgmyw anagnorisis instances) → re-establishes household. Canonical Western instance"
  - "Wilhelm Meister's Apprenticeship (Goethe 1796): the bildungsroman that gave the genre its name; Wilhelm departs middle-class trade → iterated trials in theater life → eventual integration into a wiser community → returns transformed. The arc is internal-developmental rather than external-adventure but the structural shape is identical"
  - "engineering career arc per Will Larson Staff Engineer (2021): the L4-to-L6 transition is structurally a depart-trial-return arc — depart from comfortable hands-on-coding (call) → trial-by-cross-team-projects (iteration) → develop staff-level judgment (transformation) → return to coaching/scaffolding for newer engineers (the boon). Documented across many tech companies as a recognizable career-stage transition"
  - "bodhisattva path in Mahayana Buddhism: bodhicitta-arising (call to liberate all beings) → paramita-practice (iterated cultivation of generosity, ethics, patience, energy, concentration, wisdom across many lifetimes) → bhumi-attainment (the ten stages) → buddhahood with continued teaching engagement (the return-with-boon). The structural arc was articulated by ~6th century CE; recognized as developmental shape independent of narrative deployment"
  - "Star Wars original trilogy (1977-1983): Luke departs Tatooine farming → trials (Death Star battle, Dagobah training including descent-cave lex-ppq72 instance, Bespin confrontation, recognition of Vader-as-father lex-zgmyw anagnorisis instance, redemption of father) → returns to Endor as Jedi Knight (transformation complete). Often cited as canonical modern instance of Campbell's monomyth (Lucas explicitly designed it from Campbell's framework)"
  - "operationally distinct from lex-ppq72 descent-and-return as standalone atom: lex-ppq72 is a single move (drop, retrieve, return); the depart-trial-return arc is a longer composition that may CONTAIN a descent-and-return as one of its stages but is not reducible to it. The arc requires iterated trials BEFORE the climactic descent"
  - "operationally a composition USING lex-uz7g4 archetype-as-projective-shorthand: the figures who inhabit the arc (mentor, threshold-guardian, trickster, shadow, goddess) are archetypes-as-handles for the audience's recognition; the arc deploys archetypes as part of its operational shape, not separately"
  - "cardinal critical question: cross-cultural universality of the SPECIFIC sequence is contested; cross-cultural attestation of the ABSTRACT shape (depart-trial-return-changed) is robust. Be specific about which level you're claiming: 'the monomyth's 17 stages are universal' is contested; 'characters often depart, face iterated challenges, and return transformed' is well-supported. The library entry claims the abstract shape, not the 17-stage articulation"
status: active
