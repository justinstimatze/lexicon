id: lex-pp9c8
name: prediction-requires-extending-concepts-past-where-theyve-been-checked
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Feynman takes on a specific operationalist argument that quantum mechanics seemed to license: since position and momentum can't both be measured precisely, 'unless a thing can be defined by measurement, it has no place in a theory,' so the classical idea of an electron's exact position should be struck from physics entirely. He rejects the inference, not the premise: 'Just because we cannot measure position and momentum precisely does not a priori mean that we cannot talk about them. It only means that we need not talk about them.' He then names what purging every unmeasured concept would actually cost: 'It is not true that we can pursue science completely by using only those concepts which are directly subject to experiment... We must extrapolate the experiments to a region where they have not been done. We must take our concepts and extend them to places where they have not yet been checked. If we do not do that, we have no prediction... We do not know where we are \"stupid\" until we \"stick our neck out,\" and so the whole idea is to put our neck out.' His own case in point: classical physicists who assumed a baseball's notion of exact position also applied to an electron 'were not stupid' for doing it -- extending a checked concept into unchecked territory is how a prediction gets made at all, and the extension is exactly the move that later lets you discover you were wrong. Transferable structure: requiring every concept inside a model to be independently, directly verifiable before it earns a place there looks rigorous on its face. Enforced strictly, it quietly disables the one thing the model exists to do: produce a claim about a case nobody has checked yet. Whether the concept is an electron's position between measurements, a variable in an economic model no one can directly observe, or an internal parameter in a machine-learning system inferred rather than measured, the question that actually matters isn't 'has this specific piece been independently confirmed' -- it's 'does the model's overall output get checked against reality, and do you know which of its unconfirmed pieces you're currently leaning on when it's wrong.'"
related: [lex-vmas8, lex-n3ayj]
