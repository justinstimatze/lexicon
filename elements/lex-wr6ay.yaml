  - source: primary
    text: appendix-c-1957-two-types-of-consistency
    citation: "Robert K. Merton, George G. Reader, and Patricia L. Kendall, eds., Appendix C, \"Note on Significance Tests,\" in The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.303 (editors' note credits Dr. James Coleman and Dr. Hanan C. Selvin with contributing to the formulation of some of these points)."
    quote: "'This is not to say, of course, that we have been indiscriminate in our presentation of statistical results. We have established criteria of significance for ourselves, even though these do not involve the usual and more familiar tests. Essentially, these criteria involve two related types of consistency.'"
  - source: primary
    text: appendix-c-1957-internal-consistency-criterion
    citation: "Merton, Reader, and Kendall, eds., Appendix C, \"Note on Significance Tests\" (1957), pp.303-304. The extraction interposes a running header ('Appendix C') directly between 'as' and 'they advance'; the quote below discloses that skip with an ellipsis at the exact interposition point."
    quote: "'The first criterion is that, to be considered significant, results must be internally consistent. That is, a finding with regard to one question is held to be valid only if it also holds true in connection with a closely related question. For example, we may find that, as ... they advance through medical school, students become increasingly likely to say that they want to know their patients only on a doctor-patient basis, and not also as friend to friend. We attach significance to this finding only when we uncover other evidence that preferences for such detached relations are progressively learned; if we find, for instance, that advanced students are more likely than their junior colleagues to say that it is important for the physician to control his affective reactions in the doctor-patient relationship.'"
  - source: primary
    text: appendix-c-1957-replicative-consistency-criterion
    citation: "Merton, Reader, and Kendall, eds., Appendix C, \"Note on Significance Tests\" (1957), p.304."
    quote: "'The second criterion is that results must be replicatively consistent if they are to be considered significant. That is, a finding in one group must also hold true in a second independent group, if the same general conditions prevail in both.'"
canonical-instances:
  - "A UX researcher analyzing session recordings from a non-random sample of power users can't run a formal significance test, but treats a finding as established only if it (a) coheres with a related finding about the same underlying frustration measured a different way, and (b) reappears when a second, independent batch of session recordings is reviewed."
  - "A historian studying a small, non-random set of surviving letters from a single community treats a claimed shift in attitude as established only if it shows up consistently across a related type of evidence from the same period (internal consistency) and also appears in the surviving records of a comparable, independent community (replicative consistency), rather than relying on any single document's apparent significance."
critical-questions:
  - "Do the two consistency criteria actually avoid smuggling back the assumptions they're meant to replace — does 'replicative consistency across independent groups' implicitly require the groups to function as something like independent samples, reintroducing a sampling-style assumption through the back door even while explicitly rejecting significance testing's random-sampling requirement?"
  - "What happens when internal and replicative consistency disagree — a finding coheres well with a related measure within one group but fails to replicate in a second group — does the framework have a principled way to adjudicate that conflict, or does it implicitly treat replicative consistency as the tie-breaker, which would make the internal-consistency criterion strictly weaker than it first appears?"
