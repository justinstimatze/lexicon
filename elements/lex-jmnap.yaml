id: lex-jmnap
name: capability-boundary-is-jagged-not-smooth
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When deploying or evaluating a new capability (an AI tool, a new hire, an automated process) across a set of tasks that all LOOK similarly difficult to the human assessing them, do not assume the capability's success rate degrades smoothly with apparent difficulty. The actual boundary between where the capability helps and where it hurts is JAGGED, not a clean line matched to human intuitions about task difficulty — two tasks a person would rate as equally hard can fall on opposite sides of it. Concretely: (1) treat a single success or failure as evidence about THAT task, not about the whole apparent-difficulty tier it belongs to; (2) test task-by-task rather than generalizing from a few spot-checks across a workflow; (3) remember the failure mode is not neutral — outside the frontier the tool doesn't just fail to help, deploying it there actively DEGRADES performance relative to not using it at all, so the cost of misjudging the boundary is asymmetric, not merely a missed opportunity."
related: [lex-36cbh, lex-66s4q]
evokes: [jagged-technological-frontier, jagged-frontier, ai-capability-boundary, dellacqua-mollick-2023, boston-consulting-group-experiment, task-level-heterogeneity, ai-assistance-can-degrade-performance, uneven-ai-impact]
lineage:
  - source: primary
    text: dellacqua-etal-2023-jagged-technological-frontier
    citation: "Fabrizio Dell'Acqua, Edward McFowland III, Ethan R. Mollick, Hila Lifshitz-Assaf, Katherine Kellogg, Saran Rajendran, Lisa Krayer, François Candelon, and Karim R. Lakhani, 'Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of Artificial Intelligence on Knowledge Worker Productivity and Quality,' Organization Science, Articles in Advance (2026), Harvard Business School Technology & Operations Mgt. Unit Working Paper No. 24-013. A randomized field experiment (758 consultants at Boston Consulting Group) testing GPT-4-assisted vs. unassisted performance across realistic consulting tasks. Free SSRN download (papers.ssrn.com/sol3/papers.cfm?abstract_id=4573321), surfaced via a discovery scan of SSRN's all-time top-100-downloads ranking (rank #24, 95k+ all-time downloads) — not the recency-biased 12-month ranking, where it also independently ranked #12. The transferable claim generalizes past this paper's specific AI/consulting setting: any capability whose boundary of competence is opaque, rapidly shifting, or non-obvious to the people deploying it (a new automated system, a junior hire's actual skill profile, a partially-reliable data source) exhibits the same jaggedness — apparent task-difficulty is a poor proxy for the tool's actual reliability on that specific task."
    quote: "We introduce and study the concept of a 'jagged technology frontier' to describe the uneven impact of artificial intelligence (AI) capabilities, where AI assistance improves performance for some tasks but worsens it for others, even within the same knowledge workflow and with a seemingly similar level of difficulty. ... AI assistance improves human performance only for tasks within current AI capabilities—within the jagged technological frontier—and worsens human performance outside of it. ... Because the capabilities of AI are rapidly evolving and poorly understood, it can be hard ex ante for knowledge workers to grasp exactly what the boundary of this frontier might be at a given moment in time."
canonical-instances:
  - "BCG consultants (the paper's own field experiment): two consulting tasks that appear equally 'hard' to a human consultant — e.g., idea generation vs. a business-analysis task requiring a specific interpretive judgment call — fall on opposite sides of GPT-4's actual competence boundary. Consultants who used AI on inside-the-frontier tasks saw large quality/speed gains; those who used it on an outside-the-frontier task (without realizing it was outside) produced measurably worse output than unassisted consultants."
  - "A junior hire or new automated pipeline: a manager assumes a new team member's or new tool's competence scales smoothly with a task's apparent difficulty ('they handled the easy client, so the hard client should just take longer'), when the actual gap is task-specific rather than difficulty-scaled — the new hire/tool may ace a nominally 'hard' task while quietly failing a nominally 'easy' one that happens to sit outside their actual competence."
  - "Legal/medical AI-assist deployment: a tool that reliably drafts boilerplate contract clauses (inside the frontier) may confidently generate a plausible-sounding but wrong citation or dosage recommendation on a superficially similar-looking task (outside the frontier) — the surface similarity of the two tasks to a human reviewer masks the underlying discontinuity in the tool's actual reliability."
critical-questions:
  - "Is this specific task confirmed to be inside the capability's demonstrated competence, or is that being inferred from the tool's performance on a DIFFERENT task that merely looks similarly difficult? The inference is exactly the failure mode this atom names."
  - "If the capability fails on this task, does it fail SAFE (visibly, with low confidence) or fail by confidently producing plausible-looking wrong output? The paper's finding that outside-the-frontier use actively degrades performance implies the latter is common — budget for detection cost, not just error cost."
  - "Is the frontier itself moving? A boundary mapped last month (which tasks are 'inside') may already be stale if the underlying capability has been updated — jaggedness compounds with drift, so a one-time capability audit is not a standing guarantee."
  - "Who is deciding where the frontier lies — the people actually using the capability task-by-task, or a policy set top-down based on a few spot-checked examples? The paper's design specifically tested realistic task-level heterogeneity; a coarse-grained policy ('use AI for all writing tasks') will misplace some tasks on the wrong side of a genuinely jagged boundary."
