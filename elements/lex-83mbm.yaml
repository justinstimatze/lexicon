id: lex-83mbm
name: reframing-vice-as-the-truer-form-of-the-targets-own-virtue
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Rather than attacking a target''s commitment to a value, a persuader argues the commitment as currently practiced is cheap or untested, and that a more advanced, genuine version of that same value requires abandoning the protective conditions that make it easy. This co-opts the target''s own value system as the argument for undoing it. In the Jataka''s tale of Haliddiraga, the maiden reframes the ascetic''s forest virtue as the lesser kind, village temptation as the truer test: "In lonesome forest one may well be pure, / ''Tis easy there temptation to endure; / But in a village with seductions rife, / Aman may rise to a far nobler life."'
related: []
evokes: [jataka, navanipata, haliddiraga-jataka, virtue-reframed-as-untested, co-opting-the-targets-own-values]
lineage:
  - source: primary
    text: jataka-chalmers1895-haliddiraga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IX (Navanipata), No. 435, Haliddiraga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "In lonesome forest one may well be pure, / ‘Tis easy there temptation to endure; / But in a village with seductions rife, / Aman may rise to a far nobler life."
canonical-instances:
  - "A cult recruiter tells a devout skeptic that real faith isn't proven by quiet churchgoing but by surrendering entirely to a group that tests it daily, reframing his caution as spiritual complacency rather than prudence."
critical-questions:
  - "If the reframe is sometimes true — some virtues genuinely are untested until pressured — how does a target tell a legitimate call to growth from this exact same rhetorical move used manipulatively?"
status: active
