lineage:
  - source: primary
    tradition: norenzayan-big-gods
    text: norenzayan-2013-big-gods
    citation: "Ara Norenzayan, Big Gods: How Religion Transformed Cooperation and Conflict (Princeton University Press, 2013), Eight Principles of Big Gods (front matter)."
    quote: "The entire argument in this book can be summarized in eight interrelated principles. 1. Watched people are nice people. 2. Religion is more in the situation than in the person. 3. Hell is stronger than heaven. 4. Trust people who trust in God. 5. Religious actions speak louder than words. 6. Unworshipped Gods are impotent Gods. 7. Big Gods for Big Groups. 8. Religious groups cooperate in order to compete."
  - source: primary
    tradition: norenzayan-big-gods
    text: norenzayan-2013-big-gods
    citation: "Ara Norenzayan, Big Gods: How Religion Transformed Cooperation and Conflict (Princeton University Press, 2013), Chapter 1 (organization of the book)."
    quote: "As the saying goes, 'watched people are nice people.' In chapter 2, I explore how our basic social intuitions to monitor others' reputations, and care about our own, makes people nice to each other. This lays the foundation to discuss how these social intuitions give rise to supernatural watchers. Chapters 2 and 3 explain the process by which people play nice when they think God is watching. If so, it follows that belief in supernatural watchers encourages nice behavior."
canonical-instances:
  - "Bateson-Nettle-Roberts (2006) honesty-box experiment — installing a picture of eyes above a workplace coffee-honesty-box tripled contributions vs a picture of flowers. The eyes themselves changed behavior even though no human was actually watching."
  - "The Eye of Horus / Eye of Providence / Buddha Eyes / Inca Viracocha — Norenzayan's Figure 2.1 shows independently-evolved watcher-iconography across civilizations as the visual signature of the supernatural-surveillance hypothesis."
  - "Hutterite agricultural colonies' sustained cooperation among hundreds — religious moralizing-god framework provides the visibility mechanism even where face-to-face monitoring is partial."
  - "eBay seller reputation scores enabling stranger-to-stranger trust commerce at scale — secular functional equivalent of Big Gods, in that every defection becomes a permanent reputation score visible to all future counterparties."
  - "State law enforcement and visible policing — the modern secular replacement for moralizing-god surveillance; works when believed-in (deterrence) regardless of actual enforcement intensity."
  - "Social media as ambient panopticon — diffuse, always-on visibility for ordinary people; the secular Big God of late modernity, with the same behavioral consequences (people perform-as-watched, conform to imagined audience)."
  - "Blockchain / public-ledger transparency in cryptocurrency communities — the explicit attempt to engineer a Big-Gods-equivalent watcher into a stateless context where neither religious belief nor state enforcement can be assumed."
