id: lex-svxfr
name: a-metaphors-invariance-principle-predicts-which-entailments-get-overridden
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A conceptual metaphor can run smoothly even when some obvious entailment of its source domain clearly doesn't apply. Resist the urge to read that mismatch as a sign of sloppy or failing use. Lakoff's Nation-As-Family metaphor maps the government onto a parent and citizens onto children, and the protection, authority, and responsibility structure of parenthood carries over cleanly -- but citizens are adults, so the government doesn't put anyone to bed or tell bedtime stories, and no one experiences this as the metaphor failing. This is what Lakoff calls the Invariance Principle: a metaphor's mapping preserves the source domain's structural relationships, its image-schema, while quietly dropping any specific inference that conflicts with what's already known about the target. The overriding isn't ad hoc patching to save a broken analogy -- it's predictable in advance from the metaphor's own structure and the target domain's independently known properties. Diagnostic move: when a metaphor seems to apply well overall despite an obvious literal mismatch, check whether the mismatch is exactly the kind the Invariance Principle predicts would be suppressed -- a structural relationship holding while a source-specific literal detail silently drops out -- rather than treating either the metaphor's general fit or its one glaring exception as the more important fact."
related: [lex-kfdep, lex-qthpp]
evokes: [george-lakoff, moral-politics-1996, invariance-principle, nation-as-family, image-schema]
lineage:
  - source: primary
    text: lakoff-1996-invariance-principle-nation-as-family
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 8 'The Nature of the Model,' section 'A Bit More Precision.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Certain inferences, importantly, are overridden, as is normal in conceptual metaphors. For example, citizens, for the most part, are adults and so are not treated like children. The government doesn’t put you to bed, tell you a bedtime story, and so on. This is predicted by what is called the Invariance Principle (References, A1, Lakoff 1993). However, the government, like a parent, does have certain responsibilities toward its citizens and authority over them.”"
canonical-instances:
  - "The direct textual anchor is the lineage quote itself: the specific entailment that survives (responsibilities and authority) and the specific entailment that's overridden (literal childhood treatment) are both named, and Lakoff attributes the override to a general, independently-formulated principle rather than to an ad hoc exception invented for this one case."
  - "Hypothetical: a company culture runs on a FAMILY metaphor -- 'we take care of our own,' leadership as parental figures, employees as kids who've grown up in the org. No one at the company expects leadership to actually set employees' bedtimes or approve their friendships, and no one treats that absence as proof the family metaphor doesn't really apply. The metaphor keeps its grip on the things that transfer -- loyalty, protection, a sense of being looked after -- while the literal specifics of childhood silently never enter the picture, exactly the entailments a reasonable listener already expects to be irrelevant."
critical-questions:
  - "The Invariance Principle predicts which entailments get overridden based on the target domain's independently known properties, but it doesn't specify how much conflicting detail a metaphor can absorb before the override process itself becomes visible and the metaphor starts to feel strained or false. Is there a way to predict in advance when accumulated overrides will finally break a metaphor's felt naturalness, or can this only be identified after the fact, once a given metaphor has actually stopped working for people?"
  - "Lakoff applies the principle to explain why an obviously false entailment (bedtime stories) gets silently dropped, but political arguments regularly use OTHER entailments of Nation-As-Family that are just as questionable -- the balanced-budget-amendment analogy he criticizes elsewhere in this same chapter as 'economically ludicrous.' Why does the Invariance Principle suppress the bedtime-story entailment automatically but apparently fail to suppress the family-budget entailment, when both are equally poor fits to how a nation actually works?"
status: active
