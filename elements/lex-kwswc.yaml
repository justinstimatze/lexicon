lineage:
  - source: primary
    text: sudnow-1967-passing-on-doa-social-worth
    citation: "David Sudnow, Passing On: The Social Organization of Dying (Prentice-Hall, 1967), Chapter 4 'Death and Dying as Social States of Affairs,' section 'Death, Uses of a Corpse, and Social Worth,' on differential resuscitation effort applied to physically indistinguishable DOA cases."
    quote: "'Two persons in \"similar\" physical condition may be differentially designated dead or not. For example, a young child was brought into the ER with no registering heartbeat, respirations, or pulse— the standard \"signs of death\"— and was, through a rather dramatic stimulation procedure involving the coordinated work of a large team of doctors and nurses, revived for a period of eleven hours. On the same evening, shortly after the child's arrival, an elderly person who presented the same physical signs, with what a doctor later stated, in conversation, to be no discernible differences from the child in skin color, warmth, etc., \"arrived\" in the ER and was almost immediately pronounced dead, with no attempts at stimulation instituted. A nurse remarked, later in the evening: \"They (the doctors) would never have done that to the old lady (i.e., attempt heart stimulation) even though I've seen it work on them too.\"'"
canonical-instances:
  - "the ER team that mobilized full stimulation for the child but pronounced the elderly patient with the same physical presentation dead within moments — the intern who performed mouth-to-mouth on the child later said he could never bring himself to put his mouth to 'an old lady's like that.'"
  - "two production incidents of equal technical severity receive different escalation speed and headcount depending on which customer account is affected, though the on-call runbook lists only technical severity as the trigger."
  - "two applicants with equivalent qualifying scores get different amounts of interviewer advocacy in a hiring committee depending on unstated pattern-matching about who 'looks like' a strong hire."
critical-questions:
  - "isn't unequal effort sometimes clinically or operationally justified — e.g., expected years of remaining life, or genuine differences in prognosis? Yes, and Sudnow is careful that the case is constructed to REMOVE that justification: the doctor's own statement is that there was 'no discernible difference' in the physical presentation, and the nurse's comment ('even though I've seen it work on them too') explicitly denies that the differential was prognosis-driven. The pattern applies specifically when the stated justifying criteria are held constant and the effort still diverges — not to every case of legitimately differentiated triage."
  - "how is this different from lex-a3tfj testimonial-injustice-deflates-credibility-via-prejudicial-stereotype? lex-a3tfj is about a listener discounting the CREDIBILITY of what someone says because of a stereotype about the speaker's identity — an epistemic harm to a knower. This atom is about EFFORT/RESOURCE ALLOCATION diverging from stated decision-criteria in a life-or-death triage context — an action-level harm, not a credibility judgment. They can compose (a person whose testimony about their own symptoms is discounted may also receive less resuscitation effort) but name different mechanisms."
  - "does exposing this pattern imply the doctors were acting in conscious bad faith? No — the nurse's remark suggests she took the differential for granted as an unremarkable fact of the setting, not as a scandal to be hidden. The pattern names an unstated, likely non-deliberate judgment that nonetheless produces a measurable and morally consequential effort gap; it does not require, and Sudnow does not claim, deliberate cruelty."
