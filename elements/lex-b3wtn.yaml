    quote: "'When two kings are at peace with each other, [even] a weaker king shall go to war [against the stronger] if he finds that the enemy's principal constituents, though greedy, impoverished and rebellious, are afraid of coming over to his side for fear of being handed back to their king.'"
canonical-instances:
  - "A company trying to poach a rival's disgruntled top talent finds that no one takes the offer despite widely known dissatisfaction, and correctly diagnoses that the fear isn't loyalty to the rival but fear that an aggressive public hiring push will provoke a legal or reputational fight that makes changing jobs too risky — the fix isn't a bigger offer, it's a quieter, lower-conflict approach that removes the specific feared cost, mirroring the 'reduce intensity of the war' response."
  - "A union organizing effort stalls because workers, though visibly resentful of management, fear that if the current organizing drive fails, management (currently constrained by a temporary truce with the broader industry) will retaliate once that truce ends — recognizing this specific fear (retaliation once protection lapses, not genuine satisfaction with management) suggests the organizers should push harder now, during the window where the fear's basis is weakest, rather than waiting, mirroring the 'go to war while at peace' response to fear of being handed back."
critical-questions:
  - "how would an outside party actually determine which specific fear is operating (fear of ongoing conflict versus fear of future reversal) rather than assuming one or the other based on which explanation better fits the response they'd prefer to take — is there a risk of motivated diagnosis, where the strategist decides in advance which move they want to make and then finds the fear-explanation that justifies it?"
  - "does removing the diagnosed fear reliably produce the predicted defection, or could there be a THIRD explanation (genuine loyalty, a preference that has nothing to do with fear at all) that this two-fear framework misses entirely, leading to a de-escalation or escalation that doesn't actually change anything because the real cause wasn't fear-based at all?"
  - "in Kautilya's asymmetric response (stronger party de-escalates, weaker party escalates), does the weaker party's escalation carry disproportionate risk if the diagnosis is wrong — a weaker king who wages war on a mistaken belief that the enemy's constituents were merely fear-suppressed, when they were actually genuinely loyal, faces a much worse downside than a stronger king whose mistaken de-escalation merely wastes an opportunity?"
status: active
