id: lex-jfy8w
name: default-human-disposition-is-decent-not-veneer-over-savagery
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When designing systems, interpreting behavior, or staffing institutions, do not default to 'veneer theory' — the persistent assumption (named by Frans de Waal, popularized by Bregman 2019) that civilization is a thin veneer over savage human nature that cracks at the slightest provocation. Bregman's accumulated empirical case (with caveats — see below): in actual crises (Blitz, Katrina, Tongan boys' real-life Lord-of-the-Flies, post-disaster behavior generally) most people behave PROSOCIALLY; cooperation, not panic-violence, is the modal response. Marshall's WWII rifle-fire data (controversial but persistent finding) suggested most soldiers never fired their weapons at the enemy because of a deep inhibition against killing fellow humans. Transferable design consequence: institutions assuming veneer theory (high-control, high-surveillance, harsh enforcement) often produce WORSE outcomes than institutions assuming default decency — because the latter trust-by-default elicits the trustworthy behavior they assume, while the former erode the prosocial default by signaling 'you are not trusted' and 'cheating is normal here.' Operational diagnostic: when proposing a control measure justified by 'people will defect without it,' ask whether the measure ITSELF SIGNALS expected defection — and whether the same outcome could be achieved by a measure that signals expected cooperation. Caveats per known reception: (a) Bregman is in the user's caveat-authors register (post-2018 Utopia-for-Realists pundit-drift concern); his specific case studies have been challenged in spots (Stanford prison was already debunked elsewhere; Easter Island ecocide narrative is contested). The transferable claim survives those challenges — even strict critics of Bregman accept that veneer theory is empirically weak as a DEFAULT assumption. (b) Veneer theory is sometimes right in specific structural conditions (atrocity-by-ordinary-people, lex-f5pns doubling) — the cardinal distinction is what conditions activate which disposition, not which disposition is 'real.' Both prosocial-default and capacity-for-atrocity are real; veneer theory mis-weights which is structurally more common."
