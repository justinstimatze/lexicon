id: lex-dwbqd
name: a-theory-is-judged-by-what-it-enables-not-by-truth
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a theory later turns out to be false, resist treating that as a verdict that it was never a real achievement -- Popper argues the value of a bold theory is measured by what it made possible, including its power to provoke the criticism that produces its own successors, not by whether it happens to still be believed. Popper on Anaximander's theory that the earth floats free in space, held stable by symmetry alone -- a theory Popper elsewhere flatly calls false: 'Anaximander's achievement is valuable in itself, like a work of art. Besides, his achievement made other achievements possible, among them those of the great scientists mentioned. ... But are not Anaximander's theories false, and therefore non-scientific? They are false, I admit; but so are many theories, \"based\" upon countless experiments, which modern science accepted until recently, and whose scientific character nobody would dream of denying, even though they are now believed to be false. ... A false theory may be as great an achievement as a true one.' The mechanism behind the claim: a bold, false theory can still clear the way for its own refutation and for the better theory that replaces it -- Anaximander's suspended earth cleared the way for Aristarchus, Copernicus, Kepler, and Galileo precisely by being bold enough to attract serious criticism. A cautious theory nobody bothers arguing with can be true and still contribute nothing to what comes after it. Diagnostic move: when assessing whether an idea, a research program, or a design was worthwhile in hindsight, ask what it made possible for the people who challenged and replaced it, not only whether it turned out to be correct -- an idea's generativity and its truth-value are separate axes, and the field's later verdict on the second doesn't settle the first."
