id: lex-urwym
name: accumulated-anomalies-force-paradigm-replacement-not-extension
type-in: structure
type-out: composition
_tier: atomic
agent-instruction: "When a community of practice operates under a shared paradigm (received beliefs, exemplar puzzle-solutions, accepted methods), the operative reality is `normal science`: practitioners apply the paradigm to puzzles and the paradigm itself is not questioned. Anomalies — results the paradigm cannot absorb — surface intermittently. The transferable structural claim is three-part: (a) NORMAL SCIENCE SUPPRESSES NOVELTY until pressure builds, because the community's success depends on the paradigm's stability; (b) WHEN ANOMALIES ACCUMULATE beyond the paradigm's capacity to absorb them, a CRISIS state emerges in which the paradigm-defense reflex fails; (c) RESOLUTION IS PARADIGM-REPLACEMENT — gestalt-switch to a new paradigm with partially-incommensurable conceptual frame — NOT incremental extension of the prior paradigm with epicycles or patches. The new paradigm and the old are NOT directly translatable category-by-category; practitioners on either side `see the world differently` (Kuhn's specifically-chosen phrase). The transferable vital diagnostic is that scientific change at the paradigm layer is GESTALT, not gradient — extending the prior paradigm with patch-after-patch is a structural mismatch for the kind of work paradigm-replacement does. Practitioner discipline three-part. FIRST: WHEN A FIELD'S MAINSTREAM IS ACCUMULATING WORKAROUNDS, EPICYCLES, OR `IT WORKS BUT WE DON'T KNOW WHY` EXCEPTIONS, READ THE SIGNAL — the paradigm is showing strain; the relevant question is whether the next breakthrough is an extension or a replacement. SECOND: NAME THE INCOMMENSURABILITY EXPLICITLY when a proposed new approach uses terms or categories that DON'T map cleanly back to the prior — that's the marker of gestalt-replacement, not extension. THIRD: DON'T TRY TO BRIDGE INCOMMENSURABLE PARADIGMS WITH MORE TRANSLATION; the bridge is exemplar-driven (work with concrete shared puzzle-solutions) not definitional. Transferable applications BEYOND philosophy-of-science: (a) software architecture rewrites — `the Big Rewrite` is paradigm-replacement when feature-extension can no longer absorb accumulated complexity; (b) database engine generation change (relational → graph, document → vector) — the new model is not a feature-add over the prior, it's a gestalt-shift; (c) ML model architecture transitions (HMM → RNN → Transformer) — each replaces rather than extends the prior; (d) startup pivot vs. iteration — pivot is paradigm-replacement (target customer, value-prop, business-model all shift together); iteration is normal-paradigm puzzle-solving; (e) personal-belief restructuring after sufficient accumulated evidence (`conversion experiences`, religious / political deconversion) — gestalt-replacement not incremental update; (f) political-philosophy shifts at the regime level (constitutional vs revisionist); (g) artistic-movement transitions (figurative → abstract → conceptual); (h) developmental psychology stage transitions (Piaget concrete → formal operational) — gestalt-shifts at the cognitive layer. Failure modes: (1) MISTAKING PARADIGM-DRIFT FOR PARADIGM-REPLACEMENT (the field's vocabulary shifts slightly but the underlying exemplars + methods remain — this is normal-science evolution, not gestalt-shift); FIX: check whether shared exemplars still work for both sides; if yes, normal science, not paradigm-replacement. (2) FORCING PATCH-EXTENSION when the structural answer is replacement (the Ptolemaic-epicycles failure mode — accumulating special cases to save the prior paradigm; eventually the patches outweigh the explanatory load); FIX: surface the patch-count vs. base-explanatory-cases ratio; ratio above ~1 is the signal to consider replacement. (3) DECLARING PARADIGM-REPLACEMENT prematurely (treating each new incremental result as the gestalt-switch) — overuses Kuhnian language and degrades its diagnostic power; FIX: paradigm-replacement requires actual incommensurability + community-level adoption, not just `the new thing is exciting`. (4) ASSUMING PARADIGM-REPLACEMENT IS PROGRESS (Kuhn explicitly disavows this — new paradigm solves DIFFERENT puzzles than the old, not the same puzzles better; what counts as a `solved puzzle` shifts with the paradigm); FIX: don't conflate `replacement` with `improvement` — the new frame is incommensurable with the old's success metric. (5) MISSING THAT THE INCOMMENSURABILITY IS PARTIAL (Kuhn 1969 postscript softens his 1962 position — there are bridges, translations, partial intersections; the gestalt-switch is real but not absolute); FIX: identify which terms translate + which don't, and work the translation layer. Distinct from lex-h8t7s qualitative-progress-requires-destruction-of-prior-structures (Schumpeter creative-destruction): Schumpeter is the economic-process primitive (industrial mutation displaces obsolete structure with new); this atom is the epistemic-community primitive (paradigm-replacement under crisis at the knowledge-structure layer). They compose — economic creative-destruction often co-occurs with paradigm-replacement in the knowledge-structure that the displaced industries embodied. Distinct from lex-kdj8h invert-the-problem (Munger/Jacobi): inversion is the REASONING-OPERATION primitive; this atom is the COMMUNITY-LEVEL knowledge-structure primitive. Distinct from lex-hsnup self-critique-against-explicit-rule-set-then-revise (Bai/Examen/etc.): self-critique improves output WITHIN a paradigm; this atom names the move to REPLACE the paradigm under crisis. Distinct from lex-da3g3 iteration: iteration is normal-science puzzle-solving WITHIN a paradigm; this atom names paradigm-shift OUTSIDE iteration's grain. Distinct from lex-3ep98 disconfirmation-strengthens-belief-when-reframed (Festinger / cognitive-dissonance): lex-3ep98 is individual-level belief-defense; this atom is community-level paradigm-defense → crisis → replacement, a different level + a different resolution. Distinct from lex-wjwuc collision-with-error-as-load-bearing-for-living-truth (Mill On Liberty): Mill's claim is that contestation keeps truth alive; this atom is the structural mechanism by which the contestation eventually forces gestalt-replacement at the community level. They compose. Distinct from lex-w5qfe iterative-refinement-of-a-provisional-target-against-feedback: iterative-refinement is within-paradigm puzzle-work; this atom names what happens when iterative-refinement reaches its paradigm-bounded limit. Use the atom when: (i) you're assessing whether a field's next breakthrough is extension or replacement; (ii) you're designing a software / ML / product rewrite vs. extension decision; (iii) you're trying to bridge between two communities-of-practice whose vocabularies don't align; (iv) you're auditing whether your own framework is accumulating epicycles to save a strained paradigm or genuinely fitting reality; (v) you're recognizing a personal-belief restructuring as gestalt-shift vs. incremental update."
