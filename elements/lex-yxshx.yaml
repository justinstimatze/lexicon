name: becoming-the-bait-reverses-a-predators-advantage-over-you
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone with power over you abandons you somewhere you can't easily recover from, transforming yourself into the exact thing that party wants can pull them back within your reach and reverse who has leverage over whom. In Radin's comparative Assiniboine summary, Sitconski asks the eagle to carry him, and the eagle simply drops him: 'Eagle abandons him on a mountain top. Sitconski tumbles down head foremost, and sticks in a swamp.' Stranded, he doesn't climb back up or seek another ally -- he changes what he is: 'When he frees himself, he turns into a moose to entice the eagle down. When the eagle eats of the meat, Sitconski kills him.' The eagle's advantage was elevation and appetite; Sitconski's countermove supplies exactly what the appetite wants, at ground level, where the elevation no longer protects the eagle. Diagnostic move: when you've been abandoned or exploited by someone whose advantage depends on staying elevated, distant, or otherwise out of your reach, consider whether you can become something that specific party is drawn to close that distance voluntarily, rather than trying to close it yourself against their advantage."
