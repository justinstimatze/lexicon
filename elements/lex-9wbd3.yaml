id: lex-9wbd3
name: greatest-happiness-principle-actions-judged-by-aggregate-welfare
type-in: question
type-out: claim
_tier: atomic
agent-instruction: "When evaluating an action by consequences, sum it across all affected welfare. Greatest happiness principle: the right action is the one producing the most aggregate well-being. Use as one lens among many; don't pretend it dissolves rights, fairness, or distributive concerns."
related: [lex-r3w25, lex-jbegr, lex-pbdbb, lex-v7ceq, lex-uz24q, lex-y9q22, lex-kfk68, lex-gzgn3, lex-exczm, lex-8f8jk, lex-q6z64, lex-xuwr2, lex-dfgda, lex-m33nq, lex-v6dz2]
scaffolds-from: [lex-exczm, lex-gzgn3]
evokes: [the-aggregate-is-the-criterion, calculate-then-act, every-person-counts-for-one, treat-consequences-as-the-judge]
lineage:
  - source: primary
    text: mill-1863-utilitarianism
    citation: "John Stuart Mill, *Utilitarianism* (1863). (Project Gutenberg #11224). The Greatest Happiness Principle is Mill's foundational moral criterion: actions are right insofar as they tend to produce aggregate happiness, wrong insofar as they produce its reverse. Stated explicitly at Ch.II opening. Mill credits Bentham as originator (Ch.I); his contribution is the qualitative refinement (see lex-y9q22) plus the proof-strategy of Ch.IV (the only evidence that anything is desirable is that people desire it). The principle is the canonical formulation of consequentialist ethics in the analytic tradition; nearly all subsequent moral philosophy (rule-utilitarianism, preference-utilitarianism, negative-utilitarianism, Singer, Parfit, Sidgwick) is a variant or response."
    quote: "[Mill, Utilitarianism Ch.II ¶2:] 'The creed which accepts as the foundation of morals, Utility, or the Greatest Happiness Principle, holds that actions are right in proportion as they tend to promote happiness, wrong as they tend to produce the reverse of happiness. By happiness is intended pleasure, and the absence of pain; by unhappiness, pain, and the privation of pleasure. To give a clear view of the moral standard set up by the theory, much more requires to be said... [Ch.II ¶12 — the impartial-spectator clause:] As between his own happiness and that of others, utilitarianism requires him to be as strictly impartial as a disinterested and benevolent spectator. In the golden rule of Jesus of Nazareth, we read the complete spirit of the ethics of utility. To do as one would be done by, and to love one's neighbour as oneself, constitute the ideal perfection of utilitarian morality.' [The structural claim: the criterion of right action is aggregate welfare, calculated impartially; the agent's own welfare counts equally with — not more than — others'.]"
  - source: practitioner
    text: bentham-1789-principles-of-morals-and-legislation
    citation: "Jeremy Bentham, *An Introduction to the Principles of Morals and Legislation* (1789). Tier-3 deepening source: Bentham is the originator of the principle Mill systematizes. Bentham's felicific-calculus (intensity + duration + certainty + propinquity + fecundity + purity + extent) is the operational specification of how to compute aggregate utility; extensively cross-cited."
    quote: "[Tier-3 deepening — Bentham Ch.I opening: 'Nature has placed mankind under the governance of two sovereign masters, pain and pleasure. It is for them alone to point out what we ought to do, as well as to determine what we shall do.' Bentham's felicific calculus (Ch.IV) enumerates the dimensions along which pleasures and pains can be compared — the operational backbone of consequentialism. Sidgwick *Methods of Ethics* (1874) is the rigorous analytic systematization of the same line.]"
  - source: practitioner
    text: parfit-1984-reasons-and-persons
    citation: "Derek Parfit, *Reasons and Persons* (1984). Tier-3 deepening: Parfit develops the most rigorous modern systematization of impersonal-aggregate ethics, including the famous Repugnant Conclusion problem for total-utilitarianism (a vast population of barely-worth-living lives outranks a smaller population of excellent lives on simple aggregate sum). Parfit's work also explores person-affecting vs. impersonal views, partial population ethics, and the discount-rate-for-future-people question. In-copyright; queued in wanted-materials #15."
    quote: "[Tier-3 deepening — Parfit 1984 Part IV: the Repugnant Conclusion is that for any possible population A, with very high quality of life, there must be some much larger imaginable population B, whose existence would be better, even though its members had lives barely worth living. Total-utilitarianism + transitivity entails this. The repugnance reveals a deep tension in the impersonal-aggregate framework; whether it's a bullet to bite or a reductio remains contested. The transferable lesson: aggregate-welfare criteria are MUCH harder to specify rigorously than their casual deployment suggests.]"
canonical-instances:
  - "policy cost-benefit analysis: when a government chooses among regulations (clean-air rule, drug approval, road safety), the standard methodology is to compute aggregate willingness-to-pay across affected populations. This IS the GHP in operational form, with money as the impersonal welfare-proxy. The criticisms of CBA (whose preferences count, how to value lives, intergenerational discount rate) are the same criticisms philosophers raise against GHP — they don't disappear because the framework is technical"
  - "triage in disaster medicine: when resources are scarce, the standard rule is to maximize lives saved (or quality-adjusted-life-years saved), not to treat every patient sequentially. This is GHP in life-or-death form. The discomfort that providers feel (deciding to let one patient die to save five) is the GHP operational cost — the criterion is impartial-aggregate-welfare, but the felt morality of close-up agency resists impartiality"
  - "the trolley problem (Foot 1967, Thomson 1985): the standard utilitarian response — pull the lever, divert to track with one rather than five — is GHP applied. The deontological alternative (you may not use one person merely as means even to prevent five deaths) is the canonical NON-utilitarian frame. The persistence of the dilemma reveals that GHP is not the only operative moral intuition humans have, even when it's the only one a consequentialist framework recognizes"
  - "effective altruism (Singer 1972 onward): the modern movement that explicitly takes GHP as its foundation. Earnings-to-give, malaria-net charities, x-risk research, animal-welfare prioritization — all are GHP-driven where the relevant calculus is 'where does an additional dollar/hour produce the most expected welfare'. Strengths: forces explicit prioritization. Weaknesses: tractability bias, measurement-error compounding, all the standard utilitarian critiques (lex-y9q22 helps slightly)"
  - "operationally distinct from lex-pbdbb doctrine-of-the-mean: lex-pbdbb (Aristotelian virtue ethics) judges character, not actions, and judges by hitting-the-mean-between-vices, not by aggregate consequences. The frameworks routinely give different verdicts: virtue ethics says 'a person of good character would not lie to the murderer at the door'; GHP says 'lie if it produces more aggregate welfare'. The substrate hosts both because they are operative in different domains (institution-design tends utilitarian, character-formation tends Aristotelian)"
  - "operationally tightly coupled to lex-y9q22 higher-vs-lower-pleasures: Mill's distinctive move on top of Bentham is that the GHP must be supplemented by qualitative weighting — not just quantity-of-pleasure but quality-of-pleasure matters. lex-y9q22 is the modification; lex-9wbd3 is the base principle. They co-fire whenever Millian rather than Benthamite utilitarianism is invoked"
  - "operationally adjacent to lex-r3w25 confirmation-filtered-tribal-perception: the GHP requires impartial computation of aggregate welfare, but real agents systematically over-weight their tribe's welfare. The motivated-reasoning failure mode is the dominant practical obstacle to GHP deployment. The discipline is to make the welfare-calculation explicit + auditable (impersonal cost-benefit) rather than relying on internal-impartiality"
  - "the transferable engineering use: GHP is the default ethics-framework for institutional design where the choice is among policies, not among character-paths. When you need to choose among options whose differential effect on a population can be measured, GHP supplies the criterion. When you need to choose how to BE (not what to DO), virtue-ethics-style frames (lex-pbdbb, lex-mthv9 hexis, lex-jbegr phronesis) tend to fit better"
critical-questions:
  - "is impartiality between own-welfare and others'-welfare psychologically possible? Mill demands it (Ch.II ¶12: 'as strictly impartial as a disinterested and benevolent spectator'). The empirical answer is mostly no — humans systematically over-weight self + kin + tribe. Williams 1973 'A Critique of Utilitarianism' presses this as the integrity-objection: GHP requires the agent to treat their own projects, commitments, and relationships as merely one input to an impersonal calculation, which Williams argues is incompatible with having an integral self at all"
  - "how do you measure 'happiness' for aggregate calculation? Bentham's felicific-calculus dimensions (intensity, duration, etc.) are unmeasurable in practice. Modern proxies: revealed-preference (willingness-to-pay), survey-based subjective-wellbeing (Cantril ladder, life-satisfaction scales), QALYs (medical), capabilities-approach (Sen, Nussbaum). The proxies disagree substantially. The transferable warning: any GHP deployment is downstream of a measurement-choice that is itself ethically loaded"
  - "does the GHP commit you to monstrous conclusions in edge cases? The standard counterexamples: organ-transplant case (kill one healthy person, harvest organs, save five — GHP says yes, intuition says no), utility-monster case (a being with vastly amplified pleasure-capacity overrides all other welfare), Repugnant Conclusion (Parfit 1984 — total-utilitarianism prefers huge populations of barely-worth-living lives). Rule-utilitarianism + preference-utilitarianism variants try to address; many philosophers regard the variants as ad-hoc patches"
  - "is GHP a moral-criterion or a decision-procedure? Mill (Ch.II ¶24): not a decision-procedure ('there is no difficulty in proving any ethical standard whatever to work ill, if we suppose universal idiocy to be conjoined with it'). The criterion of rightness is aggregate-welfare; the decision-procedure most people should use most of the time is secondary rules (don't lie, don't steal, keep promises) that have GHP-justification but aren't computed afresh each time. This two-level view (criterion vs. procedure) is the standard modern utilitarian position (Hare 1981 *Moral Thinking*)"
status: active
