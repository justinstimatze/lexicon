id: lex-s3bbp
name: a-dont-look-rule-can-be-cover-for-predation
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When an authority imposes a rule that everyone under their care must keep their eyes closed during a shared activity, and offers a plausible-sounding reason for it, consider that the rule's real function may be to prevent anyone from seeing what the authority is actually doing. In Radin's Winnebago Trickster cycle, Trickster invites a flock of ducks to a dance he will sing for, and sets one condition: 'the dancers must, from the very beginning, never open their eyes... If you do they will become red.' The ducks comply and dance blind. While they dance, Trickster is not merely singing -- 'Trickster was wringing the necks of his fellows ducks!' -- killing them one by one behind the cover of the very rule he imposed. The rule survives only because no one tests it: a single duck, Little-Red-Eyed-Duck, secretly opens its eyes just enough to see the massacre, and immediately breaks the compliance the rule demanded: 'Alas! He is killing us! Let those who can save themselves.' That one violation is what allows any of the others to escape at all. Diagnostic move: when a rule from an authority demands that everyone under their care specifically avoid observing them during a shared vulnerable activity, treat 'why' as an open question rather than an answered one -- the plausible cover story and the actual function of the rule are not guaranteed to be the same thing, and the only ones who find out are the ones who break it."
