id: lex-phct8
name: benefiting-others-can-be-incidental-to-your-own-self-development
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone or something more powerful than you brings real benefits into your life, the benefit doesn't have to come from a primary intention to help you -- it can be a byproduct of that party pursuing its own development, which needed some medium to develop in, and you happened to be available as that medium. Radin poses the question directly about why a trickster-deity brings culture to mankind at all, and answers: 'this is not his primary purpose. It is incidental to his desire to express and develop himself. He cannot attain development in a void, and he consequently first attempts to bring some differentiation into this void. It is at this point that man intervenes.' The benefit to humanity isn't a separate, deliberate act of generosity layered on top of the deity's own project -- it emerges because the deity's self-differentiation and human development turn out to require each other: 'He becomes merged with the gods and the gods with him, and the differentiation and education of the gods becomes as much the education of man as it does that of the gods.' Diagnostic move: when evaluating why a more powerful party is providing you with real, tangible benefits, consider whether the benefit is actually a byproduct of that party's own developmental or expressive needs rather than a primary act of benevolence toward you -- the benefit can be completely real and still not be about you, which matters for predicting whether it continues once that party's own developmental needs are met some other way."
related: []
evokes: [radin-the-winnebago-hare-cycle-and-its-cognates, incidental-to-his-desire-to-develop-himself, man-intervenes, the-education-of-the-gods]
lineage:
  - source: primary
    text: radin-a-deitys-benefaction-to-mankind-is-incidental-to-its-own-self-development
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle and Its Cognates.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Why should a deity wish to bring culture to mankind? I think the answer must be that if he does so, this is not his primary purpose. It is incidental to his desire to express and develop himself. He cannot attain development in a void, and he consequently first attempts to bring some differentiation into this void. It is at this point that man intervenes. ... He becomes merged with the gods and the gods with him, and the differentiation and education of the gods becomes as much the education of man as it does that of the gods."
canonical-instances:
  - "A tech platform's early users get genuinely valuable free tools not because the company set out to serve them altruistically, but because building those tools was how the company differentiated its own product in a crowded market, and the free tier quietly shrinks once the company's competitive positioning is secured some other way."
  - "A junior employee gets real mentorship and skill development from a senior colleague who is primarily using the mentoring relationship to develop their own management identity and case for promotion, and the mentorship continues only as long as it still serves that colleague's own advancement."
critical-questions:
  - "Is Radin's claim that benefaction is 'incidental' to self-development a testable historical or comparative claim, or is it better read as his own psychological interpretation imposed on the myth material, one of several theories he explicitly says could be argued?"
  - "Does distinguishing 'primary purpose' from 'incidental byproduct' actually matter to the beneficiary if the benefit received is identical either way, or does the distinction only matter for predicting whether the benefit is stable or ends when circumstances change?"
  - "Could a deity, or any powerful benefactor, hold both motives simultaneously, genuine care for the beneficiary alongside self-developmental need, and would Radin's binary between 'primary purpose' and 'incidental' obscure that possibility?"
status: active
