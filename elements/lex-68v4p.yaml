id: lex-68v4p
name: cost-benefit-analysis-on-honoring-a-given-word-destroys-trust
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When deciding whether to run a cost-benefit analysis on a commitment, check WHICH SIDE of the giving of the word you're on. Cost-benefit analysis belongs BEFORE you give your word — thinking carefully about what it will actually take to keep it, and only giving it if you're prepared to do what it takes, is the responsible move. Applying cost-benefit analysis AFTER the word is already given — deciding whether to honor it now by weighing the current costs of keeping it against the current benefits — does not preserve trustworthiness; it structurally destroys it, even if you still keep the word this particular time. The reason: a word that is honored only when convenient was never actually unconditional, which means the real (unstated) commitment was always 'I'll honor this if it's still worth it to me' — and once that conditionality is visible, the word carries no more information than a probability estimate. Distinguish this from ordinary renegotiation or disclosed non-performance (telling people in advance you won't keep a word, per lex-npbj6's honoring-path) — the failure mode here is specifically DECIDING IN SECRET, after the fact, whether a standing commitment is still worth keeping."
related: [lex-6tvr6, lex-npbj6, lex-x4cpn, lex-bfwev]
scaffolds-from: [lex-npbj6]
evokes: [cost-benefit-timing, word-as-unconditional-signal, retroactive-conditionality, trust-destroying-defection, jensen-erhard-zaffron, giving-word-vs-honoring-word, meaningless-word]
lineage:
  - source: primary
    text: erhard-jensen-zaffron-2017-integrity-positive-model-abridged
    citation: "Werner Erhard, Michael C. Jensen, and Steve Zaffron, 'Integrity: A Positive Model that Incorporates the Normative Phenomena of Morality, Ethics, and Legality -- Abridged (English Language Version),' Harvard Business School NOM Unit Working Paper No. 10-061 (revised 2017). Free SSRN download (papers.ssrn.com/sol3/papers.cfm?abstract_id=1542759). Section on 'sources of the collapse of integrity' distinguishes NOT doing a cost/benefit analysis on GIVING one's word (which the authors call irresponsible — you should think through what keeping it will cost before committing) from doing a cost/benefit analysis on HONORING a word already given (which the authors argue is close to definitionally incompatible with being a trustworthy person, because it reveals the commitment was conditional all along)."
    quote: "8. Not doing a cost/benefit analysis on giving one's word. When giving their word, most people do not consider fully what it will take to keep that word. That is, people do not do a cost/benefit analysis on giving their word... this failure to do a cost/benefit analysis on giving one's word is irresponsible. ... 9. Doing a cost/benefit analysis on honoring one's word. People almost universally apply cost/benefit analysis to honoring their word. Treating integrity as a matter of cost/benefit analysis guarantees you will not be a trustworthy person, or with a small exception, a person of integrity. If I apply cost/benefit analysis to honoring my word, I am either out of integrity to start with because I have not stated the cost/benefit contingency that is in fact part of my word (I lied), or to have integrity when I give my word, I must say something like the following: 'I will honor my word when it comes time for me to honor my word if the costs of doing so are less than the benefits.' Such a statement, while leaving me with integrity will not engender trust. In fact it says that my word is meaningless."
canonical-instances:
  - "A supplier who quietly reserves the right to break a contract 'if it stops making sense' rather than stating that condition up front: even if they never invoke it, the mere fact that honoring is being re-litigated after the fact each time performance comes due means the contract was never really a commitment — it was an option they held, undisclosed, at the counterparty's expense."
  - "A manager who tells a report 'I'll back this project unless something better comes up': the disclosed conditionality (stated at commitment time) is honest and leaves the manager's integrity intact per lex-npbj6 — but a manager who says 'I'm fully backing this' and then privately re-evaluates each week whether it's still worth backing has created exactly the undisclosed retroactive-conditionality this atom names, regardless of which way the re-evaluation eventually comes out."
  - "The correct sequencing move: before giving a word, do the hard thinking (can I actually deliver this, what will it cost, am I willing to pay that cost) — that analysis is responsible and belongs up front. Once the word is given, the analysis is closed; the only legitimate move left is keep-it-or-disclose-and-clean-up (lex-npbj6), not a silent re-weighing of whether it's still convenient."
critical-questions:
  - "Is the cost/benefit analysis happening BEFORE the word is given (legitimate — arguably required for a responsible commitment) or AFTER (the failure mode this atom names)? The same analytical act is responsible on one side of the commitment and trust-destroying on the other."
  - "If a commitment is genuinely conditional, has that conditionality been STATED at the time the word was given, or is it being discovered/invoked only when it becomes costly? A stated condition preserves both integrity and trust; a silent one preserves neither."
  - "Distinct from lex-6tvr6 (pre-commitment binds future action against predictable erosion): lex-6tvr6 is a MECHANISM for a person who predicts their own future weakness to bind themselves against it (Ulysses and the mast) — it's about defeating one's own anticipated defection. This atom is about what makes a word function as a trust signal AT ALL, independent of whether anyone's willpower is expected to erode — it applies even to a perfectly steady agent who simply keeps re-deciding, calmly and rationally, whether the commitment is still worth keeping."
status: active
severity-tier: info
