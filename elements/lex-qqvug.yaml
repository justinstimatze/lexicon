id: lex-qqvug
name: an-accusation-can-run-on-the-accusers-own-unexamined-premise
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Nagarjuna's opponent charges that his doctrine of emptiness entails nihilism, then finds Nagarjuna turning the charge back with a specific image: 'You are like a man who has mounted his horse and has forgotten that very horse.' Garfield glosses the trope: a man with a herd of horses counts them, comes up one short, and accuses someone of theft -- never noticing the missing horse is the one he is currently riding. The absurd conclusion the opponent derives ('emptiness means nothing exists') only follows given a premise the opponent silently supplies and treats as obviously shared: that to exist AT ALL is to exist WITH A FIXED, INDEPENDENT ESSENCE. Nagarjuna never asserted that premise -- his entire argument denies it. The generalizable move: when someone derives an absurd or damning consequence from a position and presents it as an internal refutation, check whether the absurdity actually follows from anything the position asserts, or only from a further premise the critic has quietly supplied and is treating as though the target must share it. If the target never granted that premise, the critic isn't refuting the position -- they're refuting their own unexamined assumption and mistaking the position for the source of it. Recognize the shape whenever a critique lands with unusual force and the accused feels blamed for something they never actually claimed: a critic says a theory 'implies nihilism,' but the implication only holds under the critic's own definition of existence, which the theory specifically rejects; a manager says a new process 'removes accountability,' but only under the manager's own assumption that accountability requires one named individual to blame -- an assumption the new process was built specifically to challenge; in a code review, 'this refactor breaks backward compatibility' sometimes assumes the reviewer's own private definition of compatibility that the original spec never actually committed to. The fix in each case is not to argue harder against the stated conclusion, but to locate whose premise is actually generating it."
related: [lex-hs7ey]
evokes: [nagarjuna-mmk-24-15, mounted-his-horse-and-forgotten-it, foisting-your-errors-on-the-target, the-missing-horse-is-the-one-youre-riding, garfield-1995-fundamental-wisdom-of-the-middle-way]
lineage:
  - source: primary
    tradition: madhyamaka
    text: nagarjuna-mmk-24-15
    citation: "Nagarjuna, Mulamadhyamakakarika 24.15, trans. Jay L. Garfield, The Fundamental Wisdom of the Middle Way (Oxford University Press, 1995), p.302, Chapter XXIV 'Examination of the Four Noble Truths,' with Garfield's commentary gloss immediately following the verse."
    quote: "'When you foist on us All of your errors You are like a man who has mounted his horse And has forgotten that very horse.' [Garfield's gloss:] 'A man with a herd of horses thinks that he is missing one and accuses you of having stolen it. As he rides around and counts his horses, he always comes up one short. But you point out to him that the one he is accusing you of stealing is in fact the very one he is riding but has forgotten to count.'"
canonical-instances:
  - "A critic says a philosophical position 'implies nihilism,' but the implication only holds under the critic's own definition of existence as requiring a fixed, independent essence -- a definition the position under attack specifically and explicitly denies. The critic is refuting their own premise, dressed up as a refutation of the target."
  - "A manager objects that a new decision-making process 'removes accountability,' but the objection only holds given the manager's own assumption that accountability requires exactly one named individual to blame for any outcome. That assumption is precisely the thing the new process set out to challenge."
  - "In a code review, 'this change breaks backward compatibility' sometimes turns out to rest on the reviewer's own private, unstated definition of what counts as a compatibility guarantee -- one the original spec or contract never actually committed to, which the reviewer is treating as though everyone already agreed to it."
critical-questions:
  - "How do you tell a genuinely unshared premise (making the accusation empty) apart from a premise that's actually implicit in your own position even though you never stated it (making the accusation fair)? Pointing to the gap is only the first step -- someone still has to argue whether the premise was really smuggled in or was there all along."
  - "Does naming 'that's your premise, not mine' actually resolve the disagreement, or does it just relocate it one level up, to a harder argument about which of the two premises is actually correct? Winning the meta-argument about whose assumption is doing the work doesn't yet settle which assumption should be believed."
