id: lex-ctnnx
name: viewer-stance-is-engineered-by-the-medium
type-in: process
type-out: posture
_tier: atomic
agent-instruction: "When watching a film, reading a book, or browsing a feed, the viewer-stance is engineered by the medium — what you're invited to identify with, what's framed as the question, what stays off-screen. Notice the engineering before you read the content."
related: [lex-wtkuz, lex-gng22, lex-uz7g4, lex-r3w25, lex-q8az5, lex-a5dmb, lex-rxvus, lex-6qevt, lex-qeg52, lex-4kn98]
scaffolds-from: [lex-wtkuz]
evokes: [the-three-looks-conflated, scopophilic-vs-identificatory, the-engineered-gaze, audience-position-as-designed-effect, the-spectators-complicity-is-structured, no-natural-reception, the-apparatus-positions-the-viewer]
lineage:
  - source: primary
    text: Mulvey-1975-visual-pleasure-and-narrative-cinema
    citation: "Laura Mulvey, 'Visual Pleasure and Narrative Cinema,' *Screen* 16(3):6-18 (Autumn 1975). (13 pp of body, reworked from a 1973 talk at the University of Wisconsin French Department). The founding essay of feminist film theory and one of the most-cited essays in cultural studies of the 20th century. The crucial claim for lex-ctnnx: spectator-position in narrative cinema is not a natural reception of content but a *designed effect* of the medium's apparatus. Mulvey identifies three distinct 'looks' that the apparatus deliberately conflates into a single experienced gaze: (1) the *camera's look* as it records the pro-filmic event; (2) the *characters' looks* at each other within the diegesis; (3) the *audience's look* as it watches the final product. 'The conventions of narrative film deny the first two and subordinate them to the third, the conscious aim being always to eliminate intrusive camera presence and prevent a distancing awareness in the audience' (p.17). The result is that the audience's affective stance — scopophilic (pleasure in looking-at as object), identificatory (pleasure in identifying-with as ego-ideal), voyeuristic, fetishistic, sadistic — is *engineered* by which conflations the apparatus permits and which it suppresses. Mulvey's worked examples on Hitchcock (Vertigo, Marnie, Rear Window) and Sternberg (Morocco, Dishonoured) show the engineering operating in opposite directions: Hitchcock draws the spectator into the male protagonist's voyeuristic gaze so completely that the spectator's complicity with his power and perversion is *exposed* as the narrative develops; Sternberg breaks the protagonist-mediation entirely, dissolving narrative-illusion into pure fetishistic spectacle. Both are choices by the apparatus, producing engineered viewer-stances that the apparently-naive viewer reads as 'how the film naturally is.' The transferable claim is wider than cinema: any medium with an apparatus (camera + cut + sound, broadcast frame + commentary, game-engine + control-scheme, AR/VR + head-tracking, advertising image + caption, courtroom procedure + voice-of-state) engineers viewer-stance via the analog of Mulvey's three-looks conflation. The atom is the recognition that viewer-stance IS engineered and the practitioner-discipline of inspecting *how* it is engineered in any given medium."
    quote: "[Mulvey 1975 Screen 16(3) p.6, the political-use frame:] 'This paper intends to use psychoanalysis to discover where and how the fascination of film is reinforced by pre-existing patterns of fascination already at work within the individual subject and the social formations that have moulded him.' [p.10, the two-pleasures-in-tension structure that makes engineering possible:] 'In film terms, one implies a separation of the erotic identity of the subject from the object on the screen (active scopophilia), the other demands identification of the ego with the object on the screen through the spectator's fascination with and recognition of his like. The first is a function of the sexual instincts, the second of ego libido. This dichotomy was crucial for Freud.' [p.12, the device of the show-girl as the canonical-instance of two-looks-conflated into one:] 'The device of the show-girl allows the two looks to be unified technically without any apparent break in the diegesis. A woman performs within the narrative, the gaze of the spectator and that of the male characters in the film are neatly combined without breaking narrative verisimilitude.' [p.16, Hitchcock as canonical-instance of engineered-complicity:] 'In Vertigo, erotic involvement with the look is disorientating: the spectator's fascination is turned against him as the narrative carries him through and entwines him with the processes that he is himself exercising. The Hitchcock hero here is firmly placed within the symbolic order, in narrative terms. He has all the attributes of the patriarchal super-ego. Hence the spectator, lulled into a false sense of security by the apparent legality of his surrogate, sees through his look and finds himself exposed as complicit, caught in the moral ambiguity of looking.' [p.17, the canonical statement of the three-looks structure that the atom abstracts:] 'There are three different looks associated with cinema: that of the camera as it records the pro-filmic event, that of the audience as it watches the final product, and that of the characters at each other within the screen illusion. The conventions of narrative film deny the first two and subordinate them to the third, the conscious aim being always to eliminate intrusive camera presence and prevent a distancing awareness in the audience. Without these two absences (the material existence of the recording process, the critical reading of the spectator), fictional drama cannot achieve reality, obviousness and truth.' [Practitioner-extraction for lex-ctnnx: the apparatus has at least three engineerable look-positions; what the audience experiences as the natural viewer-stance is the residue after the apparatus has suppressed and conflated specific ones; making the engineering visible is the operational move that any critical-reception practice (Mulvey's 'destruction of pleasure as a radical weapon,' p.7) is trying to perform.]"
  - source: practitioner
    text: cross-medium-three-looks-attestation
    citation: "Cross-medium attestations of the same engineering-of-viewer-stance pattern. (a) Berger 1972 *Ways of Seeing* (BBC4 + Penguin; widely available) applies the active/passive engineering to oil painting + advertising — 'men act and women appear,' the painted female nude is positioned for an implicit male owner-viewer, advertisement deliberately engineers the viewer's relation-to-self into aspirational-lack. Berger and Mulvey were near-contemporary; both treat the medium as an apparatus that engineers viewer-stance via positioning. (b) Carol J. Clover 1992 *Men, Women, and Chainsaws* (in copyright, Princeton UP) extends Mulvey to horror cinema: the slasher's predatory-POV phase loads sadistic-with-perpetrator identification, then transfers to the final-girl POV, producing a 'transgender shift' in viewer position. This is the contrapoints-saw-mining-pass-1 candidate `viewer-cross-identification-in-mediated-violence` — Clover's horror-specific specialization of Mulvey's general claim. lex-ctnnx SUBSUMES that candidate as a canonical-instance. (c) Sturken & Cartwright 2018 *Practices of Looking* (in copyright, Oxford UP textbook) operationalizes the gaze-engineering claim across photography, video games, advertising, surveillance, museum display, and digital interfaces — the standard contemporary textbook applies Mulvey's three-looks frame to media well beyond narrative cinema. (d) First-person shooter video-games as native engineered-viewer-stance: the player's gaze IS the protagonist's gaze by literal control-mapping; the apparatus engineers identification-with-shooter at a level Mulvey only theorized in cinema. (e) Reality TV / true crime: the courtroom/prosecution-frame engineers viewer-stance as judge-with-the-state; the choice of voice-over, music, montage, and which subjects appear in talking-head vs B-roll engineers complicity-with-verdict before the audience has heard evidence. (f) Live sports broadcasting: the 'home camera' is structurally aligned with the home team (favorable angles on home-team goals, replay-emphasis on home-team controversies); the 'neutral' camera is a fiction. (g) News-photography composition (Sontag 1977 *On Photography*; Sontag 2003 *Regarding the Pain of Others*) engineers stance via crop, caption, sequencing — a refugee photo positioned for empathy vs alarm vs distance is the same apparatus-choice Mulvey describes for narrative film. (h) AR/VR head-mounted displays: literal first-person-perspective engineered with head-tracking, controller-mapping, and visual-field framing; the engineered stance is more total than any prior medium. (i) LLM chatbot interfaces: anthropomorphic-style + first-person address + memory-of-prior-turns engineer user-stance toward the model (identification, trust, complicity) vs more-neutral-tool framings that engineer a distance-stance. Across cinema, painting, advertising, video games, broadcast, photography, AR/VR, and conversational AI — every medium with an apparatus engineers viewer-stance, and Mulvey's three-looks structure (camera/character/audience or their medium-specific analogs) is the right frame to inspect that engineering."
    quote: "[Cross-medium synthesis 2026-05-25: the transferable claim is the apparatus-engineers-stance recognition, not Mulvey's specific Freudian/Lacanian psychoanalytic apparatus. Mulvey GROUNDS the recognition (the three-looks structure is the canonical-instance); the cross-medium attestation (Berger painting, Sturken-Cartwright photography/games/surveillance, FPS games, reality TV, sports broadcasting, news photography, AR/VR, chatbots) shows the recognition transfers to any apparatus. The practitioner-question: in this medium, what are the analogs of camera/characters/audience? Which conflations does the apparatus permit and which does it suppress? What viewer-stance is the residue? Once you can answer those three, you can read the medium critically — which is Mulvey's program ('destruction of pleasure as a radical weapon,' p.7), generalized to apparatus-criticism for any medium.]"
canonical-instances:
  - "the Hitchcock-Vertigo canonical case (Mulvey 1975 pp.15-17): subjective camera predominates; the narrative is woven around what Scottie sees or fails to see; the audience follows the growth of his erotic obsession from his point of view. The spectator is engineered into the protagonist's voyeuristic position so completely that when the narrative exposes the protagonist's complicity, the spectator is exposed alongside him. 'Erotic involvement with the look is disorientating: the spectator's fascination is turned against him as the narrative carries him through and entwines him with the processes that he is himself exercising.' The Hitchcock apparatus uses the three-looks conflation deliberately to make complicity visible — the engineering is the message"
  - "the Sternberg-Morocco canonical case (Mulvey 1975 pp.13-15): Sternberg breaks the protagonist-mediation entirely. The male hero misunderstands and does not see; the look at Dietrich is one with the audience's look, not standing in for it. 'He would welcome his films being projected upside down so that story and character involvement would not interfere with the spectator's undiluted appreciation of the screen image.' Pure fetishistic-scopophilia engineered by the apparatus — the opposite direction from Hitchcock, but the same point: the spectator's stance is a designed effect, not a natural reception"
  - "the device of the show-girl as the textbook canonical-instance (Mulvey 1975 p.12): 'The device of the show-girl allows the two looks to be unified technically without any apparent break in the diegesis. A woman performs within the narrative, the gaze of the spectator and that of the male characters in the film are neatly combined without breaking narrative verisimilitude.' The cleanest demonstration of how the apparatus *engineers* the conflation — the show-girl scene exists precisely to make the two looks experience-as-one. Marilyn Monroe in The River of No Return, Lauren Bacall's songs in To Have or Have Not"
  - "the Clover slasher 'transgender shift' (Clover 1992 *Men, Women, and Chainsaws*, in-copyright; surfaced via the contrapoints-saw pass #C2): the slasher film engineers viewer-stance shifts within a single narrative — early predatory-POV cinematography loads sadistic-with-perpetrator identification; the mid-film transfer to the final-girl's POV reorients the spectator's stance through victim-survivor identification. Mulvey's three-looks structure is the operating mechanism; Clover identifies a genre-specific *temporal* engineering of the conflation. lex-ctnnx subsumes the candidate `viewer-cross-identification-in-mediated-violence` as this specific genre-specialization"
  - "first-person shooter video games (Doom 1993 onward, Half-Life, Counter-Strike, Call of Duty, etc.): the player's gaze IS the protagonist's gaze by literal control-mapping; mouse-look + WASD movement collapse camera/character/audience into a single engineered first-person stance. The medium ENGINEERS scopophilic + identificatory + agentic stance into a single position more total than any cinematic apparatus achieves. Critical readings (Galloway 2006 *Gaming: Essays on Algorithmic Culture*) inspect this engineering with Mulvey-derived tools — 'the gamer is positioned as the algorithm's executor.' The practitioner-question for game design is exactly Mulvey's: what stance does this apparatus engineer?"
  - "John Berger *Ways of Seeing* (BBC4 1972 + Penguin 1972): 'Men act and women appear.' Berger applies an effectively-equivalent gaze-engineering analysis to oil painting and advertising, contemporary with Mulvey. The European nude is positioned for an implicit male owner-viewer; advertising engineers the viewer's relation-to-self into aspirational-lack ('you are insufficient until you possess X'). Mulvey-without-Lacan; same engineering recognition operating across painting, photography, and ad imagery"
  - "live sports broadcasting (any nationally-televised game): the 'home camera' is structurally aligned with the home team — favorable angles on home goals, replay-emphasis on home-team controversies, commentary that frames home-team plays as 'we just saw a brilliant play.' The viewer experiences this as 'just watching the game,' but the apparatus is engineering identification-with-home-team via the same three-looks conflation (broadcast camera = home POV; commentators = home characters' voice; audience = home fan). Visiting-team broadcasts engineer the opposite stance from the same physical event. The engineered-stance recognition tells you the 'neutral' broadcast is a fiction"
  - "AR/VR head-mounted displays (Oculus, Vision Pro, etc.): literal first-person-perspective engineered with head-tracking, hand-controller mapping, and total visual-field framing. The user's body is partially overridden by the apparatus's body — the engineered stance is more total than any prior medium (no peripheral vision escape, no cut-away to the apparatus itself). The 'presence' that VR designers chase IS the engineered conflation Mulvey identified, taken to physiological extremes. Practitioner-discipline: VR design that does NOT inspect its own engineering of stance produces unconsidered viewer-positions"
  - "LLM chatbot interface design (ChatGPT, Claude, etc.): anthropomorphic-style + first-person address + persistent-memory engineer user-stance toward the model — identification with a 'helpful assistant persona,' trust calibrated to fluency-of-response (cf lex-jv983 fluency-trap), complicity with the model's frame. More neutral framings (tool-like prompts, explicit-uncertainty-display, raw-completion mode) engineer a distance-stance. Same engineering choice as Hitchcock-vs-Sternberg in different substrate: which conflations to permit, which to suppress, what stance is the residue. AI interface design IS apparatus-design in Mulvey's sense"
  - "operationally distinct from lex-gng22 perspective-shift-via-imagined-other: lex-gng22 is VOLUNTARY perspective-taking (the practitioner deliberately imagines another's view to gain insight). lex-ctnnx is INVOLUNTARY ENGINEERED positioning (the medium produces the stance whether the viewer consents or knows). Cross-fire: a lex-wtkuz-operationalized practitioner can use lex-gng22 to deliberately COUNTER lex-ctnnx's engineering — taking another view by choice to disrupt the apparatus's positioning. The two atoms work on opposite vectors: lex-gng22 is recipient-initiated; lex-ctnnx is medium-initiated"
  - "operationally distinct from lex-uz7g4 archetype-as-projective-shorthand: lex-uz7g4 is the recipient's projection ONTO an archetypal figure (the viewer fills in the figure's interior from a sparse template). lex-ctnnx is the medium's engineering of the recipient's STANCE toward the figure (where the viewer's eye is positioned, what affect is permitted, which look is suppressed). They co-fire: an archetypal figure is the FREQUENT subject of engineered-viewer-positioning (Marilyn Monroe as figure + Hitchcock's apparatus engineering the gaze at her = lex-uz7g4 + lex-ctnnx jointly), but the atoms are about the figure-side (lex-uz7g4) vs the apparatus-side (lex-ctnnx) of the same scene"
  - "operationally distinct from lex-r3w25 confirmation-filtered-tribal-perception: lex-r3w25 is RECIPIENT-SIDE filtering (the partisan viewer selects/interprets to confirm prior beliefs). lex-ctnnx is MEDIUM-SIDE engineering (the apparatus positions the viewer regardless of prior beliefs). Cross-fire: lex-ctnnx-engineered media + lex-r3w25-filtering recipients = a tightly-coupled feedback loop (the Fox News apparatus engineers a specific stance; the partisan viewer's filtering ratifies it). The atoms together explain the modern-partisan-media-bubble; neither alone is sufficient"
  - "operationally distinct from lex-q8az5 noble-lie-instrumental-narrative-for-cohesion: lex-q8az5 is a CONTENT-level engineering (a deliberately-untrue narrative is told to produce cohesion). lex-ctnnx is APPARATUS-level engineering (the medium's structural choices position the viewer regardless of content-truth). A documentary can be content-truthful AND lex-ctnnx-engineering (PBS NewsHour's camera-framing engineers a specific stance toward subjects even when the reportage is accurate). The two atoms operate at content vs apparatus layers and co-fire when both are deployed"
  - "operationally distinct from lex-a5dmb simulation-as-diagnostic-probe: lex-a5dmb is a DELIBERATE PROBE to elicit a target's tells (Hamlet's Mousetrap to elicit Claudius's guilt). lex-ctnnx is APPARATUS POSITIONING (the medium engineers any viewer's stance, not just a single target's). Cross-fire: the Mousetrap-play within Hamlet IS simultaneously lex-a5dmb (probing Claudius) AND lex-ctnnx (engineering the theater audience's stance toward the King). Different functions in the same scene; the atoms distinguish them"
  - "operationally adjacent to lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz supplies the metacognitive discipline that lex-ctnnx *demands* of any critical viewer. Noticing the engineering is descriptive metacog; routing-the-noticing-into-action (refusing the engineered stance, choosing a counter-stance, rewriting the apparatus) is operational. Mulvey's whole 'destruction of pleasure as a radical weapon' (p.7) is the lex-wtkuz-operationalization of lex-ctnnx-recognition. A reader of lex-ctnnx who only descriptively notes 'the medium positioned me' fails the lex-wtkuz test"
critical-questions:
  - "the three-looks audit: in this medium, what are the analogs of (i) the apparatus's look (camera, broadcast frame, game-engine, head-tracker); (ii) the characters' looks (in-narrative figures, in-game NPCs, in-broadcast subjects, in-AR-scene avatars); (iii) the audience's look (the viewer's own positioning)? Practitioner-rule (Mulvey p.17): the apparatus generally suppresses (i) and (iii) and elevates (ii) to make the engineering invisible. Naming the suppressions is the first move of any apparatus-criticism. If you can name the three looks and which ones are suppressed, you have the engineered-stance in view"
  - "the conflation-detection question: at which moments does the apparatus deliberately fuse two looks into one? Mulvey's device-of-the-show-girl (p.12) is the textbook case: a woman performs within the narrative SO THAT the spectator's gaze and the male characters' gaze experience-as-one. Practitioner-question: where in this work are the apparatus's hidden-fusions? Look for moments where the diegesis pauses for spectacle (close-ups, musical numbers, slow-pans, action set-pieces); these are where the engineering is most active. The fusion is the engineering"
  - "the directional-choice diagnostic (Hitchcock vs Sternberg, Mulvey pp.15-17): the apparatus can engineer in opposite directions — full-conflation-then-expose-as-complicit (Hitchcock) vs break-the-protagonist-mediation-into-pure-spectacle (Sternberg). Both are choices, both are designed. Practitioner-question: which direction is THIS apparatus engineering? Is the spectator drawn-deeper-then-implicated, or pulled-out-into-frank-fetishism, or some third direction? The naive viewer experiences whichever choice the apparatus made as 'how the medium naturally is'; the engineered-stance recognition denaturalizes that"
  - "the lex-wtkuz operational test: are you NOTICING the engineering (descriptive) or are you ACTING on the noticing (operational)? Mulvey's 'destruction of pleasure as a radical weapon' is the operational move: refusing the engineered stance, choosing a counter-stance, redesigning the apparatus to engineer something else. Practitioner-discipline: when you notice apparatus-positioning, the next-action is not to congratulate-self-on-noticing but to PICK a different stance (counter-conflation, deliberate-distance, refusal-of-spectacle) or redesign the apparatus. Descriptive-noticing without action-routing is garnish; lex-ctnnx takes lex-wtkuz as its required-companion atom"
  - "the cheap test for any new medium: when handed any new apparatus (new game, new AR experience, new chatbot interface, new social-network feed-design), spend 5 minutes asking 'what stance is being engineered here?' Look for the three-looks structure, name the suppressions, find the fusions, identify the direction. The cheap test is not 'do I like this?' (recipient-aesthetic-judgment) but 'what stance is the apparatus engineering?' (apparatus-criticism). If you cannot name the engineered stance after 5 minutes of inspection, the apparatus is operating below your inspection threshold and lex-ctnnx-risk is high"
status: active
