id: lex-samuk
name: conceal-a-leadership-vacuum-only-long-enough-to-secure-real-control
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a leader dies, becomes incapacitated, or otherwise leaves a power vacuum, don't treat concealing that fact as an end in itself — treat it as a time-buying tactic whose only legitimate purpose is to let you physically secure the actual levers of control before anyone else can act on the news. Kautilya's chief councillor, facing a dying or seriously ill king, first slows the leak of information: 'Well before the anticipated death of the king, the councillor shall... allow visitors [to see the king] once in a month or two; [in order to conceal the seriousness of the king's illness]... on the plea that the king was very busy in performing special rites... When [unavoidably] necessary, a double of the king may be shown to the people and envoys... at such times when the deception would not be obvious; the double shall hold discussions with envoys [only] through the councillor. With the connivance of the Commandant of the Palace Guards and the King's Chamberlain, the councillor shall give the impression that the king performs all his daily duties.' Crucially, the concealment is not a passive stall — it is the cover under which the harder, slower, physical work of securing control actually happens: 'The councillor shall collect both the treasury and the army together in one place, either within the fort or at the frontier, and place them under the charge of two trustworthy men. Princes, close relatives of the king and important officials shall also be brought together under some pretext.' The concealment buys exactly the window needed to consolidate the treasury, the army, and the key people who could contest the succession into positions the councillor already controls — only once that physical consolidation is complete does the plan move to the next phase (installing a legitimate successor and announcing the death). The specific failure this guards against is what happens when news of a vacuum spreads BEFORE control is consolidated: rival claimants, external enemies, and internal factions all move to exploit the opening while whoever should be securing the state's actual assets is still occupied with managing the news itself. Diagnostic move: when facing a leadership vacuum (a sudden departure, an incapacitating illness, a resignation not yet public), ask specifically what physical or structural control still needs to be secured before the news becomes public, and treat any information-control effort as justified only for exactly as long as that securing work takes — concealment that outlasts the consolidation it was meant to protect stops being a tactic and becomes its own liability, since a vacuum discovered to have been concealed longer than necessary reads as deception for its own sake rather than as a stabilizing measure."
