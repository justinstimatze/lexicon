lineage:
  - source: primary
    text: taleb-2007-black-swan
    citation: "Nassim Nicholas Taleb, *The Black Swan: The Impact of the Highly Improbable* (Random House, 2007; expanded 2nd ed. 2010). The transferable claim is the triplet definition: an event is a Black Swan if it is (1) outside the realm of regular expectations, (2) carries extreme impact, AND (3) is retrospectively (but not prospectively) explainable. The book extends Taleb's *Fooled by Randomness* (2001) and is followed by *Antifragile* (2012, on disk as Taleb-2012-Antifragile.epub; some primitives — barbell-strategy lex-975pa, via-negativa lex-gfb9k — are mined from Antifragile). The 2007 book introduces several adjacent primitives that compose with the Black Swan triplet but are distinct: NARRATIVE FALLACY (the post-hoc construction of causal stories), LUDIC FALLACY (mistaking idealized games-of-chance for real-world uncertainty), MEDIOCRISTAN vs EXTREMISTAN (domains where the average dominates vs domains where the tail dominates), the TURKEY PROBLEM (induction from past evidence fails the moment before the turning point), the PLATONIC FOLD (the boundary where formal models break against messy reality). Some of these are mintable as separate atoms if transferable yield warrants; this atom mines the central triplet-definition claim. Empirical confirmation: the financial crisis of 2008 (the year after publication) became a paradigm case — quants using Gaussian VaR models had no probability mass on the actual outcome. Taleb's pre-2008 critique of the financial-risk-modeling literature was specifically about Black-Swan-blindness."
    quote: "[Taleb 2007 Prologue 'On the Plumage of Birds':] 'What we call here a Black Swan (and capitalize it) is an event with the following three attributes. First, it is an outlier, as it lies outside the realm of regular expectations, because nothing in the past can convincingly point to its possibility. Second, it carries an extreme impact. Third, in spite of its outlier status, human nature makes us concoct explanations for its occurrence after the fact, making it explainable and predictable. I stop and summarize the triplet: rarity, extreme impact, and retrospective (though not prospective) predictability. A small number of Black Swans explain almost everything in our world, from the success of ideas and religions, to the dynamics of historical events, to elements of our own personal lives.' [Same prologue on the asymmetric epistemic claim:] 'Black Swan logic makes what you don't know far more relevant than what you do know. Consider that many Black Swans can be caused and exacerbated by their being unexpected.' [On the prescription:] 'Black Swans being unpredictable, we need to adjust to their existence (rather than naïvely try to predict them). There are so many things we can do if we focus on antiknowledge, or what we do not know. Among many other benefits, you can set yourself up to collect serendipitous Black Swans (of the positive kind) by maximizing your exposure to them.' [On the expert-forecasting-failure subclaim:] 'Our inability to predict in environments subjected to the Black Swan, coupled with a general lack of the awareness of this state of affairs, means that certain professionals, while believing they are experts, are in fact not. Based on their empirical record, they do not know more about their subject matter than the general population, but they are much better at narrating — or, worse, at smoking you with complicated mathematical models.' [On the personal exercise the reader can do:] 'Count the significant events, the technological changes, and the inventions that have taken place in our environment since you were born and compare them to what was expected before their advent. How many of them came on a schedule? Look into your own personal life, to your choice of profession, say, or meeting your mate, your exile from your country of origin, the betrayals you faced, your sudden enrichment or impoverishment. How often did these things occur according to plan?'"
canonical-instances:
  - "The 2008 financial crisis (one year after Taleb's book published): Gaussian-distribution VaR models used by major banks assigned essentially zero probability to mortgage-default-correlation cascading. The crisis occurred; banks lost amounts their models said were impossible. The retrospective narrative ('housing bubble, subprime lending, derivative leverage') makes the crisis FEEL inevitable in 2026, but in 2007 it was not on most experts' prediction lists. Paradigmatic Black Swan."
  - "World War I (Taleb's central example): in summer 1914, very few experts predicted a multi-year continental war. The retrospective narrative ('alliance system, arms race, Sarajevo assassination') makes WWI feel inevitable from 2026, but the actual onset and scope were not foreseen by the diplomatic and military expert community in early 1914. Outlier-extreme-impact-retrospectively-explained — the triplet fits cleanly."
  - "The internet's emergence and transformative impact (Taleb's other central example): in 1985 no one's 25-year forecast had 'global instant-communication network reshaping commerce, politics, intimacy, work, identity' on the list. The retrospective narrative ('ARPANET, TCP/IP, Tim Berners-Lee, browser wars') makes it feel inevitable now. Same triplet."
  - "Personal-life Black Swans (Taleb's reader-exercise application): meeting your spouse, your career trajectory, your most consequential friendships, the financial windfalls and disasters — most of these were not on your 10-year-prior prediction list. Yet retrospectively each has a narrative that makes it feel coherent. The triplet operates at personal scale, not just historical scale."
  - "Distinguished from lex-tfpzb survivorship-bias: survivorship-bias is the sampling distortion (we only see survivors). Black-swan-triplet is about the dominance of outliers in actual histories regardless of sampling. The two compose — survivorship-bias makes Black Swan outcomes look more controllable in retrospect than they were."
  - "Distinguished from lex-eb3wf prospective-hindsight (Klein's pre-mortem): pre-mortem is a SPECIFIC TECHNIQUE for surfacing one's foreseen-but-suppressed concerns. Black Swans are precisely the cases pre-mortem CANNOT surface, because they're outside the practitioner's hypothesis space entirely. Pre-mortem helps with known-but-unwelcome possibilities; Black-Swan thinking helps with unknown-unknowns."
  - "Distinguished from lex-7tvr6 outside-view base-rate forecasting: outside-view works when the relevant reference class is well-defined and Mediocristan-like (most events near the mean). Outside-view systematically FAILS in Extremistan reference classes where tail events dominate the cumulative outcome. Black-Swan framework names the limit case where the standard prediction toolkit breaks down."
  - "Composes with lex-2kjmb free-energy-principle: organisms minimize EXPECTED surprise but Black Swans are events the generative model assigned essentially zero probability to. The Black Swan framework names the limit case where surprise-minimization breaks down structurally (not because the organism failed to update, but because the model couldn't represent the event-type at all)."
critical-questions:
  - "Is the Black-Swan claim FALSIFIABLE or just retrospectively decorating any surprising event? Taleb's defense: the claim is about the DOMINANCE of tail events in cumulative impact, which is empirically testable in any domain (compare top-1% of events' contribution to the median 50%'s contribution). In some domains (book-sales, war-deaths, market-crashes, internet-traffic) the dominance is overwhelming; in others (heights, IQ, calorie-intake) it is not. Taleb distinguishes EXTREMISTAN (tail-dominated) from MEDIOCRISTAN (well-behaved); the Black Swan claim applies in Extremistan."
  - "Doesn't survivor-bias / narrative-fallacy mean we should DISCOUNT Taleb's own retrospective examples (WWI, internet, 9/11)? Partly yes — Taleb is aware of this. His defense: the FREQUENCY with which retrospectively-explained-but-prospectively-unforeseen events shape outcomes is itself the empirical claim. He cites Tetlock 2005 *Expert Political Judgment* (lex-7tvr6 territory) as supporting evidence: expert forecasters in Black-Swan domains have empirical accuracy indistinguishable from chance."
  - "Have you accounted for the difference between domains? Mediocristan domains (where averages are stable and tails decay quickly — heights, IQ, calorie intake) are NOT Black-Swan-dominated; standard statistical tools work there. Extremistan domains (where the tail dominates cumulative impact — book sales, war casualties, technology adoption, market returns) ARE Black-Swan-dominated. Applying Black-Swan logic to Mediocristan domains is overreach."
  - "Does this atom counsel against ALL prediction? No. It counsels against UNDERESTIMATING the impact of what you can't predict, and against treating prediction models that exclude tail events as adequate. Sober prediction with appropriate humility about tail-risk is consistent with the framework; overconfident prediction with Gaussian-tailed models is not."
  - "How does this compose with antifragility (Taleb 2012)? The Black Swan diagnosis MOTIVATES the antifragile prescription: design systems that BENEFIT from volatility rather than merely surviving it. Antifragility is the constructive follow-up; Black Swan is the diagnostic prior. They are tightly coupled but distinct claims."
