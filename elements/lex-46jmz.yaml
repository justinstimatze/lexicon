id: lex-46jmz
name: pleasure-and-pain-arrive-paired-chasing-one-guarantees-the-other
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A counter-argument to ''but pleasure feels good'' can concede the feeling entirely while insisting that pleasure is structurally paired with an equal and following pain, so that chasing one guarantees the other — reframing short-term hedonic pursuit as a wash rather than a net gain. In the Jataka''s tale of Indriya, the teacher Sarabhanga makes exactly this argument to Narada: "Happiness and misery ever on each other''s footsteps press: Thou hast seen their alternation: seek a truer happiness."'
related: []
evokes: [jataka, atthanipata, indriya-jataka, opponent-process, pleasure-and-pain-as-a-wash]
lineage:
  - source: primary
    text: jataka-chalmers1895-indriya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 423, Indriya-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Happiness and misery ever on each other's footsteps press: Thou hast seen their alternation: seek a truer happiness."
canonical-instances:
  - "A mentor doesn't dispute that a big win feels euphoric, and points out instead that every one of the trader's past euphoric wins has been followed by an equally sized crash within the month — the feeling is real, but it's never the whole ledger."
critical-questions:
  - "Does conceding that the pleasure is genuine, rather than denying it, make this argument more persuasive than simply telling someone the pleasure isn't real?"
  - "Is the pairing of pleasure and pain a fixed law, or does it only hold for certain kinds of pleasure — and how would someone tell which kind they're chasing?"
status: active
