  - source: primary
    text: grant-2021-think-again
    citation: "Adam Grant, Think Again: The Power of Knowing What You Don't Know (Viking, 2021), Ch.1 'A Preacher, a Prosecutor, a Politician, and a Scientist Walk into Your Mind.' Grant (organizational psychologist, Wharton) builds the chapter's central typology on his colleague Philip Tetlock's 2002 Psychological Review paper 'Social Functionalist Frameworks for Judgment and Choice: Intuitive Politicians, Theologians, and Prosecutors' (cited in Grant's endnotes), and extends Tetlock's three-mode frame by naming the productive fourth pole, scientist mode, as its explicit contrast case. Section 'SECOND THOUGHTS' (chapter opening) establishes the first-instinct fallacy, the eraser-marks study, and the seizing-and-freezing framing of belief-rigidity; 'A DIFFERENT PAIR OF GOGGLES' introduces scientist mode via the Italian-startup scientific-thinking field experiment; 'THE SMARTER THEY ARE, THE HARDER THEY FAIL' defines actively-open-minded thinking and states the four-mode contrast on what changing one's mind means; 'DON'T STOP UNBELIEVING' names the rethinking cycle and its collapse into an overconfidence cycle under each of the three defensive modes. The chapter's running real-world example is Mike Lazaridis and the collapse of BlackBerry, presented as a gifted engineer trapped in preacher/prosecutor/politician mode about his own product. The forecasting-tournament evidence for scientist mode's accuracy payoff appears later in the book, in the chapter on confidence (source text extracted as continuous plaintext without stable page numbers; cited here by chapter and section heading)."
    quote: "[The three defensive mindsets, Ch.1 opening:] 'Two decades ago my colleague Phil Tetlock discovered something peculiar. As we think and talk, we often slip into the mindsets of three different professions: preachers, prosecutors, and politicians. In each of these modes, we take on a particular identity and use a distinct set of tools. We go into preacher mode when our sacred beliefs are in jeopardy: we deliver sermons to protect and promote our ideals. We enter prosecutor mode when we recognize flaws in other people's reasoning: we marshal arguments to prove them wrong and win our case. We shift into politician mode when we're seeking to win over an audience: we campaign and lobby for the approval of our constituents. The risk is that we become so wrapped up in preaching that we're right, prosecuting others who are wrong, and politicking for support that we don't bother to rethink our own views.' [The Greenspan/Madoff instance of all three converging on one decision:] 'When Stephen Greenspan and his sister made the choice to invest with Bernie Madoff, it wasn't because they relied on just one of those mental tools. All three modes together contributed to their ill-fated decision. When his sister told him about the money she and her friends had made, she was preaching about the merits of the fund. Her confidence led Greenspan to prosecute the friend who warned him against investing, deeming the friend guilty of \"knee-jerk cynicism.\" Greenspan was in politician mode when he let his desire for approval sway him toward a yes—the financial adviser was a family friend whom he liked and wanted to please.... That would have put him in the mode of a scientist.' [Scientist mode as the fourth, productive frame of mind, 'A DIFFERENT PAIR OF GOGGLES':] 'But being a scientist is not just a profession. It's a frame of mind—a mode of thinking that differs from preaching, prosecuting, and politicking. We move into scientist mode when we're searching for the truth: we run experiments to test hypotheses and discover knowledge. Scientific tools aren't reserved for people with white coats and beakers, and using them doesn't require toiling away for years with a microscope and a petri dish.' [Even trained scientists can defect into the other three modes, same section:] 'Just as you don't have to be a professional scientist to reason like one, being a professional scientist doesn't guarantee that someone will use the tools of their training. Scientists morph into preachers when they present their pet theories as gospel and treat thoughtful critiques as sacrilege. They veer into politician terrain when they allow their views to be swayed by popularity rather than accuracy. They enter prosecutor mode when they're hell-bent on debunking and discrediting rather than discovering.' [Actively-open-minded thinking as scientist mode's operational content, 'THE SMARTER THEY ARE, THE HARDER THEY FAIL':] 'When we're in scientist mode, we refuse to let our ideas become ideologies. We don't start with answers or solutions; we lead with questions and puzzles. We don't preach from intuition; we teach from evidence. We don't just have healthy skepticism about other people's arguments; we dare to disagree with our own arguments. Thinking like a scientist involves more than just reacting with an open mind. It means being actively open-minded. It requires searching for reasons why we might be wrong—not for reasons why we must be right—and revising our views based on what we learn.' [The four-mode contrast on what changing your mind means, same section:] 'That rarely happens in the other mental modes. In preacher mode, changing our minds is a mark of moral weakness; in scientist mode, it's a sign of intellectual integrity. In prosecutor mode, allowing ourselves to be persuaded is admitting defeat; in scientist mode, it's a step toward the truth. In politician mode, we flip-flop in response to carrots and sticks; in scientist mode, we shift in the face of sharper logic and stronger data.' [The rethinking cycle collapsing into an overconfidence cycle, 'DON'T STOP UNBELIEVING':] 'Scientific thinking favors humility over pride, doubt over certainty, curiosity over closure. When we shift out of scientist mode, the rethinking cycle breaks down, giving way to an overconfidence cycle. If we're preaching, we can't see gaps in our knowledge: we believe we've already found the truth. Pride breeds conviction rather than doubt, which makes us prosecutors: we might be laser-focused on changing other people's minds, but ours is set in stone. That launches us into confirmation bias and desirability bias. We become politicians, ignoring or dismissing whatever doesn't win the favor of our constituents—our parents, our bosses, or the high school classmates we're still trying to impress. We become so busy putting on a show that the truth gets relegated to a backstage seat, and the resulting validation can make us arrogant. We fall victim to the fat-cat syndrome, resting on our laurels instead of pressure-testing our beliefs.' [Grant's own practical compression of the atom, 'Actions for Impact':] 'Think like a scientist. When you start forming an opinion, resist the temptation to preach, prosecute, or politick. Treat your emerging view as a hunch or a hypothesis and test it with data.' [The eraser-marks study and first-instinct fallacy, 'SECOND THOUGHTS':] 'About three quarters of students are convinced that revising their answer will hurt their score.... When a trio of psychologists conducted a comprehensive review of thirty-three studies, they found that in every one, the majority of answer revisions were from wrong to right. This phenomenon is known as the first-instinct fallacy. In one demonstration, psychologists counted eraser marks on the exams of more than 1,500 students in Illinois. Only a quarter of the changes were from right to wrong, while half were from wrong to right.... it's not so much changing your answer that improves your score as considering whether you should change it.' [Seizing and freezing — beliefs get brittle while possessions get updated readily, same section:] 'Rethinking isn't a struggle in every part of our lives. When it comes to our possessions, we update with fervor. We refresh our wardrobes when they go out of style and renovate our kitchens when they're no longer in vogue. When it comes to our knowledge and opinions, though, we tend to stick to our guns. Psychologists call this seizing and freezing. We favor the comfort of conviction over the discomfort of doubt, and we let our beliefs get brittle long before our bones. We laugh at people who still use Windows 95, yet we still cling to opinions that we formed in 1995.' [Mike Lazaridis/BlackBerry as a real-world instance naming all three defensive modes explicitly:] 'In the case of the BlackBerry, Mike Lazaridis was trapped in an overconfidence cycle. Taking pride in his successful invention gave him too much conviction. Nowhere was that clearer than in his preference for the keyboard over a touchscreen. It was a BlackBerry virtue he loved to preach—and an Apple vice he was quick to prosecute. As his company's stock fell, Mike got caught up in confirmation bias and desirability bias, and fell victim to validation from fans.... Like a politician who campaigns only to his base, he focused on the keyboard taste of millions of existing users, neglecting the appeal of a touchscreen to billions of potential users.' [The forecasting-tournament evidence for scientist mode's accuracy payoff:] 'The single most important driver of forecasters' success was how often they updated their beliefs. The best forecasters went through more rethinking cycles. They had the confident humility to doubt their judgments and the curiosity to discover new information that led them to revise their predictions.... In 2021, I teamed up with Good Judgment to run an open forecasting tournament. Thousands of people filled out a survey I designed about their tendencies to think like preachers, prosecutors, politicians, and scientists. Then they made over twenty thousand forecasts.... The ones who thought like scientists updated their forecasts more often and achieved higher accuracy.'"
