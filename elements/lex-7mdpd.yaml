id: lex-7mdpd
name: humanity-as-end-never-merely-as-means
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When using someone as a means, also treat them as an end-in-themselves. Kant: never MERELY as a means. The 'merely' is the pivotal word; instrumental use is fine, instrumental-only is not. Test by asking what their continuing personhood requires of your action."
related: [lex-z9s5d, lex-n8smn, lex-h2ehw, lex-srj3h, lex-kfk68, lex-d6vbs, lex-gzgn3, lex-r3aug, lex-kxk99, lex-xuwr2, lex-kjb2b, lex-dfgda, lex-czseb, lex-acmmk, lex-m33nq, lex-bfwev, lex-e9qfp, lex-jsec3, lex-v6dz2]
scaffolds-from: [lex-d6vbs]
evokes: [rational-nature-as-end-in-itself, never-merely-instrumental, dignity-above-price, the-second-formulation, consent-as-respect-for-personhood]
lineage:
  - source: primary
    text: kant-1785-groundwork
    citation: "Immanuel Kant, *Fundamental Principles of the Metaphysic of Morals* (1785). (Project Gutenberg #5682). The Second Formulation of the Categorical Imperative (Groundwork Section II): rational beings must always be treated as ends in themselves, never merely as means to ends. The 'merely' is key — Kant does not prohibit USING others as means (we use waiters, surgeons, employees), but prohibits using them ONLY as means (without respecting their rational agency, without consent, without their interests being independently weighted). Kant takes this to be substantively equivalent to the first formulation (lex-kfk68 universalizability) but more accessible to intuition. Foundational to deontological ethics, modern bioethics (informed consent), human-rights doctrine."
    quote: "[Kant, Groundwork Section II:] 'Now I say: man and generally any rational being exists as an end in himself, not merely as a means to be arbitrarily used by this or that will... rational nature exists as an end in itself. Man necessarily conceives his own existence as being so; so far then this is a subjective principle of human actions. But every other rational being regards its existence similarly, just on the same rational principle that holds for me: so that it is at the same time an objective principle, from which as a supreme practical law all laws of the will must be capable of being deduced. Accordingly the practical imperative will be as follows: So act as to treat humanity, whether in thine own person or in that of any other, in every case as an end withal, never as means only.' [The structural claim: rational agency carries unconditional value (dignity, not price); using a rational being merely as a means without respecting their independent end-setting is a categorical violation, regardless of consequences.]"
  - source: practitioner
    text: nuremberg-code-1947-informed-consent
    citation: "Nuremberg Code (1947) and the subsequent Helsinki Declaration (1964, revised) governing biomedical research ethics. Tier-3 deepening: the foundational principle of modern research ethics — voluntary informed consent — is the operational instantiation of Kant's never-merely-as-means principle. After Nazi medical experimentation revealed what happens when human subjects are treated purely instrumentally for research aims, the international response was a strict consent-and-respect framework.; widely cited; functionally Kantian even where not explicitly cited."
    quote: "[Tier-3 deepening — Nuremberg Code 1947 Article 1: 'The voluntary consent of the human subject is absolutely essential. This means that the person involved should have legal capacity to give consent; should be so situated as to be able to exercise free power of choice...; and should have sufficient knowledge and comprehension of the elements of the subject matter involved as to enable him to make an understanding and enlightened decision.' This is Kant's principle in legal-operational form: no use of persons as research-means without their rational consent. The Helsinki Declaration extends and elaborates; the core remains Kantian.]"
  - source: primary
    text: korsgaard-1996-creating-the-kingdom-of-ends
    citation: "Christine Korsgaard, Creating the Kingdom of Ends (Cambridge University Press, 1996), Chapter 4 'Kant's Formula of Humanity,' p.120 (page marker embedded in the source). Korsgaard's own analytical move — distinct from simply restating Kant — is reading Kant's Groundwork argument as a regress toward the unconditioned: from objects of inclination, to the inclinations themselves, and finally back to the rational agent, whose own rational nature turns out to be the terminus of the regress and the source of unconditional value. The block below layers two voices: Korsgaard's own sentence, then Kant's Groundwork passage (G 429) as she quotes it."
    quote: "[Korsgaard's own analysis:] it is also possible to read this passage as at least suggesting a regress towards the unconditioned: moving from the objects of our inclinations, to the inclinations themselves, finally (later) back to ourselves, our rational nature. The final step, that rational nature is itself the objective end, is reinforced by this consideration: [Kant, Groundwork 429, as quoted by Korsgaard:] The ground of this principle is: rational nature exists as an end in itself. Man necessarily thinks of his own existence in this way; thus far it is a subjective principle of human actions. Also every other rational being thinks of his existence by means of the same rational ground which holds also for myself; thus it is at the same time an objective principle from which, as a supreme practical ground, it must be possible to derive all laws of the will."
canonical-instances:
  - "informed-consent doctrine in medicine: the patient's right to refuse treatment, the requirement that experimental procedures be voluntarily consented to, the prohibition on deceptive research designs — all instantiate Kant's never-merely-as-means principle. A doctor who treats a patient without consent (even with good prognostic intent) violates the formula; the patient is being used merely as a means to a medical outcome the doctor judges good"
  - "consent-respecting design in research ethics: the Tuskegee syphilis experiments (1932-1972) are the canonical violation — untreated black men used as research subjects for decades without consent or treatment for their illness. The post-Tuskegee response (IRBs, informed-consent requirements, the Belmont Report 1979) is Kantian-shaped reform. The transferable warning: when 'science' or 'public good' is the stated end, the temptation to violate the second formulation is acute"
  - "workplace exploitation cases: an employer who treats workers as labor-input without regard to their independent rational ends (no flexibility for life-circumstances, no voice in decisions, no fair compensation for value-produced) violates the second formulation. Use-as-means (employment is a contractual relation) is fine; use MERELY-as-means (treating the human as undifferentiated input) is not"
  - "the deception-prohibition: lying to manipulate someone into doing what you want treats them merely as a means — bypassing their rational agency, manipulating through the part of them that's vulnerable to false beliefs rather than the part that's rationally consenting. Kant takes this as basic; modern critiques of advertising-as-manipulation, propaganda, and social-media-engagement-design are squarely on this terrain"
  - "trolley problem deontological response: the second formulation is the canonical reason NOT to push the fat man off the bridge (Thomson 1985 variation) — you would be using HIM merely as a means to save the five. The trolley-problem intuition that something is morally different between diverting the trolley and pushing the man reflects the second-formulation logic. Foot 1967 and Thomson 1985 develop the distinction; both in-copyright"
  - "operationally distinct from lex-srj3h harm-principle: lex-srj3h (Mill) demarcates the limit on COERCION based on harm-to-others; lex-7mdpd (Kant) demarcates the limit on USE based on respect-for-rational-agency. They give convergent verdicts on most cases but diverge on consensual self-affecting harm: Mill's strict harm-principle says permitted; Kant's second formulation may say impermissible if the act involves the agent using themselves merely as means (e.g., his famous objection to suicide). Transferable: the principles are complementary rather than competing"
  - "operationally tightly coupled to lex-kfk68 + lex-d6vbs: lex-kfk68 (formal universalizability test), lex-7mdpd (substantive humanity-as-end content), lex-d6vbs (autonomy-as-self-legislation foundation) are Kant's three intertwined formulations of the CI. They co-fire in canonical Kantian deliberation; mastering one without the others gives a thinner moral reasoning"
  - "the transferable engineering use: in interpersonal and institutional design, ask whether the proposed arrangement respects the rational agency of all affected parties — do they have meaningful information, meaningful choice, the standing to refuse or contest? If no, the arrangement is on Kantian shaky ground even if it passes welfare-aggregation tests. Particularly relevant in AI ethics: AI systems that manipulate users via personalized persuasion bypass rational agency in the second-formulation-violating way"
critical-questions:
  - "what counts as treating someone 'merely' as a means? The threshold is contested. Standard reading: respect their rational agency = obtain consent, be honest about your aims, allow them to refuse without harm. Stricter reading: never act on motives they would not endorse. Looser reading: use as means is fine if the use is part of a mutually-beneficial arrangement they could consent to. The strict reading is too demanding; the loose reading collapses into consent-theory. Transferable middle: meaningful informed consent is the operational bar"
  - "does the formula handle non-rational beings (children, severely-disabled adults, future persons, animals)? Kant restricts the formula to rational beings; this notoriously excludes much of moral concern. Modern Kantians (Korsgaard 1996, 2018) extend by argument: marginal-case humans share enough with paradigmatic rational agents to warrant inclusion; animals get a derivative form of protection (animal cruelty corrupts the practicing agent's rational character). Transferable: the formula gives strong guidance in the paradigm case but requires supplementation at the edges"
  - "is there a tension between the second formulation and consequentialism in extremis? Yes — the classic case is the runaway-trolley fat-man variant: pushing one person to save five is forbidden by the second formulation but mandated by the GHP. The deeper puzzle: when consequences become catastrophic enough (a person you can push to save a city from nuclear annihilation), even committed Kantians waver. Threshold-deontology is one response (deontological constraints have a threshold above which consequences dominate); pure Kantians reject the threshold-move"
  - "how do you respect the rational agency of someone whose stated preferences are themselves manipulation-produced (advertising-saturated, propagandized, indoctrinated)? The second formulation demands respect for rational agency, but rational agency is fragile and socially shaped. Modern critical theorists (Frankfurt-school, Habermas's discourse ethics) extend Kant by requiring the SOCIAL CONDITIONS for autonomous agency to be in place, not just nominal-consent. Transferable: the formula's bite depends on the consent being substantive, not just signed"
status: active
