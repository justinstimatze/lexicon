id: lex-b2c6b
name: live-adaptive-coupling-is-untransmittable-only-sediment-crosses-between-minds
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating mentorship, teaching, succession, or any cross-mind / cross-generation transmission, surface that the LIVE ADAPTIVE COUPLING — current expertise indexical to the practitioner's now, their open problem-space, their evolving working models, their current calibrations — is structurally UNTRANSMITTABLE. Only SEDIMENT crosses: written language, named patterns, canonical texts, tools, tested invariants, codified procedures. Mentorship works best when reframed as SUBSTRATE-DEPOSITION (leaving the next person good rock to grow their own frontier on) rather than GROOVE-CLONING (trying to install a copy of your own live coupling in them). Diagnostic: when transmission feels stuck despite high effort, check whether you are trying to ship the live coupling (will fail; the recipient must build their own) versus depositing substrate (works; the recipient builds their own coupling on top). The transferable corollary: the more competent and specifically-indexed your current adaptation, the LESS of it can transmit — competence and untransmittability are coupled, not opposed."
