id: lex-h8qaf
name: serial-justification-replacement-reveals-a-conclusion-fixed-in-advance
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a fixed conclusion survives the refutation of its stated justification by producing a new justification, and that one survives refutation by producing yet another, the pattern itself is evidence that none of the successive justifications were ever the actual basis for holding the conclusion. This differs from a fixed narrative absorbing the same evidence by reinterpreting it (see [[lex-4fw56]], the sick man calling each worsening symptom a good sign) -- here the justification itself changes each time, discarded and replaced rather than stretched. Gilman traces the whole sequence explicitly: 'The ground is taken that the human female is not economically independent, that she is fed by the male of her species. In denial of this, it is first alleged that she is economically independent,—that she does support herself by her own industry in the house. It being shown that there is no relation between the economic status of woman and the labor she performs in the home, it is then alleged that not as house servant, but as mother, does woman earn her living. It being shown that the economic status of woman bears no relation to her motherhood... it is then alleged that motherhood renders a woman unfit for economic production, and that, therefore, it is right that she be supported by her husband.'"
related: [lex-4fw56]
evokes: [women-and-economics, chapter-i, it-is-then-alleged, driven-off-these-alleged-grounds, moving-the-goalposts-in-series]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-i
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter I. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "The ground is taken that the human female is not economically independent, that she is fed by the male of her species. In denial of this, it is first alleged that she is economically independent,—that she does support herself by her own industry in the house. It being shown that there is no relation between the economic status of woman and the labor she performs in the home, it is then alleged that not as house servant, but as mother, does woman earn her living. It being shown that the economic status of woman bears no relation to her motherhood, either in quantity or quality, it is then alleged that motherhood renders a woman unfit for economic production, and that, therefore, it is right that she be supported by her husband."
canonical-instances:
  - "A company defends a controversial policy first on cost-saving grounds; when the numbers don't support that, it defends the same policy on safety grounds; when safety data contradicts that too, it shifts to defending the policy as industry standard -- the policy itself never changes, only the stated reason for it."
  - "A parent tells a teenager they can't attend a trip because it's too expensive; when the teenager offers to cover the cost, the reason shifts to not enough adult supervision; when that's addressed, the reason shifts again to too much homework -- the answer was always going to be no."
  - "An institution facing calls to diversify hiring first cites a lack of qualified candidates; when qualified candidates are produced, it cites cultural fit concerns; when that's challenged, it cites budget constraints -- each ground is abandoned only once directly disproven, never examined together as a set."
critical-questions:
  - "How do you distinguish this pattern from a genuinely complex situation with multiple real, independently-true reasons, where a person reasonably leads with one reason and mentions others only when the first is challenged, without the underlying position ever having been fixed in advance?"
  - "Does identifying this pattern in someone's argument actually refute their conclusion, or does it only establish that their stated reasoning was untrustworthy -- the conclusion itself could still happen to be true even if every offered justification for it turns out to be a post-hoc rationalization?"
  - "Gilman is diagnosing a systemic, culture-wide pattern of argument rather than one person's individual dishonesty -- does the mechanism work differently when a whole society defends an arrangement it did not consciously decide to defend, versus when a single arguer is knowingly shifting ground?"
status: active
