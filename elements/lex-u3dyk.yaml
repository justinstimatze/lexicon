id: lex-u3dyk
name: winning-power-does-not-transfer-the-losers-legitimacy-to-the-victor
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a new power formally replaces an old one, don't expect the felt sense of legitimacy to transfer at the moment of victory. The old order built its legitimacy slowly, over a long accumulation of habit and acceptance; the new order has to build its own the same slow way, and until it does, it behaves like a usurper even though it has already won. Lukács states the asymmetry directly: 'the bourgeoisie did not lose the sense of its own legality after a single defeat, and similarly the proletariat cannot possibly gain a consciousness of its own legality through the fact of a single victory.' Watch for two concrete symptoms rather than a vague mood shift. First, the new power fails to dismantle things that ought to be destroyed, because it still unconsciously treats the old order's institutions as legitimate -- 'its failure to lay hands on much that ought to be utterly destroyed' -- and it governs with 'the mixture of vacillation and haste characteristic of the usurper' rather than the assurance of settled rule. Worse, officials who privately expect the old order to eventually return hedge their conduct accordingly: Lukács names this as one real mechanism behind corruption inside a new regime, officials 'inwardly prepared for the return of a \"legitimate\" capitalism' positioning themselves to justify their actions once it does."
related: []
evokes: [georg-lukacs, history-and-class-consciousness, legality-and-illegality, usurper-psychology, legitimacy-is-not-conferred-by-victory, hedging-against-restoration]
lineage:
  - source: primary
    text: lukacs-1923-history-and-class-consciousness-legality-and-illegality-legitimacy-lag
    citation: "Georg Lukács, History and Class Consciousness (Malik-Verlag, 1923; Verso 2023 centenary edition, trans. Rodney Livingstone), essay 'Legality and Illegality,' §3."
    quote: "“Under the dictatorship of the proletariat the relationship between legality and illegality undergoes a change in function, for now what was formerly legal becomes illegal and vice versa. However, this change can at most accelerate somewhat the process of emancipation begun under capitalism; it cannot complete it at one stroke. The bourgeoisie did not lose the sense of its own legality after a single defeat, and similarly the proletariat cannot possibly gain a consciousness of its own legality through the fact of a single victory.”"
  - source: primary
    text: lukacs-1923-history-and-class-consciousness-legality-and-illegality-usurper-symptoms
    citation: "Georg Lukács, History and Class Consciousness (Malik-Verlag, 1923; Verso 2023 centenary edition, trans. Rodney Livingstone), essay 'Legality and Illegality,' §3."
    quote: "“Having accustomed itself to surrounding the institutions of capitalism with an aura of legality it finds it difficult to view with detachment the surviving remains which may endure for a very long time. Once the proletariat has gained power it still remains enmeshed intellectually in the trammels woven by the course of capitalist development. This finds expression, on the one hand, in its failure to lay hands on much that ought to be utterly destroyed. On the other hand, it proceeds to the labour of demolition and construction not with the sense of assurance that springs from legitimate rule, but with the mixture of vacillation and haste characteristic of the usurper.”"
canonical-instances:
  - "The direct textual anchor: Lukács traces one specific strand of the corruption he's diagnosing to exactly this gap -- 'many soviet officials who were inwardly prepared for the return of a ‘legitimate’ capitalism and who were therefore intent on being able to justify their own actions when it became necessary' -- this corruption traces to a rational hedge against a restoration the officials privately still expect, not to generic venality."
  - "Hypothetical: a company installs a new CEO after a hostile board coup. Rather than reorganizing the org chart around the new strategy, the CEO leaves several of the old regime's pet projects quietly running and avoids firing the previous CEO's closest allies -- not out of mercy, but because some part of the new leadership still isn't sure the old guard won't be back, and wants a story ready either way. Meanwhile several VPs hedge their own loyalty for the identical reason."
critical-questions:
  - "Is the legitimacy-lag itself the cause of the usurper symptoms, or could the same vacillation and incomplete demolition show up for an unrelated reason -- genuine uncertainty about which parts of the old system are actually worth keeping -- making the 'usurper psychology' diagnosis a specific claim about MOTIVE that's hard to distinguish from ordinary caution by its outward symptoms alone?"
  - "Lukács frames this as something only time and struggle can fix (the proletariat's legitimacy 'will only ripen by degrees'). Are there deliberate interventions that can accelerate a new power's felt legitimacy faster than passive time-passing, or does the argument imply that any attempt to manufacture legitimacy quickly repeats the same mistake as expecting it to transfer automatically at the moment of victory?"
