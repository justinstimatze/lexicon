name: fighting-harder-isnt-evidence-of-being-the-real-one
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you can't tell an impostor apart from the real thing and the stakes force a decision anyway, don't reach for a plausible-sounding behavioral tiebreaker unless you've actually verified it discriminates the two -- confident-sounding heuristics about how the fake one would act are frequently backward, because the real claimant often has more at stake and therefore behaves more like what you'd expect from the fraud. In Cushing's telling, a witch-sister disguises herself perfectly as her rival's twin -- 'nobody could have known the one from the other' -- and confronts the real bride in an identical struggle, indistinguishable in dress, voice, and behavior. The young man, forced to intervene, reaches for a heuristic instead of admitting he cannot tell them apart: 'thinking that the bad one must know how to fight better than his beautiful maiden wife, he suddenly caught up his stone-weighted hoe, and furiously struck the one that was uppermost.' The heuristic is exactly backward -- his real wife, fighting for her actual life and claim, was the one on top, while the fraud, secure in her disguise and with nothing genuine to lose, could afford to fight less desperately. He kills his own bride on the strength of an assumption he never tested, mistaking intensity of struggle for proof of villainy. Diagnostic move: when two claimants are truly indistinguishable and you're tempted to break the tie with a behavioral inference -- 'the real one would act calmer,' 'the fake one would fight harder' -- stop and ask whether that inference has ever actually been verified to discriminate the two cases; a genuine claimant defending something real often looks exactly like what you'd expect from someone faking it, and an untested heuristic applied under time pressure can select for the impostor and eliminate the real thing."
