evokes: [jataka, dukanipata, viticcha-jataka, exhausting-the-category-space-closes-an-infinite-regress-demand, a-sophistic-trap-requires-an-undisclosed-remaining-option]
lineage:
  - source: primary
    text: jataka-chalmers1895-viticcha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 244, Viticcha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "What is Ganges? Ganges may be sand, Ganges may be water, Ganges may be the near bank, Ganges may be the far bank!... Besides the sand, the water, the hither and the further bank, what other Ganges can you have?"
canonical-instances:
  - "A vendor stalls a contract dispute by repeatedly demanding ever-more-precise definitions of 'reasonable delivery time,' and the buyer's lawyer closes the tactic in one move by pointing out the contract's own definitions section already enumerates every measurable condition the term could refer to, leaving no undefined case left to dispute."
critical-questions:
  - "Does this move actually work against every sophistic definition trap, or only against ones where the category space genuinely is finite and enumerable — what happens when the disputed term has a real, irreducible vagueness that isn't just a rhetorical trick?"
  - "How does the ascetic know with confidence that sand, water, and the two banks are truly exhaustive, rather than simply the four options the pilgrim happened to name — could the pilgrim have pushed back by naming a fifth?"
