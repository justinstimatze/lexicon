id: lex-mwhg7
name: narrow-protected-scope-manufactures-confidence-widening-it-reveals-the-cost
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A trainee's growing sense of mastery at an intermediate stage can be a genuine skill gain, or it can be an artifact of a scope that has been deliberately kept narrow — and the two are indistinguishable from the inside until the scope widens. Fox names the Cornell third-year student's confidence 'premature' for exactly this reason: his responsibilities are 'carefully circumscribed... he does not have to decide upon medicaments and other therapeutic procedures... A student's responsibilities in the clinic are equally limited and specific,' and crucially he almost never sees the same patient twice, so he never learns what happened after his own encounter with the case ended. The scaffolding is invisible from inside it: 'reviewing the charts of patients he examined in General Surgery as a Junior, a fourth-year student was \"amazed to discover\" that some of the cases he saw were never resolved.' The same pattern shows up at the level of a single case rather than a whole training stage: a case a student calls 'classical' and 'clear-cut' on first contact — Mrs. B., a textbook thyroid presentation — only reveals its true complexity (family conflict, a husband's job, a daughter's health, a psychological overlay to the physical symptoms) across repeated follow-up visits: 'had he seen her only once, this student would not have had any reason to alter his original impression that the case of Mrs. B. was diagnostically and therapeutically \"clear-cut.\"' Both are the same underlying mechanism at different grain: narrowing either the RESPONSIBILITY a person carries or the DURATION/continuity of their contact with a problem systematically hides the complexity that a wider aperture would expose, and confidence built inside the narrow aperture does not survive the widening — it collapses on contact with what the narrowness was concealing, not because the person got worse, but because the earlier apparent success was measuring the wrong thing. Diagnostic move: before crediting confidence or a low error rate as evidence of real competence, check the scope it was earned inside — short, non-repeated exposure to a problem and circumscribed responsibility for its outcome both systematically under-report the true difficulty, and a genuine test of the underlying skill requires widening scope on purpose (following through to resolution, taking on full responsibility) rather than trusting a track record built entirely inside a narrow one."
