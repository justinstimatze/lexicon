id: lex-yj6kp
name: a-group-has-only-three-endings-for-a-threshold-disruptor
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "A group confronted with a disruptive outsider or boundary-crosser has a narrow repertoire of possible endings, not an open field of options: the disruptor can be pulled fully inside and domesticated, driven out or destroyed, or left permanently unresolved at the threshold, neither joining nor leaving. Hyde extracts this from the shape of trickster narratives generally: 'From the edge of a group or the threshold of a house there are only a few ways a trickster can move: he can come inside, he can leave entirely, or he can stay exactly where he started, resisting all attempts to civilize or exile.' Each resolution has recognizable cases. Permanent liminality produces stories with no real ending -- 'the endlessly strung-together Coyote tales each linked to each with the phrase \"Coyote was going along ...\" or... the picaresque narrative in which the pícaro... wanders from town to town, individual episodes ending but not the tale itself because the pícaro never changes.' Domestication brings the disruptor inside on the group's terms -- Hyde notes narrators visibly working to get 'Wakdjunkaga married... Eshu away from the crossroads and into Ifa's house... Monkey out of the Peach Garden and make him bow to the Buddha... Loki to be a proper guest... Coyote to take a bride.' And exile or destruction ends the disruption by removing the disruptor -- 'Apollo threatening to throw Hermes into darkest Tartarus... In an Alaskan story, Wise One gets tired of Raven's incessant thieving and burns him to death.' Diagnostic move: when a group is dealing with a persistent disruptor, don't treat the situation as open-ended -- name which of the three endings is actually in play (full absorption, removal, or an unresolved standoff that simply continues), because each produces a structurally different kind of story or institutional history, and mistaking one for another (expecting domestication when the real trajectory is toward exile, or vice versa) means misreading which ending is actually being written."
