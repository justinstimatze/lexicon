lineage:
  - source: primary
    text: kautilya-arthashastra-embroil-the-ally-about-to-grow-too-powerful
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Allies and Vassal Kings,' 'Attitude to Allies,' {7.18.31-42}."
    quote: "'An ally who is likely to grow in power after defeating the enemy and thus become uncontrollable shall be embroiled in a conflict with his own neighbour and his own ally; or, a pretender in his family or an unjustly treated prince shall be encouraged to seize the throne; or such actions shall be taken as would oblige the ally to remain obedient, in return for help received.'"
canonical-instances:
  - "A larger company partners with a smaller startup to jointly defeat a shared competitor, and just as the startup is about to fully capture the freed-up market share, the larger company steers a new, resource-intensive joint initiative toward the startup -- not to sabotage it, but to keep it structurally dependent on the partnership's continued resources rather than letting it walk away as an independent, now-larger rival."
  - "A senior executive who has been mentoring a rising deputy through a successful turnaround assigns that deputy a new, genuinely demanding cross-departmental project just as the original turnaround is about to conclude, ensuring the deputy remains reliant on the executive's continued support and visibility rather than emerging from the success with enough independent credibility to leave or compete for the executive's own position."
critical-questions:
  - "does deliberately embroiling a successful ally in a manufactured conflict risk being discovered, and if the ally recognizes the pattern, does it convert a grateful, loyal partner into a resentful one who now has independent reason to distrust every future request for help -- does the tactic's success depend entirely on the ally never seeing through it?"
  - "is there a meaningful ethical or practical difference between this tactic and simply betraying an ally's trust the moment they've served their purpose -- if the manufactured obligation offers the ally no genuine benefit of its own, does 'keeping them embroiled' functionally reduce to using them and then trapping them, dressed up as continued partnership?"
  - "how would a party distinguish, in real time, an ally who is about to become genuinely too powerful to control from one who is simply succeeding at the task they were asked to do -- does this framework risk triggering a self-fulfilling erosion of trust with every sufficiently successful ally, regardless of whether they ever showed signs of wanting independence?"
