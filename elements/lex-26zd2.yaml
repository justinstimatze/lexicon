id: lex-26zd2
name: the-register-of-address-in-a-request-sets-the-reward-given
type-in: process
type-out: process
_tier: atomic
agent-instruction: "How intimately someone frames their relationship to you when asking for something can function as the actual variable a giver responds to, independent of the size or reasonableness of the request itself — escalating the claimed closeness escalates what you receive. In the Jataka's tale of the hunter and the four merchants' sons, each successive youth begs for venison using a warmer term of address, and the hunter matches the reward exactly to the intimacy claimed: a curt 'Hi, Sirrah' earns 'mere skin and bone,' while addressing him as universal 'friend' earns the whole cartload — outranking even the youth who called him 'father': 'A world without friends, I venture to think, a wilderness surely must be, In that title of friend all that's dear is implied, so I give all the deer unto thee.'"
related: []
evokes: [jataka, catukkanipata, mamsa-jataka, claimed-intimacy-not-request-size-sets-the-reward, friend-outranks-father-in-the-hunters-accounting]
