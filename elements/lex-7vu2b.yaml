id: lex-7vu2b
name: judgment-outranks-military-might-which-outranks-raw-enthusiasm
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When assessing whether you're actually positioned to win a confrontation, don't default to comparing personal courage or raw resources -- Kautilya ranks three components of power in ascending order of importance, and the ranking is settled through two successive debates that each name a specific mechanism for why the higher-ranked component wins. First, might over mere enthusiasm: 'Some teachers hold enthusiasm to be more important than might. [They argue:] so long as a king is himself brave, strong, healthy and expert in the use of weapons, he can defeat, with only the army to help him, even a mightier king. Kautilya disagrees. A mighty king, by his very might, can overpower an energetic one; for, a mighty army, richly endowed with horses, elephants, chariots and instruments of war, can move unhindered anywhere. Further, a mighty king can get the help of another energetic one or he can hire or buy heroic fighters. [It is known that] even women, children, the lame and the blind have conquered the world after winning over or buying heroic fighters with their might.' The mechanism: personal enthusiasm and courage are non-transferable and don't scale, while might (resources, wealth, an assembled army) can simply purchase or recruit the enthusiasm and courage it lacks -- might subsumes enthusiasm's advantage but enthusiasm cannot buy might's. Second, judgment over might itself: 'Some teachers hold might to be more important than the power of good counsel and judgment. [They argue:] however good a king's analysis and judgment, he thinks but empty thoughts if he has no power. Just as a drought dries out the planted seeds, good judgment without power produces no fruit. Kautilya disagrees. The power of good counsel, [good analysis and good judgment] is superior [to sheer military strength]. Intelligence and [knowledge of] the science of politics are the two eyes [of a king]. Using these, a king can, with a little effort, arrive at the best judgment on the means, [the four methods of conciliation, sowing dissension etc.] as well as the various tricks, stratagems, clandestine practices and occult means [described in this treatise] to overwhelm even kings who are mighty and energetic.' Kautilya doesn't deny that judgment without any power at all is inert -- he argues judgment is what correctly directs power, including power far short of your rival's, through leverage rather than direct force (the four methods, stratagems, clandestine means), so a much smaller might, well-directed, can overwhelm a much larger one badly directed. The text states the resulting hierarchy explicitly: 'the three components of power -- enthusiasm, military might and the power of counsel -- are in ascending order of importance. Hence, a king who is superior, as compared to his enemy, in an item later in the list, outmanoeuvres his adversary.' Diagnostic move: before deciding you're outmatched or well-matched for a confrontation, check which of the three levels you're actually comparing -- raw personal enthusiasm or effort, assembled resources and might, or the judgment that decides how to deploy either -- because superiority at the higher level can overcome a real deficit at the lower one, and a favorable comparison on enthusiasm alone says little if the other side has more might, while more might alone says little if the other side has better judgment about how to use less."
