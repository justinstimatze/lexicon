    text: distinctness-audit-grandin-detail-attentive-cognition-vs-existing-substrate
    citation: "Prior to this atom, none of the substrate's autism-adjacent citations (theory-of-mind universality, clicker-training, feeling-rules, facticity/transcendence-flight, the Wakefield MMR-fraud case studies, Nobel-laureate overreach, spoon theory, comic rigidity, Humean sympathy, Du Boisian double-consciousness) grounded a detail-attentive-vs-category-generalizing cognitive-style claim, and none is Grandin-primary. Lex-0761 (Borges/Luria, forgetting-particulars-is-the-mechanism-of-abstraction) grounds the constitutive claim that any abstraction whatsoever requires discarding particulars, with its pathological case (Funes) at the full-retention extreme where no generalization is possible at all. This atom's claim is narrower and does different work: not the impossibility of category-formation in the limit case, but a real, working, adaptive cognitive style — shared, per Grandin's own account, across a species boundary via a specific present-day human neurodivergence — that discards markedly less sensory detail than the neurotypical baseline, has genuine perceptual advantages and costs, and grounds a specific methodological claim (non-metaphorical epistemic access to animal experience) that lex-bg3ad neither makes nor implies. Lex-0330 (James, selective-interest-constitutes-experience-not-merely-filters-it) is the general phenomenological/attention-research claim that experience in general is constituted by directed interest rather than assembled from neutral raw sensory data; Grandin's own citation of inattentional-blindness research is one more cross-domain attestation of that general primitive. This atom's specific contribution is the cross-species, neurodivergence-grounded content of what gets filtered (concrete sensory detail vs. abstracted category) and the methodological/translational payoff Grandin builds on top of it. Lex-0796 (Godfrey-Smith, complex-mind-evolved-independently-twice-as-a-natural-experiment) concerns evolutionary phylogeny — whether two lineages share a complex-cognition-capable common ancestor — while this atom concerns cognitive style within and across already-existing minds, with no evolutionary-origin content at all; the two atoms share only a family-resemblance failure mode, both warning against treating one cognitive baseline as default-real and the other as a deficient variant. The hidden-figure/embedded-figures-task material is folded into this atom's canonical instances rather than minted separately, since it is Grandin's own supporting evidence for the same detail-attentive-cognition claim rather than a distinct claim in its own right."
canonical-instances:
  - "The jiggling-chain case: a chain hanging at a chute entrance in a Colorado beef plant, 'swinging back and forth three inches each way,' repeatedly stopped cattle cold, their heads swinging in rhythm with the chain, while plant employees — looking directly at the animals — never registered the chain at all and instead escalated to cattle prods, shouting, and force. The trigger was real, specific, and locatable; the employees' category-generalizing perception of 'a normal chute' filtered it out before it reached consciousness."
  - "The black hat horse: a horse terrified specifically and only of black cowboy hats on people — not red, white, or blue hats, and not especially bothered by a black hat lying inert on the ground — a fear so narrow that Grandin calls it 'an extremely specific fear' and attributes the owner's ability to even notice the pattern to a rare capacity to 'see through her horse's eyes.'"
  - "The bruised-loins mystery and the wet-floor reflections: at one plant, a sharp three-inch metal shard bruising cattle in a chute was 'obvious to me, but not one person at the plant had spotted it—and all of them were looking'; at another, pigs balking in an alley were reacting to 'tiny, bright reflections glancing off the wet floor,' invisible to standing human handlers and only detected once Grandin physically got down on hands and knees to match the pigs' own eye-level vantage point — a literal, non-metaphorical enactment of her epistemic-access claim, not just an assertion of it."
  - "Grandin's own methodological/translational claim, stated as the book's organizing premise: 'Autism is a kind of way station on the road from animals to humans, which puts autistic people like me in a perfect position to translate \"animal talk\" into English,' paired with her explicit refusal to treat this as mere metaphor — 'I finally realized I had one big advantage over the feedlot owners who were hiring me to manage their animals: being autistic.'"
  - "A modern cross-domain analogue responsibly extending Grandin's own argument rather than her text: a product team dismissing a user's bug report as 'a weird edge case nobody would ever actually do,' when the report in fact describes a specific, reproducible trigger (a particular screen size, input sequence, or data shape) that the team's own category-level mental model of 'the user' abstracted past before the team could consciously register it as a real, locatable cause rather than noise."
critical-questions:
  - "Is a behavior being read as 'spooked by nothing,' 'a weird edge case,' or 'irrational' because there genuinely is no trigger, or because the observer's own category-generalizing cognition has already discarded a real, specific, locatable detail before it reached conscious awareness? Grandin's own diagnostic discipline — physically matching the animal's sensory vantage point — is the test: has anyone actually looked from the position of the entity exhibiting the behavior?"
  - "Is the detail-attentive cognitive style being treated as simply a lesser or broken version of category-generalizing cognition, or is its genuine cost (narrower, slower generalization across categories, per Grandin's own 'you can't have both') being weighed against its genuine benefit (catching a real environmental anomaly a generalizing style discards as noise)?"
  - "Is a claim to understand another mind's or another species' experience grounded in an actual, describable cognitive-style correspondence — as Grandin's detail-attentiveness/hyper-specificity claim is, and as her literal hands-and-knees practice demonstrates — or is it an unsupported empathetic projection wearing the same language?"
  - "Is this situation calling for broad, flexible generalization across a category (where category-generalizing cognition wins) or for hyper-specific anomaly detection within a narrow, concrete instance (where detail-attentive cognition wins)? Don't assume either style dominates the other across all task types."
  - "Is the question actually about cognitive STYLE (detail-attentive vs category-generalizing, this atom), about the EVOLUTIONARY ORIGIN of the cognitive architectures being compared (lex-rufum), or about the general CONSTITUTIVE claim that any abstraction or any experience requires discarding particulars (lex-bg3ad, lex-w6zhq)? These are adjacent but different questions with different atoms."
