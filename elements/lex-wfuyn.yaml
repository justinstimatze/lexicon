id: lex-wfuyn
name: displacement-boom-euphoria-distress-panic-is-the-recurrent-bubble-anatomy
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you encounter a speculative market — equity prices for a new technology, real estate in a hot region, tulip bulbs, NFTs, AI startup valuations, foreign-debt-of-the-month — refuse to evaluate it as if 'this time is different.' Recognize the recurring FIVE-STAGE BUBBLE ANATOMY that Kindleberger documented across three centuries of financial history and apply it diagnostically. Stage 1 — DISPLACEMENT: an exogenous shock (new technology like railroads or computers, war's end, regulatory change, currency revaluation, sustained low interest rates) creates new profit opportunities in some sector and forecloses others. Investment flows toward the new opportunity. Stage 2 — BOOM: credit expansion (bank lending, personal credit, new financial instruments, leverage) feeds positive feedback in the displaced sector. Prices rise, attracting more investors. Stage 3 — EUPHORIA / MANIA: speculation detaches from fundamentals. Buyers acquire assets for resale-to-greater-fools, not for income or use. Normally-aloof participants enter (cab drivers, retirees, students). 'Pure speculation,' 'overestimation of profits,' and 'excessive gearing' (leverage) all increase. Swindlers and catchpenny schemes proliferate. Stage 4 — DISTRESS: insiders begin to exit. Prices level off. Doubts spread among the broader speculative community that prices can continue rising. Some speculators cannot meet liabilities; a few prominent failures occur. The word for this stage is Kindleberger's, not Minsky's. Stage 5 — PANIC / REVULSION / CRISIS: a triggering event (bank failure, swindle exposed, prominent firm collapse, fall in price of the speculation-object) precipitates a rush from real or financial assets into cash. Bankruptcies cascade. Liquidation degenerates into panic as everyone tries to sell at once and there is 'not enough money to enable everyone to sell out at the top.' Operational moves: (i) name the stage in real-time as the bubble unfolds — you can usually identify the current stage even when participants cannot; (ii) ask what the DISPLACEMENT was — every bubble has one, and identifying it grounds the analysis; (iii) watch the credit-expansion mechanism — bubbles cannot inflate without expanding credit, so credit metrics (private-debt growth, leverage ratios, new financial instruments) are the diagnostic; (iv) when normally-aloof participants enter (your taxi driver tells you about crypto), you are in euphoria, not boom; (v) distress is the most actionable stage for participants — insider exits and price-leveling are the early warning before panic; (vi) the specific TRIGGER for panic is often unpredictable (which bank, which swindle) but the PHASE is predictable (panic follows distress, follows euphoria); (vii) refuse the 'this time is different' framing — the anatomy is structural and recurs across asset classes, centuries, and continents. The transferable claim: when credit expansion fuels positive-feedback price appreciation in a displaced sector, the 5-stage anatomy applies; it is not a sequence of unrelated events but a single recurring structural process."
