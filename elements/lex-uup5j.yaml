id: lex-uup5j
name: whether-a-function-encodes-inherent-value-decides-its-market-exposure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating 'should this government function be privatized or run like a business' as a purely practical efficiency question, check whether the function's own mission already encodes a value commitment that market pricing structurally cannot represent. Lakoff's contrast: the Minnesota state motor pool exists to provide cars to state officials, a function judged entirely on cost and service quality. If Hertz or Avis can do it cheaper and better, the pool should lose the business -- there is no moral content to lose in that swap. The Environmental Protection Agency looks structurally identical, another government agency subject to the same efficiency logic. Its actual mission encodes a specific moral vision instead: the inherent value of nature, above and beyond nature's usefulness to people. A market can price nature as a resource, but it has no mechanism for pricing inherent value, value a thing has independent of what anyone would pay for it. Treating the EPA's core mission as a service-for-sale doesn't make the question of privatization neutral -- it silently swaps out the value system the mission was built to encode for whichever value system markets can actually represent. Diagnostic move: before applying a market or efficiency frame to an institution's function, ask whether that function's own definition already commits to a value a market has no way to price -- if so, marketizing it is a substitution of one moral vision for another dressed up as a neutral efficiency move."
related: []
evokes: [george-lakoff, moral-politics-1996, epa, government-as-business, inherent-value]
lineage:
  - source: primary
    text: lakoff-1996-motor-pool-versus-epa
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 19 'Can There Be a Politics without Family Values?' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“But compare this with the Environmental Protection Agency. The EPA has not just a practical mission but a moral mission—safeguarding the environment, which includes choosing a moral view of the environment. There is no neutral view of the environment; there are only moral views of the sort we discussed in Chapter 12. The EPA’s job is not merely to carry out morally neutral functions like measuring air pollution. Its very function is a moral one.”"
canonical-instances:
  - "The direct textual anchor, on the specific limit of the market frame: 'Parts of its job could be farmed out to the private sector, but its overall job could not, because the market does not incorporate inherent values, such as the inherent value of nature that emerges from the Nurturant Parent model. It is at points like this that family-based morality enters crucially into government.'"
  - "Hypothetical: a city considers outsourcing two departments to cut costs -- fleet maintenance and the public defender's office. Fleet maintenance is a clean fit: any competent contractor who keeps the trucks running for less money is doing the job just as well. The public defender's office looks structurally similar on a spreadsheet, but its actual mission -- ensuring the poor get a real defense regardless of ability to pay -- encodes a commitment a for-profit contractor's incentive structure has no way to preserve, since a firm paid per case has every reason to minimize hours per client rather than maximize defense quality. Treating both departments as the same kind of outsourcing decision loses the distinction that actually matters."
critical-questions:
  - "The test asks whether a function's mission 'encodes inherent value,' but almost any government function can be described either as morally neutral service-delivery or as expressing some deeper value, depending on how narrowly or broadly its mission is framed. Who decides at what level of description a function's mission should be read for this test, and could the test itself be gamed by describing a value-laden function narrowly enough to make it look neutral?"
  - "If markets genuinely cannot price inherent value, does that mean inherently-valued functions must stay entirely inside government, or could a market operate successfully on the instrumental slice of a function's work (equipment purchasing, building maintenance) while a non-market process handles the value-laden core? Lakoff's binary (privatize the motor pool, don't touch the EPA) doesn't address whether a function can be split this way."
