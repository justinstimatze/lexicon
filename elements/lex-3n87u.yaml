    text: aesop-vernonjones1912-the-monkey-as-king
    citation: "Aesop's Fables, translated by V. S. Vernon Jones (1912, Project Gutenberg #11339), 'The Monkey as King.' Verified verbatim against a direct extraction of the held copy."
    quote: "Here is a dainty morsel I have found, sire; I did not take it myself, because I thought it ought to be reserved for you, our King."
canonical-instances:
  - "a corporate rival 'generously' hands a newly-promoted vice president the 'opportunity' to lead a doomed, underfunded flagship project, framed as an honor befitting the new title rather than as the trap it is."
critical-questions:
  - "Does this attack only work on someone new enough to a role that they haven't yet learned to distrust unearned deference, or can a seasoned leader remain vulnerable to the same flattery indefinitely?"
  - "How would a newly elevated target distinguish genuine tribute from a disguised trap without becoming so suspicious of every deferential gesture that it undermines their ability to actually lead?"
