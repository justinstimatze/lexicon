id: lex-dtwkh
name: an-inspectable-artifact-substitutes-for-statistical-replication
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you want to claim a constructed artifact's behavior teaches you something scientific, check whether you can inspect the artifact's own internal structure rather than only observing its outputs from the outside — that inspectability is what lets a single instance stand in for what a black-box science would need many repeated trials to establish. Newell and Simon's 1976 Turing lecture makes the case for computer science as a genuinely empirical discipline on exactly this basis: 'Each new machine that is built is an experiment. Actually constructing the machine poses a question to nature; and we listen for the answer by observing the machine in operation and analyzing it by all analytical and measurement means available.' The decisive move follows immediately: 'Neither machines nor programs are black boxes; they are artifacts that have been designed, both hardware and software, and we can open them up and look inside. We can relate their structure to their behavior and draw many lessons from a single experiment. We don't have to build 100 copies of, say, a theorem prover, to demonstrate statistically that it has not overcome the combinatorial explosion of search in the way hoped for. Inspection of the program in the light of a few runs reveals the flaw and lets us proceed to the next attempt.' The move only works because the artifact is genuinely open to inspection — a system whose internals resist examination (a sealed process, an opaque model, someone else's undocumented codebase) forfeits it and falls back to needing the statistical route after all. Before reaching for more trials to be sure of something, ask whether the thing under study is truly sealed, or whether the tool to open it is already in your hands."
