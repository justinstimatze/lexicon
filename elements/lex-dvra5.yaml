id: lex-dvra5
name: foreseeing-a-rivals-own-nature-will-trigger-their-removal-counsels-patience
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Rather than fight a rival directly for a contested position, predicting that the rival's own uncurbed instincts will eventually produce the exact behavior that gets them expelled lets patience substitute for confrontation — the removal happens on its own schedule, driven by a nature that was never going to change. In the Jataka's tale of the two parrots, rather than compete with the newly favored monkey, Radha predicts its own antics will do the work: 'Oft will his puckered face and moving ears The royal children fill with foolish fears: Soon Kalabahu through some impish freak, Far far away his food will have to seek.' The prediction plays out exactly: the monkey terrifies the young princes and is driven away, restoring the parrots' standing without either of them lifting a wing."
related: []
evokes: [jataka, catukkanipata, kalabahu-jataka, a-rivals-uncurbed-nature-is-a-self-executing-liability, patience-substitutes-for-confrontation-when-removal-is-foreseeable]
lineage:
  - source: primary
    text: jataka-chalmers1895-kalabahu-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 329, Kalabahu-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Oft will his puckered face and moving ears The royal children fill with foolish fears: Soon Kalabahu through some impish freak, Far far away his food will have to seek."
canonical-instances:
  - "A quietly displaced team lead doesn't campaign against a flashy new hire who's won over leadership — they predict privately that the hire's habit of overpromising will collide with a real deadline within a quarter, and simply wait for the inevitable reckoning to restore the balance on its own."
critical-questions:
  - "Is this actually patience, or is it a bet that could easily fail to pay off — what happens to Radha's standing if the monkey's antics had charmed the princes instead of terrifying them?"
  - "Does relying on a rival's self-destruction risk leaving a real problem unaddressed for longer than direct confrontation would, simply because the passive approach felt safer?"
status: active
