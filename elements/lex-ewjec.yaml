id: lex-ewjec
name: removing-non-market-exits-makes-market-dependence-structural
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When market dependence appears voluntary, check whether the non-market exits have been removed. If subsistence, kin, or commons options are foreclosed, the 'choice' to enter the market is structural — no coercion at the moment of trade is needed because the alternative was eliminated upstream."
