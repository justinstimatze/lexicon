id: lex-rktsy
name: causation-as-constant-conjunction-not-necessary-connexion
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When asserting causation, remember Hume: you observe constant conjunction (A then B repeatedly), not necessary connection. The 'necessity' is a habit of mind, not a perceived link. This is a humility-floor on causal claims, not a denial of causation."
related: [lex-spm8x, lex-t28ya, lex-mthv9, lex-39muf, lex-nn3u9, lex-3r2f8, lex-qdxa7, lex-b9sqg, lex-gzgn3, lex-v6nqz, lex-s22hf, lex-n3ayj, lex-nx7u7, lex-4ph7n]
evokes: [we-never-see-the-because, regularity-mistaken-for-necessity, the-cement-of-the-universe-is-habit, the-mind-projects-necessity-outward, post-hoc-ergo-propter-hoc-is-everywhere]
lineage:
  - source: primary
    text: hume-enquiry-1748
    citation: "David Hume, *An Enquiry Concerning Human Understanding* (1748). (Project Gutenberg #9662). Hume's positive metaphysical-epistemic claim (Section VII 'Of the Idea of Necessary Connexion'): when we observe causation (billiard ball A strikes ball B, ball B moves), we do NOT perceive any necessary connexion — only the sequence and the spatial contiguity. The 'necessity' we attribute to the connexion is a projection of the mind, generated by repeated observation of the constant conjunction. There is no observable feature of the world that distinguishes 'A causes B' from 'A is regularly followed by B' — the former is the latter PLUS our mental habit of expecting B given A. This is the canonical Humean account of causation, foundational to all subsequent philosophy of causation (Mill, Russell, Lewis, Mackie, Woodward)."
    quote: "[Hume, Enquiry Section VII Part II ¶58-60:] 'It appears, then, that this idea of a necessary connexion among events arises from a number of similar instances which occur of the constant conjunction of these events; nor can that idea ever be suggested by any one of these instances, surveyed in all possible lights and positions. But there is nothing in a number of instances, different from every single instance, which is supposed to be exactly similar; except only, that after a repetition of similar instances, the mind is carried by habit, upon the appearance of one event, to expect its usual attendant, and to believe that it will exist. This connexion, therefore, which we feel in the mind, this customary transition of the imagination from one object to its usual attendant, is the sentiment or impression from which we form the idea of power or necessary connexion. Nothing farther is in the case.' [¶60 definitions:] 'Suitably to this experience, therefore, we may define a cause to be an object, followed by another, and where all the objects similar to the first are followed by objects similar to the second. Or in other words, where, if the first object had not been, the second never had existed.' [The structural claim: causation, as we know it, just IS constant-conjunction + habitual-expectation. The 'necessity' is a feeling we project, not a feature we perceive.]"
  - source: practitioner
    text: mackie-1974-inus-condition
    citation: "J. L. Mackie, *The Cement of the Universe: A Study of Causation* (1974). Tier-3 deepening: Mackie's INUS condition (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) extends Hume's regularity-account to handle the complex causal structure of real-world events where multiple factors are causally relevant. The Hume-Mackie-Lewis tradition is the dominant 20th-c. analysis of causation. Cross-attests with modern Bayesian causal-inference (Pearl 2000 *Causality*; Spirtes-Glymour-Scheines 1993); extensively cross-cited."
    quote: "[Tier-3 deepening — Mackie 1974: causation is more complex than simple constant-conjunction. A short-circuit caused the house fire IFF the short-circuit was an Insufficient (alone) but Non-redundant (necessary given the other conditions) part of an Unnecessary (other causal chains could have produced the fire) but Sufficient (together with the other conditions) set. The INUS account preserves Hume's anti-necessitarianism while doing justice to the structure of causal claims. Pearl's modern causal-DAG framework operationalizes this further: causal claims are about interventions and counterfactuals over a structured probability model, not about hidden metaphysical necessity.]"
  - source: practitioner
    text: granger-causality-and-modern-statistical-causation
    citation: "Clive Granger 1969 'Investigating Causal Relations by Econometric Models and Cross-spectral Methods' *Econometrica* 37(3):424-438. Tier-3 deepening: Granger-causality operationalizes Hume's regularity-account for time-series — X Granger-causes Y if past values of X help predict Y beyond what past Y alone provides. This is the same Humean shape: causation defined by predictive regularity, not by hidden necessary connexion. Granger won the Nobel 2003 for this work; standard in econometrics + ML literature."
    quote: "[Tier-3 deepening — Granger 1969: 'Causality between two variables X and Y has been considered to exist if past values of X help to predict Y better than past values of Y alone.' The Granger framework instantiates Hume's claim that causation just IS predictive-regularity-given-history. The fact that this Humean operationalization is the dominant econometric framework for causal inference is itself evidence that Hume's regularity-account works as a practical specification even when philosophers debate whether it captures the FULL metaphysics of causation.]"
canonical-instances:
  - "the heat-flame-pain sequence: the canonical instance Hume uses (Section IV). We see fire, feel heat, experience pain in finger. The 'because' we attribute to this — fire causes burn — is our mental habit of expecting pain given fire-touch, formed by repeated past instances. We have not seen any necessary connexion; we have only seen the regularity"
  - "the post-hoc-ergo-propter-hoc fallacy is the failure-mode of treating mere temporal sequence as causation. Hume's argument shows this fallacy is NOT just a bias but reflects a deep epistemic point: ALL causal inference is fundamentally inference-from-regularity, so distinguishing 'real causation' from 'mere correlation' is a difference of strength-of-regularity + counterfactual-stability, not a difference of kind"
  - "RCTs and causal inference in epidemiology: the gold standard for causal claims in medicine is the randomized controlled trial. Why is randomization needed? To rule out confounders — i.e., to ensure that the constant conjunction observed is between TREATMENT and OUTCOME, not between some hidden third variable and both. The whole RCT methodology is Humean — establish causation by establishing the right regularity, controlled for alternative explanations"
  - "machine learning's correlation-vs-causation problem: ML models learn statistical regularities and apply them predictively, but a model trained on 'people who exercise live longer' cannot tell us whether intervention (forcing exercise) would extend life. The do-calculus (Pearl 2000) formalizes the distinction; the Humean baseline is that ALL we ever observe is regularity, and causation-as-distinguished-from-correlation requires the additional structural assumption of intervention-stability"
  - "operationally distinct from lex-39muf problem-of-induction: lex-rktsy is the METAPHYSICAL claim (causation just IS regularity + habit); lex-39muf is the EPISTEMIC claim (inferring future from past is logically unjustified). They are tightly coupled — IF causation = constant conjunction, THEN causal inferences are inductive inferences, and lex-39muf's skeptical argument applies. But they could come apart conceptually: one could accept lex-39muf (induction-skepticism) while holding a stronger metaphysics of causation"
  - "operationally adjacent to lex-spm8x feedback-loop-as-mechanism: feedback-loops are the prototype of a regular causal mechanism. lex-spm8x's claim that 'observation modifies action via error-signal' is a Humean causal claim — we observe the regularity (deviation → correction) and attribute causal structure to it. The transferable engineering use of feedback-loops works precisely because Hume's regularity-account is operationally sufficient for design"
  - "operationally adjacent to lex-mthv9 hexis: Hume's 'custom' (the mental habit that projects necessity onto regularity) is the cognitive-epistemic instance of the same mechanism Aristotle's hexis names in the moral domain. Repeated exposure → automatic response. Aristotle: actions become character. Hume: regularities become 'causes'. Same structural primitive in different domains"
  - "the transferable methodological consequence: when claiming 'X causes Y', the question is 'what is the regularity, how robust is it to interventions, and how strong is the counterfactual stability?' Not 'is there a hidden necessary connexion?' — that question, per Hume, has no observable answer. Operational rule: causation-claims should be reducible to regularity-claims-plus-intervention-stability-claims"
  - "xkcd 925 'Cell Phones' (2011-09-09): Black Hat plots Total Cancer Incidence and Cell Phone Users on the same axes (cancer rising 1970–90, then plateau; phones rising 1984–present) and concludes 'cancer causes cell phones.' The reversal works comedically because the comic's two time-series share constant conjunction in their visible co-rise without sharing necessary connexion in either direction. The whole joke depends on the substrate-claim: the regularity is symmetric under reversal of the causal arrow; only intervention-stability (which Black Hat sidesteps) would adjudicate"
critical-questions:
  - "does the regularity-account capture all of what we mean by 'cause'? Standard objection (since Russell 1912 + Anscombe 1971): we DO seem to mean more than regularity. The shoulder-shrug response (Lewis-Pearl): if there's something beyond regularity + intervention-stability + counterfactual-truth, it's not part of our operational use of 'cause'. The competing-view objection (Cartwright 1979, Woodward 2003): causation involves a 'productive' relation regularity-accounts fail to capture. Transferable position: Hume's account works as a base specification; whether it captures the full metaphysics is an open philosophical question"
  - "how do you distinguish a CAUSAL regularity from a MERE-correlative regularity, on Hume's terms? Hume's answer (Section VII): you can't, observationally — they look the same. The modern Pearl-style answer: causal regularities are stable under INTERVENTION (do(X)), mere correlations are not. The intervention-stability criterion goes beyond pure Hume but is consistent with his anti-necessitarianism: it's still about what we OBSERVE under different conditions, not hidden necessities"
  - "is the transferable use of lex-rktsy just 'don't mistake correlation for causation'? Partially, but the deeper move is recognizing that even 'real' causation is just a stronger regularity. The discipline is: when claiming a cause, specify the regularity you observe, the interventions that would test it, and the counterfactual that would falsify it. Vague 'X causes Y' claims that don't survive this specification are vulnerable to being mere-correlation-in-disguise"
  - "does this primitive apply to non-physical causation (mental, moral, social)? Hume thought so (Section VIII Liberty and Necessity argues human action is also regular and causal in the same sense). Modern philosophy is split — some hold mental causation is a different kind; others (Davidson 1970 anomalous monism) hold it's the same kind, just less predictable. Transferable: the regularity-account generalizes to any domain where we can observe sequences and ask about intervention-stability"
status: active
