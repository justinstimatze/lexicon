id: lex-j5kwd
name: unleashing-chaos-then-selling-the-restoration-of-order
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Watch for this two-step play whenever an armed or organized actor benefits from both a period of chaos and the 'solution' to it: first, criminal violence and unlimited predation are unleashed or simply tolerated until ordinary life becomes cheap and precarious; then the same actor, or one closely tied to it, steps in offering to restore order. The restored order is never a return to how things were before -- it's deliberately harsh, comprehensive, and hard to avoid violating, and it preserves the most profitable parts of the earlier chaos while relocating them inside the law instead of outside it. Graeber's case: West Africa's Aro Confederacy hunted down the kidnappers terrorizing the Cross River region and restored safety to the roads, then built a ritual legal code so exacting that almost anyone could be found guilty of something and sold into the same slave trade the chaos had been feeding all along. The tell is whether the restoration keeps the extraction running under a new, more legitimate-looking name, not whether order actually gets restored."
related: [lex-vzqv5]
evokes: [david-graeber, debt-the-first-5000-years, aro-confederacy, ekpe, protection-racket, cross-river-slave-trade]
lineage:
  - source: primary
    text: graeber-2011-debt-fascists-mafias-gangsters-strategy
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.6 'Games with Sex and Death,' section 'Reflections on Violence.'"
    quote: "“Groups like the Aro Confederacy represent an all-too-familiar strategy, deployed by fascists, mafias, and right-wing gangsters everywhere: first unleash the criminal violence of an unlimited market, in which everything is for sale and the price of life becomes extremely cheap; then step in, offering to restore a certain measure of order—though one which in its very harshness leaves all the most profitable aspects of the earlier chaos intact. The violence is preserved within the structure of the law. Such mafias, too, almost invariably end up enforcing a strict code of honor in which morality becomes above all a matter of paying one's debts.”"
  - source: primary
    text: graeber-2011-debt-aro-confederacy-restores-order
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.6 'Games with Sex and Death,' section 'The Slave Trade.'"
    quote: "“Kidnappers were hunted down and themselves sold as slaves. Safety was restored to roads and farmsteads. At the same time, Aro collaborated with local elders to create a code of ritual laws and penalties so comprehensive and severe that everyone was at constant risk of falling afoul of them.”"
canonical-instances:
  - "The direct textual anchor, on how the restored order recycled its own members back into the trade it had supposedly tamed: “thousands ended up in debt to the merchants, whether for the fees required for joining, or for the trade goods they supplied (mostly cloth and metal put to use creating the gear and costumes for the Ekpe performances—debts that they thus themselves became responsible for enforcing on themselves. These debts, too, were regularly paid in people, ostensibly yielded up as pawns.)”"
  - "Hypothetical: a landlord hires people to vandalize a block's storefronts and threaten shopkeepers late at night. Once the merchants are desperate, he offers a private security contract through a company he also happens to own -- the contract comes with a fee schedule and the right to evict any tenant who falls behind on payments. The vandalism stops. The extraction doesn't; it just moved from the shadows into the lease."
critical-questions:
  - "Graeber doesn't have direct evidence that the Aro Confederacy or the merchant societies engineered the Cross River region's initial wave of kidnapping and terror, rather than simply being first to arrive and monetize a chaos that arose for other reasons -- population pressure, prior local raiding, the mere presence of European ships offering to buy captives. Does the mechanism require the order-restorer to have caused the disorder, or does it work identically when they only get there first to profit from disorder someone else set in motion?"
  - "A state that ends genuine feuding and warlordism by imposing a harsh new legal order can look, from outside, structurally identical to this racket -- both are an armed actor stepping into chaos and installing a comprehensive new code. What distinguishes a state that has actually ended predation from one that has merely relocated and formalized it under law, and is that distinction visible from inside the system as it's happening, or only afterward?"
status: active
