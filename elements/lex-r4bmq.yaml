id: lex-r4bmq
name: deliberate-unfair-provocation-tests-whether-good-conduct-is-unconditional
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Before committing to someone whose good character matters to you, stage a deliberately unjust provocation — blame them for something not their fault, or destroy something of theirs without cause — and watch whether their composure holds. Genuine good conduct survives unfairness; conduct that was really just compliance under fair treatment cracks. In the Maha-Ummagga-Jataka, Mahosadha tests Amara by rejecting food she cooked perfectly, accusing her of spoiling it: "Madam, if you don''t know how to cook why did you spoil my rice?" and spat it out on the ground. She is not angry. He escalates, deliberately: "As though angry he mixed all three together and smeared them all over her body from the head downwards, and told her to sit at the door." Her only response: "Very good, master," not angry at all.'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, character-test, unconditional-composure, staged-provocation]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"Madam, if you don''t know how to cook why did you spoil my rice?" and spat it out on the ground. But she was not angry; only gave him the cake... "If you don''t know how to cook why did you waste my property?" As though angry he mixed all three together and smeared them all over her body from the head downwards, and told her to sit at the door. "Very good, master," she said, not angry at all, and did so.'
canonical-instances:
  - "The same tale, same courtship: Mahosadha later sends men with a thousand pieces of money to offer Amara in his own name while he is elsewhere, and when three offers fail he has her dragged away by force to see whether her resistance to a bribe was performance or principle — she resists all four times."
  - "A hiring manager gives a finalist candidate a deliberately unreasonable, contradictory set of last-minute instructions during a trial project — not to see if they can execute the instructions, but to see whether they stay professional and constructive when treated unfairly, before extending a permanent offer."
critical-questions:
  - "The provocation here was staged by someone who intended to make things right afterward — does the test still teach anything useful, or does it just measure tolerance for abuse, when the person being tested has no way to know it's a test and no guarantee of eventual vindication?"
  - "Passing this kind of test proves someone won't retaliate visibly in the moment — does it actually prove anything about whether resentment is accumulating privately underneath the calm?"
status: active
