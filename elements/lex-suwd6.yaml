canonical-instances:
  - "A leadership team preparing to announce layoffs runs through several possible framings half-jokingly, then argues seriously about which framing best withstands anticipated pushback, and finally converges on a version everyone in the room genuinely feels good about — by the time it's announced publicly, no one in the room is performing confidence, they've actually arrived at it."
critical-questions:
  - "Does the three-stage process ever actually surface a genuine ethical problem with the underlying decision, or is its structure such that it can only ever converge on some rationale the group can live with, regardless of whether the decision itself deserves defending?"
