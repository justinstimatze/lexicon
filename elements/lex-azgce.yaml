id: lex-azgce
name: retroactive-authorization-absorbs-disruption-by-claiming-it-was-planned-all-along
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "After a real, unplanned disruption has already succeeded in changing an order, that order can neutralize the disruption's meaning without undoing any of its effects, simply by retelling the story so that the highest authority is said to have foreseen and intended the change from the start. The disruption stays in place; what disappears is the fact that it was ever a genuine rupture. Hyde traces this in how the Homeric Hymn frames Hermes' theft and trickery as having happened 'in the mind of Zeus': 'Hermes' conception and birth are described as Zeus' \"purpose\" being fulfilled; when he comes home from his night of thieving, Maia says, \"Your father meant you to be a great bother.\"... Most telling of all, when Zeus settles the quarrel between his two sons we read: \"Then [Zeus] nodded his head and good Hermes obeyed, for the will of Zeus... persuades without effort.\"' Hyde names the function directly: 'it may come as no surprise that one way to articulate the change -- admitting the new but preserving the old -- is to say, \"Well, this is what we had in mind all along.\"... To have the lying, thieving Hermes spring from Zeus' loins is to figure Zeus as the ultimate author of hermetic inventions, as if Hermes had never really been an outsider, as if there weren't a period in Greek history when a shame threshold kept traders at a distance from aristocrats.' The technique is doing real ideological work: it lets the old authority keep its claim to total foresight and control precisely by absorbing what it never actually controlled. Diagnostic move: when an authority describes a change it clearly did not originate or plan for as having been its intention all along, treat the retroactive claim as evidence about the authority's need to preserve its own legitimacy, not as evidence about what actually happened -- a story in which nothing was ever really disrupted, only revealed, is usually being told by whoever benefits most from erasing the disruption's history."
