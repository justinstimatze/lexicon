lineage:
  - source: primary
    tradition: deep-learning-architecture
    text: vaswani-2017-attention-is-all-you-need
    citation: "Ashish Vaswani et al., 'Attention Is All You Need,' arXiv:1706.03762 (NeurIPS 2017). Abstract."
    quote: "The dominant sequence transduction models are based on complex recurrent or convolutional neural networks that include an encoder and a decoder. The best performing models also connect the encoder and decoder through an attention mechanism. We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments on two machine translation tasks show these models to be superior in quality while being more parallelizable and requiring significantly less time to train."
  - source: primary
    tradition: deep-learning-architecture
    text: vaswani-2017-attention-is-all-you-need
    citation: "Ashish Vaswani et al., 'Attention Is All You Need,' arXiv:1706.03762 (NeurIPS 2017). Section 2 (Background — motivating self-attention only)."
    quote: "To the best of our knowledge, however, the Transformer is the first transduction model relying entirely on self-attention to compute representations of its input and output without using sequence-aligned RNNs or convolution."
canonical-instances:
  - The Transformer architecture itself — the original 2017 paper. Six-layer encoder + six-layer decoder, multi-head self-attention, layer normalization, residual connections. Trained on WMT-14 English-German and English-French translation, surpassing prior state-of-the-art.
  - GPT and follow-on autoregressive language models — the decoder-only Transformer where each token attends to all preceding tokens in parallel. Scale-up of this architecture produced GPT-2, GPT-3, GPT-4 and the broader LLM class.
  - BERT and encoder-only language models — the bidirectional Transformer encoder; each token attends to all positions. Used as the embedding backbone for many downstream NLP tasks.
  - Vision Transformer (ViT) — applies the same architecture to image patches; each patch attends to all other patches. The 'image is not special; flatten to a sequence and apply Transformer' pattern.
  - Protein-language models (Lin 2023 ESM-2, AlphaFold's evoformer) — sequence-to-structure prediction where parallel all-to-all attention over residues replaces prior sequential or convolutional approaches; the architecture transfers.
  - Set Transformers and graph attention networks — generalizations to permutation-invariant or graph-structured data where there is no canonical sequence order; the all-to-all attention pattern applies natively.
  - Sparse-attention follow-ups (Longformer, Reformer, Performer, BigBird) — variants that approximate the O(n²) attention with subquadratic alternatives to handle longer contexts; pure-attention default remains the structural baseline.
