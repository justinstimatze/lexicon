id: lex-chtk9
name: argument-from-precedent-as-defeasible-rule-modification
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When citing a precedent to justify an action, check that the precedent case actually matches on the rule-bearing features and that the cited-case's rule-modification logic applies. Precedent is defeasible at three joints: the case-match, the rule, and the case-to-rule fit."
related: [lex-3656j, lex-38ygs, lex-7t3wr, lex-8j5ms, lex-8n237, lex-9uac6, lex-af9ax, lex-aut4h, lex-d73nj, lex-hesjt, lex-hhx7u, lex-jbegr, lex-kh9cr, lex-rnwph, lex-th68b, lex-tpv83, lex-uetgd, lex-utn22, lex-x9sda, lex-xhwqt, lex-xqamc, lex-y7p3z, lex-zd7vh]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt, lex-tpv83]
evokes: [ratio-decidendi, stare-decisis, common-law-reasoning, case-citation, distinguishing-the-case, the-Reasoner-case, exception-by-precedent, prior-decision-binds, case-based-refutation]
premises:
  - "according to the established rule, if x has property F then x also has property G"
  - "in the cited prior case, a has property F but does not have property G"
  - "therefore an exception to the rule must be recognized, and the rule must be appropriately modified or qualified"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(identify-applicable-rule, locate-cited-prior-case, verify-case-has-F-but-not-G, derive-rule-modification) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "does the established rule really apply to this case? CQ1 (Walton 2008 p.73 from Walton 1995). Argument-from-precedent only generates a refutation when the rule actually covers the current case; if the rule doesn't apply, the cited precedent has no purchase. Diagnostic: 'before citing the prior case, confirm the rule's scope covers the present situation — otherwise the precedent is being deployed in the wrong rule-context'"
  - "is the case cited legitimate, or can it be explained as only an apparent violation of the rule? CQ2 (Walton 2008 p.73). The cited prior case must be a genuine instance where F-without-G was acknowledged — not a misreported case, not a case where G was actually present but undocumented, not a case decided on extraneous grounds that didn't touch the F→G inference. Diagnostic: 'is the cited case's record clean — was the F→G inference actually litigated and resolved against the rule, or was it incidentally not enforced for unrelated reasons?'"
  - "can the case cited be dealt with under an already recognized category of exception that does not require a change in the rule? CQ3 (Walton 2008 p.73). The locus of the contest: if the cited case fits an existing exception-category (force majeure, statute of limitations, recognized excuse), then the rule itself stands and the case-citation does not require rule-modification. Diagnostic: 'does the existing exception-catalogue already cover what the cited case shows, in which case rule-modification is not warranted?'"
  - "is the cited prior case authoritative for this jurisdiction / rule-system? Substrate extension. Walton's CQs assume the cited case has decision-force; many real precedent-citations smuggle in unauthoritative cases (a different jurisdiction's decision, a non-binding lower-court opinion, a settled-without-prejudice case, a case from a regime that has been since legislatively overruled). Diagnostic: 'where was the cited case decided, by whom, when, and does that decision still have authority over the present forum?' — the precedent-citation pattern is structurally vulnerable to this attack and lex-chtk9 should always test it"
  - "is precedent-following the right reasoning-mode for this domain at all? Substrate extension via lex-jbegr phronesis and lex-tpv83 established-rule's own CQ5. Some domains explicitly resist precedent-driven reasoning — moral judgment of irreducibly particular cases (Aristotle NE VI), emergency decision under novel conditions (lex-rgr3t OODA / RPD adaptive expertise), scientific discovery where the prior case is the very thing being overturned. Diagnostic: 'does precedent-following structurally over-constrain this domain — would a case-specific phronetic judgment or a from-first-principles derivation reach a better answer?'"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.2 §8 'Argument from Precedent and Practical Argument from Analogy' (pp.72-74). Scheme cited to Walton 1996 p.94. Walton-Reed-Macagno explicitly frame argument-from-precedent as the REFUTATION counterpart to argument-from-established-rule (lex-tpv83): the prior case is cited as an instance where the rule's conclusion did NOT follow despite the rule's antecedent being satisfied, so the rule must be modified or qualified to accommodate the exception. The scheme is the structural backbone of common-law reasoning (ratio decidendi) and shows up across institutional rule-systems wherever case-by-case adjudication accumulates precedential weight. Three critical questions on p.73. Distinct from analogy (lex-kh9cr) because precedent works through the RULE, not through feature-to-feature mapping between source and target cases; the cited case's job is to demonstrate F-without-G under the rule, not to share features with the target. Distinct from established-rule (lex-tpv83) because precedent is the refutation pattern that USES established-rule as its target (rule cited to refute → exception cited via precedent → rule modified)."
    quote: "[Ch.2 §8 pp.72-73] 'Argument from precedent points out another aspect of the normative counterpart to the argument from verbal classification, namely, the link between the two properties. This scheme may be described as an extension of the previously described scheme in which the law or rule establishes that the classification of a case as having a property F leads to the conclusion that the property G applies to it as well. In a legal type of dialogue, where plausibility value and probative weight are judged differently than they are in ordinary conversational argument, precedent is judged by similar cases decided in previous trials (ratio decidendi). The criteria of classification can be clearly established in legal cases by classifications and definitions that are codified in law. Argument from precedent can be used to apply a rule to a case, but it can also be used to attack a prior argument that a rule should be applied to a case. ... [Worked example] Student: I don't think I will [be] able to get my essay in on Tuesday. Would it be OK if I handed it in next week? Professor: We all agreed at the beginning of the year that Tuesday is the deadline. That is the rule. Student: Yes, but you said to Ms. Reasoner that she could hand her essay in a week late because she has another assignment due this week. I have another assignment due, too. So I should be able to hand mine in a week late, too. (Walton, 1995, p. 94) ... [Refutation Scheme for Argument from Precedent, p.73] Major Premise: Generally, according to the established rule, if x has property F, then x also has property G. Minor Premise: In this legitimate case, a has property F but does not have property G. Conclusion: Therefore, an exception to the rule must be recognized, and the rule must be appropriately modified or qualified. ... [Critical Questions, p.73] CQ1: Does the established rule really apply to this case? CQ2: Is the case cited legitimate, or can it be explained as only an apparent violation of the rule? CQ3: Can the case cited be dealt with under an already recognized category of exception that does not require a change in the rule?' [Verified 2026-08-19 against the real PDF: exact match; this span had never been quote-marked, so the checker had never actually checked it. The checker still cannot confirm it because the PDF's own text layer misreads precedent as piecedent at the opening word -- a scan artifact, not an atom error.]"
  - source: primary
    text: cardozo-1921-nature-of-the-judicial-process
    citation: "Benjamin N. Cardozo, *The Nature of the Judicial Process* (Yale University Press 1921), Lecture I 'Introduction. The Method of Philosophy' and Lecture IV 'Adherence to Precedent. The Subconscious Element in the Judicial Process'. PD; in the lexicon corpus (acquired or lex-8n237 Cardozo four-methods atom). Cardozo's foundational treatment of adherence-to-precedent as the principal-equilibrium of the common-law system: stability-via-precedent is the rule, departure-from-precedent is the exception, and the criteria for departure are normative (sense of justice, social welfare, non-vested-reliance). Methodologically-distinct from Walton-Reed-Macagno 2008 along three axes: (1) Architectonic-vs-cataloged-scheme: Cardozo theorizes WHY adherence-to-precedent has structural force — judicial-labor-economy ('the labor of judges would be increased almost to the breaking point if every past decision could be reopened'), reliance-interest of litigants ('one could not lay one's own course of bricks on the secure foundation of the courses laid by others who had gone before him'), and sentiment-of-equal-treatment ('if a group of cases involves the same point, the parties expect the same decision'). Walton 2008 catalogues argument-from-precedent as one defeasible refutation-scheme among many with three CQs. Cardozo explains why the scheme has force; Walton operationalizes the per-dialogue rebuttal-instruments. (2) Normative-criteria-for-departure vs dialogue-CQs-for-rebuttal: Cardozo gives the normative conditions under which precedent should be abandoned ('when a rule, after it has been duly tested by experience, has been found to be inconsistent with the sense of justice or with the social welfare, there should be less hesitation in frank avowal and full abandonment'; 'when the rule to be discarded may not reasonably be supposed to have determined the conduct of the litigants'). Walton's CQs are structurally neutral about WHEN exception-application is warranted; Cardozo gives the normative compass Walton lacks. (3) System-level equilibrium vs per-case move: Cardozo theorizes the legal system as a precedent-equilibrium requiring both stability (adherence-as-rule, for judicial economy + reliance + equal-treatment) and adaptation (overrule-when-rule-fails-justice-or-social-welfare); Walton's scheme operates at the per-dialogue per-precedent-citation level. The two cohere: Cardozo's system-equilibrium is what makes Walton's per-citation CQs argumentatively meaningful in the first place — without the background commitment to adherence-as-rule, a precedent-citation has no rebuttal-force; without the background normative-criteria for departure, a precedent-citation cannot be argued against on principled grounds. Cardozo also documents the cross-jurisdictional variation (House of Lords 'holds itself absolutely bound by its own prior decisions'; US Supreme Court and state high courts 'overrule their own prior decisions when manifestly erroneous'), grounding lex-chtk9's substrate-CQ4 (is the cited prior case authoritative for this jurisdiction?). Together: Cardozo 1921 gives the system-equilibrium architectonic explaining WHY argument-from-precedent has force as a refutation-scheme; Walton 2008 gives the per-dialogue CQs that operationalize precedent-citation into a usable critical-thinking protocol."
    quote: "[Lecture I, on adherence-to-precedent as equity-of-treatment, p.34:] 'If a group of cases involves the same point, the parties expect the same decision. It would be a gross injustice to decide alternate cases on opposite principles. If a case was decided against me yesterday when I was defendant, I shall look for the same judgment today if I am plaintiff. To decide differently would raise a feeling of resentment and wrong in my breast; it would be an infringement, material and moral, of my rights.' Everyone feels the force of this sentiment when two cases are the same. Adherence to precedent must then be the rule rather than the exception if litigants are to have faith in the even-handed administration of justice in the courts. ... [Lecture IV, on adherence as rule + the case for relaxation:] 'In these days, there is a good deal of discussion whether the rule of adherence to precedent ought to be abandoned altogether. I would not go so far myself. I think adherence to precedent should be the rule and not the exception. I have already had occasion to dwell upon some of the considerations that sustain it. To these I may add that the labor of judges would be increased almost to the breaking point if every past decision could be reopened in every case, and one could not lay one's own course of bricks on the secure foundation of the courses laid by others who had gone before him. But I am ready to concede that the rule of adherence to precedent, though it ought not to be abandoned, ought to be in some degree relaxed. I think that when a rule, after it has been duly tested by experience, has been found to be inconsistent with the sense of justice or with the social welfare, there should be less hesitation in frank avowal and full abandonment. There should be greater readiness to abandon an untenable position when the rule to be discarded may not reasonably be supposed to have determined the conduct of the litigants, and particularly when in its origin it was the product of institutions or conditions which have gained a new significance or development with the progress of the years.' [On cross-jurisdictional variation:] 'None the less, the rule of adherence to precedent is applied with less rigidity in the United States than in England, and, I think, with a rigidity that is diminishing even here. The House of Lords holds itself absolutely bound by its own prior decisions. The United States Supreme Court and the highest courts of the several states overrule their own prior decisions when manifestly erroneous.' [Verified 2026-08-19 against the real PDF: exact match throughout; the closing two spans had never been quote-marked, so the checker had never actually checked them. The checker still cannot confirm them because the PDF interleaves Cardozo's own footnote markers into the body text at exactly these points.]"
canonical-instances:
  - "Walton's worked instance: the student cites Ms. Reasoner's late-essay extension as precedent for his own request. The rule (deadline-Tuesday) applies to him (CQ1 ✓); Ms. Reasoner's case is legitimate (CQ2 ✓); the question is whether 'another assignment due' is already a recognized exception (CQ3) — if it is, the rule stands and Ms. Reasoner's extension was already covered; if it isn't, the rule must be modified to add the new exception"
  - "common-law adjudication: a litigant cites a prior decided case where the same rule's antecedent was satisfied but the rule's conclusion was not enforced — the structural form of ratio decidendi reasoning. CQ2 is the 'distinguishing' move ('the cited case is materially different'); CQ3 is the 'subsumption under existing exception' move ('the cited case falls under an existing carve-out, so no new exception is needed')"
  - "academic-deadline grievance escalation (per Walton's example, generalized): when a student successfully cites a prior peer's extension as precedent, the policy must either modify the rule (add a new exception-category) or distinguish the prior case (deny precedential force) — institutions that fail to do either accumulate informal-precedent-drift that undermines the rule's stated form"
  - "policy-and-procedure manual updates: when an enforcement action is challenged by citing a prior unenforced instance, the policy team faces the same trifurcation — distinguish, subsume, or modify. Institutional sclerosis is what happens when none of the three is decisively executed and the rule's nominal-form drifts from its enforcement-form"
  - "stare decisis doctrine in appellate courts: the higher-court binding-precedent mechanism is institutionalized argument-from-precedent at scale — every appellate brief is structured around argument-from-precedent on both sides, with the court adjudicating via the three CQs explicitly (Does the rule apply? Is the cited case legitimate? Can we distinguish or subsume rather than modify?)"
  - "code-of-conduct enforcement when prior unenforced instances are cited: the precedent-citation pattern appears in HR / DEI / academic-misconduct adjudication. CQ4 (substrate extension) fires hard here: 'was the prior case actually adjudicated, or was it tacitly let-slide for unrelated reasons (administrative-delay, settlement, missing-records)? If the latter, the cited case lacks precedential force'"
  - "scientific peer-review precedent: 'this objection was previously rejected in Smith et al. 2019' — argument-from-precedent in scholarly review. CQ4 (authoritativeness) fires on whether Smith et al. 2019 was a legitimate peer-reviewed adjudication or a tacit acceptance via no-objection. The scheme exposes the structural reliance of scientific consensus on cited prior-decisions"
  - "lex-tpv83 established-rule contrast: where established-rule (lex-tpv83) is the FORWARD scheme (rule → required action), argument-from-precedent (lex-chtk9) is the BACKWARD/REFUTATION scheme (cited case → rule-modification-required). The two together model the full back-and-forth of rule-vs-exception disputes that institutional adjudication runs on"
