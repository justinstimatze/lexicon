id: lex-hrnuj
name: anchoring-bias
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When estimating an unknown number, your first reference point biases all subsequent estimates toward itself. Anchoring is robust even when the anchor is obviously arbitrary. To resist: generate your estimate BEFORE seeing any candidate anchor, or generate multiple independent estimates."
related: [lex-k6d7u, lex-9eprx, lex-t9fs7, lex-quu4s, lex-xqamc, lex-jafkg, lex-yh672, lex-nx7u7, lex-bun8e, lex-kgphf, lex-xu94g]
scaffolds-from: [lex-jafkg]
evokes: [tversky-kahneman-anchor, the-arbitrary-number-pulls-the-judgment, insufficient-adjustment, the-spinning-wheel-affects-the-UN-estimate, anchor-and-adjust-heuristic]
lineage:
  - source: practitioner
    text: tversky-kahneman-1974-judgment-under-uncertainty
    citation: "Amos Tversky & Daniel Kahneman, 'Judgment under uncertainty: Heuristics and biases,' Science 185(4157):1124-1131 (27 September 1974) — the canonical paper introducing anchoring along with availability and representativeness heuristics. The wheel-of-fortune experiment: subjects given a random number from a wheel were then asked 'is the percentage of African nations in the UN higher or lower than [wheel number]?' followed by 'what is the percentage?' The wheel-anchor systematically pulled estimates, even though subjects knew the wheel was random"
    quote: "[Tversky-Kahneman 1974 p.1128, 'Adjustment and Anchoring' / 'Insufficient adjustment':] 'In many situations, people make estimates by starting from an initial value that is adjusted to yield the final answer. The initial value, or starting point, may be suggested by the formulation of the problem, or it may be the result of a partial computation. In either case, adjustments are typically insufficient. That is, different starting points yield different estimates, which are biased toward the initial values. We call this phenomenon anchoring. [...] In a demonstration of the anchoring effect, subjects were asked to estimate various quantities, stated in percentages (for example, the percentage of African countries in the United Nations). For each quantity, a number between 0 and 100 was determined by spinning a wheel of fortune in the subjects' presence. The subjects were instructed to indicate first whether that number was higher or lower than the value of the quantity, and then to estimate the value of the quantity by moving upward or downward from the given number. Different groups were given different numbers for each quantity, and these arbitrary numbers had a marked effect on estimates. For example, the median estimates of the percentage of African countries in the United Nations were 25 and 45 for groups that received 10 and 65, respectively, as starting points. Payoffs for accuracy did not reduce the anchoring effect.' [Same section, on the multiplication experiment:] 'Two groups of high school students estimated, within 5 seconds, a numerical expression that was written on the blackboard. One group estimated the product 8×7×6×5×4×3×2×1 while another group estimated the product 1×2×3×4×5×6×7×8 [...] The median estimate for the ascending sequence was 512, while the median estimate for the descending sequence was 2,250. The correct answer is 40,320.'"
  - source: primary
    tradition: 8b-zim
    text: wikipedia-anchoring-effect-en-2025-12
    citation: "Wikipedia, 'Anchoring effect', en.wikipedia.org via ZIM archive wikipedia-en-all-nopic-2025-12 (path Anchoring_effect). The article opens with the operational definition, attributes the formalization to Tversky-Kahneman in their 1974 Science paper, and describes both the multiplication-task and wheel-of-fortune experiments (median estimate 512 for the ascending sequence vs 2,250 for the descending; UN-percentage estimates 25% under low-anchor vs 45% under high-anchor) — these are the two canonical-instances already in the atom"
    quote: "The anchoring effect is a psychological phenomenon in which an individual's judgments or decisions are influenced by a reference point or 'anchor' which can be completely irrelevant."
  - source: practitioner
    text: epley-gilovich-2006-anchoring-and-adjustment
    citation: "Nicholas Epley & Thomas Gilovich, 'The anchoring-and-adjustment heuristic: Why the adjustments are insufficient,' Psychological Science 17(4):311-318 (2006) — empirical test of the adjust-from-anchor mechanism. Anchors that are obviously irrelevant (random numbers) still pull judgments; the mechanism is partly automatic and not fully gated by relevance assessment. Verbatim quote below from p.311 (abstract); E&G also explicitly cite Tversky & Kahneman 1974 as origin: 'using what Tversky and Kahneman (1974) called the anchoring-and-adjustment heuristic'"
    quote: "One way to make judgments under uncertainty is to anchor on information that comes to mind and adjust until a plausible estimate is reached. This anchoring-and-adjustment heuristic is assumed to underlie many intuitive judgments, and insufficient adjustment is commonly invoked to explain judgmental biases."
canonical-instances:
  - "Tversky & Kahneman 1974 wheel-of-fortune: subjects observed a wheel-of-fortune randomly land on a number, then estimated 'percentage of African nations in the UN.' Median estimate when wheel showed 65: 45%. Median when wheel showed 10: 25%. The wheel was visibly random; subjects knew it. Anchoring fired anyway"
  - "negotiation opening offers: the first number on the table substantially shapes the final agreed price even when both parties know the first number was strategic-not-informative. Standard negotiation training teaches: be the one who anchors first, anchor aggressively"
  - "judicial sentencing experiments (Englich Mussweiler & Strack 2006): German judges given a randomly-generated 'demanded sentence' for a hypothetical case anchored their independent sentencing recommendations toward the random demand. Even legal training and professional discipline don't eliminate the effect"
  - "real-estate listing price: the listing price (often arbitrary or based on heuristic) anchors buyer offers and final-sale prices, beyond what objective property valuation would predict. The first number frames the negotiation"
  - "menu-item pricing strategy: deliberately-overpriced anchor items (e.g., a $295 entree) make $45 entrees feel reasonable. Restaurants engineer the anchor to shift the perceived-value range of other items"
  - "operationally distinct from lex-k6d7u credence-as-graded-belief: graded-credence is the discipline of holding probability-weighted beliefs; anchoring-bias is the systematic distortion that pulls those beliefs toward arbitrary reference points. Anchoring is a failure mode of credence-formation; graded-credence + anchoring-awareness is more robust than graded-credence alone"
  - "operationally adjacent to lex-9eprx loss-aversion: loss-aversion is asymmetric weighting around a reference point; anchoring is what determines WHERE the reference point is. The two compose: anchor sets the reference; loss-aversion describes the value function around it. They co-fire heavily in negotiation, pricing, and policy contexts"
  - "operationally adjacent to lex-t9fs7 confirmation-bias: confirmation-bias is asymmetric search/interpretation favoring prior belief; anchoring-bias is asymmetric pull toward initial reference. Both are insufficient-update phenomena. Different upstream causes (prior belief vs initial reference) but similar downstream effect (failure to fully integrate new information)"
critical-questions:
  - "is the anchor visible AS an anchor? Awareness of anchoring reduces but does not eliminate the effect (Wilson, Houston, Etling & Brekke 1996). The mechanism is partly automatic; explicit warnings help but don't fully gate it. Forcing-functions (independent estimation BEFORE seeing anchor; structured second-opinion; pre-registered estimate) are more reliable than awareness alone."
  - "how arbitrary can the anchor be and still pull? Tversky-Kahneman 1974 showed visibly-random anchors still pull. But the size of the pull scales with apparent-relevance. The mechanism is dose-dependent on perceived informativeness, even though it doesn't shut off when informativeness goes to zero. Discriminator: estimate the anchor's perceived-relevance separately from its actual-relevance."
  - "what mitigation actually works? Awareness < independent-first-estimate < pre-registered estimate < structured group-deliberation < red-team adversarial estimate. The reliable mitigations are procedural (you can't adjust your way out; you have to estimate before exposure). Mitigation that depends on the subject's willpower or attention is the weakest form."
  - "when multiple anchors are present, which wins? Anchors compete by recency, relevance, vividness, and source-credibility. The literature on multiple-anchor interaction is thinner than the single-anchor literature; if the case involves competing anchors (negotiation with multiple opening offers, judicial sentencing with multiple precedents cited), the prediction is less reliable. Discriminator: name all the anchors before predicting the pull-direction."
  - "does expertise protect against anchoring, or just hide it? Englich, Mussweiler & Strack 2006 showed legal experts anchor on demonstrably-random demands. Expertise tends to RAISE the threshold for what counts as a credible anchor but does not eliminate the mechanism. The expert is still anchored — just on more sophisticated reference points. Don't assume domain authority confers anchoring-immunity."
status: active
