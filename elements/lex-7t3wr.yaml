id: lex-7t3wr
name: argument-from-consequences-as-defeasible-recommendation-of-action-from-anticipated-outcomes
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When defending an action by its anticipated outcomes, check (a) is the outcome actually expected? (b) are the costs being counted alongside the benefits? (c) are there alternative actions with better outcome-profiles? Consequence-based recommendation is defeasible at all three joints."
related: [lex-af9ax, lex-kebfa, lex-th68b, lex-hesjt, lex-x6sbv, lex-8f8jk, lex-z3qjg, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-y7p3z, lex-tpv83, lex-chtk9, lex-9uac6, lex-xqamc, lex-7xz6k, lex-czseb]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt, lex-kebfa, lex-y7p3z, lex-utn22]
evokes: [practical-deliberation, cost-benefit-analysis, anticipated-outcome, danger-appeal, fear-appeal, threat-appeal, consequentialist-inference, felicific-calculus, instrumental-rationality, forward-from-goal]
premises:
  - "if action A is (not) brought about, then consequence B will occur"
  - "consequence B is good (bad) from the relevant goal/value perspective"
  - "therefore action A should (should not) be brought about"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(identify-action-under-consideration, project-anticipated-consequence, evaluate-against-goal-or-value) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "how strong is the likelihood that the cited consequences will (may, must) occur? Walton's CQ1. Consequence-schemes routinely smuggle in optimistic or pessimistic likelihood assertions ('will' when the evidence supports only 'may'). Diagnostic: ask explicitly 'is the modal claim key, and what's the empirical basis for it?' — slippage between will/may/must is the most common single failure mode of consequence-arguments in policy and personal-decision domains"
  - "what evidence supports the claim that the cited consequences will (may, must) occur, and is it sufficient to support the strength of the claim adequately? Walton's CQ2 — the evidence-sufficiency gate. The CQ chains downward into lex-kebfa (if evidence comes from authority), lex-xhwqt (if from sign), lex-utn22 (if from positioned-observer). When the consequence-prediction is essentially speculative and that's not surfaced, the scheme is overstating its confidence"
  - "are there other opposite consequences (bad as opposed to good, for example) that should be taken into account? Walton's CQ3 — the survey-of-alternatives gate. Most consequence-arguments stop at one consequence-chain and call the case made; rigorous deployment requires explicit consideration of the consequences the proponent is NOT highlighting. Diagnostic: ask 'what are the consequences from the inverse stance — bringing about NOT-A, or different framing of the goal?' — this is the lexicon's analog of Klein's pre-mortem (lex-pd9p6?) applied to consequence-inference"
  - "is the appeal pointing to objective consequences (legitimate) or targeting subjective emotional response (degraded toward fear/pity appeal)? Walton's distinction between consequence-scheme proper, danger-appeal, fear-appeal, and pity-appeal. Each step down adds emotional-targeting and weakens evidence-support requirements. Diagnostic: 'if the emotional charge were stripped, does the consequence-claim still warrant the recommendation?' — if no, the argument is sliding toward fear/pity rather than rigorous consequence-inference"
  - "is the agent committing to BRING ABOUT the cited consequences themselves (threat appeal) rather than merely WARNING of them? Walton's threat-vs-warning distinction. The warning form ('if you don't pay your mortgage, the bank will foreclose') is consequence-scheme; the threat form ('if you don't pay me protection, my associates will burn down your store') is the same scheme weaponized via speaker-commitment-to-bring-about-D. The two are structurally similar but normatively very different; identifying which is operative is part of correct CQ deployment"
  - "is the act of acting on the consequence-prediction going to CHANGE the consequence-distribution itself? When the prediction influences the predicted event (self-fulfilling, self-defeating, observer-effect, market-feedback, declaration-makes-it-true), the bare consequence-scheme fails because the conditional premise smuggles in a fixed background that the action itself disturbs. lex-z3qjg (acted-on-belief-causes-confirmation) is the canonical substrate machinery for this defeat; financial-bubble dynamics and political-opinion-polling both fail consequence-inference for this reason"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.4 §4 'Arguments from Consequences' (pp.100-102). Three scheme-forms: positive-consequences (Walton 1995 p.155 / 2000 p.141), negative-consequences (same), negative-consequences-prudential-subtype. Three critical questions p.102. Ch.4 §5 (pp.102-104) treats fear and danger appeals as variants of negative-consequences scheme distinguished by emotional-targeting vs objective-property. Compendium restatement Ch.9 #33 'Argument from Consequences' (p.332). Walton-Reed-Macagno frame argument-from-consequences as the generic category of causal inference — the consequential relation may be causal, temporal, or possibilistic — without presupposing an explanation of the inferential passage; only that two facts are successively related."
    quote: "[Ch.4 §4 pp.100-101] Argument from consequences may be considered as a generic category of causal inference [...] In some cases the correlation may be clearly identifiable as a causal, temporal, or possibilistic link, but the meaning of the consequence itself is not defined in the reasoning. The topic, in other words, does not presuppose an explanation of the inferential passage, but only that the two facts are successive and somehow related. [...] Argument from consequences has a positive and a negative form (Walton, 1995, p. 155; Walton, 2000, p. 141): Argument from Positive Consequences: If A is brought about, then good consequences will occur. Therefore, A should be brought about. Argument from Negative Consequences: If I (an agent) bring about (don't bring about) A, then B will occur. B is a bad outcome (from the point of view of my goals). Therefore, I should not (practically speaking) bring about A. [...] [Critical Questions p.102] CQ1: How strong is the likelihood that the cited consequences will (may, must) occur? CQ2: What evidence supports the claim that the cited consequences will (may, must) occur, and is it sufficient to support the strength of the claim adequately? CQ3: Are there other opposite consequences (bad as opposed to good, for example) that should be taken into account? [...] [On danger vs fear vs threat distinctions] Danger is an aspect of reality independent of the agent (Walton, 2000, p. 163). It is objective, while fears are emotional reactions of an agent to a situation. For this reason, the danger appeal argument may be considered as a special kind of argument from negative consequence based on a claim about the respondent's suffering serious harm or loss of life."
  - source: primary
    text: aristotle-ne-iii-3-deliberation
    citation: "Aristotle, *Nicomachean Ethics* Book III Chapter 3 (Bekker 1112a18-1113a14, esp. 1112b11-30), in F.H. Peters translation (5th edition, London 1893; reproduced in the lexicon corpus). The canonical classical treatment of practical deliberation (*bouleusis*), the cognitive process that argument-from-consequences operationalizes per-decision. Methodologically-distinct from Walton-Reed-Macagno along three axes: (1) Architectonic vs dialectical: Aristotle gives the ARCHITECTURE of practical deliberation as the backward-analysis from end to first-link-in-the-causal-chain (NE III.3 1112b15-28); Walton gives the FORWARD-from-action defeasible scheme with CQs. The two are structurally dual: Aristotle's deliberation analyzes 'how can I achieve end E?' and works backward through means; Walton's consequence-scheme projects forward 'if I do A, what consequences B follow?' and asks whether B is good-from-the-end-E-perspective. The forward scheme presupposes the backward analysis (the goal-frame that makes good/bad meaningful). (2) Virtue-ethics-embedded vs argumentation-theory-isolated: Aristotle embeds deliberation in his theory of *prohairesis* (deliberated choice) which is the immediate antecedent of virtuous action; deliberation is constitutive of moral agency, not just one inferential scheme. Walton isolates the scheme as one of 60+ in his catalog. (3) Scope-of-applicability built into the analysis: Aristotle gives explicit scope-limits (NE III.3 1112a21-30) — we do NOT deliberate about eternal/unalterable things, about regular-cause changes (solstices), about chance, about things outside our control, about matters of exact knowledge (writing). Walton's scheme has no such explicit scope-limits; the CQs do not test whether the situation is the kind in which consequence-deliberation is appropriate AT ALL. Aristotle's scope-doctrine should arguably be added as an additional CQ to the Walton scheme. Together: Aristotle's NE III.3 is the foundational architectonic that explains WHY the consequence-scheme works (deliberation IS means-end analysis under uncertainty) and where it doesn't apply; Walton's CQ apparatus is the per-instance dialectical instrument."
    quote: "[NE III.3 1112a31-b9] No one deliberates about eternal or unalterable things, e.g. the system of the heavenly bodies, or the incommensurability of the side and the diagonal of a square. Again, no one deliberates about things which change, but always change in the same way (whether the cause of change be necessity, or nature, or any other agency), e.g. the solstices and the sunrise; nor about things that are quite irregular, like drought and wet; nor about matters of chance, like the finding of a treasure. [...] But the things that we do deliberate about are matters of conduct that are within our control. [NE III.3 1112b8-9] A further limitation is that where there is exact and absolute knowledge, there is no room for deliberation; e.g. writing: for there is no doubt how the letters should be formed. [NE III.3 1112b9-11] We deliberate, then, about things that are brought about by our own agency, but not always in the same way... [NE III.3 1112b11-12] Matters of deliberation, then, are matters in which there are rules that generally hold good, but in which the result cannot be predicted, i.e. in which there is an element of uncertainty. [NE III.3 1112b11-28, the canonical means-not-ends passage] It is not about ends, but about means that we deliberate. A physician does not deliberate whether he shall heal, nor an orator whether he shall persuade, nor a statesman whether he shall make a good system of laws, nor a man in any other profession about his end; but, having the proposed end in view, we consider how and by what means this end can be attained; and if it appear that it can be attained by various means, we further consider which is the easiest and best; but if it can only be attained by one means, we consider how it is to be attained by this means, and how this means itself is to be secured, and so on, until we come to the first link in the chain of causes, which is last in the order of discovery. For in deliberation we seem to inquire and to analyze in the way described, just as we analyze a geometrical figure in order to learn how to construct it (and though inquiry is not always deliberation—mathematical inquiry, for instance, is not—deliberation is always inquiry); that which is last in the analysis coming first in the order of construction."
canonical-instances:
  - "everyday practical decision: 'if I take this job offer, I'll have higher salary but longer commute and less family time; therefore take it / decline it' — pure consequence-scheme deployment; CQ1 fires on likelihood-of-projected-outcomes, CQ3 on alternative-scenarios-not-modeled"
  - "policy cost-benefit analysis: 'if we implement carbon tax X, GDP impact is Y and emissions reduction is Z; therefore implement' — institutionalized consequence-scheme; the CBA framework IS the CQ3-survey-of-alternatives discipline scaled up"
  - "medical informed-consent: 'if you choose surgery, recovery is X with side-effect-profile Y; if you choose medication, outcome is Z with side-effect-profile W' — physicians deploy consequence-scheme as a pair of side-by-side variants forcing patient's CQ3 (compare alternatives) and CQ2 (evidence-sufficiency)"
  - "engineering design tradeoff: 'if we use Rust we get safety but longer build times; if Go we get faster builds but weaker type-system' — same scheme, evaluation-criterion is design-goal alignment"
  - "Walton's gangster-protection example (Walton 2000 p.123): 'You should pay us protection money because this is a very dangerous neighborhood' — formally fits consequence-scheme + danger-appeal but the speaker's commitment-to-bring-about-D promotes it to threat-appeal; CQ on threat-vs-warning is what distinguishes"
  - "Walton's insurance-salesman example (Walton 2000 pp.53-54): Benny Morelli story — formally consequence-scheme (no insurance → potential loss) but the graphic narrative targets emotional response, sliding into fear-appeal; CQ4 (emotional-targeting check) fires"
  - "smoking-cessation Marlboro-cowboy-with-oxygen-tube ad: consequence-scheme + danger-appeal; the objective danger of lung disease backs the consequence-claim, the ironic-deflation of macho image strips emotional cover from the cigarette ad's competing fear-appeal. Walton's instance of legitimate-danger-appeal."
  - "central-bank forward-guidance: 'if we raise rates, inflation will decline but unemployment may rise' — public-policy consequence-scheme; CQ6 (action-changes-distribution) fires hard because the very announcement of the rate-policy moves market expectations, changing the consequence-projection that justified the announcement"
  - "Aristotle's NE III.3 deliberation example: the doctor does not deliberate whether to heal, the orator does not deliberate whether to persuade — we deliberate not about ends but about what conduces to ends. The consequence-scheme is the inferential machinery of Aristotelian practical deliberation; the action recommended is the one whose consequences best-realize the agreed end"
severity-tier: info
status: active
