id: lex-pdpen
name: sentience-not-species-is-the-boundary-of-moral-concern
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When deciding whose interests deserve moral weight, check whether the boundary being drawn is species membership rather than the capacity for suffering (sentience). Singer's argument: the capacity to suffer (or to experience enjoyment/happiness) is not one characteristic among others competing to mark the boundary of moral concern — it is a PREREQUISITE for having interests at all. A stone has no interest in not being kicked because it cannot suffer; nothing done to it affects its welfare. A mouse does have such an interest, because it can suffer, regardless of its intelligence, rationality, or species. Marking the boundary instead at 'human' is structurally identical to marking it at 'white' or 'male': in each case an arbitrary characteristic — unrelated to whether the being can be benefited or harmed — is used to decide whose suffering counts. This does NOT mean all suffering counts equally in every comparison: a being with greater mental capacity (anticipatory dread, awareness of its own future) can genuinely suffer more from the same physical event than a being without that capacity, so equal consideration of interests can still direct action asymmetrically across species — but species membership itself is never the variable doing that work; the difference in capacity is."
related: [lex-srj3h, lex-gzgn3, lex-vx867, lex-v6dz2]
scaffolds-from: [lex-vx867, lex-v6dz2]
evokes: [speciesism, sentience-as-prerequisite-for-interests, bentham-can-they-suffer, arbitrary-boundary-of-moral-concern, equal-consideration-extended-beyond-species, factory-farming-as-speciesism-in-practice]
lineage:
  - source: primary
    text: singer-2011-practical-ethics-ch3
    citation: "Peter Singer, Practical Ethics, 3rd edition (Cambridge University Press, 2011), Chapter 3 'Equality for Animals?' Singer coined 'speciesism' in his earlier Animal Liberation (1975); this chapter is the fuller philosophical statement, tracing the sentience-as-boundary argument to Jeremy Bentham's Introduction to the Principles of Morals and Legislation (1789), Ch.17."
    quote: "[Bentham, quoted by Singer:] 'What else is it that should trace the insuperable line? Is it the faculty of reason, or perhaps the faculty of discourse?... The question is not, Can they reason? nor Can they talk? but, Can they suffer?' [Singer's gloss:] 'The capacity for suffering – or more strictly, for suffering and/or enjoyment or happiness – is not just another characteristic like the capacity for language or for higher mathematics... The capacity for suffering and enjoying things is a prerequisite for having interests at all... A stone does not have interests because it cannot suffer... A mouse, on the other hand, does have an interest in not being tormented, because mice will suffer if they are treated in this way.' [On the racism/speciesism structural parallel:] 'Racists violate the principle of equality by giving greater weight to the interests of members of their own race when there is a clash between their interests and the interests of those of another race... Similarly, speciesists give greater weight to the interests of members of their own species when there is a clash between their interests and the interests of those of other species.'"
canonical-instances:
  - "the slap-a-horse-vs-slap-a-baby comparison: an open-handed slap causes a baby real pain (thin, sensitive skin) but a horse barely notices (thick hide) — so 'the same physical act' does not mean 'the same amount of suffering'; equal consideration of interests tracks the suffering, not the act, and would judge a much harder blow to the horse as wrong for the same reason a slap to the baby is wrong."
  - "factory farming as speciesism in practice: raising animals in cramped, unsuitable conditions for their entire lives to produce meat, eggs, or milk at the lowest cost sacrifices major animal interests (freedom from prolonged suffering) for a minor human interest (the taste preference for meat over an available adequate alternative diet) — 'the principle of equal consideration of interests does not allow major interests to be sacrificed for minor interests.'"
  - "animal experimentation as the starkest case: experiments whose benefit to humans is speculative or nonexistent (e.g., decades of maternal-deprivation experiments on monkeys, LD50 lethal-dose cosmetics testing) impose certain, real suffering on a nonhuman animal for uncertain or trivial human gain — 'the experiments indicate a failure to give equal consideration to the interests of all beings, irrespective of species.'"
critical-questions:
  - "is a given cross-species comparison actually speciesist, or does it track a genuine difference in capacity for suffering? Singer's own example: preferring to run a painful experiment on an animal rather than a kidnapped human is not speciesist if the human's greater capacity for anticipatory dread (fear of being kidnapped) makes the human's total suffering genuinely greater — the reason is capacity-based, not species-based, even though it correlates with species in this case."
  - "how does this differ from lex-vx867 (moral-patienthood-and-moral-agency-as-orthogonal-poles)? lex-vx867 is the STRUCTURAL claim that patient-status (can be wronged) and agent-status (can do wrong) are separable axes — it doesn't say where the patient-status boundary itself should be drawn. This atom supplies that missing boundary claim: patient-status tracks sentience, not species. The atoms compose — lex-vx867 explains why a sentient nonhuman can have full patienthood without agency; this atom explains why sentience, specifically, is what grants the patienthood in the first place."
  - "does accepting this atom commit one to treating all sentient beings identically? No — Singer is explicit that equal consideration of interests, once extended across species, still permits (and often requires) differential treatment wherever the underlying interests genuinely differ in degree, exactly as it does within the human case (lex-v6dz2). The claim is about which beings' interests must be weighed at all, not about what weighing them equally requires in every instance."
