lineage:
  - source: primary
    text: brandom-1994-making-it-explicit-ch3-scorekeeping
    citation: "Robert B. Brandom, *Making It Explicit: Reasoning, Representing, and Discursive Commitment* (Harvard University Press 1994, ISBN 9780674543300). Chapter 3 'Linguistic Practice and Discursive Commitment' lays out the deontic scorekeeping framework. Brandom extends Sellars (1956 'Empiricism and the Philosophy of Mind' on the 'space of reasons'), Wittgenstein (language-games), Frege (inferential-role semantics), and Austin (1955 *How to Do Things with Words* on performative utterances) into a comprehensive inferentialist + normative-pragmatist account of linguistic meaning. The transferable structural claim is the deontic scorekeeping mechanism: speakers track their own and others' commitments (publicly undertaken bindings via assertion) and entitlements (which commitments the speaker has earned the right to hold). Norms are implicit in the practice of holding-to and challenging. Inference (giving and asking for reasons) is the central activity; propositions are what can serve as premises and conclusions in the network of inferential commitments. The framework has been extensively extended in (a) Brandom 2000 *Articulating Reasons* (the accessible précis); (b) Brandom 2008 *Between Saying and Doing* (modal extensions); (c) Brandom 2019 *A Spirit of Trust* (Hegelian reading of recognition and trust). The book has been influential in (i) philosophy of language and mind (Sellars-Brandom-McDowell Pittsburgh school); (ii) AI alignment + dialogue systems (the commitment-tracking framework informs Microsoft's research on dialogue systems' trust-tracking); (iii) legal philosophy (the deontic-status framework parallels Hohfeldian jural-relations — see lex-qhydj); (iv) formal epistemology (scorekeeping models in game-theoretic semantics; Lascarides-Asher SDRT); (v) software engineering — Brandom's commitment-scoreboard model has been applied to API-versioning, dependency-inheritance, and code-review as discursive practice. The atom extracts the structural primitive — discursive practice as mutual scorekeeping of commitments and entitlements — separately from Brandom's Hegelian metaphysics and the broader inferentialist program. Distinct from Berger-Luckmann's institutional-production (lex-3656j) which operates at the broader institution-level; Brandom operates at the speech-act level within an established discursive institution."
    quote: "[Brandom 1994 Preface and Ch.3, the canonical statement of deontic scorekeeping:] 'The natural world does not come with commitments and entitlements in it; they are products of human activity. In particular, they are creatures of the attitudes of taking, treating, or responding to someone in practice as committed or entitled (for instance, to various further performances). Mastering this sort of norm-instituting social practice is a kind of practical know-how — a matter of keeping deontic score by keeping track of one's own and others' commitments and entitlements to those commitments, and altering that score in systematic ways based on the performances each practitioner produces. The norms that govern the use of linguistic expressions are implicit in these deontic scorekeeping practices.' [On the inferentialist account of propositional content, same source:] 'propositional contentfulness should be understood in terms of inferential articulation; propositions are what can serve as premises and conclusions of inferences, that is, can serve as and stand in need of reasons.' [On the making-it-explicit method:] 'It illuminates the normative dimension of discursive practice in line with the methodological principle that implicit structures are often best understood by looking at how they can be made explicit.' [On assertion as undertaking commitment:] 'I endorse those assertions; they express my commitments. One of the central tenets of the account of linguistic practice put forward here is that the characteristic authority on which the role of assertions in communication depends is intelligible only against the background of a correlative responsibility to vindicate one's entitlement to the commitments such speech acts express.' [On entitlement-by-deferral:] 'Entitlement to commitment to one claim can be extended to entitlement to another either according to the inferential pattern appealed to by justification, in which case that entitlement is inherited by another commitment (to a different claim) undertaken by the same interlocutor, or according to the communicational pattern appealed to by deferral, in which case that entitlement is inherited by another commitment (to the same claim) by a different interlocutor.' [On scorekeeping as the foundation of pragmatic significance:] 'The pragmatic significance of performances — eventually, speech acts such as assertions — is then understood to consist in the difference those performances make to the commitments and entitlements attributed by various scorekeepers.'"
  - source: cross-attestation
    text: cross-domain-deontic-scorekeeping
    citation: "Cross-domain attestation that the deontic-scorekeeping mechanism recurs across (a) legal proceedings, (b) scientific peer review, (c) code review and git authorship, (d) dialogue systems and LLM evaluation, (e) contract enforcement, and (f) credentialing systems. SOURCES: Wesley N. Hohfeld 1913 'Some Fundamental Legal Conceptions as Applied in Judicial Reasoning' (Yale Law Journal) on jural-relations as a deontic scoreboard (see lex-qhydj substrate-grounded atom); H. L. A. Hart 1961 *The Concept of Law* on legal norms as practice-instituted; J. L. Austin 1955 *How to Do Things with Words* (lex-y2tbg substrate-grounded) on the performative-utterance tradition Brandom extends; John Searle 1969 *Speech Acts* on the felicity-conditions of assertion as a commitment-undertaking; Robert Stalnaker 1978 'Assertion' (Syntax and Semantics) on the common-ground model where assertions update a shared informational scoreboard; Robert Merton 1942 'The Normative Structure of Science' on CUDOS norms as scientific deontic infrastructure (universalism, communalism, disinterestedness, organized skepticism); the explicit modeling of dialogue commitment in computational dialogue systems (Lascarides + Asher 2003 *Segmented Discourse Representation Theory*; Bos 2003 commitment-stores in dialogue management); software-engineering practice of code-review-as-commitment-tracking (Greg Wilson 2011 *Making Software*; the GitHub PR-review workflow as institutionalized scorekeeping). The same structural primitive recurs: speakers/actors undertake commitments via performances; tracked by scorekeepers; entitlements established via deferral, inference, or direct observation; the practice institutes its own normative structure. The transferable use is the diagnostic — when discourse degrades, ask whether the scorekeeping practice has eroded."
    quote: "Across Brandom 1994 (the canonical articulation), Hohfeld 1913 jural-relations (legal deontic scoreboard, lex-qhydj), Austin 1955 performative utterances (lex-y2tbg Butler extension), Searle 1969 felicity-conditions for assertion, Stalnaker 1978 common-ground assertion-update model, Merton 1942 CUDOS scientific norms, Lascarides-Asher 2003 SDRT commitment-stores in dialogue, and code-review-as-scorekeeping practice in modern software engineering, the same structural primitive recurs: discursive practice institutes a commitment-and-entitlement scoreboard tracked by participants; assertions update the scoreboard; entitlement is established by deferral, inference, or observation. The transferable use is the diagnostic — when discourse degrades into unmoored vibes, ask which part of the scorekeeping practice has eroded."
canonical-instances:
  - "Brandom's canonical example (Ch.3): a speaker S asserts 'p'. By this performance, S has UNDERTAKEN commitment to p (others can hold S to it). If asked 'how do you know?' S can defer (citing authority or another committed speaker), can offer an inference (from other commitments), or can cite direct observation. S's entitlement to p is established by these moves. Other scorekeepers update their attribution: S is now committed-to and entitled-to p. If a later utterance contradicts p, S's scoreboard becomes inconsistent and others can demand resolution."
  - "Code review (GitHub PR workflow): the PR author asserts a set of commitments (the diff implements feature X, doesn't break tests, follows style guide). The reviewer probes entitlement (does the code actually implement X? are the tests sufficient?). Citations to upstream library docs are deferral (inheriting library maintainers' commitments). Approval = entitlement granted by the reviewer's scoreboard. Merge = the commitment is now part of the project's accumulated scoreboard."
  - "Scientific peer review: the paper asserts findings; reviewers probe entitlement (method validity, data sufficiency, statistical analysis); citations are deferral; revisions establish entitlement; acceptance = the journal's scoreboard now grants the paper entitlement. Citing the published paper inherits its commitments."
  - "Legal trial: each witness's testimony is an undertaking; cross-examination probes entitlement; precedent (case-law) is inherited commitment; the judge's ruling updates the scoreboard for future cases."
  - "Contract enforcement: contractual clauses are mutual commitments; performance is fulfillment-of-commitment; breach is failure-of-vindication; courts adjudicate based on the contractual scoreboard's state at the relevant time."
  - "LLM dialogue: when the model asserts 'X is the capital of Y', the dialogue scoreboard contains a commitment to X-is-capital-of-Y. The user can challenge entitlement ('but X isn't a capital'); the model must defer (training-data citation), infer (from other commitments), or retract. Hallucinations are commitments without entitlement-warrant; honest models track their epistemic state on the scoreboard."
  - "Professional credentialing: a medical license is a third-party-issued entitlement to make certain medical claims without further justification. The licensing board's scoreboard tracks who is entitled to what scope of practice; revocation removes entitlement."
  - "Citation chains as deferral trees: each citation is an entitlement-by-deferral move; the cited paper inherits the citing paper's commitment; tracing citations backward exposes the deferral chain. Broken citations (the cited claim doesn't appear in the cited source) are deferral failures."
  - "Conversational turn-taking (Sacks-Schegloff-Jefferson 1974): every utterance shifts the deontic scoreboard. Clarification requests are entitlement-probes; backchannels are acknowledgments; repair sequences are renegotiations of the scoreboard."
  - "operationally distinct from lex-p48xw articulation-as-thinking-completion-test (Vygotsky-Polanyi-Feynman individual articulation as cognitive completion): lex-p48xw is about INTRA-PERSONAL thinking via verbalization; lex-xuna9 is about INTER-PERSONAL deontic tracking of public utterances. They compose: articulating to think (lex-p48xw) IS the speaker-side activity that produces the public commitments lex-xuna9 tracks."
  - "operationally distinct from lex-3656j shared-institutional-reality (Berger-Luckmann reciprocal typification): lex-3656j names the institutional-production process by which language and discourse become objective-and-taken-for-granted. lex-xuna9 names the scorekeeping mechanism that operates WITHIN an established discursive institution. Lex-0738 is the broader frame; lex-xuna9 is the speech-act-level mechanism within it."
  - "operationally distinct from lex-d7h2y paltering-as-truth-arranged-to-deceive (Schauer-Rogers): paltering is a specific deceptive-assertion strategy; lex-xuna9 names the underlying scoreboard against which paltering is a manipulation (paltering exploits the scorekeepers' assumption that you would defer entitlement-warrants for the implicature, when in fact you don't)."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition-not-its-cause (Butler performativity): Butler's gender-performative is about IDENTITY-DOING constituting identity-being. Brandom's linguistic-performative is about ASSERTION-DOING constituting commitment-undertaking. Both extend the Austin 1955 performative-utterance tradition; Butler specializes to gender, Brandom specializes to assertion."
  - "Failure mode — DEONTIC-VACUUM: speech in contexts where no scorekeeper tracks the commitments. Late-stage social-media discourse with no thread-continuity, anonymous comment sections, throwaway accounts. The scorekeeping practice has eroded; commitments are uncollected; entitlement-warrants don't get checked. The result is unmoored discourse (vibes-as-truth)."
  - "Failure mode — MASS-ENTITLEMENT-BY-DEFAULT: assertions get treated as entitled because the speaker is in-group or persuasive, not because of actual deferral-to-source or inferential support. Information cascades (Bikhchandani-Hirshleifer-Welch 1992) are mass-entitlement failures."
  - "Failure mode — UNVERIFIED DEFERRAL CHAIN: chains of citation where the entitlement-warrant is broken at some link (the cited claim was misread, the source no longer exists, the source itself deferred to broken sources). 'Telephone game' as commitment-decay."
critical-questions:
  - "Does the atom commit to Brandom's full inferentialist program — that meaning IS inferential role and nothing else? No. The atom captures the STRUCTURAL CLAIM about scorekeeping as the mechanism of discursive normativity, separately from Brandom's broader semantic-inferentialist metaphysics. The structural claim is well-attested independently — Hohfeld's jural-relations (lex-qhydj), Searle's felicity-conditions, Stalnaker's common-ground model, Merton's CUDOS norms all operate with scoreboard-like mechanisms — without requiring Brandom's specific reduction of meaning to inference."
  - "Does the atom imply that LLMs need explicit commitment-tracking architecture to participate in discourse? Carefully. The atom names a structural feature of discursive practice; current LLMs participate in this practice without explicit scoreboards (they ENACT it via training on commitment-tracked text). But systems that maintain explicit commitment-stores (Lascarides-Asher SDRT, Bos commitment-management) can do better at long-context coherence and at detecting when their own assertions are unwarranted. Diagnostic: when LLM hallucinations occur, ask whether the model has a working scoreboard for its own commitments + their entitlement-warrants."
  - "How does the atom apply when a discursive community has hostile actors who don't play by the scorekeeping rules? The atom names the COOPERATIVE practice; bad actors are a separate failure mode. The mechanism still applies — bad actors are speakers who systematically take advantage of the scorekeeping practice (incurring commitments they don't intend to vindicate). The fix is institution-level: build mechanisms (reputation, sanctions, removal) that scorekeepers can use to enforce vindication. The atom describes the normal-case structure; institutional design must handle defection."
  - "Does the atom apply to non-linguistic practices (e.g., visual art, music, mathematical proof)? Partially. Mathematical proof is the cleanest extension — proofs are commitment-undertakings that the mathematical community scorekeepers track; entitlement-by-inference is the proof itself; entitlement-by-deferral is citing established theorems. Visual art is murkier — there are entitlement-norms (originality, citation of influences) but the assertion-and-vindication structure is more diffuse. The atom most cleanly applies to discursive practices with explicit content; analogizing to other domains requires articulating what counts as 'assertion' and 'vindication.'"
  - "How does this compose with lex-3656j (Berger-Luckmann institutional production)? Composition: lex-3656j names how the INSTITUTION of discourse arises (habituation + reciprocal typification + objectivation + internalization); lex-xuna9 names the SPEECH-ACT-LEVEL mechanism within that institution. The two work at different scales: lex-3656j is the production of the game; lex-xuna9 is the rules of the game once it exists. Together they explain how language gains and maintains normative force."
