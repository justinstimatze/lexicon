id: lex-5n3d2
name: one-behavioral-indicator-can-mean-opposite-things-by-stage
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When tracking one behavioral indicator across a population that includes people at different stages of a shared process, don't assume the indicator carries one stable psychological meaning throughout — check whether the identical observable choice can index opposite underlying states depending on how far along the process the person making it actually is. Kendall and Selvin build their whole trend argument (Tables 14-16) on 'preference for a rotating internship' as though it were a single continuous measure of low interest in specialization, then explicitly flag that this is not safe to assume. Describing a first-year student's reluctance to name a specialty, they write: 'This illustrates what is meant by the tentative ... assumption that, in the early years of medical school at least, selection of a rotating internship may indicate \"suspended judgment\" regarding fields of specialization which may later prove attractive, rather than a complete lack of interest in specialization.' They then generalize the caution explicitly: 'This points to an interesting methodological problem, namely, that the choice of a rotating internship appears to have different implications in different social contexts. It is our assumption that, in the later phases of medical training, the selection of this kind of internship represents a positive decision, while in the earlier phases it represents, in many cases, a way of avoiding any decision.' The identical checkbox — 'rotating internship' — is doing two different jobs depending on when it is checked: for a first-year student it indexes not-yet-enough-information to choose, a deliberate non-choice that keeps future options open; for a fourth-year student choosing the same option, it indexes either a genuinely settled preference for general practice, or (per formal-approval-ratifies-a-selection-already-made-informally, lex-h5c5x) the product of an informal downgrade already imposed by rank. A researcher who plots '% choosing rotating' by class year and reads the declining line as one population's attitude smoothly hardening is actually watching two different populations — one still gathering information, one that has already decided one way or another — mix in different proportions at each stage. Distinct from the-same-fact-is-relabeled-at-each-structural-level-that-views-it (lex-x4bhy): that atom is about several SIMULTANEOUS observers (an individual, a profession, a society) applying different vocabulary to one shared fact at one point in time. This atom is about a single response CATEGORY carrying different psychological content depending on WHEN, in one continuing process, the same nominal choice is made — a cross-time confound inside one measure, not a cross-observer relabeling of one event. Also distinct from distance-from-a-role-shapes-which-facet-you-see (lex-4dm39): that atom explains why two observers form different PICTURES of the same target because of what each observer's own activity makes salient; this atom is about a researcher's own coding scheme, where the risk is treating a single answer option as psychologically uniform across respondents who differ only in how far into the process they are. Diagnostic move: before reading a change over time in the proportion choosing option X as evidence that attitudes are shifting, ask whether X might be absorbing two structurally different populations — those who haven't yet formed a preference and those who have one and prefer X on its own merits — and check whether it is the MIX between those two populations shifting, rather than any individual's underlying attitude."
related: [lex-4dm39, lex-x4bhy, lex-h5c5x]
