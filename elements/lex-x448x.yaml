name: winning-the-visible-deception-can-still-lose-the-real-stakes
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Designing a deception around which of two options someone will pick, and successfully controlling how each option looks, doesn't guarantee you win if you never understood what the choice actually determines beneath its surface. Prometheus disguises a slaughtered ox's two portions to trick Zeus into picking the worse share: 'the better part (the edible meat) he made unappealing by covering it with the ox's stomach... the lesser part (the inedible bones) he covered with fat to make it look like rich meat.' Zeus isn't fooled by any of it: 'Zeus was not deceived, however; he could see beneath the surfaces of the Promethean shell game. And yet he didn't choose the 'better' portion, he chose the bones.' Zeus wins not by falling for or resisting the visual trick, but by reading a symbolic register Prometheus never accounted for at all: 'for the Greeks the bones stand for immortality... the belly stands for needy, shameless, inexorable, overriding appetite... those who eat the belly-wrapped meat must take the same thing as their portion in the world.' Prometheus spent his cunning entirely on making one option look better than the other; he never asked what choosing either option would actually cost the chooser. Diagnostic move: when you're constructing a choice for someone else and focusing your effort on which option looks more appealing, stop and check whether you understand what selecting each option actually commits the chooser to at a level beneath the surface presentation -- an opponent who reads that deeper level can walk straight through your visual misdirection and still end up ahead."
