id: lex-md8ku
name: two-sided-platforms-price-by-cross-side-externality-not-cost
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When pricing a platform that brings together two distinct groups of end-users whose value to each other depends on how many of the other group shows up — cardholders and merchants, readers and advertisers, app users and developers, gamers and game studios — do not price each side to its own stand-alone cost or demand. Check the PRICE STRUCTURE, not just the total price level: how the total price splits between the two sides is a separate design variable from how high the total price is, and the profit-maximizing split (and even the welfare-maximizing Ramsey split, when the goal is efficiency rather than profit) is set by each side's price elasticity and by how much that side's participation is worth to the OTHER side — the cross-group externality — not by each side's own cost-to-serve. This routinely implies a lopsided split: price one side at or below its own marginal cost (free, subsidized, effectively a loss leader) to grow it, because growing that side raises what the other side is willing to pay, and recover the shortfall — and the platform's margin — from the other side. Don't read 'the merchant/developer/advertiser side is being overcharged' or 'the consumer/reader/gamer side is getting a free ride' as self-evident exploitation before checking whether the subsidized side is precisely the side whose growth confers the larger externality on the other — a below-cost price on one side can be the EFFICIENT allocation, not merely the profitable one. When advising on platform pricing or business-model design, or when reading an existing lopsided price structure, ask which side, if made more numerous, raises the other side's surplus more — that side is the one to court, and the pricing asymmetry follows from that answer, not from a per-side cost audit."
related: [lex-mwgep, lex-yyfx5, lex-994yb, lex-ukgke, lex-z2fkk, lex-5gg2c]
