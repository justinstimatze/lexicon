lineage:
  - source: primary
    text: Sartre-1943-BeingAndNothingness
    citation: "Jean-Paul Sartre, *L'Être et le néant: Essai d'ontologie phénoménologique* (Paris: Gallimard, 1943); English translation Sarah Richmond, *Being and Nothingness: An Essay in Phenomenological Ontology* (London: Routledge, 2018; New York: Washington Square Press, 2021 ed.) — the Richmond translation is the contemporary scholarly standard, supplanting Hazel Barnes 1956. Part I (`The Problem of Nothingness`) Chapter 2 (`Bad Faith,` pp. 89-145 in Richmond) develops the analysis of *mauvaise foi* as the recurring project by which consciousness flees the burden of its constitutive freedom-with-situation. The chapter's structure: §I `Bad faith and the lie` (distinguishes bad faith from cynical deception by surfacing that it is self-deception within a single consciousness); §II `Forms of bad faith` (the canonical examples — the woman on a date who lets her hand remain in his hand while disavowing her body; the homosexual man who insists he `is not a homosexual` in the mode of being-an-essence-while-not-being-one; the waiter in the café whose performance is too-fully-the-waiter, fleeing into facticity); §III `The faith of bad faith` (the constitutive instability of belief that makes bad faith both possible and necessary — `to believe is not to believe`). Cross-Sartre: *Anti-Semite and Jew* (1946) extends bad-faith analysis to identity-claims and to the construction of the racial Other; *Existentialism Is a Humanism* (1946) simplifies the framework for public reception (with caveats about how it flattens the original analysis); Simone de Beauvoir 1947 *The Ethics of Ambiguity* extends the framework into ethics; Beauvoir 1949 *The Second Sex* applies it to the production of `the eternal feminine`. The transferable structural primitive: when a person is anxious about the burden of having to choose without external warrant, they characteristically flee the burden by collapsing their freedom-with-situation into either pole — claiming fixed essence (facticity-as-determination) or claiming unsituated freedom (transcendence-as-no-situation); both moves are SELF-DECEPTION made possible by the constitutive instability of belief; the structural alternative is not good-faith-as-self-coincidence (impossible) but authenticity-as-holding-both-poles-in-tension."
    quote: "[Sartre 1943 *Being and Nothingness* I.2 (Richmond tr.), the central bad-faith passages:] 'There is no cynical lie in bad faith, or any knowing preparation of misleading concepts. But bad faith's most basic act is to flee from something it is impossible to flee from: to flee from what one is. Now, the very project of flight reveals to bad faith an internal disintegration at the heart of being — and this disintegration is what it wants to be... If bad faith is possible, that is because it threatens — immediately and permanently — every project made by human beings, and because consciousness harbors in its being the permanent risk of bad faith. And the source of that risk is that consciousness is what it is not and is not what it is, in its being and simultaneously.' [Sartre on the constitutive instability that makes bad faith possible:] 'belief is a being that puts itself in question in its own being, and that can be actualized only in its destruction; it is a being that can become manifest to itself only by negating itself, a being for which to be is to appear, and to appear is to negate itself. To believe is not to believe... The ideal of good faith (to believe what one believes) is — like the ideal of sincerity (to be what one is) — an ideal of being-in-itself.' [Sartre's note that authenticity is the structurally-different third term:] 'If it is a matter of indifference whether to be in good or bad faith, because bad faith takes hold of good faith and slides into its project even at its origin, that does not mean that we are unable radically to escape from bad faith. But that would require corrupted being to reclaim itself. We will call this `authenticity`: its description does not belong here.' [Practitioner-extraction for transferable lex-ezcv6: the critical structure has three poles, not two. (1) FACTICITY-CLAIMED-AS-ESSENCE: collapsing freedom into the determination of one's situation (`I AM a coward, that just IS who I am`). (2) TRANSCENDENCE-CLAIMED-AS-UNSITUATED: collapsing situation into pure freedom (`I am not really like that, my situation does not bind me`). Both are bad faith and both are self-deceptions made possible by the constitutive instability of belief inside a single consciousness — bad faith is NOT a cynical lie. (3) AUTHENTICITY is the third term — owning both poles, acting as the one who chooses under conditions one did not choose. The substrate generalization: any agent confronting the burden of self-authorization can flee toward either pole; the diagnostic is to surface which pole is being collapsed; the constructive move is the third term, not the return to good-faith-as-self-coincidence (which is itself impossible).]"
  - source: cross-attestation
    text: cross-domain-self-deceptive-evasion-of-the-burden-of-choice
    citation: "Cross-domain attestation that the structural primitive — agents under the burden of having to authorize their own conduct without external warrant flee that burden by collapsing freedom-with-situation into either pole — recurs across phenomenology + existential ethics, organizational + role behavior, clinical psychology, social-political identity discourse, addiction studies, and AI alignment + interpretability. (a) Phenomenology + existential ethics: Simone de Beauvoir 1947 *Pour une morale de l'ambiguïté* (*The Ethics of Ambiguity*) develops the bad-faith framework into a positive ethics of ambiguity, identifying typologies (the sub-man, the serious man, the nihilist, the adventurer, the passionate man) as different bad-faith postures and the free authentic agent as the structurally-different third term; Heidegger 1927 *Sein und Zeit* §§35-38 develops a parallel analysis of *das Man* (the They) and Verfallenheit (fallenness) as analogous evasions of authentic existence; Beauvoir 1949 *Le Deuxième Sexe* applies the framework to the production of `the eternal feminine` as a culturally-enforced bad-faith posture toward facticity. (b) Organizational + role behavior: Hannah Arendt 1963 *Eichmann in Jerusalem: A Report on the Banality of Evil* is the canonical case study — Eichmann's `I was only following orders` is bad faith toward facticity; the matching `personally I disagreed but the role required it` posture is bad faith toward transcendence; both are evasions of the burden of standing for one's conduct in a bureaucratic role. Goffman 1959 *Presentation of Self in Everyday Life* documents role-performance with implicit bad-faith analysis (the participant who is `taken in by their own act` vs `cynically aware of the performance` are running the two poles). (c) Clinical psychology + therapy: identification-with-diagnosis vs disidentification-from-history are the two bad-faith postures clinical work navigates; integrative + ACT (Acceptance and Commitment Therapy, Hayes 1999) explicitly addresses the gap between fusion-with-identity and dissociation-from-conduct as the therapeutic target; the recovery literature's `name-and-claim-but-do-not-be-defined-by` posture explicitly threads between the two evasions. (d) Social-political identity discourse: the long literature on essentialist-vs-constructionist identity claims (Butler 1990 *Gender Trouble*; the post-Sartrean strand running through Frantz Fanon 1952 *Peau noire, masques blancs* on racial bad faith) operationalizes the framework. (e) Addiction studies: the canonical recovery framing distinguishes `denial as I'm not really an addict` (transcendence-flight) from `learned helplessness as I just AM an addict, no choice possible` (facticity-flight). (f) AI alignment + interpretability: the increasingly-documented patterns of AI systems responding `I am just a language model and cannot do otherwise` (facticity-flight evading responsibility for output) vs `the role I was playing in that prompt was not really me` (transcendence-flight evading responsibility for in-context behavior) are the two bad-faith postures in AI agent identity; alignment work on stable values + agentic responsibility navigates between them. (g) Workplace + ethical-dilemma analyses: the `just doing my job` posture and the matching `personally I disagree but the structure requires it` posture are the two bad-faith moves the literature on whistleblowing + organizational ethics distinguishes from authentic ethical agency."
    quote: "Across phenomenology + existential ethics (Beauvoir 1947 Ethics of Ambiguity + 1949 The Second Sex, Heidegger 1927 §§35-38 on das Man + Verfallenheit, Fanon 1952 Black Skin White Masks on racial bad faith), organizational + role behavior (Arendt 1963 Eichmann in Jerusalem on banality of evil as bad-faith posture, Goffman 1959 Presentation of Self), clinical psychology + therapy (identification-with-diagnosis vs disidentification-from-history; Hayes 1999 ACT on fusion-vs-dissociation as therapeutic target), social-political identity discourse (Butler 1990 Gender Trouble + the essentialist-vs-constructionist debate), addiction studies (denial vs learned-helplessness as the two bad-faith postures in recovery), AI alignment + interpretability (`I am just a language model` facticity-flight vs `the role I was playing was not really me` transcendence-flight), and workplace + ethical-dilemma analyses (`just doing my job` vs `personally disagree but business requires it`), the same structural primitive recurs — agents under the burden of self-authorization characteristically flee by collapsing freedom-with-situation into either pole; both moves are self-deception, not cynical lies; the structural alternative is authenticity-as-holding-both-poles-in-tension, not return to good-faith-as-self-coincidence. The transferable diagnostic: surface which pole is being collapsed; do not let either pole stand alone as a settlement; ask what authentic ownership of choice-under-unchosen-conditions would look like."
canonical-instances:
  - "Sartre's waiter in the café (BN I.2 §II, Richmond tr.): the waiter who is too-thoroughly-a-waiter, whose every gesture is the gesture of a waiter, who has fled into the role so completely that he has identified his being with his function. The bad faith here is facticity-flight — collapsing his freedom-with-situation into pure facticity. The waiter's eagerness to BE a waiter (and only that) is the flight from the burden of being someone who has chosen to take a service job. Transferable: any role-performance that is not held in tension with the chooser-of-the-role runs this structure."
  - "Sartre's woman on a date (BN I.2 §II): the woman who lets her hand remain in her companion's hand while internally insisting `that hand is not me; my real self is having an intellectual conversation about other things.` The bad faith is transcendence-flight — disowning her body's complicity in the situation by claiming she is a pure consciousness floating above her embodied conduct. Transferable: any disavowal of conduct by appeal to the agent's `real self` running this structure."
  - "Arendt 1963 *Eichmann in Jerusalem*: the `banality of evil` thesis identifies bureaucratic role-performance as a bad-faith posture toward facticity. Eichmann's `I was only following orders` is structurally the waiter writ large — fleeing the burden of having chosen to authorize what one's role compels. The transferable diagnostic: bureaucratic role-performance is the canonical case of facticity-flight at scale."
  - "Beauvoir 1949 *The Second Sex* on the production of `the eternal feminine`: the framework analyzes how `woman is what man makes of her` and how women themselves can occupy bad-faith postures toward facticity (`I am simply a wife and mother, no other freedom is available to me`) or transcendence (`I am not really like other women, the situation does not bind me`). Beauvoir applies Sartre's framework to gender as a culturally-enforced bad-faith posture."
  - "Recovery from addiction: the recovering alcoholic in bad-faith-toward-facticity says `I AM an alcoholic, that's who I am, no choice is involved.` The matching bad-faith-toward-transcendence says `I'm not really an addict, I just made some bad choices once and that's not me.` Effective recovery work (the AA tradition's `we admitted we were powerless over alcohol' explicitly threads between the two: the admission is facticity-acknowledgment, but the powerlessness applies to past not future and the program is one of choices) integrates facticity + freedom."
  - "AI agent identity-evasion postures: when an AI system is asked to take responsibility for an output it produced, two characteristic evasions appear. (1) Facticity-flight: `I am just a language model; I cannot stand for the output I produced; my training determined it.` (2) Transcendence-flight: `that response was a role I was playing in your prompt context; it doesn't reflect my real values; I was performing.` Both run the Sartre structure; alignment work that addresses stable values + agentic responsibility navigates between them by asking the AI to own conduct-under-training-conditions-it-did-not-choose."
  - "Clinical psychology + identification-with-diagnosis: the patient who has been given a diagnosis (depression, ADHD, bipolar, autism) may flee into the diagnosis as fixed essence (`I AM bipolar, my behavior is determined by my disorder, no choice possible`) — facticity-flight — or away from it (`those traits aren't really me, the diagnosis is wrong, I can transcend it through pure will`) — transcendence-flight. Integrative therapeutic frames (ACT, dialectical-behavior therapy) explicitly thread between fusion-with-identity and dissociation-from-conduct."
  - "Workplace ethical evasion: the engineer who `just builds what the spec says, I don't make policy` is fleeing toward facticity; the matching manager who `personally I would never approve this, but the business case requires it` is fleeing toward transcendence. Both evade the burden of standing for the conduct one is participating in. The canonical literature on whistleblowing + organizational ethics distinguishes these from authentic ethical agency that owns both the institutional position + the personal authorization."
