id: lex-w6vv9
name: a-remedy-given-without-payment-is-treated-as-carrying-no-curative-power
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "In some systems of belief, and in a surprising amount of ordinary human psychology, a cure's effectiveness is tied not just to what it contains but to whether a real cost was paid for it -- a free remedy is treated as inherently weaker, even worthless, regardless of its actual contents. In the Zuni retelling of 'The Cock and the Mouse,' an old woman refuses to heal her rooster's wound until he assembles payment through an entire chain of favors, four bristles from a dog earned with bread earned with wood earned with rain earned with the rooster's own feathers. Only once the debt is fully paid does she act, and she states the principle explicitly: 'Doing right keeps right; doing wrong makes wrong, which, to make right, one must even pay as the sick pay those who cure them.' The story draws the general rule directly from this: 'the medicine masters of that people never give cure without pay; never, for there is no virtue in medicine of no value.' The medicine itself hasn't changed. What changes is whether it counts, in this belief system, as medicine at all. Diagnostic move: when you notice yourself or others discounting the value of a free remedy, service, or piece of advice regardless of its actual quality, or conversely over-trusting one simply because it was expensive, recognize this as the same pattern -- perceived worth is being read off the price rather than off the content, and the two can come apart completely."
