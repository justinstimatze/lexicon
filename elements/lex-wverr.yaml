id: lex-wverr
name: natural-goodness-of-living-things-is-grounded-in-species-life-form
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When evaluating whether a living thing — a plant, animal, human action, human character — is good or defective IN ITSELF (not 'useful to us,' not 'beautiful to look at,' not 'dangerous'), Foot's transferable claim is that such evaluations have a distinctive logical form whose ground is the SPECIES LIFE-FORM. The form: 'S's are F' (Aristotelian categoricals, from Michael Thompson) — 'rabbits are herbivores,' 'oak trees grow deep taproots,' 'wolves hunt cooperatively.' These propositions describe the natural-teleological organization of the species's life cycle (development, self-maintenance, reproduction, defense, rearing-of-young). An INDIVIDUAL instance is good-as-a-rabbit/oak/wolf to the extent that it matches what the life-form structures call for; defective to the extent it falls short. Crucially, the goodness is INTRINSIC — it does not depend on external desire or use. A pliable reed is good (because reeds are flexible); the same property would be defect in an oak (because oaks are rigid). Foot's controversial extension: MORAL goodness in humans is ALSO a form of natural goodness — moral defect is natural defect of the human life-form. The same logical structure (life-form-grounded teleological categoricals → instance evaluation) applies. The atom's transferable contribution is the STRUCTURAL CLAIM about the form-of-evaluation, not the controversial moral-realist conclusion. The form generalizes BEYOND biology to any system with a constitutive-function-set: an instance of S is good-as-S to the extent it matches the constitutive-function categoricals for S. This is what 'good knife,' 'good investigation,' 'good musician,' 'good dialogue' (lex-wutu8), 'good explanation' all share. Distinct from instrumental-goodness (good FOR a user/purpose external to the kind) and from beauty-evaluation. Practitioner test: when you assert 'X is a good Y,' check whether you're evaluating relative to (a) the Y life-form's constitutive function or (b) your external use of Y. Both are legitimate but logically distinct; conflating them produces argument-by-equivocation. Be careful with the inverse failure mode: not every category has clean constitutive-function categoricals. Where the life-form (or function-set) is contested, natural-goodness judgements bottom out in the same contest. Foot's claim is most secure for biological life-forms with clear teleological organization; weakest for novel-substrate categories (LLMs, hybrid systems) where the function-set is genuinely under construction. Distinct from lex-jbegr phronesis-practical-wisdom-in-particulars: lex-jbegr names PRACTICAL WISDOM in applying virtue-judgements to particular situations; lex-wverr names the GROUNDS for the virtue-judgement itself (its logical form). They compose — phronesis is the skill of applying natural-goodness assessments to messy real cases. Distinct from lex-7mr6w survival-test-mistaken-for-purpose: lex-7mr6w warns against collapsing teleology to bare-survival; lex-wverr articulates the positive teleological-categorical form Foot insists is not reducible to survival-fitness alone. They compose — Foot's life-form contains development, self-maintenance, reproduction, AND defense/rearing-of-young, none of which collapses to survival. Distinct from lex-ngc66 which-predicates-project-to-future-cases: lex-ngc66 is the general problem of projectible predicates; lex-wverr names the specific Aristotelian-categorical form in which life-form facts project to individuals."
