id: lex-zm3q6
name: remoteness-from-practice-enables-criticism-of-a-belief
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When asking why some beliefs get argued over and revised while others just get acted on without question, check how immediately each belief is wired to practice rather than how sophisticated or well-supported it is. Popper's account of what first makes rational criticism possible at all: 'These inventions, if formulated in some language, are from the start somewhat different from other biological actions; this may be seen from the fact that each of two schemata of biological actions which otherwise are indistinguishable may contain a myth (concerning, say, the origin of the world) which is contradictory to the other. For although some of our beliefs may be immediately relevant to practice, others are only remotely relevant to it, if at all. Their differences may make it possible for them to clash, and their comparative remoteness may make it possible for them to be argued about. In this way, rational criticism may develop, and standards of rationality -- some of the first inter-subjective standards -- and the idea of an objective truth.' Two action-patterns that are otherwise identical (they produce the same behavior, solve the same immediate problem) can still carry two flatly contradictory myths about, say, how the world began -- and precisely because that belief has no immediate practical job to do right now, it becomes possible to notice the contradiction, compare the two versions side by side, and argue about which one is right. A belief that has to be acted on immediately doesn't get this kind of exposure; there's no pause in which to hold it up against a rival. Diagnostic move: when you want to understand why a particular belief or practice has stayed resistant to scrutiny, check whether it's still tightly coupled to some action that has to happen regardless of whether the belief is examined -- and when you want to create room for genuine debate about something, look for ways to loosen that coupling first, rather than supplying better arguments into a belief that immediate practice never lets go idle long enough to be questioned."
