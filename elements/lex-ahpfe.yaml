id: lex-ahpfe
name: framing-the-young-as-fragile-shifts-the-burden-to-the-elder
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Rather than blame an impatient younger person for causing friction, argue that the young are inherently brittle and irreparable once broken — which puts the entire obligation to absorb the conflict onto the older, presumably sturdier party. In the Jataka's tale of the two hermits, the son doesn't scold the novice for provoking his father; instead he reframes the whole dynamic to place the burden on his father directly: 'Father, young boys are just like earthen vessels: they are broken in a moment, and when they are once broken, it is impossible to mend them again. Old men should bear with them patiently, when they are abusive.'"
related: []
evokes: [jataka, catukkanipata, kassapamandiya-jataka, fragility-framing-assigns-the-burden-of-patience-upward, blame-redirected-from-the-younger-partys-conduct]
lineage:
  - source: primary
    text: jataka-chalmers1895-kassapamandiya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 312, Kassapamandiya-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Father, young boys are just like earthen vessels: they are broken in a moment, [38] and when they are once broken, it is impossible to mend them again. Old men should bear with them patiently, when they are abusive.\""
canonical-instances:
  - "A senior mentor tells a veteran colleague to let a new hire's dismissive comments slide, reasoning that early-career confidence is fragile and easily crushed by pushback, while a seasoned professional's confidence can absorb the friction without lasting damage — putting the entire burden of restraint on the more experienced person."
critical-questions:
  - "Is the fragility claim actually true of the specific young person in question, or is it a generalization that excuses genuinely correctable bad behavior from ever being corrected?"
  - "Does placing all the burden on the elder party risk letting the younger party's conduct go unaddressed indefinitely, since no one is ever positioned to push back on it?"
status: active
