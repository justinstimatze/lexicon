id: lex-zvbd8
name: break-design-fixation-by-imagining-the-ideal-or-its-opposite
type-in: situation
type-out: process
_tier: molecule
agent-instruction: "When you're stuck optimizing a system within its existing identity, reach for one of three deliberately-invoked questions Altshuller uses to escape the psychological inertia a stuck problem builds up, rather than waiting for a lucky analogy to trigger the right idea. First, if you're fighting a harmful effect and don't know what mechanism could remove it, state the Ideal Final Result -- the effect vanishing by itself, with nothing added -- and treat every real solution as a minimal retreat from that ideal rather than something built up from a blank slate (lex-mubyx). Second, if you're studying an existing natural or biological system rather than designing something new, ask the same ideality question of it directly -- what would an ideal version of this system extract from its environment with nothing wasted -- and treat the gap between that ideal and what's currently documented as a specific, checkable hypothesis about an undiscovered capability (lex-a6hvx). Third, when the first two still leave you stuck inside the system's own identity, invert it outright: name the single property that most defines what kind of thing the system is, assert its literal opposite as a candidate system, and do the real engineering work of making that inversion coherent instead of dismissing it on sight (lex-qu6y5). The three aren't stages of one procedure -- they're separate triggers for the same underlying failure, a fixed idea of what the system must look like. A known harmful effect with no mechanism in sight is a job for the first question. Wanting to learn something new about a system that already exists is a job for the second. And when the obstacle turns out to be the system's own defining identity, that's what the third one is for."
related: [lex-hkn3v, lex-6w927, lex-4pb6j]
scaffolds-from: [lex-mubyx]
evokes: [ideal-final-result, anti-system, altshuller-fixation-breaking-questions, psychological-inertia, ideality-versus-inversion]
decomposes-into:
  - lex-mubyx
  - lex-a6hvx
  - lex-qu6y5
premises:
  - "a designer or researcher is stuck inside a fixed mental picture of what a system must look like, which suppresses candidate ideas that don't fit that picture (Altshuller's psychological inertia)"
  - "one escape states the Ideal Final Result for a known harmful effect: the effect disappearing on its own, with nothing added. Naming that impossible target filters the entire solution space down to whatever stays close to it (lex-mubyx)"
  - "the same ideality question can be pointed at an already-existing natural system instead of an engineering problem, and the gap it exposes -- between the ideal and what's currently documented -- becomes a checkable hypothesis about a capability nobody has found yet (lex-a6hvx)"
  - "a third, different-in-kind escape abandons the system's identity altogether: name its one defining property, assert the literal opposite as a candidate system, and take the resulting inversion seriously enough to work out what would make it function (lex-qu6y5)"
  - "therefore, presumptively, a designer stuck on a fixation-shaped problem can select whichever of the three questions matches their situation -- a harmful effect with no mechanism, an existing system worth re-examining, or an identity itself worth inverting -- and generate candidates that direct incremental thinking inside the fixed picture would not reach"
critical-questions:
  - "this molecule groups three atoms this corpus judged thematically tight and mutually cross-referenced, not a single composite tool Altshuller himself named as one thing -- IFR and the anti-system are two separate named TRIZ concepts in his own text. Does treating them as one molecule's three arms lose anything a reader needs, or does the shared function (escaping psychological inertia) genuinely justify the grouping regardless of whether Altshuller drew the boundary this way himself?"
  - "how does a practitioner choose correctly among the three when a situation could plausibly fit more than one -- e.g. a harmful effect in a natural system could reach for either lex-mubyx's engineering framing or lex-a6hvx's discovery framing? Is misapplying the wrong one of the three costly, or does the exercise still generate useful candidates either way?"
  - "all three worked examples that motivate this molecule (the heating wire, Golovchenko's wind-powered plants, the anti-ship and bubble chamber) turn out to have real, successful outcomes -- how often does deliberately invoking one of these three questions fail to produce anything coherent, and would a session of failed attempts look different from a session that simply hadn't been stuck yet?"
canonical-instances:
  - "A team redesigning airport security screening is stuck between two known-bad options: faster lines (more risk) or thorough checks (worse throughput). Stating the Ideal Final Result -- dangerous items disappear from bags on their own, with nothing added -- redirects the search toward pre-flight risk scoring that reduces what needs physical checking at all, rather than a faster or slower version of the same checkpoint (lex-mubyx's move)."
  - "A biologist studying bat echolocation asks what an ideal echolocating system would extract from its environment with zero wasted energy, and the gap between that ideal and documented bat calls points toward an unstudied frequency-modulation technique later confirmed in the field -- the same kind of question Golovchenko asked of plants, applied to a different natural system (lex-a6hvx's move)."
  - "A furniture company defined by lightweight, flat-packed shipping is stuck on cost; imagining the anti-system -- furniture defined by being heavy and never shipped at all -- leads seriously worked through to a legitimate local-manufacturing-on-demand model that eliminates shipping costs entirely rather than optimizing packaging further (lex-qu6y5's move, applied outside physical engineering)."
  - "operationally distinct from lex-mnxhs (contradiction-resolution-via-parameter-decomposition): that molecule resolves a NAMED contradiction between two conflicting parameters by separating them in time, space, or substance. This molecule doesn't presuppose a named contradiction exists yet -- it's a set of three questions for escaping a fixed mental picture of a system, which may or may not surface a contradiction to resolve afterward."
lineage:
  - source: practitioner
    text: ideality-and-inversion-editorial-grouping
    citation: "This corpus's own editorial grouping, not a composite Altshuller named as one thing himself: three atoms from Creativity as an Exact Science (1984) that Altshuller discusses in adjacent sections of the same book (Ch.3's IFR, Ch.4's anti-system and three-mental-screens material, Ch.8's IFR-for-discovery), already densely cross-linked in this corpus's own related fields before this molecule existed, and unified here by their shared function -- deliberately-invoked triggers for escaping psychological inertia -- rather than by Altshuller's own chapter boundaries."
    quote: "Each atom's own body already names this cluster: lex-a6hvx is operationally distinct from lex-mubyx by application domain (engineering vs. natural-system discovery) rather than by mechanism, and lex-qu6y5 is operationally distinct from lex-mubyx by whether the system's identity stays intact (IFR) or is abandoned outright (anti-system) -- three arms of one escape-fixation function, not three unrelated ideas."
