id: lex-xekjg
name: specialization-multiplies-output-via-dexterity-time-saving-and-instrumentation
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When a task could be done EITHER by one generalist OR by a coordinated team of specialists each working on a sub-operation, default to the specialist-team — division of labor multiplies aggregate output by approximately three named mechanisms: (i) DEXTERITY — sub-operations performed many times by one person reach skill-rates the generalist cannot approach; (ii) TIME SAVED IN TRANSITIONS — switching between operations (tools, mental setup, physical location) is costly, and 'a man commonly saunters a little in turning his hand from one sort of employment to another' (Smith); specialists skip this cost entirely; (iii) INSTRUMENTATION — focused attention on one operation produces specialized tools and machines: 'a great part of the machines made use of in those manufactures in which labour is most subdivided, were originally the inventions of common workmen.' Smith's pin-factory: 10 workmen divided into ~18 distinct operations produce ~48,000 pins/day; without division, the same 10 might produce 0-200 pins/day (~240-4800× multiplier). The transferable form generalizes far beyond manufacturing: software engineering specializations (compiler vs. distributed-systems vs. UX vs. SRE), medicine (cardiology vs. anesthesiology vs. surgery vs. radiology), academic research disciplines, agricultural specialties (carpenter-vs-smith), service-economy roles. Operational moves: (i) when a small generalist team is bottlenecking on a heterogeneous task, ask whether further specialization would multiply output; (ii) cost the three mechanisms — dexterity-gain potential, transition-cost-elimination, instrumentation-gain potential — for the specific task; (iii) check the bounding condition (Smith Bk.I Ch.3): division of labor is limited by the EXTENT OF THE MARKET — there must be enough demand for the specialized output to keep a specialist fully employed. The bounding condition is why village blacksmiths exist where specialized nail-makers cannot: small markets cannot sustain specialists."
related: [lex-wtkuz, lex-spm8x, lex-5yufs, lex-jct7k]
evokes: [adam-smith-1776, wealth-of-nations-book-i-chapter-i, division-of-labor, division-of-labour, specialization, pin-factory, dexterity-from-repetition, transition-cost-elimination, instrumented-attention, machines-invented-by-workmen, extent-of-the-market-bounds-specialization, coordination-cost-as-counterweight, comparative-advantage-foundation, modern-supply-chain-decomposition]
lineage:
