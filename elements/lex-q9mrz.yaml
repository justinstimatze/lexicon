id: lex-q9mrz
name: an-induced-physical-response-makes-an-invisible-property-visible
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a factual question can''t be settled by inspection because both options look identical, find a physical condition (gravity, heat, a reagent) that produces a different, observable response depending on the true answer, and induce that condition rather than guessing from appearance. In the Maha-Ummagga-Jataka, a smoothed acacia stick is sent to test which end is the top and which the root — indistinguishable by eye once trimmed. Mahosadha already knows by feel, but stages a public test anyway: "Bring it here, my friends, I will find out." He ties a string to the middle and lowers the stick to the surface of a pot of water. "The root being heavier sank first." He then asks the crowd, "Is the root of a tree heavier, or the top?" "The root, wise sir!" "See then, this part sinks first, and this is therefore the root."'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, empirical-test, induced-response, indistinguishable-by-inspection]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"Bring it here, my friends, I will find out." Holding it in his hand, he knew which was the top and which the root; yet to please the heart of the people, he sent for a pot of water, and tied a string round the middle of the stick, and holding it by the end of the string he let it down to the surface of the water. The root being heavier sank first. Then he asked the people, "Is the root of a tree heavier, or the top?" "The root, wise sir!" "See then, this part sinks first, and this is therefore the root."'
canonical-instances:
  - "Two identical-looking metal bars are claimed to be gold and gold-plated lead; rather than argue from appearance, a jeweler weighs each against its displaced volume in water, since density — invisible to the eye — differs even when color and shine don't."
  - "Handed two visually identical seed packets with lost labels, a gardener plants a few of each in the same soil and waits for germination timing to differ, using growth behavior as the discriminating test appearance couldn't provide."
critical-questions:
  - "This works because Mahosadha could predict in advance which physical property (density) would reliably track the true answer — how do you find the right discriminating test when you don't already know which physical law applies?"
  - "The public demonstration here confirms something the sage already knew privately; does staging a test you don't need still count as genuine empirical reasoning, or does it risk training an audience to trust theater over the underlying method?"
status: active
