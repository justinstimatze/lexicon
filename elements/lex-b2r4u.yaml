id: lex-b2r4u
name: racial-capitalism-systemic-differentiation-as-capitalisms-tendency-not-homogenization
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When analyzing a system that economic theory treats as tending-toward-homogenization (markets equalize labor; competition flattens wages; commerce dissolves local particularisms), do not infer from theory the empirical tendency. Look for whether the system in fact PRODUCES differentiation: are some populations recruited into the labor pool only as cheaper, more disposable, or more exploitable than others, and is this differentiation reproduced rather than dissolved across centuries? Robinson's claim, which generalizes: European capitalism never homogenized the laboring population; it instead exaggerated regional, subcultural, linguistic, and dialectical differences into 'racial' ones, because differentiated labor pools (Slav slaves in the early Middle Ages, Tartar slaves in the late Middle Ages, African slaves in the Atlantic period, immigrant proletariats throughout) ARE more productive for capital accumulation than a homogeneous one. Racism and nationalism are not pre-capitalist residues that capitalism will eventually erode; they are features the capitalist mode of production folds into its accumulation logic from the start. The transferable operational move: when a system's defenders argue 'the system tends toward X (homogenization, equalization, meritocratic flattening)' and a critic objects 'but it produces not-X (stratification, inequality, racial sorting),' do NOT treat the critic's evidence as friction-against-the-tendency. Treat the produced not-X as evidence the tendency itself was misnamed — the system tends toward what it actually produces. The classical Marxist failure (treating racism as a 'distortion' to be explained-away by the more fundamental class-struggle dynamic) is the canonical case of misreading produced-differentiation as friction-against-homogenization. The same misreading applies to any system whose 'tendency' is asserted theoretically while its observed output is structured stratification. Diagnostic question: if the system has been running for N centuries and has consistently produced the same not-X outputs, what's the burden of proof for continuing to call the tendency X?"
