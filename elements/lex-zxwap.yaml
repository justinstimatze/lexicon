id: lex-zxwap
name: an-enacted-metaphor-substitutes-for-a-direct-confrontation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Rather than stating a warning, a demand, or a refusal outright, an actor can stage a physical tableau that the target is left to interpret — sitting in scant shade when ample shade is offered, for instance — and let the target do the work of decoding what''s actually being communicated. The indirection lets the message land without ever becoming a confrontation the target could push back against or a promise the actor could later be held to breaking. In the Bhadda-sala-Jataka, the Buddha, trying to deter Vidudabha from destroying his Sakyan kin without directly confronting the king''s army, sits under a bare, thin tree on the boundary of Vidudabha''s realm instead of the huge shady banyan nearby, and when asked why, answers only that ''the shade of my kindred keeps me cool'' — leaving Vidudabha to work out for himself that the Buddha has come to protect his clan.'
related: []
evokes: [jataka, dvadasanipata, bhadda-sala-jataka, staged-tableau-as-indirect-signal, deterrence-without-direct-confrontation]
lineage:
  - source: primary
    text: jataka-chalmers1895-bhadda-sala-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 465, Bhadda-sala-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Why, Sir, are sitting under so thin a tree in all this heat? Sit beneath this shady banyan, Sir." He replied, "Let be, O king! the shade of my kindred keeps me cool.'
canonical-instances:
  - 'A department head who doesn''t want to directly veto a risky project quietly reschedules his own calendar to be visibly unavailable every time the project team needs sign-off, letting the team infer his position from his conspicuous absence rather than stating an objection he''d have to defend.'
critical-questions:
  - 'The Buddha''s deterrence worked three times but not a fourth, once the underlying cause was judged irreversible — does an enacted metaphor actually change the target''s decision, or does it only delay an outcome that direct confrontation might have changed just as much or as little?'
status: active
