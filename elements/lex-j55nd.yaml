id: lex-j55nd
name: withholding-structure-trains-tolerance-for-open-ended-scope
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When a training environment deliberately refuses to bound the scope of what a learner is responsible for knowing, don't read the resulting discomfort as a design flaw to be fixed with more structure. Fox documents this as Cornell's explicit, named policy: 'You will from the start be given the major responsibility for learning... Not so with your medical college courses.... We do not use the comfortable method of spoon-feeding.... Limits are not fixed. Each field will be opened up somewhat sketchily.... You will begin to paint a picture on a vast canvas but only the center of the picture will be worked in any detail. The periphery will gradually blur into the hazy background. And the more you work out the peripheral pattern, the more you will realize the vastness of that which stretches an unknown distance beyond.' Two specific structural choices do the work here, not vague open-endedness: withholding a hard boundary on scope, and (separately) withholding routine grade feedback, so the learner has no external signal confirming they are doing well. Both remove exactly the two things a bounded curriculum normally provides — a known edge and a running scorecard — and their absence is what produces the first kind of uncertainty a student meets, before any of the field's genuine unknowns come into play. The payoff Fox identifies is transfer: this manufactured uncertainty is a rehearsal for a real, permanent condition of the professional role — no one will ever hand a working physician a bounded curriculum of what a given patient's illness requires knowing. Diagnostic move: when a training program deliberately declines to bound scope or withholds routine feedback, check whether the stated aim is to rehearse a permanent feature of the target role (unbounded scope, no external scorecard) — if so, the discomfort is functioning as intended and adding structure back in would remove the transferable skill, not just the discomfort."
related: [lex-wrxz5]
scaffolds-from: [lex-wrxz5]
evokes: [fox-1957, no-spoon-feeding, vast-canvas-only-the-center-worked-in-detail, absence-of-grades, rehearsal-for-permanent-ambiguity]
lineage:
  - source: primary
    text: fox-1957-spoon-feeding-vast-canvas
    citation: "Renée C. Fox, \"Training for Uncertainty,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.209. Quoted from the medical school's own 'Address of Welcome to the Class of 1957' and 'Some Steps in the Maturation of the Medical Student,' both quoted by Fox in her footnote 3 as the source of this passage."
    quote: "'You will from the start be given the major responsibility for learning... Not so with your medical college courses.... We do not use the comfortable method of spoon-feeding.... Limits are not fixed. Each field will be opened up somewhat sketchily.... You will begin to paint a picture on a vast canvas but only the center of the picture will be worked in any detail. The periphery will gradually blur into the hazy background. And the more you work out the peripheral pattern, the more you will realize the vastness of that which stretches an unknown distance beyond....'"
  - source: primary
    text: fox-1957-uncertainty-lacking-grades
    citation: "Renée C. Fox, \"Training for Uncertainty\" (1957), p.209-210."
    quote: "'This uncertainty, great as it is, is further accentuated for the beginner by the fact that he does not receive grades, and therefore does not have the usual concrete evidence by which to discover whether he is in fact doing well.'"
canonical-instances:
  - "A new consultant is handed a vague, open-ended client problem with no scope document and no interim feedback from the partner, while a junior at a firm with tightly-scoped, graded case studies gets none of this discomfort — the first firm may be deliberately training the tolerance for unbounded scope that partner-level client work actually requires, at the cost of more early discomfort."
  - "A research advisor refuses to tell a new PhD student exactly what would count as a finished dissertation, and gives no interim grades, only occasional informal reactions — this can read as neglect, but it may be rehearsing the exact condition of a research career, where no one hands out a bounded scope or a running scorecard either."
critical-questions:
  - "Does the transfer actually happen — do students trained this way show measurably better tolerance for the field's genuine, later uncertainties than students trained with more bounded curricula and more frequent feedback — or is the claimed rehearsal effect an assumption the school makes about its own pedagogy rather than a tested one?"
  - "Is there a point past which withholding structure stops training tolerance and starts training something else (learned helplessness, indifference to feedback, an inability to self-assess accurately) — and how would a training designer using this deliberately tell the difference before it happens, rather than after?"
status: active
