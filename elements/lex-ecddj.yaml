id: lex-ecddj
name: a-repeated-status-claim-broadcasts-your-exact-location-to-a-threat
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When you're in a position where a predator, rival, or authority is actively hunting for a target, don't repeat a loud self-assertive claim from the same spot -- each repetition doesn't just fail to protect you, it hands the threat an increasingly precise fix on exactly where you are, and a previous target's disappearance doesn't mean the position is now safely yours. In Eastman's telling, three bullfrogs all separately boom out, 'Kerrump! kerrump! I'm chief of this pond!' -- and a hunting Crane targets each one who speaks, in turn. The first Frog escapes only because a water snake happens to bite the Crane's leg; the second escapes only because a mink happens to be stalking the Crane at that exact moment; the third escapes only because a Fox happens to attack the Crane just as it has him by the leg. None is saved by wisdom or a countermove -- each survives by an external accident unrelated to anything he did. The story adds a sharper detail on the second Frog specifically: after the first Frog goes silent, the second Frog boasts again, alone, 'sitting up in plain sight, swelling his chest with pride, for he really thought now that he was the sole chief of the pond' -- he reads the first Frog's disappearance as a vacancy he's entitled to claim, rather than as evidence the exact same danger is still live in the exact same spot, and is immediately targeted for it. What survivors actually learn, and what the story states as its explicit moral, isn't 'someone else got eliminated so the position is safely mine' -- each traumatized survivor instead goes permanently silent, having correctly identified the boast itself as the danger. Diagnostic move: when a threat is actively searching a shared space for a target, treat any loud, repeated, location-revealing self-assertion as carrying the same danger every time it's made -- and specifically resist reading a predecessor's removal as an opening now safely yours to claim, since that exact misreading is what gets the next claimant targeted."
