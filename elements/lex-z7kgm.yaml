id: lex-z7kgm
name: prestige-cues-cause-cross-domain-copying-from-high-status-models
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Prestige is an evolved attention-cue that directs cultural learning. When a community converges its attention on a person — visual attention, deference, citation, emulation — naive learners use that convergence as a heuristic for who-to-copy. The mechanism is bandit-optimal under causal opacity: when an individual cannot tell which of a successful person's habits, beliefs, or routines is causally responsible for their success, copying broadly from them is a better bet than copying nothing or copying randomly. The transferable consequence: high-prestige models attract broad copying that SPILLS OVER their domain of competence. A basketball star endorses insurance and is taken seriously about it; a Nobel-winning physicist is consulted on policy outside physics; a respected senior engineer's coding style propagates well past the architectural decisions that earned the respect. The transferable practitioner-discipline is THREE-PART. FIRST: when you are about to copy from a prestigious source, ask 'is this person prestigious BECAUSE of the specific thing I am about to copy, or is this person prestigious for ADJACENT reasons and I am inferring the copy is safe via spillover?' The answer determines whether the copy is bandit-optimal or noise. SECOND: when you find yourself prestigious in some domain, recognize that audiences will copy broadly — including your habits, vocabulary, aesthetic, political opinions — not just your domain expertise. The discipline is to label which pronouncements are domain-competent and which are personal (the LeBron-James-endorsing-insurance discipline: do not let the audience confuse spillover-prestige for domain-expertise). THIRD: when you observe that 'everyone is talking about X' or 'everyone follows Y', recognize that the attention-cascade itself manufactures additional prestige — the Paris-Hilton-effect (famous for being famous), the chart-topping song that wins on initial-exposure-cues independent of quality (Salganik-Dodds-Watts 2006, lex-hbanm). The diagnostic question: is the prestige tracking a domain-relevant competence I should be copying, or is it the runaway-attention-feedback-loop the media architecture creates? The atom does NOT advise against prestige-following — under causal opacity it is often the right move. The discipline is to NAME the cross-domain spillover so it can be priced honestly into the copying decision. Composes with lex-u6sw3 (high-fidelity copying is the WHAT; prestige-bias is the WHO of cultural learning) and lex-hbgcb (social-proof-as-action-signal; lex-hbgcb names the heuristic at the behavioral level, lex-z7kgm names the evolutionary mechanism that grounds it). The diagnostic test in the wild: if a high-prestige actor's opinion on X is being faithfully transmitted in a community, ask whether their prestige is from EXPERTISE-IN-X or from adjacent-domain success that has spilled over via cultural-learning attention-cues."
