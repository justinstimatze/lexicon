name: Pages

# MANUAL ONLY. This workflow publishes every atom in elements/ — id,
# name, tier, status, cluster, canonical-instances and evokes, plus all edges —
# to a URL any stranger can read, and it does so regardless of whether the repo
# itself is public. It ran on every push to substrate/** (the directory's
# pre-2026-08-20 name) from 2026-07-22 until 2026-08-04, which published a
# private repo's contents for two weeks.
#
# The push trigger is deliberately removed. Re-add it only when the repo is
# actually public. Note that `configure-pages` below carries `enablement: true`,
# so a run of this workflow will re-enable Pages even if Pages was disabled at
# the repository level — running it IS the decision to publish.
on:
  workflow_dispatch:

# GitHub Pages: one running deploy at a time. Rapid-fire pushes cancel the
# in-flight build so only the latest elements state ships.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: render/go.mod
      - name: bake static elements graph
        run: bash scripts/build-web.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
