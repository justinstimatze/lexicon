canonical-instances:
  - "New employees assume a notoriously silent, unreadable executive who never raises their voice in meetings must be calm and trustworthy. Longtime staff know that same stillness usually precedes the executive quietly building a case to eliminate someone's role."
critical-questions:
  - "Is stillness actually doing any signaling work here, or is the fish's mistake simpler than that — are they just failing to notice the crane at all, and retroactively rationalizing its presence as pious once questioned, rather than actively interpreting a signal?"
  - "How does the wise fish know the crane's stillness specifically means predation rather than genuine rest or unrelated behavior — is this a case of a track record informing the correct read, the way the corpus has already seen with other insider-versus-crowd distinctions?"
