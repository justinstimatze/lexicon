id: lex-4x7vs
name: applying-an-accusers-own-evidentiary-standard-can-implicate-the-accuser
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A rule designed to catch and punish wrongdoing in a subordinate can be turned back on the person who authored and enforces it, if the same evidentiary method used against others is applied without exception, including to the enforcer. The Fon trickster Legba demonstrates the move against his mother, the creator-goddess Mawu, after she arranges that 'the master be known as good and the servants be known as evil' regardless of who actually does what. Legba first tricks people into planning to steal Mawu's yams, prompting her to announce a death penalty for the theft, then steals the yams himself while wearing her own sandals, seeding footprints that point back at her. 'When the theft was discovered, Mawu assembled the people and searched to find a foot that matched the footprints in her garden. When none could be found, Legba asked if Mawu herself might have come in the night and forgotten about it. \"Who, me? That is why I do not like you, Legba. I will measure my foot with that footprint.\" When Mawu put her foot down, it fit the print exactly. The people began to laugh and shout, \"The owner herself is a thief!\" Mawu was humiliated.' The evidentiary standard (whoever's foot fits the print is the thief) was never itself unfair; what breaks the arrangement is Legba forcing its application onto the one person it was never meant to reach. The asymmetry between master and servant survived every ordinary use of the rule and collapsed the instant the rule was applied without the usual exemption. Diagnostic move: when a standard, an audit, a rule of evidence, a performance metric, is enforced asymmetrically (rigorously against subordinates, never actually tested against the person enforcing it), consider what would happen if the identical standard were applied to the enforcer with no special exemption -- the gap between the rule's stated neutrality and its actual selective application is often only visible once someone forces that comparison to happen."
related: [lex-25aey]
evokes: [hyde-trickster-makes-this-world-matter-out-of-place, legba-and-mawus-footprint, the-owner-herself-is-a-thief, applying-the-rule-to-the-rule-maker]
lineage:
  - source: primary
    text: hyde-legba-tricks-mawu-into-fitting-her-own-footprint-in-the-stolen-yams
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Heaven's Privy,\"' recounting the Fon myth of Legba and Mawu. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "When the theft was discovered, Mawu assembled the people and searched to find a foot that matched the footprints in her garden. When none could be found, Legba asked if Mawu herself might have come in the night and forgotten about it. “Who, me? That is why I do not like you, Legba. I will measure my foot with that footprint.” When Mawu put her foot down, it fit the print exactly. The people began to laugh and shout. “The owner herself is a thief!” Mawu was humiliated."
canonical-instances:
  - "An employee repeatedly disciplined under a strict attendance policy quietly starts logging the manager's own arrival and departure times, and when the manager is next late without consequence, presents the identical log format used against everyone else, forcing the same standard onto the person who wrote it."
  - "A journalist investigating a politician's anti-corruption crusade discovers that applying the exact financial-disclosure standard the politician demands of opponents to the politician's own holdings turns up the same kind of undisclosed conflict, and publishing the comparison does more damage than any accusation of hypocrisy alone would have."
critical-questions:
  - "Is this move actually about exposing genuine hypocrisy, or could it just as easily be used to discredit a fair rule by finding one technical violation by its author, even when the rule itself remains sound and worth keeping despite the enforcer's lapse?"
  - "Does Legba's trick actually change the underlying power arrangement, given that the myth continues with Mawu still receiving reports and giving instructions afterward -- does exposing the asymmetry accomplish anything beyond a temporary, symbolic humiliation?"
  - "How reliably can this move be engineered deliberately (as Legba does, by planting the very evidence that will later implicate the accuser) versus arising naturally from an enforcer's own carelessness, and does the deliberate version cross into a different, more ethically fraught territory than simply pointing out an already-existing double standard?"
