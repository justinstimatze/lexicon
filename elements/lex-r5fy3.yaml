id: lex-r5fy3
name: enthymeme-the-persuasive-syllogism-with-suppressed-premise
common-name: "The argument with the decisive missing step"
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When constructing OR auditing a persuasive argument (speech, ad, headline, model output, courtroom claim, scientific summary to lay audience), identify which premise is LEFT UNSTATED for the audience to supply. The enthymeme is a syllogism with one premise suppressed because the audience already accepts it; supplying the missing premise out loud would either condescend OR expose a premise the audience does NOT actually share. Most real-world persuasion runs on enthymemes, not full syllogisms — making the missing-premise audit the central forensic move. Practitioner-discipline: extract the full syllogistic structure of the claim, label which premise is the SUPPRESSED one, then test whether the suppressed premise is (1) genuinely shared between speaker and audience (legitimate enthymeme, persuasive economy), (2) shared-but-contestable in principle (the enthymeme works by foreclosing reflection — vulnerable to surfacing-the-premise), or (3) NOT actually shared but presumed (the enthymeme is hostile-manipulative — the speaker is smuggling a premise past the audience's vigilance). Transferable to advertising decoded ('you deserve this car' → suppressed: deserving justifies acquiring), political slogans ('Make America Great Again' → suppressed: America is not currently great), engineering arguments to non-specialists, LLM explanations stripped of intermediate reasoning, and any rhetorical move whose punch depends on the audience filling in a premise the speaker chose not to defend. Operationally distinct from lex-4ww6k modus-ponens, which is the fully-displayed inference; the enthymeme is the move of LEAVING ONE PREMISE BLANK because the rhetorical situation does the work the speaker need not."
related: [lex-chp44, lex-r3w25, lex-bra5e, lex-wjwuc, lex-b9sqg, lex-p48xw, lex-4ww6k, lex-kh9cr, lex-38ygs, lex-9uac6, lex-y48fs, lex-bkaum, lex-hsnup, lex-c5j2s, lex-j5vdt]
scaffolds-from: [lex-bkaum, lex-4ww6k]
evokes: [the-missing-premise-is-the-whole-argument, fill-in-the-blank-persuasion, the-syllogism-that-trusts-the-audience-to-finish-it, the-blank-the-audience-doesnt-notice-it-filled, every-slogan-is-half-a-syllogism]
lineage:
  - source: primary
    text: aristotle-rhetorica-c350-bce-rhys-roberts-translation
    citation: "Aristotle, Rhetorica (Greek, composed c. 350 BCE within the Lyceum corpus; standard English-language scholarly reference: W. Rhys Roberts, 'Rhetorica,' in 'The Works of Aristotle Translated into English, Vol. XI,' ed. W. D. Ross, Oxford: Clarendon Press 1924,). Book I Ch.2 (1356a-1356b) is the locus classicus. Aristotle distinguishes two forms of rhetorical proof — the example (paradeigma, induction in rhetoric) and the enthymeme (rhetorical syllogism) — and identifies the enthymeme as 'the substance of rhetorical persuasion' (Rhet I.2.8, sometimes rendered 'the body of proof'). Crucially, Aristotle treats the enthymeme as a syllogism whose distinguishing feature is that one or more premises are LEFT UNSTATED because they are shared common knowledge between speaker and audience; in the parallel passage at Rhet I.2.13 (1357a16-21) he notes that the enthymeme 'must consist of few propositions, fewer often than those which make up the normal syllogism. For if any of these propositions is a familiar fact, there is no need even to mention it; the hearer adds it himself.' The transferable claim is that THE WORK OF PERSUASION IS DONE BY THE PREMISE THE AUDIENCE SUPPLIES — which makes auditing the missing premise the central forensic move on any rhetorical artifact."
    quote: "[Aristotle, Rhetorica I.2, Rhys Roberts 1924 trans., 1356b-1357a:] 'With regard to the persuasion achieved by proof or apparent proof: just as in dialectic there is induction on the one hand and syllogism or apparent syllogism on the other, so it is in rhetoric. The example is an induction, the enthymeme is a syllogism, and the apparent enthymeme is an apparent syllogism. I call the enthymeme a rhetorical syllogism, and the example a rhetorical induction. Every one who effects persuasion through proof does in fact use either enthymemes or examples: there is no other way. And since every one who proves anything at all is bound to use either syllogisms or inductions (and this is clear to us from the Analytics), it must follow that enthymemes are syllogisms and examples are inductions.' [Rhet I.2.13, 1357a, on the structural distinguishing feature of the enthymeme:] 'The enthymeme must consist of few propositions, fewer often than those which make up the normal syllogism. For if any of these propositions is a familiar fact, there is no need even to mention it; the hearer adds it himself. Thus, to show that Dorieus has been victor in a contest for which the prize is a crown, it is enough to say For he has been victor in the Olympic games, without adding And in the Olympic games the prize is a crown, a fact which everybody knows.'"
canonical-instances:
  - "Aristotle's own paradigm instance (Rhet I.2.13, 1357a, Rhys Roberts trans.): 'Dorieus has been victor in a contest for which the prize is a crown.' Speaker says only 'Dorieus won at the Olympic games.' The audience supplies 'and the Olympic games are crown-contests' on its own. The enthymeme works precisely BECAUSE the speaker did not say it; mentioning the crown-prize premise would mark the audience as needing instruction. The persuasive economy is the indispensable feature"
  - "the political slogan as enthymeme: 'Make America Great Again' (Trump 2016, also Reagan 1980) is structurally a syllogism with two suppressed premises: (i) America was great in a definable past period; (ii) America is NOT currently great. The slogan does not argue either premise; it asks the audience to supply them. The persuasive power is entirely in the suppressed premises — and the enthymeme is hostile-manipulative IFF either premise would fail under surfacing. Forensic discipline: name the suppressed premises, then ask the audience to defend them. Transferable across slogans of all parties; 'Hope and Change' (Obama 2008) has parallel structure with different suppressed premises"
  - "the advertising syllogism: 'You deserve this car' (luxury auto copy, generic across decades) has the suppressed major premise 'deserving X justifies acquiring X' and the suppressed minor premise 'you are deserving in the way the ad implies.' The whole ad is a one-line enthymeme; the rest of the visual frame supplies emotional reinforcement (cf lex-bkaum pathos). Audit-mode: extract the suppressed premise, then ask whether deservingness is in fact a valid ground for spending decisions, and whether 'you' is a coherent audience-referent. Transferable to nearly all luxury and aspirational marketing"
  - "the courtroom enthymeme: 'My client was at the hospital at 9pm; the crime occurred at 9:15pm 20 miles away.' The suppressed premise is the impossibility-of-transit; the jury supplies it from common knowledge of distances and traffic. Surfacing it would insult the jury's competence; leaving it suppressed produces the persuasive moment. Forensic-discipline: opposing counsel's job is to surface and challenge suppressed premises — 'but the highway between hospital and crime scene was empty at that hour and a helicopter was available'"
  - "the scientific-claim-to-lay-audience enthymeme: 'This drug reduced mortality by 30% in the trial.' Suppressed premises include (i) the trial's reduction generalizes to your population, (ii) the absolute baseline mortality is high enough to make the relative reduction meaningful, (iii) the trial had no methodological problems that would flip the sign. The lay audience supplies the trust-anchor premise ('this is a real result'); the surfaced version (relative-risk + baseline-rate + replication-status) is the corrective. Transferable to any technical claim cleared for public consumption — the audit-discipline is to surface what the bridging-to-lay-audience leaves blank"
  - "the LLM-output enthymeme: a model answer that says 'X because Y' often leaves the bridging premise X←Y implicit because the model has been RLHF-tuned to produce concise answers. The user supplies the bridging premise from prior trust in the model. Forensic-discipline: ask the model to surface every premise. This is the transferable shape behind 'chain-of-thought makes models more reliable' — explicit display of premises that would otherwise be suppressed enthymematic moves. The model's competence at suppression IS the failure mode reasoning-models partially address"
  - "operationally distinct from lex-4ww6k modus-ponens (the fully-displayed conditional + antecedent → consequent): the enthymeme is precisely the move of LEAVING ONE OF THE THREE BLANK because the rhetorical situation does the work the speaker need not. Modus ponens is the canonical FORMAL move; the enthymeme is the canonical RHETORICAL move. The same syllogism instantiated formally is modus ponens; instantiated for persuasion with a premise suppressed is enthymematic"
  - "operationally distinct from lex-kh9cr argument-from-analogy and lex-38ygs argument-from-popular-opinion and lex-9uac6 argument-from-verbal-classification (the defeasible argument-scheme family): those atoms classify the LOGICAL FORM of an argument's inference-pattern (similarity, popularity, definitional category-membership). lex-r5fy3 is orthogonal — it classifies WHICH PREMISE IS LEFT BLANK regardless of inference-form. An argument from analogy with all premises stated is not an enthymeme; the same argument from analogy with the major suppressed IS. Practitioner-discipline: apply both lenses — what's the inference-pattern (defeasible-scheme atoms) AND what's left blank (lex-r5fy3)"
  - "operationally distinct from lex-chp44 meta-pointer: lex-chp44 is the LINGUISTIC ANNOTATION of what is omitted; lex-r5fy3 is the RHETORICAL STRUCTURE of leaving a premise blank for the audience to supply. Lex-0011 is the surface-discipline of marking model-incompleteness in scholarly writing; lex-r5fy3 is the substantive practice of using suppression as the persuasive engine. They co-fire when a writer explicitly marks the move ('I leave the obvious major premise to the reader') — the marker is lex-chp44, the structural shape it points at is lex-r5fy3"
critical-questions:
  - "what's the SUPPRESSED premise? Extract the syllogistic structure of the claim; identify the major, minor, and conclusion; find the slot the speaker did not occupy. Practitioner-discipline: if you cannot find a suppressed premise, the artifact may not be persuasive at all (mere assertion), or the suppression may be subtler (a chained suppression — a premise whose ground-itself is suppressed). The first move is always 'name the blank'"
  - "is the suppressed premise (1) genuinely shared with the audience, (2) shared-but-contestable, or (3) not actually shared? Type (1) is legitimate persuasive economy. Type (2) is enthymeme as foreclosure — vulnerable to the surfacing-the-premise corrective. Type (3) is hostile-manipulative enthymeme — the speaker is smuggling a premise past the audience's vigilance. Practitioner-test: 'if I surface this premise to the audience, do they accept it explicitly, hesitate, or reject?' The hesitation is the diagnostic"
  - "what is the audience supplying that the speaker does not have to defend? The transferable insight is that THE WORK OF PERSUASION IS DONE BY THE AUDIENCE — which means the audience-as-co-author is the unit of analysis. A speaker who can rely on the audience to supply premise P never has to defend P; the audit-discipline is to identify all such P's and ask whether they would survive scrutiny. This is the inverse of the steelman discipline (lex-wjwuc collision-with-error-as-load-bearing-for-living-truth, Mill's anchor for engaging the strongest version of an opponent's claim) — instead of strengthening the opponent's argument, you are surfacing the premises the opponent left blank"
  - "is the enthymeme operating at the speech level OR the visual/contextual level? Aristotle's framing is verbal but the transferable shape is content-mode-agnostic. An advertising visual (luxury-watch-on-wrist-of-confident-person) carries enthymematic premises (you-are-this-person, you-can-be-this-person, you-want-to-be-this-person) without uttering them. Forensic-discipline: extend the missing-premise audit to non-verbal channels — image, sound, layout, omission. The premise can be suppressed in a medium that is not the verbal one"
  - "what is the relationship between this enthymeme and the pisteis-triad (lex-bkaum)? Aristotle treats the enthymeme as primarily a LOGOS instrument (it is the 'rhetorical syllogism' under the proof-by-words mode), but in practice enthymemes can carry ethos-suppressions ('trust me, I would not say this if it were not true' — suppressed: my track-record warrants this) and pathos-suppressions ('you wouldn't want to be the kind of person who rejects this' — suppressed: rejection signals an aversive identity). Practitioner-discipline: enthymemes are not exclusively logos-instruments; the missing-premise audit applies to ethos- and pathos-channels equally"
status: active
