id: lex-g3kjx
name: state-the-minimum-fix-before-the-maximum-reframe
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a stuck situation could be solved either by patching the existing system or by replacing it with something fundamentally different, always articulate the minimum-change version first, even if you expect to eventually pursue the more radical one. Altshuller names these as two distinct translations of the same situation: 'The minimum task can be obtained from the situation according to the formula: the present situation without the drawbacks, or what there is, plus the required quality (a new property)... The maximum problem, on the contrary, is obtained by the removal of constraints: one is permitted to substitute the resultant system by a principally different one.' His example: 'When we are given the problem of improving the sailing gear of a ship — this is a minimum problem. If, however, the problem is a phrased as: instead of a sail find a principally different means of transport having the following characteristics... that is a maximum problem.' Crucially, Altshuller shows the two framings don't predict the DIFFICULTY of whatever solution you end up with: 'It does not do to think that the transfer to a minimum problem necessarily leads to solutions of problems of lower levels. The minimum problem can be solved also on a fourth level. On the other hand, the transfer to a maximum problem does not of itself denote obtaining solutions of problems on the fifth level.' A minimum-framed problem can still demand a deep, structural fix; a maximum-framed problem can still be answered by a small, cheap change. His practical recommendation follows from cost and certainty rather than ambition: 'it is evident that under all circumstances it is expedient to start with the minimal problem. Its solution brings positive results, but at the same time does not demand any essential changes to the system itself, and so guarantees ease of implementation and economic effectiveness. The solution and implementation of a maximal system can take a lifetime and sometimes turns out to be entirely beyond solution given the present state of scientific knowledge. Therefore, even giving preference to a maximal problem, it is sensible at first to regard the problem as a minimal one.' Diagnostic move: before committing resources to either a preserve-and-patch or a replace-entirely approach, write out both framings of the problem explicitly — what would 'fix this without touching anything else' look like, and what would 'ignore the existing system and design from scratch' look like — and default to attempting the minimum framing first regardless of which framing you ultimately believe is right, because it's cheaper to test and its failure narrows the maximum framing's search space too."
related: [lex-hkn3v, lex-mubyx, lex-tghq5]
evokes: [minimum-problem-vs-maximum-problem, sailing-gear-example, patch-vs-replace, altshuller-translation-of-a-situation-into-a-problem]
lineage:
  - source: primary
    text: altshuller-1984-minimum-and-maximum-problems
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.3 'Tactics of Invention: Managing the Process of Task Solving,' section 'Situation — Problem — Problem Model.'"
    quote: "'The minimum task can be obtained from the situation according to the formula: the present situation without the drawbacks, or what there is, plus the required quality (a new property). In this way the minimal problem is obtained by applying the maximum possible limitations on alterations to the final technical system. The maximum problem, on the contrary, is obtained by the removal of constraints: one is permitted to substitute the resultant system by a principally different one. When we are given the problem of improving the sailing gear of a ship — this is a minimum problem. If, however, the problem is a phrased as: instead of a sail find a principally different means of transport having the following characteristics... that is a maximum problem.'"
  - source: primary
    text: altshuller-1984-level-independent-of-framing
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.3, 'Situation — Problem — Problem Model.'"
    quote: "'It does not do to think that the transfer to a minimum problem necessarily leads to solutions of problems of lower levels. The minimum problem can be solved also on a fourth level. On the other hand, the transfer to a maximum problem does not of itself denote obtaining solutions of problems on the fifth level... In any event, it is evident that under all circumstances it is expedient to start with the minimal problem. Its solution brings positive results, but at the same time does not demand any essential changes to the system itself, and so guarantees ease of implementation and economic effectiveness. The solution and implementation of a maximal system can take a lifetime and sometimes turns out to be entirely beyond solution given the present state of scientific knowledge. Therefore, even giving preference to a maximal problem, it is sensible at first to regard the problem as a minimal one.'"
canonical-instances:
  - "A team debating whether a slow checkout flow needs a UI patch (minimum: keep the existing payment architecture, fix the slow step) or a full rebuild on a new payments platform (maximum: replace the system entirely) writes out both problem statements before choosing — and discovers the minimum framing's fix (caching a slow validation call) resolves 90% of the complaint, which a rebuild would also have fixed but at far higher cost and risk."
  - "A city debating a chronically congested intersection frames both a minimum problem (retime the traffic lights, keep the intersection's layout) and a maximum problem (redesign the intersection or build a bypass) — the minimum framing turns out to require a level-4 solution (a novel sensor-based adaptive signal system), while a naively 'radical' maximum framing (just add a lane) would have been a cheap level-1 fix; framing type didn't predict solution depth."
  - "operationally distinct from lex-tghq5 problem-difficulty-is-typed-by-how-much-of-the-system-must-change: that atom classifies how hard a GIVEN candidate solution is by how much of the system it disturbs; this atom is about which of TWO DIFFERENT PROBLEM STATEMENTS to attempt first (preserve-and-fix vs. replace-entirely), independent of how deep the eventual fix under either framing turns out to be."
critical-questions:
  - "how would someone recognize that they've exhausted the minimum framing and should genuinely escalate to the maximum one, rather than getting stuck endlessly patching a system that structurally cannot deliver the maximum framing's benefit?"
  - "does starting with the minimum problem risk anchoring the solver's thinking so strongly in the existing system's vocabulary and constraints that the maximum framing never gets a fair, unbiased attempt afterward?"
  - "when resources are genuinely limited to one attempt (not enough time or budget to try minimum first and maximum second), what should determine which framing to commit to outright, since the 'try minimum first' recommendation assumes a sequential trial the situation may not afford?"
status: active
