id: lex-fudq5
name: an-unlimited-threat-has-a-boundary-that-only-appears-when-crossed
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone under you declares their power to reach you total and unconditional, that declaration can be sincerely believed by both parties right up until the moment you find the one domain the threat was never actually built to cross -- and the threat concedes instantly once you're in it. In Radin's Winnebago Trickster cycle, a father whose children Trickster has killed vows total, inescapable pursuit: 'Trickster, nowhere, no matter where you flee, will you be able to save your life. No matter where you go, I will pursue and kill you. ... you will not be able to find a refuge-place anywhere.' He chases Trickster across the whole of the land, and the chase is real and nearly fatal. But the instant Trickster reaches the edge of the ocean and jumps in, the pursuit simply stops: 'Ah, Trickster, you have saved yourself! You were indeed destined to die!' Then the man gave up the pursuit.' The boundary between land and water was never mentioned in the threat's own terms -- it was discovered, by both parties, only at the moment it was crossed. Diagnostic move: a threat that sounds unconditional is still a threat issued from inside some domain; the boundary of that domain is usually undeclared and untested, and it may only become visible to the threatened party at the exact moment they've already had to gamble on its existence."
related: []
evokes: [radin-winnebago-trickster-cycle, wakdjunkaga, no-matter-where-you-flee-will-you-be-able-to-save-your-life, ah-trickster-you-have-saved-yourself]
lineage:
  - source: primary
    text: radin-the-avenging-fathers-total-pursuit-of-trickster-ends-at-the-oceans-edge
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 8. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Well, Trickster, you will die for this! I will kill you, as I said I would if you killed my children.' ... 'Trickster, nowhere, no matter where you flee, will you be able to save your life,' shouted the man. 'No matter where you go, I will pursue and kill you. So you might as well give up now and be done with it. You are exhausted already as you see. You have nowhere to go. Indeed, you will not be able to find a refuge-place anywhere.' ... He pressed up against it and finally jumped into the water. Right into the middle of the ocean he fell. 'Ah, Trickster, you have saved yourself! You were indeed destined to die!' Then the man gave up the pursuit."
canonical-instances:
  - "A regulator declares that a company's noncompliance will be pursued 'in every jurisdiction it operates in,' and enforcement is genuinely relentless everywhere the company has a physical office, until the company restructures a division into a jurisdiction with no extradition treaty, at which point the pursuit simply stops rather than escalating further."
  - "An abusive partner insists 'you'll never get away from me, I'll always find you,' and for years this is functionally true across every place the victim tries, until the victim relocates into a specific legal and community support structure the partner has no way to operate within, and the pursuit that felt total turns out to have had that boundary all along."
critical-questions:
  - "Did the avenging father actually possess unlimited pursuit power that he chose not to exercise across water, or was the threat always bounded and he, like Trickster, only discovered the boundary at the moment it mattered -- does the text give any evidence he could have followed and simply didn't?"
  - "Is jumping into the ocean a genuinely available escape for most people facing an 'unlimited' threat, or is Trickster's survival here a matter of luck specific to the mythic setting, making the diagnostic less useful outside stories where such literal domain boundaries exist?"
  - "Would Trickster have found this boundary if he had tested it earlier and more deliberately rather than in blind, exhausted flight -- does the story suggest that discovering the limits of a threat generally requires being pushed to the edge first, or could it have been reasoned out in advance?"
status: active
