id: lex-psgkw
name: a-forced-tradeoff-only-traps-whoever-wants-both-horns
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a genuine impossibility result shows two principles can't both hold, check who the result actually constrains before treating it as a crisis for everyone who cares about the topic. Sen, closing his discussion of the liberal paradox (his own impossibility result pitting minimal individual rights against the Pareto principle), names exactly who is and isn't caught: “There is no great tragedy even for the no-nonsense man who denies the notion of ‘nosiness’ and takes A’s interest in B’s ‘personal’ affairs as justification for regarding that to be A’s affair also. He would very likely accept condition P and reject L*. The real dilemma is only for an intermediate observer, who finds the concept of nosiness meaningful and relevant, but does not want the Pareto principle to be rejected even when individual preferences are nosey. This position is slightly schizophrenic, but that is no great consolation since a great many people are schizophrenic in this sense.” Pick one horn cleanly -- give up the rights condition, or drop unanimity instead -- and the impossibility stops applying to you, since holding what it proves incompatible was your problem only as long as you kept trying to hold both. The paradox is only a live problem for whoever wants both commitments kept intact simultaneously, and Sen's closing jab is that this describes most people rather than some rare edge case. Diagnostic move: when an impossibility or trilemma result gets treated as though it wounds an entire field, check whether the people actually feeling the wound are the ones who picked a clean side, or the much larger group quietly trying to keep every commitment they started with."
related: [lex-37m5b, lex-9a377]
evokes: [popper-and-sen-parallel-impossibility-results, the-intermediate-observer, slightly-schizophrenic-in-this-sense, the-no-nonsense-man-who-denies-nosiness, picking-a-horn-versus-holding-both]
lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 6 'Conflicts and Dilemmas,' Section 6.6 'Critique of Unrestricted Domain,' closing paragraph."
    quote: "“The type of reasoning that justifies L* seems to debunk a complete adherence to the Pareto principle P. There is no great tragedy even for the no-nonsense man who denies the notion of ‘nosiness’ and takes A’s interest in B’s ‘personal’ affairs as justification for regarding that to be A’s affair also. He would very likely accept condition P and reject L*. The real dilemma is only for an intermediate observer, who finds the concept of nosiness meaningful and relevant, but does not want the Pareto principle to be rejected even when individual preferences are nosey. This position is slightly schizophrenic, but that is no great consolation since a great many people are schizophrenic in this sense.”"
canonical-instances:
  - "A debate over whether a company can simultaneously promise 'engineers own their own roadmap' and 'every team ships whatever the unanimous cross-team review board approves' gets treated as an existential crisis for the whole engineering org. In practice, the engineers who'd readily give up roadmap autonomy for org-wide alignment feel no tension, and neither do the ones who'd readily ignore the review board to protect their own scope -- the crisis is only real for managers who keep insisting both promises still stand."
  - "A philosophy department's ongoing argument over whether free will and determinism can coexist gets described as unsettling the whole field. Hard determinists who've already dropped libertarian free will feel no unsettlement, and libertarians who've already rejected strict determinism feel none either -- the felt crisis belongs specifically to compatibilists trying to hold both commitments at once, not to philosophy as a whole."
critical-questions:
  - "Isn't this just relabeling the problem -- calling the people who feel the dilemma 'confused' rather than showing the dilemma is fake? No -- Sen isn't calling the intermediate position confused or mistaken, he's calling it common ('a great many people are schizophrenic in this sense') and locating exactly where the impossibility bites. The diagnostic doesn't dissolve the paradox; it identifies who actually has to resolve it versus who gets to watch from a position the impossibility never touches."
  - "Doesn't 'pick one horn cleanly' just mean giving up on the thing that made the position worth holding in the first place? Sometimes, and Sen doesn't pretend otherwise -- the no-nonsense man's clean exit costs him the very notion of privacy or personal business that motivated caring about the question. The point isn't that picking a horn is free; it's that picking one, even at that cost, ends the felt dilemma, while refusing to pick keeps it live."
