id: lex-pm93k
name: cultural-classification-bundles-or-splits-natural-substrate
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When cultures cut the same natural substrate differently (kinship, color, plant taxonomy), the classification reflects social interest and history, not arbitrary choice. Cultural classification bundles or splits at salience joints; surface what the splits track before treating them as universal."
related: [lex-22kep, lex-3d2he, lex-3haas, lex-6ju6z, lex-9uac6, lex-a5jhg, lex-ctten, lex-eghgf, lex-gvwvx, lex-hsntu, lex-j5kxw, lex-jd7fe, lex-jud2d, lex-jue9r, lex-jyzng, lex-kfdep, lex-rbcsc, lex-sxt57, lex-u53ue, lex-xxmeh, lex-z26m9, lex-z8hbu, lex-zeznb]
scaffolds-from: [lex-jue9r, lex-gvwvx]
evokes: [morgan-classificatory-vs-descriptive, same-blood-different-kinship-term, berlin-kay-color-terms, language-carves-the-world, eskimo-snow-myth, categorization-as-cultural-axis, biology-doesnt-dictate-category]
lineage:
  - source: practitioner
    text: morgan-1871-systems-of-consanguinity
    citation: "Lewis Henry Morgan, *Systems of Consanguinity and Affinity of the Human Family* (Smithsonian Contributions to Knowledge Vol. XVII, 1871; manuscript completed 1865, publication delayed to 1871). (PD per Morgan d. 1881 + Smithsonian government-publication + work age >150 yr). Morgan (Rochester lawyer + ethnologist, 1818-1881) collected kinship-terminology systems from 139 cultures worldwide using a standardized 218-question schedule sent to missionaries, consuls, and traders. His Smithsonian volume documents the systems and argues they fall into TWO RADICAL FORMS: (1) DESCRIPTIVE systems (Aryan, Semitic, Uralian) where each line of descent gets distinct terms (English: brother / father's brother / mother's brother are three different words); (2) CLASSIFICATORY systems (Turanian, American Indian, Malayan) which BUNDLE multiple blood-relations under one term (Iroquois: father and father's brothers are all 'father'; mother and mother's sisters are all 'mother'; their children are all 'siblings,' not 'cousins'). Morgan's foundational finding: SAME natural-substrate (blood-relations) gets carved into SYSTEMATICALLY DIFFERENT cultural categories — the categorization is cultural-axis-choice, not biological-given. Morgan's discovery launched modern anthropology (he was a founder of the discipline) and demonstrated the pivotal claim that even seemingly-natural classifications like family-relations are culturally constructed."
    quote: "[Morgan 1871 *Systems of Consanguinity and Affinity of the Human Family*, Introduction pp.7-12:] 'All the forms of consanguinity exhibited in the tables resolve themselves into two, the descriptive and the classificatory. Of these the former is the most simple in its structure, and for this reason should be first considered. It embraces the systems of the Aryan, Semitic, and Uralian families, which are identical in their radical characteristics.' [Morgan distinguishing the two forms — note that it is the SECOND, classificatory form that makes the arbitrary generalizations, not the first:] 'The first, which is that of the Aryan, Semitic, and Uralian families, rejecting the classification of kindred, except so far as it is in accordance with the numerical system, describes collateral consanguinei, for the most part, by an augmentation or combination of the primary terms of relationship... But the second, which is that of the Turanian, American Indian, and Malayan families, rejecting descriptive phrases in every instance, and reducing consanguinei to great classes by a series of apparently arbitrary generalizations, applies the same terms to all the members of the same class. It thus confounds relationships, which, under the descriptive system, are distinct, and enlarges the signification both of the primary and secondary terms beyond their seemingly appropriate sense.' [Morgan on why the classificatory form was hard to elicit through his schedules:] 'Every system of relationship is intrinsically difficult until it has been carefully studied. The classificatory form is complicated in addition to being difficult, and totally unlike our own.' [On the substantive nature of the descriptive-vs-classificatory distinction:] 'Although a limited number of generalizations have been developed in the system of the first-named families... yet the system is properly characterized as descriptive, and was such originally. It will be seen in the sequel that the partial classification of kindred which it now contains is in harmony with the principles of the descriptive form, and arises from it legitimately to the extent to which it is carried; and that it is founded upon conceptions entirely dissimilar from those which govern in the classificatory form.' [On the methodological-substrate finding:] 'The more thoroughly the system is explored in the different nations of the same family of speech, especially where the form is classificatory, the more ample and decisive the evidence will become which bears upon the question of their genetic connection.' [The transferable claim: SAME natural-substrate (blood-relations are biologically-fixed) gets CARVED INTO DIFFERENT CATEGORIES by culturally-systematic axes. The categories are cultural-choices about which biological-distinctions to bundle and which to split. This generalizes beyond kinship to any classification-system that operates on naturally-continuous or naturally-distinct substrate — colors, emotions, spatial-relations, plant-and-animal categories all show the same systematic-cultural-variation in how the substrate is carved.]"
  - source: primary
    text: kimmerer-2013-braiding-sweetgrass-grammar-of-animacy
    citation: "Robin Wall Kimmerer, *Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge, and the Teachings of Plants* (Milkweed Editions 2013). (in-copyright). Chapter 'Learning the Grammar of Animacy' grounds a powerful refs-attested canonical-instance of lex-pm93k at the *mandatory grammatical category* layer (the same Whorf-style layer already invoked in lex-pm93k's critical-questions). Kimmerer's specific case: Potawatomi/Anishinabemowin grammatically marks animacy on every relevant syntactic element — pronouns, articles, plurals, demonstratives, verbs — and ~70% of words are verbs (vs ~30% in English). Many entities English encodes as nouns are encoded as verbs in Potawatomi (wiikwegamaa 'to be a bay'; Saturday 'to be a Saturday'; hill 'to be a hill'; red 'to be red'). The grammar mandatorily commits the speaker to animacy + process-ontology for what gets named; speakers cannot speak about a bay without grammatically encoding that the bay is an ongoing being-a-bay process. Kimmerer's substantive consequence-claim: when grammatical default for non-human entities is animate/process, ethical treatment tends toward kin-relation; when it is inanimate/object, ethical treatment tends toward resource-relation. This is the weak-Whorf claim already named in lex-pm93k's linguistic-relativity critical-question, with the *mandatory grammatical category* layer as the specific mechanism + a 21st-century Potawatomi-scholar Indigenous voice as the primary source. Distinctness-decision: 1 lineage-deep audit concluded this is a canonical-instance EXTENSION of lex-pm93k, not a distinct primitive — lex-pm93k already covers Whorf, Berlin-Kay, Levinson spatial-frame, Berlin folk-biology, and Russell-Barrett emotion-categorisation. Kimmerer adds the Potawatomi animate/inanimate grammatical-marking case + the kin-vs-resource ethical consequence-claim."
    quote: "[Kimmerer 2013 Ch. 'Learning the Grammar of Animacy', on the verb-vs-noun proportion + animacy marking:] 'English is a noun-based language, somehow appropriate to a culture so obsessed with things. Only 30 percent of English words are verbs, but in Potawatomi that proportion is 70 percent... European languages often assign gender to nouns, but Potawatomi does not divide the world into masculine and feminine. Nouns and verbs both are animate and inanimate. You hear a person with a word that is completely different from the one with which you hear an airplane. Pronouns, articles, plurals, demonstratives, verbs — all those syntactical bits I never could keep straight in high school English are all aligned in Potawatomi to provide different ways to speak of the living world and the lifeless one.' [Ch. same, on the wiikwegamaa example anchoring the substantive ontological-stance claim:] 'My finger rested on wiikwegamaa: to be a bay. Ridiculous! I ranted in my head. There is no reason to make it so complicated... A bay is most definitely a person, place, or thing — a noun and not a verb. I was ready to give up' — followed by her recognition of what the grammar mandatorily encodes about the bay as an ongoing being-a-bay. [Ch. same, on the Puhpowee word for 'the force which causes mushrooms to push up from the earth overnight':] 'In all its technical vocabulary, Western science has no such term, no words to hold this mystery... In the three syllables of this new word I could see an entire process of close observation in the damp morning woods, the formulation of a theory for which English has no equivalent.'"
  - source: practitioner
    text: brown-1991-human-universals
    citation: "Donald E. Brown, *Human Universals* (McGraw-Hill 1991; Temple University Press 2017 reissue). (in-copyright). Ch.1 'Color Classification' (pp.10-14) anchors lex-pm93k at the canonical Berlin-Kay color-terms case. Brown reproduces the 1960s relativist consensus (Bohannan 1963, Ray 1952, Gleason 1961, Nida 1959, Krause 1968) that color-terms divide the spectrum arbitrarily, then walks through Berlin & Kay's 1969 *Basic Color Terms* finding that (i) no language has more than eleven 'basic' color terms; (ii) the FOCAL POINTS (best examples) of each basic color category are remarkably stable across languages even when BOUNDARIES vary; (iii) the ORDER of acquisition follows a constrained sequence (white/black → red → green-or-yellow → both → blue → brown → purple/pink/orange/gray). Berlin-Kay thus established the partial-universal pattern that lex-pm93k names: same natural substrate, culturally-different cuts, BUT with universal constraints on which cuts are made. Brown places this finding alongside other partial-universals — folk-biological classification (Brown 1977, Witkowski & Brown 1978) shows similar evolutionary sequences in life-form vocabulary, while kinship classification (Morgan, Murdock) shows the same same-substrate / different-cuts pattern without strong universal sequencing. Brown's Ch.2 discussion of 'universals of classification' vs 'universals of content' supplies the meta-vocabulary lex-pm93k needs: a 'universal of classification' is precisely the pattern where every culture HAS the classification but the specific cuts vary."
    quote: "[Brown 1991 *Human Universals* Ch.1 'Color Classification', on the relativist consensus Berlin-Kay overturned:] 'Anthropologists and linguists had long known that the way colors are classified varies from language to language… Many anthropologists, in accordance with the \"prevailing doctrine\" of \"extreme linguistic relativity,\" interpreted these findings as showing that there were no semantic universals in the domain of color terms, that the lexical coding of color was arbitrary (Berlin and Kay 1969:1–2).' [Quoting Bohannan 1963:34-35 as the relativist textbook:] 'The spectrum is a continuum of light waves… But the way different cultures organize these sensations for communication show some strange differences.' [And Ray 1952:] 'there is no such thing as a natural division of the spectrum. Each culture has taken the spectral continuum and has divided it upon a basis which is quite arbitrary.' [On Berlin & Kay''s 98-language survey + the eleven-basic-colors finding:] 'Although the number of color terms in each language did vary, they found that no more than eleven colors accounted for the basic color terms found in each language… The eleven basic colors are white, black, red, green, yellow, blue, brown, purple, pink, orange, and gray.' [On the focal-point invariance that proves the cuts are NOT arbitrary:] 'Although the boundaries of color terms vary—by and large, the fewer the terms the wider their bounds—the focal point of each basic color is substantially the same from one language to another… This definitively falsified the doctrine of total arbitrariness of color classification: color classification does not arbitrarily slice a continuum.' [On the universal evolutionary sequence:] 'If a language has only two colors—and all languages have at least two—they are always white and black; if a language has three colors, the one added is red; if a fourth is added, it will be either green or yellow; when a fifth is added, it will then include both green and yellow; the sixth added is blue; the seventh added is brown… Berlin and Kay (1969:159) dismiss \"extreme linguistic-cultural relativism,\" at least with respect to basic color terms, as a \"myth created by linguists and anthropologists.\"' [Brown''s framing makes lex-pm93k a partial-universal rather than a pure-cultural-construction claim — the natural substrate (visible-light continuum) carves into culturally-variable categories, but the categories are CONSTRAINED by universal cognitive machinery (focal-point salience + evolutionary sequence). The same shape applies to folk-biological classification and other classification domains:] 'studies of the classification of botanical and zoological life forms have revealed evolutionary sequences similar to those that Berlin and Kay found in the classification of basic colors (Brown 1977b, 1979; Witkowski and Brown 1978).' [Ch.2 supplies the meta-vocabulary:] 'such broad categories as religion or government are extreme versions of [universals of classification]. Wissler''s (1923) \"Universal Pattern\" consists mostly of universals of classification. A universal of content, on the other hand, is one in which the details of the phenomenon are themselves universal.' [Brown thus underwrites both halves of lex-pm93k: ''every culture has classification-systems for kinship, color, plants, etc.'' (universal of classification) AND ''the specific cuts vary culturally within universal constraints'' (variable content).]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v46
    citation: "Cross-domain attestations: Berlin + Kay 1969 *Basic Color Terms* established that color-vocabularies across languages vary systematically (2 to 11 basic-color-terms across languages; the order in which terms appear is constrained — black/white come first, then red, then green/yellow, then blue, then brown, then secondary colors). Same color-substrate, different carvings. Whorf 1956 *Language, Thought, and Reality* (also Sapir-Whorf hypothesis) argued classification-differences produce thought-differences (the strong version disputed; the weak version — categorization influences perception speed + similarity-judgments — empirically supported by Winawer et al. 2007 on Russian blue distinctions). Levinson 2003 *Space in Language and Cognition* on absolute (Guugu Yimithirr cardinal-directions) vs relative (English left/right) spatial-frame languages. Lakoff 1987 *Women, Fire, and Dangerous Things* on Dyirbal categorization. Brown 1991 *Human Universals* catalogs which classification-axes ARE universal (basic color-categories follow constrained order) and which are culturally-variable (specific category-cuts vary). The atom captures Morgan's specific kinship finding generalized: same-natural-substrate / different-cultural-categories is robust across many classification-domains. Multi-substrate attestation across anthropology (kinship, Morgan), color-classification (Berlin-Kay), spatial-classification (Levinson), folk-biology (Berlin), and emotion-categorization (Russell + Barrett vs Ekman)."
    quote: "[Cross-domain consistency check, 2026-05-24: Morgan's 1871 finding survives ~155 years and has been replicated across many classification-domains. The pattern — same natural-substrate gets carved into different cultural-categories — is robust across color-terms, spatial-terms, kinship-terms, emotion-categories, folk-biology, and other classification systems. CRUCIAL pairing with lex-xxmeh (Darwin emotion-universals): NOT EVERYTHING is culturally variable. Some traits ARE universal (Darwin's basic emotions, Ekman's six). Others ARE culturally-variable (Morgan's kinship classifications, Berlin-Kay's color-categories). The DIAGNOSTIC question — is this universal or culturally-variable? — must be answered empirically for each candidate-trait. The naive default of either 'everything is universal' (radical evolutionary-psychology) or 'everything is culturally constructed' (radical social-constructionism) misreads the empirical evidence. Different parts of human cognition are at different points on the universal-vs-cultural spectrum.]"
canonical-instances:
  - "the kinship-terminology canonical case (Morgan 1871): the Iroquois (Seneca) call their father AND their father's brothers all 'father'; their mother AND their mother's sisters all 'mother'; their cousins through these (parallel-cousins) all 'siblings'; but their father's sisters' children + mother's brothers' children (cross-cousins) get a separate term. English (descriptive system) distinguishes father / uncle and brother / cousin without regard to whether the relation is through same-sex or opposite-sex pairs of siblings. Same biology (blood-relations through ancestors), entirely different category-cuts. Morgan documented 139 such systems, demonstrating systematic variation"
  - "the basic-color-terms canonical case (Berlin + Kay 1969 *Basic Color Terms*): languages have 2 to 11 'basic' color terms (terms that are monomorphemic, salient, applicable to objects-broadly, not derivative). The cut-points vary — some languages bundle blue + green into one term ('grue'), some split blue into multiple basic terms (Russian distinguishes light blue (goluboy) and dark blue (siniy) as basic). Berlin-Kay's universal-evolutionary-sequence (black/white → red → green/yellow → blue → brown → secondary) is itself a partial-universal: not all languages have all categories, but those they do have follow the order. Same color-substrate (visible-light spectrum), systematically-different category-cuts"
  - "the spatial-frame canonical case (Levinson 2003 *Space in Language and Cognition*): Guugu Yimithirr (Aboriginal Australia) uses ABSOLUTE spatial reference (cardinal directions — 'the cup is to the north of the plate') even for object-relations on a table; English uses RELATIVE reference ('to my left'); Tzeltal Mayan uses INTRINSIC reference (object-based — 'the foot of the mountain'). The same physical spatial-substrate gets carved by different frame-conventions. Cognitive-consequence: speakers of different spatial-frame languages perform differently on non-linguistic spatial-cognition tasks (Levinson's rotation experiments)"
  - "the folk-biology canonical case (Berlin 1992 *Ethnobiological Classification*): folk-biological category-systems across cultures show universal-rank-structure (kingdom → life-form → generic → specific → varietal) but variable-content (which species get bundled as 'one kind' varies). Same biological substrate, culturally-systematic carvings. Berlin's finding: the RANK-structure is universal (probably evolved), the specific CATEGORIES are culturally variable. A partial-universal, paralleling Berlin-Kay's color findings"
  - "the emotion-categorization canonical case (Russell 1991 + Barrett 2017 *How Emotions Are Made* — counter to Ekman 1971): while basic-emotion EXPRESSIONS may be universal (lex-xxmeh), emotion CATEGORIES vary substantially. Some languages have no separate words for 'sadness' vs 'anger' (combined); others split categories Western English collapses (Japanese has multiple shame/embarrassment categories with distinct emotional-profiles). The Russell-Barrett position: emotion-construction varies even when the underlying affect-substrate (valence + arousal) is universal. Compare lex-xxmeh: emotion-EXPRESSIONS are universal; emotion-CATEGORIES are culturally variable. The two atoms together capture the partial-universalism position"
  - "the Potawatomi grammatical-animacy canonical case (Kimmerer 2013 Ch. 'Learning the Grammar of Animacy'): the natural-substrate is the field of named entities (bays, mushrooms, Saturdays, hills, the colour red). Potawatomi grammatically marks animate vs inanimate on every relevant syntactic element (pronouns, articles, plurals, demonstratives, verbs) and ~70% of words are verbs vs ~30% in English; many things English encodes as nouns are encoded as verbs (wiikwegamaa 'to be a bay'). The grammar mandatorily commits the speaker to one ontological-stance per named entity — no 'object' default available. Kimmerer's consequence-claim, well-supported by the broader Indigenous-philosophy literature: when the grammatical default for non-human entities is animate/process, ethical treatment toward kin-relation follows; when it is inanimate/object, ethical treatment toward resource-relation follows. This is the transferable lex-pm93k pattern (same natural-substrate, different cultural-classification) at the specifically MANDATORY-GRAMMATICAL-CATEGORY layer that lex-pm93k's linguistic-relativity critical-question already names — Whorf at the level of obligatory grammatical encoding rather than vocabulary choice. Companion finding: the Anishinaabemowin word Puhpowee ('the force which causes mushrooms to push up from the earth overnight') names a process that English-language scientific vocabulary has no term for, demonstrating that the carving-axis the language imposes shapes which observations are even named-as-meaningful."
  - "operationally distinct from lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature: lex-xxmeh names what's UNIVERSAL across cultures (evolved-substrate). lex-pm93k names what's VARIABLE across cultures (cultural-classification). They are sister-atoms — together they capture the diagnostic question for any trait: which side of the universal/variable line does it sit on? Some traits sit on lex-xxmeh's side (basic emotion expressions, frowning), some sit on lex-pm93k's side (kinship terms, color category-cuts beyond Berlin-Kay universals)"
  - "operationally distinct from lex-jue9r categorical-axis-decomposition: lex-jue9r is the GENERAL pattern of decomposing along axes. lex-pm93k is the SPECIFIC anthropological claim that classification-axes vary culturally — same substrate gets different decompositions across cultures. Cross-fire: lex-jue9r supplies the decomposition-as-method; lex-pm93k demonstrates that the AXIS-CHOICE in decomposition is itself culturally-variable for many substrates"
  - "operationally distinct from lex-zeznb signifier-bifurcates-into-denotation-and-connotation: Mill's atom is about the STRUCTURE of a signifier (denotation only vs +connotation). lex-pm93k is about how DIFFERENT cultures group referents into categories. They operate on adjacent layers — Mill on the individual-signifier structure, Morgan on the category-system structure. Cross-fire: a kinship-term 'father' is connotative (Mill); the question of which biological-relations 'father' picks out is the kinship-classification question (Morgan)"
  - "operationally distinct from lex-j5kxw uncertainty-classified-by-cause-and-response: lex-j5kxw is about classifying UNCERTAINTY TYPES (Knightian, etc.). lex-pm93k is about classifying ANY natural-substrate via cultural-axes. Different application-domains; lex-j5kxw is one specific classification-task subject to lex-pm93k's general pattern"
critical-questions:
  - "the universal-vs-variable diagnostic: for any candidate-trait, is it lex-xxmeh-shaped (universal, evolved) or lex-pm93k-shaped (culturally-variable in category-cuts)? Practitioner-question: does cross-cultural evidence support a UNIFORM category-structure (suggesting evolved) or SYSTEMATICALLY VARYING category-cuts (suggesting cultural-construction)? Many traits are partial-universals: rank-structure universal + specific-cuts variable (Berlin's folk-biology, Berlin-Kay's color, possibly emotion). Distinguish these from pure-universals (basic facial expressions per Ekman) and pure-cultural-constructions (kinship classifications per Morgan)"
  - "the axis-choice question: WHICH cultural-axis is used to carve the substrate? For kinship: same-sex-vs-opposite-sex of parental siblings (Iroquois) vs lineage-only (English). For color: hue + saturation (Berlin-Kay-style) vs brightness-as-primary (some languages). Practitioner-discipline: when documenting a new classification-system, surface the underlying CULTURAL AXIS, not just the resulting categories. The axis is the key cultural-choice"
  - "the cross-cultural-translation problem: when a category exists in culture A but not culture B (or has different cuts), translation requires either creating a neologism, glossing with a paraphrase, or accepting a translation-loss. Practitioner-question: when translating across classification-systems, name what's being LOST in the translation. This applies to translating between programming-languages (different type-systems), between legal-systems (different jural-categories), between scientific paradigms"
  - "the linguistic-relativity boundary: STRONG Whorf (language DETERMINES thought) is empirically false; WEAK Whorf (language INFLUENCES thought) is empirically supported (Winawer 2007 on Russian blue, Levinson on Guugu Yimithirr spatial cognition). Practitioner-question: how MUCH does the classification-system constrain the thoughts a culture can think? The honest answer: classification-systems make some inferences easier + others harder, but don't make any inference impossible. Cultures can usually develop new categories when needed (loanwords, neologisms)"
  - "the methodological-question: how do you EMPIRICALLY decide if a classification is universal or culturally-variable? Morgan's approach: large-scale comparative survey (139 cultures). Berlin-Kay: targeted-vocabulary elicitation. Modern: cross-cultural-experiments with controlled stimuli (Ekman 1971 photo-recognition; Winawer 2007 perceptual-discrimination). Practitioner-discipline: don't claim a trait is universal based on Western data alone; don't claim cultural-variability based on contrasting two cultures alone. Cross-cultural breadth is the methodological substrate"
  - "the LLM/AI-design application: training-data is heavily skewed toward Western-anglophone cultural classifications (kinship 'cousin' lumping all parallel + cross cousins; color cuts following English categories; emotion vocabulary following Ekman-tradition basic-emotions). Models trained on this data inherit these culturally-specific classifications. Practitioner-discipline: when deploying LLMs cross-culturally, surface which classifications are universal vs which are culturally-specific in the training-distribution. Treat culturally-variable classifications as VARIABLES to be parameterized, not as universal defaults"
status: active
