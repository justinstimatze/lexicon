id: lex-b773q
name: evade-a-threats-narrow-window-of-power-instead-of-confronting-it-there
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When facing a threat that's nearly unstoppable under one specific condition but structurally weak under another, don't fight it during the window where it holds every advantage -- withdraw, wait, and let the condition that empowers it expire on its own, since the same threat that could destroy you at night, asleep, and unprepared may be almost harmless once the terms change. Zitkála-Šá's telling names both halves of Iya's nature explicitly: 'He is a giant with spindling legs. He cannot fight, for he cannot run. He is powerful only in the night with his tricks. We are safe as soon as day breaks.' The village's entire strategy follows directly from this asymmetry -- they don't try to kill Iya while he sleeps in the guise of a baby, which would risk waking the very danger they're trying to avoid; they silently evacuate under cover of night and simply wait him out. Only once daylight arrives, on ground and terms where his 'spindle legs cannot stand to fight,' do the same people who were 'terror-struck the night before by the name Iya' walk up and kill him without difficulty. The mechanism isn't bravery finally arriving -- it's that the fight never actually needed to happen in the regime where he was dangerous, because his dangerousness and his vulnerability were never in the same place at the same time. Diagnostic move: when assessing a threat, ask specifically what conditions make it powerful and whether those conditions are permanent or temporary -- if the threat's power is tied to a specific, expiring window (darkness, secrecy, a market condition, someone's temporary authority) and its weakness shows up reliably once that window closes, the correct response is usually to survive the window intact rather than to test your strength against it while it still holds every advantage."
