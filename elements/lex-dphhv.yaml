id: lex-dphhv
name: asking-who-first-established-a-boundary-exposes-its-contingency
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A boundary that feels like a fixed, natural fact -- this belongs to that person, this is simply how things are divided -- can be shown to be a contingent human arrangement rather than a discovered truth just by asking, plainly, who established it in the first place and by what authority. Hyde reads trickster's lies and thefts as performing exactly this move: 'Our ideas about property and theft depend on a set of assumptions about how the world is divided up. Trickster's lies and thefts challenge those premises and in so doing reveal their artifice and suggest alternatives.' He follows the question outward in a widening series that never actually needs an answer to do its work: 'Who gave Apollo those cattle in the first place, anyway? Who exactly decides how the sacrifice should be apportioned? Who was the original owner of the butter that Yasoda guards so carefully? Who gave all of Pennsylvania to William Penn?' The boundary doesn't have to be proven false. Simply tracing it back to a first, particular, historically locatable act of assignment is enough to convert something that felt eternal and given into something that was decided, once, by someone -- and could in principle have been decided differently. Diagnostic move: when a division of ownership, status, or entitlement is being treated as too obvious or natural to question, ask directly who established it, when, and by what authority -- you don't need a better system to propose; simply locating the founding act is often enough to strip the boundary of its air of inevitability and put it back into the category of things that were chosen rather than discovered."
