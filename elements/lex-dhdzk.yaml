id: lex-dhdzk
name: embedding-a-true-claim-in-a-known-unreliable-frame-gets-it-disbelieved
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Wrapping a true claim inside a story that carries an established reputation for unreliability doesn't just risk the claim being doubted along with the rest -- it can cause the listener to specifically single out and reject the one true part while accepting the surrounding fiction, because the frame's known unreliability becomes the lens the whole story gets read through. Odysseus, disguised as a beggar and testing the swineherd Eumaios, tells a long, richly detailed 'Cretan lie' and embeds within it a true statement: that Odysseus, the king, will soon return. Cretans, in this world, 'were understood to be \"lazy bellies\" and liars by nature,' so by claiming Cretan origin Odysseus is, in Hyde's words, 'hanging a lantern on his own fibs.' The result is precise: Eumaios accepts the surrounding invented backstory as plausible travelers' tale, but 'rejects as a fabrication the single part of the story that is true,' replying, 'Why must you lie…? You needn't lie to be a guest here.' The frame didn't make the whole story suspect equally -- it made the listener confident enough in his own skepticism to specifically disbelieve the one claim that happened to be accurate. Diagnostic move: before embedding a true, important claim inside a narrative frame you know the listener already distrusts, consider that the frame's reputation won't just create general doubt spread evenly across the story -- it can give the listener false confidence to specifically reject exactly the part you most needed them to believe."
