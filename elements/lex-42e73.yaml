id: lex-42e73
name: strike-the-recoverable-threat-not-the-one-already-collapsing
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When two rivals are both weakened but by different amounts, don't default to attacking whichever one is currently the easier target -- check which one's weakness will persist without your intervention and which one will recover on its own, because the recoverable one is where your action actually changes the outcome, while the collapsing one may get worse, or fail entirely, with or without you. Kautilya poses the choice directly: 'Between a neighbouring king seriously affected [but not very hostile] and a hostile one much less affected, who should be attacked first?' The rival teachers reach for the obvious efficiency argument -- 'the one seriously affected should be attacked first because he will be the easier target' -- and Kautilya rejects it by naming what happens to each target if left alone: 'The hostile king, even if he is less affected shall be attacked first because even his light trouble will be exacerbated by the attack. It is true that the serious troubles of the other will also become much more serious when attacked. However, by not attacking him, the hostile king with a less serious trouble will happily get over it and go to the help of the other or mount his own attack with the help of the [conquered] enemy in the rear.' The reasoning turns on counterfactual trajectory, not current severity: the severely-afflicted rival's troubles will likely deepen on their own regardless of what you do, so attacking them buys comparatively little you wouldn't eventually get for free, while the lightly-afflicted hostile rival's default trajectory is recovery -- 'happily get over it' -- and once recovered, they become either a helper to your other target or an independent threat in their own right. The 'easier target' framing measures the wrong variable: it asks where the least effort produces a win, when the decision that actually matters is where your effort changes what would otherwise happen next. Diagnostic move: when two threats are both currently weak but by different degrees, don't rank them by how much effort each would take to finish off today -- ask which one, left alone, drifts back toward strength and which one drifts further toward collapse on its own, and spend your effort on the one whose future trajectory your inaction would otherwise let recover."
related: [lex-fpg4x]
scaffolds-from: [lex-fpg4x]
evokes: [attack-the-recoverable-not-the-collapsing, effort-changes-trajectory-not-current-state, kautilya-whom-to-attack-severity-debate, hostile-but-lightly-wounded-will-recover]
lineage:
  - source: primary
    text: kautilya-arthashastra-strike-the-recoverable-not-the-collapsing
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Whom to Attack,' (ii) 'Between two kings unequally affected,' {7.5.1-8}."
    quote: "'Between a neighbouring king seriously affected [but not very hostile] and a hostile one much less affected, who should be attacked first? Some teachers say that the one seriously affected should be attacked first because he will be the easier target. Kautilya disagrees. The hostile king, even if he is less affected shall be attacked first because even his light trouble will be exacerbated by the attack. It is true that the serious troubles of the other will also become much more serious when attacked. However, by not attacking him, the hostile king with a less serious trouble will happily get over it and go to the help of the other or mount his own attack with the help of the [conquered] enemy in the rear.'"
canonical-instances:
  - "A market leader facing two struggling rivals -- one in a genuine death spiral from unrelated financial trouble, one merely going through a rough quarter but actively poaching the leader's customers -- spends its competitive effort on the actively hostile, lightly-wounded rival rather than the collapsing one, because the collapsing rival is likely to fail regardless of any action taken, while the lightly-wounded hostile one will recover and remain a threat if left alone."
  - "operationally distinct from lex-fpg4x measure-strategic-position-by-relative-rate-not-absolute-level: that atom is about how a party should measure its own progress or decline relative to a rival's trajectory; this atom is about a downstream choice -- which of two weakened rivals to spend limited offensive effort on -- that uses a similar recovery-trajectory logic but applied to selecting a target rather than to self-assessment."
critical-questions:
  - "how confidently can a decision-maker actually forecast which weakened rival will 'happily get over it' versus which one will keep declining -- is this trajectory genuinely predictable from current information, or does it risk becoming a post-hoc justification for whichever target was already preferred for other reasons?"
  - "does leaving the severely-afflicted rival alone on the assumption they'll collapse on their own risk missing a case where they stabilize instead, having been given a free pass precisely when a small additional push would have finished them -- is 'they'll fail anyway' a reliable prediction or a convenient excuse for inaction?"
  - "if the recoverable rival's hostility were removed from the equation -- if the lightly-affected rival were also neutral, not hostile -- would the trajectory logic alone still favor attacking the recoverable one over the collapsing one, or is hostility doing real work in this specific verdict that a purely rate-of-recovery analysis wouldn't supply on its own?"
status: active
