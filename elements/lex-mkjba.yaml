id: lex-mkjba
name: symmetric-condemnation-regardless-of-behavior-serves-the-same-function
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a group is condemned for lacking a valued trait AND condemned for having 'too much' of the same trait, don't treat this as two separate, possibly-inconsistent complaints — check whether both condemnations are doing the identical structural job of justifying the group's subordinate status regardless of what it actually does. Merton names it directly: 'there is no paradox at all in damning out-groupers when they do and when they don't exhibit in-group virtues. Condemnation on these two scores performs one and the same social function. Seeming opposites coalesce. When Negroes are tagged as incorrigibly inferior because they (apparently) don't manifest these virtues, this confirms the natural rightness of their being assigned an inferior status in society. And when Jews or Japanese are tagged as having too many of the in-group values, it becomes plain that they must be securely controlled by the high walls of discrimination.' The predicted downstream effect is a mirror-image defensive response in the targeted group itself, not a single consistent one: 'If the Negroes are accused of inferiority... the human urge for self-respect... often leads them defensively to magnify each and every achievement... If Jews are accused of excessive achievements... the urge for security leads them defensively to minimize the actual achievements of members of the group... Self-assertion and self-effacement become the devices for seeking to cope with condemnation for alleged group deficiency and condemnation for alleged group excesses, respectively.' Diagnostic use: when a group's behavior in either direction gets treated as confirming the same prior verdict, the verdict is doing the work, not the behavior — and the group's own opposite-looking coping responses (over-claiming in one context, self-erasing in another) are symptoms of the same double bind, not evidence of inconsistency on their part."
related: [lex-84hmr]
evokes: [merton-1957, damned-if-you-do-damned-if-you-dont, in-group-virtues-become-out-group-vices, donald-young, self-assertion-and-self-effacement, double-bind]
lineage:
  - source: primary
    text: merton-1957-social-functions-and-dysfunctions
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XI 'The Self-Fulfilling Prophecy,' p.430. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'we have only to look at the consequences of this peculiar moral alchemy to see that there is no paradox at all in damning out-groupers when they do and when they don't exhibit in-group virtues. Condemnation on these two scores performs one and the same social function. Seeming opposites coalesce. When Negroes are tagged as incorrigibly inferior because they (apparently) don't manifest these virtues, this confirms the natural rightness of their being assigned an inferior status in society. And when Jews or Japanese are tagged as having too many of the in-group values, it becomes plain that they must be securely controlled by the high walls of discrimination. In both cases, the special status assigned the several out-groups can be seen to be eminently reasonable.'"
  - source: primary
    text: merton-1957-self-assertion-self-effacement
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.432-433."
    quote: "'If the Negroes are accused of inferiority, and their alleged failure to contribute to world culture is cited in support of this accusation, the human urge for self-respect and a concern for security often leads them defensively to magnify each and every achievement by members of the race. If Jews are accused of excessive achievements and excessive ambitions, and lists of pre-eminent Jews are compiled in support of this accusation, then the urge for security leads them defensively to minimize the actual achievements of members of the group. Apparently opposed types of behavior have the same psychological and social functions. Self-assertion and self-effacement become the devices for seeking to cope with condemnation for alleged group deficiency and condemnation for alleged group excesses, respectively.'"
canonical-instances:
  - "A startup is criticized for being unprofitable ('not a real business') and, once profitable, criticized for 'optimizing for margins over mission' — both criticisms justify the same underlying verdict that the founders can't be trusted, regardless of the financial results."
  - "Distinct from lex-84hmr (moral alchemy relabels identical behavior): that atom is about the SAME act getting different words depending on the actor. This atom is about a group being punished for OPPOSITE acts (having a trait vs. lacking it) because both punishments serve the same status-preserving function — the mechanism operates even when the group's actual behavior changes."
critical-questions:
  - "Is this pattern falsifiable from the inside — is there any group behavior that a sufficiently motivated in-group critic couldn't fold into 'confirms the verdict,' or does the double-bind framing itself risk becoming unfalsifiable in the same way it accuses the critics of being?"
  - "Merton frames the out-group's self-assertion/self-effacement as a rational coping response to the double bind — does labeling it that way risk understating cases where a group's own internal culture, independent of any double bind, also shapes which of the two responses appears?"
status: active
