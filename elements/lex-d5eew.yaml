id: lex-d5eew
name: unregulated-individual-choices-aggregate-to-collective-states-no-actor-preferred
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating an aggregate state — a segregation pattern, a market outcome, a traffic equilibrium, a college-class composition, an industry concentration — refuse to read individual preferences off the aggregate. The aggregate is the joint product of (individual preferences, the sequence of choices, the environmental feedback each choice creates for subsequent choosers) — NOT a sum of preferences. Each individual move is rational given the environment that moment, but each move CHANGES the environment for everyone choosing next. So the same population, with the same preferences, can produce wildly different aggregate states depending on choice-sequence and feedback. The transferable diagnostic: when you see an extreme aggregate, ask three questions in sequence. (i) What would each person say they prefer if asked directly? (ii) What did each person individually choose, given the environment they faced at choice-time? (iii) What aggregate would each person have preferred? If (i), (ii), and (iii) diverge — and they often do — the aggregate is a structural product of feedback dynamics, not evidence about preferences. The operational corollaries: (a) policy that targets average preference is the wrong lever — target the feedback structure (move thresholds, change the choice-sequence, change what each chooser sees); (b) 'people are choosing this so they must prefer it' is invalid inference; (c) very moderate preferences can aggregate to very extreme outcomes; (d) the only way to test the gap is to model the feedback dynamics, not to poll preferences."
