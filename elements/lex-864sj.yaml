id: lex-864sj
name: negotiating-explicit-boundaries-before-accepting-continuous-service
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'Before agreeing to a role of continuous personal service to a superior, an agent can enumerate specific conditions in advance — what will never be demanded, and what will always be granted — preserving autonomy within an otherwise asymmetric relationship by negotiating the boundary before commitment rather than discovering it after. In the Jataka''s tale of Ananda''s boons, Elder Ananda names eight conditions, four things he will never be required to do and four things he must always be granted, before agreeing to attend the Buddha continually: "If the Blessed One will not give me the robe which he himself has received, if he will not give me his dole of food, if he will not grant me to dwell in the same fragrant cell, if he will not have me with him to go where he is invited: but if the Blessed One will go with me where I am invited, if I shall be granted to introduce the company at the moment of coming, which comes from foreign parts and foreign countries to see the Blessed One, if I shall be granted to approach the Blessed One as soon as doubt shall arise, if whenever the Blessed One shall discourse in my absence he will repeat his discourse to me as soon as I shall return: then I will attend upon the Blessed One."'
related: []
evokes: [jataka, ekadasanipata, junha-jataka, boundary-setting, conditions-of-service]
lineage:
  - source: primary
    text: jataka-chalmers1895-junha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 456, Junha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "If the Blessed One will not give me the robe which he himself has received, if he will not give me his dole of food, if he will not grant me to dwell in the same fragrant cell, if he will not have me with him to go where he is invited: but if the Blessed One will go with me where I am invited, if I shall be granted to introduce the company at the moment of coming, which comes from foreign parts and foreign countries to see the Blessed One, if I shall be granted to approach the Blessed One as soon as doubt shall arise, if whenever the Blessed One shall discourse in my absence he will repeat his discourse to me as soon as I shall return: then I will attend upon the Blessed One."
canonical-instances:
  - "Before accepting a chief-of-staff role, a candidate lists what she will never be asked to do (screen the executive's personal calls) and what she must always be given (a seat in every strategy meeting) as the price of taking the job at all."
critical-questions:
  - "Ananda negotiates from a position where the Buddha clearly wants him specifically — does this tactic transfer to a candidate with less leverage, or does it only work when the superior has already signaled they need this particular person?"
status: active
