id: lex-s2dg5
name: which-trait-counts-as-essential-is-a-chosen-weighting-not-a-discovery
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Aristotle's distinction between a category's essential traits (what genuinely defines membership) and its accidental traits (what varies without changing membership) sounds like a neutral logical tool, but which trait gets called essential is a choice that can be weighted with wild, self-serving asymmetry rather than discovered through any principled procedure. Hyde names the American racial category built this way: 'the bizarre fiction developed that \"one drop\" of \"black\" blood consigns an individual to the category \"black.\" One drop makes the essence; fifty drops of \"white\" blood are accidents.' The same logical apparatus -- essence versus accident -- that works cleanly for apples (ripeness is accidental, being-a-fruit is essential) gets deployed here with a ratio of one to fifty, and nothing in the logic of essence-versus-accident itself explains or justifies that ratio; it has to be smuggled in from outside, serving a predetermined categorical outcome the 'logic' merely dresses up. Diagnostic move: when a category's membership rule treats one trait as decisively essential and everything else as mere accident, don't accept the essential/accidental framing as if it were discovered by neutral analysis -- ask who benefits from that particular weighting, and check whether the same logical apparatus, applied with the opposite weighting, would produce an equally coherent-sounding but entirely different category."
