id: lex-mpw5h
name: a-monstrous-conclusion-indicts-the-premises-not-the-conclusion
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a chain of individually plausible premises logically forces a conclusion you find monstrous, treat that as evidence against one of the premises, not as a reason to accept the monster. Sen, on how Arrow's own field actually treated the impossibility theorem's dictatorship result: “when an axiomatic structure, with reasonable-looking axioms, yields the existence of a dictator as an implication of jointly chosen -- individually plausible -- axioms, this is readily understood as a major embarrassment for that set of propositions, rather than taking the conclusion in favour of dictatorship to be acceptable on the ground that dictatorial rule is a logical corollary of axioms that have already been accepted and endorsed. ... In this sense, any axiom system remains tentatively accepted, awaiting our examination of its actual consequences, for not only can we try to evaluate the chosen axioms individually, but we can also try to assess the joint use of a number of different axioms as a combined system. Facing an authoritarian conclusion, we have to think about what proposition might be dropped or modified to make the outcome less authoritarian.” Valid logic only guarantees that the conclusion follows from the premises -- it never guarantees the premises were all true, and a conclusion repugnant enough should raise the odds that one of them wasn't. Diagnostic move: when someone defends an unacceptable outcome by pointing to the airtight chain of reasoning that produced it, don't treat 'the logic is valid' as the end of the conversation. Ask which premise, examined on its own, is actually the weakest link -- accepting every premise individually while refusing to examine what they jointly commit you to is how a monstrous conclusion gets smuggled in as a mere technical result."
