id: lex-65p3n
name: pacing-outpredicts-content-surprise-for-audience-response
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When trying to explain or engineer why a piece of communication lands - a joke, a pitch, a scene, a speech - don't assume the content's surprise value is doing most of the work. In a large naturalistic dataset of professional comedy, how long and how variably a performer paused, and how slowly they spoke, predicted audience appreciation more strongly than how semantically surprising their material was. Treat pacing as a first-class lever, not a delivery detail layered on top of already-good content - and hold the finding honestly correlational: skilled performers may simply pause more because they're skilled, not become more effective by pausing more."
related: [lex-k5hgu, lex-95hsm]
evokes: ["temporal-features-outweigh-semantic-incongruity", "what-versus-when-in-humor-processing", "timing-as-cognitive-gatekeeper"]
lineage:
  - source: primary
    text: ma-2026-timing-is-everything-temporal-scaffolding-of-humor-temporal-dominance
    citation: "Yuxi Ma, Yongqian Peng, Junchen Lyu, Chi Zhang & Yixin Zhu, 'Timing is Everything: Temporal Scaffolding of Semantic Surprise in Humor' (arXiv:2605.00143, accepted CogSci 2026), Results and Discussion sections. Partial correlations (controlling for performance duration) and top/bottom-20%-vote-rate group comparisons across 828 performances found average pause duration and pause variability carrying large effect sizes (Cohen's d approx. 1.0) against audience vote rate, versus medium-to-small effect sizes for semantic-distance measures (d approx. 0.5 at most)."
    quote: "[Discussion, 'Temporal Dynamics as a Dominant Predictor':] 'Our first finding, that temporal features substantially outperform semantic features, provides initial support for hierarchical organization where temporal dynamics dominate engagement. ... This significant difference in predictive power challenges the predominant focus on semantic content in humor theory. ... temporal structure accounts for substantially more variance in audience responses than semantic incongruity. This asymmetry raises theoretical questions about the relative contributions of “what” versus “when” in humor processing.' [and, on the limits of the design:] 'However, our correlational design cannot determine whether the temporal structure directly causes appreciation or reflects other unmeasured factors. High-performing comedians may differ in confidence, stage presence, or audience rapport - qualities that manifest behaviorally as longer pauses and slower delivery.'"
canonical-instances:
  - "The paper's own group comparisons: average pause duration produced a large effect size against audience vote rate (Cohen's d approx. 0.99, high-performing M=1.39s vs. low-performing M=0.96s) and pause variability an even larger one (d approx. 1.05), while the strongest semantic-distance measure - peak distance - produced only a moderate effect (d approx. 0.50) and average semantic distance a small one (d approx. 0.26)."
critical-questions:
  - "Does 'temporal features predict appreciation better than semantic features' mean timing causes the appreciation, or could both be downstream of a performer's overall skill - the authors explicitly say their correlational design can't separate these, and name confidence, stage presence, and audience rapport as confounds that could produce longer pauses without the pauses themselves doing causal work."
  - "This is one dataset, one language and comedic tradition (Chinese televised stand-up, 2017-2025), and one operationalization of 'semantic surprise' (embedding cosine distance between consecutive ASR-segmented sentences) - does the finding hold for other forms of surprising communication, or only for this specific measurement of it?"
  - "The paper frames this as challenging 'the predominant focus on semantic content in humor theory' - is that a fair characterization of the theories being contrasted, which may already have room for delivery-level factors, or is the contrast sharper in the paper's framing than in the theories themselves?"
status: active
