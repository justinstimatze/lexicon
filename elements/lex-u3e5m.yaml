lineage:
  - source: primary
    tradition: tainter-collapse
    text: tainter-1988-collapse-of-complex-societies
    citation: "Joseph A. Tainter, The Collapse of Complex Societies (Cambridge University Press, 1988), Chapter 4 ('Understanding collapse — the marginal productivity of sociopolitical change')."
    quote: "It is suggested that the increased costs of sociopolitical evolution frequently reach a point of diminishing marginal returns. This is to say that the benefit/investment ratio of sociopolitical complexity follows the marginal product curve […]. After a certain point, increased investments in complexity fail to yield proportionately increasing returns. Marginal returns decline and marginal costs rise. Complexity as a strategy becomes increasingly costly, and yields decreasing marginal benefits."
  - source: primary
    tradition: tainter-collapse
    text: tainter-1988-collapse-of-complex-societies
    citation: "Joseph A. Tainter, The Collapse of Complex Societies (Cambridge University Press, 1988), Chapter 4 — the four-concept framework."
    quote: "Four concepts discussed to this point can lead to an understanding of why complex societies collapse. […] (1) human societies are problem-solving organizations; (2) sociopolitical systems require energy for their maintenance; (3) increased complexity carries with it increased costs per capita; and (4) investment in sociopolitical complexity as a problem-solving response often reaches a point of declining marginal returns."
canonical-instances:
  - Western Roman Empire — Tainter's largest case study; the Western provinces gradually shed imperial overhead over centuries when the marginal returns on Roman administration fell below the cost of taxes + military maintenance. Local elites defected to local sufficiency.
  - Classic Maya collapse — peripheral cities abandoned in cascading order as elite-driven complexity costs exceeded the returns from monumental architecture and administrative overhead.
  - Chacoan / Ancestral Puebloan collapse — abandonment of regional system when long-distance trade and ritual-administrative complexity stopped yielding net benefits.
  - U.S. bureaucratic / R&D / health-care productivity (Tainter cites Machlup 1962, Parkinson 1957) — declining marginal returns on investment in administrative complexity are documented in modern data; the same dynamic Tainter sees in Rome.
  - Software technical-debt accumulation — each architectural layer added to solve a specific bug or scaling issue costs ongoing maintenance; when marginal cost of new features exceeds marginal benefit, teams 'collapse' via rewrites / abandonment / fork-and-strip.
  - Corporate org-chart growth past optimum — each management layer initially solves a coordination problem, but marginal returns decline and the organization either restructures or is outcompeted by leaner competitors.
  - Open-source project bloat — accumulated maintenance burden of edge-case features eventually exceeds the project's ability to keep up; projects fork, simplify, or are abandoned.
  - The 'death of complex configurations' pattern in any rule-based system where each new exception costs more in cognitive overhead than it saves in handled edge cases.
