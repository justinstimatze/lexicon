lineage:
  - source: primary
    text: BhagavadGita-Arnold-II-47-50
    citation: "Bhagavad Gita (श्रीमद्भगवद्गीता; c. 5th-2nd c. BCE composition; redacted within the Mahabharata epic), chapters II.47-50 + III.19 + IV.18-23. Sir Edwin Arnold translation 1885 (*The Song Celestial*; Project Gutenberg). The foundational text articulating karma yoga (कर्म योग) — the path of action — as the discipline of acting for the action's intrinsic right-ness while remaining equanimous about outcomes. Krishna's counsel to Arjuna on the battlefield of Kurukshetra: `Let right deeds be thy motive, not the fruit which comes from them. And live in action! Labour! Make thine acts thy piety, casting all self aside, contemning gain and merit; equable in good or evil.` The framework has been productively extended across Indian philosophical tradition (Vivekananda 1896 *Karma Yoga*; Aurobindo 1923 *Essays on the Gita*; subsequent neo-Vedanta + advaita-tradition extensions); Western contemplative + therapeutic literature (Kabat-Zinn 1990 *Full Catastrophe Living*; Goldstein 2013 *Mindfulness*; Hayes-Wilson-Strosahl 2006 ACT — `committed action` is the canonical ACT term that operationalizes the Gita's nishkama-karma); modern sports psychology + performance research (Csikszentmihalyi 1990 *Flow*; Dweck 2006 *Mindset*; sport-psychology coaching for `next-pitch` and `next-rep` focus); decision theory + behavioral economics (Duke 2018 *Thinking in Bets* + Duke 2020 *How to Decide* on the resulting fallacy + decision-vs-outcome distinction); + the Stoic-Vedantic parallels in Hadot 1995 *Philosophy as a Way of Life* (Marcus Aurelius lex-m8j35 + Epictetus + Seneca all articulate adjacent claims). The atom encodes the transferable structural form — motivate by action-quality, not by outcome-attachment — separately from the Gita's specific religious + metaphysical commitments. Debunking check applied: the Gita's specific theological claims (Krishna as avatar of Vishnu; the soul's immortality; the doctrine of reincarnation; varna-dharma + caste-justification) are NOT central for the atom + are subject to substantial historical + ethical critique (the caste-justification reading is one of the most-contested elements; modern Hindu reformers + critical scholars have addressed this in various ways). The STRUCTURAL CLAIM about acting-for-action-quality vs outcome-attachment is well-attested across modern decision theory, sports psychology, contemplative + therapeutic literature, and creative-work practice — independent of the Gita's specific theology."
    quote: "[Bhagavad Gita II.47-50 (Arnold's *The Song Celestial* tr.), the critical karma-yoga passage:] 'But thou, want not! ask not! Find full reward / Of doing right in right! Let right deeds be / Thy motive, not the fruit which comes from them. / And live in action! Labour! Make thine acts / Thy piety, casting all self aside, / Contemning gain and merit; equable / In good or evil: equability / Is Yog, is piety!' [Corrected 2026-08-19: this entry previously continued with three passages (covering II.48, II.49-50, and III.19) labeled 'standard prose-translation supplement' — not Arnold's wording, not present anywhere in the cited Arnold 1885 text, and no second Gita translation is available in this project's source corpus to attribute them to. Removed as unverifiable rather than replaced; the karma-yoga claim is already fully carried by the verified Arnold quote above.] [Practitioner-extraction for transferable lex-7xz6k: motivate by action-quality + equanimity-in-results. The motivational orientation is on what is in your choice-domain (the action) + relinquishes outcome-attachment. Not indifference — full engagement with equanimity. The atom generalizes from Krishna's battlefield counsel to Arjuna to sports, investment, creative work, parenting, software engineering, AI-safety practice, and any sustained-quality-under-uncertainty domain.]"
  - source: cross-attestation
    text: cross-domain-action-quality-vs-outcome-attachment
    citation: "Cross-domain attestation that the act-for-action-quality-not-outcome-attachment pattern recurs across modern decision theory, sports psychology, contemplative + therapeutic literature, creative-work practice, investment + entrepreneurship, software engineering craft, parenting + caregiving, and AI safety. (a) Decision theory + behavioral economics: Duke 2018 *Thinking in Bets* + Duke 2020 *How to Decide* articulate `the resulting fallacy` — judging the decision by its outcome confounds quality of decision with quality of luck; Klein 2007 pre-mortem (lex-xgyv7 substrate-grounded) + Kahneman + Klein 2009 *Conditions for Intuitive Expertise* document the role of process-discipline in high-uncertainty domains. (b) Sports psychology: Csikszentmihalyi 1990 *Flow*; Dweck 2006 *Mindset* on process-focus + growth-orientation; explicit coaching for `next-pitch` and `next-rep` focus; Beilock 2010 *Choke* on outcome-focus degrading performance under pressure. (c) Contemplative + therapeutic literature: Kabat-Zinn 1990 *Full Catastrophe Living*; Goldstein 2013 *Mindfulness*; Hayes-Wilson-Strosahl 2006 *Acceptance and Commitment Therapy* — `committed action` is the canonical ACT term operationalizing nishkama-karma; Harris 2006 *The Happiness Trap*. (d) Creative-work practice: Pressfield 2002 *The War of Art*; Cameron 1992 *The Artist's Way*; Tharp 2003 *The Creative Habit* — daily-practice-discipline regardless of muse or reception. (e) Investment + entrepreneurship: Graham 1949 *The Intelligent Investor* (lex-eb3wf substrate-grounded) — focus on process-discipline + margin-of-safety regardless of immediate price movement; Buffett's documented practice; Druckenmiller + Soros + Dalio in various reflective writings + interviews. (f) Software engineering craft: Hunt-Thomas 1999 *The Pragmatic Programmer*; Martin 2008 *Clean Code*; Hickey 2013 `Simple Made Easy` — write the code right because right code is its own reward, not because of guaranteed downstream success. (g) Parenting + caregiving: Tronto 1993 *Moral Boundaries*; Kittay 1999 *Love's Labor*; modern attachment-secure-parenting literature on acting for the relationship + the child's long-term wellbeing rather than for short-term gratification or specific outcomes. (h) AI safety + alignment: Russell 2019 *Human Compatible* + ongoing literature — practitioners must act with quality on long-term concerns where outcomes are highly stochastic + uncontrolled; the field's structural condition matches Krishna's counsel to Arjuna. (i) Stoic-Vedantic parallels: Hadot 1995 *Philosophy as a Way of Life*; Marcus Aurelius (lex-m8j35 substrate-grounded) + Epictetus + Seneca all articulate adjacent claims about action-quality vs outcome-attachment. The cross-domain attestation establishes the transferable structural form: act-for-action-quality + equanimity-in-results recurs across modern decision theory, sports, contemplative + therapeutic literature, creative-work, investment, software craft, parenting, and AI safety."
    quote: "Across modern decision theory (Duke 2018, Duke 2020, Klein 2007, Kahneman-Klein 2009), sports psychology (Csikszentmihalyi 1990, Dweck 2006, Beilock 2010), contemplative + therapeutic literature (Kabat-Zinn 1990, Goldstein 2013, Hayes-Wilson-Strosahl 2006 ACT, Harris 2006), creative-work practice (Pressfield 2002, Cameron 1992, Tharp 2003), investment + entrepreneurship (Graham 1949 + tradition), software engineering craft (Hunt-Thomas 1999, Martin 2008, Hickey 2013), parenting + caregiving (Tronto 1993, Kittay 1999), and AI safety + alignment (Russell 2019 + ongoing), plus the Stoic-Vedantic parallels (Hadot 1995 + Marcus Aurelius lex-m8j35), the same structural form recurs — act-for-action-quality + equanimity-in-results. The transferable diagnostic: shift the question from `what will happen?` to `what is the right action right now?`; locate motivation in action-quality + equanimity in results."
canonical-instances:
  - "Krishna's canonical counsel to Arjuna (Gita II.47-50): on the battlefield of Kurukshetra, Arjuna is paralyzed by attachment to outcomes (the deaths of kin, the consequences of war). Krishna does NOT counsel withdrawal; he counsels full engagement + equanimity. `Let right deeds be thy motive, not the fruit.` The canonical case of the discipline."
  - "The resulting fallacy (Duke 2018 *Thinking in Bets*): a poker hand played correctly may lose; a poker hand played terribly may win. Judging the decision by the outcome confounds skill with luck. The remedy is decision-quality focus + acceptance of variance — the modern operationalization of nishkama-karma."
  - "Process-focus in sports (Csikszentmihalyi 1990 *Flow*; Beilock 2010 *Choke*): explicit `next-pitch` and `next-rep` focus is the canonical coaching technique. Outcome-focus during execution degrades execution — the embodied form of Krishna's counsel."
  - "ACT `committed action` (Hayes-Wilson-Strosahl 2006): clients commit to values-based action independent of immediate outcomes. The therapeutic operationalization of nishkama-karma."
  - "Investor discipline (Graham 1949 *The Intelligent Investor* lex-eb3wf substrate-grounded; Buffett practice): focus on process-discipline + margin-of-safety regardless of daily price movement; the daily-temptation-to-react-to-prices is Krishna's `fruit-attachment` at fast cadence."
  - "Creative-work practice (Pressfield 2002; Cameron 1992; Tharp 2003): daily-practice-discipline regardless of muse or immediate reception. Show up; do the work; release attachment to specific work-outcomes."
  - "Software engineering craft (Hunt-Thomas 1999; Martin 2008; Hickey 2013): write the code right because right code is its own reward + supports long-term system health. The craft-orientation is the engineering analog of nishkama-karma."
  - "AI safety + alignment practice (Russell 2019 + ongoing): practitioners act with quality on long-term concerns where outcomes are highly stochastic + uncontrolled. The structural condition matches Krishna's counsel; the field's practitioners increasingly articulate this in equanimity-and-engagement terms."
  - "operationally distinct from lex-8f8jk judge-by-consequential-fruits-not-by-organic-genealogical-roots: lex-8f8jk is about EVALUATION CRITERION (judge by consequences, not by origins). lex-7xz6k is about MOTIVATIONAL ORIENTATION (motivate by action-quality, not by outcomes). They address different questions + compose tensely: judge by fruits AND motivate by action-quality. The synthesis is the practical-wisdom position."
  - "operationally distinct from lex-vkhp7 outcome-knowledge-retroactively-inflates-perceived-prior-probability (Fischhoff hindsight bias): different mechanism. lex-vkhp7 is a perceptual bias about pre-event probability; lex-7xz6k is about motivational orientation."
  - "operationally distinct from lex-7t3wr argument-from-consequences-as-defeasible-recommendation: lex-7t3wr is about consequentialist-reasoning structure as a category of argument. lex-7xz6k is about motivational orientation."
  - "operationally distinct from lex-m8j35 deliberate-perspective-scale-shift (Marcus Aurelius): Aurelius's practice is cognitive scale-shift to put concerns in proportion. lex-7xz6k is about motivational orientation toward action-quality vs outcome. They compose: scale-shift puts outcomes in proportion + nishkama-karma maintains motivation in action-quality."
  - "operationally distinct from lex-v6kmc dichotomy-of-control (Epictetus): Epictetus's distinction is what is + isn't in your control. lex-7xz6k is about motivating attention based on that distinction (motivate by what IS in control: action-quality; equanimous about what ISN'T: outcomes). They compose closely; Stoic + Vedantic parallels well-documented."
  - "operationally distinct from lex-eb3wf Graham margin-of-safety (Graham 1949): Graham is a specific risk-management technique. lex-7xz6k is the general orientation that supports it. They compose: Graham's technique operationalizes part of nishkama-karma for investing."
critical-questions:
  - "Could the atom be misused to argue for indifference + passivity? Yes — and this is the standard misuse of the Gita (sometimes deployed to discourage activism on social-injustice issues). The discipline against this: the atom names FULL ENGAGEMENT + EQUANIMITY, not withdrawal. Krishna does not counsel Arjuna to leave the battle; he counsels Arjuna to enter the battle while detached from outcomes-as-personal-achievements. The misuse is when the equanimity becomes withdrawal from action."
  - "How does the atom apply when outcomes really do matter morally (lives at stake, suffering at stake)? The atom claims the motivational orientation is on action-quality, not that outcomes do not matter. A surgeon performs the surgery to the highest quality; the patient's outcome is determined by quality + uncontrolled factors. The atom counsels equanimity ABOUT uncontrolled outcomes after acting; it does NOT counsel indifference to outcomes as a general matter. Care + concern for outcomes can motivate the level of action-quality the practitioner sustains."
  - "Could the atom be misused to evade responsibility? `I performed quality action; what happened next is not on me.` Yes — and this is a known misuse pattern. The discipline against this: action-quality includes ANTICIPATION OF FORESEEABLE OUTCOMES + ADJUSTMENT WHEN OUTCOMES SIGNAL ERROR. Krishna's counsel is for outcomes that the practitioner cannot control by action-quality alone; it is not a pass on responsibility for foreseeable consequences."
  - "Does the atom conflict with consequentialist ethics? Not necessarily. The atom is about MOTIVATIONAL ORIENTATION; consequentialism is about EVALUATION CRITERION. They can coexist: judge by outcomes (consequentialism); motivate by action-quality (nishkama-karma). A consequentialist may rationally adopt nishkama-karma as a motivation-discipline that achieves better outcomes than outcome-attachment-as-motivation would."
  - "How does the atom apply to AI safety + alignment specifically? AI safety practitioners face long-term + uncertain outcomes; their actions are shaped by quality-of-research + quality-of-deployment-practice + quality-of-governance-engagement, but outcomes depend on many uncontrolled factors. Sustained quality action under these conditions is the field's structural challenge. nishkama-karma is articulated explicitly + implicitly in much of the practitioner-reflective literature."
