lineage:
  - source: primary
    text: hyde-hermes-engineers-a-change-of-venue-to-olympus-for-status
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' on Hermes' theft trial before Apollo and Zeus in the Homeric Hymn to Hermes. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "By my reading, he wants the shift for two reasons, one of which I’ve already mentioned (to have Zeus recognize his paternity). The other is that Hermes wants a change of venue. He’s like a petty criminal who seeks to get his case into federal court so as to increase his status. If he’s going to be a thief, at least he should be charged at the Olympic level. And he gets Apollo unwittingly to help enact the script that leads to this end."
canonical-instances:
  - "A startup founder facing a hostile takedown campaign by an anonymous online critic responds not by quietly settling the dispute privately but by drawing it into a public, formal legal proceeding, calculating that being seen contesting the claim before a court confers more legitimacy than either ignoring it or resolving it out of public view."
  - "A junior employee accused of a policy violation by their direct manager requests that the matter be escalated to a formal HR review rather than handled informally, correctly judging that a documented, higher-level process is more likely to treat their side of the story as credible than an unminuted conversation with a manager who already has a fixed opinion."
critical-questions:
  - "Does this strategy depend on the accused having some independent asset (Hermes' lyre, a founder's public following) that makes them attractive to the higher-status venue, meaning it may not be available to someone with genuinely no leverage to offer once they arrive there?"
  - "Is escalating to a higher venue always a status gain, or does it sometimes backfire by exposing the accused to a harsher, more thorough judgment than the lower venue would ever have applied -- what determines which outcome occurs?"
  - "Does the accuser's own status change the calculation -- would Apollo, a major god, have refused to be drawn into this script if he'd recognized the maneuver, and how would a real-world accuser recognize and refuse a comparable venue-shopping attempt?"
