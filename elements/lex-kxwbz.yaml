id: lex-kxwbz
name: motivation-reshapes-how-punishing-a-circumstance-actually-feels
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A person can claim that their own desire, not the objectively punishing physical conditions around them, is what actually produces their felt discomfort — presenting their mental state as the real driver of subjective experience, overriding what should be an overwhelming physical stimulus. In the Jataka''s tale of Gangamala, the water-carrier says exactly this about the heat he''s walking through: "''Tis these desires that burn, and not the sun: / ''Tis all these pressing tasks that must be done."'
related: []
evokes: [jataka, atthanipata, gangamala-jataka, motivation-modulates-perceived-suffering, mind-over-matter]
lineage:
  - source: primary
    text: jataka-chalmers1895-gangamala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 421, Gangamala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "‘Tis these desires that burn, and not the sun: / ‘Tis all these pressing tasks that must be done."
canonical-instances:
  - "A runner closing out the final mile of a race she's about to win barely registers the pain in her legs. On the identical stretch of the same course, with nothing at stake, she'd have called it unbearable."
critical-questions:
  - "Is the water-carrier's claim a literal description of reduced pain, or a rhetorical reframing that makes his single-minded pursuit sound noble rather than merely stubborn?"
  - "Does motivation actually reduce the physical toll being taken, or only the subjective report of it — and does that distinction matter for someone relying on motivation to push through real harm?"
status: active
