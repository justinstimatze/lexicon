lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The History of Our Time: An Optimist's View' (the Sixth Eleanor Rathbone Memorial Lecture, delivered at the University of Bristol, October 12, 1956), Ch. 19 of Conjectures and Refutations (Routledge Classics, 2002), p.502. Two elisions, both disclosed: a parenthetical aside about the Iron Curtain's own, weaker version of fighting with words, and a sentence on false ideas sometimes spreading further than true ones, are both skipped as tangential to the thesis being quoted."
    quote: "“The war of ideas is a Greek invention. It is one of the most important inventions ever made. Indeed, the possibility of fighting with words instead of fighting with swords is the very basis of our civilization, and especially of all its legal and parliamentary institutions. ... To see how powerful ideas have become since the days of the Greeks, we only need to remember that all religious wars were wars of ideas, and that all revolutions were revolutions of ideas. ... All this may be formulated in my fourth thesis. It is as follows. The power of ideas, and especially of moral and religious ideas, is at least as important as that of physical resources. I am well aware of the fact that some students of politics are strongly opposed to this thesis; that there is an influential school of so-called political realists who declare that ‘ideologies’, as they call them, have little influence upon political reality, and that whatever influence they have must be pernicious. But I do not think that this is a tenable view. Were it true, Christianity would have had no influence on history; and the United States would be inexplicable, or merely the result of a pernicious mistake.”"
canonical-instances:
  - "An analyst reviewing a company's decision to publicly exit a profitable market over stated ethical concerns assumes the real reason must be a hidden financial calculation, since companies don't leave money on the table for principles. The stated principle turns out to have been argued internally for years before it was profitable to act on, and the exit happens well before any material pressure would have forced it -- the idea was doing work the material-interest theory can't account for."
  - "A historian dismisses a volunteer movement's stated commitment to a cause as cover for members' desire for social belonging, treating the ideology as incidental. But the members who left once the organization's actions stopped matching its stated principles, even at real cost to their own social standing, are hard to explain on the belonging-only account -- the idea itself was what a chunk of the membership was actually there for."
critical-questions:
  - "Isn't the safer default still to assume a hidden material motive first, given how often material interest turns out to explain things better than the stated ideology does? Popper's own thesis is a parity claim -- 'at least as important as' -- not a claim that ideas always win. The diagnostic targets a narrower move: dismissing ideas as a whole category without checking whether the specific case in front of you is one where an idea did the causal work. A material-interest explanation still has to survive that same check before it gets credited over the idea."
  - "Christianity's spread also served the material interests of the institutions that spread it -- doesn't that explain the same historical outcome without crediting the idea itself? An institution using a religious idea to serve its material interests still needs that idea genuinely believed by the people spreading and receiving it, or the strategy doesn't work at all. That requirement is itself evidence the idea was doing real causal work rather than merely riding along on interests that would have produced the same outcome regardless. Doesn't the strategy's dependence on genuine belief settle which account is doing the explaining?"
