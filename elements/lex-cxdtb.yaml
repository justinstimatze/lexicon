lineage:
  - source: primary
    text: radin-trickster-unwinds-his-penis-chasing-the-taunting-chipmunk-and-loses-most-of-it
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episodes 38-39. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'My, what an evil one it is who is saying this,' and he jumped towards him. But the one who had been singing ran away, exclaiming, 'Tigi! Tigi! Tigi!' It ran into a hollow tree. It was a chipmunk. 'I will kill you for this, you contemptible thing,' said Trickster. Thereupon he spoke to his penis, 'Now then, my younger brother, you may go after him for he has been annoying you for a long time.' So he took out his penis and probed the hollow tree with it. ... So he unwound more and more of his penis and probed still deeper, yet all to no avail. Finally he took what still remained, emptying the entire box, and probed and probed but still he could not reach the end. 'Ho!' said he impatiently, and suddenly withdrew his penis. Much to his horror, only a small piece of it was left. 'My, what a great injury he has done to me! You contemptible thing I will repay you for this!'"
canonical-instances:
  - "A company founder, stung by a minor negative comment from a small competitor, pours escalating amounts of the company's marketing budget into a retaliatory campaign that keeps expanding scope month after month, ending only when the budget is exhausted and the company is left financially weaker than the competitor's original jab ever threatened to make it."
  - "A person offended by a stranger's rude remark online spends an entire evening and increasing emotional energy trying to 'win' the argument in the comments, escalating the exchange far past the point of any real stakes, and ends up losing sleep, missing other plans, and feeling worse than the original comment ever could have made them feel on its own."
critical-questions:
  - "At what point in the escalation could Trickster have recognized that the cost was outpacing the provocation, and does the story suggest any signal he ignored, or is the danger precisely that there was no clear signal until the withdrawal revealed the damage all at once?"
  - "Is the chipmunk's taunt genuinely trivial, or does its accuracy, correctly narrating exactly what Trickster is carrying and how he's rearranged it, make it a more serious provocation than an ordinary insult, something closer to being surveilled than mocked?"
  - "Would Trickster have stopped earlier if the cost had been visible incrementally rather than revealed only at the end, when he withdrew what was left -- does this pattern depend on the escalating cost being hidden until a single moment of reckoning?"
status: active
