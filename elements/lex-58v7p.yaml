id: lex-58v7p
name: abandon-a-principle-once-it-stops-yielding-the-desired-outcome
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a faction invokes a procedural or seemingly neutral principle to justify a policy, track that principle through a change in circumstance that flips whether its actual mechanical operation delivers or defeats the faction's substantive goal -- if the faction's stated principle survives the flip unchanged, that is a genuine procedural commitment; if instead the faction discards the principle itself and adopts a different, even opposite, procedural doctrine, while the substantive goal stays exactly the same, the original principle was never load-bearing: it was cover for a pre-determined outcome, adopted only for as long as it happened to produce that outcome. Frederick Douglass's 1881 autobiography records the mechanism cleanly in the doctrine of 'popular sovereignty' during the pre-Civil-War contest over Kansas. Southern political leaders backed popular sovereignty -- the principle that the settlers of a territory, not Congress, should decide by vote whether to permit slavery -- for as long as it was expected to deliver a slave Kansas, given the territory's proximity to slave-state Missouri and the initial balance of settlement. When free-state settlers won the vote and Kansas became a free state despite the doctrine's own procedure, Douglass records the reversal exactly: 'the doctrine of popular sovereignty... failed to make Kansas a slave State, and could not be safely trusted in other emergencies, southern statesmen promptly abandoned and reprobated that doctrine, and took what they considered firmer ground. They lost faith in the rights, powers, and wisdom of the people and took refuge in the Constitution. Henceforth the favorite doctrine of the South was that the people of a territory had no voice in the matter of slavery whatever' -- the new doctrine held that the Constitution itself, without any territorial legislation, carried slavery into every territory automatically, regardless of what the settlers voted. The tell is precise: the SUBSTANTIVE GOAL (slavery must expand into new territories) stayed fixed across the whole episode; the PROCEDURAL PRINCIPLE invoked to justify that goal flipped to its near-opposite (from 'let the people decide' to 'the people have no say') the moment the first principle's own honest operation produced the wrong answer. A faction that actually believed in popular sovereignty as a value would have accepted Kansas's free-state vote as the doctrine working correctly; instead the doctrine was dropped the instant it stopped serving. Portable beyond antebellum politics: a company that justifies a hiring freeze by appeal to 'we go by objective performance metrics, not seniority' and then, when the metrics favor retaining a senior employee it wants to cut, switches without acknowledgment to 'we need to make room for succession planning' -- the substantive goal (removing that employee) stayed fixed while the justifying principle flipped; a regulatory body that champions 'let the market decide' deregulation until the market decides against the outcome the body's sponsors wanted, at which point the body discovers a newly urgent need for intervention. Diagnostic: don't evaluate a faction's invoked principle by whether it sounds neutral or procedurally fair in isolation -- track it across at least one case where its honest operation cuts against the faction's own preferred outcome. A principle that is abandoned, redefined, or quietly exempted the moment it does so was never the actual operative reason; the actual reason is whatever stayed constant."
related: [lex-czseb, lex-p5m5u, lex-rcj6y, lex-sjwcq, lex-x4zqg, lex-xm754]
scaffolds-from: [lex-rcj6y]
evokes: [popular-sovereignty-abandoned, took-refuge-in-the-constitution, lost-faith-in-the-wisdom-of-the-people, doctrine-that-served-until-it-didnt, firmer-ground-after-the-flip]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-popular-sovereignty-reversal
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (Hartford: Park Publishing Co., 1881), Chapter IX, 'Increasing Demands of the Slave Power' -- Douglass's third and final autobiography. Recounts the South's abandonment of the popular-sovereignty doctrine (territorial settlers vote on slavery) once it failed to secure Kansas as a slave state, in favor of a constitutional doctrine holding slavery automatically protected in all territories regardless of the settlers' vote."
    quote: "When it was found that the doctrine of popular sovereignty... failed to make Kansas a slave State, and could not be safely trusted in other emergencies, southern statesmen promptly abandoned and reprobated that doctrine, and took what they considered firmer ground. They lost faith in the rights, powers, and wisdom of the people and took refuge in the Constitution. Henceforth the favorite doctrine of the South was that the people of a territory had no voice in the matter of slavery whatever."
canonical-instances:
  - "The direct textual anchor: southern political leaders champion 'popular sovereignty' for Kansas territory while expecting it to produce a slave state; once free-state settlers win the vote, the doctrine is abandoned wholesale for its near-opposite -- that territorial settlers have no voice at all and the Constitution protects slavery automatically -- while the substantive goal (slavery's expansion) never changes."
  - "A company justifies a hiring freeze by 'we go by objective performance metrics, not seniority,' then, when the metrics favor retaining a senior employee it wants to cut, switches without acknowledgment to 'we need to make room for succession planning' -- the substantive goal (removing that employee) stays fixed while the justifying principle flips."
  - "A regulatory body champions 'let the market decide' deregulation until the market decides against the outcome its sponsors wanted, at which point the body discovers a newly urgent need for targeted intervention -- the deregulatory principle survives only as long as it delivers the preferred substantive result."
critical-questions:
  - "isn't this just lex-rcj6y (motivated-reasoning)? No -- motivated-reasoning is a general psychological claim about how a person's desired conclusion biases their evaluation of evidence, applicable to a single reasoner in the moment. This atom is a specific DIAGNOSTIC TEST applicable to a faction's public justificatory doctrine over time: track the SAME invoked principle across a circumstance-flip that changes whether it serves the goal, and check whether the principle itself, not just its application, gets discarded. It is falsifiable in a way generic motivated-reasoning is not -- it requires finding the actual flip-point and the actual doctrine-swap."
  - "isn't this the same as lex-p5m5u (itemize-claimed-symmetric-arrangement-to-expose-asymmetric-benefit), from the same book and chapter cluster? No -- lex-p5m5u audits a SINGLE claimed arrangement by breaking it into line items to check who benefits from each. This atom tracks a PRINCIPLE ACROSS TIME through a change in circumstance to check whether the principle itself survives when it stops serving its invoker's goal. lex-p5m5u is a snapshot itemization; this atom is a longitudinal track-the-flip-point test. Both are audit techniques for exposing a claim's real function, but they operate on different objects (a static arrangement vs. a principle's persistence over a changing circumstance)."
  - "isn't this the same as lex-xm754 (motte-and-bailey-retreat-to-defensible-claim-then-treat-defense-as-vindication)? No -- motte-and-bailey is a single-conversation rhetorical move: retreat under pressure to a weaker version of the SAME claim, then treat successfully defending the weaker version as vindicating the stronger one. This atom involves no retreat to a weaker version of the same claim; it involves OUTRIGHT REPLACEMENT of one procedural doctrine with a substantively different, often opposite, one, driven by a change in whether the original doctrine still serves the goal -- there is no motte being defended, only a bailey being swapped for a new bailey."
  - "does this atom claim the invoker was consciously insincere the whole time? No. The test is BEHAVIORAL, not a claim about subjective intent -- it identifies that the principle was not, in fact, operative regardless of whether the invoker consciously knew it. A faction could sincerely believe its principle at each moment and still exhibit this pattern; the diagnostic value is in what the pattern reveals about which commitment (the stated principle, or the substantive goal) was actually doing the work, independent of what anyone believed about their own motives."
