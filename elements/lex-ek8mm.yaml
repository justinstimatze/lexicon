id: lex-ek8mm
name: pressure-differential-exploits-every-unsealed-gap-not-just-the-designed-ports
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a system moves a resource under pressure (air pushed by a duct fan, water pushed through a supply line, or any other flow driven by a pressure difference against its surroundings), don't assume the resource only travels through the inlets and outlets it was designed to use. Any pressure differential between the system and its surroundings pushes or pulls through every unsealed gap in the system's boundary, and the consequence shows up at the gap, often far from and unconnected-looking to the actual source of the pressure. The Complete Do-It-Yourself Manual documents two independent instances of the same underlying physics: a forced-air duct system creates pressure differences throughout a house that draw outside air in, force air out, or pull air in through ordinary cracks in walls and framing that have nothing to do with the ductwork itself, wasting heating and cooling energy at points that look unrelated to the ducts; and a water-supply line running low from a heavy draw elsewhere in the house can develop enough of a vacuum to siphon contaminated water backward through an ordinary faucet spout or a garden hose end sitting in dirty water -- a point never designed to be an inlet at all. Diagnostic move: when troubleshooting an unexplained loss (energy, pressure, product, or a contamination source with no obvious point of entry) in any pressurized or vacuum-driven system, don't focus effort on the main designed pathway -- audit the entire boundary for unsealed gaps, since the pressure differential doesn't care which opening was intended and will use whichever one is weakest. The fix is the same in both directions: seal or one-way-protect every point of contact with the outside, not just the main line."
related: [lex-3hw32]
evokes: [cross-connection-backflow, duct-pressure-imbalance, unsealed-boundary-gap, vacuum-siphon, complete-do-it-yourself-manual, pressure-finds-the-weakest-point]
lineage:
  - source: primary
    text: handyman-2014-duct-pressure-differences-waste-heat
    citation: "The Complete Do-It-Yourself Manual (Newtown, CT: The Editors of Handyman Media / Reader's Digest, 2014), section on forced-air heating systems."
    quote: "'Homes with ductwork can leak noticeably more air and require more heating and cooling energy than homes without ductwork. The reason is that forced air creates pressure differences within the house that can draw in outside air, force air out through cracks in the house or pull outside air in through cracks in the house, all of which waste heat.'"
  - source: primary
    text: handyman-2014-cross-connection-siphons-contamination
    citation: "The Complete Do-It-Yourself Manual, same edition, section on water-supply systems, 'Preventing Cross-Connections.'"
    quote: "'A cross-connection occurs when water that should go into a pool, DWV system or other location gets into the supply system, where it pollutes the drinking water. This happens when a vacuum is created from a heavy draw elsewhere in the house and another part of the water supply, such as the nose of a faucet or a water hose sitting in dirty water, siphons water into the supply system.'"
canonical-instances:
  - "The same manual's water-hammer entry is the same physics at a different timescale rather than a separate mechanism: 'The energy of flowing water has to go somewhere, and when a valve is shut off, the pipes can flex and hammer against anything close.' A sudden pressure spike, like a sustained pressure differential, finds and stresses whatever's weakest in its path (a loose pipe, a soldered joint) rather than staying contained to the valve where the shutoff happened."
  - "Hypothetical: a data pipeline runs a service at unusually high read throughput against a shared database, and an unrelated, seemingly stable batch job three services away starts timing out. Nobody touched the batch job's code or its own database calls. The high-throughput service didn't create a new failure in the batch job directly -- it created a resource-pressure differential (connection pool exhaustion) that the batch job's own retry logic, the weakest unprotected point in that shared boundary, absorbed as user-visible failure."
  - "operationally distinct from lex-4nnut (containment-measure-becomes-the-vehicle-of-the-betrayal-it-guarded-against): that atom requires an intentional adversary who deliberately repurposes a security or containment mechanism to smuggle in the very threat it excludes -- the mechanism is real, and someone's intent turns it against its purpose. This atom describes a purely physical, non-agentic consequence of any pressure differential: no one repurposes anything, no adversary is required, and the failure occurs the moment an unsealed gap and a pressure difference coexist, whether or not anyone is trying to exploit it."
critical-questions:
  - "Both worked examples involve a fluid (air, water) moving through a physical boundary -- how directly does 'pressure differential' as a causal mechanism transfer to non-fluid systems (a shared database connection pool, a rate-limited API), where the analogous 'gap' (an unbounded retry loop, an unmonitored dependency) has to be identified by analogy rather than measured directly? Does the diagnostic value survive that translation, or does it become a looser metaphor once you leave literal fluid systems?"
  - "The fix proposed -- seal or one-way-protect every boundary point rather than the main pathway -- assumes the full boundary can be enumerated and inspected. In a system too large or too poorly documented to audit completely (an old house with unknown wall cavities, a legacy codebase with undocumented integrations), how does this diagnostic move avoid becoming an unbounded search, and is there a way to prioritize which boundary points to check first?"
status: active
