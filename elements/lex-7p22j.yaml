lineage:
  - source: primary
    text: montaigne-1580-essays
    citation: "Michel de Montaigne, *Essays*, trans. Charles Cotton (1685; essays originally published 1580-1595), 'To the Reader.'"
    quote: "'READER, thou hast here an honest book; it doth at the outset forewarn thee that, in contriving the same, I have proposed to myself no other than a domestic and private end: I have had no consideration at all either to thy service or to my glory. My powers are not capable of any such design. I have dedicated it to the particular commodity of my kinsfolk and friends, so that, having lost me (which they must do shortly), they may therein recover some traits of my conditions and humours, and by that means preserve more whole, and more life-like, the knowledge they had of me. Had my intention been to seek the world's favour, I should surely have adorned myself with borrowed beauties: I desire therein to be viewed as I appear in mine own genuine, simple, and ordinary manner, without study and artifice: for it is myself I paint. My defects are therein to be read to the life, and any imperfections and my natural form, so far as public reverence hath permitted me. If I had lived among those nations, which (they say) yet dwell under the sweet liberty of nature's primitive laws, I assure thee I would most willingly have painted myself quite fully and quite naked. Thus, reader, myself am the matter of my book: there's no reason thou shouldst employ thy leisure about so frivolous and vain a subject. Therefore farewell.'"
  - source: discovery-loop
    text: distinctness-audit-montaigne-self-as-subject-matter
    citation: "Lex-0474 (Berlin, hedgehog-one-big-thing-versus-fox-many-things-cognitive-style) mentions Montaigne only as one of Berlin's named 'fox' exemplars in his classification essay — a passing reference to Montaigne's temperament, not a grounding of Montaigne's own self-as-subject method. The rest of the substrate's psychological-introspection, Foucauldian confession-as-power-technique, and narrative-identity material addresses adjacent but distinct territory: none names the specific claim of taking one's own ordinary self as literary subject matter in explicit renunciation of persuasion or reputation. This atom grounds a genuine, previously-unmined gap for that specific self-as-honest-subject-matter claim; the related array records the shared Montaigne reference to lex-2rpxq."
canonical-instances:
  - "The 'To the Reader' address itself: Montaigne states his renunciation of glory and persuasion, his narrow intended audience (kinsfolk and friends after his death), and the book's organizing premise in a single short passage — 'Thus, reader, myself am the matter of my book.'"
  - "Montaigne's explicit refusal of flattering self-presentation: 'Had my intention been to seek the world's favour, I should surely have adorned myself with borrowed beauties... My defects are therein to be read to the life.' The accuracy obligation runs specifically to the unflattering and ordinary, not to a curated best self."
  - "The etymological and structural consequence: because the essays argue no external thesis and defend no persona, they can proceed as genuinely open trials of thought ('essai') on whatever occurs to their author, revised and re-annotated across decades — a structural looseness that follows necessarily from the method rather than indicating carelessness."
  - "A modern cross-domain extension responsibly built on Montaigne's method rather than his text: a practitioner's diary study, working notes, or auto-ethnographic account, offered as primary data about a general case rather than as memoir or as a bid for the reader's sympathy — the same self-as-honest-specimen logic transplanted into a research context."
critical-questions:
  - "Is this first-person account functioning as genuine exploratory self-examination — accurate to ordinary experience, defects included, with no thesis to prove or persona to defend — or has a persuasive or reputational aim quietly crept back in, which would disqualify it from this atom regardless of its first-person form?"
  - "Is the account being read as confession (seeking a verdict — absolution, vindication, judgment) or as memoir (narrating events for their own interest), when it is actually doing neither — offering an unflattering specimen of ordinary human nature as data, with no judge and no plot?"
  - "Is the writing's unsystematic, associative structure being mistaken for a defect, when it is in fact the expected and correct consequence of having renounced an external thesis to organize around?"
  - "If this first-person account is being used as evidence or data (in research, in argument, in self-understanding), is it earning that status the way Montaigne's does — through explicit, examined honesty about the ordinary and unflattering — or is it merely first-person in form while still functioning as self-promotion or persuasion?"
