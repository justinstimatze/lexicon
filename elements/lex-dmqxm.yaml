canonical-instances:
  - "A new manager avoids giving critical feedback specifically to combative direct reports while readily engaging agreeable ones; the avoidance tracks not general management confidence but the manager's specific self-rated skill at de-escalating a defensive reaction, and training targeted at that one skill — not generic 'be fair to everyone' coaching — is what actually broadens who they'll engage with directly."
  - "A call-center rep routes angry callers to a supervisor whenever possible while keeping straightforward calls; the avoidance correlates most tightly with the rep's confidence handling live verbal aggression specifically, not with tenure or overall call-handling competence, so training that broadens that one competence reduces routing-avoidance more than tenure alone does."
critical-questions:
  - "Confidence and avoidance are both self-reports collected at the same time; Martin's design cannot rule out that the causal arrow runs the other way — a student who happens not to avoid emotionally-ill patients gets more practice with them and therefore reports higher confidence, rather than confidence causing the willingness. Would an independently-timed PRIOR confidence measure (compare lex-s3c3x's method) predict LATER breadth of preference, or only correlate with it cross-sectionally?"
  - "Is the mechanism competence itself, or the mere belief of competence regardless of accuracy — see lex-szjjd, where self-perceived competence turns out to be uncorrelated with faculty-graded actual competence? If belief alone is doing the work, an intervention that boosts confidence without boosting actual skill (a pep talk, an easy graded win) might reduce preferential avoidance just as effectively as real skill-building would — a very different, and riskier, lever to pull."
