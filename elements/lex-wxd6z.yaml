id: lex-wxd6z
name: withholding-available-retaliation-honors-a-prior-commitment
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When you're capable of instantly ending your own suffering — by force, escape, or retaliation — the moment you're actually under attack is the moment a prior commitment to restraint is tested for real. Deciding in advance not to retaliate costs nothing before any harm arrives — the entire content of the commitment lives in whether it survives contact with the actual attack. In the Jataka's tale of the Naga king Samkhapala, a being with the power to destroy sixteen armed attackers effortlessly has taken on a vow of non-violence to observe a holy day, and lies still on an ant-hill as they approach with stakes. Before they reach him he resolves: \"I will be firm in my resolution and yield myself up to them as a sacrifice, and when they strike me with their javelins and cover me with wounds, I will not open my eyes and regard them with anger.\" As they pierce him in eight places and drag him along by cords threaded through the wounds, \"the Great Being from the moment of his being wounded by the stakes never once opened his eyes nor regarded the men with anger\" — the power to end it sat unused the whole time it was happening."
related: []
evokes: [jataka, cattalisanipata, samkhapala-jataka, commitment-tested-only-under-real-cost, available-power-deliberately-withheld]
lineage:
  - source: primary
    text: jataka-francis1905-samkhapala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XVII (Cattalisanipata), No. 524, Samkhapala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "I will be firm in my resolution and yield myself up to them as a sacrifice, and when they strike me with their javelins and cover me with wounds, I will not open my eyes and regard them with anger. ... The Great Being from the moment of his being wounded by the stakes never once opened his eyes nor regarded the men with anger."
canonical-instances:
  - "A negotiator who has committed their side to a no-walkout policy sits through hours of the counterparty's bad-faith stalling and personal insults, with full authority to end the session at any point and no real cost to doing so, and stays at the table anyway because leaving under provocation is exactly what the commitment was made to prevent."
  - "A whistleblower who has publicly committed to pursuing only the formal review process, not retaliation in kind, watches the person who wronged them get promoted during the investigation. They have real leverage — private information that would end the promotion instantly — and it stays unused, because deploying it now is precisely what the earlier commitment was made against."
critical-questions:
  - "The tale frames the restraint as purely a matter of will, but does the Naga king's supernatural invulnerability to lasting harm make the withholding easier than it would be for someone whose retaliation-avoidance genuinely risked permanent damage or death — does the pattern hold when the cost of restraint is not fully recoverable?"
  - "Is there a point past which withholding available retaliation stops being commitment and becomes something closer to permitting ongoing harm to continue unchecked — does the tale's framing of this as pure virtue avoid that question because the torture happens to end on its own?"
status: active
