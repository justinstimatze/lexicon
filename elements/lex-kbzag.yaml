id: lex-kbzag
name: assuming-the-test-rewards-wealth-when-it-measures-effort
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a gatekeeper sets a demanding test, don't assume the test rewards the currency you happen to have the most of -- three suitors who competed on wealth all failed an identical test because they never questioned whether wealth was what it measured. In Cushing's telling, three young men approach the maiden of Mátsaki each convinced that a bigger bundle of presents is the winning move, and one, 'a young man who had everything, made a bundle of presents as large as he could carry; but it did him no good. He, too, ran away from the may-flies and gnats and mosquitoes.' All three fail the identical corn-hoeing test, driven off by the same swarm of insects, because the test was never measuring bundle size at all. Only the fourth suitor, poor and bringing a small bundle, correctly reads what's actually being measured: 'I do not wonder that she asks hard tasks of her lovers; for it is not of their bundles that she thinks, but of themselves.' He succeeds not by outcompeting the others in the currency they were all optimizing, but by recognizing early that the test measured something else entirely -- sustained effort under real hardship -- and preparing specifically for that instead. Diagnostic move: before investing more heavily in whatever currency you already have in abundance to clear a demanding gate, ask directly what the gate is actually built to measure -- a test that looks like it rewards resources, credentials, or scale may in fact be filtering for something orthogonal, and repeated failure by well-resourced candidates competing on the wrong axis is itself the evidence that the axis is wrong."
