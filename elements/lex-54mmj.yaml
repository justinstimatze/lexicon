    quote: "All four of you have seen the tree. Only when the charioteer showed you the tree, you did not ask him 'What is the tree like at such a time?' or 'at such another time?' You made no distinctions, and that is the reason of your mistake."
canonical-instances:
  - "Four analysts who each pulled a company's stock performance from a different quarter argue heatedly over whether the company is thriving or failing, until someone points out that none of them specified which quarter they were describing, and the full year's data shows all four snapshots were accurate for their own moment."
critical-questions:
  - "Is this really a failure to ask about timing specifically, or a more general failure to check whether the object under discussion is even stable across the dimension being sampled — would the same trap occur with any object that changes across some axis nobody thought to specify?"
  - "How would the four princes have known in advance that timing was the relevant variable to ask about, given that for many other objects a single sample genuinely would be representative of the whole — what tips someone off that a Judas tree, specifically, needed this caveat?"
