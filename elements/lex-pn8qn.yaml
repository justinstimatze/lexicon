lineage:
  - source: primary
    text: Serano-2007-WhippingGirl
    citation: "Julia Serano, *Whipping Girl: A Transsexual Woman on Sexism and the Scapegoating of Femininity* (Seal Press 2007), Ch.1 `Trans Woman Manifesto` + Ch.13 `Dismantling Cissexual Privilege`. Serano coins `trans-misogyny` as the specific compound stigma targeting trans women, distinct from transphobia-plus-misogyny acting additively. The transferable contribution beyond the trans-specific case: ASYMMETRIC stigma attaches to category-crossing as a function of DIRECTION. In a hierarchy whose participants treat the top-position as obviously-superior, voluntary down-crossing (member of top-position electing to live as subordinated-position) attracts intense stigma because it `casts a shadow of doubt` over the supposed-superiority of the top-position. Reverse crossings (subordinated → privileged) are not similarly stigmatized; they are typically read as aspirational. Serano operationalizes this via dozens of attested cases — media depiction patterns, organizational-exclusion patterns (women's events admitting trans men but not trans women), psychiatric-diagnosis patterns (transvestic fetishism diagnosed in men wearing women's clothing but not the reverse), and violence patterns (sexual assault concentrated against trans women specifically). The atom lex-pn8qn lifts the directional-asymmetry claim into its transferable form — applicable wherever a hierarchy generates asymmetric stigma for category-crossing direction, not just gender. Note on caveat-author care: Serano is a primary practitioner (musician + biologist + activist) writing from her own positioned experience; the trans-misogyny framework is not on the debunked-frameworks list and has been productively extended by subsequent scholarship (Stryker 2017; Spade 2015). The claim is well-attested across multiple modalities (linguistic, organizational, psychiatric, behavioral)."
    quote: "[Serano 2007 Ch.1 `Trans Woman Manifesto` pp.14-15, the indispensable passage:] 'When the majority of jokes made at the expense of trans people center on \"men wearing dresses\" or \"men who want their penises cut off,\" that is not transphobia—it is trans-misogyny. When the majority of violence and sexual assaults committed against trans people is directed at trans women, that is not transphobia—it is trans-misogyny. When it's okay for women to wear \"men's\" clothing, but when men who wear \"women's\" clothing can be diagnosed with the psychological disorder transvestic fetishism, that is not transphobia—it is trans-misogyny. When women's or lesbian organizations and events open their doors to trans men but not trans women, that is not transphobia—it is trans-misogyny.' [Serano 2007 Ch.1 p.15, naming the structural mechanism:] 'In a male-centered gender hierarchy, where it is assumed that men are better than women and that masculinity is superior to femininity, there is no greater perceived threat than the existence of trans women, who despite being born male and inheriting male privilege \"choose\" to be female instead. By embracing our own femaleness and femininity, we, in a sense, cast a shadow of doubt over the supposed supremacy of maleness and masculinity. In order to lessen the threat we pose to the male-centered gender hierarchy, our culture (primarily via the media) uses every tactic in its arsenal of traditional sexism to dismiss us.' [Practitioner-extraction for transferable lex-pn8qn: the structural mechanism — voluntary down-crossing of a status hierarchy attracts compound stigma because it casts doubt on the supposed superiority of the top-position — generalizes beyond gender to ANY status hierarchy whose top-position is defended as obviously-superior. The directional asymmetry is the transferable signature.]"
  - source: cross-attestation
    text: cross-domain-directional-asymmetry-of-status-crossing-stigma
    citation: "Cross-domain attestation of the directional-asymmetry pattern outside the trans-specific case. (a) Class-crossing: downward class-crossing (`class traitor,` `slumming,` `selling out in reverse`) attracts specific stigma from the class-of-origin AND distrust from the class-of-destination; upward class-crossing (`social climber,` `nouveau riche`) attracts envy + judgment but along a structurally-different axis (Bourdieu 1979 *Distinction* documents both directions, with the down-crossing stigma more thoroughly developed). (b) Race + culture-crossing: White-Americans-adopting-Black-cultural-markers attract specific stigma (`wigger`) distinct from Black-Americans-adopting-white-presentation (`code-switching,` `assimilation` — which is differently-coded but not the same compound). The asymmetry tracks who is defending which supposed-superiority. (c) Effeminate gay men in patriarchal contexts attract specific compound stigma distinct from masculine lesbian women (Halberstam 1998 *Female Masculinity* documents the latter; Bersani 1987 *Is the Rectum a Grave* + Mowlabocus 2010 on the former — the directional asymmetry tracks male-supremacy). (d) Ability-crossing: people simulating disability (`Munchausen` discourse, `fakers,` disability-cosplay) attract specific stigma + suspicion that does NOT mirror the stigma directed at disabled people performing ability (overcoming-disability narratives, `inspiration porn` — Stella Young 2014). The asymmetry tracks able-bodied supremacy. (e) Citizenship-crossing: residents-of-rich-country emigrating to poor-country (`expat downsizing,` `gone native,` `lost their way`) attract structurally-different commentary than residents-of-poor-country emigrating to rich-country (`immigrant`-coded, often hostile). The asymmetry tracks national hierarchy. (f) Gender-role-crossing (within cis populations): men taking traditionally-feminine roles (stay-at-home dad, nursing, primary-school teaching) attract specific cultural commentary that does NOT mirror women taking traditionally-masculine roles (the latter is `lean-in` coded; the former is `house-husband` coded with persistent emasculation framing). The transferable structural form: in any hierarchy whose participants defend the top-position as obviously-superior, voluntary down-crossing attracts compound stigma because the crossing itself contradicts the supposed-superiority claim. Reverse crossings (up) attract different stigmas tracking different mechanisms (envy, suspicion-of-passing, gatekeeping)."
    quote: "Across class, race+culture, sexual orientation, ability, citizenship, and gender-role hierarchies, voluntary down-crossing attracts compound stigma distinct in mechanism + magnitude from up-crossing. The asymmetry is structural — it tracks which direction CONTRADICTS the supposed-superiority claim of the top-position. The transferable diagnostic: name the hierarchy, name which position is defended as obviously-superior, observe which direction of crossing produces compound stigma + which produces aspirational-reading. The non-symmetric pattern is the crucial structural signature; the trans-misogyny case is the canonical-instance Serano operationalizes."
canonical-instances:
  - "Trans-misogyny (Serano 2007 canonical case): trans women attract systematically harsher stigma than trans men. Concentrated in media depiction (`men wearing dresses` jokes), violence patterns (sexual assault disproportionately directed at trans women), psychiatric diagnosis asymmetry (transvestic fetishism diagnosed in men-wearing-women's-clothing but not the reverse), and organizational exclusion (women's events admitting trans men but not trans women). Serano's mechanism: voluntary down-crossing of the male-supremacist gender hierarchy contradicts the supposed-superiority of maleness."
  - "Effeminate gay men in patriarchal contexts (Bersani 1987 + Mowlabocus 2010): attract distinct compound stigma not mirrored against masculine lesbians. Same mechanism — voluntary down-crossing of the male-supremacist hierarchy."
  - "Downward class-crossing (Bourdieu 1979 *Distinction*): `class traitor` + `slumming` patterns attract specific stigma + suspicion from class-of-origin distinct from `social climber` + `nouveau riche` patterns directed at upward crossers. The asymmetry tracks defended class-superiority."
  - "Race + culture-crossing: white-Americans adopting Black cultural markers (`wigger` and adjacent terms) attract specific stigma not symmetric with Black-Americans adopting white-presentation (`code-switching` / `assimilation` — different mechanism, different stakes). The asymmetry tracks white-supremacist hierarchy."
  - "Ability-crossing: people simulating disability attract specific suspicion (`Munchausen` / `fakers`) that does not mirror stigma against disabled people performing ability. Stella Young 2014 names the asymmetry from the other direction (`inspiration porn` framing of disabled performing ability)."
  - "Citizenship-crossing: residents-of-rich-country emigrating to poor-country attract `expat` / `gone native` / `lost their way` framing distinct from residents-of-poor-country emigrating to rich-country (`immigrant` coded, often hostile). The asymmetry tracks national hierarchy."
  - "Gender-role-crossing within cis populations: stay-at-home dads, male nurses, male primary-school teachers attract persistent emasculation framing that does not mirror women-in-traditionally-male-roles (the latter is `lean-in` coded). Same male-supremacist mechanism as Serano's trans case but operating within cis populations."
  - "operationally distinct from lex-t7xcp common-oppression-claim-erases-intra-group-stratification: lex-t7xcp is about within-group erasure when privileged sub-positions claim collective oppression. lex-pn8qn is about between-group crossing being asymmetrically stigmatized. Different mechanisms, both feminist-theory contributions."
  - "operationally distinct from lex-5ftak master's-tools-cannot-dismantle-master's-house (Lorde): lex-5ftak is about methodological constraints on liberation work. lex-pn8qn is about empirical asymmetry of stigma directionality. Adjacent feminist primitives, distinct cuts."
  - "operationally distinct from lex-7hdd8 fashion-cycle-elite-novelty-mass-imitation-elite-departure: lex-7hdd8 is about status-marker cycling driven by elite departure when masses imitate. lex-pn8qn is about cross-direction stigma asymmetry. Both involve status-crossing dynamics but different mechanisms."
  - "operationally distinct from lex-f6g8c categories-default-canonical-case-to-the-most-privileged-member: lex-f6g8c is about category-design defaulting to privileged sub-position. lex-pn8qn is about crossing-stigma asymmetry between hierarchies. They compose — when a category's canonical case defaults to privileged member (lex-f6g8c), down-crossing into the category attracts stigma (lex-pn8qn)."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition (Butler performativity): lex-y2tbg is about constitution-of-identity via repeated performance. lex-pn8qn is about asymmetric stigma attaching to direction of category-crossing. Both are foundational gender-theory primitives; they compose (Butler's performativity is the substrate within which Serano's asymmetric stigma operates)."
critical-questions:
  - "Is the supposed-superiority of the top-position cardinal for the stigma, or is the stigma symmetric on both directions of crossing? If both directions attract similar compound stigma, lex-pn8qn doesn't fire; the case is symmetric category-policing. If the down-direction attracts the compound stigma while the up-direction attracts aspirational-reading or different stigmas, lex-pn8qn fires."
  - "Is the hierarchy participants are defending one of the classical hierarchies (gender, race, class, ability, citizenship, sexual orientation, age) or a non-classical hierarchy (cultural prestige, professional standing, fitness, online status)? The atom applies to non-classical hierarchies too — wherever there's a defended top-position, voluntary down-crossing tends to attract compound stigma. Diagnostic in non-classical cases: does the down-crossing pattern attract the same `contradicting the supposed-superiority` framing?"
  - "Does the directional-asymmetry hold cross-culturally, or only within specific cultural contexts? Serano's trans-misogyny case is grounded in male-supremacist contexts; matriarchal or non-binary-recognizing cultures (some Indigenous nations, some Polynesian contexts) may show different patterns. The atom's structural form holds wherever a hierarchy is defended as obviously-superior; the SPECIFIC content of which crossings attract stigma varies with which hierarchy is being defended."
  - "Is the atom mistakable for a `both sides have it bad` claim? No — the atom claims the COMPOUND stigma mechanism is asymmetric, not that one direction has no stigma. Up-crossings attract different stigmas (envy, gatekeeping, suspicion-of-passing) via different mechanisms. The transferable claim is about the directional asymmetry of the compound, not the absence of stigma in one direction."
  - "What is the diagnostic for whether a compound stigma is operating vs. an additive sum of independent stigmas? Serano's operationalization: look for cases where the surface acts are symmetric (a man wearing a dress vs a woman wearing pants) but the stigma is dramatically asymmetric (the former is diagnosed as fetishism, the latter is unremarkable). The asymmetry between similar acts reveals the compound mechanism that simple additive transphobia + misogyny would not produce."
