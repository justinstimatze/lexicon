    quote: "If I make myself cheap, and let him have his way as soon as he has come here, my honour and pride will perish. I must make as though I did not wish it."
canonical-instances:
  - "A candidate who has waited months for a specific job offer plays deliberately hard-to-get during salary negotiations to avoid seeming desperate, and the hiring manager, reading the coldness as genuine disinterest, withdraws the offer and moves to the next candidate."
critical-questions:
  - "Is there a version of this reluctance calibrated well enough to preserve pride without risking the opportunity, or is the overshoot an inherent risk of performing indifference toward something genuinely wanted?"
  - "Does the she-ass's death from regret suggest the pride being protected was never actually worth the cost, or is the story simply illustrating a miscalibration rather than condemning the underlying impulse to protect dignity at all?"
