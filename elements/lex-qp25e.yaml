id: lex-qp25e
name: extrapolate-a-uniform-sample-not-a-compensating-remainder
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When an observed sample uniformly displays some property (injustice, badness, failure) and that finding threatens a cherished belief about the WHOLE population (that justice prevails overall, that the system works, that things balance out), notice the fork between two very different inferences and check which one is actually being made. The sound inductive move: if the observed part is uniformly bad, the unobserved remainder is probably SIMILAR — extrapolate the sample. The unsound move, reached for instead when the sample threatens a valued belief: assume the unobserved remainder must be DIFFERENT, specifically in the opposite direction, so that it compensates and restores the desired global property. Russell's diagnostic is a literal image: a crate of oranges is opened and the whole top layer is found rotten. The scientific inference is 'probably the whole consignment is bad.' The motivated inference — the one that gets reached for when 'justice must prevail in the end' is at stake — is 'the layer underneath must be good, to balance out the bad top layer.' Nothing about a uniformly bad sample makes a compensating good remainder more likely; if anything, a uniform sample is evidence the GENERATING PROCESS itself is not evenhanded, which points toward more of the same, not toward a hidden correction. The tell that distinguishes this from ordinary inductive caution: the compensating-remainder inference is invoked specifically to protect a prior commitment (a future life to redress earthly injustice, a benevolent design behind apparent evil, a system that 'evens out' despite the visible evidence), not derived from any independent evidence about the unobserved region. Ask: is there actual evidence for the compensating remainder, or is its existence being posited SOLELY because the alternative (extrapolating the bad sample) is uncomfortable?"
related: [lex-39muf, lex-t9fs7]
scaffolds-from: [lex-39muf]
evokes: [orange-crate-argument, argument-from-injustice-for-an-afterlife, sample-extrapolation-vs-invented-compensation, motivated-belief-in-cosmic-balance, uniform-sample-as-evidence-of-process-not-luck]
lineage:
  - source: primary
    text: russell-1927-why-i-am-not-a-christian-remedying-of-injustice
    citation: "Bertrand Russell, 'Why I Am Not a Christian' (lecture delivered March 6, 1927, Battersea Town Hall, under the auspices of the South London Branch of the National Secular Society; published by Watts & Co., 1927; also as Little Blue Book No. 1372, Haldeman-Julius Publications, 1929). Public domain. The passage responds to the moral argument that God and an afterlife are needed to 'redress the balance' of earthly injustice."
    quote: "In the part of the universe that we know there is a great injustice, and often the good suffer, and often the wicked prosper... but if you are going to have justice in the universe as a whole you have to suppose a future life to redress the balance of life here on earth... If you looked at the matter from a scientific point of view, you would say... so far as one can argue at all on probabilities one would say that probably this world is a fair sample, and if there is injustice here then the odds are that there is injustice elsewhere also. Supposing you got a crate of oranges that you opened, and you found all the top layer of oranges bad, you would not argue: 'The underneath ones must be good, so as to redress the balance.' You would say: 'Probably the whole lot is a bad consignment.'"
canonical-instances:
  - "the orange-crate case itself: a uniformly bad top layer is evidence of a bad consignment, not evidence of a compensating good layer underneath."
  - "the theological argument-from-injustice: earthly injustice is used to argue for an afterlife that redresses the balance, rather than being taken as evidence that injustice is simply how the observable universe runs."
  - "a due-diligence instance: an auditor samples the first 20 transactions in a ledger and finds every one irregular; the sound inference is that the rest of the ledger is probably also irregular, not that the remaining transactions must be clean to 'average out' the sample."
critical-questions:
  - "how does this differ from lex-39muf (problem-of-induction)? lex-39muf is the general Humean point that no finite sample logically GUARANTEES a generalization about unobserved cases — the turkey fed for 1000 days still cannot deduce it will be fed on day 1001. This atom does not dispute that induction is defeasible; it targets a more specific failure that occurs WITHIN an inductive situation: reaching for a specific, motivated alternative (the compensating remainder) instead of the plain extrapolation, precisely because the plain extrapolation is unwelcome. lex-39muf says induction never proves; this atom says that when induction is set aside, check whether it was set aside for evidence or for comfort."
  - "how does this differ from lex-t9fs7 (confirmation-bias)? Confirmation bias is about how evidence is SOUGHT and WEIGHTED once a hypothesis is held — seeking confirming instances, discounting disconfirming ones. This atom operates AFTER the disconfirming evidence has already arrived undeniably (the top layer is visibly, uniformly bad) — the motivated move is not to deny or discount that evidence but to insulate the cherished global belief from it by inventing a compensating region that has not been observed at all. The two can compose: confirmation bias might prevent the top layer from being sampled thoroughly in the first place; this atom's failure begins only once the bad sample is already accepted as real."
  - "is this atom claiming compensating mechanisms never exist? No — sometimes there is independent evidence for a correction (a company's Q4 numbers genuinely do differ from Q1-Q3 for a known seasonal reason). The atom's diagnostic use is narrow: flag the inference specifically when the compensating remainder's existence is being posited with NO evidence beyond the desirability of the global property it would restore."
severity-tier: info
status: active
