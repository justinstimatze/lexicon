id: lex-32m7f
name: false-ascetic-display-camouflages-ongoing-predation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Faking miraculous hardship builds unearned credibility that a predator can then spend down by exploiting the trust it generates, using the display itself as cover for exploiting the very group it impresses. In the Jataka''s tale of Dhammaddhaja, a crow fakes ascetic austerity — standing on one leg, claiming to live on wind alone — purely to win the flock''s trust before eating their eggs while they forage elsewhere: "Why do you stand on one foot?" "If I put down the other one, the earth could not bear me." "Then why do you stand with your mouth open?" "We eat no other food, we only drink the wind."'
related: [lex-k4zph]
evokes: [jataka, chanipata, dhammaddhaja-jataka, false-ascetic-display-as-camouflage, credibility-built-to-be-spent, matted-locks-and-robe-of-skin]
lineage:
  - source: primary
    text: jataka-chalmers1895-dhammaddhaja-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 384, Dhammaddhaja-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Why do you stand on one foot?\" \"If I put down the other one, [268] the earth could not bear me.\" \"Then why do you stand with your mouth open?\" \"We eat no other food, we only drink the wind;\""
canonical-instances:
  - "A new hire who volunteers for every visible extra-hours initiative and talks constantly about the team's mission uses the trust that builds to quietly pad expense reports nobody thinks to double-check."
  - "A parallel Jataka case shows the same display used to buy initial proximity rather than ongoing camouflage: a predatory man dons matted locks and a leather robe to gain the trust of the animals around his hermitage, turning general social deference to ascetics into a specific tool aimed at one target. The Bodhisatta's own verse names the pattern directly: 'Matted locks and robe of skin / Serve to cloke some secret sin' (The Jataka, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell, Cambridge University Press, 1897, Book IV (Catukkanipata), No. 325, Godha-Jataka)."
critical-questions:
  - "How much of an impressive display has to be fake before it counts as camouflage rather than a genuine, if theatrical, commitment that happens to also build trust?"
  - "Does the group's failure to catch the crow reflect a flaw in their vigilance, or is impressive display simply an effective blind spot for almost any group to have?"
  - "Does the eventual exposure of one false display damage trust in the genuine version of that role generally, meaning the exploited credential's future value is degraded even for those who never abused it?"
status: active
