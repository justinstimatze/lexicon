id: lex-mmxs8
name: democratizing-a-selection-process-can-dismantle-its-protective-filter
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a selection process — a party's presidential nomination, a hiring pipeline, a promotion track — moves from insider control toward a direct majority vote, notice that adding openness and removing a screening function happen in the same motion. Levitsky and Ziblatt name the tension directly: 'These dual imperatives—choosing a popular candidate and keeping out demagogues—may, at times, conflict with each other.' ... 'An overreliance on gatekeeping is, in itself, undemocratic—it can create a world of party bosses who ignore the rank and file and fail to represent the people. But an overreliance on the 'will of the people' can also be dangerous, for it can lead to the election of a demagogue who threatens democracy itself. There is no escape from this tension. There are always trade-offs.' ... 'Binding primaries were certainly more democratic. But might they be too democratic? By placing presidential nominations in the hands of voters, binding primaries weakened parties' gatekeeping function, potentially eliminating the peer review process and opening the door to outsiders.' The reform's popular support isn't evidence the danger was overblown — voters didn't get more extreme after 1968, the layer that had been catching extremists before a vote ever happened simply stopped existing. Before treating a democratization reform as pure gain, name what function the removed layer was actually performing and check whether anything now performs it."
