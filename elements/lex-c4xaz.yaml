id: lex-c4xaz
name: finding-fits-none-of-the-standard-categories-of-legitimate-acquisition
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Simply finding something doesn't fit cleanly into any of the ordinary ways we account for how a person legitimately comes to have something -- earning it through labor, buying it, receiving it as a gift, or taking it by theft -- which is why a genuine, innocent find still triggers a lingering sense of moral unease that none of those other categories would. Hyde makes the gap explicit with Aristotle's example of a farmer who digs up buried treasure: 'He gets the gold not by working for it, not as a present from friend or relation, not by stealing it, not by purchase. We are in a shady area here, and shady language is in order. \"It fell off a truck\" is the American version of the more ancient \"I found it at the crossroads.\"' The unease isn't really about suspecting the finder of secret wrongdoing; it's that the ordinary moral vocabulary for tracking how things move between owners was built around labor, exchange, gift, and theft, and a find is structurally none of these -- nothing was earned, nothing was given, nothing was taken from anyone specific, and yet ownership changed hands anyway. Diagnostic move: when you notice lingering discomfort around an acquisition that was genuinely accidental and harmed no one, check whether the discomfort is actually pointing at some real wrongdoing, or whether it's simply the friction of trying to fit a find into moral categories, earned, given, bought, stolen, that were never built to describe how finding actually works."
