id: lex-rt2yq
name: including-yourself-in-the-accusation-disarms-a-hypocrisy-objection
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A moral critique aimed at social superiors is easy to dismiss as coming from someone claiming the high ground they haven't earned — folding your own guilt into the same accusation removes that objection, since you can't be accused of hypocrisy for a standard you've openly admitted failing yourself. In the Jataka's tale of the pariah in the tree, caught having climbed into the king's garden overnight to steal a mango for his pregnant wife, he watches the king violate proper hierarchy by seating himself above his own teacher — and confronts both without exempting himself: 'O Great King, I am a lost man, and thou a gross fool, and this priest is as one dead.'"
related: []
evokes: [jataka, catukkanipata, chavaka-jataka, self-indictment-precedes-the-critique-of-superiors, admitting-your-own-fault-removes-the-hypocrisy-objection]
lineage:
  - source: primary
    text: jataka-chalmers1895-chavaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 309, Chavaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Then taking hold of a hanging bough, he let himself down from the tree, and stood before these two men and said, \"O Great King, I am a lost man, and thou a gross fool, and this priest is as one dead.\""
canonical-instances:
  - "A junior employee caught after-hours using the office printer for a personal project speaks up in a meeting about senior staff double-booking conference rooms for private use — opening with 'I know I'm not one to talk, given the printer thing' before making the point, which forecloses the obvious deflection."
critical-questions:
  - "Does self-indicting actually change anyone's mind about the substance of the critique, or does it just make the speaker harder to dismiss personally while leaving the underlying behavior of the accused unaddressed?"
  - "Is there a risk that admitting fault this openly invites disproportionate punishment for the speaker's own offense, even though it was incidental to the point being made?"
status: active
