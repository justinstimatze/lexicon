id: lex-4277u
name: an-observed-gap-from-theoretical-optimum-is-ambiguous-between-constraint-and-failure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When theory predicts an actor should invest in a response up to the point where marginal cost equals marginal avoided harm, and the observed response falls short of that point, resist the urge to immediately label the shortfall a policy or market failure. A gap between predicted-optimal and observed behavior is genuinely ambiguous between two very different explanations: the response is already economically optimal and the theory's cost estimate was simply too high, or the response is truly constrained below optimal by a real, addressable failure. The two explanations call for opposite interventions — leaving the gap alone versus actively closing it — and without further evidence isolating the actual cost of the missing response, the observed gap alone cannot tell you which explanation is correct."
related: [lex-7wvdb]
evokes: [adaptation-gap, carleton-hsiang-2016, climate-economics, optimal-vs-observed-gap, theory-versus-observation]
lineage:
  - source: primary
    text: carleton-hsiang-2016-science-social-economic-impacts-climate
    citation: "Tamma A. Carleton and Solomon M. Hsiang, 'Social and economic impacts of climate,' Science 353(6304) (2016), Review Summary/Background section. Verified verbatim against two independent pdftotext extraction passes that converged on identical wording after excising a sidebar box that interleaves mid-word in the raw extraction (the sidebar text 'ON OUR WEBSITE / Read the full article' lands inside the word 'occurred')."
    quote: "Both current and future losses can theoretically be avoided if populations adapt to fully insulate themselves from the climate—why this has not already occurred everywhere remains a critical open question. ... Although some theories suggest these various levels of adaptation ought to be economically optimal, in the sense that costs of additional adaptive actions should exactly balance the benefits of avoided climate-related losses, there is no evidence that allows us to determine how closely observed 'adaptation gaps' reflect optimal investments or constrained suboptimal adaptation that should be addressed through policy."
canonical-instances:
  - "A region experiencing repeated flood damage that hasn't invested in full flood defenses: the gap could mean the region has rationally judged full protection too expensive relative to the damage avoided (already optimal), or it could mean a real market or governance failure (underpriced flood insurance masking true risk, a coordination failure across property owners) is blocking a genuinely worthwhile investment — Carleton and Hsiang's point is that the observed gap by itself doesn't distinguish these."
  - "operationally distinct from lex-7wvdb revealed-vs-reflective-preference divergence: lex-7wvdb is about a single actor's own stated preference diverging from their revealed behavior — a temptation or self-control problem within one decision-maker. This atom is about comparing observed behavior against an external theoretical benchmark (the economically optimal response) with no claim about the actor's own stated preferences at all; the ambiguity here is about whether the actor is already optimizing against the theoretical benchmark, a question entirely separate from any internal conflict between what they want and what they do."
critical-questions:
  - "What additional evidence, beyond the size of the observed gap itself, would actually distinguish 'already optimal' from 'constrained suboptimal' in a specific case? The atom names the ambiguity; resolving it requires independent data on the actual marginal cost of the missing adaptive action, not more scrutiny of the gap's size."
  - "Is the theoretical optimum itself well-specified, or does the claimed benchmark rest on assumptions (a stable climate, known costs) that are shakier than the observed behavior being judged against it? A wrong benchmark can manufacture an apparent gap that isn't really there."
  - "Who benefits from each interpretation being adopted? A policy actor invested in intervention has an incentive to read every gap as a failure calling for action. The reverse incentive runs just as strongly for an actor who wants to avoid intervention altogether. Naming the ambiguity explicitly is itself a check against motivated readings in either direction."
status: active
