id: lex-t9y5p
name: a-false-promise-of-abundance-elsewhere-clears-a-guardian-from-their-post
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "One of the most effective ways to get past a guardian is not to overpower them but to give them a better reason, in their own eyes, to leave voluntarily -- especially a reason framed as generosity toward them. In Radin's Winnebago Trickster cycle, two mothers hesitate to leave their children to gather plums: 'we cannot leave our children alone for they are very disobedient.' Trickster removes the obstacle directly, offering himself as a substitute guardian: 'Sisters, if you wish to go, I will take care of the children for you.' He then makes the lure impossible to walk away from -- unlimited abundance, a clear confirming signal, and an explicit instruction not to second-guess it: 'You cannot really pick them all for they are too plentiful. If, toward evening, as the sun sets, you see the sky red, you will know that the plums are causing it. ... Do not turn back for you will surely find it.' The moment they are gone, the guardianship he volunteered for becomes the access he wanted: 'They started out and as soon as they were out of sight, he killed the children.' The mothers were not tricked into distrusting their instinct to stay; they were given an appealing, self-generated reason to leave that felt like their own good fortune. Diagnostic move: when someone offers to cover your responsibility so you can pursue an unusually generous opportunity elsewhere, especially one that also tells you in advance not to doubt it if things look strange, treat the offer to guard as the more consequential part of the deal than the opportunity itself."
