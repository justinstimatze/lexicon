id: lex-vmqm7
name: disbelieving-a-correct-messenger-costs-as-much-as-the-danger-itself
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When people discount good news because of who's delivering it rather than what it says, they end up paying the same price as if the danger the news resolved were still real. In Cushing's telling, an ugly boy actually drives away a Bear that has been hoarding a mountain's entire food supply, then climbs a rock to announce it: 'hie ye over the mountains, and gather them to your hearts' content, for I have driven the Bear away!' The information is true and verified -- the boy really did it. But 'some, because he was ugly, would not believe it and would not go; and thus were as much hindered from gathering grass-seed and nuts for daily food as if the Bear had been really there.' Their skepticism cost them exactly what the Bear itself would have cost them, a mountain's worth of food they never gathered, and the cause wasn't a flaw in the information, it was a flaw in who was allowed to carry it. Diagnostic move: when you catch yourself discounting a report because of some irrelevant trait of the messenger, ugliness, low status, an unlikely source, calculate the cost of being wrong about your doubt, not just the cost of being wrong about the news -- disbelief that turns out to be mistaken is not free just because it feels like caution."
