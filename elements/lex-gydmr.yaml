id: lex-gydmr
name: legitimate-authority-not-the-acts-structure-separates-retribution-from-revenge
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you need to decide whether a harm-for-harm act is moral or immoral, check who is doing it before you look at what they're doing. Lakoff's moral-accounting analysis: retribution and revenge are the identical operation -- balancing the moral books by returning harm for harm -- and the mechanical logic of the two is indistinguishable. What separates them is entirely whether the actor holds legitimate authority to perform the balancing. A father spanking a child for misbehaving is retribution. A court sentencing a convicted criminal is retribution. A man who takes the law into his own hands and shoots his brother's murderer, doing the exact same kind of harm-for-harm balancing, commits revenge. Nothing about the structure of the punishing act itself tells you which label applies -- the same blow, the same sentence, the same balancing of accounts is virtuous in one case and criminal in the other, purely as a function of the actor's standing. Diagnostic move: when a harm-for-harm act gets called just or unjust, check whether the judgment is actually tracking the act's structure at all, or tracking only whether the actor was already recognized as having the standing to perform it."
related: []
evokes: [george-lakoff, moral-politics-1996, moral-accounting, retribution-versus-revenge, legitimate-authority]
lineage:
  - source: primary
    text: lakoff-1996-retribution-versus-revenge
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 4 'Keeping the Moral Books,' section 'RETRIBUTION.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Actually, ‘retribution’ is limited to cases where the balancing of the moral books is carried out by some legitimate authority. ‘Revenge’ occurs when the same principle is used without legitimate authority. Thus, when a father spanks a child for being naughty, it is retribution, not revenge. When a court sentences a convicted criminal to jail, it is retribution, not revenge. But when a man takes the law into his own hands and shoots his brother’s murderer, that is revenge.”"
canonical-instances:
  - "The direct textual anchor is the lineage quote itself: three cases with the identical harm-for-harm structure (spanking, sentencing, shooting), two called retribution and one called revenge, distinguished only by whether the actor holds recognized authority."
  - "Hypothetical: a homeowner discovers a contractor overcharged him by exactly the amount of a deductible he'd have owed on a warranty claim, and quietly overcharges the contractor's next invoice by the same amount to even the score. A small-claims judge, presented with the same facts and the same dollar figure, orders the contractor to refund that exact amount. The homeowner's move and the judge's order are the identical arithmetic operation. Only the judge's order counts as justice; the homeowner's own private evening-of-the-score is theft, however precisely it matches the math."
critical-questions:
  - "Lakoff treats legitimate authority as a binary switch -- present or absent -- but real authority is often contested: is a given court legitimate, does a given father have the right to strike his child, was a given law itself justly made? If the retribution/revenge label depends entirely on a legitimacy judgment that is itself disputed, does the distinction actually resolve moral disagreements, or does it just relocate the argument from 'was the harm justified' to 'was the authority real'?"
  - "If the same act is retribution when an authority performs it and revenge when an individual performs it, what happens to a case where a recognized authority is unavailable, corrupt, or absent entirely -- a shipwrecked community with no court, an occupied territory with no functioning government? Does the balancing act default to revenge for lack of an authority to authorize it, or does some other principle license it as retribution anyway?"
