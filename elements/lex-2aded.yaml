id: lex-2aded
name: efficiency-gains-get-reinvested-as-growth-not-shrinkage
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a system keeps getting more efficient at its core function but never seems to shrink, get lighter, or get cheaper the way you'd naively expect, check whether every efficiency gain is being captured as MORE capability (speed, power, size, output) rather than as less resource use — because that reinvestment, not any failure of the underlying efficiency law, is usually why the system looks like it's growing even while it's becoming more 'ideal' per unit of function. Altshuller names the underlying tendency as a law: 'The development of all systems proceeds in the direction of increasing the degree of idealness. The ideal technical system is one whose weight, volume and area strive toward zero although its ability to carry on functioning at the same time is not diminished' — and then names the specific reason this doesn't show up as visible shrinkage in most real systems: 'Despite the obviousness of the concept 'ideal technical system' a certain paradox exists; real systems become ever greater in dimensions and weight... This paradox is explained by the fact that the reserves released in improved systems are directed at increasing its size and, most importantly, at raising the working parameters.' His worked case is the automobile: 'The first automobiles reached a speed of 15 to 20kph. If this speed had not increased cars would gradually have appeared which were far lighter and more compact with the same degree of reliability and comfort. However, each improvement in the car... was directed toward increasing the speed of the vehicle and what 'supports' this speed (a powerful braking system, rugged axles, reinforced amortization).' Every gain from a better material, a more efficient engine, or a stronger part didn't shrink the car — it got spent buying more speed, which then demanded heavier supporting systems to handle that speed safely, which offset and then reversed the weight the original gain would have saved. Altshuller's own suggested check for the underlying idealization trend, once this masking effect is accounted for, is to hold the OUTPUT constant and compare: 'In order to see at a glance the growth in the degree of idealness of a car, one needs to compare the modern car with an old record-breaking car which could go at the same speed (over the same distance).' Compared at equal performance rather than equal era, the trend toward lighter, cheaper, more 'ideal' systems reappears clearly. Diagnostic move: when a system's efficiency clearly keeps improving but its size, weight, or cost doesn't visibly shrink, don't conclude the efficiency gains are illusory or that idealization has stalled — check whether each gain has instead been reinvested into raising a performance parameter (which then requires its own supporting overhead), and if so, re-run the comparison holding performance constant across versions rather than comparing versions at their own respective, ever-rising performance levels."
related: [lex-mubyx, lex-ffkmb]
evokes: [law-of-increasing-idealness, idealization-masked-by-growth, automobile-speed-vs-weight-paradox, hold-performance-constant-to-see-the-trend]
lineage:
  - source: primary
    text: altshuller-1984-idealness-paradox
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.7 'The Strategy of Invention,' section 'Laws of Development of Systems.'"
    quote: "'4. The law of increasing the degree of idealness of the system. The development of all systems proceeds in the direction of increasing the degree of idealness. The ideal technical system is one whose weight, volume and area strive toward zero although its ability to carry on functioning at the same time is not diminished. In other words, the ideal system is when there is no system but its functions are preserved and carried out. Despite the obviousness of the concept 'ideal technical system' a certain paradox exists; real systems become ever greater in dimensions and weight. The size and weight of planes, tankers, cars increase. This paradox is explained by the fact that the reserves released in improved systems are directed at increasing its size and, most importantly, at raising the working parameters.'"
  - source: primary
    text: altshuller-1984-car-speed-weight-example
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.7, 'Laws of Development of Systems.'"
    quote: "'The first automobiles reached a speed of 15 to 20kph. If this speed had not increased cars would gradually have appeared which were far lighter and more compact with the same degree of reliability and comfort. However, each improvement in the car (using more reliable materials, raising the coefficient of efficient action of the engine, etc) was directed toward increasing the speed of the vehicle and what 'supports' this speed (a powerful braking system, rugged axles, reinforced amortization). In order to see at a glance the growth in the degree of idealness of a car, one needs to compare the modern car with an old record-breaking car which could go at the same speed (over the same distance). A visible secondary effect (growth in speed, horse power, tonnage, etc) masks the primary process of increasing the degree of idealness of the technical system.'"
canonical-instances:
  - "A software team notices their application's memory footprint keeps growing release over release despite genuine algorithmic efficiency improvements; the improvements were reinvested into supporting more concurrent users and richer features rather than shrinking the footprint at the original feature set — comparing memory-per-user at a FIXED feature set across releases reveals the real efficiency gain the raw footprint number was hiding."
  - "A battery manufacturer's cells don't get visibly smaller or lighter release over release even as energy density genuinely improves, because each density gain gets spent on longer range or more power rather than a smaller pack at the original range — comparing pack size and weight at a FIXED range across generations reveals the real trend."
  - "operationally distinct from lex-mubyx anchor-on-the-ideal-final-result-and-retreat-minimally: that atom is a DESIGN TECHNIQUE for orienting a solution attempt toward a hypothetical zero-cost outcome; this atom is a DIAGNOSTIC for correctly reading a REAL system's historical trend data, explaining why the same underlying idealization law doesn't show up as observable shrinkage without correcting for reinvested performance gains."
critical-questions:
  - "is 'hold performance constant and compare' always a fair correction, or does it sometimes obscure a genuine tradeoff a system's designers made deliberately — could a system's growth reflect a real, considered choice to prioritize capability over compactness rather than an artifact this correction should explain away?"
  - "how would someone identify, for an arbitrary system, which specific performance parameter absorbed a given efficiency gain, when a system might have many candidate parameters (speed, capacity, durability, feature count) that could each plausibly have absorbed it — is there a systematic way to trace where a specific gain actually went?"
  - "does this pattern eventually run out — is there a point where a performance parameter (speed, range, capacity) hits its own hard ceiling, after which further efficiency gains would finally have nowhere left to go except into visible shrinkage, and would that transition be predictable in advance?"
status: active
