id: lex-8tmvh
name: not-acting-can-be-virtue-when-acting-would-require-violence
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone with real power fails to intervene against a threat, that failure to act can be judged as virtuous rather than negligent, if the only available form of intervention would itself have required violence. An old, conservative Winnebago defender of Wakdjunkaga concedes every specific harm attributed to the trickster, then names the one thing that redeems him: 'True it is that because of him men die, that because of him men steal, that because of him men abuse women, that they lie and are lazy and unreliable. Yes, he is responsible for all this. Yet one thing he never did: he never went on the warpath, he never waged war.' Radin draws out why this detail carries so much weight: 'the reference to his not having gone on the warpath is very illuminating. It indicates that, for this particular individual, Wakdjunkaga's failure to help mankind by destroying those who were plaguing it was not a reprehensible thing because it would have meant violence, meant waging war.' The trickster's failure to defend humanity against its enemies isn't excused as an oversight -- it's reframed as evidence of a deeper restraint, since the only defense on offer was war. Diagnostic move: before judging someone's failure to intervene as pure negligence, check what intervention would actually have required -- if the only available form of help was itself violent or destructive, the restraint from acting may be doing real moral work rather than simply representing a missed opportunity to help."
