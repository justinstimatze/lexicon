lineage:
  - source: primary
    text: altshuller-1984-s-field-minimal-technical-system
    citation: "G. S. Altshuller, Creativity as an Exact Science, trans. Anthony Williams (Gordon and Breach, 1984), Ch.2, 'Principles of S-Field Analysis,' section 'The S-Field — the Minimal Technical System.'"
    quote: "'In the solutions to our problems three 'active agents' are present: Substance S1 which has to be changed, processed, converted, discovered, inspected, etc; Substance S2, the 'instrument' by which the necessary action is accomplished; Field F, which provides the energy, force, etc, that is, it guarantees the reaction of S2 on S1 (or their mutual interaction). It is not difficult to note that these three 'active agents' are necessary and sufficient for obtaining the result required in the problem. Of themselves the field or substances can produce no effect. In order to do something with substance S1 one needs an instrument (Substance S2) and energy (Field F)... The two substances and a field can be completely dissimilar, but they are necessary and sufficient for the formation of a minimal technical system which has been given the name S-Field.'"
  - source: primary
    text: altshuller-1984-wood-chip-sorting-completion
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.2, 'Construction and Transformation of S-Fields.'"
    quote: "'The problem consists of removing one form of chip. Hence we are entitled to consider that one substance has been given which should be changed. We complete our S-Field by adding to this substance the 'substance and field' pair. For example, before splitting off the trunks and the branches we apply ferromagnetic particles to the bark, and then, after the chipping process, we employ a magnetic field for the separation. Having reached this point experiments are now redundant: it is known that a magnetic field is capable of dislodging a 'magnetized' bark.'"
canonical-instances:
  - "A team wants to know 'how do we detect when a user is about to churn' and stalls because they're staring only at the user (the bare target) — the fix is to name the missing instrument (a specific behavioral signal that changes measurably before churn, like login-frequency decay) and the missing field (the specific comparison or threshold rule that couples that signal to a churn prediction), rather than continuing to search for a property of the user alone."
  - "A mechanic can't diagnose an intermittent engine fault by staring at the engine (the bare object); adding an instrument (an OBD data logger) with no coupling field (no rule for which logged values would even indicate the fault) is still an incomplete system — the fix requires both the logger AND a specific diagnostic threshold or pattern that lets the logger's readings actually implicate a cause."
  - "operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition: that atom resolves a conflict between two ALREADY-NAMED desired properties of one system; this atom is a completeness check for a DIFFERENT failure mode — a problem that names only a target (or a target and an unconnected field) with no instrument or coupling at all, where there is no contradiction yet because there isn't even a complete mechanism to act on the target in the first place."
critical-questions:
  - "how does someone know which specific substance to introduce as the instrument, or which specific field will couple it to the target — the completion rule says a piece is MISSING, but Altshuller's own worked examples (magnetic powder for wood chips, luminescent tracer for oil leaks) required domain knowledge of which substance responds to which field; does the three-slot framework help generate that domain-specific knowledge, or only diagnose that it's needed?"
  - "can all three slots ever be satisfied and a problem still be unsolved — is completeness (target + instrument + coupling field, all present) sufficient for a working solution, or only necessary, with effectiveness (how WELL the instrument and field are chosen) as a separate question the completeness check doesn't address?"
  - "is there a cost to over-applying this heuristic — forcing every stalled problem into an instrument-plus-field frame even when the actual blocker isn't a missing mediator at all (for instance, a problem stalled by insufficient information, a resource constraint, or an organizational blocker rather than a genuinely missing mechanical link)?"
status: active
