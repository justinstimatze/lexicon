    quote: "'My younger brother, you have always had the reputation of being very clever, would you not tell me where the shore is?' 'I do not know, brother, for I have never seen the shore,' answered the fish. So Trickster went on again. Soon he came across a catfish and, addressing him, said, 'Brother, you have always had the reputation of being clever, do please tell me where the shore is.' 'I do not know,' answered the catfish, 'for I have never been anywhere near it, brother.' ... Finally, quite unexpectedly, he came upon the white fish, a whole school of them, and them he addressed, 'My younger brothers, I know that nothing is unknown to you, perhaps you know where the shore is? If you do, do please tell me, for I, myself, do not know.' 'Why, older brother, the shore is right there, just exactly where you are,' answered the fish. And indeed he could see the shore from where he was swimming!"
canonical-instances:
  - "Someone spends weeks messaging well-credentialed consultants asking how to find clients for their new business, gets vague non-answers from each, and only when a casual acquaintance points out that three of their existing friends have already asked to hire them do they realize the client base they were searching for was already in their own contacts."
  - "A researcher asks a sequence of increasingly senior colleagues where to find a dataset for a project, each of whom says they don't know of one, until a junior teammate mentions that the exact dataset has been sitting in the team's shared drive since before the project started."
critical-questions:
  - "Does asking by reputation actually cause the delay here, or would Trickster have been just as lost asking randomly -- is the story critiquing the specific habit of seeking out reputed experts, or simply illustrating that persistence eventually finds an answer regardless of whom it's asked to?"
  - "Is there a meaningful difference between the earlier fish genuinely not knowing and the white fish knowing, or do all of them have access to the same fact (their own location) and only the white fish thinks to state the obvious rather than searching for a more impressive answer?"
  - "Would Trickster have recognized the shore on his own without being told, if he had simply stopped swimming and looked around, or does the story suggest that even an answer sitting in plain view sometimes requires another party to name it before it becomes visible?"
