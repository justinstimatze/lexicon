id: lex-rjd3p
name: a-unanimity-requirement-turns-one-objector-into-a-veto
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before adopting 'we only act when everyone agrees' as a decision rule, check who actually benefits from that framing -- it isn't neutral between change and the status quo. Sen: “This method is one of supreme conservatism. Even a single person opposing a change can block it altogether no matter what everybody else wants. ... Marie Antoinette's opposition to the First Republic would have saved the monarchy in France, and the world would have seen very little change. Clearly there is something grotesquely unsatisfactory about a social decision rule like this.” A rule requiring unanimity for change is not symmetric between the options: one dissenter, however outnumbered, gets to freeze the outcome outright, and nothing on the majority's side can override that single objection. Diagnostic move: when a body adopts consensus or unanimity as its decision rule, ask what happens to the status quo when exactly one member refuses -- if the answer is 'nothing changes, no matter the numbers on the other side,' the rule stands as a permanent advantage for whoever currently likes things as they are, dressed up as procedural neutrality."
related: [lex-s7qxv]
evokes: [sen-collective-choice-and-social-welfare-chapter-2-unanimity, supreme-conservatism, marie-antoinette-veto-example, consensus-as-status-quo-bias, one-holdout-blocks-everyone]
lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 2 'Unanimity,' Section 2.3 'Consensus as a Basis of Collective Action,' p.72. A footnote-reference numeral sits between 'wants.' and 'Marie Antoinette's' in the source; it is a citation mark, not prose, and is skipped via the elision below."
    quote: "“This method is one of supreme conservatism. Even a single person opposing a change can block it altogether no matter what everybody else wants. ... Marie Antoinette’s opposition to the First Republic would have saved the monarchy in France, and the world would have seen very little change. Clearly there is something grotesquely unsatisfactory about a social decision rule like this.”"
canonical-instances:
  - "Hypothetical: A homeowners' association bylaw requires unanimous board approval for any change to the shared-space rules. One board member who personally dislikes a proposed community garden can freeze the proposal forever, no matter how many other members or residents want it built -- the bylaw only asks whether a single no exists somewhere."
  - "Hypothetical: A standards committee requires every member organization to sign off before a new protocol version ships. A single vendor withholding approval, for reasons that have nothing to do with the protocol's merits, freezes the standard at its current version indefinitely -- the same freeze a hundred objecting vendors would produce."
critical-questions:
  - "Isn't unanimity still the right rule when a decision is irreversible or affects a minority who can't be outvoted -- doesn't protecting them require exactly this kind of veto? Sometimes, and Sen isn't arguing unanimity is never appropriate. The diagnostic is about noticing the asymmetry exists and naming who it favors, not about concluding the rule is always wrong -- a body that wants that protection should adopt unanimity deliberately, not stumble into status-quo bias while believing it chose a neutral procedure."
  - "Doesn't requiring a supermajority for change have the same asymmetry, just with a lower bar -- so is unanimity really a special case worth calling out on its own? The mechanism is the same at any threshold above a simple majority; unanimity is just the limiting case, where the bar sits at one single objector rather than some larger minority. Naming the extreme case makes the general pattern easier to spot at any threshold, including the ones just short of unanimous that don't announce themselves as conservative."
