canonical-instances:
  - "Amazon (Doctorow 2022 + 2023 canonical case): stage 1 — below-cost selling + free Prime shipping; stage 2 — generous marketplace commissions + Kindle/Audible creator deals + content-DRM lock-in; stage 3 — 45%+ junk-fee extraction + $31B 'advertising' business as payola-for-search-ranking + cloning-sellers'-products + MFN clauses preventing lower prices elsewhere. The first 5 screens of 'cat bed' searches are 50%+ ads (per Fowler 2022 *Washington Post*)"
  - "Facebook/Meta (Doctorow 2023 canonical case): stage 1 — showing posts from people you cared about; stage 2 — preferential publisher distribution + audience-capture forcing publishers into the walled garden; stage 3 — boost-or-die pay-to-be-seen for publisher reach + Jedi Blue ad-market collusion + Cambridge Analytica-style data extraction. 'Today, Facebook is terminally enshittified'"
  - "TikTok (Doctorow 2023 canonical case): stage 1 — the For You feed showing what entertained you; stage 2 — manual 'heating' surplus-allocation to influencer creators creating creator-dependence; stage 3 — algorithmic shift toward sponsored content + paid 'boost' fees + commodity-content + sponsored placements. Doctorow's 2023 Pluralistic post documents the in-progress trajectory"
  - "Twitter post-Musk (2022-): the most compressed enshittification cycle observed empirically. API shutoffs killing third-party-client ecosystem; verified-checkmark monetization shifting credibility-signal to wealth-signal; algorithmic suppression of external links + boost of Musk-replies; ad density increase + ban-evasion-lifted policy enabling spam. Full 3-stage transit in roughly 18 months"
  - "Reddit post-API shutoff (2023): the platform monetization move ending Apollo/RIF/Sync third-party clients + forcing users into the official ad-dense app + opening IPO-pathway extraction. The mod-tools-for-third-party-apps issue + the protest blackout-of-major-subreddits made the stage-2-to-stage-3 transition unusually visible"
  - "Netflix post-password-sharing-crackdown (2023): the subscription-model enshittification — once users locked in by content-library-size, addition of password-sharing fees + ad-tier with cheaper subscriptions + price-tier differentiation. Demonstrates that subscription models (lex-994yb access-fee recovery channel) are not enshittification-immune; the trajectory applies to any platform with sufficient user lock-in"
  - "Google Search degradation (Bermes et al. 2023 'Is Google Getting Worse?'): empirical demonstration of stage-3-like decline in result quality on commercial queries, attributed to SEO-spam-optimization-of-the-algorithm + AdWords-prominence-displacing-organic-results. Google's position as the universal-discovery-layer makes the enshittification societally significant beyond the platform-specific case"
  - "Uber/Lyft post-IPO (2019-): the gig-economy-platform application — stage 1 was VC-subsidized cheap rides for users + decent earnings for drivers; stage 2 saw driver-side surplus claimed back via per-trip-pay reductions; stage 3 sees rider-side surplus claimed back via surge pricing + reduced service quality. The two-sided market with non-employee labor on one side made the labor-extraction stage 2 unusually rapid"
  - "Operationally distinct from lex-ewjec enclosure (structural absence of non-market exits): lex-ewjec names the PRECONDITION for enshittification (users + business customers have no non-platform alternative, so the platform can extract); lex-ukgke names the OPERATIONAL TRAJECTORY that follows. Composing partner-atoms: lex-ewjec produces the lock-in; lex-ukgke names what the platform does once lock-in is achieved"
  - "Operationally distinct from lex-994yb fixed-cost-recovery-channel: lex-994yb names the COST-RECOVERY engineering question (which two-part-tariff knob covers fixed cost); lex-ukgke names the EXTRACTION TRAJECTORY once VC-subsidy-as-recovery-channel ends and the platform must monetize. They compose: a VC-subsidized platform in lex-994yb stage-1 (subsidy-funded user acquisition) faces the cost-recovery-channel decision in stage-2; the enshittification trajectory is the structural answer when lock-in is achieved"
  - "Operationally distinct from lex-4nunt dollar-weighting: lex-4nunt names the PREFERENCE-AGGREGATION failure mode of market price-formation; lex-ukgke names the PLATFORM-LIFECYCLE failure mode of two-sided platforms with malleable internal allocation. Both produce extraction-at-equilibrium but via different mechanisms"
  - "Operationally distinct from lex-aryva Akerlof lemons: lex-aryva names INFO-ASYMMETRY-DRIVEN quality collapse (bad goods drive out good when buyers can't distinguish); lex-ukgke names ALGORITHM-RE-ALLOCATION-DRIVEN value extraction. Adjacent failure-modes; in late-stage enshittification the algorithmic ranking becomes a quality-asymmetry problem (sponsored results indistinguishable from organic), producing a lex-aryva dynamic on top of the underlying lex-ukgke trajectory"
  - "Operationally composes with lex-46twa: enshittification depends on EXIT BEING BLOCKED by lock-in mechanisms (network effects, DRM, social hostage-taking, switching costs). The lex-46twa design-discipline (preserve exit options) is the key structural countermeasure to lex-ukgke. Conversely: when exit is structurally weak, enshittification trajectory is structurally enabled"
  - "essential critical question: what specific lock-in mechanism makes this platform's enshittification trajectory possible? Diagnostic: identify network-effect (Facebook social graph), content-DRM (Amazon Kindle/Audible), switching-cost (Reddit subreddit-investment), audience-dependence (publisher Facebook reach), algorithmic-discovery-monopoly (Google Search). Practitioner-discipline: the lock-in mechanism is the LEVERAGE POINT for structural countermeasures (interoperability mandates, data portability, end-to-end principle, antitrust against MFN + self-preferencing)"
  - "foundational critical question: what's the EARLIEST observable stage-2 signal in this platform's trajectory? Doctorow names: sponsored-results displacing organic results (Amazon), preferential publisher distribution (Facebook), manual surplus-allocation to high-influence creators (TikTok), boost-fee monetization for content-reach (Twitter, LinkedIn). Practitioner-discipline: don't wait for stage-3 ad-density signals; the stage-2 signals predict the trajectory and are observable years earlier"
  - "decisive critical question (carried from inbox): is the platform's enshittification trajectory a CONTINGENT business-decision failure mode that could have been avoided with different leadership, OR a STRUCTURAL CONSEQUENCE of two-sided-market geometry + algorithmic-malleability + lock-in? Doctorow's argument is STRUCTURAL — 'a seemingly inevitable consequence' — which implies the countermeasures must be structural too (interoperability, antitrust, end-to-end principle) rather than relying on founder-virtue or board-discipline. The atom's transferable claim sides with the structural interpretation; the contingent-leadership-failure interpretation is the steelman the atom argues against"
critical-questions:
  - "is the platform currently in the user-value, business-extraction, or terminal-extraction phase — and what's the marker (engagement going up while satisfaction goes down)?"
  - "what would re-enable user-value — competitive entry, regulatory pressure, switching cost reduction — and is any of it materializing?"
  - "is the 'enshittification' framing distracting from the underlying lever (fixed-cost-recovery channel; lex-994yb), making symptoms the diagnosis?"
  - "are users locked-in (network effects, data portability) such that exit is too costly even when degradation is visible — name the lock"
