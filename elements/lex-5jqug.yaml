lineage:
  - source: primary
    text: newell-simon-1976-laws-of-qualitative-structure
    citation: "Allen Newell and Herbert A. Simon, 'Computer Science as Empirical Inquiry: Symbols and Search,' Communications of the ACM 19(3):113-126 (March 1976), pp. 114-115."
    quote: "'A good example of a law of qualitative structure is the cell doctrine in biology, which states that the basic building block of all living organisms is the cell.' ... 'Now that it is accepted, the whole earth seems to offer evidence for it everywhere, for we see the world in its terms.' ... 'The law tells us to look for a particular kind of cause; it does not insist that we will always find it.' ... 'Laws of qualitative structure are seen everywhere in science. Some of our greatest scientific discoveries are to be found among them. As the examples illustrate, they often set the terms on which a whole science operates.'"
canonical-instances:
  - "The paper's own worked instance of the category it names: the Physical Symbol System Hypothesis ('A physical symbol system has the necessary and sufficient means for general intelligent action') is offered explicitly as computer science's own law of qualitative structure — one general, qualitative sentence that, if true, reorganizes how the whole field looks for the source of intelligent behavior, the same way the cell doctrine reorganized biology."
  - "Hypothetical: a product team's early decision to treat 'a user's trust in a recommendation' as the single organizing variable behind churn, onboarding drop-off, and support-ticket volume looks embarrassingly underspecified next to a detailed funnel model. If it's the right qualitative claim, though, it tells the team what evidence to start collecting years before any funnel number is even estimated."
critical-questions:
  - "How would you distinguish a genuine law of qualitative structure from a claim that only sounds foundational — vague enough to explain everything and therefore nothing? The cell doctrine and germ theory both made specific, falsifiable claims about causal structure despite their generality — so what test tells a claim like that apart from one that's merely vague?"
  - "Germ theory 'has many exceptions... does not detract from its importance' — but at what point does a qualitative law's exception rate stop being tolerable noise and start being evidence the law is simply wrong? Newell and Simon don't give a threshold."
  - "Does recognizing something as a law of qualitative structure change how a field should treat competing candidates for the same role? Should several rival qualitative laws be entertained simultaneously, or does taking one seriously require provisionally setting rivals aside?"
