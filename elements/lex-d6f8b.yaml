id: lex-d6f8b
name: basic-color-terms-follow-a-universal-partially-ordered-acquisition-sequence
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When comparing how many/which basic color terms different languages have, don't treat the variation as arbitrary. Berlin & Kay's 1969 finding: the basic color terms of any language are drawn from a universal inventory of 11 categories (white, black, red, green, yellow, blue, brown, pink, purple, orange, grey), and if a language encodes fewer than all 11, WHICH ones it has is constrained, not random — the 11 categories fall into 7 partially-ordered equivalence classes (1: white/black, 2: red, 3: green, 4: yellow, 5: blue, 6: brown, 7: purple/pink/orange/grey), and a language encoding a category from class m encodes every category in every class below m. Given a language's total basic-color-term count, you can predict which specific terms it has. Treat the ORDERING CONSTRAINT as the well-replicated finding — it does not by itself establish that color perception differs across speakers of languages with fewer terms (Berlin & Kay explicitly deny that implication themselves); later cross-linguistic work (e.g. Kay & Regier 2006, the World Color Survey) found real variation in exactly where the category BOUNDARIES/foci fall within the 11 categories, softening the '11 universal categories with identical foci everywhere' reading without overturning the ordered-inventory constraint itself."
related: [lex-f4asy, lex-ybvy2]
evokes: [basic-color-terms, universal-color-hierarchy, berlin-kay-1969, partially-ordered-acquisition, color-lexicon-evolution]
lineage:
  - source: primary
    text: berlinkay-1969-basic-color-terms-working-paper
    citation: "Brent Berlin and Paul Kay, 'Universality and Evolution of Basic Color Terms,' Working Paper Number 1, Language-Behavior Research Laboratory, University of California, Berkeley (1969; ERIC ED019655), pp.2-4, section 'The hypothesis and general findings.'"
    quote: "[p.3:] 'It appears now that, although different languages encode in their lexicons different numbers of basic color categories, there exists universally a total inventory of eleven basic color categories from which the eleven or fewer basic color terms of any given language are always drawn. The eleven basic color categories are white, black, red, green, yellow, blue, brown, pink, orange, and grey.' [p.3, the ordering constraint:] 'A second and totally unexpected finding is the following: if a language encodes some number n < 11 basic color categories, then there are strict limitations on which n categories it may encode. The list of 11 basic categories is partially ordered, producing seven equivalence classes: 1. white, black < 2. red < 3. green < 4. yellow < 5. blue < 6. brown < 7. purple, pink, orange, grey. If a language codes a category from the mth equivalence class, (m = 1, 2, ..., 7), then it encodes all categories in each equivalence class r < m.' [p.3:] 'Moreover, if a color lexicon encodes six or fewer categories, we can predict exactly which ones they will be.' [p.4, the paper's own built-in disclaimer against a perceptual-determinism reading:] 'In sum, our two major findings are (i) the referents for the basic color terms of all languages appear to be drawn from a set of 11 universal perceptual categories, (ii) these categories become encoded in the history of a given language in a (partially) fixed order. There does not appear to be any evidence that differences in complexity of basic color lexicon between languages reflect perceptual differences between the speakers of those languages.'"
canonical-instances:
  - "A language with only 3 basic color terms (per the hierarchy, this would be white/black, red, and one of green-or-yellow) — Berlin & Kay's cross-linguistic sample let them PREDICT which 3 categories a minimal-inventory language would encode before checking, rather than treating each language's specific color-term set as an independent cultural fact to be looked up."
  - "A language expanding its color lexicon over historical time (loanwords, new distinctions) is predicted to add terms in roughly the class-order sequence — a language that already distinguishes red is a much better candidate to next add green/yellow than to jump straight to grey or purple, which sit at the far end of the ordering."
  - "The later-scholarship qualification (Kay & Regier 2006, the World Color Survey): even among languages that DO encode all 11 basic categories, the precise boundary between, say, 'blue' and 'green' varies measurably across languages and correlates weakly with color-discrimination speed — the ordered-inventory-of-11-categories claim held up, but 'every language draws the boundary in exactly the same place' did not."
critical-questions:
  - "does the ordering constraint hold as strongly as originally reported once sample size and methodology improved (the 1969 paper's sample was 20 languages collected systematically plus literature data to 80) — the World Color Survey (110 languages) is the test that matters, and the atom should be read alongside its findings rather than the 1969 paper alone."
  - "is 'universal perceptual categories' the right causal story, or could the ordering instead reflect convergent cultural/communicative pressure (which color distinctions are USEFUL to a given economy/environment) without requiring a shared perceptual substrate — Berlin & Kay's own paper argues for the perceptual reading but the logical alternative deserves airing?"
  - "how does the later-found boundary variation (Kay-Regier) interact with the ordering claim — does boundary variation ever get large enough to make the equivalence-class assignment itself ambiguous for a borderline language, or do the two findings sit at clearly separate levels (which categories exist vs. exactly where each one's edge falls)?"
status: active
