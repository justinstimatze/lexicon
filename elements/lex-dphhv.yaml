    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), '\"Beautiful Untrue Things,\"' on how trickster's lies and thefts reveal the artifice behind assumptions about property and ownership. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Our ideas about property and theft depend on a set of assumptions about how the world is divided up. Trickster’s lies and thefts challenge those premises and in so doing reveal their artifice and suggest alternatives. ... Suddenly the old verities are up for grabs. Who gave Apollo those cattle in the first place, anyway? Who exactly decides how the sacrifice should be apportioned? Who was the original owner of the butter that Yasoda guards so carefully? Who gave all of Pennsylvania to William Penn?"
canonical-instances:
  - "A dispute over an office's unwritten rule that a particular parking spot belongs to the most senior partner loses its air of inevitability the moment someone simply asks who decided that, and when, and it turns out to trace back to one partner's unilateral claim a decade earlier that nobody ever formally ratified."
  - "A neighborhood's assumption that a certain family always organizes the block party stops feeling like a natural fact once someone asks how that arrangement started, and the answer turns out to be an offhand decision from years ago that quietly calcified into an unquestioned tradition."
critical-questions:
  - "Does tracing a boundary to its founding act actually establish that the boundary is illegitimate, or only that it is historical rather than natural -- can an arrangement be both contingent in its origin and still fully justified on other grounds (consent, long-term stability, practical benefit)?"
  - "Is this move equally available against any boundary, including ones the questioner benefits from, or does it tend to get selectively deployed against boundaries that inconvenience the person asking while their own advantageous arrangements go untraced?"
  - "Once a boundary's contingent origin is exposed, does that automatically license anyone to violate it (as Hermes does), or does contingency of origin leave open a separate question of whether the current arrangement, whatever its founding, still deserves to be honored going forward?"
