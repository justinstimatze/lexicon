id: lex-rbcsc
name: worldview-as-cognitively-prior-pattern-shapes-values-and-history
type-in: posture
type-out: claim
_tier: atomic
agent-instruction: "Before debating values, strategy, or what is to be done, ask: what worldview makes this value visible and makes alternatives invisible? A worldview is the cognitively-prior pattern-set into which experience is organized — humans cannot meet the world raw, only through a pattern that has already selected what counts as a thing, what counts as a value, what counts as a possibility. The worldview is invisible to the worldviewer the way water is to fish. Surfacing it lets you debate the worldview itself rather than the smaller downstream questions that the worldview has already pre-decided. A culture's worldview shapes its values, and those values shape its history; therefore worldview-work is upstream of nearly all other work."
