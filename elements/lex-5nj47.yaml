id: lex-5nj47
name: neutralize-a-danger-by-absorbing-and-diffusing-it-not-destroying-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a founding story or institutional design needs to deal with a dangerous concentration of power or destructive knowledge, check whether it neutralizes the threat by destroying it, or by the less obvious route of co-opting its holder and progressively distributing the underlying capability to everyone, wrapped in new procedural checks. Graeber and Wengrow's case: in the Osage founding narrative, the murderous 'Isolated Earth People' and their chief sorcerer are not destroyed for their crimes -- the Water division's leader negotiates their inclusion in a new federation, and the once-exclusive, deadly ritual knowledge that made the sorcerer dangerous becomes distributed among all the clans under elaborate checks and balances. The Haudenosaunee founding epic does the same with the cannibal-witch Adodarhoh: not killed, but gradually healed and made human, then given custody of the very laws that constrain him. Absorbing and diffusing a threat, rather than eliminating it, converts a monopoly on danger into a shared, procedurally bounded capacity -- which also means the original holder has something to lose by breaking the new rules, rather than nothing left to lose."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, osage, haudenosaunee, adodarhoh, gayanashagowa, institutional-founding]
lineage:
  - source: primary
    text: dawn-of-everything-neutralization-of-arbitrary-power
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.11 'Full Circle.'"
    quote: "“the narrative sets off from the neutralization of arbitrary power: the taming of the Isolated Earth People's leader – the chief sorcerer, who abuses his deadly knowledge – by according him some central position in a new system of alliances.”"
  - source: primary
    text: dawn-of-everything-adodarhoh-healed
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.11 'Full Circle.'"
    quote: "“the very last to be won over is Adodarhoh himself, who is gradually healed of his deformities and turned into a human being. In the end the laws of the League are ‘spoken into’ belts of wampum, which serves as its constitution; the records are transferred to the keeping of Adodarhoh.”"
canonical-instances:
  - "The direct textual anchor, on where the destructive knowledge ended up: “In the process of co-opting their leader, the destructive ritual knowledge once held by the Isolated Earth People was, eventually, distributed to everyone, along with elaborate checks and balances concerning its use.”"
  - "Hypothetical: a hospital discovers that one senior surgeon has been quietly hoarding a novel technique, refusing to teach it to residents, using the monopoly to demand outsized pay and influence over department decisions. The board offers her the founding directorship of a training program instead of firing her, on the condition that she publish the full protocol and train the next cohort herself. Her expertise becomes department property rather than private leverage, and the program now bearing her name keeps her invested in its success."
critical-questions:
  - "How reliably does this actually work compared to simply removing the dangerous figure -- doesn't co-optation risk legitimizing someone whose original crimes (murder, abuse of power) might have called for punishment rather than a central role in the new order, and doesn't a founding myth naturally prefer a redemption arc regardless of whether real historical negotiations ever looked like this?"
  - "Does the mechanism depend on the threat actually being reducible to knowledge or technique that CAN be distributed, as opposed to a threat rooted in a person's unique charisma, military skill, or personal following, which can't simply be handed out to everyone else? The Osage and Haudenosaunee cases both center on esoteric/ritual knowledge -- would the same absorb-and-diffuse strategy work against a purely personal, non-transferable form of dangerous power?"
status: active
