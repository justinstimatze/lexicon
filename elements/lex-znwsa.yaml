    quote: "As I cannot sleep for your song, which, believe me, is as sweet as the notes of Apollo's lyre, I have a mind to taste some nectar, which Minerva gave me the other day. Won't you come in and join me?"
canonical-instances:
  - "inviting a disruptively attention-seeking colleague to 'present their big idea' to leadership. Their own need for an audience becomes the mechanism, and leadership does the discrediting on its own."
critical-questions:
  - "Does this tactic depend on the target's vanity being strong enough to override any suspicion of a sudden change in tone, from objection to praise — would a more self-aware target see through the reversal?"
  - "Is there an ethical line between this move and ordinary conflict de-escalation through genuine appreciation, given that both replace direct confrontation with praise — what distinguishes manipulation here from a real change of heart?"
