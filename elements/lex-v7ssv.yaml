id: lex-v7ssv
name: reframing-a-caught-transgression-as-clever-insight-converts-punishment-into-reward
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Someone caught in a punishable offense can escape the punishment entirely, and even be rewarded, by reframing the act itself as a piece of clever, universally-relatable observation rather than defending or denying it. The powerful figure judging the case responds to the wit of the framing rather than the substance of the offense. In the Jataka's tale of the belly's messenger, a man caught stealing food from the king's own dish casts himself as a literal messenger of Lust and the Belly, delivering a charming little sermon on how appetite compels everyone equally, even kings: 'When this the king heard, he said, \"That is true; Belly- messengers are these; urged by lust they go to and fro, and lust makes them go. How prettily this man has put it!\" he was pleased with him.' Nothing about the theft is disputed or excused. The framing simply makes the offense entertaining enough that punishing it stops being the king's priority."
