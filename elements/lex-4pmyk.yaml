id: lex-4pmyk
name: values-are-a-legitimate-non-competing-description-level-not-a-separate-realm
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern when someone frames naturalism as forcing a binary: EITHER values, meaning, and purpose require their own separate non-physical metaphysical category (a 'realm' beyond the physical, smuggled in to rescue their reality) OR they must be eliminated as illusions because the underlying world is 'just atoms in motion' (eliminativism / hard reductionism / scientism). Carroll's poetic naturalism names and rejects both horns by holding two claims together at once, neither of which is optional. FIRST, the strict ontological/metaphysical claim (the 'naturalism' half): 'There is only one world, the natural world... The world evolves according to unbroken patterns, the laws of nature... The only reliable way of learning about the world is by observing it.' There is no separate supernatural, spiritual, or non-physical realm standing alongside or behind the physical one — not for ghosts, not for souls, not for values either. SECOND, the epistemological/descriptive claim (the 'poetic' half), which is NOT a hedge or a retreat from naturalism but an equally central thesis: 'There are many ways of talking about the world. All good ways of talking must be consistent with one another and with the world. Our purposes in the moment determine the best way of talking.' The word 'poetic' names this directly: 'Poetic reminds us that there is more than one way of talking about the world. We find it natural to use a vocabulary of causes and reasons why things happen, but those ideas aren't part of how nature works at its deepest levels. They are emergent phenomena, part of how we describe our everyday world.' The two claims are not in tension; they are the same move seen from two sides. A SPARSE ontology (few or one fundamental category) is exactly what licenses MANY legitimate ways of talking, because 'way of talking' is doing real cognitive work that isn't reducible to a listing of fundamental furniture: 'In a sparse ontology, there are a small number of fundamental categories (maybe only one) describing the world. But there will be very many ways of talking about the world. The notion of a way of talking isn't mere decoration — it's an absolutely crucial part of how we apprehend reality.' The atom's specific, critical payload is the THREE-TIER structure this produces, and especially the THIRD tier, which is the part eliminativists and scientistic reductionists both miss because they only see two: (1) the deepest, most fundamental description — the whole universe exactly described in every microscopic detail, whatever that turns out to be; (2) 'emergent' or 'effective' descriptions valid within some limited domain — this is where ships, people, cells, and Captain Kirk live, 'macroscopic collections of stuff that we group into individual entities as part of this higher-level vocabulary'; and (3) VALUES — 'concepts of right and wrong, purpose and duty, or beauty and ugliness. Unlike higher-level scientific descriptions, these are not determined by the scientific goal of fitting the data. We have other goals: we want to be good people, get along with others, and find meaning in our lives.' The critical move is that tier (3) is NOT a worse or less-true version of tier (1) or tier (2), and it is NOT smuggled-in dualism either — it is a DIFFERENT KIND OF WAY OF TALKING because it answers to a DIFFERENT KIND OF GOAL. Tiers (1) and (2) are both in the business of fitting observational data as accurately as possible; that is the test a 'way of talking' about ships, causes, or cells has to pass, and it is why Kepler's astronomy is 'less good' than Newton's, which is 'less good' than Einstein's — all three are competing to fit the same data better. Values-talk does not compete on that axis at all; asking whether 'kindness is good' fits the data the way Newton's gravity fits Mercury's orbit is a category error, not a harder version of the same test. The eliminativist error is treating the absence of a data-fitting warrant for values as proof that values are illusions: 'For an eliminativist, the question Which Captain Kirk is the real one? gets answered by Who cares? People are illusions. They're just fictitious stories we tell about the one true real world.' Poetic naturalism's reply is explicit: 'The difference is that an eliminativist will say and therefore they are just illusions, while the poetic naturalist says but they are no less real for all of that.' The scientistic error (the opposite failure, associated in the book with attempts like Sam Harris's to derive 'good' directly and exclusively from well-being-maximization as though ethics were itself a branch of the data-fitting sciences) is to try to promote tier-3 into tier-2 by force, collapsing the values-answer-to-a-different-goal distinction rather than respecting it. Both errors share the same hidden premise: that there are only two tiers (fundamental-physical and derived-but-still-data-fitting), so values must be squeezed into one of them or discarded. The practitioner-move is to notice when a naturalism-vs-meaning argument is running on that hidden two-tier premise, and to supply the missing third tier: values are HUMAN CONSTRUCTS ('The task before us is to reconcile those cares and desires within ourselves, and amongst one another') that are nonetheless not arbitrary or illusory, because 'a way of talking isn't just a list of concepts; it will generally include a set of rules for using them, and relationships among them,' and a values-vocabulary can be more or less useful, more or less internally consistent, and more or less reconciled with the physical facts it must not contradict — it is just not in the business of FITTING DATA the way tiers 1 and 2 are. Carroll credits the underlying manifest-image/scientific-image distinction to Wilfrid Sellars ('the manifest image and the scientific image use different concepts and vocabularies, but ultimately they should fit together as compatible ways of talking about the world') and the 'universe is made of stories, not of atoms' framing to poet Muriel Rukeyser, but the tri-level with-values-as-a-genuine-third-kind structure is Carroll's own systematic contribution. DISTINCT from lex-gzgn3 (Hume's is-ought-gap-no-deduction-of-norm-from-fact): lex-gzgn3 is a claim about the LOGICAL STRUCTURE OF INFERENCE — that no valid deduction carries you from is-premises alone to an ought-conclusion; it is silent on whether values-talk, once its normative premise is supplied, is a LEGITIMATE, non-illusory way of talking about the world at all. This atom is a claim about ONTOLOGICAL AND EPISTEMOLOGICAL PLURALISM OF DESCRIPTION — that values-talk is a real, useful, non-competing third tier alongside fundamental physics and emergent science, neither reducible to the other tiers nor requiring a separate metaphysical realm. They are complementary and compatible (both resist collapsing values into brute physical fact, and both resist smuggling in an unexamined normative premise as though it were free) but they operate on different axes: one is about what can be VALIDLY INFERRED, the other is about what can be LEGITIMATELY SAID to exist and be real. A full naturalistic meta-ethics needs both: lex-gzgn3 to keep the inference honest, this atom to keep the resulting values-talk from being eliminated as fake once it's on the table. DISTINCT from lex-eybad (Mill's emergent-effects-resist-decomposition-into-summed-causes): lex-eybad is about CAUSAL COMPOSITION — whether a joint effect of combined causes is the mechanical sum of separate effects or a heteropathic, genuinely-novel higher-level regularity (water's properties versus hydrogen's and oxygen's). It licenses tier-2 emergent descriptions (ships, cells, temperature) as containing real, non-decomposable higher-level laws. It says nothing about tier-3: Mill's heteropathic laws are still in the business of predicting and fitting data at their own level, whereas Carroll's tier-3 values are explicitly NOT trying to fit data at all. lex-eybad explains why tier-2 is licensed as real; this atom explains why tier-3 is ALSO licensed as real, on different grounds. DISTINCT from lex-4yhqs (coarse-graining): lex-4yhqs is the general mechanism of choosing a level-of-description that preserves the dynamics relevant to a question while collapsing irrelevant micro-detail (planet-as-point-mass, molar vs. molecular disorder) — a purely descriptive-scientific tool for tiers 1 and 2. It has no machinery for, and makes no claim about, a level whose payoff is not prediction-of-dynamics but living-well-and-finding-meaning. DISTINCT from lex-z26m9 (exclusive-truth-claim-cosmologies-structurally-produce-intolerance-of-alternatives): lex-z26m9 is about a DIFFERENT plurality — many coexisting first-order divine/ideological claims (many gods, many creeds) tolerating each other versus one claim declaring all others false. This atom's plurality is about LEVELS OF DESCRIPTION of a single physical world (not many competing world-pictures but many non-competing vocabularies for the same one world). They share only a family-resemblance point (both prefer a pluralist structure to a totalizing, single-correct-account structure) but operate on entirely different objects: lex-z26m9's plurality is across horizontal alternatives at the same level; this atom's plurality is across vertical tiers of description. DISTINCT from lex-uahgy (Dennett's intentional-stance-treats-system-as-rational-agent-for-prediction): Dennett's three stances (physical, design, intentional) are all, like Carroll's tiers 1 and 2, PREDICTIVE STRATEGIES judged purely by predictive traction — adopting the intentional stance toward a thermostat is licensed exactly because and only because it predicts the thermostat's behavior. Carroll's tier-3 (values) is explicitly disqualified from that test by its own definition — it does not exist to predict anything, it exists to answer 'how should I live,' a goal orthogonal to predictive accuracy. Dennett's framework, however useful for tiers 1-2, has no tier-3 slot at all; this atom supplies the missing tier that a purely-predictive-stance pluralism cannot generate on its own terms. Use this atom whenever an argument about naturalism, physicalism, reductionism, or 'nothing but atoms' either (a) tries to eliminate values/meaning/purpose as illusions on the grounds that the deepest description contains no such categories, or (b) tries to rescue values/meaning/purpose by positing a non-physical realm where they 'really' live — and supply the missing third option: a legitimate, non-competing way of talking, answering to a different goal than data-fitting, real without being fundamental and without needing its own metaphysical address."
