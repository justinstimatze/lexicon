id: lex-wayzm
name: an-indiscriminate-weapon-requires-waiting-for-target-separation
type-in: process
type-out: process
_tier: atomic
agent-instruction: "The earliest moment you can see a threat is often not the safest moment to act against it, if your only weapon can't distinguish between the threat and whoever it's standing next to. In Cushing's telling, two brothers spot a cannibal demon leading two captive maidens toward his lair, and the elder brother, seeing the enemy in range, immediately reaches for his bow. The younger brother stops him cold: 'You fool of a brother elder, but not wiser. No! Do you not know that your arrow is lightning and will kill the maidens as well as the monster?' The weapon's power is exactly what makes early action dangerous -- a lightning-arrow doesn't discriminate between the demon and the captives standing beside him, so the earliest clear shot is also the shot most likely to kill everyone. The brothers wait, tracking the demon through his cave and his rituals, until the maidens are physically separated from him at the critical moment before he finally deploys the shield and the arrow with no one else in the blast path. Diagnostic move: when you're holding a weapon or intervention powerful enough to hit more than its intended target, resist treating your first clear shot as your best shot -- ask specifically who else stands to be caught in it, and if the answer is anyone you're trying to protect, wait for separation rather than opportunity."
