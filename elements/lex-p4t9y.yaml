id: lex-p4t9y
name: an-impossible-public-sight-hooks-an-otherwise-unreachable-decision-maker
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Standing visibly in mid-air at a decision-maker's gate is a pure attention-capture move, distinct from any argument it might carry — a deliberately impossible sight that gets an otherwise-inaccessible person to personally come and look, opening a channel that ordinary appeals couldn't reach. In the Jataka's tale of Dhajavihetha, the impossible sight alone is what pulls the king from his seat: \"They told the king, 'your majesty, there is a beautiful young Brother with a priest standing in the air at the king's gate.' The king rose from his seat and standing at the lattice said...\""
related: []
evokes: [jataka, chanipata, dhajavihetha-jataka, impossible-sight-as-attention-hook, capturing-an-unreachable-decision-maker]
lineage:
  - source: primary
    text: jataka-chalmers1895-dhajavihetha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 391, Dhajavihetha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "They told the king, \"Your majesty, there is a beautiful young Brother with a priest standing in the air [305] at the king's gate.\" The king rose from his seat and standing at the lattice said,"
canonical-instances:
  - "An activist group unable to get a meeting with a city official parks a fully-lit, obviously custom-built art installation directly outside the official's office window, and the sheer strangeness of it is what finally gets the official to come look and ask what's going on."
critical-questions:
  - "Does the spectacle's power come from its strangeness alone, and does it fade once the decision-maker realizes it's a deliberate tactic rather than something genuinely inexplicable?"
  - "Is there a meaningful difference between capturing attention through genuine astonishment versus through a manufactured stunt, once the decision-maker looks past the initial hook?"
status: active
