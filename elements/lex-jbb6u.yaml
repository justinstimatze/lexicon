id: lex-jbb6u
name: coalition-to-selectorate-ratio-sets-public-versus-private-spending
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When explaining why a leader (of a country, a company, a party, a gang) governs through broad public benefit or through narrow private payoffs to insiders, don't reach for their character, ideology, or stated values first -- check the ratio between the size of the group whose support they actually need to survive (the winning coalition) and the size of the pool that group is drawn from and could be replaced by (the selectorate). Bueno de Mesquita and Smith's mechanism: a public good has to be shared with the whole selectorate to register as a benefit, while a private reward can be funneled to coalition members alone, so shrinking the coalition relative to the selectorate it's drawn from drives the per-member cost of a private payoff steadily below the per-member cost of delivering the equivalent public good, until buying loyalty privately is simply the cheaper option. A leader beholden to a large coalition (most of a population, in a real democracy) can't outbid rivals through private payoffs alone -- the money would have to be spread too thin per recipient -- so public goods (rule of law, infrastructure, low taxes, freedoms) become the efficient currency instead, and this holds regardless of whether that leader personally wants to help everyone or would rather loot the treasury. A leader beholden to a small coalition drawn from a large pool of replaceable candidates gets the reverse incentive: private rewards (cash, land, protection, license to extract) to a few cost far less in total than public goods for the many, so governing badly for the general population while enriching insiders is simply the return-maximizing move available under that coalition arithmetic, whatever the leader's private character happens to be. Diagnostic move: before explaining a leader's or an organization's spending pattern by their personality, first compute (even roughly) how many people they actually need to keep on side and how large the replacement pool for those people is -- a change in that ratio (redistricting, a new voting rule, a founder replaced by a board) predicts a change in governing style even with everyone's character held fixed."
related: [lex-5rqmv]
evokes: [selectorate-theory, winning-coalition, bueno-de-mesquita-smith-dictators-handbook, public-goods-versus-private-goods, essentials-influentials-interchangeables, coalition-arithmetic-not-character]
lineage:
  - source: primary
    text: bueno-de-mesquita-smith-2011-loyalty-depends-on-coalition-size
    citation: "Bruce Bueno de Mesquita and Alastair Smith, The Dictator's Handbook: Why Bad Behavior Is Almost Always Good Politics (New York: PublicAffairs, 2011), Chapter 1 'The Rules of Politics.'"
    quote: "'The first step in understanding how politics really works is to ask what kinds of policies leaders spend money on. Do they spend it on public goods that benefit everyone? Or do they spend mostly on private goods that benefit only a few? The answer, for any savvy politician, depends on how many people the leader needs to keep loyal -- that is, the number of essentials in the coalition.'"
  - source: primary
    text: bueno-de-mesquita-smith-2011-large-coalition-too-costly-to-buy-privately
    citation: "Bueno de Mesquita and Smith, The Dictator's Handbook, same edition, Chapter 1 'The Rules of Politics.'"
    quote: "'In a democracy, or any other system where a leader's critical coalition is really large, it becomes too costly to buy loyalty exclusively through private rewards. The money has to be spread too thinly.'"
  - source: primary
    text: bueno-de-mesquita-smith-2011-small-coalitions-not-a-question-of-benevolence
    citation: "Bueno de Mesquita and Smith, The Dictator's Handbook, same edition, Chapter 1 'The Rules of Politics.'"
    quote: "'Thus small coalitions encourage stable, corrupt, private goods-oriented regimes in which the essentials do great while even the broader support coalition does pretty poorly. The choice between enhancing social welfare and enriching a privileged few is not a question of how benevolent a leader is.'"
canonical-instances:
  - "The book's own paired case: Nicaragua and the Dominican Republic started in 1975 with nearly identical per-capita income (~$2,300) and similar coalition sizes. By the mid-2020s their coalition-size scores had pulled apart (Nicaragua ~0.55, the Dominican Republic ~0.76), and per-capita income pulled apart with them -- the Dominican Republic to roughly $8,000, Nicaragua down to under $2,000 -- tracking the widening coalition-arithmetic gap rather than any other single variable the two countries don't already share (language, colonial history, coastline)."
  - "Hypothetical: two founders start companies with identical products and identical personal ethics. One raises from thousands of small retail investors with no real say (a large nominal but tiny real selectorate and coalition); the other keeps three co-founders as the only people whose buy-in matters. Selectorate logic predicts the second founder can extract far more for personal benefit at the same survival-risk level, purely because there are only three people to keep bought off instead of an unwieldy public-market crowd -- no difference in either founder's honesty is required to produce the difference in outcome."
  - "operationally distinct from lex-5rqmv (inclusive-versus-extractive institutions): that atom classifies a regime's institutions categorically, as inclusive or extractive, and treats the pairing of political and economic institutions as mutually reinforcing over long historical arcs. This atom makes a continuous, mechanistic claim that applies uniformly to any leader in any regime, democratic or not: the specific ratio of coalition size to selectorate size, not a regime-type label, is what sets the spending-mix incentive, and a shift in that ratio (redistricting, a buyout, a coup) predicts a shift in governing style even inside a single unchanged regime type."
critical-questions:
  - "The mechanism assumes leaders can freely reallocate revenue between public and private spending as the ratio dictates -- what happens when a small-coalition leader inherits an economy too poor to generate enough revenue for even minimal private payoffs, or a large-coalition leader inherits institutions (an independent judiciary, a free press) that constrain private payoffs regardless of what the coalition math would otherwise favor? Does the ratio still predict behavior, or only the leader's preference absent such constraints?"
  - "Leaders sometimes deliberately rewrite the rules that set the ratio itself -- gerrymandering, franchise restriction, an IPO diluting founder control -- rather than treating coalition size as a fixed constraint they merely respond to. Once the ratio becomes something the leader chooses rather than inherits, how would a specific case distinguish 'this leader's behavior follows from the ratio' from 'this leader's behavior produced the ratio'?"
status: active
