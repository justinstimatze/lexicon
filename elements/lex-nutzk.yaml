id: lex-nutzk
name: the-body-returning-to-earth-is-inconsequential-because-the-spirit-persists-elsewhere
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "After grief and an unresolved mystery about physical remains, a person can conclude that where the body actually lies doesn't matter, because it is only grass or dust, while what does matter, the spirit, exists somewhere untouched by the body's fate. Having spent real effort reconstructing where Crazy Horse's hidden grave might be, and still landing on 'I do not know,' Black Elk closes the question with a deliberate shift in what counts as the actual stakes: 'It does not matter where his body lies, for it is grass; but where his spirit is, it will be good to be.' The move doesn't resolve the mystery of the body's location. It reclassifies that mystery as never having been the real question."
related: []
evokes: [black-elk-speaks, killing-of-crazy-horse, it-does-not-matter-where-his-body-lies, for-it-is-grass, where-his-spirit-is-it-will-be-good-to-be]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch11-killing-of-crazy-horse
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 11, 'The Killing of Crazy Horse.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "It does not matter where his body lies, for it is grass; but where his spirit is, it will be good to be."
canonical-instances:
  - "A family that will never recover a loved one's remains after a disaster eventually stops searching for closure through burial. They tell each other the body was never the person, and its fate carries no news about where the person actually is now."
  - "A soldier lost at sea with no recoverable body is memorialized by a community that explicitly tells grieving relatives the ocean holding no marker changes nothing about what mattered in the person who died."
  - "A hospice chaplain counsels a family anxious about a loved one's eventual cremation versus burial that the method of returning the body to the earth is beside the point compared to whatever continues of the person beyond it."
critical-questions:
  - "Is this genuine philosophical conviction, or a coping reframe adopted specifically because the actual location is permanently unrecoverable -- would Black Elk have said the same thing if he did know exactly where the grave was?"
  - "Does treating the body's location as irrelevant actually reduce the grief of not knowing, or does it just relocate the unresolved feeling onto a claim, where the spirit is, that is equally unverifiable and unresolved?"
  - "The sentence comes immediately after real, sustained effort to locate the grave -- does the closing shift toward the spirit mean that search was ultimately beside the point, or was the search itself valuable regardless of how the account ends?"
status: active
