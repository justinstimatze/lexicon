    quote: "Why do criminals speak a lingo? There are several reasons, perhaps the most widely accepted of which is that criminals must have a secret language in order to conceal their plans from their victims or from the police. ... But most professional criminals speak argot only among themselves; ... It is a fact that argots are unintelligible to the layman, but I think that we should not assume that this is a deliberate protective device invented by criminals; we might as well conclude that, because the professional lingo of railroaders, doctors, sailors or tobacco auctioneers is not readily understood by outsiders, it was created to deceive the public. The argot is inherent to the profession; secrecy is a very minor motive for its formation and use. ... There is a very strong sense of camaraderie among criminals, a highly developed group-solidarity ... A common language helps to bind these groups together and gives expression to the strong fraternal spirit which prevails among them."
canonical-instances:
  - "Maurer's own analysis in The Big Con: con men's argot is unintelligible to outsiders as a side effect of technical specialization and a driver of group-solidarity, not as a deliberately engineered protective code — Maurer explicitly rejects the secrecy-hypothesis that most readers would assume by default."
  - "medical, legal, and military jargon: doctors, lawyers, and soldiers all speak in terms opaque to outsiders primarily because their professions require precise, economical reference to a large body of shared technical situations — the exclusionary effect on laypeople is a side effect of that precision, not the goal of it."
  - "online gaming and hacker-culture slang: rapidly evolving in-group vocabulary that signals membership and shared history among participants; newcomers find it opaque, but the vocabulary persists because it serves real-time coordination and belonging, not because the community is trying to keep outsiders from understanding it."
critical-questions:
  - "how does this differ from lex-zxrtf (naming-as-power)? lex-zxrtf names the POWER that accrues to whoever controls a specific name or reference-handle, regardless of the surrounding vocabulary system. This atom names why an entire SHARED VOCABULARY SYSTEM persists and what social function it performs for the group that uses it. The two axes compose — a single argot term can function as a naming-as-power lever within the group (knowing the current slang term for something signals current insider status) while the argot as a whole is doing lex-7yzvy's coordination/identity work — but they answer different questions: lex-zxrtf asks what a name does once known; this atom asks why the vocabulary exists and spreads in the first place."
  - "doesn't Maurer's own text admit some criminals DO use argot specifically to deceive victims? Yes — he explicitly names the exception: 'flat-jointers, three-card monte men, and other short-con workers sometimes use it to confuse or deceive their victims.' The atom's claim is about the PRIMARY, most-common motive across the broader institution of professional argot, not an exceptionless universal; genuine concealment-use coexists as a real but minority use-case within specific short-con contexts, which is precisely why Maurer treats it as worth calling out as an exception rather than folding it into the general rule."
  - "is this claim falsifiable — how would you distinguish concealment-code from coordination-code in a case where you lack an insider account like Maurer's? The diagnostic offered in the instruction is testable without insider access: observe whether the vocabulary is used SELECTIVELY (dropped or suppressed specifically when a target or outside authority is present) or CONSTANTLY (used indifferently to who's listening, including in contexts where no target is present to deceive). Selective use under target-presence is the signature of genuine concealment-code; constant, audience-indifferent use is the signature of coordination/identity-code."
