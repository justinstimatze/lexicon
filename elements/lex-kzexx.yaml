id: lex-kzexx
name: performing-a-practices-form-without-its-purpose-is-its-own-violation
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A story, ritual, or practice can have a real, functional purpose beyond its surface content, and performing the surface form while stripping away that purpose isn't a neutral act, it's experienced by the community that holds the practice as an actual violation, distinct from simply telling the story wrong. Hyde reports, via the folklorist Barre Toelken, that Navajo Coyote stories work on multiple levels at once: 'As entertainment, the story stirs up a fantasy of amusing disorder; as medicine, it knits things together again after disorder has left a wound.' The medicinal function isn't decoration layered on top of the entertainment; it's constitutive of what the telling actually is. Which is why detaching the form from the purpose carries real weight: 'to tell the story without such moral or medicinal motives does a kind of violence to it, and to the community (so that the teller would be suspected of engaging in witchcraft).' The suspicion of witchcraft isn't superstition about the wrong words being said; it's the community correctly identifying that someone is using the form of a healing practice while discarding the healing itself. Diagnostic move: before adopting the outward form of a practice, ritual, or story that belongs to a tradition you're borrowing from, ask what functional purpose the form was actually serving there, since reproducing the surface while discarding the purpose isn't a lesser or incomplete version of the same thing, it's recognized by the source community as a different, often harmful act."
