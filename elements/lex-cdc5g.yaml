id: lex-cdc5g
name: opposition-drives-progression-maintain-contraries-rather-than-resolve
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When you find a tension between two principles — reason and energy, structure and improvisation, caution and ambition, top-down and bottom-up, exploration and exploitation, individual and collective — the default move in many traditions is to RESOLVE the tension: synthesize, sublate, find the middle, reconcile. Blake's transferable claim is that this move is often a MISTAKE. The contraries are not defective oppositions awaiting reconciliation; they are the STRUCTURE OF PROGRESSION ITSELF. 'Without contraries is no progression.' Attempting to resolve them collapses the generative tension that drove forward motion. Practitioner discipline: when you notice yourself reaching for synthesis (the third position that 'integrates' the two), pause and ask whether the synthesis preserves the GENERATIVE FRICTION or smooths it away. Often the right move is not to resolve but to MAINTAIN both contraries explicitly — as Bohr maintained wave and particle in complementarity, as adversarial-collaboration maintains red-team and blue-team without merging them, as productive teams maintain explorers and exploiters without converging them to one style. The atom is silent on Blake's broader theology and Devil/Angel framing; the transferable claim is the structural one: opposition can be generative, and not all oppositions should be resolved. Be careful not to misapply this — some oppositions ARE defective and should be resolved (a contradiction in a proof, a bug in code, mutually-blocking design constraints with no real tradeoff). The atom names the pattern; it does not assert that every tension is a Blakean contrary. The diagnostic question: does maintaining both produce MORE motion than resolving to one? If yes, hold the contraries. If no, resolve."
related: [lex-ucw53, lex-6f5xs, lex-8n237, lex-pd9p6, lex-cmkdq, lex-v64dh]
