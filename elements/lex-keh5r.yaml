    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Heaven's Privy,\"' citing Mary Douglas's Purity and Danger. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "“Dirt is matter out of place.” Egg on my plate is breakfast, but egg on my face is dirt; shoes in the closet are tidy, but shoes on the table are a mess; the farmer in Iowa washes the manure from his hands, the Brahmin in Mysore washes with it. To this first definition of dirt, Douglas adds a second: dirt is the anomalous, not just what is out of place but what has no place at all when we are done making sense of our world."
canonical-instances:
  - "A word considered polite in one register of a language (a clinical medical term) is considered obscene in another register of the exact same language (casual conversation), even though the referent and the information conveyed are identical -- the word itself hasn't changed, only which slot in the social system it's being spoken into."
  - "The same financial transaction, moving money from a personal account to a business account, is unremarkable bookkeeping when done through the normal channel and gets flagged as suspicious when done through an unusual one, even though the money and the amount are identical in both cases; the system's category boundary, not the money, is what determines the classification."
critical-questions:
  - "Does treating all dirt-judgments as purely systemic and relational risk obscuring cases where a substance really is harmful regardless of location or category (a genuine pathogen, a real toxin), where 'it's just a classification' undersells a real, category-independent danger?"
  - "Is Douglas's second definition (the anomalous) actually reducible to the first (out of place), or does the rock-badger case show something genuinely different is going on when a thing has no place at all versus when it's simply been moved to the wrong one?"
  - "If dirt-judgments are entirely about classification systems and not about the substance, does that make all such judgments equally arbitrary and equally revisable, or are some classification systems more grounded in real consequences (disease transmission, structural function) than others, making some 'dirt' harder to relativize away than others?"
