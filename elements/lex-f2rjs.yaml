lineage:
  - source: primary
    tradition: koster-game-design
    text: koster-2013-theory-of-fun
    citation: "Raph Koster, Theory of Fun for Game Design (O'Reilly Media, 2nd ed., 2013), Chapter 5 (Why Games Matter)."
    quote: "To recap the preceding pages: Games aren't stories. Games aren't about beauty or delight. Games aren't about jockeying for social status. They stand, in their own right, as something incredibly valuable. Fun is about learning in a context where there is no pressure from consequence, and that is why games matter."
  - source: primary
    tradition: koster-game-design
    text: koster-2013-theory-of-fun
    citation: "Raph Koster, Theory of Fun for Game Design (O'Reilly Media, 2nd ed., 2013), Chapter 2 (How the Brain Works)."
    quote: "Most of them are examples of a concept called 'chunking.' Chunking is something we do all the time. […] You have them developed already, so the brain only rewards you for doing them in the context of a mental challenge. You don't get a high from just typing, you get it from typing while pondering what to say, or from typing during a typing game."
canonical-instances:
  - "The familiar arc of a video game — initially exciting as new mechanics are introduced, peaks in mid-game when systems are mastered enough to enable strategic play but not yet routine, falls off at the end when nothing new is being learned."
  - "A child's relationship with a toy — intense interest while the toy's affordances are being discovered, abandonment once the patterns are fully chunked."
  - "A teacher's interest in teaching the same course year over year — fun in years 1-3 as classroom-dynamics patterns are being learned; rote by year 10 unless the teacher actively introduces new variables."
  - "Jazz improvisation across a career — repertoire mastery saturates for tunes the musician has played 1000 times; the fun moves to new tunes, new instrumentalists, new venues — anywhere new patterns can be chunked."
  - "Software UX with a steep learning curve — first hours and weeks are not fun (no chunks acquired yet); the joy of the tool appears once enough patterns are mastered to use it fluently; eventually saturates and the tool becomes background."
  - "Career change at midlife — often driven by fun-saturation in a domain where the person has mastered the patterns; the new field offers chunks to acquire even if the absolute skill level is lower."
  - "The contrast between addictive and fun activities — slot machines (Schüll lex-tcgej) use variable-ratio reinforcement to substitute for genuine pattern-mastery; engagement is sustained but no chunks are acquired, so the experience is addictive without being fun."
