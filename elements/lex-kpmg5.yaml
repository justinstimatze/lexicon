id: lex-kpmg5
name: continuous-company-isolates-target-from-outside-reality-checks
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "During a high-stakes decision window, a target can be kept in continuous company — never left alone — so no outside party (a spouse, a banker, a friend, an uninvolved professional) has any opportunity to supply disconfirming information before the decision locks in. Maurer's Life of the confidence game names this specifically: 'At this point the mark is usually \"tied up.\" That is, he is placed in the custody of the roper and never allowed to be alone until the bitter end.' The book shows how load-bearing the tactic is: a mark left alone even briefly can recover enough independent judgment to back out, so the con's actual profitability depends on maintaining unbroken company through the entire vulnerable window, not on any single argument or lie told during it. The mechanism is a TEMPORARY, SITUATIONAL tactic scoped to one discrete decision window — it ends once the decision is made, one way or the other — not a standing institutional policy. Generalize beyond con games: a timeshare sales team that never leaves the couple alone in the presentation room; a high-pressure car-lot tactic of a salesperson sitting with a customer continuously until they sign; a hostage-negotiation-adjacent coercive-control dynamic where a partner ensures the other is never alone with friends during a specific high-stakes conversation (though sustained versions of this shade into lex-rptqb, see below). The diagnostic move: when a decision-maker reports never having a private moment during the run-up to a major commitment, check whether that continuous company was engineered specifically to block outside reality-checks — the absence of any opportunity to consult an outsider is itself informative, independent of what was actually said during the company."
related: [lex-rptqb]
evokes: [placed-in-the-custody-of-the-roper, never-allowed-to-be-alone, until-the-bitter-end, tied-up]
lineage:
  - source: primary
    text: maurer-1940-the-big-con-the-tie-up
    citation: "David W. Maurer, The Big Con: The Story of the Confidence Man (1940), from the 'pay-off' con walkthrough, describing the practice con men call 'tying up' the mark."
    quote: "At this point the mark is usually \"tied up.\" That is, he is placed in the custody of the roper and never allowed to be alone until the bitter end."
canonical-instances:
  - "the tie-up in Maurer's The Big Con: from the moment the mark's confidence has been switched to the insideman until the sting is complete, the roper keeps the mark in continuous company, specifically so no banker, friend, or outsider can raise a disconfirming question during the vulnerable window."
  - "a timeshare sales presentation where the sales team ensures the couple is never alone together in a private moment — one representative always accompanies them, even to the restroom, until the contract is signed or the couple leaves."
  - "a high-pressure car dealership tactic where a salesperson sits with a customer continuously through the entire negotiation and financing process, deliberately preventing a phone call to a friend or spouse who might counsel walking away."
critical-questions:
  - "how does this differ from lex-rptqb (forced severance of outside relationships as institutional isolation mechanism)? lex-rptqb names a standing INSTITUTIONAL policy (a cult's disconnection policy) that permanently and structurally severs a member's outside relationships as an ongoing condition of membership. This atom names a TEMPORARY, SITUATIONAL tactic scoped to a single discrete decision window — the mark is tied up only until the specific transaction concludes, then released, whether or not they remain a target afterward. lex-rptqb is architecture; this atom is a tactic deployed during one encounter. A predatory relationship can escalate from this atom's situational tie-up into lex-rptqb's standing severance if the isolation becomes the ongoing condition of the relationship rather than a bounded episode."
  - "isn't accompanying someone constantly just normal hospitality or attentiveness, especially in a sales or service context? Ordinary attentiveness doesn't specifically prevent private outside contact — a genuinely hospitable host doesn't object if the guest wants to step out to make a call. This atom's defining feature is that the continuous company is functioning as a BARRIER against a specific category of contact (anyone who might supply disconfirming information), which becomes visible when the target actually tries to get a private moment and is redirected, distracted, or accompanied anyway."
  - "does the mark's own suspicion ever break through continuous company? Maurer notes this is genuinely difficult to sustain — the roper 'bears the brunt of the mark's suspicions' during the tie-up period, and marks sometimes 'blow up' or grow fractious even while accompanied. The mechanism is not perfectly reliable; it raises the cost and difficulty of the target getting disconfirming information, it does not make it impossible. A target's persistent, unaccommodated request for a private moment is itself often the clearest signal something is being deliberately blocked."
severity-tier: info
status: active
