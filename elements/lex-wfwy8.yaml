id: lex-wfwy8
name: publishing-a-crafts-private-notation-invites-outsider-innovation
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When a craft's practitioners hoard their working notation or code as trade secrecy, expect the craft to stay closed to outside improvement even if skilled practitioners themselves keep innovating -- their innovations stay locked inside the guild. The unlock is publishing the intermediary notation or diagram that translates the craft's structure into a form legible to someone who has never practiced it, an entirely different move than teaching the raw hand-skill to more people. Once that notation is public, people who never learned the craft itself -- engineers, mechanics, tinkerers -- can read the underlying logical/mathematical structure and mechanize or extend it, working directly from the code instead of years of hands-on apprenticeship. If you want a closed domain to attract outside innovation, the highest-leverage move is usually publishing its notation; training more insiders barely moves the needle by comparison."
related: [lex-379e8]
evokes: [marx-ziegler, weber-kunst-und-bild-buch, weaving-draft-notation, guild-secrecy-broken, industrial-enlightenment, joel-mokyr, jacquard-loom-precursor]
lineage:
  - source: primary
    text: postrel-2020-fabric-of-civilization-ch3-cloth
    citation: "Virginia Postrel, The Fabric of Civilization: How Textiles Made the World (Basic Books, 2020), Chapter Three: Cloth, on Marx Ziegler's 1677 Weber Kunst und Bild Buch (The Weavers Art and Tie-Up Book), the first published book of weaving patterns."
    quote: "The problem, he concluded, was that ambitious Ulm weavers had little chance to learn how to create patterns, because those who had the know-how hoarded their expertise. 'There are those who understand the art but are selfishly concerned that nothing should be revealed,' he observed. So, breaking with his profession's traditional secrecy, Ziegler decided to write an instruction manual... It also required a written code: a way of translating the directions for woven patterns into easily decipherable diagrams... His diagrams provided a layer of abstraction between material practice and pure mathematics. Today's weaving drafts descend from its notation... Weavers had long used private notation to record patterns. Condemning the secrecy of his fellow craftsmen, Ziegler wrote that 'tie-up books must be necessary for draw loom and treadle-loom weavers, since without them no one could learn to weave or accomplish anything of the sort.' But before his book, those diagrams were trade secrets. Only when its intermediary code became public, and therefore visible to nonweavers, could weaving inspire outsiders to learn from its examples or apply their ingenuity in its formerly closed domain."
canonical-instances:
  - "Gioanventura Rosetti's 1548 Plictho, the first professional dyeing manual, did the same for dye recipes -- Rosetti was not himself a dyer but 'someone who believed in disseminating technical knowledge,' spending sixteen years, by his own account, 'prying trade secrets from reluctant artisans' before publishing formulas that had previously been guild secrets."
  - "Ellen Harlizius-Klück's own assessment of the downstream effect: Ziegler's book and similar manuals 'made the art of weaving public, and its notation became standardized and common. With the notation close to the machine, they furthermore facilitated mutual understanding of the interaction between pattern drafting and loom parts for nonweavers and through this enabled engineers and inventors to play around with the mechanisms finally leading to an automated loom' -- naming the causal chain directly: publication of notation, not diffusion of hand-skill, is what let non-weaving engineers reach the automated Jacquard loom over a century later."
critical-questions:
  - "Was the actual bottleneck secrecy of NOTATION, or scarcity of the underlying SKILL itself? If the craft can't be reduced to a legible code at all (it's genuinely tacit, hands-only knowledge), publishing a manual won't open it to outsiders the way it did for weaving and dyeing."
  - "Who actually used the published notation to innovate -- practitioners refining their own craft, or true outsiders (engineers, mechanics) who had never practiced it? The claim is specifically that outsiders became able to contribute; if only insiders benefited, that's ordinary craft diffusion, a different mechanism entirely."
  - "Did publication actually precede the outside innovation by a meaningful gap (as with Ziegler's 1677 book and Jacquard's early-1800s loom, over a century apart), or is the causal story being read backward from the eventual innovation onto an earlier publication that may be incidental?"
severity-tier: info
status: active
