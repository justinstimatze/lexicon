lineage:
  - source: primary
    text: cushing-serpent-of-sea-phantom-weight-after-transformation
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Serpent of the Sea.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'But I came all the way with you,' said he, 'and I saw no such creature as you describe.' ... for you know after one has carried a heavy burden on his shoulder or back, if it be removed he does not at once know that it is taken away; it seems still to oppress and pain him. So it was with her; but at length she turned around a little and saw a young man--a brave and handsome young man."
canonical-instances:
  - "Someone who has just been cleared of a serious medical diagnosis after a prolonged period of fear continues to feel physically braced and anxious for weeks afterward, misreading the lingering dread as a sign the doctors might be wrong, when it's actually just the normal decay time for fear that had been load-bearing for months."
  - "An employee whose abusive manager has just been removed from the company still flinches at messages from leadership and feels the same knot of dread checking their inbox each morning, mistaking the lingering physiological response for evidence the situation hasn't actually changed, when the threat itself is genuinely gone and only the learned bracing remains."
critical-questions:
  - "how does someone actually distinguish 'this is just residual fear from a resolved threat' from 'this feeling is picking up on a real, still-present danger I haven't consciously registered yet' -- is there a reliable way to tell the two apart from the inside, or only in hindsight once the true state is confirmed?"
  - "does treating lingering dread as mere lag risk under-responding to situations where the danger really has only partially resolved, or where a new, related threat could plausibly still be present in a similar form to the one that seemed removed?"
  - "the maiden's fear only actually resolves because the Serpent patiently keeps making gentle contact and finally shows physical proof -- does the phantom-weight framing understate how much active, repeated reassurance was required, versus suggesting the feeling would have faded on its own with time alone?"
status: active
