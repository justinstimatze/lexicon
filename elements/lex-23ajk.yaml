canonical-instances:
  - "A city council weighs a developer's projected profit against a neighborhood's loss of green space, two quantities with no agreed exchange rate between dollars and quality of life. Rather than demand a precise dollar value for the green space before deciding, the council checks whether the rezoning still reads as a net loss across every exchange rate a reasonable person would defend, from a stingy estimate of the space's worth to a generous one, and finds that it does at both ends -- settling the question without ever pinning down the rate."
  - "A company deciding whether a new feature is worth the engineering time doesn't need to fix an exact dollar value for an hour of saved user frustration. It checks whether the feature clears the bar at the stingiest defensible value and also at the most generous one; clearing both ends means the exact number in between was never what the decision turned on."
critical-questions:
  - "Doesn't 'no matter which combination we take' quietly assume some limit on how extreme the combinations can get -- isn't that itself an unproven comparability claim? Sen would grant this: the method sits strictly between full comparability and none at all, resting on whatever bound of variability you're willing to accept. It doesn't eliminate the need for a comparability judgment; it shrinks how much of one is needed, from an exact rate down to a defensible outer limit."
  - "What happens when the conclusion DOES flip somewhere inside the plausible range -- does the whole method just fail silently at that point? Sen's own worked example in the following section hits exactly this case: one comparison among his three sample alternatives comes out genuinely inconclusive, because the ranking reverses somewhere inside the accepted range of variability, and he reports it as undetermined rather than forcing an answer. The method's honesty is that it can say 'undetermined' instead of manufacturing false precision."
