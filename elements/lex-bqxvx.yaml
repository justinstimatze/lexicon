id: lex-bqxvx
name: persons-things-actions-as-tripartite-domain-axes
type-in: state
type-out: composition
_tier: atomic
agent-instruction: "When law/policy is being structured, surface the persons / things / actions tripartition (Gaius) — three independent domain axes; a confused regime often results from collapsing two of them into one."
related: [lex-spk4s, lex-avv9k, lex-8n237, lex-zeznb, lex-2n84d]
scaffolds-from: [lex-2n84d, lex-spk4s]
evokes: [justinian-institutes-structure, personae-res-actiones, the-three-books, code-napoleon-inheritance, subject-object-verb, principal-resource-action, capability-systems, the-1500-year-template]
lineage:
  - source: primary
    text: justinian-institutes-533ad
    citation: "Justinian I (compiled by Tribonian, Theophilus, Dorotheus under Justinian's commission), *Institutes* (Institutiones, 533 AD). English translation: J.B. Moyle, *The Institutes of Justinian* (Oxford: Clarendon Press, 5th ed. 1913; Project Gutenberg ebook #5983). (PD per work age 1492 yr + translator d. 1930 + work age >100 yr). The *Institutes* is the elementary textbook component of Justinian's Corpus Juris Civilis (the codification of Roman law that has dominated continental European legal systems since the 11th century). The work's organizing principle: 'Omne autem ius quo utimur vel ad personas pertinet vel ad res vel ad actiones' — 'The whole of the law which we observe relates either to persons, or to things, or to actions' (Book I, Title II, §12). The four-book structure follows: Book I treats personae (persons — free vs slave, citizen vs foreign, paterfamilias vs subject, guardian relations); Books II-III treat res (things — property, succession, obligations, contracts); Book IV treats actiones (legal procedures — types of actions, defenses, executory process). This tripartite framework was preserved in the 11th-century rediscovery (Bologna glossators), inherited by the Code Napoleon 1804 (Book I 'Of Persons,' Book II 'Of Property,' Book III 'Of Modes of Acquiring Property'), the BGB 1900, and most civil-law systems today."
    quote: "[Justinian *Institutes*, Book I Title II §12, line 292:] 'The whole of the law which we observe relates either to persons, or to things, or to actions. And first let us speak of persons: for it is useless to know the law without knowing the persons for whose sake it was established.' [Book I Title I §1, on what jurisprudence is:] 'Jurisprudence is the knowledge of things divine and human, the science of the just and the unjust.' [On the structure-of-private-law, Book I Title I §4:] 'The study of law consists of two branches, law public, and law private. The former relates to the welfare of the Roman State; the latter to the advantage of the individual citizen. Of private law then we may say that it is of threefold origin, being collected from the precepts of nature, from those of the law of nations, or from those of the civil law.' [On persons as primary, Book I Title II:] 'In the law of persons, then, the first division is into free men and slaves.' [The transferable claim: any normative-procedural system organizes itself around three axes — (1) WHO has standing/capacity to act (personae); (2) WHAT can be acted upon as property/object (res); (3) HOW the system processes claims (actiones). The 1500-year survival of this structure in continental civil-law indicates it captures a recurring requirement of normative-domain modeling, not a contingent Roman-cultural choice. The framework recurs in modern domain-modeling — access-control systems (subjects/objects/operations), database design (entities/attributes/operations), capability-systems (principal/capability/action).]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v46
    citation: "Cross-domain attestations: (a) modern civil-law inheritance — Code Napoleon 1804 follows persona/res/actiones in three books (Book I 'Des Personnes'; Book II 'Des Biens'; Book III 'Des Différentes Manières dont on Acquiert la Propriété' which absorbs both obligations and procedure); BGB 1900 inherits the structure; (b) modern computer-systems access-control — Lampson 1969 'Protection' formalized the subject × object × access-mode matrix that became RBAC (role-based access control) and ABAC (attribute-based); capability-systems (Dennis-Van Horn 1966) explicitly model principal/capability/action; modern policy languages (XACML, OPA Rego) use subject/resource/action as the canonical schema; (c) database design — the relational model (Codd 1970) organizes around entities (persons-like), relationships, and operations; (d) linguistics — case-systems in many languages morphologically mark agent (nominative, ergative) vs patient (accusative, absolutive) vs verbal-action (verb morphology), instantiating the same triad at the syntactic level; (e) ontology-modeling — RDF triples are subject/predicate/object, OWL extends with action-classes. The recurrence across legal, computational, linguistic, and ontological substrates suggests the triad captures a deep structure of action-modeling, not merely a Roman convention. Multi-substrate attestation across continental civil law, computer-security, database engineering, linguistics, and knowledge-representation."
    quote: "[Cross-domain consistency check, 2026-05-24: Justinian's 533 AD framework survives 1492 years and recurs across non-legal substrates — wherever domains involve actors performing actions on objects, the tripartite organization emerges. Modern computer-security (RBAC, OPA Rego) uses the SAME schema as Roman law. Modern linguistics finds the SAME triad morphologically marked in case-systems. Modern ontology-modeling (RDF) treats it as foundational. The transferable claim is robust: when modeling a normative-procedural domain, expect the persons/things/actions triad to be the natural decomposition. Failing to decompose along these axes (e.g., conflating persons-and-things in single-entity-tables, or omitting the action-axis from a permissions-system) produces systems that resist analysis and accumulate ad-hoc workarounds.]"
canonical-instances:
  - "the Code Napoleon canonical case (1804 French civil code): Book I 'Des Personnes' covers status of persons (citizenship, marriage, parental authority, minority); Book II 'Des Biens' covers things (property, possession, real-rights); Book III covers acquisition-modes (obligations, contracts, inheritance — corresponds to Justinian's actiones extended). The 200-year-old Napoleonic Code preserves Justinian's structure essentially unchanged. Most former French colonies (Belgium, Luxembourg, parts of Latin America, Quebec, Louisiana) follow this. The 1500-year transmission Justinian → glossators → Napoleon → modern civil codes is the canonical instance of a structural-template surviving substrate-change"
  - "the RBAC canonical case (Sandhu et al. 1996 *Computer* on Role-Based Access Control): access-control systems are formally specified as subject × object × action triples. Lampson 1969 'Protection' (*Operating Systems Review* 3:18) formalized the access-control-matrix. Modern policy-languages (Oracle's policy framework, AWS IAM, Open Policy Agent's Rego, XACML) all use the same tripartite schema. The cross-substrate validation: computer-security engineers discovered Justinian's structure independently when modeling permissions formally. Same structural requirement, different substrate"
  - "the linguistic-case-system canonical case (cross-linguistic typology — Comrie 1989 *Language Universals and Linguistic Typology*): many natural languages morphologically mark agent vs patient vs verb. Nominative-accusative languages mark agent (nominative) distinctly from patient (accusative); ergative-absolutive languages mark agent of transitive verb (ergative) distinctly from patient + agent-of-intransitive (absolutive). Across both alignment-types, the verb is treated as a separate morphological category. The persona/res/actiones triad is morphologically encoded in human language. Cross-substrate confirmation: the triad isn't an arbitrary legal convention but a structural feature of how humans model action"
  - "the RDF-triple canonical case (Berners-Lee + Hendler + Lassila 2001 + W3C semantic web): the knowledge-representation standard organizes ALL claims as subject-predicate-object triples. RDF directly maps to persona/res/actiones via subject=persona (the asserting entity), predicate=actio (the relation), object=res (the thing). Modern knowledge-graphs (Wikidata, Schema.org, enterprise knowledge-graphs) inherit this. The recurrence in knowledge-representation: when modeling structured assertions, the triad is the natural decomposition"
  - "the agent-resource-environment canonical case (modern multi-agent systems + RL): reinforcement-learning frameworks model agent × environment × action. Multi-agent systems (Stone + Veloso 2000 *Auton. Agents Multi-Agent Syst.*) extend to multi-agent × shared-environment × action-space. The triad appears in AI-systems engineering despite no direct lineage from Roman law — independent reconvergence on the same structural decomposition"
  - "operationally distinct from lex-spk4s isolate-component-for-separate-treatment: lex-spk4s is the GENERAL decomposition-as-method pattern. lex-bqxvx is a SPECIFIC NAMED triad-decomposition for normative-procedural domains. lex-spk4s supplies the family; lex-bqxvx supplies the canonical triad. Cross-fire: applying lex-spk4s to a legal/access-control domain naturally produces lex-bqxvx's triad"
  - "operationally distinct from lex-avv9k rights-decompose-into-four-jural-relations: Hohfeld decomposes WHAT a normative-claim asserts (claim/privilege/power/immunity) — operates WITHIN the actio/persona axes. lex-bqxvx is the higher-level domain-structure. Cross-fire: Hohfeldian relations (lex-avv9k) attach to persons (lex-bqxvx's persona axis) regarding things (lex-bqxvx's res axis); Hohfeldian powers can alter relations via actiones (lex-bqxvx's third axis)"
  - "operationally distinct from lex-8n237 under-determined-rule-admits-multiple-legitimation-methods: Cardozo decomposes METHODS of rule-application (philosophy/evolution/tradition/sociology). lex-bqxvx decomposes the DOMAIN STRUCTURE of a legal system. Cross-fire: Cardozo's methods operate within the framework lex-bqxvx establishes; the four directive-forces apply to under-determined cases regardless of which axis (person/thing/action) the case primarily concerns"
  - "operationally distinct from lex-zeznb signifier-bifurcates-into-denotation-and-connotation: Mill decomposes signifier-structure. lex-bqxvx decomposes domain-structure. Adjacent layers (linguistic-substrate vs domain-substrate). Both are decomposition-patterns but applied at different scales — Mill at name-level, Justinian at system-architecture-level"
critical-questions:
  - "the axis-completeness diagnostic: when modeling a new domain, does the persona/res/actiones triad cover all the relevant categories? Practitioner-question: list out the entities in this domain — are they persons (with standing), things (objects of action), or actions (procedures)? If something doesn't fit, it's either a sub-category of one of the three, or it's a boundary-object (e.g., legal-instruments are both res — they're owned — and partially actiones — they cause legal effects). The triad's essential claim is COMPLETENESS, not exclusiveness"
  - "the persona-axis subtlety: 'persons' in Justinian's framework includes natural persons (humans) and juristic persons (corporations, the state). Modern domains face the same question — does an AI-agent have 'standing' in our system? An RBAC role? An organizational-unit? Practitioner-discipline: when extending lex-bqxvx to AI/agent contexts, name explicitly which entities have persona-status and which are merely res. The boundary is consequential — only personae can be principals in actions"
  - "the action-axis subtlety: actions in Justinian's framework are LEGAL ACTIONS (lawsuits, procedural moves) — they're the system's procedures, not the substantive behaviors being adjudicated. Modern domains often conflate these: an access-control 'action' is sometimes a substantive operation (read, write), sometimes a system-procedure (request, grant, revoke). Practitioner-discipline: distinguish (a) substantive-actions (what entities do in the world) from (b) procedural-actions (how the system processes claims about those substantive-actions). Conflation produces unclear policy-specifications"
  - "the cross-substrate transferability: when transferring lex-bqxvx to a new substrate (engineering domain, AI system, organizational structure), the triad usually maps cleanly but the BOUNDARY DEFINITIONS may shift. Practitioner-question: where are the boundaries between persona/res/actiones in this new substrate? Often a contested object (e.g., is a smart-contract a person, a thing, or a procedure?) is exactly the place where the system's design-decisions matter most"
  - "the historical-contingency challenge: Justinian's 533 AD framework was developed for Roman slave-holding patriarchal society. Some of its details (Book I's exhaustive treatment of slaves, manumission, paterfamilias) reflect that context, not universal-structure. Practitioner-discipline: when invoking the triad as universal, distinguish (a) the structural-decomposition (genuinely universal across normative-procedural systems) from (b) the substantive-content (culturally-contingent). lex-bqxvx claims the FORM, not the CONTENT"
  - "the LLM/AI-design application: when designing AI-mediated normative systems (content-moderation policies, agent-permissions, automated-decision-systems), the persona/res/actiones triad provides the natural schema. Practitioner-discipline: structure your policy-language as (entity-class) × (resource-class) × (action-class) rather than as flat allow/deny lists. The triadic structure makes policy-conflicts visible (two policies may disagree on the same persona-res-actio triple) and supports systematic review (audit each axis independently)"
status: active
