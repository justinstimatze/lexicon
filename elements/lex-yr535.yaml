id: lex-yr535
name: defying-a-rule-for-its-own-sake-still-lets-the-rule-set-your-course
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When deciding how to relate to a rule you find illegitimate, check whether you're seeking out the transgression because it's forbidden, treating the violation itself as meaningful or authentic. That posture still lets the rule determine your behavior, just with the sign flipped. Genuine indifference looks different: weighing the rule's consequences as one more external, practical fact among others, with no special charge attached either way. Lukács diagnoses this exact trap in revolutionary movements' 'romanticism of illegality': 'by surrounding illegal means and methods of struggle with a certain aura, by conferring upon them a special, revolutionary \"authenticity\", one endows the existing state with a certain legal validity, with a more than just empirical existence. For to rebel against the law qua law, to prefer certain actions because they are illegal, implies for anyone who so acts that the law has retained its binding validity.' His proposed alternative posture treats the rule's cost as ordinary risk to be factored in, nothing more: 'the law and its calculable consequences are of no greater (if also of no smaller) importance than any other external fact of life with which it is necessary to reckon when deciding upon any definite course of action. The risk of breaking the law should not be regarded any differently than the risk of missing a train connection when on an important journey.'"
related: [lex-dbm5u]
evokes: [georg-lukacs, history-and-class-consciousness, legality-and-illegality, romanticism-of-illegality, rebel-against-the-law-qua-law, missing-a-train-connection]
lineage:
  - source: primary
    text: lukacs-1923-history-and-class-consciousness-legality-and-illegality-romanticism
    citation: "Georg Lukács, History and Class Consciousness (Malik-Verlag, 1923; Verso 2023 centenary edition, trans. Rodney Livingstone), essay 'Legality and Illegality,' §2."
    quote: "“For by surrounding illegal means and methods of struggle with a certain aura, by conferring upon them a special, revolutionary ‘authenticity’, one endows the existing state with a certain legal validity, with a more than just empirical existence. For to rebel against the law qua law, to prefer certain actions because they are illegal, implies for anyone who so acts that the law has retained its binding validity. Where the total, communist, fearlessness with regard to the state and the law is present, the law and its calculable consequences are of no greater (if also of no smaller) importance than any other external fact of life with which it is necessary to reckon when deciding upon any definite course of action. The risk of breaking the law should not be regarded any differently than the risk of missing a train connection when on an important journey.”"
canonical-instances:
  - "The direct textual anchor: Lukács names the specific failure the romanticism produces in practice -- Putschism's tendency to 'underestimate the actual strength possessed by capitalism even at a moment of crisis' -- treating the aura around illegality as more important than an honest read of the actual balance of power."
  - "Hypothetical: an employee who thinks a company's dress code is arbitrary and outdated starts showing up deliberately out of code every day, treating each violation as a small act of resistance worth savoring. A coworker who finds the same code equally pointless just wears whatever's comfortable and convenient, dressing within it on days it's easier and outside it on days it isn't, without either choice carrying any weight -- only the first employee is still organizing their mornings around the rule."
critical-questions:
  - "Is there a real practical difference between Lukács's 'genuine indifference' and the defiant posture he criticizes, if both result in the same rate of rule-breaking -- or does the distinction only matter for the internal experience and self-narrative of the rule-breaker, with no external behavioral signature to tell them apart?"
  - "Does treating a rule as a purely instrumental risk (like a missed train) risk under-weighting cases where the rule's enforcement carries a genuinely disproportionate cost -- prison, violence, social destruction -- that a train-connection analogy flattens into something more manageable than it actually is?"
status: active
