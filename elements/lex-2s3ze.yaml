id: lex-2s3ze
name: equivocation-shifts-a-words-sense-across-an-argument
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When an argument leans on a word that's used twice, check for equivocation: the word's sense shifts between uses. The argument's validity depends on a single meaning; if the meaning slides, the argument is broken even if each sentence is true."
related: [lex-382xa, lex-7qp5w, lex-8y3ch, lex-9ty22, lex-9uac6, lex-d7h2y, lex-fecdf, lex-rcj6y, lex-rd2qx, lex-sxt57, lex-v6nqz, lex-wb5ph, lex-xm754, lex-zd7vh, lex-zxrtf]
scaffolds-from: [lex-zxrtf]
evokes: [same-word-two-meanings, ambiguous-middle-term, term-shifts-sense-between-premise-and-conclusion, true-in-one-sense-argued-as-if-true-in-another, fallacy-of-four-terms, the-word-is-doing-two-jobs, conclusion-only-follows-if-the-word-drifts, define-the-term-and-the-argument-collapses, verbal-ambiguity-intercepts-the-real-question]
lineage:
  - source: primary
    text: mill-1843-book-v-ch-vii-fallacies-of-confusion
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843; final 8th ed. 1872). (Project Gutenberg #27942). Book V Ch.VII 'Fallacies Of Confusion', §1. Mill places the ambiguity-of-terms fallacy at the head of his fifth and last class of fallacies — those where the error is not a mis-estimate of evidence but an indistinct, fluctuating conception of what the evidence is. The signature move: 'something which is true if a word be used in a particular sense, is reasoned on as if it were true in another sense.' Crucially, there is no mal-estimation of evidence because there is no evidence to the point at all — the evidence bears on a *different* point, mistaken for the present one through confusion of meaning. Mill notes the fallacy operates in ratiocination two ways: (i) an ambiguous middle term, or (ii) a term taken in one sense in the premises and another in the conclusion. He gives examples of great practical weight where arguments are habitually founded on verbal ambiguity: 'scarcity of money' (currency / circulating-medium vs capital-seeking-investment, i.e. the rate of interest) — the ambiguity stands on the threshold and intercepts all attempts to throw light on the subject; 'influence of property' (persuasive respect/gratitude vs coercive fear/intimidation), the standing fallacy wielded against electoral-corruption reformers; and 'Theory' (the completed result of philosophical induction vs mere unverified speculation). He also relays Whately's paronymous-word cases ('projectors are unfit to be trusted; this man has formed a project, therefore...') and the etymological-sense trap on 'representative'. PD globally (Mill d.1873)."
    quote: "[Mill 1843 Book V Ch.VII §1 lines 29230-29237]: 'At the head of these stands that multitudinous body of fallacious reasonings in which the source of error is the ambiguity of terms: when something which is true if a word be used in a particular sense, is reasoned on as if it were true in another sense. In such a case there is not a mal-estimation of evidence, because there is not properly any evidence to the point at all; there is evidence, but to a different point, which from a confused apprehension of the meaning of the terms used, is supposed to be the same.' [Mill Book V Ch.VII §1, lines 29244-29247]: 'It occurs in ratiocination in two ways: when the middle term is ambiguous, or when one of the terms of the syllogism is taken in one sense in the premises, and in another sense in the conclusion.' [Mill Book V Ch.VII §1, lines 29320-29323, on scarcity-of-money]: 'the ambiguity of the language stands on the very threshold of the subject, and intercepts all attempts to throw light upon it.'"
canonical-instances:
  - "Aristotelian ancestry and modern continuity: the ambiguity fallacy is ancient — Aristotle's *Sophistical Refutations* treats homonymy (equivocation) and amphiboly as leading fallacies 'in the language' (in dictione). Mill 1843 systematizes it under 'Fallacies of Confusion' and credits Whately's *Elements of Logic* for the paronymous-word and etymological-sense subcases. Modern informal logic carries it as the 'fallacy of equivocation' and, in syllogistic form, the 'fallacy of four terms' (quaternio terminorum) — a syllogism that appears to have three terms but, because the middle term carries two senses, actually has four, voiding the inference."
  - "Scarcity-of-money canonical case (Mill Book V Ch.VII §1, lines 29308-29323): in commercial language 'money' means both currency (the circulating medium) and capital-seeking-investment (so 'the value of money is high' means the rate of interest is high). When loans are hard to get and interest is high — scarcity in the second sense — people conclude the circulating medium must have diminished and ought to be increased, an inference that only goes through if the two senses are the same. Mill's diagnostic: 'the ambiguity of the language stands on the very threshold of the subject, and intercepts all attempts to throw light upon it.' Practitioner-lesson: when a policy debate turns on a single high-traffic word, list its senses before evaluating any argument that uses it."
  - "Influence-of-property canonical case (Mill Book V Ch.VII §1, lines 29325-29339): 'influence of property' names both persuasive influence (respect for superior intelligence, gratitude for kind offices) and coercive influence (fear of a powerful person's ability to harm dependents). The standing fallacy against electoral-reformers: persuasive influence is beneficial, therefore (it is pretended) coercive influence ought not be restrained — valid only if the two senses of 'influence' are one. The case shows equivocation as a vehicle for motivated conclusions (operationally links to lex-rcj6y)."
  - "Theory canonical case (Mill Book V Ch.VII §1, lines 29341-29348): 'theory' properly means the completed result of philosophical induction from experience (in which sense theory is the explanation of practice), but is also used to mean mere unverified speculation. Arguments of the form 'that's just a theory' trade on sliding from the second sense to dismiss claims that have the first sense's evidential standing. A live contemporary instance: 'evolution is only a theory.'"
  - "Paronymous-word and etymological canonical cases (Mill via Whately, Book V Ch.VII §1, lines 29249-29303): Whately's 'projectors are unfit to be trusted; this man has formed a project, therefore he is unfit to be trusted' trades on the bad connotation of 'projector' not carried by 'project'; likewise 'presume'/'presumption', 'art'/'artful', 'design'/'designing'. Whately's note that 'the more slight the variation of the meaning, the more likely is the fallacy to be successful' is the practitioner's warning — gross ambiguity is caught, subtle sense-drift is not. The 'representative' case (etymological 'represent' = spokesman vs the legal/customary sense of independent-judgment delegate) shows the etymological-sense subtype."
  - "operationally distinct from lex-9ty22 strategic-ambiguity: lex-9ty22 names the deliberate maintenance of a vague/multivalent position so different audiences each hear their preferred meaning — a stance toward an utterance, intentional, and often defensible (diplomacy, negotiation). lex-2s3ze names an inference defect — a term's sense shifting unmarked within a single argument so the conclusion only appears to follow — which can be wholly unintentional. Discrimination: lex-9ty22 fires on 'this commitment was left deliberately readable two ways'; lex-2s3ze fires on 'this argument is invalid once the term is held to one sense throughout.'"
  - "operationally distinct from lex-d7h2y paltering: lex-d7h2y deceives by arranging literally-true statements to imply a falsehood — the misleading content is in what is selected and juxtaposed, every individual statement remaining true. lex-2s3ze defect is internal to one word's reference shifting across premises and conclusion. Paltering needs no ambiguous term; equivocation needs no false impression beyond the unsound inference. They can co-occur (a palter built on an equivocal key term) but are separately diagnosable."
  - "operationally distinct from lex-zxrtf naming-as-power: lex-zxrtf names control over which name/category attaches to a thing as a lever of power (who gets to call it 'terrorism' vs 'resistance'). lex-2s3ze is the downstream inference-defect that such contested terms enable — once a word carries two settled senses, an argument can slide between them. lex-zxrtf is about the politics of fixing meaning; lex-2s3ze is about the logic of meaning failing to stay fixed inside an argument."
  - "operationally distinct from lex-v6nqz eliminative-paired-comparison: lex-v6nqz (Mill Book III) gives the positive inductive method for isolating a cause; lex-2s3ze (Mill Book V) is the confusion-fallacy that can corrupt it — Mill explicitly notes (lines 29241-29244) that the ambiguity fallacy 'may affect the inductive process as well as the ratiocinative' when inducing from generalities to higher generalizations. The Mill-internal pairing: Book III says how to establish a cause; Book V Ch.VII says how a sliding term can wreck the establishment."
critical-questions:
  - "what distinguishes a fallacy from legitimate term-reuse? Whately's own example — 'murder should be punished with death; this man is a murderer, therefore he deserves to die' — varies the words (murder/murderer, deserve-death/ought-to-die) but preserves the meaning, and is sound. The fallacy is not word-variation; it is sense-variation that the word-sameness conceals. Diagnostic: rewrite each occurrence with its explicit definition; if the substitution preserves the inference, no equivocation; if the inference now visibly fails (two different definitions appear), equivocation is present."
  - "does the fallacy require intent to deceive? No. Mill stresses it is committed oftener in ratiocination than in direct induction precisely because in reasoning we are 'deciphering our own or other people's notes' rather than confronting things themselves — i.e. the confusion is often self-inflicted and sincere. This is what separates lex-2s3ze from lex-9ty22 strategic-ambiguity and lex-d7h2y paltering, both of which are intentional. Practitioner upshot: do not infer bad faith from an equivocation; the move can trap its own author."
  - "what's the practitioner-actionable intervention? Locate the term that carries the argument's weight, enumerate its senses, then substitute one fixed definition at every occurrence and recheck validity. If the argument requires sense A in the premise and sense B in the conclusion to go through, name the two senses explicitly — this usually dissolves the dispute, because (per Mill) the verbal ambiguity was 'on the very threshold' intercepting the real question. The constructive companion is lex-sxt57 stipulative-mark-set: fix a definition by stipulation to bypass the ambiguity rather than litigate the 'true' meaning."
  - "where does the ambiguity have to live to count? Mill locates it in the middle term (ambiguous-middle / fallacy-of-four-terms) or in a term taken one way in the premises and another in the conclusion. Both reduce to the same invariant: a single surface-word doing two semantic jobs within one inference. A word that is ambiguous across a whole discourse but used consistently within each argument is not committing this fallacy — the defect is intra-argument sense-shift, not lexical polysemy per se."
  - "how does this compose with other atoms? lex-2s3ze + lex-rcj6y motivated-reasoning: equivocation is a favored vehicle for motivated conclusions because the sense-shift is invisible to the motivated reasoner (the 'influence of property' case). lex-2s3ze + lex-fecdf inconceivability-fallacy: both are Mill Book V fallacy-detection atoms with type-out verdict; together with lex-v6nqz/0343 (Book III induction) they cover Mill's how-to-reason / how-not-to-misreason pair. lex-2s3ze + lex-sxt57 stipulative-mark-set: stipulation is the antidote — replace the contested term with an explicitly-marked one. lex-2s3ze + lex-zxrtf naming-as-power: contested-naming supplies the dual-sense terms that equivocation then exploits."
