id: lex-yuduw
name: coarse-win-threshold-hides-real-skill-differences
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Check how large a margin a scoring rule requires before it registers a winner at all -- a tied or drawn outcome doesn't by itself mean the competitors were equal, only that their gap fell inside the rule's blind spot. Reti's argument runs through a foot-race analogy: imagine a rule declaring that a margin of under one second counts as a dead heat. Under that rule the best runners in the world could never beat each other, not because they are equally fast but because the finish line's own resolution is too coarse to record a real gap that small. He grounds the same mechanism in chess history: in the medieval game the Rook was far stronger relative to the other pieces, the Bishop moved only two squares, and the Queen was weaker than the Bishop, so forcing a mate against resistance took an overwhelming material advantage -- 'too great a preponderance of pieces.' A player who had won a real, meaningful edge routinely could not convert it into the recognized win condition and the game registered as a stalemate or a piece-elimination draw instead. The result being a tie said nothing about the players' actual skill gap; it said only that the gap fell below the mate-threshold's resolution. Diagnostic move: when a scoring or grading system reports two cases as equal, ask what magnitude of difference the system's own win-condition can detect before concluding the underlying difference doesn't exist -- a threshold set too high manufactures ties out of real, smaller differences every time one falls inside its blind spot."
related: [lex-zn6gj, lex-tb3re]
evokes: [reti-modern-ideas-in-chess, capablanca-draw-death, foot-race-dead-heat, medieval-chess-piece-weakness, detection-floor, measurement-resolution]
lineage:
  - source: primary
    text: reti-1923-foot-race-dead-heat-analogy
    citation: "Richard Réti, Modern Ideas in Chess, trans. John Hart (London: G. Bell and Sons, 1923; this edition Dover Publications, 1974, with H. Golombek's 1942 foreword), Chapter VI 'Conclusion,' Section 44 'Reform in Chess,' pp.175-176."
    quote: "'It is the same as if with a race it has been agreed that a small difference of time, say a second, should not decide the race and that it should count as a dead heat. Such a result according to Capablanca would mean that the best runners could not beat each other.'"
  - source: primary
    text: reti-1923-medieval-chess-mate-threshold
    citation: "Richard Réti, Modern Ideas in Chess, same edition, Section 44 'Reform in Chess,' pp.176-178. A running header ('Reform in Chess 177') interposes mid-sentence at the page break in the source; the ellipsis below marks that skip."
    quote: "'In chess of the middle ages the moves of pieces were more limited as compared with ... those of to-day. The Rook was by far the strongest piece. The Bishop could only move two squares at a time and the Queen was weaker than the Bishop. The usual kind of victory at that time was by taking pieces (elimination of material)... To win by a mate, that is to say by one player actively mating the other, was, on account of the weakness of the pieces, well-nigh impossible. So to effect a mate it was necessary to acquire too great a preponderance of pieces... At that period they had not learnt that there could well be a preponderance, sufficient to enable a player to bring about a stalemate to the other side, but not sufficient to permit of that player enforcing a mate.'"
canonical-instances:
  - "Capablanca's own diagnosis, which prompted Reti's essay: as opening theory and technique matured, draws became so frequent between grandmasters that Capablanca proposed changing the starting position (swapping Rooks and Bishops) to revive decisive results -- treating the flood of draws as a sign that the game itself had become exhausted, rather than as a sign that its win-condition's threshold had stayed fixed while the players' skill gaps had shrunk below it."
  - "Hypothetical: a hiring bar set at 'top 1% of applicants' will report two candidates as equally unqualified even when one is genuinely, measurably stronger than the other, so long as neither clears the bar -- the bar's height, not the candidates' true gap, determines how many real differences get flattened into an identical 'rejected' outcome."
  - "operationally distinct from lex-zn6gj equal-interval-assumptions-favor-coarse-scales-over-fine-ones: that atom is about AGGREGATING ratings ACROSS DIFFERENT PEOPLE whose subjective scales have different granularities -- the unfairness comes from treating one person's whole-range jump as equal to another's sliver-of-range jump. This atom involves only ONE scoring rule and no cross-observer comparison at all; the coarseness is the win-condition's own detection floor, and it flattens a real difference between two specific competitors into an identical recorded outcome regardless of who is judging or how finely anyone perceives the gap."
critical-questions:
  - "Reti and Lasker's proposed fix is to score stalemates and lesser material advantages as partial wins rather than draws -- but this just relocates the threshold to a finer setting rather than eliminating it; any scoring rule with discrete categories will still flatten some real difference smaller than its finest distinction. Is there a point past which making the threshold finer stops being worth the added complexity of the scoring system?"
  - "Capablanca's own proposed fix (changing the starting position) was rejected as not addressing the mechanism, but a finer-grained threshold isn't the only way to widen the range of detectable outcomes -- would restoring decisive results by making the underlying skill gaps themselves larger (rather than making the detector finer) count as solving the same problem, or a different one?"
