id: lex-vgfgh
name: causal-cognition-stratifies-into-association-intervention-and-counterfactual-as-distinct-question-classes
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating a causal claim about a system (a treatment effect, a policy intervention, a 'because' utterance, a prediction conditioned on hypothetical action), apply Pearl's 2009 three-level hierarchy to identify WHICH KIND of question is actually being asked. The three levels are: (1) ASSOCIATION ('seeing') — P(Y | X), the conditional probability of Y given that I OBSERVED X took some value. Answerable from observational data alone; no causal model required. Statistical machine learning, correlation matrices, prediction-from-observation. (2) INTERVENTION ('doing') — P(Y | do(X)), the probability of Y given that I FORCED X to take some value, simulating an exogenous setting that breaks the natural data-generating process. Requires a causal model: the do-operator denotes deletion of the structural equations or edges that normally determine X, replacing them with a constant. Answerable from observational data plus a causal graph IF certain identifiability conditions hold (back-door criterion, front-door criterion, do-calculus rules). Randomized controlled trials directly sample this level. (3) COUNTERFACTUAL ('imagining') — P(Y_x | X', Y'), given that I observed X' and Y', what would Y have been if X had instead been x? Requires a fully-specified structural causal model (SCM) including a specification of the background variables U that determined the actual outcome. Answerable in general only from a complete SCM; not derivable from observation plus graph alone except under restrictive assumptions. Transferable diagnostic: when a causal claim is being made or evaluated, ask which question class it belongs to. Treating level-1 evidence as if it answered a level-2 or level-3 question is the dominant failure mode — observational studies inferring policy effects, ML models trained on observational data deployed in intervention contexts, retrospective 'what would have happened if' arguments built on association data without an explicit causal model. The level-classification is itself transferable beyond statistics: a debugging conversation about 'why did the system fail' is asking which question class — was the failure CORRELATED with X (association), would FORCING X to be different have prevented it (intervention), or would the specific failure NOT have happened in this instance had X been different (counterfactual)? Each demands different evidence. Operational consequences: (a) Higher levels are not derivable from lower levels alone — adding more level-1 data does not answer a level-2 question, no matter how much. The structural information at the higher level has to come from somewhere (experiment, graph assumption, mechanism knowledge). (b) Lower-level claims can be answered with higher-level data — if you have a counterfactual model, you can compute associations from it, but not vice versa. (c) The do-operator is a SYNTACTIC technical move: do(X = x) means 'delete the equations that normally determine X and set it to x.' It is not a transformation on data; it is a transformation on the model that generates the data. (d) Counterfactuals are particularly tricky in domains with intrinsic stochasticity — a single counterfactual outcome may not exist; only a probability distribution over counterfactual outcomes. Caveats: (a) The hierarchy holds for STRUCTURAL causal models; under-specified models can collapse levels in restricted contexts. (b) The names are stable but the formal apparatus differs across schools — Pearl's structural-equation framework, Rubin's potential-outcomes framework, and Lewis's closest-world counterfactuals are formally inter-translatable for recursive systems (Pearl proves this in §7.4) but use different notation; one school's vocabulary doesn't transfer wholesale to another. (c) Pearl 2018 (Book of Why) popularized the hierarchy as the 'ladder of causation'; that framing is more accessible but the structural definition is from the 2009 Causality 2nd ed."
