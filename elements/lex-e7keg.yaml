lineage:
  - source: primary
    text: wierzbicka-1996-semantics-primes-and-universals
    citation: "Anna Wierzbicka, *Semantics: Primes and Universals* (Oxford University Press, 1996). The book opens (Part I, 'General Issues') by diagnosing a regress problem in any definition-based account of meaning — if every word is defined via other words, the process either loops circularly or must terminate in some small set of underivable terms — and argues, against a century of Bloomfieldian/Chomskyan avoidance of meaning in linguistics and against the view (associated with Nelson Goodman) that 'primitive' status in a system of definitions is arbitrary, that natural language actually bottoms out in a determinate, non-arbitrary, empirically discoverable set of semantic primitives (semantic primes). Chapter 2, 'A Survey of Semantic Primitives', gives Wierzbicka's own worked inventory: 37 'old primitives' inherited and refined from her 1972 monograph *Semantic Primitives*, organized into substantives, determiners, quantifiers, mental predicates, speech, actions/events, evaluators, descriptors, time, space, partonomy/taxonomy, metapredicates, and interclausal linkers, plus a further set of 'new primitives' (SEE, HEAR, MOVE, THERE IS, LIVE, and others) proposed on the strength of continued cross-linguistic testing. The book's central empirical claim rests on the multi-author cross-linguistic volume Wierzbicka co-edited, *Semantic and Lexical Universals* (Goddard and Wierzbicka 1994), which tested the hypothesized primes against thirteen typologically and geographically diverse languages and found a lexical exponent for the proposed primes in each one tested. Chapter 3, 'Universal Grammar: The Syntax of Universal Semantic Primitives', extends the claim from a list of atoms to a combinatorial system: the primes combine according to a shared cross-linguistic 'mini-grammar' (valency patterns for predicates like DO, SAY, THINK), which licenses the book's proposed Natural Semantic Metalanguage (NSM) — a paraphrase system built entirely from primes, usable as a language-independent common measure ('tertium comparationis') for comparing meanings across languages and cultures without imposing the analyst's own language's conceptual perspective. Chapter 4 ('Prototypes and Invariants') and passages throughout the book's General Issues section explicitly argue against the Wittgensteinian 'family resemblances' doctrine and Roschian prototype semantics as an account of the semantic primes themselves, while conceding prototype effects for many complex, culturally elaborated concepts."
    quote: "[Ch.1 §2, 'Semantic Primitives (or Primes)':] 'The key to a rigorous and yet insightful talk about meaning lies in the notion of semantic primitives (or semantic primes)... One cannot define all words, because the very idea of \"defining\" implies that there is not only something to be defined (a definiendum) but also something to define it with (a definiens...).' [Same section, on ordinary circularity:] 'Without a set of primitives all descriptions of meaning are actually or potentially circular (as when, for example, to demand is defined as \"to request firmly\" and to request as \"to demand gently\").' [Same section, quoting Aristotle on why a definition must proceed through terms 'prior and more intelligible':] 'First of all, see if he [the analyst] has failed to make the definition through terms that are prior and more intelligible. For the reason why the definition is rendered is to make known the term stated... accordingly, it is clear that a man who does not define through terms of this kind has not defined at all.' [Same section, on the semantic hierarchy this entails:] 'One cannot understand the concept of \"implication\" without first understanding the semantically more basic concept of \"if\".' [Ch.9, 'Semantics and Lexicography', on how far ordinary dictionary circularity actually extends, discussing a real dictionary's entwined entries for QUESTION and ANSWER:] 'An answer is \"something said to deal with a sentence requesting something said to deal with a sentence requesting...\" and so on, ad infinitum. And yet the essence of a question, or an answer, is not difficult to state: the question refers to a situation when, roughly speaking, someone says \"I want to know something, I want someone to tell me\" and answer means, roughly, \"telling someone something that they said they wanted to know\"... Typically... vicious circles are like huge webs enveloping whole extended families of words, or like gigantic tentacles extending throughout the pages of a dictionary.' [Same chapter, invoking Pascal's mock-definition of light as the reductio of self-defining circularity:] 'There are people who go as far in absurdity as to explicate a word by itself. I know some who have defined lumière (\"light\") like this: \"La lumière est un mouvement luminaire des corps lumineux\" [Light is a luminary movement of luminous bodies]; as if one could understand the words luminaire and lumineux without understanding lumière... Circularity involves the same kind of regressus ad infinitum.' [Ch.2 §A, 'Old Primitives', Wierzbicka's own inventory:] 'The set of old primitives includes the following elements: [substantives] I, YOU, SOMEONE, SOMETHING, PEOPLE; [determiners] THIS, THE SAME, OTHER; [quantifiers] ONE, TWO, MANY (MUCH), ALL; [mental predicates] THINK, KNOW, WANT, FEEL; [speech] SAY; [actions and events] DO, HAPPEN; [evaluators] GOOD, BAD; [descriptors] BIG, SMALL; [time] WHEN, BEFORE, AFTER; [space] WHERE, UNDER, ABOVE; [partonomy and taxonomy] PART (OF), KIND (OF); [metapredicates] NOT, CAN, VERY; [interclausal linkers] IF, BECAUSE, LIKE.' [Same chapter, on the cross-linguistic test of that inventory:] 'The languages investigated in this volume included: Ewe (of the Niger-Congo family in West Africa), Mandarin Chinese, Thai, Japanese, the Australian languages Yankunytjatjara, Arrernte (Aranda), and Kayardild, three Misumalpan languages of Nicaragua, the Austronesian languages Acehnese (of Indonesia), Longgu (of the Solomon Islands), Samoan, and Mangap-Mbula (of New Guinea), the Papuan language Kalam, and — the only European language beside English — French... In most cases, words (or bound morphemes) for the proposed primitives (e.g. \"I\" and \"you\", \"someone\" and \"something\", \"here\" and \"when\", \"big\" and \"small\", \"good\" and \"bad\", or \"do\" and \"happen\") could be readily identified.' [Ch.3, 'Universal Grammar: The Syntax of Universal Semantic Primitives', stating the combinatorial claim:] 'Most grammatical patterns in any language are language-specific, but there may also be some patterns which are universal... Therefore, in searching for universal grammatical patterns, we should not be looking for universals of form, but rather for universals of combinability.' [Ch.1 §6, on the Natural Semantic Metalanguage and avoiding ethnocentrism:] 'For any comparison requires a tertium comparationis, a common measure. If by investigating as many diverse languages as possible we can establish a hypothetical shared core of all natural languages, we can then treat this shared core as a language-independent metalanguage for the description and comparison of all languages and cultures. Without such a language-independent metalanguage, we would be for ever condemned to ethnocentrism, for we could only describe other languages and cultures through the prism of our own language.' [Ch.1 §7, 'Semantic Invariants', naming the family-resemblances doctrine as her theory's chief opponent:] 'In recent decades, semantics has suffered at the hands not only of its enemies but also of some of its friends. As I will argue in detail later (see in particular Chapter 4), especially harmful to its progress has been the doctrine of \"family resemblances\" and the associated attacks on the notion of semantic invariant — a corner-stone of effective semantic analysis.'"
canonical-instances:
  - "Wierzbicka's own 37-item inventory of 'old primitives' (Chapter 2), organized into substantives (I, YOU, SOMEONE, SOMETHING, PEOPLE), determiners, quantifiers, mental predicates (THINK, KNOW, WANT, FEEL), speech (SAY), actions/events (DO, HAPPEN), evaluators (GOOD, BAD), descriptors (BIG, SMALL), time, space, partonomy/taxonomy, metapredicates, and interclausal linkers — cross-checked and confirmed via the *Semantic and Lexical Universals* (1994) fieldwork project against thirteen typologically unrelated languages (Ewe, Mandarin Chinese, Thai, Japanese, three Australian languages, three Misumalpan languages of Nicaragua, three Austronesian languages, one Papuan language, French)."
  - "The circular-dictionary pair 'demand = to request firmly' / 'request = to demand gently' as the paradigm micro-case of definitional circularity, contrasted with a non-circular chain that actually bottoms out at a primitive: 'evil = very wicked', 'wicked = very bad' — terminating at BAD, one of Wierzbicka's own proposed primes, rather than looping."
  - "Pascal's mock-definition of light — 'La lumière est un mouvement luminaire des corps lumineux' ['Light is a luminary movement of luminous bodies'] — cited by Wierzbicka as the reductio of trying to define a word by itself, and the real Oxford dictionary's entwined QUESTION/ANSWER entries (looping through REFUSE, CALL, OFFER, ACCEPT, CLAIM) as an example of the same failure at dictionary-wide scale rather than in a single word-pair."
  - "The combinatorial 'universal grammar of primes': DO opening an agent-slot plus an action-complement slot, and SAY opening a bare-complement option plus an optional addressee option ('SAY' vs 'SAY TO'), recurring across the typologically diverse languages tested — Wierzbicka's evidence that the primes are not just a shared vocabulary list but a shared shallow syntax, which is what licenses building the Natural Semantic Metalanguage as a cross-linguistic paraphrase system."
critical-questions:
  - "Tracing this definition's chain of 'A is defined via B, B via C...' — does it actually terminate in an indefinable term, or does it loop back to A (or spread into a tangled web of mutually-defining terms, as with real dictionaries' QUESTION/ANSWER-style entries)?"
  - "Has an apparently rigorous stopping-point actually just smuggled in an undefined term dressed as a definition — a 'scientific-sounding word of Latin origin' (Wierzbicka's own example: glossing 'if' as 'implication') standing in for an unanalyzed primitive rather than an actual further decomposition?"
  - "Is the concept being claimed as a linguistic/conceptual universal actually attested with a lexical exponent across typologically diverse, unrelated languages — or is it merely a feature of the analyst's own language (usually English) being read into others, risking exactly the ethnocentrism a language-independent metalanguage is meant to avoid?"
  - "Does the combinatorial claim hold — do the primes in question combine according to the same cross-linguistically-recurring valency patterns — or is what looks like a primitive actually language-specific in how it combines with other terms?"
  - "Is this concept actually a semantic PRIME with a sharp invariant meaning, or is it a complex, culturally-elaborated category better described by lex-2vpet's crisscrossing-similarities pattern — and is 'it's fuzzy so there's no invariant' being asserted about a term without checking whether that fuzziness sits at the primitive level or several layers of composition above it?"
