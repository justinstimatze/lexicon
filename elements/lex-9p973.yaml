id: lex-9p973
name: remove-the-capacity-for-the-compulsion-not-the-person-who-has-it
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone incorrigible has caused real harm through a compulsion, killing them isn't the only alternative to letting them continue -- targeting the specific capacity the compulsion depends on can end the harm while leaving room for the person to actually change. In Cushing's telling, two War-gods finally defeat a gambler-demon who has ruined and killed countless victims over the years, and debate what to do with him: 'We can't kill him; yet, if we leave him to go his own way, he will gamble and gamble without ceasing, and make no end of trouble. Suppose we make a good man of him.' Their solution is neither death nor release: 'Pluck out his eyes.' They remove the specific capacity his compulsion runs on, not the man himself. What follows is genuine transformation, not just incapacitation: blinded, he abandons his den and his hoarded winnings, 'relinquished all thought of his possessions, gave up his former bad inclinations, and turned westward toward the City of the Gods.' The punishment was aimed at the mechanism of the harm, and reform followed from that precision rather than from mercy alone. Diagnostic move: when someone poses ongoing danger through a specific compulsive capacity rather than through their existence itself, consider whether the harm can be ended by removing that specific capacity, rather than defaulting to a choice between destroying the person and leaving the capacity intact."
related: []
evokes: [target-the-mechanism-of-the-harm-not-the-person, cushing-the-hermit-mitsina, suppose-we-make-a-good-man-of-him, gave-up-his-former-bad-inclinations]
lineage:
  - source: primary
    text: cushing-war-gods-blind-mitsina-instead-of-killing-him
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Hermit Mitsina.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'We can't kill him; yet, if we leave him to go his own way, he will gamble and gamble without ceasing, and make no end of trouble. Suppose we make a good man of him. How? asked the other. Pluck out his eyes. Capital! exclaimed the first. So, while one of them held the old fellow down, the other gouged out his eyes ... he ... gave up his former bad inclinations, and turned westward toward the City of the Gods and Souls.'"
canonical-instances:
  - "A professional licensing board, faced with a surgeon whose compulsive overconfidence has caused repeated harm to patients, revokes the license to operate rather than pursuing criminal punishment, removing the specific capacity the pattern depends on while leaving the person free to rebuild a different kind of life."
  - "A casino bars a problem gambler from every property and enrolls them in a self-exclusion program rather than simply letting them lose everything or having them removed from society, targeting their capacity to access the compulsion rather than trying to punish the person for having it."
critical-questions:
  - "Does the specific capacity removed, Mitsina's eyesight, actually map cleanly onto the compulsion itself, given that gambling with cane-cards presumably requires sight to read the throws -- would this solution work as cleanly against a compulsion whose operative capacity is harder to isolate and remove?"
  - "Is the reform that follows actually caused by the loss of capacity, or could Mitsina have continued gambling by other means and it's the humiliation and total loss of possessions, not the blindness itself, that produced the change of heart?"
  - "Would this approach be considered just if applied to a human being with rights and due process, rather than a mythic demon defeated by gods -- does the story's moral logic depend on Mitsina's inhuman, incorrigible nature in a way that limits how far the principle generalizes?"
status: active
