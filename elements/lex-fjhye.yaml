id: lex-fjhye
name: mutual-dependency-undermines-a-one-way-foundational-claim
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone argues that domain A is the 'ultimate basis' of domain B -- A explains B, B is derivative of A, understanding B requires understanding A first -- check whether the exact same style of argument runs just as well in reverse. Popper's critique of Marx's economism does this directly. Marx held that the economic background is the ultimate basis of intellectual and ideational development: you can't fully understand the history of ideas without their economic conditions. Popper concedes the forward direction has real merit -- 'it is impossible fully to understand mental developments without understanding their economic background' -- but then runs the identical test in the other direction: 'it is at least as impossible to understand economic developments without understanding the development of, for instance, scientific or religious ideas.' If dependency runs both ways with comparable force, the claim that one side is foundational and the other merely derivative doesn't survive -- you're left with two things that mutually condition each other, which is a real and useful finding, but a different finding than the one-way priority claim that was actually being argued for. Diagnostic move: when a 'base' is proposed for some 'superstructure' -- economics under ideas, biology under culture, infrastructure under strategy, technology under society -- take the exact justification offered for that direction of dependency and try running it unchanged in reverse. If the reversed argument lands with similar force, what you've actually found is mutual interdependence -- a real result, but a different one than the asymmetric foundational relationship the original claim needed."
