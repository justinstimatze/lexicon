name: standing-on-the-boundary-itself-lets-an-actor-move-things-either-direction
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "An actor who refuses to fully commit to either side of a boundary (inside/outside, private/public, order/disorder), and instead positions themselves exactly on the threshold between the two, gains something neither side has: the ability to move things in either direction, functioning as the agent by which others cross from one state to the other. Hyde frames Hermes' entire method around this specific position, reading the moment the infant god first leaves his mother's cave: '\"He crossed the threshold\": here is the boundary-crosser on the boundary itself. He is leaving his mother, his cradle, the earth, the underworld, the private, the dark; he is entering the sunlight, the public, the uncovered, the outer and upper worlds of the sky gods... Poised on the threshold, he is in his world, the crepuscular, shady, mottled, ambiguous, androgynous, neither/nor space of Hermetic operation, that thin layer of topsoil where all these things are not yet differentiated. From this position Hermes can move in either direction or, more to the point, act as the agent by which others are led in either direction.' The structural point is that neither the fully private, cave-bound world nor the fully public, sky-god world can do what the threshold position does -- an actor fully inside one domain can only ever move within it, while the threshold-occupant is the one thing common to both domains and therefore the only position from which traffic between them can be directed at all. Diagnostic move: when you need to move something (information, status, a person) from one bounded domain into another, look for or become the actor who occupies neither domain fully but stands at their shared edge -- that position, not deeper commitment to either side, is what makes directing the crossing possible."
