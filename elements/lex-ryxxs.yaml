id: lex-ryxxs
name: surveying-a-whole-population-voids-the-premise-of-a-significance-test
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before running a significance test on a dataset, check what the data actually IS relative to the population you care about — if you surveyed everyone rather than a sample of them, the test's foundational premise doesn't apply, no matter how the calculation comes out. Merton, Reader, and Kendall flag this as one of their explicit reasons for not applying traditional significance tests to the Student-Physician data: 'these tests presuppose that the units being studied were sampled randomly from the populations to which they belong. We have administered our questionnaires to the total student bodies of three medical schools; in no sense can these groups be considered random samples, or even, for that matter, samples. There is a real question, therefore, whether there would be any justification at all for making use of traditional tests of significance.' A significance test exists to answer one specific question: could this observed difference have arisen merely from the accident of which particular units happened to land in a random sample, rather than reflecting a real difference in the underlying population? That question is only coherent when there IS a sample distinct from a larger population it was drawn from. When every unit in the population of interest has already been measured — every student at three medical schools, not a sample of students meant to represent some larger group of medical students generally — there is no sampling error left to test against, because there was no sampling step at all. Any observed difference among a fully-surveyed population is simply a fact about that population, not an estimate subject to sampling variability. Diagnostic move: before treating a p-value or confidence interval as meaningful, ask what larger population the data was drawn FROM, and by what mechanism — if the answer is 'this data covers everyone in the group we actually care about, with no larger population it represents,' a significance test is answering a question that was never actually being asked, regardless of what number the calculation produces."
