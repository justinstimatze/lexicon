id: lex-3utgm
name: separate-what-information-counts-from-how-its-combined
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before arguing for or against an evaluative theory (a theory of justice, a scoring system, a metric), separate two independent questions it answers: what kind of information gets counted at all, and how the counted information gets combined into a verdict. Sen: “It is particularly relevant in this context to examine two different but interrelated aspects of the informational basis of these theories, which I shall call basal space and aggregation system, respectively. The basal space of a theory of justice refers to the general class of variables to which the assessment of justice is sensitive under that theory, and (no less importantly) excludes other variables, even though these variables can be indirectly important through their causal influences on the basal space, or as informational proxies for unobserved basal variables.” Take utilitarianism as a worked case: individual utilities fill the basal-space slot, and simple addition (sum-ranking) fills the aggregation-system slot. Each slot was filled by a separate decision that could have gone another way, and each is open to criticism on its own terms. Swap in a different basal space (rights, capabilities, primary goods) while keeping sum-ranking, or keep utilities as the basal space while swapping in a different aggregation rule (giving extra weight to the worst-off, say), and you get a different theory each time. Diagnostic move: when critiquing or defending an evaluative framework, name which of the two choices is actually doing the work in your argument. An objection aimed at the aggregation system (it ignores the worst-off) doesn't touch the basal space (should utility even be the thing we're aggregating), and conflating the two produces arguments that miss their target."
