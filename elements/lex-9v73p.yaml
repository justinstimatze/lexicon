id: lex-9v73p
name: feigned-reluctance-to-preserve-pride-can-overshoot-and-destroy-the-opportunity
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Calculated reluctance meant to preserve dignity in a moment of real desire can be pitched too strongly, driving away the very opportunity it was managing rather than merely delaying it. The reluctance was never meant to be taken at face value, but nothing in the performance signals that to the other party. In the Jataka's tale of the pining she-ass, an animal who has pined to death for a horse reasons that yielding immediately would be undignified: 'If I make myself cheap, and let him have his way as soon as he has come here, my honour and pride will perish. I must make as though I did not wish it.' She rebuffs him violently at first contact. He leaves for good, offended, and she dies of the regret. The performance succeeded completely at preserving her pride. It also ended the only chance the pride was meant to protect."
related: []
evokes: [jataka, tikanipata, vatagga-sindhava-jataka, calculated-reluctance-pitched-too-strongly-destroys-its-own-opportunity, dignity-management-that-overshoots-its-target]
