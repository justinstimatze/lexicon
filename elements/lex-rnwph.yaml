id: lex-rnwph
name: walton-style-defeasible-scheme-classification
type-in: claim
type-out: posture
_tier: molecule
agent-instruction: "When you see a recurring argument shape (premises + presumption + defeasibility-hook), match it to a Walton scheme. The scheme tells you the standard defeaters (the critical questions) to probe. Re-using the scheme saves re-inventing the audit."
related: [lex-af9ax, lex-kebfa, lex-th68b, lex-hesjt, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-tpv83, lex-chtk9, lex-9uac6, lex-xqamc, lex-jafkg, lex-ppm3j, lex-zfgj2, lex-ht9ud]
scaffolds-from: [lex-af9ax, lex-kebfa, lex-th68b, lex-hesjt, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-ht9ud]
evokes: [argumentation-scheme-family, walton-catalog, defeasible-presumption-shape, scheme-as-kind, classification-not-composition, the-shared-skeleton-across-six-schemes]
pedagogy-gloss: "The six Walton-style argumentation schemes (sign, position-to-know, commitment, slippery-slope, analogy, ignorance) all instantiate the same defeasible-presumptive shape: sequential evidence-preparation steps closed by a defeasibility-attach bound to a critical-question checklist. The label makes the shared shape machine-checkable instead of a prose observation."
