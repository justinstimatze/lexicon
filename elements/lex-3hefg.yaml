id: lex-3hefg
name: trust-formation
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When evaluating whether to trust someone, decompose into ability, benevolence, and integrity. Trust is multidimensional; betrayals usually fail just one axis. Track which axis a violation belongs to before generalizing the distrust."
