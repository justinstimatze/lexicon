evokes: [exit-barriers-specialized-assets-managements-loyalty, excess-capacity-remains-functioning, healthy-competitors-suffer-as-the-sick-ones-hang-on, please-note-location-of-nearest-exit]
lineage:
  - source: primary
    text: porter-1979-exit-barriers
    citation: "Michael E. Porter, 'How Competitive Forces Shape Strategy,' Harvard Business Review, March-April 1979, section 'Jockeying for position,' on exit barriers as a driver of persistent industry rivalry and overcapacity. Porter cites his own earlier treatment: 'Please Note Location of Nearest Exit,' California Management Review, Winter 1976, p. 21."
    quote: "Exit barriers are high. Exit barriers, like very specialized assets or management's loyalty to a particular business, keep companies competing even though they may be earning low or even negative returns on investment. Excess capacity remains functioning, and the profitability of the healthy competitors suffers as the sick ones hang on. If the entire industry suffers from overcapacity, it may seek government help — particularly if foreign competition is present."
canonical-instances:
  - "a basic-materials industry (paper, aluminum) where failing plants with highly specialized, non-redeployable equipment keep running rather than shutting down, holding industry-wide prices down for the well-run competitors too."
  - "a shrinking print-media market where publishers with no other use for their physical printing assets keep publishing at a loss rather than liquidating, suppressing ad rates for every remaining publisher including digitally-adapted ones."
  - "an oversupplied gig-work category where workers who have specialized their equipment or reputation entirely around that one platform keep accepting below-viable rates rather than exiting, holding rates down for every worker in the category."
critical-questions:
  - "isn't this just the sick companies being irrational — why not treat it as a sunk-cost bias story? The mechanism is structural rather than purely psychological: even a perfectly rational manager facing high exit costs (a plant with no resale value, a workforce with no other buyer for their specialized skill) may correctly calculate that continuing to operate, even at a loss, is better than the one-time cost of exiting. Sunk-cost bias is a cognitive error in valuing the past; exit barriers are real, forward-looking costs of leaving that can make continued operation the genuinely rational choice for the trapped firm, even though it's collectively bad for the market."
  - "does the depressed profitability only hurt the failing competitors themselves? No — this is the atom's core claim: 'the profitability of the healthy competitors suffers as the sick ones hang on.' The weak competitors' continued presence keeps supply elevated, which holds down prices and margins for every participant, healthy or not. The drag is a market-wide externality generated by a few trapped participants."
  - "how is this different from lex-7mr6w survival-test-mistaken-for-purpose-degrades-purpose-attainment? lex-7mr6w is about an organization mistaking its own survival metric for its actual purpose, hollowing out the purpose from within. This atom is about a MARKET-LEVEL dynamic where OTHER firms' inability to exit depresses returns for firms that have no such confusion about their own purpose — the mechanism is external structural drag from other market participants, not internal metric-substitution within one organization."
