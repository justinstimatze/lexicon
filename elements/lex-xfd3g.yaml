evokes: [georg-lukacs, history-and-class-consciousness, legality-and-illegality, power-factor-not-arbiter, gone-over-to-bourgeois-territory, capturing-the-institution-vs-opposing-it]
lineage:
  - source: primary
    text: lukacs-1923-history-and-class-consciousness-legality-and-illegality-power-factor
    citation: "Georg Lukács, History and Class Consciousness: Studies in Marxist Dialectics (Malik-Verlag, 1923; Verso 2023 centenary edition, trans. Rodney Livingstone), essay 'Legality and Illegality,' §1."
    quote: "“The great distinction between revolutionary Marxists and pseudo-Marxist opportunists consists in the fact that for the former the capitalist state counts merely as a power factor against which the power of the organised proletariat is to be mobilised. Whilst the latter regard the state as an institution standing above the classes and the proletariat and the bourgeoisie conduct their war in order to gain control of it. But by viewing the state as the object of the struggle rather than as the enemy they have mentally gone over to bourgeois territory and thereby lost half the battle even before taking up arms.”"
canonical-instances:
  - "The direct textual anchor: Lukács names the consequence built into the 'opposition' framing directly -- 'to adopt the stance of \"opposition\" means that the existing order is accepted in all essentials as an immutable foundation and all the efforts of the \"opposition\" are restricted to making as many gains as possible for the workers within the existing system' -- the framing itself sets the ceiling on what the fight can even achieve."
  - "Hypothetical: two factions inside a company compete for the CEO's approval on a strategic direction, each treating executive sign-off as the prize to be won. A third employee refuses to play that game at all, building the product traction that makes the executive's opinion irrelevant to what actually ships -- the first two factions have already conceded that the CEO's authority is the thing that decides the outcome, while the third treated that authority as a power factor to route around rather than a prize to capture."
critical-questions:
  - "Is treating an institution as a power factor rather than a prize always available as a strategy, or does it require the challenger to already have some independent base of power that doesn't run through the institution being contested -- meaning the framing choice might be a symptom of relative strength rather than a cause of it?"
  - "Lukács frames this as a binary (power-factor vs. object-of-struggle), but is there a genuine middle position -- contesting control of an institution while still treating that control as instrumentally useful rather than as conferring legitimacy -- or does his argument hold that any contest for control collapses into the legitimating frame regardless of the contestant's stated intent?"
