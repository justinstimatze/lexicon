evokes: [regressional-goodhart, tails-come-apart, noise-selection-is-unavoidable, the-ceiling-on-G-is-below-the-ceiling-on-M, lewis-2014-why-the-tails-come-apart, no-perfect-proxy]
lineage:
  - source: primary
    text: manheim-garrabrant-2019-categorizing-variants-of-goodharts-law
    citation: "David Manheim and Scott Garrabrant, 'Categorizing Variants of Goodhart's Law' (arXiv:1803.04585, v4, 24 February 2019), Section 1 'Regressional Goodhart.' The paper formalizes the simplest of the four Goodhart variants: M = G + normal(mu, sigma^2). Because the noise term has positive expected value conditional on M being large, selecting high-M states yields a population whose expected G is predictably below expected M. The variant is named 'regressional' because it is the same statistical phenomenon as regression-to-the-mean operating on the gap between proxy and goal. Manheim-Garrabrant cite Gregory Lewis (Thrasymachus) 2014 'Why the tails come apart' (Lesswrong.com) as the canonical informal articulation. The contribution of this atom over lex-tb3re (the umbrella Goodhart claim) is to name the specific mechanism — the noise-selection effect — that makes proxy-degradation inevitable for any imperfect metric, separable from the three other mechanisms (extremal, causal, adversarial) that may or may not also be operating in a given situation."
    quote: "Regressional Goodhart - When selecting for a proxy measure, you select not only for the true goal, but also for the difference between the proxy and the goal. This is also known as 'Tails come apart.' Simple Model: M = G + normal(mu, sigma^2). Due to the noise, a point with a large M value will likely have a large G value, but also a large noise value. Thus, when M is large, you can expect G to be predictably smaller than M. Despite the lack of bias, for large values of c the values of G when M > c is expected to be higher than otherwise. While this is the simplest Goodhart effect, it is also the most fundamental: it cannot be avoided. No matter what measure is chosen for optimization, an inexact metric necessarily leads to a divergence between the goal and the metric in the tail."
canonical-instances:
  - "athletic recruitment by single metric: a college selects basketball recruits on the high tail of 'points-per-game' as a proxy for 'will-help-us-win.' The high-PPG tail necessarily includes players who reached that PPG partly through factors orthogonal to winning (volume shooters on bad teams, gunner archetypes in low-competition conferences, inflated stat-tracking). The recruited cohort's average win-contribution is predictably below their average PPG. No coach is gaming the metric; no regime change has happened; the regression failure is purely statistical"
  - "hiring on the tail of standardized-test scores: SAT/GMAT correlates with on-the-job performance at the population mean (r ~ 0.3-0.5 in meta-analyses). Selecting the top 1% on the test does NOT yield the top 1% on the job — by construction, the top-1% test cohort includes outsized representation of test-noise (good test-prep access, narrow specialization at the testing skill). The on-the-job ceiling is structurally below the test-score ceiling for the selected cohort. This is the same point Lewis 2014 makes with NBA height: tallest 1% of humans are not the best 1% of basketball players, because best-basketball-player has many components, of which height is one"
  - "high-stakes ML-benchmark optimization: a model selected as 'best on benchmark X' is best-on-benchmark plus best-at-noise-paths-of-benchmark-X. As soon as benchmark X becomes the selection criterion (rather than one diagnostic among many), the selected model's real-world capability is predictably below its benchmark score. This is regressional Goodhart even before the model is gaming the eval, and even before the eval distribution drifts from deployment"
  - "academic-citation rankings: high citation count correlates with quality of work but selecting on the top-citation tail also selects for hype, citation-cartel membership, controversial-claim notoriety, and survival bias. The top-cited cohort's average quality is predictably below their average citation count — a problem that exists EVEN before authors strategize for citations (which would be lex-nbk6e adversarial Goodhart layered on top)"
  - "venture-capital outlier-fund mythology: VC firms with top-quartile fund returns are disproportionately also top-quartile lucky. The fund-return tail includes a noise component that does not reproduce — the same firm's NEXT fund regresses toward the mean. This is regression-to-the-mean operating on the proxy-goal gap; the proxy is 'last-fund-return' and the goal is 'true-firm-skill,' and the gap widens at the high tail. The structural feature of the VC ecosystem (huge variance, small sample, infrequent reps) makes this Goodhart variant particularly bitter"
critical-questions:
  - "what is the correlation between this proxy and the underlying goal at the POPULATION level, and what's the standard deviation of the gap? Without these two numbers, you cannot estimate how far expected G falls below expected M in the selected tail. If the answer is 'we don't know' — the entire tail-selection program is operating without a budget for the regressional gap, and it will overpromise"
  - "are you selecting against a SINGLE proxy or against multiple uncorrelated proxies? Regressional Goodhart bites hardest on single-scalar selection. Joint selection on multiple proxies (provided their noise terms are uncorrelated) shrinks the regressional gap — the noise paths that satisfy one proxy do not generally satisfy a second. This is one of the few defenses that genuinely lowers the regressional ceiling-loss, not just hides it"
  - "are you reporting expected M (the proxy) or expected G (the goal) when communicating to stakeholders? Reporting M for a tail-selected cohort SYSTEMATICALLY overstates the achieved G. This is dishonest by mechanism even when the reporter is honest. The discipline is to either select less aggressively (lower c so the regressional gap is smaller), or to apply a tail-shrinkage estimator before reporting"
  - "have you confused regressional Goodhart with selection effects, regression-to-the-mean, or winner's-curse? They are all manifestations of the same statistical structure: conditioning on the high tail of a noisy proxy yields a population whose true-value distribution has regressed toward the mean. Winner's curse in auctions, regression-to-the-mean in athletic performance, and regressional Goodhart in metric-based selection are NOT three separate phenomena; they are the same phenomenon in three vocabularies"
  - "does this Goodhart fire even in the absence of gaming? YES, by mechanism — and that is the test for whether you are looking at regressional Goodhart specifically (as opposed to lex-nbk6e adversarial, where an agent gaming-the-metric is the cause of the gap). If removing all agent-gaming would close the gap, you are looking at adversarial Goodhart; if removing all agent-gaming would still leave a structurally-predictable gap because the proxy is imperfect, you are looking at regressional Goodhart"
