id: lex-3gwxp
name: an-ordinary-object-transforms-into-a-lethal-weapon-the-instant-it-is-seized-in-anger
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'At a gathering of kin already primed for conflict, an ordinary harmless object can become a deadly weapon the moment it is picked up in anger, with the resulting mutual violence destroying an entire group from within rather than through any external enemy. In the Jataka''s tale of Ghata, a plant leaf becomes a killing club the instant one of the brothers seizes it in rage: "At last one of them, finding nothing better for a club, picked a leaf from the eraka plant, which even as he plucked it became a club of acacia wood in his hand."'
related: []
evokes: [jataka, dasanipata, ghata-jataka, internecine-self-destruction, mahabharata-mausala-parva, cadmus-sown-teeth]
lineage:
  - source: primary
    text: jataka-chalmers1895-ghata-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 454, Ghata-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "At last one of them, finding nothing better for a club, picked a leaf from the eraka plant, which even as he plucked it became a club of acacia wood in his hand."
canonical-instances:
  - "At a family reunion already tense over an inheritance dispute, an ordinary kitchen argument turns violent the instant one relative grabs a nearby chair, and within minutes half the family is fighting the other half over grievances that had nothing to do with the chair itself."
critical-questions:
  - "The object that turns into a weapon looks like the cause, but the gathering was already volatile enough that almost anything within reach could have filled that role — so what work is the object actually doing in the explanation?"
status: active
