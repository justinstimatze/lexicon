id: lex-v7dty
name: match-reward-type-to-the-users-underlying-need-not-just-size
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when designing or evaluating an incentive, reward, or reinforcement mechanism meant to drive repeat behavior -- and especially when the instinct is to make the reward bigger or more valuable rather than to check whether it's the RIGHT KIND of reward. Eyal's typology splits variable rewards into three kinds -- rewards of the tribe (social validation, connectedness), rewards of the hunt (resources, information, material gain), and rewards of the self (mastery, competence, completion) -- and the atom's claim, drawn from Eyal's own head-to-head case comparison, is that a reward's power to drive repeat engagement comes from how precisely its TYPE matches the specific underlying need or internal trigger driving the behavior, not from the reward's absolute size or market value. Mahalo Answers offered a real cash bounty ('Mahalo Dollars,' redeemable for actual money) for answering questions and failed to retain users; Quora, launched around the same time, offered zero monetary reward for the identical task (answering questions) and thrived, because its upvote system delivered rewards of the tribe -- social recognition from peers -- which was the reward type that actually matched why people wanted to answer questions on a Q&A site in the first place. The lesson is not 'social rewards beat money rewards' as a general rule (money is the correct reward type in many domains); it is that reward-type-matching dominates reward-magnitude when the two are in tension. A designer who assumes 'people like money, right?' without asking what psychological itch the behavior is actually scratching can offer a large, objectively valuable reward and still see no engagement lift -- because a mismatched reward, however large, doesn't reinforce the actual driver. Operational sequence: (1) identify the specific internal trigger or need the target behavior is meant to satisfy (boredom, social validation, mastery, resource acquisition, connection); (2) classify which of the three reward types (tribe/hunt/self) most directly answers that specific need; (3) only then decide on magnitude within that type -- gamification elements (points, badges, leaderboards) layered onto a mismatched reward type will not compensate for the mismatch, and a product with no underlying user need at all ('no ongoing itch') cannot be rescued by any reward design, however well-matched."
