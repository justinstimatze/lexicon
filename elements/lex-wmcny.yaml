lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 6 'Conflicts and Dilemmas,' Section 6.2 'Liberal Values and an Impossibility Result,' pp.87-88 (1970 pagination). One elision, disclosed: a paragraph comparing condition L* to Arrow's non-dictatorship condition D and to the formal apparatus of Theorem 6*1 is skipped between the definition of minimal liberalism and the Lady Chatterley's Lover illustration -- it restates the same impossibility result in the book's own formal notation rather than adding to the illustrative argument quoted here."
    quote: "“A still weaker requirement than condition L is given by condition L*, which demands that at least two individuals should have their personal preferences reflected in social preference over one pair of alternatives each. This condition is extremely mild and may be called the condition of ‘minimal liberalism’, since cutting down any further the number of individuals with such freedom (i.e., cutting it down to one individual) would permit even a complete dictatorship, which is not very liberal. ... An illustration could clarify the nature of the problem. Let the social choice be between three alternatives involving Mr A reading a copy of Lady Chatterley’s Lover, Mr B reading it, or no one reading it. We name these alternatives a, b, and c, respectively. Mr A, the prude, prefers most that no one reads it, next that he reads it, and last that ‘impressionable’ Mr B be exposed to it, i.e., he prefers c to a, and a to b. Mr B, the lascivious, prefers that either of them should read it rather than neither, but further prefers that Mr A should read it rather than he himself, for he wants Mr A to be exposed to Lawrence’s prose. Hence he prefers a to b, and b to c. A liberal argument can be made for the case that given the choice between Mr A reading it and no one reading it, his own preference should be reflected by social preference. So that society should prefer that no one reads it, rather than having Mr A read what he plainly regards as a dreadful book. Hence c is socially preferred to a. Similarly, a liberal argument exists in favour of reflecting Mr B’s preference in the social choice between Mr B reading it and no one reading it. Thus b is preferred to c. Hence society should prefer Mr B reading it to no one reading it, and the latter to Mr A reading it. However, Mr B reading it is Pareto-worse than Mr A reading it, even in terms of the weak Pareto criterion, and if social preference honours that ranking, then a is preferred to b. Hence every alternative can be seen to be worse than some other. And there is thus no best alternative in this set and there is no optimal choice.”"
canonical-instances:
  - "A city council commits to both 'residents get final say over their own block's zoning' and 'a unanimous neighborhood consensus always sets policy.' Two adjacent blocks each have residents who'd rather see their own block quiet than loud, but who ALSO have a preference about what the other block does -- one wants the neighboring block loud precisely because their own is quiet, believing it draws foot traffic away. Honoring each block's say over its own zoning conflicts with the unanimous ranking across both blocks combined, and the council has no consistent policy that keeps both promises."
  - "A company charter gives each department head sole authority over their own team's tooling choice. It also binds the company to whatever tool every head, without exception, agrees is the best company-wide pick. Two department heads each prefer their own choice for their own team, but also have opinions about which tool the OTHER team should use, and those opinions run in a direction that contradicts the unanimous cross-team preference the charter also promised to honor -- the charter cannot keep both commitments at once without picking which one bends."
critical-questions:
  - "Isn't the fix obvious -- just tell Mr A to mind his own business and stop having opinions about Mr B's reading habits? That fix works, but it changes what people want rather than fixing the DECISION RULE itself. Sen's point survives even after conceding that Mr A's nosiness is unappealing: the rule as stated (honor minimal personal autonomy AND honor unanimous preference) breaks given real preferences of this ordinary, unremarkable shape, not just given cartoonishly malicious ones."
  - "Doesn't dropping the Pareto principle here just mean 'ignore what everyone wants when someone objects,' which sounds worse than the paradox itself? Not quite -- the paradox shows P and minimal liberalism can't both hold without qualification, not that P should be abandoned outright. One live option is restricting when unanimous preference gets to override a personal-pair right: honoring the Pareto principle whenever nobody's preference reaches into someone else's protected pair, and treating cases where it does (Mr A's opinion about Mr B's reading) as exactly the boundary case the rule needs to specify rather than paper over."
