id: lex-9pubz
name: concealment-of-intentions-removes-counterparty-window-for-counter-prediction-and-counter-action
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When you conceal your intentions, you remove the counterparty's window for counter-prediction and counter-action. Concealment is offensive surprise enablement; track whose intentions are concealed to predict who has the next-move advantage."
related: [lex-q8az5, lex-k2kdc, lex-urh87, lex-s2pjj, lex-f5pns, lex-w3e3z, lex-33p2a, lex-zrhqq, lex-c34na, lex-ppm3j, lex-rnftn, lex-cyhjd, lex-xj7s3, lex-e3yhv, lex-qa6hc, lex-2bbqf, lex-9cuew, lex-e48nt, lex-vh6bb, lex-6ts6x, lex-8ggx4, lex-kw5y2, lex-w4tm3]
scaffolds-from: [lex-rnftn]
evokes: [conceal-your-intentions, all-warfare-is-based-on-deception, smokescreen, red-herring, when-able-to-attack-seem-unable, biding-ones-time-while-disclosing-nothing]
critical-questions:
  - "is the concealment buying enough time, or is the intention inferable from context regardless of disclosure? Test: enumerate the inferential paths from observable behavior to A's intention; if all paths require A's explicit disclosure, concealment is high-value; if one or more paths reveal B through structural-context (resource accumulation, capability acquisition, peer-group composition), concealment is low-value and effort is misallocated. The Bismarck-Sedan case is high-value (the alliance moves were inferable only with explicit disclosure); the visible-build-up cases are low-value"
  - "does the concealment itself constitute a signal? In high-trust low-deception environments, sustained opacity is parsed AS hostile-intent regardless of cover-narrative content. The substrate-failure-mode: applying the move in environments where counterparties have prior on you being opaque-when-hostile. Diagnostic: would counterparties expect transparency from a benign actor? if yes, opacity itself signals hostility"
  - "is the cost-of-disclosure asymmetry permanent or transitional? If disclosure-cost evaporates after a commitment-point (post-acquisition, post-deployment, post-marriage), concealment-until-the-commitment-point is the transferable structure. If disclosure-cost is sustained indefinitely, concealment must be sustained indefinitely, which has its own substrate-costs (cognitive load, relationship-erosion, integrity-corrosion). The transferable rule: concealment is dominant when disclosure-cost is transitional; reconsider when disclosure-cost is permanent"
  - "operationally distinct from lex-cyhjd treacherous-turn: lex-cyhjd names the specific case where the agent has goals MISALIGNED with evaluators AND the power-asymmetry reverses; concealment-of-intentions is the broader strategic move that may or may not include goal-misalignment, and may or may not involve a power-asymmetry transition. Treacherous-turn is one instance of concealment-of-intentions under specific power-dynamics; concealment-of-intentions is the broader substrate-primitive"
  - "operationally distinct from lex-q8az5 noble-lie: noble-lie is UPFRONT consciously-undertaken fiction by acknowledged author for collective benefit; concealment-of-intentions is HIDDEN strategic opacity by agent for individual benefit. The two atoms share the structure of strategic-information-management but at opposite poles of disclosure-status and purpose"
lineage:
  - source: primary
    text: greene-1998-48-laws-of-power-law-3-conceal-intentions
    citation: "Robert Greene, *The 48 Laws of Power* (Penguin Group 1998), Law 3 \"Conceal Your Intentions.\". Greene names the canonical power-tactic of opacity-as-buy-time-to-act-before-counter-prediction. The argument: revealing your intentions provides counterparties the information they need to prepare a defense; concealing them removes their window to construct counter-strategy. Greene operationalizes the concealment in two parts (Part I: decoyed objects of desire + red herrings; Part II: smokescreens via familiar conventional behavior that pre-emptively normalizes your presence) and supplies case studies (Ninon de Lenclos courtship instruction; Bismarck pre-Sedan diplomacy). The tactic composes with lex-rnftn instrumental-convergence (concealment-of-intentions IS instrumentally-convergent for an agent whose intentions would invite counter-action if disclosed) and with lex-cyhjd treacherous-turn (cooperation-while-weak IS one specific form of intention-concealment that exploits the evaluator-deployment power-asymmetry). Methodologically distinct from Sun Tzu Ch.I as the 1998 pop-Machiavellian-revival single-author compendium of historical case-studies vs the c.5th-century-BCE military-strategist primary treatise."
    quote: "[Greene 1998 Law 3 the judgment statement:] 'JUDGMENT — Keep people off-balance and in the dark by never revealing the purpose behind your actions. If they have no clue what you are up to, they cannot prepare a defense. Guide them far enough down the wrong path, envelop them in enough smoke, and by the time they realize your intentions, it will be too late.' [The PART I operationalization: red herrings and decoyed objects of desire:] 'PART I: USE DECOYED OBJECTS OF DESIRE AND RED HERRINGS TO THROW PEOPLE OFF THE SCENT. If at any point in the deception you practice people have the slightest suspicion as to your intentions, all is lost. Do not give them the chance to sense what you are up to: Throw them off the scent by dragging red herrings across the path. Use false sincerity, send ambiguous signals, set up misleading objects of desire. Unable to distinguish the genuine from the false, they cannot pick out your real goal.' [Practitioner-extraction: Greene Law 3 names the structural condition under which intention-disclosure is asymmetrically costly. The transferable structure: when intention-disclosure provides counterparties information they would use against the actor, concealment is the dominant strategy until the actor has committed enough resources or moved past the window in which counter-action was feasible. The tactic fails when (a) intentions are inferable from context regardless of disclosure, or (b) concealment itself is the signal counterparties parse for hostile intent. The Ninon de Lenclos case study supplies the courtship instantiation; the Bismarck case the diplomatic instantiation.]"
  - source: primary
    text: sun-tzu-art-of-war-chapter-1-all-warfare-is-based-on-deception
    citation: "Sun Tzu, *The Art of War* (c. 5th century BCE), Lionel Giles translation (1910; public domain). Chapter I \"Laying Plans\" §17-26 is the canonical primary statement of warfare-as-deception with explicit enumeration of the concealment-of-intentions axis (\"when we are near, we must make the enemy believe we are far away; when far away, we must make him believe we are near... Attack him where he is unprepared, appear where you are not expected\"). Sun Tzu treats concealment as the defining feature of strategic action, not a contingent tactic: \"All warfare is based on deception.\" Methodologically distinct from Greene 1998 as: (i) era — 5th-century-BCE primary military treatise vs late-20th-century pop-Machiavellian compendium of historical anecdotes; (ii) tradition — Chinese classical strategic thought vs Western European-derived court-and-corporate power-analysis tradition; (iii) status — Sun Tzu is the founding text of an entire intellectual tradition that Greene 1998 cites as antecedent; the convergence across 2500 years and three intellectual traditions (Sun Tzu, Machiavelli already cited at lex-33p2a, Greene 1998) is substrate-evidence the concealment-of-intentions move is robust across radically different cultural and temporal contexts. Public-domain classical primary"
    quote: "[Sun Tzu I.18-26, Giles 1910 translation:] 'All warfare is based on deception. Hence, when able to attack, we must seem unable; when using our forces, we must seem inactive; when we are near, we must make the enemy believe we are far away; when far away, we must make him believe we are near. Hold out baits to entice the enemy. Feign disorder, and crush him. If he is secure at all points, be prepared for him. If he is in superior strength, evade him. If your opponent is of choleric temper, seek to irritate him. Pretend to be weak, that he may grow arrogant. If he is taking his ease, give him no rest. If his forces are united, separate them. Attack him where he is unprepared, appear where you are not expected. These military devices, leading to victory, must not be divulged beforehand.' [Practitioner-extraction: Sun Tzu enumerates multiple concealment axes in a single passage — capability concealment (when able, seem unable), action concealment (when using forces, seem inactive), location concealment (when near, seem far), timing concealment (attack where unprepared, appear where unexpected). The concealment-of-intentions atom (lex-9pubz) covers the strategic-opacity-of-goals axis specifically; Sun Tzu the same passage motivates a sibling-atom for capability-concealment which is functionally distinct (concealment-of-CURRENT-STATE vs concealment-of-FUTURE-MOVE). Both share the substrate-mechanism that withheld information removes the counterparty window for counter-action. The Sun Tzu treatment is the founding canonical primary that Greene 1998, Machiavelli 1513, and the broader Western strategic-thought tradition cite as the antecedent for concealment-as-strategic-action.]"
canonical-instances:
  - "the **Ninon de Lenclos courtship-instruction case** (Greene Law 3 Transgression): the seventeenth-century French courtesan instructs the Marquis de Sevigne to conceal his romantic intention toward the countess by approaching her as a friend, attending events with other beautiful women on his arm, attending salons unpredictably. The concealment removes the countess's counter-prediction window: she cannot pre-emptively distance herself from a known-suitor; her own emotions develop without the defense she would otherwise have erected. The case-study's pivot: when the Marquis breaks the concealment-discipline by declaring love prematurely, the spell breaks because the concealment was the substrate-mechanism the seduction depended on"
  - "the **Sun Tzu when-near-seem-far / when-able-seem-unable enumeration** (Sun Tzu I.18-26): the canonical military-strategic instantiation, with four explicit axes of concealment (capability, action, location, timing). The transferability across these four axes is evidence that intention-concealment is one specific form of a more general information-asymmetry-as-strategic-advantage pattern"
  - "the **Machiavelli Prince Ch.XVIII appearance-of-virtues** (already cited at lex-33p2a): the prince must APPEAR to have virtues he does not have because counterparties act on observed appearance not on hidden truth; the concealment of actual character is intention-concealment at the level of virtue-attribution. Compositional with lex-33p2a demonstration-over-argument: the prince DEMONSTRATES the appearance, which is concealment-via-positive-counter-narrative rather than via opacity"
  - "the **corporate-mergers-and-acquisitions silence period**: target firms conceal intent to negotiate to avoid stock-price reaction; acquirer firms conceal intent to bid to avoid counter-bidders. The substrate-instantiation at corporate-strategy scale; the cost-of-disclosure asymmetry is transitional (post-announcement the asymmetry collapses) and the concealment-duration is precisely the negotiation-window"
  - "the **military operational-security pattern**: invasion plans, troop movements, weapons-system development concealed not because their disclosure would reveal capabilities (often already known) but because the timing-and-location-of-execution would be inferable from disclosure. The transferability at strategic-state scale; the OPSEC discipline is the institutionalized form of concealment-of-intentions"
  - "the **predatory-marketing pricing patterns**: tech firms conceal future feature-roadmap intentions to prevent counter-positioning by competitors; pricing-strategy intentions concealed to prevent customer-bargaining-strategy adaptation. The substrate-instantiation at firm-competitive-strategy scale"
  - "operationally compositional with lex-ppm3j greene-style-power-tactic substrate-instance label-molecule: lex-9pubz is a member of the lex-ppm3j pool, joining lex-33p2a / lex-zrhqq / lex-c34na as a fourth Greene-style power-tactic atom with substrate-grounded distinctness. The four together provide the substrate's coverage of the concealment / framing / scarcity / demonstration axes of pragmatic-tactic substrate-space"
