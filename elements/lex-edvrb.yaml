id: lex-edvrb
name: measuring-preference-breadth-not-direction-indicates-norm-internalization
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When you want to know whether someone has genuinely internalized a norm that forbids treating certain cases as more desirable than others — a doctor's obligation to treat all patients alike, a judge's obligation to treat all litigants alike, a manager's obligation not to favor certain reports — do not survey WHICH type they say they prefer; the direction of any single preference is confounded with real, defensible reasons the alternatives might differ. Instead, put a battery of independent forced-choice items in front of them and count how many items each person answers with a stated preference AT ALL, rather than \"no difference.\" Martin used five independent items (personal-relationship type, detail of explanation wanted, formality of the doctor-patient bond, physical-versus-emotional illness, curable-versus-hopeless prognosis) and states the design decision directly: 'Although it would also be of interest to compare those who prefer one type of patient with those who prefer another, our purpose is somewhat different—we shall compare students who prefer any type of patients with those who do not make such distinctions. On each set of alternatives, some students expressed a preference one way or the other, while others said they had no preference between the two. Moreover, it seems that students vary in the extent to which they generally tend to single out attributes of patients which they prefer. Some students, as Table 22 shows, expressed no preferences whatever, while others made a definite choice on all five.' The resulting distribution (54 of 509 students expressing zero preferences, 69 expressing all five) is read as diagnostic of the underlying disposition itself: 'This approximates a so-called normal distribution, which suggests that the questions differentiate students according to their preferential attitudes toward patients. Those at the upper end of the distribution appear to commit themselves to a preference for some patients over others, while those at the lower end tend to feel that any one type of patient is as desirable as any other.' The count — not any single item's content — becomes the outcome variable: a low count is read as evidence of internalizing the universalistic norm, a high count as evidence of not having internalized it, regardless of which specific patients the high-count student happens to prefer. This generalizes past medicine: whenever a norm demands non-discrimination across a category, and any one item is too confounded with defensible reasons to prove impartiality by itself, stack several independent items measuring the same underlying disposition and score the RESPONDENT'S BREADTH of expressed preference, not any one answer's direction."
