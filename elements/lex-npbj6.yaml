id: lex-npbj6
name: integrity-is-wholeness-not-morality-and-declining-integrity-degrades-workability
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When integrity comes up — a person's, a team's, a system's, an organization's — do not default to treating it as a moral virtue (a matter of good vs. bad character). Treat it first as a POSITIVE, non-normative property: a state of being whole, complete, unbroken, unimpaired — the way a bicycle wheel with all its spokes is whole and a wheel missing several spokes is not. Under this model, a person's or organization's word is what must be whole and complete: honoring your word means EITHER keeping it on time, OR — as soon as you know you won't — proactively telling everyone counting on it and cleaning up whatever mess results. Both count as honoring your word; only silent non-performance breaks integrity. The mechanism this licenses: as integrity declines (spokes come out), WORKABILITY declines (the wheel turns worse) — where workability is defined as the available opportunity set for performance, however performance is measured (profit, quality of life, task completion). Enough degradation and the system doesn't just underperform, it collapses entirely (the wheel stops turning). This reframe changes the diagnostic move: instead of asking 'was this person good or bad,' ask 'is this person's/system's word whole and complete, and if not, where exactly is it broken, and what opportunity-for-performance is that specific break already costing.'"
related: [lex-4snxu, lex-68v4p, lex-aq6dp]
evokes: [integrity-as-wholeness, workability, opportunity-for-performance, law-of-integrity, bicycle-wheel-analogy, jensen-erhard-zaffron, honoring-your-word, integrity-not-morality, factor-of-production, two-ways-to-honor-your-word]
lineage:
  - source: primary
    text: jensen-2009-integrity-without-it-nothing-works
    citation: "Michael C. Jensen, 'Integrity: Without it Nothing Works' (interview by Karen Christensen), Rotman Magazine: The Magazine of the Rotman School of Management, pp. 16-20, Fall 2009 (revised 2014). Harvard Business School NOM Unit Working Paper No. 10-042. Free SSRN download (papers.ssrn.com/sol3/papers.cfm?abstract_id=1511274), surfaced via the SSRN all-time top-100 discovery scan (rank #32, 84.7k+ all-time downloads). Jensen's central move: distinguishing integrity from morality and ethics by defining it as a purely POSITIVE (non-normative) phenomenon — 'like the Law of Gravity, there is no such thing as good or bad gravity; like integrity, it just is.' A person's word is whole and complete when they either keep it on time or, on realizing they won't, inform everyone relying on it and clean up the resulting mess — either move honors the word; only silent failure breaks integrity."
    quote: "Integrity is a purely positive proposition. It has nothing to do with good vs. bad. Think for a moment about the Law of Gravity: there is no such thing as 'good' or 'bad' gravity; like integrity, it just 'is'. ... An individual is whole and complete when their word is whole and complete, and their word is whole and complete when they honour their word. We can honour our word in one of two ways: first, by keeping our word, and on time; or second, as soon as we know that we won't keep our word, we inform all parties counting on us to keep our word and clean up any mess that we've caused in their lives. When we do this, we are honouring our word despite having not kept it, and we have maintained our integrity. ... Integrity is important to individuals, groups, organizations and society because it creates workability. Without integrity, the workability of any object, system, person, group or organization declines; and as workability declines, the opportunity for performance declines. Therefore, integrity is a necessary condition for maximum performance. ... if you attempt to violate the Law of Gravity without a parachute, you will suffer severe consequences."
  - source: primary
    text: erhard-jensen-zaffron-2017-integrity-positive-model-abridged
    citation: "Werner Erhard, Michael C. Jensen, and Steve Zaffron, 'Integrity: A Positive Model that Incorporates the Normative Phenomena of Morality, Ethics, and Legality -- Abridged (English Language Version),' Harvard Business School NOM Unit Working Paper No. 10-061 (revised 2017). Free SSRN download (papers.ssrn.com/sol3/papers.cfm?abstract_id=1542759, 24.5k+ downloads, 82 references, 20 citations), the fuller 41-page theoretical companion to the 6-page interview above — this is where the bicycle-wheel object-integrity analogy and the formal 'workability' definition are developed at length. The authors are explicit that the model treats integrity as a factor of production 'comparable to knowledge and technology,' with a causal (and, they argue, empirically testable) link running from integrity to available opportunity for performance."
    quote: "Consider a bicycle wheel as an example of an object and its integrity. As we remove spokes from the bicycle wheel, the wheel is no longer whole and complete. Because the wheel is no longer whole and complete, the integrity of the wheel is diminished. ... In this new model of integrity, we define workability as: the state or condition that determines the available opportunity for performance (the 'opportunity set'). As we remove spokes from the wheel, integrity is more and more diminished, and as integrity is more and more diminished, the wheel becomes less and less workable. Indeed, when we have removed enough spokes the wheel has no integrity and therefore the wheel collapses into complete failure and will not work at all. In short we assert the following simple, general rule: As integrity declines, workability declines, and when workability declines the opportunity for performance (the opportunity set) declines. ... integrity as we distinguish and define it is an important factor of production (using the language of economists) comparable to knowledge and technology."
canonical-instances:
  - "A team member who realizes mid-project they can't hit a deadline: the integrity-preserving move isn't heroic silent effort to somehow still deliver — it's telling everyone relying on the deadline immediately and helping absorb the resulting mess. Silence (hoping to somehow still make it, or hoping no one notices the miss) is what actually breaks integrity, not the missed deadline itself."
  - "An organization whose stated values ('we prioritize customer trust') diverge from its actual operating word (internal incentives that reward short-term metrics over trust): the wheel is missing spokes at the design/implementation gap, and workability — the org's actual opportunity to achieve its stated performance — degrades in proportion, well before anyone frames it as an ethics violation."
  - "The 300-pound-man-on-a-child's-life-preserver instance (Jensen's own): a system can have integrity of design (the preserver is well-made for its spec) while lacking integrity of use (deployed outside its spec) — the workability failure isn't a moral failing of the preserver, it's a specific, locatable break in the whole-complete chain (design / implementation / use) that a purely normative 'good vs. bad' framing would miss entirely."
critical-questions:
  - "Is this being framed as a character judgment ('they're dishonest/unreliable') when the more useful move is locating the SPECIFIC break — which part of the word is not whole and complete, and via which of the two honoring-paths (keep it, or disclose-and-clean-up) was it actually broken?"
  - "Was the failure a silent miss (the actual integrity violation) or a disclosed, cleaned-up miss (which the model treats as integrity-preserving despite non-performance)? Conflating these two collapses a distinction the model treats as vital."
  - "What specific workability/opportunity-for-performance cost is this particular integrity break already producing — is that cost named and measured, or is the conversation stuck at the level of blame rather than diagnosing the degraded opportunity set?"
  - "Distinct from lex-4snxu (Brooks, conceptual integrity in system design): Brooks's conceptual integrity is about a single coherent DESIGN VISION across a system's parts (the architect's unified mental model reflected in the artifact) — a design-quality axis. This atom's integrity is about a WORD being honored (kept, or disclosed-and-cleaned-up) by a person, group, or organization over time — a promise-keeping/trust axis. A system can have Brooks's conceptual integrity (one coherent design) while its makers lack Jensen's integrity (broken promises about it), and vice versa; the two are orthogonal, not competing definitions of the same word."
