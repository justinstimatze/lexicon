id: lex-49fa3
name: patriarchal-seclusion-is-a-reaction-to-commoditization-not-a-primordial-default
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't assume that when you find women excluded from public life, veiled, or sexually sequestered, you're looking at an unbroken ancient tradition markets and states later chipped away at. The earliest deciphered Sumerian texts, from roughly 3000-2500 BC, show women as rulers, doctors, merchants, and scribes, fully part of public life; the familiar patriarchal pattern -- veiling, sequestered daughters, an obsession with premarital virginity -- shows up centuries later, hardening as debt and markets start treating women's bodies as literal collateral and commodities. Graeber's reading: patriarchal seclusion is commerce's own byproduct, a defensive assertion that 'our women, at least, can never be bought or sold' from men newly aware that debt could make exactly that possible, not the leftover of some older order eroding under commerce's arrival. The tell: check whether the strictness of a society's sexual honor code tracks how commodifiable its women's labor or bodies have actually become, rather than how 'traditional' or old the society claims to be."
related: [lex-kg79h, lex-vzqv5]
evokes: [david-graeber, debt-the-first-5000-years, sumerian-women, patriarchy-origins, gerda-lerner, veiling]
