id: lex-7dypc
name: naming-a-shared-unspoken-practice-is-the-real-transgression
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone states aloud a norm that everyone practices but no one names — even a true accusation, even one everyone present privately agrees with — the social penalty falls on the person who spoke it, not on the practice itself, because the group's continued functioning depends on the norm staying unstated. Confronted publicly about a widely-practiced but unspoken rule, the accused can turn the accusation back on the accuser by pointing out that the accuser rose through the same system and depends on the same rule: 'how do you think you got to where you are.' The confrontation is dropped not because the accusation was false but because it was true of everyone in the room, and everyone present has more to lose from the rule becoming explicit than from letting the specific accusation go unanswered."
related: [lex-h4exp]
evokes: [jackall-moral-mazes, "how in the hell do you think you got to where you are", the-violation-is-saying-it-out-loud]
lineage:
  - source: primary
    tradition: jackall-moral-mazes
    text: jackall-2014-moral-mazes-ch4-noll-naming-the-unwritten-rule
    citation: "Robert Jackall, Moral Mazes: The World of Corporate Managers (Oxford University Press, 2014), Chapter 4, Looking Up and Looking Around."
    quote: "[Joe], how can you sit there and say that to me? How in the hell do you think you got to where you are and how do you think you stay there?"
canonical-instances:
  - "A junior employee is publicly reprimanded for missing a deadline caused by an unofficial but universal practice of quietly deprioritizing low-visibility tasks, and defuses the reprimand by pointing out that the manager doing the reprimanding built their own early career on the identical practice."
critical-questions:
  - "Does the accuser's retreat actually vindicate the unspoken practice as harmless, or does it just confirm that everyone present has too much invested in the practice's continued invisibility to be a credible judge of whether it should be named?"
status: active
