    quote: "“China's fertility rate was already falling rapidly before the policy was introduced. In the ten years preceding the new policy, the fertility rate had already fallen from 5.87 in 1968 to 2.98 in 1978 (a gigantic drop in a decade). The fertility rate continued to fall even after the new compulsive policy came into force, but there was no dramatic jump, only a smooth continuation of the falling trend that preceded the restriction. ... The big decline (from 5.87) had occurred before the compulsion-based route was even introduced. Clearly, something more than the one-child policy has been restraining population growth in China.”"
canonical-instances:
  - "Hypothetical: A company rolls out a new employee wellness program and points to falling sick-day rates over the following two years as proof it worked. Sick-day rates had already been falling steadily for three years before the program launched, driven by an unrelated shift to remote work, and the rate of decline after the program looks identical to the rate before it -- no inflection point anywhere near the launch date."
  - "Hypothetical: A city credits its new anti-littering ordinance for a drop in street litter over the following year. Street cleanup data going back five years shows litter had been declining every year already, at almost exactly the same rate, as a separate recycling-education campaign expanded citywide -- the ordinance took effect in the middle of an existing decline with no visible change in its trajectory."
critical-questions:
  - "Couldn't the policy still be contributing something, even if it isn't the whole story -- doesn't 'no visible inflection point' risk giving it zero credit when it deserves some? A smooth continuation is consistent with the policy contributing nothing measurable. It's equally consistent with a real effect too small to break through the trend's own natural variability. The diagnostic doesn't claim to prove the policy did nothing -- it shows that the popular story (large visible impact) isn't supported by the trend line, which is a narrower and more defensible claim."
  - "Is checking the pre-policy trend always practical -- what about cases where clean historical baseline data just doesn't exist? Not always, and Sen's own case works specifically because good fertility-rate data existed for the decade before the policy. When pre-policy data is genuinely unavailable, the diagnostic simply can't be run, and the honest response is to withhold the causal claim rather than assume the policy worked because a post-policy trend looked good in isolation."
