id: lex-kj6tj
name: democratic-consent-sustains-rather-than-constrains-soft-administrative-tutelage
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when a critique of administrative power assumes electoral accountability automatically constrains it. Tocqueville's distinct contribution: in modern democratic societies, a specific failure mode emerges — `tutelary power` that is `absolute, minute, regular, provident, and mild,` providing for citizens' material needs while removing their agency through `a net-work of small complicated rules.` The key mechanism: it operates with POPULAR CONSENT — citizens chose the guardians, so they accept the leading-strings as self-chosen. Tocqueville: `every man allows himself to be put in leading-strings, because he sees that it is not a person or a class of persons, but the people at large that holds the end of his chain.` The result is not tyranny but ENERVATION — the will is `softened, bent, and guided,` not crushed. Transferable form: democratic legitimacy can SUSTAIN rather than constrain soft administrative tutelage; the popular-mandate framing makes the apparatus harder to resist precisely because resistance frames as anti-democratic. Transferable applications: modern welfare-state critique from BOTH left + right (Hayek 1944 + Foucault 1979 *Birth of Biopolitics*); platform UX as tutelary power (Facebook + Google as benevolent provider; users consent via terms-of-service); algorithmic curation that removes the work of choosing (recommendation engines, autoplay, infinite scroll); workplace paternalism (the `be your authentic self` company that monitors everything); educational helicopter-parenting; therapy culture removing self-formation through community engagement; AI-assistant productization that removes the work of thinking (concern raised in Russell 2019, Crawford 2021 — `cognitive offloading` literature); regulatory capture frameworks where industry-friendly regulation appears democratically-mandated. Distinct from lex-jd7fe (Gramsci hegemony — cultural reproduction, different mechanism). Distinct from lex-vw8c3 (Marcuse producer-supplies-need-and-satisfaction — market-level lock-in; lex-kj6tj is state-level legitimacy-sustained tutelage). Distinct from lex-9zjpf (Spade administrative violence — harm from administrative design; lex-kj6tj is harm-via-provision-and-agency-removal). Use when (i) a critique of administrative power assumes electoral accountability constrains it, (ii) consent-from-citizens is treated as evidence of legitimacy, (iii) a benevolent-provider framing makes the apparatus appear unobjectionable. Counter-move: name the agency-removal mechanism; ask whether consent was given to the specific tutelage or just to electing guardians."
