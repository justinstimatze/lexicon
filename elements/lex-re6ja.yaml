lineage:
  - source: primary
    text: cushing-ravens-eat-coyotes-eyes-blame-his-eagerness
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Coyote and the Ravens Who Raced Their Eyes.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Let the fool of a beast go without his eyes, said the Ravens. He was so very anxious to get rid of them, and do something he had no business with; let him go without them! Whereupon they flew off across the valley, and caught up his eyes and ate them, and flew on, laughing at the predicament in which they had left the Coyote.'"
canonical-instances:
  - "A veteran trader talks an eager novice into an overleveraged position the novice was excited to try, and when it wipes out the novice's account, the veteran tells others the novice 'wanted to gamble and got what was coming,' as though the eagerness that was actively cultivated were an independent fact about the novice's character rather than the lever used to get them into the trade."
  - "A group encourages a new member's enthusiasm to volunteer for a task well beyond their preparation, and when it goes badly and the member needs help, the group cites how eager the member had been to take it on as the reason no one intervened, rather than acknowledging they let the enthusiasm run past the point where someone should have stopped it."
critical-questions:
  - "Would the Ravens' excuse hold up if the Coyote had approached them cold, with no encouragement from them at all, versus the actual sequence where they invited him closer and offered to help pop his eyes out themselves -- does their own active participation change what his eagerness can excuse?"
  - "Is there a point at which a target's eagerness genuinely does transfer responsibility for the outcome onto them, separate from whatever role the other party played in cultivating or exploiting it -- how would you tell that case apart from this one?"
  - "Does the Ravens' laughter at the Coyote's predicament suggest the abandonment was the actual goal from the start, with the eagerness excuse invented only afterward, or is it consistent with a genuine, if convenient, belief that his own wanting-it settles the matter?"
