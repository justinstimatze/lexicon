id: lex-4asm3
name: an-escape-hides-inside-the-frame-the-victim-already-agreed-to
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Once a victim has agreed to the premise of an activity, you can walk your escape one plausible step at a time inside that same premise, and each step reads as a continuation rather than a departure, right up until you're gone. In Cushing's telling, an old Tarantula talks a young man into trading clothes 'so you can see how handsome you look,' then puts on the young man's fine garments and asks, 'How do I look?' When told he looks handsome, he doesn't leave, he says, 'Just wait till I get a little farther off,' and steps back. He repeats this three more times, each retreat justified by the same logic the young man already accepted, that more distance makes for a better view, until, 'he had backed to the very door of his den,' asks one last time, and vanishes headfirst into the hole. Every step back was legible as more of the activity the young man had agreed to watch; none of them looked like flight, because the frame never changed, only the distance within it. Diagnostic move: when someone you're cooperating with keeps asking for 'just a little more' of something the activity already justifies, more distance, more time, one more round, notice that the same request that extends the activity is also the request that would extend an escape, and the two are indistinguishable from inside the frame you already agreed to."
related: []
evokes: [the-same-request-that-extends-the-activity-also-extends-the-escape, cushing-atahsaia, cushing-the-young-swift-runner-stripped-by-the-tarantula, just-wait-till-i-get-a-little-farther-off]
lineage:
  - source: primary
    text: cushing-tarantula-backs-away-inside-the-agreed-frame-then-vanishes
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Young Swift-Runner Who Was Stripped of His Clothing by the Aged Tarantula.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Well, so far as the clothing is concerned, handsome, said the young man. Just wait till I get a little farther off, said the old Tarantula, and he straightened himself up and walked backward toward the door of his den. Presently he stopped and stood still, and said: How do I look now? Handsomer, said the young man. Just wait till I get a little farther; and again he walked backward, which is a way Tarantulas have, and stood up straight, and said: How do I look now? Handsomer still, said the young man. Ah, ha! Just wait till I get a little farther;--and now he backed to the very door of his den, and stood upon the lip of the entrance, and said: Now, then, how do I look? Perfectly handsome, said the young man. Ah, ha! chuckled the old Tarantula, and he turned himself around and plunged headforemost into his hole.'"
canonical-instances:
  - "A salesperson keeps a prospect on a call by repeatedly asking for 'just five more minutes' to cover one more supposedly essential point, each extension justified by the same premise the prospect already agreed to (hearing out the pitch), until the call has run three times longer than agreed and the prospect never noticed a natural point where they could have ended it."
  - "An employee embezzling funds keeps asking a trusting bookkeeper for 'just a little more time' to reconcile one more account before an audit, each delay framed as ordinary continuation of the reconciliation process already underway, until enough time has passed to finish covering their tracks."
critical-questions:
  - "At what point, if any, should the young man have recognized the pattern of repeated retreats as suspicious rather than as a normal part of showing off clothing -- is there a number of 'just a little farther' requests that should have triggered doubt, or does the trick work regardless of how many times it's repeated?"
  - "Does this tactic require the victim to have actively agreed to the initial premise, as the young man agreed to the clothing swap, or could the same incremental-retreat-within-a-frame technique work on someone who was simply present and hadn't explicitly consented to anything?"
  - "Is there a meaningful difference between using 'just a little farther' to disguise a genuine escape, as here, versus a legitimate reason for wanting more distance or time that happens to look identical from the outside -- how would an observer tell the two apart in the moment rather than in hindsight?"
status: active
