id: lex-t6vpk
name: an-answer-against-self-interest-binds-a-third-party-to-honor-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a dispute over your fate hinges on a question a third party could easily lie their way out of, answering with the plain truth against your own interest can be the move that actually wins — because it forces whoever benefits from the lie to either honor the outcome or expose themselves as dishonest by refusing it. In the Vidhurapandita-Jataka, the Yakkha Punnaka has won the sage Vidhura in a game of dice, but the king balks at handing him over; Punnaka puts the matter to Vidhura directly, asking whether he is the king''s slave or kinsman. Vidhura, though the honest answer will cost him his freedom, tells the truth: "I verily am a slave from my birth... I am the king''s slave even if I go to another—he may give me by right to thee." Punnaka is delighted specifically because the answer was truthful and against Vidhura''s own interest: "thy minister when asked has answered thy question; verily the best of kings is unjust" if he now refuses to hand him over — Vidhura''s honesty has left the king no room to renege without publicly proving himself dishonest.'
related: []
evokes: [jataka, mahanipata, vidhurapandita-jataka, truth-telling, commitment-device, self-incrimination]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-vidhurapandita-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 545, Vidhurapandita-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "I verily am a slave from my birth: my weal and my woe come from the king, I am the king's slave even if I go to another—he may give me by right to thee, O young man."
canonical-instances:
  - "In a custody dispute, a grandparent asked point-blank whether they'd actually be able to provide full-time care answers honestly that they couldn't, even though the honest answer works against keeping the child close, because a favorable ruling built on a lie would collapse the moment anyone checked."
  - "A contractor disputing which of two clients owns a finished job admits, against his own short-term interest, that he signed the second client's contract first — and that admission is what makes the first client's claim to keep him unenforceable without the first client openly disregarding a fact everyone in the room just heard confirmed."
critical-questions:
  - "The move only works because Punnaka was already positioned to hold the king to his word publicly — would the same truthful answer have any binding force at all if there were no one present with both the standing and the will to call out a refusal?"
  - "Vidhura had no realistic way to lie here that wouldn't have been checked — is this really a case of truth winning by its own force, or of an honest answer simply being the only move left once deception wasn't a viable option?"
