lineage:
  - source: primary
    text: porter-1979-experience-curve-barrier
    citation: "Michael E. Porter, 'How Competitive Forces Shape Strategy,' Harvard Business Review, March-April 1979 (reprinted in the HBR Reprint Collection 'Are You Ready to Compete?'), sidebar 'The experience curve as an entry barrier.'"
    quote: "Whether a drop in costs with cumulative (not absolute) volume erects an entry barrier also depends on the sources of the decline. If costs go down because of technical advances known generally in the industry or because of the development of improved equipment that can be copied or purchased from equipment suppliers, the experience curve is no entry barrier at all — in fact, new or less experienced competitors may actually enjoy a cost advantage over the leaders. Free of the legacy of heavy past investments, the newcomer or less experienced competitor can purchase or copy the newest and lowest-cost equipment and technology. If, however, experience can be kept proprietary, the leaders will maintain a cost advantage. But new entrants may require less experience to reduce their costs than the leaders needed. All this suggests that the experience curve can be a shaky entry barrier on which to build a strategy."
canonical-instances:
  - "a market leader whose costs fell through automation and vertical integration that any well-capitalized entrant can also build — the cost decline is real but grants no protection, since a new plant built today may be more efficient than the incumbent's older one."
  - "a market leader whose costs fell through years of proprietary process tuning that competitors cannot observe or replicate — the same-shaped cost curve here really does function as a barrier, because the mechanism (tacit, hoarded know-how) resists copying."
  - "a company treating its multi-year dataset as an unassailable moat without checking whether a competitor can purchase or scrape an equivalent dataset from a third-party broker today."
critical-questions:
  - "doesn't the mere fact of being first and having more cumulative experience always confer SOME advantage? Porter's point is not that first-mover cost declines are illusory — they're often real. The claim is narrower: reality of the decline says nothing about its DEFENSIBILITY. A real, hard-won cost advantage can still be a non-barrier if a newcomer can acquire the same position by other means (purchase, copying, leapfrogging to new technology) faster than the incumbent's head start compounds."
  - "how is this different from lex-gg87u mechanistic-heterogeneity-can-hide-behind-causally-homogeneous-cases? lex-gg87u is a general epistemic caution about causal INFERENCE — don't generalize a mechanism from cases that only look alike descriptively. This atom is narrower and decision-oriented: it names the SPECIFIC strategic question of whether an apparent competitive barrier is defensible, and gives the specific diagnostic (is the cost source copyable/purchasable?) rather than a general warning to investigate mechanism. lex-cy243 is an instance of the lex-gg87u caution applied specifically to competitive-moat evaluation."
  - "how is this different from lex-yexax method-domain-transferability? lex-yexax is about whether a METHOD that worked in one domain will transfer to another domain, given the source domain's assumption-set. This atom is about whether an OBSERVED ADVANTAGE PATTERN (declining costs) constitutes a durable barrier within the SAME market, given the mechanism producing it. Both hinge on 'check the hidden precondition before trusting the surface pattern,' but lex-yexax is about cross-domain method transfer while lex-cy243 is about competitive-barrier durability within one market."
