id: lex-4nxg8
name: an-appeal-to-inherited-custom-collapses-once-it-erases-law-from-lawlessness
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Someone caught in ongoing harm can defend it by calling it ancestral custom rather than wrongdoing, but this defense is answered by showing that if the harmful act itself counts as 'law,' the word has lost any power to distinguish law from lawlessness at all. In the Jataka's tale of the fouled well, a jackal caught repeatedly dirtying ascetics' drinking water defends himself: 'This is the law of all the Jackal race, To foul when they have drunk in any place: My sires and grandsires always did the same; So there is no just reason for your blame.' The rebuttal doesn't dispute the tradition. It points out what calling this tradition 'law' would actually cost the word: 'If this is \"law\" in jackal polity I wonder what their \"lawlessness\" can be!'"
related: []
