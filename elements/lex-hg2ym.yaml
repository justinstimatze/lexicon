id: lex-hg2ym
name: credit-for-help-decays-the-longer-it-is-withheld
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern whenever a persuader argues that a refused favor, if eventually granted anyway, will not earn the gratitude or reward that granting it promptly would have earned — the instrumental outcome (the favor performed) may end up identical whether given now or later, but its exchange-value (credit, honor, reciprocal obligation owed back) shrinks continuously the longer it is withheld, and collapses entirely once the need is met without the withholder's help at all. Homer's Iliad Book IX states this exactly. When Phoenix pleads with the enraged Achilles to accept Agamemnon's reconciliation-gifts and rejoin the fight, he tells the cautionary story of Meleager, defender of Calydon, who — insulted by his own mother's curse — withdrew from his city's defense exactly as Achilles has withdrawn from the Greeks'. Meleager held out through his father's pleading, his sisters' pleading, his friends' pleading, relenting only when his own wife described the horrors of the city's imminent fall — by which point the Curetes were already scaling the walls. He rejoined the fight and saved the city, but 'the reward of rare and costly gifts they gave him not, though thus he rescued them.' Phoenix's explicit moral to Achilles: 'Be not thy thought like his, my friend... Accept the gifts at once: then will the Greeks, as if thou wert a god, hold thee in honor. If without the gifts thou enter later on the field of fight, thou wilt not have like honor with the host, although thou turn the assault of battle back.' The mechanism: reward for an action is not fixed by the action's eventual outcome, it is priced by the moment the commitment was secured relative to the point of maximum need. The same rescue, delivered after the rescuer has already been seen to need no persuading, or delivered only once refusal would cost the withholder as much as the rescued party, earns proportionally less recognition, converging to zero once the crisis resolves without the withholder's contribution at all. This is distinct from ordinary reciprocity or deadline pressure: it is not that the actor faces a ticking clock that forces concession, it is that a specific third party (the persuader) is naming the reward-decay explicitly, as a reason to act now rather than as a description of external urgency. Portable beyond the fable: a company facing a hostile takeover courts allies for a defense — a board member who withholds support until after the vote is already won gets no credit for having 'helped'; an early investor who backs a founder during the lean pre-traction years is remembered and rewarded very differently from a later investor who writes the identical check once the company is already visibly succeeding; a friend who shows up during a crisis is valued differently from one who shows up, with the same practical help, only once the crisis has already passed. Diagnostic: separate 'will this action still be useful later' (often yes) from 'will this action still be REWARDED later' (often no) — persuaders who conflate the two, or who exploit the gap deliberately, are using Phoenix's exact move."
related: [lex-5bpee, lex-e98pd, lex-urh87]
evokes: [phoenix-and-meleager, the-embassy-to-achilles, accept-the-gifts-at-once, reward-decays-with-delay, better-late-than-never-is-not-enough, honor-has-a-closing-window]
lineage:
  - source: primary
    text: homer-iliad-book-ix-phoenix-meleager-parable
    citation: "Homer, Iliad, Book IX ('The Embassy to Achilles'), trans. William Cullen Bryant (Boston: James R. Osgood and Company, 1870; PD — Bryant died 1878 — Standard Ebooks PD edition). Within his plea to Achilles, the aged Phoenix recounts the story of Meleager of Calydon, who withdrew from his city's defense after a quarrel with his mother, resisted the pleading of his father, sisters, and friends, and rejoined the fight only once his wife described the horrors of imminent sack — at which point the city was saved, but Meleager received none of the rewards that had been promised for timely aid. Phoenix draws the moral explicitly to Achilles: accept the gifts and rejoin now, or forfeit the honor even a successful late rescue would have earned."
    quote: "[Phoenix, Iliad IX, on Meleager's late rescue:] 'The reward / Of rare and costly gifts they gave him not, / Though thus he rescued them. Be not thy thought / Like his, my friend; let no invisible power / Persuade thee thus to act. Far worse it were / To wait, and when our fleet is all on fire / Offer thy aid. Accept the gifts at once: / Then will the Greeks, as if thou wert a god, / Hold thee in honor. If without the gifts / Thou enter later on the field of fight, / Thou wilt not have like honor with the host, / Although thou turn the assault of battle back.'"
canonical-instances:
  - "The direct textual anchor: Phoenix warns Achilles that accepting Agamemnon's gifts now earns honor, but rejoining the fight later without having accepted them — even if the rescue succeeds exactly the same — will not, citing Meleager as the cautionary precedent."
  - "The embedded parable itself: Meleager withdraws from Calydon's defense, resists his father's, sisters', and friends' pleading, and relents only once his wife describes the city's imminent fall — saving the city, but receiving none of the rewards promised for timely aid."
  - "An early investor who backs a founder during the lean, unproven years is remembered and rewarded very differently from a later investor who writes an identical check once the company is already visibly succeeding."
  - "A board member who withholds support for a takeover defense until after the vote is already won gets no credit for having 'helped,' even though their eventual vote was cast."
critical-questions:
  - "isn't this the same as lex-e98pd reciprocity-as-influence-mechanism? No — lex-e98pd is about how RECEIVING something primes the recipient to feel obligated to reciprocate; it operates on the person who was given something. This atom is about how the value of one's OWN action to others changes based on its timing relative to need, independent of anything the actor received. Different direction: lex-e98pd = 'you received something, now you feel obligated'; this atom = 'your help is worth less the later you give it, regardless of what you were given.'"
  - "isn't this the same as lex-5bpee commitment-and-consistency-pressure? No — lex-5bpee is about people defending a small public position once taken, to remain internally consistent with themselves. This atom is about a third party's persuasive move: naming an external reward-schedule (not the actor's internal consistency-drive) as the reason to act now. Achilles has taken no small commitment yet at the point Phoenix speaks; Phoenix isn't invoking consistency-pressure, he is warning about an economic fact of the honor-market."
  - "isn't this the same as the gift-obligation atoms (lex-urh87 gift-as-three-obligations)? No — those describe the give-receive-reciprocate cycle once a gift has actually changed hands. This atom concerns an action's PRICE varying with its timing, prior to any gift being given or received at all — closer to a claim about honor as a good with a decaying value curve than to the mechanics of an ongoing exchange relationship."
  - "is Meleager's story just 'better late than never'? Partially, but the atom's claim is sharper than the proverb. 'Better late than never' says late action still has value — true here, Meleager did save the city. What the atom adds is that reward for the same action is NOT symmetric with its usefulness: usefulness survives delay; reward does not. The proverb is compatible with, but does not itself state, the specific asymmetry Phoenix is naming."
severity-tier: warning
