id: lex-mqvyk
name: crip-time-names-able-bodied-tempo-as-one-temporality-not-the-default
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When evaluating claims about pace, productivity, life-stage progression, or 'getting it done in time' — interrogate whose temporal substrate is being naturalized as universal. The dominant temporal frame is able-bodied clock-time (linear development from dependent childhood through independent reproductive adulthood, paced by an unmarked 'normal' body's metabolism and energetic budget). Disability does not produce a SLOWER version of clock-time; it produces an alternative temporal substrate where time falls rather than passes, where prognosis-time replaces life-stage-time, where the 'eccentric economic practices' of working-around inaccessible-by-design infrastructure are not failures to keep up but a different organization of activity-in-time entirely. The operational move: don't treat disabled experience as deficient performance on the able-bodied schedule (which presumes the schedule is neutral); treat the able-bodied schedule as ONE temporality among many, made universal-feeling only because it's the schedule built into wage-labor, medical-prognosis, education-progression, and family-formation infrastructure. The corollary distinguishing crip-time from CURATIVE time: curative time is the medical frame that treats disability as a temporary failure-state to be restored to clock-time; crip-time treats the assumption of restoration-to-clock-time as itself the problem. The transferable extension: anywhere a 'normal' temporal substrate is presumed (the build-cycle of normal software, the timeline of a normal pregnancy, the recovery time of a normal injury) the question is which body / which institutional infrastructure that 'normal' is calibrated to — and what would the same activity look like if it were calibrated to a different one. Crip-time is the worked example of substrate-pluralism for time."
related: [lex-6qevt, lex-a3tfj, lex-ct5ux, lex-da3g3, lex-frsr3, lex-k8bsd, lex-quck2, lex-wtkuz]
