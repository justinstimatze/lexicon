name: identical-formal-status-can-be-played-as-different-functional-roles
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When comparing two people who hold the same job title, credential, or formal position, check how they're actually using that position before assuming the position itself explains their behavior. Merton finds that Rovere's local and cosmopolitan influentials, even when matched on occupation and education, behave in characteristically different ways: 'Even as a professional, the local influential is more of a businessman and politician in his behavior and outlook than is the cosmopolitan. He utilizes personal relationships as an avenue to influence conspicuously more than does his cosmopolitan counterpart. In short, it is the pattern of utilizing social status and not the formal contours of the status itself which is decisive.' The concrete split: 'While occupational status may be a major support for the cosmopolitan's rise to influence, it is merely an adjunct for the local. Whereas all five of the local professionals actively pursue local politics, the cosmopolitan professionals practically ignore organized political activity in Rovere. (Their offices tend to be honorary appointments.)' Same credential, same formal duties on paper, two different functional roles depending on what the position is being used to accomplish. The diagnostic move: when two people occupying the same formal position produce very different outcomes or behave in ways that seem to contradict the position's supposed constraints, don't assume the position was measured wrong or that one of them is an exception — check whether the position is being played as a different tool by each of them, since the formal role and the functional role are separable and the functional one is what actually predicts behavior."
