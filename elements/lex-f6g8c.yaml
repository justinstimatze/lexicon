id: lex-f6g8c
name: categories-default-canonical-case-to-the-most-privileged-member
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this when a classification category — legal protection class, medical study population, user persona, demographic bucket, statistical sample, form field, role definition, training-data corpus — operationally takes its CANONICAL CASE (the assumed-typical-member around which analysis/design/protection is built) as the otherwise-privileged subgroup within that category. The mechanism: a category is named (`patients`, `women`, `employees`, `users`, `the disabled`, `Blacks`) and downstream work proceeds as if the typical member is the one with the FEWEST OTHER axes of disadvantage. `Patient` defaults to thin-able-bodied-male; `women` defaults to white-middle-class-cis; `employee` defaults to childless-office-worker; in Crenshaw's analysis, `Blacks` defaults to Black-men and `women` defaults to white-women. The non-default cases — those at the intersection of multiple disadvantaged axes — fall outside the canonical case and become invisible to the system's protection/study/design as a structural matter, not as oversight. This atom names the OPERATIONAL MECHANISM by which lex-et8q2's intersectional non-decomposability becomes erasure in formal classification systems. Closely related to linguistic markedness (Jakobson 1932/1971) — the unmarked term carries the unstated default; the marked term explicitly names the deviation (`doctor` vs `female doctor`; `American` vs `Asian American`). Use when (i) a category's representative example consistently picks the otherwise-privileged member, (ii) policy/research/design generalizes from that default and fails non-default cases structurally, (iii) a critique surfaces `you've defined the category around the case that already had the fewest problems.` Counter-move: name the canonical case the system actually assumes (not the one it claims), then identify whose case the explicit-naming makes visible."
