canonical-instances:
  - "The book's own three-way test kitchen experiment isolates this cleanly: biscuits with baking powder plus baking soda, biscuits with baking powder alone, and biscuits with extra baking powder to match total leavening power — the height comparison alone would have declared baking soda optional, since the soda-free batches rose exactly as high."
  - "Hypothetical: a team removes a code review step because a post-removal audit shows deployment velocity (the tracked metric) didn't change. The step was never mainly about speed — it was catching a slow accumulation of undocumented edge cases that only shows up as a rise in production incidents eight months later, on a dashboard nobody cross-checked against the decision to remove it."
critical-questions:
  - "How would you know to look for a second, unmeasured effect in the first place, when the natural instinct is to test a component against the one outcome it's assumed to serve — is there a general discipline for enumerating a component's OTHER plausible effects before running the removal test, rather than discovering the second job by accident the way the book's tasters did?"
  - "Is there a way to tell, in advance, whether a component that shows zero effect on the tracked metric is (a) doing real invisible work elsewhere, or (b) genuinely redundant — since both look identical on the one metric being watched, and the book only resolved it by having a second, independent panel judging color and flavor?"
  - "Does this generalize to components whose second job is itself hard to name or measure (a team ritual, a cultural norm, a legal boilerplate clause) where there's no equivalent of a taste panel to catch the hidden function at all?"
