id: lex-tfpzb
name: survivorship-bias-omits-the-eliminated-from-the-sample
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating a strategy from successful examples, you're missing the eliminated cases. Survivorship bias inflates apparent success rates and hides what kills you. Identify the absent cases — those who tried this approach and didn't make it to be sampled."
related: [lex-8v6ea, lex-8vcfb, lex-ccaxt, lex-jafkg, lex-jgum9, lex-mbx6p, lex-nx7u7, lex-rqbsr, lex-s7jjg, lex-t9fs7, lex-tmy67, lex-v95t7, lex-vkhp7, lex-vut6v, lex-w97xs, lex-xqamc, lex-yejp2, lex-yh672]
scaffolds-from: [lex-tmy67]
evokes: [walds-bomber-armor, the-paintings-of-those-who-drowned, talebs-silent-evidence, where-are-the-closed-funds, the-advice-business-is-run-by-survivors, only-survivors-leave-records]
lineage:
  - source: primary
    text: brown-goetzmann-ibbotson-ross-1992-survivorship-bias
    citation: "Stephen J. Brown, William Goetzmann, Roger G. Ibbotson & Stephen A. Ross, 'Survivorship Bias in Performance Studies,' The Review of Financial Studies 5(4):553-580 (1992). The financial-economics primary that names and quantifies the effect: when a sample of mutual funds is truncated to those that SURVIVED to the end of the study period (failed funds having been closed or merged away), the surviving sample exhibits a spurious volatility-return relationship that masquerades as genuine performance-predictability. The bias lives in the SAMPLE's construction (selection by survival), not in any observer's reasoning. Internal double-quotes rendered as single-quotes for YAML"
    quote: "Recent evidence suggests that past mutual fund performance predicts future performance. We analyze the relationship between volatility and returns in a sample that is truncated by survivorship and show that this relationship gives rise to the appearance of predictability. [Abstract — the core finding: truncation-by-survival manufactures the APPEARANCE of a real effect.] We present some numerical examples to show that this effect can be strong enough to account for the strength of the evidence favoring return predictability. [Abstract — the artifact is large enough to fully explain away the headline result it is mistaken for.] Past performance does not guarantee future performance. [p.553 — the standard caution the analysis vindicates.] ... suggests that past performance numbers are biased by survivorship [p.554 — the named mechanism: the observed numbers are biased because the sample contains only survivors.]"
  - source: practitioner
    text: wikipedia-survivorship-bias
    citation: "Wikipedia 'Survivorship bias' article (en-wp; retrieved via local ZIM dump -> local Wikipedia archive, 2026-05-28). Generalizes the effect far beyond finance: it is a form of SAMPLING bias — concentrating on entities that passed a selection process while overlooking those that did not — and the cross-domain instances (Wald's WWII bomber armor, Diagoras' shipwreck paintings, Taleb's 'silent evidence', publication / positive-results bias, survivor-run advice) make it one of the most transferable selection-effect primitives"
    quote: "Survivorship bias or survival bias is the logical error of concentrating on entities that passed a selection process while overlooking those that did not. This can lead to incorrect conclusions because of incomplete data. [Lead — the general definition: select-on-survival, then reason from survivors only.] During World War II, the statistician Abraham Wald ... examined the damage done to aircraft that had returned from missions and recommended adding armor to the areas that showed the least damage. ... Wald proposed that the Navy reinforce areas where the returning aircraft were unscathed, inferring that planes hit in those areas were the ones most likely to be lost. [Military — the iconic instance: the returning planes are the survivors; the informative damage is on the planes that did NOT return.] Diagoras ... replied: 'Why, I say that their pictures are not here who were cast away, who are by much the greater number.' [History — the ancient articulation: the drowned left no votive paintings.] In his book The Black Swan, financial writer Nassim Taleb called the data obscured by survivorship bias 'silent evidence.' [The missing data named as evidence that does not speak for itself.]"
canonical-instances:
  - "Wald's WWII bomber armor (Statistical Research Group, Columbia, ~1943): the military examined bullet-hole patterns on planes that RETURNED and proposed armoring the most-hit areas; Wald inverted the inference — the returning planes are the survivors, so the areas UNSCATHED on returners are precisely the areas that, when hit, downed the plane. Armor the gaps in the damage map, not the damage. The canonical de-biasing move: ask what the missing (destroyed, non-returning) cases would show"
  - "the financial primary (Brown-Goetzmann-Ibbotson-Ross 1992): a mutual-fund sample truncated to survivors shows a spurious volatility-return relationship that LOOKS like genuine performance-predictability; the appearance is an artifact of having dropped the funds that closed or merged away. Elton-Gruber-Blake (1996) estimate U.S. mutual-fund survivorship bias at ~0.9% per annum; in theory 70% of extant funds could claim first-quartile performance if the peer group counted the closed funds"
  - "Diagoras of Melos (ancient): shown votive paintings of sailors who survived shipwreck after praying to the gods, and asked whether this proved divine care, Diagoras answered that the paintings of those who drowned — by far the greater number — are simply not on the wall. The structural identity of the bomber-armor case, two millennia earlier"
  - "survivor-run advice / 'silent evidence' (Taleb, McRaney): success advice is 'a monopoly run by survivors' — the dropout-founder who succeeded is visible, the thousands of similarly-bold dropouts who failed are eliminated and silent. Reading habits/traits off visible winners (CEOs, mega-artists; a 2013 study found 91% of artists were undiscovered) infers a special property from what is largely coincidence-plus-unseen-base-rate"
  - "publication / positive-results bias (Rhine ESP via Gardner; Ioannidis 2005): if enough experimenters run the same study, some get significant results by chance; only those get written up and published, so the literature is a survivor-only sample of experiments. Survivorship bias at the level of studies rather than subjects — a key reason 'most published research findings' fail to replicate"
  - "the XKCD #1827 'Survivorship Bias' lottery-winner case (Randall Munroe 2017-04-21; explainxkcd.com/wiki/index.php/1827:_Survivorship_Bias CC-BY-SA 3.0): a lottery winner offers life-advice — 'Never stop buying lottery tickets, no matter what anyone tells you. I failed again and again, but I never gave up. I took extra jobs and poured the money into tickets. And here I am, proof that if you put in the time, it pays off!' The structural shape: the speaker IS the survivor, and the advice infers a special property of effort from what is largely the unobserved tail of similarly-bold failures. Cleanest possible canonical-instance of survivor-run advice — luck dressed as virtue, with the eliminated cases silently absent from the speaker's epistemic field"
  - "operationally distinct from lex-t9fs7 confirmation-bias: confirmation-bias is an error in the OBSERVER's search — selectively seeking and weighting evidence that confirms a prior. Survivorship bias is an error in the SAMPLE — the data have already been filtered by a survival process before the observer ever looks, so even a perfectly even-handed observer draws a biased conclusion. The two compound (the survivor-sample suggests a flattering story one is then tempted to confirm) but the locus of the defect differs: search-asymmetry vs sampling-frame"
  - "operationally the inverse of lex-8vcfb absence-of-expected-event-as-positive-evidence (the dog that did not bark): lex-8vcfb is the DISCIPLINE of treating an informative absence as data; survivorship bias is the FAILURE to do so — the eliminated cases are exactly the absence that the biased reasoner does not count. Asking 'where are the closed funds / the downed planes / the drowned sailors' is the same cognitive move Holmes makes with the silent dog"
critical-questions:
  - "the where-are-the-eliminated check: before generalizing from a set of observed cases, ask what selection process produced this set and where the eliminated cases went. If membership in the sample REQUIRED surviving some filter (staying in business, returning from the mission, getting published, not dropping out), the sample is survivor-only and the inference is biased toward whatever survival selected for"
  - "the optimism-skew direction: survivorship bias most often inflates apparent performance/success (failures are dropped, so averages rise) and manufactures false 'special-property' explanations for what is partly luck. When a result looks surprisingly good and the sample is outcome-selected, suspect the bias before crediting a real effect"
  - "the sample-vs-search discrimination (vs lex-t9fs7): is the distortion in how the data were COLLECTED (survivor-only sampling frame) or in how the observer WEIGHS evidence (confirmation-seeking)? If even a neutral observer would be misled by this dataset, it is survivorship bias and the fix is to recover the eliminated cases, not to debias the observer"
  - "the recovery move: can the eliminated cases be reconstructed or estimated? Wald reasoned about the destroyed planes; survivorship-corrected fund studies re-include closed/merged funds; bias-free backtests apply historical index membership with entry/exit dates. When the missing cases cannot be recovered, the honest output is widened uncertainty, not a point estimate from survivors"
  - "the unit-of-survival question: at what level is the survival filter operating — individuals (subjects, funds, firms), studies/experiments (publication bias), or whole organizations/clades (historians study the institutions that left archives)? The de-biasing target differs by level, but the structural error is identical: reasoning from the population that passed the filter as if it were the whole population"
