id: lex-3srvj
name: a-named-collective-is-a-theoretical-postulate-not-an-observed-object
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a claim treats a named group -- 'the middle class,' 'the market,' 'the nation,' 'the team' -- as a thing that can itself want, decide, or act, check whether the name is standing in for something you could actually point to, or for a theoretical construction built on top of individuals and their relations. Popper's target is what he calls naive collectivism: the view that social science studies 'social wholes' the way biology studies organisms, treating groups as empirical objects on the same footing as the individuals composing them. His distinction: 'while there are, admittedly, such empirical objects as the crowd of people here assembled, it is quite untrue that names like \"the middle-class\" stand for any such empirical groups. What they stand for is a kind of ideal object whose existence depends upon theoretical assumptions.' A crowd in a room is something you can count, photograph, and watch disperse. 'The middle class' names no such assembled, observable thing -- it's a category built from a theory about income, occupation, and status, and different theories draw its boundary differently. Popper's fix: 'social phenomena, including collectives, should be analysed in terms of individuals and their actions and relations' rather than assumed as a directly observed unit that acts on its own. Diagnostic move: when an argument leans on what a named collective 'wants' or 'does,' ask whether that collective is something you could point to and count (a specific crowd, a specific roster) or a category whose boundary depends on a theory you haven't stated. If it's the latter, the claim needs the theory made explicit -- and needs restating in terms of what the actual individuals involved are doing -- before it can be checked against anything."
