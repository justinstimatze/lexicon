id: lex-kravt
name: skill-growth-licenses-voicing-doubt-by-fixing-its-attribution-first
type-in: process
type-out: state
_tier: atomic
agent-instruction: "It looks like the obvious story: a novice gains skill, and therefore feels more certain, and therefore says so more openly. Fox's material shows an extra, necessary step in between. Early on, a Cornell student dismisses his own doubt about a diagnostic technique rather than voice it, precisely because he can't yet tell whether the doubt is warranted: 'I can see that percussion does tell you a lot, and that in most cases, the borders of the heart can be percussed. What it amounts to really is not that I doubt it, but that I can't do it.... It's all very well and good [to express your doubt], but if it turns out that you're the only one who seems to be having so much trouble, you begin to look like a fool after a while if you do.... We don't really know enough yet so that we can afford not to take a positive stand.' Later, with more knowledge and skill, the same student's stance changes — not because the doubt has gone away, but because he can now correctly sort it: 'Now that he \"knows a little more\" and is a \"little more sure of himself,\" a student says, he realizes that although some of his uncertainty is attributable to his \"ignorance,\" some of it is \"really well-justified.\" By this he means that he is better able to distinguish between those aspects of his uncertainty that derive from his own lack of knowledge and those that are inherent in medicine. He is therefore less apt to think of his uncertainty as largely personal and now considers it more appropriate to give voice to the doubts he feels.' The mechanism has two separable stages, and confusing them misses what actually licenses the change: (1) skill growth shrinks how much uncertainty is genuinely personal-ignorance, and (2) this shrinkage is what makes the person able to correctly attribute the REMAINING uncertainty to the field rather than to themselves — and it is specifically THAT attribution, not the raw skill gain, that grants permission to voice doubt out loud. A person who has gained skill but still can't tell which kind of uncertainty they're facing stays silent, for the same reason the novice above did: voicing a doubt you can't yet justify as field-level still reads as incompetence, to yourself and to others. Diagnostic move: when a person with growing expertise still won't voice reasonable doubts, don't assume more skill will fix it on its own — check whether they can actually distinguish which of their remaining doubts are personal versus structural; skill without that discrimination keeps the earlier silence in place."
