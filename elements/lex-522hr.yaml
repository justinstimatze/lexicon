id: lex-522hr
name: jurisdiction-shaped-crime-fits-no-agencys-threshold
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a harmful act crosses the categories that separate enforcement mandates — no single dollar-loss threshold is met, no single classification level is confirmed, no single national or territorial jurisdiction contains the whole act — recognize that it can fall into the gap BETWEEN agencies that each define their scope by a legible threshold, even though every agency involved agrees the harm is real. Clifford Stoll's The Cuckoo's Egg documents this directly: tracking a hacker moving through university, military, and corporate systems, Stoll is told by Jim Christy of the Air Force Office of Special Investigations, 'Look, Cliff. Each agency has thresholds. Our resources are finite so we're forced to choose what we investigate. That's why the FBI asked you about the dollar loss—they're looking to get the most bang for their effort. Now if classified stuff gets stolen, it's a different story. National security doesn't equate to dollars.' Christy's own AFOSI mandate stops at the Air Force base's physical fence; the FBI's stops below a dollar-loss threshold; the fledgling NCSC 'makes standards' but investigates nothing. Stoll's own conclusion: 'Bailiwicks always belong to someone else.' The default outcome of a threshold-shaped mandate structure meeting a category-crossing harm is universal inaction dressed as procedural correctness — every agency is behaving reasonably by its own charter, and the harm still goes unaddressed, because the charters were drawn as a partition of legible cases, not as a covering set for every possible one. Generalize beyond this case: transnational financial crime routed deliberately through the seams between national banking regulators, each of whom has full authority only within their own currency and territory; pollution crossing a state or watershed boundary, falling between environmental agencies whose enforcement standing is defined territorially; any novel harm (a new technology, a new crime category) that simply postdates the threshold-lines every existing agency drew for a world that didn't yet contain it. Diagnostic use: when multiple responsible parties all sincerely want to help and all sincerely cannot claim jurisdiction, don't diagnose incompetence or unwillingness — diagnose a threshold-shaped gap, and look for what redefinition of a mandate boundary, or what new cross-cutting authority, would close it."
related: [lex-8uash, lex-u2kzt]
evokes: [bailiwicks-always-belong-to-someone-else, each-agency-has-thresholds, dollar-loss-threshold, jim-christy-afosi, national-security-doesnt-equate-to-dollars, category-crossing-harm]
lineage:
  - source: primary
    text: stoll-1989-cuckoos-egg-jurisdiction-thresholds
    citation: "Clifford Stoll, The Cuckoo's Egg (Doubleday, 1989). Nonfiction memoir; in-copyright, quoted here under fair use in short, attributed excerpt for critical/analytical commentary. An early phone conference between Stoll and Jim Christy of the Air Force Office of Special Investigations (AFOSI), one of several agencies (alongside the FBI, NSA/NCSC, and CIA) Stoll approaches for help with a cross-border computer intrusion, each of which explains why the case falls outside its own defined mandate."
    quote: "Look, Cliff. Each agency has thresholds. Our resources are finite so we're forced to choose what we investigate. That's why the FBI asked you about the dollar loss—they're looking to get the most bang for their effort. Now if classified stuff gets stolen, it's a different story. National security doesn't equate to dollars. [...] our bailiwick is the Air Force base. Bailiwicks always belong to someone else."
canonical-instances:
  - "Jim Christy's 'bailiwick' conversation in The Cuckoo's Egg: the FBI wants a dollar-loss threshold met, AFOSI's bailiwick stops at the Air Force base's fence, the NCSC only 'makes standards,' and nobody's charter covers a hacker moving through university, military, and corporate systems with no single classified-data or dollar-loss trigger."
  - "transnational financial crime: money laundered across multiple national banking systems is deliberately structured to route through exactly the jurisdictional seams, since each regulator has full enforcement authority only within its own currency and territory."
  - "pollution crossing a state or watershed boundary: a discharge that crosses agency lines falls between environmental regulators whose enforcement authority and thresholds are each defined territorially, so no single agency has standing to treat the full extent of the harm as its own case."
critical-questions:
  - "how does this differ from lex-u2kzt (responsibility-diffuses-as-able-actors-multiply, the bystander effect)? lex-u2kzt is a social-psychological mechanism: each observer privately reasons that another equally-able observer will act, and the mere presence of other capable peers lowers each individual's felt urgency. This atom is a structural-institutional mechanism: agencies aren't equally capable and aren't diffusing responsibility out of social inference — each has a formally defined, non-overlapping mandate boundary (a dollar threshold, a physical fence, a classification level), and the harm simply doesn't satisfy any single agency's defined trigger. The fix differs too: bystander diffusion is resolved by singling out one specific person ('you, call 911'); a jurisdiction-shaped gap is resolved only by redefining a mandate boundary or creating a new cross-cutting authority, since no existing actor's job description covers the case as it stands."
  - "doesn't this just describe bureaucratic incompetence or unwillingness to help? No — the atom's claim is that the gap is a structural byproduct of how agencies define their own scope via legible thresholds, not a failure of individual will. Jim Christy in the source is sympathetic and helpful throughout — he explicitly wants to assist and still cannot claim jurisdiction, because his own bailiwick genuinely stops at a boundary someone else drew. Treating the gap as a competence or motivation problem misdiagnoses it; the fix is redesigning the threshold-boundaries, not replacing the people staffing them."
  - "can a jurisdiction-shaped gap be closed by simply lowering every agency's threshold to zero? No — thresholds exist because agencies have finite resources and need some filter to avoid being swamped by every trivial case; the atom is not an argument against thresholds in general, only a diagnosis of what happens when a genuinely serious case falls into the gap between two reasonably-drawn thresholds. The practical resolution in the source case was a new cross-agency escalation path once the harm was reframed as classified-data-adjacent, not the abolition of agency-level filtering."
