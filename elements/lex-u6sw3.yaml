id: lex-u6sw3
name: high-fidelity-copying-of-causally-opaque-steps-enables-cumulative-cultural-evolution
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a cultural practice (food-processing recipe, ritual sequence, technical procedure, professional protocol, code-review checklist, bureaucratic form) is causally OPAQUE — meaning the function of each step is not apparent from the step itself, and an individual could not reverse-engineer the why-of-each-step within a lifetime — the transferable practitioner-discipline is to suspect that the procedure encodes accumulated wisdom whose evidence has been lost to history. Henrich's central claim in *The Secret of Our Success*: humans alone have evolved a high-fidelity cultural transmission system that copies ALL the steps in a demonstration even when individual steps appear causally irrelevant; chimps copy only the steps they can SEE leading to the reward, dropping seemingly-decorative ones. This species-distinguishing fidelity (called OVERIMITATION in the experimental literature) is what makes CUMULATIVE cultural evolution possible — each generation starts from a higher baseline because the previous generation's accumulated procedural wisdom got copied intact, including the parts no individual can justify. The mechanism is established experimentally (Horner-Whiten 2005 opaque-vs-clear artificial-fruit chimp-vs-Scottish-kid comparison) and ethnographically (Tukanoan multi-day bitter-manioc detox sequence; Billing-Sherman 1998 capsicum-as-antimicrobial recipe survey; Kalahari forager fidelity replication). The transferable claim has three crucial pieces. FIRST: causal-opacity is a SIGNAL, not a problem. When a procedure is causally opaque, the appropriate first response is RESPECT for the accumulated selection pressure embedded in it, not impatience to optimize. The naive intuition 'each step needs a justification I can verify in advance' is exactly the chimp-cognitive-pattern that prevents cumulative cultural evolution. SECOND: high-fidelity copying is necessary BECAUSE of opacity. If you drop the step you can't justify, you may break the procedure in a way that takes generations to discover (manioc cyanide poisoning is gradual; the missing-step bug surfaces years later in neurological disease). THIRD: high-fidelity copying is ALSO maladaptive when applied to procedures that AREN'T causally opaque accumulated-wisdom. Bureaucratic forms that grew by accretion, code-review checklists added in response to single incidents, professional rituals that originated as one consultant's preference — these LOOK like opaque accumulated-wisdom but actually encode no selection pressure. The practitioner-discipline is three-part. FIRST: when encountering a causally-opaque procedure, ASSESS the selection history. How long has this procedure existed? Has it been tested by failure modes during that history? If yes, treat the opacity as evidence of accumulated-wisdom-you-don't-yet-understand and copy faithfully until you do. SECOND: when the procedure's history shows that simplifications were repeatedly attempted and failed (food-processing, surgical protocols, aviation checklists), the high-fidelity-copying response is correct. The cost of one missed-step incident exceeds the savings from many removed-step optimizations. THIRD: when the procedure's history shows accretion-without-selection-test (most bureaucratic processes), the opposite response applies — simplify aggressively, and watch what breaks. Transferable applications: BUREAUCRACY — high-fidelity-copying bureaucratic procedures without questioning is what makes bureaucracies bloated AND what keeps them functional; the discriminator is whether the procedure has been tested by failure modes. SAFETY-CRITICAL PROTOCOLS — aviation checklists, surgical timeout protocols, nuclear-plant operating procedures: faithful copying is appropriate because the procedures HAVE been tested by failure. CODE-REVIEW + STYLE CHECKLISTS — discriminate between items that originated from postmortems (faithful copy) and items added by individual preference (review). RITUAL + RELIGIOUS PRACTICE — Henrich's argument is that ritual stability is enabled by overimitation; the question is whether the encoded selection-pressure tracked anything transferable or only group-coordination. PROFESSIONAL TRADECRAFT — guild knowledge, apprenticeship transmission, chef's mise-en-place: causally-opaque-but-actually-load-bearing technique transfers via high-fidelity copying because explanation can't keep up with practice. AI-TRAINING DATA — the procedural knowledge captured in chain-of-thought traces is high-fidelity-cultural-transmission applied across human-to-model substrate; the same opacity-as-signal heuristic applies (when a training example shows a sequence of reasoning steps, suspect that some steps are causally-load-bearing even when individually inscrutable). The atom does NOT advise blind reverence for all opaque procedures; the cardinal distinction is between selection-tested opacity (faithful copy) and accretion-without-test opacity (simplify and watch). Henrich's specific insight: cumulative cultural evolution requires a copying-system that COPIES TOO MUCH from the individual-optimization perspective, because the value of the over-copying is paid by the long-run population, not the individual copier. The diagnostic question for a transferable practitioner: when you encounter an opaque procedure in your domain, is the appropriate response to (a) demand a justification before complying, (b) copy faithfully and look for the justification over time, or (c) simplify? The answer depends on the procedure's selection history."
