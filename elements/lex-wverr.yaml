lineage:
  - source: primary
    text: foot-2001-natural-goodness
    citation: "Philippa Foot, *Natural Goodness* (Oxford University Press, 2001). The book's central thesis is that judgements of goodness and badness of LIVING THINGS — plants, animals, human actions and dispositions — share a distinctive logical structure grounded in the species LIFE-FORM. Foot draws explicitly on Michael Thompson's 'The Representation of Life' (in *Virtues and Reasons*, ed. Hursthouse et al., OUP 1995) for the formal apparatus of 'Aristotelian categoricals' — propositions of the form 'S's are F' or 'The S is F' where S names a species/life-form and F a predicate (e.g., 'rabbits are herbivores,' 'oak trees grow deep taproots'). These categoricals articulate the natural-teleological organization of the species (development, self-maintenance, reproduction, defense, rearing-of-young). An individual living thing is good or defective in the NATURAL or PRIMARY sense (Foot's distinction from SECONDARY goodness, which is goodness-for-something-external) to the extent that its features and operations match what the species life-form's categoricals call for. Foot's controversial neo-Aristotelian extension: moral defect in humans IS a form of natural defect of the human life-form; the same logical structure that grounds 'this rabbit is defective in being unable to digest grass' grounds 'this human action is morally defective.' The transferable claim is the STRUCTURAL one about the logical form of natural-goodness judgements, separable from Foot's controversial moral-realist conclusion. In-copyright (Oxford University Press); verbatim quotation short and attributed under fair-use. Distinct from lex-jbegr phronesis-practical-wisdom-in-particulars: lex-jbegr names the practical wisdom of applying virtue-evaluations to particular situations; lex-wverr names the underlying logical form of the evaluation. Distinct from lex-7mr6w survival-test-mistaken-for-purpose: lex-7mr6w warns against survival-reduction; lex-wverr articulates the positive multi-component teleological structure (Foot insists life-form is not reducible to survival-fitness alone — defense, rearing-of-young, etc. are constitutive). Cross-domain attestation: Aristotle *Nicomachean Ethics* I-II (the foundational ergon-argument that human good is defined by the human function); Aquinas *Summa Theologiae* (natural law as discoverable through reflection on human nature); Anscombe 1958 'Modern Moral Philosophy' (the call to ground ethics in virtue and human flourishing rather than rule-based deontology); MacIntyre 1981 *After Virtue* (virtue as constituted by social practices grounded in human goods); Hursthouse 1999 *On Virtue Ethics* (development of Foot's neo-Aristotelian programme); Thompson 1995/2008 *Life and Action* (the formal Aristotelian-categorical apparatus Foot uses)."
    quote: "[Foot 2001 *Natural Goodness*, introduction:] 'My constructive task is therefore to describe a particular type of evaluation and to argue that moral evaluation of human action is of this logical type. I am going to write about what may conveniently be called natural goodness and defect in living things.' [On the form of the judgement, Ch.2:] 'natural goodness, as I define it, which is attributable only to living things themselves and to their parts, characteristics, and operations, is intrinsic or autonomous goodness in that it depends directly on the relation of an individual to the life form of its species. On barren Mars there is no natural goodness.' [On Aristotelian categoricals, citing Thompson:] 'to understand certain distinctive ways in which we describe individual organisms, we must recognize the logical dependence of these descriptions on the nature of the species to which the individual belongs. Species-dependence is his leitmotif. For this reason he concerns himself with propositions of the form S's are F or The S is F, where S holds a place for the name of a species (or life form as he is ready to say for the sake of those who want to give species a technical definition) and F a place for a predicate; so that a representative sentence would be Rabbits are herbivores or The rabbit is a herbivore.' [On the teleological structure of life-form, Ch.2:] 'The way an individual should be is determined by what is needed for development, self-maintenance, and reproduction: in most species involving defence, and in some the rearing of the young.' [On the moral extension, Ch.2 close:] 'The main thesis of this book is that propositions about goodness and defect in a human being — even those that have to do with goodness of character and action — are not to be understood in [psychological-commendation] terms. In describing my view, Thompson rightly said that I saw vice as a form of natural defect.'"
canonical-instances:
  - "The pliable reed and the rigid oak (Foot, citing La Fontaine): pliability is good IN a reed (because reeds survive wind by bending) but a defect IN an oak (because oaks survive wind by being rigid). The same property has opposite evaluative valence depending on the life-form. The judgement is intrinsic to the species, not relative to external use."
  - "The slow tortoise: an explorer meeting his first tortoise should NOT mark it down for lack of speed. Tortoises are not for-running; speed is not a constitutive component of the tortoise life-form. The constitutive components (shell, slow metabolism, longevity) work together as a different solution to development/self-maintenance/reproduction."
  - "The stinging bee that destroys the nest (Foot): when a bee stings a gardener, it acts according to bee defensive behavior (good-as-a-bee) but may kill itself and harm the colony. Foot's careful distinction: an individual's GOODNESS-as-its-species-instance can come apart from its BENEFIT in particular circumstance. Natural goodness is about matching the life-form's structural requirements, not about whether matching them helps the individual in any particular case."
  - "Human virtue as natural good of the human life-form (Foot's controversial extension): courage is good because the human life-form requires sustained pursuit of difficult goods over time and risk-aversion would prevent the pursuit. Honesty is good because the human life-form requires cooperative communication. Justice is good because the human life-form is fundamentally social and dependent on stable mutual expectations. The structural move: each virtue is justified by reference to its function in the species life-form."
  - "Functional artifacts as analogue (transferable extension): 'good knife' means knife that cuts well (the constitutive function of knife-ness). 'Good investigation' means investigation that produces warranted conclusions (the constitutive function of investigation). 'Good dialogue' (lex-wutu8) means dialogue that surfaces and examines assumptions (Bohm's constitutive function). In each case the logical structure of the evaluation is: function-set categoricals + individual instance → natural goodness/defect. The biological case is one application of a wider structural form."
  - "Distinguished from instrumental-goodness (Foot calls this SECONDARY goodness): 'a good plant for the rock garden' is secondary — it's good relative to OUR purpose, not intrinsic to the plant's life-form. Foot's analytic move: separate primary (life-form-grounded) from secondary (use-relative) goodness so that the logical form of moral judgement (which is primary in Foot's account) is not confused with consumer-judgements."
  - "Distinguished from lex-7mr6w survival-test-mistaken-for-purpose: lex-7mr6w warns against collapsing teleology to bare-survival; Foot's life-form structure is multi-component (development + self-maintenance + reproduction + defence + rearing-of-young) and not reducible to survival-fitness alone. They compose — Foot avoids the lex-7mr6w failure mode by insisting on the multi-component teleological structure."
critical-questions:
  - "Is the life-form (or constitutive-function-set) well-established for this category? Natural-goodness judgements presuppose a determinate species/function specification. For biological life-forms with clear teleological organization, the specification is robust. For contested categories (human life-form's substantive content; novel-substrate categories like LLMs; hybrid systems), the specification is part of what's under dispute. Failure mode: smuggling in a contested life-form specification under cover of a 'natural' judgement."
  - "Are you collapsing primary and secondary goodness? When you call X 'a good Y,' check whether you mean (a) Y matches the Y-life-form's constitutive function (primary), or (b) Y serves your external purpose well (secondary). Both are legitimate but logically distinct. Conflating them produces argument-by-equivocation. Failure mode: using 'good' rhetorically to slide between the two senses."
  - "Are you reducing teleology to survival-fitness? Foot's life-form has multiple components (development, self-maintenance, reproduction, defense, rearing-of-young) and a feature can be life-form-required even if it doesn't directly enhance individual survival (cf. the stinging bee). Failure mode: collapsing the multi-component life-form to single-component survival, then concluding the feature is non-functional (composes with lex-7mr6w)."
  - "Does the move to MORAL natural-goodness require an account of the human life-form's substantive content? Foot's bold claim that moral goodness is a form of natural goodness inherits a hard problem: what IS the human life-form's substantive content? Disagreements about this drive contemporary virtue-ethics debates (MacIntyre vs Williams vs Nussbaum). Failure mode: helping yourself to Foot's structural form while pretending the substantive question is settled when it isn't."
  - "Does the form transfer cleanly to non-biological systems? The Aristotelian-categorical form generalizes to any system with constitutive function (knives, investigations, dialogues). But for novel-substrate categories (artificial agents, hybrid systems), the function-set may be genuinely under construction. Failure mode: invoking 'good X' for novel X as if the form-set were settled when it isn't yet."
