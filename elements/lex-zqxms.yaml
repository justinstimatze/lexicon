id: lex-zqxms
name: cultivated-desire-plus-forbidden-pursuit-is-a-double-bind
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A person can be trained from birth to want one specific outcome with total intensity, using every social and cultural mechanism available, and then be forbidden from taking any visible action to pursue that same outcome -- success has to look entirely unsought while every other part of life is organized around achieving it, and failure to attain it gets blamed on the person rather than on the impossible bind itself. Gilman names the contradiction directly: 'with all the pressure of personal advantage and self-interest added to the sex-instinct,—what one would logically expect is a society full of desperate and eager husband-hunters, regarded with popular approval. Not at all! Marriage is the woman's proper sphere... It is what she is born for, what she is trained for, what she is exhibited for... But—she must not even look as if she wanted it! She must not turn her hand over to get it. She must sit passive as the seasons go by, and her \"chances\" lessen with each year.'"
related: []
evokes: [women-and-economics, chapter-v, she-must-not-even-look-as-if-she-wanted-it, born-for-trained-for-exhibited-for, cultivated-desire-with-forbidden-pursuit]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-v
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter V. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "with all the pressure of personal advantage and self-interest added to the sex-instinct,—what one would logically expect is a society full of desperate and eager husband-hunters, regarded with popular approval. Not at all! Marriage is the woman's proper sphere, her divinely ordered place, her natural end. It is what she is born for, what she is trained for, what she is exhibited for. It is, moreover, her means of honorable livelihood and advancement. But—she must not even look as if she wanted it! She must not turn her hand over to get it. She must sit passive as the seasons go by, and her 'chances' lessen with each year."
canonical-instances:
  - "A junior employee is told from their first day that promotion depends entirely on visible initiative and ambition. The moment they actually ask for a promotion or advocate for themselves, they're quietly marked as too pushy -- no available path avoids the penalty."
  - "An academic is trained for years to want a permanent faculty position above all else, then is expected to appear entirely indifferent to the outcome during the hiring process, with any visible eagerness read as a red flag against the very position they were raised to pursue."
  - "A contestant on a competitive show is coached to want the prize with total sincerity for the cameras, then is edited and judged negatively the moment that desire becomes too visible or strategic, punished for wanting the exact thing the show spent months cultivating in them."
critical-questions:
  - "Is the bind genuinely inescapable, or are there real, if narrow, paths that satisfy both demands at once -- ways of visibly cultivating desirability without directly and nakedly pursuing the outcome, that Gilman's stark either/or framing doesn't fully account for?"
  - "Who actually benefits from maintaining this specific bind -- if it produces so much documented suffering, what makes it stable and self-perpetuating rather than something that would erode once its costs became broadly visible, as Gilman herself suggests is happening?"
  - "Does identifying a bind as structural, rather than a matter of any individual's failure, actually change how people navigate it in practice, or does naming the trap leave a person facing the exact same two bad options regardless of the more accurate diagnosis of why they're stuck?"
