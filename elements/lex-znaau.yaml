id: lex-znaau
name: premature-closure
common-name: "Deciding before you've checked"
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When you have a working hypothesis but haven't tested it against an obvious alternative, surface the alternative explicitly and name what observation would distinguish them before committing."
