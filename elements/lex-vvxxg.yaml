    quote: "So they got some mud from a pool close by, and rubbed and rubbed the crystal with it. But the crystal, being constantly polished by the boars' bristles, got brighter than ever."
canonical-instances:
  - "A competitor spreads exaggerated rumors about a company's product flaws, prompting the company to publish a detailed, transparent breakdown of exactly how the product works, which draws far more favorable attention than the product had before the rumors started."
critical-questions:
  - "Does this pattern depend on the target already being genuinely sound, so that scrutiny has nothing real to find, or does it only work when the underlying reputation was fragile enough to need exactly this kind of test to prove itself?"
  - "Is there a point at which repeated attacks, even ones that fail to damage the target, still cost something in attention or resources, even if the material itself comes through unmarked?"
