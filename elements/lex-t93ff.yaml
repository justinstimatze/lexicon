    quote: "“a certain Luke likes playing the piano in his room, and a certain Matthew likes improvising jazz on the trumpet in the adjacent room, with imperfect soundproofing between the rooms. They disturb each other if they play together, but, as might be expected, the trumpeter makes a bigger mess for the pianist than the pianist can for the trumpeter. The final solution that Braithwaite recommends divides up the time, giving substantially more time to the trumpeter than to the pianist. As Braithwaite ((1955), p. 37) puts it, ‘Matthew’s advantage arises purely from the fact that Matthew, the trumpeter, prefers both of them playing at once to neither of them playing, whereas Luke, the pianist, prefers silence to cacophony.’ Matthew has the threat advantage in the absence of a contract, and it is indeed possible that Braithwaite’s solution may well emerge should Luke and Matthew actually bargain. ... An unbiased judge may well decide that the fact that Matthew can threaten Luke more effectively (and more noisily) than Luke can threaten Matthew does not entitle him to a bigger share of playing time. Matthew himself might concede that if he did not know whether he was going to be Luke or Matthew before deciding on a system of distribution of time he might well have ignored the threat advantage and recommended a more equal sharing of time.”"
canonical-instances:
  - "A landlord and a tenant 'negotiate' a lease renewal in which the tenant, facing eviction with nowhere else to move on short notice, settles for a steep rent increase. The number reflects the tenant's weak walk-away position, not any judgment about what a fair rent actually is -- predicting that number correctly says nothing about whether it's a fair one."
  - "A vendor contract gets split so the larger company keeps more of the margin, defended as 'what the negotiation produced.' What the split actually tracks is which company could survive the deal falling through -- contribution to the work never enters the formula. Neither company, asked to set the numbers before knowing which side of the table they'd occupy, would likely propose the same split."
critical-questions:
  - "Isn't 'what would happen if no deal is struck' exactly the information a fair split needs to account for -- shouldn't the weaker party's dependence factor into the calculation somehow? Sen doesn't deny that threat position shapes what actually gets negotiated; the claim is narrower -- that the predicted outcome, however real, doesn't automatically inherit ethical standing just because it emerged from a formally symmetric procedure. Whether dependence should count toward or against a party in a fair outcome is a separate question the bargaining model never answers."
  - "Doesn't disqualifying threat advantage as a basis for fairness leave no principled way to split anything -- don't you need some tiebreaker? Sen's suggested tiebreaker is the veil-of-ignorance test itself: have the parties design the split before either knows which position they'll occupy. That doesn't remove the need for a rule, it just changes which considerations the rule may draw on -- leverage is ruled out, while contribution, need, and equal division all stay on the table."
