id: lex-p34bd
name: benchmark-task-engineered-to-maximize-substrate-asymmetry
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When proposing a benchmark, surface that the benchmark's value is the asymmetry it engineers between substrates — pick tasks where substrate A trivially fails and substrate B can succeed; benchmarks that both can do don't measure anything."
related: [lex-n7dqw, lex-u29fu, lex-xrbzz, lex-w5qfe, lex-vmas8, lex-n365w, lex-tsc9a]
scaffolds-from: [lex-vmas8, lex-w5qfe]
evokes: [pick-the-fight-where-you-can-win, native-task-vs-emulated-task, random-circuits-have-no-shortcut, the-test-was-designed-not-found, hard-for-them-easy-for-us, exponential-gap-on-the-right-axis, sycamore-vs-summit]
lineage:
  - source: primary
    text: arute-2019-quantum-supremacy
    citation: "F. Arute, K. Arya, R. Babbush et al. (Google AI Quantum collaboration), 'Quantum supremacy using a programmable superconducting processor,' *Nature* 574:505-510 (24 October 2019), doi:10.1038/s41586-019-1666-5. The paper that claimed (and arguably achieved, modulo later classical-algorithm counter-improvements) the first demonstration of quantum-supremacy: a computational task where a quantum processor measurably outperformed any classical computer at scale. The transferable observation: the authors did not pick a generally-useful task; they picked random-circuit-sampling SPECIFICALLY because it has the property of being computationally hard for classical machines (no exploitable structure to speed up the simulation) AND structurally natural for the quantum hardware (the quantum circuit IS the task — sample from the bitstring-distribution that the Sycamore processor naturally produces by executing the circuit). The 200-second vs ~10,000-year gap is not a general quantum-supremacy claim; it's task-specific. The pattern is general: to demonstrate a capability-difference between substrates, engineer the benchmark task to maximize the asymmetry — make the task native for the substrate you're advocating and structurally-hard for the substrate you're comparing against. Random-circuit-sampling for quantum vs classical is the canonical extreme case (super-polynomial gap). Other examples: ImageNet for deep-learning vs hand-engineered-features; CASP for AlphaFold vs homology-modeling; chess for AlphaZero vs handcrafted-evaluation; Go for AlphaGo vs handcrafted-evaluation. The Lakatos-style theory-testing relative is also visible: a 'protected belt' theory survives by choosing test-cases where it shines. The pattern is also methodologically suspect when used to fake capability — picking a task only your method handles, ignoring tasks where it fails, is the streetlight-fallacy (search where the light is, not where the keys are). Engineering-task-choice is therefore BOTH a legitimate way to demonstrate substrate-asymmetry AND a dishonest way to overstate capability; the distinction is whether the asymmetric task represents a real capability that generalizes vs a benchmark-overfit."
    quote: "[Arute et al. 2019 Nature 574:505 p.1, abstract:] 'Here we report the use of a processor with programmable superconducting qubits to create quantum states on 53 qubits, corresponding to a computational state-space of dimension 2^53 (about 10^16). Measurements from repeated experiments sample the resulting probability distribution, which we verify using classical simulations. Our Sycamore processor takes about 200 seconds to sample one instance of a quantum circuit a million times—our benchmarks currently indicate that the equivalent task for a state-of-the-art classical supercomputer would take approximately 10,000 years. This dramatic increase in speed compared to all known classical algorithms is an experimental realization of quantum supremacy for this specific computational task, heralding a much-anticipated computing paradigm.' [p.2, the explicit engineering-of-the-asymmetric-task:] 'To demonstrate quantum supremacy, we compare our quantum processor against state-of-the-art classical computers in the task of sampling the output of a pseudo-random quantum circuit. Random circuits are a suitable choice for benchmarking because they do not possess structure and therefore allow for limited guarantees of computational hardness. We design the circuits to entangle a set of quantum bits (qubits) by repeated application of single-qubit and two-qubit logical operations.' [p.2, on what the random-circuit produces:] 'Sampling the quantum circuit's output produces a set of bitstrings, for example {0000101, 1011100, …}. Owing to quantum interference, the probability distribution of the bitstrings resembles a speckled intensity pattern produced by light interference in laser scatter, such that some bitstrings are much more likely to occur than others. Classically computing this probability distribution becomes exponentially more difficult as the number of qubits (width) and number of gate cycles (depth) grow.' [The transferable extraction: the task is CHOSEN, not given. The choice is engineered around two criteria — (a) structurally-hard for the competing-substrate (no shortcuts in random circuits because random = no structure); (b) structurally-native for the focal-substrate (a quantum processor literally IS a quantum-circuit-evaluator). The exponential-gap is what the engineering achieves: 200 sec vs 10,000 years isn't found, it's constructed by the task-design.]"
  - source: practitioner
    text: cross-domain-engineered-benchmark-attestations
    citation: "Cross-substrate attestations: (a) AlphaFold 2 / CASP14 — Jumper et al. 2021 *Nature* 596:583 (the parallel AI atom lex-xrbzz): CASP is a BLIND prediction competition (recently-solved structures not yet in PDB); AlphaFold was designed to handle the no-homology cases where classical methods catastrophically fail; the engineering-of-the-benchmark is implicit (CASP organizers do it) but AlphaFold's training optimized for exactly this distribution; (b) ImageNet / AlexNet — Krizhevsky-Sutskever-Hinton 2012 NIPS: hand-engineered-feature methods plateaued at ~26% error on ImageNet; AlexNet at ~16% on the SAME benchmark proved a step-change; the benchmark was independently created (Fei-Fei Li, 2009) but the substrate-asymmetry favored CNNs because spatially-local-structure-with-translation-invariance is the native inductive-bias of convolutional architectures; (c) chess / AlphaZero — Silver et al. 2017 'Mastering chess and shogi by self-play': AlphaZero engineered self-play as the substrate-native training mechanism, defeating Stockfish (highly-engineered handcrafted-evaluation) at chess; same pattern at Go (AlphaGo 2016); (d) Lakatos protective-belt — Lakatos 1970 'Falsification and the Methodology of Scientific Research Programmes': a research-program's 'protective belt' of auxiliary hypotheses is the engineered-explanatory-task-portfolio that lets the hard-core survive falsification; theory-defenders implicitly choose-the-test-cases to maximize the program's success; (e) the streetlight-fallacy / WEIRD-sampling (Henrich et al. 2010): looking only where the light is is the dishonest version of substrate-asymmetric benchmarking; lex-u29fu covers the discovery-claim-bar separately, but the lex-p34bd transferable claim cuts BOTH ways — same engineering can demonstrate real capability OR overstate it. The legitimate use is when the asymmetric-task represents a real generalizable capability; the illegitimate use is benchmark-overfit. Disambiguating which is which requires out-of-distribution validation."
    quote: "[Cross-domain 2026-05-24: the lex-p34bd pattern recurs as the standard way new paradigms announce themselves. Examples: convolutional-nets announce on ImageNet (where they win by a 10-point margin) not on tabular-data (where they tie or lose to gradient-boosted-trees); transformers announce on language-modeling perplexity (where they crush LSTMs) not on time-series-forecasting (where the gains are smaller); diffusion-models announce on image-generation (where they overtake GANs) not on tabular-density-estimation. Each new substrate identifies its native-task and benchmarks against the prior substrate AT that task. The dishonest version is publishing on the cherry-picked task while ignoring failures elsewhere; the honest version is being explicit about the asymmetry and explaining what generalization (if any) is claimed. Arute et al. are admirably explicit: 'an experimental realization of quantum supremacy for this specific computational task' — note the qualification 'this specific'. The transferable critical-question: when someone announces a benchmark win, ask (i) was the task engineered to favor the substrate? (ii) does the substrate-advantage generalize beyond the benchmark? (iii) what tasks does the new substrate fail at? Answers to (ii) and (iii) tell you whether the claim is genuine paradigm-shift or benchmark-overfit-marketing.]"
canonical-instances:
  - "the Arute 2019 canonical case : 53 transmon qubits on Sycamore + random-circuit-sampling task chosen explicitly because it has 'no structure' (no algebraic shortcuts for classical simulation) + cross-entropy-benchmarking metric chosen because it tests the quantum-interference-pattern recovery; classical estimate of 10,000 years on a state-of-the-art supercomputer was later challenged (IBM 2019 argued ~2.5 days with disk-augmented simulation; subsequent classical algorithms further compressed) but the substrate-asymmetric task choice and engineering remained the methodological breakthrough"
  - "the AlphaFold 2 / CASP14 canonical case (lex-xrbzz): CASP14 was the blind test (May-July 2020 recent structures not in PDB) where AlphaFold demonstrated atomic accuracy on novel folds where homology-modeling fails. The benchmark wasn't engineered BY AlphaFold's authors, but their METHOD was engineered to handle the cases CASP biennially highlights as hard. Same substrate-asymmetric-benchmarking pattern with independent benchmark-design"
  - "the AlphaZero canonical case (Silver et al. 2017 arXiv:1712.01815): self-play reinforcement learning + Monte Carlo tree search achieved superhuman play in chess, shogi, Go from zero domain knowledge in <24 hours of training. The engineered-task is 'win at game X by self-play'; the substrate-asymmetry is between handcrafted-evaluation (Stockfish, Stockfish-NNUE) and neural-evaluation. Chess/shogi/Go were chosen because they admit perfect self-play (deterministic rules, no hidden information); the same approach would not work as cleanly on imperfect-information games (poker requires CFR-style techniques)"
  - "the AlexNet / ImageNet canonical case (Krizhevsky et al. 2012 NIPS): the ImageNet benchmark was independently created (Fei-Fei Li 2009); AlexNet's substrate (CNNs on GPUs) won by ~10 points top-5 error margin against best hand-engineered systems. The benchmark wasn't created to favor CNNs, but the SUBSTRATE was matched-to-the-benchmark by Krizhevsky-Sutskever-Hinton's architecture choices (convolution + max-pooling + ReLU + dropout — every component selected for ImageNet-style natural-image classification). Demonstrating substrate-superiority on an externally-defined benchmark is the strongest legitimate version of lex-p34bd"
  - "the streetlight-fallacy / WEIRD-sampling counter-case (Henrich-Heine-Norenzayan 2010 *Behav. Brain Sci.* 33:61): psychology results from Western-Educated-Industrialized-Rich-Democratic samples were over-generalized to humans-in-general; the substrate-asymmetric benchmarking happened by sampling-convenience rather than capability-demonstration. This is the DISHONEST version of lex-p34bd — the substrate-asymmetry was real (WEIRD samples produced different results than universal-human-samples) but it represented a methodological flaw, not a paradigm-shift"
  - "operationally distinct from lex-n7dqw template-matching-against-theoretical-prediction-as-detection-protocol: lex-n7dqw is about extracting signal from noise WHEN the theoretical-template is known. lex-p34bd is about CHOOSING the test-task to maximize substrate-asymmetry. Cross-fire: LIGO uses lex-n7dqw (template-matching) on a search-space chosen to favor what GR predicts (binary-compact-object inspirals — substrate-asymmetric task choice). The lex-p34bd angle on LIGO: the choice to search for chirp-templates rather than e.g. cosmic-string-bursts was itself task-engineering"
  - "operationally distinct from lex-u29fu discovery-claim-bar-as-community-convention-not-decision-theoretic: lex-u29fu is about WHERE the threshold for 'discovery' is set (5σ in particle physics, 95% confidence in clinical trials). lex-p34bd is about WHAT TASK is being tested. They compose: the discovery-claim-bar (lex-u29fu) is applied to the engineered-task result (lex-p34bd). For Arute: the 5σ-equivalent question is whether 0.224% cross-entropy fidelity is statistically significantly above zero across the random-circuit-sampling task; the lex-p34bd question is whether random-circuit-sampling itself is the right benchmark"
  - "operationally distinct from lex-w5qfe iterative-refinement-of-a-provisional-target-against-feedback: lex-w5qfe is about the iterative-refinement process (conjecture-act-refine-repeat); lex-p34bd is about the choice-of-test-task within any given refinement cycle. Cross-fire: when iterative-refinement cycles converge on benchmark-overfit (e.g., long-running NLP benchmarks where models score above human performance but fail in production), it's because lex-p34bd was used dishonestly within lex-w5qfe — each refinement specifically targeted the test, not the underlying capability."
  - "operationally distinct from lex-vmas8 falsifiability (Popper): lex-vmas8 is the demarcation criterion that scientific claims must be falsifiable; lex-p34bd is about the meta-level choice of WHAT to test. Cross-fire: a substrate-asymmetric benchmark that the new substrate FAILS would be devastating falsification (lex-vmas8); the engineered-task choice (lex-p34bd) is therefore methodologically responsible to include cases where the new substrate could fail — Arute's paper does this by reporting per-circuit-depth fidelity degradation, not just the best result."
critical-questions:
  - "the asymmetry-source diagnostic: WHY is this task hard for one substrate and easy for the other? Practitioner-question: identify the STRUCTURAL feature of the task (no-shortcuts, native-emulation, scale-of-state-space, inductive-bias-match) that drives the asymmetry. If you can name it specifically, the asymmetry is principled; if you can't, you may be benchmark-overfitting. Arute can name 'random-circuits have no structure' as the asymmetry-source; this is principled"
  - "the generalization-beyond-benchmark question: does the substrate-advantage on the engineered-task generalize to useful tasks? Practitioner-question: identify the closest real-world-task to the benchmark; estimate how much of the substrate-advantage transfers. Random-circuit-sampling generalizes to certified-random-number-generation (Aaronson's protocol) and some quantum-simulation tasks, but NOT to general computation (Shor's algorithm requires error-corrected qubits, not the noisy 53-qubit Sycamore). Be skeptical of substrate-advocates who can't name the generalization-target"
  - "the bench-overfit question: was the substrate trained or designed against the benchmark specifically? Practitioner-discipline: if yes, the benchmark-result is upper-bound, not representative. Sycamore was NOT trained on random-circuit-sampling (it has no training); cross-entropy-benchmarking is a measurement, not an optimization-target. This is the legitimate-version of lex-p34bd. CASP14 results for AlphaFold are similarly legitimate (blind-test against unreleased structures). NLP benchmarks like GLUE/SuperGLUE are LESS legitimate because models are explicitly trained-on-the-test-distribution"
  - "the failure-mode-acknowledgment: does the paper report failures? Practitioner-rule: substrate-advocates who report ONLY successes are signaling marketing-overfit; those who report failures are signaling honest-engineering. Arute reports per-circuit-depth fidelity degradation; AlphaFold reports specific protein-classes where it underperforms; LIGO reports the gravitational-wave-detector dead-zones. Look for the failure-mode-acknowledgment as a credibility-signal"
  - "the substrate-asymmetric-marketing failure mode: in commercial / consulting contexts, lex-p34bd is the engine of misleading benchmark-driven sales. Practitioner-discipline when evaluating vendor-claims: (a) is the benchmark task representative of YOUR use-case? (b) what tasks does the vendor's substrate fail at? (c) can you reproduce the benchmark on YOUR data? Vendor-engineered-benchmarks that fail any of these three checks are marketing, not capability-demonstration"
  - "the LLM/AI-design application: when designing an evaluation, ask 'is this benchmark engineered to favor my approach?' If yes, acknowledge it explicitly and design complementary benchmarks that would favor competing approaches. The HELM benchmark (Liang et al. 2022) explicitly evaluates LLMs across many tasks to limit substrate-asymmetric bias. The 'specific-task quantum-supremacy' framing in Arute is the rhetorical-standard worth emulating: claim narrowly, qualify explicitly, generalize cautiously"
status: active
