lineage:
  - source: primary
    text: doctorow-2022-11-28-pluralistic-amazon-coinage-and-2023-01-21-pluralistic-3-stage-articulation
    citation: "Cory Doctorow, 'How monopoly enshittified Amazon,' *Pluralistic* 28 November 2022 + 'Tiktok's enshittification,' *Pluralistic* 21 January 2023 + 'The \"Enshittification\" of TikTok,' *Wired* 23 January 2023 (the formal republication of the Jan 21 Pluralistic post). ACQUIRED (local HTML copies of the three primary posts; Doctorow's work is CC-BY-licensed so storage and short-quote use is explicitly permitted; canonical permalinks: pluralistic.net/2022/11/28/enshittification/ + pluralistic.net/2023/01/21/potemkin-ai/#tiktok-enshittification + wired.com/story/tiktok-platforms-cory-doctorow/). PRIMARY ARTICULATION: the Nov 28 2022 Pluralistic post introduces the verb 'enshittified' applied to Amazon's specific trajectory (the $31B 'ad' business as payola gladiatorial-combat between sellers competing to outspend each other for top-of-search-results positioning; Most-Favored-Nation clauses forcing same-or-higher prices everywhere else; Amazon's own cloned products taking sellers' demonstrated-demand markets). The Jan 21 2023 Pluralistic post GENERALIZES the verb into the noun 'enshittification' and articulates the canonical THREE-STAGE LIFECYCLE that lex-ukgke captures: (1) platform is good to its users, accumulating user-side critical mass via subsidy/quality (Amazon below-cost selling + free Prime shipping; Facebook showing the posts you actually wanted; pre-monetization TikTok showing what entertained you); (2) once users are locked in by network effects, switching costs, content-DRM, or social hostage-taking, the platform RE-DIRECTS the surplus to business customers (Amazon's generous marketplace commissions + Kindle/Audible creator deals; Facebook's preferential distribution to publishers; TikTok's manual surplus-allocation to influencer creators); (3) once business customers are locked in by audience-dependency, the platform CLAWS THE SURPLUS BACK to shareholders (Amazon's 45%+ junk fees + the $31B 'ad' business as payola; Facebook's pay-to-be-seen 'boost' fees + ad-targeting fraud + Jedi Blue collusion; TikTok's heaping-pile-of-shit feed). Then the platform dies. Doctorow's transferable distinct claim: this is not a contingent business-decision failure mode but a STRUCTURAL CONSEQUENCE of the two-sided-market geometry + the malleability of platform algorithms — once a platform can re-allocate value between users and business customers at zero marginal engineering cost, and once it has enough lock-in to retain each side against the other's preferences, the rational profit-maximizing move is to extract from BOTH sides until the platform's value to either side is exhausted. The diagnostic mechanisms Doctorow names: ALGORITHMIC FLEXIBILITY (the platform can re-tune what gets shown at any time, with no warning, to redirect surplus); MUTUAL HOSTAGE-TAKING (users locked in by social network effects + DRM; business customers locked in by audience-dependence); RENT-EXTRACTION-AS-PAYOLA (junk fees, boost fees, sponsored search results disguised as organic results, dark patterns elevating ads over user-utility). The atom's transferability extends from Amazon/Facebook/TikTok to mobile app stores, Google Search, Steam, Twitter post-Musk, Reddit post-API-shutoff, Netflix post-password-sharing-crackdown, Lyft/Uber post-rider-locked-in, every two-sided platform with enough lock-in to survive the user-and-business-customer rebellion that the third-stage extraction triggers. Methodologically: applied political-economy analysis in the public-intellectual / EFF-special-advisor tradition; anchored to specific case studies (Amazon, Facebook, TikTok) with named mechanisms (chokepoint capitalism, Most-Favored-Nation, the $31B 'ad' business). Distinct from lex-ewjec (enclosure: structural absence of non-market exits — Doctorow's enshittification operates WITHIN a platform-market, lock-in is the precondition, extraction is the consequent move). Composes with lex-994yb (fixed-cost-recovery-channel): platforms that initially fund operations via VC subsidy (stage 1) face the question of WHO PAYS the fixed cost when subsidy ends; the enshittification path is the structural answer when the platform's lock-in geometry permits extraction. Composes with margin-race ingest candidate #3 (externalizing-onto-an-undefended-commons): the second-stage user-attention and personal-data externalization is the ad-funded platform's answer to the fixed-cost-recovery question, which then drives the third-stage extraction from business customers as well."
    quote: "[Doctorow 2023-01-21 Pluralistic post, the canonical 3-stage articulation:] 'Here is how platforms die: first, they are good to their users; then they abuse their users to make things better for their business customers; finally, they abuse those business customers to claw back all the value for themselves. Then, they die. I call this enshittification, and it is a seemingly inevitable consequence arising from the combination of the ease of changing how a platform allocates value, combined with the nature of a \"two sided market,\" where a platform sits between buyers and sellers, holding each hostage to the other, raking off an ever-larger share of the value that passes between them.' [On the structural mechanism, same source:] 'This is enshittification: surpluses are first directed to users; then, once they're locked in, surpluses go to suppliers; then once they're locked in, the surplus is handed to shareholders and the platform becomes a useless pile of shit. From mobile app stores to Steam, from Facebook to Twitter, this is the enshittification lifecycle.' [On the Amazon canonical-instance, the parallel Nov 28 2022 Pluralistic post:] 'In Bezos's original plan, the company called \"Amazon\" was called \"Relentless,\" due to its ambition to be \"Earth's most customer-centric company.\" Today, Amazon is an enshittified endless scroll of paid results, where winning depends on ad budgets, not quality... Amazon charges its sellers billions of dollars a year through a gladiatorial combat where they compete to outspend each other to see who'll get to the top of the search results. May the most margin-immolating, deep-pocketed spender win!' [On the Facebook trajectory, Jan 21 2023 post:] 'First, Facebook was good to you: it showed you the things the people you loved and cared about had to say. This created a kind of mutual hostage-taking: once a critical mass of people you cared about were on Facebook, it became effectively impossible to leave, because you'd have to convince all of them to leave too, and agree on where to go... Now, Facebook started to cram more ads into the feed, mixing payola from people you wanted to hear from with payola from strangers who wanted to commandeer your eyeballs... Today, Facebook is terminally enshittified, a terrible place to be whether you're a user, a media company, or an advertiser.' [the transferable corollary:] Doctorow's enshittification names a STRUCTURAL TRAJECTORY rather than a contingent failure-mode. The three-stage lifecycle is enabled by: (a) zero-marginal-engineering-cost re-allocation of value within a platform (the algorithm can be re-tuned at any time to redirect surplus), (b) two-sided market lock-in producing mutual hostage-taking (users locked to each other; business customers locked to user audience), (c) the rational profit-maximizing consequence: extract from both sides until neither has value left, then watch the platform die. The diagnostic test: when you observe a platform in stage 1 (good to users), forecast stages 2 and 3; when you observe stage-2 features (sponsored-results-displacing-organic-results, payola disguised as algorithmic ranking, ad-targeting via harvested data), the trajectory has begun. The atom's transferable engineering rule: design AGAINST enshittification by removing the structural enablers — interoperability mandates (defeating lock-in), end-to-end principle (limiting algorithmic re-allocation), antitrust enforcement against MFN clauses + self-preferencing + chokepoint-capitalism patterns. Without structural countermeasures, every two-sided platform with sufficient lock-in is on the trajectory regardless of founder intent."
  - source: cross-attestation
    text: contemporary-empirical-cross-attestation-2023-2026
    citation: "Cross-domain empirical cross-attestation across the 2023-2026 platform-economy. (a) Amazon — Geoffrey Fowler 2022 *Washington Post* investigation documenting that 'on these first five screens, more than 50 percent of the space was dedicated to ads and Amazon touting its own products'; the $31B 'advertising' business is largely payola-for-search-ranking rather than independent ad placement (Doctorow 2022 cites this explicitly). (b) Facebook/Meta — the Cambridge Analytica scandal (2018) + Jedi Blue ad-collusion scheme (2018, exposed 2020) + the documented decline in organic publisher reach + the 'boost-or-die' pay-to-be-seen mechanism for publisher posts. Doctorow connects these to the structural enshittification trajectory rather than treating them as one-off scandals. (c) TikTok — Doctorow 2023 documents the 'heating' mechanism (manual surplus allocation to influencer creators), then the algorithmic shift to commodity-content + sponsored placements + paid 'boost' for creators. (d) Twitter post-Musk acquisition (2022-): the rapid enshittification trajectory compressed into months — API shutoffs, verified-checkmark monetization, algorithmic suppression of external links, ad density increase, ban evasion lifted. (e) Reddit post-API shutoff (2023): the platform monetization move that ended third-party clients (Apollo, RIF) and forced users into the official app with higher ad density. (f) Google Search degradation (2023-2024) documented by Bermes et al. *arXiv* 2023 'Is Google Getting Worse?' showing measurable decline in result quality on commercial queries, attributed to SEO-spam optimization + AdWords prominence. (g) Netflix post-password-sharing-crackdown (2023): the lock-in-then-extract pattern applied to a subscription business — once users were locked in by content-library size and content-pipeline-dependence, the company added password-sharing fees + ad-tier with cheaper subscriptions to capture price-discriminated payments. (h) Uber/Lyft post-IPO (2019-): the gig-economy enshittification of driver compensation (decreasing per-trip pay, decreasing tip-share) + rider experience (increasing prices, longer waits, lower vehicle quality). Cross-domain consistency across e-commerce, social media, streaming, ride-sharing, and search — and the cross-platform shared mechanism (algorithm-re-allocation + two-sided lock-in + extraction-when-both-sides-locked) — is evidence the underlying trajectory is structural rather than substrate-specific. The transferable engineering posture from the cross-attestation: forecast platform trajectory from EARLY stage-2 signals (sponsored-results-displacing-organic, payola in supplier rankings, algorithm-tuned-without-user-input) rather than waiting for stage-3 indicators (ad density, boost fees, user exodus). The atom's critical critical question — 'what would interoperability-mandates + end-to-end-principle + antitrust-enforcement do to this platform's enshittification trajectory?' — is the pivotal structural countermeasure question."
