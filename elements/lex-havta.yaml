id: lex-havta
name: punishing-an-incapable-part-of-your-own-system-for-an-external-failure
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When something under your responsibility fails and you find the actual external cause, check whether you also turn around and punish some incapable, blameless part of your own setup for the same failure -- a punishment that changes nothing about the real cause and only adds fresh, self-inflicted damage. In Radin's Winnebago Trickster cycle, Trickster wakes to find his roasting meat gone, correctly identifies the real culprits -- 'It must have been those covetous friends of mine who have done me this injury!' -- and then, in the same breath, turns on the part of himself he had assigned to guard it: 'And you, too, you despicable object, what about your behaviour? Did I not tell you to watch this fire? You shall remember this! As a punishment for your remissness, I will burn your mouth so that you will not be able to use it!' He follows through, burning his own anus as punishment for failing to stop thieves it was never capable of stopping: 'He was, of course, burning himself and, as he applied the fire, he exclaimed, 'Ouch! Ouch! This is too much! I have made my skin smart.'' Correctly naming the external cause did not stop him from also inflicting a second, entirely self-generated injury on a part of his own system that could never have prevented the first one. Diagnostic move: after identifying the real external cause of a failure, check whether you are also assigning blame internally to some part of your own process that was never equipped to prevent it -- that second move rarely fixes anything and reliably produces damage of its own."
