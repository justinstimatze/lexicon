id: lex-c9xba
name: implicate-order-fragments-are-partial-unfoldings-of-an-enfolded-whole
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When investigating a system that presents as a collection of fragmented parts (a market of separate transactions, a person of conflicting roles, a culture of disparate practices), Bohm's transferable claim is that the fragments may be the EXPLICATE order — the visible, surface-level unfolding — of a deeper IMPLICATE order in which the whole structure is enfolded into each region. The explicate is a partial unfolding selected by what you can observe; the implicate is the wider enfolded totality from which any number of partial explicate orderings can be unfolded. Practitioner discipline: when fragments don't add up, don't conclude either 'it's actually fragmented' or 'there's a hidden mystery.' Look for a SHARED ENFOLDED STRUCTURE whose partial unfoldings produced each fragment. The canonical physical analogues are the hologram (each region of the holographic plate contains the whole image, just at lower resolution and viewable from one angle) and Bohm's treacle-and-ink-droplet experiment (stirring an ink drop into viscous fluid produces an apparent 'random grey' that, when stirred in reverse, reconstitutes the original drop — the drop was enfolded into the grey, not destroyed). Diagnostic: 'what would have to be enfolded into this whole region for THIS partial fragment to be one possible unfolding of it?' Be careful with the inverse failure mode: not every apparent fragmentation is implicate. Some fragments really are independent. The atom is a structural HEURISTIC for surfacing enfolded-wholeness candidates, not a metaphysical commitment that everything is holographic. The discipline: surface the enfolded-whole as a HYPOTHESIS, verify by checking whether multiple partial unfoldings co-vary with the hypothesized whole. Distinct from lex-gfxw3 recursive-composition (recursive-self-application of a pattern across scales) — implicate-order is about SIMULTANEOUS enfoldedness, not iteration. Distinct from lex-wup2r gnomonic-growth (self-similar form via accretion) — gnomonic is process-dynamic, implicate is structural-static. Distinct from holism-as-philosophical-claim — implicate-order names the specific enfold/unfold structural relation. The atom's transferable use is as a hypothesis-generator for cases where fragments resist reconstruction by addition: a market price emerging from many bidders (each bidder's information is partial-unfolding of a shared implicate state); a person's behaviors across contexts (each behavior a partial-unfolding of a deeper character); a culture's practices (each practice a partial-unfolding of a tacit cultural ground). Modern adjacent: distributed representation in neural networks (each weight encodes partial information about many concepts; the concept is enfolded across the representation); the cell's morphogenetic field (each cell carries the whole-organism's positional information enfolded into local protein gradients). The hologram is the canonical metaphor, but the transferable structural pattern is the enfold/unfold relation, not the hologram specifically."
