    text: hyde-dumb-luck-stays-sterile-smart-luck-converts-a-windfall-into-lasting-change
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"The Lucky Find,\"' citing Carl Kerényi on a story from Horace, and on Hermes' own lyre. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "“Should a stupid fellow have good luck, he owes it to the witless Hercules,” Kerényi writes, referring us to a story in Horace in which “Mercurius once let Hercules talk him into enriching a stupid man. Mercurius showed him a treasure which he could use to buy the piece of land he was working. He did so, but then proved himself unworthy of the hermetic windfall by continuing to work the same piece of land!” That’s “dumb luck,” the luck of all gamblers whose winnings never enrich them, the luck of the hotel clerk who hits the lottery and quickly spends himself into bankruptcy. It’s sterile luck, luck without change. “Smart luck,” on the other hand, adds craft to accident—in both senses, technical skill and cunning."
canonical-instances:
  - "Two employees each get the same lucky break of being staffed on a high-visibility project by pure scheduling accident; one treats it as routine work and changes nothing about their approach, while the other uses the visibility to build relationships and demonstrate a new skill, and only the second employee's career trajectory actually shifts."
  - "Two startups each get an identical windfall of unexpected viral attention; one simply enjoys the traffic spike and reverts to normal once it fades, while the other uses the moment to convert new users into paying customers and build lasting infrastructure, and only the second startup's growth outlasts the accident that caused it."
critical-questions:
  - "Is it fair to call the man in Horace's story 'unworthy' of his windfall, or does the story unfairly blame him for lacking resources, connections, or imagination that were never available to him regardless of the treasure -- does 'smart luck' sometimes just describe pre-existing privilege rather than a virtue anyone can apply?"
  - "Does converting a windfall into lasting change always require the kind of active, strategic follow-through Hermes demonstrates, or can some windfalls (a health scare that prompts lasting lifestyle change, for instance) transform someone passively, simply by the shock of the event itself, without deliberate craft applied afterward?"
  - "How much of Hermes' 'smart luck' success is actually attributable to skill applied after the find, versus to advantages he already had (divine status, cunning nature) before the tortoise ever crossed his path, complicating the claim that the windfall's outcome depended purely on post-accident capability?"
