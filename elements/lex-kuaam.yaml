canonical-instances:
  - "A manager insists his hiring decisions are purely intuitive and unbiased because they 'just feel right' in the interview, while the pattern of who gets that feeling and who doesn't tracks demographic and pedigree cues he was trained on for decades without ever being examined."
  - "A jazz musician believes a particular solo was pure in-the-moment inspiration, but a teacher who has heard him play for years recognizes it as the same eight licks he always reaches for under pressure, rearranged, each one drilled into automaticity long before that night."
critical-questions:
  - "Is the distinction between conditioned response and genuine spontaneity even coherent, given that any capacity for spontaneous action was itself built by some developmental process -- doesn't 'unconditioned' collapse into an incoherent standard if pushed far enough back?"
  - "Does Brook's critique prove too much -- if convinced sincerity is never sufficient evidence of freedom, is there any felt state that could count as evidence, or does the argument make the question of genuine spontaneity permanently unanswerable from the inside?"
  - "Is there a meaningful difference between conditioning that narrows options (a fossilized, repetitive gesture-vocabulary) and training that expands them (a musician's technique enabling new ideas), such that some conditioning genuinely does serve spontaneity rather than merely disguising its absence?"
