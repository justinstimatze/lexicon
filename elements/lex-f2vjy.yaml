id: lex-f2vjy
name: insulation-from-feedback-blocks-decision-process-self-correction
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this when you are evaluating or designing a decision-making process (a market, a court, a family, a regulatory agency, a corporate hierarchy, a political office, an editorial board, an algorithmic approval pipeline) and the question on the table is framed purely as 'does this decision-maker have good knowledge?' Sowell's addition on top of Hayek's knowledge-location claim: that is necessary but not sufficient. Every real decision-maker sometimes decides badly — no process has complete knowledge at the moment of decision. What determines whether the SYSTEM self-corrects over time is not the knowledge available up front but whether the process routes the cost of an error back to whoever made the decision, with enough speed and force to create a genuine incentive to notice and fix it — or whether the decision-maker is a SURROGATE, deciding on behalf of others without personally bearing the decision's own costs, and therefore INSULATED from the feedback that would otherwise force correction. Sowell's own contrast: a RESIDUAL CLAIMANT (a business owner, a home buyer, a farmer working his own land) personally captures the gain or absorbs the loss that flows from their own decisions — 'win and the government wins with you; lose and you lose alone' — and that residual claim gives them a standing, self-interested incentive to monitor and correct their own performance without needing to be separately monitored by anyone else. A SURROGATE decision-maker (a regulator, an appointed judge, a corporate bureaucrat, a politician inside a fixed election cycle, a plant manager rotated through a post before its long-run consequences arrive, an absentee owner's tenant-overseer) decides FOR other people but does not personally bear the residual cost of being wrong; when the decision fails, the fastest and most concrete form of the consequence lands on someone else. Track the specific INSULATION MECHANISMS Sowell names, because they generalize far past economics: (i) discrete, bounded time-windows (a fixed term of office, a tenure-limited rotation) that let a decision-maker exit before slow-arriving consequences land on a successor — compose with lex-qb3zf's rotation-extraction mechanism; (ii) formal authority or force that lets an institution act without needing the affected party's continued voluntary cooperation, muting the feedback that exchange would otherwise generate; (iii) complexity or unintelligibility ('mountains of tangential statistics,' an unnavigable bureaucratic maze) that raises the cost of anyone outside tracing cause to effect; (iv) case-by-case discretion exercised by a body that was never selected for, and does not personally hold, a stake in the specific outcome. None of this is a claim about WHERE knowledge is initially located (Hayek's 1945 point, lex-58ynk — a hypothetical decision-maker with perfect knowledge of particular circumstances would still fail by this diagnostic if insulated from the feedback of their own errors) or about planning concentrating coercive political power (Hayek's 1944 point, lex-hr3cu — a fully rule-bound, non-coercive institution with zero arbitrary discretionary power can still be a badly designed decision process if its rule-following officials are surrogates insulated from feedback). Use when: (a) someone proposes moving a decision from the party who will bear its consequences to an expert, regulator, committee, or judge, and defends the move purely on 'they know more' or 'they're impartial' grounds without asking who bears the cost if they are wrong; (b) you are designing an organization, contract, incentive scheme, or algorithmic-approval pipeline and need to decide whose incentive structure should be attached to a given decision; (c) a system is producing repeated, uncorrected errors and the likely cause is not a knowledge gap but an insulated decision-maker. Counter-move: name who currently bears the residual cost of this specific decision being wrong; if that party is not the one making the decision, ask whether the gap is a deliberate, justified trade-off (due-process protection from mob judgment, a right shielding a minority from majoritarian pressure, economies of scale in monitoring) or an unexamined insulation that will let errors compound uncorrected."
