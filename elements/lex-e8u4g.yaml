canonical-instances:
  - "A landlord tells tenants a key-fob system keeps out anyone without a unit. A delivery driver with no interest in the building's security reputation props the lobby door open with a takeout bag rather than wait for a resident to buzz him in. Nothing is stolen. But the tenants who trusted the landlord's promise now have a concrete instance of the fob system meaning nothing, one they bring up at the next meeting about rent increases justified by 'building security.'"
  - "A university tells students an honor code makes proctors for a mid-term unnecessary. A student under deadline pressure, thinking only about the exam in front of them, checks a search engine for one answer while a proctor's back is turned. A single incident does the real work of convincing the room that the code was never actually enforced, and the faculty member who staked their credibility on it now has to explain, to a room that watched it happen, why nothing changes."
  - "A national park posts a stretch of coastline as closed to protect nesting shorebirds, and rangers tell local fishing crews the closure will hold for the season. A recreational boater who has never heard of the closure and has no opinion about the birds beaches a jet ski on the exact sand the rangers promised was off-limits. The rangers' credibility with the fishing crews they asked to voluntarily comply elsewhere in the park takes the hit, not the boater's."
critical-questions:
  - "Isn't this just saying any rule-breaker eventually gets caught, so nothing here is really different? What's different is the audience: the cost falls specifically on whoever staked their own credibility on the boundary holding, in front of the specific people who were told to trust it -- not on the boundary's abstract integrity or on some general erosion of law and order. A violation with no trusting audience present does much less of this particular damage."
  - "Doesn't this make every authority hostage to bad luck -- one random violator and their credibility is gone no matter how well they've protected things for years? The mechanism doesn't erase years of prior track record on its own; it hands the authority's skeptical followers a concrete instance to point to. Whether that instance overturns years of trust depends on how the authority responds afterward, visibly, in front of the same audience -- not on whether the instance occurred at all."
