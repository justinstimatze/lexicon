id: lex-qhwqk
name: fixed-deadlines-turn-early-starts-into-longer-waits
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a process has wildly variable start times but converges on a socially or institutionally fixed completion point, do not read the resulting negative correlation between start time and duration as evidence that early starters are slow or indecisive and late starters are quick and decisive. The correlation is a structural artifact of the fixed endpoint absorbing the variance that the start time didn't. Rogoff traced this directly in the timing of the decision to study medicine: 'students who first thought of becoming doctors when they were 8 years old waited, on the average, 8.2 years until they came to a final decision; students who \"started\" 10 years later, at age 18, waited an average of only 2 years. The initial difference of 10 years was thus reduced to 3.8. The decrease in elapsed time is so regular that a good deal of the lag is made up by a more rapidly reached commitment.' She reports the correlation between age at first considering a career in medicine and the number of years until the decision as -.62 across the whole sample. The mechanism is not that late starters are more decisive people — it is that the definite decision is keyed to a roughly fixed institutional window (here, the college years, ages 16-20), so anyone starting earlier necessarily has more calendar time to fill before that window arrives, and anyone starting later has correspondingly less. Variance in ENTRY time gets converted into variance in DWELL time precisely because variance in EXIT time is constrained by an external gate. This is distinct from commitment-crystallizes-at-the-first-available-overt-act (lex-gegnh): that atom explains WHY a fixed checkpoint exists at all (the checkpoint is the first point private intention becomes an expressible act); this atom describes the individual-level MATHEMATICAL CONSEQUENCE of that checkpoint being fixed — namely, that apparent differences in 'how long it took people to decide' partly measure nothing but when they happened to start relative to a target the whole population is converging on. Diagnostic move: before treating 'X took longer to decide/finish/commit than Y' as a fact about X's or Y's decisiveness, ability, or character, check whether both are bounded by the same fixed downstream deadline — if so, the duration difference is largely mechanical, not dispositional."
