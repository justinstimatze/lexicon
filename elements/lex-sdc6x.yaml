id: lex-sdc6x
name: fortune-arrives-mixed-never-purely-good
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern whenever someone reads their own suffering as unique persecution, or assumes another's visible good fortune means they are exempt from loss — the corrective is that fortune is apportioned as a MIXTURE to virtually everyone, and only a vanishingly rare, total outcast draws from misfortune alone. Homer's Iliad Book XXIV states this exactly. Achilles, urging the grieving Priam to eat before mourning further, explains: 'Beside Jove's threshold stand / Two casks of gifts for man. One cask contains / The evil, one the good, and he to whom / The Thunderer gives them mingled sometimes falls / Into misfortune, and is sometimes crowned / With blessings. But the man to whom he gives / The evil only stands a mark exposed / To wrong, and, chased by grim calamity, / Wanders the teeming earth, alike unloved / By gods and men.' Achilles does not leave the claim abstract — he immediately applies it to two vivid, concrete cases in the same breath. First, his own father Peleus: the gods gave him wealth, kingship over the Myrmidons, and a goddess for a wife — as fortunate a lot as any mortal's — 'yet did the gods / Add evil to the good, for not to him / Was born a family of kingly sons... / One short-lived son is his, nor am I there / To cherish him in his old age.' Second, Priam himself, seated across from him: 'thy wealth was large in former days... men said thou didst excel / All others in thy riches and thy sons. / But since the gods have brought this strife on thee / War and perpetual slaughter of brave men / Are round thy city.' The mechanism: extraordinary good fortune in one dimension (wealth, status, divine favor) does not exempt a person from also drawing a share of the evil cask — the appropriate response to one's own suffering is not 'why me, uniquely, of all people' but recognition of the general mixture, followed by a return to ordinary function (Achilles' concrete prescription: eat, rest, then resume mourning — grief indulged without end 'can bring no good'). Portable beyond the tent: a person whose career or public life looks enviably successful is privately carrying a severe illness or family loss, and onlookers who envy only the visible cask are missing the mixture; someone in the middle of a personal disaster reflexively narrates it as singular targeted misfortune ('why is this happening to ME specifically') when in fact the mixture is close to universal and the diagnostic question is not 'am I cursed' but 'what, if anything, is still in the good cask alongside this.' Diagnostic: before treating a loss as evidence of unmixed persecution, check for coexisting good (relationships, capacities, resources, status) that the mixed-cask frame predicts should still be present — Homer's marker for the rare, genuinely UNMIXED-evil case is total exposure, a person 'unloved by gods and men' with no compensating good at all, which is a much narrower and rarer category than ordinary grief."
related: [lex-v6kmc, lex-ykb5a, lex-a3kky, lex-yp3wh, lex-pnyzg]
evokes: [two-casks-of-zeus, jove-threshold-jars-of-good-and-evil, mixed-lot-of-mortals, peleus-wealth-and-childless-old-age, priam-riches-and-ruin, achilles-consolation-speech]
lineage:
  - source: primary
    text: homer-iliad-book-xxiv-two-casks-of-zeus
    citation: "Homer, Iliad, Book XXIV ('The Body of Hector Recovered'), trans. William Cullen Bryant (Boston: James R. Osgood and Company, 1870; PD — Bryant died 1878 — Standard Ebooks PD edition). After ransoming Hector's body, Achilles urges the grieving Priam to eat, and in doing so delivers the poem's theodicy of apportioned fortune — the 'two casks' or 'jars' of Zeus — applying it explicitly to his own father Peleus and to Priam himself as concrete instances of the universal mixture."
    quote: "[Achilles to Priam:] 'Beside Jove's threshold stand / Two casks of gifts for man. One cask contains / The evil, one the good, and he to whom / The Thunderer gives them mingled sometimes falls / Into misfortune, and is sometimes crowned / With blessings. But the man to whom he gives / The evil only stands a mark exposed / To wrong... So did the gods bestow / Munificent gifts on Peleus from his birth... Yet did the gods / Add evil to the good, for not to him / Was born a family of kingly sons... Of thee too, aged king, they speak, as one / Whose wealth was large in former days... But since the gods have brought this strife on thee / War and perpetual slaughter of brave men / Are round thy city.'"
canonical-instances:
  - "The direct textual anchor: Achilles states that Zeus apportions two casks, good and evil, and that virtually all mortals receive a mixture from both — only the rare total outcast draws from the evil cask alone."
  - "Achilles applies the frame to his own father Peleus: given wealth, kingship, and a goddess wife, yet denied a large family of heirs and denied a son present to care for him in old age — the good and evil coexist in the same life."
  - "Achilles applies the frame to Priam directly, in the same speech: once the wealthiest king in the region, now enduring war and the slaughter of nearly all his sons — the same mixture, differently proportioned."
  - "A person whose public or professional life looks enviably successful is privately carrying a severe illness or family loss; onlookers who envy only the visible good-cask contents are missing the mixture the frame predicts is almost always present."
  - "Someone in the middle of a personal disaster narrates it as uniquely targeted persecution ('why is this happening to ME') rather than checking, per the frame's diagnostic, what remains in the good cask alongside the loss."
critical-questions:
  - "isn't this the same as lex-v6kmc dichotomy-of-control (Epictetus)? No — dichotomy-of-control sorts what is and isn't within your agency once a situation is given; this atom is a claim about the prior STATISTICAL DISTRIBUTION of fortune itself (fate mixes good and evil for nearly everyone), an expectation-calibration frame rather than a locus-of-control frame. They compose: after recognizing your lot as an ordinary mixture rather than unique persecution, dichotomy-of-control still tells you what to do with what remains actionable."
  - "isn't this the same as lex-a3kky pre-natal/post-mortem symmetry (Lucretius)? No — Lucretius dissolves fear of a FUTURE state (death) by pointing to an already-accepted structurally identical PAST state (pre-natal non-existence); this atom addresses one's PRESENT lifetime allotment of fortune via a different logic entirely (near-universal admixture of good and evil), with no symmetry argument involved."
  - "isn't this the same as lex-ykb5a pendulum-between-pain-and-boredom (Schopenhauer)? No — Schopenhauer's pendulum is a claim about the INTERNAL STRUCTURE OF DESIRE (satisfied want yields boredom, unsatisfied want yields suffering) as a standing psychological mechanism; this atom is a claim about the EXTERNAL DISTRIBUTION of fortune (events, gifts, losses) as apportioned by fate, independent of desire's structure."
  - "how would you tell ordinary mixed suffering from the rare genuinely-unmixed case the poem also names? Check for coexisting good — relationships, capacities, resources, standing — alongside the loss. Homer's marker for the unmixed-evil case is total exposure: a person 'unloved by gods and men,' an outcast with no compensating good at all. Most grief, including severe grief, does not meet that bar, which is exactly the frame's corrective point against reading ordinary mixed loss as singular persecution."
