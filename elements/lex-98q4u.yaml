lineage:
  - source: primary
    text: porter-1979-buyer-selection
    citation: "Michael E. Porter, 'How Competitive Forces Shape Strategy,' Harvard Business Review, March-April 1979, section 'Powerful suppliers & buyers,' subsection 'Strategic action.'"
    quote: "As a rule, a company can sell to powerful buyers and still come away with above-average profitability only if it is a low-cost producer in its industry or if its product enjoys some unusual, if not unique, features. In supplying large customers with electric motors, Emerson Electric earns high returns because its low cost position permits the company to meet or undercut competitors' prices. If the company lacks a low cost position or a unique product, selling to everyone is self-defeating because the more sales it achieves, the more vulnerable it becomes. The company may have to muster the courage to turn away business and sell only to less potent customers. Buyer selection has been a key to the success of National Can and Crown Cork & Seal. They focus on the segments of the can industry where they can create product differentiation, minimize the threat of backward integration, and otherwise mitigate the awesome power of their customers."
canonical-instances:
  - "National Can and Crown Cork & Seal deliberately focusing on can-industry segments where they can build product differentiation and mitigate buyer power, rather than chasing the largest, most powerful accounts across the whole market."
  - "a consulting boutique that turns down a Fortune 500 client whose in-house procurement team would drive fees down to commodity rates, keeping its calendar open for mid-market clients who value the firm's specific expertise and don't shop every renewal."
  - "a marketplace seller who stops selling through the single dominant retail channel that keeps squeezing margins via delisting threats, and rebuilds volume across several smaller channels with less individual leverage over the seller."
critical-questions:
  - "isn't declining available revenue always a bad idea unless the company already has enough business? No — the claim is specifically about NET profitability, not top-line volume. Porter's framing is that selling to powerful buyers without a low-cost position or unique product is self-defeating BECAUSE the achieved sales make the company more vulnerable, not despite short-term revenue gains. The diagnostic is whether the marginal account's bargaining power will erode margin on the whole book of business, not whether the account offers real revenue in isolation."
  - "does this require refusing ALL large customers? No — Porter's own counter-case (Emerson Electric selling to large customers profitably) shows powerful buyers can be served well IF the seller holds an independent source of power (low-cost position or unique product) that offsets the buyer's leverage. The turn-away move applies specifically when the seller lacks that offsetting power."
  - "how is this different from lex-qa6hc supreme-achievement-in-adversarial-contests-is-winning-without-direct-confrontation? lex-qa6hc is a general adversarial-strategy claim that avoiding direct confrontation beats winning it. This atom names a narrower, specific mechanism within one force of Porter's framework: a seller's own CUSTOMER-PORTFOLIO COMPOSITION choice, where declining to sell to a specific class of buyer is the confrontation being avoided. lex-98q4u can be read as a business instantiation of lex-qa6hc's general principle, made concrete and operational for buyer-power situations specifically."
