lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch2-binding-primaries-remove-the-filter
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 2 'Gatekeeping in America.' The chapter traces backroom convention control (1830s-1968) as the filter that kept demagogues with real mass followings — Coughlin, Long, McCarthy, Wallace, Ford — out of the presidency, then the 1968 Democratic convention crisis and the McGovern-Fraser Commission's binding-primary reform that shifted nominating power from party insiders to primary voters."
    quote: "'These dual imperatives—choosing a popular candidate and keeping out demagogues—may, at times, conflict with each other.' ... 'An overreliance on gatekeeping is, in itself, undemocratic—it can create a world of party bosses who ignore the rank and file and fail to represent the people. But an overreliance on the 'will of the people' can also be dangerous, for it can lead to the election of a demagogue who threatens democracy itself. There is no escape from this tension. There are always trade-offs.' ... 'Binding primaries were certainly more democratic. But might they be too democratic? By placing presidential nominations in the hands of voters, binding primaries weakened parties' gatekeeping function, potentially eliminating the peer review process and opening the door to outsiders.'"
canonical-instances:
  - "The book's own case: Coughlin, Long, McCarthy, and Wallace each drew real mass support (Gallup and straw polls put several of them at 30-40 percent approval) but never came within reach of the presidency, because winning the nomination required buy-in from a network of insiders — donors, editors, elected officials — who judged them too electorally risky. After 1968, that requirement was gone; a candidate could win by appealing to primary voters directly."
  - "Hypothetical: a professional society replaces its nominating committee's vetted slate of candidates for president with an open write-in ballot open to any member. Turnout rises and members report feeling more heard, but a candidate with no governance experience and a record of ignoring the society's bylaws wins — something the committee's screen, whatever else was wrong with it, had reliably filtered out."
critical-questions:
  - "The invisible primary — buy-in from donors, editors, and activists needed to actually win primaries — persisted for roughly a quarter century after 1968 and did some of the old filtering work informally. Was the formal gatekeeping layer actually removed, or displaced onto a less visible, less accountable one, and does that distinction matter for the claim?"
  - "The pre-1968 convention system also excluded the poor, women, and minorities from any say in who got nominated. How do you tell, at the time a reform is proposed, whether the layer being removed is a needed filter or just a barrier that was only ever protecting an insider network's own position?"
  - "Levitsky and Ziblatt call this tension inescapable rather than solvable. If that's right, what would it even mean to design a selection process that keeps the filtering function without reintroducing an unaccountable gatekeeper — or is the trade-off simply structural, something no design fixes?"
