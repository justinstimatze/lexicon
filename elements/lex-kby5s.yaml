id: lex-kby5s
name: reciprocal-distrust-converts-evidence-evaluation-into-motive-imputation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two groups reach a high enough level of mutual distrust, watch for a specific substitution: instead of testing whether the other side's claim is true, people start asking why the other side believes it at all. Merton names the mechanism: 'Within a context of distrust, one no longer inquires into the content of beliefs and assertions to determine whether they are valid or not, one no longer confronts the assertions with relevant evidence, but introduces an entirely new question: how does it happen that these views are maintained? Thought becomes functionalized; it is interpreted in terms of its psychological or economic or social or racial sources and functions.' He's explicit about the trigger condition: 'this type of functionalizing occurs when statements are doubted, when they appear so palpably implausible or absurd or biased that one need no longer examine the evidence for or against the statement but only the grounds for its being asserted at all.' Freud supplies the mechanism at the individual level with a deliberately absurd example: someone claims the center of the earth is made of jam. 'The result of our intellectual objection will be a diversion of our interests; instead of their being directed on to the investigation itself, as to whether the interior of the earth is really made of jam or not, we shall wonder what kind of man it must be who can get such an idea into his head....' Use this to notice when a disagreement has stopped being about the claim and started being about the claimant — the switch itself is diagnostic of how much trust has already broken down between the two sides, independent of whether the original claim was true or false."
related: []
evokes: [merton-1957, functionalizing-thought, freud-jam-at-center-of-earth, motive-imputation-replaces-evidence, reciprocal-distrust, wissenssoziologie]
lineage:
  - source: primary
    text: merton-1957-functionalizing-under-distrust
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XII 'The Sociology of Knowledge,' pp.457-458. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'Within a context of distrust, one no longer inquires into the content of beliefs and assertions to determine whether they are valid or not, one no longer confronts the assertions with relevant evidence, but introduces an entirely new question: how does it happen that these views are maintained? Thought becomes functionalized; it is interpreted in terms of its psychological or economic or social or racial sources and functions... this type of functionalizing occurs when statements are doubted, when they appear so palpably implausible or absurd or biased that one need no longer examine the evidence for or against the statement but only the grounds for its being asserted at all.'"
  - source: primary
    text: merton-1957-freud-jam-footnote
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.458 fn.3, quoting Sigmund Freud, New Introductory Lectures (New York: W. W. Norton, 1933), 49."
    quote: "'Freud had observed this tendency to seek out the \"origins\" rather than to test the validity of statements which seem palpably absurd to us. Thus, suppose someone maintains that the center of the earth is made of jam. \"The result of our intellectual objection will be a diversion of our interests; instead of their being directed on to the investigation itself, as to whether the interior of the earth is really made of jam or not, we shall wonder what kind of man it must be who can get such an idea into his head....\"'"
canonical-instances:
  - "In a workplace where two factions already distrust each other, a proposal from the other faction gets met not with 'is this a good idea' but with 'what are they really after' — the response pattern itself signals that the working relationship has already broken down, regardless of whether the proposal had merit."
  - "Online debates between hardened opposing camps often skip straight to 'you're only saying that because you're a [label]' — the motive-imputation move Merton describes at the individual level, running as folk practice rather than academic Wissenssoziologie."
critical-questions:
  - "Is there a principled line between legitimately noting that a claim's origin makes it worth extra scrutiny (a paid researcher's industry-funded study) and illegitimately substituting origin-analysis for evidence-analysis? Merton doesn't fully separate a warranted flag for bias from the pathological substitution he's diagnosing."
  - "Does functionalizing ever correctly track truth — i.e., are there cases where 'why does he believe this' turns out to be the right question because the belief really is produced by a distorting interest, not just correlated with distrust?"
