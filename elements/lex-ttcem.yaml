id: lex-ttcem
name: many-trainable-mediocre-units-beat-a-few-innately-superior-ones
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When choosing between a small number of naturally excellent resources and a large number of ordinary ones, don't assume quality alone settles the question -- check whether the ordinary resource can be trained up to competence, because that possibility changes the comparison entirely. Kautilya's rival teachers make the intuitive case for quality: 'a forest with a few brave elephants is preferable to one with a large number of dull ones, on the grounds that, since [success in] war depends on the brave, a few animals can rout many cowardly ones and the defeated ones [turn around and] destroy their own army.' Kautilya's counter doesn't dispute that the brave elephants are individually better -- it names a structural asymmetry the quality argument ignores: 'It is better to have many dull elephants [than just a few brave ones]; they can be made to do many things in the army camp, provide protection to the troops and terrify the enemy troops by their numbers. It is also possible to make the many dull elephants valorous by [suitable] training. But the few, however brave, can never be made many.' The decisive asymmetry is directional: quantity can be converted into quality through training, but quality cannot be converted into quantity at all -- there is no process that turns a few excellent units into many excellent units, while there is a real process that turns many mediocre units into adequate or even excellent ones. The many dull elephants also carry value the few brave ones structurally cannot provide regardless of training -- camp labor, troop protection, and sheer intimidating numbers are functions of quantity itself, not of individual excellence. Diagnostic move: when comparing a small elite resource against a larger but currently weaker one, ask which direction of conversion is actually available -- if the larger pool can be trained, organized, or developed toward competence, its raw number is not just a consolation prize for lacking quality, it's an asset the smaller elite pool can never acquire, no matter how excellent its individual units remain."
