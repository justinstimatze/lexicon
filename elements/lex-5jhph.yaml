id: lex-5jhph
name: an-independent-witness-corroborates-effects-without-corroborating-content
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "An unverifiable inner experience can gain real credibility when an independent witness confirms its visible, external effects, even though that witness has no access to, and cannot corroborate, the content of the experience itself. Neihardt inserts Standing Bear's own separate testimony directly after Black Elk's account of his vision, and Standing Bear confirms exactly the parts a bystander could actually observe: that Black Elk really was gravely ill ('he looked dead, and everybody was talking about him'), that he really did recover suddenly and inexplicably ('he was well all at once, and everybody wondered'), and that he really was changed afterward ('he was not like a boy. He was more like an old man'). Standing Bear says nothing about the two spirit-men, the Six Grandfathers, or anything the vision actually contained -- he could not, since none of that was visible to him. The corroboration strengthens the claim that something real happened to Black Elk without ever touching the separate question of what that something was."
related: []
evokes: [black-elk-speaks, standing-bear-speaks, he-looked-dead, more-like-an-old-man, corroborating-visible-effects-not-content]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch4-the-bison-hunt
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 4, 'The Bison Hunt,' Standing Bear's inserted testimony. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "I remember the time when my friend here was sick. [...] Everybody in the village was well, and so was Black Elk. The next thing I heard was that he was dying and just breathing a little. [...] I saw him during this time. He looked dead, and everybody was talking about him. Then he was well all at once, and everybody wondered and talked about it. [...] But as we rode along together and talked, he was not like a boy. He was more like an old man."
canonical-instances:
  - "A person who reports a profound experience during a medical crisis has family members independently confirm the crisis itself, the flatlined vital signs, the sudden unexplained recovery, without those family members being able to confirm anything about what the person reports having experienced."
  - "A whistleblower's account of witnessing internal misconduct becomes more credible when a coworker independently confirms the whistleblower was visibly distressed and resigned abruptly afterward, even though the coworker never saw the misconduct itself."
  - "A soldier's account of a harrowing combat experience gains credibility when a fellow soldier independently confirms the soldier came back from that mission changed and withdrawn, without the second soldier having witnessed whatever specifically happened."
critical-questions:
  - "How much should corroboration of visible effects actually raise confidence in the content of an unverifiable claim, given that the same effects, illness, sudden recovery, behavioral change, could plausibly result from many different causes besides the one being claimed?"
  - "Neihardt placed Standing Bear's testimony directly after Black Elk's own account -- does that placement make the corroboration more persuasive than it would be if a reader had to seek it out independently, and should that effect worry a careful reader?"
  - "If Standing Bear's account had contradicted Black Elk's, for instance by saying he seemed entirely unchanged, would that have counted as real evidence against the vision's reality, or would a believer simply say the transformation was internal and invisible to a childhood friend?"
status: active
