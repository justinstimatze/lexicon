id: lex-ub53f
name: same-group-different-pay-refutes-a-pure-discrimination-explanation
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When a group's low pay for a specific type of labor is attributed entirely to discrimination against that group (their identity is why the work is undervalued), check whether the SAME group commands high pay for a DIFFERENT task under different market conditions. If it does, the discrimination-only account is refuted, or at least incomplete: the group's identity cannot be the sole driver of low value if the same group's labor is priced highly elsewhere. Redirect the explanation toward what actually varies between the two cases -- typically the value of what an hour of that specific labor produces, given the volume of output needed and the price the output commands -- rather than treating the identity of the worker as the whole causal story. This does not deny that discrimination against the group can ALSO be real and additive; it denies that a single case of low pay, on its own, proves discrimination is the operative cause without checking the same group's pay elsewhere first."
related: []
evokes: [wage-gap-confound, spinsters-wages, silk-throwing-maestre, value-per-hour-of-labor, marginal-value-not-identity, deborah-valenze-rebutted]
lineage:
  - source: primary
    text: postrel-2020-fabric-of-civilization-ch2-thread
    citation: "Virginia Postrel, The Fabric of Civilization: How Textiles Made the World (Basic Books, 2020), Chapter Two: Thread, on preindustrial English spinners' wages versus Piedmontese silk-throwing maestre's wages -- both categories of skilled labor performed almost exclusively by women."
    quote: "'Despite her essential role in England's economic fate, the spinster received penurious wages for her work,' writes historian Deborah Valenze. She blames the low pay on sexism. 'Stigmatized by its association with women's work, spinning never earned wages commensurate with the demand for thread.' The simple morality tale of oppressed female workers misses the inescapable mathematics of fabric production. Thread may be essential but, unless the final cloth is extremely expensive, the value of an hour of spinning is necessarily low. The maestre were well paid, with higher wages than many men earned, because the fabric their work supplied was costly silk. Valenze has the causality reversed. Spinning paid little not because women did it but because it took so long to produce useful amounts of yarn. The product of an hour's labor simply wasn't worth that much. Women took this low-paid work because they had fewer options than men. The oppression lay not in the wages paid for spinning but in the absence of alternative employment for women."
canonical-instances:
  - "Eighteenth-century English cotton and flax spinners -- overwhelmingly women and girls -- earned one to five shillings a week, while weavers (also often women, for lighter fabrics) earned three to ten shillings for the same period. In the same corpus's chapter, Piedmontese maestre reeling silk earned wages higher than many male laborers, and when a Piedmontese maestra named Teresa Perona was recruited to a new Spanish silk factory in 1776, her own contract paid her 50 percent more than the matching job given to her husband."
  - "The 1771 parliamentary cost breakdown for a standard worsted woolen cloth selling for 35 shillings: raw wool cost 12 shillings, spinning (paid to women) cost nearly 12 shillings, weaving cost only 6 shillings, and the manufacturer's profit was just over 2 shillings. Spinning's high total COST to the trade and each individual spinner's low WAGE were the same fact viewed from two sides: an enormous number of hours were needed, each hour paid little, and the sum was still one of the biggest line items in the whole production chain."
critical-questions:
  - "Does the same demographic group command meaningfully different pay for a different task, under different market conditions, than the task in question? If the answer is no -- if the group is underpaid across the board regardless of what they produce -- the discrimination explanation gets stronger, not weaker."
  - "Is the disparity actually in the WAGE (pay per hour) or in the OPTIONS available (what other work the group could do instead)? Postrel locates the real oppression in restricted alternatives, not in the price paid for this particular skill -- these are different claims requiring different evidence and implying different remedies."
  - "Is there a confound in the OTHER direction -- could the same-group-different-pay pattern itself be explained by discrimination operating differentially across occupations, rather than by output value alone? The mathematics-of-production explanation and a discrimination explanation aren't mutually exclusive; establishing that one operates doesn't by itself rule out the other operating too."
