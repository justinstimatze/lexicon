id: lex-u3wrj
name: under-satisfy-a-recruit-to-keep-them-motivated-for-work
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you're managing the appetite of a recruited force ahead of the actual task, don't give them a full, satisfying reward every time -- calibrate the earlier feedings to be generous enough to bond and recruit them, but the final one before the real work begins should leave them wanting more, not less. In Cushing's telling, the youth feeds his recruited pack of Dogs lavishly at the first rendezvous, building loyalty and enthusiasm through genuine abundance. But before the actual ambush, his approach shifts deliberately: he is 'feeding them again, rather more sparingly than at first that they may be anxious for their work.' The first feast built the alliance; the second, smaller one preserves the hunger that makes them fight hard when the moment comes. Full satisfaction at the wrong moment would have blunted exactly the edge he needed from them. Diagnostic move: when calibrating rewards for a team or force ahead of a critical push, distinguish the feeding that builds loyalty and commitment from the feeding that happens right before the real work -- generosity earlier and restraint immediately before the task aren't a contradiction, they're two different tools serving two different purposes, and using the wrong one at the wrong moment can cost you the very motivation you spent the first reward building."
related: []
evokes: [calibrate-the-reward-differently-before-recruitment-than-before-work, cushing-the-warrior-suitor-of-moki, rather-more-sparingly-than-at-first-that-they-may-be-anxious-for-their-work, the-first-feast-bonds-the-second-one-sharpens]
lineage:
  - source: primary
    text: cushing-warrior-suitor-moki-feeds-dogs-sparingly-before-the-ambush
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Warrior Suitor of Moki.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'I shall leave forthwith on my journey, having provided myself with a sufficiency of food for much feasting on the way...' ... Thereupon he liberally distributed mush, tortillas, and paper bread... The Dogs, being very hungry... fell to with avidity... Finally, when all were assembled and had eaten, if not to their satisfaction--that was impossible--yet to their temporary gratification... he is giving directions to the Dogs in a quiet manner, and feeding them again, rather more sparingly than at first that they may be anxious for their work."
canonical-instances:
  - "A sales manager who wants a team fully motivated for a critical end-of-quarter push gives generous recognition and rewards earlier in the quarter to build loyalty and buy-in, but deliberately keeps the final pre-push incentive structure lean and contingent on performance, preserving the hunger that a fully guaranteed bonus earlier would have dulled."
  - "A coach preparing a team for a championship game holds an earlier team dinner and celebration to build camaraderie after a strong regular season, but keeps the pre-game meal and rewards deliberately modest and performance-contingent, understanding that full satisfaction right before the competition would blunt the edge the earlier bonding was meant to produce."
critical-questions:
  - "how does someone calibrate the difference between 'anxious for their work' and simply under-fed and resentful -- what's the actual signal that distinguishes productive hunger from a recruited force starting to feel exploited or shortchanged right before the moment they're needed most?"
  - "does this tactic risk damaging the trust built during the earlier, generous feeding, if the recruited force notices the pattern and starts to suspect the initial generosity was purely instrumental rather than genuine care?"
  - "is there a meaningful ethical difference between calibrating a reward schedule for a willing, informed participant versus doing it to animals or people who don't fully understand they're being managed this way -- does the tactic's legitimacy depend on the recruited party's awareness of what's happening?"
