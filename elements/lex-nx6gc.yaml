id: lex-nx6gc
name: an-institutions-founding-figure-gets-purged-as-it-formalizes
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "As a culture's mythic figure gets adopted as the founding hero of a formal, institutionalized religious rite, its more disreputable, comic, or embarrassing traits get progressively edited out to match the dignity the new institution requires, and the degree of editing tracks how far the institutionalization actually went, not a single uniform cleanup. Radin traces this directly: 'the character of Hare has been purged in order to make him conform more perfectly to the picture of a true culture-hero,' and pins the timing to a specific institutional development: 'this transformation and renovation of his personality and activities presumably received its final expression when these two tribes, the Winnebago and the Iowa, developed the present form of the Medicine Rite.' Crucially, the purging wasn't complete everywhere it started: 'The purging of Hare, his evolution from a trickster to a typical culture-hero among these two tribes may, however, have begun much earlier. It was never more than partial. Only among the Winnebago did it become complete.' The same founding figure, filtered through different degrees of institutional formalization across related tribes, ends up with different amounts of trickster residue still visible. Diagnostic move: when a colorful or disreputable historical figure has been adopted as the official founder or namesake of a formalized institution, check how far that formalization has actually progressed before assuming the figure's public image has been fully cleaned up -- an institution still mid-formalization will often still carry visible, undeleted traces of the original, messier figure."
related: []
evokes: [radin-the-winnebago-hare-cycle-and-its-cognates, hare-has-been-purged, the-medicine-rite, never-more-than-partial]
lineage:
  - source: primary
    text: radin-hares-trickster-traits-are-purged-as-the-medicine-rite-formalizes
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle and Its Cognates.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "We must consequently Conclude that among the Winnebago and Iowa the character of Hare has been purged in order to make him conform more perfectly to the picture of a true culture-hero. This transformation and renovation of his personality and activities presumably received its final expression when these two tribes, the Winnebago and the Iowa, developed the present form of the Medicine Rite, which could not have occurred before the beginning of the eighteenth century. ... The purging of Hare, his evolution from a trickster to a typical culture-hero among these two tribes may, however, have begun much earlier. It was never more than partial. Only among the Winnebago did it become complete."
canonical-instances:
  - "A company's official founding story features its eccentric, rule-breaking founder as a disciplined visionary once the company goes public and needs an image matching a regulated, institutional identity, even though earlier internal accounts freely discussed the founder's disregard for norms."
  - "A religious movement's early, temperamental founder gets remembered in official doctrine as a serene, dignified sage only after the movement establishes a formal priesthood and liturgy, while offshoot sects that never formalized to the same degree still tell stories about the founder's original volatile temperament."
critical-questions:
  - "Does Radin's claim that the purging tracks the Medicine Rite's formalization rest on solid comparative evidence, or is the timing correlation circumstantial given his own footnote that the dating of the Medicine Rite's origin is 'as yet unpublished' evidence?"
  - "Is a fully purged figure like the Winnebago Hare meaningfully different in function from the Ponca's genuinely split two-figure solution, where Ishtinike keeps the trickster traits and Hare stays a cleaner culture-hero, or are these two different solutions to the same underlying pressure?"
  - "Would this diagnostic apply to institutions that formalize suddenly rather than gradually, or does it specifically require the kind of slow, uneven, tribe-by-tribe formalization Radin describes to produce a visible gradient of purging?"
status: active
