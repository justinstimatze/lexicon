id: lex-hduha
name: reject-a-tactic-whose-damage-you-cannot-confine-to-its-target
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When choosing between an effective tactic and a more effective one, don't evaluate them only by success rate -- check whether the more effective option's damage can actually be aimed, since a tactic whose destructive effect spreads beyond your intended target is a different category of risk than one that's merely more forceful. Kautilya rules out fire as a siege method specifically on these grounds, even while acknowledging it works: 'When a fort can be captured by fighting, fire shall not be used at all. For fire is a divine calamity whose effects are unpredictable; it is a destroyer of uncountable numbers of people as well as grains, animals, wealth, forest produce and other goods. Even when captured, a fort whose stores are all burnt down only gives rise to further losses.' The objection isn't that fire fails to work, or even that it's disproportionately cruel -- it's that fire's effects are 'unpredictable,' meaning the tactic itself has no mechanism for staying confined to the intended target once deployed, and its damage reliably extends to grain, animals, and goods that were never the point of the campaign at all. This is a distinct concern from proportionality (is this response too harsh for the offense) or from the earlier concern about destroying the prize you're fighting for -- it's specifically about controllability: some tactics are effective and precisely targetable, while others are effective but spread damage according to their own physics rather than your intentions, and the second kind carries a category of risk the first doesn't, regardless of how urgently you need the win. Diagnostic move: before adopting a highly effective but forceful tactic, ask specifically whether its damage can be confined to the intended target once set in motion, or whether it propagates on its own terms (spreading, escalating, affecting bystanders) -- and treat a 'yes it works but I can't fully control where it stops' answer as a distinct, serious cost, separate from whether the tactic is otherwise justified."
