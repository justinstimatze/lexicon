lineage:
  - source: primary
    text: kautilya-arthashastra-who-shall-not-be-harmed-during-an-assault
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'The Siege,' 'Storming the Fort,' 'The Assault,' {13.4.50-53}."
    quote: "'The following shall not be harmed when the enemy fort or camp is attacked: (i) anyone falling down in the fight; (ii) those turning their backs; (iii) anyone surrendering; (iv) anyone who unties his hair [as a symbol of surrender?] or throws his weapons down; (v) anyone contorted by fear; or (vi) anyone who does not fight.'"
canonical-instances:
  - "A company laying off a division instructs managers to base severance and treatment decisions on observable factors (tenure, role being eliminated, documented performance record) rather than asking managers to informally judge who was 'really' loyal or hardworking, because a character-based rule applied inconsistently by dozens of different managers under time pressure would produce arbitrary, unequal outcomes."
  - "A content moderation policy protects any account that stops posting violating content and doesn't re-offend within a set window, rather than trying to judge whether the account holder is 'truly remorseful' or merely being strategic, because remorse can't be verified at scale while a clean posting record for a defined period can."
critical-questions:
  - "does relying purely on observable behavior let genuinely bad actors game the rule by performing the protected signal (feigning surrender, faking disengagement) without actually having changed their underlying intent, creating an exploitable loophole a character-based judgment might have caught?"
  - "does this approach risk under-protecting people whose disengagement isn't visible in the specific ways the rule anticipates -- someone frozen in shock rather than visibly fleeing, or constrained from throwing down a weapon -- leaving genuine non-combatants unprotected simply because their situation doesn't match the checkable signal?"
  - "how does an organization decide which observable behaviors actually correlate well enough with the underlying state (disengagement, harmlessness) to be trusted as proxies, and who is accountable when a checkable-but-imperfect proxy produces a clearly wrong outcome in a specific case?"
