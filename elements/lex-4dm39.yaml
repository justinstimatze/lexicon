canonical-instances:
  - "Children who say they want to be a 'scientist' typically picture discovery and experimentation, because that is the facet visible from outside the activity; graduate students already doing the coursework and lab rotations that produce scientific results come to see grant-writing, statistics, and incremental troubleshooting as central, because that is the facet their own current work overlaps with — neither image is wrong about what science contains, each is anchored to a different slice of it."
  - "Someone considering law from outside the profession pictures courtroom argument, because that is the visible, dramatized facet; a law student spending years on casebooks and doctrinal analysis comes to see law primarily as textual and argumentative reasoning, because that is the facet their own daily activity resembles — both are describing real parts of what lawyers do."
critical-questions:
  - "Rogoff's own data suggests the youthful deciders' interpersonal image persisted despite years of subsequent exposure to the same pre-med environment as later deciders — does the vantage effect ever fully correct with enough time and overlapping activity, or does the facet salient at first formation stay disproportionately weighted indefinitely, and if so, why would later, more accurate exposure fail to overwrite it?"
  - "Is either the outside view or the inside view actually the more complete or useful one for predicting later satisfaction or performance in the role, or does the value of each depend entirely on which facet turns out to matter more for a given person's actual day-to-day work once they are in it?"
status: active
