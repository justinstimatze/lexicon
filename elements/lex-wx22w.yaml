name: common-sense-argument-to-defect-when-the-resource-dries-up
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'An outside party frames abandonment of a now-unrewarding commitment as simple rationality, pointing out that everyone else has already left and there is no practical reason to stay, presenting defection as the obviously sensible choice rather than a betrayal. This functions as a temptation precisely because the advice is locally reasonable — resisting it requires a value like loyalty that isn''t visible in a narrow cost-benefit frame. In the Jataka''s tale of Mahasuka, Sakka in disguise urges the parrot to leave the depleted tree on exactly this pragmatic footing: "Haste thee, Sir Redbeak, to be gone; / Why dost thou sit and dream alone? / Come tell me, prithee, bird of spring, / To this dead stump why dost thou cling?"'
related: []
evokes: [jataka, navanipata, mahasuka-jataka, pragmatism-as-temptation-to-defect, narrow-cost-benefit-framing]
