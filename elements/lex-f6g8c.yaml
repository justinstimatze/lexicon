evokes: [crenshaw-basement-hatch, but-for-test, jakobson-markedness, unmarked-equals-default, default-user-fallacy, invisible-women-bias, the-protected-but-privileged, canonical-member-trap]
lineage:
  - source: primary
    text: Crenshaw-1989-DemarginalizingTheIntersection
    citation: "Kimberlé Crenshaw, *Demarginalizing the Intersection of Race and Sex: A Black Feminist Critique of Antidiscrimination Doctrine, Feminist Theory and Antiracist Politics* (1989), *University of Chicago Legal Forum* Vol 1989 Iss 1 Article 8, pp.139-167. The OPERATIONAL MECHANISM Crenshaw names — distinct from the epistemic non-decomposability claim lex-et8q2 carries — is that single-axis antidiscrimination categories take their canonical case as the otherwise-privileged member of the protected class. Race-discrimination doctrine's canonical-case = Black men (otherwise-privileged-by-sex); sex-discrimination doctrine's canonical-case = white women (otherwise-privileged-by-race). The `but for` test then admits cases only if `but for race` or `but for sex` would have changed the outcome — a test that the multiply-burdened cannot pass because both race AND sex co-produce the harm. Crenshaw consolidates this in the basement/hatch analogy (pp. 151-152): people disadvantaged across multiple axes are stacked feet-on-shoulders in a basement; the hatch into the protected upper-room admits only those whose burden is SINGULAR — i.e., who would be in the upper room `but for` one axis. The multiply-burdened are structurally excluded by the categorical apparatus, not by individual decision-makers' malice. The transferable form lex-f6g8c carves: any classification category whose canonical case is operationally defined as the otherwise-privileged member of that category structurally excludes the intersection. This generalizes far beyond Title VII — medical research samples, default-user product design, training-data corpora, linguistic markedness, statistical baselines all exhibit the same mechanism. Crenshaw's contribution here is the explicit naming of the mechanism (privileged-default → but-for-test → intersection-excluded), not just the epistemic claim that intersections are non-decomposable (which lex-et8q2 carries via Cooper + Crenshaw)."
    quote: "[Crenshaw 1989 p.151, the foundational mechanism passage:] 'This narrow objective is facilitated by the top-down strategy of using a singular `but for` analysis to ascertain the effects of race or sex. Because the scope of antidiscrimination law is so limited, sex and race discrimination have come to be defined in terms of the experiences of those who are privileged but for their racial or sexual characteristics. Put differently, the paradigm of sex discrimination tends to be based on the experiences of white women; the model of race discrimination tends to be based on the experiences of the most privileged Blacks. Notions of what constitutes race and sex discrimination are, as a result, narrowly tailored to embrace only a small set of circumstances, none of which include discrimination against Black women.' [The basement/hatch analogy, pp.151-152:] 'Imagine a basement which contains all people who are disadvantaged on the basis of race, sex, class, sexual preference, age and/or physical ability. These people are stacked—feet standing on shoulders—with those on the bottom being disadvantaged by the full array of factors, up to the very top, where the heads of all those disadvantaged by a singular factor brush up against the ceiling. Their ceiling is actually the floor above which only those who are not disadvantaged in any way reside. In efforts to correct some aspects of domination, those above the ceiling admit from the basement only those who can say that `but for` the ceiling, they too would be in the upper room. A hatch is developed through which those placed immediately below can crawl. Yet this hatch is generally available only to those who—due to the singularity of their burden and their otherwise privileged position relative to those below—are in the position to crawl through. Those who are multiply-burdened are generally left below unless they can somehow pull themselves into the groups that are permitted to squeeze through the hatch.' [Practitioner-extraction: the categorical apparatus structurally selects for the otherwise-privileged member as its canonical case; the `but for` test operationalizes that selection; the multiply-burdened are excluded BY THE CATEGORY DESIGN, not by individual bias. This is the transferable mechanism lex-f6g8c names.]"
  - source: cross-attestation
    text: cross-domain-attestation-canonical-case-defaults-to-privileged-member
    citation: "Cross-domain attestation that the canonical-case-defaults-to-privileged-member pattern recurs as a structural mechanism across formal classification systems, far beyond Title VII. (a) Linguistic markedness — Roman Jakobson 1932 `Zur Struktur des russischen Verbums` and Jakobson 1971 *Selected Writings II* consolidated the markedness theory: in binary pairs (man/woman, doctor/female-doctor, white/Black, hetero/homo, normal/disabled) the UNMARKED term carries the unstated default, the MARKED term names the deviation. The unmarked is operationally the canonical case; the marked is the explicit-deviation. Lakoff & Johnson 1980 + Lakoff 1987 *Women, Fire, and Dangerous Things* extend this to prototype-theory: categories have central exemplars (prototypes) with structural priority; non-prototypical members are recognized as `that, but more X.` The prototype is operationally the canonical case. (b) Medical research bias — FDA Guideline for the Study and Evaluation of Gender Differences in the Clinical Evaluation of Drugs (1977) excluded women of reproductive age from Phase 1 and most Phase 2 trials; not reversed until 1993. Outcome: drug dosages calibrated to male physiology; women experience ~50-75% higher rate of adverse drug reactions. The canonical `patient` defaulted to thin-able-bodied-male; non-default cases (women, elderly, racial-minority populations whose drug-metabolism alleles differ) were structurally excluded. Caroline Criado-Perez 2019 *Invisible Women* documents this across medicine, urban planning, automotive safety, workplace design, and disaster relief. Sandra Harding 1986 *The Science Question in Feminism* names the structural mechanism as `the gender of science` — the unmarked scientist defaults to male. (c) Crash-test dummies — until 2011 the Hybrid III default test dummy was modeled on the 50th-percentile US male (~1976 anthropometry). Women are ~47% more likely to be seriously injured in front-impact crashes calibrated to that default (Bose et al 2011, AJPH); pregnant occupants entirely absent from crash-test apparatus until 2002 MAMA-2B prototype. The canonical `vehicle occupant` defaulted to median-male; non-default cases were structurally excluded from safety testing. (d) Speech recognition systems — Tatman 2017 (`Gender and Dialect Bias in YouTube's Automatic Captions`) and Koenecke et al 2020 PNAS document systematically higher word-error rates for women and Black speakers in commercial ASR. Cause: training corpora dominated by white-male English. The canonical `speaker` defaulted to white-male; non-default speakers were structurally underserved. (e) Skin-color defaults — Band-Aids defaulted to peach `flesh-tone` until 2020 release of multi-shade options; `nude` color defaults in fashion catalogs default to light-tan; ML face-detection trained on light-skinned faces (Buolamwini-Gebru 2018 `Gender Shades`) has 34.7% higher error rate on darker-skinned women than lighter-skinned men. (f) Cardiology — heart-attack textbook presentation = male presentation (crushing substernal chest pain, left-arm radiation); female-typical presentation (nausea, jaw pain, fatigue without crushing chest pain) routinely misdiagnosed and underweighted in triage; outcome: women's heart-attack mortality rate ~15-20% higher than men's in matched cases (Maserejian et al 2009; Mehta et al 2016). The canonical `cardiac patient` defaulted to male; non-default presentation was structurally undertrained. (g) Default-user fallacy in HCI — Erika Hall 2018 + Liu 2013 + accessibility-research literature documents how product-design's default `user persona` defaults to high-income, tech-fluent, able-bodied, native-English; accessibility/i18n/affordability features are downstream additions to the canonical design rather than upstream constraints. The transferable structural form: across legal classification (Crenshaw), linguistic markedness (Jakobson), medical research (Criado-Perez), training-data corpora (Buolamwini-Gebru), and product design (Hall), the same pattern recurs — categories take their canonical case as the otherwise-privileged member, and non-default cases are structurally excluded by the category design rather than by individual bias."
    quote: "Cross-domain pattern: legal antidiscrimination categories (Crenshaw), linguistic markedness (Jakobson), medical research samples (Criado-Perez `Invisible Women`), crash-test anthropometry (Bose et al), speech recognition corpora (Koenecke et al), facial recognition training data (Buolamwini-Gebru `Gender Shades`), cardiology textbook presentation (Maserejian et al), and product-design default-user personas all exhibit the same structural form — the category's canonical case is operationally defined as the otherwise-privileged member, and non-default cases are excluded by the apparatus rather than by individual decision-makers. The transferable diagnostic: ask what the category's TYPICAL CASE is assumed to be (not what the category claims to cover); if the typical case is consistently the otherwise-privileged member, the mechanism is operating and the non-default cases are structurally excluded. The fix is not `expand the category` (additive) but `redesign around an explicitly non-privileged canonical case OR refuse the single-canonical-case assumption altogether` (structural)."
canonical-instances:
  - "Crenshaw 1989 basement/hatch analogy: people disadvantaged across multiple axes stacked feet-on-shoulders; the hatch admits only those whose burden is SINGULAR (i.e., who would be in the upper room `but for` one axis). The multiply-burdened cannot pass the `but for` test because both axes co-produce the harm. The basement/hatch is the decisive illustration of the privileged-default mechanism — the category's protection is structured around the LEAST-burdened cases within the category."
  - "Crenshaw's three Title VII cases (DeGraffenreid 1976, Moore 1983, Payne 1982): Black women plaintiffs whose race-discrimination claims fail because race is operationally defined via Black-men's experience, AND whose sex-discrimination claims fail because sex is operationally defined via white-women's experience. The intersection of race-AND-sex co-producing the harm is unrepresentable in the categorical apparatus."
  - "Linguistic markedness (Jakobson 1932/1971): in binary pairs, unmarked = default = canonical case; marked = explicit deviation. `Doctor` vs `female doctor`; `American` vs `Asian American`; `Christian` vs `Black Christian`; the marking always identifies departure from the otherwise-privileged default."
  - "Medical research: FDA 1977 exclusion of women of reproductive age from drug trials (not reversed until 1993); outcome ~50-75% higher adverse-drug-reaction rate in women. The canonical `patient` defaulted to thin-able-bodied-male. (Criado-Perez 2019 *Invisible Women* documents this across medicine, urban planning, vehicle safety, workplace design.)"
  - "Crash-test dummies: Hybrid III default (50th-percentile US male, 1976 anthropometry) used until 2011; women ~47% more likely seriously injured in front-impact crashes calibrated to that default (Bose et al 2011); pregnant occupants absent from crash-test apparatus until 2002. The canonical `vehicle occupant` defaulted to median-male."
  - "Speech recognition systems: training corpora dominated by white-male English; systematic ~30% higher word-error rate for women and Black speakers (Tatman 2017, Koenecke et al 2020 PNAS). The canonical `speaker` defaulted to white-male; non-default speakers structurally underserved."
  - "Facial recognition: Buolamwini-Gebru 2018 *Gender Shades* — commercial face-detection systems had 34.7% higher error rate on darker-skinned women than lighter-skinned men. Cause: training corpora dominated by light-skinned faces. The canonical `face` defaulted to light-skinned-male."
  - "Cardiology textbook heart-attack presentation: crushing substernal chest pain, left-arm radiation = male presentation. Female-typical presentation (nausea, jaw pain, fatigue without crushing chest pain) routinely misdiagnosed; women's heart-attack mortality rate ~15-20% higher than men's in matched cases (Maserejian et al 2009; Mehta et al 2016). The canonical `cardiac patient` defaulted to male."
  - "Default-user fallacy in HCI: product-design's `user persona` defaults to high-income, tech-fluent, able-bodied, native-English; accessibility/i18n/affordability are downstream additions to the canonical design rather than upstream constraints. Hall 2018 + Liu 2013 document this pattern across SaaS and consumer-tech design."
  - "operationally distinct from lex-et8q2 intersectional-position-not-decomposable-into-component-axes: lex-et8q2 is the EPISTEMIC claim (intersectional position has emergent content not reducible to component axes). lex-f6g8c is the OPERATIONAL MECHANISM (categories take their canonical case as the otherwise-privileged member; the apparatus excludes intersections by design). Composition: lex-f6g8c is the structural ROUTE by which lex-et8q2's erasure happens in formal classification systems. Crenshaw 1989 names both moves; they compose."
  - "operationally distinct from lex-y2nej dominant-group-values-encode-the-evaluative-standard-of-what-counts-as-serious: lex-y2nej is about EVALUATIVE-STANDARDS (what counts as legitimate/serious/important). lex-f6g8c is about CATEGORICAL-MEMBERSHIP-DEFAULT (who is the assumed-typical-member of a defined category). Compose: lex-y2nej explains why the privileged-default's standards become the field's norm; lex-f6g8c explains how the privileged-default gets baked into category-membership operationally."
  - "operationally distinct from lex-uqmd7 within-subordinated-group-relations-unrepresented-when-cross-gradient-relations-dominate: lex-uqmd7 is about REPRESENTATIONAL ratio (within-group vs cross-gradient depiction). lex-f6g8c is about CANONICAL-CASE definition (who is the assumed-typical-member). Compose: lex-uqmd7 names a downstream representational consequence of lex-f6g8c's canonical-case selection (when the canonical case is the otherwise-privileged member, within-group relations involving non-default members get squeezed out of representation)."
  - "operationally distinct from lex-3ezh8 matrix-of-domination-operates-across-interlocking-axes-and-three-levels: lex-3ezh8 is the STRUCTURAL-ARCHITECTURAL frame (multi-axis multi-level system). lex-f6g8c is the OPERATIONAL MECHANISM by which one level (institutional/categorical) excludes intersections. lex-f6g8c is a more specific cut INSIDE lex-3ezh8's broader architecture."
  - "operationally distinct from lex-t7xcp common-oppression-claim-erases-intra-group-stratification-when-appropriated-by-the-privileged: lex-t7xcp is about RHETORIC (`we are all oppressed` claim made by within-group privileged to erase stratification). lex-f6g8c is about CATEGORY DESIGN (canonical case structurally defaults to privileged). Compose: lex-t7xcp names the discursive form of erasure; lex-f6g8c names the categorical-apparatus form."
critical-questions:
  - "is the category in question operationally defined around the otherwise-privileged member, or is its definition genuinely axis-agnostic? The atom requires DEMONSTRABLE default — a research sample, a legal canonical-case, a training corpus, a design persona that consistently picks the privileged subgroup. If the category is genuinely axis-agnostic (e.g., chemical compounds, mathematical objects) the atom does not fire."
  - "is the structural exclusion of non-default cases a property of the category design, or of individual decision-makers within the system? Crenshaw's specific contribution is that the exclusion is STRUCTURAL — the apparatus produces it even when individual decision-makers act in good faith. Discriminator: does removing biased individuals fix the problem, or do non-default cases still fail because the category itself is built around the privileged default? If the latter, lex-f6g8c applies."
  - "what counts as the canonical case for a given category? Operational test: look at the research samples used, the legal `but for` baselines, the training-data demographics, the test-case selection. The canonical case is the empirical pattern, not the official statement of who the category covers."
  - "is the transferable form distinct from lex-et8q2 in the specific case at hand, or is the case adequately diagnosed by lex-et8q2 alone? Single-case rule: if the case is about WHAT is missed (intersectional content), lex-et8q2 alone suffices. If the case is about HOW the apparatus systematically misses it (canonical-case selection + `but for` test + training-corpus default), lex-f6g8c adds the structural-mechanism diagnosis."
  - "does the atom counsel `expand the category` (additive remedy) or `redesign around an explicitly non-privileged canonical case OR refuse the single-canonical-case assumption` (structural remedy)? Crenshaw and the cross-domain literature converge on the structural remedy — the additive remedy (`include more women in trials`; `add Black women as a category`) leaves the canonical-case mechanism intact and downstream non-default cases re-emerge. The structural remedy refuses the privileged-default at design-time."
