id: lex-jnuzp
name: calibrate-your-concession-to-what-this-specific-threat-actually-wants
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you're forced to concede something to a more powerful party, don't apply a single standard concession regardless of who you're dealing with -- what you give up should track what that specific party is actually trying to get, because over-conceding to a limited threat and under-conceding to an unlimited one are both avoidable mistakes. Kautilya sorts aggressors into three types by the scope of what would actually satisfy them, and matches the weaker party's response to that scope rather than to a uniform rule: 'The righteous aggressor is satisfied with submission. The weak shall yield to him, particularly when there is danger from another enemy. The greedy aggressor is satisfied with seizing land and goods. The weak king shall give up wealth to him. The monstrous aggressor is satisfied only when he takes the land, goods, wives, sons and [even the] life of the defeated. A weak king may give up land and goods but shall not let himself be taken.' The mechanism is that concession is only useful when it actually satisfies the taker -- giving mere symbolic submission to a purely greedy aggressor who wants your material wealth doesn't end the threat, it just delays the actual demand; and giving up wealth to a monstrous aggressor who wants your person or your family doesn't satisfy him either, so the wealth is lost for nothing while the deeper threat remains. The one constant across all three types is the line that never moves regardless of aggressor type: however much is conceded, personal survival and autonomy is the boundary that stays non-negotiable even against the type of threat where everything else, including symbolic submission and material wealth both, is on the table. Diagnostic move: before deciding what to concede to someone with power over you, first diagnose what would actually satisfy them specifically -- a symbolic gesture, a material payment, or something closer to total domination -- and calibrate your concession to that read rather than to a generic script, while treating your own irreducible core (whatever that is for the situation) as the one thing you withhold even from the type of threat that would take everything else."
