    quote: "Are there none who govern the world? are they on a journey? or peradventure they are dead, and therefore save not my dear husband!"
canonical-instances:
  - "A customer whose support tickets go unanswered for weeks stops emailing the help desk directly and instead posts publicly asking whether the company still has a support team at all — and gets a personal reply from an executive within the hour."
critical-questions:
  - "The taunt works here because Sakka genuinely has the power to act and was simply unaware, not unwilling. What happens when the taunted authority is actually absent, powerless, or indifferent — does the public questioning just document the absence rather than provoke a response?"
  - "Both this tale and 1 Kings 18:27 show the taunt succeeding or being met with silence that itself becomes evidence (Baal's prophets get no answer at all, which is the point of that scene). Is the taunt's real function to provoke a response, or to produce a public, legible record of whether one comes?"
