id: lex-5xsfx
name: single-use-training-forecloses-alternatives-general-purpose-preserves-them
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When explaining why one group of trainees stays single-mindedly committed to a terminal goal while a comparable group keeps hedging toward alternatives, check what KIND of investment their training actually represents before crediting a difference in resolve or passion. Thielens found medical entrants far more likely than law entrants to call their chosen profession the only career that could really satisfy them, even after controlling for law students' generally later decisions and less definite plans. Part of his explanation is the asymmetric SPECIFICITY of the two trainings: 'medical entrants may be reluctant to change career plans once they have undertaken the specialized, expensive, and time-consuming premedicai training. Since this training might go largely wasted in other careers, they may already feel constrained to seek satisfaction only in medicine. Law entrants, by contrast, ... with little or no investment in special training, may feel more free to continue consideration of other careers.' The contrast runs the same way in the training's actual downstream uses: 'law school training, as compared with medical school training, has a diversity of uses. Law school is widely held to be an appropriate training ground for certain fields which do not involve the practice of law. When asked what occupation they planned to enter after graduation from law school, 23 of the entrants (9 per cent) named a field outside \"the practice of law.\" And as their first choice for a permanent career, 8 per cent chose a corporation executive position and another 13 per cent a career in politics. Except perhaps for those favoring politics, these students, of course, need not think of law as their only satisfying career. On the other hand, medical school is seldom if ever taken to be a training ground for fields outside medicine.' A student's own testimony makes the general-purpose-credential logic explicit: 'The trouble these days is that there are too many lawyers and too many college graduates with A.B.'s. The idea is to go to law school, get an LL.B., and then do what you wanted to do after college.' The mechanism is NOT the sunk-cost fallacy (irrationally over-weighting money already spent) — it is a forward-looking, largely rational calculation about what the training would still be worth if the terminal goal were abandoned. When training has essentially one use, walking away really does waste it, so committing exclusively to the one path that redeems the investment is the economically sound response; when training is valued for a general, transferable skill or credential (a keen mental discipline, a prestige degree, an entry ticket to business or politics), walking away from the terminal goal wastes little or nothing, so keeping alternatives open costs nothing extra. Distinct from coordination-mode-set-by-relative-transaction-costs (lex-yyfx5, Williamson's asset specificity): that atom is about an ORGANIZATION choosing between market and firm coordination for a transaction, where specificity creates a hold-up hazard between two parties; this atom applies the same specificity logic to an INDIVIDUAL's own human-capital investment and its effect on that individual's later career commitment, with no second party or hold-up hazard involved at all. Also distinct from irreversibility-plus-uncertainty-gives-waiting-a-quantifiable-option-value (lex-cpayt, Dixit-Pindyck): that atom is about the optimal TIMING of an irreversible commitment BEFORE it is made, under uncertainty; this atom is about the psychological and practical consequence AFTER a specific investment has already been sunk, comparing what that sunk investment forecloses versus what a general-purpose investment would have preserved. Diagnostic move: before crediting a group's narrower career focus to greater passion, conviction, or fit, check how much of their specific training would actually be wasted if they walked away — a population whose training has no life outside one terminal use will look more 'committed' than a population whose identical-looking training is valuable in a dozen directions, independent of how much either group actually wants the terminal job."
