evokes: [burnt-child-fears-the-fire, once-bitten-twice-shy, snake-bitten-fears-grass-rope, single-event-salience, over-broad-avoidance-gradient, availability-heuristic, mowrer-two-factor-avoidance, generalization-from-sample-of-one, proverb-tradition-cross-cultural-attestation]
lineage:
  - source: primary
    text: cross-proverb-convergence-once-bitten-burnt-child
    citation: "Multi-tradition proverb-attestation. The transferable claim — a salient single negative event installs a protective generalization gradient typically too wide for the actual recurrence rate — is attested across at least four independent proverb-traditions. (a) MIEDER ed. *A Dictionary of American Proverbs* (Oxford 1992): entries 'A man once bitten by a snake will [be] twice shy' (American attestation), 'A burnt child fears the fire,' 'A burnt child dreads the fire.' (b) SIMPSON-SPEAKE eds. *The Oxford Dictionary of Proverbs* (5th ed. 2008): 'Once bitten, twice shy' with extensive cross-cultural commentary; Chinese form '1937 H. H. HART 700 Chinese Proverbs (1960) no. 527 One year bitten by a snake, for three years afraid of a grass rope'; '1981 DALAI LAMA quoted in Observer 5 Apr.' (Tibetan/Chinese cultural attestation); '1995 E. C. SYMMES Netsuke 94 The snake appears in many Japanese proverbs—the man who has once been bitten by the snake fears every piece of rope, or once bitten, twice shy.' (c) MIEDER 1993 *Prentice-Hall Encyclopedia of World Proverbs*: 'Once bitten, twice shy' + 'A burnt child fears the fire' + 'A burnt child dreads the fire' as cross-cultural canonical entries. Four-tradition convergence (English-American, English-British, Chinese, Japanese, with Tibetan reaffirmation) is the transferability evidence. Modern instrumented form: Tversky-Kahneman 1973 availability heuristic (salient instances dominate frequency estimation); Mowrer 1956 two-factor theory of avoidance learning (the avoidance itself becomes reinforcing via fear-reduction even when threat is absent). The proverb-tradition's claim — calibrated centuries before formal learning theory — names the structural over-generalization without requiring the modern apparatus. Distinct from lex-vkhp7 hindsight-bias (outcome-knowledge inflates the perceived prior probability of the known outcome): that atom is about retrospective probability assessment; this atom is about prospective avoidance generalization. They are different cognitive operations on different temporal axes. Distinct from lex-nx7u7 base-rate-neglect (Tversky-Kahneman): base-rate-neglect is about IGNORING population frequencies; this atom is about OVER-WEIGHTING a single salient experience to displace the base rate. They are complements — base-rate-neglect is the upstream failure that lets over-broad-avoidance install. Distinct from lex-wjwuc collision-with-error-is-load-bearing-for-living-truth: that's about why truth needs exposure to error; this is about why exposure to error can install over-broad subsequent avoidance. Distinct from lex-hrnuj anchoring-bias: anchoring is about arbitrary-default-as-reference-point; this is about painful-experience-as-permanently-elevated-salience. The proverb-tradition's claim has higher applicability in modern high-throughput environments (online dating after one bad date; investing after one loss; product trial after one defect) where the single-event sample is even smaller relative to the population than in pre-modern contexts."
    quote: "[Mieder *Dictionary of American Proverbs* 1992, entry 'bitten':] 'A man once bitten by a snake will [be] twice shy. Vars.: [...]' [Same volume, entry 'burnt child':] 'A burnt child fears the fire. [...] A burnt child dreads the fire.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'ONCE bitten, twice shy':] '1937 H. H. HART 700 Chinese Proverbs (1960) no. 527 One year bitten by a snake, for three years afraid of a grass rope. 1981 DALAI LAMA quoted in Observer 5 Apr. (online) Frankly speaking, it is difficult to trust the Chinese. Once bitten by a snake you feel suspicious even when you see a piece of rope. 1995 E. C. SYMMES Netsuke 94 The snake appears in many Japanese proverbs—the man who has once been bitten by the snake fears every piece of rope, or once bitten, twice shy. 2004 New York Times 25 June 9 (online) China's chief trade negotiator, Vice Premier Wu Yi, cited a Chinese proverb, Once bitten by a snake, one is terrified of the mere sight of a piece of rope.' [Mieder 1993 *Encyclopedia of World Proverbs*, on cross-cultural attestation:] 'Once bitten, twice shy. [...] A burnt child fears the fire, [...] A burnt child dreads the fire.' [Four-tradition pattern: English-American + English-British + Chinese (Hart 1937, Dalai Lama, Wu Yi 2004) + Japanese (Symmes 1995, citing the snake-rope variant). The Tibetan and modern Chinese reaffirmations show the claim's stability across centuries within the Chinese tradition.]"
canonical-instances:
  - "Childhood burn → adult fear of cooking: a single severe burn from a stove can install lifelong cooking-avoidance disproportionate to actual recurrence risk. The avoidance is reinforced by the relief of not-cooking (Mowrer two-factor) even when no actual stove is hot."
  - "One bad investment loss → withdrawal from all equities: the salience of one capital loss can drive years of cash-holding that costs more in foregone return than the original loss. The financial-advice tradition (Buffett, Graham, Bernstein) explicitly counters with base-rate education — 'the historical equity return is X%, your single loss is one sample.'"
  - "One bad date / one bad hire → over-broad screening: the salience of one painful experience installs over-strict subsequent screening criteria (no one with traits Y, no candidates from school Z). The base-rate of the actual problem in trait-Y or school-Z populations may be normal; the avoidance is driven by the single sample's salience, not the population rate."
  - "Public-health response to one outbreak: a single salient disease event (Ebola in U.S. 2014; SARS in Toronto 2003; mad cow in UK 1990s) can drive over-broad public avoidance (travel bans, food avoidance) disproportionate to actual recurrence rates. Risk-communication research operationalizes the proverb-tradition's claim as a known systematic public-response pattern."
  - "Distinguished from precisely-calibrated single-event avoidance: touching a hot stove (recurrence rate near 100% if repeated), accepting offers from a known scammer (recurrence rate of fraud near 100%). The atom names the OVER-broad-avoidance — when the generalization gradient exceeds the actual recurrence rate. Calibrated avoidance is not the failure mode."
  - "Distinguished from lex-vkhp7 hindsight-bias: hindsight-bias is retrospective probability inflation; this atom is prospective avoidance over-generalization. They operate on different temporal axes."
  - "Distinguished from lex-nx7u7 base-rate-neglect: base-rate-neglect is the upstream failure (ignoring population frequencies); this atom is the downstream behavioral consequence (over-broad avoidance from a single salient experience). The two compose."
critical-questions:
  - "What's the actual recurrence rate of the painful event in the candidate-avoidance population, and how does it compare to your current avoidance gradient? If the rate is low and the gradient is wide, the proverb-tradition's claim applies — the avoidance is over-broad. Diagnostic: name the recurrence rate explicitly before assessing the avoidance."
  - "Is the avoidance being maintained by the fear-reduction itself (Mowrer two-factor), or by genuine ongoing risk? The two-factor pattern: avoidance reduces fear → fear-reduction reinforces avoidance → avoidance persists even when threat is gone. Test: imagine the threat is provably absent — does the avoidance persist? If yes, two-factor maintenance is operative."
  - "What's the cost of the avoidance itself, and does it exceed the expected cost of recurrence? Avoidance has its own costs (foregone opportunities, social withdrawal, learning gap). If cost-of-avoidance > expected-cost-of-recurrence × recurrence-rate, the avoidance is net-negative. The proverb-tradition's claim doesn't tell you to drop the avoidance — it tells you to PRICE it against actual risk."
  - "Are you using the proverb-tradition's claim as cover to dismiss any avoidance you find inconvenient? The atom names a TYPICAL over-correction — it doesn't say all single-event avoidances are over-broad. Some are precisely calibrated. Use the diagnostic: actual recurrence rate, actual avoidance gradient, comparison."
  - "Is the candidate avoidance modifiable by graded re-exposure? Modern behavioral therapy (Wolpe 1958+ systematic desensitization; modern CBT exposure protocols) operationalizes the proverb-tradition's claim — controlled re-exposure that doesn't replicate the original pain can rewire the avoidance gradient. Re-exposure is the operational rewrite of the proverb's diagnosis."
