evokes: [reader-1957-cctp, the-panel-method, bureau-of-applied-social-research, before-and-after-attitude-measurement, faulty-memory-of-ones-own-change, test-retest-over-retrospective-report, longitudinal-same-respondent-tracking]
lineage:
  - source: primary
    text: reader-1957-panel-method-footnote
    citation: "George G. Reader, \"The Cornell Comprehensive Care and Teaching Program,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.97 (footnote 26)."
    quote: "'As indicated in the foregoing paper, this process of asking the same group of people the same questions at different crucial points in time is known in social research as the panel method. It is particularly suited to the study of changes in attitudes and opinions because, among other things, it does not rely on the sometimes faulty memory of respondents concerning whether or not they have changed. Rather, it enables change or stability to be objectively ascertained by comparison of answers given by the same individuals at selected time intervals.'"
canonical-instances:
  - "Longitudinal health cohorts (e.g. the Framingham Heart Study) re-examine the same individuals at fixed intervals across decades rather than asking participants at a single sitting to recall how their health has changed, because the panel design doesn't depend on anyone's memory of their own prior state."
  - "Product UX research: instead of asking users at the end of a redesign whether their satisfaction improved, a team surveys the same panel of users with the identical questionnaire before and after the redesign and compares the two sets of answers directly."
  - "Employee-engagement tracking: an HR team runs the identical pulse survey on the same cohort every quarter rather than annually asking staff to judge whether morale has gotten better, because a person's retrospective sense of change is a weaker signal than comparing today's answer to the one they actually gave a year ago."
critical-questions:
  - "Panel attrition: the method depends on being able to reach the same individuals again at each wave. The essay itself notes that the December 1952 'exposed'/'unexposed' split among fourth-year students could not be treated as a true experimental/control pair — what happens to the inference when a meaningful fraction of the original panel is lost or changes composition between waves?"
  - "Does the act of repeated measurement itself change the respondent, independent of any real underlying change — for instance, does answering the same questionnaire three times train respondents toward more consistent or more self-conscious answers by the third wave? This is adjacent to but distinct from the recall-bias problem the panel method is designed to solve."
  - "The panel method is pitched here as solving recall bias about WHETHER something changed. Does it equally tell you WHY it changed? A panel design can establish that attitudes shifted between two waves without, by itself, establishing which of several concurrent influences (the new curriculum, maturation, external events) produced the shift — that requires additional design elements beyond repeated measurement alone."
