lineage:
  - source: primary
    text: Augustine-c400-Confessions-BookVIII
    citation: "Augustine of Hippo, *Confessions* (c. 397-400 CE), Book VIII Chapters 8-11. Pusey translation (Project Gutenberg #3296). The foundational text articulating the divided-will analysis of self-control failure — distinct from Aristotelian akrasia (NE VII) which treats the failure as knowledge-vs-action gap in a unified deliberator. Augustine's foundational claim: when the will commands the will to be, and yet it is not done, the cause is not weakness or partial knowledge but MULTIPLICITY — `two wills, for that one of them is not entire: and what the one lacketh, the other hath.` The framework has been productively extended across Western philosophy (Aquinas Summa I-II.17; Descartes Meditations IV); psychoanalytic + structural-model traditions (Freud 1923 *The Ego and the Id*); behavioral economics multi-self models (Thaler + Shefrin 1981 *An Economic Theory of Self-Control*; Schelling 1984 *Choice and Consequence*; Loewenstein 1996 *Out of Control: Visceral Influences on Behavior*); clinical psychology (Marlatt 1985 *Relapse Prevention*; Schwartz 1995 *Internal Family Systems Therapy*; Fisher 2017 *Healing the Fragmented Selves*); dual-process theory (Kahneman 2011 *Thinking, Fast and Slow* — though System-1-vs-System-2 is more rule-of-thumb than Augustine's full multiplicity); + AI multi-objective alignment (current literature on conflicting objectives in RLHF). The atom encodes the transferable structural primitive — single self houses multiple competing volitional sub-agents — separately from Augustine's specific theological framing. Debunking check applied: the strong multi-self view has been contested (Korsgaard 1996 *The Sources of Normativity* argues for unified-agent normativity; Frankfurt 1971 *Freedom of the Will and the Concept of a Person* offers a different second-order-volition framing). The STRUCTURAL CLAIM about multi-volitional-sub-agent self is well-attested across clinical psychology, behavioral economics, behavioral neuroscience (the basal-ganglia + prefrontal-cortex interaction literature, McClure et al 2004 *Separate Neural Systems Value Immediate and Delayed Monetary Rewards*), and AI multi-objective optimization — independent of specific philosophical commitments about personal identity."
    quote: "[Augustine *Confessions* VIII.9.21 (Pusey tr.), the decisive divided-will passage:] 'Whence is this monstrousness? and to what end? The mind commands the body, and it obeys instantly; the mind commands itself, and is resisted. The mind commands the hand to be moved; and such readiness is there, that command is scarce distinct from obedience. Yet the mind is mind, the hand is body. The mind commands the mind, its own self, to will, and yet it doth not. Whence this monstrousness? and to what end? It commands itself, I say, to will, and would not command, unless it willed, and what it commands is not done. But it willeth not entirely: therefore doth it not command entirely. For so far forth it commandeth, as it willeth: and, so far forth is the thing commanded, not done, as it willeth not. For the will commandeth that there be a will; not another, but itself. But it doth not command entirely, therefore what it commandeth, is not. For were the will entire, it would not even command it to be, because it would already be. It is therefore no monstrousness partly to will, partly to nill, but a disease of the mind, that it doth not wholly rise, by truth upborne, borne down by custom. And therefore are there two wills, for that one of them is not entire: and what the one lacketh, the other hath.' [On the half-divided will struggling against itself:] 'For not to go only, but to go in thither was nothing else but to will to go, but to will resolutely and thoroughly; not to turn and toss, this way and that, a maimed and half-divided will, struggling, with one part sinking as another rose.' [Practitioner-extraction for transferable lex-5tpy8: the self is not a unified deliberator who knows the good and weakly fails to do it. The self is a CONTESTED ARENA containing multiple competing volitional sub-agents each with its own want. `What the one lacketh, the other hath.` Self-control interventions must address the multi-agent reality, not the single-agent idealization. Generalizes from theological context to addiction treatment, behavioral economics, parts-work therapy, commitment-device design, dual-process theory, and AI multi-objective alignment.]"
  - source: cross-attestation
    text: cross-domain-multi-volitional-sub-agent-self
    citation: "Cross-domain attestation that the multi-volitional-sub-agent self model recurs across psychoanalysis, behavioral economics, clinical psychology, neuroscience, and AI alignment. (a) Psychoanalysis + structural-model traditions: Freud 1923 *The Ego and the Id* explicitly operationalizes a tripartite structural model directly inheriting Augustinian + Platonic multiplicity; subsequent ego-psychology + object-relations + Lacanian traditions all preserve the multi-agent structure. (b) Behavioral economics multi-self models: Thaler + Shefrin 1981 *An Economic Theory of Self-Control* introduces the planner-doer two-self model; Schelling 1984 *Choice and Consequence* extends; Loewenstein 1996 *Out of Control: Visceral Influences on Behavior* documents the cold-hot self distinction; Ainslie 2001 *Breakdown of Will* on hyperbolic-discounting multi-self conflict. (c) Clinical psychology: Marlatt 1985 *Relapse Prevention* operationalizes multi-self analysis for addiction treatment; Schwartz 1995 *Internal Family Systems Therapy* makes the multi-agent picture explicit clinical practice; Fisher 2017 *Healing the Fragmented Selves of Trauma Survivors* extends to trauma-related dissociation; Gendlin 1978 *Focusing* operationalizes attending-to-internal-parts as therapeutic technique. (d) Behavioral neuroscience: McClure et al 2004 *Separate Neural Systems Value Immediate and Delayed Monetary Rewards* (Science 306:503) documents distinct neural systems for immediate + delayed reward — neural correlate of Augustine's two-will picture; subsequent literature on basal-ganglia + prefrontal-cortex interaction extends; the planning-vs-habit literature (Daw + Niv + Dayan 2005, Dolan + Dayan 2013 model-based vs model-free RL in brain) provides further neuroscientific scaffolding. (e) AI multi-objective alignment: current RLHF + Constitutional AI + multi-objective training literature on conflicting objectives (helpfulness vs harmlessness vs honesty vs other safety properties) explicitly models AI systems as multi-objective-optimizers with internal trade-offs — structural analog of Augustine's multi-will picture for AI systems. (f) Game theory + economics of self-control: Strotz 1955 *Myopia and Inconsistency in Dynamic Utility Maximization* introduces time-inconsistent-preferences formalization; subsequent literature on hyperbolic discounting + present-bias quantifies the multi-self conflict. (g) Sport psychology + performance under pressure: Beilock 2010 *Choke: What the Secrets of the Brain Reveal About Getting It Right When You Have To* documents performance-under-pressure as multi-system conflict between practiced-automatic action + conscious-deliberate control. The cross-domain attestation establishes the transferable structural form: single self houses multiple competing volitional sub-agents; intervention design must address the multi-agent reality."
    quote: "Across psychoanalysis (Freud 1923 structural model), behavioral economics (Thaler-Shefrin 1981 planner-doer, Schelling 1984, Loewenstein 1996, Ainslie 2001), clinical psychology (Marlatt 1985 relapse prevention, Schwartz 1995 IFS, Fisher 2017 trauma parts-work, Gendlin 1978 focusing), behavioral neuroscience (McClure 2004 immediate-vs-delayed neural systems, Daw-Niv-Dayan 2005 model-based-vs-model-free RL), AI multi-objective alignment (RLHF + Constitutional AI literature), economics of self-control (Strotz 1955 time-inconsistency, hyperbolic-discounting literature), and sport psychology (Beilock 2010 choking-under-pressure), the same structural form recurs — single self houses multiple competing volitional sub-agents. The transferable diagnostic: name the multiple wills + their respective wants; design intervention for multi-agent reality."
canonical-instances:
  - "Augustine's canonical case (Book VIII): on the verge of converting to Christianity, Augustine finds his will divided — part wanting to make the commitment, part wanting to continue current life — and notes the mind cannot fully command itself. The conflict is multi-will, not knowledge-deficit (Augustine fully knows what he should do)."
  - "Addiction relapse (Marlatt 1985 *Relapse Prevention*): the recovering alcoholic who wants-to-stay-sober AND wants-the-drink — both genuinely the same self. Treatment that addresses only the wanting-to-stay-sober self misses the other agent + relapse becomes structural. Effective treatment (cognitive-behavioral, motivational interviewing) explicitly addresses both."
  - "Schelling commitment-device design (1984; lex-rfcb7 substrate-grounded): the planner self designs a commitment device to bind the doer self in advance — pre-committing to action that the doer self will be tempted to defect from. Composes tightly with lex-5tpy8."
  - "Internal Family Systems therapy (Schwartz 1995): explicit operationalization of multi-sub-agent picture for clinical practice. The client is taught to distinguish internal `parts` (manager, exile, firefighter) each with its own want; the therapeutic technique addresses each part rather than treating the conflict as confusion."
  - "Dual-process theory (Kahneman 2011): System 1 (fast, automatic) + System 2 (slow, deliberative) is a simplified two-self picture. Cognitive biases arise when System 1 produces fast intuitive judgment + System 2 fails to override. The picture is structural-analog of Augustine's two-will but rule-of-thumb rather than full multiplicity."
  - "Behavioral neuroscience (McClure 2004): distinct neural systems for immediate + delayed reward — limbic system favoring immediate, prefrontal cortex favoring delayed. When subjects choose between immediate vs delayed rewards, the relative activation predicts choice. Neural correlate of Augustine's two-will picture."
  - "AI multi-objective alignment: RLHF-trained models have been optimized on competing objectives (helpfulness vs harmlessness vs honesty). The resulting tensions are not knowledge-action gap but real multi-objective conflict. The model's behavior in edge cases reflects which sub-objective wins — analog of Augustine's multi-will picture for AI systems."
  - "Sport-psychology choking (Beilock 2010): under pressure, conscious-deliberate control over-rides practiced-automatic action + performance degrades. The conflict is between two genuinely-the-athlete sub-systems — practiced-automatic vs conscious-deliberate. Coaching that addresses only one misses the other."
  - "operationally distinct from lex-v7ceq akrasia-knowing-the-good-yet-doing-otherwise (Aristotle): Aristotle's mechanism is incomplete-knowledge OR weakness-of-resolve in a UNIFIED deliberator. lex-5tpy8 names a different mechanism: the deliberator is itself MULTIPLE. Compose: lex-v7ceq names a knowledge-vs-action gap; lex-5tpy8 names a will-vs-will conflict; either or both can occur."
  - "operationally distinct from lex-rfcb7 credibility-comes-from-visibly-foreclosed-options (Schelling commitment-device): lex-rfcb7 is a SOLUTION-PATTERN — pre-commitment by one sub-agent to bind another. lex-5tpy8 names the underlying multi-sub-agent structure that makes lex-rfcb7 necessary in the first place. They compose tightly."
  - "operationally distinct from lex-mwgep path-dependence: path-dependence is commitment-trap mechanism at institutional + decision scale. lex-5tpy8 is intra-self multi-volitional structure. Different scales + mechanisms."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition-not-its-cause (Butler): Butler is about gender + performative-doing-constitutes-being. lex-5tpy8 is about multi-sub-agent volitional structure within self. Different mechanism."
critical-questions:
  - "Does the atom commit to strong multi-self ontology (the self is really multiple, not unified)? No. The atom is a STRUCTURAL claim about explanatory adequacy — multi-sub-agent models often explain self-control phenomena better than single-agent + knowledge-action-gap models. Whether the underlying ontology is `really multiple` or `a single agent with conflicting drives` is a philosophical question the atom does not settle. Korsgaard 1996 *Sources of Normativity* argues for unified-agent normativity even acknowledging conflicting drives; Frankfurt 1971 *Freedom of the Will* offers a second-order-volition framing; the atom is compatible with these reframings as long as the multi-agent EXPLANATORY STRUCTURE is preserved."
  - "Could the atom be misused to evade moral responsibility (`it wasn't really me, it was my other self`)? Yes — and this is a known misuse pattern. The discipline against this: the multi-self structure does not erase responsibility; it relocates it. The integrating self (the one that designs commitment devices, attends therapy, builds character) bears responsibility for managing the multi-self reality. Augustine himself does not use the divided-will analysis to evade responsibility; he uses it to motivate spiritual practice."
  - "How does the atom apply when sub-agents are not in conflict (e.g., a moment of integrated action)? The atom claims the multi-sub-agent structure is THERE even when not actively in conflict; integrated action happens when sub-agents align on a single course. The structural availability of conflict is the indispensable claim — that when conflict arises, it should be analyzed as multi-agent, not as single-agent failure."
  - "How does the atom distinguish from full Dissociative Identity Disorder (DID)? The atom names a STRUCTURAL feature of normal self-organization that becomes clinically relevant in addiction, trauma, decision-making — not the pathological full-DID phenomenon. The relationship is: DID is an extreme expression of multi-sub-agent structure that ordinarily integrates more smoothly. The atom does not claim normal self-experience is DID."
  - "How does the atom apply to AI systems specifically? AI systems trained on multi-objective rewards exhibit structurally similar conflict — the model's behavior in edge cases reflects which sub-objective wins under specific input conditions. Whether this constitutes `genuine multi-self structure` in the same sense as humans is a philosophical question. The atom claims the structural analysis applies: design interventions for AI alignment must address the multi-objective reality, not single-objective idealization. Composes with lex-cqvnu (name-to-referent correspondence as precondition for action) — first the objectives must be correctly named, then the multi-objective conflict structure must be acknowledged."
