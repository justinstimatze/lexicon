    quote: "'Those of established high rank in a group or society... know the rules of the game, that is, know the norms, and know their way around... the man of established rank can freely depart from the strict norms, particularly when it is not to his advantage to do so... a prig of low rank may be tolerated, if not liked, but a prig of high rank, standing to gain disproportionately by his insistence upon the letter of the norm, will be twice condemned and hated.'"
canonical-instances:
  - "A new employee follows the written expense policy to the letter and flags a colleague's minor, long-tolerated rounding of a receipt, while the colleague's manager quietly waves it off — the new hire isn't more ethical, they simply haven't yet learned which parts of the policy are enforced and which have decades of accumulated informal slack."
  - "A junior faculty member insists on the literal letter of a departmental rule that senior colleagues routinely and openly bend, and is quietly resented for it as officious; a senior colleague who insisted on the same literal letter, despite personally benefiting from the informal slack everyone else already knows about, would be resented far more sharply — Merton's 'twice condemned' asymmetry, since the senior person's insistence reads as self-serving rather than merely uninformed."
critical-questions:
  - "How long does it typically take for a newcomer to absorb the tolerated-deviation band well enough to stop being read as a prig — is this mostly a function of tenure, or does it depend more on having a mentor or informal sponsor who explicitly (rather than unwittingly) transmits the unwritten rules?"
  - "Does the information-deficit explanation compete with or complement the eagerness-to-please explanation Merton also credits as 'part of the truth' — could the two reinforce each other, where not knowing the slack makes literal conformity the only SAFE way to also demonstrate loyalty, so the newcomer's rigidity is simultaneously ignorance and strategy rather than one or the other?"
