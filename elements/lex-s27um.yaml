id: lex-s27um
name: competitive-equality-routes-to-emulation-or-leveling
type-in: claim
type-out: typology
_tier: reaction
agent-instruction: "When competitive pressure becomes intense in a context of nominal equality, the routing is either UP (emulation, escalation, arms-race) or DOWN (leveling, tall-poppy, sabotage). Predict which by reading whether the rewards favor risk-taking or conformity."
related: [lex-u8u7y, lex-2rsad, lex-jw34x, lex-r3w25, lex-xe76g, lex-gma7u, lex-wf4nj, lex-ucw53, lex-k2kdc, lex-pd9p6, lex-5kjya, lex-xehnw, lex-96xn9]
scaffolds-from: [lex-xehnw, lex-2rsad, lex-jw34x, lex-96xn9]
evokes: [hesiod-two-strifes, good-eris-vs-bad-eris, the-fork-at-the-comparison-moment, productive-emulation-vs-destructive-leveling, the-disposition-determines-the-branch, potter-vies-with-potter, neighbour-vies-with-neighbour]
reactants:
  - lex-xehnw   # competitive-comparison-with-proximate-equal fires: potter sees potter, neighbour sees neighbour, peer sees peer
conditions:
  - "lex-xehnw's proximity-and-visibility conditions are met AND the comparison-class is internalized (lex-u8u7y gates this); if the comparison-class boundary is not internalized the reaction does not fire and the null-output is indifference"
mechanism: "lex-xehnw fires; lex-wf4nj supplies the master-vs-slave typology that classifies any response by whether its value-creation is OUTWARD-FROM-SELF (master, affirmative) or AGAINST-THE-OTHER (slave, negation-driven); the same trigger routes to one of two branches depending on the actor's disposition (Hesiod's two-strifes: TWO Strifes `wholly different in nature` sharing one trigger). Branch A (good-Eris / master): productive-emulation — `I want to do that too`, energy into raising-oneself-up, admiration toward the model, work-as-competitive-vigor. Branch B (bad-Eris / slave): destructive-leveling — `how dare they presume to be better than me`, energy into tearing-down, ostracism-pressure, moral-indignation re-coding, value-inversion (crystallizes via lex-96xn9), libelle-style fabrication. The selector is the actor's master-vs-slave disposition at the comparison moment, itself shaped by prior history (felt-impotence accumulation, identity-protective dispositions, available reform-leverage)"
catalysts:
  - lex-2rsad   # identity-protective stakes push toward the slave/leveling branch
  - lex-jw34x   # dissonance-driven-identity-defense recruits the leveling branch when identity is threatened
products:
  - "a branch-selected posture: EITHER productive-emulation (action toward attainment + admiration toward the model) OR destructive-leveling (tear-down + ostracism + value-inversion). The product is the fork-outcome, not a single state — which is why the type-out is a typology"
inhibitors:
  - "factors that block the leveling-branch and favour emulation: high perceived agency to close the gap; high status-mobility culture (vs tall-poppy norms, which catalyse leveling); deliberate emulation-practice (Stoic/Buddhist); the Wynn `inspiration not wound` reframe that surfaces the fork into conscious choice"
reversibility: "disposition-variable across comparison-moments (Hesiod: both Strifes simultaneously extant in the world; the same actor fires good-Eris in some contexts and bad-Eris in others) — the branch-selection is re-evaluated each moment rather than locked; at population/historical scale the aggregate of branch-outcomes stabilizes into lex-wf4nj's master- vs slave-morality distribution"
critical-questions:
  - "is the disposition FIXED or VARIABLE across comparison-moments? Hesiod presents the two Strifes as both extant in the world simultaneously (both daughters of Night and Cronos); the same actor can fire good-Eris in some contexts and bad-Eris in others. Diagnostic: identify the disposition-determining context (reform-leverage availability, identity-stakes, prior-history) rather than treating disposition as an actor-property"
  - "what determines the fork-selection? Likely composites: (a) actor's perceived agency to close the gap (high agency → emulation; low agency → leveling); (b) actor's identity-stakes in the comparison (high identity-stake → leveling via lex-jw34x/lex-96xn9; low identity-stake → emulation or indifference); (c) cultural-norms around emulation-vs-egalitarian-leveling (tall-poppy cultures push toward leveling-branch; high-status-mobility cultures push toward emulation-branch); (d) reform-leverage available to the egalitarian-leveling response (where collective-action / institutional-leveling exists, the leveling-branch becomes instrumentally viable). All four factors compose"
  - "does the molecule predict a third or absent path? Yes: indifference (the comparison-moment can occur without firing either branch — when the comparison-class boundary is not internalized, the comparison fails to register as competitive). lex-u8u7y social-identity-as-self-concept-determinant gates whether the comparison-class is internalized at all. The molecule fires only when lex-xehnw fires fully (proximity-and-visibility AND comparison-class-internalization). Indifference is the null-output state"
  - "is the typology binary or graded? Nietzsche treats it as graded (BGE Aph. 260: 'In all the higher and more mixed civilizations, however, there appear also attempts to reconcile both moralities'). The molecule preserves the binary fork-structure as a typology but acknowledges most actual responses are mixed. Diagnostic: estimate the master-slave-ratio of an observed response rather than forcing categorical assignment"
  - "operationally distinct from lex-96xn9 envy-and-impotence-route-to-value-inversion: lex-s27um names the FORK at the comparison moment (which branch fires?); lex-96xn9 names what happens down ONE branch (the slave-branch, when felt-impotence drives change-cognition through dissonance). lex-s27um is the bifurcation-event; lex-96xn9 is the slave-branch-elaboration. They compose: lex-s27um routes to slave-branch → lex-96xn9 fires"
  - "operationally distinct from lex-wf4nj master-vs-slave-morality typology: lex-wf4nj is the population-level/historical-aggregate typology (what kind of moralities are extant in the world); lex-s27um is the dyadic-relational comparison-moment fork (which response fires for THIS actor at THIS moment). lex-wf4nj describes the aggregate; lex-s27um describes the instance. They compose: aggregate-typology is the empirical-distribution of instance-fork outcomes across actors and moments"
lineage:
  - source: primary
    text: hesiod-c700-works-and-days-two-strifes
    citation: "Hesiod, *Works and Days* lines 11-26 (~700 BCE; Hugh G. Evelyn-White trans. 1914, Loeb Classical Library). (PG #348). The canonical pre-philosophical primary for the molecule's fork-structure. Hesiod opens *Works and Days* by correcting his own *Theogony*: not one Strife (`Eris`) but two — bad Eris (Quarrelsomeness, fostering evil war and battle, loved by no man) and good Eris (Emulation, daughter of dark Night, set in the roots of the earth, who `stirs up even the shiftless to toil`). The proximity-clause `potter is angry with potter, and craftsman with craftsman, and beggar is jealous of beggar, and minstrel of minstrel` (line 25-26) anchors the fork to lex-xehnw's proximate-comparison conditions. The transferable claim: ONE triggering condition (competitive-comparison-with-equals) routes to TWO structurally-distinct affects (productive-emulation OR destructive-quarrelsomeness). The molecule's name is the structural-claim transcribed."
    quote: "[Hesiod *Works and Days* ll. 11-26, Evelyn-White trans. 1914]: 'So, after all, there was not one kind of Strife alone, but all over the earth there are two. As for the one, a man would praise her when he came to understand her; but the other is blameworthy: and they are wholly different in nature. For one fosters evil war and battle, being cruel: her no man loves; but perforce, through the will of the deathless gods, men pay harsh Strife her honour due. But the other is the elder daughter of dark Night, and the son of Cronos who sits above and dwells in the aether, set her in the roots of the earth: and she is far kinder to men. She stirs up even the shiftless to toil; for a man grows eager to work when he considers his neighbour, a rich man who hastens to plough and plant and put his house in good order; and neighbour vies with his neighbour as he hurries after wealth. This Strife is wholesome for men. And potter is angry with potter, and craftsman with craftsman, and beggar is jealous of beggar, and minstrel of minstrel.' [The molecule's fork-structure named directly: two Strifes share one triggering condition (competitive-comparison-with-equals); they route to structurally-distinct outcomes (productive-emulation or destructive-quarrelsomeness). The proximity-targeting clause (lines 25-26) anchors the fork to lex-xehnw's selectivity conditions. The transferable lesson: at any competitive-comparison moment, the system can route productively or destructively, and the routing IS the master-vs-slave-morality distinction at instance scale.]"
  - source: primary
    text: aristotle-rhetoric-ii-11-emulation-vs-envy
    citation: "Aristotle, *Rhetoric* II.11 (c.340 BCE; W. Rhys Roberts trans. 1924). Following the lex-xehnw grounding in Rhetoric II.10 (envy at proximate equals), Aristotle in II.11 immediately introduces emulation (zēlos) as the COUNTERPART affect to envy at the same comparison conditions. The structural claim: envy and emulation share the proximity-conditions but diverge in their target-orientation. Envy seeks to remove the other's good; emulation seeks to attain the same good for oneself. This is the Aristotelian articulation of Hesiod's two-strifes fork in vice/virtue-ethics vocabulary: emulation is the noble-character's response to the same triggering condition that produces envy in the base-character. Source-grounded as Rhetorica is in the same volume as II.10."
    quote: "[Aristotle *Rhetoric* II.11, Rhys Roberts trans. 1924, Bekker 1388a30-1388b30 paraphrase]: '[Emulation (zēlos) is the counterpart of envy. It is felt under the same proximate-equality conditions — toward those who are near us in time, place, age, or reputation — but it is the noble disposition's response where envy is the base disposition's response. The emulous person, seeing good fortune in an equal, is pained that he himself does not have it and strives to attain it; the envious person, seeing the same, is pained that the other has it and strives to remove it. Emulation moves the agent toward action and improvement; envy moves the agent toward malice and removal. They are felt by different characters at the same triggering condition.]' [Aristotle's structural-claim is the molecule's fork named in vice/virtue-ethics terms: the SAME proximate-comparison condition routes to TWO structurally-distinct responses (emulation/zeal vs envy/malice) depending on the AGENT'S CHARACTER. The molecule's selector — master-vs-slave-disposition — is the philosophical-anthropology version of Aristotle's noble-vs-base character distinction. The lineage chain Hesiod 700 BCE → Aristotle 340 BCE → Nietzsche 1886 spans 2,600 years for the same structural claim about a fork at competitive-comparison.]"
  - source: primary
    text: nietzsche-1886-master-slave-morality-aggregate-typology
    citation: "Friedrich Nietzsche, *Beyond Good and Evil* (1886). (PG #4363). Nietzsche names the millennium-aggregate of the molecule's bifurcation outcomes: master-morality (productive-emulation-branch outcomes aggregated) vs slave-morality (destructive-leveling-branch outcomes aggregated). The molecule names the instance-fork; Nietzsche names the population-aggregate. The aggregate is the empirical-distribution of instance-fork outcomes across actors and historical-moments. Cross-attestation in lex-wf4nj lineage; ported here as the population-aggregate-pole of the fork-structure."
    quote: "[Nietzsche BGE Aph. 260 paraphrase]: '[Master-morality and slave-morality are two typological poles; the noble type affirms what they ARE (productive value-creation outward from self); the slave type negates what they are NOT (reactive value-creation against the other). The historical/sociological claim — that slave-morality is genealogically downstream of master-morality and characterizes the modern-Christian moral landscape — is contested; the typology-claim is more robust as transferable diagnostic.]' [Transferable lesson: the master-morality response Hesiod names as good-Eris is the productive-emulation branch of lex-s27um; the slave-morality response Hesiod names as bad-Eris is the destructive-leveling branch. Nietzsche's millennium-scale typology IS the aggregate of instance-fork outcomes the molecule names.]"
  - source: discovery-loop
    text: v69-molecule-discovery-pass-1
    citation: "2026-05-27: molecule-discovery pass on envy/dissonance/identity-defense cluster identified this as Test 1(a)-generative + Test 1(b)-anti-pattern-clear + Test 2-type-check-clean. The fork-at-competitive-equality is information not in either parent — lex-xehnw doesn't articulate the bifurcation; lex-wf4nj articulates the aggregate-typology without pinning the moment-of-bifurcation. The molecule names what Hesiod-Aristotle-Nietzsche jointly attest: ONE triggering condition (competitive-comparison-with-proximate-equals) routes to TWO structurally-distinct outcomes (productive-emulation OR destructive-leveling) depending on the actor's disposition. Co-fires with lex-96xn9 — the bifurcation-molecule names the fork; lex-96xn9 names what happens down the slave-branch when felt-impotence drives dissonance dynamics. Together they cover the envy-cluster's compositional logic."
canonical-instances:
  - "Hesiod's potter-vs-potter and neighbour-vs-neighbour (~700 BCE): the canonical agrarian-Greek instance. Potter sees another potter's craft; same triggering condition routes to either good-Eris (`stirred up to work, considers his neighbour, hastens to plough and plant`) or bad-Eris (anger, quarrelsomeness, war). Hesiod presents the fork as already-in-the-world simultaneous"
  - "Aristotelian noble-vs-base response to seeing-an-equal-do-well (Rhetoric II.11, NE II.7): the same proximate-good-fortune triggers zēlos (emulation, noble) or phthonos (envy, base) depending on character. The character-determinacy of the fork is the Aristotelian formulation"
  - "intra-academic response to a peer's publication: the same triggering event (peer publishes important paper) routes to either (a) productive-emulation (read the paper, build on it, write follow-up work, raise own game) or (b) destructive-leveling (find methodological issues to expose, gossip-criticism, suggest the work is overrated). The two responses are dispositionally different at the same triggering condition"
  - "intra-trans-community Wynn 2021 diagnostic: 'am I watching it as inspiration or am I watching it as a wound?' (transcript lines 342-360). Wynn's question IS the fork lex-s27um names — same triggering condition (visibly-passing peer), two structurally-distinct response-orientations (master-emulation: inspiration toward becoming; slave-leveling: wound, distance, withdrawal). Wynn's pedagogical use of the diagnostic is to surface the fork into conscious choice"
  - "Hesiod's two-strifes diagnostic for personal-practice: when a comparison-moment fires, ask 'which Strife am I in?' If the energy is going into work-toward-attainment + admiration toward the model, good-Eris/master-branch. If the energy is going into critique-of-the-model + wish-they-didn't-have-it, bad-Eris/slave-branch. The diagnostic doesn't moralize the bad-branch response but surfaces it for conscious redirection (Wynn's pedagogical move; cf. emulation-as-deliberate-practice in Stoic and Buddhist traditions)"
  - "tall-poppy norm cultures vs ladder-climbing norm cultures: Australian/Scandinavian/Japanese cultural infrastructure pushes toward the leveling-branch as default (cut the tallest poppy; deru kugi wa utareru). High-status-mobility cultures (US frontier-mythology, some immigrant-community mythologies) push toward the emulation-branch as default. The cultural-norm is a fork-selector at the population-scale"
  - "movement degradation pattern: a political/social movement begins with affirmative vision (good-Eris-shaped energy: build a thing, attain a goal, raise the standard) and degrades over time toward resentment-against-opponents (bad-Eris-shaped energy: tear-them-down, expose, ostracize). The pattern recurs across left + right movements. lex-s27um's transferable application: monitor whether a movement's energy is in good-Eris or bad-Eris mode; the degradation is the slip from former to latter, and the diagnostic is whether the movement could survive its opponent disappearing (good-Eris movements have positive program independent of opposition; bad-Eris movements collapse when the opposition vanishes)"
  - "operationally distinct from lex-xehnw envy-tracks-visibility-and-proximity: lex-xehnw names the SELECTIVITY of envy (which conditions can ignite it) without naming the bifurcation; lex-s27um names the FORK at the comparison-moment after lex-xehnw's conditions are met. They compose sequentially: lex-xehnw establishes the comparison-can-fire-here; lex-s27um selects which branch fires"
  - "operationally distinct from lex-96xn9 envy-and-impotence-route-to-value-inversion: lex-s27um is the bifurcation-event (which branch?); lex-96xn9 elaborates ONE branch (the slave-branch when felt-impotence drives dissonance dynamics). They compose: lex-s27um routes to slave-branch → lex-96xn9 fires with full mechanism"
  - "operationally distinct from lex-wf4nj master-vs-slave-morality typology: lex-s27um is the instance-fork (dyadic-relational, this-actor-this-moment); lex-wf4nj is the population-aggregate (which kind of moralities are extant in the world). They compose: lex-wf4nj's aggregate is the empirical-distribution of lex-s27um's instance-fork outcomes across actors and historical-moments"
