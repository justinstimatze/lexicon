name: an-unfalsifiable-myth-can-mature-into-a-testable-theory
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Popper's falsifiability criterion sorts claims into scientific and non-scientific, but he was careful about what that sort does NOT do. Popper: 'At the same time I realized that such myths may be developed, and become testable; that historically speaking all -- or very nearly all -- scientific theories originate from myths, and that a myth may contain important anticipations of scientific theories. Examples are Empedocles' theory of evolution by trial and error, or Parmenides' myth of the unchanging block universe in which nothing ever happens and which, if we add another dimension, becomes Einstein's block universe (in which, too, nothing ever happens, since everything is, four-dimensionally speaking, determined and laid down from the beginning). I thus felt that if a theory is found to be non-scientific, or metaphysical (as we might say), it is not thereby found to be unimportant, or insignificant, or meaningless, or nonsensical.' The falsifiability test answers one question only: does this claim, as currently stated, forbid some observation? An unfalsifiable claim fails that test today. It says nothing about whether the claim is a dead end or the raw material a testable theory gets cut from later -- Parmenides' unchanging universe, four billion years too early to be physics, is recognizably the ancestor of Einstein's block universe once a dimension gets added. Diagnostic move: when a speculative or unfalsifiable idea gets dismissed as worthless because it fails the demarcation test, ask which of two questions is actually on the table -- 'is this scientific right now,' which the test answers, or 'is this worth developing,' which it doesn't. A failing grade on the first is not a verdict on the second; Popper kept the two judgments apart on purpose."
