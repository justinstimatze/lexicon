evokes: [sen-collective-choice-and-social-welfare-chapter-2-unanimity, pareto-criterion, nero-fiddling-while-rome-burns, efficiency-is-silent-on-distribution, perfectly-disgusting]
lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 2 'Unanimity,' Section 2.1 'The Pareto Criterion,' p.69."
    quote: "“An economy can be optimal in this sense even when some people are rolling in luxury and others are near starvation as long as the starvers cannot be made better off without cutting into the pleasures of the rich. If preventing the burning of Rome would have made Emperor Nero feel worse off, then letting him burn Rome would have been Pareto-optimal. In short, a society or an economy can be Pareto-optimal and still be perfectly disgusting.”"
canonical-instances:
  - "Hypothetical: A company's compensation structure is defended as efficient because no reshuffling of the current budget could raise a single employee's pay without cutting another's. The defense is true and answers nothing about whether the executive-to-floor-worker ratio it's built on is remotely fair -- efficiency at the current split says nothing about whether the split itself was ever justified."
  - "Hypothetical: A city council rejects a rent-cap proposal because modeling shows it would leave at least one landlord worse off, and no version of the policy exists that helps tenants without costing landlords anything. That finding rules out a free-lunch fix; it says nothing about whether the current rent burden on tenants is something the city should be willing to accept a tradeoff to fix."
critical-questions:
  - "Isn't efficiency still worth wanting, even knowing it says nothing about fairness -- doesn't dismissing Pareto-optimality on these grounds throw out a genuinely useful criterion? Sen doesn't dismiss it; he calls the Pareto criterion worth commending in the same chapter, incompleteness and all. The claim here is narrower: don't let 'this is efficient' stand in for 'this is acceptable,' because the two questions can come apart completely, and an argument that only answers the first has left the second untouched."
  - "How would you even compare a starvation-alongside-luxury arrangement against a more equal one, if Pareto-optimality can't rank them and no trade improves both? That's precisely the gap Sen spends the rest of the book on -- interpersonal comparisons of welfare, cardinal measures, equity criteria -- because the Pareto ordering alone cannot make that comparison. Naming the gap is the first step; closing it needs tools the efficiency criterion was never built to provide."
