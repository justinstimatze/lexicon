canonical-instances:
  - "A city agency rolling out a new zoning process gives permanent seats on its review board to representatives from the neighborhood association, the contractors' guild, and the environmental office before the first permit is ever contested — later rule changes get 'cleared' informally with each seat-holder and rarely provoke public fights, because every interest already has a standing channel rather than having to organize opposition from outside."
  - "A software company forming a new cross-team platform group invites one representative from each consuming team onto its steering committee at formation, rather than after the first team complains about a breaking change — subsequent API changes get informally checked against each representative's team before shipping, heading off the kind of surprise pushback that would otherwise require a formal escalation process to resolve."
critical-questions:
  - "Selznick's original TVA case is REACTIVE cooptation — absorbing a threat after it emerges. Goss's case is PROACTIVE — building representation in before any threat exists. Does proactive cooptation carry the same risk Selznick warned of (that the coopted group ends up shaping the organization's substance, not just being consulted), or does building it in at founding avoid that risk because there's no pre-existing organizational agenda for the represented interests to capture?"
  - "This mechanism explains why resistance was LOW, but does it also predict the SPEED of decisions — does routing every change through a representative from every affected department trade fast unilateral action for smoother-but-slower consensus, and would that tradeoff still favor cooptation once the organization is larger than a single-year pilot program?"
