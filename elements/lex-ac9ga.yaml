canonical-instances:
  - "In an industry where clients can't evaluate technical quality, a consultant who cultivates eccentric mystique, quietly undermines competitors' reputations, and performs confidence regardless of actual results consistently outearns colleagues doing more careful, less theatrical work."
critical-questions:
  - "Is the teacher's cynicism actually accurate, or does it overstate how gullible most audiences really are, ignoring cases where genuine competence eventually gets recognized despite a slower start?"
  - "Does the pupil's rejection of this advice actually cost him materially in the story, or does the tale leave that question open, presenting virtue and prosperity as simply pointed in different directions?"
