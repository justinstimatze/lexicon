name: repeated-past-deception-can-block-genuine-help-when-it-finally-arrives
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you finally bring real help to someone who has been deceived and hurt many times before by the same source, don't expect your genuine offer to be recognized as different -- the specific defense that protected them from repeated deception may now be indiscriminately rejecting the one offer that's actually real. In Eastman's telling, an old blind couple has had every one of their children and grandchildren 'lured away by wicked Double-Face,' who habitually appears kind before turning cruel. When Mashtinna, having genuinely killed Double-Face and rescued the latest stolen child, arrives at their door with real news and a real rescue -- 'Ho, grandfather, grandmother! I have brought you back the child!' -- their response isn't gratitude or even cautious hope. It's flat, total rejection: 'Ugh, you liar! we don't believe a word you say! Get away with you, do!' Their disbelief isn't foolish or ungrateful -- it's the exact defense that repeated deception trained into them, and that defense has no mechanism for distinguishing 'another lie from the same pattern' from 'the truth, finally, from someone new.' The couple's protective skepticism, built entirely rationally out of a real history of harm, doesn't relax just because the harm is actually over; it keeps functioning exactly as designed, which now means rejecting rescue as reliably as it once correctly rejected deception. Diagnostic move: when bringing genuine help or good news to someone who has been repeatedly burned by deception in the past, don't expect the truth of your offer to be self-evident or to be met with relief -- expect exactly the same skepticism that protected them before, recognize it as a sign the past harm was real rather than as a personal insult to your sincerity, and be prepared to persist, provide evidence, or simply act without their immediate belief rather than waiting for trust that their own defenses aren't built to extend on request."
