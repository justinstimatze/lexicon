lineage:
  - source: primary
    tradition: nowak-five-rules-cooperation
    text: nowak-2006-five-rules-evolution-cooperation
    citation: "Science 314: 1560-1563 (2006), Introduction"
    quote: "Cooperation is needed for evolution to construct new levels of organization. Genomes, cells, multicellular organisms, social insects, and human society are all based on cooperation. Cooperation means that selfish replicators forgo some of their reproductive potential to help one another. […] Here I discuss five mechanisms for the evolution of cooperation: kin selection, direct reciprocity, indirect reciprocity, network reciprocity, and group selection. For each mechanism, a simple rule is derived that specifies whether natural selection can lead to cooperation."
  - source: primary
    tradition: nowak-five-rules-cooperation
    text: nowak-2006-five-rules-evolution-cooperation
    citation: Kin Selection section — Haldane and Hamilton
    quote: "When J. B. S. Haldane remarked, 'I will jump into the river to save two brothers or eight cousins,' he anticipated what became later known as Hamilton's rule. This ingenious idea is that natural selection can favor cooperation if the donor and the recipient of an altruistic act are genetic relatives. […] r > c/b. Relatedness is defined as the probability of sharing a gene. The probability that two brothers share the same gene by descent is 1/2; the same probability for cousins is 1/8."
canonical-instances:
  - Eusocial insects (ants, bees, wasps) — sterile workers raising the queen's offspring is kin-selection-driven (haplodiploidy makes sisters more related to each other than to their own offspring); Hamilton's rule predicts the boundary where sterility evolves.
  - Vampire bat blood-sharing — direct reciprocity over repeated nights; bats that share blood with hungry roost-mates get reciprocated when they themselves come back unfed.
  - Online review systems (Yelp, Amazon, eBay seller reputation) — indirect reciprocity at scale; cooperators build reputation that strangers reward; defectors get reputation-flagged before transacting.
  - Bacterial biofilms — network reciprocity; cooperators producing extracellular metabolites cluster together because the metabolites are spatially local; defectors at boundaries lose access.
  - Religious moral communities (Hutterite colonies, early Christian church organization, certain monasteries) — group selection on cohesive-cooperative groups versus less-cohesive groups; the more-cohesive groups outcompete via demographic + economic success.
  - Open-source software contribution to flagship projects (Linux kernel, Python) — mix of mechanisms, namely reputation (indirect reciprocity in the maintainer ecosystem), direct reciprocity in pull-request cycles, group-selection at the project-survival level.
  - Bystander intervention in emergencies — varies dramatically by perceived kinship/network membership; the same person who walks past a stranger will rush to help an apparent neighbor.
