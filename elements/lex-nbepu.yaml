    quote: 'Such is thy aspect all divine, such glory and delight, / This seen, I may forget my vows: this danger has the sight.'
canonical-instances:
  - "Offered one favor by a departing mentor who has been nothing but generous, a founder skips the introduction or the reference and asks instead that the mentor stop sitting in on board meetings going forward. The mentor has done nothing wrong; the team simply still defers to that presence instead of building its own judgment."
critical-questions:
  - "Operationally distinct from lex-cxbhy (choosing freedom from named inner vices over material boons): that atom is about the CONTENT of what gets chosen instead of wealth; this one is about a further, later move that targets the grantor's own continued access, which lex-cxbhy's Kanha never makes. Does the distinction actually matter, or is foreclosing future contact just one more instance of choosing freedom from attachment?"
  - "Sakka never shows any sign of testing or manipulating Akitti — the danger is entirely genuine and entirely on Akitti's side. Does that make this a stronger example of self-knowledge than stories where the temptation is deliberately staged, or does it just make the sacrifice look more one-sided?"
status: active
