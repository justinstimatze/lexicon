lineage:
  - source: primary
    text: tsing-2015-mushroom-end-of-the-world
    citation: "Anna Lowenhaupt Tsing, *The Mushroom at the End of the World: On the Possibility of Life in Capitalist Ruins* (Princeton University Press, 2015). Tsing develops the methodological frame of POLYPHONIC ASSEMBLAGE through ethnographic and ecological study of matsutake mushroom foraging and commerce in the United States, Japan, Canada, China, and Finland (fieldwork 2004-2011). The transferable claim is that the assemblage frame — open-ended gatherings of heterogeneous lifeways with multiple temporal rhythms, where mutual influence is never fully settled — does work that the community frame (fixed membership, shared purpose, unified rhythm) cannot do for systems where heterogeneity is the operational condition. Tsing draws on prior assemblage-theory (Deleuze and Guattari, though her usage differs) but contributes the POLYPHONIC qualifier explicitly: multiple autonomous melodies intertwining, with both harmony and dissonance as content. The methodological move is to LISTEN polyphonically — to notice simultaneous threads rather than collapse them into one. Tsing extends the frame beyond ecology to supply chains, capitalist production, and the broader question of what manages to live despite capitalism (her 'third nature' concept). The transferable contribution is the STRUCTURAL frame, separable from Tsing's specific anti-progress political commitments. In-copyright (Princeton University Press); verbatim quotation short and attributed under fair-use. Distinct from lex-xu8k9 unscalable-initial-conditions: lex-xu8k9 is the scalability question; lex-f9dgb is the composition question. Cross-domain attestation: Deleuze & Guattari 1980 *A Thousand Plateaus* (the foundational assemblage-theory text, with which Tsing's usage diverges in emphasis); Latour 2005 *Reassembling the Social* (Actor-Network Theory's structurally-similar move to dissolve the community frame); Callon 1986 'Some elements of a sociology of translation' (Saint Brieuc Bay scallops — a foundational ANT case study with similar assemblage structure); Stengers 2005 *The Cosmopolitical Proposal* (the related political-philosophy move toward heterogeneous gatherings); Haraway 2016 *Staying with the Trouble* (companion text in the same intellectual moment, sympathetic stance); Bennett 2010 *Vibrant Matter* (the new-materialism extension). The transferable structural claim is well-attested across this STS/anthropology cluster; Tsing's distinctive contribution is the polyphonic-listening method and the matsutake case."
    quote: "[Tsing 2015 *Mushroom at the End of the World* Ch.1 'Arts of Noticing':] 'In each case, I find myself surrounded by patchiness, that is, a mosaic of open-ended assemblages of entangled ways of life, with each further opening into a mosaic of temporal rhythms and spatial arcs. I argue that only an appreciation of current precarity as an earthwide condition allows us to notice this — the situation of our world.' [On the assemblage frame:] 'The concept of assemblage is helpful. Ecologists turned to assemblages to get around the sometimes fixed and bounded connotations of ecological community. The question of how the varied species in a species assemblage influence each other — if at all — is never settled: some thwart (or eat) each other; others work together to make life possible; still others just happen to find themselves in the same place. Assemblages are open-ended gatherings. They allow us to ask about communal effects without assuming them. They show us potential histories in the making.' [On the polyphonic variant:] 'The qualifier polyphonic may help explain my variant. Polyphony is music in which autonomous melodies intertwine. In Western music, the madrigal and the fugue are examples of polyphony. These forms seem archaic and strange to many modern listeners because they were superseded by music in which a unified rhythm and melody holds the composition together. In the classical music that displaced baroque, unity was the goal; this was progress in just the meaning I have been discussing: a unified coordination of time.' [On the methodological consequence:] 'When I first learned polyphony, it was a revelation in listening; I was forced to pick out separate, simultaneous melodies and to listen for the moments of harmony and dissonance they created together. This kind of noticing is just what is needed to appreciate the multiple temporal rhythms and trajectories of the assemblage.' [On supply chains as polyphonic assemblages:] 'The polyphonic assemblage also moves us into the unexplored territory of the modern political economy. Factory labor is an exemplar of coordinated progress time. Yet the supply chain is infused with polyphonic rhythms.'"
canonical-instances:
  - "Matsutake foraging assemblages (Tsing's canonical case): Mien refugees, Japanese commodity traders, white veterans, scientists, pine trees, mushrooms, weather patterns, federal forest service, Japanese cultural meanings of the autumn season — all gather in a particular patch of Oregon forest. The question 'what is this community pursuing?' is the wrong question. The assemblage frame asks: how do these heterogeneous lifeways gather, what happens in the gathering, how do moments of harmony and dissonance compose? The mushroom price spike connects the patch to global capital; the local foraging practices connect it to refugee livelihoods; the pine-mushroom symbiosis connects it to forest ecology. None of these collapses to any other."
  - "Supply chain as polyphonic assemblage (Tsing's transferable extension): a contemporary Chinese garment factory simultaneously serves local boutique brands, knock-off international brands, and generic to-be-branded-later production. Each requires different standards, materials, labor, timing. The factory matches industrial coordination to the polyphonic rhythms of supply chains. The community frame (one factory, one product, one market) misses what's structurally most important; the assemblage frame surfaces it."
  - "Open source project as assemblage (transferable contemporary extension): contributors with different motives (employed by sponsors, academic researchers, hobbyists, students, antagonists), different cadences (release cycles, conference deadlines, personal time), different platforms (the codebase, mailing lists, issue trackers, IRL conferences). The 'community' frame undersells the heterogeneity; the polyphonic-assemblage frame surfaces the multi-rhythm coordination."
  - "Ecological community (the original ecological context Tsing extends): species in a habitat are NOT a community in the human-political sense; they are an assemblage whose mutual influence is empirically variable. Some species are mutualistic, some competitive, some indifferent. The shift from 'community' to 'assemblage' in ecology was a methodological move toward this kind of openness; Tsing extends it back to the human-social domain."
  - "Distinguished from lex-xu8k9 unscalable-initial-conditions-as-diagnostic-not-defect (Tsing's earlier sibling): lex-xu8k9 is about WHAT GETS ELIMINATED to make a project scalable (heterogeneity, relationship-specific knowledge, locally-meaningful diversity); lex-f9dgb is the COMPOSITION question (what gathers, how, with what rhythms). They compose — non-scalable systems are typically assemblages; scalability often demands flattening the assemblage into a coordinated-community."
  - "Distinguished from 'community' as a methodological frame: community implies fixed membership, shared purpose, unified rhythm. Assemblage allows fluid membership, variable purposes, polyphonic rhythms. Both are methodological choices; using community when the system is actually assemblage produces analytical errors (flattening heterogeneity, missing the multi-rhythm coordination, mistaking gathering for purposive group)."
  - "Distinguished from lex-rbcsc worldview-as-cognitively-prior-pattern: lex-rbcsc is about how cognitive priors shape interpretation; lex-f9dgb is about how heterogeneous gatherings produce emergent effects. They compose — both reject reductive analysis, but the assemblage frame is specifically about composition-of-heterogeneous-elements, while web-of-meaning is about prior cognitive frames."
critical-questions:
  - "Are you forcing a community frame onto what's actually an assemblage? The diagnostic: when you try to identify 'the purpose' or 'the leadership' or 'the membership' of the system and it resists, that resistance may be your data, not noise. Failure mode: declaring the assemblage incoherent because it doesn't fit the community frame, when in fact the assemblage is structurally distinct."
  - "Can you name two or more temporal rhythms that don't collapse? Polyphonic assemblages have multiple cadences (the supply chain's seasonal rhythms, the factory's daily rhythms, the worker's family rhythms, the brand's marketing-cycle rhythms). If you describe the system in one rhythm, you may be flattening. Failure mode: 'unified coordination' as the default analytical lens, even when the system isn't unified."
  - "Are you watching for happenings — gatherings that become greater than sum of parts? Tsing's specific structural question. Assemblages don't always produce happenings; sometimes they just coexist. But when they do, the happening is emergent — not pre-specified by any participant. Failure mode: explaining the happening by attributing it to one participant's intention or design when it actually emerged from the gathering."
  - "What's the boundary of the assemblage, and is the boundary itself a participant? Assemblages are open-ended — membership is fluid. The act of declaring a boundary is itself an intervention. Failure mode: imposing a bounded membership at analysis-time that the assemblage's actual operation does not respect."
  - "Are you listening polyphonically, or collapsing to one melody? Tsing's specific methodological discipline. When you describe the assemblage, are you carrying multiple threads, watching harmony AND dissonance, or are you flattening to one storyline? Failure mode: writing the assemblage's history as if it were one narrative."
