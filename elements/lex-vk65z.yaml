id: lex-vk65z
name: convergent-independent-evidence-streams-warrant-claim-acceptance-even-without-complete-mechanism
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a single line of evidence isn't conclusive, look for convergent independent evidence streams. Acceptance is warranted when multiple independent methods point the same way — even without a complete mechanistic story."
related: [lex-ds73b, lex-spm8x, lex-vtytt, lex-r3w25, lex-wkcck, lex-w97xs, lex-b6kvs, lex-vacza, lex-ymvt4, lex-eadyj, lex-rjf7d, lex-yxky7, lex-z7dbd, lex-8j5ms, lex-6bycb, lex-8f8jk, lex-2jaf6, lex-s22hf, lex-n3ayj, lex-4e6ur, lex-bj7ak, lex-smney, lex-6wsw2, lex-c5j7f]
