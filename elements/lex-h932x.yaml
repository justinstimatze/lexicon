lineage:
  - source: primary
    text: radin-trickster-blames-staying-put-for-trouble-his-own-schemes-caused
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 22. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "There he stayed a long time until his child had become a grown-up man. Then, when he saw that his child was able to take care of himself, he said, 'Well, it is about time for me to start travelling again for my boy is quite grown up now. ... I will go around the earth and visit people for I am tired of staying here. I used to wander around the world in peace. Here I am just giving myself a lot of trouble.'"
canonical-instances:
  - "A person leaves a stable, drama-free job the moment things settle down, telling friends that the routine itself was 'giving them a lot of trouble,' when every previous stretch of chaos in their career actually traced back to their own habit of overcommitting and burning bridges, not to the calm periods in between."
  - "Someone ends a comfortable, low-conflict relationship right after it stabilizes, describing the stability as suffocating and the source of their unhappiness, while their actual pattern of relationship trouble has consistently come from picking unstable partners during the restless periods between relationships, not from the calm ones."
critical-questions:
  - "Is Trickster's restlessness itself the deeper problem, something that would resurface regardless of whether he correctly diagnosed its cause, or would correctly identifying his own conduct as the source of past trouble actually change his behavior going forward?"
  - "Does the story present his departure as a character flaw to be corrected, or as a fixed and even necessary feature of who Trickster is, someone who wanders as a matter of nature rather than choice, making the misdiagnosis less a mistake than an honest description of an unchangeable trait?"
  - "Would Trickster's son, now grown and self-sufficient, agree with his father's account of the stable years as trouble, or does the story suggest the trouble was entirely retrospective, invented at the moment of departure to justify a restlessness that needed no real justification at all?"
