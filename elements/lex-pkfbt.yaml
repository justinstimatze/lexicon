id: lex-pkfbt
name: faking-confidence-at-a-skill-you-lack-can-get-luckily-validated
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Performing confidence at a skill you don't actually have can convince a real expert to doubt themselves instead of you -- and if the world happens to cooperate, the fake performance gets treated as proof it was real all along. In Radin's Winnebago Trickster cycle, Trickster challenges a coyote reputed for its keen sense of smell to a contest: 'Let us play keen-scenter... Let us try, therefore, to scent and see where the nearest people live.' Trickster cannot smell anything at all: 'Trickster, of course, was unable to scent anything. His plan was to behave as though he could and watch what coyote would do.' He simply walks to a spot with confidence and stops, offering no actual evidence -- but the performance alone is enough to make the real expert doubt his own judgment: 'He must be scenting something,' thought the coyote. Trickster presses the advantage immediately: 'You see, my little brother, you cannot scent as well as I can.' The story then hands Trickster's bluff exactly the outcome it needed: the spot he confidently walked to actually did have a village nearby. Nothing about his performance was ever backed by the ability he claimed, but the coincidence retroactively makes the bluff indistinguishable from real skill, both to the coyote and to Trickster's own reputation going forward. Diagnostic move: when someone's confident behavior alone shakes your certainty about your own genuine expertise, separate what you're reacting to, their manner, from what would actually confirm their claim, evidence you can check yourself -- a successful outcome afterward proves the bluff got lucky, not that the confidence was ever backed by anything real."
