evokes: [innovators-dilemma, disruptive-innovation, sustaining-innovation, low-end-disruption, new-market-disruption, christensen-1997, resource-allocation-process, listening-to-customers, exemplary-failure, structural-conflict-current-vs-disruptive, principle-of-disruptive-technology, customer-focused-blocks-disruption, small-organization-disruption-vehicle]
lineage:
  - source: primary
    text: christensen-1997-innovators-dilemma
    citation: "Clayton M. Christensen, *The Innovator's Dilemma: When New Technologies Cause Great Firms to Fail* (Harvard Business School Press, 1997; 2013 anniversary edition cited here). The canonical statement of the disruption primitive. Christensen's empirical setting: the disk-drive industry from 1976 to the mid-1990s, where he observed five generations of disk-drive technology each launched by ENTRANTS (not incumbents) and watched the incumbents — which were exemplary on every standard management dimension — fail systematically against the entrants. Christensen's distinguishing contribution: the failure was NOT incompetence. The incumbents listened carefully to their customers (lex-mxdrn mechanism step), invested heavily in R&D (sustaining innovations), maintained excellent operational discipline, and used standard ROI-based resource-allocation processes. The firms failed BECAUSE they did all this well — the customer-focused resource-allocation process correctly rejected the disruptive technology each time. The disruptive technology was: (a) initially WORSE on the dimensions current customers valued (smaller capacity, slower seek time, etc.); (b) sold into a NEW or LOW-END market the incumbents could not see (initially small revenue); (c) IMPROVING rapidly along the dimensions valued by the new market until it eventually exceeded the incumbents' performance even on the dimensions current customers valued. By the time the disruptive technology was good enough to threaten the incumbents' core market, the entrants had years of learning, scale, and cost structure the incumbents could no longer catch. The firms were not killed by incompetent management; they were killed by exemplary management of the current market under conditions where the disruptive market was the future. Christensen's broader framework (extended in Christensen & Raynor 2003 *The Innovator's Solution* and Christensen et al. 2015 'What Is Disruptive Innovation?' HBR): distinguish 'low-end disruption' (entrants serve over-served existing customers at lower prices/quality) from 'new-market disruption' (entrants serve non-customers); both share the structural feature that the incumbent's current customers do not want the disruptive product, so the incumbent's resource-allocation process correctly rejects it. The 2014-2015 critique (Lepore 2014 New Yorker piece, MIT Sloan replication studies) argues Christensen overgeneralized from disk drives to other industries; the academic debate is unresolved as of 2025. lex-mxdrn carves the TRANSFERABLE PRIMITIVE — the structural conflict between current-customer-focused resource allocation and disruptive opportunity — without endorsing every Christensen claim about every industry. The mechanism is real and recurs in many domains (academic publishing, government policy, family-business succession, software product lines) even where the specific disk-drive empirics are contested."
    quote: "[Christensen 1997 Ch.5-6, paraphrasing pp. 7720-7770 of cleaned 2013-edition extract:] 'There are enormous returns and significant first-mover advantages associated with early entry into the emerging markets in which disruptive technologies are initially used... Despite the evidence that leadership in commercializing disruptive technologies is crucial, large, successful innovators encounter a significant dilemma in the pursuit of such leadership. In addition to dealing with the power of present customers as discussed in the last chapter, large, growth-oriented companies face the problem that small markets don't solve the near-term growth needs of large companies. The markets whose emergence is enabled by disruptive technologies all began as small ones. The first orders that the pioneering companies received in those markets were small ones. And the companies that cultivated those markets had to develop cost structures enabling them to become profitable at small scale. Each of these factors argues for a policy of implanting projects to commercialize disruptive innovations in small organizations that will view the projects as being on their critical path to growth and success, rather than as being distractions from the main business of the company.' [Ch.6 opening:] 'Managers who confront disruptive technological change must be leaders, not followers, in commercializing disruptive technologies. Doing so requires implanting the projects that are to develop such technologies in commercial organizations that match in size the market they are to address. These assertions are based on two key findings of this study: that leadership is more crucial in coping with disruptive technologies than with sustaining ones, and that small, emerging markets cannot solve the near-term growth and profit requirements of large companies.'"
  - source: practitioner
    text: foster-1986-attackers-advantage
    citation: "Richard Foster, *Innovation: The Attacker's Advantage* (Summit Books, 1986). Foster's S-curve framework anticipates Christensen's disruption framing by ~10 years: established firms invest in extending the current technology's S-curve (sustaining innovations) and miss the inflection point at which a new technology's S-curve crosses theirs. Foster's mechanism (technology S-curves) is different from Christensen's (resource-allocation-process), but the structural conclusion is similar: incumbents systematically fail at the inflection point not because they're bad at innovation but because they're invested in the wrong S-curve. Foster's 1986 book carries the upstream framing Christensen later refined and re-grounded in disk-drive empirics. Practitioner reference because Foster's framework popularized the structural-incumbent-failure pattern in business strategy before Christensen formalized the customer-focused-resource-allocation mechanism."
    quote: "[Foster 1986 — verbatim quote not extracted in this pass; structural claim above paraphrased from standard summary.]"
canonical-instances:
  - "operationally distinct from lex-d5eew unregulated-individual-choices-aggregate-to-collective-states-no-actor-preferred (Schelling 1971): lex-d5eew is the population-level micromotive/macrobehavior gap — each individually-rational decision aggregates to a state nobody wanted. lex-mxdrn specializes to the firm-internal case where each individually-rational resource-allocation decision aggregates to firm-doom. The micro-actor in lex-mxdrn is the resource-allocation process; in lex-d5eew it's individual humans."
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: lex-spm8x is the generic feedback primitive; lex-mxdrn specializes to the specific case where customer-feedback is the offending loop — listening to current customers rejects disruptive opportunities."
  - "operationally distinct from lex-4nunt market-aggregation-weights-preferences-by-purchasing-power: lex-4nunt is about the dyadic distortion in market preference-aggregation (the rich count more); lex-mxdrn is about the firm-internal selection mechanism (existing customers count more than disruptive non-customers). Compose: lex-4nunt explains why firms over-serve the rich, lex-mxdrn explains why over-serving the rich blinds the firm to disruptive entry."
  - "operationally distinct from lex-9pgpf tempo-asymmetry-as-strategic-variable (Boyd OODA + Ostrom + Elster): lex-9pgpf cites first-mover advantage in disruptive technologies as an instance of tempo-asymmetry; lex-mxdrn explains why incumbents lose the tempo race — their resource-allocation process is structurally slower at small-market opportunities."
  - "Disk-drive industry 1976-1995 (Christensen 1997 Ch.1-4, the empirical core): five successive generations of disk drives (14-inch → 8-inch → 5.25-inch → 3.5-inch → 2.5-inch and 1.8-inch), each smaller and initially worse on capacity per drive. Each generation was pioneered by ENTRANTS, not incumbents. Each entrant was initially serving a market the incumbents could not see (minicomputers, then PCs, then portables) at price/performance points the incumbents' resource-allocation process rejected as low-margin. Each entrant's S-curve eventually crossed the incumbents' on the dimensions the incumbents' core customers cared about; by then the incumbents could not catch up. Christensen empirically documents that the incumbents' decisions were correct given their resource-allocation processes — they were exemplary on every standard metric."
  - "Steel minimills (Nucor and Chaparral Steel 1965-1995, Christensen Ch.4): U.S. Steel and Bethlehem Steel were exemplary integrated steelmakers serving the high-margin steel markets (sheet steel for automakers, structural steel for construction). Nucor's electric-arc minimill technology was initially limited to the lowest-margin product (rebar) at lower quality than integrated mills. The integrated mills willingly ceded the rebar market to minimills because rebar margins were low. The minimills then improved their technology to angle iron, then to structural steel, then to sheet steel — at each stage the integrated mills willingly ceded the lower-margin segment to focus on higher-margin segments. By the 1990s the minimills dominated all segments. The integrated mills' margin-discipline was exemplary; it also killed them."
  - "Photographic film (Kodak vs digital photography, 1990-2012): Kodak invented the first digital camera (1975 Steve Sasson prototype) but did not commercialize it because digital cameras would have cannibalized Kodak's high-margin film business. Kodak's resource-allocation process correctly identified that digital photography offered worse image quality at higher cost than film for most existing photographic uses. By 2012, when digital had improved enough to dominate, Kodak was bankrupt. The decision not to commercialize the 1975 prototype was correctly rejected by the customer-focused resource-allocation process; the firm-level outcome was catastrophic."
  - "Retail (Sears vs Walmart, 1970-2000): Sears was the dominant U.S. retailer through the 1970s, with high-margin department stores selling to middle-class customers. Walmart's discount-store model was initially limited to small rural markets (where land was cheap and Sears was not present), selling at lower margins than Sears's department stores. Sears could not see the threat because the Walmart market was outside Sears's resource-allocation universe. By 1990 Walmart had improved its operations enough to enter Sears's metropolitan markets at price points Sears could not match. Sears collapsed across the 1990s-2010s while remaining exemplary at its original business model."
  - "Academic publishing (legacy journals vs PLOS and preprint servers, 2000-2025): commercial scientific publishers (Elsevier, Springer, Wiley) optimize for high-impact-factor journals serving institutional libraries with subscription budgets. Open-access publishers (PLOS, eLife, MDPI) and preprint servers (arXiv, bioRxiv, SSRN) initially served niches the commercial publishers correctly identified as low-revenue (fields with no library budget, scientists wanting to share results before formal review). By 2025 the open-access and preprint-server traffic dominates many fields and is increasingly the citation-source. Commercial publishers' high-margin subscription bundles correctly rejected the disruptive opportunities; the publishers are now scrambling to acquire OA imprints."
  - "Family-business succession (general): a family-business founder's exemplary current-customer focus often blinds the next generation to changes in the market that would require pivoting to a different customer segment. The founder's resource-allocation process (loyal to current customers, optimized for current operations) cannot be inherited intact because the market is changing; the next generation must rebuild the resource-allocation process to face the new market. Many family businesses fail at this transition not because the next generation is incompetent but because they correctly inherit the parent's resource-allocation process at the wrong moment in the market cycle."
  - "Software-product-line evolution (general agile/SaaS pattern): an established SaaS product correctly listens to its largest enterprise customers and develops features for them. Smaller customers, hobbyists, or developers building adjacent tools are correctly de-prioritized because they don't pay enough to clear the feature-prioritization bar. A new entrant builds for those de-prioritized users; once that entrant has a critical mass it expands upmarket. The established SaaS's prioritization was correct each quarter; the cumulative effect over five years is loss of the next-generation market."
  - "operationally distinct from and composing-with lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories: lex-mwgep is the generic lock-in primitive; lex-mxdrn is the specific firm-strategy mechanism (customer-focused resource allocation) and the SPECIFIC transferable claim that the failure is EXEMPLARY MANAGEMENT, not lock-in via incompetence."
  - "operationally distinct from and composing-with lex-nr3kg peripeteia-pursuit-mechanism-produces-the-aims-opposite (Aristotle Poetics): lex-nr3kg is the literary plot-reversal version of pursuit-produces-opposite; lex-mxdrn is the institutional version where good-management-pursues-current-market and produces firm-failure-against-disruptive-market. Same underlying shape across vastly different domains."
critical-questions:
  - "Is the threat actually disruptive, or is it a sustaining innovation in disguise? Christensen's most-misused term. Disruption specifically requires: (i) entrant's product is INITIALLY worse on the dimensions current customers value; (ii) entrant serves a market the incumbent does not currently address (low-end or new-market); (iii) entrant's technology improves rapidly along dimensions valued by the new market. If the threat is BETTER than the current product on the dimensions current customers value (e.g., iPhone vs flip phones), that's a SUSTAINING innovation against which incumbent advantages can apply. Misdiagnosing sustaining as disruptive leads to wrong strategy."
  - "Has the firm's resource-allocation process actually rejected the disruptive opportunity, or just deferred it? Diagnose by checking the actual project portfolio: where are the disruptive bets, who staffs them, what's their budget? If they're labeled 'innovation' but funded at <1% of R&D, they're rejected in practice. If they're staffed by senior people with mainline-business backgrounds, they'll be evaluated by mainline criteria and rejected at first review. Operational discipline: count the disruptive bets and check whether their resource-allocation is decoupled from the mainline."
  - "Is the disruptive project actually IMPLANTED IN A SEPARATE small organization, or just nominally separate? Christensen's prescription (Ch.5-6) requires structural separation — separate P&L, separate customer base, separate resource-allocation process, separate physical location. Nominal separation (a project team that still reports to mainline executives, still shares engineering resources, still measures success by mainline metrics) is NOT structural separation and will be killed by mainline pressures. Diagnose: who has hire-fire authority over the disruptive team, and whose budget pays them?"
  - "Are you trying to bring the disruptive project into the mainline TOO EARLY? Christensen's anti-pattern: a successful disruptive project is brought back into the mainline organization to 'scale it' — at which point the mainline resource-allocation process applies its standard criteria (margin, customer-fit, ROI) and the project is killed. Operational corrective: keep the disruptive project structurally separate until it's large enough to clear the mainline criteria on its own terms, then integrate."
  - "Is the firm's current-customer feedback the OFFENDING LOOP, or is it good feedback? Not every customer-feedback loop blocks disruption — only customer-feedback loops where the current customers cannot see the disruptive opportunity and the firm's allocation process correctly rejects it. Diagnose by mapping the customer-feedback channels to project decisions: where are customer-rejected disruptive bets actually being killed?"
  - "Could the disruptive entrant SCALE before the incumbent can react? Christensen's empirical pattern: by the time the disruptive technology is good enough to threaten the incumbent's core market, the entrant has years of learning, scale, and cost-structure the incumbent cannot catch. The strategic implication for incumbents: the window for response is BEFORE the disruptive entrant has clear-cut traction — when the disruptive market still looks too small to matter. After that window closes, defensive moves are usually too late."
  - "Is the entire industry vulnerable, or only specific firm-types? Christensen's most important methodological refinement (Christensen & Raynor 2003): disruption is RELATIVE to a specific incumbent's business model. The same technology can be sustaining for one incumbent (if it fits their resource-allocation criteria) and disruptive for another. Diagnose: what's the SPECIFIC incumbent's customer base and resource-allocation process, and how does the new technology relate to THOSE? Don't generalize across the industry."
