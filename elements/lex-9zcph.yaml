id: lex-9zcph
name: aggregate-theme-balance-can-hide-a-per-channel-skew
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a single document delivers its message through more than one channel or format — text and images, narration and visuals, a headline and the article beneath it — don't evaluate its thematic balance only in aggregate across the whole document; check the balance WITHIN each channel separately, because different audiences consume different channels at different rates, and an aggregate that looks reasonable can hide a per-channel split that defeats the message's actual purpose. Merton and Lazarsfeld's case: a wartime pamphlet aimed at Negro readers had two themes — gains under American democracy, and threatened losses under a Hitler victory — and across 189 paragraphs and captions, 84 per cent dealt with present gains and 16 per cent with potential losses, a distribution its producers evidently found reasonable. But the pamphlet used two types of presentation, and further analysis found that the article and the photograph-captions carried the two themes in completely different proportions: 73 per cent of the article's items referred to losses under Hitler and 27 per cent to gains, while 98 per cent of the photographs and captions referred to gains and only 2 per cent to the Hitler threat. Because a majority of the population, and particularly the Negro population with its lower educational level, generally preferred photographs and captions to a detailed text, the actual audience overwhelmingly received the gains-only version and never encountered the loss-under-Hitler argument the pamphlet was designed to motivate — the pamphlet largely missed its mark, even though its aggregate 84/16 split looked like a defensible editorial choice. Diagnostic move: identify which sub-channel your actual target audience consumes most, and check that channel's own internal balance — not the document's overall average, which can be a statistical artifact no real reader ever experiences."
