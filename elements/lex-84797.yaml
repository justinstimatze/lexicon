    quote: "Nothing is worse than evil company; I fed my fire with plenteous rice and ghee; And lo! the hut which gave me such ado To build it up, my fire has burnt for me."
canonical-instances:
  - "A small business owner who has used the same algorithmic ad platform loyally for years, spending steadily and never switching providers, feels personally betrayed when an automated policy update tanks their account overnight, describing it as the platform 'turning on' a long-time customer rather than a system that never had loyalty to withhold or grant."
critical-questions:
  - "Is the ascetic's mistake really about the fire specifically, or is 'evil company' the wrong diagnosis for a broader habit of expecting any sufficiently complex or long-tended system — markets, bureaucracies, algorithms — to recognize and reward consistent investment the way a person could?"
  - "Does the length and consistency of the ascetic's care make the eventual harm more his own responsibility for the false expectation, or does the fire's superficial appearance of responsiveness (it can be tended, fed, banked, coaxed) make the anthropomorphizing mistake genuinely reasonable rather than naive?"
status: active
