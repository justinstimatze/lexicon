id: lex-2vvck
name: reserve-your-most-precise-surface-for-work-that-needs-precision
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a shared physical resource wears unevenly with use and different tasks tolerate that wear differently, deliberately route the low-tolerance tasks to the resource's best-preserved zone and push the high-tolerance tasks elsewhere -- don't let use be first-come-first-served across the whole surface. Thornton's Textbook of Footwear Manufacture states the leather-cutting shop rule directly: a press block's centre is the flattest, truest cutting surface, and that flatness is what a clean, undercut-free cut actually depends on. The moment the surface tips out of level, the knife slides and the piece comes out ruined. 'The block must be securely bolted to the bed and pushed as far back as it will go... Now for the ends of the block. These should be used for the cutting of all small stuff; only insoles, soles, etc., should be cut in the centre and it should be a golden rule never to use the centre if the end will do.' Soles and insoles are large single panels where an undercut ruins the whole piece; small components (lifts, half-lifts) are more forgiving and more numerous. Cutting is what wears the block, and wear concentrates wherever the knife lands, so every small cut taken at the centre is wear spent on the zone that can least afford to lose flatness, for a task that didn't need that flatness in the first place. The shop's fix isn't to spread wear evenly across the whole block (which would degrade the centre just as fast as concentrating it there) -- it's to zone the block by task-sensitivity: reserve the truest area for the pieces where truth matters, and let everything else wear down the periphery instead. The transferable diagnostic: when a shared resource degrades with use and its degradation isn't uniform across use-sites, ask which current uses of the best-preserved zone don't actually require that zone's quality, and redirect them, even though nothing stops those uses from continuing to consume it."
related: [lex-ts7f6, lex-spk4s, lex-4bgdr]
evokes: [textbook-of-footwear-manufacture, j-h-thornton, good-pressmanship, clicking-room, never-use-the-centre-if-the-end-will-do, press-block-wear, grade-the-knives-by-size]
