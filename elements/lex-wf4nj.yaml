id: lex-wf4nj
name: master-vs-slave-morality-as-typology-of-value-creation
type-in: claim
type-out: typology
_tier: atomic
agent-instruction: "When examining a moral framework, type it: master-morality (creates values, names the good from strength) or slave-morality (inverts the master's values, names the master's good as evil). Nietzsche's typology surfaces what the morality is doing, not just what it says."
related: [lex-wy3r4, lex-r3w25, lex-wjwuc, lex-gma7u, lex-ucw53, lex-pd9p6, lex-xehnw, lex-96xn9, lex-s27um, lex-2sdqf, lex-sxsn7, lex-8ca5h, lex-667f3]
