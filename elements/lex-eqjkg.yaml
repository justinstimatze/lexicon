name: excluding-an-entitled-member-to-dodge-one-prejudice-risks-a-worse-one
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone urges a rightfully-entitled but controversial member to voluntarily step back to avoid provoking one kind of criticism, check whether the exclusion itself invites a different, potentially worse charge. A committee of fellow delegates asked Douglass, a legitimately elected delegate, to skip the 1866 National Loyalist Convention, fearing his attendance would draw charges that the Republican party favored social and political equality. Douglass's reply reframed the actual risk: 'Gentlemen, with all respect, you might as well ask me to put a loaded pistol to my head and blow my brains out, as to ask me to keep out of this convention, to which I have been duly elected. Then, gentlemen, what would you gain by this exclusion? Would not the charge of cowardice, certain to be brought against you, prove more damaging than that of amalgamation? Would you not be branded all over the land as dastardly hypocrites, professing principles which you have no wish or intention of carrying out? As a mere matter of policy or expediency, you will be wise to let me in. Everybody knows that I have been duly elected as a delegate by the city of Rochester. The fact has been broadly announced and commented upon all over the country. If I am not admitted, the public will ask, ‘Where is Douglass? Why is he not seen in the convention?’ and you would find that enquiry more difficult to answer than any charge brought against you.' The exclusion wasn't a neutral, low-visibility retreat -- it was itself a public fact requiring its own explanation, and Douglass's point is that no available explanation for excluding a duly-elected delegate would look better than simply seating him."
