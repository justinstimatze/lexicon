  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch15-sumner-grant-estrangement
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XV, 'Weighed in the Balance.'"
    quote: "“Variance between great men finds no healing influence in the atmosphere of Washington. Interested parties are ever ready to fan the flame of animosity and magnify the grounds of hostility in order to gain the favor of one or the other. This is perhaps true in some degree in every community; but it is especially so of the National Capital, and this for the reason that there is ever a large class of people here dependent upon the influence and favor of powerful public men for their daily bread.”"
canonical-instances:
  - "The direct textual anchor: Douglass frames the estrangement itself as a case of mutual, sincere misjudgment rather than malice -- 'neither one was entirely just to the other, because neither saw the other in his true character; and having once fallen asunder, the occasion never came when they could be brought together' -- naming the dependent class's behavior as what removed any natural occasion for reconciliation, not as the original cause of the falling out."
  - "Hypothetical: two co-founders of a company have a falling out over strategy. Neither actively campaigns against the other, but the wider staff, each employee informally aligning with whichever founder currently controls their team's budget or promotion path, keep relitigating the disagreement in casual conversation to signal loyalty -- with the effect that a rift the two founders might have quietly patched up on their own never gets the private, unwatched moment it would need to heal."
critical-questions:
  - "Operationally distinct from lex-25b4n (a-parasite-fabricates-mutual-slander-to-exploit-a-bonds-destruction): that atom requires a single actor actively inventing false statements each side never actually made, engineering the rift on purpose for a specific payoff. This atom requires no fabrication and no single actor -- the dependents may only ever repeat things Sumner and Grant genuinely said, and each dependent could disappear individually with no effect, since the pressure is aggregate and diffuse rather than orchestrated."
  - "Could either Sumner or Grant have overridden this diffuse pressure by simply choosing to reconcile privately, without needing their dependents' cooperation at all -- or does the mechanism claim the dependents actively obstruct any such private occasion, not merely fail to encourage it?"
  - "Does the size of the dependent class matter -- would this mechanism operate with the same force around two estranged allies in a small organization with only a handful of people whose livelihoods depend on their favor, or does it require something like Washington's specific scale and density of favor-seekers to reach the threshold Douglass describes?"
