id: lex-evy3q
name: model-the-system-as-a-crowd-of-independent-agents-not-one-body-you-inhabit
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When imagining yourself INTO an object or process to find a solution (personal analogy, empathy), don't imagine a single indivisible body performing the action — imagine the object as a crowd of many small independent agents instead, because a single body inherits the human body's own constraint (it must move and act as one connected piece), and that inherited constraint is often exactly what's blocking the solution. Altshuller diagnoses why 'empathy' (Synectics' personal analogy — 'becoming an object and from its position and viewpoint, looking to see what can be done') sometimes backfires: 'In identifying himself with a particular machine (or a part of it) and examining possible alterations to it, the inventor involuntarily selects those which are acceptable to man and rejects any which are unacceptable to the human organism, such as dissecting, splintering, dissolving in acid... The indivisibility of the human organism prevents one from successfully employing empathy in solving many problems.' His fix, Modeling with Little Men (MLM), replaces the single body with 'a multitude (a crowd) of little men' — preserving empathy's vividness while removing the one-body constraint. The demonstration is a single student solving the same problem twice: first with bodily empathy — 'This is ice, and I am an icebreaker. I want to pass through the ice, but the ice does not let me through... He banged up against the ice taking a running jump at it' and failed, because his own indivisible torso and legs fought each other the way a solid hull does; then with MLM — 'If I consist of a crowd of little men, the upper half of the crowd will pass above the table, and the lower part beneath it... We shall have to introduce some kind of bars, which are narrow and pointed; these would easily pass through the ice and we would not have to break up a huge mass of ice.' The crowd model let the student's own imagined 'body' split into independently-acting parts, which is precisely the move (splitting a solid hull into narrow penetrating members) that solves the problem — a move bodily empathy structurally cannot generate, because a body can bend and strain but cannot split into disconnected pieces without ceasing to be one body. Altshuller also traces this pattern to two documented cases of spontaneous discovery via the same shape: Kekulé pictured benzene's ring structure after seeing monkeys form a circle by each holding the next one's tail — a crowd of independent, interacting units, not a single body; Maxwell's thought experiment used imagined 'demons' individually sorting molecules by speed at a valve, again independent small agents rather than one body. Diagnostic move: when 'putting yourself in the object's place' produces only variations that respect an intact, connected, single-piece structure, replace the single imagined body with a crowd of small independent agents assigned to the object's different parts or states — then ask what those agents, acting independently, would need to do, and translate the answer back into a mechanism."
related: [lex-6w927]
evokes: [modeling-with-little-men, MLM, kekule-benzene-ring-monkeys, maxwells-demon-sorting, icebreaker-empathy-failure-then-mlm-success, crowd-model-vs-single-body-empathy]
lineage:
  - source: primary
    text: altshuller-1984-mlm-fixes-empathys-indivisibility
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.4 'Talented Thought: What is it?', section 'Modelling with the Aid of \"Little Men\".'"
    quote: "'In identifying himself with a particular machine (or a part of it) and examining possible alterations to it, the inventor involuntarily selects those which are acceptable to man and rejects any which are unacceptable to the human organism, such as dissecting, splintering, dissolving in acid, etc. The indivisibility of the human organism prevents one from successfully employing empathy in solving many problems... The drawbacks of empathy are overcome in modelling with the help of little men (MLM) — a method utilized in ASIP. In essence it amounts to presenting the object in the form of a multitude (a crowd) of little men. Such a model preserves the merits of empathy (making things visibly obvious, simplicity) and does not have the drawbacks implicit in it.'"
  - source: primary
    text: altshuller-1984-icebreaker-empathy-vs-mlm
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.4, 'Modelling with the Aid of \"Little Men\".'"
    quote: "'One student putting himself into the image of the icebreaker paced the room deep in concentration, and went up to the wall. This is ice, the student said, and I am an icebreaker. I want to pass through the ice, but the ice does not let me through... He banged up against the ice taking a running jump at it... By identifying himself with the ice breaker the student transferred to the icebreaker the indivisibility characteristic of the human organism, and by so doing complicated the problem, empathy in the given instance only hindering the solution. At the next study session the same student solved the problem by using the MLM... I don't understand, what the problem is... If I consist of a crowd of little men, the upper half of the crowd will pass above the table, and the lower part beneath it... We shall have to introduce some kind of bars, which are narrow and pointed; these would easily pass through the ice and we would not have to break up a huge mass of ice.'"
canonical-instances:
  - "A product designer imagining themselves AS a checkout flow ('I am the checkout process, the user hands me their cart...') stays trapped in a single linear sequence; reframing as a crowd of independent little agents — one per cart item, each able to check out on its own schedule — surfaces a batching/partial-fulfillment design a single-body empathy walkthrough never would."
  - "An operations manager trying to feel their way through a supply chain by imagining themselves as 'the shipment' moving start to finish stays limited to one continuous path; modeling the shipment as many independent small units (individual pallets, each free to take a different route or timing) surfaces a split-shipment strategy the single-body walkthrough couldn't generate."
  - "operationally distinct from lex-6w927 system-operator-nine-windows: that atom analyzes a system by shifting VIEWPOINT across scale (subsystem/system/supersystem) and time (past/present/future); this atom is about the FORM the imagined model itself takes when using empathy/personal-analogy specifically — one connected body versus a crowd of independent small agents — a different axis of the same broader 'imagine yourself into the problem' family of techniques."
critical-questions:
  - "does the crowd-of-agents model ever import its OWN false constraint — for instance, assuming the little men act completely independently when the real system actually requires some coordination or connection between its parts that a crowd model too easily discards?"
  - "how does a solver know which technique to reach for first, bodily empathy or MLM, given that Altshuller's own account shows the SAME solver failing with one and succeeding with the other on the SAME problem — is there a principled signal (the object needs to change SHAPE or SPLIT vs. needs to sense/feel something) for choosing between them in advance?"
  - "Kekulé's and Maxwell's cases are both PRE-EXISTING discoveries retroactively read as MLM-shaped — does that retrospective fit risk overclaiming the method's originality or power, when the two scientists may not have been doing anything as deliberate as 'imagine a crowd of independent little men' in the moment?"
status: active
