id: lex-eybad
name: emergent-effects-resist-decomposition-into-summed-causes
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When effects emerge from interactions, they resist decomposition into summed causes. Mill's composition-of-causes: heteropathic effects can't be predicted from the components alone. Don't run isolation-tests when the system is emergent; the isolation breaks the dynamics you're studying."
