id: lex-qhrpv
name: comparative-substrate-bootstrapping
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When a new domain feels unmappable, surface comparative substrate bootstrapping — borrow the structure of an already-understood domain (a metaphor, an analog, a near-isomorphism), then iteratively correct as the new domain pushes back; treat the borrowed frame as scaffolding, not foundation."
related: [lex-2sx7q, lex-bvabu, lex-ftke9, lex-hm8yx, lex-p6p82, lex-rufum, lex-unfs7]
scaffolds-from: [lex-2sx7q, lex-p6p82, lex-unfs7]
evokes: [the-ladder-of-cases, scaffolded-decomposition, the-spiral-curriculum, simpler-then-richer, each-rung-explains-the-next]
lineage:
  - source: primary
    text: pilot-J-pass-2
    citation: "Surfaced from the Kurzgesagt corpus (4/8 substantive transcript attestation, characteristic Kurzgesagt pedagogical move): T01 minds (roundworm 302 neurons → bee 1M → octopus 500M → bird billions → human 86B — explicitly a ladder of mind-gap capacity); T05/T10 trees (cellulose-only-plants → plants-with-lignin → plants-with-wood → trees — evolutionary capacity ladder); T08 history (the entire video is this shape: proto-tools → fire → art → agriculture → cities → writing); T09 cosmology (Uranus-anomaly → Mercury-anomaly → cosmic-monsters → 2-speeds → JWST-old-galaxies — anomaly-shape ladder). Verified 2026-08-19: The T01 neuron ladder is confirmed exact against the real video, YouTube id dl0-TveDDGA, via yt-dlp captions: 302 for roundworm, one million for bee, 500 million for octopus, billions for some birds, 86 billion for human, all present verbatim. T05/T10 confirmed, YouTube id ZSch_NgZpQs (Trees Are So Weird) — the cellulose/lignin/wood evolutionary ladder is present as described. T08 confirmed, YouTube id KNwMiydCYA4 (All Of Human History In One Hour) — the fire/cities/writing ladder is present as described. T09 confirmed, YouTube id zozEm4f_dlw (same video as the T09 entries in lex-p6p82 and lex-2x8qw) — all five rungs present: Uranus anomaly, Mercury anomaly, the First Crack Cosmic Monsters section, the Second Crack Two Speeds section, and the Third Crack JWST old-galaxies section."
  - source: practitioner
    text: bruner-1960-process-of-education
    citation: "Jerome Bruner, The Process of Education (Harvard UP 1960), p.13. The 'spiral curriculum' thesis: revisit topics at increasing levels of complexity, each pass bootstrapping the next. The spiral-curriculum is the pedagogical operationalization of comparative-substrate-bootstrapping at the curriculum-design layer (vs single-explanation layer)."
    quote: "'A curriculum as it develops should revisit these basic ideas repeatedly, building upon them until the student has grasped the full formal apparatus that goes with them... There is much still to be learned about the ‘spiral curriculum’ that turns back on itself at higher levels.'"
  - source: practitioner
    text: polya-1957-how-to-solve-it
    citation: "George Polya, How to Solve It (Princeton UP 1957, 2nd ed of 1945 original) — Polya's 'solve a simpler related problem first' heuristic. The simpler-problem solution bootstraps the harder-problem approach. Comparative-substrate-bootstrapping at the problem-solving layer is Polya's heuristic generalized to multi-rung ladders rather than single-rung pairs. Part I §9 'Devising a Plan' p9 (and Conway foreword pxxi quoting Polya's wise advice)"
    quote: "We know, of course, that it is hard to have a good idea if we have little knowledge of the subject, and impossible to have it if we have no knowledge. Good ideas are based on past experience and formerly acquired knowledge... The materials necessary for solving a mathematical problem are certain relevant items of our formerly acquired mathematical knowledge, as formerly solved problems, or formerly proved theorems. Thus, it is often appropriate to start the work with the question: Do you know a related problem?... If we succeed in recalling a formerly solved problem which is closely related to our present problem, we are lucky. We should try to deserve such luck; we may deserve it by exploiting it. Here is a problem related to yours and solved before. Could you use it? [Part I §9, p9]... [Conway foreword pxxi quoting Polya's wise advice:] If you can't solve a problem, then there is an easier problem you can't solve: find it."
  - source: practitioner
    text: textbook-chemistry-pedagogy
    citation: "Common pedagogical move in introductory chemistry textbooks: atom (single-element) → molecule (multi-atom bond) → compound (multi-molecule structure) → reaction (multi-compound transformation). Each rung builds on the prior rung's vocabulary and conceptual primitives. The convention is so embedded in chemistry pedagogy it operates without comment, but it IS comparative-substrate-bootstrapping. Same pattern in introductory biology (cell → tissue → organ → organism → population → ecosystem)"
canonical-instances:
  - "Kurzgesagt T01 minds-as-ladder: roundworm (302 neurons; learns 'this is bad' for hours) → bee (1M neurons; mental map of flowers, dance-language) → octopus (500M neurons; distributed processing in arms) → bird (billions; theory-of-mind of other birds) → human (86B; recursive theory-of-mind). Each rung's mind-capacity bootstraps understanding the next; the ladder structure IS the explanation of why human minds are special"
  - "Kurzgesagt T08 history-as-ladder: every-50-years-per-second through human history. Each civilizational stage (hunter-gatherer → fire-tool-using → cave-painting → settled-farming → city-building → writing-using) builds on the prior stage's capacities. The video's pedagogical structure mirrors the historical structure"
  - "physics undergraduate education sequence: classical mechanics → electromagnetism → special relativity → quantum mechanics → general relativity → quantum field theory. Each course bootstraps from the prior — the QM course presupposes the wave-equation maturity from EM; QFT presupposes both QM and special relativity. The sequence is not arbitrary; each rung is the substrate for the next"
  - "introductory programming pedagogy: variables → control flow → functions → data structures → object-oriented design → patterns. Each rung is a primitive for the next; teaching out-of-order produces predictable failure modes"
  - "Polya-style solve-easier-problem: when stuck on a hard geometry problem, solve the analogous problem in 1D first, then 2D, then 3D. Each dimension's solution informs the next. Comparative-substrate-bootstrapping applied at the within-problem layer"
  - "operationally distinct from lex-hm8yx scale-separation: scale-separation is choosing the right level for analysis (and ignoring cross-scale couplings); comparative-substrate-bootstrapping is TRAVERSING a sequence of levels for explanation. Scale-separation is point-selection; comparative-substrate-bootstrapping is path-traversal"
  - "operationally distinct from lex-ftke9 work-backwards-from-goal: work-backwards is decomposing toward a target; comparative-substrate-bootstrapping is sequence-of-cases-as-pedagogy where each case explains the next. Different decomposition shapes"
  - "operationally distinct from lex-2sx7q sequential composition: sequential is the meta-operation of chaining atoms in fixed order; comparative-substrate-bootstrapping is a specific shape of explanation-design that USES sequential composition as one component. Sequential-of-explanations where each explanation is the substrate for the next"
  - "operationally adjacent to lex-p6p82 counter-intuitive-premise-opens-explanation: counter-intuitive-premise opens; comparative-substrate-bootstrapping then traverses the ladder. The two compose for canonical Kurzgesagt-style explanations: paradox-frame + ladder-traversal"
  - "key critical question: is each rung actually a substrate for the next, or are they just sequential examples? Genuine comparative-substrate-bootstrapping requires that rung N's explanation be essential for rung N+1's intelligibility. If rungs could be re-ordered without loss, you have sequence-of-examples (sequential composition) but not bootstrapping"
  - "foundational critical question: are the rungs at the right grain-size? Too-fine rungs produce explanation-paralysis (the spiral never reaches the goal); too-coarse rungs produce comprehension-jumps the audience can't make. Rung-grain-size is a tunable parameter of the move; getting it wrong is the typical failure mode"
critical-questions:
  - "what specific structural features are you borrowing from the known domain — name them, so divergences are visible later"
  - "is the borrowed structure decisive or scaffolding? indispensable borrowings calcify the new domain into the old; scaffolding sheds"
  - "at what point does the new domain push back against the borrowed frame — are you noticing and updating, or rationalizing the fit?"
  - "is the analog's familiarity making the new domain look more known than it is (false fluency)?"
status: active
