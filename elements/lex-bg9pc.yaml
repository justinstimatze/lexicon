canonical-instances:
  - "A pre-med-style track (nursing, engineering, actuarial science) with two years of sequential, program-specific coursework structurally excludes anyone who first decides in junior year, so its enrolled population looks unusually committed and decisive on paper — not because these students are more sure of themselves than students in a track with generic, satisfy-anywhere prerequisites, but because the track itself never let the uncertain or late-deciding ones in."
  - "A company's apprenticeship pipeline requires two years of specific in-house certifications before someone can even apply for the terminal role; a competing firm's equivalent role requires only generally-useful business coursework anyone might already have picked up. Comparing the two firms' new hires and concluding the first firm's hires are simply more dedicated mistakes a structural filter on who could even apply for a psychological trait about who wanted it most."
critical-questions:
  - "Thielens notes the requirements-explanation can't be the whole story, since many medical students decided more than 4 years early — often before college — a lead time far beyond what a 52-semester-hour requirement alone demands; how much of the EARLY tail of the distribution (as opposed to just the exclusion of LATE deciders) is this mechanism actually explaining, versus some other force operating on top of it?"
  - "Does the mechanism predict that if a lenient track suddenly imposed extensive track-specific prerequisites, its population's reported decision-timing would shift earlier within a generation — or would the shift take longer, because it also requires changing who applies at all, not just when current applicants decide?"
status: active
