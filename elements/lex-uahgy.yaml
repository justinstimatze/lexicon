id: lex-uahgy
name: intentional-stance-treats-system-as-rational-agent-for-prediction
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When predicting an unfamiliar system's behavior, choose deliberately among three predictive strategies. PHYSICAL STANCE: predict from the physical constitution of the system and the laws of physics — works in principle for everything, in practice only for tractable cases. DESIGN STANCE: predict on the assumption that the system is designed and will behave as designed — works for artifacts and many biological structures, fails when the design is violated (alarm clock pumped full of liquid helium). INTENTIONAL STANCE: predict by treating the system as a rational agent — figure out which beliefs and desires it ought to have given its situation, then predict that it will act to further its goals in light of those beliefs. The transferable move is the STANCE CHOICE: a system is well-explained at whichever level yields the most predictive traction. Stance attribution is pragmatic and instrumentalist — adopting the intentional stance toward a thermostat does not commit you to a metaphysical claim that the thermostat 'really' has beliefs; it commits you to the prediction that treating it as if it does works. Diagnostic uses: (1) when a prediction is failing, ask which stance is being implicitly used and whether a different one would yield better traction. (2) when an argument about whether X 'really' has beliefs or intentions collapses into a metaphysical impasse, redirect to the operational question: does the intentional stance predict X's behavior?"
related: [lex-wtkuz, lex-ucw53, lex-8n237, lex-8y3ch, lex-fdvmu, lex-hv2dn, lex-4pmyk]
