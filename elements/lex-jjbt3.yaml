id: lex-jjbt3
name: individually-mild-conditions-can-be-jointly-impossible
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before assuming that a handful of reasonable-sounding requirements can obviously be satisfied together, check whether anyone has actually tried to satisfy all of them at once. Arrow's four conditions for a rule turning individual preferences into a social ranking each sound minor on their own: the rule must work no matter what preferences people actually hold (unrestricted domain), it must respect unanimous agreement (weak Pareto), the ranking of two options can't swing because of how people rank some third, unrelated option (independence of irrelevant alternatives), and no single person's preference can automatically override everyone else's (non-dictatorship). Sen: “The rather stunning theorem that Arrow proved is that there is no SWF that can simultaneously satisfy all these four conditions, mild as they look. Each looks innocuous enough, but together they seem to produce a monster that gobbles up all the little SWFs in the world.” No rule of any kind, known or yet to be invented, can satisfy every condition -- the four are provably incompatible as a set, regardless of how thorough the search for a rule gets. Diagnostic move: when a design brief lists several requirements and each one individually sounds achievable, don't infer that satisfying all of them together is just a matter of effort. Check whether the requirements have actually been proven jointly satisfiable, because a handful of mild constraints can define an empty set without any single constraint looking demanding."
