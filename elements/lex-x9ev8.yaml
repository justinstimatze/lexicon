evokes: [silencing-the-survivor-protects-the-future-victim-pipeline, cushing-the-hermit-mitsina, that-he-might-not-go-back-and-report-his-losses, i-am-thy-slave]
lineage:
  - source: primary
    text: cushing-mitsina-kills-losers-to-prevent-warning-future-victims
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Hermit Mitsina.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Then in utter despair he would exclaim: Do with me as thou wilt. I am thy slave. And old Mitsina with the same devil-may-care manner would catch him up, take him out to the back of his house and wring his neck that he might not go back and report his losses to his people.'"
canonical-instances:
  - "A predatory multi-level marketing recruiter who has extracted a member's entire savings and alienated them from friends and family ensures the member stays isolated and dependent rather than simply letting them walk away, because a former member speaking openly about the losses would warn off the next round of recruits far more effectively than any outside skeptic could."
  - "A cult leader who has taken everything a follower has to give, money, labor, relationships, makes leaving the group functionally impossible rather than just financially pointless, because an ex-member's account of what actually happened poses a much bigger threat to future recruitment than the sunk cost of that one follower ever did."
critical-questions:
  - "Does Mitsina's method of elimination, killing rather than merely permanently indebting or enslaving the victim, actually serve the information-suppression goal better than keeping the victim alive but controlled would, given that a living captive could still eventually escape and talk?"
  - "Is there a point earlier in the sequence of losses where a young man could have recognized this end state coming and left before staking everything, or does the story present the total loss as effectively inevitable once the game begins?"
  - "Would knowledge of this pattern, that no one who plays Mitsina and loses everything is ever seen again, function as its own warning that should have reached potential victims regardless of any individual survivor's testimony -- does the story explain why this information gap persists despite the presumably repeated disappearances?"
