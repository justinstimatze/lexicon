    text: jataka-chalmers1895-kaccani-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 417, Kaccani-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "To set the old woman's son against her, she would scatter phlegm and mucus and grey hairs here and there, and when he asked who was making the whole house so dirty, she would say, \"Your mother does it; but if she is told not to do so, she makes an outcry: I can't stay in the same house with such an old witch: you must decide whether she stays or I.\""
canonical-instances:
  - "A coworker leaves stray typos and formatting errors in a shared document right before pointing out to the team lead that a colleague's work has gotten sloppy, using the planted mess as the visible proof."
critical-questions:
  - "What would it take for the accused party to prove the traces were planted rather than genuinely theirs, given that the traces themselves are the only evidence in play?"
  - "Why does the person receiving the accusation default to believing the physical trace over the accused party's denial?"
