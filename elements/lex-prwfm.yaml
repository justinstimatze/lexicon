id: lex-prwfm
name: cobra-effect
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When an explicit incentive scheme produces unintended optimization (rewarding cobra bounties produced cobra farms), suspect the cobra effect. The incentive measured a proxy; the actor optimized the proxy, not the underlying intent. Realign the proxy or remove the incentive."
related: [lex-znaau, lex-rfxtb, lex-jy4aq, lex-th6tr, lex-u5869, lex-k2kdc, lex-akfgc, lex-ubdyr, lex-pqqhr, lex-tb3re, lex-z2s4d, lex-ws2gv, lex-eqy5r, lex-2jn8d, lex-gv3us, lex-nbk6e, lex-643m7, lex-eaw4v]
