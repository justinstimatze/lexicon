evokes: [unheated-iron-cannot-be-welded, no-union-without-heat, mudpots-colliding-mutual-ruin, matched-reciprocal-harassment]
lineage:
  - source: primary
    text: kautilya-arthashastra-mudpot-collision
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'The Six Methods Applied to Stronger, Equally Strong or Weak Kings,' 'General Principles,' {7.3.1-5}."
    quote: "'He shall make peace with an equally powerful or stronger king; he shall wage war against a weaker king. [He shall not wage war against a stronger king] because he who fights against a stronger king is crushed like a foot soldier fighting an elephant. A fight with an equal brings losses to both sides, just like the destruction of two unbaked mudpots hitting each other.'"
  - source: primary
    text: kautilya-arthashastra-friction-enables-welding
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part X, section 'The Six Methods Applied to Stronger, Equally Strong or Weak Kings,' 'Exceptions,' {7.3.6-9}."
    quote: "'A king, whose offer of peace is rejected by an equally powerful king, shall harass the other to the same extent that he is harassed. Just as unheated pieces of iron cannot be welded together, there can be no union without heat [brought about by friction].'"
canonical-instances:
  - "Two evenly-matched companies locked in a patent dispute reject each other's initial cross-licensing proposals as too generous to give away for free, and only after a costly, mutually damaging period of litigation and countersuits does either side feel enough pressure to accept terms that were, in substance, close to what was on the table at the start — the litigation was not wasted cost so much as the 'heat' that made an already-sensible settlement finally feel necessary to both sides."
  - "Two labor negotiators representing roughly equal bargaining power reach an impasse on a first, reasonable offer; a strike or work slowdown that costs both sides real money is what eventually produces a durable contract, whereas skipping straight to arbitration without that costly interim friction sometimes produces an agreement neither side actually internalizes or honors as readily."
critical-questions:
  - "how would a party distinguish, at the time, between friction that is genuinely building toward eventual union and friction that is simply escalating toward a worse, protracted conflict with no natural stopping point — Kautilya's own 'to the same extent that he is harassed' cap assumes disciplined reciprocity that real conflicts frequently fail to maintain?"
  - "does this principle risk becoming a justification for provoking unnecessary conflict any time an initial peace offer is refused, when the refusal might simply reflect a legitimate disagreement about terms rather than 'insufficient pressure to value union' — how would a party rule out the more mundane explanation before escalating?"
  - "is there a meaningful difference between 'friction is a necessary precondition for a durable settlement' and 'the side that escalated afterward simply won a war of attrition and called the result a settlement' — does the welding metaphor romanticize what might, in a given case, simply be a costly victory misdescribed as mutual bonding?"
