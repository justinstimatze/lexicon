lineage:
  - source: primary
    text: plutarch-c100-life-of-fabius-delay-strategy
    citation: "Plutarch, Life of Fabius Maximus, in Plutarch's Lives of the Noble Grecians and Romans, trans. John Dryden, revised by Arthur Hugh Clough (1859 revision of the 1683 Dryden translation; Project Gutenberg #674). Appointed dictator after Rome's defeats at Trebia and Trasymene, Fabius adopts a policy of continuous avoidance of battle against Hannibal, exploiting the Carthaginian army's dependence on time-limited supplies and the absence of local allies."
    quote: "he deemed it best not to meet in the field a general whose army had been tried in many encounters, and whose object was a battle, but to send aid to their allies, control the movements of the various subject cities, and let the force and vigor of Hannibal waste away and expire, like a flame, for want of aliment. [...] not with intention to fight him, but with the purpose of wearing out and wasting the vigor of his arms by lapse of time, of meeting his want of resources by superior means, by large numbers the smallness of his forces. With this design, he always encamped on the highest grounds, where the enemy's horse could have no access to him. Still he kept pace with them; when they marched he followed them, when they encamped he did the same, but at such a distance as not to be compelled to an engagement, and always keeping upon the hills, free from the insults of their horse; by which means he gave them no rest, but kept them in a continual alarm."
  - source: primary
    text: plutarch-c100-life-of-fabius-hannibal-sees-the-danger
    citation: "Same Life, continuing — Plutarch reports that Hannibal, unlike Fabius's own officers and countrymen, correctly recognized the delay strategy as a genuine threat rather than cowardice, and its vindication a year later in Fabius's advice to Aemilius Paulus before Cannae."
    quote: "Hannibal was himself the only man who was not deceived, who discerned his skill and detected his tactics, and saw, unless he could by art or force bring him to battle, that the Carthaginians, unable to use the arms in which they were superior, and suffering the continual drain of lives and treasure in which they were inferior, would in the end come to nothing. [...] if for this year you abstain from fighting with him, either his army will perish of itself, or else he will be glad to depart of his own will. This evidently appears, inasmuch as, notwithstanding his victories, none of the countries or towns of Italy come in to him, and his army is not now the third part of what it was at first."
canonical-instances:
  - "The direct textual anchor: Fabius shadows Hannibal from high ground, refusing engagement while Rome's allies and supply base remain intact and Hannibal's invading force, cut off from home and reinforcement, bleeds strength it cannot replace."
  - "A startup facing a well-funded but runway-limited competitor in a price war does not try to outspend them; it holds a defensible niche, keeps costs low, and waits for the competitor's investor capital — a wasting asset with a fixed burn rate — to run out."
  - "A defendant facing a plaintiff whose case depends on a costly, time-limited campaign of public pressure or expensive litigation does not rush to a public rebuttal fight on the plaintiff's chosen terms; sustained procedural patience lets the pressure campaign's own funding, media-cycle attention, or legal budget exhaust itself first."
critical-questions:
  - "how does this differ from lex-qa6hc (Sun Tzu, supreme-achievement-is-winning-without-direct-confrontation)? lex-qa6hc ranks confrontation-avoidance strategies BEFORE a conflict begins or escalates — subverting plans, preventing alliance, preemption — with direct battle as the last-resort worst option. This atom is narrower and describes conduct DURING an already-live, ongoing conflict: the specific tactic of continuous shadowing-without-engaging, justified by a concrete asymmetry in which side's strength decays with time. Fabius is not preventing the war; Rome and Hannibal are already at war. lex-qa6hc is the general strategic ranking; this atom is one specific instantiation of it, with its own distinct evidentiary structure (identify the wasting-asset side, then deny it battle) worth naming on its own."
  - "how does this differ from lex-dme3d (soft-overcomes-hard) and lex-9t2ux (wu-wei-as-non-coercive-action)? Both name a general principle of yielding or non-forcing rather than direct opposition. This atom is far more specific: it requires a diagnosed STRUCTURAL ASYMMETRY (one side's strength is renewable, the other's is a wasting asset under time pressure) as the precondition for the tactic to work — it is not merely 'be soft' or 'don't force it,' but a resource-decay calculation that licenses a particular course of action with a predicted endpoint (the enemy's own resources give out)."
  - "does the atom claim avoidance-of-battle is always correct against a stronger foe? No — it depends entirely on the diagnosed asymmetry holding: your own side's strength must be the renewable one (secure supply, home terrain, allied reinforcement), and the opponent's must be the wasting one. Plutarch's own narrative supplies the counter-case: Minucius, Fabius's co-commander, seizes what looks like a decisive opportunity and is nearly destroyed because the position was a deliberate bait — Hannibal exploited Minucius's break from the delay strategy exactly because Minucius wrongly believed the moment for direct engagement had arrived. The tactic requires correctly reading which side time favors, not a blanket preference for delay."
  - "isn't this just 'patience' or 'don't rush'? The atom's specific content is narrower than a general patience virtue: it names the CAUSAL MECHANISM that makes patience the correct move in this class of situation — a quantifiable resource-decay asymmetry between the two sides — and prescribes a concrete tactic (continuous shadowing at safe distance, denying the engagement) rather than a general disposition. Patience without the underlying asymmetry diagnosis is not this pattern; it could equally be the wrong call against an opponent whose strength is the renewable one."
