lineage:
  - source: primary
    text: thoreau-1854-walden-economy
    citation: "Henry David Thoreau, *Walden; or, Life in the Woods* (Boston: Ticknor and Fields, 1854), chapter 'Economy.' The chapter opens Walden and lays out Thoreau's economic argument before the pond narrative proper begins. The shelter section builds the house-cost argument (the savage's cost-free wigwam vs. the civilized laborer's ten-to-fifteen-year mortgage), states the pivotal re-denomination directly, and then re-derives it as Thoreau's own itemized $28.12½ construction ledger for the Walden house. The chapter closes its argument with two further worked instances of the same move: the Cambridge College tuition/room-rent passage, and the Fitchburg walking-vs.-riding thought experiment."
    quote: "[The pivotal definitional statement:] 'It must be shown that it has produced better dwellings without making them more costly; and the cost of a thing is the amount of what I will call life which is required to be exchanged for it, immediately or in the long run. An average house in this neighborhood costs perhaps eight hundred dollars, and to lay up this sum will take from ten to fifteen years of the laborer's life, even if he is not encumbered with a family — estimating the pecuniary value of every man's labor at one dollar a day, for if some receive more, others receive less; — so that he must have spent more than half his life commonly before his wigwam will be earned. If we suppose him to pay a rent instead, this is but a doubtful choice of evils. Would the savage have been wise to exchange his wigwam for a palace on these terms?' [The savage-owns-outright contrast, immediately prior:] 'It is evident that the savage owns his shelter because it costs so little, while the civilized man hires his commonly because he cannot afford to own it; nor can he, in the long run, any better afford to hire.' [Thoreau's own itemized construction ledger, presented explicitly as a corrective to nobody ever actually doing this arithmetic:] 'The exact cost of my house, paying the usual price for such materials as I used, but not counting the work, all of which was done by myself, was as follows; and I give the details because very few are able to tell exactly what their houses cost, and fewer still, if any, the separate cost of the various materials which compose them: — Boards $8.03½ ... Refuse shingles for roof sides 4.00 ... Laths 1.25 ... Two secondhand windows with glass 2.43 ... One thousand old brick 4.00 ... Two casks of lime 2.40 ... Hair 0.31 ... Mantle-tree iron 0.15 ... Nails 3.90 ... Hinges and screws 0.14 ... Latch 0.10 ... Chalk 0.01 ... Transportation 1.40 ... In all $28.12½.' [The Cambridge College extension:] 'I thus found that the student who wishes for a shelter can obtain one for a lifetime at an expense not greater than the rent which he now pays annually. ... At Cambridge College the mere rent of a student's room, which is only a little larger than my own, is thirty dollars each year... I cannot but think that if we had more true wisdom in these respects, not only less education would be needed, because, forsooth, more would already have been acquired, but the pecuniary expense of getting an education would in a great measure vanish. Those conveniences which the student requires at Cambridge or elsewhere cost him or somebody else ten times as great a sacrifice of life as they would with proper management on both sides. Those things for which the most money is demanded are never the things which the student most wants.' [The Fitchburg walking-vs.-riding arithmetic:] 'I say to my friend, Suppose we try who will get there first. The distance is thirty miles; the fare ninety cents. That is almost a day's wages. I remember when wages were sixty cents a day for laborers on this very road. Well, I start now on foot, and get there before night; I have travelled at that rate by the week together. You will in the meanwhile have earned your fare, and arrive there some time tomorrow, or possibly this evening, if you are lucky enough to get a job in season... This spending of the best part of one's life earning money in order to enjoy a questionable liberty during the least valuable part of it reminds me of the Englishman who went to India to make a fortune first, in order that he might return to England and live the life of a poet. He should have gone up garret at once.' [The conformity-driven bad-bargain observation, adjacent territory:] 'Most men appear never to have considered what a house is, and are actually though needlessly poor all their lives because they think that they must have such a one as their neighbors have.'"
