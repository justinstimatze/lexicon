id: lex-kfk68
name: categorical-imperative-universalizability-as-moral-test
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When evaluating an action's morality, run the categorical imperative: can I universalize the maxim of my action as a law for all rational agents? If universalization breaks (it self-contradicts or undermines its conditions), the action is impermissible."
related: [lex-pbdbb, lex-mthv9, lex-srj3h, lex-9wbd3, lex-7mdpd, lex-d6vbs, lex-gzgn3, lex-xxmeh, lex-r3aug, lex-kxk99, lex-xuwr2, lex-acmmk, lex-mkpb2, lex-m33nq]
scaffolds-from: [lex-d6vbs, lex-gzgn3]
evokes: [act-only-on-maxims-you-could-universally-will, the-test-of-universal-law, what-if-everyone-did-that, moral-rule-as-formal-not-empirical, contradiction-in-conception]
lineage:
  - source: primary
    text: kant-1785-groundwork
    citation: "Immanuel Kant, *Fundamental Principles of the Metaphysic of Morals* (1785; the standard English titling of *Grundlegung zur Metaphysik der Sitten*; Abbott translation). (Project Gutenberg #5682). The Categorical Imperative is Kant's foundational moral criterion: an act is morally permissible if and only if its maxim (the agent's subjective principle of action) can be consistently willed to become a universal law. The TEST: imagine everyone in your situation acted on your maxim. If this leads to (a) logical contradiction (contradiction in conception) or (b) a world no rational agent could will (contradiction in willing), the maxim fails — the act is impermissible. Distinct from the GHP (lex-9wbd3) by being a formal-procedural test, not an aggregate-welfare calculation. Foundational to deontological ethics."
    quote: "[Kant, Groundwork Section II:] 'There is therefore but one categorical imperative, namely, this: Act only on that maxim whereby thou canst at the same time will that it should become a universal law... Since the universality of the law according to which effects are produced constitutes what is properly called nature in the most general sense (as to form), that is the existence of things so far as it is determined by general laws, the imperative of duty may be expressed thus: Act as if the maxim of thy action were to become by thy will a universal law of nature.' [The structural claim: the test of moral permissibility is whether the maxim of action can be consistently universalized — the formal procedure tests for self-contradiction in the proposed universalization, not for aggregate-welfare outcomes.]"
  - source: practitioner
    text: rawls-1971-theory-of-justice-veil-of-ignorance
    citation: "John Rawls, *A Theory of Justice* (1971). Tier-3 deepening: Rawls's veil-of-ignorance procedure is a modern Kantian-style universalizability test. The original-position thought experiment asks: what principles of justice would rational agents choose if they did not know what position they would occupy in the resulting society? The veil enforces the same impartiality-via-formal-procedure shape that Kant's universalizability requires. Rawls explicitly identifies his project as Kantian. In-copyright;"
    quote: "[Tier-3 deepening — Rawls 1971: the original position is a device of representation in which all parties to social cooperation are equally situated. Behind the veil of ignorance, no one knows their own race, class, gender, generation, or particular conception of the good. The principles chosen under these conditions are those that could be universally consented to by rational agents. This operationalizes Kant's universalizability — instead of asking 'can my maxim be universalized?', Rawls asks 'would all rational agents choose this principle if they didn't know which position they'd occupy?' Same shape, different application: Kant tests individual maxims, Rawls tests social principles.]"
  - source: practitioner
    text: scanlon-1998-what-we-owe-to-each-other-contractualism
    citation: "T. M. Scanlon, *What We Owe to Each Other* (1998). Tier-3 deepening: Scanlon's contractualism is another modern Kantian-procedural framework. The Scanlon criterion: an action is wrong if its performance would be disallowed by any set of principles that no one could reasonably reject as a basis for general agreement. Distinct from universalizability in detail (asks for non-rejectability rather than universal-willability) but same procedural-formal shape. The Good Place TV show is centered on Scanlon."
    quote: "[Tier-3 deepening — Scanlon 1998: the WWOTEO contractualist criterion replaces utilitarian welfare-aggregation with a procedural test — would any reasonable person reject this principle as a basis for general agreement? This privileges no individual's preferences; it requires the principle to be justifiable to each affected person on grounds they could not reasonably reject. The criterion preserves Kant's formal-procedural shape while answering specific Kantian difficulties (the rigorism objection, the empty-formalism objection).]"
  - source: primary
    text: scanlon-1998-what-we-owe-to-each-other
    citation: "T. M. Scanlon, *What We Owe to Each Other* (Harvard University Press/Belknap Press, 1998). Scanlon's book develops contractualism: thinking about right and wrong is, most fundamentally, thinking about what could be justified to others on grounds that they, if appropriately motivated to find principles for the general regulation of behavior, could not reasonably reject. Scanlon explicitly frames the resulting test as structurally close to Kant's Categorical Imperative — both are procedural-formal tests of a maxim/principle rather than consequentialist calculations — while differing in the unit and direction of the test and in its metaethical grounding: Kant asks whether the individual agent could will the maxim as a universal law of nature, grounded in the autonomy of rational agency; Scanlon asks whether any person the principle affects could reasonably reject it as a basis for general agreement, a test Scanlon himself calls 'avowedly heteronomous' rather than grounded in rational autonomy."
    quote: "[Chapter 4, 'Wrongness and Reasons,' section 3 'A Contractualist Account of Motivation' — the formula itself:] 'It holds that an act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced general agreement.' [Introduction — Scanlon's own comparison to Kant:] 'The account of right and wrong presented in Part II is likely to strike many as a Kantian theory, and the idea that the rightness of an action is determined by whether it would be allowed by principles that no one would reasonably reject does have an obvious similarity to Kant's Categorical Imperative... The result is an account of right and wrong that is, in Kant's terms, avowedly heteronomous.'"
canonical-instances:
  - "the lying-promise test: if my maxim is 'I will make a promise I have no intention of keeping when it serves my interest', can I universalize this? Kant's answer (Groundwork): no — universal acceptance of false-promising would dissolve the practice of promising itself (no one would believe promises). The maxim self-undermines in universalization. This is the canonical contradiction-in-conception case Kant uses"
  - "the no-helping-others test: if my maxim is 'I will never help others in need when not personally affected', can I universalize? Kant's answer: I could conceive of such a world without contradiction (people would die from preventable causes but society would persist), but I could not WILL it as universal law — I will need others' help at some point, and no rational agent could consistently will to be denied that help. Contradiction-in-willing"
  - "the do-unto-others heuristic in practical ethics: 'how would you like it if everyone did that?' is the everyday-Kantian universalizability question, stripped of its philosophical apparatus. The heuristic captures the test even without the metaphysical foundation; works as a moral-intuition-pump in cases where consequentialist calculation would miss something"
  - "the tax-cheating case: my maxim 'I will under-report income when I can get away with it' — universalize: a world where everyone evades taxes when they can. That world cannot fund the public goods that make the tax system valuable in the first place. The maxim self-undermines; tax-paying is a Kantian duty even when the individual contribution makes no measurable difference"
  - "operationally distinct from lex-9wbd3 GHP: GHP judges actions by consequences (aggregate welfare); lex-kfk68 judges actions by formal-procedural test (universalizability). They diverge in cases like: lying to save a life (GHP says lie, Kant famously argues no — universalizing lying-for-good-cause undermines the practice of truthful speech). The substrate hosts both because they encode different moral intuitions; the choice between them is itself a substantive ethical position"
  - "operationally tightly coupled to lex-7mdpd humanity-as-end-never-merely-as-means: Kant's second formulation of the CI is widely held to be substantively equivalent to the first (universalizability); both flow from autonomy of rational agents (lex-d6vbs). lex-kfk68 is the formal test; lex-7mdpd is the substantive content test. They co-fire in canonical Kantian deliberation"
  - "the transferable engineering use: when designing a policy or proposed action, run the universalizability test as a check on whether the policy is exploitative — does it depend on the affected being a minority that can be coerced while a majority benefits from the practice? If yes, the policy probably fails the Kantian test even if it passes GHP. Particularly useful for catching free-rider, exploitation, and unequal-treatment failure modes"
  - "the false-consciousness counter-failure-mode: just because YOUR maxim could be universalized doesn't mean the OPERATIVE social maxim could be. Honest universalization requires honest specification of what the maxim is (typically more morally-loaded than the agent's gloss). The Kantian discipline is to give the maxim a full and honest specification before running the test — discovering hidden exploitations is half the test's value"
critical-questions:
  - "is the universalizability test empty? Hegel's classic objection (1820 *Philosophy of Right*): the CI is purely formal; any consistent maxim can be universalized (e.g., 'always rob the rich' is universalizable). Kant's defenders reply that not every consistent description IS the maxim; the agent must give it an honest specification (including the means + motive), under which exploitation maxims do fail universalization. The objection survives in weakened form: specifying the maxim correctly is harder than Kant lets on, and the test is sensitive to that specification"
  - "the murderer-at-the-door objection (Constant 1797): if a would-be killer asks where your friend is, Kant says you may not lie — because lying-when-convenient cannot be universalized. The intuition revolts. Modern Kantians (Korsgaard 1986 'The Right to Lie') argue Kant's strict reading misapplies the test — under the murderer's actual conditions you owe him no truth, since he forfeits the moral-equality presupposition that grounds the prohibition. The deep point: even Kantian morality must respect human dignity above the formal-rule"
  - "is the test relativistic on specification? My maxim 'I will do X-in-circumstances-Y' can be made unique-enough to pass any universalization (only I am in circumstances-Y, so universal-X-in-Y has only me doing it). Standard reply: relevant similarity-classes determine specification; honest universalization includes only morally-relevant features, not idiosyncratic ones. Practical: the test requires good-faith engagement to be useful"
  - "is the categorical-imperative defensible without Kant's metaphysics? Modern Kantians (Korsgaard, Onora O'Neill) defend the test from a thinner constructivist foundation — rational agents necessarily commit to certain principles in virtue of having reason at all, not because of noumenal freedom. Transferable position: the CI as a heuristic for catching exploitation + free-riding survives whether you accept the full Kantian apparatus or just the procedural-test as a useful tool"
status: active
