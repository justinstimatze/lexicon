evokes: [not-all-reinforcement-strengthens-the-structure, kautilya-surpluses-and-strengthening, unreliable-additions-are-a-net-negative-not-neutral, balanced-proportion-is-what-makes-reinforcement-work]
lineage:
  - source: primary
    text: kautilya-arthashastra-four-kinds-of-strengthening-by-insertion
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Battle Arrays and Formations,' 'Surpluses and Strengthening,' {10.5.25-28}."
    quote: "'Strengthening by insertion is of four kinds: -- proper insertion -- addition of surplus chariots, horses and men in the right proportion; improper insertion -- addition of only foot soldiers; unitary insertion -- addition of only chariots or only horses; counter-productive insertion -- addition of unreliable troops.'"
canonical-instances:
  - "A manager with extra budget at year-end hires several junior contractors to help a strained team, without checking whether the team actually needs junior headcount versus a senior specialist or better tooling -- the addition isn't harmful, but it also fails to relieve the actual bottleneck, wasting the resource on the wrong proportion of what the team needed."
  - "A nonprofit facing a burned-out staff brings on several enthusiastic but untrained volunteers to help with a critical, high-stakes program rather than experienced staff, and the resulting mistakes, rework, and extra supervision burden leave the program worse off than if no additional help had been added at all."
critical-questions:
  - "how does a decision-maker reliably assess, in advance, whether a surplus resource is genuinely 'unreliable' for a given structure, versus merely different from what the structure is used to -- could this framework be used to justify excluding useful but unconventional additions out of an overly cautious reading of 'reliability'?"
  - "does the framework assume a level of foresight about a structure's actual balance needs that's often unavailable in practice -- how does someone know the 'right proportion' before trying the addition and observing the result?"
  - "is 'no addition at all' always genuinely better than a counter-productive one, or does declining any reinforcement out of fear of getting the proportion wrong cost more, in situations of real urgency, than accepting an imperfect addition would have?"
