evokes: [visible-compliance-with-a-forced-reconciliation-isnt-resolution, cushing-the-youth-and-his-eagle, the-truce-hands-the-wronged-party-leverage-not-closure, punishment-delivered-at-the-moment-of-total-control]
lineage:
  - source: primary
    text: cushing-youth-and-eagle-wife-stages-reconciliation-then-drops-him
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Youth and His Eagle.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "they implored, and she acquiesced. So, when the youth appeared again at the home of the Eagles, she had found an old, old Eagle dress, many of the feathers in it broken... 'Come with me now, according to the knowledge in which we have instructed you.' ... growing weary in a moment of remembrance of his faithlessness, she caught in her talons the Eagle dress which sustained him and drew it off, bade him farewell forever, and sailed away out of sight in the sky."
canonical-instances:
  - "A business partner, pressured by mutual investors to publicly patch things up with a co-founder who betrayed their trust, agrees to keep working together, then uses their continued access and authority months later to quietly restructure the co-founder out of the company entirely, at a moment when the co-founder has no remaining allies to appeal to."
  - "A family pressures an estranged sibling to reconcile with a relative who wronged them at a holiday gathering, and the wronged sibling appears to comply, only to use their restored position of trust to exclude the other from a later inheritance decision or family matter once the pressure to perform reconciliation has passed and no one is watching closely anymore."
critical-questions:
  - "is it fair to call this a 'staged' reconciliation rather than a genuine one that later curdled -- did the wife plan the betrayal from the moment she acquiesced, or does the story leave open that she meant to forgive him and only changed her mind mid-flight, in the 'moment of remembrance' the text describes?"
  - "does this framework risk teaching people to distrust every pressured reconciliation as secretly hostile, when many forced truces really do lead to genuine repair over time -- what would distinguish a truly repaired relationship from a staged one before the withheld consequence actually arrives?"
  - "the community that pressured the reconciliation never learns what actually happened at the end -- does this pattern only work because the final act occurs somewhere unwitnessed, and what changes about the incentive to stage a fake reconciliation when the eventual outcome is likely to become visible to the same people who applied the pressure?"
status: active
