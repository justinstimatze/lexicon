canonical-instances:
  - "A longtime employee stays at a company well past every visible sign it's declining — shrinking budgets, departing colleagues, canceled projects — and ends up laid off not through any dramatic failure but through a routine restructuring that happens to eliminate exactly their role."
critical-questions:
  - "Is the tortoise's death actually a punishment for the attachment, or is it just bad luck that happened to land on the one creature who stayed — would a tortoise who left have been just as likely to encounter an unrelated hazard somewhere else?"
  - "What makes a signal 'clear' in the moment rather than only clear in hindsight — did the other fish and tortoises have information the one holdout didn't, or did they simply weigh the same information differently?"
