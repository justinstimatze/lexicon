id: lex-uqmd7
name: within-subordinated-group-relations-unrepresented-when-cross-gradient-relations-dominate
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When analyzing intersecting subordinations (gender within race, class within disability), the within-subordinated-group relations get UNREPRESENTED when the dominant cross-gradient absorbs analytical attention. Crenshaw: the unrepresented sub-dynamics are where harm concentrates."
related: [lex-cgqta, lex-6qevt, lex-ymckb, lex-qeg52, lex-y2nej, lex-85bw8, lex-4ydm6, lex-ux9fh, lex-a3tfj, lex-22kep, lex-3ezh8, lex-k8bsd, lex-qg68a, lex-f6g8c, lex-pn8qn, lex-9zjpf, lex-raydk, lex-b6gyc, lex-r7zuy]
scaffolds-from: [lex-3ezh8, lex-85bw8, lex-4ydm6, lex-f6g8c]
evokes: [woolf-chloe-liked-olivia-they-shared-a-laboratory, bechdel-test, the-relation-not-recorded, women-only-via-men-in-fiction, black-women-relations-as-structural-blind-spot, LGBTQ-representation-staircase]
lineage:
  - source: primary
    text: Woolf-1929-ARoomOfOnesOwn
    citation: "Virginia Woolf, *A Room of One's Own* (1929), Ch.5. (acquired ; W11 surveyed phase 2; minted 2026-05-25). Woolf's Ch.5 names the structural absence directly: in mainstream fiction, women appear almost exclusively in relation to men (as wife, mother, daughter, lover, antagonist), almost never in relation to other women (as friend, colleague, sister, rival in non-romantic context). The atom diagnoses the structural mechanism: when a subordinated group's depiction is dominated by cross-gradient relations (relations to the dominant group), within-group relations get systematically squeezed out of representation. The empirical signature: works passing the Bechdel test (two women talking about something other than a man) are statistically rare in canonical literature/film; LGBTQ+ representation followed a similar trajectory (queer characters first appear as side-characters in straight-character-centered stories; queer-only-cast stories come later in the representational trajectory). Cross-attested in Wells 1892 (Black women's relations to each other unrepresented; the dominant attention is on cross-racial cases involving white women) and Cooper 1892 (Black women's relations to each other unrepresented in mainstream feminist discourse)."
    quote: "[Woolf 1929 Ch.5:] 'I tried to remember any case in the course of my reading where two women are represented as friends. There is an attempt at it in Diana of the Crossways. They are confidantes, of course, in Racine and the Greek tragedies. They are now and then mothers and daughters. But almost without exception they are shown in their relation to men. It was strange to think that all the great women of fiction were, until Jane Austen's day, not only seen by the other sex, but seen only in relation to the other sex. And how small a part of a woman's life is that... So much has been left out, unattempted... \"Chloe liked Olivia,\" I read. And then it struck me how immense a change was there. Chloe liked Olivia perhaps for the first time in literature. Cleopatra did not like Octavia. And how completely Antony and Cleopatra would have been altered had she done so!' [Practitioner-extraction: when subordinated-group depiction is dominated by cross-gradient relations, within-group relations are systematically un-represented; the absence is structural, not coincidental.]"
  - source: practitioner
    text: cross-domain-within-group-representation-attestation
    citation: "Cross-domain attestation: (a) Bechdel test (Alison Bechdel, *Dykes to Watch Out For* 1985 comic strip 'The Rule'): does the work have (i) two women, (ii) talking to each other, (iii) about something other than a man? The test's discriminatory power IS the empirical attestation of W11 — a large fraction of canonical film/literature fails one or more criteria. The test went viral precisely because the absence had been invisible until named. (b) Ida B. Wells 1892 *Southern Horrors*: Black women's relations to each other are structurally absent from mainstream press coverage of racial violence; the dominant focus is on cross-racial incidents involving white women. Wells records cases (Mrs. Camphor, Maggie Reese, Pat Hanifan's victim, the unnamed drug-store victim) where Black women's victimization receives zero or minimal coverage. The within-group structural realities (Black women's labor, mutual support, social networks) are off-screen. (c) Anna Julia Cooper 1892 *A Voice from the South*: Black women's relations within the Black community + Black women's relations within the women's-rights movement are both structurally underrepresented; mainstream feminism centers white-women's-relation-to-men, mainstream Black activism centers Black-men's-relation-to-whites. (d) LGBTQ+ representation trajectory: queer characters first appear as side-characters in straight-character-centered stories (e.g., *Will & Grace* Will-as-Grace's-friend; queer-relation-to-straight-protagonist dominates); queer-only-cast stories (*The L Word*, *Pose*, *Heartstopper*) come decades later in the representational trajectory. The same pattern: cross-gradient relations dominate first; within-group relations come later. (e) Race-relations in U.S. cinema: Black-Black relations underrepresented through ~1970s in mainstream cinema; Black-white relations dominated representation. The Civil Rights generation's work to fund/produce Black-cast films (Spike Lee, Julie Dash, et al.) is the explicit move to surface within-group relations. (f) Workplace-fiction: blue-collar relationships among workers underrepresented vs blue-collar-to-white-collar relationships in mainstream prestige TV/film. The transferable form: wherever a subordinated group's depiction is dominated by cross-gradient relations, within-group relations are systematically unrepresented, and the absence is structural rather than reflecting actual within-group relational scarcity."
    quote: "Transferable scope: applies to ANY subordinated-group representational context. Operational diagnostic: count the within-group vs cross-gradient relations represented; if the ratio is dramatically skewed toward cross-gradient, the structural-suppression is operating. Predictive form: as a subordinated group gains representational autonomy (their own production capacity, distribution channels, authorial voices), the within-group representation increases — the historical trajectory (women's fiction post-Austen, Black-cast cinema post-Spike-Lee, LGBTQ media post-2000s) confirms the prediction. The atom does NOT claim that within-group relations are quantitatively more important than cross-group relations; it claims that the representational ratio is structurally distorted toward cross-gradient depiction in dominant-controlled media. Diagnostically aligned to lex-85bw8 pretext-narrative-conceals-actual-function: the dominant explanation for the cross-gradient bias ('that's just what the audience wants', 'those are the dramatic relationships') is itself a pretext-narrative for the structural absence. [synthesis 2026-05-25]"
canonical-instances:
  - "Woolf 1929 Ch.5 (canonical-case): Mary Carmichael's 'Chloe liked Olivia. They shared a laboratory.' Woolf marks this as 'perhaps for the first time in literature' — the within-group relation centered without cross-gradient mediation. The absence-up-to-that-point is the structural fact."
  - "Bechdel test 1985: (i) two women, (ii) talking to each other, (iii) about something other than a man. The test's discriminatory power — large fractions of canonical film/literature fail — is the empirical attestation. The test surfaced an absence that had been invisible until articulated."
  - "Ida B. Wells 1892 *Southern Horrors* — Black women's relations to each other unrepresented in mainstream coverage of racial violence; the dominant focus is on cross-racial incidents involving white women. Wells's reporting itself partially fills this gap, but her ability to do so was bounded by the structural conditions her reporting documents."
  - "Anna Julia Cooper 1892 *A Voice from the South* — Black women's structural position requires DOUBLE within-group attention: their relations to each other within the Black community + their relations to each other within the women's-rights movement. Cooper's diagnostic is that both relational layers are structurally underrepresented."
  - "LGBTQ+ representation trajectory in U.S. media: queer-relation-to-straight-protagonist dominated representation through ~2000; queer-only-cast stories came later (*The L Word* 2004, *Pose* 2018, *Heartstopper* 2022). The trajectory is the empirical signal — the within-group representation was structurally suppressed during the dominant-controlled-media period."
  - "Race-relations in U.S. cinema: Black-Black relations underrepresented through ~1970s in mainstream cinema; the Black-cast films of the 1990s onwards (Spike Lee, Julie Dash, contemporary Black auteur cinema) are the explicit surfacing of the previously-suppressed within-group relations."
  - "Workplace-fiction trajectory: blue-collar relationships among workers vs blue-collar-to-white-collar relationships — the latter dominates mainstream prestige TV/film. The structural-suppression of within-class relations is evident in genre-comparison."
  - "operationally adjacent to lex-qeg52 symbolic-overrepresentation-correlates-with-structural-underrepresentation: 0301 names the SYMBOLIC-POLITICAL discrepancy (group symbolically central in representation, structurally excluded from power); 0308 names the REPRESENTATIONAL distortion (when the group IS depicted, within-group relations get squeezed). They compose — 0301 explains WHY the group gets symbolic centrality; 0308 explains WHAT FORM the centrality takes (cross-gradient relations get represented; within-group ones don't)."
  - "operationally distinct from lex-ymckb subordinated-group-as-magnifying-mirror-for-dominant-self: 0293 names the FUNCTION of subordinated group as ego-substrate; 0308 names the REPRESENTATIONAL TRACE of that function in cultural production. 0293 is at the relational layer; 0308 is at the depictive layer. They compose tightly — the magnifying-mirror function (0293) requires cross-gradient framing (0308) to be operative in cultural artifacts."
  - "operationally distinct from lex-6qevt (feminist-theory atom): need separate distinctness audit. (Distinctness flag for mint.)"
critical-questions:
  - "is the within-group representation actually scarcer, or is it just less salient to the dominant audience? Discriminator: count within-group representations in artifacts produced by the subordinated group itself (post-autonomous-production) vs dominant-controlled production of the same era. If the within-group ratio is dramatically higher in autonomous production, the structural-suppression is confirmed; if it's similar, the atom doesn't fire as strongly."
  - "does the atom predict trajectories of representational change? Yes. The atom predicts: as a subordinated group gains representational autonomy (production capacity, distribution channels, authorial voices), within-group representation increases. Empirical confirmations: women's fiction post-Austen, Black-cast cinema post-1970s, LGBTQ media post-2000s. The trajectory is the empirical signal of the prediction."
  - "what is the role of audience-expectation in maintaining the suppression? The dominant-audience-expectation argument ('that's what the audience wants') is part of the suppression-mechanism, not an independent justification for it. Audience-expectations were shaped by prior dominant-controlled representation; the appeal to expectation is circular. Diagnostic: when within-group productions reach mainstream audiences, do they succeed? Empirical answer is often yes (e.g., *Hidden Figures*, *Pose*, *The Heart of the Lonely Hunter*), suggesting the expectation-justification is post-hoc."
  - "is the atom compatible with cases where within-group relations ARE genuinely scarce or fraught? Yes. Cases of subordinated-group internal-fracture (e.g., the Lesbian-vs-Trans tension in some 21st-century feminist movements; intra-Black political disagreements) are real and worth representing; the atom doesn't claim within-group representation must be harmonious. It claims that the depictive ratio should reflect the actual relational structure, not be distorted by dominant-controlled production."
  - "does the atom apply outside identity-based subordination? Yes. The structural mechanism — when a group's depiction is dominated by cross-gradient relations, within-group relations are squeezed out — applies to professional subordination (line-workers represented mostly as supplicants-to-management), national subordination (postcolonial subjects represented mostly via colonial-encounter), age-subordination (children represented mostly via adult-mediation), and more. The transferable form generalizes."
