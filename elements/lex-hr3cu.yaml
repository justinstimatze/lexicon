canonical-instances:
  - "interwar Britain's delegated-legislation debate (Hayek's own illustrating case, citing the 1932 Donoughmore Committee report): Parliament had already resorted to `wholesale and indiscriminate delegation` of rule-making power to administrative boards, not because the detail was too technical for debate, but because economic-planning decisions involve arbitrating incompatible interests that no formal rule can settle in advance — the corrosion of rule-bound legislation Hayek traces begins here, well before any dictatorship is on the horizon"
  - "the wartime and postwar `economic dictator` demand Hayek describes: when a democratic assembly cannot agree on one unified plan across divergent interests, `stronger and stronger demands that the government or some single individual should be given powers to act on their own responsibility` emerge — not from a coup, but from the structural incapacity of majority-rule bodies to arbitrate a comprehensive plan clause by clause"
  - "regulatory or administrative bodies granted broad discretionary mandates (`act in the public interest,` `promote stability`) rather than fixed rules: because the mandate requires ongoing case-by-case arbitration of whose interests are served, the resulting authority accumulates power that a single election cannot retract or meaningfully redirect — Hayek's `not the source but the limitation of power` point applied to standing administrative discretion"
  - "wartime economic-controls apparatus (rationing boards, price-control agencies, production boards) created to arbitrate scarce-resource allocation: once the discretionary machinery exists and interests have organized around it, it resists full peacetime dismantlement even after the emergency that justified it has passed — a concrete instance of Hayek's point that this kind of delegation, once made, is not readily reversible"
  - "operationally distinct from lex-58ynk knowledge-of-particular-circumstances-resists-centralization (Hayek's own 1945 Use of Knowledge in Society): lex-58ynk is an EPISTEMIC claim — central planning degrades decision QUALITY because the pivotal knowledge of particular circumstances can't be aggregated to a planner, even a benevolent and fully competent one. lex-hr3cu is a POLITICAL/COERCIVE claim — central planning concentrates discretionary POWER that erodes the rule of law and is not self-limiting, independent of whether the planner has perfect information. A hypothetical omniscient central planner with complete knowledge of every particular circumstance (curing lex-58ynk's failure mode entirely) would still face lex-hr3cu's problem: it must choose whose competing ends to prioritize, and that choice is an act of coercive discretion, not an informational shortfall. The two atoms are Hayek's two distinct arguments against comprehensive planning, from two different works six years apart, and each fails independently of the other"
  - "operationally adjacent to lex-kj6tj democratic-consent-sustains-rather-than-constrains-soft-administrative-tutelage (Tocqueville, explicitly invoked inside Hayek's own book): lex-kj6tj names a SOFT, consent-sustained erosion of agency — a benevolent tutelary power that `enervates` rather than tyrannizes, accepted because citizens elected their own guardians. lex-hr3cu names a more explicit, COERCIVE trajectory — planning's discretionary power tending toward `plebiscitarian dictatorship,` arbitrary rule that may remain fully legal while ceasing to be law-bound, with totalitarian control as the limiting case. lex-hr3cu grounds Hayek's own primary thesis directly, rather than treating it as a citation inside Tocqueville's lineage; the two atoms compose as the soft (consent-sustained enervation) and hard (coercive, power-concentrating) ends of the same democratic-erosion spectrum"
critical-questions:
  - "is the proposed intervention actually bounded and rule-governed (a fixed tax rate, a safety standard applied uniformly) or does it require an ongoing authority to arbitrate open-ended, case-by-case tradeoffs among people's competing ends? Only the latter triggers this atom — Hayek explicitly distinguishes delegating general rule-making (safely decentralized) from delegating discretionary case-by-case judgment (not boundable once granted)"
  - "is the check on this power ELECTORAL ONLY — citizens can periodically choose who holds it, but nothing limits WHAT the power can do once granted? If so, the atom's core claim applies regardless of how genuinely democratic the selection process is"
  - "is 'temporary' or 'emergency' framing being used to justify open-ended discretion with no built-in sunset or reversal mechanism? Hayek's own illustrating case (interwar Britain's 'wholesale and indiscriminate' delegated legislation) shows how delegations framed as temporary and technical become permanent once organized interests depend on the resulting apparatus"
  - "who decides the tie-break when the plan's goals conflict — whose need is sacrificed for whose — and by what standing rule, rather than by whose judgment? If the answer is 'the planners will decide case by case, guided by expertise or data or the public interest,' that is precisely the arbitrary-power condition this atom names, regardless of the planners' competence or good faith"
  - "does this critique apply to any government provision of public goods (roads, courts, a currency), or only to comprehensive, ends-arbitrating central direction of an economy or organization? Only the latter — Hayek explicitly distinguishes a rule-bound legal framework, which enables markets and can be safely centralized, from central direction that must continuously decide whose competing ends are served. Conflating the two turns this atom into a blanket anti-government argument it does not license"
