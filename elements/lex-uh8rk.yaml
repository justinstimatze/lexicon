id: lex-uh8rk
name: violence-can-target-a-legal-proceeding-not-the-victim
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an act of violence against a person seems disproportionate to any harm the victim alone caused, check whether the victim's death was instrumental rather than the point — whether the actor's real target was a legally-obligated public proceeding that the killing would trigger. Under censorship, ordinary speech can be suppressed before it reaches an audience, but a criminal trial for a killing that everyone already knows about cannot be suppressed the same way: the state is procedurally bound to hold it, and the record becomes public. Friedrich Adler assassinated Austria's prime minister in 1916 specifically because shouting his political message in the street would have gone unheard under wartime censorship, while a trial for an assassination the whole city already knew about could not be silenced — 'he had had to commit the assassination because that would enable him to publicly explain why he had had to commit it.' Before reading violence as an attack on its named target, check whether the target's death was the payload or merely the ticket to a forum that couldn't otherwise be reached."
related: [lex-924d7, lex-brvau]
evokes: [propaganda-of-the-deed, friedrich-adler, the-trial-is-the-platform, an-uncensorable-forum, forcing-the-hearing-you-cannot-otherwise-get]
lineage:
  - source: primary
    text: sigmund-2017-adler-shots-heard
    citation: "Karl Sigmund, Exact Thinking in Demented Times: The Vienna Circle and the Epic Quest for the Foundations of Science (Basic Books, 2017), chapter 'An Excess of the Mathematical' [chapter title confirmed from the book's table of contents; the passage itself falls under an unlabeled section, cited by chapter]. Adler assassinated Austrian prime minister Count Karl von Stürgkh on October 21, 1916, then insisted at his 1917 trial on full personal responsibility rather than an available insanity defense. Verified verbatim against ebook-convert extraction, clean text."
    quote: "'From the moment he was arrested, Friedrich Adler insisted that he was fully responsible for his act. \"I have not committed this assassination with an unsound mind,\" as he said to the prosecutor and later the judges. His goal had been, so he declared, \"to make people start thinking.\" Had he merely shouted \"Down with absolutism! We want peace!\" he would not have been heard. Censorship would have made sure of that. But his shots had been heard, and therefore his words at the trial would be heard. If it came to a trial, that is.'"
  - source: primary
    text: sigmund-2017-adler-vicious-circle-logic
    citation: "Karl Sigmund, Exact Thinking in Demented Times (Basic Books, 2017), same chapter, describing Adler's opening statement at his 1917 trial."
    quote: "'At his trial, Friedrich Adler was at the top of his form. Straight off, he declared the trial to be unconstitutional. He therefore saw no need to defend his deed. And yet he would do his best to explain its motivation: this, actually, had been the very purpose of the act. He had had to commit the assassination because that would enable him to publicly explain why he had had to commit it. This may sound like a vicious circle, but it actually had its own bizarre logic.'"
canonical-instances:
  - "Adler's trial minutes, reported almost in full and translated into dozens of languages, achieved exactly the reach direct speech could not have under wartime censorship — the Austrian parliament, suspended since the state of emergency that provoked the killing, reconvened within days of his conviction. The forum, not the dead prime minister, was the deliverable."
  - "A hunger-strike or self-immolation staged to force press coverage works on the same instrumental logic in the opposite direction (see lex-e3sk5 bearing-unjust-suffering-publicly): the actor's own body, not a victim, is what compels the otherwise-unreachable audience. Adler's case is the adversarial mirror — the compelled forum is a legal proceeding, and the currency spent to force it is someone else's death rather than the actor's own suffering."
  - "operationally distinct from lex-924d7 forced-diaspora-kills-the-institution-but-multiplies-the-idea: that atom is about persecution's unintended side effect once it has already happened (an institution scatters, ideas spread anyway). This atom is about violence deliberately engineered, in advance, to manufacture a specific procedural opening — the trial — that would not exist without it. lex-924d7 describes an aftermath nobody planned; this describes a plan."
critical-questions:
  - "Does this require a specific procedural feature — a state legally bound to hold and report a public trial — that many regimes simply don't have? Against a state willing to disappear a suspect, execute without trial, or hold proceedings in secret, the same act produces no forum at all. What conditions make the target regime's own legal process exploitable this way?"
  - "How would you distinguish, from the outside, an actor who genuinely wanted the trial-as-platform from one who is rationalizing an act committed for other reasons (rage, revenge, ordinary political calculation) after the fact, once the trial's publicity value becomes obvious in hindsight?"
  - "Does the mechanism still work once press freedom is high enough that direct speech isn't actually censored — does forcing a trial only pay off precisely in the gap between 'this message would be suppressed as speech' and 'this message cannot be suppressed once a crime this visible has occurred'?"
status: active
