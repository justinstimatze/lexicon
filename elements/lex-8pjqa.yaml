id: lex-8pjqa
name: a-credential-verifying-a-category-is-transferable-to-anyone-in-it
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When a credential is designed to verify membership in a broad category -- a description matching name, age, general appearance, height, distinguishing marks -- rather than uniquely identifying one person, check whether it can simply be handed to, or borrowed by, anyone else who also happens to fit that category. Maryland's 'free papers,' required of every free Black resident, described the holder by exactly this kind of coarse physical category. Frederick Douglass names the design flaw directly: 'This device of slaveholding ingenuity... in some measure defeated itself — since more than one man could be found to answer the same general description. Hence many slaves could escape by personating the owner of one set of papers.' Douglass's own escape used a borrowed sailor's 'protection' document that described someone who didn't even closely resemble him -- 'it called for a man much darker than myself' -- and it worked anyway, because the credential was never checking for HIM specifically, only for a plausible match to a category a great many different men could satisfy."
related: [lex-xu94g]
evokes: [free-papers-in-maryland, personating-the-owner-of-one-set-of-papers, a-category-descriptor-is-not-a-unique-identifier, borrowed-credentials]
lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch1-escape-from-slavery
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter I, 'Escape from Slavery.'"
    quote: "“It was the custom in the State of Maryland to require of the free colored people to have what were called free papers. This instrument they were required to renew very often... In these papers the name, age, color, height, and form of the free man were described, together with any scars or other marks upon his person, which could assist in his identification. This device of slaveholding ingenuity, like other devices of wickedness, in some measure defeated itself—since more than one man could be found to answer the same general description. Hence many slaves could escape by personating the owner of one set of papers; and this was often done as follows: A slave nearly or sufficiently answering the description set forth in the papers, would borrow or hire them till he could by their means escape to a free State, and then, by mail or otherwise, return them to the owner.”"
canonical-instances:
  - "Douglass's own escape ran on the same flaw one layer over: he carried a sailor's 'protection' paper, not free papers at all, which 'did not, when in my hands, describe its bearer very accurately. Indeed, it called for a man much darker than myself...' The document was never checked closely enough to notice the mismatch -- the conductor's hurried glance under social and time pressure was satisfied by Douglass's confident performance of the 'free sailor' role the paper only loosely described, not by any actual correspondence between the paper and the man holding it."
  - "Hypothetical: an office building's visitor badge lists only 'contractor, blue uniform, hard hat' rather than a photo ID tied to one specific worker. Any contractor who owns a blue uniform and a hard hat can use any other contractor's badge, because the badge was designed to verify 'a category of person allowed in this building,' not 'this particular person,' and no one checks past the uniform."
critical-questions:
  - "Operationally distinct from lex-xu94g (surface appearance that's cheap to produce detaches from underlying substance): that atom is about signal-cost economics -- a polished surface is cheap to fake relative to the substance it's supposed to indicate, so fraudsters profit by mimicking the surface. This atom is a narrower, structural claim about what the credential was DESIGNED to verify in the first place -- a coarse category rather than a unique individual -- which makes it transferable even with zero fraud or mimicry effort, since the borrower doesn't need to fake anything, only to genuinely belong to the same broad category. Is the design flaw here just an extreme, zero-cost special case of xu94g's cheap-signal decoupling, or does 'verifies a category rather than an individual' deserve its own name, separate from 'cheap to fake'?"
  - "Is broad-category verification always a design flaw, or is it sometimes the deliberate and correct design choice -- e.g., a credential that's only ever meant to prove 'an adult,' 'a licensed driver of some kind,' or 'a member of this union,' where individual-level identification would be unnecessary overhead for the actual risk being managed? What determines when the coarser design is the mistake versus the appropriate scope?"
  - "The system here wasn't only defeated by the categorical-matching flaw -- the actual check performed (the conductor's) was also rushed and confidence-swayed. Does the categorical-credential flaw alone reliably enable this kind of evasion, or does it require a SECOND, independent failure (a hurried or socially-pressured verifier) to actually succeed, meaning a careful checker with time to spare might catch a categorical mismatch that a busy one would miss?"
status: active
severity-tier: info
