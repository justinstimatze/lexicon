id: lex-kqkug
name: an-unrepresentative-example-can-doom-an-otherwise-true-message
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you illustrate a claim with a concrete example the audience can check against their own first-hand experience, verify the example is actually representative of what that audience lives — because if it isn't, the truth of the example won't save the message: audience members will consult their own experience, find a mismatch, and reject the entire document as false, not just the one example. Merton and Lazarsfeld name this the fallacy of misplaced exemplification, with a nod to Whitehead's fallacy of misplaced concreteness: whenever propaganda deals with matters familiar at first-hand to the prospective audience, there is a risk the particular examples chosen will not be considered representative by those who consult their own experience. Their case: a wartime pamphlet on Negro gains under democracy illustrated its point with photographs of prominent Negroes and improved housing — real, true examples — and roughly 40 per cent of a sample of Negro readers discounted the entire pamphlet as untrue because of the gap between their own experience and these examples of progress. Crucially, the truth of the examples does not spare them from producing a boomerang response: the reader consults his own immediate experience, and if it doesn't match the document's examples, he rejects the document wholeheartedly rather than treating the mismatch as one bad example among many good ones. And the damage doesn't stay contained to first-hand readers: boomerang responses diffuse far beyond the people who experience them initially, because a distrustful reader becomes, in discussing the document with others, a source of contagious scepticism that predisposes other potential readers toward the same distrust. Diagnostic move: before finalizing an illustrative example, ask not 'is this true' but 'is this what my actual target audience's own lived experience would lead them to expect' — a true-but-atypical example is a rejection trigger, and the rejection spreads by word of mouth well past whoever first encountered it."
related: [lex-kcvkt]
evokes: [merton-1957, lazarsfeld-and-merton-radio-film-propaganda, fallacy-of-misplaced-exemplification, whitehead-fallacy-of-misplaced-concreteness, contagious-scepticism, truth-of-examples-does-not-spare-them]
lineage:
  - source: primary
    text: merton-lazarsfeld-1957-misplaced-exemplification
    citation: "Robert K. Merton and Paul F. Lazarsfeld, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIV 'Studies in Radio and Film Propaganda,' pp.521-522. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). The OCR splits 'discrepancy' as 'dis-' at the foot of p.521 and 'crepancy' at the top of p.522, with only the running head and printed page number intervening (no footnote); rejoined below as 'discrepancy.'"
    quote: "'Whenever propaganda deals with matters which are familiar at first-hand to the prospective audience, there is the risk that the particular examples chosen will not be considered representative by some in the audience who consult their own experience. The pamphlet dealing with Negroes and the war which we have previously discussed was largely devoted to the social and economic gains of Negroes under American democracy. This theme was exemplified for the most part by photographs of prominent Negroes, of improved housing conditions and the like. Some 40 per cent of a sample of Negroes discounted the entire pamphlet as \"untrue,\" because of the marked discrepancy between their own experience and observations, on the one hand, and these \"examples of progress,\" on the other. It should be noted that the truth of the examples does not spare them from producing a boomerang response. The reader consults his own immediate experience and if this does not correspond to the examples contained in the document, he rejects these wholeheartedly.'"
  - source: primary
    text: merton-lazarsfeld-1957-contagious-scepticism
    citation: "Robert K. Merton and Paul F. Lazarsfeld, Social Theory and Social Structure (1957), same chapter, p.522, immediately following."
    quote: "'Moreover, boomerang responses diffuse far beyond the persons who experience them initially. In discussing the document with others, the distrustful reader becomes, as it were, a source of contagious scepticism. He predisposes other potential readers toward the same distrustful attitude. Thus, content-analysis and response-analysis, which eliminate such bases for boomerang responses, serve an important prophylactic function.'"
canonical-instances:
  - "A company diversity report illustrates progress with photos and profiles of several employees who were promoted to leadership — all true — but most employees in the target audience have personally experienced years of being passed over, so the report is dismissed company-wide as PR spin, and the dismissal spreads through breakroom conversation to employees who never read the report at all."
  - "A city's public-transit ad shows a commuter reaching downtown in fifteen minutes on a rebuilt bus line — a real, filmed rider — but most of the target audience's own daily commutes still take over an hour because of unaddressed bottlenecks elsewhere on the route, so riders conclude the whole campaign is dishonest, and that conclusion circulates among neighbors and coworkers who never saw the ad."
critical-questions:
  - "Is there a way to test whether an example is representative enough before publishing, short of running the same kind of before/after interview study Merton and Lazarsfeld used to discover the 40 percent rejection rate after the fact?"
  - "Does a message have any way to recover once wholesale rejection and contagious scepticism have already spread, or does the fallacy of misplaced exemplification effectively poison the well for any future message from the same source to the same audience?"
status: active
