id: lex-xcb4c
name: emotional-stakes-in-an-unresolved-case-degrade-correct-blame-attribution
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "The assumption that more experience monotonically improves a person's ability to correctly attribute a problem's difficulty (to themselves, or to the field's genuine limits) breaks down under emotional stakes — and it breaks in a specific, patterned way: the person doesn't become neutrally confused, they assign blame, either to themselves or to the other party, as an emotionally resolving but epistemically wrong substitute for the correct, unsatisfying answer 'nobody yet knows how to fix this.' Fox documents both branches from Cornell fourth-year students working long-term, high-responsibility cases they cannot resolve. Self-blame: 'I blame myself, not Mrs. H. [her student-physician declares]. I can't get her to reduce, and I don't know what I'm doing wrong.... The reason I find her so difficult is that I feel if someone else were handling her, he could get the pounds off her.' Other-blame: a second student, facing a comparably unresolved case, reaches the opposite attribution — 'the \"failure\" is his, the first student claims; it's the \"fault\" of the patient and her environment, says the second' — and Fox notes this pattern surfaces specifically as the epithet 'crock' applied to patients whose problems don't respond to treatment: 'The central feature in all these patients we call \"crocks\" is that they threaten our ability as doctors.' What makes this distinct from ordinary scapegoating is what triggers it: not frustration in general, but the SPECIFIC combination of sustained personal accountability for an outcome (this is defined as MY patient, MY responsibility) plus a case that resists resolution despite real effort, which is exactly the condition under which the correct attribution ('the field genuinely doesn't have an answer here yet') is the least emotionally satisfying answer available, because it offers no one to hold responsible and no clear next action. Diagnostic move: when a competent, experienced person facing a genuinely hard, unresolved problem starts assigning blame (to themselves or to whoever else is closest at hand) rather than naming the problem as a field-level limit, check whether the trigger is rising personal accountability for an outcome that resists resolution despite good effort — if so, the blame is doing the emotional work of resolving intolerable uncertainty, and it will not respond to more expertise, because the expertise was never the thing missing."
related: [lex-699cr]
