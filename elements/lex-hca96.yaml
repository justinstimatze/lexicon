lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch13-baptism-resisted
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XIII, 'Vast Changes.'"
    quote: "“Two hundred years ago, the pious Doctor Godwin dared affirm that it was ‘not a sin to baptize a negro,’ and won for him the rite of baptism. It was a small concession to his manhood; but it was strongly resisted by the slaveholders of Jamaica, and Virginia. In this they were logical in their argument, but they were not logical in their object. They saw plainly that to concede the negro’s right to baptism was to receive him into the Christian Church, and make him a brother in Christ; and hence they opposed the first step sternly and bitterly. So long as they could keep him beyond the circle of human brotherhood, they could scourge him to toil, as a beast of burden, with a good Christian conscience, and without reproach. ‘What!’ said they, ‘baptize a negro? preposterous!’ Nevertheless the negro was baptized and admitted to church fellowship.”"
canonical-instances:
  - "The direct textual anchor: Douglass explicitly praises the slaveholders' internal logic while condemning their goal -- 'they were logical in their argument, but they were not logical in their object' -- naming the resistance as a coherent defense of a coherent (if monstrous) purpose, not confusion or overreaction."
  - "Hypothetical: a company that relies on treating gig workers as independent contractors fights fiercely against a proposed policy requiring it to simply call them 'employees' on paperwork, even when the policy carries no accompanying benefits mandate. The resistance is disproportionate to the paperwork's direct cost, because the label itself threatens the classification story that makes the underlying compensation structure defensible to the company and the public."
critical-questions:
  - "How does an observer distinguish resistance driven by threat to moral license from resistance driven by fear that the symbolic concession is really a foot-in-the-door for future material concessions -- Douglass's slaveholders may have feared both at once, and the quote doesn't cleanly separate them."
  - "Does the mechanism require the exploiting party to genuinely hold the moral framework being threatened (real Christian conscience, in this case), or does it work identically for a purely cynical actor who maintains the moral story only for outside audiences rather than personal conscience?"
  - "The concession was eventually granted and exploitation continued for another two centuries under a modified moral cover. Does this mean the mechanism only ever delays rather than actually threatens an exploitative practice -- that the moral framework simply adapts to accommodate the concession rather than collapsing under its contradiction?"
