id: lex-u7aau
name: checklists-are-memory-prosthetics-engineered-around-killer-items
type-in: process
type-out: composition
_tier: atomic
agent-instruction: "When a task is EXPERT-KNOWN in every step but still fails because a step gets skipped under complexity, distraction, or time pressure — not because anyone lacked the knowledge — reach for a checklist, but treat the checklist itself as an artifact that must be ENGINEERED, not merely written down. Gawande's organizing distinction is between two failure modes: IGNORANCE (the knowledge doesn't yet exist) and INEPTITUDE (the knowledge exists but isn't applied consistently) — modern professional failure has shifted from the first toward the second as expertise has expanded past what any one person can reliably hold in mind. A checklist is a designed intervention against INEPTITUDE specifically: a real-time memory-and-attention prosthetic consulted DURING an action sequence at a defined PAUSE POINT, not a rule-set applied afterward to a completed draft. The design discipline (attested through the 1935 B-17 test-pilot checklist, Peter Pronovost's Johns Hopkins ICU central-line checklist, the statewide Michigan Keystone Initiative, Boeing's Daniel Boorman, and the WHO Safe Surgery Checklist) has four cardinal components. FIRST: fix a PAUSE POINT — the specific moment execution must stop and the checklist is actually read, not skipped from memory (before anesthesia, before incision, before the patient leaves the OR; before takeoff, before landing). Without a defined pause point, checklists dissolve into ignored paperwork. SECOND: choose DO-CONFIRM or READ-DO deliberately, not by default. DO-CONFIRM lets the team perform from memory and expertise, then pause to confirm every step was actually done — the right choice when skilled improvisation shouldn't be constrained mid-task. READ-DO has people read each step and perform it in sequence like a recipe — the right choice for a genuine emergency where sequence itself is the hazard. THIRD: keep the list SHORT — five to nine items, roughly the limit of working memory — and select for KILLER ITEMS: the few steps most dangerous to skip and most often actually missed, not a comprehensive inventory of everything correct practice requires. A checklist that tries to spell out every single step turns people's brains off; past about sixty to ninety seconds at a pause point people start shortcutting regardless of list quality, so brevity is what keeps a checklist actually used, not a nice-to-have. Checklists also come in two complementary forms that shouldn't be collapsed into one: TASK checklists (simple forcing functions for the stupid-but-critical steps) and COMMUNICATION checklists (ensuring the team talks through the unexpected — names known, plans stated, concerns raised — for the residual complexity no task-list can pre-specify). FOURTH: TEST AND REFINE IN THE FIELD. First drafts always fail in practice; a checklist becomes reliable only through iterative field-testing, timing, and revision. Operationally distinct from lex-hsnup self-critique-against-explicit-rule-set-then-revise: lex-hsnup's loop is generate a candidate output → critique the COMPLETED draft against explicit rules → REVISE the draft, iterating over an artifact (an essay, code, a training run) that persists across cycles. A checklist in Gawande's sense is not iteratively revising a draft — it is a single real-time pass, consulted once per pause point, over an action sequence happening NOW; when a check fails, the correction is 'do the missed step, right now,' not 'redraft the whole thing.' lex-hsnup itself notes surgical checklists only as a one-pass 'related cousin' in a single illustrative bullet; it does not develop DO-CONFIRM/READ-DO, killer-item selection, the five-to-nine-item limit, or field-testing discipline at all — this atom is the primary grounding of what that one-pass artifact actually requires to work. Operationally distinct from lex-jbegr phronesis-practical-wisdom-in-particulars: lex-jbegr is the philosophical question of WHEN rule-following suffices and when irreducible judgment-in-particulars is required instead, and already cites Gawande's book for exactly that boundary-question framing ('can a checklist + lookup-table reproduce the expert's performance?'). This atom does not re-litigate that boundary; it assumes a domain has already been judged checklist-tractable and asks the downstream ENGINEERING question — given that a checklist is the right tool, what specific design choices make one checklist actually catch errors while another gets ignored or becomes a hazard itself. The two atoms compose: phronesis draws the boundary of what's checklist-tractable; this atom is the craft of building the checklist once inside that boundary. Use this atom when: (i) designing any recurring, safety-relevant, or high-complexity procedure where skilled people occasionally skip a known-critical step under load; (ii) auditing an existing checklist that isn't working — check first whether it's too long, too vague, missing a defined pause point, or using the wrong DO-CONFIRM/READ-DO form; (iii) resisting the urge to make a checklist comprehensive — comprehensiveness is the failure mode, not the goal; (iv) building any new checklist — budget for a field-testing-and-revision cycle from the start, not as an afterthought."
