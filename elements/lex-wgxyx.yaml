id: lex-wgxyx
name: a-radial-categorys-center-is-whichever-member-overlaps-with-all-the-rest
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a set of related concepts forms a radial category and you need to identify which one is actually central, don't default to whichever member feels most familiar or gets invoked most often -- check which member shares an entailment with every other member in the set. Eve Sweetser's analysis of Judeo-Christian metaphors for God, as Lakoff reports it: the list includes God as father, king, male lover, shepherd, vineyard-keeper, watchman, potter, glassblower, smith, and helmsman. God-As-Father turns out to be the center because it's the only metaphor that overlaps with every other one: it shares authority with king, nurturance and mutual love with lover, protectiveness with shepherd and watchman, and a causal, life-giving relationship with vineyard-keeper, potter, glassblower, and smith. No other single metaphor in the list connects to as many of the others. Being central here is a structural property you can actually check, not a judgment call about which metaphor feels most important. Diagnostic move: to find a radial category's center among candidate members, map out which entailments each member shares with which others, and look for the member with the broadest overlap -- that member is the center whether or not it's the one people would name first if asked."
related: []
evokes: [george-lakoff, moral-politics-1996, eve-sweetser, radial-category, god-as-father]
lineage:
  - source: primary
    text: lakoff-1996-god-as-father-radial-center
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 14 'Two Models of Christianity,' citing Eve Sweetser's then-unpublished work on metaphors for God. The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“As Sweetser (in a work in preparation) points out, this collection of metaphors for God forms a radial category, with God As Father at the center. The God As Father metaphor is the only metaphor that overlaps in one way or another with each of the other metaphors.”"
canonical-instances:
  - "The direct textual anchor, on the actual overlap map that establishes centrality: 'The father and king metaphors both attribute authority to God... The father and lover metaphors both attribute nurturance to God... The father, king, shepherd, and watchman metaphors all attribute protectiveness to God... The father, vineyard-keeper, potter, glassblower, and smith metaphors all attribute to God a causal ontological relationship: bringing people into being... The father, lover, and choice metaphors all see the relationship as between two volitional beings.'"
  - "Hypothetical: a design team has accumulated six different internal metaphors for their product over the years -- a toolbox, a canvas, a stage, a workshop, a playground, a laboratory. Trying to settle which one is 'really' central, a researcher maps which entailments each metaphor shares with the others rather than polling which one people say first. Toolbox and workshop are both about purposeful task-completion. Canvas and stage both put something on display for an audience. Laboratory and workshop both involve hands-on tinkering. Playground turns out to overlap with every other metaphor on at least one point -- freedom-of-use with canvas, tinkering with laboratory and workshop, an audience-facing quality with stage -- making it the structural center even though no one on the team would have named it first."
critical-questions:
  - "This test picks the member with the broadest overlap in the set as given, but that result depends entirely on which members got included in the first place. Add or remove one metaphor from Sweetser's list and a different member could end up on top. Is 'centrality' by this test a genuine property of the concept itself, or an artifact of which comparison set happened to get assembled?"
  - "The test as stated only requires sharing at least one entailment with each other member, not sharing the same entailment or sharing it as strongly. Should a metaphor that overlaps with every other member on one thin point each count as more central than a metaphor that overlaps deeply with most, but not quite all, of the others? The overlap-counting method doesn't obviously weight depth of overlap against breadth of overlap."
