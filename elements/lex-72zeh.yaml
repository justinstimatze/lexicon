id: lex-72zeh
name: an-unauthorized-custom-survives-only-until-someone-defies-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A discriminatory custom that no one can trace to any actual living order or authority survives purely because no one has tested it -- defying it directly, rather than petitioning to have it formally revoked, is often enough to end it, because there is no real authority behind it to enforce continued compliance. When police at Lincoln's 1865 inaugural reception turned Douglass away for his color, he refused to leave and had his presence announced directly to Lincoln, who welcomed him in immediately. Douglass discovered afterward there had been no such order at all: 'It came out that the officers at the White House had received no orders from Mr. Lincoln, or from any one else. They were simply complying with an old custom, the outgrowth of slavery, as dogs will sometimes rub their necks, long after their collars are removed, thinking they are still there.' He draws the general lesson directly: 'I have found in my experience that the way to break down an unreasonable custom, is to contradict it in practice.' Negotiating entry on unequal terms as a strategic wedge looks different from this: that route accepts a narrower door as a first step toward a wider one. Here Douglass accepts no door at all -- he simply proceeds as though the custom doesn't bind him, forcing whoever enforces it to either produce a real order or step aside."
