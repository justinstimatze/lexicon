lineage:
  - source: primary
    text: eastman-girl-married-star-sisters-choose-by-brightness
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twenty-Third Evening: The Girl Who Married the Star.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'I choose that brightest Star for my husband!' ... 'And I,' declared her sister, 'choose for my husband that little twinkling Star!' ... The husband of the elder sister who had chosen the bright star was an old warrior with a shining name, but the husband of the younger girl was a fine-looking young man, who had as yet no great reputation."
canonical-instances:
  - "A job seeker chooses the famous, prestigious firm over a small unknown startup specifically because of its name recognition, only to find themselves buried under an entrenched hierarchy of long-tenured seniors, while a peer who took the unglamorous startup offer ends up working directly with founders who are young, current, and still building their reputations."
  - "An investor puts money into the most talked-about, highest-profile fund manager on the assumption that visible fame signals skill, when the fame actually tracks a long career of past returns rather than current form, while an obscure, newly launched fund run by someone with no reputation yet is quietly outperforming precisely because they have everything left to prove."
critical-questions:
  - "was the elder sister's outcome actually bad -- a warrior with 'a shining name' could be a perfectly good husband, so is this pattern really about inverted quality, or just about the chooser's own unstated preference for youth and freshness over established standing?"
  - "does the prestige signal ever correctly predict the quality being selected for, and if so, how does a chooser tell in advance whether they're facing a case where brightness misleads versus a case where it's actually informative?"
  - "the story never tells us whether the elder sister was happy with her old, famous husband -- does this pattern only look like a warning in hindsight, once the story has already decided which outcome (the young husband) was better?"
