id: lex-2vpet
name: a-category-can-be-held-together-by-crisscrossing-similarities-rather-than-a-shared-essence
type-in: structure
type-out: composition
_tier: atomic
agent-instruction: "When a category is challenged with the demand to produce its DEFINING ESSENCE (the single property or set of properties shared by all and only its members), and the demand cannot be met, the category is not necessarily defective; it may be held together by FAMILY RESEMBLANCE — a complicated network of similarities overlapping and criss-crossing where no single feature runs through the whole category but many features overlap pairwise + cluster across regions of the category. Membership is not contingent on possession of any specific feature. Wittgenstein's transferable contribution (*Philosophical Investigations* §§65-67): the question `what is common to all games?` admits no single answer (board-games, card-games, ball-games, athletic games, ring-a-ring-a-roses, patience all have overlapping but no universally-shared features); rather, `we see a complicated network of similarities overlapping and criss-crossing: sometimes overall similarities, sometimes similarities of detail`; the holding-together is best characterized as `family resemblances`: as with members of a family — `build, features, colour of eyes, gait, temperament, etc. etc. overlap and criss-cross`; and `the strength of the thread does not reside in the fact that some one fibre runs through its whole length, but in the overlapping of many fibres`. Two operational moves the structure encodes: (a) ABSENCE OF DEFINING ESSENCE IS NOT EVIDENCE OF CATEGORY-FAILURE — the category can be perfectly serviceable for practical use, theoretical analysis, and extension to new cases without admitting an essentialist definition; (b) EXTENSION TO NEW CASES PROCEEDS BY DIRECT RESEMBLANCE TO EXISTING MEMBERS rather than by checking against a fixed defining set — `we extend our concept of number as in spinning a thread we twist fibre on fibre.` Transferable applications: (a) natural language categories (Wittgenstein's home case — `game`, `language`, `number`; later applied widely in lexical semantics and prototype theory); (b) prototype theory + cognitive psychology (Rosch 1973 *Natural Categories* + Rosch-Mervis 1975 *Family Resemblances*: experimental evidence that human categorization works by graded membership around prototypes, with family-resemblance structure; later Lakoff 1987 *Women, Fire, and Dangerous Things*); (c) biological species + the species problem (the long debate on what holds a biological species together — interbreeding, common ancestry, ecological niche, morphological resemblance — has been productively reframed as a family-resemblance question; cf Sokal-Sneath 1963 polythetic classification); (d) software type systems + duck typing (a `duck-typed` class is a family-resemblance category — membership by sufficient-overlap-of-methods rather than by shared parent class; Go's structural-interface satisfaction is family-resemblance at the type-system layer); (e) AI category extension + few-shot learning (large language models extend categories to new instances by similarity-to-existing-instances rather than by essence-check; the family-resemblance structure is the implicit operational logic; tension with hard-classification benchmarks); (f) psychiatric diagnosis (DSM-style polythetic diagnostic criteria — 5-of-9 symptoms required, no symptom necessary — operationalize family-resemblance explicitly; criticism that this produces heterogeneous categories runs the structural argument back); (g) political identity categories (`conservative,` `liberal,` `progressive` — no single position is shared by all members; the holding-together is family-resemblance, which is what makes them resist simple-defining-test challenges); (h) art genres + literary categories (`romanticism`, `magical realism`, `noir` — the genre is held together by overlapping features without essence; the ongoing debate over genre definition runs the family-resemblance structure). Distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (Mendeleev): Mendeleev's primitive is that gaps in a classification predict yet-undiscovered entities; family-resemblance is about HOW the classification is held together when there is no single defining property. They compose: a family-resemblance category can still have predictive gaps (positions in the network of similarities where no actual instance has yet appeared), but the gaps are over similarity-clusters not over defining-property combinations. Distinct from lex-sxt57 stipulative-mark-set-bypasses-essentialist-dispute-on-contested-category: stipulative-marks-set names a class whose membership is FIXED BY STIPULATION (the marks set); family-resemblance names a class whose membership is held together by OVERLAPPING SIMILARITIES without explicit stipulation. They compose: a stipulated category can incidentally have family-resemblance structure, but stipulation forecloses the open-extension property; family-resemblance categories are open to extension by direct resemblance to existing members. Distinct from lex-wtkuz operational-vs-descriptive: lex-wtkuz is about the distinction between what-to-do and what-is at the level of CLAIM REGISTER; family-resemblance is about the STRUCTURE of categories within either register. They compose. Distinct from lex-8n237 under-determined-rule-admits-multiple-legitimation-methods (Cardozo): Cardozo's primitive is that an under-determined rule admits multiple application-routes; family-resemblance is about category-structure rather than rule-application. They can compose: a family-resemblance category that appears in a rule is one source of under-determination Cardozo addresses. Distinct from lex-eg9zm parallel + lex-da3g3 iteration: these are composition operations; family-resemblance is a structural pattern of how a class is held together. Distinct from lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature (Darwin/Ekman/Brown): emotional expression is a specific family-resemblance category at the cross-cultural level but the atom is about a different substantive claim; they compose, do not overlap. Use when: (i) a category is being challenged with an essentialist-definition demand and the demand cannot be met but the category remains useful (`give me a single property all games share` — the structural answer is family-resemblance, not category-collapse); (ii) software architecture is being designed around `duck-typing` or `structural interface satisfaction` and the question is how to reason about the resulting category; (iii) DSM-style polythetic categories or prototype-based categorization is being analyzed; (iv) AI category-extension behavior is being assessed for whether it operates by essence-check or by similarity-to-existing-instances; (v) political, artistic, or scientific category-disputes are deadlocked over `the real definition`. Counter-move: name the network of overlapping similarities holding the category together; show that no single property runs through every member; note that membership-by-direct-similarity-to-existing-members is the live extension method. Failure modes: (a) DEMANDING ESSENTIALIST DEFINITION as if its absence falsifies the category (Wittgenstein's whole point is that this demand is misplaced for many useful categories); (b) MISTAKING FAMILY-RESEMBLANCE FOR `ANYTHING GOES` (the category is well-defined by its overlapping-similarity-network even though no single property is shared; arbitrary new cases that don't connect to any existing fibre fail to extend the category); (c) READING WITTGENSTEIN AS DENYING THAT DEFINITIONS EXIST (he is denying that they are required; some categories DO admit essentialist definitions — bachelor as `unmarried man` works fine; family-resemblance applies to categories where essentialism fails); (d) REIFYING `THE FAMILY` (the family-resemblance metaphor is illustrative — the category's members do not literally inherit features from a common source; the structure is overlap-and-criss-cross not descent-from-essence)."
