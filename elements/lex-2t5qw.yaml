id: lex-2t5qw
name: return-on-capital-exceeding-growth-concentrates-wealth-by-default
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When analyzing any economy, firm, endowment, or long-run wealth-holding arrangement, check the relationship between two rates: r, the return on existing capital (profits, dividends, interest, rents), and g, the growth rate of income or output. When r persistently exceeds g, wealth held as capital compounds faster than labor income and total output grow, so wealth concentrates among existing capital-holders as a matter of arithmetic, not conspiracy or policy failure — the more perfectly the capital market functions, the more reliably this holds, since it isn't a market imperfection to be competed away. Don't treat rising wealth concentration as requiring an extra villain (fraud, monopoly, corruption) to explain before r>g arithmetic is checked first — it can be the null hypothesis. Correspondingly, don't treat a low-inequality, r≈g period as the natural resting state of capitalism: historically the norm has been r>g, and one specific low-r/high-g interlude (roughly 1914-1980) was produced by an identifiable, non-repeating shock — capital destroyed by two world wars and the Depression, compressed further by the deliberate postwar policies that followed — not by capitalism naturally maturing past patrimonial dominance. Practical implication: because r>g is not a market failure, market-based fixes (more competition, better information) don't touch it; the structural counter-levers are ones that directly tax or dilute the return on capital (progressive wealth/capital taxation) or that raise g, not appeals to fairness alone."
related: [lex-dqa9j, lex-8mpe8, lex-xuwr2, lex-3u5vn]
evokes: [r-greater-than-g, patrimonial-capitalism, capital-income-ratio, piketty-2014, wealth-concentrates-by-default, the-mid-20th-century-anomaly, inherited-wealth-dominates-earned-wealth, compounding-return-outpaces-growth, fundamental-inequality-of-capitalism, trente-glorieuses-as-historical-exception, progressive-capital-tax-as-structural-counter-lever]
lineage:
  - source: primary
    text: piketty-2014-capital-in-the-twenty-first-century
    citation: "Thomas Piketty, Capital in the Twenty-First Century, trans. Arthur Goldhammer (Cambridge, MA: Belknap Press of Harvard University Press, 2014; French original Le Capital au XXIe siecle, Paris: Editions du Seuil, 2013). Drawing on two centuries of tax, inheritance, and national-accounts data across France, Britain, Germany, and the United States, Piketty argues that the central long-run force shaping the distribution of wealth is the gap between r, the rate of return on capital, and g, the growth rate of the economy. When r exceeds g, wealth accumulated in the past grows mechanically faster than wages and output, so inherited capital comes to dominate capital earned through a lifetime of labor, and wealth concentration rises toward levels seen in nineteenth-century 'patrimonial' Europe. The mid-twentieth-century era of comparatively low capital concentration, Piketty argues, was not capitalism naturally self-correcting but a historical singularity produced by the physical and financial destruction of capital in 1914-1945 and the redistributive policies that followed."
    quote: "[on the r>g inequality and what it implies:] 'This fundamental inequality, which I will write as r > g (where r stands for the average annual rate of return on capital... and g stands for the rate of growth of the economy, that is, the annual increase in income or output), will play a crucial role in this book. In a sense, it sums up the overall logic of my conclusions.' ... 'When the rate of return on capital significantly exceeds the growth rate of the economy... it is almost inevitable that inherited wealth will dominate wealth amassed from a lifetime's labor by a wide margin, and the concentration of capital will attain extremely high levels.' [on r>g not being a market failure:] 'The fundamental r > g inequality... has nothing to do with any market imperfection. Quite the contrary: the more perfect the capital market... the more likely r is to be greater than g.' [on the mid-20th-century compression as historical anomaly, not a natural trend:] 'The fact that Europe... [has] only just gotten over these shocks has given rise to the impression that patrimonial capitalism... is something new, whereas it is in large part a repetition of the past and characteristic of a low-growth environment like the nineteenth century.' [on the compression not being spontaneous:] 'The two world wars, and the public policies that followed from them, played a central role in reducing inequalities in the twentieth century. There was nothing natural or spontaneous about this process, in contrast to the optimistic predictions of Kuznets's theory.'"
  - source: discovery-loop
    text: lexicon-coverage-cli-uncovered-scan
    citation: "The Turchin/Skocpol elite-overproduction and structural-demographic-theory cluster (lex-dqa9j through lex-d56d4) names a population-dynamics mechanism: too many credentialed elite-aspirants competing for too few elite slots, driving intra-elite conflict and counterelite mobilization. Lex-0751 (Rawls's difference principle) is a normative claim about when inequality is just, independent of its cause. This atom is Piketty's positive/empirical mechanism: pure compounding arithmetic (r>g) drives wealth concentration among capital-holders regardless of whether the concentration is just, and regardless of whether an intra-elite population glut exists at all. It is also distinct from lex-3u5vn (the Kelly criterion, expected-log compounding growth): that atom is a decision rule for an individual agent sizing a repeated, reinvested bet, while this atom is a macro/historical claim about capital versus labor income across a whole economy."
canonical-instances:
  - "Belle Epoque France (c. 1870-1914): private wealth stood at six to seven years of national income, inherited wealth accounted for 80-90 percent of all private wealth, and 'Vautrin's lesson' to Rastignac in Balzac's Pere Goriot (invest in marrying inherited wealth, not in a career) was arithmetically correct advice under prevailing r and g — the canonical patrimonial-capitalism baseline Piketty argues the 21st century is drifting back toward"
  - "the 1914-1945 shocks and the resulting mid-20th-century trough: the European capital/income ratio collapsed from roughly six-to-seven years of national income in 1913 to two-to-three years by 1950, driven only partly by physical war destruction and mostly by inflation, wartime taxation, nationalizations, and asset-price collapse — the low-r/high-g 'Trente Glorieuses' that followed were a one-time catch-up growth spurt on a depleted capital stock, not a repeatable steady state"
  - "the post-1970s reversion: as g fell back toward its historical long-run rate and the destroyed capital stock rebuilt, the capital/income ratio and the share of inherited wealth in total private wealth both climbed back toward Belle-Epoque levels by 2010 — the pattern Piketty reads as patrimonial capitalism reasserting itself once the anomalous conditions of 1914-1980 lifted, not a new phenomenon"
  - "a founder's equity stake in a company versus salaried employees at the same firm: as long as the firm's return on capital exceeds the economy's growth rate, the founder's holding compounds toward dominance over any wage-earned savings the employees could accumulate, independent of whether the employees are equally or more skilled — the mechanism runs on the r-vs-g gap, not on merit or effort differentials"
  - "operationally distinct from lex-dqa9j/lex-8mpe8 (Turchin/Skocpol elite-overproduction and wealth-pump): those atoms explain inequality and elite conflict via a population-dynamics mechanism (too many credentialed aspirants for too few elite slots, structurally squeezing wages while flooding elite ranks); this atom explains wealth concentration via pure compounding arithmetic (r>g) with no reference to elite headcount, credentialing, or aspirant supply at all — a firm with one owner and one employee still concentrates wealth toward the owner whenever r>g, with no elite-overproduction dynamic in play"
  - "operationally distinct from lex-xuwr2 (Rawls difference principle): Rawls asks whether a given inequality is JUST (does it improve the worst-off position relative to the alternative); this atom makes no justice claim at all — it says wealth concentration under r>g is the structural default REGARDLESS of whether it happens to pass or fail the difference-principle test. The two compose: r>g explains why unequal outcomes arise mechanically; the difference principle is a separate, independent test for whether a given r>g-driven outcome is licensed"
  - "operationally distinct from lex-3u5vn (Kelly criterion, compounding maximizes expected log not expected value): that atom is a decision rule for how much of ONE agent's own bankroll to stake each round to maximize long-run growth. This atom is a macro/historical claim about the relationship between TWO different aggregate rates (return to capital as a whole, versus growth of the whole economy) and what that relationship implies for the distribution of wealth ACROSS agents (capital-holders versus labor-income earners) — not a sizing rule for any one agent's bets"
critical-questions:
  - "is r actually persistently above g here, over a run of years or decades, or only briefly (a short-run boom, a single good quarter) that will mean-revert before it compounds into meaningful concentration?"
  - "does the analysis already account for taxation, inflation, or redistribution that could offset a raw r>g gap? Piketty's own account of the mid-20th-century compression turns on exactly these forces suppressing the effective r actually realized by capital-holders — a headline r>g gap before tax/policy adjustment can overstate the concentration that will actually occur"
  - "is the 'wealth' in question genuinely capital that compounds through reinvestment (equity, real estate, financial assets), or is it human capital / labor income, which does not compound the same way and is not subject to this mechanism at all?"
  - "is the growth rate g being compared against the right horizon — a country's or firm's own long-run trend growth, not a temporary catch-up-growth episode (postwar reconstruction, an emerging-market convergence boom) that will predictably slow once the catch-up completes?"
  - "if the goal is to counter r>g-driven concentration, is the proposed remedy actually structural (a return-diluting or return-taxing mechanism, or a growth-raising one) — or is it a moral appeal to fairness that leaves the underlying r>g arithmetic, and therefore the concentration, untouched?"
status: active
