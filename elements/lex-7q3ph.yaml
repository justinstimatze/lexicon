id: lex-7q3ph
name: repertoire-of-action-forms-is-limited-and-shifts-slowly
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When predicting collective action's form, the repertoire-of-action-forms at any moment is small and shifts slowly. Tilly: people don't invent forms; they draw from what's available in their culture's tactical inventory. Predict from the inventory, not from theoretical possibility."
related: [lex-q9asc, lex-dm5te, lex-th6tr, lex-sxt57, lex-dzr6g, lex-d56d4, lex-qhydj, lex-6wha5, lex-2rpxq, lex-r7zuy, lex-mx4q5]
evokes: [the-known-collective-action-forms-of-a-period, charivari-and-serenade-no-longer-deployed, machine-breaking-dropped-out-of-the-repertoire, sit-down-strike-as-1919-1920-innovation, the-protest-march-as-twentieth-century-routine, the-novelty-of-occupy-the-square, christopher-alexander-pattern-language-as-architectural-repertoire, programming-idioms-of-the-language, diplomatic-protocol-as-statecraft-repertoire, genre-as-musical-repertoire, what-actors-actually-know-how-to-do]
lineage:
  - source: primary
    text: tilly-1978-from-mobilization-to-revolution-ch-5-repertoires-of-collective-action
    citation: "Charles Tilly, *From Mobilization to Revolution* (Addison-Wesley 1978). Tilly (Michigan; later Columbia; founder of historical-sociology of contentious politics; 1929-2008) establishes the canonical articulation of the repertoires-of-collective-action framework in Chapter 5 (pp. 151-159). The transferable mechanism: at any point in time, the set of collective-action forms available to a population is 'surprisingly limited' relative to what is technically possible; most groups deploy known forms even when alternative means exist; new forms emerge slowly through innovation; the repertoire shifts over generational time and varies across societies. Tilly contrasts contemporary-American known-forms (demonstration, march, strike, petition, pressure-group formation) with forms common in earlier periods or other societies (charivari, serenade, mutiny-as-grievance-procedure, machine-breaking, intervillage-fight, tax-rebellion, rebellion-as-elected-representative-procedure). The transferable insight: actors choose from what they know how to do, what they have witnessed, and what others recognize as legitimate-or-feasible — not from the abstract space of all-possible-actions. Repertoires shift through innovation events (e.g., 1919-1920 Italian factory-occupation as 'rather a novelty' becoming half-a-million-worker phenomenon), through cross-cultural diffusion, and through generational replacement; but at any moment the repertoire is bounded."
    quote: "[Tilly 1978 Ch.5, the canonical transferable claim, p.151:] 'At any point in time, the repertoire of collective actions available to a population is surprisingly limited. Surprisingly, given the innumerable ways in which people could, in principle, deploy their resources in pursuit of common ends. Surprisingly, given the many ways real groups have pursued their own common ends at one time or another.' [On the canonical contemporary-American repertoire:] 'Most twentieth-century Americans, for example, know how to demonstrate. They know that a group with a claim to make assemblies in a public place, identifies itself and its demands or complaints in a visible way, orients its common action to the persons, properties, or symbols of some other group it is seeking to influence. Within those general rules, most Americans know how to carry on several different forms of demonstration: the massed march, the assembly with speechmaking, the temporary occupation of premises. ... Various forms of demonstration belong to the repertoire of twentieth-century Americans... The repertoire also includes several varieties of strikes, petitioning, the organization of pressure groups, and a few other ways of articulating grievances and demands.' [On the historically-dropped forms:] 'Few Americans, on the other hand, know how to organize the hijacking of an airplane, despite the publicity hijackings have received in recent years; even fewer would seriously consider hijacking as a way of accomplishing their collective objectives. Hijacking belongs to the repertoire of only a few groups anywhere. Machine breaking, once a frequent occurrence, has dropped out of the repertoire. So have the charivari and the serenade. So has the regular intervillage fight; only football remains to remind us of that old form of bloodletting.' [On the rebellion-as-grievance-procedure historical form:] 'Almost no one anywhere is now familiar with a form of action which was once common in Europe: the rebellion in which an existing, functioning group, such as an army or a community assembles, casts off its constituted authorities, commissions that successor (who knows full well that once the action is completed he is likely to be hanged, or worse, for his pains) to present a set of grievances and demands to a higher authority, resists with determination until those demands have been met or until it has been utterly destroyed, then returns to its previous state of submission to the constituted authorities.' [On the transferable specification-question:] 'To specify the meaning of repertoire, it helps to ask this question: to what degree does the group prefer the means it has used before over those which are theoretically available for the same purpose? That is a difficult question to answer in the real world. ... However, two sorts of natural experiments occur often enough to provide information on the subject. First, similar groups in similar settings sometimes use quite different means of collective action. In the 1950s, for example, we find Swedish transport workers taking their grievances to government agencies while their British counterparts go out on strike. Second, the means of collective action alter and spread from one group to another. For instance, in the Italy of 1919 sit-down strikes were rather a novelty. But by August 1920 half a million workers were occupying their factories.' [Practitioner-extraction: Tilly establishes the transferable analytical tool for cataloguing actor-action-possibilities. The mechanism's structural signature: (1) at any time-and-place moment M, the actors in M have access to a bounded set R(M) of action-forms they know-how-to-perform and recognize as legitimate-or-feasible; (2) R(M) is surprisingly small relative to the abstract space of all-possible-actions; (3) actors generally deploy R(M) elements rather than innovating outside R; (4) R(M) shifts across moments through innovation-events, cross-cultural-diffusion, and generational-replacement; (5) the diagnostic for R(M) is empirical observation of actor-behavior plus cross-cultural comparison plus historical comparison. The transferability extends from collective-action (Tilly's domain) to architectural design (Christopher Alexander pattern-languages), programming idioms (language-specific repertoires of common operations), diplomatic protocols, musical genres, cuisine evolution, medical-intervention practices, scientific research-methods, business-strategy frameworks. Engineering implication: any actor-design (individual training, institutional capacity-building, AI agent-design) faces the repertoire-bounding question — what does this actor actually know-how-to-do, and what would expanding the repertoire require?]"
  - source: practitioner
    text: cross-domain-attestation-repertoire-mechanism
    citation: "Cross-domain attestation of the lex-7q3ph mechanism. (a) **Alexander 1977 *A Pattern Language*** (Oxford UP): architectural-design patterns as transferable repertoire — 253 documented patterns from urban-scale through building-scale through construction-detail-scale. Alexander's analytical move parallels Tilly's: at any architectural moment, the available patterns are bounded; designers deploy what they know; pattern-language evolution requires deliberate cultivation. (b) **Lakatos 1970 *Methodology of Scientific Research Programmes***: scientific research-methods as transferable repertoire — research-programmes specify hard-core commitments + protective-belt + positive-heuristic + negative-heuristic; programmes evolve slowly; methodological-innovation is rare. Transferable lex-7q3ph in philosophy-of-science. (c) **Kuhn 1962 *Structure of Scientific Revolutions*** (UChicago Press): normal-science as paradigm-bound puzzle-solving with bounded methodological-repertoire; paradigm-shifts as repertoire-replacement events. Transferable lex-7q3ph at the scientific-paradigm scale. (d) **MacIntyre 1981 *After Virtue*** (Notre Dame): moral-practices as inherited tradition-bound repertoires; modern moral-discourse fragmentation as failure of coherent-repertoire transmission. Transferable lex-7q3ph in moral philosophy. (e) **Bourdieu 1977 *Outline of a Theory of Practice*** (Cambridge UP): habitus as embodied repertoire of dispositional action-tendencies acquired through socialization; habitus shapes what actors can-conceive-of-doing, not just what they choose. Transferable lex-7q3ph with embodied-cognition refinement. (f) **Programming language idioms** (Hunt-Thomas 1999 *The Pragmatic Programmer*; Riehle-Züllighoven 1995 *Understanding and Using Patterns in Software Development*): each programming language has bounded idiomatic-repertoire that experienced practitioners deploy; language-specific patterns are recognizable to other practitioners; innovation in idioms requires deliberate cultivation. Transferable lex-7q3ph at the software-engineering scale. (g) **Diplomatic protocols** (Roberts 1922 *International Law*; subsequent Vienna-Convention regimes): state-craft repertoire of formal-actions (note-verbale, démarche, recall-of-ambassador, severing-relations) with shared inter-state recognition; novel-actions risk uninterpretability and counter-productive responses. Transferable lex-7q3ph at the international-relations scale. (h) **Tilly-Tarrow 2007 *Contentious Politics*** (Paradigm Publishers): contemporary extension of Tilly's framework, documenting repertoire-evolution through 1980s-2000s with social-media-enabled innovations (Twitter-coordinated flash-mobs, hashtag-campaigns, livestream-protest, etc.) as transferable lex-7q3ph in the digital-era."
canonical-instances:
  - "the **Tilly 1978 contemporary-American repertoire** (Ch.5 pp.151-152): demonstration, massed march, assembly with speechmaking, temporary occupation, several varieties of strikes, petitioning, pressure-group organization — bounded set known to twentieth-century Americans."
  - "the **historically-dropped forms** (Tilly 1978 Ch.5): hijacking, mutiny-as-grievance-procedure, machine breaking, charivari, serenade, intervillage fight, tax rebellion, collective self-immolation, lynching, vendetta — once part of some group's repertoire, now rarely deployed in contemporary American context."
  - "the **1919-1920 Italian sit-down-strike innovation event** (Tilly 1978 Ch.5): sit-down strikes as 'rather a novelty' in 1919 Italy becoming half-a-million-worker phenomenon by August 1920. Transferable lex-7q3ph case."
  - "the **rebellion-as-grievance-procedure historical form** (Tilly 1978 Ch.5): Spanish Netherlands armies electing-elected (electo) to demand back-pay; Pilgrimage of Grace 1536. Transferable lex-7q3ph at the pre-modern-European scale; specific form dropped from contemporary repertoires."
  - "the **Alexander 1977 architectural pattern-language** (*A Pattern Language*): 253 patterns from urban-scale through construction-detail-scale; designers deploy what they know; pattern-language evolution requires deliberate cultivation. Transferable lex-7q3ph at the architectural-design scale."
  - "the **Lakatos research-programmes** + **Kuhn paradigms**: scientific research-methods as transferable repertoire bounded by paradigm-commitments; methodological-innovation rare and tied to paradigm-shifts. Transferable lex-7q3ph at the scientific-method scale."
  - "the **Bourdieu 1977 habitus** (*Outline of a Theory of Practice*): embodied dispositional repertoire acquired through socialization; shapes what actors can-conceive-of-doing. Transferable lex-7q3ph with embodied-cognition refinement."
  - "the **programming-language idioms** (Hunt-Thomas 1999; Riehle-Züllighoven 1995): language-specific repertoires of common operations recognizable to other practitioners; idiom-innovation requires deliberate cultivation. Transferable lex-7q3ph at the software-engineering scale."
  - "the **diplomatic-protocols repertoire** (Roberts 1922; Vienna-Convention regimes): state-craft formal-actions with shared inter-state recognition; novel-actions risk uninterpretability. Transferable lex-7q3ph at the international-relations scale."
  - "the **Tilly-Tarrow 2007 digital-era extension** (*Contentious Politics*): social-media-enabled innovations (Twitter-coordinated flash-mobs, hashtag-campaigns, livestream-protest) as transferable lex-7q3ph evolution in the digital era."
  - "operationally distinct from lex-q9asc: lex-q9asc is the technique of running multiple frameworks in parallel. lex-7q3ph is the bounded-action-set within which framework-deployment occurs. lex-q9asc is meta-repertoire technique for expanding effective action-space."
  - "compositional with lex-dm5te: portable-handles are repertoire-elements characteristic of fox-mode operation; lex-7q3ph supplies the broader bounded-set within which handles function."
  - "compositional with lex-th6tr: lex-7q3ph supplies the action-repertoire-bounding dimension; lex-th6tr supplies cognitive-style axes complementary to it."
  - "compositional with lex-sxt57: lex-sxt57 marks operate within lex-7q3ph repertoire — actors stipulate marks from their available bounded-set; novel marks require explicit cultivation."
  - "compositional with lex-dzr6g + lex-d56d4 (Skocpol revolutionary-conjuncture atoms): revolutionary moments are characteristically the moments when lex-7q3ph repertoires undergo rapid innovation-and-replacement; Skocpol's revolutionary-state-crisis is one transferable site of repertoire-innovation."
  - "compositional with lex-qhydj: elite-purposes operate through specific elite-repertoires (legislative-procedure, regulatory-capture, donor-influence) that are distinct from popular-repertoires; lex-7q3ph supplies the dual-repertoire structural observation."
  - "compositional with lex-6wha5 organized-minority (Mosca): Mosca's organized-minority advantage operates partly through superior repertoire-mastery (legislative-procedural, financial-instrument, regulatory) vs. disorganized-majority's narrower repertoire. lex-7q3ph supplies the substrate for Mosca's organizational-asymmetry claim."
  - "compositional with lex-2rpxq: cognitive-style shapes which repertoire-elements actors prefer — hedgehogs deploy unified-system-coherent elements; foxes deploy whatever situational-fit suggests. lex-7q3ph + lex-2rpxq together specify both the bounded-action-set and the actor-disposition selecting within it."
critical-questions:
  - "the empirical-repertoire-cataloguing question: what specific action-forms does this actor (individual, group, institution) actually know-how-to-perform? Test: observe behavior across multiple challenges; ask actor what they would-do-in scenario X. Practitioner-rule: empirical repertoire-cataloguing is the canonical lex-7q3ph diagnostic move; many capability-failures trace to unrecognized repertoire-gaps."
  - "the cross-cultural-comparison test: how does this actor's repertoire compare with similar actors in different cultural-or-historical contexts? Test: identify peer-actors in different settings; catalog their repertoires; identify forms absent from focal-actor's repertoire. Practitioner-rule: cross-cultural comparison reveals lex-7q3ph boundaries that are invisible within a single culture."
  - "the historical-comparison test: what forms were available to earlier-period actors that are dropped from the contemporary repertoire? Test: review historical documentation; identify forms that have dropped out (Tilly's mutiny-as-grievance, charivari, machine-breaking examples). Practitioner-rule: historical comparison reveals the contingency of contemporary repertoires."
  - "the innovation-event diagnostic: under what conditions do repertoire-innovations emerge and diffuse? Test: catalog historical innovation events (Italian sit-down strikes 1919-1920; Civil Rights sit-ins 1960; Twitter-coordinated protests 2010s); assess shared structural conditions. Practitioner-rule: innovation-events require (a) precipitating crisis or opportunity; (b) demonstrative-success of the new form; (c) communication-channel for diffusion; (d) recognition by target as meaningful action."
  - "the repertoire-expansion-design question: how can an actor deliberately expand their repertoire? Test: identify training-modalities (apprenticeship, simulation, exposure-to-other-traditions); assess feasibility for the actor's context. Practitioner-rule: repertoire-expansion is deliberate cultivation; it does not occur passively even when actors are presented with novel forms."
  - "the legitimacy-recognition question: which repertoire-elements does the target-audience recognize as legitimate-or-feasible? Test: assess target-audience's own repertoire-conception; identify elements that would be uninterpretable, illegitimate, or counter-productive. Practitioner-rule: action-effectiveness depends on shared legitimacy-recognition between actor and target; novel actions risk uninterpretability."
  - "the cross-scale translation: lex-7q3ph has been attested at collective-action scale (Tilly 1978; Tilly-Tarrow 2007), architectural-design scale (Alexander 1977), scientific-method scale (Lakatos 1970; Kuhn 1962), moral-practice scale (MacIntyre 1981), embodied-disposition scale (Bourdieu 1977), software-engineering scale (Hunt-Thomas 1999; Riehle-Züllighoven 1995), diplomatic-protocol scale (Roberts 1922 + Vienna-Convention regimes). The transferable claim: any actor-capability domain admits the bounded-repertoire framing as analytical-tool."
