id: lex-ysnpz
name: a-pressured-reconciliation-can-be-staged-to-finish-the-punishment
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When community pressure forces someone to appear to reconcile with a person who wronged them, don't assume the outward compliance means the underlying intent to punish has actually been dropped -- an enforced show of forgiveness can be the exact vehicle used to deliver the real consequence, timed to the moment the wronged party has the most leverage. In Cushing's telling, elder Eagles pressure the betrayed wife to take her unfaithful husband back: 'they implored, and she acquiesced.' But her compliance comes wrapped around its own instrument -- she equips him with a deliberately weakened 'old, old Eagle dress, many of the feathers in it broken,' and escorts him skyward under the appearance of a homeward flight. The reconciliation looks complete right up until the one moment she has full control and he has none: 'growing weary in a moment of remembrance of his faithlessness, she caught in her talons the Eagle dress which sustained him and drew it off, bade him farewell forever.' The community got the outward reconciliation it demanded; she got the ending she'd actually intended, delivered at the one moment there's no possibility of appeal or recovery. Diagnostic move: when someone is pressured by others into visibly reconciling with a person who genuinely wronged them, don't read the visible compliance as proof the underlying grievance has been resolved -- watch for whether the reconciliation puts the wronged party in a position of continued leverage or control, since a forced truce can function as staging for the real settlement rather than as the settlement itself."
