id: lex-8m3gk
name: when-mockery-is-inescapable-turning-it-outward-replaces-seeking-approval
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you discover that people mock you the same way regardless of whether you do good or bad, seeking their approval stops being a strategy worth pursuing, and turning the mockery back outward, laughing at them instead of trying to earn their respect, becomes the move that actually restores your own agency. Iktomi states the pattern plainly before making his choice: 'I have done much good and should be treated as a god, but because my other parent, the Winged God, had no shape, my form is queer and all laughed at me. When I do good all laugh at me as if I were making sport, and since everyone laughs at me I will laugh at them.' His good deeds and his bad ones draw the identical response, which is what tells him the game of earning approval was never winnable. When the supreme deity then condemns him to permanent exile and universal hatred, expecting this to be a punishment, Iktomi doesn't protest or beg reconsideration: he responds 'with a long and loud laugh,' points out that the deity forgot the animals still remain to him, and declares he will 'enjoy himself and make fools of mankind.' The banishment meant as punishment becomes, in his hands, the resource that frees him from needing anyone's approval at all. Diagnostic move: when you notice that your reception from a group doesn't actually track your behavior, that good and bad conduct draw the same mockery, stop treating their approval as a prize still in play, and look for what the group's rejection itself frees you to do that their approval never would have."
