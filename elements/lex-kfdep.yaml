id: lex-kfdep
name: conceptual-metaphors-structure-cognition-invisibly-and-shape-behavior-at-scale
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When a community develops a CONCEPTUAL METAPHOR for an abstract domain (TIME IS MONEY, ARGUMENT IS WAR, LOVE IS A JOURNEY, MIND IS A CONTAINER, NATURE IS A MACHINE), the metaphor stops being experienced as a metaphor and becomes the COGNITIVE FURNITURE of the domain. Reasoning, perception, and behavior toward the domain are then structurally shaped by what the metaphor's source-domain logically entails, without participants noticing that they are reasoning through a metaphor at all. Lakoff & Johnson 1980 *Metaphors We Live By* documented the mechanism with hundreds of cross-domain examples. The transferable claim has two parts. FIRST (cognitive): conceptual metaphors are NOT decorative language but cognitive infrastructure — they govern what inferences feel natural, what questions feel important, what answers feel acceptable. TIME IS MONEY makes 'spend time,' 'save time,' 'waste time' feel literal; it makes time-budgeting feel like a coherent enterprise; it makes the question 'where did the time go?' parse as a value-extraction failure. ARGUMENT IS WAR makes 'defend a position,' 'attack a claim,' 'win the argument' feel literal; it makes adversarial rhetoric feel like the natural mode; it makes 'collaborative argument' feel like a category error. SECOND (population-scale-behavioral): root metaphors at population scale produce behavior patterns that participants do not experience as choices. Lent 2017 Ch.15 documents the specific case: the cluster of CONQUERING NATURE / DOMINION OVER NATURE / NATURE AS MACHINE metaphors that crystallized through Bacon-Descartes-Boyle-Hobbes-Kepler from 1620 onward produced four centuries of extractive practice toward the natural world that participants experienced as natural-and-obvious rather than as a metaphor-driven choice. The metaphors became cognitive infrastructure; the behavior followed; the participants did not experience the behavior as a metaphor-contingent choice because they could no longer see the metaphor as a metaphor. Transferable applications: software-design metaphors (CODE IS BUILDING for waterfall; CODE IS GARDENING for emergent design; CODE IS AN ORGANISM for evolutionary architectures); economy metaphors (ECONOMY IS A MACHINE for Keynesian engineering; ECONOMY IS AN ECOSYSTEM for complex-systems policy; ECONOMY IS A BATTLEFIELD for protectionist nationalism); body-and-health metaphors (BODY IS A MACHINE for biomedical reductionism; BODY IS A GARDEN for naturopathic+integrative medicine); team metaphors (TEAM IS A SPORTS TEAM vs TEAM IS A FAMILY vs TEAM IS A MACHINE); LLM/AI metaphors (MODEL IS A BRAIN vs MODEL IS A FUNCTION vs MODEL IS A LIBRARY vs MODEL IS AN AGENT). The practitioner-discipline is three-part. FIRST: in any cognitive domain you operate in, SURFACE the active conceptual metaphors. Ask 'what metaphor am I using to think about this?' until at least one root metaphor is named. SECOND: notice which inferences the metaphor makes feel natural and which it makes feel forbidden; the constrained inference-space is where the metaphor is doing its work. THIRD: when stuck, DELIBERATELY swap to a different conceptual metaphor and observe what becomes thinkable. Many breakthroughs are metaphor-swaps disguised as discoveries (Kepler's celestial machine reframing Aristotle's celestial spheres; Watson-Crick's DNA-as-information reframing protein-as-life-stuff; Marr's three-levels-of-explanation reframing computation-as-mechanism). The atom does NOT advise that metaphors are bad or that literal description is achievable; conceptual metaphor is unavoidable cognitive infrastructure. It advises surfacing the active metaphors, noticing their inference-constraints, and deliberately swapping when the constraints are blocking thought."
