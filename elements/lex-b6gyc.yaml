lineage:
  - source: primary
    text: Halberstam-1998-FemaleMasculinity
    citation: "Jack Halberstam, *Female Masculinity* (Duke University Press 1998; 20th-anniversary edition 2018). Halberstam — currently University Professor at Columbia University in Gender Studies + English — develops the foundational analysis of `female masculinity` as a distinct cultural form with its own 400+ year history, decoupled from male-bodied subjects. The transferable contribution: identity-features that have been studied as properties of prototype embodiments (masculinity ← male body) are empirically embodied by atypical subjects (female-masculinity → drag kings, butch lesbians, tomboys, stone butches, female-to-male transsexuals, premodern `female husbands` and Ann Lister-style figures), and those embodiments produce distinct cultural forms + histories that the prototype-default research-frame has systematically erased. Halberstam additionally documents (Preface + Ch.2) the racial + class structure of the prototype-assumption: in dominant U.S. cultural frames, `femininity has been cast as white and female; masculinity as both working class and black,` so the male-bodied prototype-default is itself racially-and-class-marked, not generic. The transferable form lex-b6gyc lifts this into its general form — applicable to any identity-feature whose research-frame assumes prototype embodiment. The atom encodes the structural decoupling claim separately from Halberstam's specific gender-studies political program. The framework has been productively extended across whiteness studies (Bonilla-Silva 2003 + Ignatiev 1995 on the racial-prototype assumption + atypical-white identities); class-and-professional-identity studies (Bourdieu's cultural-capital framework + subsequent extensions); entrepreneurial-identity studies (Marlow + Patton 2005 on women + minority founders); AI-and-intelligence studies (Crawford 2021 *Atlas of AI* + Bender et al 2021 on the human-prototype assumption in AI definitions). Debunking check applied: Halberstam's specific theoretical apparatus (the use of Foucault + Butler) is contested in gender studies + queer theory; the STRUCTURAL claim that identity-traits decouple from prototype embodiments + produce distinct cultural forms is uncontested even by theoretical opponents. The atom encodes the structural primitive, not the theoretical apparatus."
    quote: "[Halberstam 1998/2018 Preface pp. xii-xiii, the crucial passage:] 'Female masculinity has a long history, a history that has been rooted in racial and class-­based distinctions between women and that casts femininity as in some ways white and female and masculinity as both working class and black.' [On the systematic invisibility of female-masculinity from prototype-default research-frames:] 'While queer studies in the 1990s was replete with such accounts for male gender variance and desire, there were no such studies of women. Male scholars had documented and explained the meaning of male femininities from the Greeks (studies of the kinaidos) through early Christianity (sodomites) to early modern forms of homoerotic contact (mollies and molly houses) to the late nineteenth century legal persecution of homosexual men and dandies (the trials of Oscar Wilde for example). When I decided to offer a history of female masculinity, queer studies had not produced comparable prehistories for lesbianism.' [On the capaciousness of the decoupled-trait framework:] 'The term \"female masculinity,\" precisely because it describes multiple modes of identification and gender assignation, is capacious enough to contain many of these historical variations without stabilizing and foreclosing on their meanings.' [Practitioner-extraction for transferable lex-b6gyc: identity-features that have been studied as if they're properties of prototype embodiments are empirically embodied by atypical subjects; those embodiments produce distinct cultural forms + histories invisible from the prototype-default research-frame; the transferable diagnostic generalizes from gender to race, class, professional identity, entrepreneurial identity, intellectual identity, and AI cognition.]"
  - source: cross-attestation
    text: cross-domain-identity-traits-decoupled-from-prototype-embodiment
    citation: "Cross-domain attestation that identity-traits decoupled from prototype embodiments produce distinct cultural forms across whiteness, class, professional identity, entrepreneurial identity, intellectual identity, and AI-cognition contexts. (a) Whiteness embodied by atypical subjects: Ignatiev 1995 *How the Irish Became White* + Brodkin 1998 *How Jews Became White Folks* + Roediger 2005 *Working Toward Whiteness* document how Irish, Jewish, Italian, Eastern-European immigrants moved into the white category over decades + the distinct cultural forms their atypical-whiteness produced before assimilation. (b) Professional identity embodied by non-prototype subjects: Anderson 2015 *White Rage* + DuBois 1903 *The Souls of Black Folk* + Glenn 1992 *From Servitude to Service Work* document the distinct cultural forms produced by Black-American professionals, immigrant professionals, working-class autodidacts who embody the professional identity outside its prototype frame (Black middle-class community, immigrant professional associations, autodidact intellectual traditions). (c) Entrepreneurial identity embodied by women + people of color: Marlow + Patton 2005 + Carter et al 2015 + Brush et al 2017 document how women + minority founders produce distinct entrepreneurial cultural forms (solo-founder traditions, mutual-aid + community-funded ventures, family-business-as-firm, immigrant-business networks) that the white-male-tech-founder prototype erases from `entrepreneurship` research. (d) Intellectual identity embodied outside academia: Gramsci 1971 *Prison Notebooks* on `organic intellectuals` + DuBois 1903 + Hooks 1994 *Teaching to Transgress* document non-academic intellectual cultural forms (organic intellectuals embedded in working-class movements, Black-feminist intellectual traditions outside the academy, autodidact + popular-education traditions). (e) AI `intelligence` embodied in non-human substrate: Crawford 2021 *Atlas of AI* + Bender et al 2021 `Stochastic Parrots` + Russell 2019 *Human Compatible* explicitly raise the structural question that AI-intelligence is studied as if it should resemble the human-cognitive prototype; LLM-as-collaborator + AI-art-subculture + prompt-engineering-community are distinct cultural forms produced by non-human cognitive substrate that the human-prototype frame erases or marginalizes. (f) Athletics embodied outside prototype: Williams + Williams sisters (tennis); Caster Semenya + Lia Thomas debates (track + field, swimming) — non-prototype embodiment of athletic excellence produces distinct cultural forms + provokes prototype-defending backlash. (g) Religious leadership embodied outside ordained-male-clergy prototype: Black church preacher tradition, women's spiritual leadership traditions, lay-led religious movements + their cultural forms. The cross-domain attestation establishes the transferable structural form: identity-traits decouple from prototype embodiments + produce distinct cultural forms; the prototype-default research frame systematically erases those forms; deliberately breaking the prototype-default reveals the histories."
    quote: "Across whiteness studies (Ignatiev 1995, Brodkin 1998, Roediger 2005), professional identity (Glenn 1992), entrepreneurial identity (Marlow + Patton 2005, Brush et al 2017), intellectual identity (Gramsci 1971, DuBois 1903, Hooks 1994), AI cognition (Crawford 2021, Bender et al 2021), athletics, and religious leadership, the same structural form recurs — identity-traits decouple from prototype embodiments + produce distinct cultural forms with their own histories. The transferable diagnostic: when an identity-feature is studied as a property of its prototype embodiment, deliberately break the prototype-default frame to find the atypical embodiments + their cultural forms + their histories."
canonical-instances:
  - "Halberstam's canonical case: female masculinity — Ann Lister (1791-1840, premodern butch lesbian who documented her sexual + social life in coded diaries); Annie Hindle (1847-1897, first major Anglo-American drag king); 18th-century `female husbands` (women who passed as men + married women); stone butches in mid-20th-c lesbian community; contemporary drag kings; tomboys + their cultural traditions. 400+ year history invisible from prototype-default male-masculinity research frames."
  - "Whiteness embodied by atypical subjects (Ignatiev 1995 *How the Irish Became White*; Brodkin 1998 *How Jews Became White Folks*; Roediger 2005 *Working Toward Whiteness*): Irish, Jewish, Italian, Eastern-European immigrants existed in atypical-whiteness or not-quite-white status for decades before assimilation; the distinct cultural forms produced during that period (immigrant neighborhoods, religious institutions, mutual aid societies, distinct professional networks) have their own histories."
  - "Professional identity embodied by Black-American + immigrant + working-class subjects (DuBois 1903 *Souls of Black Folk*; Glenn 1992 *From Servitude to Service Work*; Anderson 2015 *White Rage*): Black middle-class community, immigrant professional associations, autodidact intellectual traditions produce distinct cultural forms invisible from the suited-white-male-professional prototype."
  - "Entrepreneurial identity embodied by women + people of color (Marlow + Patton 2005; Brush et al 2017): solo-founder traditions, mutual-aid + community-funded ventures, family-business-as-firm, immigrant-business networks. Distinct cultural forms erased by the white-male-tech-founder prototype that dominates `entrepreneurship` research."
  - "Intellectual identity embodied outside academia (Gramsci 1971 *Prison Notebooks* on organic intellectuals; Hooks 1994 *Teaching to Transgress*; Black-feminist intellectual tradition outside the academy): non-academic intellectual cultural forms with distinct histories."
  - "AI `intelligence` embodied in non-human substrate (Crawford 2021 *Atlas of AI*; Bender et al 2021 `Stochastic Parrots`): LLM-as-collaborator + AI-art-subculture + prompt-engineering-community are distinct cultural forms produced by non-human cognitive substrate that the human-cognition prototype frame erases or marginalizes."
  - "Athletic excellence embodied outside prototype: Williams + Williams sisters tennis; Caster Semenya track + field; non-prototype embodiment of athletic identity produces distinct cultural forms + provokes prototype-defending backlash."
  - "operationally distinct from lex-raydk dominant-category-stratifies-into-hegemonic-complicit-subordinate-marginalized (Connell): lex-raydk is the four-position STRATIFICATION WITHIN the prototype embodiment (multiple masculinities within male-bodied subjects). lex-b6gyc is DECOUPLING from prototype embodiment (masculinity outside male-bodied subjects). They compose — masculinity is both internally stratified (lex-raydk) AND embodied outside its prototype (lex-b6gyc)."
  - "operationally distinct from lex-f6g8c categories-default-canonical-case-to-most-privileged-member (Crenshaw): lex-f6g8c is about CATEGORY DEFINITION defaulting to the privileged member. lex-b6gyc is about identity-TRAITS that escape their prototype embodiment + produce distinct cultural forms. Compose: lex-f6g8c explains why the prototype-default exists; lex-b6gyc explains what's invisible because of it."
  - "operationally distinct from lex-94nsz monolithic-category-bundles-multidimensional-variation (Fausto-Sterling): lex-94nsz is about a single category's internal multidimensionality (sex = chromosomes + gonads + ...). lex-b6gyc is about identity-traits crossing prototype-embodiment boundaries. Different cuts: lex-94nsz is intra-category dimensionality; lex-b6gyc is inter-category embodiment."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition (Butler performativity): lex-y2tbg is about IDENTITY constituted by repeated performance. lex-b6gyc is about specific identity-traits decoupled from prototype embodiments producing distinct cultural forms. They compose: Butler explains the mechanism (performance); Halberstam documents specific historical cases of non-prototype performance producing distinct cultural forms."
critical-questions:
  - "Is the identity-trait actually portable across prototype embodiments, or are you projecting a prototype-trait onto subjects who experience their identity differently? The diagnostic discipline: trace specific instances of the decoupled trait to specific cultural forms documented by their participants. If butch lesbians, drag kings, etc. describe themselves as embodying masculinity, the decoupling is empirically supported. If you're imposing a `female masculinity` reading on subjects who don't claim it, you're projecting. The atom requires empirical support from the embodying subjects."
  - "Does the atom imply gender (or any identity-trait) is fully detachable from embodiment? Not necessarily. The atom claims SOME identity-traits decouple from SOME prototype embodiments to produce distinct cultural forms. Other identity-traits may be more body-bound (pregnancy can only be embodied by pregnant subjects; lactation similarly). The atom is structural-diagnostic about cases where decoupling empirically occurs; it does not commit to full embodiment-independence as a general claim."
  - "Could the atom be used to dismiss the specificity of the prototype embodiment? No — the atom claims atypical embodiments PRODUCE DISTINCT cultural forms, not that they're equivalent to the prototype embodiment. Female masculinity is masculinity in a specific embodiment with its own history; it is not the same as male masculinity. The atom respects the specificity of each embodiment + the distinctness of its cultural form."
  - "How does the atom relate to the contemporary trans+gender discourse? Halberstam's framework predates the contemporary trans-discourse but anticipates many of its moves. The atom is structural-diagnostic about identity-traits decoupling from prototype embodiments + producing distinct cultural forms; it is compatible with multiple positions on the specific trans-discourse questions (essence vs. construction, identity vs. role, etc.) and does not commit to a specific political position on those questions."
  - "Could the atom be misused to argue that any subject can claim any identity-trait? No — the atom is structural-diagnostic about empirically-documented decoupling that produces distinct cultural forms. It does NOT authorize ungrounded claims like racial passing without lived experience of the racial position or appropriation of cultural forms without participation in their community. The atom requires the embodiment + the cultural form to be empirically present, not asserted."
