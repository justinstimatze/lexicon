canonical-instances:
  - "A manager role explicitly expanded to include 'developing the whole person, not just managing output' produces three visible styles among managers facing a report whose personal problems are tanking their work: some narrow back to pure output management and decline to engage the personal issue at all, some refer the report to HR or an EAP while staying involved in checking on them, and some personally take on far more than a manager's role typically requires — coaching, advocating, absorbing the report's stress — until a peer flags that the situation actually needed professional help the manager isn't equipped to give."
  - "A customer-support role redefined to include 'owning the customer's whole experience, not just the ticket' produces the same three-way split when a customer's problem is genuinely outside the company's control: some agents revert to 'that's not something we can help with,' some loop in another team and stay engaged as the customer's point of contact, and some spend hours personally trying to solve a problem that was never solvable from their seat."
critical-questions:
  - "Are these three styles a stable individual trait — does the same student consistently retreat, delegate, or escalate across different hard cases — or is the choice driven by features of the specific case (how emotionally salient it is, how visible to peers, how much the student has already personally invested) such that the same person could show any of the three depending on the case rather than a fixed disposition?"
  - "The faculty's 'too complicated for anybody' comment reclassifies the THIRD style's outcome as a case-design failure rather than a student failure. Could the same reclassification apply to the FIRST style — is a student's retreat to strictly-medical scope sometimes correctly reclassified as 'this case genuinely didn't call for the expanded role' rather than a failure of comprehensiveness? What would distinguish appropriate narrowing from role-abdication if the same reclassifying logic can rescue either style from being read as failure?"
status: active
