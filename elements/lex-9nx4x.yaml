id: lex-9nx4x
name: full-observability-is-dysfunctional-groups-need-tolerated-deviation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When designing or judging a system of surveillance, monitoring, or accountability — a workplace tracking tool, a moderation policy, a compliance regime — resist the assumption that more visibility of rule-breaking is always better social control. Merton argues there is a ceiling, not a maximum: 'it may be useful to think in terms of there being, for various social structures, some functionally optimum degree of visibility. It indicates, further, that this optimum does not coincide with complete visibility.' The reason is structural, not sentimental: every group tacitly runs on a band of tolerated, unenforced deviation from its own stated norms, because literal, universal enforcement is unlivable. Merton, extending Hobbes: 'the unflagging and literal application of these normative standards, upon pain of punishment for all departures from them, would result almost in \"a war, as is of every man, against every man.\" For full, continuous, and ready compliance with strict group standards would be possible only in a social vacuum that never existed.' He reaches for Thackeray's essay 'On Being Found Out' to make the point vivid — a society in which every departure from every rule is detected and punished, cascading from schoolboys through bishops through ministers, becomes an image of pure horror rather than pure order: 'The butchery is too horrible... I am glad we are not all found out.' The practical corollary, which Merton states explicitly, is that excessive surveillance is dysfunctional even for the people running the system of control, not only for those being watched: authorities can have 'excessive knowledge' of what is going on, forcing constant renegotiation of exactly how much departure is tolerable, which is itself corrosive to stable authority. Diagnostic use: when a monitoring or accountability system is failing, don't assume the fix is always more visibility — ask instead whether the system has room for a tolerated band of minor, unacknowledged departures from the letter of the rule, and whether recent moves toward stricter enforcement have narrowed that band past what the group can actually sustain (Merton notes the band predictably narrows under acute external stress, as with martial law, and widens again once the threat passes)."
