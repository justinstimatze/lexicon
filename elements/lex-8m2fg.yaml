canonical-instances:
  - "A country's net migration figure for the year is reported as zero — 'no net movement of population' — but individual migration records show 50,000 people left and 50,000 different people arrived; the population living there in December is substantially different from the one living there in January, a fact the net-zero headline actively conceals rather than merely simplifies."
  - "A company's headcount grows from 500 to 520, read as measured, incremental growth — but hiring-and-attrition records show 200 people left and 220 were hired that year. The modest net figure hides a churn that replaced nearly half the organization, which matters enormously for institutional memory and culture even though 'we grew 4 percent' suggests nothing changed but size."
critical-questions:
  - "Kendall and Selvin can only see this because they have matched individual-level panel data (each student's own third-year preference linked to their own fourth-year assignment) — for how many reported net-change statistics in ordinary use is even this decomposition possible, given that most published aggregate figures give only the before and after totals, not the individual transition matrix?"
  - "Does a large, roughly-canceling churn indicate two independent decision processes that happen to be similar in scale (a coincidence), or does it suggest the two flows are mechanically linked — for instance, specialized slots vacated by top-ranked switchers-out being exactly what allows lower-ranked switchers-in to move up — so that the 'coincidence' is really one zero-sum reallocation dressed up as two separate trends?"
