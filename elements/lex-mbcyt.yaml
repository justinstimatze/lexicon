    quote: "You had no wish to kill the crab. What is done without intent is not counted to the score; if you feel a scruple about so small a matter, what real transgression would you ever do?"
canonical-instances:
  - "A junior auditor who agonizes over a rounding error too small to affect any actual figure is reassured by a senior colleague that this exact level of concern over something this minor is the clearest evidence the firm has that the audit's larger conclusions can be trusted."
critical-questions:
  - "Does genuine scrupulosity actually correlate with rigor this reliably, or can someone perform anxious self-doubt over small things specifically to build a reputation they don't otherwise deserve?"
  - "Is there a point where scrupulosity over trivial matters stops signaling rigor and starts indicating a different problem entirely, such as an inability to distinguish which infractions actually matter?"
