id: lex-e6e85
name: a-prophesied-outcome-is-overturned-by-attacking-the-omens-visible-vehicle
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A prophecy tied to a visible sign has a physical weak point most forecasts don't: the sign itself can be attacked, and destroying it can flip the outcome the prophecy claimed was fixed. In the Jataka's tale of the tutelary bulls, both kings can see their guardian deities preparing to fight invisibly as a white bull and a black bull — omens Sakka had already used to predict Kalinga's victory. Rather than accept the forecast, Nandisena has Assaka and his men physically kill Kalinga's bull: 'dismount from your well-trained Sindh horse, and grasping this spear... fell to the ground this god of Kalinga, while we with a thousand spears will smite him and so shall Kalinga's tutelary deity perish...' Kalinga is defeated exactly as the plan intended."
related: []
evokes: [jataka, catukkanipata, cullakalinga-jataka, a-fated-outcome-has-a-vehicle-that-can-be-attacked, refusing-to-accept-a-prophecy-as-fixed]
lineage:
  - source: primary
    text: jataka-chalmers1895-cullakalinga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 301, Cullakalinga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Fear not Sire, we shall conquer and Kalinga will be defeated. Only ... dismount from your well-trained Sindh horse, and grasping this spear, with your left hand give him a blow on the flank, and then with this body of a thousand men advance quickly and with a stroke of your weapon fell to the ground this god of Kalinga, while we with a thousand spears will smite him and so shall Kalinga's tutelary deity perish, and then shall Kalinga be defeated and we shall be victorious.\""
canonical-instances:
  - "A startup is told by every analyst that a market leader's dominance is inevitable because of its distribution deal with a single retail chain — so instead of competing on product, the challenger buys out that one retail chain's exclusivity clause, and the 'inevitable' outcome collapses with the vehicle it depended on."
critical-questions:
  - "Is the forecast actually tied to a concrete, attackable vehicle, or is the apparent 'omen' really just a correlate of deeper causes that survive its destruction — did killing the bull cause the victory, or merely coincide with factors like Kalinga's own army's low morale?"
  - "What does it cost to attack the vehicle directly, compared to the cost of simply preparing to win despite an unfavorable forecast?"
status: active
