lineage:
  - source: primary
    text: seeley-2010-honeybee-democracy-chs-7-and-9
    citation: "Thomas D. Seeley, *Honeybee Democracy* (Princeton University Press, 2010). The transferable claim, abstracted from the bee-swarm-specific application: a stable three-element collective-decision structure (distributed advocacy + quality-weighted intensity + quorum trigger that commits collective action) outperforms central consensus-polling under most conditions where individual evaluation is noisy, the choice must commit collectively, and speed has non-trivial value. Seeley's specific empirical work over decades on Appledore Island (2002-2003, the named experiments) established three essential findings: (1) bees use QUORUM-SENSING not CONSENSUS-SENSING — once ~20-30 scouts are present simultaneously at one nest site, the scouts produce the piping signal that initiates swarm-takeoff preparation, EVEN when other scouts are still dancing for competing sites; (2) the quorum threshold is TUNED for accuracy over speed — a lower threshold gives faster but error-prone decisions, a higher threshold gives slower but more accurate decisions; (3) the piping signal STOPS further advertisement at losing sites, accelerating consensus formation only after the commitment threshold has been crossed. The transferable atom extracts this design-pattern WITHOUT committing to Seeley's specific biological mechanisms (the lemon-pheromone-fanning, the cross-inhibition stop-signal via head-butting in earlier work, the specific 20-30 number). The atom is silent on the broader 'swarm intelligence' literature's enthusiasm for biological-as-template (much of which oversold); what it claims is the specific design pattern with Seeley's specific evidence. Distinct from lex-urh87 gift-as-three-obligations-give-receive-reciprocate (Mauss): Mauss names the binding-mechanism of exchange; this atom names a collective-decision-procedure. Distinct from lex-bpr6b because that atom is about choice() composition operator at the substrate's own bond-level (a different abstraction layer). Distinct from lex-eg9zm because parallel composition is the substrate's parallel operator (different layer). Distinct from lex-r3aug open-impartiality-admits-distant-voices-closed-removes-only-intra-group-bias (Sen 2010): Sen's atom is about WHICH voices count; Seeley's atom is about HOW counted voices aggregate to commit. Distinct from lex-7tvr6 outside-view-anchor-on-reference-class-base-rate-before-inside-view (Tetlock-Kahneman): outside-view is about INDIVIDUAL judgment calibration; quorum-trigger is about COLLECTIVE judgment commitment. Distinct from lex-gx8m2 find-related-problem (Polya heuristic for individual problem-solving) — Seeley's atom is about group commitment under collective uncertainty."
    quote: "[Seeley 2010 Ch.7 'Consensus or Quorum?' on the central experimental finding:] 'This first experiment showed us that consensus among dancers is not necessary for a swarm to initiate its move to a new home, hence we could reject the consensus-sensing hypothesis for how scouts know when to start piping. This experiment also provided some support for the quorum-sensing hypothesis, because we noticed that swarms consistently started preparing for flight — that is, their scouts started piping — once 20 to 30 or more bees were seen together at one of the nest boxes, usually with about 10 to 15 bees inside and 10 to 15 outside. This suggested that in the decision-making system of honeybee swarms, 20 to 30 bees present simultaneously at one of the potential nest sites is a quorum.' [Ch.7 'Why Quorum Sensing?' on the speed-accuracy tradeoff:] 'Another likely reason that scouts don't use consensus sensing is that quorum sensing, unlike consensus sensing, enables a swarm to strike a good balance between speed and accuracy in its decision making. [...] If the bees used a consensus as the trigger, then the start of a swarm's takeoff preparations would be delayed by the extra time needed to reach a consensus.' [Same chapter, on accuracy:] 'Using a 20- to 30-bee quorum evidently helps ensure accurate decision making because it guarantees that scout bees will not begin producing piping signals until a sizable number of them have independently scrutinized a site and judged it worthy of their support. This makes it extremely unlikely that a swarm will choose a poor site when a better one is available, for a poor site will not attract a (large) quorum of scouts.' [The Quaker counter-example, Ch.7:] 'Some years ago, the members of her Meeting wrestled with the question of whether or not to change the location of their meetinghouse. In meeting after meeting the subject was discussed, with the Friends always seeking a united wisdom, but every discussion ended with an adjournment for further consideration because an agreement could not be reached. Why? Because there was one Friend, an elderly lady, who felt strongly that the proposal was a mistake, withheld her consent, and so blocked a decision. If the Meeting had used a quorum, acting when a sufficient number or proportion of its members agreed, it would have reached its decision in a few weeks, but waiting for a consensus required four years. What finally enabled the Meeting to achieve a united judgment was the death of the one disapproving Friend.' [Ch.9 'Lesson 5: Use Quorum Responses for Cohesion, Accuracy, and Speed' on the design summary:] 'Their trick is to have the scout bees make quorum responses, that is, to have these bees make sharp changes in their behavior when a threshold number (quorum) of individuals support one of the alternatives. [...] An additional benefit of the scout bees' sharp quorum response is that it enables the thousands of nonscouts in a swarm to start their flight preparations long before the scouts reach their consensus, which further shortens the time the swarm spends hanging precariously from a swaying tree branch.'"
canonical-instances:
  - "Honeybee swarm nest-site selection (the named case): scouts independently inspect sites; advertise via waggle-dance with intensity ~ site-quality; piping signal triggers when ~20-30 scouts converge at one site, stopping further advertisement. The mechanism scales — Seeley's later work showed the same quorum-design across other Apis species despite varying swarm sizes."
  - "Seeley's faculty meetings at Cornell (Ch.9): for difficult collective decisions (hiring, tenure, promotion), the department uses periodic straw polls during discussion. When a poll reveals ~80% (16/20) agreement, the minority typically switches to the majority for the sake of consensus. The straw poll IS the quorum sensor, with ~80% as the trigger threshold."
  - "Distinguished from consensus-poll Quaker meeting (the explicit counter-example Seeley cites): pursuing unanimity blocked a meetinghouse decision for FOUR YEARS until the lone dissenter died. The structural failure mode: any single hold-out can veto indefinitely, regardless of the strength of independent evidence accumulated at the dominant alternative. The Quaker process is NOT well-suited to time-sensitive collective decisions; the quorum-trigger structure outperforms it on speed without sacrificing accuracy (because the trigger threshold itself is the accuracy lever)."
  - "Market price discovery: traders independently evaluate an asset; advertise via bid/ask (intensity ~ conviction-as-spread or as size-shown); a trade execution occurs when bid and ask meet at one price (the threshold quorum is one matching pair). The market commits to the price once executed; further bids for different prices are then re-evaluated against the new reference. Distinguished from a central-auctioneer model — markets work without a central polling agent."
  - "Open-source maintainer decision norms: contributors propose changes via PRs; advocacy is via written argument + review-approvals (intensity ~ technical-depth-of-explanation); merge commits when N reviewers approve (the quorum threshold). Once merged, further advocacy for not-merging is silenced (the equivalent of the piping signal). Some projects explicitly use 'sufficient consensus' or 'rough consensus + working code' language that names the quorum-not-unanimity choice."
  - "Adversarial collaboration in research (Mellers-Tetlock 2010s): two scientists with opposing hypotheses commit to a study design that BOTH would accept as decisive, then publish whichever result emerges. The 'mutual acceptance' IS the quorum sensor (here the threshold is 2/2 since N is small); once accepted, both commit. Distinguished from individual peer review where one dissenting reviewer can block."
  - "Distinguished from voting / majority rule: voting is a single-snapshot poll where every agent's preference is registered simultaneously. The quorum-trigger structure is DYNAMIC — agents evaluate, advocate, and commit asynchronously; the quorum is reached when the FIRST K agents converge, not when all N have voted. Voting works when individual judgments are independent and synchronously available; quorum-trigger works when judgments accumulate over time at varying rates."
critical-questions:
  - "Is individual evaluation truly INDEPENDENT, or is there information cascade that violates the structure? The Seeley structure assumes scouts independently form their site-quality assessment. If agents copy each other's signals BEFORE forming their own evaluation (the cascade failure mode), the quorum count over-represents the early evaluators and accuracy collapses. Diagnostic: are agents committing before they have evidence, on the basis of OTHERS' advocacy? If yes, the structure is degraded toward consensus-poll-of-imitators and the atom's accuracy claim does not hold."
  - "Is the quality-weighting LEGIBLE — can other agents discriminate strong advocacy from weak? Seeley's bees use dance-duration as a continuous signal of site-quality (easily readable). If advocacy is binary (vote yes/no) or hard to discriminate by intensity, the structure loses the accuracy lever the quality-weighting provides. Diagnostic: can a third party distinguish 'high-conviction supporter' from 'low-conviction supporter' by their behavior? If not, the structure degrades toward majority vote."
  - "What is the quorum threshold and is it TUNED for the speed/accuracy tradeoff? Seeley showed that the quorum number is the structural lever for the tradeoff — lower = faster but more error-prone, higher = slower but more accurate. If the threshold is arbitrary or unprincipled, the structure's tradeoff is also arbitrary. Diagnostic: name the threshold and why it is what it is. If the threshold cannot be defended on speed/accuracy grounds, it should be reconsidered."
  - "Does the trigger STOP further advocacy at losing alternatives? Seeley's piping signal informs scouts at losing sites that the contest is over and they should cease advertising. Without this stop-signal, the structure can hang in disagreement after commitment (the bee-swarm splits and stalls). Diagnostic: what is the equivalent of the piping signal in this domain? If no clear stop-signal exists, the structure is incomplete — design one before relying on the quorum-trigger."
  - "Is consensus actually required for the action, or only collective commitment? The quorum-trigger structure commits the GROUP (the swarm flies as one unit) but does not require every individual to ASSENT. If the action requires that every member agree (Quaker meeting; some judicial unanimity rules), the structure does not apply — those domains are explicitly committed to consensus and the speed cost is the price. Diagnostic: would the action succeed if some agents continued to disagree privately? If yes, quorum-trigger applies; if no, consensus is required for substantive reasons and the atom does not apply."
