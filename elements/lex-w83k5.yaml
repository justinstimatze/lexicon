id: lex-w83k5
name: mourning-a-death-you-caused-hides-your-own-hand-in-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Visibly grieving someone whose death you personally engineered lets you occupy the social position of a fellow victim rather than a perpetrator, using the same public display that an innocent survivor would produce, with nothing in the performance itself distinguishing the two. In Radin's comparative Tlingit Raven summary, Raven builds a fake bridge specifically to kill and eat his traveling companion: 'he laid some dried celery stalks across, covered them with moss, and induced Deer to try to Walk across. Deer did so and was precipitated to the bottom, where he was devoured by Raven.' The killing is deliberate, planned, and entirely his doing. What follows erases none of that but changes how it reads to anyone watching: 'Afterward Raven began mourning for him.' There is no reconciling detail, no confession folded into the grief -- the mourning simply runs alongside the concealed fact of authorship, unchallenged by anything in the text. Diagnostic move: when someone's expressed grief over a loss is the first and only information you have about how that loss happened, treat the grief as telling you about their current social performance, not about their causal distance from the event, and look separately for evidence of what actually happened before accepting the mourning as proof of innocence."
related: []
evokes: [radin-tlingit-trickster-summary, raven-and-deer, induced-deer-to-try-to-walk-across, raven-began-mourning-for-him]
