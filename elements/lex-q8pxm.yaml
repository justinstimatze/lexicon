lineage:
  - source: primary
    text: schwitzgebel-2013-crazyist-metaphysics-of-mind
    citation: "Eric Schwitzgebel, 'The Crazyist Metaphysics of Mind,' Australasian Journal of Philosophy 92, no. 4 (2014): 665-682, sec. ii."
    quote: "'Crazyism about a topic, then, is the view that something crazy must be among the core truths about that topic. Crazyism can be justified when we have good reason to believe that one among several bizarre views must be true but where the balance of evidence leaves no individual view decisively supported over all the others.'"
  - source: primary
    text: schwitzgebel-2013-crazyist-metaphysics-of-mind
    citation: "Eric Schwitzgebel, 'The Crazyist Metaphysics of Mind,' Australasian Journal of Philosophy 92, no. 4 (2014): 665-682, sec. iii."
    quote: "'it seems to be common argumentative practice in the metaphysics of mind to highlight sharp violations of common sense in views one opposes [...] as though the bizarreness of those views were a weighty consideration against them. This practice is problematic if it is generally agreed that all well-developed metaphysical theories sharply violate common sense.'"
canonical-instances:
  - "A working group interpreting an anomalous experimental result narrows down to four hypotheses, each of which requires abandoning something the team currently treats as basic. Whoever presents last keeps getting challenged with 'but that requires giving up X' -- a criticism equally true of the other three surviving hypotheses, and never raised against them because no one is defending them out loud that day."
  - "In debating interpretations of quantum mechanics, a physicist rejects the many-worlds interpretation because '10^100 constantly splitting copies of yourself' is too strange to accept, then defends spontaneous wavefunction collapse without noticing that collapse requires abandoning unitary evolution everywhere in the universe except during measurement -- an equally sharp break from how the rest of physics is understood to work."
  - "A committee restructuring a failing organization is presented with four options, each of which someone on the committee calls 'radical' or 'a huge departure from how we do things.' Every live option is radical relative to the status quo that produced the failure; voting each one down in turn for being radical still ends with the committee holding no option, having quietly graded the least-bad one against a standard the status quo itself could never have met either."
  - "Operationally distinct from lex-jy4aq problem-typology-wicked-vs-tame: that atom diagnoses whether a problem's DEFINITION is contested before choosing a method. This atom presupposes the definition is settled and the option space is already exhaustively enumerated -- its move is about what to do once every worked-out answer in that fixed space is independently strange."
  - "Operationally distinct from lex-fecdf inconceivability-mistaken-for-impossibility: that atom corrects a private failure of imagination (I can't picture X, so I conclude X is impossible) about a single claim. This atom concerns a public forced choice among multiple already-articulated, already-imaginable rival positions, where the problem is not failing to conceive the bizarre option but using its bizarreness to rank it against equally bizarre rivals."
critical-questions:
  - "How do you confirm the option space is actually exhaustive and not merely the set of options someone has bothered to work out so far? Crazyism only follows if a genuinely undiscovered fifth option -- one that isn't bizarre -- has actually been searched for and ruled out. Treating an incompletely surveyed space as exhaustive smuggles in the crazyist conclusion by assumption."
  - "Does 'bizarre relative to common sense' actually track anything evidentially, or is it just cataloguing which claims are unfamiliar to a particular community at a particular time? If common sense itself is an unreliable guide in the domain, its violation may be irrelevant to credence rather than merely tied across rivals -- a stronger and different conclusion than the one this atom licenses."
  - "Once bizarreness is disqualified as a tiebreaker, what criterion replaces it? The atom names the honest fallback -- confident something bizarre is true, unconfident which -- but that only fixes a belief state; a chooser who still has to act (ship the fix, run the experiment) needs a further method for picking among equally bizarre live options, and this atom leaves that method unsupplied."
