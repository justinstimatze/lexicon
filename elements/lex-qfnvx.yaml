id: lex-qfnvx
name: an-unwanted-bond-is-managed-by-aligning-on-a-shared-prior-goal
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Two people forced into a relationship neither chose can preserve what they each actually wanted beforehand, rather than let the imposed bond override it, by discovering they share the same underlying goal and openly organizing the relationship around that instead of around the role they were assigned. In the Jataka's tale of the golden image, both the Bodhisatta and his bride are married against their will, each having privately wanted the ascetic life instead — so they simply cohabit without romantic involvement: 'Though Sharing the same room and the same bed they did not regard one another with the eye of sinful passion, but dwelt together like two holy men or two female saints.'"
related: []
evokes: [jataka, catukkanipata, ananusociya-jataka, a-shared-prior-goal-reshapes-an-imposed-relationship, the-assigned-role-is-hollowed-out-by-mutual-agreement]
lineage:
  - source: primary
    text: jataka-chalmers1895-ananusociya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 328, Ananusociya-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Though Sharing the same room and the same bed they did not regard one another with the eye of sinful passion, but dwelt together like two holy men or two female saints."
canonical-instances:
  - "Two employees forced into an arranged co-management role neither requested discover on day one that both privately want to spend the assignment building toward a transfer to research instead of the operational track they were placed in — so they quietly run the role as a joint handoff-preparation project rather than as the management partnership it was designed to be."
critical-questions:
  - "Does discovering this shared prior goal always work out this cleanly, or does the story understate how often one party in an imposed bond wants something different from the other, leaving no such alignment available?"
  - "Is there a cost to the people around them — family, society, whoever imposed the bond in the first place — when the imposed role is hollowed out this way while its outward appearance is maintained?"
status: active
