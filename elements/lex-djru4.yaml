id: lex-djru4
name: a-fixed-distant-goal-requires-suppressing-changed-minds
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a political, organizational, or personal program commits to a distant, fixed end-state and treats every intermediate step as a means toward it, check what happens when the people involved change their minds partway through -- because the years the program takes to reach its goal are also years in which opinions about what's desirable keep moving. Popper on Utopian political engineering: 'Thus the rationality of his political action demands constancy of aim for a long time ahead; and this can only be achieved if he not merely crushes competing Utopian religions, but as far as possible stamps out all memory of them. ... Again, the only way to avoid such changes of our aims seems to be to use violence, which includes propaganda, the suppression of criticism, and the annihilation of all opposition. With it goes the affirmation of the wisdom and foresight of the Utopian planners, of the Utopian engineers who design and execute the Utopian blueprint. The Utopian engineers must in this way become omniscient as well as omnipotent. They become gods.' The mechanism sits in the structure of the commitment itself, independent of the planners' character. A long march toward one fixed target only stays rational if the target holds still. Holding it still against people who are free to keep changing their minds means actively stopping them from doing so -- suppressing dissent, erasing rival visions, silencing revision. Violence is what buys the constancy the project's own logic demands. Diagnostic move: when a program defends its current sacrifices by pointing to a distant fixed goal, ask what happens to the people executing it if their own judgment about the goal shifts next year -- if the honest answer is 'they aren't allowed to' or 'the plan doesn't have a mechanism for that,' the program is already paying this cost, whether or not anyone involved would call it violence."
related: [lex-brd74]
evokes: [popper-1963-conjectures-and-refutations, utopian-engineering, constancy-of-aim, utopian-engineers-become-gods, popper-utopia-and-violence, stamping-out-memory-of-rivals, long-horizon-commitment-forecloses-revision]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Utopia and Violence' (address delivered to the Institut des Arts, Brussels, June 1947; first published in The Hibbert Journal 46, 1948), Ch. 18 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), pp.483-484."
    quote: "'Thus the rationality of his political action demands constancy of aim for a long time ahead; and this can only be achieved if he not merely crushes competing Utopian religions, but as far as possible stamps out all memory of them. ... Again, the only way to avoid such changes of our aims seems to be to use violence, which includes propaganda, the suppression of criticism, and the annihilation of all opposition. With it goes the affirmation of the wisdom and foresight of the Utopian planners, of the Utopian engineers who design and execute the Utopian blueprint. The Utopian engineers must in this way become omniscient as well as omnipotent. They become gods.'"
canonical-instances:
  - "A startup commits to a 10-year moonshot roadmap and treats every hire's dissent about the current architecture as a loyalty problem rather than useful information -- the roadmap can only stay rational as a plan if the target doesn't move, so engineers who'd revise the target get managed out rather than listened to. The company is defending the constancy the moonshot commitment requires, whether or not the architecture itself is still the right one."
  - "A revolutionary movement that wins power on a fixed ideological blueprint criminalizes internal factions who argue the blueprint needs updating for conditions the movement didn't anticipate -- not because the factions are wrong, but because letting the blueprint be revised mid-execution would mean admitting the steps already taken might now point the wrong way. Purges of 'revisionists' are exactly what this mechanism predicts, generated by the movement's own commitment structure."
  - "A couple builds a 20-year life plan (house, children, retirement, all sequenced against a shared vision) and one partner's later, honest reconsideration of the vision gets treated as betrayal rather than new information -- the plan's rationality was quietly resting on the assumption that neither party's judgment would move, and enforcing that assumption once it stops holding is where the relationship's coercion shows up."
critical-questions:
  - "Doesn't ANY multi-year commitment require some resistance to changing course on a whim -- so where's the line between healthy commitment-keeping and this pattern? The line is who bears the cost of staying the course once the goal is in genuine, considered dispute: normal commitment absorbs disagreement through negotiation, exit, or amendment; this pattern specifically forecloses those options -- suppression of criticism and elimination of opposition, not persuasion or a vote to revise. A program that can be argued out of its target, even slowly, isn't yet paying this cost."
  - "Popper is talking about political engineering aimed at an entire society -- does the mechanism actually port to a two-person relationship or a company, where there's no state violence available? The suppression doesn't have to be physical to do the same structural work: firing dissenters, cutting off contact with people who'd change your mind, reputational punishment for raising doubts, or simply refusing to revisit the plan all buy the same constancy Popper describes, at whatever scale coercion is available at."
status: active
