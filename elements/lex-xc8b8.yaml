id: lex-xc8b8
name: voluntary-renunciation-relapses-into-a-larger-version-of-the-same-craving
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'A person''s voluntary refusal of some desired thing doesn''t prove the underlying disposition toward it is gone. Treat it as dormant instead of resolved, capable of relapsing into a far larger version of the original craving the moment fresh leverage or opportunity reopens the question. The relapse doesn''t announce itself as backsliding; it proceeds by small, individually reasonable escalations, each easy to grant, until the cumulative demand dwarfs what was originally renounced. In the Kama-Jataka, a prince who publicly refuses the whole kingdom in favor of his younger brother (''I care nought for a kingdom'') later parlays small favors done for local villagers into control of a district, then a viceroyalty, and finally marches on the capital demanding the very throne he once renounced outright.'
related: []
evokes: [jataka, dvadasanipata, kama-jataka, renunciation-relapses-under-new-opportunity, craving-returns-larger-than-original]
lineage:
  - source: primary
    text: jataka-chalmers1895-kama-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 467, Kama-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'So by degrees he asked for all the district, he asked for the office of viceroy, and the younger brother gave it all. Then as his greed kept growing, he was not content even with viceroyalty, and determined to seize the kingdom.'
canonical-instances:
  - 'An executive who very publicly turned down a promotion years ago, citing work-life balance, later maneuvers through a series of small scope-expansions — an extra team here, an extra budget line there — until she is effectively running the division whose top job she once refused outright.'
critical-questions:
  - 'Was the original renunciation ever genuine, or does its later reversal suggest the prince was performing humility for reputational credit while the underlying ambition remained intact the whole time — and if so, is ''relapse'' even the right word for something that may never have actually stopped?'
status: active
