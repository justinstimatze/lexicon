id: lex-m4583
name: sacrifice-what-cant-be-saved-to-keep-what-can
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone or something is being taken away in a way you genuinely cannot stop, and other things you value are bound up with them and at risk of being taken too, consider whether a decisive, irreversible act aimed at what's already lost could be the only way to sever what's tied to it and save the rest. In Cushing's telling, a god's wife is being drawn skyward by the Sun's power, with their two children still in her arms; there's no way to out-power the Sun and simply keep her. The younger brother doesn't try -- he kills her outright, and 'as his aim was absolutely unerring, swish went the arrow directly to her, and she was killed. The power of life by which the Sun was drawing her up was gone, the thread was cut, and she fell over and over and struck the earth' -- releasing the children, who survive the fall. He explains the calculation afterward in terms built entirely around what the intended recipient of his justification will actually value: 'I knew you would not care anything about my wife, but I knew you would be very fond of the grandchildren.' He doesn't argue the wife was worth less in the abstract -- he identifies that the choice is already made by circumstance, and reasons forward from what can still be preserved and what the person he has to answer to will actually care about. Diagnostic move: when you're facing a loss you have no power to prevent, and something you value is entangled with the part that's already gone, ask whether a decisive act aimed at the unsavable part is actually what frees the salvageable part -- and when you have to justify that choice afterward, frame it around what the audience for that justification genuinely values, not around a claim of what the lost thing was worth."
