id: lex-xqamc
name: argument-from-bias-as-defeasible-credibility-undermining
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When you suspect a source's bias, treat the bias as a defeasible credibility-discount, not as a refutation of their claim. The bias affects priors over what they'd say; it doesn't determine whether what they say is true."
related: [lex-af9ax, lex-kebfa, lex-th68b, lex-hesjt, lex-t9fs7, lex-hrnuj, lex-2zyhy, lex-xrbzz, lex-8j5ms, lex-tfpzb, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-tpv83, lex-chtk9, lex-9uac6, lex-jafkg, lex-yh672, lex-gvg5j, lex-hjnej, lex-n8888, lex-9n7bg, lex-8y3ch, lex-36cbh, lex-ftu47, lex-vx867, lex-653ng, lex-a3tfj, lex-cxffc, lex-x6ft6, lex-e3ddu, lex-vac6e, lex-63e4c, lex-254bc]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt, lex-jafkg, lex-gvg5j, lex-kebfa, lex-yh672]
evokes: [bias-attribution, conflict-of-interest, structural-incentive, openness-failure, partisan-framing, follow-the-money, identity-protective-cognition, advocacy-vs-inquiry, dialogue-type-mismatch]
premises:
  - "if x is biased, then x is less likely to have taken the evidence on both sides into account in arriving at conclusion A"
  - "arguer a is biased"
  - "therefore a is less likely to have taken the evidence on both sides into account in arriving at conclusion A"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(identify-arguer-stake, attribute-bias, infer-evidence-imbalance) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "what type of dialogue are the speaker and hearer supposed to be engaged in? CQ1 (Walton 2008 p.157). Bias evaluation is dialogue-type-relative — partisanship is normal and expected in negotiation but problematic in persuasion-dialogue. Diagnostic: 'is this a persuasion-dialogue where openness-to-contrary-evidence is the standard, or a negotiation/advocacy-dialogue where partisanship is structurally appropriate?' — bias-attack only carries force in the former"
  - "what evidence has been given to prove that the speaker is biased? CQ2 (Walton 2008 p.157). The bias attribution itself requires evidentiary backing — a bare allegation of bias is not enough. Diagnostic: 'has structural-incentive (financial interest, institutional position, identity-stake) been documented, or is the bias-attribution mere assertion?' — un-evidenced bias-attribution is itself a fallacious move"
  - "is the bias-attribution structurally-grounded (institutional incentive, financial interest, identity-stake) or vibes-based ('they sound partisan')? Substrate extension. The Walton scheme assumes the bias-attribution is grounded; many real bias-attacks substitute style-cues ('this writer uses inflammatory language; therefore biased') for structural evidence. Diagnostic: 'name the specific structural-incentive that would make this arguer suppress contrary evidence, or withdraw the bias-attribution as unsupported'"
  - "would the same argument, made by an arguer without the bias-stake, succeed or fail on its own merits? Substrate extension. The steelman-test: if removing the biased arguer and replacing with an unbiased one would produce the same argument and the same evidence-base, the bias-attack is decoy — the argument's force does not actually depend on the arguer's stake. Diagnostic: 'reconstruct the argument as if made by a neutral party — does it still warrant the conclusion?' — if yes, the bias-attack is doing no work and the move is fallacious ad-hominem"
  - "is the questioner themselves operating within the right dialogue-type, and have they considered that bias is normal in their own position? Substrate extension via Walton 2008 p.155-156. The bias-attack from a partisan position is structurally symmetric — the attacker's own stake undermines the attack's force unless the attacker can claim a position-of-neutrality that survives the same CQ1/CQ2/CQ3 scrutiny. Diagnostic: 'does the bias-attribution come from a party with its own stake in the dispute, and if so, why should the bias-attack be granted force from a position that is structurally symmetric?'"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.5 §7 'Arguments from Bias' (pp.154-157). Scheme cited to Walton 1995 p.153 + Walton 1991 p.14 for the foundational definition of bad-bias as 'failure in argumentation of openness to new evidence or legitimate critical doubts that have arisen in the dialogue.' Walton-Reed-Macagno distinguish good-bias (proper partisanship for one's own viewpoint in a persuasion dialogue) from bad-bias (failure of openness when contrary evidence or critical doubts arise). The scheme attacks an arguer's credibility by alleging that structural-incentive (financial interest, institutional position, identity-stake) has compromised their openness to contrary evidence. Distinct from lex-kebfa expert-opinion's CQ-on-bias (which is one CQ within expert-opinion) because here bias is the SCHEME itself, not a CQ-attack on a different scheme. Distinct from lex-t9fs7 confirmation-bias and lex-hrnuj anchoring-bias because those are substrate-mechanism atoms (cognitive-process primitives) while lex-xqamc is the dialectical-move atom (scheme-form for deploying bias-attribution as an argument). The two layers cohere: the cognitive-bias atoms supply the mechanistic-grounding for what makes an arguer 'biased' in lex-xqamc's sense. Two critical questions on p.157."
    quote: "(Ch.5 §7 pp.154-157:) 7- ARGUMENTS FROM BIAS The definition of bias is related to the notion of critical doubt. The distinctive characteristic of critical discussion is critical doubt, a negative attitude of one party toward the viewpoint of the other one. Critical doubt means that an arguer has a contra attitude toward his opponent’s view because he has critical questions about it, but it also means that he is willing to overcome this attitude if the opponent can persuade him Generally Accepted Opinions, Commitment, and Character !55 by rational argumentation. A critical doubter evaluates the opponent’s standpoint, and if he considers it more plausible than his own position, he will drop it in order to accept the interlocutor’s view. The arguments a speaker provides in support of his own thesis are the rational means used to persuade the hearer of its acceptability. The hearer, on the other hand, can be open to rationally assessing it only if he can overcome critical doubt. He needs to temporarily suspend his positive attitude toward his own viewpoint and his negative attitude toward the opposite position, and to look at the issue from both the points of view. He needs to have empathy, and to be open to defeat in the face of the stronger argument. If he is a rational arguer, his ability to appreciate the reasons supporting the view of the other side is not hindered by his goal of winning the game of dialogue. Temporary suspension of the positive inclination toward his own view and commitments is, therefore, one of the most important characteristics of rational argumentation in persuasion dialogue. It is the necessary condition of critical doubt. Bias is normal in a critical discussion, because it is proper to be an advocate of one’s own viewpoint. But there is also a bad kind of bias that represents a failure of the proper exercise of critical doubt. This kind of bad bias can be defined in relation to the attitudes just cited: it is the “failure in argumentation of openness to new evidence or legitimate crit¬ ical doubts that have arisen in the dialogue” (Walton, 1991, p. 14). The problem is not the speaker’s partisanship toward his own point of view, but his reaction to the other party’s position or critique. If the speaker’s attitude is excessively strong in relation to the type of dialogue (in this case, persuasion dialogue), his behavior may be labeled as biased, refer¬ ring to the bad or harmful type of bias. In a negotiation dialogue, on the other hand, persuasion and openness to other arguments is sometimes self-defeating. In these situations, an arguer is trying to make the best deal, that is, in dialectical terms, to win the game without regard for the truth of the matter. Such a dialogue game aims not at establishing the best objective position supported by the evidence on both sides, but at a victory for the more skillful negotiator. A participant is not expected to be all that open to evidence that supports the other point of view, and bias, although it can be a problem, is not problematic in the same way that it is in a persuasion dialogue. Bias, for this reason, may be considered as the tactic of pushing ahead aggressively when used in the wrong type of dialogue. The biased arguer sees everything in terms of winning gains for himself or his own group while not taking rational arguments against his own view into account. i56 Argumentation Schemes The accusation of bias, as a consequence, is a serious attack on an oppo¬ nent’s credibility. For instance, in the following case, an expert opinion argument is undermined by the claim that the scientist in question is biased. By this means the effect of the argument is strongly reduced: A speaker in a panel discussion on the issue of industrial pollution claimed to be a neutral scientist, but a "
  - source: primary
    text: bacon-1620-novum-organum-book-i-idols-aphorisms-39-44
    citation: "Francis Bacon, *Novum Organum* (1620), Book I aphorisms XXXIX-XLIV (introduction of the four Idols framework) + XLV-LII (Idola Tribus elaboration). Project Gutenberg #45988, Joseph Devey 1902 edition based on the 1620 Latin original. PD; in the lexicon corpus (acquired ). Bacon's foundational catalogue of systematic-bias-sources at four layers: Idola Tribus (Tribe) inherent in human nature; Idola Specus (Den / Cave) idiosyncratic to each individual from upbringing/education/temperament/reading; Idola Fori (Marketplace) imposed by the conventions of language itself; Idola Theatri (Theatre) inherited from the dogmas of received philosophical-systems. Methodologically-distinct from Walton-Reed-Macagno 2008 along three axes: (1) Source-catalog vs scheme-form: Bacon catalogues four DISTINCT SOURCES of bias (species-level innate / individual-level disposition / language-level conventions / doctrine-level inherited frameworks) whereas Walton extracts an abstract scheme-form for deploying bias-attribution as a dialectical move. Bacon answers 'where does bias come from?'; Walton answers 'how is bias-attribution argued?'. The two frames cohere: Bacon's four Idols supply the canonical source-typology for what makes CQ3 (substrate-grounded bias-attribution) actually grounded — naming the Idol-class IS the structural-incentive identification. (2) Programmatic-epistemic-reform vs per-dialogue-instrument: Bacon situates the Idols within his programmatic reform of natural philosophy (the doctrine of Idols 'bears the same relation to the interpretation of nature as that of the confutation of sophisms does to common logic'); Walton's scheme is a per-dialogue per-argument instrument. Bacon offers the system-level diagnosis; Walton operationalizes the diagnosis into a per-case dialectical move. (3) Idol-as-distortion-mechanism vs Bias-as-credibility-issue: Bacon frames the Idols as DISTORTING MECHANISMS that systematically warp human cognition's relation to nature (the human mind 'resembles those uneven mirrors which impart their own properties to different objects'); Walton frames bias as a CREDIBILITY-ATTRIBUTABLE property of an arguer's evidence-handling. Bacon's framing is closer to lex-t9fs7/0134/0383 cognitive-bias substrate-primitive territory; together with Walton's scheme-frame, lex-xqamc sits cleanly at the intersection of cognitive-mechanism (Bacon) and dialectical-deployment (Walton). Together: Bacon 1620 is the foundational catalogue of where systematic bias comes from in human cognition; Walton 2008 catalogues how bias-attribution is deployed argumentatively. Both substantively orthogonal contributions to the same substrate-pattern. Aphorisms XLV-LII elaborate Idola Tribus with specific sub-mechanisms (anticipating modern cognitive-bias literature by ~360 years): the imposition-of-order bias (XLV), the confirmation bias (XLVI: 'although most cogent and abundant instances may exist to the contrary, yet either does not observe or despises them'), the affirmative-emphasis bias (XLVI 'more moved and excited by affirmatives than negatives'), the availability/recency bias (XLVII: 'most excited by that which strikes and enters the mind at once and suddenly'), the motivated-reasoning bias (XLIX: 'man always believes more readily that which he prefers')."
    quote: "(Aphorisms XXXIX-XLIV, on the Four Idols, Devey 1902:) XXXIX. Four species of idols beset the human mind,(9) to which (for distinction’s sake) we have assigned names, calling the first Idols of the Tribe, the second Idols of the Den, the third Idols of the Market, the fourth Idols of the Theatre. XL. The formation of notions and axioms on the foundation of true induction is the only fitting remedy by which we can ward off and expel these idols. It is, however, of great service to point them out; for the doctrine of idols bears the same relation to the interpretation of nature as that of the confutation of sophisms does to common logic.(10) XLI. The idols of the tribe are inherent in human nature and the very tribe or race of man; for man’s sense is falsely asserted to be the standard of things; on the contrary, all the perceptions both of the senses and the mind bear reference to man and not to the universe, and the human mind resembles those uneven mirrors which impart their own properties to different objects, from which rays are emitted and distort and disfigure them.(11) XLII. The idols of the den are those of each individual; for everybody (in addition to the errors common to the race of man) has his own individual den or cavern, which intercepts and corrupts the light of nature, either from his own peculiar and singular disposition, or from his education and intercourse with others, or from his reading, and the authority acquired by those whom he reverences and admires, or from the different impressions produced on the mind, as it happens to be preoccupied and predisposed, or equable and tranquil, and the like; so that the spirit of man (according to its several dispositions), is variable, confused, and as it were actuated by chance; and Heraclitus said well that men search for knowledge in lesser worlds, and not in the greater or common world. XLIII. There are also idols formed by the reciprocal intercourse and society of man with man, which we call idols of the market, from the commerce and association of men with each other; for men converse by means of language, but words are formed at the will of the generality, and there arises from a bad and unapt formation of words a wonderful obstruction to the mind. Nor can the definitions and explanations with which learned men are wont to guard and protect themselves in some instances afford a complete remedy--words still manifestly force the understanding, throw everything into confusion, and lead mankind into vain and innumerable controversies and fallacies. XLIV. Lastly, there are idols which have crept into men’s minds from the various dogmas of peculiar systems of philosophy, and also from the perverted rules of demonstration, and these we denominate idols of the theatre: for we regard all the systems of philosophy hitherto received or imagined, as so many plays brought out and performed, creating fictitious and theatrical worlds. Nor do we speak only of the present systems, or of the philosophy and sects of the ancients, since numerous other plays of a similar nature can be still composed and made to agree with each other, the causes of the most opposite errors being generally the same. Nor, again, do we allude merely to general systems, but also to many elements and axioms of sciences which have become inveterate by tradition, implicit credence, and neglect. We must, however, discuss each species of idols more fully and distinctly in order to guard the human understanding against them. XLV. The human understanding, from its peculiar nature, easily supposes a greater degree of order and equality in things than it really finds; and although many things in nature be _sui generis_ and most irregular, will yet invent parallels and conjugates and relatives, where no such thing is. Hence the fiction, that all celestial bodies move in perfect circles, thus rejecting entirely spiral and serpentine lines (except as explanatory terms).(12) Hence also the element of fire is introduced with its peculiar orbit,(13) to keep square with those other three which are objects of our senses. The relative rarity of the elements (as they are called) is arbitrarily made to vary in tenfold progression, with many other dreams of the like nature.(14) Nor is this folly confined to theories, but it is to be met with even in simple notions. XLVI. The human understanding, when any proposition has been once laid down (either from general admission and belief, or from the pleasure it affords), forces everything else to add fresh support and confirmation; and although most cogent and abundant instances may exist to the contrary, yet either does not observe or despises them, or gets rid of and rejects them by some distinction, with violent and injurious prejudice, rather than sacrifice the authority of its first conclusions. It was well answered by him(15) who was shown in a temple the votive tablets suspended by such as had escaped the peril of shipwreck, and was pressed as to whether he would then recognize the power of the gods, by an inquiry, But where are the portraits of those who have perished in spite of their vows? All superstition is much the same, whether it be that of astrology, dreams, omens, retributive judgment, or the like, in all of which the deluded believers observe events which are fulfilled, but neglect and pass over their failure, though it be much more common. But this evil insinuates itself still more craftily in philosophy and the sciences, in which a settled maxim vitiates and governs every other circu"
canonical-instances:
  - "expert-opinion bias-attack (Walton's worked instance): a 'neutral scientist' on a panel discussing industrial pollution is revealed to sit on the board of directors of a polluting industry. The bias-attack succeeds because the structural-incentive is documented (CQ2 met) and the dialogue-type is persuasion (CQ1 met). lex-xqamc here is parasitic on lex-kebfa expert-opinion — the bias-attack is strongest against expert-opinion arguments because expert-credibility presumes unbiased opinion"
  - "industry-funded research credibility-undermining: 'this safety study was funded by the manufacturer; therefore the manufacturer is less likely to have taken contrary evidence into account.' Classic argument-from-bias deployment in scientific-policy discourse. CQ2 evidence-base is the funding-disclosure; CQ3 substrate-grounding is the structural-incentive of repeat-business + reputation"
  - "political-advocacy organization credibility: 'this report comes from an advocacy organization whose explicit mission is X; therefore their report on X's effects is less likely to have taken contrary evidence into account.' Argument-from-bias at organizational scale. The CQ4 steelman-test fires hard here: if the report's evidence-base is independently-replicable, the bias-attack does not undermine the substantive claims"
  - "circumstantial-ad-hominem variant (Walton 2008 Ch.5 §6): the bias-attack escalates from credibility-undermining (lex-xqamc) to ethical-character attack ('a is biased; therefore a is a morally bad person'). The escalation is fallacious because bias is not equivalent to bad faith — it is a structural-position issue, not a moral-character issue. Walton documents the escalation explicitly p.157"
  - "media-source bias attribution in news consumption: 'this outlet is part of conglomerate X; therefore their reporting on conglomerate X's competitors is suspect.' Argument-from-bias at media-institution scale. CQ3 substrate-grounding is the parent-company structural-incentive; CQ4 steelman is whether the specific claims survive independent verification"
  - "conflict-of-interest disclosure norms in academia / medicine / law: the institutionalized response to argument-from-bias risk. Disclosure-of-funding requirements pre-empt CQ2 (the structural-incentive becomes visible by default) and shift the bias-attack from accusation to discounted-credibility-baseline"
  - "lex-kebfa expert-opinion contrast: lex-kebfa's own CQ-on-bias is the bias-CQ within expert-opinion scheme. lex-xqamc is the parent SCHEME for which 'expert-arguer is biased' is one instance — bias-attack also works against lex-utn22 position-to-know, lex-aut4h commitment, and lex-9uac6 verbal-classification arguers"
  - "lex-t9fs7/0134/0383 cognitive-bias atoms contrast: those are substrate-mechanism atoms describing how reasoners ACTUALLY produce biased conclusions (confirmation, anchoring, survivorship). lex-xqamc is the dialectical-move atom describing how an arguer's bias is DEPLOYED as a credibility-undermining argument. The two layers cohere — when you make a bias-attack via lex-xqamc, lex-t9fs7/0134/0383 are what supply the mechanistic-grounding for what 'biased' means"
