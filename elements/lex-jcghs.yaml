evokes: [radin-winnebago-hare-cycle, hare-and-his-grandmother, the-people-will-live-peacefully-and-forever, my-grandmother-has-spoiled-it]
lineage:
  - source: primary
    text: radin-hares-grandmother-revokes-immortality-by-modeling-its-scale
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 23. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Then Hare thought to himself, 'Now the people will live peacefully and forever.' But the old woman, his grandmother, said, 'Grandson, your talk makes me sad. ... How can your uncles and aunts live as you do? Earthmaker did not make them thus. All things have to have an end. You yourself in your travels around the country must have seen trees fallen to the ground. That is their end; that is their death. And when you see grass lying flat on the ground, it is dead. Everything will have an end. I also will have an end as I am created that way.' ... 'Grandson, thus it is,' said the old woman, 'I have been created small and if all the people live for ever they would soon fill up the earth. There would then be more suffering than there is now, for some people would always be in want of food if they multiplied greatly. That is why everything has an end.' Then Hare thought for a long time. 'A good thing I had obtained for my uncles and my aunts but my grandmother has spoiled it.'"
canonical-instances:
  - "A city council approves free, unlimited street parking for residents, reasoning that it clearly benefits any one household, then has to reverse the policy once modeling shows that if every household actually used it, there would be more cars than curb space and gridlock every night."
  - "A company grants unlimited paid time off, expecting it to obviously help any individual employee, then has to walk it back once it becomes clear that if everyone actually took the time off they were entitled to, coverage would collapse and the same amount of work would fall on fewer available people."
critical-questions:
  - "Is the grandmother's argument actually about the scale of the benefit, or is it a broader claim that death is intrinsically necessary regardless of population, and does the story's framing, tying mortality specifically to overcrowding and food scarcity, support the narrower reading?"
  - "Does Hare have any way he could have anticipated this objection himself before securing the gift, or does the story present the flaw as something that could only be caught by someone else, his grandmother, evaluating the wish from outside his own excitement about it?"
  - "Is there a version of the gift that could have been structured to avoid the overcrowding problem, a limited extension of life rather than a total end of death, and does the story's all-or-nothing framing obscure that a scaled-down version might have kept the original benefit intact?"
