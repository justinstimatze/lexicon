id: lex-2dhcp
name: sabotaging-a-targets-own-body-in-advance-engineers-their-public-exposure
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "One especially patient form of revenge doesn't attack a target directly; it alters something about them in advance, offers them a genuinely tempting opportunity, and lets their own body or behavior produce the humiliation in public, at a moment the saboteur has already chosen to be watching. In Radin's Winnebago Trickster cycle, Trickster recognizes a disguised traveler as an old enemy and sets up an elaborate, delayed trap. He offers a real incentive -- 'the chief's daughter is in love with you' -- then secretly feeds the target a doctored mixture before the encounter: 'Trickster took some fish-oil and some artichoke roots, pounded them together and gave them to the young man to eat. He did this purposely in order to play a trick on him.' He escorts the target to the very moment of vulnerability and watches: 'About daybreak something terrible happened! The young man was just about to go away when the oil that he had eaten caused him to have a passage. He did not know, however, that it was Trickster's doing.' The instant it happens, Trickster is ready with the public announcement: 'Then Trickster shouted, 'The traveller has soiled the chief's daughter!' He went through the entire village announcing it.' The target never sees an attack coming, because there wasn't one in the moment it mattered -- the sabotage was already inside him, and all Trickster had to do was wait and narrate. Diagnostic move: when an unusually generous, specific opportunity arrives from someone with a known grievance against you, and you're asked to consume, sign, or accept something first as part of accepting it, treat the offer and the thing you're asked to take in beforehand as one combined event, not two separate ones."
