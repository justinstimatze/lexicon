id: lex-9hapj
name: isolate-a-conflated-property-by-excluding-its-rival-failure-mode
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Ashley noticed that knot-tiers spoke of a knot's 'strength' as a single property. It actually covers two different failure modes: slipping, where the knot's parts pull free under load, and breaking, where the material itself parts under load. These don't move together -- 'both are not present in any two knots in the same degree' -- so a knot built to resist one failure mode gains nothing on the other, and can even lose ground there: 'A secure knot often breaks; a strong knot often slips.' The ordinary strength test -- load a sample until it fails, note the load -- can't tell the two apart, because either failure mode can end the test first, so the same number conflates whichever one happened to win the race in that particular sample. Ashley's fix changed which failure mode could win at all. To test security, use a material that will slip before it breaks. To test strength, use a material that will break before it slips. Each axis gets measured by choosing test conditions where the rival failure mode is physically excluded from occurring first -- the exclusion happens in the setup, before any data is collected, rather than in how the resulting numbers get averaged. The transferable move: when a familiar word is doing duty for two properties that can trade off against each other, don't design one test and hope the number sorts itself out -- name the two axes, then for each one build a test where the OTHER axis's failure mode cannot preempt the one you're trying to read off. A test that leaves both failure modes live will keep crediting or blaming the wrong axis for results that actually belong to its rival."
related: [lex-mnxhs, lex-jue9r]
scaffolds-from: [lex-jue9r]
evokes: [ashley-book-of-knots, security-vs-strength, secure-knot-often-breaks-strong-knot-often-slips, nip, sheet-bend-vs-left-hand-sheet-bend, choose-the-test-material-not-the-average, force-the-confound-out-of-the-test]
lineage:
  - source: primary
    text: ashley-1944-the-ashley-book-of-knots
    citation: "Clifford W. Ashley, The Ashley Book of Knots (Doubleday, 1944), introductory chapter on knot testing, immediately preceding the Bends chapter (#63-67)."
    quote: "'Many experiments have been made with the object of determining the relative strength of knots. But so far as I know the quality of security has not been considered, or else has been regarded as one of the properties inherent in, or covered by, the term “strength.” Yet the two cannot be measured at the same time, and both are not present in any two knots in the same degree. A secure knot often breaks; a strong knot often slips. ... A. The security of a knot is determined by the stress it will endure before it slips. To determine security a material is required that will slip before it breaks. B. The strength of a knot is determined by the stress it will endure before it breaks. To determine strength a material is required that will break before it slips.'"
canonical-instances:
  - "A team ships a caching layer and measures it with one number, 'reliability,' which actually bundles two different failure modes: serving stale data (a correctness failure) and failing to serve any data (an availability failure). A design that retries aggressively on miss looks more 'reliable' by the availability number while quietly getting worse on the correctness number, because the single test never separated which failure mode a given incident was."
  - "A hiring process tests candidates with one interview loop and calls the result 'competence,' when it actually bundles two different failure modes: giving a confidently wrong answer under time pressure, and freezing rather than answering at all. Two candidates can score the same on the loop's pass rate while failing in opposite ways that call for opposite remediation."
  - "Operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition: that atom resolves a design contradiction by splitting the SAME contested parameter across time, space, or context so a system can satisfy both extremes at once (a wall thin here, thick there). This atom does not attempt to resolve or design around the trade-off at all -- it is a measurement technique for finding out, cleanly, which of the two conflated axes a given failure or a given test result actually belongs to."
  - "Operationally distinct from lex-jue9r categorical-axis-decomposition: that atom partitions an entire design space into orthogonal categorical axes so the whole space (the cross-product of axes) can be analyzed. This atom starts from exactly two axes that a single familiar word has already hidden from view, and its payload is the test-construction step -- choosing conditions where one axis's failure mode is physically excluded -- not axis enumeration."
critical-questions:
  - "How do you know there really are two axes, rather than measurement noise on one? Ashley's evidence was structural: the two conditions he names -- material that slips before breaking vs. breaks before slipping -- are mutually exclusive by construction, a distinction built into the test setup itself rather than read off a noisy dataset after the fact. Splitting a single real property into two invented 'axes' just because a test is noisy manufactures a distinction that isn't there."
  - "Can you actually build a test condition where the rival failure mode is excluded, or only one where it's less likely? Ashley's mohair-yarn material choice was close to a clean exclusion; many real systems (the caching and hiring examples above) can only make one failure mode less probable, not impossible, so the resulting number is cleaner but still not pure."
  - "Once you have two clean numbers, do they actually trade off in practice, or did they just look independent under artificial test conditions? Ashley found actual anti-correlation in his own bend data; a domain where the two axes turn out to move together after all doesn't need this technique -- one number was fine."
status: active
