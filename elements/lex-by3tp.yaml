id: lex-by3tp
name: a-common-measure-must-lack-the-qualities-it-measures
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you need a single common measure to compare two things that have nothing else in common -- a camel and a bag of saffron, a house and a length of cloth -- the measuring instrument itself has to be qualitatively empty. The Persian theologian al-Ghazali's account of why gold and silver became money: they're otherwise useless metals, and that uselessness is exactly the precondition for the job. Think of a colorless mirror: because it has no hue of its own, it can reflect any color faithfully. Tint the glass, and every reflection skews toward that tint instead. Money has to carry no intrinsic value or use of its own. Pricing everything in barrels of oil, for instance, would quietly privilege things that resemble oil, dragging every comparison toward whatever the measure itself happens to be good for. Watch for this whenever something is proposed as a neutral common denominator across incommensurable things: a single metric, a universal translator, a lingua franca, a reference currency. Check whether it actually lacks the qualities it's meant to measure. A measure with its own stake in the comparison isn't neutral, whatever it claims."
related: []
evokes: [david-graeber, debt-the-first-5000-years, al-ghazali, money-as-measure, mirror-metaphor, common-denominator]
lineage:
  - source: primary
    text: graeber-2011-debt-ghazali-dirhams-useless-like-stones
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.10 'The Middle Ages,' section 'The Near West: Islam (Capital as Credit),' citing al-Ghazali."
    quote: "“Dirhams and dinars are not created for any particular purpose; they are useless by themselves; they are just like stones. They are created to circulate from hand to hand, to govern and to facilitate transactions. They are symbols to know the value and grades of goods.”"
  - source: primary
    text: graeber-2011-debt-ghazali-mirror-with-no-color
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.10 'The Middle Ages,' section 'The Near West: Islam (Capital as Credit),' citing al-Ghazali."
    quote: "“A thing can only be exactly linked to other things if it has no particular special form or feature of its own—for example, a mirror that has no color can reflect all colors. The same is the case with money—it has no purpose of its own, but it serves as medium for the purpose of exchanging goods.”"
canonical-instances:
  - "The direct textual anchor, on the problem money's uselessness solves in the first place: “There is no similarity between saffron and camel so that equal amount of that weight and form can be given.”"
  - "Hypothetical: a hiring committee wants a single score to compare candidates from wildly different backgrounds -- a poet, a welder, a research scientist. They settle on 'years of relevant experience' as the common measure, not realizing that this criterion isn't neutral at all: it happens to favor whichever career path accumulates the most legible year-counts, quietly tilting every comparison toward the candidate whose work looks most like a conventional career ladder."
critical-questions:
  - "Ghazali's mirror metaphor implies perfect neutrality is achievable if the measure is sufficiently 'empty' -- but even gold and silver have real-world properties (durability, scarcity, divisibility) that shape what kind of economy can be built on them. Is any measuring instrument ever truly qualityless, or does the mechanism actually describe a matter of degree, where the goal is minimizing rather than eliminating the measure's own bias?"
  - "If money's usefulness as measure depends on having no intrinsic use of its own, what happens when a formerly 'useless' commodity money (gold, silver) develops new industrial uses (electronics, medicine) that give it independent value? Does the mechanism predict that such a metal becomes a worse common measure over time, and is there evidence this has actually happened to any historical currency?"
status: active
