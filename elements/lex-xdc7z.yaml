id: lex-xdc7z
name: gossip-distributes-reputation-information-letting-cooperation-scale-past-direct-observation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a cooperating group grows past the size where every member can directly observe every other member's reliability, GOSSIP becomes the low-cost monitoring substrate that lets cooperation continue. Without gossip, free-riders extract value and move to a new partner before they can be caught — the cheating signature can't travel faster than the cheat. With gossip, reputation-information propagates as a side-channel of ordinary social conversation: 'two-thirds of conversation is taken up with matters of social import — who's doing what with whom, whether it's a good or a bad thing, who's in and who's out, and why' (Dunbar's field observation). Gossip is not a moral failure or a degenerate use of language; it is the structural mechanism that scales cooperation past dyadic-trust. The transferable corollaries: (1) anonymous interaction degrades trust because the gossip-channel is severed (Reddit pseudonyms, Tor markets, gig-economy stranger-transactions); (2) formal mechanisms like reference checks, credit scores, online reviews, and HR records are FORMALIZED GOSSIP — they reconstitute the reputation-substrate in larger groups using explicit records instead of whispered networks; (3) corporate cultures that prohibit 'speaking ill of colleagues' are trying to block the universal mechanism and predictably produce information-vacuum failures (free-riders persist longer; abusive managers are not surfaced; the org loses the ability to self-cleanse); (4) the felt urge to vent about a difficult colleague to a trusted peer is the gossip-mechanism firing — useful for the transferable diagnostic; (5) communities-of-practice retention depends on gossip channels (the technical-water-cooler, the Slack #venting room) because trust-formation requires the reputation-substrate to be alive. Diagnostic for whether gossip is operating productively: does reputation-information actually propagate across the network, OR does it pool in cliques while the at-risk parties (newcomers, the marginalized, those outside the gossip channels) remain uninformed? Pooled-gossip is the predictable failure mode."
