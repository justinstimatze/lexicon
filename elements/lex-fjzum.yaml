id: lex-fjzum
name: doubling-as-morally-antithetical-self-formation-enables-atrocity-by-ordinary-people
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When ordinary people commit atrocity, suspect doubling: the development of a morally antithetical second self that operates in the atrocity context. Lifton's pattern. The same person ISN'T behaving inconsistently; two functional selves are in rotation."
