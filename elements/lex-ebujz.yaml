id: lex-ebujz
name: truth-and-fiction-are-mutually-convertible-depending-on-narrative-frame
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Recognize this pattern when a narrative's own internal frame-device makes it impossible to say, once and for all, whether its content is 'true' or 'fictional' — and, crucially, when the text itself explicitly thematizes this undecidability as a general claim about how truth and falsehood, real and unreal, convert into each other depending on which narrative frame-level a reader occupies, rather than leaving the doubled status as an unexamined structural convenience. Cao Xueqin's Hongloumeng (Dream of the Red Chamber, composed mid-18th century, first printed complete 1791) states this claim as its organizing conceit and repeats it verbatim as a structural refrain. The novel presents itself as the transcribed 'Record of the Stone': a sentient block left over when the goddess Nü Wo (Nüwa) repaired the sky with 36,500 of 36,501 prepared stones, which begs a passing Buddhist monk and Taoist priest to grant it a turn at mortal experience; it is transformed into a 'Precious Gem of Spiritual Perception,' incarnated into the novel's protagonist, lives out the entire story the reader reads, and is afterward found again — now covered in its own engraved account of what it lived through — by the Taoist K'ung K'ung, who copies the inscription down and passes it into the world. The novel's own opening chapter states outright that its author 'designedly concealed the true circumstances' behind 'the attributes of perception and spirituality' and 'made use of such designations as Chen Shih-yin (truth under the garb of fiction) and the like' — glossing its own central character-naming device (Chen Shih-yin, 'truth concealed'; Chia Yü-ts'un, surnamed with the novel's central family name, a homophone the text plays on for 'fiction/false') as a deliberate enactment of the truth/fiction doubling at the level of names, not just plot. Authorship itself is displaced through the frame: the historical author, Tsao Hsüeh-ch'in (Cao Xueqin), appears inside his own novel's frame-story only as a later reviser who spent 'ten years' revising 'the Record of the Stone' — the book presents its actual author as merely an editor of a stone's already-existing, already-true autobiographical record, while presenting that record, transparently, as invented fiction. The crucial textual move — the reason this is a portable claim and not just 'the novel has a frame story' — is a couplet the text inscribes on a stone gateway at the threshold of 'The Visionary Confines of the Great Void' / 'the Land of Illusion,' and repeats VERBATIM at two separate, structurally matched moments (Chen Shih-yin's dream-vision in Chapter I; Chia Pao-yü's dream-vision in Chapter V): 'When falsehood stands for truth, truth likewise becomes false; / When naught be made to aught, aught changes into naught.' This is not a throwaway aphorism but the novel's explicit, repeated statement of its own operating logic: truth/falsehood and real/unreal are not fixed, opposed properties inherent in a piece of content, but functions of which frame-level — the stone's own lived 'reality' versus the reader's outer 'fiction' — one is reading from at a given moment; content that is 'real' at the inner frame (the stone's actual experience) is simultaneously 'false'/'illusory' at the outer frame (the novel the reader is told is invented), and the text insists there is no frame-independent fact of the matter that settles which status is the truly correct one. DIAGNOSTIC USE: apply this atom when a text, testimony, or artifact is presented as simultaneously authentic-record and acknowledged-invention, and the interesting move is not resolving the contradiction but noticing that the content's truth-status is frame-indexed. Cross-domain applications: (a) 'based on a true story' / 'inspired by actual events' film and docufiction framing — the same scene is marketed as true (to buy emotional credence) and legally hedged as fictionalized/dramatized (to buy protection from factual liability), and disputes about such works are usually disputes about which frame is operative in a given moment, not disputes about the underlying facts; (b) autobiographical fiction and romans à clef — an author denies the novel is 'about' real people while readers correctly recognize lived material inside it; both claims can be true at their respective frame-levels; (c) courtroom reconstructions and docudrama — a reenactment is simultaneously an evidentiary aid (treated as functionally real for persuasive purposes) and an acknowledged non-event (a performance, not the crime); (d) religious and scriptural reading — the same narrative can be literally-historically true within a faith-frame and myth/parable within a secular-critical frame, and cross-frame arguments about scripture are frequently disputes about which frame governs, dressed up as disputes about the content; (e) simulation and dream arguments — Zhuangzi's butterfly dream, Descartes' dream/evil-demon doubt, and contemporary 'simulation realism' arguments all share the Red Chamber structure: content fully real from within a frame (the dream, the simulation) is simultaneously unreal from the frame that contains it, with no privileged, frame-independent vantage from which to declare one frame the 'actually real' one; (f) AI-generated or synthetic testimony — a simulated agent's reported 'experience' is functionally real to the frame it operates in while being acknowledged synthetic relative to its operators' frame, and disputes about whether such testimony 'counts' are disputes about which frame is doing the counting. FAILURE MODES: (a) treating the doubled truth/fiction status as a contradiction to be resolved (deciding once and for all whether X is 'really' true or 'really' fiction) rather than as a frame-indexed structure where both statuses can hold without contradiction at their respective levels; (b) missing that the frame-device itself can launder authorial accountability — crediting an in-story intermediary (the stone, 'these are real case files,' 'a true story') can function rhetorically to claim the emotional credibility of truth while evading the accountability of factual assertion, which is a distinct, evaluable move from the sincere, thematized frame-relativity Cao Xueqin's text performs; (c) conflating this atom with a generic 'story within a story' structural observation — the claim here is specifically about truth-VALUE being frame-relative, stated by the text itself as a general principle (the couplet), not merely the formal fact of narrative nesting. DISTINCT from lex-6xw55 (Borges, same-text-in-different-context-is-a-different-work): lex-6xw55's axis is DIACHRONIC — identical marks (Cervantes' and Menard's word-for-word-identical Quixote) acquire different meaning because the historical CONTEXT OF AUTHORSHIP differs; the marks are fixed, the surrounding context varies across time. This atom's axis is SYNCHRONIC and STRUCTURAL — a single continuous narrative is assigned two different truth-values (real / fictional) at once, in the same reading, because it is being read at two different nested FRAME-LEVELS (the stone's diegetic experience versus the novel's status as an authored artifact) of the SAME text, not because of a change in historical context between two acts of writing. Family resemblance: both destabilize the idea that a text's truth-value or meaning is intrinsic to its marks alone; they diverge on the axis of variation (historical-authorial-context versus nested-frame-level). DISTINCT from lex-2kwkh (Goffman, reality-threshold-crossing): lex-2kwkh is an experiential/design-stance claim about a PARTICIPANT crossing from a hypothetical or staged frame into a consequential one (masks in immersive theater, ARG 'this is not a game' conventions) and what changes, practically, once the threshold is crossed. This atom is a logical/textual claim about how truth and falsehood are, according to the text's own explicit statement, MUTUALLY CONVERTIBLE depending on frame-level — it is not about a participant's phenomenological crossing or a design choice about when a threshold is breached, but about the semantic structure of a narrative's self-presentation as both real and fictional at once, without ever fully crossing from one into the other. Both atoms descend from the same general Goffman-style frame-relativity insight but specialize in different directions: lex-2kwkh specializes into EXPERIENTIAL THRESHOLD-CROSSING (a before/after, participant-facing claim); this atom specializes into TRUTH-VALUE FRAME-INDEXING (a simultaneous, reader-facing claim about a single narrative's doubled status)."
