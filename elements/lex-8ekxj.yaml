id: lex-8ekxj
name: grief-over-an-unrealized-windfall-mimics-the-grief-of-real-loss
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Losing something you were promised but never actually possessed can produce grief indistinguishable from losing something you genuinely held, even though nothing measurable in your actual circumstances has changed. In the Jataka's tale of the greedy king, a stranger promises him three cities, then vanishes having taken no payment or lodging, leaving no trace to pursue. The king, who never held the cities for even a moment, sickens from the loss exactly as though they'd been seized from him: 'What glory has been snatched from me!' he groaned. His blood grew disordered, dysentery took hold, and no physician could cure him. The grief tracks the size of the imagined gain, not the reality of what was ever actually in hand — a purely mental construction can produce a fully physical collapse."
related: []
evokes: [jataka, dukanipata, kamanita-jataka, imagined-loss-of-an-unrealized-gain-produces-real-grief, a-promise-never-fulfilled-still-registers-as-a-loss]
lineage:
  - source: primary
    text: jataka-chalmers1895-kamanita-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 228, Kamanita-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "What glory has been snatched from me!"
canonical-instances:
  - "An employee who was verbally promised a promotion by a departing manager, with nothing ever formalized, spirals into real depression when the new manager fills the role with someone else, grieving a position they never actually held for a single day."
critical-questions:
  - "Is the king's grief really irrational, or is it tracking something real — the revealed fact that he is the kind of target scammers see as gullible, which is a genuine loss of standing even though the specific cities were never real?"
  - "Would the grief have been milder if the stranger had asked for even a token payment first, giving the king some tangible loss to point to, or does the size of the imagined gain alone fully explain the intensity of his reaction regardless of what was actually exchanged?"
