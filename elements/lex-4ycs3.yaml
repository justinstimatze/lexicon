    quote: "“in a deeply sexist society governed by rules about how women should dress, a woman may lack the courage to appear with her head uncovered, even though she would prefer not to conceal her hair. To note that the person was, in fact, free to undertake the necessary action... is not adequate for guaranteeing the realization of the appropriate rights in such cases. The phenomenon of 'choice inhibition' must not be assumed away... ... the right to poverty relief may be seen as being compromised, even when no actual application is refused, because of a decision of a would-be recipient not to apply for assistance despite wanting to have legitimate benefits. The failure to apply may be related to such factors as worry about social stigma... Even though the person could have got social support if he or she had chosen to apply for it, that in itself is an inadequate basis of being sure that the formal availability of a choice was a real availability.”"
canonical-instances:
  - "Hypothetical: A company's anonymous harassment-reporting hotline sits at near-zero usage year after year, and leadership cites the number as evidence the workplace is healthy. Exit interviews later reveal employees knew the hotline existed and had real complaints, but stayed silent out of fear that 'anonymous' reports would still be traced back to them. The formal channel was fully available; using it was never actually costless."
  - "Hypothetical: A country's disability benefits program has generous eligibility rules and a straightforward application, yet uptake among eligible people is low. A survey finds most non-applicants knew they qualified but didn't apply because filing marks them in official records as disabled, a label they feared would affect future employment or how neighbors treated them. The benefit exists; claiming it exacts a price the eligibility rules never priced in."
critical-questions:
  - "Doesn't this make almost any right potentially 'unrealized,' since claiming any right involves at least some minor friction or exposure? The diagnostic isn't triggered by ordinary friction (filling out a form, waiting in line) -- it's triggered when the cost of claiming is a real deterrent for a meaningful share of the people entitled to it, evidenced by suspiciously low uptake relative to eligibility. Ordinary friction slows people down; choice inhibition stops them from claiming at all."
  - "How would you fix a right compromised by choice inhibition, if the barrier isn't a rule that can simply be repealed? Sen doesn't offer one universal fix, but the examples point toward the shape of one: reducing the exposure or stigma attached to claiming (anonymizing records, normalizing use, active outreach), rather than assuming the right is fine because the rulebook imposes no formal obstacle."
