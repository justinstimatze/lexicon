canonical-instances:
  - "A hiring pipeline's 'would this feel fair from a random candidate's seat' fairness check gets satisfied by a lottery-style tiebreaker that gives 99 of 100 finalists a fair shot and locks the 100th out entirely on an arbitrary technicality, because the policy's average expected treatment across the finalist pool stays high. The rare bad slot never registers when the arithmetic averages it against ninety-nine good ones."
  - "A city's project-siting rule promises 'no neighborhood would object if it didn't know which one would host the landfill' and treats 19-to-1 odds of missing out as proof of fairness, without ever asking what happens to the one that draws it. A maximin version of the same check, which asks only how bad the worst outcome is, rejects it outright regardless of the odds."
critical-questions:
  - "Isn't 1% an artificially small number picked to make the test look bad -- wouldn't a more realistic ratio make the impartial test come out fine? The objection isn't about where exactly the number sits: expected-value impartiality has no ratio at which it structurally refuses the trade, since some ratio of free men to slaves always makes the arithmetic favor accepting it. The finding is that such a ratio exists at all -- which one it is doesn't matter."
  - "Doesn't the maximin alternative just trade one failure for another -- refusing to trade off any improvement for the worst-off, however severe the improvement or minor the loss? Sen doesn't deny this; his own list of criticisms earlier in the chapter includes exactly that maximin is insensitive to the magnitude of what's given up elsewhere. Maximin carries its own cost, just a different one from this atom's -- and choosing between the two frameworks means choosing which failure mode is more livable."
