lineage:
  - source: primary
    tradition: graeber-wengrow-dawn
    text: graeber-wengrow-2021-dawn-of-everything
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Farrar, Straus and Giroux, 2021), Chapter 3 ('Unfreezing the Ice Age') — the real-question reframing."
    quote: "If we are right, and if human beings really have spent most of the last 40,000 or so years moving back and forth between different forms of social organization, building up hierarchies then dismantling them again, the implications are profound. For one thing, it suggests that Pierre Clastres was quite right when he proposed that, rather than being less politically self-conscious than people nowadays, people in stateless societies might actually have been considerably more so."
  - source: primary
    tradition: graeber-wengrow-dawn
    text: graeber-wengrow-2021-dawn-of-everything
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Farrar, Straus and Giroux, 2021), Chapter 4 — the three primordial freedoms."
    quote: "For women as for men, individual freedom was assumed unless there was some specific reason to curtail it. The freedom to abandon one's community, knowing one will be welcomed in faraway lands; the freedom to shift back and forth between social structures, depending on the time of year; the freedom to disobey authorities without consequence — all appear to have been simply assumed among our distant ancestors, even if most people find them barely conceivable today. Humans may not have begun their history in a state of primordial innocence, but they do appear to have begun it with a self-conscious aversion to being told what to do."
canonical-instances:
  - Çatalhöyük (modern Turkey, ~7100-5700 BCE) — a city of thousands of people, organized non-hierarchically, with no palace, no temple-administrative complex, no evidence of ruling elite. Disrupts the 'cities-require-hierarchy' assumption.
  - Cahokia (Mississippi valley, peak ~1100 CE) — large urban center with mound-builder hierarchy, then DELIBERATE DEPOPULATION and abandonment. The descendant societies (per Graeber-Wengrow's reading of Lakota / Osage oral history) consciously rejected re-establishing such structures. Schismogenesis at work.
  - The 'real' Iroquois / Wendat Confederacy — Kandiaronk's articulated critique of European hierarchy via Lahontan's reports shaped Enlightenment political imagination far more than standard history acknowledges.
  - Tripilye 'mega-sites' (Ukraine, ~4100-3300 BCE) — settlements of 10,000+ people in concentric rings; no palace, no central storehouse, no apparent elite. Predates the Bronze Age hierarchical states.
  - Seasonal alternation in Inuit and Northwest Coast bands — communities consolidate into authoritarian winter villages with hereditary chiefs, then disperse in summer to egalitarian foraging bands; the same individuals occupy both structures across the seasonal cycle.
  - Modern intentional communities (Hutterites, kibbutzim, certain monasteries) that show humans CAN sustain non-hierarchical forms with active leveling — but tend to be small, surrounded by hierarchical society, and dependent on continuous recruitment.
