lineage:
  - source: primary
    text: prahalad-hamel-1990-imprisoned-resources
    citation: "C.K. Prahalad and Gary Hamel, 'The Core Competence of the Corporation,' Harvard Business Review, May-June 1990, section 'The Tyranny of the SBU,' subsection 'Imprisoned Resources.' [Citation-status flag 2026-08-19: the file currently pinned in this project's source corpus under this citation (PrahaladHamel-1990-TheCoreCompetenceOfTheCorporation.epub) is not the primary 1990 HBR article -- it is a 2017 Macat International study-guide analysis of the article, and this specific quote does not appear anywhere in it. The quote below is well-documented, widely-quoted Prahalad-Hamel material (the mattress-hoarding metaphor is one of the paper's most-cited illustrations) and reads consistent with the genuine article, but is UNVERIFIED against any primary source currently on hand. The real HBR article is paywalled and not freely downloadable; logged for procurement.]"
    quote: "As an SBU evolves, it often develops unique competencies. Typically, the people who embody this competence are seen as the sole property of the business in which they grew up. The manager of another SBU who asks to borrow talented people is likely to get a cold rebuff. SBU managers are not only unwilling to lend their competence carriers but they may actually hide talent to prevent its redeployment in the pursuit of new opportunites [sic]. This may be compared to residents of an underdeveloped country hiding most of their cash under their mattresses. The benefits of competencies, like the benefits of the money supply, depend on the velocity of their circulation as well as on the size of the stock the company holds."
canonical-instances:
  - "SBU managers hiding talented engineers from other business units to prevent redeployment, causing those engineers' skills to atrophy from disuse rather than being applied to the company's most promising opportunities."
  - "Canon and NEC deliberately building organizational mechanisms to move competence-carrying people quickly across business-unit boundaries, in explicit contrast to Western firms whose larger 'stock' of skills sits underused."
  - "a research lab where each principal investigator hoards trained postdocs and unpublished techniques within their own group, so institutional knowledge duplicates across groups instead of compounding organization-wide."
critical-questions:
  - "isn't it reasonable for a unit to protect the people who make it function well? The claim isn't that units should never retain talent — it's that the retention decision is made on LOCAL incentives (who captures credit, who bears the risk of losing the person) that diverge from the ORGANIZATION-WIDE return on that talent's velocity. A unit protecting its people at the cost of the whole organization's ability to redeploy competence to higher-value opportunities is the specific failure mode, not talent retention per se."
  - "how is this different from lex-yyfx5 coordination-mode-set-by-relative-transaction-costs (Coase)? lex-yyfx5 explains WHY firms exist at all — internal coordination beats market coordination when market transaction costs are high. This atom describes a FAILURE MODE INSIDE an already-formed firm: even once you're coordinating internally rather than through markets, sub-units within the firm can still behave like mini-markets that refuse to trade with each other, recreating the very transaction-cost problem the firm was supposed to solve. lex-7faku names what happens when internal coordination degrades back toward siloed, market-like hoarding."
  - "does higher stock of competence compensate for low velocity? No — the article's own contrast (Western companies' larger stock of skills vs. Canon/NEC's faster movement of a smaller stock) is the point: a large idle stock earns less than a smaller actively-circulating one, in the same way a large sum of hoarded cash contributes nothing to an economy that a smaller, actively-lent sum would generate through velocity."
