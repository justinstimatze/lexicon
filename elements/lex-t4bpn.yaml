id: lex-t4bpn
name: an-unclaimed-comfort-left-in-reach-diagnoses-a-professed-identity-without-asking
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'To find out whether someone''s ascetic or principled self-presentation is real, don''t ask them and don''t watch them under scrutiny — leave an unclaimed, unexplained comfort within reach where only their unwatched behavior can answer the question. In the Bhuridatta-Jataka, a Naga woman finds a prince living as a forest ascetic and, before revealing herself, silently prepares a bed of flowers and perfumes in his hut and leaves: "This is the dwelling-place of some ascetic, I will prove him, whether he is an ascetic from faith or not. If he is an ascetic from faith and bent upon self-abnegation he will not accept my adorned bed; but if he is at heart a lover of pleasure and not an ascetic from faith he will lie down on my bed." He takes it without a second thought, and she reads the answer from that alone.'
related: []
evokes: [jataka, mahanipata, bhuridatta-jataka, character-test, unwatched-behavior, silent-diagnostic]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-bhuridatta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 543, Bhuridatta-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "This is the dwelling-place of some ascetic, I will prove him, whether he is an ascetic from faith or not. If he is an ascetic from faith and bent upon self-abnegation he will not accept my adorned bed; but if he is at heart a lover of pleasure and not an ascetic from faith he will lie down on my bed; then I will take him and make him my husband and dwell here."
canonical-instances:
  - "A landlord suspicious that a new tenant claiming to run a quiet home office is actually subletting leaves a conspicuously easy opportunity to violate the lease unremarked, then simply checks whether it was taken."
  - "A manager who doubts a new hire's claimed expense-report discipline processes an obviously over-generous reimbursement without comment, and reads the hire's real standards from whether they flag the overpayment unprompted."
critical-questions:
  - "The prince fails the test and the Naga woman proceeds anyway, choosing him as a husband precisely because he wasn't the ascetic he claimed — does the test only work as a filter if the tester actually wanted the answer they predicted?"
  - "He was never told a test was happening — does a diagnostic that depends on the subject's total ignorance of being observed carry a different ethical weight than one the subject knowingly consents to?"
status: active
