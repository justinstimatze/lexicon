lineage:
  - source: primary
    text: schelling-1960-strategy-of-conflict-ch2
    citation: "Thomas C. Schelling, *The Strategy of Conflict* (Harvard University Press, 1960), Ch. 2 'An Essay on Bargaining' and §1 'Bargaining Power: The Power to Bind Oneself'. The canonical statement of the commitment-device primitive. Schelling's paradox at the opening of Ch. 2: 'These tactics... rest on the paradox that the power to constrain an adversary may depend on the power to bind oneself; that, in bargaining, weakness is often strength, freedom may be freedom to capitulate, and to burn bridges behind one may suffice to undo an opponent' (p. 22 in the 1960 ed., p. 33 in the 1980 reprint paginated copy used for this mining-pass). The mechanism: when stated intent isn't credible (because the other party knows you can change your mind), you can ENGINEER credibility by taking an irreversible action that makes carrying-out the threat or commitment cheap, mandatory, or costly-to-renege-on. The worked $16,000-house example (pp. 34-37) demonstrates the device formally: a buyer who wants $20,000-valued house for $16,000 can make the commitment credible by entering a $5000 forfeit-bet with a third party — 'unless the seller is enraged and withholds the house in sheer spite, the situation has been rigged against him; the \"objective\" situation — the buyer's true incentive — has been voluntarily, conspicuously, and irreversibly changed' (p. 35). Schelling enumerates the structural requirements: voluntariness, visibility, irreversibility, and asymmetry-of-first-move. The deterrence applications (pp. 13-14) show the same primitive in national strategy: 'making a threat credible by getting ourselves committed to its fulfillment, through the stretching of a \"trip wire\" across the enemy's path of advance, or by making fulfillment a matter of national honor and prestige.' The device is the foundation of Schelling's broader theory of deterrence: a retaliatory threat that the threatened party cannot withdraw is credible BECAUSE it cannot be withdrawn. Mutually-assured destruction force-structure design (Schelling 1966 *Arms and Influence*) extends the primitive into nuclear strategy: automatic launch-on-warning systems and dispersed launch authority are deliberate engineering of irreversibility because the credibility-via-foreclosure is the strategic asset. (Lex-0716 carves the commitment-device primitive separately from lex-k6wka focal-point-coordinates-expectation-via-shared-salience-without-communication, which carves the Ch.3 + Appendix A focal-point primitive. Same author, same book, different chapters, different essential primitives.)"
    quote: "[Schelling 1960 Ch.2 opening, p. 22 (paginated 33 in 1980 reprint):] 'The purpose of this chapter is to call attention to an important class of tactics, of a kind that is peculiarly appropriate to the logic of indeterminate situations. The essence of these tactics is some voluntary but irreversible sacrifice of freedom of choice. They rest on the paradox that the power to constrain an adversary may depend on the power to bind oneself; that, in bargaining, weakness is often strength, freedom may be freedom to capitulate, and to burn bridges behind one may suffice to undo an opponent.' [The $16,000-house worked example, pp. 34-35:] 'But suppose the buyer could make an irrevocable and enforceable bet with some third party, duly recorded and certified, according to which he would pay for the house no more than $16,000, or forfeit $5,000. The seller has lost; the buyer need simply present the truth. Unless the seller is enraged and withholds the house in sheer spite, the situation has been rigged against him; the \"objective\" situation — the buyer's true incentive — has been voluntarily, conspicuously, and irreversibly changed. The seller can take it or leave it. This example demonstrates that if the buyer can accept an irrevocable commitment, in a way that is unambiguously visible to the seller, he can squeeze the range of indeterminacy down to the point most favorable to him.' [The visibility requirement, p. 36:] 'The device, of course, is a needless surrender of flexibility unless it can be made fully evident and understandable to the seller.' [The first-mover advantage, p. 37:] 'If each party knows the other's true reservation price, the object is to be first with a firm offer. Complete responsibility for the outcome then rests with the other, who can take it or leave it as he chooses (and who chooses to take it). Bargaining is all over; the commitment (that is, the first offer) wins.' [Deterrence application, pp. 13-14:] 'We have developed the idea of making a threat credible by getting ourselves committed to its fulfillment, through the stretching of a \"trip wire\" across the enemy's path of advance, or by making fulfillment a matter of national honor and prestige — as in the case, say, of the Formosa Resolution.'"
  - source: practitioner
    text: schelling-1966-arms-and-influence-nuclear-deterrence
    citation: "Thomas C. Schelling, *Arms and Influence* (Yale University Press, 1966). Extends the commitment-device primitive into nuclear deterrence: the credibility of retaliation depends on the structural impossibility of choosing not to retaliate. Automatic launch-on-warning, dispersed launch authority, and committed force-structures are deliberate engineering of irreversibility because the credibility-via-foreclosure is the strategic asset. [Correction 2026-08-30: this entry previously presented a paraphrase of that idea in quotation marks as if it were a direct 1966 quote, while the quote field below already admitted no verbatim text had been extracted. Removed the false quotation marks -- the sentence was never more than a paraphrase of the extends-into-deterrence claim above.] (Schelling shared the 2005 Nobel Memorial Prize in Economic Sciences with Robert Aumann 'for having enhanced our understanding of conflict and cooperation through game-theory analysis' — his commitment-device and focal-point primitives were the foundational contributions cited by the prize committee.) Practitioner reference because the 1966 book popularizes the strategic application; the 1960 *Strategy of Conflict* is the decisive primary."
    quote: "[Schelling 1966 — verbatim quote not extracted here pending re-read of 1966 text; the 1960 primary above carries the transferable claim.]"
canonical-instances:
  - "operationally distinct from lex-zfssj words-once-uttered-cannot-be-recalled-so-speech-is-irreversible-action (Confucian/Aristotelian speech-act): lex-zfssj is the general claim that speech is irreversible action; lex-rfcb7 specializes to the strategic case where a publicly-made commitment's irreversibility is engineered to gain bargaining advantage. lex-zfssj is descriptive about speech; lex-rfcb7 is prescriptive about strategic foreclosure. Compose: lex-zfssj grounds part of why publicly-stated commitments can be credibility-devices — the words cannot be unsaid."
  - "operationally distinct from lex-9pgpf tempo-asymmetry-as-strategic-variable (Boyd OODA + Ostrom + Elster precommitment): lex-9pgpf is the broader claim that timing-of-cycles is itself a strategic variable; lex-rfcb7 specializes to the case where binding yourself faster than the other party can respond gains bargaining advantage. Compose: lex-9pgpf is the upstream tempo-frame, lex-rfcb7 is the specific credibility-mechanism."
  - "operationally distinct from lex-p9dfj designed-procedural-friction-as-reinternalization-of-externalized-costs: lex-p9dfj is about procedural friction reinternalizing costs markets externalized; lex-rfcb7 is about strategic self-imposed friction (irrevocable commitments) that gains bargaining power. Both involve deliberate friction toward different targets."
  - "operationally distinct from lex-d5eew unregulated-individual-choices-aggregate-to-collective-states-no-actor-preferred (Schelling 1971): same author, different works, different primitives. lex-d5eew is the micromotive/macrobehavior gap; lex-rfcb7 is the bargaining-credibility-via-foreclosure tactic — population-aggregate vs. dyadic-bargaining levels of analysis."
  - "Cortez burning his ships at Veracruz (1519): Hernán Cortez ordered his ships destroyed upon landing in Mexico to prevent his troops from retreating. The visible foreclosure of the retreat-option committed the expedition to victory-or-death; the troops' fighting incentive was strategically improved by removing their soft option. Canonical historical instance of the commitment-device primitive — Schelling cites the burning-bridges metaphor (p. 22) explicitly; Cortez is the original."
  - "The $16,000-house worked example (Schelling 1960 pp. 34-35): a buyer who values a house at $20,000 wants to pay only $16,000. The seller knows the buyer would pay more. Standard bargaining theory predicts indeterminacy in the [$16k, $20k] range. The commitment-device move: the buyer signs an irrevocable bet with a third party — pay no more than $16,000 for the house or forfeit $5,000. The seller is now structurally squeezed: any sale above $16,000 nets the buyer less than $16,000-$5,000=$11,000, far below the value-to-buyer. The buyer 'wins' the bargaining range by making the credibility come from the foreclosure, not from stated intent. Schelling's quote: 'the situation has been rigged against him.'"
  - "Deterrence via trip-wire (Schelling 1960 pp. 13-14): stationing U.S. troops at NATO front-line positions where they CANNOT be withdrawn before a Soviet advance triggers casualties — this is a deliberate foreclosure of the soft-option (negotiated retreat from the conflict). The trip-wire makes the deterrent threat credible because the threatened retaliation cannot be canceled politically once American casualties have occurred. Berlin garrison (1948-1989) was a paradigm trip-wire commitment."
  - "Doomsday machine / mutually-assured-destruction force structure (Schelling 1966 *Arms and Influence*, Kahn 1960 *On Thermonuclear War*): nuclear retaliation force structured so launch is automatic upon detected first-strike, with dispersed authority preventing rational-reconsideration at the moment of attack. The credibility comes from the engineered impossibility of choosing not to retaliate. (The Cuban Missile Crisis was largely about both sides demonstrating commitment-device positions to each other; the eventual resolution involved Khrushchev backing down by reframing — Schelling 1966 analyzes the dynamics extensively.)"
  - "Agent-with-limited-authority negotiation tactic (Schelling 1960 pp. 35-36): the salesperson who says 'I'd love to give you that price but I'd have to call my manager — let me see' and then comes back with 'the manager says no.' The credibility of the price-floor comes from the agent's STRUCTURAL inability to authorize lower prices, made visible to the buyer. The buyer can take it or leave it. Used systematically in car-dealership tactics, but the structure is general: any negotiator who can credibly point to a binding constraint (board approval, regulatory limit, public-commitment) gains bargaining power that an unconstrained negotiator lacks."
  - "Public commitment / 'I-told-everyone-I'd-quit-smoking-by-March' (folk-psychology): announcing a commitment publicly engineers a reputational cost to renegotiation. The credibility-engineering is internal (motivating-future-self) AND external (signaling commitment to others). Composes with lex-efv3v (chosen-role): the public announcement converts a private intention into a role-claim that the agent's identity now stakes."
  - "Non-refundable deposits and forfeitable bonds (general contract-law application): paying a non-refundable booking fee, a security deposit, or a performance bond converts a soft commitment into a structurally-binding one. The credibility comes from the structural cost of reneging. Real-estate purchase contracts use earnest-money for exactly this; consulting contracts use kill-fees; book-publishers use option-rights with reversion-fees."
  - "Take-it-or-leave-it sealed bids and final offers (auction and negotiation theory): a sealed-bid auction with no second round structurally forecloses negotiation; bidders must commit to a single number under uncertainty. The structural foreclosure of negotiation is what differentiates sealed-bid from open-outcry auctions and what makes the resulting prices different (Vickrey 1961 analyzes the equilibrium implications). The commitment-device primitive underlies the differential dynamics."
  - "operationally distinct from lex-k6wka focal-point-coordinates-expectation-via-shared-salience-without-communication (Schelling 1960 Ch.3): same author + same book, different chapters, different primitives. lex-k6wka is about coordination via salience; lex-rfcb7 is about bargaining via foreclosure. Schelling's *Strategy of Conflict* carries both as distinct contributions; the substrate carries them separately because they are operationally distinct primitives applicable in different situation-types."
  - "operationally distinct from and composing-with lex-efv3v chosen-role-as-non-deliberation-gate: lex-efv3v is the internal cognitive version (role-identity makes the agent un-deliberative); lex-rfcb7 is the external strategic version (foreclosure made visible to the opponent). Compose: a role-keeper who ALSO publicly announces a commitment gains both internal stability and external credibility — the strongest form of self-binding."
  - "Industry entry-deterrence (Porter 1979, 'How Competitive Forces Shape Strategy,' HBR March-April 1979): Porter names retaliation-credibility as one of two independent axes that deter a potential entrant, separate from structural barriers to entry — 'the seriousness of the threat of entry depends on the barriers present and on the reaction from existing competitors that entrants can expect.' Incumbents make retaliation credible by visibly holding the resources to carry it out: 'the incumbents possess substantial resources to fight back, including excess cash and unused borrowing power, productive capacity, or clout with distribution channels and customers.' Structurally the same mechanism as a trip-wire or a doomsday machine — the deterrence works by the potential entrant assessing incumbents' visible capacity to retaliate, not by any promise the incumbents make — applied to a business-entry rather than a military or bargaining context."
critical-questions:
  - "Is the foreclosure VISIBLE to the other party? Schelling's crucial constraint: 'The device, of course, is a needless surrender of flexibility unless it can be made fully evident and understandable to the seller' (p. 36). A precommitment hidden from the opponent is a private cost without strategic effect. Operationally: trace the channel by which the opponent learns of the foreclosure; if the channel is weak or denied, the device fails."
  - "Is the foreclosure ACTUALLY irrevocable, or can it be unwound at a cost the opponent can afford? Schelling's qualifier on contractual bets (p. 36): the third party can be bribed to release the bettor. The device's strength scales with the cost-of-unwinding for the opponent. Diagnose: who has authority to release the commitment, and at what cost to the opponent? If the unwinding is cheap, the device is illusory."
  - "Did you commit FIRST? Schelling's first-mover principle (p. 37): 'the object is to be first with a firm offer. Complete responsibility for the outcome then rests with the other.' If you wait for the opponent to commit first, the foreclosure burden shifts to you. Diagnose: who has just committed visibly, and what choice-set remains for the other?"
  - "Are you mistaking sincerity for credibility? Schelling's deepest point: credibility is not a function of the agent's character or sincerity — it's a function of the *structural impossibility* of choosing otherwise. Sincere stated intent is NOT credible if the opponent knows the agent's incentives could change. Operational corrective: when you need credibility, engineer foreclosure, don't try to be more sincere."
  - "What is the cost of the foreclosure to YOU if the opponent calls your bluff or chooses the bad outcome anyway? The commitment-device primitive engineers credibility AT A COST — the foreclosed soft option may be one you would have wanted if the opponent chose adversely. Trip-wire troops die if the deterrent fails; the $5000 bet is forfeited if the seller refuses to budge. Diagnose the worst-case cost and check whether the bargaining-power gain is worth it."
  - "Could a competing commitment-device cancel yours? Schelling's example (p. 36): 'if the buyer is an agent authorized by a board of directors to buy at $16,000 but not a cent more... then the buyer \"wins\" — if, again, the seller has not tied himself up with a commitment to $19,000.' Commitment-device battles are first-to-effectively-bind-wins, but a second-commitment-device can leave both parties unable to move. Recognize the deadlock pattern and design escape valves."
  - "Are the conditions for the device ACTUALLY available? Schelling's qualifier (p. 35): 'whether the buyer can find an effective device for committing himself may depend on who he is, who the seller is, where they live, and a number of legal and institutional arrangements (including, in our artificial example, whether bets are legally enforceable).' The cultural / institutional / legal conditions for the device must EXIST. Diagnose: what are the actual binding mechanisms available in your context, and what are their costs and visibilities?"
