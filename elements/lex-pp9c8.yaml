canonical-instances:
  - "An economist is told a model relying on a household's unobservable 'expected future income' should be discarded because expectations can't be directly measured. Dropping the term doesn't make the model more rigorous -- it removes the model's only mechanism for predicting how spending responds to a policy change before that change has happened, leaving nothing to check the prediction against once it's gone."
  - "A machine-learning researcher is pressed to justify an internal hidden-layer feature as 'meaningful' before allowing it into an interpretability report, on the grounds that nothing directly measures what a hidden unit 'represents.' Requiring independent verification of every internal feature before using it at all would rule out using the trained model's structure to generate any testable hypothesis about its behavior in the first place."
  - "Operationally distinct from lex-n3ayj refuse-to-fill-evidence-gaps-with-untested-speculation (Newton's hypotheses non fingo): Newton refuses to assert a mechanism for gravity precisely BECAUSE no observation currently distinguishes among candidate mechanisms, and treats that silence as a discipline worth keeping. Feynman's target is different and points the opposite direction -- concepts that CAN'T be individually checked but that a theory's testable predictions still depend on, where refusing to use them at all (rather than refusing to assert unsupported ones) is the failure mode. The two atoms name a real, live tension rather than a compatible pair: knowing when a gap should be left unfilled (Newton) versus when a construct must be used despite being unverifiable on its own (Feynman) is itself a judgment call the corpus does not resolve for every case."
critical-questions:
  - "How do you tell a construct worth extending (Feynman's electron position, later checked against experiment and found to need revision) from a construct that's just unfalsifiable dead weight dressed up as necessary theoretical machinery? The atom licenses extending concepts past where they've been checked; it doesn't supply the test for which extensions are the productive kind and which are unfalsifiable padding -- that discernment has to come from elsewhere (compare lex-vmas8)."
  - "Feynman's own defense concedes the model can turn out wrong exactly where it extrapolated -- 'someday somebody may come along and say how stupid we were.' What obligation does a model-builder have to flag, ahead of time, which specific unchecked constructs a prediction is currently resting on, so that a later failure can be traced back to the actual extension that broke rather than treated as a diffuse, undiagnosable surprise?"
