id: lex-ngc9z
name: power-traps-its-holder-whether-kept-or-relinquished
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A position of power can trap its holder in a genuine double bind. Keeping it demands perpetual defense against rivals, which means never being safe; giving it up doesn't rescue you either, because the position's enemies and obligations don't dissolve just because you've stepped away. Philosophy grounds this in two historical cases before naming the pattern: 'Nero drove his friend and preceptor, Seneca, to the choice of the manner of his death. Antoninus exposed Papinianus, who was long powerful at court, to the swords of the soldiery. Yet each of these was willing to renounce his power. Seneca tried to surrender his wealth also to Nero, and go into retirement; but neither achieved his purpose. When they tottered, their very greatness dragged them down. What manner of thing, then, is this power which keeps men in fear while they possess it -- which when thou art fain to keep, thou art not safe, and when thou desirest to lay it aside thou canst not rid thyself of?'"
related: []
evokes: [consolation-of-philosophy, book-iii-prose-v, when-thou-art-fain-to-keep-thou-art-not-safe, their-very-greatness-dragged-them-down, damned-if-you-hold-it-damned-if-you-dont]
