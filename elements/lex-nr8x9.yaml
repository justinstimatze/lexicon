id: lex-nr8x9
name: externally-identical-changes-can-differ-in-hidden-structural-quality
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a modification to a system passes every test and reproduces the exact behavior asked for, that's not evidence the modification was done well. Peter Naur's Theory Building View: a given desired change to a program can almost always be implemented in several different ways that are all correct, judged purely by external behavior. But judged against the program's underlying theory -- why each part exists, how the whole thing is meant to work -- those same correct implementations can look very different from each other. Some extend the theory naturally, staying consistent with the system's existing structure. Others are wholly inconsistent with that theory: unintegrated patches bolted onto the main part of the program. External testing cannot tell these apart, because it only checks behavior, and both kinds of change produce the same behavior. Only someone who holds the theory can see the difference, and Naur ties this directly to long-term outcomes: patches of the second kind are what cause a program's structure to decay over repeated modifications, even while every individual change ships green. Diagnostic move: when reviewing a change that passes all its tests, ask a theory-holding reviewer a separate question the tests can't answer -- does this extend the existing structure, or does it just avoid breaking it?"
related: [lex-98gdu, lex-p54n2]
evokes: [peter-naur, programming-as-theory-building, unintegrated-patches, technical-debt, structural-decay]
lineage:
  - source: primary
    text: naur-1985-correct-but-theory-inconsistent-modifications
    citation: "Peter Naur, 'Programming as Theory Building' (Microprocessing and Microprogramming 15, 1985, pp.253-261), as reprinted in Alistair Cockburn, Agile Software Development (Addison-Wesley, 2002), Appendix B 'Naur, Ehn, Musashi,' section 'Program Life, Death, and Revival,' pp.233-234. A running header ('234 * NAUR, EHN, MUSASHI') interposes mid-sentence at the page break in the source; the ellipsis below marks that skip."
    quote: "“As a matter of fact, if viewed merely as a change of the program text and of the external behaviour of the execution, a given desired modification may usually be realized in many different ways, all correct. At the same time, if viewed in relation to the theory of the program these ways may look very different, some of them perhaps conforming to that theory or extending it in a natural way, while ... others may be wholly inconsistent with that theory, perhaps having the character of unintegrated patches on the main part of the program.”"
canonical-instances:
  - "The direct textual anchor, on why this difference is invisible to anyone without the theory and why it matters anyway: “This difference of character of various changes is one that can only make sense to the programmer who possesses the theory of the program. At the same time the character of changes made in a program text is vital to the longer term viability of the program.”"
  - "Hypothetical: two engineers independently fix the same reported bug in a scheduling system. Both patches pass the full test suite and produce identical output on every case QA can construct. One engineer's fix adds a single new branch inside the existing priority-resolution function, the same way every other special case there is already handled. The other engineer's fix works by intercepting the scheduler's output afterward and silently reordering two items whenever the bug's specific trigger condition is detected. Six months later, three more scheduling bugs are traced back to interactions with that second patch; the first patch never comes up again."
critical-questions:
  - "Naur asserts this difference 'can only make sense' to the theory-holding programmer, but a patch-versus-natural-extension distinction sounds like something a sufficiently thorough code review or architectural-fitness check might also catch without anyone holding a full theory of the system. Is the theory genuinely necessary to see this difference, or is Naur overstating a claim that a good static-analysis or review process could partially substitute for?"
  - "If two changes are behaviorally identical and only one is theory-consistent, does the inconsistent one actually cost anything at the moment it ships? Or does the cost only ever show up in expectation, in future modifications that may or may not arrive -- and if so, how would you measure the cost of an unintegrated patch before it has caused a single downstream problem?"
status: active
