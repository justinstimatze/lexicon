id: lex-vx867
name: moral-patienthood-and-moral-agency-as-orthogonal-poles
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When attributing moral status, separate moral PATIENTHOOD (can be wronged) from moral AGENCY (can do wrong, bears accountability). They're orthogonal; an entity may have one without the other. Different evidentiary bars apply to each."
