# strategic-ambiguity

A cognitive move that produces a *posture* of refusing-to-disambiguate
on a claim, such that multiple audiences each take a favorable reading
of the claim without the asserter committing to any single reading.

## Type-signature rationale

Type-signature `claim → posture` matches the parallel signaling-stance
moves plausible-deniability (lex-xrg6e) and cheap-talk (lex-c7pga). The
asserter's stance toward the asserted claim is "I won't pick a
reading"; that's a posture, not a frame.

## Distinct from neighbors

- **plausible-deniability** (lex-xrg6e) is a primary
  contrast partner. Deniability is *retrospective disclaimability*: the
  asserter has committed enough to be heard, but engineered the
  commitment to be retractable later. Strategic-ambiguity is
  *prospective non-commitment*: the asserter never picks a reading
  in the first place. Different operational shapes, different
  defeaters. Most real instances of either move involve the other,
  but the cognitive primitives are distinct.
- **cheap-talk** (lex-c7pga) doesn't commit either, but the absence of
  commitment is via *zero cost*; strategic-ambiguity's absence of
  commitment is via *multivocal phrasing*. Cheap-talk can be
  unambiguous; strategic-ambiguity can be costly. Orthogonal axes.
- **lex-chp44 meta-pointer** (state → frame) is the structural
  primitive about pointing-to-the-pointing. Strategic-ambiguity
  sometimes deploys meta-pointing ("I'm gesturing at a cluster of
  meanings rather than naming one") but isn't reducible to it.

## Why it surfaces

The cognitive primitive is the recognition of the move-as-strategy
— distinguishing strategic-ambiguity from honest underspecification
(communicative incompetence, conceptual underdevelopment, prudent
hedging on uncertain knowledge). The diagnostic is whether the
asserter would *prefer* disambiguation if forced. Eisenberg's
discipline: ask whether the asserter resists clarification when
asked. If yes, strategic-ambiguity; if no, the vagueness is
incidental.

## Composition notes

Probable molecule: `parallel(strategic-ambiguity, plausible-deniability)`
captures the common deployment-pattern in political/organizational
communication — multi-audience phrasing plus pre-engineered retreat.
The 2-atom parallel already shows up in canonical-instances; awaiting
3-occurrence rule before promoting to molecule.

The cognitive failure mode worth naming separately:
*audience-segmentation-dependent-strategic-ambiguity* — when the
move only works because the audience subgroups don't communicate
with each other. Once subgroups compare notes, the multivocal
phrasing collapses. Surfacing context for the surfacing function.
