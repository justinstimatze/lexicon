lineage:
  - source: primary
    text: hyde-finding-fits-none-of-the-standard-categories-of-legitimate-acquisition
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"The Lucky Find,\"' returning to Aristotle's example of a farmer who finds buried treasure. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The idea of “finding” itself bespeaks this indeterminate space. There are many ways in this world to acquire things: you can make something with your labor, you can buy it, you can receive it as a gift, you can steal it. “Finding” occupies an odd position on any such list. If I pocket a $5 bill found in the trash at the edge of a deserted parking lot, am I a thief? How should we describe that farmer who finds buried treasure in Aristotle’s example of two-road chance? He gets the gold not by working for it, not as a present from friend or relation, not by stealing it, not by purchase. We are in a shady area here, and shady language is in order. “It fell off a truck” is the American version of the more ancient “I found it at the crossroads.”"
canonical-instances:
  - "An employee who stumbles onto a brilliant, unplanned insight while doing an unrelated task feels oddly guilty taking full credit for it in a performance review, even though they neither stole the idea nor were handed it, because 'I got lucky and noticed something' doesn't map onto the usual categories of earned achievement the review process expects."
  - "A person who inherits a valuable object left behind, unclaimed, by a stranger in a rental property feels uneasy calling it 'theirs,' unable to describe the acquisition as earned, gifted, purchased, or stolen, and settles on vague language ('it was just left there') that avoids naming what category of ownership transfer actually occurred."
critical-questions:
  - "Does the discomfort around finding actually stem from the acquisition's ambiguous moral status, or from a different, more concrete worry, that someone else might have a legitimate claim the finder simply doesn't know about, which would make the unease about incomplete information rather than about category ambiguity?"
  - "Are there cultures or legal systems that have in fact developed a clear category for finding (finders-keepers doctrines, treasure-trove law), and if so, does that undermine the claim that finding is inherently uncategorizable, or does the persistence of vague, shady language around it even in those systems support the claim?"
  - "Is the discomfort around 'finding' actually moral at all, or is it more accurately described as a social anxiety about how others will judge the acquisition, meaning the real gap isn't in ethical categories but in the etiquette of explaining unearned good fortune to other people?"
