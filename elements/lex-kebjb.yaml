lineage:
  - source: primary
    text: hyde-accident-as-revelation-survives-the-shift-from-divine-will-to-the-unconscious
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"The Lucky Find,\"' tracing the reading of accident-as-revelation from ancient divination through Freud to Picasso. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "For most ancient or believing peoples, the answer is simple: accidents are no accident, they reveal the will of the gods. ... In the modern world we find a similar conjunction of accident and insight, only the discovered meanings now lie in the head rather than the heavens, for we have translated the ancient art of inquiring into the will of the gods into psychological terms. ... what hides in the unconscious only “masquerades as a lucky chance,” and we must learn to remove the mask. Slips of the tongue and other errors “are serious mental acts; they have their meanings”; they “are not accidents.” ... “Accidents, try to change them—it’s impossible. The accident reveals man.”"
canonical-instances:
  - "A corporate culture that once attributed a product's runaway success to 'market forces beyond anyone's control' later rebrands the same kind of unplanned success as evidence of a founder's secret 'visionary instinct,' preserving the same underlying refusal to call a lucky break lucky, just relocating the hidden cause from an impersonal market to a personal genius."
  - "A therapist and an astrologer both insist that a client's chance meeting with an old friend on a random street corner 'wasn't really an accident,' one framing it as the unconscious surfacing a resolved conflict and the other as the alignment of the stars, and the client notices both explanations do the same emotional work regardless of which hidden mechanism is actually true."
critical-questions:
  - "Is it fair to treat the persistence of this move across worldviews as evidence it's psychologically motivated rather than true, when a genuinely correct insight (that some things we call accidents do have discoverable causes, whether unconscious or otherwise) could just as easily be independently rediscovered by different traditions?"
  - "Does grouping the divine-will reading, the Freudian unconscious reading, and Picasso's deep-self reading together risk flattening real differences between them -- are these actually the same structural move, or does each framework make a substantively different, independently testable claim that deserves separate evaluation?"
  - "If some accidents genuinely are meaningless noise and others genuinely do have discoverable hidden causes, does this diagnostic offer any way to tell which is which in a specific case, or does it only counsel general skepticism toward the claim that a given accident was 'not really an accident'?"
