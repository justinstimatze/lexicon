id: lex-aq6dp
name: yielding-to-reproach-defeats-the-purpose-of-corrective-authority
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When you are placed in a position of authority SPECIFICALLY BECAUSE the majority's own judgment has already been shown to be wrong or dangerous — appointed, hired, or elected to correct a course others are set on — expect the same popular pressure that produced the original error to turn against your correction, in the form of reproach, mockery, or accusations of cowardice or disloyalty. Recognize that yielding to this pressure does not merely cost you standing; it collapses the entire reason your authority exists, because it lets the very error you were installed to override reassert itself through you. Plutarch's Life of Fabius Maximus names this exactly. Made dictator after Rome's judgment (embodied in the rash consul Flaminius) had produced catastrophic defeat, Fabius adopts a delay strategy his own soldiers and the Roman public read as cowardice, mocking him as 'Hannibal's pedagogue... since he did nothing else but follow him up and down and wait upon him.' When friends urge him to fight simply to escape the reproach, his answer states the mechanism directly: 'I should be more fainthearted than they make me, if, through fear of idle reproaches, I should abandon my own convictions. It is no inglorious thing to have fear for the safety of our country, but to be turned from one's course by men's opinions, by blame, and by misrepresentation, shows a man unfit to hold an office such as this, WHICH, BY SUCH CONDUCT, HE MAKES THE SLAVE OF THOSE WHOSE ERRORS IT IS HIS BUSINESS TO CONTROL.' The logic is precise: the office of dictator existed to substitute sound judgment for the popular impulse that had already failed once; an officeholder who reverses course under popular reproach does not merely make a tactical concession, he converts the corrective office into an instrument of the very error it was created to override — the people's flawed impulse governs anyway, now laundered through the authority meant to check it. The generalizable shape: (1) identify that your authority or mandate in this specific matter exists BECAUSE a prior default judgment already failed; (2) expect reproach mimicking the logic of that original failed judgment to reassert itself against your correction; (3) recognize that caving to this specific reproach is not a neutral cost-benefit tradeoff but a structural self-defeat — it does not just weaken your position, it erases the functional reason the position exists. This does not counsel ignoring all criticism; it identifies one narrow, high-stakes case — when the criticism's content IS the error you were installed to correct — where accommodating it is definitionally self-negating rather than merely unpopular."
related: [lex-mjav2, lex-czseb, lex-npbj6, lex-djt6r]
evokes: [hannibals-pedagogue, makes-the-slave-of-those-whose-errors-it-is-his-business-to-control, fear-of-idle-reproaches, turned-from-ones-course-by-mens-opinions, corrective-mandate]
lineage:
  - source: primary
    text: plutarch-c100-life-of-fabius-slave-of-those-whose-errors
    citation: "Plutarch, Life of Fabius Maximus, in Plutarch's Lives of the Noble Grecians and Romans, trans. John Dryden, revised by Arthur Hugh Clough (1859 revision of the 1683 Dryden translation; Project Gutenberg #674). Fabius's soldiers, humored by his overeager general of horse Minucius, mock the delay strategy as cowardice; when friends urge Fabius to fight simply to silence the reproach, his reply names why doing so would defeat the purpose of his office."
    quote: "they vented in reproaches upon Fabius, calling him Hannibal's pedagogue, since he did nothing else but follow him up and down and wait upon him. [...] When his friends reported these things to the dictator, persuading him that, to avoid the general obloquy, he should engage the enemy, his answer was, 'I should be more fainthearted than they make me, if, through fear of idle reproaches, I should abandon my own convictions. It is no inglorious thing to have fear for the safety of our country, but to be turned from one's course by men's opinions, by blame, and by misrepresentation, shows a man unfit to hold an office such as this, which, by such conduct, he makes the slave of those whose errors it is his business to control.'"
  - source: primary
    text: plutarch-c100-life-of-fabius-endures-tribunes-obloquy
    citation: "Same Life, continuing — after a further reverse gives the mockery political teeth, the tribune Metilius publicly accuses Fabius of disloyalty and the senate strips him of sole command; Plutarch records Fabius's unmoved response as living proof the pattern holds even when reproach escalates from mockery to a formal loss of authority."
    quote: "This action brought the extreme of obloquy and contempt upon the dictator [...] Fabius heard and endured all this with invincible patience [...] Fabius, with great tranquillity and unconcern, submitted to what happened, and contributed a proof to the argument of the philosophers that a just and good man is not capable of being dishonored. His only vexation arose from his fear lest this ill counsel [...] should damage the public cause."
canonical-instances:
  - "The direct textual anchor: Fabius refuses to abandon the delay strategy despite being called 'Hannibal's pedagogue,' naming the reversal itself — not the reproach — as what would make him unfit for the office, since it would let the popular error that caused the original disaster govern through him."
  - "A newly hired turnaround CEO, brought in specifically because the board's prior growth-at-all-costs strategy bankrupted the company, faces the same investors demanding a return to aggressive spending the moment quarterly numbers look painful; reversing course under that pressure doesn't just risk the turnaround, it hands control back to the exact judgment the CEO was hired to override."
  - "A judge appointed to a case specifically because a lower court's popular-but-legally-erroneous ruling was overturned faces public outcry for reinstating the correct-but-unpopular standard; ruling with the outcry rather than the law converts the appellate role into a mere echo of the error it exists to check."
critical-questions:
  - "how does this differ from lex-mjav2 (Epictetus, discipline-of-assent)? lex-mjav2 is about an individual's internal cognitive discipline toward ANY unbidden impression, in any domain, at any time — pause before granting assent to an impression's implicit judgment. This atom is narrower and structural: it applies specifically to someone HOLDING A CORRECTIVE MANDATE against a majority whose own prior judgment already failed, and its stakes are not personal equanimity but the functional collapse of the office itself if the reproach is accommodated. Fabius exercises something like discipline-of-assent toward the reproach, but the atom's substantive claim is about what caving costs an office, not about the general practice of examining impressions."
  - "how does this differ from lex-czseb (Weber, responsibility-ethic-owns-tainted-means)? lex-czseb concerns who bears responsibility for the FORESEEABLE CONSEQUENCES of coercive or violent political means once chosen. This atom concerns a different moment and a different failure mode entirely: whether to reverse a sound but unpopular COURSE OF ACTION under reproach from the constituency whose own error necessitated that course in the first place. Fabius is not weighing tainted means against pure conviction; he is refusing to let popular blame re-install a judgment his office exists to override. The two can co-occur (a responsibility-ethic actor might also face this specific corrective-mandate pressure) but name distinct mechanisms."
  - "does the atom claim a corrective authority should ignore ALL criticism? No — the pattern is narrowly scoped to the specific case where the criticism's content essentially reproduces the original erroneous judgment the authority was installed to correct. Criticism that identifies a genuine new flaw in the corrective course itself (not a reversion to the original error) is not what this atom counsels ignoring; Fabius himself updates tactically within his strategy (pursuing Hannibal's rear after the ox-decoy trick, rescuing Minucius) without abandoning its core logic. The atom's force is specifically about reproach that functions as a vector for the original mistaken judgment to reassert control."
  - "how do you tell, in a live case, whether reproach IS the original error reasserting itself versus legitimate new information? Diagnostic: ask what judgment produced the situation the corrective authority was installed to fix, and compare it to the substance of the current reproach. If the reproach's content is structurally identical to that original judgment (as Minucius's 'fight decisively now' echoes Flaminius's fatal rashness that necessitated Fabius's dictatorship in the first place), it is very likely the same error returning in a new voice. If the reproach instead points to a genuinely new failure mode of the corrective course itself, ordinary updating — not this atom's stand-firm move — is warranted."
