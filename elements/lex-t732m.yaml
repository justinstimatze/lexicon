id: lex-t732m
name: verifying-one-causal-arm-leaves-the-reverse-arm-untested
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a suspected feedback loop between two variables shows up as a correlation (people who did X earliest also show more of Y by a later point), and two directions are both plausible — X causing Y, or Y causing X — do not treat evidence that CONFIRMS one direction as evidence AGAINST the other; the two are not mutually exclusive, and most real feedback loops can run both ways at once. Thielens flags this fork explicitly, twice, for the same population. On acquiring a role model: 'It is possible ... that this relationship could develop in two ways. Great admiration for a particular doctor or lawyer might precipitate an early career decision. Or an early decision to go into a profession, made without the influence of a role model, could lead to greater interest in the profession and an increased likelihood of acquiring a model by the time of entrance into school.' He declines to adjudicate: 'Additional research will be needed to clarify these possibilities.' On viewing the profession as the only satisfying career, he poses the identical fork — 'Again it is possible that the relationship could develop in two ways' — and this time he DOES find direct support for one direction, without treating that support as having settled the question: 'First, people who at any given time have no serious career alternatives may commit themselves definitely to professional school earlier than do those considering alternatives. Evidence from the two studies strongly supports such a conclusion. Of those medical entrants who said they did not \"ever seriously consider any other occupation or profession before deciding on medicine,\" 77 per cent had definitely decided rather early (four years or more before entrance), compared with but 33 per cent of those who had considered alternatives.' Immediately after reporting this confirming evidence, he raises the OTHER direction again rather than letting it quietly drop: 'there are undoubtedly other individuals who reach a decision to go to medical or law school while at the same time planning to keep open other career possibilities... But it may be that once a tentative commitment of this nature is made, such individuals subsequently experience a diminishing interest in alternatives. If so, those who made the commitment early should find that alternatives have faded most completely by the time of entrance. Here we can offer no evidence.' The discipline worth naming is the SEQUENCE of moves: name both directions before testing either; when a clean natural comparison confirms one direction, report that confirmation as establishing only that one arm operates, not as having ruled out or made unlikely the other arm; and say plainly when a direction remains untested rather than letting a confirmed arm quietly stand in for the whole loop. Diagnostic move: whenever a 'which caused which' question about two mutually reinforcing variables gets resolved by evidence for one direction, explicitly ask whether the OTHER direction was ever actually tested, or whether it simply stopped being mentioned once the first one had support — silence about an alternative direction is not evidence against it."
related: [lex-8m2fg, lex-e9z2y]
