lineage:
  - source: primary
    text: altshuller-1984-dunker-x-ray-artefact-instrument-rule
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.4 'Talented Thought: What is it?', section 'Dunker's Experiment.'"
    quote: "'Let us introduce one rule of the ASIP: one may have to change the instrument, but not the artefact (which is a technical and not a natural object). Let us examine each stage of the solution taking this rule into account. In the problem there are two substances (the tumour and the healthy tissue around it) and one field (the X-rays). Both substances are natural, both are artefacts. The rays are the instrument. The first variant is an attempt to do something with the healthy tissues... This is a clear violation of the rule and hence it is a futile variant.'"
  - source: primary
    text: altshuller-1984-dunker-teaching-result
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.4, 'Dunker's Experiment.'"
    quote: "'Thus 11 of the 'empty' variants would not have appeared if the rule about the artefact and the instrument had been introduced. This problem was placed before a 15-strong group of students... for 45 minutes the others did not come up with the model answer. After explanation of the rule, it was solved by everyone and the longest selection went to four variants. In another group the rule was explained first and then the problem was given. All solved it and over half with their first variant.'"
canonical-instances:
  - "A support team troubleshooting a customer's slow home internet keeps proposing changes to the customer's own house wiring (a fixed, natural constraint they don't control) instead of confining every fix attempt to the router and service settings actually within their control — sorting the elements first (house wiring: given; router configuration: instrument) would have eliminated most of the wasted attempts immediately."
  - "A manager trying to fix a chronically late deliverable keeps proposing changes to a difficult client's own internal approval process (a fixed external constraint outside the team's control) instead of confining fixes to the team's own scheduling, communication cadence, and deliverable format (the actual controllable instrument) — the client's process was never going to change no matter how many variants targeted it."
  - "operationally distinct from lex-uq4xw an-object-cannot-change-itself-add-the-instrument-and-the-coupling-field: that atom diagnoses a MISSING element (no instrument, no coupling field exists yet) in an incomplete system; this atom presupposes the instrument already exists and addresses a DIFFERENT failure — search effort being wasted on the wrong ALREADY-PRESENT element (the fixed natural object) instead of the right one (the controllable instrument)."
critical-questions:
  - "how does someone correctly classify an element as 'fixed, not redesignable' versus 'controllable instrument' when the boundary is genuinely ambiguous — some constraints treated as fixed (a law, a supplier contract, an organizational policy) are actually changeable at a cost, and misclassifying a changeable element as fixed would wrongly rule out the real solution?"
  - "does confining the search to the instrument risk missing genuinely correct solutions that DO require changing the supposedly fixed object — are there cases where the 'artefact' really is the right thing to redesign, and the rule's strong bias toward the instrument would actively mislead the solver away from it?"
  - "Dunker's supervisor actively rejected the examinee's step-4 answer, which was close to correct, apparently because it didn't look like direct progress toward the goal — does the same phenomenon (an evaluator penalizing an indirect but correct move because progress isn't visibly monotonic) generalize as its own separate risk whenever this rule is being taught or supervised, distinct from the sorting rule itself?"
status: active
