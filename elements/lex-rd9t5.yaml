id: lex-rd9t5
name: an-invented-character-can-outlast-and-outweigh-the-people-you-actually-know
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A character who never existed can grip and grieve you more durably than an actual person you've known, because fiction doesn't have to compete with fact on fact's own terms -- it operates in a register where invention, done well, produces something that outlasts the perishable people and events it was never trying to accurately record. Oscar Wilde makes the claim directly in 'The Decay of Lying': 'The telling of beautiful untrue things is the proper aim of Art,' pointing to 'all those great creations (Milton's Satan, Hamlet, Jane Eyre) who are more real and durable than the perishable women and men we know in fact.' He gives it a startling personal instance: 'One of the greatest tragedies of my life is the death of Lucien de Rubempré. It is a grief from which I have never been able completely to rid myself. It haunts me in my moments of pleasure. I remember it when I laugh. But Balzac is no more a realist than Holbein was. He created life, he did not copy it.' Picasso makes the same claim from the other direction: 'Art is a lie that makes us realize truth, at least the truth that is given us to understand. The artist must know the manner whereby to convince others of the truthfulness of his lies.' The invented character isn't a lesser, secondhand version of a real person -- made well, it becomes a different kind of thing entirely, one that can move and outlast its audience in ways the transient facts of any particular life often don't. Diagnostic move: when weighing whether an invented story, character, or account is 'less real' than documented fact because it didn't happen, ask instead what kind of durability and grip it has actually achieved -- fiction's claim on you isn't disqualified by its factual falsity, and a well-made invention can carry more weight, longer, than an accurate record of something that actually occurred."
