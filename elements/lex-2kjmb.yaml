name: organisms-minimize-surprise-by-acting-or-by-updating-beliefs
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When analyzing how an adaptive system stays adaptive — biological organism, learning algorithm, organization, embedded controller — Friston's transferable claim is that the system must minimize the LONG-TERM AVERAGE of SURPRISE (the negative log-probability of its sensory inputs given its model of the world). Free energy is a tractable upper bound on surprise; minimizing free energy minimizes surprise. The principle unifies three apparently-distinct activities: (1) PERCEPTION / INFERENCE — update internal beliefs (the recognition density q) to better match observed data, reducing free energy via the inference route; (2) ACTION — sample the world to confirm prior expectations (active inference), reducing free energy via the action route; (3) LEARNING — update the model's parameters over longer timescales. All three are facets of the same minimization. Transferable consequences: (1) the organism is a PREDICTION ENGINE — its 'goal' (formally) is to be in states it expects to be in; persistence in the face of perturbation IS surprise-minimization; (2) action and perception are not separate — both serve the same objective; action makes the world conform to predictions, perception updates predictions to fit the world; you cannot have one without the other; (3) attention, motivation, and exploration all fall out of this framework as different routes to reducing precision-weighted prediction error; (4) a 'fish out of water' is in a high-surprise state — biological agents must keep their sensory entropy bounded or they die; (5) self-organization, homeostasis, Bayesian brain, predictive coding, and optimal control are SAME-OBJECTIVE-DIFFERENT-LENS — all minimize free energy under their own formalism. Practitioner failure modes: treating perception and action as separate systems when they're coupled by a shared objective; designing organizations that minimize surprise via action (suppress dissent, maintain narrative) when surprise reduction via inference (update the worldview) would be more adaptive; expecting LLM agents to 'explore' when their training objective only rewards low-surprise outputs; mistaking 'surprise-minimization' for 'reward-maximization' (related but distinct — surprise minimization includes confirming dis-pleasurable predictions). Boundary: the free-energy principle is a high-level organizing framework, not a specific brain algorithm. Specific mechanisms (predictive coding hierarchies, Kalman filtering, message passing) implement it. Critique exists: some theorists argue the principle is unfalsifiable as stated (any adaptive behavior can be retrofit into the framework); others note that the variational bound assumptions are restrictive. Cite the framework as a transferable organizing principle, not as a fully-specified neural mechanism. Distinct from lex-wgd7u learning-tracks-prediction-error: lex-wgd7u names the SIGNAL form (what drives weight updates); this atom names the OBJECTIVE form (what's being minimized over the long run). They compose: RPE is one route by which the system reduces free energy. Distinct from lex-eg9zm cooperation-evolves: cooperation is a specific evolved strategy; free-energy minimization is the organizing principle from which any adaptive strategy can be derived."
