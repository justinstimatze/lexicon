id: lex-q7fyn
name: delay-granting-a-request-until-its-fallout-on-absent-third-parties-is-settled
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Granting someone''s deeper request immediately, before they''ve discharged an existing obligation, can offload the fallout of that unfinished business onto people who had no part in the request — so the grantor delays until the requester has settled it. In the Jataka''s tale of Temiya, when his charioteer asks on the spot to become an ascetic alongside him, the prince recognizes that admitting him immediately would leave the royal chariot, horses, and ornaments abandoned in the forest and his own parents publicly blamed for the charioteer''s disappearance, so he reasons through the cost before answering: "If I at once admit him to the ascetic life, my father and mother will not come here and thus they will suffer loss, and the horses and chariot and ornaments will perish, and blame will accrue to me, for men will say, ''He is a goblin,—has he devoured the charioteer?''"'
related: []
evokes: [jataka, mahanipata, muga-pakkha-jataka, temiya-jataka, sequencing-a-request, third-party-fallout]
