lineage:
  - source: primary
    text: eastman-falcon-duck-unconfirmed-kill-recovers-over-winter
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Fifth Evening: The Falcon and the Duck.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Here, children,' boasted an old Drake, 'is the very spot where your father was charged upon last autumn by a cruel Falcon! ... Best of all, our fierce enemy dropped to the ground with a broken wing! Doubtless he is long since dead of starvation, or else a Fox or a Mink has made a meal of the wicked creature!' By these words the Falcon knew his old enemy, and his courage returned."
canonical-instances:
  - "A company that successfully drove off a competitor's aggressive price war assumes the weakened rival will simply fold and stops monitoring their moves, when in fact the rival spent the following year quietly restructuring and rebuilding, resurfacing with a stronger position exactly when the confident company's guard was fully down."
  - "Someone who ended a manipulative relationship believes their former partner has moved on for good after months of silence and freely shares personal details in a public setting they assume is safe, not realizing the silence was recovery time rather than closure, and the resurfaced contact catches them completely unprepared."
critical-questions:
  - "how much verification is actually practical or safe to obtain before treating a threat as neutralized -- does insisting on confirmed elimination in every case demand a level of ongoing vigilance that's exhausting or impossible to sustain indefinitely?"
  - "does this framework risk manufacturing permanent paranoia about any threat that isn't provably, certainly gone, when in most real situations an incapacitated threat genuinely does fail to recover and the caution turns out to have been wasted effort?"
  - "is the actual failure here the unconfirmed assumption itself, or is it specifically retelling the story of the encounter within a context where the threat itself might be listening -- does the story conflate two distinct mistakes (premature certainty, and careless disclosure) that deserve to be treated separately?"
