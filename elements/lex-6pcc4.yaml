  - source: primary
    text: hayek-1945-use-of-knowledge-in-society-price-system-as-communication
    citation: "Friedrich A. Hayek, \"The Use of Knowledge in Society,\" American Economic Review 35(4) (1945): 519-530; reprinted as Chapter IV of Individualism and Economic Order (University of Chicago Press, 1948), §§5-6 (pp.84-88 of the 1948 reprint). Having established in §§2-4 that knowledge of particular circumstances of time and place is irreducibly dispersed and cannot be transmitted to a central authority in a form that preserves its decision-relevant content (the diagnostic claim carved separately as lex-58ynk), Hayek turns constructive in §§5-6 and asks how the \"man on the spot,\" equipped only with local knowledge, nonetheless fits his decisions into the pattern of the larger economic system. His answer is to read the price system AS a communication mechanism rather than merely an allocative-efficiency device: prices compress the practical upshot of dispersed, particular-circumstance knowledge into a single, minimal, transmissible symbol, sufficient to induce broadly correct action in recipients who neither know nor need to know the underlying cause of the signal's movement. Hayek's worked example — a scarcity of tin appearing anywhere in the world, from either a new use or a lost supply source — shows the compression at work: 'it is significant that it does not matter' which cause is operative, because the price alone carries everything any individual actor needs. Hayek names the property 'the economy of knowledge with which [the price system] operates, or how little the individual participants need to know in order to be able to take the right action,' and pushes the price system's status from metaphor toward something closer to literal description via the telecommunications/dial-watching analogy. He gives the whole positive claim its own name — \"the marvel\" — chosen deliberately, he says, 'to shock the reader out of the complacency with which we often take the working of this mechanism for granted,' and stresses that the mechanism's 'misfortune' is precisely that it is not designed and that the people guided by it 'usually do not know why they are made to do what they do.' He closes the section by generalizing the claim past economics via Whitehead's remark that civilization advances by extending the operations we can perform without thinking about them, arguing the same symbol-mediated, understanding-optional coordination recurs 'in connection with nearly all truly social phenomena, with language and with most of our cultural inheritance.' lex-58ynk's own lineage text names this exact claim and flags it explicitly as queued for future mint ('Hayek's positive proposal — that markets aggregate local knowledge through price signals without centralizing the underlying knowledge — is a related but distinct atom (signal-aggregation-without-knowledge-centralization, queued for future mint)'); this atom is that mint, carved as the positive-mechanism counterpart to lex-58ynk's diagnostic claim."
    quote: "[Hayek 1945 §5, the tin-scarcity worked example:] 'Assume that somewhere in the world a new opportunity for the use of some raw material, say, tin, has arisen, or that one of the sources of supply of tin has been eliminated. It does not matter for our purpose — and it is significant that it does not matter — which of these two causes has made tin more scarce. All that the users of tin need to know is that some of the tin they used to consume is now more profitably employed elsewhere and that, in consequence, they must economize tin. There is no need for the great majority of them even to know where the more urgent need has arisen, or in favor of what other needs they ought to husband the supply. If only some of them know directly of the new demand, and switch resources over to it, and if the people who are aware of the new gap thus created in turn fill it from still other sources, the effect will rapidly spread throughout the whole economic system and influence not only all the uses of tin but also those of its substitutes and the substitutes of these substitutes, the supply of all the things made of tin, and their substitutes, and so on; and all this without the great majority of those instrumental in bringing about these substitutions knowing anything at all about the original cause of these changes. The whole acts as one market, not because any of its members survey the whole field, but because their limited individual fields of vision sufficiently overlap so that through many intermediaries the relevant information is communicated to all.' [§6, the price system as a communication mechanism and the economy of knowledge:] 'We must look at the price system as such a mechanism for communicating information if we want to understand its real function — a function which, of course, it fulfils less perfectly as prices grow more rigid... The most significant fact about this system is the economy of knowledge with which it operates, or how little the individual participants need to know in order to be able to take the right action. In abbreviated form, by a kind of symbol, only the most essential information is passed on and passed on only to those concerned. It is more than a metaphor to describe the price system as a kind of machinery for registering change, or a system of telecommunications which enables individual producers to watch merely the movement of a few pointers, as an engineer might watch the hands of a few dials, in order to adjust their activities to changes of which they may never know more than is reflected in the price movement.' [§6, \"the marvel\":] 'But I fear that our theoretical habits of approaching the problem with the assumption of more or less perfect knowledge on the part of almost everyone has made us somewhat blind to the true function of the price mechanism and led us to apply rather misleading standards in judging its efficiency. The marvel is that in a case like that of a scarcity of one raw material, without an order being issued, without more than perhaps a handful of people knowing the cause, tens of thousands of people whose identity could not be ascertained by months of investigation, are made to use the material or its products more sparingly; that is, they move in the right direction. This is enough of a marvel even if, in a constantly changing world, not all will hit it off so perfectly that their profit rates will always be maintained at the same even or \"normal\" level. I have deliberately used the word \"marvel\" to shock the reader out of the complacency with which we often take the working of this mechanism for granted.' [§6, on the mechanism's not being designed and generalizing past economics via Whitehead:] 'I am convinced that if it were the result of deliberate human design, and if the people guided by the price changes understood that their decisions have significance far beyond their immediate aim, this mechanism would have been acclaimed as one of the greatest triumphs of the human mind. Its misfortune is the double one that it is not the product of human design and that the people guided by it usually do not know why they are made to do what they do... The problem which we meet here is by no means peculiar to economics but arises in connection with nearly all truly social phenomena, with language and with most of our cultural inheritance, and constitutes really the central theoretical problem of all social science. As Alfred Whitehead has said in another connection, \"It is a profoundly erroneous truism, repeated by all copy-books and by eminent people when they are making speeches, that we should cultivate the habit of thinking what we are doing. The precise opposite is the case. Civilization advances by extending the number of important operations which we can perform without thinking about them.\" This is of profound significance in the social field. We make constant use of formulas, symbols, and rules whose meaning we do not understand and through the use of which we avail ourselves of the assistance of knowledge which individually we do not possess.'"
