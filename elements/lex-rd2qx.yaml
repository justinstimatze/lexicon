id: lex-rd2qx
name: nothing-to-hide-argument-reduces-privacy-to-secrecy-of-wrongdoing
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When someone defends a surveillance, data-collection, or disclosure regime with a version of 'if you have nothing to hide, you have nothing to fear,' do not engage the argument on its own terms by trying to name something to hide or fear — that concedes its hidden premise. The argument implicitly assumes privacy's only function is CONCEALMENT of wrongdoing, so a person with no wrongdoing to conceal has no privacy interest at stake. That premise is the actual defect: privacy protects against a plurality of harms that exist independent of any wrongdoing — aggregation of innocuous data points into a revealing profile, secondary use of information beyond its original purpose, exclusion from knowing what's held about you or correcting it, distortion through selective or out-of-context disclosure, and the general chilling effect of being watched. Respond by naming which of these OTHER harm-categories is actually at stake in the specific case, rather than accepting the debate's framing that privacy = secrecy and secrecy = concealment of guilt."
related: [lex-x3j4b, lex-2s3ze]
evokes: [nothing-to-hide-argument, solove-2007, privacy-as-plurality, taxonomy-of-privacy-harms, aggregation, secondary-use, exclusion, distortion, chilling-effect, privacy-not-just-secrecy]
lineage:
  - source: primary
    text: solove-2007-ive-got-nothing-to-hide
    citation: "Daniel J. Solove, ''I've Got Nothing to Hide' and Other Misunderstandings of Privacy,' San Diego Law Review 44 (2007): 745-772. Free SSRN download (papers.ssrn.com/sol3/papers.cfm?abstract_id=998565), surfaced via a discovery scan of SSRN's all-time top-100-downloads ranking (rank #4, 237k+ all-time downloads — the highest-ranked non-finance, non-empirical-study paper in the top 10). Solove develops (elsewhere, cross-referenced in this paper) a pluralistic taxonomy of privacy harms — surveillance, aggregation, secondary use, exclusion, distortion, disclosure, among others — and argues the 'nothing to hide' argument fails specifically because it collapses this plurality down to one category (concealment of wrongdoing) and then correctly observes most people have little to conceal in that narrow sense, missing that the other categories apply regardless."
    quote: "The problem, in short, is not with finding an answer to the question: 'If you've got nothing to hide, then what do you have to fear?' The problem is in the very question itself. ... The deeper problem with the nothing to hide argument is that it myopically views privacy as a form of concealment or secrecy. But understanding privacy as a plurality of related problems demonstrates that concealment of bad things is just one among many problems caused by government programs such as [mass] surveillance and data mining."
canonical-instances:
  - "Government mass-surveillance debate (the paper's own case): a citizen is told 'if you're not a terrorist, the NSA program doesn't affect you.' The reply Solove's framework licenses is not 'here is something I have to hide' but 'the program creates an aggregation harm (my innocuous data points, cross-referenced, reveal things no single point would) and a chilling-effect harm (I self-censor knowing I might be watched) regardless of whether I have anything to conceal.'"
  - "Workplace monitoring software: a manager argues employees who aren't slacking off have nothing to fear from keystroke-logging. The concealment framing misses the secondary-use harm (data collected for productivity gets used later in a performance review or layoff decision it wasn't collected for) and the exclusion harm (the employee cannot see or contest what the log actually shows about them)."
  - "Social-media data collection: a user shrugs off a platform's data practices with 'I don't post anything embarrassing.' The distortion harm (fragments of activity recombined out of context into a profile that misrepresents the person) and the secondary-use harm (data sold or repurposed for ends the user never agreed to) both apply independent of whether anything 'embarrassing' exists."
critical-questions:
  - "Is the debate being fought on the terrain of 'do I/they have something to hide' — and if so, has that already conceded the premise that privacy's only value is concealment? Naming a different harm-category (aggregation, secondary use, exclusion, distortion, chilling effect) reframes the debate rather than answering its loaded question."
  - "Which SPECIFIC harm-category actually applies here? A generic invocation of 'privacy matters' is weaker than naming, concretely, which of the plural harms (not just secrecy) is at stake in this exact data-collection or disclosure practice."
  - "Is the arguer conflating 'this person has nothing to hide' (a claim about one individual's wrongdoing) with 'this program poses no privacy harm' (a claim about the program's structural effects on aggregation, secondary use, etc. across everyone subject to it)? The individual-innocence claim, even if true, doesn't address the structural claim."
  - "Distinct from lex-x3j4b (Schneier, ubiquitous-surveillance-is-different-in-kind): that atom explains WHY mass surveillance specifically is uniquely harmful via cost-collapse and cross-stream data correlation. This atom is upstream of that — it's about the ARGUMENT-STRUCTURE move ('nothing to hide') used to dismiss privacy concerns before the substantive harm-mechanism is even discussed. Use this atom to unseat the framing; use lex-x3j4b to explain the mechanism once the framing is unseated."
