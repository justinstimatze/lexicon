id: lex-2rttc
name: a-shared-word-can-encode-incompatible-conceptual-systems
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two people use the identical word and still can't understand each other, check whether the word is anchored to two different conceptual systems rather than to one shared concept with a disputed application. Lakoff's diagnostic case: a liberal argues that denying a woman access to abortion limits her 'freedom.' A conservative simply doesn't follow the argument. In the conservative system, the word doesn't extend into that domain the way it does for the liberal. Or take a conservative who treats increased military and prison spending as fully compatible with opposing 'big government.' A liberal hears a plain contradiction. For a liberal, the term is shorthand for total spending. A conservative isn't counting dollars at all -- the term names intrusion into self-reliant behavior. Neither side is making an error inside its own system. Words are defined relative to a conceptual system, so a term carried across the boundary between two systems doesn't keep a fixed meaning -- it can misfire into confusion or laughter, standing in for a genuine disagreement without ever becoming one. Diagnostic move: before treating a cross-worldview debate as a factual or values dispute, check whether the two sides are using the disputed term inside the same conceptual system at all."
related: [lex-kfdep, lex-hwppp]
evokes: [george-lakoff, moral-politics-1996, big-government, freedom-lexicon, conceptual-system]
lineage:
  - source: primary
    text: lakoff-1996-big-government-and-freedom-mean-differently
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 2 'The Worldview Problem for American Politics,' section 'The Language of Conservatism.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“For example, ‘big government’ does not just refer to the size of government or the amount spent by it. One can see the misunderstanding when liberals try to reason with conservatives by pointing out that increasing the amount spent on the military and prisons increases ‘big government.’ Conservatives laugh. The liberals have just misused the term. I have heard a conservative talk of ‘freedom’ and a liberal attempt a rebuttal by pointing out that denying a woman access to abortion limits her ‘freedom’ to choose. Again, the liberal has used a word that has a different meaning in the conservative lexicon.”"
  - source: primary
    text: lakoff-1996-words-defined-relative-to-conceptual-system
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 2 'The Worldview Problem for American Politics,' section 'The Language of Conservatism.'"
    quote: "“Words don’t have meanings in isolation. Words are defined relative to a conceptual system. If liberals are to understand how conservatives use their words, they will have to understand the conservative conceptual system.”"
canonical-instances:
  - "The direct textual anchor, on the specific words that misfire across the boundary: Lakoff catalogues 'character, virtue, discipline, tough it out, get tough, tough love, strong, self-reliance, individual responsibility, backbone, standards, authority, heritage, competition, earn, hard work, enterprise, property rights, reward, freedom, intrusion, interference, meddling, punishment, human nature, traditional, common sense, dependency, self-indulgent, elite, quotas, breakdown, corrupt, decay, rot, degenerate, deviant, lifestyle' as words conservatives use constantly, set against a wholly different liberal vocabulary of 'social forces, social responsibility, free expression, human rights, equal rights, concern, care, help, health, safety, nutrition, basic human dignity, oppression, diversity, deprivation, alienation, big corporations, corporate welfare, ecology, ecosystem, biodiversity, pollution, and so on.'"
  - "Hypothetical: a labor negotiation stalls when management insists it wants 'flexibility' for workers and the union hears the same word as a euphemism for unpredictable scheduling and no guaranteed hours. Each side keeps using the word, each certain the other is negotiating in bad faith. Management is talking about who picks up open shifts on short notice. The union is talking about whether a schedule can be changed out from under someone without warning. No amount of repetition settles which meaning is actually on the table."
critical-questions:
  - "Lakoff frames each case as the same word carrying different content across two systems, rather than as one side simply using the word incorrectly. Is there any test that could show one side has the more coherent or historically prior claim to the word, or does treating meaning as system-relative make that question permanently unanswerable by design?"
  - "If words only mean something relative to a conceptual system, how does anyone ever revise their own political conceptual system through argument at all? Lakoff's account leaves every cross-vocabulary argument failing to compute before it starts, with no mechanism left for an outside word to change what's held inside a system."
status: active
