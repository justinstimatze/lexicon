id: lex-y3fc5
name: test-a-frameworks-magic-number-by-recursively-reapplying-it-to-anything
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a framework builds its whole structure around a specific number treated as significant (seven stages, five forces, four quadrants, three pillars), test whether that number is actually doing explanatory work or is just decoration — apply the same numerological structuring move recursively to something completely unrelated, and see whether it 'works' there too with equal apparent validity; if it does, the number was never load-bearing in the first place. Altshuller demonstrates this directly against a proposed 'strategy of the seven-sided search,' whose author justified the number itself as meaningful: 'It is known, that a man should subject up to seven subjects, elements, concepts, and ideas to effective simultaneous examination, comparison and study. In this sense a system based on the 'magic' number seven has considerable advantages over the decimal system... There are furthermore seven stages, in each of which there are seven key processes.' Altshuller's refutation doesn't argue about inventive creativity at all — it recursively re-applies the same '7' structuring principle to an arbitrary unrelated domain and shows the resulting claim is exactly as plausible as the original: 'On this basis one could just as well insist that every city has seven districts, that every district has seven quarters, that every quarter has seven houses, that every house has seven floors, that every floor has seven flats.' Because this nested-sevens claim about cities and houses is obviously arbitrary nonsense, and it was generated by literally the same move used to justify the seven-stage/seven-process framework, the test exposes that the original framework's number was never derived from evidence about inventive problems at all — it was imposed first, then everything else was arranged to fit it. He names the general diagnosis this points to: 'Typical of such 'alchemy'... is the total break with study of the objective laws of development... the study of patent information, the solution of specific inventive problems' — the number substitutes for evidence rather than summarizing it. Diagnostic move: when a framework's credibility rests partly on the elegance or 'magic' of a specific count (of stages, forces, types, pillars), don't evaluate the number's plausibility in the framework's own domain — take the exact same structuring rule and apply it, unmodified, to an arbitrary unrelated domain; if the recursive application produces an equally 'plausible-sounding' but obviously made-up claim, the number in the original framework was decorative rather than discovered, and the framework's real content (if any) needs to be evaluated without leaning on the count for credibility."
related: [lex-2n7b8]
scaffolds-from: [lex-2n7b8]
evokes: [seven-sided-search-critique, magic-number-recursive-reductio, every-city-has-seven-districts, numerology-as-decoration-not-discovery]
lineage:
  - source: primary
    text: altshuller-1984-seven-sided-search-quoted
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.8 'The Science of Invention,' section 'A Few Comments on the Literature of Inventive Creativity.'"
    quote: "'Heightened interest in new methods of solving creative problems at times leads to the appearance of fanciful purely mental methods. Such, for instance, is the 'strategy of the seven-sided search' put forward by G. Bush. 'It is known,' he writes, 'that a man should subject up to seven subjects, elements, concepts, and ideas to effective simultaneous examination, comparison and study. In this sense a system based on the 'magic' number seven has considerable advantages over the decimal system.' There are furthermore seven stages, in each of which there are seven key processes.'"
  - source: primary
    text: altshuller-1984-recursive-seven-districts-refutation
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.8, 'A Few Comments on the Literature of Inventive Creativity.'"
    quote: "'The 'magic' of the figure seven has absolutely nothing to do with it. On this basis one could just as well insist that every city has seven districts, that every district has seven quarters, that every quarter has seven houses, that every house has seven floors, that every floor has seven flats. Behind the 'magic' form of the 'strategy of seven-sided search' is concealed a hopelessly out of date notion.'"
canonical-instances:
  - "A productivity book proposes '5 pillars of effective time management,' each with '5 sub-habits'; recursively applying the same 5-and-5 structuring move to grocery shopping ('5 pillars of buying vegetables, each with 5 sub-techniques') produces an equally confident-sounding but obviously invented framework, exposing that the original '5' wasn't derived from any actual study of time management, just imposed as an organizing device."
  - "A business strategy consultancy markets a '4-quadrant growth matrix' as though the number four carries special analytical weight; testing the same quadrant-generating move on an unrelated domain (a '4-quadrant matrix of breakfast cereal preference') produces an equally plausible-looking chart, showing the quadrant COUNT itself isn't evidence of anything — any real content in the original matrix has to stand on its own, without borrowing credibility from the number of boxes."
  - "operationally distinct from lex-2n7b8 judge-a-new-methodology-by-evidence-base-difficulty-tiers-and-prospective-tests: that atom is a general three-part evidentiary checklist for evaluating ANY new methodology claim; this atom is one specific, narrower diagnostic test aimed at a particular red flag — a framework's organizing principle being an arbitrary 'magic number' rather than an evidence-derived count — which the broader checklist's first criterion (evidence base) would also eventually catch, but this test catches it faster and more directly."
critical-questions:
  - "does this test risk dismissing a genuinely evidence-derived count just because it also happens to sound numerologically appealing — some real phenomena do cluster around small numbers (Miller's 'seven plus or minus two' short-term memory finding, for instance) for reasons that have nothing to do with numerology; how would this test avoid throwing out a legitimate finding along with the fake ones?"
  - "the recursive-reapplication test shows the STRUCTURING MOVE is arbitrary, but does it fully settle whether the framework's specific CONTENT (the seven named stages themselves, not just their count) might still carry real insight independent of why there happen to be seven of them?"
  - "how would someone apply this test to a framework whose number is less obviously decorative than 'seven' — a framework built around, say, 'three types' or 'two axes' — where the recursive reapplication to an unrelated domain might itself look suspiciously plausible either way, making the test less discriminating for very small numbers?"
status: active
