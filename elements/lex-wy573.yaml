canonical-instances:
  - "A research lab's founding culture reveres a lineage of scientists famous specifically for overturning the lab's own earlier consensus findings — a junior researcher proposing to discard an established result within the lab isn't fighting the lab's tradition, they're the tradition's most faithful expression, and framing the challenge as 'in the spirit of how this lab has always worked' recruits tradition as license rather than obstacle."
  - "A family business's founding story celebrates an ancestor who broke with the family's original trade to chase a new market — a descendant proposing to pivot the company away from its current product line can invoke 'honoring what our founder actually did, not just what the company happens to sell today' as tradition-based support for the pivot, rather than tradition being automatically on the side of keeping things as they are."
critical-questions:
  - "Can a tradition's content be actively reframed or contested — could two factions in the same institution each sincerely claim to be the 'true' heirs of an ambiguous tradition, one citing its innovators and the other citing its stabilizers, making the tradition's content itself a site of struggle rather than a fixed, checkable fact?"
  - "Does a tradition-of-innovation eventually exhaust its own mechanism — if 'moving forward' becomes ritualized as the expected performance, does change-for-its-own-sake become as unreflective and resistant-to-genuine-reconsideration as the change-resistant tradition it was supposed to differ from?"
