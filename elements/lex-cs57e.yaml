lineage:
  - source: primary
    text: eastman-raccoon-bee-tree-unrecognizable-in-honey-and-leaves
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Sixth Evening: The Raccoon and the Bee-Tree.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'He was tired out and dreadfully ashamed. He did now what he ought to have done at the very first--he jumped into the lake and washed off most of the leaves. Then he got back to his hollow tree and curled himself up and licked and licked his soft fur till he had licked himself clean, and then he went to sleep.' _The midnight hunter steals at his own risk._"
canonical-instances:
  - "Someone who made a series of impulsive, embarrassing decisions during a difficult period reaches out to old friends for support while still visibly entangled in the chaotic aftermath (unreturned messages, public conflicts, erratic behavior others have witnessed), and finds people pulling away not from lack of care but because the visible mess itself is unrecognizable as the person they knew, when addressing the immediate fallout directly first would have made reconnecting possible."
  - "An employee who mishandled a client relationship and is now covered in the fallout -- a string of defensive emails, a reputation for volatility within the team -- tries to ask colleagues for backup on the account without first cleaning up the visible trail of the mishandling, and finds that colleagues, unable to see past the mess to the person underneath, keep their distance rather than help."
critical-questions:
  - "how does someone in genuine distress accurately judge, in the moment, whether they're being avoided because of a fixable visible mess or because their community has actually and permanently lost trust in them -- does this framework risk suggesting a quick fix exists when the real damage is deeper than appearance?"
  - "is 'clean yourself up before seeking help' sometimes bad advice, if the distress itself makes the obvious fix hard to execute -- could someone genuinely need help precisely with the visible mess itself, making the diagnostic move here circular?"
  - "does this pattern only apply to self-inflicted messes, or does it generalize to situations where the person is covered in something not of their own making (an accident, someone else's doing) -- does assigning blame ('the midnight hunter steals') change what the actual, most useful lesson here should be?"
