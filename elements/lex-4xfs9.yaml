    quote: "'Mother! Mother! Tell me what voice it was I heard which pleased my ears, but made my eyes grow wet!' said he, breathless. ... 'The human child has heard and seen his real mother. I cannot keep him longer, I fear.'"
canonical-instances:
  - "An adult adopted as an infant and raised by loving parents who never mentioned the adoption unexpectedly bursts into tears hearing a stranger's voice with a particular regional accent and cadence, with no conscious memory or knowledge connecting it to their birth family, only later learning the accent matches where their birth mother was from."
  - "A brand that has spent a decade successfully building customer loyalty around a private-label product finds that when the original, discontinued brand briefly reappears in a promotional stunt, longtime customers respond with disproportionate excitement and nostalgia that the substitute brand's own marketing, however well-crafted, was never able to produce despite years of trying to build the same feeling from scratch."
critical-questions:
  - "how much of this involuntary response is actually about the original bond specifically, versus a more general human sensitivity to the sound of grief or a stranger's authentic emotion -- could the boy have reacted the same way to any grieving parent's voice, regardless of any biological connection to him at all?"
  - "does the toad's genuine, years-long love for the boy count for nothing in this framework, or is the point specifically that even real, sustained love from a substitute caregiver doesn't erase a prior bond -- and if so, does that risk devaluing the substitute relationship's own legitimacy and worth?"
  - "is the imitation's failure really proof that something irreplaceable exists in the original bond, or could a sufficiently skilled, patient imitation eventually have succeeded -- does the toad's clumsy, hasty attempt (mistaking names of loved ones for valuable objects) understate how close a better-informed substitute might have come?"
