id: lex-abbes
name: failure-to-justify-your-doubt-does-not-license-full-certainty
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "Schwitzgebel defends what he calls '1% skepticism': roughly 99% credence in ordinary non-skeptical realism and about 1% credence in the disjunction of all radically skeptical scenarios combined (dreaming, brain-in-a-vat, short-term simulation, and the rest). The interesting move is what he does when he can't rigorously defend the number itself. He cannot conclusively refute radical skeptical arguments, and he also cannot precisely justify why the residual credence should be 1% rather than 0.01% or 10%. The natural response to that embarrassment is to treat the imprecision itself as license to round back up to virtual certainty, on the theory that unresolved doubt about how much to doubt should default to confidence. He argues the reverse: failing to pin down how much certainty is warranted should push confidence downward -- meta-doubt turns out to be more friend than foe of the skeptic, because slamming a credence up to 100% precisely when you're unsure what the credence should be is the wrong direction to round. The second half of the move governs where the residual goes. Pinning substantial credence on any ONE specific skeptical scenario -- 'I am probably dreaming right now, specifically' -- is unstable and hard to defend; a small credence spread across the whole disjunction of scenarios you cannot individually rule out is stable, because it commits to none of them individually, only to refusing to certify their joint negation at 100%. Transferable move: when you're pressed to defend an exact confidence level and discover you can't rigorously derive the number -- your own calibration is itself uncertain -- do not treat that gap as grounds to round up to the default view's full confidence. Hold a small, explicit residual open instead, and keep it stable by distributing it across the live alternatives you can't rule out rather than fixating it on one favored alternative."
related: [lex-v39j4, lex-nn3u9]
evokes: [schwitzgebel-2021-weirdness-of-the-world, 1-percent-skepticism, radical-skepticism, brain-in-a-vat, meta-doubt, epistemic-humility, credence, dream-argument, dont-round-up-to-certainty]
lineage:
  - source: primary
    text: schwitzgebel-2021-weirdness-of-the-world
    citation: "Eric Schwitzgebel, The Weirdness of the World (draft, October 26, 2021), Ch. 4 '1% Skepticism,' p. 98."
    quote: "'I have about a 1% credence in the disjunction of all radically skeptical scenarios combined. That is to say: I am about 99% confident that I am awake, not massively deluded, and have existed for decades in roughly the form I think I have existed, doing roughly the sorts of things I think I have been doing; and I find it about 1% subjectively likely that instead some radically skeptical possibility obtains.'"
  - source: primary
    text: schwitzgebel-2021-weirdness-of-the-world
    citation: "Eric Schwitzgebel, The Weirdness of the World (draft, October 26, 2021), Ch. 4 '1% Skepticism,' section 5 ('Grounds for Doubt: Conclusion'), p. 115."
    quote: "'Virtual certainty doesn't seem like the proper reaction. If you don't know how much certainty you should have, slamming your credence up to 100% seems like exactly the wrong thing to do. Meta-doubt -- doubt about proper extent of one's doubt -- is more friend than foe of the 1% skeptic.'"
  - source: primary
    text: schwitzgebel-2021-weirdness-of-the-world
    citation: "Eric Schwitzgebel, The Weirdness of the World (draft, October 26, 2021), Ch. 4 '1% Skepticism,' section 6 ('Is 1% Skepticism Self-Defeating?'), p. 117."
    quote: "'What is plausibly self-defeating or epistemically unstable is high credence in one specific skeptical scenario. Assigning over 50% credence to being a freak observer based on seemingly excellent cosmological evidence probably is cognitively unstable. [...] But 1% skepticism is a different matter, since it tolerates a diversity of scenarios and trades only in low credences imprecisely specified.'"
canonical-instances:
  - "A forecaster pressed to defend a point estimate on a genuinely hard-to-model question (pandemic peak timing, an election outcome) cannot rigorously derive the number and feels the pull to either shrug to 'no real answer' or round to whatever confident figure the loudest expert offers. The better move is a stated small-but-nonzero credence for the alternatives that can't be ruled out, held open rather than collapsed either direction."
  - "Someone auditing a long-held political or religious conviction discovers they cannot actually derive their confidence level from first principles. The temptation is to treat the effort already invested in thinking it through as itself proof the confidence is earned; the discipline is recognizing that an undischarged gap in the justification argues for a somewhat more open stance."
  - "Operationally distinct from lex-v39j4 eikos-provisional-account-under-uncertainty: eikos is about being willing to SPEAK a labeled provisional account instead of withholding judgment until certainty arrives. This atom is about the opposite failure -- not withholding, but overcorrecting into false certainty BECAUSE you can't cleanly justify how much doubt to hold. Eikos licenses provisional speech; this atom blocks premature closure."
  - "Distinct from ordinary probabilistic hedging ('I'm not 100% sure, but...'): ordinary hedging is compatible with concentrating all the leftover doubt on one specific alternative hypothesis. This atom adds a stability requirement: piling residual credence onto a single favored alternative is itself hard to defend and prone to collapse into a covert bet on a fringe belief. Keeping the residual spread thin across the whole set of live alternatives is what makes the position sustainable."
critical-questions:
  - "How do you tell principled residual doubt from paralysis or performative doubt that never changes any decision? A residual credence that never once tips a close call at the margins may be decorative rather than genuine -- the test is whether it is small enough not to disrupt ordinary decisions but real enough to occasionally matter."
  - "Is the residual actually spread across a genuine disjunction of live alternatives, or is it quietly being loaded onto one favored alternative? Concentrating meta-doubt onto a single specific scenario is the unstable failure mode this atom's own source distinguishes from its position."
  - "Could 'I can't be sure, so I'll hold some doubt open' become a rhetorical move for evading a well-supported conclusion? The atom licenses calibration under genuine uncertainty about one's own uncertainty -- it is not a general permission to hedge on claims that already have strong direct support."
status: active
