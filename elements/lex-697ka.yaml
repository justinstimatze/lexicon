id: lex-697ka
name: frameworks-evolve-via-cycles-of-normal-stability-and-revolutionary-reframing
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when a knowledge field, profession, design discipline, or even individual mental model is treated as if it accumulates progress via continuous extension when the actual dynamic is CYCLIC alternation between two phases. Kuhn's framework: NORMAL PHASE — practitioners operate within a shared paradigm (set of exemplary problem-solutions + tacit commitments about what counts as a legitimate problem + what counts as a legitimate answer); puzzle-solving within the framework; the paradigm appears comprehensive + adequate. ANOMALY PHASE — observations that the paradigm cannot resolve accumulate; initially treated as practitioner-failures or fringe-curiosities; eventually too numerous or too central to dismiss. CRISIS — paradigm-defenders dig in; competing proto-paradigms surface; the field's social-fabric strains. REVOLUTIONARY PHASE — a new paradigm emerges that reframes the problem-space, often produced by a young practitioner or outsider; adoption is non-continuous (the new framework is INCOMMENSURABLE with the old — different concepts, different problems-worth-solving, different criteria-for-success); proponents of the old paradigm typically do not convert (Planck: `science advances one funeral at a time`); the new paradigm becomes the next normal-phase basis. Kuhn's canonical scientific cases: Ptolemaic → Copernican astronomy; phlogiston → oxygen chemistry; Newtonian → Einsteinian physics; vitalism → mechanistic biology; classical → quantum mechanics. Transferable applications: software architecture (waterfall → agile → DevOps → AI-native; monolith → microservices → serverless); ML approaches (symbolic → connectionist → deep learning → LLMs/transformers); business models (mainframe → PC → web → mobile → AI-native interface); medical practice (humoral → germ-theory → genomic → microbiome); psychological therapy (psychoanalytic → behaviorist → cognitive → contextual → acceptance-and-commitment); economic methodology (institutional → marginalist → Keynesian → monetarist → behavioral); legal philosophy (formalism → legal-realism → law-and-economics → critical-legal-studies); religious paradigms (ancestor cults → axial age → revelation religions → secular modernity → post-secular); personal identity reframings (psychoanalytic-narrative therapy literature on `identity-reconstruction` as Kuhn-style paradigm shift in the self-narrative). Distinct from lex-fn2gx paradigm-supersession-narrative-obscures-unrationalized-coexistence-of-conflicting-models — lex-fn2gx is the SOCIOLOGICAL FAILURE MODE where the supersession-narrative covers persistent multi-paradigm reality; lex-697ka names the STRUCTURAL CYCLE that makes paradigm-shifts a distinct kind of progression at all. They compose. Distinct from lex-d234k sensemaking-is-retrospective-construction-of-meaning-from-action (Weick) — Weick is about how individual + organizational sensemaking attaches meaning to action; Kuhn is about how field-level shared-frameworks transition. Distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions — Mendeleev-style gap-prediction operates within a paradigm; Kuhn names the dynamic between paradigms. Use when (i) someone treats incremental progress as the only mode of intellectual advance, (ii) a defender of a status-quo framework dismisses anomalies as practitioner-failures, (iii) you are evaluating whether a field is in normal-phase or pre-revolutionary crisis. Counter-move: identify the active paradigm, list its currently-unresolved anomalies, ask whether the field is in normal-phase puzzle-solving or in pre-crisis."
