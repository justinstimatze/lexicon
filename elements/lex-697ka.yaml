lineage:
  - source: primary
    text: Kuhn-1962-StructureOfScientificRevolutions
    citation: "Thomas S. Kuhn, *The Structure of Scientific Revolutions* (University of Chicago Press 1962; 2nd ed. 1970 with `Postscript-1969`; 3rd ed. 1996; 4th ed. 2012 with introductory essay by Ian Hacking). The foundational analysis of scientific development as ALTERNATION between normal-phase puzzle-solving (within an accepted paradigm) and revolutionary-phase paradigm-replacement (when accumulated anomalies trigger crisis + the emergence of an incommensurable new framework). Kuhn introduces several transferable terms now standard: PARADIGM (shared exemplars + tacit framework commitments — Kuhn later refines this to `disciplinary matrix` + `exemplar`); NORMAL SCIENCE (puzzle-solving + measurement-refinement + paradigm-application within the framework); ANOMALY (observation the paradigm cannot account for); CRISIS (sustained anomaly accumulation overwhelms paradigm defenders); REVOLUTION (paradigm replacement, typically by younger practitioners + outsiders); INCOMMENSURABILITY (the new paradigm cannot be derived from the old by continuous extension — different concepts, different problems-worth-solving, different success-criteria). Kuhn's canonical historical cases: Ptolemy → Copernicus (astronomy); phlogiston → Lavoisier oxygen (chemistry); Newton → Einstein (physics); Aristotelian → Galilean mechanics; pre-Darwinian → Darwinian biology. The transferable form lex-697ka lifts the structural cycle into its general form, applicable to any knowledge field, profession, design discipline, ML approach, business model, therapeutic paradigm, or theory of mind. The framework has been productively extended across software architecture, ML history, business strategy, therapy, religion, legal philosophy, and personal identity. Debunking check applied: Kuhn's specific claims about scientific progress have been substantially contested in philosophy of science — Popper 1970 + Lakatos 1970 + Laudan 1977 + Feyerabend 1975 advance distinct critiques; the strong-incommensurability thesis is contested (Putnam, Davidson); the rigid normal/revolutionary distinction is treated as over-schematic by Toulmin + Hacking. The STRUCTURAL CYCLE claim (frameworks alternate between stable + revolutionary phases; the transition is not pure continuous-extension; the new framework is at least partially-incommensurable with the old) is well-attested across scientific history + sociology of science even by Kuhn's critics. The atom encodes the structural primitive separately from the philosophical-specifics."
    quote: "[Kuhn 1962/1970 Preface vii-viii, on the cycle structure:] 'My decision to deal here exclusively with the latter [physical science] was made partly to increase this essay's coherence and partly on grounds of present competence. In addition, the view of science to be developed here suggests the potential fruitfulness of a number of new sorts of research, both historical and sociological. For example, the manner in which anomalies, or violations of expectation, attract the increasing attention of a scientific community needs detailed study, as does the emergence of the crises that may be induced by repeated failure to make an anomaly conform.' [Ch.X on incommensurability:] 'In the metaphorical no less than in the literal use of \"seeing,\" interpretation begins where perception ends. The two processes are not the same, and what perception leaves for interpretation to complete depends drastically on the nature and amount of prior experience and training.' [Ch.XII on the role of crisis:] 'Crises are a necessary precondition for the emergence of novel theories.' [Postscript-1969 on disciplinary matrix:] 'A paradigm is what the members of a scientific community share, and, conversely, a scientific community consists of men who share a paradigm.' [Ch.XII on the non-conversion of paradigm-defenders, paraphrasing Max Planck:] 'A new scientific truth does not triumph by convincing its opponents and making them see the light, but rather because its opponents eventually die, and a new generation grows up that is familiar with it.' [Practitioner-extraction for transferable lex-697ka: the structural cycle — normal-phase puzzle-solving within a paradigm → anomaly accumulation → crisis → revolutionary reframing → new normal phase — generalizes across knowledge-fields and into design + business + therapeutic contexts. The incommensurability claim makes paradigm-shift a distinct kind of progression from continuous extension.]"
  - source: cross-attestation
    text: cross-domain-paradigm-cycle-attestation
    citation: "Cross-domain attestation that the Kuhn paradigm-cycle structural form recurs across software architecture, ML history, business models, medical practice, psychological therapy, economic methodology, legal philosophy, religious paradigms, and personal-identity reframings. (a) Software architecture: Fowler 2014 *Patterns of Enterprise Application Architecture* + Newman 2015 *Building Microservices* + the AI-native-architecture literature (LangChain, agent-frameworks) document the cycle waterfall → agile → DevOps → AI-native, with each transition non-continuous + incommensurable in success-criteria. (b) ML history: Russell + Norvig *AIMA* 4th ed Ch.1 documents the symbolic → connectionist → deep-learning → transformer cycle with explicit reference to Kuhnian paradigm shifts. The shift to transformer-based LLMs around 2017-2022 is widely characterized as paradigm-shift, with proponents of symbolic approaches not converting. (c) Business models: Christensen 1997 *Innovator's Dilemma* (lex-mxdrn substrate-grounded) operationalizes the paradigm-shift dynamic for business — incumbent firms in normal-phase puzzle-solving cannot transition to disruptive new paradigms even when they have the resources, because their success-criteria are incommensurable with the new paradigm's. (d) Medical practice: Engel 1977 *The Need for a New Medical Model* explicitly invokes Kuhn for the biopsychosocial paradigm critique of biomedical reductionism; subsequent literature on precision medicine + microbiome paradigm + integrative medicine continues the explicit Kuhnian framing. (e) Psychological therapy: Hayes et al 2006 ACT literature + Mahoney 1991 *Human Change Processes* explicitly frame the psychoanalytic → behaviorist → cognitive → contextual cycle as Kuhnian paradigm shifts. (f) Economic methodology: McCloskey 1985 *Rhetoric of Economics* + Backhouse 2010 *The Puzzle of Modern Economics* analyze the institutional → marginalist → Keynesian → monetarist → behavioral cycle in Kuhnian terms. (g) Legal philosophy: formalism → legal-realism → law-and-economics → critical-legal-studies → behavioral-law-and-economics cycles documented across legal-history literature with explicit Kuhnian framing (Posner 1972, Kennedy 1976, Sunstein 1996, Jolls-Sunstein-Thaler 1998). (h) Religious paradigms: Bellah 2011 *Religion in Human Evolution* + Jaspers 1949 *Origin and Goal of History* (axial age framework) document ancestor-cult → axial age → revelation religion → secular modernity → post-secular cycles. (i) Personal identity: White + Epston 1990 *Narrative Means to Therapeutic Ends* + subsequent narrative therapy literature operationalizes personal-identity reconstruction as Kuhn-style paradigm shift in the self-narrative. (j) Climate science: Oreskes + Conway 2010 *Merchants of Doubt* documents the geology-of-climate paradigm-shift from natural-variability to anthropogenic-forcing as Kuhnian transition with active resistance by paradigm-defenders. The cross-domain attestation establishes the transferable structural form: knowledge frameworks alternate between normal-phase puzzle-solving and revolutionary-phase reframing; the transition is non-continuous; the new framework is at least partially-incommensurable with the old."
    quote: "Across software architecture (Fowler 2014, Newman 2015), ML history (Russell-Norvig AIMA 4th), business models (Christensen 1997 *Innovator's Dilemma*), medical practice (Engel 1977 biopsychosocial), psychological therapy (Hayes et al 2006 ACT, Mahoney 1991), economic methodology (McCloskey 1985, Backhouse 2010), legal philosophy (Posner 1972, Kennedy 1976, Sunstein-Jolls-Thaler 1998), religious paradigms (Bellah 2011, Jaspers 1949 axial age), personal identity (White + Epston 1990 narrative therapy), and climate science (Oreskes-Conway 2010), the same structural cycle recurs — frameworks alternate between normal-phase puzzle-solving and revolutionary-phase reframing; the transition is non-continuous; the new framework is at least partially-incommensurable with the old. The transferable diagnostic: identify the active framework, name its currently-unresolved anomalies, ask whether the field is in normal-phase or pre-crisis."
canonical-instances:
  - "Kuhn's canonical case: Ptolemaic geocentric astronomy (normal phase ~150-1500) accumulated anomalies (planetary motion irregularities → epicycles → Tychonic system) → crisis → Copernican heliocentric paradigm (revolutionary phase) → Newtonian mechanics consolidates the new paradigm into next normal phase. The Copernican-to-Newtonian transition takes ~150 years; older astronomers largely do not convert."
  - "Phlogiston to oxygen chemistry (1660s-1780s): Stahl's phlogiston paradigm accommodates most observations through normal phase; Priestley + Lavoisier discover that combustion-adds-mass (anomaly); Lavoisier's oxygen theory reframes the problem-space. Priestley refuses to convert, dies a phlogistonist."
  - "Newtonian to Einsteinian physics (1900s-1920s): Newtonian normal phase (~1700-1880) accumulates anomalies (Michelson-Morley null result; black-body radiation; photoelectric effect; Mercury perihelion precession); Einstein's special-and-general relativity reframes simultaneity, gravity, and spacetime; classical-physics proponents (Lorentz, Poincaré) partially-convert; younger generation adopts relativity as next normal phase."
  - "ML history: symbolic AI → connectionist → deep learning → transformer-LLMs (Russell-Norvig AIMA 4th ed Ch.1). Each transition is non-continuous; symbolic-AI proponents in the 1990s largely did not convert to connectionist; many connectionist-era researchers did not convert to deep-learning specifics; the 2017-2022 transformer shift is widely characterized as Kuhnian paradigm shift in real-time."
  - "Software architecture: waterfall (normal phase ~1970-1990s) → anomaly accumulation (project failures, requirements-change resistance) → crisis → agile/XP/scrum revolutionary reframing (Beck et al 2001 Agile Manifesto); subsequent micro-shifts to DevOps, GitOps, and AI-native architecture. Each transition reframes success-criteria (waterfall: complete documentation; agile: working software)."
  - "Medical practice: humoral medicine → germ theory (Koch + Pasteur ~1880s); biomedical reductionism → biopsychosocial paradigm (Engel 1977); subsequent shifts to genomic medicine, microbiome paradigm, integrative medicine. Each shift reframes what counts as a legitimate medical problem."
  - "Psychological therapy: psychoanalytic (Freud, ~1900-1950) → behaviorist (Watson, Skinner, ~1920-1960) → cognitive (Beck, Ellis, ~1960-1980) → contextual + acceptance-based (Hayes et al ACT, mindfulness-integrated, ~1980-present). Each shift reframes what counts as a legitimate therapeutic intervention + criterion-of-improvement."
  - "Christensen 1997 *Innovator's Dilemma* (lex-mxdrn substrate-grounded): explicitly operationalizes the paradigm-shift dynamic for business — incumbents in normal-phase puzzle-solving cannot transition to disruptive new paradigms because their success-criteria are incommensurable with the new paradigm's. lex-mxdrn + lex-697ka compose tightly."
  - "operationally distinct from lex-fn2gx paradigm-supersession-narrative-obscures-unrationalized-coexistence-of-conflicting-models: lex-fn2gx is the SOCIOLOGICAL FAILURE MODE where supersession-narrative covers persistent multi-paradigm reality (e.g., quantum vs classical mechanics still both operative in different domains). lex-697ka names the STRUCTURAL CYCLE that makes paradigm-shifts a distinct kind of progression. They compose: lex-697ka names the cycle; lex-fn2gx names a known sociological-failure-mode in how the cycle is narrated."
  - "operationally distinct from lex-d234k sensemaking-is-retrospective-construction-of-meaning-from-action (Weick): Weick is about INDIVIDUAL + ORGANIZATIONAL sensemaking attaching meaning to action retrospectively. Kuhn is about FIELD-LEVEL SHARED frameworks transitioning through cycles. Different scales; different mechanisms."
  - "operationally distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions: Mendeleev-style gap-prediction operates WITHIN a paradigm (the periodic-table framework predicts where new elements should fit). lex-697ka names the dynamic BETWEEN paradigms. They are complementary: lex-3d2he is normal-phase prediction-from-classification; lex-697ka is paradigm-level cycle."
  - "operationally distinct from lex-mxdrn customer-focused-resource-allocation-rejects-disruption-until-too-late (Christensen disruption): lex-mxdrn names the SPECIFIC BUSINESS mechanism by which incumbents fail to transition. lex-697ka names the GENERAL paradigm-shift cycle that lex-mxdrn is a specific instance of. lex-697ka is broader; lex-mxdrn is the business-context specialization."
critical-questions:
  - "Is the framework you are analyzing actually in normal-phase, anomaly-phase, or crisis? Operational diagnostic: enumerate the paradigm's currently-unresolved anomalies. If small + treated as practitioner-failure, normal phase. If accumulating + treated seriously by mainstream practitioners, anomaly phase. If competing proto-paradigms surface + field's social-fabric is straining, crisis."
  - "Is the strong-incommensurability claim vital for the atom? No — partial-incommensurability is sufficient. The structural cycle holds even when the new paradigm contains the old as a limiting case (Newtonian mechanics is a limiting case of relativistic mechanics under low-velocity conditions). What matters for the atom is that the new framework reframes problem-space + success-criteria such that continuous extension from the old is not the path that was taken."
  - "Does the atom imply paradigm shifts are irrational? No. Kuhn's framework does not commit to paradigm-shifts being irrational; later philosophy-of-science (Lakatos, Laudan) addresses the rationality question separately. The atom encodes the structural cycle; questions of rationality of specific transitions are downstream."
  - "Could the atom be misused to characterize every novel idea as paradigm shift? Yes — and this is a known misuse pattern (`paradigm shift` is overused in pop-business literature). Discipline against: paradigm shift requires (i) substantial pre-shift normal-phase, (ii) anomaly accumulation that the prior framework cannot account for, (iii) reframing of problem-space + success-criteria, (iv) non-continuous adoption with paradigm-defender non-conversion. Most `paradigm shift` claims fail one or more criteria."
  - "How does the atom apply at the personal-identity level? White + Epston 1990 narrative-therapy literature operationalizes personal-identity reconstruction as Kuhn-style paradigm shift. The diagnostic: the old self-narrative could not account for accumulated anomalies (`I am not the kind of person who...` becomes increasingly violated by actual behavior); crisis emerges; the new self-narrative reframes what-counts-as-self-consistent-action."
