id: lex-uu2df
name: mass-mimicry-of-a-predators-own-display-turns-intimidation-back-on-it
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A group targeted by a single intimidating predator can defeat the intimidation without ever fighting back, simply by having every member mirror the predator's own threat display. Reflected back from hundreds of directions at once, the display stops being readable at all. The predator's display depended on being unanswerable. Mimicked at scale, it becomes disorienting instead. In the Jataka's tale of the drilled boars, a tiger has been terrorizing a colony of boars until the Carpenter's Boar trains the herd to mirror every gesture the tiger makes. The tiger's own account of the reversal names exactly what broke it: 'Now so far from running, they actually stand up against me! Whatever I do, they mimic. There's a fellow yonder on a commanding position: he it is who has organised the rabble. Well, I don't see how to get the better of them.'"
related: []
