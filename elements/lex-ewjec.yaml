lineage:
  - source: primary
    text: marx-1867-capital-vol-i-part-viii
    citation: "Karl Marx, *Capital: A Critique of Political Economy* Vol. I (1867; Moore-Aveling trans. 1887). Part VIII 'So-called Primitive Accumulation,' Ch.26 'The Secret of Primitive Accumulation' + Ch.28 'Bloody Legislation against the Expropriated, from the End of the 15th Century. Forcing down of Wages by Acts of Parliament' (the 'dull compulsion' passage). Marx's key claim: the capitalist mode of production REQUIRES a pre-condition that the labourer be SEPARATED from their means of subsistence — once that separation is in place, trade-with-capital becomes structurally non-voluntary at scale even though each individual trade looks voluntary at the moment of exchange. The PROCESS that achieves the separation (enclosure of commons; dissolution of feudal land-tenure rights; suppression of cottage industry; English bloody legislation 1349-1700+) Marx calls so-called primitive accumulation. The MAINTENANCE of the separation once established Marx calls 'the dull compulsion of economic relations' — direct force is needed only at the establishment phase; afterward 'the labourer can be left to the natural laws of production,' i.e., to his dependence on capital. PD globally (Marx d.1883; first publication 1867)."
    quote: "[Marx 1867 Vol I Ch.26, the so-called-primitive-accumulation claim:] 'The capitalist system presupposes the complete separation of the labourers from all property in the means by which they can realize their labour. As soon as capitalist production is once on its own legs, it not only maintains this separation, but reproduces it on a continually extending scale. The process, therefore, that clears the way for the capitalist system, can be none other than the process which takes away from the labourer the possession of his means of production; a process that transforms, on the one hand, the social means of subsistence and of production into capital, on the other, the immediate producers into wage labourers. The so-called primitive accumulation, therefore, is nothing else than the historical process of divorcing the producer from the means of production.' [On the violence of the establishment phase:] 'In actual history it is notorious that conquest, enslavement, robbery, murder, briefly force, play the great part. In the tender annals of Political Economy, the idyllic reigns from time immemorial... As a matter of fact, the methods of primitive accumulation are anything but idyllic... these new freedmen became sellers of themselves only after they had been robbed of all their own means of production, and of all the guarantees of existence afforded by the old feudal arrangements. And the history of this, their expropriation, is written in the annals of mankind in letters of blood and fire.' [Ch.28 the 'dull compulsion' passage — the essential claim that establishment-phase coercion is followed by maintenance-phase structural-dependence requiring no further coercion at the trade:] 'The advance of capitalist production develops a working class, which by education, tradition, habit, looks upon the conditions of that mode of production as self-evident laws of Nature. The organisation of the capitalist process of production, once fully developed, breaks down all resistance. The constant generation of a relative surplus-population keeps the law of supply and demand of labour, and therefore keeps wages, in a rut that corresponds with the wants of capital. The dull compulsion of economic relations completes the subjection of the labourer to the capitalist. Direct force, outside economic conditions, is of course still used, but only exceptionally. In the ordinary run of things, the labourer can be left to the \"natural laws of production,\" i.e., to his dependence on capital, a dependence springing from, and guaranteed in perpetuity by, the conditions of production themselves.' [Practitioner-extraction: Marx's transferable claim is the two-phase structure — phase 1: violent removal of non-market exits (enclosure, dispossession, legal suppression of alternatives); phase 2: structural-dependence on capital that requires no further coercion at the moment-of-trade because all alternatives have been extinguished. The thin-voluntary character of the individual labour-contract is preserved; the substantive non-voluntary character emerges from the option-distribution.]"
  - source: primary
    text: polanyi-1944-great-transformation-ch3-ch6
    citation: "Karl Polanyi, *The Great Transformation: The Political and Economic Origins of Our Time* (Farrar & Rinehart 1944). Ch.3 'Habitation versus Improvement' (the Tudor enclosure case study) + Ch.6 'The Self-Regulating Market and the Fictitious Commodities: Labor, Land, and Money.' Polanyi's foundational claim cross-attests Marx's primitive-accumulation argument from a different angle: labor, land, and money are NOT genuine commodities (they are not produced for sale; they are constitutive of human life, nature, and purchasing-power respectively), so treating them as commodities is a FICTION. The fiction requires institutional violence to establish — the establishment phase requires the same dispossession Marx names — and once established creates 'the demolition of society' because the fictitious-commodity mechanism is incompatible with the substantive nature of what it commodifies. The 'Satanic mill' is Polanyi's name for the self-regulating market once it has been so engineered. Polanyi's enclosure-case study (Tudor 1490s-1640s) attests Marx's establishment-phase claim with primary documentation: 'Enclosures have appropriately been called a revolution of the rich against the poor. The lords and nobles were upsetting the social order, breaking down ancient law and custom, sometimes by means of violence... They were literally robbing the poor of their share in the common.' In-copyright."
    quote: "[Polanyi 1944 Ch.3, on Tudor enclosure as the establishment-phase mechanism:] 'Enclosures have appropriately been called a revolution of the rich against the poor. The lords and nobles were upsetting the social order, breaking down ancient law and custom, sometimes by means of violence, often by pressure and intimidation. They were literally robbing the poor of their share in the common, tearing down the houses which, by the hitherto unbreakable force of custom, the poor had long regarded as theirs and their heirs'. The fabric of society was being disrupted; desolate villages and the ruins of human dwellings testified to the fierceness with which the revolution raged, endangering the defences of the country, wasting its towns, decimating its population, turning its overburdened soil into dust, harassing its people and turning them from decent husbandmen into a mob of beggars and thieves.' [On the structural-coercion-once-established claim from the 1607 Lords-of-the-Realm document:] '\"The poor man shall be satisfied in his end: Habitation; and the gentleman not hindered in his desire: Improvement.\" This formula appears to take for granted the essence of purely economic progress, which is to achieve improvement at the price of social dislocation. But it also hints at the tragic necessity by which the poor man clings to his hovel, doomed by the rich man's desire for a public improvement which profits him privately.' [Ch.6 the fictitious-commodities argument cross-attesting Marx's separation claim from the angle of what-labor-actually-is:] 'Labor is only another name for a human activity which goes with life itself, which in its turn is not produced for sale but for entirely different reasons, nor can that activity be detached from the rest of life, be stored or mobilized; land is only another name for nature, which is not produced by man; actual money, finally, is merely a token of purchasing power which, as a rule, is not produced at all... The commodity description of labor, land, and money is entirely fictitious. Nevertheless, it is with the help of this fiction that the actual markets for labor, land, and money are organized; they are being actually bought and sold on the market.' [The substantive-vs-thin-voluntary claim:] 'To allow the market mechanism to be sole director of the fate of human beings and their natural environment, indeed, even of the amount and use of purchasing power, would result in the demolition of society. For the alleged commodity \"labor power\" cannot be shoved about, used indiscriminately, or even left unused, without affecting also the human individual who happens to be the bearer of this peculiar commodity. In disposing of a man's labor power the system would, incidentally, dispose of the physical, psychological, and moral entity \"man\" attached to that tag. Robbed of the protective covering of cultural institutions, human beings would perish from the effects of social exposure; they would die as the victims of acute social dislocation through vice, perversion, crime, and starvation... Undoubtedly, labor, land, and money markets are essential to a market economy. But no society could stand the effects of such a system of crude fictions even for the shortest stretch of time unless its human and natural substance as well as its business organization was protected against the ravages of this Satanic mill.' [Practitioner-extraction: Polanyi's transferable add-on to Marx is the FICTITIOUS-COMMODITY frame — the substances being commodified (labor, land, money) are NOT produced-for-sale and treating them as commodities requires both establishment-phase violence (enclosure) AND maintenance-phase social-cost-externalization. The atom integrates: removal of non-market exits is engineering-phase 1; structural-dependence + cost-externalization on the fictitious-commodity substances is engineering-phase 2; the substantive non-voluntary character of the resulting trade is engineered, not natural.]"
canonical-instances:
  - "Tudor enclosure of English commons (Polanyi Ch.3 1944): late 15th to mid-17th century enclosure of open fields + conversion to pasture removed peasant grazing/gleaning/firewood-gathering rights on commons, dispossessing rural households from their non-market subsistence-base. Once dispossessed, the only remaining option was wage-labor in nascent woolen industry or migration to towns. The individual labor-contract was 'voluntary' (no individual lord forced any specific peasant into any specific job); the structural-coercion was the prior removal of the alternatives. The canonical-instance because Marx + Polanyi independently identified the same case with the same mechanism"
  - "Highland Clearances Scotland 1750-1860: dispossession of Highland tenant-cottars by lairds converting clan land to large sheep-runs; mass eviction backed by legal force (the 1845 Cnoc an Fhreiceadain case, the 1849 Sollas evictions). The cleared population had no choice but to emigrate (Canada, Australia, US) or move to the Lowland industrial slums. Same two-phase mechanism: establishment-phase violence + maintenance-phase dependence on the market that 'voluntarily' emerged"
  - "European colonial dispossession in Africa, Americas, Australia, Asia (16th-20th centuries): conquest + legal-system-imposition removed indigenous peoples from land-and-subsistence access (legally codified as terra nullius doctrine; Royal Proclamation 1763 in N. America; aboriginal-land legislation in Australia; reservation system in US). Once dispossessed, indigenous populations entered wage labor in mines, plantations, and settler economies as the only remaining provisioning option. The classic atom-instance at colonial scale"
  - "modern enclosure of digital commons (2010s-2020s): the establishment phase was the user-generated-content boom of the 2000s (Wikipedia, open-source, blogs, forums) where shared digital provisioning operated outside any single platform. The enclosure phase came as platform networks (Facebook, Google search, Twitter, App Store, etc.) captured the access-paths to that content; once captured, creator-and-user dependence on platform terms-of-service became structural — independent web-publishing remained 'free' but its discoverability and revenue had been routed through enclosed platforms. The platform-tax (Apple 30%; Google search-result ranking; Meta algorithmic distribution) is dull-compulsion in modern form; each individual TOS-acceptance is 'voluntary'; the structural-coercion is the prior enclosure of distribution"
  - "company-towns + housing-monopoly: the historical company-town (US Pullman 1880s-1894; Welsh coal-mining; Appalachian coal-camp) removed worker-alternatives to employer-housing + employer-store + employer-script; worker dependence on the employer became structural. Same mechanism in microcosm: the establishment phase is exit-removal; the maintenance phase is dull-compulsion at the trade. Modern variants: H-1B visa-holders whose immigration status is tied to a specific employer (exit-removal via visa rules creates structural employer-dependence); single-company towns in mining/oil/lumber where geographic isolation removes labor-market alternatives"
  - "operationally distinct from lex-srj3h harm-principle (Mill): lex-srj3h is Mill's INDIVIDUAL-AGGRESSOR framing — coercion is when one identifiable actor uses force on another. lex-ewjec is the STRUCTURAL-OPTION-DISTRIBUTION framing — coercion is the result of a prior process that removed alternatives, even though no individual aggressor is present at the moment of trade. The two atoms describe DIFFERENT theories of coercion and DIFFERENT remedies (Mill: prevent the aggressor; Marx/Polanyi: restore the alternatives). They occasionally co-fire (a company-town that removes alternatives AND uses goons against organizers) but the diagnostic differs: lex-srj3h asks 'is there an aggressor present?'; lex-ewjec asks 'has the option-distribution been engineered?'"
  - "operationally distinct from lex-cmkdq labor-as-self-objectification-substrate: lex-cmkdq is the Hegel-side of Marx (labor produces self-consciousness through making-something-that-persists). lex-ewjec is the Marx-Vol-I-Part-VIII side (capitalist-mode-of-production presupposes prior separation of labourer from means of subsistence). Same author, different primitives; they co-fire in any analysis of capitalist work-relations but diagnose different aspects (lex-cmkdq the productive-self-relation; lex-ewjec the option-distribution-coercion)"
  - "operationally distinct from lex-sxwn7 balanced-mutual-checking (Acemoglu narrow-corridor): lex-sxwn7 is state-society balance maintaining liberty; lex-ewjec is the engineering of structural market-dependence by removal of non-market exits. They name different mechanisms operating on different axes (state-vs-society balance vs market-vs-non-market option-distribution). Acemoglu-Robinson's 'cage of norms' (the absent-Leviathan failure mode) and Polanyi's 'demolition of society' (the unprotected-Satanic-mill failure mode) are different failure modes; the atoms are independent though they co-fire in compound diagnoses"
  - "compositional with lex-b9us2 legibility-via-standardization: Marx's enclosure phase REQUIRED Scott-style legibility-imposition (cadastral surveys of land-to-be-enclosed; population registers for the dispossessed; standardization of legal property categories to extinguish overlapping use-rights). Scott's mechanism (schema imposed → metis erased) is the institutional MEANS by which the enclosure phase of lex-ewjec is executed. The two atoms are conceptually distinct but compositionally interlocked in the historical instances — you cannot enclose without first legibilizing; you cannot make the legibility-imposition stick without enclosure to give the categories the force of law (Scott's own argument in Ch.1)"
critical-questions:
  - "the establishment-phase-vs-maintenance-phase test: Marx's mechanism has TWO phases that are easy to conflate. Establishment-phase requires direct force (enclosure law, eviction, legal suppression of alternatives); maintenance-phase requires no direct force at the trade because the alternatives have been extinguished. Practitioner-question: at this site, are we observing establishment-phase active dispossession, or maintenance-phase structural-dependence? The political response differs: establishment-phase calls for legal restraint of the dispossessing actors; maintenance-phase calls for either restoring alternatives (re-commons, public-option) or compensating the structural-coercion via redistribution. Conflating the two leads to bad analysis"
  - "the alternative-removal-test (the decisive question): for the atom to apply, you must be able to NAME the specific non-market alternatives that were removed AND the specific mechanism that removed them. Practitioner-discipline: 'voluntary trade is structurally coerced' fails as analysis without specifying the prior exit-removal. Without naming the removed alternative + the removal mechanism, the claim collapses to libertarian-bait (every trade looks voluntary; show me a coercer) or to socialist-applause (it's all coercion; nothing more to say). The atom's discriminating power lives in the named exits"
  - "the can-the-alternatives-be-restored test: the atom predicts that restoring the alternatives changes the structural-coercion character of trade. Practitioner-question: in this case, can the removed alternatives be reasonably restored (re-commons; universal basic income that gives an exit; public housing that breaks landlord-monopoly; non-platform distribution channels)? If yes, the atom prescribes restoring them; if no (because the alternatives are intrinsically incompatible with current scale or technology), then redistribution within the market is the only available remedy. Polanyi's double-movement is the empirical history of the second response when the first is unavailable"
  - "the fictitious-commodity test (Polanyi's extension): the atom hits hardest when the commodified substance is NOT actually produced-for-sale (labor = human life; land = nature; money = token-of-purchasing-power; data = behavioral residue). Practitioner-question: in this case, what is being commodified, and is it produced-for-sale? If yes, the standard market-coordination theory applies; if no, the fictitious-commodity dynamics (structural-coercion at acquisition + cost-externalization in operation) apply. The atom's compatibility with PROP-3 dollar-weighting + PROP-6 market-coercion-molecule (when those atoms exist) operates through this test"
  - "the dull-compulsion-vs-direct-force question (Marx's distinction): Marx explicitly notes 'Direct force, outside economic conditions, is of course still used, but only exceptionally' — at-the-trade direct-force is exceptional, not central. The atom names a regime in which routine maintenance is structural, but spasms of direct force remain available for restoring the structural-coercion when it is challenged (strikebreaking; eviction; police-clearing of homeless encampments). Practitioner-question: when this structural-coercion regime is challenged, what is the direct-force response mechanism, and how is it triggered? The atom does not predict the trigger threshold, but the regime always retains the direct-force backup"
