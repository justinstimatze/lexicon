id: lex-pnh7q
name: the-same-defection-is-renegade-to-one-group-convert-to-another
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "The same act — leaving one group's values behind and adopting another's — gets opposite moral labels depending purely on which group is doing the labeling, and the behavior itself never changes. Merton: 'The value-laden connotations of these terms used to describe identification with groups other than one's own definitely suggest that these patterns of behavior have been typically regarded from the standpoint of the membership group. (Yet one group's renegade may be another group's convert.)' The vilifying vocabulary — renegade, traitor, deserter, sell-out — belongs entirely to the group being left; the receiving group has its own vocabulary for the identical act, and it's uniformly positive (convert, recruit, ally). Merton also insists the mechanism is direction-agnostic: it isn't only about people climbing toward higher status. 'The transfer of allegiance of upper class individuals from their own to a lower class — whether this be in the pre-revolutionary period of 18th century France or of 20th century Russia — belongs to the same family of sociological problems as the more familiar identification of lower class individuals with a higher class... the phenomenon of topdogs adopting the values of the underdog is as much a reference group phenomenon lending itself to further inquiry as that of the underdogs seeking to become topdogs.' Diagnostic use: when someone is condemned as a renegade, traitor, sell-out, or defector, translate the charge into its structurally neutral form — 'this person changed which group's values they orient to' — and ask what the SAME act would be called from the receiving group's point of view. The moral heat in the vocabulary is a fact about the speaker's standpoint, not a fact about the act's objective character, and it obscures that the mechanism runs identically whether the movement is upward, downward, or sideways in status."
