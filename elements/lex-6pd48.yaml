id: lex-6pd48
name: intervention-and-observation-induce-different-distributions
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When reasoning about a system, distinguish FORCING a variable (intervention, do(X=x)) from SEEING it take a value (observation, X=x). The two yield different distributions on the variable's effects whenever X has non-trivial causes — observation lets you infer from X what caused X to take that value (lifting the prior of confounders), but intervention SEVERS X from its natural causes by definition. Pearl's do-operator formalizes the distinction; the do-calculus tells you when a causal effect P(Y|do(X)) is identifiable from observational data P(Y|X,Z) using a graph of the causal structure. Diagnostic: if your prediction would change depending on whether the X you condition on was CHOSEN vs OBSERVED, the distinction is operative and you cannot use observational statistics naively. The transferable point is wider than statistics — it covers A/B test vs observational analytics, RL action-distribution vs state-distribution, policy intervention vs natural-experiment, and any place a system's response to a forced input differs from its response to the same input arriving naturally."
related: [lex-wtkuz, lex-v6nqz, lex-qkrey, lex-8j5ms, lex-w5qfe, lex-z3qjg, lex-j2tgc, lex-tmy67, lex-yejp2, lex-875gz]
scaffolds-from: [lex-v6nqz, lex-qkrey]
evokes: [do-operator, do-calculus, back-door-criterion, front-door-criterion, identifiability, causal-graph, structural-equation-model, simpson-paradox, intervention-vs-observation, p-of-y-given-do-x-vs-p-of-y-given-x]
lineage:
  - source: primary
    text: pearl-2009-causality-ch3-calculus-of-intervention
    citation: "Pearl, Judea. 2009. *Causality: Models, Reasoning, and Inference*, 2nd edition. Cambridge University Press, Chapter 3 'Causal Diagrams and the Identification of Causal Effects.' Section 3.2 introduces the do-operator with the book's canonical sprinkler example: an intervention do(X=x) is modeled as a structural surgery that replaces the natural mechanism setting X with a constant assignment, severing X from its causal parents while leaving every other mechanism intact — mathematically distinct from conditioning P(·|X=x), which leaves the natural mechanism intact and propagates information backward from X to its parents. Section 3.4 establishes the do-calculus (Theorem 3.4.1, Rules 1-3): a symbolic system of three transformation rules under which any IDENTIFIABLE causal effect can be reduced to an observational expression computable from data plus the causal graph. Sections 3.3.1-3.3.2 give the back-door and front-door criteria — graph-theoretic conditions for picking an adjustment-set Z such that P(Y|do(X)) = ∑_z P(Y|X,z)P(z), or the more delicate two-step front-door reduction when no back-door admissible set exists. Shpitser & Pearl (2006) completed the program by showing the do-calculus is COMPLETE: every identifiable effect is derivable in finitely many rule-applications, and any effect not derivable is unidentifiable from the assumed graph + observational data alone."
    quote: "[Sec. 3.2, on the sprinkler-system causal diagram (season → sprinkler, rain, wet pavement):] 'Note the difference between the action do(X₃ = On) and the observation X₃ = On. The effect of the latter is obtained by ordinary Bayesian conditioning, that is, P(x₁, x₂, x₄, x₅ | X₃ = On), while that of the former by conditioning a mutilated graph, with the link X₁ → X₃ removed. This indeed mirrors the difference between seeing and doing: after observing that the sprinkler is on, we wish to infer that the season is dry, that it probably did not rain, and so on; no such inferences should be drawn in evaluating the effects of a contemplated action “turning the sprinkler On.”'"
canonical-instances:
  - "A/B test vs observational analytics: choosing a UI variant for a user (intervention) cleanly estimates the variant's average effect; observing that users who self-selected variant A converted at 12% vs B at 8% does NOT, because self-selection conditions on a confounder (which users prefer A is a parent of conversion). Pearl's distinction is the formal statement of why A/B testing exists as a separate epistemic practice from observational dashboards."
  - "Simpson's paradox: a treatment can appear beneficial overall AND harmful in every subgroup (or the reverse). Whether the aggregated or subgroup association is the causal effect depends on the GRAPH: was the subgroup variable a confounder (condition; subgroup table is right), a mediator (don't condition; aggregate is right), or a collider (conditioning OPENS a spurious path)? The do-calculus formalizes which adjustment is required from the graph structure; no amount of observational data alone resolves it."
  - "Reinforcement learning action vs state distributions: π(a|s) — the agent's policy of WHICH action to take given a state — produces a different next-state distribution than the marginal action-given-state distribution from logs, even with the same observed (s,a) frequencies. This is the do-operator distinction inside the RL operational-model: P(s'|do(a),s) ≠ P(s'|a,s) whenever there is unobserved policy-state confounding in the logs. Off-policy evaluation methods (importance weighting, doubly-robust estimators) are practical reductions licensed by do-calculus assumptions on the data-generation graph."
  - "Operationally distinct from lex-v6nqz Mill's method of difference and lex-qkrey concomitant variation: Mill identified empirical patterns that warrant causal inference under specific paired-cases or covarying-magnitudes conditions; Pearl formalized the MATHEMATICAL OBJECT (the do-operator + causal DAG) and the IDENTIFIABILITY CONDITIONS under which observational data plus a graph suffice to compute an interventional effect. Mill's methods are special cases satisfying back-door criteria on graphs Mill never drew. The atoms compose: Pearl provides the framework in which Mill's empirical heuristics live as identifiable estimators."
  - "Operationally distinct from lex-8j5ms within-case process-tracing: process-tracing pieces together causal claims from observable case-internal evidence (mechanisms, timing, hoop-tests). Pearl's machinery operates over a structural model that has already abstracted the mechanism into a graph; the techniques compose (process-tracing within a case may identify the structural mechanism that Pearl's calculus then reasons about) but they answer different parts of the inferential pipeline."
critical-questions:
  - "what's the prerequisite the do-calculus needs that observation alone doesn't supply? A CAUSAL GRAPH — the structural assumptions about which variables can directly influence which others. Pearl is explicit (Sec. 3.6): the calculus is a reduction from causal queries to observational queries CONDITIONAL ON a graph that the analyst supplies; it does not derive the graph from data. Section 2 of Causality presents Inferred Causation (partial recovery of graph from data + assumptions) as a separate problem. The atom should NOT be read as 'Pearl removed the need for assumptions' — it relocates them: causal inference requires graph assumptions, and the calculus tells you what observational data are needed given them."
  - "when does the distinction fail to matter operationally? When the variable being asked about has no causal parents that influence its effects through other paths — when the natural and the intervened distributions coincide. RANDOMIZED experiments achieve this by construction (the randomization erases parents); fully manipulable systems (toggling a software flag with no hidden upstream coupling) approximate it. The atom earns its keep precisely in the messy in-between: observational logs from production, social-science cohorts, A/B tests with non-compliance, RL with policy-state coupling."
  - "what happens when the effect is NOT identifiable? Pearl's negative result (sec. 3.5.2, formalized in Shpitser-Pearl 2006): some causal queries cannot be answered from observational data plus the graph alone — no rearrangement of do-calculus rules produces an observational expression. The honest operational response is to either redesign the data-collection (add an instrument, add an intervention, blind a confounder), refine the graph (if the unidentifiability is structural), or report the answer as undetermined. The atom carries the discipline: identifiability is a property of the graph, and the answer can be 'not computable from this data.'"
  - "how does this compose with lex-w5qfe iterative-refinement? Pearl's framework is OFFLINE causal estimation from a fixed model + dataset; lex-w5qfe is the online loop of refining a target against feedback. They compose: each cycle of lex-w5qfe in a domain with confounded observation needs Pearl's discipline to read the feedback correctly (a noisy correlation observed mid-loop may be spurious; the loop may converge faster if you intervened where possible or controlled the back-door set you actually have). Without this distinction, a feedback loop can lock in a confounder-driven non-causal regularity that consistently moves the target wrong."
  - "operationally distinct from the broader claim that 'correlation isn't causation' (which is older than Pearl): Pearl supplied the POSITIVE result — under WHICH STRUCTURAL ASSUMPTIONS does observational correlation imply causation, and HOW do you compute the causal answer from observational data when those assumptions hold? The slogan tells you to be careful; the do-calculus tells you when you can stop being careful (effect is identifiable, here's the formula) and when you can't (effect is unidentifiable, observational data alone won't answer)."
