name: descriptive-vs-operational-metacognition
type-in: process
type-out: frame
_tier: atomic
agent-instruction: "When discussing an internal process at a descriptive level ('I just felt confident'), translate it to an operational rule ('I will check X before committing'). Descriptions describe; operations bind."
