id: lex-x54gy
name: anticipatory-dread-reliably-outweighs-the-difficulty-of-the-real-event
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "The period of worry before a hard, unavoidable event is often harder than the event itself once it actually arrives — childbirth is easier than the anticipation of it. Treat the intensity of pre-event dread as a poor predictor of the event's actual difficulty, and weight a decision to avoid or delay the event accordingly, since the anticipation is very often doing more damage than the thing being anticipated will."
related: [lex-pguu9]
evokes: [galef, kotowaza, japanese-proverbs, anticipation-worse-than-the-event, dread-inflation]
lineage:
  - source: primary
    text: galef-1987-even-monkeys-fall-from-trees
    citation: "David Galef (compiler and translator), *Even Monkeys Fall From Trees: And Other Japanese Proverbs*, illustrations by Jun Hashimoto, foreword by Edward G. Seidensticker (Tuttle Publishing, copyright 1987; ebook ISBN 978-1-4629-0318-4), Proverb No. 87. Verified verbatim against a direct extraction of the held copy."
    quote: "Anzuru yori umu ga yasushi. Childbirth is easier than the worrying beforehand."
canonical-instances:
  - "Someone puts off a difficult conversation for weeks, dreading it more each day, and finds afterward that the actual conversation took fifteen minutes and went better than any version they'd rehearsed in their head."
critical-questions:
  - "Is this event actually in the class where anticipation reliably outpaces reality, or is it one of the exceptions — a genuinely dangerous or irreversible event — where the dread is calibrated correctly and delay is the safer choice?"
status: active
