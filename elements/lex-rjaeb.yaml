id: lex-rjaeb
name: desiring-a-quality-does-not-mean-the-desirer-possesses-it
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When someone argues that a person, institution, or process must POSSESS a quality because they visibly DESIRE, pursue, or are oriented toward that quality (a company that talks constantly about innovation must be innovative; a person who is obsessed with being seen as wise must be wise; a nation that wages war in the name of peace must be peaceable), check the argument against Socrates's elenchus on Agathon in the Symposium before accepting it. Agathon had praised Love as itself supremely beautiful, wise, and virtuous. Socrates first secures an uncontroversial premise: desire is always desire FOR something, and specifically for something the desirer currently lacks -- 'he who desires is in want of that which he desires,' and 'he who is anything cannot want to be that which he is' (a person who is already strong does not desire to BE strong, only to continue being strong, which is a different, future-directed want). He then applies this to Agathon's own admission that Love is the love OF beauty and of the good. If Love desires beauty, Love is in want of beauty; and 'would you call that beautiful which wants and does not possess beauty? Certainly not.' Therefore Love -- far from being beautiful and good himself, as Agathon's whole encomium had assumed -- is instead positioned BETWEEN beauty/goodness and their absence, oriented toward what he lacks rather than exemplifying it. The reflexive fallacy exposed is precise: Agathon (and the argument-pattern generally) conflates the DESIRING SUBJECT with the DESIRED OBJECT, transferring the object's properties onto the subject simply because the subject is oriented toward it. The fact of orientation toward X is evidence of a LACK of X, not evidence of POSSESSION of X -- the very intensity of the pursuit is, if anything, evidence pointing the opposite direction from the one the naive inference assumes. Portable beyond eros: a company's loud, constant messaging about innovation is more consistent with a felt lack of it (a wanting rather than a having) than with its actual presence, by the same logic that a person who already has something stable does not need to continually assert wanting it; a person's visible, effortful campaign to be seen as wise is evidence of wanting the reputation for wisdom, which is a different thing from possessing wisdom, and Socrates elsewhere treats the two as frequently inversely correlated. Diagnostic test supplied directly by the elenchus: before inferring that a subject HAS a quality from the fact that the subject visibly PURSUES or DESIRES it, ask whether the pursuit itself already presupposes the quality's absence -- if X already had the quality fully, would X still be pursuing it, or would the pursuit have relaxed into simple possession? Scope: this is not a claim that all pursuit indicates total absence -- Socrates's own distinction (wanting to CONTINUE having something one already has, versus wanting to BEGIN having something one lacks) shows the fallacy applies most cleanly to claims of the form 'the desiring itself proves the having,' not to every case of a partial-possessor wanting more of what they already partly have."
related: [lex-fpvsu, lex-bvjpk, lex-rp7kr, lex-jpayb, lex-b9yre]
scaffolds-from: [lex-fpvsu]
evokes: [he-who-is-anything-cannot-want-to-be-that-which-he-is, would-you-still-say-that-love-is-beautiful, i-fear-that-i-did-not-understand-what-i-was-saying, poros-and-penia]
lineage:
  - source: primary
    text: plato-c385bce-symposium-socrates-elenchus-on-agathon
    citation: "Plato, Symposium 199c-201c (Jowett translation, Standard Ebooks Dialogues compilation). Socrates's cross-examination of Agathon, immediately preceding the Diotima narrative."
    quote: "And now, said Socrates, I will ask about Love:—Is Love of something or of nothing?... The inference that he who desires something is in want of something, and that he who desires nothing is in want of nothing, is in my judgment, Agathon, absolutely and necessarily true... For he who is anything cannot want to be that which he is?... Then Love wants and has not beauty?... Certainly, he replied. And would you call that beautiful which wants and does not possess beauty? Certainly not. Then would you still say that love is beautiful? Agathon replied: I fear that I did not understand what I was saying. You made a very good speech, Agathon, replied Socrates; but there is yet one small question which I would fain ask:—Is not the good also the beautiful?... Then in wanting the beautiful, love wants also the good? I cannot refute you, Socrates, said Agathon:—Let us assume that what you say is true."
canonical-instances:
  - "The direct textual anchor: Agathon's premise that Love desires beauty and goodness is used by Socrates to prove the opposite of what Agathon intended -- not that Love possesses beauty and goodness, but that Love necessarily lacks them, since desire presupposes want."
  - "A company's constant, prominent messaging about being innovative is, by this logic, more consistent with a felt organizational lack of innovation than with its settled presence -- the loudness of the pursuit is evidence pointing toward absence, not toward possession."
  - "A person's visible, effortful campaign to be seen as wise or humble is evidence of wanting the reputation, which the elenchus's structure treats as a different thing from, and not evidence for, actually possessing the quality."
critical-questions:
  - "isn't this just 'actions speak louder than words,' generic skepticism about self-presentation? No -- the mechanism is a specific logical structure (desire-for-X entails want-of-X entails absence-of-X-in-the-desirer, at least in the case where the desire is to BEGIN having something rather than to continue having it), not a general heuristic about trusting deeds over claims."
  - "does this mean anyone who pursues a goal necessarily lacks it entirely? No -- Socrates's own qualification (wanting to CONTINUE possessing something already had, as when a healthy person wants to remain healthy, is a different case from wanting to BEGIN possessing something) means the fallacy targets specifically the inference 'desiring X proves having X,' not every instance of effort directed at a goal."
  - "how does this differ from lex-bvjpk (felt-freedom-is-consciousness-of-the-effect-without-the-cause)? Both expose a case where a surface signal is mistaken for the underlying property it seems to indicate, but lex-bvjpk is about a FELT SENSATION (freedom) being mistaken for evidence of an underlying metaphysical fact (indeterminism); this atom is about an OBSERVED ORIENTATION (desire, pursuit, campaigning) being mistaken for evidence of POSSESSING the object of that orientation -- a claim about inference from behavior, not from felt sensation."
  - "how does this relate to lex-rp7kr (clear-idea-of-an-emotion-converts-it-from-passion-to-activity), also mined from the Ethics? They are unconnected in mechanism: lex-rp7kr is a technique for gaining power over an emotion once gripped by it; this atom is a diagnostic for evaluating a THIRD-PARTY inference ('X desires Y, therefore X has Y') and does not concern managing one's own emotional state at all."
  - "could this be weaponized to dismiss anyone's stated aspirations as proof of their inadequacy? The atom's proper use is as a check on a SPECIFIC INFERENCE (from desire to possession), not as a general debunking move against aspiration or effort; Socrates's own argument does not conclude that Agathon or Love are contemptible for lacking beauty and goodness -- in Diotima's subsequent account, the very fact of being in a mean between want and possession is what makes philosophy (love of wisdom) possible at all, so lacking-and-pursuing is treated as a legitimate, even necessary, condition rather than a disqualifying flaw."
  - "isn't this just lex-fpvsu (elenchus-questioning-to-aporia) applied to Agathon? lex-fpvsu names the general METHOD Socrates is using here -- push for a definition, surface counterexamples, drive toward acknowledged confusion. This atom is not the method; it is the specific, portable INFERENCE PATTERN that one particular elenchus produced (desire-for-X entails want-of-X entails, in the begin-having case, absence-of-X), distilled so it can be applied directly to a new case (a company's innovation messaging) without needing to run a fresh Socratic cross-examination to rediscover it each time."
