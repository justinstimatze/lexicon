id: lex-mb3h5
name: a-group-resents-and-reverses-a-members-unwelcome-self-improvement
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A group that has built its comfort around a member's dysfunction can openly resent that member becoming more disciplined or capable, and actively wish for the old, worse version back, because the improvement disrupts a dynamic the group had come to depend on. The group was never rooting for the member's growth. It was rooting for its own continuity. In the Jataka's tale of the reformed monkey, a pet monkey belonging to frivolous, undisciplined ascetics is temporarily tutored into calm and meditative behavior. The ascetics openly prefer the old version: 'Aforetime you were used to play Where in this hut we hermits stay. O monkey! as a monkey do; When you are good we love not you.' The monkey's improvement cost it the only acceptance it had."
related: []
evokes: [jataka, tikanipata, komaya-putta-jataka, a-groups-comfort-depends-on-a-members-dysfunction-not-their-growth, self-improvement-can-be-punished-by-the-group-that-benefited-from-its-absence]
lineage:
  - source: primary
    text: jataka-chalmers1895-komaya-putta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book III (Tikanipata), No. 299, Komaya-putta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Aforetime you were used to play Where in this hut we hermits stay. O monkey! as a monkey do; When you are good we love not you."
canonical-instances:
  - "A friend group built around shared complaining about their jobs grows visibly cold toward the one member who starts taking their career seriously and stops joining the venting sessions, treating the change as a betrayal of the group's dynamic rather than as something to be happy for."
critical-questions:
  - "Is the ascetics' reaction really about resenting the monkey's growth specifically, or a more general discomfort with any change to a familiar routine, even one that wasn't an improvement?"
  - "Does the monkey have any way to keep its new discipline while also preserving standing in the group, or does this kind of self-improvement necessarily force a choice between the two?"
status: active
