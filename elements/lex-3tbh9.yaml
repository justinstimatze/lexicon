lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Holden-Day, 1970; Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), Chapter 11 'Theory and Practice,' Section 11.3 'Expression of Individual Preferences,' citing Murakami (1968). One elision, disclosed: a footnote marker attached to Sen's citation of Murakami is skipped between the general claim and its application to the MMD (method of majority decision)."
    quote: "“As Murakami has argued, with those collective choice systems that are non-negatively responsive to individual preferences the scope of what voters can achieve by distorting their preferences is very limited. ... This applies in particular to the MMD. By distorting his preferences a person cannot increase the weight on his most preferred alternative, for the greatest weight he can put on it is to vote sincerely. An example in terms of the MMD may help to bring out this problem. Consider three individuals, viz., 1, 2 and 3, with person 1 preferring x to y and y to z, person 2 preferring y to x and x to z, and person 3 preferring z to x and x to y. Majority ordering will yield x socially preferred to y and z, and y socially preferred to z. Person 2 can disrupt the ordering by pretending to prefer y to z and z to x, which will create cyclical majorities of x over y, y over z, and z over x. But he cannot bring y into the choice set this way, since the most he can do to help y into the choice set is to vote honestly. He can knock x out of the choice set by dishonest voting, but he cannot put y into it.”"
canonical-instances:
  - "A hiring committee scores candidates by majority preference across pairwise comparisons. A member who dislikes the front-runner can strategically misrank the others to create a scoring cycle that knocks the front-runner out of contention -- but that same misranking cannot install the member's own preferred candidate as the winner beyond whatever support that candidate would have won under an honest ranking. The tactic spoils; it doesn't promote."
  - "A product team ranks feature proposals by pairwise majority vote among stakeholders. One stakeholder who wants to kill a rival proposal can lie about their own ranking to trigger a tie-breaking cycle that eliminates it -- but their genuinely favorite proposal only ever gets as much support as their honest vote for it would supply. Sabotaging a competitor and promoting a favorite turn out to be two different capabilities, and this voting structure only grants the first."
critical-questions:
  - "Doesn't knocking a rival out of contention often just clear the way for your own favorite to win by default? Sometimes, and that's exactly why the destructive move can still be worth making -- but what does the actual work is eliminating a competitor, something separate from any direct boost to your own alternative's standing. If a third, unintended alternative fills the vacated spot instead, the manipulator gains nothing, which wouldn't be possible if the lie had genuinely promoted their favorite rather than merely subtracting a rival."
  - "Sen frames this as good news for MMD's manipulation-resistance -- but doesn't a system that's still exploitable for sabotage remain badly exploitable in practice? It remains exploitable, just along one axis rather than two: a committee chair still needs a defense against strategic elimination of disliked options even after this result. So which is the more useful reassurance to give that chair -- 'this system resists manipulation' in general, or the narrower, more accurate 'this system resists manipulation aimed at promotion specifically'?"
