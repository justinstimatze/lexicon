id: lex-xehnw
name: envy-tracks-visibility-and-proximity-not-absolute-magnitude
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When envy tracks targets, the targets are NEAR and VISIBLE, not absolute magnitudes. People envy their cousins more than billionaires. To predict envy-driven action, map the proximity and visibility lattice, not the wealth distribution."
