  - source: primary
    text: radin-trickster-suddenly-recollects-earthmakers-original-purpose-for-him
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 47. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Well, this is about as long as I will stay here. I have been here a long time. Now I am going to go around the earth again and visit different people for my children are all grown up. I was not created for what I am doing here.' ... He suddenly recollected the purpose for which he had been sent to the earth by Earthmaker. That is why he removed all these obstacles along the river."
canonical-instances:
  - "A person spends years drifting between unrelated jobs and short-lived projects with no apparent direction, and then, seemingly out of nowhere, returns to a specific craft or cause they had trained for early in life, describing the intervening years not as wasted but as a period when they simply weren't doing the thing they were always meant to do."
  - "An organization goes through a long stretch of scattered, reactive initiatives with no coherent strategy, and a change in leadership suddenly reorients everything around the company's original founding mission, treating the scattered period as a lapse in focus rather than evidence that the mission itself had ever changed."
critical-questions:
  - "Is there a meaningful difference between genuinely recovering a dormant purpose and simply retroactively inventing one to make an otherwise directionless period feel meaningful in hindsight -- does the story give any evidence that Earthmaker's original assignment was real all along, or only that Trickster now says it was?"
  - "Does the abruptness of the recollection, arriving with no described trigger, suggest something true about how purpose can return, or is the story simply compressing a longer internal process for narrative convenience?"
  - "Would treating the earlier chaotic period as evidence of a fixed, permanent trait rather than a suspended state have led anyone, in the story or in a modern parallel, to give up on the person prematurely, before the reassertion of purpose had a chance to occur?"
