id: lex-gkaqs
name: delegating-the-risky-theft-to-proxies-while-you-run-the-distraction
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Splitting a theft into a low-risk role you keep for yourself and a high-risk role you hand to expendable others lets you claim the payoff without ever being the one caught holding the stolen object, as long as you're positioned to reclaim control once the risk has passed. In Radin's comparative Assiniboine summary, Inktonmi is hired to steal a scarce resource, summer, from its owner, and doesn't attempt the theft directly: 'He stations animal helpers one behind another. The fox steals the summer and passes it on to his associates, who escape while Inktonmi engages the owner in conversation.' The physically risky act, being caught holding the stolen object, is distributed across a relay of proxies; Inktonmi's own role is purely social, keeping the victim occupied and unsuspecting. Only after the danger has passed does he reassert ownership over the outcome: 'Inktonmi joins his comrades, and makes summer by opening the bag.' The proxies did the exposed work; the credit and control revert to the one who never touched the stolen object himself. Diagnostic move: when you're orchestrating something risky that requires both a distraction and an actual taking, notice whether you've assigned yourself the safe, deniable role and pushed the exposure onto others, and ask whether reclaiming the payoff afterward is fair to the proxies who carried the actual risk."
