id: lex-4d53x
name: optimal-strategy-depends-on-measurement-horizon
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "Before ranking two strategies, fix the time-horizon of measurement. Strategies that maximize a near-horizon score (immediate posttest, weekly P&L, sprint velocity) routinely lose to different strategies on a far-horizon score (delayed retention, decade returns, system maintainability). The horizon is not a downstream detail of evaluation — it is an upstream parameter that selects which strategy wins. When choosing a strategy, name the horizon first; when reading a comparison, ask what horizon it was measured at."
