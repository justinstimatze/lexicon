id: lex-r9yan
name: one-violation-voids-years-of-perfect-compliance-instantly
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When a relationship or arrangement is governed by a strict, explicitly named condition, don't assume that years of faithful compliance will earn you any grace or partial credit the one time you slip -- some conditions are enforced at zero tolerance, where the consequence for a single violation is exactly as total as if it were the very first thing you'd done. In Eastman's telling, a ghost wife sets a specific, narrow condition for returning to human society among her husband's people: 'you must never raise your voice in our teepee, and above all, let me never hear you speak roughly to a child in my presence!' Her husband keeps this faithfully for years -- they build a life together, have two children, live in visible happiness -- and none of that accumulated record matters in the moment it counts: 'one night the father came home tired and hungry from the hunt, and the little one cried loudly and would not be quieted. Then for the first time he forgot his promise and spoke angrily.' The consequence is instantaneous and absolute: 'Instantly the fire went out and the tent was dark,' and when he relights it, 'they were gone from him forever.' There's no warning shot, no second chance weighed against his years of good behavior, no partial forgiveness for the fact that ordinary exhaustion, not malice, caused the slip. The rule was never actually about his character or his intentions -- it was a hard boundary that treats a single crossing as complete, regardless of the record leading up to it. Diagnostic move: when you're operating under a condition you know to be a hard boundary rather than a soft expectation, don't let years of successful compliance lull you into believing you've built up credit against the one moment ordinary fatigue makes you careless -- a genuinely zero-tolerance rule doesn't average your performance over time, it evaluates the single instant you break it, exactly as harshly as it would on day one."
