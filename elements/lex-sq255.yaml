id: lex-sq255
name: ambivalence-not-indifference-makes-ex-members-doubly-extreme
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a convert to a new group or cause is more zealous than lifelong members, or an ex-member is more hostile to their former group than people who were never in it, don't reach first for 'true believer' personality or pure conviction — check whether the intensity is being manufactured by unresolved ambivalence rather than resolved indifference. Merton, applying Parsons's distinction: 'alienation is conceived always to be part of an ambivalent motivational structure, while conformity need not be. Where there is no longer any attachment to the object and/or internalization of the normative pattern, the attitude is not alienation but indifference.' A former member who has genuinely stopped caring is indifferent; a former member who is still psychologically entangled with the old group is ambivalent, and ambivalence, not indifference, is the more common and more consequential outcome. Merton's mechanism: 'The ambivalent ex-member thus has a double orientation: toward finding some substitute group affiliation and toward coping with his earlier attachment to his former membership group. This may account for the often noted tendency of such individuals to become even more strongly attached to the newfound membership group than is the case for those born into the group, and correlatively, to become more hostile toward their former group than is the case among their newfound associates.' He cites Michels's observation that 'the revolutionary of bourgeois origins... is more violent in his opposition to the bourgeoisie than are his fellow-revolutionaries of proletarian origins' — the convert overcorrects on both fronts simultaneously, in a pattern Merton names as doubly reinforced affect: 'Just as the new convert is more royalist than the king, so the ex-royalist is more republican than the citoyen, born and bred.' Diagnostic use: when you see someone's zeal or hostility running visibly hotter than that of people who never left (or never joined), look for the discontinued attachment underneath it — the extremity is evidence of unfinished business with the old group, not simply strength of the new conviction, and it should be expected to cool as the old attachment resolves rather than to hold steady as a stable trait."
related: [lex-pnh7q, lex-v9k6f]
