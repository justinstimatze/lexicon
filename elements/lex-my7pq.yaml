lineage:
  - source: primary
    text: eastman-comrades-blind-grandparents-reject-genuine-rescue
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twentieth Evening: The Comrades.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'There lived an old man and his wife, both of them blind and nearly helpless, for all of their children and grandchildren, even to the smallest and last, had been lured away by wicked Double-Face. \"Ho, grandfather, grandmother! I have brought you back the child!\" exclaimed the Rabbit... But the poor, blind old people had so often been deceived by that heartless Double-Face that they no longer believed anything; therefore they both cried out: \"Ugh, you liar! we don't believe a word you say! Get away with you, do!\"'"
canonical-instances:
  - "A company that has repeatedly overpromised and underdelivered to a burned-out customer base finally ships a genuinely improved product and launches an honest, accurate marketing campaign about it, only to find that customers dismiss the announcement with the same skepticism earned by years of prior exaggeration, requiring far more sustained proof than the actual improvement would otherwise warrant."
  - "A parent who has broken promises to a child many times finally follows through completely on a commitment, and the child reacts with suspicion or indifference rather than relief, not because the child doesn't want to believe it but because their learned defense against disappointment doesn't distinguish 'this time is real' from every previous time it wasn't."
critical-questions:
  - "how long should someone bringing genuine help persist against this kind of trained skepticism before concluding that the relationship or trust is simply unrecoverable -- does the framework offer any guidance on when continued effort becomes its own form of harm?"
  - "does this pattern place unfair responsibility on the person bringing genuine help to somehow prove their sincerity against a defense they didn't create and can't easily bypass, when the actual burden of distrust rightfully belongs to whoever caused the original repeated deception?"
  - "is there a meaningful difference between protective skepticism that simply delays belief pending evidence versus skepticism so total it actively drives away the help being offered (as with the couple here) -- does the story's own outcome depend on Mashtinna having somewhere else to bring the child, and what happens when there's no alternative?"
