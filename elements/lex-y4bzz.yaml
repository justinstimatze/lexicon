name: adjusted-desires-can-mask-real-deprivation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before reading someone's reported satisfaction or contentment as evidence they're not badly off, check whether their wants have had time to shrink to fit their circumstances. Sen: “Our desires and expectations adjust to circumstances, particularly to make life bearable in adverse situations. The hopeless underdog does not lead a life of constantly desiring what he or she thinks is unfeasible, nor one of seeking pleasures that are unobtainable. Rather, the focus is on cutting desires to size and on taking joy from smaller successes. In so far as people in chronically deprived situations succeed in getting some attainable pleasures and in fulfilling their restrained desires, their deprivation may look less intense in the mental metrics of pleasures and desires, even when their lack of real opportunities continues unremedied.” A measure that only asks 'how satisfied are you' can score a person who has learned not to want much as doing fine, right alongside someone whose actual circumstances are genuinely fine -- the two produce the same number for entirely different reasons. Diagnostic move: when using satisfaction, happiness, or desire-fulfillment as a proxy for how well-off someone is, ask how long they've lived under their current constraints. A high score from someone with a long history of scaled-back expectations mostly tracks how well they've adapted, and treating that as a stand-in for their opportunities erases exactly the deprivation the measure was supposed to catch."
