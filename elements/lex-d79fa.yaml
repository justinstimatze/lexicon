id: lex-d79fa
name: borrowing-a-hosts-script-turns-a-removed-choice-into-hospitality
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When Alice Waters set up Chez Panisse in 1971, she made what her biographer calls her single most momentous decision: the dinner menu would offer no choice at all. One set menu, new every night, seven nights a week. She justified the restriction not on operational grounds (a small kitchen, quality control, forcing herself to cook only what was good that day) but by importing the social script of a different context entirely: 'I wanted it to be like going to somebody's house. Nobody gives you a choice about what to eat at a dinner party.' A restaurant offering no menu choice reads, on its own terms, as a limitation on the customer. The same restriction, framed as 'this is how a host treats a guest,' reads as generosity and trust instead. The transferable move: when you need to impose a constraint on the people you serve -- fewer options, a fixed process, less negotiating room -- look for an intimate or domestic context where that exact restriction is already normal, expected, and welcomed, and frame the constraint through that borrowed script rather than defending it on your own operational terms. The frame doesn't change what's actually being restricted; it changes which existing norm the audience measures the restriction against. Judged against a retail menu, offering zero choice looks like stinginess. Judged against what's normal at somebody's dinner table, the identical restriction looks like being taken care of. This only works if the borrowed context is genuinely apt -- a dinner-party frame on a for-profit restaurant works because Waters actually built the surrounding experience (personal welcome, changing food, an insistence on obligation-free trust) to match; grafting the frame onto a restriction the audience can see is purely extractive collapses the analogy and reads as manipulation instead of hospitality."
