id: lex-est88
name: unsolicited-correct-advice-can-provoke-retaliation-not-gratitude
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before offering advice, check whether the recipient has actually sought it, since being correct does not protect advice from being received as an attack when it wasn't invited. In the Panchatantra's fable, a hen-sparrow scolds a monkey for shivering in the cold and tells him, accurately, to build proper shelter instead of huddling — and the monkey destroys her nest in response. The frame verse states the rule the sparrow violated: 'Give counsel only when it fits to such as seek the best.' The content of advice and its reception are governed by different conditions; correctness satisfies the first and receptiveness satisfies the second, and having only the first is not enough to avoid the consequences of lacking the second."
related: []
evokes: [panchatantra, loss-of-gains, unsolicited-advice-provokes-retaliation, receptiveness-not-correctness-determines-outcome]
lineage:
  - source: primary
    text: panchatantra-ryder1925-the-pert-hen-sparrow
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book IV, 'The Pert Hen-Sparrow.' Verified verbatim against a direct extraction of the held copy."
    quote: "Give counsel only when it fits To such as seek the best. The foolish monkey broke to bits. The sparrow’s cozy nest."
canonical-instances:
  - "a colleague points out, correctly and in a public meeting, that a coworker's approach to a project has a specific known flaw, and instead of thanks receives a lasting resentment that damages the working relationship far more than the flaw itself ever would have — the accuracy of the observation didn't determine how it landed."
critical-questions:
  - "Does this counsel silence about real problems that genuinely need to be raised, simply because the recipient hasn't asked to hear them — is there a responsible way to name a real flaw to someone who never invited the feedback?"
  - "Is the sparrow actually at fault here, or does treating her as the one who erred just excuse the monkey's disproportionate retaliation against a fundamentally reasonable piece of advice?"
status: active
