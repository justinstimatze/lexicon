    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 6, '\"A Net to Catch Contingency,\"' contrasting Picasso's Tête de Taureau with John Cage's compositional practice. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The materials in Picasso’s accidental find are new, but the art he shapes from them returns us to the same old Picasso. Picasso, of course, was quite happy to work with accident as a tool of revelation (“From errors one gets to know the personality!”), but Cage was not (“Personality is a flimsy thing on which to build an art”), for Cage was after Monod’s “absolute newness” of pure chance. He was not out to discover any hidden self, nor did he think chance operations would reveal any hidden, already existing divine reality, as ancient diviners thought."
canonical-instances:
  - "A therapist notices that a client's recurring 'accidental' slips of the tongue always circle back to the same unresolved family conflict, symptomatic accidents revealing a fixed pattern, while a different client's associative free-writing exercise, done specifically to bypass habitual narrative, produces material that genuinely surprises the client and doesn't trace back to any known preoccupation."
  - "Two photographers both shoot a roll of film with a malfunctioning camera that produces random double exposures; one reviews the results and finds every accidental overlay echoes his long-standing obsession with mirrors and doubling, while the other, working from a practice explicitly designed to defeat her own compositional habits, produces images that don't resemble anything she would have chosen to make on purpose."
critical-questions:
  - "Is Cage's 'pure chance, no self revealed' claim actually achievable, or does the specific way he designed his chance procedures (which questions he asked the I Ching, which parameters he let vary) itself encode a personality, making the revelation/erasure distinction a matter of degree rather than a clean binary?"
  - "Could Picasso's story be told the other way -- that his 'deep personality already in love with bulls' is itself a retrospective narrative imposed after the fact, and that a different critic could just as easily read the same bicycle-seat find as pure formal coincidence with no symptomatic content at all?"
  - "Does this framework assume the artist's stated intention accurately describes what actually happened, when Cage's own psychology, unexamined preferences, fatigue, unconscious bias, might still be shaping which chance outcomes he accepted into a finished piece and which he discarded?"
