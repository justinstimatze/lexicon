id: lex-ukgke
name: enshittification-as-the-platform-degradation-path-from-user-value-to-extraction
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a platform shifts from serving users to extracting from them, you're seeing enshittification: a predictable degradation path as platform power consolidates. Doctorow: first users, then business customers, then shareholders capture value. Predict the next phase by tracking who currently captures."
