canonical-instances:
  - "A university's tenure committee has an approval rate above 95 percent, which looks like a rubber stamp — until you notice that department chairs quietly counsel weak cases to withdraw or delay a year before the formal file is ever assembled, so the committee is ratifying a decision that department politics already made; the formal vote's high approval rate is evidence the informal filter works, not evidence the bar is low."
  - "A competitive grant program reports that 90 percent of submitted proposals in a given track get funded — but program officers hold informal pre-submission calls that talk marginal applicants out of applying to that track and into a less competitive one, so the formal acceptance rate describes a pool that has already been informally sorted, not the actual difficulty of winning the grant."
critical-questions:
  - "Kendall and Selvin call the mechanism 'somewhat speculative... because the materials at hand do not offer more than slight clues' — what would it take to actually observe the informal counseling conversations directly, rather than inferring their effect from the gap between stated third-year preference and final application, and would direct observation risk changing the very behavior it's trying to capture?"
  - "If the informal upstream sorting is what does the real work, what happens to a student who ignores or never receives the informal signal — does a low-ranking student who never talks to faculty and applies for the specialized internship anyway face the SAME odds as one who was counseled down, or does skipping the informal stage itself carry a penalty the formal process then enforces directly?"
