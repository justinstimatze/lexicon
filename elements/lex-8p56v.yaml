id: lex-8p56v
name: assignment-without-choice-converts-preference-into-lost-satisfaction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone in a service role develops preferences among the people they serve, but the role's structure denies them any power to select whom they actually work with — patients assigned rather than chosen, cases randomly distributed, callers routed by queue rather than by agent choice — do not expect the preference to manifest as reduced CONTACT with the disfavored type. It cannot: the assignment mechanism guarantees exposure regardless of preference. What it manifests as instead is reduced SATISFACTION from the contacts that do occur. Martin states this directly: 'Preference for particular types of patients, we have suggested, in part reflects motivated avoidance of patients who make the performance of role-tasks difficult and stressful. However, fourth-year students are assigned to patients, and therefore have no opportunity to choose those who actually conform to their preferences. Under these circumstances, the level of gratification from patient contacts attained by students with preferences should be less than that attained by those who are equally willing to work with all types of patients, as Table 25 shows to be the case.' The data bore this out sharply: students reporting 4 or 5 preferences reported 'great satisfaction' from patient contacts at markedly lower rates than students reporting none or one. Martin's explanation for why having some satisfying matches doesn't offset this: 'Although students may find it satisfying to work with patients who accord with their preferences, this seems to be outweighed by the necessity of dealing with others who do not.' Diagnostic move: in any role where the person cannot select their caseload, a strong stated preference is not a behavior-shaping lever — it won't change who they end up serving — it is a satisfaction-shaping cost, borne every time an assignment falls on the disfavored side, with no compensating discount available on the days it doesn't. This reframes 'help them not have preferences' not as a favor to the people being served, but as a direct route to the preference-holder's own well-being under a no-choice structure."
