id: lex-fn2gx
name: paradigm-supersession-narrative-obscures-unrationalized-coexistence-of-conflicting-models
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When a field narrates its history as paradigm A → paradigm B → paradigm C (each superseding the prior), check whether the prior paradigm actually withered or merely receded from academic visibility. The unrationalized coexistence of conflicting models in the present is where the essential power-effects live. Supersession-narratives are themselves performative — they obscure what the field still does by claiming it stopped."
related: [lex-wtkuz, lex-q9asc, lex-dm5te, lex-rfxtb, lex-3d2he, lex-sxt57, lex-mwgep, lex-9exaw, lex-rwvkh, lex-2rpxq, lex-44byg, lex-am8cj, lex-y2tbg, lex-697ka]
scaffolds-from: [lex-697ka]
evokes: [supersession-narrative, paradigm-shift-narrative, denarrativize, unrationalized-coexistence, double-binding-force-fields-of-conflicting-definition, foucault-1976-history-of-sexuality-vol-1, halperin-vs-foucault-on-inversion, minoritizing-vs-universalizing, gender-transitive-vs-gender-intransitive, sedgwick-axiom-5, denaturalize-the-present-not-the-past]
lineage:
  - source: primary
    text: sedgwick-1990-epistemology-of-the-closet-axiom-5
    citation: "Eve Kosofsky Sedgwick, *Epistemology of the Closet* (University of California Press 1990; 2008 edition). Introduction 'Axiomatic,' Axiom 5: 'The historical search for a Great Paradigm Shift may obscure the present conditions of sexual identity' (pp. 44-48). Sedgwick acknowledges the value of post-Foucault historicization (Halperin 1990, Chauncey 1994, et al.) — its 'great value' has been to subtract from 'homosexuality as we know it today' the twin positivist assumptions of (1) transhistorical essence and (2) progressive cognitive convergence on that essence. But she identifies a side-effect: counterposing alterity-of-past against 'a relatively unified homosexuality that we know today' inadvertently 'underwrite[s] the notion that homosexuality as we conceive of it today itself comprises a coherent definitional field rather than a space of overlapping, contradictory, and conflictual definitional forces.' The transferable mechanism: every unidirectional supersession-narrative (Foucault: sodomite→species; Halperin: inversion→sexual-orientation-independent-of-gender) drops the prior paradigm out of analysis, but the prior paradigm still operates — and the *unrationalized coexistence* of the conflicting models is where the power-effects condense. Sedgwick offers a juxtaposition of Foucault and Halperin to show two influential 'parallel and congruent projects' actually run in opposite directions on the present: for Foucault the modern homosexual is gender-transitive; for Halperin, gender-intransitive. The shared *structure* of supersession-narrative made the disagreement invisible. Generalizable beyond sexuality to: scientific-revolution narratives, technology-displacement narratives, theoretical-turn narratives, generational-shift narratives, any history written as discrete-displaced-stages."
    quote: "*[Sedgwick 1990, Axiom 5, p. 45:]* 'an unfortunate side effect of this move has been implicitly to underwrite the notion that homosexuality as we conceive of it today itself comprises a coherent definitional field rather than a space of overlapping, contradictory, and conflictual definitional forces. Unfortunately, this presents more than a problem of oversimplification. To the degree that power relations involving modern homo/heterosexual definition have been structured by the very tacitness of the double-binding force fields of conflicting definition... these historical projects, for all their immense care, value, and potential, still risk reinforcing a dangerous consensus of knowingness about the genuinely unknown, more than vestigially contradictory structurings of contemporary experience.' *[Axiom 5, p. 47:]* 'this assumption is significant only if – as I will be arguing – the most potent effects of modern homo/heterosexual definition tend to spring precisely from the inexplicitness or denial of the gaps between long-coexisting minoritizing and universalizing, or gender-transitive and gender-intransitive, understandings of same-sex relations.' *[Axiom 5, pp. 47-48:]* 'The project of the present book will be to show how issues of modern homo/heterosexual definition are structured, not by the supersession of one model and the consequent withering away of another, but instead by the relations enabled by the unrationalized coexistence of different models during the times they do coexist.'"
canonical-instances:
  - "Sedgwick 1990: Foucault's 1870-as-birth-of-the-modern-homosexual narrative and Halperin's parallel inversion-superseded-by-orientation narrative both posit unidirectional supersession, mask their opposite-direction conclusions about present-day homosexuality, and obscure that minoritizing AND universalizing models coexist in 1990s discourse as the foundational structure (Sedgwick Axiom 5)."
  - "Kuhn 1962 *Structure of Scientific Revolutions* itself read as supersession-narrative: pre-Kuhn cumulative-progress models DID NOT wither when Kuhn was canonized — they coexist in actual scientific practice (methods sections, textbooks, popular-science) alongside paradigm-shift talk. The 'Kuhn replaced positivism' story is itself the failure mode Sedgwick names (substrate audit 2026-06-19)."
  - "AI history written as symbolic→connectionist→deep-learning supersession masks that symbolic, connectionist, statistical, and neural approaches coexist in production systems c. 2026, and the 'winner' framing obscures hybrid-system reality (substrate audit 2026-06-19)."
  - "Behaviorist→cognitive→evolutionary→neural psychology paradigm-narrative obscures that each prior 'superseded' frame remains in clinical practice, classroom curricula, and active research (substrate audit 2026-06-19)."
  - "Medical model→biopsychosocial→social model→neurodiversity disability-frame supersession-narrative obscures that all four operate simultaneously in disability law, clinical practice, advocacy, and policy — and conflicts at their interfaces are where contested cases live (substrate audit 2026-06-19)."
  - "Periodization-as-supersession in art history (Renaissance→Mannerism→Baroque, or Modernism→Postmodernism→Contemporary) treats prior periods as ended; lex-fn2gx surfaces that period-conventions coexist in living practice and museum-institution structure (substrate audit 2026-06-19)."
critical-questions:
  - "what counts as evidence that the 'superseded' model has actually withered? Field cited at top of academic journals is a weak proxy; what about pedagogical curricula, clinical practice, lay-public usage, courtroom invocation, regulatory language, software-actually-shipping? If the prior model is alive in any of these venues, supersession-narrative is overclaiming."
  - "are conflicting models doing different work in different venues? Sedgwick's key move: the contradiction is not bug but feature — coexisting frameworks let power operate across them. Surface which venue uses which frame, and what the venue-asymmetry produces. (Cf. lex-44byg dominant-discourse-constructs-the-other-as-rulable-object-and-defining-mirror where regulated-discourse produces both ruling-knowledge AND self-identity.)"
  - "is the supersession-narrative itself performative? Sedgwick: 'these historical narratives, themselves performative, pass over in silence' the contradiction-space they delineate. Telling the story that 'we used to think X, now we know Y' enacts the disappearance of X. Naming this performativity is part of the work."
  - "what is being denaturalized — the past or the present? Sedgwick's redirection: 'my first aim is to denaturalize the present, rather than the past.' Most paradigm-history is past-denaturalizing in service of present-naturalizing. The pivot is to use the same denaturalizing tools on the present's conflicted coexistences."
  - "is the model genuinely defunct or merely academically de-prioritized? Transferable check: an academic field can move on while practitioner communities, lay publics, and adjacent disciplines retain the prior frame. The 'we' in 'as we know it today' is doing concealing work."
status: active
