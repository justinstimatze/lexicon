lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The History of Our Time: An Optimist's View' (the Sixth Eleanor Rathbone Memorial Lecture, delivered at the University of Bristol, October 12, 1956), Ch. 19 of Conjectures and Refutations (Routledge Classics, 2002), pp.499-500. One elision, disclosed: a footnote marker and a paragraph naming Britain's specific responses to the Kaiser, Hitler, and Mussolini are skipped between the general statement of the thesis and its harder Russell/Stalin test case."
    quote: "“My third thesis is that since the time of the Boer War, none of the democratic governments of the free world has been in a position to wage a war of aggression. No democratic government would be united upon the issue, because they would not have the nation united behind them. Aggressive war has become almost a moral impossibility. ... But a still stronger example is the public attitude towards the issue of preventive war against Russia. You may remember that, around 1950, even Bertrand Russell advocated a preventive war. And it must be admitted that there were strong reasons in favour of it. Russia was not yet in possession of an atomic arsenal; and it was the last opportunity of preventing Russia from acquiring the hydrogen bomb. I do not envy the American President his power to decide between such terrible alternatives. The one alternative was to begin a war. The other was to allow Stalin to acquire the power to destroy the world; a power with which he certainly ought not to have been entrusted. Bertrand Russell was no doubt right in maintaining that from a purely rational point of view the second alternative was even worse than the first. But the decision went the other way. An aggressive war, even in these crucial circumstances, and with the then practical certainty of victory, had become morally impossible.”"
canonical-instances:
  - "A hospital system, still shaped by a decades-old scandal over unnecessary surgeries, requires a second independent sign-off before any elective procedure -- a rule that outlives every doctor who lived through the scandal. A specialist later builds a rigorous, well-evidenced case against keeping the requirement for one specific low-risk procedure category. The case is sound, and nothing changes, because the requirement was never really about that procedure's evidence in the first place."
  - "A country that lived through a currency collapse decades ago maintains strict capital controls long after the generation that experienced it has left office. An economist makes a technically compelling case that lifting the controls would boost investment now, under conditions nothing like the original crisis. The argument goes nowhere, since the controls were never really a response to current conditions in the first place."
critical-questions:
  - "Isn't this just saying people are irrational and won't update on good arguments? No -- Popper explicitly grants that Russell's argument was probably correct 'from a purely rational point of view.' The claim isn't that resisting it was a mistake; it's that the resistance was never operating as a counter-argument at all, so no amount of strengthening Russell's case could have touched it."
  - "How would you tell a shock-produced disposition apart from a genuinely persuasive counter-tradition that keeps winning arguments on the merits, decade after decade? Check whether the disposition responds to the specific merits of each new case, or holds constant regardless of them. Popper's test case is built to isolate exactly this: he picks the one scenario (a not-yet-nuclear Stalin, a uniquely narrow window) where the merits argument was as strong as it could possibly get, and the disposition still didn't move."
