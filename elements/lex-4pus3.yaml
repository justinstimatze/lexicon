id: lex-4pus3
name: fleeing-a-harmless-trigger-of-an-involuntary-vulnerability
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person with a stimulus-triggered physical vulnerability can be forced to actively avoid a specific harmless trigger, because engaging with it directly costs them real physical pain, even though the trigger itself means no harm and may not even understand the stakes. Watanye's lips are so badly cracked that laughing splits them and draws blood, so he has trained himself never to laugh, even when people deliberately try to make him. When Black Elk, trying to spear a fish, misses and pitches headfirst into a cold pool, the sight is too much: Watanye doubles up laughing, 'blood was running down his chin,' and from then on 'whenever he saw me coming, he would turn and run, so that he would not have to laugh again.' Black Elk himself is not a threat in any ordinary sense -- he is simply, reliably funny to be around, and that is exactly what Watanye can no longer afford."
related: []
evokes: [black-elk-speaks, watanye, sore-lips, blood-running-down-his-chin, avoiding-a-person-who-makes-you-laugh]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch5-at-the-soldiers-town
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 5, 'At the Soldiers' Town.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "There was a man by the name of Watanye who was good at spearing fish, and he had very sore lips so that he did not dare to laugh. They were cracked all around his mouth. [...] I missed and went over head-first into the cold pool. When I scrambled out, Watanye was all doubled up, hugging his belly, and going 'hunh, hunh, hunh!' Blood was running down his chin. He ran away as fast as he could, and for a long while after that, whenever he saw me coming, he would turn and run, so that he would not have to laugh again."
canonical-instances:
  - "A person recovering from a broken rib avoids a friend who reliably makes them laugh, because right now laughing hard enough genuinely hurts, and the friend has done nothing else to deserve the distance."
  - "Someone in early recovery from addiction avoids a close friend who is otherwise excellent company, because that friend's presence, associated with old using habits, reliably triggers cravings the person is not yet confident they can resist."
  - "A person with a stimulus-triggered seizure disorder avoids a specific harmless visual pattern on a friend's phone case, quietly staying out of view of it instead of explaining the actual medical stakes every time."
critical-questions:
  - "Would it be better for Watanye to explain the actual stakes to Black Elk directly, so the avoidance could be a shared, understood arrangement, rather than something the vulnerable person has to manage alone by physically running away?"
  - "Does the comedy of the situation, a grown man fleeing a boy purely to avoid laughing, undercut how seriously the underlying vulnerability should be taken, or is the humor itself part of what makes the avoidance sustainable rather than humiliating?"
  - "If Black Elk had understood why Watanye kept running, would he have stopped being funny around him, and would that have cost the friendship something Watanye's silence was actually protecting?"
status: active
