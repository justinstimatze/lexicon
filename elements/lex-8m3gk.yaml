lineage:
  - source: primary
    text: radin-iktomi-turns-inescapable-mockery-outward-rather-than-seeking-approval
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Wakdjunkaga Cycle and Its Relation to Other North American Indian Trickster Cycles,' quoting Oglala Dakota theology (after J. R. Walker, Oglala Sun Dance, Anthropological Papers of the American Museum of Natural History, Vol. XVI, Part II, 1917). Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "I am a god and the son of a god. My father, the Rock, is the oldest of the gods. It is he that named all things and made all languages that are spoken. I have done much good and should be treated as a god, but because my other parent, the Winged God, had no shape, my form is queer and all laughed at me. When I do good all laugh at me as if I were making sport, and since everyone laughs at me I will laugh at them. ... he is represented as responding with a long and loud laugh, and as telling the supreme deity that he had forgotten the birds and the other animals; that he would dwell with them and talk with each in its own language; and that on earth he would enjoy himself and make fools of mankind."
canonical-instances:
  - "An employee who discovers that both their best and worst work gets equally dismissed by a manager who has already decided not to respect them stops trying to win the manager over, and instead starts quietly building a reputation and network entirely outside that manager's team."
  - "A student who realizes that classmates mock them identically whether they answer questions correctly or incorrectly stops raising their hand to prove anything and starts openly enjoying being the person who doesn't care what the class thinks, which changes the dynamic more than years of trying to be accepted did."
critical-questions:
  - "Does Iktomi's laugh genuinely represent freedom from needing approval, or is it itself a defensive performance covering real pain at the rejection, and would the story read differently if it let us see any cost to him underneath the bravado?"
  - "Is there a risk that this diagnostic gets applied too early, before someone has actually confirmed that approval is unwinnable, mistaking a temporary rough patch for the kind of permanent, behavior-independent rejection Iktomi actually faces?"
  - "Does turning mockery outward actually change anyone's material circumstances, or does it only change the internal experience of the rejection while leaving the underlying isolation, friendlessness, universal hatred, fully intact?"
