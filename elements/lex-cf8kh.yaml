id: lex-cf8kh
name: bricolage-recombines-inherited-toolkit-engineering-designs-for-the-task
type-in: situation
type-out: typology
_tier: atomic
agent-instruction: "Recognize this pattern when a problem is being solved (practically or intellectually) and you want to name WHICH of two fundamentally different modes of operating is in play. Lévi-Strauss's own framing: there is a science he prefers to call 'prior' rather than 'primitive' — the 'science of the concrete' — whose technical-plane analogue survives among us as what French calls 'bricolage.' The BRICOLEUR is adept at performing a large number of diverse tasks, but, UNLIKE THE ENGINEER, does not subordinate each task to raw materials and tools conceived and procured FOR that project. The bricoleur's universe of instruments is CLOSED: the rule of the game is always to make do with 'whatever is at hand' — a set of tools and materials that is always FINITE and HETEROGENEOUS, because what it contains bears no relation to the current project (or to any particular project) but is the CONTINGENT RESULT of every past occasion to renew, enrich, or maintain the stock with the remains of previous constructions or destructions. The bricoleur's means cannot be defined by a project the way the engineer's can (which presupposes, in theory, one 'instrumental set' per kind of project); the bricoleur's set is defined only by its own history and by the principle that its elements 'may always come in handy.' Practically, the bricoleur's first move is RETROSPECTIVE: turn back to the already-existent set, interrogate what it contains, and index the possible answers it can offer BEFORE choosing — 'a particular cube of oak could be a wedge... or it could be a pedestal.' The ENGINEER, by contrast, questions the universe directly and tries to go BEYOND the constraints of a given state of civilization; the bricoleur, by inclination or necessity, always remains within them. Lévi-Strauss's own gloss on the difference: the engineer works by means of CONCEPTS (open, in principle unlimited reference), the bricoleur by means of SIGNS (concrete, but limited and already-invested with prior use) — concepts open up the set being worked with, signification reorganizes it without extending it. THE DEEPER CLAIM this atom exists to carry: Lévi-Strauss introduces the bricoleur/engineer contrast to argue that MYTHICAL THOUGHT AND SCIENTIFIC THOUGHT ARE TWO PARALLEL, EQUALLY RIGOROUS MODES OF ORDERING REALITY, not a primitive-precursor-to-advanced-successor hierarchy. 'It is therefore better, instead of contrasting magic and science, to compare them as two parallel modes of acquiring knowledge... they differ not so much in kind as in the different types of phenomena to which they are applied.' Mythical thought 'expresses itself by means of a heterogeneous repertoire which, even if extensive, is nevertheless limited... Mythical thought is therefore a kind of intellectual bricolage.' And explicitly: science as a whole is built on the distinction between the contingent and the necessary (event and structure); mythical thought builds structured sets the SAME way bricolage does on the practical plane — by using the remains and debris of events as so many indestructible pieces, serving alternately as ends or means. Use this atom to name: (i) a problem-solver repurposing a fixed, inherited, path-dependent stock of existing means rather than designing or acquiring means tailored to the task (bricolage-mode); (ii) the contrasting problem-solver who defines the task first and then designs or procures purpose-built tools/concepts/materials for it (engineer-mode); (iii) the deeper epistemic claim that a bricolage-structured mode of thought (myth, folk knowledge, vernacular tradition, retrofitted design) is not a deficient draft of a purpose-built mode but a DIFFERENT and still-active way of ordering reality — including inside science and art themselves (Lévi-Strauss notes 'collage' in modern painting as 'the transposition of bricolage into the realms of contemplation,' and that even the engineer/scientist, cross-examining resources that are never unlimited, is not wholly free of the bricoleur's condition — 'the difference is therefore less absolute than it might appear,' though Lévi-Strauss insists it remains real: the engineer tries to escape the constraints of a civilizational state, the bricoleur stays within them). Distinct from lex-akgce (Lévi-Strauss, *The Elementary Structures of Kinship*, exchange-forced-by-prohibition-on-self-pairing-is-the-social-structure): that atom grounds a DIFFERENT Lévi-Strauss book and a different theoretical machinery entirely — a prohibition (incest taboo) forcing cross-group exchange that CONSTITUTES social structure. This atom grounds *The Savage Mind*'s claim about TWO MODES OF INTELLECTUAL OPERATION (bricolage vs engineering) and the parity of mythical and scientific thought. Both are Lévi-Strauss's structuralism but applied to unrelated theoretical objects (kinship-alliance vs modes-of-thought); they do not compose in any tight way and should not be treated as the same claim wearing two names. Distinct from lex-94b62 (Tilly, collective-action-draws-from-historically-constrained-culturally-transmitted-repertoire): Tilly's repertoire-of-contention is cognate in SHAPE — a historically-accumulated, culturally-transmitted, slow-changing set constrains what a collective actor can plausibly do, rather than the actor inventing tactics fresh for each occasion — and the two atoms illuminate each other (Tilly's repertoire IS a bricolage-structured stock of contentious performances). But Tilly's claim is a descriptive/predictive sociology of PROTEST TACTIC AVAILABILITY across historical time, with no epistemic-parity thesis attached; Lévi-Strauss's claim is philosophical/anthropological — that bricolage-structured thought is a GENUINELY RIGOROUS MODE OF INTELLECTUAL ORDERING standing in parity with (not beneath) purpose-built scientific thought. Use lex-94b62 when the question is which collective ACTION-FORMS a group can plausibly deploy; use this atom when the question is which MODE OF PROBLEM-SOLVING OR OF ORDERING KNOWLEDGE is operating, and especially when someone is implicitly or explicitly ranking one mode as more primitive or less rigorous than the other. Cross-domain applications (Lévi-Strauss's own analogy invites this move — use with the epistemic-parity claim attached, not merely as a resourcefulness observation): software development's 'hacky' prototype culture (patching together whatever libraries, snippets, and legacy modules are already in the codebase) versus greenfield purpose-built architecture design; jazz and other improvisatory musics, which work from a fixed, inherited vocabulary of licks, changes, and heads, recombined in the moment, versus a classical composer designing a new structure note-by-note for a specific work; entrepreneurial bootstrapping and 'jugaad' innovation, which builds a product from whatever capital, contacts, and materials are already on hand, versus venture-funded R&D that acquires purpose-built resources for a defined target; vernacular architecture, folk technology, and repair/maintenance culture, which work by retrofitting a closed stock of available materials and know-how; and, noted as a parallel rather than a claim of origination, François Jacob's 1977 'evolution as a tinkerer' (bricoleur) argument in biology — natural selection can only ever work by modifying and recombining what already exists (existing structures, existing genes) rather than designing organs from scratch for a function, which is Jacob's own explicit borrowing of Lévi-Strauss's bricoleur/engineer vocabulary applied to evolutionary biology. Diagnostic questions to ask of any case: is the actor's set of means defined by the CURRENT task (engineer-mode), or by the CONTINGENT HISTORY of everything that happened to accumulate into it (bricolage-mode)? Is the result being judged as a lesser, improvised substitute for a properly-engineered one, or recognized as a coherent, differently-structured achievement in its own right? Is 'primitive' language being used where Lévi-Strauss's own preferred term is 'prior' — signaling a rejection of the hierarchy reading specifically?"
