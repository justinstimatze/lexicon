id: lex-q8pxm
name: when-every-rival-is-bizarre-bizarreness-stops-being-a-valid-objection
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "Schwitzgebel works out a specific case in the metaphysics of mind: materialism, dualism, and idealism, once developed into fully specific coherent positions rather than left as vague labels, each collide with common sense in some serious way, and no fully worked-out version of any of the three -- nor any rejection or compromise among them -- is decisively better supported by the evidence than the rest. Something in that space must nonetheless be true; the options are exhaustive. He names the resulting situation crazyism: 'the view that something crazy must be among the core truths about that topic,' justified 'when we have good reason to believe that one among several bizarre views must be true but where the balance of evidence leaves no individual view decisively supported over all the others.' The narrower, practically useful consequence he draws out is this: once universal bizarreness across an exhaustive option space has actually been established, citing a candidate's bizarreness stops functioning as a reason to prefer some rival over it, because every surviving candidate shares the exact property being cited against it. He calls out his own field for skipping this step: philosophers routinely treat a view's violation of common sense as 'a weighty consideration against' it while quietly exempting whatever alternative they favor from the same scrutiny, when a fair application of the same standard would sink that alternative too. Transferable move: before letting 'that's the bizarre/extreme/counterintuitive option' settle a choice among rivals, check whether the option space has actually been narrowed to an exhaustive set where every well-worked-out member violates the same intuition -- a set of quantum-mechanics interpretations, a slate of hypotheses for an anomalous result, a menu of unpalatable structural fixes for a broken organization. Where that check comes back positive, bizarreness has stopped discriminating among the candidates and some other criterion is needed to choose; the honest fallback posture is confidence that the true answer is one of the bizarre ones, low confidence about which specific one, and continued live engagement with a wider slice of that space than intuition alone would tolerate keeping open."
