canonical-instances:
  - "A newly founded nonprofit spends its first two years almost entirely on programs with immediately countable outcomes (meals served, vaccines administered) even though its founders' actual theory of change emphasizes slower, harder-to-measure work (community organizing, policy advocacy) -- because early funders need quick proof the organization can deliver before they'll fund the harder-to-measure work at all. Once the nonprofit has a multi-year track record, its program mix shifts toward the harder-to-measure work its founders originally wanted to prioritize."
  - "A newly hired department head spends the first six months shipping small, highly visible wins (a UI polish pass, a widely-noticed bug fix) before spending any political capital on the slow architectural rework the team actually needs -- not because the rework matters less, but because the new hire hasn't yet earned the standing needed to ask for patience on something that won't show results for a year."
critical-questions:
  - "How would you distinguish 'the institution no longer needs to prove itself' from 'the institution's actual composition of talent or interests changed' as the explanation for a later shift away from legible output -- Merton flags both as live possibilities in the same passage (the legitimacy explanation and, separately, work that began as practical continuing to be studied once its practical origin is forgotten) without adjudicating between them; can the two be told apart empirically, or only asserted?"
  - "Does a legitimacy-front-loading institution risk locking in the WRONG kind of legible work -- optimizing for whatever is easiest to demonstrate to outsiders rather than whatever would most efficiently build genuine long-run trust -- and if so, is the early skew a rational strategy or a distortion that a savvier institution could avoid by choosing more strategically legible wins rather than merely the fastest ones?"
