lineage:
  - source: primary
    text: merton-1957-social-process-linking-anomie
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. V 'Continuities in the Theory of Social Structure and Anomie,' p.179. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). A footnote digit ('33') sits glued directly to 'obtain.' in the OCR; it is elided rather than reproduced."
    quote: "'To put this problem in its appropriate theoretical context requires us to see the emergence and growth of anomie as a resultant of ongoing social process and not simply as a condition which happens to obtain.'"
  - source: primary
    text: merton-1957-anomie-spreads-and-intensifies
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.179-181, continuing the same passage. The OCR drops the 'o' of 'to' at the line-wrap seam between 'tends t' and 'lessen'; that word is elided with an ellipsis rather than reproduced missing its letter."
    quote: "'A mounting frequency of deviant but \"successful\" behavior tends ... lessen and, as an extreme potentiality, to eliminate the legitimacy of the institutional norms for others in the system. The process thus enlarges the extent of anomie within the system so that others, who did not respond in the form of deviant behavior to the relatively slight anomie which first obtained, come to do so as anomie spreads and is intensified. This, in turn, creates a more acutely anomic situation for still other and initially less vulnerable individuals in the social system. In this way, anomie and mounting rates of deviant behavior can be conceived as interacting in a process of social and cultural dynamics, with cumulatively disruptive consequences for the normative structure, unless counteracting mechanisms of control are called into play.'"
canonical-instances:
  - "One firm's undetected accounting fraud, once its profits become visible to competitors, lowers the perceived cost of the same fraud for firms that were previously conforming — regulatory response that punishes only the first mover, without restoring the market's confidence that the rule is actually enforced, doesn't stop the spread to the second and third movers."
  - "A single well-known case of academic cheating that goes unpunished and unremarked changes the incentive calculation for every student who hears about it, not just the one who cheated — the erosion is in the perceived enforcement of the norm, which is a shared resource, not a private fact about one student's transcript."
critical-questions:
  - "Merton names the escape clause ('counteracting mechanisms of control') but doesn't specify what makes a given control mechanism sufficient to arrest a spiral already in progress versus merely slowing it — is there a way to tell, before the fact, whether a proposed intervention actually restores perceived legitimacy or just adds cost to the next instance of deviance without changing the underlying calculation?"
  - "Does the spreading mechanism require the deviant behavior to be BOTH visible and successful, or does visible-and-punished deviance sometimes spread anomie too, by demonstrating that the norm required enforcement to survive at all — i.e., can even a caught violator erode legitimacy, just via a different route than an uncaught one?"
status: active
