lineage:
  - source: primary
    text: hyde-serranos-sincere-transgression-is-captured-by-a-demagogue
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Democratic Carnival,\"' on Senator Jesse Helms's exploitation of the Piss Christ controversy. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The politicians who attacked the National Endowment for the Arts, using Serrano as one of their wedges, were not really interested in their relationship to God. Senator Helms, at least, has an exquisite instinct for how to build a power base and raise money; like any demagogue, he knows how to translate a complicated problem into a simple fear, how to stir up racial animosity, and how to set his constituents at each other’s throats. If that’s what was actually going on, then this artist’s dirt-work fails: he tries to revive a dying god, and revives a politician instead, and a particular kind of politician at that."
canonical-instances:
  - "A journalist publishes a sincere investigative exposé meant to reform a broken institution, and a rival politician with no interest in the underlying reform seizes the resulting scandal to unseat an opponent and consolidate a power base, so the exposé's real-world effect is a change of officeholder rather than the institutional reform the journalist intended."
  - "A comedian's sincere, faith-literate satire of a religious institution's hypocrisy is picked up by an unrelated media figure who has no connection to that faith, repackaged as a simple us-versus-them culture-war flashpoint, and used to grow an audience and a donor list that has nothing to do with the comedian's original target."
critical-questions:
  - "How would you distinguish a genuine case of demagogic capture from a more cynical read in which the original transgression was never as sincere or apolitical as its author claimed -- is Serrano's stated religious intent itself verifiable, or does Hyde take it on faith?"
  - "Does 'capture' require the demagogue to act in bad faith, or could someone with a genuinely different, non-cynical interpretation of the same symbolic act arrive at the same outraged response without being a demagogue at all -- where's the line between capture and honest disagreement?"
  - "If this pattern is common, does it argue against ever staging a sincere public transgression against a widely shared symbol, since the argues-for-renewal case seems to lose whenever a sufficiently skilled opportunist is present to intercept the reaction -- or is the risk simply a cost to be weighed, not a reason to avoid the act?"
status: active
