id: lex-jct7k
name: the-limiting-case-is-not-the-default-the-messy-intermediate-is
type-in: frame
type-out: frame
_tier: atomic
agent-instruction: "When a discipline takes a clean LIMITING CASE as its analytical primitive (textbook perfect competition, frictionless mechanics, point-particle physics, infinitely-rational agent economics, lossless transmission lines, idealized Newtonian fluid) and treats the messy intermediate as an exceptional appendix to be patched-on with corrections, INVERT the typology. Robinson 1933's move on perfect-competition-vs-monopoly is the canonical transferable instance: treat MONOPOLY as the general primitive — every producer is a monopolist of its own output — and treat perfect-competition as the limiting case where many such monopolists sell in a perfect market with no product differentiation. The reasoning gain: the analytical scheme becomes UNIFORM (no 'awkward cleavage' between the clean-textbook-norm and the messy-appendix), and real-world phenomena that don't fit the clean limiting case (economies internal to the firm, persistent differentiation, intermediate-zone structures) are explained natively by the general primitive rather than as anomalies. Operational moves: (i) when a clean textbook case is presented as 'the model' and intermediate phenomena are 'special cases,' check whether INVERTING the typology yields a cleaner unified analysis; (ii) treat the real-world default — friction, differentiation, intermediate structures, noise — as primitive; treat the textbook-idealization as the limiting case at one end of the spectrum; (iii) Robinson's discipline marker: 'economists were somehow trapped into thinking that [the limiting case] must be of equal importance in the real world' — the inversion frees the analysis from this trap."
