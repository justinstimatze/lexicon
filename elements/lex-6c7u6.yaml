canonical-instances:
  - "The direct textual anchor: Douglass distinguishes the specific unprovable charge (participation in the raid itself) from the provable surrounding facts (correspondence, funding, sending Shields Green to Brown), and judges the second set sufficient for conviction in Virginia's actual state of public feeling, regardless of the first set's evidentiary weakness."
  - "Hypothetical: an employee who merely attended meetings alongside a colleague later accused of fraud calculates that in a company culture already primed to see the whole department as complicit, cooperating with an internal investigation carries real career risk regardless of their own actual innocence, and resigns rather than participate."
critical-questions:
  - "How does an actor calibrate WHEN a venue has actually crossed into this hostile regime, versus a normal jurisdiction where association and the specific charge remain properly distinct in practice? Acting on this calculation too readily risks needless flight from a fair process; acting on it too late risks conviction by association."
  - "What gave Douglass enough confidence in this prediction to actually flee rather than risk trial -- was it a generalizable signal available to anyone reading contemporaneous public rhetoric, or retrospective certainty he could not really have had in the moment?"
  - "Does this mechanism apply only to formal criminal trials, or does the same substitution -- proof of association standing in for proof of the actual charge -- occur in informal venues (an employer's investigation, a social-media pile-on) where the 'conviction' is reputational rather than legal?"
