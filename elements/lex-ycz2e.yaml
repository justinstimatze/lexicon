lineage:
  - source: primary
    text: cushing-owl-persuades-beetle-to-surrender-his-gas
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Prairie-Dogs and Their Priest, the Burrowing-Owl.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'My friend, said he, turning to the Tip-beetle, you have feasted to satisfaction, and it appears to me by your motions that you are exceedingly uncomfortable, being larger of girth than is safe and well for a Tip-beetle. ... I would advise you, therefore, when I lay this pouch on the floor, with the mouth of it toward you, to run your head into it and exhale as much wind as possible. ... You see, continued the Owl, you are at once to be relieved of the serious consequences of your gluttony, while at the same time paying for your food. Now, this is an excellent idea, upon my word, replied the Tip-beetle, and forthwith he thrust himself into the bag.'"
canonical-instances:
  - "A company offers a star employee a generous package to sign away a non-compete and a valuable patent claim, framing it as freeing them from the burden of the paperwork and legal exposure they'd otherwise carry alone, when the actual purpose is capturing an asset the employee would otherwise have owned outright."
  - "A financial advisor persuades a client to move a hard-won pension into a proprietary fund by framing it as relieving the client of the stress of managing it themselves, when the primary effect is transferring control of the client's one significant asset into a structure that principally benefits the advisor's fees."
critical-questions:
  - "Is the Beetle actually relieved of anything real by the arrangement, given that he genuinely was uncomfortably full, or is the relief entirely incidental to an extraction that would have found some other pretext regardless?"
  - "Would the Beetle have refused if the Owl had asked directly for his defensive gas without the comfort framing -- does the story suggest the framing was necessary to get consent, or would gratitude for the meal alone have been enough?"
  - "Does the fact that the Beetle suffers no lasting harm (he returns home, apparently intact) change the moral status of the extraction, compared to a case where surrendering the one defense left the victim permanently vulnerable?"
