id: lex-47uas
name: a-reserve-capability-outside-the-curriculum-repunctures-claimed-parity
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A pupil who has mastered everything a teacher formally taught can come to believe that mastery means parity with the teacher — a belief the teacher can puncture not by disputing it, but by demonstrating a capability that was never part of the curriculum in the first place. This exact structural beat recurs three times across this section of the Jataka: an elephant trainer teaches a rebellious elephant tricks in a single night his pupil never learned; a musician answers a rival pupil's challenge with playing techniques beyond anything taught; and a teacher poses a riddle explicitly outside the material, telling his prideful pupils: 'Do not imagine that this question is in the Three Vedas. You imagine that you know all that I know, and so you act like the jujube tree. You don't know that I know a great deal which is unknown to you.' In each case, the pupil's claim to equality was accurate about the formal syllabus and false about the teacher's total capability — the reserve was never covered by the comparison the pupil thought was complete."
related: []
evokes: [jataka, dukanipata, upahana-jataka, guttila-jataka, mula-pariyaya-jataka, mastering-the-syllabus-is-mistaken-for-matching-the-teacher, an-undisclosed-reserve-capability-punctures-claimed-parity]
