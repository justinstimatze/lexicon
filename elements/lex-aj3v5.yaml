id: lex-aj3v5
name: steady-broad-demand-beats-rare-high-value-with-few-buyers
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When choosing which asset, product line, or resource to develop, don't assume the highest per-unit value option is automatically the most valuable one -- check how deep and reliable the market for it actually is, because a smaller value realized often beats a larger value that rarely finds a buyer. Kautilya states the comparison directly for mines: 'Some teachers say that a small production of high value minerals is preferable [to a large production of inferior products] because valuable products (such as diamonds, precious stones, pearls, corals, gold and silver) are worth much more than a large amount of inferior products. Kautilya disagrees. Buyers of high-valued products are rare and are found only after a long search; there are many buyers and a steady demand for products of small value.' The rival teachers price the asset by its nominal per-unit value; Kautilya prices it by how often that value can actually be converted into a transaction, and names the specific cost the high-value option hides -- the search time and uncertainty of finding a rare buyer, which the nominal price tag doesn't include. He then draws the identical comparison for trade routes, in his own words treating it as the same underlying principle applied a second time: 'As in the case of mines, many inferior routes are preferable to a few important ones.' A route or a product carries no realized value until it actually moves goods or finds a buyer, and a resource with thin, occasional demand can sit unrealized for long stretches regardless of its theoretical worth, while a resource with broad, steady demand converts to value continuously and predictably. Diagnostic move: before valuing an asset, product, or opportunity by its nominal or per-unit price, ask how deep and reliable the actual demand for it is -- a lower-value option with many willing buyers and constant turnover frequently outperforms a higher-value option that requires a long search to find the rare buyer willing to transact, because unrealized value is not the same as value."
