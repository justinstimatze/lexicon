lineage:
  - source: primary
    text: hyde-removing-the-boys-intestines-leaves-his-eventual-hunger-unregulated
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Eating the Organs of Appetite,' analyzing the Tsimshian Raven cycle's origin story \"Raven Becomes Voracious.\" Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The story is built around the question whether or not the intestines will own the boy. The father hopes they won’t, and so he has his attendants remove and burn them when the boy dies, a nice image for getting rid of appetite. If he could live, a boy without intestines might be freed from hunger, freed from attachments, freed from sickness and death. ... I suspect the second defeat arises from the father’s response to the first. He had his people cut out the boy’s intestines, and then the slaves—who are in some way like intestines—appear, wounded and scabbing. Raven is not the father’s hoped-for ideal youth who has escaped this world; he is, rather, a restless, hungry beast who is in this world precisely because his father’s idealism wounded him, and he has tasted the fruit of that wound."
canonical-instances:
  - "A parent who has never let their child experience minor disappointment or failure, hoping to spare them any hurt, produces a young adult who has no developed capacity to regulate disappointment and is overwhelmed by it the first time a real setback occurs, rather than someone who never struggles."
  - "A company culture that strips out any tolerance for internal disagreement, treating conflict as something to be eliminated entirely rather than managed, produces employees with no functional skill at handling disagreement, so that when a real conflict finally erupts it escalates far past what a culture with normal, bounded conflict would have contained."
critical-questions:
  - "Is Hyde's reading that the father's idealism 'wounded' his son a claim the text itself supports, or is it an interpretive leap that imposes a psychoanalytic causal story onto a myth that may simply be describing origins without assigning blame?"
  - "Does removing a capacity for a difficult experience always produce this unbounded rebound effect, or are there cases where the removal genuinely does prevent the difficulty from ever arising, making this a warning about specific kinds of needs rather than a universal rule?"
  - "What would the alternative have looked like concretely, exposing the boy to graduated, bounded hunger rather than either full removal or full, sudden immersion, and does the myth's binary structure, gutted-and-appetite-free versus insatiable, obscure that middle path?"
