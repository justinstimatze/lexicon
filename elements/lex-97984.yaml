id: lex-97984
name: compulsion-overrides-a-warning-the-victim-actually-registered
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "The most dangerous warnings aren't the ones nobody notices, they're the ones a person clearly registers, hesitates over, and then overrides anyway because the compulsion driving them has its own momentum independent of the risk. In Cushing's telling, a gambler-demon who has ruined and killed countless victims sits down against two disguised War-gods and is told exactly how dangerous their weapons are, 'the point of lightning itself fatal in power, splitter of mountains and overcomer of demons and men alike.' The warning lands: 'Old Mitsina, when told of the power of the weapons, became doubtful as to his company.' He doesn't misunderstand the threat or fail to notice it. He registers it fully, hesitates, and then plays anyway, 'presently fell to and played with a will,' because chasing his losses has become a compulsion that operates on its own logic, betting his thighs, his arms, his eyes, each escalation driven by the hope that his luck will turn rather than by any reassessment of the risk he'd just correctly identified. Diagnostic move: when you notice yourself, or someone else, pausing at a genuine warning sign and then proceeding anyway, don't treat the pause as evidence the warning wasn't serious -- a registered-then-overridden warning is a signal that a compulsive pattern, not a risk calculation, is now driving the decision."
related: []
evokes: [a-registered-warning-that-gets-overridden-signals-compulsion-not-calculation, cushing-the-hermit-mitsina, became-doubtful-as-to-his-company, sure-that-his-luck-would-return]
lineage:
  - source: primary
    text: cushing-mitsina-registers-the-warning-and-plays-anyway
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Hermit Mitsina.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'They bet their weapons, holding up the knife of war which they carried, the point of lightning itself fatal in power,--splitter of mountains and overcomer of demons and men alike. Old Mitsina, when told of the power of the weapons, became doubtful as to his company, but presently fell to and played with a will. He lost. ... getting wild with excitement, sure that his luck would return, followed out the plan he had so often suggested to others, and bet away his thighs, then his sides and arms, then his head and ears, excepting his eyes, and last of all his very eyes themselves.'"
canonical-instances:
  - "An experienced trader gets a direct warning from a colleague that a position is dangerously overleveraged against a volatile asset, pauses and visibly weighs the warning, then increases the position anyway because the pattern of doubling down after losses has become automatic, driven by the hope of a rebound rather than by any new information that changed the risk."
  - "A driver who has been drinking gets a passenger's clear, specific warning that the roads are icy and they shouldn't speed, nods and slows down briefly, then accelerates again minutes later because the underlying compulsive pattern of overconfidence reasserts itself independent of having genuinely understood and accepted the warning."
critical-questions:
  - "Is there a meaningful difference between Mitsina's momentary doubt here and a merely performed pause meant to look thoughtful before doing what he was always going to do -- does the story give any way to tell a genuine registered warning from a hollow one?"
  - "Would any warning have been strong enough to actually stop Mitsina, given how far his compulsion had already progressed by the time the War-gods arrived, or does the story suggest that past a certain point no amount of accurate risk information can interrupt the pattern?"
  - "Does recognizing that a warning has been registered and overridden actually give a bystander any useful next move, or does it only serve as an after-the-fact diagnosis once the compulsive choice has already been made?"
status: active
