id: lex-kxjyt
name: debase-the-medium-to-kill-the-behavior-it-enables
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an undesired behavior (hoarding, luxury-seeking, cross-border capital flight) is enabled by a high-value-density medium of exchange, attacking the behavior directly is harder than attacking the medium that makes it cheap and portable. Plutarch's Life of Lycurgus supplies the canonical case: to suppress avarice and foreign luxury trade at Sparta, Lycurgus did not ban wealth accumulation by decree — he replaced gold and silver coin with a bulky, low-value iron currency. 'He commanded that all gold and silver coin should be called in, and that only a sort of money made of iron should be current, a great weight and quantity of which was but very little worth; so that to lay up twenty or thirty pounds there was required a pretty large closet, and, to remove it, nothing less than a yoke of oxen.' The mechanism is indirect: hoarding, concealment, and cross-border exchange all depend on a currency's value-to-volume ratio staying high enough to move and hide easily. Collapse that ratio and the behavior becomes physically impractical without ever being formally prohibited — nobody is punished for hoarding iron, hoarding iron is just not worth doing. Generalize beyond this case: capital controls and currency inconvertibility used to stop capital flight by making the local currency worthless outside its borders rather than banning export directly; an organization killing expense-account abuse by reimbursing in low-liquidity scrip or restricted-use credit instead of cash, so the abuse is still technically possible but no longer worth the friction. The diagnostic move: when a behavior persists despite prohibition, ask whether it is riding on some underlying medium whose properties (density, liquidity, portability, fungibility) make the behavior cheap — and whether degrading that medium's usefulness for the behavior, while leaving it usable for everything else, is more durable than banning the behavior outright."
related: [lex-ewjec]
evokes: [iron-money, yoke-of-oxen, called-in-gold-and-silver, value-density, medium-not-behavior]
lineage:
  - source: primary
    text: plutarch-c100-life-of-lycurgus-iron-money
    citation: "Plutarch, Life of Lycurgus, in Plutarch's Lives (Clough revision of Dryden translation, Project Gutenberg #674). Lycurgus's currency reform: replacing gold and silver coin with a bulky, low-value iron currency as part of his broader program to suppress luxury and foreign trade at Sparta."
    quote: "he commanded that all gold and silver coin should be called in, and that only a sort of money made of iron should be current, a great weight and quantity of which was but very little worth; so that to lay up twenty or thirty pounds there was required a pretty large closet, and, to remove it, nothing less than a yoke of oxen."
canonical-instances:
  - "Lycurgus's iron-money reform in Plutarch: gold and silver are called in and replaced by an iron currency so heavy and low-valued that hoarding a modest sum requires a large closet and a team of oxen to move — hoarding and covert exchange collapse not because they're banned, but because the medium no longer supports them."
  - "capital controls and currency inconvertibility: a state restricts its currency's convertibility or exportability, making capital flight physically or legally impractical without banning the underlying transactions the currency would have enabled."
  - "expense-account abuse suppressed via low-liquidity reimbursement: an organization pays reimbursements in restricted-use scrip or credit rather than cash, leaving the abuse technically possible but no longer worth the friction of extracting value from it."
critical-questions:
  - "how does this differ from lex-ewjec (removing-non-market-exits-makes-market-dependence-structural)? lex-ewjec is about removing ALTERNATIVES to a market (subsistence, kin, commons options) so that entering the market becomes structurally unavoidable — the target is the exit options surrounding a system. This atom is about degrading the PROPERTIES of a medium already in use (density, portability) so that a specific behavior riding on that medium becomes impractical — the target is the medium's own usefulness for one behavior, not the presence of alternatives to a system."
  - "isn't this just banning the behavior indirectly — a distinction without a difference? No — the atom's operative claim is that indirection changes enforcement cost and legitimacy. A direct ban requires detecting and punishing violations, which is expensive and creates evasion incentive; degrading the medium requires no detection at all, because the behavior becomes unrewarding on its own terms. Nobody needs to be caught hoarding iron; there's simply nothing to gain from it."
  - "does this generalize to any medium, or only currency? The mechanism applies to any medium whose PHYSICAL or STRUCTURAL properties (density, storability, transferability, fungibility) are what make an undesired behavior cheap — currency is the clearest case, but the same move applies to information (making a leaked format bulky/unshareable), access tokens (making credentials non-transferable), or reputation (making a status marker un-hoardable). The atom's claim is narrower than 'change incentives' in general — it specifically targets the enabling medium's usability properties, not the payoff structure around using it."
