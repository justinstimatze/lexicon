canonical-instances:
  - "Stoll's initial choice in The Cuckoo's Egg: rather than lock the compromised account, he leaves it open and builds monitoring around it, reasoning that eviction can't undo unknown prior damage and only costs future visibility into who's responsible and what they're after."
  - "counterintelligence 'running' a detected double agent rather than arresting them immediately: continued (monitored) operation maps the rest of the network and enables feeding calibrated disinformation, at the cost of tolerating their continued access in the meantime."
  - "a security operations center leaving a detected intruder inside an isolated, monitored network segment rather than immediately terminating the session, to capture their tools, techniques, and objectives before they can be applied against an unmonitored target."
critical-questions:
  - "how does this differ from lex-th6tr (keep-options-open-under-radical-uncertainty)? lex-th6tr is about preserving action-flexibility when you don't yet know which world or hypothesis you're in — the value is in not committing prematurely. This atom is narrower: a known, currently-exploitable vulnerability is left open deliberately, trading immediate security for intelligence value, precisely because the adversary (not the world-state) is already known to be present, and observation of that specific actor is the scarce resource. lex-th6tr keeps options open about what to believe; this atom keeps a door open about what can still be learned from a known adversary already inside."
  - "isn't this just risk-tolerance or negligence dressed up as strategy? No — the atom's claim is conditional on already having lost the thing eviction would protect: the intruder has already had access, and unknown damage has already possibly occurred. That is exactly the condition under which eviction's marginal security benefit is smallest and its intelligence cost is highest. The atom does not claim you should always tolerate an open door — only that once a sophisticated adversary is confirmed present, the calculus flips from 'prevent entry' (already failed) to 'extract maximum information before they leave or you're forced to act.'"
  - "when does the intelligence-value case for staying open run out? When the deliberately-tolerated exposure escalates into ongoing harm whose cost exceeds the accumulating intelligence value — for instance, discovering the intruder has moved from passively browsing to actively exfiltrating live sensitive material. Stoll himself has to renegotiate this boundary repeatedly with lab management as the stakes rise through the book; the atom names a tradeoff to be continuously re-evaluated, not a decision made once."
