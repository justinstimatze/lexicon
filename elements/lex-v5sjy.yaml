id: lex-v5sjy
name: elaborating-existing-information-is-revelation-not-creation-of-newness
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Producing an outcome by unfolding information that was already latently present, however elaborate or surprising the outcome looks, is a different kind of event from producing an outcome that had no informational connection to what came before -- the first reveals something that was already implicit, the second creates something genuinely new, and mistaking one for the other credits ordinary elaboration with the wrong kind of novelty. Hyde draws the distinction from Jacques Monod's Chance and Necessity, using the example of a sugar crystal: 'If you dissolve enough sugar in hot water, and then cool the water, crystals will always form. The cooling in a sense \"creates\" the crystals, but the creation is not \"absolutely new\" the way the surviving consequences of a mutation are new. In the case of the sugar crystal, \"the necessary information was present, but unexpressed, in the constituents. [Such] building of a structure is not a creation; it is a revelation,\" while evolutionary creation, by contrast, \"arises from the essentially unforeseeable [and] is the creator of absolute newness.\"' A genetic mutation, by contrast, has no informational link to the environment it will eventually have to survive in; that total independence between cause and consequence is what makes it capable of producing something the system's prior information could never have specified in advance. Diagnostic move: when something described as 'new' or 'creative' emerges, ask whether it was actually derivable in principle from information already present in the system that produced it, however surprising or complex the unfolding looked, or whether it came from a source genuinely disconnected from that prior information -- a crystal always forming the same way from the same solution is not creating novelty no matter how striking the crystal looks, and confusing elaborate revelation with genuine creation misjudges where actual newness in a system comes from."
