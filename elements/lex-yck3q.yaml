id: lex-yck3q
name: a-ritual-office-is-pre-authorized-to-deliver-unverified-warnings
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Information delivered through a culturally designated ritual channel can get acted on immediately and completely by an entire community, with the office itself, not the individual's personal track record, authorizing the trust. A medicine man named Chips is undergoing the purification ceremony that precedes a ritual he's about to perform when a voice inside the sweat tepee tells him the band must flee at once. Nobody demands he explain the voice, cross-examine the warning, or wait for a second source. The whole band breaks camp within the hour: 'everybody was excited, breaking camp, catching the ponies and loading the drags.' The trust doesn't rest on Chips personally having predicted things correctly before -- it rests on the sweat tepee, the purification, and the ceremonial moment itself being the recognized occasion on which such warnings arrive."
related: []
evokes: [black-elk-speaks, wasichus-in-the-hills, chips-the-medicine-man, go-at-once-go-home, warning-authorized-by-office-not-track-record]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch7-wasichus-in-the-hills
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 7, 'Wasichus in the Hills.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "some of the people were building a sweat tepee for a medicine man by the name of Chips, who was going to perform a ceremony and had to be purified first. [...] When we got back, everybody was excited, breaking camp, catching the ponies and loading the drags; and I heard that while Chips was in the sweat tepee a voice had told him that the band must flee at once because something was going to happen there."
canonical-instances:
  - "A newly ordained oracle's very first pronouncement is acted on by the entire temple staff without question, because the office of oracle itself, not this particular person's history of accuracy, is what the institution trusts."
  - "A ship's crew immediately changes course on a newly certified navigator's word alone, before that navigator has personally proven anything, because the certification and the role carry the authority rather than any individual track record."
  - "A congregation acts on a newly installed pastor's very first sermon-derived guidance about a community decision. What they're deferring to is the pulpit itself, before this particular pastor's judgment has ever been tested."
critical-questions:
  - "Does trusting the office rather than the individual make a community more vulnerable to a single bad-faith or mistaken office-holder, since the usual check, a track record, has been explicitly bypassed?"
  - "What happens to this kind of trust the first time a ritually delivered warning turns out to be false -- does the office's authority survive one failure, or does it depend on never yet having been wrong?"
  - "In this case the warning was vindicated within days by real soldiers entering the Hills -- would the community's confidence in ritual-office warnings have been shaken if it hadn't been, or is that kind of warning structured so that a miss is never really counted as disconfirming?"
status: active
