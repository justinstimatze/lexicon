id: lex-h932x
name: blaming-stability-itself-for-trouble-your-own-conduct-keeps-causing
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Someone who repeatedly generates chaos through their own impulsive choices can still experience the aftermath as proof that staying still, not their own conduct, is what generates trouble -- and conclude that the fix is more movement, not different behavior. In Radin's Winnebago Trickster cycle, after a marriage built on deception collapses in public disgrace, Trickster returns to a stable home, stays until his son is grown and self-sufficient, and is welcomed happily the entire time: 'The chief was very happy when Trickster came home... Trickster hunted game for his child and killed very many animals.' Nothing about this settled period causes him any trouble at all. Yet the moment it's stable, he leaves again, and names the wrong culprit for every misadventure that preceded it: 'it is about time for me to start travelling again for my boy is quite grown up now. ... I will go around the earth and visit people for I am tired of staying here. I used to wander around the world in peace. Here I am just giving myself a lot of trouble.' The trouble in this cycle has come entirely from Trickster's own repeated impulsive schemes -- boasting, disguising, breaking rules -- never once from simply remaining in one place. Diagnostic move: when someone concludes that a stable situation itself is the source of their recurring trouble, check whether the trouble actually originated in that stability or in a pattern of their own conduct that would follow them anywhere they went next."
