name: content-and-probability-trade-off-so-choose-the-riskier-theory
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When comparing two theories that are both already testable and asking which one science should prefer, don't reach for whichever is more probably true -- reach for whichever says more, because the two properties move in opposite directions by logical necessity, not by accident. Popper's formal point: take any two statements a and b, and their conjunction ab. The informative content of ab is always at least as great as the content of either component alone -- Ct(a) <= Ct(ab) >= Ct(b) -- because saying two things commits you to more than saying either one. But the probability calculus runs the opposite direction on the exact same conjunction: p(a) >= p(ab) <= p(b), since asserting more ways to be wrong makes the joint claim less likely to be true. 'Together these two laws state that with increasing content, probability decreases, and vice versa; or in other words, that content increases with increasing improbability... if our aim is the advancement or growth of knowledge, then a high probability... cannot possibly be our aim as well: these two aims are incompatible.' The practical payoff: when a theory survives being strengthened -- made to predict more, cover more cases, forbid more possible observations -- its increased improbability is the actual currency of scientific progress rather than a defect to explain away, because a theory can only be severely tested by risking the additional ways it could now turn out false. So the diagnostic move when ranking rival theories or hypotheses isn't 'which one is more likely to be right' but 'which one, if wrong, would be wrong in a more informative and more checkable way' -- and if a theory that says less is being preferred purely because it's harder to catch out, that's optimizing for safety instead of for growth."
