    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' quoting the Homeric Hymn to Hermes and Hyde's own commentary. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "“He crossed the threshold”: here is the boundary-crosser on the boundary itself. He is leaving his mother, his cradle, the earth, the underworld, the private, the dark; he is entering the sunlight, the public, the uncovered, the outer and upper worlds of the sky gods (Zeus, Apollo, Helios). Poised on the threshold, he is in his world, the crepuscular, shady, mottled, ambiguous, androgynous, neither/nor space of Hermetic operation, that thin layer of topsoil where all these things are not yet differentiated. From this position Hermes can move in either direction or, more to the point, act as the agent by which others are led in either direction."
canonical-instances:
  - "A bilingual, bicultural employee who is fully embedded in neither the home office nor the overseas branch becomes the one person who can actually move a decision between the two, precisely because a fully-domestic executive and a fully-local branch manager can each only operate inside their own half of the company."
  - "A therapist who has personally experienced both severe illness and full recovery, and identifies fully with neither the patient community nor the clinical establishment, becomes uniquely able to translate between the two -- a position a career clinician with no illness history or a patient with no clinical training cannot occupy."
critical-questions:
  - "Is the threshold position stable and repeatable, or does it collapse the moment the actor is forced to commit (a translator eventually has to take a side in a dispute) -- how durable is this liminal advantage under real pressure?"
  - "Does occupying the boundary genuinely grant the power to move things in either direction, or only the power to be trusted or used by both sides, which is a narrower and more precarious kind of leverage than 'control of the crossing' implies?"
  - "Is this a claim about a real structural advantage, or a romanticized reading of marginality that risks glamorizing what is, for many actual boundary-occupants (immigrants, mixed-status people), an exhausting and involuntary position rather than a chosen source of power?"
