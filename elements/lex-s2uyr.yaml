id: lex-s2uyr
name: oppression-is-five-distinct-structural-forms-not-one-distributive-deficit
type-in: claim
type-out: typology
_tier: molecule
agent-instruction: "Recognize this pattern when a discussion of injustice, disadvantage, or 'oppression' is being run through a single, unifying lens — either the DISTRIBUTIVE lens ('this group has less income/wealth/positions than that group; fix the allocation and the injustice is fixed') or a single-cause REDUCTIONIST lens ('it's really all class,' 'it's really all one root system called racism/patriarchy/whatever') — and the live diagnostic question is whether the injustice actually being described is one, several, or all of five ANALYTICALLY DISTINCT, MUTUALLY IRREDUCIBLE structural mechanisms Young names EXPLOITATION (lex-9z37e), MARGINALIZATION (lex-sxc7c), POWERLESSNESS (lex-295yy), CULTURAL IMPERIALISM (lex-qrfr5), and VIOLENCE (lex-wcpsk) — none of which reduces to, or is fixed by, redistributing goods alone, and none of which reduces to any of the other four. The typology presupposes a prior claim (lex-4kfah): oppression happens to real, relationally-constituted social groups, not arbitrary aggregates of individuals who happen to share a trait. Young's own move is structural rather than tyrannical: oppression need not have a correlate, intending oppressor — it can be 'the everyday practices of a well-intentioned liberal society,' embedded in unquestioned norms and institutional rules, drawing directly on Foucault's non-sovereign model of power (lex-95qfv). Her solution deliberately avoids both collapsing all oppressions into one master category (the Marxist all-class reduction) and treating each group's oppression as its own separate, unrelated system. See each face's own atom for its mechanism, non-distributive remedy, and worked evidence; this atom is the diagnostic frame holding them together, and the claim that a passed distributive test (lex-xuwr2) can leave any of the five completely untouched."
related: [lex-95qfv, lex-a3tfj, lex-raydk, lex-sb7wj, lex-tjr5d, lex-xuwr2, lex-9z37e, lex-sxc7c, lex-295yy, lex-qrfr5, lex-wcpsk, lex-4kfah]
