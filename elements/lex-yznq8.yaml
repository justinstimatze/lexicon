canonical-instances:
  - "A challenger trying to break up an incumbent industry alliance doesn't try to poach every member equally -- it targets either the smaller peripheral firm the others rely on to cover a regional market they don't want to serve themselves, or the largest, most-connected firm everyone else defers to on pricing, because either move leaves the remaining members suddenly uncoordinated with each other."
  - "A negotiator working to dissolve a united bargaining bloc identifies which party sits at its geographic or logistical edge (handling a piece none of the others want) and which sits at its center (the one everyone else routes decisions through), and focuses persuasion efforts on one of those two rather than the bloc's most vocal or visible member."
critical-questions:
  - "how does an outside actor reliably identify who actually occupies the structural edge or center of a coalition from the outside, given that coalitions often obscure their real internal dependencies, and a wrong read could mean spending effort on a member whose departure changes nothing?"
  - "does this tactic assume the coalition's structure is stable enough to exploit -- if the coalition can quickly promote a new center or shore up its edge once it notices the targeted member being courted, does the entire approach lose its advantage before it can be executed?"
  - "is there a risk that winning over the edge or center member simply transforms the coalition rather than breaking it -- the remaining members could form a smaller but still-cohesive group around a new center, meaning the tactic degrades rather than destroys the opposing coalition?"
