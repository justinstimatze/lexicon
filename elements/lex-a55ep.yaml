id: lex-a55ep
name: lenses-as-multi-perspective-design-evaluation-method
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When designing anything complex — a game, a product, an interface, an organization, a curriculum, a research program — Schell's transferable claim is that NO SINGLE EVALUATIVE PERSPECTIVE captures what makes the design good or bad. Instead, deploy a SET OF NARROW LENSES, each lens being a specific evaluative question-set tied to one design property (e.g. 'Lens of Surprise: What in my design will surprise players? Are the surprises pleasant?'; 'Lens of Fun: What parts of my game are fun? What parts need to be more fun?'; 'Lens of Curiosity: What questions does my design make players ask? What can I do to make them care?'). The transferable method is: for any given design problem, hold the design up against MANY narrow lenses in succession, and the lenses you keep returning to ARE the key concerns of the design. Schell's specific contribution is the curated set of ~100 lenses for game design (each ~3-5 questions), but the underlying TRANSFERABLE METHOD generalizes: any design discipline benefits from explicit named lens-sets that surface distinct design properties. Practitioner consequences: (1) when stuck on a design, run through a checklist of lenses you might not have considered — the lens that surfaces a problem you hadn't noticed IS the diagnostic; (2) when debating design choices on a team, name the lens each person is implicitly using ('I'm looking through the Lens of Aesthetics; you're looking through the Lens of Endogenous Value — we're not arguing the same question'); (3) when teaching design, scaffold from explicit named lenses, not from intuition — the lenses are the form-of-knowledge that transfers; (4) when reviewing your own design, the lenses you AVOID using are diagnostic of blind-spots. Distinct from lex-sp7fa every-framing-highlights-and-hides: lex-sp7fa is the GENERAL property that all framings have blind-spots; this atom is the SPECIFIC method of cycling through multiple framings deliberately to mitigate any single framing's blind-spots. lex-sp7fa names why you should swap framings; this atom names HOW to operationalize the swapping as routine. Composes with lex-g6sp7 pattern-language: patterns describe context+forces+resolution; lenses describe evaluative questions. The pair compose into a design methodology where patterns generate candidate forms and lenses evaluate them. Distinct from lex-eb3wf prospective-hindsight / lex-7tvr6 outside-view: those are specific lenses you might add to your kit; this atom names the META-METHOD of having-and-using-many-lenses."
