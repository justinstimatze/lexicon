    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 7, '\"Speechless Shame and Shameless Speech,\"' quoting Richard Rodriguez's Hunger of Memory. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Immigrant children get to be shamed, first, by their parents, and then they get to be ashamed of their parents. In Hunger of Memory, a memoir of growing up Mexican-American in Los Angeles, Richard Rodriguez gives several vivid pictures of this latter feeling. He remembers times, “like the night at a brightly lit gasoline station (a blaring white memory),” when he stood awkwardly listening to his father, “pressured, hurried, confused,” trying to speak English to the easygoing teenage attendant. He remembers winning an award at school and having his parents come to see him receive it. “A few minutes later, I heard my father speak to my teacher and felt ashamed of his labored, accented words.”"
canonical-instances:
  - "A first-generation college student is initially embarrassed in front of classmates by not knowing campus customs her working-class family never taught her, and later, home for a holiday, catches herself feeling embarrassed by her parents' unfamiliarity with the very customs she's since learned, a second shame her siblings who didn't go to college never experience."
  - "An employee promoted from the factory floor into management is first self-conscious in executive meetings about not knowing the professional vocabulary, and months later finds himself wincing at how his old floor crew talks in front of visiting clients, an inversion he wouldn't have predicted from the first kind of discomfort alone."
critical-questions:
  - "Does the second-stage shame (of the origin group) always require full internalization of the second standard, or can it arise more superficially, from mere exposure or social pressure to conform, without the person actually adopting the new standard as their own?"
  - "Is this compounding sequence specific to immigrant and bicultural experience, or does it generalize to any case of upward or lateral social mobility across sufficiently different norm-systems, making 'immigrant child' one instance of a much broader class rather than a distinct category?"
  - "Could the second-stage shame be better explained by something other than internalized competing standards -- for instance, ordinary adolescent embarrassment at parents in general, which happens across cultures and might be getting misattributed here to bicultural dynamics specifically?"
