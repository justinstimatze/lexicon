id: lex-c67g3
name: exception-density-determines-whether-principle-or-case-experience-outranks
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two fields both claim to have 'basic principles,' don't assume mastering the principle earns the same authority in both. What determines the answer is how densely the field's real cases carry exceptions to its own general rules. A Cornell third-year student draws the contrast directly, comparing his engineering coursework to his medical training: 'In engineering, once you really understand a principle, it stays with you, and you feel confident you will be able to use it in attacking a wide range of new problems.... The problems may be new tomorrow, but the basic principles don't change (much).... With medicine, it's different.... There are as many exceptions as there are rules... and the important things in one case don't count in another.... You can't read the chapter and \"figure out the problem\" in medicine.... You can say, \"Cecil says...\" but if he's seen patients with such-and-such for twenty years, then he probably has you. In other words, years of experience don't modify the principles of the engineering book, but in medicine they do.' In a low-exception field, understanding the principle transfers directly to new problems, and a textbook citation settles a dispute — accumulated years of practice add little the principle didn't already give you. In a high-exception field, the textbook's general case reliably fails to match the specific case in front of you, and only someone who has personally seen enough particular exceptions has the standing to know which general rule applies here and which doesn't — their experience doesn't just supplement the principle, it can override the citation. Diagnostic move: before deferring to whoever cites the textbook or whoever cites their years of experience, ask how exception-dense the domain actually is — a domain closer to engineering rewards the citation, a domain closer to medicine rewards the veteran, and mistaking one domain's epistemic culture for the other's produces either brittle over-generalization from principles that don't hold, or unwarranted deference to experience where a stable principle would have served better."
