id: lex-8bjw4
name: open-crediting-of-innovation-sustains-a-critical-tradition
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When trying to explain why one intellectual or organizational lineage keeps producing genuine innovation across generations while an outwardly similar one stagnates into repeating its founder, look at what happens to change when it occurs -- is it named, credited to a person, and preserved alongside the older view it replaced, or is it smuggled in as a restatement of what the founder 'really' meant all along? Popper contrasts the dogmatic school with the critical one he credits for the Presocratics' originality. The dogmatic pattern: 'Far from being places of critical discussion they make it their task to impart a definite doctrine, and to preserve it, pure and unchanged... A school of this kind never admits a new idea. New ideas are heresies, and lead to schisms... But the heretic claims, as a rule, that his is the true doctrine of the founder. Thus not even the inventor admits that he has introduced an invention; he believes, rather, that he is returning to the true orthodoxy which has somehow been perverted.' The alternative, which Popper traces to Thales tolerating -- and, he conjectures, actively encouraging -- his own pupil Anaximander's criticism of his theory: 'I like to think that Thales was the first teacher who said to his pupils: \"This is how I see things -- how I believe that things are. Try to improve upon my teaching.\"' The mechanistic difference: a dogmatic institution has no history of ideas because every change gets flattened into the founder's single unchanging voice, which means the same errors get relearned generation after generation with no record that they were ever corrected. A critical institution keeps a visible history of who changed what and why, which means each generation starts from the best available version rather than reconstructing it from scratch. Diagnostic move: to tell which kind of institution you're looking at, don't ask whether it claims to value new ideas -- ask whether it can produce a dated, attributed history of its own disagreements. An institution that can only describe itself as one continuous, unbroken teaching is very likely erasing exactly the disagreements that would let you check whether it actually improves over time."
