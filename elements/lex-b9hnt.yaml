lineage:
  - source: primary
    text: vollset-2020-fertility-mortality-migration-population-scenarios
    citation: "Stein Emil Vollset, Emily Goren, Chun-Wei Yuan, et al., 'Fertility, mortality, migration, and population scenarios for 195 countries and territories from 2017 to 2100: a forecasting analysis for the Global Burden of Disease Study,' The Lancet (published online July 14, 2020), section 'Technical limitations and challenges,' p. 19."
    quote: "'The use of time alone as the driver has the advantage that time is easily forecasted, but has the strong limitation that, because time is not causal per se, these models assume that the correlation between time and true causal determinants remains the same in the past as in the future.'"
  - source: primary
    text: vollset-2020-fertility-mortality-migration-population-scenarios
    citation: "Stein Emil Vollset, Emily Goren, Chun-Wei Yuan, et al., 'Fertility, mortality, migration, and population scenarios for 195 countries and territories from 2017 to 2100: a forecasting analysis for the Global Burden of Disease Study,' The Lancet (published online July 14, 2020), section 'Technical limitations and challenges,' p. 19."
    quote: "'By contrast, we explicitly built into each component of our population model the associations between drivers and the outcome, such as tobacco and lung cancer, and CCF50 and educational attainment. Explicit modelling of these associations also means that we can develop policy-relevant scenarios: what will happen in a particular place if the government invests in schools and increases educational attainment? The limitation of this approach is that each of these independent drivers must be forecasted into the future for the reference scenario. The issue is the tradeoff between the benefits of modelling the explicit driver compared with the challenges of forecasting the independent drivers into the future.'"
canonical-instances:
  - "A climate-impact model swaps a simple warming-over-time trend line for an explicit emissions-driven physical model. The physical model is more interpretable and supports policy scenarios ('what if emissions are cut 50%'), but its accuracy now depends on correctly forecasting emissions themselves, which is its own hard, contested prediction problem the trend line never had to solve."
  - "A startup's revenue forecast built on 'signups this quarter' feels more rigorous than a straight-line extrapolation of past revenue, because signups causally drive revenue. But the forecast is only as good as the signups forecast underneath it -- if signups are themselves guessed rather than modeled, the team has added a layer of apparent rigor without reducing the actual uncertainty in the number that matters."
  - "Operationally distinct from lex-vgfgh causal-cognition-stratifies-into-association-intervention-and-counterfactual: that atom classifies WHICH kind of causal question is being asked (seeing/doing/imagining) and what evidence each requires. This atom assumes a genuinely causal, driver-based model has already been built for forecasting purposes and names a cost specific to THAT choice -- the drivers themselves must now be forecast, and that forecasting problem can be harder than the one it replaced."
critical-questions:
  - "How do you tell whether the driver-based model is actually a net improvement, rather than just a more complicated way to be wrong? The paper's own answer: check out-of-sample predictive validity against the time-alone model. If the driver-based model doesn't forecast at least as well on held-out data, the added structure isn't paying for itself."
  - "Does the driver's own forecast carry honestly wide uncertainty, or does the model quietly treat the driver forecast as known and only propagate the outcome-given-driver uncertainty? Understating uncertainty in the driver forecast is exactly how this trade-off gets hidden rather than confronted."
  - "Is the causal relationship between driver and outcome itself assumed stable into the future, the same unexamined assumption time-alone models make about time? A driver-based model that assumes its own driver-outcome coefficient holds unchanged for decades has smuggled the time-alone model's central weakness back in one level down."
