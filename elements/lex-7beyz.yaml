lineage:
  - source: primary
    text: radin-the-chiefs-father-dismisses-the-mothers-accurate-suspicion-of-hare
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 20. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "As soon as he entered the lodge he threw his arrows in the back of the lodge and they all fell even. However, the mother said, 'Oh, I wonder if this really is my son, for I believe one of the arrows sticks out just a little more than the other.' But the old chief said, 'What do you mean by making our boy nervous, you evil old woman,' and addressing himself to Hare he said, 'Don't mind her but throw your arrows any way you please.' Then Hare took his moccasins and threw them over the lodge-poles and they caught and hung there. The mother gave him food and he ate a great deal as he was hungry. 'Well,' said the mother, 'this cannot be my son for he never eats so much food.''What is the matter with that evil old woman?' said the old chief. 'Why don't you let our child eat in peace? You will make him nervous with your talk. Besides, he has not had any food all these days and he has a right to be hungry.'"
canonical-instances:
  - "A junior auditor flags that a subsidiary's numbers don't match the pattern from previous quarters, and a senior executive tells the rest of the room not to make the finance team nervous with unfounded accusations, ending the conversation without anyone actually checking the numbers the auditor pointed to."
  - "A grandmother says at a family gathering that the person claiming to be a long-lost relative doesn't recognize details only the real relative would know, and another family member scolds her for being rude to a guest, and the claim is never actually verified because the objection was treated as bad manners rather than as evidence."
critical-questions:
  - "Does the old chief's dismissal reflect genuine belief that Hare is his son, making this a case of honest misplaced loyalty, or does the story leave open the possibility that the father is simply averse to conflict regardless of who is right, and does that distinction matter for the diagnostic?"
  - "Would the mother's doubt have been taken seriously if she had framed it differently, focusing on the discrepancy itself rather than voicing uncertainty about her own son's identity, or does the story suggest the dismissal would have happened regardless of how the doubt was phrased?"
  - "Is there a meaningful power dynamic specific to this being a mother being silenced by a father in the household, and does the mechanism generalize to any case where a specific, accurate doubt is reframed as an interpersonal offense, regardless of who holds authority over whom?"
