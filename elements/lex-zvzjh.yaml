id: lex-zvzjh
name: evaluation-data-stimulates-change-on-bad-news-and-legitimizes-status-quo-on-good-news
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When an organization tracks metrics to evaluate itself, don't assume the measurement apparatus is oriented toward change — the same data plays two opposite roles depending on what it shows, and the role it plays on any given finding is decided by the finding, not by any prior commitment to using data for improvement. Goss shows the change-triggering half first: 'Tabulation of anonymous student responses to a query concerning the weekly Comprehensive Care Conference indicated, for example, that over half of the students (60 per cent) were prepared to say that attending these conferences had not been particularly worthwhile in contributing to their medical training. This information buttressed the reports of Preceptors and other staff members regarding student reactions to the conference, and thus gave additional impetus to attempts aimed at improving the conference.' She's explicit the data's role here is confirmatory, not originating: 'even elementary research findings frequently documented a condition about which there had previously been only vague or incomplete impressions, and in this fashion furnished additional incentive for change.' The opposite role shows up just as clearly: 'Sometimes the research data played a role in maintaining rather than changing arrangements, in that they pointed out areas of \"success\" as well as those of \"failure\" in achieving Program goals. For instance, information concerning student experience in providing continuous care for patients in the Program showed that students saw Family Care patients an average number of 4.4 times, and other patients an average of 1.8 times during the semester. These figures were seen as representing \"good\" continuity by the C. C. & T. P. staff, with the result that no alterations in arrangements relevant to this situation were considered necessary.' Her own summary names the asymmetry directly: 'this stabilizing function of the information does not negate the role it played, from time to time, in stimulating change' — both functions are real and coexist in the same evaluation program, decided case by case by what the numbers happen to show. The practical implication is that 'we measure everything so we can improve' and 'we measure everything so we can show it's fine' are not competing descriptions of an organization's evaluation culture — they are both accurate simultaneously, applied selectively to whichever findings land which way. Diagnostic move: when an organization points to its own measurement or evaluation program as evidence of a commitment to improvement, check whether findings that came back favorable were also treated as license to leave the corresponding arrangement untouched — if so, the apparatus is functioning symmetrically (data legitimizes both action and inaction depending on result), which is a different and more defensible claim than 'we act on what the data tells us,' since acting only ever happens on the bad news half."
