name: complex-societies-collapse-when-investment-in-complexity-reaches-declining-marginal-returns
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating why a complex system (civilization, organization, software architecture, infrastructure) appears to be 'falling apart' or being abandoned, weight Tainter's 1988 structural reframing: complex societies are PROBLEM-SOLVING ORGANIZATIONS that respond to challenges by adding sociopolitical complexity (bureaucracy, specialization, hierarchy, infrastructure, control mechanisms). Each new layer of complexity costs energy and resources but initially yields net benefits — solving the problem it was added to address. Tainter's vital observation: investment in complexity follows a MARGINAL-RETURNS curve. After a certain point, additional complexity yields decreasing marginal benefits while marginal costs rise. Once the benefit/investment ratio crosses the threshold, complexity becomes a WORSE strategy than the simpler alternative. Transferable consequence: collapse is often the RATIONAL outcome — when investing in further complexity costs more than it yields, the system (or its components) defects to a simpler organization. This reframes collapse from 'catastrophe' to 'corrective devolution.' Operational diagnostic: when evaluating an institution, ask (1) what complexity has been accumulated, (2) what problems each layer originally solved, (3) what is the current marginal cost of that complexity, (4) what is the marginal return. When 3 > 4, expect either collapse or schism. Empirical applications across Roman Empire, Maya, Chacoan, Hittite, plus modern bureaucracy / R&D / health-care / education systems where marginal returns are documented as declining. Distinct from Diamond's environmental-collapse thesis — Tainter explicitly argues collapse is usually an ECONOMIC-RATIONAL response, not environmental failure. Transferable beyond civilizations: technical-debt in software systems, regulatory capture, scientific bureaucracies, corporate org-chart bloat — all exhibit the same diminishing-marginal-returns dynamic. The atom carries an important caveat: 'collapse' in Tainter's frame is not necessarily violent or sudden — it is sustained reduction in complexity that can take centuries (Western Roman provinces gradually shedding imperial overhead) or happen in years (Soviet collapse). Pairs with the substrate's existing collapse cluster (Turchin secular cycles, Skocpol revolutions, Acemoglu institutional extraction) as the missing rational-economic side."
