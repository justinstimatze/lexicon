id: lex-hm8yx
name: scale-separation
type-in: state
type-out: composition
_tier: atomic
agent-instruction: "When a system has phenomena at multiple scales, separate them: the fast variables average out against the slow ones. Scale-separation is the precondition for tractable analysis; conflating scales produces phantom dependencies."
related: [lex-33w6z, lex-4697f, lex-4yhqs, lex-7aqqb, lex-aefph, lex-aufzn, lex-b9us2, lex-chp44, lex-fsazx, lex-jue9r, lex-kxk99, lex-mrhyp, lex-mx4q5, lex-n9ugb, lex-pbpbj, lex-pn7cf, lex-qhrpv, lex-sjsxx, lex-spk4s]
evokes: [different-scales-decouple, separate-the-fast-from-the-slow, layered-treatment, micro-vs-macro, renormalization-flavor]
lineage:
  - source: practitioner
    text: kadanoff-wilson-renormalization-group
    citation: "Wilson's renormalization group (Phys. Rev. B 4, 3174 (1971)) and Kadanoff's earlier block-spin construction — the methodological discipline of identifying which degrees of freedom matter at each scale and integrating out the rest. Built on the older physics tradition of separating timescales (adiabatic approximation, Born-Oppenheimer, etc.)"
  - source: practitioner
    text: dijkstra-1968-go-to-considered-harmful
    citation: "Dijkstra's argument for layered architecture and structured programming: at each layer, lower-layer details are abstracted away so the upper layer can be reasoned about independently. THE software analogue of physics scale-separation"
  - source: practitioner
    text: physics-decomposition-pass
    citation: "promoted from cross-attestation: physics (renormalization group, Born-Oppenheimer, kinetic-vs-thermodynamic), CS (layered architecture, network protocol stacks, language-level abstractions), biology (cell ↔ tissue ↔ organ ↔ organism ↔ ecosystem — each scale exhibits emergent properties absent at smaller scales), economics (microeconomics ↔ macroeconomics; firm vs sector vs economy), neuroscience (neuron ↔ circuit ↔ system ↔ behavior)"
canonical-instances:
  - "Born-Oppenheimer approximation: nuclei move so much slower than electrons that you can treat the electronic problem at fixed nuclear positions, then handle nuclear dynamics on the resulting potential energy surface. The two timescales decouple"
  - "TCP/IP stack: the application layer doesn't think about Ethernet frames; the network layer doesn't think about HTTP semantics. Each layer's contract decouples it from layers above and below"
  - "biological scales: a cardiologist studies the heart at the organ scale; the heart's cells follow microbiology; the cells are made of biochemistry; biochemistry rests on quantum chemistry. Each scale has its own working vocabulary that mostly ignores lower-scale detail (the lex-4yhqs coarse-graining + lex-chp44 meta-pointer pair)"
  - "operationally distinct from lex-4yhqs coarse-graining: coarse-graining is the lossy compression that ENABLES separation (you can only treat scales independently because the cross-scale coupling is small enough to neglect or to handle perturbatively); scale-separation is the FACT that this works for many physical systems and the methodological choice to exploit it"
  - "when scale-separation FAILS — turbulence, critical phenomena at phase transitions, small-world networks — the methodology breaks down and you need different tools (renormalization group; multi-scale simulation; effective field theory)"
critical-questions:
  - "the cross-scale-coupling magnitude test: how small are the cross-scale couplings, and does that smallness hold across the regime of interest? Scale-separation works when couplings are small ENOUGH that they can be ignored or handled perturbatively. At critical points (phase transitions, turbulence) the couplings become non-perturbative and the methodology fails. Practitioner-discipline: name the cross-scale coupling and verify it stays small over the problem's parameter range"
  - "the timescale-separation specifically: when scale-separation is timescale-separation (Born-Oppenheimer; adiabatic), what's the ratio of slow/fast timescales, and is it large enough? Ratios below ~10 typically don't justify decoupling; ratios above ~100 are safe. Practitioner-question: name the slow and fast timescales explicitly, compute the ratio, justify the decoupling choice"
  - "the layer-leak detection: in software / engineering applications, when does a higher layer 'see' lower-layer details (the abstraction leaks)? Joel Spolsky's 'all non-trivial abstractions, to some degree, are leaky.' Practitioner-discipline: catalog the known leaks rather than pretending the layer is opaque; the leaks are where bugs live"
  - "the failure-mode catalog: scale-separation reliably fails at (a) critical phenomena / phase transitions; (b) turbulent or chaotic regimes; (c) small-world / scale-free networks where 'scales' aren't crisply defined; (d) far-from-equilibrium systems with persistent driving. Practitioner-question: does the system at hand fall into any of these categories? If yes, scale-separation is the wrong methodology"
status: active
