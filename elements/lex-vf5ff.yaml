lineage:
  - source: primary
    text: sclar-2019-auto-repair-for-dummies
    citation: "Deanna Sclar, Auto Repair For Dummies, 2nd Edition (John Wiley & Sons, 2019), Chapter 12 ('Keeping Your Car from Getting Heartburn'), section 'Dealing with a Chronic Hothead.'"
    quote: "'When I bought Tweety Bird, my first car, she sang when I shut off the engine! Her mysterious behavior was eliminated by a new pressure cap. Although I paid for some unnecessary (and unsuccessful) repairs before it occurred to me to ask the shop to test the cap, I was luckier than someone I met who paid big bucks for radiator rebuilding and a new water pump before discovering that all he needed was a cap that cost less than $10! Lesson learned: Professionals sometimes try the more profitable solutions first. Do-it-yourselfers try the cheapest solution first.'"
canonical-instances:
  - "A patient with a vague symptom is offered an expensive specialist procedure before anyone has ruled out a cheap, common cause (dehydration, a medication side effect, poor sleep). Asking 'has the cheap explanation been excluded yet?' before consenting to the expensive workup applies the same ordering discipline to a diagnosing party (the specialist) whose income scales with the procedure, not with correctly identifying a boring cause."
  - "An IT contractor recommends replacing an entire server before checking whether a loose cable or a full disk explains the outage. The user who insists 'unplug and replug the cable first' is applying the same cost-ordered diagnostic discipline as Sclar's do-it-yourselfer, independent of whether the contractor is acting in bad faith or just defaulting to the more familiar, more billable fix."
  - "Operationally distinct from lex-sgd2s prefer-the-explanation-with-fewest-assumptions: Occam's razor selects among competing EXPLANATIONS by parsimony as a belief-prior. This atom sequences the ACTIONS taken to investigate a problem by cost, deciding what to authorize or test in what order. It also weighs something Occam's razor has no slot for: the diagnosing party's profit motive, which scales with the size of the repair rather than with how well the explanation actually fits."
  - "Operationally distinct from lex-c2bwy hanlons-razor: Hanlon's razor chooses between two READINGS of a past action (malice vs incompetence) after the fact. This atom is prospective and operational -- it governs which diagnostic step to pay for next, before the cause is known at all, and turns on cost-ordering rather than on ruling out a specific uncharitable interpretation."
  - "Operationally distinct from lex-28s3q interrupting-a-costly-decision-by-asking-if-a-disinterested-authority-was-consulted: that atom's remedy is to bring in a THIRD PARTY with no stake in the outcome. This atom doesn't require finding anyone disinterested -- the remedy is procedural (test cheap-to-expensive, in that order) and can be applied by the payer alone, even when no disinterested authority is available to consult."
critical-questions:
  - "How do you tell 'the shop proposed the expensive fix first because it's more profitable' from 'the shop proposed the expensive fix first because the symptoms genuinely point there and the cheap cause was already obviously absent'? Applying this reflexively to every diagnosis as accusation, rather than as a checklist item ('was the cheap cause tested?'), risks treating every professional recommendation as bad faith when sometimes the expensive cause really is diagnosable on sight."
  - "Does the cost-ordering actually cost less in the end? If the cheap test itself has a real cost (a specialist's time, a diagnostic teardown that must be reassembled either way), sequential elimination isn't free, and testing everything cheap-to-expensive can end up costing more in aggregate labor than going straight to a well-targeted expensive diagnostic that rules out several causes at once."
  - "What happens when delay itself is dangerous? Sequential cheap-to-expensive testing assumes there's time to iterate. Where the failure is safety-critical -- a brake system rather than a cooling system -- the discipline can be overridden by the cost of being wrong slowly; Sclar's own book elsewhere tells readers not to defer brake work to save money."
status: active
