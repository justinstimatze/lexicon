lineage:
  - source: primary
    text: radin-trickster-bluffs-a-scenting-contest-against-the-coyote-and-gets-lucky
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 40. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Little brother, they say you have a keen scent. So at least you always gave yourself out to have. Let us play keenscenter. ... I, too am a keen-scenter. Let us try, therefore, to scent and see where the nearest people live.' ... Trickster, of course, was unable to scent anything. His plan was to behave as though he could and watch what coyote would do. He therefore went over to a certain place and then stopped for some time. ... 'He must be scenting something,' thought the coyote. Now Trickster spoke, 'My little brother, near the timber over there some people are living. You see, my little brother, you cannot scent as well as I can.' All this time, of course, he had not scented anything."
canonical-instances:
  - "A new hire with no real expertise in a technical area confidently walks to a whiteboard and starts sketching a solution with total certainty, causing a genuinely skilled colleague to second-guess their own competing approach, and when the confidently-sketched idea happens to work by luck, the new hire's bluff gets remembered as insight rather than a guess that paid off."
  - "An amateur investor loudly and confidently picks a stock with no real analysis behind the choice, unsettling a more cautious professional who has actual data suggesting otherwise, and when the stock happens to rise for unrelated market reasons, the amateur's confidence gets credited as skill rather than correctly identified as a lucky guess."
critical-questions:
  - "Would the coyote have caught the bluff if Trickster's confident performance had been tested immediately, for instance by asking him to describe specifically what he smelled, rather than simply observing his behavior from a distance?"
  - "Does the coincidental accuracy of the bluff, a real village actually being where Trickster stopped, change anything about how risky or reckless the original bluff was, given that Trickster had no way of knowing in advance it would pay off?"
  - "Is the coyote's doubt in this moment a failure of his own judgment specifically, or is it a more general vulnerability that any real expert has when confronted with someone else's unearned confidence -- does having genuine skill actually protect against this kind of doubt at all?"
