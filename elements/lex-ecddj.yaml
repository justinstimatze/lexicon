lineage:
  - source: primary
    text: eastman-frogs-crane-boasting-broadcasts-location
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Second Evening: The Frogs and the Crane.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Kerrump! kerrump! I'm chief of this pond!' ... The Crane went round the pond without making any noise, and pounced upon the second Frog, who was sitting up in plain sight, swelling his chest with pride, for he really thought now that he was the sole chief of the pond. ... So the second Frog got away too; but he was so dreadfully frightened that he never spoke again. ... It is not a wise thing to boast too loudly."
canonical-instances:
  - "An employee under an actively hostile manager who is looking for a reason to fire someone keeps publicly taking credit for team wins in meetings, and survives several rounds of layoffs purely because the manager happened to be distracted by other crises each time -- not because the credit-claiming was ever actually safe, and the next repetition carries exactly the same risk as the first."
  - "A small business repeatedly announces on social media exactly how much revenue it's making in a niche a much larger, predatory competitor is actively scouting for acquisition targets, and survives several rounds of the competitor's attention shifting elsewhere by pure coincidence, while treating each near-miss as proof the announcements are harmless rather than as evidence the exact same danger is still live."
critical-questions:
  - "how does someone actually distinguish 'I survived by luck' from 'I survived because the behavior wasn't actually that risky,' especially without a narrator explicitly stating the mechanism the way this story does -- is this distinction even knowable from inside the situation in real time?"
  - "does treating every claim to status or credit as equally dangerous overcorrect into permanent silence, costing real, legitimate opportunities to be recognized, when only situations with an actively hunting threat actually carry this specific risk?"
  - "why does correctly identifying the danger require nearly being killed first -- is there a way to learn this lesson from watching others' near-misses, or does the story suggest that only direct, personal brushes with disaster actually produce lasting behavioral change?"
