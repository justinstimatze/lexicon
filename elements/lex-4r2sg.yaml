id: lex-4r2sg
name: testability-not-origin-determines-scientific-status
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When someone dismisses a theory as unscientific because of HOW it was reached -- pure speculation, a hunch, an act of intuition, rather than careful induction from data -- check whether that objection is actually targeting the theory's origin rather than its testability, because Popper argues those are different questions with different answers. Popper, defending Anaximander's wholly speculative theory of the earth's suspension in space against the objection that philosophy is 'speculative' while science is 'observational': 'This reply, of course, amounts to the thesis that, by definition, theories are (or are not) scientific according to their origin in observations, or in so-called \"inductive procedures\". Yet I believe that few, if any, physical theories would fall under this definition. And I do not see why the question of origin should be important in this connection. What is important about a theory is its explanatory power, and whether it stands up to criticism and to tests. The question of its origin, of how it is arrived at -- whether by an \"inductive procedure\", as some say, or by an act of intuition -- may be extremely interesting, especially for the biographer of the man who invented the theory, but it has little to do with its scientific status or character.' A theory born from zero observation and pure armchair reasoning is exactly as scientific as one someone claims to have induced carefully from data, provided both are equally exposed to critical testing -- and a theory that came from meticulous data-gathering is not thereby more scientific if it can't be tested. Diagnostic move: when a theory's scientific credentials are challenged, separate the question 'how was this arrived at?' from 'can this be tested and does it survive testing?' -- only the second question, per [[lex-vmas8]], settles scientific status; the first is biography."
