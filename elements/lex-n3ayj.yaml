id: lex-n3ayj
name: refuse-to-fill-evidence-gaps-with-untested-speculation
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When evidence runs out, refuse to fill gaps with untested speculation — treat the gap as a gap. The temptation to elaborate beyond evidence is strong because it FEELS like understanding. The discipline: name what you don't know and stop."
related: [lex-2vpet, lex-39muf, lex-6wsw2, lex-gfb9k, lex-nn3u9, lex-pp9c8, lex-qqgm5, lex-rktsy, lex-rzgzr, lex-s22hf, lex-smney, lex-vk65z]
scaffolds-from: [lex-39muf, lex-rktsy, lex-s22hf]
evokes: [hypotheses-non-fingo, I-frame-no-hypotheses, it-is-enough-the-law-works, experimental-philosophy-discipline, refuse-to-speculate-beyond-evidence, claim-discipline, stop-at-the-edge-of-deduction, decline-the-mechanism-question-when-the-law-suffices, evidence-bounded-inference, Newton-General-Scholium]
lineage:
  - source: primary
    text: newton-1687-general-scholium-hypotheses-non-fingo
    citation: "Isaac Newton, Philosophiae Naturalis Principia Mathematica (1687), Book III, General Scholium (added to the 2nd edition 1713). Cited from the Andrew Motte 1729 English translation, Project Gutenberg #76404 . The famous 'hypotheses non fingo' passage establishes a methodological-discipline that complements but is distinct from Rule II of Reasoning in Philosophy (lex-s22hf). Where Rule II ENABLES inferring single-cause from cross-domain effect-similarity, the General Scholium DISCIPLINES that inference by refusing to extend it beyond what observation supports. Newton, having derived the inverse-square gravitational law and demonstrated its universal applicability across terrestrial and celestial domains, REFUSES to speculate about the underlying cause of gravity itself: 'But hitherto I have not been able to discover the cause of those properties of gravity from phænomena, and I frame no hypotheses.' Newton's restricted definition of 'hypothesis': anything NOT DEDUCED FROM PHENOMENA. Such hypotheses have 'no place in experimental philosophy.' The methodological move: science's claim-set is restricted to (phenomenologically-grounded laws + their inductive extensions); speculation about unobservable underlying mechanism is OUT OF BOUNDS until evidence reaches it. Newton's closing summary: 'And to us it is enough that gravity does really exist, and act according to the laws which we have explained, and abundantly serves to account for all the motions of the celestial bodies, and of our sea.' The 'it is enough' clause is the substrate-primitive: predictive-and-explanatory adequacy of a law is SUFFICIENT for science even without a discovered mechanism; mechanism-speculation is positively discouraged. Distinct from lex-vk65z (convergent-evidence ACCEPTS claims under partial evidence) — Newton's General Scholium REFUSES extensions beyond what evidence supports. PD globally; Motte 1729 translation PD."
    quote: "[Newton 1687 General Scholium, Motte 1729 p.506-507, the locus classicus]: 'But hitherto I have not been able to discover the cause of those properties of gravity from phænomena, and I frame no hypotheses; for whatever is not deduced from the phænomena is to be called an hypothesis; and hypotheses, whether metaphysical or physical, whether of occult qualities or mechanical, have no place in experimental philosophy. In this philosophy particular propositions are inferred from the phænomena, and afterwards rendered general by induction. Thus it was that the impenetrability, the mobility, and the impulsive force of bodies, and the laws of motion and of gravitation, were discovered. And to us it is enough that gravity does really exist, and act according to the laws which we have explained, and abundantly serves to account for all the motions of the celestial bodies, and of our sea.' [Newton 1687 General Scholium p.507, the final speculative-restraint exemplar where Newton ADMITS he could speculate further but pointedly declines]: 'And now we might add something concerning a certain most subtle Spirit which pervades and lies hid in all gross bodies ... But these are things that cannot be explained in few words, nor are we furnished with that sufficiency of experiments which is required to an accurate determination and demonstration of the laws by which this electric and elastic Spirit operates.'"
  - source: practitioner
    text: hume-1748-enquiry-on-causation-restraint
    citation: "David Hume, An Enquiry Concerning Human Understanding (1748), Sections IV-VII on causation and the limits of inductive knowledge. Hume's argument complements Newton's General Scholium from the philosophical side: Hume argues that 'cause' is not directly observable, only CONSTANT CONJUNCTION of events. Inferences beyond observed-conjunction to underlying-necessity are unwarranted (lex-rktsy). Hume's epistemological-modesty is the philosophical articulation of what Newton practiced methodologically. Newton (a generation prior) says: I will not speculate about the cause of gravity. Hume (a generation later) provides the philosophical argument for why such speculation is unwarranted: causation-as-observed is constant-conjunction; anything beyond that is metaphysical addition without evidential support. Together Newton's practice + Hume's philosophy define modern empirical-discipline. Hume 1748 PD. (Hume Enquiry as lex-39muf/0222 source.)"
    quote: "[Hume 1748 Enquiry §VII paraphrase via lex-rktsy lineage]: '[We see only constant conjunction of events. The idea of necessary connection is mind-supplied, not evidence-given. Inferences beyond constant-conjunction to necessary-causation lack inductive warrant.]'"
  - source: practitioner
    text: wittgenstein-1922-tractatus-7
    citation: "Ludwig Wittgenstein, Tractatus Logico-Philosophicus, trans. C. K. Ogden (Kegan Paul, Trench, Trubner 1922), proposition 7: 'Wovon man nicht sprechen kann, darüber muss man schweigen' — 'Whereof one cannot speak, thereof one must be silent.' Ogden is the edition quoted throughout; the more familiar 'What we cannot speak about we must pass over in silence' is Pears and McGuinness 1961 and the two do not mix. The Tractatus's closing proposition is a 20th-century articulation of the same epistemic-restraint Newton practiced in 1687. Wittgenstein's claim is broader (the unsayable is broader than the unsupported-by-evidence) but the shared methodological-move is REFUSAL to extend claim-making beyond legitimate ground. The lex-qqgm5 atom captures Wittgenstein's specific showing-vs-saying distinction; lex-n3ayj captures the prior more general restraint-discipline. Wittgenstein 1922 TLP PD. (Project Gutenberg has TLP.)"
    quote: "[Wittgenstein 1922 TLP §7]: 'Whereof one cannot speak, thereof one must be silent.' [Wittgenstein 1922 TLP §6.53 explanatory complement]: 'The right method of philosophy would be this. To say nothing except what can be said, i.e. the propositions of natural science, i.e. something that has nothing to do with philosophy: and then always, when someone else wished to say something metaphysical, to demonstrate to him that he had given no meaning to certain signs in his propositions.'"
  - source: practitioner
    text: keynes-1936-radical-uncertainty
    citation: "John Maynard Keynes, The General Theory of Employment, Interest, and Money (1936), and his earlier A Treatise on Probability (1921). Keynes articulates a related claim-discipline in economics: when long-term consequences cannot be calculated from available evidence (RADICAL UNCERTAINTY, distinct from probabilistic risk), economic agents and policymakers should not pretend the calculation has been done. 'We simply do not know.' This is the Newton-General-Scholium move applied to economic forecasting: when the law (or the model) does not extend reliably to a domain (long-run macroeconomic forecasting), the disciplined response is to acknowledge the limit, not to manufacture pseudo-precision. Cited via standard economics history. In-copyright; PD in Australia."
    quote: "[Keynes 1937 'The General Theory of Employment' (Quarterly Journal of Economics) Feb 1937 paraphrase]: '[About long-term consequences (the rate of interest twenty years hence, the obsolescence of a new invention, the position of private wealth-owners in 1970), there is no scientific basis on which to form any calculable probability whatever. We simply do not know.]' [Keynes via standard summary]: '[It is better to be roughly right than precisely wrong.]'"
canonical-instances:
  - "Newton's gravity-mechanism refusal (Principia General Scholium 1713 edition): Having derived F = G·m₁·m₂/r² and demonstrated its universal applicability across terrestrial and celestial domains, Newton REFUSES to answer 'what IS gravity?' He acknowledges he cannot find the cause of gravity's properties from phenomena, and explicitly declines to 'frame hypotheses.' Modern physics took the question seriously again with Einstein 1915 (general relativity: gravity is geometric curvature of spacetime), but Newton's refusal-to-speculate-without-evidence held for ~230 years between the 1687 Principia and the 1915 GR. Many post-Newtonian natural philosophers (e.g., Berkeley, Leibniz) attacked Newton for invoking 'occult quality' or 'action at a distance' precisely because Newton refused to provide a mechanism; Newton's reply: it is enough that the law works."
  - "Wittgenstein TLP 7 silence (1922): 'Whereof one cannot speak, thereof one must be silent.' The closing proposition of the Tractatus enacts the epistemic-restraint that the rest of the book argues for: there are domains (ethics, aesthetics, the metaphysical) where propositions cannot be legitimately formed, and the correct response is silence rather than ill-formed assertion. The methodological-move is the same as Newton's General Scholium: claim-making must respect its legitimate limits; extension beyond is positively discouraged."
  - "Keynes 1937 'we simply do not know': In Keynes's reply to critics of the General Theory, he distinguishes calculable risk (where probability-distributions are knowable) from radical uncertainty (where they are not). For radical-uncertainty questions, the disciplined economic-actor and policymaker refuses to manufacture probabilistic forecasts and instead acts on conventions, animal spirits, or rules-of-thumb. The discipline: do not pretend the calculation has been done when it cannot be. Modern parallels: Knightian uncertainty (Frank Knight 1921), Taleb's black swan (2007), risk-vs-uncertainty distinction in decision theory."
  - "Medical 'first, do no harm' (primum non nocere): when the mechanism of a disease is not yet known, the physician's disciplined response is NOT to invent a speculative mechanism and treat aggressively — it is to limit interventions to those whose effects are empirically observed. Newton's hypotheses-non-fingo applied to medicine: it is enough that bed-rest + hydration + symptomatic relief support recovery, even if we don't know what the disease IS. The opposite-pole (humoral-medicine speculative-mechanism-treatment based on imbalance-of-bile-and-phlegm) caused enormous iatrogenic harm precisely because mechanism-speculation drove treatment beyond what evidence supported."
  - "Software-engineering disciplined-unknown: when debugging an issue with no clear root-cause signal, the disciplined response is to RESTRICT claim-making to observed symptoms (the test failed, the latency spiked, the error log shows X), rather than speculating ungrounded about root cause ('this must be a race condition; let's add locks'). lex-n3ayj applied to debugging: don't claim the cause; observe more; reproduce the failure; bound the search-space; only then attribute. Mechanism-speculation premature-to-evidence is a debugging anti-pattern."
  - "Climate-attribution science: IPCC reports carefully distinguish (a) attribution of warming to anthropogenic CO₂ (high confidence, multiple converging evidence streams) from (b) attribution of specific individual weather events to climate change (lower confidence; framed as probabilistic shifts rather than deterministic causation). The discipline: claim only what evidence supports; even when politically inconvenient to leave gaps, refuse to fill them with speculation. Newton's hypotheses-non-fingo applied to attribution-science."
  - "operationally distinct from lex-vk65z convergent-independent-evidence-streams-warrant-claim-acceptance-even-without-complete-mechanism: lex-vk65z is the ACCEPTANCE side — when evidence converges from multiple independent streams, you CAN accept the claim even without complete mechanism. lex-n3ayj is the REFUSAL side — when evidence DOESN'T reach the mechanism (or any other claim), you SHOULD NOT manufacture speculation to fill the gap. The two compose: lex-vk65z says 'accept the law from convergent evidence,' lex-n3ayj says 'don't extend beyond that.' Both are aspects of evidence-disciplined claim-making; lex-vk65z is permissive-under-warrant, lex-n3ayj is restrictive-without-warrant."
  - "operationally distinct from lex-gfb9k via-negativa: lex-gfb9k (Taleb-Popper) is about KNOWLEDGE GROWING BY SUBTRACTION — falsification, design-by-removal, the asymmetry between disconfirmation and confirmation. lex-n3ayj (Newton) is about CLAIM-DISCIPLINE — refusing to add claims that lack evidential support. Both are subtractive-epistemology cousins, but lex-gfb9k is about REMOVING from existing knowledge (falsify, retract); lex-n3ayj is about NOT-ADDING speculation in the first place. The discipline-direction is different: lex-gfb9k prunes accumulated knowledge; lex-n3ayj prevents accumulation of unwarranted-claims."
  - "operationally distinct from lex-qqgm5 showing-vs-saying-some-things-cannot-be-said-only-shown: lex-qqgm5 is Wittgenstein's specific claim that some content can be SHOWN but not SAID (ethics, aesthetics, logical-form of propositions). lex-n3ayj is the more general restraint-discipline: claim-making must respect evidential limits. lex-qqgm5 is one application of lex-n3ayj (in domains where evidence is structurally unavailable) but lex-n3ayj is broader (any domain where evidence runs out, including domains where evidence is in principle available but not yet acquired)."
critical-questions:
  - "is the 'evidence-gap' genuine or just unacknowledged-evidence? Sometimes apparent evidence-gaps are due to the analyst not having looked hard enough for evidence; sometimes they are genuine (the question hasn't been empirically addressed). Discriminator: before invoking lex-n3ayj, exhaust the available-evidence search — has the literature been read? Have direct-observation tools been used? Have analogous-domain evidence been considered? lex-n3ayj fires AFTER honest evidence-search exhausts, not BEFORE."
  - "is the proposed speculation actually UNTESTED, or is it just untested IN THIS CASE? A hypothesis-form can be untested in the current case but extensively tested in analogous cases; in such cases the hypothesis can be reasonably-extended even if not directly-verified in the current case (this is what lex-s22hf enables: cross-domain unification warrants extending tested laws to new cases). Discriminator: distinguish 'no evidence whatsoever' from 'no direct evidence but strong analog-evidence.' lex-n3ayj applies strictly to the former; lex-s22hf enables the latter."
  - "what's the cost of CLAIM-RESTRAINT vs the cost of CLAIM-OVEREXTENSION? In some domains, holding back claims is costly (policy decisions need to be made under uncertainty; medicine sometimes requires intervention before mechanism is known). Discriminator: identify the asymmetric cost. If claim-overextension causes large harm (iatrogenic medicine, premature regulation), lean toward lex-n3ayj restraint. If claim-restraint causes inaction-harm (refusing to act on climate change because mechanism details are unclear), the lex-vk65z side may dominate. Newton's stance was: when in scientific-claim-making, lean toward restraint; when in policy-action under uncertainty, the calculus may differ."
  - "is the analyst confusing METHODOLOGICAL RESTRAINT (lex-n3ayj) with ONTOLOGICAL INSTRUMENTALISM? Newton was NOT saying gravity is a convenient fiction (instrumentalism). He was saying: I won't speculate about the underlying-cause of a real-and-observed phenomenon. The distinction matters because instrumentalism makes ontology-claims (laws are not real-things, just useful-formalisms), while lex-n3ayj just makes claim-discipline claims (don't extend beyond evidence). Discriminator: when applying lex-n3ayj, distinguish 'I don't yet know the mechanism' from 'there is no mechanism.' lex-n3ayj is the first move, not the second."
  - "are there domains where lex-n3ayj fails as guidance? Yes — domains where the only way to PROGRESS is to speculate beyond evidence, then test. Most foundational scientific discoveries violated the strict-lex-n3ayj discipline (Einstein's GR was bold-speculation grounded in tiny anomalies; Darwin's natural-selection was a bold-mechanism-hypothesis before genetic mechanism was discovered). lex-n3ayj applies most strongly to CLAIM-MAKING discipline (don't ASSERT what you can't ground); it applies less strongly to HYPOTHESIS-GENERATION (where bold speculation is methodologically necessary). Discriminator: distinguish hypothesis-formation (lex-n3ayj doesn't restrict) from claim-assertion (lex-n3ayj strictly restricts)."
  - "what's the practitioner-actionable upshot? For scientific-research: in conclusion-sections, restrict claims to what evidence supports; flag speculative extensions explicitly as 'we hypothesize' rather than 'we show.' For debugging: don't claim root-cause until evidence localizes it; bound search-space rather than guess. For organizational diagnosis: when a problem's cause isn't clear, resist the urge to manufacture a story; instead, gather more data. For decision-making under uncertainty: distinguish what you KNOW from what you GUESS; act on the known with appropriate uncertainty-margin on the guess. For substrate-mining (the lex itself): when a candidate-atom requires speculative-extension to be substrate-novel, prefer no-mint over over-claimed atom. lex-n3ayj is the substrate-discipline complement to Principle 9 rubric: when in doubt, don't mint."
status: active
