id: lex-q3pfh
name: a-metaphors-productive-range-is-limited-to-recognized-source-categories
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a generative metaphor maps one domain onto another, don't assume it can produce any combination you can imagine -- check what's already a recognized category in the source domain first. Lakoff's Moral Order metaphor maps 'A has dominance over B' from the domain of worldly power onto 'A has moral authority over B' in the domain of morality. Which A/B pairs the metaphor can actually produce is fixed by which dominance relations the culture's folk model of worldly power already recognizes as real: 'men have dominance over women' and 'whites have dominance over nonwhites' are recognized dominance categories in the culture Lakoff is describing, so the metaphor can generate 'men have moral authority over women' and a racist Moral Order. Cinnamon-preference was never recognized this way. No folk model ranks cinnamon-dislikers above cinnamon-likers, so the metaphor has nothing available to convert into a cinnamon-based moral authority, however logically well-formed that output would look on paper. The metaphor is productive, but its productivity is bounded by what already counts as a dominance category rather than by what's merely conceivable. Diagnostic move: to find out whether a metaphor system will ever generate a given output, check first whether the source-domain input the output would require is already a recognized category -- if the input has no cultural reality, the output has no route into existence regardless of the metaphor's internal logic."
related: []
evokes: [george-lakoff, moral-politics-1996, moral-order-metaphor, generic-is-specific, cinnamon-example]
lineage:
  - source: primary
    text: lakoff-1996-cinnamon-non-dominance-category
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 5 'Strict Father Morality,' section 'THE MORAL ORDER.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“It is important to note that this parameter of variation is highly constrained. There are not all that many general dominance clauses that are taken to be true in our folk models of the domain of worldly power. Consider a somewhat silly example of what cannot be a dominance clause mapped onto the moral domain. We have no general cultural folk model in which people who dislike cinnamon have worldly dominance over people who like cinnamon. Thus, there cannot be a variant of the Moral Order metaphor that produces ‘People who dislike cinnamon have moral authority over people who like cinnamon.’ Cinnamon does not happen to be what cultural dominance is about in our culture, and so it cannot be a distinct determinant of moral authority.”"
  - source: primary
    text: lakoff-1996-racist-version-of-moral-order
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 5 'Strict Father Morality,' section 'THE MORAL ORDER.'"
    quote: "“Take another example. Suppose one took the dominance clause ‘Whites have dominance over nonwhites’ from the domain of worldly power and mapped it onto ‘Whites have moral authority over nonwhites.’ This would yield a racist version of Strict Father morality, which might not apply within an all-white family, but would apply as a ‘moral’ principle to society in general.”"
canonical-instances:
  - "The direct textual anchor is the lineage quotes themselves: the same metaphor mechanism yields a racist Moral Order from a real folk-recognized dominance clause (whites over nonwhites) and yields nothing at all from an invented one (cinnamon-dislikers over cinnamon-likers), because only the first input already exists as a cultural dominance category."
  - "Hypothetical: a corporate culture builds an internal status hierarchy on 'tenure equals wisdom equals authority,' since seniority is a recognized dominance axis in that industry. No comparable internal hierarchy ever emerges ranking employees by handedness, even though left-handed and right-handed employees differ in some measurable way, because handedness was never a recognized axis of workplace dominance to begin with -- the metaphor that turns organizational hierarchy into moral deference has no cultural raw material to build a handedness-based version from."
critical-questions:
  - "New dominance categories clearly emerge over historical time -- disability status, sexual orientation, and national origin have all become live axes of contested moral hierarchy that weren't always recognized as such. Does Lakoff's constraint only describe the current inventory of recognized categories, or does it also explain how a wholly new category gets promoted into that inventory to begin with?"
  - "The claim requires a shared cultural folk model of what counts as a real dominance relation. Different subcultures within the same society don't always share one -- age carries real authority weight in some communities, religious standing in others. Whose folk model determines what the metaphor can produce when the wider society has no single shared model at all?"
status: active
