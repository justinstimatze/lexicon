id: lex-7jt5z
name: trust-by-surface-category-fails-where-track-record-would-hold
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When deciding who to trust with something valuable, weight demonstrated track record over surface category — professional, credentialed, familiar-looking — since the category itself carries no guarantee. The Panchatantra's Brahman, rescued from a well by a tiger, a monkey, a snake, and a man, trusts the human goldsmith completely as a fellow civilized professional while the animals who actually risked themselves for him are treated as the doubtful parties. The goldsmith, the instant personal advantage appears, betrays him without hesitation: 'Now the goldsmith thought when he saw it: I worked this gold for the prince. And having made sure of the fact, he said: Please stay right here, while I show it to somebody. With this he went to court and showed it to the king.' The animals, categorized as dangerous, keep every commitment they made; the human, categorized as safe, breaks his the moment it becomes profitable."
related: []
evokes: [panchatantra, loss-of-friends, trust-by-category-fails-where-track-record-holds, credentialed-does-not-mean-trustworthy]
lineage:
  - source: primary
    text: panchatantra-ryder1925-the-goldsmiths-betrayal
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book I, resolution of the man-in-the-well frame story. Verified verbatim against a direct extraction of the held copy."
    quote: "Now the goldsmith thought when he saw it: “I worked this gold for the prince.” And having made sure of the fact, he said: “Please stay right here, while I show it to somebody.” With this he went to court and showed it to the king."
canonical-instances:
  - "a homeowner hires a licensed, well-reviewed contractor over a recommended handyman with no formal credentials, reasoning the license itself is the safeguard, and the licensed contractor is the one who disappears with a deposit — the credential predicted nothing about this specific person's conduct."
critical-questions:
  - "When no track record is available at all, is category the only proxy left to reason from? The fable's own case has a track record on offer — the animals' actual conduct — that the Brahman simply ignores in favor of category."
  - "Does the Brahman actually have a better option available in the moment — is there a way to assess trustworthiness that doesn't default to either category or an as-yet-unformed track record, given he'd just met all four rescuers?"
status: active
