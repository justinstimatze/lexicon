name: real-free-choice-between-societies-is-a-natural-experiment-armchairs-cant-match
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a theorist claims people would obviously prefer one kind of society over another, check whether anyone has ever actually gotten to make that choice freely, with full experience of both sides, and see what they did. Graeber and Wengrow's case against Steven Pinker's claim that anyone would 'leap for safety' from tribal life into Western civilization: colonial North America produced exactly this natural experiment, repeatedly. Colonists captured or adopted by indigenous societies were, on later contact with European society, given the choice of where to stay -- and overwhelmingly chose to remain with or return to their indigenous communities, even when it meant giving up wealth and a comfortable estate. Indigenous people incorporated into European society, given the same choice in reverse, almost always went the other way, escaping back at the first opportunity. A revealed preference from people who actually lived both options beats a theorist's confident prediction about what people would prefer, every time the two disagree -- and the burden shifts onto the theory to explain the mismatch, not onto the natural experiment to defer to the theory."
