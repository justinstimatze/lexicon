canonical-instances:
  - "Two competing firms each have the opportunity to acquire one of two struggling rivals -- a small, easily absorbed niche player, or a larger, harder-to-integrate competitor that is currently distracted by its own internal restructuring -- and the firm that takes on the harder acquisition ends up structurally stronger a few years later, having removed the one rival that could have become a real threat, while the firm that took the easy target still has to deal with the larger rival eventually, on worse terms."
  - "A manager with limited bandwidth to fix one of two broken processes chooses to tackle the more complex, politically thorny one first rather than the quick, easy fix, reasoning that the complex process is the one that will keep generating costly failures indefinitely if left alone, while the easy fix would have solved itself eventually with much less effort."
critical-questions:
  - "how does an actor reliably estimate the future cost of a threat left unaddressed, given that the whole argument for taking the harder target depends on that future cost being larger than the current cost difference between the two options -- without a real forecast, is this just a rationalization for taking on unnecessary difficulty?"
  - "does this reasoning ignore the risk that taking on the harder target could fail outright, leaving you weakened while your rival, having taken the easy win, is now in a stronger relative position regardless of the deferred threat -- does the logic assume success is guaranteed once a fight is engaged?"
  - "is there a threshold past which a threat is so much harder to eliminate that the attempt itself, even if it fails only partially, costs more than simply living with the standing threat indefinitely -- does the framework distinguish 'harder but worth it' from 'harder because it's genuinely intractable'?"
