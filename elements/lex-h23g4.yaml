id: lex-h23g4
name: whether-ritual-transgression-stabilizes-or-catalyzes-depends-on-background-crisis
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "The same sanctioned, contained ritual inversion (a carnival, a festival of misrule, any licensed and scheduled transgression of the normal order) does not have a fixed function -- under stable background conditions it discharges tension and reinforces the very order it mocks, but under conditions where that order is already in fundamental crisis, the identical ritual form can become the site where real structural change actually starts. Hyde states the general pattern: 'Dirt rituals may stabilize things for years on end, but when the order is in fundamental crisis these rituals can become the focal points for change, catalytic moments for dirt's revaluation and true structural shifts. Every so often Fat Tuesday does leak over into Lean Wednesday, and into the rest of the year as well.' His image for the ordinary case is organic and cumulative: 'Regular dirt rituals are like nodes on a shoot of bamboo, repeating year after year to strengthen the growing stalk, but then, when conditions demand it, splitting open to produce new growth.' The container itself supplies no guarantee either way; the same scheduled, bounded transgression that reliably snaps back into place in a healthy system is the one that, in a system already straining at its own contradictions, doesn't snap back. Diagnostic move: don't assume that because a ritual or licensed transgression has always been safely contained before, it will stay contained this time -- ask instead about the condition of the underlying order the ritual mocks, since the ritual's past record of stabilizing is evidence about past conditions, not about what the same ritual will do to an order that has since moved into crisis."
