    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twenty-Seventh Evening: The Ghost Wife.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'you must never raise your voice in our teepee, and above all, let me never hear you speak roughly to a child in my presence!' ... one night the father came home tired and hungry from the hunt, and the little one cried loudly and would not be quieted. Then for the first time he forgot his promise and spoke angrily to the mother and child. Instantly the fire went out and the tent was dark... they were gone from him forever!"
canonical-instances:
  - "An executive with a decade of clean compliance record at a heavily regulated firm makes one careless disclosure under deadline pressure and faces the same immediate termination and legal consequence a first-day violation would have triggered, because the firm's zero-tolerance policy explicitly doesn't weigh tenure or track record against a single breach."
  - "A recovering addict who has maintained years of sobriety experiences a single relapse that costs them custody, employment, or a relationship exactly as it would have on day one of their recovery, because the institutions around them, a custody agreement, a workplace drug policy, were built around zero-tolerance thresholds rather than cumulative-record ones."
critical-questions:
  - "is a system that grants literally zero credit for years of prior compliance actually well-designed, or does the story's harshness expose a real design flaw in any rule that can't distinguish a single lapse under ordinary fatigue from a genuine pattern of carelessness?"
  - "did the wife's condition ever have room for forgiveness at all, or was total, instant severance always the intended consequence regardless of circumstance -- and if so, was the relationship ever really sustainable long-term, or was catastrophic failure simply a matter of when, not if?"
  - "how should someone operating under a rule like this actually behave differently, given that the failure mode, ordinary fatigue causing a slip, isn't something willpower alone reliably prevents -- does the diagnostic move here amount to more than 'try very hard forever,' which is not an actionable safeguard?"
