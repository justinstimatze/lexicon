id: lex-6mwqy
name: a-correct-conclusion-does-not-certify-how-it-was-known
type-in: situation
type-out: typology
_tier: atomic
agent-instruction: "When evaluating whether a belief (yours or someone else's) is reliably known, do not treat the fact that it is CORRECT as evidence about the WAY it came to be believed -- Spinoza distinguishes three categorically different sources of knowledge, illustrated by a single worked example that all three can reach the identical right answer through. The problem: given three numbers, find a fourth that stands to the third as the second stands to the first (e.g. 1:2::3:x). (1) KNOWLEDGE OF THE FIRST KIND -- imagination or opinion -- comes from vague, unexamined experience or from symbols/testimony: 'tradesmen without hesitation multiply the second by the third, and divide by the first; either because they have not forgotten the rule ... received from a master without any proof, or because they have often made trial of it.' This kind of knowledge is, Spinoza states flatly, 'the only source of falsity' -- not because it is always wrong (the tradesman's rule works), but because it carries no internal guarantee; it produces true and false beliefs by the same blind mechanism. (2) KNOWLEDGE OF THE SECOND KIND -- reason -- derives the answer from common notions and adequate ideas of properties, 'by virtue of the proof of the nineteenth proposition of the seventh book of Euclid.' (3) KNOWLEDGE OF THE THIRD KIND -- intuition -- grasps it directly: 'one, two, three, being given, everyone can see that the fourth proportional is six... because we infer the fourth number from an intuitive grasping of the ratio.' Kinds two and three are, Spinoza states, 'necessarily true'; kind one is not, regardless of how often it happens to land on the right answer. The diagnostic payload: a track record of correct conclusions built entirely on kind-one sourcing (memorized rules never derived, testimony never checked, hearsay that happened to pan out) offers NO assurance the next application will also be correct, no matter how long the streak -- because correctness was never a property the method was built to guarantee. Portable beyond mathematics: a student who gets the right answer on a physics problem by plugging numbers into a memorized formula, versus one who derives the formula, currently produce identical correct answers -- but only the second has a method that will keep working when the problem's shape changes, because only the second actually used reason or intuition rather than recitation. A manager evaluating an analyst's recommendation that turned out correct should ask whether the analyst's process was derivation/verification (reason) or anecdote/hearsay that happened to land (opinion) -- because only the former predicts the next recommendation will also be reliable. Diagnostic test supplied by Spinoza's own example: can the person re-derive or directly see WHY the answer is correct, or can they only report THAT it is correct because a rule or a source told them so? Scope: this is not a claim that kind-one knowledge is useless -- tradesmen's rules work, testimony is often accurate -- only that its accuracy, when present, is not self-certifying and provides no epistemic insurance for future cases."
related: [lex-acmmk, lex-bvjpk, lex-5qv7q]
evokes: [knowledge-from-mere-suggestions-of-experience, tradesmen-without-hesitation-multiply, intuitive-grasping-of-the-ratio, necessarily-true-vs-only-source-of-falsity]
lineage:
  - source: primary
    text: spinoza-1677-ethics-part-ii-three-kinds-of-knowledge
    citation: "Baruch Spinoza, Ethica (1677 posthumous), Part II 'On the Nature and Origin of the Mind,' Prop. XL, Note II. Elwes translation (Project Gutenberg)."
    quote: "From all that has been said above it is clear, that we, in many cases, perceive and form our general notions:—(1.) From particular things represented to our intellect fragmentarily, confusedly, and without order through our senses... I have settled to call such perceptions by the name of knowledge from the mere suggestions of experience. (2.) From symbols, e.g., from the fact of having read or heard certain words we remember things and form certain ideas concerning them... I shall call both these ways of regarding things knowledge of the first kind, opinion, or imagination. (3.) From the fact that we have notions common to all men, and adequate ideas of the properties of things... this I call reason and knowledge of the second kind. Besides these two kinds of knowledge, there is... a third kind of knowledge, which we will call intuition... I will illustrate all three kinds of knowledge by a single example. Three numbers are given for finding a fourth, which shall be to the third as the second is to the first. Tradesmen without hesitation multiply the second by the third, and divide the product by the first; either because they have not forgotten the rule which they received from a master without any proof, or because they have often made trial of it with simple numbers... But with very simple numbers there is no need of this. For instance, one, two, three, being given, everyone can see that the fourth proportional is six; and this is much clearer, because we infer the fourth number from an intuitive grasping of the ratio."
canonical-instances:
  - "The direct textual anchor: tradesmen, students of Euclid, and someone directly seeing the ratio all reach the same correct fourth-proportional answer through three categorically different routes -- memorized rule (opinion), formal derivation (reason), and immediate grasp (intuition) -- only the latter two of which Spinoza calls 'necessarily true.'"
  - "A student who gets a physics problem right by plugging numbers into a memorized formula, versus one who derives the formula from first principles, currently produce identical correct answers -- but only the second has a method that generalizes reliably when the problem's shape changes."
  - "A manager evaluating an analyst's recommendation that turned out correct should ask whether the process was derivation/verification or anecdote/hearsay that happened to land, since only the former predicts the next recommendation will also be reliable."
critical-questions:
  - "isn't this just 'correlation doesn't imply causation' or generic epistemic humility? No -- it is a positive trichotomy with a built-in test (can you re-derive or directly see why, or only recite that), not a vague caution about drawing conclusions."
  - "doesn't testimony or rule-of-thumb knowledge often work fine in practice? Yes -- Spinoza does not claim kind-one knowledge is useless (the tradesmen's rule works); only that it is, categorically, the sole possible source of error and carries no internal guarantee, making reliance on it a bet rather than a certainty."
  - "how do you actually tell which kind of knowledge you're using? Spinoza's own example supplies the test directly: ask whether the answer can be re-derived or directly seen to be true, versus whether it can only be reported as true because a rule or source said so."
  - "isn't this the same as lex-acmmk (Kant's synthetic a priori)? No -- Kant's claim concerns universal cognitive structure that makes any experience possible at all for every mind alike. This atom is a first-order trichotomy for evaluating whether one SPECIFIC belief is reliably known, independent of any transcendental-structure question."
  - "how does this relate to lex-bvjpk (felt-freedom-is-consciousness-of-the-effect-without-the-cause)? Both diagnose a case where a surface indicator (feeling free; being correct) is not evidence for the underlying property it seems to certify (actual freedom; reliable knowledge) -- but lex-bvjpk concerns the feeling of freedom specifically, while this atom concerns the reliability of any belief regardless of whether freedom is at issue."
  - "isn't this the same as lex-5qv7q (facts-need-a-latticework-of-models)? No -- lex-5qv7q is about RETRIEVABILITY: a fact not hung on a causal model is not recallable or usable later, regardless of whether it is currently believed truly. This atom is about RELIABILITY: whether the SOURCE that produced a currently-held correct belief carries any guarantee the next belief from that source will also be correct. A fact could be perfectly retrievable (well hung on a latticework) yet still have been acquired by kind-one hearsay that happened to be right; the two atoms name different failure axes."
