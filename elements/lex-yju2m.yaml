id: lex-yju2m
name: maximal-choice-beats-optimal-paralysis
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating a decision as unfinished because you can't prove one option is the single best, check whether you actually need that -- you only need to know that no available option is worse than another you'd pick instead. Sen: “The insistence on 'optimality' (involving the identification of an 'ideal' -- or 'best' -- alternative) has to be distinguished from 'maximality', defined as a conclusion that is no less satisfactory than any other conclusion. To illustrate the contrast, when there are two alternatives x and y, neither of which is judged to be better than (or exactly as good as) the other, then in that pair of alternatives (x, y), both are maximal, but neither is optimal. We can reasonably choose either x or y, rather than go on dithering. ... Buridan's famous ass... came to a sad end by seeking optimality when it could not figure out which of the two haystacks facing it was the better one to go for. As the tragic story runs, the ass died of starvation from dithering. ... Given the stubborn incompleteness of the ordering of the two haystacks, both of them are maximal, and the choice of either -- despite their lack of optimality -- would have been a much better option than starvation.” Optimality demands a completed ranking with one option on top of every other. Maximality demands far less: that whatever you pick, nothing else on the table beats it. When two options genuinely can't be ranked against each other -- not because you haven't thought hard enough, but because the comparison has no answer -- optimality is simply unavailable, and waiting for it is how the donkey starves. Diagnostic move: when a decision stalls on 'we can't agree which is better,' check whether the stalled options are actually maximal -- each at least as good as everything else on the table, just not rankable against each other. If so, the reasoned move is to pick either one now rather than keep searching for a ranking that may not exist."
