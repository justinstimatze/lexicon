id: lex-9manj
name: an-unrecognized-right-to-self-govern-voids-a-group's-own-rules
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "Before relying on a group's own self-made rules to hold, check whether some external authority actually recognizes the group's standing to make and enforce them. A rule a group agreed on by consensus still folds the moment a higher authority can override it at will — minimal external recognition of the right to organize isn't a courtesy, it's what makes the group's own collective-choice arrangements enforceable at all."
related: [lex-ak2nb, lex-pa7hy]
evokes: ["Ostrom-design-principle-7", "externally-imposed-rules-dont-fit-local-circumstances", "standing-to-self-govern"]
lineage:
  - source: primary
    text: wilson-ostrom-cox-2013-generalizing-core-design-principles-rights-to-organize
    citation: "Elinor Ostrom's design principle 7, as restated in Wilson, Ostrom & Cox 2013, 'Generalizing the core design principles for the efficacy of groups,' Journal of Economic Behavior & Organization 90S (2013): S21-S32, p.S22 (drawing on Ostrom 1990, Governing the Commons, Ch.3). The principle explicitly depends on principle 3 (collective-choice arrangements): a group's self-made rules are only as durable as an external authority's willingness to let the group keep making and enforcing them without overriding them with a generic outside rule better suited to a different context."
    quote: "[Wilson, Ostrom & Cox 2013, p.S22:] '(7) Minimal recognition of rights to organize. Groups must have the authority to conduct their own affairs. Externally imposed rules are unlikely to be adapted to local circumstances and violate principle 3.'"
canonical-instances:
  - "The West Side Community Collaborative's block clubs, Buffalo (Oakerson and Clifton 2011, cited p.S29): 'recognized as legitimate organizations by the City Hall's Board of Block Clubs so long as each one followed the general rules for frequency of meetings, election of leaders, and adoption of bylaws' — the city's minimal recognition, not the clubs' own bylaws alone, was what gave the clubs standing to act."
  - "The Regent Academy program (Wilson et al. 2011, cited p.S28): 'The principal and teachers were given considerable leeway designing the program by the school district, in accordance with design principle 7' — the district's grant of leeway was the precondition for the principal's own locally-adapted rules to take effect at all."
critical-questions:
  - "Does the external authority's recognition actually extend to the specific rules the group needs to enforce, or only to the group's existence as a body — a recognized-but-toothless organization is functionally unrecognized where it counts?"
  - "Can the external authority revoke recognition unilaterally and without cause? A right to organize that's revocable at will is a much weaker version of this principle than one with its own standing or process protection."
  - "Is the group substituting for genuine external recognition by simply avoiding the external authority's attention — a workaround that collapses the moment the authority notices?"
status: active
