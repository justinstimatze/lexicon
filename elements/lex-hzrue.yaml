id: lex-hzrue
name: goal-means-malintegration-produces-a-strain-toward-anomie
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't diagnose a population's or organization's high rate of rule-breaking as a symptom of individual pathology or weak character before checking the ratio between goal-pressure and means-access. Merton's technical claim: cultural emphasis on a goal (e.g. monetary success) and cultural emphasis on the legitimate, institutionalized means to reach it vary independently, not in lockstep — a culture can hold a goal out as a near-universal obligation while distributing the sanctioned avenues to it unevenly, often by class. When that gap opens, aberrant behavior is 'a symptom of dissociation between culturally prescribed aspirations and socially structured avenues for realizing these aspirations' — not evidence that deviants are biologically or morally different from conformists. The mechanism sharpens when the goal is framed as open to everyone (an egalitarian ideology of ambition) while access to the approved route is in fact rationed by position: the same body of success-symbols is held to apply for all, yet 'the actual social organization is such that there exist class differentials in accessibility of the goals.' Before treating a spike in rule-breaking, cheating, or gaming-the-system as a morale or character problem, ask whether the group's stated goal is being pushed onto everyone while the sanctioned path to it is quietly rationed for some — that combination, not poverty or ambition alone, is what manufactures the pressure to deviate."
