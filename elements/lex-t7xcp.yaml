id: lex-t7xcp
name: common-oppression-claim-erases-intra-group-stratification-when-appropriated-by-the-privileged
type-in: claim
type-out: state
_tier: atomic
agent-instruction: "When a subordinated group is rhetorically organized around the claim 'we are all oppressed,' watch the intra-group dynamics: the most-privileged members WITHIN that group (more education, more wealth, more institutional access, more cultural capital, more proximity to the dominant) commonly appropriate the universalist-oppression rhetoric to advance their own interests under the cover of collective subordination. The universalist claim erases the intra-group stratification by which they materially benefit, makes critique of that stratification appear as betrayal of the common cause, and lets their specific concerns become synonymous with the group's collective concerns. Surface the asymmetry that the rhetoric conceals: who within the subordinated group is materially advantaged, whose program is being advanced under the universalist banner, and which intra-group voices are dismissed or never reach the discourse at all."
