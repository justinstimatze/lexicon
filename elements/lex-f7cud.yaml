name: recognizing-the-flattery-that-fooled-you-lets-you-refuse-the-next-ask
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "After you realize you've just been manipulated by someone's flattery into a loss, watch for that same person immediately following up with another plausible-sounding request -- the moment you name to yourself what just happened is the moment you become able to refuse the next ask from that exact source, even if you'd have said yes to it minutes earlier. In Zitkála-Šá's telling, Iktomi flatters Patkasa the turtle into a reckless jumping contest he loses, and immediately follows the win with an ordinary-sounding favor: 'watch the deer while I go to bring my children.' Zitkála-Šá names the mechanism explicitly right at this pivot point: 'Patkasa was always ready to believe the words of scheming people and to do the little favors any one asked of him. However, on this occasion, he did not answer \"Yes, my friend.\" He realized that Iktomi's flattering tongue had made him foolish.' The refusal isn't caution learned for the future in the abstract -- it's specifically triggered by having just identified, in real time, that flattery was the tool used against him, and that identification is what breaks his usual, automatic compliance with the very next request the same person makes. The insight has a narrow but real window: it fires immediately after the loss is understood, aimed specifically at the same manipulator's next move, not as a general resolution to be more careful with everyone from now on. Diagnostic move: right after you notice that someone's flattery led you into a bad outcome, treat their very next request -- however small or reasonable it sounds -- with active suspicion specifically because it's coming from the same source, since the compliance habit that flattery just exploited is still fully active and looking for its next trigger unless you deliberately interrupt it."
