    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part X, section 'Joint Activities,' 'Land Difficult to Settle,' {7.11.26-40}."
    quote: "'A weak king, though of royal blood, will perish along with his loyal subjects because of the heavy losses and expenses of settlement; a king not of royal blood, even if he is strong, will fail, because the people, not being as loyal [as they would be to true royalty] will desert him for fear of losses and expenses.'"
canonical-instances:
  - "A landowner sitting on a mineral-rich but access-poor parcel leases it, on a handshake understanding rather than a binding long-term contract, to an under-capitalized junior mining company known for taking on projects it can't actually finish -- when the junior inevitably runs out of money after building initial roads and doing preliminary surveys, the landowner reacquires the parcel with real infrastructure already in place, for a fraction of what building it directly would have cost."
  - "A larger tech company allows a smaller, under-resourced competitor to acquire the rights to a technically promising but expensive-to-productize patent, correctly predicting the smaller company lacks the capital discipline and internal support to bring it to market -- once the smaller company folds or abandons the effort, the larger company acquires the patent back along with whatever prototype work and market validation the failed attempt produced."
critical-questions:
  - "how reliably can a seller actually predict, in advance, which specific buyer will fail in the specific way described, versus simply hoping a struggling buyer eventually gives up -- does the checklist of failure-prone buyer types generalize to modern contexts, or does it depend on feudal-specific loyalty and legitimacy dynamics that don't map cleanly onto companies or individuals?"
  - "does keeping the agreement informal or verbal expose the original owner to real risk if the buyer, despite predicted failure, unexpectedly succeeds or sells the improved asset to a third party before the planned reacquisition -- what happens to this strategy when the doomed buyer doesn't cooperate with the prediction?"
  - "is there an ethical distinction between this tactic and simply defrauding a buyer who has no realistic way to evaluate their own odds of failure -- does deliberately selling a difficult asset to someone predicted to fail, without disclosing that prediction, cross into exploiting an information asymmetry the buyer never consented to?"
