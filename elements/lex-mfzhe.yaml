id: lex-mfzhe
name: a-sacred-explanation-and-a-mundane-mechanism-can-both-be-true-at-once
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone announces a solemn, ritual explanation for how they'll solve a problem, that explanation doesn't have to be a lie covering a mundane mechanism -- it can simply be the framing the audience receives while the actual mechanism does its work unseen, with neither party needing to reconcile the two accounts. In Cushing's telling, Prairie-dogs beg the Burrowing-owl to stop an endless rain. He answers as a priest: 'As you all know very well, I am a priest. I will set aside four days for fasting and meditation and sacred labors. Please await the result.' What he actually does with those four days is entirely physical: he feeds a Tip-beetle bowl after bowl of beans until it's swollen with foul gas, talks it into exhaling that gas into a sealed pouch, then beats the pouch with a stick until the stench routs the rain-gods outright. The Prairie-dogs never learn any of this. They troop out into the sunlight and praise 'their great priest, the Grandfather Burrowing-owl,' crediting the ritual framing for a result that a captured bag of beetle gas actually produced. Diagnostic move: when an announced sacred or ceremonial explanation precedes a real-world result, don't assume you have to choose between 'it was ritual' and 'it was mechanism' -- the two can run in parallel, one for the audience and one for the actual causal work, without the solver ever needing to expose which one really did it."
