evokes: [active-vs-reactive-valuation, noble-creates-good-from-self-resentful-creates-evil-from-other, ressentiment-as-engine-of-slave-morality, good-and-evil-vs-good-and-bad, the-genealogy-of-values]
lineage:
  - source: primary
    text: hesiod-c700-works-and-days-two-strifes
    citation: "Hesiod, *Works and Days* lines 11-26 (~700 BCE; Hugh G. Evelyn-White trans. 1914, Loeb Classical Library Hesiod volume). The pre-Aristotelian primary articulation of the productive-vs-destructive response-typology that Nietzsche 2,500+ years later formalizes as master-vs-slave morality. Hesiod opens *Works and Days* by correcting his own *Theogony*: there is not one Strife (`Eris`) but two — one (bad Eris, Quarrelsomeness) fosters evil war and battle and is loved by no man; the other (good Eris, wholesome Emulation) is the elder daughter of dark Night, set in the roots of the earth, who `stirs up even the shiftless to toil; for a man grows eager to work when he considers his neighbour`. The transferable claim: the same affective trigger (someone-else-has-or-does-more) routes to two structurally-distinct affects — productive-emulation (work harder, raise oneself up) or destructive-quarrelsomeness (war, tear-down). These are `wholly different in nature`. Hesiod thus articulates the master-vs-slave-morality typology in its pre-philosophical agrarian-Greek form: master-shape is productive-rivalry-with-equals; slave-shape is destructive-leveling-instinct. The lineage chain Hesiod 700 BCE → Aristotle NE II.7 ~340 BCE → Nietzsche 1886 → Scheler 1912 spans 2,600 years of philosophical and tradition-spanning attestation."
    quote: "[Hesiod *Works and Days* ll. 11-26, Evelyn-White trans. 1914:] 'So, after all, there was not one kind of Strife alone, but all over the earth there are two. As for the one, a man would praise her when he came to understand her; but the other is blameworthy: and they are wholly different in nature. For one fosters evil war and battle, being cruel: her no man loves; but perforce, through the will of the deathless gods, men pay harsh Strife her honour due. But the other is the elder daughter of dark Night, and the son of Cronos who sits above and dwells in the aether, set her in the roots of the earth: and she is far kinder to men. She stirs up even the shiftless to toil; for a man grows eager to work when he considers his neighbour, a rich man who hastens to plough and plant and put his house in good order; and neighbour vies with his neighbour as he hurries after wealth. This Strife is wholesome for men. And potter is angry with potter, and craftsman with craftsman, and beggar is jealous of beggar, and minstrel of minstrel.' [Key claim: there are TWO structurally distinct response-affects sharing a competitive-comparison trigger. The good-Eris response is productive-emulation (raising-oneself-up via competition with equals); the bad-Eris response is destructive-quarrelsomeness (war, tearing-down). The transferable lesson: at any competitive-comparison-with-equals moment, the system can route productively or destructively, and the routing IS the master-vs-slave-morality distinction Nietzsche later names — articulated here in 8th-century-BCE agrarian-Greek vocabulary, but the structural claim is identical. The proximity-targeting clause (`potter is angry with potter, and craftsman with craftsman, and beggar is jealous of beggar, and minstrel of minstrel`) is the pre-Aristotelian articulation of the proximity-claim that Rhetoric II.10 later formalizes — cross-referenced on lex-xehnw lineage.]"
  - source: practitioner
    text: nietzsche-1886-beyond-good-and-evil
    citation: "Friedrich Nietzsche, *Beyond Good and Evil* (1886), Aphorism 260 + Chapter IX 'What is Noble'. (Project Gutenberg #4363, Helen Zimmern trans.). Nietzsche distinguishes two structurally-different ways moral value is created: MASTER-MORALITY (the strong/noble/active create 'good' by affirming what they ARE; the contrasting 'bad' is simply the un-noble, the absent-of-virtue) and SLAVE-MORALITY (the weak/oppressed/reactive create 'evil' by negating what their oppressor IS; their 'good' is the inverse — patient, humble, kind, etc.). The distinction is GENEALOGICAL — both moralities exist historically; modern moral consciousness mixes them, with slave-morality dominant. Developed further in *On the Genealogy of Morals* (1887)."
    quote: "[Nietzsche, BGE Aph. 260:] 'In a tour through the many finer and coarser moralities which have hitherto prevailed... I found certain traits recurring regularly together, and connected with one another, until finally two primary types revealed themselves to me, and a radical distinction was brought to light. There is MASTER-MORALITY and SLAVE-MORALITY... The noble type of man regards himself as a determiner of values; he does not require to be approved of; he passes the judgment: what is injurious to me is injurious in itself; he knows that it is he himself only who confers honour on things; he is a CREATOR OF VALUES.' [Continuing:] 'It is otherwise with the second type of morality, SLAVE-MORALITY. Supposing that the abused, the oppressed, the suffering, the unemancipated, the weary, and those uncertain of themselves should moralize, what will be the common element in their moral estimates? Probably a pessimistic suspicion with regard to the entire situation of man will find expression... Slave-morality is essentially the morality of utility.' [The structural claim: moral systems can be classified by whether their valuation-direction is OUTWARD-FROM-SELF (master) or AGAINST-AN-OTHER (slave); the distinction is structural, not necessarily about literal social class.]"
  - source: practitioner
    text: nietzsche-1887-genealogy-of-morals-essay-i
    citation: "Friedrich Nietzsche, *On the Genealogy of Morals* (1887), First Essay 'Good and Evil, Good and Bad'. Tier-3 deepening: GM Essay I develops the master-vs-slave distinction in greater historical detail, tracing the slave-morality revolution to the priestly caste's resentment-driven inversion of warrior values. Nietzsche claims the Judeo-Christian moral framework is a slave-morality successor to earlier master-morality, and that this transvaluation is the foundational move in Western moral history."
    quote: "[Tier-3 deepening — Nietzsche GM Essay I §10: 'The slave revolt in morality begins when ressentiment itself becomes creative and gives birth to values: the ressentiment of natures that are denied the true reaction, that of deeds, and compensate themselves with an imaginary revenge. While every noble morality develops from a triumphant affirmation of itself, slave morality from the outset says No to what is outside, what is different, what is not itself; and this No is its creative deed.' Key claim: slave-morality is REACTIVE in structure — it cannot affirm its own values directly but must constitute them through negating the master-values. The transferable lesson: any value-system constituted primarily-by-negation is structurally slave-morality, regardless of its surface-content.]"
  - source: practitioner
    text: scheler-1912-ressentiment-as-modern-phenomenon
    citation: "Max Scheler, *Über Ressentiment und moralisches Werturteil* (Zeitschrift für Pathopsychologie, 1912; expanded 1915 as *Das Ressentiment im Aufbau der Moralen*). German PD. Scheler develops Nietzsche's ressentiment-analysis in phenomenological detail with operational mechanisms: §I defines ressentiment as `seelische Selbstvergiftung` (soul-poisoning) caused by repeated felt revenge-impulse / hate / envy / malice that cannot be discharged externally and turns inward as chronic disposition reorganizing the value-system; §II operationalizes how this scales to moral-genealogy via Wertfälschung (value-falsification — the change-cognition path of dissonance-reduction applied to value-cognitions when felt-impotence blocks attainment). The transferable distinction: legitimate moral critique vs. ressentiment-driven inversion — the test is whether the critique is constructive-of-affirmative-values or constituted-entirely-by-negating-the-target. Scheler's modern-phenomenon framing (bourgeois Kleinbürgertum moral-sphere, ideological-resentment-as-political-force) extends lex-wf4nj's transferability beyond Nietzsche's Judeo-Christian historical-genealogy claim."
    quote: "[Scheler 1912 §I p.7:] 'Ressentiment ist eine seelische Selbstvergiftung mit ganz bestimmten Ursachen und Folgen. Sie ist ein dauernder psychischer Zustand, der durch systematisch geübte Zurückdrängung von Entladungen gewisser Affekte, die an sich normal sind und zum Grundbestände der menschlichen Natur gehören, entsteht, und gewisse dauernde Einstellungen auf Arten des Werturteils zur Folge hat. Die hier an erster Stelle in Betracht kommenden Gemütsbewegungen und Affekte sind: Rachegefühl- und Impuls, Haß, Zorn, Neid, Scheelsucht, Hämischkeit.' [English gloss: 'Ressentiment is a soul-poisoning with quite specific causes and consequences. It is a lasting psychic state arising through systematically practiced suppression of discharges of certain affects which are in themselves normal and belong to the basic stock of human nature, and which has certain lasting orientations toward kinds of value-judgment as its consequence. The principal emotions and affects here are: revenge-feeling and impulse, hate, anger, envy, malice, mean-spiritedness.'] [Scheler 1912 §II p.16:] 'Das Wegsehen und die Tendenz zur Vernichtung der jene positiven Werte tragenden Dinge, Menschen usw., wird nun aufgegeben: aber dafür kehren sich ihre Werte... in negative Werte um, in »Übel«... so pervertiert sein Wertgefühl in der Richtung: »dies alles ist ja nichtig« und gerade in den entgegengesetzten Erscheinungen liegen Vorzugswerte vor, die den Menschen zu seinem Heile führen! (Armut, Leid, Übel, Tod).' [English gloss: 'The looking-away and the tendency toward destruction of the things, persons, etc. bearing those positive values is now given up: but in its place their values... turn around into negative values, into Evils... his value-feeling perverts in the direction: »all of this is in fact nothing« and in precisely the opposite phenomena lie preferred-values that lead the person to his salvation! (Poverty, suffering, evil, death).'] Key claim: slave-morality is not just a historical-typology label; it is the value-inversion output of a sustained Wertfälschung mechanism that operationalizes Nietzsche's genealogy at psychological-mechanism scale. The transferable lesson: identify the felt-impotence driving any negation-constituted value-system; the persistence of the negation is downstream of the unresolved impotence."
canonical-instances:
  - "the artist who creates from positive vision (master-morality posture) vs. the critic who defines themselves entirely by attacking what the artist creates (slave-morality posture). The two roles can coexist healthily; the slave-morality failure-mode is when the critic has no positive program beyond the attacking. Nietzsche's diagnostic: ask what the critic would create if their target disappeared"
  - "the founder building a company because they have a vision (master-morality) vs. the activist whose entire identity is defined by opposition to a corporation (slave-morality). The distinction is structural, not about literal social position — the activist may be wealthier than the founder. The test is whether the activist's value-system survives the corporation disappearing"
  - "self-help vs. resentment-discourse on the internet: content that says 'here is how to build / improve / grow' is master-morality-shaped; content that says 'here is why the elite / the privileged / the other-group are evil' is slave-morality-shaped. Both can be correct on facts; the structural difference is whether the value-creation is affirmative or negation-driven"
  - "the difference between admiring excellence and resenting it: a person watching a master craftsman can respond with 'I want to do that too' (master-morality emulation) or 'how dare they presume to be better than me' (slave-morality leveling-instinct). The same external act of being-better-than-you triggers radically different responses depending on the underlying value-structure"
  - "the rhetorical shift in political movements: a movement that begins with affirmative vision (master-morality-shaped) often degenerates into resentment-against-opponents (slave-morality drift). The pattern is structural; both left + right movements show it. The transferable warning: monitor whether the operating energy is creative or reactive — the degradation is the slip from former to latter"
  - "operationally distinct from lex-r3w25 confirmation-filtered-tribal-perception: lex-r3w25 is a COGNITIVE-pattern (filtering evidence to support tribal-position); lex-wf4nj is a VALUE-STRUCTURAL pattern (whether the tribe's values are themselves constituted by opposition vs. affirmation). They co-fire — tribes operating on slave-morality structurally generate more confirmation-filtering than tribes operating on master-morality — but they are distinct primitives"
  - "operationally tightly coupled to lex-gma7u will-to-power and lex-ucw53 perspectivism: master vs slave morality is the typology of how will-to-power (lex-gma7u) expresses itself as VALUE; perspectivism (lex-ucw53) is the epistemology that follows. The three-atom Nietzsche cluster fires together. lex-wf4nj is the most directly transferable of the three — usable for diagnosis of institutions/movements/individuals without requiring full Nietzschean apparatus"
  - "the transferable diagnostic question: when evaluating a value-claim or movement, ask 'what is being affirmed here, and what is being negated?' Master-morality answers the first question fully; the second is incidental. Slave-morality answers the second question fully; the first is derivative of the second. The asymmetry is the test"
critical-questions:
  - "is the master-slave distinction a historical claim or an analytical typology? Nietzsche treats it as both. The historical claim (slave-morality is a revolution from earlier master-morality, Judeo-Christianity is the canonical instance) is contested by historians. The analytical typology (any extant value-system can be classified by whether it's affirmation-driven or negation-driven) is more robust as transferable tool. The transferable position: take the typology, leave the historical-genealogy as one possible application"
  - "is slave-morality automatically inferior? Nietzsche's rhetoric strongly suggests yes — he is contemptuous of slave-morality. The more careful reading: slave-morality CAN be appropriate in conditions where direct action is impossible (genuine oppression) — it's a survival-strategy. The pathology is when slave-morality persists after the conditions that produced it have ended, or when it becomes the unconsidered default. Transferable: the dynamic is sometimes necessary, often pathological when persistent"
  - "does this typology handle mixed cases? Most value-systems in the modern world are mixed — partly affirmative, partly defined-against-an-other. Nietzsche himself acknowledges this (BGE Aph. 260: 'In all the higher and more mixed civilizations, however, there appear also attempts to reconcile both moralities'). The transferable application is dimensional, not categorical: estimate the master-slave-morality ratio of any given value-claim or movement, look for the slippage in either direction over time"
  - "is the typology useful or just rhetorical weapon? Modern usage of 'slave-morality' is often as accusation against political opponents (this side critiques mine, therefore they are slave-morality). The honest application requires equal-handed evaluation: am I myself constituting my values primarily by negating my opponents? The diagnostic value collapses if applied only one-direction. Transferable discipline: run the test on yourself first; only then on others"
status: active
