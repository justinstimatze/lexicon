id: lex-v8jbf
name: unexplained-dissatisfaction-can-flag-a-mandated-not-felt-preference
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "When someone reports that an arrangement checks every objective box - a good partner, a good job, a good life by every external measure - but something intangible is missing and they can't name what, don't dismiss the vagueness as ingratitude or overthinking. A socially mandated identity or preference can be internalized so thoroughly that it gets mistaken for a genuinely felt one, and the unnamed absence is often the only signal left once the mandate has successfully suppressed the actual desire from conscious articulation. Treat the specific, nameless 'something's missing' feeling as diagnostic, not as noise to explain away."
related: [lex-2kbpp, lex-hykxs]
evokes: ["compulsory-heterosexuality", "the-am-i-a-lesbian-masterdoc", "everything-is-going-well-but-somethings-missing"]
lineage:
  - source: primary
    text: wynn-2020-shame-contrapoints-compulsory-heterosexuality
    citation: "Natalie Wynn, 'Shame' (ContraPoints, YouTube, published 2020-02-16). Wynn narrates learning the term 'comphet' (compulsory heterosexuality) and encountering the Tumblr/Reddit 'Am I a Lesbian Masterdoc,' recognizing her own multi-year relationship with a man in its description of the mechanism."
    quote: "[Wynn, defining the term:] 'Basically it's the idea that heterosexuality is socially required of women, and it's so bound up with the conventional idea of what it even means to be a woman, that gay women often mistakenly believe for years that they're attracted to men.' ... [quoting the 'Am I a Lesbian Masterdoc':] 'Compulsory heterosexuality is the voice in my head that says I must really be het even when I'm in love with a woman.' ... 'You have every reason to be happy in your relationship with a man, but you just aren't, everything is going really well, but something is missing and you can't figure out what.'"
canonical-instances:
  - "Wynn's own year-and-a-half relationship, by her own account: a partner who treated her well, genuine affection and enjoyment on her side, no obvious complaint - and, underneath it, a specific unnamed absence she couldn't identify until she recognized it as the same feeling the Masterdoc described, at which point she named it as love for someone else rather than a flaw in the relationship itself."
critical-questions:
  - "Is the 'something's missing' feeling actually diagnostic of a mandated-versus-felt mismatch, or can ordinary relationship dissatisfaction produce the identical, equally nameless sensation - what distinguishes the two from the inside, in the moment, rather than in retrospect?"
  - "Wynn frames comphet as specific to compulsory heterosexuality for women - does the same override mechanism generalize cleanly to other socially mandated preferences (career path, family structure, consumption choices), or does something about gender and sexuality make this case special?"
  - "Once someone has learned the concept of comphet, does the label itself start generating false positives - explaining away genuine attraction to men as 'just' social mandate because the framework is now available and satisfying to reach for?"
status: active
