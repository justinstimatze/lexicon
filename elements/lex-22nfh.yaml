id: lex-22nfh
name: excluding-death-or-dirt-completely-also-excludes-the-life-it-fed
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Death, decay, and dirt aren't obstacles standing between a system and its full vitality that could in principle be eliminated while keeping the vitality intact -- in a system where anything actually grows, life and its apparent opposite are one process, not two, so a successful campaign to exclude decay or impurity entirely doesn't purify the system's fertility, it removes the fertility along with what was excluded. Hyde draws this out of the Shinto harvest myth directly: 'In this world, in trickster's world, life and death are one thing, not two, and therefore no one gets rid of death without getting rid of life as well. You get no seeds at all if the sunlight is too pure ever to mingle with the muck of the rice paddies. You get no seeds if shit never enters the New Palace.' The consequence follows for any drive toward total purification: 'whenever humans or gods move to purify life by excluding death, or to protect order completely from the dirt that is its by-product, trickster will upset their plans. When purity approaches sterility, he will tear a hole in the sacred enclosure.' The word 'sterility' names the actual failure mode precisely: not corruption, but the literal inability to produce anything new, because the mingling that purity was designed to prevent is the same mingling that generates growth. Diagnostic move: when a system, a diet, an institution, a creative practice pursues the complete elimination of some disruptive or impure element (risk, error, mess, decay, conflict), check whether that element was ever actually separable from the system's own capacity to produce something new -- if the two were fused from the start, the campaign for total purity isn't heading toward a purer version of the same vitality, it's heading toward sterility with the vitality already gone."
related: [lex-rwqr9]
evokes: [hyde-trickster-makes-this-world-matter-out-of-place, no-seeds-if-the-sunlight-is-too-pure, life-and-death-are-one-thing, purity-approaching-sterility]
lineage:
  - source: primary
    text: hyde-life-and-death-are-one-thing-purity-approaching-sterility-invites-trickster
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' drawing the general claim out of the Susa-nö-o and Amaterasu myth. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In this world, in trickster’s world, life and death are one thing, not two, and therefore no one gets rid of death without getting rid of life as well. You get no seeds at all if the sunlight is too pure ever to mingle with the muck of the rice paddies. You get no seeds if shit never enters the New Palace. And because there is always a hunger seeking for those seeds, whenever humans or gods move to purify life by excluding death, or to protect order completely from the dirt that is its by-product, trickster will upset their plans. When purity approaches sterility, he will tear a hole in the sacred enclosure and drop a dead pony on the virgin weavers, or strew his feces under the Sun Goddess’s throne."
canonical-instances:
  - "A software team that eliminates all risk-taking and experimentation from its process, in pursuit of zero defects, finds that its defect rate drops but so does its rate of any genuinely new feature, because the same willingness to try untested approaches that produced bugs was also what produced innovation."
  - "A diet that eliminates every food capable of spoiling or fermenting, in pursuit of total food safety, also eliminates an entire category of foods (aged cheese, cultured yogurt, fermented vegetables) whose distinctive value came specifically from the same microbial process being screened out as 'unsafe.'"
critical-questions:
  - "Is this claim true in general, or specifically true of biological and creative systems where growth genuinely does depend on decay-adjacent processes -- are there systems (a sterile surgical field, a clean-room semiconductor fab) where total exclusion of contamination really does just produce more of the intended output with no comparable cost?"
  - "How would someone actually calibrate how much 'mingling with muck' a given system needs, given that the myth only shows the two extremes (total purity yielding no seeds, or Susa-nö-o's violent intrusion), without offering guidance on the many intermediate degrees of tolerated impurity in between?"
  - "Does 'life and death are one thing' function as a genuine causal claim here, or is it closer to a poetic restatement of the myth's plot that risks being applied too broadly to systems where death/dirt and vitality are not actually fused in the way Hyde's rice-paddy image suggests?"
status: active
