id: lex-6subr
name: trained-incapacity-past-success-breeds-blindness-to-new-conditions
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone with deep, proven expertise responds badly to a genuinely new situation, don't assume they lack skill or are ignoring the change — check whether their PAST skill is the actual cause of the failure. Merton, drawing on Veblen's 'trained incapacity,' Dewey's 'occupational psychosis,' and Warnotte's 'professional deformation': 'Trained incapacity refers to that state of affairs in which one's abilities function as inadequacies or blind spots. Actions based upon training and skills which have been successfully applied in the past may result in inappropriate responses under changed conditions.' His illustration, via Kenneth Burke: 'chickens may be readily conditioned to interpret the sound of a bell as a signal for food. The same bell may now be used to summon the trained chickens to their doom as they are assembled to suffer decapitation.' The conditioning that reliably served the chicken becomes the exact mechanism used against it. Merton's compressed summary, quoting Burke: 'people may be unfitted by being fit in an unfit fitness.' The deeper point behind the framing is an ambivalence, not a flaw: 'a way of seeing is also a way of not seeing — a focus upon object A involves a neglect of object B.' Any skill that reliably attains something is, by the same structure, reliably NOT attending to something else — and when conditions shift to make that neglected thing the one that matters, the very soundness of the training produces the wrong response. Use this before diagnosing a veteran's, an expert's, or an institution's maladaptive response to novelty as incompetence, laziness, or resistance — ask what specific past success trained the blind spot now showing."
related: [lex-hzrue]
evokes: [merton-1957, veblen-trained-incapacity, dewey-occupational-psychosis, warnotte-professional-deformation, burke-unfitted-by-being-fit, chickens-conditioned-to-a-bell, a-way-of-seeing-is-a-way-of-not-seeing]
lineage:
  - source: primary
    text: merton-1957-trained-incapacity
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VI 'Bureaucratic Structure and Personality,' pp.197-198. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432). A footnote ('7. Weber, op. cit., 671.') is interleaved by the OCR directly into the body-text flow at the page break between 'trained incapacity,' and 'Dewey's notion'; it is elided with an ellipsis rather than reproduced as body prose."
    quote: "'The transition to a study of the negative aspects of bureaucracy is afforded by the application of Veblen's concept of \"trained incapacity,\" ... Dewey's notion of \"occupational psychosis\" or Warnotte's view of \"professional deformation.\" Trained incapacity refers to that state of affairs in which one's abilities function as inadequacies or blind spots. Actions based upon training and skills which have been successfully applied in the past may result in inappropriate responses under changed conditions. An inadequate flexibility in the application of skills, will, in a changing milieu, result in more or less serious maladjustments. Thus, to adopt a barnyard illustration used in this connection by Burke, chickens may be readily conditioned to interpret the sound of a bell as a signal for food. The same bell may now be used to summon the trained chickens to their doom as they are assembled to suffer decapitation. In general, one adopts measures in keeping with one's past training and, under new conditions which are not recognized as significantly different, the very soundness of this training may lead to the adoption of the wrong procedures. Again, in Burke's almost echolalic phrase, \"people may be unfitted by being fit in an unfit fitness\"; their training may become an incapacity.'"
  - source: primary
    text: merton-1957-a-way-of-seeing-is-a-way-of-not-seeing
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.198, immediately following, quoting Kenneth Burke, Permanence and Change (New York: New Republic, 1935)."
    quote: "'The concepts of both Veblen and Dewey refer to a fundamental ambivalence. Any action can be considered in terms of what it attains or what it fails to attain. \"A way of seeing is also a way of not seeing — a focus upon object A involves a neglect of object B.\"'"
canonical-instances:
  - "A surgeon whose reflexes were built during decades of open surgery hesitates or fumbles in a laparoscopic procedure precisely because the trained reflex ('cut toward what you can feel with your fingers') is now the wrong reflex, not because the surgeon has become careless."
  - "A veteran salesperson whose entire trained instinct is built around in-person relationship-building underperforms in a remote-first, inbound-lead sales environment — the very skill that made them excellent under the old conditions is now misapplied under the new ones, and misreading this as declining effort rather than trained incapacity leads to the wrong intervention (motivation coaching instead of retraining)."
critical-questions:
  - "How would an organization tell, in real time, whether a person's poor performance under new conditions is trained incapacity (a genuine blind spot created by past success) versus ordinary incompetence or disengagement? Merton's examples are diagnosed after the fact; the frame doesn't supply a forward-looking test."
  - "Does knowing about trained incapacity in advance actually protect against it, or is the whole point that the training operates below conscious awareness — meaning warning someone about their own blind spot doesn't remove it, only relocates the failure to a different unexamined skill?"
status: active
