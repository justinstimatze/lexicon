id: lex-7ea49
name: preload-the-resource-a-coming-stressor-will-deplete
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When something is about to face a depleting stress — meat about to be cooked, an athlete about to race, any system about to face a known draw-down — check whether you can load extra of the exact resource that stress is going to consume, before the stress starts, rather than planning to replace the loss once it's underway. America's Test Kitchen's explanation of why brining works: 'It all comes down to the reshaping of protein molecules in the meat—a task taken on by the salt in the brine. This reshaping helps the proteins to hold on to the added water, even after the meat is cooked.' ... 'This rearrangement of the protein molecules creates gaps that fill up with water. More than that: The salt actually dissolves some of the proteins, forming a gel capable of holding on to even more water.' The brine's work is already finished by the time cooking starts — it reshapes the meat's protein hours in advance, so what goes into the oven is already built to hold onto moisture that the coming heat would otherwise drive out. Before a depleting stress event, name the specific resource it will draw down. Then ask whether pre-loading extra of that resource, in a form built to resist the coming loss, is something you can still do now but won't be able to do once the stress begins."
related: [lex-96s2n, lex-becfq, lex-cmwnj, lex-d4tdk, lex-mnxhs, lex-mrhyp, lex-ne5z7, lex-njefx]
