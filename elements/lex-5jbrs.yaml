    quote: "A foolish monkey, living in the trees, O king, when both his hands were full of peas, Has thrown them all away to look for one: There is no wisdom, Sire, in such as these."
canonical-instances:
  - "A store manager who notices a single item missing from inventory pulls two employees off the sales floor for a half-day search, losing far more in missed sales than the item was ever worth, while the floor itself goes unstaffed."
critical-questions:
  - "Is the monkey's mistake really about the size of the loss, or is there a version of this where chasing the lost item is actually rational — for instance if letting a small loss go unaddressed teaches predators or thieves that losses go unpunished?"
  - "Does the same fixation apply when the held gain is abstract or reputational rather than physical and countable — is a king's border skirmish actually the same shape as dropped peas, or does the metaphor stretch too far there?"
