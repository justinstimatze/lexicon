id: lex-fxfsb
name: an-allys-appetite-for-restored-identity-outweighs-the-grudge-against-you
type-in: process
type-out: process
_tier: atomic
agent-instruction: "If you need to recruit an ally whose pride runs on being seen as formidable, a personal grudge against you may matter far less than the chance you're offering them to prove it. In Cushing's telling, two boys sneak up on their grandfather, the Rainbow-worm, purely to scare him for fun, startling him so badly 'he would have broken his back had he a back-bone.' Then, in the very same breath, they ask him for help against an enemy, and he doesn't hold the prank against them at all: 'I am old and a little deaf, and you frightened me, my boys,' followed immediately by 'I'll show them that they are not to treat my grandchildren like that. I'm a warrior, every direction of me ... I'm just made to use up life.' What actually moved him wasn't an apology, it was the appeal to an identity he was already eager to inhabit. The same pattern repeats with their other grandfather, the Turtle, whom they shoot with an arrow just before asking for his help, and who likewise sets the injury aside the moment he's called a great warrior with a real fight ahead of him. Diagnostic move: when you need help from someone whose self-image depends on a particular kind of glory or competence, don't assume a grievance against you has to be resolved first -- check whether the opportunity you're offering feeds that self-image more than the grievance costs it, because for someone starved of the chance to be what they already believe themselves to be, the opportunity itself can be the apology."
