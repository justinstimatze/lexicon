id: lex-dgwbn
name: others-acts-explained-by-disposition-own-by-situation
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When explaining behavior, notice fundamental attribution error: others' behavior gets explained by disposition, your own by situation. Force the symmetric account before relying on either; the discrepancy is the bias signature."
related: [lex-2czcp, lex-ckahh, lex-eb3wf, lex-exczm, lex-jafkg, lex-jv983, lex-mbx6p, lex-r3w25, lex-rsnn7, lex-t9fs7, lex-tjr5d, lex-vkhp7, lex-yh672, lex-zag9z]
evokes: [actor-observer-divergence, fundamental-attribution-error, dispositional-vs-situational-attribution, jones-nisbett-1971, egypt-israel-attribution-mirror, sino-soviet-specialists-adopting-client-bias, attribution-asymmetry, heuer-ch11]
lineage:
  - source: primary
    text: heuer-1999-psychology-of-intelligence-analysis-ch11-attribution
    citation: "Richards J. Heuer Jr., *Psychology of Intelligence Analysis*, CIA Center for the Study of Intelligence 1999, Ch. 11 'Biases in Perception of Cause and Effect', section 'Bias in Attributing Causality of Behavior' (pp. 134-138). The substrate-claim: when explaining the behavior of OTHERS, observers systematically over-weight DISPOSITIONAL factors (the actor's character, intent, ideology, nature); when explaining their OWN behavior, those same observers over-weight SITUATIONAL factors (constraints, pressures, contingencies they faced). This divergence is structural, not motivated — it arises from each party's differential access to its own situational information vs the other party's situational information. The foundational empirical paper is Edward Jones and Richard Nisbett 1971 'The Actor and the Observer: Divergent Perceptions of Their Behavior' in Jones et al., *Attribution: Perceiving the Causes of Behavior* (General Learning Press), p. 93. Heuer extends the actor-observer divergence from social-psychology contexts to international-relations analysis, where the consequences scale up dramatically. The Egypt-Israel peace-negotiation 1978-1979 case (Tanter 1980, Heuer, *Psychology of Intelligence Analysis* p.137-138) is the canonical political-scale instance: Egyptians attribute their own peace-orientation to inherent disposition and Israeli peace-orientation to external pressure (US sanctions, economic decline); Israelis attribute their own peace-orientation to inherent disposition and Egyptian peace-orientation to external pressure (military superiority, sanctions). Each side runs the dispositional-attribution outward and the situational-attribution inward, in mirror-symmetry. The Soviet invasion of Afghanistan 1979 is treated by Heuer (pp.134-136) as an extended worked example: US observers attribute it to Soviet expansionist nature (dispositional); Soviets attribute it to specific security-environment pressures (situational). The transferable mechanism: observer has limited information about situational pressures on the actor, so the actor's behavior LOOKS like it must reflect their nature; actor knows their own situational pressures intimately, so their behavior LOOKS like it was forced by circumstances. Both attributions are predictably-biased, in opposite directions, by the asymmetry of available information. Heuer's specialist-immersion finding (pp.136-137): area-specialists (CIA China desk, CIA USSR desk) who become deeply immersed in their target-country's perspective begin to ADOPT that country's attributional pattern. During Sino-Soviet border clashes 1969, USSR specialists viewed Chinese as 'provocative' (taking Soviet situational-frame); China specialists viewed Russians as 'arrogant' (taking Chinese situational-frame). Specialization shifts the analyst INTO the target's frame, not toward neutrality. The practitioner-payload: when forming a causal explanation of another party's behavior, explicitly list (a) the dispositional factors you'd cite, and (b) the situational factors the OTHER party would cite for their own behavior. The gap between (a) and (b) measures the attribution-divergence pressure on your analysis."
    quote: "[Heuer 1999 Ch.11 pp.134-137:] 'When inferring the causes of behavior, too much weight is accorded to personal qualities and dispositions of the actor and not enough to situational determinants of the actor's behavior. People also overestimate their own importance as both a cause and a target of the behavior of others.' [On the actor-observer asymmetry, p.135:] 'It is the behavior of others that people tend to attribute to the nature of the actor, whereas they see their own behavior as conditioned almost entirely by the situation in which they find themselves.' [On the Egypt-Israel case, Tanter 1980:] 'Egyptians attribute their willingness to sign a treaty with Israel as due to their inherent disposition for peace; Israelis explain Egyptian willingness to make peace as resulting from a deteriorating economy and a growing awareness of Israel's military superiority. On the other hand, Israelis attribute their own orientation for accommodation as being due to their ever-present preference for peace. Egypt, however, explains Israel's compromises regarding, for example, Sinai, as resulting from external pressures such as positive inducements and threats of negative sanctions by the United States.' [On specialist-immersion adopting target-frame, p.137:] 'specialists on the USSR argued that the Chinese were being \"provocative.\" These specialists tended to accept the Soviet regime's versions as to the history and alignment of the border. Specialists in Chinese affairs tended to take the opposite view—that is, that the arrogant Russians were behaving like Russians often do, while the Chinese were simply reacting to the Soviet highhandedness ... the analysts assumed the same biased perspective as the leaders of the country about which they were most knowledgeable.' [On the structural mechanism, Heuer p.138:] 'The persistent tendency to attribute cause and effect in this manner is not simply the consequence of self-interest or propaganda by the opposing sides. Rather, it is the readily understandable and predictable result of how people normally attribute causality under many different circumstances. As a general rule, biased attribution of causality helps sow the seeds of mistrust and misunderstanding between people and between governments. We tend to have quite different perceptions of the causes of each other's behavior.' [The transferable distillation: in any conflict-frame, both parties are running the same attribution-asymmetry algorithm — dispositional outward, situational inward. The asymmetry is structural and predictable. The countermove is to explicitly inventory the other party's situational frame as they would describe it, then write down what their dispositional-explanation of YOUR behavior would be — and notice the symmetric mirror.]"
canonical-instances:
  - "Egypt-Israel 1978-1979 negotiations (Heuer p.137-138 citing Tanter 1980): Egyptians attribute own peace-willingness to disposition + Israeli peace-willingness to external pressure; Israelis attribute own peace-willingness to disposition + Egyptian peace-willingness to external pressure. The mirror-symmetric pattern is the cardinal empirical case — both sides run the algorithm, with opposite assignment of dispositional vs situational labels."
  - "Sino-Soviet border clashes 1969 (Heuer p.137): CIA USSR-specialists viewed Chinese as 'provocative' (Soviet situational frame); CIA China-specialists viewed Russians as 'arrogant' (Chinese situational frame). Specialist-immersion shifts the analyst INTO the target-frame rather than toward neutrality. The objective analysis would lie between the two views; specialization actively-prevents reaching the middle."
  - "Soviet invasion of Afghanistan 1979 (Heuer pp.134-136): US observers attribute it to Soviet expansionist nature (dispositional); Soviets explain it via situational-security pressures (Iranian Revolution, NATO modernization, Afghanistan instability). Both attributions are predictably biased in opposite directions; objective causal-analysis requires explicitly listing what the OTHER party would cite as situational pressure."
  - "Software engineering: when your team ships a bug, your team explains it via situational pressures (deadline, unclear spec, dependency change). When another team ships a bug, your team explains it via dispositional traits (sloppy, careless, doesn't write tests). The asymmetry is structural: you have rich situational information about your own team, sparse for the other. The countermove is to ask 'what situational pressures was their team under that we don't know about?' before forming the dispositional judgment."
  - "Customer-facing analysis: when a customer churns, the company's analyst attributes it to dispositional customer-traits ('they were never a fit', 'too price-sensitive', 'low intent'); the customer explains the same churn via situational factors (a specific support failure, a missing feature, a budget change at their end). The customer's situational frame is the truthier one but is invisible to the company by default; building it requires explicit interview/outreach because it does not reach the company through ordinary metrics."
  - "Code review and PR-feedback: 'this reviewer keeps blocking my PRs because they're a perfectionist' (dispositional, applied to other) vs 'I'm being thorough because there's no test coverage and the rollback story is bad' (situational, applied to self). Both can be true; the actor-observer divergence systematically biases each toward the respective attribution. The teamwork countermove is to swap-frames: state aloud what situational pressure the OTHER party is under that might be driving their behavior."
  - "Conflict mediation and family-therapy practice: a foundational technique is explicit perspective-taking — 'state your partner's situational reasoning back to them, in their own terms, until they confirm it's right.' This is operationalizing lex-dgwbn's countermove. The therapy works precisely because the actor-observer divergence is the engine generating much of the conflict; surfacing it directly reduces escalation."
  - "Operationally distinct from lex-ckahh mirror-imaging: mirror-imaging projects YOUR reasoning onto the other (filling-in their model with your model). Actor-observer is the INVERSE: applying a DIFFERENT explanation to the other than you'd accept for yourself. Mirror-imaging says 'they'd do what I'd do'; actor-observer says 'they did what they did because of who they are; I did what I did because of what I faced.' These can co-occur but operate in opposite directions."
  - "Operationally distinct from lex-2czcp vividness-criterion: vividness is about weighting a SINGLE vivid case vs abstract data; actor-observer is about systematic asymmetry between SELF-explanation and OTHER-explanation regardless of vividness. Both biases can compose: a vivid instance of the other party's behavior gets dispositionally-attributed AND gets disproportionate evidence-weight."
  - "Operationally distinct from lex-t9fs7 confirmation-bias: confirmation-bias is favored-conclusion search direction. Actor-observer is structural information-asymmetry: you naturally have more situational data about yourself than about others. Confirmation-bias is motivated; actor-observer is informational. They compose — confirmation-bias can amplify dispositional-attribution of disliked-others."
  - "Operationally composes with lex-zag9z ACH: ACH's discipline of explicit hypothesis-listing surfaces the implicit dispositional-attribution by forcing the analyst to write down the SITUATIONAL hypotheses they'd otherwise skip. When ACH includes 'the actor was responding to specific situational pressures X' as an explicit hypothesis, evidence-against-disposition gets weighted properly."
  - "Operationally composes with lex-eb3wf prospective-hindsight: premortem on inter-party negotiations can include 'in a year, the other side's account of how this failed will attribute it to OUR dispositional intransigence; what situational pressures will we have failed to surface to them?' This converts the actor-observer divergence into a usable diagnostic."
critical-questions:
  - "what situational pressures is the other party under that you don't see? Practitioner-discipline: when explaining another party's behavior dispositionally, force yourself to write down their situational frame as THEY would describe it. The gap between your dispositional explanation and their plausible situational explanation measures the actor-observer pressure on your analysis. If you can't write the situational frame in their voice, you don't yet have grounds for the dispositional attribution."
  - "what dispositional explanation would they give for YOUR behavior? The mirror question. If their dispositional explanation of you would feel unjust to you (they're characterizing your behavior in ways that ignore your real situational pressures), the actor-observer asymmetry is operating — and your symmetric explanation of them is almost certainly equally unjust to them. This is the mirror-test for the bias."
  - "are you a specialist who has been immersed in the target's frame long enough to ADOPT their attributional pattern? Heuer's empirical finding (p.137): area-experts often take ON the bias of their target country, not the neutral position. Practitioner-discrimination: do you find yourself naturally siding with your target's situational frame against third parties? If yes — you have absorbed the target's actor-attribution, and your analysis is biased toward whatever they would say about themselves."
  - "is the dispositional explanation evidence-supported or fluency-supported? A dispositional attribution can be correct (some actors really do have stable dispositions driving their behavior); the question is whether the supporting evidence ruled out competing situational explanations. The actor-observer trap is when the dispositional attribution is reached by NOT examining situational evidence, not by examining it and finding it inadequate."
  - "where does this overcorrect? When the actor really IS acting dispositionally and situational pressures are weak or absent. Some actors (committed ideologues, individuals with stable strong personalities, governments with consistent strategic doctrines) genuinely act primarily from disposition; the situational-account would be the wrong frame. Practitioner-discrimination: does the actor's behavior PERSIST across substantially different situational frames? Cross-situation consistency is evidence FOR dispositional attribution; situation-specificity is evidence AGAINST."
  - "what's the policymaker's view of the analyst's role? Heuer (p.136 footnote) suggests area-specialists with greater situational-knowledge can BE the antidote — by importing target-country situational context that policymakers lack. But specialists ALSO carry the highest risk of adopting target-frame. The institutional design problem: who provides the cross-attribution corrective when specialists are biased toward target-frame and generalists are biased toward dispositional-frame? Practitioner-implication: structural process (ACH, red-teaming, explicit attribution-listing) is the bias-correction; individual-expertise alone is not."
