canonical-instances:
  - "A hiring manager choosing which of two strong candidates to promote picks the one with better judgment and adaptability over the one with sharper current technical skill in the specific tool the team uses today, reasoning that the tool will change but the judgment won't, and that the technically sharper candidate's gap in judgment is far harder to train than the other candidate's gap in tool-specific skill."
  - "A small company that can only retain one of two departing key employees keeps the generalist who has proven able to solve unfamiliar problems across several different areas, rather than the specialist who is currently the single best performer in one narrow function, betting that unpredictable future needs will reward the generalist's adaptability more than they'll need the specialist's specific expertise."
critical-questions:
  - "how would a decision-maker actually verify, in the moment, which trait is genuinely more generalizable rather than simply assuming a hierarchy (wisdom over bravery over technical skill) that might not hold in every domain -- are there real situations where narrow technical mastery is in fact the scarcer and more valuable trait, making this ranking domain-specific rather than universal?"
  - "does treating a current deficit as 'trainable' risk being overly optimistic -- the legitimate-but-less-wise son is assumed to improve with mentorship, but what if the wisdom gap turns out to be more fixed than assumed, leaving the decision-maker having kept an asset that never actually developed the compensating strength it was banked on?"
  - "in a situation where the two options' respective strengths are not cleanly ranked (say, one is more generalizable but the other's narrow strength is currently mission-critical and irreplaceable in the short term), does this framework provide guidance, or does it only work cleanly when the immediate need is not urgent enough to override the long-term generalizability calculation?"
