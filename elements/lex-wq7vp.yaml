    quote: "when Cage happened upon a melody he liked he didn’t then go on to build with it, repeat it, weave it into a climax, and so forth. To do so would be to promulgate his “likes and dislikes,” and by that begin again to shape and solidify the ego."
canonical-instances:
  - "A hiring committee running structured, randomized resume review doesn't worry when one reviewer happens to personally like a particular candidate's background more than another's -- what they actively guard against is that reviewer subtly weighting future randomized batches, or informally referencing that candidate as a template, since the reaction itself is harmless and only the reuse would bias the process."
  - "A generative-art practice built on randomized parameters doesn't ban the artist from noticing that one random seed produced something beautiful -- it bans saving that seed as a new default or a favorite starting point, since noticing is inert and saving is exactly how an ostensibly random process quietly becomes a personal style."
critical-questions:
  - "Is this distinction sustainable in practice, or does refusing to build on liked results just push preference into a subtler channel -- which chance operations get run again, which get abandoned, which experiments get set up in the first place -- so that the ego reforms one level up instead of being genuinely avoided?"
  - "Does never building on a liked chance find sacrifice real value, since deliberately developing a promising accidental discovery is how craft and mastery normally accumulate, and Cage's refusal might be closer to an ideological commitment than a generally advisable practice?"
  - "How would an outside observer ever verify that a artist's or process's results are genuinely un-reused rather than reused so subtly that the pattern is undetectable, given that Cage's own claim to have refused reuse rests entirely on his own self-report?"
