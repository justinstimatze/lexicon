id: lex-e6b8r
name: structural-change-not-moral-appeal-breaks-a-self-reinforcing-cycle
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When trying to end a vicious circle where a false belief keeps generating the evidence that seems to confirm it, don't reach first for persuasion, education, or appeals to good will — look for the structural condition that lets the cycle run, and remove that instead. Merton is explicit that moral suasion is the wrong tool for a structurally-maintained belief: 'moral sentiments are not much more effective in curing social ills than in curing physical ills. Moral sentiments no doubt help to motivate efforts for change, but they are no substitute for hard-headed instrumentalities for achieving the objective' — comparing the failure of pure appeals-to-reason to a paranoiac who won't 'abandon his hard-won distortions and delusions upon being informed that they are altogether groundless.' His own quantified case: bank panics were not cured by telling depositors panic was irrational, but by removing the structural condition that made panic rational — 'during the four years immediately before and after The Crash... this zoomed to the more spectacular average of 2,276 bank suspensions annually. But... in the twelve years following the establishment of the Federal Deposit Insurance Corporation and the enactment of other banking legislation... bank suspensions dropped to a niggardly average of 28 a year... millions of depositors no longer have occasion to give way to panic-motivated runs on banks simply because deliberate institutional change has removed the grounds for panic.' He draws the general lesson explicitly: 'Occasions for racial hostility are no more inborn psychological constants than are occasions for panic... These patterns of human behavior are largely a product of the modifiable structure of society.' Diagnostic use: before proposing an awareness campaign, education initiative, or moral appeal to fix a self-reinforcing social pattern, ask what structural feature is actually generating the confirming evidence each cycle, and whether that feature — not people's beliefs about it — is the thing to change."
