id: lex-rrnft
name: a-technique-calibrated-to-one-audience-backfires-unchanged-in-another
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A courtship or persuasion approach that reliably worked at home -- charm, intimate flattery, confident compliments -- can be applied unchanged in a new social context, expecting the same success. The same behavior that consistently attracted people in the old context can consistently repel people in the new one, because the technique was never universally effective in itself. It was calibrated to a specific audience's particular expectations, and transplanting it unmodified into an audience with different expectations produces the opposite of the intended effect. Gilman stages this exactly: Terry's proven approach fails completely in Herland. 'I could see, just in snatches... how his suave and masterful approach seemed to irritate them; his too-intimate glances were vaguely resented, his compliments puzzled and annoyed... Girl after girl turned on her heel and left him, till he had but a small ring of questioners.'"
