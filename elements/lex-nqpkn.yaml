lineage:
  - source: primary
    text: hyde-hermes-fully-reliable-to-zeus-fully-untrustworthy-to-mortals
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' on Hermes' domain-bound trustworthiness across Homeric texts. The quote skips one sentence between 'shameless behavior' and 'Second' -- Hyde's parenthetical example of Hermes helping Zeus deceive Hera, and Hades free Persephone -- which illustrates rather than adds to the claim being cited here. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "That said, I must refine the point a bit, for there are certain areas in which Hermes is not to be trusted at all. First of all, when the gods themselves are at odds, Hermes is still the trickster, siding with stolen love, theft, and shameless behavior. ... Second, to the degree that he is domesticated, his domos, his home, is with the gods, but he is never brought into line where mortals are concerned: the closing lines of the Hymn say that “most of the time, when night has fallen, he deceives the race of those who must die.”"
canonical-instances:
  - "A defense attorney who is scrupulously, unfailingly honest with the court and with colleagues can simultaneously be someone whose entire professional function toward the prosecution's case is to obscure and mislead within the rules of the adversarial system -- neither role predicts or undermines the other, and judging the attorney's overall 'trustworthiness' as a single number would misdescribe both roles."
  - "An employee who is completely reliable in every commitment made to their direct manager can be, in the same period, someone whose word to external vendors is worthless, because the two relationships sit in structurally different incentive positions -- a vendor's complaint about broken promises is not evidence against the manager's confidence, and vice versa."
critical-questions:
  - "Is domain-bound trust actually stable over time, or does unreliability in one domain tend to eventually leak into others (an employee dishonest with vendors becomes, eventually, dishonest with their manager too), making the compartmentalization Hyde describes for Hermes a mythic ideal rather than a realistic pattern?"
  - "How should a third party who has no direct experience in either domain decide how much to weight a reputation built in one relationship when deciding whether to trust the same actor in a different one, given that the two records may be genuinely uncorrelated?"
  - "Does treating trust as domain-bound risk providing cover for genuinely bad-faith actors who exploit compartmentalization deliberately (being reliable where it's cheap and strategic, unreliable where it's costly), as opposed to the more sympathetic reading where the two domains simply have different incentive structures?"
