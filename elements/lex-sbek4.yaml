id: lex-sbek4
name: grief-as-an-embedded-dart-with-consolation-figured-as-its-physical-extraction
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'Grief can be figured not as a mood but as a physical foreign object lodged in the body, and the act of being consoled figured as the literal surgical removal of that object — a somatic metaphor that converts an internal state into something concrete enough to be extracted and shown gone. In the Jataka''s tale of Matta-Kundali, the consoled father describes his grief and its relief in exactly these terms: "Grief for my son—a cruel shaft was lodged within my heart; Thou hast consoled me for my grief, and taken out the dart." This dart-of-grief formula recurs across the collection — the translation''s own footnotes trace the same stanzas to several other tales.'
related: []
evokes: [jataka, dasanipata, matta-kundali-jataka, dart-of-grief-metaphor, sallatha-sutta-second-arrow]
lineage:
  - source: primary
    text: jataka-chalmers1895-matta-kundali-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 449, Matta-Kundali-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Grief for my son—a cruel shaft was lodged within my heart; Thou hast consoled me for my grief, and taken out the dart."
canonical-instances:
  - "A grief counselor tells a client that her sister's calm, patient questions over many months finally \"pulled the splinter out\" of a loss she'd been unable to name directly, describing the relief in the same physical, extraction-like terms the client herself first used."
critical-questions:
  - "Does figuring grief as an extractable object risk implying that unresolved grief is a simple mechanical failure to remove something, when in practice consolation rarely works as cleanly as a single extraction?"
status: active
