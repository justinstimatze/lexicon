id: lex-8cpbt
name: demonstrated-restraint-under-provocation-persuades-the-provoking-power-holder-to-reform
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'Sustained, visible equanimity in the face of a power-holder''s wrongdoing can function as its own form of persuasion, eventually moving the wrongdoer to reverse the harm and offer protection, where neither pleading nor resistance would likely have worked as well. In the Jataka''s tale of Culla-Bodhi, the king, having watched the ascetic''s consistent composure through repeated provocation, ultimately returns the abducted woman and pledges to protect the couple himself. The turning point is his own admission after hearing the ascetic''s discourse on anger: he "was well pleased, and bade one of his courtiers lead the woman back; and invited the passionless recluse to stay with her in that park... and he promised to watch over them and defend them as he ought."'
related: []
evokes: [jataka, dasanipata, culla-bodhi-jataka, restraint-persuades-power-holder, provocation-met-with-equanimity]
lineage:
  - source: primary
    text: jataka-chalmers1895-culla-bodhi-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 443, Culla-Bodhi-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "was well pleased, and bade one of his courtiers lead the woman back; and invited the passionless recluse to stay with her in that park, in the enjoyment of their solitary life, and he promised to watch over them and defend them as he ought"
canonical-instances:
  - "A tenant whose landlord illegally shut off her heat responds to every confrontation with calm, documented requests rather than anger, and the landlord — expecting outrage he could dismiss — eventually restores service and personally apologizes, something an angry complaint had never produced from him before."
critical-questions:
  - "Does demonstrated restraint actually cause the power-holder's reform, or does it merely coincide with a reform the power-holder was already inclined toward for unrelated reasons?"
status: active
