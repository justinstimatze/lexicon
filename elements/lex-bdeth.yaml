id: lex-bdeth
name: a-proxy-is-abused-with-impunity-until-the-principal-appears-in-person
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "An aggressor who is willing to abuse a low-status representative without consequence may still be relying on that representative's low status specifically, and change behavior entirely once the actual person behind the request appears and confronts them directly. In Radin's Winnebago Hare Cycle, Hare sends a friend to retrieve an arrow the chief Sharp-elbow has taken. The chief doesn't even dignify the request with a refusal: 'the chief did not so much as answer him and so he went back without it.' Three more attempts change nothing, and the fourth ends in violence: 'Sharp-elbow, using his elbows, thereupon tore him open and said to his attendants, 'Hang him up to dry. I will soon make a nice meal of him.'' The proxy's death produces no reckoning from Sharp-elbow, who has apparently calculated, correctly, that a friend sent on someone else's behalf can be killed at no cost. That calculation stops being available the moment Hare, the actual owner of the arrow and the actual party with a grievance, arrives and states it himself: 'I thought you told me your grandson was a chief and yet this man says he has been killed. However, I will now go over and see this chief Sharp-elbow myself.' What follows is not another ignored request; it is Sharp-elbow's death. Diagnostic move: when an escalating series of requests through an intermediary keeps being ignored or punished without consequence to the requester, treat the pattern as diagnostic of who's actually being tested, the intermediary's expendability, not of whether the underlying claim is legitimate, before deciding whether to send someone else or to show up yourself."
