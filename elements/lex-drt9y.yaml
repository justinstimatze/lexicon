id: lex-drt9y
name: formalizing-a-relationship-crowds-out-the-connection-that-motivated-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Two people whose relationship was previously built on unhurried conversation and equal footing can lose exactly those qualities once they formalize the relationship into a shared economic and domestic partnership. The sheer proximity, immersion, and practical business of the new arrangement leaves no space for the leisure and ease that made the earlier connection valuable, so the very act of securing the relationship degrades the thing it was meant to secure. Gilman names the loss directly: 'Even the friendship which may have existed between husband and wife before marriage is often destroyed by that relation and its economic complications. They have not time to talk about things as they used: they are too near together, and too deeply involved in the industrial and financial concern of their new business.'"
related: []
evokes: [women-and-economics, chapter-xiv, they-have-not-time-to-talk-about-things-as-they-used, too-near-together-and-too-deeply-involved, securing-the-relationship-degrades-what-it-secures]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-xiv
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter XIV. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "Even the friendship which may have existed between husband and wife before marriage is often destroyed by that relation and its economic complications. They have not time to talk about things as they used: they are too near together, and too deeply involved in the industrial and financial concern of their new business. This works steadily against the development of higher and purer relations between men and women, and tends to keep them forever to the one primitive bond of sex-union."
canonical-instances:
  - "Two close friends who talked for hours about ideas over the years decide to become business partners, and within months their conversations narrow entirely to logistics, invoices, and disputes, with no time left over for the wide-ranging talk that made the friendship valuable in the first place."
  - "A mentor and protege with a genuinely warm, unhurried relationship formalize it into a reporting structure when the protege joins the mentor's company, and the immersion in day-to-day management tasks crowds out the reflective conversations that defined the relationship before it became official."
  - "Two musicians who bonded over informal jam sessions decide to formally co-found a band and manage its business together, and the resulting logistics, contracts, and scheduling pressure leave little room for the loose, exploratory playing that brought them together to begin with."
critical-questions:
  - "Is the crowding-out inevitable once a relationship formalizes, or can two people deliberately protect time and space for the original unstructured connection even after taking on shared practical business together?"
  - "Does the loss trace specifically to the economic/practical entanglement, as Gilman claims, or would simple increased proximity and daily contact alone -- without any shared business -- produce the same erosion of unhurried conversation?"
  - "If the pattern holds reliably, it seems to argue against ever locking a valuable relationship into a formal arrangement. But maybe what replaces the lost quality is a different kind of value, one worth the trade."
status: active
