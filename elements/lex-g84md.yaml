    quote: "\"Suppose this mountain were to become all gold, would you give me some of it?\" \"Who are you?\" he replied, \"I would not give you a jot.\""
canonical-instances:
  - "A friend asks 'if you won the lottery tomorrow, would you help me pay off my debt?' and gets an immediate, irritated no — a real windfall might come with a hundred legitimate competing claims, but refusing the pure hypothetical reveals an attitude no practical constraint can explain away."
critical-questions:
  - "Is refusing a hypothetical actually meaningful evidence of character, or could someone reasonably resent the premise of the question itself — being asked to pre-commit to a decision about a scenario that will never occur — without that resentment reflecting anything about their real generosity?"
  - "Does the person being asked have any way to answer generously without it costing them social standing, given that agreeing to an absurd hypothetical might itself read as empty or performative?"
