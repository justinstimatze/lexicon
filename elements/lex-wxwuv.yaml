id: lex-wxwuv
name: betray-the-accomplice-to-the-wronged-party-once-caught
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you're caught for something you couldn't have done without an accomplice's help, don't assume loyalty to the person who enabled you survives the moment you're asked to explain yourself to the party you wronged -- naming the accomplice is often the cheapest way out, and the story doesn't have to punish the person who asks for it to punish the one who's named. In Cushing's telling, two gods steal sacred thunder and lightning only because their grandfather, the Centipede, physically infiltrated the guarded house and stole it for them at real personal risk. When the theft is discovered and 'the two boys, when asked how they stole the lightning-shaft and the thunder-stone, told on their poor old grandfather,' the consequence lands entirely on him: 'The beloved Gods of the Rain gave him the lightning-shaft to handle in another way, and it so burned and shrivelled him that he became small.' The boys who conceived the plan and reaped its fun face no recorded punishment at all -- the accomplice who made it physically possible absorbs the entire cost of exposure, permanently and visibly, in a way his descendants still carry. Diagnostic move: when you're implicated in something you couldn't have pulled off alone, notice the pull to answer 'how did you do it' with the truth about who helped you -- that honesty routes the consequence toward the person who trusted you enough to take the real risk, while you, the one asked the question, often walk away from the same exposure that permanently marks them."
