id: lex-gggsp
name: deliberate-statutory-ambiguity-routes-power-to-the-adjudicator
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A lawgiver who wants ongoing interpretive power to sit with a specific institution — rather than being frozen into the original text — can achieve this not by granting that institution explicit discretion, but by writing the underlying statute in deliberately obscure, under-specified language, so that disputes cannot be resolved 'by the letter' and must be brought to that institution for resolution. Plutarch's Life of Solon states this as a conscious authorial strategy: 'it is said that he was obscure and ambiguous in the wording of his laws, on purpose to increase the honor of his courts; for since their differences could not be adjusted by the letter, they would have to bring all their causes to the judges, who thus were in a manner masters of the laws.' The mechanism is indirect and durable: an explicit grant of discretion ('the court may decide as it sees fit') is itself a piece of text that could later be narrowed or repealed. Ambiguity baked into the substantive law itself has no such single point of capture — as long as the ambiguous text stands, disputes must keep flowing to the adjudicating body, because there is no alternative path to resolution. The vagueness is not a drafting failure; it is the delivery mechanism for a permanent transfer of interpretive authority. Generalize beyond this case: open-textured constitutional clauses ('due process,' 'reasonable,' 'cruel and unusual') that hand ongoing interpretive authority to courts precisely because their vagueness cannot be resolved by reading the text more carefully; a commercial contract's deliberately vague 'reasonable efforts' or 'material adverse change' language, which routes disputes to arbitration or negotiation rather than settling them at signing. The diagnostic move: when a rule seems oddly imprecise for something so consequential, check whether the imprecision is accidental or whether it is functioning as a routing mechanism — moving power from the text's original author to whichever body gets to say what the vague words mean in each new case."
related: [lex-8n237]
scaffolds-from: [lex-8n237]
evokes: [obscure-and-ambiguous, masters-of-the-laws, adjusted-by-the-letter, honor-of-his-courts]
lineage:
  - source: primary
    text: plutarch-c100-life-of-solon-ambiguous-laws
    citation: "Plutarch, Life of Solon, in Plutarch's Lives (Clough revision of Dryden translation, Project Gutenberg #674). Plutarch's account of Solon's deliberately obscure legislative drafting, understood as a strategy to route ongoing interpretive authority to the Athenian courts."
    quote: "it is said that he was obscure and ambiguous in the wording of his laws, on purpose to increase the honor of his courts; for since their differences could not be adjusted by the letter, they would have to bring all their causes to the judges, who thus were in a manner masters of the laws."
canonical-instances:
  - "Solon's deliberately obscure statutes in Plutarch: because disputes cannot be settled by reading the law's letter, citizens must bring every contested case to the courts, which become 'masters of the laws' — a permanent transfer of interpretive power achieved through the drafting itself, not through any explicit grant of discretion."
  - "open-textured constitutional clauses: phrases like 'due process' or 'reasonable' cannot be resolved by closer reading alone, so ongoing interpretive authority sits with the courts that apply them case by case, indefinitely."
  - "a contract's deliberately vague 'reasonable efforts' or 'material adverse change' language: the imprecision routes disputes to arbitration or renegotiation rather than settling the meaning at the moment of signing."
critical-questions:
  - "how does this differ from lex-8n237 (under-determined-rule-admits-multiple-legitimation-methods)? lex-8n237 names what happens ANALYTICALLY once a rule is under-determined for a given case — multiple legitimation methods (textual, purposive, consequentialist, precedential) become available, and the choice between them is a methodological commitment, not something the rule itself settles. This atom names a narrower, INTENTIONAL claim about drafting strategy: a lawgiver can deliberately manufacture under-determination as a way to route power to a specific chosen institution. lex-8n237 describes the interpretive situation any under-determined rule creates; this atom describes a lawgiver choosing to create that situation on purpose, for a specific institutional beneficiary, as a durability-of-power strategy."
  - "isn't this indistinguishable from just bad or lazy legislative drafting? The atom's claim depends on the ambiguity being FUNCTIONAL — serving a real, identifiable institutional beneficiary (the courts, in Solon's case) whose power increases specifically because of the vagueness. Sloppy drafting that helps no one and simply creates confusion is not what the atom names; the diagnostic test is whether a particular body predictably and durably gains authority as a direct consequence of the ambiguity, which is evidence the vagueness is doing strategic work rather than being mere carelessness."
  - "does the strategy still work if the adjudicating body is itself later captured or corrupted? No — the atom names a durable transfer of PROCEDURAL authority (who gets to decide), not a guarantee of good outcomes. If the adjudicating institution is compromised, the ambiguity now routes power to a compromised body just as reliably as it would to a trustworthy one. The mechanism is agnostic to the quality of the beneficiary; a lawgiver choosing this strategy is betting on the long-term integrity of the institution they're empowering, which is a separate and much riskier judgment than the drafting technique itself."
