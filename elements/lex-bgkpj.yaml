id: lex-bgkpj
name: successful-enchantment-numbs-the-watchdog-not-just-the-argument
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "An illusion that has to survive a wide-awake, skeptical mind has a much harder job than one that first puts the skeptical faculty itself to sleep -- and a truly effective deception targets the guard, not the gate, disabling the capacity for doubt before the doubtable claim ever has to face it. In a variant of the Hymn to Hermes, dogs are set to guard Apollo's cattle, and Hermes doesn't fight or trick them individually; he puts them into a stupor. Hyde draws out the etymology: 'The Greek for \"stupor\" is lethargon, a combination of lethe (forgetfulness) and argon (lazy or slow)... When Hermes is ordering the world on his own terms, he takes the watchdogs of the mind -- acute, open-eyed, up all night -- and numbs them with forgetfulness. Under his enchantment, illusion sinks below the threshold of consciousness and appears to be the truth.' The illusion doesn't have to be convincing once the faculty that would have questioned it has been quieted; it doesn't rise to the level of a claim to be evaluated, it simply settles in as background truth. Diagnostic move: when assessing how firmly an illusion, ideology, or convenient story has taken hold somewhere, don't just ask whether the content is persuasive -- ask whether the capacity for skeptical scrutiny in that setting is actually awake and functioning, since an illusion facing a numbed watchdog needs far less persuasive power than one facing an alert one, and restoring the guard's vigilance may do more than any counter-argument."
