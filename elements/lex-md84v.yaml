name: proportional-revenge-targets-the-same-category-of-loss-not-just-any-injury
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Revenge that satisfies isn't just about inflicting comparable pain -- it often specifically targets the same category of thing that was taken from you, so the mirror is exact rather than merely equivalent. In the Zuni retelling of 'The Cock and the Mouse,' a rooster bites off a mouse's tail, mistaking it for a worm, and the mouse doesn't simply plot to hurt the rooster back; he names precisely what was actually lost: 'he has taken away the very mark of my mousehood.' After patiently building trust and luring the rooster up a tree to injure him, the mouse doesn't stop at the physical harm of the falling nut. He immediately does one more thing: 'he ran across, before ever the Cock had opened an eye, and gnawed his bristles off so short that they never could grow again,' the rooster's own prized ornament, his 'chief distinction.' The mouse says as much himself: 'my enemy is even as he made me, bereft of distinction.' The revenge wasn't complete until the same kind of loss, a signature bodily ornament, had been inflicted in return, not just an injury of comparable severity. Diagnostic move: when assessing whether a retaliation is proportionate, don't just weigh total harm against total harm -- notice whether it specifically targets the same category of thing the original injury took, because that specific mirroring, not the raw magnitude, is often what the aggrieved party is actually seeking."
