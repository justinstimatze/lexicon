id: lex-q7j8q
name: guarded-speech-withheld-from-intimates-functions-as-a-weapon
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Treating speech as something to withhold and time deliberately — confiding in no one, not even close intimates, before it's needed — turns words into a weapon that can trap an adversary, rather than a reflex that gives away your position the moment a thought occurs. In the Jataka's tale of the crow and the cuckoo, the minister uses the incident to teach a talkative king this exact discipline: 'The sage his measured words discreetly guides, Nor rashly to his second self confides: Before he speaks will prudent counsel take, His foes to trap, as Garuda the snake.'"
related: []
evokes: [jataka, catukkanipata, kokalika-jataka, withholding-speech-from-intimates-preserves-its-use-as-a-weapon, timed-words-trap-an-adversary-reflexive-words-do-not]
lineage:
  - source: primary
    text: jataka-chalmers1895-kokalika-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 331, Kokalika-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The sage his measured words discreetly guides, Nor rashly to his second self confides: Before he speaks will prudent counsel take, His foes to trap, as Garuda the snake."
canonical-instances:
  - "A negotiator preparing for a high-stakes deal doesn't even tell their own deputy the walk-away number until the moment it's needed at the table, reasoning that any early confidence, however trusted the listener, is one more chance for the leverage to leak before it can be used."
critical-questions:
  - "Does withholding speech even from close intimates come at a real cost to trust and connection, and is that cost worth the tactical advantage it buys in adversarial situations?"
  - "Is this advice actually generalizable, or does it specifically apply to a talkative king dealing with adversaries — does the same discipline make sense in relationships that aren't fundamentally strategic?"
