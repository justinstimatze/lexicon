name: unresolved-conversion-rates-can-still-yield-a-settled-answer
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a comparison depends on converting between two things with no agreed exchange rate -- one person's welfare against another's, money against wellbeing, short-term against long-term -- don't wait to pin the rate down exactly before concluding anything. Check instead whether the conclusion holds across the whole range of rates you're willing to call plausible. Sen's illustration: judging whether Rome's welfare fell when it burned while Nero fiddled, delighted, and everyone else suffered. Exact precision isn't available -- there's no natural one-to-one correspondence between Nero's units of delight and a burned-out Roman's units of loss -- but the judgment doesn't need it: “If there is no comparability at all, we can change the utility units of different individuals differently, and by multiplying Nero's utility measures by a suitably large number it should be possible to make Nero's gain larger in size than the loss of others. Hence we are not assuming non-comparability. But are we assuming that every Roman's welfare units can be put into one-to-one correspondence with the welfare units of every other Roman? Not necessarily. We might not be sure what precise correspondence to take, and we might admit some possible variability, but we could still be able to assert that no matter which of the various possible combinations we take, the sum total went down in any case. This is a case intermediate between non-comparability and full comparability of units.” Fix a range of conversion rates wide enough that no single value in it can be defended over the rest, then check whether the answer changes anywhere inside that range. When it doesn't, the exact rate turns out to be beside the point -- the range being bounded at all was enough. Diagnostic move: before treating an unresolved incommensurability as grounds to withhold judgment entirely, check whether the conclusion actually needs the exact rate, or only needs the rate to fall somewhere inside a defensible interval."
