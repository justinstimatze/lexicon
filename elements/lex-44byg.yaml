id: lex-44byg
name: dominant-discourse-constructs-the-other-as-rulable-object-and-defining-mirror
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When analyzing how a dominant power represents an Other (region, people, religion, race, class, subculture), do not treat the representation as descriptive or neutral. The representation is itself the operational substrate by which the dominant produces (a) the object-of-knowledge that ruling requires, (b) its own self-identity through contrast with the Other, and (c) the institutional apparatus (academic departments, expert literature, administrative practices, cultural production) that reproduces and updates the representation. The constructed Other is materially-effective (shapes policy, lives, careers) AND not-reducible-to-the-actual-population it claims to represent. Diagnostic intervention: ask who institutionally benefits from the representation, what cultural-identity work the contrast performs for the dominant, and what alternative self-representations of the represented have been suppressed or unread."
