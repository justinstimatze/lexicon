    text: radin-tricksters-disguise-scheme-collapses-and-his-co-conspirators-flee
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episodes 19-20. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Younger brothers, it is going to be very difficult. However, if we do the thing I am about to suggest, it will be good. So, at least, I think.' ... 'I will disguise myself as a woman and marry him. Thus we can live in peace until spring comes.''Good!' they ejaculated. All were willing and delighted to participate. ... Then he let the fox have intercourse with him and make him pregnant, then the jaybird and, finally, the nit. ... the chief's son's wife ( Trickster) jumped over the pit and she dropped something very rotten. The people shouted at her, 'It is Trickster!' The men were all ashamed, especially the chief's son. The animals who had been with Trickster, the fox, the jaybird and the nit, all of them now ran away."
canonical-instances:
  - "Three business partners knowingly cook the books together to secure a loan they all badly need, and when an auditor finally catches an accounting discrepancy by chance, two of the three partners quietly resign and claim ignorance within the week, leaving the third to face the fraud investigation alone."
  - "A group of coworkers agree to cover for each other's falsified overtime hours because everyone benefits from the extra pay, and when payroll flags one anomalous timesheet during a routine audit, the others quickly distance themselves and claim they never knew what was happening."
critical-questions:
  - "Is fleeing at the moment of exposure a rational response for the co-conspirators, given that staying might implicate them further, or does the story frame their flight as a moral failure, an abandonment of a shared undertaking rather than a sensible individual choice?"
  - "Would the scheme have been exposed eventually regardless of the accidental trigger, given how many years and how much physical evidence, three children, had already accumulated, or did the bodily accident specifically determine both the timing and the manner of discovery?"
  - "Does Trickster bear more responsibility for the deception than his co-conspirators simply because it was his idea and his body performing the disguise, or does their active, knowing participation in producing the pregnancies make their later flight a comparable betrayal to any conspirator abandoning a co-conspirator?"
