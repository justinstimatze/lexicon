id: lex-hsntu
name: recursive-displaced-language-converts-private-pattern-into-shareable-cultural-sediment
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "Without language, each mind's patterns are private and die with the mind. With language — but only with a specific cognitive package: recursion (a finite alphabet of symbols can compose into unbounded sentences), displacement (referents not present in the local situation can be invoked), counterfactual reference (scenarios that have not happened and may never happen can be communicated and reasoned about), and conceptual blending (separate domains can be metaphorically composed) — private patterns become inter-mind transmissible and accumulate as cultural sediment across generations. Vervet alarm calls do not have this package; they are fixed signals that cannot be recombined and cannot refer outside the current situation. They cannot transmit culture. Human language can. The practitioner-move: when evaluating any communication medium (natural language, programming language, mathematical notation, protocol, gesture-system, AI-to-AI exchange), ask whether it supports the recursion+displacement+counterfactual+blending bundle. If it does, it can carry sediment across minds; if it does not, communication is confined to the live present and no culture-like accumulation is possible. The bundle is the structural condition, not an incidental feature."
