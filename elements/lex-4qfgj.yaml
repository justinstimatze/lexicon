id: lex-4qfgj
name: invest-loyalty-in-proportion-to-reciprocation-received
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Rather than honor a relationship regardless of how it's returned, calibrate the honor and effort you extend to exactly match what comes back — and when nothing comes back, withdraw entirely rather than continuing to invest in someone who has already shown they won't reciprocate. In the Jataka's tale of the two lizards, the minister explicitly counsels the queen to abandon anyone who doesn't return affection, as a bird abandons a barren tree: 'Forsake the wretch who has forsaken thee, And love not one who has for thee no love, E'en as a bird forsakes a barren tree, And seeks a home in some far distant grove.'"
related: []
evokes: [jataka, catukkanipata, godha-jataka, loyalty-calibrated-to-match-what-is-returned, abandon-a-bond-that-yields-no-reciprocation-rather-than-sustaining-it]
lineage:
  - source: primary
    text: jataka-chalmers1895-godha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 333, Godha-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Forsake the wretch who has forsaken thee, And love not one who has for thee no love, E'en as a bird forsakes a barren tree, And seeks a home in some far distant grove."
canonical-instances:
  - "A freelancer who has spent years going above and beyond for a client that never once refers new business or offers a rate increase finally stops prioritizing that account, redirecting the same energy toward clients who visibly value the relationship in return."
critical-questions:
  - "Does treating loyalty as strictly transactional this way undermine relationships that need patience through a rough patch, where the other party's failure to reciprocate is temporary rather than a settled pattern?"
  - "Who decides when a relationship has crossed from 'temporarily barren' to 'permanently forsaken' — is there a real risk of walking away too early on something that would have turned around?"
