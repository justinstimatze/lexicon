    quote: "'Meno: And how will you inquire, Socrates, into that which you know not? What will you put forth as the subject of inquiry? And if you find what you want, how will you ever know that this is what you did not know?' ... 'To state a problem is to designate (1) a test for a class of symbol structures (solutions of the problem), and (2) a generator of symbol structures (potential solutions). To solve a problem is to generate a structure, using (2), that satisfies the test of (1).' ... 'A simple test exists for noticing winning positions, the test for checkmate of the enemy King. In the world of dreams one simply generates a strategy that leads to checkmate for all counter strategies of the opponent. Alas, no generator that will do this is known to existing symbol systems (man or machine). Instead, good moves in chess are sought by generating various alternatives, and painstakingly evaluating them with the use of approximate, and often erroneous, measures that are supposed to indicate the likelihood that a particular line of play is on the route to a winning position. Move generators there are; winning move generators there are not.'"
canonical-instances:
  - "The paper immediately names where the real difficulty moves once the distinction is drawn: 'How, in any concrete situation they synthesize a problem space and move generators appropriate to that situation is a question that is still very much on the frontier of artificial intelligence research.' The test side is comparatively easy to state; building a working generator for a given problem space is where the field's actual unsolved work concentrates."
  - "Hypothetical: a hiring committee can state a perfectly clear test for 'a great engineer for this role' yet has no reliable generator for producing one — sourcing, interviewing, and reference-checking are all attempts at a generator for a test the committee could already state confidently on day one, and the gap between the two is why sharpening the criteria alone never fixes a hiring pipeline."
critical-questions:
  - "Is a reliable test always cheaper to obtain than a reliable generator, or does the asymmetry run the other way in some domains — cases where plausible candidates are easy to generate but genuinely hard to test (interpreting an ambiguous historical document, diagnosing a rare disease)?"
  - "The test/generator split explains how directed search is logically possible at all, but not why some searches succeed fast and others take forever. Two problems can each have a valid test and a valid generator and differ enormously in how quickly the generator finds a test-passing structure — what does the distinction leave out?"
  - "Newell and Simon frame chess's winning-move generator as simply 'not known' — a gap to eventually fill. Are there test/generator gaps that are permanent in principle rather than currently unfilled (a test for 'the ethically correct decision' with no generator that could ever reliably produce one), and how would you tell the two kinds of gap apart in advance?"
