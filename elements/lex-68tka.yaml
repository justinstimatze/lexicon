id: lex-68tka
name: mercy-extended-to-a-suffering-animal-based-on-shared-vulnerability-not-utility
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A group with no practical reason to help can let distressed wild animals shelter close by rather than driving them off, extending protection purely because they recognize the animals' suffering from the same cold that had nearly threatened the group's own survival, with no transactional benefit expected. Camped in a hard-won shelter after a brutal, near-starving hunt in a blizzard, Black Elk's party hears porcupines crying outside: 'there was a party of porcupines huddled up as close as they thought they dared to be, and they were crying because they were so cold. We did not chase them away, because we felt sorry for them.' The porcupines offer nothing in return -- no food, no warning, no reciprocal aid -- and the group had every reason to guard its hard-earned warmth exclusively. The mercy is granted anyway, on the strength of recognized suffering alone."
related: []
evokes: [black-elk-speaks, grandmothers-land, party-of-porcupines, crying-because-they-were-so-cold, we-did-not-chase-them-away]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch12-grandmothers-land
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 12, 'Grandmother's Land.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "During the night I heard a whimpering outside the shelter, and when I looked, there was a party of porcupines huddled up as close as they thought they dared to be, and they were crying because they were so cold. We did not chase them away, because we felt sorry for them."
canonical-instances:
  - "A group of stranded hikers sharing a small emergency shelter during a storm lets a shivering stray dog they encounter squeeze in with them, gaining nothing from the animal's presence beyond the simple fact of not turning away a creature suffering the same cold they'd just survived."
  - "Refugees crowded into limited emergency housing quietly make room for a family of strangers found freezing outside, extending shelter to people who bring no resources or connections, purely on the strength of shared recent suffering."
  - "A struggling family that has just managed to feed themselves after a lean month sets aside a small portion for a neighbor's hungry cat they have no attachment to, moved by a suffering that mirrors what they themselves narrowly escaped."
critical-questions:
  - "Does having just survived their own near-starvation actually make the group more likely to extend mercy to a suffering animal, or would they have shown the same compassion in a moment of comfortable abundance with nothing recently at stake?"
  - "Porcupines specifically keep a wary distance, 'as close as they thought they dared to be' -- does the animals' own caution, not pressing the group's generosity too far, make the mercy easier to extend than it would be toward a bolder or more demanding creature?"
  - "Is there a meaningful difference between actively inviting a suffering animal to shelter and simply choosing not to drive it away -- does the passive form of mercy shown here cost the group anything real, or is it mercy at no real price to the giver?"
status: active
