    text: martin-1957-uncooperative-patient-definition
    citation: "William Martin, \"Preferences for Types of Patients,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.199, citing Doris Schwartz's The Use of Nursing Care Plans with a Group of Fifty Non-Conformist Clinic Patients, Cornell University Medical College, Comprehensive Care and Teaching Program Research Memorandum No. 2, Series B, December 1955. Quote ends ahead of a footnote-reference glyph glued directly onto the final word in the extraction."
    quote: 'The concept of the "uncooperative patient" is deeply embedded in medical practice. In a study recently conducted in the outpatient clinic of a teaching hospital, for example, it was found that students, faculty, and other medical personnel could readily describe the uncooperative patient. As they formulated it, a patient is uncooperative "when he is stubborn," "when he won''t recognize that help is being given to him," "when he refuses to accept his condition," or when he fails to appreciate the effort that has been expended on his behalf.'
