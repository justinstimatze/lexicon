id: lex-bj7ak
name: distributional-shape-claim-requires-positive-statistical-test-not-eyeballed-log-log-fit
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a claim asserts a distributional SHAPE — power-law, heavy-tailed, scale-free, Pareto, Zipfian — over empirical data, do NOT accept it on the basis of a straight-looking line on log-log axes, a least-squares regression to log-binned counts, or a reported single point-estimate of the scaling exponent. A principled test has three steps and produces a discrete answer: (1) estimate xmin and α by maximum likelihood (NOT by linear regression on log-log axes — that biases the exponent), (2) compute a goodness-of-fit p-value by KS-distance against bootstrapped synthetic samples from the fitted model (Clauset's conservative cutoff: reject the power-law if p ≤ 0.1), (3) compare against NAMED alternative distributions (lognormal, exponential, stretched-exponential, power-law-with-cutoff) by likelihood ratio with significance test. A high p-value alone is not evidence FOR power-law; it only fails to rule it out. The lognormal usually survives the same test and frequently fits equally well or better — so 'distribution is power-law' usually OVER-claims what the data licenses; the honest claim is 'consistent with power-law but indistinguishable from lognormal.' Clauset's recipe applied to 24 widely-cited 'power-law' data sets ruled out 7 outright (HTTP connections, earthquakes, web links, forest-fire sizes, wealth, web hits, metabolic network); the previously-published exponents for protein-interaction and citation networks were not merely imprecise but incompatible with the principled MLE values. The transferable move: distributional-shape claims (not just power-law — also normal/Gaussian, exponential, lognormal) need a POSITIVE statistical test against named alternatives, not absence-of-obvious-disagreement on a graph."
related: [lex-wtkuz, lex-nn3u9, lex-vk65z, lex-6bycb, lex-k9ku5, lex-zag9z]
scaffolds-from: [lex-zag9z, lex-wtkuz, lex-nn3u9, lex-6bycb, lex-k9ku5]
evokes: [maximum-likelihood-estimation, kolmogorov-smirnov-statistic, goodness-of-fit-p-value, likelihood-ratio-test, model-comparison-not-confirmation, log-log-eyeball-fit, least-squares-on-log-binned-counts-biases-exponent, power-law-vs-lognormal-indistinguishable, heavy-tailed-distribution-claim, scale-free-network-claim, pareto-zipf-power-law, xmin-cutoff-required, n-too-small-doesnt-rule-out, ad-hoc-fitting-without-test, distributional-shape-vs-distributional-tail, named-alternative-hypothesis]
lineage:
  - source: primary
    text: clauset-shalizi-newman-2009-power-law-distributions-empirical-data
    citation: "Aaron Clauset, Cosma Rohilla Shalizi, M. E. J. Newman, 'Power-Law Distributions in Empirical Data,' *SIAM Review* 51(4):661-703 (2009); arXiv:0706.1062v2 [physics.data-an] 2 Feb 2009. The canonical methodological paper that imposes statistical discipline on a decade of casual 'power-law' claims across complex-systems, network-science, economics, geophysics, and biology. The paper's transferable contribution is in three parts. (i) Diagnosis of the failure mode: 'Commonly used methods for analyzing power-law data, such as least-squares fitting, can produce substantially inaccurate estimates of parameters for power-law distributions, and even in cases where such methods return accurate answers they are still unsatisfactory because they give no indication of whether the data obey a power law at all' (Abstract, p.1). The diagnosis names two distinct failures: parameter-inaccuracy (least-squares on log-binned counts gives biased α) AND absent test-of-whether-power-law-holds-at-all (visual fit cannot distinguish power-law from lognormal over moderate ranges). (ii) Proposed recipe (Box 1, p.3): '1. Estimate the parameters xmin and α of the power-law model using the methods described in Section 3 [maximum-likelihood]. 2. Calculate the goodness-of-fit between the data and the power law using the method described in Section 4 [KS-distance vs bootstrapped synthetic samples]. If the resulting p-value is greater than 0.1 the power law is a plausible hypothesis for the data, otherwise it is rejected. 3. Compare the power law with alternative hypotheses via a likelihood ratio test, as described in Section 5. For each alternative, if the calculated likelihood ratio is significantly different from zero, then its sign indicates whether the alternative is favored over the power-law model or not.' The conservative p ≤ 0.1 cutoff is deliberately stricter than the conventional 0.05 because the authors 'feel this would let through some candidate distributions that have only a very small chance of really following a power law' (p.17). (iii) Empirical correction of the published record (Section 6, Table 6.1): of 24 widely-cited data sets each previously conjectured to follow a power-law distribution, '17 of the 24 data sets are consistent with a power-law distribution. The remaining seven data sets all have p-values small enough that the power-law model can be firmly ruled out. In particular, the distributions for the HTTP connections, earthquakes, web links, fires, wealth, web hits, and the metabolic network cannot plausibly be considered to follow a power law' (p.21). Previously-published scaling parameters differ 'considerably' from MLE values — the protein-interaction network exponent reported as 2.44 in prior work is 'incompatible with' the MLE value of 3.1 ± 0.3; citation-distribution exponents reported as 2.9 or 2.5 are 'incompatible with' the MLE value of 3.16 ± 0.06 (p.21). (iv) The lognormal stress-test (Section 6, Tables 6.2-6.3): 'The log-normal, on the other hand, is not ruled out for any of our data sets' (p.34) — even the surviving 17 power-law-consistent data sets have lognormal as a comparable or better fit, so 'consistent with power-law' should NOT be read as 'is power-law.' The honest claim is 'consistent with power-law but indistinguishable from lognormal.' Open-source reference implementation provided at http://www.santafe.edu/~aaronc/powerlaws/ (Python, R, Matlab); the SciPy-ecosystem standard powerlaw package (Alstott, Bullmore, Plenz 2014) is the direct descendant."
    quote: "Commonly used methods for analyzing power-law data, such as least-squares fitting, can produce substantially inaccurate estimates of parameters for power-law distributions, and even in cases where such methods return accurate answers they are still unsatisfactory because they give no indication of whether the data obey a power law at all. Here we present a principled statistical framework for discerning and quantifying power-law behavior in empirical data. Our approach combines maximum-likelihood fitting methods with goodness-of-fit tests based on the Kolmogorov-Smirnov statistic and likelihood ratios... [Box 1 recipe:] 1. Estimate the parameters xmin and α of the power-law model using the methods described in Section 3. 2. Calculate the goodness-of-fit between the data and the power law... If the resulting p-value is greater than 0.1 the power law is a plausible hypothesis for the data, otherwise it is rejected. 3. Compare the power law with alternative hypotheses via a likelihood ratio test... [Empirical correction:] The p-values in Table 6.1 indicate that 17 of the 24 data sets are consistent with a power-law distribution. The remaining seven data sets all have p-values small enough that the power-law model can be firmly ruled out. In particular, the distributions for the HTTP connections, earthquakes, web links, fires, wealth, web hits, and the metabolic network cannot plausibly be considered to follow a power law... [On non-confirmation:] The log-normal, on the other hand, is not ruled out for any of our data sets. (Clauset, Shalizi & Newman 2009, SIAM Review 51(4):661-703, pp.1, 3, 17, 21, 34)"
  - source: practitioner
    text: stumpf-porter-2012-critical-truths-about-power-laws
    citation: "Michael P. H. Stumpf, Mason A. Porter, 'Critical Truths About Power Laws,' *Science* 335(6069):665-666 (10 February 2012). doi:10.1126/science.1216142. A direct invocation of Clauset's methodological discipline applied to biology: the authors argue that the 'scale-free networks' claim that dominated 2000s network biology (Barabási-Albert preferential-attachment papers, protein-interaction-network claims, metabolic-network claims) has been over-claimed precisely because the Clauset-Shalizi-Newman test was not run. They write that 'in many cases, an analytical bridge between a phenomenon and a mechanism is not provided by the assertion of an underlying power-law' and call out the specific scientific cost: 'A statistical model is not a substitute for a mechanistic theory.' Stumpf-Porter is the secondary corroboration that the Clauset-Shalizi-Newman methodological correction was not just academic statistics — it reset the empirical baseline of an entire decade's network-science literature."
    quote: "Although a great deal of attention has been paid to long-tailed distributions in biology, much of it is uncritical: Long-tailed distributions are typically equated with power laws, which are then often interpreted as evidence of universal underlying mechanisms... Most reported power laws lack statistical support and mechanistic backing. In many cases, an analytical bridge between a phenomenon and a mechanism is not provided by the assertion of an underlying power-law. (Stumpf & Porter 2012, Science 335:665-666)"
canonical-instances:
  - "operationally distinct from lex-vk65z convergent-independent-evidence-streams-warrant-claim-acceptance: lex-vk65z is the converse claim — many independent corroborations make a claim safe. lex-bj7ak concerns a single empirical data set, where the test is comparison-against-named-alternatives via likelihood ratio, not corroboration-counting. Clauset's framework deliberately does not treat each surviving alternative-distribution test as a corroboration of the power-law; power-law and lognormal often both survive, and the honest answer is 'indistinguishable,' not 'confirmed by elimination.'"
  - "operationally distinct from lex-6bycb necessity-and-sufficiency-of-evidence-classify-process-tracing-tests (Van Evera): Van Evera's hoop / smoking-gun / doubly-decisive / straw-in-the-wind framework is for historical-causal claims. The structural analogy holds (KS goodness-of-fit is hoop-like: failure rules out, success doesn't confirm; the LR test is straw-in-the-wind: weights evidence against named alternatives) but lex-bj7ak is the distributional analog applied to a different question-type."
  - "operationally distinct from lex-k9ku5 plurality-of-causes-without-experiment-forces-deductive-verification (Mill Book III Ch.VI): Mill's claim is that observational data with plural causes requires deductive elimination via tests of alternative causal hypotheses. lex-bj7ak is that same logic applied to distributional models rather than causal models — Clauset's LR test against named alternatives is Mill's deductive-elimination move, instantiated for distribution comparison."
  - "The seven firmly-ruled-out data sets from Clauset Table 6.1 (Section 6): HTTP connections (Mossa et al. 2002), earthquake intensities (Bak et al.), web inbound-link counts (Albert-Barabási-Jeong), forest-fire sizes (Newman 2005 cited example), wealth distribution (Forbes 400), web outbound-hit counts (Adamic-Huberman), and metabolic-pathway network degree (Jeong et al. 2000). Each was previously cited in published-research as a canonical power-law example; each fails the Clauset goodness-of-fit test at p < 0.1. The empirical correction: a power-law claim survives published peer review on a log-log plot for years before the principled test arrives."
  - "Citation-distribution exponent (Redner 1998; de Solla Price 1965): previously reported as α = 2.9 (Redner via [62]) or α = 2.5 (Laherrère & Sornette via [33]). Clauset MLE finds 3.16 ± 0.06 — explicitly 'incompatible with' both prior estimates. The visual-eyeball / regression-on-log-binned methods produced not just imprecise but wrong-direction exponents."
  - "Protein-interaction network degree distribution (Yook-Oltvai-Barabási 2004 via [70]): previously reported α = 2.44; Clauset MLE finds 3.1 ± 0.3. The exponent is what's loaded into theoretical claims about preferential-attachment mechanism — getting it 0.66 too low licenses different mechanism-stories than the true value supports."
  - "Lognormal-not-ruled-out for any of 24 data sets (Clauset Table 6.4): even the 17 'consistent with power-law' data sets all have lognormal as a comparable or better fit by likelihood ratio. The honest claim across nearly all empirical heavy-tail data is 'consistent with power-law but indistinguishable from lognormal' — not 'is power-law.' The Mitzenmacher 2004 review ('A brief history of generative models for power law and lognormal distributions,' Internet Mathematics 1:226-251) had previously noted that the mechanism-stories for power-law and lognormal generation are equally plausible; Clauset puts this on quantitative footing."
  - "Stumpf-Porter 2012 Science correction of network-biology: 'scale-free network' was the vital claim for a decade of network-systems-biology (Barabási-Oltvai 2004 Nat Rev Genet; Albert 2005 J Cell Sci), licensing universal mechanism-stories (preferential-attachment as the canonical generative mechanism). Running Clauset's test on the canonical network-biology data sets shows that the scale-free-network claim was not statistically supported in most cases. The retrospective cost: a decade of mechanism-stories built on a distributional shape claim that was eyeballed, not tested."
  - "The n < 100 sub-sample failure mode (Clauset Section 4.2, Fig. 4.1b): when sample size is small, the power-law goodness-of-fit p-value will be high even for non-power-law data, because there simply isn't enough data to distinguish distributions. A high p-value with small n is uninformative; the test's discriminating power is itself a function of n. Critical for fields with limited data — early-stage social-science studies, biological replication studies — where 'we tested for power-law and it survived' may just mean 'we had too few data points to test anything.'"
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is the GENERIC primitive that vague descriptions must be made testable. lex-bj7ak is the SPECIFIC three-step test for distributional shape claims. lex-bj7ak is what lex-wtkuz looks like for one class of claims."
  - "operationally distinct from lex-nn3u9 extraordinary-claims-require-extraordinary-evidence: lex-nn3u9 is the asymmetric evidence-bar rule; lex-bj7ak supplies the substrate fact (7 of 24 published power-law claims fail rigorous test) that licenses raising the bar for distributional shape claims specifically."
  - "operationally distinct from lex-zag9z cross-tabulate-hypotheses-against-evidence (Heuer ACH): ACH is the generic competing-hypotheses framework for analytic intelligence. lex-bj7ak is the same posture computationally instantiated for distribution comparison — likelihood ratio IS the diagnosticity-weighted comparison ACH calls for, applied to model selection rather than hypothesis selection."
critical-questions:
  - "Did the original analyst run MLE on (xmin, α), or did they linearly regress log-binned counts? If the latter, the exponent is biased and the analysis fails the Clauset standard before goodness-of-fit even enters. Diagnostic: ask for the exponent's standard error from MLE; if it's not reported, the procedure used was probably regression."
  - "Was a goodness-of-fit p-value computed by KS-distance against bootstrapped synthetic samples drawn from the fitted model (not against the data's own empirical distribution)? Clauset's threshold is p > 0.1 to NOT-rule-out, deliberately stricter than the conventional 0.05. If the p-value is between 0.05 and 0.1, the conventional report would call this 'consistent with power-law' but Clauset's framework rejects."
  - "Have named alternative distributions been compared by likelihood ratio? Minimum stress-test alternatives are lognormal, exponential, and stretched-exponential (and for discrete data, Poisson). If LR vs lognormal is small in magnitude, the honest claim is 'consistent with power-law but indistinguishable from lognormal,' not 'is power-law.' Across Clauset's 24 data sets, this is the typical outcome."
  - "Is the claimed range over which power-law holds explicit (specifically: what is xmin?), or is the claim implicitly that the WHOLE distribution is power-law? Almost no empirical distribution is power-law across its entire range; the meaningful claim is always about the TAIL above some cutoff. If xmin isn't reported, the scope of the claim is ambiguous."
  - "Is n large enough for the test to discriminate? Clauset Fig. 4.1b shows that for n < 100, even non-power-law data passes the test (high p-value) — not because the data follow a power-law but because there isn't enough data to rule it out. 'We tested and it passed' is uninformative when n is small."
  - "What mechanistic claim is being loaded onto the distributional claim? Preferential-attachment, multiplicative noise (lognormal generator), self-organized criticality, percolation, fragmentation — each implies a different power-law-or-lognormal mechanism. The distributional shape is at best WEAK evidence for any one mechanism, and (Mitzenmacher 2004; Stumpf-Porter 2012) the same data are usually compatible with multiple mechanism-stories. Demanding the distributional test is sometimes a way of asking 'on what basis are we ruling out the alternative mechanism-stories?'"
status: active
