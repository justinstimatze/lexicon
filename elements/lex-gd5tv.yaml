id: lex-gd5tv
name: performing-an-equally-absurd-desire-to-expose-the-absurdity-of-anothers-grief
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'To correct someone''s irrational grief or craving without arguing against it directly, a consoler can stage a parallel, more obviously impossible desire in front of the sufferer, letting the sufferer be the one who names the parallel absurd and, by extension, recognizes their own. In the Jataka''s tale of Matta-Kundali, a disguised deity mourns aloud for a pair of wheels made from the sun and moon, prompting exactly this recognition in the grieving brahmin watching: "Made of fine gold, and shining brilliantly My chariot is, wherein I use to lie: For this a pair of wheels I cannot find; Therefore I grieve so sore that I must die!"'
related: []
evokes: [jataka, dasanipata, matta-kundali-jataka, mirrored-folly-reductio, performed-absurdity-as-consolation]
lineage:
  - source: primary
    text: jataka-chalmers1895-matta-kundali-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 449, Matta-Kundali-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Made of fine gold, and shining brilliantly My chariot is, wherein I use to lie: For this a pair of wheels I cannot find; Therefore I grieve so sore that I must die!"
canonical-instances:
  - "To snap a friend out of obsessing over a coworker's promotion he insists he deserved more, a colleague loudly announces he is devastated he wasn't chosen as company CEO instead of the actual new hire, letting the friend hear his own logic reflected back as absurd before either of them names it."
critical-questions:
  - "Does staging an absurd parallel desire actually work better than direct argument at correcting someone's grief, or does it risk trivializing grief that, unlike the staged example, is genuinely proportionate to its cause?"
status: active
