id: lex-qr29j
name: a-sophisticated-adversary-waits-for-a-coalition-to-fracture-on-its-own
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Collective action defeats a stronger adversary only for as long as it holds together — and a sophisticated adversary knows this, so their actual strategy is patience rather than direct confrontation. The Panchatantra's doves escape a hunter's snare only by lifting it together in unison, all flying the same direction at once. The hunter, having lost this round, doesn't change his methods to overpower the union directly; he simply waits, confident in the verse's own logic: 'So long as they agree, they may carry the fatal snare away; but they will quickly disagree, and then those birds belong to me.' The threat to the coalition was never going to come from the hunter matching its strength — it was always going to come from inside, once the coordination that had briefly held them together inevitably broke down."
related: []
evokes: [panchatantra, winning-of-friends, adversary-waits-for-a-coalition-to-fracture, collective-action-holds-only-while-unified]
lineage:
  - source: primary
    text: panchatantra-ryder1925-the-doves-united-escape
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book II, frame story (the doves' escape and the hunter's response). Verified verbatim against a direct extraction of the held copy."
    quote: "So long as they agree, they may Carry the fatal snare away; But they will quickly disagree, And then those birds belong to me."
canonical-instances:
  - "a cartel of small suppliers successfully holds firm against a dominant buyer's price pressure for one negotiating cycle, and the buyer, rather than escalating the fight, simply waits out the next several months for the suppliers' own competing interests to reassert themselves and the coalition to dissolve on its own."
critical-questions:
  - "Is patience actually a distinct strategy here, or is it simply what's left once direct confrontation has already failed — does the hunter have any real alternative to waiting, given that he's already tried and failed to defeat the union directly?"
  - "What would it take for the doves' coalition to hold indefinitely rather than eventually fracturing — is disagreement an inevitable outcome of any coalition given enough time, or could a specific structural fix have prevented it?"
status: active
