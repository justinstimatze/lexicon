id: lex-qtged
name: retelling-an-old-fools-failures-lets-an-audience-recognize-its-own
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Retelling a familiar comic figure's specific, well-known failures, then explicitly following each one with 'so do we,' lets an audience recognize their own present-day behavior in an old story without ever being accused directly, since the criticism arrives through a shared character everyone already knows rather than through a pointed finger. In a Peyote-rite homily Radin records, a speaker retells Wakdjunkaga dancing all night to noise he mistook for other dancers, then draws the line explicitly: ''So do we Winnebago act. We dance and make a lot of noise but in the end we accomplish nothing.'' The pattern repeats with a second story, Wakdjunkaga tricking birds into a dance where they must keep their eyes closed while he kills them one by one, followed by: ''So are we Winnebago. We like all that is forbidden. We say that we like the Medicine Rite; we say that it is good and yet we keep it secret and forbid people to witness it... We, the Winnebago, are the birds and Wakdjunkaga is Satan.'' Each old episode is chosen specifically because its shape matches a real, current failure in the audience's own community, and the refrain does the work of connecting them without the speaker ever naming a single living person's specific behavior. Diagnostic move: when you need to deliver criticism to a group about its own current failures without triggering the defensiveness of direct accusation, look for an old, shared story whose shape already matches the failure, and let the audience complete the comparison themselves rather than stating the criticism outright."
