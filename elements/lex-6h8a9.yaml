id: lex-6h8a9
name: feigning-ignorance-of-a-former-status-reads-as-arrogance-not-elevation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Someone newly elevated to a higher station who performs total unfamiliarity with their own past — as if the ordinary things they once handled daily were now beneath even their recognition — risks having that performance read not as successful transformation but as intolerable, insulting pride. In the Jataka's tale of Sujata, a former street vendor elevated to chief queen watches the king eating jujubes and asks what they even are, as though she'd never once carried a basket of the same thing on her own head: 'What is this egg-shaped fruit, my lord, so pretty and red of hue, In a gold dish set before thee?' The king reads this not as royal dignity but as unbearable conceit, and nearly casts her out over it: 'Thou art eaten up with pride, my queen, thou findest no pleasure in life.'"
related: []
evokes: [jataka, catukkanipata, sujata-jataka, performed-amnesia-about-ones-own-past-reads-as-vanity, elevation-does-not-license-denying-your-own-history]
lineage:
  - source: primary
    text: jataka-chalmers1895-sujata-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 306, Sujata-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Bare-headed and meanly clad, my queen, thou once didst feel no shame, To fill thy lap with the jujube fruit, and now thou dost ask its name; Thou art eaten up with pride, my queen, thou findest no pleasure in life, Begone and gather thy jujubes again. Thou shalt be no longer my wife."
canonical-instances:
  - "An executive who rose from the warehouse floor makes a show of not recognizing the barcode scanner model still in daily use on that same floor, hoping it signals how far they've come — the staff who worked alongside them for a decade read it instead as a calculated snub of where they came from."
critical-questions:
  - "Was Sujata's question actually feigned ignorance meant to signal status, or could it have been an innocent, unrelated question that the king simply chose to interpret as an insult — does the mechanism require the ignorance to be performed, or just perceived that way?"
  - "Is there a way to signal a genuine change in status without it reading as a repudiation of one's own past, or is some tension between the two unavoidable?"
status: active
