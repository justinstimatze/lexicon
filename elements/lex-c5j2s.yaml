id: lex-c5j2s
name: valid-reasoning-is-practically-inert-without-persuasive-eloquence
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern whenever the question is not whether an argument is CORRECT but whether a correct argument will actually MOVE an audience to assent and act — and someone is implicitly assuming that logical validity and persuasive/motivational force are the same property, so that a demonstrably sound argument should be self-executing. Skinner documents this as Hobbes's own, twice-reversed, considered position across his career, which is what makes it a strong canonical instance: an expert held the opposite view first, on principle, then revised it based on the practical failure of pure demonstration to move people. EARLY HOBBES (The Elements of Law, 1640; De Cive, 1642) explicitly rejects eloquence as unnecessary and holds that valid reasoning is self-sufficient to compel assent. Skinner summarises the position: 'He denies, however, that it will ever be necessary to employ the arts of persuasion to bring about these results. He insists that persuasion must be categorically distinguished from teaching, and that the arts of persuasion have no legitimate place in the process of teaching at all. This is because the methods of recta ratio, and hence the procedures of all the genuine sciences, serve in themselves to dictate the acceptance of the truths they find out. They supply us with demonstrations evident to the meanest capacity, giving rise to conclusions that admit of no controversy and cannot possibly be gainsaid.' Hobbes states the same confidence in his own words in the De Cive epistle dedicatory: 'there is a certain thread of reason which, when we are guided by it, serves in itself to bring us to the clearest light' (filum quoddam rationis, cuius ductu evaditur in lucem clarissimam) — and at that exact point where classical rhetoric would have him establish his own ethos, he instead praises his dedicatee for ignoring 'the reputation of writers, the alleged novelty of their arguments, or the outward splendour of their style,' reserving admiration 'not for the status of authors but for the firmness of their arguments themselves.' LATER HOBBES (Leviathan, 1651, further extended in the Latin Leviathan of 1668) reverses this on the basis of observed practical failure, not new logic. Skinner names it directly: 'If we turn from these pronouncements of 1640 to the Leviathan of 1651, we encounter a remarkable change of mind... Hobbes now endorses in large measure the humanist analysis of the relations between reason and rhetoric which he had earlier sought to challenge and supersede. He acknowledges that \"the Sciences are small Power\", and cannot hope in themselves to persuade us of the findings they enunciate. He accepts in consequence that, if reason is to prevail, we shall need to supplement and enforce its findings by means of the rhetorical arts.' Hobbes's own compressed formula for the reversal, Leviathan ch.10: '\"The Sciences are small Power\", he now concedes, but \"Eloquence is Power\", and is indeed to be numbered among the most eminent faculties of the human mind.' The core statement of the claim itself — Hobbes's own words, Leviathan p.483, quoted in full by Skinner as 'Hobbes's volte face' — states the two-component thesis explicitly: 'In all Deliberations, and in all Pleadings, the faculty of solid Reasoning is necessary: for without it the Resolutions of men are rash, and their Sentences unjust: and yet if there be not powerfull Eloquence, which procureth attention and Consent, the effect of Reason will be little. But these are contrary Faculties; the former being grounded upon principles of Truth; the other upon Opinions already received, true, or false; and upon the Passions and Interests of men, which are different and mutable.' Hobbes's own diagnosis of WHY sound demonstration fails to move people is that assent is contaminated by interest, not merely ignorance — his own illustration is deliberately absurd to make the point vivid: 'I doubt not, but if it had been a thing contrary to any mans right of dominion, or to the interest of men that have dominion, That the three Angles of a Triangle, should be equall to two Angles of a Square, that doctrine should have been, if not disputed, yet by the burning of all books of Geometry, suppressed, as farre as he whom it concerned was able.' Even geometric certainty — the paradigm case of a demonstration nothing could possibly contest — would be resisted if it touched someone's interest; therefore validity alone was never going to be sufficient, and only eloquence (engaging passions and received opinions, not supplying more demonstration) can close the gap. The transferable claim: LOGICAL VALIDITY and PERSUASIVE/MOTIVATIONAL EFFICACY are two separate properties of an argument, and correctness does not entail the power to move an audience to act on it. In any domain where the goal is not merely to BE right but to get people — voters, patients, employees, a public — to ACT on what is right (politics, public-health messaging, organizational change, policy advocacy, courtroom argument, activist communication), rhetorical craft is not a corruption of reasoning laid on top of a self-sufficient argument; it is a second, non-optional component alongside validity, because the audience's assent is governed by passions, received opinions, and interests that a valid demonstration does not by itself touch. DISTINCT from lex-bkaum (pisteis-ethos-pathos-logos-as-three-independent-proof-channels, Aristotle): lex-bkaum is a TAXONOMY of the channels through which persuasion can be achieved (character, emotion, argument-internal proof) — a descriptive decomposition usable to analyze any persuasive artifact's channel-balance. This atom is narrower and sharper: it is not a taxonomy of persuasive means but a specific claim about VALID REASONING'S OWN INSUFFICIENCY — that the logos channel, however strong, does not by itself generate motivational force, illustrated not by a general theory but by one philosopher's own documented, twice-reversed change of mind. Where lex-bkaum asks 'which channel is doing the work here?', this atom answers a narrower prior question: 'even granting the logos channel is maximally strong (a valid, demonstrative argument), is that alone sufficient?' — and Hobbes's own career says no. DISTINCT from lex-b9sqg (reason-as-slave-of-passions-instrumental-only, Hume): Hume's is a general METAPHYSICAL/ARCHITECTURAL claim about any individual agent's psychology — that reason can never originate motivation for ANY agent, full stop, because reason only discovers means to ends that passion alone supplies. This atom is a narrower, PRACTICAL/RHETORICAL claim about the efficacy of an argument in winning an AUDIENCE'S assent in civil and political life — it is compatible with (and can be read as Hume's architecture playing out at the social-persuasion scale: Hobbes's own explanation for why demonstration fails is precisely that audiences' 'Passions and Interests' override the 'principles of Truth') but is a distinct, more specific, historically-documented claim about rhetoric's necessary role, not a claim about the impossibility of reason-generated motivation as such. Cross-domain applications: (a) PUBLIC HEALTH MESSAGING — a scientifically valid statement of vaccine efficacy or risk data does not, by itself, move a hesitant public to act; the data's validity and its power to change behavior are separate variables, and campaigns that only supply more or better data while treating persuasion as beneath a 'real' science communicator are repeating early Hobbes's mistake; (b) ORGANIZATIONAL CHANGE MANAGEMENT — a technically correct business case for a change (the numbers are right, the logic is sound) routinely fails to move an organization because it was never coupled to a narrative that engages the passions and existing opinions of the people who must adopt it; (c) POLICY ADVOCACY AND ACTIVISM — demonstrating that a policy is optimal by the numbers is a necessary but not sufficient condition for public adoption; the missing component is not more analysis but rhetorical craft aimed at the audience's received opinions and interests. Failure modes: (a) TREATING THIS AS A LICENSE FOR SOPHISTRY — Hobbes's own reversal explicitly retains 'the faculty of solid Reasoning' as necessary ('without it the Resolutions of men are rash, and their Sentences unjust'); the claim is that reason is necessary-but-insufficient, not that eloquence can substitute for validity; (b) COLLAPSING THIS INTO THE GENERIC 'FACTS DON'T CHANGE MINDS' COMPLAINT — the transferable content here is sharper: it is Hobbes's own, principled, twice-documented reversal, with an explicit diagnosis (interest contaminates assent) and an explicit two-component model (reason + eloquence as 'contrary Faculties' that must both be present), not a vague appeal to emotional messaging; (c) MISTAKING THIS FOR A CLAIM ABOUT INDIVIDUAL WEAKNESS OF WILL (akrasia) — the gap here is inter-personal (an arguer failing to move an audience), not intra-personal (an agent failing to act on their own known-best judgment); do not reach for this atom when the phenomenon is a single agent failing to follow through on their own conclusions."
