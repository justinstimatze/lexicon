lineage:
  - source: primary
    tradition: christiano-rlhf
    text: christiano-2017-deep-rl-from-human-preferences
    citation: "Paul Christiano et al., 'Deep Reinforcement Learning from Human Preferences,' arXiv:1706.03741 (NeurIPS 2017). Abstract."
    quote: "For sophisticated reinforcement learning (RL) systems to interact usefully with real-world environments, we need to communicate complex goals to these systems. In this work, we explore goals defined in terms of (non-expert) human preferences between pairs of trajectory segments. We show that this approach can effectively solve complex RL tasks without access to the reward function, including Atari games and simulated robot locomotion, while providing feedback on less than 1% of our agent's interactions with the environment."
  - source: primary
    tradition: christiano-rlhf
    text: christiano-2017-deep-rl-from-human-preferences
    citation: "Paul Christiano et al., 'Deep Reinforcement Learning from Human Preferences,' arXiv:1706.03741 (NeurIPS 2017). Section 1 (Introduction)."
    quote: "We ask the human to compare short video clips of the agent's behavior, rather than to supply an absolute numerical score. We found comparisons to be easier for humans to provide in some domains, while being equally useful for learning human preferences. Comparing short video clips is nearly as fast as comparing individual states, but we show that the resulting comparisons are significantly more helpful."
canonical-instances:
  - InstructGPT / ChatGPT / Claude RLHF training — human raters compare pairs of model responses; reward model learns from the comparisons; LLM is fine-tuned against the reward model. Christiano 2017 is the canonical primary for the technique.
  - Wine-judging in formal competitions — wine professionals judge in flights (pairwise / N-wise) rather than scoring each wine in isolation, because absolute scoring drifts within a single tasting session.
  - Sports tournaments (chess Elo, tennis ATP rankings, MMA fight outcomes) — pairwise outcomes aggregated to a ranking; absolute 'skill score' would be unreliable.
  - Peer review of papers — implicit pairwise comparison ('this is better/worse than what we usually publish at this venue') is more reliable than absolute quality scoring, though current peer-review systems hide the comparison nature.
  - User research A/B testing — pairwise comparison of two design variants is more reliable than absolute satisfaction scoring.
  - Performance review by forced-distribution stack-ranking — comparison-based, with its own failure modes (intra-group pairwise rankings don't aggregate to absolute talent levels).
  - Stack-ranking in art / film / music criticism — 'best of year' lists are implicit pairwise comparison; the related practice of absolute 'star ratings' is empirically less reliable across raters.
