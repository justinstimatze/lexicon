id: lex-cwye8
name: reject-every-counterfeit-claimant-to-a-label-before-granting-it-to-anyone
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a valued label or status is being handed out and many people plausibly claim it, the discriminating move is to enumerate every occupational or behavioral category that superficially fits the label, test each one against the single trait that actually defines it, and reject every counterfeit in turn — rather than stopping at the first candidate who looks close enough. The exhaustive rejection is what makes the eventual grant meaningful: it proves the surviving category was selected against real alternatives, not merely the only one considered. In the Jataka's tale, a king seeking to give alms specifically to virtuous brahmins has his minister walk him through nine counterfeit occupational categories that all carry the brahmin name — herbalist-physicians, servant-messengers, importunate beggar-tax-collectors, laborers, merchants, farmer-traders, fortune-teller-butchers, armed caravan-guards, hunters, and hired ritual scapegoats — rejecting each one with the identical refrain: \"These have no right to such a name: lost is their brahminhood: / Vidhura, find me other men who shall be wise and good, / Men free from deeds of evil lust, that they may eat my food.\" Only after all nine are dismissed does Vidhura name the genuine category."
related: []
evokes: [jataka, pakinnakanipata, dasa-brahmana-jataka, exhaustive-rejection-of-counterfeit-claimants, a-label-tested-against-one-defining-trait]
lineage:
