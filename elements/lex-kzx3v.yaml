id: lex-kzx3v
name: a-single-factor-theorys-own-example-usually-proves-interdependence-not-priority
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "When rival camps each argue that one factor is THE decisive one in a multi-factor situation, don't referee by picking a winner -- check whether each side's own supporting example actually shows the factor working only under a condition supplied by one of the other 'losing' factors. Kautilya records three teachers each naming a different one of power, place, and time as most important, each backing the claim with a vivid example: 'Some teachers say that... power is the most important because a powerful king can overcome the difficulties of dry or wet terrain and the effects of heat, cold or rain. Some others hold that the place is the most important; [quoting as an example] a dog on land can pull a crocodile while [on water] a crocodile can pull in a dog. Some others hold time to be the most important; [quoting as an example] a crow can kill an owl in day-time while an owl can kill a crow at night.' Kautilya's verdict doesn't crown a fourth candidate or split the difference: 'Power, place and time are interdependent.' Look at what the place-camp's own example actually demonstrates: the dog's advantage over the crocodile isn't a place-independent property of the dog, it's entirely conditional on which terrain the fight happens on -- swap the terrain and the same dog loses. The time-camp's crow-and-owl example does the identical thing for time instead of place. Each camp's chosen illustration is, structurally, proof that the outcome depends on more than one variable at once -- the very example meant to show factor X dominating is a demonstration of factor X being switched on and off by a second factor. Diagnostic move: when competing explanations each nominate a single decisive factor and each has a clean supporting example, check whether that example's outcome would flip under a different value of one of the factors the explanation claims doesn't matter -- if it would, the example isn't evidence for a hierarchy of importance, it's evidence that the factors are jointly determining, and the right response is to assess all of them together rather than adopt whichever camp's example sounds most vivid."
