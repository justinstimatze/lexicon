lineage:
  - source: primary
    text: schneider-2019-artificial-you-act-test
    citation: "Susan Schneider, Artificial You: AI and the Future of Your Mind (Princeton University Press, 2019), Chapter 4, 'How to Catch an AI Zombie: Testing for Consciousness in Machines,' section 'The ACT Test.'"
    quote: "'These scenarios would be exceedingly difficult to comprehend for an entity that had no conscious experience whatsoever. It would be like expecting someone who cannot hear to fully appreciate the sound of a Bach concerto. ... This simple observation leads to a test for AI consciousness that singles out AIs with PC from those that merely have features of cognitive consciousness, such as working memory and attention. The test would challenge an AI with a series of increasingly demanding natural language interactions to see how readily it can grasp and use concepts based on the internal experiences we associate with consciousness. A creature that merely has cognitive abilities, yet is a zombie, will lack these concepts, at least if we make sure that it does not have antecedent knowledge of consciousness in its database.'"
  - source: primary
    text: schneider-2019-artificial-you-act-test
    citation: "Susan Schneider, Artificial You: AI and the Future of Your Mind (Princeton University Press, 2019), Chapter 4, 'How to Catch an AI Zombie: Testing for Consciousness in Machines,' section 'The ACT Test,' on boxing in the AI as a confound control."
    quote: "'I believe we can get around this problem, though. One proposed technique in AI safety involves \"boxing in\" an AI—making it unable to get information about the world or act outside of a circumscribed domain (i.e., the \"box\"). We could deny the AI access to the Internet and prohibit it from gaining too much knowledge of the world, especially information about consciousness and neuroscience.'"
  - source: primary
    text: schneider-2019-artificial-you-act-test
    citation: "Susan Schneider, Artificial You: AI and the Future of Your Mind (Princeton University Press, 2019), Chapter 4, 'How to Catch an AI Zombie: Testing for Consciousness in Machines,' on how ACT differs from the Turing test."
    quote: "'An ACT resembles Alan Turing’s celebrated test for intelligence, because it is entirely based on behavior—and, like Turing’s test, it could be implemented in a formalized question-and-answer format. But an ACT is also quite unlike the Turing test, which was intended to bypass any need to know what was transpiring inside the “mind” of the machine. By contrast, an ACT is intended to do exactly the opposite: it seeks to reveal a subtle and elusive property of the machine’s mind.'"
canonical-instances:
  - "A teacher suspects a student memorized a proof rather than understanding it. Reproducing the proof on request proves nothing, since memorization alone gets that far. The teacher instead asks what happens to the proof if one premise is altered, a variant the student never memorized and only genuine understanding can answer correctly."
  - "An interviewer suspects a candidate has rehearsed answers to common behavioral-interview questions from public prep guides, so instead of asking those questions directly, the interviewer probes for the candidate's own novel framework applied live to a scenario the guides could not have anticipated, and additionally confirms the candidate had no advance knowledge of the specific scenario."
  - "A researcher testing whether a claimed telepathy is real, rather than cold-reading, ensures the claimant has zero prior access to information about the subject and zero opportunity to observe cues -- an evidential structure directly parallel to boxing in the AI, denying the subject any channel by which a convincing-looking performance could be produced without the claimed underlying capacity."
  - "Operationally distinct from lex-29fvm replace-definitional-question-with-operational-test (Turing): Turing's move sets the essence-question aside entirely and substitutes a criterion both sides agree to treat as decisive regardless of what is 'really' happening inside the system -- the inner state stops being the target. This atom's move keeps the inner, unobservable property as the actual target of inquiry, and uses a specifically-chosen behavior plus a prior-access control as indirect evidence FOR that inner property, rather than a replacement for asking about it."
critical-questions:
  - "Schneider herself flags that ACT can only produce false negatives, not false positives -- an entity could have genuine inner experience yet lack the conceptual sophistication to pass (an infant, certain nonhuman animals, or an alien-architected AI with no analog to human self-modeling). How does a practitioner applying this pattern outside AI consciousness testing establish, for their own domain, whether the proxy behavior is failing to detect true positives the same way?"
  - "Boxing in a test subject is expensive and sometimes impossible in domains outside a research lab (you often cannot control what a job candidate has read, or what a student was exposed to before an exam). What is the actual evidential strength of the pattern when the prior-access control is partial or unverifiable rather than complete?"
  - "The pattern that a capable-enough mimic could eventually learn to fake even the escalating, self-generated, unprompted register the test looks for -- at what point does 'sufficiently sophisticated behavioral mimicry, denied the specific vocabulary, still manages to reconstruct the relevant concepts from more general training' break the confound control entirely?"
