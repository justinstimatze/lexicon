id: lex-njxgx
name: personifying-abstract-moral-concepts-as-directly-confronting-agents
type-in: claim
type-out: process
_tier: atomic
agent-instruction: 'An ethical conflict can be dramatized not as discourse or internal deliberation but as a physical, social encounter, by embodying the abstract categories themselves — Right, Wrong — as literal characters with chariots, retinues, and speech who meet face to face. In the Jataka''s tale of Right and Wrong, the two moral categories are gods who circle the world in opposite directions and collide: "Once upon a time, when Brahmadatta was king in Benares, the Bodhisatta was born into the world of sense as one of the gods, and was named Dhamma, or Right, while Devadatta was called Adhamma, or Wrong."'
related: []
evokes: [jataka, ekadasanipata, dhamma-jataka, allegorical-personification, psychomachia]
lineage:
  - source: primary
    text: jataka-chalmers1895-dhamma-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 457, Dhamma-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Once upon a time, when Brahmadatta was king in Benares, the Bodhisatta was born into the world of sense as one of the gods, and was named Dhamma, or Right, while Devadatta was called Adhamma, or Wrong."
canonical-instances:
  - "A workplace-safety training video stages 'Corner-Cutting' and 'Following Procedure' as two characters arguing over which one gets to walk the factory floor first, rather than lecturing on the abstract policy directly."
critical-questions:
  - "Does personifying the categories as combatants clarify the underlying ethical claim, or does the drama of the confrontation risk making the outcome feel like a contest of strength rather than a demonstration of which position is actually correct?"
status: active
