canonical-instances:
  - "A scrappy startup founder's personal drive and technical skill (enthusiasm) loses to a well-funded competitor's ability to simply hire away the founder's best engineers (might), which in turn loses to a smaller, better-capitalized competitor who correctly reads the market and undercuts both of them with a sharper positioning strategy (judgment) that neither the drive nor the money alone could substitute for."
  - "A litigant with a strong personal conviction that they're in the right (enthusiasm) is outmatched by an opponent who can simply afford better lawyers and more filings (might), but the opponent's legal resources are in turn neutralized by a third party with more modest resources who identifies the one procedural argument that resolves the case immediately (judgment), overwhelming a much better-funded adversary who never found it."
critical-questions:
  - "does the claim that judgment can always overcome might understate how much a sufficiently large might advantage can simply brute-force past clever strategy -- are there real thresholds of overwhelming material advantage where superior judgment stops being able to compensate, regardless of how well-directed the weaker side's resources are?"
  - "how does a party actually assess, in the moment, whether they hold a genuine judgment advantage rather than merely believing they do -- unlike might, which can be measured somewhat objectively (troop counts, budgets, resources), judgment is self-assessed, and an overconfident but mediocre strategist could easily misjudge their own position in this hierarchy?"
  - "does might's ability to 'buy' enthusiasm (hiring or winning over heroic fighters) generalize cleanly to modern contexts where loyalty, morale, and genuine commitment are harder to purchase outright than raw troop numbers were -- does a well-funded but low-morale organization actually out-execute a smaller, more genuinely motivated one as reliably as the elephant-army logic suggests?"
