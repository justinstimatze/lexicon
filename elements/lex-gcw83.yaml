lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The History of Our Time: An Optimist's View' (the Sixth Eleanor Rathbone Memorial Lecture, delivered at the University of Bristol, October 12, 1956), Ch. 19 of Conjectures and Refutations (Routledge Classics, 2002), pp.492-496."
    quote: "'We are good, perhaps a little too good, but we are also a little stupid; and it is this mixture of goodness and stupidity which lies at the root of our troubles... The main troubles of our time... are not due to our moral wickedness, but, on the contrary, to our often misguided moral enthusiasm: to our anxiety to better the world we live in... our moral principles, which are sure to be over-simple, are often difficult to apply to the complex human and political situations to which we feel bound to apply them... when something is so plainly the work of the devil, . . . nothing can excuse a minister of the Church from working for its destruction... But moral fervour blinded him, and many like him, to facts which others could easily see; for example, to the fact that countless innocent people were being tortured in Stalin's prisons... it seems to me possible that more people are killed out of righteous stupidity than out of wickedness.'"
canonical-instances:
  - "A consumer advocacy group builds its entire campaign around exposing one domestic company's labor conditions, genuinely convinced it represents corporate cruelty at its worst. Their outrage is sincere and largely accurate. But it leaves them unable to see that the overseas manufacturer they're steering shoppers toward instead runs conditions considerably worse -- the same moral fervor that sharpened their eye for the flaw at home blinds them to the far larger flaw in the alternative they're promoting."
  - "A community organization sincerely committed to correcting a local institution's past failures spends years building a case against it, convinced of its own righteousness. Meanwhile the replacement program it champions in the institution's place quietly reproduces several of the same harms, unexamined, because the group's moral attention stayed fully absorbed by the target it had already identified as the enemy."
critical-questions:
  - "Isn't this just relativism, treating the target of moral criticism as no worse than the alternative? Popper's own example refuses that reading: the Bishop's target really was flawed, and Stalin's system really was worse, by any measure. The comparison the atom targets is narrower: sincerity and moral fervor toward one target say nothing about the accuracy of a comparison being implicitly drawn against another."
  - "How do you actually tell honest moral clarity about a real evil apart from the blindness this describes? Watch where the scrutiny goes, not how confident it feels. Blindness shows up as an asymmetry -- rigorous examination of one side's facts and an absence of the same rigor toward the other -- rather than as any error in the specific claims being made about the side under fire."
