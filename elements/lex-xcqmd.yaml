id: lex-xcqmd
name: set-terms-so-the-targets-own-position-produces-their-downfall
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need to neutralize someone who still has a legitimate claim or following you can't simply attack directly, don't act against them yourself -- give them a position whose own terms will turn the people they depend on against them, so their downfall looks like their own failure of leadership rather than your intervention. Kautilya's instruction for handling a rival claimant to the throne after a conquest works exactly this way: 'a pretender from the enemy's family who can recover the territory... shall be tackled by giving him sterile land or land which is, at best, one-quarter fertile. The grant shall be made subject to payment of an exorbitant tribute in money and troops, so that its payment will make the citizens in the towns and countryside revolt and kill the prince or noble.' The conqueror never directly harms the pretender -- he grants him something that looks like a real concession (land, a title, formal legitimacy) while quietly fixing the terms so that fulfilling the obligation attached to it is impossible without alienating the very people whose support the position depends on. The pretender's own subjects, not the conqueror, become the ones who remove him, because from their perspective he's the one squeezing them for an unpayable tribute. Diagnostic move: when you need a rival or a potential threat neutralized but can't act against them directly without cost to yourself, look for a position, deal, or set of terms you can hand them that appears to satisfy their claim while quietly requiring something their own supporters won't tolerate -- and let the resulting conflict between the target and their own base do the work you'd otherwise have to do yourself."
