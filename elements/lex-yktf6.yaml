id: lex-yktf6
name: systematically-destroying-status-markers-forces-a-true-restart
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "To show a character developing from a genuinely undifferentiated starting point into a fully realized person, a story can have that character destroy every marker of their existing social position first, even markers that look wasteful or pointless in isolation, so the developmental arc that follows starts from an actual zero rather than from an already-established identity. Radin reads the opening of the Wakdjunkaga cycle exactly this way: the trickster is introduced as a chief hosting a warbundle feast, but 'hardly has he left the shore when he returns and destroys his boat as useless... he then starts on foot, but after a short time destroys both his warbundle and his arrowbundle and finds himself eventually deserted by everyone and alone.' Radin is explicit that this isn't random plot noise: 'Wakdjunkaga is to be desocialized, to be represented as breaking all his ties with man and society... he has decided that Wakdjunkaga is to be depicted as completely unconnected with the world of man and as gradually evolving from an amorphous, instinctual and unintegrated being into one with the lineaments of man.' The boat, the warbundle, the arrowbundle, and finally the human companions are each a distinct marker of social standing, and each gets destroyed in sequence before any developmental arc can begin. Diagnostic move: when a narrative, or a real transformation you're trying to engineer, needs to establish a genuine before-and-after, check whether the starting point is actually a blank slate or is still quietly carrying markers of the old identity forward -- a convincing transformation arc often requires deliberately clearing those markers first, even at the cost of looking wasteful in the moment."
