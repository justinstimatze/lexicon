id: lex-cpjma
name: triangulation-of-independent-methods
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When confirming a finding, triangulate from independent methods — different data sources, different analytic approaches. Agreement across methods that don't share failure modes is stronger evidence than any single method's precision."
related: [lex-2cjtz, lex-3gdpj, lex-6sxj4, lex-8j5ms, lex-8n237, lex-bwghp, lex-dm5te, lex-jv983, lex-k6d7u, lex-mnxhs, lex-n7dqw, lex-q9asc, lex-rfxtb, lex-rjf7d, lex-u29fu, lex-x6ft6, lex-xxmeh, lex-xza94, lex-yexax]
scaffolds-from: [lex-dm5te]
evokes: [convergent-validity, independent-methods-cross-check, divergence-as-signal, multi-method-confidence-boost, webb-unobtrusive-measures, multitrait-multimethod-matrix, mingers-multimethodology]
lineage:
  - source: primary
    text: rosenhead-mingers-2001-rational-analysis-for-a-problematic-world
    citation: "Jonathan Rosenhead & John Mingers (eds.), Rational Analysis for a Problematic World Revisited, 2nd ed. (John Wiley & Sons 2001), Ch.13 'Multimethodology' (John Mingers), p.294 — triangulation/creativity/expansion as the three advantages of method-combining, with worked examples."
    quote: "There are other advantages to combining methods (Tashakkori and Teddlie, 1998) — i) triangulation — seeking to validate data and results by combining a range of data sources, methods, or analysts; ii) creativity — discovering fresh or paradoxical factors that stimulate ideas and solutions; and iii) expansion — widening the scope of the study to take in other aspects of the situation that may be of importance. One approach is to use a variety of methods to carry out a similar function — for example using rich pictures, cognitive maps, and CSH questions to appreciate a situation; doing a simulation and then using queuing theory as a rough check; or using drama theory and strategic choice to consider different ranges of options. The other is to use some quite different method to get a new insight on the problem."
  - source: practitioner
    text: webb-campbell-schwartz-sechrest-1966-unobtrusive-measures
    citation: "Eugene J. Webb, Donald T. Campbell, Richard D. Schwartz, and Lee Sechrest, Unobtrusive Measures: Nonreactive Research in the Social Sciences (Rand McNally 1966). The original methodological articulation of triangulation in social science — multitrait-multimethod matrix, convergent vs discriminant validity. Tier-3 deepening source; cited by Mingers (verified verbatim above) as the methodological-tradition origin. Campbell's multitrait-multimethod matrix (Campbell & Fiske 1959, Psychological Bulletin 56:81-105) is the underlying psychometric formalization. The atom's vital claim rests on the Mingers verbatim above; the Webb-Campbell tradition is the deepening lineage."
    quote: "[Tier-3 deepening source; the Mingers Ch.13 verbatim (entry above) cites Tashakkori-Teddlie 1998 which itself synthesizes the Webb-Campbell triangulation-tradition. The convergent-validity discipline survives intact in the Mingers statement: independent-methods convergence raises confidence; divergence is itself a signal.]"
  - source: practitioner
    text: tashakkori-teddlie-1998-mixed-methodology
    citation: "Abbas Tashakkori and Charles Teddlie, Mixed Methodology: Combining Qualitative and Quantitative Approaches (Sage 1998). The canonical mixed-methods methodology text Mingers cites directly. Tier-3 deepening source — Tashakkori; cited by Mingers (verified verbatim above) as the source of the triangulation/creativity/expansion triad. The atom's central claim rests on the Mingers Ch.13 synthesis quoted above."
    quote: "[Tier-3 deepening source — Tashakkori; Mingers' Ch.13 (verified verbatim above) is the direct synthesis used for this atom's claim. The mixed-methods literature provides the methodological-tradition deepening but is not critical.]"
canonical-instances:
  - "scientific replication / cross-validation: a finding from method A (e.g., randomized trial) is cross-checked by method B (e.g., observational study using different statistical techniques). Convergence raises confidence beyond what either alone warrants; divergence flags hidden confounds or method-specific artifacts. The Cochrane systematic-review tradition operationalizes this."
  - "engineering: a performance regression is suspected. Method A: profile the production system. Method B: build a reproducer in a benchmark harness. Convergence ('both methods point to the same hot-path') raises confidence the fix-target is correct; divergence ('profile says X, benchmark says Y') is the signal to dig — usually there's a methodology issue in one of them."
  - "investigative journalism: multiple independent sources (FOIA documents + on-record interview + leaked memo) cross-checking the same factual claim. Convergence raises publication-confidence; one source contradicting the other two is the editorial trigger to investigate further before publishing."
  - "software testing: integration tests + unit tests + manual exploratory testing all triangulating on the same feature. Each method has different blind-spots (unit tests miss integration bugs; integration tests miss edge cases; manual testing miss what the tester didn't think to try). Convergence across all three is what 'tested' actually means; convergence across two with divergence in the third is the failure-localization signal."
  - "qualitative + quantitative cross-check: an A/B test (quantitative) shows feature X improves the headline metric. User interviews (qualitative) show users hate it. The divergence is the pivotal finding — usually it means the metric is measuring something other than the construct of interest, or the early adopters in the A/B aren't representative."
  - "substrate-mining itself (meta): atoms graduate when primary-source verbatim (method A) converges with cross-attestation across secondary literature (method B) — that convergence path IS a triangulation move. The substrate has been doing triangulation implicitly for a long time; lex-cpjma makes the move nameable."
  - "operationally distinct from lex-jv983 fluency-trap: lex-jv983 is the DETECTOR for fluent-but-unanchored single-method claims. This atom is the PROCEDURE that defeats fluency-trap risk — converging two independent methods makes the result not-merely-fluent. The two compose: fluency-trap fires when a fluent claim isn't triangulated; triangulation is the response."
  - "operationally distinct from lex-q9asc source-attribution and lex-dm5te domain-credibility: source-attribution is about a SINGLE source's credibility within a domain. Triangulation is the move OUT of single-source dependence — bring in distinct methods (each with its own credibility-conditions per lex-dm5te) and check for convergence. The substrate-as-a-whole's credibility-conditions are improved by triangulation across multiple primary-sources for each atom."
  - "operationally distinct from lex-yexax method-domain-transferability: lex-yexax says methods don't all transfer cleanly across domains. Triangulation is the move that DETECTS transfer-failure — cross-method divergence in domain Y when convergence held in domain X is the diagnostic signal that one of the methods didn't transfer."
  - "key critical question: what counts as 'independent' methods? Two methods that share the same hidden assumption (e.g., two statistical tests both relying on Gaussian-noise assumption) will spuriously converge under that assumption's failure. The discipline requires methods independent IN THEIR ASSUMPTION-STRUCTURE, not merely in their procedural form. Webb-Campbell's multitrait-multimethod matrix names this as 'method variance' — convergence within-method but across-trait is weak; convergence across-method within-trait is strong."
  - "essential edge case: deliberate convergence-engineering as failure-mode. Picking two methods BECAUSE they're known to converge (e.g., two confirmatory analyses but no falsificatory one) is anti-triangulation. The discipline requires that at least one of the methods be in principle CAPABLE of producing divergence — otherwise the 'convergence' is tautological. Falsificatory method-choice is part of the practice."
critical-questions:
  - "are the three (or N) methods actually independent — or do they share a hidden assumption / data source / methodology?"
  - "what would convergence across the methods rule out — and is that an interesting class of error?"
  - "what does divergence tell you, beyond 'one of them is wrong' — can the disagreement be diagnostic?"
  - "is the cost of running N methods worth the confidence-bump — and does it scale (linear, sublinear)?"
status: active
