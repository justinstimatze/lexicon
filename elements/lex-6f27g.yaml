id: lex-6f27g
name: three-independent-corroborating-sources-fixes-a-truth-threshold
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When you need a working rule for deciding whether to act on unverified information gathered from multiple informants who cannot directly verify each other, don't rely on a single trusted source or an open-ended 'gather more evidence until confident' standard — fix a specific corroboration count in advance and treat it as the operational truth-threshold. Kautilya states the rule for his intelligence network in one flat sentence, with no qualification about source quality or plausibility: 'Any information corroborated by three [different] spies shall be taken to be true.' The rule's value is not that three is a magic number that guarantees truth — independent sources can share a common origin, a common blind spot, or be independently deceived by the same disinformation — its value is that it converts an otherwise unbounded, judgment-call problem ('how much corroboration is enough?') into a fixed, checkable, and consistently-applied operating procedure that a large organization of agents who don't know each other and can't cross-examine each other in real time can actually execute. The rule is paired with a separate, distinct standard for the sources themselves rather than the information: 'Any agent who is consistently unreliable shall be eliminated' — reliability is tracked and enforced at the level of the individual source's track record, so a source that gets used to hit the three-corroboration threshold is also being continuously screened on a separate axis, preventing the same unreliable source from repeatedly supplying one of the three legs. Diagnostic move: when an organization needs a scalable, non-arbitrary standard for acting on information gathered from many independent low-trust sources, fix a specific corroboration count as policy rather than leaving it to case-by-case judgment, and pair it with independent tracking of each source's own reliability record — the count alone is gameable by a coordinated set of sources; the count plus source-reliability tracking is much harder to game."
related: []
evokes: [three-spies-corroboration-truth, unreliable-agent-eliminated, fixed-threshold-versus-open-ended-judgment, kautilya-secret-service-verification]
lineage:
  - source: primary
    text: kautilya-arthashastra-three-spies-corroboration
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IX 'Covert Operations,' section 'Creating the Secret Service,' {1.12.15,16}."
    quote: "'Any information corroborated by three [different] spies shall be taken to be true.' 'Any agent who is consistently unreliable shall be eliminated.'"
canonical-instances:
  - "A newsroom's editorial policy requires at least two independent sources before publishing an unconfirmed claim, and separately tracks which sources have supplied information that later turned out false — the two policies work together exactly as Kautilya's do: a fixed corroboration count for acting on a claim, and independent reliability-tracking for the sources feeding that count."
  - "A fraud-detection team sets a rule that a merchant account is only flagged for review once three independent signals (a chargeback-rate spike, a device-fingerprint match to known bad actors, and a shipping-address anomaly) all corroborate — rather than acting on any single strong-looking signal or waiting indefinitely to be fully certain, the fixed threshold lets analysts act consistently across thousands of cases without re-litigating 'how sure is sure enough' each time."
critical-questions:
  - "does a fixed count of three actually protect against coordinated deception, or does it just raise the cost of fabricating corroboration slightly (an adversary now needs three colluding or independently-fooled sources instead of one) without changing the fundamental vulnerability to a well-resourced disinformation effort?"
  - "how does this rule handle a case where two sources agree and a third contradicts — does 'corroborated by three' require unanimous agreement among exactly three, or does it tolerate some threshold of dissent among a larger pool, and does Kautilya's text actually specify which?"
  - "is fixing an arbitrary number (three, in this case) actually superior to a more calibrated approach that weights source reliability, source independence, and claim plausibility into a combined confidence score — or does the simplicity of a flat threshold trade real accuracy for operational speed and consistency, and is that trade worth it here?"
