id: lex-xhfkz
name: hazardous-attitude-recognition-triggers-a-memorized-antidote-phrase
type-in: state
type-out: process
_tier: atomic
agent-instruction: "Before a high-stakes moment arrives, taxonomize the small closed set of dangerous mental postures that predictably degrade your own decisions under pressure, and pre-assign each one a short counter-statement — an antidote — memorized well ahead of time. At the moment you catch yourself in one of those postures, don't reason it through fresh: label the thought by name and retrieve the pre-scripted antidote by rote. The mechanism works because recognition under real time pressure is fast and cheap while fresh reasoning under the same pressure is slow and exactly what the hazardous posture degrades — the fix has to already be memorized before the moment it's needed, or it arrives too late to help."
related: [lex-u7aau]
evokes: [hazardous-attitudes, faa-decision-making, anti-authority, impulsivity-invulnerability-macho-resignation, aeronautical-decision-making]
lineage:
  - source: primary
    text: faa-phak-ch2-hazardous-attitudes-and-antidotes
    citation: "Federal Aviation Administration, Pilot's Handbook of Aeronautical Knowledge, Chapter 2 'Aeronautical Decision-Making,' section 'Hazardous Attitudes and Antidotes,' Figure 2-4. Verified verbatim against pdftotext -layout extraction; the source PDF's two-column layout initially interleaved mid-sentence, resolved by reading each column at its correct wrap width before quoting."
    quote: "Studies have identified five hazardous attitudes that can interfere with the ability to make sound decisions and exercise authority properly: anti-authority, impulsivity, invulnerability, macho, and resignation. Hazardous attitudes contribute to poor pilot judgment but can be effectively counteracted by redirecting the hazardous attitude so that correct action can be taken. Recognition of hazardous thoughts is the first step toward neutralizing them. After recognizing a thought as hazardous, the pilot should label it as hazardous, then state the corresponding antidote. Antidotes should be memorized for each of the hazardous attitudes so they automatically come to mind when needed."
canonical-instances:
  - "The FAA's five named attitudes and their antidotes: anti-authority ('Don't tell me' → 'Follow the rules. They are usually right'), impulsivity ('Do it quickly' → 'Not so fast. Think first'), invulnerability ('It won't happen to me' → 'It could happen to me'), macho ('I can do it' → 'Taking chances is foolish'), resignation ('What's the use?' → 'I'm not helpless. I can make a difference'). Each is a fixed phrase-pair taught and tested on the FAA written exam specifically so it's already memorized before a real emergency arrives."
  - "Cognitive-behavioral thought-labeling techniques outside aviation (e.g. 'name it to tame it' in anger-management and anxiety-treatment protocols): the same recognize-label-retrieve structure applied to a different closed set of hazardous thought-patterns, with the antidote phrase substituted for a coping statement rehearsed in therapy before the triggering situation occurs."
  - "operationally distinct from lex-u7aau checklists-are-memory-prosthetics-engineered-around-killer-items: lex-u7aau externalizes memory into a physical or written artifact consulted step by step against a known sequence of required actions. This atom internalizes a trigger-response pair into the operator's own recognition and self-talk, with no external artifact — it fires the instant a specific internal state is noticed, whenever that happens to occur in the flight rather than at a scheduled checkpoint."
critical-questions:
  - "Was the antidote actually memorized before the moment it was needed, or is the pilot trying to construct one on the spot? The entire mechanism depends on pre-commitment; an antidote invented in the moment is just ordinary reasoning under the same degraded conditions the hazardous attitude already compromised."
  - "Does labeling a thought as hazardous actually interrupt it, or does the pilot recognize the attitude and act on it anyway? The FAA's own framework separates recognition from correction as two distinct steps — recognition without follow-through leaves the hazardous attitude fully operative."
  - "Is the taxonomy of hazardous attitudes actually exhaustive for the domain being applied to, or borrowed wholesale from aviation without checking whether the same five postures are the ones that matter elsewhere? A different domain may have a different closed set worth taxonomizing on its own terms."
status: active
