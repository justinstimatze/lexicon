id: lex-n7dqw
name: template-matching-against-theoretical-prediction-as-detection-protocol
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When detecting a signal in noise, run template-matching: compare the data against a theoretical prediction (the template). Match-strength against the prediction quantifies detection; without the template, you're hunting for patterns in noise."
related: [lex-betym, lex-cpjma, lex-nn3u9, lex-mj7x2, lex-2cjtz, lex-u29fu, lex-5b9gv, lex-ea5ug, lex-p34bd, lex-xrbzz, lex-3d2he, lex-sxt57, lex-8pv2b, lex-mx4q5, lex-xz9br, lex-dcr6p]
scaffolds-from: [lex-dcr6p, lex-ea5ug]
evokes: [matched-filter-detection, the-template-is-the-prior, optimal-detector-needs-prior-knowledge, ligo-gw150914, signal-emerges-when-prediction-meets-measurement, sub-threshold-detection-via-known-shape, the-needle-becomes-visible-when-you-know-its-shape]
lineage:
  - source: primary
    text: abbott-2016-ligo-gw150914
    citation: "B.P. Abbott et al. (LIGO Scientific Collaboration and Virgo Collaboration), 'Observation of Gravitational Waves from a Binary Black Hole Merger,' *Phys. Rev. Lett.* 116:061102 (2016), arXiv:1602.03837. The first direct detection of gravitational waves — the GW150914 event observed 14 Sep 2015 at LIGO-Hanford + LIGO-Livingston. The detection was made possible by matched-filter analysis against general-relativity-predicted inspiral-merger-ringdown waveforms for binary-black-hole coalescence. Without the theoretical template, the signal would have been ~10^-21 strain buried in detector noise; with the template, the matched-filter SNR was 24 (5.1σ significance; false-alarm rate < 1 event per 203,000 yr). The detection closes a 99-year theoretical-prediction-to-observation gap (Einstein 1916 predicted gravitational waves) and demonstrates the more general operational claim: detection of sub-threshold signals against noise is bounded by the quality of the theoretical template used to match-filter. The matched-filter is the Bayesian-optimal detector when noise is Gaussian and template is correct (Neyman-Pearson lemma)."
    quote: "[Abbott et al. 2016 *Phys. Rev. Lett.* 116:061102, abstract:] 'On September 14, 2015 at 09:50:45 UTC the two detectors of the Laser Interferometer Gravitational-Wave Observatory simultaneously observed a transient gravitational-wave signal. The signal sweeps upwards in frequency from 35 to 250 Hz with a peak gravitational-wave strain of 1.0 × 10−21. It matches the waveform predicted by general relativity for the inspiral and merger of a pair of black holes and the ringdown of the resulting single black hole. The signal was observed with a matched-filter signal-to-noise ratio of 24 and a false alarm rate estimated to be less than 1 event per 203 000 years, equivalent to a significance greater than 5.1σ.' [§I Introduction, on the theoretical-template chain:] 'These advances [post-Newtonian calculations, numerical relativity breakthroughs], together with numerical relativity breakthroughs in the past decade, have enabled modeling of binary black hole mergers and accurate predictions of their gravitational waveforms.' [The transferable claim: detection-sensitivity to a weak signal in noise is bounded by the quality of the theoretical template used to match-filter. The LIGO detection was made possible by TWO concurrent achievements — (a) 50-year detector sensitivity improvement chain from Weber 1960s to LIGO 2015; (b) GR-predicted waveform templates with sufficient accuracy. Both are required; the detector alone would not have sufficed without the template. This generalizes: any sub-threshold-signal detection is a function of (raw sensitivity) × (template quality).]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v46
    citation: "Cross-domain attestations: Neyman-Pearson 1933 — matched-filter is the Bayesian-optimal detector for known-signal-in-Gaussian-noise (foundational signal-detection theorem). Higgs boson discovery (ATLAS 2012 arXiv:1207.7214 + CMS 2012 arXiv:1207.7235) used analogous template-matched analysis against predicted Higgs-decay channels. Pulsar timing (Hewish 1968 *Nature* 217:709 — discovery of pulsars) — the pulse-template is what allowed identifying the regular signal in radio noise. Speech recognition (Rabiner 1989 *Proc. IEEE* 77:257 hidden Markov models for speech) — acoustic templates as phoneme priors. Optical character recognition (Tesseract + earlier systems) — glyph-template matching. Cryptographic known-plaintext attacks (Hellman 1980 *IEEE Trans. Inf. Theory*) — known partial-plaintext as template for key-recovery. Medical imaging deep-learning detection (Esteva 2017 *Nature* 542:115 skin-cancer classification) — learned templates from labeled examples function as the detection template. Radar / sonar — matched-filter is the standard detection-paradigm. Multi-substrate attestation across signal-processing, particle physics, radio astronomy, speech recognition, computer vision, cryptography, and machine learning."
    quote: "[Cross-domain consistency check, 2026-05-24: matched-filtering is the canonical detection-paradigm across signal-processing fields because Neyman-Pearson 1933 established it as Bayesian-optimal for known-signal-in-Gaussian-noise. The transferable operational claim — detection requires having a TEMPLATE to match against — is robust across substrates because the underlying math is shared. The LIGO instance is the most stunning recent demonstration: the signal-to-noise improvement from matched-filtering is enormous (the raw strain ~10^-21 is below ANY single-detector sample, but the chirp-template integrates 0.2 seconds of coherent signal into a 24-σ detection). Without the GR-predicted template, the LIGO data would have been unintelligible noise. The dual requirement — sensitive instrument AND accurate template — is the operational invariant.]"
canonical-instances:
  - "the LIGO GW150914 canonical case (Abbott et al. 2016): two interferometers observed a transient signal sweeping from 35 to 250 Hz with peak strain 10^-21. The signal matched the GR-predicted waveform for binary-black-hole inspiral-merger-ringdown with 24-σ matched-filter SNR. The detection required (a) the LIGO detector sensitivity (50 years of incremental improvement from Weber bars to advanced interferometric); (b) the theoretical waveform templates (post-Newtonian + numerical relativity predictions). Neither alone would have sufficed — the template made the sub-detector-noise signal visible"
  - "the Higgs boson canonical case (ATLAS Collaboration 2012 *Phys. Lett. B* 716:1, arXiv:1207.7214; CMS 2012 *Phys. Lett. B* 716:30): two LHC experiments observed a new particle at 125 GeV by template-matching expected decay channels (H → γγ, H → ZZ → 4ℓ). The matched-filter approach: predicted-signal-distribution + measured-event-distribution → likelihood-ratio test for signal-presence. 5σ each + independent corroboration. Without the Standard Model's specific predictions about Higgs decay-channel branching ratios, the analysis would not have had a target to filter for"
  - "the pulsar discovery canonical case (Hewish 1968 *Nature* 217:709): periodic radio-pulses at intervals of 1.337 seconds initially looked like a Little Green Men signal. The discovery emerged when Bell-Burnell + Hewish recognized the pulse-shape as a CONSISTENT pattern in the chart-recorder traces — the pattern was the template. The detection emerged from a pattern-template (regular pulses + specific waveform) being recognized in noise. Cross-substrate: same mechanism as LIGO but for radio rather than gravity"
  - "the OCR canonical case (Tesseract + earlier OCR systems): character-recognition compares input-image to known glyph-templates. Each character class has a template; the template-matched score determines classification. Modern deep-learning OCR generalizes this — learned-feature-templates instead of hand-crafted-glyphs, but the underlying paradigm is template-matching against a prior over expected shapes. Without the glyph-template prior, the OCR system has nothing to match"
  - "the cryptographic known-plaintext attack canonical case: when a cryptanalyst has partial known-plaintext (e.g., a file header with a known format), they template-match the ciphertext against the expected plaintext-pattern to recover key-bits. The 'known plaintext' is the template. Without it, ciphertext is indistinguishable from random; with it, key-recovery becomes tractable. Same mathematical pattern as LIGO's template-matched detection, applied to crypto"
  - "operationally distinct from lex-cpjma triangulation-of-independent-methods: lex-cpjma is about CONVERGENT confirmation across independent methods. lex-n7dqw is about template-matched detection within a single signal-processing pipeline. They co-fire in LIGO's case: matched-filter at each detector (lex-n7dqw) + cross-detector coincidence (lex-cpjma, two detectors are independent). The two atoms are complementary: lex-n7dqw is the within-instrument detection mechanism; lex-cpjma is the across-instrument confirmation"
  - "operationally distinct from lex-mj7x2 noise-as-signal-amplifier-in-nonlinear-systems: SR is about adding noise to amplify a weak signal in a threshold system. lex-n7dqw is about using a template to extract a signal from noise. They share the substrate (signal-detection in noise) but operate via different mechanisms. SR adds noise + uses threshold-crossing; matched-filtering uses prior signal-shape. They can compose (noise-pre-conditioned detection followed by template-matched extraction) but address different parts of the signal-detection pipeline"
  - "operationally distinct from lex-betym confirmation-filtered-curiosity-exploration: confirmation-filter is a COGNITIVE BIAS where the searcher only looks for evidence supporting their hypothesis. Matched-filter detection is FORMALLY similar (only signal matching the template gets through) but in a context where the template comes from a vetted theoretical-prediction (GR + numerical relativity) rather than an unvalidated psychological-hypothesis. The risk: matched-filter analysis CAN slide into confirmation-bias if the template is itself the hypothesis-under-test. Practitioner-discipline: the template must be theoretically-justified independently of the dataset being analyzed"
  - "operationally distinct from lex-nn3u9 extraordinary-claims-require-extraordinary-evidence: Hume/Sagan's principle is about the BAR for accepting unusual claims. The LIGO 5.1σ + false-alarm-rate-<-1-per-203000-yr clears that bar by orders of magnitude. lex-n7dqw is about the MECHANISM that PRODUCES strong evidence (matched-filtering). Cross-fire: extraordinary claims need extraordinary evidence (lex-nn3u9); matched-filter is one mechanism for producing extraordinary evidence (lex-n7dqw)"
critical-questions:
  - "the template-availability diagnostic: does this detection task have a theoretically-justified template? Without one, matched-filtering cannot be applied (the alternative is brute-force fishing in noise, which has high false-positive rates). Practitioner-question: what's the predicted signal-shape, and where does the prediction come from? If the predicted shape IS the hypothesis-under-test, the matched-filter analysis is methodologically circular and gives weaker evidence than the SNR suggests"
  - "the template-accuracy question: how accurate is the template? An imprecise template gives degraded matched-filter SNR (matched-filter SNR = (1 - mismatch²)¹/² × ideal-SNR for small mismatch). Practitioner-discipline: when invoking matched-filtering, name the template-source and the expected-mismatch level. LIGO uses banks of thousands of templates spanning the binary-parameter space; the bank's coverage determines false-dismissal rate"
  - "the template-corruption risk: if the template is wrong, matched-filtering will preferentially detect SPURIOUS coincidences with the wrong template-shape. Practitioner-question: how do you cross-check that the template is correct? In LIGO: post-detection parameter-estimation finds best-fit template-parameters; mismatch between detection-template and best-fit-template would signal template-error. Independent confirmation via multi-messenger (gravitational + electromagnetic + neutrino) is the stronger check"
  - "the boundary condition: matched-filtering is optimal for KNOWN-SIGNAL in GAUSSIAN noise. Real detector noise is non-Gaussian (glitches, transients, instrumental artifacts). Practitioner-discipline: when noise deviates from Gaussian, raw matched-filter SNR overstates evidence; supplementary tests (glitch-vetoes, coincidence between detectors, parameter-consistency checks) are needed. LIGO has extensive glitch-vetoing pipelines for this reason"
  - "the LLM/AI-detection application: pattern-detection in machine-learning is matched-filtering with learned templates (CNN feature-templates, transformer attention-templates). Practitioner-discipline: when an ML system 'detects' something, surface what template it's matching against and whether the template is theoretically-justified vs purely-data-derived. Purely-data-derived templates are vulnerable to dataset-shift; theoretically-justified templates have stronger generalization"
  - "the historical-progress lesson: LIGO took 50 years (Weber 1960s → 2015 detection) of incremental sensitivity improvements + 99 years of theoretical-template improvements (Einstein 1916 → numerical-relativity 2005). Practitioner-question: in this domain, is detection currently limited by raw sensitivity or template quality? The marginal-improvement should target whichever is the binding constraint. For new domains (e.g., dark-matter direct detection), often the limit is theoretical-template-uncertainty rather than instrument-sensitivity"
status: active
