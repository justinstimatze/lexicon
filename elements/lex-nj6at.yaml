canonical-instances:
  - "Two departments competing for a shared budget allocation escalate through successive rounds of behind-the-scenes lobbying and favor-trading with the executive who controls it, until neither department trusts any decision that executive makes, and the executive's authority to allocate anything at all quietly collapses."
critical-questions:
  - "Was the king's downfall really about taking bribes specifically, or would any arbiter who let a losing party appeal a ruling through unofficial back channels — bribery or otherwise — have suffered the same collapse in perceived legitimacy?"
  - "Is there a point in the escalation where the king could have stopped the corruption without losing everything, or does the story suggest that accepting even the first bribe already made the eventual total collapse inevitable?"
