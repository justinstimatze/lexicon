evokes: [common-oppression-rhetoric, all-women-are-oppressed, friedan-feminine-mystique-as-class-narrative, hooks-1984, feminist-theory-from-margin-to-center, sisterhood-without-confronting-class, sisterhood-without-confronting-race, the-most-privileged-among-the-subordinated, universalist-suffering-rhetoric-as-co-option-vehicle, suffering-cannot-be-measured-as-erasure-move, organize-around-your-own-oppression-as-license-to-ignore-difference, bourgeois-feminism-cloaked-as-feminism]
lineage:
  - source: primary
    text: hooks-1984-feminist-theory-from-margin-to-center-ch1-and-ch2
    citation: "bell hooks, *Feminist Theory: From Margin to Center* (South End Press 1984; 2nd ed. 2000; 3rd ed. Routledge 2015 with new preface). Chapter 1 'Black Women: Shaping Feminist Theory' and Chapter 2 'Feminism: A Movement to End Sexist Oppression.' hooks (Gloria Jean Watkins, 1952-2021; Berea College Distinguished Professor in Appalachian Studies; *Ain't I a Woman: Black Women and Feminism* 1981; one of the foundational Black-feminist theorists alongside Audre Lorde, Patricia Hill Collins, and Angela Davis). The transferable claim: the rhetoric of 'common oppression' that organized 1960s-1970s second-wave US feminism functioned not primarily as a solidarity-building tool but as a class-cover by which the most-privileged women within the subordinated group (college-educated, middle- and upper-class white women) advanced their specific interests under the universalist banner. Friedan's *The Feminine Mystique* is the canonical instance: it characterized 'the plight of women' through a portrait of leisure-class white housewives bored at home, while presupposing that someone else (working-class women of color) would do the domestic labor freed up by white middle-class women entering the professions. The universalist claim ('all women are oppressed') made it rhetorically illegitimate to surface the intra-group stratification on which the proposed solution depended. The structural mechanism hooks identifies: (1) the most-privileged-within-the-subordinated group have disproportionate access to platforms (universities, publishing, mass media, money) and so define what the group's 'common condition' looks like; (2) the universalist-suffering frame ('suffering cannot be measured') is then deployed to make material differences within the group invisible — the rich white woman's existential ennui and the poor woman of color's survival struggle are presented as a 'common bond' that takes precedence over the differences; (3) slogans like 'organize around your own oppression' license each woman to ignore differences between her position and others'; (4) movement structures, language, and priorities are shaped to fit the most-privileged-within-the-subordinated's interests, making it definitionally difficult for less-privileged-within-the-subordinated voices to be heard except as confirmations of the dominant frame ('we could be heard only if our statements echoed the sentiments of the dominant discourse'). Transferable beyond feminism: labor movements (skilled-craft-union claims to represent 'workers' while excluding unskilled, immigrant, and women workers); national-liberation movements (national-bourgeoisie claims to represent 'the people' while excluding peasants and women — Fanon 1961 *Wretched of the Earth* Ch.3 'The Pitfalls of National Consciousness'); civil-rights organizing (middle-class Black male leadership claims to represent 'the race' while sidelining Black women, working-class Black communities, queer Black voices — see Cathy Cohen 1999 *The Boundaries of Blackness*); disability rights (white middle-class disabled professionals claiming to represent 'the disabled' while excluding disabled people of color, poor disabled people, those with multiple disabilities); LGBTQ+ politics (assimilationist gay-rights agendas claiming to represent 'the community' while sidelining trans, working-class, and racially-marginalized members); patient advocacy in chronic illness (well-resourced patient leaders claiming to represent 'patients' while excluding those without insurance access or who can't show up to advocacy meetings). The pattern recurs wherever a subordinated group contains internal stratification — which is to say, wherever a subordinated group exists. Distinct from lex-enpjy Mosca's political-formula (which names how a ruling-power constructs a legitimating story for the ruled): lex-t7xcp names the INVERSE mechanism — how a stratified-subordinated group's universalist-oppression rhetoric obscures the privileged-among-them. Distinct from lex-5d8hm Freeman's denied-structure-becomes-informal-hierarchy (which names how disavowing formal structure produces unaccountable informal structure): lex-t7xcp names a specific rhetorical mechanism — universalist-suffering claims — by which intra-group stratification is rendered invisible whether structure is formal or informal. Distinct from lex-et8q2 Cooper's intersectional-position (which names the epistemic-irreducibility of an intersectional position): lex-t7xcp names the political-mechanism by which intersectional positions get erased — universalist-claims appropriate the single-axis they prioritize and treat other axes as divisive."
    quote: "*[hooks 1984/2015 Ch. 1, on Friedan's universalism erasing class:]* 'She made her plight and the plight of white women like herself synonymous with a condition affecting all American women. In so doing, she deflected attention away from her classism, her racism, her sexist attitudes towards the masses of American women.' *[Ch. 1, naming the structural-access asymmetry:]* 'It was a mark of race and class privilege, as well as the expression of freedom from the many constraints sexism places on working-class women, that middle-class white women were able to make their interests the primary focus of feminist movement and employ a rhetoric of commonality that made their condition synonymous with \"oppression.\" Who was there to demand a change in vocabulary? What other group of women in the United States had the same access to universities, publishing houses, mass media, money?' *[Ch. 1, on 'organize around your own oppression' as license:]* 'Although the impulse towards unity and empathy that informed the notion of common oppression was directed at building solidarity, slogans like \"organize around your own oppression\" provided the excuse many privileged women needed to ignore the differences between their social status and the status of masses of women.' *[Ch. 1, on the co-option:]* 'However, feminist emphasis on \"common oppression\" in the United States was less a strategy for politicization than an appropriation by conservative and liberal women of a radical political vocabulary that masked the extent to which they shaped the movement so that it addressed and promoted their class interests.' *[Ch. 1, on the silencing mechanism:]* 'If we dared to criticize the movement or to assume responsibility for reshaping feminist ideas and introducing new ideas, our voices were tuned out, dismissed, silenced. We could be heard only if our statements echoed the sentiments of the dominant discourse.' *[Ch. 1, on Fritz's \"suffering cannot be measured\" as erasure-move:]* 'There is much evidence substantiating the reality that race and class identity creates differences in quality of life, social status, and lifestyle that take precedence over the common experience women share... The motives of materially privileged, educated white women with a variety of career and lifestyle options available to them must be questioned when they insist that \"suffering cannot be measured.\" Fritz is by no means the first white feminist to make this statement. It is a statement that I have never heard a poor woman of any race make.'"
canonical-instances:
  - "Friedan 1963 *The Feminine Mystique* as the canonical instance hooks dissects: the 'problem that has no name' was characterized as 'women's' problem, but the portrait was a college-educated middle/upper-class white housewife bored at home. The proposed solution (women entering professions) presupposed working-class women of color to take over the domestic labor — making the universalist claim structurally parasitic on the intra-group stratification it erased."
  - "Skilled-craft labor unions claiming to represent 'workers' while excluding unskilled, immigrant, and women workers (US labor history 1880s-1950s): the universalist-worker rhetoric of the AFL craft-union model materially served the most-privileged-among-workers (skilled white male craftsmen) while excluding the less-privileged-among-workers from the very organizations claiming to speak for them. The CIO breakaway in the 1930s was precisely a response to this co-option pattern."
  - "Fanon 1961 *The Wretched of the Earth* Ch. 3 'The Pitfalls of National Consciousness': the national-bourgeoisie of post-colonial nations claiming to represent 'the people' / 'the nation' while structurally substituting their class interests for the liberation movement's stated universal aims — the same hooks-mechanism applied to decolonization rather than to feminism."
  - "Middle-class Black male civil-rights leadership claiming to represent 'the race' while sidelining Black women's voices, working-class Black communities, and queer Black voices (Cathy Cohen 1999 *The Boundaries of Blackness* on AIDS-era organizing; Pauli Murray's 1965 'Jim Crow and Jane Crow' essay; the founding of the National Black Feminist Organization 1973 explicitly as response to this co-option pattern)."
  - "Assimilationist gay-rights agendas claiming to represent 'the LGBTQ community' while structurally sidelining trans people, working-class queer people, and racially-marginalized queer people (the marriage-equality-first prioritization debate from c. 2000-2015; Lisa Duggan 2003 *The Twilight of Equality?* on 'the new homonormativity' as the same hooks-mechanism applied to queer politics)."
  - "White middle-class disabled professional leadership of disability-rights organizations claiming to represent 'the disabled' while structurally excluding disabled people of color, poor disabled people, and those with multiple disabilities (Sins Invalid's 2015/2019 *Skin, Tooth, and Bone: The Basis of Movement is Our People* names this exact pattern in the disability-justice tradition's break from older disability-rights organizing)."
  - "Well-resourced patient-advocacy leadership in chronic-illness organizing claiming to represent 'patients' while structurally excluding those without insurance access, those who can't take time off to attend conferences, and those whose disease presents differently in marginalized populations (the long-COVID and ME/CFS communities have surfaced this pattern explicitly; same hooks-mechanism)."
  - "operationally distinct from lex-enpjy Mosca political-formula: Mosca names how a ruling power constructs a legitimating story directed AT the ruled. lex-t7xcp names how a subordinated group's own universalist-oppression rhetoric serves as cover for the most-privileged WITHIN that group. Mosca's vector is downward (rulers → ruled); hooks's vector is intra-group horizontal (privileged-within-the-subordinated → less-privileged-within-the-subordinated). The structural shape is mirror-inverse: Mosca's formula manufactures legitimacy for power; hooks's rhetoric obscures privilege under claims of subordination."
  - "operationally distinct from lex-5d8hm Freeman tyranny of structurelessness: Freeman names the substitution-of-informal-hierarchy when formal-structure is denied. lex-t7xcp names a specific rhetorical mechanism — the universalist-oppression claim — by which intra-group stratification is rendered invisible regardless of whether the group's structure is formal, informal, or strenuously denied. The two compose: Freeman's denial-of-formal-structure provides the institutional cover; hooks's universalist-rhetoric provides the discursive cover; together they make intra-group stratification doubly hard to surface."
  - "operationally distinct from lex-k8bsd Hill Collins outsider-within: Collins names the high-value epistemic position of inside-access-without-membership. lex-t7xcp names the political-rhetorical mechanism that, when operative, suppresses outsider-within knowledge from circulating — the outsider-within IS structurally positioned to see the privileged-among-the-subordinated's co-option, but the universalist-suffering rhetoric is what makes their report illegible as a contribution to the common project."
  - "operationally distinct from lex-5qkj9 Ahmed killjoy: Ahmed names how naming-a-structural-problem makes the namer the source-of-disruption. lex-t7xcp names a specific category of structural-problem (intra-group stratification within a universalist-claim-organized subordinated group) and a specific mechanism that produces the killjoy-style deflection — when an outsider-within names the intra-group stratification, the universalist-suffering frame supplies the language for recasting the naming as betrayal-of-the-common-cause."
critical-questions:
  - "who within the subordinated group has access to the platforms (universities, publishing, mass media, money, organizational leadership, funding) that shape the group's public self-representation? The universalist claim's content is set by whoever has access; intra-group stratification along access-axes is the first place to look for the co-option mechanism."
  - "whose program is being advanced under the universalist banner, and whose program is being deferred or never surfaces? Test by asking: if the proposed remedies succeed, who within the subordinated group materially benefits, and whose conditions go unchanged or worsen? Friedan's middle-class women entering the professions advanced one class's interests; the working-class women of color doing the resulting domestic labor were structurally invisible in the remedy."
  - "what becomes rhetorically illegitimate to say once the universalist frame is in place? The signature: critique of intra-group stratification gets recast as divisiveness, betrayal, or 'horizontal hostility.' Surface what cannot be said under the operative universalist frame; that's the work the frame is doing."
  - "is the universalist-suffering claim ('suffering cannot be measured,' 'we're all in this together,' 'a common bond,' 'organize around your own oppression') being used to foreclose comparative analysis of material conditions within the group? hooks's specific diagnostic: the claim that suffering cannot be measured is a statement made by those with material options about those without."
  - "who within the subordinated group can be heard only on the dominant-within-the-group's terms? hooks's diagnostic: 'we could be heard only if our statements echoed the sentiments of the dominant discourse.' If certain intra-group positions are legible only as confirmation of the dominant-within-the-group frame and illegible as critique of it, the co-option is operative."
  - "is this lex-t7xcp mechanism composing with lex-5d8hm (denied-structure) and/or lex-5qkj9 (naming-becomes-problem)? The full mechanism in mature form: (1) denial of formal structure (lex-5d8hm) hides the intra-group hierarchy organizationally, (2) universalist-oppression rhetoric (lex-t7xcp) hides it discursively, (3) naming-becomes-the-problem (lex-5qkj9) suppresses any outsider-within attempt to surface either. The three together make intra-group stratification triple-locked."
