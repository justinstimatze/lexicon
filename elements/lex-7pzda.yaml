id: lex-7pzda
name: resentment-at-a-proposed-protection-shows-the-protection-is-needed
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "An objection that a protective power will provoke the powerful to resent and retaliate can itself be read as evidence that the group needs the power. Opponents of Black suffrage after the Civil War argued enfranchisement would provoke conflict with the old master class in the South. Douglass turns the objection back on itself: 'The argument that the possession of suffrage would be likely to bring the negro into conflict with the old master-class at the South, had its main force in the admission that the interests of the two classes antagonized each other and that the maintenance of the one would prove inimical to the other. It resolved itself into this, if the negro had the means of protecting his civil rights, those who had formerly denied him these rights would be offended and make war upon him.' He draws the reversal explicitly: 'The very fact therefore that the old master-classes of the South felt that their interests were opposed to those of the freedmen, instead of being a reason against their enfranchisement, was the most powerful one in its favor.' The logic depends on what the resentment actually reveals: a party who would only be offended by a neutral, harmless change has no real stake in preventing it, so genuine, admitted hostility to a group gaining defensive capacity is itself the proof that the group needs that capacity against exactly that hostility."
