critical-questions:
  - "Is the apparent variety actually pseudo-individuality, or is the underlying production genuinely diverse? The diagnostic discipline: trace specific products to specific production-apparatus features. If multiple `different` products share the same formula (genre conventions, operational template, engagement-optimization assumptions, training-data composition), lex-kykwm fires. If the products differ at the formula-level, the apparent variety is real and the atom does not apply."
  - "Does the atom imply consumers are fooled by the pseudo-individuality? Not necessarily. Consumers may know perfectly well that movie franchises share plot structures or that smartphones are converging; the atom names the structural fact, not consumer ignorance. Some consumers find the formulaic-variety satisfying; some don't. The atom is structural-diagnostic, not evaluative of consumer cognition."
  - "Could the atom be misused to dismiss legitimate consumer-choice as illusory? Yes — and that is a known misuse pattern (the elite-anti-popular-culture move Adorno is often criticized for). The discipline against this: the atom is structural-diagnostic about producer-apparatus, not normative about consumer taste. Consumers may genuinely prefer the formulaic options; the atom claims the choice between them is structurally cosmetic, not that the preference is wrong."
  - "How does the atom apply to apparent-variety in personally-curated systems (recommendation algorithms, personalized feeds, individualized search results)? The atom extends: the personalization-formula is itself standardized across users (the SAME recommendation-algorithm + objective-function + feature-set produces apparent-personalized output for many users). The personalization is real at the individual-output level but structurally standardized at the algorithm level. This is the extended Bender et al / Zuboff form."
  - "When does standardization become a structural problem vs simply being efficient? The atom does NOT claim standardization is always bad; it claims the apparent-variety conceals the standardization, which matters when (i) the choice-as-legitimating-mechanism for the status quo depends on the variety being real, (ii) the political-economic concentration of the apparatus is being obscured by the perceived variety. The atom locates the structural fact; remedies require additional analysis."
