lineage:
  - source: primary
    text: rappaport-1999-ritual-and-religion-in-the-making-of-humanity
    citation: "Roy A. Rappaport, *Ritual and Religion in the Making of Humanity* (Cambridge Studies in Social and Cultural Anthropology 110; Cambridge University Press, 1999). The book's argument runs in one continuous chain across chapters 2, 4, and 9: ritual is formally defined (ch.2 'The Ritual Form', p.24) as the performance of more or less invariant sequences of formal acts and utterances not entirely encoded by the performer, from which follows (ch.2 §11 'Self-referential and canonical messages', pp.52-54) a dual-message structure every ritual performance carries — self-referential messages (indexical information about the performer's own current state, confined to the here-and-now) and canonical messages (content the performer inherits rather than authors, encoded in the liturgy's invariant form, referring to enduring or eternal orders). Chapter 4 ('Enactments of Meaning', pp.117-123) develops the theoretical payoff: because performing a liturgical order fuses the performer with the order being performed, participation is logically inseparable from acceptance, and acceptance is a PUBLIC ACT rather than a private state of belief — visible to witnesses, binary, and (unlike belief) not vitiated by private doubt or subsequent insincerity. Chapter 9 ('The Idea of the Sacred', pp.283-286) supplies the reason the canonical order must specifically be INVARIANT: invoking Anthony F.C. Wallace's information-theoretic argument that ritual is 'communication without information' (predictability is precisely what gives it its certifying force), Rappaport argues that only conformity to a fixed, un-self-authored form achieves the performer-performance fusion that makes acceptance-through-performance work; a freely-varying or self-composed form would leave the performer as author, and thus able to disclaim what was performed. The transferable claim: ritual is a distinctive communication medium that solves a problem ordinary assertion cannot — converting a private state (commitment, acceptance, belief) into a publicly verifiable, hard-to-retract fact — and it does this specifically via the dual canonical/self-referential structure and the crucial role of invariance, independent of whether the performance is costly."
    quote: "[Ritual defined, ch.2 §1, p.24:] 'I take the term \"ritual\" to denote the performance of more or less invariant sequences of formal acts and utterances not entirely encoded by the performers.' [The logical entailments of that form, ch.2 §2, pp.26-27:] 'the performance of more or less invariant sequences of formal acts and utterances not entirely encoded by the performers logically entails the establishment of convention, the sealing of social contract... the investment of whatever it encodes with morality, the construction of time and eternity... the generation of the concept of the sacred and the sanctification of conventional order.' [Self-referential messages defined, ch.2 §11, p.52:] 'whatever else may happen in some human rituals, in all rituals, both animal and human, the participants transmit information concerning their own current physical, psychic or social states to themselves and to other participants... I shall refer to this class of messages as \"self-referential.\"' [Canonical messages defined, same section, pp.52-53:] 'Additional messages, although transmitted by the participants, are not encoded by them. They are found by the participants already encoded in the liturgy. Since these messages are not encoded by the performers, and since they tend toward invariance, it is obvious that these messages cannot in themselves represent the performers' contemporary states. For instance, the words and acts comprising the Roman Mass (some of which have remained unchanged for more than a millennium) do not in themselves represent or express the current states of those uttering and performing them... I shall refer to this class of messages as \"canonical.\"' [The two streams distinguished, p.53-54:] 'Whereas the referents of self-referential messages, i.e., the current physical, psychic or social states of individual participants... are confined to the here and now, the significata of the canonical are never so confined... The self-referential represents the immediate, the particular and the vital aspects of events; the canonical, in contrast, represents the general, enduring, or even eternal aspects of universal orders.' [p.54:] 'the canonical stream is carried by the invariant aspects or components of these orders, self-referential information is conveyed by whatever variation the liturgical order allows or demands.' [Acceptance as ritual's first office, ch.4, p.119:] 'by performing a liturgical order the participants accept, and indicate to themselves and to others that they accept whatever is encoded in the canon of that order. This act of acceptance is the first of ritual's fundamental offices. The self-referential and the canonical are united in the acceptance of the canon. Acceptance is the self-referential message intrinsic to all liturgical performances, the indexical message without which liturgical orders and the canonical messages they encode would be without consequence, non-existent, or vacuous.' [Acceptance is public, not belief, ch.4 §5, p.120:] 'Acceptance, in contrast, is not a private state, but a public act, visible both to witnesses and to performers themselves. People may accept because they believe, but acceptance not only is not itself belief; it doesn't even imply belief.' [Insincerity rendered publicly impotent, p.123:] 'although liturgical performance does not eliminate insincerity, it renders it publicly impotent. It is the visible, explicit, public act of acceptance, and not the invisible, ambiguous, private sentiment, which is socially and morally binding... Liturgical orders are public, and participation in them constitutes a public acceptance of a public order, regardless of the private state of belief. Acceptance is not only public but clear. One either participates in a liturgy or one does not; the choice is binary and as such it is formally free of ambiguity.' [Invariance indispensable to acceptance, ch.9 §3, p.285:] 'In such a union of performer and performance there can be no rejection of that which is being performed. The performer, in performing a liturgical order, cannot be doing other than accepting whatever it encodes. If conformity to an order encoded by other than the self is required for such identification to be achieved — and I have argued that it is — then the invariance of the liturgical order is indispensable to acceptance.' [Wallace 1966:233, quoted p.285, on ritual as communication without information:] 'each ritual is a particular sequence of signals which, once announced, allows no uncertainty, no choice, and hence, in the statistical sense of information theory, conveys no information from sender to receiver. It is, ideally, a system of perfect order and any deviation from this order is a mistake.' [Rappaport's own gloss, p.286:] 'the meaning of ritual's informationlessness is certainty.' [The Maring kaiko-dance-as-pledge instance, ch.2 §12, pp.57-58:] 'men would signify, by dancing at the kaiko festival of another group, that they would give their hosts military support the next time they went to war. There is surely no intrinsic or causal relationship between dancing and fighting... but the dance is nevertheless indexical. What it indicates is not fighting in the future, but, rather, a pledge undertaken in the present to fight in the future... To dance is to pledge.'"
  - source: discovery-loop
    text: distinctness-audit-rappaport-ritual-communication
    citation: "Rappaport was entirely absent from the substrate before this atom. The closest neighbor is lex-5kjya, the substrate's costly-signaling-theory atom (Veblen's conspicuous waste, cross-attesting Zahavi's handicap principle and religious-sacrifice costly-ritual theory): genuinely distinct because lex-5kjya's mechanism is cost-as-discriminator — only an agent with the underlying capacity can afford the waste — while Rappaport's mechanism is invariance-as-certifier: a cheap-but-fixed, un-self-authored form still certifies commitment, and cost is not required. Lex-0170 (cheap-talk, Crawford-Sobel/Spence) is the contrast-partner to costly signaling generally and does not address ritual or canonical form at all. Other commitment-adjacent atoms checked for overlap — lex-5bpee (commitment-and-consistency pressure, Cialdini), lex-we98d (cognitive dissonance), lex-ry9qx (total social fact, Mauss), lex-jmm5b (stated intentions as weak evidence), lex-xu94g (surface appearance cheap to produce), lex-xuna9 (discursive practice as mutual scorekeeping, Brandom), lex-aut4h (argument from commitment, Walton), lex-avv9k (Hohfeld's jural relations), lex-6tvr6 (pre-commitment binds future action), and lex-efv3v (chosen role as non-deliberation gate, Epictetus) — do not address ritual's dual-message structure. Lex-0716 (Schelling, credibility-comes-from-visibly-foreclosed-options-not-from-stated-intent) is the general strategic-logic atom for commitment devices: visible, irreversible foreclosure of one's own options as the source of bargaining credibility toward an adversary. It is distinct from Rappaport: Schelling's device works by making reneging materially or structurally costly, while Rappaport's device works by making the performer's sincerity irrelevant, because acceptance is constituted by the public performance of an un-self-authored invariant form itself, independent of material cost or revocability. The two compose — an oath of office is both. Lex-0740 (Augustine, divided will) and lex-ezcv6 (Sartre, bad faith) concern intrapsychic multiplicity and self-evasion, not ritual as a communication medium, and are not relevant neighbors; lex-dzqje and lex-x3hgq (Augustine's ordo amoris) contain only a passing liturgical reference, not ritual theory. The two genuine ritual-theory neighbors are lex-p26va (rite-of-passage-publicly-marks-status-transition, Van Gennep/Turner/Brown) and lex-k7m6e (shared-coordinated-action-generates-collective-effervescence-and-bonds-the-group, Durkheim). Lex-0527 names a status-transition-marking mechanism (séparation/marge/agrégation) keyed to discrete biographical transitions; Rappaport's dual-message/certification structure applies to every ritual performance whether or not a transition is occurring (a recurring Mass, a daily prayer). Lex-0407 names an affective, emotional-bonding mechanism — synchronized action generates collective energy attached to a totem — where Rappaport names a semiotic, communicative mechanism (a message structure that certifies acceptance as public fact) that operates independent of emotional charge. Both are genuinely distinct but closely composing neighbors, included in `related` with the distinctness and composition made explicit in the agent-instruction, following the same pattern used elsewhere in the substrate for same-domain neighbor atoms. Lex-0124 (form-persists-when-content-dissolves) names a temporal-hollowing pattern — form outlives content that has withdrawn — a distinct axis from Rappaport's claim that canonical form's invariance is always meant to outlast and exceed any single performer's content by design, not as a later degeneration; no `related` entry was needed. No existing atom grounds the canonical/self-referential dual-message structure or the specific claim that invariance, rather than cost, is what certifies a private state as public fact."
canonical-instances:
  - "The Maring kaiko-dance-as-pledge (Rappaport's own central Papua New Guinea case, pp.57-58): dancing at a host group's kaiko festival indexically constitutes a pledge of future military support — 'to dance is to pledge' — the dancer's self-referential commitment becomes public and binding by performing the group's fixed, inherited dance-form, with no verbal declaration needed or possible to override it."
  - "The Roman Mass and its Eucharistic Canon, unchanged in parts for over a millennium (Rappaport's canonical example, p.52): reciting words the celebrant did not author and cannot alter is precisely what makes each individual celebrant's participation a public acceptance of the canon, regardless of that celebrant's private doubts — 'the words and acts... do not in themselves represent or express the current states of those uttering and performing them.'"
  - "Judicial oaths and courtroom procedure: the fixed, archaic wording required of a witness's oath, standing when the judge enters, and the precise phrasing required for a legally valid verdict are none of them authored by the particular witness, juror, or judge performing them — that very fixity is what converts an individual utterance into a legally binding public act rather than a private assertion that could later be reinterpreted."
  - "Traditional wedding-vow liturgy versus fully self-composed vows: couples who worry that self-written vows feel 'less official' or 'less binding' than a fixed traditional liturgy are registering, in folk form, exactly Rappaport's mechanism — a form the couple authors themselves remains theirs to reinterpret or disclaim later, while a form neither of them invented cannot be disowned without contradiction."
  - "Military enlistment and commissioning oaths, and academic commencement / hooding ceremonies: the fixed, non-negotiable wording (the oath of enlistment) and gesture (raising the right hand, the conferral of the hood) that the individual did not write converts a private decision — to serve, to have completed the degree — into a public, witnessed, certified fact."
  - "Organizational resistance to 'streamlining' or 'personalizing' a traditional ceremony (shortening an onboarding ritual, making commencement-gown-wearing optional, letting employees write their own oath of confidentiality): the resulting complaint that the change 'doesn't feel official' is not mere nostalgia — per Rappaport's mechanism, removing the invariant, un-self-authored canonical form removes the specific thing that made the status-change a certified public fact rather than an administrative event."
critical-questions:
  - "Is there a private state (belief, consent, loyalty, commitment) that needs to become a PUBLIC, hard-to-retract fact rather than merely a claimed one? That is the signature situation for Rappaport's mechanism — check whether the actor is relying on spoken assertion alone when a fixed, witnessed, un-self-authored performance would do work that words cannot."
  - "Did the performer AUTHOR the form being performed, or find it already encoded — inherited, prescribed, largely unalterable? Rappaport's canonical stream requires the performer not be the encoder. A self-composed ritual (improvised vows, an ad-hoc loyalty pledge) still self-referentially indexes commitment but loses the specific certifying force that comes from conforming to a form one did not invent and therefore cannot later disown."
  - "Is the canonical order actually INVARIANT, or has it drifted so much that its 'canonical' status is thin? Per Wallace's information-theoretic point Rappaport invokes: a genuinely unpredictable form carries ordinary information but cannot carry the certainty-function ritual needs. Check whether 'modernizing' or 'streamlining' a ceremony is quietly eroding the very invariance that made it work."
  - "Is acceptance being conflated with belief? Rappaport's explicit discipline: acceptance-through-performance does not require, indicate, or guarantee inward belief, sincerity, or subsequent compliance. A person can publicly accept a liturgical order while privately doubting or later violating it, and the acceptance is neither vitiated nor rendered meaningless by that gap — the diagnostic error is demanding sincerity-evidence when the actual social work being done is public, binary, unambiguous acceptance."
  - "Is the invariance itself doing the certifying work, or is only the COST doing it? If a cheap-but-fixed form would work just as well as an expensive one, this is Rappaport's mechanism, not costly signaling (lex-5kjya) — don't reach for the wrong theory to explain why a low-cost ceremony still binds."
