id: lex-cnjfd
name: identity-forms-from-successful-role-enactment-not-mere-access
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When someone has been given nominal access to a role''s territory — a title-adjacent assignment, a supervised slot, a shadow rotation — do not assume that access alone will shift how they see themselves. Huntington''s data on first-year medical students each assigned a family to follow shows two further gates have to open before a felt identity shift happens. GATE ONE: an actual occasion to exercise the role''s obligations has to arise, not just proximity to the role''s setting. She states this directly: ''Merely having a family assigned to them is hardly likely to help students feel like doctors—unless occasions arise in which they are called upon to exercise the obligations of their new role as quasi-physician.'' The data is stark: ''Thirty per cent of the 129 first- and second-year students whose families had definite medical problems came to see themselves primarily as doctors, in comparison with a bare 5 per cent of the 22 students whose families did not present medical problems.'' GATE TWO, and this is the sharper finding: genuine opportunity to act in the role is still not enough on its own — the attempt has to go reasonably well. ''The opportunity to establish a quasi-physician-patient relationship and to test out one''s ability in this role is not enough to lead most students to think of themselves primarily as doctors rather than students. The amount of difficulty they experience in handling patients further affects the formation of the self-image.'' Concretely: ''fully 45 per cent of the 29 students who reported having had no difficulty in handling patients indicated that they felt more like doctors than students; this compares with 29 per cent of the 91 who had little difficulty and 25 per cent of the 32 who had a fair or considerable amount of difficulty in handling patients.'' Struggling with the role''s actual tasks does not just fail to help — it appears to actively impede the sense of having become the thing. Diagnostic move: when a designed intervention grants someone proximity to a role (a shadow assignment, an observership, a supervised caseload) but the hoped-for identity shift does not materialize, check both gates before concluding the design failed — did real occasions to exercise the role''s obligations actually arise, and when they did, was the person able to handle them without excessive difficulty? Access without either gate open is functionally inert. This composes with, rather than duplicates, premature-peer-framing-accelerates-professional-identity-formation (lex-k2gnb): that atom''s deliberate title-plus-retained-signoff design works in part because it is one way of engineering both gates open at once — it manufactures real stakes (gate one) while the retained countersignature keeps catastrophic failure off the table (bounding gate two).'
related: [lex-k2gnb, lex-rgmbf]
evokes: [huntington-1957, western-reserve-family-clinic-program, quasi-physician-role, growing-doctorhood, merely-having-a-family-assigned-is-not-enough, difficulty-impedes-the-self-image]
