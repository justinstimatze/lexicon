critical-questions:
  - "does the candidate member ACTUALLY instantiate the prep-then-defeasibility-attach shape, or is it a different kind of inferential move? Diagnostic: can you write the candidate's assembly as `sequential(X, Y, ...) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)` with X, Y transferable preparation steps? If the assembly comes out differently (e.g. a non-defeasible deductive scheme, a non-presumptive inductive aggregation, a purely psychological mechanism), the member doesn't belong"
  - "is this label-molecule covering a structural-kind, or just a topical adjacency? The Walton scheme-shape is structural — same compositional spine. A label like 'cognitive-bias-instances' (lex-t9fs7, 0134, 0383, etc.) is structurally coherent because all members share the inferential-distortion mechanism. A label like 'epistemology-atoms' (everything about knowledge) is topical and likely wouldn't survive Principle-9 cross-source attestation. Diagnostic: can a non-substrate-author identify the shape without looking at the membership list?"
  - "is the membership list complete-relative-to-current-substrate, or did it stop at convenience? ships with 6 Walton schemes — every other Walton scheme catalogued in lexicon refs (lex-kebfa expert-opinion, and the three other molecule-tier Walton meta-pattern atoms reserved during early planning but never minted) should also be members. Diagnostic: re-run the bar against every substrate atom; flag candidates the membership-list missed"
  - "does the label-molecule overgenerate — would members from other scheme-families (Hamblin-style formal-dialectical schemes, Pollock-style ASPIC+ defeasible-inference, Toulmin-style claim-warrant-backing) also satisfy the shape and want to join? If yes, the label is broader than 'Walton-style' and either needs renaming or needs to be split into a super-label (defeasible-argumentation-scheme-family) with this label as a sub-member"
  - "does the label inflate substrate coherence beyond its actual cross-source attestation? The bar for a label-molecule is that a methodologically-distinct source identify the same kind without being led to it. Two now do: Toulmin 1958 reaches the warrant-plus-conditions-of-rebuttal layout while arguing against formal logic rather than cataloguing schemes, and Pollock 1987 reaches the same defeasible skeleton from formal epistemology. Walton, Toulmin and Pollock share no method and converge on the shape, so the kind is not an artifact of one author's taxonomy. The live version of this question is now narrower: Pollock's rebutting/undercutting split is NOT represented in the members' critical-question lists, so check each member for whether its defeaters attack the conclusion or attack the licence — the checklists currently blur the two"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008-compendium-of-schemes
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.9 'Compendium of Schemes' (pp.309-346) which catalogs 60+ argumentation schemes including all six instantiated as substrate atoms (sign lex-xhwqt, position-to-know lex-utn22, commitment lex-aut4h, slippery-slope lex-zd7vh, analogy lex-kh9cr, ignorance lex-hhx7u) plus expert-opinion (lex-kebfa). The compendium IS Walton's explicit identification of these as a coherent kind — the chapter title 'Compendium of Schemes' performs the metapattern-naming move that justifies a label-molecule. Methodologically: Walton's whole book frames argumentation as a SCHEME-CATALOG with shared structural features (premises, conclusion, defeasibility, critical-question checklist), so this label-molecule is the substrate-side machine-checkable expression of Walton's prose claim. Local copy in the lexicon corpus."
    quote: "[Ch.9 §1 p.309 opening of compendium]: Argumentation schemes are forms of argument (structures of inference) that represent structures of common types of arguments used in everyday discourse, as well as in special contexts like those of legal argumentation and scientific argumentation. [Ch.1 §3 p.15-16, framing the family]: One of the features of argumentation schemes that is key to evaluating whether an argument fitting a scheme should be judged strong or weak is the list of associated critical questions — questions that can be asked (or assumptions that are held) by which a nondeductive argument based on a scheme might be judged to be (or presented as being) good or fallacious. The critical questions form a vital part of the definition of a scheme, and are one of the benefits of adopting a scheme-based approach. [Ch.1 §1 p.2-3, the defeasible-presumptive structural identity]: They also represent forms of argument that are neither deductive nor inductive, but that fall into a third category, sometimes called defeasible, presumptive, or abductive."
  - source: primary
    tradition: toulmin
    text: toulmin-1958-uses-of-argument
    citation: "Stephen Toulmin, *The Uses of Argument* (Cambridge University Press 1958; updated edition 2003), Ch.II 'Probability' and Ch.III 'The Layout of Arguments' (esp. pp.15, 94-97). The methodologically-distinct second identification this label-molecule requires. Toulmin is not cataloguing argument types — he is arguing that formal logic misdescribes how arguments actually get assessed — and he arrives at the same skeleton anyway: a step from data to claim licensed by a warrant, with a separate slot for the conditions under which the warrant's authority lapses. Walton's critical-question checklist and Toulmin's conditions of rebuttal (R) are the same structural position reached from opposite directions fifty years apart, which is what independent attestation has to mean if it means anything. Toulmin also states the field-invariant/field-dependent question directly, and that question IS this label's claim: some of the structure holds across fields and some varies."
    quote: "[Ch.II p.15 — the field-invariance question, which is this label's claim stated as a research problem:] 'The first problem we have set ourselves can be re-stated in the question, \"What things about the form and merits of our arguments are field-invariant and what things about them are field-dependent?\" What things about the modes in which we assess arguments, the standards by reference to which we assess them and the manner in which we qualify our conclusions about them, are the same regardless of field (field-invariant), and which of them vary as we move from arguments in one field to arguments in another (field-dependent)?' [Ch.III p.94 — the defeasibility slot, given its own place in the layout:] 'Modal qualifiers (Q) and conditions of exception or rebuttal (R) are distinct both from data and from warrants, and need to be given separate places in our layout. Just as a warrant (W) is itself neither a datum (D) nor a claim (C), since it implies in itself something about both D and C — namely, that the step from the one to the other is legitimate; so, in turn, Q and R are themselves distinct from W, since they comment implicitly on the bearing of W on this step — qualifiers (Q) indicating the strength conferred by the warrant on this step, conditions of rebuttal (R) indicating circumstances in which the general authority of the warrant would have to be set aside.'"
  - source: primary
    tradition: pollock
    text: pollock-1987-defeasible-reasoning
    citation: "John L. Pollock, 'Defeasible Reasoning,' Cognitive Science 11(4):481-518 (1987), §2. A third identification of the same kind from a third method — formal epistemology and AI rather than informal logic or philosophy of argument — and the one that sharpens what the members' shared defeasibility-attach actually attaches. Pollock splits defeaters in two: a rebutting defeater argues the conclusion is false, an undercutting defeater leaves the conclusion alone and attacks the licence for the step. Walton's critical questions mix both kinds without marking which is which, so the split is a usable audit on any member of this molecule: for each critical question, ask whether it denies the conclusion or denies the warrant, because they fail differently and are answered differently. Pollock's own note that undercutting defeaters 'have generally been overlooked' is a caution for anyone reading a scheme's checklist as complete."
    quote: "[§2, the two-kind split:] 'There are two kinds of defeaters for prima facie reasons. Rebutting defeaters are reasons for denying the conclusion: R is a rebutting defeater for P as a prima facie reason for Q if and only if R is a defeater and R is a reason for believing ~Q. Rebutting defeaters are reasonably familiar, and they form the basis for most current AI work on nonmonotonic reasoning. But equally important are undercutting defeaters, which attack the connection between the reason and the conclusion rather than attacking the conclusion itself.' [the worked case, and the definition:] 'For instance, X looks red to me is a prima facie reason for me to believe that X is red. Suppose I discover that X is illuminated by red lights and illumination by red lights often makes things look red when they are not. This is a defeater, but it is not a reason for denying that X is red (red things look red in red light too). Instead, this is a reason for denying that X wouldn't look red to me unless it were red. ... Undercutting defeaters have generally been overlooked both in philosophy and in AI.' [Provenance: the scan's text layer runs some words together — 'reasonfor', 'asa' — and these were separated; no other normalisation was needed.]"
  - source: practitioner
    text: substrate-attestation-v103-walton-cluster
    citation: "A mining sweep shipped six Walton schemes that organically cohered into the cluster this label names: lex-xhwqt (sign), lex-utn22 (position-to-know, active via Hume Enquiry §X), lex-aut4h (commitment, active via Plato Euthyphro 10a-11b), lex-zd7vh (slippery-slope), lex-kh9cr (analogy, active via Aristotle Rhetoric II.20 paradeigma), lex-hhx7u (ignorance). All six share assembly `sequential(prep-steps) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)`. The structural-identity emerged in mining, not by design — substrate self-attestation. Per ROADMAP #15 the bar requires a refs-grounded primary that names the kind (Walton 2008 Compendium of Schemes does so); the substrate-attestation is the second confirmation that the kind is real-and-distinct (six independent instances all converged on the same compositional spine without being forced)."
