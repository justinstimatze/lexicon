id: lex-n5tgq
name: over-performing-a-captors-demand-to-hasten-release-through-their-own-satisfaction
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A captive forced to perform for a captor''s profit can resist and provoke escalation, or comply at the minimum and prolong the arrangement indefinitely, or do neither: perform beyond what''s demanded, on the bet that satisfying the captor''s greed faster than expected is what actually shortens the captivity. In the Bhuridatta-Jataka, the snake-king Bhuridatta, captured and forced into public dancing displays by a charmer who profits from the spectacle, reasons: "It will be best for me to please the crowd and dance to-day; perhaps he will gain plenty of money and in his content will let me go; whatever he makes me do, I will do it" — and performs every trick asked of him at full effort. The strategy backfires in this telling: his excellence only proves how lucrative he is and the charmer decides to tour him further rather than release him, but the reasoning itself — accelerate the captor''s satisfaction rather than wait it out — is the move being made.'
related: []
evokes: [jataka, mahanipata, bhuridatta-jataka, coerced-compliance, captivity, strategic-cooperation]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-bhuridatta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 543, Bhuridatta-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The Great Being reflected, \"It will be best for me to please the crowd and dance to-day; perhaps he will gain plenty of money and in his content will let me go; whatever he makes me do, I will do it.\""
canonical-instances:
  - "A kidnapping victim forced to record a ransom video cooperates fully and convincingly rather than signal distress, calculating that a clean, usable video gets the ransom paid and the ordeal ended faster than a botched one that forces the kidnappers to try again."
  - "An employee being pressured into unpaid overtime by a manager who profits from their output delivers exceptional work quickly, hoping to satisfy the demand fast enough to be let go home, rather than working slowly in quiet protest and prolonging the session."
critical-questions:
  - "The strategy fails here — Bhuridatta's skill convinces the charmer to extend the tour rather than end it — does over-performing a captor's demand only work when the captor's goal has a ceiling, and backfire whenever the captive's excellence just reveals a bigger opportunity?"
  - "Is there a way to tell in advance whether a given captor's satisfaction is a fixed target that can be hit, versus an appetite that grows with whatever it's fed?"
status: active
