lineage:
  - source: primary
    text: radin-hare-arms-himself-then-lets-himself-be-swallowed-on-purpose
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 14. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "The next morning Hare went out and, gathering some flint arrow-points, covered himself with them. Then he went on top of a hill and sang: 'You who can lap them in; You of whom it is said, you lap them in; Lap me in! Lap me in!' Thus he sang. Then this being came at him as fast as a flame shoots upward. ... But Hare jumped aside as he attempted to lap him in and he missed him. Then when this being came back again, Hare sang the same song again. This being was loaded with people. As he was sitting there and singing, the being spoke, 'I thought I lapped you in once.' He tried again to lap him in but always missed him. Three times he missed him. The fourth time, however, Hare allowed himself to be lapped in voluntarily."
canonical-instances:
  - "A founder who knows a hostile acquisition of their small company is nearly certain stops fighting every approach outright and instead spends the delay negotiating specific protections into any eventual deal, letting the acquisition happen on a timeline that gives those protections time to be finalized first."
  - "A patient facing a diagnosis they know is likely to be confirmed uses the time before the final test result to arrange their affairs, treatment plan, and support network, so that when the confirmation actually arrives it triggers an already-prepared response rather than a scramble."
critical-questions:
  - "Does the flint armor actually matter to what happens once Hare is inside, or is the real determining factor his willingness to act calmly once swallowed, making the physical preparation more symbolic than functional?"
  - "Is there a meaningful difference between Hare's three evasions and genuine indecision about whether to accept capture at all, or does the story frame the delay as purely strategic, testing the being's method, from the start?"
  - "Would this diagnostic apply to a situation where the 'inevitable' outcome actually could have been avoided entirely, and how would someone in the moment distinguish a genuinely unavoidable capture from one that only feels unavoidable?"
