id: lex-bd57t
name: a-backward-glance-at-the-threshold-undoes-a-completed-rescue
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A difficult transformation or rescue can be fully earned and nearly complete, only to be undone in its very last moment by a single backward glance at what's being left behind -- the real danger sits at the threshold of success, when the goal feels close enough that looking back seems safe, far more than it sits during the hardest stretch of the effort itself. The poem states the single condition, then the failure, then turns directly to the reader as a warning: 'One sole condition yet upon the boon is set: let him not turn his eyes to view his hard-won prize, till they securely pass the gates of Hell... For Orpheus -- woe is me! -- on his Eurydice -- day's threshold all but won -- looked, lost, and was undone! Ye who the light pursue, this story is for you... If on the darkness past one backward look ye cast, your weak and wandering eyes have lost the matchless prize.'"
related: []
evokes: [consolation-of-philosophy, book-iii-song-xii, days-threshold-all-but-won, looked-lost-and-was-undone, orpheus-and-eurydice]
lineage:
  - source: primary
    text: boethius-c524-consolation-of-philosophy-book-iii-song-xii
    citation: "Boethius, The Consolation of Philosophy (c. 524 AD), trans. H. R. James (London: George Bell & Sons, 1897), Book III, Song XII, 'Orpheus and Eurydice.' Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "One sole condition yet Upon the boon is set: Let him not turn his eyes To view his hard-won prize, Till they securely pass The gates of Hell.' Alas! What law can lovers move? A higher law is love! For Orpheus--woe is me!-- On his Eurydice-- Day's threshold all but won-- Looked, lost, and was undone! Ye who the light pursue, This story is for you, Who seek to find a way Unto the clearer day. If on the darkness past One backward look ye cast, Your weak and wandering eyes Have lost the matchless prize."
canonical-instances:
  - "Someone nine months into recovery from addiction, with every practical marker of success in place, relapses after a single visit to an old haunt 'just to see' whether the old life still has a pull on them."
  - "A student who has finished every section of a difficult exam and is reviewing their answers in the final minute changes a correct answer back to an earlier, wrong instinct, talking themselves out of the very reasoning that got them there."
  - "A company on the verge of completing a difficult turnaround, cash-flow positive for the first time in years, reverts to an old, failed strategy at the last board meeting because a founding investor gets nostalgic for how things used to be done."
critical-questions:
  - "Is the lesson really 'don't look back,' or is it narrower than that -- Orpheus's specific failure was breaking an explicit, stated condition of the deal, which is a different mistake than generic nostalgia or checking on the past without any rule against it?"
  - "Does framing near-success as maximally dangerous risk teaching overcaution at exactly the moment confidence is warranted -- not every backward glance actually undoes what's been achieved, and treating every last step as equally fragile could paralyze someone who's genuinely almost there?"
  - "The poem addresses the reader directly as a moral lesson -- does turning a specific, magical, one-off failure, a literal condition imposed by the god of the underworld, into a general practical warning about all human effort overreach the story's actual scope?"
status: active
