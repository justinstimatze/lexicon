id: lex-a632v
name: winning-on-speed-over-durability-can-lock-in-a-permanent-hidden-cost
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When two candidate approaches are racing toward the same immediate goal and you pick the winner purely because it got there faster, the losing approach's other qualities, like durability, don't just disappear -- they were never actually being tested, and picking on speed alone can lock in a permanent cost the contest never measured. In the Tlingit creation myth Radin quotes, the creator makes humanity from whichever material finishes first: 'Nas-caki-yel tried to make human beings out of a rock and out of a leaf at the same time, but the rock was slow while the leaf was very quick. Therefore human beings came from the leaf.' Speed was the only thing the contest measured, but the myth is explicit about what that choice actually determined: 'That is why there is death in the world. If men had come from the rock there would be no death.' The rock would have made mortals just as viable as the leaf did, on a longer timeline; instead, the race for who finishes first quietly decided something the race was never actually about. Diagnostic move: when choosing between two options based on which one is ready or wins first, check what quality that speed-based selection is actually deciding on your behalf -- durability, robustness, or some other property having nothing to do with speed can get permanently locked in or locked out as a side effect of a contest that was never designed to measure it."
