id: lex-dr8mf
name: partisan-sponsorship-of-research-breeds-the-unsponsored-partys-distrust
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When applied research into a two-sided conflict (labor and management, two competing interest groups, two sides of a policy dispute) is funded and initiated predominantly by one party, expect two compounding effects, not just one: the research will orient toward that party's concerns simply because that party defines the problems worth studying, AND the unsponsored party will rationally distrust and resist a study that appears designed to serve the other side — regardless of the actual validity or rigor of the work. Merton: 'From the fact that this research continues to be sponsored by management, we can conclude only that it has been found eminently useful and valid, within the limits of the definition of problems. But an intelligence staff for one stratum of the business and industrial population may in due course find itself focusing on problems which are not the chief problems confronting other sectors of that population.' The resistance this predictably generates is not paranoia to be corrected by better PR: 'For if workers have occasion to identify the research program as a new-fangled academic device for countering labor organizations or for scientifically substituting symbolic for material rewards, it will create rather than locate problems.' Merton's own remedy names joint sponsorship as a structural requirement, not a courtesy: 'Social research in industry, therefore, must be conducted under the joint auspices of management and labor, irrespective of the source of funds for the research.' Diagnostic use: before trusting or commissioning research into a conflict between two parties, check who is funding and defining the study's problems — if only one side is, expect both a systematic blind spot toward the other side's actual concerns AND a legitimacy deficit that no amount of methodological rigor alone can repair; the fix is procedural (joint sponsorship, joint problem-definition), not just better analysis."
