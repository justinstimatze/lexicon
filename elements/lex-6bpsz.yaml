name: compare-symmetric-hypotheticals-to-isolate-a-choices-own-value
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you want to teach or evaluate whether a particular strategic choice is genuinely good, don't just point to real historical cases where someone made that choice and succeeded — those cases are confounded by luck, starting resources, and the opponent's own errors. Instead, construct a hypothetical where two symmetric parties face the same situation and take the SAME general type of action, then show that the one who chose better within that action 'outmanoeuvres' the other — isolating the value of the choice itself from every other variable. Rangarajan's analysis of Kautilya's method names this technique directly: 'Kautilya often uses a technique of comparison to indicate the preferred course of action. He visualizes a hypothetical situation of two kings deciding to do similar things; whoever makes a better choice is said to have \"outmanoeuvred\" (atisamdhi) the other... This is purely a technique used for elucidation and does not imply that the hypothetical situations of the two kings acting in a similar way occur in reality. It is akin to the form of argument \"If I did this and my enemy did that...\"' The technique's power is structural: by holding the SITUATION and the GENERAL ACTION constant across both hypothetical parties and varying only the SPECIFIC CHOICE within that action, any resulting difference in outcome can be attributed to the choice itself rather than to an accident of circumstance, relative starting power, or the opponent's incompetence. A real historical example of a good strategic choice is always vulnerable to the objection 'maybe it worked because of X, Y, or Z, not because the choice was actually sound' — the symmetric hypothetical construction removes that objection by design, since both parties are stipulated to be identical except for the one variable being evaluated. Diagnostic move: when trying to establish that a strategic principle is sound rather than merely lucky in the historical cases used to illustrate it, construct or look for a version of the comparison where two otherwise-identical parties make the same general move and differ only in the specific choice under evaluation — if the argument can survive being restated this way, the principle is doing real explanatory work; if the argument only works with the specific, non-generalizable details of one historical case, the principle may be an illusion created by confounded circumstances rather than a genuine strategic insight."
