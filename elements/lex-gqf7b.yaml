lineage:
  - source: primary
    text: hyde-eshu-may-cause-the-troubles-that-only-his-own-divination-service-can-resolve
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 5, '\"The God of the Crossroads,\"' on the Yoruba trickster Eshu and the origins of Ifa divination. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Eshu is well known for setting people to fighting with each other; when we read at the outset that the gods themselves have been quarreling we might suspect that Eshu has been at work (it would be like him to cause a problem only he can solve!). ... In fact, people say that Eshu starts fights and stirs up troubles so that human beings will have to go to the diviners, have to sacrifice, have to feed the gods. Even if that isn’t the case, Eshu is always interested in having sacrifice attend divination, for he always takes a portion for himself (about ten percent, the same as agents take from authors)."
canonical-instances:
  - "A pest control company operating in a neighborhood has an unusually convenient pattern of new infestations appearing shortly after they canvass a block, and while no single incident proves anything, a resident who checks the timing carefully starts to wonder whether the company's reliable business is purely a response to bad luck or is quietly self-sustaining."
  - "A consultant hired to fix a company's chronically dysfunctional meetings never quite eliminates the dysfunction, and each partial fix somehow reveals a new related problem requiring further engagement, prompting a sharp executive to ask whether ongoing need for the consultant's services is being generated as much as it's being met."
critical-questions:
  - "Is it fair or even coherent to suspect a benefit-from-trouble relationship as evidence of causing that trouble, when almost every helping profession structurally benefits from problems existing, and most such professionals have no hand in creating them?"
  - "How would anyone actually distinguish, from outside, a figure who is causing the trouble they profit from resolving versus one who is simply well-positioned to notice and respond to trouble that would have happened anyway, given that the observable pattern looks identical either way?"
  - "Does Eshu's cut of the sacrifice change the moral status of this arrangement even if he didn't cause the specific trouble, since taking payment for resolving a need he benefits from perpetuating creates the same incentive structure regardless of whether he originated any particular incident?"
