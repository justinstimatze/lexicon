    quote: "'Frame styling begins by obtaining a mental image of the finished lens. ... The best way to control the finished look is to first imagine the thickness and curves of the lenses. ... A good choice for such a prescription is a small, rounded frame. ... selecting a large, angular frame would result in much thicker and heavier lenses for the same correction.'"
canonical-instances:
  - "A print designer laying out a book cover treats the spine width as fixed by the manuscript's final page count and paper stock, and sketches the cover art around that known spine measurement, rather than designing an ideal cover first and discovering afterward that the art doesn't wrap or center correctly once the actual spine width is set."
  - "A furniture buyer measures the fixed dimensions and light of an oddly-shaped room and pictures how a couch of a given size will actually sit in that specific space before browsing showroom floors for a couch they like on its own, rather than falling for a couch in the showroom and then forcing the room to accommodate it."
  - "A frontend engineer sketches the actual JSON shape a backend endpoint returns -- which fields exist, which are nullable, how deeply nested -- before designing the UI component that will display it, rather than designing an ideal component first and then either contorting the backend to match it or leaving gaps the component was never built to show."
critical-questions:
  - "How do you know the 'fixed' component is genuinely fixed, and not just currently assumed to be? A prescription really can't be renegotiated, but a spine width, a room's dimensions, or an API's response shape are sometimes changeable at some cost -- treating a movable constraint as immovable forecloses a better joint solution where both components adjust."
  - "Does picturing the fixed component's output actually require expertise the chooser doesn't yet have? Carlton calls this 'a technique that comes with experience' -- a novice optician told to 'imagine the finished lens' without having seen enough finished lenses to picture one accurately gets none of this technique's benefit and may make a worse frame choice than picking on style alone."
  - "Once the free component is chosen around the fixed one's output, does anyone check the joint result against the original goal? Carlton's own close of the section warns that 'most often there is not a frame that will meet each objective perfectly' -- picturing the fixed output first improves the choice, it doesn't guarantee the finished pair actually satisfies every requirement (cosmetic, allergy, lens-material) at once."
