    quote: "'When you are digging, you must not hit the ground too hard!' ... However, the Earth forgot, and in her haste she struck the ground so hard with the sharp-pointed stick with which she dug turnips, that the floor of the sky was broken and she fell through."
canonical-instances:
  - "A surgical team is briefed once before a routine procedure that a specific step carries catastrophic risk if rushed, and a surgeon absorbed in the flow of an otherwise ordinary operation forgets that one caution under time pressure, causing irreversible harm -- the fix afterward is a mandatory checklist enforced at that exact step, not a stronger verbal warning."
  - "A factory worker is warned during onboarding never to exceed a specific torque limit on an otherwise routine, repetitive assembly task, and months later, absorbed in the rhythm of the line, forgets that one caution during an ordinary shift and causes a catastrophic equipment failure -- not through carelessness about the job generally, but through the specific caution being crowded out by the repetition of the task it was attached to."
critical-questions:
  - "does calling this 'forgetting' let real negligence off the hook too easily -- at what point does 'I forgot, absorbed in the task' stop being a sympathetic account of an accident and become a polite name for insufficient care?"
  - "how does anyone design a structural safeguard for every possible instance of task-absorbed forgetting without adding so much friction to routine tasks that the safeguards themselves become the thing people start working around?"
  - "is this pattern meaningfully different from a deliberate, curiosity-driven violation of a prohibition (Pandora's box, Bluebeard's key) in any way that should change how we judge the person who broke the rule, or does the story simply feel more sympathetic because the intent was innocent while the outcome was identical?"
