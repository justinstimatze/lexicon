id: lex-w7fxz
name: more-items-than-containers-forces-multiplicity-in-at-least-one
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When N items must go into M containers and N > M, surface that at least one container must hold ≥2 items (pigeonhole) — name it as a structural argument, not a probability claim."
related: [lex-axa6h, lex-3d2he, lex-t5drx, lex-yx7ym, lex-tt5tv, lex-eehjz, lex-qbuw5, lex-dwey5]
evokes: [pigeonhole-principle, dirichlets-box-principle, counting-argument, n-greater-than-m-forces-collision, schubfachprinzip, leurechon-1622]
lineage:
  - source: practitioner
    text: wikipedia-pigeonhole-principle-2025-12
    citation: "Wikipedia 'Pigeonhole principle' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Pigeonhole_principle). Earliest known statement: Jean Leurechon 1622 *Récréations Mathématiques*. Also known as Dirichlet's box principle (Schubfachprinzip), named after Dirichlet's 1834 use of it. Public-domain mathematical primitive — no copyright concern at any tier. The substrate-claim: if n items are placed into m containers with n > m, then at least one container must contain more than one item. The transferable shape is N-GREATER-THAN-M-FORCES-COLLISION: when the resource-set (containers, slots, categories, codes) is strictly smaller than the demand-set (items, objects, encodings, distinguishable inputs), AT LEAST ONE element of the resource-set must be reused. The principle is a counting argument — combinatorially trivial but powerful at deriving non-obvious results. Example: of three gloves, at least two must be same-handedness; in London (population > max-hairs-on-human-head), at least two people have the same hair count. Generalizations: GENERALIZED pigeonhole (n > km forces some container with > k items); INFINITE pigeonhole (any partition of an infinite set into finitely-many subsets must have at least one infinite subset)."
    quote: "[Wikipedia 'Pigeonhole principle', 2025-12 ZIM snapshot:] 'In mathematics, the pigeonhole principle states that if n items are put into m containers, with n > m, then at least one container must contain more than one item. For example, of three gloves, at least two must be right-handed or at least two must be left-handed, because there are three objects but only two categories of handedness to put them into. This seemingly obvious statement, a type of counting argument, can be used to demonstrate possibly unexpected results. For example, given that the population of London is more than one unit greater than the maximum number of hairs that can be on a human head, the principle requires that there must be at least two people in London who have the same number of hairs on their heads.' [On origin:] 'Although the pigeonhole principle appears as early as 1622 in a book by Jean Leurechon, it is commonly called Dirichlet's box principle or Dirichlet's drawer principle after an 1834 treatment of the principle by Peter Gustav Lejeune Dirichlet under the name Schubfachprinzip (\"drawer principle\" or \"shelf principle\").' [The substrate-claim is N-GREATER-THAN-M-FORCES-COLLISION at the maximum generality: in any context where a finite resource-set is required to handle a demand-set strictly larger than itself, some element of the resource-set must be reused. The principle is constructive (it doesn't tell you WHICH resource is reused, just that some is) and existence-of (it doesn't tell you the multiplicity, just that >1). Despite its triviality, it underwrites results in number theory (Fermat's little theorem proofs), computer science (hashing collisions, lossless compression bounds), cryptography (birthday attacks), distributed systems (consistent hashing capacity), and even philosophy (uniqueness of identity claims).]"
canonical-instances:
  - "Hair-count in London: London population exceeds max hairs-on-head; therefore at least two Londoners have identical hair counts. Existence proof; doesn't identify the pair."
  - "Birthday paradox: among 23 randomly-chosen people, probability of shared birthday exceeds 50%. While not direct pigeonhole, the threshold-version (23 < 366) is informed by the same counting; the FULL birthday paradox uses generalized counting."
  - "Hashing-collision bounds: a hash function from N-bit input to M-bit output (M < N) MUST produce collisions — that's pigeonhole directly. Cryptographic hash functions design AROUND this constraint (collisions exist; finding them is hard)."
  - "Lossless compression theoretical bounds: a compressor mapping arbitrary N-bit inputs to ≤N-bit outputs CANNOT compress all inputs (some must grow). This is pigeonhole on the output-space."
  - "Birthday attack in cryptography: pigeonhole's GENERALIZED form (k items into n containers, expected first-collision at ~√n) is the basis for birthday-attack security bounds — cryptographic hash functions need ~256-bit output to resist ~128-bit-collision-finding adversaries."
  - "Mathematics: proof that √2 is irrational uses a kind of pigeonhole on remainders. Fermat's little theorem has a pigeonhole-style proof. Schur's theorem (Ramsey theory) is a pigeonhole-on-colorings."
  - "Lattice-point arguments (Minkowski's theorem): convex symmetric sets larger than a critical volume MUST contain a non-zero lattice point — pigeonhole-style on translated copies."
  - "Distributed-system capacity: consistent-hashing systems assigning K keys to N nodes (K >> N) — pigeonhole guarantees load-imbalance grows proportional to √(K/N) at minimum."
  - "operationally distinct from lex-axa6h order-of-magnitude-approximation: lex-axa6h is a strategy for tractability; lex-w7fxz is a COMBINATORIAL TRUTH that holds regardless of approximation. Different shapes (strategy vs truth)."
  - "operationally distinct from lex-t5drx computational-irreducibility: lex-t5drx is about absence-of-shortcut in computation; lex-w7fxz is a counting argument about finite-resource-vs-finite-demand. Both about constraints but at different layers."
  - "operationally distinct from lex-yx7ym: lex-yx7ym is about simple-rules-can-be-universal; lex-w7fxz is about finite-resources-force-collision. Both fundamental but different domains (computation theory vs combinatorics)."
  - "compose-related with lex-3d2he: when classification schemes have fewer slots than observed types, pigeonhole guarantees collision (some types share slots); the gap-finder lex-3d2he sometimes finds such collisions and predicts that the existing-scheme needs refinement."
critical-questions:
  - "what does pigeonhole NOT tell you? It tells you EXISTENCE of multiplicity (>1 in some container) but NOT identity (which container, which items collide). For constructive bounds, you need additional structure. Practitioner-discipline: don't use pigeonhole when you need to FIND the collision; use it when you need to PROVE one exists."
  - "what's the strength of the constraint? In the basic form (n > m), the collision-multiplicity is just ≥2. Generalized pigeonhole (n > km) gives multiplicity ≥k+1. For tighter bounds, average-and-extreme arguments work."
  - "what about the INFINITE version? Any partition of an infinite set into finitely-many subsets contains at least one infinite subset. This underlies many results in analysis (sequence-extraction, Bolzano-Weierstrass), but introduces axiom-of-choice subtleties for non-constructible partitions."
  - "where do practitioners over-apply pigeonhole? When n > m holds but the COLLISION is not problematic (e.g., assigning unique IDs from a UUID space of 2^128 to a population of 10^10 — pigeonhole formally guarantees collision but the probability is 10^-30 over the universe's lifetime). The diagnostic is whether the constraint actually BITES at relevant scales."
  - "what's the substrate-meta lesson? Trivial-looking principles (counting, monotonicity, pigeonhole) underwrite enormous machinery once applied carefully. Practitioner-discipline: when facing a hard problem, audit whether elementary combinatorial constraints have already settled some sub-question."
