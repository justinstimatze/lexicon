lineage:
  - source: primary
    text: wordsworth-1802-preface-to-lyrical-ballads
    citation: "William Wordsworth, Preface to *Lyrical Ballads* (2nd ed., 1802; with Samuel Taylor Coleridge, 1st ed. 1798). The Preface's central statement of the origin of good poetry appears in two passages. The first, widely quoted in isolation, occurs early: 'For all good poetry is the spontaneous overflow of powerful feelings.' The second, occurring later and rarely quoted alongside the first even though Wordsworth explicitly presents it as a restatement and completion of the same claim ('I have said that Poetry is the spontaneous overflow of powerful feelings...'), supplies the actual mechanism: origin in emotion recollected in tranquillity, contemplation of that recollected emotion until the tranquillity itself dissolves under 'a species of reaction,' the resulting production of a new emotion 'kindred to' (not identical with) the original, and only then — with that kindred emotion actually and presently existing in the mind — the beginning of successful composition."
    quote: "[Preface, early statement, on the necessity but insufficiency of raw feeling alone:] 'If in this opinion I am mistaken, I can have little right to the name of a Poet. For all good poetry is the spontaneous overflow of powerful feelings: but though this be true, Poems to which any value can be attached, were never produced on any variety of subjects but by a man, who being possessed of more than usual organic sensibility, had also thought long and deeply. For our continued influxes of feeling are modified and directed by our thoughts, which are indeed the representatives of all our past feelings; and, as by contemplating the relation of these general representatives to each other we discover what is really important to men, so, by the repetition and continuance of this act, our feelings will be connected with important subjects, till at length, if we be originally possessed of much sensibility, such habits of mind will be produced, that, by obeying blindly and mechanically the impulses of those habits, we shall describe objects, and utter sentiments, of such a nature and in such connection with each other, that the understanding of the being to whom we address ourselves... must necessarily be in some degree enlightened, and his affections ameliorated.' [Preface, the later, cardinal restatement supplying the actual mechanism:] 'I have said that Poetry is the spontaneous overflow of powerful feelings: it takes its origin from emotion recollected in tranquillity: the emotion is contemplated till by a species of reaction the tranquillity gradually disappears, and an emotion, kindred to that which was before the subject of contemplation, is gradually produced, and does itself actually exist in the mind. In this mood successful composition generally begins, and in a mood similar to this it is carried on; but the emotion, of whatever kind and in whatever degree, from various causes is qualified by various pleasures, so that in describing any passions whatsoever, which are voluntarily described, the mind will upon the whole be in a state of enjoyment.' [On the poet's own account of the two-stage temperament that makes this possible, describing the Poet's general character earlier in the Preface:] 'To these qualities he has added a disposition to be affected more than other men by absent things as if they were present; an ability of conjuring up in himself passions, which are indeed far from being the same as those produced by real events, yet... do more nearly resemble the passions produced by real events, than anything which, from the motions of their own minds merely, other men are accustomed to feel in themselves; whence, and from practice, he has acquired a greater readiness and power in expressing what he thinks and feels, and especially those thoughts and feelings which, by his own choice, or from the structure of his own mind, arise in him without immediate external excitement.'"
  - source: discovery-loop
    text: distinctness-audit-wordsworth-recollection-in-tranquillity-vs-existing-substrate
    citation: "Lex-0237 (Schopenhauer, aesthetic-contemplation-as-will-less-knowing) references Wordsworth only in a canonical-instance listing the Romantic poets as historical namers of sublime-nature will-quieting experiences, illustrating Schopenhauer's own account of an observer's state while perceiving art or nature — it does not engage the Preface, the spontaneous-overflow phrase, or the recollection-in-tranquillity mechanism, and its claim concerns a perceiver's temporary suspension of willing while attending to an external object, an end in itself, rather than a creator's internal, generative process of re-summoning a past emotion under calm conditions specifically in order to produce new compositional material, with the tranquillity's deliberate dissolution — not its maintenance — being the generative step. Lex-0761 (Borges/Luria, forgetting-particulars-is-the-mechanism-of-abstraction) shares a narrower family resemblance: Wordsworth's own account of thought as 'the representatives of all our past feelings' is a compression claim structurally similar to lex-bg3ad's abstraction-through-discarding-particulars primitive, but this atom's headline claim is not about abstraction in general — it is specifically about a two-stage temporal process (raw feeling now, re-created kindred feeling later under tranquillity) that produces successful composition, and the 'kindred, not identical' emotion Wordsworth describes is a fresh, presently-existing mental event rather than a schematic abstraction standing in for a category of past instances. The substrate contained no grounding of Wordsworth's Preface, the recollection-in-tranquillity mechanism, or a two-stage raw-feeling/tranquil-recollection/re-created-kindred-emotion creative-composition claim prior to this mint."
canonical-instances:
  - "The naive, single-stage misreading this atom corrects: someone justifies publishing a first draft written in the immediate heat of grief, anger, or heartbreak on the grounds that 'poetry is the spontaneous overflow of powerful feelings' — treating the phrase as license to skip revision and distance. Wordsworth's own text, less than seventy-five lines after introducing the phrase, restates it as originating specifically 'from emotion recollected in tranquillity,' explicitly locating successful composition at the far side of a contemplative, time-delayed process, not in the moment of raw feeling."
  - "The mechanism itself, in Wordsworth's own sequence: a poet experiences a powerful emotion (a loss, a landscape, an encounter); time passes; later, in a calm state, the poet deliberately recollects and contemplates that original emotion; through 'a species of reaction,' the calm itself gradually gives way, and a new emotion — 'kindred to,' not identical with, the original — arises and 'does itself actually exist in the mind'; it is this second, re-created emotion, not the first, that Wordsworth says 'successful composition generally begins' from."
  - "Memoir and trauma-writing workshop advice to wait before drafting a piece about a very recent loss or wound, on the grounds that the writer is currently 'too close to it' to shape it well — an unattributed modern echo of Wordsworth's own claim that raw, present-tense passion is not yet the material composition works with, and that a subsequent, calmer, deliberately re-summoned version of the feeling is."
  - "A songwriter reporting that the strongest version of a breakup song came together months or years after the relationship ended, when the original hurt could be deliberately revisited and reshaped rather than merely endured moment to moment — the song's actual emotional charge is real and full-strength, but it is the second-stage, contemplation-mediated charge, not a transcription of the original distress."
  - "Wordsworth's own account of the poet's general temperament, describing an 'ability of conjuring up in himself passions, which are indeed far from being the same as those produced by real events, yet... do more nearly resemble the passions produced by real events, than anything which, from the motions of their own minds merely, other men are accustomed to feel' — the same kindred-not-identical structure applied to the poet's ongoing disposition, not just a single act of composition."
critical-questions:
  - "Is 'spontaneous overflow of powerful feelings' being quoted in isolation, without the recollection-in-tranquillity clause Wordsworth uses less than seventy-five lines later to explain what the phrase actually means? Quoting the first half alone inverts the claim into exactly the single-stage raw-venting theory Wordsworth is not proposing."
  - "Is the tranquillity in question being treated as the state in which the work gets written, or as the unstable precondition whose contemplative dissolution ('the tranquillity gradually disappears') is itself the generative mechanism? These are different claims; only the second matches Wordsworth's text."
  - "Is the re-created, second-stage emotion being understood as a fresh mental event that 'does itself actually exist in the mind,' or is it being flattened into mere memory of how the original feeling felt? Wordsworth's language is explicit that contemplation produces something new and kindred, not a retrieved record."
  - "Is distance or delay being framed here as opposed to authenticity, or as the medium through which a raw, currently-unworkable feeling becomes workable material? Wordsworth's own account treats thought — 'the representatives of all our past feelings' — as what makes deliberate re-creation of feeling possible at all, not as feeling's replacement."
  - "Does the situation actually call for Wordsworth's specific two-stage recollection-and-re-creation claim, or for the more general contemplative-distance-from-willing that Schopenhauer's aesthetic contemplation (lex-v2dps) names for a PERCEIVER rather than a creator, or the general abstraction-through-discarding-particulars primitive (lex-bg3ad) with no temporal, recollection-specific content? These are adjacent but different claims."
