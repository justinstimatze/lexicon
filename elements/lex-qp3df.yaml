lineage:
  - source: primary
    text: cushing-maidens-fire-both-saves-and-betrays-her
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Rabbit Huntress and Her Adventures.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'She got up, and went nearer to the entrance of the cavern. ... In dismay and terror she threw her hands into the air, and, crouching down, rushed into the cave and retreated to its farthest limits, where she sat shuddering with fear, for she knew that one of the Cannibal Demons of those days, perhaps the renowned Atahsaia of the east, had seen the light of her fire through the cave entrance, with his terrible staring eyes, and assuming it to be a lost wanderer, had cried out, and so led her to guide him to her place of concealment.'"
canonical-instances:
  - "A hiker lost overnight in cold terrain lights a signal fire that keeps them from hypothermia and is also spotted, from much farther away than any searcher, by whatever else in the area is drawn to firelight, with no way to get the warmth without also broadcasting the exact same signal to both audiences."
  - "A small business builds a strong public brand and visible storefront to attract customers, and that same visibility is what draws a well-funded competitor's attention to an underserved niche the business had been quietly profitable in, the marketing that built the customer base being indistinguishable, from the outside, from the marketing that invited the competition."
critical-questions:
  - "Was there any way for the maiden to have kept herself warm that night without producing a signal visible from outside the cave, or does surviving a cold night in that terrain necessarily require a light source that also announces her position?"
  - "Does the story suggest the maiden could have detected the risk in advance and taken some precaution, such as shielding the fire's light from the entrance, or does it present the exposure as an unavoidable cost of the only viable survival option available to her?"
  - "Is this pattern specific to literal fire and light, or does it generalize to any signal that serves a protective function for its intended audience while remaining equally legible to an audience it was never meant for?"
