id: lex-nj6at
name: escalating-competitive-bribery-corrupts-the-arbiter-and-the-system
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two parties dispute a ruling and the losing side responds by out-bidding the winner for a reversal, the resulting bidding war doesn't just corrupt the specific decision — it destroys the arbiter's capacity to render any decision the disputants will accept as final, since each new ruling simply becomes the next side's starting bid. In the Jataka's tale of the quarreling ascetics, two bands dispute a favored resting-tree; the losing side out-bribes the winner with a finer gift to reverse the ruling, prompting a further counter-bribe, until the king who took both bribes is destroyed along with his entire kingdom: 'The king of Bharu, as old stories say, Made holy hermits quarrel on a day: For the which sin it fell that he fell dead, And with him all his kingdom perished.' The king's ordinary justice-dispensing role was never designed to survive being treated as an auction, and once both sides discovered that any ruling was purchasable, no ruling could actually settle anything."
