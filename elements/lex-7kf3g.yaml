id: lex-7kf3g
name: an-orderly-distributive-convention-persists-within-a-taboo-act
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A group engaged in a transgressive or taboo activity can still follow a calm, orderly first-come distributive norm for dividing up what's found, with each person claiming only the next item in turn -- ordinary social order doesn't collapse into a free-for-all just because the underlying activity itself is extreme. Digging up buried soldiers' bodies after a battle, a group of young Lakota men uncover one corpse after another, each still wrapped in a blanket. The looting proceeds in strict, unhurried sequence: 'This is my blanket. I have been looking for this blanket. I will have this blanket,' and the next man takes the next body's blanket the same way, five bodies deep, no dispute, no scramble. The act itself, digging up and stripping the dead, is as far outside ordinary conduct as it gets. The manner of doing it is completely ordinary."
related: []
evokes: [black-elk-speaks, fight-with-three-stars, this-is-my-blanket, digging-up-the-soldiers, orderly-conduct-inside-a-taboo-act]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch8-fight-with-three-stars
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 8, 'The Fight with Three Stars,' Standing Bear's inserted testimony. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "We got down on our hands and knees and dug in the loose ground. After a while we came to a blanket and there was a dead soldier in it, and it was tied around his legs and waist and neck. We pulled him out, and one of the men said: 'This is my blanket. I have been looking for this blanket. I will have this blanket.' So he took it. Under that was another dead soldier tied up in a blanket, and then another and another under that. [...] Each time somebody said, 'This is my blanket,' and took it."
canonical-instances:
  - "Rioters looting a burning store during civil unrest still queue politely and take turns at a single unguarded cash register, maintaining an orderly line even as the surrounding destruction is total."
  - "Soldiers stripping a defeated enemy camp of supplies divide the spoils by an agreed rotation, first pick to whoever found the item, even though the broader act of pillaging violates every peacetime norm they'd otherwise follow."
  - "Grave robbers working a cemetery in the same night divide the recovered valuables strictly by whoever's shovel struck each coffin first, maintaining a professional courtesy toward each other throughout an act society treats as monstrous."
critical-questions:
  - "Does the persistence of orderly convention inside a taboo act make the act itself feel less transgressive to the people doing it, or do the two run on entirely separate tracks in a person's mind, one governing manners and the other suspended entirely?"
  - "Would the same men have kept this orderly first-come convention over the bodies of their own dead, or does the ordinary social norm only survive here because the desecration is already sanctioned against an enemy?"
  - "Standing Bear reports this without any expressed discomfort or moral commentary -- does the absence of hesitation in the telling suggest the orderliness felt natural and unremarkable to him at the time, or is it simply not what his account of that day was trying to dwell on?"
status: active
