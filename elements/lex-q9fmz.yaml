id: lex-q9fmz
name: threatening-to-leave-forces-a-reluctant-partner-into-a-dangerous-errand
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'To move a partner who would rather stay quietly self-sufficient than take on a risky or humiliating task, threaten the relationship itself rather than argue the task''s merits — make clear that refusing costs the relationship, not just the errand. The threat does not have to be carried out to work; the possibility that it might be is what overrides the partner''s preference for staying put. In the Vessantara-Jataka, Jujaka would rather fetch his own water than send his young wife into the village where she is mocked for marrying an old man, and offers repeatedly to do her chores himself. She refuses that compromise outright: "Unless you buy a slave or maid this kind of work to do, I tell you plainly I will go and will not live with you," adding that he will watch her find happiness "in another''s arms" while his own decline continues alone. He gives in immediately and undertakes the dangerous journey to beg a slave from Vessantara — a journey he was never willing to consider on the errand''s own merits.'
related: []
evokes: [jataka, mahanipata, vessantara-jataka, threat-of-abandonment, coercion-via-relationship-stake, reluctant-compliance]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-vessantara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 547, Vessantara-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Unless you buy a slave or maid this kind of work to do, I tell you plainly I will go and will not live with you."
canonical-instances:
  - "A partner who has repeatedly refused to ask their wealthy family for a loan finally does so after their spouse says plainly that they can't keep watching him struggle out of pride and that something in the marriage will break if he doesn't at least ask — the loan request was never about the money, it was about not losing her."
  - "An employee reluctant to confront a bullying colleague finally files the complaint after their partner tells them they're tired of coming home to someone being ground down and won't keep pretending it's fine — the complaint gets filed to save the relationship at home, not to fix the workplace."
critical-questions:
  - "Jujaka's wife's threat and Vessantara's own gifts both end in the same tale's worst act — does it matter, for judging the tactic, that the coerced party here is not a neutral bystander but goes on to cause real harm to others as a direct result of complying?"
  - "The threat works because Jujaka values the marriage more than his own comfort or dignity — what happens to this mechanism when the threatened partner has less to lose than the threatener assumes, or calls the bluff?"
status: active
