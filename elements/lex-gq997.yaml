id: lex-gq997
name: reinforcement-can-weaken-a-structure-if-added-in-the-wrong-proportion
type-in: process
type-out: typology
_tier: atomic
agent-instruction: "When you have surplus resources to add to an already-organized structure, don't assume that adding more of anything automatically strengthens it -- the same act of reinforcement can help, do nothing useful, or actively damage the structure, depending entirely on what kind of surplus you add and in what proportion. Kautilya names four distinct kinds of reinforcement by insertion, only one of which is actually good: 'proper insertion -- addition of surplus chariots, horses and men in the right proportion; improper insertion -- addition of only foot soldiers; unitary insertion -- addition of only chariots or only horses; counter-productive insertion -- addition of unreliable troops.' The ranking is instructive: 'improper' and 'unitary' insertion aren't harmful, just wasted -- adding only one component type when a structure needs several in balance doesn't break anything, it just fails to deliver the benefit a balanced addition would have. 'Counter-productive' insertion is categorically worse -- it isn't a wasted opportunity, it's a net negative, because adding unreliable elements doesn't just fail to help, it introduces a new point of failure inside a previously coherent structure. The mechanism generalizes: reinforcement is never resource-neutral just because more was added -- a structure built for balanced composition gets a real benefit only from balanced additions, gets nothing from lopsided ones, and can get actively worse from additions whose reliability doesn't match the rest of the structure, regardless of how badly the extra capacity was needed. Diagnostic move: before adding surplus resources, people, or capacity to an already-functioning structure, ask what proportion and quality of addition the structure actually needs to benefit -- and treat 'we have extra capacity, let's use it' as insufficient justification on its own, since the wrong kind of surplus, especially an unreliable or untested one, can cost you more than leaving the structure as it was."
