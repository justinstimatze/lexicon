id: lex-dpra4
name: visible-prestige-signals-dont-predict-partner-quality
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When choosing between options that differ mainly in how much visible prestige or reputation they advertise, don't treat the more prestigious-looking option as the safer bet for what you actually want -- the signal that makes something look more impressive is often orthogonal, or even inverse, to the underlying quality you're actually selecting for. In Eastman's telling, two sisters lying awake choose their sky-husbands by exactly this kind of visible signal: 'I choose that brightest Star for my husband!' says the elder, while her sister settles for 'that little twinkling Star.' The outcome inverts what the signal promised: 'The husband of the elder sister who had chosen the bright star was an old warrior with a shining name, but the husband of the younger girl was a fine-looking young man, who had as yet no great reputation.' Brightness in the sky tracked established reputation, not youth, vigor, or actual compatibility as a husband -- the elder sister got exactly what brightness promised, a famous, celebrated match, and exactly what she didn't realize she was also buying, an old man, while her sister's choice of the unimpressive, barely-visible star turned out to hold the very thing the visible signal couldn't show: someone young and not yet spent building the reputation that made his brother-star shine. Diagnostic move: when a choice presents itself as an obviously superior, high-prestige option next to a modest, low-visibility one, ask what the prestige signal actually correlates with rather than assuming it correlates with what you want -- fame, brightness, and established reputation are frequently proxies for age, prior investment, or being already spoken for, not for the qualities (availability, vigor, fit) a chooser is actually trying to select."
