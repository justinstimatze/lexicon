    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.1 'Farewell to Humanity's Childhood.'"
    quote: "“After a while, given the ability to make a fully informed decision, Helena Valero decided she preferred life among the Yanomami, and returned to live with them.”"
canonical-instances:
  - "The direct textual anchor, from Benjamin Franklin's own letter on ransomed captives returned to English society: “they become disgusted with our manner of life, and the care and pains that are necessary to support it, and take the first opportunity of escaping again into the Woods, from whence there is no reclaiming them.”"
  - "Hypothetical: a management consultant argues that any employee would obviously prefer a fully remote role with flexible hours over a rigid in-office schedule. A company that actually let staff choose between the two arrangements after a year of experiencing each finds a third of employees choosing to return to the office voluntarily, citing collaboration and structure they hadn't valued in the abstract -- a result the consultant's confident prediction never anticipated because it was never tested against anyone who had lived both."
critical-questions:
  - "How representative are these captivity cases? People taken in as children, or who spent years being socialized into indigenous kinship networks, may not be comparable to an adult choosing between two societies they understand equally well from the start -- does the natural experiment actually isolate a preference for the society, or a preference for whichever community successfully socialized someone into feeling they belonged?"
  - "Even granting that captives preferred to stay, is that evidence about which society was better in some general sense, or just evidence that switching identities and communities in adulthood is difficult and that people gravitate toward wherever their currently-established social bonds are? Would the same captives, given a choice on the very day of their capture with no time to acclimate, have chosen differently?"
