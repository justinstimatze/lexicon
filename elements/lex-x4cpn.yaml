id: lex-x4cpn
name: commit-before-the-accused-can-react-to-the-accusation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when you face an accusation against someone you must decide, right now, whether to trust with something irreversible — and the accusation is credible enough to act on, but not verifiable in the time available. Plutarch's account (Life of Alexander) of Alexander's illness at Tarsus is the canonical case: gravely sick, Alexander is being treated by his physician Philip, who alone is willing to risk the cure. At the exact moment Philip brings the potion, Alexander receives a letter from his general Parmenio warning that Philip has been bribed by Darius to poison him. Alexander does not (a) quietly refuse the medicine to protect himself, nor (b) confront Philip with the accusation before drinking, giving Philip time to prepare a response. Instead: 'he put it under his pillow, without showing it so much as to any of his most intimate friends, and when Philip came in with the potion, he took it with great cheerfulness and assurance, giving him meantime the letter to read.' The crucial move is the SIMULTANEITY: Alexander drinks — committing irreversibly — at the identical moment Philip first learns he stands accused. Plutarch is explicit this is what makes the scene diagnostic rather than merely dramatic: 'This was a spectacle well worth being present at, to see Alexander take the draught, and Philip read the letter at the same time, and then turn and look upon one another, but with different sentiments.' The mechanism this exploits: a guilty party given advance warning of an accusation has time to compose a response, feign calm, or alter behavior; the same person confronted with the accusation at the exact instant the accuser has already, irrevocably, acted on trust has no such window — whatever reaction follows (panic, indignation, redoubled effort to prove innocence) is produced under conditions that make it far harder to fake convincingly than a rehearsed denial would be. Philip's reaction as Plutarch records it — 'full of surprise and alarm at the accusation, appealing to the gods to witness his innocence... beseeching Alexander to lay aside all fear' — is presented as evidence read in real time, at the moment it could do Alexander the most good if it turned out to be false alarm and no good at all if Philip actually were guilty (the poison, if real, was already administered). The generalizable claim: when you must decide whether to trust someone against a credible but unverified accusation, structuring your own irreversible commitment to occur AT THE SAME MOMENT the accused first learns of the accusation removes the accused's opportunity to calibrate their response in advance — the accused's un-rehearsed reaction under that specific timing constraint carries more evidential weight than either a reaction given advance notice, or no test of reaction at all."
related: [lex-3hefg, lex-n8smn, lex-68v4p]
evokes: [plutarch-lives, alexander-the-great, philip-the-acarnanian, parmenio, tarsus-illness, gordian-knot-companion-episode, letter-of-accusation, drink-the-potion, trust-verification-by-simultaneity, no-window-to-rehearse]
lineage:
  - source: primary
    text: plutarch-c100-life-of-alexander-philip-the-physician
    citation: "Plutarch, Life of Alexander, in Plutarch's Lives of the Noble Grecians and Romans, trans. John Dryden, revised by Arthur Hugh Clough (1859 revision of the 1683 Dryden translation; Project Gutenberg #674). Recounting Alexander's grave illness at Tarsus (contracted, by different accounts, from fatigue or from bathing in the cold river Cydnus), immediately before the Gordian knot episode in the same Life."
    quote: "None of his physicians would venture to give him any remedies, they thought his case so desperate... till Philip, the Acarnanian, seeing how critical his case was, but relying on his own well-known friendship for him, resolved to try the last efforts of his art... At this very time, Parmenio wrote to Alexander from the camp, bidding him have a care of Philip, as one who was bribed by Darius to kill him, with great sums of money, and a promise of his daughter in marriage. When he had perused the letter, he put it under his pillow, without showing it so much as to any of his most intimate friends, and when Philip came in with the potion, he took it with great cheerfulness and assurance, giving him meantime the letter to read. This was a spectacle well worth being present at, to see Alexander take the draught, and Philip read the letter at the same time, and then turn and look upon one another, but with different sentiments; for Alexander's looks were cheerful and open, to show his kindness to and confidence in his physician, while the other was full of surprise and alarm at the accusation, appealing to the gods to witness his innocence, sometimes lifting up his hands to heaven, and then throwing himself down by the bedside, and beseeching Alexander to lay aside all fear, and follow his directions without apprehension."
canonical-instances:
  - "The direct pattern-application template: when deciding whether to trust someone against an unverified accusation, structure the moment of your own commitment to coincide with the accused's first exposure to the accusation itself — not before (which gives them time to prepare) and not after (which forfeits the diagnostic value of watching their unprepared reaction)."
  - "Alexander privately pocketing the letter — showing it 'not so much as to any of his most intimate friends' — as the setup half of the technique: the accusation must stay concealed from the accused specifically, right up until the instant of simultaneity, or the test is void."
  - "Plutarch's own framing of the scene as 'a spectacle well worth being present at' — an explicit authorial flag that the value of the moment lies precisely in the two men's reactions being read side by side, in real time, under conditions neither could have staged in advance."
critical-questions:
  - "does this technique actually distinguish a guilty party from an innocent one, or could a sufficiently composed guilty party still fake the reaction? The technique raises the cost and difficulty of a convincing fake — a guilty Philip, if he existed, would need to produce genuine-seeming shock, appeal to the gods, and urge Alexander toward a poison he knows to be real, all completely improvised at the worst possible moment for him — but it does not make deception impossible in principle, only harder and higher-stakes to sustain. Treat this as a technique that shifts the odds and raises the evidential value of the observed reaction, not as an infallible lie-detector."
  - "was Alexander's action actually a calculated verification technique, or a reckless gamble dressed up in retrospect as decisive trust? Plutarch's narration frames it as deliberate and considered ('with great cheerfulness and assurance'), but the atom's transferable content is the STRUCTURE of the move (simultaneity between one's own commitment and the accused's unrehearsed reaction), which is available for use as a deliberate technique regardless of how confident Alexander himself actually felt in the moment. Note also the asymmetry of stakes: had Philip in fact been guilty, the technique would not have saved Alexander — simultaneity produces better evidence, but does not substitute for a safer, verifiable alternative when one exists (e.g., testing the medicine first, delaying treatment, or independently checking Parmenio's claim). Use this atom only for situations where waiting for full verification is not available and a trust-decision must be made now."
  - "is this the same claim as lex-3hefg (trust-formation via ability/benevolence/integrity)? No — lex-3hefg is a static evaluative framework for decomposing an existing trust relationship into its component axes; this atom is a specific, situational TECHNIQUE for testing a trust decision at the exact moment it must be made, against a specific, actionable accusation. lex-3hefg could be used beforehand to decide Philip is trustworthy in general; this atom describes what to do when a concrete accusation arrives and there is no time left to apply that general framework."
  - "is this the same claim as lex-68v4p (cost-benefit-analysis-on-honoring-a-given-word-destroys-trust)? No — lex-68v4p concerns what happens to a relationship's trust capital when one party is caught calculating whether honoring a commitment is still worth it. This atom is about a technique for GENERATING evidence about someone else's trustworthiness under time pressure, not about the effect of visible cost-benefit calculation on trust. They are adjacent (both concern the mechanics of trust under strain) but answer different questions."
