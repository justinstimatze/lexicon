canonical-instances:
  - "A rock musician who despises country music discovers a favorite blues or rockabilly record and doesn't notice it shares direct lineage with the country tradition being rejected -- the rejected genre returns wearing a different regional accent and a different fanbase, and the escape from it is really a detour back through it."
  - "A national literary movement declares independence from the colonial-era literary canon by embracing an avant-garde import from a former colonizer's own capital, not registering that the imported avant-garde had itself been shaped by translations of, or reactions to, the colonized nation's own earlier folk or oral forms."
  - "Operationally distinct from lex-j8aew apparent-nonconformity-is-often-conformity-to-a-remoter-group: Cooley and Merton's mechanism explains rejection as conformity to a genuinely different, real, distant reference group the observer simply can't see. This atom's mechanism has no second group at all -- the 'remoter' thing the rejecter conforms to is a reprocessed version of the very tradition being rejected, not an independent tradition that happens to be out of view."
  - "Operationally distinct from lex-6xw55 same-text-in-different-context-is-a-different-work: Borges's Pierre Menard claim is that identical marks in a different context of utterance genuinely constitute a different work, and treating them as the same is the error. This atom runs the opposite diagnostic -- two things that read as opposite (rejected tradition vs. its foreign replacement) are being investigated for hidden identity of content beneath a difference of surface, not defended as legitimately different works."
critical-questions:
  - "How do you distinguish a genuine hidden reimport from a superficial resemblance mistaken for lineage? Not every foreign-seeming alternative to a rejected tradition secretly contains that tradition -- sometimes the opposite really is the opposite. The Kraftwerk case is well-documented because a band member stated the influence directly; without a comparable direct account (an interview, a credited sample, a demonstrable technical borrowing), claiming hidden lineage risks manufacturing a satisfying story where there's only surface coincidence."
  - "Does naming the hidden lineage change anything for the people who made the rejection? The techno pioneers' embrace of Kraftwerk produced a genuinely new genre regardless of whether they knew its rhythmic root; tracing the round-trip is a historian's or critic's diagnostic move, not necessarily a correction the originators needed or would have wanted, since the creative result stood on its own."
  - "Whose account of the 'origin' is being trusted? The chain here rests on Bartos's retrospective description of Kraftwerk's own influences and Sicko's interpretive synthesis of what young Detroit listeners heard; both are after-the-fact narrations of a creative process, not a documented real-time transcript of anyone's listening experience, and the neatness of the round-trip is partly a function of which quotes a historian chose to juxtapose."
