id: lex-gbmev
name: subject-broadcasts-state-change-to-registered-observers
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When designing an event flow, surface that subject-broadcasts-to-registered-observers (publish-subscribe / observer pattern) decouples producers from consumers and supports many-to-many fan-out — name it as an option distinct from direct calls or queues."
related: [lex-9akfh, lex-z8m97, lex-spm8x, lex-ea5ug, lex-dwycr, lex-p25q4, lex-sjsae]
scaffolds-from: [lex-9akfh]
evokes: [gof-observer-pattern, publish-subscribe-without-broker, event-driven-decoupling, model-view-controller-update, gui-event-listeners, mvc-pattern]
lineage:
  - source: practitioner
    text: wikipedia-observer-pattern-2025-12
    citation: "Wikipedia 'Observer pattern' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Observer_pattern). The underlying primary is Gamma, Helm, Johnson, Vlissides 1994 *Design Patterns: Elements of Reusable Object-Oriented Software* (Addison-Wesley). The substrate-claim: an object (the SUBJECT) maintains a list of dependent objects (OBSERVERS) and automatically notifies them of state changes via a standardized interface method (typically update). Observers register/unregister at runtime; the subject knows its observer-set but not the observers' concrete types. This is the operational topology of one-to-many state-change-propagation — distinct from feedback (no signal returns to subject), from publish-subscribe (subject has direct observer references, no broker), and from generic decoupling-via-interface (the specific multiplicity + notification-protocol is what differentiates)."
    quote: "[Wikipedia 'Observer pattern', 2025-12 ZIM snapshot:] 'the observer pattern is a software design pattern in which an object, called the subject (also known as event source or event stream), maintains a list of its dependents, called observers (also known as event sinks), and automatically notifies them of any state changes, typically by calling one of their methods. The subject knows its observers through a standardized interface and manages the subscription list directly. This pattern creates a one-to-many dependency where multiple observers can listen to a single subject, but the coupling is typically synchronous and direct—the subject calls observer methods when changes occur.' [On distinction from pub-sub:] 'Unlike the publish-subscribe pattern, there is no intermediary broker; the subject and observers have direct references to each other.' [On the operational protocol:] 'Define Subject and Observer objects with standardized interfaces. When a subject changes state, all registered observers are notified and updated automatically. The subject manages its own state while also maintaining a list of observers and notifying them of state changes by calling their update() operation.' [The substrate-claim is the one-to-many state-change-propagation topology: subject knows its observer-set, observers act independently on receiving notification, decoupling is achieved through standardized interface rather than through an intermediary broker. The pattern is one of the 23 GoF behavioral patterns (Gamma-Helm-Johnson-Vlissides 1994).]"
canonical-instances:
  - "GUI event handling: a button (subject) maintains a list of click-listeners (observers); on click, all listeners are notified and act independently. Each listener's response is independent of the others'. Swing, Qt, AWT, GTK all use this topology directly."
  - "MVC architecture: the model is the subject; the view(s) are the observers. When the model changes, all subscribed views are notified to re-render. The model knows its view-set but not the views' concrete rendering logic."
  - "Database trigger systems: a table (subject) registers trigger procedures (observers); INSERT/UPDATE/DELETE events trigger all registered procedures. Postgres NOTIFY/LISTEN is the explicit form."
  - "File system watchers: inotify (Linux) / FSEvents (macOS) / ReadDirectoryChangesW (Windows) — the file system is the subject; consumer processes register as observers for path-change events. Multiple consumers receive the same notification."
  - "Newsletter and broadcast systems: the publisher (subject) maintains the subscriber list (observers); each issue broadcasts to all subscribers. Each subscriber acts on the message independently."
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: feedback requires the observer's response to FEED BACK to the subject (closing the loop and modifying subject behavior); observer-pattern observers receive the notification and act independently with NO required return path. A feedback-loop can be implemented USING observer-pattern (the observer feeds back via a method-call on the subject) but the topologies are distinct primitives."
  - "operationally distinct from lex-9akfh decoupling-via-indirection: lex-9akfh names the broad family (use an interface to allow either side to change independently); lex-gbmev is the specific operational case where the indirection is multiplicity-many notification with subscription-list management. Other GoF patterns (strategy, adapter, bridge) also instantiate lex-9akfh with different operational shapes."
  - "operationally distinct from publish-subscribe (broker-mediated): publish-subscribe interposes a message broker so publishers and subscribers don't know about each other. Observer-pattern keeps direct subject↔observer references. Trade-off: pub-sub is more decoupled and more scalable (fault-isolation, distributed delivery) but adds infrastructure cost; observer-pattern is simpler and synchronous-by-default but tight subject-observer coupling can leak (lapsed-listener problem) and limits horizontal scaling."
  - "operationally adjacent to lex-ea5ug clock-synchronized-distributed-receivers: lex-ea5ug is the LIGO/VLBI case where distributed receivers synthesize an aperture by clock-sync — also one-to-many but the receivers PHYSICALLY collect from one source rather than being NOTIFIED by it. The shared shape is one-source-many-receivers; the substrate-relevant distinction is signal-physical (lex-ea5ug) vs notification-protocol (lex-gbmev)."
critical-questions:
  - "the lapsed-listener problem: observers that fail to unregister keep the subject's reference, creating memory leaks. When is the subject responsible for unregistering observers (weak references; explicit dispose); when is the observer responsible (explicit cleanup)? Without clear ownership, the pattern leaks. Practitioner-discipline: every Observer-pattern instance should specify ownership of unsubscription up-front."
  - "when is observer-pattern wrong vs publish-subscribe? When subject and observers should be deployable independently (microservices), when fault-isolation matters (an observer's crash shouldn't affect the subject), when message persistence is needed, or when the consumer-list is too dynamic to know in subject's address space. When is observer-pattern wrong vs reactive-streams (RxJS, ReactiveX)? When you need backpressure, async composition, or transformation pipelines — reactive-streams add operators (map/filter/reduce on the stream) that observer-pattern lacks."
  - "does the substrate-claim require object-orientation? The Wikipedia article describes it in OO terms (subject and observer classes), but the topology — one-to-many notification with registration — is implementable in any paradigm. Functional reactive programming (FRP) and event-emitter callbacks are functional-style observer-pattern. The substrate-claim is the TOPOLOGY, not the OO implementation."
severity-tier: info
status: active
