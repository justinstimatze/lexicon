lineage:
  - source: primary
    text: hyde-the-heavy-bodied-escape-from-shame-carries-the-trap-with-it
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 7, '\"Speechless Shame and Shameless Speech,\"' contrasting the \"heavy-bodied\" and \"light-bodied\" escapes from the trap of shame, illustrated via Richard Rodriguez's memoir Hunger of Memory. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The heavy-bodied, literalizing attempt to escape from shame carries much of the trap with it—the link to the body, the silence, and so on. Inarticulately, it takes the sign for the thing itself, imagining racism inheres in the color of the skin. ... Wise to the tricks of language, the light-bodied escape from shame refuses the whole setup—refuses the metonymic shift, the enchantment of group story, and the rules of silence—and by these refusals it detaches the supposedly overlapping levels of inscription from one another so that the body, especially, need no longer stand as the mute, incarnate seal of social and psychological order."
canonical-instances:
  - "A person self-conscious about an accent spends years in speech therapy trying to eliminate every trace of it so that people will finally take them seriously, while a colleague from the same background keeps the accent and instead directly challenges colleagues who equate accent with competence, and only the second approach actually loosens the underlying association for anyone else who hears that accent."
  - "A company under criticism for excluding a group quietly changes its marketing photos to include more diverse faces while leaving its actual hiring and promotion practices untouched, treating the visible image as the problem to fix rather than the underlying equation between appearance and opportunity."
critical-questions:
  - "Is the heavy-bodied/light-bodied distinction too clean in practice, given that some literal bodily changes (gender-affirming care, reconstructive surgery after injury) are chosen by people who have also fully rejected the underlying stigma-equation, meaning the choice to alter the body doesn't necessarily indicate acceptance of the trap's logic?"
  - "Does the light-bodied escape actually work in practice against stigmas backed by real material power and violence, or does 'refusing the whole setup' rhetorically accomplish little when other people continue enforcing the old equation regardless of one's own internal refusal of it?"
  - "Could pursuing the heavy-bodied option sometimes be the more practical, if imperfect, choice, when someone lacks the social power or safety to mount light-bodied resistance and needs an immediate, if incomplete, reduction in the harm they face?"
