  - source: primary
    text: cross-proverb-convergence-two-heads-better-than-one
    citation: "Multi-tradition proverb-attestation. The transferable claim — aggregating multiple independent judgments outperforms any single judgment, when errors are uncorrelated — is attested across at least four independent proverb-traditions. (a) MIEDER ed., *A Dictionary of American Proverbs* (Oxford 1992): 7 distinct entries surveyed on the family 'two heads are better than one,' 'many hands make light work.' (b) SIMPSON-SPEAKE eds., *The Oxford Dictionary of Proverbs* (5th ed. 2008): 15 distinct entries — 'Two heads are better than one' as canonical with c.1390 attestation (Chaucer 'Two heuedes ar better thanne oon'); 'Many HANDS make light work'; 'In the multitude of counsellors there is safety' (Proverbs 11:14, biblical co-citation). (c) OWOMOYELA, *Yoruba Proverbs* (University of Nebraska Press 2005): 3 entries on the consultation-family, the Yoruba framing emphasizing communal decision-making norms. (d) GALEF, *Even Monkeys Fall from Trees* (2015): Japanese 三人寄れば文殊の知恵 (sannin yoreba monju no chie — 'when three come together, the wisdom of Manjusri'), an explicit Japanese form of the same structural claim — three independent estimators converge on bodhisattva-quality judgment. Four-tradition convergence is the transferability evidence. Distinct from lex-s7qxv quorum-trigger-over-distributed-quality-weighted-advocacy (Seeley) because lex-s7qxv is about COMMITMENT-via-quorum-threshold (when to STOP deliberating and commit collective action); lex-ythes is about ACCURACY-via-aggregation (multiple judgments produce a better estimate than one). They compose — Seeley's bees aggregate quality-weighted advocacy and commit via quorum. Distinct from lex-7tvr6 outside-view-anchor-on-reference-class-base-rate-before-inside-view (Tetlock-Kahneman) because outside-view is INDIVIDUAL discipline of consulting base rates; this atom is about consulting MULTIPLE INDEPENDENT JUDGES. They compose — outside-view is one specific method of broadening your single judgment; aggregation is the explicit multi-judge form. Distinct from lex-zag9z cross-tabulate-hypotheses-against-evidence (Bayesian discipline) because that's individual-Bayesian evidence-weighting; this is multi-judge aggregation. Distinct from lex-nx7u7 base-rate-neglect (Tversky-Kahneman) because that's an individual judgment failure mode; this is the multi-judge correction. Distinct from lex-eb3wf Klein pre-mortem because that's individual scenario-generation; this is multi-judge aggregation. Distinct from lex-jmm5b stated-intentions-are-weak-evidence-actions-are-strong-evidence because that's reading-evidence-asymmetry; this is multi-judge aggregation. Galton 1907 'Vox Populi' (Nature 75:450-451) is the canonical empirical instance of the proverb-tradition's claim. Condorcet's jury theorem (1785) is the formal statement. Surowiecki 2004 *The Wisdom of Crowds* is the popular modern treatment; Tetlock-Mellers-Pennock 2015+ superforecasting research is the instrumented program testing the structural conditions."
    quote: "[Mieder ed. *Dictionary of American Proverbs* 1992, entry 'head' / 'hand' family:] 'Two heads are better than one. [...] Many hands make light work.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'TWO heads are better than one':] 'c 1390 GOWER Confessio Amantis ii. 102 As men sein, betre is the prudent and the avised hed, than is the soutle [...] [Recorded as English proverb from c.1390; Boswell 1791 Life of Johnson cites it as common saying.] [Same volume, paired entry 'In the multitude of COUNSELLORS there is safety':] 'PROVERBS xi. 14 In the multitude of counsellors there is safety. 1639 J. CLARKE Paroemiologia Anglo-Latina 24 In the multitude of counsellours there is good speed.' [Same volume, 'MANY hands make light work':] '1330 in I. Gollancz Pearl Erkenwald (1922) 5 With ympe and with mony hond.' [Galef *Even Monkeys Fall from Trees* 2015, on the Japanese form:] '三人寄れば文殊の知恵 (sannin yoreba monju no chie) — when three come together, the wisdom of Manjusri.' [Owomoyela *Yoruba Proverbs* 2005, on cross-cultural reference:] '\"Two heads are better than one\"' [used in explicit comparison-to-Yoruba consultation norms]. [The cross-cultural pattern: four traditions (English-American, English-British, Japanese, Yoruba) independently encode the structural claim that aggregating multiple independent judgments beats any single judgment. The atom extracts the structural condition — uncorrelated errors — without committing to any one tradition's framing.]"
canonical-instances:
  - "Galton 1907 vox populi (Nature 75:450-451): 787 fairgoers independently guessed the dressed weight of an ox; the mean of their guesses was within 1% of the true weight (the median within 0.8%). The proverb-tradition's empirical prediction was vindicated under controlled-instrumented conditions decades before Surowiecki popularized the finding."
  - "Tetlock superforecasting research (2015+): the Good Judgment Project demonstrated that aggregating the predictions of well-calibrated forecasters via simple weighted averaging beats both expert consensus and any individual forecaster. The independence condition is critical — Tetlock-Mellers also showed that team-deliberation can DESTROY accuracy when team members' errors become correlated through shared reading or premature anchoring."
  - "Adversarial collaboration in research (Mellers-Tetlock 2010s): two scientists with opposing hypotheses commit to a study design that both accept. The aggregated 'joint' result is more credible than either scientist's solo finding because their errors are MAXIMALLY uncorrelated (they want opposite outcomes). The proverb-tradition's structural claim applied to peer review."
  - "Medical second opinions: independent diagnostic judgments from different specialists with different training reduce diagnostic error. The structural condition for accuracy gain is INDEPENDENCE — if the second specialist reviews the first's notes before forming their judgment, the errors correlate and the second-opinion benefit collapses. Modern triple-blind diagnostic procedures operationalize this."
  - "Distinguished from cases where aggregation HURTS (the independence condition fails): a meeting where senior people speak first anchors the room (Asch 1951 conformity effects); information cascade in financial markets (Bikhchandani-Hirshleifer-Welch 1992) where each trader copies the previous; ensemble ML models trained on the same data tend to share blind spots. In these failure modes, aggregation just amplifies the shared bias. The atom predicts this — it names the independence condition explicitly."
  - "Distinguished from lex-s7qxv Seeley quorum-trigger: Seeley's quorum-trigger is about COMMITMENT (when to stop deliberating); two-heads is about ACCURACY (multiple judgments aggregate better than one). They compose — Seeley's swarm uses both moves (quality-weighted aggregation for accuracy + quorum-trigger for commitment)."
  - "Distinguished from group polarization (Sunstein 2002): when a group of like-minded judges deliberates, they tend to MORE EXTREME positions than the average of their initial views. The mechanism is exactly the failure of the independence condition — shared priors mean shared confirmation, and discussion amplifies it. The atom's structural condition (uncorrelated errors) is exactly what group polarization violates."
critical-questions:
  - "Are the judges actually INDEPENDENT? The structural condition for accuracy gain is uncorrelated errors. If the judges share priors, source material, training, or institutional pressure, their errors correlate and the aggregation just confirms the shared blind spot. Diagnostic: would each judge make the SAME mistake on the same case? If yes, aggregation buys you nothing."
  - "Has the elicitation procedure preserved independence? Asking N judges sequentially with each one seeing prior answers (a meeting; a comment thread) destroys independence. Use blinded simultaneous elicitation to preserve the structural condition. The Galton ox-weight method (silent independent ballot) is the canonical operational form."
  - "What's the aggregation function — simple mean, median, weighted by track record? Simple mean is provably best when judges are equally calibrated and errors are normally distributed; median is more robust to outlier-judges; track-record-weighted is best when judge calibrations differ. Choose explicitly rather than defaulting; small-sample mean is easily dominated by one bad judge."
  - "Are you using 'two heads' as cover for diffusing accountability? The failure mode: convening a committee not to improve accuracy but to spread blame. The atom is about structural accuracy gain, not about social ritual. If the diagnostic test for independence fails, you're using the atom for political cover, not for transferable benefit."
  - "Is the question one where averaging makes sense? For numerical estimation (ox weight, calorie content, polling), aggregation is straightforward. For categorical choice (this candidate vs that candidate), aggregation requires careful design (majority vote, Borda count, approval voting — each with different incentive properties). For creative generation (which design is more beautiful?), aggregation may smooth out the distinctive features. Match the aggregation method to the question type."
