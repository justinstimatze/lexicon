id: lex-exwte
name: dont-re-extend-trust-once-betrayal-intent-has-shown-itself
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Once someone has revealed an intent to harm you, treat any later reconciliation attempt as the same risk repeated rather than as caution restored. The Panchatantra's monkey, having escaped a crocodile who lured him across a river specifically to kill and eat him, refuses every later appeal to resume the friendship. The frame verse states the general rule directly: 'We dare not trust a rogue; nor must we trust in those deserving trust: for danger follows, and we fall destroyed and ruined, roots and all.' A second verse sharpens it further: 'Whoever trusts a faithless friend and twice in him believes, lays hold on death as certainly as when a mule conceives' — naming the near-impossibility of the mule's conception as the exact scale of unlikelihood assigned to a repeat betrayer's reform."
related: []
evokes: [panchatantra, loss-of-gains, dont-re-extend-trust-after-revealed-betrayal, second-chance-for-a-revealed-predator]
lineage:
  - source: primary
    text: panchatantra-ryder1925-monkey-and-crocodile
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book IV, 'The Monkey and the Crocodile.' Verified verbatim against a direct extraction of the held copy."
    quote: "We dare not trust a rogue; nor must We trust in those deserving trust: For danger follows, and we fall Destroyed and ruined, roots and all."
canonical-instances:
  - "a business partner who was caught actively diverting funds asks for a fresh start after making restitution, and the wronged party declines any renewed partnership, treating the disclosed intent itself — not just the specific act — as the disqualifying fact, regardless of the sincerity of the current apology."
critical-questions:
  - "Does this rule risk becoming a permanent life sentence with no path back for someone who was capable of a single, genuinely out-of-character lapse rather than a settled disposition to betray?"
  - "How is a person supposed to distinguish revealed betrayal-intent — the crocodile's, which was total and specific — from a single bad judgment call that doesn't actually predict a repeat, before applying a permanent no-second-chances rule?"
status: active
