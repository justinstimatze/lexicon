evokes: [highlighting-and-hiding, framing-effect, what-is-this-hiding, blind-spot-of-the-frame, no-neutral-framing, model-incompleteness, inverse-of-highlight, surfacing-the-hidden-aspect, framing-as-choice, deliberate-frame-swap, conduit-metaphor-Reddy, LABOR-IS-RESOURCE-hides-meaning, BUSINESS-IS-WAR-hides-retention, perspective-by-incongruity-Burke, Heisenberg-uncertainty-as-metaphor, methodological-pluralism, lens-incompleteness, externalities-as-hidden-aspects-asserting-themselves]
lineage:
  - source: primary
    text: lakoff-johnson-1980-metaphors-we-live-by
    citation: "George Lakoff and Mark Johnson, *Metaphors We Live By* (University of Chicago Press 1980; afterword 2003 reissue), Chapter 3 'Metaphorical Systematicity: Highlighting and Hiding'. The transferable claim is that the same systematicity that makes a metaphor useful (it imports source-domain structure into the target domain) is what hides target-domain aspects that don't fit the source. ARGUMENT-IS-WAR highlights the adversarial aspects of arguing and hides the cooperative aspects; LABOR-IS-RESOURCE highlights the quantifiable aspects of labor and hides the meaning-and-satisfaction aspects; the conduit metaphor for language (IDEAS ARE OBJECTS, LANGUAGE IS A CONTAINER, COMMUNICATION IS SENDING — Reddy 1979) highlights the transmissible aspects of communication and hides the contextual-construction aspects. The atom GENERALIZES this specific claim about conceptual metaphors into a broader epistemological primitive: any framing/model/lens/abstraction has hidden aspects that are the inverse of what it highlights. Related work: Burke 1935 *Permanence and Change* on 'perspective by incongruity'; Schön 1979 'Generative Metaphor' on framing in policy; Wittgenstein's seeing-as in *Philosophical Investigations*; the methodological-pluralism tradition in social science (Habermas, Bohman). The transferable affordance — 'what is this making invisible' as a debugging move — is the practitioner-discipline that the atom names."
    quote: "[Lakoff & Johnson 1980 Ch.3 opening:] 'The very systematicity that allows us to comprehend one aspect of a concept in terms of another (e.g., comprehending an aspect of arguing in terms of battle) will necessarily hide other aspects of the concept. In allowing us to focus on one aspect of a concept (e.g., the battling aspects of arguing), a metaphorical concept can keep us from focusing on other aspects of the concept that are inconsistent with that metaphor. For example, in the midst of a heated argument, when we are intent on attacking our opponent's position and defending our own, we may lose sight of the cooperative aspects of arguing. Someone who is arguing with you can be viewed as giving you his time, a valuable commodity, in an effort at mutual understanding. But when we are preoccupied with the battle aspects, we often lose sight of the cooperative aspects.' [Same chapter, on the partial-not-total structuring:] 'These examples show that the metaphorical concepts we have looked at provide us with a partial understanding of what communication, argument, and time are and that, in doing this, they hide other aspects of these concepts. It is important to see that the metaphorical structuring involved here is partial, not total.' [On the LABOR-IS-RESOURCE case:] 'LABOR IS A RESOURCE and TIME IS A RESOURCE are by no means universal... These metaphors highlight those aspects of labor and time that are centrally important in our culture. In doing this, they also deemphasize or hide certain aspects of labor and time... The view of labor as merely a kind of activity, independent of who performs it, how he experiences it, and what it means in his life, hides the issues of whether the work is personally meaningful, satisfying, and humane.' [On the practitioner consequence:] 'The RESOURCE metaphors for labor and time hide all sorts of possible conceptions of labor and time that exist in other cultures and in some subcultures of our own society: the idea that work can be play, that inactivity can be productive, that much of what we classify as LABOR serves either no clear purpose or no worthwhile purpose.'"
canonical-instances:
  - "ARGUMENT-IS-WAR (Lakoff-Johnson Ch.1+3): highlights the adversarial-zero-sum-strategic aspects; hides the cooperative-mutual-understanding-gift-of-time aspects. The framing makes 'I won the argument' feel like an achievement and makes 'we both came to understand each other better' feel like a non-result. Practitioners noticing 'arguments become wins-and-losses and no one understands anyone better' should diagnose the framing first."
  - "LABOR-IS-A-RESOURCE (Lakoff-Johnson Ch.3): highlights the quantifiable-divisible-tradable aspects of work; hides the meaningful-satisfying-humane aspects. Organizations operating purely on the LABOR-IS-RESOURCE framing are repeatedly surprised by burnout, attrition, quiet-quitting, and engagement crises — those are the hidden aspects asserting themselves as second-order consequences. The fix isn't 'better resource management' (which only optimizes within the framing); it's adopting a COMPLEMENTARY framing that highlights meaning/satisfaction."
  - "TIME-IS-MONEY (Lakoff-Johnson Ch.2-3): highlights budgetable-spendable-saveable; hides cyclical-relational-experiential. Cultures and subcultures that don't operate on TIME-IS-MONEY (some indigenous cultures, contemplative traditions, deep-friendship-time) experience the resource-framed-time of mainstream culture as alienating — because TIME-IS-MONEY hides the relational-experiential aspects their cultures highlight."
  - "Reddy's conduit metaphor for language (IDEAS ARE OBJECTS, LANGUAGE IS A CONTAINER, COMMUNICATION IS SENDING — Reddy 1979 'Conduit Metaphor'): highlights the transmissible-information aspects of communication; HIDES the contextual-co-construction-interpretive aspects. Practitioners working on technical writing, documentation, prompt-engineering for LLMs, customer-service-script design who operate only on the conduit metaphor will repeatedly be surprised by 'we sent them the message, why did they not understand' — that's the hidden contextual-construction aspects asserting themselves."
  - "BUSINESS-IS-WAR (extension of ARGUMENT-IS-WAR to commercial competition): highlights the adversarial-competitive-defeat-the-opponent aspects of business; HIDES the cooperative-customer-relational-employee-retention-supplier-trust aspects. Companies operating on BUSINESS-IS-WAR have high competitive intensity AND high employee burnout, customer churn, supplier mistrust — the inverse-of-the-highlight asserting itself. Companies that complement BUSINESS-IS-WAR with BUSINESS-IS-GARDENING (cultivating long-term ecosystems) or BUSINESS-IS-CRAFT (pride-of-work) typically have better long-term retention."
  - "The practitioner debug move — 'what is this framing making invisible?': applies whenever you notice repeated surprises in a domain. The hidden aspects don't disappear from reality; they only disappear from the framing. When they assert themselves as externalities (environmental damage from extractive ECONOMICS-IS-MACHINE; mental-health crisis from ATTENTION-IS-RESOURCE-TO-CAPTURE; burnout from LABOR-IS-RESOURCE), the diagnostic question is 'what framing made this invisible until it asserted itself'."
  - "Distinguished from lex-kfdep conceptual-metaphors-structure-cognition (meta-claim) and lex-zwnfz abstract-concepts-inherit-bodily-schemas (specific sub-mechanism). lex-kfdep says metaphors ARE cognitive infrastructure; lex-zwnfz says orientational metaphors inherit bodily schemas; this atom (lex-sp7fa) says any framing has hidden inverse-of-highlight aspects. lex-kfdep → lex-zwnfz → lex-sp7fa is a generality chain: meta-claim → one specific sub-class → general property of all framings."
critical-questions:
  - "Is the 'no neutral framing' claim absolute, or does it admit of degrees? Some framings hide MORE than others. Multi-perspectival framings (combining several metaphors deliberately) hide less than single-metaphor framings. The transferable advice is not 'all framings are equally blinding' but 'every framing is partial, so combine framings and surface what each hides'."
  - "How do you distinguish hidden aspects (the framing makes them invisible) from non-existent aspects (the framing correctly says there's nothing there)? Hidden aspects assert themselves as second-order consequences, externalities, complaints, or eventual collapse. Non-existent aspects don't. If the framing is repeatedly surprised by something, that something is hidden, not non-existent."
  - "Have you accounted for the fact that DELIBERATELY using a framing that hides specific aspects is sometimes correct? Pedagogical framings hide complications until the student is ready (Newtonian mechanics hides relativistic effects appropriately at low velocities). The transferable advice is not 'never hide' but 'know what you're hiding and why'."
  - "Does this atom imply moral neutrality between framings? No — some framings hide aspects whose hiddenness causes substantial harm (LABOR-IS-RESOURCE hides worker meaning; ECONOMY-IS-MACHINE hides environmental damage). The atom is a transferable debugging tool, not a relativism about framings. Acting from a single framing without knowing what's hidden creates predictable downstream harm."
  - "How does this compose with lex-2kjmb organisms-minimize-surprise? When a framing-and-the-hidden-aspects diverge, the organism (person, organization) can minimize surprise via two routes: (a) UPDATE the framing to include the hidden aspects (inference route — adaptive); (b) ACT to suppress the assertion of hidden aspects (suppress whistleblowers, fire critics, dismiss complaints — the action route — pathological in this case). lex-sp7fa + lex-2kjmb together name a diagnostic for organizational pathology: when a framing has hidden aspects asserting themselves and the organization chooses the action-route, that's the mechanism behind 'we keep being surprised by the same problem'."
status: active
