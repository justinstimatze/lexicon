id: lex-nn3u9
name: extraordinary-claims-require-extraordinary-evidence
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When a claim conflicts with strong prior evidence, demand commensurately strong evidence for it. The bar for accepting extraordinary claims must match the prior probability against them — otherwise belief is determined by what arrived recently, not by the weight of evidence."
related: [lex-2cjtz, lex-36cbh, lex-39muf, lex-abbes, lex-bj7ak, lex-dm5te, lex-hjnej, lex-k6d7u, lex-kebfa, lex-n3ayj, lex-n7dqw, lex-nx7u7, lex-q9asc, lex-rktsy, lex-sgd2s, lex-u29fu, lex-vmas8, lex-vx867]
scaffolds-from: [lex-k6d7u, lex-39muf, lex-vmas8]
evokes: [the-falsehood-must-be-more-miraculous-than-the-fact, evidence-strength-must-match-claim-strength, sagans-balance-test, the-miracle-test, weigh-testimony-against-natural-uniformity]
lineage:
  - source: primary
    text: hume-enquiry-1748
    citation: "David Hume, *An Enquiry Concerning Human Understanding* (1748). (Project Gutenberg #9662). Hume's argument in Section X 'Of Miracles' Part I (¶91): the credibility of testimony for an event must be weighed against the unlikelihood of the event itself. A miracle is by definition a violation of the regular course of nature (= maximally improbable on the inductive evidence); therefore testimony for a miracle, even from a normally-reliable witness, may not suffice — the falsehood of the testimony must be MORE improbable than the miracle itself. This is the canonical statement of what Carl Sagan in the 1980s reformulated as 'extraordinary claims require extraordinary evidence'. Hume's specific target was religious miracle-claims, but the maxim is fully general."
    quote: "[Hume, Enquiry Section X Part I ¶91:] 'The plain consequence is (and it is a general maxim worthy of our attention), \"That no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish; and even in that case there is a mutual destruction of arguments, and the superior only gives us an assurance suitable to that degree of force, which remains, after deducting the inferior.\" When anyone tells me, that he saw a dead man restored to life, I immediately consider with myself, whether it be more probable, that this person should either deceive or be deceived, or that the fact, which he relates, should really have happened. I weigh the one miracle against the other; and according to the superiority, which I discover, I pronounce my decision, and always reject the greater miracle. If the falsehood of his testimony would be more miraculous, than the event which he relates; then, and not till then, can he pretend to command my belief or opinion.' [¶90 setup:] 'There must, therefore, be a uniform experience against every miraculous event, otherwise the event would not merit that appellation. And as a uniform experience amounts to a proof, there is here a direct and full proof, from the nature of the fact, against the existence of any miracle.' [The structural claim: the prior on a miracle, derived from inductive uniformity, is very low; therefore the likelihood-ratio (testimony-given-true / testimony-given-false) must be correspondingly high for posterior belief to be warranted. This is a quasi-Bayesian argument 200 years before Bayes was formalized.]"
  - source: practitioner
    text: sagan-cosmos-and-baloney-detection
    citation: "Carl Sagan, *Cosmos* episode 12 (1980) + *The Demon-Haunted World: Science as a Candle in the Dark* (1995) Ch.12 'The Fine Art of Baloney Detection'. Tier-3 deepening: Sagan reformulated Hume's maxim as 'extraordinary claims require extraordinary evidence' (often abbreviated ECREE) and operationalized it as a scientific-skeptic toolkit alongside Occam's razor and Bayesian reasoning. The Sagan formulation became the canonical 20th-c. version of the principle in popular-science culture. Cross-attests in scientific skepticism literature (Shermer 1997 *Why People Believe Weird Things*; CSI / *Skeptical Inquirer* magazine); extensively cross-cited."
    quote: "[Tier-3 deepening — Sagan 1980 *Cosmos*: 'Extraordinary claims require extraordinary evidence.' Sagan extended Hume's argument from miracles-specifically to all claims that defy well-established scientific consensus (alien visitations, paranormal phenomena, alternative medicine, conspiracy theories). The operational form: when a claim conflicts with the inductive uniformity established by mainstream science, the evidentiary bar must rise proportional to the conflict. Sagan also added the converse (often forgotten): NON-extraordinary claims require only ordinary evidence — the maxim does not impose general skepticism, only proportional skepticism.]"
  - source: practitioner
    text: bayes-1763-essay-and-modern-formalization
    citation: "Thomas Bayes 1763 'An Essay towards solving a Problem in the Doctrine of Chances' (posthumous, *Philosophical Transactions* 53:370-418); Earman 2000 *Hume's Abject Failure: The Argument Against Miracles* (Oxford UP) for the Bayesian reconstruction of Hume's argument. Tier-3 deepening: Hume's miracle-test maps directly onto Bayesian posterior calculation: P(miracle | testimony) = P(testimony | miracle) × P(miracle) / P(testimony). If P(miracle) is small (low inductive prior), then P(testimony | miracle) must be much larger than P(testimony | ¬miracle) for the posterior to be high. Hume's qualitative argument anticipated the Bayesian quantitative form. Earman 2000 argues Hume's argument has technical defects (treats 'proof' too strongly) but the underlying Bayesian intuition is sound."
    quote: "[Tier-3 deepening — Bayesian formalization of Hume's miracle test: with H = miracle-claim, E = testimony, P(H|E) = P(E|H)P(H)/P(E). Hume's argument: P(H) is small (inductive uniformity); for P(H|E) to be substantial, the likelihood-ratio P(E|H)/P(E|¬H) must be very large. Operationally: how impossible would the testimony be IF the event didn't happen? If less impossible than the event itself, dismiss the testimony. Hume's 'mutual destruction of arguments' is the explicit acknowledgment that you can have evidence for AND against, and the rational stance is proportional belief.]"
canonical-instances:
  - "the resurrection-claim case: the canonical Hume instance. Someone tells me a dead person came back to life. By all uniform experience, dead people stay dead. For me to believe the testimony, the testimony must be such that its falsehood (the witness lied or was deceived) would be MORE improbable than the dead-person-living. Witnesses lie + are deceived constantly; resurrection is unobserved in uniform experience. Therefore: reject the testimony"
  - "alien-visitation claims: applying ECREE — the prior on alien visitation is constrained by physics (interstellar travel is extraordinarily difficult, no detection from SETI) so the prior is low. Eyewitness testimony of UFOs is consistent with hallucination, misidentification, hoax, all of which are documented and ordinary. The likelihood-ratio doesn't favor the alien-hypothesis. Transferable: this is Hume's exact method applied to a modern target"
  - "the standard scientific-publication asymmetric burden: a paper claiming a result that contradicts well-established theory faces higher review-bar than a paper claiming an incremental extension. This is not bias — it's a working instantiation of ECREE. The extraordinary claim (e.g., faster-than-light neutrinos OPERA 2011) requires evidence proportional to the disruption it would cause to the established uniformity"
  - "judicial standard of proof gradation: 'preponderance of evidence' for civil cases, 'beyond reasonable doubt' for criminal cases, 'clear and convincing evidence' as an intermediate. The legal system explicitly recognizes that different claims require different evidentiary thresholds — the more severe the consequence + the more deviating the claim, the higher the bar. ECREE in formal-institutional form"
  - "epistemic-courage failure-mode: ECREE can become a license for motivated-reasoning (lex-rcj6y) — 'this claim contradicts what I believe, so it needs extraordinary evidence' is sometimes a way to set the bar so high that no evidence will move you. Hume himself was aware (Section X Part II) that this can devolve into perfect skepticism. The discipline is to set the bar by inductive uniformity, not by personal belief"
  - "compositional with lex-k6d7u credence-as-graded-belief: ECREE only makes sense in a graded-belief framework. With Boolean belief (only 'believe' or 'don't believe'), there's no room for proportional adjustment. The Bayesian framing (high-quality lex-k6d7u) is the natural home for ECREE — credence in claim H given evidence E is proportional to prior × likelihood-ratio"
  - "compositional with lex-kebfa argument-from-expert-opinion + lex-q9asc testimony-credibility: ECREE constrains how strong even expert-testimony or normally-credible-testimony can be when the claim is extraordinary. Walton's CQ2 (Field-Question — is the expert speaking within their expertise?) interacts with ECREE: an expert speaking about an extraordinary claim outside their domain doesn't bring the domain-expertise weight needed to overcome the low prior"
  - "operationally distinct from lex-39muf problem-of-induction: lex-39muf questions whether ANY induction is justified at all; lex-nn3u9 takes inductive uniformity as established and asks how testimony interacts with that uniformity. lex-nn3u9 is INSIDE the Humean inductive framework; lex-39muf challenges the framework itself. They are complementary: lex-39muf explains why we should hold inductive conclusions tentatively; lex-nn3u9 explains how to update tentative conclusions in the face of testimony"
  - "the convention-violation case in technical work: when a code review finds a pattern that violates established convention, the reviewer asks 'is there a strong reason this case is special?' If no strong reason, the convention wins. The reviewer's stance is ECREE-shaped — the unusual claim (this special-case is worth deviating for) needs proportional justification. Without the justification, the deviation reads as carelessness rather than insight"
critical-questions:
  - "how do you avoid weaponizing ECREE for motivated reasoning? Hume's own answer (Section X Part II): the prior must come from UNIFORM EXPERIENCE, not personal preference. The discipline: when invoking ECREE, name the specific inductive uniformity the claim violates, and consider whether you would apply the same bar to a claim you DO want to believe. If your bar moves with your preferences, you're motivated-reasoning, not applying ECREE"
  - "how extraordinary must evidence be to overcome an extraordinary claim? The Bayesian answer: enough to make the posterior P(H|E) > P(¬H|E). Concretely: if the prior P(H) is 1-in-a-million, you need the likelihood-ratio P(E|H)/P(E|¬H) to exceed 1,000,000. For most testimony, this is unachievable. But for repeatable experiments + independent multiple-witness + transparent methodology, the likelihood-ratio CAN be very large. ECREE doesn't make extraordinary claims unbelievable; it sets a calibrated threshold"
  - "does ECREE undermine the genuine surprise of paradigm shifts? Concern (Kuhn 1962): if extraordinary claims always require extraordinary evidence, science can never accept revolutionary theories — by definition they conflict with the established uniformity. Response: paradigm shifts DO accumulate extraordinary evidence (Einstein's general relativity made novel predictions confirmed in 1919; quantum mechanics survived decades of unsuccessful classical-physics alternatives). ECREE delays acceptance of revolutionary theories appropriately but does not prevent it. The pace of paradigm-shift is set by the rate at which extraordinary evidence accumulates"
  - "is the 'extraordinary' standard objective or culturally relative? Concern: what counts as 'extraordinary' depends on the inductive-uniformity database the assessor draws from. A claim that's extraordinary in one tradition (e.g., spiritual healings in a secular-scientific framework) is ordinary in another. Response: the operational ECREE requires shared evidential standards across the parties to a dispute. When two communities have different inductive uniformities (e.g., scientific vs. religious epistemic frameworks), ECREE doesn't adjudicate between the frameworks — but WITHIN any given framework, it gives a coherent rule"
status: active
