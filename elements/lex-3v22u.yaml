id: lex-3v22u
name: separating-the-test-from-the-generator-dissolves-the-search-paradox
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a search for something you don't yet have feels logically paradoxical — how can you look for what you can't already recognize you're looking for? — check whether you're conflating two separable things: a TEST that recognizes a correct answer once produced, and a GENERATOR that produces candidate answers to test. Newell and Simon's 1976 reformulation of Plato's Meno dissolves the ancient version of exactly this puzzle (Meno: 'And how will you inquire, Socrates, into that which you know not? What will you put forth as the subject of inquiry? And if you find what you want, how will you ever know that this is what you did not know?') by making the separation explicit: 'To state a problem is to designate (1) a test for a class of symbol structures (solutions of the problem), and (2) a generator of symbol structures (potential solutions). To solve a problem is to generate a structure, using (2), that satisfies the test of (1).' Chess is their sharpest illustration of how far apart the two can sit: 'A simple test exists for noticing winning positions, the test for checkmate of the enemy King. In the world of dreams one simply generates a strategy that leads to checkmate for all counter strategies of the opponent. Alas, no generator that will do this is known to existing symbol systems (man or machine). Instead, good moves in chess are sought by generating various alternatives, and painstakingly evaluating them with the use of approximate, and often erroneous, measures that are supposed to indicate the likelihood that a particular line of play is on the route to a winning position. Move generators there are; winning move generators there are not.' Holding a perfectly reliable recognition criterion for a goal is not the same achievement as holding a method that reliably produces it — the paradox only looked like a paradox because ordinary language calls both of these 'knowing.'"
