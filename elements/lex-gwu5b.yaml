id: lex-gwu5b
name: unstable-criterion-yields-to-each-passing-critic
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern whenever a decision-maker holds no stable criterion of their own and instead re-derives their policy from whichever critic they most recently encountered, reversing course each time to satisfy the latest complaint rather than checking the complaint against a standard set in advance. Aesop's fable 'The Miller, His Son, and Their Ass' (trans. V. S. Vernon Jones, 1912) runs the failure to its full conclusion: a miller and his son are walking their donkey to market to sell it. A group of girls mocks them for walking when they could ride; the father puts the son on the donkey. Old men then criticize the son for riding while his father walks; the father swaps places. Women and children then call the father selfish for riding in comfort while the boy walks; both mount together. Travellers then accuse them of overloading the animal — 'you'd do better to carry him' — and, absurdly, they do: they tie the donkey's legs to a pole and carry him between them, at which the whole town turns out to laugh, and at a bridge the terrified, struggling donkey breaks free, falls into the river, and drowns. The miller returns home 'convinced that in trying to please all he had pleased none, and had lost his Ass into the bargain.' The mechanism: each individual piece of criticism, taken alone, is not obviously wrong — riding while a child walks IS inconsiderate; overloading an animal IS a real problem — but the miller has no standing criterion by which to weigh competing claims against each other, so each new critic simply overwrites the last one's advice rather than being checked against it. The absence of a stable decision rule doesn't produce a neutral, averaged outcome; it produces a RATCHET toward the most extreme reading of the most recent complaint, because each swap is a full capitulation, not a partial adjustment. The asset is destroyed at the exact point where the criticism, taken to its most literal extreme, stops being solvable at all. The corrective is not 'ignore all criticism' — several of the individual complaints were independently reasonable — it is to fix a decision criterion BEFORE the walk begins (what is this trip actually optimizing for: speed, the animal's welfare, the son's fatigue, propriety?) and to filter every piece of incoming criticism through that pre-set criterion rather than letting the criterion itself be re-selected by whoever spoke last. Portable beyond the fable: a product team that changes its roadmap after every customer call, ending up with a feature no one asked for and a shipped-nothing quarter; a writer who revises a draft to satisfy each new beta-reader's contradictory notes in sequence and ends with a manuscript that pleases none of them and reads like none of them either; a manager who reverses a policy every time the last person who complained about it happens to be the one currently in the room. Recognize the failure at the THIRD reversal, not the first — one course-correction in response to good feedback is normal; a chain of unconditional reversals with no standing criterion behind any of them is the miller's ass."
related: [lex-hbgcb, lex-quu4s, lex-6tvr6]
evokes: [the-miller-his-son-and-their-ass, trying-to-please-all-pleases-none, no-stable-criterion, ratchet-toward-the-latest-complaint, sequential-capitulation, aesop]
lineage:
  - source: primary
    text: aesop-miller-his-son-and-their-ass
    citation: "'The Miller, His Son, and Their Ass,' collected within the Vernon Jones 1912 Aesopic compilation. The fable's precise origin is debated among fable scholars — unlike most of the fables in this collection, it lacks a firm classical Greek or Latin attestation and is more commonly traced to medieval exempla and folk-tale tradition, popularized in the modern West via Jean de La Fontaine's Fables (1668, Book III.1, 'Le Meunier, son fils et l'âne'). It is nonetheless included as canonical within the Aesopic corpus by nineteenth- and twentieth-century English compilers, including Vernon Jones, and is cited here under that inclusive, widely-reprinted designation rather than claimed as 6th-century-BCE Aesopic material specifically. Trans. V. S. Vernon Jones, in Aesop's Fables: A New Translation (New York: Avenel Books / London: William Heinemann, 1912; introduction by G. K. Chesterton, illustrations by Arthur Rackham; Project Gutenberg eBook #11339, released 2004). PD (Vernon Jones translation 1912, well past copyright term). Note on file provenance: the locally-held source file is named after George Fyler Townsend's 1867 translation, but its actual content, verified against the Project Gutenberg header metadata embedded in the file, is the Vernon Jones 1912 translation — a duplicate under a mislabeled filename, not a distinct 1867 translation. Cited here by the translation actually read."
    quote: "'A Miller, accompanied by his young Son, was driving his Ass to market in hopes of finding a purchaser for him. On the road they met a troop of girls, laughing and talking, who exclaimed, \"Did you ever see such a pair of fools? To be trudging along the dusty road when they might be riding!\" [...] so he made his Son mount the Ass, and himself walked at the side. Presently they met some of his old cronies, who greeted them and said, \"You'll spoil that Son of yours, letting him ride while you toil along on foot! Make him walk, young lazybones! It'll do him all the good in the world.\" The Miller followed their advice [...] They had not gone far when they overtook a party of women and children, and the Miller heard them say, \"What a selfish old man! He himself rides in comfort, but lets his poor little boy follow as best he can on his own legs!\" So he made his Son get up behind him. Further along the road they met some travellers [...] \"Good heavens!\" said they, \"with a load like that the poor beast will be so exhausted by the time he gets there that no one will look at him. Why, you'd do better to carry him!\" \"Anything to please you,\" said the old man, \"we can but try.\" So they got off, tied the Ass's legs together with a rope and slung him on a pole, and at last reached the town, carrying him between them. [...] They had then got to a bridge over the river, where the Ass, frightened by the noise and his unusual situation, kicked and struggled till he broke the ropes that bound him, and fell into the water and was drowned. Whereupon the unfortunate Miller, vexed and ashamed, made the best of his way home again, convinced that in trying to please all he had pleased none, and had lost his Ass into the bargain.'"
canonical-instances:
  - "The direct pattern-application template: a decision-maker holds no criterion of their own and reverses their policy each time a new critic objects; before the third reversal, fix the standing criterion the situation is meant to optimize for, and filter each new piece of advice through it rather than letting the criterion itself be re-selected by whoever spoke last."
  - "The textual anchor case itself: mocked at the road for walking, the son rides; mocked for the son riding while the father walks, they swap; mocked for both riding, they carry the ass on a pole; mocked and panicked, the ass breaks free at a bridge and drowns — every reversal individually reasonable, the whole sequence self-destructive."
  - "A product team that changes its roadmap after every customer call in sequence, capitulating to each caller's contradictory request in turn, and ends a quarter having shipped a feature no one specifically asked for and nothing else."
  - "A writer who revises a draft to satisfy each new beta-reader's notes one after another, with no standing sense of what the book is FOR to filter the notes against, and ends with a manuscript that pleases none of the readers and reads like none of them either."
  - "A manager who reverses a stated policy every time the most recent person to complain about it is the one currently in the room, so the policy in effect at any moment is simply whoever objected last, not whatever the policy was actually meant to achieve."
critical-questions:
  - "is this the same claim as lex-6tvr6 pre-commitment-binds-future-action-against-predictable-erosion (Schelling)? No, and the two are directly complementary — lex-6tvr6 is about a DELIBERATE binding act, a pre-commitment device that removes a future self's ability to defect from a chosen path under predictable pressure. This atom is about the failure mode that runs to completion in the total ABSENCE of any such binding: the miller never had a criterion to bind to in the first place. This fable is the illustrative case FOR lex-6tvr6's prescription, not a restatement of it."
  - "is this the same claim as lex-hbgcb social-proof-as-action-signal? No — social proof is about inferring correct action from what OTHERS ARE DOING, peer behavior read as evidence. This atom is about capitulating to what others are SAYING, direct unsolicited criticism, and specifically about the SEQUENTIAL, contradiction-blind character of that capitulation: each new opinion fully overwrites, rather than averages with, the last. A single episode of social proof is not yet this atom's failure; this atom requires the reversal-chain structure across successive, mutually contradictory critics."
  - "is this the same claim as lex-quu4s need-for-closure? No — need for closure is about accepting a wrong answer over enduring ambiguity, an intrapsychic bias that operates even with no external critics present. This atom is inherently interpersonal and reactive: it requires a sequence of distinct external critics each supplying a new, contradictory demand, and the failure is specifically the absence of a stable filter for weighing them against each other, not a preference for closure per se — the miller shows no urgency toward closure at all; he is willing to reverse again and again."
  - "does this atom argue against taking feedback or revising a plan? No — several of the individual criticisms in the fable were independently reasonable, and the pattern is not 'never listen.' The diagnostic is the ABSENCE of a standing criterion to check new advice against, which turns feedback-incorporation into feedback-obedience. A person with a stated criterion (for instance, 'I optimize for the animal's welfare over strangers' opinions') could hear the same four critiques in the fable and correctly reject three of them without ever reversing course."
  - "where exactly does this differ from ordinary open-mindedness or humility about being wrong? By the THIRD reversal with no standing criterion behind any of them. One course-correction in response to a genuinely good piece of feedback is ordinary, healthy revision. What marks this atom is the chain: each subsequent critic's complaint is treated as if it were the first and only data point, because there is no accumulated criterion to weigh it against the complaint that came before."
severity-tier: warning
status: active
