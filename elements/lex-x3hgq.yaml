lineage:
  - source: primary
    text: Augustine-c400-Confessions-BookXIII
    citation: "Augustine of Hippo, *Confessions* (c. 397-400 CE), Book XIII Chapter 9 § 10. Pusey translation (Project Gutenberg #3296). The canonical articulation of the love-as-weight structural primitive: each creature is borne toward its place of rest by its own weight; the soul's weight is its love; therefore where the love is, there the soul goes. The atom is anchored further in *City of God* Book XV Chapter 22 (`Therefore, as it seems to me, a brief and true definition of virtue is rightly ordered love`) — the *ordo amoris* statement that virtue = rightly-ordered loves and vice = disordered loves. The framework has been productively extended across Aquinas *Summa Theologiae* I-II.26-28 (passions + love as primary), Pascal *Pensées* (the wretchedness of disordered love + restlessness without God), Max Scheler 1916 *Ordo Amoris* (explicit modern recovery of the Augustinian structural primitive), Hannah Arendt 1929 *Love and Saint Augustine* (her doctoral dissertation explicating Augustinian love structurally), C.S. Lewis 1960 *The Four Loves* (taxonomy of loves operating on Augustinian structure), James K.A. Smith 2009 *Desiring the Kingdom* (love-shaping practices), Charles Taylor 1989 *Sources of the Self* (moral sources as what is loved-toward), and Alasdair MacIntyre 1981 *After Virtue* (virtue formed by practices that reshape affective orientations). The transferable structural primitive: an agent's actual trajectory is determined by the ordering of its loves, not by its stated intentions or its plans; reshaping trajectory requires reordering the loves themselves."
    quote: "[Augustine *Confessions* XIII.9.10 (Pusey tr.), the key pondus passage:] 'The body by its own weight strives towards its own place. Weight makes not downward only, but to his own place. Fire tends upward, a stone downward. They are urged by their own weight, they seek their own places. Oil poured below water, is raised above the water; water poured upon oil, sinks below the oil. They are urged by their own weights to seek their own places. When out of their order, they are restless; restored to order, they are at rest. My weight, is my love; thereby am I borne, whithersoever I am borne.' [Practitioner-extraction for transferable lex-x3hgq: the Augustinian primitive is OPERATIONAL not poetic. Each creature has a place of rest set by its constitution; what carries it there is its weight; for an agent, that weight IS its love. Disordered loves yield restlessness (the agent oscillates, drifts, cannot stay); rightly-ordered loves yield rest (the agent's stated and actual orbits align). The corollary from *City of God* XV.22 — virtue is rightly-ordered love — yields the transferable claim that character formation, contemplative practice, addiction recovery, vocation discernment, and value alignment all operate on the level of the loves, not the level of the plans + the will alone. Substrate generalization: an agent's chronic actual trajectory is set by the ordering of its loves; the gap between stated intention and actual orbit indicates a love-ordering different from the articulated one; reshaping trajectory requires reordering the loves themselves.]"
  - source: cross-attestation
    text: cross-tradition-affective-structure-determines-trajectory
    citation: "Cross-tradition attestation that the structural primitive — agent trajectory is set by the ordering of its loves / affective attachments / desires, not by stated intentions or plans alone — recurs across Christian theological tradition, contemplative + ascetic traditions across religions, virtue ethics, behavioral economics, motivational therapy, value-formation pedagogy, and value-alignment work. (a) Christian-theological lineage: Aquinas *Summa Theologiae* I-II.26-28 builds the systematic treatment of passions + love as primary; Bonaventure *Itinerarium Mentis in Deum*; Bernard of Clairvaux *On Loving God*; John of the Cross *Dark Night* + *Ascent of Mount Carmel* on purgation of disordered desires; Teresa of Avila *Interior Castle* on reordering of affections; modern: Smith 2009 *Desiring the Kingdom*, Lewis 1960 *Four Loves*, Marion 2002 *The Erotic Phenomenon*. (b) Modern philosophical recovery: Scheler 1916 *Ordo Amoris*; Arendt 1929 *Love and Saint Augustine*; Charles Taylor 1989 *Sources of the Self* (moral sources as what we love-toward); MacIntyre 1981 *After Virtue* (virtue as formed by practices). (c) Cross-religious: Buddhism — tanha + the analysis of attachment as the engine of suffering (Four Noble Truths); the Eightfold Path as reordering of attachments rather than mere behavior change. Sufi tradition — the *nafs* (lower self) shaped by attachment + the practice of *tazkiyah* (purification) reorders affective orientations. Hindu Bhagavad Gita — discipline of *bhakti* (devotion) as reordering of loves toward the divine (composes with lex-7xz6k). Stoicism — Epictetus + Marcus Aurelius (cf lex-m8j35) on training assent + desire structure. (d) Behavioral neuroscience + addiction: Volkow + Koob + others on neural circuits of incentive salience + craving — addiction is the brain's affective + motivational system getting tuned to a substance, not a knowledge problem. Marlatt 1985 *Relapse Prevention*, Miller + Rollnick 1991 *Motivational Interviewing* explicitly work at the level of the affective structure rather than the level of plans + willpower. (e) Behavioral economics + value-alignment: revealed-preference economics encodes the thin version (behavior reveals preferences); the deeper claim — that preferences themselves can be reordered through practices, experiences, relationships — is documented in habit-formation literature (Wood + Neal 2007, Duhigg 2012). (f) Pedagogical + character-formation traditions: Confucian *li* (ritual propriety) as the practice that reshapes affective orientations toward the social order; the classical Western paideia tradition explicitly on character formation as love-formation, not knowledge-transfer alone. (g) AI value alignment: the essential question in alignment work is not what the model says it values but what its weights actually orient it toward — the structural analog of the Augustinian gap between stated and revealed love-ordering. Composes with lex-rfcb7 (credibility from foreclosed options, not stated intent) + lex-cqvnu (name-to-referent correspondence)."
    quote: "Across Christian theological tradition (Aquinas Summa I-II.26-28, Bernard On Loving God, John of the Cross purgation, Smith Desiring the Kingdom, Scheler Ordo Amoris, Arendt Love and Saint Augustine, Taylor Sources of the Self, MacIntyre After Virtue, Lewis Four Loves), cross-religious contemplative + ascetic traditions (Buddhist tanha + Eightfold Path, Sufi tazkiyah, Hindu bhakti, Stoic training of assent + desire), behavioral neuroscience + addiction (Volkow + Koob incentive salience, Marlatt relapse prevention, Miller-Rollnick motivational interviewing), behavioral economics (revealed-preference + habit-formation literature: Wood-Neal 2007, Duhigg 2012), pedagogical + character-formation traditions (Confucian li, classical paideia), and AI value-alignment work (revealed alignment vs stated objectives), the same structural primitive recurs — an agent's actual trajectory is determined by the ordering of its loves / attachments / desires, not by its stated intentions or its plans alone. The transferable diagnostic: name the actual orbit separately from the stated intention; if reshaping is sought, work at the level of the affective structure (practices, relationships, commitments, repeated experiences that reshape what is loved), not the level of plans + willpower alone."
canonical-instances:
  - "Augustine's own conversion (Confessions VIII-IX): not a moment of new knowledge but a moment when the ordering of his loves shifted — what he had loved more (worldly recognition, sexual habit) became loved less, and what he had loved less (the contemplative life, the God of the Catholic faith) became loved more. The conversion was structurally a reordering of loves, not an addition of beliefs."
  - "Addiction recovery (Marlatt 1985, Miller-Rollnick 1991): the recovering alcoholic who can articulate every reason to quit but cannot stay sober is not in a knowledge-action gap. The loves are organized around the substance. Effective treatment (motivational interviewing, twelve-step community, cognitive-behavioral therapy combined with relationship + meaning reconstruction) works at the level of the affective structure — what the person actually loves, who they actually trust, what gives them rest."
  - "Liturgical formation (Smith 2009 *Desiring the Kingdom*): the church's liturgy is not primarily a transmission of doctrine but a love-shaping practice — repeated bodily participation in rhythms, words, music, gestures, communal eating reshapes what the participant loves over time. The same structural mechanism explains why cult-induction works through ritual, why brand affect is shaped through repeated experience, why corporate culture is formed by all-hands rhythms not by mission statements."
  - "Vocation drift in engineering: the engineer who articulates `I want to make tools that help people` but whose actual orbit is set by `I want to be recognized as technically sophisticated` will drift toward projects that demonstrate sophistication, not projects that help. The mismatch between stated and revealed love-ordering is the diagnostic; reshaping the trajectory requires practices + relationships that reorder the loves, not better goal-setting."
  - "Institutional value drift: a hospital states `patient care first` but its incentive structure orients members toward billable-procedure throughput. The institution's actual orbit is set by what is incentivized, not what is stated. Reform that targets only the mission statement fails; reform that reshapes what staff actually love (patient outcomes via clear feedback, peer recognition for difficult-case work, structural changes to compensation) can shift the orbit."
  - "Parenting + moral formation: the child learns to love what the parent demonstrates loving — the books read for pleasure, the people welcomed warmly, the way time is spent when no one is watching — regardless of what the parent says they value. Moral formation is love-formation, not value-statement-transmission. Augustinian + Confucian + Aristotelian virtue-ethics traditions converge on this."
  - "AI value alignment + revealed objectives: a model whose RLHF training has shaped its weights to orient toward a specific reward landscape will be carried toward that landscape regardless of stated objectives. The diagnostic is what the model is actually carried toward, not what it articulates as its values. Composes with lex-rfcb7 (credibility from foreclosed options) + lex-5tpy8 (multi-objective conflict)."
  - "Contemplative + ascetic practice across traditions: Christian monastic *lectio divina* + *examen*, Buddhist meditation traditions, Sufi *dhikr* + *muraqaba*, Hindu *bhakti* practice, Stoic *prosoche* (attention) + journaling all converge on the structural insight that the loves can be reordered through sustained practice, and that surface-level behavior change without affective reordering is unstable."
  - "Habit-formation literature (Wood + Neal 2007, Duhigg 2012): the cue-routine-reward cycle reshapes affective orientations. Repeated execution of a routine bound to a cue + reward changes what feels effortful + what feels effortless — i.e., changes the love-ordering at the level of automatic behavior. Habit-change interventions that succeed work at the level of the cue + reward structure, not at the level of willpower."
  - "operationally distinct from lex-5tpy8 single-self-houses-multiple-competing-volitional-sub-agents (Augustine, the other primitive): lex-5tpy8 names WHO is doing the willing (multiple sub-agents); lex-x3hgq names WHAT determines the willing direction (the configuration of loves). They compose: the multi-self structure becomes orderable when the loves are reordered."
  - "operationally distinct from lex-v7ceq akrasia-knowing-the-good-yet-doing-otherwise (Aristotle): akrasia treats the failure as knowledge-action gap in a unified deliberator. lex-x3hgq names the deeper claim that knowledge alone cannot move action — the loves must move first; if the loves are disordered, even full knowledge of the good will not produce action toward the good."
  - "operationally distinct from lex-cgbrt outward-distraction-is-sought-to-avoid-contemplation-of-own-condition (Pascal): divertissement names the AVOIDANCE that prevents the reordering of loves; lex-x3hgq names the structural primitive that the loves are orderable in the first place. Pascal presupposes Augustinian ordo-amoris."
  - "operationally distinct from lex-7xz6k act-for-action-quality-not-for-outcome-attachment (Bhagavad Gita): the Gita's response to attachment is to detach from outcome; the Augustinian response is to REORDER attachments rather than eliminate them. Different traditions yield different responses to the same diagnostic that attachment-structure shapes trajectory."
  - "operationally distinct from lex-afzzp each-thing-strives-to-persist-in-its-own-being (Spinoza conatus): conatus is a metaphysical primitive about being's self-maintenance; lex-x3hgq names the operational claim about how an agent's SPECIFIC loves shape its SPECIFIC trajectory toward its place of rest."
  - "operationally distinct from lex-rfcb7 credibility-comes-from-visibly-foreclosed-options-not-from-stated-intent (Schelling): lex-rfcb7 is about signaling commitment to other agents through visible foreclosure of options; lex-x3hgq is about an agent's own internal trajectory being set by what it loves. They compose: visibly-foreclosed options can themselves reshape what one loves over time (commitment as practice)."
critical-questions:
  - "Does the atom commit to specific theological content about WHAT should be loved? No. The atom is a STRUCTURAL claim: whatever the agent loves, that ordering determines trajectory. Augustine's first-order claim is that God should be loved most; the transferable atom encodes only the structural primitive that the ordering of loves determines the orbit. A Buddhist working with the same structural primitive will say the attachments themselves should be released; a secular practitioner can work with the primitive to align stated and revealed values without theological commitment."
  - "Could the atom be misused to evade responsibility (`I cannot help what I love`)? Yes, and this is a known misuse pattern. The discipline against this: Augustine + the Christian + the contemplative traditions all insist that the loves are REORDERABLE through practice — not by willpower alone (the atom's whole point) but by sustained engagement with practices, relationships, communities, and disciplines that reshape what is loved. Responsibility shifts from `you should be able to act against your loves' to `you bear responsibility for choosing or refusing the practices that would reshape your loves.`"
  - "How does the atom apply to AI systems specifically? An AI whose training has shaped its weights to orient toward specific patterns will be carried toward those patterns regardless of stated objectives. The structural analog of `reorder the loves` is `retrain or fine-tune so the model's reward landscape orients toward what we actually want it carried toward.` The foundational question in alignment is not what the system articulates but what it is actually carried toward — composes with lex-rfcb7 (revealed via foreclosed options) + lex-cqvnu (name-to-referent correspondence). The atom yields the alignment question: are stated objectives + revealed objectives aligned, and if not, what training reshapes the affective structure rather than the surface behavior?"
  - "How does the atom interact with revealed-preference economics? Revealed-preference economics encodes a THIN version of the structural primitive: behavior reveals preferences. The atom is the DEEPER claim — preferences themselves can be reordered through practices, relationships, formation. The thin version treats preferences as fixed parameters; the atom treats them as themselves shape-able by sustained engagement with formative practices. The deeper claim is what underwrites virtue ethics, character formation, addiction therapy, and value-alignment work."
  - "How is the atom distinguished from simple `act on your values`? The atom claims that the gap between stated values + actual behavior is not a willpower-gap but a love-ordering gap; closing the gap requires reordering of loves, not better willpower. Simple `act on your values` advice presupposes the loves are already ordered to match the stated values and that only execution is at issue. The atom names the deeper case where the loves themselves are differently ordered from what the agent articulates — and reshaping requires affective + practical work, not exhortation."
