id: lex-cs57e
name: wrongdoings-visible-residue-strands-you-from-help
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you've done something you shouldn't have and the physical or visible traces of it are still on you, don't assume you can call on your usual community for help while still covered in the evidence -- those traces can make you unrecognizable, frightening, or repellent to the very people who would otherwise help you, precisely when you need them most. In Eastman's telling, a Raccoon steals honey from a bee-tree, gets stung repeatedly, and in his mad scramble to escape rolls in dead leaves that stick permanently to his honey-covered fur. Panicked and in pain, he runs to find help from his own kind -- but every creature he approaches (a second Raccoon, a Fox, a young Bear) takes one look at the unrecognizable, leaf-plastered shape and flees in terror, having no way to know it's a fellow Raccoon in distress rather than some monster. He gets no help from anyone; the story is explicit that 'he did now what he ought to have done at the very first -- he jumped into the lake and washed off most of the leaves.' The obvious, simple remedy was available from the very start of the ordeal -- it just wasn't taken until he'd exhausted himself chasing help that his own disguised-by-consequence appearance made impossible to receive. Diagnostic move: when you're covered in the visible aftermath of your own bad decision -- literally or figuratively -- and in genuine distress, check first whether that aftermath is what's actually making you unrecognizable or off-putting to people who'd otherwise help, and address the obvious, direct fix for that visible mess before spending energy seeking help that the mess itself is preventing you from receiving."
