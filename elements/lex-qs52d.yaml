id: lex-qs52d
name: a-classification-can-be-valid-and-still-explanatorily-sterile
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a classification scheme keeps failing to produce insight, check whether the actual defect is validity or fruitfulness — these are different failure modes and only one of them is fixed by more rigor. Merton's own first attempt at classifying Rovere's influentials (currently-influential, potentially-influential, waning, dormant, plus rank-and-file and isolates among non-influentials) was not wrong: 'This classification proved to be logically impeccable, empirically applicable, and virtually sterile. To be sure, our data could readily be arranged in these categories. But this resulted in few clear-cut uniformities of communications behavior or of other patterns of behavior. In short, the distinctions were valid but relatively fruitless for our purposes.' He notes the ironic cover this gives a bad classification: 'since, as L. J. Henderson once remarked, \"almost any classification is better than none,\" this did lead to some scattered clues' — meaning a sterile-but-valid scheme can look productive enough to survive scrutiny simply because any sorting beats no sorting at all. The classification that actually worked (local vs. cosmopolitan influentials) wasn't a corrected version of the first one; it came from noticing an unrelated pattern in the same interview data and cutting the population along a completely different axis. The diagnostic move: when a classification isn't generating uniformities, don't audit it for logical errors or definitional sloppiness — check whether it's carving the population along an axis that happens to be irrelevant to the outcome you're trying to explain, and be willing to replace the axis rather than refine the categories."
