id: lex-652hb
name: testing-against-one-metric-hides-a-components-second-job
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When deciding whether an added component (an ingredient, a step, a rule, a line of code) is actually necessary, don't judge it by whether removing it moves the one outcome metric you're already tracking — it may be carrying real weight on a completely different, unmeasured property. America's Test Kitchen ran exactly this test on baking soda in a biscuit recipe that already had double-acting baking powder: 'the biscuits made without baking soda rose just as high as those baked with both leaveners. However, the similarities ended there. The two batches made without baking soda were anemic in color, with smooth tops, while the dual-leavened biscuits were well browned and covered in crispy crags. And the differences weren't merely skin-deep — the biscuits with two leaveners tasted far richer and nuttier.' The book's own explanation of why: 'the baking soda (an alkali) is crucial for two reasons. First, it immediately reacts with the buttermilk (an acid) to produce tiny carbon dioxide bubbles that lighten the batter. Second, it neutralizes the batter's acidity to create a more alkaline environment that promotes the Maillard reaction and the creation of hundreds of new flavor compounds.' On the metric everyone assumes baking soda is for — rise — it changed nothing, because the baking powder already supplied that. Its real, non-redundant contribution was on an axis nobody was watching in that comparison. A component that looks safely removable because the tracked number didn't move may simply have never been doing its real job on that number at all."
