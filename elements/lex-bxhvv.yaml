id: lex-bxhvv
name: shadow-boxing-an-imagined-rival-still-costs-real-effort
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When another party seems to be matching your posture with total silence, check whether there is actually another party there at all before you invest real effort in outlasting them. In Radin's Winnebago Trickster cycle, Trickster sees a figure across a lake pointing at him and calls out, 'Say, my younger brother, what are you pointing at?' but gets no answer. Rather than walk over and look, he decides to match the behavior exactly: 'I, too, shall do that. I, too, can stand pointing just as long as he does. I, too, can put a black shirt on.' He holds the pose until his arm aches, tries to negotiate a truce -- 'Younger brother, let us stop this. My arm is very tired' -- and is met with the same silence. Only after giving up in frustration, calling the other 'heartless,' does he walk over and discover the truth: 'he saw a tree-stump from which a branch was protruding. This is what he had taken for a man pointing at him.' The entire standoff, the tired arm, the failed negotiation, cost real effort against an opponent that was never capable of opposing anything. Diagnostic move: before matching a perceived rival's posture for an extended standoff, check what would happen if you simply walked over and looked -- silence from the other side is data about the situation, not confirmation that a contest is underway."
