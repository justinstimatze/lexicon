lineage:
  - source: primary
    text: merton-1957-technical-homonyms-seldom-misunderstood-within-field
    citation: "Robert K. Merton, George G. Reader, and Patricia L. Kendall, eds., Appendix A, \"Socialization: A Terminological Note,\" in The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.293. The extraction interposes a footnote (on pejoration in the word 'silly') directly inside the word 'consequently'; the quote below discloses that split with an ellipsis at the exact interposition point."
    quote: "'technical homonyms seldom result in misunderstandings since the readers of writings containing these terms are ordinarily themselves at work in the same technical field, and con ... sequently share a common universe of discourse. Readers in the same field at once supply the appropriate, rather than the extraneous, meanings of the homonym, since they are socially insulated from the like-appearing word of quite different meaning. But when, as in the present instance, a technical term, such as socialization, comes to the attention of those in other fields, quite the contrary is apt to occur. Readers will naturally enough supply the meaning with which they are most familiar, and some may actively resist the thought that it may have an equally well-established though different meaning in the technical field previously unknown to them.'"
  - source: primary
    text: merton-1957-culture-bacteriologist-anthropologist
    citation: "Merton, Reader, and Kendall, eds., Appendix A, \"Socialization: A Terminological Note\" (1957), p.291."
    quote: "'The bacteriologist, come of age since the days of Koch and Pasteur, does not hesitate to use the term culture simply because the anthropologist, from the days of Tylor and Kidd, has utilized culture in quite another sense... The parallelism, which is not apparently the result of borrowing, indeed runs to specialized formations of the basic homonym: both bacteriologist and anthropologist, for example, speak, in their several ways, of subcultures.'"
  - source: primary
    text: merton-1957-section-mass-force-remission
    citation: "Merton, Reader, and Kendall, eds., Appendix A, \"Socialization: A Terminological Note\" (1957), p.292."
    quote: "'A section is one thing for the surgeon and anatomist, another for the botanist, and still a third for the mathematician; just as the geologist, printer, military man, college teaching assistant, real estate broker, and railwayman have each their own technical meaning for this versatile word. Remission may denote a decrease in the violence of a disease in pathology and relief of quite another kind in theology. The word mass takes on distinct and severally useful meanings in physics, politics, and pharmacy, in mining, fine arts, military science, and Catholic ritual. Force carries lightly the burden of its varied significance as \"unlawful violence\" in the sphere of law and as a collective term in the vernacular for the policemen engaged in maintaining law and order, just as it stands for quite different matters in physics, ethics, and literary accounts of lovemaking.'"
canonical-instances:
  - "The word 'model' means a trained statistical artifact to a data scientist, a runway performer to a fashion editor, and an idealized simplification to a physicist — none of these professionals is ever confused reading within their own field, but a memo written for all three audiences at once ('we need a better model') will be read three different ways unless the writer disambiguates."
  - "'Reduction' means a lower-calorie sauce to a chef, a simplified proof-equivalent problem to a mathematician, and explaining a phenomenon via its parts to a philosopher of science — a science journalist quoting a philosopher's 'reduction' claim to a general audience risks readers importing the cooking or math sense instead."
critical-questions:
  - "Merton frames the mechanism as symmetric and mostly harmless — does it stay harmless when one field's sense is much more publicly prominent than the other's, so that even people INSIDE the less-prominent field's discourse start unconsciously importing the dominant public sense, contaminating what should be an insulated in-group reading?"
  - "Does 'shared universe of discourse' fully explain the safety of within-field homonym use, or does it also require that the two fields' communities rarely overlap in readership — what happens to this mechanism for a term used identically by two fields whose practitioners frequently read each other's work (e.g., adjacent scientific disciplines), where the 'insulation' Merton describes may be much weaker?"
status: active
