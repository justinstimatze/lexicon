canonical-instances:
  - "Two companies negotiating a joint venture agree only on which geographic market each will handle (avoiding costly overlap), while deliberately leaving the revenue-split formula and the project timeline open for separate negotiation later, because the geographic division is the one dimension where each side's current strengths cleanly favor a specific split, while the other dimensions remain genuinely contested and premature to lock in."
  - "A labor union negotiating with management agrees to a fixed-term wage freeze (binding time) in exchange for no commitments yet on staffing levels or job classifications, because the union's leverage is currently strongest on the compensation timeline specifically -- due to an already-signed contract clause -- and locking in only that dimension avoids conceding ground on staffing questions where the leverage genuinely hasn't been established yet."
critical-questions:
  - "does proposing a narrow, single-dimension agreement risk signaling weakness or bad faith to the other party, who might reasonably interpret an unwillingness to commit on other dimensions as evidence you're planning to exploit them there later -- does the tactic depend on a level of trust or precedent that makes a partial commitment read as prudent rather than suspicious?"
  - "how does a party actually identify, in real time, which single dimension currently favors them, given that Kautilya's framework assumes fairly legible military variables (terrain, season, objective) that may be far harder to isolate cleanly in a business, legal, or interpersonal negotiation where multiple dimensions interact and shift simultaneously?"
  - "if both parties independently apply this same logic -- each proposing to bind only their own favorable dimension and leave the rest open -- does the negotiation converge on a workable partial agreement, or does it stall entirely because neither side is willing to concede any dimension at all, leaving no shared ground to formalize?"
status: active
