lineage:
  - source: primary
    text: radin-trickster-disguises-himself-fakes-a-rescue-and-burns-the-mothers-alive
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 29. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "He had changed him- self into another person and his face was blackened. ... 'Oh, my, I wish I could get hold of him for you! When they tell me such things about him, I always long to get hold of him! In what direction did he go? Do you know?' ... Then he went in the hole and after he was in a while he made quite a commotion as if he were striking something. Then they heard something like a groan inside the hill. Soon he came out all bloody. His nose was all covered with blood and bruised. He had, of course, bruised his own nose and then come out. ... He fought with great fierceness against me. But I killed him. I am sure you heard us inside. He is inside there. You ought to go and get him. He is dead so that you need not be in the least afraid of him. ... Then the women went in. After a few minutes, however, they turned back. 'He is inside, a little farther up. Don't be afraid of him.' So they went farther in and as soon as they were well in, he put some hay inside and set fire to it. Then he ran to the other side of the hill, put some hay in and set fire to it."
canonical-instances:
  - "A conman poses as a private investigator hired to find whoever has been defrauding an elderly victim's savings, fabricates evidence that he has 'caught and confronted' the culprit, and uses the victim's relief and trust to get access to their remaining accounts to 'secure them from further attack.'"
  - "An abuser convinces their partner's family that they have confronted and driven off a supposed stalker who was actually invented to cover the abuser's own surveillance and control, staging visible signs of a struggle, and uses the family's gratitude and trust to isolate the partner further under the guise of protection."
critical-questions:
  - "Would the mothers have been suspicious if the physical evidence, the blood and bruising, had been less convincing, or does the story suggest that any confirming physical detail is enough to overcome doubt when someone desperately wants the threat to be over?"
  - "Is Trickster's choice to disguise himself rather than simply lie about the culprit's fate the load-bearing part of this deception, or would the fabricated combat and staged injury have worked just as well coming from him in his own identity?"
  - "Does the mothers' grief make them specifically more vulnerable to this kind of staged rescue, wanting desperately to believe the threat is over, or would a calmer, less personally invested bystander have been just as likely to accept the same fabricated evidence?"
