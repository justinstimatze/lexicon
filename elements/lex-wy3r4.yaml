id: lex-wy3r4
name: once-it-wins-it-stops-being-right
type-in: posture
type-out: posture
_tier: atomic
agent-instruction: "When a value or doctrine wins so thoroughly it becomes default, surface that triumph itself may degrade it — the corrective tension that kept it sharp is gone; what was right may stop being right precisely because nothing now opposes it."
related: [lex-nahg9, lex-srj3h, lex-wjwuc, lex-wf4nj, lex-yvj9f]
evokes: [critique-as-counterweight, situational-correctness, dominance-aware-stance]
lineage:
  - source: practitioner
    text: mill-1859-on-liberty
    citation: "John Stuart Mill, On Liberty (1859), Ch.2 opening section. Adjacent to lex-wy3r4 but not the same shape — Mill's framing is about the illegitimacy of silencing dissent and the value of dissent in discovering truth; this seed is about critique-as-counterweight whose correctness is positional, not absolute. The shared substrate is that critique/dissent has a essential function distinct from the propositional correctness of any individual claim. Verbatim via Wikisource 2026-05-20."
    quote: "If all mankind minus one, were of one opinion, and only one person were of the contrary opinion, mankind would be no more justified in silencing that one person, than he, if he had the power, would be justified in silencing mankind."
canonical-instances:
  - "libertarian critique of state overreach: useful as ongoing pressure inside a strong-state society; stops being correct if libertarianism actually wins (the resulting society needs the OPPOSITE pressure)"
  - "any critique whose value is positional rather than absolute — the critique is correct relative to current dominant force, not as a permanent truth"
critical-questions:
  - "is the critique's correctness positional or absolute? if the critique would still be correct in the world where it had won, this atom doesn't apply — the move only fires when correctness is relational to current dominance"
  - "what would the OPPOSITE pressure look like? the test of the positional claim: when this critique wins, what's the new corrective force needed? if you can't name it, you may be holding the critique as absolute truth wearing positional clothing"
  - "is the speaker tracking the dominance-state, or assuming it stays fixed? a critique that was correct in 1970 may no longer apply by 2020 if the dominant force has shifted — failing to update is structurally identical to defending a permanent-truth position"
  - "does the critique have a successor? if you accept that this critique stops being right once it wins, what's the next critique queued up for the world that follows? Mill's framing of dissent-as-truth-discovery suggests an ongoing process — not a single critique, but a discipline of always-counter-pressuring the current dominant"
status: active
