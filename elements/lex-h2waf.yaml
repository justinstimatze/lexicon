id: lex-h2waf
name: repeated-measurement-beats-recalled-self-report-of-change
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When you need to know whether attitudes, opinions, or standards have changed over time — in a training program, a policy rollout, a therapy course, a culture-change initiative — don't rely on asking people to look back and report whether THEY think they've changed. Retrospective self-report of one's own change is vulnerable to faulty memory, motivated reconstruction, and simple unawareness of gradual drift. Instead, use a PANEL design: administer the identical instrument to the same individuals at several fixed points in time, and infer change or stability by comparing the actual answers given at each wave, not by asking respondents to characterize their own trajectory. The Bureau of Applied Social Research's design for the Cornell program administered the same questionnaire to the same fourth-year students three times across the academic year specifically so that change could be objectively ascertained from the comparison of answers, rather than from anyone's memory of whether they had changed. The transferable move: whenever you're tempted to ask 'has this gotten better/worse for you,' ask instead whether you can measure the same thing twice and compare, because the comparison is more trustworthy than the recollection."
