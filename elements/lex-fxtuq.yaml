id: lex-fxtuq
name: complex-systems-that-work-evolve-from-simple-systems-that-worked
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a complex working system is being designed from scratch, surface Gall's law — complex systems that work evolve from simple systems that worked; the simple-first version is not a placeholder, it's the only viable substrate; trying to design the complex form directly typically fails."
related: [lex-xu8k9, lex-w5qfe, lex-7xbt6, lex-5fa5d, lex-uqghr, lex-n365w]
scaffolds-from: [lex-w5qfe]
evokes: [galls-law, systemantics, the-systems-bible, john-gall-1975, start-with-a-working-simple-system, big-bang-rewrite-fails]
lineage:
  - source: primary
    text: gall-1975-systemantics-galls-law
    citation: "John Gall, *Systemantics: How Systems Work and Especially How They Fail* (originally *General Systemantics*, self-published 1975; Quadrangle/The New York Times Book Co., 1977; retitled *The Systems Bible* in later editions). The atom's structural-claim is Gall's Axiom #15 and its corollary (Axiom #16) from Appendix I, the 'Annotated Compendium of Basic Systems-Axioms, Theorems, Corollaries, Etc.': a complex working system is reached only by an evolutionary path through working simpler states, because a complex system designed from scratch carries too many untested interacting assumptions to be patched into working — the from-scratch failure is categorical, not contingent. Gall frames the corollary with a programmer-aimed translation ('Programs never run the first time') making the law's transferability explicit. The transferable distillation: working complexity is an end-state of evolution, not a starting point; the incremental-strangler-fig route is not a sequencing preference but the only viable route."
    quote: "[Gall 1975, Appendix I §15-16 (paged 91 in the 1977 Quadrangle ed.):] '15. A COMPLEX SYSTEM THAT WORKS IS INVARIABLY FOUND TO HAVE EVOLVED FROM A SIMPLE SYSTEM THAT WORKS. 16. A COMPLEX SYSTEM DESIGNED FROM SCRATCH NEVER WORKS AND CANNOT BE PATCHED UP TO MAKE IT WORK. YOU HAVE TO START OVER, BEGINNING WITH A WORKING SIMPLE SYSTEM. Translation for Computer-Programmers: PROGRAMS NEVER RUN THE FIRST TIME. COMPLEX PROGRAMS NEVER RUN. (Anything worth doing once will probably have to be done twice.)' [The structural shape: §15 names the only viable path to working complexity (evolution from a working simpler ancestor); §16 names the from-scratch failure mode as categorical (cannot be patched into working). The pairing is the substrate-load — without §16, §15 reads as preference; with §16, it reads as constraint.]"
canonical-instances:
  - "the big-bang rewrite that never ships: a team scraps a working (if ugly) system to build a clean complex replacement from scratch; the replacement accumulates untested interacting assumptions and never reaches working parity, while the old system keeps running. Gall's law predicts both the failure and the cure — incremental strangler-fig replacement that keeps a working system working at every step"
  - "the internet from the ARPANET, the Web from a single CERN document server, Unix from a small kernel: every large working technical system that endured is traceable to a small working seed that was grown, not a grand complex design delivered whole. The complex working forms are end-states of evolution, not starting points"
  - "biological and institutional evolution: organisms and durable institutions reach complexity by accreting modifications on top of already-working ancestors (each intermediate had to be viable). Gall's law is the design-world statement of the same constraint — there is no viable jump to working complexity that skips the working intermediates"
  - "operationally adjacent to lex-w5qfe iterative-refinement-of-a-provisional-target-against-feedback and lex-xu8k9 unscalable-initial-conditions-as-diagnostic-not-defect: lex-w5qfe is the loop (refine a provisional thing against feedback); lex-fxtuq is the stronger structural claim that the loop is the ONLY route to working complexity — skipping it (designing the complex end-state directly) fails categorically. lex-xu8k9 (do things that don't scale) is the entry move Gall prescribes: start with the small, simple, even unscalable working system and grow it"
  - "operationally adjacent to lex-7xbt6 Conway's law: both constrain how real systems come to exist. Conway says the structure mirrors the builders' communication; Gall says the structure must have grown from a simpler working ancestor. A from-scratch complex design tends to violate both — it assumes a coordination structure the org doesn't have AND a working complexity it never grew into"
critical-questions:
  - "does a SIMPLE version of this work yet? If not, building the complex version first is building on sand — Gall's law says it will not work and cannot be patched into working. Find or build the simplest thing that genuinely works end-to-end before adding complexity"
  - "is each increment kept working, or are you accumulating untested complexity toward a future 'it'll all work once it's done'? The safe path keeps a working system working at every step; a long dark period with nothing working is the from-scratch failure mode"
  - "are you tempted by a clean rewrite of a working-but-ugly system? The ugly system encodes years of absorbed edge-cases (cf. Chesterton's fence, lex-u5869). A from-scratch replacement re-derives all of them under deadline; prefer incremental replacement that never loses the working state"
  - "what is the minimal working seed, and what is the growth path from it to the complexity you need? If you cannot name a working seed and an incremental path, you do not yet have a viable plan — you have a from-scratch complex design"
status: active
