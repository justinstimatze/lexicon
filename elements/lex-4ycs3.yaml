id: lex-4ycs3
name: a-formal-right-unexercised-from-fear-isnt-a-realized-right
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before counting a right as secured because nobody is formally blocked from exercising it, check whether social cost is quietly doing the blocking instead. Sen: “in a deeply sexist society governed by rules about how women should dress, a woman may lack the courage to appear with her head uncovered, even though she would prefer not to conceal her hair. To note that the person was, in fact, free to undertake the necessary action... is not adequate for guaranteeing the realization of the appropriate rights in such cases. The phenomenon of 'choice inhibition' must not be assumed away... ... the right to poverty relief may be seen as being compromised, even when no actual application is refused, because of a decision of a would-be recipient not to apply for assistance despite wanting to have legitimate benefits. The failure to apply may be related to such factors as worry about social stigma... Even though the person could have got social support if he or she had chosen to apply for it, that in itself is an inadequate basis of being sure that the formal availability of a choice was a real availability.” A right that exists on paper and goes unused because using it costs something -- shame, fear, official scrutiny -- isn't a realized right, even though no one technically stopped anyone from exercising it. Diagnostic move: when a right or benefit shows low uptake, don't stop at confirming that nothing formally blocks access. Ask what it costs a person, socially or emotionally, to actually claim it -- stigma, fear of retaliation, fear of scrutiny -- because a right nobody dares use is functionally no different from one that was never granted."
