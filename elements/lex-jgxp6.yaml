id: lex-jgxp6
name: escalate-past-the-affected-party-to-a-more-distant-one-for-a-veto
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a decision-maker doesn't get the objection they're looking for from the people actually, directly affected by a decision, watch for escalation to a wider, more distant, less-informed constituency -- someone with no real stake can supply an objection more cheaply than someone who would actually have to live with the outcome. Frederick Douglass's daughter was kept isolated from her classmates at a New Bedford seminary. When Douglass pushed back, the school's owner agreed to ask the people who would actually have to share a room with the girl -- her schoolmates -- and got a clean answer: 'to the credit of the young ladies, not one made objection.' That should have settled it. Instead: 'Not satisfied with this verdict of the natural and uncorrupted sense of justice and humanity of these young ladies, Miss Tracy insisted that the parents must be consulted, and if one of them objected she should not admit my child.' The parents were not present, would not share a room with anyone, and had far less at stake and far less information than their own daughters -- which is exactly why that wider pool was more likely to produce the one objector being sought. One parent, with no direct connection to the situation, obliged."
