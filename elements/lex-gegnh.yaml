  - source: primary
    text: rogoff-1957-overt-act-definite-commitment
    citation: "Natalie Rogoff, \"The Decision to Study Medicine\" (1957), pp.114-115 (corrected from an initial mis-citation of pp.112-113; see the offset note on the entry above). The source interposes a footnote and Table 2 between 'an' and 'undergraduate' at a physical page break; the quote below reconstructs the sentence in its actual reading order, skipping the interposed footnote and table. 'premedicai' is the source PDF's own text layer, reproduced verbatim rather than corrected to 'premedical'."
    quote: "'The career decision, it would appear, is most frequently experienced as final or definite when it can take the form of an overt act—typically, enrolling for a premedicai course in an ... undergraduate college. Once it is possible, through his college status, for the future doctor to identify himself as a premedicai student, his hitherto private and perhaps not fully shaped intention tends to become a definite commitment.'"
canonical-instances:
  - "A survey asks long-married couples when they 'knew' they wanted to marry their partner, and answers cluster around the proposal or engagement rather than spreading across the actual courtship — not because certainty arrived precisely then, but because the proposal is the first point the private feeling could become a dated, sayable, public commitment."
  - "A founder's official 'start date' for a company is set to the day of incorporation, even though the underlying conviction that the idea was worth pursuing may have formed months or years earlier with no comparable date to point to — incorporation is simply the first act available to convert belief into a filed, timestamped fact."
critical-questions:
  - "Is there a way to empirically distinguish 'the resolve genuinely formed at the checkpoint' from 'the resolve formed earlier but only became expressible at the checkpoint' when the only data available is the self-reported date itself — or does testing this always require independent evidence from before the checkpoint (e.g., behavior, correspondence, third-party observation)?"
  - "Rogoff treats enrolling in a premedical course as the relevant overt act for this population specifically because medical school has a rigid academic prerequisite sequence — does the mechanism weaken or disappear for occupations with no comparably early, formal, and narrow point of institutional entry, where the 'first available overt act' might itself be diffuse or repeatable rather than a single dated milestone?"
status: active
