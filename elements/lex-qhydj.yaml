id: lex-qhydj
name: elites-continuously-turn-over-cycling-between-force-and-cunning
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When examining elite turnover, track the cycle between force-elites (lions) and cunning-elites (foxes). Elites continuously circulate; the question isn't whether the elite will turn over but which type is rising and what conditions favored them."
related: [lex-s2pjj, lex-dqa9j, lex-ky7un, lex-eakec, lex-6wha5, lex-eqy5r, lex-7mr6w, lex-5rqmv, lex-7q3ph, lex-33p2a, lex-zrhqq, lex-c34na, lex-ppm3j, lex-rnftn, lex-653ng, lex-fe26z, lex-3ep98, lex-z26m9, lex-5fa5d, lex-3qnt2, lex-uqghr, lex-cpq3s, lex-uxqdz, lex-m9arm, lex-ybjru, lex-u3e5m, lex-v64bg, lex-bkaum, lex-46n25, lex-ggpqt]
