id: lex-g6jrq
name: anchoring-one-point-converts-undirected-force-into-controlled-rotation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A boat approaching a wall under raw engine thrust alone slides and skids unpredictably -- wind, propeller effects, and hull drift all compete, and the skipper is fighting an unconstrained problem with too many degrees of freedom. Mellor's spring-line technique removes one of those degrees of freedom on purpose: run a single line (a 'forespring') from a point on the boat to a fixed point on the dock before applying any thrust. 'The essence of this is to hold the bow firmly with the forespring... so that it cannot move ahead. Force exerted on the shoreward quarter of the boat will then cause the stern to swing round away from the wall.' Pin that one point and the hull loses its freedom to slide forward as a whole, which redirects the identical push into a rotation around the fixed point instead of the sloppy, hard-to-predict drift it produced when nothing constrained it. Mellor goes further: WHERE the fixed point sits relative to the boat's own pivot determines how much the boat actually turns. 'The pivot point must be right for'ard so that the whole length of the boat can swing round it. If it is brought aft, turning effect will cause the bow to move in as the stern goes out.' Move the anchor point and the ratio of rotation to sideways creep changes with it; place it wrong and the same thrust that would have produced a clean turn just drives the hull flat into the wall instead. The transferable move: when a process has too many free degrees of motion to steer directly and effort keeps dissipating sideways or off-target, look for a single point you can pin against something genuinely fixed, secured before force is applied rather than corrected after the fact. The pin doesn't add force. It gives the existing force one direction it's still free to go, and exactly where that pin sits becomes the dial for how much of the push turns into rotation versus how much of it stays a shove."
