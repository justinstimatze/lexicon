lineage:
  - source: primary
    text: merton-1957-central-hypothesis-dissociation
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. IV 'Social Structure and Anomie,' p.134."
    quote: "'It is, indeed, my central hypothesis that aberrant behavior may be regarded sociologically as a symptom of dissociation between culturally prescribed aspirations and socially structured avenues for realizing these aspirations.'"
  - source: primary
    text: merton-1957-goals-universalized-means-rationed
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, pp.146-147. The elided middle sentence ('Otherwise said, our egalitarian ideology denies by implication the existence of non-competing individuals and groups...') is skipped as non-essential to the transferable claim; every retained word is verbatim."
    quote: "'It is only when a system of cultural values extols, virtually above all else, certain common success-goals for the population at large while the social structure rigorously restricts or completely closes access to approved modes of reaching these goals for a considerable part of the same population, that deviant behavior ensues on a large scale. ... Goals are held to transcend class lines, not to be bounded by them, yet the actual social organization is such that there exist class differentials in accessibility of the goals. In this setting, a cardinal American virtue, \"ambition,\" promotes a cardinal American vice, \"deviant behavior.\"'"
canonical-instances:
  - "A company culture that celebrates 'hustle' and promises advancement to anyone who works hard enough, while promotion slots and mentorship access are in practice concentrated among employees who already have a sponsor, manufactures exactly Merton's gap: the goal (advancement) is held out as universal, the institutionalized means (sponsorship, visibility) are rationed — and metric-gaming, credit-stealing, and self-promotion at others' expense rise in the population denied the sanctioned route."
  - "Standardized-test-driven school systems that tell every student college admission is open to merit while concentrating test-prep resources, advanced coursework, and counselor attention in wealthier districts produce the same structural pressure toward the illegitimate route (cheating, credential fraud) specifically among students who have internalized the goal but not the access."
critical-questions:
  - "How would you distinguish this from simple poverty-causes-crime? Merton's own point (via the poverty/crime correlation across countries) is that poverty alone is not sufficient — a caste society can restrict opportunity far more severely than 1950s America and still generate less deviance, if it doesn't simultaneously universalize the goal across the group whose access is restricted. The diagnostic is the COMBINATION: a goal preached as achievable-by-all plus means rationed for some, not restricted access by itself."
  - "Does naming the structural gap excuse individual rule-breaking? Merton's move is explanatory, not exculpatory — the theorem locates a population-level pressure that raises the RATE of deviance in the affected stratum; it doesn't claim every individual instance is forced, only that the aggregate frequency tracks the size of the goal/means gap."
