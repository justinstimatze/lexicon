id: lex-3gdpj
name: systematic-coded-sample-replaces-illustrative-anecdote-for-a-base-rate
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "A long list of vivid, individually-compelling examples can establish THAT a phenomenon occurs, but it can never establish HOW MUCH of the wider population it covers -- the examples were very likely selected because they illustrate the point, which is a different act from sampling to measure its prevalence. To move from illustration to a defensible quantitative estimate, define a bounded population of instances in advance (not the instances you already know support your case), code each one into a small number of mutually-exclusive categories using criteria fixed before you look at the results, and report the resulting proportions as a separate, more defensible layer of evidence on top of -- not instead of -- the illustrations. Merton's own move, after pages of individually-compelling seventeenth-century vignettes about scientists chasing economically useful problems: 'the minutes of the Royal Society as transcribed in Birch's History of the Royal Society provide one basis for such a study. A feasible... procedure consists of a classification and tabulation of the researches discussed at these meetings.' He selects a bounded, defended sample -- 'meetings during the four years 1661, 1662, 1686 and 1687... there is no reason to suppose that these did not witness meetings typical of the general period' -- rather than continuing to cite whichever meetings happen to contain his favorite anecdotes, then reports the resulting base rate: research classifiable as 'pure science' came in at 'less than half (41.3%)' of the total, and 'about seventy per cent of this research had no explicit practical affiliations' once indirectly-related items were added. The anecdotes established that the mechanism exists; only the coded sample tells you it covers most, some, or nearly all of the population. Diagnostic move: when a causal claim rests entirely on a string of examples, ask what bounded population those examples were drawn from and whether anyone has coded ALL of it, not just the striking parts -- if not, the claim's existence is established but its extent is not."
related: [lex-cpjma]
evokes: [merton-1957, science-and-economy-of-17th-century-england, birch-history-of-the-royal-society-minutes, four-representative-years, forty-one-point-three-percent-pure-science, the-plural-of-anecdote-is-not-data]
lineage:
  - source: primary
    text: merton-1957-classification-and-tabulation-of-royal-society-minutes
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIX 'Science and Economy of 17th-Century England,' p.625. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'The minutes of the Royal Society as transcribed in Birch's History of the Royal Society provide one basis for such a study. A feasible, though in several obvious respects inadequate, procedure consists of a classification and tabulation of the researches discussed at these meetings, together with an examination of the context in which the various problems came to light.'"
  - source: primary
    text: merton-1957-four-representative-years-sampled
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.625."
    quote: "'Meetings during the four years 1661, 1662, 1686 and 1687 will be considered. There is no reason to suppose that these did not witness meetings typical of the general period.'"
  - source: primary
    text: merton-1957-resulting-percentages-pure-science-vs-need
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.626."
    quote: "'From this tabulation it appears that less than half (41.3%) of the investigations conducted during the four years in question are classifiable as \"pure science.\" If we add to this the items which were but indirectly related to practical needs, then about seventy per cent of this research had no explicit practical affiliations.'"
canonical-instances:
  - "A think-tank report on 'AI is transforming hiring' opens with five vivid company case studies of AI-driven hiring tools. Whether that transformation covers 2% or 80% of hiring decisions industry-wide is a completely separate, unanswered question -- resolvable only by defining a bounded sample (a fixed list of companies, a fixed time window) and coding all of it, not by adding more vivid case studies."
  - "A journalist argues 'remote work is failing' by citing several high-profile return-to-office mandates; a labor economist instead pulls a representative panel of firms across a fixed period and codes each firm's actual policy change, reporting what fraction genuinely reversed remote policies versus what fraction merely adjusted it -- converting an anecdote-driven narrative into a bounded, checkable base rate."
  - "operationally distinct from lex-cpjma triangulation-of-independent-methods: triangulation cross-checks a SINGLE finding by confirming it through multiple independent methods that don't share the same failure mode (an RCT result confirmed by an observational study). This atom is not about cross-checking one finding with a second method -- it is about converting a set of illustrative anecdotes, all gathered by the same method (reading for compelling examples), into a bounded, systematically-coded sample that can support a quantitative claim about prevalence. Triangulation answers 'is this finding real?'; this atom answers 'how much of the population does this finding actually cover?' They can compose (a coded sample's result could itself be triangulated against a second coded sample using different criteria) but solve different problems."
critical-questions:
  - "How representative is the 'representative' sample actually claimed to be? Merton's own hedge -- 'there is no reason to suppose that these [four years] did not witness meetings typical of the general period' -- is an absence-of-counter-evidence argument, not a demonstration of representativeness; a critic could ask why exactly these four years (bracketing the very early and later Royal Society) were chosen rather than a random or exhaustive sample of all years."
  - "Once you've built a coded sample, does the classification scheme itself introduce a new source of bias (see the companion technique of deliberately biasing the coding against your own thesis) -- and if so, does disclosing that bias direction sufficiently answer the objection, or does the base rate still need an independently-coded replication to be fully trusted?"
status: active
