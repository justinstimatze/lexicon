id: lex-b6mvq
name: an-opponents-own-greed-produces-a-physical-act-that-reads-as-submission
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a public contest hinges on who is seen to yield first, don''t force the concession directly — engineer a physical situation where the opponent''s own desire causes them to perform the yielding gesture themselves, so the crowd sees genuine submission rather than a forced one. In the Maha-Ummagga-Jataka, the loser of a "Battle of the Law" is whoever bows to the other first. Mahosadha offers his rival a precious gem as a gift, then drops it onto the tips of his greedy, outstretched fingers rather than into his palm: "the brahmin could not support the weight of the gem in his fingers, and it slipt down and rolled to the Bodhisat''s feet; the brahmin in his greed to get it, stooped down to the other''s feet." The rival never intended to bow — his own reach for the gem produced the exact motion that lost him the contest in front of both armies.'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, engineered-submission, exploited-greed, staged-defeat]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"Take it," said the Great Being, and dropt it upon the tips of the fingers of his outstretched hand. But the brahmin could not support the weight of the gem in his fingers, and it slipt down and rolled to the Bodhisat''s feet; the brahmin in his greed to get it, stooped down to the other''s feet.'
canonical-instances:
  - "In a negotiation where the first party to reach across the table to shake hands is later cited as having 'made the first move' and conceded leverage, one side leaves an unusually attractive signing pen just out of easy reach on their own side, so the counterpart leans and reaches first to grab it, unwittingly performing the very gesture that gets read as eagerness to close."
  - "At a press conference where whoever bends down to pick up a dropped microphone is seen as the more deferential party, an aide deliberately places the spare microphone at an angle that will tip toward the rival candidate's side if jostled, engineering the optics of who stoops first."
critical-questions:
  - "This depends on the opponent's greed or self-interest being strong enough to override caution — how does the tactic fare against someone disciplined enough to refuse the tempting object outright, or savvy enough to recognize the setup?"
  - "The engineered gesture only counts as a 'genuine' submission to onlookers who don't know it was staged — does the trick's power evaporate the moment the mechanism itself becomes public, the way the target here immediately protested that he'd been tricked?"
status: active
