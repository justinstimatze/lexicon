    quote: "“The Muslim prefers (x, 2) rather than (y, 1), i.e. prefers to have 2 units of beef rather than having one unit of it. Also he is indifferent between (x, 1) and (y, 2), i.e., between having 2 units of pork and having 1 unit of it. Similarly, the Hindu prefers (x, 1) to (y, 2), and is indifferent between (x, 2) and (y, 1). So both find x to be preferable to y by the grading principle of justice. But y is Pareto-wise superior to x.”"
canonical-instances:
  - "A manager deciding whether to swap two employees' project assignments asks 'would I be happier in their spot' using his own preferences for the work, not theirs -- and concludes the swap is fairer because the tasks he'd personally enjoy end up moving toward whichever employee currently has less of them, even though both employees actually prefer their current assignment and would be worse off after the swap."
  - "A parent splits chores between two kids with flipped tastes for dishes versus yard work, by imagining herself doing each kid's assigned chore with her own preferences. The split she ends up calling 'more fair' has both kids doing the chore they each actually hate, simply because that arrangement would feel like a bonus to her."
critical-questions:
  - "Isn't imagining yourself in someone else's exact objective circumstances already the honest, non-presumptuous version of empathy -- how is inheriting their tastes too any less presumptuous, since you're now guessing at feelings that aren't yours either? Sen's answer is that the alternative is worse: without inheriting the other's tastes, the comparison collapses into substitution -- you're computing what you would feel receiving their goods, which the Muslim-beef/Hindu-pork case shows can point in exactly the wrong direction. Guessing at borrowed tastes imperfectly still beats not attempting them."
  - "If everyone has to inherit everyone else's subjective tastes to make this work, doesn't that require the kind of interpersonal comparison Suppes' whole approach was built to avoid? Sen names this cost directly -- his fix, the 'identity axiom,' does reintroduce interpersonal comparability, exactly what Suppes' own-tastes procedure was designed to sidestep. Removing the paradox costs the one feature that made the original procedure attractive in the first place."
