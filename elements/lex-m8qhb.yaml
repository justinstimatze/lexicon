id: lex-m8qhb
name: spare-the-vulnerable-rival-strike-the-one-who-will-never-reciprocate
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When two equally-weakened rivals both present a viable target and you can only realistically go after one first, don't default to attacking whichever one looks weaker or more exploitable right now -- check which of the two might still become useful to you against the other, because that possibility is what should decide the order, not current vulnerability. Kautilya poses the question directly: 'Between two neighbouring kings equally affected by calamities, should one attack one who has become vulnerable or one who has been unfriendly?' and answers by naming the asymmetry in what each rival could still do for you: 'The unfriendly king shall be attacked first and after defeating him, the other shall be attacked. [The reasoning is:] the unfriendly king will never help in attacking the other whereas the vulnerable one may help in defeating the enemy.' The two targets are equally weak by the stated premise, so vulnerability itself gives no reason to prefer one over the other -- the deciding variable is a third fact about each target's future usefulness to you: an unfriendly rival has already foreclosed the possibility of ever cooperating with you, so nothing is lost by moving against them immediately, while a merely-vulnerable (but not hostile) rival still has open the possibility of joining you against the unfriendly one, and attacking them first destroys an option you haven't yet used. Sequencing, not selection, is the actual insight -- both targets get attacked eventually, but conquering the option-preserving one last means you get to try to extract that option's value before spending it. Diagnostic move: when choosing which of two equally weak rivals to move against first, ask not 'which is weaker' but 'which one still has an open door to becoming my ally against the other' -- the rival whose door is already closed, because they've shown active hostility, should be dealt with first, precisely because there's no cooperative option there left to lose."
