lineage:
  - source: primary
    text: diamond-robinson-2011-natural-experiments-of-history-prologue-and-afterword
    citation: "Jared Diamond and James A. Robinson, eds., *Natural Experiments of History* (Harvard University Press, 2011), Prologue (pp.1-12) and concluding Afterword. The transferable claim is the search-and-design discipline for naturally-occurring paired comparisons. The book showcases eight case studies that span the methodology's design-axes: Kirch on three Polynesian societies (Mangaia, Marquesas, Hawai'i); Belich on seven nineteenth-century frontier societies (US West, Canada, Australia, NZ, South Africa, Argentina, Siberia) demonstrating shared three-step boom-bust-export cycle (26 cycles documented); Haber on three post-colonial New-World banking systems (US, Mexico, Brazil); Diamond on Hispaniola (Haiti vs Dominican Republic across a single sharp political boundary); Rolett-Diamond on 69 Pacific islands with 9-factor analysis of deforestation; Nunn on African slave-trade legacy across modern African states; Banerjee-Iyer on British direct vs indirect colonial rule in 233 areas of India; Acemoglu-Cantoni-Johnson-Robinson on French Revolutionary institutional change across patchwork German regions. The methodology generalizes the move from Mill's logical method of difference (which lex-v6nqz captures abstractly) to the empirical-search discipline of finding such paired cases in observational data. Distinct from lex-v6nqz eliminative-paired-comparison-isolates-cause-by-presence-absence-of-circumstances because lex-v6nqz is the abstract structural claim (presence/absence isolates cause), while this atom is the operational search-and-design discipline for when the cases must be FOUND rather than CREATED. Distinct from lex-8j5ms within-case-process-tracing-as-causal-inference because lex-8j5ms is the single-case inferential strategy; this atom is the multi-case comparative strategy. Distinct from lex-vk65z convergent-independent-evidence-streams because lex-vk65z is about multiple distinct evidence-types converging; this atom is about multiple instances of the same comparison-structure across cases. Distinct from lex-e9z2y causal-inference-method-selection-by-control-and-composition because lex-e9z2y is the meta-selection across causal-inference methods; this atom is one method in that selection-space. Distinct from lex-n3ayj refuse-to-fill-evidence-gaps-with-untested-speculation because lex-n3ayj is the negative-discipline (do not fill); this atom is the positive-discipline (look for naturally-occurring paired cases as a fill-with-evidence move)."
    quote: "[Diamond-Robinson 2011 Prologue p.1, opening:] 'The controlled and replicated laboratory experiment, in which the experimenter directly manipulates variables, is often considered the hallmark of the scientific method. ... But the cruel reality is that manipulative experiments are impossible in many fields widely admitted to be sciences. That impossibility holds for any science concerned with the past, such as evolutionary biology, paleontology, epidemiology, historical geology, and astronomy; one cannot manipulate the past. In addition, when one is studying bird communities, dinosaurs, smallpox epidemics, glaciers, or other planets, manipulative experiments that are possible in the present would often be condemned as immoral and illegal; one should not kill birds or melt glaciers. One therefore has to devise other methods of \"doing science\".' [p.1-2 — natural-experiment definition:] 'A technique that frequently proves fruitful in these historical disciplines is the so-called natural experiment or the comparative method. This approach consists of comparing — preferably quantitatively and aided by statistical analyses — different systems that are similar in many respects but that differ with respect to the factors whose influence one wishes to study.' [p.2 — pitfalls explicit:] 'Of course, natural experiments involve many obvious pitfalls. These pitfalls include the risk that the outcome might depend on other factors that the \"experimenter\" had not thought to measure; and the risk that the true explanatory factors might be ones merely correlated with the measured factors, rather than being the measured factors themselves.' [p.5-6 — the four design-axes:] 'First, the approaches range from a nonquantitative narrative style traditional among historians, in the early chapters, to quantitative studies with statistical analyses familiar in the social sciences outside history departments, in the later chapters. Second, our comparisons range from a simple two-way comparison (the nations of Haiti and the Dominican Republic sharing the island of Hispaniola) to three-way comparisons in two chapters, through comparisons of dozens of German regions, up to comparisons of 81 Pacific islands and 233 areas of India. Third, the societies that we study range from contemporary ones, through literate societies of recent centuries for which we have abundant written archival information, to nonliterate past societies for which all our information comes from archaeological excavations.' [p.11 — perturbation-patchwork-as-natural-experiment, from the section introducing the Nunn / Banerjee-Iyer / Acemoglu chapters:] 'The remaining three studies ... all describe natural experiments in which the historical consequences of some massive perturbation (respectively, the African slave trade, British colonial rule in India, and institutional changes accompanying French Revolutionary conquests) can be examined because the perturbation operated in a geographically irregular patchwork over a large region. When one compares the perturbed patches with the unperturbed patches, it is thus a plausible hypothesis, worth testing, that average societal differences observed between the two types of patches arose from the operation or nonoperation of the perturbing factor rather than from some other differences between the patches.'"
canonical-instances:
  - "Hispaniola as the canonical 2-case natural experiment (Diamond, Ch.4): Haiti and the Dominican Republic share a single Caribbean island bisected by a sharp political boundary. From an airplane: the west (Haiti) is brown, treeless, >99% deforested; the east (DR) is green, nearly one-third forested. Haiti is the New World's poorest country; DR has per-capita income six times higher. The natural-experiment discipline rules out 'environment alone' as the explanation (the natural environments differ only modestly) and points to colonial history (France vs Spain) and the cascade of consequences that followed (slave plantations, language, social inequality, deforestation, modern dictators). The case is small-N narrative but the inferential structure is the same as the large-N statistical cases."
  - "Pacific island deforestation as the large-N statistical case (Rolett-Diamond, Ch.4): 69 Pacific islands ranked on a 5-point deforestation scale, statistically analyzed against 9 candidate factors. Several of the factors (e.g., rainfall, elevation, dust deposition, island age) did not show up in narrative-style island-by-island reasoning — only the cross-island statistical analysis surfaced them. The lesson: when an outcome has many candidate causes, narrative comparison of 1-2 cases CANNOT identify which factors matter; only the multi-case design can."
  - "Frontier-society three-step cycle (Belich, Ch.2): comparing 7 nineteenth-century frontier societies (US West, Canada, Australia, NZ, South Africa, Argentina, Siberia), Belich documents 26 instances of a recurring boom-bust-export-rescue cycle. The convergent-evolution finding — same cycle across societies with very different cultures and economies — is a transferable use of multi-case comparison to detect REGULARITIES rather than just isolate causes of differences."
  - "Patchwork-perturbation natural-experiments (Nunn / Banerjee-Iyer / Acemoglu et al., Chs. 5-7): when a massive historical perturbation operates over a region in a geographically irregular patchwork, the perturbed and unperturbed sub-regions form a paired-comparison natural experiment. African slave-trade impact varying by region; British direct vs indirect colonial rule across India; French Revolutionary institutional change across Germany. Each requires the methodological check on reverse-causation: did the perturbation cause the difference, or did pre-existing differences attract the perturbation?"
  - "Smoking-causes-cancer as the methodological analogue Diamond-Robinson use to motivate the discipline (Prologue p.2-3): you cannot prove smoking causes cancer by writing a biography of one smoker who died of cancer. You ALSO cannot prove it by experimentally injecting smoke into humans. What you CAN do is gather data on thousands or millions of individuals across diet, sun-exposure, and other factors, and statistically analyze. The same logical structure applies to historical questions. The transferable lesson is that 'we can't run the experiment' is not the end of the inferential road — it's the beginning of the natural-experiment design discipline."
  - "Software-engineering analogue: when assessing the effect of a change you cannot A/B test (architectural refactor, team-restructuring, hiring-policy change), look for naturally-occurring paired cases in your industry — two competitor companies that diverged on the factor of interest, two internal projects that diverged, two time-periods bracketing the change. The same pitfalls apply: confounds, reverse-causation (did the change cause the difference, or did teams predisposed-to-the-difference adopt the change?), selection effects. The transferable move is the search-discipline."
  - "Operationally distinct from lex-v6nqz eliminative-paired-comparison-isolates-cause-by-presence-absence-of-circumstances: lex-v6nqz is the ABSTRACT LOGICAL STRUCTURE (Mill's method of difference). This atom is the OPERATIONAL SEARCH-DISCIPLINE — given that manipulation is impossible, where in observational data do paired cases EXIST? They compose: lex-v6nqz supplies the structural claim; this atom supplies the practitioner discipline for finding the cases that satisfy the structure."
critical-questions:
  - "Are the cases actually similar enough on factors OTHER than the one you're studying? The whole leverage of natural experiment comes from 'similar in many respects but differ with respect to the factor of interest.' If the cases differ on many factors, the comparison can't isolate any single one. The check: for each major confound, can you point to evidence that it doesn't vary across the cases?"
  - "Is the perturbation actually exogenous, or did pre-existing differences attract the perturbation? This is the question Diamond-Robinson raise repeatedly. The slave trade extracted slaves from some African regions and not others — but was the extraction random with respect to outcomes, or were perturbation-eligible regions ALREADY different on factors that ALSO affect modern outcomes? When the perturbation's distribution was geographically irregular, the test is whether the irregularity was driven by factors orthogonal to the outcome."
  - "What lag time does the effect have? Diamond-Robinson document cases where institutional changes produced effects only decades later, after the Industrial Revolution made those institutions matter. A negative-result short-term study could miss a real long-term effect. The transferable check: is the outcome window correct for the mechanism the perturbation operates through?"
  - "What is the transferable claim vs the Diamond-Robinson-specific claim? Transferable: the search-and-design discipline for finding naturally-occurring paired cases when manipulation is impossible. Diamond-Robinson-specific: the eight case studies, their specific methodological choices, the particular four-axis taxonomy. Practitioner-discipline: invoke the methodology, not the specific cases as fixed targets."
  - "Could a simpler, more general method work as well or better here? Natural experiments have real cost — finding the right cases, building the comparison, addressing confounds. For some questions, the methodologies in lex-8j5ms (within-case process-tracing) or lex-vk65z (convergent independent evidence-streams) yield more bang for the same effort. The natural-experiment design is most valuable when the question is 'does factor X cause outcome Y?' and you have multiple candidate cases varying on X."
