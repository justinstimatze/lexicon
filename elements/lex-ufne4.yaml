id: lex-ufne4
name: a-fictional-hero-fills-the-prestige-role-real-new-power-cant-occupy
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a new class gains real economic and political power but the culture has no existing heroic template that fits it, watch for an entirely fictional hero to get invented and popularized to occupy the missing prestige role -- one that quietly displaces attention away from where the power actually sits. Medieval merchants had become genuinely powerful in places like the Champagne fairs and the Italian city-states, but Christian Europe, unlike the Islamic world (where a figure like Sindbad could be a fictional exemplar of the perfect life), had no way to imagine a merchant as a romantic hero. The result, and Graeber notes it's probably no coincidence that the poet who popularized it was living at the literal commercial heart of Europe, was the invention of the wandering 'knight-errant' in search of adventure -- even though real knights of the period were mostly landless younger sons who'd been turned into little more than roving thugs, nothing like chivalric romance's idealized heroes. The tell: when a culture's popular heroic archetype bears almost no resemblance to how the people it's modeled on actually behaved, ask who the era's real, rising power actually was, and whether the myth's job is to keep everyone looking somewhere else."
