id: lex-gthkp
name: categorical-status-decouples-from-underlying-fact-for-institutional-convenience
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "An institution's official status-category for a person or thing (alive/dead, open/closed, complete/incomplete) can detach from the underlying fact it is supposed to track, in either direction, whenever detaching it serves the convenience of whoever has to do the processing work the category triggers. Sudnow's Passing On names the hospital instance directly: 'A tentative distinction can be made between \"clinical death\": the appearance of \"death signs\" upon physical examination; \"biological death\": the cessation of cellular activity; and a third category, \"social death\" which, within the hospital setting, is marked by that point at which a patient is treated essentially as a corpse, though perhaps still \"clinically\" and \"biologically\" alive.' Staff push the category EARLY — assigning a still-living, near-death patient to a supply room instead of a bed so as not to have to strip and disinfect a bed after death, pre-wrapping portions of a body before the patient has actually died — when treating someone as already-dead reduces their own workload. But the same institution pushes the category LATE in the opposite direction when that serves convenience instead: aides who must do the unpleasant work of body-wrapping camouflage a corpse as still sleeping — propping the head, closing the eyes, keeping IV fluids running — specifically so the task passes to the next shift. The category is not a passive readout of the fact; it is set wherever it minimizes someone's workload, and which direction it gets pushed is fully explained by who is being spared the processing work, not by anything about the underlying fact itself. Generalize beyond hospitals: a support ticket marked 'resolved' before the fix is verified because closing it removes it from someone's queue; an employee treated as already-departed the moment resignation is announced, though they remain on payroll for two more weeks, because it is administratively easier to route their work elsewhere now; a project quietly kept 'active' on a status board long after everyone privately treats it as dead, because reclassifying it would trigger a review no one wants to run. The diagnostic move: when a status label and the concrete facts on the ground diverge, ask who is spared processing work by the label sitting where it currently sits — that answers 'why here' far more reliably than asking whether the label is accurate."
related: [lex-kwswc, lex-442fr, lex-hz6u3]
evokes: [clinical-death-biological-death-social-death, treated-essentially-as-a-corpse-though-still-alive, camouflage-the-body-pass-it-to-the-next-shift, assigned-to-a-bed-before-the-arrival-of-physicians]
lineage:
  - source: primary
    text: sudnow-1967-passing-on-social-death
    citation: "David Sudnow, Passing On: The Social Organization of Dying (Prentice-Hall, 1967), Chapter 4 'Death and Dying as Social States of Affairs,' section on the 'social death' distinction and its practical deployment in bed-assignment, body-wrapping avoidance, and predeath body treatment at County Hospital."
    quote: "A tentative distinction can be made between \"clinical death\": the appearance of \"death signs\" upon physical examination; \"biological death\": the cessation of cellular activity; and a third category, \"social death\" which, within the hospital setting, is marked by that point at which a patient is treated essentially as a corpse, though perhaps still \"clinically\" and \"biologically\" alive."
canonical-instances:
  - "a patient admitted in a near-death state is left on a stretcher in the supply room rather than assigned a bed, because assigning a bed means someone has to strip and disinfect it after the death that is expected anyway — and if the patient is still alive the next morning, a bed is quickly assigned before physicians or relatives arrive."
  - "aides avoid the unpleasant task of body-wrapping by propping up a corpse's head, closing its eyes, and keeping IV solutions flowing so bypassing personnel won't notice the death — passing the wrapping task to whichever shift eventually discovers it."
  - "a support ticket gets marked 'resolved' the moment it's reassigned, before the underlying issue is actually fixed, because closing it is what gets it off the current owner's dashboard."
  - "an organization keeps a failed initiative listed as 'active' on an internal status board long after everyone privately treats it as finished, because formally closing it would trigger a retrospective review that no one wants to run."
critical-questions:
  - "isn't this just organizational laziness or dishonesty, rather than a distinct pattern? The distinguishing feature is directionality tied to workload, not uniform slack: the same institution pushes the category EARLY (bed-assignment case) and LATE (body-wrapping case) depending on which direction spares the current handler's effort — a uniformly lazy institution would just be slow everywhere. The pattern names the systematic correlation between category-timing and who benefits from that timing, not mere carelessness."
  - "does this require bad faith on the part of individual staff? No — Sudnow's aides and nurses are not portrayed as malicious; the practices are locally rational, low-visibility workarounds within a system that gives them heavy, unpleasant processing obligations triggered by the category. The pattern is a structural incentive gradient, not a claim about individual character."
  - "how is this different from lex-cgqta naturalization-erases-the-mechanism-that-produced-the-effect? lex-cgqta is about a produced effect coming to be seen as natural/given, erasing the history of its production. This atom is about a formal STATUS CATEGORY (a label with administrative triggers attached) being timed to diverge from the fact it purports to track — the mechanism is workload-avoidance via category-timing, not naturalization of an effect's origin."
