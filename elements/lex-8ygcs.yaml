id: lex-8ygcs
name: pareto-optimal-can-still-be-perfectly-disgusting
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating 'no reallocation could make anyone better off without hurting someone else' as evidence an arrangement is acceptable, check what that criterion is actually silent about. Sen: “An economy can be optimal in this sense even when some people are rolling in luxury and others are near starvation as long as the starvers cannot be made better off without cutting into the pleasures of the rich. If preventing the burning of Rome would have made Emperor Nero feel worse off, then letting him burn Rome would have been Pareto-optimal. In short, a society or an economy can be Pareto-optimal and still be perfectly disgusting.” Pareto-optimality only asks whether some further trade would leave everyone at least as well off -- it has nothing to say about how good or how equal the starting arrangement was to begin with. An economy frozen at starvation-alongside-luxury clears the bar exactly as cleanly as one frozen at rough equality, provided neither admits a costless improvement for all. Diagnostic move: when 'optimal' is doing rhetorical work in an argument, ask optimal by which criterion -- efficiency (no further free lunch available) and justice (the current distribution is fair) are separate questions, and a system can pass the first while failing the second as badly as it's possible to fail."
