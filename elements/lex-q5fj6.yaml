id: lex-q5fj6
name: casual-questions-extract-the-routine-an-impersonation-will-need
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Before impersonating someone to people who know them well, the details that will actually be checked, exact habits, small physical tells, private phrasing, aren't things you can improvise convincingly in the moment; they have to be extracted from the target beforehand, and ordinary-sounding curiosity is enough cover to get them. In Radin's Winnebago Hare Cycle, Hare doesn't simply kill the young chief and take his skin; first he draws out the man's entire domestic routine through what reads as idle interest: 'Who is the chief of the village?' and 'What do you usually do?' The answer is exhaustive and exact -- which women get birds and in what order, that his arrows always fall even when thrown, that his mother notices this every time, that he eats only a little, that a headache is his signal for wanting to dance. Only once he has the complete routine, down to the tells the mother specifically watches for, does Hare act: 'Suddenly, when he had turned around for a minute, Hare struck him dead. He skinned him and put the skin over himself.' The questions did the real work; the killing was just the point where the intelligence-gathering phase ended and the impersonation began. Diagnostic move: when someone who has no obvious reason to know you starts asking detailed, low-stakes questions about your specific daily habits and the small things people close to you tend to notice, treat the pattern of the questions, not their individually harmless content, as the thing worth attending to."
