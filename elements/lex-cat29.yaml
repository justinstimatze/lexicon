id: lex-cat29
name: cooperation-evolves-via-multiple-distinct-mechanisms-each-with-its-own-quantitative-bound
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When asking 'why does cooperation evolve when defection is locally dominant?', do not look for a single explanation. Nowak (2006) names at least five distinct mechanisms by which natural selection can favor cooperation, each with a precise quantitative bound specifying when that mechanism is sufficient. (1) KIN SELECTION (Hamilton's rule, r > c/b): cooperate with a relative when the relatedness r exceeds the cost-to-benefit ratio; Haldane's 'two brothers or eight cousins.' (2) DIRECT RECIPROCITY (Axelrod-Hamilton tit-for-tat, w > c/b where w is continuation probability): in repeated interactions, cooperate now to secure future cooperation. (3) INDIRECT RECIPROCITY (Nowak-Sigmund, q > c/b where q is probability your reputation is known to the next recipient): cooperate to build reputation; third parties cooperate with you based on what they've heard. (4) NETWORK RECIPROCITY (k < b/c where k is average neighborhood degree): cooperators cluster on a network and outcompete defectors at boundaries because they reinforce each other locally. (5) GROUP SELECTION (n/m < b/c where n is group size and m is number of groups): groups of cooperators outcompete groups of defectors even when defection is locally favored within each group. Operational diagnostic: when you observe cooperation that 'shouldn't' exist by naive selfish reasoning, ask which of the five mechanisms is operative. The wrong-mechanism diagnosis fails: explaining cooperation via reciprocity when the actual mechanism is kin selection (or vice versa) yields wrong predictions about when cooperation will break down. Each mechanism has DIFFERENT structural prerequisites (close relatedness vs repeated interaction vs reputation-tracking vs network clustering vs group competition) and DIFFERENT failure conditions. The transferable claim is that the pluralism is structural — there is no single 'reason' cooperation evolves, and any attempt to reduce all cooperation to one mechanism produces brittle and overconfident predictions."
