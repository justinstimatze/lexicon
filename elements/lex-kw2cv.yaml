id: lex-kw2cv
name: eternity-holds-a-whole-life-at-once-everlasting-merely-never-ends
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "Two things can both be endless without being the same kind of endless. One type holds the whole of its existence complete and simultaneous in a single unbounded present, with nothing past ever lost and nothing future ever absent. The other type merely never stops, moving through one moment after another forever, without ever possessing more than a single instant at a time. Philosophy names the first kind eternal and the second everlasting: 'eternity is the possession of endless life whole and perfect at a single moment.' What holds nothing future outstanding and nothing past lost, all at once, earns that name; what merely runs on forever without ever holding more than an instant does not -- 'we shall follow Plato in saying that God indeed is eternal, but the world everlasting.'"
related: [lex-pb5sq, lex-2ssrj]
evokes: [consolation-of-philosophy, book-v-prose-vi, eternity-is-the-possession-of-endless-life-whole-and-perfect, nothing-future-is-absent-nothing-past-has-escaped, eternal-vs-everlasting]
lineage:
  - source: primary
    text: boethius-c524-consolation-of-philosophy-book-v-prose-vi
    citation: "Boethius, The Consolation of Philosophy (c. 524 AD), trans. H. R. James (London: George Bell & Sons, 1897), Book V, Prose VI. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "Now, eternity is the possession of endless life whole and perfect at a single moment. What this is becomes more clear and manifest from a comparison with things temporal. For whatever lives in time is a present proceeding from the past to the future, and there is nothing set in time which can embrace the whole space of its life together. [...] Whatever, therefore, is subject to the condition of time... it yet is not such as rightly to be thought eternal. For it does not include and embrace the whole space of infinite life at once, but has no present hold on things to come, not yet accomplished. Accordingly, that which includes and possesses the whole fulness of unending life at once, from which nothing future is absent, from which nothing past has escaped, this is rightly called eternal. [...] So, if we are minded to give things their right names, we shall follow Plato in saying that God indeed is eternal, but the world everlasting."
canonical-instances:
  - "A company that claims institutional memory has, at best, everlasting continuity -- each new hire inherits fragments passed down through documents and stories, one link in an unbroken chain -- while no single person or system ever holds the company's entire history complete and present at once, the way its actual founder once did in the earliest years."
  - "An archive that preserves every record a civilization ever produced, added to forever without end, is everlasting in Boethius's sense but not eternal -- it never holds all of its contents in one simultaneous, total grasp, only ever accumulating one more addition after another."
  - "A person who says they'll love someone forever is promising everlasting devotion, extended moment after moment without end; this is a different, humbler claim than the eternal, all-at-once totality of feeling the word forever sometimes gets credited with."
critical-questions:
  - "Is the distinction actually coherent, or does possessing the whole of an infinite life at once describe a state no being, human or divine, could meaningfully be said to occupy, since 'at once' and 'infinite' may simply be incompatible ideas dressed up as a solvable paradox?"
  - "Does calling the everlasting world 'not really eternal' quietly demote ordinary temporal existence to a lesser, second-class kind of being, when for anything actually living through time, the everlasting mode may be the only kind of endlessness that's ever actually available or meaningful?"
  - "The distinction is doing a lot of work to make sense of divine foreknowledge -- if it turned out incoherent or unnecessary, would the practical claims resting on it survive without it, or does the whole solution collapse if this specific technical move fails?"
status: active
