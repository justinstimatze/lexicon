lineage:
  - source: primary
    text: halberstam-2011-the-queer-art-of-failure
    citation: "Judith Halberstam, *The Queer Art of Failure* (Duke University Press, 2011). The argument is stated in the Introduction ('Low Theory'), in the opening section 'What's the Alternative?' and the following section 'Undisciplined' and 'Low Theory.'"
    quote: "[The core definitional claim naming the specific, historically contingent success metric:] 'In this book I range from children's animation to avant-garde performance and queer art to think about ways of being and knowing that stand outside of conventional understandings of success. I argue that success in a heteronormative, capitalist society equates too easily to specific forms of reproductive maturity combined with wealth accumulation. But these measures of success have come under serious pressure recently, with the collapse of financial markets on the one hand and the epic rise in divorce rates on the other. If the boom and bust years of the late twentieth century and the early twenty-first have taught us anything, we should at least have a healthy critique of static models of success and failure.' [The refusal-not-reevaluation move, and the claim that failure is positively generative rather than merely tolerable:] 'Rather than just arguing for a reevaluation of these standards of passing and failing, The Queer Art of Failure dismantles the logics of success and failure with which we currently live. Under certain circumstances failing, losing, forgetting, unmaking, undoing, unbecoming, not knowing may in fact offer more creative, more cooperative, more surprising ways of being in the world. Failing is something queers do and have always done exceptionally well; for queers failure can be a style, to cite Quentin Crisp, or a way of life, to cite Foucault, and it can stand in contrast to the grim scenarios of success that depend upon \"trying and trying again.\" In fact if success requires so much effort, then maybe failure is easier in the long run and offers different rewards.' [The positive content of the exit — escape from developmental discipline, not mere absence of achievement:] 'Perhaps most obviously, failure allows us to escape the punishing norms that discipline behavior and manage human development with the goal of delivering us from unruly childhoods to orderly and predictable adulthoods. Failure preserves some of the wondrous anarchy of childhood and disturbs the supposedly clean boundaries between adults and children, winners and losers.' [The critique of positive-thinking ideology as obscuring structural causes of failure, via Ehrenreich:] 'As Barbara Ehrenreich reminds us in Bright-sided, positive thinking is a North American affliction, \"a mass delusion\" that emerges out of a combination of American exceptionalism and a desire to believe that success happens to good people and failure is just a consequence of a bad attitude rather than structural conditions... \"If optimism is the key to material success, and if you can achieve an optimistic outlook through the discipline of positive thinking, then there is no excuse for failure.\"... \"the flip side of positivity is thus a harsh insistence on personal responsibility,\" meaning that while capitalism produces some people's success through other people's failures, the ideology of positive thinking insists that success depends only upon working hard and failure is always of your own doing.' [The feminist extension, distinguishing exit from mere non-achievement:] 'From the perspective of feminism, failure has often been a better bet than success. Where feminine success is always measured by male standards, and gender failure often means being relieved of the pressure to measure up to patriarchal ideals, not succeeding at womanhood can offer unexpected pleasures... these kinds of feminisms, what I call shadow feminisms in chapter 5, have long haunted the more acceptable forms of feminism that are oriented to positivity, reform, and accommodation rather than negativity, rejection, and transformation. Shadow feminisms take the form not of becoming, being, and doing but of shady, murky modes of undoing, unbecoming, and violating.' [The 'low theory' methodological companion, naming its source in Stuart Hall's reading of Gramsci:] 'Low theory is a model of thinking that I extract from Stuart Hall's famous notion that theory is not an end unto itself but \"a detour en route to something else.\"... we might also think about it as a kind of theoretical model that flies below the radar, that is assembled from eccentric texts and examples and that refuses to confirm the hierarchies of knowing that maintain the high in high theory.' [The book's opening epigraph and frame, SpongeBob SquarePants as the low-theory instance of the book's political question:] 'Mr. Krabs: And just when you think you've found the land of milk and honey, they grab ya by the britches, and haul you way up high, and higher, and higher, and HIGHER, until you're hauled up to the surface, flopping and gasping for breath! And then they cook ya, and then they eat ya—or worse! SpongeBob: [Terrified] What could be worse than that? Mr. Krabs: [Softly] Gift shops.' 'So what is the alternative? This simple question announces a political project... What is the alternative, in other words, to cynical resignation on the one hand and naïve optimism on the other?' [On refusing academic mastery and disciplinary legibility as itself part of the same political stance:] 'Being taken seriously means missing out on the chance to be frivolous, promiscuous, and irrelevant. The desire to be taken seriously is precisely what compels people to follow the tried and true paths of knowledge production... terms like serious and rigorous tend to be code words, in academia as well as other contexts, for disciplinary correctness.' 'First, Resist mastery... we might read failure, for example, as a refusal of mastery, a critique of the intuitive connections within capitalism between success and profit, and as a counterhegemonic discourse of losing.'"
  - source: discovery-loop
    text: distinctness-audit-halberstam-failure-vs-existing-substrate
    citation: "Lex-0574 (Kafer's claim that crip time names able-bodied tempo as one temporality among others, not the default) cites Halberstam directly and shares the same target as this atom, the reproductive-maturity heteronormative life-script, but generalizes it to temporality rather than success and failure. Lex-0730 (the claim that identity traits decoupled from prototype embodiment produce distinct, invisible histories) is grounded in Halberstam's earlier book, *Female Masculinity*, and makes a different claim about identity-trait decoupling and invisible historical lineages, with no success or failure content; it is included here as a same-author cross-reference. Lex-0545 (Lorde's claim that kinship is constituted by mutual life-work, not by genealogy) targets the same reproductive-family script from the kinship angle: chosen family constituted by sustained mutual labor, rather than by blood or marriage, is itself a refusal of one cardinal piece of the heteronormative-success script. Lex-0736 (Anzaldúa's claim that a category-boundary position generates contradiction-tolerance and third-element synthesis) is the closest structural analog to this atom's larger claim that a stigmatized or liminal position can be genuinely generative rather than merely a deficient in-between state; mestiza consciousness turns boundary-occupancy into a positive synthesizing capacity, structurally parallel to Halberstam turning failure into a positive generative mode. Lex-0534 (the claim that a subculture forms a parallel status hierarchy when the mainstream is blocked) is the nearest rival reading — that queer-failure culture is just a substitute status ladder, still organized around winning and losing with different judges — but Halberstam's text explicitly moves toward undoing rather than toward a new form of doing, so this is a contrast rather than a duplicate. Lex-0566 (Butler's claim that gender essence is an effect of ritualized repetition, not its cause) names the mechanism by which a normative identity, including the heteronormative-success identity, comes to appear as natural essence through ritualized repetition. This atom presupposes that naturalization and makes a further, different claim: that refusing to perform the naturalized success script is itself a valuable, generative political stance, not merely one more way of performing or subverting it."
canonical-instances:
  - "Halberstam's own core definitional statement, naming the specific metric and refusing mere reevaluation of it: 'success in a heteronormative, capitalist society equates too easily to specific forms of reproductive maturity combined with wealth accumulation... Under certain circumstances failing, losing, forgetting, unmaking, undoing, unbecoming, not knowing may in fact offer more creative, more cooperative, more surprising ways of being in the world.'"
  - "*Little Miss Sunshine* (2006), read by Halberstam as a popular-culture instance of the same claim: Olive Hoover's pageant performance is 'destined to fail, and to fail spectacularly,' and that spectacular failure produces 'a kind of ecstatic exposure of the contradictions of a society obsessed with meaningless competition' rather than misery alone — the film relinquishing 'the Darwinian motto of winners, \"May the best girl win,\" and cleav[ing] to a neo-anarchistic credo of ecstatic losers: \"No one gets left behind!\"'"
  - "Shadow feminisms: Halberstam's reading of Monique Wittig and Valerie Solanas as refusing 'woman' as a category defined by a heterosexual framework rather than seeking a better-measured or reformed version of womanhood — 'not succeeding at womanhood can offer unexpected pleasures,' operating through 'shady, murky modes of undoing, unbecoming, and violating' rather than through achievement."
  - "The book's own opening SpongeBob SquarePants epigraph (Mr. Krabs's 'gift shops' warning) as low theory in practice: using a children's cartoon, rather than a canonical theoretical text, as the legitimate site for posing the book's central political question — 'What is the alternative... to cynical resignation on the one hand and naïve optimism on the other?'"
  - "A responsible extension beyond the text: a person who deliberately does not pursue marriage, biological children, linear career advancement, or asset accumulation, and who describes the resulting life not as a consolation or a deficiency to be explained but as having opened up more creative, cooperative, or surprising relationships and commitments than the scripted path would have — the modern instance Halberstam's argument is built to name and validate, distinct from either resigned acceptance of failure or performed indifference to it."
critical-questions:
  - "Is failure here being treated as a temporary state en route back to succeeding by the SAME heteronormative-capitalist metric (resilience, grit, 'trying and trying again') — or as Halberstam's stronger claim, a generative EXIT from the metric's authority to judge at all? Only the second is this atom's claim."
  - "Is the success standard actually being NAMED (whose standard, specifically: reproductive maturity plus wealth accumulation, in a capitalist and heteronormative society) and its ideological contingency argued — or is this a vaguer 'define success on your own terms' self-esteem move that never identifies or challenges the surrounding scoring apparatus?"
  - "Is the alternative being described with genuinely POSITIVE content ('more creative, more cooperative, more surprising ways of being in the world') or is failure being treated as pure negation, lack, or a consolation prize for not having succeeded?"
  - "Has the described failure or refusal collapsed back into a parallel status competition (lex-ux9fh's pattern — best failure, most authentically abject, its own internal winners and losers) rather than remaining, per Halberstam's own framing, a move toward undoing and unbecoming rather than toward a new form of doing and achieving?"
  - "Is the question actually about the MECHANISM by which the success-identity gets naturalized as essence in the first place (Butler, lex-y2tbg), or about whether refusing to perform that naturalized script is itself a valuable, generative stance (this atom)? These compose rather than compete, but they answer different questions."
