id: lex-95ypw
name: years-of-unexplained-suffering-resolve-the-moment-someone-asks-directly
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person's inexplicable psychological distress can go undiagnosed by family and community for years. The cause isn't genuinely hard to find -- what's missing is anyone asking the sufferer a direct, private, specific question about what is troubling them, and the moment someone finally does, the cause surfaces immediately. Black Elk has hidden his terror for roughly two years, through worsening symptoms his own parents can only guess at. Then a medicine man named Black Road sits with him alone and simply asks whether he has seen something that troubles him. 'By now I was so afraid of being afraid of everything that I told him about my vision, and when I was through he looked long at me and said: \"Ah-h-h-h!,\" meaning that he was much surprised. Then he said to me: \"Nephew, I know now what the trouble is!\"' Distinct from a persistent child's repeated questions wearing a guarded secret down over years: here it is one direct question, asked once, in a private setting built for exactly this purpose, that succeeds where nobody had tried at all."
related: []
evokes: [black-elk-speaks, compelling-fear, black-road, i-know-now-what-the-trouble-is, one-direct-question-succeeds]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch13-compelling-fear
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 13, 'The Compelling Fear.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "When the grasses were beginning to show their tender faces again, my father and mother asked an old medicine man by the name of Black Road to come over and see what he could do for me. Black Road was in a tepee all alone with me, and he asked me to tell him if I had seen something that troubled me. By now I was so afraid of being afraid of everything that I told him about my vision, and when I was through he looked long at me and said: 'Ah-h-h-h!,' meaning that he was much surprised."
canonical-instances:
  - "A teenager's unexplained months-long withdrawal ends the first time a school counselor, alone with them and asking nothing else, simply says 'something's been bothering you, what is it?' -- a question neither teacher nor parent had thought to ask so plainly."
  - "A veteran's family spends years attributing his distance to 'just how he is now' until a therapist's first direct question, unprompted by any specific incident, gets him to name the exact memory he'd never told anyone."
  - "An employee's declining performance goes unaddressed through several reviews focused on metrics, until a new manager privately asks 'is something going on outside of work,' and the actual cause, a family crisis, comes out immediately."
critical-questions:
  - "Why does it take an outside specialist, rather than the parents who love him and see him daily, to ask the question that finally works -- is there something about family closeness itself that makes the direct question harder to ask or harder to answer honestly?"
  - "Was Black Elk actually withholding the information the whole time, or did the pressure of two years of unshared fear need to build to exactly this point, 'so afraid of being afraid of everything,' before he was ready to answer even a well-asked question?"
  - "Does the private, one-on-one setting do as much work as the question itself -- would the same direct question, asked in front of his parents or the wider camp, have gotten the same immediate answer?"
status: active
