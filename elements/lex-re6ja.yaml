id: lex-re6ja
name: the-victims-own-eagerness-excuses-abandoning-them-to-the-harm-you-caused
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When you've caused someone real harm by exploiting their eagerness to try something, watch for the excuse that reaches for their eagerness itself as the reason you owe them nothing now. In Cushing's telling, two Ravens talk a Coyote into letting them pop his eyes out of their sockets the way theirs do, then simply fly off with the eyes rather than returning them: 'Let the fool of a beast go without his eyes,' said the Ravens. 'He was so very anxious to get rid of them, and do something he had no business with; let him go without them!' They flew off, ate the eyes, and left, laughing at his predicament. The excuse inverts the actual causal story: his eagerness was the thing they exploited to get access to his eyes in the first place, not a fact that exists independently of what they did to him. Once the harm is done, that same eagerness is repurposed as evidence he deserved it and forfeited any claim on their help. Diagnostic move: when someone who benefited from your enthusiasm afterward cites that very enthusiasm as the reason they owe you nothing, notice that the eagerness they're pointing to is the same eagerness they engineered or relied on to get you there -- it can't be both the lever they pulled and the excuse for not catching you."
