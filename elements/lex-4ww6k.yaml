id: lex-4ww6k
name: from-conditional-and-its-antecedent-one-derives-the-consequent
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you have 'if P then Q' and 'P,' surface that 'Q' follows by modus ponens — name the inference shape so the reasoning is auditable, not just felt."
related: [lex-ftke9, lex-xcaqj, lex-39muf, lex-eehjz, lex-sgd2s, lex-vmas8, lex-qbuw5, lex-r5fy3, lex-un9td, lex-6egsq]
evokes: [modus-ponens, affirming-the-antecedent, implication-elimination, modus-ponendo-ponens, theophrastus-stoic-logic, the-canonical-deductive-step, if-P-then-Q-and-P-yields-Q]
lineage:
  - source: practitioner
    text: wikipedia-modus-ponens-2025-12
    citation: "Wikipedia 'Modus ponens' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Modus_ponens). Underlying primary: Theophrastus (~371-287 BCE) was the first to explicitly describe the modus ponens argument form (Wikipedia citing standard logic histories). The substrate-claim: in propositional logic, given a conditional 'if P then Q' and an assertion of the antecedent 'P', one may derive the consequent 'Q'. This is the canonical deductive step — the rule that licenses derivation of new claims from a conditional plus its antecedent. Stoic logic developed it into a system of indemonstrable inference rules (5 in number, modus ponens being the first). It is also known as modus ponendo ponens ('the mode that by affirming affirms'), implication elimination, or affirming the antecedent. The transferable shape: the operation of treating a conditional-claim as a license-to-conclude when the antecedent is established. Most natural and machine reasoning takes this shape; recognizing it as a discrete operation (vs the conditional-claim itself) clarifies what work is being done at each inference step."
    quote: "[Wikipedia 'Modus ponens', 2025-12 ZIM snapshot:] 'In propositional logic, modus ponens [...] also known as modus ponendo ponens (from Latin: mode that by affirming affirms), implication elimination, or affirming the antecedent, is a deductive argument form and rule of inference. It can be summarized as P implies Q. P is true. Therefore, Q must also be true.' [On the history:] 'The history of modus ponens goes back to antiquity. The first to explicitly describe the argument form modus ponens was Theophrastus. It, along with modus tollens, is one of the standard patterns of inference that can be applied to derive chains of conclusions that lead to the desired goal.' [On form:] 'The form of a modus ponens argument is a mixed hypothetical syllogism, with two premises and a conclusion: If P, then Q. P. Therefore, Q. The first premise is a conditional (if-then) claim, namely that P implies Q. The second premise is an assertion that P, the antecedent of the conditional claim, is the case.' [Critical distinction:] 'This argument is valid, but this has no bearing on whether any of the statements in the argument are actually true; for modus ponens to be a sound argument, the premises must be true.' [The substrate-claim is the canonical-deductive-step. The Theophrastus attribution gives the operation its formal-discrete-naming around 320 BCE; Stoic logic systematized it into the indemonstrable-five inference rules. The substrate-meta point: the operation is so universal in reasoning that it is invisible — naming it explicitly distinguishes the conditional-as-content from the conditional-as-license-to-derive, which matters when diagnosing whether an inference is valid (license-correctly-applied) vs sound (premises-true).]"
canonical-instances:
  - "Standard mathematical proof: from 'all primes greater than 2 are odd' and 'p is a prime greater than 2', derive 'p is odd'. The conditional is the universal claim; the antecedent is the specific case; modus ponens licenses the consequent. Most mathematical-proof steps reduce to chained modus-ponens applications."
  - "Programming: an if-statement IS modus ponens. `if (cond) { action }` says 'if cond, then action'; runtime evaluating cond=true licenses execution of action. The entire control flow of imperative programs is a chain of modus-ponens applications at runtime."
  - "Legal reasoning: 'if a contract has consideration AND offer AND acceptance, then it is binding' + 'this contract has all three' → 'this contract is binding'. The conditional encodes the legal rule; modus ponens licenses application to specific cases. Most legal opinions reduce to chained modus-ponens steps with disputed antecedent-establishment."
  - "Scientific prediction: 'if theory T is true, then we should observe O under conditions C' + 'we observe O under conditions C' is NOT modus ponens (affirming the consequent fallacy). The correct modus ponens form requires the conditional + the ANTECEDENT, not the consequent. Distinguishes valid prediction-test from confirmation-bias."
  - "Operationally distinct from lex-eehjz: lex-eehjz derives a contradiction from assuming the OPPOSITE of what is to be proved (negation-elimination); lex-4ww6k derives the consequent from the antecedent (implication-elimination). They are complementary deductive moves — together with universal-instantiation and conjunction-introduction, they cover most natural deduction steps."
  - "Operationally distinct from lex-sgd2s Occams razor: lex-sgd2s selects among hypotheses; lex-4ww6k derives consequences once a conditional-claim is asserted. Compose: Occam selects which conditionals to adopt; modus ponens derives their consequences. Different layers of the reasoning pipeline."
  - "Operationally related to lex-vmas8 falsifiability: falsifiability uses MODUS TOLLENS (denying the consequent) as its formal engine — 'if T then O' + '¬O' → '¬T'. Modus ponens is the inverse-direction inference. Both are deductively valid and central to the hypothetico-deductive method, but modus tollens is what makes falsifiability work asymmetrically (a single failed prediction refutes; no finite number of successful predictions verifies)."
  - "Operationally adjacent to lex-39muf problem-of-induction (Hume): modus ponens is DEDUCTIVELY valid (the conclusion follows necessarily from the premises); Hume's problem is that INDUCTION (generalizing from observed cases to universal claims) cannot be deductively justified. The hypothetico-deductive method takes inductive conditionals as input and applies modus ponens (or tollens) deductively — the inductive part remains unsolved."
  - "Operationally related to lex-ftke9 work-backwards-from-goal: lex-ftke9 is BACKWARD chaining (start with goal G, find conditional 'P→G', then prove P recursively); lex-4ww6k is FORWARD chaining (start with assertions, apply conditionals to derive consequences). Both use the same conditional rules but traverse them in opposite directions. Forward proves what can be derived; backward proves what needs to be established to reach a target."
critical-questions:
  - "is the inference VALID (rule correctly applied) vs SOUND (premises true)? Modus ponens validity is a structural property: if (P→Q) and P are GIVEN, then Q follows regardless of whether (P→Q) or P are true. Soundness requires the additional premise-truth check. Practitioner-discipline: when an argument's conclusion seems wrong, distinguish 'invalid form' (logic error) from 'unsound premises' (factual error). Different fixes apply."
  - "are you affirming the antecedent (valid) or the consequent (fallacy)? Affirming the consequent: from (P→Q) and Q, conclude P. This is INVALID — Q can hold for reasons other than P. Common in detective reasoning ('if murderer, then bloody glove; bloody glove found; therefore murderer'). Many false convictions and false scientific theories come from this fallacy. Practitioner-discipline: when concluding from an observation matching a prediction, ask 'is this the conditional's antecedent or consequent? If consequent, what OTHER antecedents would produce the same observation?'"
  - "what about modus tollens? Modus tollens is the inverse: from (P→Q) and ¬Q, conclude ¬P. ALSO deductively valid. Asymmetry: confirming Q does NOT establish P (consequent-affirming fallacy); but disconfirming Q DOES establish ¬P (modus tollens). This is the formal engine of Popper's falsifiability (lex-vmas8). Practitioner-question: which direction of inference does your argument use, and is it valid?"
  - "what about the Lewis Carroll regress (modus ponens question of 'why follow the rule')? In 'What the Tortoise Said to Achilles' (1895), Carroll showed that adding 'if P and (P→Q), then Q' as an explicit premise leads to infinite regress (the rule itself needs justifying, and that justification needs justifying...). The standard response: modus ponens is a RULE OF INFERENCE not a PREMISE — it operates over premises rather than being one of them. Practitioner-meta-question: when introducing a new inference rule, distinguish rule-from-premise to avoid Carroll-regress."
  - "where do practitioners over-apply modus ponens? When using it on inductive-strength conditionals as if they were deductive certainties. 'If smoking, then cancer' is a probabilistic generalization; modus ponens on a single instance ('Alice smokes, therefore Alice will get cancer') over-claims. Practitioner-discipline: check whether the conditional is a deductive entailment (apply modus ponens cleanly) or a probabilistic generalization (apply Bayesian update instead). Conflating the two is a common error in scientific and legal reasoning."
