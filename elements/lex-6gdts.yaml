evokes: [private-postponement-isnt-a-negotiation-with-the-other-party, cushing-the-poor-turkey-girl, the-benefactor-acts-on-your-absence-not-on-the-clock, just-before-sunset-i-will-run-back-to-them]
lineage:
  - source: primary
    text: cushing-poor-turkey-girl-just-a-little-longer-costs-everything
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Poor Turkey Girl.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'How is this, that I should go away from the most precious consideration to my flock of gobbling Turkeys? I will stay a while longer, and just before the sun sets I will run back to them...' ... At last a gray old Gobbler mournfully exclaimed, 'It is as we might have expected. She has forgotten us; therefore is she not worthy of better things than those she has been accustomed to. Let us go forth to the mountains and endure no more of this irksome captivity.'"
canonical-instances:
  - "A junior employee promoted and mentored heavily by a senior colleague keeps privately postponing checking back in or crediting that mentor once they start getting attention on their own, telling themselves they'll reconnect 'once things settle down,' only to find the mentor has already quietly stopped advocating for them and moved their support elsewhere by the time they finally reach out."
  - "Someone who borrows a friend's car for what was agreed to be a couple of hours keeps deciding privately to 'just stay a little longer' at an event, assuming the friend's patience is fixed and available whenever they're ready to return it, only to find the friend has already arranged another ride and written off the favor as one they won't extend again."
critical-questions:
  - "is it fair to blame the girl for the Turkeys' unilateral decision to leave before the deadline they themselves implied (sunset) had even passed -- did they actually give her the time they promised, or did their own impatience break the agreed terms first?"
  - "how is someone supposed to know, in the middle of an enjoyable and rare experience, that their benefactor's patience is being spent down faster than the stated deadline would suggest, when the only information available to them is their own private sense of 'I still have time'?"
  - "does this pattern only apply to relationships where the benefactor has genuine and abundant alternatives, an entire flock, capable of vanishing into the mountains together -- would a solitary or less capable benefactor behave the same way, or does group solidarity among the Turkeys make their collective walkout easier than an individual's would be?"
