    quote: "'But since, as L. J. Henderson once remarked, \"almost any classification is better than none,\" this did lead to some scattered clues concerning the functions of newsmagazines and other communications for those occupying various positions in the influence-structure.'"
canonical-instances:
  - "A support team sorts every incoming ticket by which product feature it mentions, and the sort is completely accurate and easy to audit, yet resolution time and customer satisfaction show no pattern across the categories — the feature-based axis is valid but sterile; sorting the same tickets by whether the customer's underlying goal was blocked or merely delayed turns out to explain both outcomes at once."
  - "A school sorts students into gifted, average, and struggling based on standardized test scores, and the sort is measured with real precision, but the sorting predicts almost nothing about which students respond to a given teaching intervention — a different, less obvious axis (whether the student has a stable home routine) turns out to carry the explanatory weight the test-score axis never had."
critical-questions:
  - "Is there a way to tell, before investing months of data collection, whether a proposed classification axis is likely to be sterile — or is discovering sterility necessarily a retrospective judgment that can only be made after the uniformities fail to appear?"
  - "Henderson's line implies sterile classifications survive because 'any sorting beats none' — does that mean organizations should expect to accumulate several sterile-but-plausible-looking classification schemes over time, and if so, what would make an audit of 'which of our standing categories are actually explanatorily sterile' worth doing deliberately rather than waiting to stumble onto the productive axis by accident?"
