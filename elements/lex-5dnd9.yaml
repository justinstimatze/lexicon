lineage:
  - source: primary
    text: hamilton-1964-genetical-evolution-of-social-behaviour
    citation: "W. D. Hamilton, 'The Genetical Evolution of Social Behaviour. I' and 'The Genetical Evolution of Social Behaviour. II,' *Journal of Theoretical Biology* 7:1-16 and 7:17-52 (1964). Hamilton's transferable claim is that natural selection acts on INCLUSIVE FITNESS — an individual's reproductive success including the reproductive success of relatives, weighted by the coefficient of relatedness r. The famous result, now known as Hamilton's rule: an allele for altruistic behaviour increases in frequency when rB > C, where B is the benefit to the recipient and C is the cost to the actor. The structural claim resolves the apparent Darwinian puzzle of altruistic behaviour (alarm calls, parental sacrifice, sterile worker castes in eusocial insects). Hamilton specifically uses the haplodiploid sex-determination of Hymenoptera (ants, bees, wasps) to explain the repeated independent evolution of eusociality: full sisters in haplodiploid species share 3/4 of their genes (because all sisters inherit the same paternal haploid set), versus 1/2 for parent-offspring — so sisters helping their mother raise additional sisters is MORE genetically profitable than producing daughters of their own. The transferable lesson generalizes: apparent altruism between any two entities is explained by the strength of the return channel (genetic, cultural, reputational, institutional) weighted by similarity. Hamilton's paper is the foundational mathematical treatment; Dawkins 1976 *The Selfish Gene* popularized the gene-eye-view interpretation. The atom captures the STRUCTURAL claim about inclusive-fitness-as-the-thing-selected, separable from the specific population-genetics machinery. Distinct from lex-ymvt4 differential-mating-success: lex-ymvt4 is the sexual-selection regime; lex-5dnd9 is the kin-selection regime. They are independent selection forces. Cross-domain attestation: Smith 1964 *Group Selection and Kin Selection* (Nature; the parallel formulation that introduced the term 'kin selection'); Dawkins 1976 *The Selfish Gene* (the popular extension and meme-concept generalization); Trivers 1971 *The Evolution of Reciprocal Altruism* (the COMPLEMENTARY mechanism for non-kin cooperation via repeated interaction); Axelrod & Hamilton 1981 *The Evolution of Cooperation* (Science; the iterated-prisoner's-dilemma extension); Bourke 2011 *Principles of Social Evolution* (Oxford; the canonical contemporary textbook); Nowak 2006 *Five Rules for the Evolution of Cooperation* (Science; the multi-channel synthesis — kin selection, direct reciprocity, indirect reciprocity, network reciprocity, group selection). The transferable structural claim is the foundational one; Hamilton 1964 anchors the cluster."
    quote: "[Hamilton 1964 I, abstract:] 'Coefficient of Relationship as the measure of the proportion of replica genes in a relative, a quantity is found which incorporates the maximizing property of Darwinian fitness. This quantity is named inclusive fitness. Species following the model should tend to evolve behaviour such that each organism appears to be attempting to maximize its inclusive fitness. This implies a limited restraint on selfish competitive behaviour and possibility of limited self-sacrifices.' [Hamilton 1964 I, the conceptual gloss on inclusive fitness:] 'Inclusive fitness may be imagined as the personal fitness which an individual actually expresses in its production of adult offspring as it becomes after it has been first stripped and then augmented in a certain way. It is stripped of all components which can be considered as due to the individual's social environment, leaving the fitness which he would express if not exposed to any of the harms or benefits of that environment.' [Hamilton 1964 II, the haplodiploidy argument:] 'Using this concept it soon becomes evident that family relationships in Hymenoptera are potentially very favourable to the evolution of reproductive altruism. If a female is fertilized by only one male all the sperm she receives is genetically identical.' [II, on the application to Hymenoptera:] 'But there seems to be no reason to doubt that the concept of inclusive fitness is still valid.' [The two papers together establish the formal framework Hamilton's rule encodes: rB > C → altruistic-allele spreads.]"
canonical-instances:
  - "Hymenoptera eusociality (Hamilton's canonical case): in ants, bees, and wasps, the haplodiploid sex-determination produces full sisters who share 3/4 of their genes (vs 1/2 for parent-offspring). A sister helping her queen raise more sisters is GENETICALLY MORE PROFITABLE than producing her own daughters. This explains the repeated independent evolution of sterile worker castes in Hymenoptera and the relative rarity of eusociality elsewhere (one famous mammalian exception: naked mole-rats, also high-relatedness due to inbreeding)."
  - "Ground squirrel alarm calls (Sherman 1977 + follow-ups): Belding's ground squirrels give alarm calls when they detect predators, attracting the predator's attention to the caller (costly). Sherman's empirical confirmation: females (philopatric, surrounded by kin) give alarm calls; males (dispersing, surrounded by non-kin) do not. Hamilton's rule predicts the asymmetry. The Belding's case is the canonical empirical demonstration."
  - "Parental investment as kin-selection (the simplest case): parents are related to offspring by r = 1/2, so investing in offspring up to the point where rB = C (i.e., until additional investment costs the parent's future reproduction by half what it benefits the offspring) is selected. This recovers the intuitive idea of parental care under Hamilton's framework as a special case."
  - "Cooperative breeding in birds (alloparental helpers): in species where adult offspring help raise their younger siblings rather than reproducing immediately (e.g., Florida scrub-jay, white-fronted bee-eater), the helpers are full siblings (r=1/2) of the chicks they help raise. The behavior is selected because raising siblings has the same genetic payoff as raising one's own offspring at the same intensity."
  - "Generalized similarity-weighted help (transferable extension): the structural claim — apparent altruism is explained by the return channel weighted by similarity — generalizes beyond genetic kin. Religious in-group altruism (constructive kinship through shared identity), professional-mentor help to junior researchers (reputation network with shared norms), and tribal mutual aid networks all fit the same structural template with different similarity-metrics. Hamilton's rule is the genetic specialization; the broader template is similarity-weighted-help-as-evolutionarily-stable."
  - "Distinguished from lex-ymvt4 differential-mating-success-as-distinct-selection-regime: lex-ymvt4 names Darwin's sexual selection (selection through mate-choice and competition for mates); lex-5dnd9 names Hamilton's kin selection (selection through indirect reproduction via relatives). Both are real selection regimes operating in the same population on the same genes. They are independent, not opposing."
  - "Distinguished from lex-xdc7z gossip-distributes-reputation-information-letting-cooperation-scale-past-direct-observation: lex-xdc7z is INDIRECT-RECIPROCITY-VIA-REPUTATION (Nowak's 'three rules'); lex-5dnd9 is KIN-SELECTION. Both are mechanisms for cooperation; they operate in different domains (genetic-kin vs reputation-tracked-strangers). They compose at the level of explaining the diversity of cooperative behavior."
critical-questions:
  - "What's the actual coefficient of relatedness, and how is the actor's mechanism estimating it? Hamilton's rule presupposes the actor's behavior tracks r somehow — through kin-recognition cues, co-residence proximity, phenotypic matching, or learned association. If the mechanism is unreliable, the behavior may be tracking a CORRELATE of relatedness rather than relatedness itself. Failure mode: assuming kin-selection explains behavior when the mechanism is actually tracking proximity, familiarity, or culturally-similar appearance."
  - "Is the cost-benefit calculation properly in inclusive-fitness terms? B and C must be measured in expected reproductive units, not in resources, time, or felt experience. Failure mode: applying Hamilton's rule with B and C in the wrong units (e.g., 'helping costs me 10 minutes; benefit is they're happy') misses the actual selection criterion."
  - "Is the explanation kin-selection or one of the four other channels (direct reciprocity, indirect reciprocity, network reciprocity, group selection)? Multiple mechanisms can produce structurally-similar cooperative behavior. Failure mode: defaulting to kin-selection because it's the most famous when reciprocity or institutional reputation is doing the actual work."
  - "Does the descriptive 'selfish gene' frame justify normative selfishness? It does not. Hamilton's rule is a descriptive claim about what evolves; it carries no implication that human actors should act selfishly, only that the evolutionary history of cooperative behavior is explained at the gene level. Failure mode: sliding from 'genes are selfish' (descriptive) to 'humans should be selfish' (normative) — the is-ought gap is being papered over."
  - "Does the transferable extension to non-genetic similarity carry the same evolutionary stability argument? When extending Hamilton's framework to cultural similarity, reputation networks, or institutional bonds, the question is whether the return-channel is reliable enough to make the behavior evolutionarily stable. Failure mode: invoking Hamilton-like reasoning for a similarity-weighted-help pattern without checking that the return channel is actually robust to defection (the key property kin-selection has via genetic identity)."
