id: lex-ubyz3
name: plan-to-throw-one-away-first-system-is-pilot-not-production
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When the first version of a system is being treated as production, surface Brooks's 'plan to throw one away' — the first build functions as pilot; users will move to the second regardless. Plan the throwaway explicitly rather than fighting the inevitable."
related: [lex-4snxu, lex-7hawk, lex-da3g3, lex-eb3wf, lex-fapwm, lex-q77ce, lex-w5qfe, lex-wjwuc]
scaffolds-from: [lex-da3g3, lex-w5qfe, lex-wjwuc]
evokes: [pilot-plant, throwaway-prototype, scaling-up, redesign-is-inevitable, change-as-way-of-life]
lineage:
  - source: primary
    text: brooks-1991-mythical-man-month-ch11
    citation: "Frederick P. Brooks, Jr., *The Mythical Man-Month* (Addison-Wesley 1975; 1991 reprint of the 1975 first edition acquired.x). Chapter 11 'Plan the System for Change.' Brooks adopts the chemical-engineering pilot-plant analogy: chemists learned long ago that a process that works in the laboratory cannot be implemented in a factory in one step; an intermediate scaling step (the pilot plant) is needed to give experience with quantities and with operating in nonprotective environments. Brooks's claim about programming systems: in most projects the first system built is barely usable, and there is no alternative but to redesign it. The redesign happens whether or not the team planned for it; the only management choice is whether to plan for the redesign in advance (treat the first build as a pilot system) or to deliver the first build to customers and let them experience the slowness, awkwardness, and size that always characterize first systems. Delivering the first system to customers buys delivery-date time at the cost of user-suffering, builder-distraction (because they are simultaneously doing the redesign), and reputation damage that the redesign struggles to overcome. Brooks's summary line: plan to throw one away; you will, anyhow. The broader frame Brooks introduces in the same chapter: 'The only constancy is change itself.' Programmers deliver satisfaction of a user-need, and both the need and the user's perception of it will change as programs are built, tested, and used. The first-system-as-pilot claim is the operational consequence of accepting change as a way of life rather than as an exception. Transferable claim: when a system is built under conditions of design-uncertainty (the team does not yet know what the right design is), the first complete build serves an epistemic function — it teaches the team what the right design is — and the planning frame should treat it as a learning artifact rather than as a production artifact. In-copyright."
    quote: "[Brooks 1991 Ch.11 'Plan the System for Change', pp.115-117:] [Paraphrase, due to upstream redaction constraints: Brooks opens with the chemical-engineering pilot-plant analogy — a laboratory process cannot be scaled directly to a factory in one step; an intermediate pilot-plant build is required to give experience with scaling and with operating in nonprotective environments. Brooks observes that programming-system builders have been exposed to the same lesson but have not yet learned it: project after project designs a set of algorithms and then commits to a schedule that demands delivery of the first thing built. In most projects, the first system built is barely usable; it may be too slow, too big, awkward to use, or all three. There is no alternative but to redesign. The redesign may be done in one lump or piece-by-piece, but all large-system experience shows it will be done. Where a new system concept or new technology is used, one has to build a system to discard, for even the best planning is not so omniscient as to get it right the first time. The management question, Brooks frames, is not whether to build a pilot system and discard it — you will do that. The only question is whether to plan for it in advance or to deliver the pilot to customers. Delivering the pilot to customers buys schedule time at the cost of user-suffering, builder-distraction during the inevitable redesign, and reputational damage that the redesign struggles to live down. Brooks's summary slogan in the chapter: plan to discard the first build; you will, anyhow. The chapter's broader frame: the only constancy is change itself. Programmers deliver satisfaction of a user-need; both the need and the user's perception of it will change as the program is built, tested, and used. The discard-the-first-build prescription is the operational consequence of accepting change as the default state.]"
  - source: practitioner
    text: cross-domain-pilot-system-evidence
    citation: "Cross-domain attestations: (i) Chemical engineering's pilot-plant practice is the source analogy Brooks uses; the field has long treated laboratory-to-factory scaling as a multi-stage exercise where each stage's purpose is to surface the failures that the next stage's design must address. (ii) Aviation prototyping: production aircraft are preceded by prototype, X-plane, and pre-production phases; each phase's role is to surface scaling failures (aeroelasticity, control-coupling, manufacturing-variance) that the next phase must accommodate. (iii) Lean Startup methodology (Ries 2011) operationalizes the same substrate for product development: build-measure-learn cycles where the first build is explicitly framed as a learning artifact. (iv) Scientific methodology: pilot studies in clinical trials and experimental design serve the same function — surface the design failures (sample sizes, instrument calibration, protocol ambiguities) that the full study cannot afford to discover. The recurring frame: separate the learning-build from the production-build, and structure incentives so that the team can discard the learning-build without political cost. The failure-mode is delivering the learning-build as the production-build, which forces the team to defend a design they would otherwise discard — the political cost of admitting the redesign becomes prohibitive once a delivery has happened."
    quote: "[Cross-domain consistency check, 2026-06-09: the substrate-claim transfers cleanly across domains because the underlying mechanism is epistemic — the first complete build's value is the information it generates about what the right design is. The transfer fails only when the domain has zero design-uncertainty (a copy of an already-built system, a routine production run); in that case there is no learning to do and no pilot is needed. The discriminating feature for whether the lex-ubyz3 frame applies is the team's actual uncertainty about the right design, not the project's nominal phase or the contract's nominal milestones.]"
canonical-instances:
  - "Brooks 1991 Ch.11: the canonical naming. The pilot-plant analogy from chemical engineering applied to programming-system design."
  - "OS/360 (Brooks's underlying context): the system Brooks's experience came from. Brooks's diagnosis was that the team had effectively delivered a pilot to customers without acknowledging it, and the political cost of doing the inevitable redesign was paid in eight years of incremental patching against an architecture the team would have discarded if it could."
  - "Chemical-engineering pilot plants: the source analogy. A laboratory desalination process that works at the bench cannot be scaled to a 2,000,000 gallon/day community water system in one step; an intermediate 10,000 gallon/day pilot plant is built to surface the scaling failures. The pilot-plant artifact is explicitly designed to be discarded; its value is the information it generates."
  - "Modern instance: Lean Startup build-measure-learn cycles (Ries 2011). The first product version is framed as a learning artifact; the design is structured to maximize what the team learns from customer response. The frame is operationalized through minimum-viable-product (MVP) discipline — build only what is needed to test the design hypothesis, and prepare to discard the result."
  - "Modern instance: scientific pilot studies. A clinical trial protocol is piloted on a small sample to surface the protocol failures (instrument calibration drift, ambiguous inclusion criteria, recruitment-rate misestimates) that the full study cannot afford. The pilot's results are not the trial's results; the pilot's value is the information it generates about how to run the trial."
  - "Counter-example (lex-ubyz3 does NOT apply): a project that is a copy of an already-built system, or a routine production run with no design-uncertainty. In these cases there is no learning to do; the lex-ubyz3 frame mis-prescribes a learning-build where direct production is correct. The discriminator is design-uncertainty, not project-phase."
  - "Operationally distinct from lex-wjwuc collision-with-error-as-load-bearing-for-living-truth: lex-wjwuc is the epistemic claim that truth requires error-confrontation. lex-ubyz3 is the design-management claim that the first complete build serves as the error-confrontation vehicle and should be planned as such. They compose: the lex-ubyz3 first-build is the lex-wjwuc collision artifact that the team would otherwise not encounter under planning that treats the first build as production."
  - "Operationally distinct from lex-eb3wf prospective-hindsight-as-failure-mode-elicitation (Klein's premortem): lex-eb3wf surfaces failure modes BEFORE building. lex-ubyz3 prescribes that some failures only surface FROM building. They are sequential: lex-eb3wf reduces but does not eliminate the discoveries the lex-ubyz3 first-build will generate. The team that does only lex-eb3wf will still need lex-ubyz3 for the residual unknowns; the team that does only lex-ubyz3 will discover failures expensively that lex-eb3wf could have surfaced cheaply."
  - "Operationally distinct from lex-da3g3 iteration: lex-da3g3 is the general tier-2 iteration primitive. lex-ubyz3 is the specific Brooks claim that the FIRST iteration of a design-uncertain system should be planned as discardable. lex-da3g3 is what lex-ubyz3 is an instance of; lex-ubyz3 adds the specific operational discipline (don't deliver the pilot to customers; manage scope and expectations so the redesign can happen) that the abstract iteration primitive does not specify."
  - "Operationally distinct from lex-w5qfe iterative-refinement-of-a-provisional-target-against-feedback: lex-w5qfe is the general refinement-against-feedback loop. lex-ubyz3 is the specific Brooks claim about the FIRST complete build serving an epistemic-pilot function. They compose: lex-w5qfe names the ongoing process; lex-ubyz3 names the first-iteration's distinctive role within that process. The first iteration's role is unique because it produces the most learning-per-unit-effort and the most political-cost-if-mis-framed."
  - "Operationally distinct from lex-4snxu conceptual-integrity-is-the-most-important-consideration-in-system-design and lex-fapwm second-system-effect: lex-4snxu prescribes design authority; lex-fapwm warns about the second iteration; lex-ubyz3 prescribes that the first iteration be planned as discardable. They compose: a single architect (lex-4snxu) builds the first system as a pilot (lex-ubyz3) and then builds the second system with restraint (lex-fapwm). Brooks's full Chapters 4-5-11 frame is the composition of these three; treating any one in isolation loses indispensable context the other two supply."
critical-questions:
  - "is the team treating the first build as a pilot or as production? Discriminator: examine the contracted deliverables, the team's stated success criteria, and the political cost of acknowledging that the first build will be redesigned. If the first build is contractually-committed to customers, the lex-ubyz3 frame is not active; the team will pay the cost Brooks names (user-suffering, builder-distraction, reputation damage)."
  - "what design-uncertainty does this project carry? Discriminator: the lex-ubyz3 frame applies in proportion to genuine design-uncertainty. A project that is a port of an already-working system has low uncertainty and does not need a pilot; a project deploying a new architecture-pattern or a new technology has high uncertainty and the first build IS a pilot whether the team plans for it or not."
  - "what will the team do with what the first build teaches? Discriminator: the lex-ubyz3 frame's value depends on the team being structurally able to act on what the pilot teaches. If the team is committed to the pilot's architecture (sunk-cost, political momentum, customer-facing commitments), the learning the pilot generates will be discarded and the lex-ubyz3 prescription was wasted. Check whether redesign is structurally permissible before relying on the pilot to generate useful learning."
  - "is the pilot's discard cost paid in advance or paid in user-suffering? Discriminator: planning for discard pays the cost up front (additional time budget, customer expectation management, scope discipline that prevents the pilot from becoming the production system by inertia). Not planning for discard pays the cost in user-suffering after delivery. The lex-ubyz3 prescription is to choose the up-front cost."
  - "what is the boundary between this pilot and the next iteration? Discriminator: a pilot without a planned successor is a one-shot delivery wearing pilot-clothing. The lex-ubyz3 frame requires that the team has named the next iteration and committed resources to building it. Otherwise the pilot is rhetorical cover for shipping a known-bad system."
status: active
