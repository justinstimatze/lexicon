id: lex-mqwf8
name: overreach-beyond-ones-own-nature-invites-destruction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Sustained, effortless support from someone stronger can breed enough overconfidence to attempt a task that was never within your actual capacity, regardless of explicit warning — the attempt fails not from bad luck but from a basic mismatch between the ambition and the underlying nature doing the attempting. In the Jataka's tale of the lion and the jackal, a jackal begs to serve a lion, who feeds and shelters him in return; once fattened and prideful, the jackal insists on hunting an elephant alone despite a direct warning against it: 'Friend jackal, let not this seem good in your eyes. You are not sprung from a stock that feeds on the flesh of the elephants that it kills.' He attempts it anyway and is crushed: 'The elephant lifting up his fore foot planted it on the jackal's head and smashed his skull to pieces.'"
related: []
evokes: [jataka, catukkanipata, jambuka-jataka, sustained-support-breeds-overconfidence-past-actual-capacity, explicit-warning-fails-to-stop-a-fatal-overreach]
lineage:
  - source: primary
    text: jataka-chalmers1895-jambuka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 335, Jambuka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Friend jackal, let not this seem good in your eyes. You are not sprung from a stock that feeds on the flesh of the elephants that it kills."
canonical-instances:
  - "A junior analyst who has thrived for a year under a senior partner's constant coaching insists on running a major client negotiation solo, dismissing a direct warning that the client's tactics specifically target the inexperience the analyst still has. The deal collapses in the first meeting."
critical-questions:
  - "Is the failure really about a fixed mismatch in nature or capacity, or could the jackal have succeeded with more preparation — does the story overstate an innate limit where a skill gap might have been the real, closeable issue?"
  - "Why does the warning fail here — is overconfidence, once it sets in, inherently resistant to being talked down, or did the lion simply speak up too late in the jackal's arc for it to register?"
status: active
