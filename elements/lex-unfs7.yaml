id: lex-unfs7
name: teaching-structure-not-facts-produces-comprehension-memory-and-transfer
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When designing instruction, an explanation, or a curriculum for any subject, organize it around the discipline's underlying structure — its general principles and the relationships that connect specific facts to each other — rather than presenting disconnected facts to be memorized independently. Bruner's four-part case for this, from the Woods Hole curriculum conference: (1) COMPREHENSIBILITY — grasping the general principle behind a set of facts makes the specific instances easier to understand; a correct general explanation is often the most interesting one available, plainer than the partial, overcomplicated versions it replaces. (2) MEMORY — detail left disconnected from a structured pattern is rapidly forgotten, while what actually survives in long-term memory is a 'regenerative' representation (a formula, a model, a compressed pattern) that lets the learner reconstruct the details on demand. A scientist remembers the formula s = ½gt² and regenerates a table of fall distances from it whenever one is needed. (3) TRANSFER — understanding something as a specific instance of a more general principle is learning a model for recognizing other instances of that principle later; this is the main route to transfer of training, more reliable than accumulating specific solved cases. (4) NARROWING THE GAP — repeatedly re-examining elementary material for its fundamental structure keeps early learning from going stale or misleading relative to later, more advanced treatments of the same subject, closing the gap that otherwise opens between what a student learned early and what the discipline actually is. THE OPERATIVE MOVE: before teaching or explaining, ask what the general principle is that makes the specific fact necessary, and lead with that — the fact becomes a consequence of the principle rather than an isolated item competing for memory space with every other isolated item. Distinct from lex-5qv7q facts-need-a-latticework-of-models-to-be-recallable-and-usable (Munger): Munger's claim is a LEARNER'S personal practice — build a cross-disciplinary lattice of ~80-100 models yourself and hang every fact you encounter on it, wherever it comes from. Bruner's claim is a CURRICULUM-DESIGNER'S and TEACHER'S claim about a single discipline — organize the teaching of THIS subject around ITS OWN fundamental structure, before the learner ever gets to choose what to hang facts on. They compose: Bruner explains why a well-structured course produces retrievable knowledge in the first place; Munger's practice is what a learner does across many such courses afterward. Distinct from and upstream of lex-qhrpv comparative-substrate-bootstrapping and its 'spiral curriculum' instance: this atom is the STRUCTURE-FIRST premise (teach the discipline's own organizing principles); the spiral curriculum is the SEQUENCING consequence of that premise (revisit those same structural ideas repeatedly at increasing complexity as the learner matures) — you need this atom's structure before there is anything for the spiral to revisit."
related: [lex-5qv7q, lex-qhrpv, lex-kcgcw, lex-fz8n7]
