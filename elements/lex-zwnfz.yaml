id: lex-zwnfz
name: abstract-concepts-inherit-bodily-schemas-via-orientational-metaphor
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When abstract concepts feel intuitive in some directions and unintuitive in others — when happy feels UP, more feels UP, future feels FORWARD, status feels HIGH, control feels OVER — Lakoff & Johnson's transferable claim is that the abstract concept has inherited its structural intuitions from the body's spatial experience. Drooping posture correlates with sadness; erect posture with positive affect; therefore HAPPY-IS-UP feels natural and SAD-IS-DOWN feels natural. Adding objects to a pile makes the level go up; therefore MORE-IS-UP and LESS-IS-DOWN feel natural. Animals face the direction of motion; therefore FUTURE-IS-FORWARD feels natural (in cultures that adopt this; some take PAST-IS-FORWARD because the past is what's seen). The transferable claim is that orientational metaphors are NOT arbitrary mappings — they are constrained by bodily-spatial experience, and the abstract domain inherits the structural logic of its bodily source. Practitioner consequences: (1) when designing UI for an abstract domain, use the bodily-natural orientation (progress bars go LEFT-TO-RIGHT and FILL-UP because progress and accumulation are universal bodily experiences; reversing them creates immediate confusion); (2) when teaching abstract concepts, scaffold from the bodily schema (teach voltage as height-of-water, current as flow-of-water, resistance as narrow-pipe — students reason about the bodily schema and the abstract structure rides along); (3) when noticing reasoning confusion, check whether the abstract concept's bodily-schema-inheritance is consistent across all relevant directions (UNKNOWN-IS-UP is coherent with UNDERSTANDING-IS-GRASPING but NOT coherent with FINISHED-IS-UP, which is why 'tying up loose ends' is non-intuitive); (4) cross-cultural variation in orientational metaphor (future-in-front vs future-behind, time-flows-left-to-right vs time-flows-back-to-front) tracks cross-cultural variation in spatial experience, not arbitrary cultural noise — useful diagnostic when designing for global audiences. Distinct from lex-kfdep conceptual-metaphors-structure-cognition: lex-kfdep is the META-CLAIM (metaphors are cognitive infrastructure, not decorative language). This atom names the SPECIFIC SUB-MECHANISM by which one class of metaphors (orientational) is non-arbitrarily constrained — they track bodily experience. Other sub-mechanisms (structural metaphors like ARGUMENT-IS-WAR, ontological metaphors like INFLATION-IS-AN-ENTITY) have different grounding. Distinct from lex-hsntu patterning-instinct: patterning-instinct names the meaning-imposition habit; this atom names a specific class of constraints on how that meaning gets structured. Composes with lex-2kjmb free-energy-principle: orientational schemas are priors the organism brings to its sensory input — they ARE the generative model from which abstract domains inherit structure."
