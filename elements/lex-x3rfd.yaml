id: lex-x3rfd
name: breaking-a-vow-costs-more-than-the-pain-it-would-avoid
type-in: situation
type-out: state
_tier: atomic
agent-instruction: 'Under torture from someone who has already betrayed and captured you, the calculation that keeps you from retaliating even when retaliation is fully within your power isn''t forgiveness or fear — it''s that breaking your own commitment would be a permanent loss where the torture is only a temporary one. In the Bhuridatta-Jataka, the snake-king Bhuridatta, captured by a charmer using a captured Brahmin''s betrayal, has the power to kill his tormentor instantly but has vowed non-anger as part of his fast: "if I were angry with him for his treachery, my moral character would be injured... whether Alambayana cut me in pieces or cook me or fix me on a spit, I must at all events not be angry with him." He is beaten, force-fed a drug, and paraded as a dancing captive, and holds the vow through all of it — the pain is bounded and passes; the character he''d damage by breaking his word would not.'
related: []
evokes: [jataka, mahanipata, bhuridatta-jataka, vow, non-retaliation, torture, character-over-instrumental-defense]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-bhuridatta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 543, Bhuridatta-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "I took this fellow to my Naga home and settled him in high prosperity, but he would not accept the jewel which I gave him, and now he is come here with a snake-charmer. But if I were angry with him for his treachery, my moral character would be injured. Now my first of all duties is to keep the fast-day in its four periods,—that must remain inviolate; so whether Alambayana cut me in pieces or cook me or fix me on a spit, I must at all events not be angry with him."
canonical-instances:
  - "A whistleblower who could destroy a former colleague's career with a single leaked email declines to, not from any loyalty left between them, but because using it would violate a personal rule about never weaponizing private correspondence, a rule they value more than the satisfaction of retaliation."
  - "A martial artist with the skill to seriously injure an attacker in a street confrontation instead uses the minimum restraint necessary, holding to a training vow about proportionate force even while being struck, because breaking that discipline would cost them something the fight itself can't."
critical-questions:
  - "Bhuridatta has the actual power to end the torture at any moment and chooses not to use it — does restraint made possible only by overwhelming latent power carry the same meaning as restraint from someone who was genuinely helpless?"
  - "The vow protects his character but not his body — at what point, if any, would the physical cost become large enough that preserving the vow stops looking like integrity and starts looking like a refusal to protect oneself that has its own cost to weigh?"
status: active
