id: lex-zsybu
name: introducing-chance-into-distribution-exposes-the-old-orders-necessity-as-convention
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A hierarchy that has stood unchallenged long enough starts to feel necessary, as though the current arrangement of who gets what were simply how things must be rather than one contestable outcome among many. Deliberately introducing genuine chance into the distribution -- a lottery, a random draw, a lot -- punctures that feeling directly, because the moment an allotment can just as easily fall out differently, it becomes visible that the previous fixed arrangement was never inevitable either, only settled. Hyde reads this in Hermes' meat division: 'the private lottery he conducts as he sacrifices the cattle, the moment when he cuts the meat into twelve portions, \"distributed by lot, each one exactly right\"... With it, we have the trick of reapportionment and the cancellation (or remaking) of hierarchy... he subjects existing order to an attack of accidents, letting things fall as they may; and if the existing order had an air of necessity about it, he dispels that air, making it clear that any order is partly a matter of chance.' Hyde connects the same mechanism to a real historical institution: 'Hermes... was the patron of lottery... and lottery was one of the characteristic institutions of Greek democracy; the extensive use of lottery in the selection of Athenian public officials was the supreme expression of the democratic principle of the absolute equality of all citizens.' The lottery doesn't merely redistribute one instance of goods or office; every time it runs, it re-demonstrates that the prior distribution could have gone otherwise, which is a standing argument against treating any single distribution, including the next one, as naturally deserved. Diagnostic move: when a hierarchy defends itself by appearing simply inevitable or self-evidently correct, consider whether introducing a genuine, visible element of chance into some piece of its distribution would test that appearance -- if the arrangement really does track something more than convention, chance will disturb it only slightly; if the arrangement's necessity was mostly a feeling produced by its own persistence, a single fair lottery run will be enough to dissolve it."
