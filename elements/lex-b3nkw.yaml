id: lex-b3nkw
name: a-provenance-question-only-the-true-owner-can-answer-exposes-a-thief
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When two parties dispute ownership of an object and a direct claim of possession can''t settle it, ask a question about the object''s history or making that only the genuine owner would know from lived experience, then check the answer against the object itself. In the Maha-Ummagga-Jataka, Mahosadha settles a necklace dispute this way: "What scent do you use for this necklace?" She replied, "I always use sabbasamhharaka." Then he asked the other, who replied, "How shall a poor woman like me get sabbasamhdraka? I always scent it with perfume made of piyangu flowers." He then had the necklace itself checked against each claimed scent — the true owner''s answer matched what was verifiably there.'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, provenance-question, thief-detection, verifiable-detail]
