canonical-instances:
  - "A hiring team frustrated by weak candidates doubles the number of resumes screened per week (raising throughput) rather than changing the screening criteria that determine which candidates even enter the pipeline (narrowing the space) — if the true bottleneck is that the criteria admit too many unqualified applicants, reviewing more of them faster never closes the gap."
  - "A drug-discovery program run as a pure high-throughput screen (testing more compounds per day against a target) hits the same ceiling as brainstorming once the true search space is combinatorially vast (all possible small molecules); the programs that actually scale add structure-based filtering or rational design to shrink which compounds get tested at all, rather than only screening the same space faster."
  - "operationally distinct from lex-hkn3v escalate-a-vague-conflict-to-its-extreme-form-to-reveal-the-resolution: that atom is about sharpening a PROBLEM STATEMENT so a resolution method becomes visible; this atom is about diagnosing whether a proposed SEARCH TECHNIQUE actually reduces the space being searched or merely samples the same space faster — a technique can pass or fail this test regardless of whether the underlying contradiction has been sharpened yet."
critical-questions:
  - "how would someone actually know whether their combinatorial space is small enough that a throughput technique will plausibly cover it, versus large enough that no realistic rate increase closes the gap — is there a rough size-estimate discipline being applied here, or is the choice of technique made on faith that 'more ideas' always helps?"
  - "can a throughput technique (brainstorming, synectics) be COMBINED with a space-narrowing technique rather than treated as a substitute for one — for instance, using brainstorming only after a contradiction-based method has already reduced the field to a tractable set of candidate directions?"
  - "is a technique being credited with narrowing the search space when it has actually only reorganized HOW ideas within the same space get proposed (e.g. forcing structured categories, as in morphological analysis) — does imposing structure on the generation process count as genuine space-reduction, or is it still throughput dressed up as method?"
status: active
