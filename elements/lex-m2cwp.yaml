id: lex-m2cwp
name: pivot-from-dualist-cue-to-multifactorial-frame
type-in: state
type-out: frame
_tier: molecule
agent-instruction: "When you find yourself splitting reality into two opposing buckets, pause and pivot to a multifactorial frame. Dualism is often a starting move that calcifies; replacing 2 buckets with 5-7 factors usually surfaces what the dualism was hiding."
related: [lex-5mtne, lex-9m3vy, lex-e5des, lex-k6d7u, lex-quu4s, lex-rfxtb, lex-x6sbv, lex-znaau]
scaffolds-from: [lex-x6sbv, lex-rfxtb, lex-e5des, lex-k6d7u, lex-quu4s, lex-znaau]
evokes: [the-practice-loop-not-the-one-off-application, name-the-distortion-then-reframe, cbt-style-distortion-detection-and-replacement, the-fox-pivot-from-hedgehog-cue, eventually-automatic-multifactorial-default]
decomposes-into:
  - lex-x6sbv
  - lex-rfxtb
assembly: "sequential(lex-x6sbv, lex-rfxtb)"
premises:
  - "the practitioner notices a dualist-reduction cue (lex-x6sbv) in their own thinking, in a conversational partner's framing, or in a prompt they're responding to"
  - "the cue is named explicitly ('this is dualist-reduction') — naming is the pivotal intervention per Beck 1976 / Burns 1980 (distortions are interruptible once labeled)"
  - "multifactorial-frame (lex-rfxtb) is then applied: factor-enumeration, interaction-mapping, gradient-not-bin, re-pose-the-question — selecting which sub-moves are appropriate to the specific phenomenon"
  - "the output is a multifactorial reframing of the situation that can then drive deliberation, decision, action, or further inquiry — not a final verdict (that would re-collapse) but a USABLE multi-factor model with explicit weights and uncertainty"
  - "the molecule is intended to be fired REPEATEDLY across many situations to build the practice-default: with repetition, multifactorial-frame becomes the automatic response to dualist cues, displacing the default dualist-reduction-without-detection"
critical-questions:
  - "is the cue (lex-x6sbv) actually a genuine dualist-reduction, or is the underlying structure actually binary? Some structures genuinely have 2-option form (logical disjunction; binary actions; switches). Mis-firing the pivot on genuinely-binary structure is wasteful over-modeling. Pre-pivot check: does the phenomenon have empirically-graded structure the binary framing is losing? If no, accept the binary"
  - "does the multifactorial-frame application (lex-rfxtb) produce a USABLE model, or does it produce paralysis-by-complexity? The pivot succeeds when it generates a weighted, actionable, falsifiable model; it fails when it produces 'it's complicated' as exit-from-accountability. Discriminator: when pressed for a decision, can you assign weights to the factors and act? If the multifactorial reframing collapses under commitment-pressure, you may have used the frame as avoidance rather than as analysis"
  - "is the molecule being fired ENOUGH to build the practice-default? The user's stated goal is automatic multifactorial-default displacing automatic dualism. This requires repeated firing across many situations. Operational test: track over weeks-months whether dualist cues get caught and pivoted within seconds (practiced) vs. after the fact in retrospect (not yet practiced). The asymptote is in-the-moment detection-and-pivot"
  - "is the pivot becoming PERFORMATIVE (the appearance of multifactorial analysis without actual update)? Risk: 'I see multiple factors' becomes a social signaling move while the operative-belief remains dualist. Cross-link to lex-e5des dialogical-vs-monological-belief-system: performative multifactorial-frame is monological in structure (it doesn't take in new factor-weights from outside; it produces the appearance of having considered them). Test: does the multifactorial reframing actually CHANGE which action you take, or does it produce the same action with more elaborate justification?"
  - "is the pivot being applied to ONE'S OWN cognition, or only to OTHERS' cognition? Self-application is the key case. The failure mode is using dualist-reduction-as-cue as a critique-frame for others' thinking without applying it to one's own. Reciprocity test: do you notice your own dualist cues as readily as you notice your interlocutor's?"
lineage:
  - source: primary
    text: beck-1976-burns-1980-cognitive-therapy-tradition
    citation: "The 'detect-name-replace' shape comes directly from cognitive-therapy clinical practice. Beck 1976 established the discipline: catch the distorted thought in real-time, name the specific distortion, replace with corrective cognition (see esp. Ch.9 'Principles of Cognitive Therapy' and Ch.10 'Techniques of Cognitive Therapy' on distancing, reality-testing, and correcting cognitive distortions). Burns 1980 popularized the move with the canonical 10-distortions checklist. This molecule applies the same shape to dualist-reduction → multifactorial-frame replacement. The CBT empirical literature establishes that this practice-shape works when sustained — Hofmann et al. 2012 meta-analysis on CBT efficacy across disorders. No verbatim Beck excerpt is quoted here; Burns and Hofmann are Tier-5 deepening sources"
  - source: practitioner
    text: tetlock-good-judgment-project-calibration-training
    citation: "Tetlock's Good Judgment Project (post-2005 follow-up to Expert Political Judgment) empirically demonstrated that calibration TRAINING — repeated practice in graded-credence forecasting with feedback — produces durable improvements in forecasting accuracy. The mechanism is exactly the practice-default formation lex-m2cwp targets: with repetition, the multi-dimensional-credence response becomes automatic, displacing the over-confident binary verdict that's the untrained default. Tetlock + Gardner 2015 Superforecasting catalogues the GJP findings. Cited in lex-k6d7u lineage; here invoked as the empirical precedent for the practice-default-formation claim; no verbatim quote is claimed here."
  - source: practitioner
    text: discovery-loop-chat-2026-05-14
    citation: "imported chat-snippet defining dualist-vs-multifactorial-thinking, paired with user's explicit operational goal: 'I want to flesh out the functional surfaces of it so I can be prompted to think usefully with it more often (and probably eventually as a practiced default to automatic dualism).' The molecule's design (cue-detection followed by frame-application, with the practice-default orientation explicit in premises and critical-questions) is the substrate-side realization of the user's stated goal. The molecule's success criterion is operational: does firing it across many situations produce automatic multifactorial-frame as default?"
    quote: "I'd like to be expressing more thoughts via this kind of framework that I think might be a molecule in lexicon. ... I want to flesh out the functional surfaces of it so I can be prompted to think usefully with it more often (and probably eventually as a practiced default to automatic dualism). [User message 2026-05-14 — the operational goal that motivates this molecule's practice-default orientation.]"
canonical-instances:
  - "the canonical fire-shape: you're about to send a message containing 'is X actually [single-cause]?' — you pause, name the dualist cue, then re-write as 'what's the relative contribution of [factor1, factor2, factor3] to X, and how do they interact?'. The rewriting IS the molecule's typical output. With practice, the cue-detect-and-rewrite happens before the original sentence is finished forming"
  - "self-attribution context: you notice yourself thinking 'I'm just bad at X' — name the dualist cue (self-categorical labeling), pivot to multifactorial decomposition ('my performance at X varies with sleep, prior practice on this specific sub-skill, social context, motivational state, the specific task variant'). The pivot doesn't make you good at X — it makes the question itself more answerable and the next move more productive"
  - "interpersonal conflict context: you find yourself in a 'they're being unreasonable' frame — name the dualist cue (us-vs-them collapse), pivot to multifactorial decomposition ('what's the situation, the other person's likely model of it, the divergent priors, the structural pressures on each side, the missing communication'). The reframing doesn't excuse problematic behavior — it expands the action-space beyond 'be right vs concede'"
  - "decision-deliberation context: you're choosing between Option A and Option B and treating it as binary — name the dualist cue (constrained option-space), pivot to multifactorial decomposition ('what are the dimensions on which A and B differ, what's the credence on each dimension's importance, and are there hybrid options A' and B' or third options C, D that the binary framing is suppressing?'). This is the canonical 'consider three options' product-decision discipline applied as a multifactorial-frame instance"
  - "post-mortem context: a project ended badly and the team is converging on 'we shouldn't have done X' — name the dualist cue (success-failure collapse onto single cause), pivot to multifactorial decomposition of what worked, what didn't, what was orthogonal, what was lucky, what was unforced. The reframing recovers retrospective learning value that the dualist collapse would have lost"
  - "epistemological context: you encounter a 'side A is right, side B is wrong' framing of a contested empirical question — name the dualist cue, pivot to multifactorial assessment ('what are the specific sub-claims, what's the credence on each, where do the sides agree, where do they disagree, what evidence would update each direction'). Tetlock's fox-style cognition applied to politically-charged debates"
  - "operationally distinct from any single fire of lex-rfxtb: this molecule names the LOOP (cue → pivot → frame → next cue → pivot → frame...) intended to be run repeatedly. A one-off application of lex-rfxtb without the cue-detection front-end may produce a multifactorial analysis once but doesn't build the practice-default. The molecule's foundational aspect is the REPEATED FIRING across many situations over time — which produces the user's stated end-state (automatic multifactorial-default)"
  - "operationally adjacent to lex-e5des dialogical-vs-monological-belief-system: this molecule is dialogical in structure (it engages with new factor-inputs and updates the model); a monological version would produce the same multifactorial-frame regardless of new information. The dialogical property is what makes the practice-default DIFFERENT FROM a stylized 'always say it's complicated' tic"
  - "operationally distinct from lex-znaau premature-closure as standalone atom: premature-closure names the failure-mode; this molecule names the PRACTICE-LOOP that prevents premature-closure of the binary type. They're complementary: lex-znaau says 'don't close too soon'; lex-m2cwp says 'here's the specific cue-and-pivot routine to run when the would-be-premature closure is binary-shaped'"
  - "decisive operational note: this molecule is designed to be a HIGH-FIRING practice-default, not an occasional analytical pose. Per the , the success-state is automatic multifactorial-frame as default response to dualist-shaped prompts. This implies the molecule's evaluation criterion is FIRING FREQUENCY across diverse contexts, not depth-per-fire. A shallow fast fire that happens 50x/week is more valuable than a deep slow fire that happens 1x/month, because the practice-default-formation requires repetition"
status: active
