id: lex-c2bwy
name: hanlons-razor
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When attributing bad outcomes to malice, surface Hanlon's razor — incompetence, inattention, system-effects, and rushed decisions explain most apparent malice; reach for malice only after the simpler causes are ruled out."
related: [lex-jv983, lex-k6d7u, lex-rfxtb, lex-tjwfn, lex-vf5ff]
scaffolds-from: [lex-tjwfn, lex-rfxtb, lex-jv983]
evokes: [charity-default, malice-is-the-fluent-attribution, stupidity-prior-on-bad-behavior, before-conspiracy-try-incompetence, the-overestimated-protagonist-of-the-malicious-other]
lineage:
  - source: practitioner
    text: hanlon-1980-via-bloch-murphys-law-book-two
    citation: "Robert J. Hanlon, submission published in Arthur Bloch (ed.), Murphy's Law Book Two: More Reasons Why Things Go Wrong (Price/Stern/Sloan 1980), p.52. The canonical modern formulation. Biographical context per Quote Investigator (Garson O'Toole) 2016 'Quote Origin: Never Attribute to Malice That Which Is Adequately Explained by Stupidity' (https://quoteinvestigator.com/2016/12/30/not-malice/) drawing on Mardy Grothe's research: Hanlon was a computer programmer at the Tobyhanna Army Depot in Scranton, Pennsylvania; had read Bloch's 1977 Murphy's Law (Book One) and submitted his own concoction for the 1980 sequel volume. graduation. The maxim functions as a debugging prior on social-cognition: when you observe behavior that LOOKS malicious, the move is to entertain incompetence / inattention / mistaken-model / structural-pressure as defaults first, and only escalate to malice when those are demonstrably ruled out. NOTE: earlier listings were misleading — the 1977 first volume and 1991 Definitive Collection both LACK the Hanlon entry; only the 1980 Book Two specifically contains it."
    quote: "[Bloch (ed.), Murphy's Law Book Two: More Reasons Why Things Go Wrong, p.52:] 'HANLON'S RAZOR: Never attribute to malice that which is adequately explained by stupidity.' [The entry appears under the named-law-as-header format Bloch uses throughout the volume, sandwiched between HUNT'S LAW (p.52 above) and SYSTEMANTICS (p.53 below). No additional byline beyond the header attribution; the law is identified by Hanlon's name in the header per Bloch's editorial convention. This is the canonical 1980 first-print formulation of the maxim under its modern name; the formulation has since propagated essentially unchanged across decades of attribution.]"
  - source: practitioner
    text: heinlein-1941-logic-of-empire
    citation: "Robert A. Heinlein, 'Logic of Empire' (Astounding Science Fiction, March 1941; collected in The Green Hills of Earth 1951). Contains the precursor formulation: a character explicitly rejects malice-attribution in favor of stupidity-attribution, in language structurally identical to the later Hanlon formulation. Predates Hanlon's submission by ~39 years. The Heinlein attribution is the historically responsible primary; Hanlon is the name-on-the-maxim by submission convention, not by origin. The widely cited canonical formulation is 'You have attributed conditions to villainy that simply result from stupidity,' but page number and exact wording remain unverified against a printed primary, so no verbatim quote is claimed here."
  - source: practitioner
    text: hanlons-razor-mining-pass-1
    citation: "promoted from cross-attestation: software engineering (canonical debugging heuristic — 'the compiler is right, you are wrong'; most production incidents are misconfiguration / off-by-one / forgotten-edge-case, not sabotage; the post-mortem discipline of blameless-postmortems IS Hanlon's Razor institutionalized into engineering culture), product management ('assume good intent' as a standing team-norm — applies Hanlon's Razor to colleague behavior; the cost of malice-default is poisoned trust + slowed coordination), customer service ('the customer isn't lying, they have a different model' — the malice-default would treat a confused customer as adversarial; the Hanlon-default treats them as needing better information), diplomacy and arms-control (Cuban Missile Crisis: ExComm pushed toward malice-attribution of Soviet intent; Kennedy explicitly entertained the Soviet-uncertainty hypothesis and avoided escalation — a Hanlon-Razor instance at geopolitical scale), Bayesian-rationalist analysis (Hanlon's Razor is a prior-update heuristic: malice-attributing explanations have higher specificity but also higher Bayesian cost-of-being-wrong than incompetence-attributing explanations; the cost-asymmetry justifies the charity-default). Cross-domain attestation across SWE, PM, customer-success, diplomacy, rationalist-cognitive-science"
canonical-instances:
  - "post-incident review of a production outage: the on-call engineer's first instinct is 'someone changed X without telling us; was it on purpose to hurt the team?' — Hanlon's Razor says: more likely they pushed a fix Friday afternoon under deadline pressure, didn't realize the dependency, and the lack-of-notification was inattention not adversarial concealment. The blameless-postmortem norm operationalizes this: name the structural-pressure first, the person last"
  - "co-worker reads your Slack message and replies coldly: malice-default = 'they're angry at me / undermining me'; Hanlon-default = 'they're in the middle of something stressful, replied without context, didn't think about how it would land.' The Hanlon-default is right ~80% of the time; the malice-default is right ~5% of the time; the remaining ~15% is some mix of the two. The base rates justify the charity prior"
  - "customer service: customer files a bug report claiming the product 'doesn't work,' is rude in the ticket. Malice-default: 'they're trying to get refund leverage / are a difficult customer.' Hanlon-default: 'they used the product in a way the docs didn't cover, got frustrated, and are venting in the only channel available to them.' The Hanlon-default produces 'let me understand what you were trying to do' as the next move; the malice-default produces 'per the terms of service' as the next move. The first resolves; the second escalates"
  - "policy / regulatory analysis: faced with a piece of legislation that seems harmful, the analyst's choice is between 'lawmakers wrote this on behalf of harmful special interests' vs. 'lawmakers wrote this with insufficient analysis of downstream effects.' The malice-attribution can be correct, but the Hanlon-default forces the analyst to MODEL the policy-construction process first — which surfaces structural causes (committee-staffing, hearing-procedure, lobbying-incentives) that a malice-narrative would skip past. The policy-improvement leverage is in the structural causes, not in the malice"
  - "Cuban Missile Crisis (October 1962): ExComm transcripts show several officials interpreting Khrushchev's moves as deliberately escalatory / adversarial. Kennedy and McNamara repeatedly pushed toward 'what does this look like if we assume Khrushchev is operating under similar uncertainty and pressure to ours?' — the explicit Hanlon-Razor move at geopolitical scale. The de-escalation pathway opened because the malice-attribution was held in check. Allison's Essence of Decision (1971) frames this as the difference between Model I (rational-actor) and Model III (governmental-politics) — Model III explicitly assumes incompetence / fragmentation / structural-pressure can produce 'malicious-looking' moves that aren't"
  - "crucial critical question: how do you avoid Hanlon's Razor becoming a free pass for genuine bad actors? The maxim is a PRIOR, not a verdict — it shifts the burden of proof, but does not refuse to update. When evidence of malice accumulates (pattern of behavior, prior incidents, gain-from-the-harm-being-attributed), the prior gets overcome. Hanlon's Razor is a DEFAULT, not an unconditional belief. The misuse is treating it as 'never attribute malice' rather than 'attribute incompetence first, attribute malice when evidence forces it.' Compare lex-k6d7u credence-as-graded-belief — Hanlon's Razor is a prior, not a constraint on updating"
  - "cardinal critical question: when is Hanlon's Razor the WRONG move? In adversarial contexts (negotiation, litigation, organized fraud, hostile state actors), default-to-charity can be exploited. The maxim has a natural domain — interpersonal social cognition, routine workplace, customer service — where most actors are not adversarial. In domains where adversarial action is the BASE RATE (espionage, security analysis, financial fraud detection), the malice-prior may be appropriate. Naming the domain is part of deploying the maxim responsibly"
  - "operational complement to lex-tjwfn recursive-mind-simulation-shapes-self: lex-tjwfn names the apparatus by which agents simulate other minds. Hanlon's Razor is a CALIBRATION RULE for that apparatus — when the simulation produces a malice-attribution, slow down and consider the incompetence-attribution before locking in. Without this calibration, the recursive-mind-simulation apparatus systematically overproduces malice-attributions (because malicious-other has narrative coherence; incompetent-other doesn't generate a story). Hanlon's Razor is the corrective for the apparatus's own bias"
  - "operational adjacent to lex-rfxtb multifactorial-frame: multifactorial-frame says 'force-list three factors before settling on a single-cause explanation.' Hanlon's Razor is a SPECIAL CASE: when the salient single-cause is malice, the multifactorial enumeration MUST include incompetence / inattention / structural-pressure before the verdict is delivered. Multifactorial-frame is the general posture; Hanlon's Razor is the specific malice-vs-incompetence axis of it"
  - "operational adjacent to lex-jv983 fluency-trap: malice-attributions are FLUENT — they have a clear protagonist, a clear grievance, and a clean narrative. Incompetence / inattention / structural-pressure explanations are DISFLUENT — they require modeling a distributed causal field with no central actor. The fluency asymmetry means malice-attributions feel more compelling than they should; Hanlon's Razor is the corrective for the fluency bias in social cognition. The 'malice feels true because malice fits a story' pathway is the fluency-trap operating on interpersonal attribution"
critical-questions:
  - "how do you avoid Hanlon's Razor becoming a free pass for genuine bad actors? The maxim is a PRIOR, not a verdict — it shifts the burden of proof but does not refuse to update. When evidence of malice accumulates (pattern of behavior, prior incidents, gain-from-the-harm-being-attributed), the prior gets overcome. Misuse treats Hanlon's as 'never attribute malice' rather than 'attribute incompetence first, attribute malice when evidence forces it.'"
  - "when is Hanlon's Razor the WRONG move? In adversarial contexts (negotiation, litigation, organized fraud, hostile state actors), default-to-charity can be exploited. The maxim has a natural domain — interpersonal social cognition, routine workplace, customer service — where most actors are non-adversarial. In domains where adversarial action is the BASE RATE (espionage, security analysis, financial fraud detection), the malice-prior may be appropriate. Naming the domain is part of deploying the maxim responsibly."
  - "what is the structural-pressure third option, beyond malice and incompetence? The original Hanlon formulation is binary, but in practice the largest residual is neither — it's 'system pressures producing apparently-individual harm-shaped behavior.' The Friday-afternoon-deploy is not incompetent; it's structurally-produced. Treating Hanlon's as malice-vs-incompetence misses the third category; the full diagnostic asks all three before settling."
  - "is the actor in a position where competent-malice and competent-self-protection look similar? Whistleblowers, dissidents, and contrarians can be malice-attributed by institutions whose Hanlon-prior was abandoned. Discriminator: does the attribution serve the attributor's interest? If yes, Hanlon's may have been suspended precisely where it most needs to hold."
  - "does the maxim apply to GROUPS or only individuals? Coordinated action can look like collective-malice from outside while being decomposable into individual-incompetence + organizational-incentive on the inside. Allison's Model III (governmental-politics) explicitly diagnoses this. Group-level malice-attributions need extra scrutiny because the simplification ('they want X') hides the actual mechanism (no one wants X; the system produces X)."
status: active
