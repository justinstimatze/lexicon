canonical-instances:
  - "Hypothetical: A hiring rubric requires that the process work for any applicant pool (no candidate profile breaks it), respect a unanimous hiring-committee preference, keep a head-to-head ranking of two finalists stable regardless of which other candidates are in the pool, and give no single interviewer veto power. Each rule sounds like ordinary good practice; a committee that tries to satisfy all four at once, rather than assuming the list is self-evidently workable, discovers whether the four are actually compatible before building a process around the assumption that they are."
  - "Hypothetical: A distributed database's requirements list says: it must handle any network condition, never lose a write everyone agreed happened, keep a given pair of nodes' agreement independent of a third node's unrelated state, and have no single node able to force consensus alone. The CAP-theorem-adjacent shape of this list is exactly Arrow's: four properties that each look like baseline correctness, checked individually, rather than as a set that might rule out every possible protocol."
critical-questions:
  - "Doesn't real-world rule-making get by just fine without formally checking joint satisfiability -- isn't this an academic worry that rarely bites in practice? It bites exactly when the four conditions get treated as separate checklist items rather than as a system, which is the default way requirements get reviewed. The theorem's value isn't that every four-item wishlist is secretly impossible -- it's that impossibility is a live possibility a checklist review can't rule out, and only actually attempting joint satisfaction (or a proof) can."
  - "If no rule can satisfy all four conditions, does that mean every actual voting or aggregation method in use is broken? It means every method in use has quietly dropped or weakened at least one of the four -- majority rule gives up unrestricted domain, a dictatorship obviously gives up non-dictatorship, the rank-order method gives up independence of irrelevant alternatives. The theorem doesn't say collective choice is impossible; it says the tradeoff is unavoidable, and asks which condition a given method has chosen to sacrifice."
