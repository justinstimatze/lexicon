id: lex-98gdu
name: reviving-a-dead-systems-theory-from-documentation-alone-is-impossible
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When the team that understood a system is gone and someone proposes reconstructing that understanding purely from what got written down -- program text, specifications, design docs -- treat that as a stronger claim than it sounds like. Peter Naur's Theory Building View: a program's theory is the knowledge of how the system maps to the world it serves, why each part is built the way it is, and how to extend it to a new demand by recognizing similarity to what it already does. None of that gets fully captured in documentation, because it was never fully expressed in the first place -- it lived in the people who built it. Naur states the consequence directly: rebuilding that theory from documentation alone is strictly impossible. His prescribed alternative is blunt: discard the existing system and let a fresh team solve the problem from scratch, rather than attempt revival. He argues this isn't even more expensive -- building a new theory that fits and supports someone else's existing text is itself a difficult, frustrating, time-consuming activity, and the new team ends up torn between loyalty to the old text's obscurities and the different theory they're actually forming. Diagnostic move: before committing to 'reverse-engineer the old system from its docs,' ask whether anyone who held the original theory is still reachable -- if not, a rewrite may cost the same or less than a revival attempt while being more likely to actually work."
related: [lex-b2c6b, lex-nr8x9, lex-p54n2]
evokes: [peter-naur, programming-as-theory-building, ryle-knowing-how, theory-building-view, program-death-and-revival]
lineage:
  - source: primary
    text: naur-1985-revival-strictly-impossible
    citation: "Peter Naur, 'Programming as Theory Building' (Microprocessing and Microprogramming 15, 1985, pp.253-261), as reprinted in Alistair Cockburn, Agile Software Development (Addison-Wesley, 2002), Appendix B 'Naur, Ehn, Musashi,' section 'Program Life, Death, and Revival,' p.235."
    quote: "“A very important consequence of the Theory Building View is that program revival, that is reestablishing the theory of a program merely from the documentation, is strictly impossible.”"
  - source: primary
    text: naur-1985-discard-and-rebuild-preferred
    citation: "Peter Naur, 'Programming as Theory Building' (Microprocessing and Microprogramming 15, 1985, pp.253-261), as reprinted in Alistair Cockburn, Agile Software Development (Addison-Wesley, 2002), Appendix B 'Naur, Ehn, Musashi,' section 'Program Life, Death, and Revival,' p.235."
    quote: "“In preference to program revival, the Theory Building View suggests, the existing program text should be discarded and the new-formed programmer team should be given the opportunity to solve the given problem afresh. Such a procedure is more likely to produce a viable program than program revival, and at no higher, and possibly lower, cost.”"
canonical-instances:
  - "The direct textual anchor, on why the new team can't simply inherit the old theory even with full access to the old text: “The new programmer is likely to feel torn between loyalty to the existing program text, with whatever obscurities and weaknesses it may contain, and the new theory that he or she has to build up, and which, for better or worse, most likely will differ from the original theory behind the program text.”"
  - "Hypothetical: a 15-year-old billing system's only two engineers retire in the same year, leaving behind a wiki, inline comments, and a 40-page design spec. Management assigns a new team to study the documentation and take over maintenance. Eighteen months in, the team can ship small, well-tested changes, but every attempt at a structural change produces regressions the tests didn't catch, because the docs describe what the system does, not the specific real-world exceptions and workarounds the original team held in their heads and never wrote down."
critical-questions:
  - "Naur's own case studies (the compiler passed from group A to group B, the real-time monitoring system) both involve full documentation PLUS direct personal contact and advice from the original team, and even that combination left real gaps. Does the claim generalize to the weaker, more common case -- documentation with zero remaining contact with anyone from the original team -- or does Naur's evidence actually only establish a milder claim, that documentation-plus-guidance is insufficient, leaving open whether documentation alone might do better or worse than that?"
  - "If revival from documentation is strictly impossible, what is a new team's own emerging theory actually built FROM, if not partly from reading the old documentation and old code alongside forming their own understanding? Is 'impossible' doing real work here, or is Naur really describing a matter of degree -- documentation contributing real but insufficient raw material -- dressed as an absolute?"
status: active
