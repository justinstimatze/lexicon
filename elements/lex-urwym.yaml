lineage:
  - source: primary
    text: kuhn-1962-1970-structure-of-scientific-revolutions
    citation: "Thomas S. Kuhn, *The Structure of Scientific Revolutions* (Univ. Chicago Press, 1st ed. 1962; 2nd ed. with Postscript 1970; 4th ed. with introduction by Ian Hacking 2012). Section I (Introduction: A Role for History) names the central claim that `incommensurable ways of seeing the world` differentiate competing approaches even when both are `scientific.` Section IV (Normal Science as Puzzle-Solving) describes normal-science as `a strenuous and devoted attempt to force nature into the conceptual boxes supplied by professional education.` Section V (The Priority of Paradigms) frames the relation of paradigm to community. Sections VI–VIII develop anomaly + crisis + the community's response. The 1969 Postscript (added in 1970 ed.) softens the strong-incommensurability reading and introduces the disciplinary-matrix terminology that addresses the `paradigm` polysemy criticism. Cross-scholarship: Lakatos 1970 (`Falsification and the Methodology of Scientific Research Programmes` in Lakatos + Musgrave eds. *Criticism and the Growth of Knowledge*) extends and constrains Kuhn by introducing the progressive/degenerating research-programme distinction; Laudan 1977 *Progress and Its Problems* shifts the unit-of-analysis from paradigms to problem-solving traditions; Feyerabend 1975 *Against Method* radicalizes the incommensurability claim; Polanyi 1958 *Personal Knowledge* + 1966 *The Tacit Dimension* contributed the tacit-knowledge-in-scientific-traditions theme that Kuhn drew on."
    quote: "[Kuhn 1962/1970, Introduction (Section I) p.4 + Section IV p.5 of the pagination Vol. II No. 2 (PDF p.16-17): the central passages for transferable lex-urwym:] 'What differentiated these various schools was not one or another failure of method— they were all `scientific`—but what we shall come to call their incommensurable ways of seeing the world and of practicing science in it... When examining normal science in Sections III, IV, and V, we shall want finally to describe that research as a strenuous and devoted attempt to force nature into the conceptual boxes supplied by professional education... Normal science, the activity in which most scientists inevitably spend almost all their time, is predicated on the assumption that the scientific community knows what the world is like. Much of the success of the enterprise derives from the community's willingness to defend that assumption, if necessary at considerable cost. Normal science, for example, often suppresses fundamental novelties because they are necessarily subversive of its basic commitments. Nevertheless, so long as those commitments retain an element of the arbitrary, the very nature of normal research ensures that novelty shall not be suppressed for very long. Sometimes a normal problem, one that ought to be solvable by known rules and procedures, resists the reiterated onslaught of the ablest members of the group within whose competence it falls. On other occasions a piece of equipment designed and constructed for the purpose of normal research fails to perform in the anticipated manner, revealing an anomaly that cannot, despite repeated effort, be aligned with professional expectation. And when it does—when, that is, the profession can no longer evade anomalies that subvert the existing tradition of scientific practice—then begin the extraordinary investigations that lead the profession at last to' [a new paradigm, in Kuhn's terminology — the gestalt-switch.] [Practitioner-extraction for transferable lex-urwym: the structural primitive is the three-part NORMAL → ANOMALY-ACCUMULATION → GESTALT-REPLACEMENT loop, where paradigm-defense is the community's default and replacement (not extension) is the resolution mode under sufficient anomaly pressure. The transferable diagnostic is that paradigm-shift is structurally distinct from feature-extension; communities run into this transition at multiple layers (scientific paradigms, software architectures, ML model families, personal belief structures, political-philosophy regimes) and conflating extension with replacement leads to the Ptolemaic-epicycles failure mode.]"
  - source: cross-attestation
    text: cross-domain-paradigm-replacement-under-crisis
    citation: "Cross-domain attestation that the structural primitive — community-level shared-framework accumulates anomalies until crisis forces gestalt-replacement rather than incremental extension — recurs across (a) philosophy of science and history of science, (b) software engineering / database / ML architecture transitions, (c) developmental psychology, (d) personal-belief restructuring, (e) political-philosophy regime change, and (f) artistic-movement transitions. SOURCES: Imre Lakatos 1970 'Falsification and the Methodology of Scientific Research Programmes' in Lakatos + Musgrave eds. *Criticism and the Growth of Knowledge* (Cambridge UP) — research-programmes degenerate when their `protective belt` accumulates ad-hoc patches faster than the `hard core` generates novel predictions; the degenerating-vs-progressive distinction is the operational signal for paradigm-replacement candidacy. Larry Laudan 1977 *Progress and Its Problems: Towards a Theory of Scientific Growth* (Univ. California Press) shifts from paradigms to problem-solving traditions and reformulates the replacement-criterion in terms of empirical + conceptual problems solved. Michael Polanyi 1958 *Personal Knowledge* + 1966 *The Tacit Dimension* (Univ. Chicago Press) provide the tacit-knowledge-in-traditions theme Kuhn drew on. Paul Feyerabend 1975 *Against Method* (NLB / Verso) radicalizes the incommensurability claim. Joel Spolsky 2000 'Things You Should Never Do, Part I' (Joel on Software essay) — the canonical software-engineering treatment of the Big Rewrite as paradigm-replacement decision; Spolsky's diagnostic is that rewrite-vs-refactor is a structural choice, not a stylistic preference. Frederick Brooks 1995 *The Mythical Man-Month* anniversary edition Ch. on `the second-system effect` overlaps — the second system tends to be the architects' attempted paradigm-replacement and often fails to inherit normal-science discipline. Jean Piaget developmental-stage theory (Piaget 1936/1952 *The Origins of Intelligence in Children* + 1955/1958 *The Growth of Logical Thinking from Childhood to Adolescence* with Inhelder) — concrete-operational → formal-operational is a gestalt-shift at the cognitive layer, not incremental skill accretion; the developmental-psychology literature has documented domain-by-domain replacement-not-extension structure. William James 1902 *Varieties of Religious Experience* Lectures IX–X on conversion — the gestalt-shift of religious-belief restructuring is the personal-level analog. Across these domains, the same structural pattern recurs."
    quote: "Across Lakatos 1970 (research-programmes degenerate when ad-hoc patches accumulate faster than novel predictions; the degenerating-vs-progressive distinction operationalizes paradigm-replacement candidacy), Laudan 1977 (problem-solving traditions as the replacement unit; empirical + conceptual problems as the metric), Polanyi 1958/1966 (tacit-knowledge-in-traditions), Feyerabend 1975 (radical incommensurability), Joel Spolsky 2000 'Things You Should Never Do, Part I' (the Big Rewrite as paradigm-replacement decision in software engineering; rewrite-vs-refactor is structural not stylistic), Brooks 1995 second-system effect (the second-system as attempted paradigm-replacement that often fails to inherit normal-science discipline), Jean Piaget developmental-stage theory (concrete-operational → formal-operational as gestalt-shift, not incremental skill accretion; replacement-not-extension at the cognitive layer), and William James 1902 Varieties Lectures IX–X on conversion (personal-belief gestalt-shift), the same structural pattern recurs: a community (or individual) operating under a shared framework accumulates anomalies until pressure forces gestalt-replacement rather than incremental extension. The transferable diagnostic: when a paradigm shows patch-after-patch accumulation, the next move is structurally one of two kinds — extend the prior frame (normal-science work) or replace it (paradigm-shift work) — and conflating these leads to the Ptolemaic-epicycles failure mode."
canonical-instances:
  - "Kuhn's central case (Sec V–VIII): Copernican-Ptolemaic transition. Ptolemaic system absorbed observed-discrepancies via epicycles for ~1400 years; eventually the patch-count exceeded the explanatory load, and the gestalt-shift to a sun-centered frame was a paradigm-replacement, not an extension. The shift was not `Ptolemaic-with-better-numbers` — it was a different conceptual frame for which heliocentric data made different sense."
  - "Phlogiston → oxygen chemistry (Lavoisier 1789): phlogiston theory accumulated workarounds for combustion phenomena; Lavoisier's oxygen frame was gestalt-replacement, not extension. Kuhn's other central example."
  - "Software's `Big Rewrite` (Spolsky 2000): a codebase that has accumulated workarounds + special cases until the architecture-as-paradigm is showing strain. Spolsky's caution is that rewrite is structurally riskier than continued extension (loses tacit knowledge embedded in the patches); but when patch-count exceeds base-functionality, replacement may be the structural answer. The diagnostic for choosing is paradigm-shift discipline applied at the architecture layer."
  - "ML architecture transitions (HMM → RNN → LSTM → Transformer): each generation is paradigm-replacement at the model-family layer, not extension. Transformer's attention mechanism is not RNN-with-tweaks; the conceptual frame differs (sequence-parallel vs. sequence-recurrent), and the practitioner-community had to learn new exemplars."
  - "Database engine transitions (relational → key-value → document → vector): each new model is not a feature-add over the prior; the conceptual frame for `what counts as a query` shifts. The practitioner-community at each transition runs the paradigm-replacement decision."
  - "Piaget developmental stages (concrete-operational → formal-operational): the child's cognitive structure undergoes gestalt-shift, not skill-accretion. Same conceptual primitives don't map cleanly across the transition; new exemplars (hypothetical reasoning, propositional logic) operate in the new frame."
  - "Personal conversion experience (William James 1902 Varieties Lectures IX–X): the religious or philosophical conversion is structurally gestalt-replacement, not incremental belief-update. Practitioners on either side don't translate the same vocabulary the same way."
  - "operationally distinct from lex-h8t7s qualitative-progress-requires-destruction-of-prior-structures (Schumpeter): Schumpeter is the economic-process primitive at the industrial layer; this atom is the epistemic-community primitive at the knowledge-structure layer. Compose — economic creative-destruction often co-occurs with paradigm-replacement in the knowledge-structures the displaced industries embodied."
  - "operationally distinct from lex-hsnup self-critique-against-explicit-rule-set-then-revise: self-critique improves output WITHIN a paradigm; this atom names the move to REPLACE the paradigm itself under crisis. Different layer of action."
  - "operationally distinct from lex-da3g3 iteration: iteration is normal-science puzzle-solving WITHIN a paradigm; this atom names what happens at the paradigm-shift layer when iteration reaches its bound."
critical-questions:
  - "Is the field's accumulating-workaround signal at the level of normal-science puzzle-solving (extend) or at the level of paradigm-strain (replace)? Practitioner-discipline: count the patches; estimate the patch-vs-base-explanatory-load ratio; assess whether the community is starting to articulate the prior frame as inadequate. The Lakatos diagnostic (research-programme degenerating: ad-hoc patches outpacing novel predictions) operationalizes this."
  - "Are the proposed new approach's terms commensurable with the prior, or partially incommensurable? Practitioner-discipline: try to translate the key concepts both ways; identify what doesn't translate. Partial incommensurability is the marker of paradigm-shift candidacy; full commensurability is normal-science work."
  - "Is the practitioner community ready to accept the gestalt-switch? Practitioner-discipline: paradigm-shift requires community-level adoption, not just an individual conviction. Identify the gatekeepers, the journals, the textbooks, the conferences — and assess the velocity of replacement signal. Kuhn's claim that older practitioners often never accept the new frame and the discipline shifts as they retire (`science advances one funeral at a time`, attributed to Planck) is the demographic operationalization."
  - "Will the new paradigm solve the SAME puzzles or DIFFERENT puzzles? Practitioner-discipline: Kuhn's specific claim is that paradigm-replacement shifts the puzzle-set; the new frame is not `the same problems solved better.` Beware of evaluating the new paradigm by the old's metrics — that's the incommensurability point."
  - "When you yourself are inside a paradigm under strain, can you distinguish your defense of the paradigm from a structural commitment to its replacement-candidate? Practitioner-discipline: introspect the community's paradigm-defense reflex applies to YOU too; the question to ask is whether the patches you're proposing extend the frame coherently or accumulate special cases that survive only by ad-hoc protection."
  - "Has the term `paradigm-shift` been over-applied to merely-incremental change? Practitioner-discipline: paradigm-replacement requires actual incommensurability + community-level frame change; not every exciting new result is a paradigm-shift. The over-application of Kuhnian language degrades its diagnostic power; gate the term."
status: active
