id: lex-rfxtb
name: multifactorial-frame
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When asked 'why did X happen?', force-list at least 3 contributing factors before committing. Single-cause explanations are usually 'this single factor was the proximate trigger of a multi-factor outcome' — and miss the substrate."
