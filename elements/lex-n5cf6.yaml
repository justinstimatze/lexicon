id: lex-n5cf6
name: extreme-proxy-values-leave-region-where-proxy-goal-link-was-measured
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When optimization pushes a proxy M into the tail of its observed range, you have moved into a region where the proxy-goal relationship was not directly observed and may not hold. This is EXTREMAL Goodhart in Manheim-Garrabrant's typology — the failure mode of out-of-sample prediction applied to selection on a proxy. Two distinct mechanisms produce it. (1) MODEL INSUFFICIENCY: the proxy-goal relationship was approximated with a model (often deliberately simplified) that was accurate in the observed region but is wrong outside it — e.g., a linear approximation of a nonlinear relationship that becomes inaccurate at the extremes. (2) REGIME CHANGE: the proxy-goal relationship is genuinely different in different regions of the state space — a separate generative process governs the extreme region, and selection on the proxy pushes the system across that boundary. Both produce the same observable: the metric saturates or moves favorably while the goal stops moving (or moves adversely). Transferable: any time you select a proxy based on relationships observed in a baseline region and then apply enough optimization pressure to push past that region, you should expect the relationship to deteriorate or break. Distinct from regressional Goodhart (lex-hbknh): regressional bites even inside the observed region, on the inevitable noise-selection effect. Extremal Goodhart requires moving OUTSIDE the observed region (whether through approximation error or genuine regime shift). Distinct from causal Goodhart (lex-m4ztd): extremal does not require regulator INTERVENTION in the causal structure — selection pressure alone is sufficient to push the system out of the regime where the proxy was validated. The fix is range-restriction (don't push past the observed range), held-out validation in the extrapolation region before deployment, or explicit modeling of the regime-change boundary."
related: [lex-spm8x, lex-5yufs, lex-ewafs, lex-tb3re, lex-hbknh, lex-m4ztd, lex-nbk6e, lex-qb3zf, lex-asu3y, lex-ry4x3, lex-cqvnu]
