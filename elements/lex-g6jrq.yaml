evokes: [boat-handling-under-power, spring-line, forespring, pivot-point, turning-forespring, springing-into-a-berth, constrain-one-degree-of-freedom, fix-a-point-to-gain-control]
lineage:
  - source: primary
    text: mellor-1993-boat-handling-under-power
    citation: "John Mellor, Boat Handling Under Power: A Motorboat and Yacht Owners' Guide (Sheridan House, 1993 pbk. ed., orig. 1988), Chapter 6 (Working with Warps and Springs), 'Springing out of a Berth' and 'Springing the Stern Off.'"
    quote: "'If we consider the many forces that we can bring to bear for the purpose of moving or turning a boat under power -- wind, stream, propeller thrust, slipstream, paddlewheel effect and so on -- and imagine the effects of these forces acting around a fixed pivot point like a very powerful lever, it should be apparent that by securing one point of the boat to the shore or seabed we can add a whole new dimension to the business of manoeuvring in tight spaces. [...] The essence of this is to hold the bow firmly with the forespring (a line from the bow aft) so that it cannot move ahead. Force exerted on the shoreward quarter of the boat will then cause the stern to swing round away from the wall. [...] The pivot point must be right for'ard so that the whole length of the boat can swing round it. If it is brought aft, turning effect will cause the bow to move in as the stern goes out. If the bow is prevented from moving in by the wall, it will not be possible to swing the stern out, however much thrust is applied to it.'"
canonical-instances:
  - "A woodworker clamps one edge of a board to the bench before routing the opposite edge freehand -- the clamp doesn't add cutting force, it removes the board's freedom to slide, so the same hand pressure that would have skittered the router now produces a controlled cut."
  - "A negotiator pins one term of a deal as non-negotiable early ('the closing date is fixed') before applying pressure on the remaining terms -- the same push for concessions that would otherwise scatter across every variable now concentrates into movement on the terms left open, because one point is no longer available to give."
  - "A gymnast or climber sets one hand or foot as a fixed anchor point before shifting body weight -- the resulting motion becomes a controlled pivot around that anchor rather than an uncontrolled swing, and moving the anchor point (higher, lower, wider) retunes how much rotation versus translation the same push produces."
critical-questions:
  - "Does a genuinely fixed anchor point exist to pin against, one that can actually hold weight without giving? Mellor's technique depends on the dock or seabed being truly immovable -- attempting the same move against a point that can itself shift (a loose piling, an unstable counterparty position, a clamp that isn't actually secure) converts a controlled-rotation problem back into an unpredictable one, now with an added false sense of control."
  - "Is the anchor point's placement actually chosen, or just wherever a line happened to reach? Mellor's whole second principle treats pivot placement as a tunable parameter that sets the rotation/translation ratio directly -- treating the fixed point as incidental wastes the technique's real leverage."
  - "Is the direction of the residual free motion (rotation, in Mellor's case) actually the one you want controlled? Pinning a point only helps if the resulting constrained motion is the useful one -- fixing the wrong point can just as easily convert a controllable slide into an uncontrollable spin."
