id: lex-6xw55
name: same-text-in-different-context-is-a-different-work
type-in: situation
type-out: claim
_tier: atomic
status: active
agent-instruction: "Recognize this when a string of marks (a paragraph, a code block, a quote, a slogan, a melody, a gesture) is being treated as carrying its meaning self-sufficiently in the marks themselves — and the context of utterance is taken to be inert background. Borges's transferable claim through Pierre Menard: the same verbal sequence written by Cervantes in 1602 and written word-for-word by a 20th-century French symbolist (Menard) are not the same work. They have different authors, different contemporaneous philosophical worlds, different historical surrounds, different rhetorical commitments, and therefore different meaning — even though the orthography is identical. Borges's narrator illustrates with the line 'truth, whose mother is history': in Cervantes's pen this is a rhetorical commonplace from an old soldier; in Menard's pen (contemporary with William James and the philosophy of history) it is an 'audacious' philosophical idea staked out for-or-against pragmatism. The marks are identical; the works are not. Diagnostic use: when two utterances/texts/code-blocks look identical and someone is claiming they are the same — or when an old text is being read 'in the original' as if context were absent — ask what the context of utterance is doing that the marks alone cannot do. The corollary is the reading move: the same canonical text in a new historical position IS a new work, and reading it as one's contemporary is a productive distortion, not a mistake. Transferable applications: (a) code-review and code-archaeology — the same function-body written by different developers at different repo-states means something different (the context of review-norms, surrounding modules, in-flight feature work, declared intent of the PR carry semantic load the syntax does not); a copy-paste of a working snippet into a new file may not be the same code-as-work; (b) translation and adaptation — a translation is not a reproduction; even a 'word-for-word' translation produces a different work because target-language conventions, target-reader background, and translation-publication date are constitutive of meaning; (c) sampling and cover-songs in music — Coltrane's 'My Favorite Things' is not the Rodgers-Hammerstein song-as-show-tune; the harmonic context of post-1960 jazz is constitutive; (d) quoted passages — a quotation extracted into a new context is not the same utterance (operationally distinct from lex-jud2d metonymy, which is about substituted-aspect, not context-of-utterance); (e) reception aesthetics and hermeneutics — Jauss/Iser/Gadamer's horizon-of-expectations: the same Goethe text reads differently in 1850 vs 1920 vs 2025 not because the reader is mistaken but because the work IS the marks-plus-the-reading-situation; (f) reading old philosophy/scripture/code in modern light — the productive reading is not naïve original-meaning-reconstruction nor pure anachronism but the explicit recognition that what one is reading IS a different work when read here; (g) AI training corpora — the same document tokenized in 2018 vs 2026 is different training data because the surrounding co-occurrence statistics, the prompt-format conventions, and the audit/RLHF practices that follow constitute different contexts of training-as-utterance; (h) brand-utterance/PR and social media — a corporate statement that was anodyne in 2010 may be inflammatory in 2026 not because the words changed but because the discourse-context did, and a re-issued boilerplate IS a new utterance (and is correctly judged as one); (i) legal precedent — the holding of a 1925 case re-cited in a 2025 brief functions as a different argumentative move because the doctrinal surround has shifted; the citation IS new even when the language is identical; (j) science replication — running the 'same' experiment a generation later with different instrumentation, ambient theory, and population is not a pure replication; the context of the run is constitutive (composes with lex-b6kvs randomization-controls-for-unknown-confounders-that-no-other-design-can-address + lex-3d2he classification-gaps-generate-falsifiable-existence-predictions). Distinct from lex-7aqqb framing-of-question-fixes-ontology-of-inference (lex-7aqqb is about how the QUESTION framing changes which categories are countable; lex-6xw55 is about how the CONTEXT of utterance changes meaning even with identical question-framing). Distinct from lex-sp7fa every-framing-highlights-some-aspects (lex-sp7fa is about the lossy character of any framing; lex-6xw55 is about the constitutive character of context-of-utterance specifically). Distinct from lex-jud2d metonymy (substitution of part-for-whole; lex-6xw55 is identical-text-in-different-contexts). Distinct from lex-22kep hermeneutical-injustice (lex-22kep is about collective interpretive-resource gaps; lex-6xw55 is about context-of-utterance constituting meaning). Distinct from lex-3656j social-construction (lex-3656j is the institutional production of taken-for-granted categories; lex-6xw55 is the localized claim that any single utterance's meaning includes its context-of-utterance). Distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition (lex-y2tbg is about the constitutive role of repeated PERFORMANCE; lex-6xw55 is about the constitutive role of CONTEXT around an utterance). Counter-move: when identical text is being treated as identical work, name the context-of-utterance; ask what role-relations, doctrinal surround, historical position, or institutional embedding the original utterance carried that the new occurrence does not — or carries differently. When old text is being read 'straight,' name that the reading IS a new work and the productive question is what this work does, here, now."
