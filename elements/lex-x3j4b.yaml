    text: schneier-2015-data-and-goliath
    citation: "Bruce Schneier, *Data and Goliath: The Hidden Battles to Collect Your Data and Control Your World* (New York: W.W. Norton & Company, 2015). The book's own organizing argument (Introduction) states the critical claim directly: today's technology gives governments and corporations 'robust capabilities for mass surveillance,' and 'ubiquitous mass surveillance is fundamentally different from just a lot of individual surveillance, and it's happening on a scale we've never seen before' (Ch.3 is devoted to this claim). Chapter 2 ('Data as Surveillance') traces how declining computing costs convert surveillance from a scarce, expensive, targeted tool (following one suspect at roughly $175,000/month in agent salaries) into a near-zero-marginal-cost, comprehensive one (GPS/cell-tower tracking, license-plate scanners, facial recognition), producing what Schneier calls 'not just a difference in price' but 'a difference in kind' — the shift from 'follow that car' to 'follow every car.' Chapter 3 ('Analyzing Our Data') supplies the aggregation mechanism: mass-surveillance reporting focuses on data COLLECTION, but 'the real story is how the different streams of data are processed, correlated, and analyzed' — cross-referencing independently-mundane data sets (license-plate scans, facial recognition, tagged photos, purchase records, metadata) produces a 'much more powerful surveillance platform' than any one stream could, and 'ubiquitous surveillance is the result of multiple streams of mass surveillance tied together.' Chapter 7 ('Political Liberty and Justice') grounds the chilling-effect claim: awareness of possible surveillance narrows speech, association, and thought independent of whether any specific person's data is ever reviewed or acted upon — Schneier cites Sotomayor's concurrence in United States v. Jones (2012), Human Rights Watch and PEN America studies of post-Snowden journalist and writer self-censorship, a Pew/Harris finding that roughly half of Americans changed what they researched and discussed because of NSA surveillance, and a 2014 UN High Commissioner for Human Rights report that 'even the mere possibility of communications information being captured creates an interference with privacy, with a potential chilling effect.' Schneier explicitly frames this as an extension of Bentham's panopticon to internet-and-society scale. He adds two further, less commonly cited harms: a third-party/societal harm (silencing one person's dissent deprives society broadly of a benefit, whether or not any given bystander is personally chilled) and a norm-evolution-blocking harm (comprehensive, non-selective enforcement forecloses the historical process by which tolerated-but-illegal behavior gradually becomes legal). Chapters 4 and 6 supply the business-model/institutional context this atom treats as necessary background rather than its own separate claim: personalized advertising and the data-broker industry (Ch.4) generate the corporately-collected data streams that feed a 'public-private surveillance partnership' (Ch.6) in which governments access commercially-collected data, which is Schneier's structural explanation for why the aggregation/correlation mechanism operates at the scale it does."
    quote: "[Introduction, the book's own condensed statement:] 'Today's technology gives governments and corporations robust capabilities for mass surveillance. Mass surveillance is dangerous. It enables discrimination based on almost any criteria: race, religion, class, political beliefs. It is being used to control what we see, what we can do, and, ultimately, what we say. It is being done without offering citizens recourse or any real ability to opt out, and without any meaningful checks and balances. It makes us less safe. It makes us less free... We need to fix that, and we need to do it very soon.' [Introduction, on ubiquity vs individual surveillance, the pivotal distinction:] 'This is ubiquitous mass surveillance... Ubiquitous mass surveillance is fundamentally different from just a lot of individual surveillance, and it's happening on a scale we've never seen before.' [Introduction, naming the specific harms of government surveillance, previewing Ch.7:] 'Potential harms include discrimination and control, chilling effects on free speech and free thought, inevitable abuse, and loss of democracy and liberty.' [Ch.2 'Data as Surveillance,' the cost-collapse-into-a-difference-in-kind claim:] 'The result of this declining cost of surveillance technology is not just a difference in price; it's a difference in kind... It's not \"follow that car\"; it's \"follow every car.\" Police could always tail a suspect, but with an urban mesh of cameras, license plate scanners, and facial recognition software, they can tail everyone—suspect or not... For the first time in history, governments and corporations have the ability to conduct mass surveillance on entire populations... Even the East Germans couldn't follow everybody all of the time. Now it's easy.' [Ch.2, invoking and extending Bentham/Foucault's panopticon explicitly:] 'Jeremy Bentham's key observation in conceiving his panopticon was that people become conformist and compliant when they believe they are being observed. The panopticon is an architecture of social control... On the Internet, surveillance is ubiquitous. All of us are being watched, all the time, and that data is being stored forever. This is what an information-age surveillance state looks like, and it's efficient beyond Bentham's wildest dreams.' [Ch.3 'Analyzing Our Data,' the aggregation/correlation claim, the key 'not collection but correlation' point:] 'News stories about mass surveillance are generally framed in terms of data collection, but miss the story about data correlation: the linking of identities across different data sets to draw inferences from the combined data... Ubiquitous surveillance is the result of multiple streams of mass surveillance tied together.' [Ch.2, the Stanford metadata experiment demonstrating aggregation's power from individually-innocuous streams:] 'That's a multiple sclerosis sufferer, a heart attack victim, a semiautomatic weapons owner, a home marijuana grower, and someone who had an abortion, all from a single stream of metadata... Metadata can be much more revealing than data, especially when collected in the aggregate... when you have an entire population under surveillance, the metadata is far more meaningful, important, and useful.' [Ch.7 'Political Liberty and Justice,' the chilling-effect section, independent-of-review claim:] 'Surveillance has a potentially enormous chilling effect on society... Awareness that the Government may be watching chills associational and expressive freedoms [Sotomayor, U.S. v. Jones, 2012]... A 2014 report from the UN High Commissioner on Human Rights noted, \"Even the mere possibility of communications information being captured creates an interference with privacy, with a potential chilling effect on rights, including those to free expression and association.\"... A broader Harris poll found that nearly half of Americans have changed what they research, talk about, and write about because of NSA surveillance.' [Ch.7, the third-party/societal-harm point:] 'This is one of the main reasons all of us should care about the emerging architecture of surveillance, even if we are not personally chilled by its existence. We suffer the effects because people around us will be less likely to proclaim new political or social ideas, or act out of the ordinary. If J. Edgar Hoover's surveillance of Martin Luther King Jr. had been successful in silencing him, it would have affected far more people than King and his family.' [Ch.7, the norm-evolution-blocking argument:] 'If the old laws could have been perfectly enforced through surveillance, society would never have reached the point where the majority of citizens thought those things were okay. There has to be a period where they are still illegal yet increasingly tolerated, so that people can look around and say, \"You know, that wasn't so bad.\"... The perfect enforcement that comes with ubiquitous government surveillance chills this process.' [Introduction, on the business-model/institutional context, previewing Ch.4 and Ch.6:] 'Chapter 4 talks about business models of surveillance, primarily personalized advertising. An entire data broker industry has sprung up around profiting from our data... Corporations and governments alike have an insatiable appetite for our data, and I discuss how the two work together in Chapter 6. I call it a \"public-private surveillance partnership.\"'"
