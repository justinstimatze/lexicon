id: lex-u4uve
name: a-role-can-flip-its-own-earlier-doubt-norm-into-a-display-requirement
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A role can train a person into one display norm and then, at a later stage of the SAME role, explicitly train them out of it — not because the underlying uncertainty has changed, but because a new audience now reads the old, sanctioned display as a different kind of signal. Fox's third-year Cornell students, freshly taught in their first two years that admitting doubt is the mark of a good student (see the peer-and-faculty norm that punishes overconfidence), are now told the opposite by a supervising instructor: '\"You boys are to handle the case as you see best. I put no restrictions on you from this point of view. You do the work-up, decide what's to be done, and whatever you decide is all right. But I insist on this much — you must stand up for your decisions, never apologize for what you are doing, and never start getting humble and say you don't know...\"' The reason is a second audience the earlier training never had to answer to: the patient. 'To say that the patient \"searches your face\" for clues is no overstatement. An example — while on OB, when trying to palpate a baby once, I got a little confused and frowned in puzzlement. Sensed at once that the mother saw the frown and was alarmed.' The visible doubt that a classmate or professor reads as appropriate humility, a frightened patient reads as danger. This is narrower than generic impression management or front-stage performance (Merton and Goffman's broader claim that all social interaction is an audience-managed performance of self, see the sibling atom on that) — the specific claim here is that the SAME PERSON, in the SAME ROLE, is deliberately retrained to flip a display rule they had just finished internalizing, at a dateable transition point, because a new stakeholder has entered the audience whose read of the display differs from the old audience's. It is not that the person learns to perform for an audience in general; it is that they must learn WHICH stage of their own career's earlier lesson to unlearn, and when. Diagnostic move: when a professional's outward display of confidence seems to contradict what you'd expect from their years of training in humility or intellectual honesty, check whether a new audience has entered the room whose stakes in the display differ from the old audience's — the flip may be a deliberate, taught adjustment to a changed audience rather than a lapse in the earlier training or a personal character flaw."
