id: lex-ysh6p
name: status-transactions-are-paired-rises-and-falls
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when someone raises their own status (announces good news, claims credit, displays competence) and is confused or hurt that the listener seems less pleased than expected — or when choosing how to deliver bad news about yourself to someone you want to put at ease. Johnstone's 'see-saw' principle: status moves are structurally paired, not independent events. 'I go up and you go down.' Walk into a dressing-room and say 'I got the part' and everyone will congratulate you, but will feel lowered. Say 'They said I was too old' and people commiserate, but cheer up perceptibly. Telling someone something nice about yourself is 'usually a little like kicking them' — even when delivered warmly and received with genuine congratulation, a status-rise for the speaker is, structurally, a status-fall for the listener, and both effects can be true at once. The mechanism has a clean exception: identification. When you identify with the person being raised or lowered — you sit on THEIR end of the see-saw — their rise feels like your own rise, not your fall: a person who claims status through a famous acquaintance feels raised when that acquaintance is, and 'an ardent royalist won't want to see the Queen fall off her horse.' Practical corollary Johnstone teaches directly: the see-saw gives you two equivalent moves for the same effect — you can raise yourself ('I smell beautiful') or lower the other party ('You stink') to widen the same status gap, and skilled operators (and playwrights) alternate between raising-self and lowering-other across successive lines rather than only ever doing one, because pure runs of either move read as flat. Practitioner move: before delivering self-elevating news, predict the paired effect on the listener and choose your delivery accordingly (self-deprecating framing, or explicit efforts to raise the listener alongside yourself) unless the listener is someone who identifies with your success, in which case the see-saw doesn't apply and you can be direct."
related: [lex-pn8qn, lex-qukkg, lex-pwhsd]
scaffolds-from: [lex-qukkg]
evokes: [see-saw-principle-in-status-play, telling-good-news-about-yourself-lowers-the-listener, identification-suspends-the-see-saw, kings-surrounding-themselves-with-dwarfs-for-contrast, alternating-raise-self-lower-other-in-dialogue]
lineage:
  - source: primary
    text: johnstone-1979-impro
    citation: "Keith Johnstone, *Impro: Improvisation and the Theatre* (Faber and Faber, 1979), STATUS section, Chapter 1 ('The See-saw')."
    quote: "'We soon discovered the 'see-saw' principle: 'I go up and you go down'. Walk into a dressing-room and say 'I got the part' and everyone will congratulate you, but will feel lowered. Say 'They said I was too old' and people commiserate, but cheer up perceptibly. Kings and great lords used to surround themselves with dwarfs and cripples so that they could rise by the contrast. Some modern celebrities do the same. The exception to this see-saw principle comes when you identify with the person being raised or lowered, when you sit on his end of the see-saw, so to speak. If you claim status because you know some famous person, then you'll feel raised when they are: similarly, an ardent royalist won't want to see the Queen fall off her horse. When we tell people nice things about ourselves this is usually a little like kicking them. People really want to be told things to our discredit in such a way that they don't have to feel sympathy. Low-status players save up little tit-bits involving their own discomfiture with which to amuse and placate other people. If I'm trying to lower my end of the see-saw, and my mind blocks, I can always switch to raising the other end... I therefore teach actors to switch between raising themselves and lowering their partners in alternate sentences; and vice versa. Good playwrights also add variety in this way.' (Keith Johnstone, *Impro*, Chapter 1)"
canonical-instances:
  - "Johnstone's dressing-room example, verbatim: announcing 'I got the part' produces congratulation plus felt lowering in listeners; announcing 'They said I was too old' produces commiseration plus a perceptible uplift in listeners — the emotional valence of the announcement and the status-effect on the audience run independently and can even be opposite."
  - "Historical kings and lords keeping dwarfs and jesters at court specifically for the contrast effect — a deliberate, structural exploitation of the see-saw (lower someone visibly and nearby, rise by comparison) rather than an incidental byproduct of cruelty."
  - "The royalist who is genuinely pained by the Queen's fall from a horse, not merely sympathetic — Johnstone's example of the identification-exception, where the see-saw's normal pairing (someone's fall = someone else's rise) inverts because the observer has already merged their own status with the falling party's."
  - "A job interview candidate who, asked about a past failure, delivers it self-deprecatingly rather than defensively — intuitively managing the interviewer's felt status (not wanting the interviewer to feel challenged or lowered) even while being factually forthcoming, an everyday instance of the raise-other/lower-self move."
critical-questions:
  - "Is this just zero-sum thinking dressed up — doesn't real life have positive-sum outcomes where everyone's status can rise together (e.g. a team's shared success)? The see-saw operates at the level of the FELT, moment-to-moment transaction between the specific two (or more) parties present in an exchange, not at the level of aggregate long-run outcomes. A team's shared success can raise everyone's status relative to outsiders (positive-sum externally) while individual status transactions WITHIN the team, at the moment of announcement, still follow see-saw dynamics (who gets credited first, whose contribution is named) — the two levels aren't in conflict, they're different grains of analysis."
  - "How does the identification-exception actually work — is it just 'people you like don't trigger the effect'? Johnstone's own examples (the royalist, someone claiming status via a famous acquaintance) suggest something more specific than mere liking: identification means treating the other party's status as continuous with your own, so their movement is experienced as your own movement rather than as an external event you have feelings about. Liking someone without identifying with them (e.g. respecting a rival) would NOT suspend the see-saw; genuinely merging your sense of standing with theirs would."
  - "Doesn't this claim just restate lex-qukkg (status is behavioral, not fixed) in a different form? No — lex-qukkg says status-play is continuous and independent of social rank; it says nothing about how a status move by one party affects another party. lex-ysh6p adds a specific, separately falsifiable mechanical claim: status moves come in structurally paired rises-and-falls, with a named exception condition. You could accept lex-qukkg in full and still deny lex-ysh6p (e.g. if you believed status moves were purely self-contained and didn't propagate to observers at all)."
  - "Is 'switch to raising the other end' just a manipulative rhetorical trick — praise yourself by insulting someone else? Johnstone's own framing treats it as a TACTICAL EQUIVALENCE for actors and writers seeking variety (either move achieves a similar net effect on the on-stage status gap), not as ethical advice. The atom names the mechanical equivalence Johnstone observed; whether raising-self or lowering-other is the more ethical or effective real-world choice in a given exchange is a separate, situational judgment the atom doesn't settle."
  - "operationally distinct from lex-xehnw envy-tracks-visibility-and-proximity-not-absolute-magnitude: lex-xehnw is about what envy TARGETS (proximate, visible comparisons); this atom is about the PAIRED-TRANSACTION STRUCTURE of status moves themselves (a rise for one party structurally implies a fall for another) — adjacent thematically (both concern comparative social standing) but different mechanisms."
