id: lex-bvz98
name: bias-the-classification-against-your-own-thesis-to-earn-the-finding
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When you build a measurement or classification scheme to test a hypothesis you yourself hold, deliberately design the coding rules so that ambiguous or borderline cases get resolved AGAINST your hypothesis, not toward it. A resulting positive finding is then stronger evidence, not weaker, precisely because the measurement procedure was handicapped against producing it -- and you have pre-empted, in advance, the natural objection that you cooked the categories to get the answer you wanted. Merton's own move, tabulating how much seventeenth-century Royal Society research was shaped by economic need: he classified any item as 'pure science' unless a scientist explicitly and contemporaneously connected it to a practical need, which meant entire categories a modern reader would obviously judge practical -- investigations in meteorology, work in anatomy and physiology 'undoubtedly of value for medicine and surgery' -- were coded as pure science by his own rule, working directly against the thesis he was trying to support. He states the resulting bias openly rather than hiding it: 'if any bias is involved in this classification, it is in the direction of over-estimating the scope of \"pure science\"' -- i.e., against his own claim that economic need shaped research direction. When his tabulation still found that a majority of research showed some relation to socio-economic need despite a coding scheme stacked toward the opposite conclusion, the finding carries more weight than the same number would from a neutral or sympathetic coding scheme. Distinct from Heuer's structured-analytic-technique program (lex-rsnn7): that mechanism corrects a solo analyst's blind spots by externalizing assumptions to a DIFFERENT agent (a peer reviewer, a devil's advocate) whose different priors can see what the original analyst cannot. This mechanism requires no second agent at all -- it is a self-executable design discipline, available even to a lone researcher with no institutional peer review, that works by handicapping the measurement itself rather than by recruiting an outside challenger."
related: [lex-rjgd8, lex-rsnn7]
evokes: [merton-1957, science-and-economy-of-17th-century-england, over-estimating-the-scope-of-pure-science, stack-the-deck-against-yourself, conservative-coding-convention, adversarial-self-check]
lineage:
  - source: primary
    text: merton-1957-classification-scheme-directly-indirectly-pure-science
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIX 'Science and Economy of 17th-Century England,' p.625. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'Items were classified as \"directly related\" to socio-economic demands when the individual conducting the research explicitly indicated some such connection or when the immediate discussion of the research evidenced a prior appreciation of such a relation. Items classified as \"indirectly related\" comprise researches which had a clear-cut connection with current practical needs, intimated in the context, but which were not definitely so related by the investigators. Researches which evidenced no relations of this sort were classified as \"pure science.\"'"
  - source: primary
    text: merton-1957-bias-toward-over-estimating-pure-science
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.625."
    quote: "'Thus, investigations in the field of meteorology could readily be related to the practical desirability of forecasting the weather but when these researches were not explicitly related to specific practical problems they were classified as pure science. Likewise, much of the work in anatomy and physiology was undoubtedly of value for medicine and surgery, but the same criteria were employed in the classification of these items. It is likely, therefore, that if any bias is involved in this classification, it is in the direction of over-estimating the scope of \"pure science.\"'"
canonical-instances:
  - "A company evaluating whether its own new product feature increased retention defines 'retained' using the strictest available threshold (30-day return, not 7-day) and counts every ambiguous edge case as churned -- so that a positive retention lift, if it survives this deliberately unfavorable definition, is more credible to a skeptical board than the same lift measured under a generous definition would be."
  - "A researcher testing whether their own teaching method improves learning outcomes pre-registers that any student who transfers out of the class mid-study, drops a low grade, or produces an ambiguous test result will be counted in the control group's favor rather than excluded or credited to the treatment -- so a positive result that survives this handicap withstands the obvious objection that inconvenient cases were quietly dropped."
  - "operationally distinct from lex-rsnn7 objectivity-comes-from-externalizing-assumptions-not-purifying-the-perceiver (Heuer): lex-rsnn7's remedy for perception-level bias is structural externalization to another agent with different priors (peer review, devil's advocate, red-team) because the biased agent cannot see their own blind spot from inside it. This atom names a self-executable technique that requires no second agent -- a lone researcher builds the classification scheme to handicap their own hypothesis before ever collecting or coding the data. They compose: a lab could do both (an adversarially-designed coding scheme, itself reviewed by an external devil's advocate for whether it is genuinely stacked against the hypothesis) but neither requires the other."
critical-questions:
  - "How do you verify the classification was actually biased against the thesis rather than merely being called that -- what would an independent auditor need to see (the coding rule stated in advance, applied to a specific ambiguous case that could have gone the other way) to confirm the handicap was real and not rhetorical?"
  - "Does this technique protect against every kind of researcher bias, or only against bias in how ambiguous cases get sorted? It does nothing to catch bias in which population gets sampled, which time period gets selected as 'representative,' or which categories exist to sort into in the first place -- the sampling choice and the category scheme itself are both unaudited by this technique."
status: active
