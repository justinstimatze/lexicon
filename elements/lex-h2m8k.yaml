name: when-accusation-is-unavoidable-escalate-to-the-highest-status-venue-available
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "If being accused or judged is unavoidable, the choice that remains is not whether but where -- and maneuvering the confrontation into the highest-status forum available can convert an accusation into a status gain, because being formally judged by an eminent body confers standing that being informally dismissed by a minor one never would, regardless of the eventual verdict. Hyde reads exactly this strategy into Hermes' response when Apollo accuses him of theft: instead of simply denying the charge and hoping to be let go, Hermes maneuvers the confrontation toward Olympus, 'even as Hermes overtly protests the charges, covertly he hopes to move the quarrel to Mount Olympus so it can be held before the other gods.' Hyde names the underlying strategy directly: 'Hermes wants a change of venue. He's like a petty criminal who seeks to get his case into federal court so as to increase his status. If he's going to be a thief, at least he should be charged at the Olympic level.' The strategy pays off precisely because it works on the accuser too: 'he gets Apollo unwittingly to help enact the script that leads to this end' -- left to handle it alone, Apollo would have simply discarded him into Tartarus, but drawn into taking the matter to Zeus, Apollo ends up elevating Hermes into 'a kind of royalty (the Prince of Thieves, not a crook from a cave), and where he stakes public claim to his lineage.' Diagnostic move: when you cannot avoid being judged for something, before accepting the venue offered by whoever is judging you, ask whether a higher-status forum is reachable -- being formally tried, reviewed, or contested at the highest level accessible confers a form of standing that quietly evading or losing at the lowest level never can, and the accuser escalating the stakes to pursue you there may do more for your position than a successful denial at the original level would have."
