id: lex-x63qj
name: deflect-a-proposition-with-a-category-argument-before-an-accusation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A target of an unwanted proposition can test the water with a low-escalation, logical deflection before revealing full awareness of the underlying threat, rather than leading with an accusation. In the Jataka's tale of Kukkuta, the cock's first response to the cat's marriage proposal is a polite claim of incompatibility rather than a direct accusation of predatory intent: 'Lady fair and winning, you have four feet, I have only two: Beasts and birds should never marry: for some other husband sue.'"
related: []
evokes: [jataka, chanipata, kukkuta-jataka, low-escalation-deflection-before-accusation, category-argument-as-first-refusal]
lineage:
  - source: primary
    text: jataka-chalmers1895-kukkuta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 383, Kukkuta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Lady fair and winning, you have four feet, I have only two: Beasts and birds should never marry: for some other husband sue."
canonical-instances:
  - "Offered an obviously self-serving side deal by a coworker, an employee first declines by citing company policy rather than immediately calling out the coworker's motive, testing whether a polite no makes the pitch go away."
critical-questions:
  - "Does starting with a low-escalation deflection risk signaling naivety that invites a second, harder push, rather than shutting the matter down?"
  - "At what point does politeness stop being a reasonable first move and start being a delay that costs the target more than an immediate direct refusal would have?"
status: active
