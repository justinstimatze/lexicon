id: lex-csnjj
name: selection-decisions-aggregate-into-an-emergent-environment
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a selection process (admissions, hiring, any filter that lets some individuals in and keeps others out) is being evaluated only for whether it picks good individual candidates, check for a second effect the criteria have regardless of how well they pick individuals: the CRITERIA determine the statistical composition of the whole admitted group, and that composition becomes an environmental force acting on every member of it, including people the criteria never directly judged. Merton's case: 'the criteria and procedures for selection of medical students have distinct sociological implication. They have the consequence of helping to shape the interpersonal environment which the school provides for each of its students. For, as the criteria of admission vary, manifestly the composition of the student body will vary. If the admissions committee in one school, for example, assigns prime importance to purely intellective qualities of students, the composition of students in that school will of course be skewed toward the upper reaches of intelligence. As a result, students of any particular degree of intelligence will find themselves in a distinctly different kind of environment of peers than would these same students in a school having a differing set of criteria.' He names this explicitly as a second, LATENT function of selection alongside its manifest one: 'not only have the manifest function of selecting individuals more or less suited to the role... but also the indirect and latent function of producing a distinctive social environment for each student.' This is more specific than 'latent functions exist' (lex-pazxc) — the mechanism here is an AGGREGATION effect: many individual pass/fail decisions, each made about one person on their own merits, compound into an emergent group-level property (the peer group's composition) that then acts causally on every individual in it, independent of what that individual's own selection score was. Diagnostic move: when auditing a selection criterion, evaluate it on two separate axes — does it pick good individuals, AND what population-level composition does it produce, since the second question has consequences for every member regardless of how the first question comes out."
