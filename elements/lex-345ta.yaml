lineage:
  - source: primary
    tradition: structural-functionalism
    text: merton-1949-social-theory-and-social-structure
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. VIII 'Contributions to the Theory of Reference Group Behavior' (with Alice S. Kitt, first published 1950 in Merton and Lazarsfeld eds., Continuities in Social Research), pp.263-266. This is where Merton names anticipatory socialization, ties it to the membership-group / reference-group distinction, and states the two-sided functional analysis: functional for the individual in an open structure, dysfunctional for the group of membership, and — the qualification the concept is usually quoted without — dysfunctional for the individual where the structure is in fact closed (the marginal-man case)."
    quote: "For the individual who adopts the values of a group to which he aspires but does not belong, this orientation may serve the twin functions of aiding his rise into that group and of easing his adjustment after he has become part of it. That this first function was indeed served is the gist of the finding in The American Soldier that those privates who accepted the official values of the Army hierarchy were more likely than others to be promoted. [...] It appears, further, that anticipatory socialization is functional for the individual only within a relatively open social structure providing for mobility. [...] By the same token, the same pattern of anticipatory socialization would be dysfunctional for the individual in a relatively closed social structure, where he would not find acceptance by the group to which he aspires and would probably lose acceptance, because of his outgroup orientation, by the group to which he belongs. This latter type of case will be recognized as that of the marginal man, poised on the edge of several groups but fully accepted by none of them. [...] Although anticipatory socialization may be functional for the individual in an open social system, it is apparently dysfunctional for the solidarity of the group or stratum to which he belongs. For allegiance to the contrasting mores of another group means defection from the mores of the in-group."
  - source: primary
    tradition: structural-functionalism
    text: stouffer-1949-the-american-soldier
    citation: "Samuel A. Stouffer, Edward A. Suchman, Leland C. DeVinney, Shirley A. Star and Robin M. Williams Jr., The American Soldier, Vol. I: Adjustment During Army Life (Princeton: Princeton University Press, 1949) — Studies in Social Psychology in World War II. The empirical base Merton is reading when he formulates the concept: survey data on US Army enlisted men, including the association between a private's endorsement of official/officer-corps attitudes and his subsequent promotion. Merton's reference-group theory is explicitly a reanalysis of this material, which is why the concept arrives already attached to a dataset rather than as pure theory. The figures and phrasing below are Merton's own verbatim quotation of it, with his citations to Stouffer et al. Vol. I page numbers preserved in brackets — a secondary transcription, not independent access to Stouffer's book."
    quote: "[Merton 1957, Ch. VIII, quoting Stouffer et al. Vol. I with his own page citations:] 'One factor which hardly would have failed to enter to some extent into the judgment of an officer in selecting a man for promotion was his conformity to the officially approved military mores.' (I, 259) [...] 'of the privates who in September 1943 said they did not think the Army's control was too strict, 19 per cent had become Pfc's by January 1944, while only 12 per cent of the other privates had become Pfc's.' (I, 261-2) [...] 'the men whose attitudes were most conformist were the ones most likely to be promoted subsequently.' (I, 263) Merton's own footnote immediately qualifies the finding: 'these data do not conclusively demonstrate that conformist attitudes, rather than other correlates of these attitudes, made for significantly higher likelihood of promotion. In principle, only a completely controlled experiment, obviously not feasible in the present instance, would demonstrate this beyond all reasonable doubt.'"
  - source: primary
    tradition: structural-functionalism
    text: merton-reader-kendall-1957-the-student-physician
    citation: "Robert K. Merton, George G. Reader and Patricia L. Kendall (eds.), The Student-Physician: Introductory Studies in the Sociology of Medical Education (Cambridge, MA: Harvard University Press, 1957), Appendix A, 'Socialization: A Terminological Note,' p.287. Merton's applied study of professional socialization in medical school, and the source of the most frequently quoted formulation of what the process does. Useful as the professional-formation case, where anticipatory socialization is deliberately engineered by the institution rather than improvised by the aspirant."
    quote: "'the technical term socialization designates the processes by which people selectively acquire the values and attitudes, the interests, skills, and knowledge — in short, the culture — current in the groups of which they are, or seek to become, a member. It refers to the learning of social roles.'"
canonical-instances:
  - "the origin case (Stouffer, The American Soldier, 1949): US Army privates who had taken on the attitudes and values of the officer corps were more likely than their peers to be promoted. Merton reads this as the mechanism, not a curiosity — the pre-adoption is doing work on the admission decision, and the same men were disliked by their fellow enlisted men for it. Both halves of the atom are visible in one dataset"
  - "medical school (Merton, Reader and Kendall, The Student-Physician, 1957): the student practises the detached-concern posture, the clinical vocabulary and the bearing of a physician long before holding responsibility for a patient. Here the institution deliberately engineers the anticipatory socialization rather than leaving it to the aspirant — the curriculum IS the rehearsal, which is what a professional formation is for"
  - "the graduate student or junior associate performing the discipline's citation habits, hedging conventions and reading list before having any standing in it. This is the same move Bourdieu describes from the other side in lex-r7zuy as the early-career performance of the serious scholar being convertible cultural capital — Merton supplies the actor's motive, Bourdieu supplies the conversion mechanism"
  - "the cost half, in ordinary language: the first-generation student who comes home talking differently and is told 'you think you're better than us.' The sanction is not irrational and not a misreading — pre-adopting the standards of a group your family is not in genuinely does announce that their judgment has stopped being the judgment that counts. lex-pn8qn down-crossing-status-stigmatized-more-than-up-crossing is the asymmetry this sanction sits inside"
  - "the closed-boundary failure mode: the aspirant who has spent years acquiring the manners, credentials and opinions of an elite that turns out to practise closure (lex-ky7un). The rehearsal bought nothing, the membership group has already written them off, and they end holding the norms of a group that will not have them — Merton's own limiting case, and the reason the open-structure qualification is load-bearing rather than decorative"
  - "the migration and class-crossing case: pre-adopting the destination culture's language, dress and opinions before arrival or before acceptance. Whether this reads as preparation or as betrayal depends entirely on which group is doing the reading, and both readings are accurate about their own side of the trade"
critical-questions:
  - "is the boundary actually open? This is the question the concept is usually deployed without asking, and it inverts the advice. In an open structure the rehearsal is a good bet; in a closed one it is pure cost, and the structurally sound move is the lex-ux9fh branch — build or join a parallel hierarchy whose standards can actually be met — not more rehearsal. Anyone counselling 'dress for the job you want' owes an account of whether the job is reachable"
  - "which way does the causation run in the American Soldier finding? That privates with officer-corps attitudes were promoted more often is cross-sectional. The selection story is fully live: men already marked out for promotion, or already disposed by background toward the officer corps, would show the same association with no causal contribution from the pre-adoption at all. Treat the promotion payoff as a plausible mechanism with a known identification problem, not as an established effect"
  - "who is the reference group, actually? The aspirant's own account of it is unreliable — people routinely name a prestigious group while rehearsing the norms of a nearer, more legible one, or rehearse a mythologised version of the target group's norms that its actual members would not recognise. Rehearsing the wrong norms is a common way for the bet to fail while looking from the inside exactly like the bet succeeding"
  - "is the pre-adoption being rewarded or resented by the target group? Gatekeepers do not uniformly reward it; some read visible eagerness as presumption and penalise it, and some groups mark their boundary specifically by punishing outsiders who adopt insider markers without licence. The functional claim needs the gatekeepers' actual disposition, not the assumption that fitting in is always read as fit"
  - "is this actually anticipatory socialization, or one of its neighbours? If no group membership is being sought and the actor is guessing at a power's unstated wishes, it is lex-trady (Snyder) and the payload is submission, not entry. If the actor already has inside access without membership, it is lex-k8bsd and the yield is epistemic, not positional. If the acts are constituting the identity rather than bidding for admission to a group that grants it, it is lex-y2tbg"
