lineage:
  - source: primary
    text: brand-1972-spacewar-fanatic-life-and-symbolic-death-rolling-stone
    citation: "Stewart Brand, 'Spacewar: Fanatic Life and Symbolic Death Among the Computer Bums,' Rolling Stone, December 7, 1972 -- Les Earnest, executive officer of Stanford's Artificial Intelligence Laboratory, quoted mid-piece."
    quote: "'Sometimes it's hard to tell the difference between recreation and work, happily. We try to judge people not on how much time they waste but on what they accomplish over fairly long periods of time, like a half year to a year.'"
canonical-instances:
  - "A manager keeps catching an engineer reading papers, tinkering with side projects, and browsing forums during work hours -- and keeps almost writing them up for it, until a year passes and that engineer has shipped more genuinely novel work than anyone else on the team. The individual hours were never going to resolve into a clean verdict; the year did."
  - "A PhD advisor watches a student spend months that look like wandering -- reading outside the field, building tools nobody asked for -- and resists the pressure to redirect them toward visible weekly progress, because what the department actually needs from the student is a dissertation, and that verdict is only legible on a multi-year horizon."
  - "An open-source maintainer is accused of 'not really working' because their commit graph goes quiet for weeks at a time between large, well-considered releases. Commit by commit it looks erratic, but the releases themselves land large and well-considered, which is what batching looks like from further out."
critical-questions:
  - "Doesn't this just delay the same judgment rather than avoid it -- if someone's year-end output is thin, don't you still have to decide whether that reflects wasted hours or bad luck? Yes, but the question has changed shape: instead of adjudicating intent inside an opaque hour (unanswerable from outside), you're evaluating a result you can actually see. That's a real epistemic gain even if some judgment remains at the end."
  - "What stops this from becoming cover for indefinite slack, since 'give it more time' can always be the answer to a poor year? Earnest's own phrasing bounds it: 'fairly long periods,' not unlimited ones -- the technique trades a too-short window for a long-but-still-finite one, not for no window at all. An institution that keeps extending the horizon every time the verdict comes due isn't applying this pattern; it's declining to apply any evaluation window."
