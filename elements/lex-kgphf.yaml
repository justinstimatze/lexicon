id: lex-kgphf
name: burnt-child-fears-fire-singular-pain-generalizes-to-over-broad-avoidance
type-in: state
type-out: warning
_tier: atomic
agent-instruction: "After a single painful or costly experience with X, expect SUBSEQUENT AVOIDANCE TO GENERALIZE OVER-BROADLY — beyond the actual recurrence risk — to anything that even superficially resembles X. The proverb-tradition's transferable claim is structural: 'a burnt child fears the fire' (English); 'once bitten, twice shy' (English); 'one year bitten by a snake, three years afraid of a grass rope' (Chinese, Hart 1937; reaffirmed Dalai Lama 1981); 'the man who has once been bitten by the snake fears every piece of rope' (Japanese, Symmes 1995). All four traditions name the SAME mechanism: salient single-event pain installs a wide protective generalization gradient that includes many neutral-or-low-risk stimuli. The discipline: the avoidance is NOT irrational — Bayesian updating from a sample of one when the cost of recurrence is catastrophic is rational behavior. But the generalization is typically TOO WIDE for the empirical recurrence rate, and recalibration requires either explicit base-rate evidence or controlled re-exposure that doesn't replicate the pain. Practitioner test: 'is my current avoidance proportional to the actual recurrence risk, or is it driven by the salience of the original pain?' If salience-driven, the avoidance may be costing more than recurrence would. Be careful with the inverse failure mode: not every learned-from-painful-experience avoidance is over-broad. The atom names the TYPICAL over-correction; some single-event avoidances (touching hot stove, accepting offers from known scammers) are precisely calibrated. Diagnostic: name the candidate avoidance, name the actual recurrence rate, compare. Modern formalism: Kahneman-Tversky availability heuristic + Mowrer 1956 two-factor theory of avoidance learning (the avoidance is reinforced by the fear-reduction it produces, even when no actual threat is present); the proverb-tradition's claim was calibrated centuries before either."
related: [lex-2qgu8, lex-37nsd, lex-9wfde, lex-bg3ad, lex-eb3wf, lex-hrnuj, lex-kdj8h, lex-ngc66, lex-nx7u7, lex-p77e7, lex-r3w25, lex-spm8x, lex-vkhp7, lex-wjwuc, lex-wtkuz, lex-xu94g, lex-y36ps]
