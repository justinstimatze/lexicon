id: lex-gqyxt
name: engineer-the-conditions-that-earn-a-boon-then-redeem-it-precisely
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A person can instruct someone to deliberately reverse their usual routine — doing the pleasant step first and the painful step second — specifically because that sequence reliably earns a superior''s goodwill and a promised reward, and pre-script exactly what to ask for with it once it''s granted. The mechanism is two-stage: first engineer the conditions that generate leverage, then redeem that leverage for a specific, otherwise-withheld goal. In the Jataka''s tale of Gangamala, the queen instructs the court-barber this way to extract the meaning of the king''s mysterious song: "My good man, when you are trimming the king''s beard you ought to take his hairs with your tweezers first and use the razor afterwards: then if the king offers you a boon, you must say you don''t want anything else, but wish to know the meaning of his song: if you do, I will give you much money."'
related: []
evokes: [jataka, atthanipata, gangamala-jataka, engineered-reciprocity, leverage-then-targeted-redemption]
lineage:
  - source: primary
    text: jataka-chalmers1895-gangamala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 421, Gangamala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "My good man, when you are trimming the king's beard you ought to take his hairs with your tweezers first and use the razor afterwards: then if the king offers you a boon, you must say you don't want anything else, but wish to know the meaning of his song: if you do, I will give you much money."
canonical-instances:
  - "A staffer coaches a junior colleague on the order for a difficult client review: lead with the easy parts, hold the hard feedback until the end, since that sequence tends to make the client offer something in return. She also tells her exactly what to ask for."
critical-questions:
  - "Does manufacturing the favorable condition on purpose taint the goodwill it produces, compared to goodwill that arises without engineering — or does the recipient's motive not matter once the boon is genuinely offered?"
  - "What happens to this tactic once the person granting the boon realizes the sequence was deliberately engineered rather than incidental?"
status: active
