id: lex-xhvgy
name: contextual-effects-as-relevance-currency
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When an utterance has multiple interpretations, the listener picks the one yielding the most CONTEXTUAL EFFECTS for least processing cost. Relevance theory: meaning is the path that pays off in inference. Predict interpretation by predicting the cheap-payoff route."
related: [lex-u74ex, lex-k6d7u, lex-e2tnt, lex-bd324, lex-j929z, lex-n6t4u, lex-5mv6r, lex-d7h2y, lex-8vcfb, lex-v6nqz, lex-bkaum, lex-y5jm9]
scaffolds-from: [lex-n6t4u]
evokes: [relevance-equals-having-contextual-effect, three-currencies-implication-strengthening-contradiction, effect-not-topic-fit, redundancy-isnt-relevant-no-matter-how-on-topic, relational-not-intrinsic-relevance]
lineage:
  - source: primary
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard UP / Blackwell 1986; 2nd ed. 1995). Chapter 2 §8 (p.108-117) introduces the construct 'contextual effect' and enumerates its three exhaustive sub-types: contextual-implication, strengthening, contradicting. Chapter 3 §1 'Relevance' (p.121-125) then makes the key equation: an assumption is relevant in a context iff it has some contextual effect in that context. The two pieces together define the operational backbone of relevance theory: relevance is paid for in the currency of contextual effects, and only three currencies are accepted. Verified verbatim 2026-05-20 (Ch.2 p.109-110 + Ch.3 §1 p.122 OCR'd page text; page numbers verified from per-page file headers using established filename = printed-page + 10 offset)"
    quote: "Contextual implications are contextual effects: they result from a crucial interaction between new and old information as premises in a synthetic implication. Intuitively, in the sort of framework we have been describing, there should be two more types of contextual effect. On the one hand, new information may provide further evidence for, and therefore strengthen, old assumptions; or it may provide evidence against, and perhaps lead to the abandonment of, old assumptions. [Ch.2 §8 p.109 — the enumeration of the three sub-types: contextual-implication, strengthening, contradicting (which can lead to abandonment).] (7) Relevance: An assumption is relevant in a context if and only if it has some contextual effect in that context. This definition captures the intuition that to be relevant in a context, an assumption must connect up with that context in some way. It clarifies this intuition by specifying the nature of the connection required. [Ch.3 §1 p.122 — the essential equation: relevance is operationalized as the having-of-contextual-effects.] What is interesting about the passer-by's reply is the very close connection that exists between seeing its relevance (or, more precisely, the relevance its speaker intended it to have) and being able to derive some contextual implication from it. It seems clear that someone who is unable to supply something like the context in (5) and derive something like the contextual implication in (6) will be unable to see the intended relevance of this reply, and that, conversely, anyone who sees this implication will agree that this reply is relevant in the appropriate context. Perceiving some contextual effect of an assumption seems to be sufficient for judging it relevant. [Ch.3 §1 p.122 — the Royal National Lifeboat Institution example connecting relevance-perception with contextual-implication derivation; the bidirectional claim that effect-perception is necessary AND sufficient for relevance-judgment.]"
  - source: practitioner
    text: sperber-wilson-mining-pass-1
    citation: "promoted from cross-attestation: information theory (Shannon's information measure quantifies novelty given prior state — the same shape as 'effect on context'; high-entropy messages carry information ≈ have contextual effect; redundant messages are irrelevant in Shannon-terms regardless of topic-fit), philosophy of communication (Grice's relevance maxim 'be relevant' was previously undefined; S&W give it operational teeth via the three-effect schema), software code-review and design-critique (a review comment is relevant if it: yields a non-obvious derivation about the code (implication), strengthens an existing concern (strengthening), or contradicts an assumption the author was making (contradiction). Comments that just restate already-visible facts have no contextual effect and read as noise), AI alignment and LLM evaluation (a model response is relevant to a user's task-state if it has at least one of the three effects — derives a new implication, strengthens a hypothesis, or contradicts an assumption. Responses that are on-topic but redundant are 'fluent irrelevance' — the canonical pairing with lex-jv983 fluency-trap), epistemology and Bayesian updating (strengthening is credence-update without abandonment; contradicting is credence-update with potential abandonment; contextual-implication is new-belief-formation via composition. The three-way maps onto the three operations a rational agent can perform on a belief-state given new evidence). Cross-domain attestation across linguistics, information theory, code review, AI alignment, and epistemology"
canonical-instances:
  - "the Royal National Lifeboat Institution example from Ch.3 §1 p.122: a passer-by's reply seems irrelevant on surface, but in a context that includes 'someone who has no need of the services of a charity cannot be expected to subscribe to that charity,' the reply yields the contextual implication 'the passer-by cannot be expected to subscribe' — and the relevance-judgment tracks the implication-derivation. The example demonstrates that relevance is RELATIONAL (to a context), not INTRINSIC (to the assumption alone)"
  - "code review: 'this PR looks good' has near-zero contextual effect — restates the default. A comment like 'the new locking pattern conflicts with the lock-ordering convention in §4' has high relevance via contradiction (contradicts the author's implicit assumption of convention-compliance). A comment like 'this change reinforces the recent decision to move toward immutable structs' has relevance via strengthening (raises credence on a thematic direction). A comment like 'with this change, the cache invalidation path becomes O(1)' has relevance via contextual-implication (yields a new derivable conclusion from the change + prior architecture). The three sub-types map cleanly to the three useful kinds of code-review comment; on-topic but redundant comments fail the relevance test in all three modes"
  - "LLM evaluation: a model response is judged 'helpful' largely along the same three axes — does it yield non-obvious implications, strengthen reasonable beliefs, or correct mistaken ones? Responses scored high on 'fluent' but low on 'helpful' are typically high-topic-fit but low-contextual-effect — the canonical pairing with lex-jv983 fluency-trap. The three-effect schema gives operational teeth to what 'relevance' means in an LLM-quality-evaluation rubric"
  - "team meeting where someone restates already-known information: NO contextual effect (no implication, no strengthening beyond redundancy, no contradiction) → low relevance regardless of topic-fit. The 'thanks for sharing, but I knew that' phenomenon is exactly this failure: surface-relevance (on-topic) plus zero-contextual-effect (no novelty given context). The fix is to model the audience's existing cognitive environment (lex-e2tnt) before speaking"
  - "operationally distinct from lex-u74ex spotlight-choice (which names the OPERATION of picking what's relevant given a context): lex-xhvgy names the CRITERION for whether the picked item actually IS relevant. The pair: lex-u74ex is the picking action; lex-xhvgy is the test the pick must pass. Without the criterion, the operation has no quality measure; without the operation, the criterion is inert. S&W chain them by design: spotlight-choice operates inside the cognitive environment (lex-e2tnt), and the items it picks are judged by the contextual-effects criterion"
  - "operationally distinct from lex-e2tnt cognitive-environment-as-scope (which names the FIELD that scopes candidates for relevance): lex-xhvgy takes the (context, assumption) pair as INPUT and produces a relevance-judgment as OUTPUT. The field-of-manifest (lex-e2tnt) supplies the context-side; the assumption can be from inside or outside the field. Relevance-as-effect is the operational function over the pair"
  - "operationally distinct from lex-k6d7u credence-as-graded-belief (which names the substrate that 'strengthening' modifies): lex-k6d7u is the GRADED-BELIEF state; lex-xhvgy names one of the three operations that can be performed on such states (strengthening raises credence, contradicting can lead to abandonment, contextual-implication yields a new state-element). lex-k6d7u is the storage representation; lex-xhvgy is the update-operation typology when new information arrives. Bayesian updating is the formal version of what S&W describe informally here"
  - "foundational edge case — bounded by the cost-of-effort: Ch.3 §2 (the immediate next section, not part of this atom) introduces effort as the cost-side of the relevance economy: an assumption with small contextual effects requires low processing effort to remain relevant; an assumption with large contextual effects can justify high processing effort. Pure-effects definition (this atom) is necessary-but-not-sufficient for FULL relevance theory; the effort-side is a separate engineering target. The atom is left at the effect-only formulation because the three-way decomposition is the decisive currency claim; effort is a different molecule (candidate for future mint)"
critical-questions:
  - "the three-way-exhaustiveness test: are the three sub-types (contextual implication, strengthening, contradicting) ACTUALLY exhaustive, or is there a fourth type? S&W argue three is exhaustive because they cover what can happen to a context-element given a new assumption. The exhaustiveness depends on contexts being SETS of belief-elements with credences (Bayesian framing). Under non-Bayesian framings (anti-foundationalist relevance, coherentist epistemology), a 'restructuring' fourth type may be needed. The atom holds under S&W's framing; flag for revision if a coherentist alternative is added to substrate"
  - "the effect-vs-effort balance: contextual-effect names the BENEFIT side of relevance; effort is the COST side. An assumption with small contextual effects can still be relevant if processing-effort is low; an assumption with large effects can justify high effort. Practitioner-question: are you measuring effects in isolation, or relative to the effort the audience must expend to process? The cost-side is a separate atom but always co-fires"
  - "the credence-update grounding: each of the three effect-types corresponds to a Bayesian update operation — implication produces a new posterior; strengthening shifts a prior toward 1; contradicting shifts toward 0. Practitioner-discipline: when diagnosing a contextual effect, name which Bayesian update it implements. The diagnosis sharpens by going to the formal level"
  - "the effect-detection vs effect-creation distinction: relevance-theory describes what effects an utterance HAS on a listener's context. Speakers can also DESIGN effects (rhetoric, persuasion, advertising) by selecting utterances whose contextual effects in the audience's context produce the desired update. Practitioner-question: am I analyzing an effect that occurred (descriptive), or designing an utterance to produce a target effect (instrumental)? The two stances require different tooling"
status: active
