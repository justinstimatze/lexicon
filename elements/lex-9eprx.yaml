id: lex-9eprx
name: loss-aversion
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When framing tradeoffs symmetrically (50% gain vs 50% loss), surface loss aversion — losses are weighted ~2x gains in human evaluation; symmetric framing predicts wrong, design the choice with asymmetric weighting in mind."
related: [lex-hrnuj, lex-k6d7u, lex-m54nv, lex-n93j7, lex-nx7u7]
scaffolds-from: [lex-hrnuj, lex-k6d7u, lex-n93j7]
evokes: [prospect-theory, the-pain-of-loss-exceeds-the-joy-of-equivalent-gain, kahneman-tversky-asymmetry, endowment-effect, status-quo-bias-mechanism, the-2x-loss-coefficient]
lineage:
  - source: practitioner
    text: kahneman-tversky-1979-prospect-theory
    citation: "Daniel Kahneman & Amos Tversky, 'Prospect Theory: An Analysis of Decision under Risk,' Econometrica 47(2):263-291 (March 1979) — the canonical paper, the foundational text for behavioral economics, the work that won Kahneman the 2002 Nobel in Economics (Tversky died 1996, ineligible). Demonstrates that the value function is concave for gains and convex for losses, with steeper slope for losses (loss aversion coefficient typically estimated 1.5-2.5x in subsequent literature)"
    quote: "[Abstract:] 'The value function is normally concave for gains, commonly convex for losses, and is generally steeper for losses than for gains.' [Section IV, on the value function:] 'A salient characteristic of attitudes to changes in welfare is that losses loom larger than gains.' [the next sentence carries a reference marker, so it is given separately rather than welded on:] 'The aggravation that one experiences in losing a sum of money appears to be greater than the pleasure associated with gaining the same amount'"
  - source: practitioner
    text: tversky-kahneman-1992-cumulative-prospect-theory
    citation: "Amos Tversky & Daniel Kahneman, 'Advances in prospect theory: Cumulative representation of uncertainty,' Journal of Risk and Uncertainty 5(4):297-323 (October 1992) — the refinement: cumulative prospect theory addresses some technical limitations of the 1979 original. Loss-aversion coefficient λ ≈ 2.25 estimated. Standard reference in any modern decision-theory treatment. Verbatim quotes below from p.297 (intro restating the 1979 value-function shape) and p.298 (explicit loss-aversion subsection)"
    quote: "Some time ago we presented a model of choice, called prospect theory, which explained the major violations of expected utility theory in choices between risky prospects with a small number of outcomes (Kahneman and Tversky, 1979; Tversky and Kahneman, 1986). The key elements of this theory are 1) a value function that is concave for gains, convex for losses, and steeper for losses than for gains, and 2) a nonlinear transformation of the probability scale, which overweights small probabilities and underweights moderate and high probabilities. [p.297 intro.] Loss aversion. One of the basic phenomena of choice under both risk and uncertainty is that losses loom larger than gains (Kahneman and Tversky, 1984; Tversky and Kahneman, 1991). The observed asymmetry between gains and losses is far too extreme to be explained by income effects or by decreasing risk aversion. [p.298, explicit loss-aversion subsection.]"
  - source: practitioner
    text: kahneman-2011-thinking-fast-and-slow
    citation: "Daniel Kahneman, Thinking, Fast and Slow (Farrar Straus Giroux 2011), Chapters 26-29 on loss aversion, the endowment effect, and prospect theory — the popular synthesis of 30+ years of work. Substantive grounding is carried by Tversky-Kahneman 1992 above and the Wikipedia entry below."
  - source: primary
    tradition: 8b-zim
    text: wikipedia-loss-aversion-en-2025-12
    citation: "Wikipedia, 'Loss aversion', en.wikipedia.org via ZIM archive wikipedia-en-all-nopic-2025-12 (path Loss_aversion). The article opens with the operational definition, attributes the term + concept to Tversky-Kahneman 1979 as a component of prospect theory, and reports the empirical magnitude ('losses tend to be treated as if they were twice as large as an equivalent gain') matching the 2.25× coefficient from Tversky-Kahneman 1992 already cited in this lineage"
    quote: "In cognitive science and behavioral economics, loss aversion refers to a cognitive bias in which the same situation is perceived as worse if it is framed as a loss, rather than a gain."
canonical-instances:
  - "Kahneman & Tversky 1979 binary-choice: subjects choose between (A) sure $500 and (B) 50% chance of $1000 / 50% chance of $0. Most pick A (risk-averse for gains). Symmetric inverse: subjects offered (A) sure -$500 vs (B) 50% chance of -$1000 / 50% chance of $0. Most pick B (risk-seeking for losses). The reflection of risk attitude across the gain/loss boundary is the empirical foundation"
  - "endowment effect (Knetsch 1989; Kahneman, Knetsch & Thaler 1990): subjects given a coffee mug demand ~2x in price-to-sell what they would pay-to-buy the same mug. Owning shifts the reference point; selling becomes a loss; loss-aversion makes the seller demand more. Robust effect across goods and contexts"
  - "status-quo bias in policy: defaults are sticky beyond what rational-choice would predict. Organ-donation rates are 90%+ in opt-out countries (Austria, Belgium) and 15-20% in opt-in countries (Germany, Denmark) with otherwise-similar populations. The default acts as a reference point; deviation feels like loss"
  - "Tversky & Kahneman 1981 framing experiments (Asian disease problem): identical outcomes framed as gains (lives-saved) vs losses (lives-lost) produce systematically different choice patterns. Risk-averse for the gain framing, risk-seeking for the loss framing. The framing IS doing the work"
  - "real-estate sellers in declining markets: hold properties longer than rational-choice predicts because selling-at-a-loss is psychologically harder than holding-at-future-loss. The reference-point is the purchase price; selling below it is a 'realized loss' that loss-aversion strongly resists"
  - "operationally distinct from lex-k6d7u credence-as-graded-belief: graded-credence is the move of holding probability-weighted beliefs; loss-aversion is the asymmetric weighting of OUTCOMES once beliefs and prospects are combined. Credence is upstream of the value function; loss-aversion shapes the value function itself"
  - "operationally adjacent to lex-m54nv concentrated-benefits-diffuse-costs: lex-m54nv is the political-economy distributional asymmetry (concentrated party benefits more than diffuse party loses); loss-aversion is the psychological asymmetry (the same person weights losses more than equivalent gains). Different domains; both involve asymmetry but at different system layers"
  - "operationally distinct from lex-hrnuj anchoring-bias: anchoring is the move of weighting initial reference points heavily in subsequent judgments (any reference point, gain or loss). Loss-aversion is specifically about asymmetric weighting around a reference point. Anchoring sets the reference; loss-aversion describes the value-function shape around it. Often co-fire (the anchor IS the reference point relative to which loss-aversion fires)"
critical-questions:
  - "where is the reference point? Loss-aversion theory is incomplete without specifying the reference. Kahneman's later work (Reference-Dependent Preferences) addresses this; the answer depends on framing, prior endowment, social comparison, expected outcomes. The reference-point is partly endogenous to the choice context. Before invoking the atom, name the reference explicitly — if you can't, you may be projecting an asymmetry that the subject isn't actually feeling."
  - "is the loss real or just framed as one? The same outcome can be a 'loss' or a 'forgone gain' depending on framing. Skilled negotiators reframe to shift which side of the reference-point the outcome sits on. Loss-aversion is frame-sensitive, not frame-independent — the same person can be loss-averse or gain-seeking on identical outcomes under different framings."
  - "what is the coefficient of asymmetry in this domain, and is the standard 2.25× estimate transferable? Lab estimates concentrate around λ ≈ 2 for monetary gambles. Real-world domains vary: high-stakes professionals (traders) show attenuated loss-aversion; novices show amplified; emotional/identity-laden losses (status, group-belonging) may run much higher than 2×. Treat the coefficient as a domain-specific quantity."
  - "does loss-aversion compose with other biases here or substitute for them? Endowment effect + anchoring + status-quo bias all share the loss-aversion mechanism but operate at different stages of the choice. If you've already invoked anchoring for the reference-point or endowment for the ownership-shift, you may be double-counting if you also invoke loss-aversion separately."
  - "is loss-aversion adaptive or maladaptive in this context? In evolutionary-time domains (resources at survival-threshold, social-status), loss-aversion tracks real asymmetry — losing your last food matters more than gaining one more meal. In modern domains (long-horizon investment, sunk-cost in projects), loss-aversion produces systematically suboptimal choices. The atom describes the bias; whether to debias depends on whether the underlying asymmetry the bias evolved for is still operative."
