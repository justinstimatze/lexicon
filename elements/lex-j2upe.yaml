evokes: [conceal-the-grudge-while-weak-collect-double-when-strong, delayed-compound-revenge, kautilya-when-the-task-is-accomplished, patience-plus-compounding-deters-future-exploitation]
lineage:
  - source: primary
    text: kautilya-arthashastra-content-look-collect-double-later
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Joint Activities,' 'When the Task is Accomplished,' 'Allied with a Stronger Ruler,' {7.5.45,46,48}."
    quote: "'If the stronger ruler is not upright, the king shall quickly withdraw under some pretext, when the work has been done. If the stronger ruler is upright, the king shall wait until he is given permission to leave... Even if the king receives a small share, or even no share, from the stronger king, he shall go away with a [seemingly?] content look. Later, when the stronger king comes under the king's power [for any reason] twice the loss shall be exacted.'"
canonical-instances:
  - "A junior partner at a firm accepts a much smaller cut of a deal they largely originated, showing no visible frustration to the senior partner who structured the split, but keeps a private, specific record of exactly what was owed -- years later, when the senior partner needs the junior partner's cooperation on something career-critical, the junior partner extracts terms well beyond what the original shortfall would have covered."
  - "A smaller supplier accepts a squeezed margin demanded by a dominant retail chain during a period when the supplier has no leverage to refuse, maintaining a cooperative posture throughout, but the moment the retail chain later needs the supplier's capacity during a shortage that competitors can't fill, the supplier charges premium terms that recoup far more than the original squeeze cost."
critical-questions:
  - "does concealing resentment while weak risk the grievance being genuinely forgotten or its details eroding over time, such that when the power balance finally reverses, the specific 'debt' has become vague, unverifiable, or disputed by the other party, who may have no memory of shortchanging anyone at all?"
  - "is doubling the eventual claim actually a stable deterrent, or does it risk provoking an escalating cycle -- once the formerly-stronger party discovers the shortfall is being collected at double, do they have every incentive to resist, retaliate, or preemptively strike before the collection can happen, turning a one-time grievance into an open-ended conflict?"
  - "how does a party currently accepting a shortchange actually know the power balance will ever reverse at all -- if it doesn't, does the entire strategy amount to nothing more than swallowing a permanent loss dressed up as patience, with the promised future collection never actually arriving?"
status: active
