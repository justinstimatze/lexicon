id: lex-jna7g
name: indirect-accusation-via-a-chain-of-parallel-parables
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Knowing a powerful figure is themselves the wrongdoer but unable to say so safely, a speaker tells a lengthening series of independent short stories that each restate the identical underlying structure, forcing the listener to draw the conclusion rather than being told directly. The repetition-with-variation functions as an escalating persuasion ladder when a single analogy fails to land, letting the speaker communicate an unwelcome truth to power while retaining plausible deniability — until direct statement becomes the only option left. In the Jataka''s tale of Padakusalamanava, the youth tells story after story built on the refrain "my refuge proved my bane" rather than naming the king outright: "That which destroys the cold, and parches grain, / Consumes my limbs. My refuge proves my bane." "A man, O king, who like fire was the refuge of the people, stole the bundle of jewels. Do not ask me about the thief." "Friend, just bring me the thief." Without telling the king that he was a thief, he told yet another story.'
related: []
evokes: [jataka, navanipata, padakusalamanava-jataka, nathan-parable-structure, speaking-truth-to-power-indirectly]
