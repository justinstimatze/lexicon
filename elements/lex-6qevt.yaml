id: lex-6qevt
name: lived-position-as-irreplaceable-epistemic-substrate
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating a claim about an experience you haven't had, treat the lived-position as the irreplaceable epistemic substrate. You can reason about the experience, but the person who lived it has access to data you don't. Don't substitute your reasoning for their data."
related: [lex-wtkuz, lex-ctnnx, lex-kny9v, lex-brcgz, lex-ymckb, lex-et8q2, lex-qeg52, lex-z9kmt, lex-y2nej, lex-4u23a, lex-uqmd7, lex-2sdqf, lex-46twa, lex-f5pns, lex-ux9fh, lex-ct5ux, lex-sp2sn, lex-u53ue, lex-a3tfj, lex-22kep, lex-njj99, lex-z8hbu, lex-b2c6b, lex-3ezh8, lex-k8bsd, lex-44byg, lex-fv4a3, lex-qg68a, lex-y2tbg, lex-55dm8, lex-5qkj9, lex-t7xcp, lex-5ftak, lex-mqvyk, lex-b2r4u, lex-pch8u, lex-4kn98, lex-f6g8c, lex-pn8qn, lex-f2ktw, lex-r7zuy, lex-95qfv, lex-ugpw2, lex-j62m2, lex-a4m7x]
evokes: [the-other-side-has-not-been-represented-by-one-who-lives-there, standpoint-epistemology, sympathetic-second-hand-cannot-replace-first-person, position-dependent-representational-adequacy, voice-of-the-black-woman]
lineage:
  - source: primary
    text: Cooper-1892-AVoiceFromTheSouth
    citation: "Anna Julia Cooper, *A Voice from the South* (1892). Cooper's preface ('Our Raison d'Être') states the foundational standpoint-epistemology claim 97 years before Crenshaw 1989. The 'other side has not been represented by one who lives there' — knowledge from a structural position cannot be adequately substituted by sympathetic second-hand reporting from a different position. Cooper extends this recursively: white-male barristers cannot speak for Black-male perspective, AND Black-male speakers cannot speak for Black-woman perspective. The position itself — the lived experience of the structural relations — is the substrate of certain kinds of knowledge."
    quote: "[Cooper 1892 preface 'Our Raison d'Être':] 'The 'other side' has not been represented by one who 'lives there.'' [Recursive standpoint move:] 'As our Caucasian barristers are not to blame if they cannot quite put themselves in the dark man's place, neither should the dark man be wholly expected fully and adequately to reproduce the exact Voice of the Black Woman.' [Practitioner-extraction: Cooper's claim is *representational adequacy is position-dependent* — sympathetic-second-hand cannot stand in for first-person occupation of the position. This is the standpoint-epistemology primitive, articulated 1892, foundational to a 20th-century tradition (Collins, Harding, Haraway) that explicitly cites Cooper as the origin.]"
  - source: primary
    text: Truth-1850-NarrativeOfSojournerTruth
    citation: "Sojourner Truth (as told to Olive Gilbert), *Narrative of Sojourner Truth* (1850). Form-as-attestation: the Truth Narrative is itself a meta-attestation of Cooper's claim. Truth was illiterate; the published narrative is Olive Gilbert's transcription of Truth's oral testimony with abolitionist editorial framing. Even with deep sympathy and political alignment, the white-amanuensis-text is one layer removed from the position being represented. The lived position (enslaved Black woman) is represented at a remove because the published-form requires literacy + publishing-access — substrate the position itself denies. Cooper's claim 42 years later names what the Truth narrative's own production-form demonstrates."
    quote: "[Truth 1850 (Gilbert transcription):] the published narrative is Gilbert's transcription with editorial framing. The form attests Cooper's later claim: even sympathetic + politically-aligned amanuenses cannot reproduce the position-substrate. The narrative we have is one-step-removed from the position-substrate it documents; this is not Gilbert's failure but the structural constraint Cooper diagnoses 42 years later."
  - source: discovery-loop
    text: feminist-theory-mining-pass-.3-.1
    citation: "phase 5 (Cooper preface) surfaced W18 as the standpoint-epistemology primitive. phase 6 (Truth narrative) added the form-as-attestation observation: the Truth narrative's mediated form is itself evidence for W18's content-claim. mint at distinctness audit: novel atom — substrate has lex-wtkuz descriptive-vs-operational-metacognition and lex-89rjr goal-state-anchoring as adjacent epistemic-method atoms, but nothing on position-as-epistemic-substrate. Cross-attests with intersectionality cluster (deferred — W19 will mint separately)."
    quote: "Cooper extends the standpoint move recursively (white-male can't speak for Black-male; Black-male can't speak for Black-woman) — each subordinate-axis-overlap creates a new position requiring its own voice. The atom names *representational adequacy is position-dependent*; the recursive intersectionality move is downstream of the basic claim."
canonical-instances:
  - "Cooper 1892 preface: the foundational claim that the 'other side has not been represented by one who lives there.' Sympathetic outside-reporting cannot substitute for first-person occupation of the structural position. 97 years before Crenshaw 1989 *Demarginalizing the Intersection of Race and Sex*."
  - "Truth 1850 narrative form-attestation: the mediated-via-amanuensis form of the narrative is itself evidence for Cooper's later content-claim. The lived position (enslaved Black woman) cannot directly produce the published-form because publishing requires substrate (literacy, access, time) the position denies."
  - "Patient-experience in clinical research: the patient-advocate movement (1980s onward) demonstrates the atom in medicine — clinicians cannot adequately proxy for patient-experience because the position of being-the-patient generates knowledge clinicians don't have access to. Patient-reported outcomes, advisory boards, lived-experience-led research design all instance the same standpoint-substrate claim."
  - "User research in software design: 'you can't proxy users' as a UX research maxim. The position of being-the-user (with their context, prior skill, motivations, distractions) generates knowledge the designer can't sympathetic-second-hand reproduce. User interviews, contextual inquiry, observational research all instance the atom."
  - "Ethnographic vs emic distinction in anthropology: the outside-ethnographer's etic account is structurally one-step-removed from the insider's emic account. Same atom; the 20th-century anthropology methodological move toward emic-grounding instances the standpoint-substrate claim in a discipline-specific register."
  - "Survivor-centered policy design: trauma-informed care, transitional-justice processes, restorative-justice frameworks all rest on the claim that the position-of-having-been-harmed generates knowledge of harm-mechanism + recovery-need that institutional-second-hand cannot adequately reproduce. The position is the substrate of the knowledge."
  - "operationally adjacent to lex-kny9v material-conditions-as-substrate: 0290 is the production-substrate (what materially enables intellectual work); 0292 is the perspective-substrate (whose knowledge can be adequately represented). Both are substrate-claims, both apply to intellectual/representational work, but they fire on different prompts — 0290 on enables-or-prevents-work questions, 0292 on whose-account-is-adequate questions."
  - "operationally adjacent to lex-ctnnx (visual-representation power-asymmetry): 0279 names the cinematic instance — looking-relations structured by the position of the viewer-class. 0292 is the general claim of which 0279 is a domain-specific case. Co-fire on representation-power prompts; 0279 is the cinema-specific instance, 0292 is the transferable claim."
critical-questions:
  - "is the knowledge in question position-dependent or position-independent? Some knowledge is reproducible across positions (algebra, well-described physical procedures, formal proofs). Other knowledge is position-substrate-dependent (what it feels like to be subject to a structural relation, the lived texture of a constraint). The atom fires when an attempted second-hand reproduction is treated as adequate for the latter type. Discriminator: would the position-holder recognize the second-hand account as adequate?"
  - "what is the second-hand-account systematically missing? Map what the outside-account can capture (observable behavior, structural description, statistical patterns) against what only the position-account can capture (felt-experience, tacit knowledge, anticipatory adaptations). The gap is the standpoint-substrate's contribution. If the gap is small, the second-hand may suffice; if large, lex-6qevt is operative."
  - "is the speaker positioning themselves as substitute or as ally? The atom does not forbid outside-speakers — it forbids treating outside-speech as equivalent to position-speech. An outside-speaker who flags the gap (Wollstonecraft acknowledging she writes from her position, not from the position of the women she writes about) is operating within the atom; one who claims comprehensive coverage is violating it."
  - "does the position generate its own internal multiplicity? Cooper's recursive move (white-male, Black-male, Black-woman as nested positions) suggests the atom is fractal — within any 'position' there are sub-positions with their own substrate. The atom's full operational use requires asking whose position within the position is doing the speaking. lex-6qevt + W19 intersectional-position-not-decomposable (deferred to ) compose to express the full recursive intuition."
