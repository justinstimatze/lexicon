id: lex-wdnmm
name: outspending-cost-sharing-and-integration-are-not-competence-building
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Several organizational moves are commonly mistaken for building a durable capability when they don't actually produce one: spending more than rivals on research and development, sharing costs across business units by pooling a common facility or component, and integrating vertically to bring more of the supply chain in-house. Each of these can happen without any transferable, hard-to-imitate skill resulting from it, and each can also happen alongside genuine competence-building — the presence of the activity is not evidence either way. Prahalad and Hamel's 1990 analysis names all three false positives explicitly: 'Cultivating core competence does not mean outspending rivals on research and development. In 1983, when Canon surpassed Xerox in worldwide unit market share in the copier business, its R&D budget in reprographics was but a small fraction of Xerox's. Over the past 20 years, NEC has spent less on R&D as a percentage of sales than almost all of its American and European competitors. ... Nor does core competence mean shared costs, as when two or more SBUs use a common facility—a plant, service facility, or sales force—or share a common component. The gains of sharing may be substantial, but the search for shared costs is typically a post hoc effort to rationalize production across existing businesses, not a premeditated effort to build the competencies out of which the businesses themselves grow. Building core competencies is more ambitious and different than integrating vertically, moreover. Managers deciding whether to make or buy will start with end products and look upstream to the efficiencies of the supply chain and downstream toward distribution and customers. They do not take inventory of skills and look forward to applying them in nontraditional ways.' What distinguishes real competence-building from all three look-alikes is direction of reasoning: genuine competence-building starts from an inventory of skills and asks what NEW markets or products those skills could reach; the three false positives all start from EXISTING end products and optimize backward (spend more on the product's R&D line, share the product's costs, control more of the product's supply chain) without ever asking what transferable capability, if any, is being accumulated in the process. A company can do all three extensively and still have no more of a durable, portable skill than it started with — while a leaner competitor (Canon spending less than Xerox, NEC spending less than its Western rivals) can out-compete it by deliberately accumulating the transferable skill instead. Generalize beyond manufacturing: a company that increases its engineering headcount or budget assumes it's building technical capability, without checking whether the added spend produces any reusable, transferable skill versus just more output on existing lines; a firm that consolidates back-office functions across divisions to cut costs assumes it's building organizational capability, without checking whether any new, applicable skill resulted versus just a one-time efficiency gain; a company that acquires its suppliers assumes it's building strategic control, without checking whether it gained any transferable skill versus just internalized the same operations under a different reporting line. The diagnostic move: for any investment that resembles competence-building (spending more, sharing costs, integrating vertically), ask explicitly what specific, transferable, hard-to-imitate skill the investment is producing — if the honest answer is 'none, it's just optimizing the current product,' the investment may be worthwhile on its own terms but it is not competence-building."
related: [lex-mastv, lex-7faku, lex-zvdxq, lex-72yj6, lex-tb3re]
evokes: [outspending-rivals-on-research-and-development, shared-costs-post-hoc-rationalization, more-ambitious-and-different-than-integrating-vertically, canon-surpassed-xerox-with-smaller-rd-budget]
lineage:
  - source: primary
    text: prahalad-hamel-1990-false-signals-of-competence
    citation: "C.K. Prahalad and Gary Hamel, 'The Core Competence of the Corporation,' Harvard Business Review, May-June 1990, section 'How Not to Think of Competence,' pp.82-83. Verified verbatim 2026-09-05 against the primary HBR reprint (the copy previously pinned to this citation was a 2017 Macat International study-guide analysis, not the article itself); the '...' below marks a page-83 running head sitting between two paragraphs, not elided article text."
    quote: "'Let us be clear. Cultivating core competence does not mean outspending rivals on research and development. In 1983, when Canon surpassed Xerox in worldwide unit market share in the copier business, its R&D budget in reprographics was but a small fraction of Xerox's. Over the past 20 years, NEC has spent less on R&D as a percentage of sales than almost all of its American and European competitors. ... Nor does core competence mean shared costs, as when two or more SBUs use a common facility—a plant, service facility, or sales force—or share a common component. The gains of sharing may be substantial, but the search for shared costs is typically a post hoc effort to rationalize production across existing businesses, not a premeditated effort to build the competencies out of which the businesses themselves grow. Building core competencies is more ambitious and different than integrating vertically, moreover. Managers deciding whether to make or buy will start with end products and look upstream to the efficiencies of the supply chain and downstream toward distribution and customers. They do not take inventory of skills and look forward to applying them in nontraditional ways.'"
canonical-instances:
  - "Canon surpassing Xerox in worldwide copier unit market share while spending only a small fraction of Xerox's R&D budget in reprographics — outspending was never the mechanism, and its absence didn't indicate weaker competence."
  - "two business units sharing a common manufacturing plant purely to cut costs after the fact, with no accumulated transferable skill resulting from the arrangement beyond the one-time savings."
  - "a company vertically integrating by acquiring a key supplier, gaining operational control of the supply chain without gaining any new transferable skill it didn't already have under the prior contract relationship."
critical-questions:
  - "doesn't spending more on R&D, sharing costs, or integrating vertically at least sometimes produce genuine competence? Yes — the claim isn't that these activities never coincide with real competence-building, only that their presence is not evidence of it. The diagnostic is to check what specific transferable skill resulted, not to assume the activity itself proves anything either way."
  - "how is this different from lex-tb3re a-measure-pushed-as-a-target-ceases-to-be-a-good-measure (Goodhart)? lex-tb3re is about a measure that starts out correlated with a target degrading BECAUSE it becomes the target of deliberate optimization. This atom is about three activities that were never reliable indicators of competence-building in the first place — they can look like effort toward the goal without ever having been diagnostic of reaching it, independent of whether anyone is gaming them. lex-wdnmm is closer to a false-positive-signal problem than a measure-degrading-under-optimization-pressure problem, though both warn against trusting a proxy for the real thing."
  - "how is this different from lex-mastv divestment-severs-the-transferable-competence-not-just-the-product? lex-mastv is about accidentally DESTROYING an existing competence through an exit decision. This atom is about mistakenly believing you are BUILDING a competence through an investment decision, when the investment produces no transferable skill. They're mirror-image failure modes on the same underlying asset (organizational competence) — one about losing it through subtraction, the other about failing to gain it through addition that only looks like accumulation."
