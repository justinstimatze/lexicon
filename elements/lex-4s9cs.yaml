id: lex-4s9cs
name: splitting-friction-prone-companions-so-a-third-party-goes-ahead-alone
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When leaving two people who tend to grate on each other to travel or work together unsupervised, going ahead alone rather than staying to mediate can let the friction escalate exactly because the moderating third party removed themselves at the wrong moment. In the Jataka's tale of the two hermits, the son goes ahead to prepare the hermitage rather than walk home with his slow-moving father and the young novice together: 'You can come on slowly, while I go forward and set the hermitage in order.' Left alone together, the novice's impatience with the old man erupts into a drawn-out quarrel that delays them until darkness falls."
related: []
evokes: [jataka, catukkanipata, kassapamandiya-jataka, removing-the-moderating-party-lets-friction-escalate, unsupervised-pairing-of-mismatched-temperaments]
lineage:
  - source: primary
    text: jataka-chalmers1895-kassapamandiya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 312, Kassapamandiya-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"You can come on slowly, while I go forward and set the hermitage in order.\" Now the young hermit coming on slowly with his father kept butting him in the waist with his head. The old man said, \"I do not like the way in which you are taking me home.\""
canonical-instances:
  - "A project lead who knows two team members clash leaves them alone to finish setting up a booth at a conference while going ahead to check in at the hotel, assuming the task is simple enough not to need supervision — only to find them still arguing over placement when everyone else has already settled in."
critical-questions:
  - "Was going ahead genuinely necessary for the task at hand, or could the same preparation have waited until the more volatile pairing was no longer left alone together?"
  - "Does the friction actually stem from the pairing itself, or would it have surfaced regardless of who accompanied whom — is removing the third party the cause, or just the occasion?"
status: active
