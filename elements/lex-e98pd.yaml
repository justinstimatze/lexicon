id: lex-e98pd
name: reciprocity-as-influence-mechanism
type-in: state
type-out: process
_tier: atomic
agent-instruction: "When someone has given you something — even something small — you're now primed to reciprocate. The reciprocity-norm is an influence-mechanism that fires before reflection. Notice it; choose whether to honor it based on the merits, not the priming."
related: [lex-33w6z, lex-hbgcb, lex-5bpee, lex-8c35v, lex-3hefg, lex-5nk9h, lex-urh87, lex-eghgf, lex-fy5k5, lex-hg2ym, lex-dyr9p, lex-8mcgk]
scaffolds-from: [lex-urh87, lex-33w6z, lex-fy5k5]
evokes: [cialdini-reciprocity, gouldner-norm-of-reciprocity, the-felt-obligation-to-return-the-favor, hare-krishna-flower-then-ask, free-sample-then-purchase]
lineage:
  - source: primary
    text: cialdini-1984-influence
    citation: "Robert Cialdini, Influence: The Psychology of Persuasion (Harper 1984; Estonian reissue Kirjastus Pegasus 2021), Chapter 2 'Reciprocation: The Old Give and Take...and Take' — the canonical popular treatment. Opens with the Christmas-cards-to-strangers experiment (recipients reciprocated to a complete stranger they'd never heard of) and explicitly cites Gouldner's sociological finding that no human society lacks the rule"
    quote: "The rule says that we should try to repay, in kind, what another person has provided us. If a woman does us a favor, we should do her one in return; if a man sends us a birthday present, we should remember his birthday with a gift of our own; if a couple invites us to a party, we should be sure to invite them to one of ours. By virtue of the reciprocity rule, then, we are obligated to the future repayment of favors, gifts, invitations, and the like. [Ch.2 — the canonical statement of the reciprocity rule.] The impressive aspect of the rule for reciprocation and the sense of obligation that goes with it is its pervasiveness in human culture. It is so widespread that after intensive study, sociologists such as Alvin Gouldner can report that there is no human society that does not subscribe to the rule. [Ch.2 — Cialdini citing Gouldner 1960 for the universality claim already verified in this atom's other lineage entry.] [Chapter epigraph: 'Pay every debt, as if God wrote the bill.' — Ralph Waldo Emerson.]"
  - source: practitioner
    text: gouldner-1960-norm-of-reciprocity
    citation: "Alvin Gouldner, 'The norm of reciprocity: A preliminary statement,' American Sociological Review 25(2):161-178 (April 1960) — the canonical sociological statement. Reciprocity as a UNIVERSAL social norm (cross-cultural; functional for social-stability). Gouldner argues the norm of reciprocity is one of the small number of generic social norms found in all known societies. Distinct from anthropological gift-exchange (Mauss) by treating reciprocity as norm rather than ritual. Verbatim quote below from p.161 (article opening, citing Cicero) plus p.161 abstract on universal-component status"
    quote: "'There is no duty more indispensable than that of returning a kindness, says Cicero, adding that all men distrust one forgetful of a benefit. Men have been insisting on the importance of reciprocity for a long time.' [p.161 opening.] Reciprocity as a moral norm is analyzed; it is hypothesized that it is one of the universal 'principal components' of moral codes. As Westermarck states, 'To requite a benefit, or to be grateful to him who bestows it, is probably everywhere, at least under certain circumstances, regarded as a duty.' [p.161 abstract.]"
  - source: practitioner
    text: mauss-1925-the-gift
    citation: "Marcel Mauss, Essai sur le don (1925) / The Gift, trans. W.D. Halls (Routledge 1990) — the canonical anthropological treatment of gift-exchange across cultures. Already cited as primary lineage for lex-33w6z sacrifice-as-transformation. Reciprocity-as-influence-mechanism is the PSYCHOLOGY-OF-COMPLIANCE variant; sacrifice-as-transformation is the ANTHROPOLOGY-OF-EXCHANGE variant. Same root phenomenon, different framings. No verbatim quote is claimed here."
canonical-instances:
  - "Hare Krishna airport flower-then-donation (~1970s, Cialdini 1984 documents): airport-pestered travelers given a small flower or pamphlet (refusing the return-of-gift was harder than refusing the original gift) showed dramatically higher donation rates than control. The mechanism is felt-obligation, not rational valuation"
  - "free-sample-then-purchase: supermarket free samples reliably increase same-product purchase rates beyond what taste-confirmation alone would predict. Receiving creates obligation; obligation discharged via purchase. Marketing has industrialized this since the 1950s"
  - "negotiation concessions: a unilateral concession by Party A creates felt-pressure on Party B to reciprocate. Cialdini calls this 'rejection-then-retreat' — start with extreme demand, retreat to actual demand; the retreat is perceived as a concession, eliciting reciprocal concession. Empirically robust"
  - "academic peer-review reciprocity: implicit norm that reviewing-burdens get reciprocated across the academy (you review for journals; journals review for you). Disrupting reciprocity (free-riding on review-supply) creates collective-action problems that journals must manage explicitly"
  - "favor-economies in workplaces: 'I owe you one' is felt-obligation tracked at the relationship-pair level. Healthy workplace cultures use this as positive-sum coordination; unhealthy ones use it as exploitation lever ('after all I've done for you...')"
  - "Marshall Plan as deliberate reciprocity engineering: post-WWII US aid to Europe was structured to create felt-obligation that would shape post-war alignment. Distinct from raw-bribery by being framed as gift; the framing is part of the mechanism"
  - "operationally distinct from lex-33w6z sacrifice-as-transformation: sacrifice-as-transformation is the BROAD anthropological frame (Mauss; Frazer; comparative-religion); reciprocity-as-influence-mechanism is the NARROW psychology-of-compliance frame (Cialdini; Gouldner). Same root but different frames; sacrifice emphasizes the cost-as-content; reciprocity emphasizes the felt-obligation-as-channel. Both reference Mauss"
  - "operationally distinct from lex-hbgcb social-proof-as-action-signal: social-proof uses OTHERS' behavior as influence signal; reciprocity uses YOUR receipt of a gift as influence signal. Both are Cialdini influence-principles; share family but operate via different channels"
  - "operationally adjacent to lex-5bpee commitment-and-consistency-pressure: reciprocity creates felt-obligation; commitment-pressure shapes how that obligation is acted upon. The two compose: receiving the gift is the commitment; the consistency-pressure is the action-discharge. Cialdini explicitly notes the composability"
  - "vital critical question: is the reciprocity-pressure proportionate? Cialdini's analysis: small gifts often elicit disproportionately-large returns. The dispatch-mechanism doesn't enforce proportionality; only relational-history-tracking does. Skilled influence-deployers exploit this disproportion; awareness of the disproportion is a defense mechanism"
  - "central critical question: is the gift unsolicited or solicited? Solicited gifts (asking for help, then receiving) generate weaker reciprocity-pressure than unsolicited gifts (receiving without asking). The asymmetry of the unsolicited-gift IS what creates the strong felt-obligation; symmetric exchange is normal-trade and doesn't fire the influence mechanism"
critical-questions:
  - "is the small initial favor designed to feel free / unconditional — and is that asymmetry the lever?"
  - "would the recipient have given consent to the implied debt if it had been stated up front?"
  - "is the reciprocation expected in same-currency or different (favor for political endorsement; gift for time) — the cross-currency cases are where coercion hides"
  - "if the reciprocation is refused, what's the cost — and is that cost itself the implicit threat?"
status: active
