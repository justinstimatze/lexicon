id: lex-gpk9s
name: mandatory-side-taking-law-punishes-crisis-neutrality
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A law can go beyond punishing wrongdoing and specifically punish REFUSING TO CHOOSE A SIDE during a civil crisis — treating deliberate neutrality itself, not any substantive act, as the offense. The theory behind such a law: when a community is genuinely split and its institutions are under strain, opting out to protect your own private position while others bear the risk of engagement is not a neutral, harmless stance — it is itself a failure of civic obligation, made in bad faith, by someone waiting to see who wins before committing. Plutarch's Life of Solon records exactly this law among Solon's Athenian reforms: 'one is very peculiar and surprising, which disfranchises all who stand neuter in a sedition; for it seems he would not have any one remain insensible and regardless of the public good, and, securing his private affairs, glory that he has no feeling of the distempers of his country; but at once join with the good party and those that have the right upon their side, assist and venture with them, rather than keep out of harm's way and watch who would get the better.' The mechanism is a codified legal penalty — disfranchisement — aimed specifically at the citizen who sits out a factional crisis to protect their own private affairs while the outcome remains genuinely uncertain; the law does not ask which side was right, only whether the citizen took a side at all. Generalize beyond this case: a professional code of ethics that treats a bystander's documented silence during a colleague's misconduct as itself a sanctionable failure, separate from the misconduct itself; a wartime conscription or loyalty regime that treats declared neutrality as tantamount to disloyalty, on the theory that the community's survival is at stake and privately opting out is a form of free-riding on whichever side eventually wins. The diagnostic move: when evaluating a rule that penalizes inaction during a crisis, check whether it's targeting a failure to act competently (ordinary negligence) or a deliberate refusal to align — the latter is a distinct and much more demanding legal theory, since it requires citizens to bear risk on behalf of an outcome they cannot yet be sure is right."
