canonical-instances:
  - "A junior surgeon stays silent about a genuine complication risk until a senior attending openly says 'I'm not sure this will work' in front of the team — that single modeled admission does more to license the junior's own doubt than months of the junior privately becoming more confident in their own judgment."
  - "A new hire on an engineering team learns within a week that senior engineers get quietly needled for overclaiming ('that'll definitely work') and get respect for saying 'I actually don't know, let's check' — the team's peer culture teaches the calibration lesson faster than the hire's own accumulating technical judgment would have on its own."
critical-questions:
  - "What happens when the two channels disagree — authority figures model open uncertainty but the peer group still punishes admitted doubt, or vice versa — does the novice follow whichever channel has more immediate social cost for getting it wrong, and is that channel usually the peer one rather than the authority one?"
  - "Does this social-permission mechanism transfer at all to solo or remote work, where a novice may never actually observe an authority figure's uncertainty firsthand or receive direct peer sanctioning — and if it doesn't transfer, does that predict slower or worse-calibrated doubt-voicing in isolated learners regardless of their private skill growth?"
