lineage:
  - source: primary
    text: hyde-attacking-procedural-rules-is-more-dangerous-than-any-single-fight
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' closing passage of the chapter. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Put the other way around, the real danger in democratic societies comes not from fights about obscenity but from attacks on the rules that allow these fights to proceed. It comes from those who, when they find professionals disagreeing with them, attack the professions; those who, when they find that the Constitution prohibits the total suppression of excreta, attack the Constitution itself; and those who, when they find themselves blocked by “artistic value,” attack artists. The old wisdom, at least, suggests that such attacks are more dangerous than the dirt they seek to purge. Cultural longevity lies in a more tolerant course."
canonical-instances:
  - "A litigant who loses a case appeals within the court system, however aggressively, and the judiciary's authority to decide future cases is untouched; a litigant who instead campaigns to strip the judiciary of jurisdiction over the whole category of cases they lost in has attacked something that will outlast this one dispute."
  - "A researcher whose paper is rejected by peer review submits elsewhere or revises the work, leaving the review system intact for the next researcher; a researcher who instead campaigns to discredit peer review as a concept, so that no future finding can be checked against it either, has attacked the mechanism rather than contested the verdict."
critical-questions:
  - "Is every critique of a professional consensus, a constitutional interpretation, or a credentialing body actually an 'attack on the rules,' or does this framing risk delegitimizing genuine, good-faith reform efforts by treating them the same as bad-faith attempts to escape an unwelcome ruling -- how do you tell reform from attack in the moment?"
  - "Does Hyde's claim hold when the procedure itself is genuinely corrupt or captured -- is attacking a rigged process actually more dangerous than losing within it, or does the diagnostic only apply to procedures that are basically legitimate, and if so, who decides that?"
  - "Is 'more dangerous' here a claim about probability of long-term harm, a claim about magnitude of harm, or both -- and how would you weigh a low-probability catastrophic loss of the procedure itself against a high-probability but bounded loss within a single fight?"
