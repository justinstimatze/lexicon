evokes: [the-reward-costs-the-promiser-nothing-because-its-not-theirs-to-give, cushing-coyote-and-siuiuki, the-poor-girl-said-not-a-word-but-sat-there, an-offhand-promise-becomes-a-binding-claim]
lineage:
  - source: primary
    text: cushing-coyote-siuiuki-sister-promised-as-reward-without-consent
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Coyote Who Killed the Demon Síuiuki: or Why Coyotes Run Their Noses Into Deadfalls.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Whoever would kill the speckled Demon, they declared, should have you for his wife.' ... So the poor girl said not a word, but sat there until the Coyote called out: 'I say, wife, come down and take me up; I can't climb the ladders.' So the poor girl went down the ladder, took her foul-smelling husband in her arms, and climbed up with him... So the poor girl had to submit to the ill-smelling creature's embraces."
canonical-instances:
  - "A department head promises a subordinate's dedicated support to whichever team wins an internal competition, without ever asking the subordinate, and once a winning team claims the reward, workplace norms around honoring commitments make it difficult for the subordinate to refuse an assignment they never agreed to and had no say in creating."
  - "Parents in a small community jokingly promise their daughter's hand to whichever suitor accomplishes some feat, intending it as empty rhetoric, and when a suitor actually accomplishes the feat and the community treats the promise as binding, the daughter has far less power to refuse than the parents ever anticipated when they made the offhand offer."
critical-questions:
  - "does the family's failure to intervene on the sister's behalf once the Coyote claims her reflect genuine belief the promise was binding, or does it reflect a deeper acceptance that a woman's consent was never actually a factor in the arrangement to begin with -- is the promise's bindingness the real mechanism, or a cover for that?"
  - "what would it have taken for the sister to have real recourse here -- does the story examine any path by which she could have refused, or is her lack of agency total and unexamined, treated as simply how such promises work rather than as an injustice needing address?"
  - "is there a meaningful difference between a promise made carelessly, not expecting anyone to actually succeed, and one made in full awareness that success was possible -- does the brothers' apparent surprise at the Coyote's claim suggest they never seriously weighed the cost of their own offer?"
