canonical-instances:
  - "A company retroactively explains an old, unused patent as evidence the founders 'always understood' a market that only emerged a decade later — the patent's later relevance to that market is not evidence anyone was pursuing it for that reason at the time."
  - "A cultural commentator argues that an old folk tradition 'exists because' it satisfies a modern psychological or social need it happens to serve today — without checking whether the tradition predates that need's recognition, or even that population's existence, by centuries."
critical-questions:
  - "Does this reasoning generalize cleanly to biological evolution, where a trait's current function genuinely can explain its selection and persistence even though the trait's origin may have been for something else (exaptation) — is Merton's target specifically INTENTIONAL-direction claims (needs 'directing attention'), leaving function-explains-persistence claims untouched?"
  - "How wide does the time gap need to be before 'later usefulness' becomes clearly disqualified as evidence of original cause — Merton's examples are extreme (centuries to millennia), but does the same fallacy operate, just less visibly, over shorter and more ambiguous gaps?"
