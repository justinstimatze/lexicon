id: lex-56nfs
name: who-controls-the-pace-of-reexposure-determines-tolerability
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Eli, ten, has developed a sudden fear of woodworking tools after his friend Ryan was accidentally cut with Eli's own pocketknife months earlier. His father David wants to help him revisit the incident so it stops silently driving his behavior, but simply retelling the story straight through would mean forcing Eli back through the worst moment on David's timetable, not Eli's. Instead David hands Eli a specific kind of control: 'I want you to imagine that you're holding a remote control, just like the one we use when we watch movies in the house. And when I get to a part of the story you don't want to think about, you just hit pause. When you say 'Pause,' I'll stop. Then we can fast-forward past that scene. Can we do that?' David still narrates -- Eli isn't asked to tell the story himself, which would require him to hold and produce the hard part unaided. But the instant the account reaches the part Eli can't yet sit with, he has a pre-agreed, low-effort way to stop it: 'When he said, 'Then Ryan picked up a root and started to cut it,' Eli broke in. 'Pause.' He said it quietly, but with plenty of force. David said, 'OK. Now let's fast-forward to the hospital.' 'Farther.'' Eli skips straight past the cutting and the injury to the point where his friend was already safe, and the retelling continues from there. The mechanism: what makes revisiting a difficult experience tolerable, as opposed to re-traumatizing, turns on whether the person going back through it can govern when contact with the worst part starts and stops -- the amount of the experience eventually covered matters far less. A fixed narration paced by someone else forces that contact regardless of readiness; a narration with a working pause-and-skip control lets the listener approach the hard part at whatever distance they can currently manage, then approach closer next time. Transferable move: when someone has to revisit a difficult account -- a past failure in a retrospective, an incident in an interview, a loss in a conversation -- build in an actual, pre-agreed mechanism for THEM to slow, skip, or stop the account at the moment it gets hard, rather than either withholding the account entirely or delivering it start to finish at a pace you set."
