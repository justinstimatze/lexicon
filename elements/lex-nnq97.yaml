    quote: "If the enemy's army is strong but is allied to the commander only by money, superstition or threats, then take aim at the leader. If the commander falls the rest of the army will disperse or come over to your side. If, however, they are allied to the leader through loyalty then beware, the army can continue to fight on after his death out of vengeance."
canonical-instances:
  - "corporate talent poaching as a labor-market analogue: Yahoo hiring Marissa Mayer away from Google in 2012 (and Apple's earlier attempt to poach Dennis Woodside from Motorola) treats a rival's key figure as removable and re-alignable — closer to the transactional condition, where the person can be extracted and redirected rather than triggering a loyalty-driven backlash from the team left behind."
  - "the academic and policy debate over decapitation-strike efficacy in counter-terrorism (targeting a militant group's leadership) turns on exactly this same contingency: research finds mixed results precisely because some groups are leader-dependent networks that fragment on decapitation, while others are ideologically or emotionally bonded movements that a leader's death can radicalize further."
critical-questions:
  - "How would an outside actor reliably diagnose which kind of bond holds a group together before acting? Groups rarely announce their cohesion type, and a leader gains by overstating loyalty precisely to deter this move in the first place."
  - "Can a group's cohesion type shift over time — a purely transactional army developing loyalty to a commander who has led it through real hardship — such that a strategy correct at one point becomes the wrong move later without any external signal that the shift occurred?"
  - "Does the martyrdom effect require genuine belief in the cause, or can manufactured loyalty (propaganda, cult-of-personality) produce the same vengeance-driven stiffening even where the underlying bond was originally transactional?"
