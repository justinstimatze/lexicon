id: lex-tpv83
name: argument-from-established-rule-as-defeasible-deduction
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When citing an established rule to require an action, check (a) is the rule actually in force? (b) does this case actually instance the rule? (c) are there exceptions or competing rules that take precedence? Established-rule reasoning is defeasible at all three joints."
related: [lex-af9ax, lex-th68b, lex-hesjt, lex-jbegr, lex-8j5ms, lex-xhwqt, lex-utn22, lex-aut4h, lex-zd7vh, lex-kh9cr, lex-hhx7u, lex-rnwph, lex-38ygs, lex-7t3wr, lex-y7p3z, lex-chtk9, lex-9uac6, lex-xqamc, lex-zpfv9]
scaffolds-from: [lex-af9ax, lex-th68b, lex-hesjt]
evokes: [rule-following, legal-deduction, deadline-rule, the-rule-says-so, instance-of-the-class, established-practice, case-based-reasoning, deontic-modality]
premises:
  - "if carrying out actions of type A is the established rule for an agent x, then (unless exception applies) x must carry out A"
  - "carrying out actions of type A is the established rule for a"
  - "therefore a must carry out A"
decomposes-into:
  - lex-af9ax
  - lex-th68b
  - lex-hesjt
assembly: "sequential(identify-applicable-rule, classify-case-as-rule-instance, derive-required-action) → defeasibility-attach(lex-af9ax, defeaters=lex-th68b)"
critical-questions:
  - "does the rule actually require carrying out actions of type that include A as an instance? CQ1 (Walton 1996 p.92). The classification step — is the proposed action genuinely an instance of what the rule covers — is the foundational gate. Diagnostic: 'what's the canonical instance the rule was set up for, and does the current case share the relevant features?' — verbal sleight-of-hand often expands or contracts rule-scope by reclassifying the instance"
  - "are there other established rules that might conflict with, or override, this one? CQ2. Real institutional environments contain dozens of overlapping rules with implicit precedence-ordering (newer overrides older; specific overrides general; statutory overrides regulatory; constitutional overrides statutory). The bare scheme treats the cited rule as the only relevant one; deployment requires explicit conflict-survey. Diagnostic: 'is there a higher-priority rule, a more-specific rule, a more-recent rule, or a domain-specific exception-rule that would apply differently?'"
  - "is this case an exceptional one — could there be extenuating circumstances or an excuse for noncompliance? CQ3. Walton's exception case (Walton 1996 p.92): the student replies 'I had the flu, here's the doctor's note.' The rule still stands, but its applicability to the specific case is rebutted by classification-as-exception. Diagnostic: 'is there a recognized excuse-category that applies (medical emergency, force majeure, conflicting duty, change of circumstances since rule was established)?' — every well-designed rule system encodes its exception-types"
  - "is the established rule itself defensible — does it have a legitimate source, currency, scope-clarity, and democratic/institutional grounding? Substrate extension. Walton's CQs assume the rule's existence is settled; many real disputes attack the RULE itself (statute of limitations expired? regulation withdrawn? rule originated in a process now considered illegitimate?). Diagnostic: 'where did the rule come from, when, and does the source still have authority over the current case?' — this is where lex-tpv83 nests with rule-of-recognition arguments and lex-zd7vh slippery-slope concerns about rule-erosion or rule-expansion"
  - "is rule-following the right INFERENTIAL MODE for this case at all, or does the case require *phronesis* (practical wisdom — lex-jbegr) rather than rule-application? Substrate extension via Aristotle NE VI.5-7. Some cases are exception-rich enough that rule-application is the wrong starting move; the case-specific judgment of the practical-wise agent governs. Diagnostic: 'does the case feature the kind of contextual specificity that resists rule-mediation — irreducible particulars, conflicting moral demands, time-pressure that forecloses procedure?'"
lineage:
  - source: primary
    tradition: walton
    text: walton-reed-macagno-2008
    citation: "Douglas Walton, Chris Reed, Fabrizio Macagno, *Argumentation Schemes* (Cambridge University Press 2008), Ch.2 §7 'Arguments Based on Rules and Classifications' (pp.70-72). Scheme cited to Walton 1996 p.92, with three critical questions on p.71. Walton-Reed-Macagno frame argument-from-established-rule as the pragmatic counterpart to argument-from-verbal-classification: 'the situation is categorized as an instance of an established rule, and, therefore, the course of action prescribed in it supposedly has to be applied to the specific case.' Compendium restatement Ch.9 #57 (p.343). The scheme is fundamental to case-based reasoning in ethics and law. Walton 2008 also introduces argument-from-exceptional-case (pp.72) as the rebuttal-scheme to argument-from-established-rule; the two together model the back-and-forth structure of rule-vs-exception disputes."
    quote: "[Ch.2 §7 pp.70-71] 'In these arguments, argument from an established rule is the pragmatic counterpart to argument from verbal classification. To begin with, the situation is categorized as an instance of an established rule, and, therefore, the course of action prescribed in it supposedly has to be applied to the specific case. The argument is derived from recognizing the case as an instance of a general class in a rule, and from this classification of it the conclusion follows that the respondent should act in accordance with the rule. ... [Worked example] Student: I don't think I will [be] able to get my essay in on Tuesday. Would it be OK if I handed it in next week? Professor: We all agreed at the beginning of the year that Tuesday is the deadline. That is the rule. (Walton, 1995, p. 91) This is the scheme for argument from an established rule (Walton, 1996, p. 92). Scheme for Argument from an Established Rule: Major Premise: If carrying out types of actions including the state of affairs A is the established rule for x, then (unless the case is an exception), x must carry out A. Minor Premise: Carrying out types of actions including the state of affairs A is the established rule for a. Conclusion: Therefore, a must carry out A. ... [Critical Questions, p.71] CQ1: Does the rule require carrying out types of actions that include A as an instance? CQ2: Are there other established rules that might conflict with, or override, this one? CQ3: Is this case an exceptional one, that is, could there be extenuating circumstances or an excuse for noncompliance?' [Verified 2026-08-19 against the real PDF: exact match; this span had never been quote-marked, so the checker had never actually checked it.]"
  - source: primary
    text: aristotle-rhetoric-i-13-epieikeia
    citation: "Aristotle, *Rhetoric* Book I Chapter 13 (Bekker 1373b1-1374a17), W. Rhys Roberts 1924 translation (Oxford / The Works of Aristotle Vol. XI). PD; in the lexicon corpus. Aristotle's foundational treatment of *epieikeia* (equity) as the structural correction-mechanism for the inevitable gap between general written law and particular cases. Methodologically-distinct from Walton-Reed-Macagno along three axes: (1) Architectonic vs case-level: Aristotle locates the rule-exception relation in the STRUCTURAL nature of rule-systems (all general laws fail to cover all cases; equity is the universal correction-principle); Walton's CQ3 treats the exception as a case-specific rebuttal-move in dialogue. The two cohere: Walton's CQ3 is the dialectical instrument that operationalizes Aristotle's structural diagnosis. (2) Natural-law vs procedural-rule: Aristotle frames equity as appeal to the *universal/unwritten* law that 'does not change, for it is the law of nature, whereas written laws often do change' (1373b6-9, Rhys Roberts pp.74-75); Walton stays at the procedural-rule level and does not theorize an above-the-rule appeal layer. Aristotle's framing legitimates a CQ4-style move (challenging the rule itself by appeal to a higher principle) that Walton's CQs do not cover. (3) Telos-of-equity vs no-telos: Aristotle gives equity a normative purpose — to forgive acts that are errors/misfortunes rather than wickedness, and to fit law to the particular shape of the case ('Equity must be applied to forgivable actions; and it must make us distinguish between criminal acts on the one hand, and errors of judgement or misfortunes on the other,' 1374a17-26, Rhys Roberts p.81); Walton's CQ3 is structurally neutral about WHEN to grant the exception. Aristotle gives the normative compass Walton's procedural CQ lacks. Together: Aristotle I.13 is the foundational architectonic explaining WHY rule-systems need exception-mechanisms (they are categorical-particular mismatches); Walton's CQs are the per-dialogue instruments that detect when exception-application is warranted in the specific case."
    quote: "[Rhetoric I.13 Rhys Roberts pp.80-82, Bekker 1374a17-1374b22, on epieikeia/equity] 'Equity must be applied to forgivable actions; and it must make us distinguish between criminal acts on the one hand, and errors of judgement, or misfortunes, on the other. ... if a man has no more than a finger-ring on his hand when he lifts it to strike or actually strikes another man, he is guilty of a criminal act according to the written words of the law; but he is innocent really, and it is equity that declares him to be so. From this definition of equity it is plain what sort of actions, and what sort of persons, are equitable or the reverse.' [Corrected 2026-08-19: the atom previously paraphrased Aristotle's finger-ring example as \"a man who acts deliberately and strikes another,\" which inverts the point — Aristotle's case is the ambiguous, not-clearly-deliberate act (a raised hand with a ring on it) that is technically criminal under the letter of the law but innocent in fact; replaced with the real text, verified against the Rhys Roberts translation.] [Rhetoric I.13 Rhys Roberts pp.83-84, Bekker 1375a1-25, on appeal to universal law above written law] If the written law tells against our case, clearly we must appeal to the universal law, and insist on its greater equity and justice. We must argue that the juror's oath 'I will give my verdict according to my honest opinion' means that one will not simply follow the letter of the written law. We must urge that the principles of equity are permanent and changeless, and that the universal law does not change either, for it is the law of nature, whereas written laws often do change. This is the bearing of the lines in Sophocles' Antigone, where Antigone pleads that in burying her brother she had broken Creon's law, but not the unwritten law: 'Not of to-day or yesterday they are, But...'"
canonical-instances:
  - "academic deadline enforcement (Walton's instance): 'The syllabus says assignments are due Tuesday; therefore your essay is due Tuesday' — pure established-rule scheme; CQ3 fires immediately if student presents excuse (medical, family emergency, accommodation)"
  - "traffic enforcement: 'Speed limit is 25 mph in school zones; you were doing 35 in a school zone; therefore citation issues' — established-rule scheme; CQ1 might fire on whether 'school zone' status was active (after-hours, holiday), CQ3 on emergency exception"
  - "tax compliance: 'Tax code §501(c)(3) requires nonprofit status; your organization qualifies for nonprofit status; therefore §501(c)(3) treatment applies' — established-rule scheme at scale; the entire tax code is a rule-classification apparatus and tax-advice practice IS systematic CQ deployment"
  - "code-of-conduct enforcement: 'Workplace policy prohibits X; the conduct is an instance of X; therefore disciplinary action follows' — established-rule scheme; institutional HR practice is the institutionalization of CQ3 (exception-handling) and CQ2 (conflict between policies)"
  - "contract performance: 'The contract requires delivery by Friday; today is Friday; therefore delivery is due today' — established-rule scheme; force-majeure clauses are the contract's built-in CQ3 handler"
  - "Walton's exceptional-case rebuttal: 'I had a bad case of the flu, and here's a note from my physician' — the standard CQ3-deployment showing what successful rebuttal looks like in dialogue"
  - "constitutional/statutory layered cases: 'The state statute requires X' BUT 'the federal regulation supersedes' BUT 'the constitutional provision exempts' — CQ2 (rule-conflict) at scale, requiring explicit precedence-ordering doctrine to resolve"
  - "lex-jbegr phronesis contrast: in irreducibly particular ethical situations, Aristotle holds rule-application is insufficient and the practical-wise person's case-specific judgment governs. The contrast highlights where argument-from-established-rule is the wrong inferential mode"
severity-tier: info
status: active
