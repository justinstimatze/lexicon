id: lex-2h3pp
name: watching-authorities-and-peers-normalize-doubt-recalibrates-when-to-voice-it
type-in: process
type-out: state
_tier: atomic
agent-instruction: "Alongside a novice's own growing skill, two social channels independently teach them when voicing uncertainty is safe rather than shameful — one running downward from authority, one running sideways among peers, and both converging on the same lesson. The vertical channel: watching instructors themselves hit the edges of their own knowledge without shame. Fox: 'From time to time in the classroom, for example, a student will ask what he considers a \"well-chosen question\" only to discover that his teacher \"does not have immediate command of the known medical facts on that point\"... In the autopsy room... a student is struck by the fact that the pathologist cannot always explain the causes of death... Examining patients under the supervision of clinical faculty, a student discovers that when \"different instructors listen to (or feel or see) the exact same thing, they frequently come up with different impressions... and have to consult one another before they reach a final conclusion.\"... observing his teachers... makes a student more aware of the fact that they are subject to the same kinds of uncertainty that he himself is experiencing.' The horizontal channel: peers actively policing each other's displayed confidence, in the opposite direction from what you might expect — punishing bragging, rewarding admitted ignorance. Fox: 'If he acts presumptuous about his knowledge, a student will be reproached by his classmates whereas an admission of ignorance on his part may evoke their approval.... \"It really isn't fashionable to believe much or to be overly sure.\"' Both channels teach the same lesson from different directions: that uncertainty is the normal condition of the role, not evidence of personal deficiency in the person feeling it. This is a distinct mechanism from a person's own private, cognitive work of correctly attributing their remaining uncertainty to themselves versus the field (that private attribution has to happen too, and happens on its own timeline) — this is about the SOCIAL permission structure surrounding the person, which can move faster or slower than their private attribution does, and either one lagging behind the other produces a mismatch: a person may privately know their doubt is well-justified but still fear voicing it if the social climate hasn't caught up, or may voice doubt too freely because the social climate rewards it before they've actually learned to tell justified doubt from mere ignorance. Diagnostic move: when introducing a novice into a high-uncertainty role, check both channels are actually present, not assumed — does anyone in authority visibly display their own uncertainty in front of the novice, and does the peer group actively sanction overconfidence rather than merely tolerate humility — because a novice can have excellent private skill-based attribution and still stay silent if these external signals never arrive."
