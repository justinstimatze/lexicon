id: lex-u376n
name: perfect-literal-compliance-can-break-a-system-built-on-discretion
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Every formal rule system — a constitution, a contract, a job description, a compliance policy — is necessarily incomplete. No finite set of written rules anticipates every contingency, so its real function always leans on unstated discretion to fill whatever the text left out. Levitsky and Ziblatt: 'Even well-designed constitutions cannot, by themselves, guarantee democracy. For one, constitutions are always incomplete. Like any set of rules, they have countless gaps and ambiguities. No operating manual, no matter how detailed, can anticipate all possible contingencies or prescribe how to behave under all possible circumstances.' ... 'Finally, the written words of a constitution may be followed to the letter in ways that undermine the spirit of the law. One of the most disruptive forms of labor protests is a 'work to rule' campaign, in which workers do exactly what is asked of them in their contracts or job descriptions but nothing more. In other words, they follow the written rules to the letter. Almost invariably, the workplace ceases to function.' Notice what work-to-rule doesn't require: no rule gets broken, no gap gets deliberately exploited to defeat a rival. Pure literal compliance is sufficient to stop the system, because the system was never actually running on its written rules alone."
related: [lex-2ecyy, lex-2vsgs, lex-cahck, lex-dvb4u, lex-mxc58]
evokes: [levitsky-ziblatt-2018-how-democracies-die, work-to-rule, constitutional-incompleteness, operating-manual-cannot-anticipate-everything, advice-and-consent]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch5-constitutions-are-always-incomplete
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 5 'The Guardrails of Democracy,' on why written constitutional rules alone cannot secure democracy."
    quote: "'Even well-designed constitutions cannot, by themselves, guarantee democracy. For one, constitutions are always incomplete. Like any set of rules, they have countless gaps and ambiguities. No operating manual, no matter how detailed, can anticipate all possible contingencies or prescribe how to behave under all possible circumstances.' ... 'Finally, the written words of a constitution may be followed to the letter in ways that undermine the spirit of the law. One of the most disruptive forms of labor protests is a 'work to rule' campaign, in which workers do exactly what is asked of them in their contracts or job descriptions but nothing more. In other words, they follow the written rules to the letter. Almost invariably, the workplace ceases to function.'"
canonical-instances:
  - "A 'work to rule' labor campaign, as a category: workers do precisely and only what their contracts specify, refusing every discretionary extra a functioning workplace normally runs on, and by the book's account the workplace 'almost invariably' stops functioning — without a single written term being violated."
  - "The book's own second example of the same incompleteness, without any adversarial intent at all: the U.S. Constitution requires Senate 'advice and consent' on judicial nominees and permits impeachment for 'high crimes and misdemeanors,' and neither phrase specifies a threshold — centuries of live disagreement over what each one actually requires is the ordinary, non-adversarial face of the same structural gap that work-to-rule exploits on purpose."
  - "Hypothetical: an on-call rotation policy defines escalation steps for a 'critical' incident but never defines the word. Mid-dispute over unpaid overtime, an engineer starts routing every borderline incident through the slow official channel exactly as the policy specifies, and response times collapse — no clause in the policy was ever broken."
critical-questions:
  - "This looks close to lex-dvb4u's constitutional hardball, but the two are different claims: hardball is a power-holder CHOOSING to exploit a gap against a rival to win permanently. This is the prior fact that a system can already be broken by good-faith or protest-motivated literal compliance alone, with nobody trying to defeat anybody. Which one is actually operating in a given breakdown, and does it matter which, if the outcome — the system stops working — is the same either way?"
  - "If a workplace or a constitution can be broken by pure literal compliance, is that a fixable design flaw, or is complete specification structurally impossible past some level of complexity — meaning unwritten discretion isn't a stopgap for bad rule-writing but the only thing that was ever going to make any sufficiently complex rule system work?"
  - "Work-to-rule is deliberately adversarial — chosen specifically because it disrupts. A legislature arguing over 'high crimes and misdemeanors' isn't adversarial at all. Does treating both as the same incompleteness mechanism paper over a difference in intent worth keeping separate, or is the rules-alone-were-never-enough point true regardless of which one you're looking at?"
status: active
