    text: cushing-coyote-siuiuki-self-talk-inverts-the-correct-trail
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Coyote Who Killed the Demon Síuiuki: or Why Coyotes Run Their Noses Into Deadfalls.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Well,' said the Wolf, 'follow that path right over there until you come to where it forks; then be sure to take the right-hand trail, for if you follow the left-hand trail it will lead you away from home and into trouble.' ... 'Now, be sure and take the right-hand trail,' called the Wolf, as the Coyote started... After a while he came to the fork in the trail. 'Let me see,' said he, 'it's the left-hand trail, it seems to me. No, the right-hand trail. Well, I declare, I've forgotten! Perhaps it is the right-hand trail, and maybe it is the left-hand trail. Yes, it is the left-hand trail. Now I'm certain.' And, picking up his haunch of venison, away he trotted along the left-hand trail."
canonical-instances:
  - "A surgical trainee is told clearly and specifically which of two nearly identical vials contains the correct medication before being left to administer it, and when the moment comes, talks themselves through a moment of doubt and lands with sudden confidence on the wrong vial, the sense of resolved certainty having nothing to do with which one they were actually told."
  - "A hiker given clear, explicit directions at a trail junction ('go left at the fork, not right') second-guesses the instruction alone at the actual junction, talks through both options out loud, and confidently picks the one they were told to avoid, the false certainty arising entirely from the internal debate resolving rather than from accurately recalling the original instruction."
critical-questions:
  - "how would someone actually distinguish, in the moment, a feeling of certainty that comes from genuine correct recall versus one that comes only from an internal debate reaching a stopping point -- is there any way to tell the two apart from the inside, or only in hindsight once the outcome is known?"
  - "does this pattern suggest that repeating an instruction more times, as the Wolf does, is actually insufficient protection against this specific failure mode, since the Coyote was told twice and still inverted it -- what would a more effective safeguard against self-generated certainty actually look like?"
  - "is the Coyote's confusion a believable account of an honest cognitive failure, or does the story need him to fail here regardless of plausibility, since the tale exists specifically to explain why coyotes die in deadfalls -- does that narrative requirement undercut treating this as a genuinely diagnostic pattern?"
