canonical-instances:
  - "A software company that seats a security engineer directly on each product team, rather than routing all security questions to a central security department, finds that most security concerns get resolved as quick in-team consultations; a product team with no embedded security presence files formal tickets to the central team for the same category of concern and waits days for a response — the difference tracks seating chart, not team competence or company policy."
  - "A law firm that has a tax specialist sitting in the same practice group as its corporate lawyers sees most tax questions handled as an informal hallway conversation; a similar question in a practice group with no embedded tax presence becomes a formal referral to the tax department, with its own intake process and delay — despite firm policy encouraging 'cross-practice collaboration' equally in both cases."
critical-questions:
  - "Does the causal arrow run only from co-location to consultation, or could specialties choose to embed a part-time consultant specifically BECAUSE their caseload was already high-volume and cooperative, in which case the observed contrast partly reflects which specialties are amenable to this kind of arrangement in the first place, not the placement's causal effect on any specialty?"
  - "Surgery converted 80 per cent of cases to consultation but still referred 20 per cent — what determines which cases cross that line even with an embedded consultant present? Is it case severity, or does even a co-located specialist eventually reach a complexity threshold where the fragmentation of a referral becomes unavoidable regardless of proximity?"
status: active
