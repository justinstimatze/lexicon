id: lex-b45am
name: distribute-improvement-duty-into-every-roles-ordinary-job
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you want problems to get noticed and fixed without every issue having to escalate to a single decision-maker, build the expectation of noticing-and-suggesting into the ordinary, unwritten job description of every role in the organization — not just management's. Goss found this was, alongside the experimental framing, the second major condition producing rapid problem-solving in a new medical-training program: 'Not only were C. C. & T. P. personnel prepared to see problems; they were also ready to help solve them... In each case, attempting to eliminate the perceived difficulty was a group process, rather than one in which a single individual wrestled alone with a problem, or turned it over to the Director to handle. The explanation of this group willingness to cope with problems lies, at least in part, in the fact that responsibility for \"improvement\" of the Program was informally shared; it was not confined to the Director or the C. C. & T. P. Advisory Committee. Thus the regular duties of each person — doctor, nurse, or social worker — included the unwritten obligation to assist in the ongoing process of assessing \"trouble-spots\" and suggesting possible solutions.' Her example is a nurse who did not need permission or a formal channel to identify and propose a fix: 'The Program's Nursing Coordinator, for instance, felt she was doing no more than her duty when she reported to the C. C. & T. P. staff that a few students... had complained to her that they could \"hardly give comprehensive care in the Medical Clinic as we're supposed to when a patient has to leave the Clinic and make a special trip to the Minor Surgery Clinic just to have a little dressing changed!\" She believed it well within the confines of her role to suggest at a staff meeting that \"this situation could be remedied quite easily by the addition of a surgical dressing tray as standard equipment for the General Medical Clinic.\"' Goss's own framing of the payoff: 'Doing one's job well, then, encompassed participation in this process of adapting the organization to existing conditions; helping was not a gratuitous favor, extraneous to other duties.' The essay also names the limiting case: the part-time attending physicians, who were NOT woven into this unwritten expectation the same way, were 'less involved' and mostly had 'no improvements to suggest' when asked directly — the diffusion has to actually reach a role, not just formally exist, or that role stays passive regardless of stated policy. Diagnostic move: when a group is slow to surface or fix its own problems, check whether noticing-and-suggesting is treated as part of every role's actual job, or is instead treated as something only management or a designated committee does — and check further whether roles on the periphery (part-time, contract, newly added) have actually been folded into that expectation or merely assumed to be."
related: [lex-6g5dn, lex-cy4sy, lex-fdt8d, lex-hzfkp]
evokes: [goss-1957, unwritten-obligation-to-suggest-fixes, diffused-responsibility-for-improvement, doing-ones-job-well-includes-adapting-the-organization, nursing-coordinator-dressing-tray-example]
