evokes: [chez-panisse, alice-waters, going-to-somebodys-house, no-choice-on-the-menu, borrowed-social-script, reframe-a-limitation-as-generosity]
lineage:
  - source: primary
    text: mcnamee-2007-alice-waters-chez-panisse
    citation: "Thomas McNamee, Alice Waters and Chez Panisse: The Romantic, Impractical, Often Eccentric, Ultimately Brilliant Making of a Food Revolution (The Penguin Press, 2007), Chapter 5 (Very Berkeley, 1971-1973)."
    quote: "'Her most momentous decision was that the dinner menu would offer no choice whatever. \"I wanted it to be like going to somebody's house. Nobody gives you a choice about what to eat at a dinner party.\" The menu would be new every night, seven nights a week.'"
canonical-instances:
  - "A subscription meal-kit or CSA box gives the customer zero say in what's inside each week. Marketed as 'what's freshest right now, picked for you' rather than 'we don't offer substitutions,' the same restriction reads as curation instead of inconvenience -- the frame borrowed is a farmer's-market or a grandmother's-kitchen script where you eat what's in season, not a retail script where the customer expects to choose from a catalog."
  - "A software product removes a configuration option to simplify onboarding. Framed as 'we set this up the way we'd set it up for a friend' rather than 'this feature has been removed,' the loss of control reads as thoughtful defaults rather than a downgrade -- though the frame only holds if the defaults genuinely serve the user rather than the vendor."
  - "A doctor's office stops offering same-day scheduling flexibility and moves to a single fixed appointment slot per patient per visit. Framed as 'we give you our full, unhurried attention for this one slot' (a house-call script) rather than 'we've reduced our scheduling options' (an efficiency script), the same restriction reads as care rather than a service cut."
critical-questions:
  - "Is the borrowed context actually apt, or is it decorative? A dinner-party frame requires the rest of the experience -- welcome, attentiveness, no transactional pressure -- to actually resemble a dinner party; slapping the language on a restriction the audience can plainly see is cost-driven collapses the analogy and the frame reads as spin."
  - "Who benefits from the restriction? If the removed choice serves the provider's convenience more than the guest's experience, borrowing a hospitality script to describe it risks being received as manipulation once the mismatch is noticed -- the frame has to survive the audience checking it against their own experience, not just against the provider's telling."
  - "Does the audience have the option to leave if the borrowed frame doesn't land for them? Chez Panisse's customers chose to go; a captive audience (an employee, a patient with no other provider) handed the same 'like being a guest in someone's home' framing for an involuntary restriction has a very different, more coercive read."
