lineage:
  - source: primary
    text: tronto-1993-moral-boundaries
    citation: "Joan C. Tronto, Moral Boundaries: A Political Argument for an Ethic of Care (New York: Routledge, 1993). Chapter 1 ('Moral Boundaries and Political Change,' pp. 6-10) identifies three constructed `moral boundaries` — the morality/politics split, the demand for a disinterested `moral point of view,` and the public/private-life boundary — that jointly keep women's and caring concerns off the political stage; Tronto's own diagnostic is that `boundaries are human constructions, they are not natural,` and that the strategic question is who is included and excluded by drawing them. Chapter 4 ('Care,' section `Defining Care,` pp. ~103-114) sets out, building on her 1990 essay with Berenice Fisher, the four analytically separate but interconnected phases of caring — caring about, taking care of, care-giving, and care-receiving — and argues that in practice these four phases are sorted by power, gender, race, and class: caring about and taking care of are assigned to the powerful, care-giving and care-receiving to the less powerful. Chapter 6 ('Care and Political Theory,' section `Including the Private,` pp. ~164-165) draws the book's title-bearing political conclusion — that the separation of public from private life is what obscures caregiving as a matter of social responsibility, using the absence of a U.S. national day-care policy as the paradigm case of a caring need left, by boundary-construction rather than necessity, in the `private` column. The atom encodes both the four-phase analytic tool and the meta-level political claim that the boundary sorting care into `private, not a matter for political analysis` is itself a political and historically contingent choice, not a natural or pre-political fact."
    quote: "[On moral boundaries as constructed rather than natural, and the public/private boundary as one of three, chapter 1, pp. 6-10:] 'A third boundary makes the citadel of moral boundaries even safer from incursion by women: it is the boundary between public and private life. Feminist scholars have long noted that, while the particular line drawn between public and private life changes over time and with varying cultural circumstances, within most of Western thought there is a division between public life and private life, and women are restricted to the private realm.' 'All together, these three moral boundaries — the boundary between morality and politics, the \"moral point of view\" boundary, and the public/private boundary — block the effectiveness of women's morality arguments.' 'Boundaries are human constructions, they are not natural. Insofar as boundaries are constructed, we can think of them in many ways, and we can also think about how they might be changed. We can question their origins and ask how they arose ... Who is included and who excluded by drawing these moral boundaries? What are the consequences of this set of moral boundaries?' [On the four phases of caring, chapter 4, `Defining Care,` pp. ~103-109:] 'We noted that, as an ongoing process, care consists of four analytically separate, but interconnected, phases. They are: caring about, taking care of, care-giving, and care-receiving.' 'Caring About. Caring about involves the recognition in the first place that care is necessary. It involves noting the existence of a need and making an assessment that this need should be met ... we can also describe caring about on a social and political level.' 'Taking Care of ... involves assuming some responsibility for the identified need and determining how to respond to it ... If we believe that it is too bad that children starve in the third world, but since any food sent there will be stolen, there is no point in sending money to buy food; then we have suggested that this need cannot be met, and no \"taking care of\" can occur.' 'Care-giving involves the direct meeting of needs for care. It involves physical work, and almost always requires that care-givers come in contact with the objects of care ... providing money is more a form of taking care of than it is a form of care-giving ... that we quickly equate in the United States the provision of money with the satisfaction of needs points to the undervaluing of care-giving in our society.' 'Care-receiving. The final phase of caring recognizes that the object of care will respond to the care it receives ... It is important to include care-receiving as an element of the caring process because it provides the only way to know that caring needs have actually been met ... But perceptions of needs can be wrong.' [On the political sorting of the four phases by power, gender, race, and class, chapter 4, p. ~114:] 'I think we come closer to the reality when we say: caring about, and taking care of, are the duties of the powerful. Care-giving and care-receiving are left to the less powerful.' 'Thus, \"taking care of\" is more associated with more public roles, and with men rather than women. Perhaps one of the most common usages of \"taking care of\" in American English language is the idea that, by working at his job, a man is taking care of his family. The doctor is taking care of the patient, even though the nurses, orderlies, and lab technicians are the actual providers of hands-on care.' 'Out of this association of \"taking care of\" with masculinity, \"caring about\" also becomes gendered, raced, and classed: men and people of greater privilege take care of; they care about public and broader issues. Women and people of color have very little to take care of, they care about private or local concerns.' [On care as a political, not merely moral, concept, chapter 6:] 'The practice of care that I have developed and described in the last two chapters can itself be understood not only as a moral concept, but as a political concept as well.' 'Care as a political concept requires that we recognize how care — especially the question, who cares for whom? — marks relations of power in our society.' [On the public/private split obscuring caregiving as a social responsibility, chapter 6, `Including the Private,` pp. ~164-165:] 'It is a fact of great moral significance that, in our society, some must work so that others can achieve their autonomy and independence. This fact, however, is obscured by the separation of public and private lives, and by the way care is parcelled out into different parts of private life. Here, the split between public and private life refers to the ways in which some concerns are presumed to be the responsibilities of private individuals rather than of society ... A political ideal of care would force us to reconsider this delineation of life into public and private spheres.' 'There is no national day care policy in the United States, except for some tax relief for middle class taxpayers who have spent money on child care. But the notion that the care of young children when their parents work is a social responsibility is an idea that has little resonance in the United States.' [On the boundary not being inherent to the nature of caring but to social structure, chapter 3:] 'Our perception that care is somehow tied to subordinate status in society is not inherent in the nature of caring but is a function of the structure of social values and moral boundaries that inform our current ways of life.'"
