id: lex-xza94
name: third-party-administrative-record-as-forensic-side-channel
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When the system under investigation offers no record of an actor's full footprint, look for an uninvolved third party whose incidental bookkeeping — kept for an entirely unrelated administrative purpose, never designed as evidence — happens to have logged a side-effect of the same activity. Clifford Stoll's The Cuckoo's Egg supplies the canonical case: none of the dozen-plus compromised computer systems Stoll is tracking kept any record of which OTHER systems the hacker had touched. What closed the gap was six months of an uninvolved facility's long-distance phone bills, obtained for a completely unrelated administrative reason (billing), which Stoll correlates against a single confirmed anchor event. 'In physics, this is correlation analysis. If you see a solar flare today and tonight there's a bright aurora, chances are that these are correlated. [...] Well, here were six months of phone bills. Dates, times, phone numbers, and cities.' The phone company had no investigative interest in the hacker; it billed calls because that is what phone companies do. That very disinterest is what makes the record trustworthy — nobody curated or could have thought to falsify it with this investigation in mind. Correlating its timestamps against a known anchor event (a confirmed call to one specific site) let Stoll reconstruct a footprint across a dozen systems none of them had individually recorded. Generalize beyond this case: digital-forensics 'parallel construction' techniques that reconstruct a suspect's movements from credit-card transaction logs, toll-booth or license-plate-reader records, and cell-tower pings — none kept for investigative purposes — when the primary system under investigation was never designed to log the activity itself; historical reconstruction of suppressed or undocumented events from incidental records such as ration-book issuance logs or utility-meter readings, kept for entirely bureaucratic reasons, which happen to be the only surviving trace of population movements or activity levels from a period whose direct records don't exist or were destroyed. The operational search heuristic: when your primary system has no record of an actor's actions, ask what OTHER system, kept by an uninvolved party for a completely different purpose, would have incidentally logged a side-effect of the same actions — the record doesn't need to have been designed for forensics to be forensically useful."
related: [lex-cpjma, lex-w97xs]
evokes: [correlation-analysis, mitre-phone-bills, six-months-of-phone-bills, solar-flare-and-aurora, incidental-bookkeeping-as-evidence, parallel-construction]
