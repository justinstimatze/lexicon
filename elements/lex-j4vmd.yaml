id: lex-j4vmd
name: inferior-token-offers-cannot-buy-off-a-non-negotiable-threat
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When someone believes they're facing a customary transaction, a visitor to be appeased, a toll to be paid, they may respond by escalating the quantity of an offer while quietly substituting inferior units for what they claim to be giving, on the assumption that the ritual of offering matters more than what's actually handed over. This fails completely when the other party was never actually there to negotiate. In Radin's Winnebago Hare Cycle, Hare approaches Flint in the guise of an unknown spirit, singing and advancing with each repetition. Flint responds exactly as custom would dictate toward a spirit whose power is unknown, escalating his offers while narrating them as generous: 'Whatever spirit you are, I give you an arrow-point from my wrist, one that I value very much' and then 'a flint from my ankle, one that I value very much.' The narrator immediately undercuts the claim: 'The flints from his wrist and ankles were actually his poor ones.' None of it matters. Hare was never there to collect tribute; he came to recover flint that Flint had been withholding from the community and to kill him for it, and 'finally after Hare had sung for the fourth time, he jumped toward him and chased him all over the earth, clubbing him and forcing him to scatter his flint arrow-points all over the earth ... Then he killed him.' Flint read the encounter as a transaction to be managed through customary escalating gifts, when it was already a reckoning that no gift, real or feigned, could resolve. Diagnostic move: before responding to a growing threat with a bigger version of the same kind of offer, check whether the other party is actually there to receive an offer at all, or whether the encounter has already moved past the point where anything you hand over changes the outcome."
