    text: hyde-hermaion-eludes-the-earned-gift-theft-categories
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' on Hermes' discovery of the tortoise and invention of the lyre. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Archaic Greeks assumed that if wealth was not earned by the sweat of the brow or received as a gift from a friend, then it must have been stolen. Earned or stolen, gift or theft: by such oppositions agrarian kinship understood the acquisition of riches. A lucky find, a hermaion such as the lyre, eludes these categories. The Hymn says that Hermes “happened on a turtle and got himself an endless source of wealth”; that wealth is neither kin gift nor immoral theft but a third thing, created in a manic moment out of chance and mental insight. Like any such combination of technique and accident it seems, therefore, to come out of nowhere and, at first, to have no clear place in the order of things. It seems a bit shady, like the sudden fortunes of oil barons in the early twentieth century, like the sudden fortunes of software developers more recently."
canonical-instances:
  - "A lottery winner who quits their job the next day is treated by acquaintances with a subtle wariness that a colleague who earned an equivalent sum through a decade of promotions never experiences, even though the lottery winner harmed no one -- the wariness tracks the absence of a legible earned-or-gifted origin story, not any actual impropriety."
  - "An early cryptocurrency holder who becomes wealthy simply by having bought and held through a speculative rally faces persistent public suspicion of scamming or insider dealing, despite an entirely transparent, publicly verifiable transaction history, because 'got lucky and didn't sell' has no home in a vocabulary built around labor and legitimate gift."
critical-questions:
  - "Is the 'no clean category' explanation doing real work, or does windfall wealth actually attract suspicion because chance-based fortunes correlate, in reality, with a higher rate of genuine wrongdoing (insider information, exploited loopholes) than Hyde's framing credits?"
  - "Does this diagnostic risk providing cover for windfalls that really were obtained through hidden exploitation, by reclassifying legitimate suspicion as mere category-confusion?"
  - "Is 'chance plus insight' actually a coherent third category, or does it collapse, on closer inspection, into either 'earned' (the insight was the real labor) or 'gift' (luck is an unearned gift from circumstance), making the supposed category gap smaller than Hyde suggests?"
