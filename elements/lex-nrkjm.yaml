name: a-windfall-stays-sterile-until-skill-converts-it-into-lasting-value
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Receiving a lucky break doesn't by itself change anything durable about your situation -- whether it does depends entirely on what capability meets it afterward, and the same windfall that transforms one recipient's circumstances leaves another's completely unchanged. Hyde traces the distinction through a Roman story recorded by Horace: Mercurius shows a poor, unremarkable man a hidden treasure so he can buy the land he already works. Kerényi's gloss is blunt: 'Mercurius once let Hercules talk him into enriching a stupid man... but then proved himself unworthy of the hermetic windfall by continuing to work the same piece of land!' That's 'dumb luck, the luck of all gamblers whose winnings never enrich them... sterile luck, luck without change.' Hermes' own windfall, the tortoise he turns into a lyre, goes the opposite direction: he doesn't just keep it as a curiosity, he uses the lyre's music to charm his own accuser, Apollo, into canceling the debt from his theft and negotiating him real divine standing. 'Smart luck,' Hyde writes, 'adds craft to accident -- in both senses, technical skill and cunning.' The treasure and the tortoise are both genuine accidents; the difference in outcome comes entirely from what each recipient did next. Diagnostic move: when evaluating whether a lucky break actually changed someone's trajectory, don't stop at confirming the break happened -- ask what skill, craft, or strategic follow-through was applied to it afterward, since an identical windfall can either evaporate into the same old pattern or compound into something new, and the accident itself never determines which."
