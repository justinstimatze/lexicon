lineage:
  - source: primary
    text: hyde-odysseuss-cretan-lie-gets-its-one-true-claim-disbelieved
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), '\"Mere Bellies,\"' on Odysseus's disguised encounter with the swineherd Eumaios in the Odyssey. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "He asks Odysseus to get serious and tell his “true” story, and Odysseus obliges with a lie. “My native land is the wide seaboard of Crete,” he says, and spins a tale full of the concrete, specific detail that liars use to make falsehoods seem like the truth. He ends by saying that he has heard Odysseus will soon return, to which Eumaios replies, “Why must you lie … ? You needn’t lie to be a guest here.” The swineherd rejects as a fabrication the single part of the story that is true. (The recurrent lies Odysseus tells at the end of the Odyssey are called “Cretan lies” because he typically begins them saying “My native land … is Crete.” Cretans were understood to be “lazy bellies” and liars by nature, so Odysseus is hanging a lantern on his own fibs, though—as we shall see—only one of his auditors sees the light.)"
canonical-instances:
  - "A whistleblower who has a history of exaggerating minor complaints finally reports a genuine, serious violation, and colleagues who've learned to discount her past claims specifically dismiss this one as 'more of the same,' when her track record of unreliability is exactly what makes them confident in dismissing the one report that happened to be true."
  - "A tabloid known for fabricated celebrity stories runs one accurate exclusive alongside its usual invented content, and readers who've learned to distrust the publication specifically flag the true story as 'obviously made up,' their calibrated skepticism toward the source misfiring on the one piece of real reporting."
critical-questions:
  - "Is Eumaios's rejection actually caused by the Cretan frame specifically, or would he have disbelieved the claim about Odysseus's return regardless of framing, simply because it's the convenient thing a hungry wanderer would say to earn hospitality?"
  - "Does this mechanism only work when the listener already has some independent reason to want the claim to be false (Eumaios's grief and his reluctance to hope), or does a known-unreliable frame discredit an embedded truth even when the listener has no motivated reason to reject it?"
  - "Is there a way to embed a true claim in an unreliable frame that protects it from this effect, such as explicitly flagging it as different in kind from the surrounding fiction, or does any framing inside a known-unreliable narrative structurally doom the embedded truth regardless of how it's marked?"
