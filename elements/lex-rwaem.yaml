id: lex-rwaem
name: identical-contributions-are-priced-by-rank-not-by-their-own-value
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating whether a deal, contract, or exchange of resources is 'fair,' don't assume the price reflects what was actually contributed -- Kautilya's own definition of a treaty's fairness baseline builds in relative rank as the pricing variable, not the objective size or usefulness of the contribution itself: 'An equal treaty is one in which the stronger king gets a greater share, an equally powerful king an equal share and a weaker king a smaller share. An unequal treaty is one in which a strong, equal or weak king does not get a share according to his power. An exceptionally unequal treaty is one in which one of the signatories gets a disproportionately large share.' Read the baseline case carefully: the SAME contribution of troops or resources is priced differently depending purely on which party supplied it, and this differential pricing is what Kautilya calls the FAIR, expected, baseline case -- 'unequal' and 'exceptionally unequal' name only the further departures from this already-rank-weighted starting point, not departures from a contribution-weighted one. In other words, there is no contribution-weighted 'neutral' baseline being distorted by power; the rank-weighted baseline IS the neutral case, and genuine equal-value pricing (paying identically for identical inputs regardless of who supplies them) doesn't appear anywhere in the schema as an option at all. This matters because it names a mechanism that operates well beyond formal treaties: two parties can supply objectively identical value to an exchange and receive systematically different compensation, and everyone involved can correctly describe the arrangement as following the 'normal' rules, because the rules were never built around the contribution's own worth in the first place. Diagnostic move: before accepting that a negotiated price reflects the actual value of what was contributed, check whether the pricing schema is contribution-weighted or rank-weighted -- if two parties supplying the same input receive different terms purely because of their relative standing, that isn't a corruption of a fair system, it may be the fair system operating exactly as designed, and the honest question becomes whether that design itself is one you're willing to accept rather than whether this particular instance of it is an aberration."
