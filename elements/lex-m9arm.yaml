id: lex-m9arm
name: large-scale-cooperation-requires-defection-visibility-watched-people-are-nicer
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating why a group of strangers cooperates at scale, look for the mechanism that makes defection visible (or believed to be visible). Norenzayan (2013) — 'watched people are nice people' — surfaces the empirical regularity that prosocial behavior reliably increases under cues of being observed. Eye images on donation boxes raise contributions; experimental priming with watcher-related concepts increases generosity in dictator games; real-time monitoring suppresses cheating. The Big Gods hypothesis applies the regularity at civilizational scale: belief in MORALIZING PUNISHING supernatural watchers allowed cooperation to scale beyond face-to-face groups, where direct reputation tracking suffices for monitoring. The cultural-group-selection version: groups that adopted believed-in supernatural watchers outcompeted groups that didn't, because their members behaved prosocially under conditions where no human watcher was present. Transferable diagnostic: when you observe sustained large-scale cooperation among strangers, the supporting structure is some functional equivalent of supernatural surveillance — real or believed-in. Modern functional equivalents: state monitoring and law enforcement, transparent ledgers (blockchain, public-records), reputation-tracking systems (eBay seller scores, Yelp, credit reports), surveillance-by-camera, panopticon-style architectural designs, and the diffuse always-on visibility of social media as a secular Big God. Inverse failure mode: when the believed-watching mechanism weakens (loss of religious belief, breakdown of reputation systems, anonymous-enough environment) AND no replacement is installed, prosocial behavior at scale degrades fast. Operational consequence: in any design that needs strangers to cooperate, decide consciously what plays the watcher role — and recognize that 'watching' need not be real, only believed-in, to affect behavior."
