id: lex-9pnxs
name: killing-severed-from-need-and-then-from-commodity-value-signals-collective-insanity
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "A person can lay out three stages of the same practice: bounded, need-based subsistence, unbounded commodity extraction, and finally a degenerate stage where the commodity motive has dropped away too, leaving nothing but pleasure taken in the act itself. Naming that last stage can serve as evidence an entire group has gone insane. Black Elk lays out the stages in order: 'The Wasichus did not kill them to eat; they killed them for the metal that makes them crazy, and they took only the hides to sell. Sometimes they did not even take the hides, only the tongues... Sometimes they did not even take the tongues; they just killed and killed because they liked to do that.' He contrasts this with his own people's practice in the very next line -- 'When we hunted bison, we killed only what we needed' -- and states the diagnosis plainly: 'You can see that the men who did this were crazy.'"
related: []
evokes: [black-elk-speaks, across-the-big-water, they-just-killed-and-killed, because-they-liked-to-do-that, killed-only-what-we-needed]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch19-across-big-water
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 19, 'Across the Big Water.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The Wasichus did not kill them to eat; they killed them for the metal that makes them crazy, and they took only the hides to sell. Sometimes they did not even take the hides, only the tongues [...] You can see that the men who did this were crazy. Sometimes they did not even take the tongues; they just killed and killed because they liked to do that. When we hunted bison, we killed only what we needed."
canonical-instances:
  - "A fishing fleet that once caught only what local markets could sell shifts to catching fish purely for their fins, discarding the rest of the body at sea, and eventually some boats keep hunting sharks even after the fin market collapses, purely for the sport of the kill."
  - "A trophy-hunting operation that once took only what could be sold as meat and hide shifts to taking only heads for mounting, and eventually some hunters pay to kill animals they don't take anything from at all, leaving the carcass entirely behind."
  - "A logging operation that once cut only enough timber to meet lumber demand keeps clear-cutting a forest long after the timber market has moved elsewhere, purely because clearing land has become its own habitual activity."
critical-questions:
  - "Is 'insanity' the most accurate diagnosis for behavior severed from need and even from profit, or does the pattern have a more mundane economic and psychological explanation, habit, momentum, boredom, competition among hunters, that doesn't require treating an entire population as literally deranged?"
  - "Does Black Elk's three-stage account actually describe three sequential phases of the same historical process, or three separate groups of Wasichu hunters operating with different motives simultaneously, compressed into a single narrative of escalating madness?"
  - "Does the contrast with his own people's need-based hunting hold up as a clean moral opposite? Subsistence hunting can exceed strict need too, in ways this framing never examines."
status: active
