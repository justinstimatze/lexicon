id: lex-t93ff
name: a-predicted-bargaining-outcome-need-not-be-an-ethical-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating a negotiated or game-theoretic bargaining solution as evidence of what's fair, check whether it's actually a prediction of what will happen or a recommendation of what should happen. Sen treats these as a different thing altogether, and collapsing them can dress up threat power as principled fairness. Braithwaite offered game theory as 'a tool for the moral philosopher' using this example: “a certain Luke likes playing the piano in his room, and a certain Matthew likes improvising jazz on the trumpet in the adjacent room, with imperfect soundproofing between the rooms. They disturb each other if they play together, but, as might be expected, the trumpeter makes a bigger mess for the pianist than the pianist can for the trumpeter. The final solution that Braithwaite recommends divides up the time, giving substantially more time to the trumpeter than to the pianist. As Braithwaite ((1955), p. 37) puts it, ‘Matthew’s advantage arises purely from the fact that Matthew, the trumpeter, prefers both of them playing at once to neither of them playing, whereas Luke, the pianist, prefers silence to cacophony.’ Matthew has the threat advantage in the absence of a contract, and it is indeed possible that Braithwaite’s solution may well emerge should Luke and Matthew actually bargain. ... An unbiased judge may well decide that the fact that Matthew can threaten Luke more effectively (and more noisily) than Luke can threaten Matthew does not entitle him to a bigger share of playing time. Matthew himself might concede that if he did not know whether he was going to be Luke or Matthew before deciding on a system of distribution of time he might well have ignored the threat advantage and recommended a more equal sharing of time.” Braithwaite's solution gives Matthew more playing time not because his claim on the room is stronger, but because he can make more noise if no deal is struck -- and the tell is that even Matthew concedes the standard doesn't survive a veil-of-ignorance test. Diagnostic move: when a negotiated split looks formally justified because it emerged from a symmetric, well-defined procedure, ask whether that procedure is predicting what each side can extract given their leverage, or recommending what each side deserves -- a solution can be the accurate answer to the first question and a bad answer to the second."
