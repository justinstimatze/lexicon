id: lex-9c67q
name: a-law-whose-terms-define-each-other-cannot-be-refuted
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Before accepting a stated 'law' as an empirical discovery, check whether its two halves were defined independently or whether one was defined in terms of producing the other -- if the second, the law can't be refuted, because refuting it would require identifying an instance of the cause without the effect, and no such instance is even conceptually available. Skinner's 'law of conditioning' reads: 'if the occurrence of an operant is followed by presence of a reinforcing stimulus, the strength is increased.' It sounds like a discovered regularity. But a reinforcing stimulus is itself defined as whatever stimulus produces that exact increase in strength -- nothing else qualifies as reinforcing. Substitute the definition into the law and it reads: a stimulus that increases response strength is followed by an increase in response strength. No observation could ever falsify it, not because it has survived every test, but because failing it isn't a coherent possibility given how its own terms were set up. Diagnostic move: when a stated law or principle feels too clean to have any counterexamples, resist reading that cleanness as confirmation. Trace whether one of its terms was quietly defined using the other -- if so, the missing counterexamples are a property of the definitions, and say nothing about the world the law claims to describe."
related: [lex-wb5ph, lex-vmas8]
evokes: [circular-definition, law-of-effect-tautology, unfalsifiable-by-construction, chomsky-1959-skinner-review, definitional-vs-empirical-discovery]
lineage:
  - source: primary
    text: chomsky-1959-review-of-skinners-verbal-behavior
    citation: "Noam Chomsky, 'A Review of B. F. Skinner's Verbal Behavior,' Language 35(1):26-58 (1959), Section 3, on Skinner's definition of reinforcement (quoting Skinner's Behavior of Organisms, 1938) and the resulting status of the 'law of conditioning.' Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "'the operation of reinforcement is defined as the presentation of a certain kind of stimulus in a temporal relation with either a stimulus or response. A reinforcing stimulus is defined as such by its power to produce the resulting change [in strength]... Consider first of all the status of the basic principle that Skinner calls the \"law of conditioning\" (law of effect). It reads: \"if the occurrence of an operant is followed by presence of a reinforcing stimulus, the strength is increased\"... As reinforcement was defined, this law becomes a tautology.'"
canonical-instances:
  - "Chomsky's own follow-through, distinguishing the two readings the definition leaves open: 'Although the statement that presence of reinforcement is a sufficient condition for learning and maintenance of behavior is vacuous, the claim that it is a necessary condition may have some content, depending on how the class of reinforcers (and appropriate situations) is characterized.' The sufficiency claim is empty by construction; only a separately, independently specified list of what counts as reinforcing could ever give the necessity claim real content."
  - "Hypothetical: a manager claims 'every successful hire has high potential,' where 'high potential' is assessed retroactively from how the hire actually performed. The claim can never be wrong -- a hire who succeeds is thereby shown to have had high potential, and a hire who fails is thereby shown not to have -- because 'high potential' was never given a meaning independent of the outcome it's supposed to predict."
  - "operationally distinct from lex-vmas8 a-claim-is-scientific-only-if-some-observation-could-contradict-it: Popper's criterion asks whether SOME observation could contradict a claim, which covers many ways a claim can fail to be falsifiable (vagueness, infinite hedging, ad hoc rescue). This atom names one specific, checkable mechanism that produces that failure -- the two terms of the law were defined circularly against each other -- which is narrower than Popper's criterion but gives a concrete thing to look for: substitute one term's definition into the other and see if the law survives as a claim or collapses into a restatement."
critical-questions:
  - "does substituting the definition in always cleanly reveal the tautology, or can a circular definition be laundered through enough intermediate steps that the substitution test itself becomes hard to perform in practice, even though the underlying circularity is real?"
  - "is there a meaningful difference between a law that's tautological because of how its own author defined the terms, versus one that's tautological because the field converged on operationalizing a term that way for good practical reasons -- does the diagnostic apply the same way to both, or does intent/convergence change what's actually wrong?"
status: active
