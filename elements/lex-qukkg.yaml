id: lex-qukkg
name: played-status-is-independent-of-social-rank
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when reading a social interaction and the instinct is to ask 'who outranks whom' as if status were a fixed attribute assigned by role, wealth, title, or social position. Johnstone's claim, from years of actor training: status is not something you HAVE, it is something you DO — a continuous behavioral transaction expressed through posture, eye contact, inflection, timing, and movement, moment by moment, independent of social rank. 'Status is a confusing term unless it's understood as something one does... You may be low in social status, but play high, and vice versa.' A tramp can play high status against a duchess ('Are you deaf as well as blind?'); a duchess can play low. Audiences enjoy exactly this contrast (a tramp mistaken for the boss, or vice versa) because it exposes the split between the status you ARE (social position) and the status you PLAY (behavioral performance). The second, sharper claim: there is no way to opt out. 'A further early discovery was that there was no way to be neutral' — trying to be neutral is itself a status move (people in group photographs folding their arms and standing very straight are visibly performing 'not claiming more space than I'm entitled to' while also signaling 'not submissive either'), and the same 'neutral' greeting is read as lowering by one recipient and raising by another, because 'the messages are modified by the receivers.' Practitioner move: when analyzing an exchange, don't ask only 'what is their formal rank.' Ask 'what status is each party PLAYING right now, through which specific behavioral markers (eye contact held vs. broken-and-glanced-back, head stillness, speech hesitation, space occupied), and does the played status match or invert their social rank?' The mismatch, not the rank itself, is usually where the interesting information — and the comedy or tension — lives."
related: [lex-4txwf, lex-ysh6p, lex-pwhsd, lex-9nmeg]
evokes: [status-as-continuous-behavioral-transaction, played-status-versus-social-status, no-neutral-position-in-status-play, status-markers-eye-contact-posture-inflection, tramp-duchess-status-inversion]
lineage:
  - source: primary
    text: johnstone-1979-impro
    citation: "Keith Johnstone, *Impro: Improvisation and the Theatre* (Faber and Faber, 1979), STATUS section, Chapter 1 ('The See-saw') and Chapter 3 ('Teaching Status')."
    quote: "[On status as something done, not had:] 'Status is a confusing term unless it's understood as something one does. You may be low in social status, but play high, and vice versa. For example: TRAMP: 'Ere! Where are you going? DUCHESS: I'm sorry, I didn't quite catch... TRAMP: Are you deaf as well as blind? Audiences enjoy a contrast between the status played and the social status. We always like it when a tramp is mistaken for the boss, or the boss for a tramp... I should really talk about dominance and submission, but I'd create a resistance. Students who will agree readily to raising or lowering their status may object if asked to 'dominate' or 'submit'. Status seems to me to be a useful term, providing the difference between the status you are and the status you play is understood.' [On the impossibility of neutrality:] 'A further early discovery was that there was no way to be neutral. The 'Good morning' that might be experienced as lowering by the Manager, might be experienced as raising by the bank clerk. The messages are modified by the receivers. You can see people trying to be neutral in group photographs. They pose with arms folded or close to their sides as if to say 'Look! I'm not claiming any more space than I'm entitled to', and they hold themselves very straight as if saying 'But I'm not submissive either!' If someone points a camera at you you're in danger of having your status exposed, so you either clown about, or become deliberately unexpressive.' [On status as continuous, not conflict-only:] 'Suddenly we understood that every inflection and movement implies a status, and that no action is due to chance, or really 'motiveless'... Normally we are 'forbidden' to see status transactions except when there's a conflict. In reality status transactions continue all the time.' (Keith Johnstone, *Impro*, Chapter 1)"
  - source: discovery-loop
    text: johnstone-impro-mining-pass-
    citation: "Lex-0376 (Goffman, social-interaction-is-an-audience-managed-performance-of-self) is the closest thematic neighbor but names impression management toward an audience broadly, not the specific claim that status is a moment-to-moment behavioral transaction independent of social rank, with no neutral option available. Lex-1017 (the see-saw principle), lex-pwhsd (status specialization as defense), and lex-9nmeg (blocking versus accepting offers), minted from the same source, are each operationally distinct from this atom and from each other."
canonical-instances:
  - "The tramp/duchess exchange Johnstone gives verbatim: 'Ere! Where are you going?' / 'I'm sorry, I didn't quite catch...' / 'Are you deaf as well as blind?' — social rank (tramp vs. duchess) and played status (high vs. low) run in opposite directions, which is exactly what makes the exchange land."
  - "Johnstone's own account of misreading his own played status: 'I was astounded to find that when I thought I was being friendly, I was actually being hostile! If someone had said 'I like your play', I would have said 'Oh, it's not up to much', perceiving myself as 'charmingly modest'. In reality I would have been implying that my admirer had bad taste.' — a person can be systematically wrong about which status they are playing."
  - "The formal group photograph as a canonical 'attempted neutral' that fails: arms folded, back straight, deliberately unexpressive — every element of the pose is itself a status statement ('not claiming space' + 'not submissive'), demonstrating that opting out of status-play is not an available move."
  - "Two colleagues exchanging a routine 'Good morning' where one experiences it as the boss condescending (a lowering) and the other experiences the identical words as being treated as a peer (a raising) — the same signal, split by the receiver's position, illustrating that status is read relationally, not transmitted as a fixed value."
critical-questions:
  - "Isn't this just 'body language matters' repackaged with new vocabulary? The added claim is stronger and more specific: it isn't that behavior REVEALS an underlying, separately-existing status — it's that behavior IS the status, moment to moment, and can run independent of (even opposite to) the person's actual social rank. This predicts specific, checkable things body-language-awareness alone doesn't: e.g. that a 'neutral' stance is structurally impossible, and that the SAME behavioral signal will be read as raising by one receiver and lowering by another depending on their own position."
  - "If status can't be avoided, doesn't that make the concept unfalsifiable — everything becomes a status move by definition? Johnstone's claim is falsifiable at the level of PREDICTION, not detection: given a specific behavioral marker (held vs. broken eye contact, head stillness vs. movement, a short 'er' vs. a long one), the theory predicts a specific direction of status read, and Johnstone reports this was empirically testable with student groups (they consistently and independently identified the same status direction from the same marker). The unfalsifiable-sounding part is the ontological claim ('everything is status'); the testable part is the specific mapping between markers and status direction."
  - "Is 'played status' just a synonym for Goffman's impression management (lex-wnmfk)? Related but distinct in grain: Goffman's frame is about managing a coherent PERFORMANCE OF SELF for an audience over a social occasion (front-stage/back-stage). Johnstone's frame is about the moment-to-moment DIRECTION (up or down) of specific behavioral transactions, independent of whether any coherent self-presentation is intended — his students play status they don't consciously endorse or even recognize while doing it. Impression management presupposes an actor managing a front; status-play, per Johnstone, happens even when no management is occurring."
  - "Doesn't 'status' language risk flattening real power differences (a boss really can fire you) into a symmetric game? Johnstone's own examples keep the two axes explicit and separate — social status (which the boss objectively has) and played status (which either party can perform independent of that fact) — precisely so the real asymmetry (who can fire whom) isn't confused with the moment-to-moment behavioral game (who is currently playing dominant in the conversation). The atom's value is in NOT collapsing the two; collapsing them would be the misreading, not the atom's claim."
