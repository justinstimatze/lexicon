  - source: primary
    text: radin-trickster-overrides-woodpeckers-instructions-to-his-child-messenger
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 43. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Thereupon the woodpecker said to one of his children, 'Take this mitten over to your uncle but stop some distance away and throw it at him. He talks a good deal.' Then the child went over there and stopped and wanted to throw it over but Trickster said, 'Here, here! Bring it over, my child, for I dread to turn back and that is why I asked you to bring it over to me.' So he took it over to him. ... 'Now, that is exactly why I wanted you not to go too near him and throw the mitten at him,' replied the father."
canonical-instances:
  - "A company briefs a new employee to keep interactions with a known difficult client short and to escalate any complicated requests to a manager, and when the client politely insists on 'just a quick clarifying call, no need to bother anyone else,' the employee agrees, ending up committed to exactly the extended, unauthorized negotiation the briefing was meant to prevent."
  - "A parent tells a child not to accept rides from a particular relative under any circumstances and to just say they already have a ride home, and when the relative shows up and simply asks the child to 'just wait five minutes while I grab my keys,' the child, not wanting to seem rude, waits, and ends up in the car anyway."
critical-questions:
  - "Would a stricter instruction, such as not approaching Trickster within speaking distance at all, have been effective where 'stop some distance away and throw it' failed, or does Trickster's specific counter-request, framed as a personal reluctance rather than a demand, work regardless of how the original instruction was worded?"
  - "Is the child at fault here for complying with the countermanding request, or does the story present this as an unwinnable position for any messenger facing a direct, reasonable-sounding appeal from an adult relative in person?"
  - "Does the father's frustration, 'that is exactly why I wanted you not to go too near him,' suggest he anticipated this exact failure mode and simply didn't brief the child on how to handle it, or does it suggest he believed the instruction alone would be sufficient regardless of what Trickster said in person?"
