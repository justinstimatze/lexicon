canonical-instances:
  - "An accountant who quietly rounded one expense in her own favor catches herself in an evening review, and rather than dismissing it as trivial, treats it as the exact habit that turns into real fraud if it goes unaddressed once."
critical-questions:
  - "Is the compounding-risk premise actually true of every small transgression, or does treating every minor lapse as a slippery slope risk manufacturing anxiety about acts that would never have escalated on their own?"
