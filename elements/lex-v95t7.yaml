id: lex-v95t7
name: observer-cues-leak-the-expected-answer-which-subjects-then-produce
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an observer (experimenter, teacher, grader, interviewer, judge, evaluator) ALREADY KNOWS the answer they expect to see, and the subject (a person, an animal, a student, a candidate, a model) is in a position to track the observer's nonverbal-or-environmental cues (posture, breath-hold, eye-contact-release, tension-release, head-nod, prosodic emphasis, micro-timing of next prompt, paralinguistic affirmation), the cues will leak the expected answer and the subject will produce it — WITHOUT the subject possessing the claimed underlying ability and WITHOUT either party being aware that the cue-channel is doing the work. The canonical case is Clever Hans (1900-1907): a horse appeared to perform arithmetic, calendar arithmetic, and complex calculations by hoof-tapping, until Oskar Pfungst's controlled study showed that Hans was tracking near-imperceptible posture-and-breath changes in the questioner that occurred at the correct tap count; when the questioner did not know the answer, Hans's accuracy collapsed to chance. The transferable mechanism is general. WHEREVER (a) an observer knows the target outcome, (b) the subject can detect cues from the observer or environment, and (c) the cues correlate with the target, the subject will appear to demonstrate the underlying ability that the test was supposedly measuring. The appearance does not require any conscious cueing by the observer — the cue-leak is usually unconscious on both sides, which is precisely what makes the artifact so hard to detect. The methodological-design implication is the double-blind procedure: BOTH the immediate evaluator AND the subject must be ignorant of the target outcome at the moment of measurement, AND any environmental correlate of the target must be controlled-for. Transferable applications: animal-cognition research (the Pfungst critique that established double-blind methodology in comparative psychology); pharmacology (placebo-controlled and double-blind trial design); parapsychology and dowsing debunking (subjects often track unconscious observer cues rather than the claimed sense); courtroom witness identification (the witness can track which lineup-position the detective is watching most intently); standardized-test grading (when graders know the candidate's identity, performance scores systematically reflect grader-expectation rather than candidate-output — the Rosenthal-Jacobson 1968 Pygmalion-in-the-classroom finding); educational-psychology RCTs (the teacher's expectation of student-performance leaks via classroom interaction to produce the predicted outcome); peer-review (signed reviews reproduce reviewer-expectation-effects that blind review reduces); AI-evaluation (when a human grader scores model outputs while knowing which model produced them, the score is contaminated by the grader's prior expectation of the model's quality — the brand-blind eval is the AI-domain double-blind). The practitioner-discipline is two-part. FIRST: when an experimental result claims that a SUBJECT demonstrates ABILITY X, ask whether the observer knew the target answer and whether any cue-channel from observer to subject was available. If yes, the result does not establish X — it could equally be cue-tracking. SECOND: at design time, structure the protocol so the immediate evaluator does not know the target outcome and the subject has no environmental correlate to track. Most claims that survive cue-channel critique survive blind protocols; most claims that don't, don't. The atom does NOT advise that all expectation-driven effects are illusory or that subjects never possess the claimed ability. It advises that cue-channels must be RULED OUT before the claimed ability can be inferred — and that double-blind protocols are the rule-out procedure."
