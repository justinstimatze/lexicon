    citation: "Stanislas Dehaene, *The Number Sense: How the Mind Creates Mathematics* (Oxford University Press, revised ed. 2011; orig. 1997). The three-stage architecture (animal approximate competence -> infant number sense -> culturally-invented symbolic mathematics) is stated as the book's organizing discovery in the Preface to the Second Edition (2010) and previewed in the Preface to the First Edition (1996). The mechanism itself — a phylogenetically ancient, non-linguistic 'accumulator' module that represents quantity as one more perceptual dimension alongside color, shape, and position — is introduced in the Introduction and grounded in Tobias Dantzig's 1954 coinage of 'Number Sense,' with the historical note that Dantzig's claim was vindicated only after Piagetian constructivism (which denied infants any numerical competence) was empirically refuted. Chapter 1, 'Talented and Gifted Animals,' develops the accumulator mechanism in full via the Robinson Crusoe metaphor and documents its two empirical signatures — the distance effect and the magnitude effect — from rat- and pigeon-arithmetic experiments. Chapter 2, 'Babies Who Count,' extends the same accumulator to pre-verbal 6-month-old human infants. Chapter 3, 'The Adult Number Line,' documents traces of the same approximate system still operating in numerate adults (subitizing, automatic magnitude comparison). Chapter 5, 'Small Heads for Big Calculations,' uses the same architecture to explain ordinary innumeracy as a failure of arbitration between the accumulator circuit and later-acquired symbolic circuits. Chapter 7, 'Of Neurons and Numbers,' section 'Losing Number Sense,' presents the clinical case of 'Mr. N, the Approximate Man' — a patient with a left-hemisphere lesion who lost exact calculation ('2+2') while retaining approximate estimation and magnitude comparison intact — as direct neurological evidence that the two systems are dissociable, formally reported as Dehaene, S., & Cohen, L. (1991), 'Two mental calculation systems: A case study of severe acalculia with preserved approximation,' Neuropsychologia 29, 1045-1074."
    quote: "[Preface to the First Edition, the book's opening thesis:] 'WE ARE SURROUNDED by numbers... millions of years earlier still, long before the dawn of humankind, animals of all species were already registering numbers and entering them into simple mental computations. Might numbers, then, be almost as old as life itself? Might they be engraved in the very architecture of our brains? Do we all possess a \"number sense,\" a special intuition that helps us make sense of numbers and mathematics?' [Preface to the Second Edition, the three-stage architecture stated as the book's organizing discovery:] 'Animal research on number pointed to an age-old competence for processing approximate quantities. This \"number sense,\" which is also present in infants, gave humans the intuition of number. Cultural inventions, such as the abacus or Arabic numerals, then transformed it into our fully-fledged capacity for symbolic mathematics.' [Introduction, naming the mechanism:] 'One of the brain's specialized mental organs is a primitive number processor that prefigures, without quite matching it, the arithmetic that is taught in our schools. Improbable as it may seem, numerous animal species that we consider stupid or vicious, such as rats and pigeons, are actually quite gifted at calculation. They can represent quantities mentally and transform them according to some of the rules of arithmetic. The scientists who have studied these abilities believe that animals possess a mental module, traditionally called the \"accumulator,\" that can hold a register of various quantities. We shall see later how rats exploit this mental accumulator to distinguish series of two, three, or four sounds, or to compute approximate additions of two quantities. The accumulator mechanism opens up a new dimension of sensory perception through which the cardinal of a set of objects can be perceived just as easily as their color, shape, or position. This \"number sense\" provides animals and humans alike with a direct intuition of what numbers mean.' [Introduction, quoting Tobias Dantzig by name for the term itself:] 'Tobias Dantzig, in his book exalting \"number, the language of science,\" underlined the primacy of this elementary form of numerical intuition: \"Man, even in the lower stages of development, possesses a faculty which, for want of a better name, I shall call Number Sense. This faculty permits him to recognize that something has changed in a small collection when, without his direct knowledge, an object has been removed or added to the collection.\"' [Introduction, the historical correction and the infant evidence:] 'Dantzig wrote these words in 1954, when psychology was dominated by Jean Piaget's theory, which denied young children any numerical abilities. It took twenty more years before Piagetian constructivism was definitely refuted and Dantzig's insight was confirmed. All people possess, even within their first year of life, a well-developed intuition about numbers... Elementary additions and subtractions are already available to 6-month-old babies!' [Introduction, the accumulator's limits and the culture/language move beyond them:] 'In particular, their accumulator cannot handle discrete quantities, but only continuous estimates. Pigeons will never be able to distinguish 49 from 50, because they cannot represent these quantities other than in an approximate and variable fashion. For an animal, 5 plus 5 does not make 10, but only about 10: maybe 9, 10, or 11. Such poor numerical acuity, such fuzziness in the internal vision of numbers, prevents the emergence of exact arithmetical knowledge in animals. By the very structure of their brains, they are condemned to an approximate arithmetic. Humans, however, have been endowed by evolution with a supplementary competence: the ability to create complex symbol systems, including spoken and written language. Words or symbols, because they can separate concepts with arbitrarily close meanings, allow us to move beyond the limits of approximation... These labels, the most evolved of which are the Arabic numerals, can symbolize and discretize any continuous quantity... numbers acquire a life of their own, devoid of any direct reference to concrete sets of objects. The scaffolding of mathematics can then rise, ever higher, ever more abstract.' [Introduction, on the brain not containing a dedicated arithmetical unit beyond the accumulator:] 'Aside from the approximate accumulator that we share with rats and pigeons, our brain probably does not contain any \"arithmetical unit\" predestined for numbers and math. It compensates this shortcoming, however, by tinkering with alternative circuits that may be slow and indirect, but are more or less functional for the task at hand.' [Chapter 1, \"Talented and Gifted Animals,\" the Robinson Crusoe accumulator metaphor:] 'How could Robinson build an approximate calculator using only the makeshift means available to him?... He carves a tank from a large log, and places this accumulator next to the spring... With this rudimentary device, of which the accumulator is the central component, Robinson will be able to count, add, and compare approximate numerical magnitudes. In essence, the accumulator enables him to master arithmetic as well as a rat or a pigeon does... A clear drawback of the accumulator is that numbers, although they form a discrete set, are represented by a continuous variable: water level... Robinson clearly will be better able to discriminate numbers that are more different; this is the distance effect. This effect will be exacerbated as the numbers become larger, thus reproducing the magnitude effect.' [Chapter 1, on animals' representation being fuzzy rather than a cruder version of exact counting:] 'Whatever its exact neuronal implementation, if the accumulator model is correct, two conclusions must necessarily follow. First, animals can count, since they are able to increase an internal counter each time an external event occurs. Second, they do not count exactly as we do. Their representation of numbers, contrary to ours, is a fuzzy one.' [Chapter 7, \"Of Neurons and Numbers,\" the case of \"Mr. N, the Approximate Man\":] 'In experiment after experiment, a striking regularity emerges: Though Mr. N has lost his exact calculation abilities, he can still approximate... Mr. N does not know how to add 2 + 2. His random responses, 3, 4, or 5, testify to his profound acalculia. Yet he never offers a result as absurd as 9. Likewise, when presented with a slightly wrong addition, such as 5 + 7 = 11, he judges it to be correct more than half of the time... Yet, he can rapidly reject with total confidence and complete success a grossly false answer such as 5 + 7 = 19.' [Chapter 7, Dehaene's own explicit statement of the two-systems claim this atom names:] 'In earlier chapters, I drew a distinction between two categories of arithmetic skills: the elementary quantitative abilities that we share with organisms devoid of language, such as rats, apes, and human babies, and the advanced arithmetic abilities that rest on symbolic notations of numbers and on the strenuous acquisition of exact calculation algorithms. Mr. N's case suggests that those two categories rely on partially separate cerebral systems. One can be abolished while the other remains intact.' [Chapter 5, \"Small Heads for Big Calculations,\" the innumeracy passage, on the two systems failing to communicate in ordinary numerate adults:] 'We are born with an \"accumulator circuit\" that endows us with intuitions about numerical quantities. With language acquisition, several other circuits that specialize in the manipulation of number symbols and in verbal counting come into play... Innumeracy occurs because these multiple circuits often respond autonomously and in a disconcerted fashion... Children are left at the mercy of their arithmetical reflexes. Regardless of whether they are learning to count or to subtract, they focus on calculation routines and fail to draw appropriate links with their quantitative number sense.'"
