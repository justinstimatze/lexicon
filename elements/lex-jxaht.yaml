lineage:
  - source: primary
    tradition: sennett-craft
    text: sennett-2008-the-craftsman
    citation: "Richard Sennett, The Craftsman (Yale University Press, 2008), Prologue."
    quote: "[Sennett's guiding intuition, recounted in the Acknowledgments:] 'Making is thinking.'"
  - source: primary
    tradition: sennett-craft
    text: sennett-2008-the-craftsman
    citation: "Richard Sennett, The Craftsman (Yale University Press, 2008), Prologue (the dialogue claim)."
    quote: "The Craftsman explores these dimensions of skill, commitment, and judgment in a particular way. It focuses on the intimate connection between hand and head. Every good craftsman conducts a dialogue between concrete practices and thinking; this dialogue evolves into sustaining habits, and these habits establish a rhythm between problem solving and problem finding. The relation between hand and head appears in domains seemingly as different as bricklaying, cooking, designing a playground, or playing the cello — but all these practices can misfire or fail to ripen. There is nothing inevitable about becoming skilled."
  - source: primary
    tradition: sennett-craft
    text: sennett-2008-the-craftsman
    citation: "Richard Sennett, The Craftsman (Yale University Press, 2008), Prologue (10000 hours)."
    quote: "All craftsmanship is founded on skill developed to a high degree. By one commonly used measure, about ten thousand hours of experience are required to produce a master carpenter or musician. Various studies show that as skill progresses, it becomes more problem-attuned, like the lab technician worrying about procedure, whereas people with primitive levels of skill struggle more exclusively on getting things to work. At its higher reaches, technique is no longer a mechanical activity; people can feel fully and think deeply what they are doing once they do it well."
canonical-instances:
  - "A senior surgeon who has internalized tens of thousands of small decisions about tissue resistance, suturing angle, anatomical variation — the tacit knowledge is in the hand, accessible only via continued operation, not retrievable by lecture."
  - "A jazz musician who has practiced enough that improvisation feels effortless — the hand-head dialogue has accumulated into sustaining habit; the rhythm between problem-finding (what should I play here?) and problem-solving (this voicing) operates below conscious awareness."
  - "An open-source maintainer who has merged thousands of PRs and developed pattern-recognition for security-relevant changes, scalability traps, breaking-change risks — knowledge the maintainer can't fully articulate but can reliably apply."
  - "A parent of a third child whose intuitions about sleep, feeding, behavior modes have accumulated tacitly across years — and whose advice to a first-time parent often comes out wrong because the articulation lags behind the practiced knowledge."
  - "A programmer who has debugged in a particular ecosystem for years — has a 'feel' for which class of error to suspect first, where to look. Hard to teach; transmitted mostly by pair programming, code review, and watching the senior in action."
  - "A teacher across years in the same classroom — accumulating tacit knowledge about which moments are interventional, how to read a room, when to push and when to back off. Distinct from the 'theory' of pedagogy taught in education programs."
