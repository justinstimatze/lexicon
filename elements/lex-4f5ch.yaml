id: lex-4f5ch
name: calling-a-recent-rule-a-law-of-nature-borrows-false-permanence
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A culture can justify an economic or social outcome by invoking it as an inevitable 'law of nature' -- something as fixed and eternal as physics. A simple, naive question from an outside audience about how old these laws actually are can reveal they are recent, locally-invented legal or economic conventions, sometimes only decades old, dressed in the borrowed authority and permanence of natural law to make a recent human choice look like an unchangeable fact about reality. Gilman stages the deflation directly: Van explains poverty as governed by 'the laws of nature.' 'These \"laws of nature,\"' Zava gently asked, '\"are they all the laws you have?\"... \"Oh no,\" Moadine told him. \"We have no laws over a hundred years old, and most of them are under twenty.\"'"
related: []
evokes: [herland, chapter-6, are-they-all-the-laws-you-have, no-laws-over-a-hundred-years-old, natural-law-framing-hides-a-recent-invention]
lineage:
  - source: primary
    text: gilman-1915-herland-chapter-6
    citation: "Charlotte Perkins Gilman, Herland (1915), Chapter 6, 'Comparisons Are Odious.' Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "I explained that the laws of nature require a struggle for existence, and that in the struggle the fittest survive, and the unfit perish. [...] \"These 'laws of nature,'\" Zava gently asked, \"are they all the laws you have?\" \"I should say not!\" protested Terry. \"We have systems of law that go back thousands and thousands of years--just as you do, no doubt,\" he finished politely. \"Oh no,\" Moadine told him. \"We have no laws over a hundred years old, and most of them are under twenty.\""
canonical-instances:
  - "A tech executive defends mass layoffs as an inevitable law of the market, until an outside journalist's simple question about when this particular hiring-and-firing model became standard practice reveals it dates back only to a specific management theory popularized within the last twenty years."
  - "A country's officials describe a strict property inheritance rule as a timeless, natural principle of ownership, until a visiting scholar's basic question about the rule's actual legal history reveals it was written into law less than a century ago, replacing a very different system that had stood for centuries before it."
  - "A company insists its rigid nine-to-five office schedule is simply how productive work naturally happens, until a new employee's innocent question about the rule's origin reveals it was set by a single manager's preference three years earlier, with no connection to any established practice at all."
critical-questions:
  - "Does revealing that a 'law of nature' is actually a recent invention automatically mean the rule is wrong or should change, or can a recently-invented rule still be the best available rule, with its youth being irrelevant to its merit?"
  - "Is age itself a reliable signal of anything -- does a genuinely ancient rule deserve more deference than a recent one, or is the whole framing of 'how old is it' a distraction from asking whether the rule actually produces good outcomes?"
  - "How would you distinguish a case where 'law of nature' language is being used as a deliberate rhetorical borrowing of permanence from a case where the speaker genuinely, sincerely believes the rule reflects an actual law of nature and isn't aware they're borrowing anything?"
status: active
