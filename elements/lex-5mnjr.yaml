canonical-instances:
  - "A mid-sized company forming a joint venture chooses to bring in two smaller partners of comparable combined strength rather than one much larger partner who could have contributed the same total resources alone, specifically because the larger partner would have effectively controlled key decisions, while the two smaller partners can each be given separate workstreams and neither can dominate the arrangement or defect without the other two being able to respond jointly."
  - "A political coalition of three roughly equal regional parties proves more stable and harder for any single member to hijack than an earlier two-party coalition where one partner was significantly larger, because in the three-party arrangement any one party's attempt to break ranks or extract disproportionate concessions can be checked by the other two acting together, whereas in the two-party case the larger partner's defection had no internal counterweight."
critical-questions:
  - "does this principle assume the two equal (or two weaker) partners will actually cooperate against a defector when the moment comes, rather than each calculating their own separate advantage -- what happens if the 'other two' have reasons of their own not to suppress the treacherous party, leaving the mutual-check mechanism theoretical rather than real?"
  - "is total coalition strength ever underweighted by this framework -- a coalition of two weaker partners preserves control but may simply be too small, in absolute terms, to accomplish an objective that partnering with one genuinely stronger ally could have achieved, meaning the control benefit could come at the cost of the venture's actual success?"
  - "does delegating separate tasks to multiple weaker partners to 'keep them under control' risk fragmenting the joint effort into uncoordinated pieces that don't actually combine into a coherent outcome, especially if the tasks were divided primarily to preserve the leading party's control rather than to match each partner's genuine comparative strength?"
