id: lex-j929z
name: processing-effort-as-relevance-cost
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When choosing among interpretations, expect the listener to pick whichever pays off fastest in inference. Processing effort is a relevance cost: the more inference required, the less likely that interpretation. Make the intended reading easy to derive."
related: [lex-jv983, lex-u74ex, lex-k6d7u, lex-e2tnt, lex-bd324, lex-xhvgy, lex-n6t4u, lex-5mv6r, lex-xfda8]
evokes: [effort-as-the-cost-side-of-relevance, effect-per-effort-as-comparative-relevance, same-effect-less-effort-wins, ordinal-not-cardinal-relevance, avoidable-effort-is-what-counts]
lineage:
  - source: primary
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard UP / Blackwell 1986; 2nd ed. 1995). Chapter 3 §2 'Degrees of relevance' (p.125-131) introduces processing effort as the second axis of relevance, alongside contextual effects. Definition (10) reformulates relevance with two extent-conditions: (1) more contextual effects = more relevant, (2) less processing effort = more relevant. The chapter explicitly frames this as 'balancing output against input' — the productivity analogy. The cost-side completes the relevance economy started by Ch.3 §1's effect-side criterion (lex-xhvgy). Verified verbatim 2026-05-20 (Ch.3 §2 p.125-130 OCR'd page text; filename = printed-page + 10 offset confirmed via per-page file headers)."
    quote: "(10) Relevance: Extent condition 1: an assumption is relevant in a context to the extent that its contextual effects in this context are large. Extent condition 2: an assumption is relevant in a context to the extent that the effort required to process it in this context is small. [Ch.3 §2 p.125 — the two-extent-conditions definition that completes relevance theory's effect-effort economy.] The assessment of relevance, like the assessment of productivity, is a matter of balancing output against input: here contextual effects against processing effort. [Ch.3 §2 p.125 — the productivity analogy that names effect as output and effort as input.] When (13) and (16) are processed in the context (11a–c), they have exactly the same contextual effects: the extra information conveyed by (16) is utterly unrelated to the context and has no contextual effect whatsoever. However, this extra information requires some extra processing effort: (16) introduces more conceptual material, and hence more deductive rules and matching procedures. By our definition of relevance, (16) should thus be less relevant than (13), which achieves the same contextual effects with a smaller processing effort. [Ch.3 §2 p.127 — the canonical demo: same effects + more effort = less relevant. The (16) wine-year non-sequitur is the workhorse example.] We too will consider only processing effort which results in a contextual effect, and will discount processing effort which results from the fact that a contextual effect has been obtained. [Ch.3 §2 p.127 — the asymmetry: only AVOIDABLE effort counts as cost-side; effort that is itself the price of an obtained effect is part of the effect, not part of the cost.] Things go differently when it comes to assessing contextual effects achieved by human minds, and the processing effort needed to achieve them. On the contextual-effects side, we have argued that non-quantitative confirmation values are involved. If so, then these effects cannot be measured. On the processing-effort side, the prospects for quantitative assessment are no better. [Ch.3 §2 p.130 — the explicit declaration that effect and effort are ordinal not cardinal; relevance is comparative but not quantitative for human minds.]"
  - source: practitioner
    text: sperber-wilson-mining-pass-1
    citation: "promoted from cross-attestation: information theory and channel-symmetry critique (Shannon's 1948 information measure is channel-symmetric: it counts the message-side novelty but not the receiver-side decoding cost. S&W's effort-axis reintroduces the asymmetric receiver-cost that Shannon's framework elides; long redundant transmissions of the same information have identical Shannon-content but worse relevance because the decoder pays more), code review and design-doc craft (a review comment that delivers a correction in one sentence is more relevant than one that delivers the same correction in five paragraphs — the longer comment imposes higher reader-effort with no additional contextual effect. Effort-as-cost is what makes concision a virtue rather than a stylistic preference), AI alignment and LLM evaluation (the fluency-trap pairing with lex-jv983: high-fluency low-effect responses are effort-without-effect — they impose reading cost without yielding contextual implications, strengthenings, or contradictions. Effort-as-cost names the discount that should apply to them; lex-jv983 names the cognitive failure-mode that fails to apply the discount), cognitive psychology and dual-process theory (Kahneman 2011 Thinking Fast and Slow §System 2 'cognitive effort': mental work is metabolically costly; the brain conserves effort by defaulting to heuristic processing. S&W's effort-axis is empirically grounded in this load-aversive cognitive architecture — minds genuinely do discount high-effort assumptions), software design and API ergonomics (an API that yields the same functional output with fewer mental operations on the caller's side is more relevant — same effect, less effort. The cognitive-effort framing explains why 'easy to misuse' APIs are bad even when functionally complete: misuse risk = effort spent guarding against errors = avoidable effort with no effect-contribution). Cross-domain attestation across information theory, code review, AI alignment, cognitive psychology, and software ergonomics"
canonical-instances:
  - "the (13) vs (16) example from Ch.3 §2 p.127: assumption (13) 'Bill, who has thalassemia, is getting married to Susan' and assumption (16) 'Bill, who has thalassemia, is getting married to Susan, and 1967 was a great year for French wines' have IDENTICAL contextual effects in context (11a-c) — the wine-year addition has zero contextual effect because it doesn't connect to any context-element. But (16) requires strictly more processing effort: more conceptual material, more deductive rules to try, more matching procedures to fail. The definition therefore predicts (16) is less relevant than (13); intuition agrees. This is the canonical workshop demo of effort-without-effect causing relevance-loss"
  - "the (18) vs (23) example from Ch.3 §2 p.129: assumption (18) 'Sue is richer than Jim' and assumption (23) 'Sue is richer than Peter or she is richer than Jim' have the SAME contextual effect (strengthening (17f) from very-weak to weak) but (23) requires extra processing — a series of deductive steps to reject the first disjunct before processing the second. Definition predicts (23) is less relevant than (18); intuition agrees. The disjunction is effort-without-effect"
  - "code review: a comment that delivers a needed correction in one sentence is more relevant than a comment that delivers the same correction wrapped in five paragraphs of context. Both achieve the same contextual effect (the correction); the longer comment imposes higher reader-effort. lex-j929z is why 'be concise' in style guides is not a stylistic preference but a relevance-maximizing principle: at fixed effect, lower effort wins. This generalizes: any communication that delivers fixed information with lower decoding cost is more relevant"
  - "LLM response evaluation: a 200-word response that conveys the same insight as a 50-word response scores lower on relevance per S&W's framework, even though both deliver identical contextual effects. Concision is relevance-maximization. This is the operational backbone of the 'short answers preferred when sufficient' rubric in many evaluation frameworks; lex-j929z names the underlying claim"
  - "fluency-trap pairing with lex-jv983: a fluently-written response that produces zero contextual effects (no implications derivable, no credences strengthened, no contradictions to existing context) is pure effort-without-effect. lex-jv983 names the cognitive failure-mode (mistaking fluency for substance); lex-j929z names the discount that SHOULD apply to such responses (high effort, zero effect, therefore low relevance). The pair: lex-jv983 is the failure to apply the discount; lex-j929z is the discount itself"
  - "API ergonomics: an API call that achieves a goal with fewer mental operations on the caller's side is more relevant than one that achieves the same goal with more operations. 'Pit-of-success' API design is effort-minimization at fixed effect; the cognitive cost of guarding against misuse is avoidable effort that lex-j929z says should subtract from relevance. This is why an API that requires five careful steps to use correctly is worse than one that requires two, even if both produce the same output"
  - "operationally distinct from lex-xhvgy contextual-effects-as-relevance-currency (the effect-side): lex-xhvgy says 'has any effect → relevant'; lex-j929z says 'among effect-having assumptions, lower effort → more relevant.' lex-xhvgy is the necessary qualifier (the gate); lex-j929z is the comparative measure (the ordering). They are matching halves of the relevance economy from Ch.3 §1 + §2, and only together yield the full relevance criterion. Composing them is the use-time operation; the atoms are inert in isolation"
  - "operationally distinct from lex-u74ex spotlight-choice (the OPERATION of picking what to attend): lex-u74ex already names 'contextual-effect-vs-processing-effort' in its evokes list, but lex-u74ex is the choice-act, not the cost-axis. lex-j929z names the cost-axis itself — the variable that the spotlight-choice trades off against effect. lex-u74ex chooses; lex-xhvgy + lex-j929z are the two axes the choice is made along"
  - "operationally distinct from lex-k6d7u credence-as-graded-belief (the STORAGE substrate): lex-k6d7u is graded belief as a representation; lex-j929z is processing-effort as a cost on update-operations over that representation. A credence-update that requires lots of inference-steps is more effortful than one that requires few; lex-j929z names this cost. lex-k6d7u is the data; lex-j929z is one of the costs of operating on it"
  - "indispensable edge case — the avoidable-vs-unavoidable distinction (Ch.3 §2 p.126-127): processing effort that is the price of an obtained contextual effect is NOT counted as cost-side — only AVOIDABLE effort (effort that could have been spared while keeping the effect) counts. So lex-j929z is not 'raw processing cost'; it's 'wasted processing cost beyond what the effect requires.' The implication: a long inference chain that derives a non-obvious useful conclusion is not low-relevance via effort; only padding and irrelevance count"
critical-questions:
  - "the two-vs-more-axes test: are effort and effect really only two axes, or is there a third? S&W argue only two. Empirically contestable; competing accounts (Grice's cooperative principle with multiple maxims; Wilson-Sperber 1995 update on cognitive efficiency) propose variants. The atom holds at the two-axis level; further axes can be additional atoms"
  - "the measurability check: is effort measurable, or only ordinally comparable? S&W p.130: effort and effect are not given units; treated ordinally in examples, not cardinally. Cardinal quantification (counting inference steps; LLM token-count / latency / depth-of-reasoning) is open engineering; these are PROXIES, not direct measurements. Practitioner-discipline: don't claim cardinal precision the framework doesn't support"
  - "the receiver-relativity check: does the effort-axis cause relevance to become receiver-relative? Yes, explicitly: same assumption requires different processing effort from different receivers depending on cognitive environment (lex-e2tnt) and prior assumptions. Relevance is triply-relational: function over (assumption, receiver-state, context)"
  - "the speaker-side application: when designing utterances (rhetoric, writing, teaching, UI copy), how do you minimize processing-effort for the intended audience while preserving contextual-effect? Practitioner-discipline: for each utterance, name target audience's cognitive-environment, estimate effort, look for lower-effort variants preserving effect"
status: active
