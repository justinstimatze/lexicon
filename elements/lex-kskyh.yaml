id: lex-kskyh
name: relocating-the-criterion-of-judgment-from-appearance-to-conduct-defangs-an-insult
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'An insult aimed at a fixed, unchosen attribute can be defused not by denying the attribute but by substituting a different criterion of judgment entirely, one the speaker cannot easily contest, so the insult''s premise simply stops applying. In the Jataka''s tale of Kanha, the ascetic answers an insult about his skin color by relocating the standard from complexion to sin: "Though black of hue, a brahmin true at heart, O Sakka, see: Not by the skin, but if he sin, then black a man must be."'
related: []
evokes: [jataka, dasanipata, kanha-jataka, reframing-the-criterion, defusing-an-insult]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 440, Kanha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Though black of hue, a brahmin true at heart, O Sakka, see: Not by the skin, but if he sin, then black a man must be."
canonical-instances:
  - "Told her accent makes her sound unintelligent in meetings, an engineer replies by pointing to the shipped code under her name rather than defending or apologizing for the accent, relocating the standard of judgment entirely."
critical-questions:
  - "Does relocating the criterion of judgment actually neutralize the insult for observers, or does it only satisfy the person who deployed the reframe?"
status: active
