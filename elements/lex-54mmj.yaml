id: lex-54mmj
name: point-in-time-samples-are-wrongly-generalized-into-contradicting-wholes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Observing the same object at different points in time, without asking about the other times, can produce descriptions so different that observers conclude they must be describing different things entirely, when the real error is treating one sampled moment as if it were the whole timeline. In the Jataka's tale of the four princes and the Judas tree, each is shown the same tree at a different stage — budding, leafing, flowering, fruiting — and their descriptions contradict each other so completely they nearly come to blows over which is right. Their father names the actual gap: 'All four of you have seen the tree. Only when the charioteer showed you the tree, you did not ask him 'What is the tree like at such a time?' or 'at such another time?' You made no distinctions, and that is the reason of your mistake.' Nobody lied here, and nobody misperceived anything. Each sample was accurate for its own moment. The only failure was never asking whether the sampling moment itself needed specifying."
related: []
evokes: [jataka, dukanipata, kimsukopama-jataka, temporal-sampling-mistaken-for-a-complete-description, failing-to-ask-about-the-sampling-frame-produces-false-contradiction]
