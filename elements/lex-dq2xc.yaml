  - source: primary
    text: hyde-trickster-creates-the-heaven-earth-divide-he-later-bridges-as-messenger
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Introduction. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In several mythologies, for example, the gods lived on earth until something trickster did caused them to rise into heaven. Trickster is thus the author of the great distance between heaven and earth; when he becomes the messenger of the gods it’s as if he has been enlisted to solve a problem he himself created."
canonical-instances:
  - "A consultant whose reorganization advice fractures communication between two departments later gets hired, at a premium rate, as the specialist who facilitates cross-department coordination, becoming indispensable specifically because of the dysfunction their own earlier work introduced."
  - "A politician whose rhetoric deepens a rift between two constituencies later runs a successful campaign positioning themselves as the only candidate who can unite the two sides, their perceived value as a unifier resting entirely on a division their own earlier words helped widen."
critical-questions:
  - "Does this pattern require deliberate intent, the figure engineering the separation specifically to become indispensable afterward, or does it also apply to cases where the separation was an unintended consequence that the figure only later capitalized on?"
  - "Is there a meaningful difference between a figure who is uniquely positioned to bridge a gap because of prior involvement in creating it, versus a figure who is simply the best-suited bridge-builder regardless of origin, and how would an observer distinguish genuine expertise from opportunistic self-installation?"
  - "Does exposing this pattern actually reduce a figure's perceived indispensability, or does the practical need for someone to bridge the gap remain regardless of who caused it, meaning the diagnostic changes moral judgment without changing the practical reliance?"
