id: lex-gxnfd
name: swapping-positions-without-swapping-tastes-can-invert-justice
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a fairness or justice procedure asks you to imagine yourself in someone else's position, check whether it also asks you to imagine holding their preferences, not just their objective circumstances. Swapping the slot without swapping the palate can rank an outcome as more just even when it leaves everyone factually worse off. Suppes' 'grading principle of justice' does exactly this: it judges x more just than y if placing yourself in the other person's spot at x, evaluated by your OWN tastes, beats what you actually have at y. Sen's example: a devout Muslim who loves beef and is indifferent to how much disgusting pork he's given, and a devout Hindu with the mirror-image tastes. State y gives the Muslim 1 unit of beef and the Hindu 1 unit of pork -- both get what they like. State x gives the Muslim 2 units of pork and the Hindu 2 units of beef -- both get what disgusts them. By each person's own tastes, y beats x for everyone. But run Suppes' procedure: “The Muslim prefers (x, 2) rather than (y, 1), i.e. prefers to have 2 units of beef rather than having one unit of it. Also he is indifferent between (x, 1) and (y, 2), i.e., between having 2 units of pork and having 1 unit of it. Similarly, the Hindu prefers (x, 1) to (y, 2), and is indifferent between (x, 2) and (y, 1). So both find x to be preferable to y by the grading principle of justice. But y is Pareto-wise superior to x.” The Muslim ranks (x, 2) -- the Hindu's actual holding at x, two units of beef -- highly, because he evaluates it with his own love of beef, never mind that the Hindu holding it is disgusted by it. Sen's fix: 'Placing oneself in the position of the other should involve not merely having the latter's objective circumstances but also identifying oneself with the other in terms of his subjective features.' Diagnostic move: before trusting a procedure built on 'what if I were them,' check whether it swaps in their preferences along with their circumstances -- skip that step and the comparison reduces to you imagining a windfall of things you like landing in someone else's account, which says nothing about whether they'd want it."
