id: lex-7k8bd
name: substitutes-cap-your-price-regardless-of-your-category-dominance
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A dominant position within a narrowly-defined category provides no protection against a price ceiling set from OUTSIDE that category — a close substitute in an adjacent category caps what every player inside the category can charge, no matter how completely any single competitor has won the internal fight. Porter's 1979 analysis names the mechanism as external and category-agnostic: 'By placing a ceiling on prices it can charge, substitute products or services limit the potential of an industry. Unless it can upgrade the quality of the product or differentiate it somehow (as via marketing), the industry will suffer in earnings and possibly in growth. Manifestly, the more attractive the price-performance trade-off offered by substitute products, the firmer the lid placed on the industry's profit potential.' The ceiling is set by how good the substitute's price-performance trade-off is, not by anything happening inside the category — a company could hold 100% share of its narrow category and still be capped, because the constraint comes from a comparison customers make ACROSS categories, invisible to any analysis that only looks at internal competitive position. This is why internal market-share dominance is not a reliable predictor of pricing power: the relevant boundary for pricing analysis is often wider than the category the company competes 'within.' Generalize beyond substitute goods: a company with a complete monopoly on a specific software feature still can't charge much for it if a slightly-worse free alternative exists in an adjacent product, because customers compare across the boundary the company doesn't control; a restaurant that dominates its specific cuisine niche in a neighborhood still can't raise prices past what a nearby different-cuisine restaurant with a similar price-performance trade-off would draw customers to instead; a specialized consulting practice with no direct competitor in its exact niche still faces a price ceiling set by generalist consultants who could do an adequate-if-inferior job for less. The diagnostic move: before treating internal category dominance as pricing power, map the price-performance trade-off of the nearest cross-category substitute — that trade-off, not your position within your own category, is what actually bounds what you can charge."
