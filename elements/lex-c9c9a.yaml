id: lex-c9c9a
name: a-compressed-effort-before-a-deadline-voids-a-rivals-fait-accompli
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When rivals build a plan to seize a contested position on the explicit assumption that you lack a specific capability, and there remains any window before their plan executes, closing that exact gap before the deadline can void their plan entirely — even if the effort required is wildly disproportionate to how the gap would normally be closed. In the Jataka's tale of the young chaplain's son, rival brahmins maneuver the king into handing them a lucrative hereditary ceremony on the stated grounds that the rightful heir 'knows neither the three Vedas nor the lore of elephants.' With four days before the festival, he commits to the only intervention that can still work: 'our hereditary right we shall not lose. One day will take me to Takkasila; one night will be enough to teach me the three Vedas and the elephant lore; on the morrow I will journey home; and on the fourth day I will manage the elephant festival. Weep no more!' The rivals' entire scheme depended on the gap persisting through the festival date — closing it before that date, however extreme the method, doesn't just improve his odds, it removes their plan's stated justification altogether."
related: []
evokes: [jataka, dukanipata, susima-jataka, closing-the-exact-gap-a-rivals-plan-depends-on, disproportionate-effort-inside-a-real-deadline]
