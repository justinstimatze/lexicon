id: lex-7y8xx
name: appealing-to-a-captors-own-code-can-earn-release-where-pleading-cannot
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Someone caught by captors who hold a specific code of honor can secure release not by pleading for mercy, but by reframing their capture in terms that code already honors, so that releasing them becomes the action the captors' own values point toward. Sympathy is not the lever. Recognition is. In the Jataka's tale of the captured messenger, a parrot sent to steal a sacred mango is caught by goblins debating how to kill him. Rather than begging, he speaks their language directly: 'Well, you have one king for your master, and I have another for mine. The king of Benares sent me here to fetch a fruit of the middle mango tree. Then and there I gave my life to my king, and here I am. He who loses his life for parents or master is born at once in heaven. Therefore I shall pass at once from this animal form to the world of the gods!' The goblins release him, moved by exactly the value system that was about to justify killing him."
