    quote: "O Elephant, a hero thou, whose home is in the field: There stands the gate before thee now: why dost thou turn and yield? Make haste! break through the iron bar, and beat the pillars down! Crash through the gates, made fast for war, and enter in the town!"
canonical-instances:
  - "A surgeon who freezes before a high-stakes procedure they've performed a hundred times unfreezes the moment a colleague says only, 'You're the best hands in this hospital for exactly this,' when a detailed risk briefing moments earlier had done nothing."
critical-questions:
  - "Does this kind of appeal actually work on the underlying fear, or does it just override the fear's behavioral output for the moment it takes to act — could the elephant freeze again the very next time, or has something more durable actually shifted?"
  - "Is there a risk in relying on identity-appeals to push someone past a fear that was actually tracking a real danger — does 'a hero wouldn't hesitate' ever talk someone into a genuinely bad decision rather than a merely uncomfortable one?"
status: active
