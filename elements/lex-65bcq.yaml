id: lex-65bcq
name: an-overspecified-question-blocks-the-reformulation-that-would-answer-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an investigation stalls despite good data and careful method, check whether the original question was accepted as already correctly framed rather than examined as one candidate framing among several. Merton reports his own research team doing exactly this: 'it was assumed that the problem had been adequately stated at the outset. Do the readers of this magazine disproportionately comprise people of influence and, in any case, do influentials put the magazine to different uses than do rank-and-file readers? Actually, this was a premature specification of the problem, as we realized only after the pilot study had been under way for some time.' The fix wasn't better data or a different method on the same question — it was replacing the question itself: 'The major shift in this study... occurred with the recognition that the practical problem had been overspecified in its initial formulation. This overspecification for a time diverted our attention from salient alternatives of investigation. Only when the initial problem had been reformulated, only when the search for means of identifying influentials was converted into a search for types of influentials likely to differ in their communications behavior, did the research prove productive.' The diagnostic tell is a period of genuinely unproductive work despite competent execution — data that won't organize into any pattern, not because the data is bad but because the question is asking for the wrong kind of answer. Use this when a project has stalled: before adding more rigor to the current question, ask whether the question itself has been examined as a choice, or only inherited from how the problem first got stated."
related: [lex-mt5h4]
evokes: [merton-1957, premature-specification-of-the-problem, overspecification, rovere-study, conversion-of-applied-into-theoretic-research]
lineage:
  - source: primary
    text: merton-1957-premature-specification
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. X 'Patterns of Influence: Local and Cosmopolitan Influentials,' p.389. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'But, as is not infrequently the case, it was assumed that the problem had been adequately stated at the outset. Do the readers of this magazine disproportionately comprise people of influence and, in any case, do influentials put the magazine to different uses than do rank-and-file readers? Actually, this was a premature specification of the problem, as we realized only after the pilot study had been under way for some time.'"
  - source: primary
    text: merton-1957-overspecification-diverted-attention
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.389, continuing the same passage."
    quote: "'The major shift in this study, as we shall see, occurred with the recognition that the practical problem had been overspecified in its initial formulation. This overspecification for a time diverted our attention from salient alternatives of investigation. Only when the initial problem had been reformulated, only when the search for means of identifying influentials was converted into a search for types of influentials likely to differ in their communications behavior, did the research prove productive both in its applied and in its theoretic dimensions. Only then did data, not previously assimilable by our interpretative scheme, \"fall into place.\"'"
canonical-instances:
  - "A product team spends months trying to determine 'which onboarding flow converts better' with clean data and rigorous A/B testing that keeps returning a flat, uninterpretable result, until someone asks whether 'convert better' was ever the right question for a product whose real bottleneck was retention two weeks in — the reformulated question, not a better test of the old one, unlocks the answer."
  - "A hiring committee asks 'which candidate scored highest on the technical assessment' for months without the scores predicting who succeeds on the job, until someone reformulates to 'which candidates handled ambiguity well in the assessment' — the same interview transcripts, unproductive under the first question, immediately organize into a pattern under the second."
critical-questions:
  - "How does this differ from lex-mt5h4's claim that problem-framing is where values enter research? That atom is about whose interests an already-clear choice of question serves; this one is about a question being stuck at the wrong level of specificity regardless of whose interests are at stake — is there a case where a question is both value-neutral in Merton's Ch. VII sense and still overspecified in this Ch. X sense, or do the two failures always travel together in practice?"
  - "Is there a reliable signal that distinguishes 'this question is overspecified' from 'this question is simply hard, and more data or a longer study will eventually answer it' — since both look identical from the inside as a stretch of unproductive results, and reformulating a question that was actually fine wastes the work already invested in it?"
status: active
