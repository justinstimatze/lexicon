    text: jataka-chalmers1895-dasa-brahmana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XIV (Pakinnaka-Nipata), No. 495, Dasa-brahmana-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "These have no right to such a name: lost is their brahminhood: / Vidhura, find me other men who shall be wise and good, / Men free from deeds of evil lust, that they may eat my food."
canonical-instances:
  - "A foundation deciding who qualifies as a genuine 'community organizer' for a grant walks through every group that uses the title — paid canvassers, political operatives, social-media influencers, event planners — testing each against the single criterion of unpaid sustained relationship-building, rejecting all of them by name before awarding the grant to the one applicant who actually fits."
critical-questions:
  - "The king rejects each category on the same single ground (freedom from lust and evil deeds), never revising the criterion as new categories appear. What happens when the first plausible criterion turns out to be the wrong one partway through the enumeration — does the whole exhaustive-rejection structure have to restart, or can the criterion itself be corrected mid-list?"
  - "Nine counterfeits is a lot of ground to cover before finding one genuine case. Is the exhaustiveness itself doing real diagnostic work here, or would the same confidence in the final grant have been available after testing against just two or three of the closest-looking counterfeits?"
