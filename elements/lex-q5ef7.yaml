lineage:
  - source: primary
    text: kautilya-arthashastra-hide-the-countable-proxies-of-army-strength
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Base Camp to Battle Ground,' 'Protection,' {10.2.17-19}."
    quote: "'The enemy can ascertain the strength of the conqueror's army by counting it when they march in single file or from the quantity of fodder, food and bedding, or from the number of cooking fires, banners and weapons [the army carries]. Therefore, all of these shall be kept well hidden.'"
canonical-instances:
  - "A startup declining to disclose its exact headcount to a competitor still leaks the number through its office's parking lot occupancy, the size of its catered lunches, and how many badges scan in each morning -- a competitor watching any one of these can back-calculate roughly the same figure the company refused to state directly."
  - "A company trying to keep a product's real sales volume confidential controls the obvious disclosure (refusing to state unit sales) but overlooks that its warehouse's outbound shipping records, its packaging supplier's order volume, and its customer-support ticket volume all correlate closely enough with sales that a competitor monitoring any of them can reconstruct the number anyway."
critical-questions:
  - "how exhaustively can an organization actually enumerate every proxy that correlates with a sensitive number, given that new, unanticipated correlates (a supplier's public earnings call, a satellite image of a parking lot) can emerge from sources entirely outside the organization's control?"
  - "does controlling every countable proxy impose a cost -- operational rigidity, extra logistics, restricted visibility even to trusted allies -- that outweighs the value of keeping the underlying number secret in cases where the number isn't actually that consequential to protect?"
  - "does a sophisticated observer, aware that obvious proxies are being controlled, simply look for second-order proxies (the proxies of the proxies, like waste generated by controlling the primary proxies) -- does hiding countable signals have a natural stopping point, or does the concealment effort chase an ever-receding target?"
