id: lex-e8g7z
name: an-insiders-own-money-reveals-what-their-public-reassurance-hides
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an insider publicly vouches for an institution's soundness, check what they've actually done with their own stake in it -- private financial behavior is a more reliable signal than public reassurance, because the reassurance costs the speaker nothing while moving their own money costs them something real. As president of the failing Freedmen's Savings Bank, Douglass discovered this contradiction directly among its own trustees: 'those trustees who wished to issue cards and publish addresses professing the utmost confidence in the Bank, had themselves not one dollar deposited there. Some of them, while strongly assuring me of its soundness, had withdrawn their money and opened accounts elsewhere.' The mechanism doesn't require catching anyone in an outright lie about the institution's condition -- a trustee can honestly believe every word of a public reassurance while still quietly protecting their own money against the possibility they're wrong, and the second behavior is the one that reveals their actual, operative estimate of the risk."
