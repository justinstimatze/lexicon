id: lex-pfn7f
name: deferring-persuasion-until-the-targets-ambition-has-run-its-course
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Rather than argue against someone's ambition at its peak, when success still feels unproven and every counterargument reads as envy or naivety, a persuader can deliberately wait until the ambition has been fully achieved and lived with long enough to reveal its own limits — at which point the same message lands as confirmation rather than contradiction. In the Jataka's tale of Citta and Sambhuta, the ascetic Citta could visit his brother the moment he becomes king, but calculates the timing instead: \"Wise Citta, in his dwelling place in Himalaya, wondered whether his brother Sambhuta had assumed the Umbrella, or not. Perceiving that he had, he thought, 'I shall never be able to instruct a young ruler; but when he is old, I will visit him, and persuade him to be an ascetic.' For fifty years he went not, and by that time the king was increased with sons and daughters.\" Only once decades of rule have run their course does he approach."
related: []
evokes: [jataka, visatinipata, citta-sambhuta-jataka, timed-persuasion, wait-for-disillusionment]
lineage:
  - source: primary
    text: jataka-rouse1901-citta-sambhuta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XV (Visati-Nipata), No. 498, Citta-Sambhuta-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Wise Citta, in his dwelling place in Himalaya, wondered whether his brother Sambhuta had assumed the Umbrella, or not. Perceiving that he had, he thought, 'I shall never be able to instruct a young ruler; but when he is old, I will visit him, and persuade him to be an ascetic.' For fifty years he went not, and by that time the king was increased with sons and daughters."
canonical-instances:
  - "A mentor watches a former student chase a startup acquisition for years without saying a word against it, and only offers a candid conversation about what actually made them happy once the acquisition has closed and the student is visibly restless six months later."
  - "A parent stops arguing against a child's determination to go into a competitive, precarious creative field at eighteen, calculating that any warning now will just harden the resolve, and instead waits to have the honest conversation until the child has spent a few years living the reality of it."
critical-questions:
  - "Citta's fifty-year wait costs Sambhuta five decades he could have spent differently if the persuasion had landed earlier. Who bears the cost of the delay, and is it always the same person who benefits from the eventual persuasion succeeding?"
  - "The plan depends on correctly predicting that the ambition will eventually curdle into disillusionment. What does this look like when the target's success stays genuinely satisfying and the disillusionment the persuader is waiting for never arrives?"
status: active
