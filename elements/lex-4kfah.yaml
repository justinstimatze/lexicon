id: lex-4kfah
name: a-social-group-is-relational-identity-not-an-arbitrary-aggregate
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern when someone denies a social group's reality by treating it as an arbitrary AGGREGATE — a classification by shared attribute, no more principled than any other combination of people — as grounds for dismissing group-differentiated remedies. Young's target, George Sher: 'there are... as many groups as there are combinations of people,' so singling out race or sex groups for special treatment is 'mere favoritism.' The correct alternative is neither the aggregate model nor an ASSOCIATION model (a voluntarily-joined formal institution like a club, which wrongly presumes the individual is prior to and constitutive of the group): 'a social group is defined not primarily by a set of shared attributes, but by a sense of identity,' arising relationally through encounter and differentiation from at least one other group — fluid and historically contingent, yet real: 'Groups are real not as substances, but as forms of social relations.' The stakes are explicitly political: denying a group's reality this way 'often reinforces group oppressions' by clearing the ground for dismissing group-based remedies as unprincipled."
related: [lex-s2uyr]
evokes: [social-group-ontology, aggregate-vs-association-vs-group, george-sher-affirmative-action-argument, groups-as-relational-not-substantial, five-faces-of-oppression, iris-marion-young-1990]
lineage:
  - source: primary
    text: young-1990-justice-and-the-politics-of-difference
    citation: "Iris Marion Young, *Justice and the Politics of Difference* (Princeton, NJ: Princeton University Press, 1990), Chapter 2, 'Five Faces of Oppression,' the social-group section (pp. 42-48), plus the Introduction (p. 3) where the companion claim is first flagged. A methodologically essential companion to the five-face typology (see lex-s2uyr), not one of the five faces itself: the typology presupposes that groups are real in the sense this atom argues for."
    quote: "[From the Introduction, flagging the companion claim:] 'Oppression happens to social groups. But philosophy and social theory typically lack a viable concept of the social group. Notably in the context of affirmative action debate, some philosophers and policymakers even refuse to acknowledge the reality of social groups, a denial that often reinforces group oppressions.' [On the social group, against the aggregate model, Ch.2:] 'A social group is a collective of persons differentiated from at least one other group by cultural forms, practices, or way of life... A social group is defined not primarily by a set of shared attributes, but by a sense of identity... Groups are real not as substances, but as forms of social relations.' [Citing Sher's aggregate-denial move:] 'George Sher, for example, treats social groups as aggregates... \"There are really as many groups as there are combinations of people and if we are going to ascribe claims to equal treatment to racial, sexual, and other groups with high visibility, it will be mere favoritism not to ascribe similar claims to these other groups as well\" (Sher, 1987a, p. 256).' [The 'George Sher, for example, treats social groups as aggregates' span crosses the same kind of column break as the other split-out atoms' Young quotes -- confirmed reconstructing correctly against the PDF directly, in the order quoted above.]"
  - source: discovery-loop
    text: split-from-lex-s2uyr-young-five-faces-of-oppression
    citation: "Split out of lex-s2uyr (see lex-9z37e's discovery-loop entry for the full split rationale). Unlike the other five children, this atom isn't one of Young's five FACES of oppression -- it's the companion ontological claim the whole typology presupposes (oppression happens to real social groups, not arbitrary aggregates), which is why lex-s2uyr's own assembly treats it as a groundwork premise running before the five-way classification rather than a sixth sibling face."
canonical-instances:
  - "The affirmative-action/social-group-reality argument: philosopher George Sher treats social groups as arbitrary 'aggregates' ('there are really as many groups as there are combinations of people'), concluding that group-differentiated treatment is 'mere favoritism' — a denial of social groups' reality that Young argues 'often reinforces group oppressions,' precisely because it clears the analytical ground for dismissing group-based remedies as unprincipled."
critical-questions:
  - "Is the social group whose oppression is in question being treated as a real, relationally-constituted collective with a shared sense of identity — or dismissed/reduced to an arbitrary 'aggregate' of individuals who happen to share an attribute, a move Young argues itself functions to deny and reinforce oppression?"
  - "Is the group instead being modeled as a voluntary ASSOCIATION (a club, a corporation) that individuals join by choice? That model also fails here, since it presumes the individual is prior to and constitutive of the group, rather than the identity arising relationally through encounter and differentiation from other groups."
status: active
