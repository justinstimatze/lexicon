  - source: primary
    text: graeber-2011-debt-patriarchy-as-rejection-of-cities
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.7 'Honor and Degradation,' section 'Mesopotamia (The Origins of Patriarchy).'"
    quote: "“‘Patriarchy’ originated, first and foremost, in a rejection of the great urban civilizations in the name of a kind of purity, a reassertion of paternal control against great cities like Uruk, Lagash, and Babylon, seen as places of bureaucrats, traders, and whores.”"
canonical-instances:
  - "The direct textual anchor, on the specific line the veiling laws were drawing: “When we refer to 'respectable' women, then, we are referring to those whose bodies could not, under any conditions, be bought or sold.”"
  - "Hypothetical: an anthropologist studying a farming community over thirty years documents women running markets and holding land jointly with their husbands during the community's early, land-abundant decades. As commercial buyers start offering cash for family plots and a wave of debt-driven land loss follows, the community's elders begin enforcing stricter rules about which women can be seen negotiating sales in public, framing it as a return to how things have always been done -- though the anthropologist's own earlier fieldwork shows no such rule existed a generation before."
critical-questions:
  - "Graeber's Mesopotamian case ties the timing of women's restriction tightly to the rise of debt and markets. But similarly restrictive practices toward women (veiling, seclusion, virginity obsession) also show up in societies with comparatively thin market penetration. Does the mechanism generalize as a response to commoditization risk specifically, or is market pressure just one of several distinct triggers that happen to produce a similar-looking response?"
  - "If patriarchal seclusion is a protective reaction against women becoming commodities, why does it fall hardest on exactly the women -- daughters of the elite -- who were least likely to actually end up as debt pawns or temple prostitutes, while poor women, most exposed to real commoditization, got the least protection and the most exploitation? Does that split undercut the protective reading, or does it just show the protection was always more about elite men's status than about the women themselves?"
