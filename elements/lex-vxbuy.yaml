lineage:
  - source: primary
    text: cushing-serpent-of-sea-gentle-repeated-questions-from-behind
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Serpent of the Sea.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "he called out to the maiden in a hoarse, hissing voice: 'Let us speak one to the other. Are you tired, girl?' Yet she never moved her head, but plodded on with her eyes cast down. 'Are you weary, poor maiden?'--then he said in a gentler voice, as he arose erect and fell a little behind her, and wrapped his scales more closely in his blanket... And he repeated, in a still softer voice: 'Are you still weary, poor maiden?'"
canonical-instances:
  - "A manager who has just been transferred in after a predecessor's abusive tenure doesn't open with a speech about how things will be different, but starts with small, low-stakes, repeated gestures, a genuine 'how's your week going' with no follow-up ask, letting the team's trust rebuild through repetition rather than a single declarative promise that traumatized employees have no reason yet to believe."
  - "Someone rebuilding trust with an estranged family member after a painful rupture doesn't open with a full apology and a request for reconciliation, but sends small, undemanding, repeated check-ins over time, letting consistency accumulate evidence of safety rather than asking the other person to accept a single big claim of changed behavior on faith."
critical-questions:
  - "how long should the sequence of small, low-stakes gestures continue before attempting a bigger, more direct claim -- the Serpent only needs three repetitions, but is that pace realistic for trust genuinely broken by serious harm, or does the story compress a process that would take much longer in most real situations?"
  - "does this approach risk feeling manipulative or evasive from the other side -- someone who eventually recognizes they were being gradually reassured rather than told the truth upfront might reasonably feel the incremental approach was itself a form of managing them rather than respecting them?"
  - "is there a meaningful difference between using this pattern because directness would genuinely overwhelm someone, versus using it because the truth is easier to accept once already partly won over -- does the tactic depend on withholding information the person would want to have upfront?"
