id: lex-vwg9p
name: tracing-vice-through-its-escalating-stages-as-an-argument-for-restraint-at-the-first
type-in: claim
type-out: process
_tier: atomic
agent-instruction: 'A speaker arguing for suppressing a feeling at its cheapest, earliest stage can narrate the full escalation path the feeling predictably follows once loose. Showing concretely where the first small step leads carries the argument; asserting the danger in the abstract rarely does. In the Jataka''s tale of Kanha, malice is traced word by word to violence as the reason to refuse it at the outset: "''Tis ever thus with wicked men: first word, then touch we see, Next fist, then staff, and last of all the swordstroke flashing free: Where malice is, there follows hate—no malice then for me."'
related: []
evokes: [jataka, dasanipata, kanha-jataka, escalation-staged, nip-it-in-the-bud]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 440, Kanha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "'Tis ever thus with wicked men: first word, then touch we see, Next fist, then staff, and last of all the swordstroke flashing free: Where malice is, there follows hate—no malice then for me."
canonical-instances:
  - "A workplace conduct trainer walks new managers through the exact documented progression from an unaddressed snide comment to a formal harassment complaint at a past company, arguing that intervening at the first comment prevents what intervening at the complaint stage no longer can."
critical-questions:
  - "Does narrating the full escalation path make the case for early restraint stronger, or does it risk normalizing the escalation by presenting it as the default trajectory rather than one avoidable path among several?"
status: active
