id: lex-5bufp
name: loss-power-law-scaling-makes-optimal-compute-split-empirically-discoverable
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When training a neural network (or any learned system) under a fixed resource budget, treat two separate empirical facts as established by controlled experiment rather than assumed by intuition or precedent. FIRST (Kaplan, McCandlish, et al. 2020, 'Scaling Laws for Neural Language Models'): cross-entropy loss falls as a smooth POWER LAW with each of three scale factors — non-embedding parameter count N, dataset size D, and training compute C — across seven-plus orders of magnitude, with no observed sign of the trend bending over at the upper end. Crucially, performance depends 'most strongly on scale' and only 'very weakly' on other architectural hyperparameters such as network width versus depth: two networks matched on N, D, and C but differing in shape perform almost identically. A stalled project should therefore check FIRST whether it is scale-bottlenecked before re-architecting. SECOND (Hoffmann, Borgeaud, Mensch, et al. 2022, 'Training Compute-Optimal Large Language Models,' the 'Chinchilla' paper): the existence of a smooth scaling law does not, by itself, tell you how to SPLIT a fixed compute budget between the scale factors — that split is a separate empirical question, and the field's first published answer was measurably wrong in a specific, costly direction. Kaplan's own recipe held that a 10x increase in compute should go roughly 5.5x into parameters and only 1.8x into training tokens. Hoffmann trained over 400 models (70M to 16B+ parameters, 5B to 500B+ tokens) and found instead that compute-optimal training requires scaling model size and training-token count in roughly EQUAL proportion — doubling one requires doubling the other. Because the field had been following the parameter-dominant recipe, large language models had been systematically undertrained: Gopher (280B parameters, ~300B training tokens) was re-derived as a 70B-parameter model (Chinchilla) trained on 4x more data (1.4 trillion tokens) at the SAME compute budget, and the resulting model uniformly and significantly outperformed Gopher and every other large model tested despite having a quarter of the parameters. The composite practitioner-lesson: (1) check whether a plateaued system is genuinely scale-bottlenecked before hand-engineering harder — a fitted power law tells you scale, not shape, is buying the performance; (2) do not assume the allocation ratio between competing scale-dimensions consumed under one fixed budget — parameters versus data, headcount versus training time, inventory versus marketing spend — is obvious, intuitive, or safely inherited from the field's current convention; the correct ratio is itself an empirical fact that an entire research field got wrong for two years running; (3) expect a correction to that ratio to be biased toward the less visible, less headline-grabbing dimension (here, data quantity, versus the more prestige-generating parameter count), and expect the corrected allocation to yield outsized gains cheaply, because the miscalibration had been compounding silently across every system built under the old recipe."
