id: lex-r4rea
name: unpack-relational-names-to-derive-duties
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Recognize this pattern when you're trying to work out what you owe someone and the obligation isn't written down anywhere. Epictetus's Discourses (c. 108 CE), Book II chapter 10 'How We May Discover the Duties of Life from Names,' names a technique: instead of reasoning ethics from abstract first principles, enumerate the relational names you actually hold and unpack the duty-set already contained in each. 'Consider who you are... you are a citizen of the world... After this remember that you are a son. What does this character promise? To consider that everything which is the son's belongs to the father, to obey him in all things... After this know that you are a brother also... Next to this, if you are a senator of any state, remember that you are a senator... For each of such names, if it comes to be examined, marks out the proper duties.' The mechanism: a relational name (son, brother, senator, citizen, neighbour) is not a label but a compressed specification — examining what the name means, in the way you'd examine what 'smith' or 'grammarian' means, yields the duty-set that goes with it, without needing a separate ethical derivation for each relationship. Epictetus's diagnostic for failure: someone who blames or wrongs their brother 'has forgotten who he is and what is his name' — the same structural failure as a smith who misuses a hammer, or a grammarian who writes ungrammatically: the actor has stopped exercising the craft their own name commits them to. Epictetus also reframes the stakes: failing a relational duty is a loss in its own right — the loss of 'modesty, moderation, gentleness' that the name entailed — independent of whether any property or reputation was also lost, and independent of whether the other party notices or retaliates. The generalizable operational claim: when facing an ambiguous obligation, don't start from a general ethical theory — list your actual current relational names (parent, employee, neighbor, mentor, citizen, guest) and ask what practice each one, examined honestly, already specifies; the felt absence of a written rule usually means you haven't finished unpacking a name you already hold."
related: [lex-efv3v, lex-mthv9, lex-k7m6e]
evokes: [epictetus-duties-from-names, marks-out-the-proper-duties, forgotten-your-own-name, smith-who-misuses-the-hammer, relational-name-as-compressed-duty-spec, damage-is-loss-of-character-not-property]
lineage:
  - source: primary
    text: epictetus-c108-discourses-book2-ch10
    citation: "Epictetus, Discourses (c. 108 CE; recorded by Arrian; 4 books extant of original 8), George Long 1877 translation (filename Epictetus-c108-Discourses-Long.txt / epictetus_discourses_george-long_advanced.epub, Standard Ebooks PD edition). Book II, chapter 10, 'How We May Discover the Duties of Life from Names,' supplies the technique of deriving obligations by unpacking relational names (son, brother, senator, citizen), the craft-analogy for what counts as failure (the smith who misuses a hammer), and the reframing of relational failure as self-inflicted character-damage independent of external loss. PD globally (Epictetus's teachings recorded ante 135 CE; Long translation itself PD, Long d. 1879)."
    quote: "'Consider who you are. In the first place, you are a man and this is one who has nothing superior to the faculty of the will... Further, you are a citizen of the world, and a part of it... After this remember that you are a son. What does this character promise? To consider that everything which is the son's belongs to the father, to obey him in all things, never to blame him to another, nor to say or do anything which does him injury... After this know that you are a brother also, and that to this character it is due to make concessions... Next to this, if you are a senator of any state, remember that you are a senator; if a youth, that you are a youth; if an old man, that you are an old man. For each of such names, if it comes to be examined, marks out the proper duties. But if you go and blame your brother, I say to you: You have forgotten who you are and what is your name. In the next place, if you were a smith and made a wrong use of the hammer, you would have forgotten the smith... What does he lose who commits adultery? He loses the (character of) the modest, the temperate, the decent, the citizen, the neighbour... No man is bad without suffering some loss and damage.' [Verified 2026-08-19 against the real epub: exact match; the checker cannot confirm the opening sentence because the ebook's own footnote-anchor number is embedded mid-sentence right after 'man' in its extracted text.]"
canonical-instances:
  - "The direct pattern-application template: facing an ambiguous obligation with no written rule, list your current relational names (parent, employee, neighbor, mentor, citizen, host) and unpack what each one, examined honestly and by analogy to a craft, already specifies you should do."
  - "The workplace instance: a new manager unsure how much latitude to give a struggling report asks not 'what does policy say' but 'what does the name manager, examined, already promise' — attentiveness, fair process, development — deriving the obligation from the role rather than searching for an external rule."
  - "The failure-diagnostic instance: someone who mistreats a family member and excuses it because 'no rule was broken' is shown the reframe — they have not violated an external rule, they have forgotten one of their own names, the way a smith forgets the smith by misusing the hammer; the loss is in their own character, not contingent on whether anyone else notices."
critical-questions:
  - "is this the same claim as lex-efv3v (chosen-role-as-non-deliberation-gate)? No — lex-efv3v is about a role functioning as a COMMITMENT DEVICE that forecloses deliberation in the moment of pressure (Agrippinus doesn't deliberate about Nero's spectacle because his role has already decided). lex-r4rea is a DERIVATION TECHNIQUE used in the calm, reflective moment before any pressure arrives: given an ambiguous situation, unpack what your relational names entail. lex-efv3v uses an already-known role-obligation to block re-litigation under pressure; lex-r4rea is how you discover what that obligation is in the first place. They compose: lex-r4rea produces the duty-set, lex-efv3v is one way that duty-set gets defended once pressure arrives."
  - "is this the same claim as lex-mthv9 (hexis)? No — hexis is about HOW character is formed (repeated action shapes disposition over time). lex-r4rea is a REASONING PROCEDURE for identifying WHAT one currently owes, given roles already held; it says nothing about how those roles' virtues get habituated. A person could correctly unpack their duties via lex-r4rea and still lack the hexis to reliably perform them — the atoms address different stages (knowing the duty vs. having the trained capacity to discharge it)."
  - "does the technique work when relational names conflict (e.g., 'employee' vs. 'whistleblower', 'friend' vs. 'citizen')? Epictetus doesn't address conflict-of-names directly in this passage; the technique as stated assumes the names are compossible. Practitioner extension: when two unpacked duty-sets conflict, the technique itself doesn't adjudicate priority — it only guarantees that each name, taken alone, yields a determinate duty-set. Priority-ordering across conflicting names is a separate problem the technique surfaces but does not solve."
  - "why frame relational failure as self-inflicted character-loss rather than as a wrong done to the other party? Epictetus's Stoic commitment is that the only real good or harm is in the will; reframing the cost of a broken relational duty as your own lost modesty/fidelity (rather than the other person's grievance) keeps the motivation for keeping the duty independent of whether the other party ever finds out or retaliates — a robustness property ordinary rule-following (which typically depends on enforcement or reputation) lacks."
