id: lex-x8pj3
name: self-reference-splits-into-empirical-and-self-certifying-kinds
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a statement refers to itself, check which of two very different grounds could make it true before treating 'self-referring' as one uniform category. Popper's dialogue distinguishes them directly. The empirical kind depends on a fact about the world that could easily have gone the other way: Theaetetus says 'I am now speaking so softly that dear old Socrates cannot make out what I am saying,' and Socrates confirms it -- 'I cannot deny that, when you were speaking so softly, you were speaking truthfully. Nor can I deny the empirical character of this truth; for had my ears been younger, it would have turned out an untruth.' Nothing about the sentence's logical form makes it true; only Socrates's actual hearing does, and a sharper-eared listener would have made the identical sentence false. The second kind is settled without checking anything outside the sentence at all: Theaetetus states 'What I am now saying is meaningful,' and Socrates proves it purely by reductio -- 'I begin with the assumption that your last utterance was meaningless. This, however, turns out to contradict your utterance, and thus to entail the falsity of your utterance. But if an utterance is false, then it must clearly be meaningful. Thus my assumption is absurd; which proves your theorem.' No observation of Socrates, Theaetetus, or the world enters the proof anywhere -- the sentence's own logical shape (a meaningless utterance can be neither true nor false, so any candidate for its falsity already concedes its meaningfulness) forces the conclusion by itself. Diagnostic move: when you meet a self-referring claim, ask whether its truth rides on some external fact that could have come out differently, or whether it is provable purely from its own structure. Treating a merely contingent self-referring claim as though it were logically self-certifying, or the reverse, misdescribes exactly what would have to change for the claim to fail."
