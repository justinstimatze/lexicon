id: lex-93yym
name: purification-relocates-the-excluded-material-it-never-destroys-it
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Cleaning up a system, a belief, an institution, a self-image, doesn't eliminate whatever gets excluded in the process; it moves that material somewhere unaddressed, where it persists, accumulates, and eventually forces a reckoning, usually through some marginal or disreputable channel whose job becomes reclaiming what the cleanup discarded. Carl Jung, tracing why the alchemists' 'ambiguous, dark, paradoxical, and thoroughly pagan' Mercurius-figure kept reappearing in Christian Europe despite the Church's drive toward a purely refined Christ, put the mechanism in blunt domestic terms: 'A loving belief in the purified Christ... naturally involves cleansing one's own house of black filth. But the filth must be dumped somewhere, and no matter where the dump lies it will plague even the best of all possible worlds with a bad smell.' Hyde generalizes the pattern beyond this one case: 'The rule seems to be that there is always error, imperfection, and diminishment when human beings set themselves to putting things in order, even if it is a church they are cleaning up. Something will always be excluded that turns out to be needed in a later time or place, whereupon an \"occult\" science must arise whose task is to reclaim what has been lost.' Purification, on this account, is never actually subtraction; it's relocation, and the dump doesn't stay silent, its smell is the excluded material continuing to exert pressure on the system that thought it had gotten rid of it. Hyde makes the same point elsewhere in the book about who actually does the returning: a purity achieved by refinement is specifically vulnerable to the return of what it sloughed off, and trickster figures, whose boundary-crossing 'bungling' produced the exclusion in the first place, are cast as the recurring agents of that return -- the reclaiming discipline isn't incidental, it has a face. Diagnostic move: when a system declares itself successfully purified of some undesirable element, ask not whether the element is gone but where it went -- a genuinely eliminated problem doesn't need a marginal, disreputable, or 'occult' discipline dedicated to periodically retrieving it, so the very existence of such a reclaiming practice (a black market, a fringe therapy, a disavowed genre, an underground scene) is itself evidence that the original purification only ever relocated what it claimed to remove."
