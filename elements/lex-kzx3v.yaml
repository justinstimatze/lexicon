evokes: [dog-on-land-crocodile-in-water, crow-by-day-owl-by-night, kautilya-power-place-time, an-examples-own-logic-refutes-its-conclusion]
lineage:
  - source: primary
    text: kautilya-arthashastra-power-place-time-interdependent
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Planning a Campaign,' 'Of Power, Place and Time,' {9.1.26-33}."
    quote: "'Some teachers say that, as among power, place and time, power is the most important because a powerful king can overcome the difficulties of dry or wet terrain and the effects of heat, cold or rain. Some others hold that the place is the most important; [quoting as an example] a dog on land can pull a crocodile while [on water] a crocodile can pull in a dog. Some others hold time to be the most important; [quoting as an example] a crow can kill an owl in day-time while an owl can kill a crow at night. Kautilya disagrees. Power, place and time are interdependent.'"
canonical-instances:
  - "In a product debate, one team insists that user acquisition is the key growth lever, citing a channel that converted brilliantly in one market; another insists retention is what matters, citing the same channel's users staying for years -- but the acquisition camp's own example only converted well because of the retention mechanics already in the product, showing the two are jointly determining rather than one dominating."
  - "Two economists argue over whether capital or institutions drive growth, each pointing to a country that industrialized rapidly -- closer inspection shows the capital-favoring country's investment only paid off because of the institutional stability already in place, meaning the example cited as proof of capital's primacy actually depended on the institutional factor the argument claims is secondary."
critical-questions:
  - "does this diagnostic risk becoming unfalsifiable -- if every single-factor example can be reframed as 'secretly conditional on another factor,' is there ever a case where a genuine dominant factor could be identified at all, or does the interdependence verdict always win by default regardless of the actual data?"
  - "in a real decision under time pressure, is 'the factors are interdependent, assess them jointly' actually more actionable than picking the single most-important one, or does refusing to rank leave a decision-maker with no way to prioritize when they can't fully assess all factors at once?"
  - "does the pattern generalize beyond situations with exactly two or three cleanly named factors -- when there are many interacting variables, does noticing that one example is conditional on another factor still yield a usable interdependence claim, or does the diagnostic only work cleanly in stylized debates like this one?"
