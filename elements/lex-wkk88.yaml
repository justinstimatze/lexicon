id: lex-wkk88
name: favorable-odds-can-buy-approval-for-severe-injustice
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating an impartial 'would you accept this if you might end up in any position' test as proof an arrangement is fair, check whether the test averages across positions or bounds by the worst one -- the two forms of impartiality aren't interchangeable. Under an equiprobability construction of impartiality (Harsanyi's), an arrangement gets judged by the expected utility of an equal chance of holding any position in it -- which lets a severely unjust setup pass so long as the good outcomes are common enough and the bad one rare enough. Sen: “Consider a slave society with 99 free men and 1 slave. The latter serves the former to their convenience and to his great discomfort. Given an equal chance of being in anyone’s position it is possible that someone might be ready to take a 1% chance of being a slave, since the 99% chance of being a free man served by a slave might tickle his fancy. Would a slave society be then morally supportable? Many people will not accept this test. It might incidentally be noted that in this case the Rawlsian model of ‘justice’ will tend to give different judgments from that derived from ‘impersonality’. Since the maximin notion fixes on the welfare of the worst-off individual, problems of this kind cannot appear in the use of that criterion.” Rawls' maximin version of impartiality judges an arrangement by its worst position rather than its expected value across positions, which is exactly what keeps a good enough payoff elsewhere from buying off a bad enough floor. Diagnostic move: when an impartial or veil-of-ignorance-style test approves something that looks wrong, find out which of the two forms is running underneath it -- only the worst-case form refuses to trade a rare severe harm against a common smaller gain."
