id: lex-yjrdz
name: a-virtues-claimed-seat-relocates-inward-as-each-locus-is-destroyed
type-in: process
type-out: process
_tier: atomic
agent-instruction: "Challenged repeatedly on whether a claimed inner virtue still holds as the body is progressively damaged, deny each time that the virtue was ever located in the specific part just destroyed — pushing its claimed seat further inward with every escalation, demonstrating the virtue's independence from any single piece of bodily integrity. In the Jataka's tale of the Preacher of Patience, as King Kalabu has the ascetic's hands, feet, nose, and ears cut off one by one, each demanding whether his patience still holds, the ascetic relocates the answer each time: 'You imagine, Sire, that my patience dwells in the extremities of my hands and feet. It is not there, but it is deep seated somewhere else'; then, after the nose and ears: 'Think not that my patience is seated in the tips of my nose and ears: my patience is deep seated within my heart.'"
related: []
evokes: [jataka, catukkanipata, khantivadi-jataka, a-virtue-relocated-inward-with-each-destroyed-locus, demonstrating-independence-from-bodily-integrity]
