id: lex-2r7ms
name: an-expectation-of-distant-origin-lets-anyone-claim-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a culture's rules for legitimate authority require that leaders come from somewhere distant, exotic, or mythologized rather than from the local population, recognize that this creates an opening any sufficiently bold traveler can walk through, whether or not their claimed connection to that distant place is true. Graeber and Wengrow's case: Maya elites at Tikal and other lowland cities expected legitimate kings to arrive from a mythologized far-off city -- Teotihuacan, the 'Place of Gods.' Long-distance trade routes were full of adventurers, traders, and soldiers of fortune; some of these dressed in Teotihuacan-style regalia and were accepted as legitimate 'stranger-kings,' installed on real thrones, with no evidence anyone verified the connection to the prestigious city they claimed. The expectation itself did the legitimizing work -- foreignness and distance substituted for any confirmed lineage, divine sanction, or verified deed, so the requirement built to keep power tied to a sacred origin was exactly what let power be seized by whoever was willing to claim that origin."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, teotihuacan, stranger-kings, maya, tikal, legitimacy]
lineage:
  - source: primary
    text: dawn-of-everything-stranger-kings
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.9 'Hiding in Plain Sight.'"
    quote: "“History is also full of stories of adventurous travellers who either find themselves taken into some alien society and miraculously transformed there into kings or embodiments of sacred power.”"
  - source: primary
    text: dawn-of-everything-feeling-kings-should-come-from-far-away
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.9 'Hiding in Plain Sight.'"
    quote: "“we seem to be dealing with a feeling among the Maya that kings really should come from somewhere far away, and with the willingness of at least a few unscrupulous foreigners to take advantage of this idea.”"
canonical-instances:
  - "The direct textual anchor, on how little verification the claim required in practice: 'from inscriptions at Tikal, we do know the names of some of these particular stranger-kings... One, called Sihyaj K'ahk' ('Born of Fire'), seems never himself to have ruled but helped install a series of Teotihuacano ‘princes' on Maya thrones,' while at Teotihuacan itself 'not a shred of compelling evidence for the institution of kingship has yet been found' -- the throne-claimants' 'homeland' had no kings for them to actually be sent from."
  - "Hypothetical: a mid-sized consulting firm's culture holds that the best strategic thinking always comes from outside hires with international experience, never from internal staff who know the business firsthand. A candidate who spent eighteen months at an unremarkable overseas branch office, dressed the part and speaks with practiced authority about 'what they do differently abroad,' is fast-tracked into a senior strategy role well ahead of equally capable internal candidates, with no one checking what that overseas experience actually involved."
critical-questions:
  - "How would a historian rule out the alternative that at least some of these 'stranger-kings' really did have a genuine, verifiable connection to Teotihuacan, given that some kind of contact and travel between the two regions is independently confirmed? Treating every instance as opportunistic exploitation risks over-correcting into assuming fraud wherever the record is thin."
  - "If distant origin alone is sufficient for legitimacy, why doesn't every ambitious traveler in a stranger-king culture attempt this move, and why don't more of these claims get exposed or contested later? What limits how often the opening actually gets exploited, beyond sheer boldness?"
status: active
