id: lex-3n9fx
name: an-earthly-enactment-is-a-shadow-of-its-simultaneous-heavenly-original
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "A person performing a ritual reenactment of a private vision can watch it reappear mid-performance, still unfolding. The earthly enactment then reads as a lesser shadow currently being cast by a more real version of the same event, happening simultaneously in a higher register, rather than as a historical record or symbolic representation of something already past. Mid-horse-dance, Black Elk looks up and sees his whole vision playing out again in the cloud above -- the Six Grandfathers, the horse nations, himself upon the bay -- while the exact same dance continues below him on the ground. His own gloss is explicit about which version is primary: 'I looked about me and could see that what we then were doing was like a shadow cast upon the earth from yonder vision in the heavens, so bright it was and clear. It knew the real was yonder and the darkened dream of it was here.' Distinct from lex-3jxuw's claim that reenacting a PAST founding precedent activates its dormant efficacy in the present: here nothing is being reactivated from the past, because the original is happening right now, concurrently, above, and the earthly dance derives its reality entirely from that ongoing concurrent original."
related: [lex-3jxuw]
evokes: [black-elk-speaks, horse-dance, a-shadow-cast-upon-the-earth, the-real-was-yonder, darkened-dream-of-it-was-here]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch14-horse-dance
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 14, 'The Horse Dance.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Then suddenly, as I sat there looking at the cloud, I saw my vision yonder once again -- the tepee built of cloud and sewed with lightning, the flaming rainbow door and, underneath, the Six Grandfathers sitting, and all the horses thronging in their quarters; and also there was I myself upon my bay before the tepee. I looked about me and could see that what we then were doing was like a shadow cast upon the earth from yonder vision in the heavens, so bright it was and clear. It knew the real was yonder and the darkened dream of it was here."
canonical-instances:
  - "A jazz musician deep in an improvised solo describes feeling that the performance they're playing is a lesser copy of a perfect version of the same piece happening somewhere they can almost, but not quite, fully access, rather than an original creation in its own right."
  - "A devout worshiper attending a communion service describes the earthly ritual as a real but secondary participation in an eternal, ongoing heavenly liturgy, not a symbolic reenactment of a single historical Last Supper."
  - "A method actor fully inhabiting a role during a performance reports feeling that the version of the character existing complete in the script and the director's vision is more real than what they themselves are producing live on stage."
critical-questions:
  - "Does the mid-performance vision actually confirm that the ritual is correctly reproducing something real, or does the intense concentration and sensory overload of performing a long-rehearsed ceremony simply produce a vivid hallucination that gets read as confirmation regardless of accuracy?"
  - "If the earthly dance is only ever a shadow of the true, ongoing heavenly original, can the shadow ever be performed wrong, or does the framework make every performance automatically valid as long as it's sincerely attempted?"
  - "Does this claim require believing the vision he saw as a boy and the vision he sees again mid-dance are literally the same continuous event, or could the second sighting be a new experience that simply confirms and echoes the first one?"
status: active
