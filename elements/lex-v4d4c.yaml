id: lex-v4d4c
name: attainment-does-not-exempt-you-from-consequence
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A monk claims that someone who has fully cultivated the fundamentals is 'not tangled in' karmic law -- exempt from cause-and-effect because they've arrived. For that answer he's reborn five hundred times as a fox, the tradition's image for cleverness mistaken for insight. Centuries later, the same question reaches Hundred-Elder, who answers 'not free of' karmic law instead -- fully subject to cause-and-effect, with no exemption -- and the fox is released from its five hundred lives on the spot. The two answers differ by a single substitution and name opposite claims about what attainment actually buys. Claiming that mastery lifts you outside the rules that bind everyone else -- outside scrutiny, outside consequence, outside the causal chain other people still answer to -- is the trap, because it converts genuine attainment into a license. Claiming instead that mastery leaves the rules fully in force, and only clears up the confusion about how they operate, keeps the attainment answerable to the same reality it grew out of. The diagnostic transfers past monks and karma: an expert, leader, or advanced practitioner who reasons from their own attainment to 'the normal rules don't apply to what I do' has reproduced the fox-monk's mistake, however sophisticated the reasoning sounds along the way."
related: [lex-brkcw, lex-8sy3e, lex-fgd5d]
evokes: [wumen-1228-wu-men-kuan, no-gate-gateway, koan, hundred-elder-wild-fox, five-hundred-lives-as-a-fox, spiritual-bypassing, above-the-law-of-cause-and-effect, no-one-is-exempt-from-consequence]
lineage:
  - source: primary
    tradition: wumen-koan-tradition
    text: wumen-1228-wu-men-kuan
    citation: "Wumen Huikai, No-Gate Gateway: The Original Wu-Men Kuan, trans. David Hinton (Shambhala, 2018), Case 2 (Hundred-Elder Wild Fox)."
    quote: "'“A great one who's cultivated the fundamentals, who's mastered them: is he too tangled in the laws of karma?” “He's not tangled in karmic law,” was my answer. And since then I've been reborn five hundred times as a fox roaming the countryside. […] “A great one who's cultivated the fundamentals, who's mastered them: is he too tangled in the laws of karma?” “He's not free of karmic law,” Hundred-Elder replied. And upon hearing those words, the old man had a great awakening.'"
  - source: primary
    tradition: wumen-koan-tradition
    text: wumen-1228-wu-men-kuan
    citation: "Wumen Huikai, No-Gate Gateway: The Original Wu-Men Kuan, trans. David Hinton (Shambhala, 2018), Case 2 (Hundred-Elder Wild Fox) -- No-Gate's Comment."
    quote: "'Not tangled in karmic law: how could that make someone a fox roaming the countryside? Not free of karmic law: how could that liberate someone from a fox's body?'"
canonical-instances:
  - "A surgeon with decades of a strong track record starts skipping the pre-operative checklist because 'I don't need it anymore' -- reasoning from earned competence to exemption from the procedure that competence was supposed to make routine, rather than from competence to more reliable adherence."
  - "A long-tenured judge or regulator who has developed genuine domain expertise starts treating that expertise as license to bypass the recusal and disclosure rules everyone else in the role follows, on the theory that judgment proven sound no longer needs the external check."
  - "A meditation teacher or guru with a large following reasons from their own advanced spiritual attainment to exemption from ordinary ethical accountability toward students -- the clinical literature on this pattern names it 'spiritual bypassing,' and treats the exemption-claim itself as the diagnostic red flag, not evidence of genuine attainment."
  - "Operationally distinct from lex-8sy3e power-reveals-character-more-than-it-corrupts-it: that atom is about what power reveals about a pre-existing disposition -- the powerless were faithful all along, and power just removed the constraint hiding a latent willingness to betray. This atom is a reasoning error specific to claimed attainment -- the inference from 'I have arrived' to 'the rules that got me here no longer bind me' -- a claim about attainment's logical relationship to consequence, not about what circumstance reveals."
  - "Operationally distinct from lex-fgd5d self-control-is-the-effect-of-flourishing-not-its-precondition: that atom reverses a causal arrow between joy and self-mastery and doesn't address exemption from consequence at all. The two can co-occur without conflict -- a flourishing-first practitioner on Spinoza's model is still fully answerable to consequence, just arriving at self-command by a different route."
critical-questions:
  - "Is there a genuine, non-bypassing sense in which mastery does change what rules apply -- an experienced surgeon really can skip a checklist step a novice shouldn't -- and how do you tell that legitimate case apart from the fox-monk's mistake? The discriminator seems to be whether the exemption was earned through a visible, checkable track record specific to the exact situation, versus asserted from general attainment as a blanket license."
  - "Does the 'not free of' framing risk becoming its own trap -- an excuse for excessive self-scrutiny or paralysis dressed up as humility -- if pushed past the specific claim the koan is correcting?"
status: active
