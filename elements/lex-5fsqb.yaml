id: lex-5fsqb
name: wealth-already-forfeit-to-decay-reframes-giving-as-the-only-save
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A teaching can reframe wealth not as something one might lose by giving it away, but as something already guaranteed to be lost to decay and death regardless of what its holder does — so that giving is recast as the only mechanism that actually preserves anything, overturning the intuition that holding equals keeping. In the Jataka''s tale of Aditta, the paccekabuddha states this directly to King Bharata: "Whate''er a man can save from flames that burn his dwelling down, Not what is left to be consumed, will still remain his own. The world''s on fire, decay and death are there the flame to feed; Save what you can by charity, a gift is saved indeed."'
related: []
evokes: [jataka, atthanipata, aditta-jataka, memento-mori-charity-framing, giving-as-the-only-way-to-keep]
lineage:
  - source: primary
    text: jataka-chalmers1895-aditta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 424, Aditta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Whate'er a man can save from flames that burn his dwelling down, Not what is left to be consumed, will still remain his own. The world's on fire, decay and death are there the flame to feed; Save what you can by charity, a gift is saved indeed."
canonical-instances:
  - "A wealth advisor tells a client hoarding cash against every possible downturn that inflation and time are already going to consume most of what he's sitting on regardless, and the only portion that will still exist in any meaningful sense in thirty years is whatever he gives away or invests now."
critical-questions:
  - "Does this argument actually change the math of holding versus giving, or does it work purely as a psychological reframe that makes an already-decided preference for giving feel more rational?"
  - "The stanza treats every form of holding as equally exposed to decay. Is that actually true, or does some way of holding wealth genuinely resist the loss the stanza assumes is universal?"
status: active
