id: lex-5ykp2
name: caught-between-two-patrons-feign-poverty-and-engineer-their-mutual-ruin
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you depend on two more powerful patrons at once and neither will let you commit fully to the other, don't treat neutrality as your only safe posture and don't treat picking a side as your only active option -- Kautilya names a third move that converts dependency on two stronger parties into eventual dominance over both. If a clean choice is available he says so plainly: 'a king shall choose the one more capable or the one for whom he is a buffer.' But when that choice isn't available -- when you're already allied with both and can't cleanly favor either -- the prescribed move is not passive fence-sitting: 'If allied with both, the king shall plead penury [and help neither] but sow dissension between them by carrying tales that each was plotting to deprive the other of his patrimony. When they are divided, he shall promote discord between them and then eliminate them one by one by covert methods.' Two distinct tools are doing separate work here. Pleading poverty is a cover story -- it excuses your inaction to both patrons without ever forcing you to admit you're deliberately withholding help, so neither patron has grounds to treat your neutrality as betrayal. Carrying fabricated tales of mutual betrayal is the active ingredient -- it doesn't wait for the two patrons to become suspicious of each other on their own, it manufactures the suspicion directly by telling each one the other is already plotting against them. The sequence matters: feigned helplessness first, to avoid provoking either patron while you're still weak relative to both; fabricated mutual suspicion second, to set the two patrons against each other while your own hands stay clean; and only once they're genuinely divided does the final, more exposed move -- covert elimination -- become viable, because by then each patron is too consumed with the other to notice or resist you. Diagnostic move: when stuck depending on two powerful parties who each expect your loyalty and neither of whom you can safely favor, consider whether your weakness itself can be weaponized as camouflage -- a credible claim of incapacity that buys you time and cover while you actively, secretly work to turn the two patrons against each other, rather than either waiting passively for the dependency to resolve itself or risking exposure by picking a side too early."
related: [lex-8a72s, lex-w2nkq]
evokes: [plead-penury-as-cover-for-neutrality, fabricate-mutual-suspicion-between-patrons, sow-dissension-then-eliminate-one-by-one, weak-party-triangulates-two-patrons]
lineage:
  - source: primary
    text: kautilya-arthashastra-feign-poverty-engineer-patrons-ruin
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Seeking Help,' 'Exceptions,' (ii) 'Choosing between two strong kings,' {7.2.13-15}."
    quote: "'If there are two strong kings whose protection can be sought, a king shall choose the one more capable or the one for whom he is a buffer or both. If allied with both, the king shall plead penury [and help neither] but sow dissension between them by carrying tales that each was plotting to deprive the other of his patrimony. When they are divided, he shall promote discord between them and then eliminate them one by one by covert methods.'"
canonical-instances:
  - "A junior employee courted by two rival senior executives, each expecting exclusive loyalty and each capable of ending the employee's career, claims to be too overwhelmed with basic workload to take a side, while separately mentioning to each executive, without direct evidence, that the other has been undermining them to the board -- once the two executives are genuinely at odds with each other, the employee is no longer squeezed between two demanding patrons but free to align with whichever one survives, or with neither."
  - "operationally distinct from lex-8a72s a-mirrored-fabricated-insult-turns-allies-against-each-other: that atom is a disinterested, or opportunistically profiting, third party sowing discord between two allies who have no other relationship to the schemer; this atom is the specific survival strategy of a weak party who is itself dependent on and bound to protect its relationship with both targets of the fabrication, using feigned incapacity as cover precisely because openly sabotaging either patron would expose it to retaliation it could not survive."
critical-questions:
  - "how would a weak party actually sustain the 'plead penury' cover story over time without either patron eventually verifying it and discovering the deception, especially once tale-carrying about the other patron begins circulating and might plausibly be traced back?"
  - "does this strategy require the two patrons to have no independent communication channel or existing trust with each other -- if they compare notes even once, does the fabricated tale-carrying collapse immediately and leave the weak party exposed to both simultaneously, worse off than simple neutrality would have been?"
  - "is 'eliminate them one by one by covert methods' actually achievable for a party too weak to help either patron with an army, or does the text assume covert methods available to a state apparatus that a merely economically weak but administratively intact kingdom would still possess -- does the strategy scale down to an individual or small-organization context where covert elimination has no real analogue?"
status: active
