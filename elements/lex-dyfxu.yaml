lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Science: Conjectures and Refutations,' Ch. 1 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002)."
    quote: "'At the same time I realized that such myths may be developed, and become testable; that historically speaking all -- or very nearly all -- scientific theories originate from myths, and that a myth may contain important anticipations of scientific theories. Examples are Empedocles' theory of evolution by trial and error, or Parmenides' myth of the unchanging block universe in which nothing ever happens and which, if we add another dimension, becomes Einstein's block universe (in which, too, nothing ever happens, since everything is, four-dimensionally speaking, determined and laid down from the beginning). I thus felt that if a theory is found to be non-scientific, or metaphysical (as we might say), it is not thereby found to be unimportant, or insignificant, or meaningless, or nonsensical.'"
canonical-instances:
  - "A startup's founding vision -- 'this technology will let anyone talk to a computer like a person' -- is unfalsifiable as stated: no experiment distinguishes it from wishful thinking. Investors who dismiss it as unscientific hand-waving are answering the wrong question; the founding statement was never trying to be a scientific claim. What actually matters is whether the vision can be developed into a falsifiable roadmap -- specific benchmarks, specific failure conditions. Betting on that development is a call about the team and the timeline, made separately from any verdict on the vision statement's current status."
  - "Alchemy's claim that base metals share a common underlying nature with gold was untestable as its practitioners stated it, wrapped in symbolic and spiritual language with no specified failure condition. The claim matured, once stripped of its symbolism and given falsifiable form, into nuclear physics' account of elements as configurations of the same subatomic particles -- gold and lead really do share an underlying nature, just not one alchemy could have tested."
  - "A product manager's hunch that 'users want more control over their data' isn't falsifiable in that form -- no metric would ever contradict it. Rather than discarding the hunch for failing the test, a sharp team develops it into a testable version (a specific control, a specific adoption-rate threshold) and runs that instead. The hunch was never the deliverable; it was raw material for something that could be."
critical-questions:
  - "Doesn't this just give every unfalsifiable claim a permanent excuse -- 'it might mature later'? No: the diagnostic isn't 'this could someday become testable, therefore treat it as science now.' It's narrower than that -- failing the falsifiability test today doesn't settle the idea's worth, and the worth-question is about development potential, a separate call from the demarcation test itself. A claim still gets no scientific credit until it actually becomes falsifiable -- the test's verdict on its CURRENT status doesn't change."
  - "How do you tell a myth worth developing from one that's genuinely a dead end, before either one has become testable? Popper doesn't offer a formula here, and this atom doesn't invent one -- the honest answer is that you often can't tell in advance, which is exactly why dismissing all unfalsifiable ideas as worthless is the wrong response to the falsifiability test. The practical move is to keep the two judgments separate rather than to collapse the uncertainty into a false confidence either way: 'currently unscientific' is a fact you can check now; 'worth developing' is a bet you make with weaker evidence."
