canonical-instances:
  - "A graduate program in a narrow lab technique with no application outside one specific industry produces alumni who stay locked onto that one industry regardless of how the job market shifts, while a graduate program prized mainly for teaching general analytical rigor produces alumni who freely pivot to consulting, policy, or a dozen other fields — the difference tracks what the training is worth elsewhere, not how much either group loved the original plan."
  - "Someone who spends two years and a large sum on a highly specific professional certification usable only in one narrow role will rationally feel locked into pursuing that exact role even as better opportunities appear, while a colleague who invested the same two years in a widely-recognized general credential feels free to walk toward any of several roles it opens — calling the first person more dedicated misreads a difference in what would be wasted by leaving."
critical-questions:
  - "Thielens himself lists this as only one of several possible explanations (alongside differing prestige/income cushions and differing social expectations of dedication) for the same finding — how would you actually isolate the specificity-of-training effect from these other candidate explanations, which all point the same direction and could be operating simultaneously?"
  - "Is the calculation genuinely rational (little would be wasted, so why not keep options open) or does it shade into the sunk-cost fallacy once a person starts treating the ALREADY-SPENT years of general-purpose training as a reason to stay on a path that no longer suits them — where exactly is the line between 'my training is objectively worth less elsewhere' (this atom) and 'I already invested this time so I should stay' (the fallacy)?"
status: active
