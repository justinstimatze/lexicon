canonical-instances:
  - "A company rolls out a new employee-monitoring analytics tool specifically to study the effects of a recent reorganization, and staff behavior shifts sharply the week it launches — the shift may be evidence about how people respond to being newly monitored, not evidence about the reorganization the tool was meant to evaluate."
  - "A researcher studying a community's response to a new policy introduces door-to-door structured interviews the community has never experienced before, and the guarded, rehearsed-sounding answers she gets are plausibly a reaction to the unfamiliar interview format itself rather than to the policy under study."
critical-questions:
  - "How does a researcher separate the two signals in practice — the reaction to the change being studied versus the reaction to the act of studying it — when both arrive at once and often produce similar surface behavior (guardedness, performance, suspicion)?"
  - "Does this effect fade with familiarity (the second or third round of interviews meets less resistance than the first), and if so, does that argue for treating early-round data as specifically less reliable rather than discarding the method altogether?"
