id: lex-v9tkm
name: a-humble-costly-to-fake-return-disproves-a-treachery-accusation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When falsely accused of plotting to seize power, the strongest disproof isn''t a denial — it''s returning to face the accuser in a way a real usurper would never choose, because someone actually building toward a takeover has every incentive to arrive with visible force, not without it. In the Maha-Ummagga-Jataka, Mahosadha, slandered as a traitor and summoned by the king who suspects rebellion, is found disguised as a common potter and returns exactly as he was found: "he was earning his livelihood as a potter in the South Town; but as soon as he heard that you had sent for him, without bathing, the mud yet staining his body, he came." The king''s own reasoning does the rest: "If he were my enemy he would have come with pomp and retinue; he is not my enemy." The humility isn''t performed for the king''s benefit — it happens to be exactly what an actual conspirator would never risk.'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, disproving-treachery, costly-signal-by-absence, humble-return]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"My lord, he was earning his livelihood as a potter in the South Town; but as soon as he heard that you had sent for him, without bathing, the mud yet staining his body, he came." The king thought, "If he were my enemy he would have come with pomp and retinue; he is not my enemy."'
canonical-instances:
  - "A finance executive accused of embezzling and quietly building a rival firm responds to the board's summons not with lawyers and a prepared statement, but by showing up alone, straight from the office, with the same unfinished spreadsheet open on his laptop he'd been working on when the call came — the visible absence of preparation reads as innocence a polished defense couldn't."
  - "A general suspected of plotting a coup, summoned by a nervous head of state, arrives at the palace with a single unarmed aide rather than his usual security detail, betting correctly that the visible vulnerability itself is what will be read as loyalty."
critical-questions:
  - "This reasoning only protects someone who is genuinely unprepared to seize power at that moment — could a sufficiently patient schemer fake exactly this kind of humble, unprepared appearance as a deeper layer of the same con?"
  - "The king's inference depends on assuming a real usurper would always prefer visible force — is that assumption reliable, or could a shrewd conspirator understand this exact logic and deliberately arrive humble to exploit it?"
