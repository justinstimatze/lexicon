canonical-instances:
  - "A company continues to treat a long-standing 'strategic partner' with preferential terms and shared confidential planning even after several consecutive quarters where the partner has provided no actual reciprocal help, because the relationship still carries the label 'partner' from an earlier, genuinely mutual period — the same error Kautilya's rule flags: the label has outlived the behavior that originally earned it."
  - "A competitor who unexpectedly provides genuinely useful information or support during a shared crisis (a supply-chain disruption, a regulatory threat) is treated with more operational trust in that specific instance than a nominal industry-alliance partner who offers only statements of solidarity with no concrete help — matching Kautilya's ranking of demonstrated help over declared status."
  - "operationally distinct from lex-8kn3r control-a-proven-turncoat-through-collateral-not-trust-verification: that atom is about the CONTROL MECHANISM appropriate for someone already known to be an active double agent; this atom is about the GENERAL EVALUATIVE STANDARD (behavior over label) applied to any relationship, including the specific claim that a past defector retains elevated risk even after apparently returning to loyalty."
  - "operationally distinct from lex-g294v a-rehabilitated-adversarys-risk-does-not-decay-with-good-behavior, which quotes the same 'living with a snake' verse at greater length (including the plaksha-seed metaphor) and its own follow-on containment prescriptions: this atom states the returning-defector exception as one clause inside a broader claim about labels versus demonstrated behavior across ANY relationship, ally or enemy; lex-g294v is the focused deep-dive on that one exception's mechanism (the risk comes from structural association rather than any current intent) and its management options. Read this atom for the general behavioral-evidence standard, lex-g294v for the specific returnee-risk claim in depth."
critical-questions:
  - "does treating a returning defector as permanently suspect regardless of subsequent behavior risk becoming a self-fulfilling prophecy — if the returning party is never extended the trust needed to demonstrate renewed loyalty, they may have no path back to being treated as reliable regardless of their actual intentions, pushing them back toward defection?"
  - "how much accumulated helpful behavior should be required before an unlabeled relationship (a helpful competitor, a helpful stranger) is treated with the same trust as a formally allied one — the framework says behavior matters more than label but doesn't specify a threshold, risking either premature trust extended too easily or excessive caution that never credits real demonstrated help?"
  - "is 'giving help' actually a reliable signal of trustworthy alliance, or can help itself be strategically performed to build false credibility for a later betrayal — does this standard, taken alone, protect against the same manufactured-track-record risk this project's TRIZ-era Cardano-formula and fake-oracle atoms already flag in other domains?"
status: active
