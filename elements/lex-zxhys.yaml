id: lex-zxhys
name: announce-a-reward-schedule-scaled-to-strategic-value-before-the-effort-starts
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need many independent people to make quick, high-stakes decisions about where to direct their effort, don't rely on general exhortation or trust that people will naturally prioritize correctly -- publish a specific reward schedule, graduated to match how much each possible outcome actually matters, before the effort begins, so the incentive structure itself does the prioritizing without requiring central coordination in the moment. Kautilya's instruction for the day of battle is explicit both in the ranking and in the timing: 'The Chief of Defence shall make the troops happy with wealth and honours and announce the following rewards -- a hundred thousand panas for killing the enemy king, fifty thousand for a prince or the Army Chief, ten thousand for a division chief, five thousand for an elephant or chariot warrior, thousand for a horse, one hundred for an infantry section leader, twenty for a soldier, as well as double normal wages and whatever booty they seize. These rewards shall be made known to the leaders of groups of ten.' The schedule does two things at once: the ranking itself communicates strategic priority (the enemy king matters roughly five thousand times more than an ordinary soldier, encoded directly in the payout ratio) and the advance announcement means every individual fighter, mid-battle, already knows which opportunity is worth taking the biggest risk for, without needing a commander's real-time direction. This only works because the ranking is genuinely proportional to actual strategic value and is public before anyone has to act on it -- a schedule announced after the fact, or one whose ratios don't track real importance, wouldn't shape behavior the same way. Diagnostic move: when you need a large, decentralized group to make fast decisions under pressure that collectively support your actual priorities, don't rely on values or general instructions alone -- design a concrete reward or recognition schedule whose relative sizes mirror the real strategic value of each outcome, and publish it before the moment of decision, not after."
