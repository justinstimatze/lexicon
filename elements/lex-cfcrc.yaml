id: lex-cfcrc
name: a-precommitted-coping-principle-executes-automatically-when-loss-strikes
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A household or person can adopt and internalize a general decision-principle about impermanence well before any actual loss occurs, so that when tragedy strikes, behavior runs from the pre-loaded principle rather than being improvised under acute emotional load. The timing is what does the work: install the principle early enough and it simply executes when the moment arrives. In the Jataka's tale of Uraga, the Bodhisatta instructs his family in advance to dwell daily on the thought of death and the transience of all things: 'give alms, observe holy days, keep the moral law, dwell on the thought of death, be mindful of your mortal state.' They readily accepted his teaching and dwelt earnestly on the thought of death."
related: []
evokes: [jataka, pancanipata, uraga-jataka, precommitted-principle-executes-under-acute-loss, grief-regulation-installed-in-advance]
lineage:
  - source: primary
    text: jataka-chalmers1895-uraga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book V (Pancanipata), No. 354, Uraga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "According as ye have received, give alms, observe holy days, keep the moral law, dwell on the thought of death, be mindful of your mortal state. For in the case of beings like ourselves, death is certain, life uncertain: all existing things are transitory and subject to decay."
canonical-instances:
  - "A founder who has spent two years telling the team, before any crisis, that any given customer or investor could walk away tomorrow and the company would still be worth building, finds that when a major client actually does leave abruptly, the team's response is calm and procedural rather than panicked, because that framing was already the thing everyone's plans quietly rested on."
critical-questions:
  - "Does the pre-loaded principle actually change the felt experience of loss, or does it only change the outward behavior displayed while the private grief proceeds unaffected underneath?"
  - "Is there a cost to living by a constantly-rehearsed anticipation of loss — does treating every relationship or possession as already provisional flatten engagement with it while it lasts?"
status: active
