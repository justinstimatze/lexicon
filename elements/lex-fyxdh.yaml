canonical-instances:
  - "Spartan wife-lending in Plutarch's Lycurgus: framing children as belonging to the commonwealth rather than to their parents privately is used to license departures from ordinary marital exclusivity that a private-property framing of marriage would forbid — presented here as a historical case for its structural logic, not as an endorsement of the eugenic breeding program it served."
  - "compulsory patent licensing: a government reframes an invention as serving urgent public health need rather than purely private commercial right, licensing generic production that would otherwise be patent infringement, without conceding the original patent claim was ever illegitimate."
  - "wartime requisition of private property: military necessity is framed as revealing property's latent public claim, licensing government use of privately-owned resources without treating it as a straightforward taking."
critical-questions:
  - "is this atom endorsing the Spartan practice it cites? No. The agent-instruction is explicit that the primary instance involves a state-directed breeding program that should be read as historically troubling, not as a model to emulate. The atom extracts a STRUCTURAL MOVE — reframing private exclusivity as collective claim to license exceptions — that recurs across contexts with very different ethical valence; the mechanism itself is ethically neutral, its applications are not, and each application needs its own separate ethical evaluation on its own terms."
  - "how is this different from ordinary eminent domain or a straightforward cost-benefit override of private rights? A straightforward override — ordinary eminent domain with compensation, a cost-benefit justification for taking something — CONCEDES that a private right existed and was overridden for a greater good; it pays a debt, symbolically or literally. This atom's mechanism is different: the reframing denies that a purely private claim existed in the first place, so there is nothing to compensate or apologize for. That is what makes the reframing move more durable and more contestable than an override — it doesn't ask forgiveness, it changes the premise."
  - "does this generalize to any claim that 'X belongs to everyone,' or is there a narrower test? The atom's mechanism specifically requires an antecedent private-exclusivity norm that the reframing is working against — it names the move of dissolving an existing private claim, not the separate question of how a genuinely public good gets initially established as public. A resource that was always understood as commonly held, such as a public park, isn't an instance of this atom; the atom applies only where a real private-exclusivity norm existed first and had to be reframed away."
