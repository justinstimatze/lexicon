    quote: "That which destroys the cold, and parches grain, / Consumes my limbs. My refuge proves my bane. \"A man, O king, who like fire was the refuge of the people, stole the bundle of jewels. Do not ask me about the thief.\" \"Friend, just bring me the thief.\" Without telling the king that he was a thief, he told yet another story."
canonical-instances:
  - "A junior auditor who has traced financial irregularities to the CEO herself doesn't say so directly in the boardroom; she walks the board through three unrelated case studies of companies destroyed by executives who marked their own homework, and lets the parallel do the accusing."
critical-questions:
  - "At what point does declining to name the wrongdoer outright stop being tact and start being complicity in letting the harm continue?"
