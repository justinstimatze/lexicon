evokes: [attack-the-unfriendly-not-the-vulnerable, preserve-the-cooperative-option, kautilya-whom-to-attack-sequencing, unfriendly-rival-forecloses-alliance]
lineage:
  - source: primary
    text: kautilya-arthashastra-attack-unfriendly-not-vulnerable
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Whom to Attack,' (i) 'Between two kings equally affected by calamities,' {7.5.1-8}."
    quote: "'Between two neighbouring kings equally affected by calamities, should one attack one who has become vulnerable or one who has been unfriendly? The unfriendly king shall be attacked first and after defeating him, the other shall be attacked. [The reasoning is:] the unfriendly king will never help in attacking the other whereas the vulnerable one may help in defeating the enemy.'"
canonical-instances:
  - "A company facing two struggling competitors of similar weakness targets the one that has been openly hostile (undercutting prices, poaching staff aggressively) before the one that has simply fallen on hard times but stayed neutral, because the neutral competitor might still be persuadable into a partnership or acquisition-of-convenience against the hostile one, and that option only exists as long as the neutral competitor hasn't already been eliminated."
  - "A political campaign choosing which of two equally weak rival factions to attack first in a primary goes after the faction that has already publicly attacked the front-runner, leaving the merely-underfunded, non-hostile faction alone in case its voters or endorsement can still be won over once the hostile faction is dealt with."
critical-questions:
  - "how reliably can 'unfriendly' actually be distinguished from 'vulnerable and simply behaving cautiously' -- could a rival correctly read as neutral-not-hostile still refuse to help once the moment comes, meaning the preserved option was illusory all along and the sequencing gained nothing?"
  - "does eliminating the unfriendly rival first tip off the vulnerable one that they are next, making them less likely to cooperate against a common threat that no longer looks common once their turn is clearly coming -- does the sequencing itself undermine the very cooperation it was meant to preserve?"
  - "is there a risk that delaying action against the more truly dangerous unfriendly rival gives that rival more time to recover or prepare, especially if 'equally affected by calamities' turns out not to hold as precisely as assumed?"
