id: lex-aaf3f
name: serial-retelling-systematically-distorts-the-message
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When relying on a story passed through several intermediaries, surface telephone-game distortion — serial retelling systematically reshapes the message (simplified, sharpened, conventionalized); direct from source beats N-step provenance."
related: [lex-t9fs7, lex-exczm, lex-nqxt9]
scaffolds-from: [lex-exczm, lex-t9fs7]
evokes: [chinese-whispers, telephone-game, leveling-sharpening-assimilation, gossip-drift, rumor, stern-1902-chain-of-subjects]
lineage:
  - source: primary
    text: allport-postman-1965-the-psychology-of-rumor-chapters-5-and-6
    citation: "Gordon W. Allport and Leo Postman, *The Psychology of Rumor* (Henry Holt 1947; Russell & Russell 1965 reprint). The three transferable laws of serial-transmission distortion are formalized across Chapters 5 ('Results of the Experiments: Leveling and Sharpening,' pp.75-98) and 6 ('Results of the Experiments: Assimilation,' pp.99-118). The experimental procedure, described pp.65-72: a chain of six or seven subjects view a detailed picture (battle scene, street scene, subway scene), and the first subject describes it to the second, second to third, and so on through 'serial reproduction.' Outputs are recorded and compared against the original. The three laws: LEVELING — the message gets shorter; ~70% of details are lost in the first five or six transmissions even when there is no time lapse (Fig. 9 reproduction, p.76). Levelling preferentially deletes proper names, dates, numbers, and qualifying details. SHARPENING — the few details that survive are selectively retained and amplified; movement, size, and familiar symbols (church, cross) sharpen; closure 'completes' incomplete signs (Gene Antry becomes Gene Autry). ASSIMILATION — the surviving content is reshaped toward the teller's existing intellectual and emotional context, producing 'good Gestalt' fits — assimilation to principal theme (war-scene details cluster around the war motif), to expectation ('Loew's Pa...' becomes 'Loew's Palace'), to interest, and to prejudice. The Allport-Postman claim is that distortion is DIRECTIONAL and predictable, not random — the three laws govern which direction. The transferable atom captures the structural claim (three-law systematic distortion) and is silent on the specific (1947-era U.S., war-context, racially-loaded) experimental materials Allport-Postman used to demonstrate assimilation toward racial-prejudice priors; the experimental design IS evidence of the assimilation law (subjects mis-reported a white man with a razor as a Black man with a razor — the lex-t9fs7 confirmation-bias and racial-priors operating at the transmission step) but the transferable atom names the WHAT not the specific historical demonstration."
    quote: "[Allport-Postman 1965 p.75, opening of Ch.5:] 'As a rumor travels, it tends to grow shorter, more concise, more easily grasped and told. In successive versions fewer words are used and fewer details are mentioned.' [p.76 — the empirical curve of leveling:] 'The curve, based on eleven experiments, shows that about 70 percent of the details are eliminated in the course of five or six mouth-to-mouth transmissions even when there is virtually no time lapse.' [p.86, transition to sharpening:] 'The reader may have noted that as the protocols become briefer, items that are not leveled out are, of necessity, made relatively more salient. They are SHARPENED.' [p.86, sharpening defined:] 'SHARPENING may be defined as the selective perception, retention, and reporting of a limited number of details from a larger context. It is the reciprocal phenomenon of leveling; the one can never exist without the other.' [p.100, assimilation defined:] 'Although we are not justified in sharply contrasting the intellectual and emotional aspects of assimilative change, we shall, in the interests of analysis, speak of assimilative tendencies that are relatively unemotional and of those that are relatively more emotional in character.' [p.101, Assimilation to Principal Theme:] 'items become sharpened or leveled according to the demands of the leading motif of the story. They also become twisted in such a way as to render the story more coherent, plausible, and well rounded. ... All these reports, false though they are, fit and amplify the principal theme — a battle incident. If they were actually present in the picture, they would make a \"better\" Gestalt. Never are objects extraneous to the theme introduced — no apple pies, no ballet dancers, no baseball players. If imported, they would create a confused or \"worse\" Gestalt.'"
  - source: practitioner
    text: wikipedia-rumor-serial-reproduction
    citation: "Wikipedia 'Rumor' article (en-wp; retrieved via local ZIM dump -> local Wikipedia archive, 2026-05-29). Grounds the upstream of Allport-Postman 1947: William Stern's 1902 'chain of subjects' experiments (a story passed mouth-to-ear down a chain is shortened and changed by the end) — Allport's intellectual lineage runs through Stern (his teacher). Bartlett 1932 'Remembering' — the serial-reproduction technique that Allport-Postman adopted for picture-based stimuli. Knapp 1944 'A Psychology of Rumor' — the wartime rumor analysis that immediately preceded Allport-Postman's monograph. Internal double-quotes rendered as single-quotes for YAML"
    quote: "Stern experimented on rumor involving a 'chain of subjects' who passed a story from 'mouth to ear' without the right to repeat or explain it. He found that the story was shortened and changed by the time it reached the end of the chain. [Stern 1902 — the founding experiment; the children's game Chinese whispers is the same structure.] [Knapp 1944, of rumour:] they're transmitted by word of mouth; they provide 'information' about a 'person, happening, or condition'; and they express and gratify 'the emotional needs of the community.' [The emotional-needs criterion — distortion runs toward what the community wants to be true, i.e. assimilation, not random drift.]"
canonical-instances:
  - "the telephone game / Chinese whispers: a sentence whispered down a line of players emerges transformed — the canonical demonstration that error is not random but directional (it simplifies and conventionalises). Stern 1902 formalised it; Bartlett 1932's 'serial reproduction' of stories (e.g. 'The War of the Ghosts') showed the message bends toward the receiver's cultural schema"
  - "Allport & Postman 1947 leveling / sharpening / assimilation: LEVELING — the message gets shorter, details drop; SHARPENING — a few details are selectively retained and amplified; ASSIMILATION — the whole is reshaped toward the teller's habits, interests, and expectations. The three laws name WHY serial retelling distorts predictably rather than randomly"
  - "rumour and urban legend: the versions that survive serial retransmission are the ones honed by leveling/sharpening/assimilation into maximally transmissible, emotionally-satisfying form — which is why a debunked '38 witnesses did nothing' or 'kidney stolen in a hotel bathtub' story stabilises into a clean, sticky shape regardless of the messy facts (connects to memetic survivorship as evidence of cognitive fit)"
  - "organisational / scientific drift: a finding restated through layers of summary (paper -> press release -> headline -> social post) loses caveats (leveling), over-weights the surprising claim (sharpening), and bends toward the audience's priors (assimilation) — the same three laws operating across institutional retellings rather than a whisper chain"
  - "operationally driven by lex-t9fs7 confirmation-bias: the assimilation law IS confirmation-bias operating at the transmission step — each teller bends the message toward what they already expect or want, so the chain ratchets toward the collective prior. lex-t9fs7 is the per-receiver search-and-weight bias; lex-aaf3f is its compounding consequence across a chain of retellings"
  - "operationally a lossy contrast to lex-exczm sympathy-as-affective-transmission and lex-hng49 mentor-as-scaffolded-transmission: those describe (relatively faithful) transmission of affect and skill; lex-aaf3f is the failure mode of transmission under serial human reproduction — content is not conserved but systematically degraded and reshaped, with the affect (Knapp's 'emotional needs') riding along and steering the distortion"
critical-questions:
  - "the chain-length / fidelity check: how many retellings separate you from the source, and was each a faithful copy or a paraphrase? Distortion compounds with chain length; the practitioner move is to shorten the chain — go to the primary source rather than trusting the Nth retelling"
  - "the assimilation-direction question: which way is the message being bent — toward whose expectations and emotional needs? Distortion is directional, so predict the drift: a story simplifies toward the audience's existing schema and sharpens on its most emotionally-charged detail. Knowing the direction lets you reconstruct the likely original"
  - "the leveling-loss audit: what got dropped? Serial retelling preferentially deletes caveats, conditions, and context (the boring qualifiers) while preserving the vivid claim — so a confident, contextless version signals heavy leveling, not a clean fact. Ask what qualifications the original likely carried"
  - "the design-for-fidelity move: when transmission fidelity matters (instructions, provenance, evidence), do not rely on serial human retelling — use written records, a single source of truth, and verbatim quotation to bypass the leveling/sharpening/assimilation laws. This is why chain-of-custody and primary citation exist"
status: active
