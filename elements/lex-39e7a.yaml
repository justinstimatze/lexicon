evokes: [popper-1940-what-is-dialectic, principle-of-explosion, ex-contradictione-quodlibet, the-sun-is-shining-and-caesar-was-a-traitor, a-contradiction-entails-everything-and-therefore-nothing]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'What is Dialectic?' (paper read to a philosophy seminar at Canterbury University College, Christchurch, New Zealand, 1937; first published in Mind, N.S. 49, 1940), Ch. 15 of Conjectures and Refutations (Routledge Classics, 2002), p.429."
    quote: "'Using our two rules we can indeed show this. For assume we have the two contradictory premises -- say (a) The sun is shining now, (b) The sun is not shining now. From these two premises any statement -- for example, \"Caesar was a traitor\" can be inferred, as follows. From the first premise (a) we can infer, in accordance with rule (1), the following conclusion: (c) The sun is shining now v Caesar was a traitor. Taking now (b) and (c) as premises, we can ultimately deduce, in accordance with rule (2) (d) Caesar was a traitor... We see from this that if a theory contains a contradiction, then it entails everything, and therefore, indeed, nothing. A theory which adds to every information which it asserts also the negation of this information can give us no information at all. A theory which involves a contradiction is therefore entirely useless as a theory.'"
canonical-instances:
  - "A vendor contract states in one clause that either party may terminate with 30 days' notice, and in another that the agreement is binding for a fixed five-year term with no early exit. Once both clauses stand, a lawyer working only from the document's own stated terms can construct a valid argument for either party's right to walk away tomorrow or their obligation to stay for five years -- the contract hasn't merely got one weak clause, it has stopped constraining anyone's behavior at all until the conflict is resolved."
  - "A codebase's config validation logic contains two rules that jointly forbid and require the same field under identical conditions. Rather than one input silently failing, the validator can be driven to accept or reject any input whatsoever depending on which rule a given code path happens to check first -- the contradiction doesn't localize to the one input that exposed it."
critical-questions:
  - "Real belief systems and legal codes survive internal contradictions all the time without collapsing into total incoherence -- doesn't that refute the claim? In practice people and institutions don't mechanically apply every valid inference available to them; they route around the contradiction informally, apply precedent, or simply never notice most of the derivable absurdities. The atom's claim is about what's LOGICALLY licensed by the contradiction, not about what any given user of the system will actually bother to derive -- the latent capacity for total incoherence is real even when nobody exploits it, and it surfaces exactly when someone motivated does go looking for a derivation that suits them."
  - "Doesn't fixing this just mean removing the offending clause, which is obvious advice that didn't need a formal proof? The proof's value is the diagnosis it supplies -- it shows why a contradiction can't be triaged as 'low severity because it only affects an edge case,' since the derivation route to an arbitrary unrelated conclusion (per [[lex-geqyt]] on what a tolerated contradiction actually licenses) doesn't require the contradiction to be anywhere near the conclusion it's used to prove."
status: active
