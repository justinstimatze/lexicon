id: lex-hre6s
name: isolating-a-deviant-minority-preserves-the-deviance-it-punishes
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a group holding a minority attitude that departs from the majority norm gets socially frozen out rather than corrected, consider that the freeze-out may be preserving the very deviance it looks like it's punishing, rather than fixing it. Merton, reporting a sociometric finding among medical students: a minority who believed physicians should exercise firm authoritarian control over patients — a view departing from the school's prevailing attitude — were 'chosen by others as friends far less frequently than would be expected on the assumption that this attitude played no part.' The hypothesis under study was that 'such \"deviant\" attitudes tend to persist because those holding these attitudes are thus insulated from intimate association with students holding the more prevalent attitude.' The mechanism is a feedback loop distinct from ordinary conformity pressure: normally, exposure to a majority view is what pulls a minority holder toward it over time, through repeated informal contact, argument, and social modeling. But if the very act of holding the deviant view triggers social exclusion FIRST, the excluded person loses exactly the channel (intimate peer contact) that would have been the mechanism of correction — the punishment for deviance removes the corrective exposure that would otherwise have ended it. The deviant view doesn't survive despite social sanction; it survives partly BECAUSE of it, since the sanction takes the form of isolation rather than engagement. Diagnostic move: when a group treats a minority view by excluding its holders rather than engaging them, check whether the exclusion is actually functioning as containment of the view (correct) or as an insulating bubble that removes the one social mechanism that could have changed the holders' minds (this pattern) — the visible behavior (fewer friendships) looks identical in both cases, and only tracking whether the view persists or fades over time distinguishes them."
