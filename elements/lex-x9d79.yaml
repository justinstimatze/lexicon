    quote: "So he tapped with his foot on the lion which he sat upon, to roar. And the lion resting his mouth upon the Elephant's temple, roared thrice... The elephants were terrified and dropped the Jackal down at their feet; they trampled upon his head and crushed it to atoms."
canonical-instances:
  - "A manager who has built their authority entirely on being able to invoke a powerful executive sponsor's name gets destroyed the one time they actually call that sponsor into a meeting to settle a dispute, since the sponsor's blunt, sweeping intervention flattens the manager's own standing along with everyone else's objections."
critical-questions:
  - "Could the jackal have demonstrated his commanding power without personally standing where its effects would land? Commanding a force this overwhelming may inherently require proving it in a way that exposes the commander to it."
  - "Is the lesson here specifically about borrowed power, or does it generalize to any leader whose authority rests entirely on controlling something they can't personally survive using — does the same fragility apply to leaders who command financial, legal, or informational weapons rather than literal beasts?"
status: active
