name: appealing-to-someones-strength-recruits-them-into-their-own-trap
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Learning that someone intends to harm you gives you a head start, and one way to use it is to design a trap that only works on someone who prides themselves on a specific trait -- then have a sympathetic third party invite the target to prove that exact trait. In Radin's Winnebago Trickster cycle, Trickster learns coyote is planning a trick against him and strikes first. He ties a sleeping horse's tail to a rope and sends a message through a go-between, framed entirely as an appeal to coyote's pride and a request for a favor: 'Grandson, I know you are very strong and therefore I wish to tell you that there is an animal over there near the village, lying dead. If you will push it aside, it will be good.' Coyote's response confirms the appeal landed exactly where intended: 'Coyote was very much delighted and went to the place... 'I am very strong and I know that I can pull this animal.'' The moment he commits to demonstrating his strength, the trap springs on its own: the horse wakes, panics, and 'Coyote was pulled along looking as though he were a branch being dragged,' in full view of the entire village. The public humiliation is so complete that 'he did not even go back to his lodge. He left the village and was not more seen.' The trap required no force from Trickster at all after the setup -- coyote's own eagerness to prove the very trait he was flattered for supplied all the remaining energy. Diagnostic move: when a task is framed specifically around proving a trait you're proud of, especially one delivered through a third party rather than directly, treat the flattery itself as the mechanism doing the recruiting -- ask what happens if the trait turns out to be irrelevant to what you're actually being asked to do."
