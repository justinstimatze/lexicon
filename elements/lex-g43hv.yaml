id: lex-g43hv
name: oblique-paradoxical-statement-forces-listener-to-request-the-reveal
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Instead of directly accusing or informing, a speaker states a fact in a form that doesn''t make sense to the listener, which forces the listener to ask what it means. Because the listener has to pull the explanation out rather than receive it handed over, the revelation carries more persuasive weight once it lands. In the Jataka''s tale of Samugga, the ascetic greets the demon as one of three visible only as one: "Whence come ye, friends? / Right welcome all the three! / Be pleased to rest with me awhile, / I pray: I trust you live at ease and happily; / ''Tis long since any of you passed this way."'
related: []
evokes: [jataka, navanipata, samugga-jataka, paradoxical-statement-invites-inquiry, revelation-extracted-not-imposed]
lineage:
  - source: primary
    text: jataka-chalmers1895-samugga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IX (Navanipata), No. 436, Samugga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Whence come ye, friends? / Right welcome all the three! / Be pleased to rest with me awhile, / I pray: I trust you live at ease and happily; / ‘Tis long since any of you passed this way."
canonical-instances:
  - "A doctor tells a patient who came in alone, \"it's good to see both of you today,\" and lets the patient's confused question about who else is meant do the work of surfacing a condition the scan already revealed but the patient hadn't been told yet."
critical-questions:
  - "Does making the listener ask for the explanation actually increase how much the revelation lands, or does it just delay a disclosure that would have hit just as hard stated plainly?"
status: active
