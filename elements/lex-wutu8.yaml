id: lex-wutu8
name: dialogue-suspends-assumptions-to-look-at-them-rather-than-from-them
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When a group needs to do collective inquiry on a hard question — surface a disagreement, find shared meaning, dislodge a stuck pattern — Bohm's transferable claim is that ordinary 'discussion' (each person defending their position) cannot do this work. What's needed is DIALOGUE in Bohm's specific sense: a sustained collective inquiry in which participants SUSPEND their assumptions and opinions long enough to LOOK AT them, rather than continuing to look FROM them. The structural mechanism: assumptions normally function as INVISIBLE LENSES (the world is what you see THROUGH the assumption); suspending the assumption holds it OUT in front of awareness where the group can examine it as an OBJECT (look AT it). The Bohm dialogue practice: 15-40 people in a circle, no preset agenda, no facilitator (or only minimal facilitation), no goal of reaching agreement. Participants commit to suspending the impulse to defend, agree, disagree, or convert. Over time (Bohm estimated days-to-weeks of sustained meetings), social conventions wear thin, subcultural differences surface, and the group can notice the assumptions ACTIVELY OPERATING in itself — including each person's own. The output is not consensus but COHERENCE: a shared field of meaning in which the assumptions are seen and the participants can act with more awareness of what they're acting from. Practitioner discipline: in any group conversation that matters, practice momentary suspension — when you feel the impulse to defend or refute, pause and surface the assumption you're defending. Make it visible. Be careful with the inverse failure mode: dialogue is not 'sharing feelings,' 'reaching consensus,' or 'lowering the stakes.' Bohm's dialogue raises the stakes — it surfaces the assumptions that the lower-stakes conversation papers over. The 'pleasant' dialogue that avoids friction is not Bohm's dialogue. The atom names the structural move (suspend → look at → see → choose) without committing to the specific 15-40-people-in-a-circle format. Distinct from lex-wjwuc collision-with-error-as-load-bearing-for-living-truth (Mill On Liberty): Mill is the JUSTIFICATION for entertaining opposing views (truth needs friction to stay alive); Bohm-dialogue is the OPERATIONAL DISCIPLINE for doing it without collapsing into debate. They compose. Distinct from lex-bmujx thought-actively-participates-in-forming-perceptions: lex-bmujx is the structural claim about thought; lex-wutu8 is the collective practice that uses suspension to surface the participation. They compose — proprioception of thought (lex-bmujx) is the INDIVIDUAL capacity; dialogue (lex-wutu8) is the COLLECTIVE practice that supports it. Distinct from lex-eb3wf Klein pre-mortem: pre-mortem is one specific decision-analysis instrumentation (project failure-modes); Bohm-dialogue is the broader collective-inquiry pattern. They compose."
