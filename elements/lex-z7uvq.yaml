id: lex-z7uvq
name: a-subset-tie-can-resolve-cleanly-in-the-larger-set
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before calling it inconsistent that two options tied within a narrower comparison later split cleanly within a wider one, check whether the wider comparison actually introduced anything new. A rationality condition sometimes demanded of choice (Sen calls it property β) says that if two alternatives are both best within some subset, then one of them can't be uniquely best in the whole set without the other also being best there. Sen: “Various selection processes do not, in fact, satisfy property β. Two Australians may tie for the Australian championship in some game, neither being able to defeat the other, but it is perfectly possible for one of them to become the world champion alone, since he might be able to defeat all non-Australians, which the other Australian champion may not be able to do. Similarly, two poets or scientists could get the same national honours, with only one of them receiving some international honour such as the Nobel Prize, without this appearing as irrational in any significant sense.” The tie inside Australia and the split outside it aren't in tension, because the wider field contains competitors the narrower field never tested either player against -- the two champions were never actually shown to be equal in the dimension that later separated them. Diagnostic move: when someone points to a tie in a narrow comparison and a clear winner in a broader one as proof the ranking process is unreliable, check whether the broader comparison introduced anything the narrower one didn't have. If it did, the split just reflects the broader comparison doing work the narrower one was never positioned to do -- nothing here needs explaining away."
