id: lex-3e9rv
name: correctly-warned-does-not-mean-correctly-decided
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a side in a long-settled dispute turns out to have correctly predicted the danger of the path not taken, don't treat that vindication as proof they were right about the choice itself -- Popper distinguishes the two directly, in a passage where he holds his own position while explicitly conceding the other side's foresight. Discussing the Reformation's decline of religious authority, he writes: 'I must admit, on the other hand, that the pessimists who feared the decline of authority and tradition were wise men. The terrible experience of the great religious wars, and of the French and Russian revolutions, prove their wisdom and foresight. But although these wars and revolutions prove that the cautious pessimists were wise, they do not prove that they were right. On the contrary, the verdict of history... seems, by and large, to favour those who had faith in man and in human reason.' Being wise about a specific danger and being right about the overall choice are two separate verdicts, and history can hand down opposite results on each: the pessimists correctly foresaw that removing an overriding authority would cause real chaos and real wars, and were vindicated on exactly that prediction, while the larger judgment about which path to take still went the other way. Popper reinforces the same separability from his own side: 'my feelings are all on the side of the naive liberal optimists, even though my reason tells me that their epistemology was all wrong, and that truth is in fact hard to come by.' He keeps the value commitment (faith in individual reason and freedom) after concluding that the theory which historically justified it (that truth is self-evident to anyone of good will) was actually false. Diagnostic move: when someone's specific warning about a choice comes true, don't let that settle whether the choice itself was wrong -- check the two claims separately. And when you hold a position whose original justifying theory you've come to doubt, ask whether the position still stands on its own merits before assuming doubt about the theory requires abandoning the position it once supported."
