evokes: [blake-contraries, without-contraries-no-progression, marriage-of-heaven-and-hell, reason-and-energy, attraction-and-repulsion, anti-sublation, generative-tension, bohr-complementarity-analog, adversarial-collaboration-analog, dialectic-without-synthesis]
lineage:
  - source: primary
    text: blake-1793-marriage-of-heaven-and-hell-the-argument-and-voice-of-the-devil
    citation: "William Blake, *The Marriage of Heaven and Hell* (etched 1790-93, illuminated printing). Public domain. The transferable claim is the structural one: opposition between principles is not pathology to be resolved but the engine of progression. Blake's specific contraries in the text are 'Attraction and Repulsion, Reason and Energy, Love and Hate' (plate 3, 'The Argument'), framed as 'necessary to human existence.' His broader move in 'The Voice of the Devil' (plates 4-6) is anti-orthodox — he argues that the religious tradition's resolution of these contraries into 'Good and Evil' (with Reason as Good and Energy as Evil) inverts the actual structure: Energy is 'the only life,' Reason is 'the bound or outward circumference of Energy.' The transferable atom extracts the structural claim (opposition is generative; resolution can collapse the generative tension) without commitment to Blake's specific Reason-vs-Energy valuation or his theological framing. The atom is silent on whether Energy or Reason is 'truly' primary; Blake's stronger claim that Reason is merely the 'outward circumference of Energy' is one possible valuation but not cardinal for the structural primitive. Distinct from lex-pd9p6 recognition-asymmetry-undermines-recognized-position because lex-pd9p6 is a specific interpersonal recognition-dynamic from Hegel's master-slave; Blake's contraries are more abstract structural primitives. Distinct from lex-cmkdq labor-as-self-objectification-substrate because lex-cmkdq is a specific mechanism (labor produces externalized self); Blake's contraries are not tied to any specific mechanism. Crucially distinct from BOTH Hegel-derived atoms because Hegel's dialectic move is SYNTHESIS-VIA-SUBLATION (Aufhebung) — the contraries are taken up into a higher unity that preserves what was true in each while resolving the tension. Blake REJECTS this move. The contraries are to be MAINTAINED, not sublated. This anti-synthesis move is the vital distinctive contribution; it is what distinguishes Blake from Hegel and from any other dialectical tradition that resolves contraries to a third position. Distinct from lex-6f5xs static-vs-dynamic-quality-tension because Pirsig's tension is WITHIN a single category (Quality has two modes that interact); Blake's contraries are full opposites. Distinct from lex-ucw53 perspectivism because perspectivism is about epistemological multiplicity (many perspectives possible); Blake's contraries are about ontological generativity (the opposition itself produces motion)."
    quote: "[Blake 1793 plate 3, 'The Argument' (canonical statement):] 'Without contraries is no progression. Attraction and repulsion, reason and energy, love and hate, are necessary to human existence.' [Continuing:] 'From these contraries spring what the religious call Good and Evil. Good is the passive that obeys reason; Evil is the active springing from Energy. Good is heaven. Evil is hell.' [Plate 4, 'The Voice of the Devil,' on the contraries-to-orthodoxy:] 'All Bibles or sacred codes have been the cause of the following errors:— 1. That man has two real existing principles, viz., a Body and a Soul. 2. That Energy, called Evil, is alone from the Body; and that Reason, called Good, is alone from the Soul. 3. That God will torment man in Eternity for following his Energies. But the following contraries to these are true:— 1. Man has no Body distinct from his Soul. For that called Body is a portion of Soul discerned by the five senses, the chief inlets of Soul in this age. 2. Energy is the only life, and is from the Body; and Reason is the bound or outward circumference of Energy. 3. Energy is Eternal Delight.' [Plate 5 on the restrainer-of-desire pathology:] 'Those who restrain desire, do so because theirs is weak enough to be restrained; and the restrainer or reason usurps its place and governs the unwilling. And being restrained, it by degrees becomes passive, till it is only the shadow of desire.'"
canonical-instances:
  - "Bohr complementarity in physics: wave-behavior and particle-behavior of light/matter are contraries that physics famously refuses to resolve. Each is necessary for prediction in different experimental contexts; neither is 'the truth' with the other as 'illusion.' Bohr explicitly framed this as a structural rather than ignorance-bound feature. The transferable move is the same as Blake's: hold both contraries; the resolution that would 'finally tell us what light really is' would lose the predictive structure complementarity provides."
  - "Adversarial collaboration in research: when two scientists disagree on a hypothesis, the productive move is often NOT for one to convince the other (resolve the tension) but for them to design a joint study that BOTH would accept as decisive, then commit to publishing the result whichever way it goes. The contraries (two opposed hypotheses) are MAINTAINED through the design phase and only resolved by data — and even then often into refined contraries rather than synthesis. The Blakean transferable move: don't resolve the disagreement; design around it."
  - "Product engineering exploration-vs-exploitation: a team that always exploits known wins shrinks its option space; a team that always explores never compounds. The temptation is to find 'the right balance' (synthesis). The Blakean move is to maintain BOTH as live modes — explicit explorer roles and explicit exploiter roles, sometimes in the same people but explicitly switched, sometimes in different sub-teams. The 'balanced' compromise is often the worst of both."
  - "Critical theory anti-Hegelianism: Adorno's *Negative Dialectics* explicitly refuses the Hegelian sublation move on Blakean grounds (without citing Blake) — the contradictions of capitalism are not to be resolved into a higher synthesis; that move is precisely how affirmative culture neutralizes critique. The transferable claim crosses traditions: when a tension is generative, premature resolution is a co-optation move, not a victory."
  - "Yin-yang in Daoism (Tao Te Ching): yin and yang are contraries explicitly required by each other; the Daoist move is not synthesis but recognition that each contains the seed of the other and that the dynamic between them is the structure of change itself. Cross-traditional convergence with Blake — the transferable claim is not Western-specific."
  - "Operationally distinct from lex-pd9p6 / lex-cmkdq (Hegel atoms): the Hegel atoms describe specific recognition-and-labor dynamics in which contraries are sublated into higher unity (the master-slave dialectic resolves through labor; the recognition-asymmetry resolves through mutual recognition). Blake's atom is the META-CLAIM that this sublation move is sometimes wrong — that the contraries should be MAINTAINED rather than resolved. They compose, but as opposing methodological commitments: Hegel says synthesize, Blake says maintain. The transferable atom captures the maintain-discipline as distinct from synthesize-discipline."
  - "Operationally distinct from lex-6f5xs Pirsig static-vs-dynamic-quality: Pirsig names a tension WITHIN a single primitive (Quality has two modes that interact); Blake names tension BETWEEN distinct primitives. They compose: an instance of Pirsig's static-vs-dynamic could be diagnosed Blakean (maintain) or sublatable (resolve) depending on whether the tension is generative or pathological."
critical-questions:
  - "Is this opposition actually generative, or is it a defective tension you should resolve? Not every opposition is a Blakean contrary. A bug in code, a contradiction in a proof, mutually-blocking design constraints — these often should be resolved. The diagnostic: does maintaining both produce MORE forward motion than resolving to one? If yes, hold. If no, resolve. The atom names a pattern, not a universal claim that all tensions should be maintained."
  - "What does the resolution-temptation look like in this domain? Different fields have different default-resolution moves. In philosophy it's synthesis; in management it's 'finding the balance'; in product it's 'building the unified vision'; in physics it was the search for a single underlying mechanism behind wave-particle duality. Naming the local resolution-temptation makes it easier to spot when it would collapse generative tension."
  - "What is the transferable claim vs the Blake-specific claim? Transferable: opposition can be generative; some oppositions should be MAINTAINED rather than resolved; premature synthesis can collapse the generative friction. Blake-specific: the particular valuation of Energy over Reason, the theological inversion of Good and Evil, the broader Romantic project. The transferable atom does not require accepting Blake's theology — only the structural claim about opposition and progression."
  - "Are you using 'maintain the contraries' as license to avoid a decision you should make? The atom can be misapplied as cover for chronic indecision ('I'm holding the contraries' = 'I refuse to choose'). The check: are you actually GETTING the generative friction (visible motion forward, productive disagreement, novel options), or are you stuck because the tension has become paralysis? Generative contraries produce motion; paralytic ones don't."
  - "Does the synthesis you're contemplating preserve the generative friction or smooth it away? Some syntheses do preserve the tension (Bohr's complementarity is itself a kind of synthesis, but one that maintains the contraries operationally). Others smooth them away ('we'll do BOTH explore and exploit' often becomes 'we'll do neither well'). The check is whether the synthesis is structural (maintains both as live forces) or aspirational (uses both words but commits to neither)."
