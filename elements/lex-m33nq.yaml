    text: distinctness-audit-scanlon-basicness-claim-vs-existing-substrate
    citation: "lex-kxk99 (principles-and-considered-judgments-mutually-adjust-until-coherent, reflective equilibrium) cites Scanlon's 2014 *Being Realistic About Reasons* solely as a further cross-domain attestation of Rawlsian reflective-equilibrium methodology; it neither states nor grounds the contractualist formula or the buck-passing/basicness claim this atom carries — a genuinely distinct axis (method versus metaethical subject matter). lex-kfk68 (categorical-imperative-universalizability-as-moral-test) carries a Tier-3 aside on this same book, including a close paraphrase and partial quotation of the contractualist formula itself, framed as 'another modern Kantian-procedural framework' — a comparison to Kant's Groundwork test, which remains lex-kfk68's sole primary grounding. It never states or grounds Scanlon's own distinctive claim that reasonable-rejectability is metaethically basic rather than a downstream test for an independently-existing wrongness fact (the buck-passing denial, Introduction and Chapter 5), and contains none of Chapter 7's promise/expectation machinery (Principle F, the Guilty Secret, the boomerang case) used here to demonstrate the basicness claim in concrete operation. This atom's headline claim — the basicness/buck-passing metaethical move, not the formula's surface resemblance to Kant — is a genuine gap relative to lex-kfk68's comparative aside. lex-7mdpd, lex-d6vbs, lex-9wbd3, and lex-xuwr2 confirm the Kant-direction contrast, the utilitarian-aggregation contrast, and the Rawlsian-institutional-domain contrast asserted in agent-instruction as accurate restatements of those atoms' actual headline claims, rather than assumptions from titles alone; all four are genuine, non-overlapping neighbors."
canonical-instances:
  - "The buck-passing denial itself, stated as a direct rejection of a named rival view: 'Many people might agree that an act is wrong if and only if it could not be justified to others on grounds that they could not reasonably reject. But they might say that this is true only because what people could or could not reasonably reject is determined by facts about what is right or wrong in a deeper sense that is independent of any idea of reasonable rejection... My view denies this.' This is the single passage that makes lex-m33nq non-redundant with a bare restatement of the contractualist formula: the formula could be held by someone running Picture A (rejectability tracks an independent wrongness-fact); Scanlon is explicitly, by name, denying that this is what he is doing."
  - "Principle F and the promise case: rather than explaining the wrong of promise-breaking via Hume's 'artificial virtue' of a social convention or Rawls's principle of fairness (benefiting from a just practice obligates compliance with its rules), Scanlon derives the duty to perform (not merely warn or compensate) directly from what potential promisers and promisees could not reasonably reject — 'Principle F is not just the social institution of promising under another name... its validity does not depend on its being generally recognized or adhered to.' The wrongness of breaking a specific promise is not explained by an antecedent fact 'promise-breaking is wrong' plus a rule; it is constructed entirely from the reasonable-rejectability weighing itself."
  - "The Guilty Secret (a promise, made at a party to an old acquaintance named Harold, not to repeat an embarrassing story from years earlier) and the state-of-nature boomerang exchange (a stranger throws back a lost spear on the conditional expectation that his boomerang will be returned, with no social practice of agreement-making presupposed at all): both cases are Scanlon's own deliberately constructed test instances, stripping away every institutional or practice-based fact to show that the same wrong-making structure — a knowingly and voluntarily created, reliance-worthy expectation, defeated without adequate justification — survives intact. This is the buck-passing claim demonstrated in miniature rather than merely asserted."
  - "Kant's own footnote objecting to the Golden Rule ('the criminal could argue against the judge who sentences him'), and Scanlon's reading of Kant's own reply as already gesturing toward a relational, other-directed test ('what general principles of action could we all will') rather than the agent's solo universalizing will — used by Scanlon to mark the DIRECTION-of-test distinction (self-legislating will vs justifiability to every affected party) between his own contractualism and Kant's categorical imperative, even while both are read as sharing a formal-procedural shape."
  - "Scanlon's explicit demarcation of his own narrower target — 'what we owe to each other,' the interpersonal morality of harm, coercion, deception, and aid — from Rawls's institutional-justice domain of 'moral primary goods' and 'the distribution of primary social goods': 'it does not seem very likely, for example, that we could come up with a list of \"moral primary goods\" which could form the basis of a quite general \"moral division of labor\"... Morality (even the morality of obligation) is not \"about\" the provision of any such list of goods in the way that the question of the justice of social institutions can plausibly be held to be.' This is Scanlon's own boundary-drawing between his contractualism and the Rawlsian contractualist-family atom at lex-xuwr2."
critical-questions:
  - "Is the wrongness of this act being explained by an independent, prior fact about wrongness ('it's wrong because it's a killing/deception') that reasonable-rejection is merely detecting — or is the reasonable-rejection weighing itself doing all the explanatory work, with no further fact feeding in from outside? Scanlon insists on the latter; check whether the reasoning in front of you has quietly smuggled in the former."
  - "Is this a test of the AGENT'S OWN will (Kant's solo universalizability, autonomy-grounded, lex-kfk68/lex-d6vbs) or a test of JUSTIFIABILITY TO EVERY AFFECTED PARTY (Scanlon's relational, avowedly-heteronomous contractualism)? The direction of justification — inward to one's own rational will vs outward to others' possible grounds for rejection — is a real divergence Scanlon names himself, not a stylistic variant of the same test."
  - "Is the case being assessed by weighing GENERIC 'objections to permission' against 'objections to prohibition' from each affected standpoint (Scanlon's method), or by tallying an aggregate sum of costs and benefits across all affected parties (Mill's GHP, lex-9wbd3)? These can and do diverge, especially where a large aggregate benefit would be purchased by placing a serious, uncompensated burden on a few."
  - "Is the domain in question actually 'what we owe to each other' — duties not to harm, coerce, deceive; duties of aid, considered one person's standpoint at a time — or is it the justice of social institutions and the distribution of primary goods (Rawls's domain, lex-xuwr2)? Scanlon is explicit these are different, non-interchangeable targets even though both draw on a contractualist-family method."
  - "If a promise, a lie, or a relied-upon expectation is the case at hand, is the wrong being explained via an institutional/social-practice fact (a convention exists, therefore violating it is wrong) or via the non-institutional buck-passing structure Scanlon builds with Principle F, the Guilty Secret, and the boomerang case? Scanlon's own argument is that the institutional story is dispensable — check whether the wrong-making structure survives if the institutional fact is stripped away, per his own test."
