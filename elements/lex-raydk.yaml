id: lex-raydk
name: dominant-category-stratifies-into-hegemonic-complicit-subordinate-marginalized
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "Recognize this when a collectively-privileged category (masculinity, whiteness, citizenship, professional standing, religious belonging, political-tribe membership, employed-status) appears uniform from outside but on closer examination contains FOUR DISTINCT INTERNAL POSITIONS arranged hierarchically. Connell's canonical case: masculinity is not one thing but four-position structure: (1) HEGEMONIC masculinity — the currently-culturally-exalted configuration that legitimates patriarchy (corporate executive, military officer, top athlete in many Western contexts); (2) COMPLICIT masculinity — the men who do not fully embody the hegemonic ideal but receive `the patriarchal dividend` (most men in the dominant ethnic + class category; they benefit without doing the work of being the ideal); (3) SUBORDINATED masculinity — masculinities defined within the category but explicitly subordinated (most prominently gay masculinity in the U.S. context; effeminate men); (4) MARGINALIZED masculinity — masculinities defined by intersection with other axes of oppression (working-class men of color, disabled men) whose relationship to the hegemonic ideal is structured by the additional axes. The transferable consequence: a category that produces collective privilege does so through INTERNAL STRATIFICATION, not through uniform privilege-distribution. Members within the privileged category have systematically different relationships to the hegemonic ideal. Counter-hegemonic struggle within the category (`men's liberation,` `white anti-racism,` `professional dissident movements`) often requires recognizing internal stratification — the strategic question is which internal-position can be politically mobilized. Transferable applications: hegemonic whiteness vs complicit-white-majority vs subordinated-poor-whites vs marginalized-mixed-race-passing in U.S. racial structure (Wray 2006 *Not Quite White*; Roediger 1991 *Wages of Whiteness*); hegemonic Christianity (white evangelical Protestant) vs complicit mainline Protestant + Catholic vs subordinated Latter-day-Saints + Jehovah's Witnesses vs marginalized non-white Christians in U.S. religious-political alignment (Wuthnow 1988); hegemonic professional identity (the `real engineer` who codes in a hostile-named language, works long hours, has no other interests) vs complicit-professional vs subordinated-niche-professional vs marginalized-from-the-canon; hegemonic citizenship (native-born landowner of voting age) vs complicit-naturalized-mainstream vs subordinated-resident-non-citizen vs marginalized-undocumented; hegemonic startup-founder identity (Stanford-MIT-Y-Combinator pedigree) vs complicit-founder vs subordinated-bootstrap-founder vs marginalized-women-and-minority founders. The atom does NOT claim the four positions are perfectly discrete; the framework is a continuum + relational-map, not a typology. Distinct from lex-jd7fe enduring-power-reproduces-through-cultural-consent (Gramsci macro hegemony — the same internal-position framework applied to political-economic structure as a whole). lex-raydk names the INTERNAL-STRATIFICATION of a single supposedly-uniform privileged category. lex-jd7fe is the macro layer; lex-raydk is the within-category structure. They compose. Distinct from lex-et8q2 intersectional-position-not-decomposable (Crenshaw — intersection is non-additive); lex-raydk names the relational hierarchy WITHIN a single category. Distinct from lex-t7xcp common-oppression-claim-erases-intra-group-stratification (which names the discursive ERASURE of stratification when the privileged claim oppression); lex-raydk names the underlying STRATIFICATION structure. lex-t7xcp + lex-raydk compose — lex-raydk is the structure that lex-t7xcp's appropriating-rhetoric erases. Use when (i) a debate hinges on `is X group privileged or not,` (ii) a movement within a privileged category seeks to organize change and needs to identify which internal position to mobilize, (iii) you're designing for a privileged-category context and need to anticipate that complicity dividends are not uniformly distributed."
