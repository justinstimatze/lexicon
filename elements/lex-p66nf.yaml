id: lex-p66nf
name: legitimate-access-is-recognized-by-relationship-not-mere-entry
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "Legitimate authority over a group is recognized by an established relational signal built over time, not by the mere technical act of gaining entry to the same space the group occupies — sheep know their own shepherd's voice and follow him, but flee from a stranger's voice even if the stranger enters by the same gate. Someone who climbs in some other way, bypassing the door entirely, is marked as an intruder regardless of what they do once inside; the relationship, not the point of entry, is what the sheep are actually responding to."
related: []
evokes: [kjv, the-good-shepherd, he-calleth-his-own-sheep-by-name, a-stranger-will-they-not-follow, entereth-not-by-the-door]
lineage:
  - source: primary
    text: kjv-1611-john-10-the-good-shepherd
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), John 10:1-5. Verified verbatim against a direct extraction of the held copy."
    quote: "He that entereth not by the door into the sheepfold, but climbeth up some other way, the same is a thief and a robber. But he that entereth in by the door is the shepherd of the sheep. To him the porter openeth; and the sheep hear his voice: and he calleth his own sheep by name, and leadeth them out. And when he putteth forth his own sheep, he goeth before them, and the sheep follow him: for they know his voice. And a stranger will they not follow, but will flee from him: for they know not the voice of strangers."
canonical-instances:
  - "A new hire with the correct badge and full system access still can't get the team to actually follow their direction on a project, while a former lead with no official title left over from the reorg still gets deferred to on every call — access and legitimacy turned out to be two different things, and the relationship is what the team was actually responding to all along."
critical-questions:
  - "Is the trust being placed in the recognized voice actually still warranted, or has the relationship become a habit that no longer tracks whether this particular leader is still acting in the group's interest?"
status: active
