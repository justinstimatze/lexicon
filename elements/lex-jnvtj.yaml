id: lex-jnvtj
name: incoherent-demands-as-control-mechanism
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When demands are being framed as merely reasonable but cannot all be met, surface that incoherent simultaneous demands function as a control mechanism — the impossibility of full compliance creates permanent susceptibility to sanction."
related: [lex-cgqta, lex-5d8hm, lex-brcgz, lex-k2kdc, lex-vacbr]
scaffolds-from: [lex-cgqta]
evokes: [double-bind-as-control, bateson-1956-as-clinical-sub-case, contradiction-produces-chronic-failure, character-deficit-as-system-output, willing-and-intelligent-obedience-while-crushing-the-vestige]
lineage:
  - source: primary
    text: Truth-1850-NarrativeOfSojournerTruth
    citation: "Sojourner Truth (as told to Olive Gilbert), *Narrative of Sojourner Truth* (1850). (PG 1674). The 'gigantic inconsistency' passage names the slaveholder-system's mechanism: simultaneously expecting *willing and intelligent obedience* from the enslaved person *because he is a man* — and simultaneously deploying every system-resource to *crush the last vestige of a man within him*. The two demands cannot be jointly met; the chronic adaptive-failure that results is then cited as evidence of the subject's natural incapacity. The contradiction is not an accident — it is the control mechanism."
    quote: "[Truth 1850 (Gilbert transcription) lines 161-168:] 'that gigantic inconsistency, that inherited habit among slaveholders, of expecting a willing and intelligent obedience from the slave, because he is a MAN—at the same time every thing belonging to the soul-harrowing system does its best to crush the last vestige of a man within him; and when it is crushed, and often before, he is denied the comforts of life, on the plea that he knows neither the want nor the use of them, and because he is considered to be little more or little less than a beast.' [Practitioner-extraction: Truth names the mechanism, not just the result. The 'inconsistency' is the operational form of the control system. The system requires manhood (for obedience-with-judgment) AND requires un-manhood (for justifying degradation). The double demand produces a chronic failure-to-meet-either, which becomes the cited-evidence for further degradation. Self-perpetuating loop: contradiction-as-control.]"
  - source: discovery-loop
    text: feminist-theory-mining-pass-.3-.2
    citation: "phase 6 (Truth narrative) surfaced W20. unified W14/W21/Truth-slaveholder-logic into lex-cgqta naturalization-erases-the-mechanism (the *result* claim: system produces character then naturalizes it). mint of lex-jnvtj splits out the *mechanism* claim: contradictory demands produce chronic adaptive-failure, which the system then cites. Distinct from lex-cgqta (which is the umbrella result-claim); 0288 says 'mechanism erased,' 0295 names the specific mechanism. Bateson 1956 family-systems research (*Toward a Theory of Schizophrenia*) is the formal clinical articulation of double-bind theory; W20/lex-jnvtj is the broader structural claim of which Bateson's clinical case is a sub-instance. Substrate gap-fill: no existing atom names contradictory-demand-as-control-mechanism."
    quote: "Transferable scope is wide: workplace double-binds ('be a team player AND demonstrate individual ambition'; 'be assertive AND likeable'); academic incentive structures ('publish high-quantity AND high-quality'); abuser dynamics ('be perfect on demand AND don't anticipate'); authoritarian-state demands ('be loyal AND disagree only constructively'); polite-society norms ('don't complain AND advocate for yourself'). The general primitive: the system requires two things that cannot be jointly satisfied; the subject's failure-to-satisfy-either becomes evidence-against-the-subject; the contradiction is doing control work, not poorly-designed coordination."
canonical-instances:
  - "Truth 1850 slaveholder-logic: the system requires willing-intelligent-obedience (which presupposes manhood) AND requires crushing-the-last-vestige-of-manhood (which precludes manhood-required-for-obedience). The chronic failure-to-meet is then cited as evidence of innate incapacity. The contradiction is the mechanism, not a design flaw."
  - "Bateson 1956 family-systems double-bind theory: in schizophrenogenic family dynamics, the patient receives contradictory demands at different logical levels (e.g., 'come close' verbally while 'go away' nonverbally) with no escape from the meta-frame. Bateson's clinical claim is a sub-case of the broader structural primitive."
  - "Workplace 'be assertive but not aggressive / be likeable but command respect' double-bind on women in leadership: documented systematically since Eagly + Karau 2002 *Role Congruity Theory of Prejudice Toward Female Leaders*. The contradiction is structural; the women's chronic failure-to-satisfy-both produces evaluations cited as evidence of leadership-incapacity."
  - "Academic 'publish frequently AND high-quality' incentive: tenure committees and grant systems demand both, knowing the two are in tension. Researchers' adaptive failures (corner-cutting, salami-slicing, p-hacking) are then cited as evidence of researcher-character; the systemic contradiction is rarely named as the mechanism."
  - "Abuser-dynamics 'be perfect on demand AND don't anticipate / read my mind' contradiction: a chronic feature of controlling intimate-partner relationships. The target's chronic failure to perfectly anticipate while not actively-anticipating becomes the citable evidence of inadequacy; the contradiction is the abuser's control mechanism."
  - "Polite-society demand on subordinated groups: 'don't complain' AND 'advocate for yourself.' The contradiction makes any visible resistance into complaint-style (cited as evidence the subordinated group is ungrateful), while silence is cited as evidence they have no real grievance. The double-bind closes off both moves and is the control structure."
  - "Authoritarian-state demand on intellectuals: 'be loyal' AND 'disagree only constructively.' Disagreement is recoded as disloyalty; agreement is recoded as sycophancy. The contradictory demand structures the intellectual class into a chronic failure-to-be-credible-either-way."
  - "operationally adjacent to lex-cgqta naturalization-erases-the-mechanism: 0288 is the umbrella result-claim (system produces character, then calls it natural, erasing the production). 0295 names *one specific mechanism* by which the production happens — contradictory demands generating chronic adaptive-failure. 0288 + 0295 fire together when both result and mechanism are named explicitly."
  - "operationally adjacent to lex-k2kdc constitutive-defense-when-the-defense-generates-the-threat: both are self-perpetuating-loop atoms. 0245 is the defense-against-X-generates-X loop; 0295 is the demand-of-X-and-not-X-generates-chronic-failure loop. Distinct generative mechanisms; both are diagnostic of structural rather than incidental damage."
critical-questions:
  - "are the demands actually contradictory or just demanding? The atom requires that the two demands cannot be *jointly* satisfied (no policy by which the subject can meet both). If they're hard-but-jointly-satisfiable, you're looking at high-difficulty not control-by-contradiction. Discriminator: does any successful exemplar exist who consistently satisfies both? If yes, the constraint is hard not impossible, and the atom doesn't apply."
  - "is the failure-output being cited as character-evidence? The atom's full operational form requires the *feedback loop* — the chronic-adaptive-failure produced by the contradiction is then attributed to the subject (not to the system imposing the contradiction). If the system acknowledges its own contradiction as the cause of the failure, the atom is not fully operating; the control function depends on the cause being misattributed."
  - "is there an escape via meta-level reframing? Bateson's clinical observation: double-binds become pathogenic when the meta-frame is also forbidden ('and don't comment on the contradiction'). The atom's strongest deployment requires meta-frame closure — when the subject can name the contradiction without sanction, the control mechanism weakens. The presence/absence of meta-frame-permission is diagnostic of how deep the control runs."
  - "what is the system getting out of the contradiction? Atom presumes the contradiction is *functional* for the system, not just incompetent design. Functional outcomes include: keeping subjects in chronic-self-doubt; producing citable-evidence of subject-deficiency; legitimating the controller's ongoing intervention; preventing solidarity (subjects blame themselves rather than the system). Map the function to confirm the atom rather than a design-flaw."
  - "distinct from genuinely-hard tradeoffs the system is also subject to? Some apparent double-binds are universal hard-tradeoffs the system itself navigates (resources are scarce, attention is limited). Atom fires when the contradiction is *imposed asymmetrically* — the system has escape-routes (it can change either demand) that the subject does not. Discriminator: does the system bear the same contradiction or only impose it? Asymmetric imposition is the atom's diagnostic."
severity-tier: warning
status: active
