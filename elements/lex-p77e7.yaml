id: lex-p77e7
name: identifier-lookup-walks-the-frame-chain-outward-from-its-binding-environment
type-in: structure
type-out: process
_tier: atomic
status: active
agent-instruction: "Recognize this when you face a name that has no intrinsic referent and must be resolved against a context: a variable in a program, a CSS selector against a stylesheet cascade, a key in a chained-dictionary configuration, a class method against an MRO, a tool name against a `$PATH`, a git config option against the system→global→repo→worktree hierarchy, a model hyperparameter against an experiment → trial override stack. SICP's transferable claim (Ch.3.2): an environment is a sequence of FRAMES; each frame is a table of (name → value) bindings plus a pointer to its ENCLOSING environment; the value of a name with respect to an environment is the binding found in the FIRST frame in the chain that contains a binding for that name; if no frame binds it, the name is UNBOUND. Three decisive consequences. (1) NO INTRINSIC MEANING — `expressions in a programming language do not, in themselves, have any meaning. Rather, an expression acquires a meaning only with respect to some environment in which it is evaluated.` The transferable lesson: any time a name appears divorced from its resolution context, you are looking at half the meaning; the other half is the chain it would resolve against. (2) CAPTURE-AT-DEFINITION, NOT AT-CALL — a procedure is a pair of (code, pointer-to-environment-where-defined). When the procedure is later applied, the new frame's enclosing environment is the captured one, NOT the caller's. This is LEXICAL scoping; the alternative (dynamic scoping, where the caller's chain is used) breaks abstraction because callers can silently rebind names the procedure depends on. The CSS analogue: a stylesheet rule's specificity is computed against the cascade at the point of declaration, not at the point of element-paint. (3) SHADOWING IS NEARNESS — when two frames in the chain both bind the same name, the INNER (nearer) binding wins; the outer is `shadowed.` The transferable diagnostic: override-by-locality is the universal mechanism by which configuration cascades, language scope, MRO method resolution, and unix `$PATH` lookup let local context override defaults without mutation. Transferable applications: (a) lexical scope in any modern language (Scheme, Lisp, Python, JS, Rust, Go closures) — the procedure value carries the defining environment; (b) closures as first-class values that hold captured state (the SICP `make-withdraw` example: each call to make-withdraw creates a fresh frame E_n; each returned procedure captures its own E_n; calls to W1 vs W2 reference distinct balance bindings even though the code is identical); (c) CSS cascade — selector specificity walks the inheritance chain from the element outward to the root, with `:root` defaults shadowed by more-specific selectors; (d) git config hierarchy — `system > global > local > worktree`, with each level shadowing outward defaults; (e) shell `$PATH` — first matching binary in the colon-separated chain wins; (f) Python class MRO (C3 linearization) — method resolution walks the linearized class chain outward; (g) configuration cascades (dotenv files, k8s ConfigMaps with overrides, npm `package.json` workspace inheritance) — local config overrides upstream; (h) ML hyperparameter scoping — experiment-level defaults overridden by trial-level overrides overridden by per-run flags; (i) database transaction isolation — the transaction-scoped view of a row shadows the committed value until commit. Distinct from lex-e2tnt cognitive-environment-as-scope (Sperber-Wilson Relevance Theory — meaning relative to MUTUAL social-cognitive context between speaker and hearer; lex-p77e7 is about FORMAL binding-resolution in compositional languages where the chain is explicit and walkable). Distinct from lex-da3g3 iteration (procedural-vs-recursive process shape; lex-p77e7 is about how NAMES inside any process resolve). Distinct from lex-bg3ad forgetting-particulars-is-the-mechanism-of-abstraction (lossy compression as abstraction; lex-p77e7 is about contextual resolution). Counter-move when a name appears indispensable in an analysis without its frame chain made explicit: ask which environment binds it, which frames the chain walks through, and what would shadow it. The failure modes: (i) dynamic-scope leakage (the called function silently rebinds something the caller depended on); (ii) chain-too-deep (resolution walks 20 frames; performance degrades or the source of the binding becomes opaque); (iii) shadow-by-accident (a local name silently shadows a critical outer binding, the bug is hard to find because the OUTER is what looked relevant)."
