lineage:
  - source: primary
    text: cushing-grass-straws-defeat-the-underworld-people-where-weapons-fail
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'How the Twins of War and Chance, Ahaiyuta and Matsailema, Fared with the Unborn-Made Men of the Underworld.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'P'it! tsok! sang the arrows through and through the people, but never a one fell. ... yet the man was only confused (he was too soft and unstable to be hurt) ... Hold, brother, I have it! Hold! cried Ahaiyuta. Then he snatched up a bunch of dry plume-grass and leaped forward. Swish! Two ways he swept the faces and breasts of the pursuers. Lo! right and left they fell like bees in a rain-storm, and quickly sued for mercy, screeching and running at the mere sight of the grass-straws.'"
canonical-instances:
  - "A software team throws increasingly powerful and expensive infrastructure at a performance problem, assuming the workload just needs more raw compute, when the actual bottleneck is a single inefficient database query that a five-minute index change fixes completely, a fix trivial compared to the hardware they'd been scaling up."
  - "A negotiator tries increasingly aggressive legal threats against a counterparty who seems immune to pressure, only to discover that the counterparty cares far more about a small, easily granted concession on timeline than about anything the escalating threats could take away, and that concession resolves the standoff outright."
critical-questions:
  - "How would the brothers have discovered that grass-straws, rather than some other trivial object, were the specific thing matched to these people's nature, without first observing closely how the people themselves reacted to wind, food, and birds -- does this tactic require prior observation, or could it have been guessed from first principles?"
  - "Is there a risk in generalizing from 'the strong weapon failed' to 'therefore a weak one will succeed,' given that the actual reasoning here depends on specific knowledge of insubstantiality rather than a general principle that weakness beats strength -- could this lead someone to try random weak solutions without understanding why the target's nature calls for one?"
  - "Does this pattern only apply to opponents who are quite literally differently constituted, as the Underworld people are, or does it generalize to situations where an opponent's vulnerability is metaphorically rather than physically different from what a standard approach assumes?"
