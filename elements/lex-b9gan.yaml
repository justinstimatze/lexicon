id: lex-b9gan
name: trust-the-core-fact-discount-the-panicked-reporters-scale-claim
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A panicked report has two separable parts, the bare fact that something bad happened and the reporter's own estimate of how total the disaster was, and a known bias in the reporter's type can tell you to discount the second part while still fully acting on the first. In Cushing's telling, a single young Turkey stumbles home shouting 'Murder! Murder!' after a raid, sobbing 'I, alone, am left to tell of it; ere I left they were thrown down all around me.' Áhaiyúta and his brother don't dismiss the report, they mobilize instantly on its core fact, but they refuse to accept its scope: 'there will yet many return, for this is but a Long-leg, and surely when he could save himself others and older ones could,' reasoning from a general pattern they already know, that the young and inexperienced consistently overestimate a catastrophe's totality. They were right on both counts: an attack had genuinely happened, and 'one by one, or in little bunches, the Turkeys came fleeing in,' meaning losses were real but nowhere near total. Diagnostic move: when a report comes from someone whose class of reporter is known to catastrophize, don't treat trusting the alarm and doubting the scope as contradictory positions -- act on the confirmed fact immediately while holding the totality claim as unverified until independent arrivals, survivors, or evidence settle it."
