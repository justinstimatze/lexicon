id: lex-pumgz
name: democracy-is-justified-as-least-evil-not-as-always-right
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone treats a bad or unpopular majority decision as proof that democracy has failed, check what the actual justification for democracy was supposed to be. Popper's own version never rested on majorities being correct. His fourth thesis states it directly: 'We are democrats, not because the majority is always right, but because democratic traditions are the least evil ones of which we know.' The justification is comparative -- least evil among known alternatives -- not evaluative of any particular majority's output. He draws the practical consequence immediately: 'If the majority (or public opinion) decides in favour of tyranny, a democrat need not therefore suppose that some fatal inconsistency in his views has been revealed. He will realize, rather, that the democratic tradition in his country was not strong enough.' A bad majority vote doesn't refute the case for the procedure, since the case rested on comparison to the alternatives rather than on the procedure's outputs being good. What it locates is the strength of the surrounding tradition, a separate and checkable question from whether democracy as such was ever the right call. Diagnostic move: before treating a bad democratic outcome as an argument against democracy, or defending democracy by insisting its outputs are usually right, check which of the two justifications is actually in play. The comparative one survives a bad outcome; the correctness-of-outputs one was the wrong argument to make in the first place."
