id: lex-sen3y
name: warning-against-carelessness-does-nothing-against-a-planned-betrayal
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you ask someone to be careful with your safety, you are implicitly betting that the danger is accidental -- that carelessness, not intent, is what threatens you. That bet fails completely if the other party's harm was planned from the start, because a deliberate plan does not need a moment of carelessness to succeed. In Radin's Winnebago Trickster cycle, Trickster accepts a ride on a turkey-buzzard's back and, growing uneasy in the air, pleads, 'Be very careful, younger brother, be very careful, for you might drop me.' The bird obliges outwardly and keeps carrying him properly -- there is no carelessness at all. But the bird was never at risk of an accident: 'the turkey-buzzard, however, was busily looking for a hollow tree. He wanted to play a trick on Trickster.' It finds one, flies close, and drops Trickster in on purpose. Trickster's plea addressed the wrong threat model entirely, and no amount of the bird 'being careful' was ever going to protect him from a plan that careful execution was actually serving. Diagnostic move: when you feel unsafe with someone and your instinct is to ask them to be more careful, check whether the risk you're worried about is really an accident risk at all -- a plea for care only protects you against negligence, and does nothing at all against calculation."
