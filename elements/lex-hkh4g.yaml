id: lex-hkh4g
name: each-group-imagines-the-divine-in-its-own-image
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When a group describes an entity nobody can directly observe -- a god, an ideal leader, the essential nature of some outgroup -- check whether the description tracks the entity itself or simply reflects the describer back at themselves. Xenophanes, one of the earliest philosophers on record making this diagnosis explicit, on how different peoples describe their gods: 'The Ethiops say that their gods are pug-nosed and black while the Thracians say that theirs have blue eyes and red hair. Yet if cattle or horses or lions had hands and could draw and could sculpture like men, then the horses would draw their gods like horses, and cattle like cattle, and each would then shape bodies of gods in the likeness, each kind, of its own.' The mechanism: when a category has no independent check available -- nobody can look at a god directly and compare it to competing descriptions -- every group's account converges on a description of the group itself rather than of the thing being described. With no external test available to expose the projection, each group experiences its own account as a discovered fact. Diagnostic move: when comparing multiple groups' accounts of an unobservable entity and every account happens to resemble the group producing it, treat the resemblance itself as evidence about the mechanism generating the accounts, not about the entity they claim to describe."
