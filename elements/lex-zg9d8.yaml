id: lex-zg9d8
name: the-method-of-studying-a-change-is-itself-an-unannounced-change
type-in: claim
type-out: warning
_tier: atomic
agent-instruction: "When designing research or a diagnostic process to study how people respond to some disruption (a technological change, a policy shift, an organizational reorganization), remember that introducing a NOVEL METHOD of studying them — participant observation, structured interviews, sensors, surveys, sociometric mapping — is itself an unfamiliar intervention imposed on the subjects, one that can be as disruptive as, or more disruptive than, the very phenomenon it is meant to study, and it predictably provokes the same kind of suspicion and resistance the object of study itself provokes. Merton: 'This reminds us that social research itself takes place within a social setting. The social scientist who fails to recognize that his techniques of participant-observation, interviewing, sociogramming, and the like represent an innovation for workers and supervisors greater, perhaps, than technological changes in the plant would indeed be a dubious believer in his own findings. Resistance to this innovation can be anticipated, if only because it is remote from run-of-the-mill experience of most people.' He then names the actual reception such methods receive on the ground: 'Those who have engaged in social research among workers and administrative personnel need not be told of the mingled suspicion, distrust, uneasy amusement, and, often, open hostility with which they were initially met. Unfamiliarity with this type of inquiry, coupled with its apparent inquisitiveness into areas of tension and private affairs, makes for some measure of resistance.' Diagnostic use: before treating subjects' resistance, guardedness, or performance-for-the-observer as data ABOUT the phenomenon under study, first rule out that some or all of the reaction is actually a response to the unfamiliar act of being studied this way at all — the instrument's own novelty is a confound the researcher has to budget for, not a nuisance external to the design."
related: [lex-dr8mf]
