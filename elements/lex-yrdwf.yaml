lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'What is Dialectic?' (paper read to a philosophy seminar at Canterbury University College, Christchurch, New Zealand, 1937; first published in Mind, N.S. 49, 1940), Ch. 15 of Conjectures and Refutations (Routledge Classics, 2002), p.443, Section 2 'Hegelian Dialectic.'"
    quote: "'We shall see clearly that it is not a real answer if we only consider some analogous argument, like: \"How can this mirror reflect my face?\"--\"Because it is face-like.\" Although this sort of argument is obviously utterly unsound, it has been formulated again and again. We find it formulated by Jeans, for instance, in our own time, along lines like these: \"How can mathematics grasp the world?\"--\"Because the world is mathematics-like.\" He argues thus that reality is of the very nature of mathematics--that the world is a mathematical thought (and therefore ideal). This argument is obviously no sounder than the following: \"How can language describe the world?\"--\"Because the world is language-like--it is linguistic\", and no sounder than: \"How can the English language describe the world?\"--\"Because the world is intrinsically British.\"'"
canonical-instances:
  - "A vendor explains why their machine-learning recommendation engine fits customer behavior so well: 'because customer preferences are algorithm-like.' A rival vendor selling a rule-based system could say, with equal confidence, that customer preferences are rule-like. Both explanations survive only until someone asks what happens to the claim about customers when the tool being sold changes -- at which point neither one was ever really about the customers."
  - "A consulting firm explains why its maturity-model framework maps so cleanly onto client after client: 'because organizations are naturally maturity-stage-like.' A competing firm's five-forces or OKR framework could claim the identical fit for the identical companies. The framework's fit measures how flexible the framework is, and it stops there -- it says nothing about what organizations essentially are."
critical-questions:
  - "Doesn't physics sometimes genuinely discover that reality has a mathematical structure -- isn't this atom dismissing that too fast? No -- there's a real, interesting fact here worth explaining: mathematics turns out to be an unusually effective language for describing this particular world. The atom targets a further move that goes beyond that fact: sliding from 'mathematics describes the world well' to 'therefore the world literally is mathematics' (or mind, since mathematics is a mental construction) -- that leap is what Popper is refuting through the Jeans example."
  - "How is this different from any claim that one thing resembles another -- is all resemblance-talk empty? No -- the atom targets one specific reflexive form: 'tool T can reach object O because O is T-like,' offered as an explanation of T's descriptive reach. The diagnostic is the substitution test: swap in an incompatible tool and see whether the supposed nature of O changes to match it. An ordinary resemblance claim ('this fossil looks bird-like') doesn't have that self-referential structure and isn't what's being targeted."
