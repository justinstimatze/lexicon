id: lex-2wrfx
name: bait-recruitment-attempts-with-a-decoy-who-appears-disloyal
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you want to find out who is trying to recruit insiders against you, don't wait for a genuine defection to surface — plant a decoy whose actual loyalty is unquestioned but whose visible circumstances make them look like a promising recruitment target, and let real adversaries reveal themselves by approaching the bait. Kautilya names this directly as one of two counter-espionage methods: the king shall 'post at the frontiers high officials of unquestioned loyalty but acting as if they had a reason for acting disloyally [in order to attract approaches from enemy agents].' The mechanism works because an adversary's recruitment process itself requires them to make contact, disclose their interest, and reveal their methods and cutouts — all of which is otherwise invisible until a recruitment succeeds or is discovered by accident. By manufacturing a plausible-looking opportunity (an official who appears disgruntled, financially desperate, or resentful enough to be recruitable) and staffing it with someone whose actual loyalty is already known, the defender converts the adversary's own initiative into the detection mechanism, rather than relying on catching an actual traitor after real damage has already been done. The technique is paired, in the same passage, with a second and more general method — 'employ his own roving and non-roving spies, who shall adopt disguises or covers similar to those of enemy agents' — but the decoy-official method is distinct in that it doesn't require guessing where enemy agents operate; it makes the enemy's own recruitment targeting come to a location and person the defender already controls. Diagnostic move: when trying to detect an adversary's recruitment or infiltration effort before it succeeds, consider whether a controlled, visibly-plausible decoy — a person, account, or opportunity that looks like an attractive target but is actually fully monitored and loyal — would surface the adversary's approach methods and personnel more reliably than passive monitoring or waiting for an actual breach to occur."
related: [lex-4x9pr]
evokes: [decoy-official-appears-disloyal, attract-enemy-recruitment-approaches, counter-espionage-bait, kautilya-frontier-decoy]
lineage:
  - source: primary
    text: kautilya-arthashastra-counter-espionage-decoy
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IX 'Covert Operations,' section 'Creating the Secret Service,' 'Counter Espionage,' {1.12.24,25}."
    quote: "'In order to uncover enemy agents [operating in his own territory] the king shall: (i) employ his own roving and non-roving spies, who shall adopt disguises or covers similar to those of enemy agents and act with great secrecy; (ii) post at the frontiers high officials of unquestioned loyalty but acting as if they had a reason for acting disloyally [in order to attract approaches from enemy agents].'"
canonical-instances:
  - "A corporate security team, suspecting a competitor is trying to recruit insiders to leak trade secrets, sets up a monitored 'honeypot' employee account that appears to have financial trouble and grievances against management (visible in ways an outside recruiter could discover), and waits to see who makes contact — the actual recruitment attempt, once it comes, reveals the competitor's methods and the specific person running the operation."
  - "A counterintelligence agency maintains a known, loyal officer in a sensitive post whose personal file is deliberately seeded with signs of financial distress and resentment (a large gambling debt, a passed-over promotion) visible to anyone doing background research on recruitment targets, specifically to see which foreign services take the bait and how they approach him."
critical-questions:
  - "does staffing a decoy role with someone of unquestioned loyalty actually protect against the risk that the decoy, having been given real access and real grievance-adjacent circumstances (even manufactured ones), might genuinely be tempted or compromised over time — does the bait eventually become indistinguishable from a real vulnerability?"
  - "how would a defender know a recruitment attempt against the decoy is a genuine adversary approach and not itself a counter-counter-espionage test by the same adversary, suspecting the position might be bait — does this technique risk an infinite regress of second-guessing once both sides know the tactic exists?"
  - "is there a meaningful ethical or legal distinction between this technique and entrapment, given that a 'high official... acting as if they had a reason for acting disloyally' is actively inviting an approach rather than merely being available to be approached — does the active invitation change how any resulting prosecution or consequence for the enemy agent should be judged?"
status: active
