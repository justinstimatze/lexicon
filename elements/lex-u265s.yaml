name: an-ambush-predators-own-stillness-lets-a-saboteur-disable-it-unseen
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A predator that survives by staying perfectly still and pretending to be harmless has created the one condition that makes it safe to disable at close range -- its own camouflage strategy prevents it from reacting to a threat it must pretend not to notice. In Cushing's telling, a man-eating giant lies across a mountain trail feigning sleep and frailty to lure travelers close, and his grandmother-in-myth, a tiny spider, uses exactly this stillness against him: 'The Spider stepped never so lightly, and climbed up behind his great ear, and then busily wove at her web, to and fro, up and down, and in and out of his eyelashes she busily plied at her web.' The giant feels it, 'Pesk the birds and buzz creatures!' growled the giant, twitching this way and that his eyebrows, which tickled, but he would not stir, for he heard the approaching War-gods and 'needs must feign sleepy.' His entire predatory strategy depends on not breaking character, and that exact discipline is what lets the spider finish blinding him completely, uninterrupted, while he is close enough to kill her in an instant if he simply moved. Diagnostic move: when a threat's power depends on staying undetected or appearing passive, recognize that the discipline required to maintain that disguise is itself an opening -- the more committed they are to not reacting, the longer a covert countermeasure against them can work unopposed."
