id: lex-k6uwd
name: arrange-proximity-to-the-core-asset-in-rings-matched-to-trust-level
type-in: process
type-out: structure
_tier: atomic
agent-instruction: "When organizing physical or organizational space around a valuable asset, don't grant proximity based on rank, seniority, or convenience alone -- assign it based on how much you actually trust each group, in concentric rings, so that the people closest to what matters most are also the people least likely to threaten it, and the least-trusted elements are positioned where a betrayal costs the least. Kautilya's design for a king's base camp works this way: the innermost sector holds the king himself, the treasury, and the communication center, protected by his own bodyguards; the next ring holds counsellors, the purohita, the armoury and warehouses; the next holds the most reliable troops (the standing army and territorial army); the next holds militias; and 'the non-native forces (allied, alien and jungle) and the labour corps were placed in the outermost circle,' with the least trusted of all -- outcast helpers, dog-handlers and hunters -- stationed beyond the perimeter entirely, equipped only with drums and fire to raise an alarm. The design doesn't exclude low-trust groups from the camp -- it gives them a role (early warning, labor, bulk manpower) sized to what a betrayal there would cost, while reserving proximity to the irreplaceable core (the person, the money, the command channel) for whoever has been independently verified as reliable. This is different from simple hierarchy, where rank determines proximity regardless of trust -- here, the ordering principle is explicitly 'how much could this group damage the center if it turned,' which can diverge sharply from seniority or title. Diagnostic move: when designing who gets access to your most critical asset -- a system, a set of records, a physical space, a decision -- don't default to granting proximity by rank or tenure; map out trust level independently, place the highest-trust, most-verified parties closest to the core, and give lower-trust parties a real but bounded role at a distance where their potential betrayal is contained rather than catastrophic."
