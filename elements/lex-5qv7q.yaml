id: lex-5qv7q
name: facts-need-a-latticework-of-models-to-be-recallable-and-usable
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When learning anything you intend to USE rather than merely recite, attach each fact to a THEORY OR MODEL that explains why it must be so. Munger's transferable claim: facts not hung on a latticework of theory are not recallable on demand and not useful when needed. Isolated-fact memorization fails because facts have no structural index by which the mind retrieves them under novel conditions; they sit inert until directly cued, then evaporate. Facts attached to causal models (or to other facts via shared mechanism) become recallable because the model is the retrieval index — and useful because the model carries the structural reasoning the fact alone doesn't carry. The PRESCRIPTIVE form: build the multi-disciplinary latticework deliberately — the 80-100 ish fundamental models from the major disciplines (physics: backup-redundancy + breakpoint + compound interest; biology: Darwinian selection + Hamilton inclusive-fitness; psychology: the ~25 misjudgment causes; economics: opportunity cost + supply-demand; mathematics: probability + permutations + compound interest) — and hang every new fact on the latticework as you acquire it. The lattice is not a substitute for facts; it is the retrieval architecture that makes facts STAY available for use. Practitioner test: a fact you cannot connect to a model is a fact you have not really learned. Be careful with the inverse failure mode: the lattice can become a defense against new evidence. Models are tools, not commitments — when a model fails to fit a new fact, the model gets revised, not the fact dismissed (this is the lex-exrwy counterexamples-refine discipline applied to model maintenance). The atom names the structural claim that USE-WORTHY KNOWLEDGE IS MODEL-EMBEDDED KNOWLEDGE, not bare-fact knowledge. Distinct from lex-wtkuz descriptive-vs-operational-metacognition (which is about converting prescriptions into actionable form): lex-wtkuz is about prescription-form-transformation; lex-5qv7q is about FACT-RETRIEVABILITY via theory-embedding. They compose: descriptive-vs-operational-metacognition rewrites prescriptions; latticework-of-models indexes facts."
