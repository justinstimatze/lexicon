lineage:
  - source: primary
    text: douglass-1881-life-and-times-part-ii-ch12-andrew-johnsons-face
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (1881), Part II ('Life as a Freeman'), Chapter XII, 'Hope for the Nation.'"
    quote: "“There are moments in the lives of most men, when the doors of their souls are open, and unconsciously to themselves, their true characters may be read by the observant eye. It was at such an instant I caught a glimpse of the real nature of this man, which all subsequent developments proved true. I was standing in the crowd by the side of Mrs. Thomas J. Dorsey, when Mr. Lincoln touched Mr. Johnson, and pointed me out to him. The first expression which came to his face, and which I think was the true index of his heart, was one of bitter contempt and aversion. Seeing that I observed him, he tried to assume a more friendly appearance; but it was too late; it was useless to close the door when all within had been seen. His first glance was the frown of the man, the second was the bland and sickly smile of the demagogue.”"
canonical-instances:
  - "The direct textual anchor: Douglass treats his own reading of Johnson's face as retrospectively vindicated -- 'which all subsequent developments proved true' -- explicitly framing a fleeting, unguarded facial reaction as more diagnostically reliable than years of a public figure's subsequent composed public conduct."
  - "Hypothetical: a job candidate's face briefly registers irritation when asked to repeat a question, then quickly resolves into a practiced smile. An interviewer who missed the first flash rates the candidate as pleasant throughout; one who caught the full sequence carries a different impression that the smile never manages to erase."
critical-questions:
  - "How much time has to pass between the involuntary reaction and the composed one for this mechanism to apply -- does an instantaneous correction (a fraction of a second) carry the same evidentiary weight as a visibly effortful, delayed one (Johnson's, which Douglass describes as arriving too late to matter)?"
  - "Does the observer's own credibility change what this mechanism can prove? Douglass claims his reading was vindicated by history, but in the moment it was one man's interpretation of a facial expression -- what would distinguish a genuine leaked reaction from an observer's own projected suspicion, especially when the observer has independent reasons (as Douglass did) to expect hostility?"
  - "Is there a way for the person who leaked the first reaction to actually recover credibility afterward, short of the observer being wrong in the first place -- or does this mechanism claim the leak is permanently unrecoverable once witnessed?"
