    quote: "“the equiprobability assumption is a very special one, and seems to involve a denial of society, in a significant sense. Depending on peoples’ values and their personal and group interests there would be a fair amount of link-up between individual preferences. Individual preferences are determined not by turning a roulette wheel over all possible alternatives, but by certain specific social, economic, political and cultural forces. This may easily produce some patterns in the set of individual preferences. The patterns need not, incidentally, be one of agreement. Sharp disagreements may produce consistent and transitive majority decisions. For example, in a two-class society where ‘class war’ takes the form that all members of one class (e.g., capitalists) have exactly the opposite preference to each member of the other class (e.g., workers), majority decision must be transitive, irrespective of the number of people in each class.”"
canonical-instances:
  - "A load-testing team worries that simultaneous requests could deadlock a database, pointing to a model where the probability of deadlock rises sharply as concurrent users increase under fully random arrival times. Production traffic clusters around a handful of real usage patterns instead -- checkout, search, login -- and that clustering is what keeps the system out of the pathological interleavings the random model predicted, well before concurrency itself drops."
  - "An analyst warns that a legislature with many factions and no dominant coalition should be prone to constant reversals, based on a model where every legislator's preference ordering is equally likely. Real legislators' preferences track party loyalty and ideology instead -- even a legislature split into two rigidly opposed blocs, where every member of one bloc ranks everything the exact opposite of every member of the other, still produces stable, consistent majority outcomes, because the opposition itself is a pattern."
critical-questions:
  - "Isn't it suspicious that the same rebuttal (real inputs carry structure a random model lacks) can wave away any inconvenient worst-case finding -- how do you know the saving pattern is actually there, rather than assumed? Sen backs the claim with a specific, checkable structural detail: every member of one group ranks everything the exact opposite of every member of the other. That's a testable fact about the class-war case, something a vague appeal to real life being different never provides. The diagnostic only earns its keep when the actual pattern can be named and shown to do the work."
  - "If sharp disagreement can produce consistency just as well as agreement, doesn't that undercut using 'the majority vote came out consistent' as evidence people agree on much of anything? Fair sting, and Sen's result concedes it -- consistency of majority rule is compatible with a society riven by exactly two rigidly opposed camps and nothing resembling consensus. The result speaks to the structure of preferences, not their content or how much common ground people actually share."
