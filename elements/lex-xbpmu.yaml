id: lex-xbpmu
name: test-a-proposed-mechanism-at-the-value-where-rival-theories-diverge
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "López-Alt confirms early on that brined turkey really does retain more moisture than an unbrined one -- a controlled side-by-side roast settles that much. The standard explanation offered for why is osmosis: salt raises the solute concentration outside the meat's cells, so water is drawn in. That explanation predicts something specific and testable: raise the brine's salt concentration further and the osmotic pull should intensify, drawing in more water still, or past a threshold reverse and pull moisture back OUT as the outside solution gets ever more concentrated than the cell interior. Confirming that a normal 6-percent brine beats plain water doesn't test the osmosis story at all, because a rival mechanism -- salt dissolving muscle-fiber proteins so they contract less and hold more of their own moisture under heat -- predicts the identical result at that same concentration. López-Alt runs the brine up to a fully saturated 35-percent solution, a concentration high enough that if osmosis were doing the work, the effect should be dramatically stronger, or the theory's own logic should start to break down. Instead the 35-percent brine performs about the same as the 6-percent one. The two theories agreed at the normal operating point and diverged only out at the extreme, which is exactly where he ran the test. Transferable diagnostic: when a proposed mechanism explains an observed effect, and a rival mechanism explains the same effect equally well at normal operating conditions, don't rerun the experiment at those same conditions expecting the repeat confirmation to settle anything -- find the input value where the two mechanisms' predictions actually pull apart, push the test out to that value, and read off which prediction the real result tracks. The ordinary case is where explanations agree and therefore where testing them accomplishes the least; the diagnostic power is concentrated at the extreme, the edge case, or the point the everyday version of the phenomenon never reaches."
