lineage:
  - source: primary
    text: GoldinMeadow-2003-HearingGesture
    citation: "Susan Goldin-Meadow, Hearing Gesture: How Our Hands Help Us Think (Belknap Press of Harvard University Press, 2003), Ch.3 'Giving Our Thoughts Away' and Ch.4 'Who Is Ready to Learn?'"
    quote: "The term 'mismatch' adequately conveys the notion that gesture and speech convey different information. For many, however, 'mismatch' also brings with it the notion of conflict, a notion that I do not intend. The pieces of information conveyed in gesture and in speech in a mismatch need not conflict, and in fact they rarely do... I thus offer the following working hypothesis that allows us to proceed. A speaker who has produced a gesture-speech mismatch knows (at some level) the information conveyed in both modalities. However, the speaker has not yet developed a framework -- either a knowledge framework over developmental time (the conservation examples) or a discourse framework over conversational time (the stair-climbing example) -- within which those pieces can be fitted together. (Ch.3, 'Giving Our Thoughts Away.')... Since the same person can produce many or few mismatches depending on the task, gesture-speech mismatch cannot be a personality trait or communicative style. But mismatch does appear to be a characteristic of individuals in a particular state. Children who produce many gesture-speech mismatches when explaining a task are likely to benefit from instruction on that task -- reliably more likely than children who produce few. Mismatch marks a child as being open to instruction, and thus on the precipice of learning... Importantly, the matchers and the mismatchers did not differ in the number of correct explanations or correct judgments they produced on the pretest -- prior to instruction, the only way to tell the groups apart was by the number of gesture-speech mismatches each produced. Thus gesture-speech mismatch in a child's explanations of conservation is an excellent sign that the child is ready to learn conservation. (Ch.4, 'Who Is Ready to Learn?')"
canonical-instances:
  - "operationally distinct from lex-hfcae expectancy-violation-as-learning-mechanism: both concern what marks a system as primed to learn, but 0113's mechanism is prediction-error-drives-update in an exposure-therapy/inhibitory-learning frame; this atom's mechanism is a specific, observable dual-channel diagnostic signal (gesture vs. speech) unique to human explanation."
  - "composes with lex-hng49 mentor-as-scaffolded-transmission: lex-hng49 assumes a learner is in the zone of proximal development as a precondition without naming how to detect it; this atom supplies an observable diagnostic for WHEN a learner is in that zone."
  - "The original conservation-task pair (Ch.3): a girl says the water level is 'lower' in one container while her gesture indicates the container's width -- a gesture-speech mismatch. A boy explains that checkers spread into a longer row are still the same number 'cause you moved them,' while his gesture aligns the checkers in the two rows one-to-one -- also a mismatch. Neither child can yet say in words what their hands already know."
  - "Church and Goldin-Meadow's 1986 dissertation study: five- to eight-year-olds pretested and classified as gesture-speech matchers or mismatchers on conservation tasks, then given identical instruction (either explicit teaching or unstructured object manipulation). In both instruction conditions, mismatchers made significantly more progress than matchers -- despite the two groups being indistinguishable on the pretest. The mismatch, not prior competence, predicted who learned."
  - "A coach or interviewer listening to someone explain their own reasoning notices their hands tracing a structure -- a dependency, a sequence, a spatial relationship -- that their words never mention. Per this atom, that gap is the place to intervene: the person's tacit grasp is ahead of what they can currently say, and instruction aimed at that specific gap will land better than instruction aimed at what they said."
critical-questions:
  - "Isn't this just 'watch body language'? No -- general body-language reading targets affect or confidence. This is a narrower, structural claim about two REPRESENTATIONAL CONTENTS being conveyed in two channels, one of which routes around conscious articulation. The diagnostic content is what information is encoded in each channel, not how nervous or confident someone appears."
  - "Could mismatch just reflect general confusion or incompetence rather than readiness? No -- in Church and Goldin-Meadow's studies, matchers and mismatchers did not differ in pretest correctness; mismatch predicted LEARNING GAIN specifically, holding prior competence constant. A mismatcher and a matcher can be equally wrong before instruction and diverge sharply only afterward."
  - "Is this specific to young children or to Piagetian conservation tasks? No -- the same pattern was replicated in nine- to ten-year-olds on mathematical equivalence problems and, per Goldin-Meadow's later work cited in the same chapter, in adults explaining their solutions to factoring problems. The claimed mechanism (two representations not yet unified into an articulable framework) is proposed to generalize across age and task domain, not to be a childhood-specific curiosity."
