id: lex-pch8u
name: modernity-and-coloniality-are-one-system-viewed-from-two-sides
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a system's defenders describe it via its celebratory rhetoric (salvation, progress, development, democracy, modernization, technological improvement), do not treat that rhetoric as the system's nature with the darker outputs (dispensable life, coloniality of knowledge, expropriation, exclusion of 80% of humanity) as friction-against-the-nature. Treat the rhetoric and the darker underside as the SAME system viewed from two sides — constitutive of each other, not separable phenomena. Mignolo's claim, which generalizes: 'modernity' as a celebratory narrative built Western civilization by celebrating its achievements while hiding its darker side, 'coloniality.' These are not two things that happen to co-occur. There is no modernity without coloniality. The rhetoric REQUIRES the underside (the celebrated 'reinvestment of surplus' requires the unsung expropriation that produces the surplus; the celebrated scientific revolution requires the underside epistemology that disqualifies coexisting knowledge systems; the celebrated nation-state requires the underside biopolitics of managing dispensable lives). The operational transferable move: when offered the rhetoric, ask 'what is the constitutive underside this rhetoric requires to function?' — not 'what are the unfortunate side effects.' Test: if you tried to keep the celebrated half and discard the underside, would the celebrated half still function? If no, the two are constitutive of each other. The same move applies to any system whose defenders claim 'we're working on the bugs but the basic structure is sound' when the basic structure REQUIRES the bugs. The delinking corollary: change cannot come from inside the system's terms — it requires changing the terms of the conversation, refusing the offered framing of 'better-execution-of-the-good-side,' and treating the system's both-sides as one thing to delink from. Distinct from lex-b2r4u (Robinson racial-capitalism is the labor-economic-axis specialization of this general move) and lex-3ezh8 (Hill Collins matrix-of-domination is the multiple-interlocking-axes-of-oppression specialization)."
