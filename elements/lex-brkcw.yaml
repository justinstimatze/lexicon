lineage:
  - source: primary
    tradition: wumen-koan-tradition
    text: wumen-1228-wu-men-kuan
    citation: "Wumen Huikai, No-Gate Gateway: The Original Wu-Men Kuan, trans. David Hinton (Shambhala, 2018), Foreword."
    quote: "Buddhism calls mind its ancestral nature, its household, and no-gate its dharma-gate. If it's an absent gate, no gate at all, how could anyone pass through it? […] In the search for understanding, what's worse than using a tangle of words? You're just swinging a stick as if you could hit the moon, scratching a boot as if you could itch a foot! How could that ever work? […] If you're like the long edge of the Star River, wielding your lone blade fearlessly, no care for danger and death, you'll enter through the gate with a single slash. […] But if you hesitate, it's like looking through a window across the room and glimpsing a horse gallop past outside: scarcely seen and already gone vanishing away."
  - source: primary
    tradition: wumen-koan-tradition
    text: wumen-1228-wu-men-kuan
    citation: "Wumen Huikai, No-Gate Gateway: The Original Wu-Men Kuan, trans. David Hinton (Shambhala, 2018), Case 1 (Visitation-Land Dog Nature) — Wu-men's comment."
    quote: "To penetrate the depths of Ch'an, you must pass through the gateway of our ancestral patriarchs. And to fathom the mysteries of enlightenment, you must cut off the mind-road completely. […] To penetrate the depths of this single word, Absence, summon all three-hundred-sixty bones and joints, all eighty-four thousand sacred apertures of your intelligence, summon your whole being into a single mass of doubt. Devote yourself day and night. Absence: don't think it's emptiness, and don't think it's Presence. You'll feel like you've swallowed a red-hot iron ball: retching and retching at something that won't vomit out. But let all the delusions of a lifetime go, all the understanding and insight; and slowly, little by little, nurture the simplicity of occurrence appearing of itself."
  - source: primary
    tradition: wumen-koan-tradition
    text: wumen-1228-wu-men-kuan
    citation: "Wumen Huikai, No-Gate Gateway: The Original Wu-Men Kuan, trans. David Hinton (Shambhala, 2018), Hinton's Introduction (on the koan as anti-explanatory device)."
    quote: "These records are also typified by poetic distillation: enigmatic sayings and wild antics intended to upend reason and tease the mind past the limitations of logical thought. […] As such, they operate with poetic wildness and immediacy, rather than the usual explanatory or utilitarian use of language. Ch'an teachers began drawing especially revealing moments from these records, moments that distill the essential insights of Ch'an, and assigning them as puzzles for students to ponder."
canonical-instances:
  - "Case 1 (Joshu's Mu / Visitation-Land's Dog) — the most famous koan, designed so that neither yes nor no resolves; 'Mu' 無 is both an answer and a refusal of the answering-frame."
  - "Hakuin's 'sound of one hand' koan (16-17C Japanese Rinzai elaboration) — the same structural technique; an impasse whose every conceptual response misses by reproducing the framing it's trying to dissolve."
  - "The Socratic elenchus terminating in aporia (lex-fpvsu) — a propositional/dialogic cousin; the deliberate construction of an impasse the interlocutor cannot escape from within their frame."
  - "Wittgensteinian 'ladder' passages in the Tractatus — the propositions are to be climbed and then discarded; meaning shows itself when the conceptual apparatus is released, not by applying it more carefully."
  - "Debugging a system where every diagnostic hypothesis stems from the same broken mental model — adding more diagnostic hypotheses extends the trap. The structural move is to sustain confusion rather than spawn more hypotheses, until the model's hidden assumption surfaces."
  - "A relationship pattern that recurs across multiple partners — each 'fix' applies the same underlying frame; the substrate move is to accept the irresolution and dwell with the felt impossibility until the frame's role becomes visible."
  - "A design space where every proposed solution reproduces the original constraint (e.g., trying to design an org-chart that fixes the coordination cost while preserving the same authority gradient that caused the cost) — exit requires the frame to release, not more iteration within it."
  - "The substrate's own encounter-tier system contains a koan-shaped artifact; this very atom's agent-instruction tries to describe a technique whose tradition warns that describing dilutes — that recursion is constitutive, not a flaw."
