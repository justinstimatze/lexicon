lineage:
  - source: primary
    text: gawande-2009-checklist-manifesto
    citation: "Atul Gawande, The Checklist Manifesto: How to Get Things Right (New York: Metropolitan Books / Henry Holt and Company, 2009). Gawande, a surgeon and public-health researcher, argues that modern professional failure has shifted from IGNORANCE (the relevant knowledge does not yet exist) toward INEPTITUDE (the knowledge exists but is not applied consistently, because the volume and complexity of what an expert must track under time pressure exceeds unaided memory and attention), and develops a specific engineering discipline for the checklist as the artifact that counters ineptitude: define a pause point at which the checklist is actually consulted; choose between a DO-CONFIRM form (perform from memory/expertise, then pause to confirm) and a READ-DO form (read each step and perform it in sequence); keep the list to roughly five-to-nine items focused on 'killer items' rather than comprehensive coverage; and field-test and revise repeatedly before treating a checklist as finished. The book traces this discipline from the 1935 Boeing Model 299 (B-17) test-pilot checklist through Peter Pronovost's Johns Hopkins ICU central-line checklist, the statewide Michigan Keystone Initiative, skyscraper-construction task-and-communication checklists, and the WHO Safe Surgery Checklist, whose eight-hospital pilot trial Gawande led as principal investigator."
    quote: "[on the ignorance/ineptitude distinction that organizes the whole book:] 'The first is ignorance—we may err because science has given us only a partial understanding of the world and how it works... The second type of failure the philosophers call ineptitude—because in these instances the knowledge exists, yet we fail to apply it correctly.' ... 'For nearly all of history, people's lives have been governed primarily by ignorance... But sometime over the last several decades—and it is only over the last several decades—science has filled in enough knowledge to make ineptitude as much our struggle as ignorance.' [on the origin case, the B-17 test-pilot checklist, 1935:] 'flying this new plane was too complicated to be left to the memory of any one person, however expert... with the checklist in hand, the pilots went on to fly the Model 299 a total of 1.8 million miles without one accident.' [on DO-CONFIRM vs READ-DO, from Boeing's Daniel Boorman:] 'You must decide whether you want a DO-CONFIRM checklist or a READ-DO checklist. With a DO-CONFIRM checklist... team members perform their jobs from memory and experience, often separately. But then they stop. They pause to run the checklist and confirm that everything that was supposed to be done was done. With a READ-DO checklist, on the other hand, people carry out the tasks as they check them off—it's more like a recipe.' [on keeping the list short and targeting killer items:] 'The checklist cannot be lengthy. A rule of thumb some use is to keep it to between five and nine items, which is the limit of working memory... after about sixty to ninety seconds at a given pause point, the checklist often becomes a distraction from other things. People start \"shortcutting.\" Steps get missed. So you want to keep the list short by focusing on... \"the killer items\"—the steps that are most dangerous to skip and sometimes overlooked nonetheless.' [on good vs bad checklist design:] 'Bad checklists are vague and imprecise. They are too long; they are hard to use; they are impractical... They treat the people using the tools as dumb and try to spell out every single step. They turn people's brains off rather than turn them on. Good checklists, on the other hand, are precise. They are efficient, to the point, and easy to use even in the most difficult situations. They do not try to spell out everything—a checklist cannot fly a plane. Instead, they provide reminders of only the most critical and important steps.' [on the two complementary checklist forms, from the skyscraper-construction case:] 'checklists have to take two almost opposing forms. They supply a set of checks to ensure the stupid but critical stuff is not overlooked, and they supply another set of checks to ensure people talk and coordinate and accept responsibility while nonetheless being left the power to manage the nuances and unpredictabilities the best they know how.' [on mandatory field-testing:] 'no matter how careful we might be, no matter how much thought we might put in, a checklist has to be tested in the real world, which is inevitably more complicated than expected. First drafts always fall apart, he said, and one needs to study how, make changes, and keep testing until the checklist works consistently.' [on the measured result of the WHO Safe Surgery Checklist eight-hospital trial:] 'The final results showed that the rate of major complications for surgical patients in all eight hospitals fell by 36 percent after introduction of the checklist. Deaths fell 47 percent... Using the checklist had spared more than 150 people from harm—and 27 of them from death.'"
canonical-instances:
  - "the 1935 Boeing Model 299 (B-17) test-pilot checklist: after a fully-qualified chief test pilot crashed the prototype from a single forgotten step, the solution chosen was not more training but a one-page DO-CONFIRM checklist for takeoff, flight, landing, and taxiing; the plane went on to fly 1.8 million accident-free miles and the army ordered nearly thirteen thousand of the resulting B-17s"
  - "Peter Pronovost's 2001 Johns Hopkins ICU central-line checklist: a five-step DO-CONFIRM checklist for known, already-taught infection-prevention steps (hand-washing, chlorhexidine, full drape, mask/gown/gloves, sterile dressing) cut the ten-day central-line infection rate from 11 percent to zero over the following year; Pronovost observed the checklists 'helped with memory recall and clearly set out the minimum necessary steps in a process'"
  - "the 2003-2006 Michigan Keystone Initiative: Pronovost's checklist rolled out statewide across ICUs, paired with executive-level troubleshooting support (stocking chlorhexidine, full-size drapes) rather than a mere mailing; published in the New England Journal of Medicine (2006), the first three months cut central-line infection rates 66 percent, saving an estimated $175 million and more than fifteen hundred lives over eighteen months"
  - "the WHO Safe Surgery Checklist (2007-2009): a nineteen-item, three-pause-point (before anesthesia / before incision / before the patient leaves the OR) checklist refined through London and Hong Kong field tests before an eight-hospital global pilot; the trial (~4,000 patients) found major complications fell 36 percent and deaths fell 47 percent, with the effect holding in high-income as well as low-income sites"
  - "Boeing's Daniel Boorman and the DOOR FWD CARGO / polar-flight-icing checklists: Boorman's flight-operations group treats checklist authorship as a craft with its own quality bar — 'good checklists... are precise... efficient, to the point'; after a 2008 British Airways 777 dual-engine-icing incident near Heathrow, his team spent about two weeks distilling the crash investigation into a revised, re-tested, re-simulated checklist before releasing it to every 777 operator worldwide"
  - "skyscraper construction's dual checklist system: a 'construction schedule' (a simple task-checklist forcing function for sequencing steel, concrete, and trade work) hangs alongside a 'submittal schedule' (a communication checklist specifying who must talk to whom, by when, about the inevitable unanticipated problems) — the two-form pattern Gawande generalizes into task-checks for the simple and communication-checks for the complex-and-unexpected"
  - "operationally distinct from lex-hsnup self-critique-against-explicit-rule-set-then-revise: lex-hsnup names a THREE-STEP loop (generate → critique a completed draft against explicit rules → revise the draft) that can iterate multiple times over a persisting artifact; this atom names a SINGLE real-time verification pass, run once per defined pause point, over an action sequence in progress, where a failed check is corrected by performing the missed step immediately rather than by redrafting anything. lex-hsnup cites surgical checklists only as a one-pass 'related cousin' in a single bullet and does not develop DO-CONFIRM/READ-DO, killer-item selection, the five-to-nine-item limit, or field-testing discipline; this atom is the primary grounding those design choices lack elsewhere in the substrate"
  - "operationally distinct from lex-jbegr phronesis-practical-wisdom-in-particulars: lex-jbegr asks the prior philosophical question of WHEN rule-following (a checklist or lookup-table) suffices versus when irreducible judgment-in-particulars is required, and already cites Gawande's book for exactly that boundary claim. This atom does not re-litigate that boundary — it assumes a domain has already been judged checklist-tractable and names the engineering discipline (pause point, DO-CONFIRM/READ-DO choice, killer-item selection, field-testing) that determines whether a checklist built for that domain actually works or becomes ignored paperwork"
critical-questions:
  - "is the observed failure actually INEPTITUDE (a known, teachable step gets skipped under load) or IGNORANCE (the correct step itself isn't actually known)? A checklist only addresses the former — no checklist substitutes for missing knowledge, and forcing one onto a genuinely ignorance-limited problem just adds paperwork without addressing the gap"
  - "is there a defined PAUSE POINT at which the checklist will actually be read, or is it something people are expected to consult 'when they remember'? Without an explicit, named moment execution must stop, checklists dissolve into ignored paperwork regardless of content quality"
  - "DO-CONFIRM or READ-DO — which fits this task? Does the team need room to perform from memory/expertise and then confirm, or is this a sequence where doing steps out of order is itself the danger (favoring a literal read-then-do recipe)?"
  - "is the list actually short and restricted to killer items, or has it crept toward comprehensive coverage? A checklist that takes much more than about sixty to ninety seconds to run at its pause point will get shortcut in practice no matter how well-intentioned its authors were"
  - "has this checklist actually been field-tested and revised against real-world use, or is a first draft being deployed as if it were final? Gawande's own first surgical-checklist attempt failed in his own operating room; the discipline is to expect failure on the first pass and budget for iteration before judging the tool"
status: active
