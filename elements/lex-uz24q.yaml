id: lex-uz24q
name: three-kinds-of-philia-utility-pleasure-virtue
type-in: situation
type-out: typology
_tier: atomic
agent-instruction: "When evaluating a friendship/alliance, surface the three Aristotelian forms — utility, pleasure, virtue — and name which one this is; mismatched expectations across forms are a common failure mode."
related: [lex-3hefg, lex-n8smn, lex-h2ehw, lex-9wbd3, lex-efv3v, lex-vx867, lex-qb3zf, lex-n5jed, lex-9an5g, lex-ybjru, lex-tqdhs, lex-u3e5m]
evokes: [friend-for-use-friend-for-fun-friend-for-truth, why-this-friendship-dissolves-or-endures, accidental-vs-essential-affection, the-business-friend-vs-the-virtue-friend, three-motives-three-friendships]
lineage:
  - source: primary
    text: aristotle-nicomachean-ethics-c350-bce
    citation: "Aristotle, Nicomachean Ethics Books VIII-IX (c. 350 BCE). Books VIII-IX (over 20% of the NE) treat philia (φιλία, Peters trans.: 'friendship' but broader — encompassing all close personal attachment including familial). Aristotle's structural claim (VIII.3): the three motives of philia (utility, pleasure, virtue) generate three distinct kinds of friendship with distinct dynamics. Utility-friendships dissolve when interest ends; pleasure-friendships dissolve when pleasure ends; virtue-friendships (the rare third) survive because their motive is the friend's character itself, which is stable. The typology is empirically robust: modern relationship-research (Hall 2011-2019 friendship dissolution; Granovetter 1973 weak/strong ties) maps onto Aristotle's distinctions with high fidelity."
    quote: "[Aristotle, Nicomachean Ethics Book VIII ch. 3, Peters trans.:] 'In order to be friends, then, they must be well-wishers one of another, i.e. must wish each other's good from one of the three motives above mentioned, and be aware of each other's feelings. But these three motives are specifically different from one another; the several affections and friendships based upon them, therefore, will also be specifically different. The kinds of friendship accordingly are three, being equal in number to the motives of love; for any one of these may be the basis of a mutual affection of which each is aware. Now, those who love one another wish each other's good in respect of that which is the motive of their love. Those, therefore, whose love for one another is based on the useful, do not love each other for what they are, but only in so far as each gets some good from the other. It is the same also with those whose affection is based on pleasure; people care for a wit, for instance, not for what he is, but as the source of pleasure to themselves. Those, then, whose love is based on the useful care for each other on the ground of their own good, and those whose love is based on pleasure care for each other on the ground of what is pleasant to themselves, each loving the other, not as being what he is, but as useful or pleasant. These friendships, then, are accidental; for the object of affection is loved, not as being the person or character that he is, but as the source of some good or some pleasure. Friendships of this kind, therefore, are easily dissolved, as the persons do not continue unchanged; for if they cease to be pleasant or useful to one another, their love ceases.' [Book VIII ch. 13, dissolution dynamics:] 'But accusations and reproaches arise solely or mostly in friendships whose motive is profit, as we should expect... For those whose friendship is based on virtue are eager to do good to each other (for this is the office of virtue and friendship); and between people who are thus vieing with one another no accusations or quarrels can arise.'"
  - source: practitioner
    text: granovetter-weak-ties-and-modern-network-sociology
    citation: "Mark Granovetter, 'The Strength of Weak Ties' (1973 American Journal of Sociology) + modern friendship-network research (Hall 2011-2019; Dunbar 1992 number; McPherson-Smith-Lovin-Cook 2001 homophily). Tier-3 deepening: modern sociology maps onto Aristotle's typology with high fidelity. Weak ties (Granovetter) = utility-friendships (instrumentally valuable for information transfer, job leads); strong ties = a mix of pleasure + virtue friendships. Friendship-dissolution research (Hall 2011 found 33-50% of close-friendships dissolve over 7 years) consistently identifies the dissolution causes Aristotle predicts: utility-end, pleasure-end, divergence-of-character. extensively cross-cited."
    quote: "[Tier-3 deepening — Granovetter 1973: 'Whatever is to be diffused can reach a larger number of people, and traverse greater social distance, when passed through weak ties rather than strong.' Utility-friendships (weak ties, in Aristotelian terms) are precisely what enable job-network mobility, information diffusion, and bridging across social clusters — Aristotle's 'accidental' friendships are sociologically essential to functioning networks. Modern friendship research (Hall, Dunbar) operationalizes Aristotle's distinction empirically: people sustain only ~5 close-tie virtue-friendships and ~15 strong-tie pleasure-friendships but maintain ~150 weak-tie utility-acquaintances (Dunbar's number).]"
  - source: practitioner
    text: cs-lewis-four-loves-affection-friendship-eros-charity
    citation: "C. S. Lewis, *The Four Loves* (1960). Tier-3 deepening: Lewis's typology of love-types (storge/affection, philia/friendship, eros/romantic, agape/charity) extends Aristotle's three-kinds-of-philia by distinguishing friendship-as-philia from the other forms of attachment. Lewis preserves the Aristotelian insight that the BASIS of affection determines the dynamics of the relationship. Cross-attestation of the structural claim that relationships have specific kinds with specific dynamics, not a single undifferentiated 'love'. cross-attested in Christian-virtue-ethics tradition and contemporary relationship-counseling literature."
    quote: "[Tier-3 deepening — Lewis 1960 distinguishes 'gift-love' (giving for the beloved's good, Aristotle's virtue-friendship) from 'need-love' (loving because of what one receives, Aristotle's utility/pleasure friendships). Lewis: 'The Greeks distinguished four kinds of love. Storge: affection, especially of parents and children. Philia: the love between friends. Eros: the state of being in love. Agape: charity, gift-love.' The structural claim across Lewis and Aristotle: relationship-types are NOT a continuum but a typology with discrete dynamics. Misidentifying which kind of relationship one is in is a common source of disappointment.]"
canonical-instances:
  - "networking-friends (utility): the LinkedIn connections + industry-conference acquaintances + 'professional friends'. Aristotle's utility-philia. Dynamics: contact is initiated by professional need; the relationship dissolves when one party changes industries or roles. Not a defect — these relationships SHOULD be instrumentally-motivated and ephemeral. Granovetter's weak-tie research validates: utility-friendships are sociologically essential and shouldn't be confused with deeper bonds"
  - "party-friends / pleasure-friends: the friends one parties with, plays sports with, watches sports with. Aristotle's pleasure-philia. Dynamics: contact is initiated by shared activity; the relationship lasts as long as both enjoy the activity together. Dissolves when one party moves, has a child, gets older, or develops different tastes. Healthy in their kind — pleasure-friendships are not lesser than virtue-friendships; they serve a different function"
  - "virtue-friends / lifelong-friends: the rare third — the college roommate who is still close 30 years later, the colleague who became a deep friend across life transitions. Aristotle's virtue-philia. Dynamics: each party cares about the OTHER's character and flourishing, not just what the other provides. These survive interest-changes, geographic-distance, life-stage shifts. Aristotle (VIII.3): 'these are the only true friendships, but they are rare and require time.' Empirical: Hall research finds adults sustain ~5 virtue-tier friendships"
  - "the dissolution-pattern as diagnostic: when a friendship ends, the AUTOPSY reveals which kind it was. Utility-friend ended when the job-tie ended → it was utility. Pleasure-friend ended when she had a baby and stopped going out → it was pleasure. The virtue-friend who survived both job-change and baby-arrival → that was virtue. Aristotle's typology becomes diagnostic in retrospect"
  - "the failure mode 'category confusion': expecting a utility-friendship to behave like virtue-friendship. The colleague who supported you when projects co-aligned but stopped calling after you switched teams — you were disappointed because you thought it was virtue-friendship; the relationship was actually utility. Aristotle (VIII.13): most conflicts in friendship arise from category-confusion, especially in utility-tier"
  - "the failure mode 'pleasure-mistaken-for-virtue': the intense college friendship that fizzles after graduation. Both parties loved the SHARED CONTEXT (dorm-life, parties, mutual classes) more than each other's characters. Without the context, the basis disappears. This is not a failure of either friend; it's an accurate diagnostic — the friendship was pleasure-philia all along, and pleasure-philia is context-dependent by structure"
  - "compositional with lex-3hefg trust-formation: utility-friendships build trust within their narrow domain (you trust your CPA with your taxes but not with your relationship advice); pleasure-friendships build trust within shared-activity context; virtue-friendships build trust across all domains because the friend's CHARACTER is the basis. lex-3hefg's trust-formation operates differently in each tier"
  - "compositional with lex-n8smn social-proof-bootstraps-trust: in early-stage virtue-friendship formation, social-proof from existing virtue-friends ('my friend Alice is great, you should meet her') accelerates trust-formation. The cross-tier transfer is real but partial — Alice's virtue-friend Bob may still need to demonstrate his virtue to you over time before crossing from acquaintance to virtue-friend"
  - "operationally distinct from lex-h2ehw trust-as-substrate-for-obedience: lex-h2ehw is institutional/authority-based trust (trusting a doctor's medical advice); lex-uz24q is personal-attachment based. They can co-fire in some relationships (a doctor who is also a personal friend) but the operational frames are different — lex-h2ehw is role-based, lex-uz24q is character-based"
critical-questions:
  - "are the three kinds pure or hybrid in practice? In practice most close friendships have elements of all three (the college roommate who became a virtue-friend probably ALSO has utility/pleasure elements). Aristotle (VIII.4) acknowledges this — the kinds are ideal-typical, and real relationships are mixed. The typology is diagnostic for the PRIMARY motive, which determines the relationship's long-term trajectory"
  - "can a utility-friendship deepen into virtue-friendship over time? Yes — Aristotle (VIII.6) acknowledges this transition. The colleague who began as a utility-friend (collaborator on a project) may, over years, become a virtue-friend (you'd help them at significant cost to yourself, not for any reciprocal expectation). The transition requires sustained character-revelation and mutual investment over time"
  - "what is the failure mode of misidentifying which kind you're in? Disappointment + disproportionate hurt when the relationship behaves according to its actual kind. The pleasure-friend who stopped calling after baby was not betraying you; you misidentified the relationship. The discipline: assess relationships periodically to track their actual kind, not the kind you wish they were"
  - "is virtue-friendship culturally specific? Aristotle's account is shaped by Athenian-aristocratic culture (philia includes male political-cultural bonds that modern friendship doesn't track). But the structural claim (relationships have kinds with different dynamics) appears cross-culturally — Confucian friendship typology (peer-equality, mentor-student), Buddhist kalyana-mitta (spiritual friendship) all preserve a virtue-philia category distinct from instrumental relationships. The cultural variation is the SPECIFIC content of virtue; the structural typology is universal"
status: active
