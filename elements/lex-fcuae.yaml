id: lex-fcuae
name: a-categorical-barrier-is-routed-around-via-a-separate-domain
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone has earned full elevation but a rigid categorical barrier makes that formally impossible, splitting authority along a different axis — a different time, place, or domain that doesn't overlap with the blocked one — lets you grant real recognition without having to cross the barrier directly. In the Jataka's tale of the pariah in the tree, the king is impressed enough by the man's insight to want to make him sole king, but caste makes that impossible, so he divides sovereignty by time of day instead: 'Friend,' he replied, 'had you been of a high caste family, I would have made you sole king. But henceforth I will be king by day, and you shall be king by night.'"
related: []
evokes: [jataka, catukkanipata, chavaka-jataka, splitting-authority-along-a-non-overlapping-axis, a-categorical-barrier-routed-around-not-broken]
lineage:
  - source: primary
    text: jataka-chalmers1895-chavaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 309, Chavaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Friend,\" he replied, \"had you been of a high caste family, I would have made you sole king. But henceforth I will be king by day, and you shall be king by night.\""
canonical-instances:
  - "A company can't formally promote a brilliant contractor to full partner because of a rigid equity-structure rule reserved for founding members, so it instead grants them sole decision authority over an entire product line — real power, carved along a different axis than the one the barrier blocks."
critical-questions:
  - "Does this genuinely honor the person's merit, or does it just launder an unjust barrier by offering a consolation that makes the underlying exclusion easier to live with rather than challenging it?"
  - "Is the granted domain actually equivalent in value to what was denied, or does 'king by night' quietly carry less real power than 'king by day' while superficially appearing to split things evenly?"
status: active
