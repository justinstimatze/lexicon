id: lex-vnk9j
name: a-narrow-targeted-exclusion-beats-a-blanket-ban
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a feature is identified as the source of a paradox or a failure mode, and the proposed fix is to ban that entire feature outright, check whether a narrower exclusion -- targeting only the specific sub-case that actually generates the problem -- solves it without discarding the feature's legitimate uses. Socrates proposes the blanket version to Theaetetus: 'you would legislate for your formalized language, I suppose, that all self-reference must be strictly excluded, would you not?' Theaetetus rejects it as needlessly costly: 'They are drastic because they would exclude some very interesting... uses of self-reference, especially Gödel's method of constructing self-referring statements, a method which has most important applications in my own field of interest, the theory of numbers.' He then names the narrower fix Tarski actually found: 'we have learned from Tarski that in any consistent language -- let us call it L -- the predicates true in L and false in L cannot occur (as opposed to meaningful in L, and meaningless in L which may occur), and that without predicates such as these, paradoxes of the type of the Epimenides... cannot be formulated.' The paradox needed a language able to assert its own truth or falsity; it never needed a language able to refer to itself at all. Excluding only the truth-predicate closes off the paradox while leaving self-reference, meaningfulness-talk, and Gödel's own arithmetization method fully intact. Diagnostic move: before banning an entire feature to remove a paradox, isolate the specific sub-case doing the generative work, then check whether excluding only that sub-case removes the paradox just as completely -- a fix scoped to the actual mechanism preserves everything the blanket version would have thrown away for nothing."
related: []
evokes: [popper-self-reference-and-meaning-in-ordinary-language, tarski-true-in-l-and-false-in-l, godel-method-of-arithmetization, drastic-versus-narrow-exclusion, all-self-reference-must-be-strictly-excluded]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Self-Reference and Meaning in Ordinary Language' (first published in Mind, N.S. 63, 1954), Ch. 14 of Conjectures and Refutations (Routledge Classics, 2002), pp.417-418. The quote is split with an ellipsis where the book's own running head sits glued into the sentence at the page break, between 'very interesting' and 'uses of self-reference'."
    quote: "“S. And you would legislate for your formalized language, I suppose, that all self-reference must be strictly excluded, would you not? Th. No. We can avoid paradoxes without using such drastic measures. S. Do you call them drastic? Th. They are drastic because they would exclude some very interesting... uses of self-reference, especially Gödel's method of constructing self-referring statements, a method which has most important applications in my own field of interest, the theory of numbers. They are drastic, moreover, because we have learned from Tarski that in any consistent language -- let us call it ‘L’ -- the predicates ‘true in L’ and ‘false in L’ cannot occur (as opposed to ‘meaningful in L’, and ‘meaningless in L’ which may occur), and that without predicates such as these, paradoxes of the type of the Epimenides, or of Grelling's paradox of the heterological adjectives, cannot be formulated.”"
canonical-instances:
  - "A team discovers that a specific combination of two feature flags crashes the app, and initially proposes stripping one flag out of the codebase entirely. A narrower fix -- a startup compatibility check that blocks only that one combination -- eliminates the crash while leaving every unrelated use of either flag untouched."
  - "A research journal, burned by a wave of self-citing papers that inflate their own reported impact, considers banning all self-citation outright. A narrower policy -- excluding only citations to the same paper currently under review, rather than any prior work by the same author -- removes the inflation mechanism while preserving legitimate citation of an author's own earlier, separately published findings."
critical-questions:
  - "How do you know the narrower exclusion is actually sufficient, rather than just narrower and hopeful? Theaetetus's claim rests on Tarski's specific theorem: the Epimenides and Grelling-type paradoxes require a language capable of asserting its own truth or falsity, not merely capable of referring to itself at all. That's a proven necessary condition, not a guess -- which is why excluding just that predicate suffices, and why this atom's claim is stronger than 'try a smaller ban and hope.'"
  - "Isn't a blanket ban just safer, since a narrow exclusion might miss some other route to the same paradox? Safety has to be weighed against the cost of what a blanket ban destroys -- here, Gödel's entire method. The diagnostic isn't 'always prefer narrow'; it's 'identify the actual generative mechanism before pricing the ban.' Where that identification is solid, as Tarski's theorem makes it here, the narrow fix carries no extra risk -- it's simply the correctly scoped one."
status: active
