id: lex-dkekq
name: percentage-differences-can-invert-the-underlying-absolute-numbers
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a claim rests on comparing RATES or PERCENTAGES across groups of unequal size, check whether the argument actually needs absolute numbers instead — the two can point opposite directions. Merton catches this in a critique of his own theory's early empirical test: a researcher (Hyman) showed that a larger PROPORTION of upper-class people endorse the success-goal than lower-class people, and treated this as evidence against the theory's premise that lower-class people are exposed to goal/means strain. Merton's correction: 'it is not the relative proportions of the several social classes adopting the cultural goal of success that matter, but their absolute numbers. To say that a larger percentage of the upper social and economic strata hold fast to the cultural goal of success is not to say that larger numbers of them than of lower-class people do so.' Because the lower class is a much larger group, even a smaller endorsement rate can produce a larger absolute count of goal-holders — and it's the absolute count of people experiencing the goal/means gap, not the rate, that determines how much aggregate strain and deviant behavior the theory predicts. Use this whenever someone compares two groups' rates as if the comparison settles a question about aggregate real-world impact: ask whether the underlying group sizes are similar enough for the rate comparison to track the count comparison, and if not, ask for the counts."
related: [lex-hzrue]
