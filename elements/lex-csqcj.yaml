id: lex-csqcj
name: flattery-aimed-at-vanity-loosens-a-grip-force-cannot-break
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When physical force can't break a captor's hold, praise aimed at their vanity can accomplish what strength couldn't, by making the captor voluntarily relax their own grip to enjoy being flattered. The captor isn't tricked into believing something false. They're distracted by something they want to hear more than they want to keep holding on. In the Jataka's tale of the flattered crab, a giant crab has an elephant's leg locked in its claw. Force can't break the grip, so the elephant's mate tries praise instead, calling the crab the finest of its kind. The result speaks for itself: 'As she spoke thus, the Crab's fancy was smitten with the sound of the female voice, and forgetting all fear he loosed his claws from the Elephant's leg, and suspected nothing of what he would do when he was set free.' The elephant walks free the moment the crab stops paying attention to holding on."
