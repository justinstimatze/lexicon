id: lex-z4mtg
name: passing-one-ordeal-doesnt-clear-a-suspected-deception-so-testers-escalate
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When someone suspects a claimed incapacity is fabricated but a physical exam can''t prove it, they don''t rely on one test — they build a sequence, each trial targeting a channel of fear or desire the claim hasn''t yet been checked against, because passing a pain test proves nothing about a fear test, and passing both proves nothing about a desire test. In the Jataka''s tale of Temiya, the prince''s nurses reason from anatomical mismatch straight to suspicion of concealment, then escalate through fire, a charging elephant, defanged serpents, an armed threat, seductive courtesans, and forced squalor across sixteen years, because ruling out one channel at a time never rules out the whole claim: "Then his nurses reflected, ''The hands and feet of cripples are not like his, the formation of the jaws of the dumb is not like his, the structure of the ears of the deaf is not like his; there must be some reason for all this, let us examine into it.''"'
