id: lex-t7fxg
name: a-costly-trial-reveals-genuine-care-by-who-yields
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When two parties both claim the same person or thing and neither claim can be checked against outside facts, stage a contest that inflicts real cost on the disputed party if both sides hold firm, and let whichever side yields first settle the question — genuine care flinches at the cost, false claim does not. In the Maha-Ummagga-Jataka, Mahosadha has a goblin and a grieving mother pull a child by the hands and feet: "Lay hold of it and pull; the child is hers who can pull it over." Both pull and the child cries out in pain; the mother, unable to bear it, lets go and stands weeping. Mahosadha then asks the crowd, "Is it the heart of the mother which is tender towards the child or the heart of her who is not the mother?" They answered, "The mother''s heart." "Is she the mother who kept hold of the child or she who let it go?" They replied, "She who let it go."'
related: []
evokes: [jataka, mahanipata, maha-ummagga-jataka, judgment-by-ordeal, genuine-care-yields, custody-dispute]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-maha-ummagga-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 546, Maha-Ummagga-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: '"Lay hold of it and pull; the child is hers who can pull it over." They both pulled, and the child, being pained while it was pulled, uttered a loud cry. Then the mother, with a heart which seemed ready to burst, let the child go and stood weeping. The sage asked the multitude, "Is it the heart of the mother which is tender towards the child or the heart of her who is not the mother?" They answered, "The mother''s heart." "Is she the mother who kept hold of the child or she who let it go?" They replied, "She who let it go."'
canonical-instances:
  - "A mediator, unable to determine which of two claimed birth mothers is telling the truth, proposes splitting a disputed inheritance evenly between two rival heirs unless one objects; the one who objects to losing half reveals the stronger claim by refusing to let any of it go."
  - "Two companies both claim to have originated a product idea in a patent dispute; a judge orders both to publicly abandon all future profit from it unless they can prove authorship within a week, and the party that quietly walks away reveals which side's claim was opportunistic."
critical-questions:
  - "This method only works if the thing being contested can genuinely be harmed or lost through the trial itself — what happens when the dispute is over something that can't be split, damaged, or made costly to hold onto?"
  - "A sophisticated bad-faith actor who understands the test could deliberately yield to look sympathetic — does the method still work once the trial's logic becomes publicly known and gameable?"
status: active
