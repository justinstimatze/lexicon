id: lex-mrq9p
name: indirect-attack-tactics-require-matching-preconditions-first
type-in: situation
type-out: process
_tier: molecule
agent-instruction: "When facing an opponent you're already actively engaged with and direct force looks costly or unreliable, don't reach for the first indirect tactic that comes to mind -- diagnose which specific structural condition actually holds in the situation first, then pick the one tactic that condition licenses. Six conditional levers, each gated on its own precondition: provoke a hidden guilty actor into an involuntary self-revealing reaction, when such an actor genuinely exists; revive an asset a rival has already discarded as worthless, when real latent value actually survives that write-off; separate an opponent from a power source, but first diagnose whether that source is positional or personal, since the removal move differs by which; let a losing opponent believe an offered escape route is real, a suppression effect that requires the belief to actually hold; disguise bait as a gift, provided it won't register as bait; and remove a leader -- effective specifically when that group's loyalty is transactional rather than emotional. Diagnostic move: before committing to any one of these, name the specific precondition each requires and check which one, if any, actually describes your situation -- applying a conditional tactic to a situation that doesn't meet its condition is the mistake this molecule exists to prevent, not a matter of picking the cleverest-sounding option."
decomposes-into: [lex-xs9xg, lex-m2q6s, lex-725ue, lex-z4423, lex-3vp2t, lex-nnq97]
premises:
  - "An opponent already engaged in active conflict often cannot be defeated efficiently through direct force alone."
  - "Several distinct indirect-leverage tactics exist for compromising or defeating such an opponent instead: provoking a hidden guilty actor into self-revelation, reviving an asset others have discarded as worthless, separating an opponent from a power source after diagnosing whether that source is positional or personal, letting a losing opponent believe an offered escape route is real, disguising bait so it doesn't register as bait, and removing a leader whose followers' loyalty is transactional rather than emotional."
  - "Each tactic only works when a specific structural feature of the situation actually holds. Every named atom states that condition explicitly, so none of the six is presented as a default move that applies regardless of circumstance."
  - "Applying a tactic when its precondition does not hold can fail outright or backfire -- attempting to remove a leader held by emotional rather than transactional loyalty can harden a group's resistance instead of breaking it."
  - "Therefore, selecting an indirect-attack tactic requires first diagnosing which structural precondition actually holds in the specific conflict; tactic selection follows diagnosis, and applying a tactic before diagnosing its precondition is the failure mode this molecule names."
assembly: "choice(lex-xs9xg, lex-m2q6s, lex-725ue, lex-z4423, lex-3vp2t, lex-nnq97; selector=diagnosed-structural-precondition)"
related: [lex-xs9xg, lex-m2q6s, lex-725ue, lex-z4423, lex-3vp2t, lex-nnq97, lex-4g945]
evokes: [attacking-stratagems, thirty-six-stratagems-chapter-three, diagnose-before-tactic-selection, conditional-tactics-not-universal-moves]
lineage:
  - source: practitioner
    text: this-corpus-editorial-grouping-attacking-stratagems-family
    citation: "This corpus's own editorial grouping of the Thirty-Six Stratagems' traditional third chapter, Attacking Stratagems, covering stratagems 13 through 18 -- a family the source itself names but does not decompose into a single formal claim the way this molecule states one. One member, Stratagem 16, is represented here by lex-z4423, an already-mined atom from an unrelated tradition, Plutarch's account of Aristides and Themistocles at Salamis, whose mechanism (a losing opponent left a believed escape route fights less desperately than one with none) was found, on a distinctness check, to already cover Stratagem 16's core claim closely enough that mining a separate, weaker-sourced duplicate from the Stratagems text itself, whose own worked example for that stratagem reads as garbled by a two-column OCR layout, was not warranted."
    quote: Six conditional indirect-attack tactics, each gated on a distinct diagnosable precondition; the formal claim that diagnosis precedes tactic selection is this corpus's synthesis, not a sentence stated by any one source.
canonical-instances:
  - "Peter Taylor, The Thirty-Six Stratagems: A Modern-Day Interpretation of a Strategy Classic (Infinite Ideas, 2013), groups Stratagems 13-18 under the traditional heading 'Attacking Stratagems' -- the source's own chapter division, not an invention of this corpus. This molecule adds the formal claim (diagnosis gates tactic selection) that the source states through six separate examples but never names as a single principle."
  - "Hypothetical: a competitor facing a rival firm defaults to a price war (direct force) without first checking which of several indirect levers might actually be available -- does the rival have an undervalued discontinued product line worth reviving under a new brand, is the rival's key account held by a transactional vendor contract or a genuine personal relationship, would a small unrecognized concession function as bait for a larger voluntary trade -- and picks the wrong lever because it never ran the diagnostic step first."
critical-questions:
  - "can more than one of these six preconditions hold simultaneously in the same conflict, and if so, does either the source or this corpus offer any ranking or sequencing guidance for which tactic to attempt first -- or are all six genuinely independent options with no preference ordering among them?"
  - "diagnosing a precondition (transactional or emotional loyalty, positional or personal power) is itself uncertain and can be misjudged. Beyond the cost of getting it wrong, there's a sequencing question the framework doesn't address: can a tactic's early failure feed back into revising the diagnosis mid-attempt, or does the whole approach assume the diagnosis was nailed correctly before anything was tried?"
status: active
