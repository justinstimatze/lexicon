lineage:
  - source: primary
    text: douglass-1881-life-and-times-harpers-ferry-declination
    citation: "Frederick Douglass, Life and Times of Frederick Douglass (Hartford: Park Publishing Co., 1881), Chapter IX, 'Increasing Demands of the Slave Power' -- Douglass's third and final autobiography. Reproduces his October 31, 1859 letter to the Rochester Democrat and American, written from Canada while evading a Virginia governor's extradition requisition, explaining his long friendship with and fundraising for John Brown alongside his non-participation in the Harper's Ferry raid."
    quote: "If any body is disposed to think less of me on account of this sentiment, or because I may have had a knowledge of what was about to occur, and did not assume the base and detestable character of an informer, he is a man whose good or bad opinion of me may be equally repugnant and despicable... My answer to this has already been given; at least impliedly given -- 'The tools to those who can use them!' Let every man work for the abolition of slavery in his own way. I would help all and hinder none."
canonical-instances:
  - "The direct textual anchor: Douglass, publicly accused of cowardice for not joining John Brown's raid on Harper's Ferry despite years of friendship and fundraising for Brown, explains that he declined the specific tactic (armed insurrection) as unsuited to his own instrument while refusing to condemn it and continuing to have materially aided it."
  - "Within a social movement, a moderate advocacy wing and a more confrontational direct-action wing pursue the same goal by different tactics; members of one wing decline to personally adopt the other's method while continuing to fund it, share resources with it, and decline to denounce it to outside or hostile audiences when it draws criticism."
  - "A corporate leader who built their own career through cautious, incremental execution backs a subordinate's more aggressive, higher-variance strategy aimed at the same target, funding and defending the strategy without adopting it personally or distancing from it once it takes on visible risk."
critical-questions:
  - "isn't this the same as lex-2sr4y (accept-unequal-entry-as-wedge-toward-full-parity)? No -- lex-2sr4y concerns accepting unfavorable ENTRY TERMS FOR ONESELF as a strategic wedge toward one's own future parity. This atom concerns one's STANCE TOWARD AN ALLY'S DIFFERENT TACTIC in the same shared cause -- no entry terms, no self-directed wedge, a different first-person decision entirely (what to think and do about someone else's chosen method, not what terms to accept for oneself)."
  - "isn't this the same as lex-7w239 (accepted-worst-case-outcome-defeats-risk-objections), drawn from the same John Brown material? No -- lex-7w239 is the diagnostic recognition that ordinary risk-argument stops working against an actor who has pre-accepted the worst case (a different night, a different mechanism, years before Harper's Ferry). This atom is the POSTURE Douglass takes toward that same person's tactic after the fact -- aid without adoption, no public condemnation. They co-occur in Douglass's actual conduct (he recognized Brown was unmovable AND chose to help without joining) but answer different questions: one diagnoses persuasion-failure, the other prescribes a stance toward an unpersuaded ally's chosen method."
  - "isn't this just 'big-tent' tolerance or agreeing to disagree? No -- mere toleration is passive and typically private; this posture requires ACTIVE material support ('I would help all') that precedes and survives the tactic's public consequences, and requires the declining actor to have actually vetted the tactic rather than simply not caring enough to object."
  - "does this license supporting any tactic whatsoever in the name of pluralism? No -- scoped to cases where the actor has independently examined the tactic and found nothing objectionable in it on its own terms; it is not a shield for materially enabling something one privately judges wrong, reckless, or counterproductive -- that case calls for actual disagreement, not deferral to 'different tools for different people.'"
