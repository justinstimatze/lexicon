lineage:
  - source: primary
    text: merton-lazarsfeld-1957-un-axis-symbol-correlation
    citation: "Robert K. Merton and Paul F. Lazarsfeld, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XIV 'Studies in Radio and Film Propaganda,' p.513. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'In all but one of the programs, the frequency of United Nations symbols is positively correlated with those pertaining to the Axis: an increase or decrease in the one set of symbols is associated with an increase or decrease in the other.'"
  - source: primary
    text: merton-lazarsfeld-1957-personification-stereotype-count
    citation: "Robert K. Merton and Paul F. Lazarsfeld, Social Theory and Social Structure (1957), same chapter, p.513."
    quote: "'This series of programs also made extensive use of the personification stereotype in referring to the enemy: about 25 per cent of all symbols denoting the enemy refer to Hitler, Mussolini, Goering, etc., whereas only four per cent of references to the United Nations and 11 per cent of those to the United States consist of personifications. This use of simplified personalized stereotypes presents the enemy as consisting essentially of a small band of evil men and implies that once these men are destroyed, all will be well. This kind of personification proves to be all too acceptable to listeners, since it accords with common simplistic ideas; for example, the parallel notion that we must fight crime primarily by punishing criminals and not by preventive measures.'"
canonical-instances:
  - "A company's internal all-hands transcripts over a year read, passage by passage, as being 'about growth and customers,' but a word-frequency count shows mentions of 'competitors' rising and falling in lockstep with mentions of the company's own product roadmap — revealing the roadmap is being driven reactively by competitor moves rather than by an independent strategy, a pattern no single all-hands reveals on its own."
  - "A news outlet's coverage of a public-health crisis is, article by article, sober and fact-based, but a count of which named individuals appear shows most blame-attribution language attaches to a handful of officials by name rather than to systemic causes — quietly training readers toward a 'remove these individuals and the problem is solved' framing no editor explicitly endorsed."
critical-questions:
  - "How do you distinguish a genuinely unintended structural pattern — the producers really didn't notice it — from a pattern that reflects deliberate, undisclosed editorial choices that a symbol count simply makes visible after the fact — does the diagnostic distinguish negligence from intent, or only surface the pattern either way?"
  - "What is the minimum sample size or document length at which symbol-count correlations become meaningful rather than noise — could a shorter or more varied campaign produce apparent co-movement patterns that don't reflect any real underlying structure?"
status: active
