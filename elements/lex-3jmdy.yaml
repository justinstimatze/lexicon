id: lex-3jmdy
name: abstract-value-conflict-is-indeterminate-until-a-situation-tests-it
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone claims two values, principles, or commitments are inherently consistent or inherently in conflict just by reasoning about them in the abstract, treat that claim as unresolved rather than settled -- Merton's point is that the abstract question has no fact of the matter until a concrete situation forces a choice. His example: asked in the abstract whether \"pacifism\" and \"abolitionism\" are compatible, incompatible, or simply irrelevant to each other, 'the answer must be indeterminate. One can equally well conclude, on the abstract cultural plane of belief, that these two value-systems are random (mutually irrelevant), consistent or inconsistent.' Only a concrete test (the Civil War) forced the issue, and different groups resolved it differently -- Quakers held both by pursuing nonviolent abolition, while Garrison's circle dropped pacifism to fight. Separately, apparent conflicts often turn out to be illusory once you check whether the two values are ever actually demanded of the SAME person at the SAME time: 'abstractly inconsistent values are often rendered compatible by their distribution among various statuses in the social structure so that they do not result in conflicting demands upon the same persons at the same time... by their segregation in different universes of discourse and their incorporation in different social roles.' Merton's own example: the Catholic Church looks like it holds 'incompatible values of celibacy and fertility' only if you ignore that celibacy is attached to the status of priest and unrestricted fertility to the married laity -- no single person is ever asked to hold both. Diagnostic move: before asserting that a value pair is in tension (or in harmony), ask (1) has any concrete situation actually forced a choice between them yet, and (2) are they even assigned to the same role-occupant, or does the social structure already keep them apart."
