lineage:
  - source: primary
    text: kindleberger-1978-manias-panics-and-crashes-ch2
    citation: "Charles P. Kindleberger, *Manias, Panics, and Crashes: A History of Financial Crises* (Basic Books, 1978), Ch. 2 'Anatomy of a Typical Crisis.' The canonical statement of the five-stage bubble anatomy. Kindleberger explicitly builds on Hyman Minsky's financial-instability framework (Minsky 1972 'Financial Instability Revisited' and Minsky 1986 *Stabilizing an Unstable Economy*), extending and historicizing it across three centuries of financial crises from the South Sea Bubble (1720) and tulip mania (1636) to 1970s commodity speculation. Kindleberger's contribution beyond Minsky: (i) historical applicability — the model is calibrated against dozens of documented crises, showing the anatomy is recurrent rather than theoretical; (ii) cross-country dynamics — the original Minsky model was single-country, Kindleberger extends to international capital flows; (iii) naming of the stages, especially 'distress' and 'revulsion' — Kindleberger draws these terms from older economic literature (Adam Smith's 'overtrading,' nineteenth-century 'discredit'), making the anatomy descriptively rich. The five stages: DISPLACEMENT (exogenous shock changing profit opportunities), BOOM (credit-expansion-fueled positive feedback), EUPHORIA / MANIA (speculation detaches from fundamentals, normally-aloof participants enter), DISTRESS (insiders begin to exit, prices level, doubts spread), PANIC / REVULSION (specific trigger precipitates stampede from assets into cash, bankruptcies cascade). Kindleberger's key argument is that the anatomy is STRUCTURAL — it is not a contingent sequence that happens to recur but the consequence of how credit expansion interacts with speculative psychology. Subsequent crises (1987 stock crash, 1990 Japan asset bubble, 1997 Asian financial crisis, 2000 dot-com, 2008 housing) all fit the five-stage anatomy in retrospect; the 2005-2011 editions of Kindleberger's book (revised by Robert Aliber after Kindleberger's 2003 death) extend the framework with these later cases. Predecessors: Kindleberger explicitly lists 'John Stuart Mill, Alfred Marshall, Knut Wicksell, and Irving Fisher' as classical economists with similar models. lex-wfuyn carves the transferable five-stage anatomy primitive."
    quote: "[Kindleberger 1978 Ch.2 pp. 16-20, condensing the five-stage statement:] 'According to Minsky, events leading up to a crisis start with a \"displacement,\" some exogenous, outside shock to the macroeconomic system. The nature of this displacement varies from one speculative boom to another. It may be the outbreak or end of a war, a bumper harvest or crop failure, the widespread adoption of an invention with pervasive effects — canals, railroads, the automobile — some political event or surprising financial success, or a debt conversion that precipitously lowers interest rates. But whatever the source of the displacement, if it is sufficiently large and pervasive, it will alter the economic outlook by changing profit opportunities in at least one important sector of the economy... In Minsky's model, the boom is fed by an expansion of bank credit which enlarges the total money supply... Positive feedback develops, as new investment leads to increases in income that stimulate further investment and further income increases. At this stage we may well get what Minsky calls \"euphoria.\" Speculation for price increases is added to investment for production and sale... When the number of firms and households indulging in these practices grows large, bringing in segments of the population that are normally aloof from such ventures, speculation for profit leads away from normal, rational behavior to what have been described as \"manias\" or \"bubbles.\" The word \"mania\" emphasizes the irrationality; \"bubble\" foreshadows the bursting... At a late stage, speculation tends to detach itself from really valuable objects and turn to delusive ones. A larger and larger group of people seeks to become rich without a real understanding of the processes involved. Not surprisingly, swindlers and catchpenny schemes flourish... There may then ensue an uneasy period of \"financial distress\"... As distress persists, speculators realize, gradually or suddenly, that the market cannot go higher. It is time to withdraw. The race out of real or long-term financial assets and into money turns into a stampede. The specific signal that precipitates the crisis may be the failure of a bank or firm stretched too tight, the revelation of a swindle or defalcation by someone who sought to escape distress by dishonest means, or a fall in the price of the primary object of speculation as it, at first alone, is seen to be overpriced. In any case, the rush is on. Prices decline. Bankruptcies increase. Liquidation sometimes is orderly, but more frequently degenerates into panic as the realization spreads that there is only so much money, and not enough to enable everyone to sell out at the top. The word for this stage — again, not from Minsky — is \"revulsion.\"'"
  - source: practitioner
    text: minsky-1972-financial-instability-hypothesis-and-minsky-moment
    citation: "Hyman P. Minsky, 'Financial Instability Revisited: The Economics of Disaster' (Board of Governors of the Federal Reserve System, 1972) and Hyman P. Minsky, *Stabilizing an Unstable Economy* (Yale University Press, 1986). The financial-instability hypothesis Kindleberger built on. Minsky's framework: financial systems oscillate between robust and fragile states. In tranquil times, profitable speculation encourages increased leverage (hedge finance → speculative finance → Ponzi finance), and the system progressively becomes more fragile. A 'Minsky moment' is the sudden collapse of asset values when the speculative finance can no longer be rolled over. Minsky's contribution is the THEORETICAL FRAME (financial fragility as endogenous to capitalist stability); Kindleberger's contribution is the HISTORICAL CALIBRATION (the same anatomy recurs across centuries). The 'Minsky moment' terminology entered popular finance discourse after the 2008 crisis. Practitioner reference because Minsky is the upstream theorist; Kindleberger is the historian-applied-theorist. lex-wfuyn carves the TRANSFERABLE FIVE-STAGE PRIMITIVE that both frameworks support."
    quote: "[Minsky 1972 / 1986 — verbatim quote not extracted in this pass pending re-acquisition. Kindleberger's primary quote above subsumes the transferable claim.]"
canonical-instances:
  - "operationally distinct from lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories (Pierson): general lock-in via amplification. lex-wfuyn specializes to the bubble case where positive-feedback amplification peaks and then reverses via the distress-panic stages; lex-mwgep's lock-in primitive does not include this reversal mechanism. Compose: lex-mwgep is the amplification primitive, lex-wfuyn adds the bubble-specific peak-and-reverse anatomy."
  - "operationally distinct from lex-y93tk self-organized-criticality-systems-tune-themselves-to-scale-free-cascades (Bak-Tang-Wiesenfeld 1988): SOC produces scale-free cascades from a critical-attractor state; lex-wfuyn specializes to the financial-bubble case where credit expansion drives the system to critical and a specific trigger collapses it. Related — financial markets sometimes exhibit power-law statistics consistent with SOC — but lex-wfuyn's transferable claim is the five-stage narrative anatomy, not scale-free statistics."
  - "operationally distinct from lex-hbanm social-influence-amplifies-both-inequality-and-unpredictability-of-cultural-market-success (Salganik-Dodds-Watts 2006): the cultural-market-divergence experimental demonstration. lex-wfuyn specializes to the financial-bubble case where social-influence plus credit expansion produces the five-stage anatomy, adding the credit-expansion mechanism and structural-reversal stages."
  - "operationally distinct from lex-d5eew unregulated-individual-choices-aggregate-to-collective-states-no-actor-preferred (Schelling 1971): general micromotive/macrobehavior gap. lex-wfuyn specializes to the bubble case where individual speculative buying while prices rise is locally rational but aggregates to a crash nobody preferred. lex-d5eew is the upstream framing; lex-wfuyn is the named anatomy in the financial domain."
  - "South Sea Bubble (1720) and Mississippi Bubble (1719-1720): paradigmatic early bubbles Kindleberger documents at length. Displacement: end of Spanish Succession War + new joint-stock-company financial instruments + government debt-conversion schemes. Boom: shares of the South Sea Company (Britain) and Compagnie du Mississippi (France) rose 8-10x on rumors of trade monopolies and government debt absorption. Euphoria: street speculation in London's Exchange Alley and Paris's rue Quincampoix involving normally-aloof participants. Distress: insider sales (Sir Isaac Newton was reportedly trapped at the peak). Panic: cascading bankruptcies, government intervention, durable trauma to British and French financial markets for the next century. Both bubbles fit the five-stage anatomy precisely."
  - "Dutch Tulip Mania (1636-1637): the earliest bubble in popular memory, though Kindleberger and subsequent historians (Garber 1989) argue the price excess was more limited than the popular story suggests. Displacement: introduction of rare varieties of tulip, a new luxury good. Boom: futures contracts for tulip bulbs traded actively in Dutch taverns. Euphoria: peak prices on rare Semper Augustus bulbs reached the equivalent of 10x a craftsman's annual income. Distress: early February 1637 auction in Haarlem failed to draw bids. Panic: prices collapsed in days. The anatomy is consistent even if the macroeconomic impact was smaller than later bubbles."
  - "Railroad Mania (Britain 1845-1847): displacement was the railroad-as-technology and government deregulation of railway charters. Boom: massive credit expansion to fund railway construction. Euphoria: hundreds of railway shares traded on London exchanges, many for routes never built. Distress: 1845 autumn — track-building costs ran over budgets. Panic: 1847 — Bank of England crisis, multiple railway company failures. Many lines were never completed; the survivors became the foundation of the British rail network."
  - "1929 U.S. stock market crash and Great Depression: displacement was electrification, automobile manufacturing, radio broadcasting, expanded credit. Boom: 1924-1929 stock market gained ~4x. Euphoria: famous quotes about 'shoeshine boys giving stock tips,' Joe Kennedy reportedly exiting when the bootblack offered him advice. Distress: September 1929 leveling. Panic: October 24-29, 1929 (Black Thursday, Tuesday). The post-crash depression's depth was amplified by the Federal Reserve's monetary-policy errors (Friedman-Schwartz 1963) — the bubble's five-stage anatomy is one part; the resulting depression's depth is a separate question."
  - "Japan asset bubble (1985-1990): displacement was the 1985 Plaza Accord (yen revaluation) and Bank of Japan monetary expansion. Boom: Japanese real estate and Nikkei stock index rose 3-4x. Euphoria: the Imperial Palace grounds in Tokyo were said to be worth more than the entire state of California; Mitsubishi Estate bought Rockefeller Center. Distress: 1989 Bank of Japan rate hikes. Panic: 1990 Nikkei collapse from ~39,000 to ~15,000; real estate declines continued through the 1990s and produced the 'lost decade.'"
  - "Dot-com bubble (1995-2002): displacement was the World Wide Web. Boom: Nasdaq rose from ~750 in 1995 to ~5,000 in March 2000. Euphoria: companies with no revenue achieved $100 billion valuations; profitless eyeball-counting and clickthrough metrics replaced earnings analysis; cab-driver IPO discussions. Distress: late 1999 / early 2000 — insider sales, Pets.com failure. Panic: March 2000 - October 2002 — Nasdaq fell 78% peak-to-trough; trillions of dollars of paper wealth eliminated."
  - "2005-2008 U.S. housing bubble: displacement was sustained-low interest rates after 2001 + subprime mortgage securitization + government policy encouraging home ownership. Boom: U.S. housing prices rose ~80% nationally (much more in Florida, Nevada, Arizona, California) 2000-2006. Euphoria: 'house-flipping' television shows, NINJA loans (no income, no job, no assets), normally-aloof participants entering as speculators. Distress: 2007 — subprime lender failures (Countrywide, New Century). Panic: 2008 — Bear Stearns collapse (March), Lehman Brothers bankruptcy (September), global liquidity crisis, government bailouts. The 'Minsky moment' terminology entered popular discourse during this crisis."
  - "Cryptocurrency bubbles (2017-2018 and 2020-2022): displacement was blockchain technology + permissionless money-printing potential + COVID-era central bank liquidity. Boom: Bitcoin from ~$1k to ~$20k in 2017; from ~$5k to ~$69k in 2020-2021. Euphoria: NFT speculation, Dogecoin / Shiba Inu manias, retail speculation via Robinhood, normally-aloof participants entering. Distress: 2022 — Terra/Luna collapse, Celsius/Voyager bankruptcies. Panic: 2022 — FTX collapse, Bitcoin to ~$16k. The five-stage anatomy fit with high precision; the next cycle's stages are not yet fully written as of 2025."
  - "operationally distinct from and composing-with lex-spm8x feedback-loop-as-mechanism: lex-spm8x is the generic feedback primitive; lex-wfuyn specializes to the credit-expansion-fueled speculative positive-feedback with the structural five-stage reversal-anatomy."
  - "operationally distinct from and composing-with lex-pjsjj binary-cascade-outcomes-track-threshold-distribution-not-average-preference (Granovetter): lex-pjsjj's threshold-cascade may explain the boom-to-euphoria tipping (enough normally-aloof participants enter) and the distress-to-panic tipping (enough insiders exit). Compose: Granovetter is the underlying cascade mechanism; Kindleberger is the named bubble-anatomy that uses cascade tippings."
critical-questions:
  - "What is the DISPLACEMENT for this market? Every bubble has one — a new technology, a war's end, a regulatory change, a debt conversion, a sustained-low-interest-rate regime. If you cannot identify the displacement, either the bubble is in an earlier stage than you thought (no displacement yet) or you have misdiagnosed the market and there is no bubble. Operational discipline: name the displacement explicitly. If it's not clear, the bubble framework may not apply."
  - "Is credit expanding? Bubbles are credit phenomena; they cannot inflate without credit expansion. Diagnose by checking: private-debt-to-GDP growth, leverage ratios, new financial instruments (derivatives, securitizations, custom credit products), bank-credit growth above trend. If credit is not expanding, the price appreciation may be a fundamental revaluation rather than a bubble."
  - "Are normally-aloof participants entering? Kindleberger's essential diagnostic for the boom-to-euphoria transition. Watch for: cab drivers giving stock tips, retirees moving 401(k)s into the asset class, television shows about 'getting rich quick' in the sector, mainstream-media coverage shifting from finance pages to lifestyle sections. When normally-aloof participants enter en masse, you are in euphoria, not boom."
  - "Are insiders exiting? The boom-distress transition. Watch for: insider sales (SEC Form 4 filings), executive option exercises, founder share unloading, private equity 'flips' before the asset matures. The smart money exits before the panic; when you can see them exiting, distress has begun even if prices are still high."
  - "What is the SPECIFIC TRIGGER likely to be? Kindleberger emphasizes that the trigger is often unpredictable (which bank, which swindle, which fund collapse), but the PHASE is predictable. You can know panic will come without knowing what will start it. Operationally: prepare for panic in the distress stage; don't wait to identify the trigger."
  - "Is this 'this time is different'? Kindleberger's repeated warning: every bubble's participants believe this time is different — the technology is genuinely new, the asset class is genuinely revolutionary, the macroeconomic conditions are genuinely unprecedented. Sometimes these claims are partly true (the dot-com era's underlying technology did transform the economy; the survivors became the largest companies in the world). But the anatomy still applies. The fundamental innovation does not exempt the financial markets from the structural anatomy."
  - "Has the panic stage produced revulsion-against-the-asset-class entirely? Kindleberger documents that post-crash 'revulsion' often extends much further than warranted — bank lending dries up against legitimate collateral, regulators over-react, productive uses of the displaced technology are starved of capital. The opposite-error of the euphoria stage. Diagnose: is the post-crash revulsion preventing the asset class from being deployed where it would be productive? If yes, you are in the over-shoot phase of the cycle."
