id: lex-cahck
name: framing-a-rival-as-an-existential-threat-licenses-any-countermeasure
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Watch for the shift from treating a rival, competitor, or opposing faction as someone you disagree with and want to defeat within the rules, to treating them as an existential threat whose victory would be catastrophic or illegitimate in itself. Levitsky & Ziblatt (How Democracies Die, 2018, Ch.5) name this collapse of 'mutual toleration' — 'the idea that as long as our rivals play by constitutional rules, we accept that they have an equal right to exist, compete for power, and govern' — as the trigger mechanism for abandoning restraint: 'if we view our rivals as a dangerous threat, we have much to fear if they are elected. We may decide to employ any means necessary to defeat them — and therein lies a justification for authoritarian measures.' The mechanism is not gradual erosion of standards but a reclassification: the SAME action (blocking a nominee, refusing to certify a result, jailing an opponent) reads as an unthinkable norm violation when the rival is a legitimate opponent, and as necessary self-defense once they are recast as an existential threat. Historical cases (Spain 1931-36, Chile 1970-73, the U.S. 1850s) show the reclassification is often mutual and self-reinforcing: each side's hardball response to the other's existential-threat rhetoric confirms the other's fear, in a spiral that ends in civil war or coup. Diagnostic: when you notice yourself or others describing a rival's potential victory not as 'we'd rather they lose' but as 'the country/institution/community cannot survive this,' check whether the description is proportionate to the rival's actual demonstrated conduct (do they reject the rules of the game, deny your legitimacy, tolerate violence, threaten your basic liberties?) or whether the existential framing itself is doing the work of licensing measures that would otherwise be unthinkable."
related: [lex-726ub, lex-dvb4u, lex-e7k3x, lex-gt9kt, lex-mmxs8, lex-u376n, lex-vh2wh]
evokes: [mutual-toleration, existential-threat-framing, legitimate-opposition, loyal-opposition, treason-of-disagreement]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch5
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 5 'The Guardrails of Democracy.' Traces mutual toleration's collapse in Spain's Second Republic (1931-36, ending in civil war), Chile under Allende (1970-73, ending in the Pinochet coup), and the antebellum United States (1850s, ending in civil war), contrasted with its establishment in the early American republic after decades of Federalist-Republican mutual suspicion."
    quote: "Mutual toleration refers to the idea that as long as our rivals play by constitutional rules, we accept that they have an equal right to exist, compete for power, and govern. We may disagree with, and even strongly dislike, our rivals, but we nevertheless accept them as legitimate. [...] When norms of mutual toleration are weak, democracy is hard to sustain. If we view our rivals as a dangerous threat, we have much to fear if they are elected. We may decide to employ any means necessary to defeat them — and therein lies a justification for authoritarian measures. Politicians who are tagged as criminal or subversive may be jailed; governments deemed to pose a threat to the nation may be overthrown. [...] In just about every case of democratic breakdown we have studied, would-be authoritarians...have justified their consolidation of power by labeling their opponents as an existential threat."
canonical-instances:
  - "Spain's Second Republic, 1931-36: the right came to see the Republican-Socialist government as 'bolshevizing foreign agents' and the left came to see the Catholic-conservative CEDA as fascist counterrevolutionaries plotting violent overthrow; neither side accepted the other as a legitimate rival, and both justified increasingly extreme countermeasures (jailing a former prime minister, brutal repression of strikes, eventual civil war) as necessary self-defense against an existential enemy."
  - "Allende's Chile, 1970-73: the right-wing opposition and Allende's own radical allies each escalated in response to the other's existential framing — the opposition pursued 'institutional checkmate' via censure votes and impeachment because they believed Allende's socialism was 'totalitarianism,' while Allende's allies called any negotiation with the opposition 'opening the door to fascism.' Neither side could de-escalate without appearing to concede the other's legitimacy; the spiral ended in a military coup."
  - "The U.S. 1850s: proslavery politicians branded abolitionism as a threat that would produce 'a degradation greater than has ever yet fallen to the lot of a free and enlightened people,' while antislavery politicians accused their rivals of 'treason' and 'sedition' — the shift from policy disagreement to existential-threat framing preceded, and licensed, the partisan violence (125 recorded incidents in Congress alone, 1830-1860) that culminated in the Civil War."
  - "A modern organizational instance: a faction within a company, nonprofit, or community group comes to describe an internal rival's ascension to leadership not as 'a direction we disagree with' but as something the organization 'cannot survive' — the existential framing then justifies leaks, sabotage, or rule-breaking that the faction would never have endorsed against a rival they regarded as merely wrong rather than catastrophic."
critical-questions:
  - "is the existential-threat framing tracking the rival's actual demonstrated conduct — do they reject democratic rules, deny your legitimacy, tolerate violence, threaten basic liberties (the same four-point litmus test the book develops for identifying actual authoritarians) — or is the framing running ahead of the evidence, doing rhetorical work that the rival's conduct doesn't yet justify?"
  - "how does this differ from lex-z26m9 (exclusive-truth-claim-cosmologies-structurally-produce-intolerance-of-alternatives)? lex-z26m9 is a general epistemological mechanism — ANY framework asserting exactly-one-true-X structurally cannot tolerate alternatives, independent of the alternative's actual conduct. This atom is narrower and more diagnostic: it is specifically about the moment a POLITICAL RIVAL (who was previously tolerated as a legitimate competitor) gets recast as existential, and it hinges on whether that recast tracks the rival's conduct or outruns it. lex-z26m9 explains why some frameworks are intolerant by design; this atom explains a specific licensing move that can happen even between frameworks that don't have that structural feature."
  - "how does this differ from lex-dvb4u (institutional forbearance / constitutional hardball)? They reinforce each other but are not the same move: this atom is about the BELIEF shift (rival as legitimate competitor vs. existential threat); lex-dvb4u is about the BEHAVIORAL consequence (restraint vs. maximal exercise of legal power). The book's own account is that existential-threat framing is usually what licenses abandoning forbearance, not a separate independent cause — but a group can hold existential-threat beliefs while still not yet resorting to hardball, or vice versa."
  - "when is existential-threat framing accurate rather than a licensing move? When the rival's own conduct, assessed against a concrete external standard (not just how threatening they feel), actually meets the criteria — rejecting the rules of the game, denying your side's legitimacy, tolerating or encouraging violence, moving to curtail rivals' basic liberties. The diagnostic is not 'never treat anything as existential' but 'require the same evidentiary bar for existential framing that you'd require of anyone else making that claim about you.'"
severity-tier: warning
status: active
