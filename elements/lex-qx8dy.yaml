evokes: [hyde-trickster-makes-this-world-a-sign-of-youthful-theft, apollos-cattle, umberto-eco-semiotics, meaning-exists-only-retroactively]
lineage:
  - source: primary
    text: hyde-apollos-fixed-cattle-acquire-meaning-only-once-hermes-displaces-them
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'The First Lie,' 'A Sign of Youthful Theft,' drawing on Umberto Eco's A Theory of Semiotics and Jean-Pierre Vernant. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "If meaning cannot exist without the possibility of substitution, then so long as the cattle cannot be moved from their unmown meadow they cannot mean anything. Conversely, the moment at which they may be butchered and eaten is the moment at which their earlier state acquires its significance. Their meat means one thing on the hoof, another in the fire, and yet another hung in the barn. Hermes-the-Thief moves the meat from one situation to another and by such substitutions it comes to have its significance; it becomes a sign that can “tell” something."
canonical-instances:
  - "A family heirloom that has sat untouched on the same shelf for three generations doesn't feel like it 'means' anything in particular until someone proposes selling it, at which point its permanence retroactively becomes significant, evidence of continuity, obligation, identity, precisely because it is now possible to end that permanence."
  - "An employee's routine, unremarkable attendance at every meeting for years carries no particular meaning until the day they're conspicuously absent, at which point their prior constant presence is suddenly read backward as loyalty, reliability, or investment it was never explicitly understood as before."
critical-questions:
  - "Is this really a claim about meaning itself, or just about noticeability -- do fixed, unchanging things actually lack meaning, or do they simply fail to attract the attention that would let an observer register a meaning that was there all along?"
  - "Does the claim hold for meanings assigned by convention or ritual rather than by contrast -- a flag that has flown unmoved in the same spot for a century clearly means something to observers without ever being displaced, which seems to be a counterexample."
  - "If meaning requires the possibility of substitution, does that possibility alone suffice, or must the substitution actually occur -- are Apollo's cattle meaningless before Hermes acts, or were they always meaningful in virtue of being movable in principle, whether or not anyone ever moved them?"
