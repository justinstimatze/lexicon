id: lex-mzzgc
name: in-group-cohesion-does-not-imply-out-group-hostility
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When someone treats 'strong internal solidarity produces hostility toward outsiders' as a sociological law rather than one possible pattern, push back with Merton's explicit correction of Sumner. Sumner's founding statement of in-group/out-group theory bundled the two together as a package: 'Loyalty to the group, sacrifice for it, hatred and contempt for outsiders, brotherhood within, warlikeness without-all grow together, products of the same situation.' Merton names the overreach directly: 'Lacking any but the most primitive conceptions of psychology, Sumner too soon and without warrant concluded that deep allegiance to one group generates antipathy (or, at the least, indifference) toward other groups... He assumed, and his assumption has been echoed as established truth on numerous occasions since his day, that intense loyalty to a group necessarily generates hostility toward those outside the group.' The corrective move is reference group theory itself: because people orient positively to NON-membership groups all the time (aspiration, admiration, cross-group learning), tight in-group cohesion coexists constantly with friendly, indifferent, or cooperative orientations to specific out-groups — inner-cohesion-and-outer-hostility is a special case Sumner over-generalized from, not the general case. Merton: 'Reference group theory which systematically takes account of positive orientations toward non-membership groups can serve as a corrective of this prematurely restricted conclusion.' Diagnostic use: don't predict, or explain after the fact, an out-group hostility from the mere existence of strong in-group bonds. Check independently whether THIS group's structural situation (competition for scarce status or resources, active conflict, a history of grievance) is actually producing the hostility component — a team, nation, or movement can be intensely bonded internally while treating specific outsiders as allies, resources, aspirational models, or simply irrelevant, and assuming otherwise from cohesion alone will misdiagnose which groups are actually dangerous."
related: [lex-hdxfh, lex-r4x7h]
evokes: [merton-1957, william-graham-sumner-folkways, ethnocentrism, prematurely-restricted-conclusion, positive-orientation-to-non-membership-groups, ingroup-outgroup-not-a-package-deal]
lineage:
  - source: primary
    text: merton-1957-sumner-folkways-ingroup-outgroup
    citation: "William Graham Sumner, Folkways (Boston: Ginn and Company, 1906), pp.12-13, quoted in Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. IX 'Continuities in the Theory of Reference Groups and Social Structure,' p.297. A secondary transcription of Sumner's words as they appear inside Merton's book, not independent access to Folkways itself."
    quote: "'The relation of comradeship and peace in the we-group and that of hostility and war towards others-groups are correlative to each other. Loyalty to the group, sacrifice for it, hatred and contempt for outsiders, brotherhood within, warlikeness without-all grow together, products of the same situation'"
  - source: primary
    text: merton-1957-sumner-overreach-and-correction
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), Ch. IX, pp.298-299, citing the unpublished Merton, West and Jahoda, Patterns of Social Life, Ch. 8."
    quote: "'Sumner too soon and without warrant concluded that deep allegiance to one group generates antipathy (or, at the least, indifference) toward other groups... He assumed, and his assumption has been echoed as established truth on numerous occasions since his day, that intense loyalty to a group necessarily generates hostility toward those outside the group. Reference group theory which systematically takes account of positive orientations toward non-membership groups can serve as a corrective of this prematurely restricted conclusion.'"
canonical-instances:
  - "A tightly bonded research lab collaborates warmly and shares data with a rival lab at another university even while maintaining strong internal culture and loyalty — cohesion and cross-group friendliness coexist because the two labs are not in the kind of structural competition that would activate hostility."
  - "Commentary on a nation's rising internal solidarity (a shared crisis, a unifying leader, a strong national identity) often assumes rising hostility toward outsiders must follow — but historical cases where solidarity rose alongside continued alliance-building, trade, or indifference toward most other nations show the Sumner package is not automatic; the hostility, where it appears, has its own separate structural cause (contested resources, a specific rivalry, wartime mobilization) that has to be checked directly."
critical-questions:
  - "If inner-cohesion-and-outer-hostility is only one pattern among several, what determines which pattern a given group falls into — is it primarily about whether the group is in actual competition or conflict with specific out-groups, or are there cohesive-but-hostile groups with no clear competitive trigger, suggesting a separate psychological disposition also matters?"
  - "Merton cites his own then-unpublished manuscript (Merton, West and Jahoda) as showing multiple patterns of inter-group relations beyond Sumner's, but does not detail them here — what other named patterns exist besides cohesion-with-hostility and cohesion-with-positive-orientation, and does a full typology exist anywhere in the corpus that this atom could point to?"
status: active
