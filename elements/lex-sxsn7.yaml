id: lex-sxsn7
name: resisting-domination-reconstitutes-dignity-independent-of-victory
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When someone is deciding whether it's 'worth it' to resist a domination they cannot be sure of defeating, separate two different payoffs: the OUTCOME payoff (do I actually win, does the abuse actually stop) and the CONSTITUTIVE payoff (what does the act of resisting do to my own sense of being an agent, regardless of outcome). Douglass's testimony names the second payoff as real and central even when the first is uncertain or absent: fighting his overseer Covey to a draw — not a clean victory, just successfully refusing to be beaten — was, in his own account, the actual turning point of his life as an enslaved person, because it reconstituted his felt sense of manhood and self-respect independent of whether it changed his formal (legal) status at all. The mechanism generalizes: a person who shows no capacity or willingness to resist cannot be honored even by those dominating them — they can be pitied, but pity is not respect, and even pity erodes if 'the signs of power do not arise.' The counter-move for someone stuck weighing whether resistance is 'rational' by pure cost-benefit-of-outcome: name the constitutive payoff explicitly as a SEPARATE line item, not a consolation prize — it does not require decisive victory to be real, and it can be the dominant term in the decision even when the outcome-payoff is unfavorable or uncertain."
related: [lex-v6kmc, lex-wf4nj, lex-pd9p6, lex-cmkdq, lex-ezcv6, lex-es7a5, lex-7w239, lex-jhwqx, lex-bfwev]
