evokes: [extremal-goodhart, out-of-sample-failure, regime-change-under-selection-pressure, model-insufficiency-at-the-tail, the-relationship-was-learned-here-but-applied-there, wind-speed-above-the-instrument-tolerance]
lineage:
  - source: primary
    text: manheim-garrabrant-2019-categorizing-variants-of-goodharts-law
    citation: "David Manheim and Scott Garrabrant, 'Categorizing Variants of Goodhart's Law' (arXiv:1803.04585, v4, 24 February 2019), Section 2 'Extremal Goodhart' (with sub-cases 'Model Insufficiency' and 'Change in Regime'). The paper carves the variant into the two distinct sub-mechanisms and gives the wind-speed instrumentation example (instruments biased downward above their design tolerance) for measurement-induced regime change and the atmospheric-boundary-layer example for genuinely physically distinct regimes. Manheim-Garrabrant note the connection to 'out of sample prediction' in statistics and machine learning: extremal Goodhart is the application of out-of-sample failure to optimization-pressure problems specifically — the problem is not just that the model fails outside its training region, but that selection-by-the-model PUSHES the system into precisely the region where the model fails."
    quote: "Extremal Goodhart - Worlds in which the proxy takes an extreme value may be very different from the ordinary worlds in which the relationship between the proxy and the goal was observed. A form of this occurs in statistics and machine learning as 'out of sample prediction.' ... Extremal Goodhart can occur in two ways. First, the proxy may have been simplified based on either an insufficient number of observations to uncover the true relationship, or because a simpler measure was preferred. In either case, model insufficiency can lead to extremal Goodhart. Secondly, the measure may be a correct estimator only in certain regions of the space. In regions where the generating process differs, the use of the measure leads to extremal Goodhart."
canonical-instances:
  - "ML benchmark saturation with out-of-distribution capability mismatch (Wei 2022, Schaeffer 2023 territory): a model is trained on a distribution where benchmark score X correlates with capability Y at r > 0.9. As capability scales, X saturates near ceiling while Y continues to vary — the proxy is now in a regime where the in-training-distribution correlation no longer applies, and you cannot use X to distinguish capability levels above the threshold where saturation occurred. Model insufficiency variant: the benchmark was an approximation that ran out of dynamic range. The fix is harder benchmarks or held-out probes — not more optimization on the saturated one"
  - "school accountability under No Child Left Behind: school proficiency rates correlated with learning at the population mean in the baseline years. When the proficiency-rate cutoff became the regulatory threshold and schools optimized to push borderline-students over the cutoff, the population pushed past the boundary where 'proficient = learned-the-material' was directly measured — schools could push borderline students over the cutoff while leaving high-need students stagnant. The proxy-goal relationship that held when 'proficient' was a passive observation does NOT hold when it becomes the optimization target — regime change in the population dynamic"
  - "Soviet output-quota infrastructure: at the population mean of nail-producing factories, weight-of-nails-produced correlated with total useful-nail-output. Pushed to the extreme — every factory selecting for high weight — the regime shifted: the high-weight region of factory output-space is dominated by single-giant-useless-nails and the original proxy-goal correlation is gone. Same factory, same machinery, same workers — but the regime where weight was a good proxy was not where the optimization pushed them"
  - "epidemiological dose-response extrapolation: at low doses observed in epidemiology, the linear-no-threshold (LNT) model is approximately correct for many exposures. Selection of regulatory cutoffs based on the LNT extrapolation into very-low-dose regions assumes the LNT relationship holds there — but in some cases (hormesis, thresholds, repair-mechanism kicks-in below certain doses) the relationship is fundamentally different in the extrapolation region. The proxy-goal model is wrong outside the observed range; selection on it produces extremal Goodhart"
  - "engineering-margin failures (the wind-speed instrument example, generalized): the strain-gauge on a structural beam is calibrated and validated at loads up to its design range. Loads ABOVE the design range are systematically mis-measured (the gauge saturates or yields nonlinearly). A safety system selecting on the gauge reading 'flag for inspection if strain > threshold' works inside the design range; in the over-range region, the gauge under-reports strain, and the safety system stops flagging the cases that most need flagging. Regime change due to instrument-limit; the proxy-goal relationship is fundamentally different above the boundary"
  - "trained-distribution drift in deployed ML systems: a fraud-detection model trained on transactions from 2018-2020 is deployed in 2022 — the input distribution has shifted (new payment rails, new fraud patterns). The proxy-goal relationship the model learned does not hold for the deployment distribution. This is extremal Goodhart broadened: optimization pressure (real-time fraud-vs-legit selection) is operating in a region the model didn't observe. The fix is continuous retraining, drift detection, or held-out test sets that include extrapolation-region cases"
critical-questions:
  - "across what range of M was the proxy-goal relationship actually OBSERVED? Plot the joint distribution; mark the actual range of M present in your training/observation data. Selection that pushes M into regions sparsely populated in observation is operating on extrapolation, not data. Most stakeholders skip this step and treat the proxy-goal correlation as applying uniformly across all M"
  - "is the proxy-goal model a SIMPLIFICATION (model insufficiency) or does it match the true functional form? If the model is simplified (linear approximation of a curve, polynomial truncation, parametric assumption), selection on the simplified model will move the system into regions where the omitted terms dominate. The fix is to refit at the optimization-region (often impossible if you can't observe there) or to use a model class that doesn't impose the simplification"
  - "is there a known REGIME boundary anywhere within or near the optimization path? Physical instruments have design ranges; biological systems have homeostatic thresholds; economic systems have phase transitions in market structure. If the optimization is pushing toward or across such a boundary, extremal Goodhart is the expected failure mode and you should plan for it explicitly"
  - "is regressional Goodhart (lex-hbknh) ALSO operating? Extremal and regressional Goodhart are not mutually exclusive — selecting on a noisy proxy in the extreme tail amplifies both effects simultaneously. The diagnostic distinction is: regressional bites even in the observed region, extremal bites only outside it. If both are present, the proxy-goal gap in the selected cohort is the sum of (regressional noise component) + (extrapolation error component)"
  - "what would VALIDATING the proxy-goal relationship in the extrapolation region look like, and is it possible? Sometimes you can simulate it, sometimes you can hold out a test set in the extrapolation region, sometimes you can run a smaller-stakes pilot inside the extrapolation region first. If NONE of these is feasible, you are operating on faith that the in-region relationship extends — and faith is the wrong basis for high-pressure optimization"
severity-tier: warning
