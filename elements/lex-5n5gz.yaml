lineage:
  - source: primary
    text: merton-1957-fallacious-inference-named
    citation: "Robert K. Merton, \"Some Preliminaries to a Sociology of Medical Education,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.27-28. Verified against the pdftotext extraction of the source PDF."
    quote: "'even those physicians who see a distinct and growing place for a sociological orientation in medicine sometimes write as if, though they obviously do not intend to say this, the social environment affected only the socially disadvantaged patient: the poor, the uneducated, the decrepit.'"
