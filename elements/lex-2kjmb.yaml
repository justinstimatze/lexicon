lineage:
  - source: primary
    text: friston-2010-free-energy-principle-unified-brain-theory
    citation: "Karl Friston (2010), 'The free-energy principle: a unified brain theory?', *Nature Reviews Neuroscience* 11:127-138. Open-access via Friston's UCL Functional Imaging Laboratory author copy. The transferable claim is that any self-organizing biological system at equilibrium with its environment must minimize its variational free energy, which is an upper bound on (negative log) surprise. The 2010 review explicitly frames this as a UNIFYING principle across previously-disparate brain theories: (a) the Bayesian brain hypothesis (perception is inference); (b) predictive coding (hierarchical generative models with descending predictions and ascending prediction errors); (c) efficient coding (Barlow's redundancy reduction); (d) optimal control / decision theory (action minimizes expected cost = expected surprise under the free-energy view); (e) neural Darwinism / selectionism (Edelman); (f) self-organization and homeostasis. The 2010 paper extends Friston's earlier 2005-2009 mathematical work into a Nature-Reviews-Neuroscience-format review accessible to the broader cognitive-neuroscience field. Active inference — the claim that action serves the same objective as perception by making sensory inputs conform to predictions — is the most consequential downstream implication: it dissolves the perception/action distinction by deriving both from the same minimization. Critiques exist (unfalsifiability concerns, restrictive variational-bound assumptions); the atom names the TRANSFERABLE organizing principle, not the specific neural mechanism. Hohwy 2013 *The Predictive Mind* (in-copyright, currently user-procure) and Clark 2013 *Whatever Next?* (BBS, currently user-procure) provide accessible synthesis."
    quote: "[Friston 2010, Nat Rev Neurosci 11:127, abstract:] 'A free-energy principle has been proposed recently that accounts for action, perception and learning. This Review looks at some key brain theories in the biological (for example, neural Darwinism) and physical (for example, information theory and optimal control theory) sciences from the free-energy perspective. Crucially, one key theme runs through each of these theories — optimization. Furthermore, if we look closely at what is optimized, the same quantity keeps emerging, namely value (expected reward, expected utility) or its complement, surprise (prediction error, expected cost). This is the quantity that is optimized under the free-energy principle, which suggests that several global brain theories might be unified within a free-energy framework.' [Same paper, on the principle proper:] 'any self-organizing system that is at equilibrium with its environment must minimize its free energy. The principle is essentially a mathematical formulation of how adaptive systems (that is, biological agents, like animals or brains) resist a natural tendency to disorder.' [On surprise:] 'Entropy is also the average self information or surprise (more formally, it is the negative log-probability of an outcome). Here, a fish out of water would be in a surprising state (both emotionally and mathematically).' [On active inference:] 'In short, the agent will selectively sample the sensory inputs that it expects. This is known as active inference. An intuitive example of this process (when it is raised into consciousness) would be feeling our way in darkness: we anticipate what we might touch next and then try to confirm those expectations. ... Free energy can be reduced only by changing the recognition density to change conditional expectations about what is sampled or by changing sensory samples (that is, sensory input) so that they conform to expectations.'"
canonical-instances:
  - "Feeling-your-way-in-darkness (Friston's intuition pump): you anticipate what you might touch next; you reach out to confirm. Action minimizes free energy by making the world conform to your sensory predictions. The seamless interweaving of action and perception isn't two systems coordinating — it's one objective being minimized along two routes."
  - "Fish-out-of-water as the canonical surprise state: a biological agent must keep its sensory entropy bounded; persistence-as-such IS surprise minimization. The system that doesn't minimize surprise drifts toward states that destroy it."
  - "Homeostasis as surprise minimization: maintaining core body temperature isn't a separate function from prediction — the organism has a generative model that includes 'I am at 37°C'; deviation generates prediction error; corrective action (shivering, sweating) reduces free energy via the action route. Allostasis is the same principle applied predictively."
  - "Confirmation bias as misallocated active inference: when an organization 'minimizes surprise via action' (suppresses dissenting data, maintains narrative consistency, fires whistleblowers), it's choosing the action-route of free-energy minimization when the inference-route (update the worldview) would be more adaptive. The principle predicts both as routes, and predicts which one will be chosen as a function of which is locally cheaper — useful diagnostic for organizational pathology (lex-0XXX defensive routines / undiscussability)."
  - "LLM training as variational free-energy minimization (loose mapping): next-token-prediction-loss IS a surprise signal; the parameters are updated to reduce surprise on the training distribution; in-context learning is the perception-route (update beliefs to match data); fine-tuning is the slow-timescale parameter-route. The mapping isn't exact (LLMs don't act in the environmental sense) but the family-resemblance is substantive."
  - "Self-organized criticality (lex-y93tk Bak-Tang-Wiesenfeld) as the dynamical-systems cousin: SOC systems naturally drift toward critical points; the free-energy framework predicts this as the result of dynamics that minimize long-run surprise. The two atoms point at the same gestalt from different formalisms."
  - "Distinguished from lex-wgd7u learning-tracks-prediction-error: lex-wgd7u is the SIGNAL form (what drives momentary updates); this atom is the OBJECTIVE form (what's being minimized over the long run). RPE is one of several routes by which the system reduces free energy. They compose."
critical-questions:
  - "Is the transferable claim that the free-energy principle is a FRAMEWORK or a SPECIFIC MECHANISM? It's a framework. Specific implementations (predictive coding hierarchies, Kalman filters, particle filters, message passing) are distinct. Failure mode: treating 'free-energy minimization' as if it specifies a concrete neural circuit — it specifies an objective the circuit must serve."
  - "Have you accounted for the unfalsifiability critique? Some philosophers and theorists argue the free-energy principle is unfalsifiable as stated: any adaptive behavior can be retrofit into the framework by choosing the right priors and generative model. Cite the framework as transferable organizing principle, not as a specific empirically-testable theory. The empirical tests are at the implementation level."
  - "Are you confusing 'surprise minimization' with 'reward maximization'? Related but distinct. Reward maximization seeks high-utility states; surprise minimization seeks predictable states. They overlap when predictable states are utility-positive but diverge when an organism predicts and prefers a known bad state over an unknown one (depression, learned helplessness, abusive-relationship-stays)."
  - "Does the action-route claim entail conservatism (sticking with what's predicted)? Not necessarily — the framework includes priors that EXPECT exploration. Friston: 'natural selection may equip agents with the prior expectation that they will explore their environment until states with innate value are encountered.' Curiosity and exploration are themselves built into the prior, not in tension with it. The framework is more flexible than 'organisms just confirm what they expect' suggests."
  - "How does this compose with lex-wgd7u? lex-wgd7u names the SIGNAL (prediction error driving moment-to-moment weight updates via dopamine). This atom names the OBJECTIVE (long-run surprise minimization across action, perception, and learning). They are facets of the same primitive: brains are prediction engines that learn from where prediction fails and act to make the world conform to predictions. Transferable composition: any adaptive system that has these two features will exhibit predictive-brain-like dynamics."
