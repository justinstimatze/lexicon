id: lex-sqspc
name: collapsing-art-status-hierarchy-mints-artists-from-untrained-residents
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When trying to grow local creative participation in a community, don't sort work into separate tiers by training or pedigree (a 'real art' program running alongside a 'folk art' or 'community outreach' program) -- placing institutionally-credentialed work and a completely untrained local's self-taught work in the exact same undifferentiated space, presented with no distinguishing hierarchy between them, is itself what does the transformative work, independent of any individual piece's quality. Bombay Beach Biennale co-founder Tao Ruspoli's own account of why the festival functions this way: 'I've never seen it anywhere else in the world where people can gather to see top-tier opera, next to an Oxford philosophy professor, next to a woman who didn't even know she was an artist, spending her life cutting out butterflies and putting them all over her house. Her name is April, and she is an amazing local woman who has emerged as an artist through this process.' The claim isn't merely that diverse art forms are present together -- it's that removing the curatorial hierarchy that would ordinarily separate the opera from the woman with the butterflies is what lets an untrained resident's private hobby register as art at all, to others and to herself. Diagnostic move: when trying to seed new creative participation in a community, check whether an implicit or explicit prestige tier is quietly cordoning off amateur or local work from the 'real' program -- removing that separation, not simply adding more programming, may be what actually converts spectators and hobbyists into recognized participants."
related: [lex-2dtcp]
