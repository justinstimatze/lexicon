    quote: "'Ha! said he, lucky fellow, I! Here is one of my eyes. So he picked it up and clapped it into one of his empty sockets; then he peered up to the sky, and the light struck through it. Didn't I tell you so, old fellow? It is one of your eyes, by the souls of your ancestors! ... He didn't seem to see quite as well as he had seen before, but still the cranberries answered the purpose of eyes exceedingly well, and the poor wretch of a Coyote never knew the difference; only it was observed when he returned to his companions in the Canon of the Cedars that he had yellow eyes instead of black ones.'"
canonical-instances:
  - "A manager who loses access to a key report improvises a rough substitute metric that seems to track well enough by their own casual glance, never noticing it has silently drifted from what the original measured, while everyone downstream who actually relies on the number can see the discrepancy immediately."
  - "Someone who damages their hearing gradually turns the television up louder and louder, satisfied each time that it sounds fine to them, while everyone else in the room can hear exactly how far the volume has drifted from what anyone else would consider normal."
critical-questions:
  - "Is the Coyote's failure to notice a matter of the cranberries genuinely passing every test available to him, or is there a test he could have run (asking a companion, comparing the sensation to memory) that he simply didn't think to try?"
  - "Does the permanence of the color change (yellow instead of black) suggest the substitution was inherently detectable to any outside observer, or could a more careful improvisation have escaped notice by everyone rather than just the Coyote himself?"
  - "Is there a meaningful difference between not noticing a substitution because your only checking instrument is compromised, versus not noticing because you never bothered to check at all -- does the story distinguish between these, or collapse them into the same outcome?"
