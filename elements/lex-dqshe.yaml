id: lex-dqshe
name: manufacture-a-rival-to-let-a-tyrants-pride-destroy-him
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When facing an unchecked, dominant tyrant too strong to defeat by force, look for a way to make him perceive a threatening rival rather than trying to confront him directly, since his own pride and reflexive dominance-response can do the work no attack could. The Panchatantra's rabbit, sent as an envoy from animals oppressed by a lion, leads the lion to a well and shows him his own reflection in the water; the lion, reading the reflection as a rival, roars a challenge, hears his own roar echo back as if answered, and hurls himself into the well to his death. The verse names the mechanism: 'Intelligence is power. But where could power and folly make a pair? The rabbit played upon his pride to fool him; and the lion died.' The rabbit never fights the lion — he only arranges for the lion's own threat-perception to trigger against a target that cannot actually fight back."
related: []
evokes: [panchatantra, loss-of-friends, manufactured-rival-triggers-self-destruction, pride-as-the-exploitable-weakness-of-a-tyrant]
lineage:
  - source: primary
    text: panchatantra-ryder1925-numskull-and-the-rabbit
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book I, 'Numskull and the Rabbit.' Verified verbatim against a direct extraction of the held copy."
    quote: "Intelligence is power. But where Could power and folly make a pair? The rabbit played upon his pride To fool him; and the lion died."
canonical-instances:
  - "a weaker competitor, unable to challenge a dominant incumbent directly, leaks selectively framed information that makes the incumbent believe a much larger threat is entering its market, and the incumbent's own overreaction — a costly defensive restructuring aimed at a rival that barely exists — does more damage than the weaker competitor could ever have inflicted directly."
critical-questions:
  - "Does this tactic require a specific kind of target — one whose pride and threat-perception are already primed to overreact — or would it fail entirely against a tyrant capable of pausing to verify a perceived threat before acting on it?"
  - "Is there a meaningful difference between this move and ordinary manipulation, or does calling it strategy rather than deception just describe the same act from the winning side's perspective?"
status: active
