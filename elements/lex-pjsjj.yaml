id: lex-pjsjj
name: binary-cascade-outcomes-track-threshold-distribution-not-average-preference
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a population faces a binary choice with social-feedback (riot or stay, strike or work, adopt or wait, leave the party or stay), the aggregate outcome is determined by the FULL DISTRIBUTION of individual decision-thresholds — the count or proportion of others each actor needs to see acting before flipping — NOT by the average preference. Small, behaviorally-indistinguishable changes to the distribution (one missing threshold-1 actor, one too-large gap) flip cascades that would otherwise have completed, and produce aggregate outcomes (one lone window-breaker vs. unanimous riot) that look like radically different populations. The operational moves: (i) reason about who acts FIRST (low-threshold instigators with threshold-0); (ii) hunt for GAPS in the distribution where the chain breaks; (iii) refuse to back-infer individual dispositions from aggregate outcomes — the same population can produce opposite-looking events; (iv) when you want to tip a cascade, target the GAP, not the average."
related: [lex-spm8x, lex-hbgcb, lex-maq83, lex-mj7x2, lex-mwgep, lex-y93tk, lex-hbanm, lex-8vqvy, lex-d5eew, lex-wfuyn, lex-8tkms]
scaffolds-from: [lex-hbgcb, lex-d5eew, lex-spm8x]
evokes: [threshold-distribution, instigator-with-threshold-zero, bandwagon-effect, domino-effect, riot-dynamics, binary-collective-action, frequency-distribution-of-thresholds, equilibrium-outcome, hazardous-to-infer-individual-dispositions-from-aggregate, gap-in-the-distribution-stalls-the-cascade, schelling-segregation-adapted, granovetter-1978]
lineage:
  - source: primary
    text: granovetter-1978-threshold-models-of-collective-behavior
    citation: "Mark Granovetter, 'Threshold Models of Collective Behavior,' *American Journal of Sociology* 83(6):1420-1443 (May 1978). The canonical statement of the binary-threshold-cascade primitive. Granovetter adapts Schelling's residential-segregation threshold concept (Schelling 1971, 'Dynamic Models of Segregation,' *J. Math. Sociol.* 1:143-186) and generalizes it to a broad class of binary-decision cascades: riots, strikes, innovation adoption, rumor diffusion, voting, educational attainment, leaving social occasions, migration. A 'threshold' for actor i is the number or proportion of others Granovetter writes must already have made the focal choice before i's net benefit of joining exceeds i's net cost. The aggregate dynamic is fully determined by the frequency distribution f(x) of thresholds across the population: r(t+1) = F[r(t)], where F is the cumulative distribution function and r(t) is the proportion who have joined by time t. Equilibrium is the fixed point r* = F(r*). The foundational methodological-portable claim — and the lex-pjsjj transferable form — is that *small, behaviorally-indistinguishable changes in the threshold distribution produce large differences in aggregate outcome*, so aggregate behavior cannot be back-inferred to individual dispositions. The canonical 100-person example (pp. 1424-1425) makes this concrete: a uniform threshold distribution (one person at each integer 0..99) produces a complete cascade to 100 rioters via Granovetter's 'bandwagon' or 'domino' chain (threshold-0 instigator → threshold-1 joiner → threshold-2 joiner → ...); but removing the single threshold-1 actor and replacing with a threshold-2 — a perturbation invisible by 'usual ways of describing groups of people' — produces ONE rioter. The two crowds are almost identical in composition but the outcomes (unanimous riot vs. lone instigator) are opposite. Newspaper accounts of the two events would describe radically different populations ('a crowd of radicals' vs. 'a demented troublemaker') when the populations are nearly identical and the difference is structural: a gap in the frequency distribution. Granovetter's framework anticipates and structurally explains Salganik-Dodds-Watts 2006's experimental MusicLab finding (lex-hbanm social-influence-amplifies-both-inequality-and-unpredictability) — Salganik provides the experimental parallel-worlds-divergence demonstration of the threshold-distribution-determines-outcome principle Granovetter formalizes."
    quote: "[Granovetter 1978 pp. 1420-1421, abstract + opening claim:] 'Models of collective behavior are developed for situations where actors have two alternatives and the costs and/or benefits of each depend on how many other actors choose which alternative. The key concept is that of \"threshold\": the number or proportion of others who must make one decision before a given actor does so; this is the point where net benefits begin to exceed net costs for that particular actor. Beginning with a frequency distribution of thresholds, the models allow calculation of the ultimate or \"equilibrium\" number making each decision... Groups with similar average preferences may generate very different results; hence it is hazardous to infer individual dispositions from aggregate outcomes or to assume that behavior was directed by ultimately agreed-upon norms.' [The canonical 100-person worked example, pp. 1424-1425:] 'Imagine 100 people milling around in a square—a potential riot situation. Suppose their riot thresholds are distributed as follows: there is one individual with threshold 0, one with threshold 1, one with threshold 2, and so on up to the last individual with threshold 99. This is a uniform distribution of thresholds. The outcome is clear and could be described as a \"bandwagon\" or \"domino\" effect: the person with threshold 0, the \"instigator,\" engages in riot behavior—breaks a window, say. This activates the person with threshold 1; the activity of these two people then activates the person with threshold 2, and so on, until all 100 people have joined. The equilibrium is 100. Now perturb this distribution as follows. Remove the individual with threshold 1 and replace him by one with threshold 2. By all of our usual ways of describing groups of people, the two crowds are essentially identical. But the outcome in the second case is quite different—the instigator riots, but there is now no one with threshold 1, and so the riot ends at that point, with one rioter. Even this simple-minded example makes the main point suggested earlier: it is hazardous to infer individual dispositions from aggregate outcomes. Newspaper reports of the two events would surely be written as, in the first case, \"A crowd of radicals engaged in riotous behavior\"; in the second, \"A demented troublemaker broke a window while a group of solid citizens looked on.\" We know, however (since we constructed the example), that the two crowds are almost identical in composition; the difference in outcome results only from the process of aggregation, and in particular from the gap in the frequency distribution in the second case.' (Granovetter 1978, AJS 83(6):1420-1425). [The mathematical core, p. 1425:] 'Denote thresholds by x, the frequency distribution by f(x), and the cumulative distribution function (c.d.f.) by F(x)—where the c.d.f. indicates the proportion of the population having threshold less than or equal to x. Call the proportion of the population who have joined a riot by time t (using discrete time periods) r(t)... It must be, by definition of thresholds, exactly that proportion of the crowd whose thresholds are less than or equal to 60%. It follows immediately that the process is described by the difference equation: r(t + 1) = F[r(t)].'"
  - source: practitioner
    text: schelling-1971-dynamic-models-of-segregation-source-adapted-by-granovetter
    citation: "Thomas C. Schelling, 'Dynamic Models of Segregation,' *Journal of Mathematical Sociology* 1:143-186 (1971). Schelling's residential-segregation model is the source from which Granovetter explicitly adapts the threshold idea (Granovetter 1978 footnote 2, p. 1422): 'I have adapted the idea of behavioral thresholds from Schelling's models of residential segregation (1971a, 1971b, 1972), where thresholds are for leaving one's neighborhood, as a function of how many of one's own color also do so. The present paper has Schelling's aim of predicting equilibrium outcomes from distributions of thresholds but generalizes some features of the analysis and carries it in somewhat different directions.' Schelling's mechanism: each agent has a tolerance threshold for the fraction of dissimilar neighbors; once that threshold is exceeded, the agent moves. Aggregate result: a population where every agent prefers a mixed neighborhood (e.g., 50/50 tolerance) nonetheless segregates because *individual moves have nonlocal aggregate effects on neighbor mixes*. Schelling's segregation model and Granovetter's collective-action model share the structural primitive lex-pjsjj names: aggregate outcomes track the threshold-distribution, not the average preference. Pre-acquisition for the Schelling source itself; cited via Granovetter's footnote-2 attribution and the well-attested Schelling segregation tradition. (Schelling's 1960 *Strategy of Conflict* and 1978 *Micromotives and Macrobehavior* generalize the micromotive-macrobehavior gap into a fuller framework.)"
    quote: "[Granovetter 1978 footnote 2, p. 1422, citing Schelling as the source of the threshold idea:] 'I have adapted the idea of behavioral thresholds from Schelling's models of residential segregation (1971a, 1971b, 1972), where thresholds are for leaving one's neighborhood, as a function of how many of one's own color also do so. The present paper has Schelling's aim of predicting equilibrium outcomes from distributions of thresholds but generalizes some features of the analysis and carries it in somewhat different directions.'"
canonical-instances:
  - "operationally distinct from lex-spm8x feedback-loop-as-mechanism: feedback is the generic primitive; lex-pjsjj specializes to binary cascades with population-distributed thresholds and adds the specific claim that distribution-shape, not average, determines outcome. Feedback is necessary but not sufficient for lex-pjsjj."
  - "operationally distinct from and composing-with lex-hbgcb social-proof-as-action-signal (Cialdini): lex-hbgcb is the individual-level primitive — others' choices are an action signal one actor uses to decide. lex-pjsjj is the population-level primitive — when individuals with diverse thresholds use this signal, the aggregate cascade outcome is determined by the full distribution of those thresholds, not their average. lex-hbgcb is the micro-mechanism; lex-pjsjj is the macro-result."
  - "operationally distinct from lex-mj7x2 noise-as-signal-amplifier-in-nonlinear-systems (stochastic resonance): SR is noise enabling sub-threshold signal detection in a single-actor nonlinear system. lex-pjsjj is a population-level cascade where the distribution of single-actor thresholds determines the aggregate outcome — different mechanism, different unit of analysis."
  - "operationally distinct from lex-y93tk self-organized-criticality (Bak-Tang-Wiesenfeld 1988): SOC produces continuous scale-free cascades from a critical attractor. lex-pjsjj produces a small number of binary cascades (tip-or-stall) per realization, with the outcome determined by the specific threshold distribution. Different geometries, both forms of 'aggregate outcome is not the trivial aggregate of preferences.'"
  - "The 100-person riot example (Granovetter 1978 pp. 1424-1425): two threshold distributions virtually identical in composition (uniform 0..99 vs. uniform 0..99 with the threshold-1 replaced by threshold-2) produce opposite aggregate outcomes — unanimous 100-rioter cascade vs. lone instigator. The newspapers would describe the first as 'a crowd of radicals' and the second as 'a demented troublemaker among solid citizens.' The populations are almost identical; the difference is one gap in the threshold distribution. Verbatim Granovetter quote above carries the canonical statement. This is the indispensable illustration of 'hazardous-to-infer-individual-dispositions-from-aggregate-outcomes.'"
  - "Residential segregation (Schelling 1971, adapted by Granovetter): a population where every household prefers a mixed neighborhood (50/50 tolerance threshold) nonetheless segregates because individual moves shift neighbor-mixes for others, crossing their thresholds in turn. Schelling demonstrated this with checkerboard simulations; modern agent-based models reproduce the finding robustly. The structural primitive: aggregate segregation is determined by the *distribution* of tolerance thresholds across the population — a small shift in the distribution toward less tolerance can flip the equilibrium from mixed to segregated even though average tolerance changed minimally."
  - "Strike/non-strike decisions in collective labor action (Granovetter §1.3): each worker's threshold is the proportion of co-workers already committed to strike before this worker's expected gain from striking exceeds the expected cost (lost wages, retaliation). Workers with low thresholds (committed activists, those with the most to gain) are the threshold-0 'instigators'; workers with high thresholds (those with the most to lose, those who distrust the strike) effectively never join. The strike completes or stalls based on the gap-structure of the threshold distribution; if the threshold-distribution has a critical mass at the low end and no gaps until reaching mid-threshold workers, the strike cascades to completion. If there's a gap at threshold-2 or threshold-3, the strike stalls at very-few-strikers and reads as 'workers don't really want a strike' — the misreading lex-pjsjj names."
  - "Innovation/technology adoption (Granovetter §1.2; subsequent diffusion-of-innovations literature, Rogers 1962/2003): adoption thresholds vary across the population (innovators at threshold-0, early adopters at very-low-threshold, early majority at moderate-threshold, late majority at high-threshold, laggards at threshold-near-100%). Adoption cascades complete or stall based on the threshold-distribution shape. Network effects (lex-spm8x) and social-proof (lex-hbgcb) are the micro-mechanisms; the macro-pattern is what lex-pjsjj names."
  - "Cultural-market dynamics and parallel-worlds-divergence (Salganik-Dodds-Watts 2006, lex-hbanm): Granovetter's threshold-distribution primitive is the underlying-mechanism Salganik's MusicLab experiment empirically refuted average-preference-prediction in. Within each of Salganik's 8 parallel social-influence worlds, the threshold-distribution is essentially the same (drawn from the same participant population), but stochastic early-engagement amplifies different songs across worlds — because the cascade depends on WHICH actor's threshold is crossed FIRST, not on the average threshold. Granovetter is upstream substrate; Salganik is downstream experimental confirmation in one domain."
  - "Voting and bandwagon effects (Granovetter §1.4, p. 1424): voters' decisions to vote at all, and which way to vote, depend on perceived vote share of others — partly because no one wants to 'waste' a vote on a candidate seen as having no chance. Threshold-distributions across the electorate determine whether a bandwagon forms or stalls. Polls and early returns are the social signal; the polling-induced threshold-flip is a structural feature, not a bias."
  - "Leaving a social occasion (Granovetter §1.6, p. 1424): sitting impatiently at a boring lecture or party, no one leaves first because most actors have moderate-or-high thresholds (politeness, social-cost of conspicuous departure). The threshold-0 instigator triggers the cascade; absent that instigator, an entire room of bored attendees sits through the talk to the bitter end. Folk attestation of the threshold-distribution primitive that anyone has experienced."
  - "Migration and chain migration (Granovetter §1.7, p. 1424, citing MacDonald and MacDonald 1964): migration decisions depend heavily on those of others. Those with low migration thresholds (the most adventurous, the most pressed economically) migrate first; subsequent migrants follow once a threshold-proportion of their network has already gone. Chain migration is the threshold-distribution cascade in the migration domain."
  - "operationally distinct from lex-maq83 threshold-crossing-into-liminal-space: lex-maq83's 'threshold' is the marked spatial/temporal boundary into a new rule-regime (van Gennep's marge phase); lex-pjsjj's 'threshold' is the count-or-proportion decision rule for binary cascades. Same English word, structurally orthogonal mechanisms. Both crucial in different domains; substrate carries both."
  - "operationally distinct from and composing-with lex-hbanm social-influence-amplifies-both-inequality-and-unpredictability-of-cultural-market-success: lex-pjsjj is the general formal primitive (threshold-distribution → cascade-outcome) Granovetter formalized in 1978; lex-hbanm is the experimental parallel-worlds-divergence demonstration Salganik-Dodds-Watts 2006 produced in one domain (cultural markets). Compose: lex-pjsjj is the underlying mechanism; lex-hbanm is the experimental refutation of average-preference-prediction the mechanism implies."
  - "operationally distinct from and composing-with lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories: lex-pjsjj's cascade-completion is the entry condition for lex-mwgep's lock-in. lex-pjsjj says what determines whether the cascade reaches lock-in; lex-mwgep says what happens once it does."
critical-questions:
  - "what's the SHAPE of the threshold distribution in your population — not just the mean? The cardinal diagnostic. Cascades hinge on gaps and on the density at the LOW end of the distribution. If you only know the mean, you cannot predict whether the cascade tips or stalls. Methodologically: collect threshold data (survey 'how many others would have to do X before you would?'), build the cumulative distribution F(x), check for gaps where F(x) < x (cascade-completion requires F(x) ≥ x at every x up to the equilibrium). Practitioner-discipline: refuse the 'most people agree, so most people will act' inference; the distribution-shape is what matters."
  - "who is the threshold-0 instigator (or near-zero) and is there a threshold-1 (or near-1) actor in the population? Without a threshold-0 instigator (or near-zero — someone whose net benefit of acting exceeds net cost regardless of others), the cascade never starts. Without a threshold-near-zero actor immediately above, the cascade stalls at the instigator alone — the lone-window-breaker Granovetter's example. Diagnostic: scan the lowest end of the threshold distribution; if it's empty or has gaps, the cascade is structurally blocked even if average preference favors action."
  - "where are the GAPS in the threshold distribution — and how big are they? A gap of size k means the cumulative-fraction-acted must increase by k/N at one cascade-step for the next-up actor to join. The cascade traverses gaps when the prior step crossed enough actors to fill the gap; it stalls otherwise. Operationally: plot F(x) against x. Wherever F(x) < x, the cascade stalls at the largest such x. Wherever F(x) ≥ x, the cascade continues. The equilibrium r* is the smallest fixed point of F."
  - "could a small intervention REMOVE or NARROW a gap and tip the cascade? lex-pjsjj's actionable lever: don't try to shift the average; target the gap. Recruit one extra low-threshold instigator; provide a public-commitment device that lets near-threshold actors precommit; reduce the perceived cost (or increase perceived benefit) for the actor at the gap. Mirrors lex-hbanm's policy-lever insight (the social-signal salience, not the items themselves) — both atoms point at structural levers, not preference change."
  - "is the binary-choice assumption realistic? lex-pjsjj strictly applies to binary choices with social-feedback costs/benefits. Multi-choice generalizations exist (Granovetter §3 hints at them; subsequent literature elaborates) but the cleanest predictions require binary cast (riot/stay, strike/work, adopt/abstain). For multi-choice cases, threshold-distribution per choice generalizes; cascade-dynamics get more complex."
  - "is the threshold-distribution stable, or does it shift WITHIN the cascade as actors update? Granovetter's basic model treats thresholds as fixed at the cascade's start. If thresholds shift during the cascade (e.g., actors becoming more committed as they see others act, or actors raising thresholds as they see crackdown costs), the dynamics get richer and the simple F[r(t)] equation no longer applies. Diagnostic: is there a within-cascade preference-updating mechanism? If yes, model accordingly."
  - "be hazardous-to-infer-individual-dispositions: when you observe an aggregate outcome (a riot did or didn't happen, a strike succeeded or stalled, a fad caught on or didn't), refuse the temptation to read individual dispositions back from the aggregate. The same population can produce opposite-looking aggregate events depending only on threshold-distribution shape. The lex-pjsjj practitioner-discipline is to treat aggregate outcomes as joint products of (preferences, distribution-shape, who-acts-first), not as evidence about average preference."
status: active
