id: lex-yyhjr
name: coming-to-terms-fixes-an-authors-words-to-single-senses
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when reading, editing, or arguing with a text and about to extract or evaluate a claim built on a word that matters — a technical term, a loaded word, a word doing real argumentative work. Adler and Van Doren's distinction: a WORD is not a TERM. A word is an ambiguous unit of vocabulary that can carry several distinct meanings; a term is a word FIXED to exactly one of those meanings for the duration of a given use. Two people can exchange every word in a sentence and still fail to communicate if they are silently using a shared word as different terms — 'words have passed between them, but they have not come to terms.' The operational move, 'coming to terms with an author': (1) identify the small set of words doing the author's real analytical work — their special or technical vocabulary, which in an established field may already have fixed technical meanings (Euclid, or any field with settled terminology) but in less settled fields must be located by noticing which words the author seems to be using in an unusual, load-bearing, or repeatedly-returned-to way; (2) for each such word, determine whether the author uses it in one sense throughout or shifts sense across the text (the same word standing for several different terms in different passages) — both are legitimate, but the reader must track which is happening where; (3) do not proceed to extract or evaluate the author's propositions until this fixing is done, because a proposition built on an unfixed word is not yet interpretable, let alone arguable. This precedes and enables lex-7b3w5 (understanding-precedes-disagreement): agreement about what a word means, in this specific use, is the precondition for any REAL agreement or disagreement about the facts the author is asserting with it — disagreement over an unfixed word is not disagreement about the world, it is unresolved ambiguity mistaken for a substantive dispute."
related: [lex-zeznb, lex-cqvnu, lex-bwghp, lex-7b3w5]
evokes: [word-versus-term, an-authors-special-vocabulary, fixing-a-word-to-one-sense, unresolved-ambiguity-mistaken-for-disagreement]
lineage:
  - source: primary
    text: adler-vandoren-1972-how-to-read-a-book
    citation: "Mortimer J. Adler and Charles Van Doren, How to Read a Book: The Classic Guide to Intelligent Reading, revised edition (Simon & Schuster, 1972), Ch.8 'Coming to Terms with an Author.'"
    quote: "A term is not a word — at least, not just a word without further qualifications. If a term and a word were exactly the same, you would only have to find the important words in a book in order to come to terms with it. But a word can have many meanings, especially an important word. If the author uses a word in one meaning, and the reader reads it in another... words have passed between them, but they have not come to terms. Where there is unresolved ambiguity in communication, there is no communication, or at best communication must be incomplete... A term can be defined as an unambiguous word... a term is a word used unambiguously... When writer and reader somehow manage for a time to use a given word with one and only one meaning, then, during that time of unambiguous usage, they have come to terms... Every field of knowledge has its own technical vocabulary... The relatively small set of words that express an author's main ideas, his leading concepts, constitutes his special vocabulary... For the communication to be successfully completed, therefore, it is necessary for the two parties to use the same words with the same meanings — in short, to come to terms. (Adler and Van Doren, How to Read a Book, 1972 rev. ed.)"
canonical-instances:
  - "operationally distinct from lex-cqvnu name-to-referent-correspondence-precedes-effective-coordinated-action: lex-cqvnu is about NAMES tracking REALITY correctly as a precondition for coordinated ACTION across a group (a correspondence-to-the-world claim, Confucius's rectification of names); this atom is about a READER correctly identifying which SENSE an individual AUTHOR is using a word in, as a precondition for correctly extracting and evaluating that author's claims (a correspondence-between-two-minds-about-word-use claim, independent of whether the word tracks reality well or badly). They compose — a name can fail lex-cqvnu's reality-tracking test and still be internally consistent enough to satisfy this atom's single-sense-fixing test — but answer different questions."
  - "Philosophy seminar: two students are arguing about whether 'freedom' as Kant uses it in a given passage means the same thing as 'freedom' as a modern political-science paper uses it. Before the disagreement can be evaluated as real or illusory, both terms must be fixed to their specific senses (autonomy-as-self-legislation versus absence-of-external-constraint) — once fixed, the apparent disagreement may dissolve (they were using different terms) or sharpen into a genuine one (they meant the same term and still disagree about the claim)."
  - "Contract or statute interpretation: a legal dispute turns on what a term like 'material breach' or 'reasonable efforts' means in a specific contract's specific clause, as opposed to its meaning in a different contract or in ordinary speech — a lawyer who treats the word as carrying its everyday sense rather than the fixed, often technical, sense established by the document's own definitions section or prior case law will misread the obligation the clause actually creates."
  - "Cross-team engineering discussion: two teams disagree about whether a system is 'available,' but one team's SLA defines availability as successful-response-rate over a rolling window and the other team means the process is running at all. The apparent architectural disagreement is actually two different terms sharing one word; the real technical question cannot be debated productively until each team names which term it means."
critical-questions:
  - "Isn't insisting on single fixed senses too rigid for authors who deliberately use a word with shifting or layered meaning (as in poetry, or intentionally polysemous philosophical writing)? Adler and Van Doren allow for this explicitly: an author may use one word for several distinct terms across a text (shifting sense) or use several different words for the same term (synonymous substitution) — the discipline is not to force one meaning throughout, but to TRACK, for each instance, which sense is in play, so that shifts are noticed rather than silently smoothed over or silently treated as inconsistency."
  - "How do you locate an author's special vocabulary in a field with no established technical terms? Locate it negatively as well as positively: words the author returns to repeatedly, words that carry unusual argumentative weight, words the author seems to be straining ordinary usage to make do a more specific job — these are candidates for special-vocabulary status even without a settled field-wide glossary to check against."
  - "What's the actual cost of skipping this step? Not merely imprecision — Adler and Van Doren's stronger claim is that agreement or disagreement asserted before words are fixed to shared senses is not really agreement or disagreement about the world at all, just an accident of matching or mismatching vocabulary; real controversy (lex-7b3w5) cannot even begin until this step is done."
severity-tier: warning
status: active
