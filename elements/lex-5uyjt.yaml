id: lex-5uyjt
name: the-survivor-who-stays-visible-inherits-credit-for-shared-work
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Two people built the Appalachian Trail. Benton MacKaye proposed it in 1921 and spent the next decade elaborating an ambitious, largely unworkable utopian vision around it -- mountaintop work camps, cooperative villages, a retreat from profit -- while almost none of it got built. Myron Avery took over in 1930, stripped the vision down to a route hikers could actually walk, and did the grinding organizational work himself: he mapped the trail, recruited and bullied volunteer crews, extended the planned length from 1,200 to over 2,000 miles, personally walked every inch of it, and finished construction in under seven years. Bryson's verdict on who gets remembered: 'MacKaye always gets the credit for the trail, but this is largely because he lived to be ninety-six and had a good head of white hair; he was always available in his later years to say a few words at ceremonies on sunny hillsides. Avery, on the other hand, died in 1952, a quarter-century before MacKaye and when the trail was still little known. But it was really Avery's trail.' Popular credit for a shared achievement doesn't get assigned by tallying who did the decisive work; it gets assigned at the moments credit actually gets handed out -- anniversaries, retrospectives, obituaries, interviews -- and only whoever is alive and reachable at those moments can be there to receive it. Avery's death decades before the trail's fame meant every later ceremony had only one name available to honor, regardless of whose labor the trail actually was. The transferable move: when investigating how credit for a joint achievement got distributed, add each contributor's availability at the specific moments credit was actually assigned to the usual list of candidate explanations (self-promotion, social capital, who talked to the press). Outliving your collaborator, or simply staying reachable while they moved on or dropped out of view, can produce the same lopsided outcome as any of those, with neither party doing anything deliberate to earn or deny it."
