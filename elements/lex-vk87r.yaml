id: lex-vk87r
name: strategic-silence-protects-the-messenger-after-a-fatal-precedent
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "After witnessing someone else be destroyed for delivering an unwelcome truth to the same person who now asks you the identical question, declining to answer honestly can be the only way to survive being asked, even though the silence itself may look like evasion or complicity. In the Jataka's tale of the two watchful parrots, the younger brother confronts their guardian's unfaithful wife directly and is killed for it. When the returning husband asks the elder brother the same question, he refuses to answer: 'the wise speak not of things which do not conduce to blessing, whether they have happened or not.' ...'It is not well the truth to tell, lest Potthapada's fate I share.' The elder isn't protecting the wife or denying wrongdoing — he's naming the one piece of evidence that makes honesty in this specific case a documented lethal outcome rather than an abstract risk."
related: []
evokes: [jataka, dukanipata, radha-jataka, a-witnessed-precedent-justifies-strategic-silence, refusing-to-answer-is-not-endorsement]
lineage:
  - source: primary
    text: jataka-chalmers1895-radha-jataka-198
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book II (Dukanipata), No. 198 (untitled in this translation; the parrot Radha is the Bodhisatta). Verified verbatim against a direct extraction of the held copy."
    quote: "the wise speak not of things which do not conduce to blessing, whether they have happened or not... It is not well the truth to tell, lest Potthapada's fate I share."
canonical-instances:
  - "After watching a colleague get quietly pushed out for flagging a manager's ethical shortcut, a new hire who's asked point-blank by the same manager whether they see anything wrong with the process gives a noncommittal answer instead of the honest one, having already seen exactly what honesty costs there."
critical-questions:
  - "Does this posture generalize past the one specific person who proved dangerous, or does it risk becoming a permanent policy of silence toward anyone who might react badly, well past the point the original precedent actually justifies?"
  - "Is there a real difference between the elder parrot's silence and complicity in the ongoing wrongdoing, given that his refusal to speak also means the husband never learns what's happening in his own household?"
