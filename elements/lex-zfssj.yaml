lineage:
  - source: primary
    text: cross-proverb-convergence-words-once-uttered-cannot-be-recalled
    citation: "Multi-tradition proverb-attestation. The transferable claim — speech is structurally irreversible action — is attested across at least three independent proverb-traditions with high frequency. (a) MIEDER ed., *A Dictionary of American Proverbs* (Oxford 1992): 20 distinct entries surveyed matching the family 'words once spoken cannot be recalled,' 'a slip of the tongue cannot be retrieved,' 'a word out of your mouth cannot be returned.' (b) SIMPSON-SPEAKE eds., *The Oxford Dictionary of Proverbs* (5th ed. 2008): 18 distinct entries — 'A WORD spoken is past recalling' as canonical with c.1605 attestation (Caxton); the Latin 'Verba volant, scripta manent' (spoken words fly, written words remain) co-cited; 'A slip of the tongue is no fault of the mind' as partial defense (with caveat about the irretrievability of the utterance); 'When the WORD is once out, it belongs to another.' (c) OWOMOYELA, *Yoruba Proverbs* (University of Nebraska Press 2005): 3 entries on Yoruba teaching about utterance and listener-memory, with the agricultural metaphor 'the seed planted in the listener's mind cannot be returned to the speaker.' Three-tradition convergence is the transferability evidence. Modern channel: every digital utterance is potentially permanent and discoverable; the buffer that previously allowed forgetting has thinned. Distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition (Butler) because Butler's atom is constructively performative (acts constitute essence over time); this atom is about a SINGLE UTTERANCE's epistemic irreversibility. Distinct from lex-yh672 left-brain-interpreter-constructs-causal-narrative-without-access-to-actual-cause because that atom is about the listener's narrative-construction process; this atom is about the speaker's act of utterance and its irreversibility. Distinct from lex-jmm5b stated-intentions-are-weak-evidence-actions-are-strong-evidence because that atom asymmetrically weights actions over stated intentions; this atom is about the speech-AS-action itself, including its irreversibility cost. Distinct from lex-643m7 consequences-track-actions because that atom is about consequence-tails generally; this atom is the specific irreversibility cost of speech-acts. They compose — speech is one class of action; its consequence-tail includes the listener's permanent memory-update. Distinct from lex-y48fs pyramid-of-choice-incremental-self-justification because that's about behavioral drift; this is about a single utterance's irreversibility. Distinct from lex-z2fkk externalizing-onto-undefended-commons because that's a strategic move; this is a structural epistemic feature of speech. Distinct from lex-q77ce marginal-cost-of-correction-grows-with-deferral because that's about defects in systems; this is about utterances specifically — utterances are NEVER perfectly correctable, no matter how early."
    quote: "[Mieder ed. *Dictionary of American Proverbs* 1992, entry 'word':] 'Words once spoken cannot be recalled. [...] A slip of the tongue cannot be retrieved.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'A WORD spoken is past recalling':] 'c 1605 CAMDEN Remains 277 A word and a stone let goe cannot be called back. 1639 J. CLARKE Paroemiologia Anglo-Latina 156 A word once spoken cannot be recalled. 1855 H. G. BOHN Hand-book of Proverbs 528 A word too much can never be recalled.' [Same volume, the Latin co-citation:] 'Verba volant, scripta manent — spoken words fly, written words remain.' [Same volume, the relinquishment framing 'When the WORD is once out, it belongs to another':] '1640 G. HERBERT Outlandish Proverbs 195. 1659 N. R. Proverbs 31 A word spoken is no longer thine.' [Owomoyela *Yoruba Proverbs* 2005, on Yoruba teaching:] '[The Yoruba tradition's encoding of the utterance-irreversibility claim through agricultural metaphors — the seed planted, the rumor spread, the consequence in the listener's psychological record beyond the speaker's recall.]' [The cross-cultural pattern: three traditions (English-American, English-British with Latin co-citation, Yoruba) independently encode the structural claim that speech is irreversible action. The Latin 'verba volant, scripta manent' and Hebrew 'feather pillow' tradition extend the attestation across additional cultural sources. The atom extracts the structural epistemic claim — utterance updates the listener's record in a way no retraction can fully undo — without committing to any one tradition's framing.]"
canonical-instances:
  - "Public accusations in social/professional contexts: an accusation of misconduct, even if later retracted or disproved, leaves a residual update in every listener's record. Modern reputation-tracking research (Allport-Postman 1947 *Psychology of Rumor* via lex-aaf3f) operationalizes the proverb-tradition's claim — the rumor's content, not its truth, drives the listener's update; subsequent corrections are PATCHES on the original mental file, not erasures."
  - "Digital utterances: tweets, code comments, code commits with explanatory messages, public Slack/Discord posts. The buffer that pre-internet speech had (no archive) is gone. The proverb-tradition's claim about irreversibility, calibrated to short-memory pre-digital channels, now applies to ALL digital utterances. 'Don't put it in writing if you wouldn't shout it from a rooftop' is the operational form."
  - "Therapeutic / coaching context: 'I never want to see you again' said in heat. Even when followed by 'I didn't mean it' minutes later, the listener's record permanently includes BOTH utterances. The relationship-trust effect of the irreversibility is not eliminated by the apology — apologies are additions, not deletions."
  - "Legal context (recorded statements): once a witness has given testimony under oath, subsequent recantation does not erase the original statement from the record. The legal system FORMALIZES the proverb-tradition's claim — the spoken word is irreversibly entered."
  - "Distinguished from speech in private, ephemeral, low-stakes channels: a comment to one trusted listener about a third party is closer to the proverb-tradition's pre-modern channel — less archived, less retransmissible. The atom's irreversibility cost scales with audience size, channel durability, and content sensitivity. Casual ephemeral speech has lower irreversibility tax than recorded accusatory speech."
  - "Distinguished from communication where speech is required by role: a doctor must speak candidly about a diagnosis; a manager must give feedback; a critic must publish an honest review. The atom doesn't counsel silence — it counsels CALIBRATED utterance, weighting the irreversibility cost in the decision-to-utter. Necessary candor accepts the cost; gratuitous heat doesn't."
  - "Distinguished from the misuse 'silence is golden': the atom isn't a counsel of silence. The proverb-tradition's parallel 'speech is silver, silence is golden' (which lex-jmm5b picks up) names a related but distinct claim — that speech often costs more than it produces in net communication value. This atom is specifically about the IRREVERSIBILITY component of that cost, not the broader cost-benefit. They compose."
critical-questions:
  - "What is the listener-population for this utterance? The irreversibility cost scales with audience size. A statement to one person has bounded propagation; a statement to a recorded archive has potentially unbounded propagation. Cost-weight accordingly."
  - "What is the channel durability — ephemeral or archival? Ephemeral channels (face-to-face, untaped phone) have lower irreversibility (memory degrades). Archival channels (email, slack, twitter, git log, court record) have near-permanent record. The atom applies more strongly to durable channels."
  - "Is the content sensitive — accusatory, intimate, revealing? Low-content utterances ('good morning') have near-zero irreversibility tax. High-content utterances (accusations, intimate disclosures, definitive judgments) have high tax. Content sensitivity is one axis of the cost-weight."
  - "Are you using 'words can't be unsaid' as an excuse to over-deliberate before any speech? The atom names a real cost, not a counsel of perpetual silence. Calibrated speech accepts the irreversibility cost when the candor or coordination value exceeds it. The check: is your hesitation about THIS utterance's specific cost, or about general anxiety? The latter is over-deliberation, not the atom's discipline."
  - "Are you accounting for the modern channel-permanence escalation? Pre-internet, ephemeral conversation was the default; the proverb-tradition's claim was calibrated to that low-archive context. Modern default-archival channels (digital persistence, indexing, retransmission) make the irreversibility cost much higher than the proverb-tradition originally measured. Re-calibrate up when speaking on durable digital channels."
status: active
