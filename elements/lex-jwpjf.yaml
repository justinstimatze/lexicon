id: lex-jwpjf
name: hedge-words-let-a-forecaster-claim-either-outcome-after-the-fact
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone frames a prediction in hedge-words instead of a number — 'may,' 'could,' 'might' — notice that the vagueness is doing real work whether or not it's deliberate: it lets the same forecast be claimed as correct no matter what happens. Tetlock, Mellers, and Scoblic name the mechanism directly: 'holding partisans accountable for their forecasts is virtually impossible because they frame them in vague verbiage: Raising interest rates 'may' trigger a recession; providing military assistance to Ukraine 'could' provoke a sharp Russian response; or environmental legislation 'might' increase energy prices. When readers are asked to translate the words in quotation marks into probability judgments, the answers straddle both sides of 'maybe,' taking' ... 'on meanings as low as a 0.08 chance of occurrence to some, and as high as 0.59 to others.' ... 'If the outcome does occur, the prognosticator can say, 'I warned you that it was a distinct possibility,' and if it does not, he can shrug and say, 'I merely said it was possible.' Vagueness thus precludes accountability, which in turn impedes our ability to learn and to improve the accuracy of our forecasts.' A number closes this off: a stated 70% either happened roughly 70% of the time across many such calls or it didn't, and either way there is something concrete to score against. Before accepting a hedge-worded prediction, ask for the number it's standing in for — not because the hedge is dishonest, but because as long as it stays a hedge, nobody, including the forecaster, can ever find out whether it was right."
related: [lex-vmas8]
evokes: [tetlock-mellers-scoblic-2017, vague-verbiage-forecasting, mosteller-youtz-1990-maybe-survey, brier-score-accountability, i-merely-said-it-was-possible]
lineage:
  - source: primary
    text: tetlock-mellers-scoblic-2017-vague-verbiage-precludes-accountability
    citation: "Philip E. Tetlock, Barbara A. Mellers, and J. Peter Scoblic, 'Bringing Probability Judgments into Policy Debates via Forecasting Tournaments,' Science 355, no. 6324 (3 February 2017): 481-483, at p. 481."
    quote: "'holding partisans accountable for their forecasts is virtually impossible because they frame them in vague verbiage: Raising interest rates 'may' trigger a recession; providing military assistance to Ukraine 'could' provoke a sharp Russian response; or environmental legislation 'might' increase energy prices. When readers are asked to translate the words in quotation marks into probability judgments, the answers straddle both sides of 'maybe,' taking' ... 'on meanings as low as a 0.08 chance of occurrence to some, and as high as 0.59 to others.' ... 'If the outcome does occur, the prognosticator can say, 'I warned you that it was a distinct possibility,' and if it does not, he can shrug and say, 'I merely said it was possible.' Vagueness thus precludes accountability, which in turn impedes our ability to learn and to improve the accuracy of our forecasts.'"
canonical-instances:
  - "The paper's own cited finding (Mosteller & Youtz 1990): when survey respondents were asked what probability the word 'maybe' implies, answers spanned from 8% to 59% — one hedge-word covering most of the usable probability range. Someone who says 'maybe' isn't choosing a probability; they're avoiding choosing one."
  - "Hypothetical: a corporate memo warns a product launch 'could' slip past the holiday season. It ships on time — the memo's author takes credit for the accurate heads-up. It slips by six weeks — the same memo gets cited as the warning nobody heeded. The memo was compatible with both outcomes before either one happened."
  - "Hypothetical: a doctor tells a patient a treatment 'might' cause side effects. Whether or not it does, the doctor's statement holds up — no version of what happens contradicts it, which means there is no way to track this doctor's calibration across years of patients from phrasing like this alone, however many times it gets used."
critical-questions:
  - "Does converting a hedge into a number actually fix the problem, or does it just relocate the vagueness — from word-choice to the interpretation of what counts as 'right' when a 70% prediction fails 30% of the time? A single number, on its own, still can't be judged without a track record across many forecasts."
  - "Some domains genuinely can't support a stated numeric probability with any real basis — Tetlock's own tournament data comes from thousands of scored forecasts, while a single one-off geopolitical call has no comparable base to draw on. Does the accountability argument for numbers hold up when there's no realistic way to build the track record a Brier score requires?"
  - "Is vague-verbiage always chosen strategically to preserve deniability, or is it sometimes just the natural way people think about uncertainty, carrying a real cost — unaccountability — that isn't actually the speaker's intent?"
