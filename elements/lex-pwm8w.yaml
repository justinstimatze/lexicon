id: lex-pwm8w
name: front-loading-what-a-process-meters-out-makes-it-overshoot
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a downstream process is built to precisely control uptake of some quantity toward a target, check whether a preparatory step supplies that same quantity in advance, outside the controlled process -- because doing so defeats the metering and drives the outcome past the target, even though the preparatory step looks like helpful prep rather than interference. America's Test Kitchen's rice experiment is the clean case: rice is cooked with a carefully measured amount of water in a covered pot specifically so the grain absorbs exactly enough as it heats. Soaking the rice beforehand looks like reasonable prep -- it seems like it should help the grain cook faster and more evenly -- but it pre-loads water into the grain before the heat-gated uptake process even starts, so by the time heat is applied the starch granules are already swollen and primed to take on more, and the rice overcooks and blows out. The failure isn't a dosage error inside the preparatory step; it's that the preparatory step and the controlled process are drawing on the identical resource, so anything added ahead of time counts against the metered budget whether or not it was labeled as belonging to a separate stage."
