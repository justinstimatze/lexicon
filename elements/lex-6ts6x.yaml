id: lex-6ts6x
name: engineered-enemy-encirclement-forces-your-own-allies-commitment
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When your own faction is wavering toward retreat from a course of action you believe is necessary, and neither direct persuasion nor coercion of your own side is working, consider whether you can accomplish the commitment indirectly — by giving an adversary true information engineered to provoke a reaction that seals off your own side's exit, so your allies discover the retreat option is already gone rather than being argued or forced out of it. Themistocles's stratagem before Salamis is the canonical case. With the Greek commanders wavering and preparing to slip home through the straits rather than fight the larger Persian fleet, Themistocles could not persuade them to stay by argument alone. He secretly sent his servant Sicinnus to Xerxes with a true report of Greek weakness and intent to flee, framed as a favor: Sicinnus was to tell the king 'that the Greeks were ready to make their escape, and that he counseled him to hinder their flight, to set upon them while they were in this confusion.' Xerxes, delighted, immediately 'issued instructions to the commanders of his ships, that they should instantly... encompass all the islands, and enclose all the straits and passages, that none of the Greeks might escape.' Only once this was discovered — Aristides confirmed it from the outside, and a deserting galley from Tenos corroborated it — did the wavering Greek commanders abandon the debate: 'their rage and fury, as well as their necessity, provoked them all to fight.' Themistocles never won the argument with his own allies; he made the argument moot by ensuring, through the enemy's own rational response to true information, that there was nothing left to argue about. The structural signature: the actor cannot directly move their own faction; they alter a third party's (adversarial) behavior using accurate information, engineered so that the third party's entirely rational reaction forecloses the friendly faction's exit; the friendly faction then commits, believing the trap arose from circumstance rather than from their own leader's design. This differs from ordinary deception of an enemy, since nothing false is told to the enemy at all — the manipulation targets who receives true information and for what downstream effect on one's own side, not the content of what the enemy is told."
related: [lex-rfcb7, lex-2bbqf, lex-9pubz]
scaffolds-from: [lex-9pubz]
evokes: [sicinnus-stratagem, battle-of-salamis, xerxes-encirclement-order, themistocles-secret-message-to-xerxes, forcing-your-own-sides-hand-through-the-enemy, true-information-weaponized-against-your-own-faction]
lineage:
  - source: primary
    text: plutarch-c100-life-of-themistocles-sicinnus-stratagem
    citation: "Plutarch, Life of Themistocles, in Plutarch's Lives (c. 100 CE; Greek; John Dryden's 1683 translation as revised by Arthur Hugh Clough, 1859). Public domain. The episode occurs on the eve of the battle of Salamis, 480 BCE, when the Greek fleet's commanders — Eurybiades of Sparta chief among them — were preparing to withdraw toward the Isthmus of Corinth rather than risk battle in the straits."
    quote: "Themistocles, in great distress that the Greeks should retire, and lose the advantage of the narrow seas and strait passage, and slip home every one to his own city, considered with himself, and contrived that stratagem that was carried out by Sicinnus. This Sicinnus was a Persian captive, but a great lover of Themistocles, and the attendant of his children. Upon this occasion, he sent him privately to Xerxes, commanding him to tell the king, that Themistocles, the admiral of the Athenians, having espoused his interest, wished to be the first to inform him that the Greeks were ready to make their escape, and that he counseled him to hinder their flight, to set upon them while they were in this confusion and at a distance from their land army, and hereby destroy all their forces by sea. Xerxes was very joyful at this message... and immediately issued instructions to the commanders of his ships, that they should instantly [set] out with two hundred galleys to encompass all the islands, and enclose all the straits and passages, that none of the Greeks might escape... Themistocles, knowing the generosity of Aristides, and much struck by his visit at that time, imparted to him all that he had transacted by Sicinnus... a galley of Tenos, which deserted from the Persians... confirmed the news that all the straits and passages were beset; and then their rage and fury, as well as their necessity, provoked them all to fight."
canonical-instances:
  - "the Sicinnus stratagem itself: Themistocles cannot persuade Eurybiades and the wavering Greek commanders to stay and fight, so he arranges — via true information passed to Xerxes — for the enemy to seal off the retreat, making the decision for them."
  - "a boardroom instance: a founder facing a board eager to accept a low acquisition offer leaks accurate information about the company's weak negotiating position to a hostile bidder, provoking an aggressive takeover move that forecloses the quiet-sale option the board preferred, leaving only the harder fight the founder wanted."
  - "a labor-organizing instance: an organizer ensures management accurately learns that the workforce is wavering and close to abandoning a strike, provoking a punitive management overreach that then unifies the wavering workers because management's public hardline response has foreclosed their preferred quiet return to work."
critical-questions:
  - "how does this differ from lex-rfcb7 (credibility-comes-from-visibly-foreclosed-options-not-from-stated-intent, Schelling's commitment device)? lex-rfcb7's mechanism is INTERNAL and self-directed: the actor visibly forecloses their OWN future options (burning their own bridges) to make their OWN threat credible to an adversary. This atom's mechanism is EXTERNAL: the actor manipulates an ADVERSARY into foreclosing the options of the actor's OWN WAVERING ALLIES — the binding is outsourced to the enemy and lands on a third party (one's own faction), not on the actor's own future self."
  - "how does this differ from lex-2bbqf (false-name-sabotages-the-victims-own-truthful-alarm)? lex-2bbqf's deception is planted before a crisis and works because a VICTIM's own subsequent truthful testimony misleads a BYSTANDER who would otherwise help the victim — the target of the manipulation is a third party who might rescue the victim. This atom's information is passed DIRECTLY and DURING the crisis to the adversary itself (not a bystander), nothing false is told to anyone, and the payoff is not preventing a rescue but eliminating one's own faction's exit option. Different target, different timing, different payoff structure."
  - "how does this differ from lex-9pubz (concealment-of-intentions removes counterparty's window for counter-prediction and counter-action)? lex-9pubz is the general principle that HIDING intent denies an adversary the ability to counter-plan. This atom is close to an inversion of that principle applied reflexively: Themistocles does not conceal Greek weakness from Xerxes — he ACCURATELY REVEALS it, precisely because Xerxes's fully rational reaction to true information is the mechanism that forces Themistocles's own side's hand. Nothing is fabricated for the enemy; the leverage comes from choosing who receives true information and calculating its downstream effect on a third party, not from denying anyone's counter-prediction."
  - "is this just 'manufacturing a crisis'? Partially, but with a specific structural signature that narrows it: (1) the actor cannot directly persuade or coerce their own faction; (2) the actor alters a third party's — specifically an ADVERSARY's — behavior using accurate information; (3) the adversary's rational reaction forecloses the friendly faction's exit; (4) the friendly faction commits to the desired course believing the constraint arose from circumstance, never having been directly asked or overruled."
severity-tier: info
status: active
