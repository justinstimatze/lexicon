  - source: practitioner
    text: rousmaniere-2014-annapolis-book-of-seamanship-constant-bearing
    citation: "John Rousmaniere, The Annapolis Book of Seamanship, 4th ed. (Simon & Schuster), Chapter 8, 'Rules of the Road,' on the recommended corrective action once collision risk is confirmed."
    quote: "'Better yet, turn radically toward her wake, let her pass ahead, then turn back on your original course. Whatever you do, you can't afford to wait until the last moment.'"
canonical-instances:
  - "A pilot flying visual traffic-avoidance watches another aircraft that appears to sit at a fixed point in the windscreen while growing larger. This is the aviation analog of constant-bearing-decreasing-range, and pilots are trained to treat it as maximum collision risk, even though nothing about the other plane looks like it is approaching in the way intuition expects."
  - "A startup tracks its runway-in-months against its time-to-profitability estimate every quarter; the number has held at 'four months' for three consecutive quarters even as burn rate, hiring, and revenue have all visibly changed, which is the sign that the two trajectories are converging on a fixed point rather than diverging, not a sign that the situation is stable."
  - "A driver merging onto a highway watches a car in the mirror that stays in the exact same spot in the mirror's frame as it grows larger, rather than sliding toward one edge -- driver's-ed materials teach this specific visual signature as the tell for an unsafe merge, independent of how fast or slow the other car seems to be going."
  - "Operationally distinct from a generic 'watch for early warning signs' framing: this atom's mechanism is a specific, structurally invariant geometric signature (an unchanging relative bearing) that looks like nothing at all to ordinary perception and requires a deliberate repeated measurement to detect, because visual intuition treats bearing CHANGE as the marker of relevance, and reads constancy as absence of a signal rather than as the signal itself."
critical-questions:
  - "How often does a real-world 'unchanging number' turn out to be a measurement artifact (infrequent sampling, a lagging or noisy proxy) rather than a genuine constant-bearing collision signature -- and how would someone tell the two apart before committing to radical corrective action?"
  - "Does treating every steady reading as confirmed danger risk false alarms in situations where the underlying trajectories are not actually on a true collision course, just happen to share a temporarily stable relative measurement for unrelated reasons?"
  - "The corrective-action half of the rule calls for one large, unambiguous change rather than a series of small ones -- in domains without a physical rudder (organizational, relational, competitive), what makes a corrective move 'large and unambiguous' rather than a gradual drift that could itself be misread the same way the original danger was missed?"
