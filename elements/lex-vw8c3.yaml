id: lex-vw8c3
name: producer-supplies-both-need-and-satisfaction-creating-structural-lock-in
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when an entity (corporation, platform, profession, religion, industry, state apparatus, AI deployment) BOTH produces the need + supplies the satisfaction, with the cycle creating consumer/user dependence on the entity that the consumer experiences as voluntary preference. Marcuse's canonical case: advanced industrial society's `false needs` — needs `superimposed upon the individual by particular social interests in his repression` — produce the rat race of catching up with peers + planned obsolescence + the consumer behavior that reproduces the industrial system. The mechanism is not just self-amplifying appetite (lex-fjffq) — it's the SYSTEM-LEVEL feedback where the same entity that creates the need also supplies the satisfaction, so the satisfaction-event reinforces the consumer's dependence on the entity. The result: structural lock-in achieved without explicit coercion, experienced by the consumer as voluntary preference + comfortable euphoria, while critical-consciousness about the system is foreclosed by the satisfaction-cycle (Marcuse: `euphoria in unhappiness`). Transferable applications: social media platforms generating the loneliness, FOMO, and social-comparison anxiety that drive return-engagement (Twenge 2017; Lembke 2021); dating apps generating uncertainty and option-paralysis that drive subscription upgrades + paid features (Bridges 2018); pharmaceutical industry expanding diagnostic categories (Healy 1997 *The Antidepressant Era*; Whitaker 2010 *Anatomy of an Epidemic*) creating disease entities that the industry's products treat; convenience platforms (Uber, DoorDash, Amazon) eroding the local skills + alternatives that previously satisfied the need without dependence on the platform; subscription economics generally; CASINO design where the gambling-as-entertainment + need-to-recoup-losses cycle locks players in (Schüll 2012 *Addiction by Design*); planned-obsolescence consumer electronics; educational credentialism producing the credential-requirements that the institution then certifies; war-industry producing threat-environments that justify its budget (Mills 1956 + Eisenhower farewell address 1961 on the military-industrial-complex); LLM-product workflows where the dependency on the LLM becomes the productivity-need that requires more LLM use. Distinct from lex-fjffq insatiable-consumption-self-amplifies-the-appetite-it-feeds (the PSYCHOLOGICAL self-amplification mechanism — appetite grows with feeding). lex-vw8c3 names the SYSTEM-LEVEL pairing where the SAME ENTITY produces need + satisfaction. The two compose — lex-fjffq's psychological mechanism is exploited by lex-vw8c3's system-level pairing. Distinct from lex-5kjya costly-conspicuous-waste-as-status-signal (Veblen — status-signaling mechanism); lex-vw8c3 is the more general producer-supplied-need-and-satisfaction structure of which status-competition is one case. Distinct from lex-ewjec removing-non-market-exits-makes-market-dependence-structural (Polanyi — exit-removal mechanism); lex-ewjec + lex-vw8c3 compose — lex-ewjec removes alternatives; lex-vw8c3 creates the need + supplies the satisfaction within the remaining option-space. Distinct from lex-jd7fe enduring-power-reproduces-through-cultural-consent (Gramsci — macro cultural reproduction); lex-vw8c3 is the micro-economic transactional mechanism that scales into Gramsci's macro hegemony when system-wide. Use when (i) a critic claims `consumers are choosing freely` when the producer also produces the need being satisfied, (ii) a reform tries to address consumer demand without addressing the need-production side of the cycle, (iii) you're designing a product or platform and need to think about whether your strategy depends on this mechanism (and what it would mean to deploy responsibly if so)."
