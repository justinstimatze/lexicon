id: lex-maq83
name: threshold-crossing-into-liminal-space
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When you cross a threshold into liminal space (rite of passage, role transition, frame shift), the rules from the old space don't apply yet and the rules of the new space haven't bound. The intermediate state is generative and dangerous; mark it."
related: [lex-uz7g4, lex-hng49, lex-utuy6, lex-ppq72, lex-nadsx, lex-uyk6e, lex-26v8g, lex-k7m6e, lex-rref3, lex-p26va, lex-h7z9x, lex-ksqk8, lex-hr66d, lex-pjsjj, lex-x9sda, lex-a2g3x]
scaffolds-from: [lex-dzqje, lex-utuy6, lex-rref3]
evokes: [the-forest-edge, into-the-dark-wood, the-portal-as-rule-change, leaving-the-village, the-far-country, you-cant-go-home-the-same-way-you-came, van-gennep-rites-of-passage]
lineage:
  - source: primary
    text: grimm-1812-kinder-und-hausmaerchen
    citation: "Jacob & Wilhelm Grimm, Kinder- und Hausmärchen (1st ed. 1812; final 7th ed. 1857). KHM 11 'Brüderchen und Schwesterchen' / 'Little Brother and Little Sister' opens with the canonical threshold-crossing into liminal forest-space. (Margaret Hunt 1884 complete English translation, Standard Ebooks edition of the Bell & Sons 2-volume original). The Hunt 1884 translation is the canonical complete English Hunt edition; replaced the prior PG edition which did not contain KHM 11 or KHM 46. The Hunt 1884 edition has been continuously in print / republished since 1884 (Bell & Sons → many later editions → Standard Ebooks 2026 critical-clean edition); it is the canonical English Grimm."
    quote: "[Grimm, KHM 11 'Little Brother and Little Sister', opening, Hunt 1884 trans., Standard Ebooks edition:] 'Little brother took his little sister by the hand and said, \"Since our mother died we have had no happiness; our stepmother beats us every day, and if we come near her she kicks us away with her foot. Our meals are the hard crusts of bread that are left over; and the little dog under the table is better off, for she often throws it a nice bit. May Heaven pity us. If our mother only knew! Come, we will go forth together into the wide world.\" They walked the whole day over meadows, fields, and stony places; and when it rained the little sister said, \"Heaven and our hearts are weeping together.\" In the evening they came to a large forest, and they were so weary with sorrow and hunger and the long walk, that they lay down in a hollow tree and fell asleep.' [The threshold-crossing IS the opening move: 'forth together into the wide world' marks the departure from rule-known space; the long-walk-through-meadows-fields-stony-places is the marge; the arrival at the large forest is the entry into liminal-space where the rules-change kicks in (the next paragraph: 'the wicked stepmother was a witch, and had... bewitched all the brooks in the forest' — magic operates here, where it did not at home).]"
  - source: practitioner
    text: homer-odyssey-c750-bce
    citation: "Homer, Odyssey (composed orally c. 8th c. BCE; canonical Greek text fixed by Alexandrian editors). (Bryant trans. 1871, Standard Ebooks edition). The Odyssey contains multiple instances of threshold-crossing-into-liminal-space, each marked by a rule-change: Book 5 (Calypso's island Ogygia — time runs differently, mortal stranded with goddess); Book 9 (Polyphemus's cave — entering causes the rules-of-hospitality to invert into cannibalism); Book 9 (Lotus-eaters — crossing produces memory-loss); Book 10 (Aeolus's floating island; Circe's island Aeaea — companions turned to swine); Book 11 (Hades katabasis — the most extreme liminal-space rule-change). The threshold-into-rules-change pattern recurs across the Odyssey's nine-island sequence, providing independent ancient-Greek attestation alongside the Grimm KHM 11 Germanic-folktale instance."
    quote: "[Homer, Odyssey Book IX, Bryant trans., Standard Ebooks edition — the Polyphemus-cave threshold instance: the crossing-into-cave is marked, and inside the cave the rules of hospitality (xenia, sacred to Zeus) invert into cannibalism. The atom's claim 'rules change at the threshold' is instantiated repeatedly across Books 5-12; Polyphemus is the canonical hospitality-inversion case. Single-passage verbatim deferred pending fuller mining of Odyssey for a separate atom; the cross-source attestation is the cardinal point for this entry.]"
  - source: practitioner
    text: van-gennep-1909-rites-of-passage
    citation: "Arnold van Gennep, Les rites de passage (1909; English 1960 The Rites of Passage, U Chicago Press). The canonical anthropological formulation — three-stage structure (séparation / marge / agrégation). Tier-3 deepening source: the atom's vital claim is now grounded by Grimm KHM 11 + Odyssey (entries above); van Gennep provides the cross-cultural anthropological articulation that names what the folktale and the epic instantiate. The séparation/marge/agrégation triad has become standard anthropological vocabulary cited across thousands of independent secondary works (Turner 1969 extended it into communitas/liminality framework — see lex-dzqje)."
    quote: "[Tier-3 deepening source — van Gennep 1909; the central claim now rests on the Grimm KHM 11 + Odyssey verbatims above. Van Gennep's anthropological triad (séparation / marge / agrégation) is what names the abstract pattern Grimm and Homer instantiate.]"
  - source: practitioner
    text: propp-1928-morphology-of-folktale
    citation: "Vladimir Propp, Morphology of the Folktale (Russian 1928; English 1968 U Texas Press). Tier-3 deepening source: Propp's 31 functions include 'absentation' (function 1) and 'departure' (function 11) as foundational structural moves.; the atom's critical claim is now grounded by Grimm KHM 11 + Odyssey, with Propp providing the cross-corpus empirical confirmation that the departure-function is structural across the Russian-folktale corpus too (~100 tales analyzed)."
    quote: "[Tier-3 deepening source; the pivotal claim now rests on the Grimm and Odyssey instances. Propp's function-11 (departure) is the cross-corpus empirical complement showing the threshold-crossing-into-liminal-space pattern attests in the Russian folktale tradition as well as the Germanic (Grimm) and ancient-Greek (Homer) traditions.]"
canonical-instances:
  - "funeral rites as status transition: van Gennep's original four case-types (birth, initiation, marriage, death rites) all instantiate séparation/marge/agrégation, and funeral rites are the case where the marge phase applies to BOTH parties — the deceased is separated from the living (funeral proper) and incorporated into a new status (ancestor, afterlife-resident), while mourners are simultaneously separated from ordinary social life (mourning period, altered dress/conduct) and later re-incorporated (mourning's end, return to ordinary status). This is Brown 1991's 'death rituals' universal: the transferable claim is not the specific funeral content (which varies enormously by culture) but the séparation/marge/agrégation structure every documented funeral tradition shares"
  - "starting a new role / joining a new organization / moving to a new city: the rules CHANGE at the threshold-crossing. What was true in the previous space is no longer reliable; new conventions apply; identity-as-it-functions-here has to be re-formed. The disorientation is the marge state van Gennep names; pre-existing competence does not directly transfer. Most new-hire-onboarding pain is the threshold-crossing made visible"
  - "switching codebases / leaving a long-tenured codebase: idioms that were key in the old space (naming conventions, mental model of the architecture, who-owns-what tribal knowledge) are not portable. The first 2-4 weeks in a new codebase are the liminal-space — your competence pattern matches don't fire reliably, and the path back is closed (you don't re-acquire the old codebase's context just by going back; it's another threshold)"
  - "going on retreat / wilderness trip / cross-country drive alone: the practiced-self loses its scaffolding (no work, no family-routines, no familiar physical anchors). Many people report perception-and-memory shifts during multi-day liminal-space immersion (Pennebaker's expressive-writing tradition; wilderness-therapy literature). The return-crossing is also marked — you don't seamlessly resume; integration of what-happened-in-the-marge requires explicit work"
  - "starting and ending psychotherapy / 12-step recovery / spiritual practice: the practice itself is a liminal-space (with specific rules: confidentiality, vulnerability-norms, particular vocabulary). Practitioners describe the exit-threshold as harder than the entry one — leaving the marge into a regular-life-that-now-knows-different-things requires re-orientation"
  - "operationally distinct from lex-ppq72 descent-and-return: lex-ppq72 names the SPECIFIC arc of katabasis (going down to retrieve something and resurfacing), with depression/death/grief as canonical instances. lex-maq83 names the BROADER pattern: any crossing into a space-with-different-rules, including the descent case but also lateral and ascent crossings (new role, new organization, retreat, education-program entry). lex-ppq72 is a sub-case of lex-maq83; both can fire on the same prompt"
  - "operationally distinct from lex-utuy6 readiness-gate-as-domain-entry: lex-utuy6 names the gate-keeping mechanism (qualification test, initiation rite, the sphinx); lex-maq83 names what happens AFTER the gate is passed. The gate is the marker that a threshold is being crossed; the liminal-space is what lies inside. They compose: lex-utuy6 controls who enters lex-maq83's space"
  - "operationally compositional with lex-uz7g4 archetype-as-projective-shorthand: archetypes that appear during liminal-space crossings (the mentor figure, the threshold guardian, the trickster) are themselves recurring narrative-primitives. The space generates its archetypes; the archetypes scaffold navigation of the space"
  - "essential critical question: which crossings are RECOVERABLE and which aren't? Some thresholds (a temporary retreat, a vacation, a project) are designed for return; others (a major surgery, a death, an irreversible career shift) are one-way. The atom names the pattern in general; the operational diagnosis is the question 'is there a return-crossing available, or has the previous space ceased to exist as a destination?'"
  - "foundational critical question: do contemporary engineering / organizational contexts deserve the threshold-crossing framing, or is the folktale framing decorative? Empirically: the cognitive disorientation that new-hires, refactor-immersed engineers, and post-acquisition employees describe maps closely onto van Gennep's marge phase. The framing IS decisive — it predicts the disorientation, names the duration (typically weeks, not days), and points at the integration-work the return-crossing requires"
critical-questions:
  - "what's the threshold marker — explicit (rite, ceremony, signed contract) or implicit (felt-shift)? implicit thresholds drift"
  - "is the liminal space the actual destination or a transit zone? long-term residence in liminality has different stakes"
  - "who is the threshold-crosser accountable to during the crossing — and what's the cost of getting stuck mid-passage?"
  - "are you sure the crossing happened? often people perform the rite without crossing, or cross without the rite"
status: active
