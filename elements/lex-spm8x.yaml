lineage:
  - source: primary
    text: wiener-1948-cybernetics
    citation: "Norbert Wiener, Cybernetics: Or Control and Communication in the Animal and the Machine (1948; 2nd ed. MIT Press 1961; cited here from the 2019 MIT Press open-access reissue, forewords by Doug Hill and Sanjoy K. Mitter), Introduction, p.18 — the founding text on feedback as the unifying mechanism across biology, engineering, and social systems. The discipline-creating book"
    quote: "'We have decided to call the entire field of control and communication theory, whether in the machine or in the animal, by the name Cybernetics, which we form from the Greek χυβερνήτης or steersman.'"
  - source: primary
    text: altshuller-1984-principle-23-feedback
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.5 'Forty Basic Methods,' Principle 23 'The Feedback Principle.'"
    quote: "'23. The Feedback Principle. a. Introducing feedback. b. If there is feedback already, changing it. Example. \"A method of automatic regulation of the temperature pattern of baking sulphide materials in a boiling layer by changing the flow of loaded material in the function of temperature; in order to raise the dynamic precision of supporting a given temperature value the delivery of material is changed in accordance with changes in the content of the sulphurous gas in the exhaust gases.\"'"
  - source: practitioner
    text: triz-decomposition-pass
    citation: "promoted from cross-attestation: control engineering (PID controllers as the canonical feedback-loop mechanism; thermostats), biology (homeostasis: blood-glucose / body-temperature / blood-pressure regulation; the negative-feedback loops are the regulation mechanism), software (event loops, observer pattern, MAPE-K autonomic computing, RxJS reactive programming), economics (price signals as market feedback), education (formative assessment as learning feedback), psychology (CBT thought-records as cognitive feedback), agriculture (precision agriculture as soil-feedback). One of the most-attested cross-domain mechanisms in cybernetics literature"
canonical-instances:
  - "thermostat: senses room temperature, compares to setpoint, switches heater on/off. The feedback loop IS the temperature-regulation mechanism — without it, the heater is just an open-loop heat source that overshoots or undershoots constantly"
  - "biological homeostasis: blood-sugar regulation via insulin/glucagon is a textbook negative-feedback loop. Disease state (diabetes) is failure of the feedback mechanism — the SAME hormones; the loop is broken"
  - "software MAPE-K loop in autonomic computing (Monitor / Analyze / Plan / Execute / Knowledge): the entire architecture for self-managing systems is a 4-stage feedback loop. The loop IS the autonomic property"
  - "compounding distinction with lex-rupk9 conservation-as-invariant-tracking: invariants are what STAYS the same; feedback loops are what ACTIVELY MAINTAINS the invariant against perturbation. Both atoms together capture 'how a system stays itself'"
  - "the lexicon hook itself is a feedback loop: prompt observed → matched primitives surfaced → user behavior shaped → next prompt observed; the iteration IS the use-loop closure"
critical-questions:
  - "the loop-closure check: is the loop actually CLOSED, or are you mistaking an open-loop process for a feedback loop? Open-loop: heater runs for 30 min then stops (no temperature sensing). Closed-loop: thermostat senses temp and adjusts heater dynamically. The discriminator: does the system OBSERVE its own output and adjust? If not, it's not a feedback loop even if labeled as one. Practitioner-discipline: trace the sensing-mechanism explicitly. If you can't, you don't have closure"
  - "the time-constant question: what's the loop's response-time relative to the disturbances it should compensate for? A thermostat that samples every 5 minutes is useless against 30-second temperature spikes; a quarterly KPI review is useless against weekly market shifts. Practitioner-question: does the loop's time-constant match the time-scale of the dynamics it's meant to regulate? Loops with wrong time-constants either oscillate (too fast) or drift uncontrolled (too slow)"
  - "the gain-and-stability check: is the loop's response proportional and damped, or is it over-reactive? Too-high gain produces oscillation (the heater overshoots, then cools too much, then overshoots again); too-low gain produces ineffective control. PID controllers explicitly tune gain, integral, and derivative terms; informal feedback loops often have no such tuning. Practitioner-question: when this loop hits a disturbance, does it settle to a stable response, or does it oscillate/overshoot/undershoot? If unstable, the loop needs gain-tuning, not more sensing"
  - "the sensor-validity question: is the loop SENSING what it claims to be regulating, or is it sensing a proxy that diverges? Goodhart's law (lex-ewafs wish-with-loophole) bites here: when the sensed-variable is a proxy for the goal, the loop optimizes the proxy and the goal drifts. Practitioner-discipline: regularly audit the sensor for proxy-divergence. The loop is only as good as its measurement-validity"
  - "the failure-mode-on-sensor-loss: what happens to the controlled-system if the sensor fails? Some loops degrade gracefully (the system reverts to a safe-default); others fail catastrophically (without temperature-sensing, the heater can't know to stop). Practitioner-discipline: design loops with explicit sensor-loss behavior. Loops without specified failure-modes are accidents waiting to happen"
