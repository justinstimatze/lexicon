id: lex-pargr
name: freedom-from-need-gets-mistaken-for-an-innate-capacity-for-restraint
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Someone who never appears ruled by hunger, urgency, or want can look like they possess a special inner capacity for self-restraint, when what they actually possess is a situation in which restraint costs them nothing -- the appearance of virtue and the material fact of plenty are easy to mistake for each other, and the mistake flatters whoever is doing the mistaking as much as whoever is being praised. Hesiod's Muses claim to be free of the 'belly' and therefore uniquely capable of truth, unlike hungry, appetite-ridden mortals. Hyde names the alternative reading directly: 'It could be that those who claim such freedom are just well fed. The belly is less demanding when there is plenty to eat, after all, and one is not buffeted by hunger if one is not regularly hungry. I'm simply saying that it's easier to control one's appetites if one controls the food supply. An old canard has it that self-restraint is inborn in the ruling classes; it's more likely the case that aristocrats can appear to govern their neediness because they aren't in fact needy at all.' The claim to a special virtue and the fact of a comfortable material position produce identical outward behavior, calm, measured, apparently unmoved by want, which is exactly what makes the substitution of one for the other so easy to make and so convenient to whoever benefits from being seen as virtuous rather than merely fortunate. Diagnostic move: when someone's composure or restraint is offered as evidence of their inner character, check what their actual material circumstances are first -- restraint that costs nothing to perform is not yet evidence of a capacity that would hold up under real want, and the confusion of the two tends to flow in a predictable direction, crediting the comfortable with a virtue their comfort itself manufactures."
