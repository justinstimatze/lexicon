id: lex-h5c5x
name: formal-approval-ratifies-a-selection-already-made-informally
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a formal gate appears to grant nearly everyone what they asked for, don't conclude the gate is toothless or that competition for the resource is mild — check whether the real filtering already happened UPSTREAM of the formal request, through people quietly adjusting what they ask for to match a probable outcome they were informally signaled in advance. Kendall and Selvin found that at Cornell Medical College the formal internship-assignment process almost never overrides a student's stated application: 'It does not often happen at Cornell that a high-ranking student who has applied for a rotating internship is denied this request and assigned, instead, to a specialized internship. Nor, which is perhaps more surprising, does it often happen that a low-ranking student who has applied for a specialized internship is turned down in his request, and instead given a rotating assignment.' In one graduating class, 64 of 82 students got their literal first choice, and 'approximately 80 per cent of this class were chosen to intern in the field and in the hospital which they had designated as their first choice; over 90 per cent were chosen to intern in the field which they had applied for.' That near-unanimous ratification does NOT mean rank stopped mattering — Table 19 shows rank predicting the actual outcome as strongly as ever. What changed is WHERE the sorting happens: 'the selection takes place between the end of the third year of medical school and the middle of the fourth, before formal internship applications have been submitted.' Two asymmetric mechanisms do this upstream work. For students likely to be rejected, self-estimate plus informal faculty conversation produces voluntary downgrading before the formal ask: 'As a result of these self-estimates, corrected or reinforced by discussions with faculty members, when the day of crucial decision approaches, low-ranking students seem to scale down their intentions to meet the probable reality.' One student illustrates the mechanism directly, describing why he shifted from wanting internal medicine to pediatrics: 'through a subtle probing of judgments of significant faculty members, he decided, rightly or wrongly, that he was more likely to get good recommendations and support from physicians in the Department of Pediatrics.' For students likely to be approved, the push runs the other way — active encouragement rather than passive non-discouragement: 'High-ranking students presumably engage in the same process of appraising their chances. But, if they are realistic, they know that there is a good probability that they will end up with the kind of internship which they want. Why, then, do so few receive rotating internships, even among those who several months previously had said that they wanted this type of internship? The answer seems to be that they are given strong encouragement by the faculty to apply for specialized internships.' A top-ranking student reports exactly this encouragement in an offhand exchange with a respected faculty member: '\"What do you intend to do after medical school?\" I told him internal medicine, and he said \"Good!\" So far as I am concerned, this is a big fat pat on the back...' Kendall and Selvin's own summary names the asymmetry: 'the high-ranking student at Cornell who maintains an interest in a rotating internship must to some extent go counter ... to the expectations and advice of the faculty and administration, while the good student who has already developed specialized interests receives support and encouragement.' Nothing in this process is a formal denial — no committee ever votes no — which is exactly why the formal apparatus can look like it simply grants people's wishes. Distinct from location-of-the-sorting-gate-determines-where-pressure-concentrates (lex-s96em): that atom is about WHICH POINT in a pipeline (entry vs. exit) carries the real bottleneck, and how that location shapes felt stress timing across an entire population equally. This atom is about a gate that looks POROUS because the real filtering has migrated into an invisible, informal, individually-targeted pre-stage — the formal point itself is not where the bottleneck is felt OR where it operates; it operates earlier and off the books entirely. Diagnostic move: when a formal decision process reports a suspiciously high approval or match rate, don't read that as low selectivity — ask who gets informally counseled, discouraged, or encouraged before they ever file the formal request, and check whether the true selection criterion (like class rank here) still fully predicts the final outcome despite the formal process rejecting almost no one."
