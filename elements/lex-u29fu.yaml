id: lex-u29fu
name: discovery-claim-bar-as-community-convention-not-decision-theoretic
type-in: question
type-out: claim
_tier: atomic
agent-instruction: "When a community decides a discovery is real, the bar is convention, not decision theory. Particle physics 5-sigma, biology p<0.05, etc. — these are community-set thresholds. Don't argue from threshold to truth; argue about whether the threshold is correctly calibrated for the question."
related: [lex-n8smn, lex-cpjma, lex-nn3u9, lex-n7dqw, lex-2cjtz, lex-stppu, lex-p34bd, lex-pp5wq, lex-mx4q5, lex-dcr6p]
scaffolds-from: [lex-n8smn, lex-nn3u9]
evokes: [five-sigma-convention, p-less-than-0.05, look-elsewhere-effect, the-bar-is-historical-not-derived, two-trial-fda-requirement, genome-wide-significance, atlas-cms-higgs-2012]
lineage:
  - source: primary
    text: atlas-2012-higgs-discovery
    citation: "ATLAS Collaboration (G. Aad et al.), 'Observation of a new particle in the search for the Standard Model Higgs boson with the ATLAS detector at the LHC,' *Physics Letters B* 716:1-29 (2012), arXiv:1207.7214. Together with the contemporaneous CMS Collaboration 2012 *Phys. Lett. B* 716:30-61 (arXiv:1207.7235), this is the announcement of the Higgs-boson discovery at 125-126 GeV. The two experiments independently reported observations exceeding the 5σ statistical-significance threshold that the high-energy-physics community has used since the 1970s-1990s as the 'discovery' bar (distinguished from 'evidence' at 3σ and 'observation' at 4σ). The 5σ convention is NOT derived from Bayesian decision-theory or Neyman-Pearson hypothesis-testing — it is a COMMUNITY-NEGOTIATED CONVENTION that encodes (a) the look-elsewhere effect for multiple-bin searches (Gross-Vitells 2010 'Trial factors for the look elsewhere effect'); (b) accumulated experience that 3σ-4σ excesses frequently disappear with more data while 5σ excesses rarely do; (c) sociological-tradition that anchors the discovery-vs-evidence boundary in publications, press-releases, and Nobel-prize attribution. The transferable claim: scientific-community discovery-claim thresholds are conventions encoding statistical + sociological + look-elsewhere considerations, not decision-theoretic optima. Different communities pick different thresholds (FDA p<0.05 + 2 trials; genome-wide significance 5×10^-8 from Bonferroni; physics 5σ ≈ 5.7×10^-7). The convention IS the bar."
    quote: "[ATLAS Collaboration 2012 *Phys. Lett. B* 716:1, abstract:] 'A search for the Standard Model Higgs boson in proton-proton collisions with the ATLAS detector at the LHC is presented... Clear evidence for the production of a neutral boson with a measured mass of 126.0 ± 0.4 (stat) ± 0.4 (sys) GeV is presented. This observation, which has a significance of 5.9 standard deviations, corresponding to a background fluctuation probability of 1.7 × 10−9, is compatible with the production and decay of the Standard Model Higgs boson.' [§10 Conclusion:] 'These results provide conclusive evidence for the discovery of a new particle with mass 126.0 ± 0.4 (stat) ± 0.4 (sys) GeV.' [On the look-elsewhere correction, §9 Combined results:] 'The global probability for the most significant excess to be observed... after taking into account the \"look elsewhere\" effect, increases with the range of the search.' [The transferable claim: the 5σ bar isn't derived from a decision-theoretic optimization — it's a community-tradition that has accumulated (a) statistical-correction-for-multiple-search-bins (look-elsewhere), (b) empirical-experience that ≥5σ excesses rarely disappear, (c) sociological-anchoring of the discovery-vs-evidence boundary. Other scientific communities have their own conventions (FDA double-trial p<0.05; GWAS p<5×10^-8) that similarly encode bundle of statistical + sociological + tradition. The general pattern: when a community-discovery-claim crosses a threshold, the threshold-choice is itself a community-convention — analyzing its components (statistical + sociological + tradition) is necessary to interpret what 'discovery' means in that community.]"
  - source: practitioner
    text: cross-domain-pattern-synthesis-v46
    citation: "Cross-domain attestations: FDA drug-approval requires p<0.05 in TWO independent trials (Phase III) — the threshold is statistical (p<0.05) + replication-required (two trials) + sociological (community-trust). Genome-wide-association-studies use p<5×10^-8 = Bonferroni-correction for ~1 million independent SNPs (Risch + Merikangas 1996 *Science* 273:1516). Six-sigma manufacturing quality (Motorola 1986; Smith) targets defect-rates of ~3.4 per million opportunities — statistically inherited from physics conventions, sociologically anchored as TQM tradition. Particle-physics discovery thresholds: 3σ = 'evidence,' 4σ = 'observation,' 5σ = 'discovery' (Lyons 2013 'Discovering the significance of 5 sigma' *Phil. Trans. Roy. Soc. A* 371:20120249). Psychology p<0.05 NHST (Fisher 1925) — the most disputed instance; debates about p-hacking + replication crisis are debates about whether the conventional bar is adequate for the field. Lyons 2013 explicitly argues physics 5σ is 'partly historical, partly sociological' and not 'derivable from first principles.' Multi-substrate attestation across particle physics, regulatory science (FDA), genomic research, manufacturing quality, and psychological research."
    quote: "[Cross-domain consistency check, 2026-05-24: discovery/significance thresholds in different scientific communities ENCODE differential weighting of (a) statistical-decision-theory components (Type-I error rate, power); (b) replication/independent-confirmation requirements; (c) look-elsewhere / multiple-testing corrections; (d) sociological-tradition + Nobel-attribution practices. The thresholds are NOT directly comparable across fields (a 'significant' result in psychology at p<0.05 is far weaker evidence than a 'discovery' in physics at 5σ ≈ p<5.7×10^-7), yet within each field the threshold operates as a community-agreed boundary. Lyons 2013 (Oxford physicist) explicitly argues that physics 5σ is partly historical/sociological convention. The transferable operational claim: when interpreting a 'significant' or 'discovery' result, audit the community-convention's components — the bar is what the community has agreed counts, not an optimum derived from decision-theory. Different communities = different bars = different operational meanings of 'discovery.']"
canonical-instances:
  - "the physics-5σ canonical case (ATLAS+CMS 2012 Higgs; Lyons 2013 *Phil. Trans. Roy. Soc. A* 371:20120249): the 5σ threshold for 'discovery' in particle physics emerged ~1970s-1990s. Lyons 2013 explicitly argues it is NOT derived from decision-theory but accumulated from: (a) the look-elsewhere effect (Gross-Vitells 2010 formalized: a search over N bins inflates the false-alarm-rate by ~N); (b) empirical experience that 3-4σ excesses frequently vanished with more data while 5σ rarely did; (c) the sociological need for a clear 'discovery' bar distinct from 'evidence' (3σ) and 'observation' (4σ). The 2012 Higgs discovery cleared this bar with 5.9σ local at ATLAS + 5.0σ at CMS, INDEPENDENTLY"
  - "the FDA two-trial canonical case (modern regulatory science): FDA approval requires statistical-significance (p<0.05) in TWO independent Phase III trials. The convention encodes (a) Type-I error control (p<0.05); (b) replication requirement (two trials, ruling out single-study flukes); (c) sociological tradition of regulatory caution. The 'two-trial rule' is not derived from decision-theory; it's a community-agreed requirement that emerged from drug-approval-history including thalidomide-era failures and statin-era successes"
  - "the genome-wide-significance canonical case (Risch + Merikangas 1996 + modern GWAS practice): p<5×10^-8 = 0.05 / (10^6 independent SNPs) is Bonferroni-correction for the multiple-testing of ~1 million genetic loci. The threshold is a STATISTICAL convention but the choice of using Bonferroni (vs FDR control vs Bayesian methods) is a COMMUNITY convention. GWAS findings below this threshold are reported as 'suggestive' but not 'significant' — replication in independent cohorts often replaces strict adherence to the threshold"
  - "the six-sigma-manufacturing canonical case (Motorola 1986; Smith): six-sigma quality means ≤3.4 defects per million opportunities. Despite the name (which sounds derived from statistical-decision-theory), six-sigma in practice involves both statistical-process-control AND organizational-discipline (DMAIC methodology, belts-and-ranks training). The 'six-sigma' label is sociologically powerful as a quality-tradition signifier independent of its statistical content"
  - "the psychology-p<0.05-NHST canonical case (Fisher 1925 + replication-crisis 2015+): Fisher's p<0.05 was a heuristic for 'preliminary evidence worth pursuing,' not a discovery-threshold. Psychology's adoption of p<0.05 as 'significant' has produced the replication crisis (Open Science Collaboration 2015 *Science* 349:aac4716 — only ~36% of psychology studies replicated). The crisis is partly a critique that the convention encodes too-low a bar for the discipline's research questions. Practitioner-question: in your field, is the threshold-convention adequate for the kind of claim being made?"
  - "operationally distinct from lex-nn3u9 extraordinary-claims-require-extraordinary-evidence: Hume/Sagan principle is GENERAL — strong claims need strong evidence. lex-u29fu is the SPECIFIC INSTANTIATION via community-convention thresholds. Cross-fire: lex-nn3u9 supplies the underlying principle; lex-u29fu is how scientific communities operationalize it through threshold-conventions. The conventions encode community-judgments about what counts as 'extraordinary'"
  - "operationally distinct from lex-2cjtz physically-independent-channels-confirm-single-event: lex-2cjtz is multi-channel physical-evidence. lex-u29fu is single-claim threshold-convention. They can compose: multi-channel detection (lex-2cjtz) typically EXCEEDS single-channel discovery thresholds (lex-u29fu) by orders of magnitude; LIGO's GW150914 was 5.1σ at single-detector (lex-u29fu), and GW170817 was multi-messenger (lex-2cjtz) at vastly greater joint-evidence"
  - "operationally distinct from lex-n7dqw template-matching-against-theoretical-prediction-as-detection-protocol: matched-filter PRODUCES the statistical significance; community-convention THRESHOLDS interpret it. lex-n7dqw supplies the SNR; lex-u29fu supplies the bar the SNR is compared against. They co-fire in any signal-detection-claim"
  - "operationally distinct from lex-cpjma triangulation-of-independent-methods: lex-cpjma is methodological-pluralism. lex-u29fu is community-threshold-convention. They co-fire when a community-discovery-claim requires both crossing the threshold AND independent-method-confirmation (e.g., physics 5σ + independent-experiment-replication)"
  - "operationally distinct from lex-n8smn social-proof-bootstraps-trust: social-proof is the cognitive mechanism by which we trust based on others' belief. lex-u29fu is the FORMAL FRAMEWORK communities use to establish discovery-claim trust. Cross-fire: lex-u29fu's conventions embed lex-n8smn (the community trusts the convention because the community uses the convention), but lex-u29fu adds formal statistical structure beyond informal social-proof"
critical-questions:
  - "the components-audit diagnostic: when interpreting a 'significant' or 'discovery' result, audit the community-convention's components — what's the statistical threshold, the replication requirement, the look-elsewhere correction, the sociological-tradition? Practitioner-question: in this field, what's the OPERATIONAL meaning of 'discovery'? Different fields use different bundles; cross-field interpretation requires translation"
  - "the threshold-vs-strength conflation: a claim that 'just barely' crosses the threshold (e.g., p=0.049 in psychology, 5.0σ in physics) has very different evidential strength than a claim that DRAMATICALLY exceeds it (p<0.001, 7σ). Practitioner-discipline: report the full strength (effect-size + significance), not just whether-it-crossed. The threshold is a community-bar; the strength is the actual evidence"
  - "the cross-field comparability problem: p<0.05 in psychology is MUCH weaker evidence than 5σ in physics, but both get labeled 'significant.' Practitioner-discipline: when communicating across fields, translate to common units (Bayes-factor, effect-size, posterior-probability) rather than relying on field-specific 'significant' labels"
  - "the replication-as-substitute question: when a single-study threshold is weak, is replication (multiple independent trials each crossing a lower threshold) better or worse than a single high-threshold study? Bayesian analysis: replication-with-independent-data is generally more robust than concentrating evidence in one trial, because independent replications rule out instrument / methodology systematics (compose with lex-2cjtz physically-independent-channels)"
  - "the convention-update question: when should a community update its threshold? Replication-crises (psychology 2015+) are signals that the existing convention may be inadequate. Practitioner-discipline: treat thresholds as RENEGOTIABLE community-agreements, not as natural-kinds. The 5σ in physics has been debated (Lyons 2013 advocates 5σ; some argue for 4σ in specific contexts with strong prior; others argue for higher in fields with weaker theoretical priors)"
  - "the LLM/AI-evaluation application: ML model-evaluation has its own threshold-conventions (p<0.05 in paper-publication; SOTA-improvement margins; specific benchmark scores). These are similarly community-conventions encoding statistical + sociological + tradition. Practitioner-discipline: when claiming AI 'discovery' (new SOTA, capability emergence, etc.), audit the threshold-convention used. The 'capabilities emerge at scale X' claim is partly a community-convention claim — different evaluation conventions would produce different emergence-claims"
status: active
