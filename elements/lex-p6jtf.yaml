id: lex-p6jtf
name: quick-recognition-of-what-a-situation-actually-is-named-as-the-decisive-protective-virtue
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'A moral drawn from a narrow escape can be generalized past the specific danger into an abstract claim: survival depends less on strength or resources than on promptly and correctly recognizing what a situation actually is before acting within it. In the Jataka''s tale of Kukkuta, the Fowl''s escape from the Falcon''s trap is generalized into exactly this claim: "Whoso the meaning of events is quick to recognise, As from the Falcon''s toils the Fowl, so from his foes he flies."'
related: []
evokes: [jataka, dasanipata, kukkuta-jataka, situational-awareness-maxim, quick-recognition-as-protective-virtue]
lineage:
  - source: primary
    text: jataka-chalmers1895-kukkuta-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 448, Kukkuta-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Whoso the meaning of events is quick to recognise, As from the Falcon's toils the Fowl, so from his foes he flies."
canonical-instances:
  - "A crisis-management trainer tells new hires that the employees who survive a company's mass layoffs unscathed are rarely the most senior or skilled — they are the ones who recognized the meaning of a reorg announcement fastest and repositioned before anyone else understood what was happening."
critical-questions:
  - "Is quick recognition of a situation's true nature actually the decisive protective factor, or does it only matter for those who also have the freedom and resources to act on that recognition once they have it?"
status: active
