id: lex-bzbvu
name: predicting-which-subgroup-breaks-the-pattern-tests-the-theory
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a theory claims a general pattern holds because of some specific structural component, remove that one component and check whether the theory can point, in advance, to exactly which subgroup should break from the pattern. Lakoff's move on abortion: Strict Father morality's opposition to abortion, in his account, specifically requires ranking men's authority above women's in the moral order -- that ranking is what makes a woman choosing a career over motherhood, or a woman's sexual autonomy, register as a violation. If that's right, a conservative who keeps every other piece of Strict Father morality but rejects the male-over-female ranking -- a conservative feminist -- should be the specific subgroup not bound to the pro-life position, regardless of how conservative they are on everything else. This is a stronger claim than 'some conservatives will be exceptions.' It names which conservatives should be the exceptions, before checking who they turn out to be. A theory that can only say exceptions exist somewhere is much weaker than one that says exactly where to look for them. Diagnostic move: when evaluating a proposed structural explanation for a group pattern, ask the theory to name the specific subgroup its own logic predicts should break the pattern -- then check whether the actual exceptions cluster there or somewhere the theory never named."
related: []
evokes: [george-lakoff, moral-politics-1996, abortion, conservative-feminism, falsifiable-prediction]
lineage:
  - source: primary
    text: lakoff-1996-conservative-feminists-predicted-exception
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 15 'Abortion.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“In conservative feminism, as described below in Chapter 17, the authority of men over women is eliminated and the crucial condition for requiring opposition to abortion is not met. Thus, conservative feminists (both male and female) are not bound by the logic of their morality to be either pro-life or pro-choice. In short, the model predicts that there should be conservatives who are pro-choice, and that they should be those who do not rank men above women in the moral order.”"
canonical-instances:
  - "The direct textual anchor is the lineage quote itself: the prediction names the exact structural condition (rejecting the male-over-female ranking) that should produce the exception, rather than leaving open which conservatives, or how many, should turn out to be pro-choice."
  - "Hypothetical: an organizational researcher proposes that a company's chronic missed deadlines trace specifically to engineers not being told the business reason behind a feature before building it. Rather than just predicting 'some teams will ship late,' the theory names which teams should be the exception: any team whose lead insists on briefing engineers on the business context up front should hit its deadlines at a normal rate, even though the company's overall deadline-miss culture is otherwise uniform. Checking deadline performance specifically against which teams brief context up front, rather than against team size, seniority, or workload, is the real test of the theory."
critical-questions:
  - "This test requires being able to independently identify who counts as a 'conservative feminist' without circularity -- if the only evidence for someone rejecting the male-over-female ranking is that they turn out to be pro-choice, the prediction can't be checked against anything but itself. What independent marker would identify conservative feminists before knowing their abortion stance, so the prediction is actually being tested rather than assumed?"
  - "The prediction is directional (this subgroup should be pro-choice) but not quantitative (how large should the subgroup be, and how much of the pro-choice-conservative population should it account for). If only some conservative feminists turn out to be pro-choice, or if plenty of pro-choice conservatives turn out not to reject the male-over-female ranking, does the theory survive as partially right, or does an unquantified directional prediction dissolve into unfalsifiability the moment it faces messy real data?"
