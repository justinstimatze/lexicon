evokes: [fake-ascetic-oracle, secret-agents-make-predictions-come-true, borrowed-credibility-redirected, manufactured-track-record, kautilya-recruit-via-fake-oracle]
lineage:
  - source: primary
    text: kautilya-arthashastra-fake-ascetic-manufactured-credibility
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part IX 'Covert Operations,' section 'Creating the Secret Service,' 'Ascetics as Spies,' {1.11.13-20}."
    quote: "'Agents, acting under the cover of merchants, shall come to worship him seeking their prosperity with the help of his occult powers. His own disciples shall proclaim his accomplishments. When the people come to him, praying for wealth, he should make predictions with the help of palmistry and similar techniques as well as the [secret] signs made by his disciples... Secret agents and other clandestine operators shall make the predictions come true. [Such an agent shall also be on the look-out for suitable recruits for Government service.] If he finds, among the visitors, someone with spirit, intelligence, and eloquence, he shall predict for him good fortune from the king and association with a minister, who shall then appoint the recommended person in a Government post.'"
canonical-instances:
  - "A stock-tip newsletter builds a reputation for uncanny accuracy by quietly manipulating the outcomes of its early, small, closely-watched calls (or by issuing so many contradictory predictions to different subscriber lists that some list always looks right in hindsight), then uses the resulting reputation for infallibility to sell a completely different, unverifiable product — a premium subscription whose actual advice quality was never what built the initial trust."
  - "An online reviewer builds a reputation for uncannily accurate, prescient product recommendations by reviewing many products where the reviewer has arranged in advance (through early access, insider information, or seeding) to already know which will succeed, then leverages that track record to promote a genuinely uncertain recommendation (an investment, a political position) that rides on trust earned in an entirely different, secretly-controlled domain."
critical-questions:
  - "how would a target of this technique actually detect it in real time — is there any observable signal that distinguishes a genuinely earned track record from a manufactured one, short of investigating the mechanism behind each individual 'accurate' prediction, which is exactly the kind of scrutiny a good con is designed to survive?"
  - "does this pattern require the credibility-domain and the payload-domain to be as disconnected as prophecy and career recommendations, or does it work just as well (or better) when they're adjacent enough to seem naturally connected — does closer proximity between the two domains make the technique more or less detectable?"
  - "is there a meaningful difference between this and ordinary reputation-building through genuinely good early work that happens to be highly visible and easy to verify — at what point does 'build trust through demonstrated competence, then use that trust to support a harder-to-verify claim' stop being manipulative and become simply how legitimate expertise is normally established and extended?"
