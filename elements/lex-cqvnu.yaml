id: lex-cqvnu
name: name-to-referent-correspondence-precedes-effective-coordinated-action
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when coordinated action is attempted across multiple parties (engineering team, organization, AI-system + operator, policy implementation, legal regime, scientific collaboration) and the relevant NAMES (category labels, role definitions, requirement specifications, statutory terms, evaluation benchmarks, API contracts) do NOT track the realities they purport to name. Confucius's transferable contribution: when names do not correspond to realities, language fails to track truth; when language fails, coordinated action fails; when action fails, downstream institutions (judgment, sanction, reward, infrastructure) cascade into incoherence. The Master: `If names be not correct, language is not in accordance with the truth of things. If language be not in accordance with the truth of things, affairs cannot be carried on to success.` The cascade: incorrect names → incoherent language → failed action → failed proprieties → mis-applied sanctions → people can't move hand or foot. Transferable applications: (a) software engineering (variable + function + API naming — Brooks 1995 *Mythical Man-Month*; Hickey 2013 `Simple Made Easy`; Martin 2008 *Clean Code* explicit on naming as foundation); (b) AI safety + specification (reward function design + capability evaluation; if `helpfulness` does not track what you actually want from the model, RLHF will optimize the wrong thing — composes with lex-tb3re + lex-n5cf6); (c) legal drafting + statutory interpretation (the long tradition of definitional sections; ambiguous terms → disputes → litigation cascade); (d) policy design (`affordable housing` + `essential worker` + `public interest` — if these terms don't track realities, policy implementation fails); (e) management + organizational design (job-title categories that don't match actual work distribution → role confusion → coordination failure); (f) scientific method (operational definitions; without them, claims cannot be tested + replicated); (g) ML benchmarks (if benchmark `success` does not track real-world capability, benchmark optimization misleads — explicit concern in Bowman + Etzioni + recent critical benchmarks literature 2020+); (h) diagnostic categories (DSM, ICD; mis-categorized phenomena → mis-applied treatment); (i) infrastructure specifications (NIST, ISO; the entire industrial-standard apparatus rests on definitional accuracy). The atom names the PRECONDITION character: name-to-referent correspondence is necessary BEFORE coordinated action can succeed. Failures upstream of correspondence (sloppy definition, ambiguous terms, label-reality drift over time) cascade downstream. Distinct from lex-99f5w naming-as-regulation (naming-as-rule-system-act); distinct from lex-zxrtf naming-as-power (who-controls-naming); distinct from lex-5qkj9 naming-a-structural-problem-recasts-the-namer-as-its-source (different mechanism). All three are about POWER + REGULATION; lex-cqvnu is about CORRESPONDENCE + COORDINATION. Distinct from lex-tb3re a-measure-pushed-as-a-target-ceases-to-be-a-good-measure (Goodhart — about gaming-after-target; lex-cqvnu is about correctness-of-the-name-itself). They compose: lex-cqvnu says the name must track reality to start with; lex-tb3re says even when it does, optimizing on it as a target degrades the tracking. Distinct from lex-n5cf6 + lex-nbk6e (Manheim-Garrabrant Goodhart variants — about how metric-gaming happens). Use when (i) coordinated action is failing + the diagnostic points to name-reality mismatch upstream, (ii) a specification or definition is being designed for downstream coordination, (iii) policy + legal + benchmark terms have drifted from their original referents. Counter-move: audit the names against the realities; trace the cascade from name to action; rectify the names BEFORE acting; design definitional rigor in upstream."
