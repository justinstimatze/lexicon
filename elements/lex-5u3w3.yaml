id: lex-5u3w3
name: avoid-decisive-battle-and-let-a-stronger-foe-decay
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you face an opponent whose force is concentrated, battle-tested, and currently superior, but whose position is a WASTING ASSET — sustained by supply lines, allies, or momentum that erode with time and distance from home — do not seek the decisive engagement your own weaker or unready force would lose. Instead, shadow the opponent continuously from a position of safety, deny them the battle they need, and let time do the work your army cannot yet do. Plutarch's Life of Fabius Maximus is the canonical case. Appointed dictator after Rome's catastrophic defeats at Trebia and Trasymene, Fabius assessed that 'the Carthaginians were but few, and in want of money and supplies,' and that Hannibal's whole design depended on forcing a battle: his object was 'a battle.' Fabius's countermove: 'not with intention to fight him, but with the purpose of wearing out and wasting the vigor of his arms by lapse of time, of meeting his want of resources by superior means, by large numbers the smallness of his forces... he always encamped on the highest grounds, where the enemy's horse could have no access to him. Still he kept pace with them; when they marched he followed them, when they encamped he did the same, but at such a distance as not to be compelled to an engagement... by which means he gave them no rest, but kept them in a continual alarm.' Hannibal alone saw the danger of this strategy to himself: he 'discerned his skill and detected his tactics, and saw, unless he could by art or force bring him to battle, that the Carthaginians, unable to use the arms in which they were superior, and suffering the continual drain of lives and treasure in which they were inferior, would in the end come to nothing.' The mechanism, made fully general: identify which side's strength is a RENEWABLE resource (home terrain, local supply, allied reinforcement) and which side's strength is a WASTING one (an invading force's supplies, a hostile takeover's borrowed capital and time-limited leverage, a smear campaign's news-cycle attention, a strong opening position in a negotiation that depends on the other side staying at the table); then structure your own action to deny the decisive engagement the wasting-strength side needs, absorbing cost through endurance rather than confrontation, until the asymmetry in decay rates does the deciding. Fabius's later advice to his co-commander names the payoff condition explicitly: 'if for this year you abstain from fighting with him, either his army will perish of itself, or else he will be glad to depart of his own will... notwithstanding his victories, none of the countries or towns of Italy come in to him, and his army is not now the third part of what it was at first.'"
