id: lex-bjqgm
name: suppressing-a-grievances-expression-becomes-proof-of-its-legitimacy
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an entrenched power responds to a grievance's public expression with escalating suppression -- gag rules, censorship, mob violence against speech, purges of sympathetic officials -- expect the suppression itself to convert bystanders rather than silence the grievance. Douglass names the mechanism directly: 'It was in the nature of the system never to rest in obscurity, although that condition was in a high degree essential to its security. It was forever forcing itself into prominence. Unconscious, apparently, of its own deformity, it omitted no occasion for inviting disgust by seeking approval and admiration. It was noisiest when it should have been most silent and unobtrusive. One of its defenders, when asked what would satisfy him as a slaveholder, said 'he never would be satisfied until he could call the roll of his slaves in the shadow of Bunker Hill monument.' Every effort made to put down agitation only served to impart to it new strength and vigor.' Congress's own gag rule against anti-slavery petitions, mob attacks on abolitionist printing presses, and the purge of anti-slavery senators from their committee seats are named as instances of the same pattern -- whatever was attempted to secure slavery 'only served as fuel to the fire.' The mechanism differs from mere curiosity-driven attention (a suppressed thing becoming more visible because people want to see what's hidden): here the grievance's content was never obscure. The audience already knew what was being suppressed; what changes is its judgment of the suppressor, once the suppressor answers the grievance with force instead of argument -- the act of suppression itself becomes the evidence that the argument could not be won."
related: [lex-ws2gv, lex-ryycm]
evokes: [fuel-to-the-fire, the-gag-rule-against-anti-slavery-petitions, noisiest-when-it-should-have-been-most-silent, suppression-as-tacit-admission-of-a-losing-argument]
