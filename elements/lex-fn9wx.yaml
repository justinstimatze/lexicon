id: lex-fn9wx
name: naive-realism-treats-your-own-vantage-as-the-objective-view
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Brooks names naive realism as one of several 'Diminisher' habits that keep people from seeing each other clearly: 'the assumption that the way the world appears to you is the objective view, and therefore everyone else must see the same reality you do. People in the grip of naive realism are so locked into their own perspective, they can't appreciate that other people have very different perspectives.' He grounds it in an old joke: a woman on one bank of a river calls across to a man on the other, 'How do I get to the other side of the river?' and he shouts back, 'You are on the other side of the river!' Each of them experiences their own bank as simply where they are -- the unmarked, default location -- and the other bank as 'the other side,' a special case needing explanation. Neither is lying or being deliberately obtuse; each has mistaken the view from where they happen to stand for the view from nowhere in particular. The diagnostic payload beyond the joke: naive realism produces a specific misattribution, not just confusion. When someone else's account of a shared situation doesn't match your own, the naive-realist default skips past 'we're standing in different places' and reaches straight for 'they're biased, uninformed, or being difficult' -- because your own read doesn't register as a position at all, only as how things actually are. Transferable move: when a disagreement about a shared event or situation surfaces, notice which explanation gets reached for first, then check the cheaper, more mundane possibility underneath it -- that you are both reporting accurately from two different vantage points, neither of which is the unmarked default. The tell that naive realism is operating is the felt asymmetry: your own view doesn't feel like a perspective needing to be named as one, it just feels like what's there."
