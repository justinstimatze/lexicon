    quote: "Well, you have one king for your master, and I have another for mine. The king of Benares sent me here to fetch a fruit of the middle mango tree. Then and there I gave my life to my king, and here Iam. He who loses his life for parents or master is born at once in heaven. Therefore I shall pass at once from this animal form to the world of the gods!"
canonical-instances:
  - "A soldier captured behind enemy lines avoids execution not by begging but by invoking the specific military code of honor his captors themselves follow, framing his mission as an act of duty exactly like the one they'd expect from their own soldiers, and the captors release him on those terms."
critical-questions:
  - "Does this only work against captors who genuinely hold the code being invoked, or can a sufficiently convincing performance of shared values work even against captors who don't actually believe what they claim to?"
  - "Is there a risk that framing the appeal this precisely only works once, since captors who feel outmaneuvered by their own logic might refuse to be moved the same way a second time?"
