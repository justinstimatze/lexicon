id: lex-rf3zm
name: a-fabricated-voice-sustains-a-pursuers-false-confidence
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Once a pursuer believes they know exactly where you are, they'll interpret ambiguous evidence, sounds, movements, signals, as confirmation of that belief rather than question it, which means a fabricated voice or signal placed at the expected location can keep them occupied and confident while you're actually somewhere else entirely, acting. In Radin's Winnebago Hare Cycle, Hare tricks a pursuing being into leaving to fetch matting to smoke him out of a hole, then escapes the hole himself and plants four acorns in it, instructing one: 'If this being talks to you, you, must answer.' When the being returns and calls into the hole, an acorn answers in Hare's place: ' Hare, are you still in there?''Yes,' came the answer. 'Where else could I go? I am still here for you told me to remain here;' One of the acorns was speaking. Convinced, the being lights the matting, and every pop of a roasting acorn gets read as confirmation of Hare's destruction: 'one of Hare's eyes has burst.' ... When he heard a fourth report he said, 'There goes the other testicle.' The being is so satisfied by its own interpretation of the decoy that it never turns around to check, which is exactly when the real Hare, waiting nearby with a forked stick, kills it from behind. Diagnostic move: when you need to disengage from someone actively watching for you, consider whether a plausible but low-cost signal, left in the place they expect you to be, can hold their attention and confirm their assumptions for long enough that where you actually are stops mattering to them."
