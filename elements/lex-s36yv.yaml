id: lex-s36yv
name: destroying-your-own-ability-to-retrieve-a-thing-defeats-future-relapse
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Anticipating that a future version of yourself will relapse into an old attachment, deliberately destroying your own ability to locate or retrieve the object of that attachment closes off the retrieval path before the weaker future self ever gets a chance to act on it. In the Jataka's tale of the Spade Sage, an ascetic renounces the world six times but backslides each time out of attachment to his one possession, a spade — always by hiding it and going back for it. On the seventh attempt, rather than simply hiding it again, he throws it into a river with his eyes shut specifically so he won't see where it lands and be tempted to fish it out. The precommitment doesn't strengthen his willpower; it removes the option his willpower kept failing against."
related: [lex-jj68r]
evokes: [jataka, ekanipata, kuddala-jataka, destroying-retrieval-to-bind-a-future-relapse, precommitment-removes-the-option-not-the-temptation]
lineage:
  - source: primary
    text: jataka-chalmers1895-kuddala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 70, Kuddala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "fearing lest if he saw where it fell, he should come back and fish it out again, he whirled the spade thrice round his head by the handle and flung it with the strength of an elephant right into mid-stream, shutting his eyes tight as he did so."
canonical-instances:
  - "Someone who keeps relapsing into checking a specific ex-partner's social media, always resisting for a while and then giving in, permanently blocks the account and deletes the app entirely rather than hiding it or setting a time limit, removing the retrieval path instead of relying on willpower to hold the next time the urge returns."
critical-questions:
  - "Does this technique only work for attachments to a single, discrete, destroyable object, the way the spade is, or is there an equivalent move for attachments to something that can't be thrown away, like a person, a habit, or a memory?"
  - "What happens if the destruction itself is only partial or reversible with enough effort — does the technique fail gracefully, or does a relapsing self simply find a way to reconstitute what was destroyed?"
status: active
