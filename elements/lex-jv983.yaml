lineage:
  - source: practitioner
    text: wikipedia-fluency-heuristic-and-processing-fluency
    citation: "Wikipedia 'Fluency heuristic' AND 'Processing fluency' (en-wp). The substrate-claim: when an object, message, or claim is processed more easily — faster recognition, smoother reading, more familiar phrasing, more skillful delivery — the mind infers it has higher value (truthfulness, importance, quality) on whatever dimension is being judged. The mechanism is metacognitive: the felt-ease of processing serves as an implicit cue that the COGNITIVE SYSTEM uses as evidence about the OBJECT — even though the felt-ease is a property of the brain meeting the surface, not of the surface meeting reality. Foundational empirical work cited in the literature: Jacoby & Brooks 1984 + Jacoby & Dallas 1981 (perceptual fluency as cue to prior exposure); Reber & Schwarz 1999 *Consciousness and Cognition* 8(3):338-342 (perceptual fluency raises truth-judgments); Hertwig et al. 2008 (retrieval-fluency as proxy for real-world quantities); Schwarz 2004 and Alter & Oppenheimer 2009 (canonical syntheses of the metacognitive-experiences literature); Volz, Schooler & von Cramon 2010 (fMRI of fluency-based judgments, claustrum activation). Practitioner-payload: fluent-confident output reads as true, skillful communication is taken more seriously regardless of underlying logic."
    quote: "[Wikipedia 'Fluency heuristic', via ZIM:] when one object 'is processed more fluently, faster, or more smoothly than another, the mind infers that this object has the higher value with respect to the question being considered ... the more skillfully or elegantly an idea is communicated, the more likely it is to be considered seriously, whether or not it is logical.' [Wikipedia citing the Hertwig et al. 2008 empirical confirmation:] 'differences in recognition latencies are indicative of criteria across five different environments' (cities, companies, music artists, athletes, wealthiest people)."
  - source: primary
    text: reber-schwarz-1999-effects-of-perceptual-fluency-on-judgments-of-truth
    citation: "Rolf Reber and Norbert Schwarz, 'Effects of Perceptual Fluency on Judgments of Truth,' *Consciousness and Cognition* 8(3):338-342 (1999). The most-cited primary in the processing-fluency-as-truth-cue literature. Single-exposure experimental design: identical statements presented in moderately-vs-highly visible colors against white background; participants judged truth. Moderately-visible statements judged true at chance; highly-visible above chance. The color manipulation isolated perceptual fluency from exposure-frequency confounds. The transferable claim for lex-jv983 is exactly Reber-Schwarz's bottom-line: 'any variable that increases experienced ease of processing is also likely to increase judgments of truth.' graduation from NOT-VERIFIED placeholder to primary attestation."
    quote: "[Reber & Schwarz 1999 *C&C* 8(3):338-342, abstract:] 'Statements of the form \"Osorno is in Chile\" were presented in colors that made them easy or difficult to read against a white background and participants judged the truth of the statement. Moderately visible statements were judged as true at chance level, whereas highly visible statements were judged as true significantly above chance level. We conclude that perceptual fluency affects judgments of truth.' [The mediation hypothesis from the introduction:] 'These dissociations between unconscious influences and intentional recollection suggest that a process such as perceptual fluency may mediate between repeated exposure and truth rating.' [Discussion, the load-bearing claim:] 'In summary, we conclude that perceptual fluency affects judgments of truth independent of exposure frequency. Specifically, the same statements were endorsed as true at chance level when presented in moderately visible colors, but at significantly above chance level when presented in highly visible colors. Importantly, the color manipulation allowed us to test the impact of fluency in a single-exposure paradigm, thus avoiding the ambiguities associated with multiple exposures as a manipulation of ease of processing. Consistent with Begg et al.'s (1992) analysis, the present findings suggest that any variable that increases experienced ease of processing is also likely to increase judgments of truth. This presumably reflects that statements that are easy to process are experienced as familiar (e.g., Whittlesea et al., 1990), thus leading participants to feel that they have heard or seen this before, suggesting that it is probably true.' [Practitioner-extraction: Reber-Schwarz isolated the transferable mechanism — felt-ease-of-processing → felt-familiarity → felt-truth — in a clean single-exposure design that prior fluency literature (relying on repeated-exposure manipulations) could not. The lex-jv983 fluency-trap atom names the failure mode this mechanism produces wherever ease-of-processing diverges from substrate-basis: in LLM completions, in jargon-laundered claims, in confident-rhetorical delivery, in skilfully-presented arguments without underlying derivation. Reber-Schwarz grounds the existence-of-the-mechanism axis; the application-axes (LLM-output, social-context, load-bearing-vibes detection) are practitioner-extraction within the Reber-Schwarz frame.]"
canonical-instances:
  - "fluent confident-sounding output reads as true: smoothness, easy processing, and right-jargon all register as substance even when no underlying inference holds — surface ease mistaken for evidence"
  - "a model answer that reads cleanly and uses the right jargon gets approved without re-derivation; weeks later the bug surfaces and the underlying calculation never held up — fluent surface masking absent substrate"
  - "when an explanation flows easily, you trust it more — but ease-of-processing is a property of your brain meeting the surface, not of the explanation meeting reality"
  - "the LLM equivalent: completing-fluently across a knowledge gap because the next-token distribution is sharp, not because the substrate-knowledge is dense — high token-confidence is not high content-confidence"
  - "an assertion delivered with rhythm and confidence that, on inspection, has no underlying support — the smoothness IS what's masquerading as evidence"
  - "the catch move: slowing down to ask 'what concrete thing would have to be true for this to hold?' surfaces unargued steps that the confident fluent surface was concealing"
critical-questions:
  - "the basis-trace test: can you name the SPECIFIC observation, derivation, or measurement that supports this claim? Fluent-confident output often cannot survive the question 'how do you know?' — the smoothness was the substitute for the substrate. Practitioner-discipline: when accepting a fluent claim, demand the basis-trace before treating it as established"
  - "the slow-re-read test: re-read the claim slowly with deliberately broken rhythm. The fluency-effect depends on the brain's pattern-completion smoothness; slowing breaks the smoothness and surfaces the gaps. Practitioner-discipline: deliberately interrupt the fluent reading to surface what the smoothness was concealing"
  - "the jargon-laundering check: does the claim depend on technical-vocabulary that the speaker (or you, as the audience) wouldn't be able to define operationally? Jargon-as-confidence-cue is a specific fluency-trap variant. Practitioner-question: would the claim survive substitution of the jargon with plain language? If not, the jargon was doing fluency-work rather than precision-work"
  - "the load-bearing-vibes check: which specific claims in this argument are 'load-bearing vibes' — claims that the rest of the argument depends on but that themselves rest only on LLM-fluency rather than on verifiable observations? An internal load-bearing-vibes detector's warning is specifically engineered to surface this failure-mode in real time. Practitioner-discipline: when the warning fires, treat the flagged claim as candidate-for-verification, not as confirmed"
  - "the social-context modulator: fluency-trap exposure scales with social-trust in the speaker. A flagged claim from a stranger gets scrutiny; the same claim from a trusted-colleague slides through. Practitioner-question: am I accepting this BECAUSE of speaker-trust rather than BECAUSE of basis? Speaker-trust is appropriate when the speaker has demonstrated reliable basis-tracing; it becomes fluency-trap when it bypasses basis-tracing"
status: active
