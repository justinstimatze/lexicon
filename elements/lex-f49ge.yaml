id: lex-f49ge
name: recognizing-overriding-value-justifies-sacrificing-everything-else
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Once something is recognized as worth more than everything else a person owns combined, liquidating all of it to acquire that one thing stops being reckless and becomes the obviously correct trade — a man sells everything to buy a field with hidden treasure in it, and a merchant sells his entire stock to buy one pearl. The two cases differ in how the recognition arrives: one finds the value by accident while looking for something else, the other finds it only after a career spent deliberately searching for exactly this."
related: []
evokes: [kjv, treasure-hid-in-a-field, pearl-of-great-price, sold-everything-he-had, one-thing-worth-more-than-everything-else]
lineage:
  - source: primary
    text: kjv-1611-matthew-13-treasure-and-pearl
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), Matthew 13:44-46. Verified verbatim against a direct extraction of the held copy."
    quote: "Again, the kingdom of heaven is like unto treasure hid in a field; the which when a man hath found, he hideth, and for joy thereof goeth and selleth all that he hath, and buyeth that field. Again, the kingdom of heaven is like unto a merchant man, seeking goodly pearls: Who, when he had found one pearl of great price, went and sold all that he had, and bought it."
canonical-instances:
  - "A researcher who has spent a decade evaluating job offers finally gets one from the one lab doing exactly the work they care about, and takes a large pay cut without hesitation — the years of deliberate searching are what let them recognize the offer's value the instant it appeared, unlike a colleague who stumbles into an equally rare opportunity by pure accident and has to be talked into seeing what they're looking at."
critical-questions:
  - "Has the overriding value actually been verified, or is the excitement of the discovery being mistaken for the value itself — what would distinguish a genuine once-in-a-career find from a costly infatuation with something that only looks like one?"
status: active
