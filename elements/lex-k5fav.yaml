lineage:
  - source: primary
    text: hyde-lokis-quick-repair-of-the-idunn-breach-forfeits-transformation
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 4, '\"An Attack of Accidents,\"' on Loki's theft and quick recovery of Idunn from the Prose Edda. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "But it doesn’t happen. Something truly new might have emerged from that uncanny coincidence in which time and eternity contaminate and fertilize each other, but no, the whole thing was just mischief. Loki quickly repairs the damage. When he brings Idunn back to Asgard, one of the giants gives chase; the gods build a fire at the Asgard wall and burn him to death. So much for that taste of immortality. The wall is sealed again, and the good-for-nothing drifters of time no longer threaten the eternals (though it should be said that the eternals will be a little more alert after this event; Loki keeps them lively)."
canonical-instances:
  - "A company's carefully siloed departments genuinely merge and collaborate during a crisis that forces them to share information and resources, but once the crisis resolves, leadership quickly restores the old reporting lines and boundaries, and the organization emerges no more integrated than before, just more prepared for the next emergency."
  - "A rigid family's estrangement briefly dissolves during a medical emergency that forces everyone back into the same room, sharing real vulnerability, but once the crisis passes, the old distance and silence reassert themselves completely, and nothing about how the family actually relates to each other has changed."
critical-questions:
  - "Is 'the wall is sealed again' actually accurate, or does the parenthetical note that 'the eternals will be a little more alert after this event' constitute a real, if modest, lasting change that the diagnostic's framing understates by focusing only on the restored boundary?"
  - "Does efficient repair always forfeit transformation, or does it sometimes represent a legitimate choice to preserve a system's stability over pursuing disruptive change that might not have produced anything better than what existed before the breach?"
  - "Who gets to decide whether a breach is repaired quickly, and does that decision itself reveal something about power within the system -- in this myth, it's the gods, the very party most invested in restoring the old order, who control whether the wall gets rebuilt?"
