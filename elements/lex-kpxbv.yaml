lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Prediction and Prophecy in the Social Sciences' (address delivered to the Plenary Session of the 10th International Congress of Philosophy, Amsterdam, 1948; Section XII not previously published before this 1963 collection), Ch. 16 of Conjectures and Refutations (Routledge Classics, 2002), pp.465-466, Section XII. The quote is split with an ellipsis where a footnote-marker digit sits glued directly against the word 'Nature' with no separating space."
    quote: "'The earlier, naturalistic, revolution against God replaced the name \"God\" by the name \"Nature\"... Theology, the Science of God, was replaced by the Science of Nature; God's laws by the laws of Nature; God's will and power by the will and the power of Nature (the natural forces); and later God's design and God's judgment by Natural Selection. Theological determinism was replaced by a naturalistic determinism; that is, God's omnipotence and omniscience were replaced by the omnipotence of... Hegel and Marx replaced the goddess Nature in its turn by the goddess History. So we get laws of History; powers, forces, tendencies, designs, and plans, of History; and the omnipotence and omniscience of historical determinism. Sinners against God are replaced by \"criminals who vainly resist the march of History\"; and we learn that not God but History (the History of \"Nations\" or of \"Classes\") will be our judge.'"
canonical-instances:
  - "A tech team declares that it has moved past political, opinion-driven product decisions and now 'lets the data decide.' Product choices that once had to survive a manager's argued-for rationale now get justified by a dashboard number nobody on the team is allowed to question in the room -- the specific claims still don't get individually examined, the dashboard has simply inherited the manager's old, unquestioned authority."
  - "An economics department prides itself on having replaced normative, values-laden reasoning with a supposedly value-free market efficiency criterion. Policy proposals that fail an efficiency model are dismissed the way heresies once were, without anyone checking the model's own assumptions with the scrutiny normally reserved for a contested claim -- efficiency inherited the seat vacated by the older moral authority, obedience included."
critical-questions:
  - "Isn't this just a rhetorical flourish -- surely Nature and History are actually explained by evidence in a way theology never was, so the analogy is unfair? The claim isn't that the CONTENT of naturalistic or historicist explanation is as weak as theology's -- it's that a specific bad HABIT (granting one named Authority blanket, unexamined deference and final judgment-power) can survive a genuine improvement in content. A field's evidence can be genuinely excellent and its deference structure can still be a straight import from theology, quietly carried over intact. That import is exactly the pattern worth checking for, on its own, apart from any judgment about how good the evidence is."
  - "How do you tell a legitimate authority (one that's earned deference through track record) from a relocated one wearing the same clothes as the old bad authority? Track record alone won't settle it; what settles it is falsifiability in practice -- ask whether a specific claim attributed to the new Authority (Nature says X, the Data shows Y, the Market wants Z) could in principle be checked and overturned by someone in the room, or whether disagreement gets waved off as a category error, a failure to understand Nature or the Data or the Market, rather than treated as a claim that could simply turn out wrong."
