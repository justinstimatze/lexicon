name: act-only-once-the-one-who-could-undo-it-is-watching
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you discover a decisive advantage over someone who has the power to reverse or deny your success, don't act on it the moment you have the chance -- wait until that person is physically present as a direct witness, because acting where they can't dispute what happened afterward is worth more than acting a moment sooner. In Cushing's telling, two gods discover a maiden's secret corral, packed with every deer she's been illegitimately hoarding, before she arrives at the scene. The impulsive younger brother wants to shoot immediately; the elder stops him with a specific, tactical reason: 'If we should happen to kill one of these deer before she comes, perhaps she has some magic power or knowledge by which she would deprive us of the fruits of our efforts.' They wait until she's climbing the cliff toward them, and only then release the arrow, so that 'when the maiden appeared on the spot the deer was lying dead not far away' -- an outcome she witnesses directly, with no gap in which to intervene, deny, or use whatever hidden power protects her secret. The advantage was real the moment they found the corral, but it only became unassailable once it was executed in front of the one person who could have taken it away. Diagnostic move: when you've found the leverage to force an outcome against someone with the power to reverse it, resist the urge to act the instant you're able to -- wait for the moment they're present and unable to deny or undo what's happening, since an advantage exercised in private, before the interested party can witness it, leaves room for them to dispute, hide, or reverse it that a directly-witnessed fait accompli does not."
