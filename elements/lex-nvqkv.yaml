lineage:
  - source: primary
    text: eastman-unktomee-elk-false-alarms-spend-trust
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Tenth Evening: Unktomee and the Elk.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Fly! fly! I am struck by an arrow!' But when no hunter appeared, they were provoked... 'Unktomee is deceiving us; it was only a stick that fell from the tree!' ... a second time the Elks were aroused in vain. They were still more displeased... A third time they lay down, but this time the Elks stole away from Unktomee and left him sleeping, for they had scented the hunter. When the hunter came, therefore, he found only the chief Elk still sleeping, and he let fly an arrow and wounded him severely."
canonical-instances:
  - "An on-call engineer pages the whole team twice for issues that turn out to be non-critical monitoring glitches, and when a genuine production outage hits a week later, colleagues assume it's another false alarm and respond slowly, having already spent their willingness to drop everything on the two prior pages that turned out to be nothing."
  - "A community activist group cries emergency over two situations that turn out to be overstated, and when a genuinely urgent issue arises later, local media and supporters treat the new alarm with the same skepticism earned by the previous two, responding too slowly to matter."
critical-questions:
  - "how does someone actually know, in the moment of an uncertain threat, whether raising the alarm is worth the risk of spending trust on a possible false positive -- is there a way to calibrate this in advance, or is the cost only ever visible in hindsight?"
  - "is the herd's decision to abandon Unktomee entirely, rather than simply responding more skeptically or slowly, actually the right response to two false alarms -- does this framework risk justifying total abandonment as proportionate when a middle-ground response might have saved him without costing the herd anything?"
  - "does this pattern hold the same way when the false alarms are made in good faith (genuine but mistaken caution) versus when they're careless or manipulative, as Unktomee's specifically were -- should the response calibrate differently based on why the credibility was spent, not just that it was?"
