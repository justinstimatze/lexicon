id: lex-2zcrn
name: repeated-confirmation-doesnt-settle-doubt-and-doesnt-prevent-failure-that-matters
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Testing something repeatedly in private and watching it succeed every time does not reliably settle suspicion about it, and even a track record of confirmed successes offers no guarantee it will still work at the one moment that actually counts, in front of the people who are depending on it. In Radin's Winnebago Trickster cycle, Trickster distrusts a gift from polecat before he has even left: 'Polecat used to be unreliable. Perhaps he has fooled me and I have not discovered it yet.' He tests it on a rock on the way home and it works completely: 'he turned his anus toward the rock and broke wind and the rock was blown to pieces. 'Well, the little wayward fellow did tell the truth after all!'' The confirmation does not resolve his doubt; it merely narrows where the doubt can still hide: 'I am sure that he did not give me the full amount... he is a very peculiar fellow. He did more than I expected in giving me three rounds of ammunition.' Having privately confirmed the gift works, repeatedly, he then needs it in front of his hungry family to feed real deer, and it fails completely and humiliatingly: 'he strained himself very much but with each straining simply soiled himself all the more... Then all the deer left. They even stepped on him and bruised him.' Every private test had succeeded; the one use that mattered did not. Diagnostic move: don't treat a string of successful private tests as proof that suspicion has been resolved or that the real deployment is safe -- doubt that survives repeated confirmation is often not tracking evidence at all, and confirmed reliability under low-stakes conditions is not the same claim as reliability under the one condition you actually need it for."
