canonical-instances:
  - "'Theory' means a rigorously tested explanatory framework to a scientist, but in popular controversy over evolution or climate change the word gets read as 'unproven guess' — the charged, dismissive popular sense increasingly crowds out the technical one even among people who should know better, because the controversy is louder than the textbook definition."
  - "'Privilege' has a precise, narrow technical sense in law (a legal exemption from an otherwise-applicable duty) and a heavily charged sociological sense in contemporary discourse about advantage and disadvantage — a lawyer using 'privilege' in the legal sense in a mixed audience will be heard through the charged sense by default, regardless of context, unless they flag the distinction up front."
critical-questions:
  - "Merton offers naming the reflex as a partial fix ('may perhaps be enough to nullify it') but immediately hedges ('or, less optimistically, to put it in question') — does explicit disambiguation actually work reliably against a well-trained affective reflex, or does it only work for readers already inclined to accept a technical correction, leaving the reflex intact for everyone else?"
  - "Is affect-charge really an independent variable from frequency of exposure, or does the controversial sense dominate simply because it gets used far more often in public discourse than the technical sense ever does — would a technical sense used equally often, but without any special affective charge, resist being crowded out just as poorly?"
