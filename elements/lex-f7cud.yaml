canonical-instances:
  - "An employee who was just talked into taking on an unpaid extra project through a manager's flattery ('you're the only one who could handle this') notices the manager immediately asking for another favor afterward, and this time declines, specifically because they've just recognized the flattery-to-favor pattern being used on them, not because they've become generally more assertive."
  - "A person who realizes mid-argument that a partner's compliment right before a big ask was calculated to soften them up for a request they'd normally refuse becomes noticeably less willing to grant that partner's very next request, even a reasonable one, purely because the pattern has just become visible."
critical-questions:
  - "does this narrow, source-specific suspicion fade quickly once the immediate sting of the loss passes, meaning the protection this insight offers is temporary rather than a lasting change in how someone responds to flattery from that source?"
  - "does refusing an otherwise-reasonable request purely because it comes right after being manipulated risk punishing genuinely innocent asks, damaging a relationship or missing real cooperation over a request that happened to be unrelated to the manipulation?"
  - "why does recognition only protect against the very next request rather than immediately updating the person's general vulnerability to flattery -- does this suggest the underlying susceptibility to flattery is much harder to actually fix than a single moment of clarity can address?"
