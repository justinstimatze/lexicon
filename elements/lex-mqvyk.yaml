evokes: [crip-time, able-bodied-linear-development-as-default, time-falls-rather-than-passes, prognosis-time-replaces-life-stage-time, curative-time-vs-crip-time, eccentric-economic-practices, compulsory-able-bodiedness, queer-time-overlaps-crip-time, halberstam-strange-temporalities, ellen-samuels-six-ways-of-looking-at-crip-time, normate-tempo-is-one-tempo-not-the-tempo, schedule-as-built-infrastructure-not-natural-law, disability-as-temporal-substrate-pluralism]
lineage:
  - source: primary
    text: kafer-2013-feminist-queer-crip-chapter-1
    citation: "Alison Kafer, *Feminist, Queer, Crip* (Indiana University Press 2013), Chapter 1 'Time for Disability Studies and a Future for Crips,' especially the section 'Queer Time, Crip Time' (pp.34-46). Kafer's transferable contribution: a sustained argument that 'crip time' is not slower or impaired clock-time but a distinct temporal substrate that exposes able-bodied linear development as one temporality among many. (i) The diagnosis: dominant temporal frameworks 'presume a linear development from a dependent childhood to an independent adulthood defined by marriage and reproduction' and these 'normative narratives of time form the base of nearly every definition of the human in almost all of our modes of understanding, from the professions of psychoanalysis and medicine, to socioeconomic and demographic studies on which every sort of state policy is based, to our understandings of the affective and aesthetic' (pp.35, quoting Halberstam). (ii) The distinguishing move from cure: Kafer distinguishes 'crip time' from 'curative time' — curative time is the medical frame that treats disability as a temporary failure-state to be restored to clock-time; crip time treats the assumption-of-restoration as itself the problem. (iii) The operational mechanism: crip time names how 'illness and disability...cause time to slow, or to be experienced in quick bursts...lead to feelings of asynchrony or temporal dissonance; depression and mania are often experienced through time shifts, and people with various impairments move or think at a slower (or faster) pace than culturally expected. These shifts in timing and pacing can of necessity and by design lead to departures from straight time' (p.34). The 'falling time' / 'prognosis time' framing (pp.36-37): time 'falls rather than passes' (Boellstorff's coincidence-time read through Chandler's literal falling); prognosis interrupts 'the idea of a time line and all the usual ways one orients oneself in time — one's age, generation, and stage in the assumed lifespan' (Jain, quoted p.36). (iv) The substrate-pluralism extension via Halberstam's 'eccentric economic practices' (p.35): crip-time produces alternative organizations of activity-in-time (working around inaccessible infrastructure, organizing income across disability-benefit schedules) that are not failures-to-keep-up with normal economic time but coherent ALTERNATIVES. (v) The Samuels canonical formulation Kafer cites: Ellen Samuels names crip-time as 'resistant orientation' (p.39, citing Samuels 2017 'Six Ways of Looking at Crip Time,' DSQ 37(3)) — 'Crip time is broken time. It requires us to break in our bodies and minds to new rhythms, new patterns of thinking and feeling and moving through the world.'"
    quote: "[On normative temporal narratives, p.35, quoting Halberstam:] Normative narratives of time, in other words, form the base of nearly every definition of the human in almost all of our modes of understanding, from the professions of psychoanalysis and medicine, to socioeconomic and demographic studies on which every sort of state policy is based, to our understandings of the affective and aesthetic. These normative narratives of time presume a linear development from a dependent childhood to an independent adulthood defined by marriage and reproduction. [On crip time's mechanism, p.34:] Queer time is often defined through or in reference to illness and disability, suggesting that it is illness and disability that render time 'queer.' Not only might they cause time to slow, or to be experienced in quick bursts, they can lead to feelings of asynchrony or temporal dissonance; depression and mania are often experienced through time shifts, and people with various impairments move or think at a slower (or faster) pace than culturally expected. These shifts in timing and pacing can of necessity and by design lead to departures from 'straight' time, whether straight time means a firm delineation between past/present/future or an expectation of a linear development from dependent childhood to independent reproductive adulthood. [On falling-time, p.36, drawing on Eliza Chandler:] Falling on the sidewalk, she explains, becomes a moment of falling into disability; it is the falling that identifies her to others as disabled, plunging her into categories and identifications that trip her up. Falling makes passing impossible, even as she moves from one to the other moment by moment... It is, at least in part, this link between falling and failure that renders crip temporalities queer. [On prognosis-time, p.37, quoting Jain:] Cancer diagnoses and prognoses interrupt 'the idea of a time line and all the usual ways one orients oneself in time — one's age, generation, and stage in the assumed lifespan.' Living in 'prognosis time' is thus a liminal temporality, a casting out of time; rather than a stable, steady progression through the stages of life, time is arrested, stopped. (Kafer 2013, Feminist, Queer, Crip, Indiana University Press, Ch.1 pp.34-37)"
canonical-instances:
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz is the generic move of making vague descriptions testable and fires on any unexamined description. lex-mqvyk is the specific critique of one normalized description (able-bodied clock-time) being treated as substrate-fact when it is actually one calibrated infrastructure among many."
  - "operationally distinct from lex-6qevt lived-position-as-irreplaceable-epistemic-source: lex-6qevt is the standpoint-epistemology move — the subordinated position sees something the dominant cannot. lex-mqvyk is the substrate-pluralism move — the subordinated position occupies a different substrate, not just a different angle. Crip-time is a specific application of lex-6qevt to the temporal substrate, but the substrate-pluralism extension generalizes past disability to any institutional infrastructure built around one body-tempo."
  - "operationally distinct from lex-a3tfj testimonial-injustice-deflates-credibility (Fricker): testimonial injustice is credibility deflated by stereotype. lex-mqvyk is temporal substrate presumed universal. They compose — a disabled speaker's testimony about needing different time can be doubly defeated, once by stereotype and once by the listener's temporal substrate making the request seem unreasonable — but the underlying mechanisms differ."
  - "operationally distinct from lex-k8bsd outsider-within-standpoint (Hill Collins): outsider-within is the angle-of-vision produced by structural inside/outside straddling. lex-mqvyk is the temporal substrate a body inhabits. Crip-time is the temporal counterpart to outsider-within's positional angle, but the two operate on different axes (substrate vs. vantage)."
  - "Eliza Chandler's falling-on-the-sidewalk (Kafer p.36, citing Chandler 2010): Chandler describes the experience of falling as plunging her into disability identification visible to others — the falling makes passing impossible. Kafer reads this as the worked-example of crip-time's substrate-difference: clock-time presumes passing (continuous forward motion); falling-time names the disabled body's experience as not slow-clock-time but a different temporal organization where falling-into-failure and falling-into-success coincide in the same instant. The transferable shape: time doesn't pass at the same rate across all bodies; falling is one of crip-time's modalities."
  - "Sarah Lochlann Jain's prognosis-time (Kafer p.37, citing Jain 2007): cancer diagnoses and prognoses interrupt 'the idea of a time line and all the usual ways one orients oneself in time.' The diagnosed body lives in a 'liminal temporality, a casting out of time' — rather than a stable progression through life stages, time is arrested. Paradoxically, the very notion of prognosis sets up the future as known and knowable while also making futurity tenuous and precarious. The transferable shape: medical diagnosis is a temporal substrate-shift, not a clock-time event."
  - "Halberstam's AIDS-time as queer-and-crip time (Kafer pp.35-36, citing Halberstam 2005): gay communities responding to the AIDS crisis made community 'in relation to risk, disease, infection, and death' — the AIDS-time substrate is 'the here, the present, the now.' Kafer reads this as crip-time as much as queer-time: the epidemic forced a substrate-shift away from linear-future temporal logics. The transferable shape: when 'the future' becomes uncertain, the temporal substrate of urgency-in-the-present replaces planning-toward-the-future as the operative cadence."
  - "Halberstam's 'eccentric economic practices' (Kafer p.35): queer/crip subcultures organize income, work, and time differently — 'a way of life' that is 'not about a way of having sex' but about working-around the infrastructure that's calibrated to able-bodied able-minded normate-tempo. Kafer reads disability-benefit cycles, intermittent-employment patterns, and pacing-based work arrangements as crip-time's economic manifestations. The transferable shape: economic-time is a built infrastructure (paychecks-every-two-weeks, benefit-renewal-quarterly, retirement-at-65) not a natural law; crip-time exposes the body it's calibrated to."
  - "Ellen Samuels's 'crip time as resistant orientation' (Kafer p.39, citing Samuels 2017 'Six Ways of Looking at Crip Time' DSQ 37(3)): Samuels canonical formulation — 'Crip time is broken time. It requires us to break in our bodies and minds to new rhythms, new patterns of thinking and feeling and moving through the world.' The transferable shape: crip-time is not adapting to clock-time more carefully; it's adapting clock-time-itself to non-normate bodies, which means dismantling the assumption that clock-time is the substrate everyone runs on."
  - "Software-development analog (transferable extension Kafer's argument licenses): the 'normal' build cycle of a project assumes a certain energy budget across the team — 9am-5pm focus blocks, weekly sprint cadences, quarterly OKRs. A team with chronic-illness, ADHD, or non-monogamous parenting members runs on a different substrate (interrupted focus blocks, energy that swings on biological cycles, peak-productivity hours that don't align with the standard meeting calendar). The crip-time move generalizes: don't ask 'how can these workers keep up with the normal schedule' but 'what schedule would emerge if it were calibrated to a different temporal substrate.'"
  - "operationally distinct from lex-da3g3 iteration: iteration is the cycle-of-attempt-feedback primitive. crip-time is the substrate the iteration runs on — its cadence, life-stage assumptions, and prognosis-frame. lex-da3g3 says 'iterate'; lex-mqvyk says 'whose iteration-rate are you presuming?'"
  - "operationally distinct from lex-ct5ux bounded-daily-energy-units (Miserandino spoon-theory): spoon-theory is the SPECIFIC accounting-mechanism inside crip-time (energy as bounded). lex-mqvyk is the broader claim that energy-as-bounded is itself a substrate the able-bodied normate doesn't operate under. lex-ct5ux is one mechanic; lex-mqvyk is the substrate-frame."
critical-questions:
  - "whose body and whose institutional infrastructure is the 'normal' temporal substrate calibrated to? Diagnostic: when a schedule, deadline, or life-stage expectation is presented as obvious or natural, ask what body and what economic infrastructure that schedule presumes. If the answer is 'an able-bodied able-minded full-time-employed cis-het adult with stable health insurance and no caregiving responsibilities,' the substrate is one calibration among many — not the substrate."
  - "is the framing curative or crip? Curative framing: 'how do we restore X to the normal schedule?' Crip framing: 'what schedule would X be operating on if the schedule were calibrated to X's substrate?' The diagnostic is whether the conversation treats the disabled person's tempo as a deviation-from-default to be corrected, or treats the default as one tempo to be examined."
  - "what counts as 'on time'? Linear-development time assumes a sequence (dependent-childhood → independent-young-adulthood → reproductive-marriage → child-rearing → career-peak → retirement → death). Crip time can scramble this — disabled children depend longer or never become 'independent' in the normate sense; pregnancy / parenting on crip-time uses different cadences; reproduction-time may be foreclosed entirely. The question 'are you on time for your life?' presumes a clock-time that doesn't apply to every body."
  - "what's the relationship to wage-labor? Eight-hour workday + weekly paycheck + quarterly review is a built infrastructure calibrated to specific bodies. Crip-time exposes that infrastructure as one infrastructure, not natural law — what would work-time look like if it were calibrated to chronic-illness energy budgets (work in 90-minute bursts with mandatory rest), to caregivers' interrupted attention, to bodies whose peak productivity is 11pm-3am? The substrate-question is generative: it identifies the slack the current infrastructure leaves in possible economic organizations."
  - "is 'patience with crip-time' actually substrate-pluralism, or is it tolerance-of-failure? The accommodation-frame says 'we'll wait extra-long for the disabled employee to complete the task on the normal schedule.' The substrate-frame says 'the task doesn't fit on the normal schedule for anyone calibrated to a different substrate; the schedule needs reorganization, not stretching.' Discriminating these matters: tolerance-of-failure preserves the normate as default and accommodates exceptions; substrate-pluralism treats the normate as one configuration."
  - "where does crip-time generalize beyond disability? Anywhere a 'normal' temporal substrate is presumed but is actually a calibration to specific bodies and institutional infrastructure — pregnancy temporalities (normal gestation), recovery temporalities (normal injury healing), educational temporalities (normal grade progression), bereavement temporalities (normal mourning duration), creative-work temporalities (normal book-writing pace). The crip-time move applies: which body / which institution that 'normal' is calibrated to, and what would the same activity look like if it were calibrated to a different one. The atom is the substrate-pluralism-for-time move, with disability as the canonical instance."
