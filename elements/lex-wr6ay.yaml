id: lex-wr6ay
name: substitute-internal-plus-replicative-consistency-for-significance-testing
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When standard significance testing doesn't fit your data, don't just drop rigor and report everything uncritically — replace the single significance criterion with two different consistency checks that don't depend on random sampling or hypothesis independence. Merton, Reader, and Kendall, having argued that traditional significance tests don't apply to their exploratory, whole-population data, are explicit that this isn't a license for indiscriminate reporting: 'This is not to say, of course, that we have been indiscriminate in our presentation of statistical results. We have established criteria of significance for ourselves, even though these do not involve the usual and more familiar tests. Essentially, these criteria involve two related types of consistency.' The first substitute criterion checks a finding against a theoretically related, independently measured finding: 'to be considered significant, results must be internally consistent. That is, a finding with regard to one question is held to be valid only if it also holds true in connection with a closely related question. For example, we may find that, as they advance through medical school, students become increasingly likely to say that they want to know their patients only on a doctor-patient basis, and not also as friend to friend. We attach significance to this finding only when we uncover other evidence that preferences for such detached relations are progressively learned; if we find, for instance, that advanced students are more likely than their junior colleagues to say that it is important for the physician to control his affective reactions in the doctor-patient relationship.' The second checks a finding against an independent group rather than an independent question: 'results must be replicatively consistent if they are to be considered significant. That is, a finding in one group must also hold true in a second independent group, if the same general conditions prevail in both.' Between them, the two criteria substitute triangulation for probability: internal consistency asks whether a finding coheres with a different measurement of the same underlying construct within one group; replicative consistency asks whether the same finding holds across independent groups. A finding surviving both checks has support that doesn't rest on the assumptions (random sampling, hypothesis independence) that a significance test would otherwise require. Diagnostic move: when a standard statistical test's assumptions don't hold for your data — non-random samples, interdependent hypotheses, or both — don't default to reporting raw effect sizes uncritically; construct an explicit pair of consistency checks instead, one asking whether the finding coheres with a theoretically related, independently measured finding, the other asking whether it reappears in an independent group, and treat only findings passing both as established."
