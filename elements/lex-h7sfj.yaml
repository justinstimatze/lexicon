id: lex-h7sfj
name: an-induced-physiological-reflex-forces-disclosure-of-hidden-evidence
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Hidden physical evidence that no amount of questioning will produce can sometimes be forced out through an involuntary bodily reflex the suspects can't control or fake their way around. In the Jataka's tale of the dog and the king's harness, the Bodhisatta dog can't get the palace dogs to confess to eating the leather, so he has grass mixed into buttermilk and fed to every dog under suspicion. Each guilty dog vomits, and the undigested scraps of leather come up with it — physical proof that bypasses denial entirely, because vomiting isn't something a dog can perform selectively to hide what's inside it. The technique works only because the evidence was still physically present and retrievable; it forces disclosure of something already there, rather than creating new evidence."
related: []
evokes: [jataka, ekanipata, kukkura-jataka, induced-reflex-forces-disclosure, physical-evidence-bypasses-denial]
lineage:
  - source: primary
    text: jataka-chalmers1895-kukkura-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 22, Kukkura-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"Let this grass be mashed up in the butter-milk, and make the dogs drink it.\" The king did so;--with the result that each several dog, as he drank, vomited. And they all brought up bits of leather!"
canonical-instances:
  - "An auditor who can't get a warehouse team to admit to falsifying inventory counts instead runs a physical recount that will make any shortfall show up automatically in the reconciled numbers, regardless of what anyone says."
critical-questions:
  - "What happens once suspects learn the specific mechanism being used against them — does the technique lose its power the moment it becomes anticipated, the way a suspect could avoid eating leather at all once dogs learn the buttermilk trick exists?"
  - "Does this approach require the underlying evidence to still physically exist somewhere retrievable? Once it's genuinely gone — consumed, destroyed, past recovery — no reflex is left to trigger."
status: active
