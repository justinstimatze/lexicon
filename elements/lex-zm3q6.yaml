    quote: "“These inventions, if formulated in some language, are from the start somewhat different from other biological actions; this may be seen from the fact that each of two schemata of biological actions which otherwise are indistinguishable may contain a myth (concerning, say, the origin of the world) which is contradictory to the other. For although some of our beliefs may be immediately relevant to practice, others are only remotely relevant to it, if at all. Their differences may make it possible for them to clash, and their comparative remoteness may make it possible for them to be argued about. In this way, rational criticism may develop, and standards of rationality—some of the first inter-subjective standards—and the idea of an objective truth.”"
canonical-instances:
  - "Two teams at a company both ship working code using flatly opposed beliefs about why a particular caching strategy helps performance. Because no decision either team has to make today actually turns on which account is correct, nobody has ever had to compare the two directly -- until a postmortem finally forces the question, at which point the contradiction becomes visible and arguable for the first time."
  - "A family holds two different, mutually exclusive stories about why a long-past financial decision was made, and both versions coexist peacefully for decades because nothing currently at stake depends on which one is true. When an inheritance dispute finally makes the answer matter, the two stories collide and get argued over directly for the first time -- not because new evidence arrived, but because the belief stopped being practically idle."
critical-questions:
  - "Doesn't this suggest beliefs closest to real stakes get the least scrutiny, which seems backwards? Stakes aren't the variable doing the work here -- immediacy of required action is. A high-stakes belief that still allows time to pause before acting, like a strategic bet reviewed before launch, gets exactly the scrutiny this atom predicts. A belief wired to an action that must happen right now regardless of its truth gets none, no matter how high the stakes climb."
  - "Isn't remoteness from practice just another way of saying 'nobody cares enough to check,' which sounds like a reason beliefs get WORSE, not better? Popper's claim is about what makes checking possible at all, not about whether anyone bothers. A belief immediately fused to unavoidable action can't be checked even by someone who cares intensely, because there's no gap between holding it and having already acted on it; remoteness is what creates that gap, whether or not anyone chooses to use it."
