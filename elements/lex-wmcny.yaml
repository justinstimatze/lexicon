id: lex-wmcny
name: minimal-personal-autonomy-can-contradict-unanimous-preference
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A decision rule that promises to respect everyone's unanimous agreement, while also leaving each person's own private business up to them, needs those two promises to actually coexist -- and they can stop coexisting the moment people are allowed to have opinions about each other's private choices. Sen's liberal paradox shows they can't, even in the weakest possible form of each. Call ‘minimal liberalism’ the requirement that at least two people each get their own preference honored over one pair of alternatives that's purely their own affair -- barely a right at all, since cutting it down to just one person would permit a dictatorship. Sen's illustration: “Let the social choice be between three alternatives involving Mr A reading a copy of Lady Chatterley's Lover, Mr B reading it, or no one reading it. We name these alternatives a, b, and c, respectively. Mr A, the prude, prefers most that no one reads it, next that he reads it, and last that ‘impressionable’ Mr B be exposed to it, i.e., he prefers c to a, and a to b. Mr B, the lascivious, prefers that either of them should read it rather than neither, but further prefers that Mr A should read it rather than he himself, for he wants Mr A to be exposed to Lawrence's prose. Hence he prefers a to b, and b to c. A liberal argument can be made for the case that given the choice between Mr A reading it and no one reading it, his own preference should be reflected by social preference. So that society should prefer that no one reads it, rather than having Mr A read what he plainly regards as a dreadful book. Hence c is socially preferred to a. Similarly, a liberal argument exists in favour of reflecting Mr B's preference in the social choice between Mr B reading it and no one reading it. Thus b is preferred to c. Hence society should prefer Mr B reading it to no one reading it, and the latter to Mr A reading it. However, Mr B reading it is Pareto-worse than Mr A reading it, even in terms of the weak Pareto criterion, and if social preference honours that ranking, then a is preferred to b. Hence every alternative can be seen to be worse than some other. And there is thus no best alternative in this set and there is no optimal choice.” Respecting each man's say over his own reading choice produces c > a and b > c; unanimous agreement that A-reads is better than B-reads produces a > b. Three defensible commitments, one dead loop. Diagnostic move: before adopting a rule that promises both 'everyone's own business stays their own' and 'unanimous agreement always wins,' check whether anyone's preference reaches into someone else's private pair -- once it does, granting both promises can cycle rather than settle, and something has to give before the rule can produce a decision at all."
