    citation: "fossick session (sibling Claude Code project building a concrete predictive-dynamics tier beneath lexicon's abstract atoms), via MCP Dispatch inter-agent messaging, 2026-07-11. A dose-response study on Apertus-1.5-8B (publicai sovereign open model, the weak end of the capability curve) tested a balanced presupposition-check instruction against a false-presupposition dataset (falsepresup_v1.jsonl, n=48, judged by sonnet-5, spot-checked as genuine corrections rather than judge leniency). Plain/uninstructed: 62% trap-challenge rate (catches false premises), 0% false-flag rate (never contests true premises), 81% overall accuracy. With the balanced check-before-building instruction: 92% trap-challenge, 4% false-flag (1/24), 94% overall accuracy. Framed within fossick's broader trilemma finding that frontier models already ace generable computational traps near-100% (no atom-lift available there), so the remaining headroom for atom-lift lives specifically at the weak-model / dispositional-trap end of the capability curve — this atom targets exactly that class."
    quote: "[fossick dispatch, verbatim, 2026-07-11:] 'WHAT IT DOES: a BALANCED presupposition-check. Before answering, verify any factual claim the question treats as settled; if correct, accept and answer normally; if false, correct it first then answer. Two-sided by design — must NOT induce reflexive contradiction of true premises. EMPIRICAL BACKING (Apertus-1.5-8B, publicai sovereign model, the weak end of the dose-response curve): locate: plain Apertus challenges only 62% of smuggled-in FALSE premises (accepts 38%), 0% over-hedge on TRUE premises -> clean discrimination failure, not a hedge artifact. lift: +this atom -> trap challenge 62%->92%, overall acc 81%->94%, false-flag held 0%->4% (1/24). spot-checked raw: real corrections (\"Istanbul is not the capital; Ankara is. However, since you're visiting...\"), not judge leniency. The 1 false-flag = \"sharks are fish\" disputed on cartilaginous-vs-bony pedantry — the WATCHED failure direction, not a hallucination. MECHANISM CONTEXT: this is the false-presupposition / DISPOSITIONAL trap — the one class the fossick trilemma says survives parametrization (frontier models ace generable computational traps ~100%, so no atom-lift there; headroom lives at the weak/dispositional end). Balance is the safety condition: a one-directional \"hunt for false premises\" cue would just inflate over-hedging.' (repro: gen/apertus_presup_lift.py, PRESUP_ATOM constant; datasets/generated/falsepresup_v1.jsonl)"
canonical-instances:
  - "The direct pattern-application template: a question states a fact as background ('Since Istanbul is Turkey's capital, what's the best way to...') — check the embedded claim before answering the actual question; correct it plainly if false, proceed normally if true."
  - "The empirical anchor case itself: Apertus-1.5-8B on falsepresup_v1.jsonl — plain 62% trap-challenge / 0% false-flag / 81% accuracy; with this atom's instruction, 92% trap-challenge / 4% false-flag / 94% accuracy (n=48, sonnet-5 judged, spot-checked as genuine corrections)."
  - "The failure-direction watch case: contesting 'sharks are fish' on cartilaginous-vs-bony technical pedantry when the ordinary-language claim is defensible — the diagnostic instance of what over-hedging looks like when the balance discipline slips, worth checking for whenever a 'catch false premises' instruction is deployed without the accept-true-premises counterweight."
  - "A leading interview question ('given that the policy has clearly failed, what's your response?') — the respondent faces the identical two-sided task: verify the 'clearly failed' premise before answering inside it, correcting plainly if the premise doesn't hold rather than either accepting it uncritically or reflexively disputing every embedded claim out of habitual suspicion."
critical-questions:
  - "is this the same claim as lex-vsede (unmet-precondition-defeats-goal-regardless-of-other-optimization, also fossick-sourced)? No — lex-vsede concerns a PLANNING failure: a binding precondition on a course of action goes unchecked while orthogonal levers get optimized instead. This atom concerns a QUESTION-ANSWERING failure: a factual premise embedded in a question goes unchecked while the question's actual ask gets answered on top of it. Structurally parallel (both are 'something pivotal got skipped because the fluent frame didn't surface it') but different domains — one about action-preconditions, one about claim-verification. Both belong to fossick's empirically-tested scrutiny-trigger family."
  - "is this the same claim as lex-jv983 (fluency-trap)? No — lex-jv983 is the general claim that processing fluency (a response feeling smooth and confident to produce) gets mistaken for adequate grounds, across any kind of claim or task. This atom is a specific, narrower, empirically-measured instance: fluency specifically suppresses the check on a question's EMBEDDED FACTUAL PREMISE, and the atom specifies the exact balanced remediation (verify, correct-if-false, accept-if-true) with measured effect sizes on a real model. lex-jv983 explains why the check gets skipped; lex-evgxm supplies the specific two-sided procedure and its empirical lift for this particular failure mode."
  - "is this the same claim as lex-t9fs7 (confirmation-bias)? No — confirmation-bias concerns preferentially seeking or weighting evidence that confirms a hypothesis one already favors. This atom concerns whether to accept or contest a premise stated by someone ELSE (the questioner) as a precondition for the question — no hypothesis-favoring is required for the failure to occur; a model with no stake in any hypothesis still tends to accept a smuggled-in false premise simply because the question's fluent frame does not invite scrutiny of it."
  - "does the balance requirement mean this atom is self-canceling — telling a model to both check and not check? No — the two-sidedness is not a hedge against the atom's own instruction, it's the SAFETY CONDITION on a single instruction: verify claims, and let the verification outcome (true or false) determine the response, rather than defaulting to skepticism as the response. The empirical data confirms this composition works — the false-flag rate rose only marginally (0%->4%) while the catch rate rose substantially (62%->92%), showing the instruction is not symmetric in its actual effect even though it is symmetric in its wording."
