id: lex-v6nqz
name: eliminative-paired-comparison-isolates-cause-by-presence-absence-of-circumstances
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When testing what caused an effect, find a paired case where the suspected cause was absent and the rest was matched. The presence/absence comparison isolates the cause more cleanly than any volume of confirming instances."
related: [lex-2s3ze, lex-39muf, lex-3d2he, lex-58ynk, lex-6bycb, lex-6pd48, lex-6vh6y, lex-6wsw2, lex-8j5ms, lex-9kuqg, lex-b6kvs, lex-e9z2y, lex-eybad, lex-fecdf, lex-k9ku5, lex-mbx6p, lex-qkrey, lex-rktsy, lex-u3e5m, lex-w97xs, lex-xbpmu, lex-xhvgy, lex-xrbzz]
scaffolds-from: [lex-39muf, lex-eybad]
evokes: [the-four-methods, mills-canons, the-method-of-agreement, the-method-of-difference, the-joint-method, the-method-of-residues, ceteris-paribus-comparison, baconian-elimination, isolate-by-what-changes-and-what-doesnt]
lineage:
  - source: primary
    text: mill-1843-system-of-logic-book-3-ch-8-four-methods
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843), Book III 'Of Induction,' Chapter VIII 'Of The Four Methods Of Experimental Inquiry.' Mill states four canons of experimental inquiry — Methods of Agreement, Difference, Joint (Indirect Difference), and Residues — all sharing the underlying mechanism of ELIMINATION: 'whatever circumstances can be excluded, without prejudice to the phenomenon, or can be absent notwithstanding its presence, is not connected with it in the way of causation. The casual circumstances being thus eliminated, if only one remains, that one is the cause.' Mill explicitly identifies Bacon as the source of the eliminative-induction framework. The four methods are operational variants of one mechanism: paired comparison of instances differing in known circumstances, isolating cause by what-changes-when-the-phenomenon-changes (Difference, Joint, Residues) or what-remains-constant-when-the-phenomenon-recurs (Agreement). Mill's Vol.I (1843) is PD globally. This atom captures the underlying mechanism shared across Methods 1-4; lex-qkrey captures Method 5 (Concomitant Variations) as the magnitude-covariation variant required for Permanent Causes."
    quote: "[Mill 1843 *System of Logic* Bk.III Ch.VIII §1, FIRST CANON:] 'If two or more instances of the phenomenon under investigation have only one circumstance in common, the circumstance in which alone all the instances agree, is the cause (or effect) of the given phenomenon.' [Method of Agreement — eliminate by what is shared across positive instances.] [§2, SECOND CANON:] 'If an instance in which the phenomenon under investigation occurs, and an instance in which it does not occur, have every circumstance in common save one, that one occurring only in the former; the circumstance in which alone the two instances differ, is the effect, or the cause, or an indispensable part of the cause, of the phenomenon.' [Method of Difference — eliminate by paired positive/negative comparison.] [§3 framing:] 'Both are methods of elimination... the successive exclusion of the various circumstances which are found to accompany a phenomenon in a given instance, in order to ascertain what are those among them which can be absent consistently with the existence of the phenomenon. The Method of Agreement stands on the ground that whatever can be eliminated, is not connected with the phenomenon by any law. The Method of Difference has for its foundation, that whatever can not be eliminated, is connected with the phenomenon by a law.' [the central mechanism: ELIMINATION as the unifying principle.] [§4, THIRD CANON:] 'If two or more instances in which the phenomenon occurs have only one circumstance in common, while two or more instances in which it does not occur have nothing in common save the absence of that circumstance, the circumstance in which alone the two sets of instances differ, is the effect, or the cause, or an indispensable part of the cause, of the phenomenon.' [Joint Method — double-application of Agreement on positive and negative instance-sets; what Mill calls 'the Indirect Method of Difference.'] [§5, FOURTH CANON:] 'Subduct from any phenomenon such part as is known by previous inductions to be the effect of certain antecedents, and the residue of the phenomenon is the effect of the remaining antecedents.' [Method of Residues — subtract known-cause contributions and attribute residue to remaining cause; Mill describes this as 'in truth a peculiar modification of the Method of Difference' where the negative instance is constructed by deduction rather than observed directly.]"
canonical-instances:
  - "Snow 1854 cholera epidemiology (Soho outbreak): the canonical empirical instance of Mill's Method of Difference applied to a public-health phenomenon. Snow mapped cholera cases; observed that one water pump (Broad Street) was the common circumstance of cases in a specific neighborhood; that nearby neighborhoods drawing water from different sources had drastically lower rates; AND that anomalies (workhouse and brewery NEAR the pump but drinking their own well/beer) had ZERO cases — the precisely-targeted negative instance Method of Difference demands. Snow's reasoning IS Mill's Method of Difference applied to geographic-clustering data: positive instances (cholera cases) all share one circumstance (Broad Street pump); proximate negative instances (workhouse, brewery) share absence of that circumstance. lex-w97xs spatial-mapping captures Snow's instrument-extension dimension; lex-v6nqz captures the underlying eliminative-comparison mechanism Snow operationalized"
  - "Lind 1747 scurvy citrus trial (HMS *Salisbury*): the earliest documented Method-of-Difference clinical trial. Lind divided 12 scurvy-afflicted sailors into 6 pairs, gave each pair a different proposed treatment (cider, vitriol, vinegar, seawater, oranges-and-lemons, nutmeg-paste). The pair given oranges-and-lemons recovered; other pairs did not. Lind's design holds 'all other circumstances' equal (same ship, same diet baseline, same disease severity) and varies only the treatment — Mill's Method of Difference made operational in clinical-trial form, ~95 years before Mill named the method. Lind didn't have Mill's vocabulary but operationalized the substrate-claim correctly"
  - "Eratosthenes ~240 BCE earth-circumference calculation: the Method of Residues applied to astronomical measurement. Eratosthenes measured shadow-angle in Syene (zero at solar noon, summer solstice) and Alexandria (~7.2°). He subtracted the known-cause (earth's spherical surface curvature) interpretation from the observed difference; the residue (7.2° = 1/50 of full circle → ~5000 stadia of arc-length → ~250,000 stadia full circumference) yields the earth's circumference. The structure is Mill's Method-of-Residues: subtract effects of known causes (sun position, Alexandria-Syene distance) from total phenomenon (shadow-angle difference) to attribute residue to a single remaining cause (earth's spherical geometry)"
  - "Mendeleev 1869 periodic-table gap predictions (lex-3d2he cross-reference): when Mendeleev observed that his periodic arrangement left specific atomic-mass slots empty AND predicted properties of elements that would fill those gaps (eka-silicon → germanium 1886), he was applying a deductive version of Mill's Method of Residues. Known causes (elements he had data for) accounted for known properties; the residual gap-properties were attributable to unknown elements with predictable atomic-mass + chemical-behavior. The substrate-link to lex-v6nqz is via Method of Residues as deductive-elimination of known to isolate unknown"
  - "differential-diagnosis in clinical medicine: physician faced with a constellation of symptoms enumerates possible causes, eliminates those inconsistent with negative findings (Method of Agreement on what does NOT explain the symptom-pattern), confirms by paired comparison with similar-presentation cases (Method of Difference on candidate-treatment-response). The diagnostic-reasoning structure IS Mill's eliminative-comparison applied to clinical data. The substrate-instance is operationally distinct from lex-w97xs (spatial-mapping is a specific data-presentation that enables elimination; differential-diagnosis is the elimination process itself applied to symptom-data)"
  - "A/B testing in software product development: presented as randomized-controlled-trial (covered by lex-b6kvs Fisher) but at the substrate-level it IS Method of Difference: two versions of a UI/feature/page differ in exactly ONE circumstance (the variant under test); user-behavior differences in conversion / retention / engagement are attributable to that one varied circumstance. Fisher's randomization (lex-b6kvs) is the defense against violating 'all other circumstances equal' through unknown confounders; the underlying causal-inference move IS Mill's Method of Difference. A/B testing operationalizes lex-v6nqz at scale, with lex-b6kvs as the supplementary defense-mechanism"
  - "operationally distinct from lex-w97xs spatial-mapping-reveals-causation-invisible-to-aggregate-statistics (Snow 1854): lex-w97xs is about INSTRUMENT-EXTENSION (visualizing spatial-distribution to surface clustering invisible in aggregate). lex-v6nqz is about the underlying ELIMINATIVE-COMPARISON MECHANISM (paired presence/absence isolates cause). Snow's spatial map ENABLES elimination but elimination IS the inference-mechanism. Cross-domain composition: lex-w97xs fires for 'how do I see the data?'; lex-v6nqz fires for 'how do I infer cause from what I see?'"
  - "operationally distinct from lex-b6kvs randomization-controls-for-unknown-confounders-that-no-other-design-can-address (Fisher 1925): lex-b6kvs is about DEFENSE against violating Method-of-Difference's ceteris-paribus requirement via random assignment. lex-v6nqz is about the underlying ELIMINATIVE-COMPARISON MECHANISM Fisher's randomization protects. Mill's Method of Difference REQUIRES that 'all other circumstances' be held equal; Fisher's randomization provides probabilistic guarantee of this even when unknown confounders exist. Fisher operationalizes Mill's claim under realistic-data-conditions; lex-b6kvs fires for 'how do I make Method of Difference robust against unknown confounders?'; lex-v6nqz fires for the underlying paired-comparison move"
  - "operationally distinct from lex-39muf problem-of-induction (Hume Treatise) AND lex-rktsy causation-as-constant-conjunction (Hume Treatise): Hume's atoms are EPISTEMOLOGICAL — what licenses our inference from observed regularities to causal claims? lex-v6nqz is METHODOLOGICAL — given that we are willing to make causal inferences, what experimental design lets us discriminate among candidate causes? Mill EXPLICITLY accepts Hume's problem of induction as a backdrop and offers the four methods as the strongest pragmatic operationalization given that backdrop. Mill 1843 Book III Ch.III explicitly engages Hume on causation; the methods of Ch.VIII are the methodological response to Hume's epistemological challenge"
  - "operationally adjacent to lex-qkrey covariation-of-magnitudes-establishes-causation-when-permanent-causes-resist-elimination (sibling atom this pass): lex-v6nqz covers Mill's four PRESENCE-ABSENCE methods (Agreement, Difference, Joint, Residues); lex-qkrey covers Mill's FIFTH method (Concomitant Variations) which Mill explicitly distinguishes as the alternative when Permanent Causes (gravity, moon, earth) cannot be presence-absence-eliminated. They share a substrate-ancestor (eliminative-comparison-as-causal-inference) but have distinct operational mechanisms (binary elimination vs continuous magnitude-correspondence). lex-v6nqz + lex-qkrey together = Mill's complete experimental-inquiry methodology"
  - "operationally adjacent to lex-xhvgy contextual-effects-as-relevance-currency: lex-xhvgy is about argumentation-relevance (Walton schemes); lex-v6nqz is about causal-inference. Both involve eliminating alternatives — lex-xhvgy by relevance, lex-v6nqz by ceteris-paribus-comparison. They co-fire on diagnostic-reasoning where relevant-alternative-elimination AND eliminative-empirical-comparison both occur"
  - "operationally adjacent to lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (lex-3d2he Mendeleev periodic-table prediction): lex-3d2he captures the predictive-existence-from-classification-gap move; lex-v6nqz's Method of Residues captures the underlying eliminative-mechanism by which the gap is established. Mendeleev's gap-predictions IMPLEMENT Method of Residues at the classification-table level. lex-3d2he fires for 'what should we predict from a gap?'; lex-v6nqz fires for 'how do we establish what's a gap vs what's noise?'"
critical-questions:
  - "the 'all other circumstances equal' requirement is unattainable in practice: Mill himself acknowledges (§3) that 'the difficulty is merely lightened, not removed' when nature presents complex phenomena. Even controlled experiments have unobserved variables. Mitigation: Fisher 1925 randomization (lex-b6kvs) provides probabilistic ceteris-paribus through random assignment to treatment-conditions, addressing the failure-mode Mill could not solve. The methodological evolution Fisher→Holland causal-inference→Pearl do-calculus is a series of refinements to Mill's elimination-requirement under realistic-data-conditions"
  - "the 'one circumstance in common' or 'differing only in one circumstance' requirement is rarely empirically clean: real phenomena have multiply-confounded antecedents. Mill's methods work in physics/chemistry where antecedents can be controlled (Lind, Eratosthenes), but degrade in social sciences and economics where multiple variables co-vary. Mitigation: regression analysis attempts to extend Mill's elimination across multiple confounders via statistical-adjustment, but creates new problems (omitted-variable bias, multicollinearity, model-misspecification). The Mill-baseline is necessary but not sufficient for messy-data domains"
  - "the methods discriminate between CANDIDATE causes but cannot SUGGEST candidate causes: Mill's methods assume the experimenter has a list of antecedents to test. Where does the list come from? Mill is silent. In practice, hypothesis-generation precedes hypothesis-testing; elimination operates on a pre-existing search-space. This limits the methods' applicability where the true cause is OUTSIDE the considered candidate set. Counter-instance: pre-DDT entomologists eliminated many candidates for malaria-cause; mosquitoes were not in the candidate set until Ross-Manson 1897 hypothesis-generation. Method of Difference doesn't help generate the mosquito-hypothesis"
  - "Method of Residues has a hidden circularity: the 'previously-known' causes Mill subtracts depend on prior applications of Methods 1-3 OR on memory-level reasoning. If the prior knowledge is wrong, the residue-attribution is wrong. Mill admits (§5) that 'the evidence derived from the Method of Residues is not complete unless we can obtain C artificially, and try it separately' — i.e., reduces back to direct Method of Difference when possible. The deductive-residue path is epistemically weaker than the direct-experimental path; Mill's claim that Residues 'partakes of the rigorous certainty' of Difference is contingent on prior inductions being secure"
  - "the methods are presented as discrete but in practice cascade: Method of Agreement suggests a candidate cause; Method of Difference attempts to confirm; if Permanent Causes prevent Difference, Concomitant Variations is invoked; Residues subtracts known-causes to isolate residual. The presentation as a static list of four (or five) methods obscures the cascade-structure. Modern causal-inference texts (Holland 1986, Pearl 2009) present this as a unified framework rather than a list — the methodological-evolution from Mill to modern is largely the integration of his discrete methods into a unified directed-graph model of causation"
status: active
