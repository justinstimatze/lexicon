evokes: [failure-splits-a-unified-decision-into-blaming-factions, cushing-the-maiden-the-sun-made-love-to-origin-of-anger, the-old-ones-called-the-young-ones-fools, the-world-has-been-filled-with-anger]
lineage:
  - source: primary
    text: cushing-people-fracture-into-blame-after-the-failed-attack-on-the-gods
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Maiden the Sun Made Love To, and Her Boys: or the Origin of Anger.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Once more they drew the corners of the mantle upward, and as they rose higher and higher, the people, old and young, began to quarrel and fell to beating one another, and to fighting among themselves. The old ones called the young ones fools for attempting the life of a god, and the young ones in turn called the old ones fools for counselling them to attempt the life of a god. ... ever since then, my children, the world has been filled with anger, and even brothers agree, then disagree, strike one another, and spill their own blood in foolish anger.'"
canonical-instances:
  - "A company's leadership team unanimously approves a risky product launch, and when it fails publicly, the executives who spoke enthusiastically in the meeting start telling colleagues privately that they 'always had reservations,' while the ones who stayed quiet claim they were pressured into silence, with the room's actual unanimous vote never mentioned by anyone."
  - "A community votes overwhelmingly to fund a large civic project that collapses under mismanagement, and afterward residents split into camps blaming 'the officials who pushed for it' and 'the voters who approved it without asking questions,' each side erasing its own participation in a decision that had broad support at the time."
critical-questions:
  - "Is there a meaningful difference between the old and young factions here, given that the text suggests both groups actively participated in preparing for war, or is the 'old counselled, young attempted' framing itself already a piece of retrospective blame-shifting invented after the failure rather than an accurate description of how the decision was actually made?"
  - "Would collective acknowledgment of shared responsibility have been possible here at all, given that the story frames the entire episode as a permanent, mythic origin of a condition (anger) rather than a single correctable mistake -- does the tale suggest this splitting response is inevitable rather than a choice a group could avoid?"
  - "Does recognizing this pattern in real time, noticing a group beginning to split into blaming factions right after a failure, actually give anyone the power to stop it, or is the split typically too fast and too emotionally driven for that kind of intervention?"
status: active
