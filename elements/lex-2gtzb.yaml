id: lex-2gtzb
name: humor-arises-from-violations-perceived-as-simultaneously-benign
type-in: state
type-out: claim
_tier: atomic
status: active
agent-instruction: "When something feels funny, check whether the situation is simultaneously a violation (of a norm — moral, social, linguistic, physical, logical, expectation) AND appraised as safe (psychologically distant, hypothetical, low personal stakes, alternative-norm-compatible, or otherwise harmless). McGraw and Warren's 2010 benign-violation hypothesis names three jointly-necessary-and-sufficient conditions for humor: (a) the situation is appraised as a violation; (b) the situation is appraised as benign; (c) the two appraisals are held simultaneously. Lose any one and amusement does not arise: pure violation produces disgust/anger/fear; pure benign produces boredom or mild positive affect; sequential (not simultaneous) appraisal produces confusion or relief but not humor. The transferable diagnostic moves: (1) when a joke lands, identify both the violated norm and the safety-channel that made it benign — if you can name only one, you have not yet recovered the humor's mechanism; (2) when a joke fails, the failure is usually one of the three conditions missing — either the violation didn't register (audience missed the norm), the violation wasn't benign (audience felt threatened, offended, harmed, or close to the victim), or simultaneity broke (the audience first reads as benign then notices the violation, or vice versa, but doesn't hold both); (3) the three published levers for converting violation→benign are alternative-norm-compatibility (chicken-marination scenario: violates one moral norm but fits a harm-based norm), low personal commitment to the violated norm, and psychological distance (the violation is hypothetical, far in space/time, happening to someone else); (4) the theory subsumes prior partial accounts as special cases — Bergson's mechanical-encrustment is a specific class of suppleness-violation; superiority-theory (Hobbes) is the case where the violation is the target's degraded state and benign because the laugher is not the target; incongruity-resolution is the cognitive description of simultaneous holding; relief-theory describes one mechanism by which violations become felt-as-benign. Operational tests: (a) for ethical comedy, ask which axis — register the violation more or make it more clearly benign — produces sharper humor without crossing into harm; (b) for explaining why X was offensive, ask which person/audience didn't have the benign-channel available; (c) for cross-cultural humor failure, the most common failure mode is a violation the local audience doesn't register (it's not a norm there), or a benign-channel the foreign audience doesn't have access to (the alternative-norm is locally unavailable)."
