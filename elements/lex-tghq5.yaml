lineage:
  - source: primary
    text: altshuller-1984-five-levels-of-problems
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.1 'On the Road to a Theory of Creativity,' section 'Levels of Problems.'"
    quote: "'One can divide problems according to their degree of difficulty into five levels or classes. The very easiest problems, (the first level) are characterized by the use of means (devices, methods, substances) intended precisely for the given goal... In problems of the first level the object (device or method) does not change (the heat insulation already present is strengthened). At the second level the object is changed but not substantially (a mirror is introduced into the shielding device). At the third level the object is changed essentially and at the fourth it is totally changed; in the fifth the entire technical system is changed in which the object fits.'"
  - source: primary
    text: altshuller-1984-trial-count-follows-from-level
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.1, 'Levels of Problems.'"
    quote: "'Solution of a problem of the first sort requires choosing between a few obvious variants. This can be performed by any engineer and such problems are solved every day without difficulty... On the second level the number of variants is already measured in dozens... A correct solution of problems of the third level may be buried among hundreds of incorrect ones. Thousands and tens of thousands of trials and errors can be made on the fourth level in order to find a solution. Finally, on the fifth level, the number of trials and errors grows to hundreds of thousands and millions. One recalls, for instance, that Edison had to make 50,000 trials to invent the accumulator battery.'"
canonical-instances:
  - "A team debugging a production outage tries a config rollback (level-1: the system's own existing rollback mechanism, unchanged), then a hotfix patch (level-2: the code changes slightly but the architecture doesn't), then a redesign of the retry logic (level-3: a core mechanism is rebuilt), then discovers the fix requires replacing the underlying database engine (level-4/5) — the escalating trial-and-error cost at each stage tracks how much of the system had to change, not how many engineers tried."
  - "A writer revising a novel's ending first tries rewording a scene (level-1), then adds a new scene (level-2), then restructures a character's arc across the whole book (level-3), then realizes the book's entire premise needs to change (level-4/5) — the difficulty of each successive attempt is set by how much of the existing structure has to be disturbed, and no amount of extra drafting effort at level-1 substitutes for the level-4 change the ending actually needs."
  - "operationally distinct from lex-svcmp accumulated-precedent-as-substrate-for-individual-genius: that atom is about WHERE credited achievement's scaffold actually comes from (communal precedent vs. individual genius); this atom is about WHAT MAKES a given problem structurally harder than another, independent of who is solving it or what they draw on."
critical-questions:
  - "is the level being judged correctly, or is a level-4/5 problem being mistaken for level-1/2 because the failed level-1/2 attempts haven't yet been exhausted — and conversely, is a genuinely level-1 problem being treated as harder than it is because of unfamiliarity rather than actual required system-change?"
  - "can a problem's level be deliberately LOWERED — reformulated so a smaller change suffices — rather than accepting the level as fixed by the problem's original statement? Altshuller's later chapters treat this reformulation move as the central payoff of a systematic method; if the level looks fixed, has reformulation actually been tried?"
  - "does the person or team estimating difficulty have a way to test their level-estimate before committing resources — since a level-4/5 misjudged as level-2 will predictably fail cheap fixes many times before the real scope becomes visible, and that pattern of repeated cheap-fix failure is itself diagnostic of a level mismatch?"
