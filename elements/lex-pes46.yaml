id: lex-pes46
name: laughter-at-a-caught-offender-loosens-anger-that-denial-cannot
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "An authority figure's righteous anger at someone caught red-handed is not defused by a convincing denial or a sincere apology nearly as effectively as it can be by pure delight -- being charmed into laughing at the audacity of the offense loosens a grip that argument leaves untouched. When Apollo confronts the infant Hermes over the stolen cattle, Hermes offers an absurd, transparently false denial delivered with total nerve. It doesn't fool Apollo for a second, but it doesn't need to: 'Far-working Apollo laughed softly then, and said to Hermes: \"My dear boy, what a tricky-hearted cheat you are!\" ... Apollo's laugh marks the moment at which he first loosens his grip on the cattle; his laughter melts his righteous anger and a touch of detachment enters.' The same hinge appears when the child-god Krishna, caught smeared in stolen butter, tells his mother the household can't be stolen from because everything in it already belongs to them: 'At this point Yasoda, like Apollo, laughs, charmed by her cunning and shameless child.' In both cases, the authority isn't persuaded the offense didn't happen -- they're still fully aware of the guilt. What changes is that amusement has replaced anger as the operative emotion, and amusement doesn't demand the same reckoning anger does. Diagnostic move: when facing someone's righteous anger over an offense you can't actually deny, consider that a plausible cover story aimed at their reason is competing with something anger responds to less well -- genuine, disarming charm aimed at their delight; the goal isn't to be believed, it's to be found funny enough that the anger itself loses its grip."
