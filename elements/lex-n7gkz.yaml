id: lex-n7gkz
name: an-open-case-conference-converts-felt-ignorance-into-jurisdictional-uncertainty
type-in: process
type-out: frame
_tier: atomic
agent-instruction: "There is a kind of uncertainty a role's own training doesn't prepare a novice for, because it isn't about lacking an answer — it's about not knowing whether the question is even inside the role's jurisdiction at all. Fox catches this surfacing in a Comprehensive Care conference where a fourth-year student presents a family whose medical problems are inseparable from poverty, housing, and diet: 'The Gonzales family is a Puerto Rican family that has been in this country for sixteen months.... From the outset of our contact with this family, it was obvious that there were a number of interrelated sociological, economic, and medical problems, all of which could not be treated at the same time.' The student comments that follow don't converge on an answer — they disagree openly about whether the question is even the doctor's to answer: 'is it or isn't it part of the doctor's job to be concerned with such things as where his patients buy their food?... as for the social problems of this Puerto Rican family, they're beyond the scope of an everyday doctor to crack, in my opinion.' What makes this a distinct kind of uncertainty from Fox's own core typology (uncertainty from personal ignorance, or from the field's incomplete knowledge) is that no amount of medical knowledge, personal or field-wide, resolves it — the question is not 'what is true' but 'what is mine to decide is true.' The conference format itself does specific work here: by opening the case to open, disagreeing discussion rather than resolving it in private, it converts what would otherwise be one student's private felt confusion into visibly shared, professionally unsettled territory — confirmed explicitly by a faculty member's closing remark: 'These questions don't only concern students.... They concern doctors as well.... There just aren't many \"ground rules\" in this area.' A novice who never sees this kind of open, unresolved airing has no way to distinguish 'I personally don't know where my job ends' from 'nobody in this profession has agreed on where the job ends' — and will likely misattribute the first kind of confusion (jurisdictional) as if it were the second kind Fox already names (personal ignorance), redoubling study efforts that cannot possibly resolve a boundary question. Diagnostic move: when someone in a role feels persistently uncertain about a recurring question, check whether the uncertainty is actually about a FACT (which more knowledge would resolve) or about the SCOPE of the role itself (which no amount of individual knowledge resolves, because it is a professional-community-level, not individual-level, unsettled question) — and if it's the latter, look for or create a forum where the question can be aired collectively rather than solved alone, since collective airing is the only thing that actually converts private confusion into visible, legitimately shared uncertainty."
