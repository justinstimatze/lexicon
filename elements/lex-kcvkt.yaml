id: lex-kcvkt
name: two-effective-themes-can-cancel-to-a-null-net-effect
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a persuasive document combines two themes that are each individually effective, don't assume their combined effect is additive — check whether they pull toward opposite behavioral consequences, because if they do, a controlled before/after experiment can show zero net effect and make it look like the whole document failed, when actually both halves worked and cancelled each other out. Merton and Lazarsfeld's case: prewar films combined a Nazi-cruelty theme (vivid mistreatment of civilians) that evokes profoundly aggressive feelings with a Nazi-strength theme (the enemy's skill, experience, and size) that elicits fears about Americans coping with so formidable an army. On the outcome that mattered — willingness to support American intervention — the Nazi-strength theme, which elicits fear, could counteract the Nazi-cruelty theme, which elicits aggression, so that although each theme was effective on its own terms, one exciting hostility and the other acquainting Americans with the might of the enemy, the net result on willingness to intervene could be nil. Critically, the standard research tool for testing propaganda — the matched before/after controlled experiment — cannot detect this by itself: its results show only the net effect on an attitude, not the more intricate dynamics of response that produced that net effect, so a failure showing no measurable change may actually be two real, opposite effects cancelling out, and only interview material that traces the psychological process can supply the explanation the experiment's numbers withhold. Diagnostic move: when a null or weak aggregate result seems surprising given the apparent strength of the material, don't conclude the material was ineffective — decompose it into its component themes, check whether they pull toward opposite intermediate reactions that would cancel on the specific outcome you measured, and use qualitative process data, not just pre/post comparison, to check."
