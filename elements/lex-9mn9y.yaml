id: lex-9mn9y
name: reductio-via-an-immutable-natural-order
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'One way to undercut a claimed possible outcome is to name a natural regularity nothing has ever broken, then show the outcome would require breaking it too: grant the claim, and something already agreed to be impossible follows right along with it. Right''s rebuttal to Wrong, in the Jataka''s tale of the same name, reaches for exactly this metallurgical impossibility: "By iron gold is beaten, nor do we Gold used for beating iron ever see: If Wrong ''gainst Right shall win the fight to-day, Iron as beautiful as gold will be."'
related: []
evokes: [jataka, ekadasanipata, dhamma-jataka, reductio-ad-absurdum, argument-from-natural-order]
lineage:
  - source: primary
    text: jataka-chalmers1895-dhamma-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 457, Dhamma-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "By iron gold is beaten, nor do we Gold used for beating iron ever see: If Wrong 'gainst Right shall win the fight to-day, Iron as beautiful as gold will be."
canonical-instances:
  - "A physics teacher answers a student's perpetual-motion proposal not by working through the specific design but by pointing out that if it worked, conservation of energy — which nothing has ever violated — would have to be false."
critical-questions:
  - "This argument only has force if the audience already accepts the natural precedent as truly immutable — what happens to its persuasive power against someone who doubts that gold-beats-iron is a law rather than just an observed regularity?"
status: active
