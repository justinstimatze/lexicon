id: lex-yznq8
name: target-a-coalitions-edge-or-center-not-a-member-at-random
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you need to fracture a coalition arrayed against you, don't spend equal effort courting every member -- identify which members sit at the structural edge and which sit at the structural center, because winning over either position breaks the coalition's cohesion in a way that winning over a random member doesn't. Kautilya gives the mechanism for both positions explicitly: 'He shall win over the ruler on the border of a confederacy of allies. For, when those on the edge are won over, those in the middle become divided. Or, he shall win over one in the centre; for, when the centre is won over, those in the edges cannot remain united.' The two positions fail the coalition in different but complementary ways. Losing an edge member removes a piece the interior members were counting on to hold a flank or absorb a border risk, so the interior members lose confidence in the coalition's coverage and start hedging independently -- division spreads inward from the loss at the perimeter. Losing the center removes the member other coalition members were all individually coordinating through or deferring to, so the remaining edge members no longer have a shared anchor connecting them to each other -- they don't just lose the center, they lose their connection to one another. Either target works because coalitions of convenience are held together by structural position, not by uniform mutual commitment among all members equally -- most members are only really bound to whichever member sits at the edge or the center relative to them, not to the group as an undifferentiated whole. Diagnostic move: before trying to peel off members of an opposing coalition, map who occupies its structural edges and who occupies its center -- targeting a member with neither role spends effort on someone whose departure the others can absorb without changing their own calculus, while targeting an edge or center member removes the very connective tissue holding the rest together."
