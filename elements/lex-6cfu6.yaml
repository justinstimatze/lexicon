id: lex-6cfu6
name: relapse-recycles-through-stages-not-back-to-the-start
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone relapses after committing to a behavior change, don't read it as a return to square one. Ask what's different this cycle versus last — a trigger now identified, a coping move tested and found wanting, more realistic expectations — rather than only 'why did I fail again.' Most successful self-changers relapse three to four times before maintaining; the relapse is data the next attempt can use, not proof the whole effort failed."
related: [lex-y48fs, lex-wup2r, lex-ett3j]
evokes: [spiral-not-circle, recycling-through-relapse, learning-from-relapse, two-steps-forward-one-step-back, stages-of-change, eternal-recurrence-contrast]
lineage:
  - source: primary
    text: prochaska-diclemente-norcross-1992-spiral-model
    citation: "James O. Prochaska, Carlo C. DiClemente, and John C. Norcross, 'In Search of How People Change: Applications to Addictive Behaviors,' American Psychologist 47(9) (September 1992), pp. 1102-1114, section 'Spiral Pattern of Change' (pp. 1104-1105). PDF on shelf, verbatim 2026-07-23. The transtheoretical/stages-of-change model's original linear formulation (precontemplation → contemplation → preparation → action → maintenance → termination) had to be revised once the authors' own self-change research showed linear progression was rare: most people relapse and recycle through earlier stages before eventually maintaining. The paper explicitly frames this as a SPIRAL rather than a circle — recycling carries forward learning even when the surface outcome (a relapse) looks identical to the last one."
    quote: "[Prochaska, DiClemente & Norcross 1992, p.1104, 'Spiral Pattern of Change']: 'Because relapse is the rule rather than the exception with addictions, we found that we needed to modify our original stage model. Initially we conceptualized change as a linear progression through the stages... Linear progression is a possible but relatively rare phenomenon with addictive behaviors. Figure 1 presents a spiral pattern that illustrates how most people actually move through the stages of change.' [p.1105, on what the spiral means]: 'The spiral model suggests that most relapsers do not revolve endlessly in circles and that they do not regress all the way back to where they began. Instead, each time relapsers recycle through the stages, they potentially learn from their mistakes and can try something different the next time around.' [p.1104, on base rates]: 'successful self-changers make an average of from three to four action attempts before they become long-term maintainers (Schachter, 1982). Many New Year's resolvers report five or more years of consecutive pledges before maintaining the behavioral goal for at least six months.' [p.1105, on the recovery split]: 'Approximately 15% of smokers who relapsed in our self-change research regressed back to the precontemplation stage... the vast majority of relapsers — 85% of smokers, for example — recycle back to the contemplation or preparation stages.'"
  - source: practitioner
    text: prochaska-norcross-diclemente-1994-changing-for-good
    citation: "James O. Prochaska, John C. Norcross, and Carlo C. DiClemente, Changing for Good: A Revolutionary Six-Stage Program for Overcoming Bad Habits and Moving Your Life Positively Forward (William Morrow, 1994; HarperCollins ebook ed. 2010), Ch.2 'The Spiral Model of Change' and Ch.9 'Recycling — Learning from Relapse.' The popular-trade elaboration of the 1992 paper's model. Epub on shelf, verbatim 2026-07-23. Frames the same finding operationally for a self-help audience: relapse is not failure, it's the expected shape of change, and the useful move after a relapse is a period of self-reevaluation extracting what changed rather than immediately re-attempting the identical plan."
    quote: "[Prochaska, Norcross & DiClemente 1994, Ch.2, 'The Spiral Model of Change']: 'When Carlo and I first identified the stages of change, we believed that self-changers moved consistently from one stage to the next. Our plan was straightforward and linear... But things did not turn out so simply. Linear progression is a possible but relatively rare phenomenon. In fact, people who initiate change begin by proceeding from contemplation to preparation to action to maintenance. Most, however, slip up at some point, returning to the contemplation, or sometimes even the precontemplation stage, before renewing their efforts. The average successful self-changer recycles several times.' [Ch.9, on the reframe]: 'Although relapse is never desirable, our view is that change is often circular and difficult. The spiral cycle of change... shows how contemplation, preparation, and action usually follow relapse. Relapsers most often take one step backward in order to take two steps forward.'"
canonical-instances:
  - "smoking cessation (Prochaska-DiClemente-Norcross 1992, p.1104): successful self-changers average three to four action attempts before becoming long-term maintainers. Of those who relapse, 85% recycle back to contemplation or preparation (carrying forward what they learned); only 15% regress all the way to precontemplation (the closer-to-true-circle outcome). The spiral/circle split is itself an empirical, measured quantity, not just a metaphor."
  - "New Year's resolutions (Prochaska-DiClemente-Norcross 1992, p.1104; Changing for Good Ch.2): resolvers report five or more consecutive years of the same pledge before maintaining the goal for at least six months; 60% of unsuccessful resolvers make the identical pledge again the following year. The repetition itself (same stated goal, year after year) is consistent with either a circle or a spiral — the discriminator is whether the attempt's specifics (trigger-awareness, coping strategy, social support) changed between years."
  - "'one step backward in order to take two steps forward' (Changing for Good, Ch.9) — the book's own compact framing of net-positive relapse, distinct from a pure circle (zero net movement) and distinct from denial-of-setback (claiming there was no step backward at all)."
  - "operationally distinct from lex-y48fs pyramid-of-choice-incremental-self-justification-drives-similar-starters-apart: pyramid-of-choice is about DIVERGENCE between people who started at a similar point, driven by small successive self-justifying choices with no relapse involved. This atom is about a SINGLE person's repeated cycling through the same choice-point over time, with relapse as the mechanism that resets (but does not fully erase) position. Both describe change that isn't a straight line, but pyramid-of-choice is inter-personal divergence under continuous small choices; this atom is intra-personal recycling under discrete attempt-relapse-reattempt cycles."
  - "operationally distinct from lex-wup2r gnomonic-growth-produces-self-similar-form: gnomonic growth is a geometric/structural metaphor for self-similar expansion (a nautilus shell, a growing spiral where each turn is a scaled repetition of the last, with no failure/relapse component at all). This atom's spiral has a specific EMPIRICAL mechanism (relapse, recycling, partial learning-carry-forward) and admits real regression (the 15% who go all the way back to precontemplation) — a possibility gnomonic growth's purely-generative geometry doesn't model."
  - "operationally distinct from lex-ett3j recursive-practice-audit: recursive-practice-audit is the DISCIPLINE of stepping back from a practice to check whether it's working — a deliberate, ongoing act available at any point. This atom describes what STRUCTURALLY happens across repeated attempts at behavior change, whether or not the person is deliberately auditing — relapse itself does some of the same work an audit would (surfacing what isn't working), just involuntarily and after the fact. Recursive-practice-audit, applied to a change attempt, is one way to make the spiral's learning more deliberate rather than left to relapse's harsher feedback."
  - "the antipode this atom rejects: Nietzsche's eternal recurrence / the 'time is a flat circle' framing — pure repetition with no net movement and no learning carried forward. Prochaska-DiClemente-Norcross's own language ('most relapsers do not revolve endlessly in circles') explicitly names and rejects this as the correct model of what relapse actually is, based on their measured 85/15 split rather than as a philosophical stance."
critical-questions:
  - "is genuine new learning actually present between cycles, or is 'it's a spiral not a circle' being used as a comforting reframe for real stagnation? The 15% who regress fully to precontemplation are living proof the pure-circle outcome is real and not rare enough to dismiss. Discriminator: can the person name something concrete that differs about this attempt — a trigger now identified, a specific coping move tried and found wanting, a changed support structure? If not, treat it as a circle until shown otherwise, not as an automatic spiral."
  - "what stage did the relapse regress TO? Regressing to contemplation/preparation (the 85% case) is structurally different from regressing to precontemplation (the 15% case) — the former keeps intention and some infrastructure intact; the latter genuinely restarts motivational work from a colder start. Treating both as equally 'a spiral, not a circle' erases a real distinction the source data itself makes."
  - "how many cycles is normal before repetition itself becomes the diagnostic concern rather than the expected structure? Prochaska-DiClemente-Norcross's own base rate (3-4 attempts for smoking, sometimes 5+ years for resolutions) means cycle-count alone doesn't discriminate a healthy spiral from a stuck circle — a low cycle-count is not evidence of health and a high one is not automatically evidence of dysfunction. The discriminator has to be content (what changed) not just count (how many times)."
  - "is the spiral framing being applied to the right TIME SCALE? The model describes repeated discrete attempts at the same change (quit smoking, try again next year), not continuous within-attempt fluctuation (a bad day during an otherwise-maintained change). Applying 'spiral not circle' language to ordinary day-to-day variation within maintenance conflates two different phenomena and can excuse abandoning a plan that was actually working."
status: active
