    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.9 'The Axial Age.'"
    quote: "“What's missing, though, is any sense that the most selfish ('self-interested') motive is necessarily the real one.”"
  - source: primary
    text: graeber-2011-debt-radical-simplification-of-motives
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.9 'The Axial Age.'"
    quote: "“The result, during the Axial Age, was a new way of thinking about human motivation, a radical simplification of motives that made it possible to begin speaking of concepts like 'profit' and 'advantage'.”"
canonical-instances:
  - "The direct textual anchor, on how differently motive-speculation runs inside a human economy: “Similarly, gifts between equals are usually fraught with many layers of love, envy, pride, spite, communal solidarity, or any of a dozen other things.”"
  - "Hypothetical: an economics student raised entirely on textbook models of rational utility-maximization takes a summer job at a family-run farm stand, where the owner gives a struggling neighbor extra vegetables at cost, invites a regular customer's kids to help feed the chickens, and negotiates hard with a wholesale buyer that same afternoon. The student initially tries to find the 'real' profit motive hiding behind each act, until it becomes clear that generosity, community-building, and hard bargaining are simply different registers the same person moves between, none of them a mask for the others."
critical-questions:
  - "If the self-interested-actor model really is a product of violent, impersonal exchange, why did it take root so unevenly -- flourishing in Greek and Chinese Axial Age thought but arguably far less in early Buddhist economic writing, which developed inside the same violent, coin-based military states? Does the mechanism need a further filter for which cultures actually adopted the simplified motivational model versus which ones faced the same market conditions but resisted it?"
  - "Modern behavioral economics has spent decades documenting that real humans deviate constantly from pure self-interested rationality, yet the model persists as the default assumption in policy and theory long after Axial Age war-markets ended. Graeber's account explains how the idea first became thinkable. Whether it also explains why the model still dominates today, centuries after the violent conditions that produced it, is a separate question it leaves open."
