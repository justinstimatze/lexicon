id: lex-k3xwe
name: absence-of-a-mundane-explanation-becomes-evidence-of-the-supernatural
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A recurring prophetic image can appear on a rock face in a location no person could physically reach to paint it, and the physical inaccessibility itself, rather than any positive evidence, becomes the reason to treat the image as genuinely supernatural rather than made by human hands. Passing a sacred bluff, Black Elk describes a picture that 'used to appear' there, foretelling coming events -- on this occasion, soldiers hanging head downward, matching Custer's defeat. He states his epistemic position carefully: 'I do not know; but it was there then, and it did not seem that anybody could get up that high to make a picture.' The claim isn't that he has evidence FOR a supernatural origin -- it's that the absence of a plausible mundane one (no climbable route to the spot) is doing all the work."
related: []
evokes: [black-elk-speaks, walking-the-black-road, the-sacred-bluff, could-not-get-up-that-high, inaccessibility-as-evidence]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch10-walking-the-black-road
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 10, 'Walking the Black Road.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Then we moved on down stream to a sacred place where there is a big rock bluff right beside the water, and high up on this bluff pictures used to appear, foretelling something important that was going to happen soon. There was a picture on it then, of many soldiers hanging head downward; and the people said it was there before the rubbing out of Long Hair. I do not know; but it was there then, and it did not seem that anybody could get up that high to make a picture."
canonical-instances:
  - "A hiking group finds a cross carved into a cliff face at a height no climbing route could plausibly reach, and rather than concluding an unknown route or tool must have existed, treats the impossibility itself as proof of divine origin."
  - "A crop circle appears in a field overnight with a complexity that seems to preclude ordinary human construction in the available darkness, and investigators cite the sheer implausibility of a mundane cause as their main evidence for something extraordinary, rather than searching harder for the mundane explanation."
  - "A locked-room mystery gets attributed to a ghost specifically because no one can identify how a human intruder could have entered or exited, with the absence of a found mechanism functioning as the case for the supernatural explanation rather than as an open question still needing an answer."
critical-questions:
  - "Does 'nobody could get up that high' actually rule out every mundane explanation -- a rope from above, a different technique, a route that's since eroded away -- or does it only rule out the explanations that occurred to the people looking at it?"
  - "Would this image have been remembered and discussed at all if it hadn't seemed to match a real, terrible later event, or does the selection of which mysterious markings become significant depend entirely on a coincidence discovered after the fact?"
  - "Black Elk explicitly says 'I do not know' instead of asserting the supernatural explanation outright -- does that hedge change what kind of claim this actually is, compared to someone who states the miraculous origin as settled fact?"
status: active
