lineage:
  - source: primary
    text: bhagavad-gita-arnold-1885-book-ii-62-63-desire-chain
    citation: "Bhagavad Gita (श्रीमद्भगवद्गीता; c. 5th-2nd c. BCE composition; redacted within the Mahabharata epic), Book II, standard verse numbering II.62-63, trans. Sir Edwin Arnold (1885, *The Song Celestial*; Project Gutenberg #2388). Krishna's counsel to Arjuna sets out a named, ordered causal chain running from sustained attention on a sense-object through to the collapse of judgment, distinct from Krishna's separate, more famous teaching on acting without attachment to outcomes (II.47-50, substrate-grounded at lex-7xz6k). The chain identifies dwelling/contemplation as the entry point and names each subsequent stage explicitly, contrasted immediately after (II.64-65) with the alternative of engaging sense-objects without either craving or aversion. PD globally (composition ancient; Arnold translation itself PD, Arnold d. 1904, first published 1885)."
    quote: "[The staged chain, Book II (Arnold's blank-verse rendering of the standard II.62-63 verses):] 'If one Ponders on objects of the sense, there springs Attraction; from attraction grows desire, Desire flames to fierce passion, passion breeds Recklessness; then the memory--all betrayed-- Lets noble purpose go, and saps the mind, Till purpose, mind, and man are all undone.' [The immediately preceding warning that even a governed mind can be swept, naming the general vulnerability the chain formalizes:] 'Yet may it chance, O Son of Kunti! that a governed mind Shall some time feel the sense-storms sweep, and wrest Strong self-control by the roots.' [The contrasting alternative immediately following, engagement without fixation rather than avoidance:] 'But, if one deals with objects of the sense Not loving and not hating, making them Serve his free soul, which rests serenely lord, Lo! such a man comes to tranquillity.'"
  - source: cross-attestation
    text: modern-relapse-prevention-and-early-intervention-parallel
    citation: "Cross-domain attestation that staged-escalation-with-earliest-cheapest-intervention recurs outside the Gita's framework. Marlatt & Gordon 1985 *Relapse Prevention* names the 'seemingly irrelevant decision' (SID) — an ostensibly minor, unrelated-looking choice (driving past the old bar, keeping a bottle 'for guests') that is in fact the earliest tractable point in a chain that later terminates in relapse; the clinical model explicitly targets intervention at the SID stage rather than at the moment of peak craving, on grounds structurally identical to the Gita's ordering. Cognitive-behavioral 'urge surfing' technique (Marlatt) and mindfulness-based relapse prevention likewise locate the trainable skill at noticing-and-not-elaborating the earliest urge rather than resisting it once fully formed. The parallel is structural, not textual — no claim of influence — offered as independent modern attestation that the staged-chain-with-earliest-intervention-point structure is empirically real, not a metaphor specific to the Gita's cosmology."
    quote: "[Cross-attestation, not a primary quote: Marlatt & Gordon's 'seemingly irrelevant decision' names the same operational claim as the Gita's dwelling-stage — the tractable intervention point precedes the moment of strongest pull, and is easy to overlook precisely because, taken alone, it does not yet look like part of the problem.]"
canonical-instances:
  - "The direct pattern-application template: a temptation, compulsion, or escalation process has named ordered stages; identify the earliest stage and place vigilance there rather than at the stage of peak intensity."
  - "The textual anchor case itself: Krishna's chain (Gita II.62-63) — dwelling on a sense-object leads through attraction, desire, passion, and recklessness to the corruption of memory and the collapse of purpose, mind, and self-governance."
  - "Relapse prevention's 'seemingly irrelevant decision' (Marlatt & Gordon 1985): the recovering person who drives past the old bar 'just to save time' is at the Gita's dwelling-stage, not yet at desire or passion — the tractable intervention point, easy to dismiss as unrelated to the problem."
  - "Conflict-of-interest policy design: the point to intervene is the first informal, no-stakes-seeming contact between an official and a vendor (the dwelling stage), not once a years-long relationship has already shaped the official's judgment about that vendor's contracts (the recklessness/corrupted-judgment stage)."
critical-questions:
  - "is this the same claim as lex-7xz6k act-for-action-quality-not-outcome-attachment (also Bhagavad Gita)? No — lex-7xz6k (Gita II.47-50) is about MOTIVATIONAL ORIENTATION toward the outcomes of an action already being undertaken (fight the battle, but don't crave victory as personal gain). This atom (Gita II.62-63) is about WHERE IN A TEMPORAL SEQUENCE to place vigilance against a desire before it escalates — a claim about intervention-timing in a causal chain, not about motivation during ongoing action. They are adjacent teachings in the same chapter addressing different questions and can compose (a practitioner can both act without outcome-attachment AND intervene early against escalating desires) but do not overlap in mechanism."
  - "is this the same claim as lex-mjav2 discipline-of-assent (Epictetus/Aurelius)? No — lex-mjav2 identifies a single seam (bare impression vs. added judgment) and prescribes pausing there before assenting to any interpretation. This atom identifies a MULTI-STAGE chain with a specific claim about relative cost of intervention at each stage, and the entry point is sustained ATTENTION on a desired object (dwelling), not an interpretive judgment about a perceived event. lex-mjav2's seam can occur at any of this atom's stages (one can withhold assent from the judgment 'I should keep looking at this' at the dwelling stage, or from the judgment 'I deserve this' at the passion stage) — they compose, with lex-mjav2 supplying the mechanism and this atom supplying the claim about which stage to apply it to."
  - "is this the same claim as lex-v7ceq akrasia (Aristotle)? No — akrasia names the GAP between knowing the better action and doing it, at the moment of decision; it is agnostic about how the agent arrived at that moment of weakened resolve. This atom supplies a staged MODEL OF HOW resolve gets weakened over time (dwelling to attraction to desire to passion to recklessness), with the specific claim that the corrupted-memory/judgment stage — the very capacity akrasia's 'active knowledge' depends on — is itself a late-chain casualty. lex-v7ceq diagnoses the failure at the moment of action; this atom diagnoses the upstream chain that produced that moment and locates the cheap fix earlier."
  - "is this the same claim as lex-fjffq insatiable-consumption-self-amplifies-the-appetite-it-feeds? No — lex-fjffq's mechanism is that FEEDING an appetite through consumption makes it grow rather than satisfying it (a single self-amplifying loop keyed to consumption). This atom's mechanism is a multi-stage chain keyed to sustained ATTENTION prior to any consumption at all — the chain begins and can be interrupted before any feeding occurs. They can compose (once past the dwelling stage, an appetite that has become insatiable-on-feeding per lex-fjffq makes later-stage intervention even more costly) but describe different mechanisms at different points in a desire's lifecycle."
  - "does this atom counsel avoidance of all sense-experience or contemplation generally? No — the text's own immediately following alternative (II.64-65, 'not loving and not hating') explicitly rejects blanket avoidance in favor of engagement without fixation, and this atom's portable claim is narrower still: it is about intervention TIMING for desires already identified as escalation-prone, not a general prescription against attention or engagement. A known tension with this atom's practical application: modern thought-suppression research (ironic-process / 'white bear' effects) shows that effortful active avoidance of a thought or object can itself backfire and increase salience — the atom's early-intervention claim should be read as 'notice and disengage attention without escalating effort to actively not-think-about-it,' not as a license for suppression, which is a different and more failure-prone technique than simply not dwelling in the first place."
severity-tier: warning
