id: lex-kjvpw
name: a-policy-can-ride-a-trend-it-never-caused
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before crediting a policy for a trend that improved after it launched, check what the trend line was doing before the policy started -- a policy introduced mid-trend can take credit for movement it never caused. Sen, on China's one-child policy and its fertility rate: “China's fertility rate was already falling rapidly before the policy was introduced. In the ten years preceding the new policy, the fertility rate had already fallen from 5.87 in 1968 to 2.98 in 1978 (a gigantic drop in a decade). The fertility rate continued to fall even after the new compulsive policy came into force, but there was no dramatic jump, only a smooth continuation of the falling trend that preceded the restriction. ... The big decline (from 5.87) had occurred before the compulsion-based route was even introduced. Clearly, something more than the one-child policy has been restraining population growth in China.” The real test isn't whether the outcome improved after the policy started -- it's whether the trend line bent at the point the policy started. A policy that launches mid-decline and produces no visible inflection point is riding a trend already in motion, driven by other causes (Sen names women's education and employment) that were operating the whole time. Diagnostic move: before attributing an outcome to a policy, pull the trend line back to well before its start date rather than starting the chart at launch. An unchanged slope at the introduction date reveals the policy as a passenger on a trend already driven by something else, however good the after-numbers look on their own."
