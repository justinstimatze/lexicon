id: lex-epryu
name: judging-choices-consistent-requires-assuming-a-motive
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before flagging two of someone's choices as inconsistent, check whether you can actually name what would make them contradictory -- bare choice acts, unlike statements, don't automatically contradict each other. Sen: “Statements A and not-A are contradictory in a way that choosing x alone from {x, y} and y alone from {x, y, z} cannot be. If the pair of choice acts were to entail, respectively, the statements (1) x is a better alternative than y, and (2) y is a better alternative than x, then of course there would be a contradiction here (since 'being better than' is an anti-symmetric relation). But those choices do not in themselves entail any such statements (until some motivational presumptions are made). Given some ideas as to what the person is trying to do (this is an external correspondence), we might be able to interpret these actions as implied statements. But we cannot do that without invoking such an external reference. It is hard to think that there can be such a thing as purely internal consistency of choice.” Picking x from a two-item menu and y from a three-item menu only becomes a contradiction once you've already assumed the person is doing the same thing both times -- ranking all the options by one fixed standard. Drop that assumption and the 'inconsistency' has nowhere left to stand: the third option on the menu could easily have changed what made sense to pick, or the person simply wanted some variety this time. Diagnostic move: before calling behavior inconsistent, state the motivational assumption that makes it inconsistent, out loud. If you can't state one, you haven't found a contradiction -- you've found two choices you haven't yet interpreted."
