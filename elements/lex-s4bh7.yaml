lineage:
  - source: primary
    text: eastman-son-in-law-daughter-warns-against-fathers-rigged-hunt
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Nineteenth Evening: The Son-in-Law.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'When my father takes you hunting with him,' she said, 'you must take care always to keep behind him. If he tells you to follow any animal, do not do so, but shoot it from where you stand!' Next day the old man invited his guest to hunt... 'Chase it, chase it, son-in-law!' exclaimed the old man, but the youth stood still and killed the creature with an arrow from his quiver. Alas, it was no marten, but one of the boys whom he had seen playing outside the cave!"
canonical-instances:
  - "A job candidate for a demanding technical role is told the final interview is a 'culture fit conversation' with the hiring manager, and only survives it without damaging their candidacy because a sympathetic current employee had privately warned them the hiring manager actually uses the casual setting to provoke candidates into badmouthing a previous employer, which is an automatic disqualifier -- no amount of technical skill would have protected against a trap the candidate didn't know existed."
  - "A new business partner is invited to a series of seemingly ordinary negotiation sessions with a larger company known for verbally agreeing to terms it never intends to honor, and avoids being bound by a bad deal only because a contact inside the larger company privately tips them off, before each session, exactly which verbal concessions to get in writing and which promises to treat as worthless."
critical-questions:
  - "how does someone identify a genuinely sympathetic insider before the rigged test begins, when the sympathetic party (the daughter) had her own strong personal motive in this case -- is this pattern actually reliable to seek out, or does it depend on a fortunate alignment of interests that can't be counted on?"
  - "does relying on an insider's warning create dependency that leaves someone permanently vulnerable to any FUTURE rigged test where no sympathetic insider happens to be present, rather than teaching a durable way to detect rigged tests independently?"
  - "what happens to the insider who provided the warning once the deception is exposed -- does this framework account for the real risk the daughter took in betraying her father's plan, or does it treat the warning as a costless resource for the person being tested?"
