lineage:
  - source: primary
    text: Connell-1995-Masculinities
    citation: "R. W. (Raewyn) Connell, *Masculinities* (University of California Press 1995; 2nd ed. 2005). Connell, a Sydney sociologist, develops the foundational four-position structure of masculinities within the broader gender-power system — hegemonic, complicit, subordinated, marginalized — explicitly extending Gramsci's hegemony concept to the internal structure of a gender category. The transferable contribution: a collectively-privileged category is internally stratified into four relational positions, not uniformly distributed. The hegemonic position is the culturally-exalted configuration that legitimates the broader power-arrangement; the complicit position contains the majority of category-members who receive the dividend without embodying the ideal; subordinated positions are within-category sub-positions explicitly disprivileged (gay masculinity in 1990s U.S. context); marginalized positions intersect with other axes of oppression (working-class men of color). Connell's framework has been the most influential single contribution to masculinity studies and gender-power analysis in the past three decades, cited 50,000+ times and extended across whiteness studies (Wray 2006 *Not Quite White*; Roediger 1991 *Wages of Whiteness*), religious studies (Wuthnow 1988 *The Restructuring of American Religion*), and organizational studies (Acker 1990 `Hierarchies, Jobs, Bodies` on gendered organizations). The transferable form lex-raydk lifts the four-position relational-stratification structure into its general form — applicable to any collectively-privileged category that contains internal hierarchies. Debunking check applied: Connell's specific empirical claims about which masculinity configurations occupy which positions have been contested in cross-cultural research (some studies argue the framework over-generalizes Western contexts; Connell 2014 *The Sociology of Gender* responds and refines). The STRUCTURAL claim — that privileged categories stratify internally along the four-position pattern — has been validated across many contexts and is uncontested even by critics of specific empirical claims. The atom encodes the structural primitive, not the specific empirical mapping."
    quote: "[Connell 1995 Ch.3 `The Social Organization of Masculinity` pp. 77-78, the pivotal definition:] '\"Hegemonic masculinity\" is not a fixed character type, always and everywhere the same. It is, rather, the masculinity that occupies the hegemonic position in a given pattern of gender relations, a position always contestable. ... The concept of `hegemony,` deriving from Antonio Gramsci's analysis of class relations, refers to the cultural dynamic by which a group claims and sustains a leading position in social life. At any given time, one form of masculinity rather than others is culturally exalted. Hegemonic masculinity can be defined as the configuration of gender practice which embodies the currently accepted answer to the problem of the legitimacy of patriarchy, which guarantees (or is taken to guarantee) the dominant position of men and the subordination of women.' [Ch.3 p.79, on the complicit position:] 'Hegemony, subordination and complicity, as just defined, are relations internal to the gender order. The interplay of gender with other structures such as class and race creates further relationships between masculinities... The number of men rigorously practising the hegemonic pattern in its entirety may be quite small. Yet the majority of men gain from its hegemony, since they benefit from the patriarchal dividend, the advantage men in general gain from the overall subordination of women.' [Ch.3 p.80, on subordinated + marginalized positions:] 'Hegemony relates to cultural dominance in the society as a whole. Within that overall framework there are specific gender relations of dominance and subordination between groups of men. The most important case in contemporary European/American society is the dominance of heterosexual men and the subordination of homosexual men. ... Marginalization is always relative to the authorization of the hegemonic masculinity of the dominant group. Thus, in the United States, particular black athletes may be exemplars for hegemonic masculinity. But the fame and wealth of individual stars has no trickle-down effect; it does not yield social authority to black men generally.' [Practitioner-extraction for transferable lex-raydk: the four-position relational-stratification structure (hegemonic, complicit, subordinated, marginalized) generalizes across privileged categories beyond masculinity — race, religion, profession, citizenship, etc. The atom encodes the structural form; the specific empirical mapping for any given category is context-dependent.]"
  - source: cross-attestation
    text: cross-domain-internal-stratification-of-privileged-categories
    citation: "Cross-domain attestation that the four-position relational-stratification structure recurs across privileged categories. (a) Hegemonic whiteness: Wray 2006 *Not Quite White: White Trash and the Boundaries of Whiteness*; Roediger 1991 *Wages of Whiteness*; Hartigan 1999 *Racial Situations* document the internal stratification of `white` into hegemonic (white-collar middle-class Protestant) + complicit (white majority benefiting from racial-wage privilege) + subordinated (poor whites, `white trash`) + marginalized (mixed-race-passing, ethnic-white groups historically `not quite white` such as Irish, Jewish, Italian until mid-20th century). (b) Hegemonic Christianity: Wuthnow 1988 *The Restructuring of American Religion* documents internal stratification into hegemonic (white evangelical Protestant in 21st-c U.S. political-cultural-context) + complicit (mainline Protestant, Catholic in alliance) + subordinated (Latter-day Saints, Jehovah's Witnesses, charismatic Pentecostal) + marginalized (Black Protestant, Latino Catholic, immigrant Eastern Orthodox). (c) Hegemonic citizenship: Bosniak 2008 *The Citizen and the Alien* + Volpp 2002 documenting hegemonic (native-born landowner of voting age) + complicit (naturalized-mainstream + native-born middle-class) + subordinated (resident non-citizen, dual-national, conditional resident) + marginalized (undocumented, asylum-seeker, stateless). (d) Hegemonic professional identity: the sociology-of-professions literature (Abbott 1988 *The System of Professions*; Larson 1977 *The Rise of Professionalism*) documents hegemonic (full-pedigree practitioner with elite credentialing) + complicit (rank-and-file professional in standard practice) + subordinated (niche-specialist, alternative-practice) + marginalized (immigrant-credentialed, paraprofessional, technically-similar-but-excluded-from-canon). Common example: hegemonic `real engineer` who works at FAANG with elite-CS-program credential + hostile-named-language proficiency + workaholic culture; complicit majority of working engineers; subordinated alternative-track engineers (bootcamp-trained, gov-sector); marginalized women + minority engineers whose qualification is structurally contested. (e) Hegemonic startup-founder: Y-Combinator + Stanford + MIT pedigree; complicit non-Stanford founder; subordinated bootstrap-without-VC founder; marginalized women + minority founders structurally excluded from the canonical-founder identity. (f) Hegemonic political-tribe membership: Mason 2018 *Uncivil Agreement* + Klein 2020 *Why We're Polarized* document hegemonic (the median of each party's activist base) + complicit (regular voter) + subordinated (moderate or cross-cutting-issue voter) + marginalized (split-ticket, third-party, formerly-active-now-disillusioned). The cross-domain attestation establishes the transferable structural form: privileged categories stratify internally into the four-position relational structure, not uniformly. The diagnostic is independent of the specific axis being analyzed."
    quote: "Across whiteness (Wray 2006, Roediger 1991, Hartigan 1999), religion (Wuthnow 1988), citizenship (Bosniak 2008, Volpp 2002), professional identity (Abbott 1988, Larson 1977), startup-founder identity (Y-Combinator + Stanford + MIT pedigree as hegemonic), and political-tribe membership (Mason 2018, Klein 2020), the same four-position relational-stratification structure recurs — privileged categories contain hegemonic ideal + complicit majority + subordinated within-category positions + marginalized cross-axis positions. The transferable diagnostic: when analyzing a supposedly-uniform privileged category, map its internal four-position structure; this reveals which sub-positions can be politically mobilized and which are structurally excluded from the cultural ideal."
canonical-instances:
  - "Connell's canonical case: U.S. masculinity 1990s — hegemonic (white middle-class corporate-executive + military-officer + top-athlete heterosexual masculinity); complicit (most white middle-class men who benefit from patriarchal dividend without embodying ideal); subordinated (gay men, effeminate men, men in `feminized` occupations); marginalized (working-class men of color, disabled men). Each position has a specific relationship to the hegemonic ideal."
  - "Hegemonic whiteness (Wray 2006 *Not Quite White*; Roediger 1991): hegemonic (white-collar middle-class Protestant); complicit (white-majority racial-wage beneficiary); subordinated (poor whites, `white trash` stigmatized within the category); marginalized (mixed-race-passing, historically-`not-quite-white` Irish/Jewish/Italian/Southern-European groups until mid-20th century)."
  - "Hegemonic engineering identity in contemporary tech: hegemonic (Stanford/MIT-credentialed, FAANG-employed, hostile-named-language proficient, workaholic-culture-compliant); complicit (rank-and-file software engineer benefiting from professional standing); subordinated (bootcamp-trained, gov-sector, alternative-track engineer); marginalized (women + minority engineers whose qualification is structurally contested at scale)."
  - "Hegemonic Christianity in U.S. political-cultural alignment (Wuthnow 1988): hegemonic (white evangelical Protestant); complicit (mainline Protestant + Catholic in alliance); subordinated (Latter-day Saints, Pentecostal, Jehovah's Witnesses); marginalized (Black Protestant, Latino Catholic, immigrant Eastern Orthodox)."
  - "Hegemonic startup-founder identity: hegemonic (Y-Combinator + Stanford/MIT pedigree + technical-co-founder); complicit (non-elite-CS-program founder); subordinated (bootstrap-without-VC founder); marginalized (women + minority founders structurally excluded from canonical-founder identity)."
  - "Hegemonic political-tribe identity (Mason 2018, Klein 2020): hegemonic (the median activist of each party); complicit (regular voter); subordinated (moderate, cross-cutting-issue voter); marginalized (split-ticket, third-party, formerly-active-now-disillusioned)."
  - "operationally distinct from lex-jd7fe enduring-power-reproduces-through-cultural-consent (Gramsci macro hegemony): lex-jd7fe is the macro layer — political-economic structure reproduced through cultural consent. lex-raydk is the internal-stratification layer — within a single privileged category, hegemonic/complicit/subordinated/marginalized positions structure relationships. Connell explicitly extends Gramsci. They compose: lex-jd7fe explains how categories become hegemonic; lex-raydk explains how internal stratification structures the category."
  - "operationally distinct from lex-et8q2 intersectional-position-not-decomposable (Crenshaw): lex-et8q2 is the anti-decomposition claim (intersectional position has emergent content). lex-raydk is the internal-stratification claim (privileged categories stratify internally). They compose: lex-et8q2 names what intersectional positions ARE; lex-raydk names the four-position structure WITHIN which intersectional positions sit."
  - "operationally distinct from lex-t7xcp common-oppression-claim-erases-intra-group-stratification: lex-t7xcp names the RHETORICAL ERASURE of stratification when privileged sub-positions claim collective oppression. lex-raydk names the underlying STRUCTURAL stratification. Compose: lex-raydk is the structure that lex-t7xcp's appropriating-rhetoric erases."
  - "operationally distinct from lex-pn8qn down-crossing-status-stigmatized-more-than-up-crossing (Serano): lex-pn8qn names the directional-asymmetry of category-crossing stigma. lex-raydk names the internal-position structure within a privileged category. They compose: down-crossing from hegemonic to subordinated within a category (lex-pn8qn applied to lex-raydk's intra-category structure) attracts compound stigma — a male executive transitioning to be a working-class femme attracts stronger compound stigma than the same person becoming a more-conventional-masculine executive of equivalent rank."
critical-questions:
  - "Is the four-position framework descriptive of the category being analyzed, or are you imposing a Connell-shaped frame on a category that has a different internal structure? The atom claims the four-position structure is empirically supported across multiple privileged-category cases (gender, race, religion, profession, citizenship, political tribe). For other categories (athletic prowess, artistic accomplishment, scientific recognition, financial-elite membership), the internal structure may have more than four positions or a different relational geometry. The atom should be applied with empirical validation, not as a Procrustean fit."
  - "Are the four positions discrete or a continuum? Connell treats them as a continuum with relational-geometric positions, not a discrete typology. Specific individuals may move between positions over time, occupy multiple positions in different contexts, or be hard to classify cleanly. The atom encodes the relational structure, not a typology of individuals."
  - "Does the hegemonic position require numerical majority within the category? No — Connell explicitly argues that hegemonic masculinity may be embodied by a small minority of men (specific exemplars, idealized figures, fantasy characters). The hegemonic position is defined by cultural exaltation + reproduction-of-power-arrangement, not by numerical count. The complicit position holds the numerical majority."
  - "Could the framework be misused to argue that privileged-category members who don't embody the hegemonic ideal are not privileged? No — the complicit position is still privileged (it receives the dividend). The atom does not exempt complicit-position members from analysis of privilege; it identifies their specific structural relationship to the hegemonic ideal. The framework refines analysis of privilege, not dismisses it."
  - "How does the framework apply when a category's hegemonic ideal is contested? Connell's framework explicitly handles this: hegemony is `historically mobile,` and contestation between candidate hegemonic configurations is a normal feature of social change. Periods of hegemonic contestation (1960s-70s gender + civil rights movements; contemporary disputes over `traditional masculinity`) are diagnostic moments when the four-position structure is most visible because the hegemonic position is being actively defended or replaced."
