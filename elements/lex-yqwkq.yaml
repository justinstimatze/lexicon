id: lex-yqwkq
name: a-propped-decoy-maintains-an-illusion-only-until-someone-touches-it
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A static prop arranged to suggest that everything is still normal can survive a glance completely intact, and yet collapse the instant anyone actually makes contact with it -- the illusion was never load-bearing, it just never expected to be tested. In Radin's Winnebago Trickster cycle, after killing a family's children, Trickster stages a decoy to delay discovery: 'he cut off the head of one of the children, put a stick through its neck and placed it at the door as though the child were peeping out and laughing.' From a distance, it works exactly as intended: when the mothers return, 'one of the children was peeping out of the door. It was smiling at them.' Their first reaction is only mild confusion, not alarm: 'What kind of a joke is this?' The illusion holds right up until physical contact happens for an unrelated reason: 'I am angry,' said one of the women. So she slapped the child on the cheek and the head toppled over. ... There, much to her horror, she noticed that it was only the child's head.' One slap, thrown in irritation rather than suspicion, was all it took to end an illusion that had survived visual inspection completely. Diagnostic move: when something looks normal only from a fixed distance or angle, don't mistake that visual survival for real verification -- a decoy that has never been touched hasn't actually been checked, it has only avoided the one test that would end it."
