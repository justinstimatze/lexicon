    text: kautilya-arthashastra-equal-and-unequal-treaties-defined
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Treaties,' 'Equal and Unequal Treaties,' {7.7.4-6}."
    quote: "'An equal treaty is one in which the stronger king gets a greater share, an equally powerful king an equal share and a weaker king a smaller share. An unequal treaty is one in which a strong, equal or weak king does not get a share according to his power. An exceptionally unequal treaty is one in which one of the signatories gets a disproportionately large share.'"
canonical-instances:
  - "A small supplier and a large supplier both deliver an identical batch of components to a dominant manufacturer, and the large supplier is paid a noticeably better rate per unit, while everyone involved considers this the ordinary, expected way business is done with that manufacturer -- the differential isn't a special favor or a violation of some fair-market norm, it's the norm, because price in that relationship has always tracked bargaining position rather than the component's own specification."
  - "Two freelance consultants pitch functionally identical proposals to the same client, and the more established, higher-profile consultant is paid substantially more for the same scope of work -- the client and both consultants would describe this as simply how the market works, illustrating that the 'going rate' for a service is frequently a rank-weighted number even when framed as an objective valuation of the work itself."
critical-questions:
  - "does this framework, by naming rank-weighted pricing as the 'equal' and fair baseline, risk normalizing an arrangement that a contribution-weighted standard would call exploitative -- is there a meaningful sense in which Kautilya's 'equal treaty' is actually equal, or does the label itself do rhetorical work to make a power-based schema feel neutral?"
  - "how would a weaker party ever accumulate enough leverage to renegotiate toward a more contribution-weighted arrangement if the baseline itself is defined to track and reinforce existing rank -- does the schema contain any internal mechanism for a weaker party's relative position to improve over time, or does it structurally lock in the current hierarchy?"
  - "are there real-world domains where pricing genuinely is contribution-weighted rather than rank-weighted, and if so, what structural feature (a truly anonymous market, a legally enforced equal-pay standard, a cooperative ownership structure) is doing the work of preventing rank from creeping back into the price, given how pervasive Kautilya's pattern appears to be once one looks for it?"
