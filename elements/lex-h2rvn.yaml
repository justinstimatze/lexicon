id: lex-h2rvn
name: an-innocent-conscience-leaves-nothing-for-a-threat-of-exposure-to-grip
type-in: situation
type-out: state
_tier: atomic
agent-instruction: 'A campaign of escalating terror only works on someone with something to protect from being found out — against a person whose conscience is genuinely clean, the fear response the threats are built to trigger has nothing to attach to, because there is no exposure to dread in the first place. In the Vidhurapandita-Jataka, the Yakkha Punnaka, having captured Vidhura on the Black Mountain, runs through an entire escalating arsenal of terror — assuming a demon''s form to threaten to devour him, then a lion, an elephant, a giant serpent, a mountain-shaking wind, an earth-splitting roar — and "not a hair of the Great Being stood on end" through any of it. Vidhura''s own account of why is explicit: "Of whom shall I be afraid, when I have done no evil to him by body, speech or thought, whereby I could come to misfortune?" The fear was never really about the threats themselves; it depended on there being something the target needed the threats to not reveal.'
related: []
evokes: [jataka, mahanipata, vidhurapandita-jataka, fearlessness, clean-conscience, terror-tactics-fail]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-vidhurapandita-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 545, Vidhurapandita-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Of whom shall I be afraid, when I have done no evil to him by body, speech or thought, whereby I could come to misfortune?"
canonical-instances:
  - "A journalist under threat of a source's identity being 'exposed' to intimidate them into silence isn't moved, because they never promised anonymity they weren't prepared to honor and have nothing hidden that the threat could actually leverage."
  - "An auditor pressured by a company executive with vague warnings about 'consequences' for flagging discrepancies continues the audit undeterred, because the threat is aimed at someone with something to lose from the finding, and the auditor has no stake in the number coming out any particular way."
critical-questions:
  - "Vidhura's fearlessness here also depends on genuine equanimity about death itself, not just innocence — is a clean conscience alone sufficient to defeat terror tactics, or does it only work in someone who has also made peace with the worst outcome the threat could deliver?"
  - "Punnaka escalates through six distinct terror tactics before giving up on fear entirely — at what point does an aggressor's own persistence in the face of total non-response become evidence to them that the tactic itself, not just this particular target, has failed?"
status: active
