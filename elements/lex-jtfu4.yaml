id: lex-jtfu4
name: the-audience-selects-its-own-meaning-from-your-symbol
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before assuming a message will land the way you intend, check whether you are relying on your own understanding of it as evidence for how the audience will read it — Merton and Lazarsfeld show this is exactly the assumption that fails, because a receiver doesn't take in your intended whole, they select whichever piece of it fits their own existing categories. Their illustrating parable: a missionary pointed to a table and repeatedly said 'table' until his non-literate audience could repeat the word, then was dismayed to learn that some had generalized 'table' to a tree, because both were brown, and others to dogs, because both had four legs — each listener selecting some aspect of the complex object which, for the missionary, was so well designated as a whole by a single word. The same failure recurs with sophisticated audiences and serious content: films built to dramatize the cruelty and immorality of the Nazis were instead appraised by audiences in purely technical terms, taken as illustrations of Nazi efficiency, because the emotional and moral implications the producers intended were overlooked in favor of whatever the audience's own frame of reference — here, competence and organization — made most salient. Diagnostic move: don't trust your own reaction to a message as a proxy for the audience's; the gap between intended and received meaning is not a defect in the audience's attention, it is the normal operation of interpretation, and it means the same symbol can be read as evidence for entirely different, even opposite, conclusions depending on which framework the receiver already has available to sort it into."
