id: lex-4yj4s
name: a-coupled-systems-other-half-follows-once-one-half-moves
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When two parts of a system are mechanically coupled, moving one part can be trusted to carry the other along, so a partial or asymmetric intervention can substitute for a full one where a full one isn't achievable. Douglass names the folk logic directly, applying it to why he accepted the Emancipation Proclamation's partial scope (it abolished slavery only where military necessity reached, leaving it untouched elsewhere) rather than holding out for a complete abolition the political moment could not yet deliver: 'For my own part, I took the proclamation, first and last, for a little more than it purported; and saw in its spirit, a life and power far beyond its letter... It is not a bad thing to have individuals or nations do right though they do so from selfish motives. I approved the one-spur-wisdom of ‘Paddy’ who thought if he could get one side of his horse to go, he could trust the speed of the other side.' The proverb's own mechanism is purely mechanical: a horse's body is one physically joined whole, so spurring one flank is a sufficient cause of the entire animal moving -- the coupling itself does the rest of the work, with nothing further needed to explain why the rest comes along. Douglass's bet was that the war and the moral cause of abolition were coupled the same way: pushing the war forward, even for the government's own selfish military reasons, would carry the anti-slavery cause forward with it."
