id: lex-kjckg
name: witnessed-rivalrous-violence-reveals-desire-as-the-root-of-destruction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'Watching one animal kill another in a contest driven by sexual jealousy, a person can generalize that desire itself is the root cause of destructive conflict among living beings generally. In the Jataka''s tale of Kumbhakara, King Dummukha reaches paccekabuddha-hood from exactly this observation: "Living beings from the state of beasts upwards reach sorrow from the power of lust: this bull through lust has reached death: other beings also are disturbed by lust: I ought to abandon the lusts that disturb those beings."'
related: []
evokes: [jataka, sattanipata, kumbhakara-jataka, desire-as-root-of-destructive-conflict, witnessed-violence-triggers-insight]
lineage:
  - source: primary
    text: jataka-chalmers1895-kumbhakara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 408, Kumbhakara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Living beings from the state of beasts upwards reach sorrow from the power of lust: this bull through lust has reached death: other beings also are disturbed by lust: I ought to abandon the lusts that disturb those beings:"
canonical-instances:
  - "After watching two department heads destroy their working relationship competing for the same promotion, a director who was quietly angling for the same role decides to withdraw her own candidacy rather than risk becoming the third casualty of the same underlying appetite."
critical-questions:
  - "Does generalizing from one destructive rivalry to a universal rule about desire risk treating every instance of ambition as equally dangerous, when most competitive drives don't end in destruction?"
  - "Is abandoning the underlying desire actually achievable by resolution alone, or does the resolve tend to fade once the vivid memory of the triggering event does?"
status: active
