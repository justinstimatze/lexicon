canonical-instances:
  - "A company's annual sustainability report devotes half its pages to environmental risk and half to positive initiatives, a defensible aggregate split — but the risk content lives entirely in a dense appendix nobody reads, while the initiatives dominate the widely-shared executive summary, so the audience that only sees the summary receives a purely celebratory message regardless of the document's overall balance."
  - "A political ad campaign runs a 50/50 split between policy substance and character attacks across its full media buy, but the substance runs almost entirely in long-form podcast ads that few undecided voters hear, while the character attacks dominate the short spots that make up most actual impressions — so the audience that determines the election outcome receives an overwhelmingly attack-focused message despite the campaign's balanced aggregate spend."
critical-questions:
  - "Once a producer discovers a per-channel imbalance like this, is the fix to rebalance each channel to match the intended aggregate theme, or to accept that different channels reach different sub-audiences and deliberately target each channel's theme to the audience that actually consumes it?"
  - "How do you identify, in advance of testing, which channel a specific target sub-audience will disproportionately consume — is this predictable from demographic or literacy data the way it was here, or does it usually require the same kind of after-the-fact interview-based discovery Merton and Lazarsfeld describe?"
