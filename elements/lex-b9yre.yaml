id: lex-b9yre
name: attribute-offered-where-essence-was-asked
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a definition or explanation is offered in the form 'X is that which produces/elicits/receives reaction R' (piety is what all the gods love; a good decision is one that gets praised; a valid theory is one experts accept), apply the Euthyphro priority-test (Plato, Euthyphro 10a-11b) before accepting R as X's essence. The test: is R PRIOR-IN-NATURE to X (R causes X, so naming R genuinely defines X), or is R POSTERIOR to X (X causes R, so R is merely a symptom or consequence of X, not its essence)? Socrates supplies the operational mechanism as a grammatical/causal asymmetry that holds across a whole family of active/passive pairs: 'a thing is not seen because it is visible, but visible because it is seen; nor is a thing led because it is in the state of being led, or carried because it is in the state of being carried, but the converse of this... any state of action or passion implies previous action or passion.' Applied to the case at hand: 'the holy has been acknowledged by us to be loved of God because it is holy, not to be holy because it is loved... that which is dear to the gods is dear to them because it is loved by them, not loved by them because it is dear to them.' Euthyphro had offered 'loved by the gods' as if it were piety's essence; the test reveals it is at most piety's EFFECT — 'to offer an attribute only, and not the essence.' The generalized diagnostic: given a proposed definition of X via some reaction R that X provokes, ask which direction the causal arrow actually runs. If X would still produce/deserve R even in a possible case where R happened not to occur (the thing would still BE X, just unrecognized/unrewarded/unloved), then R is posterior — a reliable correlate, maybe even a good practical proxy, but not what makes X what it is. If R is what CONSTITUTES X such that X could not exist prior to or apart from R (there is no piety 'underneath' the gods' love that the love merely detects), then R may genuinely be doing definitional work. Most 'X is what gets reaction R' definitions fail this test the moment you ask it directly, because R is usually a downstream social or perceptual response (loved, praised, accepted, punished, believed) rather than a constitutive cause — which is exactly why the test is worth running before treating a popular proxy metric as if it were the thing itself."
related: [lex-fpvsu, lex-aut4h, lex-4ph7n, lex-rjaeb, lex-jyzng]
evokes: [loved-because-holy-not-holy-because-loved, seen-because-visible-not-visible-because-seen, prior-in-nature-versus-posterior-effect, the-euthyphro-priority-test, correlate-mistaken-for-essence]
lineage:
  - source: primary
    text: plato-c385bce-euthyphro-priority-test-attribute-vs-essence
    citation: "Plato, Euthyphro, 10a-11b, in The Dialogues of Plato, trans. Benjamin Jowett (3rd ed., 1892; epub edition consulted, extracted from plato_dialogues_benjamin-jowett_advanced.epub). Euthyphro has just defined piety as 'that which is dear to the gods.' Socrates introduces the priority question and works through a chain of active/passive-voice examples (carrying/carried, leading/led, seeing/seen) to establish the general principle that a state-of-being-acted-upon always follows, and never precedes, the corresponding act — then applies this to show that 'dear to the gods' is at best an effect of piety, not its defining essence."
    quote: "The point which I should first wish to understand is whether the pious or holy is beloved by the gods because it is holy, or holy because it is beloved of the gods. [...] a thing is not seen because it is visible, but conversely, visible because it is seen; nor is a thing led because it is in the state of being led, or carried because it is in the state of being carried, but the converse of this. [...] any state of action or passion implies previous action or passion. It does not become because it is becoming, but it is in a state of becoming because it becomes; neither does it suffer because it is in a state of suffering, but it is in a state of suffering because it suffers. [...] the holy has been acknowledged by us to be loved of God because it is holy, not to be holy because it is loved. [...] that which is dear to the gods is dear to them because it is loved by them, not loved by them because it is dear to them. [...] Thus you appear to me, Euthyphro, when I ask you what is the essence of holiness, to offer an attribute only, and not the essence — the attribute of being loved by all the gods."
canonical-instances:
  - "The direct textual anchor: Socrates tests Euthyphro's definition of piety as 'what all the gods love' by asking whether the gods' love is the cause of piety or merely its consequence, and shows via the active/passive-voice pattern that love-by-the-gods can only be a consequence — an attribute, not the essence."
  - "A metric adopted as a proxy for quality (a paper is good because it's highly cited; a hire is good because they interview well; code is good because it passes review) mistakes a downstream social response for the underlying property. The priority test: would the paper/hire/code still have the underlying quality in a counterfactual world where the citation, interview, or review process failed to register it? If yes, the metric is posterior — a correlate worth tracking, but not the definition."
  - "A company defines 'a good employee' as 'one management approves of.' Applying the test: is approval prior to good performance (approval causes/constitutes goodness) or posterior (good performance causes approval, and approval can misfire — a good employee unfairly overlooked is still good)? Naming the reaction as the definition collapses the distinction and makes the metric unfalsifiable by the very performance it was meant to track."
critical-questions:
  - "how does this differ from lex-aut4h (argument-from-commitment, which ALSO cites this exact Euthyphro 10a-11b passage as its canonical instance)? lex-aut4h is a DIALECTICAL-FORCE move: an interrogator draws out an interlocutor's prior commitment and uses it to force acceptance of, or explicit retraction from, a later contradictory position — the mechanism is social/argumentative (you said X, X entails Y, you now resist Y, one must give). This atom is a DEFINITIONAL-ANALYSIS move: independent of any dialogue or opponent, it names the specific causal/grammatical test (does the state follow the act, or the act follow the state) used to distinguish a thing's essence from a derived attribute. lex-aut4h could fire with a completely different priority-test-free contradiction; this atom could fire on a definition encountered in a book with no interlocutor to corner at all. They compose in the source passage — Socrates uses the priority-test (this atom) as the specific tool that generates the contradiction lex-aut4h's scheme then exploits — but the tools themselves are distinct and separately portable."
  - "how does this differ from lex-4ph7n (mechanism-that-enables-an-act-is-not-its-reason, also from the Socratic corpus)? lex-4ph7n distinguishes a NECESSARY-CONDITION/MECHANISM (bones and muscles enabling Socrates to sit) from the actual PURPOSIVE REASON (his judgment that enduring the sentence was right) — both are real and simultaneous, and the error is treating the enabling mechanism as if it answered a why-question aimed at purpose. This atom distinguishes an EFFECT/ATTRIBUTE from an ESSENCE where the two are temporally and causally ordered (one must be prior, the other posterior) — the error is treating a downstream consequence as if it were the defining property upstream of it. Different axis: mechanism-vs-purpose (lex-4ph7n) is not essence-vs-attribute (this atom), though both are 'two things get conflated that a careful question can pull apart' patterns from the same Socratic toolkit."
  - "how does this differ from lex-rjaeb (desiring a quality does not mean the desirer possesses it)? lex-rjaeb is specifically about ORIENTATION-TOWARD implying LACK-OF (pursuing X is evidence you don't yet have X). This atom is about which of two correlated things is causally/definitionally PRIOR — it says nothing about desire or lack, and applies equally to cases with no desire involved at all (a thermometer reads hot because the room is hot, not the reverse; the room isn't hot because the thermometer reads hot)."
  - "what happens when the direction is genuinely ambiguous or bidirectional (e.g. social status and behavior often reinforce each other in a loop)? The test still has diagnostic value even without a clean answer: naming the question ('which way does the arrow actually run, or do both hold under feedback') is itself progress over silently treating the correlate as the essence. A feedback loop is a different structure from a one-way essence/attribute relationship, and recognizing that the relationship IS a loop (rather than forcing it into one direction) is itself a valid outcome of running the test."
