lineage:
  - source: primary
    text: henrich-2020-weirdest-people-in-the-world-preface-and-ch1
    citation: "Joseph Henrich, *The WEIRDest People in the World: How the West Became Psychologically Peculiar and Particularly Prosperous* (Farrar, Straus and Giroux / Penguin 2020), Preface and Ch.1 ('WEIRD Psychology'). Henrich (Harvard Department of Human Evolutionary Biology) presents the canonical book-length extension of the 2010 Henrich-Heine-Norenzayan *Behavioral and Brain Sciences* paper 'The weirdest people in the world?' The 2010 paper documented three empirical findings: (1) ~96 percent of experimental psychology participants are drawn from northern Europe, North America, or Australia, with ~70 percent American undergraduates; (2) cross-cultural psychological variation is substantially larger than textbooks suggest, spanning visual illusions, spatial reasoning, memory, attention, patience, risk-taking, fairness, induction, executive function, pattern recognition; (3) Western samples typically anchor the extreme end of the cross-cultural distribution — they are statistical outliers, not the human norm. The book extends the methodological warning to a substantive causal claim (the medieval church's Marriage and Family Program restructured kinship → produced WEIRD psychology → enabled distinctive WEIRD institutions), but the transferable headline primitive lives in the Preface and Ch.1: when generalizing about 'humans,' check whether your sample is WEIRD-biased; if so, your claim is about WEIRD humans specifically, not humans-in-general. The cross-domain extension matters because WEIRD-sample bias pervades behavioral economics, HCI, educational research, anthropological 'human nature' claims, LLM training corpora and evaluation benchmarks, and public-policy pilot studies — domains where the WEIRD-sampled finding is routinely treated as a universal claim. Henrich's transferable contribution beyond the 2010 paper is the Preface's articulation of the INVISIBILITY of the bias from inside the WEIRD-dominated discipline: WEIRD researchers gravitate toward aspects of psychology on which they themselves stand out, making WEIRD-typical features appear universal-and-default while WEIRD-atypical features appear exotic-and-deviant. The bias is thus self-reinforcing at the discipline level."
    quote: "[Henrich 2020 Preface, on the three findings of the 2010 paper:] 'Independently, all three of us had noticed—within our separate domains of expertise—that Western populations were often unusual when compared to two or more other populations. Over Chinese takeout, in a basement food court where the famed psychologists Daniel Kahneman and Amos Tversky had purportedly hatched their plans to examine rational decision-making, we decided to compile all the cross-cultural studies that we could locate on important aspects of human psychology. After carefully reviewing all the research that we could locate, we arrived at three striking conclusions: 1. Massively biased samples: Most of what was known experimentally about human psychology and behavior was based on studies with undergraduates from Western societies. At the time, 96 percent of experimental participants were drawn from northern Europe, North America, or Australia, and about 70 percent of these were American undergraduates. 2. Psychological diversity: Psychological differences between populations appeared in many important domains, indicating much greater variation than one might expect from reading the textbooks or major journals in either psychology or behavioral economics. 3. Psychological peculiarity: When cross-cultural data were available from multiple populations, Western samples typically anchored the extreme end of the distribution. They were psychologically weird.' [Preface, on the indispensable inferential consequence:] 'Taken together, these three findings meant that almost everything we—scientists—knew about human psychology derived from populations that seemed to be rather unusual along many important psychological and behavioral dimensions. Crucially, there was no obvious way to tell whether a psychological pattern found in Western undergraduates would hold cross-culturally, since existing research going back over a half century had revealed differences across populations in people's susceptibility to visual illusions, spatial reasoning, memory, attention, patience, risk-taking, fairness, induction, executive function, and pattern recognition.' [Preface, on the WEIRD acronym:] 'In these publications, we dubbed the populations so commonly used in psychological and behavioral experiments as \"W.E.I.R.D.\" because they came from societies that are Western, Educated, Industrialized, Rich, and Democratic.' [Preface, on the invisibility-of-bias-from-inside the discipline:] 'We wondered if WEIRD researchers—who entirely dominate the relevant scientific disciplines—might have unknowingly gravitated toward those aspects of psychology or behavior on which they themselves—their populations—were likely to stand out. Steve wondered aloud at lunch about what Japanese psychology might look like if Japanese researchers had developed their own version of this discipline, without first importing Western concepts, interests, and emphases.'"
canonical-instances:
  - "the canonical psychology cases (Henrich-Heine-Norenzayan 2010 BBS paper): visual illusions (Müller-Lyer illusion susceptibility varies cross-culturally; WEIRD populations are particularly susceptible while many small-scale societies are not); spatial reasoning (WEIRD populations are particularly field-INDEPENDENT, while many non-WEIRD populations are field-DEPENDENT); memory and attention (WEIRD populations use particular encoding strategies that are unusual cross-culturally); patience and intertemporal choice (WEIRD discount rates are at one extreme); risk-taking (WEIRD risk-preference distributions are atypical); fairness games (WEIRD ultimatum-game responses are unusual — high willingness to reject unfair offers at cost to self); induction and pattern recognition (WEIRD inductive biases differ from non-WEIRD). In each case, the WEIRD-sampled finding was previously generalized as a 'human' finding; cross-cultural data showed WEIRD samples were the extreme tail, not the central tendency"
  - "behavioral economics instances: the Kahneman / Tversky / Thaler / Ariely experimental corpus is heavily WEIRD-sampled, particularly American-undergrad-heavy. Findings like loss aversion, status-quo bias, mental accounting, choice-set framing effects, and the Allais paradox have well-replicated profiles in WEIRD samples; cross-cultural replication shows substantial variation in the magnitude and direction of these effects. Transferable consequence: behavioral-economics-informed policy interventions (nudge units, default-setting design, choice architecture) calibrated to WEIRD-sampled findings may produce unintended effects when deployed cross-culturally; the practitioner-discipline is to ASK at policy-design time whether the underlying experimental sample matches the deployment population"
  - "AI training corpora instances: large language models are trained on corpora that are overwhelmingly English-language and overwhelmingly WEIRD-authored (English Wikipedia, English-language Reddit, English-language Common Crawl, English-language books). The models therefore inherit WEIRD psychological defaults in their reasoning, ethical intuitions, social-reasoning patterns, fairness intuitions, individualism vs collectivism balance, and trust-in-strangers patterns. When these models are deployed cross-culturally, their WEIRD defaults register as 'cultural insensitivity' or 'bias' in non-WEIRD deployment contexts. The transferable practitioner-discipline is to ANTICIPATE this at training-data-curation time (deliberately broaden cross-cultural representation in training data and RLHF preferences), not at deployment-bug-report time"
  - "LLM evaluation benchmark instances: many LLM evaluation benchmarks (MMLU, BIG-bench, MT-Bench, AlpacaEval, ChatBot Arena, helpful-harmless-honest preference data) are heavily English-language and WEIRD-author-authored. Model capabilities measured against these benchmarks are capabilities WITH RESPECT TO WEIRD ground truth; model 'helpfulness' and 'harmlessness' are calibrated to WEIRD preferences. The transferable practitioner-discipline is to ASK whether the benchmark sample matches the deployment-context population, and to EXPLICITLY HEDGE benchmark-based capability claims as WEIRD-specific rather than universal"
  - "HCI and educational research instances: user-study samples in HCI research are dominated by WEIRD undergrads (the convenient population near the researcher's university); UX patterns derived from these studies may not generalize cross-culturally. Educational research samples are dominated by WEIRD students in WEIRD schools; educational interventions calibrated to these findings may not work in non-WEIRD educational contexts. Transferable consequence: the bias is structural in both fields and is typically NOT acknowledged in the generalization steps of published papers"
  - "anthropological 'human nature' instances: claims about 'human nature' — 'humans are naturally aggressive,' 'humans are naturally cooperative,' 'humans naturally favor in-group over out-group,' 'humans naturally have a particular moral psychology' — are routinely supported by evidence drawn from WEIRD samples (often supplemented by ethnographic anecdotes that the WEIRD researcher interprets through WEIRD categories). Henrich's transferable diagnostic: when an anthropological 'human nature' claim is made, ask what the empirical base is; if it traces to WEIRD-sample psychology, the claim is best read as 'WEIRD-human-nature' not 'human-nature-in-general'"
  - "operationally distinct from lex-xxmeh emotional-expression-as-cross-cultural-evolved-signature: lex-xxmeh (Brown 1991) describes the universality of certain emotion-display patterns across cultures. lex-6ju6z describes the OPPOSITE phenomenon — WEIRD-sample bias in psychological generalization. They are complementary: lex-xxmeh names what IS cross-culturally invariant; lex-6ju6z names what is NOT invariant but is routinely treated as such due to sampling bias. The two atoms together allow the practitioner to ask 'which of my generalizations rest on demonstrated cross-cultural invariants (lex-xxmeh territory) and which rest on WEIRD-sample bias (lex-6ju6z territory)?'"
  - "operationally distinct from lex-pm93k cultural-classification-bundles-or-splits: lex-pm93k (Brown 1991) describes variation in how cultures carve their classification axes. lex-6ju6z describes the methodological warning about generalizing from WEIRD samples to humans-in-general. They are operationally distinct: lex-pm93k is about variation that is recognized as cultural; lex-6ju6z is about variation that is misidentified as universal due to sampling bias"
  - "operationally distinct from lex-2czcp vivid-concrete-instance-dominates-abstract-statistical: lex-2czcp (Heuer / Kahneman) is about availability bias in judgment weight — vivid anecdotes outweigh abstract statistics. lex-6ju6z is about sampling-bias in cross-cultural generalization. They can co-occur (a WEIRD researcher's vivid memory of a WEIRD-undergrad result outweighs abstract awareness of cross-cultural variation), but the underlying mechanisms are operationally distinct"
  - "operationally distinct from lex-rbcsc worldview-shapes-values-shapes-history (Lent 2017): lex-rbcsc is about the macro-historical claim that worldviews shape values shape behavior at civilizational scale. lex-6ju6z is about the methodological-sampling warning that WEIRD samples anchor the extreme tail of cross-cultural variation. They are complementary: Lent's claim is one of the substantive findings that lex-6ju6z's methodological discipline would help researchers see clearly (WEIRD worldviews produce a particular value-and-behavior profile; non-WEIRD worldviews produce different profiles)"
critical-questions:
  - "the sample-naming question: in the generalization you are making (or evaluating), what is the actual sample on which the claim rests? Diagnostic prompts — geographic profile (where were participants drawn from?), educational profile (undergrads vs general population?), economic profile (high-income societies vs cross-cultural mix?), political profile (democratic vs non-democratic societies?), language profile (English-speaking vs cross-linguistic mix?). The sample-profile usually IS the WEIRD-profile in psychology / behavioral economics / HCI / educational research; explicit naming surfaces what is otherwise invisible"
  - "the cross-cultural-variation check: is the trait you are generalizing about KNOWN to vary cross-culturally? Henrich's list of WEIRD-atypical traits includes analytic vs holistic thinking, field-independence in perception, individualism / personal-self emphasis, impersonal trust, intent-vs-outcome moral reasoning, low context dependence, trust in strangers, weak in-group preferences, willingness to punish anonymous defectors, guilt vs shame emphasis. If your trait is in this set or adjacent to it, the WEIRD-sample generalization is suspect"
  - "the explicit-hedge discipline: when reporting WEIRD-sampled findings, EXPLICITLY HEDGE the generalization step. Replace 'humans do X' with 'in WEIRD populations, X' or 'in our sample of American undergraduates, X.' The discipline forces the inferential step (sample-to-population) to be visible rather than buried. The transferable diagnostic: papers, reviews, textbook chapters, AI capability claims, policy briefs that drop the sample-qualifier when summarizing findings are quietly making the WEIRD-to-universal generalization without justification. The practitioner-discipline is to put the qualifier back in"
  - "the invisibility-from-inside diagnostic (Henrich's Preface): WEIRD researchers gravitate toward aspects of psychology on which their populations stand out. The bias is structural at the discipline level and invisible from inside the discipline. The transferable diagnostic: when an entire field treats some feature as universal-and-default, ask 'is this feature actually universal or is it a WEIRD-typical feature that the WEIRD-dominated discipline gravitated toward?' The diagnostic surfaces structural biases that single-paper review processes cannot catch"
  - "the AI-training-corpus application: large language models are trained on overwhelmingly English-language WEIRD-authored corpora. The model therefore inherits WEIRD psychological defaults — individualism, intent-focused moral reasoning, impersonal trust intuitions, low context dependence, trust in strangers, weak in-group preferences. When deployed cross-culturally, these defaults register as 'cultural insensitivity' or 'biased outputs.' The transferable practitioner-discipline at training-data-curation time is to deliberately broaden cross-cultural representation in training data and RLHF preferences; at evaluation time is to test cross-cultural deployment performance separately from WEIRD-benchmark performance; at deployment time is to anticipate WEIRD-default behavior in non-WEIRD contexts rather than treating it as bugs to fix after release"
  - "the policy-and-intervention application: behavioral-economics-informed policy interventions (nudge units, default-setting design, choice architecture) are typically calibrated to WEIRD-sampled findings. When deployed in non-WEIRD jurisdictions, the same interventions may have different effects, no effects, or opposite effects. The transferable practitioner-discipline for policy designers is to ASK at policy-design time whether the underlying experimental sample matches the deployment population, and to RUN pilot studies in the actual deployment context rather than extrapolating from WEIRD-sample evidence"
status: active
