id: lex-dvv9g
name: material-hardship-escalates-in-a-fixed-sequence-toward-revolt
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When assessing the risk of open revolt, mass resignation, or defection in a group governed or employed by you, don't treat 'are they unhappy right now' as the operative question — check where they sit on a specific, ordered causal chain, because Kautilya names the sequence as fixed and irreversible once started, not a vague mood that might or might not escalate: 'When a people are impoverished, they become greedy; when they are greedy, they become disaffected; when disaffected, they either go over to the enemy or kill their ruler themselves.' Each stage in the chain is a distinct, checkable condition rather than a synonym for the others — impoverishment is a material fact, greed is a change in what people are willing to do to recover lost ground, disaffection is a loss of felt obligation to the current arrangement, and the final stage is a binary choice between exit (defection) and voice-turned-violent (revolt). Kautilya pairs the chain with a long enumerated list of the specific governance failures that start it, and the list's own character reveals what the chain actually tracks: it is not raw material scarcity in the abstract, but scarcity attributable to the ruler's own conduct — 'ignores the good [people] and favours the wicked,' 'fails to give what ought to be given and exacts what he cannot rightly take,' 'does not punish those who ought to be punished but punishes those who do not deserve to be,' 'fails to protect the people from thieves and robs them himself.' The chain is triggered by hardship the governed party experiences as caused by the governing party's own choices, not by hardship attributed to fortune, market conditions, or an external enemy. Diagnostic move: when trying to predict whether a currently-unhappy group is heading toward exit or open conflict, locate them on the chain rather than measuring unhappiness as an undifferentiated quantity — ask specifically whether material conditions have worsened, whether that worsening is attributed to the leadership's own conduct rather than external circumstance, and whether the resulting resentment has already curdled into a felt loss of obligation, since each of those is a separate, further-along position on the same chain and predicts a different remaining runway before exit or revolt."
related: [lex-asrjw]
evokes: [impoverished-greedy-disaffected-revolt, kautilya-sixteen-causes-of-disaffection, hardship-attributed-to-the-rulers-own-conduct, fixed-sequence-not-undifferentiated-unhappiness]
lineage:
  - source: primary
    text: kautilya-arthashastra-disaffection-chain
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part III 'The King,' section 'Revolts and Rebellions,' 'Disaffection among Subjects,' {7.5.27}."
    quote: "'When a people are impoverished, they become greedy; when they are greedy, they become disaffected; when disaffected, they either go over to the enemy or kill their ruler themselves.'"
  - source: primary
    text: kautilya-arthashastra-sixteen-causes-of-disaffection
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part III, section 'Disaffection among Subjects,' {7.5.19-26}."
    quote: "'Impoverishment, greed and disaffection are engendered among the subjects when the king: (i) ignores the good [people] and favours the wicked; ... (vi) fails to give what ought to be given and exacts what he cannot rightly take; (vii) does not punish those who ought to be punished but punishes those who do not deserve to be; ... (x) fails to protect the people from thieves and robs them himself.'"
canonical-instances:
  - "A company blames an industry-wide downturn for layoffs while employees privately attribute the cuts to executive bonuses paid out the same quarter — the disaffection chain activates specifically because the hardship is attributed to leadership's own conduct, not to the downturn itself, which is why two companies facing identical financial pressure can see very different rates of quiet quitting versus open revolt."
  - "A landlord who raises rents sharply while visibly under-maintaining the property triggers tenant organizing not merely because rents rose, but because the increase is legible as the landlord's own choice rather than an externally-forced cost pass-through — tenants at a building where the same increase came with visible capital improvements experience the same material hardship without the same disaffection."
critical-questions:
  - "how would an organization actually distinguish, in real time, whether a hardship is being attributed by the affected group to leadership's own conduct or to external circumstance — is this attribution itself observable before it manifests as disaffection, or only inferable after the fact from the presence or absence of revolt?"
  - "does the chain's apparent fixedness (each stage leads to the next) hold even when a leader intervenes mid-chain — if impoverishment is corrected before it produces greed, or greed is addressed before disaffection sets in, does the chain actually reverse, or does Kautilya's framing implicitly assume it only runs one direction once started?"
  - "is 'go over to the enemy or kill their ruler' really a binary terminal state, or are there intermediate outcomes (sustained low-grade resistance, work-to-rule, emigration without formal defection) that the chain's endpoint doesn't capture because Kautilya is specifically modeling an ancient monarchy's discrete options rather than a modern organization's more graduated ones?"
status: active
