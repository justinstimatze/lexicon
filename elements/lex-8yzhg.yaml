id: lex-8yzhg
name: a-rescue-is-legitimate-only-if-it-predicts-something-new
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a theory, plan, or claim survives a counterexample by adding a new auxiliary assumption, don't judge the save by whether it works — judge it by whether it adds anything checkable beyond the anomaly it was built to explain. Lakatos states the standard directly: 'It follows from my approach that it is rational to retain a syntactically metaphysical theory as the 'hard core' of a programme as long as its associated positive heuristic produces a progressive problem-shift.' ... 'If an auxiliary theory which performs the reinterpretation produces novel facts (that is, it is 'independently testable') the metaphysics should be regarded as good, scientific, empirical metaphysics, generating a progressive problem-shift. A progressive metaphysical theory produces a sustained progressive shift in its' ... 'protective belt of auxiliary theories. If the reduction of the theory to the metaphysical framework does not produce new empirical content, let alone novel facts, then the reduction represents a degenerating problem-shift—it is a mere linguistic exercise.' A save that predicts something new and independently testable earns its keep even if it was motivated purely by damage control. A save that only redescribes the same anomaly so it no longer counts against the theory hasn't earned anything, no matter how neatly it closes the immediate problem — and from the outside, in the moment, the two can look identical. Telling them apart means asking whether the save opens up anything new to check."
related: [lex-vmas8, lex-e6n6a]
evokes: [lakatos-1968-novel-facts-test, progressive-versus-degenerating-problem-shift, independently-testable-auxiliary-theory, ad-hoc-rescue, mere-linguistic-exercise]
lineage:
  - source: primary
    text: lakatos-1968-novel-facts-progressive-versus-degenerating
    citation: "Imre Lakatos, 'Criticism and the Methodology of Scientific Research Programmes,' Proceedings of the Aristotelian Society, New Series, 69 (1968-69): 149-186, at pp. 179-180."
    quote: "'It follows from my approach that it is rational to retain a syntactically metaphysical theory as the 'hard core' of a programme as long as its associated positive heuristic produces a progressive problem-shift.' ... 'If an auxiliary theory which performs the reinterpretation produces novel facts (that is, it is 'independently testable') the metaphysics should be regarded as good, scientific, empirical metaphysics, generating a progressive problem-shift. A progressive metaphysical theory produces a sustained progressive shift in its' ... 'protective belt of auxiliary theories. If the reduction of the theory to the metaphysical framework does not produce new empirical content, let alone novel facts, then the reduction represents a degenerating problem-shift—it is a mere linguistic exercise.'"
canonical-instances:
  - "Continental drift rescued by a mechanism, and the rescue itself tested: Wegener's 1912 theory was dismissed for decades for lack of a driving mechanism. Plate tectonics rescued it by proposing seafloor spreading — and the rescue predicted a new, independently checkable fact nobody had looked for: symmetric magnetic striping in the rock on either side of the mid-ocean ridges. The striping was found. A textbook progressive problem-shift."
  - "Lakatos's own counter-example, from the same paper: Cartesian physicists tried to reinterpret Newton's 'action at a distance' in terms of their own push-mechanics vortex model, to keep Cartesian metaphysics compatible with a rival, better-corroborated theory. The reinterpretation predicted no new observable fact of its own — Lakatos calls it 'a mere linguistic exercise,' the paradigm case of a degenerating problem-shift."
  - "Hypothetical: a team's retention metric misses target, and the team redefines 'engagement' to a measure the product already satisfies — a redescription with no new predictive content. A different team responds to the same miss by proposing a mechanism ('users churn because onboarding never reaches the second feature') that also predicts a specific, checkable change in a different metric next quarter. Only the second response has bought anything beyond surviving the miss."
critical-questions:
  - "Who decides whether a given rescue 'produces novel facts' — is novelty itself sometimes just a matter of nobody having happened to look for that particular fact yet, meaning almost any sufficiently imaginative rescue could claim novelty after the fact?"
  - "Lakatos allows a research programme intermittent degenerating phases and still calls the whole programme progressive ('the term intermittently gives sufficient scope for dogmatic adherence to a programme within the bounds of rationality') — how many degenerating rescues in a row turn a programme from struggling-but-progressive into actually-degenerating? He gives no threshold."
  - "Does 'novel' mean chronologically new — not yet observed by anyone — or merely new-to-this-theory — already known, but not predicted by this theory until now? The test yields a different verdict depending on which sense is meant, and Lakatos's own usage doesn't stay fixed on one."
