id: lex-98q4u
name: turning-away-powerful-buyers-preserves-sellers-bargaining-leverage
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a seller lacks a low-cost position or a genuinely unique product, chasing maximum sales volume across every available customer segment is self-defeating, because the segments with the most purchasing power are exactly the ones who will use that power to extract concessions — and the more of that business a seller wins, the more its overall profitability comes to depend on customers who can dictate terms. Porter's 1979 analysis states the reversal of the growth instinct directly: 'If the company lacks a low cost position or a unique product, selling to everyone is self-defeating because the more sales it achieves, the more vulnerable it becomes. The company may have to muster the courage to turn away business and sell only to less potent customers.' The strategic move is not to work harder to win the powerful accounts — it's to deliberately decline them and concentrate on segments with less bargaining leverage, even at the cost of total volume or market share. Porter cites National Can and Crown Cork & Seal doing exactly this: focusing on can-industry segments where they could build product differentiation and avoid the segments where buyer power would otherwise crush their margins. The counterintuitive part is that this looks like leaving money on the table — declining real, available business — when it is actually the mechanism that preserves the seller's pricing power on the business it keeps. Generalize beyond can manufacturing: an agency turns down a huge low-margin client who would dominate its capacity and dictate pricing on every future project, keeping capacity free for smaller clients who can't out-negotiate it; a software vendor declines to chase the single largest enterprise logo whose procurement team would demand custom terms that reshape the product roadmap around one account; a freelancer stops taking the highest-paying client whose scope creep and negotiating leverage make every project unprofitable per hour, and fills the freed capacity with several smaller, less demanding clients at a better blended rate. The diagnostic move: before treating a large potential customer as a pure win, ask what price and terms that customer's bargaining power will eventually extract, and compare total realized profitability (not top-line volume) against a portfolio of smaller, less potent accounts."
