id: lex-d7rvj
name: one-payment-can-defuse-both-bribery-and-usurpation-incentives
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When your most powerful subordinate holds enough independent capability to either defect to a rival or turn that capability against you directly, don't treat 'prevent them from being bribed away' and 'prevent them from seizing power themselves' as two separate problems needing two separate safeguards -- a single sufficiently large payment can remove the incentive for both at once, because both threats share the same underlying cause: the subordinate's own assessment of what's worth risking their current position for. Rangarajan's note on the Chief of Defence's pay explains the design intent directly: the senapati was paid 'a princely 48,000 panas per year, to prevent him from succumbing to the temptations of the enemy or rising up in revolt' -- one figure, named as solving both named risks in the same sentence. The mechanism works because both defection-to-a-rival and revolt-against-the-principal require the subordinate to judge that some alternative payoff exceeds their current position's value; raising the value of the current position raises the bar for both alternatives simultaneously, without requiring a separate structural fix (surveillance for one threat, a rival power center for the other) for each. This isn't a claim that money alone solves loyalty -- it's a claim that when a single quantity (the value of staying put) is what both defection and usurpation are being weighed against, adjusting that one quantity is more efficient than building two different countermeasures for what are actually the same comparison run twice. Diagnostic move: when worried about a powerful subordinate's loyalty on two fronts at once, check whether both risks reduce to the same underlying comparison (their current position's value versus an alternative's) -- if so, look for the single lever that raises the value of staying, rather than defaulting straight to separate monitoring or containment measures for each named threat."
