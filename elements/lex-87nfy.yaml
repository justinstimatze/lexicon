id: lex-87nfy
name: an-outcome-insured-hedge-lets-both-factions-sign-the-same-plan
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a group is deeply divided over a high-stakes action and neither faction can persuade the other, look for a proposal that produces a favorable story under both possible results of taking the action -- that structure can convert deadlock into unanimous agreement without either side conceding the argument. Graeber and Wengrow's case: Tlaxcala's council split between welcoming Hernán Cortés as an ally and refusing him as a mortal threat. Temilotecutl's proposal let Cortés enter the city, then had an allied Otomi contingent ambush him. If the ambush killed him, the council would be heroes who'd removed the danger. If it failed, they could disown the attack, blame the impulsive Otomi, and ally with Cortés anyway -- exactly what the other faction wanted all along. Whichever way the ambush went, someone on the council could call it a win, which is what let two factions that agreed on nothing else sign onto the same plan. The mechanism isn't compromise in the usual sense of splitting the difference; it's arranging for every branch of the outcome tree to read as a victory for whoever proposed it."
