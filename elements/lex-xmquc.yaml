id: lex-xmquc
name: practiced-motor-sequences-compile-into-entry-point-bound-grabs
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when someone has practiced a motor or procedural sequence (a scale on an instrument, a keyboard-shortcut chain, a touch-typed word, a surgical step, a dance combination) to fluency, and the question is what got stored and how it can be accessed. Sudnow's claim, from learning jazz-piano scales: a practiced sequence does NOT get stored as an addressable list of sub-facts ('finger 2 plays note B, finger 3 plays note C...') that could in principle be queried out of order. It compiles into a single whole-handed 'grab' — a felt, undifferentiated spatial-motor gestalt bound to its original entry point. Two structural consequences follow, both distinct from generic 'practice builds automaticity' claims: (1) ACCESS IS ENTRY-POINT-BOUND — the sequence executes fluently from the point it was learned from, but starting from a DIFFERENT point in the same sequence (a different note, a different letter) requires new practice even though the identical physical movements are involved once underway; the compiled grab does not generalize to arbitrary entry. (2) THE SUB-FACTS BECOME UNRECOVERABLE TO DELIBERATE RECALL — the finger-to-note or finger-to-key mapping that was consciously used to BUILD the grab is not merely deprioritized but actively inaccessible afterward: Sudnow reports having to physically replay a scale slowly, mid-conversation with his own students, to 'rediscover' which finger plays which note, because the compiled version no longer carries that fact in queryable form. Practitioner move: when debugging or trying to teach a skill you've over-learned, do not trust your verbal report of 'which sub-step comes first' — the report is being reconstructed from a slowed-down replay, not read off a stored fact-list, and can be subtly wrong about a skill you perform correctly at speed. When designing training, be aware that fluency built from one canonical entry point (the standard starting position, the textbook first move) will not automatically transfer to starting mid-sequence; that transfer is a SEPARATE skill requiring its own practice, not a free consequence of mastering the original entry."
related: [lex-rpftk, lex-uk653]
evokes: [handful-not-individual-note, whole-handed-entry, the-touch-typist-cant-say-which-finger, finger-by-finger-orientation-supplanted, entering-other-points-requires-new-practice]
lineage:
  - source: primary
    text: sudnow-2001-ways-of-the-hand-beginnings-handful
    citation: "David Sudnow, *Ways of the Hand: A Rewritten Account* (MIT Press, 2001; orig. 1978), Preface/Part One 'Beginnings,' pp.24-26."
    quote: "'When I first learned scales, I gave attention to each note and the finger whose use on each produced the most fluent production. But once a course was mastered, it became a way of my scale-playing hand, as chords had passed from being individually fingered to handfully grabbed places. I went for each scale at a particular place, a finger-by-finger orientation now supplanted by a whole-handed entry. Having scales available this way made it difficult at first to start the scale in the course of play on a note other than the starting note from which it was learned. Only after much practice at upward and downward movement did I get decent at entering other points... Going for this particular diminished scale seldom involved me starting on B with the second finger, say, not because I can't move around fast when starting there, but because (as the scale was known as a handful and not an individual note/individual finger affair) I \"didn't know\" that, for this scale's production, my second finger was used for a B. It was initially learned that way; once learned, just as the finger-character responsibilities on a typewriter are forgotten as conceptually available facts for the touch typist, so which finger played the B in the course of this particular diminished scale was unknown to me (when teaching scale fingerings to students today I must play scales slowly to rediscover best fingers; if you're a decent touch typist try calling out the names of letters on the second bank of characters without looking down).' (Sudnow, *Ways of the Hand*, pp.24-26)"
  - source: discovery-loop
    text: sudnow-ways-of-the-hand-mining-pass-
    citation: "*Ways of the Hand* (the 2001 MIT rewritten edition of the 1978 original) is a genuinely distinct, previously-unmined Sudnow work on jazz-piano skill acquisition and the phenomenology of embodied learning — distinct from Sudnow's earlier *Passing On* (1967), a different book about hospital death and dying. The source PDF is a native digitally-typeset edition, not a scan, so the quoted passage carries no OCR risk. Lex-0319 (James, habit-formation frees attention) is the closest neighbor by subject matter but answers a different question — what habituation is for (freeing attention) rather than what structure the compiled skill takes (an entry-point-bound grab whose sub-facts become unrecoverable). Lex-0761 (forgetting particulars is the mechanism of abstraction) is adjacent by the 'information becomes inaccessible' shape but concerns categorial abstraction across many particulars, not a single motor sequence's own internal addressing structure. Lex-0768 (identifier lookup walks the frame chain outward from its binding environment) is a loose structural-metaphor echo — bound access via a chain or entry point — from an entirely different domain, programming-language scoping, not a genuine content overlap. This atom is minted alongside lex-rpftk, a companion atom from the same source and an adjacent chapter."
canonical-instances:
  - "Sudnow's own diminished-scale case: fluent when entered on F (thumb) or A (fourth finger) — the two points practiced from — but requiring dedicated further practice before other entry points (starting on B, say) became available, despite the scale itself never changing."
  - "The touch-typist parallel Sudnow draws explicitly within the same passage: an experienced typist typically cannot reliably name which finger strikes a given letter on the numeric/symbol row without physically miming the motion first — the fact was true when the skill was being built and is no longer stored in retrievable form once the skill has compiled."
  - "Sudnow teaching his own students: to answer a fingering question accurately, he reports needing to play the scale slowly himself first, rather than being able to simply report the answer from memory — the expert's own compiled skill is not directly introspectable even by the expert."
critical-questions:
  - "Isn't this just 'practice makes it automatic,' i.e., a restatement of habit-formation/automaticity (compare lex-rgr3t)? The claim here is narrower and more structural: automaticity explains why the skill requires no attention once running; it doesn't by itself predict that the skill would be entry-point-bound (fail to generalize to a new starting point) or that the constituent facts would become actively unrecoverable rather than merely un-needed. Those two specific consequences are what distinguish an entry-point-bound 'grab' from a general claim about attention being freed."
  - "Could Sudnow simply be a bad reporter of his own cognition — maybe the finger-note mapping IS still stored and accessible, and he's merely too lazy or too fast a player to consciously retrieve it in the moment he's asked? The touch-typist analogue offers some independent check: this is a widely-replicable, low-stakes claim anyone can test on themselves (try naming which finger types a given symbol-row character without moving your hands) — the fact that it reliably surprises fluent typists is evidence the inaccessibility is structural rather than idiosyncratic to Sudnow's self-report, though this atom does not claim controlled experimental confirmation beyond that shared, replicable observation."
  - "Does 'entry-point-bound' mean the skill never transfers to new starting points at all, or just that it takes additional practice? Sudnow is explicit that it is the latter — 'only after much practice at upward and downward movement did I get decent at entering other points' — so the claim is that entry-point flexibility is itself a further, separately-acquired skill layered on top of the original compiled grab, not that the grab is permanently locked to one entry point."
severity-tier: info
