id: lex-pn8qn
name: down-crossing-status-stigmatized-more-than-up-crossing
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this when stigma attaching to category-crossing is ASYMMETRIC by direction — crossing from a culturally-privileged category toward a culturally-subordinated category attracts harsher stigma than crossing the reverse direction, even when the surface acts look symmetric. Serano's canonical case: in a male-supremacist gender hierarchy, trans women (assigned-male-at-birth → living-as-women) attract systematically harsher stigma than trans men (assigned-female-at-birth → living-as-men), and the differential is not explained by transphobia-plus-misogyny acting additively — it is a SPECIFIC compound (`trans-misogyny`) where the stigma targets the act of `choosing` the supposedly-inferior position despite having access to the supposedly-superior one. The structural mechanism: a hierarchy whose participants treat its top-position as obviously-superior generates intense stigma against members of the top-position who voluntarily cross down, because such crossings cast a `shadow of doubt over the supposed supremacy` of the top-position. Reverse crossings (subordinated → privileged) are read as social-mobility / aspiration / `improvement` and attract envy or aspirational-imitation, not the same compound stigma. Transferable applications: trans women face directionally-asymmetric stigma vs trans men (Serano's case); effeminate gay men face directionally-asymmetric stigma vs masculine lesbians in some patriarchal contexts; downwardly-mobile class-crossing (`class traitor`, `slumming`) is differently-stigmatized than upward class-crossing (`social-climber`); white-people adopting subordinated-culture markers (`wigger`, `weeaboo`, cultural-appropriation discourse) is differently-stigmatized than members of subordinated cultures adopting dominant-culture markers (assimilation, code-switching); able-bodied people simulating disability (`fakers`) face different stigma than disabled people performing ability; men taking on traditionally-feminine roles (stay-at-home dad, nursing) face different stigma than women taking on traditionally-masculine ones. The atom does NOT claim the two stigmas are non-existent in the reverse direction — only that the compound mechanism + the magnitude is directionally asymmetric. Use when (i) a category-crossing pattern is being analyzed and a critic claims the stigmas are `the same in both directions,` (ii) someone defends a hierarchy by pointing to symmetric-on-surface category-crossing, (iii) you are designing protection-doctrine and need to decide whether to treat directional cases symmetrically. Counter-move: name the direction of the crossing, name the supposed-superiority being defended, name the compound stigma that targets the down-crossing specifically."
