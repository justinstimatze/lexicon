id: lex-brx2h
name: a-ritual-can-be-a-fossilized-memorial-of-an-original-power-reapportionment
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A ritual practiced as if it were simply the traditional way of doing things can actually be a memorial that preserves, in its very structure, a specific historical act of a weaker party taking a share away from a more powerful one through trickery -- the ritual's ongoing form is evidence of that original negotiation, not a spontaneous custom that arose independently of any particular event. Hyde reconstructs Greek animal sacrifice this way: since 'the distributed portions of a Greek sacrifice represented the more abstract 'portions' of the parties involved, their political and spiritual functions,' the first sacrifice must correspond to an original reapportioning of those portions. And such reapportionings, historically, run one direction: 'such a change usually has the less powerful taking a share away from the more powerful... first he invents the trick of reapportionment, some sleight of hand by which the thigh of an ox ends up on the plate of a slave... a form of sacrifice emerges that memorializes both the trick and its consequences, the new order of things.' The ritual isn't decoration around an unrelated custom; its specific division of portions is the fossil record of who took what from whom, and how. Diagnostic move: when you encounter a ritual or standing practice whose specific division of roles, shares, or privileges seems arbitrary or merely traditional, consider whether that division actually preserves the memory of a real, specific negotiation or power shift, in which case the ritual's odd particulars are clues to reconstructing what was actually contested and won."
