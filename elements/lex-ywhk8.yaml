id: lex-ywhk8
name: gliding-past-pleading-strangers-unable-to-arrest-your-own-momentum
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person carried forward by some external, sustaining force can pass directly over others who are struggling and failing at an obstacle just below, hear them call out for help, and be unable to stop -- not from indifference but because the very force propelling them onward makes arresting their own motion impossible. Black Elk, floating fast toward his vision's destination, looks down at people trying and failing to cross a dark, roaring river: 'Weeping, they looked up to me and cried: \"Help us!\" But I could not stop gliding, for it was as though a great wind were under me.' The inability to help is structural, built into the same force that lets him reach his own destination, not a failure of will."
related: [lex-nb2gz]
evokes: [black-elk-speaks, visions-of-the-other-world, i-could-not-stop-gliding, a-great-wind-were-under-me, weeping-they-looked-up-to-me-and-cried-help-us]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch22-visions-of-the-other-world
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 22, 'Visions of the Other World.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "There was a fearful dark river that I had to go over, and I was afraid. It rushed and roared and was full of angry foam. Then I looked down and saw many men and women who were trying to cross the dark and fearful river, but they could not. Weeping, they looked up to me and cried: 'Help us!' But I could not stop gliding, for it was as though a great wind were under me."
canonical-instances:
  - "A rescue helicopter crew flying urgent supplies to one disaster zone spots a second group stranded and signaling below, but cannot divert without abandoning the mission already underway, and continues on while the group recedes behind them."
  - "An executive being promoted rapidly through a company notices colleagues struggling under a reorganization she has no power to pause or redirect from her new position, and watches their difficulty continue as her own trajectory carries her further away from where she could once have intervened."
  - "A student accepted into an accelerated program watches a close friend fall behind in the standard track, wanting to help, but finds the accelerated program's own pace leaves no room to step back and assist without leaving the program himself."
critical-questions:
  - "Is 'I could not stop gliding' a genuine structural limit of the vision's mechanics, or a way of narrating an uncomfortable failure to help as involuntary rather than as a choice the visionary might have resisted harder?"
  - "The people in the river are never identified -- are they specific individuals Black Elk recognized, or an undifferentiated crowd, and does that anonymity make the inability to help easier to report without lingering guilt?"
  - "Does the vision's larger promise, that the tree will bloom and the people will be saved, retroactively excuse this specific failure to stop for those calling out, or does it leave an unresolved tension between the collective salvation promised and the individuals left unaided within the very vision that promises it?"
status: active
