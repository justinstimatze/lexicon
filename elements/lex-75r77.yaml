id: lex-75r77
name: two-truths
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a question has two right-feeling answers in tension, surface the two-truths frame — both may be operationally true at different levels of description (ultimate vs conventional, or in different domains); the move is to name both levels, not to force one."
related: [lex-9m3vy, lex-nahg9, lex-u4cxv]
evokes: [conventional-vs-ultimate, samvrti-paramartha, two-tier-analysis, layer-relative-truth, both-true-in-their-layer]
lineage:
  - source: primary
    tradition: madhyamaka
    text: nagarjuna-mmk-24-8-10
    citation: "Nāgārjuna, Mūlamadhyamakakārikā 24.8-10 — the two-truths doctrine (saṃvṛtisatya / paramārthasatya, conventional truth / ultimate truth) as the framework on which all the Buddha's teaching rests. Sanskrit canonical text c. 2nd century CE, preserved through the Tibetan canon (Tengyur), the Chinese canon (Taishō 1564), and the Sanskrit transmission via Candrakīrti's Prasannapadā commentary. Principle-8(b) externally-cross-attested graduation: graduates via (i) canonical preservation across three independent textual traditions; (ii) multiple independent critical Sanskrit editions across 100+ years (La Vallée Poussin 1903-13 Madhyamakavṛtti, de Jong 1977 Adyar edition, Ye Shaoyong 2011 Mūlamadhyamakakārikā Sanskrit critical edition); (iii) 60+ years of stable English-language scholarly translations and commentaries that cite these verses consistently (Streng 1967, Garfield 1995, Westerhoff 2009, Siderits-Katsura 2013); (iv) Tsongkhapa's *Ocean of Reasoning* (rTsa shes ṭik chen, early 15th c.) provides the canonical Geluk Madhyamaka commentary stabilizing the conventional/ultimate distinction. The verbatim below is from Garfield 1995 (Oxford UP); the Sanskrit is from the standard critical edition transmitted through La Vallée Poussin and de Jong."
    quote: "[Sanskrit, MMK 24.8-10, La Vallée Poussin/de Jong critical edition:] dve satye samupāśritya buddhānāṃ dharmadeśanā | lokasaṃvṛtisatyaṃ ca satyaṃ ca paramārthataḥ || 24.8 || ye 'nayor na vijānanti vibhāgaṃ satyayor dvayoḥ | te tattvaṃ na vijānanti gambhīraṃ buddhaśāsane || 24.9 || vyavahāram anāśritya paramārtho na deśyate | paramārtham anāgamya nirvāṇaṃ nādhigamyate || 24.10 || [English, Garfield 1995 p.298, Oxford UP:] 24.8 The Buddhas' teaching of the Dharma / Is based on two truths: / A truth of worldly convention / And an ultimate truth. 24.9 Those who do not understand / The distinction drawn between these two truths / Do not understand / The Buddha's profound truth. 24.10 Without a foundation in the conventional truth, / The significance of the ultimate cannot be taught. / Without understanding the significance of the ultimate, / Liberation is not achieved."
  - source: practitioner
    text: garfield-1995-fundamental-wisdom-of-the-middle-way
    citation: "Jay L. Garfield, The Fundamental Wisdom of the Middle Way: Nāgārjuna's Mūlamadhyamakakārikā (Oxford University Press 1995). The most-widely-cited English-language translation-plus-commentary; Garfield's Ch.24 commentary (pp.293-321) operationalizes the two-truths doctrine for analytic-philosophy readers. Tier-3 deepening source — stable across multiple printings since 1995 and quoted in thousands of independent secondary works. The verified Sanskrit + Garfield English verbatim above is central; this entry attributes the English translation."
    quote: "[Tier-3 deepening source; the verbatim entry above carries the critical translation of MMK 24.8-10 as Garfield rendered it. Garfield's commentary pp.298-302 unpacks: 'The doctrine of the two truths is the linchpin of Madhyamaka philosophy. Without it, the conventional and the ultimate cannot be brought into coherent relation; with it, the apparent contradictions of Madhyamaka discourse become methodologically intelligible.']"
  - source: practitioner
    text: streng-1967-emptiness
    citation: "Frederick J. Streng, Emptiness: A Study in Religious Meaning (Abingdon Press 1967). The first major Western critical-scholarly study of Nāgārjuna's Madhyamaka in English. Streng's Ch.5 'Two Levels of Truth' (pp.94-105) establishes the saṃvṛti/paramārtha distinction for English-language scholarship. Tier-3 deepening source — the foundational secondary text in the English Madhyamaka tradition; 60-year reception confirms the conventional-ultimate distinction as canonical. Adds to the principle-8(b) attestation chain by being independent of and prior to Garfield."
  - source: practitioner
    text: westerhoff-2009-nagarjunas-madhyamaka
    citation: "Jan Westerhoff, Nāgārjuna's Madhyamaka: A Philosophical Introduction (Oxford University Press 2009). The current analytic-philosophy reference for Madhyamaka; Westerhoff's Ch.9 (pp.187-220) treats the two-truths doctrine with formal-philosophical rigor, drawing the distinction between epistemic and ontological readings. Tier-3 deepening source — completes the 8(b) cross-attestation triad (Streng-religious / Garfield-Tibetan-influenced / Westerhoff-analytic-philosophy). The atom's pivotal claim survives across all three interpretive frames."
canonical-instances:
  - "the canonical Madhyamaka example: 'the chariot' (rathaḥ). Conventional truth: the chariot exists, you can ride it, designate it, name it; ultimate truth: the chariot is a designation upon parts (wheels, axle, body) with no independent self-nature (svabhāva). Both truths hold at their proper layer — denying conventional truth produces nihilism; denying ultimate truth produces reification."
  - "distinguishing 'the table is solid' (conventional truth, useful for action) from 'the table is mostly empty space' (ultimate truth at finer-grain analysis) — both true in their layer; refusing the question 'but which is REALLY true?' as itself layer-confused"
  - "the move that makes 'free will is real' and 'free will is illusion' compatible by assigning each to its proper analytical layer — folk-psychological level (real, the moral-responsibility framework applies) and reductive-physical level (illusion, the deterministic substrate doesn't admit it). The two-truths frame defuses the apparent contradiction without privileging either layer."
  - "engineering: 'is this code thread-safe?' has a two-truths shape. Conventional: under documented usage patterns, yes — the API contracts hold. Ultimate: at the memory-model layer, race-conditions exist in theory but never fire under those usage patterns. Both true; conflating them produces either over-engineering (treating documented-safe as not-safe-enough) or under-engineering (treating documented-safe as ultimately-safe)."
  - "science: Newtonian mechanics is conventionally true (predictively accurate at human scales) and ultimately false (relativistic mechanics is the deeper layer). The two-truths frame is exactly the Madhyamaka analogue of physics-regime-selection (lex-sjsxx) — each layer admits its own correctness without invalidating the others."
  - "operational discriminator: when a claim seems contradictory, ask whether the two contradicting versions are operating at different analytical layers. If yes, both can be true in their layer; the apparent contradiction is layer-collision, not first-order contradiction."
  - "operationally distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition: lex-mnxhs resolves contradiction by separating the parameter axis. The two-truths frame resolves contradiction by separating the analytical layer. Adjacent but distinct — TRIZ-axis is intra-layer; two-truths is cross-layer."
  - "operationally distinct from lex-9m3vy catuskoti-schema: catuskoti gives FOUR positions over a single claim (assert/deny/both/neither). Two-truths gives TWO LAYERS at which a claim can be evaluated. They compose: a claim can take any of the four catuskoti positions AT EACH OF the two truths-layers. Madhyamaka practice deploys them together — different positions per layer is the canonical move."
  - "key critical question: how many layers are admitted, and who decides? Classical Madhyamaka admits two; Tsongkhapa's commentaries multiply them (svatantra-vs-prasaṅga sub-distinctions). The two-truths is the minimum-viable form; richer practice may stratify further. The discipline: when a single layer can't accommodate the observed evidence-claims, add one — but justify the addition."
critical-questions:
  - "how many layers are admitted, and who decides? Classical Madhyamaka admits two; richer practice (Tsongkhapa) stratifies further — the discipline is to add a layer only when a single layer can't accommodate the evidence, and to justify the addition explicitly"
  - "is the apparent contradiction layer-collision or genuine first-order contradiction? if you can't name the two layers and what each correctly asserts, you may be reaching for two-truths to dodge an honest disagreement"
  - "is this distinct from lex-mnxhs contradiction-resolution-via-parameter-decomposition? two-truths separates the analytical layer (cross-layer); lex-mnxhs separates the parameter axis (intra-layer). Confusing them produces TRIZ-shaped moves where two-truths-shaped moves are needed (or vice versa)"
  - "what would denying one layer look like? denying conventional truth produces nihilism; denying ultimate truth produces reification. If neither denial yields a recognizable failure-mode, the two layers may be illusory — a distinction without a difference"
status: active
