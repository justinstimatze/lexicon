id: lex-h7kmr
name: a-buffer-trades-uncertain-earliness-for-certain-lateness
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Before padding a schedule with a safety margin to avoid missing a date, do the arithmetic on what that buffer actually costs. A buffer converts a chance of finishing early into a guarantee of finishing exactly as late as the buffer is long — the expected delay reduction it buys is always smaller than the delay it guarantees, so trading cycle time for reduced schedule variability is usually a bad trade. Trade a different, cheaper variable instead."
related: [lex-hsbem, lex-m6ure]
evokes: ["the-cumulative-distribution-function-of-a-schedule", "50-percent-to-90-percent-confidence", "delay-money-not-time"]
lineage:
  - source: primary
    text: reinertsen-2016-principles-of-product-development-flow-ch4-buffer-principle
    citation: "Donald G. Reinertsen, The Principles of Product Development Flow (2nd ed. 2016), Ch.4 'Exploiting Variability,' Principle V11 'The Buffer Principle.' Reinertsen's example commits to a 90 percent confidence date (15 months) instead of the 50 percent confidence date (12 months), inserting a 3-month buffer — a buffer that eliminates the chance of being late but guarantees the project finishes no earlier than 15 months, converting uncertain earliness into certain lateness."
    quote: "[Reinertsen 2016, Ch.4:] 'V11: The Buffer Principle: Buffers trade money for variability reduction. ... Let's say our original schedule had 50 percent chance of being complete at 12 months. To increase certainty, we commit to the 90 percent confidence point, 15 months. We have inserted a 3-month buffer, decreasing the chance that the project will be late. ... It should be apparent that the expected delay reduction associated with a buffer is always less than the total delay generated by the buffer itself. A buffer converts uncertain earliness to certain lateness. Thus, it is generally a bad idea to trade cycle time for reduced variability in cycle time.'"
canonical-instances:
  - "Reinertsen's 50%-to-90%-confidence example itself (Ch.4): committing to the 90 percent confidence date instead of the 50 percent date buys certainty about the deadline at the direct cost of 3 guaranteed months that a 50/50 commitment would have had a real chance of beating."
critical-questions:
  - "Has the actual expected-delay-reduction been computed against the buffer's own length, or is 'let's add a safety margin' being adopted on the intuition that any buffer is free insurance?"
  - "Is there a cheaper variable this schedule risk could be shifted into instead (expense, unit cost, a feature) rather than paying for it in guaranteed calendar time?"
  - "Is the buffer being consumed gradually in small increments as the project proceeds, rather than preserved and restored to the center of its range — Reinertsen's periodic-resynchronization point, which treats a buffer nibbled away in pieces very differently from one held intact until genuinely needed."
status: active
