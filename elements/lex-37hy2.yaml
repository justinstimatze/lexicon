id: lex-37hy2
name: reframing-a-temptation-as-a-demon-breaks-its-hold
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone you're protecting has fixated on a person or experience that endangers them, and they lack the framework to see the danger themselves, the plain truth can be too weak a tool — 'that was an ordinary person, and you're infatuated' leaves the pull of memory fully intact, or even confirms it was real and worth pursuing again. A frightening reframe can succeed exactly where the accurate one fails. In the Jataka's tale of Nalinika, the naive ascetic Isisinga, raised in total isolation and having never seen a woman, is seduced by a princess sent to break his virtue and end a drought; when she leaves him fevered and lovesick, his father answers his son's raving description of her with a warning about demons who roam the earth in disguise — \"Demons there be that through the wide earth run / In varied form disguised. Beware, my son! / He that is wise should not consort with such; / Virtue herself is blasted at their touch.\" The son concludes she was a female yakkha and, terrified, drops the fixation on the spot, begging his father's forgiveness."
related: []
evokes: [jataka, pannasanipata, nalinika-jataka, fear-based-deterrence, protective-deception]
lineage:
  - source: primary
    text: jataka-francis1905-nalinika-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XVIII (Pannasanipata), No. 526, Nalinika-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Demons there be that through the wide earth run / In varied form disguised. Beware, my son! / He that is wise should not consort with such; / Virtue herself is blasted at their touch. ... \"She was a female yakkha, he says,\" and he was terrified and put away the thought of her from him."
canonical-instances:
  - "A teenager becomes fixated on an online stranger who has been manipulating them for money. Rather than explain the mechanics of the scam in patient detail, which risks the teen feeling foolish and defensive or, worse, curious to reconnect and disprove it, a parent frames the account flatly as a predator hunting kids — a framing built to trigger alarm rather than analysis — and the fixation breaks."
  - "A recovering addict who idealizes a using-era friendship keeps wanting to reconnect 'just to catch up.' A sponsor doesn't argue the merits of the friendship point by point but instead names the friend flatly as a relapse trigger, a framing chosen to produce avoidance rather than debate."
critical-questions:
  - "Isisinga never learns the truth, and his father never has to justify a deception to a child capable of resenting it — what happens to this move once the protected person is savvy enough to eventually learn they were lied to, and does the fear-based framing collapse into evidence the protector can't be trusted?"
  - "The father's lie works because Isisinga has no independent way to verify it — is this move only available to someone with total narrative control over what the protected person will ever learn, and does it fail, or backfire, the moment an outside source can contradict it?"
status: active
