id: lex-4rjfg
name: indeterminate-expertise-breeds-trust-network-cliques-not-nepotism
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a field of expertise lacks a clean, results-based way to verify who is actually competent, expect trust-network cliques to form as a structural substitute for merit-based selection — and expect this to look exactly like nepotism from the outside even when no favoritism is intended. Merton: 'this element of indeterminacy contributes also toward undermining the relation which exists between experts and clients. In evaluating the expert's competence, the client cannot always rely on results, for the judgment is always comparative... There is a large area of indeterminacy in appraising the expert's performance. And consequently, there is an important fiduciary component in the expert's role.' Because the client can't cleanly verify quality, trust has to come from somewhere else — and that somewhere else is personal familiarity: 'this indeterminacy of appraising achievement in the field of human affairs increases the need for policy-makers to rely on the judgment of experts in recruiting new expert personnel. It is in this way, quite apart from deliberate nepotism, that cliques of advisors tend to develop. For those experts who are in an organization are quite likely to call upon other experts whom they know and concerning whom they can pass grounded judgment on the basis of this direct familiarity. Networks of personal relations among intellectuals serve often as agencies for establishing self-contained cliques, at least among the more important advisors.' The diagnostic payoff: before reading a closed, familiar-faces-only advisory network as evidence of cronyism, check whether the field itself has clean, verifiable performance metrics. Where it doesn't — strategy consulting, foreign policy, macroeconomic forecasting, most creative and judgment-heavy work — cliques are close to structurally inevitable, a rational response to the impossibility of verifying competence any other way, not proof of bad faith."
