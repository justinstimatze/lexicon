id: lex-qzpbh
name: three-separate-mechanisms-compound-into-an-unintentionally-rosy-self-portrait
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Representing one's own culture, organization, or life to a genuine outsider can produce a picture far rosier than reality without any single act of deception -- through three separate mechanisms that compound rather than requiring any one of them alone to do all the work. First, a presenter selectively omits things they know are shameful, wanting to put the best foot forward. Second, they leave out things they genuinely believe are right or simply unavoidable, an honest gap in what counts as worth flagging that only becomes visible once the listener reacts with the trouble the presenter never anticipated. Third, and least visible even to the presenter, some things are so routine to a lifelong insider that they never register as worth mentioning at all, the way no one describes the color of the sky to someone who has always lived under it. The gap the listener eventually discovers is real, but it was never authored by any single deliberate lie. The narrator names this compounding directly: 'not so much from a desire to deceive, but from wishing to put the best foot foremost... Also, we really thought some things were right, or at least unavoidable, which we could readily see would be repugnant to them, and therefore did not discuss. Again there was much of our world's life which we, being used to it, had not noticed as anything worth describing.'"
related: []
evokes: [herland, chapter-12, not-so-much-from-a-desire-to-deceive, wishing-to-put-the-best-foot-foremost, had-not-noticed-as-anything-worth-describing]
lineage:
  - source: primary
    text: gilman-1915-herland-chapter-12
    citation: "Charlotte Perkins Gilman, Herland (1915), Chapter 12, 'Expelled.' Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "It was the more difficult to explain to her, because we three, in our constant talks and lectures about the rest of the world, had naturally avoided the seamy side; not so much from a desire to deceive, but from wishing to put the best foot foremost for our civilization, in the face of the beauty and comfort of theirs. Also, we really thought some things were right, or at least unavoidable, which we could readily see would be repugnant to them, and therefore did not discuss. Again there was much of our world's life which we, being used to it, had not noticed as anything worth describing."
canonical-instances:
  - "A company describes its culture to a prospective hire glowingly: leadership leaves out a recent round of layoffs out of a wish to seem stable, genuinely doesn't think to mention the mandatory on-call rotation because they consider it a normal part of the job everywhere, and never brings up the long-standing habit of after-hours messaging because it's so routine internally that no one thinks of it as worth describing at all."
  - "A returning study-abroad student tells their family the host country was wonderful: they skip the one frightening incident out of a wish not to worry anyone, don't mention the strict dorm curfew because they'd come to see it as simply how things work there, and never bring up the constant background noise of the city because after months living in it they'd stopped noticing it as a feature at all."
  - "A veteran employee onboarding a new hire describes the department as smoothly run: they leave out a recent conflict with another team out of professional pride, treat the department's habit of last-minute deadline changes as an ordinary industry norm rather than a warning worth giving, and let the outdated software everyone works around pass unmentioned since it stopped registering as unusual years ago."
critical-questions:
  - "Can a listener actually distinguish which of the three mechanisms produced a given omission -- and does it matter practically which one it was, if the resulting gap in understanding is the same either way?"
  - "Does naming all three mechanisms explicitly, in advance, actually close the gap in the listener's understanding, or does experience remain the only thing that can convert an intellectually flagged omission into something genuinely anticipated?"
  - "Is there a fourth mechanism this account misses -- a self-serving motivated blindness that isn't quite deception and isn't quite genuine unawareness either, where the presenter half-suspects something is worth mentioning and chooses not to examine that suspicion?"
status: active
