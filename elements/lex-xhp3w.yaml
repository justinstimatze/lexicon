id: lex-xhp3w
name: three-independent-levels-must-each-succeed-none-compensates
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "Managing a relationship with an external group requires success at three separate levels -- correctly understanding who the group is and what it wants (the map), building an organizational process that routinely accounts for the group (the process), and actually executing specific negotiations and interactions with real skill (the transactions). These three levels don't trade off against each other: getting two exactly right provides no protection against failing the third, because each level fails for reasons the other two never touch. Freeman's own formula states the relationship as one of joint necessity, not weighted averaging: Stakeholder Management Capability is a function of the map, the process, AND the transactions together. XAB Company had a correct stakeholder map and the right processes in place, and still made no progress, because the specific executives sent to negotiate had no empathy with the groups they were dealing with -- the failure lived entirely at the transactional level, invisible to anyone checking the map or the process. Before diagnosing why an effort with stakeholders failed, check all three levels independently rather than assuming that getting the analysis right implies the execution followed."
related: []
evokes: [freeman-1984-strategic-management, chapter-3, stakeholder-management-capability, xab-company, new-england-telephone, three-levels-of-fit]
lineage:
  - source: primary
    text: freeman-1984-strategic-management-ch3
    citation: "R. Edward Freeman, Strategic Management: A Stakeholder Approach (Pitman, 1984), Chapter 3 'Stakeholder Management: Framework and Philosophy,' section 'The Transactional Level: Interacting with Stakeholders,' and Exhibit 3.9."
    quote: "The XAB Company is an interesting study in how this lack of fit can be dysfunctional. XAB understood its stakeholder map and had some organizational processes to formulate and implement strategies with important non-traditional stakeholder groups. However, XAB sent some top executives out to talk with several of these groups who had little empathy with the causes of these groups. Needless to say the company has made little progress with them. [...] Clearly, there must be some 'fit' among the elements of an organization's Stakeholder Management Capability -- defined as its understanding or conceptual map of its stakeholders, the processes for dealing with these stakeholders, and the transactions which it uses to carry out the achievement of organization purpose with stakeholders."
  - source: primary
    text: freeman-1984-strategic-management-ch3
    citation: "R. Edward Freeman, Strategic Management: A Stakeholder Approach (Pitman, 1984), Chapter 3 'Stakeholder Management: Framework and Philosophy,' section 'The Transactional Level: Interacting with Stakeholders.' A short span of the extracted text here is badly garbled and is skipped rather than guessed."
    quote: "New England Telephone adopted a stakeholder approach to implementing a plan for charging for Directory Assistance in Massachusetts (Emshoff and Freeman, 1979). The rational analysis of the stakeholder environment was sound and the planning process used to chart out an implementation scenario was [...] most notably and ironically, its own union, as well as the State Legislature, were not successful. The union got a piece of legislation prohibiting the company's plan passed in the state legislature, and even though the company was successful in persuading the Governor of Massachusetts to veto the legislation, as there was no public support, the state legislature overrode the Governor's veto, at the cost of $20 million to the customers of New England Telephone."
canonical-instances:
  - "A city correctly identifies every affected neighborhood for a transit project and builds a formal community-input process into every planning stage, then loses months of goodwill anyway because the specific planners assigned to run the public meetings talk down to residents. The map and process were both right; the failure lived entirely in who executed the meetings and how."
  - "A company knows exactly which regulator governs a new product and has a compliance process that flags every filing deadline on time, then still triggers an enforcement action because the specific attorney handling the filings has a combative style that turns a routine review into an adversarial one."
critical-questions:
  - "Is transactional skill actually independent of the map and process, or does a genuinely correct map and process tend to produce better transactional outcomes indirectly, by putting the right kind of people in the room in the first place?"
  - "When an effort fails and it isn't obvious which of the three levels is at fault, what's the diagnostic order -- is there a level that should be checked first, or does each require its own separate investigation?"
