id: lex-vwgpx
name: check-for-a-free-latent-property-in-a-material-already-in-the-system
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "Before adding a new sensor, actuator, or control mechanism, check whether a material already present in the system has some latent physical property that could serve that function for free — the property doesn't need to be introduced, only noticed and exploited, because the tendency is to treat familiar materials as inertly doing only their obvious job. Altshuller derives this from a forensic problem: determine whether a gun was fired a specific number of days ago, given only the gun itself. The solution runs entirely on a property of the barrel's own material that nobody had to add: 'The barrel is made of steel, steel is ferromagnetic, the natural magnetic field of the earth is magnetizes steel and on being fired a demagnetizing effect takes place. A certain time is needed before for it to be fully magnetized again' — so measuring the barrel's current degree of magnetization against a known re-magnetization rate reveals when it was fired, using nothing but a property steel already has. Altshuller reports a striking, precisely-measured effect of simply NAMING that latent property: given only the bare fact 'the gun is made of steel,' 30 percent of test subjects solved the problem; told additionally that 'steel is ferromagnetic,' 80 percent solved it. The material didn't change — subjects' awareness of one of its already-existing properties did. He generalizes this into an explicit rule for one especially common material: 'If one is dealing with iron... remember, perhaps, that iron is not wood, water or stone, for each atom of iron has magnetic properties and is very easily susceptible to control — discovery, measurement, changing... one must draw into the game the finer ferromagnetic properties of iron' rather than treating it, in his words, 'only as a mass of some inert substance (to put it crudely, like a stick).' Diagnostic move: before assuming a sensing, control, or actuation function requires adding a new component, name the actual materials already present in the system explicitly by their physical category (not just 'the gun,' but 'the steel barrel, a ferromagnetic material'; not just 'the pipe,' but 'the copper tube, an electrical conductor') and ask what free physical behavior that category is known to exhibit — a magnetic response, a thermal expansion coefficient, a piezoelectric effect, a chemical reactivity — that could be read or driven without introducing anything new to the system at all."
related: [lex-cf5rx, lex-hj2ds, lex-uq4xw]
scaffolds-from: [lex-uq4xw]
evokes: [ferromagnetic-gun-barrel-forensics, iron-is-not-inert-like-a-stick, naming-the-property-doubles-solve-rate, latent-material-property]
lineage:
  - source: primary
    text: altshuller-1984-gun-magnetization-forensics
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.6 'From Simple to Complex Methods,' section 'Physics — The Key to Strong Inventions.'"
    quote: "'The pistol which has just been fired has a higher temperature... The shot is accompanied not only by a rise in temperature but also by the impact on the material of the barrel. The barrel is made of steel, steel is ferromagnetic, the natural magnetic field of the earth is magnetizes steel and on being fired a demagnetizing effect takes place. A certain time is needed before for it to be fully magnetized again. In this chain of reasoning the simplest 'school' physics is used. But it is enough to find a solution.'"
  - source: primary
    text: altshuller-1984-naming-the-property-doubles-solve-rate
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.6, 'Physics — The Key to Strong Inventions.'"
    quote: "'But on being given the hint: 'The gun is made of steel,' the problem was immediately solved by 30 percent of experimenters. If the hint said, 'The gun is made of steel and that is a ferromagnetic material' the problem was at once solved by 80 percent of experimenters... If one is dealing with iron (or a material containing iron or one into which iron can be introduced), remember, perhaps, that iron is not wood, water or stone, for each atom of iron has magnetic properties and is very easily susceptible to control — discovery, measurement, changing. In the second half of the 20th century one is ashamed to use steel (but it is very widely used) only as a mass of some inert substance (to put it crudely, like a stick), one must draw into the game the finer ferromagnetic properties of iron.'"
canonical-instances:
  - "A team wants to detect whether a metal shipping container has been opened in transit without adding a sensor; they realize the container's own steel walls are ferromagnetic, so a simple magnetic-flux measurement at the seam (exploiting a property the steel already has) can detect a break in continuity, with no new hardware embedded in the container at all."
  - "A biotech lab needs to track how much a solution's temperature has fluctuated during shipping without an active logger; realizing the vial's own glass expands and contracts measurably with peak temperature, they use a simple pre-calibrated wax marker (exploiting glass and wax's own thermal-expansion properties) instead of adding an electronic temperature logger."
  - "operationally distinct from lex-uq4xw an-object-cannot-change-itself-add-the-instrument-and-the-coupling-field: that atom diagnoses when a genuinely NEW instrument and field must be added because none exists; this atom is a check to run FIRST — before assuming a new instrument is needed at all — for whether a property already inherent in an existing material can silently serve as the instrument or field, making the addition unnecessary."
critical-questions:
  - "how does someone systematically enumerate a familiar material's latent properties rather than relying on lucky recall (as with the ferromagnetic-steel case) — is there a disciplined way to ask 'what physical category does this material belong to, and what does that category typically afford' rather than hoping the relevant property happens to come to mind?"
  - "does relying on a material's incidental latent property (like the earth's ambient magnetic field slowly re-magnetizing steel) introduce a dependency on conditions that aren't fully controlled — could this exact mechanism fail or give a wrong reading under different environmental conditions that a purpose-built sensor would have accounted for?"
  - "the 30%-to-80% jump came from being TOLD the specific property name — does this rule genuinely help someone working alone discover the property themselves, or does it mainly describe how much a well-chosen HINT from someone else helps, which is a different, more limited claim about problem-solving in groups or with instruction?"
status: active
