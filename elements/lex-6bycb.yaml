evokes: [hoop-test, smoking-gun-test, doubly-decisive-test, straw-in-the-wind-test, necessary-vs-sufficient-evidence, Bayesian-prior-vs-likelihood, four-tests-typology, asymmetric-confirmation-power]
lineage:
  - source: practitioner
    text: van-evera-1997-four-tests-typology
    citation: "Stephen Van Evera, Guide to Methods for Students of Political Science (Cornell UP 1997). Introduces the four-tests-typology for process-tracing classified by the necessity-vs-sufficiency of the within-case evidence: (1) HOOP test — evidence that MUST be present if the hypothesis is correct (necessary but not sufficient); failing the hoop eliminates the hypothesis but passing only lends support. (2) SMOKING-GUN test — evidence that is SUFFICIENT to confirm the hypothesis if present (sufficient but not necessary); passing the smoking-gun confirms the hypothesis but failing does not disconfirm. (3) DOUBLY-DECISIVE — evidence that is both necessary AND sufficient (rare); passing confirms, failing eliminates. (4) STRAW-IN-THE-WIND — evidence that is weakly necessary and weakly sufficient; passes/fails change subjective probability but neither confirm nor eliminate. The typology is the 2x2 cross-product of {necessary, not-necessary} × {sufficient, not-sufficient}. Cited via Mahoney-Thelen 2015 Ch.8 (Falleti-Mahoney) and Bennett 2010."
    quote: "[Van Evera 1997 via Falleti-Mahoney 2015 Ch.8 p.232]: a hoop test [requires the hypothesis to 'jump through the hoop' (e.g., the event must be present) to warrant further consideration]; a smoking-gun test means [the evidence (e.g., the existence of the event) is strong proof that the hypothesis is correct]."
  - source: practitioner
    text: mahoney-thelen-2015-process-tracing-tests
    citation: "James Mahoney and Kathleen Thelen, eds., Advances in Comparative-Historical Analysis (Cambridge UP 2015), Chapter 8 (Tulia Falleti and James Mahoney, 'The Comparative Sequential Method'), pp. 211-239, especially the section 'Process tracing tests' (pp. 231-235). Develops the Van Evera 1997 four-tests-typology in the context of comparative-historical sequence analysis. The chapter shows how hoop tests and smoking-gun tests can be applied to intervening steps in causal sequences and used in combination with counterfactual analysis. Also cites Bennett 2008, Collier 2011, Mahoney 2012, Rohlfing 2013 for further developments."
    quote: "[Falleti-Mahoney 2015 Ch.8 p.232 on hoop tests]: [Failing a hoop test in effect eliminates a hypothesis, but passing a hoop test does not confirm a hypothesis (though it can lend support for the hypothesis)]. [Ch.8 p.232 on smoking-gun]: [Passing a smoking gun test in effect confirms a hypothesis, though failing a smoking gun test does not disconfirm a hypothesis (but it can count against a hypothesis)]. [Ch.8 p.233 on sequence elaboration]: [Process tracing tests often leverage the fact that it is easier to establish causal connections between temporally proximate events than between temporally distant events]."
  - source: practitioner
    text: bennett-2010-process-tracing-tests-developments
    citation: "Andrew Bennett, 'Process Tracing and Causal Inference,' in Henry E. Brady and David Collier, eds., Rethinking Social Inquiry: Diverse Tools, Shared Standards, 2nd ed. (Rowman & Littlefield, 2010), pp. 207-219. Bennett's canonical statement of the four-tests-typology in Bayesian terms: the prior probability of the hypothesis updates based on the likelihood of observing the evidence given the hypothesis and the likelihood given alternatives. Bennett formalizes hoop tests as 'evidence that has high probability under the hypothesis and zero probability under alternatives if-the-evidence-is-not-present-the-hypothesis-fails' and smoking-gun tests as 'evidence that has low probability under alternatives but high probability under the hypothesis.' Cited via Mahoney-Thelen 2015 Ch.8 references."
    quote: "[Bennett 2010 via Falleti-Mahoney 2015 Ch.8]: process tracing is closely analogous to Bayesian inference; specific within-case observations update the subjective probability of the hypothesis [in a way that depends on the likelihood-ratio of the evidence under the hypothesis vs alternatives]."
  - source: primary
    text: beach-pedersen-2019-process-tracing-methods-ch5-and-ch7
    citation: "Derek Beach and Rasmus Brun Pedersen, *Process-Tracing Methods: Foundations and Guidelines*, 2nd ed., University of Michigan Press 2019. Ch.5 'Making Inferences Using Mechanistic Evidence' (pp.189-191) develops the Bayesian framework underlying Van Evera's four-tests-typology with two named dimensions: THEORETICAL CERTAINTY (must the activity leave this fingerprint — the hoop dimension) and THEORETICAL UNIQUENESS (could only this activity leave this fingerprint — the smoking-gun dimension). Ch.7 'Evaluating the Overall Probative Value of Mechanistic Evidence' (pp.223-225) applies the typology in argument-road-map form AND introduces the cluster-decomposition refinement: famous smoking-gun propositions are USUALLY conjunctions of supporting propositions, each individually hoop-like, theoretically-unique only in combination. Important Sober 2009 caveat on absence-as-evidence (p.190): absence disconfirms only when the activity is relatively certain to leave the trace AND you have full access to the empirical record. Beach & Pedersen also clarify that theoretical-uniqueness against rival theories requires those rivals to be MUTUALLY EXCLUSIVE theoretically and empirically (p.191) — rarely the case in social science. Lineage upgrade for lex-6bycb from practitioner-only to 8(a)"
    quote: "[Beach & Pedersen 2019 Ch.5 p.189-190:] 'Theoretical certainty means that the predicted empirical fingerprint must be observed; otherwise, the empirical test disconfirms the existence of the part of the mechanism, at least to some degree. ... It is useful to think about differing degrees of theoretical certainty in terms of empirical hoops that a hypothesized mechanism (or part thereof) must jump through to survive empirical scrutiny.' [p.190 — Sober 2009 caveat:] 'Only when activities are relatively certain to leave particular traces and we have full access to the empirical record can we say that absence of evidence is evidence of absence of a mechanism or a part thereof.' [Ch.7 p.224 — cluster-decomposition:] 'The famous smoking gun is actually a cluster of supporting propositions about evidence in the form of the gun is the same as used in the crime and the suspects fingerprints are on the gun. If, for example, the gun is the same one used in the crime, but no evidence links the suspect to the gun, the found gun is not the proverbial smoking gun.' [The transferable refinements added by Beach-Pedersen 2019 beyond the original Van Evera formulation: (1) Bayesian decomposition into theoretical-certainty x theoretical-uniqueness dimensions; (2) Sober 2009 caveat on full-record-access requirement for hoop tests; (3) cluster-decomposition of smoking-gun propositions into supporting sub-propositions; (4) mutual-exclusion requirement for theoretical-uniqueness against rival theories.]"
  - source: primary
    text: gerring-2016-case-study-research-ch8-table-8-1
    citation: "John Gerring, *Case Study Research: Principles and Practices*, 2nd ed., Cambridge University Press 2016. Ch.8 'Quantitative and Qualitative Modes of Analysis' (pp.165-166), Table 8.1 'Qualitative tests and their presumed inferential role'. The cleanest 2x2 formulation of the Van Evera typology with explicit Necessary x Sufficient axes naming all four cells: hoop (necessary, not sufficient), smoking-gun (not necessary, sufficient), doubly decisive (both), straw-in-the-wind (neither). Gerring's key methodological observation: the typology is a CLASSIFICATORY FRAME (it helps you SAY what kind of evidence you have) NOT an inferential algorithm (it does not tell you what cell a particular piece of evidence belongs in — that's the hard question)."
    quote: "[Gerring 2016 Ch.8 p.165:] 'Briefly, a hoop test is necessary (but not sufficient) for demonstrating a hypothesis, Hx. A smoking-gun test is sufficient (but not necessary) for demonstrating Hx. A doubly decisive test is necessary and sufficient for demonstrating Hx. A straw-in-the-wind test is neither necessary nor sufficient, constituting weak or circumstantial evidence.' [p.166 on typology-as-classification-not-algorithm:] 'These concepts, shown in Table 8.1, are useful for classifying the nature of evidence according to the researchers judgment. However, the hard question — the judgment itself — is elided. When does a particular piece of evidence qualify as a hoop, smoking-gun, doubly decisive, or straw-in-the-wind test (or something in between)?' [The transferable refinement: assigning a piece of evidence to a typology cell is ITSELF an inferential act with its own uncertainty; the cell-assignment is the place where adversarial work happens.]"
  - source: primary
    text: george-bennett-2005-case-studies-and-theory-development
    citation: "Alexander L. George and Andrew Bennett, *Case Studies and Theory Development in the Social Sciences*, MIT Press / BCSIA Studies in International Security 2005. The methodological canon that brought Van Evera's four-tests-typology into the process-tracing mainstream. Cited by Gerring 2016 p.165 and Beach-Pedersen 2019 p.191 as the bringing-into-mainstream reference. No verbatim quote is claimed here."
canonical-instances:
  - "HOOP test example — Luebbert 1991 on Gerschenkron-fascism (Falleti-Mahoney 2015 Ch.8 p.232-3): Gerschenkron's hypothesis (landed-elites → rural-electoral-support → fascism) implies the necessary observation that rural-support-for-fascism is concentrated in landed-elite areas. Luebbert tested this hoop and found rural-support emanated from family-peasantry instead. The hoop test FAILED, eliminating Gerschenkron's specific mechanism. Note: the hoop test would only have ELIMINATED Gerschenkron; passing the hoop would have only LENT SUPPORT (other mechanisms could also produce the same rural-electoral pattern)."
  - "SMOKING-GUN test example — Chibber 2003 on Indian industrialization (Falleti-Mahoney 2015 Ch.8 p.233): Chibber sought evidence that domestic-capitalist opposition INFLUENCED state-managers' decisions. Finding this evidence (lobbying, pleas, investment-slowdown actually changed state policy) would strongly support the hypothesis that capitalist-opposition caused failed-industrialization. The evidence is strongly diagnostic because alternative hypotheses (e.g., state-manager incompetence; international-pressure) wouldn't predict capitalist-direct-influence on state-policy decisions. Chibber's finding therefore amounts to a passed smoking-gun (or strong hoop) test — strong confirmation of his hypothesis."
  - "DOUBLY-DECISIVE test example — physical-fingerprint evidence at crime scene: if the suspect's fingerprint is on the weapon (necessary if-they-committed-crime: should-be-there; sufficient: only the suspect's prints look like that), the test is doubly-decisive — passing confirms and failing eliminates. Doubly-decisive tests are rare in social-science because most evidence is consistent with multiple alternative explanations."
  - "STRAW-IN-THE-WIND example — circumstantial evidence in murder trial: the suspect was in the city the day of the murder. Weakly necessary (if-murderer, was-in-city is likely) and weakly sufficient (if-was-in-city, could-be-murderer but lots of others were too). Such evidence updates subjective probability slightly but neither confirms nor eliminates. Useful in combination with stronger tests."
  - "operationally adjacent to lex-ftke9 falsifiability (Popper): hoop tests are FALSIFICATION TESTS — they make a bold prediction (evidence-X-must-be-present); failure falsifies. Smoking-gun tests are CONFIRMATION TESTS — they make a bold prediction (evidence-Y-strongly-implies-hypothesis); passing strongly confirms. The four-tests-typology refines Popper's falsifiability discipline by distinguishing what KIND of evidence does what KIND of work. Popper emphasized falsification (hoop-test style); Bayesian process-tracers emphasize that smoking-guns (passing-confirms) are also rigorous when the evidence is highly improbable under alternatives."
  - "operationally adjacent to lex-2cjtz physically-independent-channels-confirm-single-event (LIGO/M87): physically-independent channels are SMOKING-GUN tests at the cosmic scale — the joint observation has high probability under the single-event hypothesis and low probability under alternative (instrumental-glitch / noise-coincidence) hypotheses. The two atoms share the underlying logic: passing the test STRONGLY CONFIRMS the hypothesis because alternative explanations would not produce the observed evidence."
  - "operationally distinct from lex-8j5ms within-case-process-tracing-as-causal-inference: lex-8j5ms is the within-case observation METHOD. lex-6bycb is the INFERENCE-LOGIC that classifies what those observations mean for hypothesis-confirmation. Process-tracing observations FEED INTO the four-tests-typology to determine inferential force. The two atoms compose: the method (lex-8j5ms) produces evidence; the typology (lex-6bycb) classifies what the evidence shows."
critical-questions:
  - "before running the test, can you STATE EXPLICITLY what evidence would constitute passing vs failing? Vague tests ('we should see capitalist-influence') are unfalsifiable. Specific tests ('we should find documentary evidence of lobbying by specific named industrialists' OR 'we should find that state-policy changed after capitalist-meetings') are testable. Practitioner-discipline: pre-specify the evidence-criteria before searching."
  - "is the test really a HOOP test (necessary) or really a SMOKING-GUN (sufficient) — or are you conflating them? Researchers often think a test is doubly-decisive when it's only one or the other. Discriminator: ASK 'would I expect this evidence if the hypothesis were FALSE (and alternative-X were true)?' If yes — your test is at most a hoop (necessary), not a smoking-gun (sufficient). If no — you may have a smoking-gun. Get this wrong and you'll over-read the test's confirmation power."
  - "what are the explicit ALTERNATIVE HYPOTHESES against which the evidence is diagnostic? Process-tracing tests are diagnostic against SPECIFIC alternatives. A hoop-test for hypothesis A is meaningful only if alternatives B, C, D wouldn't also predict the same evidence. A smoking-gun for hypothesis A is meaningful only if alternatives wouldn't predict the same evidence. ALWAYS enumerate the alternatives before classifying the test."
  - "does the test depend on sequence-of-events (temporal-order) rather than just presence-of-events? Many process-tracing tests are about TEMPORAL ORDERING (event-X-before-event-Y) not just COINCIDENCE. Sequence-order tests can be hoop/smoking-gun like presence/absence tests but with additional structure. MT 2015 Ch.8 develops this for sequence-position-determines-effect (path-dependence-like) hypotheses."
  - "is the evidence INDEPENDENT of the hypothesis's construction, or could the hypothesis have been formulated from this evidence? When evidence is used to BUILD a hypothesis and then to TEST the same hypothesis, the test loses force (circular). The discriminator: was the within-case evidence specifically predicted by the hypothesis BEFORE you observed it, or did you observe it FIRST and construct the hypothesis around it? Pre-registered predictions are stronger; post-hoc rationalization weakens the test."
  - "in a Bayesian framing, what's the LIKELIHOOD RATIO of the evidence under the hypothesis vs. alternatives? Bayesian process-tracing (Bennett 2010; Humphreys-Jacobs 2013) makes the four-tests-typology continuous: the strength of an observation depends on P(E|H)/P(E|~H). High likelihood-ratio observations strongly update the probability of H. Hoop tests are observations where P(E|H) ≈ 1 and P(E|~H) is low-but-not-zero (so failure eliminates). Smoking-gun tests are observations where P(E|H) is high and P(E|~H) ≈ 0 (so passing strongly confirms)."
status: active
