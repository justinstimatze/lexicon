id: lex-p39gq
name: redirecting-a-defensive-instinct-turns-it-into-the-mechanism-of-harm
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A defensive instinct that reliably protects against most threats can be turned into the exact mechanism of destruction by someone who doesn't disable the instinct but simply controls the direction it fires in. In the Crow buffalo-hunting story Hyde retells, Coyote 'traps two buffalo by stampeding them into the sun so they cannot see where they are going, then leading them over a cliff.' The buffalo's speed, their whole evolved answer to predators, works exactly as designed; nothing about their fleetness fails. What fails is the direction it's aimed in: 'The fleetness of large herbivores is part of their natural defense against predators... Coyote takes advantage of that instinctual defense by directing the beasts into the sun and toward a cliff, so that fleetness itself backfires.' The buffalo run precisely because running is the right response to a threat behind them; the threat they can't see is the cliff ahead. Diagnostic move: when someone or something has a strong, reliable defensive reflex, don't assume the only way to defeat it is to disable or outmatch it directly -- check whether you can instead control what direction the reflex fires in, since a defense that works perfectly on its own terms can still be steered into becoming the very source of harm it was built to avoid."
