lineage:
  - source: primary
    text: hyde-hermes-broadcasts-his-own-shameful-origin-to-neutralize-it
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 9, 'Hermes Slips the Trap,' on Hermes' contested legitimacy in the Homeric Hymn to Hermes, juxtaposed with Frederick Douglass's Narrative of the Life of Frederick Douglass, An American Slave (1845). Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Against Hermes’ possible “shame of origins” we soon get the boy with his new-made lyre “broadcasting the story of his own famous conception,” famous now, that is, now that he has made an instrument and found his voice. Often the powerful (or the proper) tease and taunt the powerless (or the impudent), invoking Legitimate and Illegitimate as if they were categories of nature, then tying illegitimate tongues so they cannot speak to their own condition."
canonical-instances:
  - "A public figure whose family kept a mental illness diagnosis secret out of shame, once outed by a tabloid, loses control of the story; a different public figure who discloses their own diagnosis first, on their own terms, in their own words, denies anyone else the power to define what that diagnosis means about them."
  - "An immigrant community pressured to hide an undocumented family member's status, for fear that speaking of it invites shame or danger, instead organizes public storytelling events where members narrate their own immigration histories directly, which measurably reduces the community's vulnerability to being shamed into silence by outsiders who would otherwise control the narrative."
critical-questions:
  - "Is 'broadcast it first' always the safer strategy, or does this advice ignore the real, sometimes severe practical risks (legal jeopardy, violence, loss of employment) that can follow public disclosure of a stigmatized fact, risks that silence was sometimes rationally managing rather than merely enduring?"
  - "Does the shame-mechanism actually lose its grip once the stigmatized person speaks first, or can a hostile audience simply shift tactics (mockery, disbelief, continued exclusion) so that broadcasting removes one weapon while leaving others intact?"
  - "Is there a meaningful difference between Hermes' case (a minor god with real power to compel an audience) and a genuinely powerless person's case, where broadcasting a stigmatized origin might not command the same kind of narrative control Hermes achieves through his lyre and his father's favor?"
