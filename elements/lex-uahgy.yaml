lineage:
  - source: primary
    text: dennett-1989-intentional-stance-chapter-2-true-believers
    citation: "Daniel Dennett, *The Intentional Stance* (MIT/Bradford 1989), Chapter 2 'True Believers: The Intentional Strategy and Why It Works' (pp. 13-35; canonical exposition pp. 15-18). The transferable claim is the three-stances framework as a deliberate predictive method-selection move: physical stance (predict from physical constitution and laws of physics), design stance (predict from designed-behavior assumption), intentional stance (predict by treating the system as a rational agent with beliefs and desires). Dennett's key contribution is to frame the intentional stance as a PREDICTIVE STRATEGY whose validity is tested by its predictive success, not as a metaphysical claim about whether a system 'really' has beliefs. The atom extracts the operational decomposition without committing to Dennett's broader interpretationist position on belief-realism (Dennett wants to argue that a system whose behavior is reliably predicted by the intentional strategy IS in the fullest sense a believer; the transferable use of the three-stances framework does not depend on accepting that further claim). Distinct from lex-fdvmu anthropomorphizing-projects-agency-onto-non-personal-entities because Dennett's claim inverts the anthropomorphizing critique: when the intentional stance predictively works on a chess program or a thermostat, that is not a category error, it is the strategy doing its job; the lex-fdvmu critique applies to cases where the stance is adopted without yielding predictive traction. Distinct from lex-8y3ch phenomenal-consciousness-attributed-without-addressing-whether-there-is-something-it-is-like because the intentional stance is silent on phenomenal consciousness — it attributes beliefs and desires as predictive posits without making any claim about whether there is something-it-is-like to be the system; lex-8y3ch is the adjacent atom that names the Nagel/Chalmers question the intentional stance brackets. Distinct from lex-wtkuz descriptive-vs-operational-metacognition because the intentional stance is a specific operational strategy for the predict-other-agents subdomain; lex-wtkuz is the broader move of preferring operational over descriptive framings."
    quote: "*[Dennett p.16, physical stance:]* 'Consider the physical strategy, or physical stance; if you want to predict the behavior of a system, determine its physical constitution (perhaps all the way down to the microphysical level) and the physical nature of the impingements upon it, and use your knowledge of the laws of physics to predict the outcome for any input. This is the grand and impractical strategy of Laplace for predicting the entire future of everything in the universe, but it has more modest, local, actually usable versions.' *[Dennett p.16-17, design stance:]* 'Sometimes, in any event, it is more effective to switch from the physical stance to what I call the design stance, where one ignores the actual (possibly messy) details of the physical constitution of an object, and, on the assumption that it has a certain design, predicts that it will behave as it is designed to behave under various circumstances.' *[Dennett p.17 — failure mode of design stance:]* 'Only the designed behavior of a system is predictable from the design stance, of course. If you want to predict the behavior of an alarm clock when it is pumped full of liquid helium, revert to the physical stance.' *[Dennett p.17, intentional stance canonical definition:]* 'Sometimes even the design stance is practically inaccessible, and then there is yet another stance or strategy one can adopt: the intentional stance. Here is how it works: first you decide to treat the object whose behavior is to be predicted as a rational agent; then you figure out what beliefs that agent ought to have, given its place in the world and its purpose. Then you figure out what desires it ought to have, on the same considerations, and finally you predict that this rational agent will act to further its goals in the light of its beliefs.' *[Dennett p.15-16 — strategy as predictively-defined:]* 'belief is a perfectly objective phenomenon (that apparently makes me a realist), it can be discerned only from the point of view of one who adopts a certain predictive strategy, and its existence can be confirmed only by an assessment of the success of that strategy (that apparently makes me an interpretationist).' *[Dennett p.15 — connection to Brentano intentionality:]* 'the intentional strategy consists of treating the object whose behavior you want to predict as a rational agent with beliefs and desires and other mental stages exhibiting what Brentano and others call intentionality.'"
canonical-instances:
  - "Stance-choice as deliberate engineering move: when reverse-engineering a system's behavior, ask which stance affords the most predictive traction at this moment. For a compiler bug, descend to the design stance (read the spec). For a hardware fault, descend to the physical stance (probe the silicon). For a flaky human user, ascend to the intentional stance (what would a rational agent in their position want?). The error is being stuck at one stance when another would yield faster traction."
  - "Thermostat as canonical minimal-case (Dennett's own example): a thermostat can be predicted at the physical stance (bimetallic strip expands at temperature T), the design stance (designed to close circuit at setpoint), or the intentional stance ('it wants to keep the room at 68°F; it believes the room is currently 65°F; it will turn on the heat'). All three predict the same behavior. The intentional stance is most economical when stance-choice is judged by predictive cost per unit predictive yield. The lesson: adopting the intentional stance does not commit you to claiming thermostats have minds — it commits you to the prediction."
  - "Software engineering analogue: debugging via 'what is this program trying to do?' (intentional stance toward a piece of code) is often faster than reading every line (design stance) or stepping through assembly (physical stance). The skill of choosing the right altitude of explanation is a transferable predictive skill, named by Dennett's framework."
  - "When the intentional stance fails diagnostically: if treating an organization as a rational agent with coherent beliefs and desires repeatedly mispredicts its behavior, the failure is informative — the organization is not actually rationally integrated, and the design-stance (what are its incentive structures?) or physical-stance (who has decision authority?) may be the right level. Failed stance-choice is itself a diagnostic signal."
  - "The reverse failure mode: treating a system that IS a rational agent as if it were a designed artifact ('users will use the feature the way the spec says') misses the intentional-stance prediction (users will route around any friction in pursuit of their actual goals). This is one of the essential under-uses of the intentional stance in software product work."
  - "Operationally distinct from lex-fdvmu anthropomorphizing-projects-agency: lex-fdvmu names the error of attributing agency where attribution yields no predictive traction (the river 'wants' to flow downhill — adds nothing to the gravitational prediction). The intentional stance is the inversion: a successful prediction earned by treating the system as a rational agent is not an error but the strategy working. The two atoms compose: lex-fdvmu is the failure case, this atom is the framework that names when the same move succeeds."
  - "Operationally distinct from lex-8y3ch phenomenal-consciousness-attributed-without-something-it-is-like: lex-8y3ch names the question of whether there is something-it-is-like to be a system (Nagel's bat). The intentional stance is silent on this — it makes no commitment to phenomenal consciousness either way. They compose: an intentional-stance prediction can succeed without any claim about phenomenal consciousness; the phenomenal question (lex-8y3ch) is what the intentional stance brackets."
critical-questions:
  - "Which stance is currently being used, and which yields better predictive traction here? The atom's diagnostic move is meta-level: name the stance, then ask whether a different one would predict more accurately for less work. Stuck predictions often reveal stance-mismatch."
  - "Is the intentional-stance prediction being tested by predictive success, or smuggled in as a metaphysical claim? Dennett's discipline is operational: the warrant for treating X as a rational agent is that the strategy predicts X's behavior. Watch for cases where the stance is adopted because it FEELS right (anthropomorphism — lex-fdvmu) rather than because it predicts. Conversely, watch for cases where the stance is refused on metaphysical grounds despite predicting well."
  - "What is the rationality assumption costing? The intentional stance treats the system as a rational agent. When the actual system has bounded rationality, biased beliefs, or inconsistent preferences, the stance over-predicts coherence. The fix is not to abandon the stance but to refine the assumed agent (a rational agent with the following specific biases / a rational agent in this specific epistemic position)."
  - "What is the transferable claim vs the Dennett-specific claim? Transferable: the three-stances method-selection move, the predictive test of stance adequacy, the operational discipline of judging stances by what they predict. Dennett-specific: the further interpretationist claim that to be reliably predicted by the intentional strategy IS to be a believer in the fullest sense. The atom captures the former and brackets the latter; using the framework does not commit you to the interpretationist position."
  - "Does the system actually fit the intentional stance at all? Some systems are well-predicted at the physical level (a falling rock), some at the design level (an alarm clock), some at the intentional level (a chess opponent). Naive use of the intentional stance treats every system as agent-like; Dennett's framework includes the prior question of whether the intentional stance is even the right tool here."
status: active
