  - source: primary
    text: Hobbes-1651-Leviathan-Ch-XIII
    citation: "Thomas Hobbes, *Leviathan* (1651), Ch.XIII `Of the Naturall Condition of Mankind, as Concerning Their Felicity, and Misery.` Project Gutenberg #3207. The foundational text articulating the structural-conflict pressure that emerges among roughly equal agents in the absence of overarching authority. Hobbes's decisive claim: three structural causes (competition, diffidence, glory) operating on roughly equal agents absent common power produce mutual-preemption equilibrium + `warre of every one against every one,` characterized by `continuall feare, and danger of violent death; And the life of man, solitary, poore, nasty, brutish, and short.` The framework has been productively extended across international relations realism (Waltz 1979 *Theory of International Politics*; Mearsheimer 2001 *Tragedy of Great Power Politics*; Jervis 1978 *Cooperation Under the Security Dilemma* explicitly operationalizes defensive-preemption for state behavior); political economy (Olson 1993 *Dictatorship, Democracy, and Development* on stationary-bandit; Hirschman 1970 *Exit, Voice, and Loyalty*); game theory + tragedy-of-commons literature (Hardin 1968; Olson 1965 *Logic of Collective Action*); software-engineering supply-chain security (Cox 2019 *Software Dependencies as a Supply Chain*); AI safety + multi-agent RL (Dafoe et al 2020 *Open Problems in Cooperative AI*); + decentralized-finance + crypto economics. The atom encodes the transferable structural primitive — absence of overarching authority + scarcity + rough equality → defensive-preemption equilibrium even among good-faith agents — separately from Hobbes's specific 17th-c absolutist political program. Debunking check applied: Hobbes's specific argument for absolute monarchy as the Leviathan-solution has been substantially contested + most contemporary readers reject it (Locke 1689 + Rousseau 1762 + subsequent liberal + republican tradition offer alternative authority-architectures). The STRUCTURAL CLAIM about defensive-preemption equilibrium without overarching authority is well-attested across international-relations realism + game theory + supply-chain security + multi-agent systems, independent of specific Hobbesian political program. The atom encodes the conflict-pressure diagnostic, not the absolutist solution."
    quote: "[Hobbes *Leviathan* Ch.XIII, the indispensable three-causes passage:] 'So that in the nature of man, we find three principall causes of quarrel. First, Competition; Secondly, Diffidence; Thirdly, Glory. The first, maketh men invade for Gain; the second, for Safety; and the third, for Reputation. The first use Violence, to make themselves Masters of other mens persons, wives, children, and cattell; the second, to defend them; the third, for trifles, as a word, a smile, a different opinion, and any other signe of undervalue, either direct in their Persons, or by reflexion in their Kindred, their Friends, their Nation, their Profession, or their Name.' [On the war-of-every-one-against-every-one as structural condition:] 'Hereby it is manifest, that during the time men live without a common Power to keep them all in awe, they are in that condition which is called Warre; and such a warre, as is of every man, against every man... For Warre, consisteth not in Battell onely, or the act of fighting; but in a tract of time, wherein the Will to contend by Battell is sufficiently known: and therefore the notion of Time, is to be considered in the nature of Warre; as it is in the nature of Weather. For as the nature of Foule weather, lyeth not in a showre or two of rain; but in an inclination thereto of many dayes together: So the nature of War, consisteth not in actuall fighting; but in the known disposition thereto, during all the time there is no assurance to the contrary. All other time is PEACE.' [On the consequences of structural war:] 'In such condition, there is no place for Industry; because the fruit thereof is uncertain; and consequently no Culture of the Earth; no Navigation, nor use of the commodities that may be imported by Sea; no commodious Building; no Instruments of moving, and removing such things as require much force; no Knowledge of the face of the Earth; no account of Time; no Arts; no Letters; no Society; and which is worst of all, continuall feare, and danger of violent death; And the life of man, solitary, poore, nasty, brutish, and short.' [On the diagnostic — even within civil society:] 'Let him therefore consider with himselfe, when taking a journey, he armes himselfe, and seeks to go well accompanied; when going to sleep, he locks his dores; when even in his house he locks his chests; and this when he knows there bee Lawes, and publike Officers, armed, to revenge all injuries shall bee done him; what opinion he has of his fellow subjects, when he rides armed; of his fellow Citizens, when he locks his dores; and of his children, and servants, when he locks his chests. Does he not there as much accuse mankind by his actions, as I do by my words?' [Practitioner-extraction for transferable lex-ktpxs: in the absence of overarching authority + scarcity + rough equality, defensive-preemption becomes equilibrium even among good-faith agents. The diagnostic is the lock-your-doors test — what behaviors do you observe in your environment that signal mutual preemption? The atom generalizes from individuals to states, software systems, multi-agent AI, online platforms, frontier markets, failed states, decentralized finance, and any context where overarching authority is absent or contested.]"
  - source: cross-attestation
    text: cross-domain-defensive-preemption-without-overarching-authority
    citation: "Cross-domain attestation that the defensive-preemption-as-equilibrium pattern recurs across international relations, game theory, supply-chain security, multi-agent AI, decentralized finance, and reputation-system engineering. (a) International relations realism: Waltz 1979 *Theory of International Politics* explicitly invokes Hobbes for the structural condition of inter-state anarchy; Mearsheimer 2001 *Tragedy of Great Power Politics* extends to offensive realism; Jervis 1978 *Cooperation Under the Security Dilemma* (World Politics 30:167) operationalizes the defensive-preemption-as-aggression mechanism for state behavior; subsequent realist + neorealist literature on arms races, alliance formation, deterrence. (b) Game theory + tragedy-of-commons: Hardin 1968 *Tragedy of the Commons* (Science 162:1243) presupposes the Hobbesian structural condition + extends to natural-resource exploitation; Olson 1965 *Logic of Collective Action* on free-riding + collective-action problems; Axelrod 1984 *Evolution of Cooperation* documents how repeated interaction + reputation-tracking can support cooperation absent central authority. (c) Software-engineering supply chain: Cox 2019 *Software Dependencies as a Supply Chain* (acmqueue 17:1) documents the Hobbesian structural problem of npm + PyPI + go modules; Mirian + Reaves + Yi 2024 on supply-chain attacks; the SBOM (Software Bill of Materials) infrastructure as overarching-authority substitute; reproducible-build movement (Bazel + Nix + reproducible-builds.org) as defensive infrastructure. (d) Multi-agent AI systems: Dafoe + Hughes + Bachrach + Collins + McKee + Leibo + Larson + Graepel 2020 *Open Problems in Cooperative AI* (arXiv) explicitly invokes Hobbes for multi-agent settings absent overarching coordination; subsequent literature on cooperative AI + MARL + AI economics. (e) Decentralized finance: the entire DeFi sector operates under Hobbesian conditions — no overarching legal authority over smart-contract execution; defensive-multisig, time-lock, MEV-protection, oracle-redundancy as Leviathan-substitutes; rugpulls + exploits as structural consequence; Werbach 2018 *The Blockchain and the New Architecture of Trust* on infrastructure as authority-substitute. (f) Online platform interactions: Tufekci 2017 *Twitter and Tear Gas* on platform-level Hobbesian dynamics when central moderation fails; subsequent literature on content moderation as Leviathan-substitute. (g) Reputation systems engineering: Resnick + Kuwabara + Zeckhauser + Friedman 2000 *Reputation Systems* (CACM 43:12) on reputation-tracking as overarching-authority-substitute; subsequent eBay + Airbnb + Uber + LinkedIn endorsement systems all operationalize this. (h) Failed-state + post-conflict literature: Collier 2009 *Wars, Guns, and Votes* on post-conflict Hobbesian conditions; Migdal 1988 *Strong Societies and Weak States* on intra-state authority-vacuum dynamics. The cross-domain attestation establishes the transferable structural form: absence of overarching authority + scarcity + rough equality → defensive-preemption equilibrium even among good-faith agents."
    quote: "Across international relations realism (Waltz 1979, Mearsheimer 2001, Jervis 1978), game theory + tragedy-of-commons (Hardin 1968, Olson 1965, Axelrod 1984), software supply-chain security (Cox 2019, SBOM + reproducible-build movements), multi-agent AI (Dafoe et al 2020), decentralized finance (Werbach 2018, MEV literature), online platforms (Tufekci 2017), reputation systems engineering (Resnick-Kuwabara-Zeckhauser-Friedman 2000), and failed-state literature (Collier 2009, Migdal 1988), the same structural form recurs — absence of overarching authority + scarcity + rough equality → defensive-preemption equilibrium. The transferable diagnostic: name the absence of overarching authority; trace the defensive-preemption dynamics; ask whether overarching authority can be constructed."
canonical-instances:
  - "Hobbes's lock-your-doors diagnostic (Ch.XIII): even within civil society with laws + officers, people lock doors + lock chests + arm when traveling. This signals their actual opinion of fellow-subjects + reveals the underlying Hobbesian pressure that civil order only partially overcomes."
  - "International security dilemma (Jervis 1978): a state's defensive military buildup is indistinguishable from preparation for offensive action; rival states defensively build up in response; arms race + reduced security for all is the equilibrium. The mechanism operates structurally + does not require malicious intent on either side."
  - "Software supply-chain attacks (left-pad 2016 + event-stream 2018 + xz utils 2024 + ongoing typosquatting): in the absence of strong vetting authority over npm + PyPI + go modules, defensive practices (pinning versions, reproducible builds, SBOMs) emerge as Leviathan-substitute infrastructure. Each project owner defends against unknown upstream threats."
  - "Multi-agent reinforcement learning (current literature): agents optimizing in shared environments absent overarching coordinator develop defensive policies that look adversarial to other agents. Cooperative-AI work (Dafoe et al 2020) explicitly tries to design overarching-coordination mechanisms."
  - "Decentralized finance security (rugpulls, MEV attacks, oracle manipulation): the DeFi sector operates under Hobbesian conditions absent legal enforcement; defensive infrastructure (multisig, time-locks, MEV-protection, oracle-redundancy) emerges as Leviathan-substitute. Periodic high-loss exploits demonstrate the structural pressure."
  - "Failed-state dynamics (Collier 2009; Migdal 1988): when state authority dissolves or fails to penetrate, the Hobbesian conflict-pressure re-emerges. Defensive militias + warlordism + extortion systems are the predictable consequence."
  - "Early online platforms before content moderation (Usenet 1980s-90s, Twitter 2007-2017, Reddit pre-2015): in the absence of central moderation, Hobbesian dynamics emerged — harassment + bot networks + manipulation. Content-moderation infrastructure emerged as Leviathan-substitute; the on-going debate is about the appropriate authority architecture."
  - "Reputation-system engineering (eBay 1995-, Airbnb 2008-, LinkedIn endorsements): these systems are explicitly designed as Leviathan-substitutes for online economic interaction — tracking reputations across transactions reduces defensive-preemption pressure + enables cooperation."
  - "operationally distinct from lex-rfcb7 credibility-comes-from-visibly-foreclosed-options (Schelling commitment-device): lex-rfcb7 is a SOLUTION-PATTERN for the Hobbesian problem — visibly foreclose your own options to make defensive-preemption against you unnecessary. lex-ktpxs is the underlying problem; lex-rfcb7 is one mechanism for navigating it without overarching authority. They compose."
  - "operationally distinct from lex-afzzp each-thing-strives-to-persist-in-its-own-being (Spinoza conatus): conatus is the persistence-tendency at the individual-agent level. lex-ktpxs names the inter-agent dynamics that emerge from conatus + scarcity + no-overarching-authority. lex-afzzp is the agent-level primitive; lex-ktpxs is the inter-agent equilibrium claim. They compose."
  - "operationally distinct from lex-wx2ma (or whatever the actual Tainter/collapse atom is — see lex-uqghr): structural-conflict pressure is mechanism distinct from declining-marginal-returns collapse. They compose in failed-state cases: lex-uqghr explains structural decline; lex-ktpxs explains why the decline produces Hobbesian conditions."
  - "operationally distinct from lex-d234k sensemaking-is-retrospective-construction (Weick): Weick is about individual + organizational sensemaking. lex-ktpxs is about multi-agent equilibrium absent overarching authority. Different scales + mechanisms."
  - "operationally distinct from lex-3656j shared-institutional-reality-produced-through-habituation (Berger-Luckmann): lex-3656j is the production-process for institutions — one solution-class for the Hobbesian problem lex-ktpxs names. lex-ktpxs names the problem; lex-3656j names the production-mechanism for solutions."
critical-questions:
  - "Does the atom commit to Hobbes's argument for absolute monarchy as the solution? No. The atom encodes the structural-conflict-pressure diagnostic separately from Hobbes's specific political solution. Locke + Rousseau + the liberal + republican tradition offer alternative authority-architectures (limited government, separation of powers, representative democracy). The atom is compatible with multiple solution-architectures + does not endorse Hobbesian absolutism."
  - "Could the atom be misused to argue that ANY absent authority means inevitable conflict? Not necessarily. The atom claims that in the absence of overarching authority, defensive-preemption is the EQUILIBRIUM TENDENCY when scarcity + rough equality + uncertainty are present. Repeated interaction + reputation-tracking + small-group dynamics + cultural norms can support cooperation in some contexts even absent formal overarching authority (Axelrod 1984; Ostrom 1990 *Governing the Commons*). The atom names a TENDENCY, not an iron law."
  - "How does the atom apply when one agent is substantially more powerful than others? The rough-equality condition is part of the structural-conflict-pressure setup. When one agent is dominant, the dynamics shift to dominance-hierarchy patterns (composes with lex-enpjy Mosca on organized-minority + lex-raydk Connell on hegemonic stratification). The atom most cleanly applies in rough-equality conditions; in dominance-hierarchy, different but related dynamics emerge."
  - "Could the atom be applied to AI safety scenarios? Yes — and this is an active research area (Dafoe et al 2020 *Open Problems in Cooperative AI*). Multi-agent AI systems absent overarching coordination develop defensive-preemption dynamics structurally similar to inter-state realism. The atom counsels designing for overarching coordination (alignment-as-Leviathan-substitute, multi-stakeholder governance, capability + dissemination control) rather than assuming agents will spontaneously cooperate."
  - "What is the relationship between this atom and Olson's tragedy-of-commons (Hardin 1968)? Hardin's tragedy-of-commons is a specific specialization of the Hobbesian problem to renewable-resource exploitation; the structural-conflict-pressure is generic. Ostrom 1990 *Governing the Commons* extends by documenting cases where users develop overarching-authority-substitutes (informal norms, monitoring + sanction) that avoid the tragedy. Both presuppose + extend the Hobbesian framework lex-ktpxs names."
