id: lex-mc2nh
name: fear-tracks-a-threats-capacity-to-multiply-not-its-present-harm
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When assessing how alarmed to be about a threat, check whether the calibration is actually about its current magnitude or about its potential to replicate. In Aesop's 'The Frogs' Complaint Against the Sun,' the frogs are not primarily troubled by the sun as it stands: 'The Sun is bad enough even while he is single, drying up our marshes with his heat as he does. But what will become of us if he marries and begets other Suns?' The present harm is described as tolerable; the anticipated harm from the threat multiplying is what actually drives the alarm. Treating the two as the same thing — reacting only to what a threat currently does rather than to what it could become if it reproduces — misreads where the real danger sits."
related: []
evokes: [aesop, the-frogs-complaint-against-the-sun, anticipatory-scaling-risk, replication-as-the-real-threat]
