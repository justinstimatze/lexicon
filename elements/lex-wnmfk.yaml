id: lex-wnmfk
name: social-interaction-is-an-audience-managed-performance-of-self
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When reading someone's self-presentation, surface that it is a performance staged for an audience — including front-stage / back-stage / impression-management moves — not raw self-disclosure."
related: [lex-4txwf, lex-9nmeg, lex-9yxm6, lex-ddm9y, lex-e3yhv, lex-hta65, lex-k8bsd, lex-qdxa7, lex-tjwfn, lex-u4uve, lex-u6sw3, lex-u8u7y, lex-xrg6e, lex-y2tbg, lex-yzuec]
scaffolds-from: [lex-tjwfn, lex-yzuec, lex-hta65, lex-4txwf]
evokes: [front-stage-vs-back-stage, impression-management, definition-of-the-situation, working-consensus, the-mask-becomes-the-self, sincere-vs-cynical-performer, who-is-the-audience, performing-for-an-audience, tact-sustains-the-performance, context-collapse]
lineage:
  - source: primary
    text: goffman-1959-presentation-of-self-intro-ch1-ch3
    citation: "Erving Goffman, *The Presentation of Self in Everyday Life* (1959). Introduction + Chapter 1 'Performances' (page-verified, this edition pp.4-12) and Chapter 3 'Regions and Region Behavior' (cited at chapter granularity). Goffman's dramaturgical thesis: face-to-face interaction is a managed PERFORMANCE in which each participant projects a 'definition of the situation' and a self, and the others extend tact to sustain it. Participants suppress their immediate feelings to maintain a surface agreement Goffman calls the 'working consensus' — not real agreement on values, but a temporary treaty about whose claims will be honoured (Intro). First impressions are vital because the initial projection commits the participant to a line of action others build on; disruption of the projected definition produces embarrassment and 'anomie' (Intro). The fostered impression is safeguarded by defensive practices (the performer's own) and protective practices ('tact', the audience's). Belief in one's own performance ranges along a continuum from SINCERE (the performer is taken in by his own act — the typical case) to CYNICAL (the performer manipulates an act he does not believe, e.g. the doctor giving a placebo for the patient's good) (Ch.1). Goffman quotes Park: the mask is not opposed to a true self — the role becomes the self, 'we come into the world as individuals, achieve character, and become persons.' The spatial structure of performance is the FRONT region (audience-facing, where the show is maintained) versus the BACK region/backstage (hidden, where the performance is relaxed and prepared) (Ch.3). The transferable primitive: read social behaviour as a performance staged for a particular audience, collaboratively sustained, with a hidden backstage — not as transparent expression of an inner state."
    quote: "[paraphrase, not verbatim — in-copyright. Goffman's Introduction (this edition pp.4-7) develops the 'working consensus' (participants project and collaboratively sustain a definition of the situation, suppressing immediate feelings and extending 'tact'/protective practices to one another's performances; disruption yields embarrassment). Chapter 1 'Performances' (pp.10-12) lays out the sincere-to-cynical continuum of belief in one's own act and, via Park, the claim that the performed mask becomes the self. The front-region / back-region (backstage) distinction is Chapter 3 'Regions and Region Behavior'.]"
canonical-instances:
  - "Working-consensus-in-service-work canonical case (Goffman Introduction, citing W.F. Whyte): the specialist (doctor, waitress) maintains a front of competent, disinterested involvement while the client responds with a show of respect; neither necessarily feels what they display, but both sustain the surface treaty about whose claims are honoured. The 'working consensus' is a temporary, setting-specific arrangement, not genuine agreement — between friends at lunch it is mutual show of affection; in service it is competence-met-with-respect. Marker: read the surface agreement as a negotiated treaty, not as shared feeling."
  - "Sincere-vs-cynical-performer canonical case (Goffman Ch.1): the continuum from the performer fully taken in by his own act (sincere — the typical case) to the one who manipulates an act he disbelieves (cynical — the con-man as limit case, but also the doctor giving a placebo for the patient's good). Goffman's nuance (via Park): most performers migrate from cynical to sincere — the mask becomes the face. Practitioner-marker: 'performance' does NOT imply deception; sincerity is itself a performed and often genuinely-inhabited stance."
  - "Front-region / back-region canonical case (Goffman Ch.3): the restaurant dining room (front: waiters maintain the show of seamless service) versus the kitchen (back: the performance is dropped, mistakes and preparation are visible, the team regroups). The performer needs a back region to prepare and recover; audiences are kept out. Marker: locate where the performance is maintained vs relaxed — much behaviour is explained by which region the actor believes they are in."
  - "Context-collapse transfer instance (boyd & Marwick 2011): a social-media post is front-stage with no reliable back region — family, colleagues, strangers, and exes are one undifferentiated audience, so the performer cannot tailor a definition of the situation to each. The resulting flattening (everyone gets the same curated front; the backstage leaks) is a direct modern instantiation of Goffman's regions breaking down. Customer-facing vs internal-channel tone, the polished demo vs the actual dev branch, 'camera-on' video-call comportment, and parasocial influencer authenticity are the same front/back-region phenomenon."
  - "operationally distinct from lex-xrg6e plausible-deniability: deniability is one narrow protective practice (keep an action deniable); the dramaturgical frame is the whole managed performance, of which tact and deniability are components. lex-wnmfk asks 'what self/definition is being staged for whom?'; lex-xrg6e asks the narrower 'is this action arranged to be deniable?'"
  - "operationally distinct from lex-qdxa7 bundle-theory-of-self: lex-qdxa7 is Hume's metaphysics (no enduring substance behind perceptions); lex-wnmfk is Goffman's sociology of moment-to-moment self-presentation. They rhyme — Goffman's 'the mask becomes the self' echoes the no-prior-substance view — so they are related, but one is about what the self IS and the other about how it is STAGED."
critical-questions:
  - "does calling the self a 'performance' mean it is fake or deceptive? No — this is the most common misreading. Goffman (via Park) holds the mask is not opposed to a true self; the role one plays becomes the self one is, and most performers are sincerely taken in by their own front. Cynical (disbelieved) performance is one endpoint of a continuum, not the norm. The frame describes how selves are sustained in interaction, not an accusation of phoniness."
  - "what is the practitioner-actionable payload? When reading or navigating an interaction, ask: who is the audience? what definition of the situation is being projected? am I (or they) front-stage or backstage? Extend tact to others' performances and expect it in return; treat embarrassment as the signal that a projected definition has been discredited; protect a needed back region. The frame turns opaque social behaviour into a legible staging problem."
  - "how does it differ from simply lying or manipulation? Impression management is the general, mostly cooperative activity of sustaining a workable definition of the situation (the working consensus); deception/manipulation is the narrow cynical mode. Most performance is collaborative tact, not fraud — which is why analyzing all interaction as manipulation is a misuse of the frame."
  - "when does the frame mislead? Two complementary errors: (a) cynicism — treating ALL behaviour as calculated performance, which ignores that fronts become sincerely inhabited; (b) front-as-whole-person — taking the front region for the entire self and ignoring the back region. The frame is a lens, not a verdict on anyone's authenticity."
  - "where does it compose? lex-wnmfk + lex-tjwfn recursive-mind-simulation: theory-of-mind is the capacity that lets a performer anticipate how the audience reads the front. lex-wnmfk + lex-qdxa7 bundle-self: the performed mask becoming the self rhymes with no-substance-behind. lex-wnmfk + lex-xrg6e plausible-deniability: deniability is a protective practice within the dramaturgical repertoire. lex-wnmfk + lex-u8u7y social-identity: the role performed is the social identity enacted. It is the substrate's anchor for impression-management / front-back-stage analysis, previously uncovered."
