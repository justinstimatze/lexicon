id: lex-mushx
name: waiting-out-a-coalitions-inevitable-discord-instead-of-attacking-it
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "A unified group that can't be beaten by direct confrontation doesn't need to be fought harder — it can simply be waited out, because internal discord is more reliable than any external attack. In the Jataka's tale of the quail flock, a fowler can't catch the birds because they lift his net together and drop it on a thorn-brake every time he casts it. Rather than change his tactics, he tells his wife he'll simply wait, certain that quarrels will eventually break out among the birds; once bickering starts, the flock loses the coordination needed to lift the net together, and they're caught with no new attack at all. The fowler's patience substitutes entirely for strategy — he doesn't need a better plan, only the accurate expectation that unity under pressure doesn't last."
related: []
evokes: [jataka, ekanipata, sammodamana-jataka, waiting-out-coalition-discord, unity-under-pressure-is-temporary]
lineage:
  - source: primary
    text: jataka-chalmers1895-sammodamana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 33, Sammodamana-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "While concord reigns, the birds bear off the net. When quarrels rise, they'll fall a prey to me."
canonical-instances:
  - "A rival company can't out-compete a tightly aligned startup team on price or speed, so instead of matching their offers, it simply waits, expecting the same equity disputes that eventually fracture most young partnerships to do the work for it."
critical-questions:
  - "Is this actually a strategy at all, or just a description of what happens to any group under sustained pressure regardless of what the waiting party does — does the fowler's patience change the outcome, or only its timing?"
  - "What could the flock have done differently to prevent this, given that the leader in the Panchatantra's version of a nearly identical setup solves it by bringing in an outside ally rather than relying on internal unity alone — is external help a more durable defense than cohesion?"
status: active
