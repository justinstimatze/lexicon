id: lex-s3pkr
name: do-the-hard-later-action-now-while-conditions-still-favor-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an action will be difficult, monitored, or resource-constrained at the moment it's needed, check whether the same action could be carried out earlier, at a moment when none of those constraints are in force yet — the action itself doesn't have to happen inside the hard window at all. Altshuller opens his entire principles chapter with a real, deliberately paradoxical case built to demonstrate this. A firm loses 15-30 liters of spirit from a sealed, guarded tanker on every delivery, and every investigation — checking equipment, checking seals, hiring detectives to watch the truck's whole route — fails, because everyone is searching for how the theft happens DURING the guarded, sealed, monitored delivery: 'The infuriated boss hired private detectives and these set up observation posts at each point of the route — but nothing helped.' The actual answer inverts the timing entirely: 'It is difficult to snitch spirit from a sealed and guarded tanker, but no problem at all to do it the evening before when the tank is empty and not under guard: go up to the tanker with an empty bucket, no one will stop you... The night before a delivery he suspended a bucket inside the empty tank. The next day the tank was filled with spirit, and the bucket filled up too... the spirit poured off. But the full bucket remained inside the tank.' Every safeguard was built around the delivery window, because that's when the theft SEEMED like it had to happen — but nothing required the thief to act during that window at all. Altshuller names the general principle directly: 'Method 10: an action which it is difficult to carry out at a given moment in time should be carried out beforehand.' Diagnostic move: when a needed action looks hard because of the specific conditions present at the moment it's normally assumed to happen (surveillance, urgency, resource scarcity, a hostile or attentive audience), ask whether the SAME action could be completed earlier, before those conditions exist — deliver the effect through timing rather than through overcoming the conditions directly, since a well-timed action performed under easy conditions can produce a result that only manifests later, once the hard conditions have already arrived and the work is already done."
related: [lex-78ayc, lex-hkn3v, lex-mubyx, lex-ncbfa]
evokes: [preliminary-action-principle, tanker-theft-bucket-story, prep-ahead-of-the-hard-window, act-before-the-guard-goes-up]
lineage:
  - source: primary
    text: altshuller-1984-tanker-theft-problem-41
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.5 'Forty Basic Methods,' opening section 'If the Detectives Only Knew.'"
    quote: "'In solving this problem by taking a selection of variants, one usually begins by taking a 'new look' at the terms, asking 'What if the measuring equipment was inaccurate after all?'... 'Perhaps the spirit managed to evaporate from a leak in the tank'... 'Did the truck driver do a deal with the guards?'... However the answer is extremely simple and if the detectives that had been called in had known of the typical methods of eliminating contradictions they would have solved this problem without having to call in the bloodhounds. Method 10: an action which it is difficult to carry out at a given moment in time should be carried out beforehand. It is difficult to snitch spirit from a sealed and guarded tanker, but no problem at all to do it the evening before when the tank is empty and not under guard: go up to the tanker with an empty bucket, no one will stop you... The night before a delivery he suspended a bucket inside the empty tank. The next day the tank was filled with spirit, and the bucket filled up too. Then the tank was driven to the recipient plant and the spirit poured off. But the full bucket remained inside the tank. When the empty tank was returned to the manufacturing plant the guard, naturally was called off and the clever thief calmly walked off with his haul.'"
  - source: primary
    text: altshuller-1984-principle-10-preliminary-action
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.5, Principle 10 'The Principle of Preliminary Action.'"
    quote: "'10. The Principle of Preliminary Action. a. Carry out the required action in advance (in full or at least in part). b. Arrange the objects in such a way that they can go into action without loss of time for delivery and from the most convenient position.'"
canonical-instances:
  - "A support team dreads a predictable spike in complaint volume every product-launch day, when staff are already stretched and slow to respond; instead of trying to staff up during the hard window, they pre-write and pre-approve the most likely response templates weeks in advance, when there's no time pressure at all — the responses are ready to fire the moment the hard window opens."
  - "A negotiator knows a counterpart will be defensive and unwilling to concede anything once a public deadline is looming; rather than trying to extract the concession during that tense final session, they secure a soft verbal agreement weeks earlier, in a low-stakes conversation before the deadline pressure exists, then simply confirm it later rather than negotiating it fresh."
  - "operationally distinct from lex-mubyx anchor-on-the-ideal-final-result-and-retreat-minimally: that atom reframes WHAT the solution looks like (an effect vanishing for free, with nothing added); this atom reframes WHEN an already-known action happens, moving it out of a hard window into an earlier easy one — the action and mechanism stay the same, only the timing changes."
critical-questions:
  - "how far in advance can an action be moved before the 'preliminary' version stops being equivalent to the real thing — does timing-shift always preserve the intended effect, or are there actions (like a promise, a signature, a chemical reaction) where doing it 'early' changes what actually happens rather than just when?"
  - "who else has access to the easy, unguarded earlier window, and does moving the action there simply relocate the vulnerability to a different, currently-unmonitored moment rather than eliminating it — could the same early-window trick be exploited by an adversary using the identical logic?"
  - "does relying on preliminary action create a dependency on correctly predicting the FUTURE hard-window conditions — if the guarded delivery had been rescheduled, or the future demand had shifted, would the pre-positioned action (the bucket, the pre-written template, the soft agreement) still be the right one when the hard window actually arrives?"
status: active
