lineage:
  - source: primary
    text: radin-trickster-doctors-minks-food-then-publicly-announces-his-disgrace
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 45. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Say, the chief's daughter is in love with you. That is what the old woman told me she had told her.' ... Then Trickster took some fish-oil and some artichoke roots, pounded them together and gave them to the young man to eat. He did this purposely in order to play a trick on him. ... About daybreak something terrible happened! The young man was just about to go away when the oil that he had eaten caused him to have a passage. He did not know, however, that it was Trickster's doing. He soiled the chief's daughter. Then Trickster shouted, 'The traveller has soiled the chief's daughter!' He went through the entire village announcing it. The traveller was very much ashamed for he was no other than the mink and that is why Trickster played this trick on him."
canonical-instances:
  - "A rival slips a strong laxative into a competitor's food before a live product demo they were invited to as a favor, then makes sure a crowded room is watching when the competitor is visibly incapacitated mid-presentation, having engineered the entire embarrassment while appearing to have done the competitor a generous turn by inviting them."
  - "A jealous coworker spikes a colleague's drink with something that will cause visible disorientation before a client dinner they arranged as an apparent olive branch, then subtly draws the client's attention to the colleague's behavior at exactly the moment it manifests, ensuring maximum witnesses to a failure they themselves manufactured."
critical-questions:
  - "Could the mink have protected himself by declining the food Trickster offered, and does the story suggest any way to distinguish a genuinely generous gift from a sabotaged one before the effects become visible?"
  - "Is Trickster's motive here purely retaliatory, given the earlier ice-race betrayal, or does the elaborate staging, the false romantic incentive, the public announcement, suggest the humiliation itself, not just revenge, was the actual goal?"
  - "Would this scheme have worked without the specific incentive of the chief's daughter's supposed affection, or does the diagnostic generalize to any situation where an enemy offers you something desirable that also requires you to consume or accept something from them first?"
