id: lex-3af99
name: near-human-resemblance-triggers-revulsion-not-affinity
type-in: situation
type-out: state
_tier: atomic
agent-instruction: "When designing a humanoid/near-human likeness, surface the uncanny valley — close-but-not-quite resemblance triggers revulsion rather than affinity; the dip means lower fidelity is sometimes safer than near-photoreal."
related: [lex-hfjhy, lex-exczm, lex-8y3ch]
scaffolds-from: [lex-exczm]
evokes: [uncanny-valley, bukimi-no-tani, mori-1970, almost-but-not-quite-human, the-valley-in-the-affinity-curve, dead-eyed-cgi]
lineage:
  - source: primary
    text: mori-1970-the-uncanny-valley-macdorman-kageki-2012-trans
    citation: "Masahiro Mori, 'Bukimi no tani' (1970), Energy 7(4):33-35; English 'The Uncanny Valley', trans. Karl F. MacDorman & Norri Kageki, IEEE Robotics & Automation Magazine 19(2):98-100 (2012). Authorized translation reproduced at IEEE Spectrum. The substrate-claim: emotional affinity does NOT rise monotonically with human-likeness; as resemblance climbs toward the fully-human it first increases affinity, then drops sharply into eeriness/revulsion (the 'valley'), recovering only at indistinguishable-from-human. Mori notes the valley is DEEPENED BY MOTION and gives a design prescription: aim for the FIRST peak (moderate likeness, high affinity), not the far wall past the trough. Internal double-quotes rendered as single-quotes for YAML"
    quote: "[Mori 1970 / MacDorman-Kageki 2012 trans.:] 'in climbing toward the goal of making robots appear human, our affinity for them increases until we come to a valley [...] which I call the uncanny valley.' [The prosthetic-hand exemplar:] 'when we realize the hand, which at first site [sic] looked real, is in fact artificial, we experience an eerie sensation. For example, we could be startled during a handshake by its limp boneless grip together with its texture and coldness. When this happens, we lose our sense of affinity, and the hand becomes uncanny.' [The design prescription:] 'because of the risk inherent in trying to increase their degree of human likeness to scale the second peak, I recommend that designers instead take the first peak as their goal, which results in a moderate degree of human likeness and a considerable sense of affinity.'"
canonical-instances:
  - "Mori's robotics original (1970): a clearly-mechanical robot draws affinity; a prosthetic hand realistic enough to be mistaken for real, then revealed artificial, produces a chill; the trough deepens with MOTION (a moving almost-human figure is more unsettling than a still one). Independent variable = degree of human-likeness, dependent = affinity, function = non-monotonic"
  - "photorealistic CGI (The Polar Express, early performance-capture films): characters near-but-not-quite human were widely described as eerie / dead-eyed, hurting reception — a commercial demonstration of the valley in animation. Studios since deliberately stylise away from the trough (Pixar's non-photoreal humans) rather than chase the far wall"
  - "lifelike dolls, animatronics, wax figures, AI-generated faces with subtle asymmetries: all sit in the trough; the unease tracks small violations (eyes, blink rate, micro-expression timing) that read as 'something is wrong' precisely because the rest is so right"
  - "operationally distinct from lex-hfjhy signal-mimicry: signal-mimicry is about a mimic deceiving a receiver by copying a signal well enough to pass; the uncanny valley is the receiver's RESPONSE when a copy is good-but-detectably-imperfect — the near-miss is met with revulsion rather than either acceptance (deception succeeds) or neutral rejection (deception obviously fails). UV is the affective cost of the almost-passing mimic, and why a slightly-off mimic is worse-received than an obviously-fake one"
  - "operationally a discontinuity in lex-exczm sympathy-as-affective-transmission: Hume's sympathy says resemblance routes another's affect into us as our own. The uncanny valley is where that mapping BREAKS — at near-human resemblance the resemblance-driven empathy that should rise instead inverts into recoil, suggesting the sympathy mechanism is gated by a category check (is this one of us?) that near-human stimuli throw into ambiguous failure"
critical-questions:
  - "the which-side-of-the-valley question: for a design pushing realism (avatars, robots, CGI, synthetic voices), are you climbing toward the near-human trough or have you cleared it? Approaching realism is not monotonically safer — there is a region where MORE realism reads as MORE disturbing. Often the right move is to stylise back, not push forward"
  - "the locus of the violation: unease usually localises to a few channels (eyes, skin, motion timing, blink/breath rhythm) that fail the human-baseline check while everything else passes. Which specific cue is producing the 'wrongness'? Fixing the dominant violated cue can matter more than raising overall fidelity"
  - "the motion-amplifies caveat: a still near-human image may be tolerable while the same figure in motion drops hard into the valley — animation and real-time interaction raise the bar. Test in the modality of actual use, not on static renders"
  - "the boundary-ambiguity reading: UV may be strongest where the stimulus is genuinely category-ambiguous (alive/dead, human/non-human, well/diseased), suggesting an evolved aversion to category-violating cues rather than a mere aesthetics of imperfection. If so, the trigger is ambiguity itself, and resolving the category (clearly robot OR clearly human) is the escape, not maximal realism"
status: active
