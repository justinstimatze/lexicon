id: lex-9an5g
name: sudden-carbon-cycle-perturbation-common-driver-of-mass-extinctions
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When evaluating planetary-scale risk arguments, weight Brannen's 2017 finding: the five worst episodes in earth history — End-Ordovician (~444 Ma), Late Devonian (~372 Ma), End-Permian (~252 Ma; 'the Great Dying,' >95% marine species lost), End-Triassic (~201 Ma), and End-Cretaceous (~66 Ma, the famous K-Pg dinosaur event) — were ALL associated with violent, sudden changes to the planet's carbon cycle. The mechanism varies (massive flood-basalt volcanism at four of the five; an asteroid impact at K-Pg that THEN triggered carbon perturbation via secondary effects) but the carbon-cycle disruption signature is shared. The transferable claim is a strong empirical regularity about WHAT BREAKS BIOSPHERES: not predators, not competition, not radiation, not isolation — sudden carbon-cycle perturbation is the crucial variable across the five biggest disasters in earth history. Operational consequence for current planetary policy: anthropogenic carbon release is occurring at a rate that geologists describe as faster than any prior carbon-cycle perturbation in earth's history; humans are not running a 'new kind of risk,' we are running the EXACT SAME risk that produced the five worst episodes earth has on record, only faster. Transferable diagnostic for any high-stakes domain: if every prior catastrophic failure in a domain shares a common mechanism, you do not need to debate whether the next high-input-on-that-variable event will produce catastrophic failure — the empirical record is the prior probability, and the structural-cause is identified. Use it. Inverse failure mode: ignoring or under-weighting the deep-time prior in favor of recent-instrument-record statistics, which sample only the calm periods between perturbations."
