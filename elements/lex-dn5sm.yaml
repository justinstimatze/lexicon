id: lex-dn5sm
name: internal-external-change-is-relative-to-your-current-frame
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Whether a change counts as 'internal' or 'external' depends on whichever conceptual model you're currently using to understand your situation, rather than tracking any fixed property of the event itself. A demand from a group your model already has a category for (a customer, an employee, a supplier) requires action but doesn't force you to rethink anything: you act within the existing 'filing system.' A demand from something your model has no category for at all forces a harder choice — assimilate it by expanding the model, or watch the model fail to explain what's happening. The same underlying event can flip from external-and-crisis-triggering to internal-and-routine without the event itself changing at all, purely by adopting a model that gives it a place. The diagnostic payoff: don't respond to a recurring 'external shock' by handling each occurrence as a one-off emergency: check whether your working model of the situation has a category for the thing that keeps surprising you, and build one if it doesn't, rather than just speeding up the emergency response. Freeman states the mechanism directly: 'It is important to note that the distinction between internal and external change is relative to a particular framework or theory... When enough external changes have occurred so that our current theory no longer gives us valid answers then we must abandon the theory and turn to a new set of concepts which explains both external and internal change... what we need is a theory or set of concepts which can turn external change into internal change, thereby reducing uncertainty and discomfort.'"
related: []
evokes: [freeman-1984-strategic-management, chapter-1, managing-in-turbulent-times, internal-change-external-change, the-filing-system-analogy, turn-external-change-into-internal-change]
lineage:
  - source: primary
    text: freeman-1984-strategic-management-ch1
    citation: "R. Edward Freeman, Strategic Management: A Stakeholder Approach (Pitman, 1984), Chapter 1 'Managing in Turbulent Times,' section 'Internal Change' / 'External Change.' Freeman credits the internal/external distinction to Watzlawick, Weakland, and Fisch (1974) in his own footnote. Verified against a pdftotext extraction of an OCR'd scan; minor spacing artifacts silently corrected."
    quote: "Internal change requires action, but it does not directly challenge our conceptual map of the world. Internal change occurs within the current \"filing system\"; it happens according to well-understood rules; and, difficult as it is, internal change is what we are used to dealing with on a daily basis. [...] External change is the emergence of new groups, events and issues which cannot be readily understood within the framework of an existing model or theory. It represents the need for new file folders in our conceptual system, and eventually for a whole new filing system."
  - source: primary
    text: freeman-1984-strategic-management-ch1
    citation: "R. Edward Freeman, Strategic Management: A Stakeholder Approach (Pitman, 1984), Chapter 1 'Managing in Turbulent Times,' section 'External Change.'"
    quote: "It is important to note that the distinction between internal and external change is relative to a particular framework or theory. Using the Production View of Exhibit 1.1 we simply cannot understand the emergence of owners and employees without adding to, or changing, our theory. When enough external changes have occurred so that our current theory no longer gives us valid answers then we must abandon the theory and turn to a new set of concepts which explains both external and internal change. In short, what we need is a theory or set of concepts which can turn external change into internal change, thereby reducing uncertainty and discomfort."
canonical-instances:
  - "A support team keeps treating each new class of customer complaint as a one-off fire to put out; once someone notices the complaints share a structure (all about a feature nobody documented) and creates a category for it, the same complaints become routine tickets handled by an existing playbook rather than escalations."
  - "A city government responds to its first extreme-heat emergency as an unprecedented crisis requiring ad hoc coordination across departments; after several summers of the same pattern, the response gets folded into the regular emergency-management calendar and budget, and the identical weather event stops feeling like a crisis at all."
  - "A software team treats every request from a new class of enterprise customer as a special case handled by an engineer pulled off their regular work; once product management creates a formal enterprise-tier category with its own support process, requests that used to derail sprints become intake-form line items."
critical-questions:
  - "How do you tell, in the moment, whether a recurring surprise is genuinely new (needs a new category) versus already covered by an existing category you're simply misapplying — since both look identical from the outside as 'we keep getting blindsided by this'?"
  - "Does converting external change into internal change always reduce real risk, or can it sometimes just relabel a genuine ongoing threat as routine, dulling the vigilance that treating it as external used to provide?"
  - "Freeman credits this distinction to Watzlawick, Weakland, and Fisch (1974) rather than claiming it as original — does their fuller first-order/second-order change framework add constraints or caveats that this business-context restatement drops?"
status: active
