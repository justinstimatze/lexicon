lineage:
  - source: primary
    text: scanlon-2000-what-we-owe-to-each-other
    citation: "T. M. Scanlon, *What We Owe to Each Other* (Cambridge, MA: The Belknap Press of Harvard University Press, 2000). The contractualist formula is stated in the Introduction and developed at length in Chapter 5 ('The Structure of Contractualist Argument'), then applied in Chapter 7 ('Promises'). Scanlon's distinctive metaethical claim — introduced in the Introduction and restated more sharply in Chapter 5 — is that justifiability to others is BASIC to moral thinking about right and wrong, not a downstream test for some deeper, independently-existing fact about wrongness. He explicitly considers and rejects the rival view that reasonable-rejectability is merely a symptom of antecedent wrong-making facts (e.g., that wanton killing is independently wrong, and BECAUSE it is wrong any principle permitting it would be reasonably rejected). Chapter 7 works out the buck-passing claim in concrete detail via the duty to keep a promise: rather than deriving the wrong of promise-breaking from Hume's or Rawls's institutional/practice-based accounts of promising, Scanlon derives 'Principle F' directly from what potential promisers and promisees could not reasonably reject, using cases (the Guilty Secret; a state-of-nature boomerang exchange) explicitly constructed to strip away every institutional fact and show the wrong-making structure survives intact."
    quote: "[Introduction — the formula and its two rival metaethical readings:] 'When I ask myself what reason the fact that an action would be wrong provides me with not to do it, my answer is that such an action would be one that I could not justify to others on grounds I could expect them to accept... an act is wrong if and only if any principle that permitted it would be one that could reasonably be rejected by people with the motivation just described (or, equivalently, if and only if it would be disallowed by any principle that such people could not reasonably reject).' 'Many people might agree that an act is wrong if and only if it could not be justified to others on grounds that they could not reasonably reject. But they might say that this is true only because what people could or could not reasonably reject is determined by facts about what is right or wrong in a deeper sense that is independent of any idea of reasonable rejection. So, for example, some acts are wrong because they are acts of wanton killing or acts of deception, and because they are wrong it would be reasonable to reject any principle permitting them. But this last fact is to be explained in terms of the former ones, not the other way around. My view denies this. It holds that thinking about right and wrong is, at the most basic level, thinking about what could be justified to others on grounds that they, if appropriately motivated, could not reasonably reject. On this view the idea of justifiability to others is taken to be basic in two ways. First, it is by thinking about what could be justified to others on grounds that they could not reasonably reject that we determine the shape of more specific moral notions such as murder or betrayal. Second, the idea that we have reason to avoid actions that could not be justified in this way accounts for the distinctive normative force of moral wrongness.' [The account of right and wrong as 'avowedly heteronomous,' contra Kant:] 'The account of right and wrong presented in Part II is likely to strike many as a Kantian theory... But my account of the reasons supporting our concern with the rightness of our actions is very different from Kant's... While Kant sought to explain the special authority of moral requirements by showing how they are grounded in conditions of our rational agency, I try to explain the distinctive importance and authority of the requirements of justifiability to others by showing how other aspects of our lives and our relations with others involve this idea. The result is an account of right and wrong that is, in Kant's terms, avowedly heteronomous.' [Chapter 5 — restating the basicness claim against a rival who accepts the biconditional but denies the metaethical order:] 'The idea that an act is right if and only if it can be justified to others is one that even a noncontractualist might accept. Utilitarians, for example... presumably also believe that an act is justifiable to others just in case it satisfies this utilitarian formula, so they too will hold that an act is right if and only if it is justifiable to others on terms they could not reasonably reject. For utilitarians, however, what makes an action right is having the best consequences; justifiability is merely a consequence of this. What is distinctive about my version of contractualism is that it takes the idea of justifiability to be basic in two ways: this idea provides both the normative basis of the morality of right and wrong and the most general characterization of its content.' 'It holds that an act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced general agreement... it overlaps to a significant degree with Mill's definition of wrongness while not coinciding with it exactly... it does not follow that this will be so in every case in which a greater balance of happiness would result from such acts' being punished.' [Chapter 5 — the operational mechanics of weighing standpoints, not tallying an aggregate:] 'We should consider possible principles governing how one may act in such situations, and ask whether any principle that permitted one to do X in those circumstances could, for that reason, reasonably be rejected. In order to decide whether this is so, we need first to form an idea of the burdens that would be imposed on some people in such a situation if others were permitted to do X. Call these the objections to permission. We then need... to consider the ways in which others would be burdened by a principle forbidding one to do X... Suppose that, compared to the objections to permission, the objections to prohibition are not significant, and that it is therefore reasonable to reject any principle that would permit one to do X in the circumstances in question. This means that this action is wrong, according to the contractualist formula.' [Kant's own footnote against the Golden Rule, and Scanlon's reading of Kant's reply as already relational:] 'Kant himself raised this objection against the Golden Rule... \"for on this ground the criminal could argue against the judge who sentences him.\" Kant's reply, I take it, is that to answer the question of right and wrong what we must ask is not \"What would I want if I were in another's shoes?\"... but rather \"What general principles of action could we all will?\"... To avoid gridlock we must move away from the idea that each person's life or each person's happiness \"matters\" to the question of an acceptable system of general principles of action... We can consider only representative cases, and take into account only those objections that a person could raise while recognizing the force of similar objections by others.' [Chapter 7 — denying the institutional/practice-based account of promising in favor of the buck-passing structure:] 'Many have argued that the wrong involved in breaking a promise is a wrong that depends essentially on the existence of a social practice of agreement-making. Hume maintained that fidelity to promises is \"an artificial virtue\"... Rawls... invokes what he calls the principle of fairness: those who have voluntarily helped themselves to the benefits of a just social practice are obligated in turn to do their part as the rules of that practice specify... I do not doubt that there is such a thing as a social practice of promising... The question is what role this practice plays in generating obligations to keep one's promises... I will argue, however, that the wrong of breaking a promise and the wrong of making a lying promise are instances of a more general family of moral wrongs which are concerned not with social practices but rather with what we owe to other people when we have led them to form expectations about our future conduct.' [Principle F itself, and its non-institutional derivation:] 'It is reasonable to want a principle of fidelity that requires performance rather than compensation and that, once an expectation has been created, does not always recognize a warning that it will not be fulfilled as adequate protection against loss... Principle F is not just the social institution of promising under another name. To begin with, the principle is not itself a social institution — its validity does not depend on its being generally recognized or adhered to.' [The Guilty Secret case, built to strip the social-practice element to its moral core:] 'Suppose that you are visiting for a term at a university where you know almost no one, and at a party shortly after your arrival you are surprised to encounter Harold... \"will you promise not to mention it to anyone while you are here?\" Suppose that you do promise... I assume that as a result of this encounter you now have two moral reasons not to tell the amusing story... you would be gratuitously injuring Harold, and you would be violating the obligation to him that you have just incurred.' [The boomerang/state-of-nature case, with no social practice presupposed at all:] 'Now it seems to me that, intuitively, what I have done in this example is no less wrong than it would have been if I had promised the stranger that I would return his boomerang if he threw back my spear. Yet nothing like a social practice of agreement-making is presupposed in the example.' [Rawls's institutional-justice domain explicitly distinguished from Scanlon's own narrower target:] 'It does not seem very likely, for example, that we could come up with a list of \"moral primary goods\" which could form the basis of a quite general \"moral division of labor\" between what we owe to each other and what is each individual's own responsibility. Morality (even the morality of obligation) is not \"about\" the provision of any such list of goods in the way that the question of the justice of social institutions can plausibly be held to be \"about\" the distribution of primary social goods.'"
