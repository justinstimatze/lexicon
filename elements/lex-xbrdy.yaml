id: lex-xbrdy
name: picture-the-constrained-outcome-before-choosing-the-free-component
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "An eyeglass lens's thickness and curvature are set entirely by the wearer's prescription -- a high-minus, high-cylinder correction will always come out thick at the edges no matter which frame surrounds it. The frame, by contrast, is free: any shape, size, or material the optician and patient like. Carlton's manual insists on a specific order for combining the two: 'Frame styling begins by obtaining a mental image of the finished lens... The best way to control the finished look is to first imagine the thickness and curves of the lenses.' Only then does frame choice follow -- 'a good choice for such a prescription is a small, rounded frame,' because a small rounded shape hides the edge thickness a high-power lens will produce regardless, while 'selecting a large, angular frame would result in much thicker and heavier lenses for the same correction' -- not a different prescription, the identical one, just carried by more glass at more exposed edges. Choosing the frame's style first, on taste alone, treats the lens as if it could be shaped to match; choosing it second, after picturing the specific finished lens the fixed prescription will actually produce, treats the lens as the fact it is and the frame as the one variable left to spend on damage control. The transferable move: when a design combines one component whose form is set by a hard external constraint with another component that's genuinely free to choose, form a concrete mental image of what the constrained component will actually look like when finished, and let that image drive the free choice, rather than settling the free component from a preference formed in isolation. The free component's whole job, in this ordering, is to work with the constrained one's real output; picked independently first, it can end up fighting that output instead, and the fight always shows up in the finished result, not in the free component alone."
