id: lex-4xfs9
name: an-involuntary-response-to-origin-can-surface-through-years-of-substitution
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone has been raised for years by a substitute caregiver who genuinely loves them and calls the arrangement complete, don't assume the substitution has actually replaced what it stands in for -- an unlearned, involuntary response to the original bond can still surface intact, instantly, with no memory or reasoning required to produce it. In Zitkála-Šá's telling, a boy stolen as an infant and raised for ten years by a toad who taught him to call her 'mother' hears his birth mother's grief-stricken wailing across a lake and is moved to tears before he has any idea who she is or why the sound affects him: 'Tell me what voice it was I heard which pleased my ears, but made my eyes grow wet!' He has no memory of her, no way to consciously recognize the voice -- the response happens beneath and before any recognition, on contact with the sound itself. The toad mother understands immediately what this means and that no substitute performance can compete with it: she tries mimicking a human cry using 'the names of loved ones gone' -- which she mistakes for merely 'valuable articles' -- and the imitation fails completely, confirming to her, and to the reader, that what moved the boy wasn't a sound she could reproduce by studying its surface, but something the years of genuine, attentive upbringing she gave him never actually reached or replaced. Diagnostic move: don't assume that a long-standing substitute relationship -- however loving, however total the years of care -- has necessarily overwritten an original bond just because there's been no contact and no conscious memory of it; treat a sudden, involuntary, unexplainable emotional reaction to a signal connected to the original bond as evidence that something was never actually replaced, only unreached, and that a good enough imitation of the surface won't be able to counterfeit it once the real thing appears."
