id: lex-73d2m
name: withholding-overwhelming-retaliation-to-protect-ones-own-virtue
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'An agent can pinpoint exactly who betrayed them, hold more than enough power to destroy that person outright, and still withhold retaliation — not from weakness, but because using the power would corrupt the agent''s own character; the calculus weighs self-corruption against the wrong suffered, and self-corruption wins. In the Jataka''s tale of the elephant who supported his mother, recognizing the very forester who is about to betray him to hunters, the elephant reasons through his own destructive capacity and rejects it explicitly on those grounds: "But I am very strong; I can scatter even a thousand elephants; in anger I am able to destroy all the beasts that carry the army of a whole kingdom. But if I give way to anger, my virtue will be marred. So to-day I will not be angry, not even though pierced with knives."'
related: []
evokes: [jataka, ekadasanipata, mati-posaka-jataka, restraint-of-power, non-retaliation]
lineage:
  - source: primary
    text: jataka-chalmers1895-mati-posaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XI (Ekadasanipata), No. 455, Mati-posaka-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "But I am very strong; I can scatter even a thousand elephants; in anger I am able to destroy all the beasts that carry the army of a whole kingdom. But if I give way to anger, my virtue will be marred. So to-day I will not be angry, not even though pierced with knives."
canonical-instances:
  - "A martial-arts instructor, recognizing the exact student who spread false rumors about him to the school's owner, could have the student expelled with one phone call, and declines specifically because using that leverage would make him the kind of person he doesn't want to be."
critical-questions:
  - "Is the elephant's restraint actually costless to the mother he's trying to protect, or does declining to act on a correctly identified threat leave a real danger unaddressed in the name of preserving his own virtue?"
status: active
