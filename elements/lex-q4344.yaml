id: lex-q4344
name: truth-only-becomes-a-legible-category-once-lying-is-possible
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A signal that is incapable of ever being false doesn't thereby count as reliably true -- it doesn't rise to the level of a truth claim at all, because 'true' and 'false' are a pair, and a signal that can only ever be one of them isn't making a claim, it's just a reflex. Hyde builds this from Umberto Eco's semiotics: 'Semiotics is concerned with everything that can be taken as a sign... it is in principle the discipline studying everything which can be used in order to lie. If something cannot be used to tell a lie, conversely it cannot be used to tell the truth: it cannot in fact be used \"to tell\" at all.' He illustrates with the baited hook: 'A worm with no hook in it, a worm the fish can eat in safety, has, by Eco's way of thinking, no significance, but the worm that says \"I'm harmless\" when in fact it hides a hook tells a lie and by that lie worms begin to signify... Only when there's a possible Lying Worm can we begin to speak of a True Worm, and only then does Worm become a sign.' Before the hook existed, a worm's harmlessness wasn't a truthful signal -- it was just a physical fact, incapable of being otherwise, and so incapable of telling anything. The category 'true worm' only comes into existence at the moment 'false worm' becomes possible. Diagnostic move: when evaluating whether some signal, claim, or appearance should be trusted as 'true,' check first whether a false version of it is actually possible -- a signal that structurally cannot lie isn't earning your trust by being honest, it's outside the true/false axis entirely, and treating it as a truth claim credits it with a reliability it never had to demonstrate."
