id: lex-ehkpq
name: a-trivial-hoarding-relapse-exposes-attachment-that-survived-a-grand-renunciation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: 'A person who renounced enormous wealth entirely can still succumb to hoarding a trivial item "for later," demonstrating that the scale of a prior renunciation guarantees nothing about freedom from small acquisitive habits. In the Jataka''s tale of Gandhara, the rebuke lands on exactly this gap: "Villages full sixteen thousand with their wealth you threw away, Treasuries with wealth in plenty: and you''re hoarding here to-day!"'
related: []
evokes: [jataka, sattanipata, gandhara-jataka, small-relapse-exposes-residual-attachment, grand-renunciation-doesnt-guarantee-consistency]
lineage:
  - source: primary
    text: jataka-chalmers1895-gandhara-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 406, Gandhara-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Villages full sixteen thousand with their wealth you threw away, Treasuries with wealth in plenty: and you're hoarding here to-day!"
canonical-instances:
  - "An executive who walked away from a lucrative equity stake on principle is caught quietly stockpiling expense-account perks worth almost nothing by comparison, revealing that the big renunciation didn't actually retrain the smaller daily habit."
critical-questions:
  - "Does a small relapse after a grand renunciation cast doubt on whether the earlier sacrifice was genuine, or does it just show that habits run on their own track and a big sacrifice in one area doesn't automatically retrain a small one elsewhere?"
  - "Does pointing out the trivial relapse trivialize the much larger renunciation that actually happened, by treating the two as equally revealing of character?"
status: active
