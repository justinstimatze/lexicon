name: troubleshooting-order-should-follow-observed-fault-frequency
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Dempsey's small-engine repair manual states its own organizing principle outright: 'The opening chapter deals with Basic principles and the final one gives advice on setting up a repair shop, but the rest of the text is arranged in a logical sequence based on the likelihood of faults -- those which practical experience has shown to occur most frequently are dealt with first and those which seldom happen are discussed last.' The chapters aren't ordered by the engine's own mechanical layout (intake before combustion before exhaust) or alphabetically by system name -- they're ordered ignition, fuel, electrical, engine service, transmission, accessories, because that happens to be the sequence in which faults in a small engine actually turn out to occur, most common first. The book is optimized to match how a reader will actually use it: flip to the front for the fault you're most likely to have, not to the section that seems most mechanically relevant to the symptom. Transferable move: when building or using a reference for diagnosing an unknown cause among many candidates -- a troubleshooting guide, a differential-diagnosis checklist, a runbook for a flaky system, a support team's escalation script -- order the candidate causes by how often each one actually turns out to be the real culprit, established from a track record of past cases, not by which explanation is mechanically closest to the symptom, intellectually cleanest, or most recently caused an incident that's still fresh in memory. This ordering minimizes the expected number of checks needed to find the true cause, because most instances of a given symptom really do have the common cause behind them -- and a search sequence built around what feels diagnostically compelling case-by-case, rather than around the frequency table of what's actually been true across many past cases, spends its early, cheap checks on causes that are individually more interesting but collectively far less likely to be the answer."
