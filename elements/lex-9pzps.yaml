id: lex-9pzps
name: an-accidental-label-is-ratified-as-a-self-commitment-device
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When an accident — a mishearing, a rumor, a misread signal — assigns someone a status they hadn't chosen, they can treat the accident as binding rather than correcting it, using the unearned label as a commitment device to actually become what it accidentally claimed. In the Jataka's tale of the merchant mistaken for a hermit, a deaf mother-in-law mishears an ordinary compliment as news that her son-in-law has renounced the world; the mistake spreads through the household and reaches him as established fact before he can correct it. Rather than deny it, he embraces the accident as an omen worth honoring: 'O king, when people hail us by the name Of holy, we must make our acts the same: We must not waver nor fall short of it; We must take up the yoke for very shame. O king, this name has been bestowed on me: To-day they cry how holy I must be: Therefore I would a hermit live and die; I have no taste for joy and revelry.' The label was pure accident, but treating it as an auspicious signal worth living up to gives him a reason to make a change he might never have initiated on his own."
