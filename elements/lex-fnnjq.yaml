id: lex-fnnjq
name: an-outcome-that-contradicts-the-trust-map-destabilizes-regardless-of-direction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When judging whether a success or failure will settle a group down or destabilize it, don't just ask whether the outcome was good or bad -- ask whether the outcome confirmed or contradicted what everyone already believed about who was trustworthy. Kautilya works through a four-cell matrix of counselor advice and campaign outcomes, and the stabilizing or destabilizing effect tracks the second variable, not the first. Two cells contradict the trust-map and both are dangerous, regardless of whether the news is a win or a loss: 'The king becomes angry [and the counsellors afraid] when a campaign, undertaken on the advice of the counsellors, fails to produce the gain predicted by them, but leads to losses and expenses. [Counsellors frightened of punishment may rebel.]' -- trustworthy advice failing is destabilizing. But so is the mirror case: 'When the king gains from a campaign, disregarding the advice of traitorous counsellors, then too the king becomes angry and the counsellors afraid that the successful king will kill them for giving wrong advice. [This too may make them rebel.]' -- a win, achieved by ignoring bad-faith advisors, still leaves those advisors newly exposed, because the success itself now stands as proof their advice was worthless or malicious, and a king who no longer needs to tolerate them has new reason to act. The two cells that DO stabilize things are exactly the ones where the outcome confirms the trust-map instead: 'When a campaign undertaken on the advice of trustworthy counsellors achieves the objective or when a campaign undertaken disregarding the advice of untrustworthy counsellors fails, - in both cases, the net result pleases all.' The pattern across all four cells: what determines whether an outcome is stabilizing has nothing to do with whether it's a win or a loss on its face -- it's whether the outcome matches the reputational bet everyone had already placed on who could be trusted. A surprising win from a distrusted source is not received as good news by the source; it's received as a newly dangerous piece of evidence about them. Diagnostic move: before assuming a good outcome will be universally welcomed, check whether it was produced in a way that contradicts someone's existing reputation for competence or loyalty -- a success that vindicates someone nobody trusted, or a failure that discredits someone everybody trusted, tends to trigger fear and defensive maneuvering in exactly the people the outcome concerns, even though the surface-level news is either fine or genuinely good."
