canonical-instances:
  - "A wealthy executive who never seems rattled by a slow month is praised in the press for extraordinary financial discipline, when the actual explanation is that a slow month poses no real threat to someone with that much accumulated cushion, unlike an employee living paycheck to paycheck who has to display the same calm exterior while genuinely at risk."
  - "A tenured professor's famous composure under professional criticism is held up as a model of intellectual maturity, but a untenured colleague facing the identical criticism, with their livelihood actually on the line, cannot afford the same visible calm, revealing that the composure was partly a function of job security rather than a purely personal trait."
critical-questions:
  - "Does this diagnostic risk becoming unfalsifiable -- if any instance of genuine restraint by a comfortable person can always be reinterpreted as mere absence of pressure, is there any evidence that could ever count as proof of real, situation-independent self-control?"
  - "Is Hyde's claim actually about restraint being fake, or just about restraint being untested -- could someone genuinely possess the capacity for self-control and also happen to be well fed, with the two facts coexisting rather than one explaining away the other?"
  - "Does the diagnostic apply symmetrically -- should visible loss of composure under real want be read as evidence against someone's character, or does the same logic that excuses the comfortable's untested calm also mean the needy's visible struggle shouldn't be read as a character flaw either?"
