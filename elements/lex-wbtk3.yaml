id: lex-wbtk3
name: legitimacy-of-a-hierarchy-narrows-who-gets-compared-to-whom
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't assume dissatisfaction scales with how bad someone's objective situation actually is — check whether the surrounding hierarchy is perceived as legitimate first, since legitimacy governs the RANGE of comparisons people make, and comparison range determines dissatisfaction more directly than raw deprivation does. Merton: 'imputations of legitimacy to social arrangements seem functionally related to reference group behavior. They apparently affect the range of the inter-group or inter-individual comparisons that will typically be made. If the structure of a rigid system of stratification, for example, is generally defined as legitimate... then the individuals within each stratum will be the less likely to take the situation of the other strata as a context for appraisal of their own lot. They will, presumably, tend to confine their comparisons to other members of their own or neighboring social stratum. If, however, the system of stratification is under wide dispute, then members of some strata are more likely to contrast their own situation with that of others.' This produces a genuinely counterintuitive result: 'the degree of dissatisfaction with their lot is often less among the people in severely depressed social strata in a relatively rigid social system, than among those strata who are apparently \"better off\" in a more mobile social system.' A rigid but legitimate hierarchy keeps comparisons local and narrow, muting dissatisfaction even at the bottom; a contested, mobile hierarchy widens the comparison range for everyone, producing more dissatisfaction even among people who are objectively doing better. Diagnostic use: when predicting or explaining unrest, don't reach first for the size of the objective deprivation — check whether the surrounding order's legitimacy is intact (comparisons stay narrow, grievance stays contained) or actively contested (comparisons widen, grievance spreads upward into strata with real, even improving, material conditions)."
