name: appointing-a-natural-predator-to-guard-its-natural-prey-institutionalizes-exploitation
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When choosing who should hold protective authority over a vulnerable group, don't select for proximity, capability, or availability alone -- check first whether the candidate's own nature or interests are structurally opposed to the group they'd be protecting, because that misalignment doesn't just risk occasional failure, it tends to convert the protective role into a license for exploitation. In Eastman's telling, Unktomee organizes a grand festival for all the 'Little People' -- insects, toads, small creatures -- and, wanting order kept among so many guests, appoints enforcers for the job: 'The Wolf was ordered to watch upon the surrounding hills, so that no enemy should come near; and the Owl was appointed to keep order within the camp.' The appointments look reasonable on paper -- these are capable, authoritative creatures, well suited to keeping watch and keeping order. But the Wolf and the Bat (also given a judging role) are natural predators of exactly the population they've been placed in authority over, and the outcome is immediate and total: 'the Wolf came down from his station on the hills to make a raid upon the helpless Little People,' the Bat 'had slyly made a meal of some of the lesser contestants,' and general predation breaks out that the story says has 'lasted to this day.' The failure wasn't a lapse in vigilance or a bad individual actor -- it was baked into the appointment itself, because giving a predator authority, proximity, and legitimized access to its prey doesn't suppress its nature, it hands that nature an official excuse and an unsupervised opportunity. Diagnostic move: before granting protective or enforcement authority to anyone over a vulnerable population, ask specifically whether their own interests or nature are structurally aligned with or opposed to that population's welfare -- competence and availability are not substitutes for that alignment check, and skipping it doesn't just risk failure, it tends to produce betrayal disguised as the role working exactly as designed."
