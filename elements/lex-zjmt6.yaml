    text: appendix-c-1957-replicative-consistency-must-be-modified
    citation: "Robert K. Merton, George G. Reader, and Patricia L. Kendall, eds., Appendix C, \"Note on Significance Tests,\" in The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), pp.304-305 (editors' note credits Dr. James Coleman and Dr. Hanan C. Selvin with contributing to the formulation of some of these points)."
    quote: "'There is, of course, one type of situation where the criterion of replicative consistency must be modified. If two medical schools differ markedly in their organization or curriculum, then we should not expect to find that attitudes or preferences affected by these organizational features will be replicated from one school to the other.'"
  - source: primary
    text: appendix-c-1957-curriculum-timing-both-findings-valid
    citation: "Merton, Reader, and Kendall, eds., Appendix C, \"Note on Significance Tests\" (1957), pp.304-305. The extraction interposes a running header and page number ('Significance Tests / 305') directly between 'worry more' and 'about their adequacy'; the quote below discloses that skip with an ellipsis at the exact interposition point."
    quote: "'in a school where students do not have substantial contact with patients until their third or fourth years, we may find that first-year students worry more about their performance in their medical studies than they do about their competence to deal with patients. In a second school, where first-year students have considerable contact with patients, we may find exactly the reverse — namely, that first-year students in this school worry more ... about their adequacy in dealing with patients than they do about their performance in their studies. Because this discrepancy can be related to significant differences in the organization of medical studies in the two schools, we consider both findings valid.'"
  - source: primary
    text: appendix-c-1957-married-students-cohort-composition
    citation: "Merton, Reader, and Kendall, eds., Appendix C, \"Note on Significance Tests\" (1957), p.305."
    quote: "'if two classes within the same school are very differently composed, we do not expect that attitudes or behavior affected by these differences will be replicated from one class to the other. For example, one entering class may contain a relatively large number of married students, while the class entering the next year contains relatively few. Under these conditions, we expect very different findings with regard to such matters as the way in which friendships are formed, the extent to which friends function as significant points of reference, and patterns of leisure-time activity.'"
canonical-instances:
  - "A retention study finds that a particular onboarding email boosts signups at one company but has no effect at a second company — rather than concluding the effect was spurious, the researchers note the first company's users were mostly first-time buyers and the second's were mostly repeat customers who don't need the email's introductory content, so the differing result actually confirms the mechanism (the email works by introducing unfamiliar features) rather than disconfirming it."
  - "A study of student stress finds that final-year students worry most about job placement at one university and most about thesis defense at another — instead of treating this as a failed replication, researchers note the first university's job market recruiting happens during final year while the second's happens a year earlier, making the discrepancy predictable from a known structural difference and strengthening confidence in the underlying stress-follows-the-nearest-deadline mechanism."
critical-questions:
  - "How does this framework guard against being used after the fact to rescue any failed replication — once you allow 'the groups differed structurally, so both findings are valid,' what stops a researcher from always finding SOME structural difference between any two groups and retroactively fitting it to whichever outcome each group happened to produce, effectively making replication failure unfalsifiable?"
  - "Does the moderating structural variable need to be specified BEFORE seeing the discrepant results to count as genuine theoretical explanation rather than post-hoc rationalization — the appendix's own examples (curriculum timing, cohort marital-status composition) both sound like variables that could plausibly be named in advance, but the text doesn't make clear whether they actually were predicted before the data came in or identified afterward to explain an unexpected discrepancy?"
