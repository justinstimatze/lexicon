lineage:
  - source: primary
    text: boehm-2012-moral-origins
    citation: "Christopher Boehm, *Moral Origins: The Evolution of Virtue, Altruism, and Shame* (Basic Books 2012). The transferable claim is that human conscience — the felt sense of shame, guilt, embarrassment, and indignation that we experience as moral feeling — evolved as the INTERNALIZED VERSION of the EXTERNAL leveling-norm enforcement that egalitarian hunter-gatherer bands sustained over deep prehistory. Boehm 2012 extends his 1999 *Hierarchy in the Forest* (which covered the external mechanism, anchoring lex-uxqdz) by adding the social-selection account of how the leveling norms came to be felt internally as moral emotions. Key empirical inputs: cross-cultural ethnographic survey of leveling-norm enforcement (his ~150-society Hunter-Gatherer Database); the Cephu episode (Turnbull's Mbuti Pygmy ethnography) as paradigm case of band-level shaming; the !Kung Bushman hunter-self-deprecation pattern (Richard Lee) as paradigm case of internalized leveling; the comparative psychology of psychopathy (Robert Hare, Kent Kiehl) as evidence for the conscience-substrate hypothesis. Theoretical antecedents: Darwin 1871 *The Descent of Man* (moral sense as evolved); Westermarck 1906 *The Origin and Development of the Moral Ideas* (Westermarck effect as evolved moral intuition); Trivers 1971 (reciprocal altruism); de Waal 1996 *Good Natured* (proto-moral emotions in primates). Boehm's specific contribution is the SOCIAL-SELECTION mechanism: not generic group selection, not generic individual selection, but the specific pressure of egalitarian-band political dynamics over the Pleistocene shaping conscience as an evolved internalization."
    quote: "[Boehm 2012, on the leveling-norm enforcement ladder:] 'Group moral indignation can take a number of forms, most of them quite uniform today among these foragers from one continent to the next. Their reactions range from moderate rebukes and sharp criticism to ostracism, ridicule, shaming, and outright banishment; and at the end of the line is the fearsome specter of capital punishment.' [On the Cephu case as paradigm:] 'This was a case of corrective social control through shaming and threat of expulsion in which a deviant's behavior was modified so that the group needn't lose a productive member who was misbehaving... if Cephu really thought he was too good to be just another egalitarian band member who followed the group's rules, he was free to take his little handful of relatives and friends, go elsewhere, play the \"big chief,\" and possibly starve.' [On the !Kung hunter-deprecation pattern as internalized leveling:] 'Knowing that he'll be subjected to ridicule if he shows the slightest tendency to boast and set himself up as being a superior hunter, he'll all but poetically deprecate the size and quality of his prey.' [On the universality of capital-punishment for the worst free-riders/bullies:] '15,000 years ago in a Pleistocene world peopled just by mobile foragers, capital punishment surely was universal or quite widespread as a practical but extreme expression of social distancing.' [On the psychopathy evidence for genetic substrate:] '[Kiehl] noted that there were apparent anomalies in the paralimbic systems (at the base of the brains) of the psychopaths. This fairly old component of the brain facilitates the coupling of emotions with how people react to a variety of social situations, so this brings us back to the matter of rule internalization as a normal function of the conscience.' [On the synthesis of biology and culture:] 'It's clear that \"biology\" and \"culture\" have been working together to make us adaptively moral. For instance, when we use our cultural acumen to learn moral rules as children, this is based on developmental \"windows\" that are sequentially hardwired.'"
canonical-instances:
  - "The Cephu episode (Turnbull's Mbuti Pygmy ethnography in *The Forest People*; Boehm 2012 Ch.1 paradigm case): Cephu repositioned his net ahead of others during a collaborative hunt, was caught, faced group shaming and threat of expulsion, ultimately submitted with apology. The example demonstrates the FULL leveling ladder (criticism → shaming → threat of expulsion → submission/forgiveness) and the felt-character of the violator's experience — Cephu's shame and submission are the internalized conscience-response that selection has shaped."
  - "!Kung hunter-deprecation pattern (Richard Lee fieldwork; Boehm 2012 Ch.1): the successful hunter returns from the kill and INTENTIONALLY downplays his success ('I'm no good for hunting. I saw nothing at all . . maybe just a tiny one') to avoid the ridicule that would follow boasting. The internalized leveling response — feeling-the-shame-before-being-shamed — is the conscience-as-evolved-anticipation that Boehm's account predicts."
  - "Psychopathy as visible-tail of the conscience-substrate distribution (~1% prevalence; Hare, Kiehl): individuals with anomalies in paralimbic emotion-cognition coupling do not internalize moral norms in the typical way — they understand the rules cognitively but lack the felt-character (no shame, no guilt, no remorse) that the social-selection hypothesis predicts as the evolved internalization mechanism. The neurobiology and the cross-cultural prevalence both support the genetic-substrate claim."
  - "Anonymous online behavior (modern environment that lacks Pleistocene social-selection pressure): users on anonymous platforms behave in ways they would NEVER display in a small face-to-face band — the absence of reputational visibility removes the social-selection signal that conscience evolved to anticipate. The conscience-feelings still fire (most people don't behave maximally badly even online) but lose calibration. Practitioner consequence: online-anonymity design choices are operating against ~200,000 years of conscience-calibration."
  - "Large-scale organizational misconduct (corporate fraud, political corruption): the size of the social group exceeds the conscience-calibration range of band-level reputation-tracking. Misconduct that would have triggered immediate shaming in a 30-person band can persist undetected for years in a 30,000-person corporation. The conscience substrate is intact; the social-selection pressure that was its calibration environment is absent at scale."
  - "Cross-cultural universality of leveling-norm violations being shameful (Brown 1991 universals): the specific behaviors that trigger shame across all documented cultures (boasting, free-riding on group production, hoarding resources from the group, claiming unearned authority) are exactly the behaviors that egalitarian-band leveling norms target. The cross-cultural pattern is the predicted consequence of conscience being the evolved internalization of those specific selection pressures."
  - "Distinguished from lex-uxqdz egalitarianism-is-actively-maintained-reverse-dominance: lex-uxqdz covers the EXTERNAL leveling mechanism (the band actively suppresses alpha-dominant individuals via ridicule/gossip/ostracism/execution). This atom (lex-m9hc3) covers the INTERNAL response — how the external mechanism became internalized as conscience-as-evolved-anticipation over the Pleistocene. Composes: lex-uxqdz names the selection pressure; lex-m9hc3 names the evolved response."
critical-questions:
  - "Does the social-selection mechanism require group selection in the controversial sense? No — Boehm carefully argues that the selection operates at the INDIVIDUAL level under the conditions of small-band life: individuals who could anticipate group response had higher fitness than those who couldn't. This is multilevel selection in the Wilson-Sober uncontroversial sense, not the discredited naive-group-selection of Wynne-Edwards 1962. Don't tar the atom with the naive-group-selection critique."
  - "Have you accounted for cultural variation in specific moral content? Conscience-substrate is universal; the SPECIFIC moral content that gets internalized varies culturally (what counts as boasting, what counts as fair-share, what counts as ultimate-violation-warranting-banishment). The atom predicts BOTH the universal substrate AND the cultural variability — different cultures point the same cognitive-emotional machinery at different specific behavioral targets. Brown 1991 universals + cross-cultural moral psychology (Haidt-Joseph 2004 foundations) document both layers."
  - "Is the Pleistocene-calibration claim falsifiable, or just-so-story? The claim makes specific predictions: (a) cross-cultural universality of certain shame-triggers (boasting, free-riding) — confirmed by Brown 1991; (b) developmental hardwired windows for moral internalization — supported by developmental psychology; (c) psychopathy as visible-tail of the genetic substrate — supported by Hare-Kiehl; (d) modern-environment misalignment in anonymous/large-scale settings — predicted, observed. The claim isn't unfalsifiable; it makes risky predictions that have so far survived."
  - "Does this atom imply that conscience is JUST evolved, with no rational or cultural component? No. Boehm explicitly argues for biology-culture coproduction: evolved substrate + cultural socialization. The transferable claim is that the substrate evolved via social selection over Pleistocene egalitarian-band life; cultures then build their specific moral content on top of that substrate. Both layers are pivotal; neither alone explains modern human moral experience."
  - "How does this compose with lex-2kjmb free-energy-principle and lex-wgd7u learning-tracks-prediction-error? Conscience-as-evolved-anticipation IS a prediction engine — the individual anticipates the group response and minimizes the expected social-surprise (free energy with social-norms as part of the generative model). Shame at the prospect of being shamed is the prediction-error of expected-violation-of-social-prior. The composition with predictive-processing isn't yet fully worked out empirically but is theoretically coherent — conscience operates as a learned social-prior whose violation generates predictable surprise/distress."
