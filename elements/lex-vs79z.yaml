id: lex-vs79z
name: relocating-and-revising-the-constitution-collapse-into-one-act-under-real-mobility
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a community has genuine, practically exercisable freedom of movement, check whether relocating and reforming its social order have actually become the same act rather than two related options. Graeber and Wengrow's case: the Osage, a Siouan people who abandoned the Fort Ancient region of the Middle Ohio valley for the Great Plains, used the expression 'moving to a new country' as a direct synonym for constitutional change, not a metaphor for it. Because population density across much of pre-Columbian North America was low enough for groups to walk away to genuinely uninhabited territory, what a denser, more territorially fixed society would have to accomplish through internal negotiation, rebellion, or gradual reform, this society could accomplish by the comparatively simple expedient of picking up and settling somewhere else. Wherever real exit is cheap and available, look for political change to take the form of departure rather than internal contest, and don't mistake a wave of migration for mere flight from hardship when it may be the society's actual mechanism for rewriting its own rules."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, osage, fort-ancient, freedom-to-move, constitutional-change]
