    quote: "Then his nurses reflected, \"The hands and feet of cripples are not like his, the formation of the jaws of the dumb is not like his, the structure of the ears of the deaf is not like his; there must be some reason for all this, let us examine into it.\""
canonical-instances:
  - "A hiring committee suspicious that a candidate's disclosed disability might be exaggerated for accommodation doesn't administer one medical exam — over months they vary the task, the observer, and the setting, because clearing a test along one axis says nothing about the others."
  - "A fraud investigator who can't prove an insurance claimant's injury is staged doesn't stop after one surveillance day catches nothing — they vary the trigger, a delivery at the door, a grandchild visiting, a fire alarm, across weeks, since a claimant coached to pass one scenario may not anticipate the next."
critical-questions:
  - "At what point does an escalating test regime designed to expose a lie become indistinguishable from cruelty regardless of whether the underlying claim turns out to be true or false?"
  - "Sixteen years of genuinely enduring fire, a threatened beheading, and starvation without flinching is itself extraordinary — does surviving the battery prove the original claim, or does it just prove the subject's tolerance for self-inflicted harm exceeded what the testers imagined?"
