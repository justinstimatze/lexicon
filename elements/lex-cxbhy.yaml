id: lex-cxbhy
name: choosing-freedom-from-inner-vice-over-every-offered-material-boon
type-in: process
type-out: claim
_tier: atomic
agent-instruction: 'Offered an open-ended wish by a powerful grantor, an agent whose priorities are genuinely internal can decline every material or status-based option and ask instead for freedom from specific inner vices, using the granted wish itself as evidence of what they actually value under no constraint. In the Jataka''s tale of Kanha, offered a boon, the ascetic asks only for release from malice, hatred, covetousness, and lust: "Sakka, the lord of all the world, a choice of blessings gave. From malice, hatred, covetise, deliverance I would have, And to be free from every lust: these blessings four I crave." Sakka''s own reflection confirms the significance: "Wise Kanha, in choosing a boon, chooses no thing connected with food; all he chooses bears upon the ascetic life."'
related: [lex-nbepu]
evokes: [jataka, dasanipata, kanha-jataka, wise-wish-selection, solomon-choosing-wisdom]
lineage:
  - source: primary
    text: jataka-chalmers1895-kanha-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 440, Kanha-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Sakka, the lord of all the world, a choice of blessings gave. From malice, hatred, covetise, deliverance I would have, And to be free from every lust: these blessings four I crave."
canonical-instances:
  - "Granted one wish by a dying mentor's estate, a former protege asks not for the mentor's client list or reputation but to be released from the habit of taking credit for others' work, and the estate's lawyer notes it is the first time in the role he has seen someone ask for that."
critical-questions:
  - "Is a wish for freedom from a named vice self-verifying (the asking itself proves some measure of the freedom already exists), or can it be requested just as performatively as any material wish?"
status: active
