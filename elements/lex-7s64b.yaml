evokes: [dont-throw-them-into-their-own-element, zitkala-sa-the-warlike-seven, a-generic-punishment-checked-against-a-specific-target, this-is-where-i-live]
lineage:
  - source: primary
    text: zitkala-sa-warlike-seven-fish-and-turtle-thrown-into-the-lake
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'The Warlike Seven.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Let us carry them to the lake of muddy water and drown them!' Instantly they ran with them. They threw the Fish and the Turtle into the lake. Toward the center of the large lake the Turtle dived. There he peeped up out of the water and, waving a hand at the crowd, sang out, 'This is where I live!' The Fish swam hither and thither with such frolicsome darts that his back fin made the water fly. 'E han!' whooped the Fish, 'this is where I live!'"
canonical-instances:
  - "A company tries to punish a departing star engineer by publicly announcing they've been 'let go' rather than acknowledging the engineer's own resignation, not realizing the engineer had already lined up a much better opportunity and wanted an excuse to leave loudly -- the intended humiliation instead hands the engineer exactly the clean, dramatic exit they wanted."
  - "A school administration tries to discipline a student who dislikes the traditional classroom by suspending them from in-person classes and assigning independent work at home, not realizing the student thrives on self-directed study away from classroom social pressure -- the punishment intended to isolate the student instead delivers them into the exact environment where they perform best."
critical-questions:
  - "how often does this pattern actually occur in real punitive situations, versus being a satisfying but rare narrative trope -- do most punishers actually have enough information about their target's nature to make this specific kind of mistake, or does the story require an unusually large blind spot to work?"
  - "does recognizing this risk in advance actually change how punishers behave, or does the desire to punish override the analytical step of checking whether the method fits the target, especially when anger or urgency is driving the decision?"
  - "is there a meaningful difference between a punisher's genuine ignorance of the target's nature (an honest mistake) and a punisher who should reasonably have known better -- does this framework treat both cases the same when they might call for very different responses going forward?"
