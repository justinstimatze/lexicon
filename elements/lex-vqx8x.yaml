lineage:
  - source: primary
    text: catton-1980-overshoot-the-ecological-basis-of-revolutionary-change
    citation: "William R. Catton, Jr., *Overshoot: The Ecological Basis of Revolutionary Change* (University of Illinois Press, 1980/1982 pbk). Chapter 11, 'Faith versus Fact,' section 'The Millenarian Response' / 'Space Age Cargo Cults.'"
    quote: "'To the pre-literate Melanesian peoples in the Pacific islands, European society was unseen and baffling... It was apparent to the islanders that European people had some secret magic; they obtained abundant cargoes of material objects without laboring to create them... The idea that the cargo brought in by ships and delivered to the Europeans in the islands had been stolen from black people in Europe seemed, to the Melanesians, consistent with their observation of the relatively work-free lives of white men... To obtain it, they might only have to discover and practice the proper magic or ritual.' ... 'Modern faith in science and technology as infallible solvers of any conceivable problem can be, in a post-exuberant world, just as superstitious. The essential parallel is this: the Melanesians were able to believe they would receive cargo because they had no accurate knowledge of how European goods came into existence, or why they came to the islands. The modern Cargoist who expects to be bailed out of this year's ecological predicament by next year's technological breakthrough holds similar beliefs because of his inadequate knowledge of ecology and of technology's role in it. Both Cargoist faiths rest upon the quicksand of fundamental ignorance lubricated by superficial knowledge.' ... 'By working diligently to facilitate delivery of cargo, Melanesians affirmed their belief that it was rightfully theirs.' ... [on Type II technological Cargoism:] 'The Type II belief held that great technological breakthroughs would inevitably occur in the near future, and would enable man to continue indefinitely expanding the world's human carrying capacity. This was a mere faith in a faith, like stock-market speculation; it had no firmer basis than naive statistical extrapolation—the uncritical supposition that past technological advances could be taken as representative samples of an inherently unending series of comparable achievements.' (Catton, Overshoot, 1982, Ch.11)"
canonical-instances:
  - "operationally distinct from cargo-cult used elsewhere in the substrate as an idiom for copying the surface form of a practice without understanding its causal mechanism (e.g. Spotify-model-without-Spotify-context, cargo-cult-Socratic-questioning): this atom names a different half of the same anthropological case — FAITH IN FUTURE RESCUE substituting for causal understanding of PAST abundance — not imitation of form."
  - "operationally distinct from lex-egkjk (shifting-baseline/creeping-normalcy): both concern failure to register an approaching resource or capacity problem, but lex-egkjk is about perception FAILING TO NOTICE gradual degradation because the comparison baseline silently updates; this atom is about a group that HAS noticed the shortfall and responds with confident, institutionally-invested faith in an unspecified future rescue, grounded in a specific misreading of what produced past abundance. They compose — baseline-drift can delay the moment cargoism becomes necessary, by hiding the shortfall until it's acute — but name different mechanisms at different stages."
  - "The Melanesian cargo-cult case itself (Ch.11): islanders who saw Europeans receive shiploads of goods, with no visibility into the factory-and-trade production chain behind them, built wharves and warehouses and performed rituals to receive an expected cargo — investing real institutional effort into RECEIVING a rescue rather than into reproducing the causal chain that actually produced the original goods."
  - "President Carter's 1979 energy-crisis response, as Catton reads it: rather than explaining why the traditional 'faith in progress' had become structurally inapplicable (Ch.11's own diagnosis), the proposed remedy was 'the most massive peacetime commitment of funds and resources in our nation's history' toward an Energy Security Corporation — large institutional investment aimed at receiving a technological rescue, structurally parallel to the islanders' wharves, without a specified mechanism for why that scale of investment would produce the needed energy supplement."
  - "Type II technological Cargoism generalized: 'the uncritical supposition that past technological advances could be taken as representative samples of an inherently unending series of comparable achievements' — treating the historical trend-line of breakthroughs itself as the causal mechanism, rather than asking what specific, non-repeatable precondition (a new fossil deposit, a new continent, a one-time scientific opening) produced each prior breakthrough."
critical-questions:
  - "Isn't this just betting on a base rate — technology HAS solved big problems before, so why not treat that as real evidence? The atom does not forbid weighing a track record; it names the SPECIFIC failure of treating the track record AS IF it were itself the causal mechanism, rather than asking what produced each past instance and whether that specific precondition is still available. A track record built from several genuinely repeatable mechanisms (e.g. Moore's-law-style engineering learning curves) is different in kind from one built from non-repeatable one-time draws (a new continent, a new fossil deposit) — the diagnostic is which kind of track record you actually have, not whether track records count."
  - "How is this different from generic techno-optimism or generic denial? Generic optimism/denial are attitudes; cargoism is a specific STRUCTURAL claim about WHY the attitude forms — a causal-mechanism gap (not understanding what produced past abundance) combined with REAL institutional investment staged to receive an unspecified rescue. Two people can share the same optimistic mood while only one is cargoist: the one who can name the specific mechanism and its preconditions is not cargoist even if ultimately wrong; the one relying on the mood itself, or on the trend-line as its own justification, is."
  - "Does naming this risk dismissing every appeal to future innovation as irrational? No — the atom supplies a discriminating test (named mechanism + still-available precondition), not a blanket dismissal. A plan that says 'battery costs have fallen on a documented learning-curve mechanism tied to manufacturing scale, and that mechanism's precondition (continued production-volume growth) is still present' passes the test and is not cargoism, even though it is still a bet on the future; a plan that says only 'we've always found a way' does not."
