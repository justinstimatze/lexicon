id: lex-myhhk
name: a-fabricated-vulnerability-story-taints-your-later-genuine-signals
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When you fabricate a shared-vulnerability story to manufacture fast intimacy or trust, check whether that single act corrodes the credibility of your next real emotional signal to the exact person you most need to believe you. Aesop's 'The Woman and the Farmer' has a man feign grief to win comfort from a woman, then genuinely weep later when real disaster strikes; she responds with disbelief rather than sympathy: 'Why, are you weeping still?' to which he answers, 'Yes, and I mean it this time.' The corrosion shows up immediately, on the very next instance, and from the one person whose belief matters most — a single manufactured signal is enough to permanently discount whatever comes after it."
related: []
evokes: [aesop, the-woman-and-the-farmer, fabricated-intimacy-taints-later-signals, credibility-discounted-by-one-lie]
lineage:
  - source: primary
    text: aesop-vernonjones1912-the-woman-and-the-farmer
    citation: "Aesop's Fables, translated by V. S. Vernon Jones (1912, Project Gutenberg #11339), 'The Woman and the Farmer.' Verified verbatim against a direct extraction of the held copy."
    quote: "When the Woman heard his cries, she came and said, Why, are you weeping still? To which he replied, Yes, and I mean it this time."
canonical-instances:
  - "a manufactured 'shared trauma' story fast-tracks emotional intimacy with a target. Every real distress signal that person sends afterward gets discounted as more of the same performance."
critical-questions:
  - "Does the corrosion apply only to the same category of signal that was faked, or does one fabricated vulnerability claim taint a person's credibility across all future emotional communication with that listener?"
  - "Is there any way to repair this kind of damage short of a very long track record of genuine signals, or does the first fabrication set a ceiling on trust that no later behavior can fully lift?"
status: active
