evokes: [radin-winnebago-hare-cycle, hare-and-flint, whatever-spirit-you-are-i-give-you, actually-his-poor-ones]
lineage:
  - source: primary
    text: radin-flint-offers-escalating-but-inferior-tribute-to-hare
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 6. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Shortly after this Hare went to Flint and approached him in the same way as he had approached the first old man. He transformed himself into a tall being and sang as he came near the lodge of Flint. At the end of his song he would always exclaim, 'Hiyi! Hiyi!' When he finished the song for the first time, Flint said: 'Whatever spirit you are, I give you an arrow-point from my wrist, one that I value very much.' The second time Flint said, 'Whatever spirit you are, I give you a flint from my ankle, one that I value very much.' The flints from his wrist and ankles were actually his poor ones. Finally after Hare had sung for the fourth time, he jumped toward him and chased him all over the earth, clubbing him and forcing him to scatter his flint arrow-points all over the earth ... Then he killed him."
canonical-instances:
  - "A company facing a coordinated boycott over how it treats its lowest-paid contractors responds by publicly pledging a larger bonus pool for those same contractors, hoping the increased dollar figure will satisfy critics whose actual demand was to end the underlying practice, not to receive a bigger version of it."
  - "A person accused of ongoing dishonesty in a relationship responds to a partner's ultimatum by offering escalating small gestures, flowers, then a bigger gift, then an even bigger one, misreading the confrontation as a transaction that a large enough offering could still settle, rather than a decision that has already been made."
critical-questions:
  - "Does Flint's substitution of his poor flints for his valuable ones change the outcome at all, or does the story suggest the result would have been identical even if he had genuinely offered his best, because the offering itself was never the actual issue?"
  - "Is there a version of this encounter in which Flint could have recognized that he was facing punishment rather than a customary spirit-visit, and if so, what would have had to look different for him to read the situation correctly?"
  - "Does the story frame Hare's actual grievance, that Flint was withholding flint arrow-points from the uncles, as sufficient justification for killing him, and does that framing matter for whether the diagnostic here is about misreading threats in general or specifically about ignoring a legitimate prior wrong?"
