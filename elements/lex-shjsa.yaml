evokes: [popper-1963-conjectures-and-refutations, demarcation-between-science-and-metaphysics, sea-serpent-in-the-british-museum, plancks-formulation-of-the-first-law-of-thermodynamics, isolated-purely-existential-statement, unlocated-claims-cannot-be-refuted]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The Demarcation Between Science and Metaphysics' (contributed January 1955 to The Philosophy of Rudolf Carnap, ed. P. A. Schilpp, Library of Living Philosophers, 1964), Ch. 11 of Conjectures and Refutations (Routledge Classics, 2002), p.347."
    quote: "'I recommended, in my Logic of Scientific Discovery, that they should be expressed, for certain purposes, in a form like \"There does not exist any perpetual motion machine\" (this is sometimes called \"Planck's formulation of the First Law of Thermodynamics\"); that is to say, in the form of a negation of an existential statement. The corresponding existential statement -- \"There exists a perpetual motion machine\" -- would belong, I suggested, together with \"There exists a sea-serpent\" to those below the line of demarcation, as opposed to \"There is a sea-serpent now on view in the British Museum\" which is well above the line since it can easily be tested. But we do not know how to test an isolated purely existential assertion.'"
canonical-instances:
  - "A vendor claims 'there's a version of this integration that handles your edge case' with no ticket number, build, or environment named. Nobody can disprove it, and the claim survives every failed attempt to reproduce the behavior, because the failure always admits 'you must not have the right version.' A claim of 'build 4.2.1, staging, tested this morning' would settle the question in one look."
  - "A skeptic of a historical account says 'there must be a document somewhere that contradicts this' without naming an archive, a collection, or even a plausible author. The claim can motivate an endless search but can never be refuted by the search coming up empty, since 'somewhere' always has more shelves left."
critical-questions:
  - "Doesn't this unfairly penalize a true claim just because the person making it doesn't yet know exactly where to look? No -- the criterion is about what makes a claim testable right now, not about whether the underlying fact is real. 'A cure for this exists somewhere in nature' may turn out true, but it functions as an article of faith until it's narrowed to a specific compound, source, or protocol that a lab can actually run against -- narrowing the claim is the step that converts hope into a claim you can act on."
  - "Is a located claim always fully checkable in practice -- doesn't 'go to the British Museum and look' still leave room for a bad-faith excuse if the thing isn't found (wrong room, moved exhibit, hidden from view)? A located claim can, in principle, still be defended by ad hoc excuses after a failed check -- see [[lex-vmas8]] on immunizing a theory against refutation after the fact, which is a separate failure mode from the one this atom names. This atom is about whether the claim, as stated, gives you anywhere to check at all; what happens after a failed check is a separate problem from whether the claim gave you anything to check."
