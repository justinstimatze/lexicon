canonical-instances:
  - "The direct textual anchor: Douglass describes the threat as having come 'as an insult and a challenge in one,' and names a specific third response beyond frightened-and-timid or stimulated-and-brave -- those who were 'tired of the rule-or-ruin intimidation adopted by the South' and 'felt then, if never before, that they had quailed before it too often and too long,' converting past acquiescence itself into a reason for present defiance."
  - "Hypothetical: a landlord threatens to raise every tenant's rent if the building's tenants vote to unionize. Some tenants, fearing the increase, vote against unionizing; but a larger number who had been on the fence read the threat itself as proof the landlord fears organized tenants, and vote to unionize specifically because of it."
critical-questions:
  - "Operationally distinct from lex-bjqgm (suppressing-a-grievances-expression-becomes-proof-of-its-legitimacy): that atom is a response to an ALREADY-EXPRESSED grievance, where suppressing it reads as an admission the suppressor cannot win the argument. This atom is a threat aimed PRE-EMPTIVELY at a future choice not yet made, and the backfire mechanism is insult-driven defiance rather than an inference about who is losing an argument -- the threatened choice need not be a grievance at all. Do the two mechanisms compound when a threat is issued specifically to suppress support for a cause already being argued?"
  - "What determines the split between the 'frightened' and the 'stimulated' -- is it a fixed trait of the audience, or does it depend on how credible and how personally costly the threat actually is? A sufficiently credible, sufficiently severe threat might tip the balance toward the frightened group instead."
  - "Douglass frames the timing as significant -- the South had 'quailed before it too often and too long' by this point. Does the backfire require a history of prior submission to the same threat, so that this instance crosses an accumulated threshold, or can a first-time threat backfire just as reliably?"
