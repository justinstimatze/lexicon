id: lex-kvsdw
name: an-excuse-recasts-a-caught-theft-as-protection-from-a-different-thief
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Caught in the act of taking something you were trusted to guard, claiming you were actually intercepting it before someone else could steal it converts your own hands on the object into evidence of vigilance rather than evidence of guilt, without requiring you to deny that you had it. In Radin's comparative Assiniboine summary, Inktonmi is left to guard a man's rattle while its owner sleeps, and instead uses the opportunity to steal it: 'Inktonmi pretends to guard a man's rattle, while the owner is sleeping, but tries to steal it.' Caught with the rattle in hand, he doesn't claim he wasn't taking it -- he reframes why: 'He is overtaken, and pleads as an excuse that he was only trying to preserve the rattle from winged thieves.' The excuse doesn't contest the physical fact that damns him; it supplies a different reason for that exact fact to exist, one that turns the same action into its opposite. Diagnostic move: when caught holding or moving something you shouldn't have, consider that denying the physical fact usually fails once you're already caught with it -- the more durable move, ethically compromised as it is, is supplying a competing motive for the identical fact that recasts it as protective rather than acquisitive, since the observer already has to explain the same evidence either way."
