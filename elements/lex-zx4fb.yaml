id: lex-zx4fb
name: discussion-fertilizes-more-the-more-participants-differ
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When judging whether a conversation, negotiation, or cross-disciplinary collaboration succeeded, don't measure it by whether the parties reached agreement or by how much common ground they started with. Popper locates the value of critical discussion elsewhere entirely: 'This critical rational method must not be mistaken for a method of proof, that is to say, for a method of finally establishing truth; nor is it a method which always secures agreement. Its value lies, rather, in the fact that participants in a discussion will, to some extent, change their minds, and part as wiser men.' He then rejects the common assumption that discussion requires shared starting assumptions to work: 'It is often asserted that discussion is only possible between people who have a common language and accept common basic assumptions. I think that this is a mistake. All that is needed is a readiness to learn from one's partner in the discussion... If this readiness is there, the discussion will be the more fruitful the more the partners' backgrounds differ. Thus the value of a discussion depends largely upon the variety of the competing views.' His own image for why shared background isn't a precondition: 'Had there been no Tower of Babel, we should invent it.' And convergence to a settled endpoint isn't the goal either: 'Even when we solve a problem to universal satisfaction, we create, in solving it, many new problems over which we are bound to disagree. This is not to be regretted.' Diagnostic move: before writing off a discussion between people with wildly different backgrounds and no shared premises as doomed, check whether the actual precondition, a genuine readiness on both sides to understand what the other means, is present. Where it is, the difference in starting points is the source of the discussion's value, and 'we didn't agree' is no evidence the exchange failed."
