id: lex-jkpj6
name: polynomial-vs-exponential-marks-qualitative-tractability-boundary
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When an algorithm scales, surface the polynomial-vs-exponential boundary — polynomial growth stays tractable as N grows, exponential blows up; the qualitative jump is what makes complexity theory pivotal, not the constants."
related: [lex-da3g3, lex-xrbzz, lex-3d2he, lex-t5drx, lex-dwey5, lex-c5j7f]
evokes: [tractable-vs-intractable, polynomial-time, exponential-time, NP-completeness, in-principle-vs-in-practice, big-O, ten-seconds-vs-ten-to-the-tenth, factoring-vs-multiplying, hardness-as-substrate]
lineage:
  - source: primary
    text: aaronson-2011-why-philosophers-should-care-complexity
    citation: "Scott Aaronson, 'Why Philosophers Should Care About Computational Complexity,' Computability: Turing, Gödel, Church, and Beyond (MIT Press 2013, ed. Copeland, Posy, Shagrir) — arXiv:1108.1791 (2011). Aaronson's substrate-claim: the polynomial-vs-exponential boundary in algorithmic complexity is a QUALITATIVE substrate-marker for what computation can actually do, even though both sides are 'in principle' computable. The 10-seconds-vs-10^10-seconds gap (Aaronson p.4) makes 'in principle' and 'in practice' diverge dramatically. The atom generalises beyond computer science: any quantity that scales polynomially with system size is operationally manageable; any quantity that scales exponentially or super-polynomially is operationally inaccessible at substrate-scale, regardless of whether it is theoretically tractable. The polynomial/exponential boundary is invariant under wide changes in encoding details and computational model (Aaronson p.5-6, closure properties of polynomial-time + independence-from-Turing-machine-details). Examples: multiplying n-digit integers is polynomial (~n log n log log n); factoring is exponential (~2^(n^(1/3))) — the basis for internet cryptography. PD complications: arXiv preprint is openly licensed (arXiv non-exclusive); MIT Press chapter is in-copyright but mined under fair-use"
    quote: "[Aaronson 2011 p.4:] '20 seconds to compute is obviously the concern of engineers rather than philosophers. But that conclusion would not be so obvious, if the question were one of 10 seconds versus 10^10 seconds! And indeed, in complexity theory, the quantitative gaps we care about are usually so vast that one has to consider them qualitative gaps as well. Think, for example, of the difference between reading a 400-page book and reading every possible such book, or between writing down a thousand-digit number and counting to that number.' [p.5:] 'how do the resources needed to solve a problem scale with some measure n of the problem size: \"reasonably\" (like n or n^2, say), or \"unreasonably\" (like 2^n or n!)? As an example, two n-digit integers can be multiplied using ~n^2 computational steps (by the grade-school method), or even ~n log n log log n steps... By contrast, the fastest known method for the reverse operation—factoring an n-digit integer into primes—uses ~2^(n^(1/3)) steps, which is considered inefficient. Famously, this conjectured gap between the inherent difficulties of multiplying and factoring is the basis for most of the cryptography currently used on the Internet.' [p.5-6:] 'Theoretical computer scientists generally call an algorithm \"efficient\" if its running time can be upper-bounded by any polynomial function of n, and \"inefficient\" if its running time can be lower-bounded by any exponential function of n. These criteria have the great advantage of theoretical convenience. While the exact complexity of a problem might depend on \"low-level encoding details,\" such as whether our Turing machine has one or two memory tapes, or how the inputs are encoded as binary strings, where a problem falls on the polynomial/exponential dichotomy can be shown to be independent of almost all such choices.' [The atom's key claim: the polynomial/exponential boundary is qualitative — large enough gaps in degree are differences in kind. The boundary is also substrate-stable — independent of low-level encoding choices — making it a substrate-level marker rather than an engineering-detail. Crossing the boundary in either direction is a categorical event: a polynomial-time algorithm for what was thought exponential (e.g., primality testing, AKS 2004) shifts a problem from 'cryptographic substrate' to 'routine computation'; conversely, proving exponential lower bounds (rare and difficult) shifts a problem permanently outside the tractable substrate.]"
canonical-instances:
  - "Modern cryptography rests on the polynomial-exponential boundary: RSA security depends on factoring being super-polynomial while modular exponentiation (encryption/decryption) is polynomial. Shor's quantum factoring algorithm (1994) shows the boundary can shift with computational model — quantum-polynomial-time-factoring would collapse classical cryptography. The substrate-claim is preserved: the polynomial/exponential boundary is the right marker, the question is which problems land on which side under which substrate."
  - "Database query optimisation: SQL queries that scale polynomially with table size are operationally usable; queries that scale exponentially (e.g., uncontrolled cartesian-product joins) are not. The query optimiser's job is keeping queries on the polynomial side; understanding when an optimisation crosses the boundary is the operational skill."
  - "Combinatorial optimization in industry: the traveling-salesman problem and its NP-complete cousins are why heuristic/approximate algorithms (simulated annealing, genetic algorithms, MILP solvers) dominate real-world routing, scheduling, and bin-packing. The substrate-claim: businesses run on polynomial-time approximations because exponential exact algorithms are inaccessible at industrial scale; the approximation gap is the operational cost of staying tractable."
  - "Machine learning training scales polynomially with parameter count (mostly); inference scales polynomially with input size. The dramatic growth of large language models has stayed inside the polynomial substrate because pretraining is amortised over many inferences. If LLM inference scaled exponentially with model size, the current AI moment would be technically impossible."
  - "Chess engines: brute-force exponential tree-search (Shannon-A) is intractable; alpha-beta pruning + heuristic evaluation + monte-carlo tree-search keep the engine on the polynomial side. The substrate-claim: chess is theoretically a finite game (a game-tree is computable), but the game-tree is large enough that 'in principle' and 'in practice' diverge by Aaronson's standard."
  - "Climate model resolution: spatially-resolved climate models scale polynomially (often cubically or worse) with resolution, but the constants are large enough that practical resolution is bounded by available compute. The polynomial/exponential boundary is satisfied (the algorithms are polynomial), but the polynomial-degree constant matters operationally. Aaronson's frame qualified: the polynomial-exponential boundary is necessary but not sufficient for tractability; polynomial-with-high-degree-or-constant can still be intractable in practice."
  - "operationally distinct from lex-t5drx computational-irreducibility: lex-t5drx (Wolfram) names processes for which NO COMPUTATIONAL SHORTCUT exists — must be simulated step-by-step; lex-jkpj6 names the boundary at which an existing shortcut (polynomial) divides from an only-in-principle algorithm (exponential). They compose: a computationally-irreducible process is necessarily not in P (no polynomial shortcut exists), but a problem can be exponential-time without being irreducible (a faster algorithm might exist, just hasn't been found). The two atoms together cover the tractability-substrate from both directions: lex-t5drx is structural-non-shortcut; lex-jkpj6 is the operational-scale-boundary."
  - "operationally distinct from lex-xrbzz architecture-matched-to-problem-symmetry-collapses-stalled-domain: lex-xrbzz is about CHOOSING an algorithm whose structure exploits the problem's symmetry; lex-jkpj6 is about the SCALING BOUNDARY of any algorithm. They compose: architecture-matched algorithms often achieve the polynomial-side of the boundary; mismatched architectures push problems toward exponential."
  - "operationally distinct from lex-da3g3 iteration: lex-da3g3 is about iterative-refinement as a structural strategy; lex-jkpj6 is about the algorithmic-complexity boundary. They compose: iterative-refinement is often polynomial (each iteration is polynomial; the convergence is polynomial in error), making iteration a polynomial-substrate strategy."
  - "operationally distinct from lex-3d2he: lex-3d2he (Mendeleev) is about HOLES in a classification predicting future entities; lex-jkpj6 is about COMPUTATIONAL COMPLEXITY scaling. They are unrelated except both being substrate-meta-claims at the level of 'what kinds of things can be known/computed/predicted.'"
critical-questions:
  - "is the polynomial/exponential boundary really qualitative, or just a quantitative threshold we treat as qualitative? Aaronson's argument is that the gap is large enough to function as qualitative (10s vs 10^10 s) and is substrate-stable across model choices. Critics from continuous-math traditions argue that the discrete-step-counting frame is itself an idealisation. The atom should be applied with the caveat that 'polynomial-with-high-constant-factor' can still be intractable in practice; the boundary is the right substrate-marker but is not magically tractable on the polynomial side."
  - "does the atom apply outside computer science? Yes, with care. The substrate-claim generalises to any resource-vs-system-size scaling: physical processes that scale polynomially are operationally tractable (chemistry, electromagnetic propagation, etc.); processes that scale exponentially are not (combinatorial enumeration of molecular conformations, exhaustive search of biological substrate spaces). The qualitative-gap claim transfers; the specific polynomial-time-class formalism does not."
  - "what about average-case vs worst-case complexity? Worst-case polynomial is a strong guarantee (e.g., sorting in n log n is polynomial in n for all inputs); worst-case exponential with average-case polynomial behaviour (e.g., simplex method for linear programming) sits in a more nuanced position. The atom's claim holds at the substrate level (worst-case-polynomial is the cleanest boundary marker), but practitioner-deployment should distinguish worst-case from average-case when those diverge."
  - "what about quantum and other non-classical computation? Quantum polynomial time (BQP) includes problems not known to be in classical P (e.g., factoring per Shor). The polynomial-exponential boundary is preserved within a model; the relevant model is what differs. The atom's substrate-claim is the boundary; what counts as 'efficient' depends on which computational substrate is available. Different substrates may push the boundary."
  - "when does the atom fail to fire? When the problem-instance sizes of interest are so small that even exponential is fast (e.g., 2^10 = 1024 is fine; 2^50 ~ 10^15 is not). The polynomial/exponential distinction matters at scale; at fixed small size, constant-factor differences dominate. Diagnostic: ask 'at the actual problem sizes of interest, does the algorithm finish in tolerable time?' If yes, the atom-distinction is moot for the instance; if no, the polynomial-exponential boundary explains whether scaling-out will help or not."
status: active
