name: noise-as-signal-amplifier-in-nonlinear-systems
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When a system is nonlinear and signal is weak, NOISE can amplify it — stochastic resonance. Counterintuitive but real: adding noise can extract sub-threshold signals because the noise pushes the signal across the detection threshold. Engineering principle in biology and signal processing."
