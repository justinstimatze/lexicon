id: lex-mubyx
name: anchor-on-the-ideal-final-result-and-retreat-minimally
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you don't yet know how to eliminate a harmful effect, don't start by asking what mechanism could remove it — first state the impossible-sounding ideal where the harmful effect disappears BY ITSELF, with nothing added, and then treat every real solution as a retreat from that ideal to be minimized rather than a mechanism to be built up from nothing. Altshuller calls this the Ideal Final Result (IFR) and gives its formula: 'one of the elements in the conflicting pair itself removes the harmful (unnecessary, superfluous) effect, while retaining its capacity to carry out the basic action. The ideal nature of this solution is ensured by the fact that the necessary effect is attained for nothing, without bringing in any means whatsoever.' His worked case: a heating wire needed to lengthen for pre-stressed concrete but degrades past a temperature threshold. Rather than ask 'what device protects the wire from heat damage,' the IFR is stated as: 'A heat field itself wards off destruction of the wire while ensuring nevertheless the required thermal stretching. What could be more ideal than that? Nothing was introduced, nothing has been made more complicated, but the harmful effect of the heat field has disappeared as if by magic while the useful effect has been retained.' Altshuller is explicit that ordinary engineering thinking works in the opposite direction — accepting a cost as the price of the effect: 'Characteristic of ordinary engineering thinking is the willingness to pay for the effect required — in terms of machines, expenditure of time, energy or substances... It is necessary to fight against the transfer of heat. Well then, we will have to count on a system of heat defence.' The IFR inverts this stance: 'There is a damaging factor which has to be fought against. Ideally, this factor would go away of itself. So let it eliminate itself!' The IFR is not a literal achievable target most of the time — it functions as an orientation point, and Altshuller's own metaphor names exactly how: 'The IFR can be likened to a rope, clutching which a mountain climber ascends a steep incline. The rope is not being pulled upwards, but it provides support and prevents one sliding backwards. You only have to let go of the rope and you inevitably fall.' Practically, stating the IFR does real filtering work before any mechanism is proposed: it 'cuts off all solutions at lower levels, and cuts them off immediately and indiscriminately, leaving behind the IFR and those variants which are close to it' — so the very next step (formulating the physical contradiction, then searching for a resolution) only has to search among the small set of variants that stay close to the impossible ideal, rather than the full space of all conceivable fixes. Diagnostic move: before designing a mechanism to counteract an unwanted effect, state the version where the effect vanishes on its own, with no added device, no added cost, no added complexity — then treat the real design process as asking how little has to be added to approximate that ideal, rather than asking what has to be built from a blank slate."
related: [lex-2aded, lex-a6hvx, lex-g3kjx, lex-hj2ds, lex-hkn3v, lex-qu6y5, lex-s3pkr]
evokes: [ideal-final-result, IFR, altshuller-ideality, heat-field-wards-off-its-own-damage, mountain-climbers-rope-metaphor]
lineage:
  - source: primary
    text: altshuller-1984-ifr-formula
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.3 'Tactics of Invention: Managing the Process of Task Solving,' section 'Basic Mechanisms for Eliminating Contradictions.'"
    quote: "'The model of the problem describes the technical system (or more accurately its ailing part) and the contradiction innate to it. It is not known in advance how to eliminate this contradiction in reality, but there is always the possibility of formulating an ideal imaginary solution or final result (the IFR)... The IFR is formulated according to the simple plan: one of the elements in the conflicting pair itself removes the harmful (unnecessary, superfluous) effect, while retaining its capacity to carry out the basic action. The ideal nature of this solution is ensured by the fact that the necessary effect is attained for nothing, without bringing in any means whatsoever. For instance, for Problem 23 the IFR can be described as: A heat field itself wards off destruction of the wire while ensuring nevertheless the required thermal stretching. What could be more ideal than that? Nothing was introduced, nothing has been made more complicated, but the harmful effect of the heat field has disappeared as if by magic while the useful effect has been retained.'"
  - source: primary
    text: altshuller-1984-ordinary-engineering-vs-ideality
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.3, 'Basic Mechanisms for Eliminating Contradictions.'"
    quote: "'Characteristic of ordinary engineering thinking is the willingness to pay for the effect required — in terms of machines, expenditure of time, energy or substances. The need for payment seems evident, and the engineer is concerned only that the payment is not too excessive and that the reckoning is carried out in an educated manner. It is necessary to fight against the transfer of heat. Well then, we will have to count on a system of heat defence... The inventive thought in work on the ASIP should be clearly orientated to the ideal solution: There is a damaging factor which has to be fought against. Ideally, this factor would go away of itself. So let it eliminate itself! ... The IFR can be likened to a rope, clutching which a mountain climber ascends a steep incline. The rope is not being pulled upwards, but it provides support and prevents one sliding backwards. You only have to let go of the rope and you inevitably fall.'"
canonical-instances:
  - "A team fighting spam wants to design a filter that detects and blocks bad actors; stating the IFR first ('bad actors stop wanting to spam, of their own accord, with nothing added') redirects the search toward changing the incentive that makes spamming worthwhile in the first place (e.g. removing the payoff) rather than building an ever-more-elaborate detection arms race — the real solution retreats from that ideal only as far as necessary."
  - "A warehouse wants to reduce forklift-pedestrian collisions; instead of starting from 'what sensor or barrier do we add,' the team states the IFR ('the forklift and the pedestrian each know the other is there, with nothing installed') — which points toward a scheduling/zoning fix (separating their paths in time rather than adding technology) as the closer-to-ideal option, with sensors only added to cover the residual overlap that scheduling can't eliminate."
  - "operationally distinct from lex-hkn3v escalate-a-vague-conflict-to-its-extreme-form-to-reveal-the-resolution: that atom sharpens a TRADEOFF STATEMENT into its most extreme, contradictory form to reveal a space/time/state separation; this atom anchors on a TARGET OUTCOME (the effect vanishing for free) as an orientation point for judging and pruning candidate mechanisms, prior to and independent of how the contradiction gets formulated or resolved."
critical-questions:
  - "how close does a real solution need to get to the IFR before it counts as 'close enough' — is there a principled stopping point for retreating from the ideal, or does the method only say 'retreat as little as possible' without a way to know when the retreating should stop?"
  - "can stating the IFR become a source of false paralysis — spending excessive time chasing marginal improvements toward an admittedly unreachable ideal instead of shipping a solid, less-elegant fix that would have been available immediately?"
  - "does the IFR's framing (an existing element solves its own problem 'for free') implicitly bias solutions toward changing behavior/incentives/timing over adding new mechanisms — and is that bias always warranted, or does it sometimes dismiss a genuinely good engineered solution just because it isn't 'free'?"
status: active
