id: lex-n93j7
name: equal-gains-are-worth-less-to-those-who-already-have-more
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "Bernoulli's founding move is to reject price as the measure of what a gain or loss is actually worth to a person, and replace it with utility. Price is fixed and identical for everyone; utility depends on the person's own circumstances, which differ. His own diagnostic example makes the substitution necessary: a very poor man holding a lottery ticket worth either nothing or twenty thousand ducats would be foolish to sell it for nine thousand, while a rich man would be foolish to refuse buying that same ticket for nine thousand -- the identical object, the identical expected price, produces opposite rational responses, so price alone cannot be what determines value. Once utility replaces price, Bernoulli states the general law directly: any increase in wealth, however small, produces an increase in utility that is inversely proportional to the quantity of goods the person already possesses. Each additional unit is worth less than the one before it -- a near-universal feature of how gains land on an existing base, rather than any quirk of psychology: the same thousand ducats means more to a pauper than to someone already wealthy, because it is added to less. This resolves what looks like an outright contradiction whenever a purely price-based calculation produces an answer no sensible person would act on -- a fair gamble computed by raw expected value can be one a poor person should refuse and a rich person should accept, and the two are not disagreeing about arithmetic, they are correctly pricing the same object in currencies (utility, not ducats) that differ by starting wealth. The diagnostic move: whenever a decision under risk looks irrational by a price-only or count-only calculation, ask whether the decider's starting position changes what the same objective gain is actually worth to them -- the calculation usually has the right numbers and the wrong quantity to multiply them by."
related: [lex-9eprx, lex-xjnjd]
evokes: [bernoulli-1738-exposition-new-theory-measurement-risk, st-petersburg-paradox, diminishing-marginal-utility, expected-utility-not-expected-value, moral-expectation, price-vs-utility, cramer-1728-letter]
lineage:
  - source: primary
    text: bernoulli-1738-exposition-new-theory-measurement-risk
    citation: "Daniel Bernoulli, 'Exposition of a New Theory on the Measurement of Risk' (1738, 'Specimen Theoriae Novae de Mensura Sortis'), trans. Louise Sommer, Econometrica 22, no. 1 (January 1954): 23-36, section 3."
    quote: "'Somehow a very poor fellow obtains a lottery ticket that will yield with equal probability either nothing or twenty thousand ducats. Will this man evaluate his chance of winning at ten thousand ducats? Would he not be ill-advised to sell this lottery ticket for nine thousand ducats? To me it seems that the answer is in the negative. On the other hand I am inclined to believe that a rich man would be ill-advised to refuse to buy the lottery ticket for nine thousand ducats... the determination of the value of an item must not be based on its price, but rather on the utility it yields. The price of the item is dependent only on the thing itself and is equal for everyone; the utility, however, is dependent on the particular circumstances of the person making the estimate. Thus there is no doubt that a gain of one thousand ducats is more significant to a pauper than to a rich man though both gain the same amount.'"
  - source: primary
    text: bernoulli-1738-exposition-new-theory-measurement-risk
    citation: "Daniel Bernoulli, 'Exposition of a New Theory on the Measurement of Risk' (1954 trans.), section 5 -- the general law, stated as a hypothesis about continuous, imperceptibly small increments of wealth."
    quote: "'It is highly probable that any increase in wealth, no matter how insignificant, will always result in an increase in utility which is inversely proportionate to the quantity of goods already possessed.'"
  - source: primary
    text: bernoulli-1738-exposition-new-theory-measurement-risk
    citation: "Daniel Bernoulli, 'Exposition of a New Theory on the Measurement of Risk' (1954 trans.), quoting Gabriel Cramer's 1728 letter on the St. Petersburg paradox, which Bernoulli reproduces as independent confirmation of the same diagnosis."
    quote: "'I believe that it results from the fact that, in their theory, mathematicians evaluate money in proportion to its quantity while, in practice, people with common sense evaluate money in proportion to the utility they can obtain from it.'"
canonical-instances:
  - "The St. Petersburg paradox itself: a coin-flip game pays 1 ducat if the first flip is heads, 2 if it takes two flips, 4 if three, doubling each time it fails -- the game's mathematically 'fair' price by raw expected value is infinite, yet Cramer notes 'no reasonable man would be willing to pay 20 ducats' to play it. The mathematicians and the sensible gamblers agree on the arithmetic; they price the game in different currencies. In ducats, the astronomically improbable astronomical payouts dominate the sum. In utility, the same payouts contribute almost nothing -- the currency the sensible gamblers were using all along."
  - "A startup founder who has just raised a large round turns down a modest amount of additional dilutive funding that an earlier-stage version of the same founder would have taken instantly for the same equity cost -- not inconsistency, but the same objective sum landing on a very different existing base and buying less marginal runway, control, or security than it once would have."
  - "Operationally distinct from lex-9eprx loss-aversion (Kahneman-Tversky): loss aversion is about asymmetric weighting AROUND A REFERENCE POINT -- a loss of $500 hurts more than a gain of $500 helps, holding wealth level constant. This atom is about diminishing marginal utility ACROSS ABSOLUTE WEALTH LEVELS -- a gain of $500 helps a poor person more than the identical gain helps a rich person, independent of any reference-point framing. The two mechanisms can co-occur in the same decision but explain different asymmetries -- reference-dependence vs. starting-wealth-dependence."
  - "Related to lex-xjnjd (a marginal-utility argument cures grief over a phantom gain): that atom is one specific, narrow, therapeutic APPLICATION of this atom's general law -- a healer walks a king back from grief over three lost cities by getting him to notice his existing wealth already exceeds what he can use, so the marginal cities were worth less than the grief assigned them. This atom is the formal statement of the law the Jataka tale applies; the tale doesn't need to state the law to use it correctly."
critical-questions:
  - "Bernoulli assumes diminishing marginal utility holds for 'the great majority' and explicitly flags exceptions (his own example: a rich prisoner who needs exactly two thousand ducats more to buy his freedom values that specific sum more than a poorer man with no such fixed need). How do you tell, before the fact, whether a given decision-maker is in the ordinary case or the exceptional one, where a specific threshold need makes marginal utility locally INCREASING rather than decreasing?"
  - "The law is stated over WEALTH rather than any single good -- does it hold with the same shape for every kind of resource (time, attention, social capital, a scarce material input to a factory), or does the curve's shape (not just its general downward direction) vary enough by resource type that treating them all as interchangeable instances of the same law would be a mistake?"
