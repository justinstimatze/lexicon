id: lex-nf7gg
name: a-causal-chains-endpoints-are-chosen-not-discovered
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a causal story is offered as a complete, objective account of why something happened -- this event caused that one -- check where the story's own beginning and end were placed, because the physical process itself doesn't come with a marked starting gun and finish line. Popper's example: a machine that says 'Mike' whenever it sees a particular cat can be described as realizing a causal chain from cat to utterance. But 'it is naive to look at this chain of events as beginning with the appearance of Mike and ending with the enunciation \"Mike\".' The process 'begins' (if at all) with a prior state of the machine already primed to respond, and 'ends' (if at all) not with the sound but with whatever state follows it -- the same is true, Popper notes, of the corresponding human response. 'It is our interpretation which makes Mike and \"Mike\" the extremes (or terms) of the causal chain, and not the \"objective\" physical situation. Moreover, we might consider the whole process of reaction as name, or only the last letters of \"Mike\", say, \"Ike\".' The physical process is continuous; the decision about where the cause starts and where the effect ends -- what counts as inside the story and what counts as its background -- is a choice supplied by whoever is telling the story, standing in for something the physics itself never marks. Diagnostic move: when a causal explanation is presented as objectively bounded -- a meeting behind a resignation, a tariff behind a shortage, a bug behind an outage -- ask what would change if the boundary were drawn one step earlier or later -- a different, equally defensible cut through the same continuous process often yields a different 'cause' and a different 'effect,' which is a sign the boundary is doing interpretive work the story isn't acknowledging."
related: [lex-4ph7n, lex-geqyt]
evokes: [popper-1953-language-and-the-body-mind-problem, the-causal-theory-of-naming, mike-the-cat, causal-chains-have-no-natural-endpoints, punctuating-a-continuous-process, where-you-cut-the-story-changes-the-cause]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Language and the Body-Mind Problem' (paper delivered to the 11th International Congress of Philosophy, Brussels, 1953; first published in its Proceedings, vol. 7), Ch. 12 of Conjectures and Refutations (Routledge Classics, 2002), p.401, Section 5 'The Causal Theory of Naming.'"
    quote: "'Consider a machine which, every time it sees a ginger cat, says \"Mike\"... It is naive to look at this chain of events as beginning with the appearance of Mike and ending with the enunciation \"Mike\". It \"begins\" (if at all) with a state of the machine prior to the appearance of Mike, a state in which the machine is, as it were, ready to respond to the appearance of Mike. It \"ends\" (if at all) not with the enunciation of a word, since there is a state following this. (All this is true of the corresponding human response, if causally considered.) It is our interpretation which makes Mike and \"Mike\" the extremes (or terms) of the causal chain, and not the \"objective\" physical situation. (Moreover, we might consider the whole process of reaction as name, or only the last letters of \"Mike\", say, \"Ike\".)'"
canonical-instances:
  - "A postmortem concludes 'the deploy caused the outage,' bounding the story from the deploy command to the first alert. Widen the frame one step earlier and the story becomes 'a missing staging check caused the outage'; widen it one step later and it becomes 'the outage was caused by the on-call engineer's decision not to roll back within the first five minutes.' The underlying sequence of events never changed -- only where the postmortem chose to start and stop looking."
  - "A historian writes that the assassination in Sarajevo caused the First World War. Alliance treaties, arms buildups, and colonial rivalries were already in motion for decades beforehand, and cutting the story there instead places the 'cause' much earlier -- the assassination shrinks to the moment an already-loaded situation happened to discharge."
critical-questions:
  - "Doesn't this collapse into 'no explanation is ever really objective,' which would make causal analysis pointless? No -- some cuts are far more useful and predictive than others (the deploy is a better intervention point than 'humanity has conflict'), and the atom isn't an argument against causal explanation. It's a check on treating one particular cut as the single fact of the matter rather than as a choice that could reasonably have been made differently, with real consequences for where responsibility and remedy get assigned."
  - "Isn't this the same point as noting that mechanism doesn't equal reason? No -- see [[lex-4ph7n]] on mechanism-versus-reason, which is about two different EXPLANATIONS competing for the same event. This atom is about a prior step: even a single, agreed mechanistic story has no built-in start and end point, so the very shape of 'the mechanism' is already an interpretive cut through a continuous process."
