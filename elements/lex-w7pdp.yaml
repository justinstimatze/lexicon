canonical-instances:
  - "Two engineers at a startup both say at hiring time that they intend to become the team's tech lead. One works on the team where technical leadership is the modal path for a senior engineer; the other works on a team where the modal path to lead runs through product management. A year later, the first is far more likely to have become tech lead — not because the first engineer wanted it more, but because their stated intention matched the path their team's structure already tends to produce."
  - "A first-generation college student and a legacy student both declare pre-med as freshmen, with equal conviction. The legacy student, from a family and social circle where becoming a doctor is the modal outcome, is statistically more likely to still be pre-med at graduation — the surrounding structure quietly reinforces the congruent intention and offers more off-ramps to the incongruent one, independent of either student's underlying resolve."
critical-questions:
  - "Kendall and Selvin's own second atom in this cluster (lex-h5c5x) supplies a concrete institutional mechanism for the internship case — informal faculty encouragement and self-scaling. In the voting case, what plays that role, if anything, and does the mechanism-agnostic version of this claim risk becoming untestable if no candidate mechanism can even be proposed for a given domain?"
  - "Is the 'modal pattern of the group' doing causal work here, or is group membership simply correlated with a THIRD factor (ability, resources, family background) that independently predicts both the group's modal outcome and which individuals within it can realize either preference — and how would you tell these apart without the kind of matched panel data Kendall and Selvin happen to have?"
