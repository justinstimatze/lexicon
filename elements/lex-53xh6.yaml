lineage:
  - source: primary
    text: eastman-north-wind-star-boy-stalemate-treaty
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twenty-Fourth Evening: North Wind and Star Boy.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "when lo! neither could prevail against the other, so that in the midst of the fight they were obliged to sit upon a snowbank to rest... Before he went away, he made a treaty of peace with Star Boy, promising to come to earth for half the year only, and to give timely warning of his approach, so that the people might prepare for his coming and lay up food against the day of scarcity."
canonical-instances:
  - "Two companies locked in a prolonged price war that neither can win outright negotiate a standstill agreement instead of continuing the fight -- defined seasonal promotional windows and advance notice of major pricing changes replace indefinite, unpredictable undercutting, letting both sides plan inventory and staffing around a known cycle rather than a constant ambush."
  - "Two nations unable to defeat each other militarily negotiate an arms-limitation treaty with defined inspection windows and advance notification requirements for troop movements, converting an exhausting, unpredictable arms race into a bounded, monitorable cycle without either side achieving the victory it originally sought."
critical-questions:
  - "does this pattern only work when both sides recognize the stalemate at the same time, or can one side exploit the appearance of exhaustion to extract favorable truce terms while secretly still gaining ground behind the scenes?"
  - "the people who actually bear North Wind's seasonal return had no seat at the negotiating table -- is a truce reached entirely between the two combatants really a treaty that serves the exposed third party, or just an accommodation between powers that happens to also help them?"
  - "how enforceable is a truce with no mechanism beyond the disputants' own word -- what actually happens, in this pattern, the first time the stronger party breaks the agreed timing or withholds the promised warning?"
