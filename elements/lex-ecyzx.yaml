id: lex-ecyzx
name: a-newly-adopted-principle-guides-action-only-when-consciously-recalled
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A person who has just adopted a new ethical commitment can apply it inconsistently across nearly identical situations, because in its first days the commitment only governs behavior when it is actively remembered in the moment rather than operating as an automatic habit -- and the lapses surface only as guilt after the fact, not as a warning beforehand. Black Elk's vision had told him he 'was to be like a relative' with the birds and animals, and he honors it once, sparing a bird because he 'remembered' the vow at the moment of drawing his bow. Minutes later, walking to a creek, he shoots a frog 'right away,' with no mention of remembering anything -- the commitment simply wasn't active in his mind at that instant. Only after the frog is dead does the principle's force arrive, retroactively, as grief: 'Now I have killed him,' and it made me want to cry."
related: []
evokes: [black-elk-speaks, like-a-relative-with-the-birds, now-i-have-killed-him, retroactive-guilt, newly-adopted-vow-applied-inconsistently]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch4-the-bison-hunt
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 4, 'The Bison Hunt.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "There was a bush and a little bird sitting in it; but just as I was going to shoot, I felt queer again, and remembered that I was to be like a relative with the birds. So I did not shoot. Then I went on down toward a creek, feeling foolish because I had let the little bird go, and when I saw a green frog sitting there, I just shot him right away. But when I picked him up by the legs, I thought: 'Now I have killed him,' and it made me want to cry."
canonical-instances:
  - "A person who has just decided to stop interrupting people in meetings catches themselves and stays quiet the first three times someone else is talking, then interrupts a fourth time without noticing until the words are already out."
  - "A new vegetarian passes up meat at dinner because they consciously think about their commitment while ordering, but eats a chicken-broth soup without a second thought because the commitment never crossed their mind while making that particular choice."
  - "A manager who has resolved to give credit publicly remembers to do it in the next team meeting, where the resolution is fresh in mind, but forgets in a hallway conversation that same afternoon, where it isn't."
critical-questions:
  - "Does the guilt that arrives right after the frog's death suggest the principle really was operating the whole time, just too slowly to prevent the act, or does it suggest the principle wasn't operating at all until the guilt itself activated it after the fact?"
  - "How many repetitions does it typically take for a consciously-recalled principle to become automatic enough to govern behavior even when not actively remembered, and does inconsistent early application predict the principle will eventually take hold, or predict it won't?"
  - "Does treating the frog and the bird as different, worth sparing the bird deliberately but shooting the frog without a thought, reveal that the commitment was never really 'all creatures are relatives' but something narrower Black Elk hadn't yet noticed the narrowness of?"
status: active
