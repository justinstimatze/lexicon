lineage:
  - source: primary
    text: Sen-2009-IdeaOfJustice-open-vs-closed-impartiality
    citation: "Amartya Sen, *The Idea of Justice* (Cambridge MA: Harvard University Press / London: Allen Lane, 2009), esp. Ch. 1 'Reason and Objectivity,' Ch. 5-6 'Impartiality and Objectivity' / 'Closed and Open Impartiality.' Sen's central distinction is between OPEN IMPARTIALITY (the judging stance invokes viewpoints from outside the focal group — Adam Smith's impartial-spectator at 'a certain distance from us' inviting diverse experiences and reasoned confrontation across boundaries) and CLOSED IMPARTIALITY (the procedure operates only on members of the focal society or nation, as in Rawlsian original-position contractarianism). The transferable claim Sen makes vital: when impartiality is closed, the framework systematically fails to detect parochial bias because the questioning is internal to the very group whose parochialism is at issue. Sen's structural critique of Rawls is that closed contractarianism cannot correct for parochial values the focal group shares: the binding constraint becomes not the quality of argument but the boundary of who is admitted to the discussion. The atom generalizes: when the configuration of WHO COUNTS AS A REASONER controls which reasons appear admissible, evidence-quality within the configuration is not the binding constraint — the boundary itself is. Methodologically: analytical political philosophy + capability approach + cross-civilizational comparative method (Sen draws heavily on Indian intellectual history)."
    quote: "[Sen 2009 Ch. 5 'Impartiality and Objectivity,':] 'The place of impartiality in the evaluation of social justice and societal arrangements is central to the understanding of justice, seen from this perspective. There is, however, a basic distinction between two quite different ways of invoking impartiality, and that contrast needs more investigation. I shall call them respectively \"open\" and \"closed\" impartiality. With \"closed impartiality\", the procedure of making impartial judgements invokes only the members of a given society or nation (or what John Rawls calls a given \"people\") for whom the judgements are being made. Rawls's method of \"justice as fairness\" uses the device of an original position, and a social contract based on that, among the citizens of a given political community. No outsider is involved in, or a party to, such a contractarian procedure. In contrast, in the case of \"open impartiality\", the procedure of making impartial assessments can (and in some cases, must) invoke judgements, among others, from outside the focal group, to avoid parochial bias.' [On Rawlsian closure failure mode:] 'failure to have any systematic procedure for correcting the influence of parochial values to which any society may be vulnerable when detached from the rest of the world... taking note of voices beyond the membership of the contractarian group, either to take note of their interests, or to avoid our being trapped in local parochialism.' [the transferable corollary:] the substantive issue Sen exposes is configurational: the failure mode of closed-impartiality is not bad argument WITHIN the closed group but the inability to even surface the parochial assumptions the closed group shares. Evidence-quality within the closure operates as a within-frame metric; the binding constraint on whether the parochial bias is corrected is configurational — does the procedure admit outsiders, and how many, and with what standing?"
  - source: primary
    text: Forst-noumenal-power-right-to-justification
    citation: "Rainer Forst, *Toleration, Power and the Right to Justification* (Manchester: Manchester University Press, Critical Powers series, 2017 — collecting essays and his replies). METHODOLOGICALLY-DISTINCT SECOND PRIMARY: where Sen 2009 is analytical-political-philosophy with cross-civilizational comparative method, Forst is continental critical-theory in the Frankfurt-School / post-Habermasian lineage. Forst's two foundational moves carry the GAP-9 transferable claim: (1) THE RIGHT TO JUSTIFICATION: 'whatever lines a democratic society draws between what it tolerates and what it finds intolerable, those lines themselves must satisfy demands citizens make that they be justified in ways that are general and reciprocal.' Reasons must be GENERAL (applicable to all) and RECIPROCAL (acceptable by all). A claim that cannot be justified to those it binds is not a moral or political claim — it is the exercise of power dressed as principle. (2) NOUMENAL POWER (Forst's most distinctive contribution): 'power is precisely the ability to influence the actions of others by shaping the space of reasons they inhabit.' Power is not external to the space of reasons; it OPERATES within it by configuring which reasons count as admissible, which appeals are heard as appeals, which justifications are taken to land. Forst contrasts noumenal power with violence (which is purely causal, attempting to influence without shaping reasons). The transferable claim: when noumenal power is configured asymmetrically — when one party shapes the space of reasons the other inhabits — the evidence-quality within the shaped space is not the binding constraint on the dispute. The configuration is."
    quote: "[Forst, *Toleration, Power and the Right to Justification* editor's introduction (Patchen Markell):] 'In particular, this means that the decision to draw the lines in a certain manner cannot rest solely on any particular religious or other comprehensive ethical worldview... reasons must be general – applicable to all – and reciprocal – acceptable by all. To offer a justification for my action or attitude, then, is to offer an explanation and defence that cannot be reasonably rejected.' [On noumenal power (the central GAP-9 anchor):] 'For Forst, power is precisely the ability to influence the actions of others by shaping the space of reasons they inhabit (he contrasts power with violence, which he takes to be the purely causal attempt to influence others without shaping the space of reasons they inhabit). Making power noumenal does not so much sanitise power as it makes reason itself a social, and socially embedded, realm. And it means that, for Forst, merely arguing that claims to toleration must appeal to reason is never the end of the story. For, what counts as a reason within a particular social setting is itself in part the result of particular power relations, and since these themselves can be challenged, struggles over toleration are not merely debates about how to derive a theory from set premises, but struggles over the very space of reasons in which claims to toleration are made.' [Forst on toleration as domination, Ch.1:] 'sometimes domination also operates by granting toleration... This form of toleration represents a complex combination of freedom and discipline, of recognition and disrespect, which calls for a Foucauldian analysis of the \"governmentality\" at work in this context of power.' [the transferable corollary:] noumenal power explains why moral arguments can be won at the level of within-space-of-reasons evaluation while the underlying configuration of WHO IS ENTITLED TO DEMAND JUSTIFICATION FROM WHOM remains untouched. The 'argument' was won within a space of reasons whose configuration was already set by the power-distribution; the configuration is the actual binding constraint. The historical pattern: abolition did not come from winning the moral argument — that was won decades before emancipation — it came from a shift in power. The within-space-of-reasons argument was won; the configuration shift was what cashed it out."
  - source: primary
    text: Chiang-2026-Atlantic-contemporary-AI-configurational-application
    citation: "Ted Chiang, 'No, Artificial Intelligence Is Not Conscious,' *The Atlantic* (3 June 2026). CONTEMPORARY APPLICATION: Chiang's structural claim about Anthropic and Claude's moral status is the contemporary AI-policy instance of lex-653ng: the evidence-quality on the patient-status question is not the binding constraint because the configuration (who is the adjudicator; whose reasons count as admissible; whose framing of the question is taken as the question itself) is set by the AI lab's economic position. Chiang's argument is structurally that the moral question cannot be adjudicated by the configurational arrangement that currently exists. The timing-of-protection argument follows: bind the protections BEFORE the configuration is set by economic deployment, because after deployment the configuration shapes which reasons count and the disqualified party will not voluntarily reconfigure. Cited as tertiary primary not for additional methodological-distinctness but as the canonical contemporary AI-policy deployment of the structural claim."
    quote: "[Chiang 2026 *The Atlantic*:] 'if you do believe that it could happen accidentally, if you think there is any chance that what you're building might become a moral patient, you should think about what protections it deserves before you deploy it as your company's economic engine, not after... Slave owners were not the ones to ask about the humanity of enslaved people, and factory-farm owners are not the ones to ask about the rights of animals. If we imagine Claude to be conscious, Anthropic could not possibly be entrusted with evaluating its moral status; the company has too much invested to be objective.' [the transferable corollary:] Chiang's argument fires at TWO levels — lex-ftu47 at the procedural level (Anthropic-as-adjudicator is structurally disqualified) and lex-653ng at the configurational level (the space of reasons in which AI consciousness is debated has been configured by AI labs' communicative and economic capacity to set which reasons count). The historical-abolition analogue is the critical pattern: the within-space-of-reasons argument about enslaved humanity was won by abolitionists decades before emancipation; the configurational shift (war, power redistribution) was what cashed out the won argument. The lesson Chiang transports forward: configurations must be set before the economic-stake-acquirer is in a position to set them, because after that point the configuration shapes which reasons count and the disqualified party will not voluntarily reconfigure."
  - source: primary
    text: Habermas-1990-MoralConsciousness-discourse-ethics-Gultigkeit-vs-Geltung
    citation: "Jürgen Habermas, *Moral Consciousness and Communicative Action* (Cambridge MA: MIT Press, 1990; original German *Moralbewußtsein und kommunikatives Handeln* 1983), esp. Ch. III 'Discourse Ethics: Notes on a Program of Philosophical Justification.' METHODOLOGICALLY-DISTINCT FOURTH PRIMARY (foundational discourse-ethics): Habermas supplies the deeper theoretical foundation Forst extends and the structural-precondition that lex-653ng's transferable claim relies on. The two pivotal Habermasian claims: (1) Discourse Ethics bases the validity of moral norms on the UNCOERCED rational agreement of those subject to them — explicitly distinguishing *Gültigkeit* (validity through justification) from *Geltung* (mere de facto acceptance through habit or coercion). A norm justified by coerced agreement is not justified at all; the justification requires that every affected party have the genuine right to respond 'yes' or 'no' to the reasons offered. (2) The Universalization Principle (U) and the Discourse Principle (D): only those norms can claim validity that meet (or could meet) with the approval of all affected in their capacity as participants in a PRACTICAL DISCOURSE — and that practical discourse must satisfy ideal conditions (no coercion, no force but the force of the better argument, equal standing for all participants, openness to revision). When the actual configuration of the discourse departs from these ideal conditions — when power constrains who can participate, what reasons count, which appeals land — the within-configuration validity is compromised at the foundation. Forst's noumenal-power concept extends Habermas's analysis by naming what happens when power shapes the space of reasons itself: the ideal conditions are violated not through overt coercion but through the prior shaping of which reasons are admissible. Methodologically: continental critical theory in the Frankfurt-School tradition (post-Adorno, pre-Forst), anchored in speech-act theory and pragmatism. This is the deeper foundation lex-653ng rests on: configurational power matters because it undermines the ideal-discourse precondition for moral-norm validity."
    quote: "[Habermas 1990 introduction by Thomas McCarthy summarizing the discourse-ethics program:] 'In Habermas's discourse ethics, which bases the justification of norms on the uncoerced, rational agreement of those subject to them, equal respect for individuals is reflected in the right of each participant to respond with a \"yes\" or \"no\" to the reasons offered by way of justification. Concern for the common good is reflected in the requirement of general and reciprocal perspective taking: in seeking mutual agreement, each attempts to get beyond an egocentric viewpoint by taking into account the interests of others and giving them equal weight to his or her own.' [Habermas's own articulation of the Gültigkeit/Geltung distinction:] 'every agreement, whether produced for the first time or reaffirmed, is based on (controvertible) grounds or reasons. Grounds have a special property: they force us into yes or no positions. Thus, built into the structure of action oriented toward reaching understanding is an element of unconditionality. And it is this unconditional element that makes the validity (Gültigkeit) that we claim for our views different from the mere de facto acceptance (Geltung) of habitual practices.' [On the intersubjective and embedded character of practical discourse:] 'practical discourse as a reflective continuation of communicative interaction preserves that common core. Rather than contractual agreements among \"unencumbered\" individuals with arbitrarily chosen ends, it involves processes of reflective argumentation among previously socialized subjects whose needs and interests are themselves open to discussion and transformation. The egocentric perspective is treated not as primary but as derivative; autonomy is conceptualized in relation to embeddedness in shared forms of life.' [the transferable corollary:] Habermas's Gültigkeit/Geltung distinction is the deep version of lex-653ng: configurational power produces Geltung (mere de facto acceptance — habitual compliance, coerced alignment, configurationally-shaped 'consensus') without Gültigkeit (genuine validity through justified uncoerced agreement). When the configuration of the space of reasons is power-shaped, the within-configuration 'agreement' has Geltung but not Gültigkeit — practical-discourse validity requires the ideal-conditions precondition that configurational power violates. Forst's noumenal-power extends this into the analysis of how configuration is achieved without overt coercion."
canonical-instances:
  - "Abolition historical instance: the moral argument about the humanity of enslaved people was won by abolitionists decades before legal emancipation (Quaker testimonies + Wilberforce + Sojourner Truth + Frederick Douglass + Garrison-era publications all predate the war and the constitutional amendments). Emancipation came not from a further within-space-of-reasons advance but from a configurational shift — civil war, Reconstruction's brief power redistribution, the 13th-14th-15th Amendments. The within-space-of-reasons argument was won; the configurational shift was what cashed out the won argument. lex-653ng names what was happening structurally: the binding constraint on the practical outcome was the power-distribution, not the evidence-quality."
  - "Cruelty-to-animals industry instance: the moral argument that factory farming inflicts large-scale suffering is largely conceded in moral philosophy (Singer 1975 onward; vast empirical literature on animal sentience). The practice persists at industrial scale because the configurational position of the meat-and-dairy industry holds the power to define the regulatory terms, the scientific framing, the discourse's admissible reasons. lex-653ng fires: within-space-of-reasons argument is largely settled; the configurational shift required is not in the offing."
  - "Hinton-feedback doc Anthropic-AI-consciousness instance (Chiang 2026): the AI lab's economic position configures which reasons count in the public discussion. The within-space-of-reasons argument can be 'won' by Chiang or anyone else in a venue like *The Atlantic*; the configurational set of who is entitled to make binding determinations about Claude's moral status remains with the lab. Without configurational pre-commitment (lex-6tvr6) BEFORE economic deployment, the configurational binding constraint will not be released by the configured party."
  - "Rawlsian closed-contractarian failure mode (Sen's worked instance): a Rawlsian original-position deliberation among members of a single society systematically fails to detect parochial values the society shares (the original critique driving Sen's open-impartiality framework). Within the closed configuration, every argument that gets made is internal to the shared parochialism. Sen's structural diagnosis: the failure mode is configurational (who is admitted), not evidential (how well are arguments made within the admission)."
  - "Operationally distinct from lex-ftu47 conflict-of-interest disqualifies adjudication: lex-ftu47 is the PROCEDURAL claim (the conflicted party is disqualified from the adjudication role). lex-653ng is the CONFIGURATIONAL claim (even if the procedural rule were enforced, the broader question of who counts as a reasoner / whose reasons land / which reasons are admissible is shaped by power-distribution at a level lex-ftu47's procedural remedy does not reach). lex-ftu47 says 'a different party should decide'; lex-653ng says 'the question of whose decision counts is itself shaped by power.' They compose: lex-ftu47 is the within-configuration remedy; lex-653ng is the meta-claim that configurations themselves are power-shaped."
  - "Operationally distinct from lex-qhydj power-elite (Mills) + lex-6wha5 organized-minority (Mosca) + lex-enpjy political-formula (Mosca): the Mosca/Mills atoms describe the EMPIRICAL pattern of power-concentration in political life (organized minorities rule disorganized majorities; coordinated elites occupy command-positions; the dominant ideology naturalizes the configuration). lex-653ng is the EPISTEMIC corollary: when power is configured that way (Mosca/Mills empirical claim), the binding constraint on moral and political adjudication is the configuration, not the evidence-quality within the configuration. The atoms compose: lex-qhydj/0401/0402 supply the empirical mechanism that explains why lex-653ng fires reliably across cases."
  - "Operationally distinct from lex-cgqta naturalization: lex-cgqta names the move where the system erases the mechanism that produced the artifact (the configuration is treated as natural). lex-653ng is what is happening WHEN naturalization succeeds at the configurational level — the space of reasons has been shaped, and the shaping is invisible from within the shaped space. lex-cgqta is the diagnostic move; lex-653ng is the structural-epistemic claim about what the diagnosed move is concealing."
  - "Operationally distinct from lex-6tvr6 pre-commitment: lex-6tvr6 is the structural-rescue PATTERN (bind future actions before stake erodes will/credibility); lex-653ng is the SUBSTANTIVE CLAIM about when pre-commitment is key (when configurations are set by power and once set are invisible from within the shaped space). lex-6tvr6 is the mechanism; lex-653ng is the diagnosis that the mechanism is essential precisely because the alternative (within-configuration argument) is not the binding constraint."
critical-questions:
  - "is the question at hand contained within a configured space of reasons, or is the configuration of the space itself at issue? Diagnostic: if the question were settled by within-space evidence, would the practical outcome change? If yes, the within-space evidence-bar IS the binding constraint and lex-653ng is misapplied. If no — if the practical outcome would persist regardless of within-space evidence resolution — then the configuration is the binding constraint and lex-653ng fires."
  - "who configured the space of reasons in which the dispute is being conducted, and is the configuration noumenally power-shaped (Forst's sense)? Test: identify whose reasons count as admissible, whose framing is treated as the framing of the question, whose appeals land as appeals. If these tend systematically to favor one party's prior position, the configuration is noumenally power-shaped. Naming the shaping is the prerequisite to challenging it."
  - "would open-impartiality (Sen) detect the parochial assumptions the closed group shares? Test: import reasoners from outside the configured space (different cultures, different stake-positions, different historical eras, different professional methodologies). Do they recognize the within-space conclusions as well-grounded, or do they identify parochial assumptions invisible from within? Sen's structural claim is that open-impartiality is a CORRECTIVE for the closed-impartiality failure mode; lex-653ng fires when closed-impartiality is the only available mode and the closure is power-shaped."
  - "do the prevailing reasons in the configured space satisfy Forst's GENERAL + RECIPROCAL test? Reasons that are general (applicable to all affected) and reciprocal (acceptable to all affected) are the hygiene-test for whether the within-space argument is morally binding. If the reasons FAIL generality or reciprocity, they are not justifications but exercises of power dressed as principle."
  - "is the within-space argument being won while the configurational binding constraint remains intact (the abolition-pattern)? Test: identify whether the practical outcome the within-space argument prescribes is being instituted. If the argument is conceded but the practical outcome does not follow, the binding constraint is configurational (lex-653ng fires) not evidential. The diagnostic is operational, not epistemic."
  - "what would a configurational shift look like, and is it institutionally available? lex-653ng's remedy is configurational, not within-space-of-reasons. The atom is critical but operationally empty without a configurational-shift channel. Adjacent literature: lex-6tvr6 pre-commitment as the timing-of-configurational-binding-rescue; gemot deliberation-by-stake-free-parties as a procedural-channel attempt to shift configuration; constitutional pre-commitment + adjudication by stake-free parties (lex-ftu47 procedural sibling)."
  - "is the diagnosis of configurational binding being used to AVOID engaging within-space arguments that the diagnosing party simply finds inconvenient? Over-application guard: claiming 'the configuration is the binding constraint, evidence-quality doesn't matter' is exploited as a debate-shutdown move when the within-space arguments actually DO carry weight and the configurational claim is rhetorical cover. The honest application requires showing that (a) the practical outcome would persist regardless of within-space evidence resolution, AND (b) the configuration can be identified with named power-mechanisms (not just 'they're biased')."
  - "where do practitioners over-apply this critique? Treating EVERY moral or political dispute as configurationally bound is itself a parochialism — some disputes ARE settled by within-space evidence, and the configurational diagnosis becomes a way to avoid the work of within-space argument. The atom fires when (i) the configuration is named with specific power-mechanisms, (ii) the practical outcome is shown to be configurationally determined, (iii) within-space argument concession does not produce the prescribed practical outcome. Absent these, the move is rhetoric, not diagnosis."
