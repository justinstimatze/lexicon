id: lex-caf5w
name: narrowing-to-one-food-web-creates-a-maximally-exposed-target
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a community narrows its livelihood down to a single, immobile, storable resource base, recognize that this doesn't just create a surplus worth stealing -- it also creates a population that can no longer disperse or flee, making it uniquely exposed to total annihilation in a way a mobile, diversified economy isn't. Graeber and Wengrow's case: central Europe's earliest Linear Pottery farming villages built almost everything -- fuel, fodder, construction material, food -- around a single narrow food web of a few cereal crops and livestock. Several of these settlements ended in mass graves showing systematic torture, mutilation, and killing of entire communities, with younger women missing from the remains, suggesting they were taken as captives. A forager band that loses a harvest or a hunting ground can disperse and regroup elsewhere; a village that has narrowed its whole existence to one immobile food web, one fixed location, and one storable surplus has nowhere to retreat to and nothing left once that base is destroyed or captured. The narrowing that makes a surplus extractable is the same narrowing that makes its holders unable to escape when someone decides to take it by force."
