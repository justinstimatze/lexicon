canonical-instances:
  - "A new manager asks their team 'any concerns about the reorg?' in the first all-hands and gets silence or 'no, looks good' — only after someone risks a real criticism in a later meeting and sees the manager thank them rather than push back does the rest of the team start speaking honestly, and a manager who changes teams has to rebuild that track record from zero with the new group."
  - "A restaurant owner who asks a new hire 'how's training going, any problems?' gets 'everything's great' regardless of the actual answer, until the new hire watches a coworker point out a real scheduling problem and sees nothing bad happen to that coworker — the safety is demonstrated by proxy, not just experienced firsthand."
critical-questions:
  - "Does watching a PEER'S criticism go unpunished transfer safety as reliably as personally testing it — Goss's account has each new cohort of representatives needing fresh reassurance, but does that reflect a lack of any peer-transfer effect, or simply that the new cohort hadn't yet witnessed a peer's test within the new group?"
  - "How much does a single visible instance of retaliation, even once, cost relative to how many instances of demonstrated safety it takes to build trust — is the relationship symmetric, or does trust accumulate slowly and evaporate in one incident, and if the latter, how many 'no punishment' data points does an authority figure actually need before the reflexive reassurance answer stops recurring?"
status: active
