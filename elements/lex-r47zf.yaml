id: lex-r47zf
name: windfall-wealth-reads-as-shady-because-it-fits-no-inherited-category
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "A culture's inherited moral vocabulary for acquiring wealth typically has two legitimate slots -- earned through labor, or received as a gift -- and treats anything outside those two as theft. Wealth that actually arrives through a third route, a chance find combined with the wit to exploit it, doesn't fit stolen either, but the culture has no clean name for it, so it defaults to reading as suspicious even when nothing was taken from anyone. Hyde traces this through Hermes' hermaion, the tortoise he stumbles on and turns into the first lyre: 'Archaic Greeks assumed that if wealth was not earned by the sweat of the brow or received as a gift from a friend, then it must have been stolen. Earned or stolen, gift or theft: by such oppositions agrarian kinship understood the acquisition of riches. A lucky find, a hermaion such as the lyre, eludes these categories... that wealth is neither kin gift nor immoral theft but a third thing, created in a manic moment out of chance and mental insight.' He draws the modern parallel himself: 'Like any such combination of technique and accident it seems, therefore, to come out of nowhere and, at first, to have no clear place in the order of things. It seems a bit shady, like the sudden fortunes of oil barons in the early twentieth century, like the sudden fortunes of software developers more recently.' The suspicion isn't produced by any actual wrongdoing in the windfall itself; it's produced by the gap between how the wealth was actually created (chance plus insight, a category the inherited vocabulary never anticipated) and the only two categories that vocabulary offers. Diagnostic move: when a rapid fortune reads as inherently suspicious despite no identifiable victim or violated obligation, check whether the suspicion is tracking an actual wrong or simply the absence of a category -- earned and gifted wealth both have visible, checkable origin stories; a genuine lucky find plus skill often doesn't, and the resulting unease can be mistaken for evidence of theft when it's really just evidence of a gap in the vocabulary."
