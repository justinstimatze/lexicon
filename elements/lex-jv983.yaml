id: lex-jv983
name: fluency-trap
common-name: "Mistaking smooth for true"
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When something feels right because it parses smoothly, pause and ask 'what observation would change my mind?' — fluency is suggestive, not evidence."
