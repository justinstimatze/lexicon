name: given-a-choice-of-targets-eliminate-the-bigger-future-threat-not-the-easier-win
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you and a rival each get to neutralize one of two available threats and can choose which, don't default to whichever is easier to beat -- the value of removing a threat is what it would have cost you later, not what it costs you now. Kautilya analyzes a symmetric scenario: both the conqueror and his natural enemy each have an opportunity to attack a different rival who is currently distracted fighting someone else, and the question is which of the two available rivals is the better one to strike. Rangarajan summarizes the resolution: 'The purpose of this step-by-step analysis is to show that, when the conqueror and the enemy both attack different kings in the rear, he who chooses a more difficult adversary will eventually emerge stronger, because of having eliminated a stronger threat to his own rear.' The logic ranks difficulty in ascending order across four tiebreakers -- raw power, degree of mobilization, willingness to commit all resources, and fortification -- but the ranking runs the same direction throughout: whichever party takes on the tougher target comes out ahead specifically because removing a bigger threat is worth more to your future security than removing a smaller one, even though the smaller one is the cheaper fight in the moment. The apparent paradox -- choosing the harder fight over the easier one -- resolves once you separate the cost of the fight itself from the value of what the fight permanently removes: an easy win against a weak rival still leaves a bigger rival intact somewhere else, and that bigger rival's threat doesn't go away just because you avoided it this round. Diagnostic move: when you get to pick which of two available threats to neutralize now, don't rank them by which is currently cheaper or safer to engage -- rank them by which one would cost you the most later if left alone, and take on that one even at greater immediate cost, since the ongoing threat you leave standing doesn't discount itself just because you deferred dealing with it."
