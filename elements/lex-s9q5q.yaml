evokes: [radin-winnebago-trickster-cycle, a-cue-decouples-from-the-claim-it-once-carried, all-those-invited-realized-that-this-was-all-mere-talk, they-would-all-go-to-the-feast-anyway]
lineage:
  - source: primary
    text: radin-chiefs-repeated-war-announcements-become-a-cue-for-the-feast
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 1. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Shortly afterward it was again rumoured that the chief was going on the warpath. Again, someone was dispatched to find the fire-builders. ... Shortly after, for the fourth time, it was rumoured that the chief was going on the warpath. By this time, because of what had happened before, all those invited realized that this was all mere talk. There would be a feast to which they would all go. But they also knew that the chief had no intention of going on the warpath.'"
canonical-instances:
  - "A manager announces every quarter that a promised reorganization is imminent and nothing ever actually changes; employees stop treating the announcement as information about the org chart and start treating it as the reliable cue that a town-hall lunch is coming, attending for the lunch."
  - "A politician repeatedly promises a specific policy at rallies without ever introducing it once elected; longtime supporters keep showing up to the rallies, not because they expect the policy this time, but because the rally itself delivers the community and spectacle they actually came for."
critical-questions:
  - "Is there a point at which continuing to respond to a discredited announcement becomes actively costly rather than a harmless collection of a known side-benefit -- what would that cost look like here, and does the story show anyone paying it?"
  - "Does the chief benefit from the announcement having become a mere cue, since it keeps drawing a crowd and supplies with no follow-through required, or is the story silent on whether he even notices that no one believes him anymore?"
  - "Would a single loud public refusal to attend, rather than quiet private cynicism, have changed the chief's behavior, or does the story suggest the pattern is stable precisely because everyone still shows up despite privately discounting the claim?"
