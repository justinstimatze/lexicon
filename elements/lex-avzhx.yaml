name: ideas-can-rival-material-power-as-a-historical-force
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone dismisses ideology, moral conviction, or 'mere ideas' as having little real influence on political or historical outcomes compared to material resources, wealth, or force, check the dismissal against cases where an idea alone appears to have done the causal work. Popper states this directly as his fourth thesis, after noting that 'the war of ideas is a Greek invention... the possibility of fighting with words instead of fighting with swords is the very basis of our civilization, and especially of all its legal and parliamentary institutions': 'The power of ideas, and especially of moral and religious ideas, is at least as important as that of physical resources. I am well aware of the fact that some students of politics are strongly opposed to this thesis; that there is an influential school of so-called political realists who declare that 'ideologies', as they call them, have little influence upon political reality, and that whatever influence they have must be pernicious. But I do not think that this is a tenable view. Were it true, Christianity would have had no influence on history; and the United States would be inexplicable, or merely the result of a pernicious mistake.' Popper's argument form is a reductio against the dismissal itself: name a historical outcome (a civilization-shaping religion, a nation's founding) that only makes sense as the causal product of an idea, and the 'ideas don't really matter' position has to explain it away as coincidence or error rather than engage it directly. Diagnostic move: before accepting that a decision, movement, or institution was really driven by material interest with ideology as cover, ask what the outcome would look like if the idea genuinely were doing causal work, and check whether that description fits what actually happened better than the material-interest account does."
