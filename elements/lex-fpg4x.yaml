lineage:
  - source: primary
    text: kautilya-arthashastra-relative-progress-decline
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Definitions, Principles and Methods,' 'Progress and Decline,' {7.1.24-29, 7.12.29}."
    quote: "'A king suffers a decline when his own initiatives are ruined or when the enemy's undertakings prosper... It is a decline for the conqueror if the enemy's undertakings flourish; conversely, the decline of an enemy's undertakings is progress for the conqueror. Parity between the two is maintained when both make equal progress.'"
  - source: primary
    text: kautilya-arthashastra-gain-versus-outlay-and-trajectory-tolerance
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part X, section 'Progress and Decline,' {7.1.20-29, 7.12.29}."
    quote: "'A small gain for a large outlay is decline; the converse is progress. A gain equal to the expenditure on an undertaking means that the conqueror has neither progressed nor declined.' 'A king may ignore an enemy's progress if his own progress will be quicker or greater [than that of his enemy] or if there is a prospect of greater future gain.' 'A king may ignore his own [temporary] stagnation if he believes that, after a short period he will make progress while his enemy will take longer to do so.'"
canonical-instances:
  - "A company celebrating record quarterly revenue is actually in relative decline if its main competitor's revenue is growing faster off a smaller base, or if the record revenue came from a marketing spend that outpaced the resulting profit — Kautilya's framework flags both conditions (rival's faster trajectory, unfavorable gain-to-outlay ratio) as decline even though the company's own absolute numbers look like unambiguous success."
  - "A researcher early in an academic career tolerates being behind peers in publication count for a few years because their specific line of work has a longer time-to-first-result but a steeper expected trajectory once it pays off — the tolerable-disadvantage rule applies precisely because the comparison is about relative future rate, not current absolute standing."
critical-questions:
  - "how reliably can a decision-maker actually forecast their own future trajectory versus a rival's, given that the entire 'ignore a current disadvantage' rule depends on a prediction about relative future rates that is exactly the kind of judgment most vulnerable to overconfidence and wishful thinking?"
  - "does treating a rival's misfortune as automatically equivalent to your own progress (even with zero action on your part) risk a passive strategic posture — waiting for a rival to stumble rather than actively building capability — that the framework's own emphasis elsewhere on active policy and building forts, trade routes, and settlements seems to argue against?"
  - "in a genuinely multi-polar competitive environment (more than two rivals), does a purely bilateral rate-comparison framework (you versus one rival) miss strategically important information about your position relative to the full field, and does Kautilya's own analysis ever address comparison against more than one rival simultaneously?"
