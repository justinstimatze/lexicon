id: lex-s95bw
name: keep-a-helpful-ally-embroiled-so-their-success-doesnt-outgrow-your-control
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an ally is helping you defeat a shared enemy, don't assume their success is unambiguously good for you -- an ally who wins too completely can convert from useful subordinate to uncontrollable independent power, and Kautilya prescribes deliberately manufacturing a new obstacle for them specifically to prevent that conversion: 'An ally who is likely to grow in power after defeating the enemy and thus become uncontrollable shall be embroiled in a conflict with his own neighbour and his own ally; or, a pretender in his family or an unjustly treated prince shall be encouraged to seize the throne; or such actions shall be taken as would oblige the ally to remain obedient, in return for help received.' The three listed tactics all work the same way: manufacture a fresh problem for the ally to solve (a border conflict, an internal succession dispute) so that their attention, resources, and dependency on you never fully clear even after they've delivered on the original task, or engineer a favor so large that continued obedience becomes the price of your not withdrawing it. The timing is the crucial and easy-to-miss part: this isn't a response to the ally acting badly, it's a preemptive move triggered by nothing more than the ally being ABOUT TO succeed too well -- the ally has done exactly what was asked, and the reward for that success is a fresh, engineered form of continued dependency. Diagnostic move: when an ally, partner, or subordinate is on the verge of fully accomplishing the task you needed them for, ask what happens to your leverage over them the moment they succeed -- if total success would leave them powerful enough to no longer need you, consider whether a new, genuine obligation (not a punitive one, but a real distraction or dependency) should be introduced before that moment arrives, rather than assuming a grateful, successful ally will remain a controllable one."
