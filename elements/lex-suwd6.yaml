id: lex-suwd6
name: a-three-stage-rehearsal-produces-group-self-persuasion
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Groups preparing a public justification for a decision go through a distinct three-stage rehearsal that ends in genuine self-persuasion rather than truth-seeking. Stage one is loose and playful — managers cast around many possible framings to 'cover all the bases,' often with real levity and parody, and weaker options fall away on their own. Stage two turns adversarial: specific rationales face a kind of devil's-advocacy back-and-forth, one manager proposing a line and another countering with its weakness. Stage three is the decisive convergence, when the group settles on a rationale it collectively 'feels comfortable' with — at which point morality becomes personal comfort relative to anticipated outside reactions, not correspondence to some independent standard. The rehearsal's real function isn't refining the truth of the justification, it's producing genuine confidence in whichever rationale survived — 'convincing oneself of one's own rectitude' is the actual output, and it's described as the most subtle and effective form of hype precisely because the group isn't performing confidence, it now has it."
related: []
evokes: [jackall-moral-mazes, "convincing oneself of one's own rectitude", the-three-stage-legitimation-rehearsal]
