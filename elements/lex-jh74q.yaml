evokes: [loyalty-doesnt-expire-when-the-original-task-ends, cushing-the-warrior-suitor-of-moki, the-fools-didnt-think-of-the-dogs-lying-around-outside, a-standing-self-directed-asset]
lineage:
  - source: primary
    text: cushing-warrior-suitor-moki-dogs-overhear-and-report-the-plot
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Warrior Suitor of Moki.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'The jilted lovers got together one night in a cautious sort of way (for they were all afraid of this hero) and held a council. But the fools didn't think of the Dogs lying around outside, who heard what they said. They concluded the best way to get even with this youth was to kill him... Now, the Dogs scrambled off immediately and informed their friend and brother what was going on.'"
canonical-instances:
  - "A manager who once went out of their way to support a junior team during a difficult reorg finds, years later, that the same team quietly tips them off about a plan being discussed by rivals in another department, without ever being asked to keep watching, simply because the original loyalty never expired."
  - "A community organizer who built trust with a neighborhood by helping residents through a specific crisis years earlier finds that those same residents alert them, unprompted, when a hostile developer starts making inquiries in the area, because the standing relationship continued generating value long after the original crisis had passed."
critical-questions:
  - "does relying on a loyal network to keep protecting you indefinitely risk exploiting a relationship that was built for a specific, time-limited purpose, without ever renewing consent or acknowledging the ongoing burden being placed on the network's continued vigilance?"
  - "how much of this pattern depends on the rivals' specific carelessness, forgetting the dogs existed at all, rather than on any special durability of the loyalty itself -- would a more careful adversary who accounted for the network have been able to route around it entirely?"
  - "is it realistic to expect a network's loyalty to persist and self-direct without any ongoing investment or acknowledgment from the person who originally earned it, or does the story understate how much relationships like this actually require maintenance to remain reliable?"
status: active
