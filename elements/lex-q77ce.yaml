id: lex-q77ce
name: marginal-cost-of-correction-grows-with-deferral-so-act-while-small
type-in: state
type-out: posture
_tier: atomic
agent-instruction: "When you notice a small problem that you COULD fix now but COULD also defer — a tiny inconsistency in a draft, a 1% data drift in a pipeline, a hairline crack in equipment, a low-level interpersonal friction, a one-line lint warning that's been there for weeks — the proverb-tradition's transferable claim is that the MARGINAL COST OF CORRECTION GROWS WITH DEFERRAL, often nonlinearly. The small fix is cheap NOW because the system around the defect is still small enough to be touched without rippling. Each unit of deferral lets the defect couple to more of the system: the data drift propagates downstream models, the crack accumulates fatigue, the friction calcifies into a stable conflict, the lint warning is duplicated by ten more identical warnings as developers learn the pattern. The cost-curve is convex up. The proverb-tradition's diagnostic shorthand is structural: 'a stitch in time saves nine,' 'an ounce of prevention is worth a pound of cure,' 'mend the hole while it is small,' 'every spark adds to the fire' — these are NOT individual idioms but the same claim attested across English, American, Russian-tradition, Chinese-tradition, Sufi-tradition, and other proverb-cultures (Mieder's World Proverbs collection encodes this convergence). The atom asks you to count the deferral-cost in non-trivial decisions: what does this defect couple to as time passes, and does deferring let those couplings compound? If yes, act now even if it feels disproportionate to the immediate annoyance. Be careful with the inverse failure mode: not every small irritation grows. The atom applies when the defect is structurally CONNECTED to a growing system — code that more developers will read, an organism whose tissue will accumulate damage, an institution whose practice will be copied. It does not apply to isolated annoyances that will dissolve on their own without intervention. Diagnostic: imagine the defect at 2x, 5x, 10x its current size — is the fix cost roughly linear in size, or convex? If linear, defer is rational. If convex, fix now."
related: [lex-wtkuz, lex-spm8x, lex-eb3wf, lex-mwgep, lex-9kuqg, lex-ubyz3, lex-nx7u7, lex-ga4dw, lex-643m7, lex-zfssj, lex-u7aau]
evokes: [stitch-in-time, ounce-of-prevention, broken-windows-theory, technical-debt-compounds, mend-the-hole-while-small, every-spark-adds-to-fire, small-leak-sinks-great-ship, prevention-better-than-cure, convex-cost-of-deferral, proverb-tradition-cross-cultural-attestation]
lineage:
  - source: primary
    text: cross-proverb-convergence-stitch-in-time-prevention-better-than-cure
    citation: "Multi-tradition proverb-attestation. The transferable claim — marginal cost of correction grows with deferral — is attested in proverb collections across cultures and centuries. (a) WOLFGANG MIEDER (ed. in chief), Stewart A. Kingsbury, Kelsie B. Harder, *A Dictionary of American Proverbs* (Oxford 1992): 'An ounce of prevention is worth a pound of cure' (American attestation; also 'Beware of little expenses: a small leak will sink a great ship' and 'Don't let a small fire get to be a big one'). (b) JOHN SIMPSON & JENNIFER SPEAKE (eds.), *The Oxford Dictionary of Proverbs* (Oxford 5th ed. 2008): explicit entry 'PREVENTION is better than cure' as canonical British/English-tradition proverb. (c) WOLFGANG MIEDER (compiler), *The Prentice-Hall Encyclopedia of World Proverbs* (Prentice Hall 1993): contains entries #12935 'Prevention is better than cure' (cross-tradition), #14883 'Every spark adds to the fire' (cross-tradition), #15107 'A stitch in time saves nine' (English), and 'Mend the hole while it is small' (multi-tradition). The encyclopedia's organizing structure encodes cross-cultural attestation: entries are presented as variants of structurally identical claims across linguistic traditions. (d) Benjamin Franklin's *Poor Richard's Almanack* (1735) attests 'An ounce of prevention is worth a pound of cure' as an early American crystallization; the medical-prevention sense extends backward to medieval Latin medical proverbs. The transferable atom does NOT commit to any one proverb's specific framing; what it claims is the underlying STRUCTURAL move (deferral grows correction cost) which the proverb-tradition encodes across cultures with structurally analogous specific instances. The cross-cultural convergence (English-American, English-British, Russian-tradition, Chinese-tradition, Sufi-tradition all encoding the same structural pattern) is the transferability evidence: this is not a Western-culture-specific maxim but a structural feature of systems where defects propagate over time. Distinct from lex-eb3wf because lex-eb3wf is about specific anticipation tactics (Klein pre-mortem). Distinct from lex-mwgep positive-feedback-amplifies-early-events because that atom is about path-dependence and trajectory-lock-in, not about the marginal-cost-of-correction grown over time (though related — lex-mwgep is upstream-structural; this atom is downstream-practical-discipline). Distinct from lex-9kuqg critical-juncture because critical-juncture is about specific moments of high-leverage; this atom is about the everyday-discipline of acting before deferral compounds. Distinct from lex-nx7u7 base-rate-neglect because that's about probability estimation; this is about cost-curve over time. The atom is upstream of broken-windows-theory (Wilson-Kelling 1982) and downstream of cross-cultural proverb-traditions — the latter providing the transferability evidence."
    quote: "[Mieder ed. *A Dictionary of American Proverbs* 1992, entry 'PREVENTION':] 'An ounce of prevention is worth a pound of cure. [...] Beware of little expenses: a small leak will sink a great ship. [...] Don't let a small fire get to be a big one.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'cure':] 'cure see NO cure, no pay; PREVENTION is better than cure.' [Same volume, listing PREVENTION as canonical entry with the cross-listing convention used for fully-attested proverbs.] [Mieder *Prentice-Hall Encyclopedia of World Proverbs* 1993, multiple entries:] '12935. Prevention is better than cure. [...] 14883. Every spark adds to the fire. [...] 15107. A stitch in time saves nine. [...] Mend the hole while it is small.' [Franklin *Poor Richard's Almanack* 1735, the early American crystallization in fire-safety context: 'An ounce of prevention is worth a pound of cure' (referring originally to fire prevention in Philadelphia).] [The cross-cultural pattern: in every collection surveyed, the proverb-tradition encodes the marginal-cost-of-correction-grows-with-deferral claim through structurally analogous specific maxims — fire-fighting, ship-leak-fixing, garment-mending, medical-prevention. The atomic transferable claim is the structural one — the cost-curve of deferral is convex up — which the cross-cultural attestation independently demonstrates as a feature humans across traditions have noticed and crystallized.]"
canonical-instances:
  - "Code-review practice: a 1-line inconsistency caught at submit-time costs ~30 seconds to fix and discuss. The same inconsistency, multiplied across 20 files over six months by developers who learn the bad pattern, costs days to refactor. The convex cost-curve is the transferable shape; this is broken-windows-theory applied to code (a downstream specific instance of the general claim). Engineering teams with strict linters operationalize lex-q77ce — the linter forces the fix at the moment of cheapness."
  - "Medical preventive care (the canonical proverb-context): catching hypertension at 130/85 with diet + exercise costs months of lifestyle adjustment. Treating end-stage cardiovascular disease after 20 years of uncontrolled hypertension costs surgical intervention, lifetime medication, and quality-of-life collapse. The cost ratio is order-of-magnitude. The medical proverb-tradition encoded this exact claim ('an ounce of prevention worth a pound of cure') for centuries before modern epidemiology quantified the cost curve."
  - "Data-pipeline drift: a 1% calibration drift detected and corrected at week 1 is a parameter tweak. The same drift detected at week 26 — after 25 weeks of downstream models trained on the drifted distribution — requires retraining the cascade. The compounding is structural (downstream models couple to upstream distribution); the proverb-tradition's structural claim applies cleanly."
  - "Interpersonal friction: a 30-second clarifying conversation in week 1 of a working relationship dissolves the misunderstanding. The same misunderstanding allowed to fester through six months of assumed-bad-faith interpretations requires hours of unwinding and possibly relationship dissolution. The convex cost-curve is mediated by the accumulation of pattern-matched evidence each party builds for their interpretation."
  - "Technical debt as the modern engineering crystallization (Ward Cunningham 1992, Brooks-adjacent): the transferable claim is the same as the proverb-tradition's. Naming it 'technical debt' adds the financial-cost metaphor (interest compounds) but the structural shape is what the proverbs already named. lex-q77ce is the upstream general claim; technical-debt is a downstream domain-specific instance."
  - "Distinguished from cases where defer-IS-rational: an isolated annoyance that has no coupling to a growing system (a typo in a one-off email; a piece of paper on the floor of a room about to be repainted) does not grow with deferral. The atom applies specifically when the defect is structurally connected to a system whose interactions compound over time. The check: at 2x, 5x, 10x defect-size, is the fix cost approximately linear or convex? If linear, defer is rational; the atom does not apply."
  - "Broken-windows policing controversy (Wilson-Kelling 1982): the transferable claim was extended into urban-policing policy, generating well-known disparate-impact harms when applied without discrimination about what 'small defects' meant in social contexts. The atom-as-substrate is silent on the policing-policy application; it claims the structural cost-curve shape, not the policy. Distinct from the policy-claim that all small-violations-must-be-policed-aggressively — that policy depended on a separate (contested) assumption that all such violations are coupling to growing-disorder."
critical-questions:
  - "Is the defect actually coupled to a growing system, or is it isolated? The atom applies when deferral lets the defect propagate (more code copies, more medical accumulation, more developers learning the bad pattern, more interpersonal evidence accumulating). For isolated defects, the cost-curve is flat or even decreasing (the problem resolves on its own as circumstances change). Diagnostic: name the specific propagation channel. If you cannot name how the defect spreads, the atom may not apply."
  - "Is the cost-curve actually convex, or are you misjudging the linearity? Proverbs encode a heuristic, not a theorem — sometimes deferral really is cheap because the underlying system changes the defect's meaning (a misnamed function becomes irrelevant when its caller is deprecated; an interpersonal friction dissolves when one party leaves). Check whether the system's state at deferral-time will still make the defect costly to address. If the system itself changes the defect's status, the cost-curve may not be convex."
  - "What is the immediate cost of the fix, and is it actually low? The proverb-tradition emphasizes the cheap-now case. If the immediate fix is itself expensive (deep refactor, surgical intervention, hard conversation with attendant relationship risk), the cost asymmetry the proverb assumes may not hold. The fix should be ROUGHLY EASIER NOW THAN LATER for the atom to apply; if it's hard either way, the deferral-cost is a different consideration."
  - "Are you using 'small fix now' as cover for over-engineering or premature optimization? The atom can be misapplied as license to perfect every minor defect immediately, generating its own form of cost (developer time spent polishing already-working code, medicalization of normal variation). The check: would a calibrated observer agree that this defect, if deferred, would compound? If you cannot defend the deferral-cost case to a skeptic, the immediate fix may be over-application of the atom."
  - "Is the atom genuinely a structural claim about the system, or are you projecting a personal tolerance threshold? Some people have lower thresholds for unfixed defects and rationalize their immediate-fix preference as deferral-cost-avoidance. The atom is about the system's structure, not the observer's discomfort. Diagnostic: the deferral-cost case should be defensible to someone with a different tolerance threshold (e.g., a colleague who would happily live with the small defect)."
status: active
