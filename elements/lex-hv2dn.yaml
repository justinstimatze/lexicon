id: lex-hv2dn
name: multi-theory-indicator-rubric-for-contested-system-property
type-in: question
type-out: structure
_tier: atomic
agent-instruction: "When you need to assess whether a contested theoretical property (consciousness, intelligence, autonomy, innovativeness, resilience) is present in a complex system, and there are multiple credible theories of that property but no consensus, don't pick a single theory and don't fall back on behavioral tests. Instead: (1) Survey the credible theories of the property. (2) For each theory, derive INDICATOR PROPERTIES — computational, structural, or functional features that, if that theory is right, would be markers of the property in any implementing substrate. (3) Assess the system against the combined indicator list. (4) Aggregate credence as a function of (a) how many indicators the system satisfies, (b) the strength of empirical support for each indicator-generating theory, (c) your credence in the background assumption that lets the theory transfer to this substrate (e.g., computational functionalism for the consciousness case). The conclusion is NEVER 'X is conscious' or 'X is intelligent' as a binary verdict — it is a credence-weighted assessment naming which indicators are met and which are not, with explicit uncertainty on the underlying theories. Why this beats behavioral tests: a sufficiently powerful system can mimic the behavioral signatures of a property without instantiating the underlying functional features the property requires. Behavior is the output; the indicators are the structure. Why this beats single-theory adoption: if you commit to one theory and it is wrong, your whole assessment is wrong; the rubric distributes risk across theories. The transferable move is to OPERATIONALIZE A CONTESTED PROPERTY by deriving indicators FROM EACH THEORY rather than picking one theory or skipping to behavioral surrogates."
