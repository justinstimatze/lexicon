canonical-instances:
  - "A rigid workplace culture that punishes any joking criticism of management, however mild, doesn't produce a genuinely more stable or loyal workforce -- it removes the low-stakes channel through which employees would otherwise surface small grievances early, so dissatisfaction accumulates unaddressed until it erupts as a mass resignation or a union drive the company never saw coming."
  - "A religious institution that treats every theological question or satirical jab as a serious threat to be crushed, rather than tolerating some irreverent internal debate, finds that when a genuine crisis of belief eventually arrives, it has no internal tradition of small, survivable disagreement to draw on, and the community fractures wholesale instead of adapting."
critical-questions:
  - "Is this actually a general law, or does it hold only for certain kinds of systems and certain kinds of transgression -- are there real cases where tolerating small boundary violations genuinely does just erode order over time without producing any adaptive benefit, rather than serving as a release valve?"
  - "How would someone actually calibrate how much 'playful' transgression is the right amount, given that Hyde's argument implies more tolerance is generally better but offers no way to distinguish healthy pressure release from transgression that itself accelerates toward the very rupture it's supposed to prevent?"
  - "Does the Norse myth (Loki bound, then Ragnarok) actually support the general claim, or is Hyde using a specific mythological narrative, chosen because it fits, as evidence for a sociological claim that would need independent empirical support to hold up outside myth?"
