    quote: "'I've never seen it anywhere else in the world where people can gather to see top-tier opera, next to an Oxford philosophy professor, next to a woman who didn't even know she was an artist, spending her life cutting out butterflies and putting them all over her house. Her name is April, and she is an amazing local woman who has emerged as an artist through this process.'"
canonical-instances:
  - "The same article's broader context: Bombay Beach was a near-abandoned Salton Sea town, a former resort ruin, before filmmaker Tao Ruspoli, philanthropist Lily Johnson White, and hotelier Stefan Ashkenazy began staging the Biennale there -- the festival's declared aim is community revival through art and culture, using the town's houses and empty lots as venues alongside imported institutional-caliber performances."
  - "Hypothetical: a company's innovation showcase reserves the executive demo stage for R&D-credentialed engineers, while a self-taught intern's side project quietly automating a manual process gets no comparable platform even though people use it daily -- putting both projects on the identical stage, judged by the identical audience, is what would let the intern's work register organization-wide as real innovation rather than a nice trick."
  - "operationally distinct from lex-ncqgp (outsiders-see-what-insiders-have-stopped-seeing): that atom is about a newcomer's fresh perception surfacing something habituated insiders no longer register. This atom concerns a structural design choice instead -- deliberately removing an existing curatorial/status structure that would otherwise separate credentialed from uncredentialed work -- with no perception shifting anywhere in the mechanism."
critical-questions:
  - "removing curatorial hierarchy might transform the untrained work itself, or it might just extend borrowed legitimacy from the credentialed work sitting nearby. If it's the latter, the technique may need genuinely high-caliber work present to lend that borrowed prestige, and could fail in a purely amateur space with nothing comparable to borrow status from."
  - "the transformation is described entirely from the founders' and outside observers' perspective -- does the resident whose private hobby gets publicly re-categorized as 'art' necessarily experience this as validating, or is there a risk the framing serves the festival's own narrative more than it serves someone who may not have sought that recognition in the first place?"
