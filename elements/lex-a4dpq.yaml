lineage:
  - source: primary
    text: hyde-hermes-token-in-the-barn-is-addressed-to-himself-not-apollo
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'The First Lie,' 'A Sign of Youthful Theft,' on Hermes hanging sacrificial meat in the barn as a sêma. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "This makes some sense, but in fact Apollo never does notice the token, and when Hermes leaves it in the barn he is still wrapping himself in secrecy (in the same scene he dumps his trick shoes in the river and hides the traces of his fire). It seems more likely, then, that Hermes is presenting this sêma to himself. This is the child, after all, who makes a sacrifice in complete solitude so as to direct a crucial part of it to himself. There is a strong self-reflective strain in this Hymn; the god is making a world for himself. Like the writing we do in our journals, some tokens are addressed first and foremost to their maker."
canonical-instances:
  - "A detective assumes a criminal's oddly deliberate detail at a crime scene must be a taunt left for investigators, when it's actually the criminal's own private ritual marker, meaningful only to them, with no expectation anyone else would ever notice or decode it."
  - "A manager finds an employee's meticulously detailed private notes about a difficult project and assumes they were being kept to build a case or paper trail against someone, when the notes were actually the employee's own way of thinking through and making sense of a confusing situation, never meant to be read by anyone."
critical-questions:
  - "How could anyone other than Hermes himself ever verify that the token was self-addressed rather than a failed or premature message to Apollo -- is this distinction actually testable from outside, or only plausible as an interpretation that fits the surrounding secrecy?"
  - "If Hermes later does use the theft to provoke a confrontation with Apollo, does that retroactively suggest the token always had an eventual external audience in mind, just not an immediate one, complicating the clean self-addressed reading?"
  - "Is there a meaningful difference between a token that is unconsciously self-addressed (the maker doesn't realize they're not really communicating to anyone) versus one deliberately created with no audience, and does the diagnostic distinguish between these?"
