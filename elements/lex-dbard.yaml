id: lex-dbard
name: childhood-co-residence-not-genetic-kinship-triggers-sexual-aversion
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Recognize this pattern when a sexual or romantic aversion, avoidance-custom, or felt shame reaction between two people tracks CHILDHOOD CO-RESIDENCE OR SUSTAINED EARLY-LIFE DOMESTIC PROXIMITY rather than tracking actual genetic relatedness, and the live diagnostic question is whether the operative variable producing the aversion is 'these two people share genes' or 'these two people were raised in intimate daily contact from an early age, whatever their actual biological relationship.' Westermarck's own general theoretical statement, given at the close of his chapter on sexual modesty, states the claim directly: he attributes the widespread human tendency toward sexual shame inside the family circle to 'that aversion to sexual intercourse between parents and children, brothers and sisters, and generally persons who have grown up in the same home, which is normally felt among all races of men.' The phrase carrying the whole claim is 'generally persons who have grown up in the same home' — the aversion-mechanism is keyed to co-residence/rearing-together, stated as a category broader than, and operating independently of, the parent-child or sibling relation itself. Westermarck is explicit that this aversion is not accounted for by female coyness, prudential calculation, or moral instruction: 'Female coyness could never account for the peculiar sexual reserve between near relatives, nor do I think that it could account for the genuine shyness which characterises true modesty... in the sexual shame felt in the presence of a near relative there is nothing pleasing or exciting when displayed by a woman and nothing conventional when displayed by a man. Why? Because it is rooted not in love but in aversion.' The mechanism-claim is emphatically NOT that the aversion tracks the moral/legal category of incest — a social rule that could in principle be taught or reasoned toward; it is that a specific developmental exposure, early and sustained intimate domestic proximity, produces the aversion as a felt, automatic response whether or not actual kinship is present, and that any codified prohibition is a secondary rationalization of an aversion that already exists spontaneously, not its cause. Westermarck's own worked demonstration that the mechanism can be FOOLED — that it tracks the co-residence proxy even when the proxy and the target variable (genetic relatedness) come apart — is the ethnographic case he cites from the Northern New Hebrides via Dr. Codrington: 'A girl betrothed in childhood is taken to her father-in-law's house and brought up there; the boy often thinks she is his sister, and is much ashamed when he comes to know the relation in which he stands.' The girl is NOT the boy's genetic sister — she is his unrelated child-bride, betrothed to him and raised in his father's household from early childhood. Because she was reared alongside him under conditions functionally identical to an actual sibling's, the aversion mechanism fires exactly as if she were his sister: he does not merely fail to desire her, he experiences retrospective SHAME on learning the actual (marital, not sibling) relation he stands in to her — the diagnostic sign that a real, felt aversion had already been generated by the proxy cue alone, prior to and independent of any knowledge of the true genetic relationship. Westermarck marshals a wide array of corroborating avoidance-customs and reads them as surface expressions of the same underlying mechanism rather than independently-invented etiquette: 'The custom of avoidance between a man and members of his wife's family I thus take to be ultimately based on the sexual bashfulness felt inside the domestic circle... It seems only natural that where this aversion is so exceedingly strong as it is among peoples at the lower stages of culture, a man should feel sexual shame in the presence of persons of his wife's family, who would not only at once come to think of his relations to their daughter or sister but feel aversion to the very idea of those relations.' He cites Dr. Jochelson on the Yukaghir to the same effect: 'the sense of shame prevailing in a high degree among near relatives undoubtedly helped to prevent sexual intercourse among them.' The mechanism-shape being claimed, stated generally: a psychological system that needs to track a hard-to-directly-perceive variable (actual genetic relatedness, which has no direct sensory signature) instead tracks a PROXY CUE that was reliable enough in the small-scale, co-resident kin-groups of the ancestral/traditional environment — if you were raised in intimate daily contact with someone from early childhood, they were, in the overwhelming majority of actual cases, your close genetic relative — and because the mechanism is keyed to the proxy, not the target, it can be and demonstrably is fooled whenever the proxy and the target variable come apart, exactly as the New Hebrides betrothal case shows (proxy present, genetic target absent, aversion still fires). Later research treated this exact childhood-co-residence mechanism as an empirically testable natural experiment rather than a historical curiosity: Israeli kibbutz cohorts raised communally from infancy alongside unrelated agemates, and Taiwanese 'minor marriage'/sim-pua households where an unrelated future bride is adopted in infancy and raised alongside her intended husband, are the two best-known modern lines of inquiry that pursued Westermarck's own claim empirically, and both converge on the same direction of effect he first documented ethnographically: co-reared, unrelated pairs show markedly reduced mutual sexual attraction and markedly elevated marital difficulty relative to pairs lacking that shared early-childhood proximity window — the shame-not-desire pattern of Westermarck's own Melanesian case, recurring in a modern, differently-documented setting. DISTINCT from lex-5dnd9 (Hamilton, inclusive-fitness-extends-selection-through-relatives-weighted-by-relatedness): lex-5dnd9 grounds the claim about WHY kin-directed altruism, or by direct extension kin-directed sexual avoidance, would be favored by selection GIVEN an accurate assessment of the coefficient of relatedness r, and explicitly flags, as one of its own three practitioner questions, whether 'the relatedness assessment by the actor's mechanism (kin-recognition cues, co-residence proximity, phenotypic matching) [is] reliable enough to track r.' This atom answers exactly that flagged question for the human incest-aversion case: yes, but imperfectly, and Westermarck's own ethnographic material is the demonstration of the imperfection. lex-5dnd9 is the general evolutionary-logic layer (why tracking r would be selected for); this atom is the specific, primary-source-grounded MECHANISM layer (what cue actually gets tracked, and the concrete case proving it is the cue and not the underlying variable itself that gets tracked). Distinct from lex-kh8gf (mesa-optimization, evolution-as-base-optimizer-humans-as-mesa): lex-kh8gf states the fully general, cross-domain abstract principle that any base optimizer (evolution, gradient descent, an outer selection process of any kind) can produce a mesa-optimizer/mechanism whose objective merely CORRELATED with the base objective in the training/ancestral distribution and diverges from it off-distribution — its own worked example is generic (status, pleasure, contraception) and it is not grounded in Westermarck or in the incest-aversion case specifically. This atom is the concrete, richly-documented, primary-source-grounded biological/psychological INSTANCE of exactly that abstract pattern: childhood co-residence is the proxy/mesa-cue the aversion-mechanism actually tracks; genetic relatedness/inbreeding-avoidance is the base objective it was selected to serve; the Northern New Hebrides case is the off-distribution divergence (proxy present, base-objective-relevant variable absent) that proves the mechanism tracks the proxy rather than directly sensing the underlying variable. Use lex-kh8gf for the fully general statement of the base/mesa divergence pattern in any domain (ML training, cultural selection, institutional design); use THIS atom when the concrete case is specifically the Westermarck incest-aversion mechanism, or when illustrating the general pattern with its single best-documented biological worked example. Distinct from lex-akgce (Levi-Strauss, exchange-forced-by-prohibition-on-self-pairing-is-the-social-structure): lex-akgce explains incest prohibition at the STRUCTURAL/FUNCTIONAL level — the prohibition against keeping mates 'to yourself' is what forces the cross-group marriage-exchange flow that constitutes kinship structure as a social system — and is explicitly agnostic about the underlying psychological mechanism ('The atom is silent on whether kinship is real or constructed'). This atom operates at the PSYCHOLOGICAL-MECHANISM level Levi-Strauss's structuralist account brackets entirely: it claims a specific, individually-felt, childhood-proximity-triggered aversion is the actual proximate cause of incest-avoidant behavior, prior to and independent of any social rule, moral teaching, or exchange-structure explanation — Westermarck's own polemical target throughout this material is theories (later including Freud's) that treat incest-avoidance as requiring an externally imposed prohibition BECAUSE desire toward kin is naturally present; Westermarck's counter-claim is that any explicit prohibition is a secondary codification of an aversion that already exists spontaneously in most people sharing the co-residence history, not the cause of the aversion. The two atoms operate at different explanatory altitudes (individual psychological mechanism vs macro-social exchange-structure) and compose rather than compete: this atom explains why a given individual doesn't want to; lex-akgce explains why the resulting non-mating gets structurally channeled into a system of exchange between groups. Use this atom when: (i) an aversion or avoidance behavior between two unrelated people who were raised together is being observed and the question is whether the operative variable is shared genes or shared childhood proximity; (ii) someone attributes incest-avoidance to moral teaching, taboo-internalization, or conscious risk-calculation, and the more parsimonious explanation is a felt aversion that predates and does not depend on any taught rule; (iii) a kin-recognition, familiarity, or proximity-based heuristic is suspected of tracking a proxy rather than the variable it evolved to serve, and a concrete, well-documented worked case is needed. Failure modes: (a) COLLAPSING THE MECHANISM INTO THE MORAL RULE — treating the felt aversion and the explicit incest prohibition as the same thing, when Westermarck's claim is specifically that the felt aversion is prior to and causally independent of any codified rule; (b) ASSUMING THE PROXY AND TARGET ALWAYS COINCIDE — inferring actual genetic relatedness from reported avoidance/aversion, or inferring absence of aversion proves absence of relatedness, when the entire point of the mechanism-shape is that co-residence and genetic relatedness can and do come apart; (c) USING THIS ATOM WHERE THE QUESTION IS THE GENERAL EVOLUTIONARY-LOGIC LAYER WITHOUT THE SPECIFIC MECHANISM CONTENT (reach for lex-5dnd9), THE FULLY ABSTRACT BASE/MESA-OBJECTIVE PATTERN ACROSS ANY DOMAIN (reach for lex-kh8gf), OR THE STRUCTURAL/FUNCTIONAL ROLE OF THE RESULTING PROHIBITION IN GENERATING EXCHANGE SYSTEMS (reach for lex-akgce)."
