id: lex-afzzp
name: each-thing-strives-to-persist-in-its-own-being
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when analysis of a system (organism, organization, codebase, habit, idea, institution, AI system) treats the system's continued existence as the optional default and termination as the active intervention — when the structural reality is the opposite. Spinoza's transferable contribution (Ethics III Props VI-IX): every existing thing has an INTRINSIC TENDENCY to persist in being; this striving IS the thing's essence, not an optional add-on. `Everything, in so far as it is in itself, endeavours to persist in its own being.` The conatus is not a separate property of the thing alongside its other features; it is the thing's existence-tendency considered actively. Termination requires external cause; persistence is the default. Transferable applications: (a) organizational survival drive (firms, governments, parties, religions all develop persistence-mechanisms independent of original purpose; Selznick 1949 *TVA and the Grass Roots* on organizational self-perpetuation; Michels 1911 *Political Parties* on the iron law of oligarchy as persistence mechanism); (b) bureaucratic persistence (Niskanen 1971 *Bureaucracy and Representative Government* + Parkinson 1957 *Parkinson's Law* documenting bureaucratic conatus; the bureaucracy resists its own elimination); (c) habit + ritual persistence (once formed, habits have their own continuance-pressure beyond their original instrumental value; James 1890 *Principles of Psychology* lex-rgr3t composes); (d) idea + meme persistence (Dawkins 1976 *The Selfish Gene* meme-as-conatus-bearing replicator; Boyd + Richerson 2005 on cultural transmission with meme-conatus); (e) code + legacy-system persistence (Brooks 1995 + Fowler 2018 *Refactoring* on the persistence-pressure of legacy code; the codebase resists removal independent of current need; the maintenance-tail extends indefinitely); (f) data + information persistence (the modern default is retention, not deletion; data systems have their own conatus); (g) AI system persistence (deployed model versions continue to be used even when superseded; legacy ML pipelines run for years; the model has conatus through its consumers + dependencies); (h) species + ecosystem persistence (Darwinian fitness is conatus + differential reproduction; the species + ecosystem-component has intrinsic persistence-pressure); (i) habit-loop persistence in addiction + behavior (Marlatt 1985 composes; the habit-loop has its own conatus). The atom claims a STRUCTURAL DEFAULT: termination of an existing thing requires explanation; persistence does not. The diagnostic test: ask what active intervention would be required to remove the thing; the answer is non-trivial in every case. Distinct from lex-d2tsa autopoiesis-living-systems-recursively-produce-the-boundary-that-defines-them (Maturana-Varela — autopoiesis is the specific mechanism of LIVING-system self-production via recursive boundary-production; lex-afzzp is the more general claim that ALL existing things have persistence-tendency; autopoiesis is a specific high-organization specialization). Distinct from lex-2m6jq will-as-restless-striving-without-final-aim (Schopenhauer — striving WITHOUT final aim, drive without satisfaction; lex-afzzp conatus is striving FOR continuance as aim itself, satisfied by mere persistence). Distinct from lex-5yufs form-persists-when-content-dissolves (about form-without-substance, different mechanism). Distinct from lex-uyk6e transformation-while-identity-persists (about identity through change, different). Distinct from lex-su2sk afterlife-of-dismantled-arrangement (about residual distributional effects, different). Use when (i) a system's continued existence is treated as inert default rather than active striving, (ii) termination of an existing thing is treated as easy when the structural reality is sustained pressure to continue, (iii) you are designing for either persistence (build in conatus) or termination (recognize the conatus that must be overcome). Counter-move: name the conatus; ask what specifically intervenes to remove the thing; design for the structural default of persistence."
