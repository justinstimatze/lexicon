lineage:
  - source: primary
    text: wood-2002-the-origin-of-capitalism
    citation: "Ellen Meiksins Wood, *The Origin of Capitalism: A Longer View* (London: Verso, 2002), Part I, Ch.1 'The Commercialization Model and Its Legacy' and Ch.2 'Marxist Debates,' section 'Marx on the Transition.' Wood, a Marxist historian and political theorist, argues across the book that the standard 'commercialization model' of capitalism's origin (traced to Adam Smith and recurring in demographic, world-systems, and much Marxist historiography alike) mistakes a quantitative expansion of trade and accumulated wealth for capitalism's actual origin, and recovers Marx's own critique of 'the so-called primitive accumulation' in Capital Vol. I as the decisive alternative: capital is a specific social relation, not simply wealth, and what produced capitalism was a transformation of social property relations — worked out concretely in the English countryside — that generated new, historically unprecedented capitalist 'laws of motion.'"
    quote: "[Ch.1, the commercialization model's own quantity-based self-understanding:] 'The origin of capitalism or \"commercial society\", then, does not in this model represent a major social transformation so much as a quantitative increment. Commerce becomes more widespread and encompasses ever more commodities. It also brings with it ever more wealth — and here, in classical political economy, we encounter the notion that commerce and the economic rationality that it engenders — the prudence and frugality of rational economic actors engaged in commercial transactions — encourages the accumulation of sufficient wealth to permit investment. This \"previous\" or \"primitive\" accumulation, when it reaches a critical mass, brings commercialization to fruition in a mature \"commercial society\". This notion, \"the so-called primitive accumulation\", would, as we shall see, become the focal point of a major shift in explaining the origin of capitalism, when Marx subjected it to critical scrutiny in Volume I of Capital.' [Ch.1, on the commercialization model's blindness to capitalism-specific compulsion:] 'the commercialization model made no acknowledgement of imperatives specific to capitalism, of the specific ways in which the market operates in capitalism, of its specific laws of motion that uniquely compel people to enter the market, to reinvest surpluses and to produce \"efficiently\" by improving labour productivity — the laws of competition, profit-maximization, and capital accumulation. It follows that adherents of this model saw no need to explain the specific social property relations and the specific mode of exploitation that determine these specific laws of motion.' [Ch.1, the anti-Eurocentric critique sharing the same premise:] 'The remarkable thing about anti-Eurocentric critiques is that they start from the same premises as do the standard Eurocentric explanations, the same commercialization model and the same conception of primitive accumulation. Traders or merchants anywhere and everywhere are potential, if not actual, capitalists, and the more active, wide-ranging, and wealthy they are, the further they are along the road of capitalist development. In that sense, many parts of Asia, Africa, and the Americas were well on their way to capitalism before European imperialism, in one way or another, blocked their path.' [Ch.1, closing paragraph naming Marx's decisive break, and the anti-Eurocentric inversion of the same premise:] 'a decisive break from the classic model came with Marx's critique of political economy and its notion of \"primitive accumulation\", his definition of capital not simply as wealth or profit but also as a social relation, and his emphasis on the transformation of social property relations as the real \"primitive accumulation\". Yet critics of Eurocentric history have more or less returned to the old notion. Even at the point where they diverge most emphatically from the classic Eurocentric histories, in their emphasis on European imperialism as the chief impediment to non-European development, they simply invert an old Eurocentric principle: in the old accounts, Europe surpassed all other civilizations by removing obstacles to the natural development of \"commercial society\"; in the anti-Eurocentric inversion, the failure of non-Europeans to complete the process of development, despite the fact that they had already come so far, was caused by obstacles created by Western imperialism.' [Ch.2, 'Marx on the Transition,' the classical-political-economy version of primitive accumulation as mere wealth-collection:] 'the classic commercialization model, first laid out systematically by Adam Smith, suggests that the prelude to \"commercial society\" was a process of prior accumulation in which wealth was amassed by means of commercial acumen and frugality, eventually reaching a point at which it was sufficient to permit substantial investment. This process represents the \"primitive\" accumulation of \"capital\" — which simply means the collection of material wealth. Variations on this theme have continued to appear even in contemporary explanations of capitalist development, for instance in those accounts that explain the origin of capitalism as a result of \"capital\" accumulation by means of colonial exploitation and unequal exchange.' [Ch.2, Marx's decisive break — the significance of \"so-called\":] 'Marx, in his critique of \"the so-called primitive accumulation\", diverged sharply from classical political economy and its commercialization model. The general principles spelled out in his critique of political economy — in particular, his insistence that wealth by itself is not \"capital\", and that capital was a specific social relation — are here applied to the transition from feudalism to capitalism. It follows from these principles that the mere accumulation of wealth was not the decisive factor in the origin of capitalism. The \"primitive accumulation\" of classical political economy is \"so-called\" because capital, as Marx defines it, is a social relation and not just any kind of wealth or profit, and accumulation as such is not what brings about capitalism. While the accumulation of wealth was obviously a necessary condition of capitalism, it was far from being sufficient or decisive. What transformed wealth into capital was a transformation of social property relations.' [Ch.2, the exhaustive negative claim closing off every quantity-based candidate cause:] 'The essence of Marx's critique of \"the so-called primitive accumulation\" (and people too often miss the significance of the phrase \"so-called\") is that no amount of accumulation, whether from outright theft, from imperialism, from commercial profit, or even from the exploitation of labour for commercial profit, by itself constitutes capital, nor will it produce capitalism. The specific precondition of capitalism is a transformation of social property relations that generates capitalist \"laws of motion\": the imperatives of competition and profit-maximization, a compulsion to reinvest surpluses, and a systematic and relentless need to improve labour-productivity and develop the forces of production.' [Ch.2, the specific historical content of the relational transformation:] 'The critical transformation of social property relations, in Marx's account, took place in the English countryside, with the expropriation of direct producers. In the new agrarian relations, landlords increasingly derived rents from the commercial profits of capitalist tenants, while many small producers were dispossessed and became wage labourers. Marx regards this rural transformation as the real \"primitive accumulation\" not because it created a critical mass of wealth but because these social property relations generated new economic imperatives, especially the compulsions of competition, a systematic need to develop the productive forces, leading to new laws of motion such as the world had never seen before.'"
  - source: discovery-loop
    text: distinctness-audit-wood-relational-transformation-not-accumulation
    citation: "Lex-0840 (Harvey, dispossession-based-accumulation-is-ongoing-not-a-one-time-founding-stage) is a genuinely distinct axis: Harvey's claim concerns timing and scope — whether dispossession-based accumulation is a closed founding-era stage or a permanently available, recurringly-reactivated strategy once capitalism already exists — and presupposes that dispossession-based wealth-transfer is a real and effective accumulation mechanism. Wood's claim is upstream of and conceptually prior to Harvey's: it concerns what counts as an adequate causal explanation for capitalism's origin in the first place, and holds that mere accumulation by any means — dispossession explicitly included — is not sufficient without an accompanying transformation of social property relations generating new systemic compulsions ('laws of motion'). The two atoms are compatible and can be read as sequential stages of a single historical account (Wood's relational transformation first produces capitalism; Harvey's dispossession-based accumulation then recurs as a standing strategy within it), but they answer different questions and are not restatements of one another. Lex-0457 (Marx, removing-non-market-exits-makes-market-dependence-structural, grounded in Marx's Capital Vol. I Part VIII) is distinct but tightly composable: lex-ewjec names the mechanism content of the relational transformation (removing non-market subsistence alternatives forces structural market-dependence), while this atom names the methodological claim about why that kind of transformation, rather than mere accumulated quantity of wealth by any means, constitutes an adequate origin-explanation for a systemic transformation like capitalism. Lex-0457 does not itself argue against the rival, quantity-based 'commercialization model' explanation; this atom supplies that argument, with lex-ewjec's mechanism serving as Wood's own worked historical example of what the relational transformation concretely consisted of."
canonical-instances:
  - "Adam Smith's own account, per Wood's reconstruction of the commercialization model: commerce and 'the prudence and frugality of rational economic actors' generates 'previous' or 'primitive' accumulation that, once it 'reaches a critical mass, brings commercialization to fruition in a mature \"commercial society\"' — the paradigm case of the quantity-based explanation this atom flags: capitalism as a QUANTITATIVE INCREMENT of ordinary commercial wealth rather than a qualitative, relational break."
  - "Wood's own positive historical account, following Marx: 'landlords increasingly derived rents from the commercial profits of capitalist tenants, while many small producers were dispossessed and became wage labourers' in the English countryside — the specific relational transformation that, unlike any prior accumulation of wealth by trade, theft, or exploitation elsewhere, generated genuinely new capitalist 'laws of motion.'"
  - "The anti-Eurocentric-critique case, showing the same quantity-based premise recurring under an inverted political valence: critics who blame European imperialism for blocking non-European capitalist development implicitly assume, per Wood, that 'traders or merchants anywhere and everywhere are potential, if not actual, capitalists, and the more active, wide-ranging, and wealthy they are, the further they are along the road of capitalist development' — sharing the commercialization model's premise while inverting only who gets blamed for the (assumed) arrested development."
  - "The left-imperialism account of capitalism's origin Wood cites as a modern variant of the same error: 'those accounts that explain the origin of capitalism as a result of \"capital\" accumulation by means of colonial exploitation and unequal exchange' — treating plundered colonial wealth as itself sufficient to explain capitalism's rise, without asking whether that wealth was ever converted into capital by a relational transformation, as opposed to merely accumulated as wealth."
  - "A modern cross-domain analogue extending, not quoting, Wood's argument: a technology platform's or startup's dominance attributed simply to 'they raised enough capital' or 'they reached enough scale,' when the operative question, per this atom, is whether a genuine structural change occurred (a real lock-in mechanism, a switching-cost regime, a data or network flywheel generating new compulsory competitive dynamics) that a mere pile of capital or users does not, by itself, produce."
critical-questions:
  - "Is a systemic transformation being explained by appeal to accumulated QUANTITY reaching some threshold ('critical mass'), or has someone actually named the specific TRANSFORMATION OF UNDERLYING RELATIONS that generated new, self-sustaining, structurally compulsory incentives?"
  - "Per Wood's complaint that 'people too often miss the significance of the phrase \"so-called\"' — is a source's own hedge, scare-quote, or qualifier around a causal term being read as decorative, when it may be flagging exactly this quantity-versus-relation distinction?"
  - "Do two rival explanations that assign credit or blame in opposite political directions (e.g., a Eurocentric account and its anti-Eurocentric critique) nonetheless share the identical, quantity-based premise about what explains the underlying transformation, differing only in which side they blame or credit?"
  - "Can the specific new compulsory incentive structures ('laws of motion') supposedly generated by the alleged relational transformation actually be named and shown to be genuinely new — or is 'transformation' being asserted as a label without content, which would itself fail this atom's own standard?"
  - "Is the live question here the EXPLANATORY-ADEQUACY question this atom addresses (does mere accumulation, by whatever means, explain the origin of a system?), the MECHANISM-CONTENT question (lex-ewjec: what specific relational change is doing the work?), or the TIMING/RECURRENCE question (lex-ma3zd: is that mechanism a one-time founding stage or an ongoing, recurringly-activated strategy?)? These are adjacent but distinct questions with different atoms."
