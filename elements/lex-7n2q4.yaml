    quote: 'Students who were able to carry out their work with the least strain, both confidently and without undue affective involvement, also have the fewest preferences. Those who lacked both confidence and the ability to remain detached have the largest number of preferences. They are, it would appear, the least able to work easily with all types of patients.'
canonical-instances:
  - "A support team finds its most burned-out agents are not simply those with the least product knowledge, nor simply those with the least patience for hostile callers, but specifically the agents scoring low on BOTH — a confident-but-thin-skinned agent and a patient-but-undertrained agent each cope adequately; only the agent lacking both product mastery and emotional buffer develops the sharpest aversion to the hardest calls."
  - "A hospital finds that residents who both doubt their diagnostic skill on complex cases AND struggle to stay composed with an anxious patient are dramatically more likely to request case reassignment than residents matching either problem alone — a program offering only clinical-skills remediation or only communication coaching underperforms for exactly this highest-risk group."
critical-questions:
  - "Is 'reinforce each other' in Martin's own text describing a genuine statistical interaction (an effect beyond the sum of the two main effects) or simply the additive combination of two independently-acting deficits presented rhetorically as reinforcement? The essay reports the four-group means (Figure 12) but does not run or report a formal interaction test, so the stronger 'more than additive' reading is not fully established by the data as presented."
  - "Confidence and detachment are both measured via self-report at the same point in time as the preference outcome; could a third, prior disposition — general dispositional negativity, or simply how difficult a caseload the student happened to be assigned — generate all three correlated measures independently, making the apparent reinforcement an artifact of a shared unmeasured cause rather than a real interaction between two distinct psychological states?"
