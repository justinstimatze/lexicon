id: lex-hzs2k
name: staged-hardship-performed-for-an-audience-with-power-to-reward-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Visible hardship staged specifically for an arriving audience with power to grant favor functions as a credential-signaling display, whether or not it also reflects the practice it claims to demonstrate. In the Jataka's tale of Setaketu, the ascetic choreographs his fellow renunciants into a menu of impressive austerities purely to impress a visiting king and win his patronage: 'now by once conciliating kings a man may live happily all the years of his life, so now some of you do the swinging penance, some lie on thorn-beds, some endure the five fires, some practise the mortification by squatting, some the act of diving, some repeat texts.'"
related: []
evokes: [jataka, chanipata, setaketu-jataka, staged-hardship-for-a-patron, credential-signal-not-substance]
lineage:
  - source: primary
    text: jataka-chalmers1895-setaketu-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VI (Chanipata), No. 377, Setaketu-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "now by once conciliating kings a man may live happily all the years of his life, so now some of you do the swinging penance, some lie on thorn-beds, some endure the five fires, some practise the mortification by squatting, some the act of diving, some repeat texts,"
canonical-instances:
  - "A department stages a visible all-hands 'crunch week' the day before an executive site visit, timing the display of effort to exactly when it will be seen and rewarded rather than to when the actual deadline pressure exists."
critical-questions:
  - "A display can be genuinely difficult and still be strategically timed — does staging it for a specific audience drain any of that difficulty of its worth?"
  - "How would the visiting patron tell a staged display from an ordinary day of the same practice, given that both would look identical from outside?"
status: active
