evokes: [one-dollar-one-vote, willingness-to-pay-equals-preference-times-ability-to-pay, efficient-only-relative-to-existing-distribution, second-fundamental-welfare-theorem, quadratic-voting-as-decoupling-fix, the-rich-mans-preferences-count-more, pricing-doesnt-aggregate-it-weights]
lineage:
  - source: primary
    text: posner-weyl-2018-radical-markets-ch-2-radical-democracy
    citation: "Eric A. Posner and E. Glen Weyl, *Radical Markets: Uprooting Capitalism and Democracy for a Just Society* (Princeton University Press 2018). Posner (University of Chicago Law School) and Weyl (then Microsoft Research economist; co-founder of RadicalxChange) construct a transferable critique of standard-market aggregation: when prices aggregate willingness-to-pay (preference × ability-to-pay), wealth-distribution operationally determines whose preferences count. The book's analytical contribution is to make the dollar-weighting failure-mode legible at the mechanism level, then propose Quadratic Voting (QV) and Common-Ownership Self-Assessed Tax (COST) as decoupling-fixes that allow preference-intensity to register without ability-to-pay weighting. Chapter 2 ('Radical Democracy') establishes QV's mathematical structure: the cost of N votes is N² voice-credits, so the marginal cost of additional votes increases linearly with votes-already-cast. The structural-result: voters with intense preferences are not free to dominate (the marginal cost grows fast); voters with weak preferences are still incentivized to participate (the first-vote cost is low). The QV-as-decoupling-fix demonstrates that the dollar-weighting failure-mode is contingent on the specific aggregation-mechanism, not on aggregation-as-such. The transferable claim: any aggregation mechanism that aggregates over preference × ability-to-pay (markets at large; vote-buying systems; campaign-finance regimes; willingness-to-pay-based regulatory cost-benefit analysis) inherits the dollar-weighting failure-mode; only aggregation-mechanisms specifically designed to decouple preference-intensity from ability-to-pay can avoid it."
    quote: "[Posner-Weyl 2018, on the dollar-weighting failure-mode in standard pricing:] 'Recall that the problem with a standard pricing model of public goods, where influence is based on a one-to-one relationship with how much you pay, is that those who care most about an issue want to buy all the votes, while those who care only a little buy none. The problem is that votes are too cheap for those who care a lot, but too expensive for those who care little.' [On QV as the decoupling-fix:] 'The way to solve this is to make the next vote more expensive to those who have already bought many votes than it is to those buying their first vote. This can induce those who care little to at least buy a few votes and restrain those who care a lot from buying too many. This is precisely what QV does... One vote costs one voice credit' [the price glyphs are dropped here:] '4 buys you 2 votes (the square root of four)' [and 9 buys 3, the price of the nth vote being n squared] [On QV's structural properties:] 'QV achieves a perfect balance between the free-rider and the tyranny of the majority problems. If the cost of voting increased more steeply, say, as the fourth power of votes cast, those with strong preferences would vote too little and we would revert to a partial tyranny of the majority. If the cost of voting increased more slowly, those with intense preferences would have too much say, as a partial free-rider problem would prevail.' [On QV as superior to pricing for preference-aggregation:] 'Crucially, QV gives weight both to numbers and to the intensity of interests. A large group of people with weak preferences might outvote a very small group of people with intense preferences but not a somewhat larger group of people with intense preferences.' [On the monetized-QV variant that re-introduces wealth-effects:] 'For example, imagine that a town holds a vote on whether to build a public park. People could pay $1 to cast one vote for or against, $4 to cast two votes, $1 million to cast 1,000 votes, and so on. The money that is collected is added to the pool used for funding the social dividend.' [The contrast makes the transferable mechanism clear: standard market pricing aggregates over $-weighted intensity (a $1M-bid registers as 1,000× a $1-bid); QV with voice-credits eliminates the $-weighting (everyone receives the same voice-credit budget); monetized-QV partially re-introduces $-weighting but with redistribution. The dollar-weighting is the transferable mechanism being critiqued; QV is one specific decoupling-fix that demonstrates the mechanism is not aggregation-necessary.] [Practitioner-extraction: Posner-Weyl's analytical move is to make the dollar-weighting failure-mode legible at the aggregation-mechanism level. The standard market is one instance of an aggregation-mechanism that weights preferences by ability-to-pay; other instances include willingness-to-pay-based regulatory cost-benefit analysis, willingness-to-pay-based contingent valuation in environmental economics, willingness-to-pay-based market-research in product-development, and campaign-finance regimes. The transferable claim: all these mechanisms inherit the dollar-weighting failure-mode unless explicit decoupling is designed in. The second fundamental welfare theorem (Arrow-Debreu) is the welfare-economics formal-recognition: a competitive equilibrium is Pareto-efficient RELATIVE TO the existing wealth distribution; changing the wealth distribution changes which Pareto-efficient point is achieved. The dollar-weighting mechanism IS the welfare-theorem's hidden assumption that markets cannot themselves correct.]"
  - source: practitioner
    text: cross-domain-attestation-dollar-weighting-mechanism
    citation: "Cross-domain attestation of the lex-4nunt dollar-weighting mechanism across multiple aggregation-context sites. (a) **Arrow-Debreu second fundamental welfare theorem** (Arrow-Debreu 1954; Mas-Colell-Whinston-Green 1995 *Microeconomic Theory*): the formal welfare-economics articulation that a competitive equilibrium is Pareto-efficient RELATIVE TO the existing wealth distribution; the efficiency-claim does not extend across wealth-redistributions. This is the formal-mathematical version of the dollar-weighting recognition; standard-economic-theory acknowledges the mechanism but treats it as separable from the efficiency claim. Posner-Weyl's contribution is to dispute the separability claim. (b) **Sen 1970 *Collective Choice and Social Welfare* Pareto-liberalism impossibility** (Sen 1970; Hammond 1976): the formal impossibility result that no aggregation mechanism can simultaneously satisfy minimal-liberalism + Pareto-efficiency + unrestricted-domain. The result documents that aggregation-mechanism-design has structural-impossibilities; the dollar-weighting failure-mode is one instance of the broader impossibility-landscape. (c) **Environmental contingent-valuation methodology critique** (Diamond-Hausman 1994 *J Econ Perspectives*; Hanemann 1994 same issue): willingness-to-pay-based contingent valuation in environmental economics (asking individuals how much they would pay to preserve a wilderness area) systematically weights wealthy-respondents' preferences over poor-respondents'; the resulting valuations encode wealth-distribution rather than aggregate-preference-intensity. The methodology-debate documents the dollar-weighting failure-mode in regulatory-decision-making practice. (d) **Campaign finance regimes** (Buckley v. Valeo 1976 SCOTUS; Citizens United 2010 SCOTUS; Lessig 2011 *Republic, Lost*): campaign-finance permits influence-aggregation via $-bids; the resulting political-system encodes wealth-distribution into the legislative-and-electoral-decision space. The transferable mechanism is operative at the political-process scale; the post-Citizens-United regulatory landscape documents the failure-mode at its largest contemporary manifestation. (e) **Willingness-to-pay-based market-research methodology** (Kahneman-Knetsch 1992 *J Econ Perspectives* on the endowment-effect critique; Kahneman-Krueger 2006 *J Econ Perspectives*): WTP-based market-research systematically over-weights wealthy-respondent preferences; the methodology debate documents the dollar-weighting failure-mode in product-development practice. (f) **Behavioral-economics critique of revealed-preference assumption** (Sugden 2018 *The Community of Advantage*; the broader Akerlof-Shiller-Thaler tradition): the assumption that revealed-preference (what people pay for) accurately captures normative-preference (what they would want under reflective deliberation) is structurally challenged; the gap between revealed and normative is partially the dollar-weighting failure-mode operating at the individual-cognition scale."
canonical-instances:
  - "the **standard market price-aggregation as $-weighted preference-aggregation** (Posner-Weyl 2018 Ch.2; Arrow-Debreu 1954): price aggregates willingness-to-pay = preference × ability-to-pay; the resulting allocation reflects ability-to-pay-weighted preferences. The 'efficiency' of the resulting equilibrium is only valid relative to the existing wealth-distribution; the second welfare theorem makes this formally explicit but standard-policy-discourse rarely foregrounds it."
  - "the **environmental contingent-valuation methodology** (Diamond-Hausman 1994; Hanemann 1994): asking individuals their willingness-to-pay to preserve wilderness areas systematically weights wealthy-respondents' preferences over poor-respondents'. The resulting valuations encode wealth-distribution rather than aggregate-preference-intensity for environmental goods. The methodology-debate documents the lex-4nunt failure-mode in environmental regulatory-decision-making practice."
  - "the **post-Citizens-United campaign-finance regime** (Buckley v. Valeo 1976; Citizens United 2010; Lessig 2011 *Republic, Lost*): campaign-finance permits influence-aggregation via $-bids on candidate-and-issue-advocacy; the resulting political-system encodes wealth-distribution into the legislative-and-electoral-decision space. The Citizens United doctrine that 'money is speech' formally codifies the dollar-weighting mechanism into U.S. political-aggregation. Lex-0469 operating at the political-process scale."
  - "the **willingness-to-pay-based market-research methodology** (Kahneman-Knetsch 1992; Kahneman-Krueger 2006): WTP-based market-research systematically over-weights wealthy-respondent preferences; the resulting product-development decisions encode wealth-distribution rather than aggregate-preference-intensity. The methodology-debate documents the dollar-weighting failure-mode in product-development practice."
  - "the **Quadratic Voting as decoupling-fix** (Posner-Weyl 2018 Ch.2): explicit aggregation-mechanism-redesign that allocates equal voice-credit budgets and aggregates via square-root function. The structural-result: voters with intense preferences cannot dominate (marginal cost grows fast); voters with weak preferences are incentivized to participate (first-vote cost is low). The QV-as-decoupling demonstrates the transferable claim: dollar-weighting is contingent on the aggregation-mechanism, not inherent to aggregation-as-such."
  - "the **Quadratic Funding extension to public-good financing** (Buterin-Hitzig-Weyl 2019 *American Economic Review: Papers and Proceedings*): QV-style aggregation extended to financing of public goods. Each contributor's contribution is matched with public-funds in proportion to the square of the contribution-distribution; the resulting allocation gives proportionally more public-funding to public-goods that have broad-shallow support over public-goods that have narrow-deep wealthy-supporter support. The transferable decoupling-mechanism at the public-goods-funding scale."
  - "the **second fundamental welfare theorem formal recognition** (Arrow-Debreu 1954; Mas-Colell-Whinston-Green 1995): the formal welfare-economics articulation that competitive equilibrium is Pareto-efficient RELATIVE TO the existing wealth distribution. This is the formal-mathematical version of the dollar-weighting recognition; standard-economic-theory acknowledges the mechanism but historically treats it as separable from the efficiency claim. Posner-Weyl's contribution disputes the separability."
  - "operationally distinct from lex-srj3h harm-principle-self-protection-as-sole-warrant-for-coercion: lex-srj3h is about WHEN coercion is morally permissible (Mill's individual-liberty framework). lex-4nunt is about WHO operationally counts in market-aggregation-of-preference. The two atoms operate at different normative-and-operational levels. Compositional: lex-srj3h supplies the moral framework that critiques institutional coercion; lex-4nunt supplies the aggregation-mechanism-level analysis that shows how 'voluntary' market exchange operationally encodes inequality."
  - "operationally distinct from lex-cmkdq (need to check existing): if lex-cmkdq is about consent-and-coercion-in-economic-exchange, lex-4nunt is about the aggregation-level failure-mode that makes consent-language obscure the wealth-distribution-encoding."
  - "compositional with lex-b9us2 legibility-via-standardization-erases-what-doesnt-fit-and-reshapes-reality-to-match (Scott): lex-b9us2 supplies the substrate-mechanism by which heterogeneous-local-practice is converted to administrable-uniform-schema; lex-4nunt supplies the aggregation-mechanism that operates ON the standardized inputs. Together: standardization makes preferences priceable; pricing aggregates them by ability-to-pay; the resulting allocation encodes wealth-distribution into administrative-decision."
  - "compositional with lex-ewjec removing-non-market-exits-makes-market-dependence-structural: lex-ewjec supplies the structural conditions that make market-aggregation operationally sole; lex-4nunt supplies the aggregation-mechanism-level failure-mode that makes the market-aggregation encode existing inequality. The triple (lex-b9us2/lex-ewjec/lex-4nunt) describes the dynamic by which standardization + enclosure + dollar-weighting collectively produce market-society as the operationally-sole-allocation-mechanism."
  - "compositional with lex-ak2nb plural-allocation-toolkit-needs-active-defense-against-standardization: lex-ak2nb names the political-and-institutional counterforce to the market-aggregation-monopoly that lex-ewjec describes. lex-4nunt names the aggregation-mechanism-level reason why lex-ak2nb is normatively-urgent: without active maintenance, the market-aggregation will continue to encode existing wealth-inequality as 'efficient' outcomes. lex-4nunt supplies the substantive critique that lex-ak2nb institutional-defense protects against."
critical-questions:
  - "the aggregation-mechanism-diagnostic: in any allocation-context, is the operative aggregation-mechanism one that weights preference-intensity by ability-to-pay? Test: identify the aggregation rule. If the rule is price-based (more $ = more weight), lex-4nunt is operative. If the rule is QV-style or equal-credit-budget, lex-4nunt is not operative. If the rule is one-person-one-vote, lex-4nunt is partially-decoupled. Practitioner-rule: name the aggregation-mechanism explicitly to make the dollar-weighting failure-mode legible."
  - "the wealth-distribution-encoding diagnostic: does the resulting allocation encode the existing wealth-distribution? Test: would a redistribution of wealth change which allocation is 'efficient'? If yes, the lex-4nunt mechanism is operative and the efficiency-claim is conditional on the wealth-distribution. If no, the system has been designed to decouple. Practitioner-rule: the Arrow-Debreu second welfare theorem formalizes the diagnostic; applying it makes the lex-4nunt mechanism legible."
  - "the decoupling-mechanism-design question: can the lex-4nunt failure-mode be prevented through aggregation-mechanism redesign? Posner-Weyl's QV is one candidate; equal-vote democracy is another (but loses preference-intensity); lottery-allocation is another (but loses preference-aggregation); separate-then-aggregate (separately tax wealth, then run efficient markets on redistributed wealth) is the standard liberal-economic response. Each design has trade-offs; the practitioner-question is which trade-off is acceptable in the given context."
  - "the political-feasibility-of-redistribution question: the standard liberal-economic response to lex-4nunt is 'separately redistribute, then run efficient markets.' Empirically, the redistribution rarely happens at the scale needed to decouple market-aggregation from wealth-distribution. Why? Compositional with lex-kahec enforcement-becomes-self-defeating-when-the-bound-entity-is-systemically-essential: wealth-holders become systemically essential and resist redistribution; lex-gnjc3 mission-vagueness-as-resource-magnet-and-reinterpretation-shield: redistribution-framings get reinterpreted into less-redistributive forms; lex-w3e3z forcing-the-end via reactionary politics: when redistribution-policy is enacted, wealth-holders may exit (lex-46twa) or otherwise resist. The cross-atom composition explains the political-feasibility obstacle to the standard liberal-economic response."
  - "the transferable-vs-context-specific question: does the lex-4nunt mechanism apply only to market-aggregation, or to any aggregation-mechanism that combines preference-intensity with capacity-to-spend-effort/influence/etc.? Hypothesis (Posner-Weyl 2018; Sen 1970): the mechanism is transferable across any aggregation-mechanism where the aggregating-weight is correlated with pre-existing inequality. Cases: campaign-finance (capacity-to-spend campaign-money); litigation-influence (capacity-to-spend legal-fees); regulatory-comment-influence (capacity-to-spend lobbying-resources); media-influence (capacity-to-spend media-ownership-or-PR). Each case is a substrate-instance of lex-4nunt. Practitioner-rule: identify the aggregating-weight and ask whether it is correlated with pre-existing inequality."
  - "the second-welfare-theorem-honesty question: standard-economic-pedagogy historically treats the second welfare theorem (efficiency-is-relative-to-distribution) as separable from the first (efficiency-claim). Posner-Weyl's analytical move is to dispute the separability: in practice, the wealth-distribution is not separately determined but is the OUTPUT of the market-aggregation process. Practitioner-question for any economic-policy debate: is the wealth-distribution being treated as 'given' (the standard-textbook separability assumption), or is it being treated as endogenous to the policy in question? If endogenous (which it almost always is for any non-trivial policy), the lex-4nunt mechanism is in play and the efficiency-claim is conditional on which equilibrium is selected."
  - "the cross-scale translation: lex-4nunt has been attested at market-aggregation scale (standard prices), political-aggregation scale (post-Citizens-United campaign finance), regulatory-aggregation scale (contingent valuation), product-development scale (WTP market research), and at the formal-mathematical scale (Arrow-Debreu second welfare theorem). The transferable claim is that any aggregation-mechanism whose weight-function correlates with pre-existing inequality inherits the failure-mode. Practitioner-question for any new context: identify the weight-function; if it correlates with pre-existing inequality, design decoupling-mechanisms before deploying the aggregation."
