id: lex-b3wtn
name: diagnose-whether-non-defection-is-loyalty-or-fear-before-acting
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When an adversary's own disaffected members fail to defect to your side despite having clear grievances, don't read their continued cohesion as proof of genuine loyalty to the other side — check whether it's actually fear-suppressed compliance, because the correct response to the SAME observable fact (no defection yet) is opposite depending on which cause is operating, and Kautilya specifies exactly which response fits which position of relative strength. For the stronger party: 'When a king at war with another finds that the enemy's principal constituents, though greedy, impoverished and rebellious, still do not come over to his side for fear of the war, he shall make peace, even if he is the stronger of the two; he shall at least reduce the intensity of the war' — if fear of the war itself (rather than loyalty) is what's suppressing defection, continuing or escalating the war doesn't fix the actual obstacle and may be making it worse, so de-escalation is the move that removes the fear keeping the grievance-holders in place. For the weaker party facing the mirror situation: 'When two kings are at peace with each other, [even] a weaker king shall go to war [against the stronger] if he finds that the enemy's principal constituents, though greedy, impoverished and rebellious, are afraid of coming over to his side for fear of being handed back to their king' — here the fear is specifically that defection would be reversed and punished under the current peace, so escalating to open conflict removes exactly that risk calculation and can convert suppressed grievance into actual defection. In both cases, the underlying diagnostic step is the same: identify the SPECIFIC fear that is functioning as the barrier (fear of the costs of ongoing war, versus fear of being returned and punished under a peace arrangement) rather than treating 'they haven't defected' as settled evidence about their loyalty, because the fear itself is a removable variable and the two different removable-fear scenarios call for opposite strategic moves — reducing intensity in one case, increasing it in the other. Diagnostic move: before concluding that an adversary's grievance-holding members are simply loyal enough to stay put, investigate what SPECIFIC fear (not general reluctance) is holding them in place, and check whether your own action or inaction is currently reinforcing or relieving that specific fear — the same passive stance you're currently taking could be exactly what's preventing the defection you want, or exactly what's needed to eventually enable it, depending on which fear is actually operating."
related: [lex-qkdgp]
evokes: [fear-of-war-suppresses-defection, fear-of-being-handed-back-suppresses-defection, distinguish-loyalty-from-fear, matched-response-to-diagnosed-fear]
