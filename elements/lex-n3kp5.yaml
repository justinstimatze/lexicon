id: lex-n3kp5
name: costly-consistency-in-an-unrewarded-domain-authenticates-a-stated-motive
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When a critic suggests that a historical actor's stated motive for some behavior is really just convenient rationalization — dressing up a behavior they'd have done anyway in more flattering language — the test is not to argue about the actor's sincerity in the abstract, but to look for the SAME professed value showing up in costly acts, in a completely different domain, where it offers no payoff for the behavior being explained. Merton's move against the charge that Robert Boyle's religious framing of his scientific vocation was 'merely rationalizing': Boyle wrote religious essays as a young man, learned Hebrew, Greek, Chaldee, and Syriac specifically to read scripture in its original languages, personally funded Bible translations into obscure languages, funded Christian missionary work through two different corporations, and endowed a permanent lecture series defending Christianity against unbelievers — none of which advanced his scientific reputation or standing in any way. A person merely dressing up their real motives in religious language for social credit would have no reason to spend real money and years of effort on religious acts that don't touch the domain where the alleged rationalization operates. Diagnostic move: when you suspect a stated motive is cover for something else, look for the same value expressed through costly commitments made where the suspected ulterior motive has nothing to gain — consistency there, at a real price, is what separates a genuine commitment from a convenient story."
related: []
evokes: [merton-1957, robert-boyle-piety, merely-rationalizing, boyle-lectures, defending-christianity-against-unbelievers]
lineage:
  - source: primary
    text: merton-1957-boyle-not-merely-rationalizing
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. XVIII 'Puritanism, Pietism and Science,' Bibliographical Postscript, p.604-605. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'For this is the same Boyle who had written religious essays by the age of twenty-one; had, despite his distaste for the study of language, expressed his veneration for the Scriptures by learning Hebrew, Greek, Chaldee and Syriac that he might read them in their early versions; had provided a pension for Robert Sanderson to enable him to continue writing books on casuistry; had largely paid for the costs of printing the Indian, Irish and Welsh Bibles and, as if this were not enough, for the Turkish New Testament and the Malayan version of the Gospels and Acts; had become Governor of the Corporation for the Spread of the Gospel in New England and as a director of the East India Company had devoted himself and his resources to the diffusion of Christianity in these areas; had contributed substantially to the fund for printing Burnet's History of the Reformation; had published his profession of faith in The Christian Virtuoso and, quite finally, had provided in his will for endowment of the \"Boyle lectures\" for the purpose of defending Christianity against unbelievers.'"
canonical-instances:
  - "A biographer suspects a CEO's public claim of environmentalist conviction is just marketing for the company's green-branded product line — the claim becomes credible instead of suspect when it's found the CEO has personally funded conservation land trusts and habitat restoration for decades, entirely unconnected to any product the company sells."
  - "operationally distinct from lex-8h6nz testing-virtue-by-removing-the-incentive-that-would-explain-it: that atom is an ACTIVE, first-person experimental test (an observer deliberately withdraws a suspected incentive and watches whether the behavior persists). This atom is a THIRD-PARTY, historical/evidentiary standard (a scholar assembling naturally-occurring costly acts across a person's whole life, in domains untouched by the disputed motive, as after-the-fact evidence) — no manipulation is possible or attempted."
  - "operationally distinct from lex-57wqk costly-false-belief-is-a-harder-to-fake-trust-signal: that atom explains why a COMMUNITY sustains a costly, empirically false commitment as a group-trust signal to other members. This atom is about verifying one INDIVIDUAL's already-stated, not-obviously-false motive against a specific rival hypothesis (rationalization) by checking cross-domain behavioral consistency, not about what the costly act signals to onlookers."
critical-questions:
  - "How much unrewarded costly consistency is enough? Merton presents an extensive list for Boyle — would two or three such acts have been sufficient, or does the diagnostic strength scale continuously with the number and cost of the confirming instances, with no clear threshold where 'probably genuine' becomes 'certainly genuine'?"
  - "Could a sufficiently sophisticated rationalizer perform costly cross-domain consistency deliberately, precisely because they anticipate this exact test being applied to them — and if so, does the diagnostic still work once it's public knowledge, or does it only catch unreflective self-deception rather than deliberate deception?"
status: active
