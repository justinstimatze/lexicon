lineage:
  - source: primary
    text: zitkala-sa-iktomi-and-the-ducks-eyes-closed-dance
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'Iktomi and the Ducks.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'With eyes closed you must dance. He who dares to open his eyes, forever red eyes shall have.' ... No duck dared blink a wink. ... At length one of the dancers could close his eyes no longer! It was a Skiska who peeped the least tiny blink at Iktomi within the center of the circle. 'Oh! oh!' squawked he in awful terror! 'Run! fly! Iktomi is twisting your heads and breaking your necks! Run out and fly! fly!'"
canonical-instances:
  - "A high-pressure sales presentation asks attendees to close their eyes and visualize their future success while the presenter walks the room collecting signed contracts, framing anyone who opens their eyes during the exercise as 'not fully committed to their own transformation' -- the instruction not to look is doing the actual work of preventing anyone from seeing what's being signed around them."
  - "A workplace 'trust exercise' asks new employees to avoid questioning management decisions during their first ninety days as a sign of good faith, discouraging exactly the period of close observation that would let a new hire notice red flags before becoming financially or socially committed to staying."
critical-questions:
  - "how does someone distinguish a genuinely harmful no-looking rule from a legitimate one -- some real rituals, surprises, or trust-building exercises do ask participants to temporarily suspend observation for benign reasons, and treating every such instruction as a threat risks corroding activities that actually depend on that trust?"
  - "why did it take one duck breaking the rule rather than the whole group reasoning collectively that the rule itself was suspicious -- does groupthink or the taboo's social enforcement (no one wanting to be the one who 'ruins' the shared ritual) make a bad rule harder to challenge than its actual content would justify?"
  - "does the framework assume the harm is always immediately obvious once someone looks -- what about situations where breaking the no-looking rule reveals nothing conclusive in the moment, leaving the observer no better off and now marked as the one who broke trust with the group?"
