id: lex-z76v7
name: accountable-leader-yields-functional-lead-to-the-relevant-specialist
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When one person holds formal, ultimate accountability for an outcome but the work genuinely requires several different kinds of expertise, don't insist on personally directing every step. Cede the FUNCTIONAL lead — who is actively calling the shots right now — to whichever team member's skill the current phase calls for, the way an orchestra conductor calls a violinist forward for a solo without handing over the baton; Reader adds that the conductor-physician, like the literal conductor, must know the potentialities of each performer even though he cannot play every instrument himself. The accountable party doesn't need to be able to do everything themselves; they need to know each team member's actual capability well enough to call on the right one at the right moment, and they retain ultimate responsibility for the result regardless of who was functionally leading when a given decision got made. Reader's own qualifier matters as much as the mechanism: this only works when mutual respect and trust already exist among the group. Where it's lacking, rotating functional leadership doesn't degrade gracefully into 'business as usual under the nominal leader' — Reader states flatly that comprehensive coordinated work becomes impossible, because the accountable leader can no longer safely call on expertise they don't personally control."
related: []
evokes: [reader-1957-cctp, orchestra-conductor-metaphor, functional-versus-formal-authority, ceding-the-floor-to-the-expert, distributed-expertise-team-leadership, situational-leadership, crew-resource-management, trust-as-precondition-for-shared-leadership]
lineage:
  - source: primary
    text: reader-1957-conductor-yields-the-floor
    citation: "George G. Reader, \"The Cornell Comprehensive Care and Teaching Program,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.86-87. Quote elides one sentence spanning a page break where the source glues a footnote digit onto the word \"physician,\" splitting it across the page turn; the elided sentence (paraphrased in this atom's agent-instruction) is not needed for the verbatim claim."
    quote: "'As the director of a symphony orchestra may call upon a violinist for a solo, however, so may the physician yield the stage to the social worker, nurse, or other specialist at some phase of the patient's course. ... If mutual respect and understanding are present among the members of the group giving patient care, it matters little who is taking the lead at any given time. But if these are lacking or if the physician fails to learn how to call on all those who can help him, comprehensive patient care is impossible.'"
canonical-instances:
  - "Emergency-department resuscitation: the attending physician holds final legal accountability for the patient, but during a code the attending routinely defers active direction to whichever specialist has the clearest read of the immediate problem — an anesthesiologist managing a difficult airway, a senior nurse running compressions and timing the drug cycle — resuming visible command once the acute phase resolves."
  - "Software engineering: an engineering manager keeps final sign-off on a release but hands the functional technical lead to whichever engineer's domain — a database migration, a security review, a performance regression — is load-bearing for the current sprint, without giving up accountability for the shipped outcome."
  - "Aviation crew resource management: the captain retains final legal authority over the flight, but post-Tenerife CRM training explicitly instructs captains to accept a first officer's or flight engineer's correction or lead when that crew member has better situational information at the moment — the same structure of retained formal accountability with rotating functional lead."
critical-questions:
  - "Does this collapse into ordinary delegation, or is the distinguishing feature that the 'delegate' is chosen by expertise-of-the-moment rather than by fixed rank or job title? A rigid org chart that always routes decisions through the same deputy is not an instance of this pattern even if it looks superficially similar."
  - "What is the actual mechanism by which 'ultimate responsibility' survives a decision the accountable party didn't make in real time — retrospective review, a standing veto, after-the-fact sign-off? Reader asserts the physician stays responsible without specifying how that responsibility is exercised when someone else was functionally leading at the critical moment."
  - "Reader states the trust precondition as a hard binary — present, and rank barely matters; absent, and coordinated care becomes impossible. Is that literally true, or is there a degraded middle ground where partial trust yields partial functional-leadership benefit rather than an all-or-nothing collapse?"
status: active
