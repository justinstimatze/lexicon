id: lex-5n5gz
name: a-mechanism-visible-in-extreme-cases-is-assumed-to-apply-only-there
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a general causal mechanism is most VISIBLE in extreme or deprived cases, watch for the fallacious step of concluding it therefore only OPERATES in those cases. Merton's example: physicians who accept that a patient's social environment matters tend to illustrate the point only with the poor, uneducated, or visibly deprived patient — the person whose 'overcrowded, ill-ventilated, and unheated' home is an obvious causal factor in illness. Merton names the trap directly: 'this should not invite the fallacious though superficially plausible inference that sociological considerations are pertinent only in such instances of gross defects of environment. Well-fed patients living in well-ventilated and well-heated houses may also be subject to less conspicuous but no less stressful conditions of environment, in their homes, at work, and in the other groups of which they are a part.' The mechanism (social environment affecting health) doesn't switch off for comfortable patients — it just stops being dramatic enough to notice without looking. The inference is 'superficially plausible' precisely because the extreme cases really are the clearest illustration available, which makes it easy to mistake clearest-to-see for only-place-it-happens. Diagnostic move: whenever a mechanism is being taught or illustrated exclusively through its most extreme instances, explicitly ask whether the same mechanism operates continuously across the whole range of cases, just below the threshold of easy visibility in the milder ones — and if so, correct for the fact that people exposed only to the extreme illustrations will systematically underestimate the mechanism's reach into ordinary cases."
