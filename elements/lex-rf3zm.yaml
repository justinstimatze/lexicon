lineage:
  - source: primary
    text: radin-hare-uses-talking-acorns-as-a-decoy-to-ambush-a-pursuer
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 15. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Shortly after, however, the being said to Hare, ' Hare, how do objects get out when, like you, they crawl into a hole?' ... 'Well,' answered Hare'they get some of grandmother's reedmatting and smoke me out with it. Then I always come out.' 'Good,' said the Other, 'you stay right here and don't go out for I wish to go and get some of this matting.''Certainly,' said Hare, 'where could I go to? I will remain here.' So the other one went away and as soon as he went away Hare also left. Then he got four acorns from an oak tree and put them in the-hole. To one of them he said, 'If this being talks to you, you, must answer.' Then he taught it what to say and, taking a forked stick, hid himself near by. Finally the Being came back and asked, ' Hare, are you still in there?''Yes,' came the answer. 'Where else could I go? I am still here for you told me to remain here;' One of the acorns was speaking. Then the being stuffed the hole with the matting, lit it and stood there waiting for Hare to come out. It began to burn inside and soon one of the acorns burst, making a loud report. 'There,' said the being, waiting, 'one of Hare's eyes has burst.' ... When he heard a fourth report he said, 'There goes the other testicle.' Now Hare, taking his forked stick and sneaking up behind him, placed the fork over his neck, pushed this being into the fire and burnt it to death."
canonical-instances:
  - "An employee under surveillance by a controlling manager leaves their computer signed in and set to auto-reply to messages during work hours while they attend an interview elsewhere, keeping the manager convinced they're at their desk while they're actually not."
  - "A soldier evading capture leaves a radio transmitting recorded static and occasional garbled words from a fixed position while moving to a different location entirely, letting pursuers continue converging on and monitoring a spot that no longer has anyone in it."
critical-questions:
  - "Does the deception work because the being genuinely cannot tell an acorn's voice from Hare's, or because it has already decided where Hare is and is no longer actually listening critically to the answers it receives, and does that distinction change how transferable this diagnostic is?"
  - "Would the trick have failed if the being had asked the hole a question only the real Hare could answer, and does the mechanism depend specifically on the pursuer asking only confirmatory questions rather than genuinely investigative ones?"
  - "Is there a point at which the being's increasingly specific narration of Hare's death, eyes, then testicles, should have prompted suspicion rather than confidence, and what would it have taken for a satisfied pursuer to start doubting a story that keeps confirming exactly what they expected?"
status: active
