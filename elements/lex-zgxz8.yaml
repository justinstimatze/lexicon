id: lex-zgxz8
name: moral-metaphors-are-grounded-in-embodied-well-being-not-arbitrary
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When the same abstract moral metaphor turns up independently in unrelated cultures -- morality as wealth, as strength, as health, as light -- don't treat the recurrence as coincidence or as evidence of historical borrowing. Lakoff's account: each metaphor's source domain is picked because it already tracks a real, near-universal axis of embodied well-being. Wealth becomes a vehicle for moral value because being rich beats being poor. Strength works the same way, and so does health, which drags cleanliness and purity along with it. Light and dark map onto good and evil because safety beats the dangers of the dark. The metaphor's polarity is fixed by which side of the well-being axis is actually better for a person. That's why the mapping runs the same direction everywhere it appears. Because these well-being axes come from having a body and living among other people -- not from any particular culture's history -- the metaphors that get built from them convergently show up across societies with no contact, the way purification rituals and Good-as-Light imagery recur independently. Diagnostic move: before treating a shared metaphor across two unconnected traditions as proof of contact or coincidence, check whether both are drawing on the same embodied well-being axis."
related: [lex-kfdep, lex-zwnfz]
evokes: [george-lakoff, moral-politics-1996, experiential-morality, morality-as-wealth, morality-as-light]
lineage:
  - source: primary
    text: lakoff-1996-well-being-grounds-moral-metaphors
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 3 'Experiential Morality.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“It is these conditions that form the grounding for our system of moral metaphors. Since it is better to be rich than to be poor, morality is conceptualized in terms of wealth. Since it is better to be strong than to be weak, we expect to see morality conceptualized as strength. Because it is better to be healthy than sick, it is no surprise to see morality conceptualized in terms of health and attendant concepts like cleanliness and purity. Since it is better to be cared for than uncared for, it seems natural to find morality conceptualized as nurturance. And because, in normal cases, children tend to be better off if they obey rather than disobey their parents, we expect to see morality conceptualized as obedience.”"
  - source: primary
    text: lakoff-1996-shared-metaphors-across-cultures
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 3 'Experiential Morality.'"
    quote: "“Because the same forms of well-being are widespread around the world, we expect many of the same metaphors for morality to show up in culture after culture—and they do. Where we find purification rituals, we find a manifestation of Morality as Purity. Because of the widespread fear of the dark, we find a widespread conception of Evil as Dark and Good as Light. Because it is better to walk upright than to fall down, we find the widespread metaphor of Morality as Uprightness.”"
canonical-instances:
  - "The direct textual anchor, on the study's own governing claim: “The most fundamental form of morality concerns promoting the experiential well-being of others and the avoidance and prevention of experiential harm to others or the disruption of the well-being of others.”"
  - "Hypothetical: an anthropologist studying two societies with no documented historical contact finds both describe generosity using a container-and-overflow image -- a generous person's heart or hand 'overflows,' a stingy one is 'closed' or 'empty.' Rather than searching for a lost trade route or migration that could have carried the phrase between them, she checks whether both societies experience having-enough as filled and lacking as empty in ordinary embodied life -- if so, the shared metaphor needs no contact to explain it, only the shared body."
critical-questions:
  - "Lakoff lists several well-being axes (wealth, strength, health, nurturance, obedience) that could in principle be extended almost indefinitely -- is there a way to predict in advance which embodied axes will actually get recruited into a culture's moral vocabulary and which stay merely descriptive, or does the theory only explain a metaphor's presence after the fact, once it's already been observed?"
  - "The chapter's own well-being list includes items in real tension with each other -- Lakoff notes 'excessive freedom can sometimes be harmful' and 'social ties that are too close can become oppressive.' If the underlying well-being axes themselves admit exceptions and reversals, how stable is the metaphor system that's supposedly grounded in them, and what happens to a moral metaphor when the culture's lived experience of its source domain shifts?"
status: active
