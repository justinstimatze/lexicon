    quote: "Yes, my lord: last night you fell into the hands of your enemies, and in a moment you got free again.\" The king said, \"That is the kind of man a star-gazer ought to be."
canonical-instances:
  - "A CFO suspects several outside auditors of giving boilerplate assessments, so she quietly plants one unusual transaction whose real story only she knows. Each auditor's report is judged on whether it flagged and correctly characterized that single transaction, not on how confident the overall summary sounded."
critical-questions:
  - "Does this test genuinely measure competence, or could it simply reward whichever expert happened to have better information access on this one occasion, without reflecting their overall reliability?"
  - "Is there a risk that experts who learn this kind of covert testing occurs will start hedging even harder to avoid being caught wrong on an unverifiable claim, making the test less effective once it becomes expected?"
