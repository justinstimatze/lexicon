lineage:
  - source: primary
    text: levi-strauss-1962-the-savage-mind
    citation: "Claude Lévi-Strauss, *The Savage Mind* [*La Pensée Sauvage*] (Paris: Plon, 1962; English translation, London: Weidenfeld and Nicolson, 1966), Chapter 1 'The Science of the Concrete,' pp. 1-22. The chapter's argument runs in one chain: first (pp. 1-11), an extended demonstration that so-called primitive peoples maintain taxonomic and classificatory knowledge of their environment (plants, animals, natural kinds) as exhaustive and disinterested as any modern science's, motivated by an intrinsic 'demand for order' common to all thought; second (pp. 12-15), framed as the 'Neolithic Paradox' — how could the neolithic inventors of agriculture, pottery, and animal domestication have possessed a genuinely scientific attitude and yet modern science took millennia longer to arrive — resolved by positing not a hierarchy of developmental stages but TWO DISTINCT AND PARALLEL MODES of scientific thought, operating at two different 'strategic levels' at which nature is accessible to enquiry, one close to sensible intuition and one remote from it; third (pp. 16-22), the chapter's central move, developing the analogy between these two modes and a technical-plane distinction between the 'bricoleur' and the 'engineer' — the bricoleur builds by recombining a closed, finite, heterogeneous stock of means accumulated by historical accident, while the engineer designs or procures means purpose-built for a defined project — in order to argue that mythical thought is 'a kind of intellectual bricolage' standing in genuine parity with, not as a deficient precursor to, the engineer's/scientist's conceptual mode. The source PDF's digitized text layer has a gap spanning the pages containing the classic bricoleur/engineer passage; the passage was independently reconstructed from the source page images and cross-verified against multiple independent reads, which converged on identical wording for every sentence used in the quote field below."
    quote: "[On comparing magic/mythical thought and science as parallel rather than ranked, pp. 12-13:] 'It is therefore better, instead of contrasting magic and science, to compare them as two parallel modes of acquiring knowledge. Their theoretical and practical results differ in value, for it is true that science is more successful than magic from this point of view, although magic foreshadows science in that it is sometimes also successful. Both science and magic however require the same sort of mental operations and they differ not so much in kind as in the different types of phenomena to which they are applied.' [On the Neolithic Paradox and the two strategic levels, p. 14:] 'There is only one solution to the paradox, namely, that there are two distinct modes of scientific thought. These are certainly not a function of different stages of development of the human mind but rather of two strategic levels at which nature is accessible to scientific enquiry.' [Introducing 'bricolage' and the bricoleur, pp. 16-17:] 'There still exists among ourselves an activity which on the technical plane gives us quite a good understanding of what a science we prefer to call \"prior\" rather than \"primitive\", could have been on the plane of speculation. This is what is commonly called \"bricolage\" in French... in our own time the \"bricoleur\" is still someone who works with his hands and uses devious means compared to those of a craftsman. The characteristic feature of mythical thought is that it expresses itself by means of a heterogeneous repertoire which, even if extensive, is nevertheless limited. It has to use this repertoire, however, whatever the task in hand because it has nothing else at its disposal. Mythical thought is therefore a kind of intellectual \"bricolage\" — which explains the relation which can be perceived between the two.' [Translator's footnote on the untranslatable term, p. 17:] 'The \"bricoleur\" has no precise equivalent in English. He is a man who undertakes odd jobs and is a Jack of all trades or a kind of professional do-it-yourself man, but... he is of a different standing from, for instance, the English \"odd job man\" or handyman.' [The canonical Dickens illustration, p. 17:] '...attention has often been drawn to the mytho-poetical nature of \"bricolage\" on the plane of so-called \"raw\" or \"naïve\" art, in architectural follies like the villa of Cheval the postman or the stage sets of Georges Méliès, or, again, in the case immortalized by Dickens in Great Expectations but no doubt originally inspired by observation, of Mr Wemmick's suburban \"castle\" with its miniature drawbridge, its cannon firing at nine o'clock, its bed of salad and cucumbers, thanks to which its occupants could withstand a siege if necessary...' [The core bricoleur/engineer contrast, p. 17:] 'The analogy is worth pursuing since it helps us to see the real relations between the two types of scientific knowledge we have distinguished. The \"bricoleur\" is adept at performing a large number of diverse tasks; but, unlike the engineer, he does not subordinate each of them to the availability of raw materials and tools conceived and procured for the purpose of the project. His universe of instruments is closed and the rules of his game are always to make do with \"whatever is at hand\", that is to say with a set of tools and materials which is always finite and is also heterogeneous because what it contains bears no relation to the current project, or indeed to any particular project, but is the contingent result of all the occasions there have been to renew or enrich the stock or to maintain it with the remains of previous constructions or destructions. The set of the \"bricoleur's\" means cannot therefore be defined in terms of a project (which would presuppose besides, that, as in the case of the engineer, there were, at least in theory, as many sets of tools and materials or \"instrumental sets\", as there are different kinds of projects). It is to be defined only by its potential [use]...' [Continuing onto the principle governing what the stock retains, p. 18:] '...because the elements are collected or retained on the principle that \"they may always come in handy\". Such elements are specialized up to a point, sufficiently for the \"bricoleur\" not to need the equipment and knowledge of all trades and professions, but not enough for each of them to have only one definite and determinate use.' [On the bricoleur's retrospective first move and his 'treasury,' p. 18:] 'Consider him at work and excited by his project. His first practical step is retrospective. He has to turn back to an already existent set made up of tools and materials, to consider or reconsider what it contains and, finally and above all, to engage in a sort of dialogue with it... He interrogates all the heterogeneous objects of which his treasury is composed to discover what each of them could signify... A particular cube of oak could be a wedge to make up for the inadequate length of a plank of pine or it could be a pedestal.' [On the elements being 'pre-constrained' by their own history, p. 18-19:] 'The elements which the \"bricoleur\" collects and uses are \"pre-constrained\"... But the possibilities always remain limited by the particular history of each piece and by those of its features which are already determined by the use for which it was originally intended or the modifications it has undergone for other purposes.' [The engineer's contrasting relation to resources, and the closing statement of a real-but-less-absolute difference, p. 19:] 'The engineer no doubt also cross-examines his resources... It might be said that the engineer questions the universe, while the \"bricoleur\" addresses himself to a collection of oddments left over from human endeavours, that is, only a sub-set of the culture... The difference is therefore less absolute than it might appear. It remains a real one, however, in that the engineer is always trying to make his way out of and go beyond the constraints imposed by a particular state of civilization while the \"bricoleur\" by inclination or necessity always remains within them. This is another way of saying that the engineer works by means of concepts and the \"bricoleur\" by means of signs.' [The capstone claim tying bricolage explicitly back to mythical thought and to science's own foundational distinction, pp. 20-21:] 'Mythical thought appears to be an intellectual form of \"bricolage\" in this sense also. Science as a whole is based on the distinction between the contingent and the necessary, this being also what distinguishes event and structure... Now, the characteristic feature of mythical thought, as of \"bricolage\" on the practical plane, is that it builds up structured sets, not directly with other structured sets but by using the remains and debris of events.'"
