id: lex-95nes
name: keep-the-aim-fixed-and-treat-every-stratagem-as-disposable
type-in: process
type-out: frame
_tier: atomic
agent-instruction: "When pursuing a high-stakes objective, don't get attached to any single stratagem as though it were part of the goal itself -- hold only the ultimate aim as fixed, and treat every specific maneuver toward it as freely reversible, contradictable, or discardable the moment it stops serving that aim. Rangarajan's synthesis of Kautilya's elaborate war-of-the-circle-of-kings tactics names this explicitly as the underlying design principle: 'these are, in fact, a graphic example of Kautilya's basic advice: the conqueror shall clearly identify the main aims (i.e. the elimination of the enemy) and then use short-term stratagems to achieve the main aims.' What makes this worth naming as its own move is how bizarre the individual stratagems look in isolation -- making peace with an enemy in order to then engineer his destruction, inviting an enemy to a joint campaign in order to betray him mid-campaign, allying with one party just long enough to turn them against a different party -- each one, read alone, looks inconsistent or even contradictory with the others. They only cohere once you see that none of them was ever the actual goal; each was a temporary configuration adopted and then abandoned as soon as it had done its job of moving the fixed aim forward. The failure this guards against is treating a stratagem's own internal logic (an alliance's terms, a truce's conditions, a partnership's stated purpose) as a commitment that outlives its usefulness, when it was only ever a disposable means to something else the whole time. Diagnostic move: when committing to any specific maneuver -- an alliance, a compromise, a public position -- write down separately what the maneuver is actually FOR, and check in periodically whether the maneuver still serves that fixed aim; the moment it stops, be willing to reverse, contradict, or abandon the maneuver entirely, since only the original aim, not the specific path taken toward it, was ever the actual commitment."
