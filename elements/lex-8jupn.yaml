    quote: "Sir, I did not believe it! Even when the deities came hovering in the air, and told me this, I refused to believe it, saying that there was no death for my son until he had obtained Buddhahood at the foot of the bo-tree."
canonical-instances:
  - "A therapist, having just watched a client dismiss a friend's obviously self-destructive choice as none of her business, tells a fable about a bystander who ignores a drowning stranger. She picked it for the structural match to what the client just did, well past any loose thematic fit."
critical-questions:
  - "A structural mirror this tight risks a second effect once the listener notices it: the lesson can start to feel less like teaching and more like being caught."
