name: iterated-cooperation-rewards-strategies-that-are-nice-provocable-forgiving-and-clear
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you face a repeated interaction with another agent where unilateral defection is locally tempting but mutual cooperation is globally better (an iterated Prisoner's Dilemma in form), the winning strategy is reciprocity with four properties. Axelrod & Hamilton 1981 tournament finding (a 2-line program — tit-for-tat — beat dozens of clever programs over rounds and won the rematch when everyone knew tit-for-tat had won): (1) NICE — cooperate first, do not defect first; (2) PROVOCABLE — retaliate immediately to an uncalled-for defection (slowness to anger sends the wrong signal and invites further defection); (3) FORGIVING — return to cooperation after one round of retaliation; do not escalate a vendetta; (4) CLEAR — be legible enough that the other agent can model what you'll do and adapt to it. Cooperation thrives when the 'shadow of the future' is long enough that the value of continued cooperation exceeds the one-shot defection payoff. Transferable diagnostic: in any repeated interaction, ask whether your behavior has these four properties; failure modes are (a) too nice — never retaliating, gets exploited; (b) too retaliatory — escalating into vendetta and loss of cooperative window; (c) too forgiving — defectors learn they can hit-and-run; (d) too opaque — opponent can't tell what you'll do, fails to coordinate on cooperation. The ratchet effect: once reciprocity is the dominant norm, it self-reinforces by punishing newcomers' defection. The structural prerequisites: detection of defection must be reliable AND fast (slow detection allows defection to accumulate past the provocability threshold), and the interaction must be repeated (one-shot interactions revert to defection-dominant)."
