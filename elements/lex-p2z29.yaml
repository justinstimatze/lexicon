id: lex-p2z29
name: a-relay-of-identical-stand-ins-simulates-one-decaying-competitor
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A single competitor can look like they're persisting through the whole length of a long contest if you station enough identical-looking stand-ins along the route, each surfacing once, and have them get progressively more disheveled so the illusion includes not just presence but decline. In Cushing's telling, an old Gopher accepts a foot race against champion runners on the condition he can travel underground, then recruits a chain of brothers stationed at intervals down the entire course: 'The means by which I shall be distinguished as a racer will be a red plume tied to my head. Do you also procure a red plume and tie it to your head. When you hear the thundering of the feet of the racers, run out and show yourself for a minute, and rush into the other hole as fast as you can.' The trick isn't just multiplying bodies -- it's staging apparent fatigue across them: one brother rubs water into his fur to look like sweat, and by the final stretch the runners see 'the most bedraggled and worn out of all the Gophers,' with the original popping up at the finish 'plastered with mud, half closing his eyes,' completing a story of one racer's heroic exhaustion that no single Gopher ever actually ran. Diagnostic move: when you're tracking a competitor's apparent condition across a long process by spot-checking their appearance at intervals, remember that a team using identical markers can fabricate not just repeated presence but a whole convincing arc of decline, and neither on its own proves continuity of the same individual."
