id: lex-qfx37
name: relocating-rather-than-resolving-an-insatiable-appetite
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A greedy agent, never satisfied by abundance at one source, moves to a new source rather than confronting the fact that more isn''t the fix; the dissatisfaction migrates with the agent because it was never really about supply. In the Jataka''s tale of Cakkavaka, the crow abandons elephant carcasses for river fish, then abandons those too for the Himalaya''s wild fruit: a greedy crow went about eating the bodies of dead elephants, and not satisfied with them he thought, "I will eat the fat of fish on the bank of the Ganges," and after staying a few days there eating dead fish he went into the Himalaya and lived on various kinds of wild fruits.'
related: []
evokes: [jataka, navanipata, cakkavaka-jataka, dissatisfaction-migrates-with-the-agent, insatiability-relocates-rather-than-resolves]
lineage:
  - source: primary
    text: jataka-chalmers1895-cakkavaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IX (Navanipata), No. 434, Cakkavaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "a greedy crow went about eating the bodies of dead elephants, and not satisfied with them he thought, \"I will eat the fat of fish on the bank of the Ganges,\" and after staying a few days there eating dead fish he went into the Himalaya and lived on various kinds of wild fruits."
canonical-instances:
  - "An investor unsatisfied with steady index returns chases increasingly exotic asset classes one after another, never staying long enough at any of them to notice the dissatisfaction is about his own relationship to risk rather than the asset's returns."
critical-questions:
  - "From inside the search, is there any way to tell the next relocation is finally the one that will satisfy the appetite, short of stepping back and asking whether the appetite itself is what needs addressing?"
status: active
