id: lex-a6hvx
name: deliberately-ask-what-the-ideal-version-of-a-natural-system-would-look-like
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When trying to discover something new about an existing natural system rather than invent a new artifact, don't wait for a lucky analogy to trigger the right question — deliberately ask what an idealized version of that system would look like (absorbing everything available from its environment with nothing wasted), then ask what stands in the way of the real system reaching that ideal, because the gap itself often points straight at an undiscovered capability. Altshuller contrasts two routes to the same kind of insight. The first is pure accident: 'Francis Crick, a future Nobel Prizewinner, heard over beer about an astronomer who had talked something about the 'perfect cosmological principle.' Crick paid little attention to exactly what he meant by this but he was set to wondering whether an argument could be made for the 'perfect biological principle'... Crick was interested in the problem of the replication of DNA and therefore in this instance the 'perfect biological principle' was 'the self-replication of DNA.' That is how the first step toward one of the most important discoveries of the 20th century was taken.' The second route reaches the same kind of move deliberately, without needing an accidental conversation: 'Take Engineer (not a biologist!) G.G.Golovchenko... who applies the IFR concept to... the evolution of plants. His course of thinking was approximately as follows: plants of today in comparison with those of yesterday are an approximation to the IFR, to some ideal plant which has absorbed to the full substances and energy from its habitat, and let us look at what contradictions could arise in this process and how the plant overcome them, in drawing closer to the IFR. The research undertaken by Golovchenko led to the discovery of the wind energy power of plants — the ability of plants to directly utilise the energy of the wind.' An engineer with no biology training, simply by asking the IFR question of a natural system rather than an artifact, located a real, previously undocumented plant capability that biologists studying the same plants hadn't framed the question to find. Diagnostic move: when studying an existing natural or biological system rather than designing something new, explicitly ask what an ideal version of that system would extract or achieve from its environment with zero waste, name the gap between that ideal and the system as currently understood, and treat that gap as a specific, checkable hypothesis about an undiscovered mechanism — rather than waiting for the right accidental analogy to surface the question on its own."
