lineage:
  - source: primary
    tradition: hofstadter-strange-loop
    text: hofstadter-2007-strange-loop
    citation: "Douglas R. Hofstadter, I Am a Strange Loop (Basic Books, 2007), Chapter 8 ('Embarking on a Strange-Loop Safari')."
    quote: "[…] there is a shift from one level of abstraction (or structure) to another, which feels like an upwards movement in a hierarchy, and yet somehow the successive upward shifts turn out to give rise to a closed cycle. That is, despite one's sense of departing ever further from one's origin, one winds up, to one's shock, exactly where one had started out. In short, a strange loop is a paradoxical level-crossing feedback loop. One of the most canonical (and, I am sorry to say, now hackneyed) examples is M. C. Escher's lithograph Drawing Hands. [Corrected 2026-08-19: the opening sentence here previously read '[The strange loop is the] phenomenon in which, whenever one moves upwards or downwards through the levels of some hierarchical system, one unexpectedly finds oneself right back where one started' -- that sentence does not appear anywhere in this book (searched multiple phrase variants, all absent). It was a pronoun-swapped paraphrase of a distinct 1979 sentence from Gödel, Escher, Bach ('we unexpectedly find ourselves right back where we started'), welded here under a Ch.8 citation it doesn't belong to. Replaced with this book's own real Ch.8 definitional passage, verified exact against Hofstadter-2011-IAmAStrangeLoop.epub. Correction date 2026-08-21: the year in this atom's own citation had also been wrong (given as 2011) -- I Am a Strange Loop was first published by Basic Books in 2007; the epub filename above reflects the file's own naming, not the book's publication date.]"
  - source: primary
    tradition: hofstadter-strange-loop
    text: hofstadter-2007-strange-loop
    citation: "Douglas R. Hofstadter, I Am a Strange Loop (Basic Books, 2007), Chapter 12, on Gödel-style escape from Russell's ban."
    quote: "Bertrand Russell's attempt to bar Berry's paradoxical construction by instituting a formalism that banned all self-referring linguistic expressions and self-containing sets was not only too hasty but quite off base. […] you are free to toss KG or any of its clones as a new axiom into PM (for that matter, feel free to toss them all in at once!), but your heroic act will do little good; Gödel's recipe will instantly produce a brand-new cousin to KG."
canonical-instances:
  - "Escher's *Drawing Hands* lithograph — the canonical visual example of a level-crossing loop closing on itself."
  - "Gödel's incompleteness theorems — formal systems containing arithmetic can construct statements that assert their own unprovability; the strange loop is intrinsic to the system, not a flaw."
  - "The 'I' / self as Hofstadter proposes it — the symbol 'I' in our minds represents the system-of-symbols that includes the 'I' symbol; the loop is the substrate of self-experience."
  - "Recursive software bugs where a function calls itself with a state that includes the function's previous output — debugging requires noticing the loop, not fixing each level."
  - "Organizational policies about how to set organizational policy — the policy-makers are themselves bound by their policies; reform requires either accepting the loop or invoking an external authority."
  - "Critics critiquing the criticism (e.g., postcolonial theory critiquing the universalist categories postcolonial theory itself relies on) — the strange-loop structure cannot be cleanly resolved within the system."
  - "Constitutional review of constitutional amendment procedures — the constitution provides the rules for changing itself; whose authority validates an amendment to the amendment process?"
  - "The retrospective-voting / blind-retrospection dynamic (lex-cpq3s) — voters' performance-review of leaders includes the voter's own welfare, which leaders shape — a recursive loop where the evaluator's state is partly the product of the evaluated."
