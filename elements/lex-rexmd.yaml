id: lex-rexmd
name: an-undetected-informant-defeats-every-evasion-attempt
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When every evasion tactic you try fails identically and immediately, the problem may not be that your tactics are poorly chosen -- it may be that something attached to you, unnoticed, is reporting your position regardless of which tactic you pick, which means no new tactic will work until the leak itself is found. In Radin's Winnebago Hare Cycle, Hare tries four different hiding strategies in succession, a thicket, under a log, a hole in the ground, a hollow tree, and pursuers announce his exact location every single time, instantly: 'Little Hare has run into a thicket'... 'The little Hare is hiding under a log'... 'The little Hare ran into a hole in the ground.' Hare never identifies the leak himself; an old man who intercepts him does, producing the actual mechanism: 'he took a woodtick from Hare's ears. 'This is the one that was always telling me where you were going whenever you tried to hide, so how could you ever have succeeded?'' No hiding place had ever been the issue. The informant was on Hare's own body the entire time, and every strategy that varied where Hare hid while leaving the woodtick in place was guaranteed to fail the same way. Diagnostic move: when a series of otherwise-sound evasion or concealment strategies keep failing in exactly the same fast, precise way, stop varying the strategy and start checking what's traveling with you into every attempt, since a leak on the messenger defeats every message equally, regardless of how good the message is."
