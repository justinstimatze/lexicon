lineage:
  - source: primary
    text: flavell-1979-metacognition-and-cognitive-monitoring
    citation: "John H. Flavell, 'Metacognition and Cognitive Monitoring: A New Area of Cognitive-Developmental Inquiry,' *American Psychologist* 34(10):906-911 (October 1979). The founding paper that names 'metacognition' as a research area and proposes a four-component model: (a) metacognitive knowledge, (b) metacognitive experiences, (c) goals/tasks, (d) actions/strategies. The lex-wtkuz descriptive-vs-operational distinction is a SHARPENING within Flavell's frame — descriptive metacog ≈ a metacognitive experience that does not recruit an action; operational metacog ≈ a metacognitive experience that routes a goal-or-strategy update. Flavell himself does not draw the distinction in these terms but does name MONITORING as the umbrella process the atom carves up. for the foundational primary; the descriptive-vs-operational sharpening is the transferable refinement and remains practitioner-grounded as a within-Flavell-frame distinction."
    quote: "[Flavell 1979 *Am Psych* 34(10):906-911, on the founding move and the four-component model:] 'Thus, the nature and development of metacognition and of cognitive monitoring/regulation is currently emerging as an interesting and promising new area of investigation. What might there be for a child or adolescent to learn in this area? That is, what adultlike knowledge and behavior might constitute the developmental target here, toward which the child gradually progresses?' [The four-component model:] 'I believe that the monitoring of a wide variety of cognitive enterprises occurs through the actions of and interactions among four classes of phenomena: (a) metacognitive knowledge, (b) metacognitive experiences, (c) goals (or tasks), and (d) actions (or strategies). Metacognitive knowledge is that segment of your (a child's, an adult's) stored world knowledge that has to do with people as cognitive creatures and with their diverse cognitive tasks, goals, actions, and experiences... Metacognitive experiences are any conscious cognitive or affective experiences that accompany and pertain to any intellectual enterprise. An example would be the sudden feeling that you do not understand something another person just said. I assume that metacognitive knowledge and metacognitive experiences differ from other kinds only in their content and function, not in their form or quality. Goals (or tasks) refer to the objectives of a cognitive enterprise. Actions (or strategies) refer to the cognitions or other behaviors employed to achieve them.' [Practitioner-extraction: Flavell's frame contains the components but not the descriptive-vs-operational test the atom names; the test is the practitioner-extraction. A metacognitive experience (Flavell category b) that does not engage Flavell's category (d) actions is descriptive in lex-wtkuz's sense; one that does is operational. The atom is a within-Flavell-frame discrimination tool, grounded by Flavell on the existence-of-the-pattern axis and sharpened by the descriptive-vs-operational practitioner-discipline on the application-of-the-pattern axis.]"
  - source: practitioner
    text: bootstrap originating-conversation
    citation: "Founding seed-primitive #17. The descriptive-vs-operational sharpening originated in lexicon-bootstrap conversation and is the transferable refinement within Flavell's broader frame. Retained as secondary lineage marking the practitioner-extraction history."
canonical-instances:
  - "descriptive metacognition: 'I notice I'm anxious' (mostly garnish for fitness — the noticing doesn't change the anxiety)"
  - "operational metacognition: 'I notice I'm anxious AND that pattern usually means I'm avoiding the harder question; what's the harder question?' (the noticing produces leverage by routing the next move)"
critical-questions:
  - "the leverage-test: does this noticing produce ANY change in the next action? If 'I notice I'm anxious' produces no action-routing, it's descriptive (garnish). If it routes the next move (different question asked, different recovery strategy invoked, different conversation initiated), it's operational. Practitioner-discipline: when noticing, ask 'what does this notice route me toward?' If no answer, the metacog is decorative"
  - "the descriptive-as-precursor pattern: descriptive metacog can be a precursor to operational metacog (you have to notice X before you can do Y about X). Not all descriptive metacog is wasted — it may be the setup-step. Practitioner-question: is this descriptive notice part of a planned sequence that ends in action, or is it terminal? If terminal, it's garnish"
  - "the rumination-vs-metacog distinction: ruminative thinking shares the SURFACE-FORM of metacognition ('I keep thinking about why I'm anxious') without the operational payoff. Rumination is recursive without action-output; operational metacog produces a decision. Practitioner-question: does this round of metacognition conclude with a decision, or does it just feed back into more noticing?"
  - "the social-presentation failure-mode: 'I notice I'm doing X' said aloud can be performative — signaling self-awareness to an audience rather than routing one's own action. Practitioner-discipline: when speaking metacognitively, verify the metacog is doing internal work, not just performing self-awareness for the listener"
