id: lex-z7dbd
name: time-since-isolation-predicts-divergence-better-than-current-distance
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "When estimating how diverged two lineages are, surface that time-since-isolation predicts divergence better than current geographic distance — recently separated populations stay similar even if now far apart, and vice versa."
related: [lex-9an5g, lex-eadyj, lex-mwgep, lex-n5jed, lex-vacza, lex-vk65z, lex-yxky7]
scaffolds-from: [lex-vk65z, lex-yxky7, lex-mwgep]
evokes: [the-wallace-line, sea-depth-as-time-proxy, narrow-but-deep-strait, fifteen-miles-but-worlds-apart, geological-age-of-separation, hundred-fathom-line]
lineage:
  - source: primary
    text: wallace-1869-malay-archipelago-vol1
    citation: "Alfred Russel Wallace, *The Malay Archipelago* (Macmillan, London, 1869) Vol.1 'Physical Geography' chapter — the canonical first articulation of what later became known as the Wallace Line, a sharp faunal demarcation between the Bali-Lombok and Borneo-Celebes straits that separates Asiatic from Australian biogeographic realms. Wallace's substrate-move: the right diagnostic dimension of a barrier is not its CURRENT-PHYSICAL-WIDTH but its INFERRED-GEOLOGICAL-AGE; sea-depth serves as the operational proxy for time-since-subsidence. Bali-Lombock is the canonical compressed case: 15-mile-wide strait but deep (Australian deep ocean), so 15 miles separates biotic worlds 'differing as essentially in their animal life as Europe does from America.' Sumatra-Borneo by contrast: hundreds of miles but shallow (continental shelf, under 100 fathoms), so the biota are continuous with mainland Asia."
    quote: "[Wallace 1869 *Malay Archipelago* Vol.1:] 'we can draw a line among the islands, which shall so divide them that one-half shall truly belong to Asia, while the other shall no less certainly be allied to Australia' [line 544-547 — the eponymous Wallace Line claim.] 'Most naturalists now admit that these facts can only be explained by the greater or less lapse of time since the islands were upraised from beneath the ocean, or were separated from the nearest land; and this will be generally (though not always) indicated by the depth of the intervening sea' [lines 593-596 — the substrate-claim: depth-as-time-proxy.] 'The depth of sea produced by such subsidence will therefore generally be a measure of time; and in like manner, the change which organic forms have undergone is a measure of time' [lines 599-602 — the two-measures-correspond claim; depth and divergence are both clocks of subsidence.] 'The great contrast between the two divisions of the Archipelago is nowhere so abruptly exhibited as on passing from the island of Bali to that of Lombock' [lines 713-715 — locating the canonical compressed case.] 'The strait is here fifteen miles wide, so that we may pass in two hours from one great division of the earth to another, differing as essentially in their animal life as Europe does from America' [lines 721-724 — the pivotal observation; current-distance fails as predictor where age-of-isolation succeeds.] 'a shallow sea always intimates a recent land connexion' [line 754 — the converse form: shallow seas predict biotic continuity.] 'Nowhere does the ancient doctrine--that differences or similarities in the various forms of life that inhabit different countries are due to corresponding physical differences or similarities in the countries themselves--meet with so direct and palpable a contradiction' [lines 780-784 — Wallace explicitly contrasts the time-of-isolation explanation against the physical-conditions explanation; this is the layer-2 sharpening of lex-yxky7 which establishes the upstream ancestry-via-barriers claim.] 'Borneo and New Guinea, as alike physically as two distinct countries can be, are zoologically wide as the poles asunder' [lines 784-786 — the natural-experiment statement: physical-similarity controlled, divergence still maximal, therefore physical-conditions cannot be the key variable.]"
  - source: practitioner
    text: huxley-1868-wallace-line-naming
    citation: "Thomas Henry Huxley (1868), 'On the Classification and Distribution of the Alectoromorphae and Heteromorphae,' Proceedings of the Zoological Society of London, p.294-319 — the paper in which Huxley first applied the name 'Wallace's Line' to the demarcation Wallace had identified, naming the line after its discoverer. Memory-level cite (paper is freely available via Biodiversity Heritage Library; no quote is pulled here since the essential substrate-claim is already in Wallace 1869). Documents the rapid practitioner-adoption of Wallace's empirical claim as a named-feature of biogeography. No verbatim quote is claimed here."
  - source: practitioner
    text: mayr-1944-wallace-line-revised
    citation: "Ernst Mayr (1944), 'Wallace's Line in the Light of Recent Zoogeographic Studies,' Quarterly Review of Biology 19(1):1-14 — the canonical 20th-century reassessment. Mayr documents that subsequent fieldwork has located the sharp boundary slightly east of Wallace's original line (Weber's Line at the Sahul-Sunda shelf-break is the modern sharper-edge variant) but confirms Wallace's underlying claim: sea-depth-as-time-proxy predicts faunal-divergence better than current-physical-distance. Memory-level cite; the substrate-claim is Wallace's 1869 original. Cross-attests that the underlying claim survives refinement of the specific line-placement. No verbatim quote is claimed here."
canonical-instances:
  - "the Bali-Lombock strait (Wallace 1869 Vol.1, lines 713-724): 15 miles of water, fully visible across, but deep — the strait separates Oriental from Australian biogeographic realms with no overlap in characteristic mammals (cockatoos vs barbets, marsupials vs placentals). Current-distance is small; inferred-time-of-isolation is large (deep subsidence indicates ancient separation). The diagnostic mismatch between width and divergence is what made Wallace's discovery a substrate-novel claim rather than a restatement of barrier-as-explanation"
  - "Java-Sumatra-Borneo continental shelf (Wallace 1869 Vol.1, lines 618-687): hundreds of miles of intervening sea, but shallow throughout (under 100 fathoms; ships can anchor anywhere). The 100-fathom line accurately predicts mainland-Asia faunal affinity: islands within it share continental-Asia species (elephant, tapir, rhinoceros) which could not have crossed deep water; islands outside it show progressively divergent biota. The 100-fathom contour operationalizes 'time-since-separation' as a continuous geological-empirical variable"
  - "the Borneo–New Guinea natural experiment (Wallace 1869 Vol.1, lines 769-789): two large equatorial-tropical forested islands with similar climate, similar topography, similar geological structure — but zoologically 'as wide as the poles asunder.' Wallace explicitly stages this as a controlled-comparison-experiment: physical-conditions are matched, so observed biotic divergence cannot be explained by them; therefore the explanatory load falls on inferred-history-of-isolation. The natural-experiment frame is operationally adjacent to Diamond-Robinson 2011's *Natural Experiments of History* methodology in social science"
  - "the converse rule (Wallace 1869 Vol.1, line 754): 'a shallow sea always intimates a recent land connexion.' The diagnostic rule runs both directions — deep sea predicts long-ancient isolation (and thus high divergence); shallow sea predicts recent connection (and thus low divergence). This bidirectional inference is what makes sea-depth a substrate-mechanism, not just a heuristic correlation"
  - "operationally distinct from lex-yxky7 biotic-distribution-tracks-ancestry-via-barriers-not-similar-physical-conditions: lex-yxky7 is the LAYER-1 claim that barriers (not physical-conditions) explain biotic distribution. Wallace 1869's specific contribution is the LAYER-2 sharpening: WHICH dimension of a barrier matters? Wallace's answer — inferred-time-of-isolation (operationalized via sea-depth), not current-physical-distance (operationalized via strait-width). The Bali-Lombock case directly falsifies the width-as-barrier-measure hypothesis. lex-yxky7 establishes barriers > conditions; lex-z7dbd establishes age-of-barrier > width-of-barrier"
  - "operationally adjacent to lex-mwgep path-dependence: the depth-as-time claim IS a path-dependence claim — the current biotic state depends on the geological-history of land-connection patterns, not on the current configuration. Subsidence at time T₀ initiates isolation; divergence accumulates as a function of T-now minus T₀; current sea-depth proxies T₀. The full dependency chain is path-dependent in lex-mwgep's sense"
  - "operationally adjacent to lex-vk65z convergent-independent-evidence-streams-warrant-claim-acceptance: Wallace's argument layers multiple independent evidence streams — sea-depth bathymetry (geological), faunal composition (zoological), endemism patterns (biogeographic), congruent volcanic-subsidence theory (geophysical). No single stream is decisive; their convergence is what makes the time-since-isolation claim warrant-acceptance even without complete mechanism. Same epistemic pattern as Wegener-style multiple-streams argument"
  - "operationally adjacent to lex-vacza present-processes-extrapolated-over-time-explain-historical-record: Wallace explicitly cites Lyell's uniformitarian doctrine — gradual subsidence over geological time produces accumulated depth in the intervening sea. The time-as-depth claim depends on uniformitarian gradualism (slow continuous change) rather than catastrophist creation; without Lyellian gradualism the depth-time correspondence does not hold"
  - "operationally adjacent to lex-eadyj: the divergence accumulating across the Wallace Line IS branching descent in time-since-isolation form. Two populations sharing a common ancestor at T₀ diverge as independent lineages thereafter; the Wallace Line marks where the divergence is empirically maximal in the Malay Archipelago. The atom locates the temporal-isolation mechanism that produces the branching pattern"
  - "20th-century refinement (Mayr 1944; Weber's Line 1902): Wallace's specific line-placement has been refined — Weber's Line at the Sahul-Sunda shelf-break captures the sharper edge of the Australian-affinity biota; Wallace's original line is closer to the Asian-affinity boundary. The underlying substrate-claim (time-since-isolation > current-distance) survives refinement; the empirical line-placement is the operational instantiation that has been updated"
critical-questions:
  - "the depth-as-time-proxy is calibrated by subsidence-rate, which varies regionally: how reliable is sea-depth as a clock for separation-age across different geological contexts? Wallace's archipelago has volcanic-driven subsidence at known rates; other regions (passive margins, transform-fault edges) subside at different rates so the same depth implies a different age. The substrate-claim survives the local-calibration question (time-of-isolation > current-distance is the foundational comparison; the operationalization via sea-depth is locally-tuned)"
  - "intermediate cases (Sulawesi/Celebes): the line is not crisp everywhere. Sulawesi has both Oriental and Australian affinities, and modern biogeography places Wallace's Line through the Makassar Strait (between Borneo and Sulawesi) rather than further east. How sharp does the boundary need to be for the substrate-claim to hold? Wallace's own answer (Vol.1 line 762-789) treats Sulawesi as an intermediate; subsequent work has refined the geography but not overturned the depth-as-time-proxy mechanism"
  - "the natural-experiment vulnerability: Wallace's Borneo–New Guinea comparison treats physical-conditions as controlled because the two islands resemble each other on coarse-grain variables (climate, topography, geology, vegetation-type). What if a fine-grain physical variable IS the decisive one and Wallace simply did not measure it? Mitigation: the consilience with sea-depth-as-time-proxy (multiple independent strands, not just the natural-experiment) is what saves the claim from the fine-grain-variable-objection"
  - "differential from lex-yxky7 ancestry-via-barriers: when do we attribute biotic divergence to lex-yxky7 (ancestry-via-barriers, the layer-1 claim) versus lex-z7dbd (time-since-isolation, the layer-2 dimensional sharpening)? lex-yxky7 fires when the question is 'why are biota different?' (answer: barriers, not conditions). lex-z7dbd fires when the question is 'which BARRIERS matter most?' (answer: age-of-barrier > width-of-barrier). The two compose; lex-z7dbd presupposes lex-yxky7"
status: active
