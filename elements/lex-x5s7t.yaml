id: lex-x5s7t
name: natural-claims-are-tested-by-exhaustive-comparative-survey
type-in: claim
type-out: process
_tier: atomic
agent-instruction: "A claim that some arrangement is simply 'natural' can be tested and refuted by an exhaustive comparative survey across the relevant category -- checking whether the arrangement actually appears as a general pattern, a rare partial exception, or a total anomaly once every comparable case is examined, rather than assuming the label 'natural' is self-evidently earned. Gilman runs the survey directly against the assumption that female economic dependence on males is simply how animals work: 'We are the only animal species in which the female depends on the male for food... It is commonly assumed that this condition also obtains among other animals, but such is not the case. There are many birds among which, during the nesting season, the male helps the female feed the young, and partially feeds her... In no case does she depend on him absolutely, even during this season, save in that of the hornbill... The female bee and ant are economically dependent, but not on the male... In no case is the female throughout her life supported by the male.'"
related: []
evokes: [women-and-economics, chapter-i, the-only-animal-species-in-which-the-female-depends-on-the-male, in-no-case-is-the-female-throughout-her-life-supported-by-the-male, appeal-to-nature-tested-by-comparative-biology]
lineage:
  - source: primary
    text: gilman-1898-women-and-economics-chapter-i
    citation: "Charlotte Perkins Gilman, Women and Economics: A Study of the Economic Relation Between Men and Women as a Factor in Social Evolution (Boston: Small, Maynard & Company, 1898), Chapter I. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "We are the only animal species in which the female depends on the male for food, the only animal species in which the sex-relation is also an economic relation. [...] It is commonly assumed that this condition also obtains among other animals, but such is not the case. There are many birds among which, during the nesting season, the male helps the female feed the young, and partially feeds her; and, with certain of the higher carnivora, the male helps the female feed the young, and partially feeds her. In no case does she depend on him absolutely, even during this season, save in that of the hornbill, where the female, sitting on her nest in a hollow tree, is walled in with clay by the male, so that only her beak projects; and then he feeds her while the eggs are developing. But even the female hornbill does not expect to be fed at any other time. The female bee and ant are economically dependent, but not on the male. [...] In no case is the female throughout her life supported by the male."
canonical-instances:
  - "A defender of a corporate hierarchy claims layered management is simply the natural way any organization scales, until a comparative survey of successful flat, cooperative, and holacratic organizations shows layered hierarchy is one option among several viable structures, not an inevitability."
  - "A claim that competitive, zero-sum negotiation is just human nature is tested against an anthropological survey of gift-economies, commons-management systems, and consensus-based cultures, revealing competitive negotiation as one strategy among many that different societies have actually used, not a universal default."
  - "A claim that romantic monogamy is the natural mating pattern for mammals is checked against a survey of actual mammalian species, most of which are not sexually monogamous, revealing the claim to describe a minority pattern dressed up as a biological default."
critical-questions:
  - "Does finding exceptions in other species actually refute a claim about what's natural for humans specifically, or does the argument only work if you already accept that human and animal social arrangements should be judged by the same standard in the first place?"
  - "A survey framed to find the human pattern uniquely anomalous could equally well be framed to find some other feature of human sociality uniquely natural by comparison to a different reference class -- how do you know the comparison category chosen wasn't picked because it produced the desired result?"
  - "Even if human female economic dependence really is a biological outlier, does that by itself establish it's a bad or unjustified arrangement -- uniqueness and undesirability are logically separate claims, and the survey only establishes the first."
