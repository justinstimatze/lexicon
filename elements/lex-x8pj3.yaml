lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Self-Reference and Meaning in Ordinary Language' (first published in Mind, N.S. 63, 1954), Ch. 14 of Conjectures and Refutations (Routledge Classics, 2002), p.413. Two brief tangential asides are elided with ellipses: Popper's own row of dots depicting Theaetetus's inaudible speech (a device internal to the text, not a citation mark) and a short exchange about Euclid the Geometrician between the two examples."
    quote: "S. Could you produce an example of a self-referring assertion which is empirically true? Th. I said: 'I am now speaking so softly that dear old Socrates cannot make out what I am saying.' S. I like this example; and I cannot deny that, when you were speaking so softly, you were speaking truthfully. Nor can I deny the empirical character of this truth; for had my ears been younger, it would have turned out an untruth. ... Th. What I am now saying is meaningful. S. If you don't mind I shall try to prove your theorem myself. For the purpose of a reductio I begin with the assumption that your last utterance was meaningless. This, however, turns out to contradict your utterance, and thus to entail the falsity of your utterance. But if an utterance is false, then it must clearly be meaningful. Thus my assumption is absurd; which proves your theorem."
canonical-instances:
  - "A team's postmortem states 'this incident report is complete.' Whether that's true depends entirely on an external fact -- whether some cause actually got left out -- the same way Theaetetus's soft-speaking claim depended on Socrates's hearing; a sharper investigation next month could still show it false, the way better ears would have."
  - "A contract clause reads 'this agreement is legally binding on both signatories.' Under the right formal conditions (competent signatories, valid consideration, no external law voiding it) the clause's binding force follows from the act of signing a document that says so -- structurally closer to the reductio-provable case than to a claim that depends on some separate, later-checkable fact."
critical-questions:
  - "Isn't a binding-contract clause still checkable against contract law, so how is it really like the logically self-certifying case? The contrast isn't checkable versus totally unquestionable -- it's about where the check has to look. A soft-speaking claim needs a fact about someone's hearing, external to the sentence and the rules governing it. A binding-clause claim, given valid formal conditions, is settled by the rules constituting the practice of signing agreements rather than by some separate empirical fact discovered afterward -- closer in structure to Socrates's reductio than to the soft-speaking case, even though contract disputes obviously do get litigated."
  - "Doesn't Gödel's incompleteness mean even logically self-certifying statements can fail? Gödel's theorem is about a different question entirely -- whether every true arithmetical statement is provable within a given formal system. It says nothing about whether Socrates's specific reductio, proving that Theaetetus's claim is meaningful, is itself valid. The second category here is 'provable from the statement's own logical form,' which is the exact category Gödel's own construction relies on to work at all -- his result is a spectacular demonstration of that category in action."
