id: lex-b95eb
name: leader-inaccessibility-lets-intimates-filter-and-distort-decisions
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a leader delegates all contact with the people they govern to a small circle of aides or gatekeepers, don't treat this only as a status or workload question — treat it as a decision-quality failure mode, because Kautilya names the specific mechanism by which inaccessibility produces bad decisions rather than merely bad optics: 'When a king makes himself inaccessible to his people, and he is seen [only] by those near him, wrong decisions are bound to be made; the people will become angry and may go over to the enemy.' The causal chain is explicit and has two independent failure points, not one: first, being 'seen only by those near him' means the leader's picture of reality is whatever the intimates around him choose to filter through — the wrong-decisions consequence follows directly from that narrowed information channel, not from the leader's personal competence; second, and separately, the people being shut out perceive the inaccessibility itself as a grievance regardless of whether any given decision turns out fine, which erodes loyalty independent of decision quality. Kautilya pairs the accessibility principle with a specific queuing rule for when a leader does open himself up to direct contact: hear people in a default order weighted toward those with the least other recourse (the aged, the sick, the handicapped, the helpless, minors) — 'except in cases where a matter... is more urgent or more important' — and resolve urgent matters immediately rather than letting them wait in the default queue, 'for, postponement makes them more difficult and [sometimes] even impossible to settle.' The queuing rule matters because accessibility without a workable structure just recreates the same capture problem at one remove — whoever controls the queue order becomes the new filter — so the fix to inaccessibility is not merely 'be reachable' but 'be reachable through a structure that itself resists being captured by whoever is closest to you.' Diagnostic move: when a leader or executive's information about their own organization or constituency seems to consistently produce decisions that turn out worse than expected, check whether the leader has direct, unfiltered contact with people outside their immediate circle before assuming the problem is the leader's judgment — the two are often indistinguishable from the outside, but only one of them is fixed by changing who has access rather than by replacing the leader."
related: [lex-asrjw]
evokes: [king-inaccessible-wrong-decisions, seen-only-by-those-near-him, urgent-matters-heard-at-once, postponement-makes-it-harder-to-settle, gatekeeping-recreates-capture-at-one-remove]
lineage:
  - source: primary
    text: kautilya-arthashastra-inaccessible-king-wrong-decisions
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part III 'The King,' section 'Duties of a King,' {1.19.26-30}."
    quote: "'When a king makes himself inaccessible to his people, and he is seen [only] by those near him, wrong decisions are bound to be made; the people will become angry and may go over to the enemy.' 'A king shall, therefore, attend to the people in the order given below, except in cases where a matter [concerning one lower in the order] is more urgent or more important: gods and deities, hermits, heretics, Brahmins learned in the Vedas, cows, sacred places, minors, the aged, the sick, the handicapped, the helpless and women.' 'He should hear at once all urgent matters and not postpone them; for, postponement makes them more difficult and [sometimes] even impossible to settle.'"
canonical-instances:
  - "A CEO who only receives company information through a chief of staff and a small executive team discovers, only after a public failure, that frontline problems had been visible to junior staff for months — the filtering wasn't a competence failure on the CEO's part, it was a structural consequence of never being 'seen' by anyone outside the immediate circle."
  - "A hospital administrator sets 'open office hours' for any staff member to raise a concern directly, but staff quickly learn that whichever assistant schedules the queue decides what actually reaches the administrator and in what order — recreating the exact capture problem the open-door policy was meant to solve, because accessibility without a queue structure resistant to capture just moves the filter one layer down."
critical-questions:
  - "how would an organization actually verify that a leader's inaccessibility, rather than the leader's own judgment, is the cause of a string of bad decisions — is there a way to distinguish the two from outside the room, or does confirming this claim always require the leader's own retrospective admission that they were working from filtered information?"
  - "does the specific queue-priority list (gods, hermits, minors, the aged, the sick, the handicapped, the helpless, women) generalize as a PRINCIPLE (weight access toward those with the least alternative recourse) or does it only make sense within Kautilya's own religious and social hierarchy, with no clean modern translation of who counts as having 'the least other recourse'?"
  - "the urgent-matters-first override assumes urgency is knowable in advance of hearing the matter — how does a leader or their queue-structure distinguish a genuinely urgent matter from a petitioner's own claim that their matter is urgent, without that distinction itself becoming a new point of capture?"
status: active
