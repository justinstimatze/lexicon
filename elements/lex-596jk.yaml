lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Truth, Rationality, and the Growth of Scientific Knowledge' (prepared for the International Congress for the Philosophy of Science, Stanford, August 1960; partly delivered as Presidential Address to the British Society for the Philosophy of Science, January 1961), Ch. 10 of Conjectures and Refutations (Routledge Classics, 2002), pp.295-296, Section III."
    quote: "'Writing Ct(a) for \"the content of the statement a\", and Ct(ab) for \"the content of the conjunction a and b\", we have (1) Ct(a) <= Ct(ab) >= Ct(b). This contrasts with the corresponding law of the calculus of probability, (2) p(a) >= p(ab) <= p(b), where the inequality signs of (1) are inverted. Together these two laws, (1) and (2), state that with increasing content, probability decreases, and vice versa; or in other words, that content increases with increasing improbability... Thus if our aim is the advancement or growth of knowledge, then a high probability (in the sense of the calculus of probability) cannot possibly be our aim as well: these two aims are incompatible.'"
canonical-instances:
  - "Two candidate models both fit last quarter's churn data equally well. Model A predicts churn only in aggregate. The rival Model B breaks its prediction out by cohort, plan tier, and season, which gives it far more specific ways to fail. Model B is objectively less likely to survive next quarter's data unscathed -- and that is exactly why picking it, and watching whether it holds, teaches the team more than picking the safer Model A ever could."
  - "A researcher can publish 'stress affects health outcomes' (nearly unfalsifiable, true of almost any stressor and any outcome) or 'chronic cortisol elevation above threshold X for more than Y weeks produces measurable decline Z in immune marker W' (highly specific, easy to refute). The second claim is far less probable a priori -- most such precise numeric claims turn out to be wrong -- but a field that only ever publishes claims of the first kind never actually learns anything, because nothing it says could come back false."
critical-questions:
  - "Isn't this just telling scientists to prefer reckless overreach to careful modesty? No -- the criterion isn't 'prefer any bolder claim,' it's 'when otherwise comparable claims differ in content, prefer the one that says more and accept the resulting improbability as the cost of that gain.' A claim that is bold merely because it is vague or untestable doesn't have higher content in Popper's sense at all -- it has none, because nothing could contradict it. The content this atom is about is measured strictly in what the theory forbids -- how sweeping it sounds is irrelevant."
  - "Doesn't preferring low-probability theories mean science should expect most of its best theories to be false? Popper accepts this directly and treats it as the normal condition of a healthy field: a theory earns preference through being the most testable available rather than through being likely true, and the expectation is that most such theories, including good ones, will eventually be superseded -- see [[lex-dwbqd]] on a theory being judged by what it enables rather than by whether it's ultimately true."
