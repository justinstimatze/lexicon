id: lex-gcw83
name: righteous-stupidity-does-more-harm-than-wickedness
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When assessing what actually causes political and social catastrophe, don't reach first for malice -- Popper argues the more dangerous ingredient is sincere moral enthusiasm running on oversimple principles. Against Bertrand Russell's view that humanity is clever but wicked, Popper states his own first thesis: 'We are good, perhaps a little too good, but we are also a little stupid; and it is this mixture of goodness and stupidity which lies at the root of our troubles.' He explains the mechanism: 'The main troubles of our time... are not due to our moral wickedness, but, on the contrary, to our often misguided moral enthusiasm: to our anxiety to better the world we live in... our moral principles, which are sure to be over-simple, are often difficult to apply to the complex human and political situations to which we feel bound to apply them.' His own illustration is a 1942 pamphlet in which the Bishop of Bradford branded Western society 'immoral' and 'un-Christian,' declaring: 'when something is so plainly the work of the devil, . . . nothing can excuse a minister of the Church from working for its destruction' -- while the pamphlet itself supported Stalin's system. Popper's diagnosis: 'moral fervour blinded him, and many like him, to facts which others could easily see; for example, to the fact that countless innocent people were being tortured in Stalin's prisons.' The Bishop wasn't lying or indifferent -- his moral conviction about his own society's flaws was sincere, and that same sincerity is what stopped him from applying equal scrutiny to the alternative he was defending. Popper's summary line: 'it seems to me possible that more people are killed out of righteous stupidity than out of wickedness.' Diagnostic move: when someone's moral condemnation of their own side is passionate, specific, and largely accurate, check whether that same passion is being applied with equal rigor to whatever alternative they're implicitly or explicitly defending. Sincerity and accuracy about one target are not evidence of accuracy about the comparison being drawn."
