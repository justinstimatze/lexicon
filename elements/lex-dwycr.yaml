id: lex-dwycr
name: algorithm-selected-at-runtime-from-family-behind-stable-interface
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When picking between algorithm variants at design time, surface that runtime algorithm-selection behind a stable interface (Strategy pattern) lets the choice move with input shape — name it as a candidate distinct from branching or generics."
related: [lex-9akfh, lex-9nj6a, lex-z8m97, lex-gbmev, lex-p25q4, lex-ew7zx, lex-etfhv]
scaffolds-from: [lex-9akfh, lex-9nj6a]
evokes: [gof-strategy-pattern, policy-pattern, pluggable-algorithm, the-what-is-fixed-the-how-varies, runtime-dispatch, encapsulated-algorithm-family]
lineage:
  - source: practitioner
    text: wikipedia-strategy-pattern-2025-12
    citation: "Wikipedia 'Strategy pattern' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/Strategy_pattern). Underlying primary is Gamma, Helm, Johnson, Vlissides 1994 *Design Patterns: Elements of Reusable Object-Oriented Software* (Addison-Wesley). The substrate-claim: when multiple algorithms can produce the same result-type from the same input-type, encapsulate each algorithm in its own object behind a common interface so the CALLER (the Context) can select WHICH algorithm at runtime without knowing the algorithm-internals. The pattern decouples the caller from the algorithm-implementation while keeping the algorithm-family interface stable. The transferable shape is THE-WHAT-IS-FIXED-THE-HOW-VARIES: the contract (input/output type, behavioral guarantees) is fixed; the implementation (which specific algorithm) is interchangeable at runtime."
    quote: "[Wikipedia 'Strategy pattern', 2025-12 ZIM snapshot:] 'the strategy pattern (also known as the policy pattern) is a behavioral software design pattern that enables selecting an algorithm at runtime. Instead of implementing a single algorithm directly, code receives runtime instructions as to which in a family of algorithms to use.' [On the essential decoupling:] 'Strategy lets the algorithm vary independently from clients that use it.' [On the canonical use-case:] 'a class that performs validation on incoming data may use the strategy pattern to select a validation algorithm depending on the type of data, the source of the data, user choice, or other discriminating factors. These factors are not known until runtime and may require radically different validation to be performed. The validation algorithms (strategies), encapsulated separately from the validating object, may be used by other validating objects in different areas of the system (or even different systems) without code duplication.' [On the operational structure:] 'the Context class does not implement an algorithm directly. Instead, Context refers to the Strategy interface for performing an algorithm (strategy.algorithm()), which makes Context independent of how an algorithm is implemented. The Strategy1 and Strategy2 classes implement the Strategy interface, that is, implement (encapsulate) an algorithm.' [The substrate-claim: the WHAT (compute-a-result-of-type-X-from-input-of-type-Y) is fixed by the Strategy interface; the HOW (which specific algorithm) is selected at runtime from the encapsulated family. One of the 23 GoF behavioral patterns (Gamma-Helm-Johnson-Vlissides 1994).]"
canonical-instances:
  - "Validation: select a validation algorithm at runtime based on the data-source (form input vs file upload vs API call), the data-type (email vs phone vs URL), or user-context (anonymous vs authenticated). The validating object delegates to a Strategy object."
  - "Sorting algorithms: a list-sorting function might accept a comparator (Strategy) — Java's `Collections.sort(list, comparator)`; the WHAT (sort the list) is fixed; the HOW (which compare function) is runtime-selected."
  - "Payment processing: an e-commerce checkout might delegate to one of many payment-strategy objects (credit-card, PayPal, Apple-Pay, crypto) selected based on user choice. The Context (checkout flow) doesn't know the payment-specifics; just calls strategy.charge(amount)."
  - "Authentication: a single authentication-entry-point delegates to one of many auth-strategy objects (password, OAuth, SSO, biometric) selected per session-context. Adding new auth-methods doesn't require changing the entry-point code."
  - "Compression: tar/zip/gzip/bzip2 selection at runtime; the WHAT (compress a byte stream) is fixed; the HOW (which compression algorithm) is configurable."
  - "Machine-learning model serving: a prediction-API selects which trained-model to use (A/B testing, canary deployment, multi-variate). The API contract is stable; the model is the strategy."
  - "operationally distinct from lex-9akfh decoupling-via-indirection: lex-9akfh names the broad design-rule (interpose an abstraction to allow either side to change); lex-dwycr is the specific operational case where the abstraction is an algorithm-family encapsulated behind a stable interface with runtime-selection. Other GoF patterns (observer, adapter, bridge) also instantiate lex-9akfh with different operational shapes."
  - "operationally distinct from lex-9nj6a composition-over-inheritance: lex-9nj6a is the meta-rule (prefer composing objects over inheriting from a class hierarchy); lex-dwycr is the canonical concrete instantiation in algorithm-selection. Subclassing for each algorithm-variant violates lex-9nj6a; strategy-pattern is the lex-9nj6a-compliant alternative."
  - "operationally distinct from lex-gbmev observer-pattern: observer is about state-change-notification (one subject many observers); strategy is about algorithm-selection (one caller delegates to one strategy at a time, swappable). Different operational topologies; both decouple via interface."
  - "compose-related with lex-z8m97 gof-decorator: decorator wraps to add behavior; strategy delegates to swap behavior. Both behavior-customization but at different decomposition axes (decorator stacks layers; strategy substitutes implementations)."
critical-questions:
  - "when is strategy wrong vs simple-conditional? If the algorithm-family is small (2-3) and fixed at compile-time, a switch/match-expression may be clearer than a Strategy-object hierarchy. Strategy pays off when (a) the family is open-ended (new algorithms get added over time), (b) algorithms have state or complex internal structure, (c) algorithms come from different teams or libraries. For 2 algorithms hard-coded at compile-time, conditional may be simpler."
  - "what should the Strategy interface include? Just the algorithm-method, or also configuration, validation, metadata? Too-narrow interface forces context to special-case strategies; too-wide interface couples strategies to context's other needs. Practitioner-discipline: include only what every strategy MUST provide; promote shared-but-optional concerns to a separate trait/mixin."
  - "where does the strategy-selection logic live? In the Context (creating coupling between Context and strategy-set); in a Factory (decouples but adds infrastructure); or in the caller-of-Context (pushes responsibility up but may duplicate). Factory + dependency-injection is the canonical scalable answer but adds setup-complexity; simpler alternatives may be fine for smaller systems."
  - "does the substrate-claim require object-orientation? The Wikipedia article describes it in OO terms but explicitly notes that function-pointers, first-class-functions, and reflection are all equivalent mechanisms. In FP, strategy IS just passing a function (higher-order-function with a known signature). The substrate-claim is the TOPOLOGY (runtime-selection from interface-conformant family), not the OO implementation."
severity-tier: info
status: active
