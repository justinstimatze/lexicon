id: lex-dvb4u
name: using-institutional-power-to-the-hilt-breaks-the-system-granting-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you or your side holds a legal prerogative — a veto, a procedural tool, a discretionary power, a majority — and face the temptation to deploy it to its absolute maximum extent against a rival, recognize that 'technically legal' is not the same test as 'sustains the system that grants you this power.' Levitsky & Ziblatt (How Democracies Die, 2018, Ch.5-6) name the discipline of NOT doing this institutional forbearance ('patient self-control...restraint from exercising a legal right'), and name its violation — borrowing Mark Tushnet's term — constitutional hardball: 'playing by the rules but pushing against their bounds and playing for keeps.' Every institution with real power runs on gaps its rules never anticipated (the U.S. Constitution doesn't specify Supreme Court size, decree authority, or pardon limits); the system survives only because power-holders voluntarily underuse what they are legally permitted to do. Concrete instances of forbearance abandoned: Perón impeaching 3 of 5 Argentine Supreme Court justices; Menem issuing 336 decrees (versus a historical average of a handful per term); FDR's 1937 court-packing attempt ('extraordinary in its hubris,' defeated by bipartisan backlash). The diagnostic: before exercising a legal power to its maximum extent against a rival, ask whether you would accept your rival using the identical power, at the identical intensity, against you the next time the roles reverse — because once one side plays to the hilt, forbearance rarely survives as a unilateral practice; the other side escalates in kind."
related: [lex-gt9kt, lex-cahck]
scaffolds-from: [lex-cahck]
evokes: [institutional-forbearance, constitutional-hardball, playing-for-keeps, unwritten-rules, playing-to-the-hilt]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch5-6
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 5 'The Guardrails of Democracy' and Chapter 6 'The Unwritten Rules of American Politics.' The authors borrow 'forbearance' from Alisha Holland (2016) and 'constitutional hardball' from Mark Tushnet (2004); their own contribution is naming forbearance and mutual toleration [lex-cahck] as democracy's two load-bearing unwritten norms and tracing their erosion across Argentina, Venezuela, Chile, Weimar Germany, and the contemporary United States."
    quote: "Where norms of forbearance are strong, politicians do not use their institutional prerogatives to the hilt, even if it is technically legal to do so, for such action could imperil the existing system. [...] The opposite of forbearance is to exploit one's institutional prerogatives in an unrestrained way. Legal scholar Mark Tushnet calls this 'constitutional hardball': playing by the rules but pushing against their bounds and 'playing for keeps.' It is a form of institutional combat aimed at permanently defeating one's partisan rivals — and not caring whether the democratic game continues. [...] For a presidential democracy to succeed, institutions that are muscular enough to check the president must routinely underuse that power."
canonical-instances:
  - "Argentina's decree authority: elected presidents issued a combined 25 decrees between 1853 and 1989 out of forbearance; Carlos Menem issued 336 in under one term once he decided the ambiguous constitutional clause permitted it — technically legal at every step, systemically destabilizing in aggregate."
  - "FDR's 1937 court-packing plan: at the peak of his popularity, having just won reelection with 61% of the vote, Roosevelt proposed expanding the Supreme Court specifically to add friendly justices — constitutionally permitted (Article III doesn't fix the Court's size) but norm-violating; it was defeated by his own party's Congress and never attempted again by any subsequent president."
  - "The Senate filibuster, pre-1917: any senator could block any bill indefinitely by refusing to yield the floor, yet this 'procedural weapon of last resort' saw only roughly 23 uses across the entire 19th century — the tool's existence didn't compel its use; forbearance did."
  - "A workplace or negotiating-table instance: a manager with the legal or contractual right to fire at will, or a party to a contract with a technically-enforceable penalty clause, who exercises that right to its maximum extent at every opportunity rather than reserving it for genuine cause — eroding the working relationship's ability to function even though every individual exercise was within their rights."
critical-questions:
  - "is the power being used because the situation genuinely requires it, or because it is available and the rival cannot yet retaliate in kind? Forbearance is a discipline exercised precisely when you COULD go further, not a constraint that only binds when you couldn't anyway."
  - "how does this differ from lex-eqy5r (rule-system-hack-faces-patch-or-normalize)? lex-eqy5r is about how a THIRD PARTY resolves a discovered exploit in a rule system (patch it or declare it legitimate) — a question of what happens to a hack after the fact. This atom is about a POWER-HOLDER's own choice not to exploit a gap in the rules against a rival in the first place — a first-person discipline, not a downstream resolution."
  - "how does this differ from lex-cahck (mutual toleration / existential-threat framing)? They are closely linked but distinct: mutual toleration is a belief-state (do you regard your rival as legitimate or as an existential threat), while forbearance is a behavioral discipline (do you restrain your own use of legal power). The book's own account: the two normally reinforce each other in a virtuous circle, but either one's collapse can trigger the other's — an existential-threat framing licenses abandoning forbearance, and abandoned forbearance (being on the receiving end of hardball) makes existential-threat framing feel justified in return."
  - "when is maximal use of a legal power actually correct rather than hardball? When the power is being exercised in defense against an opponent who has already abandoned forbearance first, or when the norm itself is illegitimate (built to entrench an unjust status quo, as with Jim Crow-era 'legal' disenfranchisement) — forbearance toward a system that is itself the problem is not the same virtue as forbearance between legitimate rivals operating in good faith."
severity-tier: warning
