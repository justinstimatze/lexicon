lineage:
  - source: primary
    text: radin-earthmaker-grants-wakdjunkaga-power-then-disclaims-its-misuse
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Attitude of the Winnebago Toward Wakdjunkaga,' quoting the Winnebago myth The Two Boys. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Firstborn, you are the oldest of all those I have created. I created you good natured: I made you a sacred person. I sent you to the earth to remain there so that human beings would listen to you, honour you and obey you and that you might teach them by what means they could secure a happy life. This was the purpose for which you were created. What happened to you after you reached the earth that you brought upon yourself alone. It is because of your own actions and activities that you became the ... butt of everyone's jest, that everyone took advantage of you, even the smallest of insects. How is it then that now you are presenting as a model to be followed that very individual, Hare, who did do what I told him to? You, although you were given the greatest of powers, made light of my creation. It was not anything I told you to do. It is therefore your own fault if people call you the Foolish-One. I created you to do what your friend Hare actually did. I did not create you to injure my creation."
canonical-instances:
  - "A venture capital firm that funded a startup with generous, unrestricted capital and minimal oversight later distances itself from the founder's fraud, pointing out publicly that the money and trust given were real and substantial, and that what the founder chose to do with them was entirely the founder's own decision."
  - "A parent who provided a child with every advantage, tutoring, connections, financial support, later refuses to accept any responsibility when the child squanders those advantages through reckless choices, insisting that giving the resources and being responsible for how they were used are simply two different things."
critical-questions:
  - "Does Earthmaker's disclaimer hold up given that he also created the world Wakdjunkaga operates in and set the conditions, including leaving evil beings uncreated by him but still present, that Wakdjunkaga has to navigate, or does full responsibility-transfer require more context than the speech alone provides?"
  - "Is there a meaningful difference between a grantor who provided genuinely sufficient resources and support and one who provided the form of a grant while withholding something the recipient actually needed to succeed, and does this diagnostic risk treating both the same?"
  - "At what point does a grantor's ongoing failure to correct or constrain repeated misuse of granted power make the disclaimer less credible, since Earthmaker's speech comes only after Wakdjunkaga has already become 'the butt of everyone's jest,' well after the pattern was established?"
status: active
