evokes: [reap-what-you-sow, sow-wind-reap-whirlwind, chickens-come-home-to-roost, hosea-8-7, consequence-tail, externalized-cost-eventual-return, karma-as-structural-feedback, action-propagation, buffering-is-finite, proverb-tradition-cross-cultural-attestation]
