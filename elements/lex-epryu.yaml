    quote: "“Statements A and not-A are contradictory in a way that choosing x alone from {x, y} and y alone from {x, y, z} cannot be. If the pair of choice acts were to entail, respectively, the statements (1) x is a better alternative than y, and (2) y is a better alternative than x, then of course there would be a contradiction here (since ‘being better than’ is an anti-symmetric relation). But those choices do not in themselves entail any such statements (until some motivational presumptions are made). Given some ideas as to what the person is trying to do (this is an external correspondence), we might be able to interpret these actions as implied statements. But we cannot do that without invoking such an external reference. It is hard to think that there can be such a thing as purely internal consistency of choice.”"
canonical-instances:
  - "Hypothetical: An analytics dashboard flags a user as 'behaviorally inconsistent' for clicking the top search result on Monday and a lower-ranked result on Tuesday for what looks like the same query. The flag assumes the user is always trying to satisfy the same fixed intent -- drop that assumption (Tuesday's query had different context, or the user was exploring rather than converting) and there's no inconsistency left to explain, just two different situations."
  - "Hypothetical: A performance review calls an employee inconsistent for approving a rushed request last quarter and rejecting a similar one this quarter. The reviewer never states what fixed standard the employee is supposed to be applying across both decisions -- once someone actually asks what changed (staffing, the requester's track record, the deadline's real flexibility), the two decisions turn out to be answers to two different questions, wearing the same request as a disguise."
critical-questions:
  - "Doesn't this make it impossible to ever call anyone's behavior inconsistent, since you can always invent some hidden motivational difference to explain away any pair of choices? The point isn't that inconsistency can never be established -- it's that establishing it requires actually specifying the motivational assumption under which the choices conflict, then checking whether that assumption is plausible. An unfalsifiable excuse invented after the fact is different from a stated, checkable assumption that the choices are supposed to share."
  - "If judging consistency always requires assuming a motive, doesn't that make revealed-preference theory's whole promise -- explaining behavior from behavior alone -- circular from the start? That's close to Sen's own conclusion: the promise of explaining choice 'without reference to anything other than behaviour' quietly smuggles in the very motivational assumption it claims not to need, the moment it calls any pair of choices consistent or inconsistent."
