id: lex-abza8
name: a-ban-on-moving-or-altering-something-protects-a-single-sanctioned-meaning
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "A rule against moving, touching, or altering something is often described as protecting the object itself, but its deeper function can be protecting a single, official meaning of that object from ever multiplying into several -- because meaning is created by context, and forbidding a thing from changing context is the most direct way to forbid it from meaning more than one thing. Hyde draws this out by contrast: Odysseus is permitted to carry an oar inland, where a whole village mistakes it for a winnowing fan, and no rule is broken -- 'there is no prohibition on carrying an oar inland, so any traveler may multiply its meanings.' Apollo's cattle are different only because a rule exists: 'there is a prohibition on moving the cattle of Apollo; only a thief can make them signify.' From this Hyde draws the general principle: 'a prohibition on theft is an attempt to constrain meaning, to stop its multiplication, to preserve an \"essence,\" the \"natural,\" the \"real.\"' The rule isn't primarily about keeping the cattle in one place; it's about keeping their meaning singular -- immortal, sacred, untouchable -- by making sure no one can put them in a new context where they'd start meaning something else. Diagnostic move: when you encounter a rule against moving, altering, or repurposing something that seems out of proportion to any practical harm the movement itself would cause, ask what fixed, singular meaning that rule is actually protecting -- the prohibition may be less about the object's location than about preventing the object from acquiring a second, competing meaning."
