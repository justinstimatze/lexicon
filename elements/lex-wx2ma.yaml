id: lex-wx2ma
name: technology-impact-is-overestimated-short-run-underestimated-long-run
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When forecasting tech impact, surface Amara's law — overestimated short-run, underestimated long-run; the disappointment + later surprise are predictable shape, not failure to forecast."
related: [lex-vacza, lex-mwgep, lex-36cbh, lex-n5jed, lex-9an5g, lex-tqdhs, lex-8pv2b, lex-58ynk, lex-jd7fe, lex-9zjpf, lex-raydk, lex-d234k, lex-kykwm, lex-b6gyc, lex-2apyb, lex-697ka, lex-qa6hc, lex-kj6tj, lex-d73nj, lex-x9sda, lex-3656j, lex-cqvnu, lex-5tpy8, lex-cgbrt, lex-afzzp, lex-ktpxs, lex-m8j35, lex-tqd9x, lex-f2ktw, lex-2kbpp]
scaffolds-from: [lex-vacza, lex-mwgep, lex-n5jed]
evokes: [amaras-law, roy-amara, institute-for-the-future, hype-cycle, we-overestimate-the-short-run, s-curve-of-adoption]
lineage:
  - source: practitioner
    text: wikipedia-list-of-eponymous-laws-amara
    citation: "Wikipedia 'List of eponymous laws' / 'Amara's law' (en-wp; retrieved via local ZIM dump -> local Wikipedia archive, 2026-05-29). Attributed to Roy Amara (1925-2007), researcher and president of the Institute for the Future. The substrate-claim: forecasts of a new technology's impact are systematically biphasic in their error — the SHORT-run effect is over-estimated (initial hype outruns what the immature technology and its missing complements can deliver, producing disappointment) while the LONG-run effect is under-estimated (once enabling complements, falling costs, and second-order uses compound, the eventual impact exceeds what near-term linear thinking projected). The two errors are linked: the early over-shoot of expectation is what produces the trough of disillusionment from which the genuinely large long-run effect later emerges. Gartner's hype cycle is the popular operationalisation of the same shape. No single primary text; widely attested; logged for a sourced upgrade if a primary is found."
    quote: "[Amara, as canonically quoted via the eponymous-laws list:] 'We tend to overestimate the effect of a technology in the short run and underestimate the effect in the long run.'"
canonical-instances:
  - "the Gartner hype cycle (peak of inflated expectations -> trough of disillusionment -> slope of enlightenment -> plateau of productivity): a commercial codification of Amara's law — early excitement overshoots deliverable reality, a disappointment trough follows, and the durable productive impact arrives later and larger than the trough mood suggests"
  - "the internet, GPS, electricity, and machine learning each followed the curve: over-hyped or dismissed early (the 1990s information-superhighway froth; GPS as a niche military toy), then their compounding long-run effect (e-commerce, ride-hailing, ubiquitous navigation) dwarfed both the early hype AND the post-bust pessimism. The long-run under-estimate is the more consistent error"
  - "the practitioner trap of straight-line extrapolation: near-term forecasts extrapolate the CURRENT immature form linearly, missing that complements (infrastructure, falling unit costs, new use-cases, behavioural adaptation) arrive non-linearly. Amara's law is a standing correction to linear extrapolation of a technology in its disappointing early phase"
  - "operationally adjacent to lex-vacza present-processes-extrapolated-over-time-explain-historical-record: lex-vacza is uniformitarian extrapolation done RIGHT (project known steady processes across deep time). lex-wx2ma is the systematic ERROR mode of extrapolating an immature, fast-changing technology — the process is not steady, so linear projection over-shoots short-term and under-shoots long-term. The contrast sharpens both: extrapolation is sound when the underlying rate is stable, biased when it is itself accelerating"
  - "operationally adjacent to lex-mwgep positive-feedback-amplifies-early-events-into-locked-in-trajectories: the long-run UNDER-estimate is largely a failure to price in positive-feedback and compounding — adoption, network effects, and cost-learning curves (lex-mwgep lock-in dynamics) make the eventual impact super-linear, which near-term linear forecasts cannot see. The short-run OVER-estimate is the mirror error: expecting the compounding before its enabling complements exist"
critical-questions:
  - "which horizon is this forecast about — and is it making the matching error? Near-term claims about a hyped technology are probably over-stated (missing complements, immature form); long-term dismissals are probably under-stated (ignoring compounding). Adjust in the direction the law predicts for the horizon in question"
  - "what COMPLEMENTS does the long-run impact depend on, and are they arriving? The long-run under-estimate is usually a failure to imagine the infrastructure, cost declines, and second-order uses that have not appeared yet. Ask what would have to become cheap or ubiquitous, not just what the technology does today"
  - "are you extrapolating a stable rate or an accelerating one? Amara's bias is specific to fast-changing technologies. For a genuinely steady process, straight-line extrapolation (lex-vacza) is fine; for one on a steep cost or adoption curve, both the short- and long-run linear projections will be wrong in the law's two directions"
  - "is current disappointment evidence of failure, or the expected trough? A technology underperforming its hype is consistent with later large impact — the trough is part of the curve, not a refutation. Distinguish 'over-hyped but real' from 'genuinely doesn't work', because Amara's law warns against over-reading the disillusionment phase"
status: active
