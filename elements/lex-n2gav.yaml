    quote: "'an enemy's destruction shall be brought about even at the cost of great losses and expenses. For fighting the attacker-in-the-rear, unreliable troops should be used, thus killing two birds with one stone - warding off the attack while getting rid of treacherous troops.'"
canonical-instances:
  - "A manager who must staff a high-stakes, likely-to-fail turnaround project, and separately has a team member whose commitment to the department has been in doubt for months, assigns that team member to lead the turnaround -- a success salvages the project using someone the manager wasn't otherwise counting on, and a failure gives grounds to let the doubted employee go without having risked a trusted performer on a project that was always a coin flip."
  - "A general contractor facing a dangerous, mandatory demolition job and a subcontractor whose safety record and reliability have already raised concerns assigns the demolition to that subcontractor rather than a preferred one, reasoning that a clean job removes a doubt at no extra cost, while any failure falls on a relationship the contractor was already prepared to end."
critical-questions:
  - "does this create a perverse incentive to manufacture distrust of a resource specifically to justify sacrificing it on a dangerous task, effectively laundering a decision to discard someone through the framing of a strategic double-win?"
  - "does using an already-unreliable resource for the most consequential, high-risk task actually maximize the odds of failure on a task described as non-negotiable -- doesn't 'the task must succeed' argue for your best resource, not your least-trusted one, even if the least-trusted one is more expendable?"
  - "what happens to organizational trust and morale among other members when it becomes visible that doubted people get assigned the most dangerous mandatory tasks -- does this tactic, if recognized as a pattern, make anyone under suspicion pre-emptively defect or disengage rather than risk being the next 'two birds' assignment?"
