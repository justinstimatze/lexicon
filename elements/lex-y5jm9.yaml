lineage:
  - source: primary
    text: barocas-nissenbaum-2014-big-datas-end-run
    citation: "Solon Barocas and Helen Nissenbaum, 'Big Data's End Run around Anonymity and Consent,' Ch.2 in Julia Lane, Victoria Stodden, Stefan Bender, Helen Nissenbaum (eds.), Privacy, Big Data, and the Public Good: Frameworks for Engagement (Cambridge University Press, 2014), pp.44-75. The opening framing of the chapter (pp.44-46) states the anchor-erasure thesis for both pillars; the Anonymity and Consent sections (pp.49-68) develop each half."
    quote: "Those committed to anonymity and consent do not deny the practical challenges; their solution is to try harder, to be more creative, to utilize more sophisticated mathematical and statistical techniques, and to become astute to the cognitive and motivational contours of users. Although we accept that improvements can result and have resulted from these efforts ... the transition to big data has turned definitional and practical fault lines that have worried policymakers, pundits, practitioners, and scholars into impassable chasms."
  - source: primary
    text: barocas-nissenbaum-2014-reachability-vs-identifiability
    citation: "Same chapter, p.45 — distinguishing identifiability from reachability as the failure mode of anonymization under inference attack."
    quote: "Even when individuals are not 'identifiable,' they may still be 'reachable,' may still be comprehensibly represented in records that detail their attributes and activities, and may be subject to consequential inferences and predictions taken on that basis."
canonical-instances:
  - "Privacy regime (the paper's subject): anonymization procedure preserves 'no identifiable subject in the record' while inference attacks make subjects reachable through aggregated non-identifying features. Operationally distinct from lex-tb3re Goodhart's law — the anonymization measure is not warped by being optimized against; the measure remains intact but its anchor (identifiability as a clean boundary) is no longer a meaningful constraint on the operations the technology performs."
  - "Notice-and-consent: consent form anchors on 'specifiable purposes at collection time' but big-data analytics discovers uses inductively from data after collection. The consent procedure is signed and on file; the substantive protection (subject controlling what their data is used for) collapses. Operationally distinct from lex-d7h2y paltering — no deception per utterance; the consent text was honest at collection-time, the technology made it unspecifiable."
  - "AML Bank Secrecy Act: SAR-filing procedure anchors on 'suspicious transaction above $10,000 threshold.' Structuring (splitting deposits below threshold) routes around the per-transaction anchor; modern crypto routes around the bank-as-reporter assumption entirely. Operationally distinct from lex-5d8hm Freeman — the formal structure is maintained; the substantive AML purpose collapses anyway."
  - "KYC and beneficial-ownership: regime anchors on 'identify the beneficial owner.' Multi-jurisdictional shell-company layering routes around the anchor while filing every required form. The procedure succeeds; knowing the actual owner collapses."
  - "DMCA notice-and-takedown: 17 USC §512 anchors on the per-work takedown notice as the unit of action. Algorithmic batch-uploading + automated re-uploads route around the per-work procedure; YouTube's Content ID is the substantive substitute that emerges when the per-work anchor erodes."
  - "GDPR consent vs inferential profiling: GDPR Art.6 anchors lawful processing on consent or other listed bases over 'personal data' (data about identified or identifiable persons). Inferential profiling on de-identified data with profile-attribution back to a household / cohort / device-fingerprint routes around the personal-data anchor while substantively reconstructing the protected interest."
  - "FCRA: Fair Credit Reporting Act anchors regulated decisions on 'consumer reports' from 'consumer reporting agencies.' Alternative-data scoring (purchase history, social media, geolocation patterns) routes around the regime by producing inputs to creditworthiness decisions that aren't 'consumer reports' under the statutory definition."
  - "Voter ID and registration purges: laws anchor on 'registered voter at this address.' Mass-mailed unsolicited ballots / interstate registration / inactive-voter purge protocols all route around the anchor in opposite directions; the procedure's substantive purpose (validating who votes) deteriorates regardless of which side tightens its variant."
  - "IRB human-subjects review: 45 CFR 46 anchors on 'identifiable private information.' Web-scraping at scale of public posts evades IRB review while reconstructing identifiable data through linkage. Researchers comply procedurally (no IRB protocol filed because no 'human subjects' as defined) while substantively studying humans."
  - "Antitrust Sherman §2 'relevant market': anchors monopoly-power analysis on a definable product market with substitutes. Two-sided platform business models (Google search + ad-tech; Amazon retail + marketplace + AWS) defy clean relevant-market lines; the procedure produces market-definitions that don't capture where competitive harm actually accumulates."
  - "Section 230 platform-vs-publisher: 47 USC §230 anchors immunity on the platform/publisher distinction. Algorithmic feed curation routes around — recommendation is neither passive hosting nor original publication; the binary anchor doesn't fit the operation."
  - "Audit standards (revenue recognition): GAAP/IFRS rules anchor on 'transaction has documented basis at point in time.' Bill-and-hold, channel-stuffing, multi-element bundling all comply transaction-by-transaction while substantively distorting earnings."
  - "Export control (ITAR): anchors on 'transfer of controlled item or technical data to foreign person.' Cloud-hosting + remote-work / 'access from abroad' route around the physical-transfer anchor; ITAR's substantive purpose (control flow of defense technology) erodes."
  - "Nutrition labeling: 'added sugars' disclosure anchors on the immediate ingredient list. Sub-ingredients-of-ingredients (concentrated juice in a sauce in a frozen meal) route around the disclosure; the substantive purpose (consumer can see what they're consuming) collapses procedurally compliant."
canonical-instances-edge:
  - "Implementation-slop vs anchor-erasure: not every procedural failure is anchor-erasure — sometimes the procedure's anchor is intact and the failure is genuinely under-resourced enforcement, vague drafting, or capture. The diagnostic is whether tightening the procedure (clearer notice, lower threshold, faster takedown) would recover the substantive protection; if no realistic tightening would, the failure is anchor-erasure."
  - "Substantive principles can themselves erode: even substantive-principle regimes (contextual integrity, fair use, reasonable expectation of privacy) can be displaced by technology, but their failure mode is different — they accumulate ambiguous cases at the boundary rather than systematically routing around a known anchor. Anchor-erasure is the specifically procedural failure mode."
critical-questions:
  - "What is the procedural regime's anchor feature, stated precisely?"
  - "Does the technology in question preserve, transform, or route around that anchor feature?"
  - "Would any realistic tightening of the procedure restore the substantive protection, or has the anchor permanently lost discriminating power?"
  - "What substantive principle (purpose-based, contextually-normed, outcome-based) would survive the anchor's erasure, and what would its enforcement cost?"
  - "Are stakeholders defending the existing procedure because it works substantively or because it's all that's politically reachable given the anchor erosion?"
severity-tier: critical
