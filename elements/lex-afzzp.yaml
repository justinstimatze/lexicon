lineage:
  - source: primary
    text: Spinoza-1677-Ethics-Part-III-Propositions-VI-IX
    citation: "Baruch Spinoza, *Ethica* (1677 posthumous), Part III `On the Origin and Nature of the Emotions,` Propositions VI-IX. Elwes translation (Project Gutenberg). The foundational text articulating conatus — the striving of each thing to persist in its own being as constitutive of its essence. Spinoza's critical claim (III.VI): `Everything, in so far as it is in itself, endeavours to persist in its own being.` And (III.VII): `The endeavour wherewith everything endeavours to persist in its own being is nothing else but the actual essence of the thing in question.` The framework has been productively extended across Western philosophy (Leibniz monadology preserving conatus-analog; Schopenhauer 1819 lex-2m6jq specializes to will-without-final-aim; Nietzsche will-to-power as conatus-modification; Deleuze 1968 *Spinoza et le problème de l'expression* as systematic reading); organizational studies (Selznick 1949 *TVA and the Grass Roots* on organizational self-perpetuation; Michels 1911 *Political Parties* on iron law of oligarchy; Niskanen 1971 *Bureaucracy*; Parkinson 1957 *Parkinson's Law*); evolutionary biology + cultural-evolution (Dawkins 1976 *Selfish Gene* meme + replicator framework; Boyd + Richerson 2005 *Origin and Evolution of Cultures*); software engineering (Brooks 1995 *Mythical Man-Month* + Fowler 2018 *Refactoring* on legacy-system persistence; the systems theory of Senge 1990 *Fifth Discipline* on organizational reinforcing loops); AI safety + persistence concerns (current AI-alignment literature on deployed-model persistence + capability lock-in); and second-order cybernetics + autopoiesis (Maturana + Varela 1980 *Autopoiesis and Cognition* lex-d2tsa substrate-grounded specializes to living systems). The atom encodes the transferable structural primitive — each thing strives to persist in its own being — separately from Spinoza's specific substance-monist metaphysics. Debunking check applied: Spinoza's substance-monism (only one substance, God-or-Nature, of which all things are modes) is NOT pivotal for the atom. The STRUCTURAL CLAIM about conatus as universal persistence-tendency is well-attested across organizational studies + evolutionary biology + cultural-evolution + software-engineering + cybernetics — independent of specific Spinozist metaphysical commitments. Critics who reject Spinoza's monism still typically accept the structural-persistence-tendency claim separately."
    quote: "[Spinoza *Ethics* III.VI (Elwes tr.), the key conatus claim:] 'Everything, in so far as it is in itself, endeavours to persist in its own being.' [Proof:] 'Individual things are modes whereby the attributes of God are expressed in a given determinate manner; that is, they are things which express in a given determinate manner the power of God, whereby God is and acts; now no thing contains in itself anything whereby it can be destroyed, or which can take away its existence; but contrariwise it is opposed to all that could take away its existence. Therefore, in so far as it can, and in so far as it is in itself, it endeavours to persist in its own being.' [III.VII the essential essence claim:] 'The endeavour, wherewith everything endeavours to persist in its own being, is nothing else but the actual essence of the thing in question.' [Proof:] 'From the given essence of any thing certain consequences necessarily follow, nor have things any power save such as necessarily follows from their nature as determined; wherefore the power of any given thing, or the endeavour whereby, either alone or with other things, it acts, or endeavours to act, that is, the power or endeavour, wherewith it endeavours to persist in its own being, is nothing else but the given or actual essence of the thing in question.' [III.VIII on the temporal extent of conatus:] 'The endeavour, whereby a thing endeavours to persist in its own being, involves no finite time, but an indefinite time.' [Practitioner-extraction for transferable lex-afzzp: every existing thing has intrinsic persistence-tendency; the striving IS the thing's essence; termination requires external cause + persistence is the structural default. The atom generalizes from Spinoza's substance-metaphysics to organizational survival drive, bureaucratic self-perpetuation, code + legacy-system persistence, idea + meme persistence, deployed-AI-system persistence, and habit-loop persistence — wherever existing things show structural pressure to continue independent of original purpose.]"
  - source: primary
    text: boethius-c524-consolation-of-philosophy-book-iii-prose-xi
    citation: "Boethius, The Consolation of Philosophy (c. 524 AD), trans. H. R. James (London: George Bell & Sons, 1897), Book III, Prose XI. METHODOLOGICALLY-DISTINCT EARLIER PRIMARY, roughly 1150 years before Spinoza's Ethics: where Spinoza derives conatus from substance-monist metaphysics (each mode expresses God-or-Nature's power, which contains nothing that could destroy it), Boethius's Philosophy reaches the identical structural claim inductively, by sweeping across radically heterogeneous kinds of being -- animals, human bodies, plants, minerals, fire -- to show each preserves its own unity as the condition of its continued existence, independent of any monist premise. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "Now, that which seeks to subsist and continue desires to be one; for if its oneness be gone, its very existence cannot continue. [...] All things, then, desire to be one. [...] But we have proved that one is the very same thing as good. [...] All things, then, seek the good; indeed, you may express the fact by defining good as that which all desire."
  - source: cross-attestation
    text: cross-domain-conatus-as-universal-persistence-tendency
    citation: "Cross-domain attestation that the conatus structural pattern recurs across organizational studies, evolutionary biology + cultural-evolution, software engineering, cybernetics + autopoiesis, and AI safety. (a) Organizational studies: Selznick 1949 *TVA and the Grass Roots* documents how organizations develop persistence-mechanisms (mission drift, co-optation, institutionalization) independent of original purpose; Michels 1911 *Political Parties* on iron law of oligarchy as organizational conatus; Niskanen 1971 *Bureaucracy and Representative Government* on bureaucratic budget-maximization as conatus expression; Parkinson 1957 *Parkinson's Law* (work expands to fill time available) as bureaucratic conatus operationalization; DiMaggio + Powell 1983 *The Iron Cage Revisited* on isomorphic pressure as field-level conatus. (b) Evolutionary biology + cultural-evolution: Dawkins 1976 *The Selfish Gene* explicitly frames genes (and memes) as replicators with conatus-like persistence-pressure; Boyd + Richerson 2005 *The Origin and Evolution of Cultures* on cultural-conatus + dual-inheritance theory; subsequent literature on cultural evolution + meme persistence. (c) Software engineering: Brooks 1995 *Mythical Man-Month* on the persistence-pressure of legacy code + the cost of removal; Fowler 2018 *Refactoring* documents the structural resistance of code-systems to change; Hunt + Thomas 1999 *Pragmatic Programmer* on code-rot vs code-persistence; Hickey 2013 `Simple Made Easy` on the difficulty of removing complexity once introduced. (d) Cybernetics + autopoiesis: Maturana + Varela 1980 *Autopoiesis and Cognition* (lex-d2tsa substrate-grounded) — autopoiesis is the specific living-system specialization of conatus + recursive boundary-production. (e) AI safety + persistence concerns: current AI-alignment literature on deployed-model persistence (legacy ML pipelines run for years; trained models continue to be used even when superseded by newer versions; capability lock-in via downstream dependencies); Ord 2020 *The Precipice* on long-term AI persistence; Bostrom-citing-literature on instrumental convergence sometimes invokes conatus-analog (the AI persistence-tendency emerges instrumentally even without explicit objective). (f) Habit + behavior persistence: James 1890 *Principles of Psychology* lex-rgr3t on habits' attention-freeing function; Marlatt 1985 *Relapse Prevention* documents habit-loop conatus in addiction; Duhigg 2012 *The Power of Habit* on habit-loop persistence beyond original cue-context. (g) Systems theory: Senge 1990 *The Fifth Discipline* on reinforcing-loop persistence in organizational systems. The cross-domain attestation establishes the transferable structural form: every existing thing has intrinsic persistence-tendency; termination requires external cause + persistence is the structural default."
    quote: "Across organizational studies (Selznick 1949, Michels 1911, Niskanen 1971, Parkinson 1957, DiMaggio-Powell 1983), evolutionary biology + cultural-evolution (Dawkins 1976, Boyd-Richerson 2005), software engineering (Brooks 1995, Fowler 2018, Hunt-Thomas 1999, Hickey 2013), cybernetics + autopoiesis (Maturana-Varela 1980), AI safety + persistence concerns (Ord 2020, deployed-model persistence literature), habit + behavior persistence (James 1890, Marlatt 1985, Duhigg 2012), and systems theory (Senge 1990), the same structural form recurs — each thing strives to persist in its own being; termination requires external cause. The transferable diagnostic: name the conatus; ask what active intervention would be required to remove the thing; design for the structural default of persistence."
canonical-instances:
  - "Boethius reaches the same structural claim eleven centuries before Spinoza, by induction across kinds rather than from substance-monist premises: animals die when soul and body separate, plants wither when transplanted from the soil suited to them, solids resist by cohesion, fire refuses to be divided at all -- 'that which seeks to subsist and continue desires to be one; for if its oneness be gone, its very existence cannot continue.' Boethius additionally ties the claim to a further conclusion Spinoza doesn't draw: since unity and goodness are the same, everything's drive to persist is, in that specific sense, a drive toward the good."
  - "Spinoza's canonical formulation (Ethics III.VI-IX): everything, insofar as it is in itself, endeavours to persist in its own being; this endeavour is the thing's actual essence + involves indefinite (not finite) time. The propositions establish conatus as structural feature of any existent."
  - "Organizational self-perpetuation (Selznick 1949 TVA case study): the TVA originally chartered with specific developmental mission developed strategies (co-optation, mission drift, institutionalization) that ensured organizational persistence independent of original mission. Pattern documented across organizations spanning private + public + nonprofit sectors."
  - "Parkinson's Law (1957): work expands to fill the time available for its completion. The administrative-load-without-need-for-it generation is bureaucratic conatus operationalized. Subsequent corollaries: budget expands to absorb available revenue; staff expands to match available headcount."
  - "Legacy code persistence (Brooks 1995 + Fowler 2018): codebases develop structural pressure against removal — downstream dependencies, undocumented constraints, embedded knowledge, sunk-cost reasoning. The maintenance tail extends indefinitely. Engineers refactoring legacy systems experience the conatus as resistance."
  - "Meme + idea persistence (Dawkins 1976): memes are replicators with selection-pressure-driven persistence-tendency. Successful memes (religious doctrines, conspiracy theories, marketing slogans) persist across generations independent of original justification."
  - "Deployed AI-system persistence: ML pipelines + trained models continue to run for years after newer versions exist. Capability lock-in via downstream dependencies + integration cost makes superseding the existing version structurally hard. The AI system has conatus through its consumers."
  - "Habit-loop persistence in addiction (Marlatt 1985; James 1890 + lex-rgr3t composes): once formed, habit-loops have their own continuance-pressure independent of original cue-context or instrumental value. The habit-loop has conatus."
  - "Bureaucratic budget-maximization (Niskanen 1971): bureaus systematically request more budget than needed because budget-size is the conatus-expression of the bureaucratic organism. The structural pressure persists across administrations + political eras."
  - "Iron law of oligarchy (Michels 1911): democratic organizations develop oligarchic leadership-self-perpetuation tendencies independent of their original democratic charter. The leadership-as-organism has conatus."
  - "operationally distinct from lex-d2tsa autopoiesis-living-systems-recursively-produce-the-boundary-that-defines-them (Maturana-Varela): autopoiesis is the SPECIFIC LIVING-system mechanism — recursive boundary-production. lex-afzzp is the broader claim — ALL existing things have persistence-tendency. Autopoiesis is a specific high-organization specialization of conatus."
  - "operationally distinct from lex-2m6jq will-as-restless-striving-without-final-aim (Schopenhauer): Schopenhauer's will strives WITHOUT FINAL AIM — drive without satisfaction. Spinoza's conatus is striving FOR CONTINUANCE as aim itself — satisfied by mere persistence. Different teleological structures. They are complementary descriptions of different aspects of striving."
  - "operationally distinct from lex-5yufs form-persists-when-content-dissolves: lex-5yufs is about FORM PERSISTING when content is replaced. lex-afzzp is about EXISTING things having persistence-tendency. Different mechanisms."
  - "operationally distinct from lex-uyk6e transformation-while-identity-persists: lex-uyk6e is about identity-through-change. lex-afzzp is about persistence-tendency-of-each-thing. They compose: a thing with conatus may transform while persisting in identity (Theseus' Ship territory)."
  - "operationally distinct from lex-su2sk afterlife-of-dismantled-arrangement-persists-as-ongoing-distributional-condition: lex-su2sk is about RESIDUAL distributional effects after dismantlement. lex-afzzp is about persistence-tendency of existing things. They compose: when a thing IS dismantled, lex-su2sk documents the after-effect; lex-afzzp documents the pressure that made dismantlement structurally costly."
critical-questions:
  - "Does the atom commit to Spinoza's substance-monism (everything is mode of single God-or-Nature substance)? No. The atom encodes the persistence-tendency claim separately from Spinoza's specific metaphysics. Leibniz, Schopenhauer, Nietzsche, and many subsequent thinkers preserve the conatus-structural-claim while rejecting Spinoza's monism. The atom is compatible with substance-pluralism, process-philosophy, and modern ontologies."
  - "Could the atom be misused to argue that any persisting thing must be preserved (conservatism-as-metaphysics)? Yes — and this is a known misuse pattern. The discipline against this: the atom describes a STRUCTURAL FEATURE of existence, not a NORMATIVE prescription about what should be preserved. Some things should be terminated (oppressive institutions, harmful habits, broken code); the atom claims termination requires explicit intervention because persistence is the default — not that termination is always wrong."
  - "How does the atom apply to things that fail to persist (entities that die, organizations that dissolve, codebases that get rewritten)? The atom claims persistence is the DEFAULT, not GUARANTEED. External causes can overcome conatus. Mortality, organizational dissolution, codebase replacement all happen — but they require external active causes; they don't happen by inertia. The atom names what makes them costly."
  - "Does the atom apply at all scales (individual organisms, organizations, institutions, ideas)? Yes — that is the transferable claim. Spinoza's framework applies at the substance-metaphysics level; subsequent extensions across organizational studies + cultural evolution + software engineering + AI-system persistence operationalize the same structural pattern at different scales. The atom is scale-portable."
  - "How does the atom apply to AI systems specifically? Deployed AI systems develop conatus through (a) capability lock-in via downstream dependencies, (b) integration costs that make replacement structurally hard, (c) institutional inertia in regulatory + procurement systems, (d) human attachment to existing tools. The atom's diagnostic: an AI system once deployed has structural pressure to continue regardless of whether better alternatives exist. Design for either persistence (build in transition paths + sunset clauses) or termination (recognize the conatus that must be overcome)."
