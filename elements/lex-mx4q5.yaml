id: lex-mx4q5
name: local-realism-cannot-reproduce-quantum-entanglement-correlations
type-in: structure
type-out: claim
_tier: atomic
status: active
agent-instruction: "When a system shows correlations between distant events and you reach for a 'hidden-variables-we-haven't-found-yet' explanation, ask whether the correlation pattern itself rules out local-and-deterministic explanations as a class, not just the specific candidates. Bell's 1964 theorem proves exactly this for entangled quantum particles: ANY theory in which (a) the result of a measurement on particle 2 is determined by local parameters not affected by what's done with particle 1, AND (b) measurement outcomes are predetermined by some hidden state, must satisfy an inequality on certain correlation sums that quantum mechanics violates — and that experiments (Aspect-Dalibard-Roger 1982, Hensen et al. 2015 loophole-free) confirm is violated by nature. The transferable move is the proof-strategy: bound what a CLASS of explanations can produce, then show the data exceeds the bound. Three structural takeaways: (1) hidden-variable explanations are not always rescuable in principle — there exist correlation patterns that no local-causal theory can match regardless of how many hidden parameters you add; (2) when forced to choose, modern physics gives up local realism (the result of a distant measurement is not predetermined by local hidden state) rather than the empirical correlations; (3) the same proof-shape generalizes: identify an inequality that ALL members of a theory class must satisfy, then test it. Operational uses: (a) recognize 'no-go theorem' as a distinct argument shape — not 'this candidate theory fails' but 'every theory of this form must fail'; (b) when defending an extant frame against anomaly, check whether the anomaly is structural (rules out the frame as such) rather than incremental (rules out specific parameter settings); (c) recognize Bell as the founding modern instance of physics-by-inequality, the lineage that connects to Kochen-Specker contextuality, Tsirelson bounds, and the broader device-independent quantum-information program."
