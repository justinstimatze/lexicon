id: lex-2n7b8
name: judge-a-new-methodology-by-evidence-base-difficulty-tiers-and-prospective-tests
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When evaluating whether a newly-proposed methodology or theory in a practical field deserves to be taken seriously, don't judge it by how compelling its explanation sounds — check three specific, checkable things: how much real evidence it's actually built on, whether it distinguishes easy cases from hard ones, and whether it's been tested prospectively on new, harder problems rather than only fitted retroactively to problems already solved. Altshuller states this as an explicit checklist for judging any claimed theory of inventive creativity: '1. Is it founded on the study of a sufficiently large mass of patent information? Serious work cannot be based on a few casual facts. Practice has shown that good research into the theory of inventions is usually built on analysis of no less than 10,000 to 20,000 author's copyrights and patents. 2. Has the researcher taken account of the existence of various levels of inventive problem? Unless numerous inventions of lower levels are not 'sown' comparatively few inventions of higher levels will 'take on' and conclusions will be produced valid only for simple problems. 3. Have the recommendations been tried out on a sufficiently large number of new problems at higher levels?' He gives a concrete negative case for criterion 3: a rival researcher 'recommended according to the model and form of ASIP an algorithm for the solution of inventive questions (ASIQ). In the work not a single example of the use of the ASIQ for the solution of scientific problems was quoted. Naturally no one paid any attention to ASIQ' — a theory presented with zero worked demonstrations on the class of problem it claims to solve, however plausible its structure looks on paper, has not actually been tested and doesn't deserve credibility on the strength of its framing alone. He pairs this with a warning about a specific failure mode that can slip past a casual read: a framework can borrow the surface vocabulary of a rigorous field (in his example, 'modern cybernetic terms... patterns with arrows, circles and the captions entry, exit, information processing block, accumulator') while containing 'often, alas, no reality' behind that vocabulary — the presence of technical-sounding structure is not itself evidence that the three substantive criteria are met. Diagnostic move: before adopting or crediting a new proposed method, ask (1) how large and real is the evidence base it claims to generalize from, not just how many illustrative anecdotes it cites; (2) does it distinguish between easy and hard instances of the problem it addresses, or does it implicitly generalize from easy cases to a claim about all cases; (3) has anyone actually applied it prospectively to new, harder problems and reported the result, rather than only using it to re-narrate problems that were already solved by other means."
related: [lex-79peh, lex-mupf5, lex-y3fc5]
evokes: [three-criteria-for-judging-a-methodology, asiq-zero-worked-examples, cybernetic-vocabulary-without-reality, evidence-base-difficulty-tiers-prospective-tests]
lineage:
  - source: primary
    text: altshuller-1984-three-criteria-for-judging-a-theory
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.8 'The Science of Invention,' section 'A Few Comments on the Literature of Inventive Creativity.'"
    quote: "'Reliable criteria exist for judging a new work on inventive creativity: 1. Is it founded on the study of a sufficiently large mass of patent information? Serious work cannot be based on a few casual facts. Practice has shown that good research into the theory of inventions is usually built on analysis of no less than 10,000 to 20,000 author's copyrights and patents. 2. Has the researcher taken account of the existence of various levels of inventive problem? Unless numerous inventions of lower levels are not 'sown' comparatively few inventions of higher levels will 'take on' and conclusions will be produced valid only for simple problems. 3. Have the recommendations been tried out on a sufficiently large number of new problems at higher levels?'"
  - source: primary
    text: altshuller-1984-asiq-no-worked-examples
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.8, 'A Few Comments on the Literature of Inventive Creativity.'"
    quote: "'Some time ago R. I.Deryagin recommended according to the model and form of ASIP an algorithm for the solution of inventive questions (ASIQ). In the work not a single example of the use of the ASIQ for the solution of scientific problems was quoted. Naturally no one paid any attention to ASIQ... Patterns appear with arrows, circles and the captions 'entry', 'exit', 'information processing block', 'accumulator' etc. Behind these, alas, is often concealed, alas, no reality.'"
canonical-instances:
  - "A management consultancy pitches a new decision-making framework backed by three glowing client anecdotes; applying this checklist, a skeptical evaluator asks how many real cases the framework was actually derived from (not just illustrated with), whether it distinguishes routine decisions from genuinely hard, high-stakes ones, and whether it's ever been used prospectively on a hard decision whose outcome wasn't already known when the framework was applied."
  - "A machine-learning paper proposes a new training technique demonstrated only on a handful of small, well-known benchmark datasets where the right answer is already established; the same checklist flags that the evidence base is thin, that difficulty isn't varied, and that no prospective test on a genuinely new, harder problem has been reported — exactly the ASIQ failure pattern, dressed in modern technical vocabulary."
  - "operationally distinct from lex-79peh interrelated-hypotheses-break-significance-tests-independence-assumption and lex-mupf5 high-thresholds-buy-false-positive-safety-with-false-negatives: those atoms are about STATISTICAL testing assumptions within an already-quantitative research program; this atom is a simpler, qualitative pre-screening checklist for whether a NEWLY PROPOSED METHODOLOGY (which may not even be statistical) has done the basic evidentiary work needed before it's worth taking seriously at all."
critical-questions:
  - "how large a body of evidence actually counts as 'sufficient' outside domains (like patent analysis) where a natural large corpus already exists — does this checklist assume an evidence base is always available to check against, and what should someone do when evaluating a genuinely novel method in a domain with no comparable historical record?"
  - "criterion 2 (accounting for difficulty levels) assumes a workable way to classify problems by difficulty in the first place — how would someone apply this criterion in a domain that doesn't already have an established difficulty-tier scheme the way Altshuller's own five-level typology provides for inventive problems?"
  - "is 'has it been tried on new, harder problems' the same standard a genuinely novel method could ever satisfy at the moment of its FIRST proposal — does strict application of criterion 3 unfairly penalize brand-new ideas that haven't yet had the chance to accumulate prospective validation, versus established rivals that have simply had more time?"
