id: lex-u74ex
name: spotlight-choice
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When attention falls on one feature, ask what's being excluded from the spotlight. The choice of WHERE to point attention is upstream of the analysis; analyses are downstream of spotlight choice. Surface the spotlight before debating its outputs."
related: [lex-wtkuz, lex-e2tnt, lex-bd324, lex-xhvgy, lex-j929z, lex-n6t4u, lex-5mv6r, lex-3mgdz, lex-ucw53, lex-d7h2y, lex-8vcfb, lex-k6wka]
scaffolds-from: [lex-e2tnt, lex-n6t4u]
evokes: [relevance-is-chosen-not-given, foregrounding, choice-vs-fact-distinction, contextual-effect-vs-processing-effort]
lineage:
  - source: practitioner
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard University Press / Blackwell 1986; 2nd ed. 1995). The book formalizes relevance as a cognitive cost-benefit ratio between contextual effects (gain) and processing effort (cost). The connection to lex-u74ex: relevance is not a property of a fact, but of a (fact, context) pair — and the context is constructed by the comprehender's choice of which assumptions to bring to bear. This makes 'the relevant facts here are X, Y, Z' explicitly a choice, not a discovery. Sperber-Wilson's Principle of Relevance (62) further claims that every act of ostensive communication COMMUNICATES a presumption of optimal relevance — i.e., a speaker who chooses to say X is asserting 'this is what I think is worth your processing effort,' which is itself a spotlight-choice the speaker is making on the listener's behalf. The book is the #1 priority-match atom source per mbient corpus (98 fires/pass-6 against lex-u74ex)"
    quote: "(7) Relevance: An assumption is relevant in a context if and only if it has some contextual effect in that context. [Ch.3 §1 'Conditions for relevance', p.122 — the simplest definition; relevance is a function of the assumption-context pair, not of the assumption alone.] (10) Relevance: Extent condition 1: an assumption is relevant in a context to the extent that its contextual effects in this context are large. Extent condition 2: an assumption is relevant in a context to the extent that the effort required to process it in this context is small. [Ch.3 §1, p.125 — the refined extent-conditions definition; relevance is the cost-benefit ratio. Since both effect and effort depend on the chosen context, relevance is constructed by the chooser of context.] The assessment of relevance, like the assessment of productivity, is a matter of balancing output against input: here contextual effects against processing effort. [Ch.3 §1, p.125 — the foundational analogy: relevance is not a feature of the input alone; it's a process-output that depends on how the input meets a chosen context.] (62) Principle of relevance: Every act of ostensive communication communicates the presumption of its own optimal relevance. [Ch.3 §7, p.158 — the speaker's communicative act is itself a spotlight-choice the speaker is making on behalf of the listener: 'this is what I think is worth your processing effort.' The listener's job is to accept or refuse that spotlight.]"
  - source: practitioner
    text: foucault-discourse-analysis
    citation: "Michel Foucault's work on discourse (esp. The Archaeology of Knowledge 1969, The Order of Things 1966) — the broader humanistic anchor for spotlight-choice: 'what counts as a relevant fact' is always shaped by the discursive regime that selects it. The Foucault-frame is the political/historical version; Sperber-Wilson is the cognitive-mechanistic version. Both name the move that lex-u74ex atomizes. No verbatim quote is claimed here."
canonical-instances:
  - "the Wölfflin W6 absolute-vs-relative clarity art-historical canonical case (Heinrich Wölfflin 1915 *Principles of Art History*; lift from the Wölfflin-remaining-polarities no-mint pass doc which explicitly flagged this as instance-elevation of lex-u74ex): Wölfflin's sixth polarity — Renaissance composition where every part is equally clear vs Baroque composition with central focus + subordinated peripheral — is the visual-arts instance of spotlight-choice. The Renaissance painter declines to spotlight (uniform-clarity is a meta-choice to refuse subordination); the Baroque painter selects the focal point and renders the periphery in service to it. Both choices are CHOICES, not neutral defaults. Wölfflin's pedagogical-discipline (1915 monograph): teach the student to SEE the clarity-decision in the work so they can read the picture's spotlight-structure. Cross-substrate instance of the same primitive at the picture-composition layer"
  - "noticing that 'the relevant facts here are X, Y, Z' is itself a choice (which facts go in the spotlight is decided, not discovered) — making the choosing visible separates choosing from chosen"
  - "the move that disarms 'these are just the facts' rhetoric by surfacing the relevance-selection step that was buried"
  - "Sperber-Wilson's cost-benefit framing: when someone says 'X is relevant here,' they are committing to a context in which X has high contextual-effect-to-processing-effort ratio. The COMMITMENT TO A CONTEXT is the spotlight-choice; alter the context and X may stop being relevant"
  - "courtroom testimony rules: only some facts are 'admissible.' The admissibility rules ARE explicit spotlight-choices made by the legal-discursive regime, codifying which contextual effects count and which don't. The visible-vs-invisible boundary of admissibility is the spotlight"
  - "scientific paper introductions: 'the relevant prior work is [Smith 1990; Jones 2003; ...].' The author has chosen which lineage to plot the work within. Different choices would frame the same contribution as continuous-with vs disruptive-of different traditions"
critical-questions:
  - "the chooser-identification test: WHO is making the spotlight-choice in this case — the speaker, the listener, the discursive regime, an institutional protocol? Different choosers leave different fingerprints and have different intervention-leverage. Practitioner-discipline: trace the spotlight-choice back to its decision-point; you cannot contest a choice whose maker you can't name"
  - "the alternative-spotlight thought-experiment: what would the same situation look like under a DIFFERENT spotlight-choice? If you can construct a plausible alternative spotlight that makes different facts relevant, the original spotlight was decisive (not neutral). If no alternative spotlight is plausible, the framing may be more discovery than choice. Practitioner-discipline: name at least one defensible alternative before treating the current spotlight as the only frame"
  - "the cost-benefit visibility check: per Sperber-Wilson, the spotlight is the chosen context that produces high contextual-effect-to-processing-effort ratio. Is the cost-benefit calculation being done out loud, or is it happening invisibly via convention? Visible cost-benefit makes the choice debatable; invisible cost-benefit hides the spotlight inside 'these are just the facts.' Practitioner-question: can you surface the context-choice without changing the conclusion?"
  - "the paltering-via-spotlight risk (lex-d7h2y): weaponized spotlight-choice is paltering — literal-true facts arranged to produce a false belief. The spotlight-choice IS the lever paltering operates on. Practitioner-discipline: when suspecting deception, audit not just what is said but what is NOT included in the spotlight; the omissions are often the indispensable evidence"
  - "the self-application discipline: am I currently choosing my spotlight intentionally, or has it been chosen for me by training / culture / convention? The same atom that disarms others' rhetoric can be turned reflexively. Practitioner-question: who chose the facts I'm treating as relevant in this analysis, and would I endorse that choice if it were made visible?"
status: active
