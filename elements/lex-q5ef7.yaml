id: lex-q5ef7
name: hide-the-countable-proxies-not-just-the-headline-number
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When trying to keep your true capacity hidden from an opponent or competitor, don't stop at refusing to disclose the headline figure directly -- an observer rarely needs you to state the number when enough indirect, countable signals leak the same information anyway, so protecting the secret means controlling those proxies, not just the direct question. Kautilya's warning is specific about the mechanism: 'The enemy can ascertain the strength of the conqueror's army by counting it when they march in single file or from the quantity of fodder, food and bedding, or from the number of cooking fires, banners and weapons [the army carries]. Therefore, all of these shall be kept well hidden.' None of fodder quantity, fire count, or banner count IS the army's size -- each is a countable byproduct that correlates tightly enough with the real number that an attentive observer can back-calculate it, often more reliably than a rumor or a direct claim would provide. The list matters because it names categories, not a single leak: a defender who hides the obvious thing (marching order) while leaving the non-obvious things (supply quantities, campfire counts) exposed has protected nothing, since any one uncontrolled proxy is enough to reconstruct the number the direct concealment was meant to protect. Diagnostic move: when protecting a true figure (headcount, revenue, capacity, reserves) from an outside party, don't just refuse to state it directly -- enumerate every indirect signal that correlates with it (physical footprint, resource consumption, visible byproducts, third-party records) and ask whether each one is controlled, since a determined observer will reconstruct the number from whichever proxy was left exposed."
