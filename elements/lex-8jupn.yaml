id: lex-8jupn
name: the-frame-story-a-teacher-tells-structurally-mirrors-the-very-refusal-just-witnessed
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A teacher choosing which past-life parable to tell can select one that is not merely thematically related but structurally identical to what the listener just did moments before, so the audience recognizes the pattern in the parable before it is ever spelled out as a lesson. In the Jataka''s tale of Maha-Dhammapala, the Buddha tells his father a tale of a father refusing to believe false news of his son''s death — chosen because the father had just done exactly that: "Sir, I did not believe it! Even when the deities came hovering in the air, and told me this, I refused to believe it, saying that there was no death for my son until he had obtained Buddhahood at the foot of the bo-tree."'
related: []
evokes: [jataka, dasanipata, maha-dhamma-pala-jataka, frame-tale-mirroring, structural-echo-as-teaching-device]
lineage:
  - source: primary
    text: jataka-chalmers1895-maha-dhamma-pala-jataka
