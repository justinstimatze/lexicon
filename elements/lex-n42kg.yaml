id: lex-n42kg
name: surprise-during-practice-triggers-in-act-reframing-of-the-situation
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a competent practitioner hits a surprise mid-practice (the situation talks back in a way the technical script did not predict), the right move is neither to plow on under the original frame nor to halt-and-think — it is to reframe IN ACT: treat the situation as a unique case, propose a fresh framing, act experimentally to elicit further back-talk, refine. This is Schön's reflection-in-action: the practitioner becomes a researcher in the practice context, constructs a new theory of the unique case, and does not separate means from ends, thinking from doing, research from practice. Diagnostic: did the framing get revised mid-action by surprise from the situation itself? If yes, reflection-in-action is operating. Distinct from technical-rationality (apply pre-established rules from research to standard cases) and from after-action review (separated in time)."
related: [lex-wtkuz, lex-ett3j, lex-p48xw, lex-3u25r, lex-eb3wf, lex-w5qfe, lex-2jn8d, lex-b2c6b, lex-junvn, lex-k6p4z, lex-g6sp7]
scaffolds-from: [lex-k6p4z]
evokes: [reflection-in-action, knowing-in-action, reflective-conversation-with-the-situation, back-talk-of-the-materials, the-practitioner-becomes-a-researcher-in-the-practice-context, technical-rationality-as-the-foil, framing-the-problematic-situation, on-the-spot-experiment]
lineage:
  - source: primary
    text: schon-1983-reflective-practitioner-ch2-and-ch9
    citation: "Schön, Donald A. 1983. *The Reflective Practitioner: How Professionals Think in Action*. New York: Basic Books. Ch.2 introduces knowing-in-action (\"our knowing is in our action... the workaday life of the professional depends on tacit knowing-in-action\") and the central move: \"When someone reflects-in-action, he becomes a researcher in the practice context. He is not dependent on the categories of established theory and technique, but constructs a new theory of the unique case. His inquiry is not limited to a deliberation about means which depends on a prior agreement about ends. He does not keep means and ends separate, but defines them interactively as he frames a problematic situation. He does not separate thinking from doing.\" Ch.9 develops the \"reflective conversation with the situation\" — the practitioner acts, the situation talks back (\"back-talk\") with unanticipated meanings, problems, and dilemmas, and the practitioner reframes. Contrasts with the technical-rationality model (Ch.1) that treats professional knowledge as applying research-derived theory to instrumental problem-solving on standard cases."
canonical-instances:
  - "Architectural design studio: student lays out a building on a sloped site per the brief; the geometry won't resolve cleanly. Rather than forcing the original parti or scrapping the brief, the student reframes the slope as a generative constraint — terracing — and the design follows. The surprise from the site itself drove the in-act reframe (Schön's central worked example, Ch.3 Quist)."
  - "Clinical encounter: a physician's standard differential doesn't fit the presenting symptoms. The patient mentions an unusual exposure mid-exam. The physician reframes the case (not 'standard URI' but 'occupational sensitivity workup') and the rest of the visit is run under the new frame. Reflection-in-action, not a stop-and-think aside."
  - "Live debugging in production: the failure mode the engineer expected (deadlock) doesn't fit the timing data the system is producing during the incident. Mid-incident, they reframe ('this is a slow leak, not a lock contention') and re-direct mitigation. The system's back-talk drove the frame revision."
  - "Operationally distinct from lex-w5qfe iterative-refinement: lex-w5qfe is the general feedback loop (provisional target → counterexample → refine → repeat). This atom names the SPECIFIC mechanism by which one cycle's revision is triggered in professional practice — SURPRISE from a UNIQUE CASE, revising the FRAME, IN ACT. lex-w5qfe chains many cycles; this atom is the within-cycle move that does the framing-revision work."
  - "Operationally distinct from lex-eb3wf pre-mortem and lex-ett3j recursive-practice-audit: those are BEFORE-act and BETWEEN-acts reflection respectively (deliberative, separated from doing). Reflection-in-action runs DURING the act, with no stop-and-think gap — its costliness in attention is paid out of the live doing."
critical-questions:
  - "what distinguishes reflection-in-action from improvisation or panic? Improvisation may be smooth ad-libbing without any frame-revision; panic is undirected. Reflection-in-action specifically REVISES THE FRAME under which the action is being taken and tests the revised frame by the next act. Diagnostic: name the prior frame and the revised frame; if the second is just 'try something' the move was improvisation, not reflection-in-action."
  - "when does reflection-in-action fail to apply? When the situation IS standard — when technical rationality (apply the script) is the right move, not because surprise wasn't available but because there isn't any. Schön's claim is not that all practice should be reflective; it is that the cases of practice that MATTER (the messy, problematic, value-laden, unique) are the ones technical rationality can't handle, and these require this move."
  - "how does the practitioner know when surprise warrants reframing vs noise? Schön doesn't formalize this; it's part of the artistry. Operationally: surprise that persists under the existing frame (the second test also doesn't fit; the patient's third datum also breaks the differential) signals frame-failure rather than data-noise. The skill is in calibrating when accumulated back-talk has crossed that threshold."
  - "what does the move require institutionally? Schön argues (Ch.10) that institutional contexts that punish admitting uncertainty and reward credentialed application of established technique SUPPRESS this move. Reflection-in-action is structurally fragile under technical-rationality-dominated regimes — even when practitioners know how to do it. The institutional question is whether reframing-in-act is safe to do visibly."
  - "operationally distinct from lex-e9z2y-style explicit method-selection: method-selection picks an established technique for a question; reflection-in-action constructs a new theory of the unique case rather than selecting from a catalog. The two compose — a reflection-in-action cycle may produce a candidate generalization that later becomes catalog material — but one converges on the unique case, the other applies the general."
