id: lex-5jf24
name: bureaucratic-incorporation-submerges-the-citizen-self-in-the-occupational-self
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a large number of technical experts are absorbed into a bureaucratic apparatus as subaltern specialists with a fixed, narrow sphere of competence, watch for a posture that outlasts the workplace: being rewarded for treating oneself as a mere technical auxiliary with no larger social judgment can generalize into a passive, dependent orientation toward political and civic life as a whole, not just toward the employer. Merton: 'The employment of large numbers of engineers and technologists in industrial bureaucracies further shapes their social perspectives. Knit into a bureaucratic apparatus, many engineers take their place as experts in a subaltern role with fixed spheres of competence and authority and with a severely delimited orientation toward the larger social system. In this status, they are rewarded for viewing themselves as technical auxiliaries.' He then names the transfer explicitly, citing Weber and Veblen: 'Max Weber and Thorstein Veblen, among others, have pointed to the danger that this occupational perspective, involving the rationalized abdication of social responsibility in favor of the administrator, may be transferred by engineers beyond the immediate economic enterprise. From this transference of outlook and the resulting trained incapacity for dealing with human affairs there develops a passive and dependent role for engineers and technologists in the realm of political organization, economic institutions, and social policy. The citizen-self threatens to become submerged in the occupational self.' Diagnostic use: when a technically skilled person or an entire professional class shows unusual civic passivity — deferring political and social judgment to 'those who are supposed to handle that' — check whether their occupational role has habituated a subaltern posture (fixed competence, no larger judgment, rewarded for staying in scope) that has simply generalized past the workplace, rather than assuming disengagement or apathy as the default explanation."
