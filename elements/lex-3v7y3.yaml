id: lex-3v7y3
name: converts-rigid-conformity-signals-missing-tacit-knowledge-not-character
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a new member of a group, faith, party, or profession enforces the rules more rigidly than veterans do, resist explaining it as personal rigidity or eagerness-to-please alone — Merton offers a structural explanation that is easy to miss because the motivational one is so intuitive. The eagerness account is real but partial: 'it is often been said, and this is probably part of the truth, that the convert becomes overly-zealous in his conformity to the norms of the group because he considers himself to be on trial and wishes to ensure his acceptance.' But Merton argues the deeper cause is an information gap: 'the convert may also be peculiarly conformist for want of having had first-hand knowledge of the nuances of allowable and patterned departures from the norms of the group which he has lately joined. As a result, and unlike long-established members of the group who have acquired this knowledge unwittingly in the course of their socialization, the convert tries to live up to the strict letter of these norms.' Veterans have absorbed, mostly without ever being told outright, exactly which rules are enforced strictly and which have a wide tolerated margin; the newcomer has only ever seen the official version and has no choice but to treat it as binding. This produces the recognizable social type of the prig, and its mirror-image, noblesse oblige: 'Those of established high rank in a group or society... know the rules of the game, that is, know the norms, and know their way around... the man of established rank can freely depart from the strict norms, particularly when it is not to his advantage to do so.' The asymmetry Merton names is sharp: 'a prig of low rank may be tolerated, if not liked, but a prig of high rank, standing to gain disproportionately by his insistence upon the letter of the norm, will be twice condemned and hated' — once for refusing to temper the rule to the situation, and again for profiting from that refusal. Diagnostic use: before judging a rigid rule-follower as inflexible or self-righteous by character, ask how long they have actually had to absorb the group's unwritten tolerance zone — the same behavior from a newcomer is usually an information deficit that time will fix, while the identical behavior from an established member who already knows the slack and refuses to use it is a genuine character judgment, and the two should not be read the same way."
