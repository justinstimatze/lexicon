id: lex-dun6c
name: insecure-standing-produces-public-overconformity-that-overshoots-the-groups-baseline
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone is conspicuously MORE orthodox than the group they belong to or want to belong to — quicker to the shibboleth, harsher on the outgroup, more punctilious about the norm than people whose place is not in question — read the display as evidence about their POSITION, not about their conviction. The claim: insecurity of standing produces overconformity, the overconformity is biased toward the PUBLIC channel, and it OVERSHOOTS the group's own baseline rather than converging on it. Three independent literatures find the same shape. (1) Peripheral group members derogate outgroups more than core members do, but only when they believe other members will see their response; core members show no public/private gap at all (Noel, Wann and Branscombe 1995) — the display is audience-conditional, which is what marks it as position-work rather than belief. (2) People who have just been excluded nonconsciously mimic an ingroup member more than an outgroup member (Lakin, Chartrand and Arkin 2008) — the response to threatened belonging is selective behavioural convergence on the group whose acceptance is at stake, and it runs below report. (3) In sociolinguistics the same curve is old and precise: the second-highest status group uses the prestige variant MORE than the highest status group does in formal styles, and shifts most steeply between casual and careful speech — Labov's crossover pattern, which he named hypercorrection. Note what the three cases have in common, because it fixes the scope: the driver is not being OUTSIDE the group, it is having standing that is NOT SECURE. Aspirants outside it, pledges inside its margin, and the rank just below the top all produce the shape; the securely central do not. THE OPERATIVE DIAGNOSTIC IS TWO COMPARISONS, and the atom is worth little without both. First, public against private: does the intensity change with the audience? If it does not, you are looking at conviction. Second, the person against the group's own centre: are they exceeding the baseline rather than approaching it? Overshoot is the signature — convergence alone is just learning. The corollary that makes this operationally useful: within a group, the loudest enforcers of a norm are disproportionately the members least secure in it, so the volume of enforcement is a poor guide to where the group's centre of gravity actually sits, and a leader who reads the centre off the loudest voices will systematically misjudge it. NONCONSCIOUSNESS IS A SEPARATE AND WEAKER CLAIM — the mimicry result is nonconscious, the audience-conditional result need not be, and treating 'they cannot report it' as a scope condition on the whole pattern immunises it against a whole class of disconfirmation. Hold it as a testable sub-claim, not as a reason to discount self-report in advance. DISTINCT FROM lex-345ta adopting-a-reference-groups-norms-before-entry-trades-standing-for-admission (Merton): lex-345ta names the TRADE the aspirant makes — current standing spent for future admission — and is agnostic about how the pre-adoption looks; this atom names the DISTORTION in the display, and applies to insecure members who are already in and not trading anything. Read lex-345ta for what the move costs, this one for how to spot it. Distinct from and complementary to lex-7ra5h countersignaling-anti-signal-as-status-by-other-means: that is the same variable read from the secure end — those certain of their standing can afford to UNDER-signal — so the two atoms are the ends of one distribution over security-of-position, and a group's signalling behaviour is only legible when both are on the table. Distinct from lex-xj7s3 preference-falsification-private-belief-while-public-conformity-under-disclosure-cost (Kuran): preference falsification conceals a private belief that DIVERGES IN DIRECTION from the public one; the overconformer may hold the group's belief entirely sincerely, and the public/private gap is in INTENSITY OF EXPRESSION, not in the content of what is believed. Kuran's mechanism predicts a cascade when disclosure costs fall; this one predicts no such reversal, because there is no suppressed contrary preference waiting underneath."
related: [lex-xj7s3, lex-7ra5h, lex-xu94g, lex-pn8qn, lex-r7zuy, lex-trady, lex-pwhsd, lex-345ta]
scaffolds-from: [lex-xu94g]
evokes: [hypercorrection, the-crossover-pattern, peripheral-membership-status, public-negativity-toward-outgroups, more-catholic-than-the-pope, convert-zeal, the-loudest-enforcer-is-the-least-secure, overshoot-not-convergence, audience-conditional-orthodoxy, nonconscious-mimicry-under-exclusion, pledge-versus-active]
lineage:
  - source: primary
    tradition: social-identity-theory
    text: noel-wann-branscombe-1995-peripheral-ingroup-membership-status
    citation: "Jeffrey G. Noel, Daniel L. Wann and Nyla R. Branscombe, 'Peripheral Ingroup Membership Status and Public Negativity Toward Outgroups,' Journal of Personality and Social Psychology 68:1 (1995), pp. 127-137. The audience-conditionality result that makes the pattern diagnosable: members occupying a peripheral position in a desirable ingroup express more negativity toward outgroups than core members do when they expect their responses to be seen by other ingroup members, while core members show no comparable public/private difference. The public/private interaction is the load-bearing part — it is what separates position-work from conviction, and it is why the atom's diagnostic is a comparison rather than a threshold. No verbatim quote is claimed here."
  - source: primary
    tradition: social-identity-theory
    text: lakin-chartrand-arkin-2008-nonconscious-mimicry-after-exclusion
    citation: "Jessica L. Lakin, Tanya L. Chartrand and Robert M. Arkin, 'I Am Too Just Like You: Nonconscious Mimicry as an Automatic Behavioral Response to Social Exclusion,' Psychological Science 19:8 (2008), pp. 816-822. Supplies the automaticity and the selectivity: participants whose belonging had been threatened by exclusion mimicked the behaviour of an ingroup member more than that of an outgroup member, without awareness of doing so. This is the atom's warrant for treating threatened standing as producing convergence behaviour below the level of report — and it is the only one of the three sources that establishes nonconsciousness, which is why the atom holds that as a narrower claim than the pattern as a whole. No verbatim quote is claimed here."
  - source: primary
    tradition: variationist-sociolinguistics
    text: labov-1966-social-stratification-of-english-in-new-york-city
    citation: "William Labov, The Social Stratification of English in New York City (Washington DC: Center for Applied Linguistics, 1966; 2nd edn Cambridge University Press 2006), ch.7 'Class Differentiation of the Variables,' p.151, on the (r) variable's cross-over pattern. The crossover pattern: across a status hierarchy, use of a prestige variant rises with status in casual speech, but in the most formal styles the second-highest group crosses above the highest, and that group also shows the steepest shift between casual and careful style. An entirely independent literature, a different method and a different century's worth of data, producing the atom's two signatures together — overshoot of the target group's own baseline, and a public/monitored versus private/casual gap that is largest exactly where standing is least secure. This is the cross-domain attestation that makes the pattern substrate-worthy rather than a finding about undergraduates. Note for whoever reads it further: Labov puts 'hypercorrection' in scare-quotes himself at this exact passage, flagging his own use as a narrower, quantitative sense than the popular one ('overapplying a rule, as in between you and I') — the atom's caution is Labov's own."
    quote: "'There is one cross-over in the pattern: the sudden upward jump of the 6-8 class, which goes beyond the class 9 line for Styles D and D'. [...] The cross-over pattern, recognized here for the first time in New York City, has appeared quite often as a general characteristic of a second-highest status group. Over and over again, we see that in the most formal styles, this group over-shoots the mark of the highest status group. In fact, this quantitative type of 'hypercorrection' may be related to one of the fundamental driving forces in linguistic change.'"
canonical-instances:
  - "the pledge and the active: someone in the probationary margin of a fraternity, a religious community, a political faction or a professional body is markedly harsher on the group's outgroups and more scrupulous about its rules than long-standing members are — but chiefly where members can see. The long-standing member has nothing to demonstrate and can be relaxed, even irreverent, about the same norms (Noel, Wann and Branscombe's design in its natural habitat)"
  - "the convert's zeal, and 'more Catholic than the Pope': the recently-arrived hold the line more rigidly than those born into it. The idiom exists in most languages with a religious hierarchy to point at, which is itself evidence the pattern is not a laboratory artifact — and note it names an OVERSHOOT of the authority's own position, not merely strong belief"
  - "Labov's crossover: lower-middle-class New York speakers use the prestige (r) more than upper-middle-class speakers in the most formal styles, and shift more steeply from casual to careful speech than any other group. The status hierarchy's second rank is where standing is most exposed, and it produces the overshoot and the style-gap together"
  - "the online community sorting itself out: a new arrival adopts the forum's vocabulary, its enemies and its in-jokes at a higher intensity than the long-tenured, and does so in posts rather than in direct messages. The public-channel bias is the tell — a norm held rather than performed does not vary that sharply with who is watching"
  - "the corollary that changes a decision: a leader reading their organisation's centre of gravity off the loudest internal enforcers of a norm will place it wrong, because volume of enforcement is concentrated among those least secure in their standing. The people whose position is safe are the quiet ones, and they may be nowhere near where the noise suggests"
  - "the securely central end of the same axis (lex-7ra5h): the founder in a hoodie, the old-money patina, the senior figure who cheerfully violates the dress code. Under-signalling and over-signalling are the two tails of one distribution over security-of-position, which is why reading either alone gets a group's norms wrong"
critical-questions:
  - "is there actually an overshoot, or only convergence? Convergence on the group's norms is ordinary socialisation and needs no special mechanism. The atom's claim is EXCEEDING the group's own centre, which requires knowing where that centre is — measured on the same people at the same time, not against a remembered or averaged baseline. A community whose norms are themselves drifting will produce a spurious overshoot from a flat individual trajectory measured against a stale mean"
  - "does the intensity move with the audience? Without the public/private comparison this atom is unfalsifiable against simple sincerity, and sincere intense belief is common and needs no explaining. If the display is identical when nobody is watching, the position-insecurity reading is wrong and should be dropped rather than defended"
  - "which way does the causation run? The same identification problem that limits lex-345ta's American Soldier evidence applies here and is not escaped by better data: overshooters who are admitted stay observable, overshooters who are refused leave, and admission may itself be caused by the overshoot. Comparing admitted against never-admitted trajectories does not clean this up, because the groups are separated by the very outcome the overshoot is supposed to explain"
  - "does the display relax after standing is secured, or persist? Persistence is compatible with the overconformity having been internalised — the dissonance literature makes this the expected outcome rather than a surprise — in which case the behaviour has stopped being position-work and the atom no longer applies to it, even though it did at the outset. The atom names an origin, not a permanent type of person, and using it as a character judgement about someone whose position has long since become secure is a misuse"
  - "is nonconsciousness being claimed, and on what warrant? Only the mimicry evidence establishes it; audience-conditional behaviour need not be unconscious to be unreported. Do not convert 'largely nonconscious' into 'self-report is inadmissible' — that move makes the pattern unfalsifiable by construction and removes the cheapest available disconfirmation. Ask people; treat a clean self-report as evidence, and treat a systematic mismatch between report and behaviour as the interesting finding rather than as noise"
status: under-review
