id: lex-fxtvb
name: baseline-communism-is-the-default-toward-anyone-not-treated-as-an-enemy
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Look for a default operating principle running underneath ordinary social life. A scaled version of 'from each according to their abilities, to each according to their needs' applies to essentially anyone not actively treated as an enemy: a light, directions, holding an elevator get near-automatic compliance from total strangers with no expectation of repayment. The same logic scales up sharply for genuinely extreme need, like pulling a drowning stranger from the water. Graeber names this 'baseline communism': 'the understanding that, unless people consider themselves enemies, if the need is considered great enough, or the cost considered reasonable enough, the principle of \"from each according to their abilities, to each according to their needs\" will be assumed to apply.' He argues this baseline, not generic 'cooperation,' is the actual substrate that makes society possible at all -- and that it stays invisible precisely because it's the default. What makes it visible is what it takes to suspend it: a genuine, specific threat, not mere unfamiliarity."
related: []
evokes: [david-graeber, debt-the-first-5000-years, baseline-communism, from-each-according-to-their-abilities, evans-pritchard-nuer-directions, unless-people-consider-themselves-enemies]
lineage:
  - source: primary
    text: graeber-2011-debt-baseline-communism-definition
    citation: "David Graeber, Debt: The First 5,000 Years (Melville House, 2011), ch.5 'A Brief Treatise on the Moral Grounds of Economic Relations.'"
    quote: "“I will call this ‘baseline communism’: the understanding that, unless people consider themselves enemies, if the need is considered great enough, or the cost considered reasonable enough, the principle of ‘from each according to their abilities, to each according to their needs’ will be assumed to apply. Of course, different communities apply very different standards. In large, impersonal urban communities, such a standard may go no further than asking for a light or directions. This might not seem like much, but it founds the possibility of larger social relations.”"
canonical-instances:
  - "The direct textual anchor -- the exception that proves the rule: anthropologist E.E. Evans-Pritchard, doing fieldwork among the Nuer, discovered he had been deliberately given wrong directions. When he asked why, he was told: ‘You are a foreigner, why should we tell you the right way? Even if a Nuer who was a stranger asked us the way we would say to him, “You continue straight along that path,” but we would not tell him that the path forked. Why should we tell him? But you are now a member of our camp and you are kind to our children, so we will tell you the right way in future.’ It took an active colonial conflict -- Evans-Pritchard's own government had recently bombed this settlement -- to suspend the default, and even then only until he was reclassified as belonging."
  - "Hypothetical: a stranger at a coffee shop asks another patron to watch their laptop for thirty seconds while they use the restroom. The request is granted instantly, with no negotiation and no expectation of anything in return -- yet the same two people, negotiating the sale of the laptop itself five minutes later, switch entirely into haggling over price. The same pair of strangers is operating on two completely different moral logics within the same five minutes, one baseline-communist and one exchange-based, without either registering a contradiction."
critical-questions:
  - "Graeber frames the scaling variable as 'how great the need' or 'how small the cost,' but these aren't obviously the same axis -- is there a single underlying variable governing when baseline communism applies, or are cost-to-the-giver and severity-of-need two independent thresholds that happen to correlate in his examples?"
  - "The Nuer case suggests the default can be suspended by an active, specific enmity, but is mere unfamiliarity (a stranger with no known relationship, absent any conflict) enough on its own to weaken the baseline, or does Graeber's argument require that a stranger still gets the small-cost version of baseline communism (directions, a light) and only loses the larger-cost version (food, shelter) that intimates receive?"
