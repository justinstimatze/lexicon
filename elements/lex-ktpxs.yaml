id: lex-ktpxs
name: without-overarching-authority-defensive-preemption-becomes-equilibrium-among-equal-agents
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when conflict between agents (states, organizations, software systems, individuals) is analyzed as caused by individual malice or bad intent when the structural reality is the ABSENCE of overarching authority producing defensive-preemption pressure even on good-faith agents. Hobbes's transferable contribution (Leviathan Ch.XIII): when agents are roughly equal in capacity + scarcity exists + no common power enforces agreements, three structural pressures generate conflict — COMPETITION (invade for gain), DIFFIDENCE (invade for safety, preemptive defense against feared attack), and GLORY (invade for reputation, signaling resolve). Defensive preemption is the most insidious: even an agent with no aggressive intent must, in the absence of overarching authority, defensively act on worst-case assumptions about others — and this preemptive defense looks like aggression to the other agent, whose defensive preemption then looks like aggression to the first. The equilibrium is mutual preemption + permanent posture of war (`not in actuall fighting; but in the known disposition thereto`). Hobbes's foundational demonstration: lock your door, arm yourself when traveling, lock your chests at home — you do these things even though laws exist; how much more would you do them absent overarching authority? Transferable applications: (a) international relations realism (Waltz 1979 *Theory of International Politics*; Mearsheimer 2001 *Tragedy of Great Power Politics*; Jervis 1978 *Cooperation Under the Security Dilemma* — the security-dilemma literature explicitly operationalizes Hobbes's defensive-preemption claim for state behavior); (b) open-source software security (in the absence of central authority over the supply chain, each project defensively secures against unknown upstream threats — the SBOM + reproducible-build + supply-chain-attack literature; Cox 2019 *Software Dependencies as a Supply Chain* on the structural problem); (c) online platform interactions (in the absence of central moderation, race-to-the-bottom dynamics in content + behavior; Tufekci 2017 *Twitter and Tear Gas*); (d) frontier markets + failed states (when state authority dissolves or fails to extend, the Hobbesian conflict-pressure emerges; Hirschman 1970 *Exit, Voice, and Loyalty* on the importance of overarching authority for cooperative equilibria; Olson 1993 *Dictatorship, Democracy, and Development* on stationary-bandit-as-Leviathan); (e) multi-agent AI systems (in the absence of overarching coordination, defensive optimization dominates — composes with current AI safety + multi-agent-RL literature; Dafoe et al 2020 *Open Problems in Cooperative AI* explicitly invokes Hobbes); (f) corporate competition without antitrust enforcement (Standard Oil + Carnegie Steel + Microsoft 1990s + Big-Tech 2010s — when antitrust is weak, Hobbesian competition + diffidence + glory dynamics dominate); (g) decentralized finance + crypto (in the absence of legal-enforcement infrastructure, the Hobbesian dynamics produce rugpulls, defensive-multisig, MEV attacks, etc.); (h) digital + biological weapons proliferation (Hobbesian state-of-nature pressure on capability-development; Acharya + Allison 2024 on AI as proliferation accelerant); (i) reputation-systems engineering (the systemic role of reputation-tracking infrastructure as Leviathan-substitute; eBay, Airbnb, LinkedIn endorsements); (j) game-theoretic prisoner's-dilemma + tragedy-of-commons foundations (Hardin 1968; Olson 1965 — both presuppose Hobbesian individual rationality + are made tractable by overarching-authority assumptions). Distinct from lex-rfcb7 credibility-comes-from-visibly-foreclosed-options (Schelling — commitment-device against future self; lex-ktpxs is about structural-conflict-pressure absent enforcement, lex-rfcb7 is one solution-pattern). Distinct from lex-afzzp each-thing-strives-to-persist-in-its-own-being (Spinoza conatus — the persistence-tendency that underlies Hobbesian diffidence; lex-ktpxs specifies the inter-agent dynamics that emerge from conatus + scarcity + no-authority). Distinct from lex-d234k sensemaking-is-retrospective (Weick — individual sensemaking; different scale). Distinct from lex-3656j shared-institutional-reality (Berger-Luckmann — institutions as solution-pattern to coordination problems that lex-ktpxs names). Use when (i) conflict between agents is being analyzed as caused by individual malice when defensive-preemption dynamics are the structural reality, (ii) you are designing intervention + must decide whether to address agents' intent (rarely the leverage point) or the overarching-authority gap (usually is), (iii) you are evaluating an arrangement-without-overarching-authority + want to predict whether cooperative equilibria are achievable. Counter-move: name the absence of overarching authority; trace the defensive-preemption dynamics; ask whether overarching authority can be constructed (institution, contract, repeated interaction with reputation, monitoring + sanction) or whether the conflict will continue."
