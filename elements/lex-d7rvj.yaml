    quote: "'The senapati was paid a princely 48,000 panas per year, to prevent him from succumbing to the temptations of the enemy or rising up in revolt.'"
canonical-instances:
  - "A company pays its most technically indispensable engineer, who alone understands a critical legacy system, well above market rate -- not primarily as a retention perk, but because that single high salary simultaneously removes both the incentive to defect to a competitor with the same knowledge and the leverage they'd otherwise have to extract concessions by threatening to withhold their expertise."
  - "A country grants its most powerful regional general both a generous personal budget and formal prestige, recognizing that the same single measure addresses both the risk of the general being bought off by a foreign power and the risk of the general using dissatisfaction with their position to justify a coup."
critical-questions:
  - "does treating both risks as reducible to one comparison miss cases where the two threats have genuinely different underlying causes -- for example, ideological defection or ambition for personal glory, which money doesn't touch, versus purely mercenary betrayal, which it does?"
  - "does relying on this single lever mean an organization stops watching for either threat once the payment is in place, when a large payment could just as easily fund a rival power base rather than remove the incentive to build one?"
  - "at what point does the payment required to keep both risks below threshold become large enough that it creates a new problem -- an overpaid, entrenched figure whose compensation itself becomes politically or financially unsustainable to maintain or to ever reduce?"
