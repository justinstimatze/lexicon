lineage:
  - source: primary
    text: sen-1987-on-ethics-and-economics
    citation: "Amartya Sen, *On Ethics and Economics* (Basil Blackwell, 1987), Ch.1 'Economic Behaviour and Moral Sentiments.' Sen (b. 1933; 1998 Nobel Memorial Prize in Economic Sciences) develops the book's opening argument by tracing economics to two distinct historical origin-traditions and arguing that modern welfare economics has narrowed toward one of them at the cost of the other."
    quote: "[On the ethics-related tradition, tracing to Aristotle:] 'At the very beginning of The Nicomachean Ethics, Aristotle relates the subject of economics to human ends, referring to its concern with wealth. He sees politics as \"the master art\"... since, again, it legislates as to what we are to do and what we are to abstain from, the end of this science must include those of the others, so that this end must be the good for man.' 'The life of money-making is one undertaken under compulsion, and wealth is evidently not the good we are seeking; for it is merely useful and for the sake of something else.' [On the two foundational issues this tradition keeps live:] 'there is the problem of human motivation related to the broadly ethical question \"How should one live?\"... I shall call this \"the ethics-related view of motivation\".' '...noted some special aggregative features in the exercise: \"though it is worthwhile to attain the end merely for one man, it is finer and more godlike to attain it for a nation or for city-states\"... This \"ethics-related view of social achievement\" cannot stop the evaluation short at some arbitrary point like satisfying \"efficiency\". The assessment has to be more fully ethical, and take a broader view of \"the good\".' [On the engineering tradition:] 'In discussing a great range of practical problems, varying from \"building of villages\", \"land classification\", \"collection of revenue\", \"maintenance of accounts\", \"tariff regulations\", etc., to \"diplomatic manoeuvres\", \"strategy for vulnerable states\", \"pact for colonization\", \"influencing parties in an enemy state\", \"employing spies\", \"controlling embezzlement by officers\", and so on, the attention is very firmly on \"engineering\" problems. The motivations of human beings are specified by and large in fairly simple terms... Ethical considerations in any deep sense are not given much role in the analysis of human behaviour.' [On both traditions having genuine cogency, present in varying proportions across major economists:] 'it is not surprising that both the ethics-related origin and the engineering-based origin of economics have some cogency of their own. I would like to argue that the deep questions raised by the ethics-related view of motivation and of social achievement must find an important place in modern economics, but at the same time it is impossible to deny that the engineering approach has much to offer to economics as well. In fact, in the writings of the great economists both the features are noticeable in varying proportions. The ethical questions are obviously taken more seriously by some than by others. For example, it has a greater hold on the writings of, say, Adam Smith, John Stuart Mill... Karl Marx, or Francis Edgeworth, than on the contributions of, say, William Petty, Francois Quesnay, David Ricardo, Augustine Cournot, or Leon Walras, who were more concerned with the logistic and engineering problems within economics.'"
  - source: discovery-loop
    text: distinctness-audit-sen-ethics-engineering-traditions
    citation: "Lex-0837 (Hayek, price-signal-compresses-dispersed-knowledge) is an entirely distinct axis: Hayek's claim is a specific knowledge-aggregation mechanism, while Sen's is a historical and disciplinary claim about economics' two origin-traditions, with no overlap between them. Aristotle appears here only as one historical pole within Sen's own modern methodological argument about the discipline of economics, not as an independently-grounded Aristotle claim in his own right."
canonical-instances:
  - "Sen's own roster of which major economists lean toward which tradition: the ethics-related strand runs stronger in Adam Smith, John Stuart Mill, Karl Marx, and Francis Edgeworth; the engineering strand runs stronger in William Petty, François Quesnay, David Ricardo, Augustin Cournot, and Léon Walras — evidence that the two traditions have coexisted with varying weight across the discipline's own canonical figures, not that one supplanted the other at some clean historical break."
  - "The Arthashastra as Sen's example of the engineering tradition's ancient pedigree: a contemporary-to-Aristotle administrative text organized around practical governance problems (revenue collection, tariff regulation, employing spies, controlling embezzlement) with a comparatively simple model of human motivation and little role for deep ethical questions — the engineering tradition's own ancient counterpart to Aristotle's ethics-related one."
  - "Sen's specific critique of modern welfare economics: that its increasing exclusive reliance on the engineering tradition's narrow self-interested model has come at the cost of the ethics-related tradition's insistence that judging social achievement 'cannot stop the evaluation short at some arbitrary point like satisfying efficiency' — a live methodological cost, not a merely historical curiosity."
  - "A modern cross-domain analogue, responsibly extending rather than drawn from Sen's text: a technology company whose founding mission statement invoked broad social benefit (an 'ethics-related' founding tradition) but whose present internal culture and metrics have narrowed almost entirely to growth-and-engagement optimization (an 'engineering' tradition) — illustrating the atom's general claim that a field or organization's present dominant methodology can reflect historical drift toward one of several founding traditions rather than a discovery that the other was mistaken or out of scope."
critical-questions:
  - "Is this field's current dominant methodology being presented as simply what the field IS or must be, when in fact the field has two or more distinct historical origin-traditions with different accounts of motivation and success, and the present dominance reflects a historically contingent drift rather than a settled discovery?"
  - "Does the field's standard for judging success stop at a narrow technical measure (like efficiency) because that is genuinely sufficient for the question at hand, or because the field has narrowed away from an older tradition that insisted a broader, more fully ethical standard was required?"
  - "Is the critique being made a claim that one tradition is simply illegitimate, or the more precise claim that both traditions have genuine cogency and the live question is which balance between them is appropriate for this specific problem?"
  - "When a major figure in this field is invoked as an authority, which of the field's traditions does their actual work draw on more heavily — and does the invocation implicitly claim a homogeneity across the field's canon that Sen's own roster (Smith/Mill/Marx/Edgeworth vs. Petty/Quesnay/Ricardo/Cournot/Walras) shows does not actually exist?"
