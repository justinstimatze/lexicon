id: lex-uetgd
name: finding-similarity-between-cases-remakes-the-rule-it-invokes
type-in: claim
type-out: state
_tier: atomic
agent-instruction: "When someone cites a rule that a precedent case supposedly established, check what work is actually being done: the rule's scope tracks which facts later judges treat as similar to the original case, and that similarity-finding keeps happening after the rule was first announced. The cited rule is a snapshot of the classification as of whichever case most recently redrew it. Ask which later case's similarity-judgment you are actually relying on before treating 'the rule' as settled."
related: [lex-chtk9, lex-kh9cr, lex-8n237, lex-2vpet]
scaffolds-from: [lex-kh9cr]
evokes: [reasoning-by-example, moving-classification-system, case-to-case-reasoning, ratio-decidendi, legal-realism]
lineage:
  - source: primary
    text: levi-1949-basic-pattern-reasoning-by-example
    citation: "Edward H. Levi, An Introduction to Legal Reasoning (Phoenix Books, University of Chicago Press, Rev. ed. 1949; from the 1948 University of Chicago Law Review essay), pp.1-4, opening the book. Levi's programmatic statement of case-law reasoning: three steps (similarity seen between cases; the rule of the first case announced; the rule made applicable to the second), but the rule announced at step two is not a fixed template later cases merely apply — its scope depends on what later similarity-findings decide it covers, so the rule itself changes with each case that invokes it. The footnote markers and the ']' bracketed cut both fall on bare superscript digits interleaved by the OCR reading order, not on any word of the quoted prose."
    quote: "The basic pattern of legal reasoning is reasoning by example. It is reasoning from case to case. It is a three-step process described by the doctrine of precedent in which a proposition descriptive of the first case is made into a rule of law and then applied to a next similar situation. The steps are these: similarity is seen between cases; next the rule of law inherent in the first case is announced; then the rule of law is made applicable to the second case. [...] If this were the doctrine, it would be disturbing to find that the rules change from case to case and are remade with each case. Yet this change in the rules is the indispensable dynamic quality of law. It occurs because the scope of a rule of law, and therefore its meaning, depends upon a determination of what facts will be considered similar to those present when the rule was first announced. The finding of similarity or difference is the key step in the legal process. [...] Thus it cannot be said that the legal process is the application of known rules to diverse facts. Yet it is a system of rules; the rules are discovered in the process of determining similarity or difference."
  - source: primary
    text: levi-1949-moving-classification-system
    citation: "Edward H. Levi, An Introduction to Legal Reasoning (Phoenix Books, University of Chicago Press, Rev. ed. 1949), p.4. Levi's own name for the mechanism the rest of the atom describes: a system in which the categories deliberately stay ambiguous enough for the community to keep contesting and revising them case by case."
    quote: "Therefore it appears that the kind of reasoning involved in the legal process is one in which the classification changes as the classification is made. The rules change as the rules are applied. More important, the rules arise out of a process which, while comparing fact situations, creates the rules and then applies them. [...] The categories used in the legal process must be left ambiguous in order to permit the infusion of new ideas. [...] A controversy as to whether the law is certain, unchanging, and expressed in rules, or uncertain, changing, and only a technique for deciding specific cases misses the point. It is both. [...] The law forum is the most explicit demonstration of the mechanism required for a moving classification system."
canonical-instances:
  - "Levi's own worked example (pp.10-16): a seller's liability for an article that injures someone who never bought it from them. Dixon v. Bell (1816) finds liability for a loaded gun left 'in a state capable of doing mischief.' Later cases narrow that classification to inherently-dangerous articles only, then widen it again as courts find new products (an exploding lamp, a defective wheel, an automobile) 'similar enough' to the original gun. By MacPherson v. Buick Motor Co. (1916), the rule looks nothing like Dixon v. Bell's — not because anyone amended it, but because a century of similarity-findings kept redrawing which facts counted."
  - "A company's written 'remote-work-eligible' policy never changes, but its enforced boundary does: each time HR decides whether a new employee's situation is similar enough to the first grandfathered case to also count, the policy's actual scope shifts. Anyone citing 'the policy' without asking which prior case's similarity-finding currently defines it is citing a boundary that may have already moved."
  - "operationally distinct from lex-chtk9 argument-from-precedent: lex-chtk9 is a single dialogue-move — citing one case where a rule's antecedent held but its conclusion didn't, to force an exception onto an otherwise-stable rule. This atom is not about any one move; it's the claim that the rule was never stable in the first place, because every ordinary application (not just exception-citing) redetermines its scope."
  - "operationally distinct from lex-kh9cr argument-from-analogy: lex-kh9cr asks whether ONE proposed transfer from case C1 to case C2 is warranted. This atom is about the cumulative effect of many such transfers on the rule itself — each accepted or rejected analogy is also an act of redrawing what the rule covers, which is why the same rule looks different after a century of case law even though no one ever voted to change it."
  - "operationally distinct from lex-8n237 Cardozo's four legitimation methods: Cardozo's framework describes what a judge does when a rule runs OUT — in the gap or 'penumbra' where no existing rule decides the case. This atom describes what happens in the ordinary, non-gap application of an existing rule: even routine similarity-findings keep reshaping the rule's scope. Cardozo's own MacPherson v. Buick opinion (cited in lex-8n237's canonical-instances) is the same case Levi analyzes here, read through a different lens — Cardozo names which of four methods he used to decide it; Levi treats the decision as one more link in a century-long chain of classification-drift that no single method fully explains."
critical-questions:
  - "Is 'the rule' being cited the rule as first announced, or as most recently redetermined by a later case? Quoting an early formulation as though no later similarity-finding had touched it treats a moving target as fixed."
  - "Could two people invoke 'the same rule' from the same precedent while actually relying on different later cases' similarity-findings, and so mean different things by it without either one noticing?"
  - "Is the ambiguity in the category doing real work — leaving room for the community's wants to change, as Levi argues it must — or is it being exploited to smuggle in a reclassification nobody would accept if stated plainly?"
severity-tier: info
status: active
