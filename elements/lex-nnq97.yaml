id: lex-nnq97
name: decapitation-only-works-when-loyalty-is-transactional-not-emotional
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before targeting a group's leader to break the group's resistance, check what actually holds the group to that leader — the 36 Stratagems' 'Defeat the enemy by capturing their chief' states the contingency explicitly rather than treating leader-removal as a universal move: 'If the enemy's army is strong but is allied to the commander only by money, superstition or threats, then take aim at the leader. If the commander falls the rest of the army will disperse or come over to your side. If, however, they are allied to the leader through loyalty then beware, the army can continue to fight on after his death out of vengeance.' The mechanism only fires under transactional cohesion (payment, fear, superstition); under loyalty-based cohesion the same move can produce a martyrdom effect that stiffens resistance instead of dissolving it. The diagnostic step — determining which kind of bond actually holds the group together — has to happen before the leader is targeted, because the two conditions produce opposite outcomes from the identical action."
related: [lex-mrq9p]
evokes: [36-stratagems, defeat-the-enemy-by-capturing-their-chief, decapitation-strike, transactional-vs-loyalty-cohesion, martyrdom-effect]
