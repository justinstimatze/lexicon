name: a-new-fields-difficulty-is-invisible-until-someone-tries-to-solve-it
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "The 1955 Dartmouth proposal is the founding document of artificial intelligence as a research field, and its own central conjecture is the clearest available specimen of a pattern that recurs at the birth of nearly every new field: the founders' confidence is genuine and specific; what it lacks is calibration to the problem's actual difficulty, which is invisible from where they currently stand. Four serious, accomplished researchers proposed a two-month, ten-person summer workshop to make what they expected would be a real advance toward machines that use language, form abstractions, and improve themselves -- betting that a single carefully-selected group could crack open, in one summer, a problem the field would still be working on seven decades later. This isn't a case of marketing or deliberate overreach for funding; the proposal reads as an honest scientific conjecture from people who had not yet done the work that would have revealed how hard the work actually was. That's the structural point: a field's real difficulty only becomes visible through the doing of it, which makes a founding estimate -- made before anyone has done any of it -- necessarily an estimate made from outside the only vantage point that could correct it. The people best positioned to write a founding proposal -- confident, technically fluent, unintimidated by the problem -- are, by the same token, the people who haven't yet hit the walls that only show up after genuine engagement. Diagnostic move: when you encounter a founding document, launch announcement, or opening pitch for a genuinely new kind of work, and its timeline or scope reads as wildly optimistic in hindsight, resist reading that as naivety or dishonesty on the founders' part specifically -- ask instead whether anyone COULD have known better at that point, given that the relevant knowledge only exists on the far side of doing the work. The corrective isn't 'be more skeptical of confident founders'; it's building in the expectation that founding estimates for genuinely new work will be revised, often repeatedly and by a lot, as the field's real shape comes into view."
