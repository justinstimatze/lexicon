name: reliable-and-timely-help-outweighs-a-larger-but-uncertain-contribution
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When choosing between a partner who offers a large but occasional contribution and one who offers a smaller but dependable one, don't default to whoever's maximum offer is bigger -- Kautilya works through two parallel debates where the rival teachers reach for raw magnitude and he corrects them by pricing in reliability and timing instead. First, size versus consistency: 'Some teachers say that a temporary friend giving substantial help shall be chosen because such a friend by giving a lot of help in a short time helps to meet a large outlay. Kautilya disagrees. The constant ally giving smaller help shall be preferred. The temporary friend giving substantial help is likely to withdraw for fear of having to give more or, even if he actually provides the help, will expect it to be repaid. The constant ally, giving a small help continuously, does, in fact, give great help over a period of time.' The large contributor's offer carries two hidden discounts the headline number doesn't show: a real chance of last-minute withdrawal once the scale of what's being asked becomes clear, and an expectation of repayment that makes the help less like a gift and more like a loan with the terms undisclosed until later. The small, steady contributor's help, compounded over time, can outweigh the one-time large offer once those discounts are priced in. Second, speed versus scale: 'Some teachers say that a mighty ally is to be preferred because he adds prestige to the venture and, once he has mobilised, helps to accomplish the task quickly. Kautilya disagrees. An ally mobilising quickly, even if he is less mighty, is preferable because he does not allow the opportune time for action to pass and, being weaker, can be used according to the wishes of the conqueror; a mighty friend with extensive territory is less easy to control.' A large resource that arrives after the window for using it has closed delivers zero value regardless of its size, while a smaller resource that arrives in time to act captures the opportunity entirely -- and a large ally's slowness is compounded by being harder to direct once it does arrive, since scale and controllability move in opposite directions. Diagnostic move: when evaluating competing offers of help, investment, or partnership, price in whether the help will actually arrive, on what terms, and in time to matter -- not just its stated maximum size, since a discounted, dependable, on-time contribution routinely outperforms a larger one that carries withdrawal risk, hidden repayment expectations, or a mobilization delay that consumes the opportunity it was meant to seize."
