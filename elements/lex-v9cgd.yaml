id: lex-v9cgd
name: attention-is-precision-optimization-of-prediction-error
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when 'attention' is being treated as a separate faculty or mental spotlight that gets pointed at things, and the question is what attention actually DOES computationally — or when explaining why cueing, threat-salience, expertise, or noisy environments change what gets attended to. Hohwy's claim, synthesizing Friston's proposal: attention is not a distinct mechanism sitting alongside perception — it IS the optimization of expected precision (confidence-weighting, i.e. gain) on prediction-error signals within a hierarchical predictive-inference system. 'Attention is then the process of optimizing precision of prediction errors in hierarchical perceptual inference... attention requires learning state-dependent patterns of noise and precision and then using such prior beliefs to set the gain on prediction error.' Concretely: the system continuously estimates how RELIABLE each incoming signal is likely to be (visual input is more reliable in daylight than at dusk; a whisper is less reliable evidence than a shout), and it increases the weight ('gain') given to signals expected to be precise while damping signals expected to be noisy — 'precise prediction error is allowed passage up through the hierarchy to a larger extent than imprecise prediction error.' This is a genuinely different claim from William James's classic phenomenological description of attention as 'the taking possession by the mind, in clear and vivid form, of one out of what seem several simultaneously possible objects' — Hohwy's account keeps James's basic-level description intact (something IS selected, something IS withdrawn-from) while replacing the 'spotlight' metaphor with a specific statistical mechanism: reliability-estimation setting a gain-knob. The theory predicts, and is tested against, Posner-cueing experiments (a valid spatial cue that predicts a target's location 80% of the time speeds detection at the cued location — because the cue raises expected precision there) and inattentional-blindness cases (low expected precision/gain on an unattended region means its prediction error, even if large, fails to propagate and update belief — which is why a fully visible but unattended event can go completely unnoticed). Practitioner move: when trying to explain or direct where attention goes, don't reach for 'focus harder' as the lever — the actual lever is EXPECTED RELIABILITY of a channel or location. Anything that raises a channel's expected precision (a predictive cue, prior expertise with that channel's typical noise profile, a threat signal that reliably co-occurs with danger) will pull attention there without any separate 'spotlight' mechanism being invoked."
