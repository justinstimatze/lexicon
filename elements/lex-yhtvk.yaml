id: lex-yhtvk
name: fluency-during-practice-is-an-unreliable-index-of-durable-learning
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When evaluating whether someone (yourself, a student, a team, a model) is durably learning a skill or body of knowledge, weight Soderstrom & Bjork's 2015 structural finding: PERFORMANCE during acquisition (what can be observed and measured during practice or training) is an unreliable index of LEARNING (durable retention and flexible transfer to new contexts). The two can dissociate completely, and some experimental manipulations produce OPPOSITE effects on the two — the conditions that yield the most errors and slowest performance during acquisition often produce the strongest long-term retention. Operationally: (1) Spaced practice (distributing study sessions across time) produces worse acquisition performance than massed practice (cramming) but far better long-term retention — and learners overwhelmingly prefer massed practice because it FEELS more productive. (2) Retrieval practice (testing yourself) feels harder and produces more errors than re-reading, but durably outperforms re-reading on later tests. (3) Variable practice (mixing exemplars or contexts) is harder during training than blocked practice on a single exemplar, but produces stronger transfer. (4) Interleaving topics during study is more error-prone than studying one topic to mastery before moving on, but yields better discrimination and retention. Metacognitively, learners systematically prefer the WORSE condition because subjective fluency during acquisition acts as the felt evidence of learning, even when objective long-term outcomes are inverted. Transferable diagnostic: when an indicator is available (fluency, speed, immediate accuracy) and pivotal decisions are made off it (allocate more study to topic X, stop drilling skill Y, declare a model trained), ask whether the indicator is merely an imperfect proxy or actually INVERTED for the target. Ask whether the felt confidence in the indicator is itself a fluency cue generated by the indicator's salience. Domains where the pattern recurs beyond classroom learning: athletic training (over-rehearsing a perfected motion can degrade adaptive performance), musical rehearsal (sounding good in the practice room and sounding good on stage can come apart), corporate training programs (employees report higher satisfaction with massed bootcamps but retain less), software pedagogy (tutorials that feel smooth produce less durable understanding than those requiring active retrieval), and the substrate's own encounter-tier metric — 'lands cold' / 'feels obvious' is exactly the fluency signal that Soderstrom-Bjork find anti-correlated with durable absorption. The reflexive tension is constitutive, not resolved: a substrate optimized for tier-1 'click' moments may be optimizing AGAINST the durable take-up the substrate exists to produce. Caveats: (a) The dissociation is most robust in motor and verbal learning of skills/knowledge with longer relevance horizons; for short-horizon tasks (one-shot performance, immediate use) the fluency-during-acquisition signal can be appropriate. (b) The pattern describes a tendency, not a deterministic anti-correlation — there are conditions under which fluency and learning move together. (c) The fix is not to make every learning condition uncomfortable; it is to recognize that the comfort signal is not key on durable outcome, and to choose practice conditions on the basis of operational evidence (delayed test, transfer task) rather than felt smoothness."
