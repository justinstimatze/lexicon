id: lex-zrhqq
name: frame-request-in-target-self-interest-currency
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When making a request that requires the target's effort, frame it in the target's self-interest currency, not yours. The request lands when it matches what the target is already optimizing for; mismatched framings get filtered as noise."
related: [lex-cwcj9, lex-5yufs, lex-u5869, lex-qhydj, lex-33p2a, lex-c34na, lex-ppm3j, lex-9pubz]
scaffolds-from: [lex-ppm3j]
evokes: [greene-law-13, carnegie-talk-in-terms-of-other-persons-interests, self-interest-appeal, currency-of-the-other, what.s.in.it.for.you, thurston-the-magician]
premises:
  - "the actor wants the target to take some action that the actor benefits from"
  - "two appeal-vectors are available: the actor's currency (mercy, gratitude, obligation, debt-call) and the target's currency (current interest, perceived advantage, what-they-want-right-now)"
  - "appeals in the actor's currency activate the moral-debt accounting in the target, which the target generally wants to minimize (creating resistance) and which the target sees as the actor's perspective rather than their own (creating distance)"
  - "appeals in the target's currency activate the target's interest-pursuit calculus, which the target generally wants to maximize (creating cooperation) and which the target sees as a description of THEIR situation rather than the actor's (creating identification)"
decomposes-into: []
assembly: "sequential(model-target-current-interest, identify-currency-they-spend, reframe-request-in-that-currency)"
critical-questions:
  - "is the actor's appeal actually IN the target's currency, or is it the actor's currency disguised? Many self-interest appeals are thin pretexts — 'this will help YOU because X' where X is actually advantageous to the actor. Diagnostic: 'if I removed everything that benefits me from the appeal, would the target still want to do it?' If no, the appeal is masked actor-currency."
  - "is the target's actual current interest knowable, or is the actor projecting? Self-interest appeals collapse when the actor mis-models the target. Diagnostic: 'have I actually inquired into what the target wants, or am I assuming what they should want?'"
  - "does the principle license manipulation by treating moral-debt as a category-mistake? The amoralist reading dismisses gratitude as inefficient; the Carnegie reading treats it as relationship-corrosive. Both prescriptions agree on the operational rule but for different reasons. Diagnostic: 'am I applying this principle in a relationship where moral-debt IS the correct frame, and I am improperly bypassing it?'"
  - "is the target's perceived self-interest actually their long-run self-interest, or am I exploiting a short-run perception against their long-run interest? The principle is power-tactic-shaped: it works equally well when the target is wrong about what's good for them. Diagnostic: 'is this appeal robust to the target later learning what their real interest was?'"
lineage:
  - source: primary
    text: greene-1998-48-laws-of-power-law-13-self-interest
    citation: "Robert Greene, *The 48 Laws of Power* (Penguin Group 1998), Law 13 'When asking for help, appeal to people's self-interest, never to their mercy or gratitude.' Local copy in lexicon corpus. Greene's claim: appeals to mercy, gratitude, or moral obligation create resentment because the asker is implicitly claiming a debt; appeals to the target's CURRENT self-interest create cheerful cooperation because the target perceives the exchange as advantageous to them. The historical case-studies pit failed mercy-appeals (Kissinger asking the Chinese to honor old debts) against successful self-interest-appeals (Bismarck framing alliance proposals in terms of immediate territorial gain). The Machiavellian register treats the principle as amoral mechanism: it works regardless of whether the asker DESERVES help, because it sidesteps the moral-debt question entirely."
    quote: "(Law 13 chapter excerpt:) LAW 13 WHEN ASKING FOR HELP, APPEAL TO PEOPLE’S SELF-INTEREST, NEVER TO THEIR MERCY OR GRATITUDE JUDGMENT If you need to turn to an ally for help, do not bother to remind him of your past assistance and good deeds. He will find a way to ignore you. Instead, uncover something in your request, or in your alliance with him, that will benefit him, and emphasize it out of all proportion. He will respond enthusiastically when he sees something to be gained for himself. TRANSGRESSION OF THE LAW In the early fourteenth century, a young man named Castruccio Castracani rose from the rank of common soldier to become lord of the great city of Lucca, Italy. One of the most powerful families in the city, "
  - source: primary
    text: carnegie-1936-how-to-win-friends-talk-in-terms-of-other-persons-interests
    citation: "Dale Carnegie, *How to Win Friends and Influence People* (Simon & Schuster 1936), repeated principle 'Talk in terms of the other person's interests.' Local copy in lexicon corpus. Carnegie reaches the SAME operational prescription as Greene via the opposite normative frame: where Greene treats it as power-tactic to bypass mercy-debts, Carnegie treats it as friendship-tactic to honor the target's autonomy. The convergence across the friendship-vs-power frame split is the substrate-level evidence. Methodological distinctness from Greene: same axes as lex-33p2a (era, register, theoretical frame, prescriptive valence). Carnegie's worked instance: Howard Thurston the magician, who before every performance told himself 'I am grateful because these people come to see me. They make it possible for me to make my living in a very agreeable way. I'm going to give them the very best I possibly can' — relationship-orientation, not transactional-manipulation. Both arrive at: frame your request in the currency the target spends, not the currency you spend."
    quote: "(Carnegie principle restatement:) Talking in terms of the other person’s interests pays off for both parties. Howard Z. Herzig, a leader in the field of employee communications, has always followed this principle. When asked what reward he got from it, Mr. Herzig responded that he not only received a different reward from each person but that in general the reward had been an enlargement of his life each time he spoke to someone. PRINCIPLE 5 Talk in terms of the other person’s interests. HOW TO MAKE PEOPLE LIKE YOU INSTANTLY I was waiting in line to register a letter in the post office at Thirty-third Street and Eighth Avenue "
  - source: primary
    text: machiavelli-1513-the-prince-ch-17-love-feared-interest-over-obligation
    citation: "Niccolò Machiavelli, *The Prince* (1513), Ch.XVII 'Concerning cruelty and clemency, and whether it is better to be loved than feared.' W.K. Marriott translation (PG), in lexicon corpus. Methodologically-distinct THIRD primary on the target-self-interest principle. Machiavelli's claim: appeals to LOVE (mercy, gratitude, moral-debt) are unreliable because men are 'ungrateful, fickle, false, cowardly, covetous'; appeals through CONSEQUENCE-TO-THE-TARGET (fear of punishment, expectation of benefit) are durable because they sit in the target's interest-pursuit calculus. The mechanism is identical to Greene Law 13 and Carnegie's 'talk in terms of the other person's interests' — even though Machiavelli's specific PRESCRIPTION (be feared rather than loved) differs from both modern texts. Crucial substrate-level distinction: the operational rule is 'frame requests in the target's currency, not the actor's.' Machiavelli's currency is FEAR-of-consequence; Greene's is PERCEIVED-BENEFIT; Carnegie's is RELATIONSHIP-CARE. All three are versions of the target's currency rather than the actor's mercy-debt-currency. Three-way convergence across 485 years and three opposed normative frames on the operational rule, with disagreement about WHICH target-currency is most reliable, is the substrate-level evidence that lex-zrhqq names the meta-rule (frame in target-currency) rather than any specific implementation."
    quote: "(Ch.XVII on love-vs-feared and the unreliability of obligation-appeals:) It may be answered that one should wish to be both, but, because it is difficult to unite them in one person, it is much safer to be feared than loved, when, of the two, either must be dispensed with. Because this is to be asserted in general of men, that they are ungrateful, fickle, false, cowardly, covetous, and as long as you succeed they are yours entirely; they will offer you their blood, property, life, and children, as is said above, when the need is far distant; but when it approaches they turn against you. And that prince who, relying"

canonical-instances:
  - "Howard Thurston the magician (Carnegie's worked instance): before performing, repeated to himself 'I am grateful because these people come to see me. They make it possible for me to make my living in a very agreeable way. I'm going to give them the very best I possibly can.' Self-talk that puts the audience's experience first, not his own performance-anxiety. Currency: audience-experience, not performer-validation."
  - "the negotiator who reframes salary-request as company-retention-cost rather than personal-need: instead of 'I need a raise because I have expenses' (actor-currency), uses 'replacing me at market rate would cost the company $X for the search plus the productivity ramp' (target-currency). Target sees their own budget, not the actor's bills."
  - "the open-source-maintainer asking for sponsorship: 'this library prevents N hours of work per year for your team at $Y/hour, sponsoring at $Z/year is rational' beats 'I need to pay rent.' Reframes the request in the sponsor's cost-accounting."
  - "Bismarck-style alliance-proposals (Greene case-study): framing each prospective ally's territorial gain from the alliance, never the long-run strategic equilibrium Bismarck himself was pursuing. Each ally perceived the deal in their own currency."
  - "the canvasser who knocks on doors and opens with 'How long have you lived in this neighborhood?' rather than 'Sign my petition': leads with the resident's interest in their own neighborhood, lets the petition follow."
severity-tier: info
status: active
