lineage:
  - source: primary
    tradition: lieberson-taste
    text: lieberson-2000-matter-of-taste
    citation: "Stanley Lieberson, A Matter of Taste: How Names, Fashions, and Culture Change (Yale University Press, 2000), Chapter 1 (Introduction)."
    quote: "There are, broadly speaking, two major influences on taste: external social forces and internal mechanisms of change. The first category includes what are probably the most commonly used explanations for cultural events generally and fashions in particular. Namely, there is a disposition to explain changing tastes by looking at social and cultural developments in the surrounding society. […] Less obvious is that tastes have their own internal mechanisms that cause fashions to change in specific directions. Even in the presence of external influences, these internal mechanisms affect the outcome."
  - source: primary
    tradition: lieberson-taste
    text: lieberson-2000-matter-of-taste
    citation: "Stanley Lieberson, A Matter of Taste: How Names, Fashions, and Culture Change (Yale University Press, 2000), Chapter 1 (mechanism inventory)."
    quote: "Although this book focuses on internal mechanisms relevant for first names, many of these mechanisms influence other fashions, too. The ratchet effect, the mutation analogue, the enhancement-contamination effects, and the expansion model are only a few of the mechanisms I propose here that have wider significance."
canonical-instances:
  - U.S. baby-name fashions across the 20th century — names like 'Linda' or 'Jennifer' rise sharply, peak for a generation, then decline; the shape of the curve is generic across many names and many cultures. External-cause explanations cannot account for the regularity across so many names.
  - Programming-language adoption curves — Ruby, Scala, CoffeeScript, etc. show similar rise-peak-decline shapes; the shape is dominated by internal-dynamic features (peers-using-it, projects-built-on-it) more than external technology-shift causes.
  - Brand-name lifespans (Kodak, BlackBerry, MySpace) — typically explained by external-cause stories about disruption; Lieberson's frame suggests the internal-dynamic ratchet-and-contamination story is usually as important.
  - Academic-jargon trajectories — terms like 'discourse,' 'liminal,' 'praxis' rise then sometimes saturate-and-decline in usage; internal-dynamic forces drive the cycle independent of any 'cause.'
  - The decline of the fedora and other men's hat fashions — Lieberson's specific historical example; the external-cause story (Kennedy didn't wear a hat at the 1961 inauguration) is largely post-hoc rationalization of an internal-dynamic decline already underway.
  - Music-genre rise and decline (disco, grunge, dubstep) — external-cause explanations exist but rarely fit the shape of the cycle as well as endogenous-fashion-dynamics do.
