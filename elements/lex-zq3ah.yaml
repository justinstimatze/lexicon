    quote: "'The other school of thought maintains that E.N.T. conditions are usually fairly easily diagnosed, the treatment clear-cut, and that they often occur in patients who have no other complaint, so that referring them to the E.N.T. Clinic does not deprive the student of a particularly valuable opportunity for learning and does not usually subject the patient to the inconvenience of being followed in two clinics at once. They would prefer, if a choice had to be made, to have a consultant from the Department of Neurology, from whom expert advice was sought in 102 cases... neurology is intimately related to Internal Medicine, is an interesting and difficult specialty, and one in which it would be rewarding for students to gain more experience.'"
canonical-instances:
  - "A product team debates which of two customer complaint categories deserves a dedicated support engineer, citing ticket volume for each — but the real disagreement, once surfaced, is whether the tickets in each category are quick to resolve with a canned answer (favoring no dedicated hire) or require deep product knowledge that only grows with dedicated ownership (favoring one) — the ticket counts were never actually deciding the question either side was implicitly arguing."
  - "A hospital debates whether to add a dedicated dietitian or a dedicated physical therapist based on which type of consult request is more frequent — but the underlying disagreement is really about which deficiency currently causes worse patient outcomes when unaddressed, a question the raw consult-frequency numbers don't speak to at all, since a rarely-requested but high-stakes consult type could matter more than a frequent, low-stakes one."
critical-questions:
  - "Could the volume statistic still be doing legitimate indirect work even when it isn't the stated crux — for instance, does a specialty needing many consultations across many DIFFERENT patients (E.N.T.'s 182 cases) actually indicate something different about system-wide need than a specialty needing consultation on a NARROWER set of harder cases (Neurology's 102), such that the two numbers aren't really comparable evidence for the same underlying question in the first place?"
  - "If the real axis of the dispute is 'pedagogical value of the case type,' is that itself measurable, or does it just relocate the disagreement to a domain (educational value) with even less agreed-upon evidence than case volume — and if so, does naming the real axis actually make the dispute more resolvable, or does it just make explicit that the dispute was never going to be resolved by data of any kind?"
