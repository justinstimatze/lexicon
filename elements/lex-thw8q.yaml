id: lex-thw8q
name: committing-first-proves-a-doubted-resource-can-scale
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a resource looks obviously too small or too fragile to serve a group's actual need, don't assume its capacity is fixed at what it visibly appears to hold -- some resources only reveal their true capacity once someone actually commits weight to them, and that first commitment is what licenses everyone else to follow. In Eastman's telling, ten stranded young men find only 'a little mussel shell at the edge of the water' where they need a boat. Nobody can verify in advance that it will work: 'At first they were doubtful and hung back.' The only way to find out is for someone to step in first -- 'in the end one ventured and stepped into the shell, which bore up his weight' -- and it's only after that first real test that the shell's capacity turns out not to be fixed at all: 'Then another and another followed, until the ten men stood upon the shell, which had become a fine large canoe.' The shell didn't secretly have room for ten men all along, waiting to be discovered -- it became a canoe for ten specifically because someone treated the uncertain first step as worth the risk, and each subsequent person's willingness to follow was licensed by the person before them, not by any independent evidence of the shell's capacity. Diagnostic move: when a group is stalled because an available resource looks too small to solve the shared problem, look at what happens if just one person tests it fully rather than everyone waiting for proof it will hold -- some capacities only exist in a resource once someone's actual commitment activates them, and the doubt keeping everyone waiting can be exactly what's preventing the test that would resolve it."
