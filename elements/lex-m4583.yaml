lineage:
  - source: primary
    text: cushing-maiden-yellow-rocks-younger-brother-shoots-his-wife-to-save-the-children
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Maiden of the Yellow Rocks.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'No,' said the younger, 'I will shoot her!' He looked up and drew his arrow, and as his aim was absolutely unerring, swish went the arrow directly to her, and she was killed. The power of life by which the Sun was drawing her up was gone, the thread was cut, and she fell over and over and struck the earth. ... 'I didn't want my father, the Sun, to take them away with my wife. I knew you would not care anything about my wife, but I knew you would be very fond of the grandchildren. Here they are.'"
canonical-instances:
  - "A company facing certain acquisition by a hostile buyer that would dissolve a product line entirely decides to sell off and shut down that product line itself first, on its own terms, specifically to protect the engineering team and its intellectual property from being absorbed and dismantled by the acquirer, then justifies the decision to the board entirely in terms of jobs retained and IP preserved, not the product line's own worth."
  - "A family facing the repossession of a home they cannot save chooses to sell it themselves at a loss rather than let it go to foreclosure, specifically to protect a portion of the equity that can go toward a child's education, and justifies the decision to skeptical relatives entirely in terms of the child's future, not the house's sentimental value."
critical-questions:
  - "is this pattern actually a form of sound triage, or does it risk becoming a rationalization for taking an irreversible, drastic action too early, before genuinely exhausting options that might have saved both things -- how confident does someone need to be that the loss is truly unavoidable before applying this reasoning?"
  - "the story frames the choice as obviously correct because the grandmother ultimately does become 'a true grandmother' and cares for the children -- does the justification only work in hindsight, once the audience's reaction to the sacrifice has actually validated the reasoning, or would the same act look monstrous if the grandmother had refused the children too?"
  - "does explicitly reasoning about what the recipient of your justification will value, rather than what the lost thing was actually worth, risk treating the sacrificed party as a means to an end whose worth is defined only by others' reactions -- is there a way to apply this triage logic without that framing?"
