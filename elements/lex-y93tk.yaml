id: lex-y93tk
name: self-organized-criticality-systems-tune-themselves-to-scale-free-cascades
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When a system shows scale-free cascades (avalanches, outages, viral spreads), surface that it may have self-tuned to criticality — the events are not anomalies but the regime; mitigation must shift the tuning, not chase individual cascades."
