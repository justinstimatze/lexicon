  - source: primary
    text: zitkala-sa-iya-camp-eater-sound-mismatched-to-source
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'Iya, the Camp-Eater.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Spirits in the air above?' she wondered. Yet there was no sign to tell her of their nearness. The fine small sound of voices grew larger and nearer. ... Bending low over her babe she gave ear to the ground. Horrified was she to find the mysterious sound came out of the open mouth of her sleeping child!"
canonical-instances:
  - "A small analytics team notices a modest marketing campaign is generating an implausibly large, precisely-shaped spike in signups and initially assumes it's just a viral moment, but a team member who insists on tracing the actual traffic logs discovers the spike is coming from a handful of automated accounts, not organic interest -- a signal too large and too specific for what it appeared to be."
  - "A homeowner hears an unusually loud, complex rattling noise apparently coming from a small kitchen appliance and initially assumes the appliance is just old and noisy, but on closer inspection traces the actual sound to a much larger issue in the wall behind it, which the appliance's cabinet had simply been amplifying and redirecting."
critical-questions:
  - "how does someone reliably judge when a signal is 'too large' for its apparent source, given that some genuinely surprising, benign phenomena also produce outsized effects from small causes, and treating every such mismatch as suspicious could lead to constant, unwarranted investigation?"
  - "does the framework assume the observer always has safe, practical access to check the literal source directly -- what happens when direct verification is dangerous, costly, or simply impossible, leaving the mismatched signal as the only information actually available?"
  - "why did the supernatural explanation occur to the mother first, before the physical one -- does an unfamiliar or frightening context make people systematically reach for the least verifiable explanation first, and if so, is that itself the more useful, generalizable thing to name here?"
