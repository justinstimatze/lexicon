    citation: "Robert K. Merton, Social Theory and Social Structure (1957), Ch. IX, p.345, quoting William Makepeace Thackeray's essay 'On Being Found Out.'"
    quote: "'Just picture to yourself everybody who does wrong being found out, and punished accordingly. Fancy all the boys in all the schools being whipped... The butchery is too horrible. The hand drops powerless, appalled at the quantity of birch it must cut and brandish. I am glad we are not all found out, I say again; and protest, my dear brethren, against our having our deserts.'"
canonical-instances:
  - "A company installs software that logs every minute of employee activity in granular detail, expecting compliance to rise; instead productivity and morale fall, because the previously tolerated band of informal breaks, side conversations, and minor task-switching — which made the actual workday livable — is now punishable, and workers spend energy managing the appearance of compliance rather than doing the work."
  - "A moderation team on an online platform tightens enforcement to catch every technical rule violation after a high-profile incident; the community that had functioned for years on a wide tolerated margin of mild rule-bending experiences a wave of bans and appeals, and paradoxically the platform's authorities report feeling MORE overwhelmed and less in control, not less, matching Merton's point that 'excessive knowledge' of infractions is itself dysfunctional for those who must act on it."
critical-questions:
  - "How would a group or its leadership actually locate the functionally optimum degree of visibility in advance, rather than discovering it only after overshooting (a crackdown that visibly backfires) or undershooting (a scandal that reveals unacceptable evasions had gone unchecked) — is there any leading indicator short of trial and error?"
  - "Merton frames the tolerated-deviation band as narrowing under acute stress and widening in calm periods — does this predict that a group under CHRONIC (rather than acute) stress will settle into a permanently narrow band, and if so, is a chronically narrow band self-defeating in the way full observability is, or does chronic stress change what counts as 'functionally optimum' for that group?"
