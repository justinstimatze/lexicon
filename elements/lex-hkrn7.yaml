id: lex-hkrn7
name: mode-of-production-generates-gender-ideology-unevenly-and-tracks-rape-incidence
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Use this pattern when gender ideology — what counts as 'properly feminine,' what work is classified as 'women's work,' whose sexual violation the law treats as a crime and whose it doesn't — or a spike in a specific form of sexual violence is being explained as a free-floating cultural belief, an eternal patriarchal constant, or a fixed background rate of male malice, entirely on its own terms. Davis's key historical-materialist claim in Women, Race and Class (1981) is that gender ideology and sexual violence are not autonomous cultural phenomena: they are MATERIALLY GENERATED BY and FUNCTIONALLY SERVE the economic arrangement of labor and power in a given mode of production. This has two hard, non-obvious consequences that single-axis or purely-cultural gender analysis routinely misses. FIRST CONSEQUENCE — UNEVEN GENERATION, NOT UNIFORM IMPOSITION: because an ideology is produced BY a specific economic arrangement, it cannot simply be assumed to apply uniformly across a society when different groups occupy structurally different positions within that arrangement. Davis's worked case is the ideology of 'femininity' itself. Pre-industrial white women performed visibly productive household labor (spinning, candlemaking) integrated into the family economy. Industrial capitalism did not add a belief about women's fragility on top of an unchanged order — it manufactured a NEW ideology as the direct byproduct of a NEW economic fact: 'the tentative pre-Civil War forays into factory work gave way to an aggressive embrace of industrialization... it robbed many white women of the experience of performing productive labor... As the ideology of femininity — a by-product of industrialization — was popularized and disseminated through the new ladies' magazines and romantic novels, white women came to be seen as inhabitants of a sphere totally severed from the realm of productive work... 'Woman' became synonymous... with 'mother' and 'housewife.'' Enslaved Black women's ECONOMIC POSITION made the same ideology structurally impossible to apply: a slave woman's labor could never be excluded from the category of 'productive work' — the entire system was organized around extracting it — so 'this vocabulary was nowhere to be found. The economic arrangements of slavery contradicted the hierarchical sexual roles incorporated in the new ideology. Male-female relations within the slave community could not, therefore, conform to the dominant ideological pattern.' (Consistent with Davis's earlier point that under slavery 'Since women, no less than men, were viewed as profitable labor-units, they might as well have been genderless as far as the slaveholders were concerned... Judged by the evolving nineteenth-century ideology of femininity... Black women were practically anomalies.') The diagnostic move: when you see a 'women's issue' or a 'gender norm' articulated as if it describes all women, ask what economic arrangement generated it and whether that arrangement structurally excludes or includes the labor of the group in question — the ideology cannot travel to a group whose economic position contradicts its premises. SECOND CONSEQUENCE — INCIDENCE TRACKS ECONOMIC-POLITICAL CONDITIONS, NOT CONSTANT MALICE: Davis extends the same materialist logic to sexual violence itself. Rape is not a constant expression of male sexual urge but a resource that tracks who holds unaccountable economic and political power at a given moment: 'The class structure of capitalism encourages men who wield power in the economic and political realm to become routine agents of sexual exploitation. The present rape epidemic occurs at a time when the capitalist class is furiously reasserting its authority in the face of global and internal challenges... It is not a mere coincidence that as the incidence of rape has arisen, the position of women workers has visibly worsened... The proliferation of sexual violence is the brutal face of a generalized intensification of the sexism which necessarily accompanies this economic assault.' She grounds the mechanism historically in slavery, where sexual access was a direct expression of property claims over labor, not a separate appetite: 'the right claimed by slaveowners and their agents over the bodies of female slaves was a direct expression of their presumed property rights over Black people as a whole. The license to rape emanated from and facilitated the ruthless economic domination that was the gruesome hallmark of slavery.' And she names the class-differential in who gets to act on the 'invitation to rape' with impunity: men who already hold unaccountable economic authority (employers, executives, professionals) commit the largest, least-prosecuted share of assaults, while 'working-class men... accept the invitation to rape extended by the ideology of male supremacy... accepting a bribe, an illusory compensation for their powerlessness' — a weaker version of the same license, without the immunity. Diagnostic move: when a specific category of sexual violence spikes, check what is concurrently happening to the economic and political position of the group being victimized, rather than defaulting to an ahistorical claim about constant male pathology. THIRD, CONNECTED CLAIM — THE FUNCTIONAL MYTH: Davis shows that a racialized sexual-violence myth can itself be manufactured to serve continued economic exploitation, quoting Gerda Lerner's formulation approvingly: 'The myth of the black rapist of white women is the twin of the myth of the bad black woman — both designed to apologize for and facilitate the continued exploitation of black men and women.' Of 455 men executed on rape convictions in the US between 1930 and 1967, 405 were Black — while white men's sexual violence against working-class and Black women went almost entirely unprosecuted. The myth is not a free-floating stereotype to be corrected by better information; it does specific economic-political work (justifying lynching-as-labor-discipline, discrediting Black testimony, keeping Black women's rape by white men unactionable) and should be analyzed as such — this composes directly with lex-85bw8 (pretext-narrative-conceals-actual-function), of which the myth of the black rapist is one worked instance. UNIFYING OPERATIONAL FORM: do not treat 'patriarchy,' 'sexism,' or 'gender norms' as a single trans-historical constant that applies equally to everyone regardless of economic position, and do not treat a sexual-violence statistic as a fixed background rate. Ask (1) what mode-of-production arrangement generated this specific ideology or this specific pattern of violence, (2) whether the group in question occupies an economic position the ideology's premises actually fit, and (3) what is happening concurrently to economic and political power when incidence changes. DISTINCT FROM lex-4uuxy (Federici, paid-labor-requires-unpriced-reproductive-substrate-shifted-onto-least-refusable-class): lex-4uuxy states the GENERAL structural mechanism — any wage system presupposes unpriced reproductive labor, shifted onto whichever class can least refuse it, with the witch-hunt as the enforcement episode that installed the modern sexual division of labor. This atom is Davis's more SPECIFIC historical-materialist argument: a particular ideology-generating event (the rise of industrial capitalism producing a NEW 'ideology of femininity') that could not and did not apply uniformly across differently-situated women (free white women vs. enslaved Black women), PLUS the connected claim that rape-incidence itself spikes and recedes with capitalist-authority-reassertion cycles — a claim about VIOLENCE TIMING that lex-4uuxy does not make. The two compose: lex-4uuxy explains why some class is always doing the unpriced substrate work; this atom explains why the ideology justifying that allocation is not one ideology but historically-contingent, differently-shaped ones per group, and why sexual violence specifically spikes when economic authority is being reasserted. DISTINCT FROM lex-3ezh8 (Hill Collins, matrix-of-domination-operates-across-interlocking-axes-and-three-levels): lex-3ezh8 is the general STRUCTURAL-ARCHITECTURAL claim that domination operates simultaneously across multiple interlocking axes and at three reproducing levels (personal/cultural/institutional) — it names the shape of the system. This atom names a specific MECHANISM within that architecture: how the economic-institutional level directly manufactures the content of gender ideology and modulates the rate of sexual violence, and why that manufactured content cannot be uniform across axis-positions. Collins's cross-attestation lineage already cites Davis 1981 as a historical-materialist precursor to the matrix framework; this atom is the specific mechanism-level claim Collins's structural framework references but does not itself spell out. DISTINCT FROM lex-85bw8 (Wells, pretext-narrative-conceals-actual-function): lex-85bw8 is the general diagnostic — examine differential application and counterfactual cases to unmask a stated rationale as cover for a different actual function. The myth-of-the-black-rapist material in this atom is ONE INSTANCE of lex-85bw8's pattern (use lex-85bw8 for the general pretext-diagnostic move). This atom's distinct contribution is the broader positive theory of WHY: gender ideology and sexual-violence patterns generally, not just this one myth, are generated by and serve economic arrangements, and cannot be assumed uniform across differently-positioned groups. FAILURE MODES: (a) treating 'patriarchy' as a single, trans-historical, uniformly-applied constant instead of asking what mode of production generated its current, specific content; (b) universalizing a gender norm or feminist claim articulated from one class-and-race position (typically the economically privileged) as if it described the structural position of all women — composes with lex-t7xcp (hooks) on this exact erasure mechanism; (c) explaining a rape-incidence spike purely psychologically or culturally without checking concurrent labor-market, wage, or political-authority conditions; (d) treating a racialized sexual-violence myth as an isolated bigoted belief rather than naming the economic exploitation it is functionally organized to protect. Use this atom when the live question is specifically about the ECONOMIC GENERATION and UNEVEN APPLICABILITY of gender ideology, or about SEXUAL-VIOLENCE INCIDENCE TRACKING ECONOMIC-POLITICAL CONDITIONS; reach for lex-4uuxy when the question is the general unpriced-reproductive-labor mechanism, lex-3ezh8 when the question is the overall multi-axis/multi-level architecture of domination, and lex-85bw8 when the question is specifically about unmasking one pretext-narrative via differential-application evidence."
