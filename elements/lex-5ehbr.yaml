id: lex-5ehbr
name: an-unpleasant-cohabitants-presence-deters-a-graver-threat-removing-it-invites
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A dangerous or unpleasant presence that seems worth eliminating can, without anyone realizing it, be the single thing deterring a much graver external threat, so that removing the nuisance clears the way for exactly the harm it had been holding off. The nuisance and the protection are the same fact, seen from two different distances. In the Jataka's tale of the forest guardians, a foolish tree-spirit wants to drive off a lion and tiger fouling the forest with their kills. A wiser spirit warns him first: 'Good friend, it is just these two creatures that protect our homes. Once they are driven off, our homes will be made desolate. If men see not the lion and the tiger tracks, they will cut all the forest down, make it all one open space, and till the land.' The fool drives them off anyway. Loggers move in the moment the tracks disappear."
related: []
evokes: [jataka, tikanipata, vyaggha-jataka, removing-a-nuisance-can-clear-the-way-for-the-threat-it-deterred, keystone-presence-doubles-as-unnoticed-protection]
