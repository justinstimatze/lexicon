evokes: [ambiguous-loss, boss-1999-ambiguous-loss, frozen-grief, physically-absent-psychologically-present, physically-present-psychologically-absent, missing-soldier, alzheimer-loss, divorce-as-loss, immigration-as-loss, both-and-emotional-state, no-body-no-closure, unresolved-grief]
lineage:
  - source: primary
    tradition: boss-ambiguous-loss
    text: boss-1999-ambiguous-loss
    citation: "Pauline Boss, Ambiguous Loss: Learning to Live with Unresolved Grief (Harvard University Press, 1999), Chapter 1 (Frozen Grief)."
    quote: "There are two basic kinds of ambiguous loss. In the first type, people are perceived by family members as physically absent but psychologically present, because it's unclear whether they are dead or alive. Missing soldiers and kidnapped children illustrate this type of loss in its catastrophic form. More everyday occurrences include losses within divorced and adoptive families, where a parent or child is viewed as absent or missing. In the second type of ambiguous loss, a person is perceived as physically present but psychologically absent. This condition is illustrated in the extreme by people with Alzheimer's disease, addictions, and other chronic mental illnesses."
  - source: primary
    tradition: boss-ambiguous-loss
    text: boss-1999-ambiguous-loss
    citation: "Pauline Boss, Ambiguous Loss: Learning to Live with Unresolved Grief (Harvard University Press, 1999), Chapter 4 (Mixed Emotions)."
    quote: "People experiencing ambiguous loss are filled with conflicting thoughts and feelings. They dread the death of a family member who has been hopelessly ill — or mysteriously missing for a long time — but they also hope for closure and an end to the waiting. They may even feel anger at someone they love for keeping them in limbo, only to be consumed with guilt for having such thoughts. The tension that results from conflicting emotions, especially when family members' unresolved grief is not acknowledged, becomes so overwhelming that they are frozen in their tracks. They cannot make decisions, cannot act, and cannot let go."
canonical-instances:
  - "Families of MIA / disappeared soldiers — Korean War, Vietnam War, the 1976-1983 Argentine Dirty War 'desaparecidos' — Boss's canonical case; the absence of a body or confirmed death blocks normal mourning for decades."
  - "Spouse caring for an Alzheimer's-afflicted partner over years — the partner is physically present but psychologically gone in pieces, and the caregiver's grief has no socially-acknowledged endpoint. Boss's 'physically-present-psychologically-absent' type."
  - "Adoptive families and the absent biological parent — adopted child grieves a parent they never met; biological parents grieve a child they relinquished; neither loss has a normal mourning ritual."
  - "The 1989 Hungarian state funeral for Imre Nagy 31 years after his execution — Boss's example of a national-scale ambiguous loss finally getting closure; the eventual ritual produced the grief-completion the original concealment had prevented."
  - "Immigration / migration with severed family ties — Boss's opening biographical example; the immigrant family grieves the homeland-family that may be alive somewhere but unreachable."
  - "Estrangement without explicit confrontation — the friend who 'drifts away' rather than ending it; the family member with whom contact gradually ceased; both types share Boss's structural feature of no-closure."
  - "Layoff-by-attrition or contractor-whose-contract-stops-renewing — workplace ambiguous loss; the worker is treated as already-gone without an explicit firing event that would create a completion-marker."
severity-tier: warning
status: active
