id: lex-gzgn3
name: is-ought-gap-no-deduction-of-norm-from-fact
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When deriving an 'ought' from an 'is', notice the gap: no purely factual premises entail a normative conclusion. Hume's gap stays open; the bridging step is a normative premise smuggled in. Surface it before accepting the derivation."
related: [lex-xe76g, lex-39muf, lex-rktsy, lex-9wbd3, lex-kfk68, lex-7mdpd, lex-d6vbs, lex-b9sqg, lex-avv9k, lex-q6z64, lex-4pmyk, lex-8ca5h, lex-v6dz2, lex-pdpen]
evokes: [the-is-ought-distinction, no-ought-from-is, instead-of-is-and-is-not-i-meet-with-ought, naturalistic-fallacy-precursor, descriptive-normative-gap]
lineage:
  - source: primary
    text: hume-treatise-of-human-nature-1739
    citation: "David Hume, *A Treatise of Human Nature* (1739-40), Book III Part I Section I: 'Moral Distinctions Not Derived From Reason' (closing paragraph). The 'is-ought' paragraph is a single observation appended to a long argument that moral distinctions are not perceived by reason; Hume notes in passing that authors slide imperceptibly from is/is-not propositions to ought/ought-not propositions without giving an account of the inference. The paragraph became one of the most influential observations in meta-ethics, though Hume himself treats it almost as an aside. Modern formulations: 'no ought from is' (Moore-adjacent), the descriptive/normative gap. Distinct from G.E. Moore's naturalistic fallacy (1903), though commonly conflated."
    quote: "[Hume, Treatise Book III Pt I Sec I:] 'In every system of morality, which I have hitherto met with, I have always remarked, that the author proceeds for some time in the ordinary way of reasoning, and establishes the being of a God, or makes observations concerning human affairs; when of a sudden I am surprized to find, that instead of the usual copulations of propositions, is, and is not, I meet with no proposition that is not connected with an ought, or an ought not. This change is imperceptible; but is, however, of the last consequence. For as this ought, or ought not, expresses some new relation or affirmation, it is necessary that it should be observed and explained; and at the same time that a reason should be given, for what seems altogether inconceivable, how this new relation can be a deduction from others, which are entirely different from it. But as authors do not commonly use this precaution, I shall presume to recommend it to the readers; and am persuaded, that this small attention would subvert all the vulgar systems of morality, and let us see, that the distinction of vice and virtue is not founded merely on the relations of objects, nor is perceived by reason.' [Note: Hume does not argue for a strict impossibility, only that the inference is never given and would need to be. Some commentators read the passage as a strict logical-impossibility claim; others as a methodological-vigilance recommendation. Both readings yield transferable practice.]"
  - source: practitioner
    text: moore-principia-ethica-1903
    citation: "G.E. Moore, *Principia Ethica* (1903), §10-§14: the 'naturalistic fallacy' argument. Tier-3 deepening + canonical distinct primitive. Moore's open-question argument: for any proposed naturalistic definition of 'good' (good = pleasure, good = evolutionary-fit, good = what we desire), it is always an open question 'is X actually good?' — which would be impossible if the definition were correct. Moore explicitly distinguishes his fallacy from Hume's is-ought, but the two are sister-primitives in meta-ethics: Hume targets the deductive inference; Moore targets the definitional reduction.; widely available."
    quote: "[Tier-3 deepening — Moore 1903 Principia Ethica §13, the 'open-question argument': suppose someone proposes 'good means pleasant'. We can then meaningfully ask 'is pleasure actually good?' — and the meaningfulness of the question shows that 'good' and 'pleasant' are not synonymous; otherwise the question would be like asking 'is a triangle three-sided?' (closed, definitionally answered). Moore's conclusion: 'good' is a non-natural property not reducible to any descriptive predicate; any attempt to reduce it is the naturalistic fallacy. The Hume-Moore family resemblance: both observe that the normative cannot be smuggled out of the descriptive without an unargued move. Hume targets inference; Moore targets definition. Modern meta-ethics (Mackie, Korsgaard, Parfit) takes both seriously as obstacles any naturalistic ethics must address.]"
  - source: practitioner
    text: harris-moral-landscape-2010
    citation: "Sam Harris, *The Moral Landscape* (2010), and adjacent contemporary debate (Singer, the science-of-morality literature). Tier-3: explicit MODERN attempts to bridge the is-ought gap by defining 'good' as well-being-of-conscious-creatures (Harris) or by evolutionary-cooperation (Singer's expanding circle). Each attempt provokes the Hume-Moore reply: the bridge-definition is itself a normative stipulation, not a deduction. The contemporary debate is evidence the primitive is cardinal — it keeps re-surfacing whenever naturalistic ethics is proposed.; widely available."
    quote: "[Tier-3 — Harris 2010 + critics: Harris proposes that 'good' just means 'tends to promote the well-being of conscious creatures'; critics (Sean Carroll, Russell Blackford) reply that this is itself a normative claim — why is well-being-of-conscious-creatures what 'good' should mean? The reply Harris gives (it's the only thing we could mean by good) is itself a Humean is-ought move smuggled in. The structural pattern: every naturalistic ethics has a SOMEWHERE where a normative premise enters, even if disguised as a definition or as an obvious-starting-point. The Hume-Moore primitive is what keeps surfacing the smuggling.]"
canonical-instances:
  - "the evolutionary-ethics slide: 'humans evolved cooperative behavior; therefore cooperation is good.' The is-ought gap surfaces: even granting the evolutionary fact, the inference to ought requires an additional premise (e.g., 'what humans evolved to do is good'), which itself needs justification. Modern evolutionary-ethics (Wilson, de Waal) sometimes acknowledges this; sometimes papers over it. The hygiene-move is to surface the bridging-normative-premise"
  - "the science-of-morality slide (Harris-style): 'science can tell us which actions promote well-being; therefore science can determine values.' The is-ought gap surfaces: the inference requires 'well-being IS what matters' — a normative claim that science qua science doesn't establish. The Harris-debate (2010-onward) is a long-form working-through of this exact gap; Harris's reply (it's just what we mean) is the Humean-smuggling Hume warned about"
  - "the natural-law slide ('what is natural is good'): from premises about what is natural (heterosexual reproduction, gendered roles, traditional family-structure) to conclusions about what ought to be (prohibition of homosexuality, gender-essentialism, etc.). The is-ought gap surfaces: even granting the natural-fact claims, the inference to ought requires 'natural IS good', which itself is unargued. The hygiene-move is the same: surface the bridging premise"
  - "the academic-political slide: 'group X scores lower on test Y; therefore (policy claim).' Whether the policy claim is interventionist or non-interventionist, both directions require a bridging-normative premise. The is-ought gap surfaces in the bridging move, not in the descriptive fact. Practical consequence: rigorous policy argument names the bridging premise rather than treating it as obvious"
  - "the design-engineer's normative-disguise: 'the vital wall is structurally critical; therefore we shouldn't remove it.' This LOOKS like a fact-to-norm move but isn't — the unargued premise 'we should not have the building collapse' is shared and assumed. Hume's point isn't that all is-ought moves are illicit; it's that the bridging premise must be acknowledgeable on inspection. The engineer's case passes the test; the policy cases above often don't"
  - "the lex-xe76g ring-of-gyges thought experiment as is-ought-gap probe: Glaucon asks 'why be moral if you could escape detection?' — the answer cannot be derived from facts about the world alone; it requires a normative premise about what makes a life worth living (justice-as-intrinsic-good, eudaimonia, kingdom-of-ends, etc.). The persistent live-ness of the ring-of-gyges challenge is evidence the is-ought gap is genuinely there"
  - "the lex-b9sqg reason-as-slave-of-passions companion: Hume's is-ought is sister-primitive to his motivation-architecture. If reason cannot originate motivation, then deriving ought from is would require some passion-supplied normative premise. The two atoms are wing-to-wing of Hume's meta-ethics — the architectural reason-passion claim explains WHY the is-ought gap exists (oughts come from sentiment not from facts-via-reason)"
  - "operationally distinct from Moore's naturalistic-fallacy: Hume targets the deductive INFERENCE from descriptive to normative; Moore targets the DEFINITIONAL reduction of 'good' to a natural property. They are sister-primitives in meta-ethics but distinct moves. Conflation in popular discourse is common; rigorous philosophy keeps them separate. Transferable practice: when finding a fact-to-norm move, check whether it's an inference (Hume) or a stipulated definition (Moore) — the diagnostic and response differ"
  - "operationally adjacent to lex-kfk68 categorical-imperative + lex-9wbd3 greatest-happiness-principle: both are attempts to PROVIDE the bridging normative premise that the is-ought gap requires. Kant: the bridging premise is universalizability (the categorical imperative) which reason itself supplies. Mill: the bridging premise is the greatest-happiness principle, which is psychological-fact-of-pleasure-being-what-we-pursue. The Humean reply is that both attempts still require a smuggled normative premise (why should I will universally? why should aggregate-happiness matter?). The atoms co-fire as ALTERNATIVE responses to the gap"
critical-questions:
  - "is the is-ought gap a strict logical impossibility or a methodological vigilance? Strict interpretation (Hume-as-logical-thesis): no valid deductive inference from is-premises-only to ought-conclusion. Methodological interpretation (Hume-as-warning): authors should surface their normative premises so we can evaluate them. Most modern philosophy treats it as the latter (the strict version is technically defeated by trivial cases, but the methodological warning remains powerful). Transferable practice: use the gap as a hygiene-tool, not as a knockdown argument"
  - "is the gap real, or just a feature of how we currently understand normativity? Some philosophers (Putnam 'collapse of fact/value distinction'; Cornell realism) argue the gap is artifactual — better understanding of natural properties dissolves it. Others (Mackie, error-theory) accept the gap and conclude moral judgments are systematically false. The transferable position: the gap is a feature of the structure of normative inference as currently understood; whether dissolvable in a future meta-ethics is open"
  - "how to live with the gap practically? Hume's answer (implicit in Treatise + Enquiry): moral sentiment supplies the normative premises; reason then deduces consequences. The transferable practice: in ethical reasoning, identify the sentiment-supplied premises explicitly rather than smuggling them as obvious; debate at the premise-level not just at the conclusion-level. This is the operational use of the gap"
  - "what's the relation to confirmation-filtered-curiosity-exploration (lex-betym)? Both involve smuggling-of-unstated-commitment into apparently neutral reasoning. lex-betym is about hypothesis-testing (we test in ways favorable to our hypothesis); is-ought is about normative-premise-smuggling. Both rely on the same hygiene-move: surface the unstated commitment, examine it, defend or revise it"
  - "what's the relation to lex-wtkuz? lex-wtkuz is about translating descriptive insights into actionable practice — explicitly authorizing the move from is to do-this. The transferable position: lex-wtkuz acknowledges the move and treats it as legitimate-but-named; is-ought-gap is the warning that the move requires a normative premise to be valid. They are complementary: lex-wtkuz is the constructive program, is-ought is the hygiene-check"
status: active
