id: lex-yzuec
name: triangular-awareness-enables-coalition-formation
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When a one-on-one alliance keeps failing, surface that triangular awareness (knowing who else knows what about whom) is the substrate of coalition formation — the third party is not noise, it is the medium."
related: [lex-s2pjj, lex-9kuqg, lex-wnmfk, lex-6wha5, lex-ckahh, lex-hta65, lex-4txwf, lex-5dnd9, lex-46n25]
scaffolds-from: [lex-hta65]
evokes: [knowing-how-A-stands-with-B-from-where-I-stand, third-party-modeling, coalitions-need-two-step-relational-cognition, theory-of-other-minds-applied-recursively, the-prerequisite-for-political-life]
lineage:
  - source: primary
    text: brown-1991-human-universals-ch6
    citation: "Donald E. Brown, *Human Universals* (McGraw-Hill 1991; UCSB emeritus 2017 author-revised electronic edition). Chapter 6 'The Universal People' (text00000.html, the synthetic ethnography Brown constructs from the cross-cultural literature). Brown isolates 'triangular awareness' as a cognitive capacity uniformly attested across the ethnographic record: the ability to represent not only one's own relationships to others but, simultaneously, the relationships between others as those obtain from one's own standpoint. He names it as the cognitive prerequisite for the ubiquitous human practice of coalition-formation — without two-step relational cognition (A's relation to B, evaluated from my position), the calculus of allies-vs-rivals that grounds politics, kin-favoritism, gossip-as-third-party-reputation-transfer, and conflict-mediation cannot occur. Transferable claim: any social-political analysis that ignores triangular cognition will miss why coalitions form where they form (the coalitions are not just bilateral preference-aggregations; they are responses to perceived relations among other parties). In-copyright."
    quote: "[Brown 1991 Ch.6 'The Universal People':] 'Whether in the conduct of family life, of subsistence activities, or other matters, the UP attempt to predict and plan for the future. Some of their plans involve the maintenance or manipulation of social relations. In this context it is important to note that the UP possess \"triangular awareness,\" the ability to think not only of their own relationships to others but of the relationships between others in relation to themselves. Without such an ability they would be unable to form their ubiquitous coalitions.' [Brown's chapter-summary explicitly names this as a cognitive UNIVERSAL — one of the small set of cross-cultural absolutes against which candidate-universals were tested when he constructed the UP synthesis. The transferable distillation: triangular-awareness is the cognitive substrate of coalition-formation, and any failure mode in the substrate (e.g., temporary loss of capacity under high cognitive load, in young children, in some psychiatric conditions, in AI systems lacking it) predicts inability to form, maintain, or break coalitions — visible as failure to anticipate flip-flops, betrayals, alliance-shifts, or the strategic implications of others' bilateral relationships.]"
  - source: practitioner
    text: cross-domain-coalition-cognition
    citation: "Cross-domain attestations: (i) Premack + Woodruff 1978 'Does the chimpanzee have a theory of mind?' *Behav. Brain Sci.* 1:515 — comparative-primatology foundation for the question of which species can do the cognitive operation Brown names; chimpanzees show some two-step cognition, humans show it pervasively from age ~4-5. (ii) Cosmides + Tooby 1992 *Adapted Mind* on coalition-tracking as evolved cognitive module — cross-cultural racial-coalition recategorization experiments support the modular-coalitional-cognition hypothesis. (iii) De Waal 1982 *Chimpanzee Politics* documents Mahale and Arnhem chimpanzee coalition-dynamics requiring at least proto-triangular cognition — political behavior far older than Homo. (iv) Tajfel + Turner 1979 social-identity-theory minimal-group paradigm — humans rapidly form coalition-based in-group/out-group cognition from arbitrary group-markers, reading other-other relations through the lens of own-group identity. (v) Game-theoretic coalitional-form games (Shapley value, Banzhaf index) formalize the third-party-relations logic Brown names ethnographically. Not grounded directly in the primaries (Premack, Cosmides, De Waal, Tajfel). Multi-substrate attestation across primatology, evolutionary psychology, social psychology, and game theory."
    quote: "[Cross-domain consistency check, 2026-06-09: Brown's 'triangular awareness' is the ethnographic naming of what comparative primatology (chimpanzee politics), evolutionary psychology (coalitional-cognition module), social psychology (minimal-group paradigm), and game theory (coalitional-form games) study under different vocabularies. The convergence across substrates strengthens the universal-cognitive-substrate inference: this is not a culturally-acquired capacity but a species-typical cognitive primitive, recognizable in young children and in some non-human primates, that grounds the whole architecture of human political life.]"
canonical-instances:
  - "Brown 1991 Ch.6: 'the UP possess \"triangular awareness,\" the ability to think not only of their own relationships to others but of the relationships between others in relation to themselves. Without such an ability they would be unable to form their ubiquitous coalitions.' The canonical naming of the primitive at the level of ethnographic cross-cultural absolutes."
  - "Chimpanzee politics canonical case (de Waal 1982): Arnhem zoo colony Yeroen-Luit-Nikkie three-way alpha-male succession turned on each male's reading of the OTHER two's bilateral relationship, not just his own bilateral relationships with each. Nikkie could displace Yeroen only by allying with Luit; Luit had to be courted given his prior coalition history with Yeroen. The political dynamics are unreadable without triangular cognition; de Waal's documentation made this the founding case for non-human coalitional politics."
  - "Minimal-group paradigm (Tajfel + Turner 1979): subjects arbitrarily assigned to group X or Y allocate resources favoring own-group members over other-group members even when (a) the assignment is overtly random, (b) there is no material self-interest, (c) the other-group members are anonymous. The two-step cognition (this person belongs to category Y, I belong to category X, X and Y are differently-related to me as a category-pair) is the minimal triangular structure; minimal-group results are the experimental signature that humans default to coalitional cognition even with the thinnest possible group-marker."
  - "Office-politics coalitional reading: the line-manager who tracks 'X has it in for Y; Y is allied with Z; Z reports to me; so X's complaint about Z reflects the X-Y rivalry, not Z's performance' is doing triangular cognition routinely. Managers who lack the capacity (or who suppress it as 'gossip-thinking') misread complaints as bilateral when they are coalitional, and respond to surface rather than to relational structure."
  - "Geopolitical alliance-modeling: every realist IR analysis presupposes triangular cognition. The U.S. response to a Russia-China rapprochement is not bilateral-U.S.-Russia + bilateral-U.S.-China; it is shaped by the perceived strength and durability of the Russia-China relationship from the U.S. standpoint, and by the calculation that the Russia-China-U.S. triangle's stability constraints differ from any single bilateral relationship's stability constraints. Kissinger's 1972 Beijing opening is the canonical instance: the move was directed not at China alone but at the relational structure China-USSR-U.S."
  - "Court intrigue / family dynamics: the courtier or family member who reads 'mother favors elder sibling against me; mother is angry with elder sibling about X; elder sibling is allied with cousin against me' is doing the same triangular cognition Brown names. Shakespeare's *Lear* and *Hamlet* turn on the protagonists' triangular awareness (Goneril vs Regan from Lear's standpoint; Claudius-Gertrude vs Hamlet from Hamlet's standpoint), and on the failures of triangular awareness in critical moments (Lear's misread of Cordelia is exactly a failure to credit his other children's relations to him separately from each other's relations among themselves)."
  - "AI / robot social cognition: a system that lacks triangular awareness can do bilateral interaction well but fails at coalitional reasoning — it cannot anticipate that user-A's complaint about user-B reflects the A-B relationship rather than B's behavior in isolation, cannot model when an alliance might shift, and cannot strategically position itself in a multi-agent environment. Architectures that explicitly represent third-party-relations-from-the-agent's-standpoint (e.g., recursive theory-of-mind systems, partner-aware multi-agent RL) outperform those that flatten to bilateral interaction-matrices."
  - "Operationally distinct from lex-ckahh: lex-ckahh is about FILLING the model of the other when other-modeling is hard (default-to-self-projection). lex-yzuec is about the BASELINE capacity to construct two-step relational models (A's relation to B from my standpoint) regardless of how those models are filled. They compose: mirror-imaging is one failure mode of triangular cognition (the agent projects its own A-B relationship onto how A actually stands with B), and a competent triangular-aware agent suppresses mirror-imaging."
  - "Operationally distinct from lex-wnmfk: lex-wnmfk (Goffman) is about how individuals manage the impression they make on an audience; the audience is treated as a single perceiving-entity. lex-yzuec is upstream of Goffmanian impression-management — the performer who does NOT track which audience-members are allied with which (and thus how impressions in one audience-segment will be retold within the audience-segment's coalitional structure) is missing the coalitional layer Goffman's account presupposes."
  - "Operationally distinct from lex-9kuqg critical-juncture-amplifies-pre-existing-asymmetries: lex-9kuqg is about how institutional path-dependence locks in early coalitional configurations. lex-yzuec is the cognitive substrate that makes coalitions possible at all. The relation: lex-9kuqg describes what happens to coalitions over historical time once they form; lex-yzuec describes the cognitive capacity that enables them to form in the first place. A society-of-non-triangular-cognizers could not produce the coalitional-asymmetries lex-9kuqg's mechanism then amplifies."
critical-questions:
  - "is the analyst tracking bilateral relationships only, or is the analyst tracking the triangular structure (A-B from where C stands)? Discriminator: list the bilateral pairs in the situation; ask whether the claim being made about any pair is independent of, or dependent on, that pair's relationship to the third party. If the latter, the analysis must be explicitly triangular; flattening to bilateral will mislead."
  - "does the agent under analysis have triangular cognition, or only bilateral? Discriminator: probe whether the agent can give a coherent answer to 'why do you expect X to ally with Y against Z?' that references the X-Y-Z structure rather than reducing to X's separate preferences over Y and over Z. Children below ~age 4 typically fail this; some non-human animals fail this; some AI systems fail this; under high cognitive load adults can fail this transiently."
  - "is the apparent coalition-failure a failure of triangular cognition or a failure of bilateral relationship-management? Discriminator: when a coalition-prediction fails, the practitioner asks (a) did I misread the bilateral relationships (X actually does not favor Y), or (b) did I misread the triangular structure (X favors Y but their alliance is constrained by Y's prior commitment to Z that I did not credit). Mode-(a) failures are remedied by better bilateral observation; mode-(b) failures require deeper relational modeling."
  - "what is the order of recursion the situation requires? Discriminator: simple triangular cognition is 'A's relation to B from where I stand.' Richer cases require 'A's BELIEF about B's relation to C from where I stand,' or 'A's belief about B's belief about C's relation to D.' Each level of recursion is cognitively more expensive and more error-prone; competent practitioners stop at the recursion-depth the case actually requires, not deeper."
  - "what predicts a coalition's stability vs flip? Discriminator: a coalition that rests on each member's triangular-awareness of the others' bilateral relationships is more stable when those bilateral relationships are stable; it is brittle when one party's bilateral configuration shifts (a new alliance with a fourth party C', a divorce, a death, a promotion). Practitioners forecasting coalitional politics should monitor not only the named coalition but the bilateral configurations its members maintain elsewhere — those are the leading indicators of flip-risk."
status: active
