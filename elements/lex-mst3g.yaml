id: lex-mst3g
name: collective-cry-of-victims-interrupts-momentum-of-an-act
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Once a harmful act is set in motion, an unplanned sensory shock from the intended victims themselves breaks a momentum that argument alone could not stop, because it operates below the level of the rationalization that got the actor this far. In the Jataka''s tale of Lomasakassapa, the animals'' terror at the sacrificial sword, amplified by the crowd, halts the ascetic mid-strike: The elephant at the sight of the sword, terrified with the fear of death, uttered a loud cry. On hearing his cry the other beasts too, elephants, horses, and bulls through fear of death uttered loud cries, and the people also cried aloud.'
related: []
evokes: [jataka, navanipata, lomasakassapa-jataka, victims-cry-interrupts-momentum, sensory-shock-overrides-rationalization]
lineage:
  - source: primary
    text: jataka-chalmers1895-lomasakassapa-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IX (Navanipata), No. 433, Lomasakassapa-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The elephant at the sight of the sword, terrified with the fear of death, uttered a loud cry. On hearing his cry the other beasts too, elephants, horses, and bulls through fear of death uttered loud cries, and the people also cried aloud."
canonical-instances:
  - "A demolition crew about to level an occupied building pauses mid-count when a resident's dog starts howling from an upper floor, the sound breaking through the routine that every safety briefing had failed to interrupt."
critical-questions:
  - "Is the interruption here a genuine moral correction, or just an emotional flinch that happens to align with the right outcome this time — and how would you tell the difference?"
status: active
