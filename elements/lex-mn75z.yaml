id: lex-mn75z
name: a-prescriptive-theory-can-be-mistaken-for-a-descriptive-one
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When something fails to predict or match what people actually do, check whether it was ever built to be descriptive in the first place. Lakoff's case: John Rawls's veil-of-ignorance argument specifies the principles a just society ought to adopt. Judged as a description of American political liberalism, it fits poorly: real liberal positions on welfare, the environment, and civil rights don't derive cleanly from veil-of-ignorance reasoning the way a good description would predict. Lakoff's point is that this mismatch is neither a finding about liberals nor about Rawls being wrong. A normative theory was never in the business of matching existing behavior, so a gap between the ideal and the observed is exactly the shape a normative theory predicts. The category error runs in one direction: treating a should-theory as if it were a does-theory turns an ordinary, expected gap into what looks like a puzzle. Diagnostic move: before treating a mismatch with observed behavior as evidence against a theory, check which kind of claim the theory was actually making."
related: [lex-vmas8]
evokes: [george-lakoff, moral-politics-1996, john-rawls, veil-of-ignorance, descriptive-versus-prescriptive]
lineage:
  - source: primary
    text: lakoff-1996-descriptive-versus-prescriptive-rawls
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 2 'The Worldview Problem for American Politics,' section 'HIDDEN VERSUS OVERT, DESCRIPTIVE VERSUS PRESCRIPTIVE.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“A second common misconception confuses description with prescription. The models we are discussing are descriptive, not prescriptive. They are attempts to describe what people’s actual unconscious worldviews are, not what they should be. Most theories of liberalism and conservatism are not concerned with description but with prescription. For example, John Rawls’s celebrated theory of liberalism is not an empirical descriptive study but an attempt to characterize a prescriptive theory of justice, from which liberalism follows. As a descriptive account of actual liberal political stands on issues, it is a failure, as we shall see. My job here is to describe how people do make sense of their politics, not how they should.”"
canonical-instances:
  - "The direct textual anchor, on the failure Lakoff names and immediately reclassifies: 'As a descriptive account of actual liberal political stands on issues, it is a failure, as we shall see' -- paired with the reason that failure doesn't touch Rawls's own project: 'John Rawls's celebrated theory of liberalism is not an empirical descriptive study but an attempt to characterize a prescriptive theory of justice, from which liberalism follows.'"
  - "Hypothetical: an economics textbook's rational-choice model predicts that a consumer facing a 10% price increase on a staple good will cut consumption by a proportional amount. A researcher studies real supermarket receipts, finds households barely changing their staple purchases at all, and writes a paper calling the model 'empirically falsified.' A theorist objects that the model was built as a benchmark for what a perfectly consistent preference-ordering implies, and the real finding is that actual behavior diverges from that benchmark -- exactly what a benchmark is for measuring, and no refutation of it."
critical-questions:
  - "Lakoff asserts his own project is purely descriptive and Rawls's is purely prescriptive, but a single theory can do both -- describe an existing pattern while also endorsing it as reasonable. Is there a clean test for which category a given theory belongs to, or does a theorist's own stated intent settle the question by definition, making the distinction hard to check from outside?"
  - "If a prescriptive theory can't be refuted by a mismatch with actual behavior, what could show it's wrong rather than merely unrealized? Lakoff says checking Rawls's theory against liberal voting behavior is a category mistake, but never specifies what a legitimate check on a prescriptive claim would look like."
status: active
