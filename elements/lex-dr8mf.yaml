canonical-instances:
  - "A pharmaceutical company funds and defines the scope of a study on its own drug's workplace-productivity benefits; even if the methodology is unimpeachable, employees and their representatives reasonably distrust findings that only ever asked questions favorable to continued use of the drug program."
  - "An employer-funded study into 'return-to-office productivity' that never asks employees what they would study instead predictably meets union or employee-body skepticism, independent of whether its statistics hold up — the distrust tracks the sponsorship and problem-definition, not the arithmetic."
  - "Operationally distinct from lex-mt5h4 problem-framing-not-methodology-is-where-values-enter-research: that atom names how a research QUESTION already carries values even when the METHOD answering it is fully rigorous and honest, using Merton's own bureaucratic-vs-unattached-intellectual segregation-research case. This atom adds a second, separate claim specific to two-sided CONFLICTS: that the unsponsored party's rational distrust of partisan-funded research is itself a predictable, structural cost — independent of whether the research's problem-framing was actually biased — and that joint sponsorship is the operational fix for that legitimacy gap, not merely a call for more self-aware problem-framing."
critical-questions:
  - "Is joint sponsorship always achievable, or are there conflicts asymmetric enough (a much weaker party with no funds or standing to co-sponsor) that the remedy itself requires prior structural change before it can be applied?"
  - "Can a single-sponsor study ever earn the unsponsored party's trust through transparency alone (open data, external replication, adversarial review), or does Merton's claim imply the sponsorship signal itself is what triggers distrust regardless of downstream openness?"
status: active
