id: lex-h8zzt
name: credit-for-an-outcome-must-be-traced-not-assumed
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When an outcome follows from a SEQUENCE or SET of prior decisions, do not assume credit (for a good outcome) or blame (for a bad one) distributes evenly, obviously, or chronologically across those decisions. Some decisions may have been causally pivotal; others may have been irrelevant, coincidental, or actively counterproductive despite the good final outcome — and the reverse holds for bad outcomes with a single late error. Explicitly trace which specific decision(s) were crucial for the result before crediting or penalizing any of them. A naive after-the-fact assignment ('we won, so everything we did was good' / 'we lost, so the last move was the mistake') gives credit or blame to actions that were never actually decisive."
related: [lex-eb3wf, lex-k2r45, lex-96qnn]
evokes: [credit-assignment-problem, temporal-credit-assignment, structural-credit-assignment, outcome-bias, misattributed-causation, pivotal-decision-tracing, results-oriented-thinking]
lineage:
  - source: primary
    text: sutton-barto-2018-reinforcement-learning
    citation: "Richard S. Sutton and Andrew G. Barto, Reinforcement Learning: An Introduction, 2nd ed. (MIT Press, 2018), §15.9 'Reward Prediction Error and Dopamine,' p.385 (structural variant quoted below; the book separately treats the temporal variant throughout, indexed at pp.11,17,19,47,294,401, and Sutton's own 1984 PhD dissertation is titled 'Temporal Credit Assignment in Reinforcement Learning'). The book distinguishes TEMPORAL credit assignment (across a time-sequence of decisions leading to one outcome — illustrated in Ch.1's tic-tac-toe example, where a naive whole-game evaluation 'gives credit... to moves that never occurred') from STRUCTURAL credit assignment (across simultaneously-acting components or decision-makers contributing to one outcome). Both variants share the structural claim quoted below: crediting/blaming must be actively traced to the actually-responsible component(s), not assumed to attach to the whole sequence or set uniformly. The transferable claim generalizes beyond RL's formal setting to any domain where a single outcome results from multiple prior contributing choices — team sports (which player's actions were decisive), organizational post-mortems (which policy caused a result), and personal decision review (which specific choice in a chain was actually the mistake)."
    quote: "the structural version of the credit assignment problem: How do you distribute credit for success (or blame for failure) of a decision among the many component structures that could have been involved in producing it?"
  - source: discovery-loop
    text: distinctness-audit-credit-assignment
    citation: "Lex-0337 (prospective-hindsight-as-failure-mode-elicitation) is a pre-mortem technique — imagining future failure to elicit present risks, operating before the outcome exists — distinct from this atom's post-outcome tracing discipline: given an outcome that has already occurred, correctly attribute it to its actual causes among several candidate prior decisions. Lex-0854 (paired mint, same source) is a structurally adjacent but distinct RL-decision-theory primitive: lex-k2r45 is about balancing information-gathering against reward-taking within a sequential choice, while this atom is about correctly attributing an outcome's cause after a sequence of choices concludes."
canonical-instances:
  - "Team sports post-game analysis: a team wins a game; naive analysis credits every player's every action as 'good' because the team won, even actions that were mistakes the opponent failed to punish. Sabermetrics (e.g., baseball's WAR, wins-above-replacement) exists specifically to solve this — statistically isolating each player's actual marginal contribution to outcomes rather than assuming uniform credit from the final score."
  - "Evolutionary/genetic optimization vs. targeted credit assignment (Sutton & Barto's own contrast, Ch.1): an evolutionary method that evaluates only the FINAL outcome of a long sequence of moves gives equal credit to every move in a winning sequence, 'even to moves that never occurred' as live options — it cannot tell which specific moves were pivotal. Methods that evaluate intermediate states (temporal-difference learning) assign credit closer to the actually-decisive steps."
  - "Organizational post-mortem: a product launch succeeds; the naive story credits the most recent or most visible decision (the marketing campaign) when the actual driver might have been a much earlier, less visible engineering decision (or vice versa for a failure blamed on the last person who touched the code before it broke)."
  - "Historical causation: a policy is enacted and an economic outcome follows; popular narrative often assigns full credit or blame to the most recent or most politically salient policy, when the outcome may trace to structural conditions or earlier decisions several steps removed."
critical-questions:
  - "Is credit/blame being assigned by TEMPORAL PROXIMITY (the last thing that happened before the outcome) or CAUSAL CONTRIBUTION (the thing that actually moved the outcome)? These frequently diverge — the most recent action is not necessarily the most causally cardinal one."
  - "Would the outcome likely have occurred WITHOUT this specific decision? If yes, the decision is not actually credit-bearing for this outcome, however positively or negatively it's currently being evaluated."
  - "Is credit being distributed across the WHOLE sequence uniformly (every move in a winning game was 'good') rather than differentially (some moves were pivotal, most were neutral, a few may have been actively bad but not yet punished)?"
  - "For a MULTI-AGENT or multi-component outcome: is credit assignable to a specific component at all, or does the outcome depend on a combination that no single component's marginal contribution can isolate (a genuinely joint/emergent effect, not a decomposable one)?"
status: active
severity-tier: info
