id: lex-v6kay
name: rule-violation-as-information-source
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When a rule is being violated, surface that the violation is itself information — what rule was broken, by whom, in what direction; design the response as inference about the system, not only as enforcement."
related: [lex-b3vap, lex-dzqje, lex-hfcae, lex-y6pqz, lex-ypecd]
evokes: [the-trickster, breaking-the-rule-reveals-the-rule, the-fool-who-tells-truth, hermes-the-information-thief, methodological-anarchism, fuzz-test-the-system]
lineage:
  - source: primary
    text: hyde-1998-trickster-makes-this-world
    citation: "Lewis Hyde, Trickster Makes This World (Farrar, Straus and Giroux, 1998), the Homeric-Hymn-to-Hermes reading. The canonical comparative-mythology study of the Trickster archetype: Hermes, Loki, Coyote, Anansi, Br'er Rabbit, Krishna-as-butter-thief. The Trickster's rule-violations REVEAL the rules to the community; the violation IS the information-transmission mechanism. Recurring cross-culturally"
    quote: "'By the end of the Hymn, then, Hermes has been made the Keeper of the Herds and, in scenes I haven't cited, much more: he is admitted to the Pantheon, he is an acknowledged son of Zeus, he has been given a share of prophetic powers, he has become the messenger of the gods, the guide to Hades, and so on. None of this would have happened had he confessed guilt when Apollo first approached him. On the contrary, a true confession would have been an accession to the status quo and would have locked him in it forever. Spoken at the boundary of what is and is not the case, however, his lies unsettled and moved that boundary.'"
  - source: primary
    text: feyerabend-1975-against-method
    citation: "Paul Feyerabend, Against Method (New Left Books, 1975). Methodological anarchism: 'anything goes.' Scientific progress requires rule-violation; Galileo's empirical methods broke Aristotelian methodological norms and IS what made the discoveries possible. The rule-breaker reveals the constructed nature of the rules"
    quote: "'It is clear, then, that the idea of a fixed method, or of a fixed theory of rationality, rests on too naive a view of man and his social surroundings. To those who look at the rich material provided by history, and who are not intent on impoverishing it in order to please their lower instincts, their craving for intellectual security in the form of clarity, precision, 'objectivity', 'truth', it will become clear that there is only one principle that can be defended under all circumstances and in all stages of human development. It is the principle: anything goes.'"
  - source: practitioner
    text: mythology-decomposition-pass
    citation: "promoted from cross-attestation: narrative tradition (Hermes/Loki/Coyote/Anansi/Br'er Rabbit/Bugs Bunny/Puck — Trickster archetype recurring across cultures); Tarot's Fool (the Magician with sleight-of-hand; the Devil's transgression); Hyde 1998 (comparative mythology); Feyerabend 1975 (philosophy of science / epistemology); security red-teaming and penetration testing (rule-violation as discovery-mechanism for vulnerabilities; intentional violation of intended use to reveal flaws); ML adversarial examples (Szegedy et al. 2014 — small input perturbations that violate distributional assumptions reveal what the model actually learned vs what designers intended); fuzzing (random rule-violating inputs systematically surface bugs that compliant inputs don't); comedy theory (Suls 1972 incongruity-resolution + benign violation theory — McGraw 2010: jokes work by violating norms in safe ways; the violation IS what reveals the norm). Cross-domain across mythology, philosophy of science, security testing, ML safety, and comedy theory"
canonical-instances:
  - "Hermes stealing Apollo's cattle on his first day of life (Homeric Hymn to Hermes ~6th century BCE): the theft is structurally a rule-violation but it ESTABLISHES Hermes as a god (gets him a divine portfolio: trade, communication, boundaries, thievery, language, interpretation). The violation is the productive mechanism — it forces Apollo to recognize Hermes' domain. Same shape recurring in Loki, Coyote, Anansi"
  - "security red-teaming: the red team's job is to violate the assumptions designers built around (try the unintended use, the malformed input, the out-of-spec sequence); the violations reveal the actual security boundary, not the designed one. 'Hackers' in the original sense were Tricksters; the rule-violation IS the security-discovery method"
  - "ML adversarial examples: an image classifier confidently identifies a panda; add tiny pixel-noise (imperceptible to humans) and it confidently identifies a gibbon. The adversarial input is a rule-violation (off-distribution); the violation reveals what the model actually learned (high-frequency features, not panda-essence). The information-yield is high precisely because the rule was violated"
  - "comedy: a roast joke about a friend's known flaw lands BECAUSE it violates politeness norms in a context where the violation is benign (everyone knows the love is there). The violation IS what makes the truth-content visible; sincere statement of the same content would feel preachy. McGraw's benign-violation theory operationalizes this"
  - "operationally distinct from lex-y6pqz toy-model-then-perturb: toy-model perturbs WITHIN a structured method (small mass-ratio expansion, etc.); rule-violation goes OUTSIDE the structured method (off-distribution, off-protocol) and yields information about the method itself. Different layer"
  - "operationally adjacent to lex-ypecd inversion-as-meaning-modifier: rule-violation can be read as inverting the rule (do the opposite); but rule-violation is broader (orthogonal violations also count: doing something neither-mandated-nor-prohibited can also be informative)"
  - "pivotal critical question: is the violation actually generating information, or is it just chaos? Tricksters in mythology are productive when the chaos has a target (Hermes wants a portfolio, Coyote wants attention); pure random rule-violation without target produces noise, not signal. Productive rule-violation requires intent or systematic exploration (fuzzing's coverage-guided variants outperform pure random fuzzing for this reason)"
  - "key critical question: does the system being violated have legitimate authority over the domain? Rule-violation in a context where the rules were never essential (cargo-cult rules, ritual rules with no operational content) is just performance, not information. Tricksters reveal foundational rules by violating them; violating rules that aren't decisive reveals nothing"
critical-questions:
  - "what does the specific violation reveal that compliance would have hidden — name the inference, not just the breach"
  - "is the violator probing the rule's enforceability or expressing a different model of the situation? response differs by case"
  - "could the rule itself be miscalibrated such that the violation is information about the rule, not about the violator?"
  - "is your response designed to extract the information or to defend the rule? these often conflict"
status: active
