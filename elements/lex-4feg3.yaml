id: lex-4feg3
name: status-based-selection-creates-an-exploitable-deference-trigger
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When choosing who fills a defensive or high-stakes role, don't select primarily by the status or rank that comes with an automatic, socially-enforced deference obligation from others -- that obligation is exactly what an adversary who understands the norm can invoke on command to neutralize the role-holder, regardless of their actual skill. Some of Kautilya's contemporaries argued for prioritizing higher-varna troops because 'the higher the varna the more the spirit,' but Kautilya rejects this on a specific mechanical ground: 'An enemy may win over Brahmin troops by prostrating himself before them. It is better to have either an army composed of Kshatriyas trained in the use of weapons or a Vaishya or Sudra army with a large number of men.' The vulnerability isn't a claim about lesser fighting spirit -- it's that Brahmin status carried a specific, widely-recognized social rule (a show of submission or reverence obligates a non-violent response), and an enemy commander who knows the rule can perform the triggering gesture at will, disabling the defense through the very mechanism that made the selection prestigious in the first place. A selection criterion tied to trained, tested competence has no equivalent off-switch, because there's no publicly known gesture that makes a skilled fighter stop fighting. Diagnostic move: when a role is filled based on rank, credential, or status rather than tested performance under the specific conditions the role exists for, ask what socially-recognized gesture or claim would obligate that status-holder to stand down, defer, or comply -- if such a gesture exists and is generally known, the selection has built in a triggerable failure mode that a competence-based selection would not have."
