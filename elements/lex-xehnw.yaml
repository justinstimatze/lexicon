lineage:
  - source: primary
    text: hesiod-c700-works-and-days-proximity-targeting
    citation: "Hesiod, *Works and Days* line 25-26 (~700 BCE; Hugh G. Evelyn-White trans. 1914, Loeb Classical Library Hesiod volume). The pre-Aristotelian primary articulation of the proximity-targeting claim of lex-xehnw, embedded in Hesiod's two-strifes passage (lines 11-26). In line 25-26 specifically, Hesiod names the proximity-axis: `potter is angry with potter, and craftsman with craftsman, and beggar is jealous of beggar, and minstrel of minstrel`. The structural claim: competitive-comparison-with-fellow-competitors operates only at within-occupation, within-status, within-equivalence proximity — potter feels envy/emulation toward potter, not toward minstrel. Aristotle Rhetoric II.10 later formalizes this as the equality-condition for envy (`equals in birth, relationship, age, disposition, distinction, or wealth`); Hesiod articulates the agrarian-Greek concrete-occupation version. Pushes the lineage chain Hesiod 700 BCE → Aristotle 340 BCE → Plutarch 100 → Bacon 1625 → Schoeck 1966 → Wynn 2021 to 2,700 years of cross-tradition attestation."
    quote: "[Hesiod *Works and Days* ll. 23-26, Evelyn-White trans. 1914:] '...neighbour vies with his neighbour as he hurries after wealth. This Strife is wholesome for men. And potter is angry with potter, and craftsman with craftsman, and beggar is jealous of beggar, and minstrel of minstrel.' [The proximity-claim is given in pre-philosophical concrete-occupation form: envy/emulation operate within equivalence-classes (potter-potter, craftsman-craftsman, beggar-beggar, minstrel-minstrel), not across. The structural feature Aristotle later abstracts to `equals in birth, relationship, age, disposition, distinction, or wealth` is here named through the everyday proximate-rivalry of 8th-century-BCE agrarian-Greek occupations. The Bacon 1625 visibility-claim and the Plutarch Aristides ostracism canonical-instance both build on this same proximity-equivalence structural feature.]"
  - source: primary
    text: bacon-1625-essays-of-envy
    citation: "Francis Bacon, *Essays or Counsels, Civil and Moral* (1625 final edition; first published 1597, expanded 1612, definitive 1625). Essay IX 'Of Envy' is the locus classicus of the transferable claim: envy is selective by visibility and proximity, not absolute magnitude. Bacon's four movements: (1) the nature of envy as an 'evil eye' / fascination requiring sight-line and present-object; (2) who-envies — proximate-class equals especially when one rises (near kinsfolks, fellows-in-office, those bred-together) and those who 'cannot mend their own case' (the deformed, eunuchs, old men, bastards); (3) who-is-envied — those of insolent-proud display, sudden-rise (per saltum), and unworthy advancement; less-envied are those of noble blood, slow rise, joined-with-travail/peril, and those who 'do sacrifice to envy' by allowing themselves to be crossed in unimportant matters; (4) protective strategies — eliciting pity ('chanting a quanta patimur!'), deflecting envy onto subordinates ('bring in upon the stage somebody upon whom to derive the envy'), sustaining inferior officers in their pre-eminences ('so many screens between him and envy'), and avoiding crafty-cunning display in favor of plain-open carriage. The headline structural claim — explicit at Bacon Essays IX paragraph beginning 'Persons of noble blood, are less envied in their rising. For it seemeth but right done to their birth' and at 'envy is ever joined with the comparing of a man's self; and where there is no comparison, no envy; and therefore kings are not envied, but by kings' — articulates the proximity-and-visibility selectivity in one paragraph. PD globally (Bacon d.1626). Source-grounded 2026-05-27. Bacon's framing as 'evil eye' / fascination explicitly connects to the cross-cultural amulet-traditions Schoeck would later (1966) document universally."
    quote: "[Bacon 1625 Essay IX 'Of Envy':] 'near kinsfolks, and fellows in office, and those that have been bred together, are more apt to envy their equals, when they are raised. For it doth upbraid unto them their own fortunes, and pointeth at them, and cometh oftener into their remembrance, and incurreth likewise more into the note of others; and envy ever redoubleth from speech and fame.' [Bacon 575-h-0:996-999]: 'envy is ever joined with the comparing of a man's self; and where there is no comparison, no envy; and therefore kings are not envied, but by kings.' [Bacon 575-h-0:1014-1027]: 'Those that have joined with their honor great travels, cares, or perils, are less subject to envy. For men think that they earn their honors hardly, and pity them sometimes; and pity ever healeth envy. Wherefore you shall observe, that the more deep and sober sort of politic persons, in their greatness, are ever bemoaning themselves, what a life they lead; chanting a quanta patimur! Not that they feel it so, but only to abate the edge of envy.' [Bacon 575-h-0:1029-1040]: 'Above all, those are most subject to envy, which carry the greatness of their fortunes, in an insolent and proud manner; being never well, but while they are showing how great they are, either by outward pomp, or by triumphing over all opposition or competition; whereas wise men will rather do sacrifice to envy, in suffering themselves sometimes of purpose to be crossed, and overborne in things that do not much concern them.' [Bacon 575-h-0:1054-1058]: 'public envy, is as an ostracism, that eclipseth men, when they grow too great. And therefore it is a bridle also to great ones, to keep them within bounds.'"
  - source: primary
    text: plutarch-c100-aristides-ostracism
    citation: "Plutarch, *Lives of the Noble Grecians and Romans* (c.100 CE; Dryden trans. 1683, revised Clough 1864). The Aristides life records the canonical ostracism anecdote (482 BCE): an illiterate Athenian citizen, not recognizing Aristides, asked Aristides to inscribe Aristides's own name on the citizen's ostron (potsherd) — and when Aristides asked why, the citizen replied 'because I am tired of hearing him everywhere called the just.' The story illustrates the Bacon structural-claim in operation: visibility-of-virtue + proximity (Aristides was a fellow-citizen, not a remote king) trigger envy-mediated removal even when the envied has done no harm. Plutarch frames this as ostracism's regulatory function — it removed those whose conspicuous excellence threatened the equality-presumption of democratic citizens. Athenian ostracism (ostrakismos) was institutionalized envy-management: a regular procedure for banishing too-prominent citizens for 10 years, no charges required, by majority vote of the assembly. The institution operated 487-417 BCE before falling into disuse. PD globally (Plutarch d. ~120 CE; Dryden d.1700). Source-grounded 2026-05-27."
    quote: "[Plutarch *Aristides* §7, Dryden-Clough trans.]: '[At the ostracism vote, an illiterate citizen, not recognizing Aristides, asked Aristides himself to inscribe Aristides's name on the ostron. Aristides asked whether Aristides had done him any wrong. None, the citizen replied — 'because I am tired of hearing him everywhere called the just.' Aristides wrote his own name on the ostron and returned it. The vote went against him; he was banished for ten years.]' [The structural significance: the citizen's grievance was not against any act of Aristides but against the persistent VISIBILITY of Aristides's distinction. Plutarch's framing makes clear that ostracism functioned as institutionalized envy-management: a regular procedure for banishing too-prominent citizens, no charges required, by majority vote. The institution operated 487-417 BCE before falling into disuse. This is the Bacon claim — 'public envy as ostracism, a bridle to great ones, to keep them within bounds' — in its historical canonical case.]"
  - source: primary
    text: aristotle-nicomachean-ethics-envy-doctrine-of-mean
    citation: "Aristotle, *Nicomachean Ethics* II.7 (c.340 BCE; F. H. Peters trans. 1893). Aristotle places envy (phthonos) in the doctrine-of-mean triangle around indignation-at-good-fortune: the mean is righteous-indignation-at-undeserved-good-fortune (nemesis); the deficient-vice is malicious-rejoicing-at-others'-misfortune (epichairekakia); the excessive-vice is envy (phthonos — pain at others' good fortune regardless of desert). NE II.7 is brief — Aristotle defers full treatment to a separate work. The Rhetoric II.10 develops the proximity claim ('men envy those who are near them in time, place, age, or reputation') more fully; the Aristotelian framing of envy as the vice-of-excess in a doctrine-of-mean triangle is what NE II.7 provides. Cited as Aristotle's PD-and-in-refs grounding for envy as a distinguished moral phenomenon. PD globally (Aristotle d.322 BCE; Peters d.1900). Source-grounded ra. The Rhetoric II.10 proximity-claim is the more direct grounding for lex-xehnw but is"
    quote: "[Aristotle *NE* II.7, Peters trans. paraphrase]: '[In the triangle around indignation-at-undeserved-good-fortune, the mean is righteous-indignation (nemesis); the deficient is malicious-rejoicing (epichairekakia); the excessive is envy (phthonos — pain at others' good fortune as such, regardless of whether deserved). The envious person feels pain at fortune that is in fact merited, which the indignant person would only feel for unmerited fortune.]' [The Aristotelian framing makes envy a specifically moral phenomenon — a vice of excess. The proximity-claim (`men envy those who are near them in time, place, age, or reputation`) is developed in Rhetoric II.10 — now at via the Rhys Roberts 1924 Clarendon translation. See next lineage entry.]"
  - source: primary
    text: aristotle-rhetoric-ii-10-envy-proximity-claim
    citation: "Aristotle, *Rhetoric* II.10 (c.340 BCE; W. Rhys Roberts trans., Oxford Clarendon *Works of Aristotle Translated into English* vol. XI, 1924). PD globally since Roberts d.1929. Rhetoric II.10 is the LOCUS-CLASSICUS primary for the proximity-claim of lex-xehnw: envy targets those near us in time, place, age, or reputation. Aristotle's structural argument (Bekker 1387b-1388a): envy is felt only toward `equals`, where `equals` means equals in birth, relationship, age, disposition, distinction, or wealth. We do not compete with men who lived a hundred centuries ago, or those not yet born, or the dead, or those at the far reaches of the world (`the Pillars of Hercules`), or those we take to be far below or far above us. The proximity-claim is therefore not a contingent observation but a structural feature of envy as such — envy without proximity cannot ignite. This upgrades lex-xehnw's lineage from NE-only to NE + Rhetoric Aristotelian grounding, and graduates the prior cross-reference (in the NE II.7 entry) from `, at ` to The vol XI also contains De rhetorica ad Alexandrum (Forster) and De poetica (Bywater) — the Rhetoric-proper is 1354a-1420b in Bekker pagination, with II.10 at 1387b20-1388a30."
    quote: "[Aristotle *Rhetoric* II.10, Rhys Roberts trans., Bekker 1387b22-1388a10]: 'To take Envy next: we can see on what grounds, against what persons, and in what states of mind we feel it. Envy is pain at the sight of such good fortune as consists of the good things already mentioned; we feel it towards our equals; not with the idea of getting something for ourselves, but because the other people have it. We shall feel it if we have, or think we have, equals; and by »equals« I mean equals in birth, relationship, age, disposition, distinction, or wealth.' [Continuing 1388a3-1388a10:] 'It is clear also what kind of people we envy; that was included in what has been said already: we envy those who are near us in time, place, age, or reputation. Hence the line: »Ay, kin can even be jealous of their kin.« Also our fellow-competitors, who are indeed the people just mentioned — we do not compete with men who lived a hundred centuries ago, or those not yet born, or the dead, or those who dwell near the Pillars of Hercules, or those whom, in our opinion or that of others, we take to be far below us or far above us.' [The proximity-claim is structurally specified: the conditions under which envy can ignite ARE the conditions of comparability across time/place/age/reputation. Aristotle's framing makes the proximity-claim not a tendency but a STRUCTURAL precondition — at sufficient distance on any of the named axes, the affect that would be envy with proximity simply does not arise. The Bacon 1625 reformulation (`men of great place... are envied because envy follows them, and they cannot stand the envy of their fellows... unless they have been brought up in it from their cradle') extends this to the political-stability use; the Plutarch Aristides ostracism instance shows the polity-level institution managing the proximity-envy structure Aristotle here articulates.]"
  - source: practitioner
    text: schoeck-1966-envy-as-universal-social-restraint
    citation: "Helmut Schoeck, *Der Neid: Eine Theorie der Gesellschaft* (Karl Alber Verlag, München-Freiburg 1966); English: *Envy: A Theory of Social Behaviour*, trans. Glenny & Ross (Secker & Warburg 1969; Liberty Fund 1987). Modern sociological synthesis of the cross-cultural evidence that fear-of-being-envied is a universal social restraint force across pre-industrial and industrial societies. Schoeck assembles evidence from anthropology (witchcraft-belief, evil-eye traditions in 200+ documented cultures), archaeology (amulet-objects pan-Mediterranean and pan-South-Asian), economics (Foster 1965 'Peasant Society and the Image of Limited Good'), and political philosophy (egalitarian-revolutionary movements as envy-channels). Argues against the inequality-causes-envy thesis: envy operates equally intensely in egalitarian tribal societies as in stratified industrial ones. The protective behaviors (concealment of wealth, mashallah verbal apotropaic, refusing to praise one's own children, dressing-down) are documented worldwide. ContraPoints (Wynn 2021) cites Schoeck explicitly as the modern operationalization (transcript). In-copyright (1966 + Liberty Fund 1987); cited as transferability attestation via Wynn-as-tertiary-lens, not as decisive source. The PD-primary indispensable sources for lex-xehnw are Bacon 1625, Plutarch ~100, and Aristotle ~340 BCE."
    quote: "[Schoeck 1966 paraphrase via Wynn 2021 transcript]: 'Schoeck argued that rather than being the result of social or economic inequality, envy is a universal across all human societies including very egalitarian ones... for example in tribal and village cultures around the world there's often a concept of black magic or witchcraft which are thought to be used by envious people to bewitch the ones they envy... cultures all over the world today understand the evil eye as a kind of curse cast by the malignant gaze of an envious person... the concept of the evil eye reveals a more sophisticated awareness of envy and of the social danger that it poses... [Wynn quoting Schoeck on the Haitian peasant who] will seek to disguise his true economic position by purchasing several smaller fields rather than one larger piece of land for the same reason he will not wear good clothes — he does this intentionally to protect himself against the envious black magic of his neighbors.' [The transferable point Schoeck establishes empirically: envy is not a modern-industrial pathology but a universal feature of human social comparison, and the protective behaviors (concealment, dressing-down, verbal apotropaic, refusing to praise oneself or one's children) are convergently invented worldwide because the structural pressure is universal. Wynn 2021 brings this into contemporary register: social-media as an envy-incubator that intensifies proximity-effects by putting everyone next to everyone else.]"
  - source: discovery-loop
    text: cross-tradition-convergence-on-visibility-and-proximity
    citation: "Cross-tradition convergence (discovery): the structural claim that envy targets visibility-and-proximity-not-absolute-magnitude has independent PD-primary articulation in (a) Aristotle's Rhetoric II.10 ~340 BCE — 'men envy those who are near them in time, place, age, or reputation'; (b) Plutarch's Aristides ~100 CE — the canonical ostracism anecdote where visibility-of-virtue triggers banishment; (c) Bacon's *Essays* IX 1625 — the most extensive single articulation, with all four movements (who envies, who is envied, public envy, protective strategies); (d) Schoeck 1966 as modern empirical synthesis (in-copyright; via Wynn). The cross-traditional span (Athens 340 BCE → Rome ~100 CE → Elizabethan-Jacobean England 1625 → 20th-c. comparative sociology) plus the contemporary registration in Wynn 2021 (showing the structure still operates on social-media-mediated proximity) is evidence the claim is substrate-topological, not parochial. The cross-cultural amulet-traditions (evil-eye, nazar, mashallah, malocchio, kakos ophthalmos) plus institutionalized envy-management (ostracism, sumptuary laws, tall-poppy norms) are independent evolutionary-cultural attestations of the same underlying structural pressure."
    quote: "[Cross-tradition consistency check, 2026-05-27: 4 PD-primary instantiations across ancient-Greek ethics (Aristotle NE/Rhetoric), Greco-Roman biographical history (Plutarch), early-modern English political philosophy (Bacon), and contemporary critical-essay (Wynn 2021 transcript), plus modern empirical synthesis (Schoeck 1966 via Wynn). The cross-cultural amulet-traditions (evil-eye / nazar / mashallah / malocchio across at least 30 documented language-cultures) and institutionalized envy-management (Athenian ostracism, Roman sumptuary laws, tall-poppy norms in British/Australian/Scandinavian/Japanese cultures) are independent attestations. The structural claim — envy's selectivity by visibility-and-proximity rather than absolute-magnitude — has substrate-topological character: it operates wherever (a) social comparison occurs across visible reference-classes and (b) the envier lacks instrumental power to remove the underlying inequality. Where these conditions don't hold (e.g., comparison across enormously distant social classes; envier with reform-leverage that can change the structure), the pattern weakens.]"
canonical-instances:
  - "Athenian ostracism canonical case (Plutarch *Aristides* §7, 482 BCE): the illiterate citizen votes to ostracize Aristides because he is 'tired of hearing him called the just' — visibility of virtue, not any harm done, triggers the envy-mediated removal. Institution operated 487-417 BCE as regularized envy-management; any citizen could be banished for 10 years by majority vote, no charges required. The historical canonical case of Bacon's later claim that 'public envy is as an ostracism, a bridle to great ones.'"
  - "Bacon's protective-strategies catalog (*Essays* IX 1625): the explicit early-modern statement of the rational responses to envy-pressure — slow rise (per gradus rather than per saltum), eliciting pity (chanting a quanta patimur!), joining honor with visible travails-and-perils, deflecting envy onto subordinates ('bring in upon the stage somebody upon whom to derive the envy'), sustaining inferior officers in their pre-eminences as 'screens between him and envy,' avoiding crafty-cunning display in favor of plain-open carriage, and 'doing sacrifice to envy' by deliberately being crossed in unimportant matters. Bacon names this a 'wise' practice for great persons — the rationality of the protective strategy is the evidence for the structural pressure."
  - "the evil-eye / nazar / mashallah cross-cultural canonical case: amulet-traditions and verbal apotropaic against the envious gaze are independently invented across at least 30 documented language-cultures — ancient Greek (baskania), Roman (malocchio), Mediterranean (nazar), Arabic-Islamic (mashallah / la hawla), South Asian (drishti / drishti dosham), Sub-Saharan African (varies), Latin American (mal de ojo). The widespread independent invention is evidence the underlying structural pressure (envy-mediated harm visible to others) is convergent across cultures, not a meme spread from one source."
  - "Olympic silver-vs-bronze paradox (Medvec, Madey & Gilovich 1995 *J. Personality & Social Psychology* 69(4):603-610): silver medalists exhibit LESS satisfaction than bronze medalists despite higher absolute placement. The asymmetry traces to counterfactual-proximity: silver is one step from gold (envy of the one closest); bronze is one step from no-medal (relief, gratitude). The structural-claim of lex-xehnw operationalized in modern experimental psychology — envy is proximity-driven not magnitude-driven. (In-copyright study; cited as transferability attestation. Wynn 2021 uses the example explicitly.)"
  - "the tall-poppy / law-of-Jante canonical cluster: Australian-British-Scandinavian-Japanese cultural norms penalizing visible self-promotion above the peer group. Tall-poppy syndrome (UK/Australia) — the tallest poppies are cut. Janteloven (Aksel Sandemose 1933 — in-copyright but cultural-prior unambiguous) — the ten anti-self-promotion rules of a small Norwegian-Danish town. Deru kugi wa utareru (Japanese — 'the nail that sticks out gets hammered down'). The Tamil saying 'the tree that bears fruit will be stoned' (Wynn 2021 transcript line 170). All articulate the protective-modesty equilibrium that emerges where envy-pressure is high; the cultural-evolutionary convergence is the attestation."
  - "Haitian peasant land-disguise case (Schoeck 1966 citing G. Simpson; Wynn 2021 line 172-174): rather than visibly purchase one larger field, the peasant purchases several smaller scattered fields and dresses down to disguise his economic position. The intent is explicit: protection against the envious black-magic of neighbors. A fully-articulated rational concealment-of-success strategy by an actor who has no leverage to remove the structural pressure (envy in a small community where neighbors observe purchases). The pattern recurs in early-modern peasant economies broadly; Foster 1965 'Peasant Society and the Image of Limited Good' (in-copyright) is the canonical anthropological synthesis."
  - "Marie Antoinette libelle case (Robert Darnton 1995 *The Forbidden Best-Sellers of Pre-Revolutionary France*; Antonia Fraser 2001 *Marie Antoinette*): the 1770s-1790s libelle (pornographic pamphlet) industry depicted the Queen as a bisexual demon engaging in orgies and sexual manipulation — Darnton calls it 'an avalanche of defamation that has no parallel in the history of vilification.' None of it was true. The structural-pattern lex-xehnw predicts: visibility-of-extraordinary-position + structural-impotence of envier (the urban poor under the ancien régime) → fabrication of vice in the envied to license what amounts to envy-mediated destruction. The pattern recurs in QAnon-style conspiracy theory (Wynn 2021 explicit parallel): elite figures imagined to be engaging in satanic orgies / pedophilia / cannibalism — fabricated vice that licenses imagined-righteous destruction."
  - "intra-trans-community envy (Wynn 2021 transcript lines 342-360): trans women report finding it 'hard to watch' other trans creators — the angry-resentful-feeling-in-the-pit-of-the-stomach when proximate-peers achieve passing or visibility one cannot. Wynn frames this as lex-xehnw's proximity-effect: envy is more intense toward proximate-comparable peers (other trans women) than toward distant comparable persons (cis women, who are categorically unreachable). The reference-class for comparison is identity-determined (composing with lex-u8u7y social-identity-as-self-concept-determinant); within that class, the envy intensity tracks proximity-of-comparison, not absolute-distance from the absolute ideal. Boomer-trans-vs-young-trans intergenerational envy ('it was hard for me, so it should be hard for everyone' — line 357) is the same structure across age-cohorts."
  - "online proxy-warfare canonical case (social-media-mediated envy escalation): visibility-amplification (the algorithmic feed) + proximity-collapse (everyone in everyone's reference-class) intensify the structural pressure lex-xehnw predicts. Fire Festival 2017 backlash (Wynn opens with this), Kim Kardashian birthday-island 2020, Jameela Jamil skin-routine comments — visibility-of-luxury + proximity-via-platform → envy expressed as moral indignation. The platform infrastructure operationalizes both halves of lex-xehnw's selectivity criterion at unprecedented scale. The institutionalized envy-management (ostracism, sumptuary laws) of earlier eras becomes ad-hoc gossip-and-pile-on online. Wynn's diagnosis: the underlying envy-mechanism is the constant; the social infrastructure for its expression is the variable."
  - "Joe Freeman 'Trashing: The Dark Side of Sisterhood' canonical case (Ms. Magazine 1976): documented intra-movement envy-driven ostracism within 1970s feminism — 'achievement or accomplishment of any kind would seem to be the worst crime. Do anything that every other woman secretly or otherwise feels she could do just as well and you're in for it.' Freeman avoided the word 'envy' but described the structure precisely (Wynn 2021 lines 324-336 makes the diagnostic explicit). The Bacon claim — 'near kinsfolks, and fellows in office, and those that have been bred together, are more apt to envy their equals, when they are raised' — operating within an oppressed-group reference-class. Freeman 1976; pattern visible in subsequent intra-movement dynamics across many social movements."
  - "operationally distinct from lex-5kjya costly-conspicuous-waste-as-status-signal: lex-5kjya (Veblen) names the SIGNALING-USE of visible costly display (display IS the value); lex-xehnw (Bacon-Schoeck) names the ENVY-MAGNETISM of visible success (display CARRIES the cost). The two are NOT contradictory — both are real in different social contexts. lex-5kjya applies in stable hierarchies where being-envied is materially safe (the leisure-class can absorb envy without losing position). lex-xehnw applies in egalitarian or precarious-position contexts where envy-mediated removal is a real threat (Athenian democracy, peasant village, intra-movement dynamics). Sophisticated actors operate both — Veblenian display when secure, Baconian self-deprecation when precarious. The two atoms compose: in any given context, ask which equilibrium dominates (Veblen-signaling or Bacon-concealment) and why."
  - "operationally distinct from lex-xe76g ring-of-gyges-morality-under-unobservability: lex-xe76g (Plato) is about how REMOVING observability of one's own ACTIONS removes moral restraint on those actions. lex-xehnw is about how OBSERVABILITY of one's own SUCCESS invites others' envy-mediated destruction. Different sides of the visibility-coin: lex-xe76g asks 'what do I do when I'm not watched?'; lex-xehnw asks 'what happens to me when I am watched?'. Both turn on visibility-as-structural-feature, but at different stages of the social-causal-chain. They compose: full visibility-economy analysis requires both moves (my-actions-observed + my-position-observed)."
  - "operationally distinct from lex-wf4nj master-vs-slave-morality-as-typology-of-value-creation: lex-wf4nj (Nietzsche) names the AGGREGATE moral system that emerges from chronic impotent envy across populations and historical epochs (slave-morality as the inversion-of-values produced by long political weakness). lex-xehnw is the LOCAL targeting mechanism (envy hits visible-proximate-equals selectively). lex-wf4nj is meta-historical and population-level; lex-xehnw is dyadic-relational and immediate. They compose: lex-wf4nj is what happens when lex-xehnw operates at population-scale across centuries (the systematic re-coding of values to favor the impotent reference-class). lex-xehnw names the daily mechanism; lex-wf4nj names the millennium-scale aggregate."
  - "operationally distinct from lex-k2kdc constitutive-defense-when-the-defense-generates-the-threat: lex-k2kdc (Bataille-Friday-Jervis-Wynn) names the LOOP where defense-operation feeds back into threat-causal-chain. lex-xehnw's protective-strategies (concealment, slow rise, eliciting pity) typically DON'T generate more envy — they actually reduce it. They are non-constitutive defenses against a genuinely-exogenous social pressure. (Exception: the Streisand effect — visible concealment-effort can amplify visibility — is a constitutive-defense moment within lex-xehnw's broader domain; that's the edge-case where the two atoms compose.) Most lex-xehnw-instances are not lex-k2kdc; the discrimination matters operationally."
  - "operationally adjacent to lex-u8u7y social-identity-as-self-concept-determinant: the reference-class against which envy compares is identity-determined (other trans women, other writers in my genre, other parents in my income bracket). lex-u8u7y sets the comparison-class; lex-xehnw names what happens within it. They compose — the substrate-pressure is not just 'visibility + proximity' but 'visibility + proximity-within-identity-class.' Outsiders to the identity-class are categorically less envy-target-able even when objectively-closer."
  - "operationally adjacent to lex-2rsad identity-protective-belief-maintenance: when envy is felt, the envier often re-codes the feeling as moral judgment of the envied (slut-shaming-as-repressed-envy, Marie Antoinette libelles fabricating vice). The re-coding is identity-protective: admitting envy would imply inferiority. lex-2rsad names the re-coding mechanism; lex-xehnw names what triggered it. They compose: envy felt at visible-proximate disparity → identity-protective re-coding as moral indignation → ostracism-as-moralism. The 'envy-to-contempt-sublimation' candidate C2 above is the deferred specialized atom for the re-coding step."
critical-questions:
  - "what's the discrimination from generic-comparison-pain? Comparison can produce pain without being envy specifically; lex-xehnw claims envy is a particular form of comparison-pain — one that *targets the success* (wishes it removed, not just absent). Diagnostic: ask whether the comparing party would prefer (a) themselves to also have the good fortune or (b) the other party to lose it. (a) is wholesome admiration / emulation; (b) is envy-proper. The Schoeck/Bacon/Aristotle envy is structural-(b); generic-(a) is not in scope. The Squidward / SpongeBob distinction: Squidward doesn't want SpongeBob's joy for himself (he's contemptuous of it); he wants SpongeBob's joy GONE. That's the envy-signature lex-xehnw tracks."
  - "does the visibility-and-proximity criterion cover all envy, or are there exceptions? The atom does not claim universal coverage of all envy-instances. Counter-examples to consider: distant celebrity envy (Hollywood, royalty, sports stars) — these are visible but not proximate. Bacon explicitly handles this: 'kings are not envied, but by kings.' Most distant-celebrity 'envy' is admiration-mixed-with-resentment, not the full destructive-envy lex-xehnw tracks; OR the distance gets collapsed via parasocial-proximity (the celebrity is mentally placed in one's reference-class). Diagnostic: where envy-of-distant-figures occurs, ask whether the envier has parasocially-internalized the figure into their reference-class; if yes, lex-xehnw applies; if no, the phenomenon is a different one (resentment, schadenfreude, etc.)."
  - "what's the predicted equilibrium between display (lex-5kjya) and concealment (lex-xehnw)? In any given social context, both forces operate; the equilibrium depends on the envier's instrumental power. Where envier has reform-leverage that can change the structure (collective-action, democratic-vote, ostracism-vote, gossip-as-reputation-destruction), lex-xehnw's concealment-pressure dominates and protective-modesty norms emerge. Where envier lacks reform-leverage (stable hierarchy, weak collective-action capacity, no exit-of-the-envied possible), lex-5kjya's signaling-display dominates and conspicuous-consumption norms emerge. Diagnostic: assess envier-instrumental-power; predict which equilibrium prevails. Modern social-media: high gossip-leverage + moderate cancel-leverage → lex-xehnw pressure rising even for high-status actors (Marie-Antoinette-style libelles return as Twitter pile-ons)."
  - "is the protective-strategy menu (concealment, slow rise, eliciting pity, sacrifice-of-some-power) exhaustive or open? Bacon's catalog is the early-modern attempt at exhaustion; the strategies generalize but the contemporary menu may add forms Bacon could not see (digital-platform-mediated reputation-management, philanthropic-signaling as public-pity-elicitation at scale, deliberate self-deprecation in autobiography, transparency-as-pre-emption against expected accusation). Diagnostic: for any candidate protective-strategy, ask whether it reduces visibility-of-disparity or increases pity-elicitation or sacrifices-some-of-the-position; if any of those, it fits the lex-xehnw strategy-menu. The menu is structurally-bounded but instance-open."
  - "does the cross-tradition convergence (Aristotle + Plutarch + Bacon + Schoeck + cross-cultural amulets) ratify the claim, or could it be cultural-diffusion from one source? Aristotle is post-dated by Plutarch but pre-dated by the evil-eye amulet tradition (Ancient Egyptian and Mesopotamian instances >2000 BCE); cross-cultural amulet traditions in Sub-Saharan Africa, East Asia, and pre-Columbian Americas show independent invention without contact with the Mediterranean tradition (Schoeck 1966 documents these). Bacon is consciously aware of Aristotle and Plutarch but extends rather than just inheriting. The convergence is overdetermined — too many independent attestations for cultural-diffusion to account for. Substrate-quality signal: the pattern is topological, not parochial."
  - "what's the practitioner-actionable upshot? For individuals: where you are rising in a tight reference-class (your office, your subreddit, your subfield, your sibling group), expect Bacon-pressure and consider protective behaviors (visible-pity-elicitation, slow-rise, modesty, sacrifice-some-of-the-position-to-keep-the-rest, deflecting praise onto colleagues). The Veblenian alternative (conspicuous-success-display) is dangerous in tight reference-classes; safe only in distant-reference-class contexts. For institutions: design success-recognition mechanisms that distribute visibility (multiple winners, anonymous distribution) rather than concentrate it; or accept that any concentration will trigger envy-mediated counter-pressure. For diagnosis: when you observe a moralistic pile-on, ask whether the underlying motivation is envy re-coded as moral indignation (lex-xehnw + lex-2rsad composition); the diagnostic doesn't excuse the pile-on but explains its disproportion."
