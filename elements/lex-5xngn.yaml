id: lex-5xngn
name: a-composed-mask-arriving-after-a-leaked-reaction-cannot-undo-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone's first, involuntary reaction reveals something they didn't intend to show, a second, composed reaction that follows it does not erase the first -- it only adds proof that they now want to hide what was already seen. Douglass names this exactly on first meeting Vice-President Andrew Johnson: 'There are moments in the lives of most men, when the doors of their souls are open, and unconsciously to themselves, their true characters may be read by the observant eye. It was at such an instant I caught a glimpse of the real nature of this man... The first expression which came to his face, and which I think was the true index of his heart, was one of bitter contempt and aversion. Seeing that I observed him, he tried to assume a more friendly appearance; but it was too late; it was useless to close the door when all within had been seen. His first glance was the frown of the man, the second was the bland and sickly smile of the demagogue.' The mechanism turns on sequence and timing rather than on which reaction seems more convincing: a composed second reaction only works when the observer hasn't already seen what came before it, so once that condition fails, the attempted cover-up itself becomes a second, independent piece of evidence -- proof that concealment is now underway, layered on top of the first reaction rather than replacing it."
