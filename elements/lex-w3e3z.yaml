id: lex-w3e3z
name: forcing-the-end-via-prophecy-fulfilling-action
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a group acts to fulfill its own prophecy, the prophecy is producing the action — not the other way around. Forcing-the-end-via-action makes the prediction self-confirming; surface the action's causal role before treating the outcome as evidence."
