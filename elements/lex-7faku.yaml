id: lex-7faku
name: hoarded-competence-loses-value-that-only-circulation-releases
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "An organizational capability that sits idle inside one unit, hoarded rather than shared, doesn't just fail to grow — it loses value relative to the same capability actively circulating across the organization, because the return on a competence comes from applying it to new opportunities, and a competence nobody is applying to anything new is earning nothing on its stock. Prahalad and Hamel's 1990 analysis names the mechanism under the heading 'Imprisoned Resources,' and reaches for an explicit economic analogy to make the point: 'As an SBU evolves, it often develops unique competencies. Typically, the people who embody this competence are seen as the sole property of the business in which they grew up. The manager of another SBU who asks to borrow talented people is likely to get a cold rebuff. SBU managers are not only unwilling to lend their competence carriers but they may actually hide talent to prevent its redeployment in the pursuit of new opportunites [sic]. This may be compared to residents of an underdeveloped country hiding most of their cash under their mattresses. The benefits of competencies, like the benefits of the money supply, depend on the velocity of their circulation as well as on the size of the stock the company holds.' The mechanism generating the hoarding is itself rational from the hoarder's local perspective: a business-unit manager who lends out a skilled team gets no credit if another unit benefits, and risks losing the talent permanently, so the individually rational move is to keep skilled people underused inside the unit's own walls rather than risk lending them where the manager can't capture the return. The organization-wide cost is invisible from any single unit's vantage point — competence sits earning nothing, 'their skills begin to atrophy,' while the parts of the organization that could have used it never even learn it exists. Generalize beyond corporate SBUs: a research lab where each principal investigator hoards data and trained postdocs rather than sharing them across groups, so institutional knowledge stays siloed and duplicated rather than compounding; a hospital department that refuses to lend a specialist to a busier unit even when the specialist is underutilized, because departmental headcount is the metric that determines the department's own budget; an open-source maintainer sitting on deep expertise in a subsystem no one else is allowed to touch, so the knowledge dies with them instead of propagating. The diagnostic move: when evaluating an organization's capability, ask not just how much of a given competence it holds (the stock) but how freely that competence moves to wherever it's needed (the velocity) — and look specifically for local incentives (credit-capture, headcount-as-budget-signal, fear of losing talent) that make hoarding individually rational even when it's collectively wasteful."
