id: lex-mez7b
name: open-ended-restitution-is-redirected-toward-exit-not-gain-or-revenge
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'When a wrongdoer, wracked with guilt, offers the wronged party an unlimited boon as restitution, the wronged party''s choice of what to ask for reveals what they actually wanted all along — and it need not be material compensation or punishment. Asking only to be released from the relationship entirely treats the offer as an exit ticket rather than a payout, which both satisfies the ritual requirement that the offer be accepted and refuses to let the wrongdoer convert their guilt into an ongoing bond via gratitude or debt. In the Bhadda-sala-Jataka, King Pasenadi, remorseful over murdering Bandhula and his sons, seeks out the widow and grants her whatever boon she names; she asks for nothing but permission for herself and her thirty-two daughters-in-law to leave and return to their own family''s home.'
related: []
evokes: [jataka, dvadasanipata, bhadda-sala-jataka, exit-chosen-over-restitution, boon-converted-to-disengagement]
lineage:
  - source: primary
    text: jataka-chalmers1895-bhadda-sala-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 465, Bhadda-sala-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: '"My lord," said she, "you granted me a boon. I want nothing but this, that you permit my two-and-thirty daughters-in-law and me to go back to our own homes."'
canonical-instances:
  - 'A company offers a wrongfully terminated employee any settlement she wants after a public scandal, and she asks only for a clean, immediate release from her non-compete clause rather than a larger cash payout, choosing freedom to leave the industry entirely over money that would keep her financially tied to the company''s goodwill.'
critical-questions:
  - 'By asking only to leave rather than for material restitution, does the widow forfeit resources her thirty-two households will need going forward, or is severing the tie itself the more valuable asset given who''s offering it and why?'
status: active
