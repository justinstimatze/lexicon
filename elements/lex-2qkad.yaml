id: lex-2qkad
name: shared-structural-victimhood-enables-reconciliation-with-a-direct-wrongdoer
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Enough time passed, combined with a deliberate reframing of both parties as caught in the same system rather than as wrongdoer and wronged, can make reconciliation with a direct wrongdoer possible without denying the wrong itself happened. Visiting his dying former enslaver Thomas Auld decades after emancipation, Douglass writes: 'Our courses had been determined for us, not by us. We had both been flung, by powers that did not ask our consent, upon a mighty current of life, which we could neither resist nor control. By this current he was a master, and I a slave.' Auld, for his part, offers no defense of slavery itself, only an acknowledgment that Douglass's specific choice made sense given who Douglass was: 'Frederick, I always knew you were too smart to be a slave, and had I been in your place I should have done as you did.' Douglass's own summary names the mechanism directly: 'I regarded both of us as victims of a system.' Crucially, Douglass says elsewhere in the same account that his decades of public condemnation of slavery and of slaveholders generally still stand; this reframing works only at the scale of one now-elderly, dying man whose capacity to act at all has been suspended by time and mortality."
related: []
evokes: [our-courses-had-been-determined-for-us-not-by-us, flung-by-powers-that-did-not-ask-our-consent, victims-of-a-system, too-smart-to-be-a-slave]
