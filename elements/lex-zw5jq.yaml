id: lex-zw5jq
name: a-periods-name-can-pre-decide-that-nothing-important-happened-in-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a field labels a stretch of time or a category with a seemingly neutral, technical-sounding name, check whether that name has quietly pre-decided that nothing important happened there -- because evidence to the contrary will then get treated as an anomaly to explain away rather than a discovery to integrate. Graeber and Wengrow's case: archaeologists named a roughly 7,000-year span of North American prehistory 'the Archaic,' effectively declaring in advance that this was the period before anything worth studying occurred. When Poverty Point, Louisiana turned up squarely inside that period -- a monumental complex the size of an early Mesopotamian city, built by hunter-gatherers with no agriculture and no writing -- the response from specialists was lukewarm acceptance or outright avoidance, not a reassessment of the period's own name. No one refuted the findings; the label had simply already done the work of telling everyone this couldn't be where the interesting history lives. Whenever a name for a period, group, or category sounds purely descriptive, check whether it's actually carrying a verdict about significance that then filters what evidence gets taken seriously."
related: []
evokes: [david-graeber, david-wengrow, the-dawn-of-everything, poverty-point, archaic-period, periodization, jomon]
