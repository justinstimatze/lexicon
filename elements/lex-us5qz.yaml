lineage:
  - source: primary
    text: eastman-festival-little-people-wolf-and-bat-appointed-guardians
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Eleventh Evening: The Festival of the Little People.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'The Wolf was ordered to watch upon the surrounding hills, so that no enemy should come near; and the Owl was appointed to keep order within the camp... Unktomee could do nothing with his guests. The Toad began to devour the smaller creepers, the Snake attacked the Toad, and even the Wolf came down from his station on the hills to make a raid upon the helpless Little People... It is not wise to put the strong in authority over the weak.'"
canonical-instances:
  - "A company puts its sales team, whose compensation depends entirely on closing deals, in charge of approving refunds and resolving customer complaints, and finds that legitimate customer grievances get systematically minimized or dismissed -- not because any individual salesperson is dishonest, but because the role's own incentives are structurally opposed to the customers it's supposed to be fairly serving."
  - "A landlord appoints the property's largest, most demanding commercial tenant to mediate disputes between smaller tenants over shared resources like parking and loading docks, and the smaller tenants consistently lose those disputes, because the mediator's own interests are directly served by claiming more of the contested resource for itself."
critical-questions:
  - "how does an organizer actually identify structural misalignment in advance, when a candidate's capability and even good intentions can look identical to a well-aligned one until the actual conflict of interest is tested by opportunity?"
  - "is it always possible to find a genuinely well-aligned protector, or does this framework assume an available alternative exists when in practice the most capable candidates for a protective role often are the ones with the most potential conflict of interest?"
  - "does this pattern only apply to obvious predator-prey structures like the Wolf and the Little People, or does it generalize to subtler conflicts of interest that are much harder to name and check for before the appointment is made?"
