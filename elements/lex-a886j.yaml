id: lex-a886j
name: a-behavior-confound-controlled-by-denying-prior-access-tests-for-an-unobservable-property
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Schneider and Turner's AI Consciousness Test (ACT) targets a genuinely unobservable property -- whether an entity has subjective, felt experience -- by testing something entirely different: fluency with concepts that only make sense to a mind that already has such experience. Their reasoning: an entity with zero inner experience should find ideas like mind-body separation, reincarnation, or an afterlife as hard to genuinely engage with as \"someone who cannot hear\" would find it to \"fully appreciate the sound of a Bach concerto.\" So the test presents an AI with \"a series of increasingly demanding natural language interactions to see how readily it can grasp and use concepts based on the internal experiences we associate with consciousness,\" escalating from simple questions up to whether the AI spontaneously invents such concepts on its own, unprompted.

The design has one more move that does the real epistemic work: a confound-control against the obvious objection that a sufficiently capable system could just learn to fake fluent answers about consciousness from training data. Schneider's fix is \"boxing in\" the AI before testing it -- deny it internet access and withhold \"information about the world,\" especially anything touching consciousness, neuroscience, or philosophy of mind, before the test runs. A system that has never been given the relevant vocabulary or source material, and that nonetheless produces original, escalating, self-generated engagement with concepts that presuppose an inner life, has a form of evidence a system that was simply trained on human writing about consciousness would not have.

The transferable structure applies whenever the target is an internal property that cannot be observed directly -- a student's genuine understanding, a candidate's real expertise, a colleague's actual conviction, none of which show up on the surface the way a directly measurable trait would. Look for a proxy behavior a system lacking the property should find almost impossible to produce convincingly. The behavior has to specifically depend on possessing the property, not merely correlate with it. Then close the most obvious escape hatch (that the behavior was memorized or coached) by controlling what information the subject had access to beforehand, so that competent performance can only be explained by the property itself rather than by prior exposure to the right answers.

Schneider is explicit that ACT differs from the Turing test in exactly this respect: an ACT is unlike the Turing test, \"which was intended to bypass any need to know what was transpiring inside the\" mind \"of the machine. By contrast, an ACT is intended to do exactly the opposite: it seeks to reveal a subtle and elusive property of the machine's mind.\" The Turing test sets the inner-state question aside and substitutes an external behavioral proxy the field agrees to treat as decisive regardless of what's really happening inside. ACT keeps the inner-state question as the actual target and uses behavior only as indirect, confound-controlled evidence for it."
