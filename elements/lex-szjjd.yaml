canonical-instances:
  - "A sales org assumes reps with the highest closed-deal numbers will be the ones most willing to take on unglamorous, low-commission accounts without pushing them onto junior staff. Instead it's reps with high SELF-rated confidence in their own negotiating range — regardless of actual quota attainment — who take the accounts evenly, because the willingness tracks the rep's internal sense of 'I can handle any account,' not the scoreboard."
  - "A hospital credentialing committee trying to predict which newly-licensed physicians will treat all patient complaints with equal thoroughness rather than rushing the tedious ones finds board-exam score uninformative and a physician's own confidence-inventory across a checklist of specific clinical tasks far more predictive — confirming the operative variable is the physician's self-model, not the externally-certified competence level."
critical-questions:
  - "Martin explicitly leaves the divergence between self-judgment and grades unresolved, offering two live, untested explanations: that self-confidence and grades may simply be tapping different dimensions of performance, or that students apply different personal standards of excellence when judging themselves. Without knowing WHY the two diverge, is it safe to conclude self-perception is the more relevant lever, or could grades be measuring a genuinely different, also-relevant competence dimension this study's design cannot see?"
  - "If self-perceived competence is only weakly anchored to any external check (zero correlation with grades here), what stops the self-perception-to-neutrality relationship from being gameable — someone talking themselves into unwarranted confidence and thereby appearing 'more neutral' while actually being less equipped to handle the hard cases they now no longer avoid?"
status: active
