canonical-instances:
  - "A hacker who breaks into a system its owners called 'unhackable' doesn't just gain unauthorized access, they demonstrate publicly that the system's security was a defended claim rather than a proven fact, which is often more damaging to the owner's authority than whatever data was actually taken."
  - "A journalist who obtains and publishes documents an institution insisted could never leak doesn't just reveal the documents' contents, they reveal that the institution's aura of total control over its own information was maintained by specific, fallible security practices rather than by any inherent inviolability."
critical-questions:
  - "Does this reasoning risk justifying any successful theft or breach after the fact, on the grounds that success itself proves the target was 'only defended, not natural' -- is there a meaningful difference between exposing an unjust or arbitrary protection and simply overpowering a legitimate one?"
  - "Is 'contingent and arbitrary' actually established by the fact of a successful theft, or does Hyde's argument smuggle in a conclusion (that Apollo's ownership was illegitimate) that a successful act of force cannot, on its own, prove?"
  - "Are there possessions or boundaries whose defense really does track something more than raw enforcement (a body's boundary, a genuinely earned achievement), where this diagnostic move would wrongly delegitimize protection that isn't merely arbitrary guarding?"
