canonical-instances:
  - "The direct textual anchor: Douglass names Irish immigrants and free Black laborers as being funneled into direct competition for the same service occupations (barbers, waiters, coachmen), with the Irish taught that Black workers are the cause of their wage troubles rather than a labor market that offered both groups nothing better."
  - "Hypothetical: two immigrant communities competing for the same low-wage gig-delivery slots on an app blame each other for undercutting delivery rates, rather than the platform that structured its pay algorithm to keep both groups' earnings suppressed regardless of who takes the work."
critical-questions:
  - "Operationally distinct from lex-cxffc (active-measures-target-pre-existing-divisions-rather-than-creating-new-ones): that atom describes a deliberate state-actor disinformation operation amplifying a division that already existed in the target population. This atom describes hostility being taught into two groups that did not necessarily hold it beforehand (Douglass says the Irish 'readily sympathize with the oppressed everywhere' before arriving), and Douglass does not name a single orchestrating operator the way a disinformation campaign has one -- the teaching could be diffuse (employers, existing residents, cultural osmosis) rather than centrally directed. Does the mechanism require an identifiable beneficiary actively doing the teaching, or can it self-perpetuate once started, with no one currently benefiting enough to sustain it deliberately?"
  - "Who benefits from teaching this hostility, and does an identifiable beneficiary (an employer who profits from a divided, wage-suppressed workforce, for instance) need to exist for the mechanism to keep operating, or is diffuse cultural transmission -- with no one actively steering it -- sufficient on its own?"
  - "Douglass predicts the group that inherits the excluded position also inherits its degradation. Does this always hold, or can a group that displaces another from the bottom rung actually escape the degradation over time, even while the original structural scarcity remains unaddressed?"
