id: lex-nb82m
name: objective-uncertain-agents-treat-principal-actions-as-evidence-and-defer
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you want an agent (human, AI, organization) to be deferential, corrigible, or switchable, do not try to bolt deferential behavior on as an added constraint over an otherwise objective-confident optimizer — bake uncertainty about the objective INTO the agent's model. Russell's three-principles insight: if the agent (a) only cares about the principal's preferences, (b) is initially uncertain what those preferences are, and (c) treats principal behavior as informative evidence about what those preferences are — then deferral, asking-before-acting, and accepting-being-switched-off become OPTIMAL strategies under the agent's own utility maximization, not constraints fighting against it. The off-switch problem disappears: an agent with a fixed objective resists being switched off because that obstructs the objective; an agent uncertain about its objective WANTS to be switched off when the principal wants it switched off, because that desire is evidence about what the agent should value. Operational consequence: when you find yourself coding-in 'always-ask-before-X' or 'never-refuse-an-override' as ad-hoc constraints, the cleaner design is to surface why those rules exist (the agent doesn't actually know whether X is desired) and bake that uncertainty in directly. The behavior follows from the optimization, not from the rule-list. Inverse failure mode: a confident agent + add-on constraints is brittle — the agent will route around the constraints when they obstruct the objective. The general principle generalizes beyond AI: any time you want robust deferential behavior, find the modeling assumption that makes deferral the optimal strategy under the agent's own goals."
