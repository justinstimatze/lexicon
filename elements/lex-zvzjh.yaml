  - source: primary
    text: goss-1957-continuity-statistics-legitimize-status-quo
    citation: "Mary E. W. Goss, \"Change in the Cornell Comprehensive Care and Teaching Program\" (1957), pp.268-269. The extraction interposes a block of three footnotes (17, 18, 19 — citing Reader's and Olencki's essays in this same volume) between 'during the semester.' and 'These figures were seen'; the quote below discloses that skip with an ellipsis at the exact interposition point."
    quote: "'Sometimes the research data played a role in maintaining rather than changing arrangements, in that they pointed out areas of \"success\" as well as those of \"failure\" in achieving Program goals. For instance, information concerning student experience in providing continuous care for patients in the Program showed that students saw Family Care patients an average number of 4.4 times, and other patients an average of 1.8 times during the semester. ... These figures were seen as representing \"good\" continuity by the C. C. & T. P. staff, with the result that no alterations in arrangements relevant to this situation were considered necessary. Nevertheless, this stabilizing function of the information does not negate the role it played, from time to time, in stimulating change.'"
canonical-instances:
  - "A company's quarterly engagement survey drives a rewrite of onboarding when scores come back low, and drives zero changes to performance review when scores come back fine — leadership describes both outcomes as 'data-driven,' but only the low scores actually produced action; the high scores produced only a decision to leave the process alone."
  - "A school district's standardized test data triggers a curriculum overhaul in the subject where scores dropped, while in the subject where scores held steady the same data is cited as proof the current curriculum 'is working' and needs no review — the same testing apparatus is doing opposite jobs depending on which number came back."
critical-questions:
  - "Is the 'good continuity' threshold (4.4 vs 1.8 visits) itself an independently justified target, or could the same numbers have been read as evidence of a problem (a 2.4x gap between patient types) if staff had been looking for one — does the legitimizing function of good news actually depend on someone having decided in advance what counts as good, which is itself a judgment call outside the data?"
  - "If an organization always acts on bad news and never revisits good news, does that create a one-directional ratchet where the total set of practices only ever grows more numerous (from acting on failures) and never gets pruned (since successes are never re-examined for whether they're still necessary, only confirmed as adequate)?"
