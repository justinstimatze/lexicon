id: lex-dj4xm
name: sell-a-costly-to-develop-asset-to-someone-doomed-to-fail-then-reacquire-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you own an asset that would cost you heavily to develop yourself, don't assume your only options are developing it at your own expense or leaving it undeveloped -- Kautilya describes a third move: sell it to a buyer you can predict will fail at developing it, then buy it back once their failed effort has absorbed the cost and left whatever partial improvements survive. 'If settlement of a tract is likely to entail heavy losses or expenditure, a king shall first sell the land, with the intention of reacquiring it, to one who will fail in the attempt at settlement. Such agreements shall remain verbal.' The scheme only works if the buyer is chosen for a predictable, specific failure mode rather than picked at random, and Kautilya supplies a diagnostic checklist for exactly which kinds of buyers are reliably doomed: a weak king of royal blood will exhaust himself and his loyal subjects on the losses; a strong but non-royal king will be deserted by subjects unwilling to bear the costs for someone they don't feel bound to; an apathetic king will let the losses destroy him because he won't apply the effort needed even when he has the means; a king without genuine support among his people will burn through wealth to no lasting effect; and a fatalistic or purely wilful king will simply never do the work required to succeed. The instruction that the agreement 'remain verbal' is doing real work too -- a written, binding sale would either prevent the planned reacquisition or require a formal, visible reversal; an informal arrangement leaves the original owner free to step back in once the failure has run its course, on whatever terms the situation then allows. The core mechanism: transfer a costly development burden onto a party who will absorb the losses and can be predicted, in advance, not to succeed, then recover the underlying asset once someone else has paid the price of finding out exactly what does and doesn't work on it. Diagnostic move: when facing a costly-to-develop asset you're reluctant to invest in directly, consider whether a specific, predictable type of buyer exists who would take it on, fail in a foreseeable way, and leave you able to reacquire it later -- cheaper than developing it yourself and with someone else having already paid to learn which approaches don't work."
