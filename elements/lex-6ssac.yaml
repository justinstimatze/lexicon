id: lex-6ssac
name: stolen-credentials-grant-access-not-ability
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When someone acquires the outward signs of a capability -- the title, the equipment, the credentials, the reputation -- without acquiring the capability itself, expect the gap to surface at the exact moment they're actually required to perform, not before. In Zitkála-Šá's telling, Iktomi tricks the true avenger out of his magic arrow and his handsome buckskins, and struts off believing the theft alone has made him capable: 'I have the magic arrow! I have the beaded buckskins of the great avenger! I shall kill the red eagle; I shall wed the chieftain's beautiful daughter!' The stolen items get him everything the appearance of competence can buy -- an honored welcome, a seat of respect, the chieftain addressing him as a son-in-law-to-be -- right up until the actual red eagle appears and he has to shoot it. Then all his arrows miss, and rather than admit the truth, he reaches for the nearest external excuse: 'Ah! my blanket brushed my elbow and shifted the course of my arrow!' The credentials worked perfectly for gaining entry to the test; they contributed nothing to passing it, because the arrow's power and the buckskins' prestige were never where the actual skill lived -- the skill was the avenger's own, and it didn't transfer with his possessions. The blamed-blanket detail matters as much as the missed shots: someone who has faked their way to a real test rarely responds to failure by reconsidering whether they belong there, because doing so would require confronting the fraud itself -- so blame goes to the nearest external, deniable cause instead. Diagnostic move: when someone has acquired the outward markers of a capability through means other than developing the capability, don't judge whether the fraud will be caught by how convincing the markers are -- wait for the first moment they're actually required to perform under real conditions, since that's where the gap between appearance and substance becomes impossible to fake, and watch whether the response to failure is self-examination or a quick external excuse."
