lineage:
  - source: primary
    text: eyal-2014-hooked-how-to-build-habit-forming-products
    citation: "Nir Eyal with Ryan Hoover, Hooked: How to Build Habit-Forming Products (Portfolio/Penguin, 2014), Chapter 4 'Variable Reward.'"
    quote: "I propose that variable rewards come in three types: Tribe, hunt and self... In Mahalo's case, executives assumed that paying users would drive repeat engagement with the site. After all, people like money, right? Unfortunately, Mahalo had an incomplete understanding of its users' drivers. Ultimately, the company found that people did not want to use a Q&A site to make money. If the trigger was a desire for monetary rewards, the user was better off spending their time earning an hourly wage. And if the payouts were meant to take the form of a game, like a slot machine, then the rewards came far too infrequently and were too small to matter. However, Quora demonstrated that social rewards and the variable reinforcement of recognition from peers proved to be much more frequent and salient motivators. Quora instituted an upvoting system that reports user satisfaction with answers and provides a steady stream of social feedback. Quora's social rewards have proven more attractive than Mahalo's monetary rewards. Only by understanding what truly matters to users can a company correctly match the right variable reward to their intended behavior... Points, badges, and leaderboards can prove effective, but only if they scratch the user's itch. When there is a mismatch between the customer's problem and the company's assumed solution, no amount of gamification will help spur engagement. Likewise, if the user has no ongoing itch at all... gamification will fail because of a lack of inherent interest in the product or service offered... Variable rewards are not magic fairy dust that a product designer can sprinkle onto a product to make it instantly more attractive. Rewards must fit into the narrative of why the product is used and align with the user's internal triggers and motivations. (Eyal, Hooked, Ch.4 'Variable Reward.')"
canonical-instances:
  - "operationally distinct from lex-wgd7u learning-tracks-prediction-error-not-the-outcome-itself and lex-bx8hz variable-ratio-reinforcement-produces-the-most-persistent-behavior: both concern the TIMING/predictability axis of reward delivery (unexpected vs. predicted, schedule-predictability); this atom's claim is about the TYPE-matching axis (which of three reward categories — tribe/hunt/self — fits the underlying need) — an orthogonal dimension that composes with, rather than overlaps, the timing claims."
  - "A corporate wellness app offers cash rebates for hitting step-count goals and sees poor sustained engagement; a competing app offers no monetary reward but shows a leaderboard visible to the user's coworkers and achieves far higher retention -- the underlying driver for most users turns out to be social standing among peers (reward of the tribe), not the modest cash amount (reward of the hunt), even though the cash has objectively verifiable value and the leaderboard standing does not."
  - "An open-source project experiments with paying small bounties for accepted pull requests and finds contribution volume barely moves; switching to a public 'top contributors this month' badge and changelog credit produces a measurable increase, because most volunteer contributors are motivated by reputation within the community (tribe) and demonstrated mastery (self), not by payment sized well below market developer rates (a mismatched hunt-type reward at an inadequate magnitude for that type)."
  - "A language-learning app initially rewards daily practice with in-app currency redeemable for cosmetic app themes (a hunt-type reward users report finding unmotivating) and later adds a 'day streak' counter with visible mastery-level badges (self-type reward matching the underlying drive to feel competent at the skill) -- engagement rises specifically after the reward TYPE changes, with no change in how much practice time is required."
critical-questions:
  - "Doesn't this contradict the general finding that money is a powerful motivator -- is the atom claiming money never works? No -- the atom's claim is conditional on mismatch, not a claim that monetary rewards are categorically weak. Money is often exactly the right reward type when the underlying need genuinely is resource-acquisition (a referral bonus for a behavior driven by financial incentive works because the type matches). The Mahalo/Quora case is instructive precisely because it's a controlled-ish natural comparison on the SAME task (answering Q&A-site questions) where the underlying driver turned out to be social rather than financial -- the lesson is diagnose-the-driver-first, not money-never-works."
  - "How do you diagnose which reward type (tribe/hunt/self) actually matches a given behavior before running an expensive real-world test? Eyal's own preceding chapter (the Trigger chapter's persona and repeated-'why' user-research methodology) is the diagnostic tool -- identify the specific internal trigger or emotional itch the behavior is meant to relieve, then ask which of the three reward categories most directly addresses THAT itch, rather than assuming that whichever reward is cheapest or easiest for the designer to implement will suffice. This atom does not supply the diagnostic method itself; it supplies the claim that the diagnosis matters more than the reward's magnitude once you have it."
  - "Can multiple reward types be combined, or does matching require picking exactly one? Combination is common and often effective (Stack Overflow layers tribe-rewards -- upvotes, badges -- with self-rewards -- reputation-level mastery), but the atom's critical claim survives combination: a reward BUNDLE that includes a type mismatched to the core driver doesn't help, and a bundle that omits the type that actually matches the core driver will underperform regardless of how many other reward types are piled on. Combining rewards is not a substitute for correctly identifying the primary one."
