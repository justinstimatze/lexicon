id: lex-as5ug
name: securing-future-goodwill-with-access-about-to-be-revoked
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Someone who knows their access or position is about to be taken away can use the remaining window to secure future goodwill from others, before that access disappears — a steward about to be dismissed reduces several debtors' bills in his master's ledger, buying their favor for after he's out of the job. The move is praised in the narrative specifically for its shrewd foresight about a closing window, with an explicit separation from any endorsement of the method's honesty."
related: []
evokes: [kjv, the-unjust-steward, take-thy-bill-and-write-fifty, when-i-am-put-out-of-the-stewardship, wiser-in-their-generation-than-the-children-of-light]
lineage:
  - source: primary
    text: kjv-1611-luke-16-the-unjust-steward
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), Luke 16:3-4, 16:8. Verified verbatim against a direct extraction of the held copy."
    quote: "Then the steward said within himself, What shall I do? for my lord taketh away from me the stewardship: I cannot dig; to beg I am ashamed. I am resolved what to do, that, when I am put out of the stewardship, they may receive me into their houses. [...] And the lord commended the unjust steward, because he had done wisely: for the children of this world are in their generation wiser than the children of light."
canonical-instances:
  - "An executive who learns their role is being eliminated in the next reorg spends the final weeks connecting every junior report to their own external contacts and vouching for them personally to the incoming leadership — building goodwill they'll be able to draw on once their own official authority is gone."
critical-questions:
  - "Does the method used to secure this future goodwill cause real harm to the party whose resources are being used to build it — and does the shrewdness of the foresight actually excuse that, or is it being praised only for the tactic while ignoring who paid for it?"
status: active
