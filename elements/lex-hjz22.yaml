id: lex-hjz22
name: wanting-the-dead-to-return-is-the-same-category-error-as-craving-the-structurally-unattainable
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: 'A specific, obviously impossible craving (wanting sun and moon wheels) can be used to generalize a broader diagnostic claim: any desire for something structurally unattainable belongs to the same category of error, including the desire for a dead person to return, treating both as the identical mistake rather than treating loss-grief as a special, uniquely justified exception. In the Jataka''s tale of Matta-Kundali, the disguised deity presses exactly this equivalence: "None sees a ghost: then which is now more foolish in his wailing?"'
related: []
evokes: [jataka, dasanipata, matta-kundali-jataka, impossible-craving-diagnosis, impermanence-teaching-via-analogy]
lineage:
  - source: primary
    text: jataka-chalmers1895-matta-kundali-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book X (Dasanipata), No. 449, Matta-Kundali-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "None sees a ghost: then which is now more foolish in his wailing?"
canonical-instances:
  - "A hospice chaplain gently tells a family member wishing for one more conversation with a dying patient already unconscious that the wish belongs to the same category as wishing to reverse yesterday itself — not a lesser hope, but the identical kind of impossible request."
critical-questions:
  - "Is equating grief for the dead with craving a literally impossible object a genuinely useful reframe for the griever, or does it risk dismissing a categorically different kind of loss as merely one more instance of ordinary unmet desire?"
status: active
