id: lex-uhc3j
name: inalienable-possession-is-a-closed-grammatical-category-not-legal-ownership
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When analyzing how a language, a legal system, or ordinary reasoning about 'X belongs to Y' works, don't assume possession is one uniform category. Heine's cross-linguistic finding: languages that grammatically mark inalienability split possessed nouns into two structurally distinct sets — a CLOSED set (kin terms, body parts) taking tighter, more archaic, head-marked possessive morphology, versus an OPEN set (ordinary transferable objects) taking looser, dependent-marked morphology. The split tracks a cognitive distinction — is the possessed thing DEFINED BY its relationship to the possessor (a hand is only a hand as someone's hand; a mother is only a mother relative to a child), or is it a TRANSFERABLE OBJECT that happens to currently belong to someone — not legal ownership, which is a separate, later-layered social/institutional category that can attach to either kind."
related: [lex-6cvnf, lex-bgjaj]
evokes: [alienable-vs-inalienable, head-marking-vs-dependent-marking, kinship-and-body-part-terms, possession-as-cognitive-category]
lineage:
  - source: primary
    text: heine-1997-possession-ch3-inalienability
    citation: "Bernd Heine, Possession: Cognitive Sources, Forces, and Grammaticalization, Cambridge Studies in Linguistics 83 (Cambridge University Press, 1997), Chapter 3 'On attributive possession,' §3.4 'On inalienability,' pp.172-174, synthesizing primarily Nichols 1988 (Language 64(1)) and Nichols 1992 (Linguistic Diversity in Space and Time)."
    quote: "[p.172:] 'In chapter 1 we drew attention to the distinction between two salient kinds of possession, viz. alienable and inalienable possession, in short, to inalienability as a grammatical category. There are quite a number of languages, spoken in all major parts of the world, that mark such a category. This category tends to involve the following properties (see especially Nichols 1988; 1992:116ff.; Chappell and McGregor 1996b): (a) It is confined to attributive possession. (b) It is likely to be associated with a number of marking features. For example, alienable nouns can be described as being marked and inalienable ones as unmarked ... (c) Inalienable possession involves a tighter structural bond between possessee and possessor (Nichols 1992:117). (d) Possessive markers on inalienable nouns are more \"archaic\" ... (e) The nouns belonging to the inalienable category include kin terms, body-part terms, or both, usually also some other groups of nouns. (f) The inalienable category consists of a closed set of nouns, while alienability is an open-class category; its membership is described by Nichols (1988:562) as \"infinite\".' [p.173, quoting Nichols 1992:117 directly:] 'the inalienables take marking which is more nearly head-marking or less dependent-marking than the marking of alienables; inalienable possession is head-marking while alienable possession is dependent-marked.' [p.174:] 'there is no invariant semantic content to inalienability ... inalienable expressions are phonetically simpler and/or shorter than alienable ones ... inalienable possession tends to exhibit the more archaic morphology.'"
canonical-instances:
  - "Kin and body-part terms across unrelated language families consistently pattern as inalienable (closed-class, head-marked, structurally tighter) — 'my hand,' 'my mother' — versus ordinary objects patterning as alienable (open-class, dependent-marked) — 'my book,' 'my car' — the same split recurring across languages with no shared ancestry, which is what makes it a candidate cognitive universal rather than an accident of one language family."
  - "A legal system distinguishing property that can be seized, sold, or transferred (alienable, in the ordinary legal sense) from rights or relationships the law treats as non-transferable (parental rights, one's own body, certain inherited titles) unconsciously recapitulates the same closed/open split Heine documents grammatically — suggesting the cognitive category may be prior to, and partly generative of, the legal one, though the two are not identical (see lex-6cvnf for the legal-title-specific version of possession, which is about how alienable objects acquire an owner, not about the alienable/inalienable split itself)."
  - "A speaker of a language without grammaticalized inalienability (e.g., most of English) can still be shown to intuitively treat 'my hand' and 'my car' as different KINDS of possession in judgment tasks (e.g., 'can this be given away and still exist as itself?') even without the grammar marking it — suggesting the cognitive category can be present without surface grammatical marking, which is itself informative about the relationship between grammar and cognition."
critical-questions:
  - "is the alienable/inalienable split a genuine cognitive universal present in all humans regardless of their native language's grammar, or is it a grammaticalized-language-specific category that then shapes cognition in speakers of marking languages (a Whorfian question Heine's synthesis doesn't itself resolve)?"
  - "how does the closed inalienable set get its membership — is 'kin terms and body parts' a fixed universal list, or does it vary by culture in ways that would be diagnostic (e.g., do some cultures include tools, houses, or names in the inalienable set)?"
  - "how does this cognitive/grammatical category relate to the legal-property version of possession already in the substrate (lex-6cvnf first-effective-possession) — are they two independent categorization systems that happen to correlate, or does the grammatical category constrain what a legal system CAN treat as ownable in the first place?"
status: active
