evokes: [borges-1944-pierre-menard-author-of-the-quixote, cervantes-don-quixote-1605, history-as-the-mother-of-truth, the-author-function, reception-theory, horizon-of-expectations, gadamer-hermeneutic-circle, jauss-1970-reception-aesthetics, derrida-iterability, wittgenstein-meaning-as-use, austin-1955-how-to-do-things-with-words, searle-illocutionary-acts, performativity-of-context, intertextuality, recontextualization, palimpsest]
lineage:
  - source: primary
    text: borges-1944-pierre-menard-author-of-the-quixote
    citation: "Jorge Luis Borges, 'Pierre Menard, autor del Quijote' (orig. *Sur* no. 56, May 1939); collected in *Ficciones* (Buenos Aires: Sur, 1944), Part One *El jardín de senderos que se bifurcan*; English translation in *Ficciones* (New York: Grove Press, 1962), tr. Anthony Bonner, pp. 45-55. The story is structured as a literary obituary for an invented French symbolist who, rather than copy Don Quixote, undertook to BECOME the author of pages that would be 'word for word and line for line' identical to Cervantes' — and through twenty years of unrecorded private labor produced fragments of the ninth and thirty-eighth chapters and part of the twenty-second chapter. The substrate-load-bearing move is Borges's claim that those fragments — verbally identical to Cervantes — are nonetheless a DIFFERENT WORK because the context of authorial production (a 20th-century symbolist contemporary with William James and post-Nietzschean philosophy of history vs a 17th-century Spanish soldier-novelist), the historical position of the marks, and the rhetorical work the same sentence performs differently in the two contexts, are constitutive of the work's meaning. The narrator's verdict on the verbatim passage 'history, mother of truth, rival of time...' is the locus classicus: in Cervantes it is a rhetorical eulogy of history; in Menard, contemporary with pragmatism, the same sentence is 'audacious' philosophy."
    quote: "He did not want to compose another Don Quixote — which would be easy — but the Don Quixote. It is unnecessary to add that his aim was never to produce a mechanical transcription of the original; he did not propose to copy it. His admirable ambition was to produce pages which would coincide — word for word and line for line — with those of Miguel de Cervantes. [...] The text of Cervantes and that of Menard are verbally identical, but the second is almost infinitely richer. (More ambiguous, his detractors will say; but ambiguity is a richness.) [...] To compose the Don Quixote at the beginning of the seventeenth century was a reasonable, necessary and perhaps inevitable undertaking; at the beginning of the twentieth century it is almost impossible. It is not in vain that three hundred years have passed, charged with the most complex happenings — among them, to mention only one, that same Don Quixote. [On the canonical 'history, mother of truth' comparison:] Written in the seventeenth century, written by the 'ingenious layman' Cervantes, this enumeration is a mere rhetorical eulogy of history. Menard, on the other hand, writes: [verbatim Spanish identical to Cervantes]. History, the MOTHER of truth; the idea is astounding. Menard, a contemporary of William James, does not define history as an investigation of reality, but as its origin. Historical truth, for him, is not what took place; it is what we think took place."
  - source: cross-attestation
    text: gadamer-1960-truth-and-method-horizon-of-expectations
    citation: "Hans-Georg Gadamer, *Wahrheit und Methode* (Tübingen: J.C.B. Mohr, 1960); English: *Truth and Method*, tr. Joel Weinsheimer + Donald G. Marshall (New York: Continuum, 1989). Gadamer's hermeneutic-circle and his concept of *Wirkungsgeschichte* (history-of-effects) develop the philosophical apparatus behind Borges's literary point: understanding a text is not retrieval of an original-meaning fixed in the marks, but a fusion of horizons (*Horizontverschmelzung*) between the work's tradition-position and the reader's present situation. The text's meaning is in motion across its reception-history; the work is constituted by the history-of-its-effects, not by the marks alone. Borges's 1939 story prefigures Gadamer's 1960 systematization; the same structural insight."
  - source: cross-attestation
    text: jauss-1970-reception-aesthetics
    citation: "Hans Robert Jauss, *Literaturgeschichte als Provokation der Literaturwissenschaft* (Konstanz: Universitätsverlag, 1967; expanded 1970); English in *Toward an Aesthetic of Reception*, tr. Timothy Bahti (Minneapolis: University of Minnesota Press, 1982). Jauss's 'horizon of expectations' (*Erwartungshorizont*) reframes literary history as the history of reception: a text's meaning is constituted by the system of expectations the reading-public brings to it, and the same text encountered against different horizons is a different aesthetic object. Jauss explicitly invokes Borges's Pierre Menard as a prefiguration of the reception-aesthetic move."
  - source: cross-attestation
    text: wittgenstein-1953-meaning-as-use
    citation: "Ludwig Wittgenstein, *Philosophische Untersuchungen* (Oxford: Blackwell, 1953), §§43, 138-142. Wittgenstein's §43 maxim establishes that meaning is constituted by use in a language-game, not by an inner reference or by a mental act attached to the marks. The Pierre Menard claim is the use-theory of meaning specialized to identical-marks-different-context: the same orthographic sequence is used differently within the language-game of 17th-c Spanish romance vs the language-game of 20th-c symbolist literary modernism; therefore the meaning differs even when the marks coincide."
    quote: "[§43, in Anscombe's translation:] 'For a large class of cases—though not for all—in which we employ the word “meaning” it can be defined thus: the meaning of a word is its use in the language.' [Read from the bilingual Blackwell edition in the corpus. Its scan interleaves the facing German column, so the English runs out of order in the text layer and was reassembled against the page image; no words were supplied.]"
  - source: cross-attestation
    text: derrida-1971-signature-event-context
    citation: "Jacques Derrida, 'Signature Événement Contexte' (1971), in *Marges de la philosophie* (Paris: Minuit, 1972), 365-393; English: 'Signature Event Context,' in *Limited Inc*, tr. Samuel Weber + Jeffrey Mehlman (Evanston: Northwestern University Press, 1988), 1-23. Derrida's concept of *iterability* — that a sign is constitutively repeatable across new contexts, and that each repetition both depends on a structural sameness and produces a difference — formalizes the Borges-Menard move into a general theory of writing. The 'iter' of iterability marks both repetition (sameness) and otherness (difference); every recitation, citation, copy is a new event-of-the-sign, not a return to a fixed origin. Derrida's polemic against Searle (the 'Limited Inc' debate) defends precisely this point against the speech-act tradition's tendency to anchor meaning in a determinate context-of-utterance."
  - source: cross-attestation
    text: barthes-1968-death-of-the-author
    citation: "Roland Barthes, 'La mort de l'auteur' (*Aspen* no. 5-6, 1967; reprinted in *Manteia* V, 1968); English in *Image-Music-Text*, tr. Stephen Heath (New York: Hill + Wang, 1977), 142-148. Barthes's polemic locates the work's meaning in the reader's situation of decoding rather than in the author's biographical intention. The Pierre Menard story, written 25 years before Barthes's essay, makes the same point by other means: Menard's text and Cervantes's text differ because the authorial-cultural position is different, but Borges's narrator suggests that the work-as-read is constituted by the position from which one reads — Menard's 'audacious' reading is enabled by the reader's knowledge of post-Cervantine history. Foucault's 'What is an Author?' (1969) extends this with the *author-function* concept."
  - source: cross-attestation
    text: austin-1955-illocutionary-force
    citation: "J.L. Austin, *How to Do Things with Words* (Cambridge MA: Harvard University Press, 1962, posthumous; Harvard William James Lectures 1955). Austin's distinction between *locutionary* (the marks/words spoken), *illocutionary* (the act performed by saying it, e.g., promising, warning, asserting), and *perlocutionary* (the effect produced) gives a structural account of why identical marks can constitute different acts. 'I do' as marriage-vow vs as recitation in a wedding rehearsal share the locution but differ in illocutionary force; the felicity-conditions for the illocutionary act ARE constitutive of which act is performed. The Borges-Menard move applied to speech-acts: same locution, different illocutionary context, different act."
  - source: cross-attestation
    text: foucault-1969-author-function
    citation: "Michel Foucault, 'Qu'est-ce qu'un auteur?' (lecture 22 February 1969, Société française de philosophie); English in *Aesthetics, Method, and Epistemology* (Essential Works Vol.2), ed. James D. Faubion, tr. Robert Hurley et al. (New York: New Press, 1998), 205-222. Foucault's *author-function* — the cultural-historical construction whereby a name attached to a body of writing functions as a principle of unity, attribution, and exclusion — formalizes why 'Cervantes wrote X' and 'Menard wrote X' for the same X are different historical events. The author-function is itself a historical product, not a fixed feature; texts function differently within different author-function regimes. Foucault's text presents Pierre Menard as one of the classical instances."
  - source: cross-attestation
    text: bakhtin-1929-dialogism-and-double-voicing
    citation: "Mikhail Bakhtin, *Problems of Dostoevsky's Poetics* (orig. *Problemy tvorchestva Dostoevskogo* 1929; rev. 1963), tr. Caryl Emerson (Minneapolis: University of Minnesota Press, 1984); also *The Dialogic Imagination*, tr. Caryl Emerson + Michael Holquist (Austin: University of Texas Press, 1981). Bakhtin's concepts of *double-voiced discourse* and *heteroglossia* show how the same utterance can simultaneously carry multiple voices and orientations because every word arrives loaded with its prior contexts of use. Stylization, parody, and citation are not mere references to other speech but performative re-orientations of context. Bakhtin's framework provides the linguistic-stylistic apparatus behind the Borges-Menard claim: every utterance is already context-laden, and recontextualization produces semantic difference."
  - source: cross-attestation
    text: collingwood-1946-history-of-questions
    citation: "R.G. Collingwood, *The Idea of History* (Oxford: Oxford University Press, 1946, posthumous; lectures 1936-39). Collingwood's logic-of-question-and-answer: a proposition is answer to a specific question, and the same proposition asserted as answer to a different question is a different historical act. 'History is the mother of truth' answers different questions in 1602 vs 1934. Collingwood's framework runs parallel to and slightly preceding Gadamer's, and shares the structural insight Borges dramatized in 1939."
canonical-instances:
  - "Borges 1944 'Pierre Menard, autor del Quijote': the narrator's essential comparison treats Cervantes's 'la verdad, cuya madre es la historia, émula del tiempo, depósito de las acciones, testigo de lo pasado, ejemplo y aviso de lo presente, advertencia de lo por venir' (Don Quixote I.IX) as a routine rhetorical eulogy of history when written by a 17th-c Spaniard, but 'astounding' when written verbatim by Menard contemporary with William James — because in Menard's hand history-as-mother-of-truth becomes a pragmatist claim about historical-truth-as-origin-of-reality, not investigation of it. The same orthography, two different works."
  - "Jorge Luis Borges himself in interviews insisted Pierre Menard was a serious philosophical statement, not a stylistic exercise: 'a sort of allegory of the role of the reader' (quoted in Burgin, *Conversations with Jorge Luis Borges*, 1969). Borges read the story as a thesis about the constitutive role of the reading-situation in literary meaning."
  - "Code-archaeology in software engineering: the same function-body, identical line-for-line, in two different repositories at two different times means different things. The 1998 commit of a now-canonical sort implementation by a then-unknown engineer is a different artifact than the same code-block re-pasted from a textbook into a 2026 PR — context of authorship, surrounding test-coverage, the doctrinal surround of code-review norms, and the in-flight feature work are constitutive."
  - "Coltrane's 1961 recording of 'My Favorite Things' uses the Rodgers-Hammerstein melody (1959 *The Sound of Music*) note-for-note in the head, but the work IS different because the harmonic context of modal jazz, the soprano-saxophone instrumentation, the 13-minute development, and the post-bop tradition of repurposed standards are constitutive. A note-for-note transcription is not a reproduction."
  - "Quotation extracted into a new context: a verbatim citation of a 1920 sociology passage in a 2026 paper is not the same utterance even when the quoted words are identical. The act-of-citing carries argumentative work the original act-of-asserting did not; the surrounding scholarly apparatus and the cited author's reputation-trajectory in 2026 are constitutive of what the quotation means in its new home."
  - "Adaptations: Apocalypse Now is not a 'film of' Heart of Darkness; the substrate-claim is exactly that a faithful translation into a different medium and historical moment IS a different work, not because it 'fails' fidelity but because fidelity to marks is not the same as identity of work. Same for translations of Don Quixote into English, into modern Spanish, into film, into novel-rewritings — each is a new work."
  - "AI training-corpus identity: the same document tokenized into a 2018 GPT-2 training set vs a 2026 frontier-model training set is different training data because the surrounding co-occurrence statistics, the prompt-format conventions, the RLHF audit downstream, and the human-feedback regime are constitutive of how the document functions as training. Identity-of-bytes is not identity-of-corpus-element."
  - "Brand-utterance vs re-issue: a corporate boilerplate from 2010 re-issued verbatim in 2026 is a different utterance — the discourse-context (post-2016 polarization, post-2020 ESG framing, post-2023 AI-ethics surround) constitutes the meaning of what is said. The re-issue IS a new act, correctly judged as such."
  - "Legal precedent re-cited: the holding of *Brown v. Board* (1954) cited in a 1972 desegregation brief vs in a 2025 affirmative-action brief is functionally a different argumentative move; the doctrinal surround changed even when the holding's words did not. The citation is the act, not the text."
  - "Science replication: 'the same experiment' run a generation later with different instrumentation, ambient theory, and population is not pure replication; the run is constituted by its context. Composes with lex-b6kvs randomization-controls-for-unknown-confounders-that-no-other-design-can-address + lex-3d2he classification-gaps-generate-falsifiable-existence-predictions: the work of replication includes the constitutive context, not just the protocol."
  - "operationally distinct from lex-7aqqb framing-of-question-fixes-ontology-of-inference: lex-7aqqb is about how the QUESTION framing changes which categories are countable in inference; lex-6xw55 is about how the CONTEXT of utterance constitutes meaning even when the question-framing is unchanged. The Menard case has identical question-framing and identical answers; the difference is contextual, not framing."
  - "operationally distinct from lex-sp7fa every-framing-highlights-some-aspects: lex-sp7fa is the general claim that any framing is lossy and selective; lex-6xw55 is the specific claim that context-of-utterance is constitutive of meaning for identical marks. They compose: a framing is lossy AND the framing+marks together constitute the work."
  - "operationally distinct from lex-jud2d metonymy-makes-the-substituted-aspect-feel-literal-and-hides-the-rest: lex-jud2d is the substitution of a part-aspect for a whole-aspect within a single utterance. lex-6xw55 is about identical utterances in different contexts. The mechanisms are unrelated."
  - "operationally distinct from lex-y2tbg essence-as-effect-of-ritualized-repetition (Butler performativity): lex-y2tbg is about how repeated PERFORMANCE constitutes an apparent essence (gender, identity). lex-6xw55 is about how identical SIGNS in different CONTEXTS constitute different works. The performativity tradition + the context-of-utterance tradition share root commitments (Austin) but specialize differently."
  - "operationally distinct from lex-3656j social-construction (Berger-Luckmann institutional production): lex-3656j is the broad institutional-production cycle by which categories become taken-for-granted. lex-6xw55 is the localized semantic claim that any individual utterance's meaning includes its context-of-utterance. They compose at the level of institutional reception: socially-constructed reception-contexts (lex-3656j) are part of the context that constitutes meaning (lex-6xw55)."
critical-questions:
  - "When two utterances/texts/code-blocks appear identical, what is the context of utterance doing in each case? List role-relations, doctrinal surround, historical position, institutional embedding, and audience uptake. If any of these differ materially, the works differ."
  - "Is the atom being misused to claim that no two texts can ever be the same, or that meaning is unrecoverable? No. The atom is a CONTEXT-SENSITIVITY claim, not a relativism claim: meaning is constituted by marks-plus-context, and where the context is sufficiently shared (institutional regularities, conserved language-game, conserved reception-horizon) two utterances of the same marks can be the same work. The atom names the structural role of context, not its arbitrary variability."
  - "Could the atom be misused to defend bad-faith recontextualization (e.g., quoting out of context, decontextualized AI training)? Yes, and this is a known failure mode. The atom is descriptive of the structural role of context — it does not justify any particular recontextualization. The corollary ethical claim is: because context is constitutive, recontextualization is an act with its own felicity-conditions and accountability, NOT a neutral copying. Quoting out of context is not 'just' quoting; it is a new utterance whose author is responsible for the work it does."
  - "Does the atom imply that we can never read a historical text as its original audience did? Carefully — the atom implies that perfect recovery of the original work is structurally impossible (we cannot reconstruct the full context of utterance), but it does not imply that historical scholarship is futile. The discipline of intellectual history, philology, reception-history, and contextual hermeneutics aims at characterizing the original context as best we can — partial recovery is the achievable target. Anachronistic reading + contextual reading are not mutually exclusive; the second is a discipline ON the first."
  - "How does the atom apply when the context-of-utterance itself is contested? Often the contestation IS the question — competing readings of a canonical text (Quran exegesis schools, Shakespeare editions, founding-document jurisprudence) are contests over which context is the constitutive one. The atom does not adjudicate the contest but names the structure of what is being contested."
  - "Is the boundary between 'same work' and 'different work' sharp? No — the atom names a SPECTRUM of context-shift severity. A re-print with identical typesetting is closer-to-same-work than a re-issued corporate statement is closer-to-same-work than a Menard rewrite. The transferable move is the diagnostic question 'how much of the work was carried by the marks vs by the context?', not a binary classification."
severity-tier: warning
