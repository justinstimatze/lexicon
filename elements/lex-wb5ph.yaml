id: lex-wb5ph
name: borrowed-lab-vocabulary-keeps-rigors-glow-loses-rigors-constraint
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a technical term migrates from a controlled setting, where it has a precise meaning because it's pinned to a lawful, reproducible relationship, into a much broader domain by way of loose metaphor, check whether the term brought its constraint along or only its reputation. Chomsky's diagnosis of Skinner's Verbal Behavior names the exact failure: 'stimulus,' 'response,' and 'reinforcement' are defined narrowly in the bar-pressing lab, where a stimulus counts as such only if it's lawfully, reproducibly tied to a response. Stretched to cover ordinary speech, the same words get applied to anything at all after the fact -- any object has as many 'controlling properties' as there are words to name it, so any response can be said to be 'under the control of' whichever property matches the word actually spoken. The words never stopped sounding like laboratory science; they simply stopped doing any of the work that made them scientific in the lab. Run a two-reading test on any claim like this: read the borrowed term in its original, narrow, technical sense, and check how much of the target domain it actually covers -- usually almost none. Then read it in the loose, metaphorical sense actually being used, and check whether it says anything more than the ordinary word it's replacing -- usually nothing. A theory that looks rigorous AND broad is usually trading between these two readings without committing to either: citing lab evidence to claim rigor, then citing the metaphor's reach to claim scope, never pinned down long enough for either claim to be checked against the other."
related: [lex-9c67q, lex-vmas8, lex-2s3ze, lex-fzd6w]
evokes: [chomsky-1959-skinner-review, verbal-behavior-critique, functional-analysis-vacuity, stimulus-control-is-empty, physics-envy, borrowed-scientific-vocabulary]
lineage:
  - source: primary
    text: chomsky-1959-review-of-skinners-verbal-behavior
    citation: "Noam Chomsky, 'A Review of B. F. Skinner's Verbal Behavior,' Language 35(1):26-58 (1959), Sections 2-3 on Skinner's use of stimulus, response, control, and reinforcement. Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "'He utilizes the experimental results as evidence for the scientific character of his system of behavior, and analogic guesses (formulated in terms of a metaphoric extension of the technical vocabulary of the laboratory) as evidence for its scope. This creates the illusion of a rigorous scientific theory with a very broad scope, although in fact the terms used in the description of real-life and of laboratory behavior may be mere homonyms, with at most a vague similarity of meaning.' [Chomsky's summary verdict, after working through the individual terms:] 'The way in which these terms are brought to bear on the actual data indicates that we must interpret them as mere paraphrases for the popular vocabulary commonly used to describe behavior and as having no particular connection with the homonymous expressions used in the description of laboratory experiments.'"
canonical-instances:
  - "Chomsky's own worked case: 'The phrase \"X is reinforced by Y (stimulus, state of affairs, event, etc.)\" is being used as a cover term for \"X wants Y,\" \"X likes Y,\" \"X wishes that Y were the case,\" etc. Invoking the term reinforcement has no explanatory force, and any idea that this paraphrase introduces any new clarity or objectivity into the description of wishing, liking, etc., is a serious delusion.'"
  - "Hypothetical: a management consultancy borrows 'entropy' from thermodynamics to describe organizational disorder, complete with a formula for computing a team's 'entropy score.' Pressed on the formula's derivation, nobody can say what physical quantity in the team corresponds to temperature or energy; pressed on whether the score predicts anything beyond a re-labeling of 'well-organized,' the consultancy has nothing further to offer."
  - "operationally distinct from lex-2s3ze equivocation-shifts-a-words-sense-across-an-argument: equivocation is a single argument sliding between two senses of a word within its own steps. This atom is broader and more structural -- an entire descriptive system built by systematically reading its key terms in whichever sense (narrow-technical or loose-metaphorical) makes the current claim easiest to defend, sustained across a whole body of work rather than one slippery inference."
critical-questions:
  - "is there a principled way to tell, before running the two-reading test, whether a borrowed term has actually kept enough of its original constraint to be worth the metaphor -- or does the test only ever get applied after someone already suspects vacuity, making it a confirmation tool rather than a genuine detector?"
  - "some successful science does generalize a term from a narrow origin to a broader domain and keep real content (mass, applied first to falling bodies and later to planets, kept its predictive bite) -- what distinguishes that case from Skinner's, beyond simply checking whether the later predictions come true?"
status: active
