id: lex-phx4m
name: internal-division-undermines-stability-regardless-of-external-pressure
type-in: state
type-out: claim
_tier: atomic
agent-instruction: "An entity that turns against itself internally can't stand, independent of any external threat — a kingdom divided against itself, or a house divided against itself, falls from the division alone. This means an entity facing no outside pressure at all can still collapse purely from internal fracture, and conversely, an entity under heavy external pressure but internally unified has a structural advantage no outside force can easily replicate."
related: []
evokes: [kjv, a-house-divided-against-itself, a-kingdom-divided-cannot-stand, satan-casting-out-satan, collapse-from-within]
lineage:
  - source: primary
    text: kjv-1611-mark-3-house-divided
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), Mark 3:24-25. Verified verbatim against a direct extraction of the held copy."
    quote: "And if a kingdom be divided against itself, that kingdom cannot stand. And if a house be divided against itself, that house cannot stand."
canonical-instances:
  - "A well-funded startup with no serious competitor still fails within a year because its two co-founders are locked in a power struggle that paralyzes every product decision — the market never had to lay a finger on it."
critical-questions:
  - "Is the internal division here the actual cause of the instability, or is it a symptom of a deeper structural problem that would have caused collapse even with unity restored?"
status: active
