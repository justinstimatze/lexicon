id: lex-tb3re
name: a-measure-pushed-as-a-target-ceases-to-be-a-good-measure
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When pushing a measure as a target, expect the measure to degrade. Goodhart: optimizing for the proxy detaches it from what it was supposed to indicate. Don't punish on the metric; use the metric as ONE input among many, none of them critical alone."
related: [lex-29fvm, lex-4ckek, lex-4d53x, lex-5yufs, lex-643m7, lex-652hb, lex-66s4q, lex-6gy96, lex-8njgg, lex-agefm, lex-b97zn, lex-cqvnu, lex-cwmus, lex-eqy5r, lex-ewafs, lex-ghtr8, lex-h5av3, lex-hbknh, lex-hr5h5, lex-jmm5b, lex-kh8gf, lex-m4ztd, lex-n365w, lex-n5cf6, lex-nbk6e, lex-nr3kg, lex-peqcm, lex-prwfm, lex-qjsgk, lex-spm8x, lex-wdnmm, lex-y5jm9, lex-yhtvk, lex-yuduw, lex-yyfx5, lex-z68kz, lex-zfssj, lex-zpfv9]
scaffolds-from: [lex-4ckek, lex-cqvnu, lex-nr3kg, lex-spm8x]
evokes: [goodharts-law, when-a-measure-becomes-a-target, metric-validity-collapse, teaching-to-the-test, strathern-1997, the-measure-stops-tracking-what-it-tracked]
lineage:
  - source: primary
    text: goodhart-1984-1989-money-information-uncertainty
    citation: "Charles Goodhart, *Money, Information and Uncertainty* (Macmillan 1989; 2nd ed of work originally drawing on his 1975 conference paper). The canonical wording of the law was authored by Goodhart himself in *Monetary Theory and Practice: The UK Experience* (Macmillan 1984), Ch.III p.96, as quoted within the 1989 collection: 'any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes.' The 1989 work cites this Ch.III p.96 wording in two places: as a chapter footnote glossing illustrations from the 1980s monetary-aggregates collapse, and as a footnote in Ch.15 calling the law 'a mixture of the Lucas Critique and Murphy's Law.' The 1989 attribution-to-1984-p.96 fixes the canonical citation; subsequent generalisations (Strathern 1997 'Improving ratings: audit in the British University system,' European Review 5(3):305-321 — 'When a measure becomes a target, it ceases to be a good measure') are paraphrases of Goodhart's monetary-policy original. The substrate-claim, separated from its perverse-consequence cousin (lex-prwfm cobra-effect): the failure here is EPISTEMIC, not behavioural. A measure is good when it correlates with an underlying property you cannot observe directly (a proxy). The moment the measure is made the object of optimisation, the correlation it relied on is selected against — agents move probability mass to the cheapest ways of raising the measure, which are precisely the ways that do NOT raise the underlying property. So the measure stops carrying information about the thing it proxied: it ceases to be a good MEASURE. (lex-prwfm names the downstream harm — the perverse outcome that can swamp the intended gain; lex-tb3re names the upstream validity-collapse — the metric simply stops meaning what it meant.) Distinctness affirmed by user 2026-05-29: Goodhart is about whether the metric remains useful; cobra-effect is about the consequences."
    quote: "[Goodhart 1984 *Monetary Theory and Practice* Ch.III p.96, quoted verbatim in Goodhart 1989 *Money, Information and Uncertainty*:] 'any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes.' [Goodhart 1989, glossing his own law in Ch.15:] Goodhart's Law... 'is a mixture of the Lucas Critique and Murphy's Law.' [Strathern 1997, the canonical generalisation paraphrase:] 'When a measure becomes a target, it ceases to be a good measure.'"
canonical-instances:
  - "exam pass-rates as a proxy for learning: a test score correlates with mastery until the score becomes the target (funding, ranking, promotion pegged to it). Then teaching-to-the-test, narrowed curricula, and easier exams raise the score while mastery stalls. The score no longer measures learning — it measures test-optimisation effort. The proxy survives; its validity does not"
  - "ML reward hacking / proxy objectives: a model trained to maximise a proxy reward (clicks, watch-time, a hand-written loss) finds inputs that score high on the proxy while failing the intended objective (engagement-bait, degenerate solutions). Same shape — the optimised measure decouples from the target it stood in for; the alignment literature treats this as Goodhart's law and distinguishes regressional, extremal, and causal variants"
  - "Soviet output quotas (a nail factory rated by weight produces one giant useless nail; rated by count, millions of tiny tacks): the planner's metric, once made the target, is satisfied while the underlying goal (useful nails) is abandoned. The classic worked example of metric-validity-collapse under optimisation pressure"
  - "operationally distinct from lex-prwfm cobra-effect (a distinction drawn in review): lex-prwfm is about CONSEQUENCES — an incentive produces a counter-effect that can swamp or reverse the intended gain (bred cobras yield more cobras). lex-tb3re is about MEASUREMENT VALIDITY — the metric stops tracking what it tracked, independent of whether the net outcome is catastrophic. A measure can go Goodhart (lose validity) while net outcomes are merely flat; a cobra-effect can fire through incentives that involve no measurement at all. They co-occur but name different failures: epistemic (0390) vs consequential (0197)"
  - "operationally distinct from lex-5yufs form-persists-when-content-dissolves and lex-ewafs wish-with-loophole: lex-5yufs is the resulting STATE (the measurement-form keeps running while its content has evacuated); lex-ewafs is the proxy-gaming MECHANISM in wish/specification form (you get exactly what you specified, not what you wanted). lex-tb3re is the specific claim about MEASURES used as targets — the bridge that turns a wish-with-loophole (0165) into a persistent hollow form (0124). lex-spm8x: a control loop is only as valid as its sensor; Goodhart is what happens when the sensed proxy is also the optimisation target"
  - "xkcd 2899 'Goodhart's Law' (2024-04-12): White Hat hears Cueball state Goodhart's Law and immediately proposes a bonus for whoever identifies a metric that has become a target — instantly metric-as-target re-encoding the law. Title text caps it with 'metric changes per hour' becoming the new optimised target. The comic's casual operationalisation of the law as a META-Goodhart shows how the failure mode is recursive: any defence against Goodhart that itself relies on a measurable target falls under the same critique. The explainxkcd entry pairs this with the cobra-effect anecdote (lex-prwfm) as the canonical perverse-incentive cousin"
critical-questions:
  - "is this number being USED to judge or steer, or only to observe? A measure read passively (diagnostic, dashboard) keeps its validity; a measure wired to consequences (pay, ranking, funding, a loss function) is under optimisation pressure and will start to decay. First ask whether the metric has become a target at all"
  - "what is the measure a proxy FOR, and what are the cheapest ways to move the measure WITHOUT moving that underlying thing? Enumerate the gaming paths before deploying — they are usually predictable in form even when the specific exploit is novel. If the cheap paths don't advance the real goal, the measure will Goodhart"
  - "can you keep the target metric and the evaluation metric separate? A standard defence is to optimise one measure but audit against a different, harder-to-game (or held-out) measure the agents can't see. If the two diverge over time, that divergence is the Goodhart signature and a signal to rotate or retire the target"
  - "is a single scalar carrying too much weight? Goodhart bites hardest on one-dimensional targets. Multiple, partially-conflicting measures (or qualitative review alongside the number) raise the cost of gaming because no single cheap exploit satisfies all of them at once"
status: active
