id: lex-nmh7s
name: two-unprompted-independent-dreams-converge-on-identical-content
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Two people separated by great distance, with no possible contact between them, can each independently experience a private dream containing the same unusual, specific content -- and the match surfaces only when they compare accounts after being reunited, neither having primed the other beforehand. Black Elk withholds his own cloud-vision from everyone through his return to Pine Ridge. He discloses it only after his mother volunteers, unprompted, a dream of her own: 'My mother told me she had dreamed one night in her sleep that I had come back on a cloud, but could not stay. So I told her about my vision.' The specific, unlikely match -- a cloud, a return, an inability to stay -- is what draws the disclosure out of him rather than the reverse."
related: []
evokes: [black-elk-speaks, the-spirit-journey, i-had-come-back-on-a-cloud, but-could-not-stay, so-i-told-her-about-my-vision]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch20-spirit-journey
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 20, 'The Spirit Journey.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "My parents were in great joy to see me and my mother cried because she was so happy. I cried too. I was supposed to be a man now, but the tears came out anyway. My mother told me she had dreamed one night in her sleep that I had come back on a cloud, but could not stay. So I told her about my vision."
canonical-instances:
  - "Two estranged siblings, reunited after years with no contact, discover each had a recurring dream about the same childhood house burning down, neither having mentioned it to anyone else beforehand."
  - "A ship's captain lost at sea and his spouse waiting ashore later compare notes and find they each dreamed, on the same night, of one unusual detail -- a specific lighthouse neither had ever described to the other."
  - "Two research collaborators working for months in separate labs with no contact each independently arrive at the same unusual hypothesis, discovering the coincidence only once they finally reconnect and compare notebooks."
critical-questions:
  - "Dreams about a missing loved one's return would hardly be rare after a nearly three-year absence. The open question is whether 'a cloud, could not stay' is unusual enough to rule out coincidence, or ordinary enough dream-imagery that some kind of match was bound to turn up eventually."
  - "Is the account reconstructed after the fact, with the mother's memory of her own dream shaped, consciously or not, once she hears the specific content of her son's vision -- rather than genuinely fixed beforehand?"
  - "Is there any way, in a story retold years later, to confirm which account came first and that neither version was quietly adjusted to fit the other once the two were compared?"
status: active
