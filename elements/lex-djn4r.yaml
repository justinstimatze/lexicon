id: lex-djn4r
name: feigned-weakness-lures-a-pursuing-enemy-into-a-pincer
type-in: process
type-out: process
_tier: atomic
agent-instruction: "A garrison or defender can invite a stronger attacker into a trap by deliberately performing weakness in a location chosen to funnel them into terrain where hidden forces can close from both directions at once. The performed weakness isn't a real vulnerability. It's the entire mechanism drawing the attacker exactly where the ambush is staged. In the Jataka's tale of the overheard tactic, two monks unknowingly reveal a war plan to royal spies: 'If those who wish to capture Ajatasattu will post garrisons in two hill-forts right away in the hills, and pretend that they are weak, and watch till they get him among the hills, and bar his passage, leap out from the two forts and take him in front and in the rear, and shout aloud, they will quickly have him like a landed fish, like a frog in the fist.' The weakness was bait. The hills were the trap."
