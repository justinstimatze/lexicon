id: lex-z2tcn
name: calibrate-challenge-difficulty-to-attract-genuine-attempts
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when you want adversarial testing to generate real evidence for a claim, and the true version of your claim is strong enough that a rational challenger would decline to even attempt breaking it. Ralph Merkle, wanting evidence that his novel knapsack-based trapdoor cipher actually resisted cracking, posted a public $100 bounty -- but deliberately set the challenge's difficulty far below his scheme's real security level. His own stated reasoning: offering money to break the full-strength (possibly unbreakable) version would leave people with no realistic hope of collecting, so they would 'just throw in the towel' and not attempt it at all -- producing silence, and silence is not evidence of strength, only evidence that no one tried. By calibrating the bounty to a deliberately weakened version instead, he ensured a real, if small, chance of a payout, which meant people would actually attempt to break it -- and their genuine attempts and failures against the easier target became real evidence about the underlying scheme's strength, evidence unobtainable by challenging the version he actually cared about. The plan was explicit: raise the stakes to the full claim only after the weaker version had survived genuine attempts. The mechanism, generalized: when you want a claim adversarially tested, the challenge's difficulty should be calibrated to what will actually attract attempts from capable challengers, not to the full strength of the claim you ultimately want validated. An unattemptable challenge is worse than no challenge at all, because its silence can be mistaken for validation. Operational sequence: (1) identify the version of your claim that a rational, capable challenger would actually consider worth attempting given realistic odds of success; (2) stake the public test on THAT version, not the full claim; (3) treat survival of the weakened version as partial, not complete, evidence -- it licenses raising the stakes to a harder version, not declaring the full claim proven; (4) repeat, escalating difficulty only as each level accumulates genuine (not merely absent) challenge attempts."
related: [lex-eb3wf, lex-v8dgj]
scaffolds-from: [lex-v8dgj]
evokes: [throw-in-the-towel, discreetly-shown-resulting-silence, not-embarrassingly-simple, raise-the-stakes, one-hundred-dollars]
lineage:
  - source: primary
    text: levy-2001-crypto-how-the-code-rebels-beat-the-government
    citation: "Steven Levy, Crypto: How the Code Rebels Beat the Government -- Saving Privacy in the Digital Age (Viking Penguin, 2001), chapter 'public key.'"
    quote: "Merkle was supremely confident that no such flaw existed and posted a challenge on his office door. 'I'm offering $100 to the first person to break it,' he wrote to Hellman. 'I've discreetly shown it to a few people here, and after listening to the resulting silence, I've concluded that the solution, if it exists, is at least not embarrassingly simple.' To be sporting about it, he made the task immeasurably easier, asking potential crackers to solve the problem with the difficulty of the knapsack problem set at a level so low that Merkle knew that there was at least a remote chance that someone might collect the reward. After that, he figured, he could raise the stakes and offer a higher bounty if someone cracked the real thing. 'The point was that no one gave a damn about this stuff,' he says. 'I figured that if I offered money for the [possibly unbreakable] knapsack, people would just throw in the towel. So I offered money for the [easier problem], because somebody might actually break that, or at least think they have a chance at breaking that.' (Levy, Crypto, 'public key.')"
canonical-instances:
  - "operationally distinct from lex-eb3wf prospective-hindsight-as-failure-mode-elicitation (Klein's pre-mortem): both are deliberate-evidence-generation procedures, but lex-eb3wf elicits failure-mode narratives from imagined future hindsight, an internal/analytical exercise, while this atom calibrates an external, adversarial, public challenge's difficulty level — a different evidence-generation mechanism entirely."
  - "Capture-the-flag (CTF) security competitions and public bug-bounty programs routinely stage challenges at graduated difficulty tiers (easy/medium/hard) rather than a single maximum-difficulty target, explicitly because a target calibrated only to elite attackers would attract too few genuine attempts to generate useful signal about the broader population of real-world threats a system actually faces."
  - "A startup claiming its fraud-detection model is 'unbeatable' runs an internal red-team exercise against a deliberately simplified version of the model first (fewer features, lower confidence threshold) specifically because red-teamers asked to beat the full production model with no realistic chance of success tend to give a token effort or decline -- the simplified version generates real attack attempts, and only after it survives does the team escalate the red-team exercise to the full system."
  - "An open-source cryptographic library's maintainers publish a deliberately reduced-round version of a new cipher (fewer encryption rounds than the shipped default) specifically to invite academic cryptanalysis papers, because the full-round version is understood to be far outside what any published attack could plausibly break -- successful or failed attacks on the reduced-round version are the only realistic source of genuine adversarial evidence about the cipher's underlying design."
critical-questions:
  - "Isn't this just 'set an achievable bar,' generic goal-setting advice? No -- the atom's specific claim is about EVIDENCE GENERATION under adversarial testing, not motivation or goal design: the reason to lower the difficulty is not to make success more likely for its own sake, but because a target too hard to plausibly beat produces NO ATTEMPTS AT ALL, and therefore no information -- the failure mode this atom names is mistaking silence (no one tried) for validation (everyone who tried, failed), which generic 'achievable goals' framing doesn't address."
  - "Doesn't deliberately weakening your own claim's test look like admitting the full claim can't survive scrutiny? The atom's operational discipline addresses this directly: the weakened version is explicitly staged as step one of an escalating sequence (see step 4 in agent-instruction), not a substitute for eventually testing the full claim -- Merkle's own plan was to raise the stakes to 'the real thing' once the easier version held. The risk is real if the escalation never happens; the atom's claim is conditional on treating the weaker survival as partial evidence licensing the next, harder test, not as terminal proof."
  - "How do you know your 'weakened' version is still testing the SAME underlying mechanism, rather than a different, easier problem that tells you nothing about the real claim? This is the atom's sharpest failure mode and Merkle's own scheme illustrates the risk: his knapsack cipher's specific weakness was that lowering the difficulty setting didn't just make the SAME cryptanalysis harder or easier, it changed which attacks were computationally feasible against it (the underlying knapsack-density structure that made low-difficulty versions crackable via specific algorithms was later shown, by Shamir in 1982, to generalize to an attack on the full-strength version too) -- calibrating difficulty down is only evidence-generating if the weakened version genuinely shares the mechanism you care about, not merely a family resemblance to it."
