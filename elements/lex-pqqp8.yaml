id: lex-pqqp8
name: pleading-with-a-tool-cannot-replace-learning-the-correct-method
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Talking to a tool, encouraging it, flattering it, repeating a command at it more forcefully, can feel like a reasonable response to it not working, when the actual problem is that you're missing the correct method or apparatus entirely, and no amount of appeal to the object itself will substitute for that. In Radin's Winnebago Hare Cycle, Hare has an arrow and wants to kill an elk, so he aims it by hand and speaks to it directly: 'Arrow, go!' When it doesn't move, he doesn't reconsider his approach; he tries persuasion: 'He flattered it and tried again to direct it but it would not go.' Reporting the failure to his grandmother, Hare frames it entirely as a relational failure on the arrow's part -- 'the arrow would not obey me... I pleaded with it repeatedly but still it would not go' -- as though the arrow were a reluctant participant rather than an object requiring a mechanism he simply didn't have. His grandmother's correction names the actual gap: 'that is not the way hunters act. They send the arrow off by means of an object they call a bow.' The arrow was never disobedient. It was incomplete equipment being addressed as though it were a will that needed convincing. Diagnostic move: when something you're using won't do what you want and your instinct is to ask it more insistently or more nicely, check first whether you're missing the actual mechanism for using it correctly, rather than treating the object's non-cooperation as the thing that needs to change."
