lineage:
  - source: primary
    text: sudnow-1967-passing-on-announcement-choreography
    citation: "David Sudnow, Passing On: The Social Organization of Dying (Prentice-Hall, 1967), Chapter 5 'On Bad News,' on the physical-approach signaling that precedes verbal announcements of surgical outcomes, births, and deaths in hospital waiting-room settings."
    quote: "It seems that a direct relationship exists between the distance at which talk begins and the character of the news. In circumstances of bad news, announcers approach recipients slowly and seldom begin talk before a rather close physical distance separates them, a partial concern being to be in a position where the recipient's response can be shielded from potential onlookers. When good news is brought, everyone present may become involved, the announcement made in tones for all to hear."
canonical-instances:
  - "the obstetrician at Cohen Hospital who 'characteristically shouted out to relatives the sex of the child as he came nearly running down the hall to them' — the outcome is legible from gait and volume well before the words arrive."
  - "surgeons observed to 'leave the operating room with broad smiles on their faces, and begin talking long before they get within usual conversational distance' when the outcome is favorable, versus a slow, silent, close-distance approach when it is not."
  - "a manager's unscheduled, closed-door-bound walk toward a direct report's desk that signals a difficult conversation is coming before any words are exchanged, giving the employee time to brace emotionally."
critical-questions:
  - "is this just 'body language matters,' too general to be a distinct pattern? The claim is narrower and more operational: the approach functions as a TIMED information channel that precedes and is separable from the verbal content, with a specific mechanical driver (distance-before-speech tracks news valence) that hospital staff use deliberately to manage both the recipient's emotional preparation and third-party witnessing — not a general claim that body language conveys emotion."
  - "does this require conscious manipulation by the messenger, or can it be habitual/unconscious? Both — Sudnow's account includes staff who deliberately engineer the approach (surgeons removing cap and mask before a good-news walk to look freshly finished) and staff whose pacing simply tracks their own affect without calculation. The pattern names the informational EFFECT of the approach-channel, which operates whether or not the messenger intends it as signaling."
  - "how is this different from lex-q8az5 noble-lie-instrumental-narrative-for-cohesion or other staged-narrative atoms? Those atoms concern the CONTENT of a narrative being shaped for social effect over an extended timeframe. This atom concerns a narrow PRE-VERBAL, SECONDS-LONG physical channel (pace, distance, affect) that operates before any narrative content is delivered at all — the information transfer happens in how someone walks toward you, not in what they eventually say."
