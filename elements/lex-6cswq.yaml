id: lex-6cswq
name: a-tradition-holding-across-surface-variation-breaks-when-power-flips
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A cultural default can appear to hold for reasons of substance -- tradition, nature, the character of the parties involved -- when it actually tracks nothing but which party holds structural power. One way to expose this: notice that the default holds constant across every surface variation of the substantive-seeming factors (race, color, background), which looks like strong evidence the default really is about those factors. But invert the demographic-power arrangement itself -- put the usual minority in the host role, surrounded now by a majority built entirely of the usual outsiders -- and if the tradition suddenly has no footing at all, that single flip is more diagnostic than every surface variation combined, because it isolates the one variable that was actually doing the work. The narrator names exactly this asymmetry and its collapse: 'in any other imaginable marriage among the peoples of the earth, whether the woman were black, red, yellow, brown, or white; whether she were ignorant or educated, submissive or rebellious, she would have behind her the marriage tradition of our general history. This tradition relates the woman to the man... Well--here were we, three aliens in this land of women.'"
related: []
evokes: [herland, chapter-11, three-aliens-in-this-land-of-women, the-marriage-tradition-relates-the-woman-to-the-man, flip-the-power-arrangement-to-isolate-what-a-tradition-actually-tracks]
lineage:
  - source: primary
    text: gilman-1915-herland-chapter-11
    citation: "Charlotte Perkins Gilman, Herland (1915), Chapter 11, 'Our Difficulties.' Verified verbatim against a direct plain-text extraction, clean text, no OCR."
    quote: "But no combination of alien races, of color, of caste, or creed, was ever so basically difficult to establish as that between us, three modern American men, and these three women of Herland... You see, in any other imaginable marriage among the peoples of the earth, whether the woman were black, red, yellow, brown, or white; whether she were ignorant or educated, submissive or rebellious, she would have behind her the marriage tradition of our general history. This tradition relates the woman to the man. He goes on with his business, and she adapts herself to him and to it. Even in citizenship, by some strange hocus-pocus, that fact of birth and geography was waved aside, and the woman automatically acquired the nationality of her husband... Well--here were we, three aliens in this land of women."
canonical-instances:
  - "A relocation policy that always has the newly-hired spouse move to the established employee's city, regardless of which industry, income bracket, or nationality each partner comes from, looks like it's tracking career seniority -- until a case arises where the newly-hired partner is the one with the established local household, and the policy suddenly has no clean answer, revealing it was always tracking an assumed role rather than the stated criterion."
  - "An immigration custom that expects a newcomer to adopt the host country's language and norms holds firm regardless of what nation the newcomer arrives from, which looks like evidence it's really about practical integration. Now picture a large, well-organized group settling among a small existing population under that same label of 'newcomer.' The expectation of one-way adaptation has no purchase there at all, which points to relative numbers as what the custom was tracking the whole time."
  - "A company's onboarding norm has every new employee learn to work around the founding team's established tools and habits no matter what background or prior seniority the new hire brings -- until the company is acquired by a much larger firm and its own 'founding team' becomes the small newcomer group, at which point the norm reverses overnight, exposing that it was never really about founding-team expertise but about relative size and leverage."
critical-questions:
  - "Is a single flipped case really more diagnostic than many held-constant surface variations, or could the flipped case itself be confounded by some other factor that changed at the same time as the power arrangement, making the inference less clean than it looks?"
  - "Does identifying that a tradition tracks power rather than substance actually tell you what SHOULD replace it, or only that the current justification is false -- leaving the practical question of what a fair arrangement would look like completely open?"
  - "Are there traditions that genuinely do hold for substantive reasons, where those same substantive reasons just happen to correlate with which party usually holds power, so that a power-flip would break the tradition anyway and the diagnostic would misread a real cause as a fake one?"
