canonical-instances:
  - "A hedge fund with a brutal, multi-round interview process and near-zero first-year attrition produces analysts who feel the pressure easing once they are in the door, while a fund with lax hiring but an up-or-out first-year cull produces analysts who feel the real competition is just beginning — the two funds can be equally selective in aggregate, but each population reports opposite answers to when the pressure peaks."
  - "A civil service that screens hard on a single national entrance exam and almost never dismisses anyone afterward produces employees who relax once hired; a civil service with an easy entrance exam but a strict multi-year probation with high early dismissal rates produces employees who stay anxious well into the job — the same overall bar for a career, opposite felt location of the pressure."
critical-questions:
  - "How much of the reversal is really about the LOCATION of the filter versus the two professions' different downstream cultures (an adversarial, jobs-scarce legal market versus a cooperative, jobs-plentiful medical one, which Thielens also documents elsewhere in the same essay) — could the gate-location explanation and the profession-culture explanation both be true and simply compounding rather than competing?"
  - "Does the mechanism predict that if the lenient-entry track later tightened its admissions (moving its bottleneck earlier), first-year attrition and reported first-year competition should fall correspondingly — has any professional school that tightened admissions standards actually been tracked for this predicted before/after shift in reported student stress?"
status: active
