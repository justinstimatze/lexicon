lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Prediction and Prophecy in the Social Sciences' (address delivered to the Plenary Session of the 10th International Congress of Philosophy, Amsterdam, 1948), Ch. 16 of Conjectures and Refutations (Routledge Classics, 2002), p.457, Section V."
    quote: "'The second (from which the first follows) is that he cannot possibly do so because long-term prophecies can be derived from scientific conditional predictions only if they apply to systems which can be described as well-isolated, stationary, and recurrent. These systems are very rare in nature; and modern society is surely not one of them. Let me develop this point a little more fully. Eclipse prophecies, and indeed prophecies based on the regularity of the seasons (perhaps the oldest natural laws consciously understood by man) are possible only because our solar system is a stationary and repetitive system; and this is so because of the accident that it is isolated from the influence of other mechanical systems by immense regions of empty space and is therefore relatively free of interference from outside.'"
canonical-instances:
  - "A forecasting team points to their model's strong track record predicting next quarter's ad-auction prices and proposes using the same method to forecast which startups will dominate the market in ten years. Ad-auction prices recur under near-identical conditions thousands of times a day in a system insulated from most outside shocks; a ten-year competitive landscape turns on technologies, regulations, and entrants that haven't been invented yet. There's no track record on file for something that hasn't happened, in any market."
  - "Because epidemiologists can forecast a flu season's peak with real accuracy, a policy office assumes an epidemiologist can also forecast the long-run trajectory of a novel pandemic three years out. Flu seasons recur yearly under broadly similar conditions in a well-studied system; a novel pathogen's multi-year path depends on mutation events, policy responses, and behavior changes that have no precedent to draw the forecast from."
critical-questions:
  - "Doesn't this prove too much -- if social systems are never isolated, stationary, or recurrent, does that mean the social sciences can predict nothing at all? No -- Popper explicitly allows conditional, short-range prediction wherever some genuine recurrence exists (comparing how new religions or tyrannies tend to arise, for instance). What's ruled out specifically is long-term, UNCONDITIONAL historical prophecy -- forecasting a specific future event or trajectory without any if-then qualification -- not every kind of prediction a social scientist might make."
  - "Physics itself studies plenty of non-isolated, non-stationary systems (turbulent weather, ecosystems) and still makes useful predictions -- doesn't that undercut the three-condition test? It shifts what kind of prediction is available rather than refuting the test: weather forecasting stays short-range and probabilistic precisely because the atmosphere isn't isolated or stationary, and nobody expects an eclipse-grade exact long-term forecast from it. That's exactly what the three-condition test predicts. Take away isolation, steadiness, and recurrence and you get worse prediction -- shorter horizons, more caveats -- long before you get none at all."
