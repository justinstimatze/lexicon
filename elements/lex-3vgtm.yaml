id: lex-3vgtm
name: shared-field-membership-auto-disambiguates-a-cross-discipline-homonym
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When the exact same word functions as precise technical terminology in two or more entirely unrelated fields, don't expect confusion within either field — expect it only at the boundary where the term crosses to an audience unfamiliar with its other technical sense. Merton makes this the explicit point of a terminological note distinguishing sociology's 'socialization' from economics' 'socialization': 'technical homonyms seldom result in misunderstandings since the readers of writings containing these terms are ordinarily themselves at work in the same technical field, and consequently share a common universe of discourse. Readers in the same field at once supply the appropriate, rather than the extraneous, meaning of the homonym, since they are socially insulated from the like-appearing word of quite different meaning. But when... a technical term... comes to the attention of those in other fields, quite the contrary is apt to occur. Readers will naturally enough supply the meaning with which they are most familiar, and some may actively resist the thought that it may have an equally well-established though different meaning in the technical field previously unknown to them.' He documents that this is a structural feature of scientific vocabulary generally, not a quirk of one word: 'The bacteriologist... does not hesitate to use the term culture simply because the anthropologist... has utilized culture in quite another sense... both bacteriologist and anthropologist... speak, in their several ways, of subcultures.' Further examples he catalogs: 'section' means something distinct to a surgeon, an anatomist, a botanist, a mathematician, a geologist, a printer, a military officer, a college teaching assistant, a real estate broker, and a railwayman; 'remission' denotes decreased disease severity in pathology and something else in theology; 'mass' carries distinct senses in physics, politics, pharmacy, mining, fine arts, military science, and Catholic ritual; 'force' means unlawful violence in law, the police collectively in vernacular, and something else again in physics, ethics, and literature. His summary of why this proliferation is harmless in practice: 'As is generally the case with language, the context aptly enough shows which meaning of the homonym is intended... in a language shot through with homonymous constructions, words of the same outward appearance are bound to appear in quite unrelated fields of inquiry.' Diagnostic move: when you notice the same term used with two genuinely unrelated meanings across two fields, don't assume this is a defect that needs fixing (via disambiguating jargon, footnotes, or renaming) — the ambiguity is invisible and harmless to anyone reading within a single field's own discourse, and only needs active management at the specific point a document or conversation must reach an audience straddling both fields, or reach someone from one field encountering the term for the first time via the other field's usage."
