id: lex-hta65
name: spontaneous-theory-of-mind-as-baseline-other-modeling
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When predicting another's behavior, surface that spontaneous theory-of-mind (modeling what they believe/want/know) is the baseline; absence of mentalizing — not its presence — is the deviation that needs explanation."
related: [lex-exczm, lex-rzgzr, lex-wnmfk, lex-ckahh, lex-yzuec, lex-fdvmu, lex-3ajns, lex-46n25]
evokes: [getting-in-other-peoples-minds, intuitive-mentalizing, the-belief-desire-folk-psychology, premack-woodruff-question, false-belief-task, autistic-spectrum-as-attenuated-default, the-self-as-subject-and-object]
lineage:
  - source: primary
    text: brown-1991-human-universals-ch6
    citation: "Donald E. Brown, *Human Universals* (McGraw-Hill 1991; UCSB emeritus 2017 author-revised edition). Chapter 6 'The Universal People.' Brown names spontaneous-intuitive mind-reading (theory-of-mind, mentalizing) as a cross-cultural universal cognitive capacity — humans automatically construct mental models of others' beliefs, desires, intentions, and feelings, treating those mental states as causes of behavior. He notes that even cultures whose own folk theory denies the possibility of mind-reading nevertheless engage in it ethnographically (Brown cites Zapotec and Kaluli emic-denials that are etically falsified by the ethnographer's observation). The transferable claim: ToM is a species-typical cognitive substrate that operates automatically and pre-reflectively; cultural variation appears in how mentalization is expressed, theorized, and taught, but the capacity itself is universal. Importantly distinct from lex-ckahh (mirror-imaging as projection-default when modeling fails) — lex-hta65 is the baseline capacity itself, which when functioning well does NOT collapse to self-projection. In-copyright."
    quote: "[Brown 1991 Ch.6 'The Universal People':] 'The UP have a concept of the person in the psychological sense. They distinguish self from others, and they can see the self both as subject and object. They do not see the person as a wholly passive recipient of external action, nor do they see the self as wholly autonomous. To some degree, they see the person as responsible for his or her actions. They distinguish actions that are under control from those that are not. They understand the concept of intention. They know that people have a private inner life, have memories, make plans, choose between alternatives, and otherwise make decisions (not without ambivalent feeling sometimes). They know that people can feel pain and other emotions. They distinguish normal from abnormal mental states.' [Brown Ch.6 explicit mentalizing-passage:] 'The UP are spontaneously and intuitively able to, so to say, get in the minds of others to imagine how they are thinking and feeling.' [Brown footnote on emic-denial vs etic-presence:] 'There are, for example, some reports of societies in which getting into other people's minds (empathizing, divining intent or inner feeling, and the like) is not done or even conceived as possible. My assumption is that these reports may be emically correct but not etically. For example, Selby (1974:106-107, 109) reports that the Zapotec, at least in some situations, do not think they can get into other people's minds, but he gives a clear case of this happening (1974:56). Similarly, to the Kaluli belief that \"one cannot know what another thinks or feels,\" Ochs and Schieffelin (1984:290) comment that the Kaluli \"obviously\" do \"interpret and assess one another's internal states.\"'"
  - source: practitioner
    text: cross-domain-theory-of-mind-empirical-base
    citation: "Cross-domain attestations of the universal-substrate claim: (i) Premack + Woodruff 1978 'Does the chimpanzee have a theory of mind?' *Behavioral and Brain Sciences* 1:515-526 — the paper that named the construct and launched the empirical research program. (ii) Wimmer + Perner 1983 false-belief-task — children pass the false-belief test reliably by age ~4.5; cross-cultural replication has placed the same developmental milestone at the same age across societies (Liu et al. 2008 meta-analysis across English-speaking, Chinese, Iranian, Japanese, Korean, Peruvian, Tongan, Samoan children; Mayer + Trauble 2013 multi-society). (iii) Baron-Cohen et al. 1985 'Does the autistic child have a theory of mind?' established attenuated/delayed ToM as a core feature of autism spectrum, providing the strongest contrastive evidence that ToM is a discrete cognitive substrate. (iv) Saxe + Kanwisher 2003 fMRI located right temporo-parietal junction (rTPJ) as a domain-specific ToM region — cognitive-neuroscience confirmation of a dedicated substrate. (v) Gergely + Csibra 2003 + Tomasello 1999 — infants by age 6-9 months parse goal-directed action and shared attention; ToM substrate emerges in infancy and develops through childhood. Cross-substrate attestation across comparative primatology, developmental psychology, autism research, cognitive neuroscience, and infant cognition. Not grounded directly in the primaries (Premack, Wimmer-Perner, Baron-Cohen, Saxe, Tomasello)."
    quote: "[Cross-domain consistency check, 2026-06-09: spontaneous theory-of-mind has the strongest cross-cultural and cross-developmental evidence of any candidate cognitive universal. The false-belief task converges in age-of-passage across all studied societies; the rTPJ neural substrate is selectively active for mentalizing tasks across populations; the autistic-spectrum contrastive case demonstrates that attenuation is a coherent dimension along which the capacity can be more or less present. Brown's ethnographic universalism, the comparative-primatology debate (chimps show some but not full human-level ToM), and the developmental neuroscience converge on: spontaneous ToM is a species-typical evolved cognitive substrate, not a culturally-acquired ideology. Cultural-variation operates on how mentalizing is theorized, taught, and elaborated — not on whether it is present.]"
canonical-instances:
  - "Brown 1991 Ch.6: 'The UP are spontaneously and intuitively able to, so to say, get in the minds of others to imagine how they are thinking and feeling.' Brown's naming of the capacity as one of the cross-cultural absolutes — including the explicit footnote that emic-denial-of-ToM is etically falsifiable (Zapotec and Kaluli cases): the cultures whose folk theory says 'we don't mind-read each other' nevertheless mind-read each other in observed behavior."
  - "False-belief task canonical case (Wimmer + Perner 1983; Sally-Anne format): a child watches Sally place a marble in basket A; Sally leaves; an experimenter moves the marble to basket B; Sally returns. The question 'where will Sally look for the marble?' is passed (Sally will look in A, because she believes it is there) by neurotypical children by age ~4.5 across all studied societies. Children younger fail (point to B); autistic children show delayed or absent passage; great apes show partial passage on some non-verbal versions but not full human-level. The task is the canonical empirical marker of the ToM substrate."
  - "Autism-spectrum contrastive case (Baron-Cohen-Leslie-Frith 1985 'Does the autistic child have a theory of mind?'): autistic children, even when matched for general IQ and verbal ability, show systematic delays or impairments on false-belief tasks. The dissociation of ToM from general cognition is one of the strongest pieces of evidence that ToM is a discrete cognitive module — it can be selectively attenuated. Adult autistic-spectrum individuals often describe explicitly computing what neurotypical others would feel/think (a high-effort lex-hta65-by-deliberate-inference) rather than the automatic/intuitive baseline Brown describes."
  - "Everyday adult mentalizing: when you watch a stranger frown at a menu and infer 'they're trying to decide between two options they don't quite want,' you have performed the lex-hta65 operation in milliseconds with no deliberate effort. The inference is defeasible (they might be perplexed by handwriting; they might be in pain), but its default-on automaticity is the substrate. The same applies in conversation, in driving (anticipating the other car's intent), in negotiation, and in caregiving (reading an infant's needs)."
  - "Reading fiction: the cognitive operation by which a reader represents Anna Karenina's, Stephen Dedalus's, or Hamlet's mental states from textual evidence is sustained lex-hta65. The phenomenon that competent readers can argue about a character's hidden motives years after publication relies on the same baseline cognitive substrate Brown identifies ethnographically. Literary critics' close-reading is the deliberate-effortful version of the spontaneous-intuitive operation."
  - "Animal behavior research that uses ToM-language: Frans de Waal's chimpanzee politics; Goodall's Gombe research on tactical deception in primates; Bekoff on dog-dog play-signals; ravens (Bugnyar) deceiving conspecifics about food caches. The interpretive frame these researchers use presupposes that observers (human or non-human) can attribute mental states to others; the question of which non-humans share the substrate is a 50-year live debate."
  - "Cross-cultural folk-psychology variation: Lillard 1998 'Ethnopsychologies: Cultural variations in theories of mind' Psychological Bulletin reviews variation in how cultures EXPLAIN mind (anatomical seat of soul, heart vs head, belief in spirit-possession, theories of why behavior happens). The variation is real and substantial — BUT the baseline capacity to track other-mental-states-as-causes-of-behavior is preserved across all variants. Cultural folk-theory varies; the underlying cognitive operation does not."
  - "Operationally distinct from lex-ckahh: lex-hta65 names the baseline cognitive CAPACITY for spontaneous other-modeling. lex-ckahh names a FAILURE MODE of that capacity (fill-the-model-with-self-projection when other-modeling is hard). They compose: a competent lex-hta65 user actively suppresses lex-ckahh when the other's frame is genuinely different from their own. lex-hta65's pathology is collapsing to lex-ckahh; its healthy operation is constructing genuinely-other-modeled mental states from observable cues."
  - "Operationally distinct from lex-exczm sympathy-as-affective-transmission-via-lively-idea-to-impression (Hume): lex-exczm is Hume's mechanism for HOW observed-affect-becomes-felt-affect (the cognitive-to-affective transmission). lex-hta65 is the cognitive operation of attributing the mental state itself, whether or not the observer comes to FEEL it. They compose: lex-hta65 builds the cognitive representation 'A is sad'; lex-exczm (Hume) is the affective uptake by which the observer comes to feel some of A's sadness."
  - "Operationally distinct from lex-wnmfk (Goffman): lex-wnmfk is the social-strategic move by which I PRESENT a self to others. lex-hta65 is the cognitive capacity by which others READ a presented self. They compose: my impression-management presupposes my audience can mentalize me (otherwise the performance does no work), and competent audience-members do mentalize whether the performance is sincere or strategic. Goffmanian impression management is a strategic exploitation of the audience's lex-hta65 capacity."
  - "Operationally distinct from lex-yzuec triangular-awareness-enables-coalition-formation: lex-hta65 is the capacity to model A's mental states. lex-yzuec is the capacity to model A's RELATIONSHIPS with B from one's own standpoint. They compose: triangular cognition requires representing A's beliefs/feelings about B (a lex-hta65 operation) AND representing the relational-structure A-B-self (the additional lex-yzuec step). Without lex-hta65 there is no lex-yzuec; lex-yzuec is recursive over lex-hta65."
critical-questions:
  - "is the analyst doing baseline ToM or projecting? Discriminator: ask whether the inferred mental state for the other is DIFFERENT from what the analyst would experience in the same external situation. If yes, baseline ToM is operating. If no (the other is being attributed the analyst's own preferences, framings, time-horizons), check for lex-ckahh projection — the inference may be projection-as-pseudo-ToM rather than actual other-modeling."
  - "what evidence is the ToM-inference resting on? Discriminator: list the observable cues (facial expression, posture, prior history, contextual constraint, verbal statement, behavioral pattern). Strong ToM inferences integrate multiple cue-channels and triangulate across them. Weak inferences ride on a single channel (especially a single channel the inferrer is biased to over-read, like self-similar verbal statements)."
  - "is the inference about belief, desire, intention, emotion, or perceptual access? Discriminator: ToM is heterogeneous — beliefs (what the other thinks is true), desires (what they want), intentions (what they will to do), emotions (their current affective state), perceptual access (what they can see/hear). Different content-types have different cues and different reliability. The analyst should name which content-type the inference targets and check its cue-base."
  - "is the inferred mental state a CAUSE of the other's behavior, or a CONSEQUENCE? Discriminator: ToM at its strongest predicts behavior from inferred mental states (forward-prediction). Post-hoc rationalization (the other did X, so they must have wanted X) is a weaker form. The forward-prediction test: at moment t with available evidence, predict what the other will do at t+1 from the inferred mental state; check at t+1 whether the prediction held. Repeated failure suggests the mental-state inference is wrong or that other causes (constraint, distraction, error) are operating."
  - "is the agent under analysis capable of ToM at the depth the situation requires? Discriminator: simple first-order ToM ('I believe she believes X') is operational by age 4 in neurotypical humans. Second-order ('I believe she believes that he believes X') by age 6-7. Third-order is cognitively expensive even for adults. AI systems, young children, autistic-spectrum individuals at high cognitive load, and intoxicated/sleep-deprived adults may fail at higher recursion-depths. Forecasts that require deep recursion should account for the agent's capacity-limits at that depth."
status: active
