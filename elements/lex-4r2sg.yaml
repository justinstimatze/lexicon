lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Back to the Presocratics' (Presidential Address delivered before the Aristotelian Society, 13 October 1958; first published in the Proceedings of the Aristotelian Society, N.S. 59, 1958-9), Ch. 5 of Conjectures and Refutations: The Growth of Scientific Knowledge (Routledge, 1963; Routledge Classics edition cited here, 2002), p.189."
    quote: "'This reply, of course, amounts to the thesis that, by definition, theories are (or are not) scientific according to their origin in observations, or in so-called \"inductive procedures\". Yet I believe that few, if any, physical theories would fall under this definition. And I do not see why the question of origin should be important in this connection. What is important about a theory is its explanatory power, and whether it stands up to criticism and to tests. The question of its origin, of how it is arrived at -- whether by an \"inductive procedure\", as some say, or by an act of intuition -- may be extremely interesting, especially for the biographer of the man who invented the theory, but it has little to do with its scientific status or character.'"
canonical-instances:
  - "A biotech founder pitches a drug candidate discovered by a computational model spitting out an unexplained molecular structure, with no mechanistic hypothesis behind it. Reviewers who reject the candidate as 'not real science' because nobody can say where the idea came from are asking the wrong question -- the right one is whether the candidate makes falsifiable predictions that survive trials, which has nothing to do with whether a human or a model generated the hypothesis."
  - "A junior researcher's hypothesis, arrived at from a dream, and a senior researcher's hypothesis, arrived at from years of careful literature review, are put to the identical experimental test. If both pass, both are equally validated science at that point -- the dream-origin belongs in the researcher's memoir, and stays irrelevant to the result's standing."
critical-questions:
  - "Doesn't the ORIGIN of a hypothesis matter practically, even if it doesn't matter for its scientific status -- reviewers do use track record and method as a proxy for likely quality? Popper would grant this as a practical heuristic for where to spend limited testing effort. But it settles only priority, never status: a speculative hunch that gets tested and survives is exactly as scientific as a carefully-induced hypothesis that survives the same test, whatever heuristic got either one funded first."
  - "Is this just restating [[lex-vmas8]]'s falsifiability criterion in different words? No -- lex-vmas8 answers 'what observation could refute this claim', a property of the claim's logical structure. This atom answers a different, prior objection: 'this claim was reached by speculation rather than observation, so it can't count as science regardless of testability' -- a claim about the theory's history, not its structure. Popper treats the historical objection as simply irrelevant, once falsifiability is secured; this atom names that irrelevance directly rather than assuming it."
