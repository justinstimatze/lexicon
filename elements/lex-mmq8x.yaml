id: lex-mmq8x
name: threat-prior-sustained-against-disconfirmation
type-in: claim
type-out: state
_tier: reaction
agent-instruction: "When a threat-belief survives disconfirming evidence indefinitely, the prior is being SUSTAINED — actively maintained rather than passively held. Identify what's sustaining it (identity, group, payoff) before treating the belief as evidence-based."
related: [lex-znaau, lex-we98d, lex-t9fs7, lex-jw34x, lex-r3w25, lex-rn9ht, lex-uanys, lex-3mgdz, lex-hjnej, lex-n8888, lex-rnftn, lex-cyhjd, lex-tqa55]
scaffolds-from: [lex-t9fs7, lex-jw34x, lex-uanys, lex-rn9ht, lex-znaau, lex-we98d, lex-tqa55]
evokes: [absence-of-evidence-is-evidence-the-threat-is-hiding, the-debunking-confirms-the-conspiracy, ptsd-prior-survives-safe-environment, dissonance-routes-to-prior-maintenance-not-update, the-scan-cannot-find-the-relax-signal]
reactants:
  - "a threat-prior — a belief that a danger is real and present (in environment, social field, relationship, or trajectory)"
  - "disconfirming evidence arriving: the predicted threat does not materialize, the danger-signal turns out benign, the safe environment continues to be safe"
conditions:
  - "the agent holds the threat-prior under sustained lex-rn9ht hypervigilance AND has no alternative scaffolding for the felt-significance the prior is supplying — bare disconfirmation with nothing to replace the prior's function"
mechanism: "lex-rn9ht hypervigilance is sustained (continuous low-threshold scanning for confirmatory cues); disconfirming evidence arrives; lex-we98d cognitive-dissonance fires on the gap between `I have been vigilant because the threat is real` and `the threat is not materializing`. Instead of belief-update (the prior was wrong) or behavior-change (relax vigilance), the resolution-path taken is REINTERPRETATION of the evidence — `the threat is hiding`, `dormant but waiting`, `my vigilance is why it hasn't materialized`, `the safe environment is suspicious, too safe` — which lets the threat-prior survive disconfirmation and feeds back into sustained hypervigilance (the autocatalytic loop)"
catalysts:
  - lex-t9fs7   # confirmation-bias warps the scan asymmetrically, accelerating the transmutation of disconfirming into confirming evidence
  - lex-jw34x   # dissonance-driven-identity-defense, when the threat-prior is identity-aligned
  - lex-uanys   # identity-directed-threat-scanning sets the prior this loop defends
products:
  - "an unfalsifiable, self-stabilizing threat-prior: each disconfirmation is converted into prior-confirming evidence; the hypervigilance is justified by its apparent prevention-effect or the threat's apparent concealment; the prior becomes unfalsifiable by ordinary evidence"
inhibitors:
  - "disconfirmation PLUS an identity-alternative (offering alternative scaffolding for the significance the prior supplied) dissolves it; meta-awareness of the reinterpretation pattern (cognitive-therapy thought-records surface it explicitly); structurally-bounded scanning (specific questions, time-limits)"
reversibility: "self-reinforcing / autocatalytic equilibrium — bare disconfirmation STRENGTHENS rather than reverses it (Festinger-Riecken-Schachter 1956); breaks only with identity-alternative scaffolding or by surfacing and disrupting the reinterpretation, not by exposure alone"
critical-questions:
  - "is the threat-prior trauma-grounded (genuinely warranted by past experience, with the loop being mal-adaptive in current safe environment) or worldview-grounded (a conceptual conviction about danger that selects evidence)? The intervention differs: trauma-grounded benefits from cognitive therapy (Beck-lineage exposure + reinterpretation work); worldview-grounded benefits from social-context shift (Westgate cult-deprogramming literature)"
  - "would direct exposure to disconfirming evidence under safe conditions break the loop or strengthen it? Empirically: depends on whether the agent has alternative scaffolding for the felt-significance the prior was supplying. Bare disconfirmation often strengthens the loop (Festinger-Riecken-Schachter 1956); disconfirmation + identity-alternative can dissolve it"
  - "is the agent meta-aware of the reinterpretation pattern? Awareness ('I'm doing the thing where everything confirms the prior') is one of the diagnostic markers that exposes the molecule and allows interruption. Standard cognitive-therapy uses thought-records that surface the reinterpretation explicitly"
  - "operationally distinct from lex-uanys identity-directed-threat-scanning: that molecule names the ANTICIPATORY scan direction set by identity-stakes; this molecule names the REACTIVE defense of the threat-prior when disconfirming evidence arrives. The two compose: lex-uanys sets the prior; lex-mmq8x defends it through dissonance-routing"
  - "operationally distinct from lex-r3w25 confirmation-filtered-tribal-perception: lex-r3w25 operates at the social-perception layer (the agent's read of the social field is biased); this molecule operates at the threat-prior layer (the agent's threat-belief is defended through reinterpretation of confirming/disconfirming evidence). lex-r3w25 is about social-evidence; lex-mmq8x is about threat-evidence"
lineage:
  - source: primary
    text: beck-1979-cognitive-therapy-and-emotional-disorders
    citation: "Aaron Beck, Cognitive Therapy and the Emotional Disorders (Meridian / International Universities Press 1976; Plume reprint 1979) — two passages supply the loop the molecule names. Ch.6 'The Alarm Is Worse Than the Fire: Anxiety Neurosis' supplies the feedback mechanism by which threat-cues become themselves treated as confirming evidence of the threat-prior (anxiety-feedback loop). Ch.7 'Afraid But Not Afraid: Phobias and Obsessions' supplies the empirical observation that direct disconfirming experience does not correct the prior — the phobic patient encounters the phobic situation, finds the actual distress milder than predicted, and yet retains the prior + avoidance posture. Together these passages name what this molecule generalizes as threat-prior-sustained-against-disconfirmation: in the anxiety case, the prior is sustained by routing internal cues back into the prior; in the phobia case, the prior is sustained by experiential disconfirmation failing to update it. (Ch.6 + Ch.7)"
    quote: "Since he associates anxiety with danger, he reads his anxiety as a danger signal. Hence, another vicious cycle is set up: Ideation with a threatening content produces anxiety. The feedback of cues of anxiety leads to further anxiety-producing ideation: The patient thinks, 'I'm feeling anxious; therefore, the situation must really be threatening.' [Ch.6 — the anxiety-feedback loop is the canonical Beck mechanism by which an internal cue becomes treated as prior-confirming evidence; this molecule generalizes the move from anxiety-cues specifically to any reinterpretation that converts ambiguous evidence into threat-confirming evidence.] Yet some patients find that their distress is milder than they expected — much less than warranted by their degree of avoidance. ... Despite their relatively bland response to the phobic situation, the patients may continue to have an extraordinary desire to avoid it. Clearly, experience does not correct the exaggerated fear or the powerful avoidance tendencies. [Ch.7 — Beck's direct observation that the phobic prior survives disconfirming experience; the molecule names the mechanism (reinterpretation of the disconfirmation) by which it survives. The therapeutic intervention surfaces and disrupts the reinterpretation rather than relying on bare exposure.]"
  - source: practitioner
    text: festinger-1957-theory-of-cognitive-dissonance
    citation: "Leon Festinger, A Theory of Cognitive Dissonance (Stanford 1957) — When Prophecy Fails (Festinger Riecken Schachter 1956) is the canonical case of disconfirming evidence being routed into prior-reinforcement rather than prior-update. The mechanism in the present molecule is a substrate-anchored generalization beyond cult-prophecy to ordinary threat-priors. Already in lex-we98d lineage; no verbatim quote is claimed here."
  - source: discovery-loop
    text: score-drivermap-mining-pass-1
    citation: "The co-occurrence pass identified hypervigilance × cognitive_dissonance (20.3% strength) as a co-occurrence pair. lex-rn9ht lineage notes this pairing explicitly (dissonance from threat-disconfirmation gets routed back into hypervigilance maintenance rather than threat-prior relaxation). The molecule names the explicit mechanism"
canonical-instances:
  - "conspiracy-theory holder responding to debunking: predicted event doesn't happen on date X; reinterpretation is 'the conspirators rescheduled' or 'we (believers) forced them to delay.' The threat-prior (a powerful conspiracy is acting) is preserved by reinterpreting the disconfirming non-occurrence as evidence of the conspiracy's adaptive response"
  - "PTSD patient in objectively safe environment: months without incident produce dissonance ('I have been vigilant but no threat has materialized'); reinterpretation is 'I prevented it through vigilance' or 'the threat will come when I relax.' Vigilance is preserved by reinterpreting safety as conditionally-vigilance-dependent"
  - "domestic-abuse survivor after escape with restraining order in place: the absence of contact gets reinterpreted as 'he's planning something' or 'this is the calm before.' The threat-prior is preserved by reinterpreting non-contact as strategic concealment. (Sometimes correctly — the molecule's empirical failure-rate is non-zero — but the diagnostic question is whether the reinterpretation tracks specific evidence or generalizes)"
  - "anxious-attached partner in stable relationship: partner-behavior consistently demonstrates commitment; the agent reinterprets as 'they're being nice now because they're planning to leave' or 'this is the lull.' The threat-prior (abandonment risk) survives the disconfirming pattern by routing dissonance through reinterpretation"
  - "operationally compositional with lex-jw34x dissonance-driven-identity-defense: that molecule names dissonance routing through identity-defense; this molecule is a special case where the identity-aligned belief is specifically a threat-prior. The two molecules name overlapping mechanisms at different specificity-levels"
  - "operationally distinct from lex-t9fs7 confirmation-bias solo: solo confirmation-bias is the systematic preference for confirming evidence; this molecule names the active REINTERPRETATION of disconfirming evidence into confirming evidence — a stronger and more self-stabilizing mechanism. Confirmation-bias filters; this molecule transmutes"
severity-tier: info
status: active
