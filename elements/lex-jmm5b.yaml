id: lex-jmm5b
name: stated-intentions-are-weak-evidence-actions-are-strong-evidence
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When inferring what an agent (a person, an organization, an institution) actually values or will do, treat STATED INTENTIONS as weak evidence and PAST ACTIONS as strong evidence. The proverb-tradition's transferable claim — 'actions speak louder than words,' 'deeds not words,' 'talk is cheap,' Japanese 言うは易く行うは難し (saying is easy, doing is hard) — is an epistemic claim about ASYMMETRIC CREDIBILITY of these two signal sources. Stated intentions are cheap to produce (no commitment, low cost of lying, social pressure to express the approved value) and therefore carry little information past the population base-rate. Actions are expensive (irreversible, observable, costly to fake at scale) and therefore carry strong information about the agent's actual incentive structure. The transferable move: when a stated intention and a past action point in different directions, weight the action much more heavily than the intention. Practitioner discipline: ask 'what would this agent do if they actually believed what they're saying?' Then look at their recent actions for evidence of that belief. If actions diverge from stated intentions, the stated intentions are most likely a presentation surface, not the operative belief. The atom is silent on whether the agent is consciously lying — most often the divergence is unintentional (they sincerely believe the stated intention while their actual revealed preferences differ). What matters is the EVIDENTIARY weight: actions tell you more about what will happen next than statements do. Be careful with the inverse failure mode: not every action is a perfect signal. Single actions can be coerced, accidental, or out-of-character. The atom names the asymmetry as a default prior, not a theorem. When an agent has a long action-history that diverges from current stated intentions, weight the history. When the agent is new (no track record), the stated intentions are the only signal you have — use them with appropriate uncertainty."
