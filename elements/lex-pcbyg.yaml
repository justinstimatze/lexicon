id: lex-pcbyg
name: markets-and-capitalism-are-separable-and-even-opposable
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't assume 'pro-market' and 'pro-capitalist' are the same commitment -- historically, they've often pulled in opposite directions. Following Fernand Braudel, Graeber draws a sharp line between the two. A market is people with a surplus of one thing trading through money for something they need -- Braudel's shorthand C-M-C', commodity-money-other-commodity. Capitalism is something else: using money to make more money, M-C-M'. The easiest way to do that is to establish a monopoly, which is why capitalists characteristically seek to ally with political power to restrict the market's freedom rather than extend it. Confucian China ran with this distinction for two thousand years: the state promoted markets aggressively while treating would-be capitalists as parasites to be kept under close administrative supervision, refusing to let merchants team up with the state the way European princes later would. The result reads as a contradiction only if markets and capitalism are assumed to be the same thing -- once separated, 'pro-market and anti-capitalist' is a perfectly coherent, historically successful policy, not an oxymoron."
