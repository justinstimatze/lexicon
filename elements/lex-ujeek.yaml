id: lex-ujeek
name: honoring-deals-with-defectors-enables-future-defections
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone switches sides to help you, don't treat the moral weight of their original betrayal as license to shortchange what you promised them -- your reputation for actually paying what was offered, even to someone who broke faith with their own side to earn it, is the entire mechanism by which the next person will be willing to defect for you. Kautilya's instruction for a new ruler is explicit that the obligation runs in the opposite direction of what the traitor's own moral status might suggest: 'he shall reward, as promised, those who were traitors to the enemy for his sake; if they had exerted themselves more [than required], they shall be rewarded more than promised. For he who does not keep his promises or acts against the interests of the people, becomes unworthy of the trust of his own and other people.' The logic isn't about what the traitor deserves as a person -- it's about what underpaying them signals to every future potential defector watching from the outside: that switching sides for you carries the betrayal's full cost with no guarantee of the promised benefit. A reputation for shortchanging defectors, even morally compromised ones, doesn't just cost you that one relationship -- it collapses your ability to recruit any future defection at all, since the entire value proposition to a would-be traitor rests on trusting that the payoff will actually materialize. Diagnostic move: when someone has taken a real risk or paid a real cost to help you by breaking with their own side, honor exactly what was promised regardless of any private judgment about their character or motives -- your future ability to attract this kind of help depends entirely on a visible, unbroken record of paying what you said you would, to everyone who took that risk, not just the ones you personally approve of."
