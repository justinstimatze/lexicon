id: lex-pp5wq
name: binarized-metric-makes-smooth-capability-look-like-sudden-emergence
type-in: claim
type-out: warning
_tier: atomic
agent-instruction: "When someone reports a sudden, sharp, qualitative jump in capability at some scale (a 'phase transition,' an 'emergent ability,' a 'tipping point,' a 'breakthrough'), check whether the metric they are measuring with is BINARY or NONLINEAR. If yes, the apparent discontinuity may be a MIRAGE: an artifact of how a smoothly-improving underlying quantity gets thresholded into a 0/1 outcome (e.g., exact-string-match, multiple-choice-accuracy, pass/fail) which makes any continuous improvement past the threshold look like a step function. Schaeffer-Miranda-Koyejo 2023 showed >92% of 'emergent abilities' on BIG-Bench appeared under Multiple Choice Grade or Exact String Match metrics; switching to per-token cross-entropy or edit distance flattened the discontinuity. The transferable practitioner-discipline: when assessing emergence/phase-transition claims, (1) ask what's being measured and how (binary, nonlinear, or continuous?); (2) consider the same task under a continuous proxy (probability mass on correct answer; edit distance to target; partial-credit score); (3) check whether the small-N regime has enough test items to distinguish 'genuinely 0%' from 'sampling noise near 0%'. If the apparent discontinuity disappears under (2) or (3), the emergence is metric-induced. Pair-atom to lex-9we2s scale-crossing-threshold: lex-9we2s covers genuine scale-induced capability discontinuities (AlexNet 2012, AlphaGo 2016, AlphaFold 2021); lex-pp5wq is the methodological skeptic — some claimed discontinuities ARE real (lex-9we2s), some are measurement-choice artifacts (lex-pp5wq), and the practitioner needs both lenses."
related: [lex-wtkuz, lex-u29fu, lex-9we2s, lex-nx7u7, lex-zpfv9, lex-cqvnu, lex-5bufp, lex-y3vnf]
scaffolds-from: [lex-9we2s, lex-wtkuz, lex-5bufp]
evokes: [emergent-abilities-of-LLMs, more-is-different-anderson-1972, per-token-cross-entropy, exact-string-match, multiple-choice-grade, BIG-Bench, phase-transition, tipping-point, measurement-induced-artifact, nonlinear-transformation, threshold-effect, sampling-noise-near-zero, scaling-laws, kaplan-2020, hoffmann-2022-chinchilla, step-function-vs-smooth-curve]
lineage:
  - source: primary
    text: schaeffer-miranda-koyejo-2023-emergent-abilities-mirage
    citation: "Schaeffer, Rylan, Brando Miranda, and Sanmi Koyejo. 2023. 'Are Emergent Abilities of Large Language Models a Mirage?' arXiv:2304.15004v2 (May 22, 2023); subsequently accepted at NeurIPS 2023. Stanford CS. The paper argues that 'emergent abilities' as defined by Wei et al. 2022 — sharp, unpredictable capability jumps appearing at specific model scales — are an artifact of researcher metric choice rather than a property of the underlying model family. The mathematical core: when the per-token error rate p improves smoothly with scale, a metric like Exact String Match scores 0 until the per-sequence error probability (1-p)^L drops below ~0.5 (where L is target string length), at which point the metric snaps to ~1; this produces a step function from smooth underlying improvement. Empirical tests: (1) three predictions on InstructGPT/GPT-3 family confirmed — replacing Multiple Choice Grade with the model's probability mass on the correct option flattens the apparent emergence; (2) meta-analysis of BIG-Bench shows >92% of hand-annotated emergent abilities appear under Multiple Choice Grade or Exact String Match (both 0/1 metrics) — the discontinuity correlates with metric choice, not with model family or task type; (3) the authors construct emergent abilities ON DEMAND in vision tasks (CNN classifiers; autoencoders) by deliberately choosing nonlinear metrics, showing the phenomenon is metric-generative not model-generative."
    quote: "[Schaeffer-Miranda-Koyejo 2023 §1 Introduction]: 'In this paper, we call into question the claim that LLMs possess emergent abilities, by which we specifically mean sharp and unpredictable changes in model outputs as a function of model scale on specific tasks. Our doubt stems from the observation that emergent abilities seem to appear only under metrics that nonlinearly or discontinuously scale any model's per-token error rate. [...] This raises the possibility of an alternative explanation for the origin of LLMs' emergent abilities: sharp and unpredictable changes might be induced by the researcher's choice of measurement, even though the model family's per-token error rate changes smoothly, continuously and predictably with increasing scale. Specifically, our alternative posits that emergent abilities are a mirage caused primarily by the researcher choosing a metric that nonlinearly or discontinuously deforms per-token error rates, and secondarily by possessing too few test data to accurately estimate the performance of smaller models, thereby causing smaller models to appear wholly unable to perform the task.' [Abstract:] 'we provide evidence that alleged emergent abilities evaporate with different metrics or with better statistics, and may not be a fundamental property of scaling AI models.'"
  - source: primary
    text: wei-2022-emergent-abilities-of-large-language-models
    citation: "Wei, Jason, et al. 2022. 'Emergent Abilities of Large Language Models.' Transactions on Machine Learning Research, August 2022; arXiv:2206.07682. The original empirical paper defining 'emergent abilities' in LLMs as the binary property: 'not present in smaller models but present in larger models; thus cannot be predicted simply by extrapolating the performance of smaller models.' Wei et al. cataloged ~67 such abilities across model families (GPT-3, LaMDA, PaLM, Chinchilla, Gopher) and tasks (BIG-Bench, MMLU, TruthfulQA, etc.). The framing rooted in Anderson 1972 'More Is Different' (Nobel-prize physicist essay on emergence in condensed-matter physics). This is the foil-paper that Schaeffer 2023 refutes; lex-pp5wq is the transferable form of Schaeffer's methodological counter-argument, with Wei 2022 included in lineage as the claim being qualified, not as a refutation-target. Practitioner reading: Wei 2022 documents an empirical pattern; Schaeffer 2023 shows the pattern is largely a function of metric choice. Both grounded in Anderson 1972 conceptually; the open question is whether ANY of the Wei-2022-catalogued abilities survive the metric-swap test."
    quote: "[Wei et al. 2022 §1 Introduction]: 'Scaling up language models has been shown to predictably improve performance and sample efficiency on a wide range of downstream tasks. This paper instead discusses an unpredictable phenomenon that we refer to as emergent abilities of large language models. We consider an ability to be emergent if it is not present in smaller models but is present in larger models. Thus, emergent abilities cannot be predicted simply by extrapolating the performance of smaller models. [...] Emergence is when quantitative changes in a system result in qualitative changes in behavior.' [§2 Definition:] 'we define emergent abilities of large language models as abilities that are not present in smaller-scale models but are present in large-scale models; thus they cannot be predicted by simply extrapolating the performance improvements on smaller-scale models.'"
canonical-instances:
  - "LLM 'emergent abilities' on BIG-Bench (Wei 2022 → Schaeffer 2023): Wei et al. catalogued tasks where InstructGPT/GPT-3/PaLM exhibited near-zero performance at smaller scales and abruptly high performance past some threshold. Schaeffer et al. showed that >92% of these emergent claims appear under Multiple Choice Grade (1 if highest probability on correct option, else 0) or Exact String Match (1 if output exactly matches target, else 0). Swap to model's probability-mass-on-correct-answer (continuous) or per-token cross-entropy (smooth in log-scale), and the apparent step-function flattens to a smoothly improving curve. The canonical case where the transferable point is established."
  - "Schaeffer 2023 §5 vision-task demonstrations: the authors deliberately CONSTRUCT emergent abilities ON DEMAND in image-classification (ResNet on CIFAR-100) and reconstruction (autoencoder on Omniglot) by choosing nonlinear metrics like 'Subset Accuracy' (1 if ALL classes correct, else 0) or 'Reconstruction-error <= threshold.' This is the strongest demonstration: emergence-as-mirage is generative — given any smoothly-improving underlying capability, the researcher can choose a metric that produces a sharp emergence curve. The transferable consequence: any 'emergence' report should be read as joint claim about model AND metric."
  - "exam pass/fail thresholds: undergraduate competency exams (bar exam, medical licensing, professional engineering) use a binary pass/fail metric on top of an underlying continuous skill distribution. The phenomenon of 'sudden competency' appearing at the pass threshold is metric-induced; the underlying skill curve is smooth. Practitioner consequence: educational interventions evaluated on pass-rate outcomes can show 'breakthrough' effects that are actually just shifts in distribution past the threshold; the underlying skill change may be small. A continuous metric (test score distribution) reveals what the binary pass-rate hides."
  - "election thresholds: in a two-party election, 'won the election' is a 0/1 outcome above the 50%+1 vote threshold. A 0.1% shift in vote share crossing 50% produces a 100% shift in 'who won' — a maximally discontinuous metric. This generates discourse about 'tipping points,' 'realignments,' and 'breakthroughs' from underlying smooth shifts in voter preference. Polling analysts who report only the win-probability rather than vote-share distribution amplify the apparent discontinuity. Transferable: a continuous metric (margin of victory; share-of-vote distribution) reveals the underlying smooth process the binary outcome metric hides."
  - "earthquake magnitude thresholds: news media report 'the Big One' framing around magnitude-7+ earthquakes; the Richter/moment-magnitude scale is logarithmic in energy. A 'sudden jump' from magnitude 6.9 to 7.0 is a smooth ~1.4x change in underlying energy presented as crossing a categorical threshold. Transferable to any logarithmic-scale metric where category boundaries make smooth physical changes look discrete (decibels, pH, hurricane categories)."
  - "weight-class boundaries in combat sports: a fighter at 154 lbs vs 155 lbs is in different weight classes (welterweight vs super-welterweight), creating a categorical 'jump' between matchmaking pools. The underlying continuous mass distribution produces a discontinuous discourse about division superiority. The metric (weight class) makes a smooth distribution look quantized."
  - "VC-funding stage labels: 'pre-seed' vs 'seed' vs 'Series A' vs 'Series B' are categorical labels on a continuous funding-size + company-stage distribution. A company at $4.5M raised is 'seed'; at $5M is sometimes 'Series A,' producing a categorical 'milestone' discourse around a smooth underlying capital trajectory. The metric (round label) makes smooth fundraising look like phase-transitions."
  - "operationally distinct from lex-9we2s scale-crossing-threshold: lex-9we2s (AlexNet/AlphaGo/AlphaFold) is the genuine-discontinuity claim — some capability jumps at scale-crossings are real, not metric artifacts. lex-pp5wq is the methodological skeptic — some claimed discontinuities ARE metric-induced. They are pair-atoms: when a discontinuity is reported, ask first 'is the metric continuous or binarized?' (lex-pp5wq) before treating it as a genuine scale-crossing (lex-9we2s). Both lenses needed; not duplicates."
  - "operationally distinct from lex-wtkuz descriptive→operational: lex-wtkuz covers the general gap between an underlying construct and its measurement. lex-pp5wq is a specific operationalization failure-mode — when the construct is continuous but the metric is binary/nonlinear, the metric manufactures an appearance of discontinuity that does not exist in the construct. lex-pp5wq is a sub-case of lex-wtkuz's general warning."
  - "operationally distinct from lex-u29fu discovery-claim-bar-as-community-convention: lex-u29fu covers the threshold-VALUE choice (5-sigma, p<0.05) as community convention. lex-pp5wq covers the metric-SHAPE choice (binary vs continuous) above the threshold-value choice. Together they cover the methodological space of measurement-driven claim manufacture: the value of the threshold is a convention (lex-u29fu), and the shape of the metric around that threshold can manufacture apparent discontinuities (lex-pp5wq)."
critical-questions:
  - "What underlying continuous quantity is being measured? If the metric is binary (pass/fail, exact-match, threshold-crossed), what is the smooth-valued construct beneath it?"
  - "Does the apparent discontinuity survive when you swap to a continuous metric? Try probability-mass-on-correct-answer instead of accuracy; edit distance instead of exact match; margin-of-victory instead of win/loss; vote-share-distribution instead of which-side-won."
  - "Are the small-N (pre-discontinuity) measurements actually distinguishable from zero given the test sample size? If the metric is 0/1 and the sample is small, a true underlying performance of 5% can show up as zero successes in N=10 trials by chance; pre-emergence does not mean pre-existence."
  - "Is the metric reporting a property of the system, or a researcher choice? Schaeffer's vision-task demonstrations show emergence can be manufactured on demand by metric choice; the existence of a discontinuity in some metric does not establish discontinuity in the system."
  - "Are practitioner stakes more sensitive to the continuous or the binary metric? Pass/fail metrics matter when the stakes are binary (licensure, election, deployment-decision); continuous metrics matter when the stakes are diagnostic (trajectory prediction, intervention design). Schaeffer's point is methodological: do not infer system-property from metric-shape without checking other metrics."
  - "Does the discontinuity claim have predictive consequences? A real scale-crossing threshold (lex-9we2s) predicts future jumps at similar transitions; a metric-induced mirage does not. The forecast-test is the cleanest way to distinguish: does the threshold predict, or does the smooth underlying curve predict?"
status: active
