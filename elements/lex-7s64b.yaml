id: lex-7s64b
name: a-punishment-that-matches-the-targets-nature-delivers-them-home
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "Before choosing how to punish or eliminate someone, check whether the method you're about to use actually harms their specific nature, or whether it merely resembles harm to someone unlike them -- a punishment designed without that check can deliver the exact outcome the target would have chosen for themselves. In Zitkála-Šá's telling, a village capturing a Fish and a Turtle tries first to boil them alive, and the Fish simply blows the scalding water back onto the crowd and escapes; the villagers then try to drown them in a lake, and both creatures dive in delighted, the Turtle surfacing to announce, 'This is where I live!' while the Fish darts joyfully through the water. Boiling and drowning are severe punishments for a person, but the village never checks whether they're severe for a fish and a turtle specifically -- and a method of destruction chosen by generic assumption rather than by the target's actual nature doesn't just fail to harm them, it actively delivers them to the one environment where they have every advantage over their captors. The village's error isn't cruelty or incompetence in execution -- it's applying a punishment template built for a different kind of target without ever pausing to ask whether this specific target's nature makes the chosen method backfire completely. Diagnostic move: before applying a standard punishment, exile, or removal to someone, ask specifically what that method actually does to something with their particular nature, background, or resources -- and if there's a real chance the answer is 'delivers them safely into an environment that favors them,' that's not just a wasted effort, it's a threat you've handed the initiative to."
