evokes: [popper-1940-what-is-dialectic, kant-transcendental-dialectic, thesis-and-antithesis-equally-reasonable, world-is-infinite-metaphysical-example, self-evidence-does-not-lead-to-one-result]
lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'What is Dialectic?' (paper read to a philosophy seminar at Canterbury University College, Christchurch, New Zealand, 1937; first published in Mind, N.S. 49, 1940), Ch. 15 of Conjectures and Refutations (Routledge Classics, 2002), p.439, Section 2 'Hegelian Dialectic.'"
    quote: "'...both arguments will appear to be equally, or almost equally, reasonable. Thus, Kant said, reason is bound to argue against itself and to contradict itself, if used to go beyond possible experience. If I were to give some sort of modernized reconstruction, or reinterpretation, of Kant, deviating from Kant's own view of what he had done, I should say that Kant showed that the metaphysical principle of reasonableness or self-evidence does not lead unambiguously to one and only one result or theory. It is always possible to argue, with similar apparent reasonableness, in favour of a number of different theories, and even of opposite theories. Thus if we get no help from experience, if we cannot make experiments or observations which at least tell us to eliminate certain theories--namely those which although they may seem quite reasonable, are contrary to the observed facts--then we have no hope of ever settling the claims of competing theories.'"
canonical-instances:
  - "Two product leads each make a fully persuasive case for opposite roadmap bets in the planning meeting -- one for consolidating the feature set, one for expanding it. Neither case is weak, and a sharper rhetorical delivery from either side won't end the deadlock. It ends once someone proposes a pilot or an A/B test that could actually rule one option out."
  - "Two economists argue a policy's likely effect on employment from opposite theoretical mechanisms, with no data yet gathered on this policy. More theorizing from either side, however carefully argued, just produces more equally reasonable-sounding positions -- the debate moves only once someone collects data capable of favoring one mechanism over the other."
critical-questions:
  - "Isn't this just the standard empiricist case against pure reason -- what's the added value? The specific diagnostic is the symmetry point: reason can build an antithesis as readily as a thesis, so a debate's staying power is not itself evidence that either side argues better. A stalled debate where both positions still sound reasonable after years of argument tells you the argument-only approach was never going to resolve it -- it says nothing about how hard the underlying question actually is."
  - "Some purely formal questions really do get settled by argument alone, like a mathematical proof -- doesn't that undercut the claim? A proof settles what follows from a given set of axioms, full stop. That's a different question from which axioms correctly describe the physical world -- Kant's example targets that second question. The atom's territory is claims of fact reaching beyond what any observation could check; a formal system's internal derivations, once its premises are fixed, are a different animal entirely."
