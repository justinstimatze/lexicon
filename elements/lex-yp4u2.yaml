    text: radin-trickster-denies-the-talking-bulbs-warning-through-escalating-evidence
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 23. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'He who chews me, he will defecate; he will defecate!''Well, I wonder who it is who is speaking. I know very well that if I chew it, I will not defecate.' ... So he seized it, put it in his mouth, chewed it, and then swallowed it. ... 'Well, where is the bulb gone that talked so much? Why, indeed, should I defecate? When L feel like defecating, then I shall defecate, no sooner. How could such an object make me defecate!' Thus spoke Trickster. Even as he spoke, however, he began to break wind. ... 'Well, well, it may even make me give another push, but it won't make me defecate,' so he exclaimed defiantly. The next time he broke wind, the hind part of his body was raised up by the force of the explosion and he landed on his knees and hands."
canonical-instances:
  - "An engineer is warned that skipping a specific safety check will 'eventually cause a full outage,' ignores it, and as smaller degraded-performance incidents start piling up in the following weeks, keeps insisting each one is unrelated 'noise,' right up until the full outage the warning named actually happens."
  - "A doctor warns a patient that continuing a habit will 'eventually cause a heart attack,' and the patient, as chest pain and shortness of breath escalate over months, keeps telling themselves 'it's not actually a heart attack yet' after each episode, until the heart attack itself arrives exactly as described."
critical-questions:
  - "Is Trickster's insistence that he 'will not defecate' sincere denial, or is he performing bravado for an audience even though he is alone -- does the story suggest a difference between genuinely not seeing the evidence and refusing to concede the point out loud?"
  - "Would recognizing the escalating flatulence as partial confirmation of the warning, rather than as evidence against it, have let Trickster stop the process earlier, for instance by seeking help, or does the story present the outcome as fixed regardless of when he accepted the warning was correct?"
  - "Is there a meaningful difference between the specific literal event named in a warning, defecation, and the broader harm it points toward, being thrown into trees and nearly killed by a falling log -- does fixating on the literal word make someone miss danger that has already arrived in a different form?"
