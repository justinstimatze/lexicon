id: lex-z2wtc
name: a-pathological-stereotype-launders-a-variant-the-group-itself-disowns
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When one group stereotypes a rival group as characteristically flawed, check whether the flaw being attributed is something the rival group's own central adherents already reject as a corruption of their own values. Lakoff's case: a nurturant parent characterizes strict-father parenting as inherently abusive, treating one specific failure mode as the model's typical output. But the abusive strict parent is rejected as pathological by central, mainstream strict-father adherents just as strongly as by nurturant parents -- an ordinary strict father sees an abusive one as a corruption of his own model, not an expression of it. The stereotype isn't simply an outsider's harsh judgment invented from nothing. It takes a real variant that insiders themselves have already disowned and repackages it as the group's defining feature, borrowing credibility from the fact that the flaw genuinely exists somewhere in the category while hiding that the category's own mainstream considers it just as much a violation. Diagnostic move: before accepting a characterization of a group as fair criticism rather than pathological stereotyping, ask whether the group's own central adherents already reject the specific variant being used to characterize them -- if they do, the stereotype is built from material the group has already disowned, not from what the group actually holds."
related: []
evokes: [george-lakoff, moral-politics-1996, pathological-stereotyping, strict-father-abusive-variant, nurturant-parent-spoiling-variant]
lineage:
  - source: primary
    text: lakoff-1996-abusive-strict-parent-double-pathology
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 18 'Pathologies, Stereotypes, and Distortions,' section 'Distortions or Justified Stereotyping?' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“A nurturant parent stereotypes the strict parent as abusive, suggesting falsely that abuse is characteristic of the central Strict Father model. But the abusive strict parent is just as pathological to the central strict parent as to the nurturant parent.”"
canonical-instances:
  - "The direct textual anchor, on the mirror-image case: 'A strict parent stereotypes the nurturant parent as spoiling, suggesting falsely that spoiling is characteristic of the central nurturant parent model. But the spoiling parent is just as pathological to the central nurturant parent as to the strict parent.' Lakoff's own verdict on both: 'These are clear cases of pathological stereotyping.'"
  - "Hypothetical: a rival martial arts school is stereotyped by outsiders as producing reckless students who pick fights to prove themselves. Instructors and senior students at that very school treat picking unnecessary fights as one of the worst violations of what they teach, and routinely expel students who do it. The stereotype isn't fabricated from nothing -- some students at that school genuinely have picked fights -- but it takes exactly the behavior the school's own culture already condemns and presents it as the school's actual product."
critical-questions:
  - "Lakoff notes a possible counter-justification: if slipups from the ideal reliably trend in one direction (busy nurturant parents tend to slip toward spoiling, drinking strict parents tend to slip toward abuse), the stereotype might track a real statistical pattern rather than laundering a disowned exception. He also notes this justification is 'rarely, if ever' actually demonstrated. Does the diagnostic test (does the group disown the variant?) still identify pathological stereotyping correctly even in the rare case where the directional-slippage claim turns out to be true and demonstrated?"
  - "The mechanism requires identifying what a group's 'central adherents' actually reject, which assumes a settled, identifiable mainstream position for every group being stereotyped. For a category with genuinely contested or fragmented internal norms, who gets to establish what counts as the disowned variant versus the accepted core, and could that determination itself become a site of the same laundering the diagnostic is meant to catch?"
