id: lex-2qc9x
name: poetic-composition-recreates-feeling-via-tranquil-recollection-not-raw-venting
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Recognize this pattern when someone invokes Wordsworth's most-quoted phrase — 'poetry is the spontaneous overflow of powerful feelings' — as license for a single-stage theory of creative production: feel something intensely, then transcribe the feeling directly onto the page in the moment, with rawness and immediacy standing in for quality. That single-stage reading is a genuine misreading of Wordsworth's own claim, not just a vulgarization of it, and Wordsworth himself supplies the correction in the same Preface, less than seventy-five lines after the phrase everyone quotes. The actual claim is explicitly TWO-STAGE, and the second stage is where Wordsworth says successful composition actually begins: 'I have said that Poetry is the spontaneous overflow of powerful feelings: it takes its origin from emotion recollected in tranquillity: the emotion is contemplated till by a species of reaction the tranquillity gradually disappears, and an emotion, kindred to that which was before the subject of contemplation, is gradually produced, and does itself actually exist in the mind. In this mood successful composition generally begins.' Unpack the mechanism precisely, because every clause is crucial: (1) STAGE ONE — an original powerful feeling is experienced, in the moment, under 'the actual pressure of those passions.' This is real and necessary (Wordsworth is emphatic elsewhere that a poet must be 'possessed of more than usual organic sensibility'), but it is raw material, not finished art, and it is NOT the stage at which composition happens. (2) THE GAP — time passes; the poet is not composing during stage one, and is often not even trying to. (3) STAGE TWO — the poet later recollects the original emotion 'in tranquillity': a calm state, structurally distant from the original passion's grip. Critically, tranquillity is not the endpoint either — it is the UNSTABLE STARTING CONDITION of stage two, and its disappearance is the whole mechanism: the poet contemplates the recollected emotion, and 'by a species of reaction the tranquillity gradually disappears.' (4) THE PRODUCT OF STAGE TWO is not the original emotion returning unchanged. It is 'an emotion, KINDRED to that which was before the subject of contemplation' — related, resonant, recognizably of the same family, but a new and distinct emotional event, freshly and actually present in the mind ('does itself actually exist in the mind'), produced by the act of contemplation itself rather than merely remembered as a fact about the past. (5) ONLY AT THIS POINT — kindred emotion actually live in the mind, tranquility already dissolving back into feeling but now a feeling that has been PASSED THROUGH contemplation once — does Wordsworth say 'successful composition generally begins.' The raw original feeling from stage one is never the compositional material; the re-created, contemplation-mediated, kindred feeling from stage two is. This is why 'spontaneous overflow' cannot mean 'write it down while you're still feeling it': the overflow Wordsworth describes is not spontaneous in TIME (it requires the gap, the recollection, the contemplative labor of reaction) — it is spontaneous in the sense that the kindred emotion, once contemplation has done its work, arises and asserts itself rather than being willed or manufactured word-by-word; the spontaneity is at the far end of a deliberate process, not a substitute for one. Wordsworth's own surrounding argument supports this: he insists a poet's value comes only from someone 'who being possessed of more than usual organic sensibility, had also thought long and deeply,' because 'our continued influxes of feeling are modified and directed by our thoughts, which are indeed the representatives of all our past feelings' — thought is explicitly the accumulated, compressed residue of a lifetime of felt experience, and it is this thought-mediated, habituated capacity ('such habits of mind') that stage-two contemplation draws on, not unmediated access to the original moment. Distance and calm are not the ENEMY of authentic feeling in this account, and they are not mere technical polish applied after 'the real feeling' has already been captured — they are the necessary MEDIUM through which a feeling becomes something that can be worked into art at all. A feeling still raw with 'actual pressure' is, on Wordsworth's own account elsewhere in the Preface, too disordered and too painful to be composed from directly; tranquility is what makes the passion re-enterable as material rather than merely endurable as event. Cross-domain applications beyond literary theory: (a) MEMOIR, TRAUMA WRITING, AND GRIEF WRITING — workshop and therapeutic-writing advice to wait before writing about a raw loss or trauma is frequently framed as a caution against being 'too close to it to write well,' which is exactly Wordsworth's claim in modern idiom: the writing that works is not the transcription of the wound in the moment but the re-created, kindred version of that feeling summoned back under calmer conditions, where craft and contemplation can operate on it; (b) SONGWRITING AND COMPOSING FROM PERSONAL EXPERIENCE — the common songwriter's report of writing the strongest version of a breakup song or grief song months or years after the event, not during it, when the feeling can be deliberately re-summoned and shaped rather than simply endured; (c) THERAPY AND JOURNALING PRACTICE — expressive-writing protocols that ask a person to revisit and re-narrate a difficult experience from some remove, rather than only venting about it while still in acute distress, mirror the same two-stage structure: re-entering feeling under conditions calm enough to actually process and shape it; (d) ANY CRAFT DISCIPLINE WHERE 'AUTHENTICITY' IS MISTAKENLY EQUATED WITH 'UNEDITED FIRST TAKE' — first drafts, first takes, and diary entries written in the heat of an emotion are frequently treated as more 'real' or 'honest' than revised work; Wordsworth's account inverts this by locating the actually-successful compositional moment at the SECOND, contemplation-mediated pass, not the first. Failure modes: (a) READING 'SPONTANEOUS OVERFLOW' IN ISOLATION FROM THE RECOLLECTION-IN-TRANQUILLITY CLAUSE THAT FOLLOWS IT — this is the single most common misreading of Wordsworth, and it inverts his actual claim about when composition succeeds; (b) TREATING TRANQUILLITY AS MERELY A CALM MOOD TO WRITE IN, RATHER THAN AS THE UNSTABLE PRECONDITION WHOSE CONTROLLED DISSOLUTION ('the tranquillity gradually disappears') IS THE GENERATIVE MECHANISM ITSELF — the tranquillity is not where the poem is written, it is the springboard that contemplation pushes off from; (c) COLLAPSING 'KINDRED EMOTION' INTO 'THE SAME EMOTION REMEMBERED' — Wordsworth is explicit that the second-stage emotion is new and 'actually exist[s] in the mind,' not merely recalled as a historical fact about how one once felt; treating stage two as passive memory-retrieval rather than active re-creation flattens the claim; (d) ASSUMING THIS MEANS COLD, EMOTIONLESS CRAFT SUPERSEDES FEELING — Wordsworth's claim is not that thought or technique replaces feeling, but that thought (as 'the representative of all our past feelings,' built by long habituated contemplation) is what allows feeling to be re-summoned in workable form; the end state is still emotional, arguably MORE fully and deliberately felt than the original disordered rush. Use this atom when: (i) someone cites 'spontaneous overflow of powerful feelings' to justify skipping revision, distance, or delay in emotionally-charged creative or expressive work; (ii) a creative or therapeutic-writing question turns on whether raw immediacy or reflective distance produces the more truthful or more effective result; (iii) evaluating advice like 'write it while it's still fresh' against advice like 'wait until you can see it clearly' — Wordsworth's account explains why the second need not sacrifice authenticity for craft, because on his account the reflective pass is where the real, actually-existing emotion of the finished work comes from."
