lineage:
  - source: primary
    text: fox-1957-circumscribed-responsibility
    citation: "Renée C. Fox, \"Training for Uncertainty,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.224-225."
    quote: "'the responsibilities a third-year student is asked to assume are carefully circumscribed.... He does not have to decide upon medicaments and other therapeutic procedures — weighing the potential risks involved against the possible benefits that may accrue to his patients. A student's responsibilities in the clinic are equally limited and specific.'"
