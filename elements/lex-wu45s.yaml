name: delivered-value-converts-skepticism-before-identity-is-known
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When you need a skeptical, resource-strapped person to invest in you before they have any reason to trust you, don't try to win them over with explanation or an appeal to who you really are -- deliver something of concrete value first, on the smallest possible ask, and let the returned value do the persuading. In Eastman's telling, an old man takes in a strange ragged boy only grudgingly, at his wife's insistence, and stays openly hostile to the very first small investment asked of him: 'And why should I make arrows for a strange little ragged boy?' he grumbles -- there's no warmth here, just resentment at spending a poor household's scarce resources on an unknown dependent. He makes the arrows anyway, minimally, and the boy immediately returns more than was invested: birds, meat, soup, feathers for a pillow. Only then does the old man's stance shift, and it shifts entirely on the strength of what came back, not on anything the boy has said about himself: 'You have done well, my grandson!' The boy never reveals his real identity or explains himself at any point in this exchange -- the old man has no idea he's harboring someone who will later kill a Red Eagle and marry a chief's daughter. His change of heart tracks the delivered value alone, at the smallest scale the household could risk. Diagnostic move: when trying to earn investment from someone with every rational reason to be stingy and suspicious of a stranger, don't lead with your credentials or your case for why you deserve trust -- ask for the smallest possible initial investment, deliver back more value than it cost, and let repeated small returns do the work that argument and reputation can't do with someone who has nothing to spare on faith."
