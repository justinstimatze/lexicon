lineage:
  - source: primary
    text: Rawls-1971-TheoryOfJustice
    citation: "John Rawls, *A Theory of Justice* (Cambridge, MA: Belknap Press of Harvard University Press, 1971; original edition). §9 'Some Remarks about Moral Theory,' pp. 48-51 introduces and characterizes *reflective equilibrium* as the methodological state in which one's considered judgments and one's chosen principles cohere after each has been adjusted in light of the other. §4 'The Original Position and Justification,' pp. 19-21 motivates the method as the right standard against which justice-as-fairness is to be assessed. The distinction Rawls draws at §9 between NARROW reflective equilibrium (smoothing minor discrepancies within already-shared principles) and WIDE reflective equilibrium (considering all plausible alternative principles and the philosophical arguments for them, allowing radical revision) is the source of the transferable claim: the wide form is the one moral philosophy seeks, and it is achievable only by sustained engagement with alternative principles rather than by direct introspection on existing judgments. Norman Daniels 1979 'Wide Reflective Equilibrium and Theory Acceptance in Ethics' (J. Phil. 76:256-282) elaborates Rawls's framework, distinguishing background theories (about persons, society, moral psychology) as a third pole of mutual adjustment alongside principles and considered judgments — turning the bilateral mutual-adjustment of §9 into a tripolar coherentist method. The transferable structural primitive: the right account of a normative domain is not the one fitting intuitions prior to examination nor the one derived from principles without regard to intuitions, but the one in which principles and considered judgments cohere after iterative mutual revision."
    quote: "[Rawls 1971 §9 (Belknap, p. 48-49), the decisive reflective-equilibrium passage:] 'I now turn to the notion of reflective equilibrium. The need for this idea arises as follows... In describing our sense of justice an allowance must be made for the likelihood that considered judgments are no doubt subject to certain irregularities and distortions despite the fact that they are rendered under favorable circumstances. When a person is presented with an intuitively appealing account of his sense of justice (one, say, which embodies various reasonable and natural presumptions), he may well revise his judgments to conform to its principles even though the theory does not fit his existing judgments exactly. He is especially likely to do this if he can find an explanation for the deviations which undermines his confidence in his original judgments and if the conception presented yields a judgment which he finds he can now accept. From the standpoint of moral philosophy, the best account of a person's sense of justice is not the one which fits his judgments prior to his examining any conception of justice, but rather the one which matches his judgments in reflective equilibrium. As we have seen, this state is one reached after a person has weighed various proposed conceptions and he has either revised his judgments to accord with one of them or held fast to his initial convictions (and the corresponding conception).' [Rawls §9, pp. 49-50, the wide-vs-narrow distinction:] 'There are, however, several interpretations of reflective equilibrium. For the notion varies depending upon whether one is to be presented with only those descriptions which more or less match one's existing judgments except for minor discrepancies, or whether one is to be presented with all possible descriptions to which one might plausibly conform one's judgments together with all relevant philosophical arguments for them. In the first case we would be describing a person's sense of justice more or less as it is although allowing for the smoothing out of certain irregularities; in the second case a person's sense of justice may or may not undergo a radical shift. Clearly it is the second kind of reflective equilibrium that one is concerned with in moral philosophy.' [Practitioner-extraction for transferable lex-kxk99: the right account is not bottom-up-from-judgments nor top-down-from-principles; both poles are revisable under the discipline of finding coherence. Rawls flags the failure mode of narrow equilibrium directly: smoothing local discrepancies without exposing the agent to genuinely alternative principles produces a fit that mistakes itself for justification. Substrate generalization: when principles and considered judgments are anchored at different points in the same normative or interpretive domain, neither is sacred; the method is iterative mutual revision toward coherence, with wide presentation of alternatives as a discipline against pseudo-equilibrium.]"
  - source: cross-attestation
    text: cross-domain-mutual-adjustment-of-theory-and-considered-judgments
    citation: "Cross-domain attestation that the structural primitive — iterative mutual revision between general principles and confident considered judgments to reach coherence — recurs across normative philosophy, legal interpretation, scientific methodology, software design, and self-interpretive practice. (a) Normative philosophy: Daniels 1979 'Wide Reflective Equilibrium and Theory Acceptance in Ethics' (J. Phil. 76:256-282) generalizes Rawls's method explicitly; DePaul 1993 *Balance and Refinement* defends the method against rationalist + intuitionist critiques; Scanlon 2014 *Being Realistic About Reasons* extends to non-Rawlsian moral theory. (b) Legal interpretation: Cardozo 1921 *The Nature of the Judicial Process* (cf lex-8n237) treats the application of an under-determined rule as a moment where the rule + its accumulated case-judgments mutually adjust — common-law adjudication runs reflective-equilibrium structure even where Rawls's term is not used; Dworkin 1986 *Law's Empire* on `law as integrity` makes the mutual-adjustment of legal principle + judicial intuition explicit. (c) Scientific methodology: Goodman 1955 *Fact, Fiction, and Forecast* (the source Rawls cites as inspiration at §9 footnote 1) describes the analogous mutual-adjustment between inductive rules and accepted inferences as the source of justification for both. (d) Software design: refactoring + design-pattern emergence work the same way — a principle (abstraction, type, pattern) and considered judgments about specific use sites mutually adjust until the principle articulates what the code actually wants. Brooks 1975 *Mythical Man-Month* + Fowler 1999 *Refactoring* on the iterative-mutual-revision shape. (e) Constitutional interpretation in actual practice: the U.S. Supreme Court's evolving doctrine on free speech, equal protection, due process operates as long-running reflective equilibrium between general clauses and accumulated considered-judgments-about-cases; doctrinal revision and case revision both occur over decades. (f) Scientific theory + data fitting: the practice of model-data adjustment in any quantitative science — adjusting model and re-examining outliers, sometimes revising the model + sometimes revising the data classification — mirrors the structure (cf lex-hm8yx scale-separation as the methodological choice of resolution). (g) Therapeutic + self-interpretive practice: a theory of one's pattern (formulation in psychotherapy, or a self-narrative) + considered judgments about specific episodes mutually adjust through sustained reflection; failures of the practice mirror Rawls's narrow-equilibrium failure (the formulation gets smoothed at the edges to fit episode-judgments without ever encountering genuinely alternative theoretical frames). (h) AI interpretability + alignment evaluation: a candidate explanation of a model's behavior + behavioral judgments about specific cases mutually adjust over evaluations; mature evaluation methodology distinguishes when a surprising case warrants revision of the candidate explanation vs revision of the case-judgment (composes with lex-wtkuz descriptive-vs-operational-metacognition)."
    quote: "Across normative philosophy (Daniels 1979 wide reflective equilibrium, DePaul 1993 Balance and Refinement, Scanlon 2014 Being Realistic About Reasons), legal interpretation (Cardozo 1921 + Dworkin 1986 law-as-integrity), scientific methodology (Goodman 1955 Fact Fiction and Forecast — Rawls's own cited inspiration), software design (refactoring + emergent-pattern literature: Brooks 1975 + Fowler 1999), constitutional interpretation in actual practice (long-running mutual revision of doctrine + case-judgments), scientific theory + data fitting (model + outlier classification mutual revision), therapeutic + self-interpretive work (formulation + episode judgments), and AI interpretability + alignment evaluation (candidate explanation + behavioral case-judgments), the same structural primitive recurs — iterative mutual revision between general principles and confident considered judgments until coherence, with the discipline that NEITHER POLE is sacred and that wide exposure to alternative principles is required to distinguish equilibrium from local smoothing. The transferable diagnostic: identify the principle pole and the judgment pole; ask which can be revised to dissolve the mismatch, considering BOTH directions and a wide set of alternative principles; iterate until coherence; recognize narrow equilibrium as a failure mode."
canonical-instances:
  - "Rawls's own derivation of the two principles of justice (TJ §§3-4, §11): the original-position thought experiment generates candidate principles; Rawls then tests them against considered judgments (`we feel sure that religious intolerance and racial discrimination are unjust`); when the principles fit those confident judgments and offer a coherent account of more controversial cases, the equilibrium is reached. Rawls treats this matching against considered judgments as the indispensable argument for the principles, not the original-position derivation alone."
  - "Common-law adjudication (Cardozo 1921, lex-8n237; Dworkin 1986 Law's Empire): when a general principle (negligence as `failure to exercise reasonable care`) meets a confident case-judgment (the case at bar does or does not fit), the judge moves between revising the principle (carving an exception, restating the standard), revising the case-classification (this is really a different category), and accepting the equilibrium (the principle does apply, judgment confirms). The doctrine evolves over decades through long-running reflective equilibrium."
  - "Goodman 1955 *Fact, Fiction, and Forecast* on inductive justification (Rawls's own cited source at §9): `the rules and particular inferences alike are justified by being brought into agreement with each other. A rule is amended if it yields an inference we are unwilling to accept; an inference is rejected if it violates a rule we are unwilling to amend. The process of justification is the delicate one of making mutual adjustments between rules and accepted inferences; and in the agreement achieved lies the only justification needed for either.` Goodman generalizes the move beyond ethics — Rawls treats this as the prior statement of the structural primitive."
  - "Software refactoring + design-pattern emergence: a developer holding a candidate abstraction (a type, a class hierarchy, a pattern) meets a confident judgment about a specific use site (`this fits the abstraction badly`). Either the abstraction is wrong (revise the principle), the use site is anomalous (revise the judgment + the use site), or the use site is genuinely exceptional (accept the equilibrium with a documented exception). Mature codebases run this iteratively; codebases that always revise the use site to fit the abstraction calcify; codebases that always revise the abstraction to fit each use site fragment."
  - "Constitutional interpretation over decades (free-speech doctrine post-*Schenck* through *Brandenburg* to current; equal-protection doctrine through *Brown* + *Loving* + the 21st-c equal-protection cases): the general clause + accumulated considered-judgments-about-cases mutually adjust over generations. Doctrine revises when a case generates a confident judgment the principle cannot accommodate; case-classifications revise when a confident principle commits the court to a result the case-classification had obscured."
  - "Therapeutic case formulation: a clinician's theory of a patient's pattern (formulation) + the patient's + clinician's judgments about specific episodes mutually adjust. A formulation that always revises episode-classifications to fit itself becomes a Procrustean bed; a clinician who always revises the formulation to fit each new episode lacks any working model. The skilled clinician runs wide reflective equilibrium — alternative formulations are entertained; the one that achieves coherence with episode-judgments without forcing them is preferred."
  - "AI interpretability + alignment evaluation: a candidate explanation of a model's behavior (`this model is using strategy X to do task T`) + behavioral judgments about specific cases mutually adjust through targeted evaluations. A confident case-judgment that the model is not using strategy X warrants either revision of the explanation or revision of the case-classification; the mature methodology runs wide reflective equilibrium by considering alternative explanations + their predictions, rather than narrow smoothing of one favored hypothesis."
  - "operationally distinct from lex-wtkuz descriptive-vs-operational-metacognition: lex-wtkuz distinguishes what-to-do claims from what-is claims; lex-kxk99 names a method that operates WITHIN either register — operational principles + operational judgments can be equilibrated; descriptive principles + descriptive judgments separately. They compose: a confusion of register (treating a what-is mismatch as a what-to-do failure or vice versa) is a characteristic source of pseudo-equilibrium."
  - "operationally distinct from lex-znaau premature-closure: lex-znaau names the failure of stopping iteration too early; lex-kxk99 names the constructive method of iterating until coherence. Lex-0008 is the characteristic failure mode of reflective equilibrium done badly — settling on the first coherent fit without testing alternative principles, the narrow-equilibrium failure Rawls flags at §9."
  - "operationally distinct from lex-8n237 under-determined-rule-admits-multiple-legitimation-methods (Cardozo): Cardozo's framework decomposes ways to apply a rule when it under-determines a case; lex-kxk99 names the iterative-mutual-revision method as such. They compose: Cardozo's methods are the moves available WITHIN reflective equilibrium when the judge must revise either side — which methodological route shapes which pole adjusts."
  - "operationally distinct from lex-r3aug open-impartiality-admits-distant-voices-closed-removes-only-intra-group-bias (Sen): Sen's critique applies to Rawls's specific bounding of the judgment pool to a single political community. Reflective equilibrium as a method can be run with open impartiality (admitting outside considered judgments) or closed (only insider judgments) — lex-r3aug names the boundary-of-judgment-pool question that arises when applying lex-kxk99. The method's procedural shape is independent of how the judgment pool is constructed."
  - "operationally distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions: classification-gaps treats unfilled slots in a classification as predicted-but-unobserved entities (Mendeleev); lex-kxk99 treats principle/judgment mismatches as opportunities for revision in either direction. They compose: a classification gap is one specific kind of principle/judgment mismatch where the principle predicts an entity the judgments do not yet recognize — the reflective-equilibrium question is whether to trust the principle (and seek the entity) or revise the principle (the gap was an artifact of the classification's structure)."
  - "operationally distinct from lex-hm8yx scale-separation: scale-separation is a methodological choice about resolution levels; reflective equilibrium operates at any chosen scale — given a fixed resolution, the mutual revision between principles + considered judgments runs at that resolution. They compose: a scale mismatch can manifest as principle/judgment incoherence the method should expose."
critical-questions:
  - "Wide vs narrow: is this equilibrium NARROW (smoothing local discrepancies within a small set of principles) or WIDE (considering all plausible alternative principles + arguments for them)? Rawls §9 flags this directly — moral philosophy seeks wide reflective equilibrium and narrow is a failure mode disguised as success. Practitioner-discipline: before resting at an equilibrium, ask `what alternative principles have I genuinely considered, and what would the equilibrium look like under each?` If only one principle has been entertained, the equilibrium is narrow."
  - "Symmetry of revision: am I systematically revising judgments to fit the principle (rationalist closure) or systematically revising the principle to fit judgments (intuitionist closure)? The method's whole point is mutual revision — both poles are revisable. If revisions have flowed only one way, the equilibrium is suspect. Practitioner-discipline: track which side has actually moved across the last several iterations and look for asymmetric anchoring."
  - "Background theories (Daniels 1979 extension): are there THIRD-POLE background theories (about persons, society, moral psychology, or the domain's structure) that should be revised in light of the principle/judgment dynamic? Daniels's wide reflective equilibrium adds background theories as a third revisable pole alongside principles + considered judgments. Practitioner-discipline: name the background assumptions being held fixed and ask whether they should themselves be revised."
  - "Judgment pool boundary (Sen 2009 lex-r3aug): whose considered judgments are admitted to the equilibrium? If only insider judgments (CLOSED impartiality), parochial bias shared across the focal group is invisible to the method. If outside judgments are admitted (OPEN impartiality), the method can correct for shared parochialism but the judgment pool requires curation. Practitioner-discipline: ask `what would an informed observer from outside the focal group bring to the judgment pool that is currently missing?` This is the Sen layer over reflective equilibrium."
  - "Asymmetry against physics (Rawls §9 caveat): does the domain allow revising both poles, or is one pole (observations of heavenly bodies, in Rawls's example) fixed independent of the inquirer? In ethics + interpretation BOTH poles are revisable in principle; in physics one pole is fixed externally. Practitioner-discipline: when applying the method outside ethics, ask whether the judgment pole is genuinely revisable or is anchored by something the method cannot reach — if the latter, the method reduces to one-sided theory revision against fixed observations."
  - "Failure mode — pseudo-equilibrium via insulation: is the agent reaching equilibrium by INSULATING the principle from cases that would challenge it (rejecting them as not-real-cases) or by INSULATING the judgments from principles that would revise them (rejecting them as not-real-principles)? Insulation produces local coherence that mistakes itself for justification. Practitioner-discipline: actively seek out the cases or principles being rejected on insulation grounds and reintroduce them into the pool."
