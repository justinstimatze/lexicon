  - source: primary
    text: farrow-marantz-2026-new-yorker-sam-altman-may-control-our-future
    citation: "Ronan Farrow and Andrew Marantz, 'Sam Altman May Control Our Future—Can He Be Trusted?' *The New Yorker* (April 13, 2026, online April 6, 2026). Investigative profile reconstructing the November 2023 OpenAI board crisis from previously-undisclosed seventy-page Sutskever-Toner-McCauley memos, court depositions, and ~50 interviews with current and former insiders. The article's structural finding is that OpenAI's nonprofit governance — explicitly designed to make safety-mandate enforceable against the CEO — failed at the specific point where enforcement would have damaged what the constraint was meant to protect: 'The board was backed into a corner. \"Control Z, that's one option,\" Toner said—undo the firing. \"Or the other option is the company falls apart.\"' Microsoft's $13B equity stake, the 770-of-770 employee threat to quit and move to Microsoft, and Thrive Capital's halt on the tender offer collectively meant that exercising the board's safety-mandate would destroy the entity the mandate was meant to govern. The constraint structure was preserved in form (board still has firing authority) but operationally inert (exercising it triggers entity-collapse and Microsoft-absorption). Sutskever's deposition: 'I felt that if we were to go down the path where Sam would not return, then OpenAI would be destroyed' — the diagnostic acknowledgment that the constraint had become unbinding. In-copyright (Condé Nast 2026)."
    quote: "[Farrow & Marantz 2026, opening of the article:] 'In the fall of 2023, Ilya Sutskever, OpenAI's chief scientist, sent secret memos to three fellow-members of the organization's board of directors. For weeks, they'd been having furtive discussions about whether Sam Altman, OpenAI's C.E.O., and Greg Brockman, his second-in-command, were fit to run the company... The firm was established as a nonprofit, whose board had a duty to prioritize the safety of humanity over the company's success, or even its survival. The C.E.O. had to be a person of uncommon integrity.' [The structural-revelation passage:] 'Microsoft, which had invested some thirteen billion dollars in OpenAI, learned of the plan to fire Altman just moments before it happened... Within hours of the firing, Thrive had put its planned investment on hold and suggested that the deal would be consummated—and employees would thus receive payouts—only if Altman returned... Microsoft soon announced that it would create a competing initiative for Altman and any employees who left OpenAI. A public letter demanding his return circulated at the organization... A majority of OpenAI employees ultimately threatened to leave with Altman. The board was backed into a corner. \"Control Z, that's one option,\" Toner said—undo the firing. \"Or the other option is the company falls apart.\"' [Sutskever's deposition, quoted later in the article:] 'I felt that if we were to go down the path where Sam would not return, then OpenAI would be destroyed.' [Practitioner-extraction: the New Yorker piece documents the transferable mechanism at the OpenAI scale — the safety-mandate became operationally inert at the moment exercising it would destroy what it was meant to protect. The constraint structure remained nominal (Altman submitted to investigation; new board seats reshuffled) but functionally the verdict was decided by the economic essentiality, not by the safety-mandate's terms.]"
  - source: primary
    text: hao-2025-empire-of-ai-ch-1-rotten-foundation
    citation: "Karen Hao, *Empire of AI: Inside the Race for Total Domination* (Penguin / Allen Lane, 2025). Hao is the journalist who first broke the OpenAI deviance-from-stated-mission story for MIT Technology Review in 2020; the book is the long-form reconstruction. Chapter 1 'Rotten Foundation' provides the parallel reconstruction of the November 2023 crisis with direct quotation of Toner's articulation: 'If this action destroys the company, it could in fact be consistent with the mission.' Hao's analytical frame (p.343 in the source): 'The ouster and reinstatement of Altman in November 2023 was final proof that the governance experiment had failed. Not simply because OpenAI's nonprofit board buckled under moneyed interests, dissolving the last remnant of the organization's altruistic facade. It illustrated in the clearest terms just how much a power struggle among a tiny handful of Silicon Valley elites is shaping the future of AI.' The 'OpenAI is nothing without its people' employee-mass-signaling becomes Hao's worked-example of how systemic essentiality (employee solidarity that enables a Microsoft-absorption threat) extinguishes the constraint structure's binding force. Cross-attests the New Yorker reconstruction from a different journalist's reporting and a different time horizon (Hao's reporting predates the New Yorker piece by ~12 months and is based on different documentary sources)."
    quote: "[Hao 2025 Ch.1 'Rotten Foundation,', reconstructing the executive-board confrontation:] 'Under an onslaught of questions, the four board members repeatedly evaded making further disclosures, citing their legal responsibilities to protect confidentiality. Several leaders grew visibly enraged... The gathered leadership pressed the board to resign and hand their seats to three employees, threatening to all quit if the board didn't comply immediately. Jason Kwon, the chief strategy officer, a lawyer who had previously served as OpenAI's general counsel, upped the ante. It was in fact illegal for the board not to resign, he said, because if the company fell apart, this would be a breach of the board members' fiduciary duties. The board members disagreed. They maintained that they had carefully consulted lawyers in making the decision to fire Altman and had acted in accordance with their delineated responsibilities. OpenAI was not like a normal company, its board not like a normal board. It had a unique structure that Altman had designed himself, giving the board broad authority to act in the best interest not of OpenAI's shareholders but of its mission: to ensure that AGI, or artificial general intelligence, benefits humanity. Altman had long touted the board's ability to fire him as its most important governance mechanism. Toner underscored the point: \"If this action destroys the company, it could in fact be consistent with the mission.\"' [Hao's structural diagnosis:] 'The ouster and reinstatement of Altman in November 2023 was final proof that the governance experiment had failed. Not simply because OpenAI's nonprofit board buckled under moneyed interests, dissolving the last remnant of the organization's altruistic facade. It illustrated in the clearest terms just how much a power struggle among a tiny handful of Silicon Valley elites is shaping the future of AI.' [Practitioner-extraction: Hao's reconstruction adds the diagnostic vocabulary — 'the governance experiment had failed' — that names the structural-pattern: even with formal authority preserved, the board's mandate was operationally extinguished by the entity's systemic essentiality. Toner's 'if this action destroys the company, it could in fact be consistent with the mission' is the diagnostic-articulation that the constraint structure was designed to permit entity-destruction, but the surrounding economic-political reality made entity-destruction the unacceptable cost. Both conditions held simultaneously; the contradiction is the transferable mechanism lex-kahec names.]"
