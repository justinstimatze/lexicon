id: lex-tg83s
name: reject-total-surrender-and-suicidal-resistance-seek-shelter-instead
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When facing a much stronger opponent, don't accept the framing that your only options are total capitulation or a doomed fight -- both extremes are being offered to you as though they were the complete menu, and a third option that preserves both your position and your survival is usually available. Kautilya stages this as a debate between two named teachers, each proposing an extreme, before rejecting both: 'Bharadvaja says that a weak king, when attacked by a stronger king, shall bend like a reed and surrender his all. For he who submits to a strong king bows to Indra. [On the other hand] Vishalaksha says that a weak king shall fight with all his resources, for only with valour can one surmount calamities. It is the dharma of a kshatriya to fight, whether he wins or loses. Kautilya disagrees [with both]. He who surrenders all lives only a life of despair, like a sheep that has strayed from its herd. [On the other hand,] one fighting with a tiny army perishes like one trying to cross the ocean without a boat. It is better to seek the protection of a powerful king or an impregnable fort.' Both rejected positions share a hidden premise: that the confrontation must be resolved entirely on the stronger party's terms, either by giving them everything now or by contesting them directly and losing everything at once. The third option doesn't contest that premise by finding a clever way to win the fight or a clever way to make surrender less total -- it exits the frame entirely by acquiring a resource (a stronger patron, a fortified position) that neither side of the original debate considered, which changes the terms of the confrontation rather than picking a point along the axis the debate assumed was the only one available. Diagnostic move: when a situation is presented as a choice between total submission and a fight you can't win, check whether both options share a premise -- that the confrontation has to be resolved now, on the stronger party's terms, using only the resources already in play -- and look specifically for a move that acquires new leverage (an ally, a stronger position, more time) rather than a move that just picks a better point between the two extremes you were offered."
