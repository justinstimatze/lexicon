  - source: primary
    text: cross-proverb-convergence-reap-what-you-sow-chickens-come-home-to-roost
    citation: "Multi-tradition proverb-attestation. The transferable claim — actions have structural consequence-tails that propagate through feedback channels and eventually return to the actor — is attested across at least three independent proverb-traditions. (a) MIEDER ed., *A Dictionary of American Proverbs* (Oxford 1992): 20 distinct entries surveyed on this family: 'As you sow, so shall you reap,' 'You reap what you sow,' 'Chickens come home to roost.' (b) SIMPSON-SPEAKE eds., *The Oxford Dictionary of Proverbs* (5th ed. 2008): 17 distinct entries with extensive lineage tracing — 'As you SOW, so you reap' as canonical with biblical roots (Galatians 6:7: 'Whatsoever a man soweth, that shall he also reap'); 'Sow the wind, reap the whirlwind' from Hosea 8:7; 'Curses, like chickens, come home to roost' (recorded 1390 Chaucer 'The Parson's Tale'). (c) OWOMOYELA, *Yoruba Proverbs* (University of Nebraska Press 2005): 5 entries on the same family — the Yoruba tradition encodes the consequence-action link through agricultural metaphors paralleling the English biblical sowing-reaping idiom, plus distinctive Yoruba framings ('the cat that wishes ill for the rat, the rat wishes the same for the cat'). Three-tradition convergence with biblical-tradition Old Testament rooting (Hosea 8:7 in Mesopotamian context) and Yoruba traditional teaching is the transferability evidence. Distinct from lex-spm8x feedback-loop-as-mechanism because that atom names feedback-as-mechanism-class; this atom names the SPECIFIC observation that an actor's actions have a consequence-tail that eventually returns to them. Distinct from lex-prwfm cobra-effect (perverse incentive consequences) because cobra-effect is the DOWNSTREAM-HARM specific instance; this atom is the upstream general observation about consequence-tails. Distinct from lex-urh87 Mauss gift-as-three-obligations: Mauss names the binding-mechanism of reciprocal exchange; this atom names the system-feedback observation that ALL actions (not just gifts) have tails. Distinct from lex-mwgep positive-feedback-amplifies-early-events because that atom is about amplification mechanisms; this atom is about consequence-RETURN. Distinct from lex-z2fkk externalizing-onto-undefended-commons because that atom names a competitive-advantage strategy; this atom is the observation that even externalized costs often have tails that return (the proverb-tradition predicting Garret Hardin 1968 commons-tragedy as a special case of buffering-is-finite). Distinct from lex-uxqdz egalitarianism-is-actively-maintained-reverse-dominance because that atom is about hierarchy-suppression mechanism; this atom is the general consequence-return observation. Distinct from lex-q77ce marginal-cost-of-correction-grows-with-deferral because lex-q77ce says ACT EARLY before the cost compounds; this atom says ACTIONS HAVE TAILS that will return to you. They compose — defer correction and the consequence-tail compounds AND returns."
    quote: "[Mieder ed. *Dictionary of American Proverbs* 1992, multiple entries:] 'As you sow, so shall you reap. [...] You reap what you sow. [...] Chickens come home to roost.' [Simpson-Speake *Oxford Dictionary of Proverbs* 2008, entry 'As you SOW, so you reap':] 'Galatians vi. 7: Whatsoever a man soweth, that shall he also reap. 1567 G. FENTON Bandello II. xiii. They must reape as they have sowne. 1576 PETTIE Petite Pallace I. 199 He that sowes evill must reap also evill. 1853 R. C. TRENCH Proverbs and their Lessons ii. 53 As we have sown, so we shall reap. 1992 J. R. SCHMIDT Twin Tornadoes 19 The story of his ne'er-do-well daughter, Maria, lays the foundation for the comment that you reap what you sow.' [Same volume, the 'sow the wind' entry tracing to Hosea 8:7:] '[Old Testament:] For they have sown the wind, and they shall reap the whirlwind.' [Owomoyela *Yoruba Proverbs* 2005, on cross-cultural agricultural framing:] 'The cat that wishes ill for the rat, the rat wishes the same for the cat.' [The cross-cultural pattern: the English biblical-tradition's sowing-reaping idiom + the Old Testament-rooted whirlwind-from-wind imagery + the Yoruba agricultural-and-relational consequence-return formulation all encode the same structural observation — actions have consequence-tails that propagate through feedback channels and eventually return to the actor. The atom extracts this structural observation without commitment to karmic or moral framing.]"
canonical-instances:
  - "Technical debt with consequence-tail: code shortcuts taken under deadline pressure compound through downstream development costs. The immediate signal (shipping faster) is decoupled from the eventual consequence (debugging time, refactor cost, hiring difficulty). When the consequence-tail returns, the engineer who shipped the shortcut may have moved on; the cost falls on later maintainers (the externalized form) OR returns through reputation effects if the cost is traced. Same mechanism — buffered consequence eventually surfaces."
  - "Pollution and commons-tragedy: a single firm's pollution emission has a vanishingly-small immediate effect on the actor (the commons absorbs it). The consequence-tail is the multi-decade accumulation in the commons, eventually affecting all firms in the commons including the original emitter. Garrett Hardin 1968 *Tragedy of the Commons* formalizes the structural feature the proverb-tradition encoded centuries earlier."
  - "Trust violations in a tight community: a single small deception (a misleading promise, a back-handed favor) registers small immediate cost (no immediate confrontation). Its consequence-tail propagates through the community's gossip network (Dunbar 1996; Sapolsky 2017) and eventually constrains the actor's future opportunities. The buffer (general trust capital) is finite. The proverb-tradition's 'chickens come home to roost' framing predicts this exact failure mode."
  - "Reputational consequence-tail in technical communities: code or content shipped under one's name accumulates a consequence-tail (good or bad). A poor pull request gets cached in colleagues' assessment; a well-named project becomes a hiring signal years later. The actor experiences the consequence-tail as a slow drift in opportunities rather than discrete events. The propagation channel is reputation-aggregation."
  - "Distinguished from cases where the consequence-tail genuinely doesn't return: one-shot interactions with anonymous strangers in non-repeated games; pollution truly externalized onto a population the actor never interacts with; actions whose consequences fall on a different generation. The atom applies when the actor is embedded in a sufficient feedback system. When the consequence-tail genuinely terminates outside the actor's feedback loop, the atom does not apply — but the moral question of imposing the cost on others is a separate substrate question."
  - "Distinguished from karma-as-cosmological-claim: the atom is silent on supernatural mechanisms. The consequence-tail is structural — it follows from the actor being embedded in a feedback system. Religious-traditions code the structural observation in supernatural framings, but the transferable claim survives the framing-strip: actions have tails that propagate through reachable feedback channels."
  - "Distinguished from cobra-effect (lex-prwfm): cobra-effect names a specific failure-mode where incentives generate perverse downstream behavior. This atom is the general upstream observation that actions have consequence-tails — cobra-effect is one named instance where the consequence-tail is perverse rather than aligned."
critical-questions:
  - "What is the feedback channel through which the consequence-tail returns? Name it explicitly: reputation network, code base, ecosystem, biological body, etc. If you cannot name the channel, the consequence-return may not actually reach you and the atom may not apply."
  - "Is the buffer that is currently absorbing the consequence FINITE? Pollution buffers, trust capital, immune system reserves are all finite. If finite, the consequence-tail will eventually exceed buffering capacity. If infinite (a true sink), the consequence-tail genuinely terminates outside your feedback loop."
  - "How long is the time-lag between action and consequence-return? Long lags (decades for pollution; years for trust-violation accumulation) make the link invisible at decision-time. The atom's epistemic discipline is to extend your prediction horizon to encompass the lag. If the lag is shorter than your decision-horizon, ignoring it is rational; if longer, ignoring it is the failure mode the atom names."
  - "Are you embedded in a system with sufficient feedback channels for the consequence to return? An actor in an isolated one-shot interaction with strangers has weak consequence-tails. An actor embedded in a community, a network, an ecosystem, has strong consequence-tails. The atom applies more strongly to embedded actors."
  - "Is the consequence-tail genuinely structural or are you projecting moral framing? The atom's transferable claim is structural — actions propagate through causal chains. Moral framings (karma, deserved punishment, just-world hypothesis) can be confounded with structural feedback. Apply the atom only when you can name the structural propagation channel, not when you are reading moral patterning into noise."
status: active
