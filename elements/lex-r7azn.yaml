id: lex-r7azn
name: condition-a-role-derived-rule-on-the-rationale-that-justifies-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a rule was created to enact some role or ideal ('act like a doctor,' 'be a team player'), and someone is asked to follow it in a specific case where the rule's own underlying rationale doesn't apply, expect the mismatch to surface as a complaint about the role itself — and expect the right fix to be conditioning the rule on its rationale, not abandoning the rule or enforcing it uniformly regardless of the mismatch. Goss documents this through a required home-visit rule in a medical-training program. A student-representative objected: 'They've let us down. They promised us this wouldn't be like [a course we had last year] where we had to go to patients' homes for no good medical reason, and now that's exactly what we have to do... Take my family, for instance. Dr. N. knows the case — she has no difficulty climbing the steps, she is being adequately treated in the clinic, and there's no reason in the world I can think up to go to see her.... Going to the home without a good medical reason makes us like students again, and I thought we were supposed to act like doctors.' A different representative pushed back from his own experience: 'My patient used to break appointments regularly in the clinic. When I went to her home, I found out why... I think there's a lot to be gained by home visits.' The first representative's reply pinpoints the actual distinction at stake: 'But you have a good medical indication for going into the house, which is a very different situation from some other members of the class!' Both students were right about their own cases — the disagreement wasn't about whether home visits are valuable, it was that the rule as written didn't distinguish visits WITH a medical rationale from visits WITHOUT one, even though the rule existed specifically to enact the 'family physician' role, whose logic only calls for a visit when there's a medical reason to make one. Goss names the general shape of the problem staff eventually recognized: 'whether it was feasible to request students to take on the role of \"family physician,\" and yet at the same time, ask them to do something which in particular cases conflicted with that role — e.g., make a home visit when there was no medical indication.' The fix conditioned the rule on its own rationale rather than either abandoning it or leaving it uniform: 'they decided that students should be expected to make the house call unless no medical indication existed; in these cases, students would have to justify their decision to a faculty member.' Diagnostic move: when a rule created to enact a role or ideal produces a complaint in a specific case, check whether the rule as literally written actually tracks the rationale that justified creating it in the first place, or whether it was written as a blanket requirement that happens to usually, but not always, coincide with that rationale. The fix is rarely 'keep the rule as-is' or 'drop the rule' — it's making compliance conditional on the presence of the rationale itself, with a justification step for the edge cases where the two come apart."
