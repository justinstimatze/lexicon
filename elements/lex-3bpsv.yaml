id: lex-3bpsv
name: a-novices-anxiety-invokes-every-resource-not-the-sufficient-one
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A first-time practitioner, uncertain of the correct minimal technique and desperate for the outcome to succeed, can invoke every available resource rather than the single one that would have sufficed -- and only in retrospect, with later-earned understanding, recognize that one alone would have been enough. Performing his first cure, Black Elk calls on the cup of water, the herb, the pipe, the drum, the four quarters, and every power of his vision at once. Looking back, he names the excess plainly: 'You see, I had never done this before, and I know now that only one power would have been enough. But I was so eager to help the sick little boy that I called on every power there is.' The anxiety, not a correct diagnosis of what the situation required, is what drove the scale of the response."
related: []
evokes: [black-elk-speaks, the-first-cure, only-one-power-would-have-been-enough, i-called-on-every-power-there-is, novice-invokes-everything]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch17-first-cure
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 17, 'The First Cure.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "You see, I had never done this before, and I know now that only one power would have been enough. But I was so eager to help the sick little boy that I called on every power there is."
canonical-instances:
  - "A new surgeon performing their first solo operation orders every test and consults every specialist available, rather than the one or two that would have actually clarified the diagnosis, and only years later, with real experience, recognizes how much of it was unnecessary."
  - "A first-time public speaker rehearses every possible objection, prepares slides for tangents nobody asks about, and over-explains every point out of nervous thoroughness, later realizing a much shorter, more focused talk would have landed better."
  - "A junior lawyer drafting their first major contract includes every protective clause they've ever seen, rather than the specific terms the deal actually required, and only with experience learns to trust a leaner document."
critical-questions:
  - "Does invoking every resource out of anxiety carry any real cost beyond inefficiency, extra time, extra material used, or can genuine excess actually backfire in ways a more minimal, confident approach would have avoided?"
  - "Would Black Elk have actually succeeded with only the one power he now believes would have sufficed, or is his retrospective confidence itself a product of the successful outcome, reasoning backward from a cure that happened to name a simpler cause than the one that was actually operating?"
  - "Is there a way for a first-time practitioner to know in advance which single resource is sufficient, or does that knowledge only ever become available after enough successful and unsuccessful attempts to calibrate against?"
status: active
