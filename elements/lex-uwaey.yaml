id: lex-uwaey
name: removing-the-capacity-for-need-leaves-it-unregulated-not-absent
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Trying to protect someone from a vulnerability by removing the very organ or capacity that would experience it doesn't eliminate the need, it eliminates the normal regulatory relationship to that need, so that when the need eventually does arrive, unavoidably, it arrives unbounded rather than manageable. In the Tsimshian Raven myth Hyde analyzes, a grieving father, hoping to spare his son's spirit from hunger and mortality, has the boy's intestines removed and burned: 'The story is built around the question whether or not the intestines will own the boy. The father hopes they won't... If he could live, a boy without intestines might be freed from hunger, freed from attachments, freed from sickness and death.' The removal doesn't produce a being who is simply free of hunger -- it produces a being with no organ through which hunger could ever be moderated. Once the reborn son is finally exposed to appetite, through a single taste of scab, he becomes not moderately hungry but insatiable: Hyde reads this as the father's own idealism turning against him, 'a restless, hungry beast who is in this world precisely because his father's idealism wounded him.' Diagnostic move: when trying to protect someone from a difficult capacity, a need, a vulnerability, an appetite, by removing their ability to experience it at all rather than helping them develop a working relationship with it, consider whether you're actually preventing the underlying condition or just removing the mechanism that would have kept it within bounds when it eventually shows up anyway."
