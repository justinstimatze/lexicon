id: lex-n9qfv
name: contamination-changes-both-parties-and-is-the-substrate-of-collaboration
type-in: claim
type-out: claim
_tier: atomic
agent-instruction: "When you collaborate with someone (or something) different — a different discipline, a different culture, a different species, a different organization, a different substrate (LLM, biological, mechanical) — Tsing's transferable claim is that collaboration requires CONTAMINATION: you and the other are changed by the encounter, and there is no purity option. The romanticized version of collaboration — two clean parties working together while remaining themselves — is unavailable. Real collaboration across difference produces mutual transformation; both parties carry the encounter forward as part of who they now are. The structural insight: trying to preserve purity ('I will help you without being changed by you') prevents the collaboration from doing the work that requires CROSSING the difference. The crossing IS the work. Practitioner consequence: when you find yourself recoiling from being changed by a collaboration ('that's not me; that's just what this project required'), check whether the recoil is preserving something genuinely yours OR refusing the transformation the collaboration was about. Genuine collaboration leaves marks. Transferable beyond Tsing's ecology/anthropology: research collaborations across disciplines (each side absorbs the other's vocabulary and methods, not just exchanges); cross-cultural integration (assimilation is one extreme, isolation another, and contamination is the work of producing genuinely-new third forms); merger integration (the merged organization is neither pre-merger entity); multi-stakeholder governance; LLM-human collaboration (the human is changed by working with the model, and the model's outputs reshape the substrate it draws from in subsequent training rounds). The 'purity is not an option' framing has a moral and a methodological reading. Morally: the discomfort of being changed is what genuine engagement costs; refusing to be changed is a refusal to genuinely engage. Methodologically: an analysis that treats collaborators as unchanged-by-the-encounter mis-describes how collaboration produces effects — the changes ARE the effects. Practitioner test: at the end of a collaboration, name three ways you are different. If you can't, you may have been preserving purity (refusing the work) or the collaboration may have been more transactional than collaborative. Distinct from lex-wjwuc collision-with-error-as-load-bearing-for-living-truth (Mill): Mill's claim is about ideas needing collision with opposing positions to stay alive; contamination is about agents being changed by collaborative encounter. They compose — Mill provides the EPISTEMIC argument for entertaining opposing views (truth requires friction); Tsing provides the OPERATIONAL DISCIPLINE for cross-difference work (collaboration requires being changed). Both reject the purity-preserving stance. Distinct from lex-rbcsc worldview-as-prior: lex-rbcsc is about cognitive priors shaping interpretation; contamination is about behavioral and identity-level transformation through encounter. They compose: contamination changes the prior. Distinct from lex-3ajns anthropodenial-symmetric-to-anthropomorphism: lex-3ajns is about cross-species evaluative inference; contamination is about cross-difference collaborative engagement. They compose — anthropodenial's distance-grading is one way of refusing contamination across species; contamination is the alternative discipline of allowing the encounter to change you. Distinct from lex-f9dgb assemblage-as-open-ended-gathering: assemblage is the descriptive frame for gatherings; contamination is the operational claim about what happens to participants in the gathering. They compose as paired Tsing primitives — assemblages produce contamination; contamination is the mechanism by which assemblage participants change each other."
