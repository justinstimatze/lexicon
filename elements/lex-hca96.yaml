id: lex-hca96
name: resisting-a-symbolic-concession-tracks-its-threat-to-moral-license
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Fierce resistance to a small, materially costless concession can reveal that the concession threatens the moral justification for an ongoing exploitative practice, rather than threatening anything material. Douglass records that 17th-century slaveholders in Jamaica and Virginia bitterly fought a purely symbolic change -- allowing enslaved people to be baptized -- decades before emancipation was ever on the table: 'Two hundred years ago, the pious Doctor Godwin dared affirm that it was ‘not a sin to baptize a negro,’ and won for him the rite of baptism. It was a small concession to his manhood; but it was strongly resisted by the slaveholders of Jamaica, and Virginia. In this they were logical in their argument, but they were not logical in their object. They saw plainly that to concede the negro's right to baptism was to receive him into the Christian Church, and make him a brother in Christ; and hence they opposed the first step sternly and bitterly. So long as they could keep him beyond the circle of human brotherhood, they could scourge him to toil, as a beast of burden, with a good Christian conscience, and without reproach. ‘What!’ said they, ‘baptize a negro? preposterous!’' The resistance is disproportionate to any material stake in baptism itself -- it costs the slaveholder nothing directly -- and proportionate instead to what the concession would cost the moral story that made the underlying exploitation bearable to its own practitioners. Once the enslaved person is a 'brother in Christ,' continuing to treat him as livestock requires either abandoning that moral framework or confronting the contradiction directly; keeping him permanently outside the category of full personhood was what let the exploitation coexist with a self-image of good conscience."
