name: good-inputs-set-a-floor-that-technique-errors-cant-undercut
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Bittman's first 'golden rule' for a beginning cook is a claim about where quality actually comes from, ahead of any technique tip: 'Anything you cook at home will be good. Start with real ingredients and anything you make will taste better than anything from a box, bag, jar, or fast-food joint. And if you mess up, so what? Even the worst mistakes will probably still be edible.' The mechanism: ingredient quality and execution quality are two separate inputs to the final result, and they don't fail the same way. A cook who botches the technique on good ingredients still ends up with something edible, because the floor was set upstream, at the point of selecting the ingredients, before any knife touched anything. A cook who nails the technique on poor ingredients has no such floor -- there's nothing upstream compensating for what the inputs never had. The same book restates this independent of any specific dish: 'Use good ingredients for terrific results -- no more effort than cooking with mediocre stuff.' Selecting good inputs costs no more skill or time than selecting mediocre ones; it just relocates where quality control happens. The transferable move: when you want a domain to be safe for a beginner to practice in, look for a place upstream of execution where you can raise the floor cheaply -- once the floor is set there, downstream mistakes degrade the result within a narrow band instead of ruining it outright, and a beginner who can't yet get execution right is not thereby exposed to a bad outcome. This is a claim about where to spend a fixed budget of care, not a claim that technique doesn't matter -- a bad enough technique failure still ruins even the best ingredients, and the floor only holds within the range of mistakes a genuine beginner is likely to make."
