id: lex-f2hqc
name: eliminate-rivals-sequentially-with-a-different-manipulation-for-each
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A single opportunist can eliminate multiple rivals one at a time by tailoring a distinct manipulation to each one's specific psychology, funding each round's leverage from the gains of the last, and keeping the overall plan secret from everyone involved. The Panchatantra's jackal Smart picks off a lion, a wolf, and a jackal companion in sequence, each through a different lever — loyalty rhetoric for one, opportunistic framing for another, a fabricated threat for the last — pocketing what each elimination yields to fund the next. His own reasoning states the general principle: 'All understanding may be won, all things be slain, and all be done, if mortals have sufficient wit.' The verse names the operational requirement behind it: 'The wise who wrongs another, pursuing selfish good, should keep his plans a secret, as Smart did in the wood' — the moment any single target compared notes with another, the pattern connecting the eliminations would have been visible."
related: []
evokes: [panchatantra, loss-of-friends, sequential-elimination-via-tailored-manipulation, secrecy-hides-the-pattern-across-targets]
lineage:
  - source: primary
    text: panchatantra-ryder1925-smart-the-jackal
    citation: "The Panchatantra, trans. Arthur W. Ryder (University of Chicago Press, 1925), Book I, 'Smart, the Jackal.' Verified verbatim against a direct extraction of the held copy."
    quote: "The wise who wrongs another, Pursuing selfish good, Should keep his plans a secret, As Smart did in the wood."
canonical-instances:
  - "an executive consolidates power by pushing out three rival department heads in successive quarters, using a different pretext tailored to each one's actual vulnerability — a budget overrun for one, a compliance technicality for another, a manufactured performance complaint for the third — and none of the three ever compares notes to notice they were eliminated by the identical hand using three different stories."
critical-questions:
  - "Would this pattern have been stoppable at any point if the targets had simply talked to each other, and if so, does the fable's real lesson belong to potential victims — coordinate and compare notes — rather than to the operator running the scheme?"
  - "Is tailoring the manipulation to each individual's specific psychology actually necessary for the scheme to work, or would a single repeated tactic have succeeded just as well against unconnected, non-communicating targets?"
status: active
