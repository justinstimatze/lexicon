id: lex-yx7ym
name: simple-local-deterministic-rules-can-be-computationally-universal
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "When dismissing a small-rule system as 'too simple to do anything interesting,' surface that simple local deterministic rules can be Turing-universal — complexity is not a property of rules alone, it emerges from interaction over time."
