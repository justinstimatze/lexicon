id: lex-zvt56
name: three-role-compartments-let-new-variants-emerge-without-external-shocks
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "**Preprint caution: this atom grounds an unreviewed arXiv preprint (submitted Jan 2026), not a peer-reviewed or empirically-validated finding — cite as a formal-modeling proposal and its internal logic, not as an established result about how religions or belief systems actually behave.** Apply when modeling how a belief system, ideology, brand, or any 'infectious' social phenomenon spreads AND fragments over time, and the standard epidemiological SIR-style model (susceptible / infected / recovered, one undifferentiated 'infected' compartment) feels too coarse to explain where new variants come from. Taskin & Lazebnik's structural proposal: split the standard 'infected' compartment into three roles with different transmission behavior — PASSIVE BELIEVERS (hold the belief, don't actively transmit it), ACTIVE MISSIONARIES (actively work to recruit/convert others), and ELITES (a smaller leadership layer shaping doctrine and legitimacy). Layered onto this: demographic turnover (people enter and leave compartments as generations replace each other) and 'mutation-like splitting that endogenously generates new denominations' — meaning new variants of the belief system emerge as a built-in property of the active-transmission dynamics itself, not because of an external shock (a schism-triggering event, a charismatic founder, a political rupture) that has to be separately modeled or assumed. The payoff, per their simulations: this three-role-plus-splitting structure alone 'reproduces canonical qualitative regimes, including emergence from rarity, rapid expansion, long-run coexistence, and transient rise-and-fall movements' — the same small set of role-compartments and their interaction rules generates the whole menu of historically-observed trajectory shapes, without needing a different bespoke explanation for each one. Their sensitivity analysis adds a caution worth carrying into any application: 'modest shifts in recruitment efficacy or retention among active spreaders can qualitatively alter long-run religious landscapes' — the model's outcome regimes have sharp boundaries in parameter space, so small differences in how effectively the ACTIVE MISSIONARY layer specifically recruits or retains people can flip a system from stable coexistence to collapse or takeover, disproportionate to how small the underlying parameter change was. Transferable modeling discipline: when representing the spread of ANY belief/practice/ideology/product-adoption pattern, resist collapsing 'people who have it' into one compartment — ask separately about passive holders, active propagators, and any leadership/elite layer that shapes what gets propagated, because splitting-and-schism (fragmentation into competing variants) may be an emergent property of the active-propagator layer's own dynamics rather than something that needs an external explanation every time it's observed."
related: [lex-869h7, lex-nfdyv]
evokes: [multi-strain-compartmental-model, passive-vs-active-transmission-roles, endogenous-schism-generation, sharp-regime-boundaries, sensitivity-to-recruitment-parameters, SIR-model-extension]
lineage:
  - source: primary
    text: taskin-lazebnik-2026-epidemiological-modeling-religion-dynamics
    citation: "Bilge Taskin and Teddy Lazebnik, 'An Epidemiological Modeling Take on Religion Dynamics,' arXiv:2601.11436 [physics.soc-ph] (submitted 16 January 2026, Jönköping University and University of Haifa). Unreviewed preprint."
    quote: "'Religions are among the most consequential social institutions, shaping collective identities, moral norms, and political organization across societies and historical periods. Nevertheless, despite extensive scholarship describing conversion, competition, and secularization, there is still no widely adopted formal model that captures religious dynamics over time within a unified, mechanistic framework. In this study, we propose an epidemiologically grounded model of religious change in which religions spread and compete analogously to co-circulating strains. The model extends multi-strain compartmental dynamics by distinguishing passive believers, active missionaries, and religious elites, and by incorporating demographic turnover and mutation-like splitting that endogenously generates new denominations. Using computer simulations, we show that the same mechanism reproduces canonical qualitative regimes, including emergence from rarity, rapid expansion, long-run coexistence, and transient rise-and-fall movements... Finally, sensitivity analyses map sharp regime boundaries in parameter space, indicating that modest shifts in recruitment efficacy or retention among active spreaders can qualitatively alter long-run religious landscapes.'"
canonical-instances:
  - "The paper's own claimed regime menu, generated from one role-structured model rather than four separate explanations: emergence from rarity (a small new movement first taking hold), rapid expansion, long-run coexistence (multiple denominations stably persisting side by side), and transient rise-and-fall (a movement that grows then declines without stabilizing) — read as trajectory-shapes an active-missionary/passive-believer/elite compartment structure can produce depending on parameter values, not as four different phenomena needing four different theories."
  - "A social movement, open-source project, or online community splitting into competing factions or forks — read through this atom's transferable claim, the split doesn't necessarily need an external trigger (a specific fight, a specific leader leaving); it can be read as a structural possibility already latent in having an actively-recruiting/actively-organizing layer distinct from a passive base, the same way the model's 'mutation-like splitting' is built into the active-missionary compartment's own dynamics rather than bolted on."
  - "operationally distinct from lex-869h7 slowing-recovery-from-perturbation-warns-of-an-approaching-tipping-point (Scheffer et al. 2009): lex-869h7 is about DETECTING an approaching regime shift in an already-observed system via an early-warning signature (slowing recovery from small perturbations). This atom is about a MODELING DESIGN choice — how to structure the compartments of a spread model so that regime diversity and new-variant generation emerge from the model's own mechanics — and doesn't address detection or early warning at all. Both concern systems with sharp regime boundaries in parameter space, but one is a diagnostic for a specific system already in hand, the other is an a-priori structural proposal for what a model of ANY such system should include."
critical-questions:
  - "This is a single unreviewed preprint with no peer review, replication, or independent validation against historical data beyond one 'reduced calibration variant' the authors built themselves — does the three-compartment structure actually outperform simpler models against real historical affiliation data, or is its main appeal that it CAN reproduce the right qualitative shapes, which a sufficiently flexible model with enough free parameters would be expected to do regardless of whether the mechanism is correct?"
  - "Is the passive-believer/active-missionary/elite three-way split the right decomposition, or an arbitrary one among many possible finer-grained splits (e.g., separating clergy from lay elites, or distinguishing degrees of missionary activity) that happened to be simulated first — has anyone tested whether a two-role or four-role version fits comparably well?"
  - "Does 'mutation-like splitting' in the model correspond to any real, checkable mechanism of how religious schisms actually form historically (doctrinal disputes, succession crises, geographic isolation), or is it a mathematical convenience (a stochastic branching rule) that produces schism-like output patterns without claiming to represent the real causal process?"
