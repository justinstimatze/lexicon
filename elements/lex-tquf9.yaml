lineage:
  - source: primary
    text: kautilya-arthashastra-easily-recaptured-land-courts-destruction
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Planning a Campaign,' 'Losses, Expenses and Gains,' 'An Easily Retaken Gain,' {9.4.7,8}."
    quote: "'A conqueror who captures something easily recaptured by the enemy or stays on land easily retaken only courts destruction. He may, however, seize even [land] which can be easily recaptured by the enemy when he can: weaken the enemy's treasury, army, stores or fortifications; exploit all the wealth of the enemy's mines, productive forests, elephant forests, waterworks or trade-routes; impoverish the enemy's people or relocate them; please the people by suitable means so that when the enemy recaptures the territory his rule would enrage them; sell the gain to the enemy's enemy... or improve the land and then return it so that he may gain a long-lasting ally bound to him [by gratitude].'"
canonical-instances:
  - "A company takes on a client contract it knows it will lose to a competitor's exclusive deal within a year, using the interim to embed its tooling so deeply into the client's workflow that switching away becomes painful, and to earn enough goodwill from the client's staff that they push back against the eventual switch -- the contract itself was never going to last, but the operational lock-in and internal advocacy do."
  - "An interim manager, brought in for a role they know will be handed to someone else once a permanent hire is found, spends the temporary tenure fixing broken processes and mentoring junior staff rather than coasting, so that when the handover happens the department is materially better off and credits the interim manager for it long after the role itself has passed to someone new."
critical-questions:
  - "how does an actor reliably estimate, before committing, whether the effect they're hoping to lock in (a weakened rival, a poisoned well, a grateful ally) will actually persist once the underlying asset reverts, rather than evaporating along with the possession that created it?"
  - "does the 'please the people so the recapture enrages them' tactic risk backfiring if the recapturing party simply continues the popular policies rather than reversing them, leaving the temporary occupier having improved the enemy's position for free with no lasting effect to show for it?"
  - "is there a meaningful difference in trustworthiness or durability between the extractive tactics (mining out value, impoverishing people) and the investment tactic (improving the land for gratitude), given that extraction burns a relationship for a one-time gain while investment bets on a goodwill that could just as easily fail to materialize or be claimed by whoever holds the land afterward?"
