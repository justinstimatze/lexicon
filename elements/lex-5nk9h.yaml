id: lex-5nk9h
name: authority-stacked-with-social-proof
type-in: claim
type-out: posture
_tier: reaction
agent-instruction: "When authority and social proof stack ('the expert says so AND everyone agrees'), expect compliance to escalate non-linearly. The combination is more persuasive than either alone. Surface each lever independently to defuse the stack."
related: [lex-kebfa, lex-hbgcb, lex-5bpee, lex-u8u7y, lex-e98pd, lex-8c35v, lex-3hefg, lex-z9s5d, lex-n8smn, lex-h2ehw, lex-fbc4r]
scaffolds-from: [lex-z9s5d, lex-hbgcb, lex-u8u7y, lex-n8smn, lex-kebfa]
evokes: [the-doctor-and-everyone-else-says-so, six-principles-deployed-together, cialdini-influence-stack-extension, asch-plus-milgram-additive, conformity-licensed-by-authority]
reactants:
  - lex-z9s5d # obedience-to-authority: vertical pressure (a legitimate authority instructs/endorses)
  - lex-hbgcb # social-proof-as-action-signal: horizontal pressure (visible others have adopted it)
conditions:
  - "the two pressures CONVERGE (point the same direction) — when they conflict (authority says X, peers say not-X) the reaction does not fire; the subject faces a choice and reactance dynamics activate. The strength comes from convergence, not mere presence-of-both"
mechanism: "authority-pressure and social-proof-pressure compose additively (often super-additively) on the same target: Milgram-style agentic-shift becomes easier when peer-confederates also comply, Asch-style conformity becomes easier when an authority endorses the majority. Each pressure removes a different residual hesitation — agentic-shift transfers moral responsibility to the authority; visible-peer-conformity removes the `am I the only one going along?` dissonance — so removing both unlocks more compliance than removing either alone"
catalysts:
  - lex-u8u7y # in-group identification with BOTH the authority and the conforming peers multiplies the effect
  - "circular bootstrapping — the figure is treated as authority partly because peers treat them as authority (cult-leader / demagogue / charismatic-grifter dynamics)"
products:
  - "sharply-elevated compliance / belief-uptake, climbing well above either single-pressure baseline (the marketing-stack, the political rally, institutional orthodoxy maintenance)"
inhibitors:
  - "perceived manipulation (rally too obvious, testimonials too astroturfed) triggering reactance; authority-peer conflict (the pressures diverge); sophisticated audiences who have been burned and discount the stack"
reversibility: "fires on convergence; collapses when convergence breaks — a single dissenting peer-confederate dropped Milgram obedience from 65% to 10% — or when the orchestration is perceived as inauthentic"
critical-questions:
  - "is the authority + social-proof signal coherent or contradictory? When they conflict (authority says X, peers say not-X), the molecule does NOT fire — the subject faces a choice between two pressures. Compliance-rate depends on relative authority-strength vs peer-cohesion; the canonical reactance dynamics activate. The molecule's strength comes from CONVERGENCE, not just presence-of-both"
  - "is the authority's legitimacy independently verifiable, or does the social-proof itself partly constitute the authority? Many authority-claims are circular — the figure is treated as authority partly because peers treat them as authority. This is one mechanism for cult-leader / demagogue / charismatic-grifter dynamics: the authority is BOOTSTRAPPED by the social-proof and then leveraged via the molecule"
  - "operationally distinct from lex-8c35v cialdini-three-lever-influence: lex-8c35v names social-proof + commitment-consistency + reciprocity (the three most-used Cialdini levers in score's corpus); lex-5nk9h names a DIFFERENT subset: authority + social-proof. The two molecules' decompose-into sets are disjoint except for lex-hbgcb. Cialdini's six are not all reducible to one molecule; different deployment-contexts use different subsets, and this molecule names the high-leverage pair the score corpus also exercises heavily"
  - "what makes the composition super-additive rather than just additive? The agentic-shift hypothesis (Milgram 1974) provides a candidate mechanism: under authority-pressure subjects transfer moral responsibility to the authority; visible-peer-conformity reduces the remaining 'am I the only one going along with this?' dissonance. Each pressure removes a different residual hesitation, so removing both unlocks more compliance than removing either alone"
  - "operationally adjacent to lex-u8u7y social-identity-as-self-concept-determinant: the molecule's strength depends on in-group identification with both the authority AND the conforming peers. In-group authority + in-group peers → maximum compliance; mixed-group inputs produce muddier results. The Asch effect itself is highly sensitive to in-group/out-group composition"
lineage:
  - source: primary
    text: cialdini-1984-influence
    citation: "Robert Cialdini, Influence: The Psychology of Persuasion (1984), Ch.6 'Authority' — Cialdini frames authority-compliance as a click-whirr shortcut analogous to social-proof, and explicitly extends to the symbols-of-authority (titles, clothes, trappings) that can produce compliance in the substance's absence. The Hofling 1966 phone-nurses experiment (Ch.6) demonstrates 95% compliance with a phone-call 'doctor' ordering a clearly-improper medication dose; the authority-signal alone (claimed title) sufficed even when peer-conformity input was zero, which makes Hofling the high-water-mark for authority-PURE compliance and the natural baseline against which the molecule's super-additive claim is measured. (Ch.6 'Authority' click-whirr framing + Connotation-Not-Content sub-section + Hofling Astrogen experiment)."
    quote: "Our obedience frequently takes place in a click, whirr fashion, with little or no conscious deliberation. Information from a recognized authority can provide us a valuable shortcut for deciding how to act in a situation. [Ch.6 Authority — the click-whirr framing names authority as a shortcut-trigger directly analogous to social-proof; the molecule's super-additive composition is two click-whirr triggers firing on the same target, which Cialdini implies will compose multiplicatively over single-trigger.] When in a click, whirr mode, we are often as vulnerable to the symbols of authority as to the substance. There are several kinds of symbols that can reliably trigger our compliance in the absence of the genuine substance of authority. [Ch.6 Connotation-Not-Content — the trappings-of-authority claim. Symbols (titles, lab-coats, phone-call 'doctor' framing) bootstrap the authority-trigger; in the Hofling experiment ONLY the claimed-title supplied authority, demonstrating that the symbol alone is sufficient to fire the click-whirr.] In 95 percent of the instances, the nurses went straightaway to the ward medicine cabinet, where they secured the ordered dosage of Astrogen and started for the patient's room to administer it. It was at this point that they were stopped by a secret observer, who revealed the nature of the experiment. [Ch.6 Hofling 1966 — the canonical authority-PURE baseline: 95% compliance from a phone-call alone. The molecule's claim that authority + social-proof composes super-additively is calibrated against this 95% authority-only baseline; peer-conformity input would push higher.]"
  - source: practitioner
    text: milgram-1974-obedience-to-authority-book
    citation: "Stanley Milgram, Obedience to Authority (1974) — already in lex-z9s5d lineage; here named as the agentic-shift mechanism that explains why authority-pressure composes super-additively with other influence levers. Milgram's variation studies (one obedient peer-confederate; one disobedient peer-confederate) demonstrate the peer-composition effects directly. No verbatim quote is claimed in this entry — a verbatim quote from Milgram is carried in lex-z9s5d's lineage."
  - source: practitioner
    text: asch-1951-effects-of-group-pressure
    citation: "Solomon Asch, 'Effects of group pressure upon the modification and distortion of judgments' (1951) — already in lex-hbgcb lineage; here named as the horizontal-pressure source. Asch's variation studies (single dissenting confederate breaks the conformity) show the compositional sensitivity. The verbatim quote is carried in lex-hbgcb's own Asch entry, now primary-sourced."
  - source: practitioner
    text: score-drivermap-mining-pass-1
    citation: "The co-occurrence pass identifies obedience_authority × social_proof at 27.3% strength. The pair was already named in lex-z9s5d canonical-instances ('an authority figure who is also visibly endorsed by others is a much stronger compliance pressure than either alone — this is the Cialdini six-principles influence-stack'); this molecule promotes it from canonical-instance to substrate-level molecule"
canonical-instances:
  - "Milgram 1965 variation with peer-confederate: when a peer-confederate openly disobeyed the experimenter, obedience to maximum-shock dropped from 65% to 10%. Conversely, when peer-confederates obediently administered shocks in sequence before the naive subject, obedience increased above the no-peer baseline. The peer-pressure × authority-pressure composition is empirically large"
  - "physician-and-nurses authority-stacking (Hofling 1966 + organizational replications): a doctor's phone-order + visible compliance by senior nurses produces near-100% compliance from junior nurses, even when the order violates explicit protocols. Authority + social-proof composing produces near-certain compliance"
  - "courtroom verdict-pressure: the judge's instructions (authority) + visible-fellow-jurors-converging (social-proof) produces conformity in jury deliberations that empirical work (Hastie/Penrod/Pennington jury simulations) shows exceeds either pressure alone"
  - "marketing-stack (testimonials by experts + 'most popular' label + reviews): the practitioner-stack for influence is exactly authority + social-proof composed. The Cialdini six-principles taxonomy was built from observing this stacking in the field"
  - "political-rally dynamics: the candidate-speaker (authority) + the cheering crowd (social-proof) produces belief-uptake exceeding either alone. The rally format is empirically designed around this molecule"
  - "academic / scientific orthodoxy maintenance: senior-figures (authority) + visible-mainstream-consensus (social-proof) produces uptake even when underlying evidence is contested. Kuhn's 'normal science' is partly this molecule operating as a community-stabilizing force; the failure-mode is paradigm-lock-in"
  - "religious / ideological community: clergy / charismatic leader (authority) + congregational consensus (social-proof) produces sustained belief that neither pressure alone would maintain. The molecule's strength is amplified by the in-group-identification multiplier (lex-u8u7y)"
  - "operationally distinct from lex-8c35v cialdini-three-lever-influence: lex-8c35v names social-proof + commitment + reciprocity; lex-5nk9h names authority + social-proof. The two share only lex-hbgcb in their decompose-into sets. Cialdini's framework supports multiple subset-molecules; the score corpus exercises both subsets at roughly comparable rates, suggesting both are operationally meaningful patterns"
  - "operationally compositional with lex-h2ehw trust-as-substrate-for-obedience (this pass): when the authority is institutionally-trusted (lab coat, white coat, judicial robes) the trust-substrate makes the obedience-pressure feel less coercive; visible-peer-conformity then further reduces the residual hesitation. The three compose (lex-n8smn trust-substrate + lex-5nk9h stack + lex-h2ehw trust→obedience pathway) into the canonical 'institutional compliance' pattern"
  - "foundational critical question: under what conditions does the stack reverse? When authority + social-proof are perceived as MANIPULATIVE (the rally-format too obvious; the testimonial-page too astroturfed), reactance can activate. The molecule's strength depends on the perception that the convergence is authentic rather than orchestrated. Sophisticated audiences who have been burned previously discount the stack more heavily"
  - "decisive critical question: is the molecule predictive enough to be operational, or just descriptive? Empirical work (Milgram-peer-variations, Asch-with-authority-cue, Cialdini-replications) supports that the composition reliably outperforms either alone. The score corpus's 27.3% co-occurrence rate is consistent with operational deployment, not chance"
severity-tier: info
status: active
