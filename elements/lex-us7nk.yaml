lineage:
  - source: practitioner
    text: dempsey-1975-how-to-repair-diesel-engines
    citation: "Paul Dempsey, How to Repair Diesel Engines (Blue Ridge Summit, PA: TAB Books, 1975), Chapter 4, 'Fuel Systems,' p. 64."
    quote: "'Injectors, like spark plugs, are to be assumed guilty until proven innocent. Injector failure has many symptoms, some of which are more pronounced for the different engine brands and models.'"
canonical-instances:
  - "A site-reliability team's incident checklist has 'check whether the most recent deploy caused this' as the first automated step on every page, run before any symptom-specific triage, because a review of the team's incident history shows recent deploys account for a large share of outages regardless of what the specific error message says."
  - "A pediatric clinic's standing protocol has nurses check for ear infection on every visit where a toddler is unusually fussy with no other clear symptom. Most fussy toddlers on a given visit turn out not to have one, but ear infections are disproportionately the actual cause in that age group, and an otoscope look costs the visit almost nothing."
  - "Operationally distinct from lex-yf8ar troubleshooting-order-should-follow-observed-fault-frequency: that atom orders an entire candidate list of many possible causes by frequency before starting to check any of them, a search-sequencing move across the whole set. This atom singles out ONE specific chronic-offender component and makes checking it a standing default, fired by membership in the failure class alone, without ever building or consulting a ranking across the other candidates."
critical-questions:
  - "How is 'chronic offender' established in the first place, and how often is that determination revisited? A component that used to be the dominant cause of failures in an older product generation can keep getting checked reflexively long after a redesign has actually fixed it, wasting the exact cheap-check time the default was supposed to save, because nothing in the habit itself prompts a recheck of whether the track record still holds."
  - "Does treating the chronic offender as guilty-by-default ever suppress the search for a DIFFERENT actual cause once the usual suspect is cleared? If clearing the presumptive culprit is treated as license to stop looking rather than as the trigger to move to the next candidate, the standing default can produce a false sense that due diligence was done when the real cause was never found."
