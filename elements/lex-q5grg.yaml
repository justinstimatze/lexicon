evokes: [conquering-ashes-is-not-a-win, kautilya-the-siege, victory-that-destroys-its-own-object, distinguish-a-costly-win-from-a-hollow-one]
lineage:
  - source: primary
    text: kautilya-arthashastra-conquering-ashes-is-not-victory
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'The Siege,' editorial summary and {13.4.5,22-24}."
    quote: "'Setting fire to the fort by various means ... is a possibility but this is not recommended for there is little to be gained by conquering ashes.' [...] 'there cannot be a country without people and there is no kingdom without a country.'"
canonical-instances:
  - "A company locked in a hostile takeover fight considers a scorched-earth defense that would trigger the departure of the target's entire engineering team and the collapse of its core product if the takeover succeeds, and rejects it once leadership recognizes that winning the takeover battle this way would leave them owning a company with no product and no team -- the thing the acquisition was supposed to secure."
  - "A landlord in a bitter dispute with a tenant considers an aggressive legal strategy that would technically force an eviction but would also destroy the tenant's ability to ever pay the substantial back-rent owed, and instead pursues a settlement that recovers less in total but preserves the tenant's capacity to actually pay something, recognizing that a 'won' eviction against someone left with nothing collects nothing."
critical-questions:
  - "how does a decision-maker reliably know, in the heat of a contest, what they'll actually want once it's over, versus getting caught up in the immediate goal of defeating the opponent at any cost -- does this framework require a level of clear-headed foresight that intense conflict tends to erode?"
  - "is there a point at which destroying the prize becomes the rational choice anyway -- for instance, denying a valuable resource to an opponent who would otherwise recapture and use it against you -- where 'conquering ashes' is actually better than leaving something intact for the other side to reclaim?"
  - "does avoiding tactics that destroy the prize create exploitable predictability, where an opponent who knows you won't burn what you're fighting for can deliberately entangle the prize with their own defense, using your restraint against you?"
