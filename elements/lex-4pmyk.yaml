lineage:
  - source: primary
    text: carroll-2016-the-big-picture
    citation: "Sean Carroll, *The Big Picture: On the Origins of Life, Meaning, and the Universe Itself* (New York: Dutton, 2016), Introduction and Ch.1 'The Fundamental Nature of Reality' and Ch.2 'Poetic Naturalism'. Carroll, a theoretical physicist, structures the entire book around the framework he names poetic naturalism, introduced in the Introduction and developed at length in Ch.2. The Introduction previews the tripartite structure that runs through the whole book: a fundamental/microscopic description, emergent/effective scientific descriptions (ships, people, cells), and values (right/wrong, purpose, beauty) as a third, non-data-fitting kind of description. Ch.1 establishes the ontological case for naturalism (one physical world, no separate supernatural realm) via the historical arc of scientific unification (Galileo, Newton, Dalton, Darwin, Maxwell, Einstein, particle physics) collapsing a once-rich folk ontology into a sparse fundamental one. Ch.2 supplies the 'poetic' half via the Ship-of-Theseus/Captain-Kirk-transporter puzzle, the rich-vs-sparse-ontology contrast, the explicit three-plus-three-point summary of naturalism and its poetic complement, and the explicit three-tier taxonomy of descriptions (fundamental, emergent/effective, values) that is this atom's specific pivotal claim."
    quote: "[Carroll 2016, Introduction, on the tri-level structure and values as a distinct, non-data-fitting third kind of description:] 'We are collections of atoms, operating independently of any immaterial spirits or influences, and we are thinking and feeling people who bring meaning into existence by the way we live our lives.' [Ch.2 'Poetic Naturalism', on the sparse-ontology/many-ways-of-talking structure:] 'In a sparse ontology, there are a small number of fundamental categories (maybe only one) describing the world. But there will be very many ways of talking about the world. The notion of a way of talking isn't mere decoration — it's an absolutely crucial part of how we apprehend reality.' [On eliminativism as the failure mode poetic naturalism rejects:] 'That's the most hard-core attitude we could take to reality, sometimes called eliminativism, since its adherents like nothing better than to go around eliminating this or that concept from our list of what is real. For an eliminativist, the question Which Captain Kirk is the real one? gets answered by Who cares? People are illusions. They're just fictitious stories we tell about the one true real world.' [Carroll's own contrasting position, stated immediately after:] 'I'm going to argue for a different view: our fundamental ontology, the best way we have of talking about the world at the deepest level, is extremely sparse. But many concepts that are part of non-fundamental ways we have of talking about the world — useful ideas describing higher-level, macroscopic reality — deserve to be called real. The key word there is useful.' [The explicit three-plus-three summary defining poetic naturalism as two co-equal claims:] 'Naturalism comes down to three things: There is only one world, the natural world. The world evolves according to unbroken patterns, the laws of nature. The only reliable way of learning about the world is by observing it... The poetic aspect comes to the fore when we start talking about that world. It can also be summarized in three points: There are many ways of talking about the world. All good ways of talking must be consistent with one another and with the world. Our purposes in the moment determine the best way of talking.' [The explicit eliminativist-vs-poetic-naturalist contrast:] 'A poetic naturalist will agree that both Captain Kirk and the Ship of Theseus are simply ways of talking about certain collections of atoms stretching through space and time. The difference is that an eliminativist will say and therefore they are just illusions, while the poetic naturalist says but they are no less real for all of that.' [On Sellars's manifest-image/scientific-image distinction as an antecedent poetic naturalism builds on:] 'Philosopher Wilfrid Sellars coined the term manifest image to refer to the folk ontology suggested by our everyday experience, and scientific image for the new, unified view of the world established by science. The manifest image and the scientific image use different concepts and vocabularies, but ultimately they should fit together as compatible ways of talking about the world. Poetic naturalism accepts the usefulness of each way of talking in its appropriate circumstances, and works to show how they can be reconciled with one another.' [The explicit three-tier taxonomy — fundamental, emergent/effective, and values as a third, non-data-fitting kind:] 'Within poetic naturalism we can distinguish among three different kinds of stories we can tell about the world. There is the deepest, most fundamental description we can imagine — the whole universe, exactly described in every microscopic detail. Modern science doesn't know what that description actually is right now, but we presume that there at least is such an underlying reality. Then there are emergent or effective descriptions, valid within some limited domain. That's where we talk about ships and people, macroscopic collections of stuff that we group into individual entities as part of this higher-level vocabulary. Finally, there are values: concepts of right and wrong, purpose and duty, or beauty and ugliness. Unlike higher-level scientific descriptions, these are not determined by the scientific goal of fitting the data. We have other goals: we want to be good people, get along with others, and find meaning in our lives. Figuring out the best way to talk about the world is an important part of working toward those goals.' [The Introduction's own preview of the same claim, on values as human-constructed but not thereby illusory:] 'Poetic naturalism strikes a middle ground, accepting that values are human constructs, but denying that they are therefore illusory or meaningless. All of us have cares and desires, whether given to us by evolution, our upbringing, or our environment. The task before us is to reconcile those cares and desires within ourselves, and amongst one another. The meaning we find in life is not transcendent, but it's no less meaningful for that.' [On what makes a way of talking good or bad, i.e. the data-fitting test that applies to tiers 1-2 but not tier 3:] 'There are certainly non-useful ways of talking about the world. In scientific contexts, we refer to such non-useful ways as wrong or false. A way of talking isn't just a list of concepts; it will generally include a set of rules for using them, and relationships among them.' [On the move from description to prescription as a distinctly human, creative act — the closing statement of Ch.2:] 'Poetic naturalism is a philosophy of freedom and responsibility. The raw materials of life are given to us by the natural world, and we must work to understand them and accept the consequences. The move from description to prescription, from saying what happens to passing judgment on what should happen, is a creative one, a fundamentally human act. The world is just the world, unfolding according to the patterns of nature, free of any judgmental attributes. The world exists; beauty and goodness are things that we bring to it.'"
