name: measure-strategic-position-by-relative-rate-not-absolute-level
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When assessing whether you're winning or losing in a competitive situation, don't measure your own absolute gains in isolation and don't measure them against your own spending alone — measure them relative to your rival's trajectory, because Kautilya defines progress and decline as inherently comparative and yoked to the rival's own fortunes, not as standalone facts about your own state. He states this with unusual bluntness: 'It is a decline for the conqueror if the enemy's undertakings flourish; conversely, the decline of an enemy's undertakings is progress for the conqueror' — you can be in relative decline while your own absolute position is unchanged or even improving, purely because your rival is improving faster, and symmetrically you can be in relative progress from your rival's misfortune alone, without any action of your own. This is paired with a separate efficiency criterion that keeps the framework from collapsing into pure zero-sum reasoning about the rival: 'A small gain for a large outlay is decline; the converse is progress. A gain equal to the expenditure on an undertaking means that the conqueror has neither progressed nor declined' — a real gain achieved at disproportionate cost still counts as decline, because the framework nets the gain against what it cost to get it, exactly like a return-on-investment calculation rather than a raw ledger of gains. Both comparative dimensions (relative to the rival, relative to your own cost) feed into a further rule about how much a current disadvantage should worry you: 'a king may ignore an enemy's progress if his own progress will be quicker or greater [than that of his enemy] or if there is a prospect of greater future gain' and the mirrored rule for decline — a current gap is tolerable specifically when your own rate of improvement is set to outpace the rival's, meaning the diagnostic question is never just 'who is ahead right now' but 'whose trajectory is steeper.' Diagnostic move: when evaluating whether your organization, career, or position is advancing or falling behind, resist measuring your own absolute numbers against your own history alone — plot your rate of change against your most relevant rival's rate of change, net every gain against what it actually cost to achieve, and treat a current lead or deficit as far less informative than the comparative slope of the two trajectories."
