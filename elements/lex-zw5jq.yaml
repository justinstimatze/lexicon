    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.4 'Free People, the Origin of Cultures, and the Advent of Private Property.'"
    quote: "“it was almost something of an archaeological embarrassment.”"
canonical-instances:
  - "The direct textual anchor, on the scale of what the label was suppressing: Poverty Point's monumental precinct once extended over 200 hectares -- comparable to the entire layout of early Eurasian cities like Uruk or Harappa -- built by people who were hunters, fishers, and foragers with no writing and no agriculture."
  - "Hypothetical: a hospital system labels a category of patient complaints 'non-urgent intake' in its triage software, a term meant purely to route paperwork faster. Years later, an audit finds that several serious conditions were repeatedly missed because staff, trained to treat 'non-urgent intake' as a queue to clear quickly rather than assess carefully, stopped reading those files closely -- the routing label had quietly become a judgment about how much attention the cases inside it deserved."
critical-questions:
  - "Is the label really doing causal work here, or is this reading the causation backwards -- did 'the Archaic' get named that way because the evidence available at the time genuinely supported a low-significance reading, with the label simply reflecting an accurate assessment that later evidence overturned, rather than a name that actively blinded researchers to what was already there?"
  - "How would a field actually catch this kind of label-driven blind spot in real time, before decades of evidence pile up? Is there a general practice (periodic renaming, mandatory re-justification of category boundaries) that could surface a misleading period name before it does years of suppressive work, or does this kind of correction only ever happen after the fact, once the anomaly becomes too large to ignore?"
