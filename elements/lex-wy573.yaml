id: lex-wy573
name: a-traditions-function-depends-on-its-content-not-its-form
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When someone invokes 'tradition' to explain why a group resists change, don't assume tradition is intrinsically a conservative force — check what the tradition's actual CONTENT commits the group to, because a tradition of innovating is still a tradition, and upholding it produces change rather than blocking it. Merton: 'Ordinarily, tradition is that part of a culture which is resistant to change, persisting for a time even when it is out of sorts with the newly emerging requirements of the society. But this is a wholly formal view, not a substantive one. The social function of tradition depends upon its content. And in medicine, the great tradition is typically that associated with celebrated physicians of the past, with those who have shown a capacity to move forward when most of their colleagues were satisfied to let things remain as they were. The great tradition in medicine is in large part a tradition of commitment to the search for improved, and therefore changing, ways of coping with the problems of the sick.' The FORM of tradition — persistence, ritual reinforcement, appeal to past authority — is generic and says nothing by itself about whether the group will resist or embrace change. The FUNCTION is set entirely by what the tradition actually valorizes: a tradition that reveres past conformity produces resistance; a tradition that reveres past innovators (people who moved forward when their colleagues were satisfied with the status quo) produces an institutionalized expectation of continuing to innovate, precisely because being a faithful heir to that lineage means doing what the celebrated ancestors did — changing things. Diagnostic move: before treating an appeal to tradition as evidence a group will resist a proposed change, check what the tradition's own canonical figures and stories actually valorize — a tradition of veneration for past disruptors can be recruited as social permission and even obligation to disrupt again, using the same rhetorical form ('honoring our history') that elsewhere signals resistance."
