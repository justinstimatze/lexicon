id: lex-bd324
name: mutual-cognitive-environment
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When two parties seem to communicate easily, surface that they share a mutual cognitive environment — overlapping assumptions, references, prior context — and outsiders to that environment will miss the implication even with full text access."
related: [lex-u74ex, lex-tjwfn, lex-e2tnt, lex-xhvgy, lex-j929z, lex-5mv6r, lex-junvn, lex-4hfyp]
scaffolds-from: [lex-e2tnt]
evokes: [shared-manifest-not-shared-known, asymptotic-decay-not-strict-recursion, in-group-as-cognitive-overlap, freemason-shibboleth-substrate, why-mutual-knowledge-fails-this-doesnt]
lineage:
  - source: primary
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard UP / Blackwell 1986; 2nd ed. 1995). Chapter 1 §8 'Cognitive environments and mutual manifestness' (p.41-42). The construct names: any cognitive environment shared by N people IN WHICH it is manifest which people share it. The pivotal methodological move: this REPLACES the philosophical primitive 'mutual knowledge' (which requires strict infinite recursion at each level — Mary knows Peter knows Mary knows... — that demonstrably fails psychologically beyond shallow depth) with 'mutual manifestness,' which decays ASYMPTOTICALLY toward zero degree-of-manifestness without becoming false at any depth. The structural relation to lex-e2tnt cognitive-environment-as-scope: mutual-cognitive-environment is the multi-agent generalization — the overlap region of two or more individual cognitive environments, with the additional reflexive property that the shared-ness itself is in the overlap. Verified verbatim 2026-05-20 (Ch.1 §8 p.41-42 OCR'd page text; page numbers verified from per-page file headers using established filename = printed-page + 10 offset)"
    quote: "We will now show that because 'manifest' is weaker than 'known' or 'assumed', a notion of mutual manifestness can be developed which does not suffer from the same psychological implausibility as 'mutual knowledge' or 'mutual assumptions'. [Ch.1 §8 p.41 — the methodological move statement.] One thing that can be manifest in a given cognitive environment is a characterisation of the people who have access to it. For instance, every Freemason has access to a number of secret assumptions which include the assumption that all Freemasons have access to these same secret assumptions. In other words, all Freemasons share a cognitive environment which contains the assumption that all Freemasons share this environment. [Ch.1 §8 p.41 — the canonical example: shared assumptions that contain a meta-assumption of shared-ness.] Any shared cognitive environment in which it is manifest which people share it is what we will call a mutual cognitive environment. In a mutual cognitive environment, for every manifest assumption, the fact that it is manifest to the people who share this environment is itself manifest. [Ch.1 §8 p.41-42 — the key definition.] The more complex assumptions of type (43)–(45) get, the less likely they are actually to be made. However, in such a series, assumption n does not have to be actually made by the individuals it mentions for assumption n+1 to be true. There is therefore no cut-off point beyond which these assumptions are likely to be false rather than true; they remain manifest throughout, even though their degree of manifestness tends asymptotically toward zero. [Ch.1 §8 p.42 — the essential distinction from mutual-knowledge: manifestness DECAYS without going FALSE; mutual-knowledge BREAKS at the depth where the n-th level assumption is no longer made.]"
  - source: practitioner
    text: sperber-wilson-mining-pass-1
    citation: "promoted from cross-attestation: game theory and economics (the 'common knowledge' construct from Aumann 1976 'Agreeing to disagree' is the formal version of mutual-knowledge that S&W critique as psychologically implausible — the constructs are exactly the targets of S&W's methodological move; common-knowledge powers coordination-game equilibrium selection and contract theory but the assumption that real agents have common knowledge to arbitrary depth is the unrealistic part), multi-agent AI systems (a team of agents coordinating on a task needs a shared model of what the team-state is; designing for mutual-manifestness rather than literal common-knowledge is more tractable engineering), in-group / out-group sociology (any shibboleth, secret handshake, code-switch, or insider joke functions because participants share a mutual cognitive environment that includes the meta-fact 'we all know we share this'), team and family dynamics (the friction of 'how did you not know I was upset about that?' is often a mutual-cognitive-environment mismatch: one party assumed shared-manifestness of the issue, the other party didn't have it manifest at all). Cross-domain attestation across linguistics, game theory, multi-agent system design, sociology, organizational behavior"
canonical-instances:
  - "the Freemason example from Ch.1 §8 p.41: 'every Freemason has access to a number of secret assumptions which include the assumption that all Freemasons have access to these same secret assumptions.' The construct generalizes to ANY in-group with shared assumptions PLUS a shared meta-assumption of shared-ness: secret handshakes, professional jargon, code-switches, family inside jokes, religious orthodoxies, fandom references. The shibboleth function (recognize a fellow in-group member by their use of in-group manifests) is mutual-cognitive-environment in action"
  - "Peter and Mary in the same room (Ch.1 §8 p.41): 'they share a cognitive environment which consists of all the facts made manifest to them by their presence in this room. One of these facts is the fact that they share this environment.' Co-presence is the simplest case — the room itself instantiates the mutual cognitive environment, no prior coordination needed. This is why face-to-face meetings remain foundational where remote communication isn't: physical co-presence is a cheap way to manufacture mutual-cognitive-environment"
  - "the phone-ringing example from p.42: (43) 'It is manifest to Peter and to Mary that the phone is ringing.' (44) 'It is manifest to Peter and to Mary that it is manifest to Peter and to Mary that the phone is ringing.' (45) 'It is manifest to Peter and to Mary that it is manifest to Peter and to Mary that is manifest to Peter and to Mary that the phone is ringing.' The series CAN be extended indefinitely, but the higher-order assumptions need not be ACTUALLY MADE for the lower-order ones to hold. This is the asymptotic-decay property that distinguishes mutual-manifestness from mutual-knowledge"
  - "common-knowledge in game theory (Aumann 1976, Lewis 1969 Convention) is the strict version of what S&W argue should be replaced: in coordination games, 'common knowledge' is required for equilibrium selection, but real players never have common knowledge to arbitrary depth. Mutual cognitive environment is the empirically tractable substitute: players have shared assumptions that decay asymptotically, and observed coordination doesn't require strict-recursion all the way down"
  - "multi-agent AI system design: when N agents need to coordinate on a task, engineering literal mutual-knowledge (every agent's belief state contains every other agent's belief state to arbitrary depth) is computationally explosive and unrealistic. Engineering for mutual cognitive environment (agents share a manifest set that includes the meta-fact 'this is shared') is tractable: a shared blackboard, a public log, a common-context-window all serve. The construct names what the engineering target should actually be"
  - "team-meeting failure mode: a decision is made in a sub-meeting and announced over Slack. Some attendees were absent, some absorbed it, some scrolled past. The decision-maker's mental model says 'the team knows X' (assumed mutual-cognitive-environment); reality is that X is in some individuals' cognitive environments and not in others' — and no one has the meta-fact 'we all know X.' Subsequent execution fractures along the gap. The fix is to make the shared-ness itself manifest (live confirmation, retro reading-aloud, explicit ACK), not just to broadcast the decision again"
  - "decisive critical question: how do you EMPIRICALLY establish that something is mutually-manifest rather than just manifest-to-each-party-separately? The Freemason case has the meta-assumption built into the secret-assumption set; the Peter-and-Mary case has co-presence. In looser cases — async team, distributed family — the meta-fact may not actually be present, and assuming it is can be a reasoning error. Behavioral checks: visible acknowledgment, second-pass confirmation, explicit 'we both know X, right?' moves"
  - "indispensable methodological move: the WHOLE POINT of introducing this construct is to substitute it for mutual-knowledge in psychological / linguistic / cognitive-science theory. The substrate-meta lesson: when a philosophical primitive (mutual-knowledge) generates a regress that demonstrably fails psychologically, the move is to find a weaker construct (manifest, mutual-manifestness) on which the same theoretical work can be done. This is the same shape as the broader 'operationalize the ill-posed primitive' move (compare lex-wtkuz descriptive-vs-operational-metacognition, which makes the analogous move within metacognition)"
critical-questions:
  - "is the assumed-shared context actually shared, or are you projecting your model onto the other side?"
  - "what would break the implicature for a reader outside this environment — name the assumption that has to hold"
  - "could the mutual-environment exclude relevant audiences (outsiders, future readers, AI agents) you should care about?"
  - "is the environment converging or diverging — are you accumulating shared context, or drifting apart?"
status: active
