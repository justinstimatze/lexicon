lineage:
  - source: primary
    text: merton-1973-dominance-argument-bounds-warrant-price
    citation: "Robert C. Merton, 'Theory of Rational Option Pricing,' The Bell Journal of Economics and Management Science 4(1):141-183 (Spring 1973), pp. 142-144."
    quote: "'Security (portfolio) A is dominant over security (portfolio) B, if on some known date in the future, the return on A will exceed the return on B for some possible states of the world, and will be at least as large as on B, in all possible states of the world.' ... 'A necessary condition for a rational option pricing theory is that the option be priced such that it is neither a dominant nor a dominated security.' ... 'Suppose at the end of r years, the common stock has value S*. Then, the value of B will be S*. If S* < E, then the warrant is worthless and the value of A will be 0 + E = E. If S* > E, then the value of A will be (S* - E) + E = S*. Therefore, unless the current value of A is at least as large as B, A will dominate B.'"
canonical-instances:
  - "The paper's own reuse of the identical technique on different comparison portfolios: to prove a warrant's price is a convex function of its exercise price (Theorem 4), and that the price moves by no more than a bounded amount per unit change in exercise price (Theorem 5), Merton builds a fresh pair of portfolios each time and checks their terminal payoffs state by state — the same dominance rule doing new work each time, with no new probabilistic machinery added."
  - "Hypothetical: a startup's board weighing an acquisition offer, with no comparable-company multiple or discounted-cash-flow model everyone trusts, instead compares the offered package against continuing to hold equity across every future scenario a board member can name (a bad year, a great year, a down-round); if the offer matches or beats holding equity in each one, the board can call it a floor value without ever agreeing on which scenario is most likely."
critical-questions:
  - "Merton himself notes that 'it is possible to have dominated securities exist without arbitrage in imperfect markets' — real markets have transaction costs and short-sale restrictions that let a dominated position persist. Does the state-by-state ordering still bound anything useful once the frictionless-market assumption is dropped, or does the bound only hold exactly in the idealized case?"
  - "The technique needs a genuinely comparable position to compare against — here, a bond-plus-warrant portfolio against the stock itself. Many real unknowns (a novel technology's eventual value, a person's future reputation) have no tradeable or even hypothetical comparison position with a provably ordered payoff. What happens to this move when no such construction is available at all?"
  - "A dominance-derived bound can be true and nearly useless at the same time — 'worth at least the worst case' can sit far below the fair or expected value. When is a bound this cheap to derive actually tight enough to inform a decision, versus merely a true statement nobody needed?"
