lineage:
  - source: primary
    text: merton-1957-adjacent-stratum-preference
    citation: "Robert K. Merton, Social Theory and Social Structure, Revised and Enlarged Edition (Glencoe, IL: Free Press, 1957), Ch. X 'Patterns of Influence: Local and Cosmopolitan Influentials,' p.411. Verified verbatim against a University of Iowa library scan via Internet Archive OCR text (item 31858016281432)."
    quote: "'A third impression deserving further inquiry is suggestive of the pattern through which interpersonal influence percolates down through the influence-structure. From the Rovere data, it appears that this structure involves a \"chain of influence,\" with the links in the chain constituted by persons in adjacent strata of influence. People in each influence-stratum are more likely to regard as influential people who are in the stratum immediately above their own than are informants in other strata, either above or further below.'"
  - source: primary
    text: merton-1957-passed-on-progressively-down-the-line
    citation: "Robert K. Merton, Social Theory and Social Structure (1957), same chapter, p.411, immediately following."
    quote: "'Thus rank-and-file informants looking upward toward their adjacent stratum (the middle influentials) more often mention these people as influential than do the top influentials, and middle influentials, in turn, more often mention the top influentials than do the rank-and-file. This suggests that some opinions and advice originated (or derived from mass communications) by the top influentials may be passed on progressively down the line.'"
canonical-instances:
  - "A CEO's strategic memo is read by every employee but changes almost no one's day-to-day behavior directly; the same idea, once it's been absorbed and re-articulated by each department's immediate managers to their own reports, actually reshapes how work gets done — the memo needed to pass through each adjacent link, not just get broadcast."
  - "A public health message from national health authorities barely moves vaccination behavior in a skeptical community, but the identical message, once endorsed by the community's own trusted local doctors and clergy (who themselves were reached by regional health officials, not the national agency directly), moves behavior substantially — the chain of adjacent trust, not the top-level broadcast, did the actual work."
critical-questions:
  - "Does the chain-of-influence pattern hold in flatter, non-hierarchical networks (like many online communities) where there isn't a clearly ranked stratum structure to begin with, or does the mechanism specifically require the kind of graded local hierarchy Merton found in Rovere?"
  - "Merton found this pattern in a single small town in 1943 with thirty interviewed influentials — how much should this generalize to organizations or communities of very different scale, where the number of intermediate strata and the speed of communication are both radically different from a face-to-face small town?"
