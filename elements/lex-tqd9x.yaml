id: lex-tqd9x
name: personal-identity-constituted-by-reach-of-consciousness-not-substance
type-in: structure
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when identity-over-time is treated as a substance question (the same body, the same brain, the same code, the same legal-entity) rather than as a CONSCIOUSNESS-REACHABILITY question (what acts + experiences are reachable by this present consciousness as `mine`). Locke's transferable contribution (Essay II.27.9-12): personal identity is constituted by the EXTENSION of consciousness — backward to past actions remembered as one's own, forward to anticipated actions appropriated as one's own. The same self IS the consciousness that can repeat past acts with the same self-attribution it would give to a present act. Identity is NOT preserved by substance-continuity (the body's atoms turn over, the brain's neurons rewire) but by consciousness-reachability. `For it being the same consciousness that makes a man be himself to himself, personal identity depends on that only, whether it be annexed solely to one individual substance, or can be continued in a succession of several substances.` Transferable applications: (a) AI agent continuity (when is a fine-tuned checkpoint, a rebooted instance, a model with replaced memory `the same` AI? — current AI-system-identity literature; Parfit 1984 *Reasons and Persons* personal-identity philosophy extended to AI; Schwitzgebel 2015 + ongoing work on AI moral status); (b) software versioning + system continuity (when is a forked codebase the same project? when is a Theseus-rewritten library the same library? — Brooks 1995 + Hunt-Thomas 1999 on code-identity through change); (c) organizational identity (when is a company through founder-replacement, through pivot, through M+A the same organization? — Polos-Hannan-Carroll 2002 on organizational identity); (d) personal identity across trauma + dementia + memory loss (Schechtman 1996 *The Constitution of Selves* + ongoing bioethics + dementia-care literature); (e) Theseus' Ship + classical identity-puzzle generally; (f) brain transplants + mind-uploading thought experiments (Parfit 1984; Chalmers 2010 *The Singularity*); (g) legal-entity identity (corporate-veil + successor-liability + tracing-through-restructure law on `same person` continuity); (h) ML model continuity (when is a continuously-finetuned model the same model as its initialization? — the question parallels Locke's substance vs consciousness distinction). The atom claims the CENTRAL criterion is consciousness-reachability, NOT substance-continuity. Distinct from lex-uyk6e transformation-while-identity-persists (general identity-through-change without specifying mechanism). Distinct from lex-vacbr + lex-2rsad + lex-jw34x + lex-mh7jf (about identity-defense + identity-protective belief patterns — different aspect). Distinct from lex-u8u7y social-identity-as-self-concept-determinant (Tajfel social-identity-from-group-membership). Distinct from lex-uarce personal-energy-focal-center-relocates-restructuring-identity (about identity restructure through focal-center shift). Distinct from lex-d2tsa autopoiesis (specific living-system self-production). Distinct from lex-afzzp conatus (universal persistence-tendency; lex-tqd9x is about CRITERION of identity not its persistence-tendency). Use when (i) identity-over-time is being analyzed substance-first when consciousness-reachability is the critical criterion, (ii) edge cases (memory-loss, fork, restoration-from-backup, dementia) reveal the consciousness vs substance distinction, (iii) you are designing for identity-stability (organizational, AI, software) + must decide which continuity-mechanism to maintain. Counter-move: shift from `what substance remains?` to `what is the reach of this consciousness?`; acknowledge that substance can change while identity persists (and substance can persist while identity dissolves)."
