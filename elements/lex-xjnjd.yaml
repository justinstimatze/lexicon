id: lex-xjnjd
name: a-marginal-utility-argument-cures-grief-over-a-phantom-gain
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Grief over a lost windfall can be dissolved not by consoling the griever, but by walking them through what the windfall would have actually added on top of what they already have, exposing that the marginal benefit was smaller than the emotional weight assigned to it. In the Jataka's tale of the king made sick by a broken promise of three cities, the disguised healer doesn't dispute the loss or offer sympathy. He asks a pointed question: 'O king...could you wear four pairs of robes at once, eat out of four golden dishes, lie on four state beds?' The king recovers immediately, not because the cities stop being lost, but because the question forces him to notice that his existing wealth already exceeds what he could physically use, making the marginal three cities worth far less than the grief he'd assigned them."
