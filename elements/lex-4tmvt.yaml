id: lex-4tmvt
name: a-playful-refrain-can-say-the-truth-and-still-mislead
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you hear the same strange phrase repeated over and over inside something framed as playful or ritualistic, don't file it away as meaningless noise just because the tone around it is lighthearted -- the exact truth can be stated aloud, in plain words, the entire time, and still go unheeded because its delivery signals 'game' rather than 'warning.' In Cushing's telling, ghostly dancers openly announce what they are, over and over, throughout an entire night of festivity: 'Hapa! hapa! is! is! is!' ('Dead! dead! this! this! this!') -- pointing at one another, laughing, as part of what looks like nothing more than a running joke. The youth notices the words are odd -- 'he thought it strange that they should exclaim thus one to another' -- but the surrounding merriment recodes the statement as an amusing quirk rather than literal information, and he dances the night away among the dead without ever registering what he was told directly and repeatedly. Only daylight forces the correction, when 'clammy bones fell from around him' and the beautiful dance hall turns out to be a ruin littered with skeletons. The information was never hidden -- it was delivered in a register, chant, joke, game, that made its content easy to file as texture rather than fact. Diagnostic move: when something true and important is being stated in a form that reads as playful, ritualized, or repetitive -- a running joke, a chant, an in-group refrain -- separate your assessment of its form from your assessment of its content; ask what the words would mean if you took them completely literally, independent of how casually or cheerfully they're being delivered, because the delivery is not evidence about the truth-value of what's being said."
