    text: goss-1957-three-types-of-change
    citation: "Mary E. W. Goss, \"Change in the Cornell Comprehensive Care and Teaching Program,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), pp.255-256. The extraction interposes a footnote (Minutes of a C. C. & T. P. Advisory Committee meeting, November 20, 1952) directly inside the word 'presumably'; the quote below discloses that split with an ellipsis at the exact interposition point."
    quote: "'In the first case of change in selection criteria, one residence requirement for Family Care patients was replaced by another, presum ... ably better calculated to meet current organizational needs. This sort of alteration, wherein one item is eliminated from the whole and replaced by another item, may be called substitution. The second instance of change cited did not involve replacement of an already-existing requirement, but rather, introduction of a new and unanticipated criterion... This kind of change can be designated innovation, with the understanding that more generally, it means addition of an entirely new and unforeseen item to a given whole. A third kind of change was evident in the final case described, for there the already-existing criterion that patients be \"members of families\" was elaborated to refer specifically to \"families with children.\" The term specification covers this sort of change reasonably well; it may be taken to mean that hitherto implicit or vague implications of a given item are made explicit.'"
  - source: primary
    text: goss-1957-classification-requires-context
    citation: "Mary E. W. Goss, \"Change in the Cornell Comprehensive Care and Teaching Program\" (1957), p.256."
    quote: "'Obviously, accurate classification of a given change in the C. C. & T. P. as \"substitution,\" \"innovation,\" or \"specification\" requires knowledge of staff expectations as well as of initial formal arrangements.'"
canonical-instances:
  - "A restaurant's dress code is first tightened from 'no restrictions' to 'no shorts or sandals' (specification, making an implicit expectation explicit), later gains an entirely new requirement for reservations on weekends (innovation, an unforeseen addition), and finally swaps its 'jacket required' rule for 'collared shirt required' (substitution, one item replaced by another addressing the same underlying concern)."
  - "An open-source project's contribution guidelines evolve the same three ways: 'write tests' becomes 'write tests covering the changed lines only' (specification), a wholly new 'sign the CLA' step gets added after a legal issue (innovation), and 'squash your commits' later gets replaced by 'use conventional commit messages' (substitution) once maintainers realize squashing wasn't actually the goal."
critical-questions:
  - "Goss's typology classifies the FORM of the edit (replace / add / elaborate) rather than its underlying CAUSE. Two substitutions with identical form — one item swapped for another — could have opposite causes: the original item was found simply wrong, or the environment itself changed and made a previously-correct item obsolete. Does the typology need a second, orthogonal axis for cause, or is form alone still useful without it?"
  - "Is 'specification' really change at all, in the sense the other two are, if it only makes explicit what staff expectations already implicitly required — or is calling it a 'type of change' itself already an interesting finding, since it means informal, already-operating norms get promoted to formal rule status over time?"
status: active
