canonical-instances:
  - "Hypothetical: A standards body drafts a wishlist for a load-balancing algorithm: it must work under any traffic pattern, ignore servers currently outside the routing pool, and shift more traffic toward a server whenever its health score climbs. Swap two servers' hostnames and the routing output can't change. Swap two request-type labels and the same holds for which request goes where. Someone later objects to round-robin-with-health-weighting as 'too simplistic' without realizing the wishlist, taken together, already proved round-robin-with-health-weighting is the only algorithm that satisfies it."
  - "Hypothetical: A grant committee agrees on five criteria for a fair funding-allocation formula, each one endorsed without objection in isolation. A published proof already exists showing those five criteria, together, single out one specific formula -- the committee's actual decision was made the day it approved the criteria list, not the day it approved the formula, and objecting to the formula now means one of the five criteria has to go."
critical-questions:
  - "Isn't it possible that a proof like May's is wrong, or applies only under conditions the real decision doesn't meet -- shouldn't the formula still be checked on its own merits regardless of the axioms? Absolutely, and Sen elsewhere stresses exactly this: check whether the domain the proof assumes (every possible preference configuration, for instance) actually matches the real situation. The point isn't that the axioms make independent scrutiny of the outcome unnecessary -- it's that approving the axioms without knowing what they jointly force is the mistake, whether or not the resulting outcome later checks out."
  - "Does knowing a uniqueness result exists actually change anything, if you'd have arrived at the same procedure anyway by picking it directly? It changes where the real disagreement has to happen. Objecting to the outcome after endorsing every axiom that forces it puts you in the position of rejecting a conclusion while still holding all its premises -- naming which axiom to give up is the coherent way to object, and the uniqueness result is what tells you a choice is even required."
