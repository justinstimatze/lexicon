id: lex-3f5tc
name: a-captive-talks-captors-into-leaving-then-escapes-in-their-absence
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A trapped party can sometimes escape not by fighting free but by convincing captors that the capture is more valuable if postponed -- getting the captors to leave voluntarily to prepare for a bigger prize, and using their absence to disappear entirely. In Radin's Winnebago Trickster cycle, Trickster is trapped inside a hollow tree with only his tail visible, and a group of women approach to cut him out, believing him a raccoon: 'Ah, it is going to be a fine, large racoon.' Rather than resist discovery, Trickster leans into it and adds a condition that serves only his own escape: 'As soon as my hiding-place has been plugged up by women's clothing, then leave me here and come back after me shortly. I assure you, I am very fat.' The promise of a bigger prize later is exactly what makes the women willing to delay the capture and leave unguarded: 'Yes, we'll do just that,' they answered. So they took off their clothing, plugged up the hole and went home.' The moment they are gone, 'he came out and went on. When the women returned they found nothing.' The capture was never resisted -- it was redirected into a plan the captors built for him. Diagnostic move: when someone who has you cornered proposes waiting or preparing before finishing the job, consider whether that pause is being offered to you or engineered by you -- an eager captor who leaves to get ready has, by definition, stopped watching."
