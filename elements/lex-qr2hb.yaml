id: lex-qr2hb
name: task-focus-forgets-a-specific-caution-with-irreversible-cost
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Not every broken warning is a deliberate transgression -- some of the most costly violations happen precisely because the person genuinely intends to comply, but the specific caution gets crowded out by ordinary absorption in the task at hand. In Eastman's telling, a husband warns his wife before an ordinary chore, digging wild turnips: 'When you are digging, you must not hit the ground too hard!' There's no forbidden curiosity here, no temptation to defy, nothing she wants to test -- she simply forgets, mid-task, exactly as anyone absorbed in repetitive physical work might: 'the Earth forgot, and in her haste she struck the ground so hard with the sharp-pointed stick with which she dug turnips, that the floor of the sky was broken and she fell through.' The consequence is total and permanent -- she's separated from her husband and her entire world for the rest of the story -- and it arrives with no antagonist and no moral failing to point to, just ordinary task-absorbed forgetting meeting a caution whose stakes were wildly disproportionate to how easy it was to violate by accident. Diagnostic move: when a caution attached to a routine, repeatable action carries catastrophic and irreversible stakes, don't rely on the person's intention to comply or their good character -- intention doesn't survive absorption in the task, and a warning that's easy to forget mid-motion needs a structural safeguard, a physical limiter, a built-in check, a partner watching, not just an instruction given once in advance."
