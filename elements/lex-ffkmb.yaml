id: lex-ffkmb
name: vested-interest-momentum-pushes-a-declining-system-past-its-rational-ceiling
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a technology's real growth curve keeps climbing well past the point where its own economics say it should have leveled off, don't assume the economics were wrong — check whether the people whose careers, funding, and identity are built around the old technology are the ones actually driving that extra climb, and whether the climb is now purchased by pushing costs onto something the momentum's beneficiaries don't pay for directly. Altshuller charts a technology's life as an S-curve and names a specific, reliable distortion in the real data versus the theoretical curve: 'The period of rapid development of technical systems should be completed in point [where] the possibilities for the utilization in the system of the principle are exhausted... However, nothing of the kind occurs; the real point is always far higher than the theoretical... When the curve reaches level 1 many people turn out to be interested in the future development of the system — a momentum of interests gets going — financial, scientific (pseudoscientific), careeristic, and simply human (fear of abandoning an accustomed and time worn system).' He's explicit that this isn't merely psychological noise the real economics eventually override — the economics themselves bend to accommodate the momentum: 'does this mean that the momentum of interests turns out to be stronger than economic factors? Yes, it is stronger. But the economic factors themselves are able to adapt to the momentum of interests. Right down to level 2 the system continues to remain advantageous at a cost of destruction, pollution and chemical exploitation of the environment.' His worked case is oil tankers: after the Torrey Canyon disaster spilled 120,000 tons of oil, tankers kept growing toward half a million and then a million tons, because the growth stayed 'economical' as long as its real cost (environmental destruction, uninsured catastrophic risk) was excluded from the ledger — 'This is good for me today, and I don't give damn for the rest, is the formula that pulls curve upwards, to level 2.' Only a hard physical ceiling (level 3 — roads that can't physically hold more cars, whatever the equivalent limit is for the system in question) finally stops the climb, not the exhausted original economics that should have stopped it earlier. Diagnostic move: when a system keeps scaling well past where its founding logic said it would plateau, look for who benefits from its continued growth in ways unrelated to the system's original purpose (career stakes, sunk institutional investment, identity), and check whether the growth's true cost has been externalized onto a party that doesn't show up in the accounting used to justify 'it's still economical' — the momentum of interests, not the original economics, is very often what's actually still pulling the curve upward."
