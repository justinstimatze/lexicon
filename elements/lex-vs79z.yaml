  - source: primary
    text: dawn-of-everything-social-movements-physical-movements
    citation: "David Graeber and David Wengrow, The Dawn of Everything: A New History of Humanity (Penguin Books, 2021), ch.11 'Full Circle.'"
    quote: "“What we would now call social movements often took the form of quite literal physical movements.”"
canonical-instances:
  - "The direct textual anchor, on how this dynamic played out at the community level around Cahokia's rise and fall: 'migration is often framed as implying the restructuring of an entire social order, merging our three elementary freedoms into a single project of emancipation: to move away, to disobey and to build new social worlds.'"
  - "Hypothetical: a religious community with strict, contested rules about leadership succession faces a bitter internal dispute over whether elders should have veto power over the congregation's votes. Rather than holding a prolonged internal fight, a third of the congregation, with plenty of available land in a nearby territory, simply forms a new settlement with an explicitly different governance charter -- the move itself is the amendment, adopted the moment they finish building the first meeting house."
critical-questions:
  - "Is the Osage idiom genuinely evidence that relocation functioned as the actual mechanism of political revision, or could it just as easily be a retrospective figure of speech applied after the fact to what was, in the moment, simply a practical response to depleted land or military pressure, with the constitutional reframing arriving only in how the move was later talked about?"
  - "How far does this mechanism generalize once population density rises and uninhabited territory becomes scarce -- does the 'move equals revise' equation only ever work as a special case of very low population density, in which case it says little about how political change happens in the far more common historical condition of crowded, territorially fixed societies?"
status: active
