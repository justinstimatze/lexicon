id: lex-3jxeq
name: prefer-peace-unless-its-terms-are-unfair-then-prefer-conflict
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When deciding whether to settle a dispute or escalate it, don't default to 'always prefer the peaceful option' or 'fight whenever you might win' — key the decision specifically to whether the achievable settlement is FAIR, because Kautilya states the rule as a conditional keyed to distributional fairness rather than to relative power or to a blanket preference for non-violence: 'When the benefits accruing to kings under a treaty, irrespective of their status as the weaker, equal or stronger king, is fair to each one, peace by agreement shall be the preferred course; if the benefits are to be distributed unfairly, war is preferable.' This rule is paired with a separate, purely instrumental reason to prefer peace when the fairness condition is already met: 'When the degree of progress is the same in pursuing peace and waging war, peace is to be preferred. For, in war, there are many disadvantages, such as loss of troops, expenditure and absence from home.' The two rules together produce a decision procedure with two independent checks rather than one: first ask whether the available peaceful settlement is fair to all parties regardless of their relative power (not whether it is fair relative to what raw power alone would extract); if it is, prefer it, because peace carries no additional cost once outcomes are equivalent; if it is not — if the settlement on offer would lock in an unfair distribution — treat that unfairness itself as grounds to prefer conflict, even though conflict has real, acknowledged costs in troops, expenditure, and time. The rule explicitly refuses to treat 'weaker, equal, or stronger' status as the deciding factor for whether a treaty counts as fair — a weaker party accepting a token settlement because they lack the power to demand better is exactly the case this framework flags as unfair and therefore as grounds for conflict rather than acquiescence, not merely an unfortunate but acceptable outcome of the power imbalance. Diagnostic move: before accepting a proposed settlement to end a dispute, separate the question 'is this the path of least immediate cost' from the question 'is this outcome actually fair to every party regardless of who currently holds more power' — a settlement that fails the second test is a candidate for continued conflict under this framework even when it would minimize short-term cost, because the framework treats a locked-in unfair distribution as a worse long-term outcome than the acknowledged costs of continued conflict."
