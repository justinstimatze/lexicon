lineage:
  - source: primary
    text: zitkala-sa-shooting-of-the-red-eagle-iktomi-exposed
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'The Tree-Bound' and 'Shooting of the Red Eagle.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'I have the magic arrow! I have the beaded buckskins of the great avenger! I shall kill the red eagle; I shall wed the chieftain's beautiful daughter!' ... All his arrows he spent in vain. 'Ah! my blanket brushed my elbow and shifted the course of my arrow!' said the stranger as the people gathered around him."
canonical-instances:
  - "Someone who pads their resume with a senior job title from a role they never actually held gets hired for a position requiring that exact expertise, sails through the interview and onboarding on the strength of the claimed credentials, and then, in their first real project review, blames a vague 'communication issue with the team' rather than admit they never had the skill the title implied."
  - "A student who bought a completed project online to get into an advanced class breezes through enrollment and the first few easy assignments, then fails the first exam requiring the actual skill be demonstrated live, and immediately claims the test questions were unfairly worded rather than acknowledge the underlying gap."
critical-questions:
  - "how much does the surrounding social structure matter here -- if the chieftain and his people had tested the avenger's actual skill before granting him honor and access, would the fraud have been caught earlier, and does this framework let credentialing systems off the hook for not verifying substance before extending trust?"
  - "does everyone who fails at a real performance test after gaining access through credentials actually deserve the 'fraud' framing, or does this conflate genuine imposter syndrome (someone with real but unrecognized ability, doubting themselves under pressure) with someone who consciously knows they never had the skill at all?"
  - "is blaming an external factor after failure always evidence of conscious fraud, or is it also just an ordinary, universal human reaction to public failure that genuinely skilled people exhibit too, making the blanket-blaming detail a weaker diagnostic signal than it first appears?"
