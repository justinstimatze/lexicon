id: lex-cp6np
name: praising-the-compliant-victim-recruits-them-to-enforce-on-the-resistant-one
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When a captor or abuser has two victims and only one is resisting, praising the compliant one and denigrating the resistant one does more than reward obedience -- it turns the compliant victim into an unpaid enforcer who does the work of managing the resistant one for you. In Cushing's telling, a demon leading two captured sisters toward his cave singles one out: 'You are a good girl,' then turns on the other: 'Bring that fool along with you and come up; she will not come by herself; she has more bashfulness than sense, and less sense than my knife.' He doesn't have to drag the frightened younger sister himself. The praised elder sister does it for him: 'He led the way and the elder sister followed, dragging along the shrinking hani.' The label 'good girl' isn't affection, it's a job assignment, and the label 'fool' isn't just insult, it's the justification the elder sister will use on herself for doing the dragging. Diagnostic move: when you notice a captor or authority figure sorting people in your presence into the compliant-and-praised and the resistant-and-denigrated, be suspicious of accepting the praised role uncritically -- it often comes bundled with an assignment to manage the resistance on the captor's behalf, using your own approval-seeking as the mechanism."
related: []
evokes: [praise-as-a-job-assignment-not-affection, cushing-atahsaia-the-cannibal-demon, you-are-a-good-girl-bring-that-fool-along, dragging-along-the-shrinking-hani]
lineage:
  - source: primary
    text: cushing-atahsaia-praises-elder-sister-to-recruit-her-against-younger
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'Atahsaia, the Cannibal Demon.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'You are a good girl, said the old demon to the one who had spoken; then, glaring at the younger sister: Bring that fool along with you and come up; she will not come by herself; she has more bashfulness than sense, and less sense than my knife, because that makes the world more wise by killing off fools. He led the way and the elder sister followed, dragging along the shrinking hani.'"
canonical-instances:
  - "A controlling parent praises one sibling as 'the responsible one' in front of a struggling sibling, and the praised child, wanting to keep that status, starts policing and reporting on the struggling sibling's behavior without ever being explicitly asked to, doing the parent's monitoring work for free."
  - "An abusive partner tells one member of a friend group they're 'the only one who really gets it' while dismissing another friend as dramatic or difficult, and the praised friend begins pressuring the dismissed one to tone down complaints, effectively enforcing the abuser's narrative within the friend group."
critical-questions:
  - "Does the elder sister have any real alternative here, given that refusing to drag her sister along might provoke the demon's anger toward both of them -- is accepting the enforcer role actually a choice, or a survival response to an already coercive situation?"
  - "Would the tactic work on someone who recognized the praise as manipulation in the moment, or does it require the praised person to genuinely want the approval being offered -- what happens when the target sees through the label but complies anyway out of fear?"
  - "Is there a meaningful difference between a captor using this tactic deliberately and calculatedly, as Atahsaia seems to, versus an authority figure who praises and denigrates without any conscious intent to manufacture an enforcer -- does the mechanism still function the same way either way?"
status: active
