lineage:
  - source: primary
    text: bohm-1994-thought-as-a-system-introduction-and-ch2
    citation: "David Bohm, *Thought As a System* (Routledge 1994; ed. Lee Nichol; ISBN 9780203202241). Editor's Introduction and Chapters 1-3. Bohm's transferable claim is stated in the editor's introduction (drawing on Bohm's 1990 Ojai seminar): 'He explores the manner in which thought actively participates in forming our perceptions, our sense of meaning and our daily actions. He suggests that collective thought and knowledge have become so automated that we are in large part controlled by them, with a subsequent loss [of agency]. [...] Once we make the critical (and false) assumption that thought and knowledge are not participating in our sense of reality, but only reporting on it, we are committed to a view that does not take into account the complex, unbroken processes that underlie the world as we experience it.' Bohm's operational discipline is PROPRIOCEPTION OF THOUGHT: 'Proprioception (literally, self-perception) is that which enables us to walk, sit, eat, or engage in any other daily activity without having constantly to look at our limbs to know where they are.' The proprioceptive sense of thought is the equivalent capacity for thought — a sensing of thought as it forms, before the construction is read back as 'a perception of the world.' Bohm extends thought to include not just abstract conceptual activity but also concrete artifacts (computers, instruments, buildings) and collective patterns (national identity, ideology); thought is a SYSTEM in this extended sense. In-copyright (Routledge); verbatim quotation short and attributed under fair-use. Distinct from lex-yh672 left-brain-interpreter (Gazzaniga 1985+ split-brain research): Gazzaniga's atom is about POST-HOC RATIONALIZATION (left brain constructs a story to explain right-brain action); Bohm's is the CONSTITUTIVE upstream claim that thought participates in forming the perception itself. They compose. Distinct from lex-r3w25 confirmation-filtered-tribal-perception: confirmation-bias is the operational mechanism by which thought selectively attends to evidence; Bohm's claim is broader — about the constructive role of thought in producing the perception, of which confirmation-bias is one mode. Distinct from lex-rbcsc worldview-as-cognitively-prior: worldview is the FRAME; Bohm's atom is the constructive activity of thought within the frame. Cross-domain attestation: phenomenological tradition (Merleau-Ponty 1945 *Phenomenology of Perception* — perception as embodied participation, not as passive reception); Argyris-Schön 1974 *Theory in Practice* (espoused theory vs theory-in-use, with theory-in-use as the constructive participation); Senge 1990 *Fifth Discipline* mental-models discipline (surface and test the mental models that produce the perception); Schein 1985 *Organizational Culture* basic-assumptions level (the deepest unexamined participating constructions). The transferable claim — thought is constitutively participatory, not neutrally reportive — is well-attested across phenomenology, organizational theory, and cognitive science; Bohm's contribution is the specific framing AS A SYSTEM with proprioception as the operational discipline."
    quote: "[Bohm 1994 *Thought As a System*, editor's introduction summarizing Bohm:] 'He explores the manner in which thought actively participates in forming our perceptions, our sense of meaning and our daily actions. He suggests that collective thought and knowledge have become so automated that we are in large part controlled by them, with a subsequent loss [of agency]. [...] We have overextended our faith in the objectivist perspective. Once we make the critical (and false) assumption that thought and knowledge are not participating in our sense of reality, but only reporting on it, we are committed to a view that does not take into account the complex, unbroken processes that underlie the world as we experience it.' [Same volume on proprioception of thought:] 'Such open learning, says Bohm, lays the foundation for an exploration of proprioception. Proprioception (literally, self-perception) is that which enables us to walk, sit, eat, or engage in any other daily activity without having constantly [to look at our limbs to know where they are].' [Bohm extends thought to include collective and concrete forms:] 'Computer systems, musical instruments, cars, buildings — these are all illustrations of thought in its fixed, concrete form. [...] Thought as a system — concrete as well as abstract, active as well as passive, collective as well as individual.' [Bohm's structural claim is that thought-as-system has its own coherence and momentum, distinct from the individual thinker; the system's participatory role in forming perception is not consciously available unless proprioception of thought is cultivated as a discipline.]"
canonical-instances:
  - "Schein 1985 organizational-culture three-layers: the deepest layer (basic assumptions) is what members of the culture take for granted as 'just how things are' — these basic assumptions are the constitutive participation of organizational thought in forming organizational perception. Surfacing basic assumptions (Schein's discipline) is one operational form of proprioception of thought."
  - "Phenomenological tradition (Merleau-Ponty 1945): perception is not passive reception but embodied participation. The perceiver constitutes the perceived through embodied engagement; the perceived constitutes the perceiver reciprocally. Bohm's atom names the cognitive specification of this broader phenomenological claim."
  - "Argyris-Schön 1974 theory-in-use: people's espoused theories of action diverge systematically from the theories actually shaping their behavior. The theories-in-use are the participating constructions; surfacing them via the double-loop learning discipline is an operational form of proprioception of thought."
  - "Modern propaganda / ideology research: ideological systems work not by FORCING people to believe specific propositions but by shaping the implicit categories within which thinking happens. The ideology participates in forming the perception; the believer experiences the perception as 'just what's true.' Surfacing the participation requires standing outside the thought-system or being shown its alternatives."
  - "Distinguished from lex-yh672 left-brain-interpreter (Gazzaniga): Gazzaniga is about POST-HOC rationalization (story constructed after the action); Bohm is the CONSTITUTIVE upstream claim (thought participates in forming the perception itself). They compose — Bohm is upstream, Gazzaniga is downstream."
  - "Distinguished from lex-r3w25 confirmation-filtered-tribal-perception: confirmation-bias is the OPERATIONAL MECHANISM by which thought selectively attends to confirming evidence. Bohm's claim is broader: thought constitutes the perception in the first place, of which selective confirmation is one mode."
  - "Distinguished from naive constructivism (everything-is-socially-constructed-so-nothing-is-real): Bohm's claim is structural-participatory, not denialist. Direct unmediated sensation, novelty, surprise can break through the thought-system's prefigurations. The atom names the PARTICIPATORY role of thought, not the elimination of unmediated reality. Proprioception is the discipline of distinguishing constructed perception from unmediated sensation."
critical-questions:
  - "Is the perception you're investigating actually thought-constructed, or is it relatively unmediated? Test: does it survive across very different thought-systems (different cultures, different ideologies, different conceptual frameworks)? If yes, it's closer to unmediated. If it varies systematically with the thought-system, it's likely thought-constructed."
  - "What's the specific construction the thought-system is performing? Vague 'we construct reality' invocations don't qualify. The atom requires NAMING the specific construction — what category got applied, what salience got privileged, what alternative got filtered. Diagnostic: can you describe what a thought-system without this construction would perceive?"
  - "Are you using proprioception-of-thought as license to dismiss any perception you dislike? The atom names the participatory role, not a guarantee that participation is wrong. Sometimes the construction is well-calibrated and the perception is accurate. The discipline is to SURFACE the participation, not to refuse the perception. Diagnostic: after surfacing, does the perception still cohere with multiple-vantage-point checks?"
  - "How do you cultivate proprioception of thought operationally? Bohm's practitioner discipline is dialogue (lex-wutu8); other operational forms include Argyris-Schön double-loop learning, Schein's basic-assumptions surfacing, Senge's mental-models discipline, contemplative practice (meditation traditions that train noticing-thought-as-it-forms). The atom names the structural capacity; the operational practices are domain-specific."
  - "What's the relation to lex-rbcsc worldview-as-cognitively-prior? Worldview is the FRAME (cognitively-prior pattern-set); thought-as-participatory-system is the ACTIVE PARTICIPATION within the frame. They compose — worldview supplies the frame; thought constructively activates within it; proprioception surfaces both layers."
