id: lex-94b62
name: collective-action-draws-from-historically-constrained-culturally-transmitted-repertoire
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When predicting collective action, work from the historically-constrained repertoire of forms the group has access to. People don't invent tactics; they draw from a culturally-transmitted set. The repertoire shifts slowly; predict from what's in it, not from what's theoretically available."
related: [lex-spm8x, lex-fmgeg, lex-rgr3t, lex-dqa9j, lex-8mpe8, lex-dzr6g, lex-mwgep, lex-9kuqg, lex-sxwn7, lex-v32sr, lex-2jaf6, lex-n8888, lex-g9b38, lex-cf8kh]
scaffolds-from: [lex-mwgep]
evokes: [repertoire-of-contention, contentious-performances, demonstration, strike, petition, sit-down, charivari, machine-breaking, mutiny, cultural-transmission, flexible-repertoire, rigid-repertoire, innovation-and-diffusion, the-historically-available-set, much-smaller-than-technically-possible]
lineage:
  - source: primary
    text: tilly-1978-from-mobilization-to-revolution-ch5
    citation: "Charles Tilly, From Mobilization to Revolution (Addison-Wesley 1978), Chapter 5 'Changing Forms of Collective Action,' especially the 'Repertoires of Collective Action' section (pp. 151-159). Tilly's foundational definition: 'At any point in time, the repertoire of collective actions available to a population is surprisingly limited. Surprisingly, given the innumerable ways in which people could, in principle, deploy their resources in pursuit of common ends. Surprisingly, given the many ways real groups have pursued their own common ends at one time or another' (p.151). The repertoire is the SHORTLIST of action-forms culturally known to and practically usable by a given population at a given time. Tilly identifies the FOUR-MODEL TYPOLOGY of repertoire-availability: (1) zealot model (group uses only one specific means); (2) opportunist model (group uses any means without constraint); (3) rigid-repertoire model (group uses only familiar means, completely closed to innovation); (4) flexible-repertoire model (gradual continuous change within a constrained menu — Tilly's preferred hypothesis for most cases). The repertoire's SLOW PACE OF CHANGE means that the set of action-forms available in 1978 America (demonstration, strike, petition, pressure-group) is mostly inherited from 19th-century repertoire-shifts; charivari, machine-breaking, mutiny-in-the-Pilgrimage-of-Grace sense, regular intervillage fights, and other earlier action-forms have dropped out."
    quote: "[Tilly 1978 p.151 on the repertoire's bounded-ness]: 'At any point in time, the repertoire of collective actions available to a population is surprisingly limited. Surprisingly, given the innumerable ways in which people could, in principle, deploy their resources in pursuit of common ends.' [p.153 on the operational specification]: 'To specify the meaning of repertoire, it helps to ask this question: to what degree does the group prefer the means it has used before over those which are theoretically available for the same purpose?' [p.153 on the natural-experiment test]: '[when] similar groups in similar settings sometimes use quite different means of collective action ... the means of collective action alter and spread from one group to another ... we can gauge the importance of repertoires by comparing the successive choices of similar groups and by observing innovation and diffusion in the means of action.' [p.155 on the four models + flexible-repertoire hypothesis]: '[the third model describes a flexible repertoire. In this case] hypothesis is that the flexible repertoire is the most general case for organized [collective action]. A flexible repertoire permits continuous, gradual change in the group's [available actions].' [p.153 on what has dropped out]: 'Hijacking, mutiny, machine breaking, charivaris, village fights, tax rebellions, foot riots, collective self-immolation, lynching, vendetta have all belonged to the standard collective-action repertoire of some group at some time ... Most of these forms of action are technically feasible in contemporary America. Yet they occur rarely, or not at all ... They do not belong to the contemporary American repertoire of collective action.'"
  - source: practitioner
    text: tilly-1995-popular-contention-great-britain-1758-1834
    citation: "Charles Tilly, Popular Contention in Great Britain 1758-1834 (Harvard University Press 1995). Tilly's most empirically-detailed treatment of repertoire-shifts: documenting how British contentious action shifted from the OLD REPERTOIRE (food riots, machine-breaking, charivari, anti-press-gang protests, attack-on-conscription, attacks on tax collectors, attacks on game-laws-enforcement — actions characterized by PAROCHIAL targeting, BIFURCATED leadership, PATRONIZED relations to authority) to the NEW REPERTOIRE (demonstration, public meeting, electoral campaign, petition drives, strike, special-purpose association — actions characterized by COSMOPOLITAN scope, AUTONOMOUS leadership, DIRECT confrontation with national-level targets). The transition happened gradually between ~1789-1820 with the rise of mass national politics, public meetings, formal associations, and printed petitions. Pre-acquisition; cited via downstream literature. In-copyright."
    quote: "[Tilly 1995 thesis, paraphrase]: [British contentious action shifted between roughly 1789-1820 from a PAROCHIAL/PATRONIZED/BIFURCATED old repertoire (food riots, machine-breaking, charivari) to a COSMOPOLITAN/AUTONOMOUS/DIRECT new repertoire (demonstration, public meeting, strike, formal association, petition campaign). The transition coincided with the rise of mass national politics, parliamentary contestation, and printed media.]"
  - source: practitioner
    text: tilly-2008-contentious-performances
    citation: "Charles Tilly, Contentious Performances (Cambridge University Press 2008). Tilly's final synthesis-statement, where the term 'repertoire' is supplemented by 'performance' to capture both the SCRIPT (the available action-form) and the EXECUTION (the specific instance with its variations). Tilly emphasizes that performances are NOT mechanical repetitions of the script — there is creative variation within the constrained menu (analogous to jazz improvisation within a chord-progression). The pre-2008 understanding of repertoire-of-contention had sometimes been read too rigidly; the performance-frame restores the room for creative agency within the constrained menu. Pre-acquisition; cited via downstream literature. In-copyright."
    quote: "[Tilly 2008 thesis, paraphrase]: [the repertoire metaphor is supplemented by 'performance' to capture the creative-variation-within-script dimension. Specific contentious episodes are PERFORMANCES of available repertoire-scripts, with characteristic variation analogous to jazz improvisation within a chord-progression. The repertoire constrains; the performance executes with agency.]"
  - source: practitioner
    text: sewell-1996-historical-events-as-transformations-of-structures
    citation: "William H. Sewell Jr., 'Historical Events as Transformations of Structures: Inventing Revolution at the Bastille,' Theory and Society 25:6 (December 1996), pp. 841-881. Sewell's case-study of the 14 July 1789 storming of the Bastille as a critical episode that TRANSFORMED THE REPERTOIRE OF CONTENTION available to French (and subsequently European) actors. Before Bastille, popular violence against authority was framed as REBELLION (lèse-majesté, illegitimate) or RIOT (apolitical). After Bastille's success + ratification by the National Assembly, the same action-form was reframed as REVOLUTION (legitimate, transformative). The Sewell model: a critical event with public uptake can crystallize a new repertoire-form whose subsequent diffusion alters the global menu of action-options. Pre-acquisition; cited via downstream literature. In-copyright."
    quote: "[Sewell 1996 thesis, paraphrase]: [the 14 July 1789 storming of the Bastille was a critical event that transformed the repertoire of contention by crystallizing 'revolution' as a new legitimate action-frame, distinct from rebellion (illegitimate) or riot (apolitical). The successful uptake of this new frame by the National Assembly retroactively legitimated the action, enabling its subsequent diffusion as a model for popular political action across Europe.]"
canonical-instances:
  - "Anti-monasteries Pilgrimage of Grace 1536 (Tilly 1978 Ch.5): The 'commons' of Yorkshire rose by tens of thousands using a then-standard repertoire-form: an existing functioning group (army, community, parish) assembles, casts off its constituted authorities, commissions a successor (knowing the role is mortally risky), presents grievances to higher authority, and resists until demands are met OR the action is utterly destroyed. The successor is afterwards executed. This action-form was RECOGNIZED as legitimate in 1536 Tudor England; it had a place in the repertoire. By 1978 (when Tilly wrote) almost no one in the West would recognize this as an action-form-available-to-them. The repertoire dropped it."
  - "Italian sit-down strikes 1919-1920 (Tilly 1978 Ch.5): In Italy of 1919 sit-down strikes were rather a novelty. By August 1920 half a million workers were occupying their factories. The action-form entered the Italian working-class repertoire within ~12 months via diffusion + innovation. From there it spread to US auto-industry (Flint sit-down 1936-1937) and onward as a standard tactical option. The case demonstrates that repertoire-changes can be FAST when conditions align, contrary to a too-rigid reading of repertoire-stability."
  - "Spanish Armada-era mutiny-with-electo (Tilly 1978 Ch.5 + Parker 1973): Spanish armies in the Netherlands toward end of 16c regularly elected their own chief (the elecio), declared they would follow no other orders until back-pay demands satisfied, sometimes continued to fight under their own direction, sometimes pillaged. They demanded amnesty for all rebellion-acts and usually won. This MUTINY-WITH-ELECTO was a standard, recognized, repeatedly-deployed action-form in the late-16c Spanish military repertoire. By 1978 the word 'mutiny' is restricted to military-court-martial contexts and no one would recognize the electo-pattern as a feasible action-option."
  - "1789 Bastille → 'revolution' as new repertoire-form (Sewell 1996): Before 14 July 1789 the storming of a royal fortress would be framed as rebellion (lèse-majesté) or riot. The National Assembly's ratification of the storming retroactively legitimated it under a NEW frame: 'revolution' as legitimate popular sovereignty-act. The frame's stabilization and diffusion across Europe created a new repertoire-form deployable in 1848, 1871, 1917, 1949, 1979, 2011, etc. — but only because Bastille succeeded in entering and stabilizing the repertoire."
  - "MMA submission-grappling repertoire (generalized): The set of submission techniques available to a 1990s MMA fighter (boxing punches + wrestling takedowns + basic jiu-jitsu chokes) has expanded by 2024 to include heel-hooks, leg-locks, cartwheel-passes, and dozens of guard-pass variants developed by the Danaher Death Squad and other innovators. New techniques (e.g., the saddle position) enter the repertoire via demonstrated tournament-success + video diffusion. Old techniques (e.g., the 1990s-style 'lay-and-pray' top-position) leave the repertoire when rule-changes make them less successful. The repertoire-of-techniques pattern matches Tilly's repertoire-of-contention."
  - "Standup comedy repertoire: Cultural norms about which premises are sayable and which approaches land have shifted dramatically across decades. Early-90s 'observational' comedy (Seinfeld-Roseanne) gave way to mid-2000s 'cringe' style (Office, Curb), 2010s 'identity-and-trauma' confessional (Notaro, Wong, Mulaney), 2020s 'anti-comedy' deconstructive (Nanette, Hannah Gadsby). The action-form available to a working comedian in 2024 is much narrower than the technically-possible action-form set, and the repertoire only shifts via innovation that gets diffusion + legitimating uptake."
  - "operationally distinct from lex-rgr3t habit-formation-frees-attention-for-higher-order-work: lex-rgr3t is an INDIVIDUAL-COGNITIVE pattern (well-practiced individual habits free attention for novel work). lex-94b62 is a COLLECTIVE-CULTURAL pattern (well-established collective action-forms constrain what groups can plausibly do). The two are analogous-but-distinct: lex-rgr3t is psychological; lex-94b62 is socio-cultural. They can compose (individual habit + collective repertoire both constrain action-options) but operate at different levels of analysis."
  - "operationally distinct from lex-mwgep positive-feedback path-dependence: lex-mwgep is the GENERAL substrate-pattern for path-dependent lock-in. lex-94b62 is a SPECIFIC application: the path-dependence of action-FORM availability via cultural transmission. lex-mwgep covers QWERTY-style lock-in (technology); lex-94b62 covers Pilgrimage-of-Grace-mutiny-style drop-out (action-forms). They share mechanism (positive feedback / increasing returns to familiarity) but lex-94b62 specifies the substrate (action-forms in collective practice) and the diffusion-mechanism (cultural transmission + demonstration of success)."
critical-questions:
  - "is the repertoire RIGID or FLEXIBLE in the case under analysis? Tilly's four-model typology distinguishes: rigid-repertoire groups (closed to innovation, mechanical reuse) vs. flexible-repertoire groups (continuous gradual change within constrained menu). Most groups are flexible; some specific cases (highly-traditional rural communities; ritualized military formations) may be more rigid. Discriminator: examine the rate at which the group's action-set has changed over recent decades; if substantially changed, flexible; if essentially unchanged, rigid."
  - "what's the time-scale on which the repertoire is changing? Tilly emphasizes that most repertoire-changes happen on DECADE-to-CENTURY scales. The British 1789-1820 transition took ~30 years; the rise of sit-down strikes took ~12 months in Italy 1919-1920; the rise of online petition platforms (Change.org, MoveOn) took ~5-10 years. Discriminator: identify the time-scale appropriate to the case; very-short-time-scale repertoire-changes (months) are unusual and require explanation; very-long-time-scale changes (centuries) often coincide with broader political-economic transformations (industrialization, urbanization, mass-media)."
  - "is the action-form actually available to the analyzed group, or only theoretically possible? The repertoire concept requires sharp distinction between TECHNICALLY POSSIBLE actions (could the group physically do this?) and PRACTICALLY AVAILABLE actions (would they recognize this as an option to consider?). A 21st-century American could technically organize a charivari; they would not recognize it as available. The recognition-as-available is the operational discriminator."
  - "what's the role of innovation + diffusion? Tilly emphasizes that the repertoire changes through TWO MECHANISMS: innovation (someone tries something new and it succeeds) + diffusion (others learn about and copy the success). Both are required: innovation without diffusion produces no repertoire-shift; diffusion without innovation produces no new action-forms. Discriminator: in cases of repertoire-shift, identify both the specific innovators (the people / groups who first deployed the new action-form) AND the specific diffusion-channels (media, organizers, networks, immigration). If either is missing, the analyst has misidentified the case."
  - "could the apparent repertoire-constraint be EXPLAINED by structural conditions (resource availability, repression-capacity, legal regimes) rather than cultural-inheritance? The repertoire-of-contention concept claims the constraint is CULTURAL — actors don't even consider technically-possible options because the culture has not made them available-to-think. Critics could argue the constraint is STRUCTURAL — actors don't try mutiny-with-electo because modern military discipline + criminal-law makes it unviable. Discriminator: examine cases where structural conditions DO allow a no-longer-available action-form; if it's still not attempted, cultural-repertoire is doing real work; if it's attempted, structural-explanation suffices."
  - "is the analyst conflating REPERTOIRE-OF-CONTENTION with FRAMING / MASTER-FRAMES (Snow-Benford 1992)? Repertoire is the set of ACTION-FORMS available; frames are the set of MEANINGS used to interpret action. The two interact (new frames can legitimate new repertoire-forms; new repertoire-forms can require new frames) but are conceptually distinct. Discriminator: if the case is about WHAT ACTORS DO (action-forms), use lex-94b62; if it's about HOW ACTORS INTERPRET (meaning-frames), use a framing-analysis tool (not currently substrate-grounded; future mining-pass target — Snow-Benford 1992, Polletta 2006)."
status: active
