id: lex-w7ex4
name: equanimity-is-demonstrated-by-contrasting-trivial-and-catastrophic-loss
type-in: process
type-out: posture
_tier: atomic
agent-instruction: 'Someone who has just received catastrophic news but wants to demonstrate the depth of their composure, rather than merely claim it, waits for an unrelated trivial loss to occur in front of witnesses and lets their reaction to it — or lack of one — become the proof. Timing matters: disclosing the catastrophe only after the small loss has already drawn comment gives the audience a stick to measure it against, one they wouldn''t have had if the big loss had simply been announced on its own. In the Bhadda-sala-Jataka, when a serving-bowl is broken in front of Bandhula''s widow and the monk tells her not to trouble over it, she produces, for the first time, the letter reporting her husband and thirty-two sons beheaded, and asks: if that loss doesn''t trouble her, why would a broken bowl?'
related: []
evokes: [jataka, dvadasanipata, bhadda-sala-jataka, trivial-loss-as-rhetorical-foil, composure-demonstrated-not-asserted]
lineage:
  - source: primary
    text: jataka-chalmers1895-bhadda-sala-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 465, Bhadda-sala-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'Here I have a letter informing me that my husband and his two-and-thirty sons have been beheaded. If I do not trouble about that, am I likely to trouble when a bowl is broken?'
canonical-instances:
  - 'A surgeon who has just been told a family member died mid-surgery says nothing until a nurse apologizes for dropping a tray of instruments, then remarks that if a dropped tray doesn''t rattle her today, nothing in the room will — only then explaining why.'
critical-questions:
  - 'Withholding the catastrophic news specifically to stage this contrast delays whoever needed to know it for its own sake — is the demonstrative value of the comparison worth that delay, or is the withholding itself doing work the equanimity claim doesn''t actually need?'
status: active
