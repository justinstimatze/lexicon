lineage:
  - source: primary
    text: solnit-2009-a-paradise-built-in-hell
    citation: "Rebecca Solnit, A Paradise Built in Hell: The Extraordinary Communities That Arise in Disaster (Viking Penguin, 2009). Part I, 'A Millennial Good Fellowship: The San Francisco Earthquake,' section 'General Funston's Fear'; and Part II, 'Halifax to Hollywood: The Great Debate,' section 'Hobbes in Hollywood, or the Few versus the Many.'"
    quote: "[Tierney's definition, quoted by Solnit:] 'Elites fear disruption of the social order, challenges to their legitimacy.' She reversed the image of a panicking public and a heroic minority to describe what she called \"elite panic.\" She itemized its ingredients as \"fear of social disorder; fear of poor, minorities and immigrants; obsession with looting and property crime; willingness to resort to deadly force; and actions taken on the basis of rumor.\" ... [Lee Clarke, who coined the term with Caron Chess, quoted directly:] 'The distinguishing thing about elite panic as compared to regular-people panic, is that what elites will panic about is the possibility that we will panic... As we define it, elite panic, as does general panic, involves the breaking of social bonds. In the case of elite panic it involves the breaking of social bonds between people in positions that are higher than we are... So there is some breaking of the social bond, and the person in the elite position does something that creates greater danger.' ... [On Three Mile Island, 1979 — Clarke on the actual public evacuation versus the officials:] 'In Three Mile Island, there was an evacuation of nearly 150,000 people. It was mainly a self-directed evacuation. The officials weren't in charge of it. By all accounts it was quite orderly... That wasn't panic, the elites panicked there. They didn't know what was going on inside the reactor... So what happens? The elites in that case, they're afraid people are going to panic so they hold the information close to the vest about how much trouble the reactor is in.' [Solnit's own gloss:] 'Imagining that the public is a danger, they endanger that public.' ... [On San Francisco 1906 — Mayor Schmitz's proclamation, quoted verbatim by Solnit:] 'The Federal Troops, the members of the Regular Police Force, and all Special Police Officers have been authorized by me to KILL any and all persons found engaged in Looting or in the Commission of Any Other Crime.' [Solnit's summary line naming the pattern:] 'Disaster scholars now call this fear-driven overreaction elite panic.' (Solnit, A Paradise Built in Hell, 2009)"
canonical-instances:
  - "San Francisco 1906: Brigadier General Frederick Funston marched troops into the city without legal authority ('without warrant of law and without being requested to do so'), calling the citizenry an 'unlicked mob'; Mayor Schmitz's proclamation authorized troops to 'KILL any and all persons found engaged in Looting.' Soldiers treating residents as enemies drove away the very citizen-volunteers who were successfully fighting the fires in undefended districts, contributing to a conflagration that destroyed twenty-eight thousand buildings; historians estimate fifty to five hundred citizens were killed by the occupying forces, on top of roughly three thousand earthquake deaths."
  - "Hurricane Katrina, 2005: rumors of mass rape and murder in New Orleans — later confirmed false — were believed and amplified by the national media and the city's police chief during the days people were dying on rooftops and in hospitals; those rumors led soldiers and rescuers to 'regard victims as enemies,' and people attempting to evacuate were turned back at gunpoint or shot. Meanwhile the same population overwhelmingly organized boat rescues, food and water distribution, and sheltered strangers."
  - "Three Mile Island, 1979: the public evacuation of nearly 150,000 people was self-directed and, by all accounts, orderly. The actual panic was among officials, who — not knowing whether the reactor was thirty minutes from a meltdown — 'hold the information close to the vest' out of fear that the public would panic if told, withholding exactly the information residents needed to protect themselves."
critical-questions:
  - "Doesn't this just relabel any unpopular security response as 'elite panic' after the fact? No — the diagnostic is checkable in the moment, not just after the fact: it asks whether the threat being prevented is documented for this specific event or assumed from rumor/stereotype, and whether the actor proposing escalation also controls whether the public can verify the threat. A security response to a DOCUMENTED, specific threat with transparent justification does not fit the pattern; Schmitz's kill-on-sight order for property crime during a subsistence crisis, and officials silently sitting on a near-meltdown, both fail that test on the record."
  - "Is the claim that authorities are always wrong to worry about disorder? No — the claim is narrower: elite panic names cases where the FEARED disorder is a projection (rumor, class/racial stereotype) rather than an observed fact, and where the response to that projection causes real harm that the actual, largely-prosocial public behavior does not warrant. Real, documented threats (an armed group, a confirmed structural collapse) call for a real response; the pattern is specifically about acting on an unfounded fear of the population itself."
  - "How is this different from garden-variety self-fulfilling prophecy (lex-z3qjg)? Merton's bank run is SYMMETRIC — the same population's belief about the bank becomes true because that population acts on it. Elite panic is ASYMMETRIC — a power-holding minority's false belief about a separate, powerless majority drives a harmful response, without the majority's actual behavior ever validating the belief; the elites' fear is never really confirmed, only acted on, and the resulting harm is inflicted downward rather than emerging from the believing population's own collective action."
