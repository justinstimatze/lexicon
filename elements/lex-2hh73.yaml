id: lex-2hh73
name: selecting-for-a-visible-trait-drags-along-a-hidden-correlated-trait
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When a population (biological, organizational, or algorithmic) is under sustained selection pressure for one visible, intentionally-targeted trait, check whether that trait is genetically or structurally linked to an unrelated, unselected trait — because the linked trait will drift along for free, and it may be the linked trait, not the intended one, that turns out to unlock a new capability. Selectors don't need to know about, understand, or even suspect the hidden trait for this to happen: purely visible, purely self-interested selection on the target trait is sufficient. Diagnostic: when a system unexpectedly gains a capability nobody was selecting for, check whether it's a correlated rider on a trait that WAS being selected for, rather than a mysterious emergent leap."
related: [lex-hbknh]
evokes: [genetic-hitchhiking, correlated-response-to-selection, day-length-sensitivity, cotton-domestication, kara-tepe, unintended-capability-unlock, pleiotropy-adjacent]
lineage:
  - source: primary
    text: postrel-2020-fabric-of-civilization-ch1-fiber
    citation: "Virginia Postrel, The Fabric of Civilization: How Textiles Made the World (Basic Books, 2020), Chapter One: Fiber, on cotton domesticated for frost-prone latitudes it originally couldn't survive in."
    quote: "Perhaps the change was driven by commercial competition. Suppose you're growing cotton in the Indus Valley, known as a source of cotton cloth as far back as Herodotus's writings in the fifth century BCE. If your cotton trees—and they were in fact trees—bloom earlier than your neighbor's, you can get to market earlier. You get paid sooner... Over time, then, profit-seeking cultivators might favor early-blooming trees that weren't sensitive to day length. They'd replant, or perhaps sell, the seeds from those trees. Competition would push the flowering period earlier and earlier, until the harvest that once waited for winter came in the late summer and early fall. Farmers wouldn't have to know or care that the cotton was no longer sensitive to day length. They wouldn't have to consider frost. They'd just need to favor plants that would give them an earlier harvest. By doing so, they'd gradually develop breeds of cotton that could bloom even in places like Kara-tepe."
  - source: discovery-loop
    text: distinctness-audit-postrel-correlated-selection-vs-noisy-proxy
    citation: "Distinct from lex-hbknh (selecting-on-a-noisy-proxy-also-selects-for-the-noise): lex-hbknh's mechanism is measurement error -- the proxy is an imprecise stand-in for the real target, and its noise component gets selected along with the signal. This atom's mechanism has no measurement error at all -- early-blooming IS the real, accurately-measured target trait, not a noisy stand-in for something else. What rides along is a genuinely separate, biologically-linked trait (day-length sensitivity), not noise in the measurement of the target itself. lex-hbknh is about imprecision in what you're measuring; this atom is about a hidden structural linkage between two otherwise-independent traits."
canonical-instances:
  - "Cotton seeds excavated at Kara-tepe, a pre-Islamic site near the Aral Sea in northwestern Uzbekistan (carbonized in a house fire, radiocarbon-dated no later than 500 CE), turned out to be genuine cotton -- a shock to the archaeologist who found them, Mac Marston, since cotton's normal day-length-triggered flowering cycle should have made it impossible to grow that far from the tropics before a killing frost. Indian cotton farmers, breeding purely for earlier market access, had inadvertently produced a day-length-insensitive strain centuries before anyone in Uzbekistan planted it."
  - "The same pattern recurs across domesticated species: Dmitry Belyaev's Soviet silver-fox breeding program (begun 1959) selected only for tameness toward humans, generation after generation, with no interest in appearance -- yet within a few generations the tame foxes began reliably developing floppy ears, curled tails, and piebald coats, traits nobody bred for and that the untamed control line never developed. The exact biological pathway linking tameness-selection to those correlated traits is still actively debated, but the observational fact -- selecting purely for one trait dragged along others nobody selected for -- is not in dispute."
critical-questions:
  - "Is the visible trait actually the whole selection target, or could there be a second, unmeasured trait riding along because it's linked to the first? Absence of intent to select for it is not evidence the link doesn't exist."
  - "Could the new capability that appears to emerge from the selected trait itself actually be produced by the correlated rider trait instead? Kara-tepe cotton's capacity to grow at higher latitudes came from day-length insensitivity, not from early blooming per se -- confusing the two would misattribute the unlock to the wrong trait."
  - "Does the correlation between the two traits hold because of a real shared mechanism (genetic linkage, shared developmental pathway, shared structural constraint), or is it coincidental to this one population and liable to break down elsewhere?"
severity-tier: info
status: active
