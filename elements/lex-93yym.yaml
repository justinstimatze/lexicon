lineage:
  - source: primary
    text: hyde-jung-purification-relocates-rather-than-destroys-the-excluded
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' quoting Carl Jung on the alchemical figure Mercurius as Christianity's excluded shadow. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "A loving belief in the purified Christ, Jung writes, “naturally involves cleansing one’s own house of black filth. But the filth must be dumped somewhere, and no matter where the dump lies it will plague even the best of all possible worlds with a bad smell.” Jung is here addressing himself to the problem of Christian dirt, of what to do with the by-products of putting a spiritual house in order. The rule seems to be that there is always error, imperfection, and diminishment when human beings set themselves to putting things in order, even if it is a church they are cleaning up. Something will always be excluded that turns out to be needed in a later time or place, whereupon an “occult” science must arise whose task is to reclaim what has been lost."
canonical-instances:
  - "A company culture that officially prohibits any expression of internal conflict or disagreement doesn't eliminate conflict, it relocates it into anonymous employee surveys, off-the-record hallway conversations, and eventually a wave of resignations that surprise leadership, who believed the absence of visible conflict meant the conflict had actually been resolved."
  - "A field of medicine that purges itself of a treatment approach as unscientific doesn't make patient demand for that approach disappear, it pushes that demand into unregulated alternative-medicine markets with none of the field's own safety oversight, where it persists and grows precisely because the official field refuses to engage with what it excluded."
critical-questions:
  - "Is 'relocation, never destruction' actually true in every case, or are there purifications that genuinely do eliminate their target with no persistent remainder (a successfully eradicated disease, a fully deprecated piece of code), making the general claim an overreach from cases where it happens to be true?"
  - "Does treating any marginal or reclaiming discipline as proof of relocated exclusion risk becoming unfalsifiable, since almost any organized system generates SOME fringe counter-practice, whether or not that practice is actually retrieving something the main system excluded rather than simply being wrong or disreputable on its own terms?"
  - "Is Jung's own framework here doing independent explanatory work, or is it primarily a psychoanalytic just-so story that fits his particular theoretical commitments (archetypes, the shadow, alchemy) without offering a way to verify the claim against cases outside his own interpretive system?"
