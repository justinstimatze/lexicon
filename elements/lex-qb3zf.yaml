Jackall's *Moral Mazes* (1988/2014) field-studied corporate managers and surfaced "milking" as a specific operational pattern: managers extract short-term performance from physical or organizational assets by deferring maintenance, capital expenditure, and any investment whose payoff lands after their expected tenure. The mechanism is procedural, not ethical: the system rewards short-term metrics, doesn't track managers across jobs, and rotates them out before degradation becomes visible. Under these conditions, milking is the dominant strategy and is "institutionalized and sanctioned" — not a violation of the system but its rational expression.

The transferable form generalizes beyond corporate management: any role where (1) the agent is rotated faster than the consequence-window, (2) the agent's metrics ignore the rate of asset-degradation, and (3) the next occupant inherits the now-visible decay — produces the milking pattern. The blame attaches to the successor ('great manager X, now poor Y can't keep the plant running') because the visible signal of degradation appears under their tenure. This signature — the "predecessor-looked-great" pattern — is itself diagnostic: when you see it, the ex-incumbent's stellar record was probably extraction, not stewardship.

Distinct from Goodhart-style metric-manipulation (lex-hbknh/0615): in milking, the metric is correctly measuring short-term profit; the failure is that consequence-windows are decoupled from tenure-windows so the agent's expected utility function differs from the principal's. Inverse condition — tenure ≥ consequence-window — restores alignment: founders defending the long-run value of what they built, long-tenure tradesmen whose name is on the work, equity-locked partners. Fix is not exhortation but window-alignment: longer tenure, deferred compensation paid out over the consequence-window, successor-protected accounting that surfaces deferred maintenance, attached-to-asset reputation systems.
