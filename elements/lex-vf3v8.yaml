id: lex-vf3v8
name: cross-factional-norms-usually-form-only-after-a-shared-catastrophe
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Don't expect rival political factions to adopt mutual-toleration norms preemptively, on the strength of argument or goodwill alone — norm creation across genuine rivals is a collective venture that usually requires a shared catastrophe to force it into existence. Levitsky and Ziblatt: 'norm creation is a collective venture—it is only possible when a critical mass of leaders accepts and plays by new unwritten rules. This usually happens when political leaders from across the spectrum have stared into the abyss and realized that if they do not find a way of addressing polarization, democracy will die. Often, it is only when politicians suffer the trauma of violent dictatorship, as they did in Chile, or even civil war, as in Spain, that the stakes truly become clear.' No single faction can unilaterally establish a norm of restraint, because restraint only pays off once the other side reciprocates. Nothing forces that reciprocity except a cost so severe and so recently shared that every faction, independently, concludes the old way of fighting is no longer survivable. Advocating for civility before that cost has been paid is advocating for unilateral disarmament; it takes the trauma itself, not the argument for avoiding it, to make the deal enforceable."
related: [lex-cahck, lex-dvb4u, lex-e7k3x, lex-2vsgs]
evokes: [levitsky-ziblatt-2018-how-democracies-die, chile-democratic-concertation-after-pinochet, german-cdu-founded-after-nazism, democracy-of-agreements]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch9-norm-creation-requires-shared-catastrophe
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 9 'Saving Democracy,' on why the Chilean and German precedents for cross-factional norm-building are hard for the United States to replicate."
    quote: "'norm creation is a collective venture—it is only possible when a critical mass of leaders accepts and plays by new unwritten rules. This usually happens when political leaders from across the spectrum have stared into the abyss and realized that if they do not find a way of addressing polarization, democracy will die. Often, it is only when politicians suffer the trauma of violent dictatorship, as they did in Chile, or even civil war, as in Spain, that the stakes truly become clear.'"
canonical-instances:
  - "Chilean Socialist Ricardo Lagos was so estranged from Christian Democratic rival Eduardo Frei Montalva that in 1975 he called in sick rather than meet him at a university visit. Both men had lived through Pinochet's 1973 coup, which their own parties' mutual distrust had helped enable. By 1978 they were meeting regularly; by 1985, Socialists, Christian Democrats, and nineteen other parties signed the National Accord for a Transition to a Full Democracy — a pact that produced two decades of 'consensus politics' none of them had been willing to practice before the dictatorship."
  - "Pre-1933 German conservatism never managed to be both well-organized and democratic — the divide between Protestant and Catholic conservatives left a vacuum that Hitler's movement filled. Only after 1945, with the trauma of Nazism and the war behind them, did conservative Catholics and Protestants who had shared prison cells and concentration camps found the Christian Democratic Union together. It became a durable pillar of West Germany's postwar democracy; no comparable cross-confessional conservative party had ever existed before it."
critical-questions:
  - "Both instances involve authoritarian rule imposed by the same side whose factions later reconciled — Chilean elites under Pinochet, German conservatives complicit in enabling Hitler. Does the mechanism require the catastrophe to specifically discipline the parties that need to cooperate afterward, or would an external catastrophe (a war with a foreign power, a pandemic) that doesn't implicate either faction's own past conduct produce the same reconciling effect?"
  - "The book explicitly doubts the U.S. can follow this path without a comparable catastrophe first. If that's right, what does it imply about deliberate, catastrophe-free interventions like elite dialogue initiatives or truth commissions — are they simply ineffective substitutes, or could they function as a cheaper, partial version of the same mechanism?"
  - "How much time has to pass after the catastrophe before the norm actually solidifies — Chile took roughly a decade (1975 to 1985) of relationship-building even after the shared trauma was clearly recognized. Is the catastrophe sufficient on its own, or merely necessary, with the actual norm-formation work still requiring years of separate, deliberate relationship-building on top of it?"
