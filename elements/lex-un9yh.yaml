id: lex-un9yh
name: an-unmeetable-standard-meant-as-deflection-backfires-when-reality-meets-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "To avoid an unwanted obligation without outright refusing it, setting a criterion you privately assume is impossible to satisfy lets you appear cooperative while expecting the issue to quietly resolve itself — a strategy that backfires completely if reality actually manages to meet the standard you thought was safe. In the Jataka's tale of the golden image, to avoid marriage without refusing his parents outright, the Bodhisatta sets a criterion he assumes no real woman could meet: '\"If you can find me a maiden like unto this, I will take her to wife.\"' Searchers actually find such a woman, forcing him to honor a commitment he only ever meant as a stall."
related: []
evokes: [jataka, catukkanipata, ananusociya-jataka, an-assumed-impossible-condition-is-actually-satisfied, a-stalling-tactic-becomes-a-binding-commitment]
lineage:
  - source: primary
    text: jataka-chalmers1895-ananusociya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book IV (Catukkanipata), No. 328, Ananusociya-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"If you can find me a maiden like unto this, I will take her to wife.\""
canonical-instances:
  - "To avoid committing to a project without refusing their boss outright, an employee sets a condition they're sure can't be met — 'I'll take it on if we can get budget approval by Friday' — only to have finance approve the funding same-day, leaving them holding a commitment they never actually wanted."
  - "In the Jataka's tale of Kusa (Book XX, No. 531), reluctant to marry, Prince Kusa privately fashions a golden image more beautiful than any woman he expects to exist and tells his mother, 'When I find a woman like this, I will take her to wife,' meaning to stall indefinitely — only for his envoys to actually find Pabhavati, a princess who matches it."
critical-questions:
  - "Is setting a deliberately unmeetable condition a form of dishonesty, even though no explicit lie is told — does the Bodhisatta's intent to deceive his parents about his real willingness matter morally, given the condition itself is stated truthfully?"
  - "Once the impossible standard is met, is honoring the resulting commitment actually required, or does the original deceptive intent behind setting the condition release the person from it?"
status: active
