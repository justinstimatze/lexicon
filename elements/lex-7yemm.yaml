id: lex-7yemm
name: myth-mediates-an-irresolvable-contradiction-via-structural-transformation
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a body of narrative variants keeps circulating around the same unresolved tension — origin stories, foundational myths, recurring cultural anxieties retold with different casts and settings — don't read the variation as noise obscuring one 'true' version. Lévi-Strauss's claim: a myth's function is to provide a logical model capable of overcoming a real contradiction, which is by definition an impossible achievement — so the myth cannot resolve the contradiction, only restate it in successively transformed terms. This is why myths proliferate variants rather than converging on a single canonical telling: each retelling is another attempt at the same impossible mediation, and the underlying structure (the relations between elements, not the surface content) stays constant across the transformations. When you find a cluster of variant tellings of 'the same' story, look for the structural relation each version is trying, and failing, to resolve — that relation is the actual content, not any single version's plot."
related: [lex-8mk8t, lex-abx7f, lex-b3vap, lex-ppq72, lex-wa3fk]
evokes: [mytheme, structural-transformation, logical-model-of-a-contradiction, bricolage-of-variants, oedipus-myth-analysis, gross-constituent-units]
lineage:
  - source: primary
    text: levi-strauss-1955-structural-study-of-myth
    citation: "Claude Lévi-Strauss, 'The Structural Study of Myth,' collected in Structural Anthropology (Basic Books, 1963; Claire Jacobson and Brooke Grundfest Schoepf trans.), originally published in Journal of American Folklore 68(270), 1955."
    quote: "'The purpose of myth is to provide a logical model capable of overcoming a contradiction (an impossible achievement if, as it happens, the contradiction is real), a theoretically infinite number of slates will be generated, each one slightly different from the others. Thus, myth grows spiral-wise until the intellectual impulse which has produced it is exhausted.' [the Oedipus worked example:] 'The myth has to do with the inability, for a culture which holds the belief that mankind is autochthonous... to find a satisfactory transition between this theory and the knowledge that human beings are actually born from the union of man and woman... the Oedipus myth provides a kind of logical tool which relates the original problem — born from one or born from two? — to the derivative problem: born from different or born from same?'"
canonical-instances:
  - "The Oedipus myth (Lévi-Strauss's own worked example): a culture committed to human autochthony (people spring from the earth itself) also knows, empirically, that people are born from the union of two parents. The myth doesn't resolve this — it restates the same unresolvable relation (one-origin vs. two-origin) in a derivative, more tractable form (same-blood marriage vs. different-blood marriage), and the recurring motifs across variant tellings (self-destruction, crippledness, autochthony-denial) are the same underlying relational structure recombined."
  - "Origin myths for any group identity under genuine internal contradiction (a nation founded on both conquest and liberation; an institution claiming both meritocracy and inherited privilege): the proliferation of competing founding narratives isn't sloppy history-keeping — each version is a fresh attempt at logically mediating a contradiction the group cannot actually resolve, which is why no single canonical version ever fully satisfies and new tellings keep appearing."
  - "operationally distinct from lex-ppq72 descent-and-return: lex-ppq72 (Campbell's monomyth) names a narrative ARC — a hero descends, transforms, returns with a boon — shared across myths regardless of what contradiction, if any, they're mediating. This atom names the STRUCTURAL FUNCTION of myth as such: providing a logical model for an unresolvable contradiction. A given myth can instantiate both (a descent-and-return arc that is also mediating a specific cultural contradiction) or either alone."
  - "operationally distinct from lex-wa3fk three-independent-routes-produce-three-distinct-cosmological-resolutions: lex-wa3fk compares different cosmological SYSTEMS that each resolve a shared question via a different method. This atom is about what a SINGLE myth (or myth-family) is doing internally — mediating a contradiction its own culture cannot escape — not about comparing resolution-methods across systems."
  - "operationally distinct from lex-abx7f concrete-science-classifies-via-systematic-differentiation: lex-abx7f (also Lévi-Strauss, from The Savage Mind) is about classificatory thought generally — the demand for order via differentiation, applied to plants, animals, kinship categories. This atom is specifically about myth's function as a logical-mediation device for contradictions that resist direct resolution. Related (both are Lévi-Strauss's structuralism) but distinct claims: one is about classification, the other about narrative mediation of paradox."
critical-questions:
  - "is the contradiction the myth is mediating genuinely irresolvable in the culture's own terms, or is it a solvable practical problem being needlessly mythologized — the mechanism only applies to the former"
  - "does the proliferation of variants actually track a stable underlying relational structure, or is it just narrative drift with no shared logical core — Lévi-Strauss's method requires demonstrating the transformation-set, not merely asserting one"
  - "whose contradiction is being mediated, and who benefits from the mediation staying perpetually incomplete rather than resolved — a myth that keeps re-mediating a contradiction can also serve to keep the underlying tension from ever being addressed directly"
status: active
