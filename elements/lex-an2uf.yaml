id: lex-an2uf
name: a-lesson-against-greed-is-enacted-by-refusing-its-own-reward
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'A teacher delivering an anti-greed lesson can make the argument in words, but the strongest possible proof of the claim is to perform non-attachment at the exact moment a reward for the teaching is offered — refusing payment for the very wisdom that counsels against craving reward. The refusal isn''t a rhetorical flourish appended after the argument; it''s staged as the final line of the teaching itself, so the audience watches the principle being lived rather than merely stated. In the Kama-Jataka, after being offered a thousand gold pieces for each of several verses on renouncing desire, the Bodhisatta answers: ''For thousands, hundreds, million times a million, nought care I: as the last verse I uttered, in my heart desire did die'' — refusing the very payment the lesson was ostensibly delivered to earn.'
related: []
evokes: [jataka, dvadasanipata, kama-jataka, proof-by-demonstration-not-argument, teacher-refuses-payment-to-prove-the-lesson]
lineage:
  - source: primary
    text: jataka-chalmers1895-kama-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 467, Kama-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'For thousands, hundreds, million times a million, nought care I: As the last verse I uttered, in my heart desire did die.'
canonical-instances:
  - 'A consultant who has just finished a keynote on avoiding vendor lock-in and conflicts of interest publicly declines the client''s on-the-spot offer of an exclusive retainer at triple her normal rate, making the refusal itself, not the talk, the thing the audience remembers.'
critical-questions:
  - 'Refusing a specific offered reward is a low-cost demonstration if the teacher never particularly wanted that reward to begin with — does the refusal actually prove non-attachment, or only prove that this particular payment wasn''t the teacher''s actual temptation?'
status: active
