evokes: [give-them-a-position-that-turns-their-base-against-them, kautilya-tackling-a-pretender-with-unpayable-tribute, downfall-engineered-to-look-self-inflicted, an-impossible-obligation-disguised-as-a-concession]
lineage:
  - source: primary
    text: kautilya-arthashastra-tackling-a-pretender-with-sterile-land-and-exorbitant-tribute
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Peaceful Rule of Acquired Territory,' 'New Territory, Acquired by Conquest,' {13.5.3-21}."
    quote: "'A pretender from the enemy's family who can recover the territory or a noble in the frontier forests who can harass the conqueror shall be tackled by giving him sterile land or land which is, at best, one-quarter fertile. The grant shall be made subject to payment of an exorbitant tribute in money and troops, so that its payment will make the citizens in the towns and countryside revolt and kill the prince or noble.'"
canonical-instances:
  - "A company neutralizes a popular internal rival for the CEO role not by firing them, but by promoting them to lead a division with an impossible budget and an aggressive growth target set by someone else, ensuring that when the division inevitably fails to hit the target, the rival's own team turns against their leadership rather than the company having to remove them directly."
  - "A political party sidelines a popular but inconvenient figure by nominating them to head a commission tasked with resolving an intractable, thankless issue with no real resources or authority to succeed, guaranteeing that the figure's own constituency blames them for the commission's failure rather than the party that set them up to fail."
critical-questions:
  - "how reliably can the engineer of this setup control the outcome once the target holds real power and real followers -- does the pretender or rival sometimes recognize the trap and either refuse the position or find a way to meet the impossible terms anyway, turning the tactic back on its architect?"
  - "does this tactic risk real collateral harm to the people who end up bearing the impossible burden (the citizens facing exorbitant tribute, the team facing an impossible target) even though they were never the actual target -- is engineering someone else's downfall through the suffering of their followers different in kind, not just method, from direct action against the target?"
  - "does repeated use of this tactic eventually become recognizable, making future targets and their followers wary of any seemingly generous offer from the same source, undermining the tactic's own future effectiveness once its pattern is known?"
status: active
