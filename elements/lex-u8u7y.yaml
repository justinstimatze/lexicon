id: lex-u8u7y
name: social-identity-as-self-concept-determinant
type-in: state
type-out: state
_tier: atomic
agent-instruction: "When analyzing someone's behavior or beliefs, identify the salient group memberships shaping their self-concept. The group's prototypical position predicts their behavior better than their stated preferences when the group identity is activated."
related: [lex-uz7g4, lex-tjwfn, lex-hbgcb, lex-vacbr, lex-2rsad, lex-8c35v, lex-mh7jf, lex-3hefg, lex-u68ue, lex-z9s5d, lex-etdx7, lex-n8smn, lex-5nk9h, lex-tt38w, lex-h2ehw, lex-uanys, lex-qdxa7, lex-exczm, lex-3qnq3, lex-3yvwm, lex-ymckb, lex-xehnw, lex-s27um, lex-wnmfk, lex-2sdqf, lex-tqd9x]
evokes: [tajfel-turner-sit, the-group-shapes-the-self, in-group-out-group-categorization, minimal-group-paradigm, social-categorization-as-cognitive-default]
lineage:
  - source: primary
    text: tajfel-turner-1979-integrative-theory-of-intergroup-conflict
    citation: "Henri Tajfel & John Turner, An integrative theory of intergroup conflict, in W. Austin & S. Worchel (eds), The Social Psychology of Intergroup Relations (Brooks/Cole 1979), pp. 33-47 — the canonical statement of Social Identity Theory (SIT). Self-concept derives partly from membership in social groups; people seek positive distinctiveness for in-groups; intergroup behavior is shaped by social-categorization rather than just interpersonal preference. Foundational reference for all subsequent in-group/out-group cognition research. No verbatim quote has been pulled into this entry yet."
  - source: practitioner
    text: tajfel-1970-experiments-in-intergroup-discrimination
    citation: "Henri Tajfel, 'Experiments in intergroup discrimination,' Scientific American 223(5):96-103 (1970) — the empirical foundation: minimal-group paradigm. Subjects randomly assigned to arbitrary groups (Klee-vs-Kandinsky preference based on a coin-flip) showed systematic in-group favoritism in subsequent allocation tasks. The mere act of categorization, with no shared interest or history, produced in-group bias. Robust across many replications. Verbatim quotes below from p.96 (article subtitle) and p.102 (Tajfel's own summary of the minimal-group finding)"
    quote: "Apparently the mere fact of division into groups is enough to trigger discriminatory behavior. [Article subtitle, p.96.] It was enough for them to see themselves as clearly categorized into an ingroup and an outgroup, flimsy as the criteria for this division were — even though the boys knew one another well before the experiments, their own individual gains were not involved in their decisions and their actions could have been aimed to achieve the greatest common good. [p.102.]"
canonical-instances:
  - "Tajfel 1970 minimal-group paradigm: subjects told they preferred Klee or Kandinsky based on a brief test, then asked to allocate money between anonymous in-group and out-group members. Systematic in-group favoritism appeared even though groups were arbitrary, members anonymous, and no shared history existed. The categorization itself sufficed"
  - "sports-team identification: the same person experiences different self-states wearing team-X colors at home vs at the rival's stadium. The social context activates different identity-aspects; the activated identity shapes affective responses (joy at team-X scoring, shame at team-X losing)"
  - "national-identity activation in international travel: passports, customs, accents foreground national-identity in ways absent in domestic settings. The same person's behavior, language register, and self-presentation shift based on which identity is contextually salient"
  - "professional-identity in workplace: 'I'm a doctor' vs 'I'm an engineer' shapes which professional norms apply, which others count as in-group, which information is treated as expertise vs lay-opinion. Identity-activation determines which cognitive shortcuts deploy"
  - "religious-identity in conflict zones: in mixed regions (Northern Ireland, Lebanon, Bosnia), the same person experiences identity-salience activation differently in different neighborhoods. Even where personal preferences would be peaceful, identity-activation produces categorical responses to ambiguous situations"
  - "operationally distinct from lex-uz7g4 archetype-as-projective-shorthand: archetype is a CONTENT projection (the audience projects a recognized figure); social-identity is a STRUCTURAL category (which group I belong to). Both shape perception but archetype is image-based and social-identity is membership-based"
  - "operationally adjacent to lex-tjwfn recursive-mind-simulation-shapes-self: recursive-mind-simulation is the cognitive mechanism that shapes self-via-imagined-audience; social-identity supplies WHICH audience the simulation is calibrated to. The two compose: SIT supplies the audience-set; recursive-mind-simulation operates within it"
  - "operationally adjacent to lex-hbgcb social-proof-as-action-signal: social-proof asks 'what are others doing?'; social-identity determines WHICH others count as social-proof signal-source. The Asch effect is amplified when confederates are in-group; out-group conformity is much weaker. SIT is upstream of social-proof's audience-selection"
  - "operationally distinct from lex-vacbr identity-protective-cognition: SIT is the structural fact that identity is partly group-derived; identity-protective-cognition is the cognitive defense-mechanism that protects identity-derived beliefs. SIT supplies WHICH beliefs are identity-defining; identity-protective-cognition supplies the DEFENSE pattern"
critical-questions:
  - "the salience test: which identity is salient RIGHT NOW? Identity is multi-dimensional (national, professional, religious, familial, generational, etc.); only one is highly active at any moment. Identity-salience is context-dependent and partly manipulable. Salience-shifting is a real intervention lever (de-emphasize political identity by emphasizing shared parental identity). Practitioner-discipline: when diagnosing identity-driven behavior, ask what activated this identity over others"
  - "the genuine-vs-constructed in-group: is the in-group genuinely shared or constructed-in-the-moment? Minimal-group experiments show that even arbitrary categorizations produce in-group bias. But the bias-strength scales with identity-investment (history, stakes, cost). Manufactured in-groups (corporate team-building, military unit cohesion) work but with different dynamics than organic ones. Practitioner-question: how durable is this in-group; what would dissolve it?"
  - "the multi-identity-tension question: when does an actor's multiple identities CONFLICT in the situation, and which identity wins? The same person is American + Republican + parent + employee + neighbor; situations that activate competing identities produce different behavior than single-identity-salient situations. Practitioner-discipline: in conflict-of-identity moments, the actor's choice is itself diagnostic of identity-hierarchy"
  - "the salience-shift intervention check: can a stakeholder change behavior by shifting which identity is salient (not changing the identity-set, but shifting which is foregrounded)? This is a real intervention lever — public-health campaigns that activate parent-identity for vaccine messaging outperform those activating party-identity. Practitioner-question: what is the lowest-cost salience-shift that would route around the active identity-protective pattern?"
status: active
