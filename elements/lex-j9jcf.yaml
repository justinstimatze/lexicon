lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'Self-Reference and Meaning in Ordinary Language' (first published in Mind, N.S. 63, 1954), Ch. 14 of Conjectures and Refutations (Routledge Classics, 2002), p.412."
    quote: "'Th. But it cannot solve the paradox if you admit that indirect self-reference is admissible. For, as Russell and Jourdain and Langford have shown (and Buridan before them), the Liar or the Epimenides can be formulated by using indirect self-reference instead of direct self-reference. S. Please give me this formulation at once. Th. The next assertion I am going to make is a true one. S. Don't you always speak the truth? Th. The last assertion I made was untrue. S. So you wish to withdraw it? All right, you may begin again. Th. You don't seem to realize what my two assertions taken together amounted to. S. Oh, now I see the implications of what you were saying. You are quite right. It is old Epimenides all over again. Th. I have used indirect self-reference instead of direct self-reference; that is the only difference. And this example establishes, I believe, that such paradoxes as the Epimenides cannot be solved by dwelling on the impossibility of self-referring assertions.'"
canonical-instances:
  - "A moderation team, blamed for allowing coordinated harassment pile-ons, bans any post that @-mentions a target more than a set number of times per hour, reasoning that this blocks the direct pile-on behavior. Coordinated harassers route around the rule by mentioning the target's earlier post instead of the target's handle, achieving the identical pile-on with no single post crossing the mention threshold -- the rule targeted the visible feature, and the actual mechanism (coordinated volume aimed at one person) reconstructs itself underneath it."
  - "A finance team bans any single order that buys and sells the same asset on the same day, believing this eliminates a specific wash-trading pattern. Splitting the pair across two accounts that deal with each other reconstructs the identical round-trip, and no order placed under either account ever matches the banned description."
critical-questions:
  - "Doesn't this prove nothing should ever be banned, since some workaround is always conceivable? No -- it's a test to run before trusting a fix, not a case against banning anything. An allergen ban that removes the allergen itself, not some named delivery method, works because the target really is the operative cause. The diagnostic applies specifically where the problem comes back easily once the ban is lifted, which is what exposes the banned thing as cosmetic rather than causal in the first place."
  - "Isn't this just saying that people will find loopholes? The reconstruction in the dialogue doesn't require anyone to be looking for a loophole -- Theaetetus builds the Liar back using two perfectly ordinary sentences, with no adversarial intent at all. A ban that fails this kind of straightforward reconstruction attempt was mis-targeted at the design stage, independent of whether anyone later tries to exploit it."
