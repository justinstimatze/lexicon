  - "operationally distinct from lex-v7ceq akrasia-knowing-the-good-yet-doing-otherwise (Aristotle): akrasia treats the failure as a knowledge-action gap in a unified deliberator; bad faith is the structural self-evasion of the burden of being a chooser. They compose: an akratic action can be performed in bad faith (`I had no choice, I was overcome` — facticity-flight) but bad faith is the structural posture, akrasia the specific failure."
