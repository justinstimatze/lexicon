evokes: [imagining-the-failure-has-already-happened, depersonalizing-dissent-by-reifying-failure, the-pre-mortem-vs-post-mortem-inversion, damn-the-torpedoes-cure, valuing-named-weaknesses, the-thirty-percent-uplift]
lineage:
  - source: practitioner
    text: klein-2007-performing-a-project-premortem
    citation: "Gary Klein, 'Performing a Project Premortem,' Harvard Business Review September 2007, p.18-19 (reprint F0709A) — the canonical short-form introduction of the pre-mortem technique. Klein's substrate-move: temporal-frame inversion makes failure-mode elicitation more accurate (citing Mitchell-Russo-Pennington 1989's 30% uplift) AND depersonalizes dissent (the failure has already happened, so naming its causes is no longer critiquing the plan-in-progress). The protocol: team is briefed on the plan; leader announces the project has 'failed spectacularly'; each member independently writes plausible failure reasons; reasons read aloud round-robin; aggregated list used to strengthen plan."
    quote: "[Klein 2007 HBR Sept p.18-19:] 'Projects fail at a spectacular rate. One reason is that too many people are reluctant to speak up about their reservations during the all-important planning phase.' [p.18 — the elicitation problem; social-cost-of-dissent suppresses voiced concern.] 'prospective hindsight – imagining that an event has already occurred – increases the ability to correctly identify reasons for future outcomes by 30%' [p.18 — citing Mitchell-Russo-Pennington 1989; the 30% accuracy uplift is the underlying empirical anchor.] 'A premortem is the hypothetical opposite of a postmortem' [p.18 — the inversion-as-naming move; temporal frame flipped.] 'the premortem operates on the assumption that the patient has died, and so asks what did go wrong' [p.18 — the operational instruction; the patient-has-died framing is the cardinal cognitive prop.] 'team members feel valued for their intelligence and experience, and others learn from them' [p.19 — the psychological-safety mechanism: dissent reframed as expertise-contribution rather than disloyalty.] 'It also reduces the kind of damn-the-torpedoes attitude often assumed by people who are overinvested in a project' [p.19 — the over-commitment cure.] 'the premortem may be the best way to circumvent any need for a painful postmortem' [p.19 — closing claim; the technique substitutes prospective imagination for retrospective post-mortem learning at a fraction of the cost.]"
  - source: primary
    text: mitchell-russo-pennington-1989-back-to-the-future
    citation: "Deborah J. Mitchell, J. Edward Russo, Nancy Pennington (1989), 'Back to the Future: Temporal Perspective in the Explanation of Events,' Journal of Behavioral Decision Making 2(1):25-38. The empirical primary cited downstream by Klein 2007 for the 30% uplift claim. Two experiments with University-of-Chicago MBA subjects; 2 (past/future) × 2 (certain/uncertain) × 2 (positive/negative outcome) mixed-model ANOVAs on number, type, and tense of generated causal reasons. Headline finding (Exhibit 1): pure temporal-perspective effect was NOT reliable (F(1,108)=1.49), but the certainty effect WAS strong (F(1,108)=19.79, p<.001); subjects generated ~36% more reasons (4.50 vs 3.30, Exp.1) for sure outcomes than uncertain ones. The cleaner reading of MRP1989 — vital for the atom — is that prospective hindsight's leverage comes from treating the outcome AS IF IT IS ALREADY SETTLED (the certainty manipulation), not from past-vs-future framing per se. Klein 2007's 'imagine the project has already failed' protocol thus operationalises the certainty side of the MRP finding, not the temporal side."
    quote: "[MRP 1989 abstract p.25:] 'Prospective hindsight involves generating an explanation for a future event as if it had already happened; i.e., one goes forward in time, and then looks back.' [p.25 abstract — operational definition of the technique.] [p.25 abstract on the actual finding:] 'In the first experiment, temporal perspective showed little influence while outcome uncertainty strongly affected the nature of explanations for events. Explanations for sure events tended to be longer, to contain a higher proportion of episodic reasons, and to be expressed in past tense.' [p.25 abstract — the corrective: it is CERTAINTY of outcome, not temporal direction, that drives the effect Klein later operationalises.] [p.26 on Weick/Hogarth genealogy:] 'Weick (1979), Hogarth (1983) and others have suggested that traveling forward in time to look backward on a future event might improve decision making, by helping people see more of these necessary ingredients.' [p.26 — locates prospective hindsight as decision-aid candidate prior to its empirical test.] [p.29 Results, Number of reasons:] 'There was no reliable difference in the number of reasons generated for future and past events, F(1,108) = 1.49; but subjects did generate more reasons for sure outcomes than for uncertain ones, F(1,108) = 19.79, p < .001.' [p.29 — the central F-statistic. Exhibit 1 means: Past Certain 4.43, Past Uncertain 3.72, Future Certain 4.57, Future Uncertain 2.94; 4.50 vs 3.30 combined = ~36% more reasons for sure than uncertain outcomes, matching Klein's '30% uplift' reportage.] [p.30 Type of reasons:] 'More episodic reasons were generated for sure outcomes (.50) than for uncertain outcomes (.27), F(1,108) = 21.41, p < .001.' [p.30 — sure outcomes also produce a different KIND of explanation (concrete, action-based) not just more of them, consistent with subjects mentally walking through a scenario that already happened.]"
  - source: primary
    text: kahneman-2011-thinking-fast-and-slow-ch24
    citation: "Daniel Kahneman, *Thinking, Fast and Slow* (Farrar Straus & Giroux 2011), Ch.24 'The Engine of Capitalism' (closing pages) — popularises Klein's pre-mortem as the operational antidote to optimism-bias + planning-fallacy, framed via Kahneman's 'adversarial collaboration' with Klein (Kahneman ↔ Klein's research-program tension was itself the long-running collaboration). The substrate-relevant move: pre-mortem is named as the BEST organisational intervention against optimistic-bias / WYSIATI Kahneman had encountered — a stronger endorsement than Klein himself offers in HBR. The mechanism Kahneman highlights is groupthink-suppression: a converging team treats public doubts as evidence of disloyalty, which suppresses dissent precisely when dissent would be most informative. Pre-mortem 'legitimises doubt,' inverting the social cost."
    quote: "[Kahneman 2011 Ch.24, closing pages:] 'Organizations may be better able to tame optimism and individuals than individuals are. The best idea for doing so was contributed by Gary Klein, my \"adversarial collaborator\" who generally defends intuitive decision making against claims of bias and is typically hostile to algorithms. He labels his proposal the premortem.' [Ch.24 — Kahneman crediting Klein, framing pre-mortem as the BEST organisational debiasing he knows of.] 'Gary Klein's idea of the premortem usually evokes immediate enthusiasm. After I described it casually at a session in Davos, someone behind me muttered, \"It was worth coming to Davos just for this!\" [...] The premortem has two main advantages: it overcomes the groupthink that affects many teams once a decision appears to have been made, and it unleashes the imagination of knowledgeable individuals in a much-needed direction.' [Ch.24 — the two-mechanism claim: groupthink-override + imagination-unleashing. Both bear on the substrate-claim of failure-mode elicitation as a directed-imagination prosthetic.] 'As a team converges on a decision—and especially when the leader tips her hand—public doubts about the wisdom of the planned move are gradually suppressed and eventually come to be treated as evidence of flawed loyalty to the team and its leaders. The suppression of doubt contributes to overconfidence in a group where only supporters of the decision have a voice. The main virtue of the premortem is that it legitimizes doubts.' [Ch.24 — names the social-cost-of-dissent mechanism Klein 2007 also gestures at; Kahneman's framing is sharper: dissent is suppressed because it reads as disloyalty, and pre-mortem flips that read by reifying the failure as already past.] 'The premortem is not a panacea and does not provide complete protection against nasty surprises, but it goes some way toward reducing the damage of plans that are subject to the biases of WYSIATI and uncritical optimism.' [Ch.24 — Kahneman's calibrated endorsement; ties pre-mortem to WYSIATI (what-you-see-is-all-there-is) as the underlying System-1 failure it counteracts.] [Conclusions, summary of organisational debiasing:] 'Organizations are better than individuals when it comes to avoiding errors, because they naturally think more slowly and have the power to impose orderly procedures. Organizations can institute and enforce the application of useful checklists, as well as more elaborate exercises, such as reference-class forecasting and the premortem.' [Conclusions — pre-mortem listed alongside reference-class forecasting (lex-7tvr6) as one of two named organisational debiasing exercises Kahneman recommends, reinforcing the operational-level pairing.]"
  - source: practitioner
    text: activity-menu-pattern-canon
    citation: "curious-kleicha-94b886.netlify.app Activity Menu V4 / Kirby's pattern-curation 2025 — Pre-Mortem listed as one of the activities. Independent practitioner attestation of pre-mortem's substrate-leverage outside HBR/academic frames. Activity-Menu lens-diff (2026-05-26) identified pre-mortem as a substrate-novel lens, distinct from the procedure-layer of pattern facilitation. The pattern crosses from decision-science (Klein/Kahneman) into instructional-design / facilitation-practitioner canon — wider cross-domain reach than a single discipline"
canonical-instances:
  - "Klein 2007 Fortune-50 environmental-sustainability project case: in the pre-mortem an executive named CEO-retirement-causing-interest-waning as a failure mode — a politically-charged risk that no-one had voiced in forward-direction planning. Once reified as a hypothetical post-failure cause, the social cost of naming it dropped, and the project added retirement-resilience to its plan"
  - "Klein 2007 military-air-campaign-planner case: a previously-silent team member named that the algorithm 'wouldn't easily fit on certain laptop computers being used in the field' — a deployment-context constraint that the algorithm developers had already worked around with a shortcut, but had been reluctant to mention. The pre-mortem flushed both the constraint AND the existing workaround simultaneously"
  - "Klein 2007 research-project case: a senior executive named that the project 'failed' because there had been insufficient time to prepare a business case prior to an upcoming corporate review — a meta-process risk about the SCHEDULING of the project itself, distinct from any technical risk. The pre-mortem's prompt elicits process-risks that forward-direction risk-analysis tends to overlook by focusing on substantive technical risks"
  - "the 30% accuracy uplift (Mitchell-Russo-Pennington 1989 via Klein 2007 p.18): the underlying empirical mechanism. Subjects asked to explain a hypothetical future event AS IF it has already happened generate 30% more causal pathways than subjects asked to predict the same event forward. Klein operationalizes this finding as a team-facilitation protocol; the temporal-frame inversion does the cognitive work the protocol's social-engineering then preserves"
  - "operationally distinct from lex-ftke9 work-backwards-from-goal (Polya): Polya's work-backwards is GOAL-directed (assume the desired solution is found, reason backwards through causal chain to plan path). Pre-mortem is FAILURE-directed (assume failure has occurred, reason backwards through causes to surface unspoken risks). Both invert temporal direction; they invert it from different anchors and to different ends. Polya helps you SOLVE; pre-mortem helps you not lose by failing-to-anticipate"
  - "operationally distinct from lex-a5dmb simulation-as-diagnostic-probe (Hamlet's Mousetrap): the Mousetrap constructs a physical/behavioral probe to elicit a tell from a target. Pre-mortem constructs a verbal/imaginative probe to elicit suppressed knowledge from a team. Both are designed probes; the Mousetrap targets an external party's involuntary tell, pre-mortem targets the team's voluntary but socially-suppressed concerns"
  - "operationally distinct from lex-znaau premature-closure: premature-closure is the FAILURE MODE that pre-mortem is designed to counteract. Premature-closure is the case where seizing on a plan happened too early, before relevant evidence was incorporated. Pre-mortem reopens deliberation by introducing the imagined-failure as new evidence about the plan's vulnerabilities"
  - "operationally complementary to lex-quu4s need-for-closure: lex-quu4s's lowering-intervention CQ explicitly names pre-mortem as an antidote to need-for-closure. The mechanism: pre-mortem makes the cost-of-being-wrong salient by reifying the failure scenario; under Kruglanski-Webster's 'fear of invalidity' framing, salience of failure-cost lowers need-for-closure even when time-pressure is high. Pre-mortem is one operationalization of fear-of-invalidity"
  - "operationally adjacent to lex-t9fs7 confirmation-bias: pre-mortem counters confirmation-bias by ASKING for disconfirming evidence directly (failure-causes), inverting the default search-asymmetry. Note: it does not eliminate confirmation-bias — the team can still generate failure-modes selectively aligned with prior beliefs; the technique mitigates rather than removes the bias"
  - "Activity-Menu / facilitation-practitioner reach: pre-mortem appears in pattern-curation collections like Kirby's Activity Menu V4 (2025) alongside other dissent-elicitation techniques (devil's-advocate, red-teaming, structured-debate). Its inclusion in operational toolkits attests cross-domain practitioner-validity beyond HBR/academic-decision-science framings"
critical-questions:
  - "the imaginability-precondition: pre-mortem requires plausible-failure to be IMAGINABLE — when failure is Knightian-uncertain (black-swan, unknown-unknowns), the technique produces only failure-modes the team can already imagine, missing precisely the unknown failure-class that is most dangerous. Mitigation: combine pre-mortem with reference-class forecasting (Kahneman's outside-view) which appeals to base-rates that do not require imagining the specific mechanism"
  - "the optimism-cost vs pessimism-cost tradeoff: pre-mortem reduces optimism-bias but can over-correct into paralyzing pessimism if the team treats EVERY imagined failure as equally likely. Klein's protocol assumes the team's task is to STRENGTHEN the plan against the failures — not abandon it. Without that framing the technique can produce decision-freeze. Practitioner-discipline: budget the post-pre-mortem step explicitly for plan-strengthening, not for re-litigating the go/no-go decision"
  - "the depersonalization mechanism is fragile: pre-mortem's social-cost-reduction depends on the team accepting the hypothetical-failure framing. If the team leader frames it as 'tell me what is wrong with my plan' (or is heard that way), the social cost of dissent returns and the technique reverts to ordinary critique. Klein's instruction is explicit — the project has ALREADY failed; team members are explaining the past, not critiquing the present. This frame-discipline is the critical move"
  - "differential from devil's-advocate: both elicit dissent. Pre-mortem reifies the failure as already-happened (frame-shift); devil's-advocate assigns a role to one team member (role-shift). Pre-mortem distributes the dissent across the team; devil's-advocate concentrates it in one person. Use pre-mortem when distributed knowledge is wide; use devil's-advocate when one person needs the social cover of an assigned role"
  - "scale-bounds: pre-mortem's effectiveness depends on the team being small enough that everyone reads their list (Klein's 90-min kickoff format). For 100+-person stakeholder groups, the technique requires adaptation — pre-mortem via async written submission then aggregation, or pre-mortem in working-group breakouts that then surface to plenary. The frame-discipline is retained; the format shifts"
status: active
