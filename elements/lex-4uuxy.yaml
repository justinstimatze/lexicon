id: lex-4uuxy
name: paid-labor-requires-unpriced-reproductive-substrate-shifted-onto-least-refusable-class
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When evaluating a paid-labor or wage-based system, ask what unpaid work is presupposed for the system to function and who is structurally allocated that work. Federici's essential argument in Caliban and the Witch (2004/2021): capitalism's wage relation is not just labor-for-money, it is labor-for-money on top of an extracted-but-unpriced substrate of reproductive labor — childbearing, child-rearing, household maintenance, care of the sick and elderly, emotional and bodily upkeep of the wage-earner — without which the wage-earner could not show up to be waged. The wage equation balances only because that substrate work is performed for free, and the system has a structural interest in keeping it socially invisible (it cannot be priced without collapsing the accounting). The substrate is allocated onto the class least able to refuse — historically women, with race-and-colony-mediated further allocations (slave women carrying both reproductive labor for the slaver class and bodily reproduction of slave labor, indigenous women's land-and-body enclosure, contemporary unpaid migrant care workers). The witch-hunt (1450-1700) is read as the violent enforcement mechanism that destroyed women's prior control over reproduction and consolidated the new sexual division of labor. Diagnostic question: who does the unpriced support work this paid system depends on, and what happens if they stop? If the answer reveals a captive class doing structurally invisible work, the system is in Federici's pattern. Operational consequence: visibility-attacks (counting, naming, valuing, surfacing-as-time-data) are themselves political; pricing-attacks (wages-for-housework, universal basic income, care infrastructure) realign the equation differently. Inverse: when reproductive labor is broadly distributed, refusable, and visible (some kibbutz models, public-care welfare states, distributed-care commons), the wage equation has to balance honestly."
