lineage:
  - source: primary
    text: eastman-runaways-cranes-reward-then-betray-the-grandmother
    citation: "Charles A. Eastman (Ohiyesa) and Elaine Goodale Eastman, Wigwam Evenings: Sioux Folk Tales Retold (Little, Brown, 1909), 'Twenty-Second Evening: The Runaways.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'I beg of you to stand on the opposite banks of this river and stretch your necks across, so that we may cross in safety! Only do this, and I will give to each of you a fine ornament for your breast...' ... 'I must ask of you one more favor! If an old woman should come down to the river and seek your help, place your heads together once more as if to allow her to cross, but when she is half way over you must draw back and let her fall in mid-stream.'"
canonical-instances:
  - "A startup facing an aggressive acquisition attempt by a larger rival secures a key logistics or platform partner early with generous, specific terms and genuine relationship investment, and when the rival later approaches that same partner seeking identical access to undercut the startup, the partner -- already rewarded and invested in the existing relationship -- quietly declines or stalls the rival instead of treating the request as neutral business as usual."
  - "A political candidate builds a strong, well-compensated relationship with a local community organization well before an election, and when a rival campaign later approaches the same organization for an endorsement or access to the same community, the organization -- having already been genuinely engaged and rewarded -- favors the candidate who invested first rather than treating both requests as equivalent."
critical-questions:
  - "does this tactic depend on the neutral party genuinely having no independent loyalty or stake beforehand, and what happens when the pursuer arrives with an even better offer or a prior relationship of their own -- does the 'reward them first' advantage always hold, or only when the pursuer is caught flat-footed?"
  - "how ethically different is arranging a neutral party's betrayal of a pursuer from simply bribing a judge or an official -- does the framing of 'escaping danger' change the moral status of purchasing someone's loyalty against a third party who hasn't done anything to the helper directly?"
  - "does the helper's willingness to betray whoever arrives second reveal something risky about relying on them at all -- if their loyalty is for sale to whoever pays and asks first, what happens the next time someone offers them more than the original arrangement was worth?"
