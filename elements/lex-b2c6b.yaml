  - source: primary
    text: polanyi-1966-the-tacit-dimension-chapter-1-tacit-knowing
    citation: "Michael Polanyi, *The Tacit Dimension* (Doubleday 1966, based on the 1962 Terry Lectures at Yale; reprinted Peter Smith 1983). Polanyi (1891-1976) was a Hungarian-British chemist and philosopher; the foundational figure for the concept of TACIT KNOWING. The Introduction frames the program as resolving the Meno paradox (how can we look for something if we do not already know it) by working out the structure of tacit knowing. Chapter 1 'Tacit Knowing' (pp.3-25) is the canonical exposition: the foundational claim 'we can know more than we can tell' is stated p.4 and developed via the face-recognition example (recognition without ability to articulate the basis), the police-Identi-Kit example (showing that the inarticulate knowledge can be partly externalized by appropriate technique but not exhausted), and the proximal/distal structural account — tacit knowing has a from-to structure where the knower attends FROM proximal particulars TO a distal focus. The transferable application to lex-b2c6b: the LIVE ADAPTIVE COUPLING that constitutes current expertise has an irreducibly tacit and indexical component that cannot be articulated and therefore cannot be transmitted via the standard transmission media (language, writing, codified procedure). What CAN transmit is the EXPLICIT SEDIMENT — the part that can be articulated, written, tested, named, codified. The mentorship-implication: the mentor cannot install their tacit coupling in the apprentice; the apprentice must build their own tacit coupling through their own practice. Polanyi's framework has been EXTENDED by Schön 1983 *The Reflective Practitioner*, Collins 2010 *Tacit and Explicit Knowledge*, and Dreyfus and Dreyfus 1986 *Mind Over Machine* — not retracted. The framework survives all major replications and critical examinations. Polanyi's earlier *Personal Knowledge* (1958) develops the same theme at greater length; this graduation is grounded on *The Tacit Dimension* 1966."
    quote: "[Polanyi 1966 *The Tacit Dimension* p.4, canonical statement:] 'I shall reconsider human knowledge by starting from the fact that we can know more than we can tell. This fact seems obvious enough; but it is not easy to say exactly what it means.' [The face-recognition example, p.4:] 'We know a person's face, and can recognize it among a thousand, indeed among a million. Yet we usually cannot tell how we recognize a face we know. So most of this knowledge cannot be put into words.' [On the Identi-Kit caveat — partial externalization does not exhaust tacit knowing, p.5:] 'But the application of the police method does not change the fact that previous to it we did know more than we could tell at the time. Moreover, we can use the police method only by knowing how to match the features we remember with those in the collection, and we cannot tell how we do this. This very act of communication displays a knowledge that we cannot tell.' [On the apprenticeship/teaching implication, p.5:] 'At the universities great efforts are spent in practical classes to teach students to identify cases of diseases and specimens of rocks, of plants and animals. All descriptive sciences study physiognomies that cannot be fully described in words, nor even by pictures.' [p.6, on Gestalt-perception as the substrate of tacit knowing:] 'I am looking at Gestalt, on the contrary, as the outcome of an active shaping of experience performed in the pursuit of knowledge. This shaping or integrating I hold to be the great and indispensable tacit power by which all knowledge is discovered and, once discovered, is held to be true.' [pp.9-10, the proximal-distal structural account — the two terms of tacit knowing:] 'Here we see the basic structure of tacit knowing. It always involves two things, or two kinds of things. We may call them the two terms of tacit knowing. ... we know the first term only by relying on our awareness of it for attending to the second. ... It is the proximal term, then, of which we have a knowledge that we may not be able to tell.'"
  - source: practitioner
    text: Sutton-Dohare-2024-LossOfPlasticityInContinualLearning
    citation: "Shibhansh Dohare, J Fernando Hernandez-Garcia, Qingfeng Lan, Parash Rahman, A Rupam Mahmood, Richard S Sutton, 'Loss of plasticity in deep continual learning,' *Nature* 632, 768-774 (2024). The paper demonstrates empirically that deep RL agents lose their CAPACITY TO ADAPT through continued training — plasticity is itself a transient resource that decays through exposure. The transferable application to lex-b2c6b: this complicates the naive 'just store the capacity to adapt' workaround for the untransmittability claim. Even within a single learning system, the plasticity needed to BUILD a new coupling is itself decaying — you cannot bank even the capacity to re-adapt without ongoing maintenance. The cross-mind application: an apprentice's ability to BUILD their own live coupling on the deposited substrate depends on their own plasticity, which is itself a transient resource. Mentorship-as-substrate-deposition has to account not just for what is deposited but for the recipient's current plasticity to build a coupling on it. Pre-mint debunking check: Sutton 2024 is recent (June 2024 Nature) but the empirical finding has held up to early scrutiny + the mechanisms described (dormant neurons, dead units, output explosion) are well-attested in adjacent ML literature; Sutton is a foundational RL researcher with no reputation concerns."
    quote: "[Dohare-Sutton et al. 2024 *Nature* 632:768:] empirically demonstrates that 'standard deep learning methods gradually lose plasticity in continual-learning settings, eventually learning no better than a shallow network.' The paper identifies the mechanism (dormant neurons, output explosion, ineffective gradient flow) and proposes 'continual backpropagation' as a remedy. [Transferable inference for lex-b2c6b: the empirical finding cross-attests the substrate-deposition framing — the recipient's plasticity-to-build-new-coupling is itself a transient resource that decays under sustained exposure to the same task. The substrate-deposition mentor must not only deposit good substrate but consider the recipient's plasticity context. The cross-domain attestation strengthens the lex-b2c6b claim that competence-and-displacement-and-receiver-plasticity are coupled phenomena.]"
  - source: discovery-loop
    text: -substrate-deposition-framing
    citation: "originated 2026-06-11, out of a broader working session on ALife and emergent complexity that surfaced 7 candidate framings; this is the one kept. The 'The job isn't to clone your frontier into someone younger — it's to leave them GOOD SUBSTRATE to grow their own frontier on.' Mentorship reframed as substrate-deposition not groove-cloning. The substrate-deposition is what crosses; the live coupling does not. Substrate audit: lex-6qevt lived-position-as-irreplaceable-epistemic-substrate (Cooper, Truth) is the INVERSE FACE — it names the irreplaceable part (the position has unique epistemic content). lex-b2c6b names the COMPLEMENTARY FACE — what crosses between minds is sediment (the part that can be deposited). lex-4mtpe stress-tested-through-use is adjacent — sediment that has been stress-tested IS what's most reliably transferable. lex-rgr3t habit-formation-frees-attention-for-higher-order-work covers cognitive automation freeing attention for new work; lex-b2c6b is about what can / cannot be transmitted across the cognitive-automation boundary. lex-da3g3 iteration covers temporal substrate; lex-b2c6b is about transmissibility across iterations of different practitioners. lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (Mendeleev) is the natural-science classification case; lex-b2c6b is the inter-mind transmission case. lex-gv3us (Drucker 1954 management primitive) is adjacent on the organizational-knowledge-management side. lex-njj99 emotional-labor + lex-z8hbu feeling-rules (just-minted Hochschild atoms) cover the affective extraction + cultural-script substrate; lex-b2c6b covers the cognitive-adaptive transmission substrate. All distinct, all compose at adjacent layers."
    quote: "[Working note, 2026-06-11:] 'The job isn't to clone your frontier into someone younger — it's to leave them GOOD SUBSTRATE to grow their own frontier on... the live adaptive coupling (the groove) is untransmittable/indexical; what actually crosses between minds is sediment — substrate the next person grows their own groove on top of. Mentorship/teaching reframed as substrate-deposition, not groove-cloning. The catalog is itself an instance of exactly this. A library of named pattern-atoms with verbatim lineage IS good substrate to grow your own frontier on — it doesn't hand you a coupling, it hands you rock. The open question at the time was whether the catalog already held an atom for the idea.' [The framing emerged from the earlier ALife/emergent-complexity conversation (2026-06-11) — the 'groove vs the rock' framing #2 in that earlier message: 'An adaptation is a dissipative structure — exists only in throughput of novelty (flame/Bénard cell). The live coupling is indexical to a now and is untransmittable. Only sediment crosses (language, canon, tools, tested invariants). \"You can't ship a now.\"'] [The transferable atom captures this: cross-mind transmission is fundamentally a substrate-deposition problem, not a coupling-cloning problem. The atom forces the diagnostic question: are you trying to ship a live coupling (which fails) or to deposit substrate (which works)? And the meta-corollary: lexicon-as-tool implements the substrate-deposition pattern at the level of named-pattern-atoms with verbatim lineage — it cannot give the reader the substrate-author's coupling, but it can deposit the named-pattern substrate on which the reader builds their own coupling. So the catalog now holds, on its own terms, the pattern it is an instance of.]"
canonical-instances:
  - "The Polanyi-master-apprentice canonical case (Polanyi 1958 *Personal Knowledge*): the master cannot articulate fully what they know how to do; the apprentice cannot fully acquire the master's tacit knowing through explicit instruction. The apprentice acquires it through their own sustained practice in proximity to the master + access to the master's deposited explicit substrate (rules, examples, named patterns, corrective feedback). The master's live coupling — their current sensitivities, their integration of subsidiary clues into focal awareness, their personal-knowledge gestalt — does NOT cross. The apprentice builds their own version, possibly with different emphasis + different blind spots + different strengths."
  - "The lexicon-as-instance canonical case (2026-06-10, this very atom): lexicon is a library of named pattern-atoms with verbatim lineage. It explicitly does NOT try to transmit the author's live coupling; it deposits substrate. Each atom is a piece of rock the reader can build their own coupling on. The substrate-author's specific now (their current open problems, working models, calibrations) is not transmitted by the substrate. The reader uses lexicon as substrate, develops their own coupling, makes their own judgments about which atoms fire when. The atom names what lexicon does as a methodological self-recognition — and reading this atom about substrate-deposition is itself an instance of being deposited substrate to build a coupling on."
  - "The succession-planning canonical case (organizational-knowledge-management literature; e.g. Davenport-Prusak 1998 *Working Knowledge*; Nonaka-Takeuchi 1995 *The Knowledge-Creating Company*): organizations attempting to transmit retiring expert's knowledge to successors consistently underperform when treating the problem as coupling-cloning (debrief the expert, capture their decision rules, train successor on the rules). Organizations consistently outperform when reframing as substrate-deposition (capture canonical decisions + tested heuristics + named-patterns + access to the expert during a structured apprenticeship; let the successor build their own coupling on the deposited substrate). The reframe is operational, not just aspirational."
  - "The Sutton-2024-loss-of-plasticity canonical case (deep RL continual-learning literature): even within a single neural network's lifetime, plasticity decays through exposure — the capacity to build a new coupling on substrate is itself transient. The cross-mind extension: the recipient of a substrate deposit must have current plasticity to build a coupling on it; substrate alone is insufficient. Effective mentorship attends to both substrate-quality AND recipient-plasticity-context."
  - "The expert-witness vs textbook canonical case (cross-domain attestation in legal + medical pedagogy): an expert witness's testimony in a trial carries information that their textbook does not; the textbook deposits substrate, the live testimony is partly indexical to the specific case + the witness's current calibrations. The transferable observation: the relationship between textbook and expert testimony is the same as the relationship between deposited substrate and live coupling. Neither can substitute for the other; both serve different cognitive-functional roles."
  - "The mass-poetry / cultural-canon canonical case (literary + cultural-transmission literature): poetry collections, religious canonical texts, philosophical traditions all function as substrate-deposition across generations + cultures. Each reader builds their own coupling on the deposited substrate; no two readers' couplings are identical. The substrate (the text) is invariant; the coupling (each reader's living relationship to the text) is indexical + irreducibly personal. The cultural transmission works precisely because the substrate is faithfully preserved AND each reader's coupling is freshly built."
  - "operationally adjacent to lex-6qevt lived-position-as-irreplaceable-epistemic-substrate (Cooper, Truth): lex-6qevt names the INVERSE FACE — the irreplaceable part of a structural position that does not transmit. lex-b2c6b names the COMPLEMENTARY FACE — what does cross between minds is sediment, not live coupling. They are sister atoms covering opposite sides of the cross-mind transmission problem. Together they answer: 'what crosses between minds, and what doesn't?' Position-specific irreplaceable content does not (lex-6qevt); deposited substrate-rock does (lex-b2c6b)."
  - "operationally distinct from lex-4mtpe stress-tested-through-use: lex-4mtpe is about how knowledge crystallizes through practice. lex-b2c6b is about what crosses between minds across that crystallization. They compose: substrate that has been stress-tested through use (lex-4mtpe) is the most reliable form of deposited substrate (lex-b2c6b) — tested invariants cross better than untested speculation."
  - "operationally distinct from lex-rgr3t habit-formation-frees-attention-for-higher-order-work: lex-rgr3t is about cognitive automation reducing attention-cost. lex-b2c6b is about transmission limits across that cognitive-automation boundary. They compose: the habits that free attention are themselves indexical adaptations that do not transmit directly; what transmits is the explicit substrate (procedure manuals, named patterns, canonical examples) that the next person uses to build their own habits."
  - "operationally distinct from lex-da3g3 iteration: lex-da3g3 is the temporal substrate (a thing happens repeatedly across periods). lex-b2c6b is about transmissibility across iterations of different practitioners. They compose at the cross-iteration + cross-practitioner layer."
  - "operationally distinct from lex-3d2he classification-gaps-generate-falsifiable-existence-predictions (Mendeleev): lex-3d2he is the natural-science classification-gaps-predict-entities case. lex-b2c6b is the inter-mind transmission case. They share the general substrate-mediates-knowledge pattern at different layers."
  - "operationally distinct from lex-njj99 / lex-z8hbu emotional-labor + feeling-rules (Hochschild, just-minted): lex-njj99/0553 cover the affective extraction + cultural-script substrate. lex-b2c6b covers the cognitive-adaptive transmission substrate. They are companion-mints from different theoretical traditions, both both transferable for substrate-relevant work."
critical-questions:
  - "are you trying to ship a coupling or deposit substrate? The atom's essential diagnostic. When mentorship / teaching / succession / cross-mind transmission feels stuck despite high effort, check whether you are trying to install the live coupling in the recipient (will fail) or to deposit substrate they can build their own coupling on (works). The reframe is often more difficult than it looks — many would-be mentors are emotionally invested in the coupling-cloning model + experience the substrate-deposition reframe as a loss of significance ('but my specific way of seeing this is what makes the work good!'). Practitioner-discipline: name what would constitute deposited substrate for this case; resist the urge to specify the coupling that the substrate is meant to build."
  - "what is the substrate you're depositing? The atom requires concrete naming. Substrate types: canonical texts + verbatim quotes, named-pattern repositories (e.g. lexicon, design-pattern languages, programming-pattern catalogs), tools + measurement-instruments, tested invariants + protocols, codified procedures + checklists, historical-case-library, debugging-trees, evaluation-criteria, taxonomies. Vague aspirational claims about 'sharing wisdom' or 'transmitting values' are not specific deposits; they may be coupling-cloning attempts in disguise."
  - "what's the recipient's plasticity context? Sutton 2024 demonstrates that the capacity to build a new coupling is transient + decays with exposure. The mentor must attend to recipient-plasticity-context as well as substrate-quality. A recipient who has had sustained exposure to a similar problem-space may have less plasticity for building a fresh coupling on new substrate; a recipient with high recent plasticity may build a coupling that doesn't match the mentor's expectations because they integrate the substrate differently. Practitioner-question: what is the recipient's current plasticity-context, and how does it shape what they will build on the deposited substrate?"
  - "is the competence-and-displacement coupling visible? The framing #4 (companion candidate, possibly future atom): the more specifically and competently you have adapted to a now, the more orphaned by its movement you will become. Competence and displacement are the same quantity seen at two times. The mentorship implication: the mentor whose live coupling is most strongly indexed to their current problem-space is precisely the mentor whose live coupling is most untransmittable. The mentor's competence and the mentor's transmission-difficulty are coupled — the mentor cannot wish themselves into more transmissibility without sacrificing the competence that made them worth learning from."
  - "is lexicon itself an example you can offer? The atom's meta-instance: lexicon is a substrate-deposition tool. Reading lexicon atoms does not give you the substrate-author's live coupling to the patterns; it gives you the named-pattern substrate on which to build your own coupling. The atom about substrate-deposition lives in a substrate-deposition tool. Practitioner-question: when teaching this atom, can you offer lexicon-as-instance to ground the meta-observation? Doing so makes the lesson recursive in a way that helps the recipient understand both the atom's claim AND the reading-of-lexicon practice that the atom names."
  - "the LLM/AI-design application: AI systems for tutoring / mentorship / knowledge-transfer / professional-development inherit the substrate-deposition-vs-coupling-cloning distinction. Default design tendencies often try to mimic coupling-cloning (the AI tries to be the expert) when the substrate-deposition role is structurally what AI can do well (deposit named-pattern substrate, surface canonical examples, organize tested-invariant catalogs). Practitioner-discipline: surface where the AI design is over-promising coupling-transmission and under-delivering substrate-deposition; redesign for the substrate-deposition role explicitly + leave the coupling-building work for the recipient. The AI-coding-assistant case is the obvious practical instance — assistants that try to be the coding-coupling produce worse outcomes than assistants that deposit-substrate + leave the coupling-construction to the developer."
