id: lex-9y6zv
name: sustained-hospitality-lets-a-guest-claim-they-always-owned-what-they-received
type-in: process
type-out: warning
_tier: atomic
agent-instruction: "When you extend ongoing generosity to someone who arrived with nothing, watch for the moment their story about the arrangement quietly changes -- a guest who has been fed daily for long enough can come to genuinely believe, or at least assert, that what was given to them was never a gift at all, but something they always possessed. In Zitkála-Šá's telling, a starving bear is welcomed into the badger family's home, fed 'all he could eat' day after day until his visits are so regular that mother badger sets aside a permanent rug for him, and he grows fat and glossy on their hospitality. Once established, he doesn't simply demand more -- he erases the history of the arrangement entirely: 'I have no dwelling. I have no bags of dried meat. I have no arrows. All these I have found here on this spot. I want them! See! I am strong!' The claim isn't 'you have been generous, now share more' -- it's a flat denial that any gift ever occurred, replaced by a story in which the resources were simply lying there for the taking, discovered rather than received, with strength as the only justification needed once the history has been rewritten. This works because prolonged, routine generosity can look, from the receiving end, indistinguishable from simply having access -- and once access feels default, the giver's original act of choice disappears from the story the receiver tells about how things are. Diagnostic move: when someone you've sustained for a long time begins speaking about your resources as though they'd always had access to them, independent of your choice to keep providing it, treat that shift in language as an early warning -- the erasure of the gift's history is usually the move that comes right before an attempt to seize the whole of what was only ever lent."
