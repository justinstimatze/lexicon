id: lex-egkjk
name: baseline-updates-to-current-state-hiding-cumulative-degradation
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Recognize this when an analysis of degradation (environmental, organizational, code, social-norm, health, UX, privacy) treats the absence of registered alarm as evidence of acceptable conditions. Diamond's transferable contribution (extending Pauly 1995 shifting-baseline-syndrome from fisheries to societal scale): slow cumulative change is CONCEALED FROM PERCEIVERS by the BASELINE-UPDATING mechanism — each year (or generation) of observation updates the perceiver's reference standard to the current state, so cumulative change that would be obvious if compared to a 50-year-prior baseline does not register through year-to-year comparison. Diamond names two related mechanisms: CREEPING NORMALCY (slow trends concealed within noisy fluctuations; each year slightly worse than last, baseline shifts gradually + imperceptibly) and LANDSCAPE AMNESIA (forgetting how the surroundings looked decades ago because intermediate change was gradual). Diamond's diagnostic: someone returning to a place after a long absence sees the cumulative change that continuous residents do not. The perceiver-internal mechanism: human comparison is local (year-to-year), not against a fixed external reference. Transferable applications: (a) environmental degradation (Diamond's original; also Pauly 1995 *Anecdotes and the shifting baseline syndrome of fisheries* — fisheries managers each set baseline at their career start, so the cumulative depletion across generations is hidden; Soga + Gaston 2018 extension to biodiversity); (b) climate change (the warming-frog mechanism — each year's anomaly compared to recent years, not pre-industrial baseline); (c) code-quality decay (each developer normalizes to the current legacy state; the cumulative tech-debt is invisible until a new hire arrives + says `wait, this is a mess`); (d) UX feature creep (users adapt year-by-year to interface complexity; the cumulative friction is invisible until they encounter a clean rewrite or a new product); (e) cultural + linguistic standards drift (each generation's reference grammar updates to the current vernacular; prescriptivists invoke this mechanism, sometimes overstating it); (f) social-norm erosion + Overton-window-shift (Lakoff 2004; what was outrage in 1990 is normal in 2025); (g) privacy erosion through cumulative ToS + UX changes (each individual change small; cumulative erosion massive but unregistered); (h) personal habits + health drift (gradual weight gain or fitness decline; the boiled-frog phenomenon); (i) relationship + workplace satisfaction drift (the slowly-degrading partnership or job; the perceiver's tolerance baseline shifts so the cumulative degradation does not trigger leaving); (j) wealth + housing affordability (each year's price increase small; cumulative shift from `most can afford` to `few can afford` invisible without longitudinal comparison). Distinct from lex-uqghr Tainter complexity-collapse (different mechanism — declining marginal returns on complexity; lex-egkjk is about PERCEPTION of cumulative change). Distinct from institutional sclerosis (not currently substrate-grounded; future Olson mint). Distinct from lex-mwgep path-dependence (commitment trap, not perceptual baseline drift). Distinct from lex-dqa9j Turchin elite-overproduction (different cycle). Distinct from lex-dqa9j + lex-gv3us in that lex-egkjk is the PERCEPTUAL mechanism that COMPOSES with structural-collapse atoms to explain why degradation does not trigger response in time. Use when (i) analysis treats absence-of-alarm as evidence of acceptable conditions, (ii) someone in a long-degrading situation reports they don't see what observers from outside see, (iii) you are designing for early-warning of slow degradation in any domain. Counter-move: introduce an external fixed reference (a decadal comparison; an outsider's eye; a deliberate longitudinal benchmark); name the perceptual mechanism explicitly; design for periodic forced-comparison-with-baseline."
