id: lex-w2nkq
name: sometimes-strengthening-your-rival-serves-your-own-interest
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When your default assumption is that weakening a rival always serves your interests and strengthening them always serves theirs, check whether one of a specific set of conditions applies in which HELPING a rival grow more powerful actually serves you better — because power, in Kautilya's analysis, is not uniformly dangerous to concede; its danger depends on what the rival will predictably do with it and on what else is happening in the wider field of actors. He names five such conditions directly. Three concern the rival's own predictable self-destruction once strengthened: 'A powerful enemy may so ill-treat his subjects that he becomes easy to conquer' (strength invites the overreach that produces internal revolt); 'the enemy, having consolidated his power, may so weaken himself with uncontrolled enjoyment and dissipation as to be easily overpowered' (strength removes the pressure that had been enforcing discipline); or he may grow careless enough to be 'found with all his troops in one place other than his fort,' isolated and unprotected. The other two concern the position of a THIRD, more dangerous power: 'If a powerful third king plans on subduing the enemy first and then attacking the conqueror, the enemy may be prepared to come to the help of the conqueror even when the latter is unprepared' — a strengthened enemy becomes a more effective buffer or even an ally of convenience against a bigger shared threat; alternatively, 'the conqueror may be [able to play the role of] the Middle king between the other two' — deliberately allowing two other powers, including a former rival, to grow strong enough to need a third party's mediation gives the conqueror a valuable new role he could not occupy from a position of unchallenged dominance. In every case, the reasoning is not sentimental or accidental generosity — it is a calculated bet that the SPECIFIC WAY this particular rival will use additional power (self-indulgent complacency, reckless overextension, or usefulness as a shield) makes conceding it a net gain, not a uniform policy of appeasement. Diagnostic move: before assuming that weakening a rival is always the correct move, ask specifically what this rival is likely to do with additional strength — will it predictably invite their own overreach or complacency, and is there a third, more dangerous actor in the field relative to whom a strengthened rival becomes a useful buffer or a route to a mediating role for you — because if either condition holds, deliberately permitting or even assisting the rival's growth may serve your position better than contesting it."
related: [lex-5ykp2, lex-fpg4x, lex-m8qhb]
scaffolds-from: [lex-fpg4x]
evokes: [wishing-power-to-the-enemy, strength-invites-overreach, middle-king-role, powerful-third-king-triangulation, five-conditions-for-conceding-power]
lineage:
  - source: primary
    text: kautilya-arthashastra-wishing-power-to-the-enemy
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Definitions, Principles and Methods,' 'Power and Its Objectives,' {6.2.38}."
    quote: "'If the conqueror perceives [that it will be of advantage to him] he may [in the following situations] wish power and happiness even to his enemy. If a powerful enemy is likely to antagonise his subjects by harming them verbally or physically or destroying their property or if an enemy enjoying his success is to become negligent or weak due to [excessive] indulgence in hunting, gambling, women or drink, it will be easy to overpower him. If an enemy, when attacked, is likely to be found with all his troops in one place other than his fort, he will be easily overpowered, being friendless and unprotected by his fort. If a powerful third king plans on subduing the enemy first and then attacking the conqueror, the enemy may be prepared to come to the help of the conqueror even when the latter is unprepared [to launch his own attack]; or, the conqueror may be [able to play the role of] the Middle king between the other two.'"
canonical-instances:
  - "A mid-sized tech company quietly helps a smaller, disorganized competitor survive and grow rather than crushing it while it's weak, specifically because a much larger dominant platform is the real threat to both, and a somewhat-stronger second-tier competitor makes a more useful ally or acquisition target against the dominant player than an eliminated one would have been."
  - "A regional power declines to press its advantage against a weakened neighboring rival, calculating that the neighbor's continued (if diminished) existence as a buffer state is more valuable than the neighbor's elimination would be, given a much larger and more aggressive power looming beyond both of their borders."
  - "operationally distinct from lex-fpg4x measure-strategic-position-by-relative-rate-not-absolute-level: that atom is about how to MEASURE whether you are winning or losing relative to a rival; this atom is about a specific, counterintuitive CHOICE — deliberately permitting or assisting a rival's growth — that can be correct precisely because it improves your relative position despite appearing to help the rival in absolute terms."
critical-questions:
  - "how confidently can a decision-maker actually predict which of these outcomes (self-destructive overreach, useful buffer, mediating role) a strengthened rival will produce, given that all five scenarios require correctly forecasting another actor's future behavior — and what happens to this strategy when that forecast is wrong and the strengthened rival simply becomes stronger with none of the predicted self-limiting effects materializing?"
  - "does deliberately strengthening a rival as a buffer against a third power risk creating a rival strong enough to no longer need you, or to turn on you once the third-power threat has passed — does the framework address the risk that a buffer state, once useful, becomes a new independent threat in its own right?"
  - "is 'strength invites overreach and complacency' a reliable enough pattern to bet a strategic decision on, or is it more often true in hindsight of a specific defeated rival (the losers' overreach gets remembered, retrospectively, as inevitable) than it is predictive in advance of rivals who successfully manage their own growing power without self-destructing?"
status: active
