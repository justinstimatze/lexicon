canonical-instances:
  - "A hiring-oversight team wants to check whether an interviewer discriminates by candidate background. Rather than asking which candidate type the interviewer prefers, they build ten independent forced-choice vignettes varying one attribute at a time and count across how many vignettes the interviewer states a preference at all — a low count indicates one standard is applied regardless of the varied attribute, a high count indicates a real sorting tendency."
  - "A sentencing-review body measures whether a judge's rulings are influenced by irrelevant defendant characteristics by presenting matched case pairs varying one irrelevant trait at a time, then counting across how many pairs the judge's stated sentence differs at all — rather than checking whether the judge treats any single group more harshly, which invites a defensible-cause counter-argument for that one item alone."
critical-questions:
  - "A low preference-count is consistent with two very different underlying states — genuine, effortful impartiality despite noticing real differences, and simple failure to notice that the alternatives differ in any relevant way (see lex-ru3ue). The count alone cannot distinguish achieved neutrality from mere non-perception; Martin resolves this only by restricting the sample to fourth-year students with substantial clinical experience, which sidesteps rather than directly measures the ambiguity."
  - "Does the breadth-count assume the items are truly independent draws on one underlying disposition, or could a respondent who happens to have unusually vivid experience with just ONE item score as 'high preference' due to a single salient episode rather than a general discriminating disposition — inflating the count without reflecting a broader failure to internalize the norm?"
