lineage:
  - source: primary
    text: popper-1963-conjectures-and-refutations
    citation: "Karl Popper, 'The History of Our Time: An Optimist's View' (the Sixth Eleanor Rathbone Memorial Lecture, delivered at the University of Bristol, October 12, 1956), Ch. 19 of Conjectures and Refutations (Routledge Classics, 2002), p.504."
    quote: "'I may confess that in the issue between faith in man and distrust of man, my feelings are all on the side of the naive liberal optimists, even though my reason tells me that their epistemology was all wrong, and that truth is in fact hard to come by. I am repelled by the idea of keeping men under tutelage and authority. But I must admit, on the other hand, that the pessimists who feared the decline of authority and tradition were wise men. The terrible experience of the great religious wars, and of the French and Russian revolutions, prove their wisdom and foresight. But although these wars and revolutions prove that the cautious pessimists were wise, they do not prove that they were right. On the contrary, the verdict of history--I mean, of course, the history of our time--seems, by and large, to favour those who had faith in man and in human reason.'"
canonical-instances:
  - "A company's compliance team warned for years that a rushed product launch would trigger a specific class of safety incident, and it does, in exactly the way they predicted. The incident vindicates the warning. It doesn't automatically vindicate the team's broader recommendation to have delayed the launch by a year, since the actual costs of that delay (competitors capturing the market, the company's survival) are a separate question the correct prediction doesn't settle by itself."
  - "An economist who opposed a central bank's rate cut correctly predicted the resulting inflation spike. Years later, employment and growth data show the cut still left the economy better off than the alternative the economist favored. The economist was right about the specific mechanism they warned about and wrong about which overall policy was better -- both verdicts can be true about the same person's same argument."
critical-questions:
  - "Doesn't separating wisdom from rightness let anyone dodge accountability for a bad call by claiming they were 'wise about the risks' even after being wrong overall? The separation cuts both ways and settles nothing on its own -- it just names two different questions that need two different pieces of evidence. Whether someone was wise about a risk turns on whether the specific predicted harm occurred. Whether they were right about the choice turns on a full comparison of the actual outcome against the actual alternative, a comparison a correctly predicted harm doesn't by itself supply."
  - "If the pessimists were wise and correctly foresaw the wars, why does Popper still side with the optimists -- isn't that just picking your preferred outcome and calling it the verdict of history? Popper gives an explicit standard, not just a preference: he compares what the alternative (an authoritarian, tutelage-based society) would itself have cost against what liberal societies actually paid for their freedom, and judges the liberal path's total balance better despite its real, conceded costs. The comparison is falsifiable in principle -- someone could argue the authoritarian alternative's costs were being undercounted -- it just isn't settled by the pessimists' prediction having come true."
