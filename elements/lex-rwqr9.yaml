lineage:
  - source: primary
    text: hyde-susa-no-os-desecration-of-amaterasus-purity-produces-renewal-and-seeds
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' on the Shinto myth of Susa-nö-o and Amaterasu. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "One of the best versions of this motif of revivification through dirt comes from ancient Japan. ... This sudden intrusion so terrifies his sister the Sun Goddess that she falls against her loom, the shuttle piercing her vagina and wounding her or, in some versions, killing her. ... In versions in which Amaterasu does not actually die as a result of Susa-nö-o’s actions, what happens next is almost as bad: she hides herself in a cave, the heavens and earth go dark, and “all manner of calamities” occur."
canonical-instances:
  - "An orchestra with decades of technically flawless, note-perfect performances finds its audiences and its own musicians drifting toward indifference, and it's not a stricter adherence to the score but a season of deliberately irreverent, boundary-breaking guest conductors that brings both critical attention and the musicians' own engagement back."
  - "A long-running academic field that has refined its methodology to a high, uncontested standard finds its best young researchers leaving for messier, less rigorous adjacent fields, and it's the eventual, disruptive intrusion of an outsider's crude but genuinely new framework, not a further tightening of methodological standards, that reopens real progress."
critical-questions:
  - "Is 'revivification through dirt' actually a reliable causal mechanism, or is this a compelling narrative pattern read back onto myths that were composed to explain the sun's real astronomical cycle, in which case the 'desecration causes renewal' claim may be a poetic gloss rather than a genuine structural insight?"
  - "Does this pattern risk romanticizing genuinely destructive intrusions as necessary and generative after the fact, when many violations of a system's order simply damage it without producing any compensating renewal at all -- how would one distinguish, in advance, a desecration that will renew from one that will merely destroy?"
  - "Is there a meaningful difference between desecration a system eventually metabolizes into renewal (as the myth describes) and desecration that a system never recovers from, and if so, what determines which outcome occurs, since the myth only shows us the survivor's-story version?"
status: active
