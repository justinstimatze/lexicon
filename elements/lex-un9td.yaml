id: lex-un9td
name: demonstration-must-bottom-out-in-indemonstrable-first-principles
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When someone offers a chain of justification for a claim — 'X is true because Y, and Y because Z' — and you are asked whether that chain itself constitutes real knowledge or proof, apply Aristotle's three-way exhaustive diagnostic (Posterior Analytics I.3) to whatever is offered as the chain's foundation. Any attempt to ground a proposition through a chain of prior propositions must do exactly one of three things: (1) regress infinitely, appealing to a prior premise for every premise offered, forever; (2) close in a circle, where some later member of the chain is used (directly or through intermediate steps) to justify an earlier member that was itself used to justify it; or (3) terminate in premises that are NOT further demonstrated — accepted as immediate and first, known directly rather than by proof. Aristotle's argument for why only the third option can produce actual knowledge: 'those who suppose that knowledge does not subsist at all, these think that we are to proceed to infinity, as if we may not know things subsequent by things prior, of which there are no first... And if we are to stop, and there are principles, these are unknown, since there is no demonstration of them.' Against the first horn: an infinite regress cannot be traversed, so nothing at the far end (which is everything, since there is no end) is ever actually known — 'it is impossible to penetrate infinites.' Against the second horn, Aristotle gives the sharper and more surprising argument: circular demonstration is not merely question-begging in some vague sense, it is EXACTLY VACUOUS, collapsible to a tautology. Reduce any circular chain to its minimal case of three terms A, B, C, where A is proved from B and B is proved from C, but C is (via some path) proved from A: 'when A existing, B necessarily is, and from this last C, if A exists C will exist, if then, when A is, it is necessary that B should be, but this existing, A exists... To say therefore that because B is A is, is equivalent to saying that C is, and this is to say that A existing C is, but C is the same as A, so that it happens that they who assert there is demonstration in a circle, say nothing else than that A is because A is, and thus we may easily demonstrate all things.' The chain, however long and however many intermediate terms it passes through, is doing no logical work at all once it closes on itself — it has the exact same content as the empty claim 'A is because A is,' which 'proves' anything you like with equal (zero) force. This is Aristotle's decisive reason for ruling out circularity as a route to knowledge, not merely an aesthetic preference for non-circular arguments. Having eliminated both other horns, Aristotle concludes the third is forced: 'neither is all science demonstrative, but the science of things immediate is indemonstrable. And this is evidently necessary, for if it is requisite to know things prior, and from which demonstration subsists, but some time or other there is a stand made at things immediate, these must of necessity be indemonstrable.' The generalized diagnostic, portable far outside formal logic: whenever a chain of justification, causation, authority, or legitimacy is offered as grounding some claim, ask where it terminates. If it doesn't terminate (regress), the grounding is illusory — infinite deferral is not stronger than no grounding, it is unfalsifiable in the same way. If it terminates by looping back to something already used earlier in the chain (circularity), collapse the loop to its minimal form and check whether it reduces to 'X because X' — a chain can be arbitrarily long and still be exactly this vacuous once traced. If it terminates in something accepted without further proof (a foundational premise, an axiom, a brute empirical observation, a stipulated authority), that termination point is where the REAL epistemic work is being done or NOT done — scrutinize it directly rather than the elaborate machinery built on top of it, since the machinery's validity is entirely parasitic on that foundation."
