id: lex-y2tbg
name: essence-as-effect-of-ritualized-repetition-not-its-cause
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When a category appears to have an inner essence that the outer acts merely express (gender, race, professional identity, institutional identity, nationhood), check whether the apparent essence is actually being *retroactively constituted* by anticipated ritualized repetition of stylized acts. The metalepsis to surface: the effect (essence) presents itself as the cause (substance prior to acts). The acts produce the essence they appear to express. This makes the essence contingent — not arbitrary, but historically produced and therefore alterable."
