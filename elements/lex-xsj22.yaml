id: lex-xsj22
name: when-a-classification-is-genuinely-ambiguous-default-toward-the-permitted-category
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a decision framework sorts actions into categories with different verdicts, and a real case falls ambiguously between two of them, don't treat the ambiguity as paralysis -- resolve it with a standing default rule rather than re-litigating the whole framework case by case. Kautilya builds an elaborate three-way classification for a conqueror's gains -- 'risky acquisition' (justified because failing to seize it lets someone else, usually the enemy, benefit instead), 'wrong acquisition' (an action that provokes fear or blowback from one's own people or from enemies), and 'doubt' (genuinely unclear which of the two an action is). He then gives four worked examples of doubtful cases -- 'is it a risky acquisition or not,' 'is it a wrong acquisition or not,' 'is it a risky acquisition or a wrong acquisition,' 'is it a wrong acquisition or a risky acquisition' -- covering every direction the ambiguity can run. For every one of them, the resolution is the same fixed rule, not a fresh case-by-case judgment: 'the conqueror shall choose that course of action which favours risky acquisition.' The categories aren't symmetric in the first place -- risky acquisition is already ranked ahead of wrong acquisition in the text's own priority ordering, since it is powered by legitimate necessity (someone else gets it if you don't) while wrong acquisition is powered by blowback you generate yourself. Given that asymmetry, resolving genuine ambiguity toward the already-preferred category isn't favoritism, it's just applying the existing ranking to the case where the classification itself can't be settled cleanly. Diagnostic move: when your own framework can't cleanly place a real case into one of two categories with different verdicts, don't stall on classifying it precisely -- check which of the two categories your framework already treats as more legitimate or lower-cost, and default ambiguous cases into that category as a standing rule, reserving detailed re-classification for cases where the stakes are high enough to justify the extra scrutiny."
