id: lex-3gr6f
name: a-contest-keeps-its-prestige-after-its-criterion-shifts-from-doing-to-getting
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A competitive contest can keep its full social intensity and prestige even after what it actually rewards quietly shifts from demonstrated capability to acquired possession -- from what a competitor can DO to what a competitor can GET, with no requirement that the getting trace back to any doing at all. Because the contest still looks and feels like the same high-stakes competition it always was, the shift in criterion goes unnoticed, and society keeps treating the winners as though they'd won on the original terms. Gilman draws the line precisely: 'there is a radical distinction between sex-competition and marriage by purchase. In the first the male succeeds by virtue of what he can do; in the second, by virtue of what he can get... mere possessions, with no question as to the method of their acquisition, are not necessarily of advantage to the individual.'"
