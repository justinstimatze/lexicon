id: lex-39e7a
name: one-contradiction-lets-any-conclusion-be-validly-derived
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a theory, policy, or belief system is found to contain a genuine internal contradiction, don't treat this as a survivable flaw to be noted and worked around -- a single contradiction, combined with nothing but ordinary valid inference, licenses deriving literally any statement at all, which means the system has stopped asserting anything in particular. Popper's worked proof, using only two uncontroversial rules of inference (from p, infer 'p or q'; from 'not-p' and 'p or q', infer q): take the contradictory premises (a) 'The sun is shining now' and (b) 'The sun is not shining now.' From (a), infer (c) 'The sun is shining now or Caesar was a traitor' -- valid, since asserting a disjunction from one true disjunct is always safe. Then from (b) and (c), infer (d) 'Caesar was a traitor' -- also valid, since (b) rules out the first disjunct of (c), forcing the second. 'It is clear that by the same method we might have inferred any other statement we wanted to infer... We see from this that if a theory contains a contradiction, then it entails everything, and therefore, indeed, nothing. A theory which adds to every information which it asserts also the negation of this information can give us no information at all. A theory which involves a contradiction is therefore entirely useless as a theory.' The mechanism generalizes past formal logic: any framework -- a legal code, a set of business rules, a contract, a specification -- that contains a genuine internal contradiction doesn't merely have one bad clause sitting next to otherwise-good ones. It has lost the ability to rule anything out, because the same permissive machinery that lets you derive 'Caesar was a traitor' from an unrelated contradiction lets you derive its opposite too, and everything else besides. Diagnostic move: when a contradiction in a rulebook, model, or theory is dismissed as a minor inconsistency to patch later, treat it instead as a total loss of the system's discriminating power until it's actually resolved -- not a partial defect scaled to how prominent the contradictory clauses happen to look."
