    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle and Its Cognates,' quoting the Blackfoot myth of Old Man and Old Woman (after C. Wissler and D. C. Duvall, Mythology of the Blackfoot Indians, Anthropological Papers of the American Museum of Natural History, Vol. II, 1909). Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Now, let us come to an agreement of some kind; let us decide how the people shall live.''Well,' said Old Man, 'I am to have the first say in everything,' To this Old Woman agreed, provided she had the second say. ... Then Old Man began, 'The women are to tan the hides. When they do this, they are to rub brains on them to make them soft; they are to scrape them well with scraping-tools, etc. But all this they are to do very quickly, for it will not be very hard work.''No, I will not agree to this,' said Old Woman. 'They must tan the hide in the way you say; but it must be made very hard work, and take a long time, so that the good workers may be found out.'"
canonical-instances:
  - "A co-founder insists on drafting the first version of every major company decision, and agrees when their partner asks only for the right to revise each draft before it's finalized, not realizing the revision right is where the actual decision-making power ends up sitting."
  - "A committee chair proposes the agenda for every meeting, having agreed to let the vice-chair amend it before it's circulated, and over time the vice-chair's amendments consistently determine what actually gets discussed."
critical-questions:
  - "Does Old Man ever refuse to accept Old Woman's amendment, or does the myth present his 'first say' as functionally meaningless from the start, and if so, why would he have negotiated for it at all?"
  - "Is there a point where a string of overridden proposals should lead the first-say holder to stop proposing altogether, and does the myth suggest Old Man ever recognizes the pattern within the exchange itself?"
  - "Would this dynamic hold if Old Man's proposals were substantively different from what Old Woman wanted, rather than -- as most of them are here -- proposals for something easier than what she settles on, suggesting his 'first say' might not even represent his genuine preference?"
