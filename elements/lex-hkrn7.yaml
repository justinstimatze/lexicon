lineage:
  - source: primary
    text: davis-1981-women-race-and-class
    citation: "Angela Y. Davis, *Women, Race and Class* (New York: Random House, 1981). Chapter 1 ('The Legacy of Slavery') establishes that under slavery women were valued as 'profitable labor-units' rather than as gendered subjects, making the emergent nineteenth-century 'ideology of femininity' structurally inapplicable to them. Chapter 8 ('Rape, Racism and the Myth of the Black Rapist') builds the connected argument that the myth of the Black rapist functions to protect continued economic exploitation of Black men and women, and that contemporary rape functions as an instrument of class and economic power more broadly, with incidence tracking the capitalist class's reassertion of authority rather than a constant background level of male pathology."
    quote: "[Ch.1, on slavery making the ideology of femininity inapplicable at its root:] 'The slave system defined Black people as chattel. Since women, no less than men, were viewed as profitable labor-units, they might as well have been genderless as far as the slaveholders were concerned... Judged by the evolving nineteenth-century ideology of femininity, which emphasized women's roles as nurturing mothers and gentle companions and housekeepers for their husbands, Black women were practically anomalies.' [Ch.1, the key passage: industrial capitalism manufactures a NEW ideology that cannot travel to the slave community:] 'When the tentative pre-Civil War forays into factory work gave way to an aggressive embrace of industrialization in the United States, it robbed many white women of the experience of performing productive labor. Their spinning wheels were rendered obsolete by the textile factories. Their candlemaking paraphernalia became museum pieces, like so many of the other tools which had previously assisted them to produce the articles required by their families for survival. As the ideology of femininity — a by-product of industrialization — was popularized and disseminated through the new ladies' magazines and romantic novels, white women came to be seen as inhabitants of a sphere totally severed from the realm of productive work. The cleavage between the home and the public economy, brought on by industrial capitalism, established female inferiority more firmly than ever before. 'Woman' became synonymous in the prevailing propaganda with 'mother' and 'housewife', and both 'mother' and 'housewife' bore the fatal mark of inferiority. But among Black female slaves, this vocabulary was nowhere to be found. The economic arrangements of slavery contradicted the hierarchical sexual roles incorporated in the new ideology. Male-female relations within the slave community could not, therefore, conform to the dominant ideological pattern.' [Ch.8, the myth of the black rapist as functional pretext, quoting Gerda Lerner approvingly:] 'The myth of the black rapist of white women is the twin of the myth of the bad black woman — both designed to apologize for and facilitate the continued exploitation of black men and women. Black women perceived this connection very clearly and were early in the forefront of the fight against lynching.' [Ch.8, of 455 men executed 1930-1967 on rape convictions, 405 were Black:] 'Thus, of the 455 men executed between 1930 and 1967 on the basis of rape convictions, 405 of them were Black.' [Ch.8, sexual access to enslaved women as a direct expression of economic property claims, not a separate appetite:] 'Sexual coercion was, rather, an essential dimension of the social relations between slavemaster and slave. In other words, the right claimed by slaveowners and their agents over the bodies of female slaves was a direct expression of their presumed property rights over Black people as a whole. The license to rape emanated from and facilitated the ruthless economic domination that was the gruesome hallmark of slavery.' [Ch.8, the class-differential in who can act on 'the invitation to rape' with impunity:] 'Although white men who are employers, executives, politicians, doctors, professors, etc., have been known to \"take advantage\" of women they consider their social inferiors, their sexual misdeeds seldom come to light in court... as the basis of the license to rape Black women during slavery was the slaveholders' economic power, so the class structure of capitalist society also harbors an incentive to rape... men of the capitalist class and their middle-class partners are immune to prosecution because they commit their sexual assaults with the same unchallenged authority that legitimizes their daily assaults on the labor and dignity of working people.' 'Working-class men, whatever their color, can be motivated to rape by the belief that their maleness accords them the privilege to dominate women. Yet since they do not possess the social or economic authority... guaranteeing them immunity from prosecution, the incentive is not nearly as powerful as it is for the men of the capitalist class. When working-class men accept the invitation to rape extended by the ideology of male supremacy, they are accepting a bribe, an illusory compensation for their powerlessness.' [Ch.8, the headline claim connecting rape-incidence to economic-political timing, not constant malice:] 'The class structure of capitalism encourages men who wield power in the economic and political realm to become routine agents of sexual exploitation. The present rape epidemic occurs at a time when the capitalist class is furiously reasserting its authority in the face of global and internal challenges. Both racism and sexism, central to its domestic strategy of increased economic exploitation, are receiving unprecedented encouragement. It is not a mere coincidence that as the incidence of rape has arisen, the position of women workers has visibly worsened. So severe are women's economic losses that their wages in relationship to men are lower than they were a decade ago. The proliferation of sexual violence is the brutal face of a generalized intensification of the sexism which necessarily accompanies this economic assault.'"
  - source: discovery-loop
    text: distinctness-audit-davis-1981-gendered-ideology-tracks-mode-of-production
    citation: "Lex-0629 (Federici's claim that paid labor requires an unpriced reproductive substrate, shifted onto the class least able to refuse it) states the general mechanism: any wage system presupposes unpriced reproductive labor, shifted onto whichever class can least refuse it, with the witch-hunt as the enforcement episode that installed the modern sexual division of labor. This atom is Davis's more specific historical-materialist claim: industrial capitalism generated a new, historically contingent gender ideology that could not apply uniformly across differently-situated women, plus the connected claim that rape-incidence itself tracks the timing of capitalist-authority-reassertion cycles, which lex-4uuxy does not address. Lex-0558 (Hill Collins's claim that a matrix of domination operates across interlocking axes and three levels) is the general structural-architecture claim — domination operating simultaneously across multiple axes and at three reproducing levels. This atom names the specific mechanism within that architecture: how the economic-institutional level directly manufactures the content of gender ideology and modulates the rate of sexual violence, and why that manufactured content cannot be uniform across axis-positions; Collins's own cross-attestation lineage cites Davis 1981 as a historical-materialist precursor to the matrix framework without spelling out this specific mechanism. Lex-0309 (Wells's claim that a pretext narrative conceals its actual function) is the general diagnostic: examine differential application and counterfactual cases to unmask a stated rationale as cover for a different actual function. The myth-of-the-black-rapist material here is one instance of that pattern; this atom's distinct contribution is the broader positive theory of why — gender ideology and sexual-violence patterns generally, not just this one myth, are generated by and serve economic arrangements, and cannot be assumed uniform across differently-positioned groups. Lex-0294 (the claim that an intersectional position is not decomposable into its component axes) is an epistemic anti-decomposition claim, agnostic about material causation. This atom is a material-generation claim: ideology and violence-incidence are produced by, and track, economic structure, hence cannot be uniform across differently-positioned groups — a related but separate axis, sharing the same Black-feminist-theory cluster and the family resemblance that a single category cannot describe everyone."
canonical-instances:
  - "Davis's own core historical contrast: industrial capitalism's 'ideology of femininity' — women as inhabitants of 'a sphere totally severed from the realm of productive work,' synonymous with 'mother' and 'housewife' — was a direct byproduct of white women's NEW exclusion from industrialized production, and consequently 'this vocabulary was nowhere to be found' among enslaved Black women, whose labor the slave economy could never afford to exclude from the 'productive' category. Same historical moment, two structurally different economic positions, two different — not one uniformly-imposed — gender ideologies."
  - "The rape-epidemic-tracks-capitalist-reassertion claim: 'It is not a mere coincidence that as the incidence of rape has arisen, the position of women workers has visibly worsened... The proliferation of sexual violence is the brutal face of a generalized intensification of the sexism which necessarily accompanies this economic assault.' Diagnostic template: when a specific violence statistic spikes, check the concurrent labor-market and political-authority data before defaulting to a claim about constant human nature."
  - "The myth of the black rapist as functional pretext rather than isolated bigotry: 405 of 455 men executed on rape convictions in the US, 1930-1967, were Black, while white men's routine sexual coercion of Black and working-class women went almost entirely unprosecuted — 'the license to rape emanated from and facilitated the ruthless economic domination that was the gruesome hallmark of slavery,' a pattern Davis and Lerner trace forward into Reconstruction-era mass rape by the Ku Klux Klan as an anti-Black-equality political weapon."
  - "Workplace sexual harassment as the same mechanism in a modern register, in Davis's own words: 'Having already established their economic domination over their female subordinates, employers, managers and foremen may attempt to assert this authority in sexual terms' — sexual coercion on the job reinforces vulnerability to economic exploitation and vice versa, a claim that predicts (and is regularly confirmed by) which industries and employment structures see the highest harassment rates: non-unionized, low-bargaining-power workplaces."
  - "A modern cross-domain extension responsibly built on Davis's argument rather than her text: 'family values' or 'return to traditional gender roles' rhetoric that surges specifically during periods of labor-market retrenchment or wage stagnation for women should be read as ideology tracking an economic assault, not as a resurgence of constant cultural sentiment — the diagnostic is to check the concurrent economic data, per Davis's own method, rather than treat the rhetoric as free-floating nostalgia."
critical-questions:
  - "Is the gender norm or 'women's issue' under discussion being treated as describing all women uniformly, or has the economic position of the specific group in question been checked against the ideology's actual premises? Davis's test: an ideology generated by one group's exclusion from productive labor cannot coherently apply to a group whose labor was never excludable from that category."
  - "When a specific form of sexual violence spikes, has anyone checked what is concurrently happening to the economic and political authority of the perpetrating class and the economic position of the victimized group — or is the spike being explained as a constant, ahistorical background rate of male malice?"
  - "Is a racialized or gendered 'myth' (like the black rapist, or the 'bad black woman') being treated as an isolated bigoted belief to be corrected with better information, or has the specific economic exploitation it is functionally organized to protect been named? (Composes with lex-85bw8's differential-application diagnostic.)"
  - "Is the question at the level of Davis's SPECIFIC historical-materialist mechanism (a particular mode-of-production shift generating a particular, non-uniform ideology, plus violence-incidence tracking economic-authority cycles) or at the level of Federici's GENERAL mechanism (lex-4uuxy, unpriced reproductive labor shifted onto whichever class can least refuse it)? Related but not identical — check which is actually essential for the claim being made."
  - "Whose economic position is implicitly the reference case when a 'women's experience' claim is being generalized? If the claim was articulated from an economically privileged position, does it actually describe the structural position of women differently situated in the economy — or does it erase them the way Davis shows industrial-era femininity ideology erased enslaved Black women? (Composes with lex-t7xcp.)"
