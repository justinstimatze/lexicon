id: lex-zbn3z
name: electoral-payoff-can-turn-gatekeepers-into-importers-of-extremism
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a norm-violating tactic first appears at the political fringe, don't assume the people positioned to gatekeep it out will do so by default — check whether the tactic has started paying off electorally, because a gatekeeper who notices that is more likely to import it than suppress it. Levitsky and Ziblatt: 'Although Trump opted not to run against Obama in 2012, his high-profile questioning of President Obama's nationality gained him media attention and endeared him to the Republicans' Tea Party base. Intolerance was politically useful.' ... 'In 2010, Sarah Palin advised the Republicans to 'absorb as much of the Tea Party movement as possible.' They did. Republican senators, governors, and even presidential candidates mirrored the language of the fringe, and they were joined by Republican donors who viewed the Tea Party movement as an opportunity to push the GOP into a harder line against the Obama administration.' ... 'In 2016, the Republican presidential nomination went to a birther, at a national party convention in which Republican leaders called their Democratic rival a criminal and led chants of 'Lock her up.'' This is the mirror image of gatekeeping-by-risk-aversion: the same self-interest that filters extremists out when backing them looks like a losing bet imports them instead, the moment backing them starts looking like a winning one."
related: [lex-hvc5j, lex-mmxs8, lex-vh2wh]
evokes: [levitsky-ziblatt-2018-how-democracies-die, intolerance-was-politically-useful, absorb-the-tea-party, birtherism-goes-mainstream]
lineage:
  - source: primary
    text: levitsky-ziblatt-2018-how-democracies-die-ch7-intolerance-was-politically-useful
    citation: "Steven Levitsky & Daniel Ziblatt, How Democracies Die (Crown, 2018), Chapter 7 'The Unraveling,' on birtherism and Tea Party rhetoric moving from the fringe into the Republican mainstream."
    quote: "'Although Trump opted not to run against Obama in 2012, his high-profile questioning of President Obama's nationality gained him media attention and endeared him to the Republicans' Tea Party base. Intolerance was politically useful.' ... 'In 2010, Sarah Palin advised the Republicans to 'absorb as much of the Tea Party movement as possible.' They did. Republican senators, governors, and even presidential candidates mirrored the language of the fringe, and they were joined by Republican donors who viewed the Tea Party movement as an opportunity to push the GOP into a harder line against the Obama administration.' ... 'In 2016, the Republican presidential nomination went to a birther, at a national party convention in which Republican leaders called their Democratic rival a criminal and led chants of 'Lock her up.''"
canonical-instances:
  - "Birtherism began with fringe bloggers during Obama's 2004 Senate campaign and resurfaced in 2008; by 2011 sitting U.S. senators, governors, a former vice-presidential nominee, and a prospective presidential candidate had all endorsed or encouraged it, once Republican politicians discovered — the book's own phrasing — that questioning Obama's citizenship was 'an easy way to elicit crowd enthusiasm at public appearances.'"
  - "After Sarah Palin's 2010 advice to 'absorb as much of the Tea Party movement as possible,' Republican donors and elected officials who had previously kept fringe rhetoric at arm's length did exactly that, once its capacity to energize the base and attract donor funding became visible."
critical-questions:
  - "This is close to lex-hvc5j (visible successful deviance spreads more deviance), which is about contagion to a general population watching a violation pay off. This atom is narrower — specifically about gatekeepers, the actors positioned to filter the tactic out, choosing to import it instead. Is the gatekeeper case just an instance of that general contagion mechanism, or does something distinct happen when the adopter is also the filter — the filter itself disappearing, not just failing once?"
  - "This is framed as the mirror of lex-vh2wh (self-interested risk-aversion filtering extremists out). Is there a way to predict, before an electoral cycle plays out, which direction a given gatekeeper's self-interest will point — toward suppression or toward import — or is this only ever legible in hindsight, once the payoff is already known?"
  - "Once a party's gatekeepers have imported a tactic because it paid off once, is reverting possible if the payoff later reverses, or does importing it reshape the base's own expectations in a way that makes suppression costly even after the original incentive disappears?"
status: active
severity-tier: warning
