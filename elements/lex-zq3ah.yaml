id: lex-zq3ah
name: shared-volume-statistic-hides-the-real-axis-of-a-resource-allocation-dispute
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When two parties disagree about where to place a scarce resource, and both cite case-volume or usage counts to support their position, check whether the counts are actually deciding anything — often both sides can point to a large number for their preferred option, because volume alone never settles a resource-allocation question that really turns on a different, unstated axis. Olencki documents exactly this in a debate over where a training program should add its next embedded specialist consultant. Advocates for one specialty cite raw volume: 'E.N.T. heads the list with 182 cases. Some people have made this a case for urging the introduction of an Ear, Nose, and Throat consultant into the General Medical Clinic.' But a second faction, conceding the volume, argues the number doesn't actually matter here, because the real deciding factor is something else entirely — how much learning value the case type offers: 'The other school of thought maintains that E.N.T. conditions are usually fairly easily diagnosed, the treatment clear-cut, and that they often occur in patients who have no other complaint, so that referring them to the E.N.T. Clinic does not deprive the student of a particularly valuable opportunity for learning.' That faction redirects the SAME kind of volume evidence toward a different specialty instead: 'They would prefer, if a choice had to be made, to have a consultant from the Department of Neurology, from whom expert advice was sought in 102 cases... neurology is intimately related to Internal Medicine, is an interesting and difficult specialty, and one in which it would be rewarding for students to gain more experience.' Notice what actually happened: E.N.T.'s 182 cases lost to Neurology's smaller 102 cases, because the real axis of the dispute was never raw volume at all — it was pedagogical richness (how much judgment and skill a case type demands) versus routine simplicity (how mechanically it can be diagnosed and handled). Both factions could correctly cite volume numbers and still be arguing right past each other, because volume was never the crux for either side once you look closely at their actual reasoning — it was color, not substance, dressed up as a data-driven case. Diagnostic move: when a resource-allocation debate seems to hinge on 'the numbers,' identify what each side's argument would look like if the numbers were removed — if both positions survive intact without their cited statistic, the statistic was never doing the deciding work, and the actual crux is a different, unstated axis (value, difficulty, risk, opportunity cost) that needs to be named and argued directly rather than smuggled in behind a shared-looking metric."
