id: lex-3xydd
name: leave-the-environment-of-a-recurring-temptation-rather-than-refight-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When the same environmental trigger keeps defeating a resolution no matter how many times willpower alone is applied against it in that same setting, the fix that actually works is relocating away from the trigger entirely, not renewing the resolve one more time in the place where it keeps failing. In the Jataka's tale of Campeyya, the serpent king takes up fasting vows in his own palace, but the young female serpents around him break his resolve every time; moving to the park changes nothing, since they simply follow him there too: \"he went forth from the palace into the park, but they followed him thither, and his vow was broken as before. Then he thought: 'I must leave this palace, and go into the world of men, and there must I live under the fasting vows.'\" Only leaving the serpent world entirely — not a different room in the same world — makes the vow finally hold."
related: []
evokes: [jataka, visatinipata, campeyya-jataka, environment-change-over-willpower, recurring-temptation]
lineage:
  - source: primary
    text: jataka-rouse1901-campeyya-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XV (Visati-Nipata), No. 506, Campeyya-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "he went forth from the palace into the park, but they followed him thither, and his vow was broken as before. Then he thought: 'I must leave this palace, and go into the world of men, and there must I live under the fasting vows.'"
canonical-instances:
  - "A recovering gambler who keeps losing the fight against impulse in the casino district's cafes and bars finally moves across town rather than trying, for the fourth time, to simply resist walking past the same doors on the way to work."
  - "A writer who keeps failing to focus at a home desk within earshot of an always-on group chat finally starts working from a library instead of buying yet another app to block notifications on the same machine in the same room."
critical-questions:
  - "Campeyya's first attempt to relocate — from the palace to the park — fails because the temptation follows him there too; only leaving the whole serpent world works. How do you tell, before trying, whether a given relocation is far enough to actually separate you from the trigger?"
  - "Leaving the environment has a real cost here — Campeyya gives up his kingdom and comfort entirely, not just a room. When is that cost worth paying rather than accepting a resolution that only partially holds?"
status: active
