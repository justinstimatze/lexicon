id: lex-7u8pp
name: require-an-extreme-multiple-of-gain-before-leaving-your-base-exposed
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you're weighing whether to commit your attention and resources to a large opportunity somewhere else, and that commitment leaves your home base without your presence to respond to trouble, don't compare the size of the opportunity to the size of the risk you'd be leaving behind at face value -- the risk left behind can compound while you're gone in a way the opportunity's size doesn't capture. Kautilya states this as a near-absolute rule for a king weighing a military campaign: 'A small revolt in the rear outweighs a large gain in the front; for, when the king is not there, a small revolt in the rear may be worsened by the anger of the people or by traitors, enemies and jungle tribes. If this happens, a large gain in front, even if actually obtained, will be eaten up by the subjects, allies, losses and expenses. Therefore, a king shall not undertake a campaign when the gain in front is [less than] a thousand times the likely loss due to a revolt in the rear or, at best, a hundred times the loss.' The mechanism named is compounding under your own absence: a small unattended problem doesn't stay small, because your absence removes the one thing that was suppressing its growth, and it has multiple independent channels to grow through at once -- public anger, opportunistic traitors, external enemies, and neighboring tribes can each separately escalate it while you're unavailable to intervene. The gain you're chasing has no equivalent multiplier working in your favor; it's just whatever size it is. That asymmetry is why the required ratio is a hundred-to-a-thousand-fold, not merely 'bigger' -- an ordinary favorable comparison isn't enough headroom against a risk that grows exponentially in your absence while your prize sits static. The text closes on 'misfortunes are, in the beginning, no longer than the point of a needle' -- the danger is worth taking seriously precisely because it looks negligible at the moment you're deciding to leave. Diagnostic move: before committing to a large opportunity that requires your sustained absence or attention elsewhere, don't ask 'is the opportunity bigger than the problem I'm leaving behind' -- ask whether the problem you're leaving behind has channels through which it can grow while you're gone and unable to respond, and if it does, require the opportunity to clear a very large multiple of the problem's current size, not just a favorable comparison."
