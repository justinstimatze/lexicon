name: a-fixed-single-deception-is-decipherable-an-unlimited-repertoire-is-not
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Having one reliable deceptive trick is a real advantage over having none, but it only postpones a specific vulnerability: once an opponent learns to recognize that one trick, it stops working forever, because a fixed deception is a fixed pattern. Hyde traces this through animal deception -- the grouse feigning a broken wing, the possum playing dead -- and names its limit: \"there is an important way in which these lying animals are just like animals that do not lie: both are constrained by instinct. The lying animal cannot lie creatively; it cannot vary its repertoire. The mother grouse never plays possum and the possum never plays grouse.\" This makes such animals exploitable by what Hyde calls \"technicians of instinct\": \"an animal with one instinctual deception in its repertoire has some advantage over an animal with none, but that advantage is lost when it meets a predator who knows how to decipher the deception. Then it is stuck, trapped in its own defense.\" Trickster's advantage isn't a better single trick -- it's an unbounded supply of different tricks, so no single act of learning by a predator ever solves him: \"Bee and Bear, who cannot tell a lie, are easier to trap than Grouse, who has her single famous fib. But Grouse is easier to trap than trickster, whose fabulations never end.\" Diagnostic move: when relying on a deceptive or evasive tactic to protect yourself, ask whether it's the only such tactic you have -- a single fixed maneuver, however effective right now, is only one successful counter-observation away from becoming useless every time, while a genuinely varied repertoire keeps forcing the opponent to start over."
