id: lex-2dtcp
name: capping-a-structures-lifespan-caps-the-cost-of-trying-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you want a community or organization to actually experiment rather than default to the safe, proven option, don't just encourage risk-taking -- structurally cap how long any given choice has to live with its own consequences. Mars College, an off-grid pop-up community rebuilt from scratch in the desert every year, deliberately tears down everything at the end of each season rather than building anything permanent, which its own organizers call 'essentially crazy.' The impermanence itself is doing the work here rather than being a cost the community merely tolerates: 'We get to begin anew each year -- a new experience, new people, with a campus layout and structures that are unique. This encourages experimentation. Have an idea? Why not try it? The worst that happens is that everyone has to put up with it for three months.' Capping a structure's maximum lifespan at one season caps the maximum cost of a bad idea at one season too, which is what makes trying the idea at all a reasonable bet instead of a reckless one. Capped downside also flips laziness into something dangerous rather than merely wasteful: 'Complacency is easy, but on Mars if we're complacent, the desert is going to make us pay for it' -- because nothing carries over from last year to cushion neglect, a shortcut's consequences land immediately and visibly rather than being absorbed by inherited infrastructure. Diagnostic move: when a group defaults to safe, already-proven choices instead of experimenting, check whether the actual blocker is risk aversion or simply an absent ceiling on how long a bad choice would have to be lived with -- and consider whether imposing an artificial expiration date on the thing being built, even one that costs real rebuilding effort, would license experimentation that an open-ended permanent commitment currently suppresses."
