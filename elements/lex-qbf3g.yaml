lineage:
  - source: primary
    text: hyde-raven-and-thlokunyana-as-bait-thieves-standing-outside-the-hunt
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), 'Slipping the Trap of Appetite,' 'The Bait Thief.' Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "The next time they went out, he walked off behind a point and went underwater to get this bait. Now they got bites and pulled up quickly, but there was nothing on their hooks. ... in the relationship between fish and fishermen this trickster stands to the side and takes on a third role. ... A kind of jinx or magical influence remains in the trap that has caught a weasel and that influence forever after “stands in the way” of the trap’s power; it will no longer catch game. ... the bait thief becomes a kind of critic of the usual rules of the eating game and as such subverts them, so that traps he has visited lose their influence."
canonical-instances:
  - "A consultant hired by two competing departments to help resolve a resourcing dispute quietly builds relationships with stakeholders on both sides and secures budget for their own initiative, extracting value from the conflict itself rather than resolving it for either party, and once other departments hear how it happened, they stop trusting the mediation process for future disputes."
  - "A journalist embedded with neither political campaign during an election cycle gains access to both camps' internal strategy by appearing useful to each, then publishes material that damages both sides' credibility, and future campaigns become far more guarded with any journalist who isn't openly aligned."
critical-questions:
  - "Is the 'jinx' that ruins a trap after catching Thlokunyana a real, generalizable mechanism, or is it specific to the belief system of the story, meaning the broader claim about eroded system-wide trust needs separate, non-mythological evidence to hold up in other contexts?"
  - "Does standing outside a conflict to extract value from it require genuine neutrality, or can someone credibly claim the bait thief's third position while secretly favoring one side, and how would the other parties tell the difference?"
  - "Is there a meaningful ethical distinction between exploiting a conflict from outside its rules and simply refusing to participate in a conflict at all, and does the bait thief's active extraction of value cross a line that mere non-participation wouldn't?"
status: active
