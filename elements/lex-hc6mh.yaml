id: lex-hc6mh
name: an-unproductive-emotional-response-can-accidentally-solve-the-practical-problem
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "When you're stuck on a practical problem with no idea how to solve it, giving in to an unproductive emotional response, crying out of sheer frustration rather than searching for a solution, can accidentally generate the literal material the problem required, simply because the response itself has a physical byproduct that happens to match the need. In the Gros Ventre creation myth Radin quotes, the creator Nixant is thirsty with no way to get water: 'He did not know what to do to get water. Then he thought, 'I will cry.' He cried. While he cried, he closed his eyes. He tried to think how he could get water. He shed tears. His tears dropped on the ground. They made a large spring in front of him. Then a stream ran from the spring. When he stopped crying, a large river was flowing.' Nixant doesn't stop crying because he's found the solution; the solution is a direct physical output of the crying itself, discovered only because he kept crying long enough for it to accumulate into something usable. Diagnostic move: when you're stuck and default to an unproductive emotional response instead of actively problem-solving, don't assume the response is pure waste -- check what it's actually producing as a byproduct, since the physical or social residue of an emotional reaction can sometimes supply exactly what deliberate effort was failing to find."
