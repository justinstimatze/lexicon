lineage:
  - source: primary
    text: zitkala-sa-toad-and-boy-sibling-as-surveillance
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'The Toad and the Boy.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'Very closely watched the old toad mother her stolen human son. When by chance he started off alone, she shoved out one of her own children after him, saying: \"Do not come back without your big brother.\" Thus the wild boy with the long, loose hair sits every day on a marshy island hid among the tall reeds. But he is not alone. Always at his feet hops a little toad brother.'"
canonical-instances:
  - "A manager who has grown suspicious that a talented employee is job-hunting assigns a friendly, well-liked coworker to 'pair up' with them on every project going forward, framing it as mentorship and collaboration rather than the monitoring it actually is, making it socially awkward for the employee to ever object to the arrangement."
  - "Parents worried a teenager has started spending time with a bad influence arrange for a trusted, likable cousin to suddenly become available for every outing 'as company,' rather than directly restricting the teenager's movements, so the surveillance is absorbed into what looks like ordinary family closeness rather than an imposed restriction."
critical-questions:
  - "how does the monitored person ever distinguish a genuinely caring companion assignment from a surveillance one, if the entire mechanism depends on the cover being indistinguishable from the real thing -- is there any reliable signal available to them at all?"
  - "does this tactic damage the cover relationship itself once discovered -- if the companion is later recognized as having been assigned for monitoring, does that retroactively poison whatever genuine warmth existed in the relationship, even if the companion's own affection was real?"
  - "is there a meaningful ethical difference between this tactic used protectively (a parent worried about a child's safety) versus controllingly (an employer suspicious of disloyalty), or does the mechanism's covert, relationship-disguising nature make it ethically suspect regardless of the motive behind it?"
