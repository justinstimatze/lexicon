id: lex-fyxdh
name: public-good-reframing-overrides-private-exclusivity-norm
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A norm of private exclusivity — exclusive ownership, exclusive access, exclusive claim over something normally treated as a private possession — can be overridden by recasting the excluded thing as actually belonging to, or serving, the collective rather than the individual. Once the reframing takes hold, exceptions that would otherwise read as violations of the exclusivity norm instead read as legitimate exercises of a public claim that was there all along; the reframing is the mechanism that licenses the exception, not a separate justification layered on top of a still-intact private norm. Plutarch's Life of Lycurgus records this reframing applied to a specific and, by later Greek and modern standards, deeply uncomfortable case: Spartan marriage norms. Lycurgus 'made it, nevertheless, honorable for men to give the use of their wives to those whom they should think fit, that so they might have children by them' — a direct license to depart from ordinary marital exclusivity — and Plutarch states the underlying justification explicitly: 'Lycurgus was of a persuasion that children were not so much the property of their parents as of the whole commonwealth, and, therefore, would not have his citizens begot by the first comers, but by the best men that could be found' — Plutarch's sentence continues past this excerpt. The structural claim worth extracting is the reframing move itself, not an endorsement of Sparta's specific application of it, which was in service of a state-directed breeding program most modern readers will rightly find troubling: once children are reframed as belonging to the commonwealth rather than to their parents privately, an exception to spousal exclusivity stops reading as a violation of the parents' rights and starts reading as a legitimate exercise of the commonwealth's own prior claim. Generalize beyond this troubling instance to cleaner modern analogs where the same structural move operates without the ethically fraught content: compulsory patent licensing, where a government reframes an invention as serving public health need rather than purely private commercial right, licensing use that would otherwise be patent infringement; wartime requisition of private property, where military necessity is framed as revealing the property's latent public claim rather than simply overriding private ownership by force. The diagnostic move: when an exception to an exclusivity norm is being justified, check whether the justification is arguing the exception is worth the violation (a cost-benefit override) or arguing there was never a pure private-exclusivity claim to violate in the first place (a reframing that dissolves the violation itself) — the second is a structurally different and more durable move, since it doesn't concede anything was taken."
