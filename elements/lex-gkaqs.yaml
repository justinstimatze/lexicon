canonical-instances:
  - "A manager engineers a plan to poach a rival team's client list, personally keeping the rival's account lead on a long, friendly call while a junior staffer downloads the records, then takes sole credit with leadership once the new accounts are secured."
  - "An organizer of a coordinated walkout keeps a cordial one-on-one meeting with management running as a distraction while the actual work stoppage is triggered by other members, then negotiates the settlement personally once it succeeds."
critical-questions:
  - "Do the animal proxies in the relay share in the benefit of the stolen summer, or does the story show Inktonmi retaining exclusive control once he 'makes summer by opening the bag' himself, and does that change how fair the arrangement reads?"
  - "Is the distraction itself a form of risk-bearing, given that engaging the owner in conversation could plausibly be discovered as complicity, or does the story treat it as strictly safer than the physical theft?"
  - "Would the relay structure work without a trusted network of associates willing to accept the exposed role, and does the story suggest what Inktonmi offered them in exchange for that risk?"
