id: lex-hfze3
name: refuse-a-powerful-tool-to-an-eager-recipient-until-briefed
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When someone eagerly reaches for a powerful resource you're about to hand over, treat that eagerness itself as a reason to pause and brief them fully before releasing it -- not as evidence they're ready, since the same urgency that makes someone want the resource immediately is what makes them most likely to misuse it. In Cushing's telling, the young man, desperate to reunite with his dead wife, reaches for the Owl's medicine of sleep before hearing any conditions on its use: 'The young man eagerly reached forth his hand for the magic medicine.' The Owl refuses outright, naming the eagerness itself as the disqualifying signal: 'Fool! were it not well, for that would I not help thee. Thou art too eager, and I will not trust thee with my medicine of sleep.' Only after this refusal does the Owl lay out the full, precise condition governing the resource's use -- don't approach or kiss her until you've reached home. The sequence matters: the Owl doesn't hand over the tool and hope the instructions land, and doesn't merely state the instructions while the recipient is still grasping for the resource -- it withholds the resource entirely until the eagerness has been named and the recipient is actually listening, rather than just wanting. Diagnostic move: before handing a powerful capability, credential, or piece of leverage to someone who is visibly eager to get their hands on it, delay the handoff specifically to make sure the conditions on its use are heard and registered, not just spoken -- a recipient's urgency to receive something is itself information about how carefully they'll be able to use it, and it's worth spending a moment of friction there rather than assuming urgency and readiness are the same thing."
