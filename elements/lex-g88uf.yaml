id: lex-g88uf
name: reward-versus-punishment-is-recipient-relative-not-an-intrinsic-property
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "When a system of social control depends on administering rewards and punishments, check whether it assumes the classification of a given consequence -- reward or punishment -- is a fixed, observable fact rather than something relative to the specific recipient's own private preferences. Lakoff invokes the Brer Rabbit case to make this vivid: being thrown into the briar patch is a severe punishment to almost anyone, thorns and all. To Brer Rabbit it's a reward, because the briar patch is his home terrain and exactly where he wanted to end up. The consequence didn't change; what changed is whose preferences it's being measured against. A system built on the assumption that rewards and punishments can be specified objectively -- that everyone will experience 'this' as painful and 'that' as pleasant -- has no fixed target to administer, because the classification depends on facts about the specific recipient that the person handing out the consequence may never know and can't verify from the outside. This isn't a rare edge case. Anyone whose actual preferences diverge from the administrator's assumptions turns every intended punishment into an accidental reward, or the reverse, without either party necessarily realizing it happened. Diagnostic move: before treating a reward-and-punishment system as reliable, ask how the system would even detect a case where its classification of a consequence is backwards for a specific recipient -- if the answer is 'it wouldn't,' the system's coherence depends on an assumption it has no way to check."
related: []
evokes: [george-lakoff, moral-politics-1996, brer-rabbit, folk-behaviorism, reward-punishment]
lineage:
  - source: primary
    text: lakoff-1996-brer-rabbit-briar-patch
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 22 'The Human Mind,' section 'Categorization.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“It makes no sense to impose punishments if the meaning of the punishment is not itself clear. If the idea of what the punishment is can vary substantially, then what you think of as a punishment might be understood by someone else as being neutral or even as a reward. Remember Brer Rabbit and the briar patch.”"
canonical-instances:
  - "The direct textual anchor, on why this specifically breaks the Strict Father model's own requirements: 'There must be no meaning variation concerning what rewards and punishments are... People can't obey your orders if they have a different idea than you do of what those orders are.'"
  - "Hypothetical: a middle school implements a new disciplinary policy where disruptive students are removed from class and sent to a quiet study room for the rest of the period. Administrators expect this to function as a punishment, reducing disruptive behavior. For a student who finds the noisy, socially demanding classroom genuinely distressing, removal to a quiet room is a relief rather than a deterrent, and that student's disruptive behavior increases as a way of engineering the same outcome again. The consequence never changed; the administrators simply never checked whose preferences they were calibrating it against."
critical-questions:
  - "This mechanism assumes preferences are private and largely unknowable to an outside administrator, but real institutions routinely gather information about individual preferences (surveys, past behavior, direct requests) to calibrate consequences more accurately. Does better information collection substantially rescue a reward-punishment system from this problem, or does the underlying issue persist even with good information, because preferences can also shift over time or be actively concealed by the recipient?"
  - "If reward and punishment are recipient-relative, does that undermine only large-scale, one-size-fits-all systems of social control, or does it also undermine small-scale, individually calibrated ones, like a parent who knows a specific child well enough to correctly predict what that child will experience as punishing? Is there a scale at which the mechanism stops being a serious problem, or does it always remain a risk regardless of how well the administrator knows the recipient?"
