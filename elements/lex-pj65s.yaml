id: lex-pj65s
name: correlated-childhood-experience-forges-a-lasting-metaphor-mapping
type-in: process
type-out: state
_tier: atomic
agent-instruction: "When you find an abstract concept persistently described in terms of a concrete bodily experience — affection as warmth, quantity as height, difficulty as weight — look for a period early in development when the two experiences co-occurred so reliably that a child couldn't tell them apart. The two domains start out fused: the infant held affectionately is also held warmly, and for a while there's no separate concept of 'affection' independent of 'warmth.' Development later pulls the domains apart into distinct concepts, but the cross-domain association that formed during the fused period doesn't disappear — it becomes the metaphor mapping that lets an adult later call a smile 'warm' with no sense of speaking figuratively. This gives you a mechanism, not just a taxonomy: to explain why a specific metaphor pairing exists (and not some other equally plausible one), look for the correlated bodily experience that would have produced it in early development, rather than treating the pairing as an arbitrary cultural convention or a late-life analogy someone invented."
related: [lex-zwnfz, lex-jtw66]
scaffolds-from: [lex-zwnfz]
evokes: [conflation-hypothesis, primary-metaphor-theory, grady-primary-metaphors, affection-is-warmth, embodied-cognition]
lineage:
  - source: primary
    text: lakoff-johnson-1999-philosophy-in-the-flesh-ch4-conflation
    citation: "George Lakoff and Mark Johnson, Philosophy in the Flesh: The Embodied Mind and Its Challenge to Western Thought (Basic Books, 1999), Chapter 4 'Primary Metaphor and Subjective Experience,' p.46 (Christopher Johnson's conflation hypothesis, presented as Part 1 of the book's four-part theory of primary metaphor). Verified verbatim against a pdftotext -layout extraction, cross-checked to the correct physical page by direct text search across the PDF. Distinguishes the acquisition mechanism (this atom) from the two static claims already grounded in the corpus: lex-zwnfz's orientational-metaphor inheritance and lex-kfdep's cognition-shapes-behavior-at-scale claim, neither of which states how a specific mapping comes to exist in the first place."
    quote: "Johnson's theory of conflation in the course of learning. For young children, subjective (nonsensorimotor) experiences and judgments, on the one hand, and sensorimotor experiences, on the other, are so regularly conflated—undifferentiated in experience—that for a time children do not distinguish between the two when they occur together. For example, for an infant, the subjective experience of affection is typically correlated with the sensory experience of warmth, the warmth of being held. During the period of conflation, associations are automatically built up between the two domains. Later, during a period of differentiation, children are then able to separate out the domains, but the cross-domain associations persist. These persisting associations are the mappings of conceptual metaphor that will lead the same infant, later in life, to speak of..."
canonical-instances:
  - "AFFECTION IS WARMTH: an infant held with affection is simultaneously held warmly; the conflation of the two produces the adult metaphor 'a warm smile,' 'a warm welcome,' 'a cold shoulder' — with no felt sense that the temperature-word is figurative rather than literal."
  - "MORE IS UP: a child's early experience of adding items to a pile and watching the pile's top rise conflates increasing-quantity with increasing-height; the adult metaphor 'prices are rising,' 'his spirits sank' inherits the correlation rather than being invented as an analogy."
  - "lex-zwnfz abstract-concepts-inherit-bodily-schemas-via-orientational-metaphor states the resulting fact: abstract concepts carry bodily structure. This atom answers a question lex-zwnfz leaves open — why THIS pairing and not some other equally plausible one — by pointing to a specific concrete-and-abstract experience that co-occurred reliably in childhood. That's a narrower, more falsifiable claim than 'bodily schemas are apt vehicles for abstraction' in general. The two atoms compose end to end: inheritance from lex-zwnfz, origin from here."
  - "operationally distinct from lex-kfdep conceptual-metaphors-structure-cognition-invisibly-and-shape-behavior-at-scale: lex-kfdep is about downstream consequences of metaphor on reasoning and policy at scale; this atom is about upstream origin — why THIS mapping and not another arose in the first place."
critical-questions:
  - "Is the proposed metaphor actually grounded in a plausible early-childhood correlation, or is it a plausible-sounding story invented after the fact to explain an existing linguistic pattern? The conflation hypothesis is falsifiable in principle (does the claimed sensorimotor/subjective pairing actually co-occur reliably for infants?) but hard to test directly; treat a proposed conflation-origin as a hypothesis worth checking against developmental evidence, not an automatic explanation for any metaphor you notice."
  - "Real methodological critique exists here (Murphy 1996 and others): the theory's own vocabulary sometimes blurs the line between 'literal' and 'metaphorical' conflation it's trying to explain, and it's not always clear which mappings the theory predicts should NOT exist. Use the mechanism as a generative hypothesis, not a settled account that explains every metaphor equally well."
  - "Does the persisting association actually constrain later abstract reasoning, or is it merely a linguistic residue with no cognitive consequence? The strong version of the claim (metaphor structures thought, not just speech) is the more contested part — the conflation-origin claim itself is more modest and easier to defend than what people build on top of it."
status: active
