    quote: "'Never try to fly like other birds. Upon the day you try to fly you shall be changed into your former self.' ... 'Your flight must always be in a straight line. Never turn a curve nor jump about like a young fawn,' said the arrow magician."
canonical-instances:
  - "A junior employee finally promoted to a senior title they envied is told the role comes with a strict condition against the exact kind of hands-on, creative work that made the senior people they admired look enviable in the first place -- the promotion grants the title while forbidding the actual activity that made the title desirable, and the employee, unable to resist doing the work they loved, quickly gets demoted for exceeding their new, narrower mandate."
  - "Someone who has long envied a wealthy acquaintance's freedom finally acquires similar wealth through an inheritance tied to a trust that forbids any spending beyond conservative, pre-approved categories -- they have the money that was supposed to buy freedom, on the explicit condition that they never actually use it the way freedom would require, and the first real temptation to spend spontaneously voids the arrangement."
critical-questions:
  - "is it always true that the condition targets the exact motivating impulse, or does this framework risk over-reading ordinary restrictions (which exist in most real transformations, promotions, and acquisitions) as uniquely self-defeating when they're actually just normal, survivable constraints?"
  - "does recognizing this pattern in advance actually help, or is the whole point that the desire is strong enough to override foreknowledge -- Iktomi arguably already knows, from the peacock failure, exactly what will happen with the arrow, and does it anyway, suggesting insight alone doesn't prevent the repeat?"
  - "what would a genuinely satisfying version of the wish have looked like -- is there a way to actually get the underlying freedom being sought, or does this framework imply that certain desires (to become fundamentally other than what you are) can never be granted in a form that would actually satisfy the desire that produced them?"
status: active
