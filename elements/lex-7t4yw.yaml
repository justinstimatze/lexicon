lineage:
  - source: primary
    text: radin-sam-and-jasper-blowsnakes-versions-of-the-twin-myth-differ-by-temperament
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'Winnebago Mythology and Literary Tradition.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "This variability, large and small, must not be dismissed as accidental or as due necessarily to a faulty recounting of the myth or mythcycle. It generally had some real significance. ... The first was introduced to add a humorous note to a humourless plot, the second, to bring the heroes of the myth into relationship with certain hero-deities in order to increase the prestige of the former, who were not deities. ... Sam Blowsnake was facile of speech, sociable, superficial, selfimportant, possessed of very little religious feeling and with little interest in the past. He had, however, great literary gifts and a fluent style ... He was fundamentally a nonconformist ... His brother was his complete antithesis. He was deeply religious, a complete conformist, insistent upon transmitting what he knew as faithfully, indeed, as meticulously as possible."
canonical-instances:
  - "Two employees who received identical onboarding training later explain a company policy to new hires with slightly different added caveats, and each caveat traces directly to a specific incident each employee personally experienced, rather than to any difference in what they were taught."
  - "Two witnesses to the same event give accounts that agree on every major fact but differ in which small details each one chooses to emphasize, and a careful interviewer treats those emphases as revealing what each witness found most striking or threatening, not as memory errors to reconcile away."
critical-questions:
  - "Does Radin's explanation of Sam's two additions rely on independently verifiable knowledge of Sam's personality, or is there a risk that the personality description was constructed after the fact to fit the additions that were already observed?"
  - "Would this diagnostic still hold if the two tellers had never been characterized by an outside observer like Radin, or does it depend on already having independent access to each person's temperament to check the inference against?"
  - "Is there a meaningful difference between an addition that serves a clear narrative or social function, like Sam's humor or status-elevation, and a difference that is genuinely just an error or omission, and how would an analyst tell the two apart without an account like Radin's own biographical knowledge of the tellers?"
