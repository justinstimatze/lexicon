id: lex-vacbr
name: identity-protective-cognition
type-in: claim
type-out: posture
_tier: atomic
agent-instruction: "When someone's beliefs track their group identity tightly, suspect identity-protective cognition. They're not reasoning about the claim; they're reasoning about what believing this claim signals to their group. Engage the identity stakes, not just the surface argument."
related: [lex-uz7g4, lex-5yufs, lex-tjwfn, lex-t9fs7, lex-rcj6y, lex-u8u7y, lex-2rsad, lex-jw34x, lex-mh7jf, lex-r3w25, lex-3hefg, lex-u68ue, lex-e5des, lex-x6sbv, lex-uanys, lex-qdxa7, lex-jnvtj, lex-cjuza, lex-96xn9, lex-tqd9x, lex-6nj6k]
scaffolds-from: [lex-r3w25, lex-tjwfn, lex-uz7g4, lex-t9fs7, lex-rcj6y, lex-u8u7y, lex-3hefg, lex-6nj6k]
evokes: [kahan-ipc, the-claim-that-threatens-identity-gets-rejected, ideologically-motivated-cognition, the-tribe-determines-the-inference, smarter-people-are-better-at-rationalizing]
lineage:
  - source: practitioner
    text: kahan-2013-ideology-motivated-reasoning-cognitive-reflection
    citation: "Dan Kahan, 'Ideology, motivated reasoning, and cognitive reflection,' Judgment and Decision Making 8(4):407-424 (July 2013) — the canonical paper. Kahan demonstrates that cognitive-reflection ability (numeracy, system-2 thinking) AMPLIFIES motivated-reasoning when conclusions are identity-relevant. Higher-numeracy subjects show LARGER ideological gaps in interpretation of identity-relevant data, not smaller. Subverts the common assumption that better-thinking would correct bias. Verbatim quotes below from the abstract, Section 2 definition, and the central empirical claim (open access via journal.sjdm.org → jbaron.org/journal/13/13313/jdm13313.html)"
    quote: "Subjects who scored highest in cognitive reflection were the most likely to display ideologically motivated cognition. [Abstract.] The goal of protecting one's identity or standing in an affinity group that shares fundamental values can generate motivated cognition relating to policy-relevant facts. [Section 2 definition.] The tendency of subjects (varying in political dispositions) to form ideologically congenial assessments of the validity of the Cognitive Reflection Test became progressively more pronounced as subjects' CRT scores increased. [Central empirical claim — counterintuitive numeracy-paradox finding that subverts standard dual-process predictions.]"
  - source: practitioner
    text: kahan-2017-misinformation-paper
    citation: "Dan Kahan, 'Misconceptions, Misinformation, and the Logic of Identity-Protective Cognition,' Cultural Cognition Project Working Paper 164 (2017) — the operationalization paper. Identity-protective cognition is defined as the tendency to selectively accept or reject information based on whether the information is congenial to the cognizer's group identity. Distinct from confirmation-bias by the identity-stakes component. No verbatim quote is claimed here."
canonical-instances:
  - "Kahan 2013 numeracy-paradox: subjects with high cognitive-reflection ability shown identical scientific data on a politically-charged topic (gun-control efficacy) showed MORE polarized interpretations than low-CRT subjects. Smart liberals interpreted the data as showing gun-control works; smart conservatives interpreted the same data as showing it doesn't. Less smart subjects of both stripes interpreted more accurately"
  - "climate-science skepticism by tribe: same scientific evidence interpreted as 'overwhelming evidence' by climate-concerned tribes and as 'inconclusive / politically motivated' by climate-skeptical tribes. The interpretation tracks identity, not the evidence. Both sides have the same access to data"
  - "evolution rejection in religious communities: the scientific evidence for biological evolution is interpreted differently depending on whether accepting evolution would threaten religious-community identity. Same evidence, different identity-stakes, different interpretations"
  - "vaccine-skepticism in counter-cultural communities: the scientific consensus on vaccine safety is interpreted as 'manufactured by establishment' by communities whose identity includes skepticism-of-establishment. The cognitive sophistication required to construct the counter-argument is high; the motivation to construct it comes from identity-stakes"
  - "in expert-disagreement domains, lay observers preferentially attend to expert-positions held by in-group experts and dismiss out-group expert positions. Same expert credentials, different identity-affiliation, different perceived credibility"
  - "operationally a specific instance of lex-uz7g4 archetype-as-projective-shorthand: identity supplies the archetypes that get projected; the projection is identity-protective when threatened claims are filtered through the protective archetype-frame"
  - "operationally distinct from lex-5yufs form-persists-when-content-dissolves: form-persists is temporal (the form stays after the content withdraws); identity-protective-cognition is selective (the identity-threatening content gets actively rejected). Both involve identity-and-form interaction but at different points in the lifecycle"
  - "operationally adjacent to lex-tjwfn recursive-mind-simulation-shapes-self: recursive-mind-simulation produces the audience-models that constitute identity; identity-protective-cognition is the defense-mechanism for those identity-models. The two compose: simulation builds identity; protective-cognition defends it"
  - "operationally a specific instance of lex-rcj6y motivated-reasoning: identity-protective-cognition is motivated-reasoning where the motivation is identity-protection (vs other motivations like accuracy, ego, comfort). Kunda 1990 → Kahan 2013 is the theoretical lineage; Kahan operationalized identity as the specific motivation that produces the strongest motivated-reasoning effects"
  - "operationally adjacent to lex-u8u7y social-identity-as-self-concept-determinant: SIT supplies WHICH identities are operative; identity-protective-cognition is the DEFENSE pattern that protects those identities' beliefs. SIT is structural; IPC is dynamic"
critical-questions:
  - "the actual-identity-threat test: is the claim ACTUALLY identity-threatening? IPC fires only when claims threaten identity-defining beliefs. Many claims appear identity-relevant but aren't (a Republican might accept liberal-attributed data on a topic that's NOT politically-coded). Identifying which claims are identity-coded is itself a substantive empirical question; misdiagnosing a non-coded claim as IPC produces the wrong intervention. Practitioner-discipline: verify the identity-coding before treating resistance as IPC"
  - "the messenger-identity bypass: are there interventions that route around IPC? Kahan's Cultural Cognition Project work on 'identity-vouching' — when an identity-aligned messenger delivers identity-threatening information, IPC weakens. The messenger's identity-credentials supply the protection that lets the message land. Practitioner-question: who in the target audience's in-group could carry this message? In-group spokespeople are the standard intervention pattern"
  - "the smart-makes-it-worse warning: IPC INTENSIFIES with cognitive sophistication (Kahan 2013 numeracy paradox). High-CRT subjects in motivated-reasoning conditions show MORE polarization, not less. The cognitive sophistication supplies more elaborate counter-arguments to identity-threatening claims. Practitioner-discipline: when targeting persuasion-resistant audiences, sophistication is not a bypass; if anything, it amplifies the resistance"
  - "the framing-as-protection check: can the claim be re-framed to be identity-NEUTRAL? Same evidence presented as 'national-security' vs 'environmental' lands differently on the same audience. Practitioner-question: what framing of this claim makes it not identity-coded? If a non-identity-coded framing exists, use it before deploying identity-bypass strategies"
status: active
