evokes: [split-the-key, absolute-heresy, pulverized-dinner-plate, exchanged-totally-in-the-open, one-way-function]
lineage:
  - source: primary
    text: levy-2001-crypto-how-the-code-rebels-beat-the-government
    citation: "Steven Levy, Crypto: How the Code Rebels Beat the Government -- Saving Privacy in the Digital Age (Viking Penguin, 2001), chapter 'public key.'"
    quote: "He would split the key. Diffie's breakthrough itself involved something that, in the context of the history of cryptography, seemed an absolute heresy: a public key. Until that point, there was a set of seemingly inviolable rules when it came to encryption, a virtual dogma that one ignored at the risk of consignment to crypto hell. One of those was that the same key that scrambled a message would also be the instrument that descrambled it... Instead of using one single secret key, you could use a key pair. The tried-and-true symmetrical key would be replaced by a dynamic duo... yes, that second key -- the one that flipped open the trapdoor -- was of course something that had to be kept under wraps... But its mate, the key that actually performed the encryption, didn't have to be a secret at all. In fact, you wouldn't want it to be a secret. You'd be happy to see it distributed far and wide. Now, the idea of ensuring privacy by using keys that were exchanged totally in the open was completely nonintuitive, and on the face of it, bizarre. But using the mathematics of one-way functions, it could work... It was the answer. From that moment, everything was different in the world of cryptography... Without that private key, reversing the mathematical encryption process is too damn difficult. Remember, going the wrong way in a one-way function is like trying to put together a pulverized dinner plate. [On the Diffie-Hellman algorithm itself, published as 'New Directions in Cryptography,' 1976:] It presupposes two parties who want to communicate in secret; by using one-way functions, these parties can jointly generate a shared key, one that an eavesdropper listening in on the session cannot intercept... There's no problem in sending this number over an open channel because, in effect, it's an encrypted secret number, scrambled by means of a one-way function that was easy to perform but extremely hard to reverse. (Levy, Crypto, 'public key.')"
  - source: discovery-loop
    text: levy-crypto-mining-pass-
    citation: "Lex-0149 (trust-formation) concerns evaluating whether to trust a person via ability, benevolence, and integrity — not bootstrapping a shared secret between strangers via mathematical asymmetry. Lex-0192 (Postel's Law) names a different kind of asymmetry — tolerance-asymmetry in protocol design — not effort-asymmetry for trust bootstrapping. Lex-0837 (Hayek, price-signal-compresses-dispersed-knowledge) is about compressing dispersed knowledge into an actionable signal, not about bootstrapping a shared secret from computational asymmetry, though both are cousins of 'coordination without full information.' None of these states the core claim that a cheap-forward/hard-to-reverse mathematical function can substitute for a pre-shared secret or trusted intermediary as the basis for secure coordination between strangers. Companion atom to lex-z2tcn (same source, same chapter, Merkle's bounty-calibration passage)."
canonical-instances:
  - "CAPTCHA and proof-of-work systems (Bitcoin mining, email spam-cost schemes like Hashcash) substitute a computational-effort asymmetry for a trust relationship: the system doesn't need to know or vet who's on the other end, only that producing a valid submission costs the submitter real, verifiable effort that a bot or spammer can't cheaply fake at scale."
  - "Zero-knowledge proofs in modern authentication (proving you know a password without transmitting it, or proving you're over 18 without revealing your birthdate) extend the same substitution: the verifier and prover need no prior relationship or trusted intermediary, because the asymmetry (easy to verify a valid proof, infeasible to construct a false one without the secret) does the trust-bootstrapping work."
  - "A reputation system built on a costly, hard-to-fake signal (a security deposit, a staked bond, a demonstrated multi-year track record) rather than on personal vouching lets strangers transact with each other at scale -- the underlying logic is the same substitution: an asymmetric cost structure (cheap for the honest actor to produce, expensive for a bad actor to fake) replaces the need for a pre-existing trusted relationship."
critical-questions:
  - "Isn't this just 'trust but verify,' a generic security cliché? No -- the specific, checkable claim is narrower: it names WHAT kind of structure can substitute for prior relationship or shared-secret exchange (a cheap-forward/expensive-to-reverse mathematical or structural asymmetry), not merely a generic exhortation to verify. Most 'trust but verify' advice doesn't specify a mechanism; this atom specifies exactly one class of mechanism and its two failure conditions (see agent-instruction)."
  - "Doesn't this apply only to cryptography and computer security? No -- the atom names a structural pattern that predates and outlives any specific cryptographic implementation: Diffie's own generalization was explicitly about trust and privacy for strangers at scale, not just message-scrambling. Any domain where the bottleneck is 'we need to coordinate securely but have no prior relationship and no trusted intermediary' is a candidate for this pattern, whether or not the actual mechanism involves a computer -- a wax seal's difficulty to forge without the original signet, or a bank note's difficulty to counterfeit without specialized equipment, are pre-digital instances of the same cheap-forward/hard-to-reverse structure substituting for a personal relationship between issuer and any eventual holder."
  - "How do you tell a real asymmetry from a fake one that merely looks impressive? Check both diagnostic conditions explicitly: is the easy direction actually cheap for the LEGITIMATE party under their real resource constraints (not just cheap in principle), and is the hard direction actually hard against the ADVERSARY'S actual available resources (not just hard against a naive attacker). Merkle's own knapsack cipher failed this exact test at low difficulty settings -- his deliberately-weakened public-challenge version was breakable specifically because the asymmetry gap was set too small, which is precisely why he planned to raise the stakes only after the weaker version held up (see lex-z2tcn)."
