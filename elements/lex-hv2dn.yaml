lineage:
  - source: primary
    text: butlin-long-et-al-2023-consciousness-in-artificial-intelligence-arxiv-2308-08708
    citation: "Patrick Butlin, Robert Long, Eric Elmoznino, Yoshua Bengio, Jonathan Birch, Axel Constant, George Deane, Stephen M. Fleming, Chris Frith, Xu Ji, Ryota Kanai, Colin Klein, Grace Lindsay, Matthias Michel, Liad Mudrik, Megan A. K. Peters, Eric Schwitzgebel, Jonathan Simon, Rufin VanRullen, *Consciousness in Artificial Intelligence: Insights from the Science of Consciousness* (arXiv:2308.08708v3, 22 August 2023). The transferable claim, abstracted from the consciousness-specific application: when assessing a contested theoretical property in complex systems, derive indicator properties from each of multiple credible theories and aggregate credence across the indicator set rather than (a) picking one theory and committing or (b) relying on behavioral tests. The paper's specific subject is AI consciousness; the methodological move is general. The paper makes three explicit methodological commitments: (1) computational functionalism as a working hypothesis (not metaphysical commitment) — assess systems by what they compute, not their substrate; (2) theory-heavy assessment over behavioral test — behavior can be mimicked without underlying function; (3) multiple-theory aggregation — derive indicators from RPT, GWT, HOT, AST, predictive-processing, and agency/embodiment frameworks rather than pick one. The transferable atom extracts the methodology without committing to computational functionalism as a metaphysical claim. Distinct from lex-8y3ch phenomenal-consciousness-attributed-from-behavior-without-addressing-what-its-likeness, which names the SUBSTANTIVE problem the methodology addresses (phenomenal consciousness is real and hard to assess); this atom names the METHODOLOGY for making such assessments tractable. Distinct from lex-uahgy intentional-stance-treats-system-as-rational-agent-for-prediction, because Dennett's stance is a PREDICTIVE strategy whose validity is tested by behavioral prediction; Butlin-Long et al. explicitly reject behavioral testing as adequate for consciousness assessment specifically because intentional-stance behavioral success does not entail the underlying functional structure. The two atoms address different questions: intentional stance is about whether a stance predicts behavior; multi-theory-indicator-rubric is about whether a transferable functional property is genuinely present. Distinct from lex-zag9z cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity because lex-zag9z is about evidence-weighing within a single inference; this atom is about generating the indicator set from multiple theories before evidence-weighing begins. Distinct from lex-wtkuz descriptive-vs-operational-metacognition because this atom is the SPECIFIC METHODOLOGY for operationalizing contested theoretical properties via multi-theory indicator derivation; lex-wtkuz is the broader move of preferring operations to descriptions."
    quote: "[Butlin-Long et al. 2023 p.4 Executive Summary:] 'We take our principal contributions in this report to be: 1. Showing that the assessment of consciousness in AI is scientifically tractable because consciousness can be studied scientifically and findings from this research are applicable to AI; 2. Proposing a rubric for assessing consciousness in AI in the form of a list of indicator properties derived from scientific theories; 3. Providing initial evidence that many of the indicator properties can be implemented in AI systems using current techniques, although no current system appears to be a strong candidate for consciousness.' [p.4, methodology — three tenets:] 'First, we adopt computational functionalism, the thesis that performing computations of the right kind is necessary and sufficient for consciousness, as a working hypothesis. This thesis is a mainstream — although disputed — position in philosophy of mind. We adopt this hypothesis for pragmatic reasons: unlike rival views, it entails that consciousness in AI is possible in principle and that studying the workings of AI systems is relevant to determining whether they are likely to be conscious. [...] Second, we claim that neuroscientific theories of consciousness enjoy meaningful empirical support and can help us to assess consciousness in AI. These theories aim to identify functions that are necessary and sufficient for consciousness in humans, and computational functionalism implies that similar functions would be sufficient for consciousness in AI. Third, we argue that a theory-heavy approach is most suitable for investigating consciousness in AI. This involves investigating whether AI systems perform functions similar to those that scientific theories associate with consciousness, then assigning credences based on (a) the similarity of the functions, (b) the strength of the evidence for the theories in question, and (c) one's credence in computational functionalism. The main alternative to this approach is to use behavioural tests for consciousness, but this method is unreliable because AI systems can be trained to mimic human behaviours while working in very different ways.' [p.4-5, multi-theory aggregation:] 'Various theories are currently live candidates in the science of consciousness, so we do not endorse any one theory here. Instead, we derive a list of indicator properties from a survey of theories of consciousness. Each of these indicator properties is said to be necessary for consciousness by one or more theories, and some subsets are said to be jointly sufficient. Our claim, however, is that AI systems which possess more of the indicator properties are more likely to be conscious. To judge whether an existing or proposed AI system is a serious candidate for consciousness, one should assess whether it has or would have these properties.' [Table 1, p.5, sample of indicator properties — illustrative not exhaustive:] RPT-1 Input modules using algorithmic recurrence; GWT-1 Multiple specialised systems capable of operating in parallel (modules); GWT-2 Limited capacity workspace, entailing a bottleneck in information flow and a selective attention mechanism; HOT-2 Metacognitive monitoring distinguishing reliable perceptual representations from noise; AST-1 A predictive model representing and enabling control over the current state of attention; PP-1 Input modules using predictive coding; AE-1 Agency: Learning from feedback and selecting outputs so as to pursue goals."
canonical-instances:
  - "Consciousness-in-AI as the named-case (the paper's own use): given competing theories — Recurrent Processing Theory, Global Workspace Theory, Higher-Order Theories, Attention Schema Theory, Predictive Processing — derive ~14 indicator properties total. Assess each AI system (Transformer LLMs, Perceiver, DeepMind's Adaptive Agent, PaLM-E) against the rubric. The paper's conclusion: no current system is a strong candidate, but no insurmountable technical barriers prevent building one that meets the indicators. The methodology produces a usable engineering-level answer to a question philosophy alone could not."
  - "Intelligence assessment in machine-learning systems: 'Is GPT-N intelligent?' is the same shape of question as 'Is GPT-N conscious?' — contested property, multiple credible theories (Cattell-Horn-Carroll g, predictive-processing intelligence, agentive-rational-actor intelligence). The multi-theory-indicator-rubric methodology applies: derive indicators from each, assess against the combined list, aggregate credence. Beats both 'pick g and stop' and 'use benchmark scores as the test' for the same reasons it beats single-theory and behavioral-test approaches in the consciousness case."
  - "Organizational property assessment: 'Is this organization innovative?' — contested, multiple credible theories (resource-based view, dynamic capabilities, March's exploration-exploitation, Christensen's disruptive-innovation, ambidextrous-organization). Apply the rubric: derive operationalizable indicators from each theory, assess the organization against the combined list, weight by credence in each underlying theory. The transferable move is the same one Butlin-Long apply to consciousness — DO NOT commit to one theory; DO NOT use revenue or patent counts as a behavioral surrogate; assess the functional structure against the multi-theory indicator set."
  - "Moral patienthood at the boundary (composition with lex-vx867): Butlin-Long explicitly note (Executive Summary closing paragraph) that their report 'does not address' the moral and social risks of building conscious AI systems. The multi-theory-indicator-rubric supplies the INPUT to the lex-vx867 orthogonal moral-status assessment: the credence-weighted consciousness rubric feeds the moral-patienthood pole; agency-indicators (like AE-1 in the Butlin-Long table) feed the moral-agency pole. The two atoms compose — this atom assesses the property; lex-vx867 maps property-presence to moral status."
  - "Adoption note (computational functionalism as working hypothesis, NOT metaphysical commitment): Butlin-Long et al. are explicit that they adopt computational functionalism for pragmatic reasons (it makes the question tractable and the methodology applicable), not because it is established. The transferable atom inherits this stance: when applying the multi-theory-indicator-rubric to property X, the background functionalist-style assumption is itself part of the credence aggregation. If you have low credence that consciousness is computational-functional, the rubric's result tells you what credence to have CONDITIONAL on functionalism being true; you adjust by your credence in the background hypothesis."
  - "Operationally distinct from lex-uahgy intentional-stance: lex-uahgy says 'treat the system as a rational agent if the intentional strategy predicts its behavior.' The multi-theory-indicator-rubric explicitly rejects behavioral prediction as adequate for assessing phenomenal consciousness specifically because a system can be intentional-stance-predictable while lacking the underlying functional features the theories require. The two atoms can be used together but on different questions: intentional stance for 'how do we predict its behavior?'; multi-theory-indicator-rubric for 'does it have the functional structure the property requires?'"
  - "Operationally distinct from lex-zag9z cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity: lex-zag9z is about evidence-weighing within a single inference once the hypotheses and evidence are in hand. The multi-theory-indicator-rubric is upstream: it generates the assessment set from multiple theories BEFORE any specific system is assessed. The atoms compose: indicators come from this atom; the diagnosticity-weighing of evidence FOR each indicator can use lex-zag9z."
critical-questions:
  - "Are the theories surveyed actually credible and diverse, or did the rubric collapse to one theory in disguise? The methodology is only as good as the theory survey. If all the theories share a hidden assumption (e.g., all are computational-functionalist, all assume the property is decomposable), the rubric inherits that assumption silently. Check: do the theories disagree on something crucial?"
  - "What is the credence on the background assumption (computational functionalism in the consciousness case)? The rubric's verdict is conditional on the background. A high indicator-score under a background you only credence at 0.3 yields only 0.3-weighted credence in the property. Watch for cases where the rubric's verdict is communicated without the background-credence caveat — that overstates the assessment's authority."
  - "Could the system satisfy the indicators by accident or by training-to-target? Once the indicator list is public, systems can be trained to exhibit indicator-features without the underlying functional structure the theory requires. The rubric is robust against behavioral mimicry but not against indicator-targeting in the structural design. As the rubric becomes standard, the methodology may need supplementing with adversarial-design tests."
  - "Which indicators are necessary vs jointly sufficient? Butlin-Long are explicit that 'each of these indicator properties is said to be necessary for consciousness by one or more theories, and some subsets are said to be jointly sufficient.' The aggregation is not a simple sum; some indicators are necessary-but-not-sufficient under their theory, others are sufficient if jointly present. Naive sum-scoring loses this structure."
  - "What is the transferable claim vs the Butlin-Long-specific claim? Transferable: the multi-theory-indicator-derivation methodology for contested properties of complex systems. Butlin-Long-specific: the computational-functionalism working hypothesis, the specific consciousness theories surveyed (RPT, GWT, HOT, AST, PP), the specific 14 indicator properties, the AI systems assessed. The transferable atom invokes the methodology — not Butlin-Long's specific verdicts."
