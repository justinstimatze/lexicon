id: lex-bn89g
name: name-the-aggressors-own-enablers-as-friends-in-name-but-enemies-in-reality
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "When trying to talk a more powerful party out of a costly, aggressive course of action, don't only argue the costs to yourself -- reframe the people around them who are encouraging the aggression as actually working against the aggressor's own interests, since a threat is easier to defuse by turning its target's suspicion inward than by asking them to spare you out of consideration for your side. Kautilya's script for the weak king's envoy, addressing the stronger aggressor directly: the aggressor 'was being misled by friends in name but enemies in reality,' who were 'promoting the interests of his enemies' and thereby 'risking his wealth and his life.' The envoy is instructed to add a historical warning that kings before him had 'perished because they fell prey to one or other of the six vices... and that the aggressor was in danger of following these kings who had no self-control,' concluding that 'those who advised him to behave rashly... were friends only in name but were really his enemies.' The mechanism doesn't ask the aggressor to trust the weak king's account of the weak king's own interests -- it points the aggressor's own risk-calculus back at people already inside the aggressor's circle, reframing bold advice as a hidden cost to the advice-taker rather than a service to them. This works because an advisor pushing a risky action rarely bears that action's downside symmetrically with the decision-maker, and naming that asymmetry out loud invites the aggressor to re-examine motives they'd otherwise take at face value. Diagnostic move: when someone with power over you is being pushed toward a costly action by people around them, don't just make the case for restraint on your own behalf -- ask aloud, to the decision-maker, who specifically benefits from this action succeeding without bearing its risk if it fails, since exposing that asymmetry reframes 'aggressive advice' as a self-interested move rather than sound counsel."
