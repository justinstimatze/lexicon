id: lex-r8fnk
name: judge-alliance-worth-by-demonstrated-help-not-by-declared-label
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When deciding how much to trust or value a relationship, don't weight the other party's declared status — ally, partner, friend — more heavily than what they have actually, demonstrably done for you, because Kautilya defines the category itself by the behavior rather than the label: 'The real characteristic of friendship is giving help.' He pushes this to its logical, counterintuitive conclusion by explicitly ranking a helpful adversary above an unhelpful nominal ally: 'Even an enemy who helps is fit to be allied with, not an ally who does not act like one.' The label 'ally' is not doing any independent work in this framework — it is only ever a shorthand for a track record of actual assistance, and the moment that track record stops (or never existed beyond the declaration), the label becomes worthless or actively misleading, since it invites continued trust that the underlying behavior no longer supports. The same behavioral-evidence standard is applied in the opposite direction to someone who has already once switched sides: 'Just as living with a snake is living in constant fear, one who has come from the enemy is always a danger' — a demonstrated willingness to defect toward you does not, once used, convert into a demonstrated permanent loyalty; it remains a demonstrated CAPACITY for defection that a change in circumstances could trigger again, regardless of how genuinely a returning defector currently professes loyalty. Both halves of the claim point the same direction: categories like 'ally' and 'enemy' are conclusions to be continuously re-derived from a party's actual pattern of behavior, not fixed labels that, once assigned, can be relied on independent of ongoing evidence. Diagnostic move: when assessing how much weight to give a relationship in a decision, ask what the other party has actually, demonstrably done for you recently, rather than what category they are nominally assigned to — a formally-labeled ally who consistently fails to help should be discounted toward the value of a stranger, and a formally-labeled adversary who consistently helps should be credited accordingly, with the single exception that a party who has ONCE demonstrated a capacity to switch sides carries a permanent evidentiary mark that a party with no such history does not, regardless of their current stated position."
related: [lex-8kn3r, lex-g294v]
evokes: [real-characteristic-of-friendship-is-giving-help, enemy-who-helps-versus-unhelpful-ally, living-with-a-snake-constant-fear, demonstrated-behavior-over-declared-label]
