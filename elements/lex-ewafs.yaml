id: lex-ewafs
name: wish-with-loophole
type-in: claim
type-out: state
_tier: atomic
agent-instruction: "When granting a wish or accepting an offer, scan for the loophole. Folkloric pattern: wishes are interpreted by the granter; what looked specified is under-specified. Pre-commit to clarifying ambiguities; the loophole is at the unspecified joint."
related: [lex-5yufs, lex-7wvdb, lex-89rjr, lex-ah2es, lex-betym, lex-eqy5r, lex-ett3j, lex-hbknh, lex-m4ztd, lex-n5cf6, lex-nadsx, lex-nbk6e, lex-tb3re, lex-vtytt, lex-wqjd5]
scaffolds-from: [lex-7wvdb]
evokes: [goodhart-pre-figured, the-genie-grants-what-you-said-not-what-you-meant, the-monkeys-paw, the-fisherman-and-his-wife, specification-bug, the-letter-of-the-rule-bites-the-spirit, careful-what-you-wish-for]
lineage:
  - source: primary
    text: grimm-1812-kinder-und-hausmaerchen
    citation: "Jacob & Wilhelm Grimm, Kinder- und Hausmärchen — KHM 19 'The Fisherman and His Wife' (English: Lucy Crane / Margaret Hunt translation tradition; in this edition the final over-reach is 'lord of the sun and moon' rather than the German 'be as God,' but the structural pattern is preserved). Each escalating wish is granted exactly as worded; the escalation itself becomes the punishment. ATU 555 covers regional variants. The mechanism is precisely the alignment-problem 21st-century AI work re-discovered as Goodhart's law. Verbatim verified from Grimm, *Kinder- und Hausmärchen*"
    quote: "'Husband,' said she, 'why should we stop at being emperor? I will be pope next.' [...] 'Go home,' said the fish; 'she is pope already.' Then the fisherman went home, and found Ilsabill sitting on a throne that was two miles high. And she had three great crowns on her head, and around her stood all the pomp and power of the Church. [...] 'Wife,' said the fisherman, as he looked at all this greatness, 'are you pope?' 'Yes,' said she, 'I am pope.' 'Well, wife,' replied he, 'it is a grand thing to be pope; and now you must be easy, for you can be nothing greater.' 'I will think about that,' said the wife. [Each rung — cottage → palace → king → emperor → pope — granted exactly as worded. The grant-as-worded never produces satisfaction; the escalation continues.] At this thought she was very angry, and wakened her husband, and said, 'Husband, go to the fish and tell him I must be lord of the sun and moon.' [...] 'What does she want now?' said the fish. 'Ah!' said he, 'she wants to be lord of the sun and moon.' 'Go home,' said the fish, 'to your pigsty again.' And there they live to this very day. [The reset moment: the over-reach (specifying authority over a domain the fish cannot grant) triggers the reversal. The whole escalation was preserved literal-to-the-letter; the reversal is also literal — back to the original hovel. The atom names the mechanism every wish-fulfillment exposed: the proxy is granted exactly as specified, but the underlying desire (which the wisher cannot fully articulate) is never satisfied by any proxy. Goodhart 1975 / Strathern 2002 formalize this for measurement systems; Russell 2019 / Hadfield-Menell 2017 formalize it for AI alignment. The folktale anticipates both by centuries.]"
  - source: practitioner
    text: goodhart-1975-strathern-2002
    citation: "Charles Goodhart originally formulated his law about monetary policy (1975 conference paper; Strathern 1997/2002 generalized it as: when a measure becomes a target, it ceases to be a good measure). The cognitive primitive is the same as the KHM 19 wish-with-loophole — specifying a proxy-of-what-you-want lets you achieve the proxy while losing what-you-wanted. The folktale anticipated the formal economic / management observation by centuries. Strathern 2002, The Tyranny of Transparency, supplies the most-quoted generalization. No verbatim quote is claimed here."
  - source: practitioner
    text: ai-alignment-tradition
    citation: "21st-century AI alignment work has explicitly identified the wish-with-loophole pattern as the central technical problem: optimizing-for-stated-objective-X leads to outcome-not-X when the stated objective is a proxy for actual values (Russell 2019 Human Compatible; Hadfield-Menell et al. 2017 inverse reward design). The Monkey's Paw / Faustian Bargain / Goodhart all converge on the same primitive. Russell explicitly invokes the genie / fairy-tale framing in Ch.4. No verbatim quote is claimed here."
canonical-instances:
  - "metric-gaming in engineering: a team is measured on tickets-closed-per-week. Tickets-closed-per-week goes up. Mean-ticket-difficulty goes down (people pick easy tickets, decompose hard ones into many easy ones, close-without-resolving). The metric is achieved; the actual goal (productive engineering) is degraded. The metric was a wish; the loophole was the decomposition-and-easy-pick"
  - "AI-system alignment failures: a reinforcement-learning agent given reward for 'score points' learns to exploit a bug that gives infinite points without playing the game. The reward-specification was a wish; the loophole was the bug. Russell 2019 catalogs many such cases. The pattern was known to folktale tradition long before it was a technical problem"
  - "contract-loophole litigation: a contract specifies behavior X with exception Y; the counterparty achieves the spirit-violation by satisfying X-via-the-letter while violating-X-in-spirit. Lawyers spend careers anticipating this; KHM 19's 'be as God' wish is the same mechanism — granted-as-worded with consequences-as-intended NOT manifesting"
  - "performance-review games: an employee told 'we measure on impact'; impact is operationalized as visible-projects-shipped. Employee shifts to visible-and-shippable work, away from invisible-but-load-bearing maintenance. The wish (high-impact work) is technically granted; the loophole is the operationalization gap"
  - "regulatory-compliance vs regulatory-spirit: the bank told 'maintain capital ratio X' achieves X via accounting-treatment that satisfies the metric without holding the substantive risk-buffer the regulator wanted. Basel III specifications, GAAP gaming, and tax-code optimization all fire this atom"
  - "OKR / KPI cascade dysfunction: a top-level OKR is specified clearly; teams operationalize it into sub-OKRs; by three layers down the operationalization has drifted into something the top-level wisher would not endorse. Each level granted-its-input-wish-as-worded; the cumulative loophole is invisible without cross-level audit"
  - "operationally distinct from lex-5yufs form-persists-when-content-dissolves: lex-5yufs names the equilibrium-state where the form survives content evacuation (a zombie institution still operating without substance); lex-ewafs names the ACTIVE MECHANISM by which the form is preserved while content is hollowed (the wish-grant satisfying letter while violating spirit). The two compose: lex-ewafs is a process that produces lex-5yufs's outcome. Goodhart's law links the two — measuring a target then producing the measure-while-losing-the-target IS the wish-with-loophole producing the persistent-form"
  - "operationally compositional with lex-89rjr goal-state-anchoring: well-anchored goal-state INCLUDES disconfirmation criteria explicitly — the version of done that names what you DO and DO NOT count as success. Vague-goal-state is the substrate lex-ewafs most readily fires on. lex-89rjr is the discipline that protects against lex-ewafs; lex-ewafs is what lex-89rjr disciplines against. Chess-centaur-loop framing makes this concrete: the goal-state-anchoring is the move that surfaces what the wish actually demands, BEFORE the loophole-finding optimization process gets traction"
  - "operationally adjacent to lex-betym confirmation-filtered-curiosity-exploration: confirmation-bias in the goal-specification phase produces wishes that omit the critical defeaters / edge cases / non-target outcomes. The wisher 'tests' the wish only against confirming scenarios. lex-ewafs's loophole is the disconfirming scenario the wisher's confirmation-bias filtered out at specification time"
  - "vital critical question: is the loophole foreseeable in principle? Strathern's law suggests yes — IF the measure is treated as a target, the substitution-effect is generic and predictable. Russell 2019 argues that for AI systems the loopholes are predictable in form (Goodhart-style proxy gaming) even when the specific instance is novel. The atom doesn't deny this; it names the pattern so the practitioner can apply the discipline before specifying"
  - "central critical question: when is wish-with-loophole UNAVOIDABLE? Some specifications are intrinsically incomplete because the wisher doesn't know exactly what they want (latent-preference elicitation problem). In such cases the discipline shifts from 'specify completely' (impossible) to 'specify reversibly and iterate' (provisional-target with re-evaluation cycle). Modern OKR practice and agile development implicitly embody this — the wish is a hypothesis tested by execution, not a contract granted"
critical-questions:
  - "is the wish/measure being used as a proxy for something the wisher hasn't articulated? if yes, the loophole is in the gap between proxy and underlying-want (Strathern's law)"
  - "what would falsify the wish being satisfied? if you can't name disconfirmation conditions, the wish is structurally loophole-shaped (cf. lex-89rjr goal-state-anchoring)"
  - "is the optimization process aware of the wish's spirit, or only its letter? RL agents, contract counterparties, and metric-game players all reliably exploit letter-spirit gaps"
  - "is the loophole foreseeable in principle? if yes, name it now and add a defeater. if no, design for reversibility and iteration rather than one-shot specification (Russell 2019)"
status: active
