lineage:
  - source: primary
    tradition: cognitive-psychology-of-learning
    text: soderstrom-bjork-2015-learning-versus-performance
    citation: "Nicholas C. Soderstrom and Robert A. Bjork, 'Learning Versus Performance: An Integrative Review,' Perspectives on Psychological Science 10, no. 2 (2015): 176-199. Abstract."
    quote: "The primary goal of instruction should be to facilitate long-term learning—that is, to create relatively permanent changes in comprehension, understanding, and skills of the types that will support long-term retention and transfer. During the instruction or training process, however, what we can observe and measure is performance, which is often an unreliable index of whether the relatively long-term changes that constitute learning have taken place. […] More recently, the converse has also been shown—specifically, that improvements in performance can fail to yield significant learning—and, in fact, that certain manipulations can have opposite effects on learning and performance."
  - source: primary
    tradition: cognitive-psychology-of-learning
    text: soderstrom-bjork-2015-learning-versus-performance
    citation: "Nicholas C. Soderstrom and Robert A. Bjork, 'Learning Versus Performance: An Integrative Review,' Perspectives on Psychological Science 10, no. 2 (2015): 176-199. Introduction (closing framing of the metacognition section)."
    quote: "We then summarize research findings in the domain of metacognition that demonstrate that learners are prone to interpreting performance during acquisition as a valid index of learning, which can lead not only to misassessments of the degree to which learning has happened but also to learners preferring poorer conditions of learning over better conditions of learning."
  - source: primary
    tradition: cognitive-psychology-of-learning
    text: soderstrom-bjork-2015-learning-versus-performance
    citation: "Nicholas C. Soderstrom and Robert A. Bjork, 'Learning Versus Performance: An Integrative Review,' Perspectives on Psychological Science 10, no. 2 (2015): 176-199. Section on the desirable-difficulties framework."
    quote: "Last, the general idea that what can hurt performance can help learning is captured in the desirable difficulties framework (R. A. Bjork, 1994; see also, E. L. Bjork & Bjork, 2011; R. A. Bjork, 2013). Manipulations such as distributed practice, variable practice, and retrieval practice are 'desirable' because they support better long-term retention and transfer compared with their counterpart conditions. Such effective learning manipulations are also 'difficult,' however, in the sense that they can degrade performance during acquisition or training and, consequently, are likely to be interpreted as ineffective by instructors and students."
canonical-instances:
  - Massed vs spaced practice — cramming sessions before an exam produce higher immediate accuracy than the same total study distributed across weeks, but spaced study produces dramatically better retention at delay; ~93% of surveyed students report believing cramming is more effective (Soderstrom & Bjork cite J. McCabe survey data).
  - Retrieval practice / testing effect (Roediger & Karpicke 2006) — taking a quiz on material produces more errors during the quiz than re-reading the same material, but yields stronger retention on a delayed test.
  - Variable practice in motor learning — a basketball player practicing free throws from varied distances performs worse during practice than one practicing from a fixed distance, but transfers better to novel shooting situations.
  - Interleaving across topics (Rohrer & Taylor 2007 on math problem types) — alternating problem types during practice produces more errors than blocking by topic, but improves discrimination and transfer.
  - Disfluency manipulations (Yue/Castel/Bjork 2013 on typeface clarity) — slightly harder-to-read fonts can improve retention by forcing more effortful encoding, despite producing slower reading.
  - Corporate-training satisfaction surveys — massed bootcamps consistently rate higher in immediate-satisfaction surveys than distributed programs, even when long-term skill-retention measurements favor distribution; the felt-experience of the trainee is the very signal that misleads procurement decisions.
  - Software tutorials that 'feel smooth' (heavy hand-holding, copy-paste templates) vs tutorials requiring active retrieval (writing code from scratch with hints) — the latter produces stronger durable understanding despite higher friction during the lesson.
  - The substrate's own encounter-tier system — a tier-1 atom that 'lands cold' is exactly the kind of high-fluency moment that this atom flags as a poor index of whether the agent will durably retain and operationalize the pattern. Recognized as a constitutive tension, not a flaw to fix.
  - Athletic over-rehearsal — a routine practiced past the point of fluency in a controlled setting can become brittle under the variable conditions of competition; the very fluency the athlete relies on as evidence of preparation is the misleading signal.
