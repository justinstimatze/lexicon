id: lex-zrujr
name: compare-whole-functional-patterns-not-isolated-matching-motifs
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "Sanders opens Paul and Palestinian Judaism by diagnosing a standard error in how earlier scholars compared Paul to Judaism: finding the same motif -- a term, a ritual, a phrase -- present in both bodies of literature and treating that presence as proof the two traditions share a meaning. His example is Buchanan, who lists Paul's discussions of baptism alongside Jewish ritual washings under one shared heading, 'without inquiring whether or not baptism actually has the same function in Paul's thought as ritual washings do in Judaism.' Sanders counters that baptism 'has quite a different place in the Pauline pattern of religion from its place in Judaism' -- the word recurs, but the role it plays inside each system's overall structure does not. His corrective method: 'compare an entire religion, parts and all, with an entire religion, parts and all; to use the analogy of a building, to compare two buildings, not leaving out of account their individual bricks.' The unit of comparison has to be the whole functional pattern -- how a system's parts connect its starting point to its end point -- not any single element pulled out and matched against its lookalike in the other system. The transferable mechanism: whenever two systems (religions, legal codes, organizational structures, software APIs, competing theories) share a term or a component, that shared label is not evidence the component does the same work in both. A word or module can carry real structural weight in one system and sit peripheral in the other, or carry weight there for an entirely different purpose than it serves at home. Before treating a shared motif as grounds for equating two systems, map where that motif sits within each system's own internal structure -- what it connects to, what depends on it, what happens if it's removed -- and only then compare the two maps against each other."
