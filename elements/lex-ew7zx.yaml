id: lex-ew7zx
name: explicit-state-as-object-replaces-conditional-spaghetti
type-in: situation
type-out: structure
_tier: atomic
agent-instruction: "When 'if state == X / else if Y / else if Z' is sprawling, surface the State pattern — make state an object, dispatch through it; conditional spaghetti becomes class-per-state with explicit transitions."
related: [lex-9akfh, lex-9nj6a, lex-dwycr, lex-p25q4, lex-hsnup, lex-urwym]
scaffolds-from: [lex-9akfh, lex-9nj6a, lex-dwycr]
evokes: [gof-state-pattern, finite-state-machine, fsm, state-as-first-class-construct, modes-explicit, make-the-modes-explicit, no-conditional-spaghetti]
lineage:
  - source: practitioner
    text: wikipedia-state-pattern-2025-12
    citation: "Wikipedia 'State pattern' article, accessed 2026-05-30 from wikipedia_en_all_nopic_2025-12.zim (local ZIM mirror; canonical URL en.wikipedia.org/wiki/State_pattern). The underlying primary is Gamma, Helm, Johnson, Vlissides 1994 *Design Patterns* (Addison-Wesley, p.395). The substrate-claim: when an object's behavior depends on which of several MODES it's in, make each mode an explicit object (a State-object) and let the host-object delegate to the current State-object; state transitions become explicit state-object swaps rather than scattered conditionals. The transferable shape is MAKE-THE-MODES-EXPLICIT: when behavior branches on state, the alternative to a sea of `if (state == X)` conditionals is to reify each state as a first-class entity that owns its own behavior. The State design pattern is one OO instantiation; finite-state-machines are the broader formal abstraction; protocol-state-machines (TCP states, lifecycle objects) instantiate the same substrate."
    quote: "[Wikipedia 'State pattern', 2025-12 ZIM snapshot:] 'The state pattern is a behavioral software design pattern that allows an object to alter its behavior when its internal state changes. This pattern is close to the concept of finite-state machines. The state pattern can be interpreted as a strategy pattern, which is able to switch a strategy through invocations of methods defined in the pattern's interface.' [On the problem it solves:] 'The state pattern is used in computer programming to encapsulate varying behavior for the same object, based on its internal state. This can be a cleaner way for an object to change its behavior at runtime without resorting to conditional statements and thus improve maintainability.' [On the two main problems:] 'An object should change its behavior when its internal state changes. State-specific behavior should be defined independently.' [The substrate-claim is the REIFICATION OF STATES — each mode-of-behavior becomes its own object; the host delegates to the current state-object; transitions become object-swaps. The maintainability win is that adding a new state or modifying existing-state behavior is local (one State-class) rather than scattered (every conditional that branches on state). One of the 23 GoF behavioral patterns (Gamma-Helm-Johnson-Vlissides 1994 p.395).]"
canonical-instances:
  - "TCP connection state machine: CLOSED → LISTEN → SYN_SENT → ESTABLISHED → FIN_WAIT_1 → CLOSED. Each state has different valid transitions and different message-handling. Implemented as explicit states rather than nested conditionals."
  - "Order lifecycle: pending → confirmed → shipped → delivered → returned/refunded. Each state allows different actions and triggers different events. State-object encapsulation prevents the order class from being one giant switch."
  - "Vending machine: idle → coin-inserted → product-selected → dispensing → returning-change. Each state defines which buttons are valid, what cancellation does, what the display shows."
  - "UI workflow steps: form-empty → field-A-filled → validation-pending → ready-to-submit → submitting → submitted/error. Each step has different valid user actions and different visual treatments."
  - "Game character states: idle → walking → running → jumping → falling → landing. Each state has different physics, different animations, different valid input handling."
  - "Document lifecycle: draft → in-review → approved → published → archived. Each state has different valid edit-actions and visibility rules."
  - "operationally distinct from lex-dwycr strategy-pattern (per Wikipedia: 'state pattern can be interpreted as a strategy pattern'): strategy selects WHICH algorithm to use NOW; state pattern's state-object IS the current behavior and the host's identity persists across state transitions. The host knows it's stateful; the strategy-Context just delegates without state-history. The DIFFERENCE: state pattern includes the TRANSITION-LOGIC (where to go next); strategy pattern is stateless dispatch."
  - "operationally distinct from lex-9akfh decoupling-via-indirection: lex-9akfh names the broad design-rule; lex-ew7zx is the specific operational case where the indirection is STATE-AS-OBJECT and the host's behavior comes from delegation to the current state. The reification of state is what enables explicit-transitions and maintainability."
  - "operationally distinct from lex-9nj6a composition-over-inheritance: lex-9nj6a is the meta-rule; lex-ew7zx is the specific case where composition is over state-mode objects rather than over feature-mixins."
  - "compose-related with lex-p25q4 command-pattern: state-transitions can be triggered by commands (an OrderConfirmedCommand transitions the order from pending → confirmed); the state-pattern handles HOW each command is processed in each state. Event-sourcing systems compose state-pattern (current-state-fold) with command-pattern (replayable action-log)."
  - "the BROADER substrate-claim — finite-state-machines: state pattern is one OO realization; FSMs as formal abstractions (deterministic-FSA, nondeterministic-FSA, pushdown-automata, Turing-machines) generalize. Regex engines, parsers (LR/LALR), protocol-verifiers, hardware-controllers, and string-matchers are all FSM instances. The substrate-claim — make-the-modes-explicit-as-states — applies wherever a system has discrete mode-of-operation."
critical-questions:
  - "when is the state pattern overkill? Two states (boolean flag) with simple behavior-difference is over-engineered as State objects. State pattern pays off when (a) ≥3 states, (b) per-state behavior is complex (multiple methods diverge), (c) transitions form a non-trivial graph. For binary or trivial state, conditional is simpler and clearer."
  - "where does transition-logic live? In the host (host knows where to go next from each state-event combination)? In the state-object (each state decides its own transitions)? Or in a separate Transition table (data-driven dispatch)? Each has trade-offs: host-centralizes makes the graph visible; state-decentralizes simplifies the host; table-driven supports dynamic reconfiguration but is opaque to static analysis. Practitioner-discipline: pick one approach and document it for the codebase."
  - "what about invalid transitions? A request that's not valid in the current state — should the state-object throw, return an error, or be silently no-op? Practitioner-discipline: specify invalid-transition policy at the state-machine level; consistency matters more than which choice."
  - "does the substrate-claim require object-orientation? No — Erlang's gen_statem, F#/Rust enum-based state-machines, Statecharts (Harel), Stateflow, XState (JavaScript), tagged-union types in functional languages, and even Prolog-style declarative-state are all instantiations of make-the-modes-explicit. The substrate-claim is reification-of-modes; the State design pattern is one OO realization."
  - "Statecharts (Harel 1987) extend the basic finite-state-machine with hierarchy (states-within-states), orthogonality (concurrent state regions), and history (resume-where-you-left-off). Substrate-relevant: the EXTENSION is still the same primitive (modes-as-explicit) but at higher composition complexity."
