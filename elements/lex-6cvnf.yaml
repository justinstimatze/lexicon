id: lex-6cvnf
name: first-effective-possession-confers-title-to-unowned-things
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When claiming title to an unowned thing, surface that first-effective-possession (real use + exclusion + visibility) — not first sighting, not first claim — is the central operation; performative claim without possession is rarely upheld."
related: [lex-avv9k, lex-cmkdq, lex-mwgep, lex-uhc3j]
scaffolds-from: [lex-avv9k]
evokes: [finders-keepers, first-come-first-served, res-nullius, occupation, possession-requires-control-not-pursuit, lose-control-lose-claim, homesteading, prior-appropriation, first-to-file, rule-of-capture, squatters-rights, capture-and-hold]
lineage:
  - source: primary
    text: justinian-institutes-book-ii-title-i-occupation
    citation: "*The Institutes of Justinian*, trans. J. B. Moyle (5th ed., Oxford 1913)., Book II, Title I 'Of the different kinds of Things', §§12-22 (lines 1638-1732). The doctrine of OCCUPATIO (acquisition by occupation / first-possession), a title of the law of nations (ius gentium) and the oldest mode of acquiring ownership: 'natural reason admits the title of the first occupant to that which previously had no owner.' Wild animals, birds, and fish become the captor's property as soon as caught — but only WHILE under effective control: 'so soon as it has escaped from your control, and recovered its natural liberty, it ceases to be yours, and belongs to the first person who subsequently catches it.' Two sharp refinements: (1) the wounded-animal debate — mere pursuit or wounding does NOT confer title; Justinian confirms 'it does not belong to you till you have actually caught it, for it may happen in many ways that you will not capture it' (completed control, not attempt, is required); (2) animus revertendi — tamed-wild animals (bees, peafowl, deer) remain yours only so long as they retain 'the intent to return.' The same first-occupant rule covers gems found on the seashore (to the finder) and a newly-risen sea-island (to the first occupant, 'for, until occupied, it is held to belong to no one'). The transferable primitive: an unowned (res nullius) resource becomes the property of the first party to establish EFFECTIVE control of it, and the title persists only while control is maintained — relinquished/lost control reverts the thing to unowned. PD globally (Justinian text ancient; Moyle translation 1913, pre-1929)."
    quote: "[Justinian Institutes II.1.12, Moyle trans. lines 1641-1650]: 'natural reason admits the title of the first occupant to that which previously had no owner... An animal thus caught by you is deemed your property so long as it is completely under your control; but so soon as it has escaped from your control, and recovered its natural liberty, it ceases to be yours, and belongs to the first person who subsequently catches it.' [II.1.13, lines 1659-1661, the pursuit-is-not-possession rule]: 'others have been of opinion that it does not belong to you till you have actually caught it. And we confirm this latter view, for it may happen in many ways that you will not capture it.'"
  - source: practitioner
    text: brown-1991-human-universals
    citation: "Donald E. Brown, *Human Universals* (McGraw-Hill 1991; Temple University Press 2017 reissue). (in-copyright). Brown 1991 establishes that PROPERTY — the concept of things-belonging-to-someone, distinguishable from things-belonging-to-others, with rules for inheritance — is a human universal in the strong sense: not merely a Western or Roman legal construction but a feature of every documented society. This is what graduates lex-6cvnf's underlying claim from 'a Roman legal doctrine' to 'the formalized Roman expression of a universal cognitive-social primitive about original acquisition.' Brown grounds the universality across three places in the book: (i) Ch.2 on universalistic frameworks endorses Appell 1973's analysis of social structure 'in terms of the property relations that define and relate social statuses of all kinds. The validity of this kind of a framework rests upon the universality of its starting points: Appell's framework rests upon the universality of social statuses and property'; (ii) Ch.4 reproduces Wissler's 1923 'Universal Pattern' which lists 'VII. Property: A. Real and personal; B. Standards of value and exchange; C. Trade' among the nine universal-pattern categories; (iii) Ch.6 'The Universal People' description explicitly: 'the UP have concepts of property, distinguishing what belongs—minimal though it may be—to the individual, or group, from what belongs to others. They also have rules for the inheritance of property.' Brown's 'universal of classification' framing matters: property exists EVERYWHERE (universal) but the specific rules for original acquisition VARY across cultures (variable content). lex-6cvnf names the specific Justinian/occupatio rule — first effective taking, control-conditional, completion-not-pursuit — but Brown's substrate makes clear that the underlying *something must rule original acquisition* is universal, with occupatio and labor-mixing as competing culturally-attested fills for the slot."
    quote: "[Brown 1991 *Human Universals* Ch.2 'Conceptualizing, Defining, and Demonstrating Universals', endorsing Appell''s property-based framework:] 'The features of a universalistic framework are discussed by G. N. Appell (1973), who has developed one for the analysis of social structure in terms of the property relations that define and relate social statuses of all kinds. The validity of this kind of a framework rests upon the universality of its starting points: Appell''s framework rests upon the universality of social statuses and property.' [Ch.3 reproducing Wissler''s 1923 ''Universal Pattern'' with property as one of nine top-level categories:] 'VII. Property / A. Real and personal / B. Standards of value and exchange / C. Trade.' [Ch.6 ''The Universal People'' on property as a UP feature:] 'However spiritual they may be, the UP are materialists also. As indicated by their language having the possessive for use on \"loose property,\" the UP have concepts of property, distinguishing what belongs—minimal though it may be—to the individual, or group, from what belongs to others. They also have rules for the inheritance of property.' [Brown''s UP-language description ties property into mandatory grammatical marking — the possessive — across all languages:] 'Two final points about UP grammar are that it contains nouns and verbs, and the possessive. The latter is used both for what have been called the \"intimate\" or \"inalienable\" possessions, i.e., to talk about their fingers, your hands, and her thoughts, and for \"loose\" or \"alienable\" possessions too, e.g., my axe.' [The transferable inference for lex-6cvnf: the slot ''rule for original acquisition of unowned things'' is itself universal (every documented people has SOME rule); occupatio (Justinian/Roman, first-effective-possession) is one historically-attested filling of the slot; Lockean labor-mixing is the rival filling; the rule-of-capture pathology and modern transfers (concurrency locks, namespace registration, prior-appropriation water rights) are all variations on the occupatio filling. Brown''s universality-of-property finding makes lex-6cvnf''s underlying claim cross-cultural rather than parochial-Roman.]"
canonical-instances:
  - "Wild-animals canonical case (Justinian II.1.12, lines 1638-1652): creatures of land, sea, and sky become the captor's property on capture 'by the law of nations,' because 'natural reason admits the title of the first occupant to that which previously had no owner.' Crucially the title is control-conditional: an escaped animal that recovers its natural liberty 'ceases to be yours, and belongs to the first person who subsequently catches it.' Marker: title tracks effective control, not a one-time act."
  - "Pursuit-is-not-possession canonical case (Justinian II.1.13, lines 1654-1661): the settled rule that wounding or pursuing a wild animal does NOT make it yours — 'it does not belong to you till you have actually caught it, for it may happen in many ways that you will not capture it.' The sharp practitioner point: intent, effort, and near-capture confer no title; only COMPLETED control does. (The famous common-law echo is Pierson v. Post, 1805.)"
  - "Animus revertendi canonical case (Justinian II.1.14-15, lines 1663-1684): bees, peafowl, pigeons, and tame deer that habitually leave and return remain yours only 'so long as they have the intent to return'; lose the habit and they revert to res nullius for the next taker. Marker: for things that come and go, the title is sustained by a continuing disposition (here, the animal's; by analogy, the holder's continued assertion of control), not by the original taking alone."
  - "Found-things and new-island canonical cases (Justinian II.1.18, 22, lines 1698-1699, 1716-1718): gems found on the seashore become the finder's by natural law; a sea-island that rises 'belongs to the first occupant, for, until occupied, it is held to belong to no one.' The same first-occupant principle generalizes from captured creatures to any previously-unowned thing."
  - "Concurrency-lock transfer instance: a lock/lease is acquired by taking control and held only while maintained; on release or crash the resource reverts to res nullius and goes to the next acquirer — an exact structural match to Justinian's escaped-animal rule, which is why robust systems use leases with heartbeats (formalizing 'control must be maintained') rather than one-shot acquisition. Domain-name/handle/spectrum 'first-to-register', first-to-file patents, prior-appropriation water rights ('first in time, first in right'), 19th-century homesteading, and squatter's rights/adverse possession are all the same primitive in different dress."
  - "operationally distinct from lex-avv9k rights-decompose-into-four-jural-relations: lex-avv9k dissects the internal structure of a right once held; lex-6cvnf is the upstream rule conferring the right in the first place (acquisition vs anatomy)."
  - "operationally distinct from lex-cmkdq / Lockean labor-mixing: occupation confers title by first effective TAKING; the labor theory confers it by WORKING the thing. They are rival theories of original acquisition; Justinian's specification doctrine (a new object from another's materials) is where the two collide."
critical-questions:
  - "isn't this just 'finders keepers'? It is the formalized rule beneath that slogan, with two non-obvious clauses: (1) pursuit/intent/near-capture confer NO title — only completed, effective control does (the wounded-animal rule); and (2) the title is control-conditional — relinquished or lost control reverts the thing to unowned for the next taker (the escaped-animal rule). 'Finders keepers' omits both the completion requirement and the maintenance requirement."
  - "when does first-possession fail as an allocation rule? It rewards capture-CAPACITY over need, desert, or labor, and — applied to a common-pool resource (the 'rule of capture' in oil, groundwater, fisheries) — it incentivizes a wasteful race-to-capture that drives over-extraction (a tragedy-of-the-commons engine). It is efficient for genuinely unowned, non-rival, or abundant things and pathological for shared fugitive resources, which is why those are later removed from pure first-possession by regulation or quota."
  - "how does it transfer to software and digital resources? Concurrency locks/leases (acquire = take control; held only while maintained; release/crash → available to the next acquirer — the escaped-animal rule exactly), namespace/domain/handle registration ('first to claim'), spectrum allocation, and attention/market capture. The 'control must be maintained' clause maps to leases-with-heartbeats; the 'completed capture not pursuit' clause maps to atomic acquisition (a half-acquired lock confers nothing)."
  - "how does it relate to the labor theory of acquisition? Occupation (first effective taking) and Lockean labor-mixing (you own what you mix your labor with) are the two classical rival accounts of how unowned things first become property. Justinian's separate doctrine of specification — when a man makes a new object from another's materials — is the Roman locus where the taking-vs-making question is fought out. lex-cmkdq (Marx's labor-objectification) sits downstream of the labor side."
  - "where does it compose? lex-6cvnf + lex-avv9k: occupation confers a property right whose internal jural structure Hohfeld then decomposes (acquisition → anatomy). lex-6cvnf + lex-mwgep: first-possession is a first-mover allocation, so it seeds path-dependent lock-in (who got there first keeps compounding). lex-6cvnf + lex-cmkdq: the rival labor theory of acquisition. It anchors the substrate's previously-absent property/ownership region."
status: active
