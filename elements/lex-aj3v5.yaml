canonical-instances:
  - "An artisan chooses to produce a steady line of moderately priced items with a large, reliable customer base rather than a small number of museum-quality pieces that command a much higher price but only sell to a handful of collectors found after months of searching -- the moderately priced line converts to actual income every week, while the high-value pieces can sit unsold for a year even though each one, on paper, is worth far more."
  - "A company chooses to build its business around a broad base of small recurring customers rather than chase a few large enterprise contracts that offer much bigger individual deal sizes but take a long, uncertain sales cycle to close, having learned that the enterprise pipeline's theoretical total value routinely fails to convert into cash on any predictable schedule."
critical-questions:
  - "does this principle hold when the high-value, rare-buyer option, once realized, provides so much value in a single transaction that it outweighs a long period of accumulated small transactions -- is there a threshold of scarcity and value at which the rare-buyer strategy becomes correct despite the search cost?"
  - "how would a decision-maker actually estimate, in advance, how long a search for a rare buyer will take and how much that search costs, given that the whole argument depends on that hidden cost being large enough to offset the nominal value gap -- without a real estimate, does the comparison just become a preference for whichever option feels safer?"
  - "does pursuing broad, steady, lower-value demand risk crowding a market and driving down the very price stability that makes it attractive, especially if many competitors reach the same conclusion and chase the same steady-demand opportunity that the rare high-value option was specifically avoiding?"
