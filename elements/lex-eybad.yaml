evokes: [whole-is-more-than-the-sum-of-parts, joint-effect-not-the-sum-of-separate-effects, emergence, cant-predict-the-compound-from-the-elements, water-is-not-hydrogen-plus-oxygen, superposition-holds-or-it-doesnt, decompose-or-treat-as-irreducible, new-laws-appear-at-the-higher-level, interaction-effects-not-additive, reductionism-has-a-boundary]
lineage:
  - source: primary
    text: mill-1843-book-iii-ch-vi-composition-of-causes
    citation: "John Stuart Mill, *A System of Logic, Ratiocinative and Inductive* (1843; final 8th ed. 1872). (Project Gutenberg #27942). Book III Ch.VI 'On The Composition Of Causes', §§1-2 (lines 13149-13373). Mill draws a distinction he calls 'so radical, and of so much importance, as to require a chapter to itself': two modes of the conjunct action of causes. (i) MECHANICAL / 'Composition of Causes' proper: the joint effect of several causes is identical with the sum of their separate effects — each cause continues to obey its own law in combination, so the whole is computable a priori from the parts (Mill's paradigm: the composition of forces — a body pushed north and east arrives exactly where the two forces would separately have carried it). This is why mechanics is a deductive science. (ii) HETEROPATHIC: the agencies brought together 'cease entirely, and a totally different set of phenomena arise' — the joint effect is heterogeneous to, not the sum of, the separate effects. His cases: chemical combination (water shows 'not a trace of the properties of hydrogen or of oxygen'); and, more strongly, the 'laws of life' in organized bodies (no summing of the separate actions of a tongue's chemical constituents yields tasting). Mill's deep principle: 'no elementary fact can be in the conclusion which was not in the premises' — emergence is precisely the appearance of facts not in the separate premises. He names the emergent regularities 'heteropathic laws.' Crucial nuance (§2): heteropathic laws are NOT forever-undeducible — they may themselves be composed, and constant relations (Dalton's law of definite proportions; Berthollet) can let us derive compound-properties from element-properties by a fixed principle; emergence means new laws are needed at the higher level, not that the higher level is lawless. PD globally (Mill d.1873)."
    quote: "[Mill 1843 Book III Ch.VI §1 lines 13186-13191]: 'This law of nature is called, in dynamics, the principle of the Composition of Forces; and in imitation of that well-chosen expression, I shall give the name of the Composition of Causes to the principle which is exemplified in all cases in which the joint effect of several causes is identical with the sum of their separate effects.' [Mill Book III Ch.VI §1, lines 13197-13198, on the heteropathic case]: 'Not a trace of the properties of hydrogen or of oxygen is observable in those of their compound, water.' [Mill Book III Ch.VI §1, lines 13230-13233, the deep principle]: 'from no knowledge of the properties of those substances could we ever predict that it could taste, unless gelatine or fibrine could themselves taste; for no elementary fact can be in the conclusion which was not in the premises.' [Mill Book III Ch.VI §2, lines 13275-13281]: 'This difference between the case in which the joint effect of causes is the sum of their separate effects, and the case in which it is heterogeneous to them—between laws which work together without alteration, and laws which, when called upon to work together, cease and give place to others—is one of the fundamental distinctions in nature.'"
canonical-instances:
  - "Composition-of-forces canonical case (Mill Book III Ch.VI §1, lines 13181-13191): a body propelled north by one force and east by another arrives exactly where the two forces would separately have carried it — the joint effect is the vector sum of the separate effects. This is Mill's paradigm of MECHANICAL composition and the reason mechanics is a deductive science: causes retain their separate laws in combination, so the whole is computable a priori from the parts. Practitioner-marker: superposition holds → decompose freely (lex-spk4s licensed)."
  - "Water / chemical-combination canonical case (Mill Book III Ch.VI §1, lines 13193-13213): the compound water exhibits 'not a trace of the properties of hydrogen or of oxygen'; sugar-of-lead's taste is not the sum of acetic-acid's and lead's tastes. The separate-agent uniformities 'cease altogether when they are conjoined', and (in the present state of knowledge) the result cannot be foreseen 'until we have tried the specific experiment.' This is why chemistry, unlike mechanics, was not a deductive science. Marker: a qualitatively-new property appears at combination → heteropathic → cannot predict from summed parts."
  - "Laws-of-life canonical case (Mill Book III Ch.VI §1, lines 13215-13233): organized bodies are built from the same parts as inorganic nature, yet the phenomena of life 'bear no analogy' to the effects of the components as mere physical agents. The tongue is gelatine, fibrine, etc., but 'from no knowledge of the properties of those substances could we ever predict that it could taste' — because 'no elementary fact can be in the conclusion which was not in the premises.' Mill's strongest heteropathic case: vital properties as emergent over the same matter."
  - "Heteropathic-laws-are-still-derivable nuance (Mill Book III Ch.VI §2, lines 13304-13362): Mill insists emergence is not permanent mystery. Heteropathic laws can be composed with one another, and constant relations (Dalton's law of definite proportions; Berthollet's decomposition rule; isomorphism) may let compound-properties be derived from element-properties 'according to a fixed principle.' The practitioner-payload: 'emergent' means new laws are needed AT THE HIGHER LEVEL, not that the higher level is lawless or forever-unpredictable. Guards against using the atom as an excuse to stop inquiry."
  - "Post-Mill emergence-science instances: G.H. Lewes 1875 coins 'emergent' (vs 'resultant') explicitly building on Mill's heteropathic/homopathic distinction; British Emergentism (Alexander 1920, Morgan 1923, Broad 1925) systematizes it; statistical mechanics (temperature and pressure are collective variables with no single-molecule analogue); Anderson 1972 'More Is Different' (symmetry-breaking phase transitions yield laws not obtained by scaling up the micro-laws); nonlinear dynamics generally (where superposition — the signature of mechanical composition — fails). Each is a domain re-confirmation of Mill's distinction. Contemporary practitioner-translation: in modelling, ask whether effects are additive (linear/independent terms — decompose and sum) or interaction-dominated/non-linear (model the joint regime directly)."
  - "operationally distinct from lex-spk4s isolate-component-for-separate-treatment: lex-spk4s is the decomposition MOVE (extract a part, name and treat it separately); lex-eybad is the BOUNDARY on when that move preserves the whole. Under mechanical composition the isolated parts re-sum to the whole (lex-spk4s safe); under heteropathic composition the parts do not re-assemble and you must model at the emergent level. The atoms are complementary: do lex-spk4s, but gate it on lex-eybad's discriminator first."
  - "operationally distinct from lex-rfxtb multifactorial-frame: lex-rfxtb asserts THAT many causes contribute (resisting single-cause explanation); lex-eybad asks HOW they combine — additively (sum) or heteropathically (emergent). A multifactorial account can be either mode. lex-rfxtb widens the cause-set; lex-eybad characterizes the combination-rule over that set."
critical-questions:
  - "how do you tell mechanical from heteropathic composition in practice? Test superposition: does the joint effect equal the sum (or signed sum) of the separate effects measured alone? If yes, composition is mechanical — decompose and add. If the conjunction produces a qualitatively new property the separates lack (a phase change, a vital function, an interaction term that dominates), it is heteropathic. When untested, treat the mode as OPEN rather than assuming additivity — assuming mechanical composition is the common default error in modelling complex systems."
  - "does 'heteropathic / emergent' mean forever-unpredictable? No — this is Mill's own guard (§2). Heteropathic laws can themselves be lawful and composable; constant relations (Dalton, Berthollet) can connect compound-properties to element-properties by a fixed principle. 'Emergent' means new laws are required at the higher level, not that the higher level is mysterious or that inquiry should stop. Using the atom to license 'it's emergent, so we can't analyze it' is a misuse."
  - "what's the practitioner-actionable upshot? Before decomposing a system into parts you intend to sum (lex-spk4s), classify the composition: mechanical → decompose freely and predict deductively; heteropathic → the whole has its own laws, so model at that level and expect that summed-parts predictions will fail. The single most useful question: 'if I measured each cause alone and added the results, would I get the joint outcome?' If you can't answer yes with evidence, do not assume additivity."
  - "where does this sit relative to the Mill causal cluster? lex-eybad (Book III Ch.VI) is the COMBINATION-RULE primitive; lex-v6nqz (Book III Ch.VIII, method of difference) and lex-qkrey (concomitant variations) are the ISOLATION methods that presuppose, in the typical case, that a cause's contribution can be separated out — which holds cleanly only under mechanical composition. Under heteropathy the eliminative methods can mislead (a cause's 'contribution' is not separable). The Mill-internal pairing: Ch.VI says whether causes can be added; Ch.VIII says how to isolate one when they can."
  - "how does it compose with other atoms? lex-eybad + lex-spk4s: gate the decompose-and-treat-separately move on the additivity check. lex-eybad + lex-rfxtb: once you know many causes act, ask whether they sum or interact. lex-eybad + lex-v6nqz/0343: the eliminative-causal methods carry a hidden additivity assumption that lex-eybad surfaces. The atom is the substrate's anchor for emergence / levels-of-description / limits-of-reductionism arguments, which were previously uncovered."
