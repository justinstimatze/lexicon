id: lex-vy8nz
name: an-unexplained-swing-between-meekness-and-defiance-signals-hidden-guilt
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A pattern of anticipatory appeasement on some days and ordinary assertiveness on others, with no apparent external cause, can itself be the diagnostic signal that guilt over an unrelated transgression is driving the mood. The swing itself is the tell, regardless of whatever excuse gets offered on either kind of day. In the Jataka's tale of the puzzled pupil, a teacher explains that a person's meekness on certain days and stiff-necked insubordination on others tracks exactly with whether they transgressed that day, with the appeasement behavior itself functioning as the evidence regardless of what excuse is offered. The behavioral swing is legible before any confession, because guilt produces anticipatory softening that a clean conscience has no reason to perform."
related: []
evokes: [jataka, ekanipata, durajana-jataka, behavioral-swing-as-a-guilt-tell, anticipatory-appeasement-signals-transgression]
lineage:
  - source: primary
    text: jataka-chalmers1895-durajana-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. I, trans. Robert Chalmers, ed. E.B. Cowell (Cambridge University Press, 1895), Book I (Ekanipata), No. 64, Durajana-jataka (restated as No. 65, Anabhirati-jataka). Verified verbatim against a direct extraction of the held copy."
    quote: "\"on days when they have done wrong, women humble themselves before their husbands and become as meek and submissive as a Slave-girl; but on days when they have not done wrong, then they become stiff-necked and insubordinate to their lords.\""
canonical-instances:
  - "A manager notices that a direct report is unusually accommodating and quick to agree on some days, and unusually combative over trivial requests on others, with no obvious external trigger either way — and eventually realizes the accommodating days always follow instances of the report quietly missing a deadline they haven't disclosed."
critical-questions:
  - "How does an observer rule out simpler explanations for a mood swing, like unrelated stress or fatigue, before treating it confidently as a guilt signal specifically?"
  - "Does naming the pattern out loud change it — does someone who realizes their appeasement behavior has been read as a tell start suppressing it, making the signal less reliable going forward?"
status: active
