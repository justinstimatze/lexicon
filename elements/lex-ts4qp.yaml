id: lex-ts4qp
name: diairesis-recursive-definitional-bisection
type-in: question
type-out: process
_tier: atomic
agent-instruction: "When defining a complex concept, surface diairesis (Platonic recursive bisection) — split into parts, then split a part, until the target is uniquely identified by its place in the tree; useful for taxonomy, not only definition."
related: [lex-89rjr, lex-spk4s, lex-da3g3, lex-rfxtb, lex-a5dmb, lex-qfwuf, lex-zu836]
evokes: [walk-down-the-binary-tree-to-the-definition, recursive-class-bisection, every-step-is-a-this-or-not-this, the-angler-method, define-by-narrowing]
lineage:
  - source: primary
    text: plato-sophist-statesman-phaedrus-diairesis
    citation: "Plato, Sophist 218e-221c (the canonical 'angler' diairesis); Statesman (recursive division to define the statesman); Phaedrus 265e-266c (Socrates names the method as 'division and collection'). Jowett translation in 2026-05-21. The transferable primitive: to DEFINE a thing whose definition is initially unclear, recursively bisect a higher genus into two species at each step, following the branch the target belongs to, until the branches are narrow enough to constitute the definition. The Sophist's angler example walks: art → acquisitive (vs productive) → conquest (vs exchange) → craft (vs force) → hunting (animate, then water, then with-hook). The angler is then DEFINED as the practitioner of the path. The method assumes (a) the genus is partitionable into mutually-exclusive species and (b) the target's branch-path is determinate. When both assumptions hold, recursive bisection produces a constructive definition by walking the path. Modern stripped-of-metaphysics version: binary-decision-tree taxonomy."
    quote: "[Jowett's Analysis of the Sophist, summarising 218e-221c:] 'In the first place, the angler is an artist; and there are two kinds of art — productive art, which includes husbandry, manufactures, imitations; and acquisitive art, which includes learning, trading, fighting, hunting. The angler's is an acquisitive art, and acquisition may be effected either by exchange or by conquest; in the latter case, either by force or craft. Conquest by craft is called hunting, and of hunting there is one kind which pursues inanimate, and another which pursues animate objects; and animate objects may be either land animals or water animals, and water animals either fly over the water or live in the water. The hunting of the last is called fishing; and of fishing, one kind uses enclosures, catching the fish in nets and baskets, and another kind strikes them either with spears by night or with barbed spears or barbed hooks by day; the barbed spears are impelled from above, the barbed hooks are jerked into the head and lips of the fish, which are then drawn from below upwards. Thus, by a series of divisions, we have arrived at the definition of the angler's art.' [The canonical diairesis worked example. Note (a) every step is binary; (b) the target's branch is the one followed; (c) the definition is the PATH through the tree, not a single property; (d) the chosen example (angler) is deliberately humble — to demonstrate the method on something easy before deploying on the Sophist where the stakes are higher.]"
  - source: practitioner
    text: aristotle-rejection-and-modern-classification
    citation: "Aristotle (Posterior Analytics II 13; Parts of Animals I 2-3) explicitly criticizes diairesis as insufficient — single binary partitioning misses joint-determination of species by multiple characteristics. But the criticism IS a refinement: where Plato bisects on one criterion at a time, Aristotle proposes multi-criterion classification. Modern descendants: (a) decision trees in machine learning (CART, ID3, C4.5) — recursive binary partitioning over feature space; (b) phylogenetic classification (Linnaean taxonomy + cladistics) — the historical modern form of biological diairesis, with Aristotle's joint-criterion improvement; (c) ICD-10 medical diagnostic codes — recursive hierarchical bisection of disease space; (d) binary search algorithms — diairesis on ORDERED sets where the bisection criterion is value-comparison; (e) dichotomous keys in field biology — explicit diairesis tooling for species identification."
    quote: "[Aristotle's critique of Plato's diairesis is itself a refinement: multi-criterion species-determination supersedes single-criterion. Modern ML decision-trees, dichotomous taxonomic keys, and binary-search algorithms are the unbroken descendants of the technique.]"
canonical-instances:
  - "machine-learning decision trees (CART, ID3, C4.5): at each tree node, choose a feature and a threshold that splits the data into two subsets; recurse on each subset until a stopping criterion fires. The leaves are the (constructive) definitions of the classes. Modern diairesis with information-gain as the bisection criterion"
  - "Linnaean taxonomy + dichotomous keys: a field guide to identify a species walks the user down a binary tree ('does it have feathers? yes → next page, no → next other page'). At each step, the answer narrows the candidate species; at the leaf, the species is identified. The dichotomous-key form is explicit diairesis institutionalized into field biology"
  - "binary search: on an ordered set, repeatedly bisect on the value-comparison criterion until the target is located. The algorithm's correctness depends on the ordering being total (Aristotle's criticism: when the criterion isn't single, naive diairesis fails). The O(log n) efficiency is the gain from the bisection structure"
  - "diagnostic medicine (ICD-10 hierarchy + clinical decision trees): from chief complaint, walk down a branching decision-tree of questions/tests to converge on a diagnosis. Each step bisects (or narrows) the remaining diagnostic possibility space. The diagnostic interview IS a diairesis on the disease space"
  - "Plato Sophist 232-236 (the actual application): the angler diairesis was the WARM-UP. Plato then runs diairesis on the SOPHIST (the dialogue's actual target), arriving at 'paid hunter of rich young men' as the constructed definition. The fact that the construction passes by 'hunter' through the same node the angler passed through is the dialogue's punch — the sophist is structurally closer to the angler than to the philosopher, by Plato's own classification method"
  - "Phaedrus 265e: 'the second principle is that of division into species according to the natural formation, where the joint is, not breaking any part as a bad carver might.' Plato names the diairesis-of-natural-joints requirement — the bisection must respect a real division, not impose an arbitrary one. The 'carving at the joints' phrase becomes a standing reference in modern philosophy of science (Putnam, Kripke) for natural-kind classification"
  - "foundational critical question: when does diairesis fail (Aristotle's critique made operational)? When the genus is NOT partitionable by a single binary criterion at the relevant level. Example: classifying employees by 'remote vs in-person' loses information when the actual relevant axes are (a) what work they do (b) what coordination they need (c) what their personal constraints are. Single-criterion diairesis on a multidimensional space gives a worse-than-useless classification. The remedy is either (i) abandon diairesis for that level, or (ii) accept that the result is one of MANY possible diaireses, none privileged"
  - "decisive critical question: how does diairesis avoid being arbitrary? Plato's 'carving at the joints' (Phaedrus 265e) is the discipline — the bisection must track a real division in the phenomenon, not an analyst's convenience. In modern ML, this is the question of which features have actual classifying information; in taxonomy, the question of which characters reflect actual phylogenetic descent vs. convergent appearance. The discriminator is empirical: does the classification PREDICT something we didn't input?"
  - "operational adjacent to lex-89rjr (Polya): one of Polya's heuristic moves is decompose-and-recombine; diairesis is a specific shape of decomposition (binary class-partition rather than functional decomposition). Polya's 'is there a related problem?' frame can deploy diairesis: the related problem is the one obtained by walking up the genus-tree one level"
  - "operational adjacent to lex-spk4s isolate-component-for-separate-treatment: both involve splitting, but the operations differ. lex-spk4s extracts ONE sub-functionality for independent work (decomposition along function/responsibility axes); diairesis bisects the AMBIENT CLASS into mutually-exclusive species (classification along category-membership axes). The diff: lex-spk4s is software-decomposition shape; diairesis is taxonomy-construction shape"
  - "operational adjacent to lex-rfxtb multifactorial-frame: multifactorial-frame says 'force-list three factors before settling on a single-cause explanation.' Diairesis is single-criterion classification by design — applying multifactorial-frame to diairesis's output is the discipline of asking 'is this the only bisection criterion that makes sense, or are there others I should also consider?' The two atoms are complementary correctives: diairesis builds the classification, multifactorial-frame audits whether it captures enough dimensions"
severity-tier: info
critical-questions:
  - "are the splits actually clean (orthogonal sub-categories) or are they bleeding into each other — bad splits produce false trees"
  - "is the recursion converging on the target, or just generating more leaves of the same depth?"
  - "what's at the leaf — operational identification or just a name? if just a name, you've classified without defining"
  - "is diairesis the right move here, or does the concept resist bisection (continuous, fuzzy, family-resemblance)?"
status: active
