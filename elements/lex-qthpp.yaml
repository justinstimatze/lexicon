id: lex-qthpp
name: a-metaphor-can-flip-from-legitimizing-to-condemning-at-its-own-limit
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a metaphor is being used to legitimize an action by analogy, check whether the action stays within the range the source domain actually covers -- crossing past that range can flip the same metaphor from justifying the act to condemning it. Lakoff's case: the Nation-As-Family metaphor makes government punishment of citizens ordinary and legitimate, by analogy to a parent disciplining a child. That analogy does real justifying work for fines, imprisonment, and other harsh-but-survivable punishments. It has nothing to say in favor of killing the child, because ordinary parenting has no such category -- a parent who kills a child isn't administering severe discipline, they've committed infanticide. So when the government's punishment is execution, the same Nation-As-Family mapping doesn't just run out of things to say -- it supplies its own condemning label, because the source domain's own moral boundary comes along with the rest of the structure it usually gives you for free. The metaphor was never selectively imported -- its limits carry over along with everything it permits. Diagnostic move: when a metaphor is being stretched to cover an extreme case, ask what the source domain itself would call an action that far outside its normal range -- if the source domain would name that act as a severe moral violation, the metaphor may have flipped polarity rather than simply stopped applying."
related: [lex-svxfr]
evokes: [george-lakoff, moral-politics-1996, nation-as-family, death-penalty, infanticide]
lineage:
  - source: primary
    text: lakoff-1996-death-penalty-as-infanticide
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 11 'Crime and the Death Penalty,' section 'The Death Penalty.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“In Strict Father morality, the strict father metes out punishment for the wrongdoings of children. The Nation As Family metaphor makes the government into the Big Daddy who is meting out punishment. Are there any limits on the harshness of punishment? The lack of such limits in the family would make it moral for a parent to kill his child in the name of discipline. When parents are abusive, this can happen, and all too frequently does. Infanticide is what the death penalty amounts to in the Nation As Family metaphor.”"
canonical-instances:
  - "The direct textual anchor, on where Lakoff locates the resulting moral reaction: 'The spectre of the state functioning like a murderously abusive parent is, I believe, what lies behind the constitutional prohibition against cruel and inhuman punishment and behind liberals' abhorrence of the death penalty.'"
  - "Hypothetical: a manager justifies giving harsh, blunt feedback in one-on-ones by comparing management to coaching -- a good coach pushes players hard and doesn't coddle them. The analogy holds up fine through demanding drills and tough film-room critiques. When the manager starts publicly humiliating an employee in front of the whole team to 'toughen them up,' the coaching analogy doesn't just stop applying -- it supplies its own verdict, because no legitimate coach humiliates a player in front of teammates, and everyone in the room recognizes the act by the coaching frame's own standards, not despite them."
critical-questions:
  - "This mechanism depends on the source domain (ordinary parenting, ordinary coaching) having a clear, shared sense of what counts as beyond its own limits. Real domains often have contested limits -- some parents do use corporal punishment they consider legitimate discipline that others call abuse. Does the flip-to-condemnation mechanism still work when the audience doesn't agree on where the source domain's own boundary sits, or does the whole argument collapse into the underlying disagreement about the source domain itself?"
  - "Lakoff applies this to death as an extreme, clear-cut case. Are there less extreme government actions that should trigger the same flip by the same logic -- indefinite detention without trial, for instance, which also has no benign parental analog -- and if the mechanism doesn't seem to fire as strongly there, what determines which extreme cases actually produce the flip and which don't?"
status: active
