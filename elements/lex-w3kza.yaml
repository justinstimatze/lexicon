lineage:
  - source: primary
    text: cushing-foster-child-deer-coyote-persists-until-badgers-reconsider
    citation: "Frank Hamilton Cushing, Zuñi Folk Tales (G. P. Putnam's Sons, 1901), 'The Foster-Child of the Deer.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "As he tried to step down the ladder, he fell, teng, on the floor before them. The Badgers were disgusted. They grabbed the Coyote, and hauling him up the ladder, threw him into the plain... When he recovered his thoughts he again turned toward the glowing sky-hole, and, crawling feebly back, threw himself down into the room again. Again he was thrown out, but this time the Badger said: 'It is marvellously strange that this Coyote, the miserable fellow, should insist on coming back, and coming back.' 'I have heard,' said the little old Badger-woman, 'that our glorious beloved youth of Háwikuh was changed some time ago into a Coyote. It may be he. Let us see when he comes again if it be he.'"
canonical-instances:
  - "A former employee who was let go under a cloud of suspicion keeps reapplying to the same company for unrelated openings over the years, each time rejected as an unremarkable applicant, until a hiring manager finally notices the unusual persistence and looks into the original circumstances, discovering the employee had actually been wrongly blamed."
  - "A customer whose account was mistakenly flagged as fraudulent keeps calling back through the same generic support line and getting the same scripted rejection each time, until a supervisor notices how unusual it is for a genuine bad actor to keep calling back so persistently and escalates the case for a real review."
critical-questions:
  - "how many rejections should someone in this position expect to need before persistence starts reading as unusual rather than simply annoying or easy to keep dismissing -- the Badgers reconsider on the third attempt, but is that threshold predictable or just how the story happened to unfold?"
  - "does this pattern risk normalizing a poor system that only responds to unusual persistence rather than getting genuine cases right the first time -- should the lesson be 'keep returning' for the person being dismissed, or 'notice unusual persistence sooner' for the one doing the dismissing?"
  - "what distinguishes this from the pattern where repeated past deception makes a listener permanently distrust even a genuine signal -- why does persistence work in the Coyote's favor here, when in other stories the exact same repeated approach from an untrusted source only deepens suspicion rather than prompting reconsideration?"
