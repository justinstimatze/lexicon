id: lex-8yqzd
name: when-forced-to-pay-anchor-low-and-escalate-only-as-far-as-required
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When you're forced to buy off a threat and don't know the actual minimum that will satisfy them, don't open with a generous offer to seem reasonable or to end the negotiation quickly -- open low and raise the offer only as much as is needed to get it accepted, since any gap between what you offered and what they'd have taken is pure loss. Kautilya's instruction for a weak king suing for peace: 'In negotiating for peace the weak king shall [successively] offer a quarter more of money and arms each day [until the offer is accepted].' Rangarajan's editorial gloss makes the logic explicit: 'Since the intention is to avert the attack at the lowest possible cost, the weak king shall first make a low offer, wait for a day to see whether it is accepted, increase the offer by a quarter and so on. The specification of a quarter or delay of a day need not be taken literally.' The mechanism is that the other party's actual floor is unknown and unknowable in advance, so the only way to discover it without overpaying is to test successively higher offers and stop at the first one that lands -- a single high opening offer forecloses ever finding out that a lower one would have worked, while a single low offer that's rejected outright at least reveals information (this floor is higher than X) that a fixed generous offer never would. Diagnostic move: when you must concede something to end a threat and don't know their true minimum, don't guess generous to save time or appear cooperative -- make a genuinely low opening offer, treat rejection as information rather than failure, and escalate incrementally only until acceptance, since every dollar or unit above their actual floor was money you didn't have to spend."
