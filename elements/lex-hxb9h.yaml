id: lex-hxb9h
name: rapport-is-banked-in-small-visits-before-a-hard-intervention
type-in: process
type-out: process
_tier: atomic
agent-instruction: 'Before delivering hard counsel or grief-work that a stranger''s authority couldn''t carry, an actor makes several low-stakes, friendly visits first — checking in, making small talk about ordinary work, offering no advice yet — so that by the time the hard moment arrives, the relationship itself does the work of making the message land rather than the message having to stand on its own credibility. Each visit looks incidental in isolation; only in sequence do they function as deliberate trust-banking. In the Kama-Jataka, the Buddha visits a grieving brahmin''s fields repeatedly over the planting season — at felling, at plowing, at watching the corn — with no apparent purpose beyond friendly small talk, so that when the brahmin''s crop is later destroyed and he needs consoling, the Buddha''s counsel arrives already carried by an established relationship rather than a stranger''s unearned authority.'
related: []
evokes: [jataka, dvadasanipata, kama-jataka, trust-banked-before-hard-counsel, relationship-precedes-the-ask]
lineage:
  - source: primary
    text: jataka-chalmers1895-kama-jataka
    citation: 'The Jataka, or Stories of the Buddha''s Former Births, Vol. IV, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1901), Book XII (Dvadasanipata), No. 467, Kama-jataka. Verified verbatim against a direct extraction of the held copy.'
    quote: 'In the same manner the Master came and talked with him when the felled trunks were all away, and the man was clearing his acre, and again at plowing time, and at making the little embanked squares for water.'
canonical-instances:
  - 'A hospice chaplain visits a dying patient''s family several times during routine, low-stakes moments in the weeks before end-of-life conversations become necessary, so that when the hardest conversation finally comes, it arrives from someone the family already trusts rather than a stranger delivering the news.'
critical-questions:
  - 'The futility-of-grief argument the Buddha uses is structured to be self-evidently true once stated — does the counsel actually land better because of the banked rapport, or would a total stranger have gotten the brahmin to the same admission just by asking the question?'
status: active
