id: lex-eytsu
name: pain-from-confusing-image-and-reality-teaches-how-to-weaponize-that-confusion
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "Suffering a real injury because you mistook a symbolic representation for the literal thing it stood for doesn't just teach you to be more careful -- it can teach you exactly how that specific confusion works well enough to deliberately inflict it on someone else. In the Winnebago \"Reflected Plums\" story, trickster dives repeatedly for plums he sees reflected in water, knocking himself unconscious against a rock before realizing: \"What he had seen in the water was only a reflection.\" Immediately afterward, in the same telling, trickster lures raccoon mothers away from their children by pointing them toward a field of real plums and adding a coded warning they take literally: \"If, toward evening, as the sun sets, you see the sky red, you will know that the plums are causing it. Do not turn back for you will surely find it.\" As Radin explains, and Hyde repeats, a red sky was the Winnebago \"stereotype symbol for death\" -- trickster is telling the mothers exactly what is about to happen to their children, encoded in the same kind of image-for-reality confusion that had just cost him his own dignity and consciousness. He doesn't merely recover from being fooled by an image; he graduates directly to fooling others with one, using the identical mechanism from the other side. Diagnostic move: after you've been burned by mistaking a sign, a symbol, or a representation for the real thing, consider that you now possess unusually precise knowledge of exactly how that confusion is produced -- which means you're also unusually well positioned to produce it deliberately in someone else, for better or worse, and it's worth noticing which one you're about to do."
