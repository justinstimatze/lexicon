lineage:
  - source: primary
    text: zitkala-sa-badger-and-bear-the-ugly-cub-secretly-helps
    citation: "Zitkála-Šá, Old Indian Legends (Ginn & Company, 1901), 'The Badger and the Bear.' Verified verbatim against the raw Gutenberg text file, clean ASCII, no OCR."
    quote: "'He was the ugly cub... he had always been laughed at by his older brothers... \"I shall not ask my father for meat to give away. He would say 'No!' Then my brothers would laugh at me,\" said the ugly baby bear to himself... he was singing happily and skipping around his father at work... he made a quick side kick with his left hind leg. Lo! there fell into the badger's hut a piece of fresh meat.'"
canonical-instances:
  - "In a workplace where a manager is publicly humiliating a struggling new hire in front of the team, the one colleague who quietly slips the new hire useful information after the meeting is the team's own least-favored member, someone who has themselves been on the receiving end of the manager's contempt and knows better than to challenge it openly."
  - "Among a group of students mocking a classmate for a mistake, the student who privately reaches out afterward with a kind word is typically not the most popular kid in the room but one who has their own history of being excluded, and who would never risk defending the classmate out loud in front of the group that also excludes them."
critical-questions:
  - "does relying on marginalized insiders for covert help place an unfair burden on people who are already vulnerable, expecting them to take on hidden risk that more secure group members, who could help openly at lower personal cost, decline to take on at all?"
  - "how much does covert help actually accomplish compared to open advocacy -- does the concealment that makes the help possible also cap how much difference it can make, leaving the victim only marginally better off while the group's overall behavior toward them goes unchanged?"
  - "is the marginalized member's empathy specific to this one victim, or does the pattern generalize -- does someone who has experienced exclusion reliably extend sympathy to other outsiders, or does that depend on factors (in-group loyalty, fear, personal history) this framework doesn't account for?"
