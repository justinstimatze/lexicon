lineage:
  - source: primary
    text: radin-comparing-independent-tribes-isolates-the-tricksters-original-core
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Wakdjunkaga Cycle and Its Relation to Other North American Indian Trickster Cycles.' Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "On the basis of all these facts only one conclusion is possible, namely, that Trickster's divinity is always secondary and that it is largely a construction of the priest-thinker, of a remodeller. ... I think it is safe to assume that it began with an account of a nondescript person obsessed by hunger, by an uncontrollable urge to wander and by sexuality."
canonical-instances:
  - "A folklorist comparing dozens of independently collected versions of the same fairy tale across different regions notices that the basic sequence of trials the hero faces stays constant everywhere, while the specific moral lesson attached to the ending varies by region, concluding that the trial sequence is the older, core material and the morals were added later by local tellers."
  - "A researcher studying a company's founding myth across offices in different countries finds that the basic sequence of events, who quit their job, who they met, what problem they solved, stays consistent everywhere, while the specific virtues attributed to the founders vary by office in ways that track each office's own local culture, suggesting the virtue-language was added locally rather than being part of the original story."
critical-questions:
  - "Is Radin's inference sound, or could a genuinely original trait simply have been lost independently in multiple traditions for unrelated reasons, producing an appearance of secondary construction where none actually occurred?"
  - "Does this method assume that the traditions being compared really did develop independently, and how would an analyst rule out contact, borrowing, or a shared more recent common source that would undermine the inference from variation to lateness?"
  - "Could the consistent core itself have been added early and independently to already-diverging traditions, for reasons unrelated to antiquity, such as a widely shared cultural anxiety that different groups each attached to their trickster figure on their own?"
