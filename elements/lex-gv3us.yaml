id: lex-gv3us
name: alignment-via-internalized-objectives-and-self-control-replaces-coercive-external-direction
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When designing for compliance via surveillance and external sanction, surface Drucker's contrast — alignment via internalized objectives + self-control scales where coercive external direction fails; design for the internal target, not the audit."
related: [lex-2apyb, lex-2jn8d, lex-2kbpp, lex-3656j, lex-5d8hm, lex-7xz6k, lex-9zjpf, lex-afzzp, lex-b2c6b, lex-cgbrt, lex-d73nj, lex-ebmmd, lex-ezcv6, lex-jd7fe, lex-kj6tj, lex-kjb2b, lex-ktpxs, lex-m8j35, lex-pbpbj, lex-prwfm, lex-qjsgk, lex-rgr3t, lex-tqd9x, lex-x9sda, lex-zfxbw]
