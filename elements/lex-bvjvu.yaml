canonical-instances:
  - "A mid-sized firm sees an opening to undercut a much larger, currently-distracted competitor's pricing in one region while that competitor is absorbed in a merger integration, but holds off unless the move can also win over a smaller partner or customer base the larger competitor was neglecting during the distraction -- a pure pricing jab that doesn't convert any customer loyalty just provokes a giant it can't actually damage, for a gain that disappears once the merger integration finishes."
  - "A politician considers publicly criticizing a much more powerful rival party while that party is consumed by an internal leadership fight, but only follows through in a way that visibly sides with and wins over a faction inside the rival party, rather than attacking the party as a whole -- a criticism that produces no new ally just creates a lasting enemy with more resources, for a news cycle's worth of temporary advantage."
critical-questions:
  - "how does an actor reliably predict, before acting, whether an opportunistic strike will actually win over the third party rather than making that third party suspicious of an unsolicited intervention in their own conflict -- is the ally-winning outcome something that can be engineered, or does it depend on factors outside the striker's control?"
  - "does this framework undervalue purely tactical gains that weaken a powerful bystander's capacity even without winning any ally -- if the material damage genuinely degrades a rival's future ability to act, is 'no ally won' really equivalent to 'no lasting value,' or does the rule overstate how fleeting non-relational gains actually are?"
  - "what happens when the durable ally that's won turns out to be weak, unreliable, or short-lived itself -- does the framework account for the possibility that the 'lasting' relationship gained is itself just as fragile as the material gain it was supposed to replace, leaving the striker with neither?"
