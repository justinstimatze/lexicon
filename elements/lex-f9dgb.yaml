id: lex-f9dgb
name: assemblage-as-open-ended-gathering-with-multiple-temporal-rhythms-not-coordinated-community
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When trying to make sense of a system that gathers heterogeneous participants — species, practices, people, technologies, supply-chain stages, code modules, jurisdictions — Tsing's transferable claim is that the right frame is ASSEMBLAGE, not COMMUNITY. The community frame assumes fixed membership, shared purpose, and unified rhythm; the assemblage frame allows for OPEN-ENDED GATHERING where membership is fluid, participants influence each other in ways that are NEVER FULLY SETTLED, and multiple temporal rhythms run simultaneously (polyphonically) without resolving to a single beat. The question is not 'what does this community pursue?' but 'how do these gatherings sometimes become happenings greater than the sum of their parts?' Tsing's specific contribution: the POLYPHONIC variant of assemblage — multiple autonomous melodies intertwining, with moments of harmony AND dissonance both as content. Listening polyphonically (picking out simultaneous threads rather than collapsing to one) is the methodological move. Practitioner consequence: when you face a system that resists single-rhythm analysis (because participants have genuinely different timescales, goals, modes of being), do NOT force it into a unified-coordination frame. The unification is your assumption, not the system's property. Look at the patches — the local sites where particular gatherings produce particular effects. Watch the relations across patches. Notice the polyphonic rhythms. Practitioner test: when you describe the system, can you describe TWO OR MORE temporal rhythms that don't collapse into each other? If not, you may be flattening the assemblage into a misleading unity. The transferable lesson generalizes far beyond Tsing's mushroom ecology: companies as assemblages (departments-with-different-cadences), supply chains as assemblages (Tsing's own extension), ecological communities, cultural scenes, scientific disciplines, ML training pipelines, open-source projects, scholarly fields. Distinct from lex-xu8k9 unscalable-initial-conditions-as-diagnostic-not-defect (also Tsing): lex-xu8k9 is the SCALABILITY question (what gets eliminated to make something scalable); lex-f9dgb is the COMPOSITION question (what gathers and how). They compose — non-scalable systems are typically assemblages; scalability often demands flattening the assemblage into a community. Distinct from lex-rbcsc worldview-as-cognitively-prior-pattern: lex-rbcsc is about how cognitive priors shape interpretation; assemblage is about how heterogeneous gatherings produce emergent effects. They compose — both reject reductive analysis. Distinct from lex-qjkvn niche-partitioning: niche-partitioning is one specific mechanism by which an assemblage of species coexists; assemblage is the broader frame for thinking about heterogeneous gatherings independent of mechanism. Distinct from lex-555ug shaping-by-successive-approximation: shaping is a method for building a target behavior; assemblage rejects the pre-specified-target frame entirely — you're not building toward a target, you're watching what emerges from the gathering. They are different stances toward intervention."
