    text: radin-trickster-mimics-a-tree-stump-mistaken-for-a-silent-rival
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Trickster Cycle,' episode 11. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "'Say, my younger brother, what are you pointing at?' But he received no answer. Then, for the second time, he called, 'Say, my younger brother, what is it you are pointing at?' Again he received no answer. ... 'Well, if that's the way it's going to be, I, too, shall do that. I, too, can stand pointing just as long as he does. I, too, can put a black shirt on.' ... 'Younger brother, let us stop this. My arm is very tired.' Again he received no answer. ... 'Well, why am I saying all this? That man has no heart at all. I am just doing what he is doing.' Then he walked away and when he looked around, to his astonishment, he saw a tree-stump from which a branch was protruding. This is what he had taken for a man pointing at him."
canonical-instances:
  - "A negotiator interprets a counterpart's long silence after an offer as a hardball tactic and responds by going silent in turn for days, burning goodwill and time, before learning the counterpart's email had simply gone to spam and no strategy was ever being played."
  - "A driver assumes another car matching their speed on the highway is trying to race them and speeds up to 'win,' risking an accident, before realizing the other driver was simply going the same speed toward the same exit with no awareness of any contest."
critical-questions:
  - "Would Trickster have discovered the truth sooner by simply walking closer at any point, and if so, what kept him from doing that -- is there something about matching a perceived rival's behavior that makes checking the premise feel unnecessary or even weak?"
  - "Does the story suggest Trickster is uniquely prone to this kind of misreading, given his general credulity throughout the cycle, or is mistaking silence for opposition a more universal trap that a more careful character would fall into just as easily?"
  - "Is there a meaningful difference between this case, where the rival never existed at all, and a case of a real but passive rival who does nothing -- does the diagnostic still apply when the other party is at least present, just uninterested in the contest?"
