id: lex-6r89k
name: override-a-default-crisis-priority-list-with-named-contextual-rules
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When a crisis or resource shortfall hits several parts of a system at once and you must decide which to protect first, don't treat a general-purpose importance ranking as fixed law — use it as a DEFAULT that specific, named contextual conditions are allowed to override, and know in advance what those override conditions are rather than discovering them mid-crisis. Kautilya stages this as a debate: he first records prior teachers' claims that the state's seven constituent elements (king, ministers, territory-and-people, forts, treasury, army, ally) have a fixed severity ordering — 'that which affects the one mentioned earlier in the order is more serious than that affecting one later' — then works through each adjacent pair, naming a different prior teacher's single-factor argument for reordering it (Bharadvaja argues ministers matter more than the king because 'a great deal of state activity depends on ministers'; Vishalaksha argues the territory-and-people matter more than ministers because everything else is 'obtained' from them; Pisuna argues the treasury outranks the fort because 'with wealth, one's own people, allies and the people of the enemy can be kept under control') and answering most of them by reaffirming the default order for a stated reason, while carving out explicit exceptions where the default genuinely breaks: 'if a country consists predominantly of agriculturists, the calamity [to the few fortifications] would be more serious. Conversely, in a country inhabited mostly by martial people, calamities to the [comparatively more limited] country territory would be more serious' — the fort-versus-territory ranking flips based on which one the population structure actually depends on more, not on an abstract claim that forts or people matter more in general. He adds two further named override rules that apply regardless of the underlying ranking: when two elements are hit equally at the same time, prefer worrying about 'whether the damage is increasing or decreasing' rather than their nominal rank — unless one of them will cascade into damaging other elements, in which case the cascading one wins regardless of trend; and 'a calamity which threatens to destroy all other elements shall be considered as [the most] serious, irrespective of what position the element affected occupies in the list of priorities' — a trump condition that can override the entire ordering at once. Finally, when a whole element cannot be saved, the doctrine shifts from all-or-nothing to salvage: 'if the constituent as a whole can not be saved, at least parts shall be rescued; i.e., in the case of the army, the more numerous or the more loyal troops shall be saved leaving out the sharp and the greedy; in the case of the treasury the most valuable or the most useful shall be saved.' Diagnostic move: before a crisis hits, write down both the default priority order for your system's components AND the specific conditions under which that order is known to flip (a dependency-structure difference between contexts, equal damage broken by trend direction, cascading risk overriding rank, a trump condition that supersedes rank entirely) — and have a partial-preservation fallback ready for any component you can't fully protect, so the response under pressure is retrieving a pre-decided rule rather than improvising a justification for whichever component feels most urgent in the moment."
