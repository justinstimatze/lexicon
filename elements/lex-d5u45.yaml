id: lex-d5u45
name: direct-contagion-and-ambient-diffusion-dominate-at-different-life-stages
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Apply when a behavior or belief is spreading (or declining) through a population and the question is HOW it's spreading — through direct interpersonal transmission or through general cultural exposure — because the two mechanisms respond to different interventions and dominate at different ages. Koval, Beasley, Hararuk & Rodgers's EMOSA (Epidemic Models of the Onset of Social Activities) framework names two distinct transmission channels for any spreading behavior: 'social contagion (one-to-one spread) and general diffusion (spread through cultural channels).' Social contagion is direct, dyadic — a specific person passing a specific behavior to a specific other person they're in contact with (their own example: 'an 18-year-old freshman invites her friend to attend church in their new college community'). General diffusion is ambient — exposure to a behavior's prevalence and normalcy through the surrounding culture generally, with no specific transmitting individual required. Fitting both channels to 10 years of NLSY97 data on adolescent and young-adult religious participation, they found the two channels do NOT contribute equally across the lifespan: 'General diffusion dominated rapid reduction in church attendance during adolescence; both diffusion and social contagion explained church attendance stability in early adulthood.' The transferable claim: a spreading (or declining) behavior's dominant transmission channel is not fixed — it can shift from primarily-ambient (diffusion) to a mix including direct-interpersonal (contagion) as a population ages or as a behavior moves from a period of rapid change to a period of stability. Practitioner discipline: before designing an intervention to encourage or discourage a spreading behavior (public health messaging, a product's viral growth strategy, an organization's culture change), diagnose which channel is actually driving the CURRENT rate of change for the CURRENT population segment — a campaign built for one-to-one peer influence (social contagion) will underperform if the actual driver is ambient cultural exposure (diffusion), and vice versa; and because the dominant channel can shift as the target population ages or as the behavior's trajectory shifts from rapid change to stability, a strategy that worked at one life stage or one phase of the trend may need to change channel-target as conditions shift, not just intensity."
related: [lex-pvpag, lex-u6sw3, lex-nfdyv]
evokes: [emosa-models, social-contagion, general-diffusion, one-to-one-vs-cultural-channel-spread, dominance-shifts-by-life-stage, dual-transmission-channel]
lineage:
  - source: primary
    text: koval-beasley-hararuk-rodgers-2023-emosa-adolescent-religious-transitions
    citation: "Andriy Koval, William Howard Beasley, Oleksandra Hararuk, and Joseph Lee Rodgers, 'Social Contagion and General Diffusion Models of Adolescent Religious Transitions: A Tutorial, and EMOSA Applications,' Journal of Research on Adolescence (2023), DOI 10.1111/jora.12695. Fit to 10 years of data from the 1997 U.S. National Longitudinal Survey of Youth (NLSY97)."
    quote: "'Epidemic Models of the Onset of Social Activities (EMOSA) describe behaviors that spread through social networks. Two social influence methods are represented, social contagion (one-to-one spread) and general diffusion (spread through cultural channels)... When an 18-year-old freshman invites her friend to attend church in their new college community, she is passing a \"religious attendance meme\" through her new social network.' [...] 'We fit the model to 10 years of data from the 1997 U.S. National Longitudinal Survey of Youth. Innovations include a three-stage bi-directional model, Bayesian Markov Chain Monte Carlo (MCMC) estimation, graphical innovations, and empirical validation. General diffusion dominated rapid reduction in church attendance during adolescence; both diffusion and social contagion explained church attendance stability in early adulthood.'"
canonical-instances:
  - "The paper's own central finding: adolescent religious decline is driven mainly by general diffusion (ambient cultural exposure to secularizing norms), while the SAME population's religious stability in early adulthood is explained by a mix of both diffusion and direct social contagion (specific peers, partners, or communities actively reinforcing continued attendance)."
  - "A viral product feature spreading through a user base mainly via general awareness/marketing exposure in its early rapid-growth phase, then increasingly sustained by direct user-to-user referral and habit reinforcement once growth plateaus — the same dominance-shift shape (ambient-diffusion-first, contagion-sustains-later) applied outside religion, untested by this paper but structurally analogous."
  - "operationally distinct from lex-pvpag commitment-decay-sheds-costliest-behavior-before-cheapest-identity: lex-pvpag (Stolz et al.) is about the ORDER in which different commitment LAYERS (participation, importance, belonging) erode as reinforcement declines. This atom is about the CHANNEL through which a behavior spreads or is sustained (direct contagion vs. ambient diffusion) at a given life stage. Both concern religious change across generations/cohorts, but lex-pvpag answers 'what erodes first,' this atom answers 'through what mechanism does the erosion or maintenance actually propagate' — genuinely composable (diffusion could be what drives the erosion of the costliest layer first) but not the same claim."
  - "operationally distinct from lex-u6sw3 high-fidelity-copying-of-causally-opaque-steps-enables-cumulative-cultural-evolution: lex-u6sw3 (Henrich) is about the FIDELITY of transmission — how faithfully a practice's steps get copied across generations, and what breaks when copying degrades. This atom is about the CHANNEL of transmission — whether the behavior moves person-to-person or through ambient cultural exposure — a question that's prior to and independent of how faithfully any single transmission event reproduces the behavior."
critical-questions:
  - "Is the diffusion/contagion split cleanly separable in the statistical model, or could some of what's attributed to 'general diffusion' actually be many small, unmeasured social-contagion events (family influence not captured as peer contact) misclassified as ambient exposure?"
  - "Does the adolescent-diffusion / adult-contagion-plus-diffusion pattern reflect something general about ANY spreading behavior across the life course, or is it specific to religious participation's particular social structure (family-of-origin exposure in adolescence, self-selected communities in adulthood)?"
  - "The model is fit to one cohort (NLSY97, U.S., a specific 10-year window) — has the dominance-shift finding been replicated in a different cohort, country, or spreading behavior, or does it rest on a single dataset the way many single-study social-science findings do before failing to generalize?"
