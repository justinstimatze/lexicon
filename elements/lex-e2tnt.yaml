id: lex-e2tnt
name: cognitive-environment-as-scope
type-in: state
type-out: frame
_tier: atomic
agent-instruction: "When interpreting an utterance, the cognitive environment of the speaker and listener defines what's accessible. Misunderstanding usually traces to a cognitive-environment mismatch, not bad faith. Surface the assumed context before debating the meaning."
related: [lex-4yhqs, lex-wtkuz, lex-u74ex, lex-bd324, lex-xhvgy, lex-j929z, lex-n6t4u, lex-5mv6r, lex-t78sc, lex-4ydm6, lex-p77e7]
evokes: [manifest-not-known, the-visual-field-but-for-thinking, what-the-agent-can-reach-from-here, scope-of-the-available, substrate-for-relevance-choice, manifest-vs-mutual-knowledge-replacement]
lineage:
  - source: primary
    text: sperber-wilson-1986-relevance
    citation: "Dan Sperber & Deirdre Wilson, Relevance: Communication and Cognition (Harvard UP / Blackwell 1986; 2nd ed. 1995). Chapter 1 §8 'Cognitive environments and mutual manifestness' (p.38-46). The cognitive environment is the set of facts manifest to an individual — wider than what they actively know, narrower than physical reality. It scopes what they can operate on cognitively. The atom's structural role: name the FIELD that scopes spotlight-choice (lex-u74ex). Without this scope, relevance-selection has no candidate set; with it, the candidate set is principled (manifest-not-known means inferential-reach is included but not the entire physical world). Sperber-Wilson's cardinal methodological move: 'manifest' is weaker than 'known' or 'assumed', which lets mutual-manifestness substitute for the regress-prone mutual-knowledge primitive. Verified verbatim 2026-05-20 (Ch.1 §8 OCR'd page text; page numbers verified from per-page file headers using established filename = printed-page + 10 offset)"
    quote: "(39) A fact is manifest to an individual at a given time if and only if he is capable at that time of representing it mentally and accepting its representation as true or probably true. (40) A cognitive environment of an individual is a set of facts that are manifest to him. [Ch.1 §8 p.39 — the foundational definitions; the visual-environment analogy on p.38 motivates them: 'what visible phenomena are for visual cognition, manifest facts are for conceptual cognition.'] To be manifest, then, is to be perceptible or inferable. An individual's total cognitive environment is the set of all the facts that he can perceive or infer: all the facts that are manifest to him. [Ch.1 §8 p.39 — vital scope extension: the manifest-set is WIDER than the actually-known-set, includes the inferentially-reachable.] We will now show that because 'manifest' is weaker than 'known' or 'assumed', a notion of mutual manifestness can be developed which does not suffer from the same psychological implausibility as 'mutual knowledge' or 'mutual assumptions'. [Ch.1 §8 p.41 — the methodological move that the cognitive-environment construct enables.]"
  - source: practitioner
    text: sperber-wilson-mining-pass-1
    citation: "promoted from cross-attestation: cognitive science (the broader 'cognitive ecology' / 'distributed cognition' tradition — Hutchins 1995 Cognition in the Wild explicitly extends a similar field-of-operation framing; the gestalt-psychology 'phenomenal field' is an upstream precursor), AI / agent design (an agent's 'world model' or 'belief state' is the engineering instantiation of cognitive-environment; reachable-belief vs current-belief distinction matters for planning), philosophy of mind (the access-vs-occurrent-belief distinction is the same shape — manifest = access-grade, asserted = occurrent-grade), software engineering (the 'context' parameter in many reasoning systems plays exactly this role — scope what the reasoner can reach without prescribing what it concludes). Cross-domain attestation across linguistics, cognitive psychology, AI agent design, philosophy, and engineering"
canonical-instances:
  - "the visual-field analogy Sperber-Wilson use to motivate the construct: a person's visual environment is the set of all phenomena visible to them — function of physical environment + visual abilities. Cognitive environment is the same shape for conceptual cognition: function of physical environment + cognitive abilities, set of facts they can perceive or infer. The analogy is central because it pre-empts the philosophical move 'but is it KNOWN?' — the visual field doesn't require active attention, just availability"
  - "the manifest-but-not-yet-attended example from Ch.1 §8 p.41: 'A car is audibly passing in the street. You have not yet paid any attention to it, so you have no knowledge of it, no assumptions about it... But the fact that a car is passing in the street is manifest to you.' Names the strict-weakness of manifest vs known: manifest is what's IN REACH cognitively, not what's currently occupying attention. Critical for reasoning about agent-action: the agent can pick up the manifest fact without further work; the not-manifest fact requires search"
  - "Freemason secret-handshake case (Ch.1 §8 p.41): 'every Freemason has access to a number of secret assumptions which include the assumption that all Freemasons have access to these same secret assumptions.' The mutual cognitive environment among Freemasons contains the assumption of its own shared-ness; this is what makes shibboleths function. The construct generalizes: any in-group with shared assumptions that contain meta-assumptions of shared-ness has a mutual cognitive environment in S&W's sense"
  - "AI agent design: the difference between an agent's 'world model' (everything it can infer with current capabilities, given current sensory input) and 'current belief state' (what it has actively asserted or recently considered). The world model corresponds to the agent's cognitive environment; the belief state corresponds to manifest-AND-currently-attended. Most planning algorithms operate on belief-state but should scope candidate-actions by world-model; the gap is a frequent source of suboptimal planning"
  - "operational complement to lex-u74ex spotlight-choice: spotlight-choice names the CHOOSING (which facts go in the spotlight); cognitive-environment-as-scope names the FIELD CHOSEN FROM (the set of manifest-to-agent facts). Together they're the structure of any relevance-selection operation: a manifest-field scoping the candidates + a selection-operation picking which to spotlight. Without the field, the choice has no candidates; without the choice, the field is inert. Sperber-Wilson chain them explicitly in their Ch.3 relevance-definition (the context the assumption is relevant IN is built from elements of the cognitive environment)"
  - "critical methodological move (S&W p.41): the cognitive-environment construct ENABLES the replacement of the philosophical primitive 'mutual knowledge' (which generates infinite regress in formal treatments) with 'mutual manifestness' (which decays asymptotically toward zero degree-of-manifestness without becoming false). The replacement is consequential: it lets cognitive-science treat shared-information empirically rather than as an idealization. Same shape as the broader 'operationalize the ill-posed primitive' move in philosophy-of-science"
critical-questions:
  - "the empirical-detection question: how do you know what's MANIFEST to an agent without direct introspection? The construct is theoretical; empirically detecting manifest-but-unattended facts requires behavioral probes (priming experiments, lexical decision tasks, response-time measures). The risk of misuse: claiming 'X was manifest to them' as a post-hoc move when X may not actually have been within reach. Practitioner-discipline: manifestness is a property to be EMPIRICALLY established, not assumed"
  - "the mutual-manifestness boundary: when is something mutually-manifest (manifest-to-both-agents-and-mutual-knowledge-of-that)? S&W argue mutual-manifestness is the substrate of communication. Practitioner-question: in this interaction, what's mutually-manifest vs unilaterally-manifest? Speakers who assume mutual-manifestness when only unilateral holds produce systematic miscommunication"
  - "the manifest-vs-already-believed distinction: manifestness is being-within-reach-of-cognitive-environment, NOT being-currently-believed. Many things are manifest (you could derive them quickly) that aren't currently active beliefs. Practitioner-discipline: when designing communication, target what's manifest (derivable) not just what's believed"
  - "the cognitive-environment-design intervention: cognitive environments can be shaped by what's salient, what's recent, what's recurrent. Practitioner-question: what changes to the environment would make X manifest? Education, priming, repetition, structural-foregrounding all operate on this lever"
status: active
