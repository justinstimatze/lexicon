id: lex-w2w5b
name: shared-experience-is-the-sole-qualification-to-perform-the-role
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Only a person who has personally had a specific category of vision or experience can be considered qualified to perform a specialized ceremonial role built around that category -- the credential is having lived through it oneself, something no amount of training received from someone else, or appointment by an authority, can substitute for. Black Elk states the rule flatly before describing anything else about heyokas: 'Only those who have had visions of the thunder beings of the west can act as heyokas.' Wachpanne, who runs Black Elk's ceremony, qualifies not because anyone certified him but because 'he had acted as a heyoka many times and knew all about it' -- knowledge that traces back to his own thunder-being vision, the one experience no amount of study or apprenticeship under someone else could substitute for."
related: []
evokes: [black-elk-speaks, heyoka-ceremony, only-those-who-have-had-visions, of-the-thunder-beings-of-the-west, can-act-as-heyokas]
lineage:
  - source: primary
    text: neihardt-1932-black-elk-speaks-ch16-heyoka-ceremony
    citation: "John G. Neihardt, Black Elk Speaks: The Complete Edition (University of Nebraska Press, Bison Books, 2014 premier annotated edition; originally published by William Morrow, 1932), Chapter 16, 'Heyoka Ceremony.' Black Elk's own narrated words, transcribed and edited by Neihardt. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "Only those who have had visions of the thunder beings of the west can act as heyokas. They have sacred power and they share some of this with all the people, but they do it through funny actions."
canonical-instances:
  - "A peer-support counselor for people in addiction recovery must have personally gone through recovery themselves -- clinical training alone, without the lived experience, doesn't qualify someone to hold that specific role."
  - "A veterans' support group requires its facilitators to be veterans themselves who served in combat, treating that lived experience as the credential no amount of professional counseling training can substitute for."
  - "A survivors' advocacy organization only allows people who have themselves survived the specific type of trauma the organization addresses to serve as peer advocates, regardless of how much relevant education an outside applicant might have."
critical-questions:
  - "Does restricting the role to people who have personally had the experience actually produce better performance of the role, or does it mainly produce legitimacy and trust from the community, which is a different kind of qualification entirely?"
  - "How would anyone verify that a claimed vision actually happened, given that the credential is an entirely private, unwitnessed experience -- does the system depend on trusting self-report, or is there some independent way the community confirms a real vision occurred?"
  - "Does this qualification rule exclude people who might have deep theoretical or observational understanding of thunder-being visions without having had one themselves, and if so, is anything valuable lost by that exclusion?"
status: active
