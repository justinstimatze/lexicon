id: lex-w5tqm
name: an-unstaked-bystanders-incidental-remark-outranks-a-direct-appeal-from-the-affected-party
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Facing an unwelcome appeal from someone with an obvious stake in the outcome, a person can instead treat an incidental remark from an unconnected bystander, made about something else entirely and to no one in particular, as the decisive authority — precisely because the bystander has no stake in the decision and never intended to answer it. In the Jataka''s tale of Mahajanaka, wanting to send his wife away but resistant to her own pleading, the king twice elevates a passing stranger''s unrelated maxim into binding counsel: a child playing with bracelets says, "The second jangles and makes jars, that which is single cannot jar; Would''st thou be happy? be alone; only the lonely happy are," and an arrow-maker squinting to straighten a shaft, asked only about his craft, answers with the identical refrain — and Mahajanaka acts on each as if it settled the matter with his wife, telling her, "Hear what she says; this servant girl would overwhelm my head with shame Were I to yield to thy request."'
related: []
evokes: [jataka, mahanipata, mahajanaka-jataka, disinterested-authority, incidental-wisdom]
lineage:
  - source: primary
    text: jataka-cowellrouse1907-mahajanaka-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. VI, trans. E. B. Cowell and W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1907), Book XXII (Mahanipata), No. 539, Mahajanaka-Jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Hear what she says; this servant girl would overwhelm my head with shame Were I to yield to thy request; it is the second brings the blame."
canonical-instances:
  - "A manager on the fence about laying off a struggling teammate overhears a stranger on the train complaining about a coworker who 'just can't carry their weight,' and treats the remark as confirmation, even though the stranger has never met either of the people involved and was talking about an entirely different job."
  - "Someone unsure whether to end a friendship reads a fortune-cookie line about 'letting go of what weighs you down' and cites it to the friend as the reason, rather than making the case themselves in their own words."
critical-questions:
  - "Does a bystander's remark actually carry more evidentiary weight because they're disinterested, or does it just feel more decisive because it arrives without the emotional cost of confronting the person directly?"
  - "The maxim happened to align with what Mahajanaka already wanted to do — how would this move be exposed if the incidental remark had instead argued against the decision he was already leaning toward?"
status: active
