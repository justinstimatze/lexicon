  - "classification(lex-hrnuj anchoring-bias, shape=named-systematic-distortion) — Tversky-Kahneman's spinning-wheel-affects-UN-estimate is the canonical demonstration; survives even with explicit warning"
  - "classification(lex-kxbm2 convexity-bias, shape=named-systematic-distortion) — borderline-member; Jensen-inequality's second-order effects mis-perceived as first-order; the practitioner-framing is the linear-thinking-bias against tracking curvature"
  - "classification(lex-tfpzb survivorship-bias, shape=named-systematic-distortion) — Wald's bomber-armor and Taleb's silent-evidence demonstrate the missing-cases blindness"
  - "classification(lex-2czcp vivid-concrete-instance, shape=named-systematic-distortion) — availability and representativeness heuristics in Kahneman-Tversky terminology"
  - "classification(lex-dgwbn, shape=named-systematic-distortion) — fundamental attribution error in Ross-Nisbett terminology; the self/other asymmetry in causal attribution"
  - "classification(lex-vkhp7 hindsight-bias, shape=named-systematic-distortion) — Fischhoff's outcome-knowledge-retroactively-inflates pattern"
  - "classification(lex-rwvkh, shape=named-systematic-distortion) — Kahneman-Tversky cab-problem; with the causal-framing extension noting when the prior IS taken into account"
  - "classification(lex-yv8ag need-for-cognitive-closure, shape=named-systematic-distortion) — Kruglanski's seize-and-freeze; bundles multiple sub-effects (primacy, anchoring, stereotype-reliance) under the same need-for-closure motivational substrate"
  - "the-shared-shape: every member is a NAMED, SYSTEMATIC, EMPIRICALLY-DOCUMENTED distortion of judgment or inference relative to a normative baseline (rational-actor, Bayesian-updater, attribution-symmetry, linear-perception), surviving even when the reasoner is informed about it. The named-ness and the survives-awareness property together distinguish cognitive-bias from generic-error or generic-heuristic"
