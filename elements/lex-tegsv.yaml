id: lex-tegsv
name: a-self-directed-conditional-curse-signals-truthfulness-when-nothing-else-can
type-in: process
type-out: process
_tier: atomic
agent-instruction: "When no external evidence exists to verify innocence, offering an oath that invokes severe personal misfortune on yourself if you're lying functions as a costly signal precisely because a genuinely guilty person has a strong incentive not to invoke it — the willingness to accept the risk becomes the evidence. In the Jataka's tale of the mango orchard, four merchants' daughters accused of theft each swear an oath calling down specific curses on themselves if guilty, and the accuser accepts this as proof: 'She that did thy mangoes eat, As her lord shall own some churl, That with dye grey hairs would cheat And his locks with tongs would curl.'"
