id: lex-keh5r
name: dirt-is-matter-out-of-place-not-an-intrinsic-property
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Whether something counts as dirt, filth, mess, contamination, has nothing to do with any fixed property of the substance itself and everything to do with where it sits relative to a system of categories -- the identical material is clean in one location and dirty in another, with no chemical or physical change involved, only a change of place. Hyde draws on anthropologist Mary Douglas's formulation: '\"Dirt is matter out of place.\" Egg on my plate is breakfast, but egg on my face is dirt; shoes in the closet are tidy, but shoes on the table are a mess; the farmer in Iowa washes the manure from his hands, the Brahmin in Mysore washes with it.' Douglas supplies a second, related definition worth distinguishing: 'dirt is the anomalous, not just what is out of place but what has no place at all when we are done making sense of our world' -- the rock badger that fits no category cleanly (mammal-like teeth, hoofed toes, no clear kin) counts as dirt not because it moved somewhere wrong, but because the classification system built no slot for it at all. Either way, dirt is not a property being detected; it is a verdict a system pronounces on something using its own internal boundaries as the measuring stick. Diagnostic move: when something gets labeled dirty, wrong, out of place, or improper, don't investigate the thing itself for what makes it inherently so -- investigate the classification system doing the labeling, and ask what would need to be true of the system (not the substance) for the same material or behavior to count as perfectly clean, since the answer usually reveals more about the system's boundaries than about anything intrinsic to what's being judged."
