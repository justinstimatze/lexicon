id: lex-mpcqt
name: reasonableness-alone-never-narrows-rival-theories-to-one
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When two rival positions both sound reasonable and the only tool left in the debate is 'which argument is more persuasive,' don't expect that tool to ever settle it -- Popper's gloss on Kant's Transcendental Dialectic shows why it structurally can't. Kant's case: for any metaphysical claim built from pure reasoning alone, reaching beyond anything experience could check (his example: the world is infinite), 'we can always argue, with the help of analogous arguments, to the opposite effect as well... both arguments will appear to be equally, or almost equally, reasonable.' Popper draws out the general lesson: 'Kant showed that the metaphysical principle of reasonableness or self-evidence does not lead unambiguously to one and only one result or theory. It is always possible to argue, with similar apparent reasonableness, in favour of a number of different theories, and even of opposite theories.' What breaks a tie between two plausible-sounding theories is never more reasoning of the same kind -- it's something reasonableness alone can't supply. 'If we get no help from experience, if we cannot make experiments or observations which at least tell us to eliminate certain theories... then we have no hope of ever settling the claims of competing theories.' Diagnostic move: when a debate has stalled between two positions that each sound equally sensible, check whether anyone has proposed an observation, test, or experience capable of eliminating one of them. If the entire case on both sides rests on how reasonable it sounds, expect the stalemate to hold indefinitely -- reasonableness was never going to be the kind of thing that narrows the field, no matter how much longer the argument runs."
