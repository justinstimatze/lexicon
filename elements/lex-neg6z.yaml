id: lex-neg6z
name: what-a-selection-process-discards-can-outperform-what-it-kept
type-in: situation
type-out: warning
_tier: atomic
agent-instruction: "A selection process that consistently discards a category of output as inferior is not thereby proven right about that output's quality -- the discarding criterion may be tracking something other than quality, and the discarded material can turn out to be better than what was kept, once someone judges it outside the context that threw it away. Cage's anecdote from Silence makes the point in miniature: 'George Mantor had an iris garden, which he improved each year by throwing out the commoner varieties. One day his attention was called to another very fine iris garden. Jealously he made some inquiries. The garden, it turned out, belonged to the man who collected his garbage.' Every year of careful curation had been reliably feeding a better garden than the curator's own -- built entirely from what he'd personally rejected. Hyde draws the general lesson: 'Every category must have its rubbish heap. For the classic sensibility, the problem is to keep the rubbish at a distance, for difficulties will arise if it returns, especially if it comes back with a plausible claim to having been falsely excluded to begin with. If the irises in the garbage are beautiful, then beauty itself is contingent, and not some still point in eternity.' The gardener's rejection criterion wasn't measuring the flowers' actual quality; it was measuring conformity to his own established standard, and 'commoner' was doing work that had nothing to do with 'worse.' Diagnostic move: when a process routinely discards something as inferior, don't treat the discarding as settled evidence of inferiority -- ask what the selection criterion is actually tracking, and consider that the discard pile, judged on its own terms by someone outside the selecting context, might reveal the criterion was never measuring quality at all."
