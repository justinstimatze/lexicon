id: lex-7xkkf
name: earned-prosperity-erodes-once-the-practice-that-generated-it-is-neglected
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A good outcome that was built by a specific maintained practice doesn't persist as a permanent, unconditional state once the beneficiary stops doing the thing that produced it — and the beneficiary often keeps expecting the outcome to continue anyway, having mistaken the practice's product for a fixed possession. In the Jataka's tale of the wise king's questions, several petitioners along a road ask why their former prosperity has dried up, and the king's answer follows the same shape each time: 'Formerly these men used to do all the duties of the ascetic, and they induced the mystic trance. Now they have neglected the ascetic's duties, and they do what they ought not to do; the fruits which grow in the park they give to their attendants; they live in a sinful way, exchanging their alms.' The prosperity was never separate from the practice. It was the practice's output, quietly withdrawn the moment the practice stopped."
related: []
evokes: [jataka, tikanipata, gamani-canda-jataka, a-maintained-practice-produces-prosperity-that-neglect-quietly-withdraws, mistaking-a-practices-product-for-a-permanent-possession]
lineage:
  - source: primary
    text: jataka-chalmers1895-gamani-canda-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. II, trans. W. H. D. Rouse, ed. E. B. Cowell (Cambridge University Press, 1895), Book III (Tikanipata), No. 257, Gamani-canda-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "Formerly these men used to do all the duties of the ascetic, and they induced the mystic trance. Now they have neglected the ascetic's duties, and they do what they ought not to do; the fruits which grow in the park they give to their attendants; they live in a sinful way, exchanging their alms"
canonical-instances:
  - "A sales rep who built a strong pipeline through daily prospecting stops the routine once the pipeline is full, then wonders months later why deals have dried up, never having connected the earlier prosperity to the specific habit that generated it rather than to some fixed level of skill or reputation."
critical-questions:
  - "Is the connection between the neglected practice and the lost prosperity always this clean, or does the story's repetition of the same explanation four times over-flatten cases where a decline actually has multiple, harder-to-diagnose causes?"
  - "How would someone benefiting from a maintained practice actually notice they've started neglecting it, if the resulting decline only becomes visible well after the neglect began?"
status: active
