id: lex-pktye
name: gross-level-familiarity-with-a-phenomenon-forecloses-inquiry-into-its-mechanism
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "When everyone already 'knows' that some phenomenon happens, don't mistake that commonsense familiarity for actual understanding of how or why it happens — the two are entirely separable, and the first routinely suppresses curiosity about the second for a very long time before anyone notices the gap. Merton names this pattern directly: 'The annals of science — physical, biological, and social — are crowded with instances of the premature suspension of curiosity because a commonsense knowledge of gross phenomena had precluded interest in the mechanisms through which these phenomena came to be.' His worked example, via Köhler, is memory: 'everyone knows that we come to forget many experiences, and many take it for granted that this decay of memory is simply the result of passage of time. Yet recent experimental work in psychology has shown how much more complex are the processes which make for faulty memory; that forgetting is less a case of old experience fading from memory than of \"the interference, inhibition, or obliteration of the old by the new.\"' The gross-level fact ('we forget things') was true and universally known for as long as anyone could remember, and its very obviousness is what let a wrong folk-mechanism ('it just fades with time') stand unquestioned for generations — the wrong mechanism didn't need to be argued for, because no one thought there was a live question to argue about. Merton draws the general lesson explicitly: 'it is the office of systematic study to question the \"self-evident\" commonplaces of human experience and to show, often if not invariably, that these are not what they seem.' Diagnostic move: when a phenomenon feels too obvious to need explaining — everyone has always known it happens — treat that very obviousness as a warning sign rather than a reason to stop looking, and separately ask two questions that gross-level familiarity conflates: 'do I know THAT this happens' (usually yes, and usually has been known for a very long time) and 'do I know HOW or WHY it happens' (often no, and often nobody thought to ask, precisely because the first question already felt fully answered)."
