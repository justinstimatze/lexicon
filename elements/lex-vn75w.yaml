id: lex-vn75w
name: score-why-someone-left-and-why-they-return-as-independent-questions
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When someone who once defected from you wants to come back, don't let a sympathetic reason for their original departure carry over into an assumption that their reason for returning now is equally sympathetic -- Kautilya treats leaving-motive and returning-motive as two separate variables that must each be scored on their own merits, producing four distinct classes rather than a single good/bad spectrum: 'There are four classes of treaty-violators returning: (i) One who leaves for good reasons and also returns for good reasons... (ii) One who leaves and also returns for no reason: A fickle person who ignores the virtues of both the king and the enemy and leaves or returns for his own ignoble reasons... (iii) One who leaves for good reasons but returns for no reason: one who leaves because of some fault of the king but returns for his own reasons [on behalf of the enemy, to seek revenge, due to fear or for the sake of old loyalty]... (iv) One who leaves for no reason but returns for good reasons: Returning because of the enemy's faults is coming back for a good reason.' The prescribed response then tracks the two-axis grid rather than either axis alone: 'The king shall make peace [and renegotiate a treaty] with one (i) who left for good reasons and also returns for good reasons... The king shall refuse to renegotiate with one (i) who left and returns for no reason...' Category (iii) is the case the two-axis framework exists to catch: someone with an entirely legitimate original grievance (the king's own fault) who is nonetheless coming back for reasons that have nothing to do with reconciliation -- revenge, fear, a change in the enemy's fortunes, or covert instructions -- and a one-axis evaluation ('they had good reason to leave, so welcome them back') would wave this person straight through on the strength of a justification that has no bearing on their current intent. The reverse case matters equally: someone who left for a petty or self-interested reason (no sympathy owed) can still be returning now for a genuinely good one (recognizing the enemy's faults), and refusing them on the strength of their original departure ignores real information about their present state. Diagnostic move: when assessing whether to re-trust someone who previously left, resist collapsing 'why did they leave' and 'why are they coming back now' into a single trustworthiness verdict -- evaluate each independently, because a justified departure says nothing about present intent, and an unjustified departure says nothing about whether the return is genuine."
related: [lex-g294v]
evokes: [two-independent-axes-of-trust, leaving-motive-and-return-motive-are-separate, kautilya-four-classes-of-returnee, good-departure-does-not-imply-good-return]
lineage:
  - source: primary
    text: kautilya-arthashastra-four-classes-of-treaty-violators-returning
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part X 'Foreign Policy,' section 'Treaties,' 'Renegotiation of Treaties,' 'Aspects of Renegotiation,' {from 7.6.23-28}."
    quote: "'There are four classes of treaty-violators returning: (i) One who leaves for good reasons and also returns for good reasons: The good reasons for leaving are the fault of the king or the virtues of the enemy, and the good reasons for coming back are the virtues of the king or the faults of the enemy. (ii) One who leaves and also returns for no reason: A fickle person who ignores the virtues of both the king and the enemy and leaves or returns for his own ignoble reasons. (iii) One who leaves for good reasons but returns for no reason: one who leaves because of some fault of the king but returns for his own reasons [on behalf of the enemy, to seek revenge, due to fear or for the sake of old loyalty]. (iv) One who leaves for no reason but returns for good reasons: Returning because of the enemy's faults is coming back for a good reason.'"
  - source: primary
    text: kautilya-arthashastra-analysis-of-returnee-classes
    citation: "Kautilya, The Arthashastra (Rangarajan, 1992), Part X, section 'Treaties,' 'Aspects of Renegotiation,' 'Analysis of the Situations,' {from 7.6.24-29,32}."
    quote: "'The king shall make peace [and renegotiate a treaty] with one (i) who left for good reasons and also returns for good reasons and (ii) who has harmed the enemy. The king shall refuse to renegotiate with one (i) who left and returns for no reason and (ii) who has harmed the king.'"
canonical-instances:
  - "An employee who quit a company for a legitimate reason (being passed over unfairly for a promotion) asks to come back after the market for their skills has collapsed, and the hiring manager, instead of assuming the original grievance still vouches for their sincerity, separately investigates whether they're returning out of genuine renewed commitment or purely because no better option currently exists -- the same person who was right to leave the first time might be returning for reasons that predict they'll leave again the moment conditions change."
  - "A political party welcomes back a defector who left over a genuine policy disagreement, but only after separately confirming the defector isn't returning simply because their new party's prospects have collapsed -- treating the original, legitimate reason for leaving as sufficient proof of a genuine, principled return would ignore that the current motive could be pure opportunism unrelated to the original disagreement being resolved."
critical-questions:
  - "how reliably can an outside party actually distinguish a genuine change-of-heart return (category iv or the good half of category i) from a purely opportunistic one (the ignoble half of category ii or iii) when the returnee has every incentive to describe their motives in the most sympathetic available terms -- does the framework supply any real evidentiary test beyond the king's own judgment call?"
  - "does treating leaving-motive and returning-motive as fully independent variables risk missing genuine correlation between them -- might someone who left for principled reasons be, on average, more likely to return for principled ones too, making the four-class grid a useful checklist but a poor guide to actual base rates?"
  - "in category (iii), the framework asks the king to analyze motives that are by definition hidden (revenge, fear, covert instruction, old loyalty) -- what observable evidence could distinguish these from each other in practice, and does the elaborate four-way taxonomy risk producing an illusion of rigor around a judgment that is ultimately still a guess?"
status: active
