    text: hyde-serrano-and-helms-jointly-enact-one-unconscious-ritual-drama
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 8, '\"Matter Out of Place,\"' section '\"Democratic Carnival,\"' on the 1989 controversy over Andres Serrano's Piss Christ and Senator Jesse Helms's response. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In this light, the whole public uproar around Serrano’s photograph begins to look like homemade ritual for a land without carnival. First we have the transgressive artist symbolically sullying the god, and then Senator Jesse Helms and his friends drawing the line and insisting the dirt be carried out of town. It takes both sides to enact this drama, of course. The team of Serrano & Helms finds the dying god abandoned in the five ‘n’ dime, exposes him to gross impurity, then raises him up again, newly clean, newly powerful."
canonical-instances:
  - "A tech company ships a deliberately provocative feature and a wave of public backlash forces its removal; read separately, it's a product misstep followed by consumer pressure, but read together the launch-then-recall sequence performs the same function a company's internal review process failed to perform on its own -- the public supplied the friction the org chart didn't."
  - "An artist stages a boundary-pushing exhibit and a censorious critic campaigns to shut it down; both insist they are enemies with nothing in common, but the exhibit-then-censorship sequence is the only way, in a culture with no shared ritual for testing where its boundaries actually are, that the boundary gets tested at all."
critical-questions:
  - "Is 'co-enactment' a real, testable structural claim, or is it a storytelling frame applied after the fact to any conflict that happens to have a provocateur and a moralizing opponent, which would make it unfalsifiable rather than diagnostic?"
  - "Does describing two genuinely opposed actors as 'a team' risk understating real asymmetries of power and harm between them -- an artist facing federal defunding and a senator using the controversy to build a donor base are not equally positioned, whatever ritual shape their conflict traces?"
  - "If the ritual-shape reading is correct, does recognizing it change anything practically, or is it purely descriptive -- would either side act differently if they accepted they were 'co-enacting a drama' rather than genuinely opposing each other?"
